  - number: '6'
    text: |-
      1 De Minister van Financiën van Aruba, Curaçao onderscheidenlijk Sint Maarten, stelt voor een persoonsregistratie
      als bedoeld in dit hoofdstuk een reglement vast.

      2 In het reglement worden het doel en de werking van de persoonsregistratie beschreven.

      3 Het reglement bevat in elk geval een duidelijke regeling van de volgende onderwerpen:

      a. de categorieën personen over wie gegevens in de registratie worden opgenomen;

      b. de soorten van gegevens die in de registratie worden opgenomen, en de wijze waarop deze worden verkregen;

      c. de gevallen waarin gegevens worden verwijderd;

      d. de rechtstreekse toegang tot de registratie;

      e. de wijze waarop geregistreerde personen of hun wettelijke vertegenwoordigers kennisneming en verbetering van de
      over hen opgenomen gegevens kunnen verkrijgen;

      f. de wijze waarop geregistreerde personen of hun wettelijke vertegenwoordigers mededeling van verstrekking van hen
      betreffende gegevens kunnen verkrijgen.

      4 Onverminderd de aanspraken op grond van andere wettelijke regels, heeft degene die schade lijdt doordat ten
      opzichte van hem in strijd wordt gehandeld met de bij of krachtens dit hoofdstuk gegeven voorschriften ter
      bescherming van de belangen van geregistreerde of te registreren personen, voor nadeel dat niet in vermogensschade
      bestaat, recht op een naar billijkheid vast te stellen schadevergoeding.

      5 De douane-administratie is aansprakelijk voor de schade of het nadeel, voortvloeiende uit het niet-nakomen van de
      in het vierde lid bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 De douane-administraties verstrekken elkaar, op verzoek of uit eigen beweging, informatie om het bereiken van de
      in [artikel 2, eerste lid][ref1], genoemde doeleinden te bevorderen.

      2 Indien de aangezochte douane-administratie niet beschikt over de informatie waar om wordt verzocht, stelt
      zij een onderzoek in om die informatie te verkrijgen. Zij is bevoegd daartoe de handelingen te verrichten die
      haar ten behoeve van de toepassing van, en de voorkoming, opsporing en bestrijding van inbreuken op, de eigen
      douanewetgeving, onderscheidenlijk ten behoeve van de invordering van eigen douanevorderingen, ter beschikking
      staan.

      3 Indien aan het verzoek kan worden voldaan op grond van een andere wettelijke regeling inzake samenwerking tussen
      de landen, geeft de aangezochte douane-administratie aan welke andere autoriteiten daarbij betrokken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010576#Artikel2
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010576
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Op verzoek verstrekt de aangezochte douane-administratie in het bijzonder de volgende informatie:

      a. of goederen die in het grondgebied van het land van de verzoekende douane-administratie zijn binnengebracht
      rechtmatig het grondgebied van het land van de aangezochte douane-administratie hebben verlaten;

      b. of goederen die het grondgebied van het land van de verzoekende douane-administratie hebben verlaten
      rechtmatig in het grondgebied van het land van de aangezochte douane-administratie zijn binnengebracht en welke
      douanebestemming eventueel aan de goederen is gegeven;

      c. of goederen een bepaalde herkomst of oorsprong hebben.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel8
  - number: '9'
    text: |-
      De douane-administratie verstrekt, op verzoek of uit eigen beweging, de douane-administratie van een ander land
      van het Koninkrijk verslagen, bewijsmiddelen, gewaarmerkte afschriften van documenten of andere gegevensdragers die
      informatie bevatten over gedragingen die een inbreuk behelzen of kunnen behelzen.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Op verzoek oefent de aangezochte douane-administratie bijzonder toezicht uit op:

      a. goederen waarvan de verzoekende douane-administratie weet of vermoedt dat deze illegaal naar het grondgebied van
      haar land worden of zullen worden vervoerd;

      b. plaatsen waar voorraden goederen zijn aangelegd waarvan de verzoekende douane-administratie weet of vermoedt dat
      zij worden of zullen worden gebruikt voor een inbreuk op het grondgebied van haar land;

      c. vervoermiddelen en bergingsmiddelen waarvan de verzoekende douane-administratie weet of vermoedt dat zij worden
      of zullen worden gebruikt voor een inbreuk;

      d. bewegingen, in het bijzonder het binnenkomen in en het verlaten van het grondgebied van haar land, van personen
      waarvan de verzoekende douane-administratie weet of vermoedt dat deze betrokken zijn of zullen zijn bij een
      inbreuk.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 Op verzoek kunnen ambtenaren die daartoe door de verzoekende douane-administratie speciaal zijn aangewezen, met
      toestemming van de aangezochte douane-administratie en onder door deze te stellen voorwaarden, ten behoeve van een
      onderzoek naar een inbreuk:

      a. in de douanekantoren van de aangezochte douane-administratie documenten, gegevensbestanden en andere gegevens
      raadplegen teneinde daaruit de informatie te selecteren die van belang is voor het onderzoek naar die inbreuk;

      b. aldaar afschriften maken van documenten, gegevensbestanden en andere gegevens die van belang zijn met betrekking
      tot die inbreuk;

      c. aanwezig zijn tijdens enig onderzoek;

      d. de uitkomsten van een onderzoek als bedoeld in onderdeel c, alsmede alle overige informatie verkregen in het
      kader van het onderzoek, mededelen aan hun douane-administratie.

      2 Tijdens hun verblijf op het grondgebied van een ander land van het Koninkrijk dienen de in het eerste lid
      bedoelde ambtenaren zich te allen tijde te kunnen legitimeren.Tijdens hun optreden ingevolge het eerste lid staan
      zij onder gezag van de aangezochte douane-administratie. Zij worden wat betreft de toepasselijkheid van de strafwet
      terzake van strafbare feiten tegen het openbaar gezag gelijk gesteld met ambtenaren van het land waar zij ingevolge
      dit artikel aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Op verzoek stelt de aangezochte douane-administratie haar ambtenaren in de gelegenheid om als deskundige of getuige
      te verschijnen voor een gerecht van een ander land van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 Een verzoek om bijstand ter daadwerkelijke invordering van douanevorderingen gaat vergezeld van:

      a. de executoriale titel tegen degene te wiens laste invordering wordt verzocht;

      b. een verklaring omtrent het al of niet onherroepelijk vaststaan van de douanevordering;

      c. een verklaring omtrent de mogelijkheden tot invordering op het grondgebied van het land van de verzoekende
      douane-administratie;

      d. andere stukken en informatie welke van nut kunnen zijn.

      2 De betekening van de executoriale titel, het bevel tot betaling en de tenuitvoerlegging geschieden overeenkomstig
      de in het land van de aangezochte douane-administratie van kracht zijnde wettelijke bepalingen met betrekking tot
      bij regeling van de Minister van Financiën van dat land als soortgelijk aangemerkte douanevorderingen.

      3 Zolang geen verklaring is ingekomen dat de douanevordering onherroepelijk vaststaat, beperkt de aangezochte
      douane-administratie zich tot maatregelen om de inning van de douanevordering te verzekeren.

      4 De douanevorderingen worden in het land van de aangezochte douane-administratie niet als bevoorrechte vorderingen
      beschouwd.

      5 De aangezochte douane-administratie is niet verplicht aan het verzoek te voldoen indien de mogelijkheden tot
      invordering op het grondgebied van het land van de verzoekende douane-administratie niet zijn uitgeput.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 De douane-administraties brengen elkaar voor verleende bijstand geen kosten in rekening, met uitzondering van
      de kosten en honoraria betaald aan deskundigen en getuigen, alsmede de kosten van tolken en vertalers die niet in
      overheidsdienst zijn, welke kosten en honoraria zullen worden betaald door de verzoekende douane-administratie.

      2 Indien een verzoek aanzienlijke en buitengewone kosten meebrengt of zal meebrengen, voeren de douane-
      administraties overleg over de wijze waarop het verzoek zal worden uitgevoerd en de kosten zullen worden gedragen.

      3 De niet-verhaalbare kosten van de invordering worden vergoed door het land van de verzoekende douane-
      administratie.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel14
  - number: '15'
    text: |-
      1 Bijstand op grond van deze rijkswet wordt rechtstreeks tussen de douane-administraties verleend.

      2 Verzoeken om bijstand op grond van deze rijkswet worden schriftelijk gedaan en gaan vergezeld van de daartoe
      nuttig geachte informatie. Indien de omstandigheden daartoe nopen, kan een verzoek ook mondeling worden gedaan. Een
      dergelijk verzoek wordt onverwijld schriftelijk bevestigd.

      3 Verzoeken om bijstand op grond van deze rijkswet bevatten ten minste de volgende informatie:

      a. de naam van de verzoekende douane-administratie;

      b. het voorwerp van en de reden voor het verzoek;

      c. een korte beschrijving van de feiten, de juridische elementen en de aard van het onderzoek;

      d. de namen en adressen van de betrokken personen, voorzover deze bekend zijn.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel15
  - number: '16'
    text: |-
      1 De douane-administratie van een land kan weigeren gevolg te geven aan een verzoek om bijstand op grond van
      deze rijkswet indien door het verlenen van de gevraagde bijstand een industrieel geheim, een handelsgeheim of een
      beroepsgeheim zou worden geschonden.

      2 Indien een verzoekende douane-administratie niet in staat zou zijn om harerzijds aan een soortgelijk verzoek om
      bijstand van de douane-administratie van een ander land van het Koninkrijk gevolg te geven, vermeldt zij dat in
      haar verzoek. Het staat de aangezochte douane-administratie vrij om aan een dergelijk verzoek gevolg te geven.

      3 Weigering om aan een verzoek te voldoen wordt steeds met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel16
  - number: '17'
    text: |-
      1 Na overleg tussen de Ministers van Financiën van de landen, worden bij ministeriële regeling nadere regels
      gesteld voor de toepassing van deze rijkswet.

      2 De ministeriële regeling, bedoeld in het eerste lid, vermeldt in ieder geval:

      a. de instanties die in de onderscheiden landen met de uitvoering van deze rijkswet zijn belast;

      b. de wetten, landsverordeningen en andere regelingen waarin aan de douane-administraties van de onderscheiden
      landen controle- en opsporingstaken zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel18
  - number: '19'
    text: 'Deze rijkswet wordt aangehaald als: Rijkswet administratieve bijstand douane.'
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel19
