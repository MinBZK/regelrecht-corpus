  - number: '4'
    text: |-
      Dit hoofdstuk is slechts van toepassing in Aruba, Curaçao en Sint Maarten. Het geldt tot het tijdstip waarop
      in Aruba, Curaçao, onderscheidenlijk Sint Maarten, een landsverordening in werking treedt waarbij algemene,
      onderscheidenlijk nadere, regels worden gesteld ter bescherming van de persoonlijke levenssfeer in verband met
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd [artikel 3][ref1] mogen voor de toepassing van deze rijkswet de in een persoonsregistratie opgenomen
      persoonsgegevens slechts worden gebruikt voorzover die gegevens:

      a. rechtmatig zijn verkregen en in overeenstemming zijn met de in [artikel 2, eerste lid][ref2], genoemde
      doeleinden;

      b. nauwkeurig zijn en, zo nodig, zijn bijgewerkt;

      c. toereikend, terzake dienend en niet overmatig zijn, uitgaande van de in [artikel 2, eerste lid][ref3], genoemde
      doeleinden;

      d. zodanig zijn bewaard dat de betrokkene hierdoor niet langer te identificeren is dan strikt noodzakelijk is voor
      de in [artikel 2, eerste lid][ref4], genoemde doeleinden.

      2 Persoonsgegevens die betrekking hebben op godsdienst of levensovertuiging, ras, politieke gezindheid,
      seksualiteit, intiem levensgedrag, of op grond van medische of psychologische kenmerken, worden slechts opgenomen
      in aanvulling op andere persoonsgegevens en voorzover het voor de in [artikel 2, eerste lid][ref5], genoemde
      doeleinden onvermijdelijk is.

      3 Er worden passende beveiligingsmaatregelen getroffen om persoonsgegevens die zijn opgenomen in geautomatiseerde
      bestanden te beschermen tegen toevallige of ongeoorloofde vernietiging, toevallig verlies en ongeoorloofde toegang,
      wijziging of verspreiding.

      4 Een ieder kan:

      a. de douane-administratie verzoeken om hem uitsluitsel te geven over de vraag of door haar persoonsgegevens over
      hem zijn opgenomen en, indien dat het geval is, om hem die gegevens in begrijpelijke vorm mee te delen;

      b. na ontvangst van een mededeling omtrent hem betreffende persoonsgegevens als bedoeld in onderdeel a, de douane-
      administratie schriftelijk verzoeken die gegevens te verbeteren, aan te vullen of te verwijderen.

      5 De douane-administratie kan weigeren aan een in het vierde lid, onderdeel a, bedoeld verzoek te voldoen,
      voorzover dit noodzakelijk is voor:

      a. de veiligheid van het land;

      b. de opsporing en vervolging van strafbare feiten;

      c. de economische en financiële belangen van het land en andere openbare lichamen;

      d. de inspectie, de controle en het toezicht door of vanwege overheidsorganen of andere organen met een
      publiekrechtelijke taak.

      6 De douane-administratie:

      a. geeft het in het vierde lid, onderdeel a, bedoelde uitsluitsel en doet de aldaar bedoelde mededeling binnen vier
      weken na ontvangst van het in dat lid bedoelde verzoek;

      b. bericht binnen acht weken na ontvangst van het verzoek, bedoeld in het vierde lid, onderdeel b, de verzoeker
      schriftelijk of, dan wel in hoeverre, zij aan het verzoek voldoet.

      7 Een weigering om aan het verzoek, bedoeld in het vierde lid, onderdeel b, te voldoen is met redenen omkleed.

      8 De douane-administratie draagt er zorg voor dat een beslissing tot verbetering, aanvulling of verwijdering zo
      spoedig mogelijk wordt uitgevoerd.


