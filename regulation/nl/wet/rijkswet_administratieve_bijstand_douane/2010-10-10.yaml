preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen als bedoeld in artikel 38, eerste
    en tweede lid, van het Statuut voor het Koninkrijk inzake de administratieve bijstand tussen de landen van het
    Koninkrijk op het gebied van de douane en inzake de heffing en de invordering van accijnzen, omzetbelasting,
    algemene bestedingsbelasting en belasting op bedrijfsomzetten;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze rijkswet wordt verstaan onder:

      a. land: Nederland, Aruba, Curaçao, onderscheidenlijk Sint Maarten;

      b. douanewetgeving: de bij wet of landsverordening en de daarop berustende bepalingen vastgestelde regels van ieder
      van de landen inzake de in-, uit- en doorvoer van goederen, met inbegrip van de regels inzake verboden, beperkingen
      en toezicht op het vervoer van aan regulering onderworpen goederen over de landsgrenzen heen, alsmede inzake de
      heffing van accijnzen, omzetbelasting, belasting op bedrijfsomzetten, dan wel soortgelijke indirecte belastingen;

      c. inbreuk: ieder handelen of nalaten in strijd met de douanewetgeving;

      d. douanerechten: de rechten, heffingen en restituties terzake van in-, uit- en doorvoer van goederen, alsmede
      accijnzen, omzetbelasting, belasting op bedrijfsomzetten, dan wel soortgelijke indirecte belastingen;

      e. douanevordering: een bedrag aan verschuldigde douanerechten, administratieve boeten, vervolgingskosten en
      interest;

      f. douane-administratie: de centrale autoriteit die in een land belast is met de tenuitvoerlegging van de
      douanewetgeving, onderscheidenlijk de invordering van douanevorderingen;

      g. informatie: inlichtingen, bescheiden en andere gegevens;

      h. persoon: een natuurlijke persoon of rechtspersoon;

      i. persoonsgegevens: informatie betreffende een geïdentificeerde of identificeerbare natuurlijke persoon;

      j. persoonsregistratie: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsgegevens, die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van
      die gegevens systematisch is aangelegd.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 De douane-administraties verlenen elkaar administratieve bijstand onder de in deze rijkswet genoemde voorwaarden
      teneinde een juiste toepassing van de douanewetgeving en een juiste invordering van douanevorderingen te
      verzekeren, alsmede inbreuken te voorkomen, op te sporen en te bestrijden.

      2 Alle administratieve bijstand door één van de douane-administraties wordt verleend binnen de grenzen van haar
      wettelijke bevoegdheden en de haar ter beschikking staande middelen.
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Informatie die in het kader van deze rijkswet wordt ontvangen wordt slechts gebruikt voor de in
      [artikel 2, eerste lid][ref1], genoemde doeleinden en mag slechts worden overgedragen aan andere douane-
      autoriteiten van het ontvangende land.

      2 In bijzondere gevallen mag de informatie worden gebruikt voor andere doeleinden, dan wel door andere
      autoriteiten, mits de verstrekkende douane-administratie schriftelijk uitdrukkelijk heeft ingestemd met een
      zodanig gebruik. Overdracht van informatie aan het openbaar ministerie of aan de rechterlijke autoriteiten vindt
      slechts plaats met toestemming van het openbaar ministerie dan wel de rechterlijke autoriteiten in het land van de
      verstrekkende douane-administratie.

      3 Op verzoek van de verstrekkende douane-administratie verschaft de ontvangende douane-administratie inlichtingen
      over het gebruik dat van de ontvangen informatie is gemaakt en de daarmede bereikte resultaten.

      4 Informatie die in het kader van deze rijkswet wordt ontvangen is onderworpen aan dezelfde regels voor
      geheimhouding als welke gelden voor soortgelijke informatie in het land van de ontvangende douane-administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0010576#Artikel2
    url: https://wetten.overheid.nl/BWBR0010576/2010-10-10#Artikel3
