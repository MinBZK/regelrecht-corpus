articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - het Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - de Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Organisatie en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Organisatie en Bedrijfsvoering Rijk, genoemd in het
      [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '3'
    text: |-
      1 Het Bureau Directeur-Generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het coördineren van de beleidsprocessen en het ondersteunen van de bestuursprocessen;

      b. het ontwikkelen van de kaderstelling op DG-niveau;

      c. het uitvoeren van de integrale control (beleids- en PIOFACH-control);

      d. het adviseren ten aanzien van het strategische beleid;

      e. het ondersteunen van het opdrachtgeverschap Staf;

      f. het ondersteunen van het eigenaarschap van de agentschappen CAS, P-Direkt en Werkmaatschappij.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel3
  - number: '4.1'
    text: |-
      De directie Personeel, Organisatie en Informatie Rijk bestaat uit de volgende onderdelen:

      a. de Directiestaf (DS);

      b. de afdeling Arbeidsvoorwaarden (AV);

      c. de afdeling Arbeidskwaliteit (AK);

      d. de afdeling Organisatie (O);

      e. de afdeling Informatie (I);

      f. het Programmabureau Vernieuwing HRM-stelsel RIJK (HRM).
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 De Directiestaf staat onder leiding van de directeur.

      2 De Directiestaf heeft de volgende taken:

      a. het aangeven van de strategische lijn en het bewaken van de samenhang van het beleid van de directie;

      b. het onderhouden van de externe relaties met (P)SG-beraad, IG-beraad, ICPR en IODI;

      c. het zorgdragen voor de stafverbindingen en beheer.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 De afdeling Arbeidsvoorwaarden staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor de primaire en secundaire arbeidsvoorwaarden bij het Rijk;

      b. de zorg voor de inactiviteitsregelingen voor het Rijk;

      c. de zorg voor het beloningsbeleid.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 De afdeling Arbeidskwaliteit staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het intern en extern bevorderen van de arbeidsmarktpositie van het Rijk;

      b. het zorgdragen voor het verhogen van de interdepartementale doorstroom van personeel;

      c. het bevorderen van het gebruik van eigen kwaliteit en capaciteit in de rijksdienst;

      d. het bevorderen van de ontwikkelingsmogelijkheden van medewerkers;

      e. het zorgdragen voor de toepassing van het integriteitsbeleid van het Rijk;

      f. het zorgdragen voor de toepassing van het arbeidsomstandighedenbeleid.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 De afdeling Organisatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen, implementeren, onderhouden en evalueren van een rapportagekader voor de departementale
      topstructuren en het adviseren over afzonderlijke departementale voorstellen betreffende de departementale
      inrichting en de topstructuren;

      b. het ontwikkelen, implementeren, onderhouden en evalueren van een rijksbrede concernvisie op de bedrijfsvoering
      en het bijdragen aan de voorbereiding van voorstellen tot verdere samenwerking en bundeling op dat terrein;

      c. het ontwikkelen, implementeren, onderhouden, evalueren van het verzelfstandigingbeleid en het toetsen van
      afzonderlijke verzelfstandigingvoorstellen;

      d. het ontwikkelen, implementeren, onderhouden, en evalueren van het toezichtbeleid en het adviseren over nieuwe
      ontwikkelingen op het terrein van het toezicht;

      e. het ontwikkelen, implementeren, onderhouden, en evalueren van het adviesstelsel en het toetsen van afzonderlijke
      voorstellen voor instelling van adviescolleges.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De afdeling Informatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het bevorderen van de doelmatigheid en de doeltreffendheid van de bedrijfsvoering bij het Rijk door de inzet
      van ICT;

      b. het daartoe bevorderen van de samenwerking tussen ministeries op het vlak van de ICT in de bedrijfsvoering;

      c. het optreden als opdrachtgever voor concernbrede ICT – voorzieningen.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het Programmabureau Vernieuwing HRM-stelsel RIJK staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het faciliteren en volgen van de uitvoering van departementale plannen ter verhoging van de kwaliteit van de
      HRM functie;

      b. het ondersteunen van de opdrachtgever ten aanzien van het inrichten van een Shared Service Center HRM;

      c. het uitvoeren van interdepartementaal onderzoek naar mogelijkheden voor de vorming van een Expertise- en
      Ontwikkelcentrum;

      d. het afronden van de pilot benchmarken.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel4.7
  - number: '5.1'
    text: |-
      1 De Werkmaatschappij staat onder leiding van een directeur.

      2 De Werkmaatschappij bestaat uit de volgende onderdelen:

      a. de Houdstermaatschappij;

      b. de Bedrijfseenheden.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel5.1
  - number: '5.2'
    text: |-
      Het onderdeel de Houdstermaatschappij heeft de volgende taken:

      a. het in opdracht van de onderdelen PIOFACH-taken inkopen en hierover dienstverleningsafspraken maken bij
      aannemers binnen de Rijksoverheid;

      b. het voorbereiden, uitvoeren en handhaven van kaders voor het dienstverleningspakket;

      c. het monitoren van de bedrijfsvoering aan de hand van controlrapportages;

      d. het opstellen van de financiële verantwoording van de Werkmaatschappij;

      e. het leveren van kennis op het gebied van bedrijfsvoering aan initiatieven tot interdepartementale samenwerking
      gericht op toetreding tot de Werkmaatschappij.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel5.2
  - number: '5.3'
    text: |-
      De Bedrijfseenheden hebben tot taak producten of diensten te leveren in structurele samenwerkingsverbanden tussen
      twee of meer departementen.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel5.3
  - number: '6'
    text: |-
      [Artikel 3.34 van het Organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3.34
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3.34'
  - number: '7'
    text: |-
      [Artikel 3.35 van het Organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3.35'
  - number: '8'
    text: |-
      Tot de taak van de dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan vermeld,
      in opdracht van de minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en regelgeving
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel8
  - number: '9.1'
    text: |-
      1 De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel9.1
  - number: '9.2'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel9.2
  - number: '10.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0023190/2008-09-01#Artikel10.1
  - number: '10.2'
    text: |-
