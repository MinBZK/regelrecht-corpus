  - number: '4'
    text: |-
      In het geval dat de toezichthouder heeft geconcludeerd dat de betrouwbaarheid niet (meer) buiten twijfel staat en
      uit de toezichtwet zelf geen directe consequenties voortvloeien, kan de toezichthouder gebruik maken van de hem
      ingevolge de toezichtwet toekomende bevoegdheden (bijvoorbeeld het geven van een aanwijzing, het niet verlenen c.q.
      intrekken van een vergunning).
    url: https://wetten.overheid.nl/BWBR0020318/2006-10-01#Artikel4
