preamble:
  text: |-
    Gelet op onder meer de artikelen 15 Wta en 5, 6, 7 Bta;

    Besluit als volgt:
  url: https://wetten.overheid.nl/BWBR0020318/2006-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder betrouwbaarheid wordt voor de toepassing van de toezichtwet verstaan het zich onthouden van één of meer
      gedragingen die naar het oordeel van de toezichthouder in de weg staan aan het vervullen van de functie van
      (mede)beleidsbepaler.

      2 Tot de in het eerste lid bedoelde gedragingen behoren in ieder geval gedragingen die blijk geven van het
      niet hebben van eigenschappen als waarheidslievendheid, verantwoordelijkheidszin, wetsgetrouwheid, openheid,
      oprechtheid, prudentie, punctualiteit, onkreukbaarheid, discretie en rechtschapenheid.
    url: https://wetten.overheid.nl/BWBR0020318/2006-10-01#Artikel1
  - number: '2'
    text: |-
      1 De beoordeling van de betrouwbaarheid geschiedt door op basis van voornemens, handelingen en antecedenten (hierna
      gezamenlijk te noemen: antecedenten) te toetsen of betrokkene blijk geeft of heeft gegeven van zodanige gedragingen
      dat daardoor naar het oordeel van de toezichthouder diens betrouwbaarheid niet (meer) buiten twijfel staat.

      2 De bij de beoordeling van de betrouwbaarheid in acht te nemen antecedenten zijn:

        - strafrechtelijke antecedenten ([bijlage A1][ref1] en [bijlage A2][ref2]);
        - financiële antecedenten ([bijlage B][ref3]);
        - toezichtantecedenten ([bijlage C][ref4]);
        - fiscaal bestuursrechtelijke antecedenten ([bijlage D][ref5]);
        - overige antecedenten ([bijlage E][ref6]).

      [Bijlage A2][ref7] bevat een limitatieve opsomming van antecedenten; de overige bijlagen zijn niet limitatief.

      3 Inzicht in de in het tweede lid genoemde antecedenten wordt verkregen door gebruik te maken van onder meer:

        - de door de (kandidaat)(mede)beleidsbepaler ingevulde vragenlijst volgens het door de toezichthouder vastgestelde
      model;
        - de mogelijkheid om bij de Landelijk Officier van Justitie gegevens uit politieregisters op te vragen;
        - uitspraken van tuchtrechtelijke instanties;
        - raadpleging van de database Vennoot ’98 van het Ministerie van Justitie;
        - raadpleging van het Nederlands Faillissementen Register;
        - raadpleging van de Belastingdienst;
        - gegevens of inlichtingen verkregen van Nederlandse overheidsinstanties dan wel van Nederlandse van overheidswege
      aangewezen instanties die op enigerlei wijze belast zijn met het toezicht op accountantsorganisaties in Nederland
      of op natuurlijke personen en rechtspersonen die bij die organisaties werkzaam zijn;
        - gegevens of inlichtingen verkregen van buitenlandse overheidsinstanties dan wel van buitenlandse van
      overheidswege aangewezen instanties die op enigerlei wijze belast zijn met het toezicht op accountantspraktijken in
      het buitenland of op natuurlijke personen en rechtspersonen die bij die accountantspraktijken werkzaam zijn;
        - ambtsberichten van het Openbaar Ministerie;
        - de accountantsregisters van het Koninklijk Nederlands Instituut voor Registeraccountants (NIVRA) en de
      Nederlandse Orde van Accountants-Administratieconsulenten (NOvAA);
        - referenties.


