  - number: '45'
    text: |-
      1 De eigenwoningbijdrage is niet vatbaar voor vervreemding, verpanding, belening, beslag of uitwinning en verhaal,
      behoudens dat beslag, verhaal en, in geval van verpanding, uitwinning is toegestaan met het oog op inning van de
      hypotheeklast.

      2 Elk beding, strijdig met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel45
  - number: '46'
    text: |-
      1 Degenen die tot het huishouden van de eigenaar-bewoner behoren zijn verplicht uit eigen beweging aan
      Onze Minister onmiddellijk alle inlichtingen te verstrekken waarover zij redelijkerwijs kunnen beschikken,
      en die redelijkerwijs van belang kunnen zijn voor de vaststelling van het recht op en de hoogte van de
      eigenwoningbijdrage.

      2 De in het eerste lid bedoelde personen zijn verplicht de in dat lid bedoelde gegevens desgevraagd te verstrekken
      aan Onze Minister en aan de door hem daartoe aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel46
  - number: '47'
    text: |-
      1 De financier, bedoeld in [artikel 42, eerste lid][ref1], is verplicht aan Onze Minister op diens verzoek
      onmiddellijk inlichtingen met betrekking tot de hypothecaire lening te verstrekken waarover hij redelijkerwijs kan
      beschikken, en die redelijkerwijs van belang kunnen zijn voor de vaststelling van het recht op en de hoogte van
      de eigenwoningbijdrage.

      2 Onze Minister stelt de eigenaar-bewoner in kennis van elke gegevensverstrekking als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel42
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '42'
        hoofdstuk: '7'
  - number: '49'
    text: |-
      Onze Minister kan de uitbetaling van de eigenwoningbijdrage geheel of gedeeltelijk opschorten als hij
      redelijkerwijs kan vermoeden dat ten onrechte of tot een te hoog bedrag een eigenwoningbijdrage is toegekend of dat
      niet langer is voldaan aan een eis voor de primaire toekenning.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel49
  - number: '50'
    text: |-
      1 Onze Minister kan de toekenning herzien:

      a. als niet langer wordt voldaan aan een eis voor de primaire toekenning;

      b. als de toekenning heeft plaatsgevonden in afwijking van deze wet of de daarop berustende bepalingen, of

      c. als [artikel 43, derde lid][ref1], of [46, tweede lid][ref2], niet wordt nageleefd.

      2 Aan een besluit als bedoeld in het eerste lid kan terugwerkende kracht worden verleend over ten hoogste vijf
      bijdragejaren, voorafgaande aan het lopende bijdragejaar:

      a. als gegevens die zijn verstrekt door degene die behoort tot het huishouden van de eigenaar-bewoner zodanig
      onjuist of onvolledig blijken te zijn geweest, dat een ander besluit zou zijn genomen indien de juiste of volledige
      gegevens bij Onze Minister bekend zouden zijn geweest;

      b. als [artikel 43, derde lid][ref3], of [46, tweede lid][ref4], niet wordt nageleefd, of

      c. als de eigenaar-bewoner redelijkerwijs had kunnen begrijpen dat de eigenwoningbijdrage ten onrechte of tot een
      te hoog bedrag is toegekend.

      3 Als het eerste lid toepassing vindt, is Onze Minister bevoegd tot terugvordering van de ten onrechte of teveel
      uitbetaalde eigenwoningbijdrage van de eigenaar-bewoner, of tot verrekening van die eigenwoningbijdrage met
      aanspraken op eigenwoningbijdragen van de eigenaar-bewoner.

      4 Onze Minister kan, als de herziening haar grond vindt in het feit dat het aanvraagformulier niet naar waarheid
      is ingevuld, dan wel [artikel 46][ref5] niet is nageleefd, het terug te vorderen bedrag verhogen met 25 procent,
      met dien verstande dat deze verhoging niet meer mag bedragen dan € 225 per bijdragejaar, waarover ten onrechte een
      eigenwoningbijdrage werd genoten. De verhoging kan worden betrokken bij een verrekening als bedoeld in het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0011919#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0011919#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0011919#Artikel46
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '43'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011919
        artikel: '46'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0011919
        artikel: '43'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0011919
        artikel: '46'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0011919
        artikel: '46'
        hoofdstuk: '8'
    machine_readable:
      untranslatables:
        - construct: >-
            terugvorderingsbedrag verhogen met 25 procent, niet meer dan
            € 225 per bijdragejaar (artikel 50, vierde lid)
          reason: >-
            Calculating the actual surcharge amount (25% of the recoverable amount,
            capped at €225 per bijdragejaar) requires knowing the total wrongfully
            paid amount and the number of bijdragejaren involved — both require
            aggregation over a collection which is not expressible in the engine.
            Only the boolean eligibility for the surcharge is modelled.
          suggestion: >-
            Provide the terugvorderingsbedrag and number of bijdragejaren as
            external inputs once aggregation operations are available in the engine
          legal_text_excerpt: >-
            het terug te vorderen bedrag verhogen met 25 procent, met dien
            verstande dat deze verhoging niet meer mag bedragen dan € 225 per
            bijdragejaar, waarover ten onrechte een eigenwoningbijdrage werd genoten
          accepted: false
      execution:
        produces:
          legal_character: TOETS
        parameters:
          - name: niet_meer_voldaan_aan_primaire_eis
            type: boolean
            required: true
            description: >-
              Niet langer wordt voldaan aan een eis voor de primaire toekenning
              (artikel 50 lid 1 sub a)
          - name: toekenning_in_afwijking_van_wet
            type: boolean
            required: true
            description: >-
              Toekenning heeft plaatsgevonden in afwijking van de wet of de
              daarop berustende bepalingen (artikel 50 lid 1 sub b)
          - name: inlichtingenplicht_niet_nageleefd
            type: boolean
            required: true
            description: >-
              Artikel 43, derde lid, of artikel 46, tweede lid, is niet nageleefd
              (artikel 50 lid 1 sub c)
          - name: verhoging_van_toepassing
            type: boolean
            required: true
            description: >-
              Is de grond voor herziening het niet naar waarheid invullen van het
              aanvraagformulier dan wel het niet naleven van artikel 46?
              (artikel 50 lid 4 — verhoogd terugvorderingsbedrag); geef false
              als de verhoging niet van toepassing is
        output:
          - name: herziening_mogelijk
            type: boolean
            description: >-
              Minister kan de toekenning herzien (artikel 50 lid 1; minimaal één
              van de herzieningsgronden is aanwezig)
          - name: verhoging_terugvordering
            type: boolean
            description: >-
              Terugvorderingsbedrag kan worden verhoogd met 25% (artikel 50 lid
              4); alleen van toepassing als herziening_mogelijk en
              verhoging_van_toepassing
        actions:
          - output: herzieningsgrond_aanwezig
            value:
              operation: OR
              conditions:
                - $niet_meer_voldaan_aan_primaire_eis
                - $toekenning_in_afwijking_van_wet
                - $inlichtingenplicht_niet_nageleefd
          - output: herziening_mogelijk
            value: $herzieningsgrond_aanwezig
          - output: verhoging_terugvordering
            value:
              operation: AND
              conditions:
                - $herzieningsgrond_aanwezig
                - $verhoging_van_toepassing
  - number: '51'
    text: |-
      1 Een bedrag als bedoeld in [artikel 50, derde en vierde lid][ref1], wordt ingevorderd door Onze Minister.

      2 Als de eigenaar-bewoner in gebreke blijft, kan de invordering van het verschuldigde bedrag, vermeerderd met de
      kosten van invordering, geschieden bij dwangbevel.

      3 De betekening en tenuitvoerlegging van het dwangbevel geschieden door de ontvanger van de belastingen, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref2], en door de belastingdeurwaarder,
      bedoeld in [artikel 2, eerste lid, onderdeel j, van die wet][ref3], met toepassing van de [artikelen 13][ref4]
      en [14 van die wet][ref5].

      4 Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref6], alsmede verrekenen op grond van [artikel 24 van die wet][ref7].

      5 Met betrekking tot het verzet tegen de tenuitvoerlegging van het dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref8] van overeenkomstige toepassing, met dien verstande dat in dat
      artikel in plaats van «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens moet worden gelezen: de met de
      tenuitvoerlegging van het dwangbevel belaste ontvanger.

      6 Met betrekking tot de kosten van aanmaning en verdere invordering zijn de [artikelen 6][ref9] en
      [7 van de Invorderingswet 1990][ref10] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel50
