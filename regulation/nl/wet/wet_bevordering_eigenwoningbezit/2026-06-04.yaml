    machine_readable:
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
            description: Burgerservicenummer van de eigenaar-bewoner
        input:
          - name: voldoet_bewoningseis
            type: boolean
            source:
              output: voldoet_bewoningseis
          - name: voldoet_vermogenseis
            type: boolean
            source:
              output: voldoet_vermogenseis
          - name: voldoet_leeftijdseis
            type: boolean
            source:
              output: voldoet_leeftijdseis
          - name: voldoet_eigenaareis
            type: boolean
            source:
              output: voldoet_eigenaareis
          - name: voldoet_koopsomeis
            type: boolean
            source:
              output: voldoet_koopsomeis
          - name: voldoet_nhg_eis
            type: boolean
            source:
              output: voldoet_nhg_eis
        output:
          - name: heeft_recht_op_eigenwoningbijdrage
            type: boolean
            description: >-
              Eigenaar-bewoner voldoet aan de voorwaarden van de wet en heeft
              recht op een eigenwoningbijdrage (artikel 6 lid 1)
        actions:
          - output: heeft_recht_op_eigenwoningbijdrage
            value:
              operation: AND
              conditions:
                - $voldoet_bewoningseis
                - $voldoet_vermogenseis
                - $voldoet_leeftijdseis
                - $voldoet_eigenaareis
                - $voldoet_koopsomeis
                - $voldoet_nhg_eis
  - number: '7'
    text: |-
      1 Behoudens in gevallen als bedoeld in [artikel 13][ref1] wordt een eigenwoningbijdrage slechts toegekend
      als degenen die tot het huishouden van de eigenaar-bewoner behoren, op de peildatum als ingezetene in de
      basisregistratie personen zijn ingeschreven met als adres het adres van de woning in verband met welke de
      eigenwoningbijdrage is aangevraagd.

      2 In afwijking van het eerste lid kan een eigenwoningbijdrage worden toegekend als de betrokkene met een ander
      adres in de basisregistratie personen is ingeschreven en dit niet aan hem kan worden toegerekend.

      3 Behoudens in gevallen als bedoeld in [artikel 13, eerste lid][ref2], wordt een eigenwoningbijdrage slechts
      toegekend als de eigenaar-bewoner op de peildatum woont in de woning in verband met welke de eigenwoningbijdrage
      is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel13
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011919
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
    machine_readable:
      execution:
        parameters:
          - name: peildatum
            type: date
            required: true
            description: Peildatum als bedoeld in artikel 1
          - name: huishouden_ingeschreven_op_adres_woning
            type: boolean
            required: true
            description: >-
              Alle leden van het huishouden zijn ingeschreven in de BRP op het
              adres van de woning op de peildatum (artikel 7, eerste lid)
          - name: eigenaar_bewoont_woning
            type: boolean
            required: true
            description: >-
              Eigenaar-bewoner woont op de peildatum in de woning waarvoor de
              bijdrage is aangevraagd (artikel 7, derde lid)
          - name: niet_inschrijving_niet_toerekenbaar
            type: boolean
            required: true
            description: >-
              Eventuele niet-inschrijving in BRP kan niet aan de betrokkene
              worden toegerekend (artikel 7, tweede lid); geef false als de
              uitzondering niet van toepassing is
        input:
          - name: artikel_13_van_toepassing
            type: boolean
            description: >-
              Uitzondering van artikel 13 is van toepassing (bewoning/inschrijving
              uitgesteld door geldige reden); bindt aan output artikel_13_van_toepassing
              van artikel 13 (artikel 7, eerste lid: 'behoudens in gevallen als
              bedoeld in artikel 13')
            source:
              output: artikel_13_van_toepassing
        output:
          - name: voldoet_bewoningseis
            type: boolean
            description: >-
              Voldaan aan de bewoning- en inschrijvingseis van artikel 7;
              of artikel 13 maakt artikel 7 niet van toepassing
        actions:
          - output: inschrijvingseis_voldaan
            value:
              operation: OR
              conditions:
                - $huishouden_ingeschreven_op_adres_woning
                - $niet_inschrijving_niet_toerekenbaar
          - output: bewoning_en_inschrijving_voldaan
            value:
              operation: AND
              conditions:
                - $inschrijvingseis_voldaan
                - $eigenaar_bewoont_woning
          - output: voldoet_bewoningseis
            value:
              operation: OR
              conditions:
                - $artikel_13_van_toepassing
                - $bewoning_en_inschrijving_voldaan
  - number: '9'
    text: |-
      Een eigenwoningbijdrage wordt niet toegekend als het toetsvermogen voor een eenpersoonshuishouden
      of een eenpersoonsouderenhuishouden meer bedraagt dan het eerstgenoemde drempelbedrag, genoemd
      in [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1], en voor een
      tweepersoonshuishouden of een tweepersoonsouderenhuishouden meer bedraagt dan het tweede genoemde drempelbedrag,
      genoemd in artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9.4a
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 9.4a
    machine_readable:
      execution:
        parameters:
          - name: toetsvermogen
            type: number
            required: true
            description: >-
              Toetsvermogen zoals bedoeld in artikel 4, eerste lid (in eurocent)
          - name: is_eenpersoonshuishouden
            type: boolean
            required: true
            description: >-
              Is het huishouden een eenpersoonshuishouden of
              eenpersoonsouderenhuishouden (artikel 2, derde lid, sub a of c)?
              Anders: tweepersoonshuishouden of tweepersoonsouderenhuishouden.
          - name: drempelbedrag_eenpersoon
            type: number
            required: true
            description: >-
              Drempelbedrag voor eenpersoons(ouderen)huishouden (artikel 9.4a,
              eerste lid, sub a, Wet inkomstenbelasting 2001, in eurocent)
          - name: drempelbedrag_tweepersoon
            type: number
            required: true
            description: >-
              Drempelbedrag voor tweepersoons(ouderen)huishouden (artikel 9.4a,
              eerste lid, sub a, Wet inkomstenbelasting 2001, in eurocent)
        output:
          - name: voldoet_vermogenseis
            type: boolean
            description: >-
              Toetsvermogen is niet hoger dan het toepasselijke drempelbedrag
              (artikel 9)
        actions:
          - output: toepasselijk_drempelbedrag
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_eenpersoonshuishouden
                    value: true
                  then: $drempelbedrag_eenpersoon
              default: $drempelbedrag_tweepersoon
          - output: voldoet_vermogenseis
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $toetsvermogen
              value: $toepasselijk_drempelbedrag
  - number: '10'
    text: |-
      1 Een eigenwoningbijdrage wordt slechts toegekend als, tot zekerheid van de nakoming door de eigenaar-bewoner van
      de verplichtingen uit hetzij de hypothecaire lening hetzij een daaropvolgende lening of daaropvolgend krediet in
      rekening-courant ter financiering van het in eigendom verkrijgen van een woning met als zekerheid hypotheek op die
      woning, voor die lening of dat krediet een garantie is afgegeven door de Stichting Waarborgfonds Eigen Woningen.

      2 De af te geven garantie is de garantie, bedoeld in [artikel 3, eerste lid][ref1]. De in dat artikellid bedoelde
      voorwaarden en normen voor die garantie zijn van toepassing, tenzij deze wet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel3
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
    machine_readable:
      execution:
        parameters:
          - name: nhg_garantie_afgegeven
            type: boolean
            required: true
            description: >-
              Voor de hypothecaire lening of het opvolgende krediet is een garantie
              afgegeven door de Stichting Waarborgfonds Eigen Woningen (artikel 10,
              eerste lid)
        output:
          - name: voldoet_nhg_eis
            type: boolean
            description: >-
              Voldaan aan de NHG-garantie-eis van artikel 10 (garantie afgegeven
              door de Stichting Waarborgfonds Eigen Woningen)
        actions:
          - output: voldoet_nhg_eis
            value: $nhg_garantie_afgegeven
  - number: '11'
    text: Voor een primaire toekenning is vereist dat de eigenaar-bewoner op de peildatum 18 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel11
    machine_readable:
      execution:
        parameters:
          - name: geboortedatum
            type: date
            required: true
            description: Geboortedatum van de eigenaar-bewoner
          - name: peildatum
            type: date
            required: true
            description: Peildatum (eerste dag van het bijdragejaar)
        output:
          - name: voldoet_leeftijdseis
            type: boolean
            description: >-
              Eigenaar-bewoner is op de peildatum 18 jaar of ouder (artikel 11)
        actions:
          - output: leeftijd_op_peildatum
            value:
              operation: AGE
              date_of_birth: $geboortedatum
              reference_date: $peildatum
          - output: voldoet_leeftijdseis
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject: $leeftijd_op_peildatum
              value: 18
  - number: '12'
    text: |-
      Voor een primaire toekenning is vereist dat de eigenaar-bewoner gedurende een tijdvak van ten minste drie jaar tot
      de datum van eigendomsoverdracht geen eigenaar is geweest van een woning waar hij zijn hoofdverblijf had.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel12
    machine_readable:
      untranslatables:
        - construct: >-
            gedurende een tijdvak van ten minste drie jaar tot de datum van
            eigendomsoverdracht geen eigenaar is geweest
          reason: >-
            Date difference calculation (period of at least 3 years before
            eigendomsoverdracht) is not expressible with available engine
            operations; requires DATE_DIFF or equivalent
          suggestion: >-
            Add DATE_DIFF operation to the engine, or resolve this via an
            external data source (kadaster history) providing a boolean
          legal_text_excerpt: >-
            gedurende een tijdvak van ten minste drie jaar tot de datum van
            eigendomsoverdracht geen eigenaar is geweest van een woning waar hij
            zijn hoofdverblijf had
          accepted: false
      execution:
        parameters:
          - name: heeft_geen_eigendom_drie_jaar
            type: boolean
            required: true
            description: >-
              Eigenaar-bewoner is gedurende ten minste drie jaar vóór de datum
              van eigendomsoverdracht geen eigenaar geweest van een woning met
              hoofdverblijf (te verifiëren via kadasterhistorie)
        output:
          - name: voldoet_eigenaareis
            type: boolean
            description: >-
              Voldaan aan de eigenaar-eis van artikel 12 (geen eigendom 3 jaar
              voor eigendomsoverdracht)
        actions:
          - output: voldoet_eigenaareis
            value: $heeft_geen_eigendom_drie_jaar
  - number: '13'
    text: |-
      1 Op een primaire toekenning is [artikel 7][ref1] niet van toepassing, voorzover de bewoning of de inschrijving in
      de gemeentelijke basisadministratie persoonsgegevens is uitgesteld:

      a. omdat een nieuwbouwwoning nog niet bewoonbaar is;

      b. omdat een bestaande woning nog door de vorige bewoner wordt bewoond, of

      c. omdat in een bestaande woning achterstallig onderhoud wordt verricht.

      2 In een geval als bedoeld in het eerste lid kan de eigenwoningbijdrage worden ingetrokken als de inschrijving of
      de bewoning niet heeft plaatsgevonden bij een situatie als bedoeld in onderdeel a van dat artikellid binnen negen
      maanden na de gereedgemelde woning of bij een situatie als bedoeld in de onderdelen b en c van dat artikellid
      binnen negen maanden na de peildatum. De intrekking vindt plaats met ingang van de eerste dag van de kalendermaand
      die volgt na de afloop van die termijn van negen maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel7
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
    machine_readable:
      execution:
        parameters:
          - name: vertraging_reden
            type: string
            required: true
            description: >-
              Reden voor vertraagde bewoning of inschrijving in BRP: 'nieuwbouw'
              (woning nog niet bewoonbaar, sub a), 'vorige_bewoner' (bestaande
              woning nog bewoond, sub b), 'achterstallig_onderhoud' (onderhoud
              in bestaande woning, sub c); geef 'geen' als artikel 13 niet van
              toepassing is (artikel 13, eerste lid)
          - name: start_datum_intrekkingstermijn
            type: date
            required: true
            description: >-
              Startdatum voor de negenmaandentermijn van artikel 13, tweede lid:
              datum gereedmelding van de nieuwbouwwoning (sub a) respectievelijk
              de peildatum (sub b of c)
        output:
          - name: artikel_13_van_toepassing
            type: boolean
            description: >-
              Artikel 7 is niet van toepassing; bewoning of inschrijving is
              uitgesteld om een geldige reden als bedoeld in artikel 13,
              eerste lid
          - name: intrekkingstermijn_einddatum
            type: date
            description: >-
              Uiterste datum waarbinnen inschrijving of bewoning alsnog moet
              plaatsvinden om intrekking te voorkomen (9 maanden na
              start_datum_intrekkingstermijn, artikel 13, tweede lid)
        actions:
          - output: artikel_13_van_toepassing
            value:
              operation: IN
              subject: $vertraging_reden
              values:
                - nieuwbouw
                - vorige_bewoner
                - achterstallig_onderhoud
          - output: intrekkingstermijn_einddatum
            value:
              operation: DATE_ADD
              date: $start_datum_intrekkingstermijn
              months: 9
  - number: '15'
    text: |-
      1 Voor een primaire toekenning is vereist dat:

      a. de koopsom van de woning niet hoger is dan € 235.525, en

      b. het bedrag van de hypothecaire lening niet hoger is dan het bedrag, genoemd onder a, vermeerderd met 8 procent.

      2 Het in het eerste lid, onder a, genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel41
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '41'
        hoofdstuk: '6'
    machine_readable:
      open_terms:
        - id: maximale_koopsom
          type: amount
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          legal_basis: >-
            artikel 15, tweede lid juncto artikel 41 Wet bevordering
            eigenwoningbezit (geïndexeerde maximale koopsom; basis €235.525)
      execution:
        parameters:
          - name: koopsom
            type: number
            required: true
            description: Koopsom van de woning in eurocent (artikel 15 lid 1 sub a)
          - name: hypothecaire_lening
            type: number
            required: true
            description: >-
              Bedrag van de hypothecaire lening in eurocent
              (artikel 15 lid 1 sub b)
        output:
          - name: voldoet_koopsomeis
            type: boolean
            description: >-
              Koopsom en hypothecaire lening voldoen aan de grenzen van artikel
              15 (koopsom ≤ maximum, lening ≤ maximum + 8%)
        actions:
          - output: koopsom_onder_maximum
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $koopsom
              value: $maximale_koopsom
          - output: maximale_lening
            value:
              operation: MULTIPLY
              values:
                - $maximale_koopsom
                - 1.08
          - output: lening_onder_maximum
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $hypothecaire_lening
              value: $maximale_lening
          - output: voldoet_koopsomeis
            value:
              operation: AND
              conditions:
                - $koopsom_onder_maximum
                - $lening_onder_maximum
  - number: '23'
    text: |-
      Voor een primaire toekenning is vereist dat de hypothecaire lening wordt afgesloten voor een bij ministeriële
      regeling te bepalen rentevaste periode.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel23
    machine_readable:
      open_terms:
        - id: rentevaste_periode
          type: number
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          legal_basis: artikel 23 Wet bevordering eigenwoningbezit
      execution:
        output:
          - name: rentevaste_periode
            type: number
            description: >-
              Bij ministeriële regeling bepaalde rentevaste periode (in jaren)
              waarvoor de hypothecaire lening voor een primaire toekenning moet
              zijn afgesloten (artikel 23)
        actions:
          - output: rentevaste_periode
            value: $rentevaste_periode
  - number: 23a
    text: |-
      Op een toekenning van een eigenwoningbijdrage na het tweede vijfjaarstijdvak is [artikel 23][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel23
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek van de eigenaar-bewoner, als in een bepaald geval de onverkorte
      toepassing van de desbetreffende bepalingen, gelet op het belang dat deze wet beoogt te beschermen, tot een
      onbillijkheid van overwegende aard zou leiden:

      a. bij de toepassing van de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], een persoon als bedoeld in
      [artikel 2, eerste lid, onder a en b][ref3], buiten beschouwing laten;

      b. bij de toepassing van [artikel 4, tweede lid][ref4], bepaalde inkomsten of vermogensbestanddelen geheel of
      gedeeltelijk buiten beschouwing laten.

      2 Een daling van het inkomen, of een daling van het vermogen na het peiljaar, kan niet leiden tot toepassing van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011919#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011919#Artikel4
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011919
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011919
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011919
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '25'
    text: |-
      1 Als de eigenaar-bewoner in de loop van het vijfjaarstijdvak de eigendom van de woning verliest, wordt de
      eigenwoningbijdrage op naam gesteld van diens echtgenoot, geregistreerde partner of bloed- of aanverwant in de
      eerste of tweede graad, als deze:

      a. ten minste voor de helft eigenaar van die woning blijft of wordt, dan wel een beperkt recht op die woning
      verkrijgt;

      b. die woning op het tijdstip van het verlies van de eigendom, bedoeld in de aanhef, bewoonde en

      c. die woning blijft bewonen.

      2 Bij een verlies van de eigendom van de woning als bedoeld in het eerste lid zonder dat daarvoor de eigendom van
      een andere woning in de plaats komt, en waarbij voorts niet wordt voldaan aan onderdeel a, b of c van dat lid, is
      [artikel 50, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel50
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '50'
        hoofdstuk: '8'
    machine_readable:
      execution:
        parameters:
          - name: eigendom_verlies_zonder_nieuwe_woning
            type: boolean
            required: true
            description: >-
              Eigenaar-bewoner verliest eigendom van de woning zonder dat
              daarvoor de eigendom van een andere woning in de plaats komt
              (artikel 25, tweede lid)
          - name: erfgenaam_minstens_half_eigenaar
            type: boolean
            required: true
            description: >-
              De erfgenaam/partner blijft of wordt ten minste voor de helft
              eigenaar van de woning, dan wel verkrijgt een beperkt recht op
              die woning (artikel 25, eerste lid, onderdeel a)
          - name: erfgenaam_bewoonde_woning_op_tijdstip
            type: boolean
            required: true
            description: >-
              De erfgenaam/partner bewoonde de woning op het tijdstip van
              het verlies van de eigendom (artikel 25, eerste lid, onderdeel b)
          - name: erfgenaam_blijft_woning_bewonen
            type: boolean
            required: true
            description: >-
              De erfgenaam/partner blijft de woning bewonen
              (artikel 25, eerste lid, onderdeel c)
        output:
          - name: overdracht_bijdrage_mogelijk
            type: boolean
            description: >-
              De eigenwoningbijdrage kan op naam worden gesteld van de
              erfgenaam/partner (artikel 25, eerste lid: alle drie condities
              zijn vervuld)
          - name: herziening_van_toepassing
            type: boolean
            description: >-
              Artikel 50, eerste lid is van toepassing: eigendomsverlies
              zonder vervangende woning en niet voldaan aan onderdeel a, b of
              c (artikel 25, tweede lid)
        actions:
          - output: voorwaarden_overdracht_vervuld
            value:
              operation: AND
              conditions:
                - $erfgenaam_minstens_half_eigenaar
                - $erfgenaam_bewoonde_woning_op_tijdstip
                - $erfgenaam_blijft_woning_bewonen
          - output: overdracht_bijdrage_mogelijk
            value: $voorwaarden_overdracht_vervuld
          - output: herziening_van_toepassing
            value:
              operation: AND
              conditions:
                - $eigendom_verlies_zonder_nieuwe_woning
                - operation: NOT
                  value: $voorwaarden_overdracht_vervuld
  - number: '26'
    text: |-
      1 Het percentage van de toetsrente wordt bij ministeriële regeling vastgesteld, met inachtneming van het
      rentetarief dat wordt gehanteerd bij het verstrekken van een hypothecaire lening afgesloten in de vorm van een
      annuïteitenhypotheek.

      2 Het percentage, bedoeld in het eerste lid, kan bij ministeriële regeling worden gewijzigd als daartoe aanleiding
      bestaat als gevolg van de ontwikkeling van het rentetarief, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel26
    machine_readable:
      open_terms:
        - id: toetsrente
          type: number
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          legal_basis: artikel 26, eerste lid Wet bevordering eigenwoningbezit
      execution:
        output:
          - name: toetsrente
            type: number
            description: >-
              Rentetarief waartegen een hypothecaire lening (annuïteitenhypotheek)
              kan worden afgesloten, vastgesteld bij ministeriële regeling
              (percentage)
        actions:
          - output: toetsrente
            value: $toetsrente
  - number: '27'
    text: |-
      1 Het fiscaal effect wordt verkregen door de tot een bedrag herleide financieringslastnorm te vermenigvuldigen met:

      a. voor eenpersoonshuishoudens en tweepersoonshuishoudens, indien het toetsinkomen
      minder bedraagt dan of gelijk is aan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref1], zoals dit luidt in het bijdragejaar: 0,29;

      b. voor eenpersoonshuishoudens en tweepersoonshuishoudens, indien het toetsinkomen meer bedraagt dan het laagste
      bedrag, genoemd in de tabel onder II bij [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref2],
      zoals dit luidt in het bijdragejaar: 0,33;

      c. voor eenpersoonsouderenhuishoudens en tweepersoonsouderenhuishoudens, indien het toetsinkomen
      minder bedraagt dan of gelijk is aan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref3], zoals dit luidt in het bijdragejaar: 0,13, en

      d. voor eenpersoonsouderenhuishoudens en tweepersoonsouderenhuishoudens, indien het
      toetsinkomen meer bedraagt dan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref4], zoals dit luidt in het bijdragejaar: 0,16.

      2 De in het eerste lid genoemde factoren kunnen worden gewijzigd overeenkomstig [artikel 41][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10
      [ref5]: https://wetten.overheid.nl/BWBR0011919#Artikel41
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2.10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2.10'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '2.10'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '2.10'
      - id: ref5
        bwb_id: BWBR0011919
        artikel: '41'
        hoofdstuk: '6'
    machine_readable:
      definitions:
        FACTOR_NIET_OUDER_LAAG:
          value: 0.29
          description: >-
            Factor fiscaal effect voor eenpersoons- en tweepersoonshuishouden
            bij toetsinkomen ≤ laagste bedrag tabel II artikel 2.10 WIB
            (artikel 27 lid 1 sub a)
        FACTOR_NIET_OUDER_HOOG:
          value: 0.33
          description: >-
            Factor fiscaal effect voor eenpersoons- en tweepersoonshuishouden
            bij toetsinkomen > laagste bedrag tabel II artikel 2.10 WIB
            (artikel 27 lid 1 sub b)
        FACTOR_OUDER_LAAG:
          value: 0.13
          description: >-
            Factor fiscaal effect voor eenpersoons- en tweepersoonsouderenhuishouden
            bij toetsinkomen ≤ laagste bedrag tabel II artikel 2.10 WIB
            (artikel 27 lid 1 sub c)
        FACTOR_OUDER_HOOG:
          value: 0.16
          description: >-
            Factor fiscaal effect voor eenpersoons- en tweepersoonsouderenhuishouden
            bij toetsinkomen > laagste bedrag tabel II artikel 2.10 WIB
            (artikel 27 lid 1 sub d)
      execution:
        parameters:
          - name: toetsinkomen
            type: number
            required: true
            description: Toetsinkomen van het huishouden in eurocent (artikel 3)
          - name: is_ouderenhuishouden
            type: boolean
            required: true
            description: >-
              Is het een eenpersoonsouderenhuishouden of
              tweepersoonsouderenhuishouden (artikel 2, derde lid, sub c of d)?
          - name: laagste_bedrag_tabel_ib
            type: number
            required: true
            description: >-
              Laagste bedrag uit de tabel onder II bij artikel 2.10, eerste lid,
              van de Wet inkomstenbelasting 2001 in het bijdragejaar (eurocent)
        output:
          - name: fiscaal_effect_factor
            type: number
            description: >-
              Van toepassing zijnde factor voor berekening fiscaal effect
              conform artikel 27, eerste lid
        actions:
          - output: inkomen_boven_drempel
            value:
              operation: GREATER_THAN
              subject: $toetsinkomen
              value: $laagste_bedrag_tabel_ib
          - output: fiscaal_effect_factor
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value: $is_ouderenhuishouden
                      - operation: NOT
                        value: $inkomen_boven_drempel
                  then: $FACTOR_NIET_OUDER_LAAG
                - when:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value: $is_ouderenhuishouden
                      - $inkomen_boven_drempel
                  then: $FACTOR_NIET_OUDER_HOOG
                - when:
                    operation: AND
                    conditions:
                      - $is_ouderenhuishouden
                      - operation: NOT
                        value: $inkomen_boven_drempel
                  then: $FACTOR_OUDER_LAAG
              default: $FACTOR_OUDER_HOOG
  - number: '29'
    text: |-
      1 De financieringslastnorm wordt bij ministeriële regeling vastgesteld.

      2 Bij ministeriële regeling wordt een opslagpercentage vastgesteld. Dat percentage wordt:

      a. bij toetsinkomens van € 45.225 of meer zodanig vastgesteld dat met gebruikmaking daarvan een hypothecaire
      lening in de vorm van een annuïteitenhypotheek kan worden afgesloten ter hoogte van het bedrag, bedoeld in
      [artikel 15, eerste lid, onder b][ref1], dan wel

      b. bij toetsinkomens van minder dan € 45.225 zodanig vastgesteld dat dit percentage overeenkomt met het ingevolge
      onderdeel a vastgestelde percentage dat geldt bij een toetsinkomen van € 45.225.

      3 De in het eerste en tweede lid bedoelde percentages kunnen bij ministeriële regeling worden gewijzigd als daartoe
      aanleiding bestaat als gevolg van de ontwikkeling van het rentetarief, bedoeld in [artikel 26, eerste lid][ref2].

      4 Het in het tweede lid genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 41][ref3].

      5 Met het oog op de uitvoering van het eerste en tweede lid worden bij ministeriële regeling de toetsinkomens
      in inkomensklassen verdeeld, waarbij de toetsrente, de maximale hypothecaire lening, de daarbij behorende
      financieringslastnorm en het daarbij behorende percentage, bedoeld in het tweede lid, worden vermeld.

      6 De toetsinkomens in een zelfde inkomensklasse mogen ten hoogste € 500 van elkaar verschillen.

      7 Bij ministeriële regeling wordt elk jaar, met ingang van 1 januari, de indeling in inkomensklassen herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel15
