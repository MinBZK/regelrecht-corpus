    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorlichting over deze wet.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel57
  - number: '63'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet worden geen koopgewenningssubsidies vastgesteld op voet
      van enige daarop betrekking hebbende regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel63
  - number: '64'
    text: |-
      1 Onze Minister brengt jaarlijks verslag uit aan de Staten-Generaal over de werking van deze wet.

      2 Onverminderd het eerste lid zendt Onze Minister binnen vier jaar na de inwerkingtreding van deze wet, en
      vervolgens driejaarlijks, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet
      in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel64
  - number: '65'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Met ingang van de dag van inwerkingtreding van deze wet worden, als die dag 1 juli 2000 of een latere datum is,
      gewijzigd:

      a. de bedragen, genoemd in de [artikelen 8, eerste lid][ref1], en [9, eerste lid, onderdelen a, c en d][ref2]:
      overeenkomstig de wijzigingen die op 1 juli 2000 en nadien hebben plaatsgevonden of plaatsvinden ingevolge
      [artikel 27 van de Huursubsidiewet][ref3], en

      b. de bedragen, genoemd in de [artikelen 15, eerste lid][ref4], [29, eerste lid, formule][ref5], en
      [31, eerste lid][ref6]: overeenkomstig [artikel 41][ref7], met als uitgangspunt dat de laatste wijziging daarvan
      per 1 januari 2000 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel8
