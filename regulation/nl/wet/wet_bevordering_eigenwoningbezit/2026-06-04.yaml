  - number: '43'
    text: |-
      1 Onze Minister neemt een beslissing over:

      a. een aanvraag voor een primaire toekenning: binnen twee weken na de indiening daarvan, en

      b. een aanvraag voor een andere toekenning dan een primaire: binnen vier maanden na de indiening daarvan.

      2 Onze Minister beslist op aanvragen als bedoeld in het eerste lid, onderdeel a, in volgorde van ontvangst,
      met dien verstande dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de
      gelegenheid heeft gehad de aanvraag aan te vullen, de datum waarop de aanvraag is aangevuld geldt als datum van
      ontvangst.

      3 Als de beslissing een primaire toekenning inhoudt, doet de eigenaar-bewoner zo spoedig mogelijk aan Onze Minister
      toekomen:

      a. een authentiek afschrift van de akte van levering van de woning, en

      b. een afschrift van de geldleningsovereenkomst.

      4 Onze Minister stelt de financier, bedoeld in [artikel 42, eerste lid][ref2], terstond in kennis van een
      beslissing als bedoeld in het derde lid en van de ontvangst van de stukken, bedoeld onder a en b van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel42
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
      - id: ref2
        bwb_id: BWBR0011919
        artikel: '42'
        hoofdstuk: '7'
    machine_readable:
      execution:
        parameters:
          - name: aanvraag_datum
            type: date
            required: true
            description: >-
              Datum van indiening van de aanvraag tot toekenning (artikel 43,
              eerste lid)
          - name: is_primaire_toekenning
            type: boolean
            required: true
            description: >-
              Betreft de aanvraag een primaire toekenning (artikel 43, eerste
              lid, onderdeel a)? Zo nee, dan geldt de termijn van onderdeel b
        output:
          - name: beslistermijn_einddatum
            type: date
            description: >-
              Uiterste datum waarop de Minister een beslissing moet nemen: 2
              weken na indiening bij primaire toekenning (lid 1 sub a) of 4
              maanden bij overige toekenningen (lid 1 sub b)
        actions:
          - output: beslistermijn_einddatum
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_primaire_toekenning
                    value: true
                  then:
                    operation: DATE_ADD
                    date: $aanvraag_datum
                    weeks: 2
              default:
                operation: DATE_ADD
                date: $aanvraag_datum
                months: 4
  - number: '44'
    text: |-
      1 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder a][ref1], wordt steeds over een tijdvak van een
      maand uitbetaald, direct na afloop van dat tijdvak. De eerste uitbetaling vindt plaats over de eerste kalendermaand
      van het vijfjaarstijdvak. Uitbetaling geschiedt doordat Onze Minister de eigenwoningbijdrage uitbetaalt aan de
      eigenaar-bewoner. Met de uitbetaling over het eerste vijfjaarstijdvak wordt niet begonnen, zolang Onze Minister de
      bescheiden, genoemd in [artikel 43, derde lid][ref2], niet heeft ontvangen. Bij ministeriële regeling kunnen nadere
      regels worden gesteld over de wijze waarop zodanige uitbetaling plaatsvindt.

      2 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder b][ref3], wordt ineens uitbetaald aan de
      financier, bedoeld in [artikel 42, eerste lid][ref4], in de maand die volgt op de maand waarin de laatste betaling
      volgens het eerste lid is geschied. Onze Minister stelt de eigenaar-bewoner hiervan schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0011919#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011919#Artikel42
    url: https://wetten.overheid.nl/BWBR0011919/2026-06-04#Artikel44
    references:
