  - number: '30'
    text: |-
      1 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder a][ref1], bestaat uit een maandelijkse
      tegemoetkoming in de financieringslast.

      2 De tegemoetkoming, bedoeld in het eerste lid, bedraagt de uitkomst van de formule:

      in welke formule voorstelt:

      H: het bedrag van het toetsinkomen;

      R: de uitkomst van de berekening van de financieringslast die uit de hypothecaire lening volgt bij toepassing van
      de voorwaarden en normen, bedoeld in [artikel 3, eerste lid][ref2], uitgedrukt in een percentage;

      R: het percentage, bedoeld in [artikel 29, eerste lid][ref3];

      f: de van toepassing zijnde factor, bedoeld in [artikel 27][ref4], die geldt op de peildatum.

      3 Er wordt slechts een eigenwoningbijdrage als bedoeld in [artikel 6, eerste lid, onder a][ref5], toegekend als
      de uitkomst van de formule, bedoeld in het tweede lid, een positief bedrag is en het verschil tussen R en R als
      bedoeld in het tweede lid niet groter is dan het opslagpercentage.

      4 De overeenkomstig het tweede lid berekende tegemoetkoming wordt naar boven afgerond op hele eurocenten.


