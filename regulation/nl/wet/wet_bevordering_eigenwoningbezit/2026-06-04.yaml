        artikel: '1'
  - number: '55'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:15][ref1], [5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


