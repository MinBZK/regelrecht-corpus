  - number: '2'
    text: |-
      1 Degenen die behoren tot het huishouden van de eigenaar-bewoner, bedoeld in deze wet en de daarop berustende
      bepalingen, zijn de eigenaar-bewoner en:

      a. zijn niet duurzaam gescheiden levende echtgenoot of geregistreerde partner, of

      b. degene die gezamenlijk met de eigenaar-bewoner de woning bewoont en daarin met hem een gezamenlijke huishouding
      voert, niet zijnde een bloed- of aanverwant van de eigenaar-bewoner of een pleegkind.

      2 Naast de eigenaar-bewoner kan slechts één andere persoon tot diens huishouden behoren.

      3 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. eenpersoonshuishouden: het huishouden van een eigenaar-bewoner die de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet had bereikt op de datum van de offerte
      voor een hypothecaire lening ter verkrijging van de onder auspiciën van de Stichting Waarborgfonds Eigen Woningen
      ontwikkelde Nationale Hypotheek Garantie, en waartoe geen persoon behoort als bedoeld in het eerste lid, onder a
      en b;

      b. tweepersoonshuishouden: het huishouden van een eigenaar-bewoner waartoe een persoon behoort als bedoeld in
      het eerste lid, onder a en b, als het aandeel in het toetsinkomen, afkomstig van degenen die op de datum van
      de offerte voor een hypothecaire lening ter verkrijging van de onder auspiciën van de Stichting Waarborgfonds
      Eigen Woningen ontwikkelde Nationale Hypotheek Garantie de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], hadden bereikt, de helft of minder bedraagt;

      c. eenpersoonsouderenhuishouden: het huishouden van een eigenaar-bewoner die de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], had bereikt op de datum van de offerte
      voor een hypothecaire lening ter verkrijging van de onder auspiciën van de Stichting Waarborgfonds Eigen Woningen
      ontwikkelde Nationale Hypotheek Garantie, en waartoe geen persoon behoort als bedoeld in het eerste lid, onder a
      en b;

      d. tweepersoonsouderenhuishouden: het huishouden van een eigenaar-bewoner waartoe een persoon behoort als
      bedoeld in het eerste lid, onder a en b, als het aandeel in het toetsinkomen, afkomstig van degenen die op
      de datum van de offerte voor een hypothecaire lening ter verkrijging van de onder auspiciën van de Stichting
      Waarborgfonds Eigen Woningen ontwikkelde Nationale Hypotheek Garantie de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], hadden bereikt, meer dan de helft bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
