  - number: '43'
    text: |-
      1 Onze Minister neemt een beslissing over:

      a. een aanvraag voor een primaire toekenning: binnen twee weken na de indiening daarvan, en

      b. een aanvraag voor een andere toekenning dan een primaire: binnen vier maanden na de indiening daarvan.

      2 Onze Minister beslist op aanvragen als bedoeld in het eerste lid, onderdeel a, in volgorde van ontvangst,
      met dien verstande dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de
      gelegenheid heeft gehad de aanvraag aan te vullen, de datum waarop de aanvraag is aangevuld geldt als datum van
      ontvangst.

      3 Als de beslissing een primaire toekenning inhoudt, doet de eigenaar-bewoner zo spoedig mogelijk aan Onze Minister
      toekomen:

      a. een authentiek afschrift van de akte van levering van de woning, en

      b. een afschrift van de geldleningsovereenkomst.

      4 Onze Minister stelt de financier, bedoeld in [artikel 42, eerste lid][ref2], terstond in kennis van een
      beslissing als bedoeld in het derde lid en van de ontvangst van de stukken, bedoeld onder a en b van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel42
