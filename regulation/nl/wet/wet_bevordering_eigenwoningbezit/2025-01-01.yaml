  - number: '3'
    text: |-
      1 Het toetsinkomen, bedoeld in deze wet en de daarop berustende bepalingen, is de ten aanzien van degenen die
      behoren tot het huishouden van de eigenaar-bewoner berekende som van de toetsinkomens in de zin van de voorwaarden
      en normen voor de onder auspiciën van de Stichting Waarborgfonds Eigen Woningen ontwikkelde Nationale Hypotheek
      Garantie, zoals deze jaarlijks in de Staatscourant worden gepubliceerd.

      2 Bij de bepaling van de som volgens het eerste lid wordt elk toetsinkomen dat negatief is, op nul gesteld.

      3 Met betrekking tot de controle van het toetsinkomen maakt Onze Minister gebruik van het inkomensgegeven, bedoeld
      in [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel3
