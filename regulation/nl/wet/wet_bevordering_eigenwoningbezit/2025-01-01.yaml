  - number: '6'
    text: |-
      1 Als aan deze wet wordt voldaan, kent Onze Minister, ter tegemoetkoming in de kosten van het in eigendom
      verkrijgen en vervolgens kunnen blijven bewonen van een woning, op aanvraag aan de eigenaar-bewoner:

      a. drie maal een eigenwoningbijdrage toe over drie achtereenvolgende vijfjaarstijdvakken, en vervolgens

      b. een maal een eigenwoningbijdrage toe over ten hoogste de 15 bijdragejaren die direct volgen op het derde
      vijfjaarstijdvak, overeenkomstig [hoofdstuk 5][ref1].

      2 Ten aanzien van een bepaalde eigenaar-bewoner kan slechts één maal van een primaire toekenning sprake zijn.

      3 Een eigenwoningbijdrage wordt slechts toegekend ten behoeve van het in eigendom verkrijgen en vervolgens kunnen
      blijven bewonen van een woning.

      4 [Titel 4.2 van de Algemene wet bestuursrecht][ref2] is, met uitzondering van
      [afdeling 4.2.2 van die titel][ref3], niet van toepassing op eigenwoningbijdragen krachtens deze wet.

      5 De [hoofdstukken 2][ref4] en [3][ref5] van deze wet zijn uitsluitend van toepassing op eigenwoningbijdragen als
      bedoeld in het eerste lid, onder a, tenzij [hoofdstuk 5][ref6] van deze wet anders bepaalt.

      6 Bij ministeriële regeling:

      a. kan een bedrag worden vastgesteld, dat gedurende een kalenderjaar ten hoogste beschikbaar is voor de
      verstrekking van eigenwoningbijdragen krachtens deze wet,

      b. kan worden bepaald dat, indien een zodanig bedrag in een kalenderjaar niet geheel aan die verstrekking wordt
      besteed, het niet bestede bedrag wordt toegevoegd aan het bedrag voor het direct daaropvolgende kalenderjaar, en

      c. kunnen nadere regels worden gesteld omtrent de loting van gelijktijdig ingediende aanvragen om toekenning van
      een eigenwoningbijdrage.

      Onze Minister maakt het voor het einde van een kalenderjaar geheel aan die verstrekking besteed zijn van het bedrag
      voor dat kalenderjaar onverwijld bekend in de Staatscourant.


