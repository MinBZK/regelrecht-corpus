  - number: '42'
    text: |-
      1 De aanvraag tot toekenning van een eigenwoningbijdrage wordt gedaan door middel van een volledig ingevuld
      formulier. Onze Minister stelt het formulier vast. Onze Minister, de financier die de offerte voor een hypothecaire
      lening heeft uitgebracht die de eigenaar-bewoner heeft geaccepteerd of andere daartoe door Onze Minister aangewezen
      personen of instanties stellen het formulier verkrijgbaar.

      2 De aanvraag voor een andere toekenning dan een primaire wordt ingediend voor de aanvang van het vijfjaarstijdvak
      waarop die aanvraag betrekking heeft. Als niet aan de eerste volzin wordt voldaan, kan geen zodanige aanvraag meer
      worden ingediend.

      3 Als tot het huishouden van de eigenaar-bewoner nog een ander dan hijzelf behoort, wordt bij de aanvraag een
      verklaring van die ander gevoegd, inhoudende:

      a. dat de op het aanvraagformulier vermelde, hem betreffende, gegevens inzake het inkomen juist zijn, en

      b. dat ermee wordt ingestemd dat de inspecteur der rijksbelastingen of Onze Minister terzake van deze gegevens
      inlichtingen inwint bij, en informatie verschaft aan, de eigenaar-bewoner, zo daartoe bij de toepassing van de
      [artikelen 2][ref1], [3][ref2], [4][ref3] en [6][ref4] aanleiding mocht zijn.

      4 De aanvraag voor een toekenning dient ten minste te vermelden:

      a. het huishouden, bedoeld in [artikel 2, derde lid][ref5];

      b. het toetsinkomen, bedoeld in [artikel 3, eerste lid][ref6];

      c. het toetsvermogen, bedoeld in [artikel 4, eerste lid][ref7].

      5 Bij de aanvraag voor een primaire toekenning worden ten minste afschriften van de navolgende stukken gevoegd:

      a. de koopovereenkomst;

      b. de offerte, bedoeld in het eerste lid, waarin is aangegeven dat de hypothecaire lening wordt verstrekt onder de
      garantie, bedoeld in [artikel 10][ref8];

      c. de gegevens betreffende het toetsinkomen in de zin van de voorwaarden en normen, bedoeld in
      [artikel 3, eerste lid][ref9].

      6 Bij de aanvraag voor een andere toekenning dan een primaire worden ten minste de gegevens, bedoeld in het vijfde
      lid, onderdeel c, gevoegd.

      7 De aanvraag wordt ingediend bij Onze Minister, bij een aanvraag voor een primaire toekenning mogelijk door
      tussenkomst van de financier, de personen of de instanties, bedoeld in het eerste lid. Onze Minister stelt die
      financier, de personen of de instanties terstond in kennis van de ontvangst van de aanvraag.

      8 Een verzoek als bedoeld in [artikel 24][ref10] maakt deel uit van de aanvraag, bedoeld in dit artikel.


