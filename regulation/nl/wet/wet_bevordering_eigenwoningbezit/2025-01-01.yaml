        artikel: 9.4a
  - number: '10'
    text: |-
      1 Een eigenwoningbijdrage wordt slechts toegekend als, tot zekerheid van de nakoming door de eigenaar-bewoner van
      de verplichtingen uit hetzij de hypothecaire lening hetzij een daaropvolgende lening of daaropvolgend krediet in
      rekening-courant ter financiering van het in eigendom verkrijgen van een woning met als zekerheid hypotheek op die
      woning, voor die lening of dat krediet een garantie is afgegeven door de Stichting Waarborgfonds Eigen Woningen.

      2 De af te geven garantie is de garantie, bedoeld in [artikel 3, eerste lid][ref1]. De in dat artikellid bedoelde
      voorwaarden en normen voor die garantie zijn van toepassing, tenzij deze wet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel3
