  - number: '41'
    text: |-
      1 Bij ministeriële regeling wordt elk jaar, met ingang van 1 januari, het bedrag, genoemd in
      [artikel 15, eerste lid, onder a][ref1] (maximale koopsom), gewijzigd met de ontwikkeling van het prijsindexcijfer
      voor de bouwkosten.

      2 Bij ministeriële regeling wordt elk jaar, met ingang van 1 januari, het bedrag, genoemd in
      [artikel 29, tweede lid][ref2], gewijzigd met de ontwikkeling van de consumentenprijzen (alle huishoudens) in het
      jaar voorafgaand aan het peiljaar, als in januari van dat peiljaar in de Staatscourant bekendgemaakt.

      3 Bij ministeriële regeling kunnen de factoren, bedoeld in [artikel 27, eerste lid][ref3] (fiscaal effect), worden
      gewijzigd als daartoe aanleiding bestaat vanwege wijziging van de belastingwetgeving.

      4 De bedragen en de factoren worden als volgt afgerond:

      a. de bedragen, bedoeld in het eerste en tweede lid, worden naar boven afgerond op een veelvoud van € 25;

      b. de factoren, bedoeld in het derde lid, worden naar boven afgerond op twee decimalen.

      5 De overeenkomstig het eerste, tweede en derde lid vastgestelde, vanaf 1 januari geldende bedragen en factoren
      worden elk jaar uiterlijk op 1 november in de Staatscourant bekendgemaakt.

      6 Bij een volgende wijziging van deze bedragen en deze factoren wordt uitgegaan van de bedragen en factoren zoals
      die waren, voordat zij werden afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel15
