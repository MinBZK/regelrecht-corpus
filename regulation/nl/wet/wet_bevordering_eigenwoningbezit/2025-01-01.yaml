  - number: '29'
    text: |-
      1 De financieringslastnorm wordt bij ministeriële regeling vastgesteld.

      2 Bij ministeriële regeling wordt een opslagpercentage vastgesteld. Dat percentage wordt:

      a. bij toetsinkomens van € 43.775 of meer zodanig vastgesteld dat met gebruikmaking daarvan een hypothecaire
      lening in de vorm van een annuïteitenhypotheek kan worden afgesloten ter hoogte van het bedrag, bedoeld in
      [artikel 15, eerste lid, onder b][ref1], dan wel

      b. bij toetsinkomens van minder dan € 43.775 zodanig vastgesteld dat dit percentage overeenkomt met het ingevolge
      onderdeel a vastgestelde percentage dat geldt bij een toetsinkomen van € 43.775.

      3 De in het eerste en tweede lid bedoelde percentages kunnen bij ministeriële regeling worden gewijzigd als daartoe
      aanleiding bestaat als gevolg van de ontwikkeling van het rentetarief, bedoeld in [artikel 26, eerste lid][ref2].

      4 Het in het tweede lid genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 41][ref3].

      5 Met het oog op de uitvoering van het eerste en tweede lid worden bij ministeriële regeling de toetsinkomens
      in inkomensklassen verdeeld, waarbij de toetsrente, de maximale hypothecaire lening, de daarbij behorende
      financieringslastnorm en het daarbij behorende percentage, bedoeld in het tweede lid, worden vermeld.

      6 De toetsinkomens in een zelfde inkomensklasse mogen ten hoogste € 500 van elkaar verschillen.

      7 Bij ministeriële regeling wordt elk jaar, met ingang van 1 januari, de indeling in inkomensklassen herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel15
