        artikel: '21'
  - number: '4'
    text: |-
      1 Het toetsvermogen, bedoeld in deze wet en de daarop berustende bepalingen, is het gezamenlijk vermogen van
      degenen die behoren tot het huishouden van de eigenaar-bewoner in het peiljaar.

      2 Onder vermogen wordt verstaan: de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref1], met dien verstande dat die grondslag wordt bepaald zonder
      rekening te houden met de vrijstelling groene beleggingen, bedoeld in [artikel 5.13 van die wet][ref2].

      3 De inspecteur, onder wie de eigenaar-bewoner of degene die tot diens huishouden behoort krachtens
      [artikel 3, tweede lid, van de Algemene wet inzake rijksbelastingen][ref3] ressorteert voor de heffing van de
      inkomstenbelasting, verstrekt op verzoek van Onze Minister over het kalenderjaar voorafgaande aan het kalenderjaar
      waarin die eigenaar-bewoner de eigenwoningbijdrage heeft aangevraagd, het vermogen, bedoeld in het tweede lid, van
      de desbetreffende eigenaar-bewoner of degene die tot diens huishouden behoort, aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5.13
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel3
