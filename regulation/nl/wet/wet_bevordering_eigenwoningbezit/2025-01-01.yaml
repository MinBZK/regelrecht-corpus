  - number: '15'
    text: |-
      1 Voor een primaire toekenning is vereist dat:

      a. de koopsom van de woning niet hoger is dan € 229.550, en

      b. het bedrag van de hypothecaire lening niet hoger is dan het bedrag, genoemd onder a, vermeerderd met 8 procent.

      2 Het in het eerste lid, onder a, genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel41
