  - number: '52'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bij die maatregel aangewezen personen en instanties, met uitzondering
      van degenen die tot het huishouden van de eigenaar-bewoner behoren, worden verplicht kosteloos gegevens en
      afschriften van stukken te verstrekken aan burgemeester en wethouders en Onze Minister, voorzover die verstrekking
      noodzakelijk is voor de uitvoering van deze wet. Bij die maatregel kunnen nadere regels worden gesteld met
      betrekking tot die verstrekking.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel52
  - number: '53'
    text: |-
      Burgemeester en wethouders verstrekken desgevraagd aan Onze Minister de gegevens over de uitvoering van deze wet,
      alsmede inzage in de stukken daarover, op de wijze als door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel53
  - number: '54'
    text: |-
      In de administratie over de uitvoering van deze wet wordt het burgerservicenummer opgenomen van degenen die tot
      het huishouden van de eigenaar-bewoner behoren. Bij de verstrekking van gegevens over de uitvoering van deze wet
      wordt gebruik gemaakt van dit burgerservicenummer. Onder burgerservicenummer wordt verstaan: het nummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel54
