preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen omtrent het aan mensen in lagere
    inkomensgroepen toekennen van een bijdrage ten behoeve van het verkrijgen en kunnen blijven bewonen van een eigen
    woning;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. bestaande woning: woning die al voor de eigendomsoverdracht werd bewoond;

      b. burgemeester en wethouders: burgemeester en wethouders van de gemeente waarin de woning is gelegen waarop de
      eigenwoningbijdrage betrekking heeft;

      c. bijdragejaar: jaar dat begint met de eerste volle kalendermaand waarin degene die de eigenwoningbijdrage
      aanvraagt de woning in eigendom heeft verkregen en loopt tot en met de elfde daaropvolgende kalendermaand, en de
      direct daarop aansluitende jaren;

      d. eigenaar-bewoner: natuurlijke persoon die, alleen of gezamenlijk met een persoon als bedoeld in
      [artikel 2, eerste lid, onder a of b][ref1], een woning volledig in eigendom verkrijgt en daarin zijn hoofdverblijf
      heeft of zal hebben;

      e. eigenwoningbijdrage: financiële bijdrage krachtens deze wet;

      f. financieringslast: te betalen bedrag aan rente over en aflossing van de hypothecaire lening, blijkens de
      geldleningsovereenkomst;

      g. financieringslastnorm: gedeelte van de financieringslast dat per maand ten minste voor rekening van de eigenaar-
      bewoner blijft, uitgedrukt in een percentage van het toetsinkomen;

      h. fiscaal effect: naar een maandbedrag herrekend jaarlijks terugkerend belastingvoordeel dat een huishouden
      met een eigen woning heeft ten opzichte van andere huishoudens, gebaseerd op aftrekbaarheid van het blijkens de
      geldleningsovereenkomst te betalen bedrag aan rente over de hypothecaire lening enerzijds, en bijtelling van het
      eigenwoningforfait anderzijds;

      i. nieuwbouwwoning: woning die voor de eigendomsoverdracht nooit bewoond is geweest;

      j. Onze Minister: Onze Minister voor Wonen, Wijken en Integratie;

      k. opslagpercentage: percentage waarmee de financieringslastnorm ten hoogste kan worden vermeerderd;

      l. peildatum: eerste dag van het vijfjaarstijdvak, respectievelijk in [artikel 40][ref2], eerste dag die volgt op
      het derde vijfjaarstijdvak;

      m. peiljaar: kalenderjaar dat voorafgaat aan het bijdragejaar;

      n. primaire toekenning: toekenning van de eigenwoningbijdrage voor het eerste vijfjaarstijdvak;

      o. toetsinkomen: toetsinkomen, bepaald volgens [artikel 3][ref3];

      p. toetsrente: rentetarief waartegen een hypothecaire lening kan worden afgesloten;

      q. toetsvermogen: toetsvermogen, bedoeld in [artikel 4][ref4];

      r. vijfjaarstijdvak: aaneengesloten periode van vijf bijdragejaren;

      s. woning: gebouwde onroerende zaak voor zover deze bestemd is om als zelfstandige woonruimte te worden gebruikt
      alsmede de onroerende aanhorigheden.

      2 In deze wet, behoudens [artikel 20][ref5], en de daarop berustende bepalingen wordt onder bestaande woning,
      nieuwbouwwoning en woning mede verstaan de daarbij behorende grond.


