  - number: '40'
    text: |-
      1 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder b][ref1], bestaat uit:

      a. een maandelijkse tegemoetkoming in de financieringslast, en

      b. een tegemoetkoming in verband met het financieel risico voor de eigenaar-bewoner bij een stijging van het
      percentage, bedoeld in [artikel 26, eerste lid][ref2].

      2 De tegemoetkoming, bedoeld in het eerste lid, onder a, wordt berekend met gebruikmaking van de formule, bedoeld
      in [artikel 30, tweede lid][ref3], met dien verstande dat in die formule wordt verstaan onder:

      H: het bedrag van het toetsinkomen op de peildatum, gewijzigd met de ontwikkeling van de consumentenprijzen (alle
      huishoudens), zoals die naar redelijke verwachting zal plaatsvinden;

      R: de uitkomst van de berekening van de op de peildatum geldende financieringslast die uit de hypothecaire lening
      volgt bij toepassing van de voorwaarden en normen, bedoeld in [artikel 3, eerste lid][ref4], uitgedrukt in een
      percentage;

      R: het percentage, bedoeld in [artikel 29, eerste lid][ref5], dat geldt op de peildatum.

      3 Er wordt slechts een eigenwoningbijdrage als bedoeld in [artikel 6, eerste lid, onder b][ref6], toegekend als
      de uitkomst van de formule, bedoeld in het tweede lid, voor het 16e bijdragejaar een positief bedrag is en het
      verschil tussen R en R als bedoeld in het tweede lid niet groter is dan het opslagpercentage.

      4 De tegemoetkoming, bedoeld in het eerste lid, onder b, bedraagt de uitkomst van de formule:

      in welke formule voorstelt:

      H: het bedrag van het toetsinkomen dat geldt op de peildatum;

      R: de uitkomst van de berekening van de op de peildatum geldende financieringslast die uit de hypothecaire lening
      volgt bij toepassing van de voorwaarden en normen, bedoeld in [artikel 3, eerste lid][ref7], uitgedrukt in een
      percentage;

      R: het percentage, bedoeld in [artikel 29, eerste lid][ref8];

      f: de van toepassing zijnde factor, bedoeld in [artikel 27][ref9], die geldt op de peildatum.

      5 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder b][ref10], is de helft van de netto contante
      waarde van de bedragen die overeenkomstig het tweede tot en met het vierde lid zijn berekend over die bijdragejaren
      met betrekking tot welke de uitkomst van de formule, bedoeld in het tweede lid, een positief bedrag is.

      6 De volgens het vijfde lid toe te kennen eigenwoningbijdrage wordt naar boven afgerond op hele eurocenten.


