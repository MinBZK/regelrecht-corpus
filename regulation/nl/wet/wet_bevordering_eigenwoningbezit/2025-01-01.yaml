  - number: '11'
    text: Voor een primaire toekenning is vereist dat de eigenaar-bewoner op de peildatum 18 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel11
  - number: '12'
    text: |-
      Voor een primaire toekenning is vereist dat de eigenaar-bewoner gedurende een tijdvak van ten minste drie jaar tot
      de datum van eigendomsoverdracht geen eigenaar is geweest van een woning waar hij zijn hoofdverblijf had.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel12
  - number: '13'
    text: |-
      1 Op een primaire toekenning is [artikel 7][ref1] niet van toepassing, voorzover de bewoning of de inschrijving in
      de gemeentelijke basisadministratie persoonsgegevens is uitgesteld:

      a. omdat een nieuwbouwwoning nog niet bewoonbaar is;

      b. omdat een bestaande woning nog door de vorige bewoner wordt bewoond, of

      c. omdat in een bestaande woning achterstallig onderhoud wordt verricht.

      2 In een geval als bedoeld in het eerste lid kan de eigenwoningbijdrage worden ingetrokken als de inschrijving of
      de bewoning niet heeft plaatsgevonden bij een situatie als bedoeld in onderdeel a van dat artikellid binnen negen
      maanden na de gereedgemelde woning of bij een situatie als bedoeld in de onderdelen b en c van dat artikellid
      binnen negen maanden na de peildatum. De intrekking vindt plaats met ingang van de eerste dag van de kalendermaand
      die volgt na de afloop van die termijn van negen maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel7
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel13
