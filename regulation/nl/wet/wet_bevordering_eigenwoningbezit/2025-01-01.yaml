  - number: '9'
    text: |-
      Een eigenwoningbijdrage wordt niet toegekend als het toetsvermogen voor een eenpersoonshuishouden
      of een eenpersoonsouderenhuishouden meer bedraagt dan het eerstgenoemde drempelbedrag, genoemd
      in [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1], en voor een
      tweepersoonshuishouden of een tweepersoonsouderenhuishouden meer bedraagt dan het tweede genoemde drempelbedrag,
      genoemd in artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9.4a
