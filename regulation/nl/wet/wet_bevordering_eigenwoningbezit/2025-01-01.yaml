  - number: '7'
    text: |-
      1 Behoudens in gevallen als bedoeld in [artikel 13][ref1] wordt een eigenwoningbijdrage slechts toegekend
      als degenen die tot het huishouden van de eigenaar-bewoner behoren, op de peildatum als ingezetene in de
      basisregistratie personen zijn ingeschreven met als adres het adres van de woning in verband met welke de
      eigenwoningbijdrage is aangevraagd.

      2 In afwijking van het eerste lid kan een eigenwoningbijdrage worden toegekend als de betrokkene met een ander
      adres in de basisregistratie personen is ingeschreven en dit niet aan hem kan worden toegerekend.

      3 Behoudens in gevallen als bedoeld in [artikel 13, eerste lid][ref2], wordt een eigenwoningbijdrage slechts
      toegekend als de eigenaar-bewoner op de peildatum woont in de woning in verband met welke de eigenwoningbijdrage
      is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel13
