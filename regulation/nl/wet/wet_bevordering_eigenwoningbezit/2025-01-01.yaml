  - number: '23'
    text: |-
      Voor een primaire toekenning is vereist dat de hypothecaire lening wordt afgesloten voor een bij ministeriële
      regeling te bepalen rentevaste periode.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel23
  - number: 23a
    text: |-
      Op een toekenning van een eigenwoningbijdrage na het tweede vijfjaarstijdvak is [artikel 23][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel23
