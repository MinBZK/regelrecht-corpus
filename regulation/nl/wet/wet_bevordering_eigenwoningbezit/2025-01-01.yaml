  - number: '24'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek van de eigenaar-bewoner, als in een bepaald geval de onverkorte
      toepassing van de desbetreffende bepalingen, gelet op het belang dat deze wet beoogt te beschermen, tot een
      onbillijkheid van overwegende aard zou leiden:

      a. bij de toepassing van de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], een persoon als bedoeld in
      [artikel 2, eerste lid, onder a en b][ref3], buiten beschouwing laten;

      b. bij de toepassing van [artikel 4, tweede lid][ref4], bepaalde inkomsten of vermogensbestanddelen geheel of
      gedeeltelijk buiten beschouwing laten.

      2 Een daling van het inkomen, of een daling van het vermogen na het peiljaar, kan niet leiden tot toepassing van
      het eerste lid.


