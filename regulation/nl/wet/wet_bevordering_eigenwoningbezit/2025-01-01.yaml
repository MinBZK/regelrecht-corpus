  - number: '25'
    text: |-
      1 Als de eigenaar-bewoner in de loop van het vijfjaarstijdvak de eigendom van de woning verliest, wordt de
      eigenwoningbijdrage op naam gesteld van diens echtgenoot, geregistreerde partner of bloed- of aanverwant in de
      eerste of tweede graad, als deze:

      a. ten minste voor de helft eigenaar van die woning blijft of wordt, dan wel een beperkt recht op die woning
      verkrijgt;

      b. die woning op het tijdstip van het verlies van de eigendom, bedoeld in de aanhef, bewoonde en

      c. die woning blijft bewonen.

      2 Bij een verlies van de eigendom van de woning als bedoeld in het eerste lid zonder dat daarvoor de eigendom van
      een andere woning in de plaats komt, en waarbij voorts niet wordt voldaan aan onderdeel a, b of c van dat lid, is
      [artikel 50, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel50
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '50'
        hoofdstuk: '8'
  - number: '26'
    text: |-
      1 Het percentage van de toetsrente wordt bij ministeriële regeling vastgesteld, met inachtneming van het
      rentetarief dat wordt gehanteerd bij het verstrekken van een hypothecaire lening afgesloten in de vorm van een
      annuïteitenhypotheek.

      2 Het percentage, bedoeld in het eerste lid, kan bij ministeriële regeling worden gewijzigd als daartoe aanleiding
      bestaat als gevolg van de ontwikkeling van het rentetarief, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011919/2025-01-01#Artikel26
  - number: '27'
    text: |-
      1 Het fiscaal effect wordt verkregen door de tot een bedrag herleide financieringslastnorm te vermenigvuldigen met:

      a. voor eenpersoonshuishoudens en tweepersoonshuishoudens, indien het toetsinkomen
      minder bedraagt dan of gelijk is aan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref1], zoals dit luidt in het bijdragejaar: 0,29;

      b. voor eenpersoonshuishoudens en tweepersoonshuishoudens, indien het toetsinkomen meer bedraagt dan het laagste
      bedrag, genoemd in de tabel onder II bij [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref2],
      zoals dit luidt in het bijdragejaar: 0,33;

      c. voor eenpersoonsouderenhuishoudens en tweepersoonsouderenhuishoudens, indien het toetsinkomen
      minder bedraagt dan of gelijk is aan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref3], zoals dit luidt in het bijdragejaar: 0,13, en

      d. voor eenpersoonsouderenhuishoudens en tweepersoonsouderenhuishoudens, indien het
      toetsinkomen meer bedraagt dan het laagste bedrag, genoemd in de tabel onder II bij
      [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref4], zoals dit luidt in het bijdragejaar: 0,16.

      2 De in het eerste lid genoemde factoren kunnen worden gewijzigd overeenkomstig [artikel 41][ref5].


