  - number: '57'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorlichting over deze wet.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel57
  - number: '61'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van de invoering van deze wet nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel61
  - number: '62'
    text: |-
      1 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 16, eerste lid][ref1], [56][ref2]
      of [61][ref3], wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd en
      sedert die overlegging acht, acht, onderscheidenlijk vier weken zijn verstreken.

      2 Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 22, vierde lid][ref4], wordt overgelegd
      aan de beide kamers der Staten-Generaal. Binnen een termijn van vier weken na de overlegging kan door of namens een
      der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen
      worden gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt
      een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


