  - number: '7'
    text: |-
      1 Behoudens in gevallen als bedoeld in [artikel 13][ref1] wordt een eigenwoningbijdrage slechts toegekend
      als degenen die tot het huishouden van de eigenaar-bewoner behoren, zich op de peildatum hebben ingeschreven
      in de gemeentelijke basisadministratie persoonsgegevens, op het adres van de woning in verband met welke de
      eigenwoningbijdrage is aangevraagd.

      2 In afwijking van het eerste lid kan een eigenwoningbijdrage worden toegekend als de onjuiste inschrijving in de
      gemeentelijke basisadministratie persoonsgegevens niet aan de eigenaar-bewoner kan worden toegerekend.

      3 Behoudens in gevallen als bedoeld in [artikel 13, eerste lid][ref2], wordt een eigenwoningbijdrage slechts
      toegekend als de eigenaar-bewoner op de peildatum woont in de woning in verband met welke de eigenwoningbijdrage
      is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel13
