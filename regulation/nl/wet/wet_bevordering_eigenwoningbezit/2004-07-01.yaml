  - number: '33'
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. actueel inkomen: het gezamenlijk inkomen van degenen die behoren tot het huishouden van de eigenaar-bewoner,
      dat wordt berekend door het netto inkomen over de eerste kalendermaand van het desbetreffende bijdragetijdvak te
      herrekenen naar een gecorrigeerd verzamelinkomen over het peiljaar;

      b. bijzondere bijdrage: bijzondere bijdrage als bedoeld in [artikel 34][ref1];

      c. bijdragetijdvak: het tijdvak waarvoor telkens een bijzondere bijdrage kan worden toegekend;

      d. meetinkomen:

      1 e. als de eigenaar-bewoner een eigenwoningbijdrage ontvangt, dan wel geen eigenwoningbijdrage ontvangt omdat een
      daartoe strekkende en overeenkomstig [artikel 42, tweede lid, eerste volzin][ref2], ingediende aanvraag niet tot
      een toekenning daarvan heeft geleid om andere redenen dan het niet voldoen aan [artikel 8, eerste lid][ref3]: het
      bij de toekenning of afwijzing van die aanvraag gehanteerde rekeninkomen;

      2 e. als de eigenaar-bewoner geen eigenwoningbijdrage ontvangt omdat een daartoe strekkende en overeenkomstig
      [artikel 42, tweede lid, eerste volzin][ref4], ingediende aanvraag uitsluitend of onder meer wegens het niet
      voldoen aan [artikel 8, eerste lid][ref5], niet tot een toekenning daarvan heeft geleid: het bedrag, genoemd in
      [artikel 8, eerste lid][ref6], dat van toepassing was bij de aanvang van het driejaarstijdvak waarop die aanvraag
      betrekking had.

      2 [Artikel 3, tweede, derde en vierde lid][ref7], is van overeenkomstige toepassing op de bepaling van het actueel
      inkomen.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop de herrekening plaatsvindt die
      is bedoeld in het eerste lid, onder a. Bij of krachtens algemene maatregel van bestuur kunnen ook overigens regels
      worden gesteld omtrent de bepaling van het actueel inkomen.

      4 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het derde lid, laatste volzin, kunnen regels
      worden gesteld omtrent het bij de bepaling van het actueel inkomen in bepaalde gevallen geheel of gedeeltelijk
      buiten beschouwing laten van een persoon als bedoeld in [artikel 2, eerste lid, onder a of b][ref8], of van
      inkomensbestanddelen.


