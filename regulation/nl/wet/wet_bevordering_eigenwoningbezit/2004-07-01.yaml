  - number: 1a
    text: |-
      1 In deze wet en de bepalingen die daarop berusten wordt onder het gecorrigeerde verzamelinkomen verstaan: het
      verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], verminderd met:

      a. indien in het peiljaar de zelfstandigenaftrek, bedoeld in
      [artikel 3.76 van de Wet inkomstenbelasting 2001][ref2], is toegepast: € 1 355;

      b. indien in het peiljaar loon wordt genoten: het hoogste van de uit de toepassing van de volgende onderdelen
      voortvloeiende bedragen:

      1°. bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan
      € 1 605;

      2°. bij loon uit vroegere dienstbetrekking: € 487;

      c. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen kosten van woon-werkverkeer
      (reiskostenforfait), maar niet meer dan € 939;

      d. indien in het kalenderjaar 2000 loon uit dienstbetrekking wordt genoten: het bedrag van de in dat jaar in
      aanmerking genomen aftrekbare kosten terzake van inkomsten uit arbeid andere dan kosten van woon-werkverkeer, na
      toepassing van artikel 37, tweede lid, van de Wet op de inkomstenbelasting 1964, verminderd met 12% van het loon
      uit tegenwoordige dienstbetrekking in dat jaar, maar met niet minder dan € 119 en met niet meer dan € 1 605;

      e. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen renten van schulden, kosten van geldleningen
      daaronder begrepen, bedoeld in artikel 45, eerste lid, onderdeel f, van de Wet op de inkomstenbelasting 1964;

      f. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen premies voor lijfrenten, maar niet meer dan
      € 2 804, verminderd met € 1 036, maar niet verder dan tot nihil; indien bij de echtgenoot van degene van wie het
      gecorrigeerd verzamelinkomen wordt berekend geen premies voor lijfrenten in aanmerking genomen zijn, worden de
      bedragen van € 2 804 en € 1 036 verhoogd tot € 5 608 respectievelijk € 2 072;

      g. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen uitgaven tot voorziening in het levensonderhoud
      van kinderen en pleegkinderen van 27 jaar en ouder, alsmede andere bloed- en aanverwanten in de rechte lijn of
      in de tweede graad van de zijlijn, bedoeld in artikel 46, eerste lid, onderdeel a, onder 2°, van de Wet op de
      inkomstenbelasting 1964.

      2 In het eerste lid wordt onder loon verstaan loon in de zin van de [Wet inkomstenbelasting 2001][ref3].

      3 In deze wet en de bepalingen die daarop berusten wordt onder het gecorrigeerde belastbare loon verstaan: het
      belastbare loon, bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref4], verminderd met:

      a. het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:

      1°. bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan €
      1 605;

      2°. bij loon uit vroegere dienstbetrekking: € 487;

      b. de bedragen, bedoeld in het eerste lid, onderdelen c tot en met g.

      4 De in het eerste lid, onderdelen c tot en met g, en derde lid, onderdeel b, bedoelde correctieposten worden
      over het peiljaar 2001 voor het geheel in aanmerking genomen, over het peiljaar 2002 voor 2/3 deel en over het
      peiljaar 2003 voor 1/3 deel. Over het peiljaar 2004 en volgende peiljaren worden deze correctieposten niet meer in
      aanmerking genomen.

      5 Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:

      a. loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref5], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7];

      b. loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.

      6 De inspecteur, onder wie de eigenaar-bewoner of degene die tot diens huishouden behoort krachtens [artikel
      3, tweede lid, van de Algemene wet inzake rijksbelastingen](onbekend) ressorteert voor de heffing van de
      inkomstenbelasting, bepaalt op verzoek van Onze Minister het gecorrigeerde verzamelinkomen of het gecorrigeerde
      belastbare loon in het peiljaar van de desbetreffende eigenaar-bewoner of degene die tot diens huishouden behoort.

      7 De in het zesde lid bedoelde inspecteur verstrekt de gegevens inzake het gecorrigeerde verzamelinkomen aan Onze
      Minister volgens bij of krachtens algemene maatregel van bestuur te stellen regels.


