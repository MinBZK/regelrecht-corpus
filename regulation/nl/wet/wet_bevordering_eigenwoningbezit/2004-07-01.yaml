    text: |-
      1 De normlasten per maand bedragen de uitkomst van de formule:

      € 101,65 [per 1 juli 2004: € 111,92] + s ( (I - l) / (12) )

      in welke formule voorstelt:

      s: een factor waarmee wordt aangegeven in welke mate de normlasten stijgen in verhouding tot een stijging van het
      rekeninkomen, en die 0,25 bedraagt;

      I: het rekeninkomen, of, als dat in geval van een andere dan een primaire toekenning hoger is, het minimum-
      inkomensijkpunt, bedoeld in [artikel 28][ref1];

      I: het minimum-inkomensijkpunt, bedoeld in [artikel 28][ref2].

      2 Het in het eerste lid, in de daarin opgenomen formule, genoemde bedrag wordt met ingang van 1 juli van elk jaar
      aangepast overeenkomstig [artikel 41][ref3]. De in het eerste lid, onder s:, genoemde factor kan worden aangepast
      overeenkomstig [artikel 41][ref4].


