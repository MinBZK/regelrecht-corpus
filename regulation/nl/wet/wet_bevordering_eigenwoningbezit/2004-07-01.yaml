  - number: '30'
    text: |-
      1 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder a][ref1], bestaat uit:

      a. een maandelijkse tegemoetkoming in de hypotheekrente en

      b. indien overdrachtsbelasting als bedoeld in [artikel 2 van de Wet op belastingen van rechtsverkeer][ref2]
      verschuldigd is: een maandelijkse toeslag in verband met die overdrachtsbelasting.

      2 De tegemoetkoming, bedoeld in het eerste lid, onder a, bedraagt de uitkomst van de formule:

      (H x (100)/(100 + P)) x (R) /(100) x (1 - f) x (1) /(12) - N

      in welke formule voorstelt:

      H: het bedrag van de hypothecaire lening;

      P: het percentage, genoemd in [artikel 14, eerste lid, van de Wet op belastingen van rechtsverkeer][ref3], doch 0
      indien niet de overdrachtsbelasting, bedoeld in [artikel 2 van die wet][ref4], verschuldigd is;

      R: het percentage, bedoeld in [artikel 26, eerste lid][ref5], dat geldt op het tijdstip van acceptatie van de
      offerte, bedoeld in [artikel 42, eerste lid][ref6], of, als dat lager is, het percentage dat geldt op het tijdstip
      van het uitbrengen van die offerte;

      f: de van toepassing zijnde factor, bedoeld in [artikel 27][ref7], die geldt op de peildatum;

      N: 'de normlasten per maand over het driejaarstijdvak, die het gemiddelde bedragen van:'

      (a) de normlasten die gelden op de peildatum, berekend overeenkomstig [artikel 29][ref8];

      (b) de normlasten, bedoeld onder (a), vermeerderd met de in een percentage uitgedrukte ontwikkeling van de
      consumentenprijzen (alle huishoudens) in het peiljaar, als in januari volgend op het peiljaar in de Staatscourant
      bekendgemaakt, en

      (c) de normlasten als berekend onder (b), vermeerderd op dezelfde wijze als bedoeld onder (b).

      3 Er wordt slechts een eigenwoningbijdrage als bedoeld in [artikel 6, eerste lid, onder a][ref9], toegekend als de
      uitkomst van de berekening, bedoeld in het tweede lid, een positief bedrag is.

      4 Als het bedrag dat overeenkomstig het tweede lid is berekend voor het tweede of een volgend
      driejaarstijdvak waarover een eigenwoningbijdrage wordt toegekend, hoger is dan het bedrag, genoemd in
      [artikel 31, eerste lid][ref10], dat bij de primaire toekenning geldt op de peildatum, wordt eerstbedoeld bedrag
      voor de berekening van de hoogte van die bijdrage gesteld op dat eertijds in dat lid genoemde bedrag.

      5 De toeslag, bedoeld in het eerste lid, onder b, bedraagt de uitkomst van de formule:

      (H x (P)/(100 + P)) x (R)/(100) x (1 - f) x (1)/(12)

      in welke formule voorstelt:

      H: het maximumbedrag dat bij de primaire toekenning geldt op de peildatum, genoemd in
      [artikel 15, eerste lid, onder b][ref11], dan wel, bij toepassing van [artikel 16, eerste lid][ref12], het
      betrokken maximumbedrag dat bij de primaire toekenning geldt op de peildatum, genoemd in de in dat artikellid
      bedoelde algemene maatregel van bestuur;

      P: het percentage, bij de primaire toekenning op de peildatum genoemd in
      [artikel 14, eerste lid, van de Wet op belastingen van rechtsverkeer][ref13];

      R: het percentage, bedoeld in [artikel 26, eerste lid][ref14], dat geldt op het tijdstip van ondertekening van de
      offerte, bedoeld in [artikel 42, eerste lid][ref15], of, als dat lager is, het percentage dat geldt op het tijdstip
      van het uitbrengen van die offerte;

      f: de van toepassing zijnde factor, bedoeld in [artikel 27][ref16], die bij de primaire toekenning geldt op de
      peildatum.

      6 De som van de overeenkomstig het tweede tot en met vijfde lid berekende bedragen wordt naar boven afgerond op
      hele eurocenten.


