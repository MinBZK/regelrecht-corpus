  - number: '42'
    text: |-
      1 De aanvraag tot toekenning van een eigenwoningbijdrage wordt gedaan door middel van een volledig ingevuld
      formulier. Onze Minister stelt het formulier vast en stelt het verkrijgbaar, behalve in geval van een aanvraag voor
      een primaire toekenning. In geval van een zodanige aanvraag stelt de financier die de offerte voor een hypothecaire
      lening heeft uitgebracht die de eigenaar-bewoner heeft geaccepteerd of stellen andere daartoe door Onze Minister
      aangewezen personen of instanties, het formulier verkrijgbaar.

      2 De aanvraag voor een andere toekenning dan een primaire wordt ingediend voor de aanvang van het driejaarstijdvak
      waarop die aanvraag betrekking heeft. Als niet aan de eerste volzin wordt voldaan, kan geen zodanige aanvraag meer
      worden ingediend.

      3 Als tot het huishouden van de eigenaar-bewoner nog een ander dan hijzelf behoort, wordt bij de aanvraag een
      verklaring van die ander gevoegd, inhoudende:

      a. dat de op het aanvraagformulier vermelde, hem betreffende, gegevens inzake het inkomen juist zijn, en

      b. dat ermee wordt ingestemd dat de inspecteur der rijksbelastingen of Onze Minister terzake van deze gegevens
      inlichtingen inwint bij, en informatie verschaft aan, de eigenaar-bewoner, zo daartoe bij de toepassing van de
      [artikelen 2 tot en met 6][ref1] aanleiding mocht zijn.

      4 Bij de aanvraag voor een primaire toekenning wordt een verklaring van de eigenaar-bewoner gevoegd dat wordt
      voldaan aan [artikel 9][ref2]. Bij die aanvraag worden voorts ten minste afschriften van de navolgende stukken
      gevoegd, met dien verstande dat dit voor de onderdelen d, e en f slechts geldt voorzover de desbetreffende eis van
      toepassing is:

      a. de koopovereenkomst;

      b. de offerte, bedoeld in het eerste lid, waarin is aangegeven dat de hypothecaire lening wordt verstrekt onder de
      garantie, bedoeld in [artikel 10][ref3];

      c. een of meer verklaringen van de inspecteur der rijksbelastingen, waarin hij aangeeft welke voor het rekeninkomen
      van belang zijnde gegevens bij de ontvanger van de rijksbelastingen bekend zijn;

      d. het garantiecertificaat, bedoeld in [artikel 17][ref4];

      e. het taxatierapport, bedoeld in [artikel 18][ref5];

      f. het bouwkundig rapport, bedoeld in [artikel 19, onder a][ref6].

      5 De aanvraag wordt ingediend bij Onze Minister, bij een aanvraag voor een primaire toekenning door tussenkomst
      van de financier, de personen of de instanties, bedoeld in het eerste lid. Onze Minister stelt die financier, de
      personen of de instanties terstond in kennis van de ontvangst van de aanvraag.

      6 Een aanvraag als bedoeld in [artikel 24][ref7] maakt deel uit van de aanvraag, bedoeld in dit artikel.


