preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen omtrent het aan mensen in lagere
    inkomensgroepen toekennen van een bijdrage ten behoeve van het verkrijgen en kunnen blijven bewonen van een eigen
    woning;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. bestaande woning: woning die al voor de eigendomsoverdracht werd bewoond;

      b. burgemeester en wethouders: burgemeester en wethouders van de gemeente waarin de woning is gelegen waarop de
      eigenwoningbijdrage of de bijzondere bijdrage, bedoeld in [artikel 34][ref1], betrekking heeft;

      c. bijdragejaar: jaar dat begint met de eerste volle kalendermaand waarin degene die de eigenwoningbijdrage
      aanvraagt de woning in eigendom heeft verkregen en loopt tot en met de elfde daaropvolgende kalendermaand, en de
      direct daarop aansluitende jaren;

      d. driejaarstijdvak: aaneengesloten periode van drie bijdragejaren;

      e. eigenaar-bewoner: natuurlijke persoon die, alleen of gezamenlijk met een persoon als bedoeld in
      [artikel 2, eerste lid, onder a of b][ref2], een woning volledig in eigendom verkrijgt en daarin zijn hoofdverblijf
      heeft of zal hebben;

      f. eigenwoningbijdrage: financiële bijdrage krachtens deze wet, met uitzondering van de bijzondere bijdrage,
      bedoeld in [artikel 34][ref3];

      g. financier: financiële instelling die de hypothecaire lening verstrekt;

      h. fiscaal effect: naar een maandbedrag herrekend jaarlijks terugkerend belastingvoordeel dat een huishouden
      met een eigen woning heeft ten opzichte van andere huishoudens, gebaseerd op aftrekbaarheid van de te betalen
      hypotheekrente enerzijds, en bijtelling van het huurwaardeforfait anderzijds;

      i. hypothecaire lening: lening of krediet in rekening-courant ter financiering van de kosten van het in eigendom
      verkrijgen van de woning in verband met welke een eigenwoningbijdrage wordt aangevraagd, met als zekerheid
      hypotheek op die woning, niet zijnde een zodanige lening die of krediet dat voor de inwerkingtreding van deze wet
      is gesloten of verleend;

      j. hypotheekrente: te betalen bedrag aan rente over de hypothecaire lening, blijkens de geldleningsovereenkomst;

      k. nieuwbouwwoning: woning die voor de eigendomsoverdracht nooit bewoond is geweest;

      l. normlasten: gedeelte van de hypotheekrente dat per maand ten minste voor rekening van de eigenaar-bewoner
      blijft;

      m. normrente: genormeerd maandbedrag aan rente over de hypothecaire lening;

      n. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      o. peildatum: eerste dag van het driejaarstijdvak, respectievelijk, in [artikel 40][ref4], eerste dag die volgt op
      het vijfde driejaarstijdvak;

      p. peiljaar: kalenderjaar dat voorafgaat aan het bijdragejaar, of, als dat kalenderjaar minder dan een half jaar
      voor het bijdragejaar eindigt, het kalenderjaar dat voorafgaat aan dat kalenderjaar;

      q. primaire toekenning: toekenning van de eigenwoningbijdrage voor het eerste driejaarstijdvak;

      r. rekeninkomen, rekenvermogen: het rekeninkomen en het rekenvermogen, bedoeld in [artikel 3][ref5] respectievelijk
      [artikel 4][ref6];

      s. standplaats: standplaats als bedoeld in [artikel 1, eerste lid, onder h, van de Woningwet][ref7];

      t. verkrijgen in eigendom:

      1 e. verwerven van de eigendom;

      2 e. verkrijgen van een recht van opstal, een recht van erfpacht, een appartementsrecht of een ander beperkt recht,
      of

      3 e. verkrijgen van een lidmaatschapsrecht van een coöperatie, waaraan verbonden het recht van gebruik en bewoning;

      u. woonwagen: woonwagen als bedoeld in [artikel 1, eerste lid, onder e, van de Woningwet][ref8].

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder woning: woonwagen en standplaats
      tezamen.


