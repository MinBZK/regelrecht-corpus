    text: |-
      1 In bij algemene maatregel van bestuur te bepalen categorieën van gevallen waarin bijzondere bijdragen zijn
      toegekend in afwijking van dit hoofdstuk of de daarop berustende bepalingen, dan wel [artikel 35, zesde lid][ref1],
      juncto [artikel 46, tweede lid][ref2], niet wordt nageleefd, besluit Onze Minister dat de ten onrechte of tot een
      te hoog bedrag toegekende bijdragen, dan wel de voorschotten daarop, worden teruggevorderd dan wel verrekend.

      2 [Artikel 50, tweede lid][ref3], is van overeenkomstige toepassing op besluiten tot terugvordering of verrekening
      als bedoeld in het eerste lid.

      3 Onze Minister kan besluiten te verrekenen met aanspraken op een bijzondere bijdrage van de eigenaar-bewoner.


