        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '14'
    text: |-
      Voor een primaire toekenning is vereist dat de eigenaar-bewoner, alsmede degene die tot diens huishouden behoort,
      op het moment dat de aanvraag voor de eigenwoningbijdrage bij Onze Minister wordt ingediend:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld, of

      b. vreemdeling is en rechtmatig verblijf houdt in de zin van artikel 1b, aanhef en onder 1, van de
      Vreemdelingenwet.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel14
  - number: '15'
    text: |-
      1 Voor een primaire toekenning is vereist dat:

      a. de kosten van het verkrijgen in eigendom van de woning niet hoger zijn dan f 259 800 en

      b. het bedrag van de hypothecaire lening niet hoger is dan f 207 800.

      2 De in het eerste lid genoemde bedragen kunnen worden aangepast overeenkomstig [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel41
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '41'
        hoofdstuk: '6'
  - number: '16'
    text: |-
      1 Bij algemene maatregel van bestuur kan, gelet op de ontwikkeling van de regionale woningmarkt, voor ten hoogste
      zes provincies worden bepaald dat de maximale kosten van het verkrijgen in eigendom en de maximale hypothecaire
      lening, bedoeld in [artikel 15, eerste lid][ref1], in afwijking van dat artikellid hoger worden vastgesteld,
      mits bij die maatregel tevens voor een gelijk aantal andere provincies, eveneens gelet op de ontwikkeling van
      de regionale woningmarkt, de maximale kosten van verkrijging in eigendom en de maximale hypothecaire lening met
      dienovereenkomstige bedragen lager worden vastgesteld.

      2 In een algemene maatregel van bestuur als bedoeld in het eerste lid wordt bepaald op welke wijze de daarin
      opgenomen bedragen worden of kunnen worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel15
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '17'
    text: |-
      Voor een primaire toekenning ten behoeve van een nieuwbouwwoning is vereist dat een garantiecertificaat is
      afgegeven door een door Onze Minister erkende, terzake deskundige instantie, tenzij de woning geheel of in
      belangrijke mate wordt gebouwd door de eigenaar-bewoner.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel17
  - number: '18'
    text: |-
      1 Voor een primaire toekenning ten behoeve van een bestaande woning is een taxatierapport vereist:

      a. dat is opgemaakt door een taxateur of makelaar in onroerende zaken die niet is betrokken bij de overdracht of
      de financiering;

      b. dat is opgemaakt met inachtneming van het laatst uitgegeven terzake relevante model van de betrokken
      beroepsverenigingen;

      c. dat op het tijdstip van acceptatie van de offerte, bedoeld in [artikel 42, eerste lid][ref1], niet ouder is dan
      een jaar.

      2 In geval van achterstallig onderhoud wordt bij de vaststelling van de taxatiewaarde verondersteld dat dat
      onderhoud volledig is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel42
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '42'
        hoofdstuk: '7'
  - number: '19'
    text: |-
      Indien bij een aanvraag ten behoeve van een bestaande woning uit het taxatierapport blijkt dat de kosten van het
      verrichten van achterstallig onderhoud aan de woning ten minste ééntiende deel bedragen van de waarde van de woning
      na het verrichten van het achterstallig onderhoud, is voor een primaire toekenning vereist:

      a. dat bij dat taxatierapport een bouwkundig rapport is gevoegd dat is opgesteld door de gemeente waar
      de woning gelegen is, een bouwkundig bedrijf dat als zodanig is ingeschreven bij de Kamer van Koophandel,
      of een andere instantie die in het kader van de toepassing van de voorwaarden en normen, bedoeld in
      [artikel 10, tweede lid][ref1], daartoe bevoegd is, en

      b. dat de kosten van het verrichten van het achterstallig onderhoud kunnen worden voldaan, en de daartoe benodigde
      financiële middelen bij de financier in depot blijven tot het achterstallig onderhoud is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel10
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20'
    text: |-
      Voor een primaire toekenning ten behoeve van een bestaande woning is vereist dat deze zich niet bevindt op bodem,
      waarvan ingevolge de [Wet bodembescherming][ref1] is vastgesteld dat deze ernstig verontreinigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: '21'
    text: |-
      1 Voor een primaire toekenning ten behoeve van het in eigendom verkrijgen van een woonwagen en standplaats tezamen
      is vereist dat de woonwagen op de peildatum:

      a. is geplaatst op een standplaats als bedoeld in [artikel 1, eerste lid, onder e, van de Huisvestingswet][ref1],
      of op een regionaal woonwagencentrum dat tot stand is gekomen voor 1 oktober 1970, en

      b. voldoet aan de eisen, daaraan gesteld krachtens de [Woningwet][ref2].

      2 Voor een primaire toekenning is vereist dat deze niet is ten behoeve van het in eigendom verkrijgen van een
      woonschip.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005181
  - number: '22'
    text: |-
      1 Voor een primaire toekenning is vereist dat de woning niet in eigendom is verkregen onder voorwaarden die:

      a. de beschikkingsmacht van de eigenaar-bewoner over de woning op enigerlei wijze inperken, voorzover niet
      rechtstreeks voortvloeiend uit [Boek 5, titel 9, van het Burgerlijk Wetboek][ref1], of

      b. inhouden dat de financiële voordelen als gevolg van vervreemding van de woning door de eigenaar-bewoner mede
      aan anderen dan de eigenaar-bewoner ten goede komen, een en ander behoudens het recht van een toegelaten instelling
      als bedoeld in [artikel 70 van de Woningwet][ref2] om beperkingen te stellen als bedoeld in het tweede, derde en
      vierde lid.

      2 In het kader van de eigendomsoverdracht van een woning kan worden overeengekomen:

      a. dat de eigenaar-bewoner de woning gedurende ten hoogste vijf jaar na die eigendomsoverdracht niet vervreemdt, en

      b. dat de eigenaar-bewoner, als hij voornemens is de woning te vervreemden binnen 15 jaar na die
      eigendomsoverdracht, deze bij voorrang ter verkrijging dient aan te bieden aan de toegelaten instelling of diens
      rechtsopvolger, een en ander tegen de dan geldende onderhandse verkoopwaarde vrij van huur en gebruik.

      3 Indien een woning wordt verkocht en geleverd voor minder dan de stichtingskosten of voor minder dan de
      onderhandse verkoopwaarde vrij van huur en gebruik, kan in het kader van de eigendomsoverdracht worden
      overeengekomen dat bij vervreemding van de woning door de eigenaar-bewoner gedurende ten hoogste 30 jaar na zijn
      eigendomsverkrijging, aan degene van wie hij de woning in eigendom heeft verkregen, geheel of gedeeltelijk wordt
      terugbetaald:

      a. indien de woning een nieuwbouwwoning is: het verschil tussen de stichtingskosten en het door de eigenaar-
      bewoner betaalde bedrag, eventueel vermeerderd met ten hoogste de ontwikkeling van de consumentenprijzen (alle
      huishoudens);

      b. indien de woning een bestaande woning is en laatstelijk voor de eigendomsoverdracht werd bewoond door een
      ander dan de eigenaar-bewoner of degene die tot diens huishouden behoort: het verschil tussen de onderhandse
      verkoopwaarde vrij van huur en gebruik en het door de eigenaar-bewoner betaalde bedrag, eventueel vermeerderd met
      ten hoogste de ontwikkeling van de consumentenprijzen (alle huishoudens), of

      c. indien de woning een bestaande woning is en de eigenaar-bewoner of degene die tot diens huishouden behoort
      die woning laatstelijk voor de eigendomsoverdracht als huurder bewoonde: het verschil tussen de onderhandse
      verkoopwaarde vrij van huur en gebruik en het door de eigenaar-bewoner betaalde bedrag, voorzover dat verschil
      10 procent van die verkoopwaarde te boven gaat, eventueel vermeerderd met ten hoogste de ontwikkeling van de
      consumentenprijzen (alle huishoudens).

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het tweede en het
      derde lid, en kan worden geregeld welke overige voorwaarden in het kader van de eigendomsoverdracht kunnen worden
      overeengekomen. Bij de aanbieding dient de koper de vrije keuze te hebben tussen het sluiten van een overeenkomst
      met zodanige voorwaarden en een overeenkomst zonder zodanige voorwaarden waarbij de financiële prestaties op
      onafhankelijk vastgestelde grondslag inzichtelijk dienen te worden gemaakt. Zodanige voorwaarden kunnen er slechts
      toe strekken risicos van het eigenwoningbezit voor de koper te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0005288
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005288
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '23'
    text: |-
      Voor een primaire toekenning is vereist dat de hypothecaire lening:

      a. blijkens de geldleningsovereenkomst in ten hoogste 30 jaar voor ten minste 60 procent wordt afgelost;

      b. wordt afgesloten in een bij ministeriële regeling te bepalen vorm en voor een bij die regeling te bepalen
      rentevaste periode en

      c. niet strekt tot financiering van andere bedragen en kosten dan die, genoemd in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel5
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '24'
    text: |-
      1 Onze Minister kan ambtshalve of op aanvraag van de eigenaar-bewoner, als in een bepaald geval de onverkorte
      toepassing van de desbetreffende bepalingen, gelet op het belang dat deze wet beoogt te beschermen, tot een
      onbillijkheid van overwegende aard zou leiden:

      a. bij de toepassing van de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], een persoon als bedoeld in
      [artikel 2, eerste lid, onder a en b][ref3], buiten beschouwing laten;

      b. bij de toepassing van de [artikelen 3, derde lid][ref4], of [4, tweede lid][ref5], bepaalde inkomsten of
      vermogensbestanddelen geheel of gedeeltelijk buiten beschouwing laten.

      2 Een daling van het inkomen, of een daling van het vermogen na de 1 januari die voorafgaat aan de peildatum, kan
      niet leiden tot toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel4
