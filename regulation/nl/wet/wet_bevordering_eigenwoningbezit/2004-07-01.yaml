  - number: '28'
    text: |-
      Het minimum-inkomensijkpunt bedraagt, herrekend naar een jaarinkomen in het peiljaar:

      a. voor een eenpersoonshuishouden: de som van de bedragen, bedoeld in de [artikelen 21, onder a][ref1], en
      [25, tweede lid, van de Wet werk en bijstand][ref2];

      b. voor een tweepersoonshuishouden: het bedrag, bedoeld in [artikel 21, onder c, van de Wet werk en bijstand][ref3];

      c. voor een eenpersoonsouderenhuishouden: het bedrag, bedoeld in
      [artikel 9, tiende lid, onder a, van de Algemene Ouderdomswet][ref4], vermeerderd met de vakantietoeslag, bedoeld
      in [artikel 29, negende lid, onder c, van die wet][ref5], en verder vermeerderd met € 1675;

      d. voor een tweepersoonsouderenhuishouden: twee maal het bedrag, bedoeld in
      [artikel 9, tiende lid, onder b, van de Algemene Ouderdomswet][ref6], vermeerderd met de vakantietoeslag, bedoeld
      in [artikel 29, negende lid, onder a, van die wet][ref7], en verder vermeerderd met € 1050.


