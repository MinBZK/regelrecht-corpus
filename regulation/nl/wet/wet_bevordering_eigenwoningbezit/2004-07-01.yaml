  - number: '43'
    text: |-
      1 Onze Minister neemt een beslissing over:

      a. een aanvraag voor een primaire toekenning: binnen twee weken na de indiening daarvan, en

      b. een aanvraag voor een andere toekenning dan een primaire: binnen vier maanden na de indiening daarvan.

      2 Als de beslissing een primaire toekenning inhoudt, doet de eigenaar-bewoner zo spoedig mogelijk aan Onze Minister
      toekomen:

      a. de akte van levering van de woning en

      b. de geldleningsovereenkomst.

      3 Onze Minister stelt de financier, bedoeld in [artikel 42, eerste lid][ref1], terstond in kennis van een
      beslissing als bedoeld in het tweede lid en van de ontvangst van de stukken, bedoeld onder a en b van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel42
