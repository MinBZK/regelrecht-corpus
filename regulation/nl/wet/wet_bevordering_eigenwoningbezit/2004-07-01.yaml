  - number: '41'
    text: |-
      1 Bij ministeriële regeling worden elk jaar, met ingang van 1 juli, de bedragen die zijn genoemd in de
      [artikelen 8, eerste lid (maximaal toegestaan inkomen)][ref1], [9, eerste lid (maximaal toegestaan vermogen)][ref2],
      [29, eerste lid, formule (minimum normlasten)][ref3], en [31, eerste lid (maximale ewb)][ref4], aangepast aan de
      ontwikkeling van de consumentenprijzen (alle huishoudens) in het peiljaar, als in januari volgend op het peiljaar
      in de Staatscourant bekendgemaakt. Het maximaal toegestaan inkomen kan, naast de aanpassing daarvan volgens de
      eerste volzin, worden aangepast ter voorkoming van onbedoelde gevolgen van maatregelen met betrekking tot de
      inkomens boven het minimum-inkomensijkpunt, bedoeld in [artikel 28][ref5]. De minimum normlasten kunnen, in plaats
      van de aanpassing daarvan volgens de eerste volzin, worden aangepast met het percentage waarmee het bedrag, bedoeld
      in [artikel 21, onder c, van de Wet werk en bijstand][ref6] is aangepast.

      2 Bij ministeriële regeling kunnen de bedragen, genoemd in
      [artikel 15, eerste lid, onder a (maximale koopsom) en b (maximale hypothecaire lening)][ref7], worden aangepast
      aan de ontwikkeling van het prijsindexcijfer voor de bouwkosten. Bij toepassing van de eerste volzin wordt het
      bedrag, genoemd in [artikel 63a, onderdeel e, onder 1°][ref8], zodanig aangepast dat het gelijk is aan het
      verschil tussen de in die volzin bedoelde bedragen.

      3 Bij ministeriële regeling kunnen de factoren, genoemd in [artikel 27, eerste lid][ref9] (fiscaal effect), worden
      aangepast als daartoe aanleiding bestaat vanwege wijziging van de belastingwetgeving.

      4 Bij ministeriële regeling wordt jaarlijks, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid,
      de hoogte vastgesteld van de bedragen die vanaf 1 juli krachtens [artikel 28][ref10] als minimum-inkomensijkpunt
      zullen gelden.

      5 De bedragen en factoren worden als volgt afgerond:

      a. de minimum normlasten en de maximale ewb, bedoeld in het eerste lid, worden naar boven afgerond op hele
      eurocenten;

      b. het maximaal toegestaan inkomen en het maximaal toegestaan vermogen, bedoeld in het eerste lid, en de bedragen,
      bedoeld in het tweede en vierde lid, worden naar boven afgerond op een veelvoud van € 25;

      c. de factoren, bedoeld in het derde lid, worden naar boven afgerond op twee decimalen.

      6 De overeenkomstig het eerste tot en met vijfde lid vastgestelde, vanaf 1 juli geldende bedragen en factoren
      worden elk jaar uiterlijk op 1 mei in de Staatscourant bekendgemaakt.

      7 Bij een volgende aanpassing van deze bedragen en factoren wordt uitgegaan van de bedragen en factoren zoals die
      waren, voordat zij werden afgerond.

      8 Bij algemene maatregel van bestuur kunnen de bedragen, genoemd in de [artikelen 11, eerste lid, onder b,][ref11]
      3e en 4e, en [28, onder c en d (ouderentoeslag bij minimum-inkomensijkpunt)][ref12], en de factor, genoemd in
      [artikel 29, eerste lid, onder s][ref13], hoger of lager worden gesteld.


