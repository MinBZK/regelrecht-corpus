  - number: '37'
    text: |-
      1 Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van dit
      hoofdstuk over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de
      uitvoering van deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.

      2 Het in het eerste lid vervatte verbod is niet van toepassing, indien:

      a. enig wettelijk voorschrift tot bekendmaking verplicht;

      b. degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben, of

      c. de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.

      3 Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt,
      voorzover de persoonlijke levenssfeer daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel37
  - number: '38'
    text: |-
      1 Onze Minister past [artikel 24, eerste lid][ref1], toe overeenkomstig het bepaalde in
      [artikel 34, eerste en tweede lid][ref2], in gevallen waarin, hoewel het inkomen is gedaald, geen bijzondere
      bijdrage als bedoeld in dit hoofdstuk wordt toegekend omdat:

      a. niet is voldaan aan de vereisten die zijn gesteld in [artikel 11][ref3] juncto [artikel 34, derde lid][ref4], of

      b. het rekenvermogen hoger is dan het relevante bedrag, genoemd in [artikel 9][ref5] juncto
      [artikel 34, derde lid][ref6].

      2 Een aanvraag om het eerste lid toe te passen wordt ingediend binnen zes maanden na het einde van het
      bijdragetijdvak waarop de aanvraag tot toekenning van een bijzondere bijdrage als bedoeld in dit hoofdstuk
      betrekking heeft.


