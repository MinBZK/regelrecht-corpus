  - number: '40'
    text: |-
      1 De eigenwoningbijdrage per maand, bedoeld in [artikel 6, eerste lid, onder b][ref1], bestaat uit:

      a. een tegemoetkoming in de hypotheekrente, voorzover met de hypothecaire lening niet de verschuldigde
      overdrachtsbelasting, bedoeld in [artikel 2 van de Wet op belastingen van rechtsverkeer][ref2], is gefinancierd;

      b. een tegemoetkoming in verband met het financieel risico voor de eigenaar-bewoner bij een stijging van het
      percentage, bedoeld in [artikel 26, eerste lid][ref3], en

      c. een toeslag in verband met de overdrachtsbelasting, bedoeld in
      [artikel 2 van de Wet op belastingen van rechtsverkeer][ref4].

      2 De tegemoetkoming, bedoeld in het eerste lid, onder a, wordt berekend met gebruikmaking van de formule, bedoeld
      in [artikel 30, tweede lid][ref5], met dien verstande dat in die formule wordt verstaan onder:

      N: '(a) in het 16e bijdragejaar: de normlasten die gelden op de peildatum, (b) in het 17e bijdragejaar: de'
      normlasten die gelden op de peildatum vermeerderd met de in een percentage uitgedrukte ontwikkeling van de
      consumentenprijzen (alle huishoudens) in het peiljaar, als in januari volgend op het peiljaar in de Staatscourant
      bekendgemaakt, en (c) in het 18e en volgende bijdragejaren tot en met ten hoogste het 30e bijdragejaar: de
      dienovereenkomstig vermeerderde normlasten in het 17e bijdragejaar respectievelijk voorgaande bijdragejaren.

      3 Er wordt slechts een eigenwoningbijdrage als bedoeld in [artikel 6, eerste lid, onder b][ref6], toegekend als de
      uitkomst van de berekening, bedoeld in het tweede lid, voor het 16e bijdragejaar een positief bedrag is.

      4 Als het bedrag dat overeenkomstig het tweede lid is berekend voor het 16e of een volgend bijdragejaar waarover
      een eigenwoningbijdrage wordt toegekend, hoger is dan het bedrag, genoemd in [artikel 31, eerste lid][ref7], dat
      bij de primaire toekenning geldt op de peildatum, wordt eerstbedoeld bedrag voor de berekening van de hoogte van
      die bijdrage gesteld op dat eertijds in dat lid genoemde bedrag.

      5 De tegemoetkoming, bedoeld in het eerste lid, onder b, wordt berekend met gebruikmaking van de formule:

      0,5{(R – Rt) x (1 – f) + (P – Pt)}

      in welke formule voorstelt:

      R: de normrente op de peildatum;

      Rt: de normrente die ten aanzien van de betrokken eigenaar-bewoner is gehanteerd bij de eerste toepassing van
      [artikel 30][ref8];

      f: de van toepassing zijnde factor, bedoeld in [artikel 27][ref9], die geldt op de peildatum;

      P: de maandelijkse spaarpremie op de peildatum, welke premie wordt berekend door het op de peildatum krachtens
      [artikel 26, tweede lid][ref10], geldende normbedrag te vermenigvuldigen met een factor die wordt verkregen door
      het bedrag van de hypothecaire lening te delen door € 50 000;

      Pt: de maandelijkse spaarpremie ten tijde van de eerste toepassing van [artikel 30][ref11], welke premie wordt
      berekend door het ten tijde van die toepassing krachtens [artikel 26, tweede lid][ref12], geldende normbedrag
      te vermenigvuldigen met een factor die wordt verkregen door het bedrag van de hypothecaire lening te delen door
      € 50 000.

      6 Als de uitkomst van de berekening, bedoeld in het vijfde lid, een negatief bedrag is, wordt de uitkomst van die
      berekening op nul gesteld.

      7 De toeslag, bedoeld in het eerste lid, onder c, wordt berekend met gebruikmaking van de formule, bedoeld in
      [artikel 30, vijfde lid][ref13], met dien verstande dat de uitkomst van die berekening wordt vermenigvuldigd met
      twaalf maal het aantal bijdragejaren met betrekking tot welke de uitkomst van de berekening, bedoeld in het tweede
      lid, een positief bedrag is, onverminderd [artikel 6, eerste lid, onder b][ref14].

      8 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder b][ref15], is de netto contante waarde van de
      bedragen die overeenkomstig het tweede tot en met zevende lid zijn berekend over die bijdragejaren met betrekking
      tot welke de uitkomst van de berekening, bedoeld in het tweede lid, een positief bedrag is.

      9 Het volgens het achtste lid toe te kennen bedrag wordt naar boven afgerond op hele eurocenten.


