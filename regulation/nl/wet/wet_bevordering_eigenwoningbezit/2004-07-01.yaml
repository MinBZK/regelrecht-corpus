  - number: '44'
    text: |-
      1 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder a][ref1], wordt steeds over een tijdvak van een
      maand uitbetaald, direct na afloop van dat tijdvak. De eerste uitbetaling vindt plaats over de eerste kalendermaand
      van het driejaarstijdvak. Uitbetaling geschiedt doordat Onze Minister de eigenwoningbijdrage, zo nodig in de
      vorm van een voorschot, uitbetaalt aan de eigenaar-bewoner. Met de uitbetaling over het eerste driejaarstijdvak
      wordt niet begonnen, zolang Onze Minister de bescheiden, genoemd in [artikel 43, tweede lid][ref2], niet heeft
      ontvangen. Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop zodanige uitbetaling
      plaatsvindt.

      2 De eigenwoningbijdrage, bedoeld in [artikel 6, eerste lid, onder b][ref3], wordt ineens uitbetaald aan de
      eigenaar-bewoner in de maand die volgt op de maand waarin de laatste betaling volgens het eerste lid is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0011919#Artikel6
