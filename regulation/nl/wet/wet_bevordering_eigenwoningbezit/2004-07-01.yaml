  - number: '5'
    text: |-
      1 De kosten van het verkrijgen in eigendom van een woning, bedoeld in deze wet en de daarop berustende bepalingen,
      zijn:

      a. als de woning een nieuwbouwwoning is: de koopsom, de aanneemsom van de woning en de kosten van werkzaamheden die
      niet in de aanneemsom begrepen zijn, vermeerderd met 8 procent van de som van deze kostenposten en van kostenposten
      als bedoeld in het tweede lid, of

      b. als de woning een bestaande woning is: de koopsom tot ten hoogste de getaxeerde onderhandse verkoopwaarde
      vrij van huur en gebruik als vastgelegd in het taxatierapport, bedoeld in [artikel 18, eerste lid][ref1], welke
      verkoopwaarde bij het treffen van voorzieningen wordt gesteld op die verkoopwaarde na voltooiing daarvan, of, bij
      achterstallig onderhoud, wordt vermeerderd met de kosten van herstel van achterstallig onderhoud als vastgelegd
      in het bouwkundig rapport, bedoeld in [artikel 19, onder a][ref2], waarbij wordt uitgegaan van uitvoering van dat
      onderhoud door anderen dan de eigenaar-bewoner, waarna de aldus vermeerderde verkoopwaarde wordt vermeerderd met 12
      procent van de som van die verkoopwaarde en van kostenposten als bedoeld in het tweede lid.

      2 Tot de kosten van het in eigendom verkrijgen van de woning, bedoeld in deze wet en de daarop berustende
      bepalingen, kunnen behoren:

      a. kosten van afkoop van een toekomstige erfpachtcanon;

      b. een afkoopsom in verband met toekomstig onderhoud van de woning, en

      c. een eenmalige premiestorting in verband met een verzekering welke de maandelijkse hypotheeklasten geheel of
      gedeeltelijk uitkeert bij arbeidsongeschiktheid of werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel19
