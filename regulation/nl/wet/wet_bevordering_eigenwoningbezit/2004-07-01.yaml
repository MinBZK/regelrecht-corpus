  - number: '52'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bij die maatregel aangewezen personen en instanties, met uitzondering
      van degenen die tot het huishouden van de eigenaar-bewoner behoren, worden verplicht kosteloos gegevens en
      afschriften van stukken te verstrekken aan burgemeester en wethouders en Onze Minister, voorzover die verstrekking
      noodzakelijk is voor de uitvoering van deze wet. Bij die maatregel kunnen nadere regels worden gesteld met
      betrekking tot die verstrekking.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel52
  - number: '53'
    text: |-
      Burgemeester en wethouders verstrekken desgevraagd aan Onze Minister de gegevens over de uitvoering van deze wet,
      alsmede inzage in de stukken daarover, op de wijze als door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel53
  - number: '54'
    text: |-
      In de administratie over de uitvoering van deze wet wordt het sociaal-fiscaalnummer opgenomen waaronder degenen
      die tot het huishouden van de eigenaar-bewoner behoren, zijn geregistreerd bij de rijksbelastingdienst. Bij de
      verstrekking van gegevens over de uitvoering van deze wet wordt gebruik gemaakt van dit sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel54
  - number: '55'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:15][ref1], [5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


