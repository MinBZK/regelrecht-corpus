  - number: '63'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet worden geen koopgewenningssubsidies vastgesteld op voet
      van enige daarop betrekking hebbende regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel63
  - number: 63a
    text: |-
      Voorzover de peildatum is gelegen voor 1 juli 2002, wordt:

      a. voor de toepassing van [artikel 3, derde lid, onderdeel a, onder][ref1] het gecorrigeerde verzamelinkomen
      verstaan het belastbare inkomen, bedoeld in de Wet op de inkomstenbelasting 1964;

      b. voor de toepassing van [artikel 3, derde lid, onderdeel b,][ref2] onder het aldaar genoemde loon
      verstaan het loon, bedoeld in de [Wet op de loonbelasting 1964][ref3], verminderd met het krachtens
      [artikel 17, eerste lid, van die wet][ref4], aftrekbare percentage of bedrag;

      c. voor de toepassing van [artikel 4, eerste lid][ref5], en van onderdeel e van dit artikel onder rekenvermogen
      verstaan het gezamenlijk vermogen op 1 januari 2000 van degenen die behoren tot het huishouden van de eigenaar-
      bewoner;

      d. voor de toepassing van [artikel 4, tweede lid][ref6], en van onderdeel e van dit artikel onder vermogen verstaan
      het vermogen, bedoeld in hoofdstuk II, met uitzondering van artikel 5, van de Wet op de vermogensbelasting 1964,
      met dien verstande dat bij algemene maatregel van bestuur:

      1°. waarderingsgrondslagen kunnen worden vastgesteld met betrekking tot motorrijtuigen, en

      2°. regels kunnen worden vastgesteld met betrekking tot de waardering van een aandeel in een vermogen waarover de
      eigenaar-bewoner of degene die tot diens huishouden behoort kon beschikken;

      e. voor de bepaling van het rekenvermogen, naast toepassing van [artikel 4][ref7] :

      1.° in afwijking van [artikel 4, tweede lid][ref8], de waarde, verminderd met de daarop rustende hypothecaire
      schuld, van een eigen woning als bedoeld in artikel 9, vierde lid, van de Wet op de vermogensbelasting 1964, ten
      behoeve waarvan een eigenwoningbijdrage of een bijzondere bijdrage als bedoeld in [artikel 34][ref9], is of wordt
      toegekend, slechts onder vermogen verstaan voorzover die aldus verminderde waarde hoger is dan f 52 000, en

      2°. indien toepassing wordt gegeven aan [artikel 16, eerste lid][ref10], in de in dat artikellid bedoelde algemene
      maatregel van bestuur tevens bepaald welk bedrag in plaats van het onder 1° genoemde bedrag in de betrokken
      provincies zal gelden, en bepaald op welke wijze eerstbedoeld bedrag wordt of kan worden aangepast;

      f. voor de toepassing van [artikel 9, eerste lid, onderdeel b][ref11], voor «€ 35 200» gelezen: € 27 090,68;

      g. voor de toepassing van [artikel 33, eerste lid, onderdeel a, onder][ref12] een gecorrigeerd verzamelinkomen
      verstaan: een belastbaar inkomen, en

      h. voor de toepassing van [artikel 41, eerste lid, onder][ref13] inkomens verstaan belastbare inkomens.


