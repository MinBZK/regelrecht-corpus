  - number: '2'
    text: |-
      1 Degenen die behoren tot het huishouden van de eigenaar-bewoner, bedoeld in deze wet en de daarop berustende
      bepalingen, zijn de eigenaar-bewoner en:

      a. zijn niet duurzaam gescheiden levende echtgenoot of geregistreerde partner, of

      b. degene die gezamenlijk met de eigenaar-bewoner de woning bewoont en daarin met hem een gezamenlijke huishouding
      voert, niet zijnde een bloed- of aanverwant van de eigenaar-bewoner of een pleegkind.

      2 Naast de eigenaar-bewoner kan slechts één andere persoon tot diens huishouden behoren.

      3 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. eenpersoonshuishouden: het huishouden van een eigenaar-bewoner die jonger dan 65 jaar was op 1 januari van het
      peiljaar, en waartoe geen persoon behoort als bedoeld in het eerste lid, onder a en b;

      b. tweepersoonshuishouden: het huishouden van een eigenaar-bewoner waartoe een persoon behoort als bedoeld in
      het eerste lid, onder a en b, als het aandeel in het rekeninkomen, afkomstig van degenen die op 1 januari van het
      peiljaar 65 jaar of ouder waren, de helft of minder bedraagt;

      c. eenpersoonsouderenhuishouden: het huishouden van een eigenaar-bewoner die 65 jaar of ouder was op 1 januari van
      het peiljaar, en waartoe geen persoon behoort als bedoeld in het eerste lid, onder a en b;

      d. tweepersoonsouderenhuishouden: het huishouden van een eigenaar-bewoner waartoe een persoon behoort als bedoeld
      in het eerste lid, onder a en b, als het aandeel in het rekeninkomen, afkomstig van degenen die op 1 januari van
      het peiljaar 65 jaar of ouder waren, meer dan de helft bedraagt.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 Het rekeninkomen, bedoeld in deze wet en de daarop berustende bepalingen, is:

      a. bij een primaire toekenning: het gezamenlijk inkomen over het peiljaar van degenen die behoren tot het
      huishouden van de eigenaar-bewoner en

      b. bij een andere toekenning dan een primaire: dat gezamenlijk inkomen, vermeerderd met het naar een jaarbedrag
      herrekend fiscaal effect.

      2 Bij de bepaling van het gezamenlijk inkomen wordt elk persoonlijk inkomen dat negatief is op nul gesteld.

      3 In deze wet en de bepalingen die daarop berusten wordt onder inkomen verstaan:

      a. als over het peiljaar een aanslag inkomstenbelasting is of wordt vastgesteld: het gecorrigeerde verzamelinkomen;

      b. in een ander geval dan bedoeld onder a: het gecorrigeerde belastbare loon.

      4 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel3
  - number: '4'
    text: |-
      1 Het rekenvermogen, bedoeld in deze wet en de bepalingen die daarop berusten, is het gezamenlijk vermogen van
      degenen die behoren tot het huishouden van de eigenaar-bewoner.

      2 Onder vermogen wordt verstaan: de gemiddelde rendementsgrondslag, bedoeld in
      [artikel 5.2 van de Wet inkomstenbelasting 2001][ref1], met dien verstande dat die grondslag
      wordt bepaald zonder rekening te houden met de vrijstelling kapitaalverzekeringen voor kinderen,
      bedoeld in [artikel 5.12 van die wet][ref2], de vrijstelling maatschappelijke beleggingen, bedoeld
      in [afdeling 5.3 van die wet][ref3] en de vrijstelling beleggingen in durfkapitaal, bedoeld in
      [afdeling 5.3a van die wet][ref4].


