  - number: '6'
    text: |-
      1 Als aan deze wet wordt voldaan, kent Onze Minister, ter tegemoetkoming in de kosten van het in eigendom
      verkrijgen en vervolgens kunnen blijven bewonen van een woning, op aanvraag aan de eigenaar-bewoner:

      a. vijf maal een eigenwoningbijdrage toe over vijf achtereenvolgende driejaarstijdvakken, en vervolgens

      b. een maal een eigenwoningbijdrage toe over ten hoogste de 15 bijdragejaren die direct volgen op het vijfde
      driejaarstijdvak, overeenkomstig [hoofdstuk 5][ref1].

      2 Ten aanzien van een bepaalde eigenaar-bewoner kan slechts één maal van een primaire toekenning sprake zijn.

      3 Een eigenwoningbijdrage wordt slechts toegekend ten behoeve van het in eigendom verkrijgen en vervolgens kunnen
      blijven bewonen van een woning.

      4 Bij verhuizing van de eigenaar-bewoner na de primaire toekenning blijft het in het eerste lid bedoelde recht op
      een eigenwoningbijdrage in stand, mits hij de woning naar welke hij verhuist in eigendom verkrijgt en vervolgens
      bewoont en de situatie, bedoeld in [artikel 25, eerste lid, onder a, b en c][ref2], zich niet voordoet.

      5 [Titel 4.2 van de Algemene wet bestuursrecht][ref3] is niet van toepassing op eigenwoningbijdragen krachtens
      deze wet.

      6 De [hoofdstukken 2][ref4] en [3][ref5] van deze wet zijn uitsluitend van toepassing op eigenwoningbijdragen als
      bedoeld in het eerste lid, onder a, tenzij [hoofdstuk 4][ref6] of [5][ref7] van deze wet anders bepaalt.


