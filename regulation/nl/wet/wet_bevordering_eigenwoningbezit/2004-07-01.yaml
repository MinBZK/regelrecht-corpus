  - number: '34'
    text: |-
      1 Onze Minister kent op aanvraag aan een eigenaar-bewoner een bijzondere bijdrage toe ter tegemoetkoming in de
      kosten van het in eigendom verkrijgen van een woning, indien voor het einde van het driejaarstijdvak blijkt dat het
      actueel inkomen ten minste 20 procent lager ligt dan het meetinkomen.

      2 De hoogte van de bijzondere bijdrage wordt bepaald door, op de wijze die is bedoeld in [artikel 30][ref1], het
      bedrag te berekenen van de eigenwoningbijdrage dat behoort bij het actueel inkomen, en dit bedrag te verminderen
      met het bedrag van de eigenwoningbijdrage dat behoort bij het meetinkomen.

      3 De [artikelen 5][ref2], [6, derde, vierde en vijfde lid][ref3], [7][ref4], [9 tot en met 23][ref5] en
      [25 tot en met 31][ref6] zijn van overeenkomstige toepassing, met dien verstande dat deze artikelen, voorzover
      ze slechts gelden voor primaire toekenningen, niet van toepassing zijn indien de eigenaar-bewoner reeds een
      eigenwoningbijdrage of een bijzondere bijdrage is toegekend.

      4 Voor de toepassing van het begrip «bijdragetijdvak», genoemd in het eerste lid, wordt de eigenaar-bewoner geacht
      tevens een eigenwoningbijdrage te hebben aangevraagd.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid.


