  - number: '51'
    text: |-
      1 Een bedrag als bedoeld in [artikel 50, derde en vierde lid][ref1], wordt ingevorderd door Onze Minister.

      2 Als de eigenaar-bewoner in gebreke blijft het door hem verschuldigde bedrag te voldoen binnen de daarvoor
      gestelde termijn, zendt Onze Minister hem een aanmaning om binnen een vastgestelde termijn van ten minste vier
      weken na dagtekening van de aanmaning het verschuldigde bedrag te voldoen.

      3 Als de eigenaar-bewoner ook na aanmaning in gebreke blijft, kan de invordering van het verschuldigde bedrag,
      vermeerderd met de kosten van aanmaning en invordering, zonder rechterlijke tussenkomst geschieden bij dwangbevel.

      4 De betekening en tenuitvoerlegging van het dwangbevel geschieden door de ontvanger van de rijksbelastingen
      en door de belastingdeurwaarder van de rijksbelastingen, met toepassing van de [artikelen 13][ref2] en
      [14 van de Invorderingswet 1990][ref3].

      5 Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref4], alsmede verrekenen op grond van [artikel 24 van die wet][ref5].

      6 De ontvanger kan, zolang hij met de zorg voor de invordering is belast, onder door hem te stellen voorwaarden
      aan de eigenaar-bewoner voor een bepaalde tijd bij beschikking uitstel van betaling verlenen. Gedurende het uitstel
      wordt de dwanginvordering geschorst. Het uitstel kan tussentijds bij beschikking worden beëindigd.

      7 Met betrekking tot het verzet tegen de tenuitvoerlegging van het dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref6] van overeenkomstige toepassing, met dien verstande dat in dat
      artikel in plaats van «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens moet worden gelezen: de met de
      tenuitvoerlegging van het dwangbevel belaste ontvanger.

      8 De kosten van aanmaning en verdere invordering worden berekend op de voet van de
      [Kostenwet invordering rijksbelastingen][ref7]. De [artikelen 6][ref8] en [7 van de Invorderingswet 1990][ref9]
      zijn van overeenkomstige toepassing.


