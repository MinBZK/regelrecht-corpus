  - number: '25'
    text: |-
      1 Als de eigenaar-bewoner in de loop van het driejaarstijdvak de eigendom van de woning verliest, wordt de
      eigenwoningbijdrage op naam gesteld van diens echtgenoot, geregistreerde partner of bloed- of aanverwant in de
      eerste of tweede graad, als deze:

      a. ten minste voor de helft eigenaar van die woning blijft of wordt, dan wel een beperkt recht op die woning
      verkrijgt;

      b. die woning op het tijdstip van het verlies van de eigendom, bedoeld in de aanhef, bewoonde en

      c. die woning blijft bewonen.

      2 Bij een verlies van de eigendom van de woning als bedoeld in het eerste lid zonder dat daarvoor de eigendom van
      een andere woning in de plaats komt, en waarbij voorts niet wordt voldaan aan onderdeel a, b of c van dat lid, is
      [artikel 50, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel50
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '50'
        hoofdstuk: '8'
  - number: '26'
    text: |-
      1 Het percentage van de normrente wordt bij ministeriële regeling vastgesteld met inachtneming van de
      hypotheekrente die wordt gehanteerd bij het verstrekken van hypothecaire leningen in een vorm als bedoeld in
      [artikel 23, onder b][ref1].

      2 Als in de ministeriële regeling, bedoeld in [artikel 23, onder b][ref2], is bepaald dat de hypothecaire lening
      wordt afgesloten in de vorm van een spaarhypotheek, wordt in de regeling, bedoeld in het eerste lid, tevens
      een normbedrag voor de per maand te betalen spaarpremie vastgesteld, uitgaande van een hypothecaire lening van
      € 50 000.

      3 Het percentage, bedoeld in het eerste lid, en het normbedrag, bedoeld in het tweede lid, kunnen bij ministeriële
      regeling worden gewijzigd als daartoe aanleiding bestaat als gevolg van de ontwikkeling van de hypotheekrente,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel23
