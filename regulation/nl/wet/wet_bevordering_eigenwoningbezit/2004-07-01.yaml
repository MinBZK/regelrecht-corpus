      1 Voor een primaire toekenning is vereist dat het bedrag dat voor het eerste driejaarstijdvak is berekend met
      toepassing van [artikel 30, tweede lid][ref1], ten hoogste € 152,47  is.

      2 Indien toepassing wordt gegeven aan [artikel 16, eerste lid][ref2], wordt in de in dat artikellid bedoelde
      algemene maatregel van bestuur tevens bepaald welk bedrag in plaats van het in het eerste lid van dit artikel
      genoemde bedrag in de betrokken provincies zal gelden, en bepaald op welke wijze eerstbedoeld bedrag wordt of kan
      worden toegepast.

      3 Het in het eerste lid genoemde bedrag wordt met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 41][ref3].


