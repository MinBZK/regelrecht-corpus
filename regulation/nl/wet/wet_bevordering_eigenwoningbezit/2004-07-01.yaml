      1 Bij ministeriële regeling kan een rentevaste periode worden bepaald, waarvoor de lening of het krediet in
      rekening-courant ter financiering van het in eigendom verkrijgen van een woning met als zekerheid hypotheek
      op die woning dient te zijn afgesloten, om in aanmerking te komen voor een eigenwoningbijdrage als bedoeld in
      [artikel 6, eerste lid, onder b][ref1].

      2 Op een toekenning van een eigenwoningbijdrage als bedoeld in [artikel 6, eerste lid, onder b][ref2], zijn de
      [artikelen 6, derde, vierde en vijfde lid][ref3], [7][ref4], [8][ref5], [9][ref6], [23, onder a][ref7], en
      [24 tot en met 29][ref8] van overeenkomstige toepassing.


