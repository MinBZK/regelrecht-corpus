  - number: '8'
    text: |-
      1 Een eigenwoningbijdrage wordt niet toegekend als het rekeninkomen meer bedraagt dan:

      a. € 16 948,69 bij een eenpersoonshuishouden;

      b. € 22 711,70 bij een tweepersoonshuishouden;

      c. € 15 042,81 bij een eenpersoonsouderenhuishouden;

      d. € 19 625,99 bij een tweepersoonsouderenhuishouden.

      2 De in het eerste lid genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel41
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '41'
        hoofdstuk: '6'
  - number: '9'
    text: |-
      1 Een eigenwoningbijdrage wordt niet toegekend als het rekenvermogen meer bedraagt dan:

      a. € 18 378,10 bij een eenpersoonshuishouden, als de eigenaar-bewoner op de laatste dag van het eerste bijdragejaar
      van een driejaarstijdvak jonger is dan 65 jaar;

      b. € 35 200 bij een tweepersoonshuishouden, als de eigenaar-bewoner en degene die tot diens huishouden behoort op
      de laatste dag van het eerste bijdragejaar van een driejaarstijdvak jonger zijn dan 65 jaar;

      c. € 31 424,28 bij een eenpersoonshuishouden of een eenpersoonsouderenhuishouden, als de eigenaar-bewoner op de
      laatste dag van het eerste bijdragejaar van een driejaarstijdvak 65 jaar of ouder is;

      d. € 43 517,52 bij een tweepersoonshuishouden of een tweepersoonsouderenhuishouden, als de eigenaar-bewoner of
      degene die tot diens huishouden behoort op de laatste dag van het eerste bijdragejaar van een driejaarstijdvak 65
      jaar of ouder is.

      2 De in het eerste lid genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel41
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011919
        artikel: '41'
        hoofdstuk: '6'
  - number: '10'
    text: |-
      1 Een eigenwoningbijdrage wordt slechts toegekend als, tot zekerheid van de nakoming door de eigenaar-bewoner
      van de verplichtingen uit hetzij de hypothecaire lening hetzij een daaropvolgende lening of daaropvolgend krediet
      in rekening-courant ter financiering van het in eigendom verkrijgen van een woning met als zekerheid hypotheek
      op die woning, voor die lening of dat krediet een garantie is afgegeven door de Stichting Waarborgfonds Eigen
      Woningen of een instelling die daarmee, op het punt van de garantieverstrekking, naar het oordeel van Onze Minister
      vergelijkbaar is.

      2 De af te geven garantie is de onder auspiciën van de Stichting Waarborgfonds Eigen Woningen ontwikkelde Nationale
      Hypotheek Garantie. De voorwaarden en normen voor die garantie zijn van toepassing, tenzij deze wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel10
  - number: '11'
    text: |-
      1 Voor een primaire toekenning is vereist dat:

      a. de eigenaar-bewoner op de peildatum 23 jaar of ouder is en

      b. het rekeninkomen ten minste gelijk is aan:

      1 e. voor een eenpersoonshuishouden: de naar een jaarinkomen in het peiljaar herrekende som van de bedragen,
      bedoeld in de [artikelen 21, onder a][ref1], en [25, tweede lid, van de Wet werk en bijstand][ref2], of een
      daarmee, volgens bij ministeriële regeling te stellen regels, vergelijkbaar bedrag;

      2 e. voor een tweepersoonshuishouden: het naar een jaarinkomen in het peiljaar herrekende bedrag,
      [bedoeld in artikel 21, onder c, van de Wet werk en bijstand][ref3], of een daarmee, volgens bij ministeriële
      regeling te stellen regels, vergelijkbaar bedrag;

      3 e. voor een eenpersoonsouderenhuishouden: het naar een jaarinkomen in het peiljaar herrekende bedrag, bedoeld in
      [artikel 9, tiende lid, onder a, van de Algemene Ouderdomswet][ref4], vermeerderd met de vakantietoeslag, bedoeld
      in [artikel 29, negende lid, onder c, van die wet][ref5], en verder vermeerderd met € 1675, of een met dat aldus
      vermeerderde bedrag, volgens bij ministeriële regeling te stellen regels, vergelijkbaar bedrag;

      4 e. voor een tweepersoonsouderenhuishouden: twee maal het naar een jaarinkomen in het peiljaar herrekende
      bedrag, bedoeld in [artikel 9, tiende lid, onder b, van de Algemene Ouderdomswet][ref6], vermeerderd met
      de vakantietoeslag, bedoeld in [artikel 29, negende lid, onder a, van die wet][ref7], en verder vermeerderd
      met € 1050, of een met dat aldus vermeerderde bedrag, volgens bij ministeriële regeling te stellen regels,
      vergelijkbaar bedrag.

      2 In afwijking van het eerste lid, aanhef en onder b, kan een eigenwoningbijdrage worden toegekend als de eigenaar-
      bewoner in de aanvraag aannemelijk maakt dat op het tijdstip van indiening daarvan wordt voldaan aan het eerste
      lid, onder b.


