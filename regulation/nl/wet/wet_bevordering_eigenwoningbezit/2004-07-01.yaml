  - number: '35'
    text: |-
      1 Het bijdragetijdvak vangt aan op de eerste dag van de kalendermaand die volgt op de inkomensdaling door welke het
      recht op de bijzondere bijdrage volgens de aanvraag is ontstaan.

      2 Op een aanvraag wordt binnen zes weken na de indiening beslist. Voor ingewikkelde gevallen kan Onze Minister die
      termijn, onder opgaaf van redenen, met ten hoogste vier weken verlengen. Een zodanig besluit wordt aan de aanvrager
      bekendgemaakt binnen zes weken na de indiening van de aanvraag.

      3 De bijzondere bijdrage wordt steeds toegekend voor een tijdvak van ten hoogste zes maanden; dat tijdvak ligt in
      één driejaarstijdvak.

      4 Onze Minister kan op aanvraag voorschotten verstrekken terzake van de bijzondere bijdrage.

      5 De bijzondere bijdrage wordt steeds over een tijdvak van ten hoogste zes maanden uitbetaald, na afloop van dat
      tijdvak, onder verrekening van de betaalde voorschotten.

      6 De [artikelen 42, eerste en derde lid][ref1], [44, eerste lid, derde en vijfde volzin][ref2],
      [45 tot en met 49][ref3] en [54][ref4] zijn van overeenkomstige toepassing, met dien verstande dat in
      [artikel 48, eerste lid][ref5], voor «bij de aanvraag» steeds wordt gelezen: bij de aanvragen, gedurende het
      driejaarstijdvak, die een eigenaar-bewoner heeft gedaan tot toekenning van een bijzondere bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0011919#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011919#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0011919#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0011919#Artikel54
