  - number: '45'
    text: |-
      1 De eigenwoningbijdrage is niet vatbaar voor vervreemding, verpanding, belening, beslag of uitwinning en verhaal,
      behoudens dat beslag, verhaal en, in geval van verpanding, uitwinning is toegestaan met het oog op inning van de
      hypotheeklast.

      2 Elk beding, strijdig met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel45
  - number: '46'
    text: |-
      1 Degenen die tot het huishouden van de eigenaar-bewoner behoren zijn verplicht uit eigen beweging aan
      Onze Minister onmiddellijk alle inlichtingen te verstrekken waarover zij redelijkerwijs kunnen beschikken,
      en die redelijkerwijs van belang kunnen zijn voor de vaststelling van het recht op en de hoogte van de
      eigenwoningbijdrage.

      2 De in het eerste lid bedoelde personen zijn verplicht de in dat lid bedoelde gegevens desgevraagd te verstrekken
      aan Onze Minister en aan de door hem daartoe aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel46
  - number: '47'
    text: |-
      1 De financier is verplicht aan Onze Minister op diens verzoek onmiddellijk inlichtingen met betrekking tot de
      hypothecaire lening te verstrekken waarover hij redelijkerwijs kan beschikken, en die redelijkerwijs van belang
      kunnen zijn voor de vaststelling van het recht op en de hoogte van de eigenwoningbijdrage.

      2 Onze Minister stelt de eigenaar-bewoner in kennis van elke gegevensverstrekking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011919/2004-07-01#Artikel47
  - number: '48'
    text: |-
      1 De inspecteur der rijksbelastingen onderzoekt de juistheid van de bij de aanvraag verstrekte gegevens inzake
      het vermogen van degenen die tot het huishouden van de eigenaar-bewoner behoren. Als de inspecteur vaststelt dat
      het vermogen van de eigenaar-bewoner of van een persoon die tot zijn huishouden behoort afwijkt van het bij de
      aanvraag opgegeven vermogen, en dat ten gevolge hiervan de krachtens [artikel 9][ref1] toepasselijke vermogensgrens
      zou worden overschreden, stelt hij het rekenvermogen vast bij voor bezwaar vatbare beschikking, en maakt hij deze
      bekend aan de eigenaar-bewoner en aan Onze Minister.

      2 Ten aanzien van het onderzoek en de vaststelling, bedoeld in het eerste lid, zijn de [artikelen 2][ref2],
      [3][ref3] en [4][ref4] en de [hoofdstukken V][ref5] en [VIII][ref6], met uitzondering van de
      [artikelen 47a][ref7], [52][ref8], [53, tweede en derde lid][ref9], [54][ref10], [63][ref11] en
      [66, van de Algemene wet inzake rijksbelastingen][ref12] van overeenkomstige toepassing.


