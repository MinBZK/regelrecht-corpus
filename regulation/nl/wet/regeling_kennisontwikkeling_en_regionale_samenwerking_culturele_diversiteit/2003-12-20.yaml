        artikel: '8'
  - number: '5'
    text: |-
      1 De instelling verklaart in de intentieverklaring dat in december 2002 een plan van aanpak, in juni 2004 een
      tussenrapportage en in december 2005 een eindrapportage aan de minister gezonden wordt.

      2 De intentieverklaring wordt ingediend voor 1 oktober 2002.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel5
  - number: '6'
    text: |-
      1 In het plan van aanpak is opgenomen:

      a. de resultaten van een regioanalyse van de instelling;

      b. een plan waarin, gebaseerd op de regio-analyse, wordt beschreven welke kwalitatieve en kwantitatieve doelen de
      instelling stelt voor de volgende drie jaren, en hoe men deze denkt te bereiken, en

      c. een voorstel voor kennisontwikkeling en ontwikkelen van een intercultureel curriculum.

      2 De regio-analyse, bedoeld in het eerste lid, bevat in ieder geval:

      a. een overzicht van demografische ontwikkelingen met betrekking tot allochtonen in de regio waarin de instelling
      is gevestigd;

      b. een overzicht van het onderwijsaanbod in de regio en de deelname van allochtone leerlingen en studenten daarin;

      c. een overzicht van expertisecentra, gemeentes, maatschappelijke organisaties en onderwijsinstellingen die op
      enigerlei wijze te maken hebben met de integratie van minderheden en deel van het regionale netwerk vormen.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel6
  - number: '7'
    text: |-
      1 In de tussenrapportage is omschreven in hoeverre de kwalitatieve en kwantitatieve doelen, genoemd in het plan van
      aanpak, zijn gerealiseerd.

      2 De tussenrapportage omvat tevens een overzicht van de stand van zaken terzake van de financiën.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel7
  - number: '8'
    text: |-
      1 In de eindrapportages is omschreven in hoeverre de kwalitatieve en kwantitatieve doelstellingen, genoemd in het
      plan van aanpak, zijn gerealiseerd.

      2 De eindrapportage omvat tevens een financiële verantwoording van de besteding van de aanvullende vergoeding.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel8
  - number: '9'
    text: |-
      1 Het bevoegd gezag van een agrarisch opleidingscentrum verantwoordt de aanvullende vergoeding door middel van
      een financiële verantwoording zoals omschreven in de regeling Financieel jaarverslag (jaarrekening) voor de
      instellingen.

      2 Het instellingsbestuur van een instelling voor hoger agrarisch onderwijs en van Wageningen universiteit
      verantwoordt de aanvullende vergoeding door middel van een afzonderlijke verantwoording in de jaarrekening, bedoeld
      in [artikel 2.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel9
