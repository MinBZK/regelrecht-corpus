preamble:
  text: |-
    Gelet op artikel 2.2.3, derde lid, van de Wet educatie en beroepsonderwijs en artikel 2 van de Kaderwet LNV-
    subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* minister van Landbouw, Natuurbeheer en Visserij;

      b. *instelling:*

      1. agrarisch opleidingscentrum;

      2. instelling voor hoger agrarisch beroepsonderwijs;

      3. Wageningen universiteit;

      c. *groen onderwijs:* onderwijs op het gebied van de landbouw en natuurlijke omgeving;

      d. *allochtonen:* personen die zelf geboren zijn in, of van wie tenminste één ouder of grootouder geboren is in
      Turkije, Marokko, Suriname, de Nederlandse Antillen, Aruba, voormalig Joegoslavië of overige landen in Zuid- en
      Midden-Amerika, Afrika of Azië, met uitzondering van Japan en voormalig Nederlands-Indië.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel1
  - number: '2'
    text: |-
      De minister kan in de jaren 2002 tot en met 2005 jaarlijks een aanvullende bijdrage aan instellingen verlenen ten
      behoeve van bevordering van deelname van allochtonen aan groen onderwijs.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel2
  - number: '3'
    text: |-
      De aanvullende vergoeding voor instellingen bedraagt per instelling een voor die instelling evenredig deel van de
      totale beschikbare rijksbijdrage:

      a. voor het jaar 2002, van € 306.300,-;

      b. voor het jaar 2003, van € 200.700,-;

      c. voor het jaar 2004, van € 200.700,-, en

      d. voor het jaar 2005, van € 200.700,-.
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel3
  - number: '4'
    text: |-
      1 De minister verstrekt de aanvullende vergoeding voor het jaar 2002 na ontvangst van de intentieverklaring die
      voldoet aan de voorwaarden, bedoeld in [artikel 5][ref1].

      2 De minister verstrekt de aanvullende vergoeding voor het jaar 2003 na ontvangst van een plan van aanpak dat
      voldoet aan de voorwaarden, bedoeld in [artikel 6][ref2].

      3 De minister verstrekt de aanvullende vergoeding voor het jaar 2004 na ontvangst en goedkeuring van de
      tussenrapportage als genoemd in [artikel 7][ref3].

      4 De minister verstrekt de aanvullende vergoeding voor het jaar 2005 na ontvangst en goedkeuring van de
      eindrapportage zoals genoemd in [artikel 8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013945#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013945#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013945#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0013945#Artikel8
    url: https://wetten.overheid.nl/BWBR0013945/2003-12-20#Artikel4
    references:
      - id: ref1
