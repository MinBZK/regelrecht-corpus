  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Deze regeling wordt aangehaald als: Kaderregeling subsidiëring natuurprojecten.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel14
