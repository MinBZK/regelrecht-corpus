preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            project:

              geheel van activiteiten gericht op één of meer concrete resultaten op het gebied van natuur, bos of
      landschap;



            c
             thema:

              beleidscategorie op het gebied van natuur, bos of landschap.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel1
  - number: '2'
    text: |-
      De minister kan op aanvraag subsidies verstrekken voor projecten die een bijdrage leveren aan de realisering van
      één of meer van de doelstellingen binnen een thema.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister stelt bij nader besluit vast voor welke thema’s aanvragen voor subsidie kunnen worden ingediend, en
      geeft daarbij voor elk thema aan:

      a. de beoordelingsmaatstaven;

      b. wie een aanvraag kunnen indienen;

      c. de subsidiabele kosten;

      d. het percentage van de subsidiabele kosten dat voor subsidie in aanmerking komt, dan wel een vast bedrag;

      e. de periode waarin de aanvraag ingediend kan worden, en

      f. bij welke instantie de aanvraag wordt ingediend.

      2 De minister kan voor een thema bij nader besluit instellingen aanwijzen aan welke hij bij uitsluiting subsidie
      verstrekt.

      3 De minister kan voor een thema jaarlijks een subsidieplafond vaststellen.

      4 De minister verdeelt het beschikbare bedrag naar de datum van ontvangst van de aanvragen, met dien verstande dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag is aangevuld, met betrekking tot de verdeling als datum van
      ontvangst geldt.

      5 De minister geeft van de besluiten, bedoeld in het eerste, tweede en derde lid, kennis in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '4'
    text: |-
      Geen subsidie wordt verstrekt voor projecten waarmee reeds een aanvang is gemaakt alvorens de aanvraag tot
      subsidieverlening schriftelijk is bevestigd.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Subsidie kan worden verleend voor ten minste één tijdvak van een jaar en ten hoogste vijf aaneengesloten tijdvakken
      van een jaar.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een aanvraag tot verlening van subsidie gaat vergezeld van een projectplan.

      2 Het projectplan houdt in ieder geval het volgende in:

      a. een beschrijving van het project, waarin is opgenomen een probleemanalyse, het doel van het project, de noodzaak
      van het project alsmede de noodzaak van de kosten;

      b. een sluitende begroting voor het project alsmede een toelichting daarop. Indien het een meerjarig project
      betreft dient de begroting een meerjarenbegroting te zijn met een liquiditeitsplanning per jaar;

      c. de realisatietermijn.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 De minister geeft een beschikking omtrent subsidieverlening binnen drie maanden na afloop van de desbetreffende
      aanvraagperiode.

      2 Voorzover bij nader besluit is bepaald dat aanvragen gedurende het gehele kalenderjaar kunnen worden ingediend,
      beslist de minister omtrent subsidieverlening binnen drie maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Indien de uitvoering van het project langer is dan één jaar, rapporteert de subsidieontvanger tenminste eenmaal per
      jaar op een door de minister te bepalen wijze omtrent de voortgang van het project.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 De minister kan de subsidieontvanger op diens verzoek voorschotten verstrekken van ten hoogste 80% van het bedrag
      vermeld in de beschikking tot subsidieverlening.

      2 In bijzondere gevallen kan de minister de subsidieontvanger op diens verzoek voorschotten verstrekken van ten
      hoogste 95% van het bedrag vermeld in de beschikking tot subsidieverlening.

      3 Ingeval subsidie is verleend voor meerdere aaneengesloten tijdvakken van een jaar, kan per tijdvak één voorschot
      worden verstrekt, met dien verstande dat het in het eerste dan wel tweede lid genoemde percentage naar rato wordt
      verdeeld over de onderscheiden tijdvakken.

      4 De minister kan naar aanleiding van een ontvangen aanvraag tot voorschotverlening de subsidieontvanger verzoeken
      een overzicht van de liquiditeitsbehoefte te overleggen.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel9
  - number: '10'
    text: |-
      1 Voorzover de subsidie is verleend voor één tijdvak van een jaar, dient de subsidieontvanger binnen twee maanden
      na afloop van het project een aanvraag tot subsidievaststelling in.

      2 Voorzover de subsidie is verleend voor meerdere aaneengesloten tijdvakken van een jaar, dient de
      subsidieontvanger telkens binnen twee maanden na afloop van een tijdvak van een jaar een aanvraag tot
      subsidievaststelling over dat tijdvak in, met dien verstande dat na het laatste tijdvak de aanvraag wordt ingediend
      binnen twee maanden na afloop van het project.
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel10
  - number: '11'
    text: |-
      1 Indien de totale subsidiabele kosten meer bedragen dan € 22.689,01 gaat de aanvraag
      tot subsidievaststelling vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] waaruit blijkt dat voldaan is aan de bij of
      krachtens deze regeling gestelde voorwaarden en verplichtingen.

      2 De goedkeurende accountantsverklaring wordt opgesteld overeenkomstig de in [bijlage 1][ref2] opgenomen model-
      accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0009851
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0009851
  - number: '12'
    text: |-
      De minister geeft binnen drie maanden na ontvangst van de in [artikelen 10][ref1] en [11][ref2] bedoelde bescheiden
      een beschikking omtrent subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009851#Artikel11
    url: https://wetten.overheid.nl/BWBR0009851/2002-01-01#Artikel12
    references:
