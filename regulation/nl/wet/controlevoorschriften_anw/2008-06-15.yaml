        hoofdstuk: '1'
  - number: '8'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling maakt controle mogelijk door personen die
      daarmee door de Bank zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008019
        artikel: '2'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling binnen de door de
      Bank gestelde termijn over:

      1. een naar waarheid en volledig ingevuld, ondertekend formulier inzake het inkomen van de nabestaande;

      2. bewijsstukken van dit inkomen;

      3. een naar waarheid en volledig ingevuld, ondertekend formulier inzake de leefsituatie van de nabestaande;

      4. indien het in [artikel 14, eerste lid, onder a, Anw][ref2] bedoelde kind geen eigen of aangehuwd kind van de
      nabestaande is en inkomen heeft: bewijsstukken van dit inkomen;

      5. indien het in [artikel 14, eerste lid, onder a, Anw][ref3] bedoelde kind geen eigen of aangehuwd kind van de
      nabestaande is en een derde in het onderhoud van dit kind bijdraagt: bewijsstukken van deze bijdrage;

      6. indien het in [artikel 14, eerste lid, onder a, Anw][ref4] bedoelde kind geen eigen of aangehuwd kind van de
      nabestaande is en niet tot het huishouden van de nabestaande behoort: een opgave van de bijdrage van de nabestaande
      in het onderhoud van het kind en bewijsstukken van deze bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel14
