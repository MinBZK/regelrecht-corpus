        artikel: '22'
  - number: '11'
    text: |-
      Als de wees 16 jaar of ouder is en onderwijs volgt, zorgt de in [artikel 2, eerste lid][ref1], bedoelde persoon
      ervoor dat, op verzoek van de Bank, een schoolverklaring door de onderwijsinstelling wordt ingevuld en ondertekend.
      Daarna doet deze persoon de verklaring binnen de door de Bank gestelde termijn aan de Bank toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel11
