        artikel: '5'
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. de nabestaande;

      b. de wees;

      c. de wettelijke vertegenwoordiger van de nabestaande of de wees;

      d. de instelling waaraan ingevolge [artikel 49][ref1] of [artikel 57 Anw][ref2] de uitkering wordt uitbetaald.

      2 Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen in het buitenland wonen en als de in
      het eerste lid bedoelde instelling in het buitenland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
  - number: '3'
    text: |-
      1 Degene die in aanmerking wil komen voor een uitkering dient een schriftelijke aanvraag, ondertekend en gedateerd
      in. Hij maakt gebruik van een door de Bank ter beschikking gesteld formulier.

      2 Het formulier wordt ingediend op een door de Bank aangegeven adres.
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling stelt de Bank onverwijld in kennis van een
      wijziging in het adres van de uitkeringsgerechtigde of zijn wettelijke vertegenwoordiger.

      2 De kennisgeving bedoeld in het eerste lid kan bij een verhuizing in Nederland achterwege
      blijven, indien de wijziging in het adres aan de gemeente is gemeld binnen de in de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref2] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008019
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
  - number: '5'
    text: |-
      1 Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref1], bedoelde persoon binnen de door de Bank
      gestelde termijn en met gebruikmaking van de door de Bank ter beschikking gestelde formulieren informatie welke van
      belang kan zijn voor het recht op of de hoogte van de uitkering, het geldend maken van het recht op uitkering of de
      uitbetaling van de uitkering.

      2 Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref2], bedoelde persoon of instelling binnen de door de
      Bank gestelde termijn bewijsstukken over welke van belang zijn voor de vaststelling van het recht op uitkering of
      de hoogte van de uitkering, het geldend maken van het recht op uitkering of de uitbetaling van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008019#Artikel2
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel5
    references:
      - id: ref1
