preamble:
  text: |-
    Gelet op artikel 36, eerste lid, van de Algemene nabestaandenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de Anw: de [Algemene nabestaandenwet][ref1];

      b. de Bank: de Sociale Verzekeringsbank;

      c. uitkering: een nabestaandenuitkering, halfwezenuitkering of wezenuitkering als bedoeld in
      [Hoofdstuk 3, Afdeling I, van de Anw][ref2];

      d. de uitkeringsgerechtigde: degene aan wie een uitkering is toegekend;

      e. nabestaande: degene die een nabestaandenuitkering of een halfwezenuitkering ontvangt dan wel voor een zodanige
      uitkering in aanmerking wenst te komen;

      f. kind: het kind van de nabestaande in de zin van [artikel 5 Anw][ref3], voorzover dit kind ongehuwd is, jonger is
      dan 18 jaar en niet tot het huishouden van een ander dan de nabestaande behoort;

      g. wees: degene aan wie een wezenuitkering is toegekend, die een zodanige uitkering heeft aangevraagd dan wel voor
      wie een zodanige uitkering is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel5
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel1
