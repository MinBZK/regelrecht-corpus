  - number: '10'
    text: |-
      Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling binnen de door de
      Bank gestelde termijn over:

      1. indien het in [artikel 22 Anw][ref2] bedoelde kind geen eigen of aangehuwd kind van de nabestaande is en inkomen
      heeft: bewijsstukken van dit inkomen;

      2. indien het in [artikel 22 Anw][ref3] bedoelde kind geen eigen of aangehuwd kind van de nabestaande is en een
      derde in het onderhoud van dit kind bijdraagt: bewijsstukken van deze bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel22
    url: https://wetten.overheid.nl/BWBR0008019/2008-06-15#Artikel10
