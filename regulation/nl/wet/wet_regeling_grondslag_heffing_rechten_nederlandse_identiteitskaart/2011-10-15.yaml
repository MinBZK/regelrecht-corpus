  - number: '2'
    text: |-
      1 Een gemeentelijke belastingverordening ter zake van het heffen van rechten als bedoeld in
      [artikel 229, eerste lid, onderdeel b, van de Gemeentewet][ref1], voor het verrichten van handelingen ten behoeve
      van de aanvraag van een Nederlandse identiteitskaart, berust vanaf de dag tot welke deze wet terugwerkt op
      [artikel 1][ref2].

      2 [Artikel 7, tweede lid, van de Paspoortwet][ref3] en een algemene maatregel van rijksbestuur als bedoeld in
      artikel 7, derde lid, van de Paspoortwet, hebben mede betrekking op rechten als bedoeld in [artikel 1][ref4].

      3 In verband met het aanvragen van een Nederlandse identiteitskaart worden geen rechten geheven indien de aanvraag
      is ingediend in de periode vanaf 9 september 2011 tot de dag tot welke deze wet terugwerkt.


