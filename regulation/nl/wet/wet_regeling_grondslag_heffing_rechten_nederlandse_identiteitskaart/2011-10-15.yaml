preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is op korte termijn te voorzien in een grondslag voor de
    heffing van rechten voor de Nederlandse identiteitskaart;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030530/2011-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor het verrichten van handelingen ten behoeve van de aanvraag van een Nederlandse identiteitskaart als bedoeld
      in [artikel 2, tweede lid, van de Paspoortwet][ref1] door de burgemeester van een gemeente, kunnen rechten worden
      geheven. Deze rechten worden aangemerkt als gemeentelijke belastingen. [Hoofdstuk XV, paragraaf 1][ref2] en
      [4, van de Gemeentewet][ref3], is van toepassing. De [artikelen 229b][ref4] en [229c van de Gemeentewet][ref5] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf1
