        bwb_id: BWBR0002320
        artikel: '19'
  - number: 1.1.h
    text: |-
      zeeschip: een schip ten aanzien waarvan de [Wet zeevarenden][ref1] van toepassing is, dat is voorzien van
      een zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref2] en dat in het kader van een
      onderneming grotendeels op zee wordt geëxploiteerd voor het vervoer van zaken of personen in het internationale
      verkeer over zee, het vervoer van zaken of personen over zee ten behoeve van de exploratie of exploitatie van
      natuurlijke rijkdommen op zee, het verrichten van sleep- en hulpverleningswerkzaamheden op zee aan schepen als
      bedoeld in [artikel 1, tweede lid, van de Schepenwet][ref3], het verrichten van baggerwerkzaamheden of overige bij
      ministeriële regeling nader te bepalen activiteiten op zee, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.1.h.1°
    text: een schip dat wordt gebruikt voor de loodsdienst;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.h.2°
    text: |-
      een schip dat wordt gebruikt voor de zeilvaart, niet zijnde een schip dat voldoet aan de in het tweede lid genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.h.2bis°
    text: een schip dat wordt gebruikt voor de sportvisserij;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.h.3°
    text: een schip in havensleepdienst als bedoeld in onderdeel ha;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.h.4°
    text: |-
      een schip dat wordt gebruikt voor baggerwerkzaamheden dat niet over eigen voortstuwing beschikt of dat niet is
      ingericht voor het vervoer van lading over zee, en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.h.5°
    text: |-
      een schip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of van andere levende rijkdommen
      van de zee;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.ha
    text: |-
      havensleepdienst: het geheel van werkzaamheden en activiteiten door een sleepboot als bedoeld in onderdeel hb
      grotendeels in en rond havens en op binnenwateren van de Europese Unie verricht, ten behoeve van het assisteren
      bij het meren, ontmeren en verhalen van zeeschepen die gebruik maken van eigen voortstuwing en die inkomen van of
      uitgaan naar zee;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.hb
    text: |-
      sleepboot: een schip ten aanzien waarvan de [Wet zeevarenden][ref1] van toepassing is, dat is voorzien van een
      zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref2] en is bestemd voor het verrichten van
      sleep- en hulpverleningswerkzaamheden op zee;


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '3'
  - number: 1.1.i
    text: |-
      zeevarende: degene die als kapitein, scheepsofficier of scheepsgezel werkzaam is op een zeeschip dat in
      Nederland is geregistreerd en de Nederlandse vlag voert, tenzij hij werkzaam is op een schip dat een geregelde
      passagiersdienst onderhoudt tussen havens van de Europese Unie en hij niet de nationaliteit heeft van een van de
      lidstaten van de Europese Unie of de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.ia
    text: |-
      zee: alle wateren die zich bevinden voorbij de laagwaterlijn van de kust. Indien een transport over zee plaatsvindt
      met inbegrip van transport door een waterweg van maritieme aard in de zin van Verordening (EG) nr. 13/2004 van de
      Commissie van 8 december 2003 tot vaststelling van de lijst van waterwegen van maritieme aard, bedoeld in artikel
      3, onder d), van Verordening (EEG) nr. 1108/70 van de Raad (PbEU 2003, L 3), wordt het transport voor het gehele
      traject geacht transport over zee te zijn;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.ib
    text: 'binnenwateren: wateren anders dan bedoeld in onderdeel ia;'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.j
    text: |-
      onderneming: een onderneming in de zin van de [Wet inkomstenbelasting 2001][ref1] of de
      [Wet op de vennootschapsbelasting 1969][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: 1.1.k
    text: |-
      fiscale eenheid: een eenheid in de zin van de [artikelen 15][ref1] en
      [15a van de Wet op de vennootschapsbelasting 1969][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
  - number: 1.1.l
    text: |-
      S&O-inhoudingsplichtige: een inhoudingsplichtige die tevens een onderneming drijft, tenzij deze inhoudingsplichtige
      een publieke kennisinstelling is;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.m
    text: 'publieke kennisinstelling:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.m.1°
    text: |-
      een instelling voor hoger onderwijs als bedoeld in de onderdelen a, b, c, g, h en i van de [bijlage behorende bij
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend) en een academisch ziekenhuis als bedoeld in
      onderdeel j van die bijlage;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.m.2°
    text: |-
      een geheel of gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die
      activiteiten verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.m.3°
    text: |-
      een geheel of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde openbare
      instelling voor hoger onderwijs, ziekenhuis of onderzoeksorganisatie die gelijkwaardig is aan een publieke
      kennisinstelling als bedoeld onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.n
    text: |-
      *onderzoeksorganisatie:* een onderzoeksorganisatie als bedoeld in artikel 1.3, onderdeel ee, van de Kaderregeling
      betreffende staatssteun voor onderzoek, ontwikkeling en innovatie (PbEU 2014, C198/7);
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.o
    text: |-
      S&O-belastingplichtige: een natuurlijke persoon die voldoet aan het urencriterium, bedoeld in
      [artikel 3.6 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1.1.p
    text: |-
      speur- en ontwikkelingswerk: door een S&O-inhoudingsplichtige of een S&O-belastingplichtige systematisch
      georganiseerde en in een lidstaat van de Europese Unie verrichte werkzaamheden, direct en uitsluitend gericht op:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.p.1°
    text: technisch-wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.p.2°
    text: |-
      de ontwikkeling van voor de S&O-inhoudingsplichtige, onderscheidenlijk de S&O-belastingplichtige, technisch nieuwe
      (onderdelen van) fysieke producten, (onderdelen van) fysieke productieprocessen, of (onderdelen van) programmatuur;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.q
    text: |-
      programmatuur: het niet-fysieke, logische deelsysteem van een informatiesysteem dat de structuur van de gegevens en
      van de verwerkingsprocessen bepaalt voor zover dat deelsysteem is vastgelegd in een formele programmeertaal;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.r
    text: |-
      S&O-referentiejaar: het tweede kalenderjaar voorafgaande aan het kalenderjaar waarop de S&O-afdrachtvermindering
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.s
    text: |-
      S&O-verklaring: de door Onze Minister van Economische Zaken en Klimaat op de voet van [artikel 23][ref1] aan een
      S&O-inhoudingsplichtige of [artikel 27][ref2] aan een S&O-belastingplichtige afgegeven verklaring betreffende
      speur- en ontwikkelingswerk;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
  - number: 1.1.t
    text: |-
      kosten: al hetgeen voor de realisatie van speur- en ontwikkelingswerk van de S&O-inhoudingsplichtige is betaald
      door de S&O-inhoudingsplichtige of door een lichaam dat deel uitmaakt van dezelfde fiscale eenheid als de S&O-
      inhoudingsplichtige voor zover deze betalingen:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.t.1°
    text: niet eerder in aanmerking zijn genomen voor een S&O-verklaring;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.t.2°
    text: uitsluitend dienstbaar en direct toerekenbaar zijn aan het uitvoeren van speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.t.3°
    text: |-
      drukken op de S&O-inhoudingsplichtige of op een lichaam dat deel uitmaakt van dezelfde fiscale eenheid als de S&O-
      inhoudingsplichtige; en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.t.4°
    text: geen uitgaven zijn als bedoeld in onderdeel u;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.u
    text: |-
      uitgaven: al hetgeen is betaald voor de verwerving van nieuw vervaardigde bedrijfsmiddelen voor zover deze
      betalingen drukken op de S&O-inhoudingsplichtige of op een lichaam dat deel uitmaakt van dezelfde fiscale eenheid
      als de S&O-inhoudingsplichtige en deze bedrijfsmiddelen:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.u.1°
    text: niet eerder in aanmerking zijn genomen voor een S&O-verklaring;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.u.2°
    text: niet eerder zijn gebruikt; en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.u.3°
    text: |-
      dienstbaar en direct toerekenbaar zijn aan de realisatie van speur- en ontwikkelingswerk van de S&O-
      inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.v
    text: 'bedrijfsmiddel: goed dat voor het drijven van een onderneming wordt gebruikt;'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.1.w
    text: |-
      uitbesteed onderzoek: werkzaamheden die voor de S&O-inhoudingsplichtige als speur- en ontwikkelingswerk kunnen
      worden aangemerkt en door deze S&O-inhoudingsplichtige worden uitbesteed aan een derde.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: '1.2'
    text: 'Voor toepassing van het eerste lid, onderdeel h, onder 2°, dient:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.2.a
    text: |-
      door of namens de Nederlandse Inspectie Verkeer en Waterstaat voor het schip een veiligheidscertificaat met
      onbeperkt vaargebied te zijn afgegeven, welk certificaat vermeldt dat het schip voldoet aan:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.2.a.1°
    text: |-
      de krachtens [artikel 5, tweede lid, van de Schepenwet][ref1] uitgevaardigde voorschriften voor Commercial
      Cruising Vessels;


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '5'
  - number: 1.2.a.2°
    text: de voorschriften van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.2.a.3°
    text: de voorschriften van de Special Purpose Ship (SPS) Code, of
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.2.a.4°
    text: de voorschriften van de Special Purpose Ship Code 2008;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.2.b
    text: |-
      het schip een lengte te hebben van ten minste 24 meter, bepaald op basis van de International Convention on Load
      Lines.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid, onderdeel i, wordt onder zeevarende mede verstaan: werknemer in de zin van
      de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] die als kapitein, scheepsofficier of scheepsgezel werkzaam is
      op een schip als bedoeld in het tweede lid dat is geregistreerd in een van de lidstaten van de Europese Unie of een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en de vlag voert van een van die
      lidstaten of staten, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
  - number: 1.3.a
    text: |-
      het loon van de werknemer op grond van een verdrag ter voorkoming van dubbele belasting of op grond van enige
      andere regel van interregionaal of internationaal recht in feite niet in Nederland aan een belasting naar het
      inkomen is onderworpen; of
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.3.b
    text: |-
      de werknemer werkzaam is op een schip dat een geregelde passagiersdienst onderhoudt tussen havens van de Europese
      Unie en hij niet de nationaliteit heeft van een van de lidstaten van de Europese Unie of een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: '1.4'
    text: 'Voor de toepassing van het eerste lid, onderdeel p, wordt niet tot speur- en ontwikkelingswerk gerekend:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.4.a
    text: marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.4.b
    text: organisatorische en administratieve werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: 1.4.c
    text: door Onze Minister van Economische Zaken en Klimaat bij ministeriële regeling aangewezen andere werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
  - number: '1.5'
    text: |-
      De ministeriële regelingen, bedoeld in deze wet, worden, voor zover niet anders is bepaald, uitgevaardigd
      door Onze Minister, wat betreft de regelingen, bedoeld in de [artikelen 17][ref1], [18][ref2] en [20][ref3],
      in overeenstemming met Onze Minister van Infrastructuur en Waterstaat en Onze Minister van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel20
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '17'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '18'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0007746
        artikel: '20'
        hoofdstuk: VII
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      [Artikel 2, derde, vierde en vijfde lid, van de Wet op de loonbelasting 1964][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: '2.3'
    text: |-
      Als dienstbetrekking worden mede beschouwd de arbeidsverhoudingen, bedoeld in de
      [artikelen 3, eerste lid, onderdelen f en g][ref1], en [4, onderdeel e, van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '4'
  - number: '3.1'
    text: |-
      De inhoudingsplichtige kan de over een tijdvak af te dragen loonbelasting, dan wel af te dragen loonbelasting en
      premie voor de volksverzekeringen verminderen, doch niet verder dan tot nihil, met:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel3
  - number: 3.1.a
    text: de afdrachtvermindering zeevaart;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel3
  - number: 3.1.b
    text: de S&O-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      De S&O-afdrachtvermindering komt in mindering op de af te dragen loonbelasting. Uitsluitend voor de toepassing van
      de vorige volzin door de inhoudingsplichtige wordt af te dragen premie voor de volksverzekeringen gelijkgesteld met
      af te dragen loonbelasting.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      De afdrachtvermindering zeevaart komt in mindering op de af te dragen loonbelasting en premie voor de
      volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel3
  - number: '4'
    text: |-
      Voor zover loon in aanmerking is genomen voor de toepassing van de S&O-afdrachtvermindering vindt de
      afdrachtvermindering zeevaart geen toepassing.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      De afdrachtvermindering zeevaart beloopt een bedrag te bepalen op de voet van [hoofdstuk VII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VII
  - number: '5.2'
    text: |-
      De S&O-afdrachtvermindering beloopt een bedrag te bepalen op de voet van [hoofdstuk VIII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VIII
  - number: '17.1'
    text: |-
      De afdrachtvermindering zeevaart is van toepassing met betrekking tot zeevarenden. De afdrachtvermindering beloopt
      een bedrag ter grootte van het in het tweede lid genoemde percentage van het loon van de zeevarenden in het
      loontijdvak. Bij zeevarenden op schepen bestemd voor baggerwerkzaamheden, onderscheidenlijk schepen bestemd voor
      sleep- en hulpverleningswerkzaamheden wordt als loon niet in aanmerking genomen het gedeelte van het loon dat
      toerekenbaar is aan andere werkzaamheden dan vervoer van opgebaggerd materiaal over zee, onderscheidenlijk andere
      werkzaamheden dan sleep- en hulpverleningswerkzaamheden op zee.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: '17.2'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: 17.2.a
    text: |-
      met betrekking tot de in Nederland, een lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte wonende zeevarende: 40 percent;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: 17.2.b
    text: |-
      met betrekking tot de niet in Nederland, een lidstaat van de Europese Unie of een andere staat die partij is bij de
      Europese Economische Ruimte wonende zeevarende die aan de loonbelasting is onderworpen of premieplichtig is voor de
      volksverzekeringen: 10 percent.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      De in het tweede lid vermelde percentages kunnen bij ministeriële regeling met ingang van een kalenderkwartaal
      worden vervangen door andere.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: '17.4'
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop de krachtens het derde lid vastgestelde ministeriële regeling
      in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal besluit
      tot het niet aannemen van het voorstel, worden bij ministeriële regeling de krachtens het derde lid vervangen
      percentages met ingang van het eerstvolgende kalenderkwartaal vervangen door de percentages zoals die golden
      onmiddellijk vóór het in de eerste volzin bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Volgens bij ministeriële regeling te stellen regels maakt de inhoudingsplichtige per loontijdvak een berekening van
      het in [artikel 17, eerste lid][ref1], bedoelde loon alsmede het gedeelte van dat loon dat niet in aanmerking is
      genomen en van het bedrag van de afdrachtvermindering zeevaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '17'
        hoofdstuk: VII
  - number: '18.2'
    text: |-
      De inhoudingsplichtige bewaart en registreert met betrekking tot het schip of de schepen waarop een of meer
      zeevarenden werkzaam zijn met betrekking tot wie de afdrachtvermindering zeevaart wordt toegepast:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
  - number: 18.2.a
    text: |-
      afschriften van monsterrollen als bedoeld in [artikel 33 van de Wet zeevarenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: 18.2.b
    text: |-
      afschriften van zeebrieven als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '3'
  - number: '18.3'
    text: |-
      De inhoudingsplichtige legt vast met betrekking tot welke zeevarenden hij in het kalenderjaar de
      afdrachtvermindering zeevaart heeft toegepast, alsmede het schip of de schepen waarop die zeevarenden werkzaam zijn
      geweest onder vermelding van de periode waarin dit plaatsvond.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
  - number: '18.4'
    text: |-
      De inhoudingsplichtige legt met betrekking tot zeeschepen die zijn bestemd voor sleep-en
      hulpverleningswerkzaamheden op zee en die tevens, in en rond havens gelegen op het grondgebied van de Europese Unie
      en op binnenwateren van de Europese Unie, worden ingezet voor het assisteren bij het meren, ontmeren en verhalen
      van zeeschepen die inkomen van of uitgaan naar zee en gebruik maken van eigen voortstuwing, de bedrijfstijd
      vast die is gemoeid met de onderscheidene werkzaamheden. De wachttijd mag evenredig worden toegedeeld aan de
      bedrijfstijd van de onderscheidene werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
  - number: '18.5'
    text: |-
      De inhoudingsplichtige bewaart de in het tweede lid bedoelde gegevens, alsmede de in het tweede lid bedoelde
      afschriften en de in het derde en vierde lid bedoelde vastleggingen, bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
  - number: '18.6'
    text: Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in dit artikel genoemde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel18
  - number: '19'
    text: |-
      Indien de inhoudingsplichtige niet voldoet aan de in [artikel 18][ref1] bedoelde verplichtingen, wordt de
      afdrachtvermindering zeevaart geacht ten onrechte te hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel18
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '18'
        hoofdstuk: VII
  - number: '20'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel20
  - number: '21.1'
    text: |-
      De S&O-afdrachtvermindering is met betrekking tot een aangiftetijdvak van toepassing indien de S&O-
      inhoudingsplichtige beschikt over een ten name van hem afgegeven S&O-verklaring die betrekking heeft op een periode
      waarin het aangiftetijdvak eindigt. Het totaal van de S&O-afdrachtvermindering beloopt het bij die S&O-verklaring
      ter zake vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel21
  - number: '21.2'
    text: |-
      Per aangiftetijdvak wordt maximaal een evenredig deel van het bij de S&O-verklaring vastgestelde bedrag aan S&O-
      afdrachtvermindering in aanmerking genomen. De evenredigheid is gerelateerd aan het aantal aangiftetijdvakken die
      vanaf het desbetreffende aangiftetijdvak nog eindigen in de periode waarop de S&O-verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel21
  - number: '21.3'
    text: |-
      Ingeval na afloop van de periode waarop de S&O-verklaring betrekking heeft een nog niet verrekend bedrag
      aan S&O-afdrachtvermindering resteert, wordt dit bedrag verrekend met de loonbelasting en de premie voor de
      volksverzekeringen die zijn verschuldigd over een aangiftetijdvak dat is geëindigd of nog gaat eindigen in het
      kalenderjaar waarin de periode valt waarop de S&O-verklaring betrekking heeft. Voor zover toepassing van de eerste
      volzin tot gevolg heeft dat een nog niet verrekend bedrag wordt verrekend met de loonbelasting en de premie voor
      de volksverzekeringen die zijn verschuldigd over een reeds verstreken aangiftetijdvak, wordt de aangifte over dat
      reeds verstreken tijdvak voor de toepassing van [artikel 28a van de Wet op de loonbelasting 1964][ref1] aangemerkt
      als een onjuiste of onvolledige aangifte. Voorzover toepassing van de eerste volzin tot gevolg heeft dat een nog
      niet verrekend bedrag met een reeds verstreken aangiftetijdvak wordt verrekend, wordt de aangifte over dat reeds
      verstreken tijdvak voor de toepassing van artikel 28a van de Wet op de loonbelasting 1964 aangemerkt als een
      onjuiste of onvolledige aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: '22.1'
    text: |-
      De S&O-inhoudingsplichtige kan voor een aaneengesloten periode van ten minste drie kalendermaanden en ten hoogste
      twaalf kalendermaanden vallende binnen één kalenderjaar een S&O-verklaring aanvragen. Een kalendermaand waarop een
      aanvraag betrekking heeft kan niet meer worden betrokken in een latere aanvraag.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid, een opgave als bedoeld in het vierde lid en een mededeling als bedoeld
      in [artikel 24, tweede lid][ref1], geschieden uitsluitend langs elektronische weg met gebruikmaking van de hiervoor
      door Onze Minister van Economische Zaken en Klimaat beschikbaar gestelde voorziening en door opvolging van de
      daarbij opgenomen aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '22.3'
    text: |-
      De aanvraag wordt uiterlijk ingediend op de laatste dag van de kalendermaand voorafgaande aan de periode waarop
      de aanvraag betrekking heeft. Indien de aanvraag betrekking heeft op een periode die ingaat op 1 januari van een
      kalenderjaar, wordt de aanvraag uiterlijk ingediend op 20 december van het daaraan voorafgaande kalenderjaar. De
      beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na de aanvang van de periode waarop de aanvraag
      betrekking heeft. Onze Minister van Economische Zaken en Klimaat kan bij ministeriële regeling in het algemeen of
      voor groepen van gevallen, een latere datum vaststellen waarop de beslissing op de aanvraag uiterlijk moet zijn
      gegeven.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel22
  - number: '22.4'
    text: |-
      De aanvraag wordt in de situatie waarin de S&O-inhoudingsplichtige in het S&O-referentiejaar speur- en
      ontwikkelingswerk heeft verricht waarvoor een S&O-verklaring is verstrekt, slechts in behandeling genomen indien
      hij uiterlijk bij de indiening van de aanvraag opgave heeft gedaan van de burgerservicenummers van zijn werknemers
      die dat speur- en ontwikkelingswerk hebben verricht.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister van Economische Zaken en Klimaat verstrekt aan een S&O-inhoudingsplichtige die voornemens is in
      een periode van een kalenderjaar speur- en ontwikkelingswerk te verrichten, op zijn aanvraag op de voet van
      [artikel 22][ref1] een S&O-verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
  - number: '23.2'
    text: 'De S&O-verklaring bevat:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.2.a
    text: een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.2.b
    text: de periode waarvoor de S&O-verklaring wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.2.c
    text: |-
      het aantal uren dat werknemers van de S&O-inhoudingsplichtige in die periode aan het werk, bedoeld in onderdeel a,
      naar verwachting zullen besteden;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.2.d
    text: |-
      het bedrag aan kosten en uitgaven dat naar verwachting betrekking heeft op die periode en het werk, bedoeld in
      onderdeel a, of het bedrag dat voor die periode naar verwachting volgt uit de toepassing van het vierde lid,
      onderdeel b;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.2.e
    text: het bedrag aan S&O-afdrachtvermindering met een berekening van dat bedrag.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: '23.3'
    text: 'Het bedrag aan S&O-afdrachtvermindering beloopt 16  percent van:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.3.a
    text: |-
      het bedrag dat volgt uit het product van het aantal uren, bedoeld in het tweede lid, onderdeel c, en het gemiddelde
      uurloon, bedoeld in het vijfde lid; en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.3.b
    text: het bedrag aan kosten en uitgaven;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien de S&O-inhoudingsplichtige in de aanvraag van de S&O-verklaring die betrekking heeft op de eerste periode
      van een kalenderjaar waarvoor de S&O-inhoudingsplichtige een aanvraag doet, gekozen heeft voor het op forfaitaire
      wijze berekenen van het bedrag aan kosten en uitgaven voor speur- en ontwikkelingswerk, beloopt het bedrag aan S&O-
      afdrachtvermindering, in afwijking van het derde lid, 16  percent van:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.4.a
    text: |-
      het bedrag dat volgt uit het product van het aantal uren, bedoeld in het tweede lid, onderdeel c, en het gemiddelde
      uurloon, bedoeld in het vijfde lid; en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23.4.b
    text: |-
      het bedrag dat volgt uit het product van € 10 en het aantal uren, bedoeld in het tweede lid, onderdeel c, voor
      zover dit aantal uren in het kalenderjaar niet hoger is dan 1800 en het bedrag dat volgt uit het product van € 4
      en het aantal uren, bedoeld in het tweede lid, onderdeel c, voor zover dit aantal uren in het kalenderjaar hoger is
      dan 1.800;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het gemiddelde uurloon wordt gesteld op het uurloon dat de S&O-inhoudingsplichtige in het S&O-referentiejaar
      gemiddeld heeft betaald aan zijn werknemers die in dat jaar speur- en ontwikkelingswerk hebben verricht waarvoor
      een S&O-verklaring is verstrekt. Het gemiddelde uurloon wordt daarbij gesteld op de som van de door de S&O-
      inhoudingsplichtige aan deze werknemers in het S&O-referentiejaar betaalde lonen gedeeld door de som van de in
      het S&O-referentiejaar door de S&O-inhoudingsplichtige aan deze werknemers verloonde uren nadat de som van de
      verloonde uren is vermenigvuldigd met 0,85; de uitkomst van deze deling wordt naar boven afgerond op een bedrag
      in hele euro’s. Het gemiddelde uurloon wordt aldus bepaald aan de hand van de gegevens zoals die blijken uit de
      polisadministratie van het Uitvoeringsinstituut Werknemersverzekeringen op een bij ministeriële regeling van Onze
      Minister van Economische Zaken en Klimaat vast te stellen peildatum gelegen in het kalenderjaar volgende op het
      S&O-referentiejaar. Indien de berekening aan de hand van de gegevens op de peildatum leidt tot een evident onjuist
      gemiddeld uurloon, wordt het gemiddelde uurloon bepaald aan de hand van de juiste gegevens zoals die blijken na
      uitvraag daarvan bij de S&O-inhoudingsplichtige door Onze Minister van Economische Zaken en Klimaat. Ingeval de
      S&O-inhoudingsplichtige in het S&O-referentiejaar geen speur- en ontwikkelingswerk heeft verricht waarvoor hij over
      een S&O-verklaring beschikt, geldt een gemiddeld uurloon van € 29.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: '23.6'
    text: |-
      De inhoudingsplichtige die deel uitmaakt van een fiscale eenheid en voor speur- en ontwikkelingswerk werknemers
      ter beschikking stelt aan een onderneming binnen die fiscale eenheid, wordt geacht dat speur- en ontwikkelingswerk
      zelf te verrichten. Op deze inhoudingsplichtige is het bij of krachtens deze wet bepaalde zoveel mogelijk van
      overeenkomstige toepassing met dien verstande dat de inhoudingsplichtige de verplichtingen in voorkomende gevallen
      zal doen uitvoeren door de onderneming die het speur- en ontwikkelingswerk uitvoert.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: '23.7'
    text: |-
      Het in het derde en vierde lid laatstvermelde percentage wordt vervangen door 24  indien de S&O-inhoudingsplichtige
      in een of meer van de vijf voorafgaande kalenderjaren geen inhoudingsplichtige was en voor die periode met
      betrekking tot ten hoogste twee kalenderjaren een S&O-verklaring is afgegeven. Indien de voor rekening van
      de inhoudingsplichtige gedreven onderneming een voortzetting is van een onderneming die, of een gedeelte
      van een onderneming dat direct of indirect is gedreven door een met hem verbonden vennootschap in de zin van
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1], dan wel voor rekening van een natuurlijk
      persoon die op het moment van aanvraag een aanmerkelijk belang in de zin van de Wet op de inkomstenbelasting 2001
      heeft in de inhoudingsplichtige, wordt voor de toepassing van de eerste volzin een ten aanzien van de verbonden
      vennootschap, onderscheidenlijk natuurlijk persoon, reeds voor de voortzetting afgegeven S&O-verklaring aangemerkt
      als een ten aanzien van de inhoudingsplichtige afgegeven verklaring. Een S&O-verklaring die is afgegeven voor
      een deel van een kalenderjaar wordt aangemerkt als een S&O-verklaring afgegeven met betrekking tot een heel
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: '23.8'
    text: |-
      In afwijking van [artikel 1, eerste lid, onderdeel c][ref1], is het loon, bedoeld in het vijfde lid, het loon in
      de zin van de [Wet op de loonbelasting 1964][ref2], met uitzondering van eindheffingsbestanddelen als bedoeld in
      [artikel 31 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '23.9'
    text: |-
      Kosten en uitgaven kunnen slechts bij één S&O-inhoudingsplichtige tot het bedrag, bedoeld in het derde lid,
      onderdeel b, gerekend worden.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23
  - number: 23a.1
    text: |-
      Uitgaven die gedeeltelijk direct toerekenbaar zijn aan door de S&O-inhoudingsplichtige
      verricht speur- en ontwikkelingswerk, komen slechts voor dat deel als uitgaven als bedoeld in
      [artikel 23, derde lid, onderdeel b][ref1], in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 23a.2
    text: Een uitgave kan slechts in één S&O-verklaring worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Uitgaven van € 1.000.000 of meer per bedrijfsmiddel komen in enig kalenderjaar voor 20 percent als uitgaven als
      bedoeld in [artikel 23, derde lid, onderdeel b][ref1], in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 23a.4
    text: |-
      In afwijking van het tweede lid kunnen uitgaven als bedoeld in het derde lid gedurende 5 jaar maximaal eenmaal per
      kalenderjaar in een S&O-verklaring worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23a
  - number: 23b.1
    text: 'Voor de toepassing van dit hoofdstuk worden niet tot de kosten gerekend:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.a
    text: kosten van uitbesteed onderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.b
    text: kosten van inhuur van arbeid;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.c
    text: financieringskosten;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.d
    text: kosten van grondverwerving of grondverbetering;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.e
    text: |-
      kosten die een vergoeding vormen voor het ter beschikking stellen van een bedrijfsmiddel waarvoor de S&O-
      inhoudingsplichtige of een ander lichaam eerder een S&O-verklaring heeft ontvangen, mits:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.e.1°
    text: |-
      de S&O-inhoudingsplichtige of het lichaam dat de kosten maakt onmiddellijk of middellijk deelneemt aan de leiding
      van of het toezicht op, dan wel in het kapitaal van het lichaam dat het bedrijfsmiddel ter beschikking stelt;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.e.2°
    text: |-
      het lichaam dat het bedrijfsmiddel ter beschikking stelt onmiddellijk of middellijk deelneemt aan de leiding van of
      het toezicht op, dan wel in het kapitaal van de S&O-inhoudingsplichtige of het lichaam dat de kosten maakt; of
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.e.3°
    text: |-
      een derde zowel onmiddellijk of middellijk deelneemt aan de leiding van of het toezicht op, dan wel in het kapitaal
      van de S&O-inhoudingsplichtige of het lichaam dat de kosten maakt als onmiddellijk of middellijk deelneemt aan
      de leiding van of het toezicht op, dan wel in het kapitaal van het lichaam dat het bedrijfsmiddel ter beschikking
      stelt;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.1.f
    text: loonkosten.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
  - number: 23b.2
    text: |-
      Voor de toepassing van dit hoofdstuk worden niet tot de uitgaven gerekend investeringen die in aanmerking komen
      voor energie-investeringsaftrek als bedoeld in [artikel 3.42 van de Wet inkomstenbelasting 2001][ref1] of voor
      milieu-investeringsaftrek als bedoeld in [artikel 3.42a van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 23c
    text: |-
      Indien tussen twee lichamen waarvan een van de lichamen onmiddellijk of middellijk deelneemt aan de leiding van
      of toezicht op, dan wel in het kapitaal van het andere lichaam ter zake van hun onderlinge rechtsverhoudingen
      voorwaarden worden overeengekomen of opgelegd die afwijken van voorwaarden die in het economische verkeer door
      onafhankelijke partijen zouden zijn overeengekomen, worden de kosten en uitgaven van deze lichamen voor de
      toepassing van dit hoofdstuk en de daarop berustende bepalingen bepaald alsof die laatstbedoelde voorwaarden zijn
      overeengekomen. De eerste volzin is van overeenkomstige toepassing indien een derde onmiddellijk of middellijk
      deelneemt aan de leiding van of het toezicht op, dan wel in het kapitaal van twee lichamen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23c
  - number: 23d.1
    text: |-
      Kosten die in enig kalenderjaar in een S&O-verklaring zijn opgenomen worden betaald voordat de mededeling, bedoeld
      in [artikel 24, tweede lid][ref1], voor deze S&O-verklaring wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: 23d.2
    text: |-
      Uitgaven worden niet eerder in aanmerking genomen dan in het kalenderjaar waarin het bedrijfsmiddel waarop zij
      betrekking hebben in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel23d
  - number: '24.1'
    text: |-
      De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven, houdt een overeenkomstig bij regeling van Onze
      Minister van Economische Zaken en Klimaat vast te stellen regels ingerichte administratie bij omtrent de aard, de
      inhoud, de omvang en de voortgang van het werk dat in de verklaring is aangemerkt als speur- en ontwikkelingswerk.
      Ingeval aan de S&O-inhoudingsplichtige een S&O-verklaring is afgegeven die ook een bedrag aan kosten en uitgaven
      als bedoeld in [artikel 23, tweede lid, onderdeel d][ref1], bevat, houdt de S&O-inhoudingsplichtige ook een
      overeenkomstig bij regeling van Onze Minister van Economische Zaken en Klimaat vast te stellen regels ingerichte
      administratie bij omtrent de kosten en uitgaven die zijn gemaakt voor het speur- en ontwikkelingswerk waarvoor hij
      de verklaring heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: '24.2'
    text: |-
      De S&O-inhoudingsplichtige doet mededeling aan Onze Minister van Economische Zaken en Klimaat over de in dat
      kalenderjaar aan speur- en ontwikkelingswerk bestede uren waarvoor een S&O-verklaring is afgegeven en, ingeval een
      S&O-verklaring ook een bedrag aan kosten en uitgaven als bedoeld in [artikel 23, tweede lid, onderdeel d][ref1],
      bevat, van de in dat kalenderjaar gerealiseerde kosten en uitgaven waarvoor een S&O-verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: '24.3'
    text: |-
      De S&O-inhoudingsplichtige doet de mededeling, bedoeld in het tweede lid, binnen drie kalendermaanden na afloop van
      het kalenderjaar waarop de in dat lid bedoelde S&O-verklaringen betrekking hebben of, indien dat later is, binnen
      drie kalendermaanden na de afgifte van de laatste S&O-verklaring die betrekking heeft op dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel24
  - number: '24.4'
    text: |-
      Bij het eindigen van de inhoudingsplicht vóór het tijdstip, bedoeld in het derde lid, wordt in afwijking van dat
      lid de mededeling gedaan binnen één kalendermaand nadat de inhoudingsplicht is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister van Economische Zaken en Klimaat geeft aan de S&O-inhoudingsplichtige die de mededeling, bedoeld
      in [artikel 24, tweede lid][ref1], heeft gedaan, zo nodig een correctie-S&O-verklaring af voor alle op het
      kalenderjaar betrekking hebbende S&O-verklaringen gezamenlijk, waarbij hij het bedrag van de correctie-S&O-
      verklaring vaststelt op basis van de voor dat kalenderjaar toegekende uren, kosten en uitgaven, maar volgens die
      mededeling niet-bestede uren en niet-gerealiseerde kosten en uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.2'
    text: |-
      Onze Minister van Economische Zaken en Klimaat geeft aan de S&O-inhoudingsplichtige een correctie-S&O-verklaring af
      met het bedrag dat op de S&O-verklaring ten onrechte is vermeld als bedrag aan S&O-afdrachtvermindering, indien:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
  - number: 25.2.a
    text: |-
      aannemelijk is dat ter verkrijging van de S&O-verklaring of bij het doen van de mededeling, bedoeld in artikel 24,
      tweede lid, gegevens of bescheiden zijn verstrekt die zodanig onjuist of onvolledig zijn dat een andere beslissing
      zou zijn genomen indien de juiste en volledige gegevens zouden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
  - number: 25.2.b
    text: |-
      aannemelijk is geworden, dat de S&O-inhoudingsplichtige de verplichtingen, bedoeld in
      [artikel 24, tweede, derde of vierde lid][ref1], niet is nagekomen, met dien verstande dat het bedrag van de
      correctie-S&O-verklaring wordt vastgesteld op 100% van het bedrag aan S&O-afdrachtvermindering waarvoor de
      mededeling, bedoeld in artikel 24, tweede lid, niet is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.3'
    text: |-
      Onze Minister van Economische Zaken en Klimaat kan, indien blijkt dat de in [artikel 24, eerste lid][ref1],
      bedoelde administratie niet voldoet aan het bij of krachtens dat artikel bepaalde aan de S&O-inhoudingsplichtige
      een correctie-S&O-verklaring afgeven tot een omvang waarvan onvoldoende aannemelijk is dat speur- en
      ontwikkelingswerk zoals opgenomen in de S&O-verklaring is verricht of kosten en uitgaven zoals opgenomen in de S&O-
      verklaring zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.4'
    text: |-
      Een bedrag vastgesteld bij een correctie-S&O-verklaring komt zoveel mogelijk in mindering op het bij één
      of meer S&O-verklaringen waarop de correctie-S&O-verklaring betrekking heeft, vastgestelde bedrag aan S&O-
      afdrachtvermindering dat nog niet in mindering is gebracht op de af te dragen belasting en premie. Voorzover
      dat niet mogelijk is, is sprake van een negatieve S&O-afdrachtvermindering welke er toe leidt dat de over het
      aangiftetijdvak waarin de correctie-S&O-verklaring is gedagtekend of het daaropvolgende aangiftetijdvak af te
      dragen loonbelasting, dan wel af te dragen loonbelasting en premie voor de volksverzekeringen, wordt vermeerderd
      met dat bedrag aan negatieve S&O-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel25
  - number: '26.1'
    text: |-
      Bij overtreding van het bij of krachtens [artikel 24, eerste lid][ref1], bepaalde of indien sprake is van het
      geval, bedoeld in [artikel 25, tweede lid, onderdeel a][ref2], kan Onze Minister van Economische Zaken en Klimaat
      aan de S&O-inhoudingsplichtige een bestuurlijke boete opleggen ter hoogte van maximaal € 100 000, of, wanneer dat
      meer is, 20% van het in de S&O-verklaring als afdrachtvermindering vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '26.2'
    text: |-
      Bij overtreding van het bij of [krachtens artikel 24, tweede, derde of vierde lid][ref1], bepaalde, legt Onze
      Minister van Economische Zaken en Klimaat aan de S&O-inhoudingsplichtige een bestuurlijke boete op ter hoogte van
      maximaal € 2500.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '26.3'
    text: |-
      Onze Minister van Economische Zaken en Klimaat brengt opgelegde boeten tot uitdrukking door deze op te nemen in een
      correctie-S&O-verklaring. [Artikel 25, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '26.4'
    text: |-
      Bij het opleggen van een bestuurlijke boete als bedoeld in het tweede lid vindt
      [artikel 5:53 van de Algemene wet bestuursrecht][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '27.1'
    text: |-
      Aan een S&O-belastingplichtige die voornemens is in een kalenderjaar ten minste 500 uren van zijn voor
      werkzaamheden beschikbare tijd te besteden aan speur- en ontwikkelingswerk geeft Onze Minister van Economische
      Zaken en Klimaat op aanvraag een S&O-verklaring af.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: '27.2'
    text: |-
      Aanvragen kunnen voor het laatst worden ingediend drie kalendermaanden voor het einde van het kalenderjaar. De
      beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: '27.3'
    text: 'De S&O-verklaring die ten name van een S&O-belastingplichtige wordt afgegeven, bevat:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: 27.3.a
    text: een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: 27.3.b
    text: het kalenderjaar waarvoor de S&O-verklaring wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: '27.4'
    text: |-
      De S&O-belastingplichtige aan wie een S&O-verklaring is afgegeven en die in het kalenderjaar minder dan 500 uren
      van zijn voor werkzaamheden beschikbare tijd heeft besteed aan het speur- en ontwikkelingswerk waarop de S&O-
      verklaring betrekking heeft, doet daarvan binnen drie kalendermaanden na afloop van het kalenderjaar waarop de S&O-
      verklaring betrekking heeft mededeling aan Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: '27.5'
    text: |-
      [Artikel 3.6, vijfde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '27.6'
    text: |-
      [Artikel 24, eerste lid][ref1], is van overeenkomstige toepassing met betrekking tot de S&O-belastingplichtige aan
      wie een S&O-verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '27.7'
    text: 'Onze Minister van Economische Zaken en Klimaat trekt de S&O-verklaring in indien:'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: 27.7.a
    text: |-
      blijkt dat de in [artikel 24, eerste lid][ref1], bedoelde administratie niet voldoet aan het bij of krachtens dat
      artikel bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: 27.7.b
    text: |-
      de S&O-belastingplichtige de mededeling, bedoeld in het vierde lid, deed, of aannemelijk is dat hij dat had behoren
      te doen;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: 27.7.c
    text: |-
      aannemelijk is dat ter verkrijging van de S&O-verklaring gegevens of bescheiden zijn verstrekt die zodanig onjuist
      of onvolledig zijn dat op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de
      juiste omstandigheden volledig bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: '27.8'
    text: |-
      Een aanvraag als bedoeld in het eerste lid en een mededeling als bedoeld in het vierde lid geschieden uitsluitend
      langs elektronische weg met gebruikmaking van de hiervoor door Onze Minister van Economische Zaken en Klimaat
      beschikbaar gestelde voorziening en door opvolging van de daarbij opgenomen aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27
  - number: 27a
    text: |-
      Bij regeling van Onze Minister van Economische Zaken en Klimaat kunnen regels worden gesteld op grond waarvan
      wordt vastgesteld in hoeverre bij een verstoring van de voorziening, bedoeld in [artikel 22, tweede lid][ref1], of
      [artikel 27, achtste lid][ref2], sprake is van verschoonbaarheid van een termijnoverschrijding ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
  - number: 27a.a
    text: |-
      een aanvraag als bedoeld in [artikel 22, eerste lid][ref1], of [artikel 27, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
  - number: 27a.b
    text: |-
      een opgave als bedoeld in [artikel 22, vierde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
  - number: 27a.c
    text: |-
      een mededeling als bedoeld in [artikel 24, tweede lid][ref1], of [artikel 27, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
  - number: '28.1'
    text: |-
      De in de [artikelen 47 tot en met 51][ref1] en
      [53, eerste en vierde lid, tot en met 56 van Algemene wet inzake rijksbelastingen][ref2] jegens de inspecteur
      opgelegde verplichtingen gelden mede jegens de door Onze Minister van Economische Zaken en Klimaat met betrekking
      tot de toepassing van in dit hoofdstuk aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '28.2'
    text: |-
      De [artikelen 68][ref1], [69][ref2] en [72 van de Algemene wet inzake rijksbelastingen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel72
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '72'
  - number: '29'
    text: |-
      Teneinde zo veel mogelijk evenwicht te bereiken tussen de S&O-afdrachtverminderingen en het hiervoor in de
      rijksbegroting opgenomen bedrag, kan bij regeling van Onze Minister van Economische Zaken en Klimaat, onder
      overeenkomstige aanpassing van dit artikel, met ingang van 1 januari van enig jaar:
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel29
  - number: 29.a
    text: |-
      het in [artikel 23, derde en vierde lid][ref1], eerstvermelde percentage worden verhoogd tot ten hoogste 25, worden
      verlaagd, dan wel op nihil worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 29.b
    text: |-
      het in [artikel 23, derde en vierde lid][ref1], laatstvermelde percentage worden verhoogd tot ten hoogste 33,5,
      worden verlaagd, dan wel op nihil worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 29.c
    text: |-
      het in [artikel 23, zevende lid][ref1], vermelde percentage worden verhoogd tot ten hoogste 46, worden verlaagd,
      dan wel op nihil worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: '30.1'
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de [artikelen 63][ref2] en
      [67][ref3], is niet van toepassing met betrekking tot de uitvoering van deze wet door andere dan de in
      [artikel 2, derde lid, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref4] genoemde
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '30.2'
    text: |-
      Voor de toepassing van de [artikelen 63][ref1] en [67 van de Algemene wet inzake rijksbelastingen][ref2]
      betreffende de uitvoering van deze wet door Onze Minister van Economische Zaken en Klimaat of de door hem
      aangewezen ambtenaren, treedt Onze Minister van Economische Zaken en Klimaat in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '67'
  - number: '30.3'
    text: |-
      Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en het
      bestuursorgaan beroep in cassatie instellen ter zake van schending van de [artikelen 1][ref1] en [2][ref2] met
      betrekking tot het bepaalde omtrent de begrippen 'inhoudingsplichtige', 'aangiftetijdvak', 'loon', 'onderneming',
      'fiscale eenheid' en 'werknemer'.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '2'
        hoofdstuk: I
  - number: '30.4'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij het College van Beroep voor het bedrijfsleven de
      plaats inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel30
  - number: '32'
    text: |-
      Ter bevordering van een goede uitvoering van deze wet kunnen bij ministeriële regeling nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel32
  - number: '42'
    text: De Wet belasting- en premiefaciliteit voor de zeevaart 1995 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel42
  - number: '43.1'
    text: |-
      Met betrekking tot gevallen waarin een verrekeningsbijdrage zeevaart als bedoeld in artikel III van de Wet
      faciliteit voor de zeevaart zoals deze luidde op 31 december 1994, is ingehouden, blijven de bepalingen welke
      ingevolge de Wet belasting- en premiefaciliteit voor de zeevaart 1995 zijn vervallen, ingetrokken of gewijzigd, van
      kracht zoals deze luidden op 31 december 1994.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel43
  - number: '43.2'
    text: |-
      Met betrekking tot gevallen waarin artikel 2 van de Wet belasting- en premiefaciliteit voor de zeevaart 1995
      toepassing heeft gevonden, blijven de bepalingen van die wet van kracht naar de tekst zoals die luidde op 31
      december 1995.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel43
  - number: '46'
    text: De Wet bevordering speur- en ontwikkelingswerk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel46
  - number: '47.1'
    text: |-
      Voor de toepassing van [artikel 1, eerste lid, onderdeel t, onder 1°, en onderdeel u, onder 1°][ref1],
      worden onder kosten en uitgaven die eerder in aanmerking zijn genomen voor een S&O-verklaring mede
      verstaan: kosten en uitgaven die eerder in aanmerking zijn genomen voor een beschikking als bedoeld in
      [artikel 3.52a, eerste lid, van de Wet inkomstenbelasting 2001][ref2] zoals deze luidde tot en met 31 december
      2015.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '47.2'
    text: |-
      In afwijking van het eerste lid en [artikel 1, eerste lid, onderdeel u][ref1], wordt onder uitgaven mede verstaan
      20% van de uitgaven van € 1.000.000 of meer per bedrijfsmiddel die in aanmerking zijn genomen voor een beschikking
      als bedoeld in [artikel 3.52a, eerste lid, van de Wet inkomstenbelasting 2001][ref2] zoals deze luidde tot en met
      31 december 2015, voor zover deze uitgaven:


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 47.2.a
    text: |-
      zijn betaald door de S&O-inhoudingsplichtige of door een lichaam dat deel uitmaakt van dezelfde fiscale eenheid als
      de S&O-inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
  - number: 47.2.b
    text: dienstbaar zijn aan speur- en ontwikkelingswerk van de S&O-inhoudingsplichtige; en
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
  - number: 47.2.c
    text: |-
      niet in meer dan vier voorgaande kalenderjaren in een beschikking als bedoeld in
      [artikel 3.52a, eerste lid, van de Wet inkomstenbelasting 2001][ref1] zoals deze luidde tot en met 31 december 2015
      of in een S&O-verklaring zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '47.3'
    text: |-
      Met betrekking tot de toepassing van deze wet ter zake van speur- en ontwikkelingswerk dat is verricht voor
      1 januari 2016, blijven de bepalingen bij of krachtens de [hoofdstukken I][ref1], [VIII][ref2] en [XII][ref3] zoals
      deze luidden voor de wijzigingen ingevolge het [Belastingplan 2016][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0007746#HoofdstukXII
      [ref4]: https://wetten.overheid.nl/BWBR0036644
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0007746
        hoofdstuk: XII
      - id: ref4
        bwb_id: BWBR0036644
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel55
  - number: '55.2'
    text: 'Deze wet wordt aangehaald als: Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0007746/2020-01-01#Artikel55
