        hoofdstuk: XI
  - number: '34'
    text: De Wet bevordering arbeidsinpassing wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel34
  - number: '40.1'
    text: 'De afdrachtvermindering onderwijs is mede van toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: 40.1.a
    text: |-
      de werknemer die het onderricht in de praktijk van het beroep volgt van opleidingen leerlingwezen als bedoeld in
      artikel 2.10, eerste lid, van de Wet op het cursorisch beroepsonderwijs zoals dat luidde op 31 december 1995, op de
      grondslag van een in artikel 2.9 van die wet bedoelde leerovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: 40.1.b
    text: |-
      de werknemer die een primaire of een voortgezette praktijkopleiding volgt op de grondslag van een leerovereenkomst
      in de zin van de Wet op het leerlingwezen waarop van toepassing is artikel F.18 van de Wet van 27 mei 1992 (*Stb.*
      337) zoals dat luidde op 31 december 1995;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: 40.1.c
    text: |-
      de werknemer die een opleiding volgt als bedoeld in de Regeling positie zittende leerlingen opleidingen verpleging
      en verzorging oude stijl.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid is niet van toepassing ingeval het loon van die werknemer in het desbetreffende loontijdvak meer
      bedraagt dan diens toetsloon voor dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: '40.3'
    text: |-
      De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdelen *a* en *b*, bedoelde overeenkomst
      bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel40
  - number: '41'
    text: |-
      Met betrekking tot werknemers voor wie de arbeidsovereenkomst voorziet in een hoger loon dan het toetsloon, zijn
      [artikel 14, tweede lid][ref1], en [artikel 40, tweede lid][ref2], tot en met 31 december 1997 niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel40
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '40'
        hoofdstuk: XII
  - number: '42'
    text: De Wet belasting- en premiefaciliteit voor de zeevaart 1995 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel42
  - number: '43.1'
    text: |-
      Met betrekking tot gevallen waarin een verrekeningsbijdrage zeevaart als bedoeld in artikel III van de Wet
      faciliteit voor de zeevaart zoals deze luidde op 31 december 1994, is ingehouden, blijven de bepalingen welke
      ingevolge de Wet belasting- en premiefaciliteit voor de zeevaart 1995 zijn vervallen, ingetrokken of gewijzigd, van
      kracht zoals deze luidden op 31 december 1994.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel43
  - number: '43.2'
    text: |-
      Met betrekking tot gevallen waarin artikel 2 van de Wet belasting- en premiefaciliteit voor de zeevaart 1995
      toepassing heeft gevonden, blijven de bepalingen van die wet van kracht naar de tekst zoals die luidde op 31
      december 1995.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel43
  - number: '46'
    text: De Wet bevordering speur- en ontwikkelingswerk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel46
  - number: '47'
    text: |-
      Met betrekking tot gevallen waarin een S&O-vermindering heeft plaatsgevonden als bedoeld in
      [artikel 31 van de Wet op de loonbelasting 1964][ref1] zoals dat luidde op 31 december 1995, blijven de bepalingen
      van de hoofdstukken IVA en VIA van die wet en van de Wet bevordering speur- en ontwikkelingswerk van kracht naar de
      tekst zoals die luidde op 31 december 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '51'
    text: |-
      De Afbakeningsregeling speur- en ontwikkelingswerk en de Uitvoeringsregeling administratieve voorschriften Wet
      bevordering speur- en ontwikkelingswerk berusten op [artikel 1, derde lid, onderdeel ][ref1], onderscheidenlijk de
      [artikelen 24, vierde lid][ref2], en [25][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '52.1'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen zendt, in overeenstemming met Onze Minister van Financiën en
      na overleg met Onze Minister van Economische Zaken, voor 1 januari 2000 aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van [artikel 14, eerste lid, onderdeel ][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: '52.2'
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, in het
      jaar 2004 aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de praktijk
      van de arbo-afdrachtvermindering alsmede van de willekeurige afschrijving arbo-bedrijfsmiddelen in de
      [Wet inkomstenbelasting 2001][ref1] vergezeld van een oordeel over de afschaffing dan wel voortzetting van de
      regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel55
  - number: '55.2'
    text: 'Deze wet wordt aangehaald als: Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel55
