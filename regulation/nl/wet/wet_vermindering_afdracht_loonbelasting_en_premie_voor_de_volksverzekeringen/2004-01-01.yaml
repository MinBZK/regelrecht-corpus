  - number: 16b.3
    text: |-
      Op het toetsloon is [artikel 6][ref1] niet van toepassing. Het toetsloon en het maximum van de afdrachtvermindering
      worden naar evenredigheid verminderd met betrekking tot de werknemer wiens ouderschapsverlof een kortere duur heeft
      dan de volledige arbeidsduur in de zin van [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel6
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '6'
        hoofdstuk: II
  - number: 16b.4
    text: |-
      Volgens bij ministeriële regeling te stellen regels worden de afspraken tussen inhoudingsplichtige en werknemer
      met betrekking tot het opnemen van betaald ouderschapsverlof en de hoogte van het doorbetaalde loon per kind
      waarvoor ouderschapsverlof wordt opgenomen, schriftelijk vastgelegd en door beide partijen ondertekend. De
      inhoudingsplichtige bewaart een afschrift van deze overeenkomst bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16b
  - number: 16b.5
    text: Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16b
  - number: '17.1'
    text: |-
      De afdrachtvermindering zeevaart is van toepassing met betrekking tot zeevarenden. De afdrachtvermindering beloopt
      een bedrag ter grootte van het in het tweede lid genoemde percentage van het loon van de zeevarenden in het
      loontijdvak.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: '17.2'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: 17.2.a
    text: 'met betrekking tot de in Nederland wonende zeevarende die aan de loonbelasting is onderworpen: 40 percent;'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: 17.2.b
    text: 'met betrekking tot de niet in Nederland wonende zeevarende die aan de loonbelasting is onderworpen: 10 percent;'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: 17.2.c
    text: |-
      met betrekking tot de zeevarende die niet aan de loonbelasting is onderworpen en premieplichtig is voor de
      volksverzekeringen: 10 percent.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: '17.3'
    text: |-
      Op het in het eerste lid bedoelde loon is [artikel 1, eerste lid, onderdeel ][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
  - number: '17.4'
    text: |-
      De in het tweede lid vermelde percentages kunnen bij ministeriële regeling met ingang van een kalenderkwartaal
      worden vervangen door andere.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: '17.5'
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop de krachtens het vierde lid vastgestelde ministeriële regeling
      in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal besluit
      tot het niet aannemen van het voorstel, worden bij ministeriële regeling de krachtens het derde lid vervangen
      percentages met ingang van het eerstvolgende kalenderkwartaal vervangen door de percentages zoals die golden
      onmiddellijk vóór het in de eerste volzin bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel17
  - number: '18.1'
    text: |-
      Volgens bij ministeriële regeling te stellen regels maakt de inhoudingsplichtige per loontijdvak een berekening van
      het in [artikel 17, eerste lid][ref1], bedoelde loon en van het bedrag van de afdrachtvermindering zeevaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '17'
        hoofdstuk: VII
  - number: '18.2'
    text: |-
      De inhoudingsplichtige bewaart en registreert met betrekking tot het schip of de schepen waarop een of meer
      zeevarenden werkzaam zijn met betrekking tot wie de afdrachtvermindering zeevaart wordt toegepast:
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
  - number: 18.2.a
    text: |-
      afschriften van monsterrollen als bedoeld in [artikel 33 van de Zeevaartbemanningswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: 18.2.b
    text: |-
      afschriften van zeebrieven als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '3'
  - number: 18.2.c
    text: |-
      indien het betreft zeeschepen die zijn bestemd voor sleep- en hulpverleningswerkzaamheden op zee die worden
      gebezigd voor het verrichten van deze werkzaamheden aan zeeschepen: afschriften van certificaten van deugdelijkheid
      als bedoeld in [artikel 3, eerste lid, van de Schepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '3'
  - number: '18.3'
    text: |-
      De inhoudingsplichtige legt vast met betrekking tot welke zeevarenden hij in het kalenderjaar de
      afdrachtvermindering zeevaart heeft toegepast, alsmede het schip of de schepen waarop die zeevarenden werkzaam zijn
      geweest onder vermelding van de periode waarin dit plaatsvond.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
  - number: '18.4'
    text: |-
      De inhoudingsplichtige bewaart de in het tweede lid bedoelde gegevens, alsmede de in het tweede lid bedoelde
      afschriften en de in het derde lid bedoelde vastleggingen, bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
  - number: '18.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het tweede en derde lid genoemde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel18
  - number: '19'
    text: |-
      Indien de inhoudingsplichtige niet voldoet aan de in [artikel 18][ref1] bedoelde verplichtingen, wordt de
      afdrachtvermindering zeevaart geacht ten onrechte te hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel18
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '18'
        hoofdstuk: VII
  - number: '20'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel20
  - number: '21.1'
    text: |-
      De S&O-afdrachtvermindering is van toepassing met betrekking tot werknemers die direct betrokken zijn bij werk dat
      bij S&O-verklaring is aangemerkt als speur- en ontwikkelingswerk. De afdrachtvermindering beloopt 42 percent van
      het loon dat door die werknemers in het kalenderjaar is genoten ter zake van bedoeld speur- en ontwikkelingswerk
      voor zover dat loon in totaal niet meer bedraagt dan € 110 000, en 14 percent van dat loon voor zover dat in
      totaal meer bedraagt dan € 110 000. Als loon bedoeld in de vorige volzin wordt in totaal niet meer in aanmerking
      genomen dan het bedrag dat in de S&O-verklaring is aangemerkt als ten hoogste in aanmerking te nemen loon. De S&O-
      afdrachtvermindering bedraagt over een kalenderjaar maximaal € 7 941 154 per inhoudingsplichtige dan wel, ingeval
      de inhoudingsplichtige, beoordeeld naar de op het tijdstip waarop hij om de S&O-verklaring verzoekt bekende feiten
      en omstandigheden, bij de aanvang van het tijdvak waarop het verzoek betrekking heeft deel uitmaakt van een fiscale
      eenheid, per fiscale eenheid. In het laatste geval bedraagt de afdrachtvermindering per inhoudingsplichtige ten
      hoogste het in de S&O-verklaring aangegeven deel van het maximum van € 7 941 154.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het in het eerste lid vermelde percentage van 42 wordt vervangen door 60 indien de inhoudingsplichtige in
      een of meer van de vijf voorafgaande kalenderjaren geen inhoudingsplichtige was en voor die periode met
      betrekking tot ten hoogste twee kalenderjaren een S&O-verklaring is afgegeven. Indien de voor rekening
      van de inhoudingsplichtige gedreven onderneming een voortzetting is van een onderneming die, of een
      gedeelte van een onderneming dat direct of indirect is gedreven door een met hem verbonden vennootschap
      in de zin van [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1], dan wel voor rekening
      van een natuurlijk persoon die op het moment van aanvraag een aanmerkelijk belang in de zin van de
      [Wet op de inkomstenbelasting 2001][ref2] heeft in de inhoudingsplichtige, wordt voor de toepassing van de
      eerste volzin een ten aanzien van de verbonden vennootschap, onderscheidenlijk natuurlijk persoon, reeds voor
      de voortzetting afgegeven S&O-verklaring aangemerkt als een ten aanzien van de inhoudingsplichtige afgegeven
      verklaring. Een S&O-verklaring die is afgegeven voor een deel van een kalenderjaar wordt aangemerkt als een S&O-
      verklaring afgegeven met betrekking tot een heel kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0011353
  - number: '21.3'
    text: |-
      Op het in het eerste lid bedoelde loon is [artikel 1, eerste lid, onderdeel ][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
  - number: '21.4'
    text: |-
      Bij wijze van voorlopige voorziening kan niet meer dan een tijdsevenredig gedeelte van het op de voet van het
      eerste lid ten hoogste te belopen bedrag aan S&O-afdrachtvermindering in mindering worden gebracht op de over de
      ten tijde van de dagtekening van de S&O-verklaring nog niet verstreken tijdvakken van het kalenderjaar af te dragen
      loonbelasting (voorlopige S&O-afdrachtvermindering). De voorlopige S&O-afdrachtvermindering kan de over het tijdvak
      af te dragen loonbelasting niet verder verminderen dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel21
  - number: '21.5'
    text: |-
      De inhoudingsplichtige die deel uitmaakt van een fiscale eenheid en voor speur- en ontwikkelingswerk werknemers
      ter beschikking stelt van een onderneming binnen die fiscale eenheid, wordt volgens bij ministeriële regeling te
      stellen regels als S&O-inhoudingsplichtige aangemerkt en wordt tevens geacht dat speur- en ontwikkelingswerk zelf
      te verrichten. De inhoudingsplichtige is gehouden voor zoveel nodig de bij deze wet opgelegde verplichtingen te
      doen uitvoeren door de onderneming ter beschikking waarvan de werknemers worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel21
  - number: '22.1'
    text: |-
      De inhoudingsplichtige aan wie een S&O-verklaring is afgegeven, doet binnen vier maanden na afloop van het
      kalenderjaar aangifte van het in [artikel 21, eerste lid][ref1], bedoelde loon, van het bedrag van de S&O-
      afdrachtvermindering en van de over het kalenderjaar toegepaste voorlopige S&O-afdrachtverminderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel21
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '21'
        hoofdstuk: VIII
  - number: '22.2'
    text: 'Indien uit de in het eerste lid bedoelde aangifte blijkt dat het totaal der voorlopige S&O-afdrachtverminderingen:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: 22.2.a
    text: |-
      meer bedraagt dan het bedrag van de S&O-afdrachtvermindering, draagt de inhoudingsplichtige dit verschil op de
      aangifte af, waarbij de in [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] opgenomen
      betalingstermijn van één maand wordt vervangen door vier maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 22.2.b
    text: |-
      minder bedraagt dan het bedrag van de S&O-afdrachtvermindering, geldt de aangifte als verzoek om teruggaaf van
      belasting en geeft de inspecteur het verschil terug bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de S&O-verklaring wordt afgegeven na afloop van het kalenderjaar waarop de verklaring betrekking heeft, doet
      de inhoudingsplichtige binnen vier maanden na de dagtekening van de verklaring aangifte van het in het eerste lid
      bedoelde loon en van het bedrag van de S&O-afdrachtvermindering. De aangifte geldt als verzoek om teruggaaf en de
      inspecteur geeft het bedrag van de S&O-afdrachtvermindering terug bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien een S&O-verklaring is gewijzigd, treedt voor de toepassing van dit hoofdstuk de gewijzigde S&O-verklaring
      in de plaats van de eerdere S&O-verklaring en worden de nog toe te passen voorlopige S&O-afdrachtverminderingen
      zodanig aangepast dat over het kalenderjaar het totaal der voorlopige S&O-afdrachtverminderingen niet meer bedraagt
      dan het op de voet van [artikel 21, eerste lid][ref1], ten hoogste te belopen bedrag aan S&O-afdrachtvermindering.
      Ingeval een zodanige aanpassing niet mogelijk is omdat het totaal der reeds toegepaste voorlopige S&O-
      afdrachtverminderingen meer bedraagt dan het ten hoogste te belopen bedrag aan S&O-afdrachtvermindering, doet de
      inhoudingsplichtige, vooruitlopend op de in het eerste lid bedoelde aangifte, onverwijld aangifte van die gegevens
      en draagt hij gelijktijdig het verschil op de aangifte af. Hetgeen op deze wijze is afgedragen wordt tevens
      vermeld in de in het eerste lid bedoelde aangifte en komt in mindering op het totaal der in die aangifte aangegeven
      voorlopige S&O-afdrachtverminderingen. Ingeval de inhoudingsplichtige op het tijdstip waarop hij kennis neemt van
      de gewijzigde verklaring reeds aangifte heeft gedaan als bedoeld in het eerste of het derde lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel21
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '21'
        hoofdstuk: VIII
  - number: 22.4.a
    text: |-
      het totaal der voorlopige S&O-afdrachtverminderingen vermeerderd met het door de inspecteur ingevolge het tweede
      lid, onderdeel *b*, of derde lid, teruggegeven bedrag en verminderd met de ingevolge het tweede lid, onderdeel *a*,
      afgedragen belasting meer bedraagt dan de S&O-afdrachtvermindering, doet hij van deze gegevens onverwijld aangifte
      en draagt hij gelijktijdig het verschil op de aangifte af;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: 22.4.b
    text: |-
      het totaal der voorlopige S&O-afdrachtverminderingen vermeerderd met het door de inspecteur ingevolge het tweede
      lid, onderdeel *b*, of derde lid, teruggegeven bedrag en verminderd met de ingevolge het tweede lid, onderdeel
      *a*, afgedragen belasting minder bedraagt dan de S&O-afdrachtvermindering, doet hij van deze gegevens aangifte,
      geldt die aangifte als verzoek om teruggaaf en geeft de inspecteur het verschil terug bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '22.5'
    text: |-
      Indien een S&O-verklaring is ingetrokken, kan de inhoudingsplichtige geen S&O-afdrachtvermindering toepassen.
      Indien S&O-afdrachtvermindering of voorlopige S&O-afdrachtvermindering heeft plaatsgevonden, doet hij van deze
      gegevens onverwijld aangifte en draagt hij gelijktijdig de ten onrechte niet afgedragen belasting af.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '22.6'
    text: |-
      De inhoudingsplichtige verstrekt volgens bij ministeriële regeling te stellen regels een afschrift van de S&O-
      verklaring aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '22.7'
    text: |-
      De inhoudingsplichtige aan wie een S&O-verklaring is afgegeven houdt een overeenkomstig bij ministeriële regeling
      vast te stellen regels ingerichte administratie bij met betrekking tot het verrichte speur- en ontwikkelingswerk,
      de daarbij betrokken werknemers en het door hen ter zake genoten loon.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel22
  - number: '23'
    text: |-
      Teneinde zoveel mogelijk evenwicht te bereiken tussen de S&O-afdrachtverminderingen en het hiervoor in de
      rijksbegroting opgenomen bedrag, kunnen bij ministeriële regeling de in [artikel 21, eerste lid][ref1],
      vermelde percentages met ingang van 1 januari van enig jaar worden verhoogd tot ten hoogste 47,5 respectievelijk
      25, worden verlaagd, dan wel op nihil worden gesteld. Bij verlaging van de percentages wordt het in
      [artikel 21, eerste lid][ref2], eerstvermelde percentage zo veel mogelijk ontzien. De nieuwe percentages gelden met
      betrekking tot loon dat wordt genoten op of na de dag waarop de wijziging in werking treedt, behoudens voor zover
      dat loon reeds is betrokken in een S&O-verklaring welke betrekking heeft op een periode die is aangevangen voor de
      dag waarop de wijziging in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel21
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '21'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '21'
        hoofdstuk: VIII
  - number: '24.1'
    text: |-
      Aan een S&O-inhoudingsplichtige die voornemens is in een kalenderjaar speur- en ontwikkelingswerk te verrichten
      geeft Onze Minister van Economische Zaken op verzoek een S&O-verklaring af. In de verklaring wordt vermeld dat
      het aangemelde werk is aangemerkt als speur- en ontwikkelingswerk. Voorts wordt in de verklaring vermeld het
      bedrag van het vermoedelijke beloop van het in dat kalenderjaar te genieten loon voor zover dat betrekking zal
      hebben op speur- en ontwikkelingswerk en welk gedeelte daarvan, gelet op het in [artikel 22, eerste lid][ref1],
      bedoelde maximum ten hoogste in aanmerking kan worden genomen bij de toepassing van dat artikel. Indien de S&O-
      inhoudingsplichtige deel uitmaakt van een fiscale eenheid, wordt in de verklaring tevens vermeld welk deel van het
      op de fiscale eenheid betrekking hebbende bedrag van € 7 941 154, genoemd in [artikel 21, eerste lid][ref2], wordt
      toegerekend aan de S&O-inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel21
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '21'
        hoofdstuk: VIII
  - number: '24.2'
    text: |-
      Aan een S&O-belastingplichtige die voornemens is in een kalenderjaar ten minste 625 uren van zijn voor
      werkzaamheden beschikbare tijd te besteden aan speur- en ontwikkelingswerk geeft Onze Minister van Economische
      Zaken op verzoek een S&O-verklaring af. In de verklaring wordt vermeld dat het aangemelde werk is aangemerkt als
      speur- en ontwikkelingswerk.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
  - number: '24.3'
    text: |-
      Een verzoek om een S&O-verklaring moet door een S&O-inhoudingsplichtige onderscheidenlijk een S&O-
      belastingplichtige worden ingediend uiterlijk vier weken voor de aanvang van het kalenderhalfjaar waarin
      het desbetreffende loon zal worden genoten onderscheidenlijk uiterlijk vier weken voor de aanvang van het
      kalenderhalfjaar waarin het speur- en ontwikkelingswerk door de S&O-belastingplichtige zal worden verricht. Een
      verzoek kan betrekking hebben op het eerste of het tweede kalenderhalfjaar, dan wel op een geheel kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
  - number: '24.4'
    text: |-
      Bij ministeriële regeling van Onze Minister van Economische Zaken worden regels gesteld omtrent de inhoud van het
      verzoek en de wijze waarop het moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister van Economische Zaken wijkt bij zijn beslissing op het verzoek wat betreft het begrip loon niet af
      van hetgeen in het verzoek is vermeld.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
  - number: '24.6'
    text: |-
      De beslissing op het verzoek wordt gegeven binnen negen weken na de aanvang van het tijdvak waarop het verzoek
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
  - number: '24.7'
    text: |-
      Een S&O-verklaring kan worden gewijzigd of ingetrokken indien blijkt dat te harer verkrijging verstrekte gegevens
      of bescheiden zodanig onjuist of onvolledig zijn dat op het verzoek een andere beslissing zou zijn genomen
      indien bij de beoordeling daarvan de juiste omstandigheden volledig bekend zouden zijn geweest. Onjuistheid of
      onvolledigheid van gegevens of bescheiden die Onze Minister van Economische Zaken bekend was of redelijkerwijs
      bekend had kunnen zijn, kan geen grond opleveren voor wijziging of intrekking van een verklaring. Een S&O-
      verklaring kan tevens worden gewijzigd of ingetrokken indien blijkt dat de in [artikel 25][ref1] bedoelde
      administratie niet voldoet aan het bij of krachtens dat artikel bepaalde. De bevoegdheid tot het wijzigen of
      intrekken van een verklaring vervalt door verloop van vijf jaren na de dagtekening van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '24.8'
    text: |-
      In afwijking van het derde lid onderscheidenlijk zesde lid kan bij ministeriële regeling van Onze Minister
      van Economische Zaken een latere datum worden vastgesteld waarop het verzoek uiterlijk moet zijn ingediend
      onderscheidenlijk de beslissing op het verzoek uiterlijk moet zijn gegeven. In samenhang daarmee kan de in
      [artikel 23][ref1] bedoelde wijziging van percentages plaatsvinden na 1 januari, met terugwerkende kracht tot en
      met die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: '24.9'
    text: |-
      [Artikel 3.6, vijfde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25'
    text: |-
      De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven houdt een overeenkomstig bij ministeriële
      regeling van Onze Minister van Economische Zaken vast te stellen regels ingerichte administratie bij met betrekking
      tot de aard en de inhoud van het verrichte speur- en ontwikkelingswerk en de uren welke de daarbij betrokken
      werknemers hebben besteed aan het speur- en ontwikkelingswerk. De eerste volzin is van overeenkomstige toepassing
      met betrekking tot de S&O-belastingplichtige aan wie een S&O-verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel25
  - number: '26.1'
    text: |-
      De in de [artikelen 47 tot en met 51][ref1] en
      [53, eerste en vierde lid, tot en met 56 van de Algemene wet inzake rijksbelastingen][ref2] jegens de inspecteur
      opgelegde verplichtingen gelden mede jegens de door Onze Minister van Economische Zaken met betrekking tot de
      toepassing van dit hoofdstuk aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '26.2'
    text: |-
      De [artikelen 68][ref1], [69][ref2] en [72 van de Algemene wet inzake rijksbelastingen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel72
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '72'
  - number: 26a.1
    text: |-
      De arbo-afdrachtvermindering is van toepassing met betrekking tot de aanschaffings- of voortbrengingskosten van
      arbo-bedrijfsmiddelen voor bij de inhoudingsplichtige werkzame personen indien of voorzover de inhoudingsplichtige
      niet is onderworpen aan de inkomstenbelasting of de vennootschapsbelasting en de kosten niet in die hoedanigheid
      zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.2
    text: |-
      De afdrachtvermindering beloopt 3,5 percent van het bedrag dat de inhoudingsplichtige heeft betaald ter zake van de
      aanschaffing of voortbrenging van arbo-bedrijfsmiddelen, verminderd met de door de inhoudingsplichtige van derden
      ontvangen of nog te ontvangen bedragen ter zake van de arbo-bedrijfsmiddelen. Met betalen wordt gelijkgesteld het
      verrekenen of het rentedragend worden van de aanschaffings- of voortbrengingskosten, dan wel het ter beschikking
      stellen van de betaling.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.3
    text: |-
      Arbo-bedrijfsmiddelen zijn bedrijfsmiddelen die door Onze Minister van Sociale Zaken en Werkgelegenheid in
      overeenstemming met Onze Minister van Financiën op grond van [artikel 3.32 van de Wet inkomstenbelasting 2001][ref1]
      als zodanig zijn aangewezen, voorzover de aanschaffings- of voortbrengingskosten ten minste € 454 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 26a.4
    text: |-
      Ingeval een arbo-bedrijfsmiddel wordt vervreemd binnen 36 maanden na de aanvang van het kalenderjaar waarin de
      afdrachtvermindering ter zake van de aanschaffing of voortbrenging van het arbo-bedrijfsmiddel is genoten, wordt de
      af te dragen loonbelasting vermeerderd met een gelijk percentage als waarvoor afdrachtvermindering in aanmerking is
      genomen, van de overdrachtsprijs. De overdrachtsprijs wordt gesteld op de waarde die ten tijde van de vervreemding
      in het economische verkeer aan het arbo-bedrijfsmiddel kan worden toegekend. Ingeval een investering ongedaan wordt
      gemaakt, dan wel met betrekking tot een investering een vermindering, teruggaaf of vergoeding wordt genoten waarmee
      op de voet van het tweede lid nog geen rekening is gehouden, geldt zulks als vervreemding van een bedrijfsmiddel.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.5
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het in aanmerking nemen van de afdrachtvermindering alleen
      mogelijk is indien de aangegane verplichtingen of de in het kalenderjaar gemaakte voortbrengingskosten zijn
      aangemeld bij Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.6
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de arbo-afdrachtvermindering alleen van toepassing is indien op
      een door de inhoudingsplichtige gedaan verzoek door Onze Minister van Sociale Zaken en Werkgelegenheid is verklaard
      dat sprake is van een aangewezen bedrijfsmiddel. Bij die regeling kunnen tevens nadere regels worden gesteld met
      betrekking tot de verklaring.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.7
    text: |-
      Bij ministeriële regeling kan, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, met ingang
      van een kalenderkwartaal het in het tweede lid vermelde percentage worden vervangen door een ander, of kan de
      afdrachtvermindering arbo-bedrijfsmiddelen in het algemeen of voor bepaalde aangewezen bedrijfsmiddelen of bepaalde
      groepen van aangewezen bedrijfsmiddelen buiten toepassing worden gesteld, dan wel kan het in het tweede lid
      vermelde percentage voor bepaalde aangewezen bedrijfsmiddelen worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.8
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop de ministeriële regeling bedoeld in het zevende lid in
      werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel van wet wordt ingetrokken of indien een van de Kamers der Staten-Generaal
      tot het niet-aannemen van het voorstel besluit, worden onverwijld bij ministeriële regeling met ingang van het
      eerstvolgende kalenderkwartaal de krachtens het vorige lid aangebrachte wijzigingen ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
  - number: 26a.9
    text: |-
      Het achtste lid is niet van toepassing op een beperking van de afdrachtvermindering die plaatsvindt bij de
      aanwijzing van bedrijfsmiddelen op grond van [artikel 3.32 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '27'
    text: |-
      Indien over een kalenderjaar het totaal der voorlopige S&O-afdrachtverminderingen het bedrag van de S&O-
      afdrachtvermindering met twintig percent of meer overschrijdt, vormt dit een verzuim ter zake waarvan de inspecteur
      de inhoudingsplichtige een boete van ten hoogste € 4537 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel27
  - number: '28'
    text: |-
      Indien het aan opzet of grove schuld van de inhoudingsplichtige is te wijten dat over een kalenderjaar het totaal
      der voorlopige S&O-afdrachtverminderingen het bedrag van de S&O-afdrachtvermindering met twintig percent of meer
      overschrijdt, vormt dit een vergrijp ter zake waarvan de inspecteur de inhoudingsplichtige een boete kan opleggen
      van ten hoogste 100 percent van het verschil tussen het totaal der voorlopige S&O-afdrachtverminderingen en het
      bedrag van de S&O-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel28
  - number: '29'
    text: |-
      Indien het in [artikel 27][ref1] en [artikel 28][ref2] bedoelde verschil in belasting wordt nageheven, legt de
      inspecteur de in die artikelen bedoelde boeten op gelijktijdig met de vaststelling van de naheffingsaanslag. In
      andere gevallen vervalt de bevoegdheid tot het opleggen van de boeten door verloop van vijf jaren na het einde van
      het kalenderjaar waarop de S&O-afdrachtvermindering betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel28
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '28'
        hoofdstuk: IX
  - number: '30.1'
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van [artikel 67][ref2], is
      niet van toepassing met betrekking tot handelingen die worden verricht door andere dan de in
      [artikel 2, derde lid, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref3] genoemde
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '30.2'
    text: |-
      Onze Minister van Economische Zaken kan ontheffing verlenen van het in
      [artikel 67, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] vervatte verbod ter zake van de
      werkzaamheden bij de uitvoering van de [artikelen 24 tot en met 26 van deze wet][ref2] door hem of de door hem
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '30.3'
    text: |-
      Tegen een besluit genomen door een van de in het eerste lid dan wel de in [artikel 26a, zesde lid][ref1], genoemde
      bestuursorganen, met uitzondering van de Centrale organisatie werk en inkomen, kan de belanghebbende, in afwijking
      van [artikel 8:4, onderdeel g, van de Algemene wet bestuursrecht][ref2], beroep instellen bij het College van
      Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: 26a
        hoofdstuk: VIIIA
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '30.4'
    text: |-
      Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en het
      bestuursorgaan beroep in cassatie instellen ter zake van schending van de [artikelen 1][ref1] en [2][ref2] met
      betrekking tot het bepaalde omtrent de begrippen 'inhoudingsplichtige', 'loontijdvak', 'loon', 'onderneming',
      'fiscale eenheid' en 'werknemer', dan wel [artikel 26a, zesde lid][ref3], met betrekking tot het begrip
      bedrijfsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel26a
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007746
        artikel: 26a
        hoofdstuk: VIIIA
  - number: '30.5'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij het College van Beroep voor het bedrijfsleven de
      plaats inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30
  - number: 30a.1
    text: |-
      Bij het begin van het kalenderjaar worden de in [artikel 5, eerste lid, onderdeel a, en achtste lid][ref1],
      vermelde bedragen vervangen door andere. Deze bedragen worden berekend door de te vervangen bedragen te
      vermenigvuldigen met de verhouding van het bedrag genoemd in [artikel 8, eerste lid, onderdeel ][ref2] zoals
      dat luidt bij het begin van het kalenderjaar tot dat bedrag zoals dat luidt op 1 januari van het voorafgaande
      kalenderjaar en vervolgens de nodig geachte afrondingen aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 30a.2
    text: |-
      Bij de toepassing van het eerste lid wordt het in [artikel 5, achtste lid][ref1], vermelde bedrag niet
      hoger vastgesteld dan het gemiddelde bedrag van de werkgeverslasten bestaande uit premies voor de sociale
      verzekeringswetten en soortgelijke regelingen, premies voor regelingen voor vervroegde uittreding, premies in
      verband met loondoorbetaling tijdens ziekte van de werknemers. Bij ministeriële regeling van Onze Minister van
      Sociale Zaken en Werkgelegenheid, in overeenstemming met Onze Minister van Financiën, kunnen nadere regels worden
      gesteld omtrent de vaststelling van de hoogte van het gemiddelde bedrag van de werkgeverslasten.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '5'
        hoofdstuk: II
  - number: '31.1'
    text: |-
      Bij het begin van het kalenderjaar worden de in de [artikelen 7][ref1], [14, derde lid][ref2], en [16b][ref3]
      vermelde toetslonen en de in [artikel 16b][ref4] vermelde maximumbedragen van de afdrachtvermindering betaald
      ouderschapsverlof vervangen door andere.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
      [ref4]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0007746
        artikel: 16b
        hoofdstuk: VIA
      - id: ref4
        bwb_id: BWBR0007746
        artikel: 16b
        hoofdstuk: VIA
  - number: '31.2'
    text: |-
      Het in [artikel 7][ref1] vermelde toetsloon wordt gesteld op 110,5 percent van het twaalfvoud van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2] bedoelde bedrag,
      verminderd met het werknemersaandeel in de premie ingevolge de [Werkloosheidswet][ref3] en vermeerderd met het
      werkgeversaandeel in de premie ingevolge de [Ziekenfondswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002460
  - number: '31.3'
    text: |-
      Het in [artikel 14, derde lid][ref1], vermelde toetsloon wordt gesteld op 130 percent van het twaalfvoud van
      het in [artikel 8, eerste lid, onderdeel ][ref2] bedoelde bedrag, verminderd met het werknemersaandeel in de
      premie ingevolge de [Werkloosheidswet][ref3] en vermeerderd met het werkgeversaandeel in de premie ingevolge de
      [Ziekenfondswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002460
  - number: '31.4'
    text: |-
      Het in [artikel 16b, eerste lid][ref1], laatstvermelde bedrag wordt gesteld op 70 percent van het twaalfvoud
      van het in [Artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premies ingevolge de [Werkloosheidswet][ref3]
      en vermeerderd met het werkgeversaandeel in de premie ingevolge de [Ziekenfondswet][ref4]. De overige in
      [artikel 16b, eerste lid][ref5], vermelde bedragen worden dienovereenkomstig vastgesteld op basis van de
      desbetreffende krachtens [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref6] bepaalde
      minimumjeugdlonen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002460
      [ref5]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
      [ref6]: https://wetten.overheid.nl/BWBR0002638#Artikel8
