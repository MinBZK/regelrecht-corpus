      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VII
  - number: '5.6'
    text: |-
      De S&O-afdrachtvermindering beloopt een bedrag te bepalen op de voet van [hoofdstuk VIII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VIII
  - number: '5.7'
    text: |-
      De arbo-afdrachtvermindering beloopt een bedrag te bepalen op de voet van [hoofdstuk VIIIA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VIIIA
  - number: '5.8'
    text: |-
      Ingeval de som van de afdrachtvermindering lage lonen en de afdrachtvermindering onderwijs op de voet van de vorige
      leden meer dan € 3405 bedraagt, wordt de afdrachtvermindering lage lonen zodanig verlaagd dat de bedoelde som €
      3405 bedraagt.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
  - number: '5.9'
    text: |-
      De in het eerste lid opgenomen bedragen, alsmede het toetsloon, worden naar tijdsgelang verdeeld over de
      loontijdvakken van het kalenderjaar. Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de
      werknemer wiens dienstbetrekking niet gedurende het gehele kalenderjaar heeft bestaan.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      De in [artikel 5, eerste en achtste lid][ref1], opgenomen bedragen alsmede het toetsloon worden naar evenredigheid
      verminderd met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '5'
        hoofdstuk: II
  - number: 6.1.a
    text: de werknemer met een overeengekomen arbeidsduur die korter is dan de volledige arbeidsduur;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
  - number: 6.1.b
    text: de werknemer zonder overeengekomen vaste arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de volledige arbeidsduur voor een kalenderweek gesteld op 36 uren. Bij
      ministeriële regeling kan voor bijzondere gevallen een afwijkende volledige arbeidsduur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel *b*, vindt de vermindering plaats aan de hand van het aantal uren
      waarover loon is verschuldigd. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      vorige volzin, alsmede voor het geval het loon niet per tijdseenheid wordt berekend.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
  - number: '6.4'
    text: |-
      De inhoudingsplichtige kan een door hem aan te wijzen categorie werknemers als bedoeld in het eerste lid, onderdeel
      *a*, voor de duur van het kalenderjaar aanmerken als werknemers, bedoeld in het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel6
  - number: '7'
    text: |-
      De afdrachtvermindering lage lonen is van toepassing met betrekking tot de werknemer die de leeftijd heeft bereikt
      van 23 jaren en wiens loon in het desbetreffende loontijdvak niet meer bedraagt dan diens toetsloon voor dat
      tijdvak. Het toetsloon voor de afdrachtvermindering lage lonen bedraagt per kalenderjaar: € 17 806.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel7
  - number: 13a
    text: |-
      In aanvulling op [artikel 1, eerste lid, onderdeel c][ref1], wordt voor de toepassing van dit hoofdstuk het loon
      tevens verminderd met toeslagen die verband houden met ploegendiensten dan wel met onregelmatige diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
  - number: '14.1'
    text: 'De afdrachtvermindering onderwijs is van toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: 14.1.a
    text: |-
      de werknemer die de beroepspraktijkvorming volgt van de beroepsbegeleidende leerweg van een in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref1] bedoelde
      beroepsopleiding, op de grondslag van een in [artikel 7.2.8 van die wet][ref2] bedoelde overeenkomst, gesloten
      door de in [artikel 7.2.9 van die wet][ref3] genoemde partijen en mede ondertekend door het bestuur van het
      desbetreffende landelijk orgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 14.1.b
    text: |-
      de werknemer aangesteld als assistent in opleiding als bedoeld in
      [artikel 9.60, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], bij een
      universiteit, dan wel aangesteld als onderzoeker in opleiding als bedoeld in de [artikelen 15.5](onbekend) en
      [16.17 van het Rechtspositiereglement Wetenschappelijk Onderwijs en Onderzoek](onbekend), bij de Nederlandse
      Organisatie voor Wetenschappelijk Onderzoek onderscheidenlijk de Koninklijke Nederlandse Akademie van Wetenschappen
      of als onderzoeker in opleiding in dienst van een onder deze organisaties ressorterende onderzoekinstelling, een en
      ander op de grondslag van een overeenkomst tussen de universiteit of een van de genoemde onderzoekorganisaties dan
      wel een onder deze organisaties ressorterende onderzoekinstelling enerzijds en een privaatrechtelijke rechtspersoon
      of de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO anderzijds ter zake van de
      financiering van de loonkosten van de werknemer door de desbetreffende privaatrechtelijke rechtspersoon of de
      Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: 14.1.c
    text: |-
      de werknemer van een privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO met een loon overeenkomstig dat van een assistent in opleiding als bedoeld
      in [artikel 9.60, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], die een
      promotie-onderzoek verricht op de grondslag van een overeenkomst tussen die privaatrechtelijke rechtspersoon
      of de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO enerzijds en een universiteit
      anderzijds ter zake van de begeleiding van het promotie-onderzoek van de werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: 14.1.d
    text: |-
      de werknemer die in het kader van zijn initiële opleiding aan een hogeschool in de zin van
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] op de grondslag van een
      onderwijsarbeidsovereenkomst, gesloten tussen de hogeschool, de werkgever en hemzelf, op zijn opleiding
      aansluitende arbeid verricht in een bij ministeriële regeling aangewezen bedrijfssector en tevens niet is
      ingeschreven als student voor het volgen van in voltijdse vorm verzorgd onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 14.1.e
    text: |-
      de werknemer die een bij ministeriële regeling vast te stellen vorm van scholing volgt die gericht is op het op een
      startkwalificatieniveau brengen van personen die dat niveau missen;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: 14.1.f
    text: |-
      degene die bij de inhoudingsplichtige op basis van een leer-werkovereenkomst het buitenschoolse
      praktijkgedeelte volgt van een leer-werktraject, een en ander als bedoeld in [artikel 10b1][ref1] en
      [10b3 van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b3
  - number: '14.2'
    text: |-
      De in het eerste lid, onderdeel f, bedoelde persoon wordt voor de toepassing van deze wet en de krachtens deze wet
      uitgevaardigde regelingen, aangemerkt als werknemer met een volledige arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het eerste lid, aanhef en onderdelen a en d, is niet van toepassing ingeval het loon van die werknemer die jonger
      is dan 25 jaar in het desbetreffende loontijdvak meer bedraagt dan diens toetsloon voor dat tijdvak. Het toetsloon
      voor de afdrachtvermindering onderwijs bedraagt € 20 793 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '14.4'
    text: |-
      De afdrachtvermindering onderwijs op de voet van het eerste lid, onderdelen b en c, is met betrekking tot een
      werknemer gedurende ten hoogste 48 maanden van toepassing. De afdrachtvermindering onderwijs op de voet van
      het eerste lid, onderdeel d, is met betrekking tot een werknemer ten hoogste 24 maanden van toepassing. Indien
      [artikel 6, eerste lid, aanhef en onderdeel a][ref1], met betrekking tot een werknemer toepassing vindt, wordt de
      termijn van 48 maanden onderscheidenlijk 24 maanden met betrekking tot deze werknemer naar evenredigheid verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel6
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '6'
        hoofdstuk: II
  - number: '14.5'
    text: 'Het eerste lid, aanhef en onderdeel e, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: 14.5.a
    text: |-
      het loon van de werknemer in het desbetreffende loontijdvak meer bedraagt dan het in het derde lid, tweede volzin,
      genoemde toetsloon, of
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: 14.5.b
    text: |-
      de werkgever niet over een verklaring beschikt waarin de Centrale organisatie werk en inkomen verklaart dat de
      werknemer vóór indiensttreding een werkloze is.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '14.6'
    text: |-
      De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdelen a, b, c, d en f, bedoelde
      overeenkomst bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '14.7'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens de in het eerste lid, onderdelen a, b, c, d en f,
      bedoelde overeenkomsten ten minste dienen te bevatten voor de toepassing van deze wet alsmede welke partij of
      partijen de administratie voert onderscheidenlijk voeren die voortvloeit uit de overeenkomsten, bedoeld in het
      eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '14.8'
    text: |-
      De inhoudingsplichtige bewaart een afschrift van de in het vijfde lid, onderdeel b, bedoelde verklaring bij de
      loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel14
  - number: '15'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Onderwijs, Cultuur en Wetenschappen, na overleg met Onze Minister
      van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen ter bevordering van een goede
      uitvoering van dit hoofdstuk en artikel 40, alsmede met betrekking tot het verschaffen van inlichtingen aan door
      Onze Minister van Onderwijs, Cultuur en Wetenschappen ten behoeve van het verkrijgen van inzicht in de werking van
      dit hoofdstuk aan te wijzen instanties.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel15
  - number: '16.1'
    text: |-
      De afdrachtvermindering kinderopvang is van toepassing met betrekking tot kosten van kinderopvang van kinderen en
      pleegkinderen van werknemers. De afdrachtvermindering beloopt 50 percent van het bedrag dat de inhoudingsplichtige
      ter zake van kinderopvang in het loontijdvak direct, dan wel indirect door middel van vergoedingen aan werknemers,
      heeft betaald voor kinderopvang, voorzover dat bedrag per kalenderjaar niet meer bedraagt dan € 21 400, en 30
      percent van dat bedrag voorzover dat bedrag per kalenderjaar meer bedraagt dan € 21 400. Voorzover de kinderopvang
      bij de werknemer thuis plaatsvindt, wordt als bedrag dat de inhoudingsplichtige ter zake van kinderopvang direct,
      dan wel indirect door middel van vergoedingen aan werknemers, heeft betaald voor kinderopvang, ten hoogste € 9626
      per kind per kalenderjaar in aanmerking genomen. Het bedrag dat de inhoudingsplichtige ter zake van kinderopvang
      direct, dan wel indirect door middel van vergoedingen aan werknemers, heeft betaald voor kinderopvang wordt
      verminderd met de door de inhoudingsplichtige ter zake van de kinderopvang van derden ontvangen of nog te ontvangen
      bedragen, met het bedrag dat door de werknemers ter zake van de kinderopvang aan de inhoudingsplichtige is vergoed
      en met het bedrag dat op voorschotten is terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ingeval de betaling door de inhoudingsplichtige geschiedt aan een
      fonds dat zich geheel of nagenoeg geheel bezig houdt met de financiering van kinderopvang, bedoeld in het eerste
      lid, voor zover de inhoudingsplichtige een collectieve arbeidsovereenkomst heeft die in zodanige betaling voorziet.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
  - number: '16.3'
    text: |-
      Ingeval de inhoudingsplichtige zelf kinderopvang als bedoeld in het eerste lid verricht beloopt de
      afdrachtvermindering kinderopvang 50 dan wel 30 percent van de daaraan toe te rekenen kosten, verminderd met de
      door de inhoudingsplichtige ter zake van de kinderopvang van derden ontvangen of nog te ontvangen bedragen en met
      het bedrag dat de werknemers ter zake van de kinderopvang in rekening wordt gebracht. Bij ministeriële regeling
      worden regels gesteld ter bepaling van de aan de kinderopvang toe te rekenen kosten.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
  - number: '16.4'
    text: |-
      In afwijking van het eerste en het derde lid worden door de inhoudingsplichtige direct of indirect van rijkswege of
      in samenhang daarmee van derden ontvangen bijdragen in de kosten voor kinderopvang niet in mindering gebracht op de
      kosten waarover de afdrachtvermindering kinderopvang wordt berekend. Voor de situatie waarin indirect van rijkswege
      of in samenhang daarmee van derden een bijdrage wordt ontvangen kunnen bij ministeriële regeling regels worden
      gesteld met betrekking tot de wijze waarop wordt bepaald welk deel daarvan van rijkswege is verstrekt.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
  - number: '16.5'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt met betaald zijn van kosten gelijkgesteld het verrekend
      zijn of het rentedragend zijn geworden van die kosten dan wel het ter beschikking gesteld zijn van de betaling.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het in het eerste lid, derde volzin, vermelde bedrag wordt bij het begin van het kalenderjaar van rechtswege
      vervangen door het bedrag dat krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1] wordt vastgesteld
      ter vervanging van de in [artikel 3.143 van die wet][ref2] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16a
    text: |-
      Onze minister kan, zo nodig onder voorwaarden, toestaan dat de toepassing van de afdrachtvermindering kinderopvang
      wordt verlegd naar de inhoudingsplichtige die de kosten van kinderopvang voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel16a
  - number: 16b.1
    text: |-
      De afdrachtvermindering betaald ouderschapsverlof is van toepassing met betrekking tot het loon dat wordt
      doorbetaald tijdens het ouderschapsverlof van de werknemer, indien het doorbetaalde loon in het desbetreffende
      loontijdvak ten minste gelijk is aan diens toetsloon voor dat tijdvak en het recht op doorbetaling van ten
      minste het toetsloon is geregeld bij collectieve arbeidsovereenkomst of een regeling door of namens een daartoe
      bevoegd bestuursorgaan, dan wel geldt voor ten minste driekwart van de werknemers van de inhoudingsplichtige.
      De afdrachtvermindering geldt ten hoogste voor het totale aantal uren verlof waarop de werknemer op grond van
      [artikel 6:2 van de Wet arbeid en zorg][ref1] recht heeft. De afdrachtvermindering beloopt 50 percent van het
      doorbetaalde loon met een maximum per werknemer per kalenderjaar van







