    text: |-
      de [artikelen 6][ref1] en [16b][ref2] in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
