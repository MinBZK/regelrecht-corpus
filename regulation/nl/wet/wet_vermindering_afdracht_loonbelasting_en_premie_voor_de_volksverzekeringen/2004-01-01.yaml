      [Wet arbeidsongeschiktheidsverzekeringen][ref1], de [Wet arbeidsongeschiktheidsverzekeringen zelfstandigen][ref2],
      en de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3], niet aangemerkt als loon uit vroegere
      dienstbetrekking;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 1.2.b
    text: |-
      voorzover ingevolge [artikel 12a van de Wet op de loonbelasting 1964][ref1] het loon hoger is dan het werkelijk
      genoten loon, in afwijking van [artikel 13a, derde lid, van die wet][ref2] het meerdere geacht te zijn genoten
      gedurende het gehele kalenderjaar, waarbij aan elke maand een twaalfde deel van het meerdere wordt toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 13a
  - number: '1.3'
    text: 'Voor de toepassing van het eerste lid, onderdeel n, wordt niet tot speur- en ontwikkelingswerk gerekend:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
  - number: 1.3.a
    text: marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
  - number: 1.3.b
    text: organisatorische en administratieve werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
  - number: 1.3.c
    text: door Onze Minister van Economische Zaken bij ministeriële regeling aangewezen andere werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
  - number: '1.4'
    text: |-
      De in deze wet bedoelde ministeriële regelingen worden, voor zover niet anders is bepaald, uitgevaardigd door Onze
      Minister, wat betreft de regelingen bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
