    text: artikel 23 in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      [Artikel 2, derde en vierde lid][ref1], en [artikel 5 van de Wet op de loonbelasting 1964][ref2] zijn van
      overeenkomstige toepassing, met dien verstande dat in afwijking van artikel 2, derde lid, van die wet, de niet
      in Nederland wonende bestuurder of commissaris van een in Nederland gevestigd lichaam niet als werknemer wordt
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '5'
  - number: '2.3'
    text: |-
      Als dienstbetrekking worden mede beschouwd de arbeidsverhoudingen, bedoeld in de
      __REF000___________________________________________________________________________________________________________
      ______.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
  - number: '3.1'
    text: |-
      De inhoudingsplichtige kan de over een tijdvak af te dragen loonbelasting, dan wel af te dragen loonbelasting en
      premie voor de volksverzekeringen verminderen, doch niet verder dan tot nihil, met:
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.a
    text: de afdrachtvermindering lage lonen;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.c
    text: de afdrachtvermindering onderwijs;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.e
    text: de afdrachtvermindering kinderopvang;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.f
    text: de afdrachtvermindering betaald ouderschapsverlof;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.g
    text: de afdrachtvermindering zeevaart;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.h
    text: de S&O-afdrachtvermindering;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: 3.1.i
    text: de arbo-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      De afdrachtvermindering lage lonen, de afdrachtvermindering kinderopvang, de afdrachtvermindering betaald
      ouderschapsverlof en de S&O-afdrachtvermindering komen in mindering op de af te dragen loonbelasting.
      Uitsluitend voor de toepassing van de vorige volzin door de inhoudingsplichtige wordt af te dragen premie voor de
      volksverzekeringen gelijkgesteld met af te dragen loonbelasting.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      De afdrachtvermindering onderwijs, de afdrachtvermindering zeevaart en de arbo-afdrachtvermindering komen in
      mindering op de af te dragen loonbelasting en premie voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Voor zover loon in aanmerking is genomen voor de toepassing van de S&O-afdrachtvermindering vindt de
      afdrachtvermindering zeevaart geen toepassing.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel4
  - number: '5.1'
    text: 'Met betrekking tot een werknemer met een volledige arbeidsduur bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
  - number: 5.1.a
    text: 'de afdrachtvermindering lage lonen per kalenderjaar:  € 1093;'
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
  - number: 5.1.c
    text: |-
      de afdrachtvermindering onderwijs beloopt met betrekking tot de in
      [artikel 14, eerste lid onderdelen a tot en met d en f][ref1], bedoelde werknemers:  € 2 500 per kalenderjaar.
      De afdrachtvermindering onderwijs beloopt met betrekking tot de in [artikel 14, eerste lid, onderdeel e][ref2],
      bedoelde werknemer:  € 1 500 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel5
    references:
