        artikel: '8'
  - number: '31.6'
    text: |-
      Indien ingevolge een van de sociale-verzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt voor de toepassing van het tweede tot en met vijfde lid het percentage in aanmerking
      genomen dat wordt vastgesteld krachtens [artikel 9, vierde lid, van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '32'
    text: |-
      Ter bevordering van een goede uitvoering van deze wet kunnen bij ministeriële regeling nadere, zo nodig afwijkende
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel32
  - number: '33.1'
    text: |-
      Indien naar de regels van de wet zoals die luidden op 31 december 2002 een inhoudingsplichtige met betrekking tot
      een op die datum bij hem in dienstbetrekking zijnde werknemer de afdrachtvermindering langdurig werklozen geniet,
      blijft ten aanzien van die inhoudingsplichtige met betrekking tot die werknemer de met ingang van 1 januari 2003
      vervallen regeling inzake de afdrachtvermindering langdurig werklozen doorlopen tot uiterlijk 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
  - number: '33.2'
    text: |-
      Voor de toepassing van het eerste lid bedraagt de afdrachtvermindering langdurig werklozen per kalenderjaar:
      € 2 352.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
  - number: '33.3'
    text: |-
      Voor de toepassing van het eerste lid bedraagt het toetsloon voor de afdrachtvermindering langdurig werklozen per
      kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
  - number: 33.3.a
    text: |-
      ten aanzien van de werknemer die bij aanvaarding van de dienstbetrekking de leeftijd van 50 jaar niet heeft
      bereikt: € 20 027;
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
  - number: 33.3.b
    text: |-
      ten aanzien van de werknemer die bij aanvaarding van de dienstbetrekking de leeftijd van 50 jaar heeft bereikt: €
      23 015.
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
  - number: '33.4'
    text: |-
      Bij het begin van het kalenderjaar worden de in het derde lid vermelde toetslonen vervangen door andere.
      Het in het derde lid, onderdeel a, vermelde toetsloon wordt gesteld op 125 percent van het twaalfvoud
      van het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premie ingevolge de Werkloosheidswet en
      vermeerderd met het werkgeversaandeel in de premie ingevolge de [Ziekenfondswet][ref2]. Het in het
      derde lid, onderdeel b, vermelde toetsloon wordt gesteld op 144,5 percent van het twaalfvoud van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref3] bedoelde bedrag,
      verminderd met het werknemersaandeel in de premie ingevolge de Werkloosheidswet en vermeerderd met het
      werkgeversaandeel in de premie ingevolge de [Ziekenfondswet][ref4]. [Artikel 31, vierde lid][ref5], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002460
      [ref5]: https://wetten.overheid.nl/BWBR0007746#Artikel31
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel33
