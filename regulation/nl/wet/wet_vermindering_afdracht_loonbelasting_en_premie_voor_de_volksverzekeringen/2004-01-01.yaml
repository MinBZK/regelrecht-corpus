  - number: '31.5'
    text: |-
      Het in [artikel 16b, tweede lid][ref1], laatstvermelde bedrag wordt gesteld op 70 percent van het twaalfvoud
      van het in [Artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premies ingevolge de [Werkloosheidswet][ref3]
      en vermeerderd met het werkgeversaandeel in de premie ingevolge de [Ziekenfondswet][ref4]. De overige in
      [artikel 16b, tweede lid][ref5], vermelde toetslonen worden dienovereenkomstig vastgesteld op basis van de
      desbetreffende krachtens [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref6] bepaalde
      minimumjeugdlonen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002460
      [ref5]: https://wetten.overheid.nl/BWBR0007746#Artikel16b
      [ref6]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2004-01-01#Artikel31
