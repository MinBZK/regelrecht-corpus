  - number: '2'
    text: |-
      1 Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of publiekrechtelijke
      dienstbetrekking staat.

      2 [Artikel 2, derde, vierde en vijfde lid][ref1], en [artikel 5 van de Wet op de loonbelasting 1964][ref2] zijn van
      overeenkomstige toepassing.

      3 Als dienstbetrekking worden mede beschouwd de arbeidsverhoudingen,
      bedoeld in de [artikelen 3, eerste lid, onderdelen c, d, f en h][ref3], en
      [4, onderdelen a, b en e, van de Wet op de loonbelasting 1964][ref4].

      4 Als werknemer worden mede beschouwd de in [artikel 14, eerste lid, onderdelen f en g][ref5], bedoelde personen.


