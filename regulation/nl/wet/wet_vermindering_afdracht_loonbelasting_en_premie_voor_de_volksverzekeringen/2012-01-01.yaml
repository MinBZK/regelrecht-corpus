  - number: '20'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 De S&O-afdrachtvermindering is met betrekking tot een aangiftetijdvak van toepassing indien de S&O-
      inhoudingsplichtige beschikt over een ten name van hem afgegeven S&O-verklaring die betrekking heeft op een periode
      waarin het aangiftetijdvak eindigt. Het totaal van de S&O-afdrachtvermindering beloopt het bij die S&O-verklaring
      ter zake vastgestelde bedrag.

      2 Per aangiftetijdvak wordt maximaal een evenredig deel van het bij de S&O-verklaring vastgestelde bedrag aan S&O-
      afdrachtvermindering in aanmerking genomen. De evenredigheid is gerelateerd aan het aantal aangiftetijdvakken die
      vanaf het desbetreffende aangiftetijdvak nog eindigen in de periode waarop de S&O-verklaring betrekking heeft.

      3 Ingeval na afloop van de periode waarop de S&O-verklaring betrekking heeft een nog niet verrekend bedrag aan S&O-
      afdrachtvermindering resteert, en er in een aangiftetijdvak dat is geëindigd in de periode waarop de S&O-verklaring
      betrekking heeft nog ruimte voor afdrachtvermindering is, wordt het niet verrekende bedrag daar zoveel mogelijk
      mee verrekend. Voorzover toepassing van de eerste volzin tot gevolg heeft dat een nog niet verrekend bedrag met
      een reeds verstreken aangiftetijdvak wordt verrekend, wordt de aangifte over dat reeds verstreken tijdvak voor de
      toepassing van [artikel 28a van de Wet op de loonbelasting 1964][ref1] aangemerkt als een onjuiste of onvolledige
      aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: '22'
    text: |-
      1 De S&O-inhoudingsplichtige kan voor een aaneengesloten periode van ten minste drie kalendermaanden en ten
      hoogste zes kalendermaanden vallende binnen één kalenderjaar en in totaal voor niet meer dan drie perioden per
      kalenderjaar, een S&O-verklaring aanvragen. Een kalendermaand waarop een aanvraag betrekking heeft kan niet meer
      worden betrokken in een latere aanvraag.

      2 De S&O-inhoudingsplichtige kan, in afwijking van het eerste lid, een aanvraag indienen voor een periode van een
      heel kalenderjaar als hij beschikt over een onderzoek- of een ontwikkelafdeling en:

      a. aan de S&O-inhoudingsplichtige in het voorafgaande kalenderjaar een S&O-verklaring is verstrekt, of

      b. indien de S&O-inhoudingsplichtige deel uitmaakt van een fiscale eenheid, aan een ander binnen de fiscale eenheid
      in het voorafgaande kalenderjaar een S&O-verklaring is verstrekt.

      Onze Minister van Economische Zaken, Landbouw en Innovatie kan bij ministeriële regeling nadere regels stellen
      omtrent de toepassing van de eerste volzin.

      3 Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de inhoud van de aanvraag van een S&O-verklaring en de wijze waarop deze moet worden ingediend, waarbij in
      het algemeen of voor groepen van gevallen kan worden bepaald dat de aanvraag uitsluitend op elektronische wijze kan
      worden gedaan.

      4 De aanvraag moet worden ingediend ten minste een kalendermaand voorafgaande aan de periode waarop de aanvraag
      betrekking heeft. De beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na de aanvang van de
      periode waarop de aanvraag betrekking heeft. Onze Minister van Economische Zaken, Landbouw en Innovatie kan
      bij ministeriële regeling in het algemeen of voor groepen van gevallen, een latere datum vaststellen waarop de
      beslissing op de aanvraag uiterlijk moet zijn gegeven.

      5 De aanvraag wordt in de situatie waarin de S&O-inhoudingsplichtige in het S&O-referentiejaar speur- en
      ontwikkelingswerk heeft verricht waarvoor een S&O-verklaring is verstrekt, slechts in behandeling genomen indien
      hij uiterlijk bij de indiening van de aanvraag opgave heeft gedaan van de burgerservicenummers van zijn werknemers
      die dat speur- en ontwikkelingswerk hebben verricht.

      6 Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de wijze waarop de opgave van de burgerservicenummers, bedoeld in het vijfde lid, moet worden gedaan,
      waarbij in het algemeen of voor groepen van gevallen kan worden bepaald dat de opgave van die burgerservicenummers
      uitsluitend op elektronische wijze kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister van Economische Zaken, Landbouw en Innovatie verstrekt aan een S&O-inhoudingsplichtige die
      voornemens is in een periode van een kalenderjaar speur- en ontwikkelingswerk te verrichten, op zijn aanvraag op de
      voet van [artikel 22][ref1] een S&O-verklaring.

      2 De S&O-verklaring bevat:

      a. een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;

      b. de periode waarvoor de S&O-verklaring wordt verstrekt;

      c. het aantal uren dat werknemers van de S&O-inhoudingsplichtige in die periode aan het speur- en ontwikkelingswerk
      naar verwachting zullen besteden;

      d. het bedrag aan S&O-afdrachtvermindering met een berekening van dat bedrag.

      3 Het bedrag aan S&O-afdrachtvermindering beloopt 14 percent van het product van het aantal uren, bedoeld in het
      tweede lid, onderdeel c, en het gemiddelde uurloon als bedoeld in het vierde lid, vermeerderd met 31 percent van
      dat product voorzover dat product in het kalenderjaar niet uitgaat boven € 110 000. De vermeerdering met 31 percent
      blijft achterwege voorzover die vermeerdering reeds toepassing heeft gevonden bij een S&O-verklaring betreffende
      een eerdere periode van het kalenderjaar.

      4 Het gemiddelde uurloon wordt gesteld op het uurloon dat de S&O-inhoudingsplichtige in het S&O-referentiejaar
      gemiddeld heeft betaald aan zijn werknemers die in dat jaar speur- en ontwikkelingswerk hebben verricht waarvoor
      een S&O-verklaring is verstrekt. Het gemiddelde uurloon wordt daarbij gesteld op de som van de door de S&O-
      inhoudingsplichtige aan deze werknemers in het S&O-referentiejaar betaalde lonen gedeeld door de som van de in het
      S&O-referentiejaar door de S&O-inhoudingsplichtige aan deze werknemers verloonde uren nadat de som van de verloonde
      uren is vermenigvuldigd met 0,85; de uitkomst van deze deling wordt naar boven afgerond op een veelvoud van € 5.
      Het gemiddelde uurloon wordt aldus bepaald aan de hand van de gegevens zoals die blijken uit de polisadministratie
      van het Uitvoeringsinstituut Werknemersverzekeringen op een bij ministeriële regeling van Onze Minister van
      Economische Zaken, Landbouw en Innovatie vast te stellen peildatum gelegen in het kalenderjaar volgende op het S&O-
      referentiejaar. Indien de berekening aan de hand van de gegevens op de peildatum leidt tot een evident onjuist
      gemiddeld uurloon, wordt het gemiddelde uurloon bepaald aan de hand van de juiste gegevens zoals die blijken na
      uitvraag daarvan bij de S&O-inhoudingsplichtige door Onze Minister van Economische Zaken, Landbouw en Innovatie.
      Ingeval de S&O-inhoudingsplichtige in het S&O-referentiejaar geen speur- en ontwikkelingswerk heeft verricht
      waarvoor hij over een S&O-verklaring beschikt, geldt een gemiddeld uurloon van € 29.

      5 Het totaal van de S&O-afdrachtvermindering over een kalenderjaar bedraagt per S&O-inhoudingsplichtige maximaal
      € 14 000 000 dan wel, ingeval de inhoudingsplichtige deel uitmaakt of in een deel van het kalenderjaar heeft
      uitgemaakt, van een fiscale eenheid, per fiscale eenheid. In het laatste geval wordt in de S&O-verklaring
      vastgesteld welk deel van het bedrag van € 14 000 000, betrekking heeft op de S&O-inhoudingsplichtige.

      6 De inhoudingsplichtige die deel uitmaakt van een fiscale eenheid en voor speur- en ontwikkelingswerk werknemers
      ter beschikking stelt aan een onderneming binnen die fiscale eenheid, wordt geacht dat speur- en ontwikkelingswerk
      zelf te verrichten. Op deze inhoudingsplichtige is het bij of krachtens deze wet bepaalde zoveel mogelijk van
      overeenkomstige toepassing met dien verstande dat de inhoudingsplichtige de verplichtingen in voorkomende gevallen
      zal doen uitvoeren door de onderneming die het speur- en ontwikkelingswerk uitvoert.

      7 Het in het derde lid vermelde percentage van 31  wordt vervangen door 46 indien de S&O-inhoudingsplichtige
      in een of meer van de vijf voorafgaande kalenderjaren geen inhoudingsplichtige was en voor die periode met
      betrekking tot ten hoogste twee kalenderjaren een S&O-verklaring is afgegeven. Indien de voor rekening van
      de inhoudingsplichtige gedreven onderneming een voortzetting is van een onderneming die, of een gedeelte
      van een onderneming dat direct of indirect is gedreven door een met hem verbonden vennootschap in de zin van
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref2], dan wel voor rekening van een natuurlijk
      persoon die op het moment van aanvraag een aanmerkelijk belang in de zin van de Wet op de inkomstenbelasting 2001
      heeft in de inhoudingsplichtige, wordt voor de toepassing van de eerste volzin een ten aanzien van de verbonden
      vennootschap, onderscheidenlijk natuurlijk persoon, reeds voor de voortzetting afgegeven S&O-verklaring aangemerkt
      als een ten aanzien van de inhoudingsplichtige afgegeven verklaring. Een S&O-verklaring die is afgegeven voor
      een deel van een kalenderjaar wordt aangemerkt als een S&O-verklaring afgegeven met betrekking tot een heel
      kalenderjaar.

      8 In afwijking van [artikel 1, eerste lid, onderdeel c][ref3], is het loon, bedoeld in het vierde lid, het loon in
      de zin van de [Wet op de loonbelasting 1964][ref4], zonder de verminderingen als bedoeld in dat onderdeel.


