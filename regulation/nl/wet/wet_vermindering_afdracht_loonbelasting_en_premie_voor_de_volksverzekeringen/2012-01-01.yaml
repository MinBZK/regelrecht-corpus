  - number: '3'
    text: |-
      1 De inhoudingsplichtige kan de over een tijdvak af te dragen loonbelasting, dan wel af te dragen loonbelasting en
      premie voor de volksverzekeringen verminderen, doch niet verder dan tot nihil, met:

      a.

      b.

      c. de afdrachtvermindering onderwijs;

      d.

      e.

      f.

      g. de afdrachtvermindering zeevaart;

      h. de S&O-afdrachtvermindering.

      2 De S&O-afdrachtvermindering komt in mindering op de af te dragen loonbelasting. Uitsluitend voor de toepassing
      van de vorige volzin door de inhoudingsplichtige wordt af te dragen premie voor de volksverzekeringen gelijkgesteld
      met af te dragen loonbelasting.

      3 De afdrachtvermindering onderwijs en de afdrachtvermindering zeevaart komen in mindering op de af te dragen
      loonbelasting en premie voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Voor zover loon in aanmerking is genomen voor de toepassing van de S&O-afdrachtvermindering vindt de
      afdrachtvermindering zeevaart geen toepassing.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel4
  - number: '5'
    text: |-
      1 De afdrachtvermindering onderwijs bedraagt met betrekking tot:

      a. de in [artikel 14, eerste lid, onderdeel a][ref1], bedoelde werknemer: € 2 753 per kalenderjaar;

      b. de in [artikel 14, eerste lid, onderdelen b en c][ref2], bedoelde werknemers: € 2 781 per kalenderjaar;

      c. de in [artikel 14, eerste lid, onderdeel d][ref3], bedoelde werknemer: € 2 753 per kalenderjaar;

      d. de in [artikel 14, eerste lid, onderdeel e][ref4], bedoelde werknemer: € 3 337 per kalenderjaar;

      e. de in [artikel 14, eerste lid, onderdeel f][ref5], bedoelde werknemer: € 2 781 per kalenderjaar;

      f. de in [artikel 14, eerste lid, onderdeel g][ref6], bedoelde werknemer: € 1 322 per kalenderjaar;

      g. de in [artikel 14, eerste lid, onderdeel h][ref7], bedoelde werknemer: € 334 per EVC-procedure.

      2 De afdrachtvermindering zeevaart beloopt een bedrag te bepalen op de voet van [hoofdstuk VII][ref8].

      3 De S&O-afdrachtvermindering beloopt een bedrag te bepalen op de voet van [hoofdstuk VIII][ref9].

      4 De in het eerste lid, onderdelen a, b, c, d, e en f, opgenomen bedragen, alsmede het toetsloon, worden naar
      tijdsgelang verdeeld over de loontijdvakken van het kalenderjaar. Bij ministeriële regeling kunnen regels worden
      gesteld met betrekking tot de werknemer wiens dienstbetrekking niet gedurende het gehele kalenderjaar heeft
      bestaan.

      5 Met betrekking tot de in [artikel 14a, eerste lid][ref10], bedoelde werknemer wordt de afdrachtvermindering
      voor het loontijdvak waarin de aanvraag, bedoeld in artikel 14a, derde lid, in behandeling wordt genomen tot en
      met het laatste loontijdvak dat eindigt voor de datum waarop de verklaring, bedoeld in artikel 14a, eerste lid,
      wordt afgegeven, per loontijdvak gesteld op een evenredig deel van de in het eerste lid, onderdeel a, onderdeel c,
      onderscheidenlijk onderdeel f, opgenomen bedragen. Het op grond van de eerste volzin vastgestelde bedrag wordt in
      aanmerking genomen in het loontijdvak waarin de verklaring, bedoeld in artikel 14a, eerste lid, wordt afgegeven of
      in het daaropvolgende loontijdvak.

      6 Het in het eerste lid, onderdeel g, opgenomen bedrag wordt in aanmerking genomen in het loontijdvak waarin de
      werknemer, bedoeld in [artikel 14, eerste lid, onderdeel h][ref11], aanvangt met het volgen van de EVC-procedure of
      in het daaropvolgende loontijdvak.


