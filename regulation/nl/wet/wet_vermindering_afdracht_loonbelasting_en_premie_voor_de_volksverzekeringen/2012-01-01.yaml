preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de werkgelegenheid maatregelen te
    treffen ter vermindering van bepaalde loonkosten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. inhoudingsplichtige: hetgeen daaronder wordt verstaan voor de heffing van de loonbelasting;

      b. loontijdvak: hetgeen daaronder wordt verstaan voor de heffing van de loonbelasting;

      c. loon: loon in de zin van de [Wet op de loonbelasting 1964][ref1], verminderd met daarin begrepen:

      1°. tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden
      toegekend;

      2°. overwerkloon;

      3°. loon uit vroegere dienstbetrekking;

      4°. loon in de vorm van krachtens een publiekrechtelijke regeling of collectieve arbeidsovereenkomst regelmatig bij
      de betaling van het loon verstrekte vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken;

      5°. loon ter zake waarvan de belasting ingevolge [artikel 31 van die wet][ref2] wordt geheven van de
      inhoudingsplichtige;

      d. toetsloon: het in het desbetreffende hoofdstuk van deze wet opgenomen bedrag aan loon waarboven of waaronder de
      inhoudingsplichtige niet in aanmerking komt voor de in dat hoofdstuk voorziene afdrachtvermindering;

      e. aangiftetijdvak: het tijdvak waarover krachtens
      [artikel 19, tweede lid, onderdeel a, van de Algemene wet inzake rijksbelastingen][ref3] de loonbelasting moet
      worden betaald;

      f. assistent in opleiding: degene die tijdelijk is aangesteld bij een universiteit teneinde zich door het
      verrichten van wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te bekwamen tot
      wetenschappelijk onderzoeker of technologisch ontwerper;

      g. onderzoeker in opleiding: degene die na een met goed gevolg afgelegd doctoraal examen bij een universiteit
      dan wel een afsluitend examen bij een instelling voor hoger beroepsonderwijs, in tijdelijke dienst is aangesteld
      teneinde zich door het verrichten van wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te
      bekwamen tot wetenschappelijk onderzoeker of technologisch ontwerper;

      ga. promovendus: degene die tijdelijk is aangesteld bij een universiteit teneinde zich door het verrichten
      van wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te bekwamen tot wetenschappelijk
      onderzoeker of technologisch ontwerper;

      h. zeeschip: een schip ten aanzien waarvan de [Zeevaartbemanningswet][ref4] van toepassing is, dat is voorzien
      van een zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref5] en dat in het kader van een
      onderneming grotendeels op zee wordt geëxploiteerd voor het vervoer van zaken of personen in het internationale
      verkeer over zee, het vervoer van zaken of personen over zee ten behoeve van de exploratie of exploitatie van
      natuurlijke rijkdommen op zee, het verrichten van sleep- en hulpverleningswerkzaamheden op zee aan schepen als
      bedoeld in [artikel 1, tweede lid, van de Schepenwet][ref6], het verrichten van baggerwerkzaamheden of overige bij
      ministeriële regeling nader te bepalen activiteiten op zee, met uitzondering van:

      1°. een schip dat wordt gebruikt voor de loodsdienst;

      2°. een schip dat wordt gebruikt voor de zeilvaart, niet zijnde een schip dat voldoet aan de in het derde lid
      genoemde voorwaarden;

      2bis°. een schip dat wordt gebruikt voor de sportvisserij;

      3°. een schip in havensleepdienst als bedoeld in onderdeel ha;

      4°. een schip dat wordt gebruikt voor baggerwerkzaamheden dat niet over eigen voortstuwing beschikt of dat niet is
      ingericht voor het vervoer van lading over zee, en

      5°. een schip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of van andere levende
      rijkdommen van de zee;

      ha. havensleepdienst: het geheel van werkzaamheden en activiteiten door een sleepboot als bedoeld in onderdeel
      hb grotendeels in en rond havens en op binnenwateren van de Europese Gemeenschap verricht, ten behoeve van het
      assisteren bij het meren, ontmeren en verhalen van zeeschepen die gebruik maken van eigen voortstuwing en die
      inkomen van of uitgaan naar zee;

      hb. sleepboot: een schip ten aanzien waarvan de [Zeevaartbemanningswet][ref7] van toepassing is, dat is voorzien
      van een zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref8] en is bestemd voor het
      verrichten van sleep- en hulpverleningswerkzaamheden op zee;

      i. zeevarende: degene die als kapitein, scheepsofficier of scheepsgezel werkzaam is op een zeeschip dat in
      Nederland is geregistreerd en de Nederlandse vlag voert, tenzij hij werkzaam is op een schip dat een geregelde
      passagiersdienst onderhoudt tussen havens van de Europese Gemeenschap en hij niet de nationaliteit heeft van een
      van de Lidstaten van de Europese Gemeenschap of de Europese Economische Ruimte;

      ia. zee: alle wateren die zich bevinden voorbij de laagwaterlijn van de kust. Indien een transport over zee
      plaatsvindt met inbegrip van transport door een waterweg van maritieme aard in de zin van [verordening (EG) nr.
      13/2004](32004R0013) van de Commissie van de Europese Gemeenschap van 8 december 2003 (Pb EU, nr. L3), wordt het
      transport voor het gehele traject geacht transport over zee te zijn;

      ib. binnenwateren: wateren anders dan bedoeld in onderdeel ia;

      j. onderneming: een onderneming in de zin van de [Wet inkomstenbelasting 2001][ref9] of de
      [Wet op de vennootschapsbelasting 1969][ref10];

      k. fiscale eenheid: een eenheid in de zin van de [artikelen 15][ref11] en
      [15a van de Wet op de vennootschapsbelasting 1969][ref12];

      l. S&O-inhoudingsplichtige:

      1°. een inhoudingsplichtige die tevens een onderneming drijft;

      2°. een inhoudingsplichtige die niet tevens een onderneming drijft, voor zover hij speur- en ontwikkelingswerk
      verricht krachtens een schriftelijk vastgelegde overeenkomst met en voor rekening van een onderneming,
      een samenwerkingsverband van degenen die een onderneming drijven of een lichaam als bedoeld in de
      [Wet op de bedrijfsorganisatie][ref13];

      m. S&O-belastingplichtige: een natuurlijke persoon die voldoet aan het urencriterium, bedoeld in
      [artikel 3.6 van de Wet inkomstenbelasting 2001][ref14];

      n. speur- en ontwikkelingswerk: door een S&O-inhoudingsplichtige, dan wel een S&O-belastingplichtige, systematisch
      georganiseerde en in een lidstaat van de Europese Unie verrichte werkzaamheden, direct en uitsluitend gericht op:

      1°. technisch-wetenschappelijk onderzoek;

      2°. de ontwikkeling van voor de S&O-inhoudingsplichtige of de S&O-belastingplichtige technisch nieuwe (onderdelen
      van) fysieke producten, (onderdelen van) fysieke productieprocessen, of (onderdelen van) programmatuur;

      3°. het uitvoeren van een systematisch opgezette analyse van de technische haalbaarheid van het zelf verrichten van
      het speur- en ontwikkelingswerk, bedoeld onder 1°of 2°, of

      4°. het uitvoeren van een technisch onderzoek naar een substantiële wijziging van een productiemethode, indien de
      wijziging kan leiden tot een significante verbetering van het fysieke productieproces dat reeds wordt toegepast in
      de onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige, dan wel naar modellering van processen,
      indien deze kan leiden tot een significante verbetering van programmatuur die reeds wordt toegepast in de
      onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige.

      o. programmatuur: het niet-fysieke, logische deelsysteem van een informatiesysteem dat de structuur van de gegevens
      en van de verwerkingsprocessen bepaalt;

      p. S&O-referentiejaar: het tweede kalenderjaar voorafgaande aan het kalenderjaar waarop de S&O-afdrachtvermindering
      betrekking heeft;

      q. S&O-verklaring: de door Onze Minister van Economische Zaken, Landbouw en Innovatie op de voet van
      [artikel 23][ref15] aan een S&O-inhoudingsplichtige of [artikel 27][ref16] aan een S&O-belastingplichtige afgegeven
      verklaring betreffende speur- en ontwikkelingswerk;

      r. EVC-procedure: procedure erkenning verworven competenties.

      2 Voor de toepassing van het eerste lid, onderdeel c, wordt:

      a. loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref17], de [Wet op de arbeidsongeschiktheidsverzekering][ref18],
      de [Wet arbeidsongeschiktheidsverzekeringen zelfstandigen][ref19], en de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref20], niet aangemerkt als loon uit vroegere
      dienstbetrekking;

      b. voorzover ingevolge [artikel 12a van de Wet op de loonbelasting 1964][ref21] het loon hoger is dan het werkelijk
      genoten loon, in afwijking van [artikel 13a, derde lid, van die wet][ref22] het meerdere geacht te zijn genoten
      gedurende het gehele kalenderjaar, waarbij aan elke maand een twaalfde deel van het meerdere wordt toegerekend.

      3 Voor toepassing van het eerste lid, onderdeel h, onder 2°, dient:

      a. door of namens de Nederlandse Inspectie Verkeer en Waterstaat voor het schip een veiligheidscertificaat met
      onbeperkt vaargebied te zijn afgegeven, welk certificaat vermeldt dat het schip voldoet aan:

      1°. de krachtens [artikel 5, tweede lid, van de Schepenwet][ref23] uitgevaardigde voorschriften voor Commercial
      Cruising Vessels;

      2°. de voorschriften van het SOLAS-verdrag;

      3°. de voorschriften van de Special Purpose Ship (SPS) Code, of

      4°. de voorschriften van de Special Purpose Ship Code 2008;

      b. het schip een lengte te hebben van ten minste 24 meter, bepaald op basis van de International Convention on
      Load Lines.

      4 Voor de toepassing van het eerste lid, onderdeel n, wordt niet tot speur- en ontwikkelingswerk gerekend:

      a. marktonderzoek;

      b. organisatorische en administratieve werkzaamheden;

      c. door Onze Minister van Economische Zaken, Landbouw en Innovatie bij ministeriële regeling aangewezen andere
      werkzaamheden.

      5 De in deze wet bedoelde ministeriële regelingen worden, voor zover niet anders is bepaald, uitgevaardigd door
      Onze Minister, wat betreft de regelingen bedoeld in:

      a. [artikel 6][ref24] in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. [artikel 14][ref25] in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      c. de [artikelen 17][ref26], [18][ref27] en [20][ref28] in overeenstemming met Onze Minister van Infrastructuur en
      Milieu en Onze Minister van Sociale Zaken en Werkgelegenheid.


