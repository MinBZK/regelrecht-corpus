  - number: '15'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Onderwijs, Cultuur en Wetenschappen, na overleg met Onze Minister
      van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen ter bevordering van een goede
      uitvoering van dit hoofdstuk, alsmede met betrekking tot het verschaffen van inlichtingen aan door Onze Minister
      van Onderwijs, Cultuur en Wetenschappen ten behoeve van het verkrijgen van inzicht in de werking van dit hoofdstuk
      aan te wijzen instanties.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel15
  - number: '17'
    text: |-
      1 De afdrachtvermindering zeevaart is van toepassing met betrekking tot zeevarenden. De afdrachtvermindering
      beloopt een bedrag ter grootte van het in het tweede lid genoemde percentage van het loon van de zeevarenden in
      het loontijdvak. Bij zeevarenden op schepen bestemd voor baggerwerkzaamheden, onderscheidenlijk schepen bestemd
      voor sleep- en hulpverleningswerkzaamheden wordt als loon niet in aanmerking genomen het gedeelte van het loon dat
      toerekenbaar is aan andere werkzaamheden dan vervoer van opgebaggerd materiaal over zee, onderscheidenlijk andere
      werkzaamheden dan sleep- en hulpverleningswerkzaamheden op zee.

      2 Het in het eerste lid bedoelde percentage bedraagt:

      a. met betrekking tot de in Nederland, een Lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte wonende zeevarende: 40 percent;

      b. met betrekking tot de niet in Nederland, een Lidstaat van de Europese Unie of een andere staat die partij is bij
      de Europese Economische Ruimte wonende zeevarende die aan de loonbelasting is onderworpen of premieplichtig is voor
      de volksverzekeringen: 10 percent.

      3 Op het in het eerste lid bedoelde loon is niet van toepassing
      [artikel 1, eerste lid, onderdeel c, onder 1°, 2° en 4°][ref1], alsmede
      [artikel 1, eerste lid, onderdeel c, onder 5°][ref2], voorzover sprake is van loon dat in geblokkeerde vorm wordt
      gespaard ingevolge een spaarloonregeling.

      4 De in het tweede lid vermelde percentages kunnen bij ministeriële regeling met ingang van een kalenderkwartaal
      worden vervangen door andere.

      5 Uiterlijk binnen drie maanden na het tijdstip waarop de krachtens het vierde lid vastgestelde ministeriële
      regeling in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der
      Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal
      besluit tot het niet aannemen van het voorstel, worden bij ministeriële regeling de krachtens het vierde lid
      vervangen percentages met ingang van het eerstvolgende kalenderkwartaal vervangen door de percentages zoals die
      golden onmiddellijk vóór het in de eerste volzin bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel1
