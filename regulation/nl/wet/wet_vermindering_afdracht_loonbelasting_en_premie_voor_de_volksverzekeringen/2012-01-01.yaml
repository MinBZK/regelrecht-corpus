      1 De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de [artikelen 63][ref2] en
      [67][ref3], is niet van toepassing met betrekking tot de uitvoering van deze wet door andere dan de in
      [artikel 2, derde lid, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref4] genoemde
      bestuursorganen.

      2 Voor de toepassing van de [artikelen 63][ref5] en [67 van de Algemene wet inzake rijksbelastingen][ref6]
      betreffende de uitvoering van deze wet door Onze Minister van Economische Zaken, Landbouw en Innovatie,
      onderscheidenlijk Onze Minister van Onderwijs, Cultuur en Wetenschap, of de door hem aangewezen ambtenaren, treedt
      Onze Minister van Economische Zaken, Landbouw en Innovatie, onderscheidenlijk Onze Minister van Onderwijs, Cultuur
      en Wetenschap, in de plaats van Onze Minister.

      3 Tegen een besluit genomen door een van de in het eerste lid, genoemde bestuursorganen bij toepassing van
      [hoofdstuk V][ref7], onderscheidenlijk [hoofdstuk VIII][ref8], kan de belanghebbende beroep instellen bij
      de Afdeling bestuursrechtspraak van de Raad van State, onderscheidenlijk het College van Beroep voor het
      bedrijfsleven.

      4 Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en het
      bestuursorgaan beroep in cassatie instellen ter zake van schending van de [artikelen 1][ref9] en [2][ref10] met
      betrekking tot het bepaalde omtrent de begrippen 'inhoudingsplichtige', 'aangiftetijdvak', 'loon', 'onderneming',
      'fiscale eenheid' en 'werknemer'.

      5 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij het College van Beroep voor het
      bedrijfsleven de plaats inneemt van een gerechtshof.


