  - number: '29'
    text: |-
      Teneinde zoveel mogelijk evenwicht te bereiken tussen de S&O-afdrachtverminderingen en het hiervoor in de
      rijksbegroting opgenomen bedrag, kan bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw
      en Innovatie, onder overeenkomstige aanpassing van dit artikel, met ingang van 1 januari van enig jaar het in
      [artikel 23, derde lid][ref1], vermelde percentage van 14, worden verhoogd tot ten hoogste 25, worden verlaagd, dan
      wel op nihil worden gesteld en kan, eveneens onder overeenkomstige aanpassing van dit artikel, het in artikel 23,
      derde en zevende lid, vermelde percentage van 31, worden verhoogd tot ten hoogste 33,5, worden verlaagd, dan wel
      op nihil worden gesteld. Bij verlaging van de percentages wordt het percentage van 31 zo veel mogelijk ontzien. De
      nieuwe percentages gelden met betrekking tot S&O-verklaringen die betrekking hebben op een periode die aanvangt op
      of na de dag waarop de wijziging in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
