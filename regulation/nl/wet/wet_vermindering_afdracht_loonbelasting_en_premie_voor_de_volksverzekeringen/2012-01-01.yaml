  - number: 30a
    text: |-
      Bij het begin van het kalenderjaar worden de in [artikel 5, eerste lid][ref1], genoemde bedragen vervangen door
      andere. Deze bedragen worden berekend door de te vervangen bedragen te vermenigvuldigen met de verhouding van het
      bedrag genoemd in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2]
      zoals dat luidt bij het begin van het kalenderjaar tot dat bedrag zoals dat luidt op 1 januari van het voorafgaande
      kalenderjaar, en vervolgens de nodig geachte afrondingen aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel30a
