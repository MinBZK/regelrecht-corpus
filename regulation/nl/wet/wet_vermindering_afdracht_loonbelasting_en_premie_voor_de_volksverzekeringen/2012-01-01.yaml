  - number: '31'
    text: |-
      1 Bij het begin van het kalenderjaar wordt het in [artikel 14, derde lid][ref1], vermelde toetsloon vervangen door
      een ander toetsloon.

      2 Het in [artikel 14, derde lid][ref2], vermelde toetsloon wordt gesteld op 130 percent van het twaalfvoud
      van het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref3]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premie ingevolge
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref4] en vermeerderd met de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref5].

      3 Indien ingevolge een van de sociale-verzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt voor de toepassing van het tweede lid het percentage in aanmerking genomen dat wordt
      vastgesteld krachtens [artikel 9, vijfde lid, van de Algemene Ouderdomswet][ref6].


