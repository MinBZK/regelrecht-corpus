    text: |-
      1 Aan een S&O-belastingplichtige die voornemens is in een kalenderjaar ten minste 500 uren van zijn voor
      werkzaamheden beschikbare tijd te besteden aan speur- en ontwikkelingswerk geeft Onze Minister van Economische
      Zaken, Landbouw en Innovatie op aanvraag een S&O-verklaring af.

      2 Aanvragen kunnen voor het laatst worden ingediend drie kalendermaanden voor het einde van het kalenderjaar. De
      beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na indiening van de aanvraag.

      3 De S&O-verklaring die ten name van een S&O-belastingplichtige wordt afgegeven, bevat:

      a. een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;

      b. het kalenderjaar waarvoor de S&O-verklaring wordt verstrekt.

      4 De S&O-belastingplichtige aan wie een S&O-verklaring is afgegeven en die in het kalenderjaar minder dan 500
      uren van zijn voor werkzaamheden beschikbare tijd heeft besteed aan het speur- en ontwikkelingswerk waarop de S&O-
      verklaring betrekking heeft, doet daarvan binnen drie kalendermaanden na afloop van het kalenderjaar waarop de S&O-
      verklaring betrekking heeft mededeling aan Onze Minister van Economische Zaken, Landbouw en Innovatie.

      5 [Artikel 3.6, vijfde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.

      6 [Artikel 24, eerste lid][ref2], is van overeenkomstige toepassing met betrekking tot de S&O-belastingplichtige
      aan wie een S&O-verklaring is afgegeven.

      7 Onze Minister van Economische Zaken, Landbouw en Innovatie trekt de S&O-verklaring in indien:

      a. blijkt dat de in [artikel 24, eerste lid][ref3], bedoelde administratie niet voldoet aan het bij of krachtens
      dat artikel bepaalde;

      b. de S&O-belastingplichtige de mededeling, bedoeld in het vierde lid, deed, of aannemelijk is dat hij dat had
      behoren te doen;

      c. aannemelijk is dat ter verkrijging van de S&O-verklaring gegevens of bescheiden zijn verstrekt die zodanig
      onjuist of onvolledig zijn dat op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste omstandigheden volledig bekend zouden zijn geweest.

      8 Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de inhoud van de aanvraag en de wijze waarop deze moet worden ingediend. Onze Minister van Economische
      Zaken, Landbouw en Innovatie kan bij ministeriële regeling nadere regels stellen ten aanzien van de inhoud van de
      mededeling, bedoeld in het vierde lid, en de indiening daarvan.


