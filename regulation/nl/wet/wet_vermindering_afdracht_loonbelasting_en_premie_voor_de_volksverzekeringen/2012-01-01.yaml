  - number: '34'
    text: |-
      Artikel 26a, vierde lid, zoals dit luidde op 31 december 2004 blijft van toepassing met betrekking tot arbo-
      bedrijfsmiddelen ter zake waarvan de inhoudingsplichtige arbo-afdrachtvermindering heeft genoten.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel34
  - number: 41a
    text: |-
      De op 1 januari 2006 vervallen regeling inzake de afdrachtvermindering betaald ouderschapsverlof blijft doorlopen
      tot uiterlijk 31 december 2006 met betrekking tot een werknemer die in het kalenderjaar 2006 ouderschapsverlof
      geniet waarbij loon wordt doorbetaald krachtens een op de laatste dag van het kalenderjaar 2005 bestaande:

      a. collectieve arbeidsovereenkomst;

      b. regeling door of namens een daartoe bevoegd bestuursorgaan of

      c. regeling van de inhoudingsplichtige welke geldt voor ten minste driekwart van de werknemers van de
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel41a
  - number: '42'
    text: De Wet belasting- en premiefaciliteit voor de zeevaart 1995 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 Met betrekking tot gevallen waarin een verrekeningsbijdrage zeevaart als bedoeld in artikel III van de Wet
      faciliteit voor de zeevaart zoals deze luidde op 31 december 1994, is ingehouden, blijven de bepalingen welke
      ingevolge de Wet belasting- en premiefaciliteit voor de zeevaart 1995 zijn vervallen, ingetrokken of gewijzigd, van
      kracht zoals deze luidden op 31 december 1994.

      2 Met betrekking tot gevallen waarin artikel 2 van de Wet belasting- en premiefaciliteit voor de zeevaart 1995
      toepassing heeft gevonden, blijven de bepalingen van die wet van kracht naar de tekst zoals die luidde op 31
      december 1995.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel43
  - number: '46'
    text: De Wet bevordering speur- en ontwikkelingswerk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel46
  - number: '47'
    text: |-
      1 Met betrekking tot de toepassing van deze wet terzake van speur- en ontwikkelingswerk dat is verricht voor
      1 januari 2006, blijven de bepalingen bij of krachtens de [hoofdstukken VIII][ref1] en [IX][ref2] zoals deze
      luidden voor de wijzigingen ingevolge het [Belastingplan 2006][ref3], van toepassing.

      2 Aanvragen voor een S&O-verklaring met betrekking tot kalendermaanden in 2006 die zijn of worden ingediend op
      de voet van [artikel 24, derde lid][ref4], zoals dat luidde voor de wijzigingen ingevolge het Belastingplan 2006,
      worden behandeld als aanvragen die zijn ingediend met inachtneming van [artikel 22, eerste lid][ref5], of, indien
      de aanvrager een S&O-belastingplichtige is, [artikel 27, tweede lid][ref6], zoals deze luiden na de wijzigingen
      ingevolge het [Belastingplan 2006][ref7].

      3 Met betrekking tot aanvragen als bedoeld in het tweede lid, is voor de wijze van indiening en de inhoud van
      de aanvragen van toepassing hetgeen is bepaald bij of krachtens [artikel 24][ref8] zoals dat luidde voor de
      wijzigingen ingevolge het [Belastingplan 2006][ref9].


