  - number: '32'
    text: |-
      Ter bevordering van een goede uitvoering van deze wet kunnen bij ministeriële regeling nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2012-01-01#Artikel32
  - number: '33'
    text: |-
      1 Indien naar de regels van de wet zoals die luidden op 31 december 2002 een inhoudingsplichtige met betrekking tot
      een op die datum bij hem in dienstbetrekking zijnde werknemer de afdrachtvermindering langdurig werklozen geniet,
      blijft ten aanzien van die inhoudingsplichtige met betrekking tot die werknemer de met ingang van 1 januari 2003
      vervallen regeling inzake de afdrachtvermindering langdurig werklozen doorlopen tot uiterlijk 1 januari 2007.

      2 Voor de toepassing van het eerste lid bedraagt de afdrachtvermindering langdurig werklozen per kalenderjaar:
      € 2 352.

      3 Voor de toepassing van het eerste lid bedraagt het toetsloon voor de afdrachtvermindering langdurig werklozen
      per kalenderjaar:

      a. ten aanzien van de werknemer die bij aanvaarding van de dienstbetrekking de leeftijd van 50 jaar niet heeft
      bereikt: € 20 111;

      b. ten aanzien van de werknemer die bij aanvaarding van de dienstbetrekking de leeftijd van 50 jaar heeft bereikt:
      € 23 118.

      4 Bij het begin van het kalenderjaar worden de in het derde lid vermelde toetslonen vervangen door andere.
      Het in het derde lid, onderdeel a, vermelde toetsloon wordt gesteld op 125 percent van het twaalfvoud
      van het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premie ingevolge
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2] en vermeerderd
      met de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref3]. Het in het derde
      lid, onderdeel b, vermelde toetsloon wordt gesteld op 144,5 percent van het twaalfvoud van het
      in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref4]
      bedoelde bedrag, verminderd met het werknemersaandeel in de premie ingevolge
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref5] en vermeerderd met de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref6].


