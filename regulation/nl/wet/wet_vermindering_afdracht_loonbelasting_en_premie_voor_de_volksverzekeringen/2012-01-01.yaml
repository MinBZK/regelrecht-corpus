  - number: 13a
    text: |-
      In aanvulling op [artikel 1, eerste lid, onderdeel c][ref1], wordt voor de toepassing van dit hoofdstuk het loon
      tevens verminderd met toeslagen die verband houden met ploegendiensten dan wel met onregelmatige diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
