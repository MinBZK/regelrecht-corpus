  - number: '24'
    text: |-
      1 De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven, houdt over de periode vermeld in de
      verklaring een overeenkomstig bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en
      Innovatie vast te stellen regels ingerichte administratie bij omtrent de aard, de inhoud, de omvang en de voortgang
      van het werk dat in de verklaring is aangemerkt als speur- en ontwikkelingswerk.

      2 De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven doet van het aantal uren dat zijn werknemers
      hebben besteed aan het speur- en ontwikkelingswerk in de periode waarop de verklaring betrekking heeft, mededeling
      aan Onze Minister van Economische Zaken, Landbouw en Innovatie indien:

      a. het aantal bestede uren minder is dan 90% van het in de S&O-verklaring opgenomen aantal, of

      b. het product van het aantal bestede uren en het gemiddelde uurloon waarvan de S&O-verklaring uitgaat tenminste
      een bedrag van € 10 000 maal het aantal kalendermaanden waarop de S&O-verklaring betrekking heeft, lager is dan het
      product bedoeld in [artikel 23, derde lid][ref1].

      3 De S&O-inhoudingsplichtige doet de mededeling, bedoeld in het tweede lid, gezamenlijk voor alle op een
      kalenderjaar betrekking hebbende S&O-verklaringen binnen drie kalendermaanden na afloop van het kalenderjaar waarop
      de in dat lid bedoelde S&O-verklaringen betrekking hebben of, indien dat later is, binnen drie kalendermaanden na
      de afgifte van de laatste S&O-verklaring die betrekking heeft op dat kalenderjaar.

      4 Bij het eindigen van de inhoudingsplicht vóór het tijdstip, bedoeld in het derde lid, wordt in afwijking van dat
      lid de mededeling gedaan binnen één kalendermaand nadat de inhoudingsplicht is geëindigd.

      5 Onze Minister van Economische Zaken, Landbouw en Innovatie kan bij ministeriële regeling nadere regels stellen
      ten aanzien van de inhoud van de mededeling en de indiening daarvan, waarbij in het algemeen of voor groepen van
      gevallen kan worden bepaald dat de mededeling uitsluitend op elektronische wijze kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
