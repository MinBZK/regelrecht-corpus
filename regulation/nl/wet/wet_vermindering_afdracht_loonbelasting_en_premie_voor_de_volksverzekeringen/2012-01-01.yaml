  - number: '14'
    text: |-
      1 De afdrachtvermindering onderwijs is van toepassing met betrekking tot:

      a. de werknemer die de beroepspraktijkvorming volgt van de beroepsbegeleidende leerweg van een in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref1] bedoelde
      beroepsopleiding, op de grondslag van een in [artikel 7.2.8 van die wet][ref2] bedoelde overeenkomst, gesloten
      door de in [artikel 7.2.9 van die wet][ref3] genoemde partijen en mede ondertekend door het bestuur van het
      desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven;

      b. de werknemer aangesteld als assistent in opleiding of als promovendus bij een universiteit, dan wel aangesteld
      als onderzoeker in opleiding bij de Nederlandse Organisatie voor Wetenschappelijk Onderzoek onderscheidenlijk
      de Koninklijke Nederlandse Akademie van Wetenschappen of als onderzoeker in opleiding in dienst van een onder
      deze organisaties ressorterende onderzoekinstelling, een en ander op de grondslag van een overeenkomst tussen
      de universiteit of een van de genoemde onderzoekorganisaties dan wel een onder deze organisaties ressorterende
      onderzoekinstelling enerzijds en een privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor
      toegepast-natuurwetenschappelijk onderzoek TNO anderzijds ter zake van de financiering van de loonkosten van de
      werknemer door de desbetreffende privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO;

      c. de werknemer van een privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO met een loon overeenkomstig dat van een assistent in opleiding of
      promovendus die een promotie-onderzoek verricht op de grondslag van een overeenkomst tussen die privaatrechtelijke
      rechtspersoon of de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO enerzijds en een
      universiteit anderzijds ter zake van de begeleiding van het promotie-onderzoek van de werknemer;

      d. de werknemer die in het kader van zijn initiële opleiding aan een hogeschool in de zin van
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] op de grondslag van een
      onderwijsarbeidsovereenkomst, gesloten tussen de hogeschool, de werkgever en hemzelf, op zijn opleiding
      aansluitende arbeid verricht in een bij ministeriële regeling aangewezen bedrijfssector en tevens niet is
      ingeschreven als student voor het volgen van in voltijdse vorm verzorgd onderwijs;

      e. de werknemer die een bij ministeriële regeling vast te stellen vorm van scholing volgt die gericht is op het op
      een startkwalificatieniveau brengen van personen die dat niveau missen;

      f. degene die bij de inhoudingsplichtige op basis van een leer-werkovereenkomst het buitenschoolse
      praktijkgedeelte volgt van een leer-werktraject, een en ander als bedoeld in [artikel 10b1][ref5] en
      [10b3 van de Wet op het voortgezet onderwijs][ref6];

      g. degene die bij de inhoudingsplichtige gedurende een periode van ten minste twee
      maanden de beroepspraktijkvorming volgt van de beroepsopleidende leerweg van een in
      [artikel 7.2.2, eerste lid, onderdelen a of b, van de Wet educatie en beroepsonderwijs][ref7] bedoelde
      beroepsopleiding, op de grondslag van een in [artikel 7.2.8 van die wet][ref8] bedoelde overeenkomst, gesloten door
      de in [artikel 7.2.9 van die wet][ref9] genoemde partijen;

      h. de werknemer die een EVC-procedure volgt waarvoor een verklaring is afgegeven door een bij ministeriële regeling
      aangewezen instantie, mits de inhoudingsplichtige de kosten van de EVC-procedure voor zijn rekening neemt.

      2 Het eerste lid, aanhef en onderdeel a, is in het geval waarin de inhoudingsplichtige niet tevens is het bedrijf
      dat of de organisatie die bevoegd als bedoeld in [artikel 7.2.10 van de Wet educatie en beroepsonderwijs][ref10]
      de beroepspraktijkvorming verzorgt, slechts van toepassing indien er tussen de inhoudingsplichtige en dat bedrijf
      of die organisatie een overeenkomst van opdracht is gesloten die voldoet aan bij ministeriële regeling te stellen
      voorwaarden.

      3 Het eerste lid, aanhef en onderdelen a en d, is niet van toepassing ingeval het loon van die werknemer die jonger
      is dan 25 jaar in het desbetreffende loontijdvak meer bedraagt dan diens toetsloon voor dat tijdvak. Het toetsloon
      voor de afdrachtvermindering onderwijs bedraagt € 24 170 per kalenderjaar.

      4 De afdrachtvermindering onderwijs op de voet van het eerste lid, onderdelen b en c, is met betrekking tot
      een werknemer gedurende ten hoogste 48 maanden van toepassing. De afdrachtvermindering onderwijs op de voet van
      het eerste lid, onderdeel d, is met betrekking tot een werknemer ten hoogste 24 maanden van toepassing. Indien
      [artikel 6, eerste lid, aanhef en onderdeel a][ref11], met betrekking tot een werknemer toepassing vindt, wordt de
      termijn van 48 maanden onderscheidenlijk 24 maanden met betrekking tot deze werknemer naar evenredigheid verlengd.

      5 Het eerste lid, aanhef en onderdeel e, is niet van toepassing indien:

      a. het loon van de werknemer in het desbetreffende loontijdvak meer bedraagt dan het in het derde lid, tweede
      volzin, genoemde toetsloon, of

      b. de werkgever niet over een verklaring beschikt waarin het UWV WERKbedrijf verklaart dat de werknemer vóór
      aanvang van de scholing, bedoeld in het eerste lid, onderdeel e:

      1°. een werkloze is, of

      2°. een voormalig werkloze is en uitsluitend als gevolg van deelname aan een re-integratietraject van een gemeente
      in het kader van de [Wet werk en bijstand][ref12] of van het Uitvoeringsinstituut werknemersverzekeringen in het
      kader van de [Werkloosheidswet][ref13], niet langer een werkloze is.

      6 De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdelen a, b, c, d, f en g, het tweede
      lid en [artikel 14a, tweede lid][ref14], bedoelde overeenkomsten bij de loonadministratie.

      7 Bij ministeriële regeling kan worden bepaald welke gegevens de in het eerste lid, onderdelen a, b, c, d, f en g,
      en [artikel 14a, tweede lid][ref15], bedoelde overeenkomsten ten minste dienen te bevatten voor de toepassing van
      deze wet alsmede welke partij of partijen de administratie voert onderscheidenlijk voeren die voortvloeit uit de
      overeenkomsten, bedoeld in het eerste lid, onderdeel d, en artikel 14a, tweede lid.

      8 De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdeel h, het vijfde lid, onderdeel b,
      en [artikel 14a, eerste lid][ref16], bedoelde verklaringen bij de loonadministratie.


