  - number: '18'
    text: |-
      1 Volgens bij ministeriële regeling te stellen regels maakt de inhoudingsplichtige per loontijdvak een berekening
      van het in [artikel 17, eerste lid][ref1], bedoelde loon alsmede het gedeelte van dat loon dat niet in aanmerking
      is genomen en van het bedrag van de afdrachtvermindering zeevaart.

      2 De inhoudingsplichtige bewaart en registreert met betrekking tot het schip of de schepen waarop een of meer
      zeevarenden werkzaam zijn met betrekking tot wie de afdrachtvermindering zeevaart wordt toegepast:

      a. afschriften van monsterrollen als bedoeld in [artikel 33 van de Zeevaartbemanningswet][ref2];

      b. afschriften van zeebrieven als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref3].

      3 De inhoudingsplichtige legt vast met betrekking tot welke zeevarenden hij in het kalenderjaar de
      afdrachtvermindering zeevaart heeft toegepast, alsmede het schip of de schepen waarop die zeevarenden werkzaam zijn
      geweest onder vermelding van de periode waarin dit plaatsvond.

      4 De inhoudingsplichtige legt met betrekking tot zeeschepen die zijn bestemd voor sleep-en
      hulpverleningswerkzaamheden op zee en die tevens, in en rond havens gelegen op het grondgebied van de Europese
      Gemeenschap en op binnenwateren van de Europese Gemeenschap, worden ingezet voor het assisteren bij het meren,
      ontmeren en verhalen van zeeschepen die inkomen van of uitgaan naar zee en gebruik maken van eigen voortstuwing, de
      bedrijfstijd vast die is gemoeid met de onderscheidene werkzaamheden. De wachttijd mag evenredig worden toegedeeld
      aan de bedrijfstijd van de onderscheidene werkzaamheden.

      5 De inhoudingsplichtige bewaart de in het tweede lid bedoelde gegevens, alsmede de in het tweede lid bedoelde
      afschriften en de in het derde en vierde lid bedoelde vastleggingen, bij de loonadministratie.

      6 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in dit artikel genoemde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001933#Artikel3
