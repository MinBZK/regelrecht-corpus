  - number: '6'
    text: |-
      1 De in [artikel 5, eerste lid, onderdelen a, b, c, d en f][ref1], opgenomen bedragen alsmede het toetsloon worden
      naar evenredigheid verminderd met betrekking tot:

      a. de werknemer met een overeengekomen arbeidsduur die korter is dan de volledige arbeidsduur;

      b. de werknemer zonder overeengekomen vaste arbeidsduur.

      2 Voor de toepassing van het eerste lid wordt de volledige arbeidsduur voor een kalenderweek gesteld op 36 uren.
      Bij ministeriële regeling kan voor bijzondere gevallen een afwijkende volledige arbeidsduur worden vastgesteld.

      3 Bij de toepassing van het eerste lid, onderdeel *b*, vindt de vermindering plaats aan de hand van het aantal uren
      waarover loon is verschuldigd. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      vorige volzin, alsmede voor het geval het loon niet per tijdseenheid wordt berekend.

      4 De inhoudingsplichtige kan een door hem aan te wijzen categorie werknemers als bedoeld in het eerste lid,
      onderdeel *a*, voor de duur van het kalenderjaar aanmerken als werknemers, bedoeld in het eerste lid, onderdeel
      *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
