  - number: '25'
    text: |-
      1 Onze Minister van Economische Zaken, Landbouw en Innovatie geeft aan de S&O-inhoudingsplichtige die de in
      [artikel 24, tweede lid][ref1], bedoelde mededeling deed, een correctie-S&O-verklaring af voor alle op het
      kalenderjaar betrekking hebbende S&O-verklaringen gezamenlijk, waarbij hij het bedrag van de correctie-S&O-
      verklaring, gespecificeerd per S&O-verklaring, vaststelt op basis van het volgens de mededeling niet gerealiseerde
      aantal uren.

      2 Onze Minister van Economische Zaken, Landbouw en Innovatie geeft aan de S&O-inhoudingsplichtige een correctie-
      S&O-verklaring af met het bedrag dat op de S&O-verklaring ten onrechte is vermeld als bedrag aan S&O-
      afdrachtvermindering, indien:

      a. aannemelijk is dat ter verkrijging van de S&O-verklaring gegevens of bescheiden zijn verstrekt die zodanig
      onjuist of onvolledig zijn dat op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste omstandigheden volledig bekend zouden zijn geweest;

      b. aannemelijk is geworden, dat de S&O-inhoudingsplichtige de verplichting bedoeld in
      [artikel 24, tweede lid][ref2], niet is nagekomen.

      3 Onze Minister van Economische Zaken, Landbouw en Innovatie kan, indien blijkt dat de in
      [artikel 24, eerste lid][ref3], bedoelde administratie niet voldoet aan het bij of krachtens dat artikel bepaalde
      aan de S&O-inhoudingsplichtige een correctie-S&O-verklaring afgeven tot een omvang waarvan onvoldoende aannemelijk
      is dat speur- en ontwikkelingswerk zoals opgenomen in de S&O-verklaring, is verricht.

      4 Een bedrag vastgesteld bij een correctie-S&O-verklaring komt zoveel mogelijk in mindering op het bij één
      of meer S&O-verklaringen waarop de correctie-S&O-verklaring betrekking heeft, vastgestelde bedrag aan S&O-
      afdrachtvermindering dat nog niet in mindering is gebracht op de af te dragen belasting en premie. Voorzover
      dat niet mogelijk is, is sprake van een negatieve S&O-afdrachtvermindering welke er toe leidt dat de over het
      aangiftetijdvak waarin de correctie-S&O-verklaring is gedagtekend of het daaropvolgende aangiftetijdvak af te
      dragen loonbelasting, dan wel af te dragen loonbelasting en premie voor de volksverzekeringen, wordt vermeerderd
      met dat bedrag aan negatieve S&O-afdrachtvermindering.


