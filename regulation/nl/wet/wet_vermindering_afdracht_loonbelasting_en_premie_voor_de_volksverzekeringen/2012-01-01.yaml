      1 Bij overtreding van het bij of krachtens [artikel 24, eerste lid][ref1], bepaalde of indien sprake is van het
      geval, bedoeld in [artikel 25, tweede lid, onderdeel a][ref2], kan Onze Minister van Economische Zaken, Landbouw
      en Innovatie aan de S&O-inhoudingsplichtige een bestuurlijke boete opleggen ter hoogte van maximaal € 100 000, of,
      wanneer dat meer is, 20% van het in de S&O-verklaring als afdrachtvermindering vastgestelde bedrag.

      2 Bij overtreding van het bij of krachtens [artikel 24, tweede of derde lid][ref3], bepaalde, legt Onze
      Minister van Economische Zaken, Landbouw en Innovatie aan de S&O-inhoudingsplichtige een bestuurlijke
      boete op ter hoogte van het bedrag van de correctie-S&O-verklaring die is vastgesteld op de voet van
      [artikel 25, tweede lid, onderdeel b][ref4]. Onze Minister van Economische Zaken, Landbouw en Innovatie kan de
      boete lager vaststellen op grond van geringe ernst van de overtreding.

      3 Onze Minister van Economische Zaken, Landbouw en Innovatie brengt opgelegde boeten tot uitdrukking door deze op
      te nemen in een correctie-S&O-verklaring. [Artikel 25, vierde lid][ref5], is van overeenkomstige toepassing.


