      Minister, wat betreft de regelingen bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.5.a
    text: |-
      [artikel 6][ref1] in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel6
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '6'
        hoofdstuk: II
  - number: 1.5.b
    text: |-
      [artikel 14][ref1] in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 1.5.c
    text: |-
      de [artikelen 17][ref1], [18][ref2] en [20][ref3] in overeenstemming met Onze Minister van Infrastructuur en Milieu
      en Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel20
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
