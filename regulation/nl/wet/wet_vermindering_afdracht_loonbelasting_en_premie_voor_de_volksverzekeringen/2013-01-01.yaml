        artikel: '2'
  - number: '30.2'
    text: |-
      Voor de toepassing van de [artikelen 63][ref1] en [67 van de Algemene wet inzake rijksbelastingen][ref2]
      betreffende de uitvoering van deze wet door Onze Minister van Economische Zaken, Landbouw en Innovatie,
      onderscheidenlijk Onze Minister van Onderwijs, Cultuur en Wetenschap, of de door hem aangewezen ambtenaren, treedt
      Onze Minister van Economische Zaken, Landbouw en Innovatie, onderscheidenlijk Onze Minister van Onderwijs, Cultuur
      en Wetenschap, in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '67'
  - number: '30.3'
    text: |-
      Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en het
      bestuursorgaan beroep in cassatie instellen ter zake van schending van de [artikelen 1][ref1] en [2][ref2] met
      betrekking tot het bepaalde omtrent de begrippen 'inhoudingsplichtige', 'aangiftetijdvak', 'loon', 'onderneming',
      'fiscale eenheid' en 'werknemer'.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '2'
        hoofdstuk: I
  - number: '30.4'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij het College van Beroep voor het bedrijfsleven de
      plaats inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel30
  - number: 30a
    text: |-
      Bij het begin van het kalenderjaar worden de in [artikel 5, eerste lid][ref1], genoemde bedragen vervangen door
      andere. Deze bedragen worden berekend door de te vervangen bedragen te vermenigvuldigen met de verhouding van het
      bedrag genoemd in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2]
      zoals dat luidt bij het begin van het kalenderjaar tot dat bedrag zoals dat luidt op 1 januari van het voorafgaande
      kalenderjaar, en vervolgens de nodig geachte afrondingen aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '31.1'
    text: |-
      Bij het begin van het kalenderjaar wordt het in [artikel 14, derde lid][ref1], vermelde toetsloon vervangen door
      een ander toetsloon.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: '31.2'
    text: |-
      Het in [artikel 14, derde lid][ref1], vermelde toetsloon wordt gesteld op 130 percent van het twaalfvoud van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2] bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '32'
    text: |-
      Ter bevordering van een goede uitvoering van deze wet kunnen bij ministeriële regeling nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel32
  - number: '34'
    text: |-
      Artikel 26a, vierde lid, zoals dit luidde op 31 december 2004 blijft van toepassing met betrekking tot arbo-
      bedrijfsmiddelen ter zake waarvan de inhoudingsplichtige arbo-afdrachtvermindering heeft genoten.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel34
  - number: 41a
    text: |-
      De op 1 januari 2006 vervallen regeling inzake de afdrachtvermindering betaald ouderschapsverlof blijft doorlopen
      tot uiterlijk 31 december 2006 met betrekking tot een werknemer die in het kalenderjaar 2006 ouderschapsverlof
      geniet waarbij loon wordt doorbetaald krachtens een op de laatste dag van het kalenderjaar 2005 bestaande:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel41a
  - number: 41a.a
    text: collectieve arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel41a
  - number: 41a.b
    text: regeling door of namens een daartoe bevoegd bestuursorgaan of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel41a
  - number: 41a.c
    text: |-
      regeling van de inhoudingsplichtige welke geldt voor ten minste driekwart van de werknemers van de
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel41a
  - number: '42'
    text: De Wet belasting- en premiefaciliteit voor de zeevaart 1995 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel42
  - number: '43.1'
    text: |-
      Met betrekking tot gevallen waarin een verrekeningsbijdrage zeevaart als bedoeld in artikel III van de Wet
      faciliteit voor de zeevaart zoals deze luidde op 31 december 1994, is ingehouden, blijven de bepalingen welke
      ingevolge de Wet belasting- en premiefaciliteit voor de zeevaart 1995 zijn vervallen, ingetrokken of gewijzigd, van
      kracht zoals deze luidden op 31 december 1994.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel43
  - number: '43.2'
    text: |-
      Met betrekking tot gevallen waarin artikel 2 van de Wet belasting- en premiefaciliteit voor de zeevaart 1995
      toepassing heeft gevonden, blijven de bepalingen van die wet van kracht naar de tekst zoals die luidde op 31
      december 1995.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel43
  - number: '46'
    text: De Wet bevordering speur- en ontwikkelingswerk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      Met betrekking tot de toepassing van deze wet terzake van speur- en ontwikkelingswerk dat is verricht voor
      1 januari 2006, blijven de bepalingen bij of krachtens de [hoofdstukken VIII][ref1] en [IX][ref2] zoals deze
      luidden voor de wijzigingen ingevolge het [Belastingplan 2006][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIX
      [ref3]: https://wetten.overheid.nl/BWBR0019286
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0019286
  - number: '47.2'
    text: |-
      Aanvragen voor een S&O-verklaring met betrekking tot kalendermaanden in 2006 die zijn of worden ingediend op de
      voet van [artikel 24, derde lid][ref1], zoals dat luidde voor de wijzigingen ingevolge het Belastingplan 2006,
      worden behandeld als aanvragen die zijn ingediend met inachtneming van [artikel 22, eerste lid][ref2], of, indien
      de aanvrager een S&O-belastingplichtige is, [artikel 27, tweede lid][ref3], zoals deze luiden na de wijzigingen
      ingevolge het [Belastingplan 2006][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0019286
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0019286
  - number: '47.3'
    text: |-
      Met betrekking tot aanvragen als bedoeld in het tweede lid, is voor de wijze van indiening en de inhoud van
      de aanvragen van toepassing hetgeen is bepaald bij of krachtens [artikel 24][ref1] zoals dat luidde voor de
      wijzigingen ingevolge het [Belastingplan 2006][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019286
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0019286
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel55
  - number: '55.2'
    text: 'Deze wet wordt aangehaald als: Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel55
