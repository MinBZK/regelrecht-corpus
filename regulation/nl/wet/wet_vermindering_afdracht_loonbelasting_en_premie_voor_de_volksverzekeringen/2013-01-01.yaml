        artikel: 15a
  - number: 1.1.l
    text: 'S&O-inhoudingsplichtige:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.l.1°
    text: een inhoudingsplichtige die tevens een onderneming drijft;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.l.2°
    text: |-
      een inhoudingsplichtige die niet tevens een onderneming drijft, voor zover hij speur- en ontwikkelingswerk
      verricht krachtens een schriftelijk vastgelegde overeenkomst met en voor rekening van een onderneming,
      een samenwerkingsverband van degenen die een onderneming drijven of een lichaam als bedoeld in de
      [Wet op de bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 1.1.m
    text: |-
      S&O-belastingplichtige: een natuurlijke persoon die voldoet aan het urencriterium, bedoeld in
      [artikel 3.6 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1.1.n
    text: |-
      speur- en ontwikkelingswerk: door een S&O-inhoudingsplichtige, dan wel een S&O-belastingplichtige, systematisch
      georganiseerde en in een lidstaat van de Europese Unie verrichte werkzaamheden, direct en uitsluitend gericht op:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.n.1°
    text: technisch-wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.n.2°
    text: |-
      de ontwikkeling van voor de S&O-inhoudingsplichtige of de S&O-belastingplichtige technisch nieuwe (onderdelen van)
      fysieke producten, (onderdelen van) fysieke productieprocessen, of (onderdelen van) programmatuur;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.n.3°
    text: |-
      het uitvoeren van een systematisch opgezette analyse van de technische haalbaarheid van het zelf verrichten van het
      speur- en ontwikkelingswerk, bedoeld onder 1°of 2°, of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.n.4°
    text: |-
      het uitvoeren van een technisch onderzoek naar een substantiële wijziging van een productiemethode, indien de
      wijziging kan leiden tot een significante verbetering van het fysieke productieproces dat reeds wordt toegepast in
      de onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige, dan wel naar modellering van processen,
      indien deze kan leiden tot een significante verbetering van programmatuur die reeds wordt toegepast in de
      onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.o
    text: |-
      programmatuur: het niet-fysieke, logische deelsysteem van een informatiesysteem dat de structuur van de gegevens en
      van de verwerkingsprocessen bepaalt;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.p
    text: |-
      S&O-referentiejaar: het tweede kalenderjaar voorafgaande aan het kalenderjaar waarop de S&O-afdrachtvermindering
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.q
    text: |-
      S&O-verklaring: de door Onze Minister van Economische Zaken, Landbouw en Innovatie op de voet van
      [artikel 23][ref1] aan een S&O-inhoudingsplichtige of [artikel 27][ref2] aan een S&O-belastingplichtige afgegeven
      verklaring betreffende speur- en ontwikkelingswerk;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
        hoofdstuk: VIII
  - number: 1.1.r
    text: 'EVC-procedure: procedure erkenning verworven competenties.'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van het eerste lid, onderdeel c, wordt:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.2.a
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      de [Wet arbeidsongeschiktheidsverzekeringen zelfstandigen][ref3], en de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4], niet aangemerkt als loon uit vroegere dienstbetrekking;


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: 1.2.b
    text: |-
      voorzover ingevolge [artikel 12a van de Wet op de loonbelasting 1964][ref1] het loon hoger is dan het werkelijk
      genoten loon, in afwijking van [artikel 13a, derde lid, van die wet][ref2] het meerdere geacht te zijn genoten
      gedurende het gehele kalenderjaar, waarbij aan elke maand een twaalfde deel van het meerdere wordt toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 13a
  - number: '1.3'
    text: 'Voor toepassing van het eerste lid, onderdeel h, onder 2°, dient:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.3.a
    text: |-
      door of namens de Nederlandse Inspectie Verkeer en Waterstaat voor het schip een veiligheidscertificaat met
      onbeperkt vaargebied te zijn afgegeven, welk certificaat vermeldt dat het schip voldoet aan:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.3.a.1°
    text: |-
      de krachtens [artikel 5, tweede lid, van de Schepenwet][ref1] uitgevaardigde voorschriften voor Commercial
      Cruising Vessels;


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '5'
  - number: 1.3.a.2°
    text: de voorschriften van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.3.a.3°
    text: de voorschriften van de Special Purpose Ship (SPS) Code, of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.3.a.4°
    text: de voorschriften van de Special Purpose Ship Code 2008;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.3.b
    text: |-
      het schip een lengte te hebben van ten minste 24 meter, bepaald op basis van de International Convention on Load
      Lines.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: '1.4'
    text: 'Voor de toepassing van het eerste lid, onderdeel n, wordt niet tot speur- en ontwikkelingswerk gerekend:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.4.a
    text: marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.4.b
    text: organisatorische en administratieve werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.4.c
    text: |-
      door Onze Minister van Economische Zaken, Landbouw en Innovatie bij ministeriële regeling aangewezen andere
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
