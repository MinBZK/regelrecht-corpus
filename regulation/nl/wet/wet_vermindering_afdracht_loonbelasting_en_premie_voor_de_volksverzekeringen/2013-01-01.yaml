preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de werkgelegenheid maatregelen te
    treffen ter vermindering van bepaalde loonkosten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.a
    text: 'inhoudingsplichtige: hetgeen daaronder wordt verstaan voor de heffing van de loonbelasting;'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.b
    text: 'loontijdvak: hetgeen daaronder wordt verstaan voor de heffing van de loonbelasting;'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.c
    text: |-
      loon: 'loon in de zin van de [Wet op de loonbelasting 1964][ref1], verminderd met daarin begrepen:'


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.1.c.1°
    text: tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden toegekend;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.c.2°
    text: overwerkloon;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.c.3°
    text: loon uit vroegere dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.c.4°
    text: |-
      loon in de vorm van krachtens een publiekrechtelijke regeling of collectieve arbeidsovereenkomst regelmatig bij de
      betaling van het loon verstrekte vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.c.5°
    text: |-
      loon ter zake waarvan de belasting ingevolge [artikel 31 van die wet][ref1] wordt geheven van de
      inhoudingsplichtige;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 1.1.d
    text: |-
      toetsloon: het in het desbetreffende hoofdstuk van deze wet opgenomen bedrag aan loon waarboven of waaronder de
      inhoudingsplichtige niet in aanmerking komt voor de in dat hoofdstuk voorziene afdrachtvermindering;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.e
    text: |-
      aangiftetijdvak: het tijdvak waarover krachtens
      [artikel 19, tweede lid, onderdeel a, van de Algemene wet inzake rijksbelastingen][ref1] de loonbelasting moet
      worden betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 1.1.f
    text: |-
      assistent in opleiding: degene die tijdelijk is aangesteld bij een universiteit teneinde zich door het verrichten
      van wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te bekwamen tot wetenschappelijk
      onderzoeker of technologisch ontwerper;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.g
    text: |-
      onderzoeker in opleiding: degene die na een met goed gevolg afgelegd doctoraal examen bij een universiteit dan wel
      een afsluitend examen bij een instelling voor hoger beroepsonderwijs, in tijdelijke dienst is aangesteld teneinde
      zich door het verrichten van wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te bekwamen
      tot wetenschappelijk onderzoeker of technologisch ontwerper;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.ga
    text: |-
      promovendus: degene die tijdelijk is aangesteld bij een universiteit teneinde zich door het verrichten van
      wetenschappelijk onderzoek alsmede door het volgen van onderwijs verder te bekwamen tot wetenschappelijk
      onderzoeker of technologisch ontwerper;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h
    text: |-
      zeeschip: een schip ten aanzien waarvan de [Zeevaartbemanningswet][ref1] van toepassing is, dat is voorzien
      van een zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref2] en dat in het kader van een
      onderneming grotendeels op zee wordt geëxploiteerd voor het vervoer van zaken of personen in het internationale
      verkeer over zee, het vervoer van zaken of personen over zee ten behoeve van de exploratie of exploitatie van
      natuurlijke rijkdommen op zee, het verrichten van sleep- en hulpverleningswerkzaamheden op zee aan schepen als
      bedoeld in [artikel 1, tweede lid, van de Schepenwet][ref3], het verrichten van baggerwerkzaamheden of overige bij
      ministeriële regeling nader te bepalen activiteiten op zee, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.1.h.1°
    text: een schip dat wordt gebruikt voor de loodsdienst;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h.2°
    text: |-
      een schip dat wordt gebruikt voor de zeilvaart, niet zijnde een schip dat voldoet aan de in het derde lid genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h.2bis°
    text: een schip dat wordt gebruikt voor de sportvisserij;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h.3°
    text: een schip in havensleepdienst als bedoeld in onderdeel ha;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h.4°
    text: |-
      een schip dat wordt gebruikt voor baggerwerkzaamheden dat niet over eigen voortstuwing beschikt of dat niet is
      ingericht voor het vervoer van lading over zee, en
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.h.5°
    text: |-
      een schip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of van andere levende rijkdommen
      van de zee;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.ha
    text: |-
      havensleepdienst: het geheel van werkzaamheden en activiteiten door een sleepboot als bedoeld in onderdeel hb
      grotendeels in en rond havens en op binnenwateren van de Europese Gemeenschap verricht, ten behoeve van het
      assisteren bij het meren, ontmeren en verhalen van zeeschepen die gebruik maken van eigen voortstuwing en die
      inkomen van of uitgaan naar zee;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.hb
    text: |-
      sleepboot: een schip ten aanzien waarvan de [Zeevaartbemanningswet][ref1] van toepassing is, dat is voorzien van
      een zeebrief als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref2] en is bestemd voor het verrichten
      van sleep- en hulpverleningswerkzaamheden op zee;


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '3'
  - number: 1.1.i
    text: |-
      zeevarende: degene die als kapitein, scheepsofficier of scheepsgezel werkzaam is op een zeeschip dat in
      Nederland is geregistreerd en de Nederlandse vlag voert, tenzij hij werkzaam is op een schip dat een geregelde
      passagiersdienst onderhoudt tussen havens van de Europese Gemeenschap en hij niet de nationaliteit heeft van een
      van de Lidstaten van de Europese Gemeenschap of de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.ia
    text: |-
      zee: alle wateren die zich bevinden voorbij de laagwaterlijn van de kust. Indien een transport over zee plaatsvindt
      met inbegrip van transport door een waterweg van maritieme aard in de zin van [verordening (EG) nr. 13/2004]
      (32004R0013) van de Commissie van de Europese Gemeenschap van 8 december 2003 (Pb EU, nr. L3), wordt het transport
      voor het gehele traject geacht transport over zee te zijn;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.ib
    text: 'binnenwateren: wateren anders dan bedoeld in onderdeel ia;'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
  - number: 1.1.j
    text: |-
      onderneming: een onderneming in de zin van de [Wet inkomstenbelasting 2001][ref1] of de
      [Wet op de vennootschapsbelasting 1969][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: 1.1.k
    text: |-
      fiscale eenheid: een eenheid in de zin van de [artikelen 15][ref1] en
      [15a van de Wet op de vennootschapsbelasting 1969][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel1
    references:
