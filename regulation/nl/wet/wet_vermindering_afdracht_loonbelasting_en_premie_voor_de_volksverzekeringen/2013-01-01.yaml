        artikel: '20'
        hoofdstuk: VII
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      [Artikel 2, derde, vierde en vijfde lid][ref1], en [artikel 5 van de Wet op de loonbelasting 1964][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '5'
  - number: '2.3'
    text: |-
      Als dienstbetrekking worden mede beschouwd de arbeidsverhoudingen,
      bedoeld in de [artikelen 3, eerste lid, onderdelen c, d, f en h][ref1], en
      [4, onderdelen a, b en e, van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '4'
  - number: '2.4'
    text: |-
      Als werknemer worden mede beschouwd de in [artikel 14, eerste lid, onderdelen f en g][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: '3.1'
    text: |-
      De inhoudingsplichtige kan de over een tijdvak af te dragen loonbelasting, dan wel af te dragen loonbelasting en
      premie voor de volksverzekeringen verminderen, doch niet verder dan tot nihil, met:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: 3.1.c
    text: de afdrachtvermindering onderwijs;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: 3.1.g
    text: de afdrachtvermindering zeevaart;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: 3.1.h
    text: de S&O-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      De S&O-afdrachtvermindering komt in mindering op de af te dragen loonbelasting. Uitsluitend voor de toepassing van
      de vorige volzin door de inhoudingsplichtige wordt af te dragen premie voor de volksverzekeringen gelijkgesteld met
      af te dragen loonbelasting.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      De afdrachtvermindering onderwijs en de afdrachtvermindering zeevaart komen in mindering op de af te dragen
      loonbelasting en premie voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Voor zover loon in aanmerking is genomen voor de toepassing van de S&O-afdrachtvermindering vindt de
      afdrachtvermindering zeevaart geen toepassing.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel4
  - number: '5.1'
    text: 'De afdrachtvermindering onderwijs bedraagt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de in [artikel 14, eerste lid, onderdeel a][ref1], bedoelde werknemer: € 2700 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.b
    text: |-
      de in [artikel 14, eerste lid, onderdelen b en c][ref1], bedoelde werknemers: € 2728 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.c
    text: |-
      de in [artikel 14, eerste lid, onderdeel d][ref1], bedoelde werknemer: € 2700 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.d
    text: |-
      de in [artikel 14, eerste lid, onderdeel e][ref1], bedoelde werknemer: € 3274 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.e
    text: |-
      de in [artikel 14, eerste lid, onderdeel f][ref1], bedoelde werknemer: € 2728 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.f
    text: |-
      de in [artikel 14, eerste lid, onderdeel g][ref1], bedoelde werknemer: € 1297 per kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 5.1.g
    text: |-
      de in [artikel 14, eerste lid, onderdeel h][ref1], bedoelde werknemer: € 327 per EVC-procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: '5.2'
    text: |-
      De afdrachtvermindering zeevaart beloopt een bedrag te bepalen op de voet van [hoofdstuk VII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VII
  - number: '5.3'
    text: |-
      De S&O-afdrachtvermindering beloopt een bedrag te bepalen op de voet van [hoofdstuk VIII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: VIII
  - number: '5.4'
    text: |-
      De in het eerste lid, onderdelen a, b, c, d, e en f, opgenomen bedragen, alsmede het toetsloon, worden naar
      tijdsgelang verdeeld over de loontijdvakken van het kalenderjaar. Bij ministeriële regeling kunnen regels worden
      gesteld met betrekking tot de werknemer wiens dienstbetrekking niet gedurende het gehele kalenderjaar heeft
      bestaan.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
  - number: '5.5'
    text: |-
      Met betrekking tot de in [artikel 14a, eerste lid][ref1], bedoelde werknemer wordt de afdrachtvermindering voor
      het loontijdvak waarin de aanvraag, bedoeld in artikel 14a, derde lid, in behandeling wordt genomen tot en met
      het laatste loontijdvak dat eindigt voor de datum waarop de verklaring, bedoeld in artikel 14a, eerste lid, wordt
      afgegeven, per loontijdvak gesteld op een evenredig deel van de in het eerste lid, onderdeel a, onderdeel c,
      onderscheidenlijk onderdeel f, opgenomen bedragen. Het op grond van de eerste volzin vastgestelde bedrag wordt in
      aanmerking genomen in het loontijdvak waarin de verklaring, bedoeld in artikel 14a, eerste lid, wordt afgegeven of
      in het daaropvolgende loontijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: 14a
        hoofdstuk: V
  - number: '5.6'
    text: |-
      Het in het eerste lid, onderdeel g, opgenomen bedrag wordt in aanmerking genomen in het loontijdvak waarin de
      werknemer, bedoeld in [artikel 14, eerste lid, onderdeel h][ref1], aanvangt met het volgen van de EVC-procedure of
      in het daaropvolgende loontijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: '6.1'
    text: |-
      De in [artikel 5, eerste lid, onderdelen a, b, c, d en f][ref1], opgenomen bedragen alsmede het toetsloon worden
      naar evenredigheid verminderd met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel5
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '5'
        hoofdstuk: II
  - number: 6.1.a
    text: de werknemer met een overeengekomen arbeidsduur die korter is dan de volledige arbeidsduur;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
  - number: 6.1.b
    text: de werknemer zonder overeengekomen vaste arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de volledige arbeidsduur voor een kalenderweek gesteld op 36 uren. Bij
      ministeriële regeling kan voor bijzondere gevallen een afwijkende volledige arbeidsduur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel *b*, vindt de vermindering plaats aan de hand van het aantal uren
      waarover loon is verschuldigd. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      vorige volzin, alsmede voor het geval het loon niet per tijdseenheid wordt berekend.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      De inhoudingsplichtige kan een door hem aan te wijzen categorie werknemers als bedoeld in het eerste lid, onderdeel
      *a*, voor de duur van het kalenderjaar aanmerken als werknemers, bedoeld in het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel6
  - number: 13a
    text: |-
      In aanvulling op [artikel 1, eerste lid, onderdeel c][ref1], wordt voor de toepassing van dit hoofdstuk het loon
      tevens verminderd met toeslagen die verband houden met ploegendiensten dan wel met onregelmatige diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
  - number: '14.1'
    text: 'De afdrachtvermindering onderwijs is van toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.1.a
    text: |-
      de werknemer die de beroepspraktijkvorming volgt van de beroepsbegeleidende leerweg van een in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref1] bedoelde
      beroepsopleiding, op de grondslag van een in [artikel 7.2.8 van die wet][ref2] bedoelde overeenkomst, gesloten
      door de in [artikel 7.2.9 van die wet][ref3] genoemde partijen en mede ondertekend door het bestuur van het
      desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 14.1.b
    text: |-
      de werknemer aangesteld als assistent in opleiding of als promovendus bij een universiteit, dan wel aangesteld
      als onderzoeker in opleiding bij de Nederlandse Organisatie voor Wetenschappelijk Onderzoek onderscheidenlijk
      de Koninklijke Nederlandse Akademie van Wetenschappen of als onderzoeker in opleiding in dienst van een onder
      deze organisaties ressorterende onderzoekinstelling, een en ander op de grondslag van een overeenkomst tussen
      de universiteit of een van de genoemde onderzoekorganisaties dan wel een onder deze organisaties ressorterende
      onderzoekinstelling enerzijds en een privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor
      toegepast-natuurwetenschappelijk onderzoek TNO anderzijds ter zake van de financiering van de loonkosten van de
      werknemer door de desbetreffende privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.1.c
    text: |-
      de werknemer van een privaatrechtelijke rechtspersoon of de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO met een loon overeenkomstig dat van een assistent in opleiding of
      promovendus die een promotie-onderzoek verricht op de grondslag van een overeenkomst tussen die privaatrechtelijke
      rechtspersoon of de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO enerzijds en een
      universiteit anderzijds ter zake van de begeleiding van het promotie-onderzoek van de werknemer;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.1.d
    text: |-
      de werknemer die in het kader van zijn initiële opleiding aan een hogeschool in de zin van
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] op de grondslag van een
      onderwijsarbeidsovereenkomst, gesloten tussen de hogeschool, de werkgever en hemzelf, op zijn opleiding
      aansluitende arbeid verricht in een bij ministeriële regeling aangewezen bedrijfssector en tevens niet is
      ingeschreven als student voor het volgen van in voltijdse vorm verzorgd onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 14.1.e
    text: |-
      de werknemer die een bij ministeriële regeling vast te stellen vorm van scholing volgt die gericht is op het op een
      startkwalificatieniveau brengen van personen die dat niveau missen;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.1.f
    text: |-
      degene die bij de inhoudingsplichtige op basis van een leer-werkovereenkomst het buitenschoolse
      praktijkgedeelte volgt van een leer-werktraject, een en ander als bedoeld in [artikel 10b1][ref1] en
      [10b3 van de Wet op het voortgezet onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b3
  - number: 14.1.g
    text: |-
      degene die bij de inhoudingsplichtige gedurende een periode van ten minste twee
      maanden de beroepspraktijkvorming volgt van de beroepsopleidende leerweg van een in
      [artikel 7.2.2, eerste lid, onderdelen a of b, van de Wet educatie en beroepsonderwijs][ref1] bedoelde
      beroepsopleiding, op de grondslag van een in [artikel 7.2.8 van die wet][ref2] bedoelde overeenkomst, gesloten door
      de in [artikel 7.2.9 van die wet][ref3] genoemde partijen;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 14.1.h
    text: |-
      de werknemer die een EVC-procedure volgt waarvoor een verklaring is afgegeven door een bij ministeriële regeling
      aangewezen instantie, mits de inhoudingsplichtige de kosten van de EVC-procedure voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid, aanhef en onderdeel a, is in het geval waarin de inhoudingsplichtige niet tevens is het bedrijf
      dat of de organisatie die bevoegd als bedoeld in [artikel 7.2.10 van de Wet educatie en beroepsonderwijs][ref1]
      de beroepspraktijkvorming verzorgt, slechts van toepassing indien er tussen de inhoudingsplichtige en dat bedrijf
      of die organisatie een overeenkomst van opdracht is gesloten die voldoet aan bij ministeriële regeling te stellen
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '14.3'
    text: |-
      Het eerste lid, aanhef en onderdelen a en d, is niet van toepassing ingeval het loon van die werknemer die jonger
      is dan 25 jaar in het desbetreffende loontijdvak meer bedraagt dan diens toetsloon voor dat tijdvak. Het toetsloon
      voor de afdrachtvermindering onderwijs bedraagt € 22 923 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      De afdrachtvermindering onderwijs op de voet van het eerste lid, onderdelen b en c, is met betrekking tot een
      werknemer gedurende ten hoogste 48 maanden van toepassing. De afdrachtvermindering onderwijs op de voet van
      het eerste lid, onderdeel d, is met betrekking tot een werknemer ten hoogste 24 maanden van toepassing. Indien
      [artikel 6, eerste lid, aanhef en onderdeel a][ref1], met betrekking tot een werknemer toepassing vindt, wordt de
      termijn van 48 maanden onderscheidenlijk 24 maanden met betrekking tot deze werknemer naar evenredigheid verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel6
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '6'
        hoofdstuk: II
  - number: '14.5'
    text: 'Het eerste lid, aanhef en onderdeel e, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.5.a
    text: |-
      het loon van de werknemer in het desbetreffende loontijdvak meer bedraagt dan het in het derde lid, tweede volzin,
      genoemde toetsloon, of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.5.b
    text: |-
      de werkgever niet over een verklaring beschikt waarin het UWV WERKbedrijf verklaart dat de werknemer vóór aanvang
      van de scholing, bedoeld in het eerste lid, onderdeel e:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.5.b.1°
    text: een werkloze is, of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
  - number: 14.5.b.2°
    text: |-
      een voormalig werkloze is en uitsluitend als gevolg van deelname aan een re-integratietraject van een gemeente in
      het kader van de [Wet werk en bijstand][ref1] of van het Uitvoeringsinstituut werknemersverzekeringen in het kader
      van de [Werkloosheidswet][ref2], niet langer een werkloze is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004045
  - number: '14.6'
    text: |-
      De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdelen a, b, c, d, f en g, het tweede
      lid en [artikel 14a, tweede lid][ref1], bedoelde overeenkomsten bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: 14a
        hoofdstuk: V
  - number: '14.7'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens de in het eerste lid, onderdelen a, b, c, d, f en g,
      en [artikel 14a, tweede lid][ref1], bedoelde overeenkomsten ten minste dienen te bevatten voor de toepassing van
      deze wet alsmede welke partij of partijen de administratie voert onderscheidenlijk voeren die voortvloeit uit de
      overeenkomsten, bedoeld in het eerste lid, onderdeel d, en artikel 14a, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: 14a
        hoofdstuk: V
  - number: '14.8'
    text: |-
      De inhoudingsplichtige bewaart een afschrift van de in het eerste lid, onderdeel h, het vijfde lid, onderdeel b, en
      [artikel 14a, eerste lid][ref1], bedoelde verklaringen bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: 14a
        hoofdstuk: V
  - number: 14a.1
    text: |-
      [Artikel 14, eerste lid, onderdelen a, d of g][ref1], is van overeenkomstige toepassing met betrekking tot de
      werknemer die een met de opleiding, bedoeld in artikel 14, eerste lid, onderdeel a, onderdeel d, onderscheidenlijk
      onderdeel g, vergelijkbare opleiding volgt in een andere lidstaat van de Europese Unie of een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, indien de inhoudingsplichtige beschikt
      over een verklaring van Onze Minister van Onderwijs, Cultuur en Wetenschap dat die opleiding wat betreft niveau
      en kwaliteit vergelijkbaar is met de opleiding, bedoeld in artikel 14, eerste lid, onderdeel a, onderdeel d,
      onderscheidenlijk onderdeel g.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 14a.2
    text: |-
      In afwijking in zoverre van [artikel 14, eerste lid, onderdelen a en g][ref1], dient de inhoudingsplichtige voor
      de overeenkomstige toepassing van artikel 14, eerste lid, onderdeel a, onderscheidenlijk onderdeel g, te beschikken
      over een tussen hem, het opleidingsinstituut en de in artikel 14, eerste lid, onderdeel a, onderscheidenlijk
      onderdeel g, bedoelde werknemer gesloten onderwijsarbeidsovereenkomst, onderscheidenlijk stageovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '14'
        hoofdstuk: V
  - number: 14a.3
    text: |-
      Bij regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap worden in ieder geval regels gesteld met
      betrekking tot de gegevens en bescheiden die bij een aanvraag voor een verklaring als bedoeld in het eerste lid
      moeten worden overgelegd en met betrekking tot de bekendmaking van het tijdstip met ingang waarvan die aanvraag
      voldoet aan de daaraan gestelde wettelijke eisen.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14a
  - number: 14a.4
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap beslist binnen acht weken op een aanvraag als bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14a
  - number: 14a.5
    text: |-
      In afwijking in zoverre van het eerste lid is de afdrachtvermindering onderwijs voor de werknemer, bedoeld in het
      eerste lid, waarvoor de inhoudingsplichtige beschikt over een verklaring als bedoeld in het eerste lid, reeds van
      toepassing vanaf de datum waarop de ingediende aanvraag, bedoeld in het derde lid, voldoet aan de daaraan gestelde
      wettelijke eisen.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel14a
  - number: '15'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Onderwijs, Cultuur en Wetenschappen, na overleg met Onze Minister
      van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen ter bevordering van een goede
      uitvoering van dit hoofdstuk, alsmede met betrekking tot het verschaffen van inlichtingen aan door Onze Minister
      van Onderwijs, Cultuur en Wetenschappen ten behoeve van het verkrijgen van inzicht in de werking van dit hoofdstuk
      aan te wijzen instanties.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel15
  - number: '17.1'
    text: |-
      De afdrachtvermindering zeevaart is van toepassing met betrekking tot zeevarenden. De afdrachtvermindering beloopt
      een bedrag ter grootte van het in het tweede lid genoemde percentage van het loon van de zeevarenden in het
      loontijdvak. Bij zeevarenden op schepen bestemd voor baggerwerkzaamheden, onderscheidenlijk schepen bestemd voor
      sleep- en hulpverleningswerkzaamheden wordt als loon niet in aanmerking genomen het gedeelte van het loon dat
      toerekenbaar is aan andere werkzaamheden dan vervoer van opgebaggerd materiaal over zee, onderscheidenlijk andere
      werkzaamheden dan sleep- en hulpverleningswerkzaamheden op zee.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: '17.2'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: 17.2.a
    text: |-
      met betrekking tot de in Nederland, een Lidstaat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte wonende zeevarende: 40 percent;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: 17.2.b
    text: |-
      met betrekking tot de niet in Nederland, een Lidstaat van de Europese Unie of een andere staat die partij is bij de
      Europese Economische Ruimte wonende zeevarende die aan de loonbelasting is onderworpen of premieplichtig is voor de
      volksverzekeringen: 10 percent.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      Op het in het eerste lid bedoelde loon is niet van toepassing
      [artikel 1, eerste lid, onderdeel c, onder 1°, 2° en 4°][ref1], alsmede
      [artikel 1, eerste lid, onderdeel c, onder 5°][ref2], voorzover sprake is van loon dat in geblokkeerde vorm wordt
      gespaard ingevolge een spaarloonregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
  - number: '17.4'
    text: |-
      De in het tweede lid vermelde percentages kunnen bij ministeriële regeling met ingang van een kalenderkwartaal
      worden vervangen door andere.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: '17.5'
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop de krachtens het vierde lid vastgestelde ministeriële regeling
      in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal besluit
      tot het niet aannemen van het voorstel, worden bij ministeriële regeling de krachtens het vierde lid vervangen
      percentages met ingang van het eerstvolgende kalenderkwartaal vervangen door de percentages zoals die golden
      onmiddellijk vóór het in de eerste volzin bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      Volgens bij ministeriële regeling te stellen regels maakt de inhoudingsplichtige per loontijdvak een berekening van
      het in [artikel 17, eerste lid][ref1], bedoelde loon alsmede het gedeelte van dat loon dat niet in aanmerking is
      genomen en van het bedrag van de afdrachtvermindering zeevaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '17'
        hoofdstuk: VII
  - number: '18.2'
    text: |-
      De inhoudingsplichtige bewaart en registreert met betrekking tot het schip of de schepen waarop een of meer
      zeevarenden werkzaam zijn met betrekking tot wie de afdrachtvermindering zeevaart wordt toegepast:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
  - number: 18.2.a
    text: |-
      afschriften van monsterrollen als bedoeld in [artikel 33 van de Zeevaartbemanningswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
  - number: 18.2.b
    text: |-
      afschriften van zeebrieven als bedoeld in [artikel 3, eerste lid, van de Zeebrievenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '3'
  - number: '18.3'
    text: |-
      De inhoudingsplichtige legt vast met betrekking tot welke zeevarenden hij in het kalenderjaar de
      afdrachtvermindering zeevaart heeft toegepast, alsmede het schip of de schepen waarop die zeevarenden werkzaam zijn
      geweest onder vermelding van de periode waarin dit plaatsvond.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
  - number: '18.4'
    text: |-
      De inhoudingsplichtige legt met betrekking tot zeeschepen die zijn bestemd voor sleep-en
      hulpverleningswerkzaamheden op zee en die tevens, in en rond havens gelegen op het grondgebied van de Europese
      Gemeenschap en op binnenwateren van de Europese Gemeenschap, worden ingezet voor het assisteren bij het meren,
      ontmeren en verhalen van zeeschepen die inkomen van of uitgaan naar zee en gebruik maken van eigen voortstuwing, de
      bedrijfstijd vast die is gemoeid met de onderscheidene werkzaamheden. De wachttijd mag evenredig worden toegedeeld
      aan de bedrijfstijd van de onderscheidene werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
  - number: '18.5'
    text: |-
      De inhoudingsplichtige bewaart de in het tweede lid bedoelde gegevens, alsmede de in het tweede lid bedoelde
      afschriften en de in het derde en vierde lid bedoelde vastleggingen, bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
  - number: '18.6'
    text: Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in dit artikel genoemde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel18
  - number: '19'
    text: |-
      Indien de inhoudingsplichtige niet voldoet aan de in [artikel 18][ref1] bedoelde verplichtingen, wordt de
      afdrachtvermindering zeevaart geacht ten onrechte te hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel18
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '18'
        hoofdstuk: VII
  - number: '20'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      De S&O-afdrachtvermindering is met betrekking tot een aangiftetijdvak van toepassing indien de S&O-
      inhoudingsplichtige beschikt over een ten name van hem afgegeven S&O-verklaring die betrekking heeft op een periode
      waarin het aangiftetijdvak eindigt. Het totaal van de S&O-afdrachtvermindering beloopt het bij die S&O-verklaring
      ter zake vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      Per aangiftetijdvak wordt maximaal een evenredig deel van het bij de S&O-verklaring vastgestelde bedrag aan S&O-
      afdrachtvermindering in aanmerking genomen. De evenredigheid is gerelateerd aan het aantal aangiftetijdvakken die
      vanaf het desbetreffende aangiftetijdvak nog eindigen in de periode waarop de S&O-verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      Ingeval na afloop van de periode waarop de S&O-verklaring betrekking heeft een nog niet verrekend bedrag aan S&O-
      afdrachtvermindering resteert, en er in een aangiftetijdvak dat is geëindigd in de periode waarop de S&O-verklaring
      betrekking heeft nog ruimte voor afdrachtvermindering is, wordt het niet verrekende bedrag daar zoveel mogelijk
      mee verrekend. Voorzover toepassing van de eerste volzin tot gevolg heeft dat een nog niet verrekend bedrag met
      een reeds verstreken aangiftetijdvak wordt verrekend, wordt de aangifte over dat reeds verstreken tijdvak voor de
      toepassing van [artikel 28a van de Wet op de loonbelasting 1964][ref1] aangemerkt als een onjuiste of onvolledige
      aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: '22.1'
    text: |-
      De S&O-inhoudingsplichtige kan voor een aaneengesloten periode van ten minste drie kalendermaanden en ten
      hoogste zes kalendermaanden vallende binnen één kalenderjaar en in totaal voor niet meer dan drie perioden per
      kalenderjaar, een S&O-verklaring aanvragen. Een kalendermaand waarop een aanvraag betrekking heeft kan niet meer
      worden betrokken in een latere aanvraag.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      De S&O-inhoudingsplichtige kan, in afwijking van het eerste lid, een aanvraag indienen voor een periode van een
      heel kalenderjaar als hij beschikt over een onderzoek- of een ontwikkelafdeling en:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: 22.2.a
    text: aan de S&O-inhoudingsplichtige in het voorafgaande kalenderjaar een S&O-verklaring is verstrekt, of
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: 22.2.b
    text: |-
      indien de S&O-inhoudingsplichtige deel uitmaakt van een fiscale eenheid, aan een ander binnen de fiscale eenheid in
      het voorafgaande kalenderjaar een S&O-verklaring is verstrekt.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de inhoud van de aanvraag van een S&O-verklaring en de wijze waarop deze moet worden ingediend, waarbij in
      het algemeen of voor groepen van gevallen kan worden bepaald dat de aanvraag uitsluitend op elektronische wijze kan
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '22.4'
    text: |-
      De aanvraag moet worden ingediend ten minste een kalendermaand voorafgaande aan de periode waarop de aanvraag
      betrekking heeft. De beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na de aanvang van de
      periode waarop de aanvraag betrekking heeft. Onze Minister van Economische Zaken, Landbouw en Innovatie kan
      bij ministeriële regeling in het algemeen of voor groepen van gevallen, een latere datum vaststellen waarop de
      beslissing op de aanvraag uiterlijk moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '22.5'
    text: |-
      De aanvraag wordt in de situatie waarin de S&O-inhoudingsplichtige in het S&O-referentiejaar speur- en
      ontwikkelingswerk heeft verricht waarvoor een S&O-verklaring is verstrekt, slechts in behandeling genomen indien
      hij uiterlijk bij de indiening van de aanvraag opgave heeft gedaan van de burgerservicenummers van zijn werknemers
      die dat speur- en ontwikkelingswerk hebben verricht.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '22.6'
    text: |-
      Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de wijze waarop de opgave van de burgerservicenummers, bedoeld in het vijfde lid, moet worden gedaan,
      waarbij in het algemeen of voor groepen van gevallen kan worden bepaald dat de opgave van die burgerservicenummers
      uitsluitend op elektronische wijze kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie verstrekt aan een S&O-inhoudingsplichtige die voornemens
      is in een periode van een kalenderjaar speur- en ontwikkelingswerk te verrichten, op zijn aanvraag op de voet van
      [artikel 22][ref1] een S&O-verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel22
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '22'
        hoofdstuk: VIII
  - number: '23.2'
    text: 'De S&O-verklaring bevat:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: 23.2.a
    text: een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: 23.2.b
    text: de periode waarvoor de S&O-verklaring wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: 23.2.c
    text: |-
      het aantal uren dat werknemers van de S&O-inhoudingsplichtige in die periode aan het speur- en ontwikkelingswerk
      naar verwachting zullen besteden;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: 23.2.d
    text: het bedrag aan S&O-afdrachtvermindering met een berekening van dat bedrag.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      Het bedrag aan S&O-afdrachtvermindering beloopt 14 percent van het product van het aantal uren, bedoeld in het
      tweede lid, onderdeel c, en het gemiddelde uurloon als bedoeld in het vierde lid, vermeerderd met 24 percent van
      dat product voorzover dat product in het kalenderjaar niet uitgaat boven € 200 000. De vermeerdering met 24 percent
      blijft achterwege voorzover die vermeerdering reeds toepassing heeft gevonden bij een S&O-verklaring betreffende
      een eerdere periode van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het gemiddelde uurloon wordt gesteld op het uurloon dat de S&O-inhoudingsplichtige in het S&O-referentiejaar
      gemiddeld heeft betaald aan zijn werknemers die in dat jaar speur- en ontwikkelingswerk hebben verricht waarvoor
      een S&O-verklaring is verstrekt. Het gemiddelde uurloon wordt daarbij gesteld op de som van de door de S&O-
      inhoudingsplichtige aan deze werknemers in het S&O-referentiejaar betaalde lonen gedeeld door de som van de in
      het S&O-referentiejaar door de S&O-inhoudingsplichtige aan deze werknemers verloonde uren nadat de som van de
      verloonde uren is vermenigvuldigd met 0,85; de uitkomst van deze deling wordt naar boven afgerond op een bedrag
      in hele euro’s. Het gemiddelde uurloon wordt aldus bepaald aan de hand van de gegevens zoals die blijken uit
      de polisadministratie van het Uitvoeringsinstituut Werknemersverzekeringen op een bij ministeriële regeling van
      Onze Minister van Economische Zaken, Landbouw en Innovatie vast te stellen peildatum gelegen in het kalenderjaar
      volgende op het S&O-referentiejaar. Indien de berekening aan de hand van de gegevens op de peildatum leidt tot een
      evident onjuist gemiddeld uurloon, wordt het gemiddelde uurloon bepaald aan de hand van de juiste gegevens zoals
      die blijken na uitvraag daarvan bij de S&O-inhoudingsplichtige door Onze Minister van Economische Zaken, Landbouw
      en Innovatie. Ingeval de S&O-inhoudingsplichtige in het S&O-referentiejaar geen speur- en ontwikkelingswerk heeft
      verricht waarvoor hij over een S&O-verklaring beschikt, geldt een gemiddeld uurloon van € 29.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het totaal van de S&O-afdrachtvermindering over een kalenderjaar bedraagt per S&O-inhoudingsplichtige maximaal € 14
      000 000 dan wel, ingeval de inhoudingsplichtige deel uitmaakt of in een deel van het kalenderjaar heeft uitgemaakt,
      van een fiscale eenheid, per fiscale eenheid. In het laatste geval wordt in de S&O-verklaring vastgesteld welk deel
      van het bedrag van € 14 000 000, betrekking heeft op de S&O-inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: '23.6'
    text: |-
      De inhoudingsplichtige die deel uitmaakt van een fiscale eenheid en voor speur- en ontwikkelingswerk werknemers
      ter beschikking stelt aan een onderneming binnen die fiscale eenheid, wordt geacht dat speur- en ontwikkelingswerk
      zelf te verrichten. Op deze inhoudingsplichtige is het bij of krachtens deze wet bepaalde zoveel mogelijk van
      overeenkomstige toepassing met dien verstande dat de inhoudingsplichtige de verplichtingen in voorkomende gevallen
      zal doen uitvoeren door de onderneming die het speur- en ontwikkelingswerk uitvoert.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
  - number: '23.7'
    text: |-
      Het in het derde lid vermelde percentage van 24 wordt vervangen door 36 indien de S&O-inhoudingsplichtige
      in een of meer van de vijf voorafgaande kalenderjaren geen inhoudingsplichtige was en voor die periode met
      betrekking tot ten hoogste twee kalenderjaren een S&O-verklaring is afgegeven. Indien de voor rekening van
      de inhoudingsplichtige gedreven onderneming een voortzetting is van een onderneming die, of een gedeelte
      van een onderneming dat direct of indirect is gedreven door een met hem verbonden vennootschap in de zin van
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1], dan wel voor rekening van een natuurlijk
      persoon die op het moment van aanvraag een aanmerkelijk belang in de zin van de Wet op de inkomstenbelasting 2001
      heeft in de inhoudingsplichtige, wordt voor de toepassing van de eerste volzin een ten aanzien van de verbonden
      vennootschap, onderscheidenlijk natuurlijk persoon, reeds voor de voortzetting afgegeven S&O-verklaring aangemerkt
      als een ten aanzien van de inhoudingsplichtige afgegeven verklaring. Een S&O-verklaring die is afgegeven voor
      een deel van een kalenderjaar wordt aangemerkt als een S&O-verklaring afgegeven met betrekking tot een heel
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: '23.8'
    text: |-
      In afwijking van [artikel 1, eerste lid, onderdeel c][ref1], is het loon, bedoeld in het vierde lid, het loon in de
      zin van de [Wet op de loonbelasting 1964][ref2], zonder de verminderingen als bedoeld in dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
  - number: '24.1'
    text: |-
      De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven, houdt over de periode vermeld in de verklaring
      een overeenkomstig bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie vast te
      stellen regels ingerichte administratie bij omtrent de aard, de inhoud, de omvang en de voortgang van het werk dat
      in de verklaring is aangemerkt als speur- en ontwikkelingswerk.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      De S&O-inhoudingsplichtige aan wie een S&O-verklaring is afgegeven doet van het aantal uren dat zijn werknemers
      hebben besteed aan het speur- en ontwikkelingswerk in de periode waarop de verklaring betrekking heeft, mededeling
      aan Onze Minister van Economische Zaken, Landbouw en Innovatie, indien het aantal bestede uren minder is dan het in
      de S&O-verklaring opgenomen aantal. Indien het aantal bestede uren aan het speur- en ontwikkelingswerk ten minste
      gelijk is aan het in de S&O-verklaring opgenomen aantal, doet de S&O-inhoudingsplichtige aan wie de S&O-verklaring
      is afgegeven daarvan mededeling aan Onze Minister van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      De S&O-inhoudingsplichtige doet de mededeling, bedoeld in het tweede lid, gezamenlijk voor alle op een kalenderjaar
      betrekking hebbende S&O-verklaringen binnen drie kalendermaanden na afloop van het kalenderjaar waarop de in dat
      lid bedoelde S&O-verklaringen betrekking hebben of, indien dat later is, binnen drie kalendermaanden na de afgifte
      van de laatste S&O-verklaring die betrekking heeft op dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel24
  - number: '24.4'
    text: |-
      Bij het eindigen van de inhoudingsplicht vóór het tijdstip, bedoeld in het derde lid, wordt in afwijking van dat
      lid de mededeling gedaan binnen één kalendermaand nadat de inhoudingsplicht is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie kan bij ministeriële regeling nadere regels stellen
      ten aanzien van de inhoud van de mededeling en de indiening daarvan, waarbij in het algemeen of voor groepen van
      gevallen kan worden bepaald dat de mededeling uitsluitend op elektronische wijze kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie geeft aan de S&O-inhoudingsplichtige die de mededeling,
      bedoeld in [artikel 24, tweede lid, eerste volzin][ref1], deed, een correctie-S&O-verklaring af voor alle op
      het kalenderjaar betrekking hebbende S&O-verklaringen gezamenlijk, waarbij hij het bedrag van de correctie-S&O-
      verklaring, gespecificeerd per S&O-verklaring, vaststelt op basis van het volgens de mededeling niet gerealiseerde
      aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.2'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie geeft aan de S&O-inhoudingsplichtige een correctie-
      S&O-verklaring af met het bedrag dat op de S&O-verklaring ten onrechte is vermeld als bedrag aan S&O-
      afdrachtvermindering, indien:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
  - number: 25.2.a
    text: |-
      aannemelijk is dat ter verkrijging van de S&O-verklaring gegevens of bescheiden zijn verstrekt die zodanig onjuist
      of onvolledig zijn dat op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de
      juiste omstandigheden volledig bekend zouden zijn geweest;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
  - number: 25.2.b
    text: |-
      aannemelijk is geworden, dat de S&O-inhoudingsplichtige de verplichting, bedoeld in
      [artikel 24, tweede lid, eerste volzin][ref1], niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.3'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie kan, indien blijkt dat de in
      [artikel 24, eerste lid][ref1], bedoelde administratie niet voldoet aan het bij of krachtens dat artikel bepaalde
      aan de S&O-inhoudingsplichtige een correctie-S&O-verklaring afgeven tot een omvang waarvan onvoldoende aannemelijk
      is dat speur- en ontwikkelingswerk zoals opgenomen in de S&O-verklaring, is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '25.4'
    text: |-
      Een bedrag vastgesteld bij een correctie-S&O-verklaring komt zoveel mogelijk in mindering op het bij één
      of meer S&O-verklaringen waarop de correctie-S&O-verklaring betrekking heeft, vastgestelde bedrag aan S&O-
      afdrachtvermindering dat nog niet in mindering is gebracht op de af te dragen belasting en premie. Voorzover
      dat niet mogelijk is, is sprake van een negatieve S&O-afdrachtvermindering welke er toe leidt dat de over het
      aangiftetijdvak waarin de correctie-S&O-verklaring is gedagtekend of het daaropvolgende aangiftetijdvak af te
      dragen loonbelasting, dan wel af te dragen loonbelasting en premie voor de volksverzekeringen, wordt vermeerderd
      met dat bedrag aan negatieve S&O-afdrachtvermindering.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel25
  - number: '26.1'
    text: |-
      Bij overtreding van het bij of krachtens [artikel 24, eerste lid of tweede lid, tweede volzin][ref1], bepaalde
      of indien sprake is van het geval, bedoeld in [artikel 25, tweede lid, onderdeel a][ref2], kan Onze Minister
      van Economische Zaken, Landbouw en Innovatie aan de S&O-inhoudingsplichtige een bestuurlijke boete opleggen ter
      hoogte van maximaal € 100 000, of, wanneer dat meer is, 20% van het in de S&O-verklaring als afdrachtvermindering
      vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '26.2'
    text: |-
      Bij overtreding van het bij of krachtens [artikel 24, tweede lid, eerste volzin, of derde lid][ref1],
      bepaalde, legt Onze Minister van Economische Zaken, Landbouw en Innovatie aan de S&O-inhoudingsplichtige een
      bestuurlijke boete op ter hoogte van het bedrag van de correctie-S&O-verklaring die is vastgesteld op de voet van
      [artikel 25, tweede lid, onderdeel b][ref2]. Onze Minister van Economische Zaken, Landbouw en Innovatie kan de
      boete lager vaststellen op grond van geringe ernst van de overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '26.3'
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie brengt opgelegde boeten tot uitdrukking door deze op te
      nemen in een correctie-S&O-verklaring. [Artikel 25, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel25
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '25'
        hoofdstuk: VIII
  - number: '27.1'
    text: |-
      Aan een S&O-belastingplichtige die voornemens is in een kalenderjaar ten minste 500 uren van zijn voor
      werkzaamheden beschikbare tijd te besteden aan speur- en ontwikkelingswerk geeft Onze Minister van Economische
      Zaken, Landbouw en Innovatie op aanvraag een S&O-verklaring af.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '27.2'
    text: |-
      Aanvragen kunnen voor het laatst worden ingediend drie kalendermaanden voor het einde van het kalenderjaar. De
      beslissing op de aanvraag wordt gegeven binnen drie kalendermaanden na indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '27.3'
    text: 'De S&O-verklaring die ten name van een S&O-belastingplichtige wordt afgegeven, bevat:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: 27.3.a
    text: een omschrijving van het werk dat wordt aangemerkt als speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: 27.3.b
    text: het kalenderjaar waarvoor de S&O-verklaring wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '27.4'
    text: |-
      De S&O-belastingplichtige aan wie een S&O-verklaring is afgegeven en die in het kalenderjaar minder dan 500 uren
      van zijn voor werkzaamheden beschikbare tijd heeft besteed aan het speur- en ontwikkelingswerk waarop de S&O-
      verklaring betrekking heeft, doet daarvan binnen drie kalendermaanden na afloop van het kalenderjaar waarop de S&O-
      verklaring betrekking heeft mededeling aan Onze Minister van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '27.5'
    text: |-
      [Artikel 3.6, vijfde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '27.6'
    text: |-
      [Artikel 24, eerste lid][ref1], is van overeenkomstige toepassing met betrekking tot de S&O-belastingplichtige aan
      wie een S&O-verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: '27.7'
    text: 'Onze Minister van Economische Zaken, Landbouw en Innovatie trekt de S&O-verklaring in indien:'
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: 27.7.a
    text: |-
      blijkt dat de in [artikel 24, eerste lid][ref1], bedoelde administratie niet voldoet aan het bij of krachtens dat
      artikel bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel24
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '24'
        hoofdstuk: VIII
  - number: 27.7.b
    text: |-
      de S&O-belastingplichtige de mededeling, bedoeld in het vierde lid, deed, of aannemelijk is dat hij dat had behoren
      te doen;
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: 27.7.c
    text: |-
      aannemelijk is dat ter verkrijging van de S&O-verklaring gegevens of bescheiden zijn verstrekt die zodanig onjuist
      of onvolledig zijn dat op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de
      juiste omstandigheden volledig bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '27.8'
    text: |-
      Bij ministeriële regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie worden regels gesteld
      omtrent de inhoud van de aanvraag en de wijze waarop deze moet worden ingediend. Onze Minister van Economische
      Zaken, Landbouw en Innovatie kan bij ministeriële regeling nadere regels stellen ten aanzien van de inhoud van de
      mededeling, bedoeld in het vierde lid, en de indiening daarvan.
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      De in de [artikelen 47 tot en met 51][ref1] en
      [53, eerste en vierde lid, tot en met 56 van Algemene wet inzake rijksbelastingen][ref2] jegens de inspecteur
      opgelegde verplichtingen gelden mede jegens de door Onze Minister van Economische Zaken, Landbouw en Innovatie met
      betrekking tot de toepassing van in dit hoofdstuk aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '28.2'
    text: |-
      De [artikelen 68][ref1], [69][ref2] en [72 van de Algemene wet inzake rijksbelastingen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel72
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '72'
  - number: '29'
    text: |-
      Teneinde zo veel mogelijk evenwicht te bereiken tussen de S&O-afdrachtverminderingen en het hiervoor in de
      rijksbegroting opgenomen bedrag, kan bij regeling van Onze Minister van Economische Zaken, Landbouw en Innovatie,
      onder overeenkomstige aanpassing van dit artikel, met ingang van 1 januari van enig jaar:
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel29
  - number: 29.a
    text: |-
      het in [artikel 23, derde lid][ref1], vermelde percentage van 14, worden verhoogd tot ten hoogste 25, worden
      verlaagd, dan wel op nihil worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 29.b
    text: |-
      het in [artikel 23, derde en zevende lid][ref1], vermelde percentage van 24, worden verhoogd tot ten hoogste 33,5,
      worden verlaagd, dan wel op nihil worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: 29.c
    text: |-
      het in [artikel 23, zevende lid][ref1], vermelde percentage van 36, worden verhoogd tot ten hoogste 46, worden
      verlaagd, dan wel op nihil worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
        hoofdstuk: VIII
  - number: '30.1'
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de [artikelen 63][ref2] en
      [67][ref3], is niet van toepassing met betrekking tot de uitvoering van deze wet door andere dan de in
      [artikel 2, derde lid, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref4] genoemde
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0007746/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref4
