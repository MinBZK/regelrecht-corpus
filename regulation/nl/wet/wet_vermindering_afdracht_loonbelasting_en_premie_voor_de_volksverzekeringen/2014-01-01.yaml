    text: |-
      een inhoudingsplichtige die niet tevens een onderneming drijft, voor zover hij speur- en ontwikkelingswerk
      verricht krachtens een schriftelijk vastgelegde overeenkomst met en voor rekening van een onderneming,
      een samenwerkingsverband van degenen die een onderneming drijven of een lichaam als bedoeld in de
