    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1.1.n
    text: |-
      speur- en ontwikkelingswerk: door een S&O-inhoudingsplichtige, dan wel een S&O-belastingplichtige, systematisch
      georganiseerde en in een lidstaat van de Europese Unie verrichte werkzaamheden, direct en uitsluitend gericht op:
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.n.1°
    text: technisch-wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.n.2°
    text: |-
      de ontwikkeling van voor de S&O-inhoudingsplichtige of de S&O-belastingplichtige technisch nieuwe (onderdelen van)
      fysieke producten, (onderdelen van) fysieke productieprocessen, of (onderdelen van) programmatuur;
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.n.3°
    text: |-
      het uitvoeren van een systematisch opgezette analyse van de technische haalbaarheid van het zelf verrichten van het
      speur- en ontwikkelingswerk, bedoeld onder 1°of 2°, of
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.n.4°
    text: |-
      het uitvoeren van een technisch onderzoek naar een substantiële wijziging van een productiemethode, indien de
      wijziging kan leiden tot een significante verbetering van het fysieke productieproces dat reeds wordt toegepast in
      de onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige, dan wel naar modellering van processen,
      indien deze kan leiden tot een significante verbetering van programmatuur die reeds wordt toegepast in de
      onderneming van de S&O-inhoudingsplichtige of S&O-belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.o
    text: |-
      programmatuur: het niet-fysieke, logische deelsysteem van een informatiesysteem dat de structuur van de gegevens en
      van de verwerkingsprocessen bepaalt;
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.p
    text: |-
      S&O-referentiejaar: het tweede kalenderjaar voorafgaande aan het kalenderjaar waarop de S&O-afdrachtvermindering
