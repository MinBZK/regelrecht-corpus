    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van het eerste lid, onderdeel n, wordt niet tot speur- en ontwikkelingswerk gerekend:'
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.3.a
    text: marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.3.b
    text: organisatorische en administratieve werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.3.c
    text: door Onze Minister van Economische Zaken bij ministeriële regeling aangewezen andere werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: '1.4'
    text: |-
      De ministeriële regelingen, bedoeld in deze wet, worden, voor zover niet anders is bepaald, uitgevaardigd
      door Onze Minister, wat betreft de regelingen, bedoeld in de [artikelen 17][ref1], [18][ref2] en [20][ref3],
      in overeenstemming met Onze Minister van Infrastructuur en Milieu en Onze Minister van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007746#Artikel20
