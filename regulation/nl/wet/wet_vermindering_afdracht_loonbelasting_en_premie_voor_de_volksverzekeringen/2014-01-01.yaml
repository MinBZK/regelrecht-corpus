    url: https://wetten.overheid.nl/BWBR0007746/2014-01-01#Artikel1
  - number: 1.1.q
    text: |-
      S&O-verklaring: de door Onze Minister van Economische Zaken op de voet van [artikel 23][ref1] aan een S&O-
      inhoudingsplichtige of [artikel 27][ref2] aan een S&O-belastingplichtige afgegeven verklaring betreffende speur-
