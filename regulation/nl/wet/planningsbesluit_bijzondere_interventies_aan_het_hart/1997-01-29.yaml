preamble:
  text: >-
    Gelet op artikel 18, eerste en tweede lid, van de Wet ziekenhuisvoorzienin-gen en artikel 1, onder b, van het
    Besluit bijzondere verrichtingen en apparatuur Wet ziekenhuisvoorzienin-gen;


    Gezien de rapporten van de Gezondheidsraad (rapporten van 12 maart 1993, 30 november 1993 en 23 januari 1995);


    van het College voor ziekenhuisvoorzieningen (uitvoeringstoets van 7 oktober 1996);


    Besluit:
  url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      De omvang van de behoefte aan bijzondere interventies aan het hart en de wijze waarop in die behoefte kan worden
      voorzien, zijn neergelegd in bijlage 1 bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#Artikel1
  - number: '2'
    text: |-
      De bijlagen V, VI en XIII bij het Besluit procedures voor bijzondere functies [Wet ziekenhuisvoorzieningen][ref1]
      worden vervangen door bijlage 2 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: '3'
    text: >-
      Het Planningsbesluit hartchirurgie, het Planningsbesluit hartcatheterisatie en de Regeling hartritmestoornissen
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#Artikel3
  - number: '4'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Planningsbesluit bijzondere interventies aan het hart.'
    url: https://wetten.overheid.nl/BWBR0008447/1997-01-29#Artikel5
