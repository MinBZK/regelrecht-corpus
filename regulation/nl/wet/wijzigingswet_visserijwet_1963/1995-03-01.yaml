preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de Organisatie ter verbetering van de
    binnenvisserij wordt belast met de uitgifte van de visakten, het innen van de bijdrage ter verbetering van
    de binnenvisserij en de besteding van de gelden die hiermede worden verkregen alsmede dat een regeling inzake
    consenten voor de kustvisserij uit het oogpunt van efficiency niet langer noodzakelijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007108/1995-03-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Akten als bedoeld in [artikel 10 van de Visserijwet 1963][ref1], die zijn uitgereikt voor het tijdstip van
      inwerkingtreding van deze wet, behouden hun geldigheid gedurende het jaar waarvoor zij zijn uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel10
    url: https://wetten.overheid.nl/BWBR0007108/1995-03-01#ArtikelII
