  - number: 6.2.1
    text: |-
      Indien het recht op een loonkostenvoordeel doelgroep banenafspraak en scholingsbelemmerden
      op grond van [artikel 2.10][ref1], zoals dat luidde voor de datum van inwerkingtreding van
      [artikel 8, onderdeel E, onderdelen 1, 3, 4 en 5, van de Wet banenafspraak][ref2], is aangevangen voor die datum
      van inwerkingtreding, en dat recht voor die datum niet is geëindigd, wordt dat loonkostenvoordeel ten hoogste
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0051018#Artikel8
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0051018
        artikel: '8'
  - number: 6.2.1.a
    text: |-
      voor de resterende duur op grond van [artikel 2.12][ref1] zoals dat luidde voor die datum van inwerkingtreding,
      en waarbij aan de voorwaarden van [artikel 2.10][ref2] wordt voldaan zoals dat luidde voor die datum
      van inwerkingtreding, indien het een werknemer betreft die geen arbeidsbeperkte is als bedoeld in
      [artikel 38b van de Wet financiering sociale verzekeringen][ref3], en daarmee ook niet gelijkgesteld is op grond
      van [artikel 38f, vijfde lid, van die wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref4
        bwb_id: BWBR0017745
        artikel: 38f
  - number: 6.2.1.b
    text: |-
      voor de periode waarin de betreffende werknemer in dienstbetrekking staat tot de betreffende werkgever en voor
      zo lang aan de voorwaarden, bedoeld in [artikel 2.10][ref1], wordt voldaan, indien het een werknemer betreft die
      arbeidsbeperkte is als bedoeld in [artikel 38b van de Wet financiering sociale verzekeringen][ref2], of daarmee
      gelijkgesteld is op grond van [artikel 38f, vijfde lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 38f
  - number: 6.2.2
    text: |-
      Op de aanvraag van een doelgroepverklaring voor het loonkostenvoordeel doelgroep banenafspraak
      met betrekking tot dienstbetrekkingen die zijn aangegaan voor de datum van inwerkingtreding van
      [artikel 8, onderdeel F, van de Wet banenafspraak][ref1] is [artikel 2.11][ref2] van toepassing, zoals dat luidde
      op de dag voor die datum van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0051018#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0051018
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
  - number: 6.2.3
    text: |-
      De werkgever bewaart de doelgroepverklaring met betrekking tot een loonkostenvoordeel waarop het eerste lid van
      toepassing is bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
  - number: 6.2.4
    text: |-
      Indien het recht op een loonkostenvoordeel doelgroep banenafspraak en scholingsbelemmerden
      op grond van [artikel 2.10][ref1], zoals dat luidde voor de datum van inwerkingtreding van
      [artikel 8, onderdeel E, onderdelen 1, 3, 4 en 5, van de Wet banenafspraak][ref2], is aangevangen voor die datum
      van inwerkingtreding, en dat recht voor die datum niet is geëindigd, wordt dat loonkostenvoordeel ten hoogste
      verstrekt voor de resterende duur op grond van [artikel 2.12][ref3], en waarbij aan de voorwaarden van artikel
      2.10 wordt voldaan, zoals die artikelen luidden voor die datum van inwerkingtreding, indien de registratie van die
      werknemer in de registratie arbeidsbeperkten is beëindigd op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0051018#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0051018
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
  - number: 6.2.5
    text: |-
      Vanaf de datum van inwerkingtreding van
      [artikel 8, onderdeel E, onderdelen 1, 3, 4 en 5, van de Wet banenafspraak][ref1] wordt onder een
      loonkostenvoordeel doelgroep banenafspraak mede verstaan een loonkostenvoordeel doelgroep banenafspraak en
      scholingsbelemmerden op grond van [artikel 2.10][ref2], zoals dat luidde voor die datum van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0051018#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0051018
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
  - number: 6.2a.1
    text: |-
      De [artikelen 2.1 tot en met 2.5][ref1], [4.7][ref2] en [6.1][ref3], zoals deze luidden op de dag voor de datum van
      inwerkingtreding van artikel I, onderdelen Ba en Bb, van de Wet van 18 april 2024, houdende wijzigingen van de Wet
      tegemoetkomingen loondomein teneinde het lage inkomensvoordeel te laten vervallen en in verband met enkele andere
      wijzigingen, zijn van toepassing op de verstrekking van een loonkostenvoordeel oudere werknemer dat wordt verstrekt
      voor een dienstbetrekking die is aangevangen voor 1 januari 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel6
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '4'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '6'
        hoofdstuk: VI
  - number: 6.2a.2
    text: |-
      [Artikel 2.5][ref1] zoals dat luidde op de dag voor de datum van inwerkingtreding van artikel I, onderdeel Bb,
      van de Wet van 18 april 2024, houdende wijzigingen van de Wet tegemoetkomingen loondomein teneinde het lage
      inkomensvoordeel te laten vervallen en in verband met enkele andere wijzigingen, is van toepassing op de hoogte van
      een loonkostenvoordeel oudere werknemer voor zover daar recht op bestaat gedurende het kalenderjaar voor die datum
      van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.2'
  - number: 6.2a.3
    text: |-
      De [artikelen 2.1 tot en met 2.5][ref1], [4.7][ref2] en [6.1][ref3], zoals deze luidden op de dag voor de datum van
      inwerkingtreding van artikel I, onderdelen Aa, Ab, Ka en La, van de Wet van 18 april 2024, houdende wijzigingen van
      de Wet tegemoetkomingen loondomein teneinde het lage inkomensvoordeel te laten vervallen en in verband met enkele
      andere wijzigingen, zijn van toepassing op de hoogte en de verstrekking van een loonkostenvoordeel oudere werknemer
      voor zover daar recht op bestaat gedurende het kalenderjaar voor die datum van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel6
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '4'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '6'
        hoofdstuk: VI
  - number: 6.2a.4
    text: |-
      Op de verstrekking van een loonkostenvoordeel herplaatsen arbeidsgehandicapte werknemer, als bedoeld in
      [artikel 2.14, eerste lid][ref1], blijven de artikelen 2.14, eerste lid, [2.15, eerste lid][ref2], en
      [2.16, eerste lid][ref3], van toepassing zoals deze luidden op de dag voor de datum van inwerkingtreding van
      artikel I, onderdelen C, D en E, van de Wet van 18 april 2024, houdende wijzigingen van de Wet tegemoetkomingen
      loondomein teneinde het lage inkomensvoordeel te laten vervallen en in verband met enkele andere wijzigingen,
      indien de werknemer waarvoor recht bestaat op dit loonkostenvoordeel voor die datum voldoet aan de voorwaarden,
      bedoeld in artikel 2.14, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
