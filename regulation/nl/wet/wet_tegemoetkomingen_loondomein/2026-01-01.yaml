  - number: 4.5.2
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de inspecteur
      op het bezwaarschrift binnen 26 weken gerekend vanaf de dag na die waarop de termijn voor het indienen van
      het bezwaarschrift is verstreken. De inspecteur beslist op het bezwaarschrift inzake de verstrekking van een
      tegemoetkoming als bedoeld in [artikel 2.1][ref2] na overleg met het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
  - number: 4.6.1
    text: |-
      De rijksbelastingdienst en het college van burgemeester en wethouders zijn verplicht aan het Uitvoeringsinstituut
      werknemersverzekeringen kosteloos de opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.6
  - number: 4.6.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is verplicht aan de rijksbelastingdienst kosteloos de opgaven en
      inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.6
  - number: 4.6.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de rijksbelastingdienst zijn bevoegd de gegevens die zij
      op grond van [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] verwerken in de
      polisadministratie en op grond van [artikel 38d van de Wet financiering sociale verzekeringen][ref2] verwerken
      in de registratie van arbeidsbeperkten voor zover noodzakelijk tevens te verwerken voor de vaststelling van de
      tegemoetkomingen, bedoeld in [artikel 2.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38d
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
  - number: 4.7.1
    text: |-
      Indien de werkgever een verzoek als bedoeld in [artikel 2.1][ref1] heeft gedaan met betrekking tot een werknemer
      die niet voldoet aan de voorwaarden, bedoeld in de [artikelen 2.6][ref2], [2.10][ref3] of [2.14][ref4], vormt dit
      een verzuim waarvoor de inspecteur hem een bestuurlijke boete van ten hoogste € 1.319 per verzoek kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: 4.7.2
    text: |-
      Indien de werkgever in de loonaangifte onjuiste gegevens heeft opgenomen waarvan de juistheid voor de toepassing
      van deze wet van belang is, vormt dit een verzuim waarvoor de inspecteur hem een bestuurlijke boete van ten hoogste
      € 1.319 per gegeven per werknemer kan opleggen.
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
  - number: 4.7.3
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het in
      het eerste lid en tweede lid genoemde bedrag, met dien verstande dat de wijziging van het bedrag voor het eerst
      plaatsvindt per 1 januari 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: 4.7.4
    text: |-
      Wanneer de werkgever die een verzoek als bedoeld in [artikel 2.1][ref1] heeft gedaan met betrekking tot een
      werknemer die niet voldoet aan de voorwaarden, bedoeld in de [artikelen 2.6][ref2], [2.10][ref3] of [2.14][ref4],
      dit verzoek door middel van een correctiebericht intrekt na de in [artikel 4.1, tweede lid][ref5], bedoelde
      datum volgend op het kalenderjaar waarop het verzoek betrekking heeft, maar voordat hij weet of redelijkerwijs
      moet vermoeden dat de inspecteur met de onjuistheid bekend is of bekend zal worden, is dit een omstandigheid die
      aanleiding geeft tot matiging van de boete.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0037522#Artikel4
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037522
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2.5'
      - id: ref5
        bwb_id: BWBR0037522
        artikel: '4'
        hoofdstuk: IV
  - number: 4.7.5
    text: |-
      De inspecteur stelt de bestuurlijke boete bij beschikking vast. De bevoegdheid tot het opleggen van een boete
      vervalt door verloop van 5 jaren na het einde van het kalenderjaar waarop het verzoek, bedoeld in het eerste lid,
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
  - number: 4.7.6
    text: |-
      Op dit artikel zijn de [artikelen 67pa][ref1] en [67pb van de Algemene wet inzake rijksbelastingen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67pa
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67pb
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67pa
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67pb
  - number: '6.1'
    text: |-
      Teneinde zo veel mogelijk evenwicht te bereiken tussen de tegemoetkomingen, bedoeld in de [artikelen 2.6][ref1],
      [2.10][ref2] en [2.14][ref3], en de hiervoor in de rijksbegroting opgenomen bedragen, kunnen bij regeling
      van Onze Minister van Sociale Zaken en Werkgelegenheid met ingang van 1 januari van enig jaar de in de
      [artikelen 2.9][ref4], [2.13][ref5] en [2.17][ref6] opgenomen bedragen worden verlaagd dan wel verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0037522#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0037522#Artikel2
    url: https://wetten.overheid.nl/BWBR0037522/2026-01-01#Artikel6.1
