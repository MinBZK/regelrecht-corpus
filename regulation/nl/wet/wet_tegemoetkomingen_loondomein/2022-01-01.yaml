        bwb_id: BWBR0037522
        artikel: '2.14'
        hoofdstuk: II
        paragraaf: '2.5'
  - number: '3.1'
    text: |-
      1 Een werkgever heeft recht op een lage-inkomensvoordeel indien bij deze werkgever een werknemer in een of meerdere
      dienstbetrekkingen is waarvan:

      a. het gemiddelde uurloon in het kalenderjaar gelijk is aan of meer bedraagt dan € 10,73 maar niet meer dan
      € 13,43; en

      b. in het kalenderjaar ten minste 1248 verloonde uren zijn opgenomen in de loonaangifte.

      2 Het eerste lid is niet of niet langer van toepassing indien de werknemer de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt. Ingeval de periode waarin het lage-
      inkomensvoordeel van toepassing is, in de loop van een aangiftetijdvak eindigt, wordt die periode verlengd met het
      buiten die periode vallende deel van het aangiftetijdvak waarin die periode eindigt.

      3 Het gemiddelde uurloon, bedoeld in het eerste lid, onderdeel a, wordt vastgesteld door het jaarloon te delen door
      de verloonde uren.

      4 Bij het begin van het kalenderjaar worden de bedragen, genoemd in het eerste lid, bij regeling van Onze Minister
      van Sociale Zaken en Werkgelegenheid, na overleg met Onze Minister van Financiën, gewijzigd in andere bedragen
      waarbij de te wijzigen bedragen worden verhoogd of verlaagd overeenkomstig de wijzigingen van de bedragen, genoemd
      in [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0037522/2022-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '3.2'
    text: |-
      Een lage-inkomensvoordeel bedraagt € 0,49 per verloond uur van de werknemers die voldoen aan de voorwaarde, bedoeld
      in [artikel 3.1, eerste lid, onderdeel a][ref1], doch ten hoogste € 960 per werknemer per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0037522/2022-01-01#Artikel3.2
    references:
