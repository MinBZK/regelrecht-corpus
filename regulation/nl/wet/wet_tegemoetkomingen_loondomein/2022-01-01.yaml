  - number: '6.2'
    text: |-
      Een werkgever die:

      a. voor een werknemer een verzoek doet als bedoeld in [artikel 2.1][ref1];

      b. over het voor de werkgever van toepassing zijnde aangiftetijdvak direct voorafgaand aan
      de inwerkingtreding van [artikel 5.1][ref2] voor de werknemer, bedoeld in onderdeel a, een
      premiekorting op grond van de [artikelen 47][ref3], [49][ref4], [122a][ref5], [122b][ref6] of
      [122l van de Wet financiering sociale verzekeringen][ref7], zoals die luidden op de dag voor
      inwerkingtreding van artikel 5.1 heeft toegepast in de aangifte over dat tijdvak of uiterlijk op de in
      [artikel 4.1, tweede of zevende lid][ref8], bedoelde datum van het jaar waarin artikel 5.1 in werking is getreden
      in een correctiebericht als bedoeld in [artikel 28a van de Wet op de loonbelasting 1964][ref9] met betrekking tot
      die aangifte; en

      c. in de loonaangifte over het laatste aangiftetijdvak van het jaar voorafgaand aan de dag van inwerkingtreding
      van [artikel 5.1][ref10] de indicatie voor de premiekorting, bedoeld in onderdeel b, heeft aangegeven, dan wel
      uiterlijk op de in [artikel 4.1, tweede of zevende lid][ref11], bedoelde datum van het jaar waarin artikel 5.1
      in werking is getreden, de aangifte over dat aangiftetijdvak door middel van een correctiebericht als bedoeld in
      [artikel 28a van de Wet op de loonbelasting 1964][ref12] heeft aangevuld met een indicatie voor de premiekorting,
      bedoeld in onderdeel b;

      heeft met ingang van de datum van inwerkingtreding van [artikel 5.1][ref13] aanspraak op het overeenkomstige
      loonkostenvoordeel op grond van deze wet, waarbij de reeds verstreken duur van de premiekorting, bedoeld
      in onderdeel b, wordt afgetrokken van de maximale duur van de toepassing van het loonkostenvoordeel. De
      aanspraak bestaat niet of niet langer indien [artikel 2.2, tweede lid][ref14], [artikel 2.6, derde lid][ref15],
      [artikel 2.10, tweede lid][ref16], of [artikel 2.14, tweede lid][ref17], van toepassing is.


