        bwb_id: BWBR0037522
        artikel: '3.1'
        hoofdstuk: III
  - number: '3.3'
    text: |-
      1 Een werkgever heeft recht op een minimumjeugdloon voordeel indien bij deze werkgever een werknemer in een of
      meerdere dienstbetrekkingen is en:

      a. de werknemer op 31 december van het voorafgaande kalenderjaar de leeftijd van 18 jaar heeft bereikt maar nog
      niet de leeftijd van 21 jaar; en

      b. het gemiddelde uurloon in het kalenderjaar ten aanzien van de volgende te onderscheiden leeftijden van de
      werknemer valt binnen de volgende bandbreedtes die worden afgeleid van het wettelijk minimumloon en de wettelijke
      minimumvakantiebijslag waarop recht bestaat in het kalenderjaar ingevolge de [hoofdstukken II][ref1] en
      [III van de Wet minimumloon en minimumvakantiebijslag][ref2]:

      1°. ten aanzien van een werknemer als bedoeld in onderdeel a die de leeftijd van 18 jaar heeft bereikt, ten minste
      50 procent bij een normale arbeidsduur van 40 uren per week maar minder dan 60 procent bij een normale arbeidsduur
      van 36 uren per week;

      2°. ten aanzien van een werknemer als bedoeld in onderdeel a die de leeftijd van 19 jaar heeft bereikt, ten minste
      60 procent bij een normale arbeidsduur van 40 uren per week maar minder dan 80 procent bij een normale arbeidsduur
      van 36 uren per week;

      3°. ten aanzien van een werknemer als bedoeld in onderdeel a die de leeftijd van 20 jaar heeft bereikt, ten minste
      80 procent bij een normale arbeidsduur van 40 uren per week maar minder dan 100 procent bij een normale arbeidsduur
      van 40 uren per week.

      2 Het gemiddelde uurloon, bedoeld in het eerste lid, onderdeel b, wordt vastgesteld door het jaarloon
      te delen door de verloonde uren en bedraagt minder dan het laagste gemiddelde uurloon, bedoeld in
      [artikel 3.1, eerste lid, onderdeel a, onder 1°][ref3].

      3 Bij het begin van de maand juli van het kalenderjaar worden de bedragen van de ondergrens en bovengrens naar
      leeftijd met toepassing van de bandbreedtes, bedoeld in het eerste lid, onderdeel b, bij regeling van Onze Minister
      van Sociale Zaken en Werkgelegenheid, na overleg met Onze Minister van Financiën vastgesteld voor dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002638#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0037522/2022-01-01#Artikel3.3
