  - number: '3.4'
    text: |-
      Een minimumjeugdloon voordeel bedraagt:

      a. € 0,07 per verloond uur van de werknemers die voldoen aan de voorwaarde, bedoeld in
      [artikel 3.3, eerste lid, onderdeel b, onder 1°][ref1], doch ten hoogste € 135,20 per werknemer per kalenderjaar;

      b. € 0,08 per verloond uur van de werknemers die voldoen aan de voorwaarde, bedoeld in
      [artikel 3.3, eerste lid, onderdeel b, onder 2°][ref2], doch ten hoogste € 166,40 per werknemer per kalenderjaar;

      c. € 0,30 per verloond uur van de werknemers die voldoen aan de voorwaarde, bedoeld in
      [artikel 3.3, eerste lid, onderdeel b, onder 3°][ref3], doch ten hoogste € 613,60 per werknemer per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0037522#Artikel3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037522#Artikel3.3
