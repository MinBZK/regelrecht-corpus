  - number: '2.2'
    text: |-
      1 Een werkgever die een verzoek als bedoeld in [artikel 2.1][ref1] heeft gedaan, heeft recht op een
      loonkostenvoordeel oudere werknemer indien bij deze werkgever een werknemer in een of meerdere dienstbetrekkingen
      is die:

      a. in de maand voorafgaand aan de aanvang van de dienstbetrekking:

      1°. recht had op een uitkering op grond van de [Werkloosheidswet][ref2], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], de [Wet werk en inkomen naar arbeidsvermogen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], de
      [Participatiewet][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref10] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref11]; of

      2°. recht had op arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12];

      b. op het moment van aanvang van de dienstbetrekking 56 jaar of ouder was;

      c. niet op enig moment in de periode van zes maanden voorafgaand aan de datum van indiensttreding bij deze
      werkgever in dienstbetrekking is geweest; en

      d. een geldige doelgroepverklaring als bedoeld in [artikel 2.3][ref13] aan de werkgever heeft verstrekt.

      2 Het eerste lid is niet of niet langer van toepassing indien:

      a. de werknemer de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref14], heeft bereikt;

      b. de werknemer arbeid verricht in een dienstbetrekking als bedoeld in
      [artikel 2 van de Wet sociale werkvoorziening][ref15] of als bedoeld in
      [artikel 10b, derde lid, van de Participatiewet][ref16]; of

      c. de periode, bedoeld in [artikel 2.4][ref17], voor deze werknemer is verstreken.

      3 Met een uitkering als bedoeld in het eerste lid, onderdeel a, wordt gelijkgesteld een naar aard en strekking
      daarmee overeenkomende uitkering op grond van een wettelijk stelsel inzake sociale zekerheid van een andere
      lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte dan wel Zwitserland.

      4 Voor de toepassing van dit artikel worden onderbrekingen van een dienstbetrekking tussen dezelfde werkgever en
      werknemer binnen de periode, bedoeld in [artikel 2.4, eerste lid][ref18], geacht niet te hebben plaatsgevonden.


