  - number: '2.10'
    text: |-
      1 Een werkgever die een verzoek als bedoeld in [artikel 2.1][ref1] heeft gedaan, heeft recht op een
      loonkostenvoordeel doelgroep banenafspraak en scholingsbelemmerden indien bij deze werkgever een werknemer in een
      of meerdere dienstbetrekkingen is die:

      a. in de maand voorafgaand aan de aanvang van de dienstbetrekking of op de eerste dag van de dienstbetrekking:

      1°. recht had op arbeidsondersteuning of een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2];

      2°. geïndiceerd was als bedoeld in de [Wet sociale werkvoorziening][ref3] of een nog geldende indicatiebeschikking
      had op grond van [artikel 11 van die wet][ref4], zoals dat artikel luidde op 31 december 2014;

      3°. met ondersteuning bij de arbeidsinschakeling van het college van burgemeester en wethouders op grond van
      [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref5] naar een dienstbetrekking is of wordt toegeleid
      en van wie door het Uitvoeringsinstituut werknemersverzekeringen is vastgesteld dat hij niet in staat is tot
      het verdienen van het wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref6],
      dan wel van wie door het college van burgemeester en wethouders in overeenstemming met de eisen gesteld aan
      een loonwaardevaststelling op grond van [artikel 10d, eerste of tweede lid, van de Participatiewet][ref7] een
      loonwaarde is vastgesteld die bij voltijdse arbeid minder bedraagt dan het wettelijk minimumloon, bedoeld in
      artikel 2, onderdeel c, van de Participatiewet, tenzij de dienstbetrekking is aangegaan voor 1 januari 2016;

      4°. voldeed aan een indicatie als bedoeld in
      [artikel 38b, eerste lid, onderdeel d, van de Wet financiering sociale verzekeringen][ref8]
      of werkzaam was in een dienstbetrekking die is aangewezen op grond van
      [artikel 38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref9];

      5°. een arbeidsbeperkte is als bedoeld in
      [artikel 38b, eerste lid, onderdeel f, van de Wet financiering sociale verzekeringen][ref10];

      6°. een arbeidsbeperkte was als bedoeld in
      [artikel 38b, tweede lid, van de Wet financiering sociale verzekeringen][ref11]; of

      7°. geen werknemer was als bedoeld in het eerste tot en met vijfde subonderdeel, in verband met ziekte of gebrek
      een belemmering heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs
      arbeid in dienstbetrekking is gaan verrichten;

      b. niet in de periode van zes maanden voorafgaand aan de datum van indiensttreding in dienstbetrekking bij de
      werkgever is geweest; en

      c. een geldige doelgroepverklaring als bedoeld in [artikel 2.11][ref12] aan de werkgever heeft verstrekt.

      2 Het eerste lid is niet of niet langer van toepassing indien:

      a. de werknemer de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref13], heeft bereikt;

      b. de werknemer arbeid verricht in een dienstbetrekking als bedoeld in
      [artikel 2 van de Wet sociale werkvoorziening][ref14] of als bedoeld in
      [artikel 10b, derde lid, van de Participatiewet][ref15]; of

      c. de periode, bedoeld in [artikel 2.12][ref16], voor deze werknemer is verstreken.

      3 Voor de toepassing van dit artikel worden onderbrekingen van een dienstbetrekking tussen dezelfde werkgever en
      werknemer binnen de periode, bedoeld in [artikel 2.12, eerste lid][ref17], geacht niet te hebben plaatsgevonden.

      4 Voor de toepassing van dit artikel wordt onder een werknemer als bedoeld in het eerste lid, onderdeel a, tevens
      verstaan de persoon die in de kalendermaand voorafgaand aan de aanvang van de dienstbetrekking niet langer aan de
      voorwaarden op grond van het eerste lid, onderdeel a, voldoet en als arbeidsbeperkte wordt beschouwd op grond van
      [artikel 38b, zesde lid, van de Wet financiering sociale verzekeringen][ref18].


