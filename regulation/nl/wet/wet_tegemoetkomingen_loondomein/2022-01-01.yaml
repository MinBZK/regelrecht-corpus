  - number: '4.7'
    text: |-
      1 Indien de werkgever een verzoek als bedoeld in [artikel 2.1][ref1] heeft gedaan met betrekking tot een
      werknemer die niet voldoet aan de voorwaarden, bedoeld in de [artikelen 2.2][ref2], [2.6][ref3], [2.10][ref4] of
      [2.14][ref5], vormt dit een verzuim waarvoor de inspecteur hem een bestuurlijke boete van ten hoogste € 1.319 per
      verzoek per jaar kan opleggen.

      2 Indien de werkgever in de loonaangifte onjuiste gegevens heeft opgenomen waarvan de juistheid voor de toepassing
      van deze wet van belang is, vormt dit een verzuim waarvoor de inspecteur hem een bestuurlijke boete van ten hoogste
      € 1.319 per gegeven per werknemer per jaar kan opleggen.

      3 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref6] is van overeenkomstige toepassing op het in
      het eerste lid en tweede lid genoemde bedrag, met dien verstande dat de wijziging van het bedrag voor het eerst
      plaatsvindt per 1 januari 2020.

      4 Wanneer de werkgever die een verzoek als bedoeld in [artikel 2.1][ref7] heeft gedaan met betrekking
      tot een werknemer die niet voldoet aan de voorwaarden, bedoeld in de [artikelen 2.2][ref8], [2.6][ref9],
      [2.10][ref10] of [2.14][ref11], dit verzoek door middel van een correctiebericht intrekt na de in
      [artikel 4.1, tweede of zevende lid][ref12], bedoelde datum volgend op het kalenderjaar waarop het verzoek
      betrekking heeft, maar voordat hij weet of redelijkerwijs moet vermoeden dat de inspecteur met de onjuistheid
      bekend is of bekend zal worden, is dit een omstandigheid die aanleiding geeft tot matiging van de boete.

      5 De inspecteur stelt de bestuurlijke boete bij beschikking vast. De bevoegdheid tot het opleggen van een boete
      vervalt door verloop van 5 jaren na het einde van het kalenderjaar waarop het verzoek, bedoeld in het eerste lid,
      betrekking heeft.

      6 Op dit artikel zijn de [artikelen 67pa][ref13] en [67pb van de Algemene wet inzake rijksbelastingen][ref14] van
      overeenkomstige toepassing.


