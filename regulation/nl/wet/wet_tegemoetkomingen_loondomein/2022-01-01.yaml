  - number: '2.1'
    text: |-
      Een werkgever kan in de loonaangifte een verzoek doen voor de volgende tegemoetkomingen:

      a. loonkostenvoordeel oudere werknemer;

      b. loonkostenvoordeel arbeidsgehandicapte werknemer;

      c. loonkostenvoordeel doelgroep banenafspraak en scholingsbelemmerden;

      d. loonkostenvoordeel herplaatsen arbeidsgehandicapte werknemer;

      waarbij een uiterlijk op de in [artikel 4.1, tweede of zevende lid][ref1], bedoelde datum van het kalenderjaar
      volgend op het kalenderjaar waarop de tegemoetkoming betrekking heeft ingediend correctiebericht wordt opgevat als
      een in de loonaangifte gedaan verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0037522#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0037522/2022-01-01#Artikel2.1
