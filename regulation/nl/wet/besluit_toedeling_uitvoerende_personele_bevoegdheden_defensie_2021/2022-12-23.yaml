  - number: '3'
    text: |-
      1 Ik verleen de mandaten als weergegeven in de [bijlagen 1 tot en met 7][ref1].

      2 De [bijlagen 1 tot en met 7][ref2] bevatten tevens een overzicht van verleende ondermandaten en de voorwaarden
      die daarbij van toepassing zijn.

      3 Onverlet de in het vorige lid genoemde [bijlagen][ref3] is de Secretaris-Generaal bevoegd om namens mij
      uitvoerende personele bevoegdheden uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0039990
      [ref2]: https://wetten.overheid.nl/BWBR0039990
      [ref3]: https://wetten.overheid.nl/BWBR0039990
