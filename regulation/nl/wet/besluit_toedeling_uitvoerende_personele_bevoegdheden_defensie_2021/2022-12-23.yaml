  - number: 3a
    text: |-
      De Hoofddirecteur Personeel van het Directoraat-Generaal Beleid is bevoegd de [bijlagen A tot en met G][ref1] en
      [1 tot en met 7][ref2] van deze regeling te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0039990
      [ref2]: https://wetten.overheid.nl/BWBR0039990
