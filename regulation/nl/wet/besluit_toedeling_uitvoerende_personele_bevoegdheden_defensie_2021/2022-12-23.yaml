  - number: '4'
    text: >-
      De Secretaris-Generaal en de Commandant der Strijdkrachten zijn bevoegd om aanwijzingen te geven over de wijze
      waarop een door hen in ondermandaat verleende uitvoerende personele bevoegdheid wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel4
  - number: '5'
    text: |-
      Ondermandaat van de bevoegdheden is enkel toegestaan voor zover dit volgt uit de bijlagen genoemd in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039990#Artikel3
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039990
        artikel: '3'
  - number: '6'
    text: >-
      De gemandateerde maakt geen gebruik van het aan hem verleende mandaat in de gevallen waarin hij van mening is dat
      het naasthogere niveau een beslissing dient te nemen of een document dient te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel6
  - number: '7'
    text: >-
      1 Besluiten over bezwaarschriften neemt de geattribueerde functionaris dan wel de gemandateerde één niveau hoger
      dan de gemandateerde die het besluit in eerste aanleg heeft genomen, of een daartoe aangewezen autoriteit.


      2 Aan de Secretaris-Generaal wordt mandaat verleend met betrekking tot het beslissen op bezwaarschriften gericht
      tegen besluiten die:


      a. namens een bewindspersoon zijn genomen en die bestuursrechtelijk niet op een tussenliggend niveau kunnen worden
      afgedaan;


      b. namens een bewindspersoon door de Commandant der Strijdkrachten zijn genomen.


      3 Aan het hoofd van het Ondersteuningscentrum van het DienstenCentrum Human Resources wordt mandaat verleend met
      betrekking tot het beslissen op bezwaarschriften die zich richten tegen automatisch gegenereerde besluiten die tot
      uitdrukking komen op de loonstrook.


      4 In beschikkingen dient de mogelijkheid van het maken van bezwaar als volgt te worden vermeld:


      *Als u het niet eens bent met het besluit, kunt u binnen 6 weken na bekendmaking van het besluit (binnen 13 weken
      als u zich om dienstredenen in het buitenland bevindt) bij mij bezwaar maken. U kunt dit online doen via*
      *www.defensie.nl/bezwaarJDV* *of schriftelijk via Divisie Personeel & Organisatie Defensie (DPOD), DienstenCentrum
      Juridische Dienstverlening (DC JDV), MPC 55A, Postbus 90004, 3509 AA Utrecht. Voorzie het bezwaarschrift in
      ieder geval van: uw naam en adres, een omschrijving van het besluit waartegen u bezwaar maakt, de gronden van
      het bezwaar en een datum en handtekening. Het is wenselijk om een afschrift van het besluit mee te sturen met het
      bezwaarschrift.*


      5 Aan Directeur Juridische Dienstverlening wordt mandaat dan wel machtiging verleend om namens de functionaris die
      bevoegd is tot het beslissen op het bezwaar over te gaan tot:


      a. het opschorten van de termijn waarbinnen moet worden beslist;


      b. het verdagen van de beslissing;


      c. het verlenen van verder uitstel van de beslissing;


      d. het niet-ontvankelijk verklaren van een bezwaar;


      e. het al dan niet instemmen met rechtstreeks beroep bij de bestuursrechter;


      f. het voeren van correspondentie en vertegenwoordigen van Defensie in (hoger) beroepszaken;


      g. het vergoeden van proceskosten en in voorkomend geval griffierecht;


      h. het nemen van een dwangsombesluit.


      6 De machtiging, bedoeld in het vijfde lid, onderdelen a tot en met c, mag door de Directeur Juridische
      Dienstverlening in ondermachtiging worden gegeven aan het Hoofd Bedrijfsbureau Juridische Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel7
  - number: '8'
    text: >-
      De gemandateerde oefent een aan hem gemandateerde bevoegdheid niet uit in die gevallen, waarin hij die bevoegdheid
      jegens zichzelf zou moeten uitoefenen. In dat geval wordt de bevoegdheid uitgeoefend door het naasthogere niveau.
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel8
  - number: '9'
    text: >-
      De gemandateerde is gehouden het mandaat in de te nemen beschikking tot uitdrukking te laten komen door opneming
      van het volgende ondertekeningsblok:


      Mandaatgever (geattribueerde)


      voor deze


      Functie van de betrokken gemandateerde


      Handtekening


      Naam van de gemandateerde
    url: https://wetten.overheid.nl/BWBR0039990/2022-12-23#Artikel9
  - number: '10'
    text: |-
      Met dit mandaatbesluit zijn de mandaatbesluiten genoemd in [bijlage H][ref1] vervallen, evenals de Regeling
      aanwijzing commandanten defensie en [Mandaatbesluit Personele Bevoegdheden Defensie 2016][ref2].


