articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      - *bewindspersoon:* de minister of de staatssecretaris van Defensie;
      - *het Kerndepartement:* de Bestuursstaf;
      - *de Secretaris-Generaal:* de Secretaris-Generaal van het Ministerie van Defensie of degene die door de
      Secretaris-Generaal schriftelijk is aangewezen als waarnemer;
      - *de commandant operationeel commando:* de functionaris bedoeld in
      [artikel 1, eerste lid onderdeel h, van het Algemeen militair ambtenarenreglement][ref1] namelijk de Commandant
      Zeestrijdkrachten, de Commandant Landstrijdkrachten, de Commandant Luchtstrijdkrachten, de Commandant Koninklijke
      Marechaussee, voor het desbetreffende commando;
      - *het hoofd defensieonderdeel:* de functionaris bedoeld in
      [artikel 3, eerste lid onderdeel b van het Burgerlijk ambtenarenreglement Defensie][ref2] namelijk: 1° de
      Secretaris-Generaal, voor zover het betreft het Kerndepartement; 2° de commandant operationeel commando voor het
      desbetreffende commando; 3° de directeur van de Defensie Materieel Organisatie, voor zover het betreft de Defensie
      Materieel Organisatie; 4° de commandant van het Defensie Ondersteuningscommando, voor zover het betreft het
      Defensie Ondersteuningscommando;
      - *beschikking:* een besluit dat niet van algemene strekking is, met inbegrip van de afwijzing van een aanvraag
      daarvan;
      - *uitvoerende personele bevoegdheid:* de bevoegdheid op grond waarvan een beschikking over een rechtspositionele
      aangelegenheid kan worden genomen;
      - *attributie:* het bij wettelijk voorschrift in het leven roepen en toedelen van een publiekrechtelijke
      bevoegdheid;
      - *mandaat:* de bevoegdheid om in naam van een geattribueerde functionaris besluiten te nemen;
      - *mandaatgever:* de functionaris die een aan hem geattribueerde bevoegdheid mandateert;
      - *gemandateerde:* de functionaris aan wie een bevoegdheid is gemandateerd;
      - *geplaatst op/bij:* het als gevolg van het toewijzen of opdragen van een andere functie deel uitmaken van een
      bepaalde eenheid onder de verantwoordelijkheid van een van de defensieonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel3
