  - number: '2'
    text: |-
      1 Voor de uitvoering van het [Algemeen militair ambtenarenreglement][ref1], het
      [Burgerlijk ambtenarenreglement Defensie][ref2], het [Besluit dienstreizen Defensie][ref3], het
      [Inkomstenbesluit militairen](onbekend), het [Inkomstenbesluit burgerlijke ambtenaren Defensie][ref4], het
      [Verplaatsingskostenbesluit Defensie][ref5] en de ter uitvoering hiervan vastgestelde ministeriële regelingen
      en beleidsregels wordt onder commandant verstaan de commandant in de [bijlagen A tot en met G][ref6] bij deze
      regeling, ieder voor de militairen en ambtenaren van zijn bevoegdhedenressort.

      2 In aanvulling op het eerste lid geldt het volgende:

      a. de Secretaris-Generaal is de commandant van de Commandant Koninklijke Marechaussee;

      b. de Commandant der Strijdkrachten is de commandant van de Commandant Zeestrijdkrachten, de Commandant
      Landstrijdkrachten, de Commandant Luchtstrijdkrachten, de directeur van de Defensie Materieel Organisatie en de
      commandant van het Defensie Ondersteuningscommando.

      c. de Commandant van het dienstencentrum Internationale Ondersteuning is de commandant van:

      1° defensiepersoneel geplaatst op een arbeidsplaats behorend tot het strategisch functiebestand internationale
      militaire samenwerking;

      2° defensiepersoneel geplaatst op een arbeidsplaats behorende tot de Homogene Groep Internationale Samenwerking;

      3° defensiepersoneel, niet genoemd in de onderdelen a en b, dat voor meer dan 30 dagen in het buitenland werkzaam
      is voor zover tussen het defensieonderdeel en de Commandant van het dienstencentrum Internationale Ondersteuning
      Defensie is overeengekomen dat het administratief commando wordt uitgevoerd door dienstencentrum Internationale
      Ondersteuning Defensie;

      d. De Commandant der Zeemacht in het Caribisch gebied is de commandant van het defensiepersoneel geplaatst in
      Aruba, Curaçao, Sint Maarten, Bonaire, Sint Eustatius en Saba met uitzondering van defensiepersoneel geplaatst bij
      het Landelijk Tactisch Commando van de Koninklijke Marechaussee.

      3 Commandant is tevens de functionaris die is geplaatst op een arbeidsplaats waaraan leidinggevende bevoegdheden
      zijn verbonden die zelfstandig in het personeelsinformatie-systeem worden uitgeoefend.


