  - number: '98'
    text: |-
      Ingeval niet-nakoming van een verplichting, als bedoeld in [artikel 88, onder 2°, sub ][ref1], tevens een
      economisch delict oplevert, beslist de officier van justitie, na overleg met de keuringsinstelling, of de
      overtreding al dan niet tuchtrechtelijk door de keuringsinstelling zal worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel88
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '88'
        hoofdstuk: VI
        afdeling: II
  - number: '99.1'
    text: |-
      De inhoud van het Centraal Rassenregister, bedoeld in artikel 2 van het Kwekersbesluit 1941, zoals dit register
      op het tijdstip van inwerkingtreding van deze wet luidt, wordt met ingang van dat tijdstip ambtshalve overgenomen
      in het Nederlands Rassenregister. De door inschrijving in het Centraal Rassenregister verkregen en ten tijde
      van het inwerkingtreden van deze wet nog lopende kwekersrechten blijven van kracht, met dien verstande, dat deze
      kwekersrechten, in afwijking van het bepaalde in [artikel 37, derde lid][ref1], als dagtekening verkrijgen de
      datum van inschrijving van het ras in het Centraal Rassenregister, en dat in afwijking van het bepaalde krachtens
      [artikel 51][ref2] de duur van deze kwekersrechten vijfentwintig jaren bedraagt, en voor rozen zeventien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel51
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '37'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '51'
        hoofdstuk: IV
        afdeling: V
  - number: '99.2'
    text: |-
      Voor rassen, waarop ten tijde van het inwerkingtreden van deze wet het bepaalde in artikel 7, tweede lid onder
      2*e*, of 46, van het Kwekersbesluit 1941 van toepassing was, blijven in afwijking van het bepaalde bij of krachtens
      deze wet, de artikelen 7, tweede lid onder 2*e*, 40-44 en 46 van het Kwekersbesluit 1941 van toepassing tot 1 juli
      van het jaar volgende op dat, waarin deze wet in werking treedt of zoveel langer als bij algemene maatregel van
      bestuur zal worden bepaald. Onze Minister draagt er zorg voor, dat op het moment, waarop de voornoemde artikelen
      van het Kwekersbesluit 1941 voor enig aardappelras, dat op het tijdstip van inwerkingtreding van deze wet reeds
      vijf jaar of langer in het Centraal Rassenregister staat ingeschreven, buiten werking treden, voor de verdere duur
      van het kwekersrecht met betrekking tot dat ras licenties van kracht worden ingevolge een openbaar aanbod, gedaan
      op de wijze als voorzien in [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel45
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '45'
        hoofdstuk: IV
        afdeling: III
  - number: '99.3'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet krachtens artikel 31 van het Kwekersbesluit 1941 ingestelde
      rassenlijsten worden met ingang van dat tijdstip geacht te zijn rassenlijsten in de zin van [artikel 73][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel73
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '73'
        hoofdstuk: V
  - number: '99.4'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij de in artikel 6 van het Kwekersbesluit 1941 bedoelde Raad
      voor het kwekersrecht aanhangige aanvragen en verzoeken, zijn met ingang van dat tijdstip van rechtswege aanhangig
      bij de Raad in de staat, waarin zij zich alsdan bevinden, met dien verstande, dat:
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: 99.4.a
    text: |-
      een aanvraag ter inschrijving in het Centraal Rassenregister beschouwd wordt als een aanvraag tot verlening van
      kwekersrecht, en
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: 99.4.b
    text: |-
      een aanvraag, die betrekking had op een ras, als bedoeld in [artikel 18, tweede lid][ref1], beschouwd wordt als een
      aanvrage tot inschrijving van het ras in het Nederlands Rassenregister, en


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: 99.4.c
    text: |-
      een verzoek tot overschrijving van een inschrijving in het Centraal Rassenregister geldt als een opeising van het
      kwekersrecht in de zin van [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel55
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '55'
        hoofdstuk: IV
        afdeling: V
  - number: '99.5'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij de Raad van Beroep voor het kwekersrecht, bedoeld in
      artikel 23 van het Kwekersbesluit 1941 aanhangige zaken zijn met ingang van dat tijdstip van rechtswege aanhangig
      bij de Afdeling van Beroep in de staat, waarin zij zich alsdan bevinden. De Raad draagt zorg voor de nodige
      aantekeningen in het Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: '99.6'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet ingevolge de artikelen 23, 24 of 28 van het Kwekersbesluit
      1941 bij de Raad van Beroep, het Gerechtshof te 's-Gravenhage of de Hoge Raad aanhangige zaken worden behandeld en
      beslist overeenkomstig de bepalingen van het Kwekersbesluit 1941.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: '99.7'
    text: |-
      Ten aanzien van rassen, welke ten tijde van het inwerkingtreden van deze wet op een rassenlijst staan, blijft het
      bepaalde in [artikel 81, eerste lid][ref1], buiten toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel81
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '81'
        hoofdstuk: VI
        afdeling: I
  - number: 99.7.a
    text: |-
      indien op dat tijdstip met betrekking tot het ras een aanvraag, als in het vierde lid, onder *a* of *b* bedoeld,
      aanhangig is, totdat de Raad op de aanvraag heeft beslist;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: 99.7.b
    text: |-
      totdat een maand na het inwerkingtreden van deze wet is verstreken, of indien binnen die maand alsnog een aanvraag
      ter verlening van kwekersrecht of inschrijving in het Nederlands Rassenregister, als bedoeld in artikel l8, tweede
      lid, is ingediend, totdat de Raad op die aanvraag heeft beslist.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel99
  - number: '101.1'
    text: 'De volgende bezettingsregelingen vervallen:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: 101.1.a
    text: het Kwekersbesluit 1941, *Verordeningenblad* 1942, 8;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: 101.1.b
    text: |-
      de beschikking van de secretaris-generaal van het Departement van Landbouw en Visserij van 24 juni 1942 betreffende
      de inwerkingtreding van het Kwekersbesluit 1941, *Staatscourant* 1942, 120;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: 101.1.c
    text: |-
      het [Reglement van de Raad voor het Kwekersrecht][ref1], *Staatscourant* 1942, 120.


      [ref1]: https://wetten.overheid.nl/BWBR0002569
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002569
  - number: '101.2'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: 101.2.a
    text: de Keuringswet tuinbouwzaden en -plantgoed;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: 101.2.b
    text: de Wet van 31 december 1920, *Stb.* 957.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel101
  - number: '102.1'
    text: Deze Wet kan worden aangehaald als Zaaizaad- en Plantgoedwet.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel102
  - number: '102.2'
    text: Zij treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel102
