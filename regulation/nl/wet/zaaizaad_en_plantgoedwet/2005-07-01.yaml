---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zaaizaad_en_plantgoedwet
regulatory_layer: WET
publication_date: '2005-01-27'
valid_from: '2005-07-01'
bwb_id: BWBR0002541
url: https://wetten.overheid.nl/BWBR0002541/2005-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling van het kwekersrecht, alsmede van
    het verkeer met teeltmateriaal van landbouw- en tuinbouwgewassen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: "Onze Minister": Onze Minister van Landbouw en Visserij; "de Raad": De Raad voor het
      Kwekersrecht, genoemd in [artikel 5][ref1]; "Unie": Unie tot bescherming van kweekprodukten, gevormd door de staten
      die partij zijn bij het Internationaal Verdrag tot bescherming van kweekprodukten, gesloten te Parijs op 2 december
      1961. "Unie-Staat": een Staat, welke deel uitmaakt van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel5
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '5'
        hoofdstuk: II
  - number: '2'
    text: |-
      Deze wet verstaat onder: ras: een plantengroep binnen één botanisch taxon van de laagst bekende rang, welke groep,
      ongeacht of volledig wordt voldaan aan de voorwaarden welke deze wet stelt voor de verlening van een kwekersrecht,
      kan worden - gedefinieerd aan de hand van de expressie van de eigenschappen die het resultaat is van een bepaald
      genotype of een combinatie van genotypen;
        - onderscheiden van elke andere plantengroep op grond van de expressie van tenminste één van die eigenschappen en
        - beschouwd als een eenheid, gezien zijn geschiktheid om onveranderd te worden vermeerderd; "teeltmateriaal":
      planten en plantedelen, welke bestemd zijn om door middel van uitplant, uitzaai of op andere wijze voor de teelt
      van gewassen te dienen; "verhandelen": te koop aanbieden, verkopen en afleveren; "in het verkeer brengen": voor de
      eerste maal verhandelen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel2
  - number: '3.1'
    text: 'Waar in deze wet wordt gesproken van landbouwgewassen, worden daaronder mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.1.a
    text: |-
      blauwmaanzaad (Papaver somniferum L.), gele mosterd (Sinapis alba L.), karwij (Carum carvi L.) en witte klaver
      (Trifolium repens L.);
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.1.b
    text: |-
      de rassen van *erwt* (Pisum Sativum L.), *mais* (Zea mays L.), *raap* (Brassica campestris L. var. rapa (L.)
      Hartm.), *ramenas* (Raphanus sativus L. var. niger (Mill.) Pers.), *stamboon* (Phaseolus vulgaris L.) en *wortel*
      (Daucus carota L.), welke niet ingevolge het tweede lid onder de tuinbouwgewassen worden begrepen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: '3.2'
    text: 'Waar in deze wet wordt gesproken van tuinbouwgewassen worden daaronder mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.2.a
    text: |-
      van erwt de rassen, welke in aanmerking komen om uitsluitend of overwegend te worden geteeld om vers te worden
      geoogst voor menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.2.b
    text: van mais de rassen van pofmais en suikermais;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.2.c
    text: |-
      van raap en ramenas de rassen, welke in aanmerking komen om uitsluitend of overwegend te worden geteeld voor
      menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.2.d
    text: |-
      van stamboon de rassen, welke in aanmerking komen om uitsluitend of overwegend te worden geteeld om vers te worden
      geoogst;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.2.e
    text: van wortel de rassen van rode wortel.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: '3.3'
    text: 'Voorts worden onder de tuinbouwgewassen begrepen:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.3.a
    text: |-
      de rassen van landbouwgewassen, welke in aanmerking komen om uitsluitend of overwegend voor sierdoeleinden te
      worden geteeld;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: 3.3.b
    text: de bosbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: '3.4'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van andere dan in de vorige leden genoemde cultuurgewassen,
      rassen of groepen van rassen worden bepaald, dat zij voor de toepassing van deze wet als landbouwgewas dan wel als
      tuinbouwgewas worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel3
  - number: '4.1'
    text: |-
      Er is een register, dat bestemd is voor de inschrijving van groepen van planten, waarvan is vastgesteld, dat het
      rassen zijn. Het register is openbaar en draagt de naam van Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel4
  - number: '4.2'
    text: De inrichting van het Nederlands Rassenregister wordt bij of krachtens algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel4
  - number: '5.1'
    text: 'Er is een Raad voor het Kwekersrecht bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: 5.1.a
    text: een Centrale Afdeling;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: 5.1.b
    text: een Afdeling Landbouwgewassen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: 5.1.c
    text: een Afdeling Tuinbouwgewassen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: 5.1.d
    text: een Afdeling van Beroep.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: '5.2'
    text: Bij algemene maatregel van bestuur kunnen bij de afdelingen onderafdelingen worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel5
  - number: '6.1'
    text: 'In de Raad hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel6
  - number: 6.1.a
    text: een voorzitter;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel6
  - number: 6.1.b
    text: drie vice-voorzitters;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel6
  - number: 6.1.c
    text: tenminste drie en ten hoogste zeven leden voor iedere afdeling of onderafdeling.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel6
  - number: '6.2'
    text: Aan de Raad worden een secretaris en een of meer adjunct-secretarissen toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel6
  - number: '7.1'
    text: |-
      Wij benoemen de voorzitter, de vice-voorzitters en de overige leden van de Raad. De benoeming geschiedt voor een
      tijd van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel7
  - number: '7.2'
    text: |-
      De in het vorige lid bedoelde personen zijn bij hun aftreden weder benoembaar. Zij kunnen op eigen verzoek door Ons
      worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel7
  - number: '7.3'
    text: |-
      Alvorens hun ambt te aanvaarden wordt de voorzitter door Onze Minister en worden de vice-voorzitters en overige
      leden door de voorzitter beëdigd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel7
  - number: '7.4'
    text: |-
      Bij het bereiken van de ouderdom van zeventig jaren wordt aan de voorzitter, de vice-voorzitters en de overige
      leden ontslag verleend met ingang van de eerstvolgende maand.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel7
  - number: '8.1'
    text: |-
      Echtgenoten of geregistreerde partners, bloed- en aanverwanten tot de derde graad ingesloten kunnen niet tezamen
      zitting hebben in dezelfde afdeling, tenzij deze in onderafdelingen is ingedeeld; in het laatste geval kunnen zij
      niet tezamen zitting hebben in dezelfde onderafdeling.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien het huwelijk of het geregistreerd partnerschap onderscheidenlijk de zwagerschap eerst mocht zijn aangegaan
      onderscheidenlijk ontstaan na de benoeming, kan de jongst benoemde, behoudens verlof van Onze Minister, niet langer
      in de afdeling of in de onderafdeling zitting houden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel8
  - number: '8.3'
    text: |-
      De zwagerschap houdt op door de ontbinding van het huwelijk of het geregistreerd partnerschap, dat haar
      veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel8
  - number: '8.4'
    text: |-
      De leden, die in eerste aanleg in een zaak zitting hebben gehad, mogen niet deelnemen aan de behandeling daarvan in
      de Afdeling van Beroep.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel8
  - number: '9.1'
    text: De secretaris en adjunct-secretarissen worden benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
  - number: '9.2'
    text: 'Voor benoeming komt in aanmerking degene:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
  - number: 9.2.a
    text: |-
      aan wie door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 9.2.b
    text: |-
      die aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het doctoraat in de
      rechtsgeleerdheid of het recht om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '9.3'
    text: |-
      De graden, het doctoraat of het recht, bedoeld in het tweede lid, moeten zijn verkregen op grond van het
      afleggen van een examen aan een opleiding in het wetenschappelijk onderwijs in het Nederlands burgerlijk recht,
      handelsrecht, staatsrecht en strafrecht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
  - number: 9.3a
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het tweede lid, onderdeel a,
      gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht. In die algemene
      maatregel van bestuur kan tevens worden bepaald dat van de exameneisen ten aanzien van bepaalde rechtsgebieden,
      genoemd in het derde lid, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '10.1'
    text: |-
      Onverminderd hetgeen elders is bepaald, worden de voorzitter, vice-voorzitters en de overige leden door Ons
      ontslagen:
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: 10.1.a
    text: bij gebleken ongeschiktheid door ouderdom, door aanhoudende lichaamsziekte of tengevolge van zielsziekte;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: 10.1.b
    text: wanneer zij onder curatele zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: '10.2'
    text: 'Onverminderd hetgeen elders is bepaald, kunnen de in het vorige lid bedoelde personen door Ons worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: 10.2.a
    text: |-
      bij overtreding van de [artikelen 11][ref1] en [12][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel12
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '12'
        hoofdstuk: II
  - number: 10.2.b
    text: |-
      wanneer zij in staat van faillissement zijn verklaard, ten aanzien van hen de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zij surséance van betaling hebben verkregen of wegens schulden gegijzeld
      zijn.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: '10.3'
    text: |-
      Alvorens het ontslag op grond van het in het vorige lid bepaalde wordt verleend, wordt de betrokkene gehoord,
      althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
  - number: '10.4'
    text: |-
      Wanneer zich een der omstandigheden voordoet, als bedoeld in het tweede lid, is Onze Minister bevoegd de
      betrokkene in de uitoefening van zijn ambt terstond te schorsen; de schorsing mag een termijn van drie maanden niet
      overschrijden. Op deze termijn is de [Algemene termijnenwet][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '11'
    text: |-
      De voorzitter, vice-voorzitters, leden, secretaris en adjunct-secretarissen zijn verplicht het geheim te bewaren
      omtrent hetgeen hun in die hoedanigheid bekend wordt alsmede omtrent de gevoelens bij de behandeling ener zaak
      geuit.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel11
  - number: '12'
    text: |-
      De in het vorige artikel bedoelde personen mogen niet deelnemen aan de behandeling van zaken, waarbij zij in enig
      opzicht betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister stelt regelen vast voor de vergoeding van reis- en verblijfkosten en voor de uitkering van een
      vacatiegeld aan de voorzitter, de vice-voorzitters en de leden. Aan de voorzitter en de vice-voorzitters kan Onze
      Minister in plaats van een vacatiegeld een vaste jaarlijkse vergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel13
  - number: '14.1'
    text: De Raad is bevoegd getuigen en deskundigen te horen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
  - number: '14.2'
    text: Ieder, die als getuige is opgeroepen, is verplicht aan deze oproep gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
  - number: '14.3'
    text: |-
      De [artikelen 164][ref1] en [165 van het Wetboek van Burgerlijke Rechtsvordering][ref2] vinden ten aanzien van de
      getuigen overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '14.4'
    text: |-
      De Raad kan bevelen, dat getuigen, die hoewel behoorlijk opgeroepen niet zijn verschenen, door de openbare macht
      voor hem worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
  - number: '14.5'
    text: |-
      Het bepaalde in de [artikelen 171 tot en met 173][ref1], [177][ref2] en
      [179 van het Wetboek van Burgerlijke Rechtsvordering][ref3] is ten aanzien van het getuigenverhoor van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel179
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '177'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '179'
  - number: '14.6'
    text: |-
      De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten. De Raad kan hun de
      verplichting tot geheimhouding opleggen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel14
  - number: '15.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      samenstelling en de werkwijze van de Raad en de beëdiging van de leden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel15
  - number: '15.2'
    text: 'Hierbij worden onder meer geregeld:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel15
  - number: 15.2.a
    text: |-
      de wijze van samenstelling en de bevoegdheden van de afdelingen en onderafdelingen om werkzaamheden te verrichten
      aan de Raad opgedragen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel15
  - number: 15.2.b
    text: de oproeping van aanvragers, verzoekers en andere belanghebbenden en van getuigen en deskundigen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel15
  - number: 15.2.c
    text: de aan getuigen en deskundigen toe te kennen geldelijke vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister stelt een tarief vast voor de verrichtingen van de Raad met betrekking tot de inschrijvingen en
      aantekeningen in en de afgifte van afschriften en uittreksels uit het Nederlands Rassenregister, alsmede voor het
      uitbrengen van adviezen als bedoeld in [artikel 41, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel41
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '41'
        hoofdstuk: IV
        afdeling: III
  - number: '16.2'
    text: |-
      De Raad neemt geen stukken in behandeling en verstrekt geen afschriften en uittreksels uit het Nederlands
      Rassenregister, zolang niet het ingevolge het vorige lid verschuldigde bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel16
  - number: '17'
    text: Alle stukken gericht tot en uitgaande van de Raad zijn vrij van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel17
  - number: '18.1'
    text: 'In het Nederlands Rassenregister worden ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
  - number: 18.1.a
    text: rassen, waarvoor kwekersrecht is verleend;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
  - number: 18.1.b
    text: |-
      door of namens Onze Minister aangewezen rassen van landbouwgewassen en van bij algemene maatregel van bestuur
      aangewezen tuinbouwgewassen, welke voldoen aan de in [artikel 29, eerste lid, onder ][ref1] gestelde eisen, doch
      waarvoor geen kwekersrecht kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: '18.2'
    text: |-
      In het Nederlands Rassenregister worden met inachtneming van bij algemene maatregel van bestuur te stellen
      regelen op aanvrage van de kweker ingeschreven andere dan in het eerste lid, onder *b*, bedoelde rassen,
      waarvoor geen kwekersrecht kan worden verleend en welke behoren tot bij algemene maatregel van bestuur aangewezen
      landbouwgewassen. Deze regelen kunnen mede inhouden de verplichting voor de kweker tot het betalen van een daarbij
      vast te stellen jaarcijns.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
  - number: '18.3'
    text: |-
      De inschrijving geschiedt door de Raad door vermelding van de door de Raad vastgestelde karakteriserende
      beschrijving en benaming van het ras.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
  - number: '18.4'
    text: De ingeschreven benaming wordt aangemerkt als soortaanduiding.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel18
  - number: '19.1'
    text: |-
      De benaming moet geschikt zijn om het ras waarvoor zij wordt gebezigd, te identificeren. Zij mag met name niet
      uitsluitend uit cijfers bestaan, tenzij dit een gevestigd gebruik is voor de aanduiding van rassen van het
      betreffende gewas, en mag voorts niet zodanig zijn, dat zij tot vergissing aanleiding kan geven of verwarring zou
      kunnen stichten omtrent de karakteriserende eigenschappen, de waarde of de identiteit van het ras of omtrent de
      identiteit van de kweker. Zij moet in het bijzonder verschillen van iedere benaming, die in enige Unie-Staat een
      reeds bestaand ras van hetzelfde of van een verwant cultuurgewas aanduidt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel19
  - number: '19.2'
    text: De benaming mag voorts niet in strijd zijn met de openbare orde of de goede zeden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel19
  - number: '19.3'
    text: |-
      De benaming moet gelijk zijn aan die, welke reeds in enige Unie-Staat voor het ras is ingeschreven, mits deze voor
      gebruik hier te lande geschikt is.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel19
  - number: '19.4'
    text: |-
      Geen benaming wordt vastgesteld waarvan de Raad blijkt, dat deze zodanig met een handelsnaam of merk overeenstemt,
      dat uit het gebruik daarvan verwarring omtrent de aard of herkomst van waren is te duchten.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel19
  - number: '20.1'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling van de benaming van het ras als bedoeld in
      [artikel 18, derde lid][ref1], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '20.2'
    text: |-
      Het Bureau voor de Industriële Eigendom is verplicht aan de Raad desgevraagd inlichtingen te verstrekken omtrent
      bij hem ingeschreven merken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel20
  - number: '21.1'
    text: |-
      Bij de aanvrage tot verlening van kwekersrecht en bij de aanvrage als bedoeld in [artikel 18, tweede lid][ref1],
      doet de aanvrager een voorstel voor de benaming van het ras.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '21.2'
    text: |-
      Hij kan ook volstaan met een voorlopige aanduiding. In dat geval is hij verplicht op een nader door de Raad te
      bepalen tijdstip een voorstel voor de benaming te doen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel21
  - number: '21.3'
    text: |-
      Het voorstel voor de benaming gaat vergezeld van een akte, inhoudende, dat de aanvrager, ingeval de voorgestelde
      benaming wordt ingeschreven, afstand doet van de rechten, welke hem in enige Unie-Staat met betrekking tot deze
      benaming voor gelijke of gelijksoortige waren mochten toekomen. Van deze akte zendt de Raad afschrift aan het
      Bureau van de Industriële Eigendom en aan het Bureau van de Unie, zodra de inschrijving van de benaming heeft
      plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel21
  - number: '21.4'
    text: |-
      De Raad stelt de voorgestelde benaming of de in [artikel 19, derde lid][ref1], bedoelde benaming vast, tenzij hij
      van oordeel is dat [artikel 19][ref2] zich daartegen verzet. In dat geval stelt hij de aanvrager in de gelegenheid
      een andere benaming voor te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel19
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '19'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '19'
        hoofdstuk: III
  - number: '22.1'
    text: De Raad kan ook een voorlopige karakteriserende beschrijving vaststellen en inschrijven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel22
  - number: '22.2'
    text: 'De Raad kan de beschrijving aanvullen en schrijft deze aanvulling in:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel22
  - number: 22.2.a
    text: op verzoek van de rechthebbende;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel22
  - number: 22.2.b
    text: |-
      ambtshalve, indien dit in verband met de beschrijving van een ander ras noodzakelijk is, in welk geval de
      rechthebbende wordt gehoord, of om andere redenen, doch dan alleen in overeenstemming met de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel22
  - number: '22.3'
    text: |-
      Onder rechthebbende in het tweede lid wordt verstaan de houder van het kwekersrecht, onderscheidenlijk de kweker
      van een in [artikel 18, tweede lid][ref1], bedoeld ras.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '23.1'
    text: |-
      Indien het gebruik van een ingeschreven benaming voor teeltmateriaal van het ras, waarvoor deze is ingeschreven,
      op grond van een aan een ander met betrekking tot deze benaming toekomend recht bij rechterlijke uitspraak wordt
      verboden, haalt de voorzitter van de Raad op verzoek van de meest gerede partij de ingeschreven benaming door en
      schrijft hij een voorlopige aanduiding als benaming in, zo mogelijk in overleg met de houder van het kwekersrecht,
      onderscheidenlijk met de kweker van een in [artikel 18, tweede lid][ref1], bedoeld ras.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '23.2'
    text: |-
      De Raad stelt een gewijzigde benaming vast, na de houder van het kwekersrecht onderscheidenlijk de kweker van een
      in [artikel 18, tweede lid][ref1], bedoeld ras in de gelegenheid te hebben gesteld binnen een daarbij te bepalen
      termijn een andere benaming voor te stellen en schrijft de gewijzigde benaming in.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '23.3'
    text: |-
      Indien komt vast te staan dat een ras niet onder de ingeschreven benaming kan worden opgenomen op een door de
      Europese Gemeenschap voor het gewas, waartoe het ras behoort, ingestelde rassenlijst, kan de voorzitter van de
      Raad op een daartoe strekkend verzoek van de houder van het kwekersrecht een ingeschreven benaming doorhalen en een
      voorlopige aanduiding als benaming inschrijven. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel23
  - number: '24.1'
    text: |-
      Van de in dit Hoofdstuk bedoelde aanvragen en verzoeken en van de intrekking en afwijzing van de aanvragen en
      verzoeken wordt aantekening gedaan in het Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel24
  - number: '24.2'
    text: |-
      In de *Nederlandse Staatscourant* wordt mededeling gedaan van de in dit Hoofdstuk bedoelde inschrijvingen en van
      de aantekeningen van de in [artikel 18, tweede lid][ref1], bedoelde aanvragen en van de intrekking en afwijzing van
      deze aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '26.1'
    text: |-
      Van de beslissingen van de Raad ingevolge dit hoofdstuk, met uitzondering van de beslissingen ingevolge
      [artikel 20][ref1] en [artikel 23, tweede lid][ref2], staat beroep open op de Afdeling van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel23
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '23'
        hoofdstuk: III
  - number: '26.2'
    text: |-
      Van de eindbeslissingen van de Raad ingevolge [artikel 20][ref1] en [artikel 23 tweede lid][ref2], staat beroep
      open op het gerechtshof te 's-Gravenhage, dat in raadkamer beslist. Van de instelling van het beroep en van de
      beslissing van het gerechtshof geeft de griffier binnen drie dagen kennis aan de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel23
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '23'
        hoofdstuk: III
  - number: '26.3'
    text: Het beroep kan worden ingesteld door degene aan wie de beslissing wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel26
  - number: '26.4'
    text: |-
      Het beroep, bedoeld in het tweede lid, kan binnen zes weken na de bekendmaking van de beslissing worden ingesteld
      door inzending van een met redenen omkleed verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel26
  - number: '27'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel27
  - number: 27.a
    text: de in dit Hoofdstuk bedoelde aanvragen en verzoeken;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel27
  - number: 27.b
    text: |-
      de bepaling van het tijdstip, waarop de onder *a* bedoelde aanvragen en verzoeken geacht worden bij de Raad te
      zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel27
  - number: 27.c
    text: |-
      het horen van belanghebbenden in gevallen waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '28'
    text: |-
      De in dit Hoofdstuk bedoelde inschrijvingen en aantekeningen krachtens beslissingen, waartegen beroep openstaat,
      geschieden, zodra op het beroep is beslist of de beroepstermijn verstreken is, zonder dat beroep is ingesteld, dan
      wel zodra van het beroep afstand is gedaan door een schriftelijke daartoe strekkende kennisgeving aan de Raad.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel28
  - number: '29.1'
    text: |-
      Voor nieuwe rassen van alle tot het plantenrijk behorende gewassen kan kwekersrecht worden verleend. Het
      kwekersrecht wordt verleend indien het ras:
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.1.a
    text: |-
      zich op het tijdstip van indiening van de aanvraag tot verlening van kwekersrecht duidelijk onderscheidt van elk
      ander ras, waarvan het bestaan op dat tijdstip algemeen bekend is;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.1.b
    text: |-
      wat zijn van belang zijnde eigenschappen betreft voldoende homogeen is, in aanmerking genomen de bijzonderheden,
      welke aan zijn vermeerdering eigen zijn;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.1.c
    text: |-
      bestendig is, in dier voege dat zijn van belang zijnde eigenschappen onveranderd blijven in de loop van zijn
      achtereenvolgende vermeerderingen, of in het geval van een bijzondere vermeerderingscyclus, aan het einde van
      iedere cyclus.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: '29.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *a*, worden in elk geval als algemeen bekend aangemerkt rassen
      waarvoor in enig land of in enige groep van landen een aanvraag tot verlening van kwekersrecht of tot inschrijving
      van dat ras in een officieel rassenregister is ingediend, vanaf de datum van de aanvraag, mits deze aanvraag leidt
      of heeft geleid tot verlening van kwekersrecht dan wel inschrijving in dat rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: '29.3'
    text: |-
      Een ras wordt niet als nieuw aangemerkt indien op het tijdstip van de indiening van de aanvraag tot verlening van
      het kwekersrecht, teeltmateriaal of geoogst materiaal van dat ras met toestemming van degene die het ras door eigen
      arbeid heeft gekweekt of die het heeft ontdekt en ontwikkeld of diens rechtverkrijgende, met het oog op exploitatie
      van het ras
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.3.a
    text: in Nederland reeds langer dan één jaar tevoren is verkocht of anderszins aan anderen ter beschikking is gesteld;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.3.b
    text: |-
      buiten Nederland reeds langer dan zes jaar tevoren is verkocht of anderszins aan anderen ter beschikking is
      gesteld, voor zover het een ras betreft dat behoort tot een gewas van bomen of wijnstokken;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: 29.3.c
    text: |-
      buiten Nederland reeds langer dan vier jaar tevoren is verkocht of anderszins aan anderen ter beschikking is
      gesteld, voor zover het een ras betreft dat behoort tot een ander dan de in [onderdeel][ref1] bedoelde gewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: '29.4'
    text: |-
      Het feit, dat materiaal van een ras reeds aan anderen ter beproeving is verstrekt, ter inschrijving is aangeboden
      of reeds is ingeschreven in een officieel register kan niet aan de kweker van dat ras of zijn rechtverkrijgende
      worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel29
  - number: '30.1'
    text: |-
      De aanspraak op verlening van kwekersrecht komt toe aan degene die een ras door eigen arbeid heeft gekweekt of
      heeft ontdekt en ontwikkeld dan wel diens rechtverkrijgende.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien het ras buiten Nederland hetzij door een natuurlijke persoon, die niet de Nederlandse nationaliteit bezit,
      hetzij door een rechtspersoon zonder zetel in Nederland, is gekweekt of ontdekt en ontwikkeld, bestaat gelijke
      aanspraak op verlening van kwekersrecht voor zover Nederland krachtens een internationale overeenkomst gehouden is
      kwekersrecht te verlenen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel30
  - number: '30.3'
    text: |-
      Indien een ras buiten Nederland is gekweekt of ontdekt en ontwikkeld, terwijl de in het tweede lid bedoelde
      gehoudenheid niet bestaat, kan voor het ras kwekersrecht worden verleend, indien Onze Minister van oordeel is, dat
      die verlening in het belang is van de bodemcultuur in Nederland. Onze Minister kan aan de verlening voorschriften
      verbinden en hij kan de aan de kweker ingevolge deze wet toekomende rechten in omvang beperken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel30
  - number: '31.1'
    text: |-
      Indien de persoon, bedoeld in [artikel 30, eerste lid][ref1], een ras heeft gekweekt of heeft ontdekt en ontwikkeld
      in het kader van een dienstbetrekking of in het kader van een overeenkomst tot het verrichten van diensten ten
      behoeve van een ander, anders dan tegen loon, welke dienstbetrekking of overeenkomst met zich meebrengt, dat hij
      kweek- of ontwikkelingsarbeid verricht met betrekking tot het gewas, waartoe dat ras behoort, komt de aanspraak op
      verlening van kwekersrecht toe aan de werkgever dan wel opdrachtgever dan wel de rechtverkrijgende van de werkgever
      of opdrachtgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel30
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '30'
        hoofdstuk: IV
        afdeling: I
  - number: '31.2'
    text: |-
      In het geval, bedoeld in het eerste lid, heeft degene die het ras heeft gekweekt of ontdekt en ontwikkeld,
      aanspraak op een vergoeding naar billijkheid, tenzij een zodanige vergoeding reeds geacht kan worden begrepen te
      zijn in het door hem genoten loon of in de door hem genoten voordelen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel31
  - number: '31.3'
    text: Elk beding, waarbij van het bepaalde in het tweede lid wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel31
  - number: '32'
    text: |-
      Indien twee of meer personen, anders dan in het geval bedoeld in [artikel 31][ref1], in samenwerking een nieuw ras
      hebben gekweekt dan wel ontdekt en ontwikkeld, hebben zij gezamenlijk aanspraak op verlening van kwekersrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel31
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '31'
        hoofdstuk: IV
        afdeling: I
  - number: '33'
    text: |-
      Indien ingevolge het bepaalde in [artikel 30][ref1] twee of meer personen onafhankelijk van elkaar aanspraak
      op verlening van kwekersrecht voor een zelfde nieuw ras zouden kunnen maken, komt de aanspraak op verlening van
      kwekersrecht toe aan hem, die het eerst een aanvrage daartoe heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel30
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '30'
        hoofdstuk: IV
        afdeling: I
  - number: '34.1'
    text: |-
      Hij, die in een andere Unie-Staat overeenkomstig de in die Staat geldende voorschriften een aanvraag tot verlening
      van kwekersrecht heeft ingediend, geniet, ter verkrijging van kwekersrecht in Nederland voor hetzelfde ras een
      recht van voorrang, mits hij:
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel34
  - number: 34.1.a
    text: |-
      binnen twaalf maanden na het indienen van de aanvraag in die Unie-Staat, de dag dier aanvrage daaronder niet
      begrepen, in Nederland een voorlopige aanvraag indient en daarbij schriftelijk een beroep doet op het recht van
      voorrang, en
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel34
  - number: 34.1.b
    text: |-
      binnen drie maanden na de indiening van de voorlopige aanvraag een door de bevoegde autoriteit in de Staat der
      eerste aanvraag gewaarmerkt afschrift van de aldaar door hem ingediende stukken overlegt, en
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel34
  - number: 34.1.c
    text: |-
      binnen twee jaren na afloop van de onder *a* genoemde termijn een volledige aanvraag, als bedoeld in
      [artikel 35][ref1], indient.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel35
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '35'
        hoofdstuk: IV
        afdeling: II
  - number: '34.2'
    text: |-
      De voorrang houdt in, dat in afwijking in zoverre van het bepaalde in de [artikelen 29][ref1] en [33][ref2] op de
      hier te lande door hem, wie de voorrang toekomt, gedane aanvraag niet van invloed is, hetgeen in de tijd, verlopen
      tussen de indiening van de aanvraag in het andere land en de voorlopige aanvraag in Nederland is geschied, en wel
      met name niet de indiening van een aanvraag door een ander of het in het verkeer brengen van teeltmateriaal van
      het ras.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel33
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '33'
        hoofdstuk: IV
        afdeling: I
  - number: '35.1'
    text: De aanvrage tot verlening van kwekersrecht wordt gericht tot en de verlening geschiedt door de Raad.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel35
  - number: '35.2'
    text: |-
      De aanvrage moet, naast hetgeen door [artikel 21][ref1] met betrekking tot de benaming wordt gevorderd, bevatten
      zowel een duidelijke beschrijving van het ras als een nauwkeurige aanduiding van de eigenschappen, waardoor het ras
      zich van andere rassen van hetzelfde cultuurgewas onderscheidt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel21
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '21'
        hoofdstuk: III
  - number: '35.3'
    text: |-
      Een voor het onderzoek voldoende hoeveelheid materiaal van het ras, waarop de aanvrage betrekking heeft, dient op
      vordering van de Raad en overeenkomstig nader door de Raad te stellen eisen aan de Raad ter beschikking te worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel35
  - number: '35.4'
    text: |-
      Indien een aanvrager geen woonplaats of zetel binnen het grondgebied van de Europese Gemeenschap heeft, is hij
      verplicht binnen Nederland domicilie te kiezen bij een gemachtigde, welke keuze voor de toepassing van deze wet
      wordt geacht van kracht te blijven, totdat schriftelijk aan de Raad is kennis gegeven van wijziging van het gekozen
      domicilie.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel35
  - number: '36'
    text: |-
      Van de aanvrage alsmede van de intrekking en de afwijzing van een aanvrage wordt aantekening gedaan in het
      Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel36
  - number: 36a.1
    text: |-
      De houder van een kwekersrecht kan een redelijke vergoeding vorderen van hem, die in de periode gelegen tussen de
      aanvrage van het kwekersrecht en de verlening van het kwekersrecht overeenkomstig [artikel 37][ref1], handelingen
      als bedoeld in [artikel 40][ref2] heeft verricht met betrekking tot het ras, waarvoor kwekersrecht is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel40
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '37'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
  - number: 36a.2
    text: |-
      De vergoeding is alleen verschuldigd voor handelingen die zijn verricht na afloop van dertig dagen, nadat de
      betrokkene bij deurwaardersexploit is gewezen op de krachtens dit artikel aan de houder van een kwekersrecht
      toekomende aanspraak.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel36a
  - number: 36a.3
    text: |-
      Bij het deurwaardersexploit wordt een door de Raad gewaarmerkt afschrift gevoegd van de ter zake van de aanvraag
      ingediende bescheiden dan wel van passages daaruit, voor zover zij uitsluitend betrekking hebben op de kenmerken
      van het ras waarvoor de aanvrage is ingediend en op de aanduiding van de eigenschappen waardoor het zich van
      andere rassen onderscheidt. Daartoe wordt niet gerekend de weergave van de totstandkoming van het ras of van de
      genealogische bestanddelen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel36a
  - number: 36a.4
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op handelingen verricht door diegene, die daartoe is
      gerechtigd krachtens een overeenkomst met degene aan wie overeenkomstig [artikel 30][ref1] of [31][ref2] de
      aanspraak op verlening van het kwekersrecht toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel31
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '30'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '31'
        hoofdstuk: IV
        afdeling: I
  - number: '37.1'
    text: |-
      Bij het besluit tot verlening van kwekersrecht worden overeenkomstig het bepaalde in de [artikelen 19][ref1],
      [20][ref2], [21][ref3] en [22, eerste lid][ref4], de karakteriserende beschrijving en de benaming van het ras
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002541#Artikel22
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '19'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '20'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '21'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002541
        artikel: '22'
        hoofdstuk: III
  - number: '37.2'
    text: |-
      Bij de inschrijving van het ras in het Nederlands Rassenregister wordt gelijktijdig aantekening gedaan van de
      verlening van het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel37
  - number: '37.3'
    text: |-
      Het kwekersrecht verkrijgt als dagtekening en begint te werken de dag, nadat de in het vorige lid bedoelde
      inschrijving en aantekening in het Nederlands Rassenregister zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel37
  - number: '38'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van groepen van cultuurgewassen worden bepaald, dat voor daartoe
      behorende rassen, waarvoor kwekersrecht is verleend, de houder van het kwekersrecht verplicht is tot betaling van
      een bij die algemene maatregel van bestuur vast te stellen jaarcijns.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel38
  - number: '39'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel39
  - number: 39.a
    text: de aanvragen tot verlening van kwekersrecht;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel39
  - number: 39.b
    text: |-
      de bepaling van het tijdstip, waarop de aanvragen tot verlening van kwekersrecht geacht worden bij de Raad te zijn
      ingediend;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel39
  - number: 39.c
    text: |-
      het horen van belanghebbenden in gevallen waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '40.1'
    text: |-
      De houder van een kwekersrecht op een ras heeft het uitsluitend recht teeltmateriaal van dat ras voort te brengen
      of verder te vermeerderen, ten behoeve van de vermeerdering te behandelen, in het verkeer te brengen, verder
      te verhandelen, uit te voeren, in te voeren, voor een van deze doeleinden in voorraad te hebben alsmede deze
      handelingen te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: '40.2'
    text: |-
      Het is aan anderen dan de houder van het kwekersrecht verboden de in het eerste lid genoemde handelingen te
      verrichten. Dit verbod geldt niet indien bij of krachtens deze wet of door de houder van het kwekersrecht daarvoor
      toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: '40.3'
    text: 'Het verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: 40.3.a
    text: handelingen die in de privésfeer en niet bedrijfsmatig zijn verricht;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: 40.3.b
    text: handelingen welke uitsluitend worden verricht voor wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: 40.3.c
    text: handelingen welke worden verricht voor het kweken van nieuwe rassen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: '40.4'
    text: |-
      Het uitsluitend recht is tevens van toepassing op handelingen met betrekking tot geoogst materiaal van het
      ras, planten en plantedelen daaronder begrepen, dat is verkregen door gebruik van teeltmateriaal waarvoor geen
      toestemming is verleend, tenzij de houder van het kwekersrecht redelijkerwijs zijn recht met betrekking tot het
      teeltmateriaal had kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: '40.5'
    text: |-
      Bij algemene maatregel van bestuur kan voor één of meer gewassen of rassen worden bepaald dat het uitsluitend
      recht tevens van toepassing is op handelingen met betrekking tot produkten die rechtstreeks zijn vervaardigd met
      gebruikmaking van geoogst materiaal van het ras waarvoor geen toestemming is verleend, tenzij de houder van het
      kwekersrecht redelijkerwijs zijn recht met betrekking tot het geoogst materiaal had kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel40
  - number: '41.1'
    text: |-
      Het in [artikel 40, eerste lid][ref1], bedoelde uitsluitend recht is tevens van toepassing op de in dat lid
      bedoelde handelingen met betrekking tot materiaal van


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel40
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
  - number: 41.1.a
    text: |-
      rassen, die zijn afgeleid van het in [artikel 40, eerste lid][ref1], bedoelde beschermde ras, tenzij het beschermde
      ras zelf is afgeleid van een ander ras;


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel40
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
  - number: 41.1.b
    text: |-
      rassen die ingevolge het bepaalde in [artikel 29][ref1] niet duidelijk onderscheidbaar zijn van het beschermde ras;


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: 41.1.c
    text: rassen waarvan voor de voortbrenging telkens gebruik moet worden gemaakt van het beschermde ras.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
  - number: '41.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *a*, wordt een ras beschouwd als afgeleid van een ander ras indien
      het hoofdzakelijk is afgeleid van het oorspronkelijke ras dan wel van een ras dat zelf hoofdzakelijk is afgeleid
      van het oorspronkelijke ras, met behoud van de expressie van de wezenlijke eigenschappen welke het resultaat zijn
      van een bepaald genotype of combinatie van genotypen van het oorspronkelijke ras.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
  - number: '41.3'
    text: |-
      Het eerste lid, onderdeel *a*, is niet van toepassing op rassen waarvan het bestaan op het tijdstip van
      inwerkingtreding van dit artikel algemeen bekend is.[ Artikel 29, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: '41.4'
    text: |-
      De Raad kan op verzoek adviseren omtrent hetzij de vraag of een ras, waarvoor door de Raad kwekersrecht is verleend
      afgeleid is van een ander ras waarvoor door de Raad kwekersrecht is verleend, hetzij de vraag of een ander, bij het
      verzoek aan te wijzen ras, is afgeleid van het ras waarvoor het kwekersrecht is verleend. Het advies van de Raad
      bevat de gronden waarop het rust.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41
  - number: 41a.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ten aanzien van een ras, behorende tot bij die algemene
      maatregel van bestuur aan te wijzen gewassen, het in [artikel 40][ref1] bedoelde uitsluitend recht niet van
      toepassing is op het gebruik voor vermeerderingsdoeleinden binnen het eigen bedrijf van een teler van door die
      teler geoogst materiaal van dat ras of een ras als bedoeld in [artikel 41, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel41
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '41'
        hoofdstuk: IV
        afdeling: III
  - number: 41a.2
    text: |-
      Aan het gebruik van geoogst materiaal voor vermeerderingsdoeleinden binnen het eigen bedrijf, kunnen bij of
      krachtens de in het eerste lid bedoelde algemene maatregel van bestuur beperkingen of voorwaarden worden gesteld,
      welke onder meer betrekking kunnen hebben op de maximale hoeveelheid te vermeerderen geoogst materiaal en aan de
      houder van een kwekersrecht toekomende vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41a
  - number: 41b
    text: |-
      Het in [artikel 40, eerste lid][ref1], bedoelde uitsluitend recht is niet van toepassing op handelingen met
      materiaal van het beschermde ras of van een ras als bedoeld in [artikel 41, eerste lid][ref2], dat door of met
      toestemming van de houder van het kwekersrecht, in Nederland of in één der Lid-Staten van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het verkeer is
      gebracht of dat van zodanig materiaal is afgeleid, met uitzondering van handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel41
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '41'
        hoofdstuk: IV
        afdeling: III
  - number: 41b.a
    text: die een verdere vermeerdering van het ras, waartoe het materiaal behoort, inhouden;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41b
  - number: 41b.b
    text: |-
      die uitvoer, anders dan voor verbruiksdoeleinden, van het materiaal inhouden naar een land, waar voor rassen van
      het gewas, waartoe het ras behoort, geen bescherming openstaat welke vergelijkbaar is met de bescherming die op
      basis van het bepaalde in deze wet kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel41b
  - number: '42.1'
    text: |-
      De houder van een kwekersrecht is verplicht de licenties te verlenen welke in het algemeen belang noodzakelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel42
  - number: '42.2'
    text: |-
      De houder van een kwekersrecht is verplicht aan een octrooihouder een licentie te verlenen tegen een redelijke
      vergoeding, indien de octrooihouder een octrooi voor een biotechnologische uitvinding niet kan exploiteren
      zonder inbreuk te maken op het kwekersrecht van eerdere datum en de biotechnologische uitvinding een belangrijke
      technische vooruitgang van aanzienlijk economisch belang vertegenwoordigt ten opzichte van het beschermde
      plantenras.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel42
  - number: '42.3'
    text: |-
      Indien aan een houder van een kwekersrecht een licentie is verleend op grond van
      [artikel 57, vijfde lid, van de Rijksoctrooiwet 1995][ref1], is de houder van het kwekersrecht verplicht aan de
      octrooihouder op diens verzoek onder redelijke voorwaarden een wederkerige licentie te verlenen om het beschermde
      plantenras te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
  - number: '42.4'
    text: |-
      De in de vorige leden bedoelde verplichtingen houden mede in dat de houder van het kwekersrecht het voor de
      uitoefening van de licentie noodzakelijke teeltmateriaal tegen een billijke vergoeding dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel42
  - number: '43.1'
    text: |-
      Indien de houder van het kwekersrecht zijn verplichtingen, bedoeld in [artikel 42][ref1], niet nakomt, wordt de
      licentie op verzoek van de belanghebbenden door de Raad verleend. [Artikel 36][ref2] vindt ten aanzien van het
      verzoek overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel36
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '42'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '36'
        hoofdstuk: IV
        afdeling: II
  - number: '43.2'
    text: |-
      Alvorens te beslissen stelt de Raad partijen in de gelegenheid binnen een door hem te bepalen termijn alsnog tot
      overeenstemming te komen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel43
  - number: '43.3'
    text: |-
      Bij gebreke van overeenstemming beslist de Raad, na partijen te hebben gehoord. In de beslissing worden de
      omvang van de licentie, het bedrag van de aan de houder van het kwekersrecht te betalen vergoeding, alsmede de
      te verstrekken hoeveelheid teeltmateriaal en de daarvoor te betalen vergoeding vastgesteld. De Raad kan bij de
      beslissing aan de verkrijger van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel43
  - number: '43.4'
    text: |-
      Nadat de licentie door de Raad is verleend en aan de verplichting tot het stellen van zekerheid, indien deze is
      opgelegd, is voldaan, wordt de licentie in het Nederlands Rassenregister ingeschreven. De licentie werkt eerst na
      die inschrijving, ook tegenover hen, die na de inschrijving van het in het eerste lid bedoelde verzoek rechten op
      het kwekersrecht hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel43
  - number: '44.1'
    text: |-
      De houder van een kwekersrecht kan een openbaar aanbod doen tot licentieverlening. Tenzij de Raad zich om redenen
      van algemeen belang als bedoeld in [artikel 42, eerste lid][ref1], niet kan verenigen met de voorwaarden voor de
      licentieverlening, wordt een zodanig aanbod op kosten van de houder van het kwekersrecht door de zorg van de Raad
      bekendgemaakt in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel42
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '42'
        hoofdstuk: IV
        afdeling: III
  - number: '44.2'
    text: |-
      Een ieder, die van het aanbod gebruik wenst te maken, verkrijgt een licentie door bij aangetekende brief aan de
      Raad kennis te geven, dat hij het aanbod aanneemt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '44.3'
    text: |-
      De licentie wordt in het Nederlands Rassenregister ingeschreven en werkt eerst na de inschrijving. Zij werkt van
      dat tijdstip af ook tegenover hen, die na het tijdstip van de in het eerste lid bedoelde bekendmaking rechten op
      het kwekersrecht hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '44.4'
    text: Het openbaar aanbod is onherroepelijk, behoudens het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '44.5'
    text: |-
      De houder van het kwekersrecht kan, voor het eerst na een jaar na inschrijving van de licentie in het Nederlands
      Rassenregister, onder goedkeuring van de Raad de voorwaarden, waaronder de licentie is verleend, wijzigen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '44.6'
    text: |-
      Indien de Raad van oordeel is, dat de voorwaarden gewijzigd dienen te worden, stelt hij de houder van het
      kwekersrecht hiervan in kennis. In dat geval is de houder van het kwekersrecht verplicht binnen een door de Raad te
      stellen termijn, welke tenminste twee maanden bedraagt, een voorstel tot wijziging te doen, bij gebreke waarvan de
      Raad de voorwaarden ambtshalve wijzigt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '44.7'
    text: De wijziging wordt door de zorg van de Raad bekend gemaakt in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel44
  - number: '45.1'
    text: |-
      Indien Onze Minister van oordeel is dat het algemeen belang zulks vordert, nodigt hij de houder van een
      kwekersrecht schriftelijk en onder opgaaf van redenen uit binnen een maand een openbaar aanbod, als bedoeld in
      [artikel 44][ref1], te doen. Onze Minister kan daarbij aanwijzingen geven omtrent de omvang en voorwaarden van de
      aan te bieden licentie.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel44
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '44'
        hoofdstuk: IV
        afdeling: III
  - number: '45.2'
    text: |-
      Blijft een aanbod ingevolge het eerste lid achterwege, dan zal de Raad met inachtneming van de door Onze Minister
      gegeven aanwijzingen een zodanig aanbod doen en dit op kosten van de houder van het kwekersrecht in de *Nederlandse
      Staatscourant* bekend maken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel45
  - number: '45.3'
    text: |-
      [Artikel 44, tweede tot zevende lid][ref1], is van overeenkomstige toepassing, met dien verstande, dat de Raad bij
      de uitoefening van zijn daar omschreven bevoegdheden de aanwijzingen van Onze Minister in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel44
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '44'
        hoofdstuk: IV
        afdeling: III
  - number: '46.1'
    text: |-
      Door een licentie wordt de bevoegdheid verkregen de daarin omschreven handelingen te verrichten, welke krachtens
      [artikel 40, eerste lid][ref1], aan anderen dan de houder van het kwekersrecht niet vrijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel40
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '40'
        hoofdstuk: IV
        afdeling: III
  - number: '46.2'
    text: |-
      Bij gebreke van andere bepalingen geldt een licentie voor de gehele duur van het kwekersrecht en heeft zij
      betrekking op alle handelingen welke ingevolge deze wet aan de toestemming van de houder van het kwekersrecht
      onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel46
  - number: '46.3'
    text: |-
      Een licentie, verleend anders dan op grond van de [artikelen 43][ref1], [44][ref2] en [45][ref3], wordt op
      verzoek van de licentiehouder in het Nederlands Rassenregister ingeschreven. Zij is tegenover derden geldig na
      die inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel45
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '43'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '44'
        hoofdstuk: IV
        afdeling: III
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '45'
        hoofdstuk: IV
        afdeling: III
  - number: '46.4'
    text: Een licentie is niet overdraagbaar, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel46
  - number: '47'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel47
  - number: 47.a
    text: de in deze afdeling bedoelde verzoeken aan de Raad;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel47
  - number: 47.b
    text: |-
      de bepaling van het tijdstip, waarop [de onder ][ref1] bedoelde verzoeken geacht worden bij de Raad te zijn
      ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel47
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '47'
        hoofdstuk: IV
        afdeling: III
  - number: 47.c
    text: het horen van belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel47
  - number: '48.1'
    text: Een kwekersrecht en een aanspraak op verlening van kwekersrecht zijn vatbaar voor overdracht of andere overgang.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel48
  - number: '48.2'
    text: |-
      De levering vereist voor de overdracht van een kwekersrecht of het recht, voortvloeiende uit een aanvrage tot
      verlening van kwekersrecht, geschiedt bij een akte.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel48
  - number: '48.3'
    text: |-
      Elk voorbehoud de overdracht betreffende moet in de akte omschreven zijn; bij gebreke daarvan geldt de overdracht
      voor onbeperkt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel48
  - number: '48.4'
    text: De overdracht werkt tegenover derden eerst, wanneer de akte in het Nederlands Rassenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel48
  - number: '48.5'
    text: Tot het doen verrichten van deze inschrijving door de Raad zijn beide partijen gelijkelijk bevoegd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel48
  - number: '49.1'
    text: |-
      Indien een kwekersrecht aan meer personen gezamenlijk toekomt, wordt hun verhouding tegenover elkaar en tegenover
      derden beheerst door hetgeen tussen hen bij overeenkomst is bepaald, wat hun verhouding tegenover derden betreft
      echter slechts, voor zover deze blijkt uit het Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49
  - number: '49.2'
    text: |-
      Indien er geen overeenkomst bestaat, of, indien in de overeenkomst niet anders is bepaald, heeft elke
      medegerechtigde de bevoegdheid het kwekersrecht uit te oefenen en tegen handelingen in strijd daarmede verricht op
      te treden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49
  - number: '49.3'
    text: |-
      Iedere medegerechtigde is verplicht, vóór de vervreemding van zijn rechten aan een derde, deze aan zijn
      medegerechtigden tegen een redelijke prijs te koop aan te bieden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49
  - number: 49a.1
    text: |-
      Pandrecht op een kwekersrecht wordt gevestigd bij een akte en werkt tegenover derden eerst wanneer de akte in het
      Nederlands Rassenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49a
  - number: 49a.2
    text: |-
      De pandhouder is verplicht in een door hem ondertekende verklaring, bij de Raad voor het Kwekersrecht in te
      zenden, woonplaats te kiezen te 's-Gravenhage. Indien die keuze niet is gedaan, geldt de zetel van de Raad voor het
      Kwekersrecht als gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49a
  - number: 49a.3
    text: |-
      Bedingen in de akte waarbij het pandrecht is gevestigd, betreffende na inschrijving te verlenen licenties, gelden
      van het ogenblik af, dat zij in het Nederlands Rassenregister zijn aangetekend, ook tegenover derden. Bedingen,
      betreffende vergoedingen voor licenties, die op het ogenblik der inschrijving reeds waren verleend, gelden
      tegenover de houder der licentie na aanzegging aan deze bij deurwaardersexploit.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49a
  - number: 49a.4
    text: |-
      Akten, waaruit blijkt, dat het pandrecht heeft opgehouden te bestaan of krachteloos is geworden, worden in het
      Nederlands Rassenregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel49a
  - number: '50.1'
    text: |-
      Het beslag op een kwekersrecht wordt gelegd en het proces-verbaal van inbeslagneming wordt in het
      Nederlands Rassenregister ingeschreven met overeenkomstige toepassing van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende executoriaal en conservatoir beslag op onroerende
      zaken, met dien verstande dat in het proces-verbaal van inbeslagneming in plaats van de aard en de ligging van de
      onroerende zaak een aanduiding van het kwekersrecht wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '50.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling of verlening van een licentie, tot stand gekomen na de
      inschrijving van het proces-verbaal, kan tegen de beslaglegger niet worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
  - number: '50.3'
    text: |-
      De vóór de inschrijving van het proces-verbaal nog niet betaalde licentievergoedingen vallen mede onder een
      op het kwekersrecht gelegd beslag, nadat het ingeschreven beslag aan de houder der licentie is betekend. Deze
      vergoedingen moeten worden betaald aan de notaris voor wie de executie zal plaatsvinden, mits dit bij de betekening
      uitdrukkelijk aan de licentiehouder is medegedeeld, en behoudens de rechten van derden die de executant moet
      eerbiedigen. Hetgeen aan de notaris wordt betaald, wordt tot de in [artikel 50][ref1], bedoelde opbrengst gerekend.
      De [artikelen 475][ref2], [476][ref3] en [478 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: 50a
        hoofdstuk: IV
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '476'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '478'
  - number: '50.4'
    text: 'De inschrijving van het proces-verbaal van inbeslagneming kan worden doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
  - number: 50.4.a
    text: |-
      krachtens een schriftelijke ter inschrijving aangeboden verklaring van de deurwaarder dat hij in opdracht van de
      beslaglegger het beslag opheft of dat het beslag is vervallen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
  - number: 50.4.b
    text: |-
      krachtens een ter inschrijving aangeboden rechterlijke uitspraak die tot opheffing van het beslag strekt of het
      verval van het beslag vaststelt of meebrengt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
  - number: '50.5'
    text: |-
      De artikelen [504][ref1], [538-541][ref2], [726, tweede lid][ref3],
      en[ 727 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn in geval van beslag op een kwekersrecht van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel504a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel538
      [ref3]: https://wetten.overheid.nl/BWBR0001827
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel727
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 504a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '538'
      - id: ref3
        bwb_id: BWBR0001827
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '727'
  - number: 50a.1
    text: |-
      De verkoop van een kwekersrecht door een pandhouder of een beslaglegger tot verhaal van een
      vordering geschiedt in het openbaar ten overstaan van een bevoegde notaris. De artikelen [508][ref1],
      [509][ref2], [513, eerste lid][ref3], [514, tweede en derde lid][ref4], [515-519][ref5] en
      [521-529 van het Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige toepassing met dien
      verstande dat hetgeen daar ten aanzien van hypotheken en hypotheekhouders is voorgeschreven geldt voor de op het
      kwekersrecht rustende pandrechten en de pandhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel509
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel513
      [ref4]: https://wetten.overheid.nl/BWBR0001827
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel521
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '509'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '513'
      - id: ref4
        bwb_id: BWBR0001827
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '515'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '521'
  - number: 50a.2
    text: |-
      De verdeling van de opbrengst geschiedt met overeenkomstige toepassing van de
      [artikelen 551-552 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
  - number: '51'
    text: |-
      De duur van het kwekersrecht bedraagt ten minste twintig jaar vanaf de dagtekening van het kwekersrecht. Bij
      algemene maatregel van bestuur wordt voor de verschillende gewassen de duur nader bepaald.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel51
  - number: '52.1'
    text: De houder van het kwekersrecht kan daarvan afstand doen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel52
  - number: '52.2'
    text: Afstand kan slechts geschieden bij een akte, welke in het Nederlands Rassenregister moet worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel52
  - number: '52.3'
    text: |-
      De inschrijving geschiedt niet, zolang er personen zijn, die blijkens in dat register ingeschreven stukken
      rechten op het kwekersrecht of licenties hebben verkregen of rechtsvorderingen het kwekersrecht betreffende hebben
      ingesteld, en deze personen tot de afstand geen toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel52
  - number: '52.4'
    text: |-
      Het kwekersrecht vervalt met ingang van het tijdstip van de inschrijving van de akte in het Nederlands
      Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel52
  - number: '53.1'
    text: |-
      Een kwekersrecht vervalt van rechtswege, zodra zes maanden zijn verstreken sinds de jaarcijns, bedoeld in
      [artikel 38][ref1], verschuldigd is geworden, zonder dat betaling daarvan heeft plaats gehad. Van dit vervallen
      wordt in het Nederlands Rassenregister aantekening gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel38
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '38'
        hoofdstuk: IV
        afdeling: II
  - number: '53.2'
    text: |-
      Indien binnen veertien dagen na de vervaldag niet is betaald wordt degene, die volgens het Nederlands
      Rassenregister houder van het kwekersrecht is, door de Raad bij aangetekende brief aan zijn verplichting tot
      betaling herinnerd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel53
  - number: '53.3'
    text: |-
      Indien een maand na de vervaldag nog niet is betaald, wordt hiervan binnen veertien dagen schriftelijk mededeling
      gedaan aan allen, die blijkens in het Nederlands Rassenregister ingeschreven stukken rechten op het kwekersrecht of
      licenties hebben verkregen of rechtsvorderingen het kwekersrecht betreffende hebben ingesteld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel53
  - number: '53.4'
    text: Op het niet ontvangen van de in de voorgaande leden bedoelde brieven kan in rechte geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel53
  - number: '54.1'
    text: 'Een kwekersrecht wordt vernietigd:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
  - number: 54.1.a
    text: indien blijkt dat het ras op het moment van indiening van de aanvrage niet nieuw was;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
  - number: 54.1.b
    text: |-
      indien blijkt dat het ras niet onderscheidbaar was, als bedoeld in [artikel 29, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: 54.1.c
    text: |-
      indien – in het geval dat de verlening van het kwekersrecht in hoofdzaak is gebaseerd op door de kweker verstrekte
      inlichtingen en bescheiden – blijkt dat op het tijdstip van die verlening het ras niet homogeen dan wel niet
      bestendig was als bedoeld in [artikel 29, eerste lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel29
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '29'
        hoofdstuk: IV
        afdeling: I
  - number: 54.1.d
    text: |-
      indien het kwekersrecht is verleend aan een persoon die daartoe ingevolge het bepaalde bij of krachtens deze wet
      niet gerechtigd is, tenzij het kwekersrecht wordt overgedragen aan de persoon die daartoe wel gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
  - number: '54.2'
    text: |-
      De vernietiging kan te allen tijde door iedere belanghebbende en door of namens Onze Minister gevraagd worden door
      indiening bij de Raad van een met redenen omkleed verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
  - number: '54.3'
    text: |-
      Vernietiging van een kwekersrecht ontneemt aan het kwekersrecht en aan de rechten, welke daaruit zijn afgeleid,
      alle verdere rechtsgevolgen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel54
  - number: '55.1'
    text: |-
      Een kwekersrecht kan geheel of voor wat betreft een aandeel daarin worden opgeëist, voorzover het is verleend aan
      iemand, die krachtens de [artikelen 30][ref1], [31][ref2] of [32][ref3] daarop geen of niet uitsluitend aanspraak
      had.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel32
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '30'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '31'
        hoofdstuk: IV
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '32'
        hoofdstuk: IV
        afdeling: I
  - number: '55.2'
    text: |-
      Het recht tot opeising komt toe aan hem, die krachtens voormelde artikelen aanspraak of mede-aanspraak heeft op de
      verlening van het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel55
  - number: '55.3'
    text: Dit recht verjaart na afloop van vijf jaren na de dagtekening van het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel55
  - number: '55.4'
    text: De opeising geschiedt door indiening bij de Raad van een met redenen omkleed verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel55
  - number: '55.5'
    text: |-
      Te goeder trouw voor de aantekening, bedoeld in [artikel 56, eerste lid][ref1], verkregen licenties blijven
      geldig tegenover de nieuwe houder van het kwekersrecht, die recht verkrijgt op de voor de licenties verschuldigde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel56
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '56'
        hoofdstuk: IV
        afdeling: V
  - number: '56.1'
    text: |-
      Van het verzoek tot vernietiging en toewijzing ener opeising alsmede van de afwijzing en intrekking van een zodanig
      verzoek wordt aantekening gedaan in het Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel56
  - number: '56.2'
    text: |-
      Ten aanzien van de verwijzing in de kosten vinden de [artikelen 237][ref1], [239][ref2] en
      [241 van het Wetboek van Burgerlijke Rechtsvordering][ref3] zoveel mogelijk overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel241
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '239'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '241'
  - number: '56.3'
    text: |-
      Van het besluit van de Raad tot vernietiging en toewijzing ener opeising wordt aantekening gedaan in het Nederlands
      Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel56
  - number: '56.4'
    text: |-
      De vernietiging en toewijzing ener opeising werken terug tot de dagtekening van de in het eerste lid bedoelde
      aantekening in het Nederlands Rassenregister.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel56
  - number: '57'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel57
  - number: 57.a
    text: de in deze afdeling bedoelde verzoeken aan de Raad;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel57
  - number: 57.b
    text: de bepaling van het tijdstip, waarop de onder *a* bedoelde verzoeken geacht worden bij de Raad te zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel57
  - number: 57.c
    text: het horen van belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel57
  - number: '59.1'
    text: |-
      Met uitzondering van de beslissingen ingevolge de [artikelen 54][ref1] en [55][ref2] staat van de beslissingen van
      de Raad ingevolge dit hoofdstuk beroep open op de Afdeling van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel55
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '54'
        hoofdstuk: IV
        afdeling: V
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '55'
        hoofdstuk: IV
        afdeling: V
  - number: '59.2'
    text: |-
      Het beroep kan worden ingesteld door de aanvrager of diens rechtverkrijgenden en, zo de beslissing is genomen op
      verzoek van een ander dan dezen, tevens door de verzoeker.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel59
  - number: '60.1'
    text: |-
      Van de eindbeslissingen van de Raad ingevolge de [artikelen 54][ref1] en [55][ref2] staat beroep open bij het
      gerechtshof te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel55
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '54'
        hoofdstuk: IV
        afdeling: V
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '55'
        hoofdstuk: IV
        afdeling: V
  - number: '60.2'
    text: |-
      Het beroep bij het gerechtshof moet binnen drie maanden na de verzending van de beslissing van de Raad voor het
      Kwekersrecht bij dagvaarding worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel60
  - number: '60.3'
    text: |-
      De dagvaarding moet binnen 8 dagen na haar dagtekening in het Nederlands Rassenregister worden ingeschreven. Bij
      gebreke van tijdige inschrijving is appellant verplicht de schade te vergoeden, geleden door hen, die te goeder
      trouw na die termijn en voor de inschrijving rechten hebben verkregen, waarop de vernietiging of toewijzing ener
      opeising invloed hebben.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel60
  - number: '60.4'
    text: |-
      Zodra een eindbeslissing aangaande een vordering tot vernietiging of toewijzing ener opeising in kracht van
      gewijsde is gegaan of de instantie is vervallen, wordt daarvan op verzoek van de meest gerede partij in het
      Nederlands Rassenregister aantekening gedaan.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel60
  - number: '61.1'
    text: |-
      De deskundige leden, bedoeld in [artikel 70, tweede lid, van de Wet op de rechterlijke organisatie][ref1], en
      hun plaatsvervangers worden bij koninklijk besluit benoemd. Wij benoemen tevens zoveel plaatsvervangers als Wij
      dienstig oordelen. Zij worden genoemd raad, onderscheidenlijk plaatsvervangende raad in het gerechtshof te 's-
      Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel70
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '70'
  - number: '61.2'
    text: |-
      Om te kunnen worden benoemd tot raad in het gerechtshof te 's-Gravenhage moet men de ouderdom van dertig jaren
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel61
  - number: '61.3'
    text: |-
      De raden en de plaatsvervangende raden worden voor de tijd van vijf jaren benoemd. Zij zijn bij hun aftreden weder
      benoembaar. Op eigen verzoek kunnen zij bij koninklijk besluit worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel61
  - number: '61.4'
    text: De raden en de plaatsvervangende raden worden voor de aanvang hunner bediening beëdigd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel61
  - number: '61.5'
    text: |-
      Met ingang van de eerste dag van de maand volgende op die waarin de raad of de plaatsvervangende raad de leeftijd
      van zeventig jaren heeft bereikt, wordt aan hem bij koninklijk besluit ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel61
  - number: '63'
    text: |-
      Ten aanzien van de raden en plaatsvervangende raden in het gerechtshof te 's-
      Gravenhage zijn de [artikelen 46c][ref1], [46d][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met vijfde lid van de Wet rechtspositie rechterlijke ambtenaren][ref10] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '66'
    text: |-
      De president van het gerechtshof te 's-Gravenhage is bevoegd ambtshalve of op het verzoek van het openbaar
      ministerie aan de raden en de plaatsvervangende raden van het gerechtshof, die de waardigheid van hun ambt,
      hun ambtsbezigheden of ambtsplichten verwaarlozen, of die zich schuldig maken aan de overtredingen, bedoeld
      in [artikel 67][ref1], de nodige waarschuwing te doen, na hen in de gelegenheid te hebben gesteld om te worden
      gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel67
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '67'
        hoofdstuk: IV
        afdeling: VI
  - number: '67'
    text: |-
      Het is de raden en de plaatsvervangende raden in het gerechtshof te 's-Gravenhage verboden zich te belasten met
      de consultatie omtrent en de verdediging van zaken, welke bij hen in behandeling zijn of waarvan zij weten of
      vermoeden, dat deze door hen behandeld zullen worden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel67
  - number: '68.1'
    text: Bij algemene maatregel van bestuur worden voorschriften gegeven ter uitvoering van het bepaalde in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel68
  - number: '68.2'
    text: |-
      De raden en de plaatsvervangende raden in het gerechtshof te 's-Gravenhage genieten vergoeding voor reis- en
      verblijfkosten en verdere vergoeding volgens bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel68
  - number: '69.1'
    text: Van de beslissingen van het gerechtshof staat beroep in cassatie open bij de Hoge Raad der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel69
  - number: '69.2'
    text: |-
      [Artikel 60, tweede, derde en vierde lid][ref1], vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel60
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '60'
        hoofdstuk: IV
        afdeling: VI
  - number: '70'
    text: |-
      Van alle rechterlijke uitspraken het kwekersrecht betreffende wordt door de griffier van het college, door hetwelk
      die uitspraak werd gedaan, binnen een maand kosteloos een los afschrift gezonden aan de Raad.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel70
  - number: '71'
    text: |-
      De in dit Hoofdstuk bedoelde inschrijvingen, en aantekeningen krachtens beslissingen, waartegen beroep openstaat,
      geschieden, zodra op het beroep is beslist of de beroepstermijn verstreken is, zonder dat beroep is ingesteld, dan
      wel zodra van het beroep afstand is gedaan door een schriftelijke daartoe strekkende kennisgeving aan de Raad.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel71
  - number: '72'
    text: 'In de *Nederlandse Staatscourant* wordt mededeling gedaan van:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel72
  - number: 72.a
    text: |-
      de in dit Hoofdstuk bedoelde inschrijvingen, met uitzondering van de inschrijvingen ingevolge de
      [artikelen 43, vierde lid][ref1], [44, derde lid][ref2], en [46, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel46
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '43'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '44'
        hoofdstuk: IV
        afdeling: III
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '46'
        hoofdstuk: IV
        afdeling: III
  - number: 72.b
    text: |-
      de aantekeningen ingevolge de [artikelen 36][ref1], [37][ref2], [53, eerste lid][ref3],
      [56, eerste en derde lid][ref4], en [60, vierde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002541#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0002541#Artikel60
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '36'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '37'
        hoofdstuk: IV
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '53'
        hoofdstuk: IV
        afdeling: V
      - id: ref4
        bwb_id: BWBR0002541
        artikel: '56'
        hoofdstuk: IV
        afdeling: V
      - id: ref5
        bwb_id: BWBR0002541
        artikel: '60'
        hoofdstuk: IV
        afdeling: VI
  - number: '73'
    text: |-
      Ten aanzien van door Ons aan te wijzen cultuurgewassen of groepen van cultuurgewassen wordt een rassenlijst
      aangehouden, waarop worden vermeld de tot die cultuurgewassen behorende rassen en andere groepen van planten,
      waarvan de teelt in Nederland van belang geacht wordt door een door Ons in te stellen commissie of aan te wijzen
      instelling.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel73
  - number: '74'
    text: |-
      Bij de plaatsing van de rassen en de andere groepen van planten op de rassenlijst worden de hoedanigheden en andere
      gegevens vermeld, waaromtrent voorlichting door de commissie of instelling van belang geacht wordt.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel74
  - number: '75.1'
    text: |-
      De plaatsing op en rubricering in de rassenlijst, alsmede de wijziging van de rubricering in en de afvoering van de
      rassenlijst geschieden, behoudens het bepaalde in [artikel 76][ref1], ambtshalve door de commissie of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel76
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '76'
        hoofdstuk: V
  - number: '75.2'
    text: |-
      Alvorens tot plaatsing en rubricering, tot wijziging van de rubricering dan wel tot afvoering over te gaan, stelt
      de commissie of instelling daaromtrent een deskundig onderzoek in of doet deze dit instellen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel75
  - number: '75.3'
    text: |-
      De commissie of instelling gaat niet tot plaatsing op de rassenlijst, tot overplaatsing in de rubriek: uitsluitend
      voor uitvoer bestemd dan wel tot afvoering van de rassenlijst over dan na de houder van het kwekersrecht, de
      toegelaten instandhouder of de kweker van een op grond van [artikel 18, tweede lid][ref1], ingeschreven ras
      gehoord, althans behoorlijk opgeroepen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '76.1'
    text: |-
      De houder van het kwekersrecht voor een ras, alsmede de kweker van een op grond van [artikel 18, tweede lid][ref1],
      ingeschreven ras, kan tot de commissie of instelling een met redenen omkleed verzoek richten tot plaatsing van zijn
      ras op de rassenlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '76.2'
    text: |-
      Indien een ras van een landbouwgewas is geplaatst in de rubriek: uitsluitend voor uitvoer bestemd, kan de houder
      van het kwekersrecht, de toegelaten instandhouder of de kweker van een op grond van [artikel 18, tweede lid][ref1],
      ingeschreven ras binnen drie maanden na publikatie van de betreffende uitgave van de rassenlijst aan de commissie
      een met redenen omkleed verzoek richten tot wijziging van de rubricering van het ras.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '76.3'
    text: |-
      Alvorens op een verzoek, als bedoeld in het eerste en tweede lid, te beslissen, stelt de commissie of instelling
      daaromtrent een deskundig onderzoek in of doet deze dit instellen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel76
  - number: '76.4'
    text: |-
      De commissie of instelling gaat niet tot afwijzing van een verzoek over dan na de verzoeker gehoord, althans
      behoorlijk opgeroepen te hebben.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel76
  - number: '78.1'
    text: |-
      Tegen de beschikking, bedoeld in de [artikelen 75, eerste lid][ref1], en [76, eerste en tweede lid][ref2], kan een
      belanghebbende beroep instellen bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel76
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '75'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '76'
        hoofdstuk: V
  - number: '78.2'
    text: |-
      Onze Minister beslist of en, zo ja, welke wijzigingen in verband met het beroep in de rassenlijst zullen worden
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel78
  - number: '78.3'
    text: Onze Minister kan ambtshalve wijzigingen in de rassenlijst doen aanbrengen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel78
  - number: '79'
    text: |-
      Onze Minister kan bij bij regeling nadere voorschriften geven met betrekking tot de inrichting, de samenstelling,
      de rubricering en de publikatie van een rassenlijst, ten aanzien van de in [artikel 74][ref1] bedoelde gegevens
      alsmede betreffende de indiening van verzoeken, als bedoeld in de [ artikelen 76][ref2] en [77][ref3], en van
      beroep, als bedoeld in [artikel 78][ref4], het onderzoek en de openbaarmaking van de uitkomsten van het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0002541#Artikel78
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '74'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '76'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '77'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002541
        artikel: '78'
        hoofdstuk: V
  - number: '80.1'
    text: |-
      Onverminderd het recht tot het voeren van een handelsnaam en een merk mag teeltmateriaal van een in het Nederlands
      Rassenregister ingeschreven ras uitsluitend onder de ingeschreven benaming in het verkeer gebracht, verder
      verhandeld en behoudens het bepaalde in het tweede en derde lid uitgevoerd worden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel80
  - number: '80.2'
    text: |-
      Indien in enig land voor een ras een andere benaming is voorgeschreven dan de hier te lande ingeschreven benaming,
      mag teeltmateriaal van dat ras naar dat land slechts worden uitgevoerd onder de aldaar voorgeschreven benaming.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel80
  - number: '80.3'
    text: |-
      Naar andere dan Unie-Staten mag, tenzij het tweede lid van toepassing is, teeltmateriaal van een ingeschreven ras
      worden uitgevoerd onder een in het land van invoer gebruikelijke benaming, onder toevoeging van de hier te lande
      ingeschreven benaming.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel80
  - number: '80.4'
    text: |-
      De ingeschreven benaming of een daarmede overeenstemmend woord mag niet worden gebezigd voor ander teeltmateriaal
      van hetzelfde of een verwant cultuurgewas.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel80
  - number: '81.1'
    text: |-
      Van landbouwgewassen mag uitsluitend teeltmateriaal van daartoe behorende ingeschreven rassen in het verkeer
      gebracht, verder verhandeld en uitgevoerd worden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel81
  - number: '81.2'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van een landbouwgewas worden bepaald, dat het vorige lid niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel81
  - number: '81.3'
    text: |-
      Ten aanzien van een tuinbouwgewas kan bij algemene maatregel van bestuur worden bepaald, dat daarvan uitsluitend
      teeltmateriaal van ingeschreven rassen in het verkeer gebracht, verder verhandeld en uitgevoerd mag worden.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel81
  - number: '82'
    text: |-
      Onze Minister kan, gehoord de in [artikel 73][ref1] bedoelde commissie of instelling, bepalen, dat in afwijking
      van het bepaalde bij of krachtens [artikel 81][ref2], ook teeltmateriaal van door hem aan te wijzen groepen van
      planten, welke niet zijn ingeschreven, in het verkeer gebracht, verder verhandeld en uitgevoerd mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel81
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '73'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '81'
        hoofdstuk: VI
        afdeling: I
  - number: '83.1'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van een landbouwgewas, waarop [artikel 81, eerste lid][ref1],
      van toepassing is, worden bepaald, dat daarvan uitsluitend teeltmateriaal van rassen of andere groepen van planten,
      welke op de rassenlijst zijn geplaatst, in het verkeer gebracht, verder verhandeld en uitgevoerd mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel81
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '81'
        hoofdstuk: VI
        afdeling: I
  - number: '83.2'
    text: |-
      Ten aanzien van rassen en andere groepen van planten, welke in de rubriek: uitsluitend voor uitvoer bestemd zijn
      geplaatst, geeft Onze Minister nadere voorschriften betreffende het in het verkeer brengen en verder verhandelen
      van het teeltmateriaal daarvan.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel83
  - number: '84.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald, welke categorieën teeltmateriaal van rassen
      behorende tot een krachtens [artikel 87][ref1] aangewezen landbouwgewas, in het verkeer gebracht, verder verhandeld
      en uitgevoerd mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel87
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '87'
        hoofdstuk: VI
        afdeling: II
  - number: '84.2'
    text: |-
      Om kweektechnische redenen kan bij algemene maatregel van bestuur ten aanzien van daarbij aangewezen gewassen,
      als bedoeld in het eerste lid, worden bepaald, dat daarbij aangewezen categorieën van teeltmateriaal van tot die
      gewassen behorende rassen uitsluitend mogen worden voortgebracht en in het verkeer gebracht door de houder van
      het kwekersrecht van het betreffende ras, of, indien voor het ras geen kwekersrecht bestaat, door de voor het ras
      aangewezen instandhouders.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel84
  - number: '84.3'
    text: |-
      De aanwijzing van instandhouders geschiedt door de Raad. Indien dit om kweektechnische redenen noodzakelijk is,
      wijst de Raad één instandhouder aan. Deze laatste is verplicht onder daartoe door de Raad te stellen voorwaarden
      aan anderen, die daartoe de wens kenbaar hebben gemaakt, voor de voortbrenging van teeltmateriaal geschikt
      uitgangsmateriaal te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel84
  - number: '85'
    text: |-
      Van een op grond van [artikel 18, tweede lid][ref1], ingeschreven ras mag uitsluitend teeltmateriaal in het verkeer
      gebracht, verder verhandeld en uitgevoerd worden door de kweker van het ras, alsmede door degene, die van de kweker
      voor de voortbrenging van teeltmateriaal geschikt uitgangsmateriaal heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
        hoofdstuk: III
  - number: '86'
    text: |-
      Teeltmateriaal van een groep van planten, dat ingevolge het bepaalde in de voorgaande artikelen niet tot het
      verkeer is toegelaten, mag niettemin voor beproeving in het verkeer gebracht en uitgevoerd worden door of namens
      degene, die de groep van planten, waartoe het teeltmateriaal behoort, door eigen kweekarbeid heeft tot stand
      gebracht, voor zover dit door de krachtens [artikel 87][ref1] aangewezen keuringsinstelling is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel87
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '87'
        hoofdstuk: VI
        afdeling: II
  - number: '87.1'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van een cultuurgewas worden bepaald, dat het bedrijfsmatig
      voortbrengen, bewaren en bewerken, anders dan voor gebruik in eigen bedrijf, en het bedrijfsmatig in het
      verkeer brengen, verder verhandelen, invoeren, uitvoeren en ten uitvoer aanbieden van teeltmateriaal dan wel het
      bedrijfsmatig doen verrichten van deze handelingen uitsluitend is toegestaan aan hem, die is aangesloten bij een in
      de algemene maatregel van bestuur voor dat cultuurgewas aangewezen keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel87
  - number: '87.2'
    text: |-
      Bij de in het vorige lid bedoelde algemene maatregel van bestuur kan worden bepaald, dat voor de toepassing daarvan
      met teeltmateriaal worden gelijkgesteld zaden, welke niet bestemd zijn om door middel van uitzaai voor de teelt van
      gewassen te dienen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel87
  - number: '87.3'
    text: |-
      Onze Minister is bevoegd in door hem te bepalen gevallen of groepen van gevallen van het krachtens het eerste lid
      bepaalde ontheffing of vrijstelling te verlenen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel87
  - number: '88'
    text: 'Om voor aanwijzing als keuringsinstelling ingevolge het vorig artikel in aanmerking te komen is vereist:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.1°
    text: 'dat de keuringsinstelling blijkens haar statuten:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.1°.a
    text: |-
      ten doel heeft door middel van keuringen te bevorderen, dat betrouwbaar teeltmateriaal in het verkeer gebracht,
      verder verhandeld en uitgevoerd wordt;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.1°.b
    text: niet werkzaam is met het oogmerk om winst te behalen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.1°.c
    text: een bestuur heeft, waarin de belanghebbenden of de groepen van belanghebbenden genoegzaam vertegenwoordigd zijn;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°
    text: 'dat de statuten van de keuringsinstelling bepalen, dat:'
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.a
    text: |-
      de statuten en algemeen geldende voorschriften zomede hun wijzigingen en de intrekking daarvan, alvorens van kracht
      te zijn, de goedkeuring behoeven van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.b
    text: |-
      de benoeming van de voorzitter van het bestuur geschiedt door Onze Minister, gehoord het bestuur van de
      keuringsinstelling;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.c
    text: op daartoe strekkende aanvrage een ieder als aangeslotene wordt toegelaten;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.d
    text: |-
      bij niet nakoming door een aangeslotene van enige bij de statuten of de onder *a* bedoelde algemeen geldende
      voorschriften opgelegde verplichting een of meer der navolgende maatregelen kunnen worden opgelegd: berisping,
      geldboete van de derde categorie als bedoeld in [artikel 23, vierde lid, van het Wetboek van strafrecht][ref1],
      het stellen van de aangeslotene onder verscherpte controle te zijnen laste voor ten hoogste twee jaren en
      openbaarmaking van de tuchtbeschikking; indien een aangeslotene in de periode van vijf jaren onmiddellijk
      voorafgaande aan het niet nakomen van enige verplichting als bovenbedoeld, hetzij onder verscherpte controle werd
      gesteld te zijnen laste, hetzij aan hem tweemaal een geldboete werd opgelegd, kan deze voor ten hoogste drie jaren
      worden geschorst;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 88.2°.e
    text: |-
      de aangeslotenen met betrekking tot andere dan de onder *g* bedoelde besluiten van een der organen van de
      keuringsinstelling binnen een maand na de dagtekening van de mededeling van zodanige besluiten beroep openstaat bij
      een Raad van Beroep, waarvan de samenstelling en de werkwijze worden geregeld in een reglement van beroep; onder
      besluiten worden niet begrepen algemeen geldende voorschriften;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.f
    text: de voorzitter en overige leden van de Raad van Beroep alsmede de secretaris worden benoemd door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.g
    text: |-
      aan de aangeslotenen met betrekking tot de bij de keuring genomen beslissingen beroep openstaat bij een Commissie
      van Beroep inzake Keuringen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.h
    text: |-
      de keuringsinstelling zich onderwerpt aan Rijkstoezicht, uit te oefenen vanwege Onze Minister volgens door deze te
      stellen regelen, en zich verplicht ten behoeve van het welslagen daarvan alle inlichtingen te verstrekken en alle
      medewerking te verlenen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: 88.2°.i
    text: |-
      de met het uitoefenen van Rijkstoezicht belaste ambtenaren recht van toegang hebben tot de vergaderingen van het
      bestuur en van het dagelijks bestuur en hiervoor steeds een uitnodiging ontvangen, vergezeld van alle stukken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel88
  - number: '89.1'
    text: |-
      Op de keuringsinstelling wordt Rijkstoezicht uitgeoefend vanwege Onze Minister volgens door deze te stellen
      regelen. Zij is verplicht ten behoeve van het welslagen daarvan alle inlichtingen te verstrekken en alle
      medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel89
  - number: '89.2'
    text: |-
      De keuringsinstelling verstrekt aan de houder van een kwekersrecht met betrekking tot een ras van een landbouwgewas
      op diens verzoek jaarlijks een opgave van de aangeslotenen, die teeltmateriaal van zijn ras hebben voortgebracht,
      en van de betreffende hoeveelheden, en verleent desverlangd medewerking bij de inning van de licentierechten.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel89
  - number: '90.1'
    text: |-
      Over de in [artikel 88, onder 2°., sub ][ref1], bedoelde besluiten van een der organen van de keuringsinstelling
      oordeelt bij uitsluiting de in dat artikel bedoelde Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel88
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '88'
        hoofdstuk: VI
        afdeling: II
  - number: '90.2'
    text: De uitspraken van de Raad van Beroep hebben de kracht van bindend advies.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel90
  - number: '91.1'
    text: |-
      Onverminderd de bevoegdheid van bedrijfslichamen als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1] is de keuringsinstelling ten aanzien van de
      cultuurgewassen, waarvoor zij is aangewezen, bevoegd voorschriften te geven met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: 91.1.a
    text: de gezondheid, de zuiverheid en de kwaliteit van het teeltmateriaal;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: 91.1.b
    text: |-
      de sortering, de classificatie, de verzorging, de verpakking, de verlading en de aanduiding van het teeltmateriaal,
      voor zover verband houdende met de onder *a* genoemde onderwerpen;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: 91.1.c
    text: |-
      het gebruik van de op het teeltmateriaal betrekking hebbende bescheiden en kentekenen, welke bij het verrichten van
      een of meer der in [het eerste lid van artikel 87][ref1] genoemde handelingen moeten worden gebezigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel87
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '87'
        hoofdstuk: VI
        afdeling: II
  - number: 91.1.d
    text: de technische inrichting en administratie van het bedrijf alsmede de technische bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: 91.1.e
    text: |-
      het toezicht op de naleving van de onder *a*, *b*, *c* en *d* bedoelde voorschriften en de keuring van het
      teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: '91.2'
    text: |-
      Voor zover de in het vorig lid, onder *a*, *b*, *c*, en *d*, bedoelde voorschriften betrekking hebben op de
      uitvoer, kunnen met het toezicht op de naleving van deze voorschriften worden belast de daartoe bij besluit van
      Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: '91.3'
    text: |-
      De in het eerste lid, onder *a*, *b* en *c*, bedoelde voorschriften van de keuringsinstelling kunnen door Onze
      Minister worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: '91.4'
    text: |-
      Voor zover geen keuringsinstelling is aangewezen of deze niet of niet voldoende voorziet of kan voorzien in
      voorschriften, als bedoeld in het eerste lid, kan daarin worden voorzien bij of krachtens algemene maatregel van
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: '91.5'
    text: |-
      Een algemene maatregel van bestuur uitgevaardigd in het geval, bedoeld in het vierde lid, wordt ingetrokken, voor
      zover door de krachtens [artikel 87][ref1] aangewezen keuringsinstelling terzake voorschriften worden gesteld en
      deze de goedkeuring van Onze Minister hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel87
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '87'
        hoofdstuk: VI
        afdeling: II
  - number: '91.6'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel91
  - number: '92.1'
    text: |-
      De keuringsinstelling weigert aan een bij haar aangeslotene de toelating tot het verkeer en verbiedt de verdere
      verhandeling van teeltmateriaal, ten aanzien waarvan zij heeft vastgesteld, dat dit niet behoort tot een groep van
      planten, als hoedanig het wordt aangeboden, of dat dit overigens niet voldoet aan de krachtens [artikel 91][ref1]
      gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel91
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '91'
        hoofdstuk: VI
        afdeling: II
  - number: '92.2'
    text: |-
      In bijzondere door hem te bepalen gevallen of groepen van gevallen kan Onze Minister, al dan niet onder door hem te
      stellen voorwaarden, ontheffing of vrijstelling verlenen van krachtens [artikel 91][ref1] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel91
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '91'
        hoofdstuk: VI
        afdeling: II
  - number: '92.3'
    text: |-
      Indien op grond van de door een aangeslotene gevolgde werkwijze en de resultaten daarvan gebleken is, dat
      de voortbrenging, bewaring en bewerking van teeltmateriaal niet op voldoende vakkundige wijze geschiedt, kan
      de keuringsinstelling bij de aangeslotene de keuring van teeltmateriaal telkens voor ten hoogste drie jaren
      opschorten.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel92
  - number: '93'
    text: Onze Minister stelt de krachtens deze wet voorgeschreven merken, tekenen, bewijsstukken en plombes vast.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel93
  - number: '94.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, geschiedt deze bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel94
  - number: '94.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de regels worden gesteld die noodzakelijk zijn voor
      uitvoering van verdragen of van bindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en
      de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen die zich richten op een in deze wet geregeld
      onderwerp.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel94
  - number: '95.1'
    text: |-
      Indien in enig burgerlijk- of strafgeding de beslissing afhangt van de vaststelling, als welk ras een groep van
      planten moet worden aangemerkt, wordt de Raad hierover gehoord. Het advies van de Raad bevat de gronden, waarop
      het rust.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel95
  - number: '95.2'
    text: De Raad behandelt zaken, als bedoeld in het eerste lid, bij voorrang boven alle andere zaken.
    url: https://wetten.overheid.nl/BWBR0002541/2005-07-01#Artikel95
  - number: '96.1'
    text: |-
      Opzettelijk handelen in strijd met het bepaalde bij of krachtens de [artikelen 40][ref1], [41][ref2],
      [41a][ref3], [41b][ref4], [80][ref5], [81][ref6], [83 tot en met 85][ref7], [87][ref8], [91, vierde lid][ref9]
      en [94 van deze wet][ref10] alsmede de artikelen 13, tweede lid, 17, eerste en tweede lid, en 18, derde lid,
      van [verordening (EG) nr. 2100/94](31994R2100) van de Raad van de Europese Unie van 27 juli 1994 inzake het
      communautaire kwekersrecht (Pb EG L 227) is een misdrijf.


