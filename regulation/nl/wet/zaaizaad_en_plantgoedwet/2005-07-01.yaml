  - number: '96.2'
    text: |-
      Handelen in strijd met het bepaalde bij of krachtens de [artikelen 40][ref1], [41][ref2], [41a][ref3], [41b][ref4],
      [80][ref5], [81][ref6], [83 tot en met 85][ref7], [87][ref8], [91, vierde lid][ref9] en [94 van deze wet][ref10]
