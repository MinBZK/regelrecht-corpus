  text: |-
    Gelet op artikel 3, eerste lid, onder a, van de Mandaatregeling Ministerie van Veiligheid en Justitie 2011 en
    artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het ingevolge [artikel 2 van de Mandaatregeling Ministerie van Veiligheid en Justitie 2011][ref1] aan de
      secretaris-generaal verleende mandaat wordt ondermandaat verleend aan de hoofden van de clusters, genoemd in
      [artikel 2, onder b tot en met h, van de Organisatieregeling Ministerie van Veiligheid en Justitie 2011][ref2] ten
      aanzien van de aangelegenheden die hun cluster betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030837#Artikel2
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel1
    references:
      - id: ref1
