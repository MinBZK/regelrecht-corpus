  - number: '3'
    text: |-
      De hoofden van de clusters, genoemd in
      [artikel 2, onder b tot en met h, van de Organisatieregeling Ministerie van Veiligheid en Justitie 2011][ref1]
      worden aangewezen als hoofd van dienst in de zin van
      [artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement][ref2] ten aanzien van de onder hun
      cluster ressorterende ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel4
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel3
    references:
      - id: ref1
