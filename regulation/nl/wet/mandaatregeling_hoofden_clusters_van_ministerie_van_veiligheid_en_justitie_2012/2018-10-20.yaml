        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '4'
  - number: '4'
    text: |-
      Besluiten inzake aanstelling, ontslag, bevordering of verplaatsing van ambtenaren op managementfuncties in schaal
      14 en hoger behoeven de instemming van het Centraal Loopbaanberaad van het Ministerie van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel4
  - number: '5'
    text: |-
      De Mandaatregeling DG’s, NCTb en plv. SG Justitie 2005 en het Taak- en bevoegdheidsbesluit pSG Justitie worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 2011.
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als: Mandaatregeling hoofden clusters van Ministerie van Veiligheid en Justitie
      2012.
    url: https://wetten.overheid.nl/BWBR0032164/2018-10-20#Artikel7
