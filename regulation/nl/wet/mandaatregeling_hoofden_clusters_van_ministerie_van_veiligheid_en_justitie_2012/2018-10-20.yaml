      - id: ref2
        bwb_id: BWBR0030837
        artikel: '2'
  - number: '2'
    text: |-
      Aan de secretaris-generaal blijft voorbehouden de bevoegdheid om besluiten te nemen, indien deze:

      a. zijn neergelegd in een document, gericht tot:

      1°. de Nationale ombudsman, behoudens de afdoening van:

        - ontvangstbevestigingen,
        - tussenberichten, waaronder uitstelberichten, en
        - stukken naar aanleiding van verzoeken van de Nationale ombudsman om, ter vermijding van een volledig onderzoek,
      te bevorderen dat alsnog aan de klacht tegemoet wordt gekomen (interventies);

      2°. de president van en de procureur-generaal bij de Hoge Raad der Nederlanden;

      b. zijn neergelegd in een document dat betrekking heeft op een verzoek in de zin van de
      [Wet openbaarheid van bestuur][ref1], indien inwilliging of afwijzing daarvan belangrijke politieke, bestuurlijke
      of maatschappelijke gevolgen kan hebben;

      c. uitleveringsbeschikkingen inhouden;

      d. beschikkingen inhouden waarin in het kader van de
      [Wet wederzijdse erkenning en tenuitvoerlegging van vrijheidsbenemende en voorwaardelijke sancties][ref2] dan wel
      de [Wet overdracht ten uitvoerlegging strafvonnissen][ref3] de in het buitenland opgelegde straf wordt aangepast
      aan het in Nederland wettelijk toegestane maximum;

      e. worden genomen op grond van:

      1°. [artikel 69 van het Algemeen Rijksambtenarenreglement][ref4],
      [artikel 46 van de Wet rechtspositie rechterlijke ambtenaren][ref5],
      [artikel 69 van het Besluit algemene rechtspositie politie][ref6] of
      [artikel 22 van het Besluit rechtspositie vrijwillige politie][ref7], voor zover de schadeloosstelling betrekking
      heeft op:

        - immateriële schade, of
        - materiële schade boven een bedrag van € 10.000;

      2º. [artikel 96b van het Algemeen Rijksambtenarenreglement][ref8],
      [artikel 92, tweede lid, van het Besluit algemene rechtspositie politie][ref9] of
      [artikel 39 van het Besluit rechtspositie vrijwillige politie][ref10];

      3º. [artikel 99 van het Algemeen Rijksambtenarenreglement][ref11],
      [artikel 36b van het Besluit rechtspositie rechterlijke ambtenaren][ref12] of
      [artikel 95 van het Besluit algemene rechtspositie politie][ref13], indien de meerkosten aangaande de minimale
      uitkering meer bedragen dan drie bruto maandsalarissen;

      f. betreffen het verstrekken van reisopdrachten aan ambtenaren naar landen buiten Europa alsmede Turkije.


