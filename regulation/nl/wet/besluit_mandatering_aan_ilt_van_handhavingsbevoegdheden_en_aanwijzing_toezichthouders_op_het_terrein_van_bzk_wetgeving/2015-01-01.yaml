        artikel: '71'
  - number: '2.2'
    text: |-
      Aan de inspecteur-generaal wordt volmacht verleend voor het verrichten van rechtshandelingen die verband
      houden met de invordering van verbeurde dwangsommen en van gemaakte kosten voor bestuursdwang als bedoeld in
      [artikel 5:25 van de Algemene wet bestuursrecht][ref1], voor zover deze verband houden met de bevoegdheid, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '2.3'
    text: |-
      Het op grond van dit besluit verleende mandaat omvat mede de bevoegdheid tot het vaststellen, wijzigen of intrekken
      van beleidsregels met betrekking tot de uitoefening van de bevoegdheid, bedoeld in het eerste lid, met betrekking
      tot de uitvoering van de werkzaamheden als bedoeld in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het behandelen van bezwaarschriften tegen
      besluiten als bedoeld in [artikel 2][ref1], waaronder begrepen het nemen van beslissingen op bezwaarschriften, voor
      zover het besluit waartegen het bezwaar zich richt, niet door hem krachtens mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034893#Artikel2
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034893
        artikel: '2'
  - number: '3.2'
    text: |-
      Aan de inspecteur-generaal wordt tevens machtiging verleend voor het behandelen van beroepschriften en voor het
      voeren van verweer in de gevallen waarin (hoger) beroep is ingesteld tegen een beslissing op bezwaar als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De inspecteur-generaal kan voor de in de [artikelen 2][ref1] en [3][ref2] bedoelde aangelegenheden ondermandaat en
      machtiging verlenen aan onder hem ressorterende functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0034893#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034893#Artikel3
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034893
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034893
        artikel: '3'
  - number: '4.2'
    text: |-
      De inspecteur-generaal kan de volmacht, bedoeld in [artikel 2, tweede lid][ref1], verlenen aan onder hem
      ressorterende functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0034893#Artikel2
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034893
        artikel: '2'
  - number: '4.3'
    text: Het verlenen van volmacht, ondermandaat of machtiging alsmede wijziging daarvan, geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel4
  - number: '4.4'
    text: |-
      Een afschrift van een besluit inzake volmacht, ondermandaat en machtiging als bedoeld in het derde lid wordt
      gezonden aan de minister en aan degenen aan wie krachtens het besluit volmacht, ondermandaat of machtiging is
      verleend.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel4
  - number: '5'
    text: |-
      Het krachtens dit mandaat, volmacht en machtiging ondertekenen van stukken geschiedt als volgt: De Minister voor
      Wonen en Rijksdienst, namens deze: (handtekening) (naam functionaris) (functie)
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel5
  - number: '6'
    text: |-
      De ambtenaren van de Inspectie Leefomgeving en Transport, met uitzondering van hen die
      meer in het bijzonder administratieve werkzaamheden uitoefenen, worden aangewezen als
      ambtenaren belast met het toezicht op de naleving van het bepaalde bij of krachtens: - de
      [Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref1];
        - [artikel 70c van de Woningwet][ref2], met uitzondering van de onderwerpen met betrekking tot welke ingevolge
      de [artikelen 70d, eerste lid][ref3], en [71a, eerste lid, onderdeel b, van die wet][ref4] het Centraal
      Fonds voor de Volkshuisvesting, bedoeld in [artikel 71 van die wet][ref5], met het toezicht is belast; –
      [artikel 120, tweede lid, van de Woningwet][ref6];
        - de verordening bouwproducten;
        - de herziene richtlijn energieprestatie gebouwen; voor zover het betreft werkzaamheden aangewezen in de bijlage
      bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0032249
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel71
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032249
      - id: ref2
