        artikel: '1'
  - number: 1.d
    text: |-
      *d. herziene richtlijn energieprestatie gebouwen:* [richtlijn nr. 2010/31](32010L0031)/EU van het Europees
      Parlement en de Raad van 19 mei 2010 betreffende de energieprestatie van gebouwen (herschikking) (PbEU L153);
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
  - number: 1.e
    text: |-
      *verordening bouwproducten:* [verordening nr. 305/2011](32011R0305)/EU van het Europees parlement en de Raad
      van 9 maart 2011 tot vaststelling van geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot
      intrekking van [Richtlijn 89/106/EEG](31989L0106) van de Raad (PbEU L88).
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het nemen van besluiten
      en het verrichten van overige handelingen die verband houden met de aan de minister
      toekomende bevoegdheid tot handhaving, bedoeld in de [artikelen 5.4][ref1], [5.5][ref2] en
      [5.6 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref3]
      en de [artikelen 70d, tweede lid][ref4], [105][ref5] en [120b van de Woningwet][ref6], voor zover
      het betreft werkzaamheden aangewezen in de bijlage bij dit besluit. Het mandaat en de machtiging
      betreffen niet de onderwerpen met betrekking tot welke ingevolge de artikelen 70d, eerste lid, en
      [71a, eerste lid, onderdeel b, van de Woningwet][ref7] het Centraal Fonds voor de Volkshuisvesting, bedoeld in
      [artikel 71 van die wet][ref8], met het toezicht is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref8]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel2
    references:
