  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
  - number: 1.a
    text: '*minister:* Minister voor Wonen en Rijksdienst;'
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
  - number: 1.b
    text: '*ministerie:* ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      *inspecteur-generaal:* inspecteur-generaal Leefomgeving en Transport, bedoeld in
      [artikel 1, tweede lid, van het Instellingsbesluit Inspectie Leefomgeving en Transport][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031032#Artikel1
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel1
    references:
      - id: ref1
