      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst, en werkt terug tot en met 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel11
  - number: '11.2'
    text: |-
      Dit besluit heeft geen betrekking op de behandeling van gerechtelijke procedures inzake de aangelegenheden, bedoeld
      in de [artikelen 2][ref1], [3][ref2] en [6][ref3], die op 1 januari 2014 aanhangig zijn.


