        artikel: '6'
  - number: '8.1'
    text: |-
      De inspecteur-generaal informeert de minister over zwaarwegende en politiek-bestuurlijk gevoelige omstandigheden en
      gebeurtenissen die betrekking hebben op de gemandateerde bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op bevoegdheden die zijn verleend op basis van volmacht en
      machtiging.
    url: https://wetten.overheid.nl/BWBR0034893/2015-01-01#Artikel8
