    text: |-
      Het krachtens dit mandaat, volmacht en machtiging ondertekenen van stukken geschiedt als volgt:

      De Minister voor Wonen en Rijksdienst,

      namens deze:

      (handtekening)

      (naam functionaris)

      (functie)
    url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#Artikel5
  - number: '6'
    text: |-
      De ambtenaren van de Inspectie Leefomgeving en Transport, met uitzondering van hen die meer in het bijzonder
      administratieve werkzaamheden uitoefenen, worden aangewezen als ambtenaren belast met het toezicht op de naleving
      van het bepaalde bij of krachtens [artikel 120, tweede lid, van de Woningwet][ref1], voortvloeiend uit de
      verordening bouwproducten, [verordening (EU) 2019/1020](32920R2019) en de herziene richtlijn energieprestatie
      gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
  - number: '7'
    text: |-
      De inspecteur-generaal is niet bevoegd om zelfstandig verzoeken in het kader van
      de [Wet openbaarheid van bestuur][ref1], de [Wet nationale ombudsman][ref2] of de
      [Wet bescherming persoonsgegevens][ref3], voor zover die verband houden met de uitvoering van de in de
      [artikelen 2][ref4], [3][ref5] en [6][ref6] van dit besluit bedoelde taken namens de minister af te doen.
      Dergelijke zaken worden door de inspecteur-generaal inhoudelijk voorbereid en ter afdoening, door tussenkomst van
      de Directie Constitutionele Zaken en Wetgeving van het ministerie, aan de secretaris-generaal van het ministerie
      onderscheidenlijk de minister voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
