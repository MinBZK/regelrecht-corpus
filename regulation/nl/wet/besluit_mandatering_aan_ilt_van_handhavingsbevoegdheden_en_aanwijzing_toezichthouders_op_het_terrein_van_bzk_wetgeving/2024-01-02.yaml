  - number: '3'
    text: |-
      1 Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het behandelen van bezwaarschriften tegen
      besluiten als bedoeld in [artikel 2][ref1], waaronder begrepen het nemen van beslissingen op bezwaarschriften, voor
      zover het besluit waartegen het bezwaar zich richt, niet door hem krachtens mandaat is genomen.

      2 Aan de inspecteur-generaal wordt tevens machtiging verleend voor het behandelen van beroepschriften en voor het
      voeren van verweer in de gevallen waarin (hoger) beroep is ingesteld tegen een beslissing op bezwaar als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034893#Artikel2
    url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034893
        artikel: '2'
  - number: '4'
    text: |-
      1 De inspecteur-generaal kan voor de in de [artikelen 2][ref1] en [3][ref2] bedoelde aangelegenheden ondermandaat
      en machtiging verlenen aan onder hem ressorterende functionarissen.

      2 De inspecteur-generaal kan de volmacht, bedoeld in [artikel 2, tweede lid][ref3], verlenen aan onder hem
      ressorterende functionarissen.

      3 Het verlenen van volmacht, ondermandaat of machtiging alsmede wijziging daarvan, geschiedt schriftelijk.

      4 Een afschrift van een besluit inzake volmacht, ondermandaat en machtiging als bedoeld in het derde lid wordt
      gezonden aan de minister en aan degenen aan wie krachtens het besluit volmacht, ondermandaat of machtiging is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0034893#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034893#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034893#Artikel2
