  - number: '8'
    text: |-
      1 De inspecteur-generaal informeert de minister over zwaarwegende en politiek-bestuurlijk gevoelige omstandigheden
      en gebeurtenissen die betrekking hebben op de gemandateerde bevoegdheden.

      2 Het eerste lid is van overeenkomstige toepassing op bevoegdheden die zijn verleend op basis van volmacht en
      machtiging.
