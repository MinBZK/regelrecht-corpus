preamble:
  text: |-
    Gelet op afdeling 10.1.1 van de Algemene wet bestuursrecht, artikel 2, vierde lid, van het Instellingsbesluit
    Inspectie Leefomgeving en Transport, de artikelen 5.1, 5.4, 5.5 en 5.6 van de Wet normering bezoldiging
    topfunctionarissen publieke en semipublieke sector en de artikelen 70d, tweede lid, 93, 105 en 120b van de
    Woningwet;

    Gezien de schriftelijke instemming van de inspecteur-generaal Leefomgeving en Transport;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* Minister voor Wonen en Rijksdienst;

      b. *ministerie:* ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *inspecteur-generaal:* inspecteur-generaal Leefomgeving en Transport, bedoeld in
      [artikel 1, tweede lid, van het Instellingsbesluit Inspectie Leefomgeving en Transport][ref1];

      d. *d. herziene richtlijn energieprestatie gebouwen:* [richtlijn nr. 2010/31](32010L0031)/EU van het Europees
      Parlement en de Raad van 19 mei 2010 betreffende de energieprestatie van gebouwen (herschikking) (PbEU L153);

      e. *verordening bouwproducten:* [verordening nr. 305/2011](32011R0305)/EU van het Europees parlement en de Raad
      van 9 maart 2011 tot vaststelling van geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot
      intrekking van [Richtlijn 89/106/EEG](31989L0106) van de Raad (PbEU L88);

      f. *verordening (EU) 2019/1020:* [verordening (EU) 2019/1020](32920R2019) van het Europees Parlement en de Raad
      van 20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/
      EG](32004L0042) en de [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019,
      L169).


      [ref1]: https://wetten.overheid.nl/BWBR0031032#Artikel1
    url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031032
        artikel: '1'
  - number: '2'
    text: |-
      1 Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het nemen van besluiten en het verrichten
      van overige handelingen die verband houden met de aan de Minister toekomende bevoegdheden tot handhaving als
      bedoeld in [artikel 93a, derde lid][ref1], [93c][ref2] en [artikel 120b van de Woningwet][ref3] van overtredingen
      voortvloeiend uit de verordening bouwproducten, de [verordening (EU) 2019/1020](32920R2019) en de herziene
      richtlijn energieprestatie gebouwen.

      2 Aan de inspecteur-generaal wordt volmacht verleend voor het verrichten van rechtshandelingen die verband
      houden met de invordering van verbeurde dwangsommen en van gemaakte kosten voor bestuursdwang als bedoeld in
      [artikel 5:25 van de Algemene wet bestuursrecht][ref4], voor zover deze verband houden met de bevoegdheid, bedoeld
      in het eerste lid.

      3 Het op grond van dit besluit verleende mandaat omvat mede de bevoegdheid tot het vaststellen, wijzigen of
      intrekken van beleidsregels met betrekking tot de uitoefening van de bevoegdheid bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel93a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel93c
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel525
    url: https://wetten.overheid.nl/BWBR0034893/2024-01-02#Artikel2
