  - number: 7.1.2
    text: |-
      Voor de toepassing van de [paragrafen 1][ref1] en [2][ref2] wordt de exclusieve economische zone niet tot enig
      oppervlaktewaterlichaam gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.1
    text: |-
      Onder de naam verontreinigingsheffing vindt een heffing plaats ter zake van lozen op een oppervlaktewaterlichaam in
      beheer bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Ter zake van lozen in een oppervlaktewaterlichaam in beheer bij een waterschap kan het algemeen bestuur van dat
      waterschap onder de naam verontreinigingsheffing een heffing instellen.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.3
    text: 'Aan de heffing kunnen worden onderworpen:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.3.a
    text: 'ter zake van lozen vanuit een bedrijfsruimte of woonruimte: degene die het gebruik heeft van die ruimte;'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.3.b
    text: |-
      ter zake van lozen met behulp van een riolering of een zuiveringtechnisch werk: degene bij wie die riolering of dat
      zuiveringtechnisch werk in beheer is;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.3.c
    text: 'ter zake van andere lozingen dan als bedoeld in onderdeel a of b: degene die loost.'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.4
    text: 'Ter zake van de verontreinigingsheffing van een waterschap wordt voor de toepassing van het derde lid, onderdeel a:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.4.a
    text: |-
      gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door de
      heffingsambtenaar aangewezen lid van dat huishouden;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.4.b
    text: |-
      gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven, met dien verstande dat degene die het deel in gebruik heeft gegeven,
      bevoegd is de heffing als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.4.c
    text: |-
      het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als
      gebruik door degene die die ruimte ter beschikking heeft gesteld, met dien verstande dat degene die de ruimte
      ter beschikking heeft gesteld, bevoegd is de heffing als zodanig te verhalen op degene aan wie de ruimte ter
      beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.2.5
    text: |-
      De opbrengst van de verontreinigingsheffing komt ten goede aan de bekostiging van het beheer van het watersysteem
      van de beheerder.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Voor de verontreinigingsheffing geldt als grondslag de hoeveelheid en hoedanigheid van de stoffen die in een
      kalenderjaar worden geloosd. Als heffingsmaatstaf geldt de vervuilingswaarde van de stoffen die in een kalenderjaar
      worden geloosd, uitgedrukt in vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Eén vervuilingseenheid vertegenwoordigt met betrekking tot: het zuurstofverbruik: het jaarlijks verbruik van 54,8
      kilogram zuurstof.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.3
  - number: 7.5.1
    text: |-
      Het aantal vervuilingseenheden wordt berekend met behulp van door de heffingplichtige, gedurende elk etmaal van
      het kalenderjaar ondernomen meting, bemonstering en analyse verkregen gegevens, overeenkomstig bij ministeriële
      regeling, onderscheidenlijk belastingverordening te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Op aanvraag van de heffingplichtige staat de heffingsambtenaar onder nader te stellen voorwaarden toe dat van
      de frequentie van meting, bemonstering en analyse, bedoeld in het eerste lid, wordt afgeweken indien door de
      heffingplichtige aannemelijk wordt gemaakt dat voor de berekening van de vervuilingswaarde met gegevens over
      meting, bemonstering en analyse van een beperkt aantal etmalen kan worden volstaan. Deze beslissing wordt genomen
      bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.5
  - number: 7.5.3
    text: |-
      De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden geloosd, geschiedt op basis
      van de som van het chemisch zuurstofverbruik en het zuurstofverbruik door omzetting van stikstofverbindingen.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.5
  - number: 7.5.4
    text: |-
      Indien de uitkomst van de methode tot bepaling van het chemisch zuurstofverbruik in belangrijke mate is beïnvloed
      door biologisch niet of nagenoeg niet afbreekbare stoffen, wordt op die uitkomst een correctie toegepast,
      overeenkomstig bij ministeriële regeling, onderscheidenlijk belastingverordening te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.5
  - number: 7.5.5
    text: |-
      [Artikel 122h, eerste, vijfde en zesde lid][ref1], en [artikel 122i tot en met 122k van de Waterschapswet][ref2]
      zijn van overeenkomstige toepassing. [Artikel 122i, eerste lid, van de Waterschapswet][ref3] is eveneens van
      overeenkomstige toepassing op lozingen vanuit een zuiveringtechnisch werk.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122h
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel122i
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel122i
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122h
      - id: ref2
        bwb_id: BWBR0005108
        artikel: 122i
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 122i
  - number: 7.6.1
    text: |-
      Het tarief van de heffing ter zake van lozingen op een oppervlaktewaterlichaam in beheer bij het Rijk bedraagt
      € 37,28 per vervuilingseenheid.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.6
  - number: 7.6.2
    text: |-
      In afwijking van het eerste lid bedraagt het tarief per vervuilingseenheid van de heffing ter zake van lozingen op
      een oppervlaktewaterlichaam in beheer bij het Rijk vanuit een zuiveringtechnisch werk voor het biologisch zuiveren
      van huishoudelijk afvalwater 50% van het in het eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.6
  - number: 7.6.3
    text: |-
      Het tarief van de heffing ter zake van lozingen op een oppervlaktewaterlichaam in beheer bij een waterschap
      is gelijk aan het door dat waterschap voor het desbetreffende belastingjaar vastgestelde tarief van de
      zuiveringsheffing, bedoeld in [artikel 122d van de Waterschapswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122d
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122d
  - number: 7.6.4
    text: |-
      In afwijking van het eerste lid is van heffing vrijgesteld de in het tweede lid bedoelde lozing indien deze
      plaatsvindt anders dan door de beheerder, mits de hoeveelheid afvalstoffen, verontreinigende of schadelijke stoffen
      niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.6
  - number: 7.8.1
    text: 'Van verontreinigingsheffing zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.8
  - number: 7.8.1.a
    text: lozingen die plaatsvinden met behulp van een openbaar vuilwaterriool;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.8
  - number: 7.8.1.b
    text: |-
      lozingen van stoffen vanuit een zuiveringtechnisch werk door een beheerder op een oppervlaktewaterlichaam dat bij
      hem in beheer is;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.8
  - number: 7.8.1.c
    text: |-
      lozingen van stoffen afkomstig uit een zuiveringtechnisch werk anders dan door de beheerder, mits het lozen
      plaatsvindt op een oppervlaktewaterlichaam dat bij die beheerder in beheer is en de hoeveelheid afvalstoffen,
      verontreinigende of schadelijke stoffen niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.8
  - number: 7.8.2
    text: |-
      Voorts kunnen bij of krachtens algemene maatregel van bestuur onderscheidenlijk bij belastingverordening nadere
      regels worden gesteld met betrekking tot de verontreinigingsheffing.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.8
  - number: 7.10.1
    text: |-
      De verontreinigingsheffing ter zake van lozen op een oppervlaktewaterlichaam in beheer bij het Rijk wordt door Onze
      Minister bij wege van aanslag geheven. De heffing wordt geheven over het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.10
  - number: 7.10.2
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde, wordt de in het eerste lid bedoelde heffing geheven met
      overeenkomstige toepassing van de [Algemene wet][ref1], met uitzondering van de [artikelen 2, vierde lid][ref2],
      [37 tot en met 39][ref3], [47a][ref4], [48][ref5], [52][ref6], [53][ref7], [54][ref8], [76][ref9],
      [80, tweede, derde en vierde lid][ref10], [82][ref11], [84][ref12], [86][ref13] en [87 van die wet][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref12]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref13]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref14]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
