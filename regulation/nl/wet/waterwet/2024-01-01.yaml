preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de overheid zich bij de zorg voor de bewoonbaarheid van het land alsmede
    de bescherming en verbetering van het milieu, waar die zorg gestalte krijgt in het waterbeheer, voor grote opgaven
    gesteld ziet, en dat het met het oog op een doeltreffende en doelmatige aanpak van het waterbeheer wenselijk is om
    het wettelijke instrumentarium te stroomlijnen en te moderniseren en daarbij het integraal beheer van watersystemen
    centraal te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *deltafonds:* fonds,
      bedoeld in [artikel 7.22a][ref1];
        - *deltaprogramma:* programma, bedoeld in [artikel 4.9][ref2];
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *Onze Ministers:* Onze Minister van Infrastructuur en Waterstaat tezamen met Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit, ieder voor zover het aangelegenheden betreft die mede tot zijn verantwoordelijkheid behoren;
        - *oppervlaktewaterlichaam:* oppervlaktewaterlichaam als bedoeld in de [Omgevingswet][ref3];
        - *zuiveringtechnisch werk:* zuiveringtechnisch werk als bedoeld in de [Omgevingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885
      [ref4]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel1.1
    references:
