        artikel: '52'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: '54'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref10
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref11
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref12
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref13
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref14
