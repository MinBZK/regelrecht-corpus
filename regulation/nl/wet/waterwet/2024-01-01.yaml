        artikel: '87'
  - number: 7.10.3
    text: |-
      Voor de toepassing van de [Algemene wet ][ref1] treedt Onze Minister in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 7.10.4
    text: |-
      Voorts treden voor de toepassing van de [Algemene wet ][ref1] de daartoe bij besluit van Onze Minister
      aangewezen ambtenaar of ambtenaren in de plaats van het bestuur van 's Rijksbelastingen en van de inspecteur,
      onderscheidenlijk van de ambtenaren van de rijksbelastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 7.10.5
    text: Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Indien een bedrijfs- of woonruimte of een zuiveringtechnisch werk bij meer dan één persoon in gebruik of beheer is,
      kan de heffingsambtenaar een belastingaanslag inzake de in [artikel 7.10, eerste lid][ref1], bedoelde heffing ter
      zake van die ruimte of van dat zuiveringtechnisch werk ten name van één van die personen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.11.2
    text: |-
      De heffingsambtenaar is bevoegd voor een zelfde in [artikel 7.2, derde lid][ref1], bedoelde heffingplichtige,
      bestemde belastingaanslagen van dezelfde soort op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '7.12'
    text: |-
      De door Onze Minister aangewezen ambtenaren die voor de toepassing van de [Algemene wet][ref1] in de
      plaats treden van de ambtenaren van de rijksbelastingdienst, zijn, voor zover dit voor het heffen van de in
      [artikel 7.10, eerste lid][ref2], bedoelde heffing redelijkerwijs nodig is, bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.12.a
    text: |-
      elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering van
      een woonruimte zonder toestemming van de gebruiker of de gebruikers, te betreden;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.12
  - number: 7.12.b
    text: monsters te nemen ter zake van lozingen op oppervlaktewaterlichamen in beheer bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.12
  - number: 7.13.1
    text: |-
      De heffing ter zake van lozen op een oppervlaktewaterlichaam in beheer bij het Rijk wordt ingevorderd met
      toepassing van de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2] als was deze
      heffing een rijksbelasting in de zin van [artikel 2, eerste lid, onderdeel a, van de Invorderingswet 1990][ref3] en
      geschiedt door de zorg van de ontvanger, bedoeld in artikel 2, eerste lid, onderdeel i, van die wet, alsmede door
      de overige in die wet genoemde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 7.13.2
    text: |-
      Een voorlopige aanslag voor de in het eerste lid bedoelde heffing waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, is invorderbaar in zoveel gelijke termijnen als er na de maand
      die in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn
      vervalt één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.13
  - number: 7.13.3
    text: |-
      Indien toepassing van het tweede lid niet leidt tot meer dan twee maandelijkse termijnen, is de in dat lid bedoelde
      belastingaanslag twee maanden na de dagtekening van het aanslagbiljet invorderbaar.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.13
  - number: 7.22a.1
    text: Er is een deltafonds.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22a
  - number: 7.22a.2
    text: 'Het deltafonds heeft ten doel de financiering en bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22a
  - number: 7.22a.2.a
    text: |-
      maatregelen en voorzieningen ter voorkoming en waar nodig beperking van overstromingen, wateroverlast en
      waterschaarste;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22a
  - number: 7.22a.2.b
    text: |-
      maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22a
  - number: 7.22a.2.c
    text: |-
      het inwinnen, bewerken en verspreiden van met de onderdelen a en b samenhangende gegevens en het verrichten van met
      de onderdelen a en b samenhangende onderzoeken.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22a
  - number: 7.22b.1
    text: |-
      Het deltafonds is een begrotingsfonds als bedoeld in
      [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22b
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 7.22b.2
    text: Onze Minister beheert het deltafonds.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22b
  - number: 7.22c
    text: 'De ontvangsten van het deltafonds zijn:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22c
  - number: 7.22c.a
    text: een bijdrage ten laste van de begroting van het Ministerie van Infrastructuur en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22c
  - number: 7.22c.b
    text: bijdragen ten laste van andere begrotingen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22c
  - number: 7.22c.c
    text: bijdragen van derden;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22c
  - number: 7.22c.d
    text: andere ontvangsten in het kader van het bereiken van de doelen van het deltafonds.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22c
  - number: 7.22d.1
    text: 'Ten laste van het deltafonds komen de uitgaven ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.1.a
    text: |-
      aanleg, verbetering, beheer, onderhoud en bediening van waterstaatswerken die bij het Rijk in beheer zijn of zullen
      zijn, ter voorkoming en waar nodig beperking van overstromingen en waterschaarste;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.1.b
    text: |-
      maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.1.c
    text: het inwinnen, bewerken en verspreiden van met de onderdelen a en b samenhangende gegevens;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.1.d
    text: met de onderdelen a en b samenhangende onderzoeken.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.2
    text: 'Onze Minister kan uit het deltafonds subsidies verstrekken ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.2.a
    text: |-
      aanleg, verbetering, beheer, onderhoud en bediening van waterstaatswerken die niet bij het Rijk in beheer zijn of
      zullen zijn, ter voorkoming en waar nodig beperking van overstromingen en waterschaarste;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.2.b
    text: |-
      maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.2.c
    text: met de onderdelen a en b samenhangende onderzoeken.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.3
    text: |-
      Op subsidies die ten laste komen van het deltafonds zijn de [artikelen 2][ref1] en
      [4 tot en met 7 van de Kaderwet subsidies I en M][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032789#Artikel4
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032789
        artikel: '4'
  - number: 7.22d.4
    text: |-
      Subsidies als bedoeld in het tweede lid die worden verleend ten laste van een
      begroting die nog niet is vastgesteld, worden verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7.22d.5
    text: |-
      Ten laste van het deltafonds kunnen eveneens uitgaven worden gebracht ten behoeve van maatregelen en voorzieningen
      als bedoeld in [artikel 7.22a, tweede lid, onderdelen a en b][ref1], alsmede ten behoeve van het inwinnen,
      verspreiden en bewerken van gegevens en het doen van onderzoek als bedoeld in artikel 7.22a, tweede lid, onderdeel
      c, met betrekking tot buiten het Nederlandse grondgebied gelegen delen van de stroomgebieddistricten Eems, Maas,
      Rijn en Schelde.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.22d.6
    text: |-
      Ten laste van het deltafonds komen tevens uitgaven ten behoeve van het bureau ter ondersteuning van de
      werkzaamheden van de deltacommissaris, de huisvestingskosten van het bureau en verdere aan de taakvervulling van de
      deltacommissaris verbonden uitgaven.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.22d.7
    text: |-
      Ten laste van het deltafonds komen voorts andere uitgaven en subsidies in het kader van het bereiken van de doelen
      van dat fonds.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.22d
  - number: 7.23.1
    text: 'Onze Minister verleent aan de beheerder op aanvraag een subsidie voor het treffen van maatregelen, indien:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.23.1.a
    text: 'de maatregelen nodig zijn vanwege:'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.23.1.a.1°
    text: |-
      wijziging van krachtens [artikel 2.15, eerste lid, aanhef en onder d, van de Omgevingswet][ref1] gestelde
      omgevingswaarden, de krachtens artikel 2.15, derde lid, van de Omgevingswet voor de toepassing van het eerste lid,
      onder d, van die wet gestelde regels, of de krachtens [artikel 20.3, eerste lid, van de Omgevingswet][ref2] over de
      uitvoering van de monitoring voor die omgevingswaarden gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel20
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '20'
  - number: 7.23.1.a.2°
    text: |-
      de overgang van de op grond van [artikel 2.2][ref1] dan wel krachtens [artikel 2.3][ref2] of
      [2.12, vierde lid][ref3], gestelde regels, zoals die luidden op 31 december 2016, naar de normen in
      [bijlage III][ref4] dan wel de krachtens artikel 2.3 gestelde regels, zoals die luidden per 1 januari 2017; of


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0025458
  - number: 7.23.1.a.3°
    text: |-
      wijziging van de krachtens [artikel 2.3][ref1] of [2.12, vierde lid][ref2], gestelde regels, zoals deze artikelen
      luidden op 31 december 2016;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 7.23.1.b
    text: |-
      de maatregelen voor het kalenderjaar waarin de subsidie wordt verstrekt zijn opgenomen in een jaarlijks door Onze
      Minister vast te stellen programma; en
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.23.1.c
    text: |-
      bij maatregelen die betrekking hebben op een deel van een primaire waterkering als bedoeld in de Omgevingswet
      waarop een krachtens [artikel 20.1, derde lid, van de Omgevingswet][ref1] gestelde andere parameter van toepassing
      is en nodig zijn vanwege het eerste lid, onderdeel a, onder 1° of 2°, die andere parameter is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '20'
  - number: 7.23.2
    text: |-
      De subsidie, bedoeld in het eerste lid, wordt verleend voor negentig procent van de geraamde kosten van een sober
      en doelmatig ontwerp van de maatregelen. Bij ministeriële regeling worden nadere regels gesteld met betrekking tot
      de kostenraming en de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.23.3
    text: |-
      De [artikelen 2][ref1] en [4 tot en met 7 van de Kaderwet subsidies I en M][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032789#Artikel4
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0032789
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032789
        artikel: '4'
  - number: 7.23.4
    text: |-
      Bij de voorbereiding van het programma, bedoeld in het eerste lid, en van de regeling, bedoeld in het tweede lid,
      worden de besturen van de waterschappen gehoord.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.23.5
    text: |-
      Bij algemene maatregel van bestuur worden de maatregelen aangewezen waarvoor in afwijking van het tweede lid
      subsidie wordt verleend voor honderd procent van de kosten van uitvoering. Daarbij worden de aard en omvang van
      deze maatregelen aangeduid en de locaties en de betrokken beheerders vermeld.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.23
  - number: 7.24.1
    text: |-
      Een waterschap is een jaarlijkse bijdrage aan Onze Minister verschuldigd ter bestrijding van de kosten verbonden
      aan de verstrekking van subsidies voor maatregelen die nodig zijn vanwege:
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
  - number: 7.24.1.a
    text: |-
      wijziging van krachtens [artikel 2.15, eerste lid, aanhef en onder d, van de Omgevingswet][ref1] gestelde
      omgevingswaarden, de krachtens artikel 2.15, derde lid, van de Omgevingswet voor de toepassing van het eerste lid,
      onder d, van die wet gestelde regels of de krachtens [artikel 20.3, eerste lid, van de Omgevingswet][ref2] over de
      uitvoering van de monitoring voor die omgevingswaarden gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel20
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '20'
  - number: 7.24.1.b
    text: |-
      de overgang van de op grond van [artikel 2.2][ref1] dan wel krachtens [artikel 2.3][ref2] of
      [2.12, vierde lid][ref3], gestelde regels, zoals die luidden op 31 december 2016, naar de normen in
      [bijlage III][ref4] dan wel de krachtens artikel 2.3 gestelde regels, zoals die luidden per 1 januari 2017; of


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
    references:
