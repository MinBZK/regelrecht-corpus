        hoofdstuk: IV
  - number: 7.24.3
    text: |-
      De peildatum, bedoeld in het tweede lid, is 1 januari 2010 voor de jaarlijkse bijdrage voor de kalenderjaren 2011
      tot en met 2014 en voor elke daaropvolgende aaneengesloten periode van vier kalenderjaren telkens 1 januari van het
      laatste kalenderjaar dat voorafgaat aan de betrokken periode.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
  - number: 7.24.4
    text: |-
      Het in het tweede lid aan de som van R1 en R2 gestelde maximum bedraagt in 2014 131 x 106 euro’s en vanaf 2015 181
      x 106 euro’s, met dien verstande dat met ingang van 2016 het laatstgenoemde bedrag ten opzichte van het loon- en
      prijspeil van 2011 jaarlijks wordt geĩndexeerd volgens de Index Bruto Overheidsinvesteringen, zoals toegepast door
      Onze Minister van Financiën in de Voorjaarsnota.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
  - number: 7.24.5
    text: |-
      Middelen die bestemd zijn voor subsidies ten behoeve van maatregelen als bedoeld in het eerste lid, kunnen tevens
      worden besteed aan:
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
  - number: 7.24.5.a
    text: |-
      uitgaven van het Rijk ten behoeve van zodanige maatregelen, mits deze uitgaven de kosten van een subsidie voor
      zodanige maatregelen niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
  - number: 7.24.5.b
    text: |-
      uitgaven of subsidies ten behoeve van een of meer andere maatregelen, al dan niet zijnde waterbeheermaatregelen,
      die tezamen een vergelijkbaar beschermingsniveau bieden, indien een maatregel als bedoeld in het eerste lid zeer
      kostbaar of maatschappelijk zeer ingrijpend is en de uitgaven of subsidies voor dergelijke andere maatregelen de
      kosten van een subsidie voor een maatregel als bedoeld in het eerste lid niet te boven gaan, waarbij zo nodig kan
      worden afgeweken van de [artikelen 7.22a][ref1] en [7.22d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.24.5.c
    text: |-
      eenmalige subsidies voor maatregelen die nodig zijn om bij algemene maatregel van bestuur aan te wijzen
      andere dan primaire waterkeringen in overeenstemming te brengen met de omgevingswaarden, bedoeld in
      [artikel 2.13, eerste lid, aanhef en onder a, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '7.25'
    text: |-
      Ten behoeve van de vaststelling van de hoogte van de bijdrage, bedoeld in [artikel 7.24][ref1], verschaft het
      dagelijks bestuur van een waterschap Onze Minister voor 1 maart van het kalenderjaar dat volgt op het kalenderjaar
      waarin de peildatum valt, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7.25.a
    text: het aantal ingezetenen in het gebied van het waterschap op de peildatum, en
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.25
  - number: 7.25.b
    text: |-
      de som van de op basis van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] vastgestelde waarden van de
      gebouwde onroerende zaken in het gebied van het waterschap op de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 7.26.1
    text: |-
      Onze Minister stelt de verplichting tot betaling van de bijdrage, bedoeld in [artikel 7.24][ref1], jaarlijks voor
      1 mei vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7.26.2
    text: |-
      Indien de slotwet van de begroting van het deltafonds daartoe aanleiding geeft, wordt de verplichting tot betaling
      door Onze Minister gewijzigd.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.26
  - number: 7.26.3
    text: |-
      Indien de verplichting tot betaling op grond van het tweede lid wordt gewijzigd, is over de te betalen of terug te
      betalen geldsom geen wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.26
  - number: 7.26.4
    text: |-
      Krachtens het eerste of tweede lid verschuldigde geldsommen kunnen door Onze Minister worden ingevorderd bij
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.26
  - number: 7.26.5
    text: |-
      Onze Minister kan een aan een waterschap terug te betalen geldsom verrekenen met een van hetzelfde waterschap
      krachtens het eerste of tweede lid te vorderen geldsom voor een ander kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel7.26
  - number: '10.3'
    text: |-
      Indien voorafgaand aan de inwerkingtreding van de wet van 14 maart 2018 tot wijziging van de Waterwet
      en van de Wet maritiem beheer BES in verband met de uitvoering van de wijziging van het Protocol van
      1996 bij het Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van
      afval en andere stoffen van 1972 (mariene geo-engineering) (Stb. 98) voor een activiteit als bedoeld in
      [artikel 6.3, eerste lid, onderdeel d][ref1], een watervergunning is verleend, berust deze op artikel 6.3, eerste
      lid, aanhef en onderdeel d, mits de activiteit in bijlage 4 bij het op 7 november 1996 te Londen tot stand gekomen
      Protocol bij het Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval
      en andere stoffen van 1972 (Trb. 1998, 134) is aangemerkt als een activiteit waarvoor een vergunning kan worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.4.1
    text: |-
      Onze Minister zendt binnen vijf jaar na de volledige inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel10.4
  - number: 10.4.2
    text: |-
      Onverminderd het eerste lid zendt Onze Minister vóór 1 januari 2025 aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van de [artikelen 7.23 tot en met 7.26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: '10.5'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Waterwet.'
    url: https://wetten.overheid.nl/BWBR0025458/2024-01-01#Artikel10.6
