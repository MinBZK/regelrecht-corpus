preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de overheid zich bij de zorg voor de bewoonbaarheid van het land alsmede
    de bescherming en verbetering van het milieu, waar die zorg gestalte krijgt in het waterbeheer, voor grote opgaven
    gesteld ziet, en dat het met het oog op een doeltreffende en doelmatige aanpak van het waterbeheer wenselijk is om
    het wettelijke instrumentarium te stroomlijnen en te moderniseren en daarbij het integraal beheer van watersystemen
    centraal te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *beheer:*
      overheidszorg met betrekking tot een of meer afzonderlijke watersystemen of onderdelen daarvan, gericht op de in
      [artikel 2.1][ref1] genoemde doelstellingen;
        - *beheerder:* bevoegd bestuursorgaan van het overheidslichaam dat belast is met beheer;
        - *bergingsgebied:* krachtens de [Wet ruimtelijke ordening][ref2] voor waterstaatkundige doeleinden bestemd gebied,
      niet zijnde een oppervlaktewaterlichaam of onderdeel daarvan, dat dient ter verruiming van de bergingscapaciteit
      van een of meer watersystemen en ook als bergingsgebied op de legger is opgenomen;
        - *beschermingszone:* aan een waterstaatswerkgrenzende zone, waarin ter bescherming van dat werk voorschriften en
      beperkingen kunnen gelden;
        - *bevoegd gezag:* tot verlening van een watervergunning bevoegd bestuursorgaan, in voorkomend geval met toepassing
      van [artikel 6.17][ref3];
        - *buitenwater:* water van een oppervlaktewaterlichaam waarvan de waterstand direct invloed ondergaat bij hoge
      stormvloed, bij hoog opperwater van een van de grote rivieren, bij hoog water van het IJsselmeer of het Markermeer,
      dan wel bij een combinatie daarvan, alsmede het Volkerak-Zoommeer, het Grevelingenmeer, het getijdedeel van de
      Hollandsche IJssel en de Veluwerandmeren;
        - *deltafonds:* fonds, bedoeld in [artikel 7.22a][ref4];
        - *deltaprogramma:* programma, bedoeld in [artikel 4.9][ref5];
        - *dijktraject:* gedeelte van een primaire waterkering dat afzonderlijk genormeerd is;
        - *faalkans:* kans op verlies van waterkerend vermogen van een dijktraject waardoor de hydraulische belasting op
      een achterliggend dijktraject substantieel wordt verhoogd;
        - *grondwater:* water dat vrij onder het aardoppervlak voorkomt, met de daarin aanwezige stoffen;
        - *grondwaterlichaam:* samenhangende grondwatermassa;
        - *infiltreren van water:* in de bodem brengen van water, ter aanvulling van het grondwater, in samenhang met het
      onttrekken van grondwater;
        - *kaderrichtlijn water:* [richtlijn nr. 2000/60/EG](32000L0060) van het Europees Parlement en de Raad van de
      Europese Unie van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het
      waterbeleid (PbEG L 327);
        - *legger:* legger als bedoeld in [artikel 5.1][ref6];
        - *onttrekken van grondwater:* onttrekken van grondwater door middel van een onttrekkingsinrichting;
        - *onttrekkingsinrichting:* inrichting of werk, bestemd voor het onttrekken van grondwater;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *Onze Ministers:* Onze Minister van Infrastructuur en Milieu tezamen met Onze Minister van Economische Zaken,
      ieder voor zover het aangelegenheden betreft die mede tot zijn verantwoordelijkheid behoren;
        - *openbaar vuilwaterriool:* voorziening voor de inzameling en het transport van stedelijk afvalwater, in beheer
      bij een gemeente of een rechtspersoon die door een gemeente met het beheer is belast;
        - *oppervlaktewaterlichaam:* samenhangend geheel van vrij aan het aardoppervlak voorkomend water, met de daarin
      aanwezige stoffen, alsmede de bijbehorende bodem, oevers en, voor zover uitdrukkelijk aangewezen krachtens deze
      wet, drogere oevergebieden, alsmede flora en fauna;
        - *overstromingskans:* kans op verlies van waterkerend vermogen van een dijktraject waardoor het door het
      dijktraject beschermde gebied zodanig overstroomt dat dit leidt tot dodelijke slachtoffers of substantiële
      economische schade;
        - *primaire waterkering:* waterkering die beveiliging biedt tegen overstroming door buitenwater;
        - *regionale wateren:* watersystemen of onderdelen daarvan die niet in beheer zijn bij het Rijk;
        - *rijkswateren:* watersystemen of onderdelen daarvan die in beheer zijn bij het Rijk;
        - *stedelijk afvalwater:* huishoudelijk afvalwater of een mengsel daarvan met bedrijfsafvalwater, afvloeiend
      hemelwater, grondwater of ander afvalwater;
        - *stroomgebiedbeheerplan:* plan als bedoeld in artikel 13 van de kaderrichtlijn water;
        - *stroomgebieddistrict:* gebied als bedoeld in artikel 2, onderdeel 15, van de kaderrichtlijn water;
        - *VN-Zeerechtverdrag:* het op 10 december 1982 te Montego-Bay totstandgekomen Verdrag inzake het recht van de zee
      (Trb. 1983, 83);
        - *waterbeheer:* de overheidszorg die is gericht op de in [artikel 2.1][ref7] genoemde doelstellingen;
        - *waterstaatswerk:* oppervlaktewaterlichaam, bergingsgebied, waterkering of ondersteunend kunstwerk;
        - *watersysteem:* samenhangend geheel van een of meer oppervlaktewaterlichamen en grondwaterlichamen, met
      bijbehorende bergingsgebieden, waterkeringen en ondersteunende kunstwerken;
        - *watervergunning:* vergunning als bedoeld in de [artikelen 6.2][ref8], [6.3][ref9], [6.4][ref10], [6.5][ref11],
      [6.13][ref12], [6.18][ref13] of [6.19][ref14];
        - *zee:* mariene wateren, met uitzondering van de binnenwateren van staten, met inbegrip van de zeebodem en
      ondergrond daarvan;
        - *zuiveringtechnisch werk:* werk voor het zuiveren van stedelijk afvalwater, in exploitatie bij een waterschap
      of gemeente, dan wel een rechtspersoon die door het bestuur van een waterschap met de zuivering van stedelijk
      afvalwater is belast, met inbegrip van het bij dat werk behorende werk voor het transport van stedelijk afvalwater.


