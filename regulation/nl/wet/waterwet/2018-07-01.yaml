  - number: 7.24.2
    text: |-
      De jaarlijkse bijdrage wordt berekend volgens de formule: B = 0,50 x R1 (I/IT + WG/WGT) + 0,40 x R2 (I/IT + WG/
      WGT), waarin B voorstelt: de te berekenen bijdrage in euro’s; R1 voorstelt: een bedrag in euro’s dat gelijk is aan
      het bedrag dat ten laste van een begroting als bedoeld in [artikel 7.22c, eerste lid, onder a of b][ref1], ten bate
      van de begroting van het desbetreffende jaar wordt toegevoegd aan het deltafonds ten behoeve van subsidies voor
      de maatregelen die zijn aangewezen krachtens [artikel 7.23, vijfde lid][ref2], en dat tezamen met R2 niet hoger is
      dan het in het vierde lid genoemde maximum; R2 voorstelt: een bedrag in euro’s dat gelijk is aan het bedrag dat ten
      laste van een begroting als bedoeld in [artikel 7.22c, eerste lid, onder a of b][ref3], ten bate van de begroting
      van het desbetreffende jaar wordt toegevoegd aan het deltafonds ten behoeve van subsidies voor maatregelen als
      bedoeld in het eerste lid, die niet zijn aangewezen krachtens [artikel 7.23, vijfde lid][ref4], en dat tezamen
      met R1 niet hoger is dan het in het vierde lid genoemde maximum; I voorstelt: het aantal ingezetenen in het gebied
      van het waterschap op de peildatum; IT voorstelt: het aantal ingezetenen in de gebieden van de waterschappen
      tezamen op de peildatum; WG voorstelt: de som van de op basis van hoofdstuk IV van de Wet waardering onroerende
      zaken vastgestelde waarden van de gebouwde onroerende zaken in het gebied van het waterschap op de peildatum; WGT
      voorstelt: de som van de op basis van [hoofdstuk IV van de Wet waardering onroerende zaken][ref5] vastgestelde
      waarden van de gebouwde onroerende zaken in de gebieden van de waterschappen tezamen op de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.24
    references:
