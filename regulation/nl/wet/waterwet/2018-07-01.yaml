  - number: '7.25'
    text: |-
      Ten behoeve van de vaststelling van de hoogte van de bijdrage, bedoeld in [artikel 7.24][ref1], verschaft het
      dagelijks bestuur van een waterschap Onze Minister voor 1 maart van het kalenderjaar dat volgt op het kalenderjaar
      waarin de peildatum valt, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.25
