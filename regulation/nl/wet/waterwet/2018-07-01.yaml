    text: |-
      de maatregelen voor het kalenderjaar waarin de subsidie wordt verstrekt zijn opgenomen in een jaarlijks door Onze
      Minister vast te stellen programma; en
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.23
  - number: 7.23.1.c
    text: |-
      bij maatregelen die betrekking hebben op een dijktraject als bedoeld in [artikel 2.2, eerste lid, tweede zin][ref1],
      en nodig zijn vanwege het eerste lid, onderdeel a, onder 1° of 2°, de norm, vermeld in bijlage II, is overschreden.


