        paragraaf: '5'
  - number: 7.26.2
    text: |-
      Indien de slotwet van de begroting van het deltafonds daartoe aanleiding geeft, wordt de verplichting tot betaling
      door Onze Minister gewijzigd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.26
  - number: 7.26.3
    text: |-
      Indien de verplichting tot betaling op grond van het tweede lid wordt gewijzigd, is over de te betalen of terug te
      betalen geldsom geen wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.26
  - number: 7.26.4
    text: |-
      Krachtens het eerste of tweede lid verschuldigde geldsommen kunnen door Onze Minister worden ingevorderd bij
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.26
  - number: 7.26.5
    text: |-
      Onze Minister kan een aan een waterschap terug te betalen geldsom verrekenen met een van hetzelfde waterschap
      krachtens het eerste of tweede lid te vorderen geldsom voor een ander kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.26
  - number: 8.1.1
    text: 'De beheerder heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.1
  - number: 8.1.1.a
    text: |-
      zorg te dragen voor de bestuursrechtelijke handhaving van het bij of krachtens de [hoofdstukken 5][ref1]
      en [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde, voor zover betrekking hebbend op de door
      hem beheerde watersystemen en de daarbij behorende beschermingszones en van het bij of krachtens
      [titel 12.3 van de Wet milieubeheer][ref4] bepaalde met betrekking tot het brengen van stoffen in een
      oppervlaktewaterlichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
  - number: 8.1.1.b
    text: |-
      gegevens die met het oog op de uitoefening van de onder a bedoelde taak van belang zijn, te verzamelen en te
      registreren;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.1
  - number: 8.1.1.c
    text: klachten te behandelen die betrekking hebben op de naleving van de in onderdeel a bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Met de beheerder worden voor de toepassing van het eerste lid gelijkgesteld gedeputeerde staten, ter zake van
      handelingen als bedoeld in [artikel 6.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      In afwijking van [artikel 8.1, eerste lid][ref1], rusten de daarin bedoelde taken ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel8
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.a
    text: |-
      een vergunningplichtige handeling waarop [artikel 6.17, eerste of tweede lid][ref1], van toepassing is: op het
      bestuursorgaan dat op de vergunningaanvraag beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 8.2.b
    text: |-
      een handeling waarvoor krachtens [artikel 6.7][ref1] een meldings-, meet-, registratie- of opgaveverplichting
      geldt: op het ingevolge dat artikel aangewezen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 8.3.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken 5][ref1] en [6][ref2] of krachtens
      [artikel 10.1][ref3] bepaalde zijn belast de bij besluit van Onze Minister aangewezen ambtenaren. Indien de
      aanwijzing ambtenaren betreft, ressorterende onder een ander ministerie dan dat van Onze Minister, wordt het
      desbetreffende besluit genomen in overeenstemming met Onze Minister wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel10
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.3.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.3
  - number: 8.3.3
    text: |-
      Onze Minister kan regels stellen ten aanzien van de vervulling van de in het eerste lid bedoelde taak. Voor
      krachtens het eerste lid aangewezen ambtenaren die ressorteren onder een ander ministerie dan dat van Onze
      Minister, worden zodanige regels gesteld in overeenstemming met Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.3
  - number: 8.3.4
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken 5][ref1] en [6][ref2] of krachtens
      [artikel 10.1][ref3] bepaalde zijn binnen hun ambtsgebied eveneens belast de ambtenaren die daartoe worden
      aangewezen bij besluit van de beheerder, niet zijnde Onze Minister, of een ander met de uitvoering van deze wet
      belast bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel10
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.4.1
    text: |-
      Het op grond van [hoofdstuk 6][ref1] bevoegde gezag kan een watervergunning geheel of gedeeltelijk intrekken,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
  - number: 8.4.1.a
    text: |-
      in strijd met de vergunning of de daaraan verbonden voorschriften wordt gehandeld, dan wel de met betrekking tot de
      vergunde handeling geldende wettelijke voorschriften niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.4
  - number: 8.4.1.b
    text: |-
      de ter verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op
      de aanvraag voor de vergunning een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste
      gegevens bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.4
  - number: 8.4.2
    text: |-
      Het bevoegd gezag gaat in een geval als bedoeld in het eerste lid, onderdeel a, niet tot intrekking over dan nadat
      het de vergunninghouder een redelijke termijn heeft gesteld om zijn handelen alsnog in overeenstemming te brengen
      met de vergunning en de daaraan verbonden voorschriften, onderscheidenlijk de geldende wettelijke voorschriften na
      te leven.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.4
  - number: '8.5'
    text: |-
      Onze Minister is bevoegd tot het toepassen van bestuursdwang ter handhaving van het bij of krachtens deze wet
      bepaalde in gevallen waarin hem de zorg voor de bestuursrechtelijke handhaving daarvan is opgedragen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      Met betrekking tot de kwaliteit van de uitvoering en handhaving van het bij of krachtens de
      [hoofdstukken 5][ref1] en [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde zijn de [artikelen 5.7][ref4] en
      [5.8 van de Wet algemene bepalingen omgevingsrecht][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '5'
  - number: '8.7'
    text: |-
      Het bestuursorgaan waaraan de zorg voor bestuursrechtelijke handhaving van het bij of krachtens de
      [hoofdstukken 5][ref1] en [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde is opgedragen, is bevoegd tot het
      toepassen van bestuursdwang ter handhaving van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4],
      voor zover het betreft de verplichting tot het verlenen van medewerking aan de krachtens [artikel 8.3][ref5]
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0025458#Artikel8
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0025458
        artikel: '8'
        hoofdstuk: '8'
  - number: '8.8'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, geven geen toestemming tot vertrek van een
      vaartuig of luchtvaartuig uit Nederland indien zij ernstige redenen hebben om te vermoeden dat in strijd met een
      van de in [artikel 6.3][ref1] omschreven verboden is of zal worden gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 8.9.1
    text: |-
      Onverminderd het recht van andere staten om overeenkomstig het VN-Zeerechtverdrag tot rechtsvervolging over te
      gaan, is de Nederlandse strafwet toepasselijk op ieder die zich in of boven de exclusieve economische zone schuldig
      maakt aan overtreding van de voorschriften, gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.9
  - number: 8.9.2
    text: |-
      Bij de opsporing en vervolging van strafbare feiten als bedoeld in het eerste lid wordt afdeling 7 van Deel XII van
      het VN-Zeerechtverdrag in acht genomen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.9
  - number: '8.10'
    text: |-
      Onze Minister en de toezichthouders nemen bij de toepassing van [artikel 8.5][ref1], onderscheidenlijk bij de
      uitoefening van het toezicht op de naleving van het bij of krachtens deze wet bepaalde, afdeling 7 van Deel XII van
      het VN-Zeerechtverdrag in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel8
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '8'
        hoofdstuk: '8'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van internationale verplichtingen die
      betrekking hebben op waterbeheer, alsmede ten behoeve van een goede uitvoering van deze wet nadere regels worden
      gesteld met betrekking tot de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.1
  - number: '10.2'
    text: |-
      Een wijziging van de kaderrichtlijn water of van een andere op grond van deze wet uitgevoerde richtlijn van een
      of meer instellingen van de Europese Unie alleen of gezamenlijk gaat voor de toepassing van deze wet gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.2
  - number: 10.2a.1
    text: |-
      Een wijziging van bijlage 4 bij het op 7 november 1996 te Londen tot stand gekomen Protocol bij het Verdrag inzake
      de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en andere stoffen van 1972
      (Trb. 1998, 134) gaat voor de toepassing van [artikel 6.3, eerste lid, aanhef en onderdeel d][ref1], gelden met
      ingang van de dag waarop die wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.2a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.2a.2
    text: |-
      Indien voorafgaand aan de dag, waarop [artikel 6.3, eerste lid, aanhef en onderdeel d][ref1], van toepassing wordt
      op een activiteit voor die activiteit een watervergunning is verleend, berust deze op artikel 6.3, eerste lid,
      aanhef en onderdeel d, mits de activiteit in bijlage 4 bij het op 7 november 1996 te Londen tot stand gekomen
      Protocol bij het Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval
      en andere stoffen van 1972 (Trb. 1998, 134) is aangemerkt als een activiteit waarvoor een vergunning kan worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.2a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Indien voorafgaand aan de inwerkingtreding van de wet van 14 maart 2018 tot wijziging van de Waterwet
      en van de Wet maritiem beheer BES in verband met de uitvoering van de wijziging van het Protocol van
      1996 bij het Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van
      afval en andere stoffen van 1972 (mariene geo-engineering) (Stb. 98) voor een activiteit als bedoeld in
      [artikel 6.3, eerste lid, onderdeel d][ref1], een watervergunning is verleend, berust deze op artikel 6.3, eerste
      lid, aanhef en onderdeel d, mits de activiteit in bijlage 4 bij het op 7 november 1996 te Londen tot stand gekomen
      Protocol bij het Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval
      en andere stoffen van 1972 (Trb. 1998, 134) is aangemerkt als een activiteit waarvoor een vergunning kan worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.4.1
    text: |-
      Onze Minister zendt binnen vijf jaar na de volledige inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.4
  - number: 10.4.2
    text: |-
      Onverminderd het eerste lid zendt Onze Minister vóór 1 januari 2025 aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van de [artikelen 2.2][ref1], [2.3][ref2], [2.12][ref3], [3.9][ref4] en
      [7.23 tot en met 7.26][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: '10.5'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Waterwet.'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel10.6
