  - number: 7.10.3
    text: |-
      Voor de toepassing van de [Algemene wet ][ref1] treedt Onze Minister in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 7.10.4
    text: |-
      Voorts treden voor de toepassing van de [Algemene wet ][ref1] de daartoe bij besluit van Onze Minister
      aangewezen ambtenaar of ambtenaren in de plaats van het bestuur van 's Rijksbelastingen en van de inspecteur,
      onderscheidenlijk van de ambtenaren van de rijksbelastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 7.10.5
    text: Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Indien een bedrijfs- of woonruimte of een zuiveringtechnisch werk bij meer dan één persoon in gebruik of beheer is,
      kan de heffingsambtenaar een belastingaanslag inzake de in [artikel 7.10, eerste lid][ref1], bedoelde heffing ter
      zake van die ruimte of van dat zuiveringtechnisch werk ten name van één van die personen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.11.2
    text: |-
      De heffingsambtenaar is bevoegd voor een zelfde in [artikel 7.2, derde lid][ref1], bedoelde heffingplichtige,
      bestemde belastingaanslagen van dezelfde soort op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '7.12'
    text: |-
      De door Onze Minister aangewezen ambtenaren die voor de toepassing van de [Algemene wet][ref1] in de
      plaats treden van de ambtenaren van de rijksbelastingdienst, zijn, voor zover dit voor het heffen van de in
      [artikel 7.10, eerste lid][ref2], bedoelde heffing redelijkerwijs nodig is, bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.12.a
    text: |-
      elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering van
      een woonruimte zonder toestemming van de gebruiker of de gebruikers, te betreden;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.12
  - number: 7.12.b
    text: monsters te nemen ter zake van lozingen op oppervlaktewaterlichamen in beheer bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.12
  - number: 7.13.1
    text: |-
      De heffing ter zake van lozen op een oppervlaktewaterlichaam in beheer bij het Rijk wordt ingevorderd met
      toepassing van de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2] als was deze
      heffing een rijksbelasting in de zin van [artikel 2, eerste lid, onderdeel a, van de Invorderingswet 1990][ref3] en
      geschiedt door de zorg van de ontvanger, bedoeld in artikel 2, eerste lid, onderdeel i, van die wet, alsmede door
      de overige in die wet genoemde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 7.13.2
    text: |-
      Een voorlopige aanslag voor de in het eerste lid bedoelde heffing waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, is invorderbaar in zoveel gelijke termijnen als er na de maand
      die in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn
      vervalt één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.13
  - number: 7.13.3
    text: |-
      Indien toepassing van het tweede lid niet leidt tot meer dan twee maandelijkse termijnen, is de in dat lid bedoelde
      belastingaanslag twee maanden na de dagtekening van het aanslagbiljet invorderbaar.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.13
  - number: 7.14.1
    text: |-
      Aan degene die als gevolg van de rechtmatige uitoefening van een taak of bevoegdheid in het kader van het
      waterbeheer schade lijdt of zal lijden, wordt op zijn verzoek door het betrokken bestuursorgaan een vergoeding
      toegekend, voor zover de schade redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en voor
      zover de vergoeding niet of niet voldoende anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.14
  - number: 7.14.2
    text: |-
      Het verzoek tot vergoeding van de schade bevat een motivering, alsmede een onderbouwing van de hoogte van de
      gevraagde schadevergoeding. Bij of krachtens algemene maatregel van bestuur dan wel verordening van provincie
      of waterschap kunnen regels worden gesteld omtrent de inrichting, indiening en motivering van een verzoek tot
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.14
  - number: 7.14.3
    text: |-
      Het bestuursorgaan kan het verzoek afwijzen, indien vijf jaren zijn verlopen na de dag waarop de schade zich
      heeft geopenbaard dan wel nadat de benadeelde redelijkerwijs op de hoogte had kunnen zijn van de schade, doch in
      elk geval na verloop van twintig jaren na de schadeveroorzakende gebeurtenis. Bij of krachtens de in het tweede
      lid bedoelde algemene maatregel van bestuur dan wel verordening van provincie of waterschap kunnen regels worden
      gesteld omtrent de behandeling en de wijze van beoordeling van een verzoek tot schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.14
  - number: 7.14.4
    text: Het besluit inzake de toekenning van de vergoeding wordt genomen bij afzonderlijke beschikking.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.14
  - number: 7.14.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, onverminderd [artikel 7.15][ref1], nadere regels worden
      gesteld met betrekking tot de schade die krachtens het eerste lid voor vergoeding in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.15'
    text: |-
      Voor de toepassing van [artikel 7.14][ref1] wordt onder schade mede verstaan schade in verband met wateroverlast
      of overstromingen, voor zover deze het gevolg zijn van de verlegging van een waterkering of van andere maatregelen,
      gericht op het vergroten van de afvoer- of bergingscapaciteit van watersystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.16'
    text: |-
      [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing, voor zover een belanghebbende
      met betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in
      [artikel 7.14, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.1
    text: |-
      Indien de door een bestuursorgaan uit hoofde van [artikel 7.14][ref1] vergoede schade voortvloeit uit een op
      aanvraag genomen besluit, kan het bestuursorgaan deze schade bij beschikking in rekening brengen bij de aanvrager
      van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.2
    text: |-
      Indien door een bestuursorgaan, niet zijnde Onze Minister, een vergoeding als bedoeld in [artikel 7.14][ref1]
      wordt toegekend in verband met de noodzakelijke behartiging van een openbaar belang waarvan de behartiging niet
      of niet geheel tot de taak van dat bestuursorgaan behoort, kan Onze Minister op verzoek van dat bestuursorgaan
      aan het openbaar lichaam welks belang geheel of gedeeltelijk wordt behartigd, de verplichting opleggen de met de
      toepassing van artikel 7.14 gemoeide kosten die het gevolg zijn van die belangenbehartiging, geheel of gedeeltelijk
      te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.3
    text: |-
      Een verplichting als bedoeld in het tweede lid wordt niet opgelegd dan nadat het openbaar lichaam welks belang
      geheel of gedeeltelijk wordt behartigd, en overige rechtstreeks betrokkenen in de gelegenheid zijn gesteld
      daaromtrent hun zienswijzen naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.17
  - number: 7.17.4
    text: |-
      Van het besluit tot oplegging van een verplichting als bedoeld in het tweede lid wordt mededeling gedaan door
      plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.17
  - number: 7.18.1
    text: |-
      De schade aan een onroerende zaak, veroorzaakt door het onttrekken van grondwater of het infiltreren van water
      krachtens een watervergunning, wordt, voorzover dit redelijkerwijze kan worden gevergd, door de vergunninghouder
      ondervangen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.18
  - number: 7.18.2
    text: |-
      Voorzover de schade niet is ondervangen, is de vergunninghouder desgevorderd verplicht jegens ieder die enig recht
      op het gebruik of het genot van de onroerende zaak heeft, die schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.18
  - number: 7.18.3
    text: |-
      Niettemin kan een eigenaar van de onroerende zaak, indien door de aard of de omvang van de schade de eigendom
      van die zaak voor hem van te geringe betekenis is geworden, vorderen dat de vergunninghouder de onroerende zaak
      in eigendom overneemt. De vordering kan worden gedaan zowel bij niet-aanvaarding van een als schadevergoeding
      aangeboden som als na aanvaarding daarvan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.18
  - number: 7.18.4
    text: |-
      Vorderingen, op grond van dit artikel staan ter kennisneming van de rechtbank binnen wier rechtsgebied de
      onroerende zaak of het grootste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.18
  - number: 7.19.1
    text: |-
      Hij, die op grond van [artikel 7.18, eerste, tweede of derde lid][ref1], een vordering kan doen met betrekking
      tot schade in verband met een watervergunning voor het onttrekken van grondwater of het infiltreren van water als
      bedoeld in [artikel 6.4][ref2] of [6.5, onderdeel b][ref3], dan wel krachtens een verordening van een waterschap,
      kan eerst aan gedeputeerde staten van de provincie waarin de in artikel 7.18 bedoelde onroerende zaak geheel of
      grotendeels is gelegen verzoeken een onderzoek in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 7.19.2
    text: |-
      Indien een onroerende zaak is gelegen in een gebied waarin de grondwaterstand invloed ondergaat van meer dan
      één onttrekking en blijkens het onderzoek niet of niet binnen redelijke termijn is vast te stellen door welke
      onttrekking de schade die de onroerende zaak ondervindt wordt veroorzaakt, kennen gedeputeerde staten de
      rechthebbende ten aanzien van die onroerende zaak op zijn verzoek een vergoeding van de kosten van ondervanging van
      de schade dan wel een schadevergoeding toe. De rechthebbende is in dat geval gehouden tot overdracht van de rechten
      welke hij tegenover derden mocht kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.19
  - number: 7.20.1
    text: |-
      Ingeval de rechtbank de vordering, bedoeld in [artikel 7.18, derde lid][ref1], gegrond acht, veroordeelt
      zij de vergunninghouder tot overneming en tot betaling van de overnemingssom. Tegen het vonnis staat
      geen ander rechtsmiddel open dan beroep in cassatie. Het beroep in cassatie moet op straffe van niet-
      ontvankelijkheid binnen acht dagen na het instellen ervan worden ingeschreven in de registers, bedoeld in
      [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel433
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '433'
  - number: 7.20.2
    text: |-
      Op de vaststelling van de overnemingssom zijn de [artikelen 27, eerste en tweede lid][ref1],
      [28, eerste, tweede en derde lid][ref2], [29 tot en met 35][ref3] en [37, eerste lid, van de onteigeningswet][ref4]
      van overeenkomstige toepassing, met dien verstande, dat de rechtbank in plaats van één of een oneven aantal
      deskundigen ook twee deskundigen kan benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '37'
  - number: 7.20.3
    text: |-
      Het vonnis waarbij de vergunninghouder tot overneming is veroordeeld, kan worden ingeschreven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], nadat het in kracht van
      gewijsde is gegaan. Door inschrijving van het vonnis gaat de eigendom op de vergunninghouder over.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 7.21.1
    text: |-
      De kosten wegens schade, toegebracht aan waterstaatswerken in beheer of onderhoud bij een beheerder, waarvoor
      eigenaren of gebruikers van vaartuigen wettelijk aansprakelijk zijn, worden door de daartoe door de beheerder
      aangewezen ambtenaar geraamd en vermeld in een proces-verbaal dat zo mogelijk aan de schipper in afschrift wordt
      meegedeeld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.21
  - number: 7.21.2
    text: |-
      Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis, ook indien het vaartuig inmiddels buiten zijn ambtsgebied is gebracht, te beletten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.21
  - number: 7.21.3
    text: |-
      Onverminderd het recht op vergoeding van de schade is het betrokken publiekrechtelijk lichaam bevoegd het betaalde
      bedrag aan te wenden tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade minder
      bedragen dan het betaalde bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der betaling,
      uitgekeerd aan degene die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.21
  - number: 7.21.4
    text: |-
      Dit artikel is niet van toepassing op de kosten van lokaliseren, markeren en opruimen van een wrak in de zin van de
      [Wet bestrijding maritieme ongevallen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037162
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0037162
  - number: 7.22.1
    text: |-
      De Staat kan – behoudens matiging door de rechter – de ten laste van het Rijk komende kosten van onderzoek naar
      verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam en van maatregelen als bedoeld
      in [artikel 4.6, tweede lid, onder a][ref1], of [artikel 5.15, eerste lid][ref2], in verband met verontreiniging
      of aantasting van de bodem of oever van een oppervlaktewaterlichaam die een belemmering vormt voor het bereiken van
      de gewenste gebiedskwaliteit, verhalen op degene door wiens onrechtmatige daad die verontreiniging of aantasting in
      het betrokken geval is veroorzaakt en die deswege of anderszins buiten overeenkomst jegens enige overheid krachtens
      burgerlijk recht aansprakelijk is voor de gevolgen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 7.22.2
    text: |-
      De Staat kan, indien de kosten bedoeld in het eerste lid mede ten laste komen van een waterschap, ook deze kosten
      overeenkomstig dat lid verhalen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22
  - number: 7.22.3
    text: |-
      De Staat kan ten laste van het Rijk komende kosten als bedoeld in het eerste lid overeenkomstig de regels
      betreffende ongerechtvaardigde verrijking verhalen op degene die door dat onderzoek of die maatregelen
      ongerechtvaardigd wordt verrijkt. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22
  - number: 7.22.4
    text: |-
      De bevoegdheden, bedoeld in het eerste en derde lid, komen toe aan het waterschap in gevallen waarin kosten
      als bedoeld in het eerste lid geheel te haren laste komen, alsmede in gevallen waarin de Staat niet van deze
      bevoegdheid gebruik maakt, voor zover zodanige kosten te haren laste komen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22
  - number: 7.22.5
    text: |-
      [Artikel 75, vijfde lid, van de Wet bodembescherming][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel75
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '75'
  - number: 7.22a.1
    text: Er is een deltafonds.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22a
  - number: 7.22a.2
    text: 'Het deltafonds heeft ten doel de financiering en bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22a
  - number: 7.22a.2.a
    text: |-
      maatregelen en voorzieningen ter voorkoming en waar nodig beperking van overstromingen, wateroverlast en
      waterschaarste;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22a
  - number: 7.22a.2.b
    text: |-
      maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22a
  - number: 7.22a.2.c
    text: |-
      het inwinnen, bewerken en verspreiden van met de onderdelen a en b samenhangende gegevens en het verrichten van met
      de onderdelen a en b samenhangende onderzoeken.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22a
  - number: 7.22b.1
    text: |-
      Het deltafonds is een begrotingsfonds als bedoeld in
      [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.22b
