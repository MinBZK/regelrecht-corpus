  - number: 1.1.2
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden onttrekkingsinrichtingen die een
      samenhangend geheel vormen, als één onttrekkingsinrichting aangemerkt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen ten aanzien van de zee wordt onder
      oppervlaktewaterlichaam mede begrepen de ondergrond van de zeebodem.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.1
  - number: 1.2.1
    text: |-
      Voor de toepassing van het begrip stroomgebieddistrict in deze wet en de daarop berustende bepalingen wordt het
      Nederlandse grondgebied ingedeeld in de op Nederlands grondgebied gelegen delen van de stroomgebieddistricten
      Eems, Maas, Rijn en Schelde. Onder het Nederlandse grondgebied wordt in dit artikel en de daarop berustende
      bepalingen mede verstaan de territoriale zee, voor zover die is gelegen aan de landzijde van de lijn waarvan
      elk punt zich bevindt op een afstand van een internationale zeemijl, gemeten zeewaarts vanaf de laagwaterlijn,
      bedoeld in [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref1] of de basislijn, bedoeld in
      [artikel 2 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0003748
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '2'
  - number: 1.2.2
    text: |-
      De onderlinge grenzen van de Nederlandse delen van de stroomgebieddistricten worden vastgesteld bij of krachtens
      algemene maatregel van bestuur. Daarbij wordt tevens voorzien in de toedeling van de grondwaterlichamen aan de
      stroomgebieddistricten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Bij de voorbereiding van de maatregel horen Onze Ministers gedeputeerde staten van de betrokken provincies en de
      beheerders alsmede de bevoegde autoriteiten van de andere staten in het stroomgebieddistrict.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.2
  - number: 1.3.1
    text: |-
      De primaire waterkeringen en de dijktrajecten worden aangegeven op de landkaarten in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 1.3.2
    text: |-
      Een dijktraject wordt aan twee zijden begrensd door een lijn loodrecht op het dijktraject door een punt waarvan de
      rijksdriehoekscoördinaten zijn opgenomen in [bijlage IA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 1.3.3
    text: |-
      De in het eerste lid bedoelde bijlage kan worden gewijzigd bij algemene maatregel van bestuur. Bij de voorbereiding
      van de maatregel worden gedeputeerde staten en beheerders die bevoegd zijn voor de betreffende primaire
      waterkeringen gehoord.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.3
  - number: 1.3.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid treedt niet eerder in werking dan drie maanden na
      de datum waarop deze aan beide Kamers der Staten-Generaal is toegezonden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.3
  - number: '1.4'
    text: Deze wet is mede van toepassing in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel1.4
  - number: 2.1.1
    text: 'De toepassing van deze wet is gericht op:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.1
  - number: 2.1.1.a
    text: voorkoming en waar nodig beperking van overstromingen, wateroverlast en waterschaarste, in samenhang met
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.1
  - number: 2.1.1.b
    text: bescherming en verbetering van de chemische en ecologische kwaliteit van watersystemen en
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.1
  - number: 2.1.1.c
    text: vervulling van maatschappelijke functies door watersystemen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De toepassing van deze wet is mede gericht op andere doelstellingen dan genoemd in het eerste lid, voor zover dat
      elders in deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.1
  - number: 2.2.1
    text: |-
      In de bij deze wet behorende [bijlage II][ref1] wordt voor elk dijktraject, met uitzondering van dijktraject 16-5,
      vermeld in [bijlage I][ref2], een signaleringswaarde vastgesteld. De signaleringswaarde is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
  - number: 2.2.1.a
    text: |-
      een dijktraject, niet zijnde een dijktraject als bedoeld in onderdeel b, de overstromingskans per jaar waarvan
      overschrijding op grond van [artikel 2.12, vijfde lid][ref1], wordt gemeld aan Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.2.1.b
    text: |-
      de dijktrajecten 201, 204a, 204b, 206, 208 tot en met 212, 214 tot en met 219 en 222 tot en met 225, vermeld in
      [bijlage I][ref1], de faalkans per jaar waarvan overschrijding op grond van[ artikel 2.12, vijfde lid][ref2], wordt
      gemeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.2.2
    text: |-
      In de bij deze wet behorende [bijlage III][ref1] wordt voor elk dijktraject een ondergrens vastgesteld. De
      ondergrens is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 2.2.2.a
    text: |-
      een dijktraject als bedoeld in het eerste lid, tweede zin, onderdeel a, de overstromingskans per jaar waarop het
      dijktraject ten minste berekend moet zijn;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      een dijktraject, genoemd in het eerste lid, tweede zin, onderdeel b, de faalkans per jaar waarop het dijktraject
      ten minste berekend moet zijn;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
  - number: 2.2.2.c
    text: |-
      dijktraject 16-5, vermeld in [bijlage I][ref1], indien dit hydraulische belasting ondervindt door het overstromen
      van het door een voorliggend dijktraject beschermde gebied, de overstromingskans waarop het dijktraject dan ten
      minste berekend moet zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 2.2.3
    text: |-
      Onverminderd het tweede lid vermeldt [bijlage III][ref1] voor:


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 2.2.3.a
    text: |-
      een dijktraject dat een toename van hydraulische belasting kan ondervinden ten gevolge van een maatregel gericht
      op het vergroten van de afvoer- of bergingscapaciteit van een watersysteem, de overstromingskans waarop het
      dijktraject ten minste berekend moet zijn, indien een zodanige toename optreedt;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
  - number: 2.2.3.b
    text: |-
      de dijktrajecten 208 tot en met 210 en 225 de kans op niet-sluiten waaraan de stormvloedkering ten minste moet
      voldoen, indien deze gesloten moet worden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Ten behoeve van de beoordeling van de veiligheid van een dijktraject worden bij ministeriële regeling regels
      gesteld voor het bepalen van de hydraulische belasting en de sterkte.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De in het eerste lid bedoelde ministeriële regeling wordt telkens voor maximaal twaalf jaren vastgesteld. Bij de
      voorbereiding van de regeling worden de besturen van de waterschappen gehoord.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Bij algemene maatregel van bestuur, gedeputeerde staten gehoord, of provinciale verordening wordt voor daarbij aan
      te wijzen andere dan primaire waterkeringen in beheer bij het Rijk, onderscheidenlijk een andere beheerder, een
      veiligheidsnorm vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      In afwijking van het eerste lid wordt de veiligheidsnorm voor andere dan primaire waterkeringen die ingevolge
      [artikel 1.3, eerste lid][ref1], zoals dat luidde op 31 december 2016, werden aangemerkt als primaire
      waterkeringen, voor 1 januari 2019 vastgesteld. Tot die vaststelling moeten de desbetreffende keringen ten minste
      gelijke veiligheid bieden als het geval was op 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '2.5'
    text: |-
      Bij ministeriële regeling, gedeputeerde staten gehoord, dan wel bij of krachtens provinciale verordening wordt
      ten aanzien van daarbij aan te wijzen andere dan primaire waterkeringen in beheer bij het Rijk, onderscheidenlijk
      een andere beheerder, voor daarbij aan te geven plaatsen vastgesteld welke relatie tussen waterstanden en
      overschrijdingskansen daarvan uitgangspunt is bij de bepaling van het waterkerend vermogen daarvan. Bij die
      vaststelling kunnen tevens waarden worden vastgesteld van andere zodanige factoren.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      Onze Minister draagt zorg voor de totstandkoming en verkrijgbaarstelling van technische leidraden voor het ontwerp,
      het beheer en het onderhoud van primaire waterkeringen. Deze leidraden strekken de beheerders tot aanbeveling.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Landwaartse verplaatsing van de kustlijn wordt van rijkswege voorkomen of tegengegaan, voor zover dat naar het
      oordeel van Onze Minister noodzakelijk is vanwege de ingevolge deze wet te handhaven normen voor dijktrajecten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.7
  - number: 2.7.2
    text: |-
      De in het eerste lid bedoelde kustlijn wordt aangegeven op een door Onze Minister kosteloos verkrijgbaar gestelde
      kaart die telkens na zes jaren wordt herzien. De verkrijgbaarstelling wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.7
  - number: '2.8'
    text: |-
      Bij provinciale verordening worden, met het oog op de bergings- en afvoercapaciteit waarop regionale wateren moeten
      zijn ingericht, normen gesteld met betrekking tot de gemiddelde kans per jaar op overstroming van daarbij aan te
      wijzen gebieden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Bij algemene maatregel van bestuur wordt de rangorde van maatschappelijke en ecologische behoeften vastgesteld, die
      bij watertekorten of dreigende watertekorten bepalend is voor de verdeling van het beschikbare oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Bij of krachtens de maatregel en, in de gevallen bij die maatregel bepaald, provinciale verordening kunnen nadere
      regels worden gesteld met betrekking tot de in het eerste lid bedoelde rangorde. Deze regels kunnen mede voorzien
      in de overeenkomstige toepassing van de rangorde op het beschikbare grondwater.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.9
  - number: '2.10'
    text: |-
      Normen voor de chemische en ecologische kwaliteit van watersystemen worden vastgesteld krachtens
      [hoofdstuk 5 van de Wet milieubeheer][ref1], in overeenstemming met het stelsel van milieudoelstellingen, opgenomen
      in artikel 4 van de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '5'
  - number: '2.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor rijkswateren en, met het oog op internationale
      verplichtingen of bovenregionale belangen, voor regionale wateren normen worden vastgesteld voor de overeenkomstig
      [hoofdstuk 4][ref1] aan watersystemen toe te kennen functies. Voor regionale wateren kunnen zodanige normen voorts
      worden gesteld bij of krachtens provinciale verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '4'
  - number: 2.12.1
    text: |-
      Iedere twaalf jaren brengt de beheerder verslag uit aan Onze Minister over de algemene waterstaatkundige toestand
      van de primaire waterkering.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Iedere twaalf jaren brengt de beheerder van het buitenwater, zijnde de grote rivieren, verslag uit aan Onze
      Minister over de mate waarin voldaan wordt aan de voor deze wateren opgestelde legger, mede in het licht van de
      regels voor het bepalen van de hydraulische belasting en de sterkte, bedoeld in [artikel 2.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.12.3
    text: |-
      Onze Minister brengt telkens over de in het eerste en tweede lid genoemde periode verslag uit aan de beide Kamers
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Het in het eerste lid bedoelde verslag bevat een beoordeling van de veiligheid. Die beoordeling geschiedt onder
      meer in het licht van de voor een dijktraject in [bijlage II][ref1] en [III][ref2] vastgestelde norm of normen,
      de ingevolge [artikel 2.3, eerste lid][ref3], vastgestelde regels voor het bepalen van de hydraulische belasting
      en de sterkte, de in [artikel 2.6, eerste lid][ref4], bedoelde technische leidraden en de legger. Bij ministeriële
      regeling worden nadere regels gesteld over de beoordeling. Bij de voorbereiding van de regeling worden de besturen
      van de waterschappen gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.12.5
    text: |-
      Overschrijding van een in [bijlage II][ref1] vastgestelde norm wordt door de beheerder aan Onze Minister gemeld in
      het in het eerste lid bedoelde verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 2.12.6
    text: |-
      Indien de beoordeling van de veiligheid, bedoeld in het vierde lid, daartoe aanleiding geeft, bevat het in het
      eerste lid bedoelde verslag een omschrijving van de voorzieningen die op een daarbij aan te geven termijn nodig
      worden geacht.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
  - number: 2.12.7
    text: De eerstvolgende toezending van een verslag als bedoeld in het derde lid vindt plaats voor 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Onze Minister zendt elke twaalf jaar aan de beide Kamers der Staten-Generaal een verslag over de doeltreffendheid
      en de effecten van de in [bijlagen II][ref1] en [III][ref2] aangegeven normen voor dijktrajecten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
  - number: 2.13.2
    text: De eerstvolgende toezending van een verslag als bedoeld in het eerste lid vindt plaats voor 1 januari 2037.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.13
  - number: '2.14'
    text: |-
      Onverminderd [artikel 2.12][ref1] kunnen bij of krachtens algemene maatregel van bestuur dan wel bij of krachtens
      provinciale verordening, regels worden gesteld ten aanzien van het periodiek door de beheerder meten van daarbij
      aan te geven grootheden en het aan de hand van de meetresultaten beoordelen van de mate van verwezenlijking van
      de normen, bedoeld in de [paragrafen 2][ref2] en [3][ref3], voor zover het betreft normen die van rijkswege,
      onderscheidenlijk op provinciaal niveau, zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025458
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de watersystemen aangewezen die volledig dan wel met
      uitzondering van daarbij aangewezen onderdelen bij het Rijk in beheer zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt voor de onder de aanwijzing vallende oppervlaktewaterlichamen
      tevens de begrenzing vastgesteld. Daarbij wordt voor de begrenzing van de oppervlaktewaterlichamen van de rivieren
      de buitenkruinlijn van de primaire waterkering voor zover die primaire waterkering is aangegeven op de kaarten die
      als [bijlage I][ref1] bij deze wet behoren, dan wel, waar deze ontbreekt, de daarbij vast te stellen lijn van de
      hoogwaterkerende gronden, als richtlijn gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 3.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen gronden binnen een oppervlaktewaterlichaam worden aangewezen
      als drogere oevergebieden als bedoeld in de begripsomschrijving van oppervlaktewaterlichaam in [artikel 1.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.4
    text: |-
      De voordracht voor de maatregel, bedoeld in het eerste lid, wordt gedaan nadat gedeputeerde staten van alle
      provincies alsmede alle waterschapsbesturen zijn geraadpleegd over de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
  - number: 3.1.5
    text: |-
      De voordracht voor een algemene maatregel van bestuur houdende wijziging van de in het eerste lid bedoelde
      aanwijzing kan slechts worden gedaan indien over een daarin besloten liggende overdracht dan wel overneming van het
      beheer door Onze Minister overeenstemming is bereikt met de betrokken andere beheerder en gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
  - number: 3.1.6
    text: |-
      Bij ministeriële regeling kunnen niet tot het Rijk behorende overheidslichamen worden aangewezen die geheel
      of gedeeltelijk zijn belast met het beheer van daarbij aangewezen rijkswateren. De aanwijzing gebeurt in
      overeenstemming met het desbetreffende bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Bij provinciale verordening worden voor de regionale wateren overheidslichamen aangewezen die geheel of
      gedeeltelijk zijn belast met het beheer, met inachtneming van [artikel 2, tweede lid, van de Waterschapswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '2'
  - number: 3.2.2
    text: |-
      Voor zover bij provinciale verordening andere lichamen dan waterschappen worden belast met beheer, zijn de
      [artikelen 4.6][ref1], [5.1][ref2], [7.2][ref3], [8.1][ref4] en [8.3][ref5] van deze wet niet van toepassing voor
      de betrokken beheerders en, indien het provincies en gemeenten betreft, evenmin [artikel 5.29][ref6], behoudens
      voor zover dat artikel bij of krachtens die verordening van toepassing wordt verklaard voor daarbij aan te wijzen
      waterstaatswerken, in verband met de bijzondere betekenis van die waterstaatswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0025458#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0025458
        artikel: '8'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 3.2.3
    text: |-
      [Artikel 3.1, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2a
    text: |-
      Het waterschap draagt zo goed mogelijk zorg voor het voorkomen van schade aan waterstaatswerken veroorzaakt door
      muskus- en beverratten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.2a
  - number: 3.3.1
    text: |-
      In het belang van het tijdig nemen van maatregelen bij hoog water dat gevaar voor een tot directe kering van het
      buitenwater bestemde primaire waterkering kan opleveren, draagt Onze Minister er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      informatie beschikbaar is over de verwachte afwijkingen van de daartoe door Onze Minister gepubliceerde
      hoogwaterstanden;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      waarschuwingen en verdere inlichtingen worden verschaft aan de beheerders van primaire waterkeringen en colleges
      van gedeputeerde staten die het betreft, zodra te verwachten is dat bij hoge stormvloed, hoog opperwater van een
      van de grote rivieren, hoog water van het IJsselmeer of het Markermeer of, ten gevolge van een combinatie daarvan,
      de hoogwaterstand het alarmeringspeil overschrijdt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Alarmeringspeilen als bedoeld in het eerste lid, onderdeel b, worden door Onze Minister telkens voor zes jaren
      vastgesteld bij in de Staatscourant bekend te maken besluit.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Zuivering van stedelijk afvalwater gebracht in een openbaar vuilwaterriool geschiedt in een daartoe bestemde
      inrichting onder de zorg van een waterschap. Een zodanige inrichting kan worden geëxploiteerd door het waterschap
      zelf dan wel door een rechtspersoon die door het bestuur van het waterschap met die zuivering is belast.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.4
  - number: 3.4.2
    text: |-
      In afwijking van het eerste lid kunnen het bestuur van het betrokken waterschap en de raad van een betrokken
      gemeente op voorstel van één van beide partijen besluiten, dat de zuivering van daarbij aangewezen stedelijk
      afvalwater in die gemeente, vanaf een daarbij te bepalen tijdstip, geschiedt in een daartoe bestemde inrichting
      onder de zorg van die gemeente. Een besluit als bedoeld in de vorige volzin kan slechts worden genomen op grond dat
      zulks aantoonbaar doelmatiger is voor de zuivering van stedelijk afvalwater.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Het bestuur van het waterschap en de raad van de betrokken gemeente beslissen op een voorstel als bedoeld in het
      tweede lid, binnen één jaar na de dag waarop het door de raad van de betrokken gemeente dan wel door het bestuur
      van het waterschap is ontvangen. Bij gebreke van overeenstemming binnen die termijn beslissen, de beide partijen
      gehoord, gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De gemeenteraad en het college van burgemeester en wethouders dragen zorg voor een doelmatige inzameling van
      het afvloeiend hemelwater, voor zover van degene die zich daarvan ontdoet, voornemens is zich te ontdoen of
      zich moet ontdoen, redelijkerwijs niet kan worden gevergd het afvloeiend hemelwater op of in de bodem of in het
      oppervlaktewater te brengen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.5
  - number: 3.5.2
    text: |-
      De gemeenteraad en het college van burgemeester en wethouders dragen tevens zorg voor een doelmatige verwerking van
      het ingezamelde hemelwater. Onder het verwerken van hemelwater kunnen in ieder geval de volgende maatregelen worden
      begrepen: de berging, het transport, de nuttige toepassing, het, al dan niet na zuivering, terugbrengen op of in de
      bodem of in het oppervlaktewater van ingezameld hemelwater, en het afvoeren naar een zuiveringtechnisch werk.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De gemeenteraad en het college van burgemeester en wethouders dragen zorg voor het in het openbaar gemeentelijke
      gebied treffen van maatregelen teneinde structureel nadelige gevolgen van de grondwaterstand voor de aan de
      grond gegeven bestemming zoveel mogelijk te voorkomen of te beperken, voor zover het treffen van die maatregelen
      doelmatig is en niet tot de zorg van de beheerder of de provincie behoort.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6
  - number: 3.6.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, omvatten mede de verwerking van het ingezamelde grondwater, waaronder
      in ieder geval worden begrepen de berging, het transport, de nuttige toepassing en het, al dan niet na zuivering,
      op of in de bodem of in het oppervlaktewater brengen van ingezameld grondwater, en het afvoeren naar een
      zuiveringtechnisch werk.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6
  - number: 3.6a.1
    text: |-
      Er is een rechtstreeks onder Onze Minister ressorterende regeringscommissaris voor het deltaprogramma. Deze draagt
      de titel «deltacommissaris».
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.2
    text: |-
      De deltacommissaris wordt benoemd bij koninklijk besluit, in overeenstemming met het gevoelen van de ministerraad.
      Hij kan voorts bij koninklijk besluit worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.3
    text: De deltacommissaris wordt benoemd voor een periode van ten hoogste zeven jaren en is eenmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.4
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.4.a
    text: benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie, ontslag;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.4.b
    text: aanspraken ingeval van ziekte;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6a.4.c
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6a
  - number: 3.6b
    text: |-
      De deltacommissaris bevordert de totstandkoming en uitvoering van het deltaprogramma. Daartoe: - doet hij jaarlijks
      een voorstel voor het deltaprogramma en legt dit voor aan Onze Ministers;
        - bevordert hij overleg met betrokken bestuursorganen, bedrijven en maatschappelijke organisaties;
        - bewaakt hij de voortgang van de uitvoering van het deltaprogramma en rapporteert en adviseert daarover aan Onze
      Ministers.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6b
  - number: 3.6c
    text: |-
      De deltacommissaris verkrijgt ten behoeve van de totstandkoming en de uitvoering van het deltaprogramma desgevraagd
      van Onze Ministers de gegevens die aan hen bij of krachtens de wet dienen te worden verschaft.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6c
  - number: 3.6d.1
    text: |-
      Ter uitvoering van [artikel 3.6b][ref1] voert de deltacommissaris regelmatig overleg met betrokken bestuursorganen
      van provincies, waterschappen en gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6d
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 1a
  - number: 3.6d.2
    text: Aan het overleg kunnen, op uitnodiging, ook andere betrokken bestuursorganen deelnemen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6d
  - number: 3.6d.3
    text: |-
      In het overleg worden in ieder geval besproken de voortgang van de uitvoering van het deltaprogramma en voorstellen
      voor maatregelen en voorzieningen in het kader van het deltaprogramma.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6d
  - number: 3.6e
    text: |-
      De deltacommissaris is op het terrein van waterbeheer, natuur, milieu of ruimtelijke kwaliteit niet werkzaam in een
      andere publiek-bestuurlijke of ambtelijke functie of in de private sector.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.6e
  - number: 3.7.1
    text: |-
      Beheerders van binnen hetzelfde stroomgebieddistrict gelegen watersystemen stellen, voor zover nodig met het oog
      op een samenhangend en doelmatig waterbeheer, waterakkoorden vast waarin zij de hun beheersgebied overstijgende
      aspecten van het beheer ten opzichte van elkaar regelen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Beheerders kunnen een ander openbaar gezag uitnodigen aan het waterakkoord deel te nemen, indien dat gezag een
      waterstaatkundige taak vervult die niet door hen wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur of, ten aanzien van waterakkoorden die uitsluitend betrekking
      hebben op regionale wateren, provinciale verordening kunnen nadere regels met betrekking tot waterakkoorden worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.7
  - number: '3.8'
    text: |-
      Waterschappen en gemeenten dragen zorg voor de met het oog op een doelmatig en samenhangend waterbeheer benodigde
      afstemming van taken en bevoegdheden waaronder het zelfstandige beheer van inname, inzameling en zuivering van
      afvalwater.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.8
  - number: '3.9'
    text: Onze Minister oefent het toezicht uit op de primaire waterkeringen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Bij of krachtens provinciale verordening kunnen met het oog op een samenhangend en doelmatig regionaal waterbeheer
      regels worden gesteld omtrent de door besturen van waterschappen te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij of krachtens
      algemene maatregel van bestuur regels worden gesteld omtrent de door besturen van provincies, waterschappen of
      gemeenten met betrekking tot het waterbeheer te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.10
  - number: 3.11.1
    text: |-
      Bij of krachtens provinciale verordening kunnen met het oog op een samenhangend en doelmatig regionaal waterbeheer
      regels worden gesteld met betrekking tot de voorbereiding, vaststelling, wijziging en inhoud van door besturen van
      waterschappen vast te stellen plannen, besluiten of waterakkoorden als bedoeld in [artikel 3.7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.11.2
    text: |-
      Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij of krachtens
      algemene maatregel van bestuur regels worden gesteld met betrekking tot de voorbereiding, vaststelling, wijziging
      en inhoud van door besturen van provincies of waterschappen in het kader van het waterbeheer vast te stellen
      plannen, besluiten of waterakkoorden als bedoeld in [artikel 3.7, eerste lid.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.12.1
    text: |-
      Gedeputeerde staten kunnen, indien een samenhangend en doelmatig regionaal waterbeheer dat vordert, het bestuur van
      een waterschap een aanwijzing geven omtrent de uitoefening van bevoegdheden of de uitvoering van taken. Indien het
      een waterschap betreft waarvan het gebied in twee of meer provincies is gelegen, wordt de aanwijzing gegeven door
      gedeputeerde staten van de provincie of provincies waaraan het toezicht op het waterschap is opgedragen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.12
  - number: 3.12.2
    text: Bij de aanwijzing wordt een termijn gesteld waarbinnen uitvoering wordt gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Een aanwijzing wordt niet gegeven dan nadat het bestuur van het waterschap in de gelegenheid is gesteld van zijn
      gevoelen omtrent het voornemen tot het geven van de aanwijzing te doen blijken, tenzij spoedeisende omstandigheden
      zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Wanneer het bestuur van een waterschap niet, niet tijdig of niet naar behoren gevolg geeft aan de aanwijzing,
      zijn gedeputeerde staten bevoegd daarin namens dat bestuur en ten laste van dat waterschap te voorzien. Indien
      gedeputeerde staten gebruikmaken van deze bevoegdheid, melden zij dit onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Onze Minister kan, indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken,
      gedeputeerde staten of het bestuur van een waterschap een aanwijzing geven omtrent de uitoefening van
      bevoegdheden of de uitvoering van taken in het kader van het waterbeheer. [Artikel 3.12, tweede lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.13.2
    text: |-
      Een aanwijzing wordt niet gegeven dan nadat het betrokken bestuursorgaan en, indien de aanwijzing is gericht tot
      het bestuur van een waterschap, gedeputeerde staten van de provincie of provincies waaraan het toezicht op dat
      waterschap is opgedragen, in de gelegenheid zijn gesteld van hun gevoelen omtrent het voornemen tot het geven van
      de aanwijzing te doen blijken, tenzij spoedeisende omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Wanneer het bestuur van een waterschap een krachtens het eerste lid gevorderde beslissing niet of niet naar behoren
      neemt dan wel een krachtens het eerste lid gevorderde handeling niet of niet naar behoren verricht of anderszins
      een krachtens het eerste lid gevorderd resultaat niet, niet tijdig of niet naar behoren tot stand brengt, besluit
      Onze Minister daarin te voorzien ten laste van het waterschap. De [artikelen 121, tweede en vierde lid][ref1],
      [121a tot en met 121e van de Provinciewet][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121a
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 121a
  - number: 3.14.1
    text: |-
      Onze Minister ziet toe op een evenwichtige onderlinge verdeling van de kosten omtrent hoogwaterbescherming voor
      waterschappen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Onze Minister informeert beide Kamers der Staten-Generaal van een voorgenomen wijziging in de verdeling van de
      kosten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel3.14
  - number: 4.1.1
    text: |-
      Onze Ministers leggen in een nationaal waterplan de hoofdlijnen vast van het nationale waterbeleid en de daartoe
      behorende aspecten van het nationale ruimtelijke beleid. Het plan is voor de ruimtelijke aspecten tevens een
      structuurvisie als bedoeld in [artikel 2.3, tweede lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 4.1.2
    text: 'De hoofdlijnen omvatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.2.a
    text: |-
      een aanduiding, in het licht van de wettelijke doelstellingen en normen, van de gewenste ontwikkeling, werking en
      bescherming van de watersystemen, alsmede van de bijbehorende termijnen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.2.b
    text: |-
      een uiteenzetting van de maatregelen en voorzieningen, die met het oog op die ontwikkeling, werking en bescherming
      nodig zijn;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.2.c
    text: een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.2.d
    text: |-
      een visie op de gewenste ontwikkelingen in verband met de voorkoming en waar nodig beperking van overstromingen
      en waterschaarste, voor een periode van ten minste veertig jaren mede in verband met de verwachte
      klimaatveranderingen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.3
    text: 'In het plan worden voorts opgenomen:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.3.a
    text: |-
      de stroomgebiedbeheerplannen voor de stroomgebieddistricten Rijn, Maas, Schelde en Eems, voor zover die betrekking
      hebben of mede betrekking hebben op het Nederlandse grondgebied;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.3.b
    text: het Noordzeebeleid;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: 4.1.3.c
    text: de functies van de rijkswateren.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.1
  - number: '4.2'
    text: Onze Ministers zenden het vastgestelde nationale waterplan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de voorbereiding, inrichting en
      inhoud van het nationale waterplan, met inbegrip van de stroomgebiedbeheerplannen voor de stroomgebieddistricten
      Rijn, Maas, Schelde en Eems, voor zover die betrekking hebben of mede betrekking hebben op het Nederlandse
      grondgebied. Deze regels voorzien in elk geval in:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met vertegenwoordigers uit de kring van de
      besturen van alle provincies, waterschappen en gemeenten wordt voorbereid;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.3.1.b
    text: |-
      raadpleging van de bevoegde autoriteiten van de andere staten in de stroomgebieddistricten Rijn, Maas, Schelde
      en Eems;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.3.1.c
    text: 'met betrekking tot het Noordzeebeleid: raadpleging van de bevoegde autoriteiten van andere betrokken staten en'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.3.1.d
    text: inspraak van ingezetenen en belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Onze Ministers brengen de ontvangen zienswijzen over het ontwerp voor een internationaal stroomgebiedbeheerplan,
      voor zover die zienswijzen niet uitsluitend betrekking hebben op het Nederlandse deel van dat plan, ter kennis van
      de bevoegde autoriteiten van de betrokken staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Provinciale staten leggen in een of meer regionale waterplannen de hoofdlijnen vast van het in de
      provincie te voeren waterbeleid en de daartoe behorende aspecten van het provinciale ruimtelijke
      beleid. Deze plannen zijn voor de ruimtelijke aspecten tevens structuurvisies als bedoeld in
      [artikel 2.2, tweede lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 4.4.2
    text: 'De hoofdlijnen omvatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.4.2.a
    text: de vastlegging van de functies van de regionale wateren;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.4.2.b
    text: |-
      een aanduiding, in het licht van de wettelijke doelstellingen en normen en in samenhang met de onder a bedoelde
      functies, van de gewenste ontwikkeling, werking en bescherming van de regionale wateren, alsmede van de
      bijbehorende termijnen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.4.2.c
    text: |-
      een uiteenzetting van de maatregelen en voorzieningen die met het oog op de onder b bedoelde ontwikkeling, werking
      en bescherming nodig zijn;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.4.2.d
    text: een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Provinciale staten dragen er in samenwerking met de staten van aangrenzende provincies zorg voor, dat de regionale
      waterplannen tezamen betrekking hebben op het totale grondgebied van alle provincies.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Provinciale staten stellen bij verordening regels met betrekking tot de voorbereiding, vormgeving en inrichting van
      het regionale waterplan. Zij stellen daarbij in elk geval regels met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.5
  - number: 4.5.1.a
    text: |-
      de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met de beheerders van de watersystemen in de
      provincie, alsmede de gemeentebesturen wordt voorbereid;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.5
  - number: 4.5.1.b
    text: |-
      de raadpleging van Onze Minister, gedeputeerde staten van de aangrenzende provincies en, met betrekking tot
      grensvormende of grensoverschrijdende watersystemen, de ten aanzien van die watersystemen bevoegde Duitse of
      Belgische autoriteiten;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.5
  - number: 4.5.1.c
    text: de inspraak van belanghebbenden en ingezetenen van de provincie.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.5
  - number: 4.5.2
    text: Een vastgesteld regionaal waterplan wordt toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Een beheerder stelt met betrekking tot de watersystemen onder zijn beheer een beheerplan vast. Daarbij wordt voor
      regionale wateren rekening gehouden met het regionale waterplan dat betrekking heeft op die regionale wateren,
      en dient de afstemming op beheerplannen van andere beheerders, indien sprake is of zou kunnen zijn van samenhang
      tussen de onderscheidene watersystemen, te zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.6.2
    text: 'Het plan bevat:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.6.2.a
    text: |-
      het programma van de maatregelen en voorzieningen die, in aanvulling op en ter uitwerking van hetgeen in het
      nationale of regionale plan is opgenomen over maatregelen, nodig zijn met het oog op de ontwikkeling, werking en
      bescherming van rijkswateren, onderscheidenlijk regionale wateren, onder vermelding van de bijbehorende termijnen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.6.2.b
    text: |-
      aanvullende toekenning van functies aan rijkswateren of regionale wateren, voor zover het nationale,
      onderscheidenlijk regionale, plan voorziet in de mogelijkheid daartoe;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.6.2.c
    text: de voornemens voor de wijze waarop het beheer wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.6.2.d
    text: |-
      een overzicht van de financiële middelen, die voor de uitvoering van het programma en het te voeren beheer nodig
      zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur of provinciale verordening worden regels gesteld omtrent de
      voorbereiding, alsmede de vormgeving en inrichting van beheerplannen betreffende rijkswateren, onderscheidenlijk
      regionale wateren. Deze regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.7
  - number: 4.7.1.a
    text: |-
      de raadpleging van de in [artikel 4.6, eerste lid][ref1], bedoelde beheerders alsmede gedeputeerde staten van de
      provincies en de besturen van de veiligheidsregio’s waarbinnen de watersystemen of onderdelen daarvan zijn gelegen,
      alsmede de ten aanzien van grensvormende of grensoverschrijdende wateren bevoegde Belgische, Duitse of Britse
      autoriteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.7.1.b
    text: inspraak van belanghebbenden en ingezetenen van het beheersgebied.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Bij de maatregel of verordening, bedoeld in het eerste lid, wordt voorzien in toezending of kennisgeving van een
      vastgesteld beheerplan aan de ingevolge het eerste lid geraadpleegde instanties alsmede Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.7
  - number: 4.8.1
    text: |-
      De in dit hoofdstuk bedoelde plannen worden eenmaal in de zes jaren herzien. Voorts is tussentijdse herziening van
      de plannen mogelijk.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de termijn waarbinnen de
      herziening van een plan operationeel moet zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.8
  - number: 4.9.1
    text: Er is een deltaprogramma.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.2
    text: 'Het deltaprogramma bevat, in verband met de opgaven op het gebied van waterveiligheid en zoetwatervoorziening:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.2.a
    text: |-
      maatregelen en voorzieningen van nationaal belang ter voorkoming en waar nodig beperking van overstromingen en
      waterschaarste;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.2.b
    text: |-
      maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen, voor zover deze onderdeel uitmaken van de opgaven.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.3
    text: |-
      Het deltaprogramma kan tevens ambities op andere beleidsterreinen bevatten, mits deze niet ten koste gaan van de
      opgaven, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Van het deltaprogramma kunnen tevens deel uitmaken onderzoeken ten behoeve van de in het tweede en derde lid
      bedoelde maatregelen en voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.5
    text: |-
      In het deltaprogramma wordt jaarlijks voor de eerstvolgende zes jaren zo gedetailleerd als redelijkerwijs mogelijk
      is aangegeven welke maatregelen en voorzieningen in die periode zullen worden uitgevoerd en welke middelen
      beschikbaar worden gesteld voor:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.5.a
    text: |-
      opgaven als bedoeld in het tweede lid, onderdeel a respectievelijk onderdeel b, waarbij onderscheid wordt gemaakt
      tussen beheer en onderhoud enerzijds en aanleg anderzijds;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.5.b
    text: ambities als bedoeld in het derde lid, waarbij wordt aangegeven hoe deze ambities worden gefinancierd;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.5.c
    text: onderzoeken als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.6
    text: |-
      Het deltaprogramma maakt zichtbaar op welke wijze daarmee bijgedragen wordt aan het bereiken van de doelstellingen
      van het nationale waterplan op het gebied van waterveiligheid en zoetwatervoorziening.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
  - number: 4.9.7
    text: |-
      In het deltaprogramma wordt aangegeven op welke wijze rekening is gehouden met het voorstel en de adviezen, bedoeld
      in [artikel 3.6b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 1a
  - number: 4.10.1
    text: |-
      Onze Minister biedt jaarlijks, gelijktijdig met de begroting van het deltafonds voor het nieuwe jaar het
      deltaprogramma aan de Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Onze Minister stelt de Staten-Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij aan de
      beraadslagingen in de Staten-Generaal over het deltaprogramma verbindt voor de uitvoering van dat programma.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.10
  - number: 4.10.3
    text: Gevolgtrekkingen als bedoeld in het tweede lid worden aangemerkt als onderdeel van het deltaprogramma.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel4.10
  - number: 5.1.1
    text: |-
      De beheerder draagt zorg voor de vaststelling van een legger, waarin is omschreven waaraan waterstaatswerken naar
      ligging, vorm, afmeting en constructie moeten voldoen. Van de legger maakt deel uit een overzichtskaart, waarop de
      ligging van waterstaatswerken en daaraan grenzende beschermingszones staat aangegeven.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.1
  - number: 5.1.2
    text: |-
      De legger gaat vergezeld van een technisch beheersregister met betrekking tot primaire waterkeringen dan wel
      waterkeringen ten aanzien waarvan toepassing is gegeven aan [artikel 2.4][ref1], waarin de voor het behoud van het
      waterkerend vermogen kenmerkende gegevens van de constructie en de feitelijke toestand nader zijn omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5.1.3
    text: |-
      Bij of krachtens provinciale verordening of, ten aanzien van waterstaatswerken in beheer bij het Rijk, algemene
      maatregel van bestuur kunnen nadere voorschriften worden gegeven ten aanzien van de inhoud, vorm en periodieke
      herziening van de legger voor daarbij te onderscheiden categorieën van waterstaatswerken. Voorts kan daarbij
      vrijstelling worden verleend van de in het eerste lid bedoelde verplichtingen met betrekking tot bepaalde
      waterstaatswerken die zich naar hun aard of functie niet lenen voor het omschrijven van die elementen dan wel van
      geringe afmetingen zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Een beheerder is verplicht voor daartoe aan te wijzen oppervlaktewater- of grondwaterlichamen onder zijn beheer één
      of meer peilbesluiten vast te stellen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.2
  - number: 5.2.2
    text: |-
      In een peilbesluit worden waterstanden of bandbreedten waarbinnen waterstanden kunnen variëren vastgesteld, die
      gedurende daarbij aangegeven perioden zoveel mogelijk worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.2
  - number: 5.2.3
    text: |-
      De aanwijzing vindt plaats bij of krachtens algemene maatregel van bestuur dan wel bij of krachtens provinciale
      verordening voor zover het betreft rijkswateren onderscheidenlijk regionale wateren. Bij de maatregel of de
      verordening kunnen ten aanzien van rijkswateren onderscheidenlijk regionale wateren nadere regels worden gesteld
      met betrekking tot het peilbesluit.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      De beheerder neemt, met inachtneming van de bij of krachtens [hoofdstuk 2][ref1] gestelde regels, ten aanzien
      van de waterstaatswerken onder zijn beheer de nodige maatregelen voor het veilig en doelmatig gebruik daarvan,
      overeenkomstig de krachtens [hoofdstuk 4][ref2] aan die waterstaatswerken toegekende functies.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '4'
  - number: 5.4.1
    text: |-
      De aanleg of wijziging van een waterstaatswerk door of vanwege de beheerder geschiedt overeenkomstig een daartoe
      door hem vast te stellen projectplan. Met de aanleg of wijziging van een waterstaatswerk wordt gelijkgesteld de
      uitvoering van een werk tot beïnvloeding van een grondwaterlichaam.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Het plan bevat ten minste een beschrijving van het betrokken werk en de wijze waarop dat zal worden uitgevoerd,
      alsmede een beschrijving van de te treffen voorzieningen, gericht op het ongedaan maken of beperken van de nadelige
      gevolgen van de uitvoering van het werk. Voor in bij algemene maatregel van bestuur te bepalen gevallen bevat het
      plan een inventarisatie van maatschappelijke functies en ambities en mogelijke innovaties waarmee de aanleg of
      wijziging van een waterstaatswerk gecombineerd zou kunnen worden, inclusief de mogelijkheden om het desbetreffende
      werk middels een concessie voor werken of andere vorm van publiek-private samenwerking te realiseren.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen regels worden gesteld over de
      wijze waarop de inventarisatie wordt uitgevoerd en private partijen daarbij betrokken worden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
  - number: 5.4.4
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
  - number: 5.4.5
    text: |-
      Indien het plan de verlegging van een primaire waterkering betreft, kan het voorts voorzieningen bevatten met
      betrekking tot de inpassing in de omgeving van het gebied tussen de plaats waar de oorspronkelijke primaire
      waterkering is gelegen, en de plaats waar de nieuwe primaire waterkering komt te liggen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
  - number: 5.4.6
    text: |-
      Het eerste lid is niet van toepassing, indien ten aanzien van een in dat lid bedoeld werk de [Tracéwet][ref1] of
      de [Spoedwet wegverbreding][ref2] van toepassing is, of indien ten aanzien van dat werk toepassing wordt gegeven
      aan [afdeling 3.5 van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006147
      [ref2]: https://wetten.overheid.nl/BWBR0015158
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0006147
      - id: ref2
        bwb_id: BWBR0015158
      - id: ref3
        bwb_id: BWBR0020449
        afdeling: '3.5'
  - number: '5.5'
    text: |-
      Deze paragraaf is van toepassing op projectplannen tot aanleg, verlegging of versterking van primaire
      waterkeringen en, in de gevallen bij of krachtens provinciale verordening bepaald, op projectplannen van besturen
      van waterschappen voor de aanleg of wijziging van andere waterkeringen dan primaire waterkeringen en op andere
      waterstaatswerken van bovenlokale betekenis die met spoed en op gecoördineerde wijze tot stand moeten worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Op de voorbereiding van het projectplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 5.6.2
    text: |-
      De terinzagelegging, bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1], geschiedt tevens ten
      kantore van de betrokken bestuursorganen. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.6.3
    text: |-
      De beheerder stelt een projectplan tot aanleg, verlegging of versterking van een primaire waterkering vast binnen
      twaalf weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken. Na vaststelling zendt hij
      het plan onverwijld aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Het projectplan behoeft de goedkeuring van gedeputeerde staten van de provincie op wier grondgebied het wordt
      uitgevoerd. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Indien het een waterstaatswerk betreft dat in meer dan één provincie is gelegen, kunnen gedeputeerde staten van de
      desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van de provincie waarin
      het waterstaatswerk in hoofdzaak is gelegen, belast zijn met de goedkeuring van het projectplan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.7
  - number: 5.7.3
    text: |-
      In afwijking van [artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] kan het nemen van
      een besluit omtrent de goedkeuring van een projectplan tot aanleg, verlegging of versterking van een primaire
      waterkering niet worden verdaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 5.8.1
    text: |-
      Gedeputeerde staten bevorderen een gecoördineerde voorbereiding van de besluiten die nodig zijn ter uitvoering van
      het projectplan.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Gedeputeerde staten kunnen van andere betrokken bestuursorganen de medewerking vorderen die voor het welslagen van
      de coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Indien het een waterstaatswerk betreft dat in meer dan één provincie is gelegen, kunnen gedeputeerde staten van de
      desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van een van die provincies
      de coördinatie van de voorbereiding van de in het eerste lid bedoelde besluiten bevorderen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.8
  - number: 5.8.4
    text: |-
      Ten aanzien van aanvragen tot het nemen van besluiten als bedoeld in het eerste lid is de beheerder mede bevoegd
      deze in te dienen bij de bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.8
  - number: '5.9'
    text: |-
      Op de voorbereiding van de in [artikel 5.8, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 5.9.a
    text: |-
      de ontwerpen van de besluiten binnen een door gedeputeerde staten te bepalen termijn worden toegezonden aan
      gedeputeerde staten, die zorg dragen voor de in [artikel 3:13, eerste lid, van die wet][ref1] bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.9.b
    text: |-
      gedeputeerde staten ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kunnen geven aan de
      [artikelen 3:11, eerste lid][ref1], en [3:12 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.9.c
    text: zienswijzen naar voren kunnen worden gebracht door een ieder;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
  - number: 5.9.d
    text: |-
      in afwijking van [artikel 3:18 van die wet][ref1] de besluiten worden genomen binnen een door gedeputeerde staten
      te bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.9.e
    text: de besluiten onverwijld worden gezonden aan gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
  - number: 5.9.f
    text: |-
      gedeputeerde staten beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '5.10'
    text: |-
      Voor zover een bestemmingsplan voor de uitvoering van werken en werkzaamheden
      een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref1] vereist, geldt zodanige eis
      niet in het gebied dat is begrepen in een vastgesteld projectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 5.11.1
    text: |-
      Indien een bestuursorgaan, niet zijnde een bestuursorgaan van het Rijk, dat in eerste aanleg bevoegd is te
      beslissen op een aanvraag tot het nemen van een besluit dat nodig is ter uitvoering van het projectplan, niet of
      niet tijdig een ontwerp-besluit op de aanvraag aan gedeputeerde staten zendt, dan wel niet, niet tijdig of niet in
      overeenstemming met het projectplan beslist of een beslissing neemt die naar het oordeel van gedeputeerde staten
      wijziging behoeft, kunnen gedeputeerde staten een beslissing op de aanvraag nemen. In het laatste geval treedt hun
      besluit in de plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is te beslissen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.11
  - number: 5.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op ambtshalve te nemen besluiten ter uitvoering van het
      projectplan en andere besluiten dan die ter uitvoering van het projectplan, welke zijn gericht op de realisering
      van de in het projectplan opgenomen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.11
  - number: 5.11.3
    text: |-
      Indien bij de toepassing van het eerste lid de in dat lid bedoeld beslissing op een aanvraag tot het nemen van
      een besluit wordt genomen door gedeputeerde staten, draagt het bestuursorgaan dat in eerste aanleg bevoegd was te
      beslissen op de aanvraag de ter zake ontvangen leges over aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.11
  - number: '5.12'
    text: |-
      De in [artikel 5.8, eerste lid][ref1], bedoelde besluiten worden, voor zover zij gecoördineerd zijn voorbereid,
      gelijktijdig door gedeputeerde staten bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.13.1
    text: |-
      Tegen een besluit als bedoeld in [artikel 5.7, eerste lid][ref1], kan geen beroep bij de bestuursrechter worden
      ingesteld door een belanghebbende aan wie redelijkerwijze kan worden verweten dat hij geen zienswijzen als bedoeld
      in [artikel 3:15 van de Algemene wet bestuursrecht][ref2] naar voren heeft gebracht tegen het ontwerp van het
      projectplan waarop de goedkeuring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.14.1
    text: |-
      Onteigening ingevolge [titel II][ref1] of [IIa van de onteigeningswet][ref2] kan mede geschieden ter uitvoering van
      de in een projectplan opgenomen voorzieningen, bedoeld in [artikel 5.4, tweede of vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001842
      [ref2]: https://wetten.overheid.nl/BWBR0001842
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0001842
      - id: ref2
        bwb_id: BWBR0001842
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.14.2
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het
      projectplan door gedeputeerde staten is goedgekeurd. De rechtbank spreekt de onteigening niet uit dan nadat het
      projectplan onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
  - number: 5.15.1
    text: |-
      Indien ten gevolge van een ongewoon voorval de bodem of oever van een oppervlaktewaterlichaam zodanig is of
      dreigt te worden verontreinigd of aangetast dat de kwaliteit van die bodem of oever een belemmering vormt voor
      het bereiken van de gewenste gebiedskwaliteit, neemt de beheerder onverwijld de naar zijn oordeel noodzakelijke
      maatregelen ten einde de oorzaak van de verontreiniging of aantasting weg te nemen en de verontreiniging of de
      aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.15
  - number: 5.15.2
    text: |-
      De [artikelen 30, tweede tot en met vierde lid][ref1], en [74 van de Wet bodembescherming][ref2] zijn van
      overeenkomstige toepassing, met dien verstande dat voor «gedeputeerde staten» wordt gelezen: de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel74
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '74'
  - number: 5.16.1
    text: |-
      De beheerder kan rechthebbenden ten aanzien van gronden, waarin zich een verontreiniging bevindt die een
      belemmering kan vormen voor het bereiken van de gewenste gebiedskwaliteit en die zijn gelegen in of deel uitmaken
      van de bodem of oever van een oppervlaktewaterlichaam, bevelen op daarbij aangegeven wijze onderzoek te verrichten
      naar die verontreiniging.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.16
  - number: 5.16.2
    text: |-
      De beheerder kan degene, door wiens handelen een verontreiniging van de bodem of oever van een
      oppervlaktewaterlichaam is veroorzaakt, bevelen op daarbij aangegeven wijze onderzoek te verrichten naar die
      verontreiniging.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.16
  - number: 5.16.3
    text: |-
      De beheerder kan rechthebbenden ten aanzien van gronden, waarin zich een verontreiniging bevindt die een
      belemmering vormt voor het bereiken van de gewenste gebiedskwaliteit en die zijn gelegen in of deel uitmaken
      van de bodem of oever van een oppervlaktewaterlichaam, bevelen op daarbij aangegeven wijze tijdelijke
      beveiligingsmaatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.16
  - number: 5.16.4
    text: |-
      De in het eerste en derde lid bedoelde bevelen worden slechts gegeven aan rechthebbenden ten aanzien van gronden,
      die zij in gebruik hebben of hebben gehad in de uitoefening van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.16
  - number: 5.17.1
    text: |-
      Indien de beheerder maatregelen of voorzieningen als bedoeld in [artikel 4.6, tweede lid, onder a][ref1], treft
      in verband met een verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam die een
      belemmering vormt voor het bereiken van de gewenste gebiedskwaliteit, en deze verontreiniging of aantasting zich
      niet beperkt tot die bodem of oever, hebben die maatregelen of voorzieningen tevens betrekking op de bodem die niet
      behoort tot de bodem of oever van het oppervlaktewaterlichaam, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 5.17.1.a
    text: de bron van de verontreiniging of aantasting in de bodem of oever van het oppervlaktewaterlichaam is gelegen, en
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.17
  - number: 5.17.1.b
    text: |-
      de verontreiniging of aantasting van de bodem die niet tot de bodem of oever van een oppervlaktewaterlichaam
      behoort tot ernstige risico’s leidt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.17
  - number: 5.17.2
    text: |-
      In een geval als bedoeld in het eerste lid pleegt de beheerder, alvorens de maatregelen of voorzieningen te
      treffen, ter zake overleg met het bevoegde bestuursorgaan ingevolge de [Wet bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: 5.17.3
    text: |-
      [Paragraaf 3 van hoofdstuk IV van de Wet bodembescherming][ref1] is niet van toepassing op maatregelen of
      voorzieningen als bedoeld in het eerste lid die de beheerder treft in de bodem die niet behoort tot de bodem of
      oever van een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0003994
        paragraaf: '3'
  - number: '5.18'
    text: |-
      Indien een verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam als bedoeld in
      [artikel 6.8][ref1] zich niet beperkt tot die bodem of oever, pleegt de beheerder, alvorens van zijn bevoegdheden
      gebruik te maken, ter zake overleg met het bevoegde bestuursorgaan ingevolge de [Wet bodembescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003994
  - number: '5.19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen de kwaliteit van de bodem of
      oever van een oppervlaktewaterlichaam een belemmering vormt voor het realiseren van de gewenste gebiedskwaliteit.
      Bij of krachtens die maatregel kan worden bepaald in welke gevallen een ingreep in de bodem of oever van een
      oppervlaktewaterlichaam zonder meer is vereist.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.19
  - number: 5.20.1
    text: |-
      De met de inspectie van watersystemen of onderdelen daarvan belaste personen, werkzaam onder verantwoordelijkheid
      van de beheerder, zijn bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden met
      uitzondering van woningen zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.20
  - number: 5.20.2
    text: |-
      Onze Minister of het bestuur van een waterschap is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 3, tweede lid, van de Algemene wet op het binnentreden][ref1], tot het zonder toestemming van de bewoner
      binnentreden in een woning door een of meer daartoe bij besluit van Onze Minister of dat bestuur aangewezen
      personen, voor zover die woning deel uitmaakt van een waterstaatswerk of daarmee rechtstreeks in verbinding staat.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 5.20.3
    text: |-
      De [artikelen 5:13][ref1], [5:15, tweede en derde lid][ref2], [5:16][ref3] en
      [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.21.1
    text: |-
      De beheerder of, in voorkomende gevallen, gedeputeerde staten kunnen, voor zover dat voor de vervulling van hun
      taken redelijkerwijs nodig is, rechthebbenden ten aanzien van gronden de verplichting opleggen om op of in die
      gronden onderzoeken en daarmee verband houdende werkzaamheden te gedogen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.21
  - number: 5.21.2
    text: |-
      Spoedeisende gevallen uitgezonderd, wordt de beschikking waarbij de gedoogplicht wordt opgelegd, ten minste twee
      weken voor aanvang van het onderzoek aan de rechthebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.21
  - number: 5.22.1
    text: |-
      Degene die ter verkrijging van gegevens, benodigd voor de aanvraag of wijziging van een watervergunning of ter
      voldoening aan een andere op grond van deze wet, dan wel een verordening van waterschap of provincie in het kader
      van het waterbeheer, op hem rustende verplichting, onderzoek moet verrichten op of in gronden ten aanzien waarvan
      hem de nodige bevoegdheid ontbreekt, kan, indien de rechthebbenden ten aanzien van die gronden geen toestemming
      verlenen, de beheerder of het op grond van [hoofdstuk 6][ref1] bevoegde gezag verzoeken de rechthebbenden daartoe
      een gedoogplicht overeenkomstig [artikel 5.21][ref2] op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.22.2
    text: |-
      De beheerder, onderscheidenlijk het bevoegde gezag, stelt bij het opleggen van de gedoogplicht zodanige voorwaarden
      dat de vergoeding van schade aan de rechthebbenden op voldoende wijze is verzekerd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.22
  - number: 5.23.1
    text: |-
      Rechthebbenden ten aanzien van onroerende zaken zijn gehouden onderhouds- en herstelwerkzaamheden aan
      waterstaatswerken te gedogen, voorzover die werkzaamheden geschieden door of onder toezicht van de beheerder.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.23
  - number: 5.23.2
    text: |-
      Rechthebbenden ten aanzien van gronden, gelegen aan of in een oppervlaktewaterlichaam waarvan het onderhoud
      geschiedt door of onder toezicht van een beheerder, zijn gehouden op die gronden specie en maaisel te ontvangen,
      die tot regulier onderhoud van dat oppervlaktewaterlichaam worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.23
  - number: 5.23.3
    text: |-
      De beheerder stelt de rechthebbenden ten minste achtenveertig uur van tevoren schriftelijk in kennis van de
      voorgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.23
  - number: 5.24.1
    text: |-
      De beheerder kan, voor zover dat voor de vervulling van zijn taken redelijkerwijs nodig is, rechthebbenden ten
      aanzien van onroerende zaken de verplichting opleggen om de aanleg of wijziging van een waterstaatswerk en de
      daarmee verband houdende werkzaamheden te gedogen, wanneer naar zijn oordeel de belangen van die rechthebbenden
      onteigening niet vorderen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.24
  - number: 5.24.2
    text: |-
      [Artikel 5.21, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.25.1
    text: |-
      Rechthebbenden ten aanzien van onroerende zaken zijn gehouden te gedogen dat op of aan die zaken door of vanwege
      de beheerder meetmiddelen, seinen, merken of andere tekens worden aangebracht en in stand gehouden, indien dat naar
      het oordeel van de beheerder nodig is in verband met de functievervulling van een waterstaatswerk.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.25
  - number: 5.25.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op verkeerstekens die door of vanwege het op grond van de
      [Scheepvaartverkeerswet][ref1] bevoegde gezag worden aangebracht en in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: '5.26'
    text: |-
      Rechthebbenden ten aanzien van onroerende zaken, gelegen in of deel uitmakend van een oppervlaktewaterlichaam of
      bergingsgebied, zijn gehouden wateroverlast en overstromingen ten gevolge van de afvoer of tijdelijke berging van
      oppervlaktewater te dulden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.26
  - number: '5.27'
    text: |-
      Rechthebbenden ten aanzien van gronden waarin het grondwater invloed ondergaat door het onttrekken van grondwater
      of het infiltreren van water krachtens een watervergunning, zijn, onverminderd [artikel 7.18][ref1], gehouden dat
      onttrekken of infiltreren te gedogen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 5.28.1
    text: |-
      In deze paragraaf wordt verstaan onder gevaar: omstandigheden waardoor de goede staat van een of meer
      waterstaatswerken onmiddellijk en ernstig in het ongerede is of dreigt te geraken.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.28
  - number: 5.28.2
    text: |-
      [Artikel 5.29, eerste lid, tweede volzin][ref1], is niet van toepassing op gevaar dat uitgaat van een wrak in de
      zin van de [Wet bestrijding maritieme ongevallen][ref2] dat zich bevindt in de Noordzee dan wel wordt veroorzaakt
      door voorvallen of omstandigheden als bedoeld in [artikel 16][ref3] of [18 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037162
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.28
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0037162
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '18'
  - number: 5.29.1
    text: |-
      De beheerder draagt zorg voor het houden van oefeningen in doeltreffend optreden bij gevaar. Tevens stelt hij
      voor de waterstaatswerken onder zijn beheer een calamiteitenplan vast, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.29
  - number: 5.29.2
    text: |-
      In het calamiteitenplan wordt de afstemming op crisisplannen en voor het waterbeheer van belang zijnde
      rampbestrijdingsplannen, vastgesteld voor het gebied waarin de waterstaatswerken zijn gelegen, gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.29
  - number: 5.29.3
    text: |-
      Het ontwerp van een calamiteitenplan wordt in elk geval voor commentaar gezonden aan de besturen van de
      veiligheidsregio’s waarbinnen de waterstaatswerken zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.29
  - number: 5.30.1
    text: |-
      De beheerder is in geval van gevaar, zolang de daardoor ontstane situatie zulks noodzakelijk maakt, bevoegd
      de maatregelen te treffen die hij nodig oordeelt, zo nodig in afwijking van wettelijke voorschriften,
      met dien verstande dat hij geen maatregelen treft die in strijd zijn met de [Grondwet][ref1] of met
      internationaalrechtelijke verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 5.30.2
    text: |-
      Indien het bestuur van een waterschap gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, meldt
      hij dit onverwijld aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
  - number: 5.30.3
    text: |-
      Indien het bestuur van een waterschap in verband met gevaar voor een primaire waterkering gebruik heeft gemaakt
      van de bevoegdheid, bedoeld in het eerste lid, meldt hij dit, in afwijking van het tweede lid, onverwijld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
  - number: 5.30.4
    text: |-
      De beheerder brengt, zodra de feitelijke omstandigheden op grond waarvan toepassing is gegeven aan het eerste lid,
      dat toelaten, het waterstaatswerk weer zoveel mogelijk in overeenstemming met de in de legger voorgeschreven staat.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
  - number: 5.30.5
    text: |-
      De beheerder draagt zorg voor een evaluatie van het optreden en verder handelen bij toepassing van het eerste
      en vierde lid. Hij zendt in elk geval een exemplaar van deze evaluatie ter kennisneming aan gedeputeerde staten,
      alsmede aan de besturen van de veiligheidsregio’s waarbinnen de waterstaatswerken zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
  - number: 5.30.6
    text: |-
      Indien de evaluatie betrekking heeft op zijn optreden en verder handelen in verband met gevaar voor een primaire
      waterkering, zendt de beheerder, in afwijking van het vijfde lid, in elk geval een exemplaar van de evaluatie
      ter kennisneming aan Onze Minister, alsmede aan de besturen van de veiligheidsregio’s waarbinnen de primaire
      waterkering is gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.30
  - number: 5.31.1
    text: |-
      Gedeputeerde staten kunnen, indien naar hun oordeel het bestuur van een waterschap niet of niet voldoende optreedt
      bij gevaar, overeenkomstige toepassing geven aan [artikel 3.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.31.2
    text: |-
      Indien de omstandigheden geen voorafgaande bijeenroeping van gedeputeerde staten gedogen, is Onze Commissaris in
      de provincie bevoegd tot uitoefening van de in het eerste lid bedoelde bevoegdheid, zolang het gevaar voortduurt en
      totdat gedeputeerde staten van die bevoegdheid gebruik maken.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.31
  - number: 5.31.3
    text: |-
      Onze Minister kan, indien naar zijn oordeel gedeputeerde staten of Onze Commissaris in de provincie ten onrechte
      niet of niet voldoende gebruik maken van de bevoegdheid, bedoeld in het eerste of tweede lid, overeenkomstige
      toepassing geven aan [artikel 3.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.31.4
    text: |-
      In afwijking van het eerste lid, kan Onze Minister, indien naar zijn oordeel het bestuur van een waterschap
      niet of niet voldoende optreedt bij gevaar voor een primaire waterkering, overeenkomstige toepassing geven aan
      [artikel 3.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5.32.1
    text: |-
      Onze Minister is in de openbare lichamen Bonaire, Sint Eustatius en Saba in geval van een watersnood, zolang de
      daardoor ontstane situatie zulks noodzakelijk maakt, bevoegd maatregelen te treffen die hij nodig oordeelt, zo
      nodig in afwijking van wettelijke voorschriften, met dien verstande dat hij geen maatregelen treft die in strijd
      zijn met de [Grondwet][ref1] of met internationaalrechtelijke verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 5.32.2
    text: Onder watersnood wordt mede verstaan een dringend of dreigend gevaar voor overstroming.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.32
  - number: 5.32.3
    text: Onze Minister draagt zorg voor het houden van oefeningen in doeltreffend optreden bij watersnood.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.32
  - number: 5.32.4
    text: Onze Minister draagt zorg voor een evaluatie van het optreden en verder handelen bij toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel5.32
  - number: '6.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *lozen:*
      brengen van stoffen in een oppervlaktewaterlichaam of brengen van water of stoffen op een zuiveringtechnisch werk;
        - *revisievergunning:* vergunning die wordt verleend krachtens [artikel 6.18, eerste lid][ref1], of
      [6.19, eerste lid][ref2];
        - *stoffen:* afvalstoffen, verontreinigende of schadelijke stoffen;
        - *storten van stoffen:* zich in zee of op zee ontdoen van stoffen of van vaartuigen, luchtvaartuigen of op de
      zeebodem opgerichte werken, op een wijze als bedoeld in [artikel 6.3, eerste lid, onderdeel a][ref3], in samenhang
      met [artikel 6.12, onderdeel b][ref4], dan wel als bedoeld in artikel 6.3, eerste lid, onderdeel b, of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.2.1
    text: 'Het is verboden om stoffen te brengen in een oppervlaktewaterlichaam, tenzij:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
  - number: 6.2.1.a
    text: |-
      een daartoe strekkende vergunning is verleend door Onze Minister of, ten aanzien van regionale wateren, het bestuur
      van het betrokken waterschap;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
  - number: 6.2.1.b
    text: daarvoor vrijstelling is verleend bij of krachtens algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
  - number: 6.2.1.c
    text: |-
      [artikel 6.3, eerste tot en met derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.2.2
    text: |-
      Het is verboden met behulp van een werk, niet zijnde een openbaar vuilwaterriool, water of stoffen te brengen op
      een zuiveringtechnisch werk, tenzij:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
  - number: 6.2.2.a
    text: |-
      een daartoe strekkende vergunning is verleend door het bestuur van het in [artikel 3.4][ref1] bedoelde waterschap;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 6.2.2.b
    text: daarvoor vrijstelling is verleend bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Voor de toepassing van het eerste lid worden de gronden binnen een oppervlaktewaterlichaam die ingevolge
      [artikel 3.1][ref1] of [3.2][ref2] zijn aangewezen als drogere oevergebieden, niet tot dat oppervlaktewaterlichaam
      gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 6.2.4
    text: |-
      Het eerste lid is niet van toepassing op het lozen ten gevolge van het gebruik van meststoffen op agrarische
      gronden in uiterwaarden en buitendijkse gebieden in het kader van de normale agrarische bedrijfsuitoefening, voor
      zover daaromtrent regels zijn gesteld bij of krachtens de [Meststoffenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 6.3.1
    text: 'Het is zonder daartoe strekkende vergunning van Onze Minister verboden:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.1.a
    text: |-
      zich van stoffen te ontdoen door deze vanaf of vanuit een vaartuig dan wel een luchtvaartuig in zee te brengen of
      op zee te verbranden;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.1.b
    text: zich in zee te ontdoen van vaartuigen, luchtvaartuigen of op de zeebodem opgerichte werken;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.1.c
    text: |-
      stoffen aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk zich daarvan op een wijze als bedoeld
      in onderdeel a te ontdoen of die stoffen in zee te brengen ten behoeve van een activiteit als bedoeld in onderdeel
      d, dan wel met dat oogmerk stoffen af te geven of op te slaan;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.1.d
    text: |-
      stoffen in zee te brengen vanaf of vanuit een vaartuig, luchtvaartuig of op de zeebodem opgericht werk ten behoeve
      van een activiteit waarbij bewust wordt ingegrepen in het mariene milieu om natuurlijke processen te beïnvloeden en
      die als zodanig is aangewezen in bijlage 4 bij het op 7 november 1996 te Londen tot stand gekomen Protocol bij het
      Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en andere stoffen
      van 1972 (Trb. 1998, 134).
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.2
    text: |-
      Het eerste lid is mede van toepassing op handelingen die plaatsvinden op in Nederland geregistreerde vaartuigen en
      luchtvaartuigen die zich bevinden buiten Nederland en de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.3
    text: |-
      Het eerste lid, onderdeel a, is van overeenkomstige toepassing op het zich ontdoen van stoffen door deze vanaf
      of vanuit een op de zeebodem opgericht werk in zee te brengen of op zee te verbranden, tenzij die handelingen
      samenhangen met of voortvloeien uit het normale gebruik van dat werk, mits dat gebruik niet ten doel heeft het zich
      ontdoen van stoffen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.4
    text: 'Het eerste lid, onderdelen a tot en met c, en het tweede en derde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.4.a
    text: het plaatsen van vaste substanties of voorwerpen met een ander oogmerk dan het zich er enkel van ontdoen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.3.4.b
    text: |-
      het achterlaten van vaste substanties of voorwerpen die aanvankelijk in zee zijn geplaatst met een ander oogmerk
      dan het zich ervan ontdoen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Het is verboden zonder daartoe strekkende vergunning van gedeputeerde staten grondwater te onttrekken of water
      te infiltreren:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.4
  - number: 6.4.1.a
    text: |-
      ten behoeve van industriële toepassingen, indien de te onttrekken hoeveelheid water meer dan 150 000 m3 per jaar
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.4
  - number: 6.4.1.b
    text: ten behoeve van de openbare drinkwatervoorziening of een bodemenergiesysteem.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.4
  - number: 6.4.2
    text: |-
      Bij provinciale verordening kan worden bepaald dat het eerste lid niet van toepassing is voor onttrekkingen waarbij
      de te onttrekken hoeveelheid ten hoogste 10 m3 per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.4
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor rijkswateren en, met het oog op internationale
      verplichtingen of bovenregionale belangen, voor regionale wateren worden bepaald dat het verboden is zonder daartoe
      strekkende vergunning van Onze Minister, onderscheidenlijk het bestuur van het waterschap:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.5
  - number: 6.5.a
    text: water te brengen in of te onttrekken aan een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.5
  - number: 6.5.b
    text: |-
      grondwater te onttrekken of water te infiltreren in andere gevallen dan als bedoeld in [artikel 6.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.5.c
    text: |-
      gebruik te maken van een waterstaatswerk of een daartoe behorende beschermingszone door, anders dan in
      overeenstemming met de functie, daarin, daarop, daarboven, daarover of daaronder werkzaamheden te verrichten,
      werken te maken of te behouden, dan wel vaste substanties of voorwerpen te storten, te plaatsen of neer te leggen,
      of deze te laten staan of liggen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.5
  - number: 6.5a
    text: |-
      Een verbod bij of krachtens algemene maatregel van bestuur als bedoeld in
      [artikel 6.5, aanhef en onderdeel c][ref1], is niet van toepassing op windparken waarop de
      [Wet windenergie op zee][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0036752
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036752
  - number: 6.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verrichten van
      handelingen als bedoeld in de [artikelen 6.2 tot en met 6.5][ref1], met dien verstande dat voor regionale wateren,
      voor zover het handelingen als bedoeld in [artikel 6.4][ref2] of [6.5][ref3] betreft, slechts regels worden gesteld
      met het oog op internationale verplichtingen of bovenregionale belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.6.2
    text: |-
      Bij of krachtens de maatregel kan met betrekking tot daarbij aangegeven handelingen de verplichting worden opgelegd
      te voldoen aan voorschriften, gesteld door een bij of krachtens die maatregel aangewezen bestuursorgaan. Daarbij
      kan worden bepaald dat deze voorschriften mogen afwijken van de krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.6
  - number: 6.6.3
    text: |-
      Bij de maatregel kan voorts worden bepaald dat bij verordening van een waterschap of bij provinciale verordening,
      dan wel in de aan een watervergunning te verbinden voorschriften, mag worden afgeweken van de krachtens het eerste
      lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.6
  - number: '6.7'
    text: |-
      De in [artikel 6.6, eerste lid][ref1], bedoelde regels kunnen mede een vrijstelling van een verbod als bedoeld in
      [artikel 6.3][ref2], [6.4][ref3] of [6.5][ref4] inhouden of een verbod op het verrichten van daarbij aangegeven
      handelingen, alsmede de verplichting om, met inachtneming van bij of krachtens algemene maatregel van bestuur
      te stellen regels, het verrichten van handelingen te melden, metingen uit te voeren, gegevens te registreren en
      daarvan opgave te doen aan een daarbij aangewezen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.8'
    text: |-
      Ieder die handelingen verricht of nalaat en die weet of redelijkerwijs had kunnen vermoeden dat door die
      handelingen of het nalaten daarvan de bodem of oever van een oppervlaktewaterlichaam kan worden verontreinigd
      of aangetast, is verplicht alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd om die
      verontreiniging of aantasting te voorkomen, dan wel indien die verontreiniging of aantasting zich voordoet, de
      verontreiniging of de aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.
      Indien de verontreiniging of aantasting het gevolg is van een ongewoon voorval, worden de maatregelen onverwijld
      genomen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.8
  - number: 6.9.1
    text: |-
      Degene die handelingen verricht als bedoeld in [artikel 6.8][ref1] en daarbij kennis neemt van een verontreiniging
      of aantasting van de bodem of oever van een oppervlaktewaterlichaam die door die handelingen wordt veroorzaakt,
      maakt zo spoedig mogelijk melding van de verontreiniging of aantasting bij de beheerder. Hij geeft daarbij aan
      welke maatregelen als bedoeld in artikel 6.8 hij voornemens is te treffen of reeds heeft getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.9.2
    text: |-
      De beheerder kan aanwijzingen geven met betrekking tot de te nemen maatregelen, bedoeld in [artikel 6.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.10.1
    text: |-
      Onze Minister kan de toegang tot een waterstaatswerk in beheer bij het Rijk geheel of gedeeltelijk verbieden of
      beperken door een daartoe strekkende bekendmaking ter plaatse, dan wel gedaan op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.10
  - number: 6.10.2
    text: |-
      Het eerste lid is niet van toepassing op het gebruik door het openbaar verkeer, tenzij het verbod of de beperking
      van de toegang betrekking heeft op een veiligheidszone rondom een werk in de exclusieve economische zone die is
      ingesteld in overeenstemming met artikel 60 van het VN-Zeerechtverdrag, dan wel rondom een werk in de territoriale
      zee.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.10
  - number: 6.11.1
    text: |-
      De in dit hoofdstuk gegeven bevoegdheden kunnen ten aanzien van handelingen als bedoeld in
      [artikel 6.5, onderdeel c][ref1], die plaatsvinden in de Nederlandse exclusieve economische zone, mede worden
      toegepast ter bescherming van andere belangen dan waarin [artikel 2.1][ref2] voorziet, voor zover daarin niet bij
      of krachtens andere wet is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 6.11.2
    text: |-
      De in dit hoofdstuk gegeven bevoegdheden kunnen ten aanzien van handelingen als bedoeld in
      [artikel 6.2, tweede lid][ref1], mede worden toegepast ter bescherming van de doelmatige werking van een
      zuiveringtechnisch werk.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.12'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
  - number: 6.12.a
    text: |-
      handelingen waaromtrent regels zijn gesteld bij of krachtens de [Kernenergiewet][ref1] of de
      [Wet voorkoming verontreiniging door schepen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0002402
      - id: ref2
        bwb_id: BWBR0003642
  - number: 6.12.b
    text: |-
      handelingen aan boord van vaartuigen of luchtvaartuigen in zee, voor zover die handelingen samenhangen met of
      voortvloeien uit het normale gebruik van het vaartuig of luchtvaartuig, mits dat gebruik niet ten doel heeft het
      zich ontdoen van stoffen;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
  - number: 6.12.c
    text: |-
      handelingen aan boord van oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de
      uitvoering van de militaire taak, ongeacht hun nationaliteit;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
  - number: 6.12.d
    text: |-
      handelingen in zee waaromtrent regels zijn gesteld bij of krachtens de [Mijnbouwwet][ref1] alsmede het
      onttrekken van grondwater bij of ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte in de zin
      van [artikel 1 van die wet][ref2], voor zover het onttrekken op een diepte van meer dan 500 meter beneden de
      oppervlakte van de aardbodem plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0014168
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 6.12.e
    text: |-
      handelingen waaromtrent regels zijn gesteld bij of krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref1],
      voor zover bij algemene maatregel van bestuur niet anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: '6.13'
    text: |-
      Deze paragraaf is mede van toepassing op de krachtens verordening van een waterschap vereiste vergunningen, voor
      zover deze betrekking hebben op handelingen in een watersysteem of beschermingszone. Met een vergunning wordt
      gelijkgesteld een krachtens zodanige verordening vereiste ontheffing.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze
      waarop de aanvraag om een watervergunning geschiedt en de gegevens en bescheiden die door de aanvrager
      worden verstrekt met het oog op de beslissing op de aanvraag. Bij de maatregel kan, in afwijking van
      [artikel 2:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1], worden bepaald dat de aanvraag
      geheel of gedeeltelijk elektronisch wordt ingediend, of dat het bevoegd gezag geheel of gedeeltelijk elektronisch
      ingediende aanvragen in ontvangst neemt. Daarbij kan worden bepaald dat de verplichtingen slechts gelden in daarbij
      aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 6.14.2
    text: |-
      Bij een verordening als bedoeld in [artikel 6.13][ref1], kunnen eveneens regels worden gesteld met betrekking tot
      de gegevens over de bij die verordening aangewezen handeling, die door de aanvrager worden verstrekt met het oog op
      de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.15.1
    text: |-
      De aanvraag om vergunning wordt ingediend bij burgemeester en wethouders van de gemeente waar de handeling geheel
      of in hoofdzaak wordt verricht. Tevens kan, in afwijking van de eerste volzin, de aanvraag bij het bevoegd gezag
      worden ingediend. In dat geval zendt het bevoegd gezag een afschrift van de aanvraag aan burgemeester en wethouders
      van de gemeente waar de handeling geheel of in hoofdzaak wordt verricht.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.15
  - number: 6.15.2
    text: |-
      Het orgaan waarbij de aanvraag is ingediend, zendt de aanvrager onverwijld een bewijs van ontvangst van de
      aanvraag, waarin het de datum vermeldt, waarop het de aanvraag heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.15
  - number: 6.15.3
    text: |-
      Het bevoegd gezag zendt de aanvrager nadat het de aanvraag heeft ontvangen, onverwijld een bericht waarin het
      vermeldt dat het bevoegd is op de aanvraag te beslissen en welke procedure ter voorbereiding van die beslissing zal
      worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.15
  - number: 6.16.1
    text: |-
      Op de voorbereiding van een beschikking tot verlening, wijziging of intrekking van een vergunning voor
      het lozen of storten van stoffen of, in de gevallen bedoeld in [artikel 6.4][ref1], het onttrekken van
      grondwater of infiltreren van water, zijn, tenzij bij algemene maatregel van bestuur anders wordt bepaald, de
      [afdelingen 3.4 van de Algemene wet bestuursrecht][ref2] en [13.2 van de Wet milieubeheer][ref3] van toepassing.
      Bij de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] worden de stukken als bedoeld in
      [artikel 3:11 van die wet][ref5] tevens ter inzage gelegd in de gemeente waar de handeling geheel of in hoofdzaak
      wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6.16.2
    text: |-
      Een vergunning voor het onttrekken van grondwater of infiltreren van water als bedoeld in [artikel 6.4][ref1],
      wordt niet verleend of gewijzigd dan nadat het bestuur van het betrokken waterschap door gedeputeerde staten
      in de gelegenheid is gesteld advies te geven omtrent de aanvraag of het ontwerp van de op de aanvraag te nemen
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.16.3
    text: |-
      Bij algemene maatregel van bestuur kunnen bestuursorganen worden aangewezen, die door het bevoegd gezag in de
      gelegenheid worden gesteld advies uit te brengen omtrent het ontwerp van de beschikking tot verlening of wijziging
      van een vergunning.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Indien een aanvraag om vergunning betrekking heeft op een handeling of samenstel van handelingen ten aanzien
      waarvan meer dan één bestuursorgaan bevoegd is, wordt de aanvraag in behandeling genomen en wordt daarop beslist
      door het bestuursorgaan van het hoogste gezag. Ontbreekt een hoogste gezag, dan wordt de aanvraag in behandeling
      genomen en wordt daarop beslist door het bestuursorgaan op wiens grondgebied de handeling of het samenstel van
      handelingen in hoofdzaak wordt verricht.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.17
  - number: 6.17.2
    text: |-
      In afwijking van het eerste lid kunnen de betrokken bestuursorganen gezamenlijk uit hun midden een ander
      bestuursorgaan aanwijzen dat de aanvraag in behandeling zal nemen en daarop zal beslissen. De bevoegdheid tot
      aanwijzing kan steeds in mandaat worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.17
  - number: 6.17.3
    text: |-
      Op een aanvraag als bedoeld in het eerste lid wordt niet beslist dan nadat de medebetrokken bestuursorganen in
      de gelegenheid zijn gesteld advies te geven omtrent de aanvraag of het ontwerp van de op de aanvraag te nemen
      beschikking.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.17
  - number: 6.17.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op aanvragen tot wijziging van een vergunning
      waardoor het aantal betrokken bestuursorganen toeneemt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Indien een wijziging wordt aangevraagd van een vergunning die betrekking heeft op een handeling die deel uitmaakt
      van een samenstel van handelingen van de aanvrager waarvoor ook reeds een of meer andere watervergunningen van
      kracht zijn, kan het bevoegd gezag, in overeenstemming met de andere bevoegde bestuursorganen, in het belang van
      een doelmatige uitvoering en handhaving van de betrokken vergunningen bepalen dat een watervergunning moet worden
      aangevraagd die betrekking heeft op alle handelingen die behoren tot het samenstel en daarbij voorziet in de
      aangevraagde wijziging.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.18
  - number: 6.18.2
    text: |-
      Indien overeenkomstig het eerste lid is bepaald dat een revisievergunning moet worden aangevraagd, besluiten
      de bevoegde bestuursorganen tot het buiten behandeling laten van aanvragen voor het wijzigen van afzonderlijke
      watervergunningen die van kracht zijn voor handelingen die behoren tot het betrokken samenstel.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.18
  - number: 6.18.3
    text: |-
      Het bevoegd gezag voor de ingevolge het eerste lid te verlenen revisievergunning kan bij de verlening van die
      vergunning de rechten die de aanvrager aan de al eerder verleende vergunningen ontleent, niet wijzigen anders
      dan mogelijk zou zijn ingevolge [artikel 6.22][ref1], in samenhang met de [artikelen 2.1][ref2], [6.11][ref3] en
      [6.20][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.18.4
    text: |-
      Een ingevolge het eerste lid verleende revisievergunning vervangt met ingang van het tijdstip waarop zij in werking
      treedt, de eerder voor het betrokken samenstel van handelingen verleende vergunningen. Deze vergunningen vervallen
      op het tijdstip waarop de revisievergunning onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.18
  - number: 6.19.1
    text: |-
      Indien voor een samenstel van handelingen verschillende watervergunningen van kracht zijn, kan een van de bevoegde
      gezagen, in overeenstemming met de andere bevoegde bestuursorganen, in het belang van een doelmatige uitvoering
      en handhaving van de betrokken vergunningen ambtshalve een vergunning verlenen die betrekking heeft op alle
      handelingen die behoren tot het samenstel.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.19
  - number: 6.19.2
    text: |-
      [Artikel 6.18, tweede lid][ref1], is van overeenkomstige toepassing zodra het ontwerp van de in het eerste lid
      bedoelde revisievergunning is toegezonden aan de houders van de in het eerste lid bedoelde vergunningen. Voorts
      zijn artikel 6.18, derde en vierde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.20.1
    text: |-
      Aan een vergunning kunnen voorschriften en beperkingen worden verbonden. De aan de vergunning te verbinden
      voorschriften kunnen mede betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.20
  - number: 6.20.1.a
    text: |-
      financiële zekerheidsstelling voor de nakoming van krachtens de vergunning geldende verplichtingen of voor de
      dekking van aansprakelijkheid voor schade, voortvloeiend uit door de vergunde handeling of het staken van die
      handeling veroorzaakte nadelige gevolgen voor het watersysteem;
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.20
  - number: 6.20.1.b
    text: |-
      het na het staken van de vergunde handeling wegnemen, compenseren of beperken van door de vergunde handeling of het
      staken van die handeling veroorzaakte nadelige gevolgen voor het watersysteem.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.20
  - number: 6.20.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de aan een vergunning
      te verbinden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.20
  - number: 6.20.3
    text: Gedragingen in strijd met de aan een vergunning verbonden voorschriften zijn verboden.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.20
  - number: '6.21'
    text: |-
      Een vergunning wordt geweigerd, voor zover verlening daarvan niet verenigbaar is met de doelstellingen in
      [artikel 2.1][ref1] of de belangen, bedoeld in [artikel 6.11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.22.1
    text: Het bevoegd gezag kan een vergunning en de daaraan verbonden voorschriften en beperkingen wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
  - number: 6.22.2
    text: |-
      Het bevoegd gezag kan een vergunning geheel of gedeeltelijk intrekken, indien de vergunning gedurende drie
      achtereenvolgende jaren niet is gebruikt.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
  - number: 6.22.3
    text: 'Het bevoegd gezag trekt de vergunning geheel of gedeeltelijk in:'
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
  - number: 6.22.3.a
    text: |-
      op aanvraag van de vergunninghouder, voor zover de doelstellingen en belangen, bedoeld in de [artikelen 2.1][ref1]
      en [6.11][ref2], zich hiertegen niet verzetten;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.22.3.b
    text: |-
      indien zich omstandigheden of feiten voordoen waardoor de handeling of handelingen waarvoor de vergunning is
      verleend, niet langer toelaatbaar worden geacht met het oog op de in de [artikelen 2.1][ref1] en [6.11][ref2]
      bedoelde doelstellingen en belangen;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.22.3.c
    text: |-
      indien een voor Nederland verbindend verdrag of besluit van een volkenrechtelijke organisatie, dan wel een
      wettelijk voorschrift ter uitvoering daarvan, daartoe verplicht.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
  - number: 6.22.4
    text: |-
      Het bevoegd gezag gaat in een geval als bedoeld in het derde lid, onderdeel b of c, niet tot intrekking over,
      voor zover kan worden volstaan met wijziging of aanvulling van de aan de vergunning verbonden voorschriften of
      beperkingen.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.22
  - number: 6.23.1
    text: |-
      Indien door wijziging of gedeeltelijke intrekking van een met toepassing van [artikel 6.17][ref1] verleende
      vergunning de betrokkenheid van het bestuursorgaan dat de vergunning als bevoegd gezag heeft verleend eindigt,
      wordt tegelijk met het besluit tot wijziging of gedeeltelijke intrekking aan de vergunninghouder medegedeeld welk
      bestuursorgaan nadat het besluit onherroepelijk is geworden, bevoegd gezag is. Zo nodig wordt door overgebleven
      bestuursorganen overeenkomstige toepassing gegeven aan artikel 6.17.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.23.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien de betrokkenheid van het bevoegd gezag eindigt door de
      gedeeltelijke weigering van een vergunning.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.23
  - number: 6.24.1
    text: |-
      Een vergunning geldt tevens voor de rechtsopvolgers van de vergunninghouder, tenzij bij de vergunning anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.24
  - number: 6.24.2
    text: |-
      De rechtsopvolger van de vergunninghouder doet binnen vier weken nadat de vergunning voor hem is gaan gelden,
      daarvan mededeling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.24
  - number: 6.25.1
    text: |-
      De [artikelen 8.40, tweede en derde lid][ref1], en [8.40a van de Wet milieubeheer][ref2] zijn, voor zover een
      krachtens [artikel 6.6][ref3] vast te stellen algemene maatregel van bestuur betrekking heeft op het lozen of
      storten van stoffen, op die maatregel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.25.2
    text: |-
      De voordracht voor een krachtens [artikel 6.6][ref1] vast te stellen algemene maatregel van bestuur wordt, voor
      zover die maatregel betrekking heeft op het lozen of storten van stoffen, niet gedaan dan nadat het ontwerp in de
      Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop
      de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen. Gelijktijdig met de
      bekendmaking wordt het ontwerp aan de beide Kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.26.1
    text: |-
      Op vergunningen voor het lozen of storten van stoffen zijn de volgende bepalingen van de
      [Wet algemene bepalingen omgevingsrecht][ref1] van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 6.26.1.a
    text: |-
      [2.14, eerste lid en derde tot en met zesde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 6.26.1.b
    text: |-
      [2.22, vijfde lid, eerste en tweede volzin][ref1], met dien verstande dat aan de watervergunning voorschriften
      worden verbonden die strengere eisen bevatten dan de algemeen verbindende voorschriften, bedoeld in de
      eerste volzin van dat lid, voor zover deze eisen naar het oordeel van het bevoegd gezag noodzakelijk zijn
      ter verwezenlijking van de voor het desbetreffende oppervlaktewaterlichaam in het beheerplan, bedoeld in
      [hoofdstuk 4, paragraaf 3][ref2], van deze wet, opgenomen maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 6.26.1.c
    text: |-
      [2.25, eerste lid][ref1], [2.30][ref2], [2.31, eerste lid, aanhef en onder b][ref3],
      [2.33, eerste lid, aanhef en onder b][ref4], en [8.1][ref5], met dien verstande dat voor «omgevingsvergunning»
      wordt gelezen «vergunning» dat voor «milieu» wordt gelezen «chemische en ecologische kwaliteit van watersystemen»
      en voor «een inrichting of mijnbouwwerk of de werking daarvan»: het storten of lozen van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel8
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '8'
  - number: 6.26.2
    text: |-
      In afwijking van [artikel 6.16, eerste lid][ref1], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2]
      niet van toepassing op de voorbereiding van een beschikking op de aanvraag tot wijziging van een vergunning voor
      het lozen van stoffen, die niet leidt tot andere of grotere nadelige gevolgen voor de chemische en ecologische
      kwaliteit van watersystemen dan volgens de geldende vergunning zijn toegestaan. De [artikelen 3.8][ref3] en
      __REF003___________________________________________________________________________________________________________
      _ zijn van overeenkomstige toepassing op de voorbereiding, bedoeld in de eerste volzin, met dien verstande dat voor
      «omgevingsvergunning» wordt gelezen: vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 6.26.3
    text: |-
      Een vergunning voor het infiltreren van water wordt slechts verleend, indien er geen gevaar is
      voor verontreiniging van het grondwater. Bij de beoordeling van dat gevaar worden de krachtens
      [artikel 12 van de Wet bodembescherming][ref1] gestelde regels in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel12
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '12'
  - number: 6.26.4
    text: |-
      Onverminderd [artikel 6.20][ref1] worden aan een vergunning als bedoeld in het derde lid voorschriften verbonden
      volgens de krachtens [artikel 12 van de Wet bodembescherming][ref2] gestelde regels. Aan de vergunning worden in
      ieder geval voorschriften verbonden ter verzekering van de controle op de kwaliteit van het grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '12'
  - number: 6.26.5
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing op de aan een vergunning voor het onttrekken van
      grondwater te verbinden voorschriften, voor zover die voorschriften betrekking hebben op het infiltreren van water.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Een aanvraag tot verlening of wijziging van een watervergunning, met uitzondering van een krachtens
      [artikel 6.5, aanhef en onder c][ref1], of op grond van een verordening als bedoeld in [artikel 6.13][ref2]
      vereiste vergunning voor het gebruik van een waterstaatswerk of een bijbehorende beschermingszone, die betrekking
      heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.27.1.a
    text: |-
      een inrichting waartoe een IPPC-installatie als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] behoort, of


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '1'
  - number: 6.27.1.b
    text: |-
      een inrichting als bedoeld in [artikel 15, onder b, van de Kernenergiewet][ref1], wordt gelijktijdig ingediend
      met een aanvraag tot verlening of wijziging van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] of een vergunning krachtens
      de [Kernenergiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002402
  - number: 6.27.2
    text: |-
      De beslissing op een in het eerste lid bedoelde aanvraag om een watervergunning wordt overeenkomstig
      [hoofdstuk 14 van de Wet milieubeheer][ref1] gecoördineerd voorbereid met de beslissing op de betrokken aanvraag
      krachtens de [Wet algemene bepalingen omgevingsrecht][ref2] of de [Kernenergiewet][ref3]. Daarbij worden in ieder
      geval de in [artikel 14.3, tweede lid, van de Wet milieubeheer][ref4] genoemde handelingen gelijktijdig verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk14
      [ref2]: https://wetten.overheid.nl/BWBR0024779
      [ref3]: https://wetten.overheid.nl/BWBR0002402
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0024779
      - id: ref3
        bwb_id: BWBR0002402
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '14'
  - number: 6.27.3
    text: |-
      De in het eerste lid bedoelde aanvraag om een watervergunning wordt in ieder geval buiten behandeling
      gelaten, indien niet binnen zes weken na het tijdstip van indiening ervan tevens een aanvraag krachtens de
      [Wet algemene bepalingen omgevingsrecht][ref1] of de [Kernenergiewet][ref2] is ingediend, dan wel de aanvraag
      krachtens die wetten buiten behandeling wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0002402
  - number: 6.27.4
    text: |-
      Het orgaan dat krachtens de betrokken wet bevoegd is op de aanvraag om vergunning te beslissen, brengt
      binnen acht weken na ontvangst van de in het eerste lid eerstbedoelde aanvraag advies uit met het oog op de
      samenhang tussen de beschikkingen op de onderscheidene aanvragen. Dat orgaan wordt voorts in de gelegenheid
      gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvraag. In een geval als bedoeld
      in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] kan het bevoegd gezag besluiten de in
      de eerste volzin bedoelde termijn met een bij zijn besluit te bepalen redelijke termijn te verlengen. Indien
      [artikel 30, vierde lid, van de Dienstenwet][ref2] op de aanvraag van toepassing is, wordt de verlengingstermijn
      afgestemd op de duur waarmee ingevolge dat artikellid de termijn voor het geven van de beschikking op de aanvraag
      kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel30
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '30'
  - number: 6.27.5
    text: |-
      Wordt in de vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref1] een bepaling opgenomen over de
      termijn waarvoor zij geldt, dan wordt in de watervergunning een gelijke bepaling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 6.27.6
    text: |-
      Wordt een betrokken vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref1] of de
      [Kernenergiewet][ref2] ingetrokken, dan kan de watervergunning eveneens worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0002402
  - number: 6.27.7
    text: |-
      Het tweede, vierde en vijfde lid en de [artikelen 6.28][ref1] en [6.29][ref2] zijn van overeenkomstige toepassing
      op een ambtshalve wijziging van een in het eerste lid bedoelde vergunning. Voorts dragen gedeputeerde staten er ten
      minste zorg voor dat de betrokken beschikkingen gezamenlijk worden bekendgemaakt en daarvan gezamenlijk mededeling
      wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.27.8
    text: |-
      Wordt in een geval als bedoeld in [artikel 3.16 van de Wet algemene bepalingen omgevingsrecht][ref1], dan wel in de
      [Kernenergiewet][ref2] juncto dat artikel, beroep ingesteld tegen een beschikking inzake een vergunning krachtens
      een van die wetten, dan kan de uitspraak in beroep ook betrekking hebben op een daarmee samenhangende, inzake een
      watervergunning gegeven beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002402
  - number: 6.27.9
    text: |-
      Dit artikel is niet van toepassing indien op de voorbereiding van de in het eerste lid
      bedoelde watervergunning, de omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of de vergunning krachtens
      de [Kernenergiewet][ref2][afdeling 3.4 van de Algemene wet bestuursrecht][ref3] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002402
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002402
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6.28.1
    text: |-
      In een geval als bedoeld in [artikel 6.27, eerste lid][ref1], waarin gedeputeerde staten of een van Onze
      Ministers bevoegd zijn de krachtens de betrokken wet vereiste vergunning te verlenen, kunnen gedeputeerde staten,
      onderscheidenlijk Onze betrokken Minister, indien dat met het oog op de samenhang tussen de beschikkingen op de
      onderscheidene aanvragen in het belang van de bescherming van het milieu geboden is, en zo nodig in afwijking van
      regels, gesteld krachtens een provinciale verordening als bedoeld in [artikel 1.2 van de Wet milieubeheer][ref2],
      aan het bevoegd gezag een aanwijzing geven ter zake van de inhoud van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 6.28.2
    text: |-
      Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvraag
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6.28.3
    text: |-
      De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een exemplaar
      ervan wordt gevoegd bij ieder exemplaar van die beschikking.
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.28
  - number: '6.29'
    text: |-
      In een geval als bedoeld in [artikel 6.27, eerste lid][ref1], waarin burgemeester en wethouders bevoegd zijn de
      krachtens de betrokken wet vereiste vergunning te verlenen, is [artikel 6.28][ref2] van overeenkomstige toepassing,
      met dien verstande dat gedeputeerde staten op een daartoe strekkend verzoek van burgemeester en wethouders een
      aanwijzing kunnen geven aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '6.30'
    text: |-
      Het bevoegd gezag en de bestuursorganen die zijn betrokken bij de beslissing op
      de aanvraag om een watervergunning, maken gebruik van de voorziening, bedoeld in
      [artikel 7.6, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1]. Artikel 7.6, tweede lid, tweede en
      derde volzin, van die wet zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
  - number: 7.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *Algemene wet:*
      [Algemene wet inzake rijksbelastingen][ref1];
        - *bedrijfsruimte:* een naar zijn aard en inrichting als afzonderlijk geheel te beschouwen ruimte of terrein, niet
      zijnde een woonruimte, een zuiveringtechnisch werk of een openbaar vuilwaterriool;
        - *gebouwde onroerende zaak:* gebouwde onroerende zaak als bedoeld in
      [artikel 117, eerste lid, onder d, van de Waterschapswet][ref2];
        - *heffingsambtenaar:* ambtenaar, bedoeld in [artikel 123, derde lid, onder b, van de Waterschapswet][ref3]
      onderscheidenlijk ambtenaar, bedoeld in [artikel 7.10, vierde lid][ref4], die voor de toepassing van de
      [Algemene wet][ref5] in de plaats treedt van de inspecteur;
        - *ingezetene:* ingezetene als bedoeld in [artikel 116, onder a, van de Waterschapswet][ref6];
        - *lozen:* het brengen van afvalstoffen, verontreinigende of schadelijke stoffen in een oppervlaktewaterlichaam;
        - *woonruimte:* een ruimte die blijkens zijn inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002320
      [ref6]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0025458/2018-07-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0005108
