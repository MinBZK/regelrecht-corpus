  - number: '7.10'
    text: |-
      1 De verontreinigingsheffing ter zake van lozen op een oppervlaktewaterlichaam in beheer bij het Rijk wordt door
      Onze Minister bij wege van aanslag geheven. De heffing wordt geheven over het kalenderjaar.

      2 Onverminderd het overigens in deze paragraaf bepaalde, wordt de in het eerste lid bedoelde heffing geheven met
      overeenkomstige toepassing van de [Algemene wet][ref1], met uitzondering van de [artikelen 2, vierde lid][ref2],
      [37 tot en met 39][ref3], [47a][ref4], [48][ref5], [52][ref6], [53][ref7], [54][ref8], [76][ref9],
      [80, tweede, derde en vierde lid][ref10], [82][ref11], [84][ref12], [86][ref13] en [87 van die wet][ref14].

      3 Voor de toepassing van de [Algemene wet ][ref15] treedt Onze Minister in de plaats van Onze Minister van
      Financiën.

      4 Voorts treden voor de toepassing van de [Algemene wet ][ref16] de daartoe bij besluit van Onze Minister
      aangewezen ambtenaar of ambtenaren in de plaats van het bestuur van 's Rijksbelastingen en van de inspecteur,
      onderscheidenlijk van de ambtenaren van de rijksbelastingdienst.

      5 Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.


