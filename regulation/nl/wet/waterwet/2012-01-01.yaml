        artikel: 5:20
  - number: '5.21'
    text: |-
      1 De beheerder kan, voor zover dat voor de vervulling van zijn taken redelijkerwijs nodig is, rechthebbenden
      ten aanzien van gronden de verplichting opleggen om op of in die gronden onderzoeken en daarmee verband houdende
      werkzaamheden te gedogen.

      2 Spoedeisende gevallen uitgezonderd, wordt de beschikking waarbij de gedoogplicht wordt opgelegd, ten minste twee
      weken voor aanvang van het onderzoek aan de rechthebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.21
  - number: '5.22'
    text: |-
      1 Degene die ter verkrijging van gegevens, benodigd voor de aanvraag of wijziging van een watervergunning of ter
      voldoening aan een andere op grond van deze wet, dan wel een verordening van waterschap of provincie in het kader
      van het waterbeheer, op hem rustende verplichting, onderzoek moet verrichten op of in gronden ten aanzien waarvan
      hem de nodige bevoegdheid ontbreekt, kan, indien de rechthebbenden ten aanzien van die gronden geen toestemming
      verlenen, de beheerder of het op grond van [hoofdstuk 6][ref1] bevoegde gezag verzoeken de rechthebbenden daartoe
      een gedoogplicht overeenkomstig [artikel 5.21][ref2] op te leggen.

      2 De beheerder, onderscheidenlijk het bevoegde gezag, stelt bij het opleggen van de gedoogplicht zodanige
      voorwaarden dat de vergoeding van schade aan de rechthebbenden op voldoende wijze is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5.21
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '5.21'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '5.23'
    text: |-
      1 Rechthebbenden ten aanzien van onroerende zaken zijn gehouden onderhouds- en herstelwerkzaamheden aan
      waterstaatswerken te gedogen, voorzover die werkzaamheden geschieden door of onder toezicht van de beheerder.

      2 Rechthebbenden ten aanzien van gronden, gelegen aan of in een oppervlaktewaterlichaam waarvan het onderhoud
      geschiedt door of onder toezicht van een beheerder, zijn gehouden op die gronden specie en maaisel te ontvangen,
      die tot regulier onderhoud van dat oppervlaktewaterlichaam worden verwijderd.

      3 De beheerder stelt de rechthebbenden ten minste achtenveertig uur van tevoren schriftelijk in kennis van de
      voorgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.23
  - number: '5.24'
    text: |-
      1 De beheerder kan, voor zover dat voor de vervulling van zijn taken redelijkerwijs nodig is, rechthebbenden ten
      aanzien van onroerende zaken de verplichting opleggen om de aanleg of wijziging van een waterstaatswerk en de
      daarmee verband houdende werkzaamheden te gedogen, wanneer naar zijn oordeel de belangen van die rechthebbenden
      onteigening niet vorderen.

      2 [Artikel 5.21, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.21
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5.21'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '5.25'
    text: |-
      1 Rechthebbenden ten aanzien van onroerende zaken zijn gehouden te gedogen dat op of aan die zaken door of vanwege
      de beheerder meetmiddelen, seinen, merken of andere tekens worden aangebracht en in stand gehouden, indien dat naar
      het oordeel van de beheerder nodig is in verband met de functievervulling van een waterstaatswerk.

      2 Het eerste lid is van overeenkomstige toepassing op verkeerstekens die door of vanwege het op grond van de
      [Scheepvaartverkeerswet][ref1] bevoegde gezag worden aangebracht en in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: '5.26'
    text: |-
      Rechthebbenden ten aanzien van onroerende zaken, gelegen in of deel uitmakend van een oppervlaktewaterlichaam of
      bergingsgebied, zijn gehouden wateroverlast en overstromingen ten gevolge van de afvoer of tijdelijke berging van
      oppervlaktewater te dulden.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.26
  - number: '5.27'
    text: |-
      Rechthebbenden ten aanzien van gronden waarin het grondwater invloed ondergaat door het onttrekken van grondwater
      of het infiltreren van water krachtens een watervergunning, zijn, onverminderd [artikel 7.18][ref1], gehouden dat
      onttrekken of infiltreren te gedogen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.18
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7.18'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '5.28'
    text: |-
      1 In deze paragraaf wordt verstaan onder gevaar: omstandigheden waardoor de goede staat van een of meer
      waterstaatswerken onmiddellijk en ernstig in het ongerede is of dreigt te geraken.

      2 Deze paragraaf is niet van toepassing op gevaren die het gevolg zijn van een ongeval als bedoeld in de
      [Wet bestrijding ongevallen Noordzee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005444
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.28
    references:
      - id: ref1
        bwb_id: BWBR0005444
  - number: '5.29'
    text: |-
      1 De beheerder draagt zorg voor het houden van oefeningen in doeltreffend optreden bij gevaar. Tevens stelt hij
      voor de waterstaatswerken onder zijn beheer een calamiteitenplan vast, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen regels.

      2 In het calamiteitenplan wordt de afstemming op crisisplannen en voor het waterbeheer van belang zijnde
      rampbestrijdingsplannen, vastgesteld voor het gebied waarin de waterstaatswerken zijn gelegen, gewaarborgd.

      3 Het ontwerp van een calamiteitenplan wordt in elk geval voor commentaar gezonden aan de besturen van de
      veiligheidsregio’s waarbinnen de waterstaatswerken zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.29
  - number: '5.30'
    text: |-
      1 De beheerder is in geval van gevaar, zolang de daardoor ontstane situatie zulks noodzakelijk maakt,
      bevoegd de maatregelen te treffen die hij nodig oordeelt, zo nodig in afwijking van wettelijke voorschriften,
      met dien verstande dat hij geen maatregelen treft die in strijd zijn met de [Grondwet][ref1] of met
      internationaalrechtelijke verplichtingen.

      2 Indien het bestuur van een waterschap gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, meldt
      hij dit onverwijld aan gedeputeerde staten.

      3 De beheerder brengt, zodra de feitelijke omstandigheden op grond waarvan toepassing is gegeven aan het eerste
      lid, dat toelaten, het waterstaatswerk weer zoveel mogelijk in overeenstemming met de in de legger voorgeschreven
      staat.

      4 De beheerder draagt zorg voor een evaluatie van het optreden en verder handelen bij toepassing van het eerste
      en derde lid. Hij zendt in elk geval een exemplaar van deze evaluatie ter kennisneming aan gedeputeerde staten,
      alsmede aan de besturen van de veiligheidsregio’s waarbinnen de waterstaatswerken zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '5.31'
    text: |-
      1 Gedeputeerde staten kunnen, indien naar hun oordeel het bestuur van een waterschap niet of niet voldoende
      optreedt bij gevaar, overeenkomstige toepassing geven aan [artikel 3.12][ref1].

      2 Indien de omstandigheden geen voorafgaande bijeenroeping van gedeputeerde staten gedogen, is Onze Commissaris in
      de provincie bevoegd tot uitoefening van de in het eerste lid bedoelde bevoegdheid, zolang het gevaar voortduurt en
      totdat gedeputeerde staten van die bevoegdheid gebruik maken.

      3 Onze Minister kan, indien naar zijn oordeel gedeputeerde staten of Onze Commissaris in de provincie ten onrechte
      niet of niet voldoende gebruik maken van de bevoegdheid, bedoeld in het eerste of tweede lid, overeenkomstige
      toepassing geven aan [artikel 3.13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '3.13'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '5.32'
    text: |-
      1 Onze Minister is in de openbare lichamen Bonaire, Sint Eustatius en Saba in geval van een watersnood, zolang
      de daardoor ontstane situatie zulks noodzakelijk maakt, bevoegd maatregelen te treffen die hij nodig oordeelt, zo
      nodig in afwijking van wettelijke voorschriften, met dien verstande dat hij geen maatregelen treft die in strijd
      zijn met de [Grondwet][ref1] of met internationaalrechtelijke verplichtingen.

      2 Onder watersnood wordt mede verstaan een dringend of dreigend gevaar voor overstroming.

      3 Onze Minister draagt zorg voor het houden van oefeningen in doeltreffend optreden bij watersnood.

      4 Onze Minister draagt zorg voor een evaluatie van het optreden en verder handelen bij toepassing van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '6.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder:

        - *bevoegd gezag:* tot verlening van een watervergunning bevoegd bestuursorgaan, in voorkomend geval met toepassing
      van [artikel 6.17][ref1];
        - *lozen:* brengen van stoffen in een oppervlaktewaterlichaam of brengen van water of stoffen op een
      zuiveringtechnisch werk;
        - *revisievergunning:* vergunning die wordt verleend krachtens [artikel 6.18, eerste lid][ref2], of
      [6.19, eerste lid][ref3];
        - *stoffen:* afvalstoffen, verontreinigende of schadelijke stoffen;
        - *storten van stoffen:* zich in zee of op zee ontdoen van stoffen of van vaartuigen, luchtvaartuigen of op de
      zeebodem opgerichte werken, op een wijze als bedoeld in [artikel 6.3, eerste lid, onderdeel a][ref4], in samenhang
      met [artikel 6.12, onderdeel b][ref5], dan wel als bedoeld in artikel 6.3, eerste lid, onderdeel b, of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.17
