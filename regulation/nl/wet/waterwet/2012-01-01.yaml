  - number: '7.8'
    text: |-
      1 Van verontreinigingsheffing zijn vrijgesteld:

      a. lozingen die plaatsvinden met behulp van een vuilwaterriool;

      b. lozingen van stoffen vanuit een zuiveringtechnisch werk door een beheerder op een oppervlaktewaterlichaam dat
      bij hem in beheer is;

      c. lozingen van stoffen afkomstig uit een zuiveringtechnisch werk anders dan door de beheerder, mits het lozen
      plaatsvindt op een oppervlaktewaterlichaam dat bij die beheerder in beheer is en de hoeveelheid afvalstoffen,
      verontreinigende of schadelijke stoffen niet is toegenomen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat het bij die maatregel aan te geven onttrekken van
      grondwater is vrijgesteld van grondwaterheffing.

      3 Voorts kunnen bij of krachtens algemene maatregel van bestuur onderscheidenlijk bij belastingverordening nadere
      regels worden gesteld met betrekking tot de verontreinigingsheffing. Nadere regels met betrekking tot de kosten,
      bedoeld in [artikel 7.7, eerste lid, onderdeel b][ref1], kunnen worden gesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.8
    references:
