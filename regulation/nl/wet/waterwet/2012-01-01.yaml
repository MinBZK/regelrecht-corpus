  - number: '5.13'
    text: |-
      1 Tegen een besluit als bedoeld in de [artikelen 5.7, eerste lid][ref1], en [5.8, eerste lid][ref2], kan beroep
      worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref3] vangt de termijn voor het indienen van
      een beroepschrift tegen de besluiten, bedoeld in [artikel 5.8, eerste lid][ref4], aan met ingang van de dag na die
      waarop de in [artikel 5.12][ref5] bedoelde bekendmaking is geschied.


