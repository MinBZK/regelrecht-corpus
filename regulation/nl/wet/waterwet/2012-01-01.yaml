        hoofdstuk: '4'
  - number: '2.12'
    text: |-
      1 Iedere zes jaren brengt de beheerder verslag uit aan gedeputeerde staten over de algemene waterstaatkundige
      toestand van de primaire waterkering.

      2 Iedere zes jaren brengt de beheerder van het buitenwater, zijnde de grote rivieren, verslag uit aan gedeputeerde
      staten over de mate waarin voldaan wordt aan de voor deze wateren opgestelde legger, mede in het licht van de
      hoogwaterstanden als bedoeld in [artikel 2.3, eerste lid][ref1].

      3 Gedeputeerde staten brengen telkens over de in het eerste lid genoemde periode verslag uit aan Onze Minister
      over elk van de dijkringen in hun gebied, met dien verstande dat ten aanzien van een dijkring die in meer dan één
      provincie is gelegen gedeputeerde staten van de betreffende provincies gezamenlijk verslag uitbrengen aan Onze
      Minister. Onze Minister zendt de verslagen van gedeputeerde staten met zijn bevindingen daaromtrent aan de beide
      Kamers der Staten-Generaal.

      4 De in het eerste lid bedoelde verslagen bevatten een beoordeling van de veiligheid. Die beoordeling geschiedt
      onder meer in het licht van de ingevolge [artikel 2.2, eerste of tweede lid][ref2], vastgestelde veiligheidsnorm,
      de ingevolge [artikel 2.3, eerste lid][ref3], vastgestelde factoren, de in [artikel 2.6, eerste lid][ref4],
      bedoelde technische leidraden en de in [artikel 5.1][ref5] bedoelde legger. Bij ministeriële regeling worden nadere
      regels gesteld over de beoordeling.

      5 Indien de beoordeling van de veiligheid daartoe aanleiding geeft, bevatten de in het eerste lid bedoelde
      verslagen een omschrijving van de voorzieningen die op een daarbij aan te geven termijn nodig worden geacht.

      6 Uiterlijk een jaar na de verzending, bedoeld in het derde lid, laatste volzin, zendt Onze Minister aan
      beide Kamers der Staten-Generaal, met het in [artikel 7.23, eerste lid][ref6], bedoelde programma, een
      overzicht van maatregelen die door de beheerders worden getroffen met betrekking tot primaire waterkeringen
      die blijkens de in het eerste lid bedoelde verslagen niet voldoen aan de veiligheidsnorm, bedoeld in
      [artikel 2.2, eerste en tweede lid][ref7].


