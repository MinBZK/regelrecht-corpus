  - number: '8.1'
    text: |-
      1 De beheerder heeft tot taak:

      a. zorg te dragen voor de bestuursrechtelijke handhaving van het bij of krachtens de [hoofdstukken 5][ref1]
      en [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde, voor zover betrekking hebbend op de door
      hem beheerde watersystemen en de daarbij behorende beschermingszones en van het bij of krachtens
      [titel 12.3 van de Wet milieubeheer][ref4] bepaalde met betrekking tot het brengen van stoffen in een
      oppervlaktewaterlichaam;

      b. gegevens die met het oog op de uitoefening van de onder a bedoelde taak van belang zijn, te verzamelen en te
      registreren;

      c. klachten te behandelen die betrekking hebben op de naleving van de in onderdeel a bedoelde voorschriften.

      2 Met de beheerder worden voor de toepassing van het eerste lid gelijkgesteld gedeputeerde staten, ter zake van
      handelingen als bedoeld in [artikel 6.4][ref5].


