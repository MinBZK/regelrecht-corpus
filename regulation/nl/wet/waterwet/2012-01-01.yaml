  - number: '1.2'
    text: |-
      1 Voor de toepassing van het begrip stroomgebieddistrict in deze wet wordt het Nederlandse grondgebied ingedeeld
      in de op Nederlands grondgebied gelegen delen van de stroomgebieddistricten Eems, Maas, Rijn en Schelde. Onder
      het Nederlandse grondgebied wordt in dit artikel mede verstaan de territoriale zee, voor zover die is gelegen
      aan de landzijde van de lijn waarvan elk punt zich bevindt op een afstand van een internationale zeemijl, gemeten
      zeewaarts vanaf de laagwaterlijn, bedoeld in [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref1] of
      de basislijn, bedoeld in [artikel 2 van die wet][ref2].

      2 De onderlinge grenzen van de Nederlandse delen van de stroomgebieddistricten worden vastgesteld bij of krachtens
      algemene maatregel van bestuur. Daarbij wordt tevens voorzien in de toedeling van de grondwaterlichamen aan de
      stroomgebieddistricten.

      3 Bij de voorbereiding van de maatregel horen Onze Ministers gedeputeerde staten van de betrokken provincies en de
      beheerders alsmede de bevoegde autoriteiten van de andere staten in het stroomgebieddistrict.


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel2
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel1.2
