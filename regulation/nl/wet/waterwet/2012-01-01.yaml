  - number: '7.6'
    text: |-
      1 Het tarief van de heffing ter zake van lozingen op een oppervlaktewaterlichaam in beheer bij het Rijk bedraagt
      € 35,50 per vervuilingseenheid.

      2 In afwijking van het eerste lid bedraagt het tarief per vervuilingseenheid van de heffing ter zake van lozingen
      op een oppervlaktewaterlichaam in beheer bij het Rijk vanuit een zuiveringtechnisch werk voor het biologisch
      zuiveren van huishoudelijk afvalwater 50% van het in het eerste lid genoemde bedrag.

      3 Het tarief van de heffing ter zake van lozingen op een oppervlaktewaterlichaam in beheer bij een waterschap
      is gelijk aan het door dat waterschap voor het desbetreffende belastingjaar vastgestelde tarief van de
      zuiveringsheffing, bedoeld in [artikel 122d van de Waterschapswet][ref1].

      4 In afwijking van het eerste lid is van heffing vrijgesteld de in het tweede lid bedoelde lozing indien deze
      plaatsvindt anders dan door de beheerder, mits de hoeveelheid afvalstoffen, verontreinigende of schadelijke stoffen
      niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122d
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122d
  - number: '7.7'
    text: |-
      1 Provinciale staten zijn, onder de naam grondwaterheffing, bevoegd bij wijze van belasting een heffing in te
      stellen wegens onttrekken van grondwater, ter bestrijding van de ten laste van de provincie komende kosten:

      a. van maatregelen, direct verband houdende met het voorkomen en tegengaan van nadelige gevolgen van het onttrekken
      van grondwater en het infiltreren van water;

      b. in verband met voor het grondwaterbeleid noodzakelijke onderzoekingen;

      c. in verband met het houden van een register ter zake van het onttrekken van grondwater en het infiltreren van
      water;

      d. in verband met de vergoeding ingevolge [artikel 7.14, eerste lid][ref1], van schade, voortvloeiend uit de
      uitvoering van [artikel 6.4][ref2];

      e. in verband met de uitvoering van [artikel 7.19][ref3].

      2 Aan de heffing worden onderworpen de bij provinciale verordening aan te wijzen houders van inrichtingen of
      werken, bestemd tot het onttrekken van grondwater.

      3 Als grondslag voor de heffing geldt de onttrokken hoeveelheid grondwater. Indien op grond van
      vergunningvoorschriften water wordt geïnfiltreerd, wordt voor het vaststellen van de grondslag de geïnfiltreerde
      hoeveelheid volgens bij provinciale verordening te stellen nadere regels in mindering gebracht op de onttrokken
      hoeveelheid grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.14
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel7.19
