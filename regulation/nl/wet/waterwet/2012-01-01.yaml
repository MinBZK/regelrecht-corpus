  - number: '6.12'
    text: |-
      Dit hoofdstuk is niet van toepassing op:

      a. handelingen waaromtrent regels zijn gesteld bij of krachtens de [Kernenergiewet][ref1] of de
      [Wet voorkoming verontreiniging door schepen][ref2];

      b. handelingen aan boord van vaartuigen of luchtvaartuigen in zee, voor zover die handelingen samenhangen met of
      voortvloeien uit het normale gebruik van het vaartuig of luchtvaartuig, mits dat gebruik niet ten doel heeft het
      zich ontdoen van stoffen;

      c. handelingen aan boord van oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de
      uitvoering van de militaire taak, ongeacht hun nationaliteit;

      d. handelingen in zee waaromtrent regels zijn gesteld bij of krachtens de [Mijnbouwwet][ref3] alsmede het
      onttrekken van grondwater bij of ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte in de zin
      van [artikel 1 van die wet][ref4], voor zover het onttrekken op een diepte van meer dan 500 meter beneden de
      oppervlakte van de aardbodem plaatsvindt;

      e. handelingen waaromtrent regels zijn gesteld bij of krachtens de
      [Wet gewasbeschermingsmiddelen en biociden][ref5], voor zover bij algemene maatregel van bestuur niet anders wordt
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0003642
      [ref3]: https://wetten.overheid.nl/BWBR0014168
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0021670
