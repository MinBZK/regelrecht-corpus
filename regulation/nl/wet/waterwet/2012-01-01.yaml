  - number: '7.24'
    text: |-
      1 Ter bestrijding van de kosten verbonden aan de uitvoering van maatregelen als bedoeld in
      [artikel 7.23, eerste lid][ref1], is een waterschap een jaarlijkse bijdrage aan Onze Minister verschuldigd.

      2 De jaarlijkse bijdrage wordt berekend volgens de formule:

      B = 40,5 × 106 (I/IT + WG/WGT), waarin

      B voorstelt: de te berekenen bijdrage in euro’s;

      I voorstelt: het aantal ingezetenen in het gebied van het waterschap op de peildatum;

      IT voorstelt: het aantal ingezetenen in de gebieden van de waterschappen tezamen op de peildatum;

      WG voorstelt: de som van de op basis van [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] vastgestelde
      waarden van de gebouwde onroerende zaken in het gebied van het waterschap op de peildatum;

      WGT voorstelt: de som van de op basis van hoofdstuk IV van de Wet waardering onroerende zaken vastgestelde waarden
      van de gebouwde onroerende zaken in de gebieden van de waterschappen tezamen op de peildatum.

      3 De peildatum, bedoeld in het tweede lid, is 1 januari 2010 voor de jaarlijkse bijdrage over de kalenderjaren 2011
      tot en met 2014 en voor elke daaropvolgende aaneengesloten periode van vier kalenderjaren telkens 1 januari van het
      laatste kalenderjaar dat voorafgaat aan de betrokken periode.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.23
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.24
