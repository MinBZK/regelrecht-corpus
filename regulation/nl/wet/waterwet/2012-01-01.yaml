        paragraaf: '2'
  - number: '6.20'
    text: |-
      1 Aan een vergunning kunnen voorschriften en beperkingen worden verbonden. De aan de vergunning te verbinden
      voorschriften kunnen mede betrekking hebben op:

      a. financiële zekerheidsstelling voor de nakoming van krachtens de vergunning geldende verplichtingen of voor
      de dekking van aansprakelijkheid voor schade, voortvloeiend uit door de vergunde handeling of het staken van die
      handeling veroorzaakte nadelige gevolgen voor het watersysteem;

      b. het na het staken van de vergunde handeling wegnemen, compenseren of beperken van door de vergunde handeling of
      het staken van die handeling veroorzaakte nadelige gevolgen voor het watersysteem.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de aan een vergunning
      te verbinden voorschriften en beperkingen.

      3 Gedragingen in strijd met de aan een vergunning verbonden voorschriften zijn verboden.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.20
  - number: '6.21'
    text: |-
      Een vergunning wordt geweigerd, voor zover verlening daarvan niet verenigbaar is met de doelstellingen in
      [artikel 2.1][ref1] of de belangen, bedoeld in [artikel 6.11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.11
