  - number: '1.3'
    text: |-
      1 De dijkringen en de primaire waterkeringen worden aangegeven op de als [bijlage I][ref1] en [IA][ref2] bij deze
      wet behorende landkaarten.

      2 De in het eerste lid bedoelde bijlage kan worden gewijzigd bij algemene maatregel van bestuur. Bij de
      voorbereiding van de maatregel worden gedeputeerde staten en beheerders die bevoegd zijn voor de betreffende
      dijkringen en primaire waterkeringen gehoord.

      3 Een algemene maatregel van bestuur als bedoeld in het tweede lid treedt niet eerder in werking dan drie maanden
      na de datum waarop deze aan beide Kamers der Staten-Generaal is toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
  - number: '1.4'
    text: Deze wet is mede van toepassing in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel1.4
  - number: '2.1'
    text: |-
      1 De toepassing van deze wet is gericht op:

      a. voorkoming en waar nodig beperking van overstromingen, wateroverlast en waterschaarste, in samenhang met

      b. bescherming en verbetering van de chemische en ecologische kwaliteit van watersystemen en

      c. vervulling van maatschappelijke functies door watersystemen.

      2 De toepassing van deze wet is mede gericht op andere doelstellingen dan genoemd in het eerste lid, voor zover dat
      elders in deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 In de bij deze wet behorende [bijlage II][ref1] is voor elke dijkring de veiligheidsnorm aangegeven als
      gemiddelde overschrijdingskans per jaar van de hoogste hoogwaterstand waarop de tot directe kering van het
      buitenwater bestemde primaire waterkering moet zijn berekend, mede gelet op de overige het waterkerend vermogen
      bepalende factoren. [Artikel 1.3, tweede en derde lid][ref2], is van overeenkomstige toepassing.

      2 In overeenstemming met en ter vervanging van de overschrijdingskans in de zin van het eerste lid, wordt bij
      ministeriële regeling voor elke dijkring de veiligheidsnorm nader aangegeven als de gemiddelde kans per jaar op een
      overstroming van het door de dijkring beschermde gebied door het bezwijken van een primaire waterkering.

      3 Primaire waterkeringen die niet zijn bestemd tot directe kering van het buitenwater moeten, zolang voor de
      dijkring rondom het gebied waarvoor zij een waterkerende functie vervullen geen veiligheidsnorm als bedoeld in het
      tweede lid is vastgesteld, ten minste gelijke veiligheid bieden als het geval was op 15 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '1.3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '2.3'
    text: |-
      1 Bij ministeriële regeling wordt ten aanzien van primaire waterkeringen voor daarbij aan te geven plaatsen
      vastgesteld welke relatie tussen hoogwaterstanden en overschrijdingskansen daarvan uitgangspunt is bij de bepaling
      van het waterkerend vermogen daarvan. Bij die vaststelling kunnen tevens waarden worden vastgesteld van andere
      zodanige factoren.

      2 De in het eerste lid bedoelde vaststelling geschiedt telkens voor zes jaren.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      Bij algemene maatregel van bestuur, gedeputeerde staten gehoord, of provinciale verordening wordt voor daarbij aan
      te wijzen andere dan primaire waterkeringen in beheer bij het Rijk, onderscheidenlijk een andere beheerder, een
      veiligheidsnorm vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Bij ministeriële regeling, gedeputeerde staten gehoord, dan wel bij of krachtens provinciale verordening wordt
      ten aanzien van daarbij aan te wijzen andere dan primaire waterkeringen in beheer bij het Rijk, onderscheidenlijk
      een andere beheerder, voor daarbij aan te geven plaatsen vastgesteld welke relatie tussen waterstanden en
      overschrijdingskansen daarvan uitgangspunt is bij de bepaling van het waterkerend vermogen daarvan. Bij die
      vaststelling kunnen tevens waarden worden vastgesteld van andere zodanige factoren.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      Onze Minister draagt zorg voor de totstandkoming en verkrijgbaarstelling van technische leidraden voor het ontwerp,
      het beheer en het onderhoud van primaire waterkeringen. Deze leidraden strekken de beheerders tot aanbeveling.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Landwaartse verplaatsing van de kustlijn wordt van rijkswege voorkomen of tegengegaan, voor zover dat naar het
      oordeel van Onze Minister noodzakelijk is vanwege de ingevolge deze wet te handhaven veiligheidsnorm.

      2 De in het eerste lid bedoelde kustlijn wordt aangegeven op een door Onze Minister kosteloos verkrijgbaar gestelde
      kaart die telkens na zes jaren wordt herzien. De verkrijgbaarstelling wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      Bij provinciale verordening worden, met het oog op de bergings- en afvoercapaciteit waarop regionale wateren moeten
      zijn ingericht, normen gesteld met betrekking tot de gemiddelde overstromingskans per jaar van daarbij aan te
      wijzen gebieden.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Bij algemene maatregel van bestuur wordt de rangorde van maatschappelijke en ecologische behoeften
      vastgesteld, die bij watertekorten of dreigende watertekorten bepalend is voor de verdeling van het beschikbare
      oppervlaktewater.

      2 Bij of krachtens de maatregel en, in de gevallen bij die maatregel bepaald, provinciale verordening kunnen nadere
      regels worden gesteld met betrekking tot de in het eerste lid bedoelde rangorde. Deze regels kunnen mede voorzien
      in de overeenkomstige toepassing van de rangorde op het beschikbare grondwater.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      Normen voor de chemische en ecologische kwaliteit van watersystemen worden vastgesteld op de voet van
      [hoofdstuk 5 van de Wet milieubeheer][ref1], in overeenstemming met het stelsel van milieudoelstellingen, opgenomen
      in artikel 4 van de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '5'
  - number: '2.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor rijkswateren en, met het oog op internationale
      verplichtingen of bovenregionale belangen, voor regionale wateren normen worden vastgesteld voor de overeenkomstig
      [hoofdstuk 4][ref1] aan watersystemen toe te kennen functies. Voor regionale wateren kunnen zodanige normen voorts
      worden gesteld bij of krachtens provinciale verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.11
    references:
