  - number: '5.14'
    text: |-
      1 Onteigening ingevolge [titel II][ref1] of [IIa van de onteigeningswet][ref2] kan mede geschieden ter uitvoering
      van de in een projectplan opgenomen voorzieningen, bedoeld in [artikel 5.4, tweede of vijfde lid][ref3].

      2 De in [artikel 18, eerste lid, van de onteigeningswet][ref4] bedoelde dagvaarding kan geschieden nadat het
      projectplan door gedeputeerde staten is goedgekeurd. De rechtbank spreekt de onteigening niet uit dan nadat het
      projectplan onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
      [ref2]: https://wetten.overheid.nl/BWBR0001842
