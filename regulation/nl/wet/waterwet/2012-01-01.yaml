  - number: '6.28'
    text: |-
      1 In een geval als bedoeld in [artikel 6.27, eerste lid][ref1], waarin gedeputeerde staten of een van Onze
      Ministers bevoegd zijn de krachtens de betrokken wet vereiste vergunning te verlenen, kunnen gedeputeerde staten,
      onderscheidenlijk Onze betrokken Minister, indien dat met het oog op de samenhang tussen de beschikkingen op de
      onderscheidene aanvragen in het belang van de bescherming van het milieu geboden is, en zo nodig in afwijking van
      regels, gesteld krachtens een provinciale verordening als bedoeld in [artikel 1.2 van de Wet milieubeheer][ref2],
      aan het bevoegd gezag een aanwijzing geven ter zake van de inhoud van die beschikking.

      2 Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvraag
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref3] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.

      3 De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een
      exemplaar ervan wordt gevoegd bij ieder exemplaar van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.27
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.28
