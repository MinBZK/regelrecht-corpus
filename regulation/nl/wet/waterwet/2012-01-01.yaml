  - number: '8.8'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, geven geen toestemming tot vertrek van een
      vaartuig of luchtvaartuig uit Nederland indien zij ernstige redenen hebben om te vermoeden dat in strijd met een
      van de in [artikel 6.3][ref1] omschreven verboden is of zal worden gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel8.8
