  - number: '7.21'
    text: |-
      1 De kosten wegens schade, toegebracht aan waterstaatswerken in beheer of onderhoud bij een beheerder, waarvoor
      eigenaren of gebruikers van vaartuigen wettelijk aansprakelijk zijn, worden door de daartoe door de beheerder
      aangewezen ambtenaar geraamd en vermeld in een proces-verbaal dat zo mogelijk aan de schipper in afschrift wordt
      meegedeeld.

      2 Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis, ook indien het vaartuig inmiddels buiten zijn ambtsgebied is gebracht, te beletten.

      3 Onverminderd het recht op vergoeding van de schade is het betrokken publiekrechtelijk lichaam bevoegd het
      betaalde bedrag aan te wenden tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade
      minder bedragen dan het betaalde bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der
      betaling, uitgekeerd aan degene die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.21
  - number: '7.22'
    text: |-
      1 De Staat kan – behoudens matiging door de rechter – de ten laste van het Rijk komende kosten van onderzoek naar
      verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam en van maatregelen als bedoeld
      in [artikel 4.6, tweede lid, onder a][ref1], of [artikel 5.15, eerste lid][ref2], in verband met verontreiniging
      of aantasting van de bodem of oever van een oppervlaktewaterlichaam die een belemmering vormt voor het bereiken van
      de gewenste gebiedskwaliteit, verhalen op degene door wiens onrechtmatige daad die verontreiniging of aantasting in
      het betrokken geval is veroorzaakt en die deswege of anderszins buiten overeenkomst jegens enige overheid krachtens
      burgerlijk recht aansprakelijk is voor de gevolgen daarvan.

      2 De Staat kan, indien de kosten bedoeld in het eerste lid mede ten laste komen van een waterschap, ook deze kosten
      overeenkomstig dat lid verhalen.

      3 De Staat kan ten laste van het Rijk komende kosten als bedoeld in het eerste lid overeenkomstig de regels
      betreffende ongerechtvaardigde verrijking verhalen op degene die door dat onderzoek of die maatregelen
      ongerechtvaardigd wordt verrijkt. Het tweede lid is van overeenkomstige toepassing.

      4 De bevoegdheden, bedoeld in het eerste en derde lid, komen toe aan het waterschap in gevallen waarin kosten
      als bedoeld in het eerste lid geheel te haren laste komen, alsmede in gevallen waarin de Staat niet van deze
      bevoegdheid gebruik maakt, voor zover zodanige kosten te haren laste komen.

      5 [Artikel 75, vijfde lid, van de Wet bodembescherming][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
