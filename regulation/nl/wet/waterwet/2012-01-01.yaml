      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref6]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
