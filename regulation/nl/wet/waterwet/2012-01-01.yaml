  - number: '6.2'
    text: |-
      1 Het is verboden om stoffen te brengen in een oppervlaktewaterlichaam, tenzij:

      a. een daartoe strekkende vergunning is verleend door Onze Minister of, ten aanzien van regionale wateren, het
      bestuur van het betrokken waterschap;

      b. daarvoor vrijstelling is verleend bij of krachtens algemene maatregel van bestuur;

      c. [artikel 6.3][ref1] van toepassing is.

      2 Het is verboden met behulp van een werk, niet zijnde een openbaar vuilwaterriool, water of stoffen te brengen op
      een zuiveringtechnisch werk, tenzij:

      a. een daartoe strekkende vergunning is verleend door het bestuur van het in [artikel 3.4][ref2] bedoelde
      waterschap;

      b. daarvoor vrijstelling is verleend bij of krachtens algemene maatregel van bestuur.

      3 Voor de toepassing van het eerste lid worden de gronden binnen een oppervlaktewaterlichaam die ingevolge
      [artikel 3.1][ref3] of [3.2][ref4] zijn aangewezen als drogere oevergebieden, niet tot dat oppervlaktewaterlichaam
      gerekend.

      4 Het eerste lid is niet van toepassing op het lozen ten gevolge van het gebruik van meststoffen op agrarische
      gronden in uiterwaarden en buitendijkse gebieden in het kader van de normale agrarische bedrijfsuitoefening, voor
      zover daaromtrent regels zijn gesteld bij of krachtens de [Meststoffenwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel3.1
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel3.2
      [ref5]: https://wetten.overheid.nl/BWBR0004054
