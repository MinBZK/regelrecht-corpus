  - number: '8.7'
    text: |-
      Het bestuursorgaan waaraan de zorg voor bestuursrechtelijke handhaving van het bij of krachtens de
      [hoofdstukken 5][ref1] en [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde is opgedragen, is bevoegd tot het
      toepassen van bestuursdwang ter handhaving van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4],
      voor zover het betreft de verplichting tot het verlenen van medewerking aan de krachtens [artikel 8.3][ref5]
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk5
