  - number: 7.22a
    text: |-
      1 Er is een deltafonds.

      2 Het deltafonds heeft ten doel de financiering en bekostiging van:

      a. maatregelen en voorzieningen in verband met de opgaven op het gebied van waterveiligheid en
      zoetwatervoorziening, bedoeld in [artikel 4.9, tweede lid][ref1];

      b. het inwinnen, bewerken en verspreiden van met onderdeel a samenhangende gegevens en het verrichten van met
      onderdeel a samenhangende onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.22a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4.9'
        hoofdstuk: 4a
  - number: 7.22b
    text: |-
      1 Het deltafonds is een begrotingsfonds als bedoeld in
      [artikel 9, eerste lid, van de Comptabiliteitswet 2001][ref1].

      2 Onze Minister beheert het deltafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.22b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '9'
  - number: 7.22c
    text: |-
      1 De ontvangsten van het deltafonds zijn:

      a. een bijdrage ten laste van de begroting van het ministerie van Verkeer en Waterstaat;

      b. bijdragen ten laste van andere begrotingen van het Rijk;

      c. bijdragen van derden;

      d. andere ontvangsten in het kader van het bereiken van de doelen van het deltafonds.

      2 Ten gunste van de begroting van het deltafonds van enig jaar wordt het batige saldo van dat fonds van het
      voorafgaande jaar gebracht.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.22c
  - number: 7.22d
    text: |-
      1 Ten laste van het deltafonds komen in verband met de opgaven, bedoeld in [artikel 4.9, tweede lid][ref1], de
      uitgaven ten behoeve van:

      a. aanleg, verbetering, beheer, onderhoud en bediening van waterstaatswerken die bij het Rijk in beheer zijn of
      zullen zijn, ter voorkoming en waar nodig beperking van overstromingen en waterschaarste;

      b. maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische
      kwaliteit van watersystemen, voor zover deze onderdeel uitmaken van de opgaven, bedoeld in
      [artikel 4.9, tweede lid, onderdeel a][ref2], en;

      c. het inwinnen, bewerken en verspreiden van met de onderdelen a en b samenhangende gegevens;

      d. met de onderdelen a en b samenhangende onderzoeken.

      2 Onze Minister kan in verband met de opgaven, bedoeld in [artikel 4.9, tweede lid][ref3], uit het deltafonds
      subsidies vertrekken ten behoeve van:

      a. aanleg, verbetering, beheer, onderhoud en bediening van waterstaatswerken die niet bij het Rijk in beheer zijn
      of zullen zijn, ter voorkoming en waar nodig beperking van overstromingen en waterschaarste;

      b. maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische
      kwaliteit van watersystemen, voor zover deze onderdeel uitmaken van de opgaven, bedoeld in
      [artikel 4.9, tweede lid, onderdeel a][ref4];

      c. met de onderdelen a en b samenhangende onderzoeken.

      3 Op subsidies die ten laste komen van het deltafonds zijn de
      [artikelen 3 tot en met 6 van de Kaderwet subsidies Verkeer en Waterstaat][ref5] van toepassing.

      4 Subsidies als bedoeld in het tweede lid die worden verleend ten laste van een
      begroting die nog niet is vastgesteld, worden verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref6].

      5 Ten laste van het deltafonds kunnen eveneens uitgaven worden gebracht ten behoeve van maatregelen en
      voorzieningen als bedoeld in [artikel 7.22a, tweede lid, onderdeel a][ref7], alsmede ten behoeve van het inwinnen,
      verspreiden en bewerken van gegevens en het doen van onderzoek als bedoeld in artikel 7.22a, tweede lid, onderdeel
      b, met betrekking tot buiten het Nederlandse grondgebied gelegen delen van de stroomgebieddistricten Eems, Maas,
      Rijn en Schelde.

      6 Ten laste van het deltafonds komen tevens uitgaven ten behoeve van het bureau ter ondersteuning van de
      werkzaamheden van de deltacommissaris, de huisvestingskosten van het bureau en verdere aan de taakvervulling van de
      deltacommissaris verbonden uitgaven.

      7 Ten laste van het deltafonds komen voorts andere uitgaven in het kader van het bereiken van de doelen van dat
      fonds.

      8 Ten laste van de begroting van enig jaar wordt het nadelige saldo van het deltafonds van het voorafgaande jaar
      gebracht.


