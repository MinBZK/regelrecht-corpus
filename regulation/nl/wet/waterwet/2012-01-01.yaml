        paragraaf: '2'
  - number: '6.15'
    text: |-
      1 De aanvraag om vergunning wordt ingediend bij burgemeester en wethouders van de gemeente waar de handeling geheel
      of in hoofdzaak wordt verricht. Tevens kan, in afwijking van de eerste volzin, de aanvraag bij het bevoegd gezag
      worden ingediend. In dat geval zendt het bevoegd gezag een afschrift van de aanvraag aan burgemeester en wethouders
      van de gemeente waar de handeling geheel of in hoofdzaak wordt verricht.

      2 Het orgaan waarbij de aanvraag is ingediend, zendt de aanvrager onverwijld een bewijs van ontvangst van de
      aanvraag, waarin het de datum vermeldt, waarop het de aanvraag heeft ontvangen.

      3 Het bevoegd gezag zendt de aanvrager nadat het de aanvraag heeft ontvangen, onverwijld een bericht waarin het
      vermeldt dat het bevoegd is op de aanvraag te beslissen en welke procedure ter voorbereiding van die beslissing zal
      worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      1 Op de voorbereiding van een beschikking tot verlening, wijziging of intrekking van een vergunning voor
      het lozen of storten van stoffen of, in de gevallen bedoeld in [artikel 6.4][ref1], het onttrekken van
      grondwater of infiltreren van water, zijn, tenzij bij algemene maatregel van bestuur anders wordt bepaald, de
      [afdelingen 3.4 van de Algemene wet bestuursrecht][ref2] en [13.2 van de Wet milieubeheer][ref3] van toepassing.
      Bij de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] worden de stukken als bedoeld in
      [artikel 3:11 van die wet][ref5] tevens ter inzage gelegd in de gemeente waar de handeling geheel of in hoofdzaak
      wordt verricht.

      2 Een vergunning voor het onttrekken van grondwater of infiltreren van water als bedoeld in [artikel 6.4][ref6],
      wordt niet verleend of gewijzigd dan nadat het bestuur van het betrokken waterschap door gedeputeerde staten
      in de gelegenheid is gesteld advies te geven omtrent de aanvraag of het ontwerp van de op de aanvraag te nemen
      beschikking.

      3 Bij algemene maatregel van bestuur kunnen bestuursorganen worden aangewezen, die door het bevoegd gezag in de
      gelegenheid worden gesteld advies uit te brengen omtrent het ontwerp van de beschikking tot verlening of wijziging
      van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
