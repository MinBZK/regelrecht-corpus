  - number: '6.17'
    text: |-
      1 Indien een aanvraag om vergunning betrekking heeft op een handeling of samenstel van handelingen ten aanzien
      waarvan meer dan één bestuursorgaan bevoegd is, wordt de aanvraag in behandeling genomen en wordt daarop beslist
      door het bestuursorgaan van het hoogste gezag. Ontbreekt een hoogste gezag, dan wordt de aanvraag in behandeling
      genomen en wordt daarop beslist door het bestuursorgaan op wiens grondgebied de handeling of het samenstel van
      handelingen in hoofdzaak wordt verricht.

      2 In afwijking van het eerste lid kunnen de betrokken bestuursorganen gezamenlijk uit hun midden een ander
      bestuursorgaan aanwijzen dat de aanvraag in behandeling zal nemen en daarop zal beslissen.

      3 Op een aanvraag als bedoeld in het eerste lid wordt niet beslist dan nadat de medebetrokken bestuursorganen
      in de gelegenheid zijn gesteld advies te geven omtrent de aanvraag of het ontwerp van de op de aanvraag te nemen
      beschikking.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing op aanvragen tot wijziging van een vergunning
      waardoor het aantal betrokken bestuursorganen toeneemt.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.17
  - number: '6.18'
    text: |-
      1 Indien een wijziging wordt aangevraagd van een vergunning die betrekking heeft op een handeling die deel uitmaakt
      van een samenstel van handelingen van de aanvrager waarvoor ook reeds een of meer andere watervergunningen van
      kracht zijn, kan het bevoegd gezag, in overeenstemming met de andere bevoegde bestuursorganen, in het belang van
      een doelmatige uitvoering en handhaving van de betrokken vergunningen bepalen dat een watervergunning moet worden
      aangevraagd die betrekking heeft op alle handelingen die behoren tot het samenstel en daarbij voorziet in de
      aangevraagde wijziging.

      2 Indien overeenkomstig het eerste lid is bepaald dat een revisievergunning moet worden aangevraagd, besluiten
      de bevoegde bestuursorganen tot het buiten behandeling laten van aanvragen voor het wijzigen van afzonderlijke
      watervergunningen die van kracht zijn voor handelingen die behoren tot het betrokken samenstel.

      3 Het bevoegd gezag voor de ingevolge het eerste lid te verlenen revisievergunning kan bij de verlening van die
      vergunning de rechten die de aanvrager aan de al eerder verleende vergunningen ontleent, niet wijzigen anders
      dan mogelijk zou zijn ingevolge [artikel 6.22][ref1], in samenhang met de [artikelen 2.1][ref2], [6.11][ref3] en
      [6.20][ref4].

      4 Een ingevolge het eerste lid verleende revisievergunning vervangt met ingang van het tijdstip waarop zij in
      werking treedt, de eerder voor het betrokken samenstel van handelingen verleende vergunningen. Deze vergunningen
      vervallen op het tijdstip waarop de revisievergunning onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.22
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.11
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6.20
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.18
