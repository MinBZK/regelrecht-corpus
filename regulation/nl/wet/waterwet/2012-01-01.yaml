  - number: '7.25'
    text: |-
      Ten behoeve van de vaststelling van de hoogte van de bijdrage, bedoeld in [artikel 7.24][ref1], verschaft
      het dagelijks bestuur van een waterschap Onze Minister voor 1 augustus van het kalenderjaar dat volgt op het
      kalenderjaar waarin de peildatum valt, de volgende gegevens:

      a. het aantal ingezetenen in het gebied van het waterschap op de peildatum, en

      b. de som van de op basis van [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] vastgestelde waarden van
      de gebouwde onroerende zaken in het gebied van het waterschap op de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.24
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
