  - number: '6.10'
    text: |-
      1 Onze Minister kan de toegang tot een waterstaatswerk in beheer bij het Rijk geheel of gedeeltelijk verbieden of
      beperken door een daartoe strekkende bekendmaking ter plaatse, dan wel gedaan op een andere geschikte wijze.

      2 Het eerste lid is niet van toepassing op het gebruik door het openbaar verkeer, tenzij het verbod of de beperking
      van de toegang betrekking heeft op een veiligheidszone rondom een werk in de exclusieve economische zone die is
      ingesteld in overeenstemming met artikel 60 van het VN-Zeerechtverdrag, dan wel rondom een werk in de territoriale
      zee.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 De in dit hoofdstuk gegeven bevoegdheden kunnen ten aanzien van handelingen als bedoeld in
      [artikel 6.5, onderdeel c][ref1], die plaatsvinden in de Nederlandse exclusieve economische zone, mede worden
      toegepast ter bescherming van andere belangen dan waarin [artikel 2.1][ref2] voorziet, voor zover daarin niet bij
      of krachtens andere wet is voorzien.

      2 De in dit hoofdstuk gegeven bevoegdheden kunnen ten aanzien van handelingen als bedoeld in
      [artikel 6.2, tweede lid][ref3], mede worden toegepast ter bescherming van de doelmatige werking van een
      zuiveringtechnisch werk.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
