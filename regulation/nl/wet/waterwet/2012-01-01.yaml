  - number: 3.2a
    text: |-
      Het waterschap draagt zo goed mogelijk zorg voor het voorkomen van schade aan waterstaatswerken veroorzaakt door
      muskus- en beverratten.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.2a
  - number: '3.3'
    text: |-
      1 In het belang van het tijdig nemen van maatregelen bij hoog water dat gevaar voor een tot directe kering van het
      buitenwater bestemde primaire waterkering kan opleveren, draagt Onze Minister zorg dat:

      a. informatie beschikbaar is over de verwachte afwijkingen van de daartoe door Onze Minister gepubliceerde
      hoogwaterstanden;

      b. waarschuwingen en verdere inlichtingen worden verschaft aan de beheerders van primaire waterkeringen en colleges
      van gedeputeerde staten die het betreft, zodra te verwachten is dat bij hoge stormvloed, hoog opperwater van een
      van de grote rivieren, hoog water van het IJsselmeer of het Markermeer of, ten gevolge van een combinatie daarvan,
      de hoogwaterstand het alarmeringspeil overschrijdt.

      2 Alarmeringspeilen als bedoeld in het eerste lid, onderdeel b, worden door Onze Minister telkens voor zes jaren
      vastgesteld bij in de Staatscourant bekend te maken besluit.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Zuivering van stedelijk afvalwater gebracht in een openbaar vuilwaterriool geschiedt in een daartoe bestemde
      inrichting onder de zorg van een waterschap. Een zodanige inrichting kan worden geëxploiteerd door het waterschap
      zelf dan wel door een rechtspersoon die door het bestuur van het waterschap met die zuivering is belast.

      2 In afwijking van het eerste lid kunnen het bestuur van het betrokken waterschap en de raad van een betrokken
      gemeente op voorstel van één van beide partijen besluiten, dat de zuivering van daarbij aangewezen stedelijk
      afvalwater in die gemeente, vanaf een daarbij te bepalen tijdstip, geschiedt in een daartoe bestemde inrichting
      onder de zorg van die gemeente. Een besluit als bedoeld in de vorige volzin kan slechts worden genomen op grond dat
      zulks aantoonbaar doelmatiger is voor de zuivering van stedelijk afvalwater.

      3 Het bestuur van het waterschap en de raad van de betrokken gemeente beslissen op een voorstel als bedoeld in het
      tweede lid, binnen één jaar na de dag waarop het door de raad van de betrokken gemeente dan wel door het bestuur
      van het waterschap is ontvangen. Bij gebreke van overeenstemming binnen die termijn beslissen, de beide partijen
      gehoord, gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 De gemeenteraad en het college van burgemeester en wethouders dragen zorg voor een doelmatige inzameling van
      het afvloeiend hemelwater, voor zover van degene die zich daarvan ontdoet, voornemens is zich te ontdoen of
      zich moet ontdoen, redelijkerwijs niet kan worden gevergd het afvloeiend hemelwater op of in de bodem of in het
      oppervlaktewater te brengen.

      2 De gemeenteraad en het college van burgemeester en wethouders dragen tevens zorg voor een doelmatige verwerking
      van het ingezamelde hemelwater. Onder het verwerken van hemelwater kunnen in ieder geval de volgende maatregelen
      worden begrepen: de berging, het transport, de nuttige toepassing, het, al dan niet na zuivering, terugbrengen op
      of in de bodem of in het oppervlaktewater van ingezameld hemelwater, en het afvoeren naar een zuiveringtechnisch
      werk.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 De gemeenteraad en het college van burgemeester en wethouders dragen zorg voor het in het openbaar gemeentelijke
      gebied treffen van maatregelen teneinde structureel nadelige gevolgen van de grondwaterstand voor de aan de
      grond gegeven bestemming zoveel mogelijk te voorkomen of te beperken, voor zover het treffen van die maatregelen
      doelmatig is en niet tot de zorg van het waterschap of de provincie behoort.

      2 De maatregelen, bedoeld in het eerste lid, omvatten mede de verwerking van het ingezamelde grondwater, waaronder
      in ieder geval worden begrepen de berging, het transport, de nuttige toepassing en het, al dan niet na zuivering,
      op of in de bodem of in het oppervlaktewater brengen van ingezameld grondwater, en het afvoeren naar een
      zuiveringtechnisch werk.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6
  - number: 3.6a
    text: |-
      1 Er is een rechtstreeks onder Onze Minister ressorterende regeringscommissaris voor het deltaprogramma. Deze
      draagt de titel «deltacommissaris».

      2 De deltacommissaris wordt benoemd bij koninklijk besluit, in overeenstemming met het gevoelen van de
      ministerraad. Hij kan voorts bij koninklijk besluit worden geschorst en ontslagen.

      3 De deltacommissaris wordt benoemd voor een periode van ten hoogste zeven jaren en is eenmaal herbenoembaar.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende:

      a. benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie, ontslag;

      b. aanspraken ingeval van ziekte;

      c. andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6a
  - number: 3.6b
    text: |-
      De deltacommissaris bevordert de totstandkoming en uitvoering van het deltaprogramma. Daartoe:

        - doet hij jaarlijks een voorstel voor het deltaprogramma en legt dit voor aan Onze Ministers;
        - bevordert hij overleg met betrokken bestuursorganen, bedrijven en maatschappelijke organisaties;
        - bewaakt hij de voortgang van de uitvoering van het deltaprogramma en rapporteert en adviseert daarover aan Onze
      Ministers.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6b
  - number: 3.6c
    text: |-
      De deltacommissaris verkrijgt ten behoeve van de totstandkoming en de uitvoering van het deltaprogramma desgevraagd
      van Onze Ministers de gegevens die aan hen bij of krachtens de wet dienen te worden verschaft.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6c
  - number: 3.6d
    text: |-
      1 Ter uitvoering van [artikel 3.6b][ref1] voert de deltacommissaris regelmatig overleg met betrokken
      bestuursorganen van provincies, waterschappen en gemeenten.

      2 Aan het overleg kunnen, op uitnodiging, ook andere betrokken bestuursorganen deelnemen.

      3 In het overleg worden in ieder geval besproken de voortgang van de uitvoering van het deltaprogramma en
      voorstellen voor maatregelen en voorzieningen in het kader van het deltaprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.6b
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6d
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: 3.6b
        hoofdstuk: '3'
        paragraaf: 1a
  - number: 3.6e
    text: |-
      De deltacommissaris is op het terrein van waterbeheer, natuur, milieu of ruimtelijke kwaliteit niet werkzaam in een
      andere publiek-bestuurlijke of ambtelijke functie of in de private sector.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.6e
  - number: '3.7'
    text: |-
      1 Beheerders van binnen hetzelfde stroomgebieddistrict gelegen watersystemen stellen, voor zover nodig met het oog
      op een samenhangend en doelmatig waterbeheer, waterakkoorden vast waarin zij de hun beheersgebied overstijgende
      aspecten van het beheer ten opzichte van elkaar regelen.

      2 Beheerders kunnen een ander openbaar gezag uitnodigen aan het waterakkoord deel te nemen, indien dat gezag een
      waterstaatkundige taak vervult die niet door hen wordt vervuld.

      3 Bij of krachtens algemene maatregel van bestuur of, ten aanzien van waterakkoorden die uitsluitend betrekking
      hebben op regionale wateren, provinciale verordening kunnen nadere regels met betrekking tot waterakkoorden worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      Waterschappen en gemeenten dragen zorg voor de met het oog op een doelmatig en samenhangend waterbeheer benodigde
      afstemming van taken en bevoegdheden waaronder het zelfstandige beheer van inname, inzameling en zuivering van
      afvalwater.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Gedeputeerde staten hebben het toezicht op alle primaire waterkeringen in hun provincie.

      2 Indien een primaire waterkering is gelegen in meerdere provincies, kunnen gedeputeerde staten van die provincies
      bij overeenstemmende besluiten bepalen dat het toezicht op die waterkering wordt uitgeoefend door gedeputeerde
      staten van één van die provincies.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Bij of krachtens provinciale verordening kunnen met het oog op een samenhangend en doelmatig regionaal
      waterbeheer regels worden gesteld omtrent de door besturen van waterschappen te verstrekken informatie.

      2 Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij of krachtens
      algemene maatregel van bestuur regels worden gesteld omtrent de door besturen van provincies, waterschappen of
      gemeenten met betrekking tot het waterbeheer te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 Bij of krachtens provinciale verordening kunnen met het oog op een samenhangend en doelmatig regionaal
      waterbeheer regels worden gesteld met betrekking tot de voorbereiding, vaststelling, wijziging en inhoud
      van door besturen van waterschappen vast te stellen plannen, besluiten of waterakkoorden als bedoeld in
      [artikel 3.7, eerste lid][ref1].

      2 Indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken, kunnen bij of krachtens
      algemene maatregel van bestuur regels worden gesteld met betrekking tot de voorbereiding, vaststelling, wijziging
      en inhoud van door besturen van provincies of waterschappen in het kader van het waterbeheer vast te stellen
      plannen, besluiten of waterakkoorden als bedoeld in [artikel 3.7, eerste lid.][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.12'
    text: |-
      1 Gedeputeerde staten kunnen, indien een samenhangend en doelmatig regionaal waterbeheer dat vordert, het bestuur
      van een waterschap een aanwijzing geven omtrent de uitoefening van taken of bevoegdheden. Indien het een waterschap
      betreft waarvan het gebied in twee of meer provincies is gelegen, wordt de aanwijzing gegeven door gedeputeerde
      staten van de provincie of provincies waaraan het toezicht op het waterschap is opgedragen.

      2 Bij de aanwijzing wordt een termijn gesteld waarbinnen uitvoering wordt gegeven aan de aanwijzing.

      3 Een aanwijzing wordt niet gegeven dan nadat het bestuur van het waterschap in de gelegenheid is gesteld van zijn
      gevoelen omtrent het voornemen tot het geven van de aanwijzing te doen blijken, tenzij spoedeisende omstandigheden
      zich daartegen verzetten.

      4 Wanneer het bestuur van een waterschap een krachtens het eerste lid gevorderde beslissing niet of niet naar
      behoren neemt, zijn gedeputeerde staten bevoegd daarin namens dat bestuur en ten laste van dat waterschap te
      voorzien. Indien gedeputeerde staten gebruikmaken van deze bevoegdheid, melden zij dit onverwijld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 Onze Minister kan, indien internationale verplichtingen of bovenregionale belangen dat noodzakelijk maken,
      gedeputeerde staten of het bestuur van een waterschap een aanwijzing geven omtrent de uitoefening van taken of
      bevoegdheden in het kader van het waterbeheer. [Artikel 3.12, tweede lid][ref1], is van overeenkomstige toepassing.

      2 Een aanwijzing wordt niet gegeven dan nadat het betrokken bestuursorgaan en, indien de aanwijzing is gericht
      tot het bestuur van een waterschap, gedeputeerde staten van de provincie of provincies waaraan het toezicht op dat
      waterschap is opgedragen, in de gelegenheid zijn gesteld van hun gevoelen omtrent het voornemen tot het geven van
      de aanwijzing te doen blijken, tenzij spoedeisende omstandigheden zich daartegen verzetten.

      3 Wanneer gedeputeerde staten of het bestuur van een waterschap een krachtens het eerste lid gevorderde beslissing
      niet of niet naar behoren neemt, is Onze Minister bevoegd daarin namens dat bestuur en ten laste van het
      desbetreffende openbaar lichaam te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.14'
    text: |-
      1 Onze Minister ziet toe op een evenwichtige onderlinge verdeling van de kosten omtrent hoogwaterbescherming voor
      waterschappen.

      2 Onze Minister informeert beide Kamers der Staten-Generaal van een voorgenomen wijziging in de verdeling van de
      kosten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.14
  - number: '4.1'
    text: |-
      1 Onze Ministers leggen in een nationaal waterplan de hoofdlijnen vast van het nationale waterbeleid en de daartoe
      behorende aspecten van het nationale ruimtelijke beleid. Het plan is voor de ruimtelijke aspecten tevens een
      structuurvisie als bedoeld in [artikel 2.3, tweede lid, van de Wet ruimtelijke ordening][ref1].

      2 De hoofdlijnen omvatten in ieder geval:

      a. een aanduiding, in het licht van de wettelijke doelstellingen en normen, van de gewenste ontwikkeling, werking
      en bescherming van de watersystemen, alsmede van de bijbehorende termijnen;

      b. een uiteenzetting van de maatregelen en voorzieningen, die met het oog op die ontwikkeling, werking en
      bescherming nodig zijn;

      c. een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid;

      d. een visie op de gewenste ontwikkelingen in verband met de voorkoming en waar nodig beperking van
      overstromingen en waterschaarste, voor een periode van ten minste veertig jaren mede in verband met de verwachte
      klimaatveranderingen.

      3 In het plan worden voorts opgenomen:

      a. de stroomgebiedbeheerplannen voor de stroomgebieddistricten Rijn, Maas, Schelde en Eems, voor zover die
      betrekking hebben of mede betrekking hebben op het Nederlandse grondgebied;

      b. het Noordzeebeleid;

      c. de functies van de rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2.3'
  - number: '4.2'
    text: Onze Ministers zenden het vastgestelde nationale waterplan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de voorbereiding, inrichting en
      inhoud van het nationale waterplan, met inbegrip van de stroomgebiedbeheerplannen voor de stroomgebieddistricten
      Rijn, Maas, Schelde en Eems, voor zover die betrekking hebben of mede betrekking hebben op het Nederlandse
      grondgebied. Deze regels voorzien in elk geval in:

      a. de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met vertegenwoordigers uit de kring van de
      besturen van alle provincies, waterschappen en gemeenten wordt voorbereid;

      b. raadpleging van de bevoegde autoriteiten van de andere staten in de stroomgebieddistricten Rijn, Maas, Schelde
      en Eems;

      c. met betrekking tot het Noordzeebeleid: raadpleging van de bevoegde autoriteiten van andere betrokken staten en

      d. inspraak van ingezetenen en belanghebbenden.

      2 Onze Ministers brengen de ontvangen zienswijzen over het ontwerp voor een internationaal stroomgebiedbeheerplan,
      voor zover die zienswijzen niet uitsluitend betrekking hebben op het Nederlandse deel van dat plan, ter kennis van
      de bevoegde autoriteiten van de betrokken staten.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Provinciale staten leggen in een of meer regionale waterplannen de hoofdlijnen vast van het in
      de provincie te voeren waterbeleid en de daartoe behorende aspecten van het provinciale ruimtelijke
      beleid. Deze plannen zijn voor de ruimtelijke aspecten tevens structuurvisies als bedoeld in
      [artikel 2.2, tweede lid, van de Wet ruimtelijke ordening][ref1].

      2 De hoofdlijnen omvatten in ieder geval:

      a. de vastlegging van de functies van de regionale wateren;

      b. een aanduiding, in het licht van de wettelijke doelstellingen en normen en in samenhang met de onder a
      bedoelde functies, van de gewenste ontwikkeling, werking en bescherming van de regionale wateren, alsmede van de
      bijbehorende termijnen;

      c. een uiteenzetting van de maatregelen en voorzieningen die met het oog op de onder b bedoelde ontwikkeling,
      werking en bescherming nodig zijn;

      d. een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.

      3 Provinciale staten dragen er in samenwerking met de staten van aangrenzende provincies zorg voor, dat de
      regionale waterplannen tezamen betrekking hebben op het totale grondgebied van alle provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2.2'
  - number: '4.5'
    text: |-
      1 Provinciale staten stellen bij verordening regels met betrekking tot de voorbereiding, vormgeving en inrichting
      van het regionale waterplan. Zij stellen daarbij in elk geval regels met betrekking tot:

      a. de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met de beheerders van de watersystemen in
      de provincie, alsmede de gemeentebesturen wordt voorbereid;

      b. de raadpleging van Onze Minister, gedeputeerde staten van de aangrenzende provincies en, met betrekking tot
      grensvormende of grensoverschrijdende watersystemen, de ten aanzien van die watersystemen bevoegde Duitse of
      Belgische autoriteiten;

      c. de inspraak van belanghebbenden en ingezetenen van de provincie.

      2 Een vastgesteld regionaal waterplan wordt toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 Een beheerder stelt met betrekking tot de watersystemen onder zijn beheer een beheerplan vast. Daarbij wordt
      voor regionale wateren rekening gehouden met het regionale waterplan dat betrekking heeft op die regionale wateren,
      en dient de afstemming op beheerplannen van andere beheerders, indien sprake is of zou kunnen zijn van samenhang
      tussen de onderscheidene watersystemen, te zijn gewaarborgd.

      2 Het plan bevat:

      a. het programma van de maatregelen en voorzieningen die, in aanvulling op en ter uitwerking van hetgeen in het
      nationale of regionale plan is opgenomen over maatregelen, nodig zijn met het oog op de ontwikkeling, werking en
      bescherming van rijkswateren, onderscheidenlijk regionale wateren, onder vermelding van de bijbehorende termijnen;

      b. aanvullende toekenning van functies aan rijkswateren of regionale wateren, voor zover het nationale,
      onderscheidenlijk regionale, plan voorziet in de mogelijkheid daartoe;

      c. de voornemens voor de wijze waarop het beheer wordt gevoerd;

      d. een overzicht van de financiële middelen, die voor de uitvoering van het programma en het te voeren beheer nodig
      zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of provinciale verordening worden regels gesteld omtrent de
      voorbereiding en goedkeuring, alsmede de vormgeving en inrichting van beheerplannen betreffende rijkswateren,
      onderscheidenlijk regionale wateren. Deze regels hebben in elk geval betrekking op:

      a. de raadpleging van de in [artikel 4.6, eerste lid][ref1], bedoelde beheerders alsmede gedeputeerde staten van
      de provincies en de besturen van de veiligheidsregio’s waarbinnen de watersystemen of onderdelen daarvan zijn
      gelegen, alsmede de ten aanzien van grensvormende of grensoverschrijdende wateren bevoegde Belgische, Duitse of
      Britse autoriteiten;

      b. inspraak van belanghebbenden en ingezetenen van het beheersgebied;

      c. de goedkeuring van een beheerplan betreffende regionale wateren door gedeputeerde staten.

      2 Bij de maatregel of verordening, bedoeld in het eerste lid, wordt voorzien in toezending of kennisgeving van een
      vastgesteld beheerplan aan de ingevolge het eerste lid geraadpleegde instanties alsmede Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '4.8'
    text: |-
      1 De in dit hoofdstuk bedoelde plannen worden eenmaal in de zes jaren herzien. Voorts is tussentijdse herziening
      van de plannen mogelijk.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de termijn waarbinnen de
      herziening van een plan operationeel moet zijn.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      1 Er is een deltaprogramma.

      2 Het deltaprogramma bevat, in verband met de opgaven op het gebied van waterveiligheid en zoetwatervoorziening:

      a. maatregelen en voorzieningen van nationaal belang ter voorkoming en waar nodig beperking van overstromingen
      en waterschaarste;

      b. maatregelen en voorzieningen ter bescherming of verbetering van de chemische of ecologische kwaliteit van
      watersystemen, voor zover deze onderdeel uitmaken van de opgaven.

      3 Het deltaprogramma kan tevens ambities op andere beleidsterreinen bevatten, mits deze niet ten koste gaan van de
      opgaven, bedoeld in het tweede lid.

      4 Van het deltaprogramma kunnen tevens deel uitmaken onderzoeken ten behoeve van de in het tweede en derde lid
      bedoelde maatregelen en voorzieningen.

      5 In het deltaprogramma wordt jaarlijks voor de eerstvolgende zes jaren zo gedetailleerd als redelijkerwijs
      mogelijk is aangegeven welke maatregelen en voorzieningen in die periode zullen worden uitgevoerd en welke middelen
      beschikbaar worden gesteld voor:

      a. opgaven als bedoeld in het tweede lid, onderdeel a respectievelijk onderdeel b, waarbij onderscheid wordt
      gemaakt tussen beheer en onderhoud enerzijds en aanleg anderzijds;

      b. ambities als bedoeld in het derde lid, waarbij wordt aangegeven hoe deze ambities worden gefinancierd;

      c. onderzoeken als bedoeld in het vierde lid.

      Tevens geeft het indicatief aan welke maatregelen of soorten van maatregelen in de daaropvolgende twaalf jaren
      worden voorzien en welke middelen daarvoor vermoedelijk beschikbaar zijn bij ongewijzigd beleid.

      6 Het deltaprogramma maakt zichtbaar op welke wijze daarmee bijgedragen wordt aan het bereiken van de
      doelstellingen van het nationale waterplan op het gebied van waterveiligheid en zoetwatervoorziening.

      7 In het deltaprogramma wordt aangegeven op welke wijze rekening is gehouden met het voorstel en de adviezen,
      bedoeld in [artikel 3.6b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.6b
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: 3.6b
        hoofdstuk: '3'
        paragraaf: 1a
  - number: '4.10'
    text: |-
      1 Onze Minister biedt jaarlijks, gelijktijdig met de begroting van het deltafonds voor het nieuwe jaar het
      deltaprogramma aan de Staten-Generaal aan.

      2 Onze Minister stelt de Staten-Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij aan de
      beraadslagingen in de Staten-Generaal over het deltaprogramma verbindt voor de uitvoering van dat programma.

      3 Gevolgtrekkingen als bedoeld in het tweede lid worden aangemerkt als onderdeel van het deltaprogramma.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel4.10
  - number: '5.1'
    text: |-
      1 De beheerder draagt zorg voor de vaststelling van een legger, waarin is omschreven waaraan waterstaatswerken naar
      ligging, vorm, afmeting en constructie moeten voldoen. Van de legger maakt deel uit een overzichtskaart, waarop de
      ligging van waterstaatswerken en daaraan grenzende beschermingszones staat aangegeven.

      2 De legger gaat vergezeld van een technisch beheersregister met betrekking tot primaire waterkeringen dan wel
      waterkeringen ten aanzien waarvan toepassing is gegeven aan [artikel 2.4][ref1], waarin de voor het behoud van het
      waterkerend vermogen kenmerkende gegevens van de constructie en de feitelijke toestand nader zijn omschreven.

      3 Bij of krachtens provinciale verordening of, ten aanzien van waterstaatswerken in beheer bij het Rijk, algemene
      maatregel van bestuur kunnen nadere voorschriften worden gegeven ten aanzien van de inhoud, vorm en periodieke
      herziening van de legger voor daarbij te onderscheiden categorieën van waterstaatswerken. Voorts kan daarbij
      vrijstelling worden verleend van de in het eerste lid bedoelde verplichtingen met betrekking tot bepaalde
      waterstaatswerken die zich naar hun aard of functie niet lenen voor het omschrijven van die elementen dan wel van
      geringe afmetingen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      1 Een beheerder is verplicht voor daartoe aan te wijzen oppervlaktewater- of grondwaterlichamen onder zijn beheer
      één of meer peilbesluiten vast te stellen.

      2 In een peilbesluit worden waterstanden of bandbreedten waarbinnen waterstanden kunnen variëren vastgesteld, die
      gedurende daarbij aangegeven perioden zoveel mogelijk worden gehandhaafd.

      3 De aanwijzing vindt plaats bij of krachtens algemene maatregel van bestuur dan wel bij of krachtens provinciale
      verordening voor zover het betreft rijkswateren onderscheidenlijk regionale wateren. Bij de maatregel of de
      verordening kunnen ten aanzien van rijkswateren onderscheidenlijk regionale wateren nadere regels worden gesteld
      met betrekking tot het peilbesluit.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      De beheerder neemt, met inachtneming van de bij of krachtens [hoofdstuk 2][ref1] gestelde regels, ten aanzien
      van de waterstaatswerken onder zijn beheer de nodige maatregelen voor het veilig en doelmatig gebruik daarvan,
      overeenkomstig de krachtens [hoofdstuk 4][ref2] aan die waterstaatswerken toegekende functies.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.3
    references:
