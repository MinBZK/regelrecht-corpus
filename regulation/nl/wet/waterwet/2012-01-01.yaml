  - number: '6.8'
    text: |-
      Ieder die handelingen verricht of nalaat en die weet of redelijkerwijs had kunnen vermoeden dat door die
      handelingen of het nalaten daarvan de bodem of oever van een oppervlaktewaterlichaam kan worden verontreinigd
      of aangetast, is verplicht alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd om die
      verontreiniging of aantasting te voorkomen, dan wel indien die verontreiniging of aantasting zich voordoet, de
      verontreiniging of de aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.
      Indien de verontreiniging of aantasting het gevolg is van een ongewoon voorval, worden de maatregelen onverwijld
      genomen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.8
  - number: '6.9'
    text: |-
      1 Degene die handelingen verricht als bedoeld in [artikel 6.8][ref1] en daarbij kennis neemt van een
      verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam die door die handelingen wordt
      veroorzaakt, maakt zo spoedig mogelijk melding van de verontreiniging of aantasting bij de beheerder. Hij geeft
      daarbij aan welke maatregelen als bedoeld in artikel 6.8 hij voornemens is te treffen of reeds heeft getroffen.

      2 De beheerder kan aanwijzingen geven met betrekking tot de te nemen maatregelen, bedoeld in [artikel 6.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.8
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.9
