  - number: '2.13'
    text: |-
      Onze Minister zendt elke twaalf jaar aan de beide Kamers der Staten-Generaal een verslag over de doeltreffendheid
      en de effecten van de in [bijlage II][ref1] aangegeven veiligheidsnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: '2.14'
    text: |-
      Onverminderd [artikel 2.12][ref1] kunnen bij of krachtens algemene maatregel van bestuur dan wel bij of krachtens
      provinciale verordening, regels worden gesteld ten aanzien van het periodiek door de beheerder meten van daarbij
      aan te geven grootheden en het aan de hand van de meetresultaten beoordelen van de mate van verwezenlijking van
      de normen, bedoeld in de [paragrafen 2][ref2] en [3][ref3], voor zover het betreft normen die van rijkswege,
      onderscheidenlijk op provinciaal niveau, zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2.12'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025458
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '3.1'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden de watersystemen aangewezen die volledig dan wel met
      uitzondering van daarbij aangewezen onderdelen bij het Rijk in beheer zijn.

      2 Bij of krachtens algemene maatregel van bestuur wordt voor de onder de aanwijzing vallende
      oppervlaktewaterlichamen tevens de begrenzing vastgesteld. Daarbij worden de oppervlaktewaterlichamen van de
      rivieren begrensd door de buitenkruinlijn van de primaire waterkering voor zover die primaire waterkering is
      aangegeven op de kaart die als [bijlage I][ref1] bij deze wet behoort, dan wel, waar deze ontbreekt, de daarbij
      vast te stellen lijn van de hoogwaterkerende gronden.

      3 Bij of krachtens algemene maatregel van bestuur kunnen gronden binnen een oppervlaktewaterlichaam worden
      aangewezen als drogere oevergebieden als bedoeld in de begripsomschrijving van oppervlaktewaterlichaam in
      [artikel 1.1][ref2].

      4 De voordracht voor de maatregel, bedoeld in het eerste lid, wordt gedaan nadat gedeputeerde staten van alle
      provincies alsmede alle waterschapsbesturen zijn geraadpleegd over de inhoud daarvan.

      5 De voordracht voor een algemene maatregel van bestuur houdende wijziging van de in het eerste lid bedoelde
      aanwijzing kan slechts worden gedaan indien over een daarin besloten liggende overdracht dan wel overneming van het
      beheer door Onze Minister overeenstemming is bereikt met de betrokken andere beheerder en gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel3.1
    references:
