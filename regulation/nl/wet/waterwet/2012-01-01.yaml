  - number: '5.10'
    text: |-
      Voor zover een bestemmingsplan voor de uitvoering van werken en werkzaamheden
      een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref1] vereist, geldt zodanige eis
      niet in het gebied dat is begrepen in een vastgesteld projectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '5.11'
    text: |-
      1 Indien een bestuursorgaan, niet zijnde een bestuursorgaan van het Rijk, dat in eerste aanleg bevoegd is te
      beslissen op een aanvraag tot het nemen van een besluit dat nodig is ter uitvoering van het projectplan, niet of
      niet tijdig een ontwerp-besluit op de aanvraag aan gedeputeerde staten zendt, dan wel niet, niet tijdig of niet in
      overeenstemming met het projectplan beslist of een beslissing neemt die naar het oordeel van gedeputeerde staten
      wijziging behoeft, kunnen gedeputeerde staten een beslissing op de aanvraag nemen. In het laatste geval treedt hun
      besluit in de plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is te beslissen.

      2 Het eerste lid is van overeenkomstige toepassing op ambtshalve te nemen besluiten ter uitvoering van het
      projectplan en andere besluiten dan die ter uitvoering van het projectplan, welke zijn gericht op de realisering
      van de in het projectplan opgenomen voorzieningen.

      3 Indien bij de toepassing van het eerste lid de in dat lid bedoeld beslissing op een aanvraag tot het nemen van
      een besluit wordt genomen door gedeputeerde staten, draagt het bestuursorgaan dat in eerste aanleg bevoegd was te
      beslissen op de aanvraag de ter zake ontvangen leges over aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.11
  - number: '5.12'
    text: |-
      De in [artikel 5.8, eerste lid][ref1], bedoelde besluiten worden, voor zover zij gecoördineerd zijn voorbereid,
      gelijktijdig door gedeputeerde staten bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.12
