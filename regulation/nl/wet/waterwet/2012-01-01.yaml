  - number: '7.2'
    text: |-
      1 Onder de naam verontreinigingsheffing vindt een heffing plaats ter zake van lozen op een oppervlaktewaterlichaam
      in beheer bij het Rijk.

      2 Ter zake van lozen in een oppervlaktewaterlichaam in beheer bij een waterschap kan het algemeen bestuur van dat
      waterschap onder de naam verontreinigingsheffing een heffing instellen.

      3 Aan de heffing kunnen worden onderworpen:

      a. ter zake van lozen vanuit een bedrijfsruimte of woonruimte: degene die het gebruik heeft van die ruimte;

      b. ter zake van lozen met behulp van een riolering of een zuiveringtechnisch werk: degene bij wie die riolering of
      dat zuiveringtechnisch werk in beheer is;

      c. ter zake van andere lozingen dan als bedoeld in onderdeel a of b: degene die loost.

      4 Ter zake van de verontreinigingsheffing van een waterschap wordt voor de toepassing van het derde lid, onderdeel
      a:

      a. gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door de
      heffingsambtenaar aangewezen lid van dat huishouden;

      b. gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven, met dien verstande dat degene die het deel in gebruik heeft gegeven,
      bevoegd is de heffing als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;

      c. het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als
      gebruik door degene die die ruimte ter beschikking heeft gesteld, met dien verstande dat degene die de ruimte
      ter beschikking heeft gesteld, bevoegd is de heffing als zodanig te verhalen op degene aan wie de ruimte ter
      beschikking is gesteld.

      5 De opbrengst van de verontreinigingsheffing komt ten goede aan de bekostiging van het beheer van het watersysteem
      van de beheerder.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 Voor de verontreinigingsheffing geldt als grondslag de hoeveelheid en hoedanigheid van de stoffen die in een
      kalenderjaar worden geloosd. Als heffingsmaatstaf geldt de vervuilingswaarde van de stoffen die in een kalenderjaar
      worden geloosd, uitgedrukt in vervuilingseenheden.

      2 Eén vervuilingseenheid vertegenwoordigt met betrekking tot:

      a. het zuurstofverbruik: het jaarlijks verbruik van 54,8 kilogram zuurstof;

      b. de gewichtshoeveelheden van de groep van stoffen chroom, koper, lood, nikkel, zilver en zink: 1,00 kilogram;

      c. de gewichtshoeveelheden van de groep van stoffen arseen, kwik en cadmium: 0,100 kilogram;

      d. de gewichtshoeveelheden van de stof chloride: 650 kilogram;

      e. de gewichtshoeveelheden van de stof sulfaat: 650 kilogram;

      f. de gewichtshoeveelheden van de stof fosfor: 20,0 kilogram.

      3 De verontreinigingsheffing van het Rijk wordt niet geheven ter zake van het lozen van de stoffen chloride,
      sulfaat, fosfor en zilver.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 Het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van de onderstaande groepen
      stoffen die in een kalenderjaar in een oppervlaktewaterlichaam in beheer bij het Rijk worden geloosd, wordt per
      bedrijfsruimte, riolering of zuiveringtechnisch werk tot minimaal nihil verminderd met het product van het aantal
      vervuilingseenheden met betrekking tot het zuurstofverbruik van de in dat kalenderjaar vanuit die bedrijfsruimte,
      riolering of dat zuiveringtechnisch werk in een oppervlaktewaterlichaam in beheer bij het Rijk gebrachte stoffen,
      en:

      a. voor de groep stoffen chroom, koper, lood, nikkel en zink: 0,04;

      b. voor de groep stoffen kwik, cadmium en arseen: 0,006.

      2 Het aantal vervuilingseenheden, berekend na toepassing van het eerste lid, wordt voor elk van de in dat lid
      bedoelde groepen stoffen op nihil gesteld indien dat aantal minder bedraagt dan 10.

      3 Op een heffing ter zake van lozingen op een oppervlaktewaterlichaam in beheer bij een waterschap is
      [artikel 122f, derde lid, van de Waterschapswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122f
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122f
  - number: '7.5'
    text: |-
      1 Het aantal vervuilingseenheden wordt berekend met behulp van door de heffingplichtige, gedurende elk etmaal van
      het kalenderjaar ondernomen meting, bemonstering en analyse verkregen gegevens, overeenkomstig bij ministeriële
      regeling, onderscheidenlijk belastingverordening te stellen regels.

      2 Op aanvraag van de heffingplichtige staat de heffingsambtenaar onder nader te stellen voorwaarden toe dat van
      de frequentie van meting, bemonstering en analyse, bedoeld in het eerste lid, wordt afgeweken indien door de
      heffingplichtige aannemelijk wordt gemaakt dat voor de berekening van de vervuilingswaarde met gegevens over
      meting, bemonstering en analyse van een beperkt aantal etmalen kan worden volstaan. Deze beslissing wordt genomen
      bij voor bezwaar vatbare beschikking.

      3 De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden geloosd, geschiedt op basis
      van de som van het chemisch zuurstofverbruik en het zuurstofverbruik door omzetting van stikstofverbindingen.

      4 Indien de uitkomst van de methode tot bepaling van het chemisch zuurstofverbruik in belangrijke mate is
      beïnvloed door biologisch niet of nagenoeg niet afbreekbare stoffen, wordt op die uitkomst een correctie toegepast,
      overeenkomstig bij ministeriële regeling, onderscheidenlijk belastingverordening te stellen regels.

      5 [Artikel 122h, eerste, vijfde en zesde lid][ref1], en [artikel 122i tot en met 122l van de Waterschapswet][ref2]
      zijn van overeenkomstige toepassing. [Artikel 122i, eerste lid, van de Waterschapswet][ref3] is eveneens van
      overeenkomstige toepassing op lozingen vanuit een openbaar vuilwaterriool of vanuit een zuiveringtechnisch werk.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122h
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel122i
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel122i
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.5
