  - number: '6.19'
    text: |-
      1 Indien voor een samenstel van handelingen verschillende watervergunningen van kracht zijn, kan een van de
      bevoegde gezagen, in overeenstemming met de andere bevoegde bestuursorganen, in het belang van een doelmatige
      uitvoering en handhaving van de betrokken vergunningen ambtshalve een vergunning verlenen die betrekking heeft op
      alle handelingen die behoren tot het samenstel.

      2 [Artikel 6.18, tweede lid][ref1], is van overeenkomstige toepassing zodra het ontwerp van de in het eerste lid
      bedoelde revisievergunning is toegezonden aan de houders van de in het eerste lid bedoelde vergunningen. Voorts
      zijn artikel 6.18, derde en vierde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.18
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.19
