  - number: '6.3'
    text: |-
      1 Het is zonder daartoe strekkende vergunning van Onze Minister verboden:

      a. zich van stoffen te ontdoen door deze vanaf of vanuit een vaartuig dan wel een luchtvaartuig in zee te brengen
      of op zee te verbranden;

      b. zich in zee te ontdoen van vaartuigen, luchtvaartuigen of op de zeebodem opgerichte werken;

      c. stoffen aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk zich daarvan op een wijze als
      bedoeld in onderdeel a te ontdoen, dan wel met dat oogmerk stoffen af te geven of op te slaan.

      2 Het eerste lid is mede van toepassing op handelingen die plaatsvinden op in Nederland geregistreerde vaartuigen
      en luchtvaartuigen die zich bevinden buiten Nederland en de Nederlandse exclusieve economische zone.

      3 Het eerste lid, onderdeel a, is van overeenkomstige toepassing op het zich ontdoen van stoffen door deze vanaf
      of vanuit een op de zeebodem opgericht werk in zee te brengen of op zee te verbranden, tenzij die handelingen
      samenhangen met of voortvloeien uit het normale gebruik van dat werk, mits dat gebruik niet ten doel heeft het zich
      ontdoen van stoffen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Het is verboden zonder daartoe strekkende vergunning van gedeputeerde staten grondwater te onttrekken of water
      te infiltreren:

      a. ten behoeve van industriële toepassingen, indien de te onttrekken hoeveelheid water meer dan 150 000 m3 per
      jaar bedraagt;

      b. ten behoeve van de openbare drinkwatervoorziening of een bodemenergiesysteem.

      2 Bij provinciale verordening kan worden bepaald dat het eerste lid niet van toepassing is voor onttrekkingen
      waarbij de te onttrekken hoeveelheid ten hoogste 10 m3 per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor rijkswateren en, met het oog op internationale
      verplichtingen of bovenregionale belangen, voor regionale wateren worden bepaald dat het verboden is zonder
      vergunning van Onze Minister, onderscheidenlijk het bestuur van het waterschap:

      a. water te brengen in of te onttrekken aan een oppervlaktewaterlichaam;

      b. grondwater te onttrekken of water te infiltreren in andere gevallen dan als bedoeld in [artikel 6.4][ref1];

      c. gebruik te maken van een waterstaatswerk of een daartoe behorende beschermingszone door, anders dan in
      overeenstemming met de functie, daarin, daarop, daarboven, daarover of daaronder werkzaamheden te verrichten,
      werken te maken of te behouden, dan wel vaste substanties of voorwerpen te storten, te plaatsen of neer te leggen,
      of deze te laten staan of liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.4'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verrichten
      van handelingen als bedoeld in de [artikelen 6.2 tot en met 6.5][ref1], met dien verstande dat voor regionale
      wateren, voor zover het handelingen als bedoeld in [artikel 6.4][ref2] of [6.5][ref3] betreft, slechts regels
      worden gesteld met het oog op internationale verplichtingen of bovenregionale belangen.

      2 Bij of krachtens de maatregel kan met betrekking tot daarbij aangegeven handelingen de verplichting worden
      opgelegd te voldoen aan voorschriften, gesteld door een bij of krachtens die maatregel aangewezen bestuursorgaan.
      Daarbij kan worden bepaald dat deze voorschriften mogen afwijken van de krachtens het eerste lid gestelde regels.

      3 Bij de maatregel kan voorts worden bepaald dat bij verordening van een waterschap of bij provinciale verordening,
      dan wel in de aan een watervergunning te verbinden voorschriften, mag worden afgeweken van de krachtens het eerste
      lid gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
