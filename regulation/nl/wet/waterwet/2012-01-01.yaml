  - number: '7.23'
    text: |-
      1 Onze Minister verleent op aanvraag een subsidie aan de beheerder die vanwege wijziging van de krachtens
      [artikel 2.2][ref1], [2.3][ref2] of [2.12, vierde lid][ref3], gestelde regels maatregelen dient te treffen, indien
      de desbetreffende maatregelen zijn opgenomen in een jaarlijks door Onze Minister vast te stellen programma.

      2 De subsidie, bedoeld in het eerste lid, wordt verleend voor honderd procent van de kosten van uitvoering.

      3 De [artikelen 3 tot en met 6 van de Kaderwet subsidies Verkeer en Waterstaat][ref4] zijn van toepassing.


