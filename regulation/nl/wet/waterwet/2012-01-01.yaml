  - number: '6.27'
    text: |-
      1 Een aanvraag tot verlening of wijziging van een vergunning voor het lozen vanuit een inrichting waartoe een gpbv-
      installatie als bedoeld in [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] behoort,
      of vanuit een inrichting als bedoeld in [artikel 15, onder b, van de Kernenergiewet][ref2], wordt gelijktijdig
      ingediend met een aanvraag tot verlening of wijziging van een omgevingsvergunning voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref3] of een vergunning
      krachtens de [Kernenergiewet][ref4].

      2 De beslissing op een in het eerste lid bedoelde aanvraag om een watervergunning wordt overeenkomstig
      [hoofdstuk 14 van de Wet milieubeheer][ref5] gecoördineerd voorbereid met de beslissing op de betrokken aanvraag
      krachtens de [Wet algemene bepalingen omgevingsrecht][ref6] of de [Kernenergiewet][ref7]. Daarbij worden in ieder
      geval de in [artikel 14.3, tweede lid, van de Wet milieubeheer][ref8] genoemde handelingen gelijktijdig verricht.

      3 De in het eerste lid bedoelde aanvraag om een watervergunning wordt in ieder geval buiten behandeling
      gelaten, indien niet binnen zes weken na het tijdstip van indiening ervan tevens een aanvraag krachtens de
      [Wet algemene bepalingen omgevingsrecht][ref9] of de [Kernenergiewet][ref10] is ingediend, dan wel de aanvraag
      krachtens die wetten buiten behandeling wordt gelaten.

      4 Het orgaan dat krachtens de betrokken wet bevoegd is op de aanvraag om vergunning te beslissen, brengt
      binnen acht weken na ontvangst van de in het eerste lid eerstbedoelde aanvraag advies uit met het oog op de
      samenhang tussen de beschikkingen op de onderscheidene aanvragen. Dat orgaan wordt voorts in de gelegenheid
      gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvraag. In een geval als bedoeld
      in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref11] kan het bevoegd gezag besluiten de in
      de eerste volzin bedoelde termijn met een bij zijn besluit te bepalen redelijke termijn te verlengen. Indien
      [artikel 30, vierde lid, van de Dienstenwet][ref12] op de aanvraag van toepassing is, wordt de verlengingstermijn
      afgestemd op de duur waarmee ingevolge dat artikellid de termijn voor het geven van de beschikking op de aanvraag
      kan worden verlengd.

      5 Wordt in de vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref13] een bepaling opgenomen over
      de termijn waarvoor zij geldt, dan wordt in de watervergunning een gelijke bepaling opgenomen.

      6 Wordt een betrokken vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref14] of de
      [Kernenergiewet][ref15] ingetrokken, dan kan de watervergunning eveneens worden ingetrokken.

      7 Het tweede, vierde en vijfde lid en de [artikelen 6.28][ref16] en [6.29][ref17] zijn van overeenkomstige
      toepassing op een ambtshalve wijziging van een in het eerste lid bedoelde vergunning. Voorts dragen gedeputeerde
      staten er ten minste zorg voor dat de betrokken beschikkingen gezamenlijk worden bekendgemaakt en daarvan
      gezamenlijk mededeling wordt gedaan.

      8 Wordt in een geval als bedoeld in [artikel 3.16 van de Wet algemene bepalingen omgevingsrecht][ref18], dan wel
      in de [Kernenergiewet][ref19] juncto dat artikel, beroep ingesteld tegen een beschikking inzake een vergunning
      krachtens een van die wetten, dan kan de uitspraak in beroep ook betrekking hebben op een daarmee samenhangende,
      inzake een watervergunning gegeven beschikking.

      9 Dit artikel is niet van toepassing indien op de voorbereiding van de vergunning
      voor het lozen van stoffen, de omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref20] of de vergunning krachtens
      de [Kernenergiewet][ref21][afdeling 3.4 van de Algemene wet bestuursrecht][ref22] niet van toepassing is.


