  - number: '8.4'
    text: |-
      1 Het op grond van [hoofdstuk 6][ref1] bevoegde gezag kan een watervergunning geheel of gedeeltelijk intrekken,
      indien:

      a. in strijd met de vergunning of de daaraan verbonden voorschriften wordt gehandeld, dan wel de met betrekking tot
      de vergunde handeling geldende wettelijke voorschriften niet worden nageleefd;

      b. de ter verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op
      de aanvraag voor de vergunning een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste
      gegevens bekend zouden zijn geweest.

      2 Het bevoegd gezag gaat in een geval als bedoeld in het eerste lid, onderdeel a, niet tot intrekking over dan
      nadat het de vergunninghouder een redelijke termijn heeft gesteld om zijn handelen alsnog in overeenstemming
      te brengen met de vergunning en de daaraan verbonden voorschriften, onderscheidenlijk de geldende wettelijke
      voorschriften na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        hoofdstuk: '6'
  - number: '8.5'
    text: |-
      Onze Minister is bevoegd tot het toepassen van bestuursdwang ter handhaving van het bij of krachtens deze wet
      bepaalde in gevallen waarin hem de zorg voor de bestuursrechtelijke handhaving daarvan is opgedragen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel8.5
  - number: '8.6'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens de [hoofdstukken 5][ref1] en
      [6][ref2] of krachtens [artikel 10.1][ref3] bepaalde zijn de [paragrafen 5.2][ref4] en
      [5.5 van de Wet algemene bepalingen omgevingsrecht][ref5] van toepassing, met dien verstande dat in
      [artikel 5.8, vijfde lid, onder b, van die wet][ref6] in plaats van «intrekking van een vergunning of
      ontheffing op grond van [artikel 5.19][ref7]» wordt gelezen: intrekking van een vergunning op grond van
      [artikel 8.4 van de Waterwet][ref8].


