  - number: '6.7'
    text: |-
      De in [artikel 6.6, eerste lid][ref1], bedoelde regels kunnen mede een vrijstelling van een in de
      [artikelen 6.3 tot en met 6.5][ref2] bedoelde vergunningplicht of een verbod op het verrichten van daarbij
      aangegeven handelingen inhouden, alsmede de verplichting om, met inachtneming van bij of krachtens algemene
      maatregel van bestuur te stellen regels, het verrichten van handelingen te melden, metingen uit te voeren, gegevens
      te registreren en daarvan opgave te doen aan een daarbij aangewezen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
