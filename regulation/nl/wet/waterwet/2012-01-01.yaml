  - number: '7.11'
    text: |-
      1 Indien een bedrijfs- of woonruimte of een zuiveringtechnisch werk bij meer dan één persoon in gebruik of beheer
      is, kan de heffingsambtenaar een belastingaanslag inzake de in [artikel 7.10, eerste lid][ref1], bedoelde heffing
      ter zake van die ruimte of van dat zuiveringtechnisch werk ten name van één van die personen stellen.

      2 De heffingsambtenaar is bevoegd voor een zelfde in [artikel 7.2, derde lid][ref2], bedoelde heffingplichtige,
      bestemde belastingaanslagen van dezelfde soort op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.10
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.11
