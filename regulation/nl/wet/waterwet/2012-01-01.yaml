        bwb_id: BWBR0025458
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025458
        hoofdstuk: '4'
  - number: '5.4'
    text: |-
      1 De aanleg of wijziging van een waterstaatswerk door of vanwege de beheerder geschiedt overeenkomstig een daartoe
      door hem vast te stellen projectplan. Met de aanleg of wijziging van een waterstaatswerk wordt gelijkgesteld de
      uitvoering van een werk tot beïnvloeding van een grondwaterlichaam.

      2 Het plan bevat ten minste een beschrijving van het betrokken werk en de wijze waarop dat zal worden uitgevoerd,
      alsmede een beschrijving van de te treffen voorzieningen, gericht op het ongedaan maken of beperken van de nadelige
      gevolgen van de uitvoering van het werk. Voor in bij algemene maatregel van bestuur te bepalen gevallen bevat het
      plan een inventarisatie van maatschappelijke functies en ambities en mogelijke innovaties waarmee de aanleg of
      wijziging van een waterstaatswerk gecombineerd zou kunnen worden, inclusief de mogelijkheden om het desbetreffende
      werk middels een concessie voor werken of andere vorm van publiek-private samenwerking te realiseren.

      3 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen regels worden gesteld over
      de wijze waarop de inventarisatie wordt uitgevoerd en private partijen daarbij betrokken worden.

      4 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      5 Indien het plan de verlegging van een primaire waterkering betreft, kan het voorts voorzieningen bevatten
      met betrekking tot de inpassing in de omgeving van het gebied tussen de plaats waar de oorspronkelijke primaire
      waterkering is gelegen, en de plaats waar de nieuwe primaire waterkering komt te liggen.

      6 Het eerste lid is niet van toepassing, indien ten aanzien van een in dat lid bedoeld werk de [Tracéwet][ref1]
      of de [Spoedwet wegverbreding][ref2] van toepassing is, of indien ten aanzien van dat werk toepassing wordt gegeven
      aan [afdeling 3.5 van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006147
      [ref2]: https://wetten.overheid.nl/BWBR0015158
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.4
