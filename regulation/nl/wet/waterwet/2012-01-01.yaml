  - number: '6.26'
    text: |-
      1 Op vergunningen voor het lozen of storten van stoffen zijn de
      [artikelen 2.14, eerste, derde, vierde en zesde lid][ref1], [2.25, eerste lid][ref2],
      [2.30][ref3], [2.31, eerste lid, onder b][ref4], [2.33, eerste lid, onder b][ref5], en
      [8.1 van de Wet algemene bepalingen omgevingsrecht][ref6] van overeenkomstige toepassing, met dien verstande dat
      voor «omgevingsvergunning» wordt gelezen: vergunning.

      2 In afwijking van [artikel 6.16, eerste lid][ref7], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref8]
      niet van toepassing op de voorbereiding van een beschikking op de aanvraag tot wijziging van een vergunning voor
      het lozen van stoffen, die niet leidt tot andere of grotere nadelige gevolgen voor de chemische en ecologische
      kwaliteit van watersystemen dan volgens de geldende vergunning zijn toegestaan. De [artikelen 3.8][ref9] en
      __REF003___________________________________________________________________________________________________________
      __ zijn van overeenkomstige toepassing op de voorbereiding, bedoeld in de eerste volzin, met dien verstande dat
      voor «omgevingsvergunning» wordt gelezen: vergunning.

      3 Een vergunning voor het infiltreren van water wordt slechts verleend, indien er geen gevaar is
      voor verontreiniging van het grondwater. Bij de beoordeling van dat gevaar worden de krachtens
      [artikel 12 van de Wet bodembescherming][ref11] gestelde regels in acht genomen.

      4 Onverminderd [artikel 6.20][ref12] worden aan een vergunning als bedoeld in het tweede lid voorschriften
      verbonden volgens de krachtens [artikel 12 van de Wet bodembescherming][ref13] gestelde regels. Aan de vergunning
      worden in ieder geval voorschriften verbonden ter verzekering van de controle op de kwaliteit van het grondwater.

      5 Het tweede en derde lid zijn van overeenkomstige toepassing op de aan een vergunning voor het onttrekken van
      grondwater te verbinden voorschriften, voor zover die voorschriften betrekking hebben op het infiltreren van water.


