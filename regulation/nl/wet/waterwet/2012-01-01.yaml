  - number: '7.12'
    text: |-
      De door Onze Minister aangewezen ambtenaren die voor de toepassing van de [Algemene wet][ref1] in de
      plaats treden van de ambtenaren van de rijksbelastingdienst, zijn, voor zover dit voor het heffen van de in
      [artikel 7.10, eerste lid][ref2], bedoelde heffing redelijkerwijs nodig is, bevoegd:

      a. elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering
      van een woonruimte zonder toestemming van de gebruiker of de gebruikers, te betreden;

      b. monsters te nemen ter zake van lozingen op oppervlaktewaterlichamen in beheer bij het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.10
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.12
