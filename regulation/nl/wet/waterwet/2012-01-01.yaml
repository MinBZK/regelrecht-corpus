  - number: '5.5'
    text: |-
      Deze paragraaf is van toepassing op projectplannen tot aanleg, verlegging of versterking van primaire
      waterkeringen en, in de gevallen bij of krachtens provinciale verordening bepaald, op projectplannen van besturen
      van waterschappen voor de aanleg of wijziging van andere waterkeringen dan primaire waterkeringen en op andere
      waterstaatswerken van bovenlokale betekenis die met spoed en op gecoördineerde wijze tot stand moeten worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      1 Op de voorbereiding van het projectplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 De terinzagelegging, bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref2], geschiedt tevens ten
      kantore van de betrokken bestuursorganen. Zienswijzen kunnen naar voren worden gebracht door een ieder.

      3 De beheerder stelt een projectplan tot aanleg, verlegging of versterking van een primaire waterkering vast binnen
      twaalf weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken. Na vaststelling zendt hij
      het plan onverwijld aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:11
  - number: '5.7'
    text: |-
      1 Het projectplan behoeft de goedkeuring van gedeputeerde staten van de provincie op wier grondgebied het wordt
      uitgevoerd.

      2 Indien het een waterstaatswerk betreft dat in meer dan één provincie is gelegen, kunnen gedeputeerde staten van
      de desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van de provincie waarin
      het waterstaatswerk in hoofdzaak is gelegen, belast zijn met de goedkeuring van het projectplan.

      3 In afwijking van [artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] kan het nemen
      van een besluit omtrent de goedkeuring van een projectplan tot aanleg, verlegging of versterking van een primaire
      waterkering niet worden verdaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: '5.8'
    text: |-
      1 Gedeputeerde staten bevorderen een gecoördineerde voorbereiding van de besluiten die nodig zijn ter uitvoering
      van het projectplan.

      2 Gedeputeerde staten kunnen van andere betrokken bestuursorganen de medewerking vorderen die voor het welslagen
      van de coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.

      3 Indien het een waterstaatswerk betreft dat in meer dan één provincie is gelegen, kunnen gedeputeerde staten
      van de desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van een van die
      provincies de coördinatie van de voorbereiding van de in het eerste lid bedoelde besluiten bevorderen.

      4 Ten aanzien van aanvragen tot het nemen van besluiten als bedoeld in het eerste lid is de beheerder mede bevoegd
      deze in te dienen bij de bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      Op de voorbereiding van de in [artikel 5.8, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. de ontwerpen van de besluiten binnen een door gedeputeerde staten te bepalen termijn worden toegezonden aan
      gedeputeerde staten, die zorg dragen voor de in [artikel 3:13, eerste lid, van die wet][ref3] bedoelde toezending;

      b. gedeputeerde staten ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kunnen geven aan de
      [artikelen 3:11, eerste lid][ref4], en [3:12 van die wet][ref5];

      c. zienswijzen naar voren kunnen worden gebracht door een ieder;

      d. in afwijking van [artikel 3:18 van die wet][ref6] de besluiten worden genomen binnen een door gedeputeerde
      staten te bepalen termijn;

      e. de besluiten onverwijld worden gezonden aan gedeputeerde staten;

      f. gedeputeerde staten beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref7].


