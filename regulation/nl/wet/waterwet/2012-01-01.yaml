  - number: '7.18'
    text: |-
      1 De schade aan een onroerende zaak, veroorzaakt door het onttrekken van grondwater of het infiltreren van water
      krachtens een watervergunning, wordt, voorzover dit redelijkerwijze kan worden gevergd, door de vergunninghouder
      ondervangen.

      2 Voorzover de schade niet is ondervangen, is de vergunninghouder desgevorderd verplicht jegens ieder die enig
      recht op het gebruik of het genot van de onroerende zaak heeft, die schade te vergoeden.

      3 Niettemin kan een eigenaar van de onroerende zaak, indien door de aard of de omvang van de schade de eigendom
      van die zaak voor hem van te geringe betekenis is geworden, vorderen dat de vergunninghouder de onroerende zaak
      in eigendom overneemt. De vordering kan worden gedaan zowel bij niet-aanvaarding van een als schadevergoeding
      aangeboden som als na aanvaarding daarvan.

      4 Vorderingen, op grond van dit artikel staan ter kennisneming van de rechtbank binnen wier rechtsgebied de
      onroerende zaak of het grootste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel7.18
  - number: '7.19'
    text: |-
      1 Hij, die op grond van [artikel 7.18, eerste, tweede of derde lid][ref1], een vordering kan doen met betrekking
      tot schade in verband met een watervergunning voor het onttrekken van grondwater of het infiltreren van water als
      bedoeld in [artikel 6.4][ref2] of [6.5, onderdeel b][ref3], dan wel krachtens een verordening van een waterschap,
      kan eerst aan gedeputeerde staten van de provincie waarin de in artikel 7.18 bedoelde onroerende zaak geheel of
      grotendeels is gelegen verzoeken een onderzoek in te stellen.

      2 Indien een onroerende zaak is gelegen in een gebied waarin de grondwaterstand invloed ondergaat van meer
      dan één onttrekking en blijkens het onderzoek niet of niet binnen redelijke termijn is vast te stellen door
      welke onttrekking de schade die de onroerende zaak ondervindt wordt veroorzaakt, kennen gedeputeerde staten de
      rechthebbende ten aanzien van die onroerende zaak op zijn verzoek een vergoeding van de kosten van ondervanging van
      de schade dan wel een schadevergoeding toe. De rechthebbende is in dat geval gehouden tot overdracht van de rechten
      welke hij tegenover derden mocht kunnen doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.18
