  - number: '5.15'
    text: |-
      1 Indien ten gevolge van een ongewoon voorval de bodem of oever van een oppervlaktewaterlichaam zodanig is of
      dreigt te worden verontreinigd of aangetast dat de kwaliteit van die bodem of oever een belemmering vormt voor
      het bereiken van de gewenste gebiedskwaliteit, neemt de beheerder onverwijld de naar zijn oordeel noodzakelijke
      maatregelen ten einde de oorzaak van de verontreiniging of aantasting weg te nemen en de verontreiniging of de
      aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.

      2 De [artikelen 30, tweede tot en met vierde lid][ref1], en [74 van de Wet bodembescherming][ref2] zijn van
      overeenkomstige toepassing, met dien verstande dat voor «gedeputeerde staten» wordt gelezen: de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel74
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '74'
  - number: '5.16'
    text: |-
      1 De beheerder kan rechthebbenden ten aanzien van gronden, waarin zich een verontreiniging bevindt die een
      belemmering kan vormen voor het bereiken van de gewenste gebiedskwaliteit en die zijn gelegen in of deel uitmaken
      van de bodem of oever van een oppervlaktewaterlichaam, bevelen op daarbij aangegeven wijze onderzoek te verrichten
      naar die verontreiniging.

      2 De beheerder kan degene, door wiens handelen een verontreiniging van de bodem of oever van een
      oppervlaktewaterlichaam is veroorzaakt, bevelen op daarbij aangegeven wijze onderzoek te verrichten naar die
      verontreiniging.

      3 De beheerder kan rechthebbenden ten aanzien van gronden, waarin zich een verontreiniging bevindt die een
      belemmering vormt voor het bereiken van de gewenste gebiedskwaliteit en die zijn gelegen in of deel uitmaken
      van de bodem of oever van een oppervlaktewaterlichaam, bevelen op daarbij aangegeven wijze tijdelijke
      beveiligingsmaatregelen te treffen.

      4 De in het eerste en derde lid bedoelde bevelen worden slechts gegeven aan rechthebbenden ten aanzien van gronden,
      die zij in gebruik hebben of hebben gehad in de uitoefening van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      1 Indien de beheerder maatregelen of voorzieningen als bedoeld in [artikel 4.6, tweede lid, onder a][ref1], treft
      in verband met een verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam die een
      belemmering vormt voor het bereiken van de gewenste gebiedskwaliteit, en deze verontreiniging of aantasting zich
      niet beperkt tot die bodem of oever, hebben die maatregelen of voorzieningen tevens betrekking op de bodem die niet
      behoort tot de bodem of oever van het oppervlaktewaterlichaam, voor zover:

      a. de bron van de verontreiniging of aantasting in de bodem of oever van het oppervlaktewaterlichaam is gelegen, en

      b. de verontreiniging of aantasting van de bodem die niet tot de bodem of oever van een oppervlaktewaterlichaam
      behoort tot ernstige risico’s leidt.

      2 In een geval als bedoeld in het eerste lid pleegt de beheerder, alvorens de maatregelen of voorzieningen te
      treffen, ter zake overleg met het bevoegde bestuursorgaan ingevolge de [Wet bodembescherming][ref2].

      3 [Paragraaf 3 van hoofdstuk IV van de Wet bodembescherming][ref3] is niet van toepassing op maatregelen of
      voorzieningen als bedoeld in het eerste lid die de beheerder treft in de bodem die niet behoort tot de bodem of
      oever van een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0003994
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
      - id: ref3
        bwb_id: BWBR0003994
        paragraaf: '3'
  - number: '5.18'
    text: |-
      Indien een verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam als bedoeld in
      [artikel 6.8][ref1] zich niet beperkt tot die bodem of oever, pleegt de beheerder, alvorens van zijn bevoegdheden
      gebruik te maken, ter zake overleg met het bevoegde bestuursorgaan ingevolge de [Wet bodembescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.8
      [ref2]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6.8'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003994
  - number: '5.19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen de kwaliteit van de bodem of
      oever van een oppervlaktewaterlichaam een belemmering vormt voor het realiseren van de gewenste gebiedskwaliteit.
      Bij of krachtens die maatregel kan worden bepaald in welke gevallen een ingreep in de bodem of oever van een
      oppervlaktewaterlichaam zonder meer is vereist.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 De met de inspectie van watersystemen of onderdelen daarvan belaste personen, werkzaam onder verantwoordelijkheid
      van de beheerder, zijn bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden met
      uitzondering van woningen zonder toestemming van de bewoner.

      2 De in het eerste lid bedoelde personen zijn, indien zij daartoe bij besluit van de beheerder zijn aangewezen,
      tevens bevoegd woningen zonder toestemming van de bewoner te betreden, voorzover die woningen deel uitmaken van een
      waterstaatswerk of daarmee rechtstreeks in verbinding staan.

      3 De [artikelen 5:13][ref1], [5:15, tweede en derde lid][ref2], [5:16][ref3] en
      [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel516
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel520
