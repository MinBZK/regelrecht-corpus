        artikel: '6.17'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '6.24'
    text: |-
      1 Een vergunning geldt tevens voor de rechtsopvolgers van de vergunninghouder, tenzij bij de vergunning anders
      is bepaald.

      2 De rechtsopvolger van de vergunninghouder doet binnen vier weken nadat de vergunning voor hem is gaan gelden,
      daarvan mededeling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel6.24
  - number: '6.25'
    text: |-
      1 De [artikelen 8.40, tweede en derde lid][ref1], en [8.40a van de Wet milieubeheer][ref2] zijn, voor zover een
      krachtens [artikel 6.6][ref3] vast te stellen algemene maatregel van bestuur betrekking heeft op het lozen of
      storten van stoffen, op die maatregel van overeenkomstige toepassing.

      2 De voordracht voor een krachtens [artikel 6.6][ref4] vast te stellen algemene maatregel van bestuur wordt, voor
      zover die maatregel betrekking heeft op het lozen of storten van stoffen, niet gedaan dan nadat het ontwerp in de
      Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop
      de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen. Gelijktijdig met de
      bekendmaking wordt het ontwerp aan de beide Kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40a
