  - number: '3.2'
    text: |-
      1 Bij provinciale verordening worden voor de niet bij het Rijk in beheer zijnde watersystemen of
      onderdelen daarvan overheidslichamen aangewezen die belast zijn met het beheer, met inachtneming van
      [artikel 2, tweede lid, van de Waterschapswet][ref1].

      2 Voor zover bij provinciale verordening andere lichamen dan waterschappen worden belast met beheer, zijn de
      [artikelen 4.6][ref2], [5.1][ref3], [7.2][ref4], [8.1][ref5] en [8.3][ref6] van deze wet niet van toepassing voor
      de betrokken beheerders en, indien het provincies en gemeenten betreft, evenmin [artikel 5.29][ref7], behoudens
      voor zover dat artikel bij of krachtens die verordening van toepassing wordt verklaard voor daarbij aan te wijzen
      waterstaatswerken, in verband met de bijzondere betekenis van die waterstaatswerken.

      3 [Artikel 3.1, derde lid][ref8], is van overeenkomstige toepassing.


