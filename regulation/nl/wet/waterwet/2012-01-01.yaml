  - number: '8.9'
    text: |-
      1 Onverminderd het recht van andere staten om overeenkomstig het VN-Zeerechtverdrag tot rechtsvervolging over te
      gaan, is de Nederlandse strafwet toepasselijk op ieder die zich in of boven de exclusieve economische zone schuldig
      maakt aan overtreding van de voorschriften, gesteld bij of krachtens deze wet.

      2 Bij de opsporing en vervolging van strafbare feiten als bedoeld in het eerste lid wordt afdeling 7 van Deel XII
      van het VN-Zeerechtverdrag in acht genomen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel8.9
  - number: '8.10'
    text: |-
      Onze Minister en de toezichthouders nemen bij de toepassing van [artikel 8.5][ref1], onderscheidenlijk bij de
      uitoefening van het toezicht op de naleving van het bij of krachtens deze wet bepaalde, afdeling 7 van Deel XII van
      het VN-Zeerechtverdrag in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel8.5
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '8.5'
        hoofdstuk: '8'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van internationale verplichtingen die
      betrekking hebben op waterbeheer, alsmede ten behoeve van een goede uitvoering van deze wet nadere regels worden
      gesteld met betrekking tot de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.1
  - number: '10.2'
    text: |-
      Een wijziging van de kaderrichtlijn water of van een andere op grond van deze wet uitgevoerde richtlijn van een
      of meer instellingen van de Europese Unie alleen of gezamenlijk gaat voor de toepassing van deze wet gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.2
  - number: '10.3'
    text: |-
      1 Er is een Commissie van advies inzake de waterstaatswetgeving.

      2 De commissie heeft als taak de regering en de beide Kamers der Staten-Generaal te adviseren over de inhoud en
      structuur van de wetgeving op het gebied van de waterstaatszorg.

      3 De commissie bestaat uit een voorzitter en ten hoogste zes andere leden.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.3
  - number: '10.4'
    text: |-
      Onze Minister zendt binnen vijf jaar na de volledige inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.4
  - number: '10.5'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Waterwet.'
    url: https://wetten.overheid.nl/BWBR0025458/2012-01-01#Artikel10.6
