  - number: '7.26'
    text: |-
      1 Onze Minister stelt voor 1 oktober van het kalenderjaar dat volgt op het kalenderjaar waarin de peildatum valt de
      hoogte van de ingevolge [artikel 7.24][ref1] verschuldigde bijdrage over het desbetreffende kalenderjaar en de drie
      daarop volgende kalenderjaren vast.

      2 Onze Minister kan de bijdrage invorderen bij dwangbevel.


