  - number: '8.2'
    text: |-
      In afwijking van [artikel 8.1, eerste lid][ref1], rusten de daarin bedoelde taken ten aanzien van:

      a. een vergunningplichtige handeling waarop [artikel 6.17, eerste of tweede lid][ref2], van toepassing is: op het
      bestuursorgaan dat op de vergunningaanvraag beslist;

      b. een handeling waarvoor krachtens [artikel 6.7][ref3] een meldings-, meet-, registratie- of opgaveverplichting
      geldt: op het ingevolge dat artikel aangewezen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel8.1
