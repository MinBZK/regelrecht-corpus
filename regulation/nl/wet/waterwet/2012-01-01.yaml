  - number: '6.22'
    text: |-
      1 Het bevoegd gezag kan een vergunning en de daaraan verbonden voorschriften en beperkingen wijzigen of aanvullen.

      2 Het bevoegd gezag kan een vergunning geheel of gedeeltelijk intrekken, indien de vergunning gedurende drie
      achtereenvolgende jaren niet is gebruikt.

      3 Het bevoegd gezag trekt de vergunning geheel of gedeeltelijk in:

      a. op aanvraag van de vergunninghouder, voor zover de doelstellingen en belangen, bedoeld in de
      [artikelen 2.1][ref1] en [6.11][ref2], zich hiertegen niet verzetten;

      b. indien zich omstandigheden of feiten voordoen waardoor de handeling of handelingen waarvoor de vergunning is
      verleend, niet langer toelaatbaar worden geacht met het oog op de in de [artikelen 2.1][ref3] en [6.11][ref4]
      bedoelde doelstellingen en belangen;

      c. indien een voor Nederland verbindend verdrag of besluit van een volkenrechtelijke organisatie, dan wel een
      wettelijk voorschrift ter uitvoering daarvan, daartoe verplicht.

      4 Het bevoegd gezag gaat in een geval als bedoeld in het derde lid, onderdeel b of c, niet tot intrekking over,
      voor zover kan worden volstaan met wijziging of aanvulling van de aan de vergunning verbonden voorschriften of
      beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.11
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel2.1
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6.11
