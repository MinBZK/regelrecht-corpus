  - number: '436'
    text: |-
      De in de [artikelen 111][ref1], [180][ref2], [214–218][ref3], [222–227bis][ref4], [230–234][ref5],
      [323–325][ref6], [330][ref7], [331][ref8], [334–336][ref9], [339–345][ref10], [354][ref11], [356][ref12],
      [357][ref13], [359][ref14], [375][ref15], [377][ref16], [382][ref17], [417][ref18], [431][ref19] en [432][ref20]
      bepaalde gevangenisstraf kan met een derde worden verhoogd, indien tijdens het plegen van het misdrijf nog
      geen vijf jaren zijn verloopen, sedert de schuldige hetzij eene tegen hem wegens een der in die artikelen
      omschreven misdrijven uitgesproken gevangenisstraf, hetzij eene wegens diefstal, verduistering, heling, het
      opzettelijk voordeel trekken uit de opbrengst van eenig door misdrijf verkregen voorwerp of bedrog krachtens de
      militaire strafwetgeving opgelegde straf geheel of ten deele heeft ondergaan, of sedert die straf hem geheel is
      kwijtgescholden, of indien tijdens het plegen van het misdrijf het recht tot uitvoering dier straf nog niet is
      verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel180
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel214
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel222
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel230
      [ref6]: https://wetten.overheid.nl/BWBR0028570#Artikel323
