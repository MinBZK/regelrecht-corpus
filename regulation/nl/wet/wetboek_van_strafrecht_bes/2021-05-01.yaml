  - number: 17j.5
    text: |-
      De ingediende vorderingen, conclusies of verzoeken kunnen gedurende het onderzoek door het openbaar ministerie of
      door den veroordeelde worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17j
  - number: 17k
    text: |-
      De beslissingen in de [artikelen 17g][ref1] en [17h][ref2] bedoeld, alsmede die waarbij vorderingen of verzoeken
      tot toepassing van een dier artikelen worden afgewezen, zijn met redenen omkleed; zij zijn niet aan eenig
      rechtsmiddel onderworpen. Alleen indien de beslissing inhoudt last tot tenuitvoerlegging, wordt zij in het openbaar
      uitgesproken. De inhoud der beslissing wordt vanwege het openbaar ministerie door een deurwaarder of dienaar der
      openbaar macht onverwijld op den voet van [artikel 643 van het Wetboek van Strafvordering BES][ref3] beteekend
      aan den veroordeelde, aan dengene die met het verleenen van bijstand is belast, zoomede aan dengene die bij de
      beslissing daarvan wordt ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17g
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel17h
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel643
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17k
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17g
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 17h
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '643'
  - number: '18.1'
    text: |-
      De tot gevangenisstraf veroordeelde kan, wanneer twee derden van deze straf en tevens ten minste negen
      maanden daarvan zijn verstreken, voorwaardelijk in vrijheid worden gesteld. Ingeval de veroordeelde meerdere
      gevangenisstraffen achtereenvolgens moet ondergaan, worden zij ten deze als één straf aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel18
  - number: '18.2'
    text: |-
      Bij schuldigverklaring wegens een misdrijf genoemd in de [artikelen 436][ref1], [437][ref2] en [438][ref3] kan
      de schuldigverklaarde pas voorwaardelijk in vrijheid worden gesteld wanneer vier vijfde van de gevangenisstraf en
      tenminste twaalf maanden daarvan zijn verstreken, indien tijdens het begaan van het misdrijf nog geen vijf jaren
      zijn verlopen sedert de schuldigverklaarde een tegen hem op grond van een der in die artikelen genoemde misdrijven
      uitgesproken gevangenisstraf geheel of ten dele heeft ondergaan, of indien tijdens het begaan van het misdrijf het
      recht tot uitvoering van die gevangenisstraf nog niet is verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel436
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel437
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel438
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '436'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '437'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '438'
  - number: '18.3'
    text: |-
      Bij de schuldigverklaring wegens een misdrijf genoemd in de [artikelen 436][ref1], [437][ref2] en [438][ref3] kan
      de schuldigverklaarde niet voorwaardelijk in vrijheid worden gesteld, indien tijdens het begaan van het misdrijf
      nog geen vijf jaren zijn verlopen sedert de schuldigverklaarde een tegen hem uitgesproken gevangenisstraf ten
      aanzien waarvan het bepaalde in dit lid of het tweede lid van toepassing is, geheel of ten dele heeft ondergaan, of
      indien tijdens het begaan van het misdrijf het recht tot uitvoering van die gevangenisstraf nog niet is verjaard.
      Bij deze invrijheidstelling wordt tevens een proeftijd voor den veroordeelde bepaald en worden voorwaarden gesteld,
      waaraan deze gedurende den proeftijd zal moeten voldoen. De proeftijd duurt een jaar langer dan het overblijvend
      gedeelte van de straf. Hij loopt niet gedurende den tijd dat den veroordeelde rechtens zijne vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel436
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel437
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel438
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '436'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '437'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '438'
  - number: 18a
    text: |-
      Aan de voorwaardelijke invrijheidstelling wordt als algemeene voorwaarde verbonden dat de veroordeelde geen
      strafbaar feit zal begaan, noch zich op andere wijze zal misdragen. Aan de voorwaardelijke invrijheidstelling
      kunnen bovendien bijzondere voorwaarden, het gedrag van den veroordeelde betreffende, worden verbonden, mits die
      voorwaarden de godsdienstige of staatkundige vrijheid niet beperken. Mede kan als bijzondere voorwaarde worden
      gesteld dat de veroordeelde zich ter verpleging zal laten opnemen in een daarbij aan te wijzen inrichting. Met het
      toezicht op de naleving der voorwaarden is steeds het openbaar ministerie belast. Op de naleving der voorwaarden
      kan bovendien een bijzonder toezicht in het leven worden geroepen. Gedurende de proeftijd kan worden bepaald, dat
      deze voor het in [artikel 18][ref1] bedoelde tijdstip zal eindigen, kan in de gestelde bijzondere voorwaarden
      wijziging worden gebracht, kunnen deze voorwaarden worden opgeheven, kunnen alsnog bijzondere voorwaarden worden
      gesteld, kan alsnog een bijzonder toezicht in het leven worden geroepen en kan het bijzondere toezicht aan een
      ander dan degene die daarmede te voren was belast, worden opgedragen. Aan den voorwaardelijk in vrijheid gestelde
      wordt een verlofpas uitgereikt, waarin alle hem gestelde voorwaarden zijn uitgedrukt. In geval van toepassing van
      het voorgaande lid wordt hem een nieuwe verlofpas uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel18
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '18'
  - number: 18b
    text: |-
      De voorwaardelijke invrijheidstelling is te allen tijde herroepbaar ingeval de veroordeelde in strijd handelt met
      de in zijn verlofpas uitgedrukte voorwaarden. Zij kan, indien een ernstig vermoeden van zodanig handelen bestaat,
      worden geschorst. De tijd, verlopen tussen een invrijheidstelling en een hervatting van de tenuitvoerlegging
      der straf, wordt niet in rekening gebracht op de duur der straf. De herroeping kan niet meer geschieden, wanneer
      sedert het einde van de proeftijd een termijn van drie maanden is verstreken, tenzij de veroordeelde voor de
      afloop daarvan ter zake van een gedurende de proeftijd begaan strafbaar feit is vervolgd en de vervolging met
      een onherroepelijke strafbaarverklaring eindigt. Alsdan kan de voorwaardelijke invrijheidstelling ter zake van
      het begaan van het feit nog binnen drie maanden nadat de strafbaarverklaring onherroepelijk is geworden, worden
      herroepen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel18b
  - number: '19.1'
    text: |-
      Alle besluiten op grond van de [artikelen 18 tot en met 18b][ref1] worden genomen door Onze Minister voor
      Rechtsbescherming, gehoord de reclasseringsinstelling en het gevangenisbestuur. Het gevangenisbestuur kan Onze
      Minister voor Rechtsbescherming voorstellen te besluiten tot voorwaardelijke invrijheidstelling. Onze Minister
      voor Rechtsbescherming kan de bevoegdheden, bedoeld in de eerste volzin, mandateren aan het hoofd van de Dienst
      Justitiële Inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel18
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '18'
  - number: '19.2'
    text: |-
      Zolang de bevoegdheid tot herroeping van de voorwaardelijke invrijheidstelling bestaat, kan de voorwaardelijk
      in vrijheid gestelde, ten aanzien van wie een redelijk vermoeden bestaat, dat hij gedurende de proeftijd in
      strijd heeft gehandeld met de in zijn verlofpas uitgedrukte voorwaarden, in het belang der openbare orde worden
      aangehouden. De aanhouding wordt bevolen door de officier van justitie onder de verplichting Onze Minister voor
      Rechtsbescherming daarvan onverwijld kennis te geven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel19
  - number: '19.3'
    text: |-
      De aanhouding is gedurende ten hoogste dertig dagen van kracht. Volgt in aansluiting aan de aanhouding een
      schorsing of een herroeping van de voorwaardelijke invrijheidstelling, dan wordt de tenuitvoerlegging der straf
      geacht hervat te zijn op de dag der aanhouding.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel19
  - number: '20'
    text: |-
      Het formulier der verlofpassen, de nadere regeling van het toezicht op de naleving der voorwaarden zoomede de
      verdere voorschriften ter uitvoering van de [artikelen 18–19][ref1] worden vastgesteld bij algemene maatregel van
      bestuur. Daarbij wordt in acht genomen dat het bijzonder toezicht uitsluitend mag gericht zijn op het verleenen van
      hulp en steun aan den veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel18
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '18'
  - number: '21'
    text: |-
      De duur der hechtenis is ten minste een dag en ten hoogste een jaar. Zij kan voor ten hoogste een jaar en vier
      maanden worden opgelegd in de gevallen waarin wegens strafverhooging ter zake van samenloop van misdrijven,
      herhaling van misdrijf of het bepaalde bij [artikel 46][ref1], de tijd van een jaar wordt overschreden. Zij kan in
      geen geval de tijd van een jaar en vier maanden te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel46
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '46'
  - number: '22'
    text: |-
      [Artikel 14][ref1] is op de tot hechtenis veroordeelde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel14
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '14'
  - number: '23'
    text: |-
      Hechtenis wordt in de regel in gemeenschap ondergaan. De veroordeelde kan, op zijn verzoek, vergund worden de
      hechtenis in afzondering te ondergaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel23
  - number: '24'
    text: |-
      Een tot hechtenis veroordeelde is verplicht tot het verrichten van de hem opgedragen arbeid, overeenkomstig de
      voorschriften ter uitvoering van [artikel 26][ref1] gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel26
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '26'
  - number: '25'
    text: |-
      De duur der tijdelijke gevangenisstraf en der hechtenis wordt in de rechterlijke uitspraak aangewezen in dagen,
      weken, maanden en jaren, niet in gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel25
  - number: '26'
    text: |-
      De indeling en het beheer van, het toezicht op en het regime in de gevangenissen en huizen van bewaring, de arbeid,
      de bestemming van de opbrengst van de arbeid, de geestelijke, culturele en sociale verzorging, en de tucht, worden
      bij of krachtens de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel26
  - number: '27.1'
    text: |-
      Hij die tot een geldboete is veroordeeld, is verplicht tot betaling van het bij de rechterlijke uitspraak
      vastgestelde bedrag aan de staat binnen de termijn door het openbaar ministerie dat met de tenuitvoerlegging van
      het vonnis of arrest is belast, te stellen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.2'
    text: Het bedrag van de geldboete is ten minste USD 2,80.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.3'
    text: |-
      De geldboete die voor een strafbaar feit ten hoogste kan worden opgelegd, is gelijk aan het bedrag van de categorie
      die voor dat feit is bepaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.4'
    text: |-
      Er zijn zes categorieën: de eerste categorie, USD 280; de tweede categorie, USD 2.800; de derde categorie,
      USD 5.600; de vierde categorie, USD 14.000; de vijfde categorie, USD 56.000; de zesde categorie, USD 560.000.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.5'
    text: |-
      Voor een overtreding, onderscheidenlijk een misdrijf, waarop geen geldboete is gesteld, kan de rechter een
      geldboete opleggen tot ten hoogste het bedrag van de eerste, onderscheidenlijk de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.6'
    text: |-
      Voor een overtreding, onderscheidenlijk een misdrijf, waarop een geldboete is gesteld, maar waarvoor geen
      boetecategorie is bepaald, kan de rechter een geldboete opleggen tot ten hoogste het bedrag van de categorie, die
      voorziet in het naast hogere geldbedrag indien dit bedrag hoger is dan het bedrag van de op het betrokken strafbare
      feit gestelde geldboete.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.7'
    text: |-
      Bij veroordeling van een rechtspersoon kan, indien de voor het feit bepaalde boetecategorie geen passende
      bestraffing toelaat, een geldboete worden opgelegd tot ten hoogste het bedrag van de naast hogere categorie. Is
      de op het feit bepaalde geldboete van de zesde categorie, dan kan, indien het berekende bedrag hoger is dan het
      hoogste bedrag van die categorie, een geldboete worden opgelegd tot ten hoogste het bedrag dat gelijk is aan tien
      procent van de omzet van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.8'
    text: |-
      Het voorgaande is van overeenkomstige toepassing bij veroordeling van een vennootschap zonder
      rechtspersoonlijkheid, maatschap of doelvermogen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: '27.9'
    text: |-
      De in het vierde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden aangepast aan de
      ontwikkeling van de consumentenprijsindex sinds de vorige aanpassing van deze bedragen. Bij deze aanpassing wordt
      het geldbedrag van de eerste categorie op een veelvoud van USD 5 naar beneden afgerond en worden, uitgaande van het
      geldbedrag van deze eerste categorie en onder instandhouding van de onderlinge verhouding tussen de bedragen van de
      geldboetecategorieën, de bedragen van de tweede tot en met de zesde geldboetecategorieën bepaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27
  - number: 27a
    text: |-
      Bij de vaststelling van de geldboete houdt de rechter rekening met de draagkracht van de verdachte in de mate
      waarin hij dat nodig acht met het oog op een passende bestraffing van de verdachte zonder dat deze in zijn inkomen
      en vermogen onevenredig wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27a
  - number: 27b.1
    text: |-
      Indien bij het vonnis een of meer geldboeten zijn opgelegd tot een bedrag van ten minste USD 140, is de rechter
      bevoegd bij de uitspraak te bepalen, dat de veroordeelde het bedrag in gedeelten mag voldoen. Elk van die gedeelten
      wordt daarbij op tenminste USD 28 bepaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27b
  - number: 27b.2
    text: |-
      In geval van toepassing van het eerste lid stelt de rechter bij de uitspraak tevens termijnen vast voor de betaling
      van het tweede en – zo de geldboete in meer gedeelten mag worden voldaan – de volgende gedeelten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27b
  - number: 27b.3
    text: |-
      Deze termijnen worden op ten minste een en ten hoogste drie maanden gesteld. Zij mogen tezamen een tijdvak van twee
      jaar niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27b
  - number: 27c.1
    text: |-
      Wanneer een ingevolge een onherroepelijke veroordeling tot geldboete te betalen bedrag binnen de daarvoor gestelde
      termijn niet in zijn geheel is voldaan, wordt de veroordeelde door het openbaar ministerie schriftelijk tot
      betaling aangemaand. Het bedrag wordt daarbij van rechtswege verhoogd met USD 14. Het openbaar ministerie wijst de
      veroordeelde op het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27c
  - number: 27c.2
    text: |-
      Is het overeenkomstig het eerste lid verhoogde bedrag na verloop van de bij de aanmaning gestelde termijn geheel of
      ten dele onbetaald gebleven, dan wordt het bedrag, dan wel het nog verschuldigde gedeelte daarvan, van rechtswege
      verder verhoogd met een vijfde, doch ten minste met USD 28.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27c
  - number: 27c.3
    text: |-
      Een geldboete die overeenkomstig [artikel 27b][ref1], in gedeelten mag worden voldaan, of ten aanzien waarvan het
      openbaar ministerie betaling in termijnen heeft toegestaan, is onmiddellijk in haar geheel opeisbaar, zodra een
      verhoging krachtens het eerste lid is ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 27b
  - number: 27c.4
    text: |-
      In gevallen waarin het openbaar ministerie, nadat de veroordeelde reeds in verzuim was, alsnog uitstel van betaling
      heeft verleend, dan wel afbetaling heeft toegestaan, vinden de voorgaande leden van dit artikel geen toepassing,
      zolang de veroordeelde zijn verplichtingen volgens de getroffen nadere regeling nakomt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27c
  - number: 27c.5
    text: |-
      Betalingen door de veroordeelde gedaan, worden geacht in de eerste plaats tot voldoening van de krachtens het
      eerste en tweede lid ingetreden verhogingen te strekken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel27c
  - number: '28.1'
    text: |-
      Bij de uitspraak waarbij geldboete wordt opgelegd, beveelt de rechter voor het geval dat noch volledige betaling
      noch volledig verhaal van het verschuldigde bedrag volgt, dat vervangende hechtenis zal worden toegepast. Indien
      de veroordeelde een rechtspersoon is, blijft dit bevel achterwege. [Artikel 53, laatste lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel53
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '53'
  - number: '28.2'
    text: De duur van de vervangende hechtenis wordt in gehele dagen, weken of maanden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28
  - number: '28.3'
    text: |-
      De vervangende hechtenis beloopt ten minste één dag en ten hoogste een jaar. Voor elke volle USD 28 van de
      geldboete wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28
  - number: '28.4'
    text: |-
      Wanneer een gedeelte van het verschuldigde bedrag is voldaan, vermindert de duur van de vervangende hechtenis
      naar evenredigheid. Heeft deze vermindering tot gevolg dat voor een gedeelte van een dag vervangende hechtenis zou
      moeten worden ondergaan, dan vindt afronding naar boven plaats tot het naaste aantal gehele dagen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28
  - number: '28.5'
    text: |-
      Het vorige lid is ook van toepassing in gevallen waarin de betaling geschiedt nadat reeds een deel van de
      vervangende hechtenis ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28
  - number: 28a.1
    text: |-
      Bij de uitspraak waarbij een natuurlijk persoon de verplichting is opgelegd tot betaling van een geldbedrag aan de
      staat ter ontneming van wederrechtelijk verkregen voordeel, beveelt de rechter voor het geval dat noch volledige
      betaling noch volledig verhaal van het verschuldigde bedrag volgt, dat vervangende hechtenis zal worden toegepast,
      met dien verstande dat vervangende hechtenis op grond van dit artikel op te leggen op ten hoogste drie jaren kan
      worden bepaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28a
  - number: 28a.2
    text: |-
      De duur van deze vervangende hechtenis wordt niet verminderd door het voldoen van slechts een gedeelte van het
      verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28a
  - number: 28b
    text: |-
      Op de tenuitvoerlegging van vervangende hechtenis is het bepaalde in [artikel 18][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel18
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '18'
  - number: '29'
    text: |-
      Bevindt de veroordeelde, die hechtenis moet ondergaan, zich in een gesticht uitsluitend bestemd tot de uitvoering
      van gevangenisstraf, dan kan op zijn verzoek de hechtenis terstond na het eindigen der gevangenisstraf in dat
      gesticht worden ondergaan, zonder daardoor van aard te veranderen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel29
  - number: '30'
    text: |-
      De gevangenisstraf en de hechtenis gaan in op den dag der tenuitvoerlegging van de rechterlijke uitspraak, voor
      zooveel elke dezer straffen betreft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel30
  - number: '31.1'
    text: |-
      Bij de rechterlijke uitspraak wordt bepaald dat de tijd, door den veroordeelde vóór de tenuitvoerlegging van die
      uitspraak in verzekering, in voorlopige hechtenis of in detentie in het buitenland ingevolge een Nederlands verzoek
      om uitlevering doorgebracht, bij de uitvoering van de hem opgelegde tijdelijke gevangenisstraf, hechtenis of
      geldboete geheel of gedeeltelijk in mindering zal worden gebracht, wat de geldboete betreft volgens de maatstaf in
      de uitspraak te bepalen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel31
  - number: '31.2'
    text: |-
      De bepaling van dit artikel is ook toepasselijk ingeval, bij gelijktijdige vervolging wegens meerdere feiten, de
      veroordeeling wordt uitgesproken ter zake van een ander feit dan waarvoor de verzekering of de voorlopige hechtenis
      is bevolen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel31
  - number: 31bis
    text: De straf van berisping bestaat in een vermanende toespraak tot de veroordeelde, in verband met het gepleegde feit.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel31bis
  - number: '32.1'
    text: |-
      De rechten waarvan de schuldige, in de bij dit Wetboek of bij eene andere wet bepaalde gevallen, bij rechterlijke
      uitspraak kan worden ontzet, zijn:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: 32.1.1°
    text: het bekleeden van ambten of van bepaalde ambten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: 32.1.2°
    text: het dienen bij de gewapende macht;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: 32.1.3°
    text: het kiezen en de verkiesbaarheid bij krachtens wettelijk voorschrift uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: 32.1.4°
    text: het zijn van raadsman of gerechtelijk bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: 32.1.5°
    text: de uitoefening van bepaalde beroepen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: '32.2'
    text: |-
      Ontzetting van voor hun leven aangestelde leden der rechtelijke macht of andere ambtenaren geschiedt, ten opzichte
      van het ambt waartoe zij aldus zijn aangesteld, alleen in de gevallen en op de wijze bij de wet bepaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: '32.3'
    text: |-
      Onverminderd bijzondere bepalingen kan bij veroordeling wegens een terroristisch misdrijf de ontzetting van de in
      het eerste lid vermelde rechten worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel32
  - number: '33'
    text: |-
      Ontzetting van het recht om ambten of bepaalde ambten te bekleeden en bij de gewapende macht te dienen kan,
      behalve in de gevallen in het [Tweede Boek][ref1] omschreven, worden uitgesproken bij veroordeeling wegens eenig
      ambtsmisdrijf of wegens eenig misdrijf waardoor de schuldige een bijzonderen ambtsplicht schond of waarbij hij
      gebruik maakte van macht, gelegenheid of middel hem door zijn ambt geschonken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '34'
    text: 'Wanneer ontzetting van rechten wordt uitgesproken, bepaalt de rechter den duur als volgt:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel34
  - number: 34.1°
    text: bij veroordeeling tot levenslange gevangenisstraf, voor het leven;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel34
  - number: 34.2°
    text: |-
      bij veroordeeling tot tijdelijke gevangenisstraf of tot hechtenis, voor een tijd den duur der hoofdstraf ten minste
      twee en ten hoogste vijf jaren te boven gaande;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel34
  - number: 34.3°
    text: bij veroordeeling tot geldboete voor een tijd van ten minste twee en ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel34
  - number: '35.1'
    text: 'Vatbaar voor verbeurdverklaring zijn:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.a
    text: |-
      voorwerpen, die aan de veroordeelde toebehoren of die hij geheel of ten dele ten eigen bate kan aanwenden en die
      geheel of grotendeels door middel van het strafbare feit zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.b
    text: voorwerpen met betrekking tot welke het feit is begaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.c
    text: voorwerpen met behulp waarvan het feit is begaan of voorbereid;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.d
    text: voorwerpen met behulp waarvan de opsporing van het misdrijf is belemmerd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.e
    text: voorwerpen die tot het begaan van het misdrijf zijn vervaardigd of bestemd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.1.f
    text: zakelijke rechten op of persoonlijke rechten ten aanzien van de in onderdelen a tot en met e bedoelde voorwerpen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: '35.2'
    text: |-
      Voorwerpen als bedoeld in het eerste lid, onderdelen b tot en met e die niet aan de veroordeelde toebehoren kunnen
      alleen verbeurd verklaard worden, indien:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.2.a
    text: |-
      degene aan wie zij toebehoren bekend was met hun verkrijging door middel van het strafbare feit of met het gebruik
      of de bestemming in verband daarmede, dan wel die verkrijging, dat gebruik of die bestemming had kunnen vermoeden,
      of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35.2.b
    text: niet is kunnen worden vastgesteld aan wie zij toebehoren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: '35.3'
    text: |-
      Rechten als bedoeld in het eerste lid, onderdeel f, die niet aan de veroordeelde toebehoren kunnen alleen verbeurd
      worden verklaard, indien degene aan wie zij toebehoren bekend was met de verkrijging van de voorwerpen waarop of
      ten aanzien waarvan deze rechten bestaan, door middel van het strafbare feit of met het gebruik of de bestemming in
      verband daarmede, dan wel die verkrijging, dat gebruik of die bestemming redelijkerwijs had kunnen vermoeden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: '35.4'
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35
  - number: 35a
    text: |-
      In de verbeurdverklaring van een voorwerp is begrepen die van de verpakking waarin het zich bevindt, tenzij de
      rechter het tegendeel bepaalt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35a
  - number: 35b.1
    text: |-
      Bij de verbeurdverklaring van voorwerpen kan de rechter voor het geval waarin de verbeurd verklaarde voorwerpen
      meer zouden opbrengen dan een in de uitspraak vastgesteld bedrag, bevelen dat het verschil wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35b
  - number: 35b.2
    text: |-
      De rechter kent een vergoeding als bedoeld in het eerste lid, of een geldelijke tegemoetkoming toe wanneer dit
      nodig is om te voorkomen dat de veroordeelde of een ander aan wie de verbeurd verklaarde voorwerpen toebehoren,
      onevenredig zou worden getroffen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35b
  - number: 35b.3
    text: |-
      De rechter bepaalt aan wie het bedrag van de vergoeding of tegemoetkoming wordt uitbetaald; zulks laat ieders recht
      op dit bedrag onverlet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel35b
  - number: '36.1'
    text: |-
      Niet in beslag genomen voorwerpen worden, bij verbeurdverklaring, in de uitspraak op een bepaald geldelijk bedrag
      geschat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel36
  - number: '36.2'
    text: In dit geval moeten de voorwerpen worden uitgeleverd of moet de geschatte waarde worden betaald.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel36
  - number: '36.3'
    text: |-
      De [artikelen 27c][ref1] en [28][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel27c
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel28
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 27c
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '28'
  - number: 36a
    text: |-
      Bij in- of vervoer van goederen in strijd met de belastingwetgeving door een persoon beneden den leeftijd van
      achttien jaren kan de rechter op vordering van den met de vervolging belasten ambtenaar de verbeurdverklaring van
      de aangehaalde goederen uitspreken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel36a
  - number: 36b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel36b
  - number: '37'
    text: |-
      Alle kosten van gevangenisstraf en hechtenis komen ten laste, alle opbrengst van geldboeten en verbeurdverklaringen
      ten bate van ‘s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel37
  - number: '38'
    text: |-
      In de gevallen waarin de rechter krachtens de wet de openbaarmaking zijner uitspraak gelast, bepaalt hij tevens de
      wijze waarop aan dien last op kosten van den veroordeelde uitvoering wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38
  - number: 38a
    text: |-
      Alle kosten van tenuitvoerlegging van de in deze titel bedoelde maatregelen – met uitzondering van de kosten van
      het verhaal, de invorderingskosten daaronder begrepen – komen ten laste, al hetgeen door die tenuitvoerlegging
      wordt verkregen komt ten bate van de Staat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38a
  - number: 38b.1
    text: 'Onttrekking aan het verkeer van in beslag genomen voorwerpen kan worden uitgesproken:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
  - number: 38b.1.a
    text: bij de rechterlijke uitspraak waarbij iemand wegens een strafbaar feit wordt veroordeeld;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
  - number: 38b.1.b
    text: |-
      bij de rechterlijke uitspraak waarbij, niettegenstaande vrijspraak of ontslag van alle rechtsvervolging, wordt
      vastgesteld dat een strafbaar feit is begaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
  - number: 38b.1.c
    text: bij een afzonderlijke rechterlijke beschikking op vordering van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
  - number: 38b.2
    text: |-
      De [artikelen 35a][ref1] en [35b, tweede en derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel35b
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 35a
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 35b
  - number: 38b.3
    text: |-
      De [artikelen 442][ref1], [443][ref2] en [444, eerste lid, van het Wetboek van Strafvordering BES][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel442
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel444
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '442'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '443'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '444'
  - number: 38b.4
    text: De maatregel van onttrekking aan het verkeer kan tezamen met straffen en andere maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38b
  - number: 38c
    text: 'Vatbaar voor onttrekking aan het verkeer zijn alle voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38c.a
    text: die geheel of grotendeels door middel van of uit de baten van het feit zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38c.b
    text: met betrekking tot welke het feit is begaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38c.c
    text: met behulp waarvan het feit is begaan of voorbereid;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38c.d
    text: met behulp waarvan de opsporing van het feit is belemmerd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38c.e
    text: die tot het begaan van het feit zijn vervaardigd of bestemd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38c
  - number: 38d
    text: |-
      Vatbaar voor onttrekking aan het verkeer zijn bovendien de aan de dader of verdachte toebehorende voorwerpen van
      zodanige aard dat het ongecontroleerde bezit daarvan in strijd is met de wet of met het algemeen belang, welke
      voorwerpen bij gelegenheid van het onderzoek naar het door hem begane feit, dan wel het feit waarvan hij wordt
      verdacht, zijn aangetroffen, doch alleen indien de voorwerpen kunnen dienen tot het begaan of de voorbereiding van
      soortgelijke feiten, dan wel tot belemmering van de opsporing daarvan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38d
  - number: 38e.1
    text: |-
      Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die is
      veroordeeld wegens een strafbaar feit de verplichting worden opgelegd tot betaling van een geldbedrag aan de Staat
      ter ontneming van het wederrechtelijk verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.2
    text: |-
      De verplichting kan worden opgelegd aan de in het eerste lid bedoelde persoon die voordeel heeft verkregen door
      middel van of uit de baten van het daar bedoelde strafbare feit of soortgelijke feiten of feiten, waardoor op geld
      waardeerbaar voordeel van enig belang kan worden verkregen, waaromtrent voldoende aanwijzingen bestaan dat zij door
      hem zijn begaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.3
    text: |-
      Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die is
      veroordeeld wegens misdrijf, waarop naar de wettelijke omschrijving gevangenisstraf van ten hoogste vier of meer
      jaren is gesteld, of een misdrijf, waardoor op geld waardeerbaar voordeel van enig belang kan worden verkregen,
      en tegen wie als verdachte van dat misdrijf een strafrechtelijk financieel onderzoek is ingesteld, de verplichting
      worden opgelegd tot betaling van een geldbedrag aan de Staat ter ontneming van het wederrechtelijk verkregen
      voordeel, indien gelet op dat onderzoek aannemelijk is dat ook andere strafbare feiten er op enigerlei wijze toe
      hebben geleid dat de veroordeelde wederrechtelijk voordeel heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.4
    text: |-
      De rechter stelt het bedrag vast waarop het wederrechtelijk verkregen voordeel wordt geschat. Onder voordeel is de
      besparing van kosten begrepen. De waarde van de voorwerpen die door de rechter tot het wederrechtelijk verkregen
      voordeel worden gerekend, wordt geschat op het voordeel dat degene tegen wie de vordering, bedoeld in het eerste en
      derde lid, is ingesteld, daarmee, gelet op de concrete omstandigheden van het geval, heeft behaald. De rechter kan
      het te bepalen bedrag lager vaststellen dan het geschatte voordeel.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.5
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.6
    text: |-
      Bij de bepaling van de omvang van het bedrag waarop het wederrechtelijk verkregen voordeel wordt geschat, worden
      aan benadeelde derden in rechte toegekende vorderingen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38e.7
    text: |-
      Bij de oplegging van de maatregel wordt rekening gehouden met uit hoofde van eerdere beslissingen opgelegde
      verplichtingen tot betaling van een geldbedrag ter ontneming van het wederrechtelijk voordeel.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38e
  - number: 38f.1
    text: |-
      Aan degene die bij rechterlijke uitspraak wegens een strafbaar feit wordt veroordeeld, kan de verplichting worden
      opgelegd tot betaling aan de staat van een som gelds ten behoeve van het slachtoffer. De staat keert een ontvangen
      bedrag onverwijld uit aan het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38f
  - number: 38f.2
    text: |-
      De maatregel kan worden opgelegd indien en voor zover de verdachte jegens het slachtoffer naar burgerlijk recht
      aansprakelijk is voor de schade die door het strafbare feit is toegebracht.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38f
  - number: 38f.3
    text: De maatregel kan tezamen met straffen en andere maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38f
  - number: 38f.4
    text: |-
      De [artikelen 28][ref1] en [79l][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de toepassing
      van vervangende hechtenis of vervangende jeugddetentie de verplichting ingevolge de maatregel tot schadevergoeding
      ten behoeve van het slachtoffer niet opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel79l
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 79l
  - number: '39'
    text: |-
      Niet strafbaar is hij die een feit begaat dat hem wegens de gebrekkige ontwikkeling of ziekelijke storing zijner
      geestvermogens niet kan worden toegerekend. Blijkt dat het begane feit hem wegens de gebrekkige ontwikkeling of
      ziekelijke storing zijner geestvermogens niet kan worden toegerekend, dan kan de rechter gelasten dat hij in een
      krankzinnigengesticht worde geplaatst gedurende een proeftijd, den termijn van een jaar niet te boven gaande.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel39
  - number: 39a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel39a
  - number: 39b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel39b
  - number: 39c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel39c
  - number: 39d
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel39d
  - number: 41bis
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel41bis
  - number: 41aa
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel41aa
  - number: 41ab
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel41ab
  - number: 41ac
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel41ac
  - number: '42'
    text: Niet strafbaar is hij die een feit begaat waartoe hij door overmacht is gedrongen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel42
  - number: '43.1'
    text: |-
      Niet strafbaar is hij die een feit begaat, geboden door de noodzakelijke verdediging van eigen of eens anders lijf,
      eerbaarheid of goed tegen oogenblikkelijke, wederrechtelijke aanranding.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel43
  - number: '43.2'
    text: |-
      Niet strafbaar is de overschrijding van de grenzen van noodzakelijke verdediging, indien zij het onmiddellijk
      gevolg is geweest van eene hevige gemoedsbeweging, door de aanranding veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel43
  - number: '44'
    text: Niet strafbaar is hij die een feit begaat ter uitvoering van een wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel44
  - number: '45'
    text: |-
      Niet strafbaar is hij die een feit begaat ter uitvoering van een ambtelijk bevel, gegeven door het daartoe bevoegde
      gezag. Een onbevoegd gegeven ambtelijk bevel heft de strafbaarheid niet op, tenzij het door den ondergeschikte te
      goeder trouw als bevoegd gegeven werd beschouwd en de nakoming daarvan binnen den kring zijner ondergeschiktheid
      was gelegen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel45
  - number: '46'
    text: |-
      Indien een ambtenaar door het begaan van een strafbaar feit een bijzonderen ambtsplicht schendt of bij het begaan
      van het strafbaar feit gebruik maakt van macht, gelegenheid of middel hem door zijn ambt geschonken, kan de straf
      met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel46
  - number: 46bis
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel46bis
  - number: '47.1'
    text: |-
      Poging tot misdrijf is strafbaar, wanneer het voornemen van de dader zich door een begin van uitvoering heeft
      geopenbaard.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel47
  - number: '47.2'
    text: Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij poging met een derde verminderd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel47
  - number: '47.3'
    text: |-
      Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel47
  - number: '47.4'
    text: De bijkomende straffen zijn voor poging dezelfde als voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel47
  - number: '48'
    text: Poging tot overtreding is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48
  - number: 48a.1
    text: |-
      Voorbereiding van een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaren of
      meer is gesteld, is strafbaar, wanneer de dader opzettelijk voorwerpen, stoffen, informatiedragers, ruimten of
      vervoermiddelen bestemd tot het begaan van dat misdrijf verwerft, vervaardigt, invoert, doorvoert, uitvoert of
      voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48a
  - number: 48a.2
    text: |-
      In geval van terroristische misdrijven wordt onder voorbereiding tevens begrepen de financiering dan wel poging tot
      financiering van die misdrijven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48a
  - number: 48a.3
    text: Het maximum van de hoofdstraffen op het misdrijf gesteld, wordt bij voorbereiding met de helft verminderd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48a
  - number: 48a.4
    text: |-
      [Artikel 47, derde en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel47
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '47'
  - number: 48a.5
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48a
  - number: 48b
    text: |-
      Voorbereiding noch poging bestaat indien het misdrijf niet is voltooid ten gevolge van omstandigheden van de wil
      van de dader afhankelijk.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel48b
  - number: '49'
    text: 'Als dader van een strafbaar feit worden gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel49
  - number: 49.1°
    text: zij die het feit plegen, doen plegen of medeplegen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel49
  - number: 49.2°
    text: |-
      zij die door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding of door het verschaffen van
      gelegenheid, middelen of inlichtingen het feit opzettelijk uitlokken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel49
  - number: '50'
    text: 'Als medeplichtigen aan een misdrijf worden gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel50
  - number: 50.1°
    text: zij die opzettelijk behulpzaam zijn bij het plegen van het misdrijf;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel50
  - number: 50.2°
    text: zij die opzettelijk gelegenheid, middelen of inlichtingen verschaffen tot het plegen van het misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel50
  - number: '51'
    text: |-
      Het maximum der hoofdstraffen op het misdrijf gesteld wordt bij medeplichtigheid met een derde verminderd. Geldt
      het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten hoogste
      vier en twintig jaren. De hoofdstraf van berisping en de bijkomende straffen zijn voor medeplichtigheid dezelfde
      als voor het misdrijf zelf. Bij het bepalen van de straf komen alleen die handelingen in aanmerking die de
      medeplichtige opzettelijk heeft gemakkelijk gemaakt of bevorderd, benevens hare gevolgen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel51
  - number: '52'
    text: |-
      De persoonlijke omstandigheden waardoor de strafbaarheid uitgesloten, verminderd of verhoogd wordt, komen bij
      de toepassing der strafwet alleen in aanmerking ten aanzien van dien dader of medeplichtige wien zij persoonlijk
      betreffen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel52
  - number: '53.1'
    text: Strafbare feiten worden begaan door natuurlijke personen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: '53.2'
    text: |-
      Indien een strafbaar feit wordt begaan door een rechtspersoon, kan de strafvervolging worden ingesteld en kunnen de
      in de wet voorziene straffen maatregelen, indien zij daarvoor in aanmerking komen, worden uitgesproken:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: 53.2.a
    text: tegen die rechtspersoon dan wel
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: 53.2.b
    text: |-
      tegen hen die tot het feit opdracht hebben gegeven, alsmede tegen hen die feitelijke leiding hebben gegeven aan de
      verboden gedraging, dan wel
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: 53.2.c
    text: tegen de in de onderdelen a en b genoemden tezamen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: '53.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met de rechtspersoon gelijkgesteld: de vennootschap zonder
      rechtspersoonlijkheid, de maatschap, enige andere vereniging van personen, en het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel53
  - number: '54'
    text: Medeplichtigheid aan overtreding is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel54
  - number: '55'
    text: |-
      Bij misdrijven door middel van de drukpers gepleegd wordt de uitgever als zoodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de dader bekend is of op de eerste aanmaning nadat tot het
      instellen van een gerechtelijk vooronderzoek is overgegaan door den uitgever is bekend gemaakt. Deze bepaling
      is niet toepasselijk indien de dader op het tijdstip der uitgave strafrechtelijk niet vervolgbaar of buiten de
      openbare lichamen Bonaire, Sint Eustatius en Saba gevestigd was.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel55
  - number: '56'
    text: |-
      Bij misdrijven door middel van de drukpers gepleegd wordt de drukker als zoodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de persoon op wiens last het stuk is gedrukt, bekend is of op
      de eerste aanmaning nadat tot het instellen van een gerechtelijk vooronderzoek is overgegaan door den drukker is
      bekend gemaakt. Deze bepaling is niet toepasselijk, indien de persoon, op wiens last het stuk is gedrukt, op het
      tijdstip van het drukken strafrechtelijk niet vervolgbaar of buiten de openbare lichamen Bonaire, Sint Eustatius en
      Saba gevestigd was.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel56
  - number: '57'
    text: |-
      Valt een feit in meer dan ééne strafbepaling, dan wordt slechts ééne dier bepalingen toegepast, bij verschil die
      waarbij de zwaarste hoofdstraf is gesteld. Indien voor een feit dat in eene algemeene strafbepaling valt, eene
      bijzondere strafbepaling bestaat, komt deze alleen in aanmerking.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel57
  - number: '58'
    text: |-
      Staan meerdere feiten, ofschoon elk op zichzelf misdrijf of overtreding opleverende, in zoodanig verband dat
      zij moeten worden beschouwd als ééne voortgezette handeling, dan wordt slechts ééne strafbepaling toegepast, bij
      verschil die waarbij de zwaarste hoofdstraf is gesteld. Insgelijks wordt slechts ééne strafbepaling toegepast bij
      schuldigverklaring aan valschheid of muntschennis en aan het gebruik maken van het voorwerp ten opzichte waarvan de
      valschheid of muntschennis gepleegd is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel58
  - number: '59'
    text: |-
      Bij samenloop van meerdere feiten die als op zich zelve staande handelingen moeten worden beschouwd en meerdere
      misdrijven opleveren waarop gelijksoortige hoofdstraffen zijn gesteld, wordt één straf uitgesproken. Het maximum
      dezer straf is het vereenigd bedrag van de hoogste straffen op de feiten gesteld, doch niet hooger dan een derde
      boven het zwaarste maximum.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel59
  - number: '60'
    text: |-
      Bij samenloop van meerdere feiten die als op zich zelve staande handelingen moeten worden beschouwd en meerdere
      misdrijven opleveren, waarop ongelijksoortige hoofdstraffen zijn gesteld, wordt elk dier straffen uitgesproken,
      doch mogen deze te zamen in duur de langstdurende met niet meer dan een derde overtreffen. Geldboeten worden
      daarbij berekend naar den duur van het maximum der bedreigde vervangende hechtenis.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel60
  - number: '61'
    text: |-
      Bij veroordeeling tot levenslange gevangenisstraf kunnen daarnevens geene andere straffen worden opgelegd dan
      ontzetting van bepaalde rechten, verbeurdverklaring van reeds in beslag genomen voorwerpen en openbaarmaking van de
      rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel61
  - number: '62'
    text: |-
      In de gevallen der [artikelen 59][ref1] en [60][ref2] gelden ten aanzien van bijkomende straffen de volgende
      bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel60
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '60'
  - number: 62.1°
    text: |-
      de straffen van ontzetting van dezelfde rechten worden opgelost in ééne straf, in duur de opgelegde hoofdstraf of
      hoofdstraffen ten minste twee en ten hoogste vijf jaren te boven gaande, of ingeval geene andere hoofdstraf dan
      geldboete is opgelegd, in ééne straf van ten minste twee en ten hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel62
  - number: 62.2°
    text: |-
      de straffen van ontzetting van verschillende rechten worden voor elk misdrijf afzonderlijk en zonder vermindering
      opgelegd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel62
  - number: 62.3°
    text: |-
      de straffen van verbeurdverklaring van bepaalde voorwerpen worden voor elk misdrijf afzonderlijk en zonder
      vermindering opgelegd; de vervangende straffen van hechtenis mogen gezamenlijk het maximum, bepaald in
      [artikel 28, derde lid][ref1], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel28
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '28'
  - number: '63'
    text: |-
      De betrekkelijke zwaarte van ongelijksoortige hoofdstraffen wordt bepaald door de volgorde van [artikel 9][ref1].
      Waar den rechter de keuze tussen twee hoofdstraffen is gelaten, komt bij de vergelijking alleen de zwaarste dier
      straffen in aanmerking. De betrekkelijke zwaarte van gelijksoortige hoofdstraffen wordt bepaald door het maximum.
      De betrekkelijke duur zoowel van ongelijksoortige als van gelijksoortige hoofdstraffen wordt eveneens bepaald door
      het maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel9
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '9'
  - number: '64'
    text: |-
      Bij samenloop op de wijze in de [artikelen 59][ref1] en [60][ref2] bedoeld hetzij van overtredingen met misdrijven,
      hetzij van overtredingen onderling, wordt voor elke overtreding zonder vermindering straf opgelegd. De vervangende
      straffen van hechtenis of voorzieningen in de opvoeding mogen voor de misdrijven en overtredingen of voor de
      overtredingen gezamenlijk de maxima, bepaald in [artikel 28, derde lid][ref3], met niet meer dan een derde te boven
      gaan. De straffen van hechtenis, opgelegd als hoofdstraf, mogen voor de overtreding gezamenlijk den tijd van acht
      maanden niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel28
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '28'
  - number: '65'
    text: |-
      Indien iemand, na veroordeeling tot straf, opnieuw wordt schuldig verklaard aan misdrijf of overtreding vóór die
      veroordeeling gepleegd, wordt de vroegere straf in rekening gebracht, met toepassing der bepalingen van deze titel
      voor het geval van gelijktijdige berechting. Indien echter levenslange gevangenisstraf op dit misdrijf is gesteld,
      zal die straf worden opgelegd, welke straf ook vroeger mocht zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel65
  - number: '66'
    text: |-
      Indien een misdrijf dat alleen op klachte vervolgbaar is, gepleegd is tegen iemand die den leeftijd van zestien
      jaren nog niet had bereikt of die anders dan wegens verkwisting onder curateele gesteld is, geschiedt de klachte
      door zijn wettigen vertegenwoordiger in burgerlijke zaken. Is deze de persoon tegen wien de klachte moest
      geschieden, dan kan de vervolging plaats hebben op klachte van een bijzondere curator, van de echtgenoote, van een
      bloedverwant in de rechte linie of, bij gebreke van deze, op klachte van een bloedverwant in de zijlinie tot den
      derden graad ingesloten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel66
  - number: '67'
    text: |-
      Indien hij tegen wien het misdrijf is gepleegd, binnen den in het [volgende artikel][ref1] gestelden termijn
      overlijdt, kan, zonder verlenging van dien termijn, de vervolging geschieden op klachte van de ouders, van de
      kinderen of van den overlevenden echtgenoot, ten ware blijken mocht dat de overledene een vervolging niet gewild
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel68
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '68'
  - number: '68'
    text: |-
      De klachte kan slechts worden ingediend gedurende drie maanden nadat de tot klachte gerechtigde kennis heeft
      bekomen van het gepleegde feit indien hij binnen de openbare lichamen Bonaire, Sint Eustatius en Saba, of gedurende
      negen maanden nadat hij daarvan kennis heeft bekomen, indien hij buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba verblijft houdt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel68
  - number: '69'
    text: Hij die de klachte indient, blijft gedurende eene maand na dan dag der indiening bevoegd haar in te trekken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel69
  - number: '70'
    text: |-
      Behoudens de gevallen waarin rechterlijke uitspraken voor herziening vatbaar zijn, kan niemand andermaal worden
      vervolgd wegens het feit waarover te zijnen aanzien bij gewijsde van de rechter in de openbare lichamen Bonaire,
      Sint Eustatius en Saba, in Curaçao, in Sint Maarten, in Nederland of Aruba, onherroepelijk is beslist. Is het
      gewijsde afkomstig van een anderen rechter, dan heeft tegen denzelfden persoon wegens hetzelfde feit geene
      vervolging plaats in geval van:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel70
  - number: 70.1°
    text: vrijspraak of ontslag van rechtsvervolging;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel70
  - number: 70.2°
    text: veroordeeling, gevolgd door geheele uitvoering, gratie of verjaring der straf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel70
  - number: '71'
    text: Het recht tot strafvordering vervalt door den dood van den verdachte.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel71
  - number: '72'
    text: 'Het recht tot strafvordering vervalt door verjaring:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel72
  - number: 72.1°
    text: in twee jaren voor alle overtredingen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel72
  - number: 72.2°
    text: |-
      in zes jaren voor de misdrijven waarop geldboete, hechtenis of gevangenisstraf van niet meer dan drie jaren is
      gesteld;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel72
  - number: 72.3°
    text: in twaalf jaren voor alle misdrijven waarop tijdelijke gevangenisstraf van meer dan drie jaren is gesteld;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel72
  - number: 72.4°
    text: in achttien jaren voor alle misdrijven waarop levenslange gevangenisstraf is gesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel72
  - number: '73'
    text: |-
      De termijn van verjaring vangt aan op den dag na dien waarop het feit is gepleegd, behoudens in de volgende
      gevallen:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel73
  - number: 73.1°
    text: |-
      bij valschheid of muntschennis vangt de termijn aan op den dag na dien, waarop gebruik is gemaakt van het voorwerp
      ten opzichte waarvan de valschheid of muntschennis gepleegd is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel73
  - number: 73.2°
    text: |-
      bij de misdrijven omschreven in de [artikelen 291][ref1], [292][ref2], [295][ref3], [295a][ref4] en [295ao][ref5],
      op den dag na dien der bevrijding, of van den dood van hem, tegen wien onmiddellijk het misdrijf gepleegd is;


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel291
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel292
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel295
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel295a
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel295ao
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '291'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '292'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '295'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: 295a
      - id: ref5
        bwb_id: BWBR0028570
        artikel: 295ao
  - number: 73.3°
    text: |-
      bij overtredingen omschreven in de [artikelen 489][ref1], [490][ref2] en [491][ref3], op den dag na dien waarop
      de dubbelen of afschriften van de akten, waaruit zoodanige overtreding blijkt, zijn overgebracht naar de centrale
      bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel489
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel490
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel491
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '489'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '490'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '491'
  - number: '74.1'
    text: |-
      Elke daad van vervolging stuit de verjaring, mits die daad den vervolgde bekend of hem op de bij wettelijk
      voorschrift voor gerechtelijke akten bepaalde wijze beteekend zij.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel74
  - number: '74.2'
    text: Na de stuiting vangt een nieuwe verjaringstermijn aan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel74
  - number: '75'
    text: De schorsing der strafvervolging ter zake van een praejudicieel geschil schorst de verjaring.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel75
  - number: '76'
    text: |-
      Het recht tot strafvordering wegens overtredingen, waarop geldboete, hetzij als eenige hoofdstraf, hetzij nevens
      hechtenis is gesteld, vervalt door vrijwillige voldoening aan de voorwaarde welke de bevoegde ambtenaar van het
      openbaar ministerie op vóór den aanvang der terechtzitting in te dienen verzoek van den verdachte of beklaagde ter
      voorkoming van de strafvervolging mocht hebben gesteld. Deze voorwaarde bestaat in: de betaling, binnen een door
      den ambtenaar te bepalen termijn en op eene door dezen aan te wijzen plaats, van eene bepaalde geldsom, met of
      zonder uitlevering van aan verbeurdverklaring onderworpen voorwerpen of voldoening der geschatte waarde of afstand
      van reeds inbeslaggenomen voorwerpen. Zoodanige uitlevering, voldoening of afstand wordt steeds in de voorwaarde
      opgenomen, indien ter zake van het feit verbeurdverklaring zou moeten volgen. Bedoelde termijn kan vóór den afloop
      daarvan eenmaal worden verlengd. De te betalen geldsom bedraagt ten minste USD 0,50 en ten hoogste het maximum der
      boete op het feit gesteld. Is op de overtreding geene andere hoofdstraf gesteld dan geldboete en biedt de verdachte
      of beklaagde aan, binnen den door den ambtenaar van het openbaar ministerie te bepalen termijn het maximum der
      boete te betalen en de aan verbeurdverklaring onderworpen voorwerpen uit te leveren of af te staan of hunne
      geschatte waarde te voldoen, dan zal die ambtenaar het stellen van een daartoe strekkende voorwaarde niet mogen
      weigeren. In de gevallen waarin de straf wordt verhoogd wegens herhaling, is die verhoging ook van toepassing,
      wanneer het recht tot strafvordering wegens de vroeger begane overtreding volgens het eerste lid is vervallen. Ten
      aanzien van de toepassing van de [artikelen 17f][ref1] en [17h][ref2] wordt het vervallen volgens het eerste lid
      van het recht tot strafvordering met een onherroepelijke veroordeling gelijk gesteld. De bepalingen van dit artikel
      zijn mede van toepassing op een persoon die tijdens het begaan van het feit de leeftijd van achttien jaren nog niet
      heeft bereikt. Te diens aanzien geldt, bij toepassing van het derde en vierde lid, in afwijking in zover van het
      daarin bepaalde, als maximum der boete een bedrag van USD 50.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17f
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel17h
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17f
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 17h
  - number: '77'
    text: |-
      Het recht tot uitvoering van de straf vervalt door den dood van den veroordeelde, met uitzondering van de maatregel
      van ontneming van wederrechtelijk verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel77
  - number: '78'
    text: |-
      Het recht tot uitvoering van de straf vervalt door verjaring. De termijn dezer verjaring is een derde langer dan
      de termijn van verjaring van het recht tot strafvordering. In geen geval is de termijn korter dan de duur der
      opgelegde straf. Indien vóór de tenuitvoerlegging van de straf de veroordeelde, die tijdens zijne veroordeeling
      nog geen achttien jaren oud was, den leeftijd van een en twintig jaren heeft bereikt, vordert hij, die met deze
      tenuitvoerlegging is belast, dat de rechter die de straf heeft opgelegd, den duur zal bepalen der gevangenisstraf
      of hechtenis of het bedrag der boete, op het feit gesteld, welke straffen alsdan in de plaats treden der vroeger
      opgelegde. Deze bepaling is niet toepasselijk ten opzichte van de veroordeelde opgelegde gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel78
  - number: '79.1'
    text: |-
      De termijn van verjaring vangt aan op den dag na dien waarop de rechterlijke uitspraak kan worden ten uitvoer
      gelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
  - number: '79.2'
    text: |-
      Bij ontvluchting van een veroordeelde uit het gesticht waarin hij zijne straf ondergaat, vangt een nieuwe
      verjaringstermijn aan op den dag na dien der ontvluchting. Bij herroeping eener voorwaardelijke invrijheidstelling
      vangt een nieuwe verjaringstermijn aan op den dag na dien der herroeping.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
  - number: '79.3'
    text: |-
      De termijn loopt niet gedurende de bij wet bevolen schorsing der tenuitvoerlegging, noch gedurende den tijd dat de
      veroordeelde, zij het ook ter zake van eene andere veroordeeling, in verzekerde bewaring is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
  - number: '79.4'
    text: |-
      Ten aanzien van een persoon, die zich aan de tenuitvoerlegging van het tegen hem uitgesproken bevel, bedoeld bij
      [artikel 41ter][ref1], onttrekt, vangt de termijn van verjaring der hem tevens naar de bepalingen van dat artikel
      opgelegde gevangenisstraf aan op den dag na die waarop hij den leeftijd van een en twintig jaren bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel41ter
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 41ter
  - number: '79.5'
    text: |-
      De termijn loopt niet gedurende de tijd dat de tenuitvoerlegging aan een vreemde staat is overgedragen, zolang
      Onze Minister van Justitie van de autoriteiten van die staat geen mededeling, houdende een beslissing omtrent de
      overname van de tenuitvoerlegging, heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
  - number: '79.6'
    text: |-
      Indien, nadat de tenuitvoerlegging door een vreemde staat is overgenomen, die staat afstand doet van zijn recht
      tot tenuitvoerlegging ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba, vangt een nieuwe
      verjaringstermijn aan op de dag waarop Onze Minister van Justitie de mededeling van de autoriteiten van die staat
      omtrent de afstand heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79
  - number: 79bis
    text: |-
      De voorziening in de opvoeding, ter vervanging van de uitlevering van verbeurdverklaarde voorwerpen, wordt niet
      uitgevoerd, wanneer de veroordeelde door van zijn wil onafhankelijke omstandigheden feitelijk verhinderd is de
      verbeurdverklaarde voorwerpen uit te leveren of het geldelijk bedrag, waarop zij bij de uitspraak geschat worden,
      te betalen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79bis
  - number: 79a
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van twaalf jaren doch nog
      niet die van achttien jaren heeft bereikt, zijn de artikelen in de vorige titels van dit boek van toepassing voor
      zover daarvan niet in deze titel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79a
  - number: 79b.1
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van zestien jaren doch nog
      niet die van achttien jaren heeft bereikt, kan de rechter de [artikelen 79a tot en met 79z][ref1] buiten toepassing
      laten en recht doen overeenkomstig de bepalingen in de voorgaande titels vervat, indien hij daartoe grond vindt
      in de ernst van het begane feit, de persoonlijkheid van de dader alsmede in de omstandigheden waaronder het feit
      is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79a
  - number: 79b.2
    text: Bij toepassing van het eerste lid kan levenslange gevangenisstraf niet worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79b
  - number: 79c
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van het strafbaar feit de leeftijd van achttien jaren
      doch nog niet die van eenentwintig jaren heeft bereikt, kan de rechter, indien hij daartoe grond vindt in de
      persoonlijkheid van de dader of de omstandigheden waaronder het feit is begaan, recht doen overeenkomstig de
      [artikelen 79a tot en met 79z][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79a
  - number: 79d.1
    text: |-
      De verjaringstermijn van het recht tot strafvordering, genoemd in [artikel 72, eerste lid][ref1], wordt ten aanzien
      van misdrijven tot de helft van de daar bedoelde duur ingekort.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel72
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '72'
  - number: 79d.2
    text: |-
      Het recht tot strafvordering voor misdrijven waarop levenslange gevangenisstraf is gesteld, verjaart in twintig
      jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79d
  - number: 79e.1
    text: |-
      De opsporingsambtenaar die daartoe door de officier van justitie is aangewezen, kan na verkregen toestemming door
      de officier van justitie aan de verdachte voorstellen dat deze deelneemt aan een project. De deelneming strekt tot
      voorkoming van toezending van het opgemaakte proces-verbaal aan de officier van justitie. Bij of krachtens algemene
      maatregel van bestuur worden de strafbare feiten aangewezen die op deze wijze kunnen worden afgedaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.2
    text: |-
      Bij een voorstel als bedoeld in het eerste lid deelt de opsporingsambtenaar de verdachte mede dat hij niet
      verplicht is aan het project deel te nemen en licht hem in over de mogelijke gevolgen van niet-deelneming.
      Het voorstel, de mededeling en de inlichtingen over de mogelijke gevolgen worden daarbij de verdachte tevens
      schriftelijk ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.3
    text: |-
      De officier van justitie geeft algemene aanwijzingen omtrent de wijze van afdoening ingevolge het eerste lid. Deze
      aanwijzingen betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.3.a
    text: |-
      de projecten en de categorieën van strafbare feiten die, gelet op de aard van deze projecten, in aanmerking komen
      voor deze wijze van afdoening;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.3.b
    text: de duur van de deelneming, afhankelijk van de aard van het strafbare feit en het project en
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.3.c
    text: de wijze waarop de toestemming van de officier van justitie kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.4
    text: De duur van de deelneming is ten hoogste twintig uren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.5
    text: |-
      De opsporingsambtenaar doet in geval van misdrijf aan de rechtstreeks belanghebbende die hem bekend is, onverwijld
      mededeling van de datum waarop hij die voorstellen heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
  - number: 79e.6
    text: |-
      Indien de opsporingsambtenaar, bedoeld in het eerste lid, van oordeel is dat de verdachte naar behoren aan
      een project heeft deelgenomen, stelt hij de officier van justitie en de verdachte hiervan schriftelijk in
      kennis. Daarmee vervalt het recht tot strafvordering, behalve indien een bevel wordt gegeven als bedoeld in
      [artikel 25 van het Wetboek van Strafvordering BES][ref1]. In dat geval houdt de rechter, indien hij een straf
      oplegt, rekening met de voltooide deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel25
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79e
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '25'
  - number: 79f
    text: |-
      Bij toepassing van [artikel 76][ref1] kan de officier van justitie tevens als voorwaarde stellen dat de verdachte
      zich zal richten naar de aanwijzingen van de reclassering voor een daarbij te bepalen termijn van ten hoogste zes
      maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79f
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '76'
  - number: 79g.1
    text: In plaats van de op een feit gestelde straffen worden de straffen en maatregelen opgelegd, in deze Titel voorzien.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79g
  - number: 79g.2
    text: |-
      Een hoofdstraf kan zowel afzonderlijk als tezamen met een andere hoofdstraf of met bijkomende straffen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79g
  - number: 79g.3
    text: |-
      Een maatregel kan zowel afzonderlijk als tezamen met hoofdstraffen, met bijkomende straffen en met andere
      maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79g
  - number: 79h.1
    text: 'De hoofdstraffen zijn:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.1.a
    text: 'in geval van misdrijf: jeugddetentie of geldboete;'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.1.b
    text: 'in geval van overtreding: geldboete.'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.2
    text: 'De bijkomende straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.2.a
    text: verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.2.b
    text: ontzegging van de bevoegdheid motorrijtuigen te besturen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.2.c
    text: ontzetting van bepaalde rechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.3
    text: 'De maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.3.a
    text: plaatsing in een inrichting voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.3.b
    text: onttrekking aan het verkeer;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.3.c
    text: ontneming van wederrechtelijk verkregen voordeel;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79h.3.d
    text: schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79h
  - number: 79i.1
    text: 'De duur van de jeugddetentie is:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79i
  - number: 79i.1.a
    text: |-
      voor degene die ten tijde van het begaan van het misdrijf de leeftijd van zestien jaren nog niet had bereikt: ten
      minste een dag en ten hoogste twaalf maanden, en
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79i
  - number: 79i.1.b
    text: |-
      overigens ten hoogste vierentwintig maanden, doch voor strafbare feiten waarop een gevangenisstraf van maximaal
      dertig jaren dan wel een levenslange gevangenisstraf is gesteld: ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79i
  - number: 79i.2
    text: De duur van de jeugddetentie wordt in de rechterlijke uitspraak aangewezen in dagen, weken, maanden of jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79i
  - number: 79i.3
    text: |-
      De [artikelen 30][ref1] en [31][ref2] zijn bij veroordeling tot jeugddetentie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel31
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79i
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '31'
  - number: 79j.1
    text: |-
      Indien de straf jeugddetentie is opgelegd, draagt Onze Minister van Justitie de tenuitvoerlegging op aan een door
      Onze Minister van Justitie aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79j
  - number: 79j.2
    text: |-
      De rechter die de straf heeft opgelegd, kan de jeugdige aan wie een jeugddetentie is opgelegd, ambtshalve
      voorwaardelijk in vrijheid stellen. In geval van een voorwaardelijke invrijheidstelling wordt een proeftijd bepaald
      van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79j
  - number: 79j.3
    text: |-
      Bij toepassing van het tweede lid zijn de [artikelen 79p tot en met 79u][ref1] zo veel mogelijk van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79p
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79j
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79p
  - number: 79j.4
    text: |-
      De jeugdige aan wie een jeugddetentie is opgelegd wordt voorwaardelijk in vrijheid gesteld wanneer hij tweederde
      gedeelte daarvan heeft ondergaan. In geval van een voorwaardelijke invrijheidstelling wordt een proeftijd bepaald
      van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79j
  - number: 79k
    text: |-
      De straf van jeugddetentie kan door de rechter die de straf heeft opgelegd op vordering van het openbaar ministerie
      of op verzoek van de veroordeelde geheel of gedeeltelijk worden vervangen door een van de straffen genoemd in
      [artikel 9][ref1] indien de tenuitvoerlegging van de opgelegde straf geheel of gedeeltelijk zou moeten plaatsvinden
      nadat de veroordeelde de leeftijd van achttien jaren heeft bereikt en deze naar het oordeel van de rechter niet
      meer voor een zodanige straf in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel9
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79k
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '9'
  - number: 79l.1
    text: |-
      Het bedrag van de geldboete is ten minste USD 0,50 en ten hoogste USD 280. [Artikel 27b][ref1] is van
      overeenkomstige toepassing met dien verstande dat de rechter bij elke geldboete kan bepalen dat het bedrag in
      gedeelten kan worden voldaan. De rechter stelt daarbij de hoogte van elk van die gedeelten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79l
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 27b
  - number: 79l.2
    text: |-
      De rechter beveelt bij de uitspraak waarbij geldboete wordt opgelegd, dat voor het geval volledige betaling noch
      volledig verhaal van het verschuldigde bedrag volgt, vervangende jeugddetentie zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79l
  - number: 79l.3
    text: |-
      Indien geen of geen volledige betaling van het bedrag van de geldboete heeft plaatsgevonden en geen of geen
      volledig verhaal mogelijk is, kan de rechter die de straf heeft opgelegd het nog te betalen bedrag op vordering van
      het openbaar ministerie vervangen door jeugddetentie. De rechter, die de vervangende jeugddetentie heeft bevolen,
      kan de duur van de eerder opgelegde vervangende jeugddetentie ook wijzigen, tenzij deze reeds is aangevangen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79l
  - number: 79l.4
    text: |-
      Indien de veroordeelde de leeftijd van achttien jaren heeft bereikt, legt de rechter vervangende hechtenis op,
      tenzij naar zijn oordeel de veroordeelde in aanmerking komt voor vervangende jeugddetentie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79l
  - number: 79l.5
    text: |-
      De duur van de vervangende jeugddetentie of vervangende hechtenis is ten minste één dag en ten hoogste drie
      maanden. Voor elke volle USD 28 van de nog te betalen geldboete wordt niet meer dan één dag opgelegd. Door betaling
      van het nog te betalen bedrag vervalt de vervangende jeugddetentie of de vervangende hechtenis.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79l
  - number: 79m.1
    text: De maatregel van plaatsing in een inrichting voor jeugdigen kan worden opgelegd, indien
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.1.a
    text: het een misdrijf betreft waarvoor voorlopige hechtenis is toegelaten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.1.b
    text: |-
      de veiligheid van anderen dan wel de algemene veiligheid van personen of goederen het opleggen van die maatregel
      eist, en
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.1.c
    text: de maatregel in het belang is van een zo gunstig mogelijke verdere ontwikkeling van de verdachte.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.2
    text: |-
      De maatregel kan ook worden opgelegd indien de verdachte het feit wegens de gebrekkige ontwikkeling of ziekelijke
      stoornis van de geestvermogens niet volledig kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.3
    text: |-
      De rechter legt de maatregel slechts op na een daartoe strekkend, met redenen omkleed, gedagtekend en ondertekend
      advies van een of meer gedragsdeskundigen die de betrokkene hebben onderzocht. Indien dit advies eerder dan
      een jaar voor de aanvang van de terechtzitting is gedagtekend kan de rechter hier slechts gebruik van maken met
      instemming van het openbaar ministerie en de verdachte.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.4
    text: |-
      Het derde lid blijft buiten toepassing indien de betrokkene weigert medewerking te verlenen aan het onderzoek dat
      ten behoeve van het advies moet worden verricht. Voor zover mogelijk maken de gedragsdeskundigen gezamenlijk dan
      wel ieder van hen afzonderlijk over de reden van weigering rapport op. De rechter doet zich zoveel mogelijk een
      ander advies of rapport, dat hem over de wenselijkheid of noodzakelijkheid van de oplegging van de maatregel kan
      voorlichten en aan de totstandkoming waarvan de betrokkene wel bereid is om medewerking te verlenen, overleggen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.5
    text: |-
      Indien de maatregel is opgelegd draagt, draagt Onze Minister van Justitie de tenuitvoerlegging op aan een door Onze
      Minister van Justitie aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.6
    text: |-
      De maatregel geldt voor de tijd van twee jaar. De termijn gaat in nadat de rechterlijke uitspraak onherroepelijk is
      geworden. De maatregel vervalt bij het onherroepelijk worden van een rechterlijke uitspraak waarbij de betrokkene
      wederom een dergelijke maatregel wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.7
    text: 'De termijn van de maatregel loopt niet:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.7.a
    text: |-
      gedurende de tijd dat aan de veroordeelde uit anderen hoofde rechtens zijn vrijheid is ontnomen en gedurende de
      tijd dat hij uit zodanige vrijheidsbeneming ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.7.b
    text: |-
      wanneer de veroordeelde zich langer dan een week ongeoorloofd afwezig is uit de plaats die voor de
      tenuitvoerlegging van de maatregel is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
  - number: 79m.8
    text: |-
      De rechter, die de maatregel heeft opgelegd, kan de maatregel te allen tijde, na advies te hebben ingewonnen van
      de reclassering, voorwaardelijk of onvoorwaardelijk beëindigen. De [artikelen 79p tot en met 79u][ref1] zijn zoveel
      mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79p
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79m
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79p
  - number: 79n.1
    text: |-
      De rechter die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de maatregel is opgelegd,
      kan op vordering van het openbaar ministerie de termijn, bedoeld in [artikel 79m, zesde lid][ref1], telkens met
      ten hoogste twee jaren verlengen. Op de vordering tot verlenging dient voor de afloop van de termijn te worden
      beschikt, doch in ieder geval drie maanden na afloop van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79m
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79n
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79m
  - number: 79n.2
    text: |-
      Verlenging van de termijn van de maatregel is slechts mogelijk voor zover de maatregel daardoor de
      duur van vier jaar niet te boven gaat, tenzij de maatregel is opgelegd aan een verdachte als bedoeld in
      [artikel 79m, tweede lid][ref1]. In zodanig geval is verlenging mogelijk voor zover de maatregel de duur van zes
      jaar niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79m
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79n
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79m
  - number: 79n.3
    text: |-
      De verlenging is slechts mogelijk, indien de maatregel is opgelegd ter zake van een misdrijf dat gericht
      is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van één of meer personen.
      [Artikel 79m, eerste lid, onder b en c][ref1], is van overeenkomstige toepassing. De verlenging is niet mogelijk
      indien gebruik is gemaakt van de bevoegdheid, bedoeld in [artikel 79o][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79m
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel79o
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79n
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79m
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 79o
  - number: 79n.4
    text: |-
      [Artikel 79m, derde en vierde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79m
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79n
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79m
  - number: 79o.1
    text: |-
      In geval van veroordeling tot jeugddetentie, vervangende jeugddetentie daaronder niet begrepen, tot geldboete,
      tot plaatsing in een inrichting voor jeugdigen, kan de rechter bepalen dat deze of een gedeelte daarvan, niet zal
      worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79o
  - number: 79o.2
    text: |-
      In geval van veroordeling tot jeugddetentie of in geval van plaatsing in een inrichting voor jeugdigen, met
      toepassing van het eerste lid, kan de rechter tevens geldboete opleggen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79o
  - number: 79p.1
    text: |-
      De rechter die bepaalt dat een door hem opgelegde straf of maatregel niet zal worden ten uitvoer gelegd, stelt
      daarbij een proeftijd vast van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79p
  - number: 79p.2
    text: |-
      De proeftijd gaat in zodra de uitspraak waarbij een bevel als in [artikel 79o][ref1], eerste lid bedoeld is
      gegeven, onherroepelijk is geworden. De bijzondere voorwaarden gelden echter pas indien deze door of vanwege het
      openbaar ministerie aan de veroordeelde in persoon zijn betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79o
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79p
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79o
  - number: 79p.3
    text: De proeftijd loopt niet gedurende de tijd dat de veroordeelde rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79p
  - number: 79q.1
    text: |-
      Toepassing van [artikel 79o][ref1] geschiedt onder de algemene voorwaarde dat de veroordeelde zich voor het einde
      van de proeftijd niet schuldig maakt aan een strafbaar feit. Bovendien kunnen bijzondere voorwaarden, het gedrag
      van de veroordeelde betreffende, worden gesteld. Deze mogen de vrijheid van de veroordeelde zijn godsdienst
      of levensovertuiging te belijden en de staatkundige vrijheid niet beperken. De rechter kan de werking van de
      bijzondere voorwaarden beperken tot een bij de uitspraak te bepalen tijdsduur binnen de proeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79o
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79q
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79o
  - number: 79q.2
    text: |-
      Als bijzondere voorwaarde kan worden gesteld dat de veroordeelde zich zal laten opnemen in een inrichting gedurende
      een door de rechter te bepalen termijn, korter dan de proeftijd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79q
  - number: 79r.1
    text: Met het toezicht op de naleving van de voorwaarden is het openbaar ministerie belast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79r
  - number: 79r.2
    text: |-
      De rechter kan aan de reclassering of, in bijzondere gevallen en na overleg met de reclassering, aan een
      particulier persoon, opdragen aan de veroordeelde ter zake van de naleving van de bijzondere voorwaarden hulp en
      steun te verlenen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79r
  - number: 79r.3
    text: |-
      De rechter kan, indien de veroordeelde ingevolge [artikel 254 van Boek 1 van het Burgerlijk Wetboek BES][ref1]
      onder toezicht is gesteld, aan de gezinsvoogd opdragen aan de veroordeelde ter zake van de naleving van de
      bijzondere voorwaarden hulp en steun te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel254
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79r
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '254'
  - number: 79s.1
    text: |-
      De rechter die de voorwaarde heeft gesteld, kan na ontvangst van een vordering van het openbaar ministerie of op
      verzoek van veroordeelde, de proeftijd verkorten of deze eenmaal verlengen. De verlenging geschiedt met ten hoogste
      één jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79s
  - number: 79s.2
    text: |-
      Evenzo kan de in het eerste lid bedoelde rechter gedurende de proeftijd of gedurende de tijd dat deze is geschorst,
      in de gestelde bijzondere voorwaarden of in de termijn waartoe deze voorwaarden in haar werking binnen de proeftijd
      zijn beperkt, wijziging brengen, deze voorwaarden opheffen, alsnog bijzondere voorwaarden stellen en een opdracht
      als bedoeld in [artikel 79r, tweede en derde lid][ref1], geven, wijzigen of opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79r
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79s
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79r
  - number: 79s.3
    text: |-
      De gewijzigde bijzondere voorwaarden gelden zodra deze door of vanwege het openbaar ministerie aan de veroordeelde
      in persoon zijn betekend.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79s
  - number: 79t.1
    text: |-
      Onverminderd het bepaalde in [artikel 79s][ref1] kan de rechter, indien enige gestelde voorwaarde niet wordt
      nageleefd en hij daartoe termen vindt, na ontvangst van de vordering van het openbaar ministerie:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79s
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79t
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79s
  - number: 79t.1.a
    text: gelasten dat de niet ten uitvoer gelegde straf of maatregel, alsnog zal worden ten uitvoer gelegd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79t
  - number: 79t.1.b
    text: |-
      al of niet onder instandhouding of wijziging van de voorwaarden gelasten dat een gedeelte van de niet ten uitvoer
      gelegde straf of maatregel, alsnog zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79t
  - number: 79t.2
    text: |-
      [Artikel 17f][ref1] is verder van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17f
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79t
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17f
  - number: 79t.3
    text: |-
      [Artikel 79k][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79k
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79t
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79k
  - number: 79u.1
    text: 'Indien op grond van enige bepaling in deze titel door de rechter een beslissing wordt genomen geldt het volgende:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79u
  - number: 79u.1.a
    text: |-
      Indien er sprake is van een vordering van het openbaar ministerie dagvaardt het openbaar ministerie de veroordeelde
      met een met reden omklede vordering. Is door de veroordeelde enig verzoek aan de rechter gericht, dan dagvaardt het
      openbaar ministerie ten spoedigste nadat het verzoekschrift door de griffier in zijn handen is gesteld met een met
      redenen omklede conclusie. Indien de rechter ambtshalve voornemens is zijn beslissing te wijzigen dan dagvaardt het
      openbaar ministerie de veroordeelde ten spoedigste nadat hij daaromtrent vanwege de griffie heeft vernomen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79u
  - number: 79u.1.b
    text: |-
      voor het overige zijn de [artikelen 17i tot en met 17k][ref1] van deze wet alsmede
      [artikel 488 van het Wetboek van Strafvordering BES][ref2] zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel488
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79u
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17i
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '488'
  - number: 79u.2
    text: |-
      Indien de veroordeelde op het tijdstip dat de procedure bedoeld in het eerste lid is ingesteld, de leeftijd van
      achttien jaren nog niet heeft bereikt, zijn daarenboven de [artikelen 488 tot en met 490][ref1], [497][ref2] en
      [498 van het Wetboek van Strafvordering BES][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel488
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel497
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel498
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79u
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '488'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '497'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '498'
  - number: 79u.3
    text: |-
      In afwijking van het in het eerste lid van toepassing verklaarde [artikel 17k][ref1] geldt dat hoger beroep in de
      gevallen van beslissingen op grond van de [artikel 79n][ref2] wel is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17k
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel79n
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79u
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17k
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 79n
  - number: 79v.1
    text: De kosten van jeugddetentie en van plaatsing in een inrichting voor jeugdigen komen ten laste van het rijk.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79v
  - number: 79v.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de tenuitvoerlegging van
      vrijheidsstraffen en vrijheidsbenemende maatregelen als bedoeld in [artikel 79h][ref1] en de rechtspositie van
      jeugdigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79h
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79v
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79h
  - number: 79v.3
    text: |-
      Tevens kunnen daarbij regels worden gesteld voor de verstrekking van overheidswege van een bijdrage in de
      bekostiging van de voorbereiding en uitvoering van projecten als bedoeld in [artikel 79e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel79e
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79v
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 79e
  - number: 79w.1
    text: |-
      De straffen en maatregelen als bedoeld in deze Titel, zijn voor poging, voorbereiding, deelneming en
      medeplichtigheid dezelfde als die voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79w
  - number: 79w.2
    text: |-
      Bij samenloop worden meer feiten die als op zichzelf staande handelingen moeten worden beschouwd, voor de
      toepassing van straffen en maatregelen als één feit aangemerkt. [Artikel 65][ref1] is met betrekking tot straffen
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel65
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel79w
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '65'
  - number: '80'
    text: |-
      Waar van misdrijf in het algemeen of van eenig misdrijf in het bijzonder gesproken wordt, wordt daaronder
      medeplichtigheid aan, poging tot en voorbeiding van dat misdrijf begrepen; voor zoover niet uit eenige bepaling het
      tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80
  - number: 80a.1
    text: |-
      Waar in dit wetboek de bevoegdheid wordt gegeven tot het horen, verhoren of ondervragen van personen, wordt
      daaronder, met uitzondering van bij algemene maatregel van bestuur te bepalen gevallen, mede begrepen horen,
      verhoren of ondervragen per videoconferentie, waarbij een directe beeld- en geluidsverbinding totstandkomt tussen
      de betrokken personen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: 80a.2
    text: |-
      De voorzitter van het college, de rechter, de rechter-commissaris of ambtenaar die met de leiding over het
      horen is belast, beslist of van videoconferentie gebruik gemaakt wordt, waarbij het belang van het onderzoek in
      aanmerking wordt genomen. Alvorens te beslissen wordt de te horen persoon of diens raadsman en in voorkomende
      gevallen de officier van justitie, in de gelegenheid gesteld hun mening kenbaar te maken over de toepassing van
      videoconferentie. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: 80a.3
    text: Tegen de beslissing om van videoconferentie gebruik te maken staat geen afzonderlijk rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: 80a.4
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: 80a.4.a
    text: |-
      de eisen waaraan de techniek van videoconferentie dient te voldoen, onder meer met het oog op de onschendbaarheid
      van vastgelegde waarnemingen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: 80a.4.b
    text: de controle op de naleving van de eisen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel80a
  - number: '81'
    text: |-
      Aanslag tot een feit bestaat, zoodra het voornemen des daders zich door een begin van uitvoering, in den zin van
      [artikel 47][ref1] heeft geopenbaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel47
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '47'
  - number: '82'
    text: Samenspanning bestaat zoodra twee of meer personen overeengekomen zijn om het misdrijf te plegen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82
  - number: 82bis
    text: |-
      Onder omwenteling wordt verstaan het vernietigen of op onwettige wijze veranderen van den grondwettigen
      regeeringsvorm, de orde van troonopvolging of den wettigen regeeringsvorm.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82bis
  - number: 82b
    text: |-
      Onder verboden plaats wordt verstaan iedere plaats die als verboden plaats is aangewezen krachtens de
      [Wet bescherming staatsgeheimen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82b
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 82c
    text: |-
      Onder gegeven waarvan de geheimhouding door het belang van de staat wordt geboden, wordt mede verstaan een gegeven,
      behorende tot of ontleend aan gegevens, hulpmiddelen of materialen of met behulp daarvan verrichte onderzoekingen
      of toegepaste werkmethoden met betrekking tot splijtstoffen waarvoor Onze Minister die het aangaat regels heeft
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82c
  - number: 82d
    text: |-
      Onder gegevens wordt verstaan iedere weergave van feiten, begrippen of instructies, op een overeengekomen wijze,
      geschikt voor overdracht, interpretatie of verwerking door personen of geautomatiseerde werken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82d
  - number: 82e
    text: |-
      Onder geautomatiseerd werk wordt verstaan een inrichting die bestemd is om langs elektronische weg gegevens op te
      slaan, te verwerken en over te dragen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel82e
  - number: '83'
    text: Met het plegen van geweld wordt gelijk gesteld het brengen in een staat van bewusteloosheid of onmacht.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel83
  - number: '84'
    text: |-
      Onder zwaar lichamelijk letsel worden begrepen: ziekte die geen uitzicht op volkomen genezing overlaat,
      voortdurende ongeschiktheid tot uitoefening zijner ambts- of beroepsbezigheden en afdrijving van de vrucht eener
      vrouw. Onder zwaar lichamelijk letsel wordt mede begrepen storing der verstandelijke vermogens die langer dan vier
      weken geduurd heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel84
  - number: 84a
    text: 'Onder terroristisch misdrijf wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel84a
  - number: 84a.1°
