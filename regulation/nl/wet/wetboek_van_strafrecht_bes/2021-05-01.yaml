  - number: 84b
    text: |-
      Onder terroristisch oogmerk wordt verstaan het oogmerk om de bevolking of een deel der bevolking van een land vrees
      aan te jagen, dan wel een overheid of internationale organisatie wederrechtelijk te dwingen iets te doen, niet te
      doen of te dulden, dan wel de fundamentele politieke, constitutionele, economische of sociale structuren van een
      land of een internationale organisatie ernstig te ontwrichten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel84b
  - number: 84c
    text: |-
      Onder misdrijf ter voorbereiding of vergemakkelijking van een terroristisch misdrijf wordt verstaan
      elk van de misdrijven omschreven in de [artikelen 137, tweede lid][ref1], [138, tweede lid][ref2],
      [211, tweede lid][ref3], [230, derde lid][ref4], [298, vierde lid][ref5], [324, eerste lid, onder 6°][ref6],
      [325, tweede lid, onder 2°][ref7], [330, derde lid][ref8] jo. [325, tweede lid, onder 2°][ref9],
      [331, tweede lid][ref10], [335a][ref11], [339, tweede lid][ref12], en [372a, eerste lid][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel138
