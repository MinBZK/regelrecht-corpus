  - number: '500'
    text: |-
      De eigenaar, de rompbevrachter en de schipper van een Nederlands vaartuig, aan boord waarvan personen als
      schepelingen werkzaam zijn in strijd met het verbod van [artikel 506 van het Wetboek van Koophandel BES][ref1],
      worden gestraft met geldboete van de eerste categorie voor iederen persoon, die aldus werkzaam is.


