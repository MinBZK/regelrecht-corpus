  - number: '438'
    text: |-
      De in de [artikelen 273 tot en met 284][ref1], [433][ref2] en [434][ref3] bepaalde straffen kunnen met een derde
      worden verhoogd, indien tijdens het plegen van het misdrijf nog geen vijf jaren zijn verloopen, sedert de schuldige
      eene tegen hem wegens een der in die artikelen omschreven misdrijven uitgesproken gevangenisstraf geheel of ten
      deele heeft ondergaan, of sedert die straf hem geheel is kwijtgescholden, of indien tijdens het plegen van het
      misdrijf het recht tot uitvoering dier straf nog niet is verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel273
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel433
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel434
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel438
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '273'
      - id: ref2
