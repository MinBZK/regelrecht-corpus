        artikel: 372a
  - number: 84d
    text: |-
      Onder een ander, of een kind bij of kort na de geboorte, van het leven beroven wordt begrepen: het doden van een
      vrucht die naar redelijkerwijs verwacht mag worden in staat is buiten het moederlichaam in leven te blijven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel84d
  - number: '85'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel85
  - number: '86'
    text: |-
      Onder ambtenaren worden begrepen alle personen verkozen bij krachtens wettelijk voorschrift uitgeschreven
      verkiezingen. Onder ambtenaren en onder rechters worden begrepen scheidsrechters; onder rechters zij die
      administratieve rechtsmacht uitoefenen. Allen die tot de gewapende macht behooren, worden mede als ambtenaren
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel86
  - number: 86bis
    text: Onder koopman wordt verstaan ieder die een bedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel86bis
  - number: '87.1'
    text: |-
      Onder schipper wordt verstaan: de gezagvoerder van een Nederlands schip of degene die deze vervangt, alsmede degene
      die de leiding heeft op een bij algemene maatregel van bestuur aangewezen installatie ter zee;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel87
  - number: '87.2'
    text: |-
      Onder opvarende wordt verstaan: degene, niet zijnde de schipper, die zich aan boord van een Nederlands schip
      bevindt, ook indien hij buiten de openbare lichamen Bonaire, Sint Eustatius en Saba het schip gedurende de reis
      tijdelijk verlaat alsmede degene, niet zijnde de schipper, die zich op een bij algemene maatregel van bestuur
      aangewezen installatie ter zee bevindt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel87
  - number: '87.3'
    text: |-
      Onder schepeling wordt verstaan: degene die zich als scheepsofficier of scheepsgezel aan boord van een Nederlands
      schip bevindt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel87
  - number: '87.4'
    text: Vaartuigen in aanbouw noch schepen in aanbouw worden als vaartuigen of schepen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel87
  - number: '88'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel88
  - number: '89'
    text: |-
      Onder Nederlandse schepen worden alleen verstaan die vaartuigen welke door de wet betrekkelijk de afgifte van
      zeebrieven en vergunningen tot het voeren der Nederlandsche vlag als zeeschepen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel89
  - number: 89a.1
    text: 'Onder Nederlandse luchtvaartuigen worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel89a
  - number: 89a.1.a
    text: luchtvaartuigen die zijn ingeschreven in Nederlandse luchtvaartregisters;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel89a
  - number: 89a.1.b
    text: |-
      luchtvaartuigen die zonder bemanning zijn verhuurd aan een huurder die de hoofdzetel van zijn bedrijf, of, indien
      de huurder niet een zodanige zetel heeft, zijn vaste verblijfplaats, binnen de openbare lichamen Bonaire, Sint
      Eustatius en Saba heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel89a
  - number: 89a.2
    text: |-
      Een luchtvaartuig is in vlucht van het moment af waarop alle buitendeuren, na het instappen, zijn gesloten tot het
      moment waarop een van de deuren wordt geopend voor het uitstappen. In geval van een noodlanding wordt de vlucht
      geacht voort te duren totdat de bevoegde autoriteiten de verantwoordelijkheid voor het luchtvaartuig en voor de
      personen en goederen aan boord overnemen. Een luchtvaartuig is in bedrijf van het begin van het gereedmaken van dat
      luchtvaartuig voor een bepaalde vlucht door het grondpersoneel of door de bemanning tot het moment dat sedert de
      landing 24 uren verstreken zijn. De periode tijdens welke het luchtvaartuig in bedrijf is strekt zich in elk geval
      uit tot de gehele periode tijdens welke het luchtvaartuig in vlucht is, zoals omschreven in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel89a
  - number: '90'
    text: |-
      Onder vijand worden begrepen opstandelingen. Onder oorlog wordt begrepen burgeroorlog. Onder tijd van oorlog wordt
      begrepen de tijd waarin oorlog dreigende is. Tijd van oorlog wordt mede geacht te bestaan zodra dienstplichtigen
      buitengewoon in werkelijke dienst worden opgeroepen en zolang zij buitengewoon in werkelijke dienst worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel90
  - number: 90a
    text: |-
      Onder een bevriende staat wordt verstaan een buitenlandse mogendheid waarmee het Koninkrijk der Nederlanden niet in
      een gewapend conflict is gewikkeld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel90a
  - number: 90b.1
    text: |-
      Onder internationaal beschermd persoon wordt verstaan een persoon die valt onder de omschrijving van artikel 1,
      eerste lid, van het Verdrag inzake de voorkoming en bestraffing van misdrijven tegen internationaal beschermde
      personen, met inbegrip van diplomaten van 14 december 1973 (Trb. 1981, 69).
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel90b
  - number: 90b.2
    text: |-
      Onder internationaal beschermd persoon wordt mede verstaan een persoon die valt onder de omschrijving van artikel
      1, onderdeel a of b, van het Verdrag inzake de veiligheid van VN-personeel en geassocieerd personeel van 9 december
      1994 (Trb. 1996, 62), zoals aangevuld door het Facultatief Protocol van 8 december 2005 (Trb. 2006, 211).
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel90b
  - number: 90b.3
    text: |-
      Onder beschermde goederen worden verstaan de goederen, bedoeld in artikel 2, eerste lid, onderdeel b, van het in
      het eerste lid genoemde verdrag en artikel 9, eerste lid, onderdeel b, van het in het tweede lid genoemde verdrag.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel90b
  - number: '91'
    text: Onder dag wordt verstaan een tijd van vier en twintig uren, onder maand een tijd van dertig dagen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel91
  - number: '92'
    text: Onder nacht wordt verstaan de tijd tusschen half zeven uur des avonds en half zes uur des morgens.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel92
  - number: '93'
    text: |-
      Onder inklimming wordt begrepen ondergraving, alsmede het overschrijden van slooten of grachten tot afsluiting
      dienende.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel93
  - number: '94'
    text: Onder valsche sleutels worden begrepen alle tot opening van het slot niet bestemde werktuigen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel94
  - number: '95'
    text: Onder vee worden verstaan paarden, ezels, muilezels, muildieren, runderen, schapen, bokken, geiten en varkens.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95
  - number: 95bis
    text: |-
      Onder opkooper wordt verstaan hij die van opkoopen een beroep of eene gewoonte maakt. Onder opkoopen worden
      begrepen alle handelingen, hoe ook genaamd, waarmede kenlijk hetzelfde wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95bis
  - number: 95ter
    text: |-
      Onder electriciteitswerken worden verstaan werken dienende tot voortbrenging, geleiding, transformatie of
      levering van electriciteit en daarmede in verband staande beveiligings-, bevestigings-, ondersteunings- en
      waarschuwingswerken. Onder electriciteitswerken worden niet begrepen telegraaf en telefoonwerken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95ter
  - number: 95c
    text: |-
      Onder discriminatie wordt verstaan elke vorm van onderscheid, elke uitsluiting, beperking of voorkeur, die ten
      doel heeft of ten gevolge kan hebben, dat de erkenning, het genot of de uitoefening op voet van gelijkheid van de
      rechten van de mens en de fundamentele vrijheden op politiek, economisch, sociaal of cultureel terrein of op andere
      terreinen van het openbare leven, wordt tenietgedaan of aangetast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95c
  - number: 95d.1
    text: |-
      Onder telecommunicatie, telecommunicatie-infrastructuur en gegevensverkeer wordt verstaan hetgeen daaronder wordt
      verstaan in [artikel 1 van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95d
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '1'
  - number: 95d.2
    text: Onder aftappen wordt verstaan hetgeen wordt verstaan in artikel 167 van het Wetboek van Strafvordering BES.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel95d
  - number: '96'
    text: |-
      De bepalingen der [eerste acht Titels van dit Boek][ref1] zijn ook toepasselijk op feiten waarop bij andere wetten
      of verordeningen straf is gesteld, tenzij de wet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '97'
    text: |-
      De aanslag ondernomen met het oogmerk om den Koning, de regeerende Koningin of den Regent van het leven of de
      vrijheid te berooven of tot regeeren ongeschikt te maken, wordt gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel97
  - number: '98'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel98
  - number: '99'
    text: |-
      De aanslag ondernomen met het oogmerk om het grondgebied van den Staat geheel of gedeeltelijk onder vreemde
      heerschappij te brengen of om een deel daarvan af te scheiden, wordt gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel99
  - number: 99bis
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de Raad van Ministers uiteenjaagt, tot het nemen
      of niet nemen van enig besluit dwingt, een lid uit die vergadering verwijdert of opzettelijk een lid verhindert
      die vergadering bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel99bis
  - number: '100'
    text: |-
      De aanslag, ondernomen met het oogmerk om omwenteling teweeg te brengen, wordt gestraft met gevangenisstraf van ten
      hoogste vijftien jaren. Leiders en aanleggers van een aanslag als in het eerste lid bedoeld, worden gestraft met
      levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel100
  - number: '101'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel101
  - number: '102'
    text: |-
      De samenspanning tot een der in de [artikelen 97][ref1], [99][ref2], [99bis][ref3] en [100][ref4] omschreven
      misdrijven wordt gestraft met gevangenisstraf van ten hoogste tien jaren. Dezelfde straf is toepasselijk op hem,
      die met het oogmerk om een der in de artikelen 97, 99, 99bis en 100 omschreven misdrijven voor te bereiden of te
      bevorderen:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel99bis
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel100
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 99bis
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '100'
  - number: 102.1°
    text: |-
      een ander tracht te bewegen om het misdrijf te plegen, te doen plegen of mede te plegen, om daarbij behulpzaam te
      zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
  - number: 102.2°
    text: gelegenheid, middelen of inlichtingen tot het plegen van het misdrijf zich of anderen tracht te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
  - number: 102.3°
    text: voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van het misdrijf;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
  - number: 102.4°
    text: |-
      plannen voor de uitvoering van het misdrijf, welke bestemd zijn om aan anderen te worden medegedeeld, in gereedheid
      brengt of onder zich heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
  - number: 102.5°
    text: |-
      eenigen maatregel vanwege de Regering genomen om de uitvoering van het misdrijf te voorkomen of te onderdrukken,
      tracht te beletten, te belemmeren of te verijdelen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel102
  - number: '103'
    text: |-
      Hij die met een buitenlandsche mogendheid in verstandhouding treedt, met het oogmerk om haar tot het plegen van
      vijandelijkheden of tot het voeren van oorlog tegen den Staat te bewegen, haar in het daartoe opgevatte voornemen
      te versterken, haar hulp daarbij toe te zeggen of bij de voorbereiding hulp te verlenen, wordt gestraft met
      gevangenisstraf van ten hoogste vijftien jaren. Indien de vijandelijkheden worden gepleegd of de oorlog uitbreekt,
      wordt levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel103
  - number: 103a
    text: 'Met gevangenisstraf van ten hoogste vijf jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel103a
  - number: 103a.1°
    text: |-
      hij, die met een in het buitenland gevestigd persoon of lichaam in verstandhouding treedt, met het oogmerk om een
      zoodanig persoon of lichaam tot het verschaffen van steun aan het voorbereiden, bevorderen of teweegbrengen van
      omwenteling te bewegen, om een zoodanig persoon of lichaam in het daartoe opgevatte voornemen te versterken of aan
      een zoodanig persoon of lichaam daarbij hulp toe te zeggen of te verleenen, of om omwenteling voor te bereiden, te
      bevorderen of teweeg te brengen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel103a
  - number: 103a.2°
    text: |-
      hij, die eenig voorwerp invoert, dat geschikt is tot het verschaffen van stoffelijken steun aan het voorbereiden,
      bevorderen of teweegbrengen van omwenteling, indien hij weet of ernstige reden heeft om te vermoeden, dat het
      daartoe bestemd is:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel103a
  - number: 103a.3°
    text: |-
      hij, die eenig voorwerp onder zich heeft of tot onderwerp eener overeenkomst maakt, dat geschikt is tot het
      verschaffen van stoffelijken steun aan het voorbereiden, bevorderden of teweegbrengen van omwenteling, indien
      hij weet of ernstige reden heeft om te vermoeden, dat het daartoe bestemd is en dat het voorwerp of eenig ander
      voorwerp, waarvoor het in de plaats is getreden, hetzij met die bestemming is ingevoerd, hetzij door of vanwege een
      in het buitenland gevestigd persoon of lichaam daartoe is bestemd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel103a
  - number: '104'
    text: |-
      Hij die enig gegeven, waarvan de geheimhouding door het belang van de staat wordt geboden, daaronder begrepen
      enig voorwerp, waaraan een zodanig gegeven kan worden ontleend, opzettelijk mededeelt aan of ter beschikking stelt
      van een tot kennisneming daarvan niet gerechtigd persoon of lichaam, wordt, indien hij weet of redelijkerwijs
      moet vermoeden, dat het een zodanig gegeven betreft, gestraft met gevangenisstraf van ten hoogste zes jaren. Met
      dezelfde straf wordt gestraft hij die enig gegeven, dat van een verboden plaats afkomstig is en tot de veiligheid
      van de staat in betrekking staat, daaronder begrepen enig voorwerp, waaraan een zodanig gegeven kan worden
      ontleend, opzettelijk mededeelt aan of ter beschikking stelt van een tot kennisneming daarvan niet gerechtigd
      persoon of lichaam, indien hij weet of redelijkerwijs moet vermoeden dat het een zodanig gegeven betreft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104
  - number: 104a
    text: |-
      Hij die enig gegeven als bedoeld in [artikel 104][ref1] hetzij opzettelijk openbaar maakt, hetzij zonder daartoe
      gerechtigd te zijn opzettelijk mededeelt aan of ter beschikking stelt van een buitenlandse mogendheid, een in
      het buitenland gevestigd persoon of lichaam, dan wel een zodanig persoon of lichaam, dat gevaar ontstaat dat
      het gegeven aan een buitenlandse mogendheid of aan een in het buitenland gevestigd persoon of lichaam bekend
      wordt, wordt, indien hij weet of redelijkerwijs moet vermoeden, dat het een zodanig gegeven betreft, gestraft met
      gevangenisstraf van ten hoogste vijftien jaren. Indien de schuldige heeft gehandeld in tijd van oorlog dan wel in
      dienst of in opdracht van een buitenlandse mogendheid of van een in het buitenland gevestigd persoon of lichaam,
      kan levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren worden opgelegd. Handelingen gepleegd
      ter voorbereiding van een misdrijf als omschreven in de voorgaande leden worden gestraft met gevangenisstraf van
      ten hoogste zes jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel104
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '104'
  - number: 104b
    text: |-
      Hij aan wiens schuld te wijten is, dat enig gegeven als bedoeld in [artikel 104][ref1] openbaar wordt gemaakt dan
      wel ter beschikking komt van een tot kennisneming daarvan niet gerechtigd persoon of lichaam, wordt gestraft met
      gevangenisstraf of hechtenis van ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel104
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '104'
  - number: 104c.1
    text: 'Met gevangenisstraf van ten hoogste zes jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104c
  - number: 104c.1.1°
    text: |-
      hij die opzettelijk enig gegeven als bedoeld in [artikel 104][ref1], zonder daartoe gerechtigd te zijn, onder zich
      neemt of houdt;


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel104
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '104'
  - number: 104c.1.2°
    text: |-
      hij die enige handeling verricht, ondernomen met het oogmerk om, zonder daartoe gerechtigd te zijn, de beschikking
      te krijgen over enig gegeven als bedoeld in [artikel 104][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel104
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '104'
  - number: 104c.1.3°
    text: |-
      hij die tersluik, onder een vals voorgeven, door middel van een vermomming of langs een andere dan de gewone
      toegang op of in een verboden plaats komt of tracht te komen, aldaar in dier voege aanwezig is, of zich op een van
      die wijzen of door een van die middelen vandaar verwijdert of tracht te verwijderen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel104c
  - number: '105'
    text: |-
      Hij die eene hem vanwege de Regering opgedragen onderhandeling met eene buitenlandsche mogendheid opzettelijk ten
      nadeele van den Staat voert, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel105
  - number: '106'
    text: 'Met gevangenisstraf van ten hoogste tien jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106
  - number: 106.1°
    text: |-
      hij die in geval van een oorlog, waarin het Koninkrijk niet betrokken is, opzettelijk enige handeling verricht,
      waardoor het gevaar ontstaat, dat de Staat in een oorlog wordt betrokken, of enig van regeringswege gegeven en
      bekend gemaakt bijzonder voorschrift tot handhaving van het niet deelnemen aan de oorlog opzettelijk overtreedt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106
  - number: 106.2°
    text: |-
      hij die in tijd van oorlog, enig voorschrift van regeringswege in het belang van de veiligheid van de Staat gegeven
      en bekend gemaakt, opzettelijk overtreedt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106
  - number: 106a
    text: |-
      [Artikel 106 onder 1°][ref1] vindt overeenkomstige toepassing in geval van een gewapend conflict, dat niet als
      oorlog kan worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel106
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '106'
  - number: 106b.1
    text: |-
      Hij die op enigerlei wijze opzettelijk van het grondgebied van de openbare lichamen Bonaire, Sint Eustatius en Saba
      gebruik maakt bij het voorbereiden, bevorderen, teweegbrengen of uitvoeren van hetzij een gewelddadige omwenteling
      op het grondgebied van een bevriende mogendheid, hetzij enige andere tegen een dergelijke mogendheid of haar
      regering gerichte illegale actie, wordt gestraft met gevangenisstraf van ten hoogste tien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106b
  - number: 106b.2
    text: |-
      Hij aan wiens schuld te wijten is dat van het grondgebied van de openbare lichamen Bonaire, Sint Eustatius en Saba
      op enigerlei wijze gebruik wordt gemaakt bij enige handeling als bedoeld in het voorgaande lid wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106b
  - number: 106b.3
    text: |-
      Onder het grondgebied van de openbare lichamen Bonaire, Sint Eustatius en Saba wordt voor de toepassing van dit
      artikel mede verstaan de territoriale zee rond en het luchtruim boven de openbare lichamen Bonaire, Sint Eustatius
      en Saba.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106b
  - number: 106b.4
    text: |-
      Met gelijke straf en naar de onderscheiding, gemaakt in het eerste en tweede lid van dit artikel wordt gestraft de
      ingezetene van de openbare lichamen Bonaire, Sint Eustatius en Saba, die deelneemt aan een poging tot gewelddadige
      omwenteling op het grondgebied van een bevriende mogendheid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel106b
  - number: '107'
    text: |-
      De Nederlander die vrijwillig in krijgsdienst treedt bij eene buitenlandsche mogendheid, wetende dat deze met
      het Koninkrijk in oorlog is of in het vooruitzicht van een oorlog met het Koninkrijk, wordt, in het laatste geval
      indien de oorlog uitbreekt, gestraft met gevangenisstraf van ten hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel107
  - number: '108'
    text: |-
      Met gevangenisstraf van ten hoogste vijftien jaren wordt gestraft hij die opzettelijk, in tijd van oorlog, den
      vijand hulp verleent of den Staat tegenover den vijand benadeelt. Levenslange gevangenisstraf of tijdelijke van
      ten hoogste twintig jaren wordt toegepast indien de dader: 1°. eenige kaart, plan, teekening of beschrijving van
      militaire werken of eenige inlichting betreffende militaire bewegingen of ontwerpen den vijand mededeelt of in
      handen speelt; 2°. als verspieder den vijand dient of een verspieder des vijands opneemt, verbergt of voorthelpt.
      Levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren wordt toegepast indien de dader: 1°. eenige
      versterkte of bezette plaats of post, eenig middel van gemeenschap, eenig magazijn, eenigen krijgsvoorraad, enige
      krijgskas of enige verboden plaats, of wel de vloot of het leger of eenig deel daarvan aan den vijand verraadt,
      in ‘s vijands macht brengt, vernielt of onbruikbaar maakt, of eenige tot afweer of aanval beraamde of uitgevoerde
      onderwaterzetting of ander militair werk belet, belemmert of verijdelt; 2°. hetzij oproer, hetzij muiterij of
      desertie onder het krijgsvolk teweegbrengt of bevordert,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel108
  - number: '109'
    text: |-
      De samenspanning tot een der in [artikel 108][ref1] omschreven misdrijven wordt gestraft met gevangenisstraf van
      ten hoogste vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel108
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '108'
  - number: '110'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren wordt gestraft hij die, in tijd van oorlog, zonder oogmerk om den
      vijand hulp te verleenen of den Staat tegenover den vijand te benadeelen, opzettelijk:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel110
  - number: 110.1°
    text: een verspieder des vijands opneemt, verbergt of voorthelpt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel110
  - number: 110.2°
    text: desertie van een krijgsman, in dienst van het Koninkrijk teweegbrengt of bevordert.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel110
  - number: '111'
    text: |-
      Hij die in tijd van oorlog eenige bedriegelijke handeling pleegt bij levering van benoodigdheden ten dienste van de
      krijgsmacht, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren. Met dezelfde straf wordt gestraft hij
      die, met het opzicht over de levering der goederen belast, de bedriegelijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel111
  - number: '112'
    text: |-
      Bij veroordeeling wegens het in [artikel 97][ref1] omschreven misdrijf kan ontzetting van de in [artikel 32][ref2],
      N°. 1–4, vermelde rechten worden uitgesproken. Bij veroordeeling wegens een der in de [artikelen 99–109][ref3]
      omschreven misdrijven, kan ontzetting van de in artikel 32, N°. 1–3, vermelde rechten worden uitgesproken.
      Bij veroordeeling wegens het in [artikel 111][ref4] omschreven misdrijf, kan de schuldige worden ontzet van de
      uitoefening van het beroep waarin hij het misdrijf begaan heeft en van de in artikel 32, N°. 1–4, vermelde rechten,
      en kan de openbaarmaking van de rechterlijke uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel111
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '99'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '111'
  - number: '113'
    text: |-
      De straffen gesteld op de in de [artikelen 108–111][ref1] omschreven feiten, zijn toepasselijk indien een dier
      feiten wordt gepleegd tegen of met betrekking tot de bondgenooten van den Staat in een gemeenschappelijken oorlog.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel108
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '108'
  - number: 113a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 101, eerste lid][ref1], [102, eerste en tweede lid][ref2], is
      begaan met een terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft
      verhoogd en wordt, indien op het misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld,
      levenslange gevangenisstraf of tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel102
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '102'
  - number: '114.1'
    text: |-
      De aanslag op het leven of de vrijheid van de niet-regeerende Koningin, van den troonopvolger, of van een lid van
      het Koninklijk huis, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel114
  - number: '114.2'
    text: |-
      Indien de aanslag op het leven den dood tengevolge heeft of met voorbedachten rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel114
  - number: '115'
    text: |-
      Elke feitelijke aanranding van den persoon des Konings of der Koningin, die niet valt in eene zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel115
  - number: '116'
    text: |-
      Elke feitelijke aanranding van den persoon van den troonopvolger, van een lid van het Koninklijk huis, of van
      den Regent, die niet valt in eene zwaardere strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel116
  - number: '117'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel117
  - number: '122'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 114][ref1], [115][ref2] en [116][ref3] omschreven misdrijven, kan
      ontzetting van de in [artikel 32][ref4], N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '114'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '115'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '116'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 122a.1
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 114][ref1], is begaan met een terroristisch oogmerk, wordt de
      schuldige gestraft met levenslange of tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel114
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '114'
  - number: 122a.2
    text: |-
      Indien een misdrijf, strafbaar gesteld in de [artikelen 115][ref1] en [116][ref2], is begaan met een terroristisch
      oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel116
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '116'
  - number: 122b
    text: |-
      De samenspanning tot de in [artikel 114][ref1] omschreven misdrijven, te begaan met een terroristisch oogmerk,
      wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel114
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel122b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '114'
  - number: '123'
    text: |-
      De aanslag op het leven of de vrijheid van een regeerend vorst of ander hoofd van een bevrienden Staat wordt
      gestraft met gevangenisstraf van ten hoogste vijftien jaren. Indien de aanslag op het leven den dood tengevolge
      heeft of met voorbedachten rade wordt ondernomen, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste
      twintig jaren opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel123
  - number: '124'
    text: |-
      Elke feitelijk aanranding van den persoon van een regeerend vorst of ander hoofd van een bevrienden Staat, die niet
      valt in eene zwaardere strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel124
  - number: 124a.1
    text: |-
      De aanslag op het leven of de vrijheid van een internationaal beschermd persoon wordt gestraft met gevangenisstraf
      van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel124a
  - number: 124a.2
    text: |-
      Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachten rade wordt ondernomen, kan
      levenslange gevangenisstraf of tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel124a
  - number: 124b
    text: |-
      Elke feitelijke aanranding van de persoon van een internationaal beschermd persoon, die niet valt in een zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel124b
  - number: 124c
    text: |-
      Hij die opzettelijk geweld pleegt tegen de beschermde goederen van een internationaal beschermd persoon
      wordt, indien daardoor gevaar voor de veiligheid of de vrijheid van die persoon te duchten is, gestraft met
      gevangenisstraf van ten hoogste zeven jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel124c
  - number: '128'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 123][ref1] en [124][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 32][ref3], N° 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '124'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 128a.1
    text: |-
      Indien een misdrijf, strafbaar gesteld in de [artikelen 123, eerste lid][ref1], [124a][ref2] en [124c][ref3] is
      begaan met een terroristisch oogmerk, wordt de schuldige gestraft met levenslange gevangenisstraf of tijdelijke van
      ten hoogste vierentwintig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel124a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel124c
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 124a
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 124c
  - number: 128a.2
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 124b][ref1], is begaan met een terroristisch oogmerk, wordt de
      in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel124b
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 124b
  - number: 128b
    text: |-
      De samenspanning tot de in [artikel 123, eerste lid][ref1], [124a][ref2] en [124c][ref3] omschreven misdrijven, te
      begaan met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel124a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel124c
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel128b
    references:
