  - number: '6'
    text: 'De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel6
  - number: 6.1°
    text: |-
      de ambtenaar van de openbare lichamen Bonaire, Sint Eustatius en Saba die zich buiten de openbare lichamen schuldig
      maakt aan een der misdrijven omschreven in [Titel XXVIII van het Tweede Boek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel6
    references:
      - id: ref1
