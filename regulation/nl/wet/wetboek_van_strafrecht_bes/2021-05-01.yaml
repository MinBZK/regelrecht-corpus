  - number: 438a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel438a
  - number: 438b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel438b
  - number: '439.1'
    text: |-
      Baldadigheid tegen personen of goederen, waardoor gevaar, nadeel of ongerief kan worden teweeggebracht, wordt
      gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel439
  - number: '439.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen jaar is verloopen, sedert eene vroegere veroordeeling van den
      schuldige wegens gelijke overtreding onherroepelijk is geworden, wordt hij gestraft met hechtenis van ten hoogste
      drie dagen of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel439
  - number: '440'
    text: 'Met hechtenis van ten hoogste zes dagen of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel440
  - number: 440.1°
    text: |-
      hij die een dier aanhitst op een mensch, op een dier dat bereden wordt of op een dier dat voor een rij- of voertuig
      gespannen is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel440
  - number: 440.2°
    text: |-
      hij die een onder zijne hoede staand dier, wanneer het een mensch, een dier dat bereden wordt of een dier dat voor
      een rij- of voertuig gespannen is, aanvalt, niet terughoudt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel440
  - number: 440.3°
    text: hij die geene voldoende zorg draagt voor het onschadelijk houden van een onder zijne hoede staand gevaarlijk dier.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel440
  - number: '441'
    text: |-
      Hij die, belast met het toezicht over een krankzinnige, gevaarlijk voor zich zelven of voor anderen, dezen zonder
      opzicht laat rondwaren, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel441
  - number: '442.1'
    text: |-
      Hij die, terwijl hij in staat van dronkenschap verkeert, hetzij in het openbaar het verkeer belemmert of de orde
      verstoort, hetzij eens anders veiligheid bedreigt, hetzij eenige handeling verricht waarbij, tot voorkoming van
      gevaar voor leven of gezondheid van derden, bijzondere omzichtigheid of voorzorgen worden vereischt, wordt gestraft
      met hechtenis van ten hoogste zes dagen of een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel442
  - number: '442.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen jaar is verloopen, sedert eene vroegere veroordeeling van den
      schuldige wegens gelijke of de in* [artikel 474][ref1] omschreven overtreding onherroepelijk is geworden, wordt hij
      gestraft met hechtenis van ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel474
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '474'
  - number: '443'
    text: |-
      Hij die wederrechtelijk op den openbaren weg een ander in zijne vrijheid van beweging belemmert of met een of meer
      anderen zich aan een ander tegen diens uitdrukkelijk verklaarden wil blijft opdringen of hem op hinderlijke wijze
      blijft volgen, wordt gestraft met hechtenis van ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel443
  - number: '444'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel444
  - number: 444.1°
    text: |-
      hij die niet zorgt dat eene door hem of op zijn last op een openbaren weg gedane op- of uitgraving of een door
      hem of op zijn last op den openbaren weg geplaatst voorwerp behoorlijk verlicht en van de gebruikelijke teekenen
      voorzien is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel444
  - number: 444.2°
    text: |-
      hij die bij eene verrichting op of aan den openbaren weg niet de noodige maatregelen neemt om voorbijgangers tegen
      mogelijk gevaar te waarschuwen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel444
  - number: 444.3°
    text: |-
      hij die iets plaatst op of aan, of werpt of uitgiet uit een gebouw op zoodanige wijze dat door of ten gevolge
      daarvan iemand die van den openbaren weg gebruik maakt, nadeel kan ondervinden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel444
  - number: 444.4°
    text: |-
      hij die op den openbaren weg een rij-, trek- of lastdier laat staan, zonder de noodige voorzorgsmaatregelen tegen
      het aanrichten van schade te hebben genomen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel444
  - number: '445'
    text: |-
      Hij die zonder verlof van het bevoegd gezag eenigen openbaren land- of waterweg verspert of het verkeer daarop
      belemmert, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel445
  - number: '446'
    text: |-
      Hij die zonder verlof van de gezaghebber een of meer eigen onroerende zaken of een eigen vaartuig in brand steekt,
      wordt gestraft met geldboete van de eerste categorie. Deze bepaling is niet van toepassing op het buiten Willemstad
      in brand steken van boomen of gewassen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel446
  - number: '447'
    text: 'Met hechtenis van ten hoogste zes weken of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel447
  - number: 447.1°
    text: hij die zonder genoegzame voorzorg vuur op de zeestranden aanbrengt of achterlaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel447
  - number: 447.2°
    text: |-
      hij die zonder genoegzame voorzorg vuur op terreinen van anderen, niet vallende onder die sub 1° bedoeld, aanbrengt
      of achterlaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel447
  - number: '447.3'
    text: |-
      hij die zonder genoegzame voorzorg vuur op eigen onbebouwd terrein aanbrengt of achterlaat; Onder eigen terrein
      wordt hier begrepen terrein waarvan hij, door wien of op wiens last het vuur is aangebracht of achtergelaten, recht
      van gebruik of genot heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel447
  - number: 447.4°
    text: hij die zonder noodzaak vuur in of nabij beplantingen van anderen aanbrengt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel447
  - number: '448'
    text: 'Met hechtenis van ten hoogste veertien dagen of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448
  - number: 448.1°
    text: |-
      hij die een vuurwapen afschiet, een vuurwerk ontsteekt of een vuur aanlegt, voedt of onderhoudt op zoo korten
      afstand van gebouwen of goederen dat daardoor brandgevaar kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448
  - number: 448.2°
    text: hij die een luchtbol oplaat, waarvan brandende stoffen gehecht zijn;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448
  - number: 448.3°
    text: hij die door gebrek aan de noodige omzichtigheid of voorzorg gevaar voor bosch- of grasbrand doet ontstaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448
  - number: 448.4°
    text: |-
      hij die zich zodanig gedraagt dat gevaar voor het luchtverkeer wordt veroorzaakt of kan worden veroorzaakt of dat
      het verkeer in de lucht wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448
  - number: 448a.1
    text: |-
      Hij die voorwerpen binnen een gesticht of een afdeling daarvan waarop de [Wet beginselen gevangeniswezen BES][ref1]
      van toepassing is, brengt of tracht te brengen waarvan het bezit binnen dat gesticht of die afdeling verboden is,
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028596
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448a
    references:
      - id: ref1
        bwb_id: BWBR0028596
  - number: 448a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die niet overeenkomstig de daarvoor geldende regels voorwerpen binnen een
      gesticht of afdeling als bedoeld in het eerste lid brengt of tracht te brengen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448a
  - number: 448bis
    text: |-
      Hij die op eene van den openbaren weg zichtbare plaats woorden of afbeeldingen stelt of gesteld houdt, die, als
      smalende Godslasteringen, voor godsdienstige gevoelens krenkend zijn, wordt gestraft met hechtenis van ten hoogste
      eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448bis
  - number: 448b.1
    text: |-
      Hij die in de uitoefening van een ambt, beroep of bedrijf personen discrimineert wegens hun ras, hun godsdienst,
      hun levensovertuiging, hun geslacht of hun hetero- of homoseksuele gerichtheid wordt gestraft met hechtenis van ten
      hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448b
  - number: 448b.2
    text: |-
      Met dezelfde straf wordt gestraft hij wiens handelen of nalaten in de uitoefening van een ambt, beroep of bedrijf
      zonder redelijke grond, ten doel heeft of ten gevolge kan hebben dat ten aanzien van personen met een lichamelijke,
      psychische of verstandelijke handicap de erkenning, het genot of de uitoefening op voet van gelijkheid van de
      rechten van de mens en de fundamentele vrijheden op politiek, economisch, sociaal of cultureel terrein of op andere
      terreinen van het maatschappelijk leven, wordt teniet gedaan of aangetast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448b
  - number: 448c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448c
  - number: 448d
    text: |-
      Hij die zonder daartoe gerechtigd te zijn, zich op een verboden plaats bevindt, wordt gestraft met hechtenis van
      ten hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel448d
  - number: '449'
    text: |-
      Hij die zonder verlof van het bevoegd gezag eene opneming doet, eene teekening of beschrijving maakt van eenig
      militair werk, of die openbaar maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel449
  - number: '450'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel450
  - number: 450.1°
    text: hij die burengerucht verwekt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel450
  - number: 450.2°
    text: hij die rumoer verwekt waardoor de nachtrust kan worden verstoord;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel450
  - number: 450.3°
    text: |-
      hij die in de nabijheid van gebouwen voor eene geoorloofde godsdienstoefening of voor rechtspraak bestemd,
      tijdens er dienst wordt gedaan of zitting wordt gehouden, rumoer maakt waardoor de dienst of de zitting kan worden
      verstoord.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel450
  - number: '451'
    text: 'Met hechtenis van ten hoogste zes weken wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel451
  - number: 451.1°
    text: als schuldig aan bedelarij, hij die in het openbaar bedelt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel451
  - number: 451.2°
    text: als schuldig aan landlooperij, hij die zonder middelen van bestaan rondzwerft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel451
  - number: 451.3°
    text: hij die als souteneur uit de ontucht van eene vrouw voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel451
  - number: '452'
    text: |-
      Bedelarij of landlooperij, gepleegd door drie of meer personen boven den leeftijd van zestien jaren, wordt gestraft
      met hechtenis van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel452
  - number: '453'
    text: |-
      Indien tijdens het plegen van een der in de twee vorige artikelen omschreven overtredingen nog geen jaar is
      verloopen sedert eene vroegere veroordeeling van den schuldige wegens eene van die overtredingen onherroepelijk is
      geworden, kan de straf worden verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel453
  - number: '454'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454
  - number: 454.1°
    text: |-
      hij die zonder daartoe gerechtigd te zijn een Nederlandschen adellijken titel voert of een Nederlandsch ordeteeken
      draagt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454
  - number: 454.2°
    text: |-
      hij die zonder ‘s Konings verlof, waar dit vereischt wordt, een vreemd ordeteeken, titel, rang of waardigheid
      aanneemt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454
  - number: 454.3°
    text: hij die, door het bevoegd gezag naar zijn naam wordt gevraagd, een valschen naam opgeeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454
  - number: 454a
    text: |-
      Hij die in het openbaar kleedingstukken of onderscheidingsteekenen draagt of voert, welke uitdrukking zijn van een
      bepaald staatkundig streven, wordt gestraft met een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454a
  - number: 454b
    text: |-
      Hij, die zonder daartoe gerechtigd te zijn, gebruik maakt van woorden, uitdrukkingen of kentekenen, die aanduiden
      of de indruk wekken, dat zij optreden is bevorderd dan wel de steun of de erkenning geniet van rijkswege, vanwege
      een openbaar lichaam, vanwege Nederland een buitenlandse mogendheid of een volkenrechtelijke organisatie, wordt
      gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454b
  - number: 454c
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt van het roode kruis teken of van de woorden «Rode Kruis»
      of «Kruis van Genève», of van daarmede door de wetten en gebruiken van de oorlog gelijkgestelde tekens of woorden,
      wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel454c
  - number: '455'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt, zij het ook met eene geringe afwijking, van een naam
      of van een onderscheidingsteeken, waarvan het gebruik krachtens wettelijk voorschrift uitsluitend aan eenige
      vereniging of aan het personeel van eenige vereeniging of aan het personeel van den geneeskundigen dienst des
      legers is toegekend, wordt gestraft met hechtenis van ten hoogste eene maand of een geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel455
  - number: 455bis
    text: |-
      De bestuurder of commissaris van eene naamloze vennootschap, eene besloten vennootschap of een ander in haar
      dienst, die in strijd handelt met eenige wettelijk voorschrift betreffende de vermelding van den naam, de plaats
      van vestiging of het kapitaal der vennootschap, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel455bis
  - number: 455ter
    text: |-
      De bestuurder van eene naamloze vennootschap of eene besloten vennootschap, die niet voldoet aan enige hem bij
      [Boek 2 van het Burgerlijk Wetboek BES][ref1] opgelegde verplichting betreffende het register van aandeelhouders,
      wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel455ter
    references:
      - id: ref1
        bwb_id: BWBR0028744
  - number: 455quater
    text: |-
      De bestuurder van een naamloze vennootschap, of besloten vennootschap die niet voldoet aan eenige hem bij
      [Boek 2 van het Burgerlijk Wetboek BES][ref1] opgelegde verplichting betreffende het opmaken van de balans en
      de winst- en verliesrekening met toelichting, de openbaarmaking of nederlegging ter inzage van enig stuk, of de
      aankondiging van dergelijke nederlegging, wordt gestraft met hechtenis van ten hoogste twee jaar of geldboete van
      de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel455quater
    references:
      - id: ref1
        bwb_id: BWBR0028744
  - number: 455quinquies
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel455quinquies
  - number: '456'
    text: |-
      Hij die, niet toegelaten tot de uitoefening van een beroep, waartoe bij wet eene toelating wordt gevorderd, buiten
      noodzaak dat beroep uitoefent, wordt gestraft met geldboete van de eerste categorie. Hij die, toegelaten tot de
      uitoefening van een beroep waartoe bij wet eene toelating wordt gevorderd, buiten noodzaak in de uitoefening van
      dat beroep de grenzen zijner bevoegdheid overschrijdt, wordt gestraft met geldboete van de eerste categorie. Indien
      tijdens het plegen van een overtreding nog geen twee jaren zijn verloopen, sedert eene vroegere veroordeeling
      van den schuldige wegens gelijke overtreding onherroepelijk is geworden, kan, in plaats van de geldboete, in het
      geval van het eerste lid hechtenis van ten hoogste twee maanden, in het geval van het tweede lid hechtenis van ten
      hoogste eene maand worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel456
  - number: '457'
    text: |-
      Met hechtenis van ten hoogste veertien dagen of geldboete van de eerste categorie wordt gestraft de goud- of
      zilversmid, kashouder, horlogemaker, rijwielhandelaar, uitdrager, opkooper of tagrijn:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457
  - number: 457.1°
    text: |-
      die geen doorlopend register houdt of in het door hem gehouden niet onverwijld aantekeningen houdt van alle door
      hem gekochte, ingeruilde, als geschenk aangenomen, of in pand, gebruik of bewaring genomen goederen, of daarin niet
      onverwijld vermeldt de koopprijs of andere voorwaarden van verkrijging, de namen en woonplaatsen dergenen van wie
      degenen uit wier handen de goederen zijn verkregen, of die nalaat dat register op eerste aanvrage ter inzage te
      vertonen aan de gezaghebber of een door hem aangewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457
  - number: 457.2°
    text: die enig bij algemene maatregel van bestuur, gegeven voorschrift omtrent het daarvan te houden register overtreedt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457
  - number: 457bis
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft de goud- of
      zilversmid, kashouder, horlogemaker, rijwielhandelaar, uitdrager, opkooper of tagrijn:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.1°
    text: |-
      die eenig voorwerp koopt, inruilt, als geschenk aanneemt of in pand, gebruik of bewaring neemt van of uit handen
      van een kind dat den leeftijd van achttien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.2°
    text: |-
      die eenig voorwerp koopt, inruilt, als geschenk aanneemt of in pand, gebruik of bewaring neemt van of uit
      handen van iemand van wie hij weet of redelijkerwijs moet vermoeden dat hij is opgenomen in een strafinrichting,
      opvoedingsgesticht, weeshuis of krankzinnigengesticht;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.3°
    text: |-
      die eenig voorwerp koopt, inruilt, als geschenk aanneemt of in pand, gebruik of bewaring neemt van of uit handen
      van een hem onbekend persoon, tenzij blijkt dat diens naam en woonplaats juist zijn opgegeven of dat de opgaven
      betreffende diens naam en woonplaats redelijkerwijs als juist mochten worden aanvaard;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.4°
    text: |-
      die nalaat behoorlijke voorzorgsmaatregelen te nemen of behoorlijk toezicht te oefenen of te doen oefenen, om te
      voorkomen dat een voor hem handelende persoon een feit begaat als onder n°. 1–3 omschreven;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.5°
    text: |-
      voor of door wien eenig voorwerp dat hij hem door of vanwege justitie of politie met duidelijke omschrijving
      schriftelijk als door misdrijf aan den rechthebbende onttrokken of verloren is aangegeven, wordt verkocht,
      ingeruild, als geschenk aangenomen of in pand, gebruik of bewaring genomen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.6°
    text: |-
      die aan een hem schriftelijk uitgereikten last van of vanwege de gezaghebber tot het gedurende een daarbij
      aangegeven tijd, veertien dagen niet te boven gaande, bewaren of in bewaring gegeven van eenig voorwerp dat hij
      onder zich heeft, of aan eene hem hij dien last gegeven aanwijzing geen gevolg geeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457bis.7°
    text: |-
      die nalaat de van hem bij schriftelijke vordering van of vanwege de gezaghebber gevraagde opgaven betreffende door
      hem gekochte, ingeruilde, als geschenk aangenomen of in pand, gebruik, genomen goederen binnen den termijn, bij de
      vordering gesteld, naar waarheid te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457bis
  - number: 457ter
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft hij die van opkoopen
      een beroep of eene gewoonte maakt, zonder daarvan te voren de gezaghebber of een door hem aangewezen ambtenaar
      schriftelijk in kennis te hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel457ter
  - number: '458'
    text: |-
      Hij die er zijn beroep van maakt aan personen nachtverblijf te verschaffen en geen doorloopend register houdt, of
      nalaat in dat register aan te teekenen of te doen aanteekenen de namen, beroep of betrekking, woonplaats, dag van
      aankomst en van vertrek van de personen, die een nacht in zijn huis hebben doorgebracht, of die nalaat dat register
      op aanvrage te vertoonen, aan de gezaghebber of aan den door dezen aangewezen ambtenaar, wordt gestraft met
      geldboete van de eerste categorie. Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verloopen,
      sedert eene vroegere veroordeeling van den schuldige wegens gelijke overtreding onherroepelijk is geworden, kan, in
      plaats van geldboete, hechtenis van ten hoogste zes dagen wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel458
  - number: '459'
    text: 'Met hechtenis van ten hoogste eene maand of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel459
  - number: 459.1°
    text: |-
      hij die van een krijgsman beneden den rang van officier goederen behoorende tot de kleeding, uitrusting of
      wapening koopt, inruilt, als geschenk aanneemt, in pand, gebruik of bewaring neemt, of zoodanige goederen voor een
      krijgsman beneden den rang van officier verkoopt, ruilt, ten geschenke, in pand, gebruik of bewaring geeft, zonder
      schriftelijke vergunning door of vanwege den bevelvoerenden officier afgegeven;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel459
  - number: 459.2°
    text: |-
      hij die, een gewoonte makende van het koopen van zoodanige goederen, de bij algemene maatregel van bestuur, gegeven
      voorschriften omtrent het daarvan te houden register niet naleeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel459
  - number: '460'
    text: |-
      Hij die drukwerken of andere voorwerpen in een vorm die ze op munt- of bankbiljetten, op muntspeciën, op van
      rijksmerken voorziene platina, gouden of zilveren werken, op postzegels of op reisdocumenten, identiteitsbewijzen
      als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1] of andere identiteitsbewijzen die afgegeven
      zijn door een dienst of organisatie van vitaal of nationaal belang Nederlandse identiteitskaarten of vervangende
      Nederlandse identiteitskaarten doet gelijken, vervaardigt, verspreidt of ter verspreiding in voorraad heeft, wordt
      gestraft met een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel460
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '461'
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft hij die den inhoud
      van hetgeen door middel van een onder zijn beheer staand of door hem gebruikt ontvangtoestel voor draadloze
      telegrafie of telefonie is opgevangen en, naar hij redelijkerwijs moet vermoeden, niet voor hem of voor het
      publiek bestemd is, hetzij aan een ander mededeelt, indien hij redelijkerwijs moet vermoeden, dat dan openlijke
      bekendmaking van den inhoud volgen zal en zoodanige bekendmaking volgt, hetzij openlijk bekend maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel461
  - number: 461a
    text: |-
      Hij die openlijk of door verspreiding van enig geschrift ongevraagd een voorwerp als verkrijgbaar dan wel als bij
      hem voorhanden aanwijst en daarbij de aandacht vestigt op de geschiktheid daarvan als technisch hulpmiddel voor het
      heimelijk afluisteren, aftappen of opnemen van gesprekken, telecommunicatie of andere gegevensoverdracht door een
      geautomatiseerd werk of als onderdeel van zulk een hulpmiddel, wordt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel461a
  - number: '462'
    text: 'Met hechtenis van ten hoogste drie maanden wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel462
  - number: 462.1°
    text: |-
      hij die, surseance van betaling verkregen hebbende, eigenmachtig daden verricht, waartoe de medewerking van
      bewindvoerders bij wet wordt gevorderd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel462
  - number: 462.2°
    text: |-
      de bestuurder of commissaris eener vennootschap, vereniging of stichting, welke surseance van betaling verkregen
      heeft, die eigenmachtig daden verricht, waartoe de medewerking van bewindvoerders bij wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel462
  - number: '463'
    text: |-
      Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, wederrechtelijk wegblijft, wordt gestraft
      met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel463
  - number: '464'
    text: |-
      Hij die, in zaken van minderjarigen of onder curateele te stellen of gestelde personen of van hen die in een
      krankzinnigengesticht zijn opgenomen, als bloedverwant, aangehuwde,* echtgenoot, voogd, curator, voor den rechter
      geroepen om te worden gehoord, noch in persoon noch, waar dit is toegelaten, door tusschenkomst van een gemachtigde
      verschijnt, zonder geldige reden van verschooning, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel464
  - number: '465'
    text: |-
      Hij die, bij het bestaan van gevaar voor de algemeene veiligheid van personen of goederen of bij ontdekking van
      een misdrijf op heeter daad, het hulpbetoon weigert dat de openbare macht van hem vordert en waartoe hij, zonder
      zich aan dadelijk gevaar bloot te stellen, in staat is, wordt gestraft met geldboete van de eerste categorie.
      Deze bepaling is, ingeval van gevorderd hulpbetoon bij ontdekking van een misdrijf op heeter daad, niet van
      toepassing op hem die dat hulpbetoon weigert ten einde gevaar van vervolging te ontgaan of af te wenden van een
      zijner bloedverwanten of aangehuwden in rechte linie, of in den tweeden of derden graad der zijlinie, of van zijn
      echtgenoot of gewezen echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel465
  - number: 465a
    text: 'Met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft hij, die:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel465a
  - number: 465a.1°
    text: |-
      nadat hij een bevoegdheid als bedoeld in [artikel 522, eerste lid, van het Wetboek van Strafvordering BES][ref1]
      heeft uitgeoefend, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel522
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel465a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '522'
  - number: 465a.2°
    text: |-
      nadat hem buiten de openbare lichamen Bonaire, Sint Eustatius en Saba een aangehouden verdachte of een
      inbeslaggenomen voorwerp is overgeleverd, dan wel
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel465a
  - number: 465a.3°
    text: |-
      nadat hij buiten de openbare lichamen Bonaire, Sint Eustatius en Saba op last van de officier van justitie een
      persoon heeft aangehouden, niet onverwijld en op de snelst mogelijke wijze de officier van justitie kennis geeft
      van de gegevens, bedoeld in [artikel 522, tweede en derde lid, van het Wetboek van Strafvordering BES][ref1], of
      nalaat te trachten ten spoedigste aanwijzing van de officier van justitie te verkrijgen als bedoeld in het derde
      lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel522
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel465a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '522'
  - number: '466'
    text: |-
      Hij die eene bekendmaking, vanwege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466
  - number: 466a
    text: 'Met geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466a
  - number: 466a.1°
    text: |-
      hij die niet of niet behoorlijk voldoet aan enige verplichting, opgelegd in [artikel 195][ref1] in verband met
      de [artikelen 192][ref2] en [178, derde lid, van Boek 8 van het Burgerlijk Wetboek BES][ref3] of in de algemene
      maatregel van bestuur, bedoeld in [artikel 231 van dat wetboek][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel192
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel178
      [ref4]: https://wetten.overheid.nl/BWBR0028753#Artikel231
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466a
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '195'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '192'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: '178'
      - id: ref4
        bwb_id: BWBR0028753
        artikel: '231'
  - number: 466a.2°
    text: |-
      hij die het brandmerk, de benaming of kentekens op een teboekstaand schip, voorgeschreven in de onder 1° genoemde
      algemene maatregel van bestuur, verwijdert, verandert dan wel onduidelijk of onzichtbaar maakt op een andere wijze
      dan volgens de algemene maatregel van bestuur, geoorloofd is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466a
  - number: 466a.3°
    text: |-
      hij die niet of niet behoorlijk voldoet aan de verplichting, opgelegd in
      [artikel 1304, tweede lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1], of aan enige verplichting, opgelegd in
      een algemene maatregel van bestuur, uitgevaardigd krachtens [artikel 1321 van dat wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel1304
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel1321
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466a
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '1304'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '1321'
  - number: 466b
    text: |-
      Hij die een reisdocument, een identiteitsbewijs als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1]
      of een ander identiteitsbewijs dat afgegeven is door een dienst of organisatie van vitaal of nationaal belang,
      dat hij voorhanden heeft, waarvan hij niet de houder is, of dat ingevolge een wettelijke bepaling moet worden
      ingeleverd, niet terstond wanneer hem dit mondeling door een daartoe bevoegde ambtenaar is bevolen, danwel binnen
      veertien dagen, nadat hem dit bij aangetekend schrijven in persoon is medegedeeld, inlevert, wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466b
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: 466c
    text: |-
      Hij die, anders dan door valsheid in geschrift, aan degene door wie of door wiens tussenkomst enige verstrekking
      of tegemoetkoming wordt verleend, gegevens verstrekt die naar hij weet of redelijkerwijze moet vermoeden niet met
      de waarheid in overeenstemming zijn, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op die verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466c
  - number: 466d
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, nalaat tijdig de
      benodigde gegevens te verstrekken, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel466d
  - number: '467'
    text: |-
      Hij die niet voldoet aan eene wettelijke verplichting tot aangifte aan den ambtenaar van den burgerlijken stand
      voor de registers van geboorte of overlijden, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel467
  - number: '468.1'
    text: |-
      De bedienaar van den godsdienst die, voordat partijen hem hebben doen blijken dat haar huwelijk ten overstaan van
      den ambtenaar van den burgerlijken stand is voltrokken, eenige godsdienstige plechtigheid daartoe betrekkelijk
      verricht, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel468
  - number: '468.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verloopen, sedert eene vroegere veroordeeling
      van den schuldige wegens gelijke overtreding onherroepelijk is geworden, kan, in plaats van de geldboete, hechtenis
      van ten hoogste twee maanden worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel468
  - number: '469'
    text: |-
      Hij die, getuige van het oogenblikkelijk levensgevaar waarin een ander verkeert, nalaat dezen die hulp te verleenen
      of te verschaffen die hij hem, zonder gevaar voor zich zelven of anderen redelijkerwijs te kunnen duchten,
      verleenen of verschaffen kan, wordt, indien de dood van den hulpbehoevende volgt, gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel469
  - number: '470'
    text: 'Met hechtenis van ten hoogste zes dagen of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel470
  - number: 470.1°
    text: hij die in het openbaar of op eene openbaren weg zichtbare plaats ongekleed of niet voldoende gekleed verschijnt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel470
  - number: 470.2°
    text: hij die in het openbaar voor de eerbaarheid aanstootelijke woorden uit;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel470
  - number: 470.3°
    text: |-
      hij die op eene van den openbaren weg zichtbare plaats voor de eerbaarheid aanstootelijke woorden of teekeningen
      stelt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel470
  - number: '471'
    text: |-
      Met hechtenis van ten hoogste twee maanden of geldboete van de eerste categorie wordt gestraft: 1°. hij die op
      of aan plaatsen, voor openbaar verkeer bestemd, eenig geschrift, waarvan de leesbaarheid gestelde titel, omslag
      of inhoud geschikt is om de zinnelijkheid van de jeugd te prikkelen, of eenige afbeeldingen of eenig voorwerp,
      geschikt om zinnelijkheid van de jeugd te prikkelen, openlijk ten toon stelt, aanbiedt of aanslaat; 2°. hij die
      op of aan plaatsen, voor openbaar verkeer bestemd, de inhoud van eenig geschrift, geschikt om de zinnelijkheid van
      de jeugd te prikkelen, openlijk ten gehore brengt. Met dezelfde straf wordt gestraft: 1°. hij die eenig geschrift,
      eenige afbeelding of eenig voorwerp, geschikt om de zinnelijkheid van de jeugd te prikkelen aan een minderjarige
      aanbiedt, blijvend of tijdelijk afstaat, in handen geeft of vertoont; 2°. hij die de inhoud van een zoodanig
      geschrift in tegenwoordigheid van een minderjarige ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel471
  - number: '472'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel472
  - number: '474'
    text: |-
      Hij die zich in kenlijken staat van dronkenschap op den openbaren weg bevindt, wordt gestraft met geldboete de
      eerste categorie. Indien tijdens het plegen van de overtreding nog geen jaar is verloopen, sedert eene vroegere
      veroordeeling van den schuldige wegens gelijke of de in [artikel 442][ref1] omschreven overtreding onherroepelijk
      is geworden, wordt hij gestraft met hechtenis van ten hoogste drie dagen of geldboete van de eerste categorie. Bij
      tweede herhaling binnen een jaar nadat de eerste veroordeeling wegens herhaling onherroepelijk geworden is, wordt
      hechtenis van ten hoogste twee weken opgelegd. Bij derde of volgende herhalingen gepleegd telkens binnen een jaar
      nadat de laatste veroordeeling wegens tweede of volgende herhaling onherroepelijk geworden is, wordt hechtenis
      opgelegd van ten hoogste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel442
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '442'
  - number: '475'
    text: |-
      De verkoper van alcoholhoudende drank of zijn vervanger die in de uitoefening van het beroep aan iemand beneden de
      achttien jaren alcoholhoudende drank toedient of verkoopt, wordt gestraft met hechtenis van ten hoogste zes maanden
      of een geldboete van de tweede catgorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel475
  - number: '476'
    text: |-
      Hij die zonder vergunning van de bevoegde autoriteit, indien vereist, leenhuizen op pand of zekerheid opricht of
      houdt of zich niet houdt aan de voorwaarden, hem bij of na het geven der vergunning opgelegd, wordt gestraft met
      hechtenis van ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel476
  - number: '477'
    text: |-
      Met hechtenis van ten hoogste een maand of geldboete van de eerste categorie wordt gestraft: 1°. hij die nodeloos
      een dier pijn of letsel veroorzaakt, nodeloos een dier kwelt of nodeloos de gezondheid van een dier benadeelt;
      2°. hij die nodeloos aan een dier, dat geheel of ten dele aan hem toebehoort en onder zijn toezicht staat, of
      aan een dier, tot welks verzorging hij verplicht is, de nodige verzorging onthoudt. Tot de in het voorgaande lid
      strafbaar gestelde feiten wordt gerekend: a. een dier arbeid doen verrichten, welke kennelijk zijn krachten te
      boven gaat of waartoe het uit hoofde van zijn toestand ongeschikt is; b. een dier vervoeren of doen vervoeren
      zonder dit het nodige levensonderhoud te verschaffen of te doen verschaffen; c. het castreren van een dier anders
      dan door een dierenarts of door een persoon, die daartoe bevoegd verklaard is door of vanwege het bestuurscollege
      van het eilandgebied binnen welke de castratie wordt uitgevoerd; d. rundvee vervoeren, terwijl het is aangebonden
      met een halstouw of een hoorntouw, anders dan aan de hand; e. bij verlossing van een koe een krachttoestel of
      dierlijke trekkracht gebruiken; f. een hond als trekkracht gebruiken; g. de oorschelpen van een hond verkleinen;
      h. de staartwervelkolom van een paard verkorten; i. in de snuit van een varken een ander voorwerp dan een gladde
      en roestvrije agrave aan te brengen of aangebracht te laten. Het dier kan, indien het de schuldige toebehoort,
      worden verbeurdverklaard. Indien tijdens het plegen van de overtreding nog geen drie jaren zijn verlopen, sedert
      een vroegere veroordeling van de schuldige wegens een der strafbare feiten, omschreven in dit artikel of in
      [artikel 265][ref1], onherroepelijk is geworden, kan hechtenis van ten hoogste drie maanden worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel265
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '265'
  - number: 477bis
    text: |-
      Met hechtenis van ten hoogste twee weken of geldboete van de eerste categorie wordt gestraft, hij, die anders dan
      krachtens vergunning ingevolge [artikel 1a van de Wet hazardspelen BES I][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0028450#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel477bis
    references:
      - id: ref1
        bwb_id: BWBR0028450
        artikel: 1a
  - number: 477bis.1°
    text: hanengevecht houdt of gelegenheid tot het houden van hanengevecht geeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel477bis
  - number: 477bis.2°
    text: het publiek gelegenheid tot het bijwonen van hanengevecht geeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel477bis
  - number: '478'
    text: |-
      Hij die gebruik maakt van eene in strijd met de bepaling van [artikel 266][ref1] opengestelde gelegenheid tot
      hazardspel, wordt gestraft met geldboete van de eerste categorie. Indien tijdens het plegen van de overtreding
      nog geen twee jaren zijn verloopen sedert eene vroegere veroordeeling van den schuldige wegens gelijke overtreding
      onherroepelijk is geworden, kan in plaats van de geldboete hechtenis van ten hoogste eene maand worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel266
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel478
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '266'
  - number: '479'
    text: |-
      Hij die zijn bedrijf maakt van waarzeggen, voorspellen of droomen uitleggen wordt gestraft met hechtenis van ten
      hoogste drie dagen of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel479
  - number: '480'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, zijn niet-uitvliegend pluimgedierte laat loopen in tuinen of op een
      eenigen grond die bezaaid, bepoot of beplant is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel480
  - number: '481'
    text: |-
      Hij die, die zonder daartoe gerechtigd te zijn, vee laat loopen in tuinen, op eenig weiland, op eenigen grond die
      hetzij bezaaid, bepoot of beplant is, hetzij ter bezaaiing, bepoting of beplanting is gereedgemaakt of waarvan de
      oogst nog niet is weggehaald, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel481
  - number: '482'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, loopt of rijdt op eenigen grond die bezaaid, bepoot of beplant is, of
      die ter bezaaiing, bepoting of beplanting is gereedgemaakt of op eenig weiland, wordt gestraft met geldboete van de
      eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel482
  - number: '483'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, over eens anders grond waarvan de toegang op eene voor hem blijkbare
      wijze door den rechthebbende is verboden, loopt, rijdt of vee laat loopen, wordt gestraft met geldboete van de
      eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel483
  - number: '484'
    text: |-
      De ambtenaar, bevoegd tot de uitgifte van afschriften of uittreksels van vonnissen, die zoodanig afschrift of
      uittreksel uitgeeft alvorens het vonnis behoorlijk is onderteekend, wordt gestraft met geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel484
  - number: '485'
    text: |-
      De ambtenaar die zonder verlof van het bevoegd gezag afschrift maakt of uittreksel neemt van geheime
      overheidsbescheiden of die bekend maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of een geldboete
      van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel485
  - number: '486'
    text: |-
      Met hechtenis van ten hoogste twee maanden of geldboete van de eerste categorie wordt gestraft de gewezen ambtenaar
      die zonder verlof van het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel486
  - number: 486.1°
    text: overheidsbescheiden onder zich houdt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel486
  - number: 486.2°
    text: afschriften maakt of uittreksels neemt van geheime overheidsbescheiden of die bekend maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel486
  - number: '487'
    text: |-
      Het hoofd van een gesticht, bestemd tot opsluiting van veroordeelden, voorloopig aangehoudenen of gegijzelden, of
      van een opvoedingsgesticht of krankzinnigengesticht, die iemand in het gesticht opneemt of houdt, zonder zich het
      bevel van de bevoegde macht of de rechtelijke uitspraak te hebben laten vertoonen, of die nalaat van deze opneming
      en van het bevel of de uitspraak op grond waarvan zij geschiedt, in zijne registers de vereischte inschrijving te
      doen, wordt gestraft met hechtenis van ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel487
  - number: '489'
    text: |-
      De ambtenaar van den burgerlijken stand die nalaat vóór de voltrekking van een huwelijk zich de bewijsstukken of
      verklaringen te laten geven die door enig wettelijk voorschrift worden gevorderd, wordt gestraft met geldboete van
      de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel489
  - number: '490'
    text: |-
      De ambtenaar van den burgerlijken stand die in strijd handelt met eenig wettelijk voorschrift of voorschrift
      omtrent de registers of de akten van den burgerlijken stand of omtrent de formaliteiten voor of bij voltrekking van
      een huwelijk, wordt gestraft met een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel490
  - number: '491'
    text: |-
      De ambtenaar van den burgerlijken stand die nalaat eene akte in de registers in te schrijven of eene akte op een
      los blad schrijft, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel491
  - number: 491a
    text: |-
      Hij die het bepaalde bij [artikel 541 van het Wetboek van Strafvordering BES][ref1] overtreedt wordt gestraft met
      hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel541
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel491a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '541'
  - number: '492'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel492
  - number: 492.1°
    text: |-
      de ambtenaar van den burgerlijken stand die nalaat het bevoegd gezag de opgaven te doen die eenig wettelijk
      voorschrift van hem vordert;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel492
  - number: 492.2°
    text: |-
      de ambtenaar die nalaat aan den ambtenaar van den burgerlijken stand de opgaven te doen die eenig wettelijk
      voorschrift van hem vordert.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel492
  - number: 492a
    text: |-
      Onder ambtenaar van de burgerlijke stand wordt ten aanzien van de [artikelen 490–492][ref1] verstaan een ieder
      die ingevolge enig wettelijk voorschrift met de bewaring van een register van de burgerlijke stand is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel490
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel492a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '490'
  - number: '493'
    text: |-
      De schipper van een Nederlands vaartuig, die vertrekt alvorens de bij wet vereiste monsterrol is opgemaakt en
      geteekend, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel493
  - number: '494'
    text: |-
      De schipper van een Nederlands vaartuig die niet alle door of krachtens wettelijke bepalingen gevorderde
      scheepspapieren, boeken, bescheiden of andere gegevensdragers aan boord heeft, wordt gestraft met een geldboete van
      de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel494
  - number: '495'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel495
  - number: 495.1°
    text: |-
      de schipper van een Nederlandsch vaartuig die niet zorgt, dat aan boord van zijn vaartuig de bij wet vereiste
      dagboeken overeenkomstig de wettelijke voorschriften worden gehouden of die dagboeken niet vertoont wanneer en waar
      de wet dit vordert.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel495
  - number: 495.2°
    text: |-
      de schipper van een Nederlands vaartuig die het register van strafbare feiten, bedoeld in
      [artikel 542 van het Wetboek van Strafvordering BES][ref1], niet overeenkomstig de wettelijke voorschriften houdt
      of niet vertoont wanneer en waar de wettelijke voorschriften dit vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel542
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel495
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '542'
  - number: 495.3°
    text: |-
      de eigenaar, de rompbevrachter, boekhouder of schipper van een Nederlandsch vaartuig die weigert aan
      belanghebbenden op hunne aanvrage inzage of, tegen betaling van de kosten, afschrift te verstrekken van de aan
      boord van het vaartuig gehouden dagboeken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel495
  - number: '496'
    text: |-
      De schipper van een Nederlands vaartuig die niet voldoet aan zijne wettelijke verplichting betreffende de
      inschrijving en kennisgeving van geboorten of sterfgevallen die gedurende eene zeereis plaats hebben, wordt
      gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel496
  - number: '497'
    text: |-
      De schipper of schepeling die niet in acht neemt de wettelijke voorschriften vastgesteld tot voorkoming van
      aanvaring of aandrijving, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel497
  - number: 497a
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt, zij het ook met een geringe afwijking, van een
      onderscheidingsteken, waarvan het gebruik krachtens wettelijke regeling uitsluitend aan hospitaalschepen, aan
      sloepen van zodanige schepen of aan kleine vaartuigen voor de hospitaaldienst bestemd, is toegekend, wordt gestraft
      met hechtenis van ten hoogste een maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel497a
  - number: '498'
    text: |-
      De schipper van een Nederlands vaartuig, die niet voldoet aan de verplichtingen, hem opgelegd in het tweede lid van
      [artikel 456 van het Wetboek van Koophandel BES][ref1], wordt gestraft met hechtenis van ten hoogste drie maanden
      of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel456
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel498
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '456'
  - number: '499'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel499
  - number: 499.1°
    text: |-
      De eigenaar zowel als de rompbevrachter, die de hem in het derde lid van
      [artikel 561 van het Wetboek van Koophandel BES][ref1] opgelegde verplichting niet nakomt;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel561
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel499
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '561'
  - number: 499.2°
    text: |-
      de schipper, die een van de hem in het [eerste en derde lid van artikel 561 van het Wetboek van Koophandel BES][ref1]
      opgelegde verplichtingen niet nakomt.


