  - number: '437'
    text: |-
      De in de [artikelen 114, eerste lid][ref1], [115][ref2], [116][ref3], [123, eerste lid][ref4], [124][ref5],
      [147][ref6], [187][ref7], [188][ref8], [300][ref9], [303][ref10], [306, eerste lid][ref11], [309][ref12],
      [310][ref13], [313–316][ref14], [395][ref15], [396][ref16], [410][ref17] en [411][ref18] bepaalde
      gevangenisstraf, alsmede de tijdelijke gevangenisstraf op te leggen krachtens de [artikelen 97][ref19],
      [114, tweede en laatste lid][ref20], [123, tweede en laatste lid][ref21], [301][ref22] en [302][ref23], kan
      met een derde worden verhoogd, indien tijdens het plegen van het misdrijf nog geen vijf jaren zijn verloopen,
      sedert de schuldige, hetzij eene tegen hem wegens een der in die artikelen omschreven misdrijven uitgesproken
      gevangenisstraf, hetzij een wegens gewelddadig verzet tegen of mishandeling van meerderen of schildwachten, of
      van geweldenarijen tegen personen krachtens de militaire strafwetgeving opgelegde straf geheel of ten deele heeft
      ondergaan, of sedert die straf hem geheel is kwijtgescholden, of indien tijdens het plegen van het misdrijf het
      recht tot uitvoering dier straf nog niet is verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel115
