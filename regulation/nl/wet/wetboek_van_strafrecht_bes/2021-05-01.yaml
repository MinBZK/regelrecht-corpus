        artikel: '180'
  - number: '183.1'
    text: 'Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183
  - number: 183.1.1°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk om hem te
      bewegen in zijn bediening, in strijd met zijn plicht, iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183
  - number: 183.1.2°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt ten gevolge of naar
      aanleiding van hetgeen door deze in zijn huidige of vroegere bediening, in strijd met zijn plicht, is gedaan of
      nagelaten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183
  - number: '183.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die een feit als in het eerste lid, onder 1°, omschreven, begaat jegens een
      persoon in het vooruitzicht van een aanstelling als ambtenaar, indien de aanstelling als ambtenaar is gevolgd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183
  - number: '183.3'
    text: |-
      Ontzetting van de in [artikel 32, onder 1° tot en met 4°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 183a.1
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183a
  - number: 183a.1.1°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk om hem te
      bewegen in zijn bediening, zonder daardoor in strijd met zijn plicht te handelen, iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183a
  - number: 183a.1.2°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt ten gevolge of naar
      aanleiding van hetgeen door deze in zijn huidige of vroegere bediening, zonder daardoor in strijd met zijn plicht
      te handelen, is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183a
  - number: 183a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die een feit als in het eerste lid, onder 1°, omschreven, begaat jegens een
      persoon in het vooruitzicht van een aanstelling als ambtenaar, indien de aanstelling van ambtenaar is gevolgd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183a
  - number: 183a.3
    text: |-
      Ontzetting van de in [artikel 32, onder 1° tot en met 4°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel183a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '184.1'
    text: |-
      Hij die een rechter een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk invloed uit
      te oefenen op de beslissing van een aan diens oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184
  - number: '184.2'
    text: |-
      Indien die gift of belofte gedaan wordt dan wel die dienst verleend of aangeboden wordt met het oogmerk om een
      veroordeling in een strafzaak te verkrijgen, wordt de schuldige gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184
  - number: '184.3'
    text: |-
      Ontzetting van de in [artikel 32, onder 1° tot en met 4°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 184a.1
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 183][ref1] en [183a][ref2] gelijkgesteld personen in de
      openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel183a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '183'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 183a
  - number: 184a.2
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 183, eerste lid, onder 2°][ref1], en
      [183a, eerste lid, onder 2°][ref2], voormalige ambtenaren gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel183a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '183'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 183a
  - number: 184a.3
    text: |-
      Met rechter wordt ten aanzien van [artikel 184][ref1] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel184
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '184'
  - number: '185'
    text: |-
      Hij die door geweld of bedreiging met geweld een ambtenaar dwingt tot volvoeren eener ambtsverrichting of het
      nalaten eener rechtmatige ambtsverrichting, wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel185
  - number: '186'
    text: |-
      Hij die zich met geweld of bedreiging met geweld verzet tegen een ambtenaar werkzaam in de rechtmatige uitoefening
      zijner bediening, of tegen personen die hem daarbij krachtens wettelijke verplichting of op zijn verzoek bijstand
      verleenen, wordt, als schuldig aan wederspannigheid, gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel186
  - number: '187'
    text: |-
      De dwang en de wederspannigheid in de [artikelen 185][ref1] en [186][ref2] omschreven worden gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel186
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '186'
  - number: 187.1°
    text: |-
      met gevangenisstraf van ten hoogste vier jaren, indien het misdrijf of de daarmede gepaard gaande feitelijkheden
      eenig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel187
  - number: 187.2°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden, indien zij zwaar lichamelijk letsel ten gevolge
      hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel187
  - number: 187.3°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien zij den dood ten gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel187
  - number: '188'
    text: |-
      De dwang en de wederspannigheid in de [artikelen 185][ref1] en [186][ref2] omschreven, door twee of meer personen
      met vereenigde krachten gepleegd, worden gestraft met gevangenisstraf van ten hoogste zes jaren. De schuldige wordt
      gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel186
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '186'
  - number: 188.1°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden, indien het door hem gepleegde misdrijf of de
      daarbij door hem gepleegde feitelijkheden eenig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel188
  - number: 188.2°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien zij zwaar lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel188
  - number: 188.3°
    text: met gevangenisstraf van ten hoogste vijftien jaren, indien zij den dood ten gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel188
  - number: '189'
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 185–189][ref1] gelijkgesteld de schipper of gezagvoerder van
      een luchtvaartuig die een bevoegdheid uitoefent of een verplichting vervult, welke hem als zodanig is toegekend of
      opgelegd bij een bepaling van het [Wetboek van Strafvordering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref2
        bwb_id: BWBR0028681
  - number: '190'
    text: |-
      Hij die opzettelijk niet voldoet aan een bevel of eene vordering, krachtens wettelijk voorschrift gedaan door
      een ambtenaar met de uitoefening van eenig toezicht belast of door een ambtenaar belast met of bevoegd verklaard
      tot het opsporen of onderzoeken van strafbare feiten, alsmede hij die opzettelijk eenige handeling, door een dier
      ambtenaren ondernomen ter uitvoering van eenig wettelijk voorschrift, belet, belemmert of verijdelt, wordt gestraft
      met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie. Met den in het eerste
      gedeelte van het vorige lid bedoelden ambtenaar wordt gelijkgesteld ieder die, krachtens wettelijk voorschrift,
      voortdurend of tijdelijk met eenigen openbaren dienst is belast. Met een vordering of handeling als bedoeld in het
      eerste lid worden gelijkgesteld een vordering of handeling van de schipper of gezagvoerder van een luchtvaartuig
      die een bevoegdheid uitoefent of een verplichting vervult, welke hem als zodanig is toegekend of opgelegd bij een
      bepaling van het [Wetboek van Strafvordering BES][ref1]. Indien tijdens het plegen van het misdrijf nog geen twee
      jaren zijn verloopen, sedert eene vroegere veroordeeling van den schuldige wegens gelijk misdrijf onherroepelijk is
      geworden, kunnen de straffen met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: 190a
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 185 tot en met 188][ref1], [190][ref2] en [191][ref3]
      gelijkgesteld personen in de openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie die in
      de openbare lichamen op door het volkenrecht toegelaten wijze hun bediening uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel190
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel191
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel190a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '190'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '191'
  - number: '191'
    text: |-
      Hij die bij eene terechtzitting of ter plaatse waar een ambtenaar in het openbaar in de rechtmatige uitoefening
      zijner bediening werkzaam is, opschudding veroorzaakt en na het door of van wege het bevoegd gezag gegeven bevel
      zich niet verwijdert, wordt gestraft met gevangenisstraf van ten hoogste twee weken of geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel191
  - number: '192'
    text: |-
      Hij die opzettelijk bij gelegenheid van een volksoploop zich niet onmiddellijk verwijdert na het derde door of
      van wege het bevoegd gezag gegeven bevel, wordt, als schuldig aan deelneming aan samenscholing, gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel192
  - number: '193'
    text: |-
      Hij die eene bekendmaking, van wege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, met het oogmerk om de kennisneming daarvan te beletten of te bemoeilijken, wordt gestraft met
      gevangenisstraf van ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel193
  - number: '194'
    text: |-
      Hij die aangifte of klachte doet dat een strafbaar feit gepleegd is, wetende dat het niet gepleegd is, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel194
  - number: '195.1'
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: 195.1.1°
    text: |-
      hij die opzettelijk iemand die schuldig is aan of vervolgd wordt ter zake van eenig misdrijf, verbergt of hem
      behulpzaam is in het ontkomen aan de nasporing van of aanhouding door de ambtenaren der justitie of politie;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: 195.1.2°
    text: |-
      hij die nadat eenig misdrijf is gepleegd, met het oogmerk om het te bedekken of de nasporing of vervolging te
      beletten of te bemoeilijken, voorwerpen waarop of waarmede het misdrijf gepleegd is of andere sporen van het
      misdrijf vernietigt, wegmaakt, verbergt of aan het onderzoek van de ambtenaren der justitie of politie onttrekt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: 195.1.3°
    text: |-
      hij die opzettelijk voorwerpen die kunnen dienen om de waarheid aan de dag te brengen of om wederrechtelijk
      verkregen voordeel als bedoeld in [artikel 38e][ref1] aan te tonen, met het oogmerk om de inbeslagneming daarvan te
      beletten, te belemmeren of te verijdelen, verbergt, vernietigt, wegmaakt of aan het onderzoek van de ambtenaren van
      de politie of justitie onttrekt, dan wel door het opzettelijk verstrekken van gegevens of inlichtingen aan derden
      die inbeslagneming belet, belemmert of verijdelt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel38e
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 38e
  - number: '195.2'
    text: |-
      In het geval het misdrijf, bedoeld in het eerste lid, een terroristisch misdrijf betreft, kan gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: '195.3'
    text: |-
      Deze bepalingen zijn niet van toepassing op hem die de daarin vermelde handelingen verricht ten einde gevaar van
      vervolging te ontgaan of af te wenden van een zijner bloedverwanten of aangehuwden in de rechte linie of in den
      tweeden of derden graad der zijlinie of van zijn echtgenoot of gewezen echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: '195.4'
    text: |-
      Met ambtenaren van de justitie of politie worden gelijkgesteld: personen in de openbare dienst van een
      internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is, die belast
      zijn met de opsporing of vervolging van enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel195
  - number: '196'
    text: |-
      Hij die opzettelijk eene gerechtelijke lijkschouwing belet, belemmert of verijdelt, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel196
  - number: 196a
    text: |-
      Hij die, na op openbaar gezag of krachtens rechterlijke uitspraak tijdelijk van zijn vrijheid te zijn beroofd,
      zich daaraan, al dan niet met behulp van derden, onttrekt, wordt gestraft met gevangenisstraf van ten hoogste tien
      jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel196a
  - number: '197'
    text: |-
      Hij die opzettelijk iemand, op openbaar gezag of krachtens rechterlijke uitspraak of beschikking van de vrijheid
      beroofd, bevrijdt of bij zijne zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste
      vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel197
  - number: '198'
    text: |-
      Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, opzettelijk niet voldoet aan eenige
      wettelijke verplichting die hij als zoodanig te vervullen heeft, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198
  - number: 198.1°
    text: in strafzaken met gevangenisstraf van ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198
  - number: 198.2°
    text: in andere zaken met gevangenisstraf van ten hoogste vier maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198
  - number: 198a
    text: |-
      Hij die opzettelijk niet voldoet aan de vordering van een parlementaire enquêtecommissie tot het hebben van
      inzage in of het nemen van afschrift van of het op andere wijze kennisnemen van documenten wordt gestraft met
      gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198a
  - number: 198b
    text: |-
      Hij die opzettelijk niet voldoet aan een vordering van een parlementaire enquêtecommissie tot het verstrekken van
      schriftelijke inlichtingen, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198b
  - number: 198c
    text: |-
      Hij die opzettelijk een parlementaire enquêtecommissie of door haar aangewezen personen belet, belemmert of
      verhindert een plaats te betreden, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van
      de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198c
  - number: 198d
    text: |-
      De misdrijven genoemd in de [artikelen 198 tot en met 198c][ref1] worden niet vervolgd, indien zij zijn begaan door
      een lid van de Staten-Generaal, een minister of een staatssecretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel198
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel198d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '198'
  - number: '199'
    text: |-
      Hij die opzettelijk niet voldoet aan een wettig bevel tot overlegging van een stuk hetwelk beweerd wordt valsch
      of vervalscht te zijn, of hetwelk dienen moet ter vergelijking met een ander waarvan de valschheid of vervalsching
      beweerd, of de echtheid ontkend of niet erkend wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel199
  - number: 199.1°
    text: in strafzaken met gevangenisstraf van ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel199
  - number: 199.2°
    text: in andere zaken met gevangenisstraf van ten hoogste vier maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel199
  - number: '200'
    text: |-
      Hij die, in staat van faillissement verklaard of als echtgenoot van een gefailleerde met wie hij in gemeenschap
      van goederen is gehuwd of als bestuurder of commissaris eener in staat van faillissement verklaarde vennootschap,
      maatschappij, vereniging of stichting, wettelijk opgeroepen tot het geven van inlichtingen, hetzij zonder geldige
      reden opzettelijk wegblijft, hetzij weigert de vereischte inlichtingen te geven, hetzij opzettelijk verkeerde
      inlichtingen geeft, wordt gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel200
  - number: '201'
    text: |-
      Hij die een recht uitoefent, wetende dat hij daarvan bij rechterlijke uitspraak is ontzet, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel201
  - number: '202'
    text: |-
      Hij die opzettelijk onderscheidingsteekenen draagt of eene daad verricht behoorende tot een ambt dat hij niet
      bekleedt of waarin hij geschorst is, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete
      van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel202
  - number: '203'
    text: |-
      Een vreemdeling die in de openbare lichamen Bonaire, Sint Eustatius of Saba verblijft, terwijl hij weet of ernstige
      redenen heeft te vermoeden dat hij op grond van een wettelijke voorschrift ongewenst is verklaard, wordt gestraft
      met een gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203
  - number: 203a.1
    text: |-
      Hij die een ander behulpzaam is bij het zich verschaffen van toegang tot of doorreis door de openbare lichamen
      Bonaire, Sint Eustatius en Saba of een staat die is toegetreden tot het op 15 november 2000 te New York
      totstandgekomen Protocol tegen de smokkel van migranten over land, over de zee en in de lucht, tot aanvulling van
      het op 15 november 2000 te New York totstandgekomen Verdrag tegen transnationale georganiseerde misdaad, of hem
      daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige redenen heeft te vermoeden
      dat die toegang of doorreis wederrechtelijk is, wordt als schuldig aan mensensmokkel gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203a.2
    text: |-
      Hij die een ander uit winstbejag behulpzaam is bij het zich verschaffen van verblijf in de openbare lichamen
      Bonaire, Sint Eustatius en Saba of een staat die is toegetreden tot het in het eerste lid genoemde protocol, of hem
      daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige redenen heeft te vermoeden
      dat dat verblijf wederrechtelijk is, wordt gestraft met een gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203a.3
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan in de uitoefening van enig ambt of
      beroep, wordt gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203a.4
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan door een persoon die daarvan een
      beroep of gewoonte maakt of in vereniging wordt begaan door meerdere personen, wordt gevangenisstraf van ten
      hoogste acht jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203a.5
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, zwaar lichamelijk letsel ten gevolge heeft of
      daarvan levensgevaar voor een ander te duchten is, wordt gevangenisstraf van ten hoogste twaalf jaren of geldboete
      van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203a.6
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, de dood ten gevolge heeft, wordt een
      gevangenisstraf van het hoogste vijftien jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203a
  - number: 203b
    text: |-
      Hij die een ander, die zich wederrechtelijk toegang tot of verblijf in de openbare lichamen Bonaire, Sint Eustatius
      en Saba heeft verschaft, krachtens overeenkomst of aanstelling arbeid doet verrichten, terwijl hij weet of
      ernstige redenen heeft om te vermoeden dat de toegang of dat verblijf wederrechtelijk is, wordt gestraft met een
      gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203b
  - number: 203c
    text: |-
      Hij die van het in [artikel 203a][ref1] omschreven feit een beroep of gewoonte maakt wordt gestraft met een
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel203a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 203a
  - number: 203d
    text: |-
      Bij veroordeling wegens een van de in de [artikelen 203a][ref1] en [203b][ref2] omschreven misdrijven, kan de
      rechter de ontzetting uitspreken van de in [artikel 32, onder 1° tot en met 4°][ref3], vermelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel203a
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel203b
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel203d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 203a
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 203b
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '204.1'
    text: |-
      Hij die opzettelijk eenig goed aan het krachtens de wet daarop gelegd beslag of aan een gerechtelijke bewaring
      onttrekt of, wetende dat het daaraan onttrokken is, het verbergt, wordt gestraft met gevangenisstraf van ten
      hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel204
  - number: '204.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk eenig krachtens de wet in beslag genomen goed vernielt,
      beschadigt onbruikbaar maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel204
  - number: '204.3'
    text: |-
      Met dezelfde straf wordt gestraft de bewaarder die opzettelijk een dezer feiten pleegt of toelaat, of de dader als
      medeplichtige ter zijde staat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel204
  - number: '205'
    text: |-
      Hij die opzettelijk zegels waarmede voorwerpen door of vanwege het bevoegd openbaar gezag verzegeld zijn,
      verbreekt, opheft of beschadigt, of de door zoodanig zegel bewerkte afsluiting op andere wijze verijdelt, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren, De bewaarder die opzettelijk het feit pleegt of toelaat,
      of den dader als medeplichtige ter zijde staat, wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
      Indien het feit ten gevolge van onachtzaamheid des bewaarders gepleegd is, wordt deze gestraft met hechtenis van
      ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel205
  - number: '206.1'
    text: |-
      Hij die opzettelijk zaken, bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten, bescheiden
      of registers die voortdurend of tijdelijk op openbaar gezag bewaard worden, of hetzij aan een ambtenaar, hetzij aan
      een ander in het belang van den openbaren dienst zijn ter hand gesteld, vernielt, beschadigt, onbruikbaar maakt of
      wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel206
  - number: '206.2'
    text: |-
      Onder bevoegde macht wordt mede verstaan: een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag
      waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel206
  - number: '207'
    text: |-
      Hij die opzettelijk brieven of andere stukken, aan een post- of telegraafkantoor bezorgd of in eene postbus
      gestoken, aan hunne bestemming onttrekt, opent of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste
      een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel207
  - number: '208'
    text: |-
      Indien de schuldige aan een der in de [artikelen 204–207][ref1] omschreven misdrijven zich den toegang tot
      de plaats van het misdrijf verschaft of het goed onder zijn bereik brengt door middel van braak, verbreking of
      inklimming, van valsche sleutels, van een valsche order of van een valsch kostuum, kan de straf met ten hoogste een
      jaar gevangenisstraf worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel204
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '204'
  - number: '209'
    text: |-
      Hij die, in tijd van vrede, opzettelijk desertie van een krijgsman, in dienst van den Staat, uitlokt door een der
      in [artikel 49][ref1] N°. 2 vermelde middelen, of bevordert op eenige in [artikel 50][ref2] vermelde wijze, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel50
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '50'
  - number: '210'
    text: |-
      Hij die, in tijd van vrede, opzettelijk oproer of muiterij van krijgslieden, in dienst van den Staat, uitlokt door
      een der in [artikel 49][ref1] N°. 2 vermelde middelen, of bevordert op eenige in [artikel 50][ref2] vermelde wijze,
      wordt gestraft met gevangenisstraf van ten hoogste zes jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel50
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '50'
  - number: '211.1'
    text: |-
      Hij die, zonder toestemming van de Koning, iemand voor vreemde krijgsdienst of gewapende strijd werft, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel211
  - number: '211.2'
    text: |-
      Indien de gewapende strijd waarvoor wordt geworven, het plegen van een terroristisch misdrijf inhoudt, wordt de
      gevangenisstraf, gesteld op het in het eerste lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel211
  - number: '212'
    text: 'Met gevangenisstraf van ten hoogste twee jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel212
  - number: 212.1°
    text: hij die zich opzettelijk voor den dienst bij de schutterij ongeschikt maakt of laat maken;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel212
  - number: 212.2°
    text: hij die een ander op diens verzoek opzettelijk voor dien dienst ongeschikt maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel212
  - number: '213'
    text: |-
      Hij die in de gevallen waarin een wettelijk voorschrift eene verklaring onder eede vordert of daaraan
      rechtsgevolgen verbindt, mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde,
      opzettelijk eene valsche verklaring onder eede aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren. Indien de valsche verklaring onder eede is afgelegd in eene strafzaak ten nadeele van den beklaagde
      of verdachte, wordt de schuldige gestraft met gevangenisstraf van ten hoogste negen jaren. Met den eed staat
      gelijk de belofte of bevestiging, die krachtens de wet voor den eed in de plaats treedt. Ontzetting van de in
      [artikel 32][ref1], N°. 1–4, vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 213a.1
    text: |-
      Hij die in de gevallen waarin door of krachtens een verdrag waarbij het Koninkrijk partij is, een verklaring onder
      ede of onder een daarvoor in de plaats tredende bevestiging of belofte wordt gevorderd, voor een internationaal
      gerecht mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde, opzettelijk een valse
      verklaring in die vorm aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213a
  - number: 213a.2
    text: |-
      De [leden 2 en 4 van artikel 213][ref1] zijn van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel213
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '213'
  - number: 213b.1
    text: |-
      Hij die in de gevallen waarin door of krachtens een verdrag een verklaring onder ede of onder een daarvoor in de
      plaats tredende bevestiging of belofte wordt gevorderd, in de openbare lichamen Bonaire, Sint Eustatius en Saba,
      per videoconferentie, voor een rechterlijke autoriteit van een andere staat mondeling, persoonlijk, opzettelijk een
      valse verklaring aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213b
  - number: 213b.2
    text: |-
      [Artikel 213, tweede en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel213
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '213'
  - number: 213b.3
    text: |-
      Geen vervolging vindt plaats dan op klacht van de rechterlijke autoriteit voor wie de valse verklaring werd
      afgelegd. [Artikel 68][ref1] blijft met betrekking tot de in dit lid bedoelde klacht buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel68
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel213b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '68'
  - number: '214'
    text: |-
      Hij die muntspeciën of munt- of bankbiljetten namaakt of vervalscht, met het oogmerk om die muntspeciën of munt- of
      bankbiljetten als echt en onvervalscht uit te geven of te doen uitgeven, wordt gestraft met gevangenisstraf van ten
      hoogste negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel214
  - number: '215'
    text: |-
      Hij die opzettelijk als echte en onvervalschte muntspeciën of munt- of bankbiljetten uitgeeft muntspeciën of
      munt- of bankbiljetten, die hij zelf heeft nagemaakt of vervalscht of waarvan de valschheid of vervalsching hem,
      toen hij ze ontving, bekend was, of deze, met het oogmerk om ze als echt en onvervalscht uit te geven of te doen
      uitgeven, ontvangt, zich verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel215
  - number: '216'
    text: |-
      Hij die opzettelijk en wederrechtelijk muntspeciën of munt- of bankbiljetten welke bestemd zijn om als wettig
      betaalmiddel in omloop te worden gebracht, in omloop brengt of, teneinde ze in omloop te brengen, ontvangt, zich
      verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met een gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel216
  - number: '217'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel217
  - number: '218'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel218
  - number: '219'
    text: |-
      Hij die opzettelijk valse of vervalste muntspeciën of valse of vervalste munt- of bankbiljetten uitgeeft, wordt,
      behoudens [artikel 215][ref1], gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de vierde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel215
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '215'
  - number: '220'
    text: |-
      Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft of voorhanden heeft waarvan hij weet
      dat zij bestemd zijn tot het namaken of vervalsen van muntspeciën of van munt- of bankbiljetten, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel220
  - number: 220a
    text: |-
      Bij veroordeeling wegens een der in dezen titel omschreven misdrijven worden: - de valsche, vervalschte of
      geschonden muntspeciën,
        - de valsche, of vervalschte munt- of bankbiljetten,
        - de stoffen, voorwerpen of gegevens, uit hun aard bestemd tot het namaken, vervalschen of in waarde verminderen
      van muntspecien of het namaken of vervalschen van munt- of bankbiljetten,
        - voor zoover daarmede met misdrijf is gepleegd of zij het voorwerp daarvan hebben uitgemaakt,
        - verbeurdverklaard, ook indien zij niet aan den veroordeelde toebehooren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel220a
  - number: '221'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 214 tot en met 216][ref1] omschreven misdrijven, kan ontzetting
      van de in [artikel 32][ref2], N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '214'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '222.1'
    text: 'Met gevangenisstraf van ten hoogste zes jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel222
  - number: 222.1.1°
    text: |-
      hij die van rijkswege uitgegeven zegels namaakt of vervalscht, met het oogmerk om die zegels als echt en
      onvervalscht te gebruiken of door anderen te doen gebruiken;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel222
  - number: 222.1.2°
    text: hij die, met gelijk oogmerk, zoodanige zegels vervaardigt door wederrechtelijk gebruik te maken van echte stempels.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel222
  - number: '222.2'
    text: Het bepaalde in het eerste lid is van overeenkomstige toepassing op zegels die krachtens de wet worden uitgegeven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel222
  - number: '223'
    text: 'Met gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel223
  - number: 223.1°
    text: |-
      hij die op een aan ijk onderworpen meetinstrument valse merken plaatst of echte vervalst, met het oogmerk om
      die meetinstrumenten te gebruiken of door anderen te doen gebruiken alsof de daarop geplaatste merken echt en
      onvervalst waren;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel223
  - number: 223.2°
    text: |-
      hij die, met gelijk oogmerk, op de bedoelde voorwerpen merken plaatst door wederrechtelijk gebruik te maken van
      echte stempels.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel223
  - number: '224'
    text: 'Met gevangenisstraf van ten hoogste twee jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel224
  - number: 224.1°
    text: |-
      hij die andere dan de in [artikel 223][ref1] bedoelde merken, die krachtens wettelijk voorschrift op goederen
      of hunne verpakking moeten of kunnen worden geplaatst, daarop valschelijk plaatst of echte vervalscht, met het
      oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de daarop geplaatste merken echt en
      onvervalscht waren;


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel223
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '223'
  - number: 224.2°
    text: |-
      hij die, met gelijk oogmerk, op de bedoelde goederen of hunne verpakking merken plaatst door wederrechtelijk
      gebruik te maken van echte stempels;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel224
  - number: 224.3°
    text: |-
      hij die echte merken gebruikt voor goederen of hunne verpakking waarvoor die merken niet bestemd zijn, met het
      oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de bedoelde merken daarvoor bestemd
      waren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel224
  - number: '225'
    text: |-
      Hij die opzettelijk valsche, vervalschte of wederrechtelijk vervaardigde zegels, teekenen of merken, of de
      voorwerpen waaraan zij wederrechtelijk verbonden zijn, gebruikt, verkoopt, te koop aanbiedt, aflevert, ten verkoop
      in voorraad heeft of binnen de openbare lichamen Bonaire, Sint Eustatius en Saba invoert, als waren die zegels,
      teekenen of merken echt en onvervalscht en niet wederrechtelijk vervaardigd of wederrechtelijk aan de voorwerpen
      verbonden, wordt gestraft met dezelfde straffen als in de [artikelen 222–224][ref1] zijn bepaald, naar de daar
      gemaakte onderscheidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel222
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '222'
  - number: '226.1'
    text: |-
      Hij die een aan ijk onderworpen meetinstrument ontdoet van het daarop geplaatste afkeuringsmerk, met het oogmerk
      om die voorwerpen te gebruiken of door anderen te doen gebruiken als waren zij niet afgekeurd, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel226
  - number: '226.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk deze van dat afkeuringsmerk ontdane meetinstrumenten
      gebruikt, verkoopt, te koop aanbiedt, aflevert, ten verkoop in voorraad heeft, als waren zij niet afgekeurd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel226
  - number: '227'
    text: |-
      Hij die van rijkswege uitgegeven zegels, welke reeds tot gebruik hebben gediend, ontdoet van het merk bestemd
      om ze voor verder gebruik ongeschikt te maken, met het oogmerk om die zegels te gebruiken of door anderen te
      doen gebruiken als waren zij nog niet gebruikt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren
      of geldboete van de eerste categorie. Met dezelfde straffen wordt gestraft hij die opzettelijk deze van dat merk
      ontdane zegels gebruikt, verkoopt, te koop aanbiedt, aflevert, ten verkoop in voorraad heeft of binnen de openbare
      lichamen Bonaire, Sint Eustatius en Saba invoert, als waren zij nog niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel227
  - number: 227bis
    text: |-
      De bepalingen van de [artikelen 222][ref1], [224][ref2], [225][ref3] en [227][ref4] zijn naar de daar gemaakte
      onderscheidingen mede van toepassing, indien de daarin omschreven feiten worden gepleegd met betrekking tot
      zegels of merken van Nederland, Aruba, Curaçao, Sint Maarten, een buitenlandse mogendheid of een volkenrechtelijke
      organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel222
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel224
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel225
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel227
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel227bis
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '222'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '224'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '225'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '227'
  - number: '228'
    text: |-
      Hij die stoffen of voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van eenig in
      [artikel 222][ref1] of in [artikel 227bis][ref2] in verband met artikel 222 omschreven misdrijf, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie. De stoffen en voorwerpen worden
      verbeurd verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel222
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel227bis
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '222'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 227bis
  - number: '229'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 222–227bis][ref1] omschreven misdrijven, kan ontzetting van de
      in [artikel 32][ref2], N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel222
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '222'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '230.1'
    text: |-
      Hij die een geschrift dat bestemd is om tot bewijs van enig feit te dienen, valselijk opmaakt of vervalst, met
      het oogmerk om het als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt als schuldig aan
      valsheid in geschrift gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel230
  - number: '230.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van het valse of vervalste geschrift als ware
      het echt en onvervalst dan wel opzettelijk zodanig geschrift aflevert of voorhanden heeft, terwijl hij weet of
      redelijkerwijs moet vermoeden dat dit geschrift bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel230
  - number: '230.3'
    text: |-
      Indien een feit, omschreven in het eerste of tweede lid, wordt gepleegd met het oogmerk om een terroristisch
      misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met een derde
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel230
  - number: '231'
    text: |-
      De schuldige aan valschheid in geschrifte wordt gestraft met gevangenisstraf van ten hoogste zeven jaren, indien
      zij gepleegd is:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231.1°
    text: in authentieke akten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231.2°
    text: |-
      in schuldbrieven of certificaten van schuld van eenigen Staat, enig eilandgebied, eenige provincie, gemeente of
      openbare instelling;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231.3°
    text: |-
      in aandeelen of schuldbrieven of certificaten van aandeel of schuld van eenige vereniging, stichting of
      vennootschap;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231.4°
    text: |-
      in talons, dividend-, of rentebewijzen behoorende tot een der onder de beide voorgaande nummers omschreven stukken,
      of in de bewijzen in plaats van deze stukken uitgegeven;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231.5°
    text: in voor omloop bestemd krediet- of handelspapier.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231
  - number: 231a
    text: |-
      Hij die enig geschrift valselijk opmaakt of vervalst met het oogmerk om het als echt en onvervalst te gebruiken
      of door anderen te doen gebruiken, wordt, indien uit dat gebruik aanranding van iemands eer of goede naam kan
      ontstaan, gestraft met gevangenisstraf van ten hoogste vier jaren. Met dezelfde straf wordt gestraft hij die
      opzettelijk gebruik maakte van het valse of vervalste geschrift als ware het echt en onvervalst, indien uit dat
      gebruik aanranding van iemands eer of goede naam kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel231a
  - number: '232'
    text: |-
      Hij die in eene authentieke akte een valsche opgave doet opnemen aangaande een feit, van welks waarheid de akte
      moet doen blijken, met het oogmerk om die akte te gebruiken of door anderen te doen gebruiken als ware zijne
      opgave in overeenstemming met de waarheid, wordt, indien uit dat gebruik eenig nadeel kan ontstaan, gestraft met
      gevangenisstraf van ten hoogste zes jaren. Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van
      de akte als ware de inhoud in overeenstemming met de waarheid, indien uit dat gebruik eenig nadeel kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel232
  - number: 232a
    text: |-
      Hij die, anders dan door valsheid in geschrift, opzettelijk niet naar waarheid gegevens verstrekt aan degene
      door wie of door wiens tussenkomst enige verstrekking of tegemoetkoming wordt verleend, wordt, indien het feit
      kan strekken tot bevoordeling van zichzelf of een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat
      de verstrekte gegevens van belang zijn voor de vaststelling van zijn of eens anders recht op die verstrekking of
      tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke verstrekking of tegemoetkoming, gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel232a
  - number: 232b
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, opzettelijk nalaat
      tijdig de benodigde gegevens te verstrekken, wordt, indien het feit kan strekken tot bevoordeling van zichzelf of
      een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat de gegevens van belang zijn voor de vaststelling
      van zijn of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een
      dergelijke verstrekking of tegemoetkoming, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel232b
  - number: '233'
    text: |-
      De geneeskundige of verloskundige die opzettelijk een valse verklaring afgeeft nopens een geboorte, een oorzaak
      van overlijden dan wel nopens het al of niet bestaan of bestaan hebben van ziekten, zwakheden of gebreken, wordt
      gestraft met gevangenisstraf van ten hoogste drie jaren. Indien de verklaring wordt afgegeven met het oogmerk om
      iemand in een krankzinnigengesticht te doen opnemen of terughouden, wordt gevangenisstraf van ten hoogste zeven
      jaren en zes maanden opgelegd. Met dezelfde straffen wordt gestraft hij die opzettelijk van de valsche verklaring
      gebruik maakt als ware de inhoud in overeenstemming met de waarheid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel233
  - number: '234'
    text: |-
      Hij die eene schriftelijke geneeskundige verklaring nopens het al of niet bestaan of bestaan hebben van ziekten,
      zwakheden of gebreken valschelijk opmaakt of vervalscht, met het oogmerk om het openbaar gezag of verzekeraars te
      misleiden, wordt gestraft met gevangenisstraf van ten hoogste drie jaren. Met dezelfde straf wordt gestraft hij
      die, met gelijk oogmerk, van de valsche of vervalschte verklaring gebruik maakt als ware zij echt en onvervalscht.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel234
  - number: '235'
    text: |-
      Hij die een getuigschrift van goed gedrag, bekwaamheid, armoede, gebreken of andere omstandigheden valschelijk
      opmaakt of vervalscht, met het oogmerk om het te gebruiken of door anderen te doen gebruiken tot het verkrijgen van
      eene indienststelling of tot het opwekken van welwillendheid en hulpbetoon, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar. Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van eenig in het eerste
      lid vermeld valsch of vervalscht getuigschrift als ware het echt en onvervalscht.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel235
  - number: '236.1'
    text: |-
      Hij die een reisdocument, een identiteitsbewijs als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1]
      of een ander identiteitsbewijs dat afgegeven is door een dienst of organisatie van vitaal of nationaal belang,
      valselijk opmaakt of vervalst, of een zodanig geschrift op grond van valse gegevens doet verstrekken dan wel een
      zodanig geschrift dat aan hem of een ander verstrekt is, ter beschikking stelt van een derde met het oogmerk het
      door deze te doen gebruiken als ware het aan hem verstrekt, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '236.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die een reisdocument of een identiteitsbewijs als bedoeld in het eerste lid
      aflevert of voorhanden heeft waarvan hij weet of redelijkerwijs moet vermoeden dat het vals of vervalst is, dan
      wel opzettelijk gebruik maakt van een vals of vervalst reisdocument of identiteitsbewijs als bedoeld in het eerste
      lid. Met dezelfde straf wordt gestraft hij die opzettelijk en wederrechtelijk gebruik maakt van een bij het bevoegd
      gezag als vermist opgegeven of een niet op zijn naam gesteld reisdocument of identiteitsbewijs als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236
  - number: '236.3'
    text: |-
      [Artikel 230, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel230
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '230'
  - number: 236a.1
    text: |-
      Hij die biometrische kenmerken of biometrische persoonsgegevens valselijk opmaakt of vervalst met het oogmerk om
      deze als echt en onvervalst te gebruiken of te doen gebruiken in gevallen waarin die kenmerken of persoonsgegevens
      worden gebruikt voor het vaststellen van iemands identiteit, teneinde zijn identiteit te verhelen of de identiteit
      van een ander te verhelen of misbruiken, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236a
  - number: 236a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die in gevallen waarin biometrische kenmerken of biometrische
      persoonsgegevens worden gebruikt voor het vaststellen van iemands identiteit, opzettelijk gebruik maakt van valse
      of vervalste biometrische kenmerken of biometrische persoonsgegevens als waren deze echt en onvervalst met het
      oogmerk om zijn identiteit te verhelen of de identiteit van een ander te misbruiken of opzettelijk gebruik maakt
      van biometrische kenmerken of biometrische persoonsgegevens van een ander met het oogmerk om de verdenking van een
      strafbaar feit op de ander of niet op hem te doen ontstaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236a
  - number: 236a.3
    text: |-
      [Artikel 230, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel230
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '230'
  - number: 236b
    text: |-
      Hij die opzettelijk en wederrechtelijk identificerende persoonsgegevens, niet zijnde biometrische persoonsgegevens,
      van een ander gebruikt met het oogmerk om zijn identiteit te verhelen of de identiteit van de ander te verhelen
      of misbruiken, waardoor uit dat gebruik enig nadeel kan ontstaan, wordt gestraft met een gevangenisstraf van ten
      hoogste vijf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel236b
  - number: '237.1'
    text: |-
      Hij die opzettelijk een betaalpas, waardekaart, enige andere voor het publiek beschikbare kaart of een voor het
      publiek beschikbare drager van identificerende persoonsgegevens, bestemd voor het verrichten of verkrijgen van
      betalingen of andere prestaties langs geautomatiseerde weg, valselijk opmaakt of vervalst, met het oogmerk zichzelf
      of een ander te bevoordelen, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel237
  - number: '237.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van de valse of vervalste pas of kaart als
      ware deze echt en onvervalst, dan wel opzettelijk zodanige pas of kaart aflevert, voorhanden heeft, ontvangt, zich
      verschaft, vervoert, verkoopt of overdraagt, terwijl hij weet of redelijkerwijs moet vermoeden dat de pas of kaart
      bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel237
  - number: '238'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel238
  - number: '239.1'
    text: |-
      Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft, verkoopt, overdraagt of
      voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van een der in de [artikelen 231][ref1],
      [236, eerste lid][ref2], [236a, eerste lid][ref3], [236b][ref4] en [237, eerste lid][ref5], omschreven misdrijven,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel236a
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel236b
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel237
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '231'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '236'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 236a
      - id: ref4
        bwb_id: BWBR0028570
        artikel: 236b
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '237'
  - number: '239.2'
    text: |-
      [Artikel 230, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel230
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '230'
  - number: '240'
    text: |-
      Bij veroordeeling wegens een der in [artikelen 230–234][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 32][ref2], N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '230'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '241'
    text: |-
      Hij die door eenige handeling opzettelijk eens anders afstamming onzeker maakt, wordt als schuldig aan
      verduistering van staat, gestraft met gevangenisstraf van ten hoogste vijf jaren. Ontzetting van de in
      [artikel 32][ref1], N°. 1–4, vermelde rechten kan worden uitgesproken. Vervolging heeft niet plaats dan nadat een
      verzoek tot inroeping of tot betwisting van staat is gedaan en de burgerlijke rechter daarop een eindbeslissing
      heeft gegeven. Indien het verzoek echter door het stilzitten van partijen onvoldoende voortgang vindt, kan
      vervolging ook plaats hebben nadat de burgerlijke rechter heeft beslist dat er een begin van bewijs is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '242'
    text: 'Met gevangenisstraf van ten hoogste vier jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel242
  - number: 242.1°
    text: hij die opzettelijk een dubbel huwelijk aangaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel242
  - number: 242.2°
    text: hij die een huwelijk aangaat, wetende dat de wederpartij daardoor een dubbel huwelijk aangaat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel242
  - number: '243'
    text: |-
      De ongehuwde die een huwelijk aangaat, opzettelijk aan de wederpartij verzwijgende dat daartegen eenig wettig
      beletsel bestaat, wordt, indien op grond van dat beletsel de nietigheid van het huwelijk is uitgesproken, gestraft
      met gevangenisstraf van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel243
  - number: '244'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft schennis van de
      eerbaarheid:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel244
  - number: 244.1°
    text: op of aan een plaats, voor het openbaar verkeer bestemd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel244
  - number: 244.2°
    text: |-
      op een andere dan onder 1° bedoelde openbare plaats, toegankelijk voor personen beneden de leeftijd van zestien
      jaar;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel244
  - number: 244.3°
    text: op een niet openbare plaats, indien een ander daarbij zijns ondanks tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel244
  - number: '245'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft hij die weet of
      ernstige reden heeft om te vermoeden dat een afbeelding of voorwerp aanstotelijk voor de eerbaarheid is en die
      afbeelding of dat voorwerp:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel245
  - number: 245.1°
    text: op of aan een plaats, voor het openbaar verkeer bestemd, openlijk tentoonstelt of aanbiedt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel245
  - number: 245.2°
    text: aan iemand, anders dan op diens verzoek, toezendt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel245
  - number: '246'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft hij die een
      afbeelding, een voorwerp of een gegevensdrager, bevattende een afbeelding waarvan de vertoning schadelijk is te
      achten voor personen beneden de leeftijd van zestien jaar, verstrekt, aanbiedt of vertoont aan een minderjarige van
      wie hij weet of redelijkerwijs moet vermoeden, dat deze jonger is dan zestien jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel246
  - number: 246bis.1
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft degene die
      een afbeelding – of een gegevensdrager, bevattende een afbeelding – van een seksuele gedraging, waarbij iemand
      die kennelijk de leeftijd van achttien jaar nog niet heeft bereikt, is betrokken of schijnbaar is betrokken,
      verspreidt, aanbiedt, openlijk tentoonstelt, vervaardigt, invoert, doorvoert, uitvoert, verwerft, in bezit heeft
      of zich door middel van een geautomatiseerd werk of met gebruikmaking van een communicatiedienst de toegang daartoe
      verschaft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel246bis
  - number: 246bis.2
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft degene die van
      het plegen van een van de misdrijven, omschreven in het eerste lid, een beroep of een gewoonte maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel246bis
  - number: '247'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel247
  - number: '248'
    text: |-
      Hij die door geweld of een andere feitelijkheid of bedreiging met geweld of een andere feitelijkheid iemand dwingt
      tot het ondergaan van handelingen die bestaan uit of mede bestaan uit het seksueel binnendringen van het lichaam,
      wordt als schuldig aan verkrachting gestraft met gevangenisstraf van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel248
  - number: '249'
    text: |-
      Hij die met iemand van wie hij weet dat hij in staat van bewusteloosheid, verminderd bewustzijn of lichamelijke
      onmacht verkeert, dan wel aan een zodanige gebrekkige ontwikkeling of ziekelijke stoornis van zijn geestvermogens
      lijdt dat hij niet of onvolkomen in staat is zijn wil daaromtrent te bepalen of kenbaar te maken of daartegen
      weerstand te bieden, handelingen pleegt die bestaan uit of mede bestaan uit het seksueel binnendringen van het
      lichaam, wordt gestraft met gevangenisstraf van ten hoogste zestien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel249
  - number: '250'
    text: |-
      Hij die met iemand beneden de leeftijd van twaalf jaren handelingen pleegt die bestaan uit of mede bestaan uit het
      seksueel binnendringen van het lichaam, wordt gestraft met gevangenisstraf van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel250
  - number: '251.1'
    text: |-
      Hij die met iemand die wel de leeftijd van twaalf jaren maar nog niet die van zestien jaren heeft bereikt, buiten
      echt ontuchtige handelingen pleegt, die bestaan uit of mede bestaan uit het seksueel binnendringen van het lichaam,
      wordt gestraft met gevangenisstraf van ten hoogste zestien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel251
  - number: '251.2'
    text: |-
      Het openbaar ministerie stelt alvorens tot vervolging over te gaan de minderjarige, zo dit mogelijk is, in de
      gelegenheid zijn mening over de wenselijkheid van een vervolging voor het gepleegde feit kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel251
  - number: '252'
    text: |-
      Hij die door geweld of een andere feitelijkheid of bedreiging met geweld of een andere feitelijkheid iemand
      dwingt tot het plegen of dulden van ontuchtige handelingen, wordt, als schuldig aan feitelijke aanranding van de
      eerbaarheid, gestraft met gevangenisstraf van ten hoogste zestien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel252
  - number: '253.1'
    text: |-
      Hij die met iemand van wie hij weet dat hij in staat van bewusteloosheid, verminderd bewustzijn of lichamelijke
      onmacht verkeert, dan wel aan een zodanige gebrekkige ontwikkeling of ziekelijke stoornis van zijn geestvermogens
      lijdt dat hij niet of onvolkomen in staat is zijn wil daaromtrent te bepalen of kenbaar te maken of daartegen
      weerstand te bieden, of met iemand beneden de leeftijd van zestien jaren buiten echt ontuchtige handelingen pleegt
      of laatstgemelde tot het plegen of dulden van zodanige handelingen buiten echt met een derde verleidt, wordt
      gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel253
  - number: '253.2'
    text: |-
      Indien het misdrijf van het vorige lid gepleegd is ten aanzien van een minderjarige die twaalf jaar of ouder is,
      stelt het openbaar ministerie alvorens tot vervolging over te gaan de minderjarige, zo dit mogelijk is, in de
      gelegenheid zijn mening over de wenselijkheid van een vervolging voor het gepleegde feit kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel253
  - number: '254.1'
    text: |-
      De in de [artikelen 246bis][ref1], [248 tot en met 253][ref2], [256 tot en met 256d][ref3], [257][ref4] en
      [258][ref5] bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien het feit wordt gepleegd door
      twee of meer verenigde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel246bis
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel256
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel257
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel258
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 246bis
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '256'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '257'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '258'
  - number: '254.2'
    text: |-
      De in de [artikelen 246bis][ref1], [248 tot en met 253][ref2], [256 tot en met 256d][ref3], [257][ref4] en
      [258][ref5] bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien de schuldige het feit begaat
      tegen zijn kind, een kind over wie hij het gezag uitoefent, een kind dat hij verzorgt of opvoedt als behorend
      tot zijn gezin, zijn pupil, een aan zijn zorg, opleiding of waakzaamheid toevertrouwde minderjarige of zijn
      minderjarige bediende of ondergeschikte.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel246bis
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel256
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel257
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel258
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 246bis
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '256'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '257'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '258'
  - number: '254.3'
    text: |-
      Indien een der in de [artikelen 249][ref1] en [251–253][ref2] omschreven misdrijven zwaar lichamelijk letsel ten
      gevolge heeft, wordt gevangenisstraf van ten hoogste vier en twintig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel251
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '251'
  - number: '254.4'
    text: |-
      Indien een der in de [artikelen 248–253][ref1] omschreven misdrijven den dood ten gevolge heeft, wordt
      levenslange gevangenisstraf dan wel een tijdelijke gevangenisstraf van ten hoogste vier en twintig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel248
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '248'
  - number: '255'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel255
  - number: '256'
    text: |-
      Hij die door giften of beloften van geld of goed, misbruik van uit feitelijke verhoudingen voortvloeiend overwicht
      of misleiding een persoon waarvan hij weet of redelijkerwijs moet vermoeden dat deze de leeftijd van achttien jaren
      nog niet heeft bereikt, opzettelijk beweegt ontuchtige handelingen met hem te plegen of zoodanige handelingen van
      hem te dulden, wordt gestraft met gevangenisstraf van ten hoogste acht jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256
  - number: 256a
    text: |-
      Hij die ontucht pleegt met iemand die zich beschikbaar stelt tot het verrichten van seksuele handelingen met
      een derde tegen betaling en die de leeftijd van zestien jaren maar nog niet de leeftijd van achttien jaren heeft
      bereikt, wordt gestraft met een gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256a
  - number: 256b
    text: |-
      Hij die opzettelijk aanwezig is bij het plegen van ontuchtige handelingen door een persoon waarvan hij weet of
      redelijkerwijs moet vermoeden dat deze de leeftijd van achttien jaren nog niet heeft bereikt dan wel bij het
      vertonen van afbeeldingen van dergelijke handelingen in een daarvoor bestemde gelegenheid, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256b
  - number: 256c.1
    text: |-
      Hij die een persoon van wie hij weet of redelijkerwijs moet vermoeden dat deze de leeftijd van zestien jaren nog
      niet heeft bereikt, met ontuchtig oogmerk ertoe beweegt getuige te zijn van seksuele handelingen, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256c
  - number: 256c.2
    text: |-
      [Artikel 251, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel251
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '251'
  - number: 256d.1
    text: |-
      Hij die door middel van een geautomatiseerd werk of met gebruikmaking van een communicatiedienst een persoon van
      wie hij weet of redelijkerwijs moet vermoeden dat deze de leeftijd van zestien jaren nog niet heeft bereikt, een
      ontmoeting voorstelt met het oogmerk ontuchtige handelingen met die persoon te plegen of een afbeelding van een
      seksuele gedraging waarbij die persoon is betrokken, te vervaardigen wordt, indien hij enige handeling onderneemt
      gericht op het verwezenlijken van die ontmoeting, gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256d
  - number: 256d.2
    text: |-
      [Artikel 251, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel251
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel256d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '251'
  - number: '257'
    text: |-
      Hij die ontucht pleegt met zijn minderjarig kind, stiefkind of pleegkind, zijn pupil, een aan zijne zorg, opleiding
      of waakzaamheid toevertrouwden minderjarige of zijn minderjarige bediende of ondergeschikte, wordt gestraft met
      gevangenisstraf van ten hoogste twaalf jaren. Met dezelfde straf wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel257
  - number: 257.1°
    text: |-
      de ambtenaar die ontucht pleegt met een persoon aan zijn gezag onderworpen of aan zijne waakzaamheid toevertrouwd
      of aanbevolen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel257
  - number: 257.2°
    text: |-
      de bestuurder, geneeskundige, onderwijzer, beambte, opzichter of bediende in een gevangenis, tuchtschool,
      opvoedingsgesticht, weeshuis, ziekenhuis, krankzinnigengesticht of instelling van weldadigheid, die ontucht pleegt
      met een persoon daarin opgenomen;*
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel257
  - number: 257.3°
    text: |-
      Degene die, werkzaam in de gezondheidszorg of maatschappelijke zorg, ontucht pleegt met iemand die zich als patiënt
      of cliënt aan zijn hulp of zorg heeft toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel257
  - number: '258'
    text: 'Wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel258
  - number: 258.1°
    text: |-
      met gevangenisstraf van ten hoogste acht jaren, hij die het plegen van ontucht door zijn minderjarig kind,
      stiefkind of pleegkind, zijn pupil, een aan zijne zorg, opleiding of waakzaamheid toevertrouwenden minderjarige of
      zijn minderjarige bediende of ondergeschikte met een derde opzettelijk teweegbrengt of bevordert;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel258
  - number: 258.2°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren, hij die, buiten de gevallen genoemd onder 1°., het plegen van
      ontucht door een minderjarige wiens minderjarigheid hij kent of redelijkerwijze moet vermoeden, met een derde
      opzettelijk teweegbrengt of bevordert.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel258
  - number: '259'
    text: |-
      Hij die van het opzettelijk teweegbrengen of bevorderen van ontucht door anderen met derden een beroep of eene
      gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel259
  - number: '260'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel260
  - number: '261'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 244][ref1], [248–253][ref2] en [255 tot en met 259][ref3]
      omschreven misdrijven, kan ontzetting van de in [artikel 32][ref4], no. 1–4, vermelde rechten worden uitgesproken.
      Indien de schuldige aan een der misdrijven in de artikelen 255 tot en met 259 omschreven het misdrijf in zijn
      beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel244
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel255
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '244'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '255'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '263'
    text: 'Met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel263
  - number: 263.1°
    text: hij die aan iemand die in kenlijken staat van dronkenschap verkeert bedwelmenden drank verkoopt of toedient;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel263
  - number: 263.2°
    text: hij die een kind beneden den leeftijd van zestien jaren opzettelijk dronken maakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel263
  - number: 263.3°
    text: hij die iemand door geweld of bedreiging met geweld dwingt tot het gebruik van bedwelmenden drank.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel263
  - number: '264'
    text: |-
      Hij die een onder zijn wettig gezag staand kind beneden den leeftijd van twaalf jaren aan een ander afstaat of
      overlaat, wetende dat het tot of bij het uitoefenen van bedelarij, van gevaarlijke kunstverrichtingen of van
      gevaarlijken of de gezondheid ondermijnenden arbeid zal worden gebruikt, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel264
  - number: '265'
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel265
  - number: 265.1°
    text: |-
      hij die, zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel toelaatbaar is,
      opzettelijk een dier pijn of letsel veroorzaakt of de gezondheid van een dier benadeelt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel265
  - number: 265.2°
    text: |-
      hij die zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel toelaatbaar is,
      opzettelijk aan een dier, dat geheel of ten dele aan hem toebehoort en onder zijn toezicht staat of aan een dier,
      tot welks verzorging hij verplicht is, de nodige verzorging onthoudt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel265
  - number: '266.1'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de derde categorie wordt gestraft hij, die anders
      dan krachtens vergunning ingevolge [artikel 1 van de Wet hazardspelen BES I][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0028450#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0028450
        artikel: '1'
  - number: 266.1.1°
    text: |-
      het opzettelijk aanbieden of geven van gelegenheid tot hazardspel als bedrijf uitoefent of opzettelijk in een
      onderneming daartoe deelneemt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
  - number: 266.1.2°
    text: |-
      opzettelijk het publiek gelegenheid tot hazardspel aanbiedt of geeft, of opzettelijk in een onderneming daartoe
      deelneemt, onverschillig of het gebruik maken van die gelegenheid al dan niet van enige voorwaarde of van de
      inachtneming van enige vorm afhankelijk is gesteld;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
  - number: 266.1.3°
    text: het deelnemen aan hazardspel als bedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
  - number: '266.2'
    text: Indien de schuldige het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
  - number: '266.3'
    text: |-
      Onder hazardspel wordt verstaan elk spel, waarbij in het algemeen de kans op winst van het toeval afhangt, ook
      wanneer die kans toeneemt met de meerdere geoefendheid of de grootere behendigheid van den speler. Daaronder worden
      begrepen alle kansovereenkomsten over den uitslag van wedstrijden of verdere spelen, welke niet tusschen hen die
      daaraan deelnemen zijn gesloten, zoomede alle weddenschappen. Daaronder worden niet begrepen loterijen naar de
      daarvan bij het eerste lid van [artikel 1 Loterijwet BES][ref1] gegeven omschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0028260#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0028260
        artikel: '1'
  - number: '267'
    text: |-
      Hij die opzettelijk iemand tot wiens onderhoud, verpleging of verzorging hij krachtens wet of eene overeenkomst
      verplicht is, in een hulpeloozen toestand brengt of laat, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel267
  - number: '268'
    text: |-
      Hij die een kind beneden den leeftijd van zeven jaren te vondeling legt of, met het oogmerk om er zich van te
      ontdoen, verlaat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel268
  - number: '269'
    text: |-
      Indien een der in de [artikelen 267][ref1] en [268][ref2] omschreven feiten zwaar lichamelijk letsel ten gevolge
      heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden. Indien een dezer
      feiten den dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste negen jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel268
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '267'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '268'
  - number: '270'
    text: |-
      Indien de schuldige aan het in [artikel 268][ref1] omschreven misdrijf de vader of de moeder is, kunnen te zijnen
      aanzien de in de artikelen 268 en [269][ref2] bepaalde straffen met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel269
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '269'
  - number: '271'
    text: |-
      Indien de moeder, onder de werking van vrees voor de ontdekking van hare bevalling, haar kind kort na de
      geboorte te vondeling legt of, met het oogmerk om er zich van te ontdoen, verlaat, wordt het maximum der in de
      [artikelen 268][ref1] en [269][ref2] vermelde straffen tot de helft verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel269
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '269'
  - number: '272'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 268–271][ref1] omschreven misdrijven kan ontzetting van de in
      [artikel 32][ref2] N°. 4 vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 272bis
    text: |-
      Hij, die bij onherroepelijk geworden rechterlijke uitspraak veroordeeld zijnde om aan iemand levensonderhoud te
      verschaffen of om een bepaald bedrag te betalen voor de verzorging en de opvoeding van een minderjarige kind,
      hiermede opzettelijk geheel of gedeeltelijk in gebreke is gebleven gedurende een tijdsverloop van twee maanden,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel272bis
  - number: 272ter
    text: |-
      Hij, aan wiens schuld te wijten is, dat hij, bij onherroepelijk geworden rechterlijke uitspraak veroordeeld zijnde
      om aan iemand levensonderhoud te verschaffen of om een bepaald bedrag te betalen voor de verzorging en de opvoeding
      van een minderjarig kind, hiermede geheel of gedeeltelijk in gebreke is gebleven gedurende een tijdsverloop van
      twee maanden, wordt gestraft met hechtenis van ten hoogste zes maanden of met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel272ter
  - number: 272quater
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel272quater
  - number: '273.1'
    text: |-
      Hij die opzettelijk iemands eer of goeden naam aanrandt door telastlegging van een bepaald feit, met het kennelijk
      doel om daaraan ruchtbaarheid te geven, wordt, als schuldig aan smaad, gestraft met gevangenisstraf van ten hoogste
      zes maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel273
  - number: '273.2'
    text: |-
      Indien dit geschiedt door middel van geschriften of afbeeldingen, verspreid, openlijk ten toon gesteld of
      aangeslagen, wordt de dader, als schuldig aan smaadschrift, gestraft met gevangenisstraf van ten hoogste een jaar
      of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel273
  - number: '273.3'
    text: |-
      Noch smaad, noch smaadschrift bestaat voor zoover de dader klaarblijkelijk heeft gehandeld in het algemeen belang
      of tot noodzakelijke verdediging.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel273
  - number: '274'
    text: |-
      Hij die het misdrijf van smaad of smaadschrift pleegt ingeval het bewijs der waarheid van het te laste gelegde
      feit is toegelaten, wordt, indien hij dat bewijs niet levert en de telastlegging tegen beter weten is geschied, als
      schuldig aan laster, gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel274
  - number: '275'
    text: 'Het bewijs der waarheid van het te laste gelegde feit wordt alleen toegelaten in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel275
  - number: 275.1°
    text: |-
      wanneer de rechter het onderzoek naar de waarheid noodig acht ter beoordeling van de bewering van den beklaagde dat
      hij in het algemeen belang of tot noodzakelijke verdediging gehandeld heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel275
  - number: 275.2°
    text: wanneer aan een ambtenaar een feit begaan in de uitoefening zijner bediening wordt te laste gelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel275
  - number: '276'
    text: |-
      Het in [artikel 275][ref1] bedoeld bewijs is niet toegelaten, indien het te laste gelegde feit niet dan op klachte
      kan worden vervolgd en geene klachte is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel275
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '275'
  - number: '277'
    text: |-
      Indien de beleedigde aan het te laste gelegde feit bij rechterlijk gewijsde onherroepelijk is schuldig verklaard,
      is veroordeeling wegens laster uitgesloten. Indien hij van het te laste gelegde feit bij rechterlijk gewijsde
      onherroepelijk is vrijgesproken, wordt dat gewijsde als volkomen bewijs der onwaarheid van het feit aangemerkt.
      Indien tegen den beleedigde wegens het hem te laste gelegde feit eene strafvervolging is aangevangen, wordt de
      vervolging wegens laster geschorst totdat bij gewijsde onherroepelijk over het te laste gelegde feit is beslist.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel277
  - number: '278'
    text: |-
      Elke opzettelijke beleediging die niet het karakter van smaad of smaadschrift draagt, iemand hetzij in het openbaar
      mondeling of bij geschrifte, hetzij in zijne tegenwoordigheid mondeling of door feitelijkheden, hetzij door
      toegezonden of aangeboden geschrift, aangedaan, wordt, als eenvoudige beleediging, gestraft met gevangenisstraf van
      ten hoogste drie maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel278
  - number: '279'
    text: |-
      De in de voorgaande artikelen van deze titel bepaalde straffen kunnen met een derde worden verhoogd, indien de
      belediging wordt aangedaan aan:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel279
  - number: 279.1°
    text: de Koning, de echtgenoot van de Koning, de vermoedelijke opvolger van de Koning, diens echtgenoot, of de Regent;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel279
  - number: 279.2°
    text: |-
      een ambtenaar gedurende of ter zake van de rechtmatige uitoefening van zijn bediening, met uitzondering van leden
      van algemeen vertegenwoordigende lichamen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel279
  - number: '280'
    text: |-
      Hij die opzettelijk tegen een bepaald persoon bij de overheid een valsche klacht of aangifte schriftelijk inlevert
      of in geschrift doet brengen, waardoor de eer of goede naam van dien persoon wordt aangerand, wordt, als schuldig
      aan lasterlijke aanklacht, gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel280
  - number: '281'
    text: |-
      Hij die opzettelijk door eenige handeling een ander valschelijk onder verdenking brengt eenig strafbaar feit te
      hebben gepleegd, wordt, als schuldig aan lasterlijke verdachtmaking, gestraft met gevangenisstraf van ten hoogste
      drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel281
  - number: '282.1'
    text: |-
      Belediging, strafbaar krachtens deze titel, wordt niet vervolgd dan op klacht van hem tegen wie het misdrijf is
      gepleegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel282
  - number: '282.2'
    text: |-
      Het eerste lid is niet van toepassing op de gevallen voorzien in [artikel 279][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel279
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '279'
  - number: '282.3'
    text: |-
      Het eerste lid is tevens niet van toepassing in geval van belediging van leden van algemeen vertegenwoordigende
      lichamen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel282
  - number: '283'
    text: |-
      Hij die ten aanzien van een overledene een feit pleegt dat, ware deze nog in leven, als smaadschrift of smaad
      zou zijn gekenmerkt, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de eerste
      categorie. Dit misdrijf wordt niet vervolgd dan op klachte hetzij van een der bloedverwanten of aangehuwden van den
      overledene in de rechte linie of zijlinie tot den tweeden graad, hetzij van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel283
  - number: '284.1'
    text: |-
      Hij die een geschrift of afbeelding van beleedigenden of voor een overledene smadelijken inhoud, met het oogmerk
      om aan den beleedigenden of smadelijken inhoud ruchtbaarheid te geven of de ruchtbaarheid daarvan te vermeerderen,
      verspreidt, openlijk ten toon stelt of aanslaat, wordt gestraft met gevangenisstraf van ten hoogste eene maand of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel284
  - number: '284.2'
    text: |-
      Dit misdrijf wordt niet vervolgd dan op klachte van de in [artikel 282][ref1] en het
      [tweede lid van artikel 283][ref2] aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel282
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel283
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '282'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '283'
  - number: 284a
    text: |-
      Bij veroordeeling wegens een der misdrijven, omschreven in de [artikelen 274][ref1], [280][ref2], [281][ref3] en
      [284][ref4], kan ontzetting van de in [artikel 32][ref5] vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel280
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel281
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel284
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel284a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '274'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '280'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '281'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '284'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '285'
    text: |-
      Hij die opzettelijk eenig geheim, hetwelk hij, uit hoofde van zijn hetzij tegenwoordig hetzij vroeger ambt of
      beroep, verplicht is te bewaren, bekend maakt, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de tweede categorie. Indien dit misdrijf tegen een bepaald persoon gepleegd is, wordt het slechts
      vervolgd op diens klachte.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel285
  - number: '286.1'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft hij die
      opzettelijk
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286
  - number: 286.1.1°
    text: |-
      aangaande een onderneming van handel, nijverheid of dienstverlening bij welke hij werkzaam is of is geweest,
      bijzonderheden waarvan hem geheimhouding is opgelegd, bekend maakt of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286
  - number: 286.1.2°
    text: |-
      gegevens die door misdrijf zijn verkregen uit een geautomatiseerd werk van een onderneming van handel, nijverheid
      of dienstverlening en die betrekking hebben op deze onderneming, bekend maakt of uit winstbejag gebruikt, indien
      deze gegevens ten tijde van de bekendmaking of het gebruik niet algemeen bekend waren en daaruit enig nadeel kan
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286
  - number: '286.2'
    text: Niet strafbaar is hij die te goeder trouw heeft kunnen aannemen dat het algemeen belang de bekendmaking vereiste.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286
  - number: '286.3'
    text: Geen vervolging heeft plaats dan op klacht van het bestuur van de onderneming.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286
  - number: 286a
    text: |-
      De persoon werkzaam bij enige instelling van vervoer die een aan zodanige instelling toevertrouwde brief, gesloten
      stuk of pakket opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander bekendmaakt,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286a
  - number: 286b.1
    text: |-
      De persoon werkzaam bij enige openbare instelling van vervoer die een aan zodanige instelling toevertrouwde brief,
      briefkaart, stuk of pakket opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt, wegmaakt, zich
      toeeigent, of de inhoud wijzigt of enig daarin gesloten voorwerp zich toeeigent, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286b
  - number: 286b.2
    text: |-
      Indien zodanig stuk of voorwerp geldswaarde heeft, wordt de toe-eigening gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286b
  - number: 286c
    text: 'De persoon belast met de dienst van een ten algemenen nutte gebezigde telegraafinrichting wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286c
  - number: 286c.a
    text: |-
      met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien hij
      de inhoud van een aan zodanige inrichting toevertrouwd bericht opzettelijk en wederrechtelijk aan een ander
      bekendmaakt of een telegram opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander
      bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286c
  - number: 286c.b
    text: |-
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie, indien hij een aan zodanige
      inrichting toevertrouwd bericht of een telegram opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt,
      wegmaakt, zich toeeigent of de inhoud wijzigt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286c
  - number: 286d.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie wordt gestraft de
      persoon werkzaam bij een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286d.1.a
    text: |-
      die opzettelijk en wederrechtelijk van gegevens kennisneemt die door tussenkomst van zodanig netwerk of zodanige
      dienst zijn opgeslagen, worden verwerkt of overgedragen en die niet voor hem zijn bestemd, zodanige gegevens voor
      zichzelf of een ander overneemt, aftapt of opneemt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286d.1.b
    text: |-
      die de beschikking heeft over een voorwerp waaraan, naar hij weet of redelijkerwijs moet vermoeden, een gegeven kan
      worden ontleend, dat door wederrechtelijk overnemen, aftappen of opnemen van zodanige gegevens is verkregen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286d.1.c
    text: die opzettelijk en wederrechtelijk de inhoud van zodanige gegevens aan een ander bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286d.1.d
    text: |-
      die opzettelijk en wederrechtelijk een voorwerp waaraan een gegeven omtrent de inhoud van zodanige gegevens kan
      worden ontleend, ter beschikking stelt van een ander.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286d.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de persoon werkzaam bij een aanbieder van een niet-openbaar
      telecommunicatienetwerk of een niet-openbare telecommunicatiedienst.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286d
  - number: 286e
    text: |-
      Enig in de [artikelen 286a tot en met 286d][ref1] bedoeld persoon die opzettelijk toelaat dat een ander een der in
      deze artikelen vermelde feiten pleegt, of die ander daarbij als medeplichtige ter zijde staat, wordt gestraft met
      de straffen en naar de onderscheidingen in die bepalingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel286a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286e
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 286a
  - number: 286f.1
    text: |-
      Als schuldig aan mensenhandel wordt met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.1°
    text: |-
      degene die een ander door dwang, geweld of een andere feitelijkheid of door dreiging met geweld of een andere
      feitelijkheid, door afpersing, fraude, misleiding dan wel door misbruik van uit feitelijke omstandigheden
      voortvloeiend overwicht, door misbruik van een kwetsbare positie of door het geven of ontvangen van betalingen of
      voordelen om de instemming van een persoon te verkrijgen die zeggenschap over die ander heeft, werft, vervoert,
      overbrengt, huisvest of opneemt, met het oogmerk van uitbuiting van die ander of de verwijdering van diens organen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.2°
    text: |-
      degene die een ander werft, vervoert, overbrengt, huisvest of opneemt, met het oogmerk van uitbuiting van die ander
      of de verwijdering van diens organen, terwijl die ander de leeftijd van achttien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.3°
    text: |-
      degene die een ander aanwerft, medeneemt of ontvoert met het oogmerk die ander in een ander land ertoe te brengen
      zich beschikbaar te stellen tot het verrichten van seksuele handelingen met of voor een derde tegen betaling;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.4°
    text: |-
      degene die een ander met een van de onder 1° genoemde middelen dwingt of beweegt zich beschikbaar te stellen tot
      het verrichten van arbeid of diensten of zijn organen beschikbaar te stellen dan wel onder de onder 1° genoemde
      omstandigheden enige handeling onderneemt waarvan hij weet of redelijkerwijs moet vermoeden dat die ander zich
      daardoor beschikbaar stelt tot het verrichten van arbeid of diensten of zijn organen beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.5°
    text: |-
      degene die een ander ertoe brengt zich beschikbaar te stellen tot het verrichten van seksuele handelingen met of
      voor een derde tegen betaling of zijn organen tegen betaling beschikbaar te stellen dan wel ten aanzien van een
      ander enige handeling onderneemt waarvan hij weet of redelijkerwijs moet vermoeden dat die ander zich daardoor
      beschikbaar stelt tot het verrichten van die handelingen of zijn organen tegen betaling beschikbaar stelt, terwijl
      die ander de leeftijd van achttien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.6°
    text: degene die opzettelijk voordeel trekt uit de uitbuiting van een ander;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.7°
    text: |-
      degene die opzettelijk voordeel trekt uit de verwijdering van organen van een ander, terwijl hij weet of
      redelijkerwijs moet vermoeden dat diens organen onder de onder 1° bedoelde omstandigheden zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.8°
    text: |-
      degene die opzettelijk voordeel trekt uit seksuele handelingen van een ander met of voor een derde tegen betaling
      of de verwijdering van diens organen tegen betaling, terwijl die ander de leeftijd van achttien jaren nog niet
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.1.9°
    text: |-
      degene die een ander met een van de onder 1° genoemde middelen dwingt dan wel beweegt hem te bevoordelen uit de
      opbrengst van diens seksuele handelingen met of voor een derde of van de verwijdering van diens organen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.2
    text: |-
      Uitbuiting omvat ten minste uitbuiting van een ander in de prostitutie, andere vormen van seksuele uitbuiting,
      gedwongen of verplichte arbeid of diensten, slavernij en met slavernij of dienstbaarheid te vergelijken praktijken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.3
    text: |-
      De schuldige wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde
      categorie, indien:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.3.1°
    text: de feiten, omschreven in het eerste lid, worden gepleegd door twee of meer verenigde personen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.3.2°
    text: |-
      de persoon ten aanzien van wie de in het eerste lid omschreven feiten worden gepleegd, de leeftijd van zestien
      jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.4
    text: |-
      De feiten, omschreven in het eerste lid, gepleegd door twee of meer verenigde personen onder de omstandigheid,
      bedoeld in het derde lid, onder 2°, worden gestraft met gevangenisstraf van ten hoogste achttien jaren of geldboete
      van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.5
    text: |-
      Indien een van de in het eerste lid omschreven feiten zwaar lichamelijk letsel ten gevolge heeft of daarvan
      levensgevaar voor een ander te duchten is, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste dertig
      jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.6
    text: |-
      Indien een van de in het eerste lid omschreven feiten de dood ten gevolge heeft, wordt gevangenisstraf van ten
      hoogste vijftien jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
  - number: 286f.7
    text: |-
      [Artikel 261][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel261
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel286f
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '261'
  - number: '287'
    text: |-
      Hij die voor eigen of vreemde rekening slavenhandel drijft of opzettelijk daaraan middellijk of onmiddellijk
      deelneemt, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel287
  - number: '288'
    text: |-
      Hij die als schipper dienst neemt of dienst doet op een vaartuig, wetende dat het tot het drijven van slavenhandel
      bestemd is, of het daartoe gebruikende, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren. Indien het
      vervoer den dood van een of meer slaven ten gevolge heeft, wordt de schipper gestraft met gevangenisstraf van ten
      hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel288
  - number: '289'
    text: |-
      Hij die als schepeling dienst neemt op een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is of
      gebruikt wordt, of vrijwillig in dienst blijft na die bestemming of dit gebruik te hebben vernomen, wordt gestraft
      met gevangenisstraf van ten hoogste negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel289
  - number: '290'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel290
  - number: '291'
    text: |-
      Hij die iemand uit de plaats van diens inwoning of van diens tijdelijk verblijf wegvoert, met het oogmerk om hem
      wederrechtelijk onder zijne of eens anders macht te brengen of hem in hulpeloozen toestand te verplaatsen, wordt
      als schuldig aan menschenroof, gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel291
  - number: '292.1'
    text: |-
      Hij die opzettelijk een minderjarige onttrekt aan het wettig over hem gesteld gezag of aan het opzicht van degene
      die dit desbevoegd over hem uitoefent, wordt gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel292
  - number: '292.2'
    text: |-
      Gevangenisstraf van ten hoogste negen jaren wordt opgelegd, indien list, geweld of bedreiging met geweld is
      gebezigd, of indien de minderjarige beneden de twaalf jaren oud is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel292
  - number: '293'
    text: |-
      Hij die opzettelijk een minderjarige die onttrokken is of zich onttrokken heeft aan het wettig over hem gesteld
      gezag of aan het opzicht van degene die dit desbevoegd over hem uitoefent, verbergt of aan de nasporing van de
      ambtenaren der justitie of politie onttrekt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of,
      indien de minderjarige beneden de twaalf jaren oud is, met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel293
  - number: '294'
    text: |-
      Als schuldig aan schaking wordt gestraft: 1°. met gevangenisstraf van ten hoogste zes jaren, hij die eene
      minderjarige vrouw, zonder den wil van hare ouders of voogden, doch met hare toestemming wegvoert, met het oogmerk
      om zich haar bezit in of buiten echt te verzekeren; 2°. met gevangenisstraf van ten hoogste negen jaren, hij die
      eene vrouw door list, geweld of bedreiging met geweld wegvoert, met het oogmerk om zich haar bezit in of buiten
      echt te verzekeren. Geene vervolging heeft plaats dan op klachte. De klachte geschiedt: a. indien de vrouw tijdens
      de wegvoering minderjarig is, hetzij door haar zelve, hetzij door iemand wiens toestemming zij tot het aangaan
      van een huwelijk behoeft; b. Indien zij tijdens de wegvoering meerderjarig is, hetzij door haar zelve, hetzij
      door haren echtgenoot. Indien de schaker met de weggevoerde een huwelijk heeft gesloten, heeft geene veroordeeling
      plaats, dan nadat de nietigheid van het huwelijk is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel294
  - number: '295'
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt, wordt gestraft met
      gevangenisstraf van ten hoogste zeven jaren en zes maanden. Indien het feit zwaar lichamelijk letsel ten gevolge
      heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste negen jaren. Indien het feit den dood ten
      gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twaalf jaren. De in dit artikel bepaalde
      straffen zijn ook van toepassing op hem die opzettelijk tot de wederrechtelijke vrijheidsrooving eene plaats
      verschaft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295
  - number: 295ao.1
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt met het oogmerk een ander te
      dwingen iets te doen of niet te doen wordt als schuldig aan gijzeling gestraft met gevangenisstraf van ten hoogste
      vijftien jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295ao
  - number: 295ao.2
    text: |-
      Indien het feit de dood ten gevolge heeft wordt hij gestraft met levenslange gevangenisstraf of tijdelijke van ten
      hoogste vierentwintig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295ao
  - number: 295ao.3
    text: |-
      Het [vierde lid van artikel 295][ref1] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel295
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295ao
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '295'
  - number: 295a.1
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt met een terroristisch oogmerk,
      wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste vierentwintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295a
  - number: 295a.2
    text: |-
      [Artikel 295, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel295
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '295'
  - number: 295b
    text: |-
      De samenspanning tot het in [artikel 295a][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel295a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel295b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 295a
  - number: '296'
    text: |-
      Hij aan wiens schuld te wijten is dat iemand wederrechtelijk van de vrijheid beroofd wordt of beroofd blijft, wordt
      gestraft met hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie. Indien het feit zwaar
      lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met hechtenis van ten hoogste negen maanden.
      Indien het feit den dood ten gevolge heeft, wordt hij gestraft met hechtenis van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel296
  - number: '297.1'
    text: 'Met gevangenisstraf van ten hoogste twee jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel297
  - number: 297.1.1°
    text: |-
      hij die een ander door geweld of eenige andere feitelijkheid of door bedreiging met geweld of eenige andere
      feitelijkheid, gericht hetzij tegen dien ander, hetzij tegen derden, wederrechtelijk dwingt iets te doen, niet te
      doen of te dulden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel297
  - number: 297.1.2°
    text: |-
      hij die een ander door bedreiging met smaad, smaadschrift of valsche aanklacht dwingt iets te doen, niet te doen of
      te dulden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel297
  - number: '297.2'
    text: |-
      In het geval, bedoeld in het eerste lid, onder 2°, wordt het misdrijf niet vervolgd dan op klachte van hem tegen
      wien het gepleegd is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel297
  - number: 297a
    text: |-
      Hij die een ander door bedreiging met diefstal of afpersing van een splijtstof als bedoeld in het Verdrag inzake de
      fysieke beveiliging van kernmateriaal (Trb. 1981, 7) gericht tegen die ander of tegen derden wederrechtelijk dwingt
      iets te doen, niet te doen of te dulden, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden
      of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel297a
  - number: '298.1'
    text: |-
      Bedreiging met openlijk geweld met vereenigde krachten tegen personen of goederen, met geweld tegen een
      internationaal beschermd persoon of diens beschermde goederen, met eenig misdrijf waardoor de algemeene
      veiligheid van personen of goederen in gevaar wordt gebracht, met verkrachting, met feitelijke aanranding van de
      eerbaarheid, met eenig misdrijf tegen het leven gericht, met gijzeling, met zware mishandeling, met mishandeling
      met gebruikmaking van wapenen als bedoeld bij het tweede lid van [artikel 1 van de Wapenwet BES][ref1] of met
      brandstichting, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '1'
  - number: '298.2'
    text: |-
      Indien deze bedreiging schriftelijk en onder eene bepaalde voorwaarde geschiedt, wordt zij gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298
  - number: '298.3'
    text: Bedreiging met een terroristisch misdrijf wordt gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298
  - number: '298.4'
    text: |-
      Indien het feit, omschreven in het eerste, tweede of derde lid, wordt gepleegd met het oogmerk om een terroristisch
      misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met een derde
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298
  - number: 298a.1
    text: |-
      Hij die opzettelijk mondeling, door gebaren, bij geschrift of afbeelding zich jegens een persoon uit, kennelijk om
      diens vrijheid om naar waarheid of geweten ten overstaan van een rechter of ambtenaar een verklaring af te leggen
      te beïnvloeden, terwijl hij weet of ernstige reden heeft te vermoeden dat die verklaring zal worden afgelegd, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298a
  - number: 298a.2
    text: |-
      Met rechter of ambtenaar wordt gelijkgesteld: een rechter bij onderscheidenlijk een persoon in de openbare dienst
      van een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel298a
  - number: '299'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 287 tot en met 295ao][ref1] en in het
      [tweede lid van artikel 298][ref2] omschreven misdrijven, kan ontzetting van de in [artikel 32][ref3], N°. 1–4,
      vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel298
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '298'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '300'
    text: |-
      Hij die opzettelijk een ander van het leven berooft, wordt, als schuldig aan doodslag, gestraft met levenslange
      gevangenisstraf dan wel een tijdelijke gevangenisstraf van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel300
  - number: '301'
    text: |-
      Doodslag gevolgd, vergezeld of voorafgegaan van een strafbaar feit en gepleegd met het oogmerk om de uitvoering van
      dat feit voor te bereiden of gemakkelijk te maken, of om bij betrapping op heeter daad, aan zich zelven of andere
      deelnemers aan dat feit hetzij straffeloosheid hetzij het bezit van het wederrechtelijk verkregene te verzekeren,
      wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel301
  - number: 301a
    text: |-
      Doodslag, gepleegd met een terroristisch oogmerk, wordt gestraft met levenslange gevangenisstraf of tijdelijke
      gevangenisstraf van ten hoogste vierentwintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel301a
  - number: '302'
    text: |-
      Hij die opzettelijk en met voorbedachten rade een ander van het leven berooft, wordt als schuldig aan moord,
      gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel302
  - number: 302a
    text: |-
      De samenspanning tot het in [artikel 302][ref1] omschreven misdrijf, te begaan met een terroristisch oogmerk, wordt
      gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel302
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel302a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '302'
  - number: '303'
    text: |-
      De moeder die, onder de werking van vrees voor de ontdekking van hare bevalling, haar kind bij of kort na de
      geboorte opzettelijk van het leven berooft, wordt, als schuldig aan kinderdoodslag, gestraft met gevangenisstraf
      van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel303
  - number: '304'
    text: |-
      De moeder die, ter uitvoering van een onder de werking van vrees voor de ontdekking van hare aanstaande bevalling
      genomen besluit, haar kind bij of kort na de geboorte opzettelijk van het leven berooft, wordt, als schuldig aan
      kindermoord, gestraft met gevangenisstraf van ten hoogste negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel304
  - number: '305'
    text: |-
      De in de [artikelen 303][ref1] en [304][ref2] omschreven misdrijven worden ten aanzien van anderen, die er aan
      deelnemen, als doodslag of als moord aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel303
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel304
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '303'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '304'
  - number: '306.1'
    text: |-
      Hij die opzettelijk het leven van een ander op diens uitdrukkelijk en ernstig verlangen beëindigt, wordt gestraft
      met een gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel306
  - number: '306.2'
    text: |-
      Het in het eerste lid bedoelde feit is niet strafbaar, indien het is begaan
      door een arts die daarbij voldoet aan de zorgvuldigheidseisen, bedoeld in
      [artikel 2 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref1], en hiervan mededeling
      doet aan de gemeentelijke lijkschouwer overeenkomstig [artikel 7, tweede lid, van de Wet op de lijkbezorging][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel7
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel306
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '7'
  - number: '307.1'
    text: |-
      Hij die opzettelijk een ander tot zelfdoding aanzet, wordt, indien de zelfdoding volgt, gestraft met een
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel307
  - number: '307.2'
    text: |-
      Hij die opzettelijk een ander bij zelfdoding behulpzaam is of hem de middelen daartoe verschaft, wordt, indien de
      zelfdoding volgt, gestraft met een gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
      [Artikel 306, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel306
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel307
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '306'
  - number: '312'
    text: |-
      Bij veroordeeling wegens doodslag, wegens moord of wegens een der in de [artikelen 306, eerste lid][ref1],
      [312a][ref2] en omschreven misdrijven, kan ontzetting van de in [artikel 32][ref3], N°. 1–4, vermelde rechten
      worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel306
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel312a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '306'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 312a
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 312a.1
    text: |-
      Hij die een vrouw een behandeling geeft, terwijl hij weet of redelijkerwijs moet vermoeden dat daardoor
      zwangerschap kan worden afgebroken, wordt gestraft met gevangenisstraf van ten hoogste vier jaar en zes maanden of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312a
  - number: 312a.2
    text: |-
      Indien het feit de dood van de vrouw ten gevolge heeft, wordt gevangenisstraf van ten hoogste zes jaren opgelegd of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312a
  - number: 312a.3
    text: |-
      Indien het feit is begaan zonder toestemming van de vrouw, wordt gevangenisstraf van ten hoogste twaalf jaren
      opgelegd of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312a
  - number: 312a.4
    text: |-
      Indien het feit is begaan zonder toestemming van de vrouw en tevens haar dood ten gevolge heeft, wordt
      gevangenisstraf van ten hoogste vijftien jaren opgelegd of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312a
  - number: 312a.5
    text: |-
      Het in het eerste lid bedoelde feit is niet strafbaar, indien de behandeling is verricht door een arts in een
      ziekenhuis of kliniek waarin zodanige behandeling volgens de [Wet afbreking zwangerschap][ref1] mag worden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel312a
    references:
      - id: ref1
        bwb_id: BWBR0003396
  - number: '313'
    text: |-
      Mishandeling wordt gestraft met gevangenisstraf van ten hoogste vier jaren. Indien het feit zwaar lichamelijk
      letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste acht jaren. Indien
      het feit den dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twaalf jaren. Met
      mishandeling wordt gelijkgesteld opzettelijke benadeling der gezondheid. Poging tot dit misdrijf is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel313
  - number: 313a.1
    text: |-
      Hij die wederrechtelijk stelselmatig inbreuk maakt op eens anders persoonlijke levenssfeer met het oogmerk die
      ander te dwingen iets te doen, niet te doen of te dulden dan wel vrees aan te jagen, wordt als schuldig aan
      belaging, gestraft met een gevangenisstraf van ten hoogste vier jaren of een geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel313a
  - number: 313a.2
    text: Vervolging vindt niet plaats dan op klacht van hem tegen wie het misdrijf is begaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel313a
  - number: '314'
    text: |-
      Mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste zes jaren. Indien
      het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste twaalf jaren. Indien het feit den dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten
      hoogste zestien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel314
  - number: 314a
    text: |-
      Mishandeling gepleegd met gebruikmaking van wapenen, als bedoeld bij het tweede lid van
      [artikel 1 van de Wapenwet BES][ref1], wordt gestraft met gevangenisstraf van ten hoogste acht jaren. Indien het
      feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twaalf jaren. Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste
      zestien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel314a
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '1'
  - number: 314b
    text: |-
      Mishandeling gepleegd met gebruikmaking van wapenen, als bedoeld bij het
      [tweede lid van artikel 1 van de Wapenwet BES][ref1] en met voorbedachten rade, wordt gestraft met gevangenisstraf
      van ten hoogste twaalf jaren. Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige
      gestraft met gevangenisstraf van ten hoogste zestien jaren. Indien het feit de dood ten gevolge heeft, wordt hij
      gestraft met gevangenisstraf van ten hoogste vier en twintig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel314b
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '1'
  - number: '315'
    text: |-
      Hij die aan een ander opzettelijk zwaar lichamelijk letsel toebrengt, wordt, als schuldig aan zware mishandeling,
      gestraft met gevangenisstraf van ten hoogste zestien jaren. Indien het feit den dood ten gevolge heeft, wordt de
      schuldige gestraft met gevangenisstraf van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel315
  - number: '316'
    text: |-
      Zware mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste vier
      en twintig jaren. Indien het feit den dood ten gevolge heeft, wordt de schuldige gestraft met levenslange
      gevangenisstraf dan wel een tijdelijke gevangenisstraf van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel316
  - number: '317'
    text: |-
      De in de [artikelen 313–316][ref1] bepaalde straffen kunnen met een derde worden verhoogd:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel313
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '313'
  - number: 317.1°
    text: |-
      ten aanzien van den schuldige die het misdrijf begaat tegen zijne moeder, zijne wettigen vader, zijn echtgenoot of
      zijn kind;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel317
  - number: 317.2°
    text: |-
      indien het misdrijf wordt gepleegd tegen een ambtenaar gedurende of ter zake van de rechtmatige uitoefening zijner
      bediening;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel317
  - number: 317.3°
    text: indien het misdrijf wordt gepleegd door toediening van voor het leven of de gezondheid schadelijke stoffen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel317
  - number: '318'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 314][ref1] en [316][ref2] omschreven misdrijven kan ontzetting
      van de in [artikel 32][ref3], no. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel314
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel316
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '314'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '316'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 318a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 315][ref1] en [316][ref2], is begaan met een terroristisch
      oogmerk, kan levenslange gevangenisstraf of tijdelijke van ten hoogste vierentwintig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel315
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel316
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel318a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '315'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '316'
  - number: 318b
    text: |-
      De samenspanning tot het in [artikel 316][ref1] omschreven misdrijf, te begaan met een terroristisch oogmerk, wordt
      gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel316
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel318b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '316'
  - number: '319'
    text: |-
      Zij die opzettelijk deelnemen aan een aanval of vechterij waarin onderscheiden personen zijn gewikkeld, worden,
      behoudens ieders verantwoordelijkheid voor de bijzondere door hem bedreven feiten, gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel319
  - number: 319.1°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren, indien de aanval of vechterij alleen zwaar lichamelijk letsel ten
      gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel319
  - number: 319.2°
    text: met gevangenisstraf van ten hoogste drie jaren, indien de aanval of vechterij iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel319
  - number: '320'
    text: |-
      Hij aan wiens schuld de dood van een ander te wijten is, wordt gestraft met gevangenisstraf of hechtenis van
      ten hoogste negen maanden. Indien de dood, bij gelegenheid van een botsing, aan- of overrijding met een door de
      schuldige bestuurd motorrijtuig, of bij gelegenheid van enige handeling ter voorkoming van een botsing met of aan
      of overrijding door dat motorrijtuig, veroorzaakt is door de botsing, aan- of overrijding dan wel door de handeling
      ter voorkoming daarvan, wordt degene, aan wiens schuld die dood te wijten is, gestraft met gevangenisstraf van ten
      hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel320
  - number: '321'
    text: |-
      Hij aan wiens schuld te wijten is dat een ander zwaar lichamelijk letsel bekomt of zoodanig lichamelijk letsel
      waaruit tijdelijke ziekte of verhindering in de uitoefening zijner ambts- of beroepsbezigheden ontstaan, wordt
      gestraft met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie. Indien
      het letsel, bij gelegenheid van een botsing, aan- of overrijding met een door de schuldige bestuurd motorrijtuig,
      of bij gelegenheid van enige handeling ter voorkoming van een botsing met of aan- of overrijding door dat
      motorrijtuig, veroorzaakt is door de botsing, aan of overrijding dan wel door de handeling ter voorkoming daarvan,
      wordt degene, aan wiens schuld dat letsel te wijten is, gestraft met gevangenisstraf van ten hoogste achttien
      maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel321
  - number: 321a
    text: |-
      Indien de schuldige, in de gevallen bedoeld in het [tweede lid van artikel 320][ref1] of het
      [tweede lid van artikel 321][ref2], tijdens het ongeval onder zodanige invloed van het gebruik van alcoholhoudende
      drank verkeerde, dat hij niet in staat moest worden geacht het motorrijtuig naar behoren te besturen, wordt hij
      gestraft, in het geval bedoeld bij het tweede lid van artikel 320 met gevangenisstraf van ten hoogste zes jaren, en
      in het geval bedoeld bij het tweede lid van artikel 321 met gevangenisstraf van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel320
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel321
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel321a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '320'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '321'
  - number: '322'
    text: |-
      Indien de in dezen Titel omschreven misdrijven worden gepleegd in de uitoefening van eenig ambt of beroep, kan de
      straf met een derde worden verhoogd, kan ontzetting worden uitgesproken van de uitoefening van het beroep waarin
      het misdrijf is gepleegd en kan de rechter de openbaarmaking zijner uitspraak gelasten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel322
  - number: '323'
    text: |-
      Hij die eenig goed dat geheel of ten deele aan een ander toebehoort, wegneemt, met het oogmerk om het zich
      wederrechtelijk toe te eigenen, wordt, als schuldig aan diefstal, gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel323
  - number: '324'
    text: 'Met gevangenisstraf van ten hoogste zes jaren wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.1°
    text: diefstal van vee uit de weide;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.2°
    text: |-
      diefstal bij gelegenheid van brand, ontploffing, watersnood, schipbreuk, stranding, spoorwegongeval, oproer,
      muiterij of oorlogsnood;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.3°
    text: diefstal van een motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.4°
    text: diefstal door twee of meer vereenigde personen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.5°
    text: |-
      diefstal waarbij de schuldige zich den toegang tot de plaats des misdrijf heeft verschaft of het weg te nemen goed
      onder zijn bereik heeft gebracht door middel van braak, verbreking of inklimming, van valsche sleutels, van een
      valsche order of een valsch kostuum.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324.6°
    text: diefstal met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijker te maken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324
  - number: 324a.1
    text: |-
      Met gevangenisstraf van ten hoogste twaalf jaren wordt gestraft diefstal in een woning of op een bij een woning
      behorend erf, door iemand die zich aldaar buiten weten of tegen de wil van de rechthebbende bevindt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324a
  - number: 324a.2
    text: |-
      Indien de in het eerste lid omschreven diefstal vergezeld gaat van een der in
      [artikel 324, onderdelen 4 en 5][ref1], vermelde omstandigheden, wordt gevangenisstraf van ten hoogste zestien
      jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel324
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel324a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '324'
  - number: '325.1'
    text: |-
      Met gevangenisstraf van ten hoogste vier en twintig jaren wordt gestraft diefstal, voorafgaande, vergezeld of
      gevolgd van geweld of bedreiging met geweld tegen personen, gepleegd met het oogmerk om dien diefstal voor te
      bereiden of gemakkelijk te maken, of om, bij betrapping op heeter daad, aan zich zelven of andere deelnemers aan
      het misdrijf hetzij de vlucht mogelijk te maken, hetzij het bezit van het gestolene te verzekeren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel325
  - number: '325.2'
    text: |-
      Levenslange gevangenisstraf dan wel een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren wordt
      opgelegd:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel325
  - number: 325.2.1°
    text: indien het feit den dood ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel325
  - number: 325.2.2°
    text: indien het feit wordt gepleegd met het oogmerk een terroristisch misdrijf voor te bereiden of gemakkelijk te maken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel325
  - number: '326'
    text: |-
      Bij veroordeeling wegens diefstal kan ontzetting van de in [artikel 32][ref1], N°. 1–4, vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '327'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel327
  - number: '328'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel328
  - number: '329'
    text: |-
      Indien de dader van of medeplichtige aan een der in dezen Titel omschreven misdrijven de niet van tafel en bed of
      van goederen gescheiden echtgenoot is van hem tegen wien het misdrijf is gepleegd, is de strafvervolging tegen dien
      dader of dien medeplichtige uitgesloten. Indien hij zijn van tafel en bed of van goederen gescheiden echtgenoot
      is of zijn bloed- of aanverwant, hetzij in de rechte linie, hetzij in den tweeden graad der zijlinie, heeft de
      vervolging, voor zoover hem betreft, alleen plaats op eene tegen hem gerichte klachte van dengene tegen wien het
      misdrijf is gepleegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel329
  - number: '330.1'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen, door geweld of bedreiging met geweld
      iemand dwingt hetzij tot de afgifte van eenig goed, dat geheel of ten deele aan dezen of aan een derde toebehoort,
      hetzij tot het aangaan van ene schuld of het tenietdoen van eene inschuld, wordt, als schuldig aan afpersing,
      gestraft met gevangenisstraf van ten hoogste vier en twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel330
  - number: '330.2'
    text: |-
      Levenslange gevangenisstraf dan wel een tijdelijke gevangenisstraf van het hoogste vier en twintig jaren wordt
      opgelegd, indien het feit de dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel330
  - number: '330.3'
    text: |-
      De bepalingen van [artikel 325, tweede lid][ref1], zijn op dit misdrijf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel325
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel330
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '325'
  - number: '331.1'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen, door bedreiging hetzij met smaad,
      smaadschrift of openbaring van een geheim, hetzij met klachte of aangifte van een strafbaar feit bij de overheid,
      iemand dwingt hetzij tot de afgifte van eenig goed dat geheel of ten deele aan dezen of aan een derde toebehoort,
      hetzij tot het aangaan van eene schuld of het tenietdoen van eene inschuld, wordt, als schuldig aan afdreiging,
      gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel331
  - number: '331.2'
    text: |-
      Indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel331
  - number: '331.3'
    text: Dit misdrijf wordt niet vervolgd dan op klachte van hem tegen wien het gepleegd is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel331
  - number: '332'
    text: |-
      De bepaling van [artikel 329][ref1] is op de in dezen Titel omschreven misdrijven van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel329
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel332
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '329'
  - number: '333'
    text: |-
      Bij veroordeling wegens een der in dezen Titel omschreven misdrijven, kan ontzetting van de in [artikel 32][ref1],
      N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel333
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '334'
    text: |-
      Hij die opzettelijk eenig goed dat geheel of ten deele aan een ander toebehoort en dat hij anders dan door
      misdrijf onder zich heeft, wederrechtelijk zich toeeigent, wordt, als schuldig aan verduistering, gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel334
  - number: '335'
    text: |-
      Verduistering gepleegd door hem die het goed uit hoofde van zijne persoonlijke dienstbetrekking of van zijn beroep,
      of tegen geldelijke vergoeding onder zich heeft, wordt gestraft met gevangenisstraf van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel335
  - number: 335a
    text: |-
      Indien een der in de [artikelen 334][ref1] en [335][ref2] omschreven feiten wordt gepleegd met het oogmerk om een
      terroristisch misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met
      een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel334
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel335
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel335a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '334'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '335'
  - number: '336'
    text: |-
      Verduistering gepleegd door hem wien het goed uit noodzaak in bewaring is gegeven, of door voogden, curators,
      bewindvoerders, uitvoerders van uiterste wilsbeschikkingen of beheerders van verenigingen of van stichtingen, ten
      opzichte van eenig goed dat zij als zoodanig onder zich hebben, wordt gestraft met gevangenisstraf van ten hoogste
      vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel336
  - number: 336a
    text: |-
      Hij die opzettelijk en wederrechtelijk een subsidie die met een bepaald doel door of vanwege de Europese
      Gemeenschappen is verstrekt, aanwendt voor andere doeleinden dan waarvoor zij is verstrekt, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel336a
  - number: '337'
    text: |-
      De bepaling van [artikel 329][ref1] is op de in dezen Titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel329
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel337
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '329'
  - number: '338.1'
    text: |-
      Bij veroordeeling wegens een der in dezen Titel omschreven misdrijven, kan de rechter de openbaarmaking zijner
      uitspraak gelasten en ontzetting uitspreken van de in [artikel 32][ref1], N°. 1–4, vermelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel338
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '338.2'
    text: Indien de schuldige het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel338
  - number: '339.1'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen, hetzij door het aannemen van een
      valsche naam of van een valsche hoedanigheid, hetzij door listige kunstgrepen, hetzij door een samenweefsel van
      verdichtsels, iemand beweegt tot de afgifte van eenig goed of tot het aangaan van eene schuld of het tenietdoen van
      eene inschuld, wordt, als schuldig aan oplichting, gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339
  - number: '339.2'
    text: |-
      Indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339
  - number: 339a
    text: |-
      Hij, die een beroep of eene gewoonte maakt van het koopen van goederen met het oogmerk om zonder volledige betaling
      zich of een ander de beschikking over die goederen te verzekeren, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339a
  - number: 339b.1
    text: |-
      Hij die, met het oogmerk daarvoor niet volledig te betalen, door een technische ingreep of met behulp van valse
      signalen, gebruik maakt van een dienst die via telecommunicatie aan het publiek wordt aangeboden, wordt gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: 339b.2
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk een voorwerp dat kennelijk is bestemd, of gegevens die kennelijk zijn bestemd, tot het plegen van het
      misdrijf, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: 339b.2.a
    text: openlijk ter verspreiding aanbiedt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: 339b.2.b
    text: ter verspreiding of met het oog op de invoer in Nederland voorhanden heeft of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: 339b.2.c
    text: uit winstbejag vervaardigt of bewaart.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: 339b.3
    text: |-
      Hij die van het plegen van misdrijven als bedoeld in het tweede lid, zijn beroep maakt of het plegen van deze
      misdrijven als bedrijf uitoefent wordt gestraft hetzij met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel339b
  - number: '340'
    text: |-
      Hij die door listige kunstgrepen den verzekeraar in dwaling brengt ten opzichte van omstandigheden tot, de
      verzekering betrekking hebbende, zoodat deze eene overeenkomst sluit die hij niet onder dezelfde voorwaarden
      zou hebben gesloten, indien hij den waren staat van zaken gekend had, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel340
  - number: '341'
    text: |-
      Hij die, met het oogmerk om zich of een ander, ten nadeele van den verzekeraar, wederrechtelijk te bevoordeelen,
      brand sticht of eene ontploffing teweegbrengt in eenig tegen brandgevaar verzekerd goed, of een vaartuig of
      luchtvaartuig, dat verzekerd is of waarvan de zich aan boord bevindende zaken of de te verdienen vracht zijn
      verzekerd, doet zinken, stranden of verongelukken, vernielt, onbruikbaar maakt of beschadigt, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341
  - number: 341bis
    text: |-
      Hij, die, om het handels- of bedrijfsdebiet van zichzelven of van een ander te vestigen, te behouden of uit te
      breiden, eenige bedrieglijke handeling pleegt tot misleiding van het publiek of van een bepaald persoon, wordt,
      indien daaruit eenig nadeel voor concurrenten van hem of van dien ander kan ontstaan, als schuldig aan oneerlijke
      mededinging, gestraft met gevangenisstraf van ten hoogste een jaar, of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341bis
  - number: 341ter.1
    text: |-
      Hij die, anders dan als ambtenaar, werkzaam zijnde in dienstbetrekking of optredend als lasthebber, naar aanleiding
      van hetgeen hij in zijn betrekking of bij de uitvoering van zijn last heeft gedaan of nagelaten dan wel zal doen
      of nalaten, een gift, belofte of dienst aanneemt dan wel vraagt, en dit aannemen of vragen in strijd met de goede
      trouw verzwijgt tegenover zijn werkgever of lastgever, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341ter
  - number: 341ter.2
    text: |-
      Met gelijke straf wordt gestraft hij die aan iemand die, anders dan als ambtenaar, werkzaam is in dienstbetrekking
      of optreedt als lasthebber, naar aanleiding van hetgeen deze in zijn betrekking of bij de uitvoering van zijn
      last heeft gedaan of nagelaten dan wel zal doen of nalaten, een gift of belofte doet dan wel een dienst verleent
      of aanbiedt van die aard of onder zodanige omstandigheden, dat hij redelijkerwijs moet aannemen dat deze de gift,
      belofte of dienst in strijd met de goede trouw zal verzwijgen tegenover zijn werkgever of lastgever.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341ter
  - number: 341quater.1
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft hij die een gift
      of een belofte aanneemt naar aanleiding van hetgeen hij heeft gedaan of nagelaten dan wel zal doen of nalaten in
      verband met een op hem of op de persoon bij wie hij in dienst is, rustende wettelijke plicht tot
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341quater
  - number: 341quater.1.a
    text: het verstrekken van inlichtingen betreffende telecommunicatie aan de ambtenaren van de justitie of politie, dan wel
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341quater
  - number: 341quater.1.b
    text: het verlenen van medewerking aan het aftappen of opnemen van telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341quater
  - number: 341quater.2
    text: |-
      Met gelijke straf wordt gestraft hij die een ander een gift of een belofte doet naar aanleiding van hetgeen deze
      heeft gedaan of nagelaten dan wel zal doen of nalaten in verband met een op hem of op de persoon bij wie hij in
      dienst is, rustende wettelijke plicht als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel341quater
  - number: '342'
    text: 'Met gevangenisstraf van ten hoogste een jaar wordt gestraft de verkooper die den kooper bedriegt:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel342
  - number: 342.1°
    text: door hem die een bepaald aangewezen voorwerp kocht, opzettelijk iets anders daarvoor in de plaats te leveren;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel342
  - number: 342.2°
    text: |-
      ten opzichte van de aard, de hoedanigheid of de hoeveelheid van het geleverde, door het aanwenden van listige
      kunstgrepen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel342
  - number: 342bis
    text: |-
      De houder van een cognossement, die opzettelijk over verschillende exemplaren daarvan onder bezwarenden titel
      beschikt ten behoeve van verschillende verkrijgers, wordt gestraft met gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel342bis
  - number: '343'
    text: |-
      Hij die eet- of drinkwaren of geneesmiddelen verkoopt, te koop aanbiedt of aflevert, wetende dat zij vervalscht
      zijn en die vervalsching verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste drie jaren. Eet- of
      drinkwaren of geneesmiddelen zijn vervalscht, wanneer door bijmenging van vreemde bestanddeelen hunne waarde of
      hunne bruikbaarheid verminderd is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel343
  - number: '344'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren wordt gestraft de aannemer of de bouwmeester van eenig werk of de
      verkooper van bouwmaterialen, die bij de uitvoering van het werk of de levering der materialen eenige bedrieglijke
      handeling pleegt, ten gevolge waarvan de veiligheid van personen of goederen, of de veiligheid van den Staat in
      tijd van oorlog kan worden in gevaar gebracht. Met dezelfde straf wordt gestraft hij die, met het opzicht over het
      werk of over de levering der materialen belast, de bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel344
  - number: '345'
    text: |-
      Hij die, bij levering van benoodigdheden ten dienste van de krijgsmacht, eenige bedrieglijke handeling pleegt,
      ten gevolge waarvan de veiligheid van den Staat in tijd van oorlog kan worden in gevaar gebracht, wordt gestraft
      met gevangenisstraf van ten hoogste zes jaren. Met dezelfde straf wordt gestraft hij die, met het opzicht over de
      levering der goederen belast, de bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel345
  - number: '346'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen, hetgeen tot afbakening der grenzen
      van erven dient, vernielt, verplaatst, verwijdert of onbruikbaar maakt, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel346
  - number: '347'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen, door het verspreiden van een
      logenachtig bericht, den prijs van koopwaren, fondsen of geldwaardig papier doet stijgen of dalen, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel347
  - number: '348'
    text: |-
      Hij die effecten uitgeeft of belast is met of zijn medewerking verleent tot het plaatsen van effecten, het
      publiek tot inschrijving of deelneming tracht te bewegen door het opzettelijk verzwijgen of verminken van ware,
      of voorspiegelen van valse feiten of omstandigheden, wordt gestraft met hetzij een gevangenisstraf van ten hoogste
      vier jaren, hetzij een geldboete van de vijfde categorie, hetzij met beide straffen. Met dezelfde straf wordt
      gestraft de natuurlijke persoon of de bestuurder, beheerende vennoot of commissaris van de vereniging, stichting of
      vennootschap, die het plegen van het feit opzettelijk toelaat. Onder effecten wordt verstaan hetgeen daaronder in
      [artikel 1 van de Wet toezicht effectenbeurzen BES][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel1
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel348
    references:
      - id: ref1
        bwb_id: BWBR0028366
        artikel: '1'
  - number: '349'
    text: |-
      De koopman, de bestuurder, beheerende vennoot of commissaris van eene vennootschap of coöperatie, die opzettelijk
      eene onware staat of eene onware balans, winst- en verliesrekening of toelichting op een van die stukken openbaar
      maakt of zoodanige openbaarmaking opzettelijk toelaat, wordt gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel349
  - number: '350.1'
    text: 'Hij die opzettelijk:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: 350.1.a
    text: valse, vervalste of wederrechtelijk vervaardigde merken,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: 350.1.b
    text: |-
      waren, die zelf of op hun verpakking valselijk zijn voorzien van de handelsnaam van een ander of van het merk
      waarop een ander recht heeft,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: 350.1.c
    text: |-
      waren, die ter aanduiding van herkomst, valselijk van de naam van een bepaalde plaats, met bijvoeging van een
      verdichte handelsnaam, zijn voorzien,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: 350.1.d
    text: |-
      waren, waarop of op de verpakking waarvan een handelsnaam van een ander of een merk waarop een ander recht heeft,
      zij het dan ook met een geringe afwijking, is nagebootst of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: 350.1.e
    text: |-
      waren of onderdelen daarvan die valselijk hetzelfde uiterlijk vertonen als een tekening of model waarop een
      ander recht heeft, dan wel daarmede slechts ondergeschikte verschillen vertonen, invoert, doorvoert of uitvoert,
      verkoopt, te koop aanbiedt, aflevert, uitdeelt of in voorraad heeft, wordt gestraft met gevangenisstraf van ten
      hoogste één jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: '350.2'
    text: |-
      Niet strafbaar is hij die enkele waren, onderdelen daarvan of merken als omschreven in het eerste lid in voorraad
      heeft uitsluitend voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: '350.3'
    text: |-
      Indien de schuldige van het plegen van het misdrijf, genoemd in het eerste lid, zijn beroep maakt of het plegen van
      dit misdrijf als bedrijf uitoefent, wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: '350.4'
    text: |-
      Indien door het plegen van het misdrijf, genoemd in het eerste lid, gemeen gevaar voor personen of goederen te
      duchten is, wordt de schuldige gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel350
  - number: '351'
    text: |-
      De bepaling van [artikel 329][ref1] is op de in dezen Titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel329
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel351
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '329'
  - number: '352'
    text: |-
      Bij veroordeeling wegens een der in dezen Titel omschreven misdrijven, kan de rechter de openbaarmaking zijner
      uitspraak gelasten en de schuldige worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan
      heeft. Bij veroordeeling wegens een der in de [artikelen 339][ref1], [341][ref2], [344][ref3] en [345][ref4]
      omschreven misdrijven, kan ontzetting van de in [artikel 32][ref5], N°. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel341
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel344
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel345
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '339'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '341'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '344'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '345'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '353'
    text: |-
      De koopman die in staat van faillissement is verklaard, wordt, als schuldig aan eenvoudige bankbreuk, gestraft met
      gevangenisstraf van ten hoogste een jaar:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel353
  - number: 353.1°
    text: indien zijne verteringen buitensporig zijn geweest;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel353
  - number: 353.2°
    text: |-
      indien hij, met het oogmerk om zijn faillissement uit te stellen, wetende dat het daardoor niet kon worden
      voorkomen, op bezwarende voorwaarden geldopnemingen heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel353
  - number: 353.3°
    text: |-
      indien hij de boeken, bescheiden en andere gegevensdragers waarmee hij ingevolge
      [artikel 15a van Boek 3 van het Burgerlijk Wetboek BES][ref1] een administratie gevoerd heeft en de boeken,
      bescheiden en andere gegevensdragers die hij ingevolge dat artikel bewaard heeft, niet in ongeschonden staat te
      voorschijn brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 15a
  - number: '354'
    text: |-
      De koopman die in staat van faillissement is verklaard, wordt, als schuldig aan bedrieglijke bankbreuk, gestraft
      met gevangenisstraf van ten hoogste zes jaren, indien hij ter bedrieglijke verkorting van de rechten zijner
      schuldeischers:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel354
  - number: 354.1°
    text: |-
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij eenig
      goed aan den boedel onttrokken heeft of onttrekt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel354
  - number: 354.2°
    text: eenig goed hetzij om niet, hetzij klaarblijkelijk beneden de waarde heeft vervreemd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel354
  - number: 354.3°
    text: |-
      ter gelegenheid van zijn faillissement of op een tijdstip waarop hij wist dat het faillissement niet kon worden
      voorkomen, een zijner schuldeischers op eenige wijze bevoordeeld heeft of bevoordeelt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel354
  - number: 354.4°
    text: |-
      niet voldaan heeft of niet voldoet aan de op hem rustende verplichtingen ten opzichte van het voeren van een
      administratie ingevolge [artikel 15a van Boek 3 van het Burgerlijk Wetboek BES][ref1], en het bewaren en te
      voorschijn brengen van boeken, bescheiden en gegevensdragers in dat artikel bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel354
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 15a
  - number: '355'
    text: |-
      De bestuurder of commissaris eener naamlooze vennootschap of besloten vennootschap welke in staat van faillissement
      is verklaard, wordt gestraft met gevangenisstraf van ten hoogste een jaar:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel355
  - number: 355.1°
    text: |-
      indien hij heeft medegewerkt of zijne toestemming gegeven tot eenige handeling, in strijd met eenige wettelijke
      bepaling van de akte van oprichting, waaraan de door de vennootschap geleden verliezen geheel of grotendeels zijn
      te wijten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel355
  - number: 355.2°
    text: |-
      indien hij, met het oogmerk om het faillissement der vennootschap uit te stellen, wetende dat het daardoor niet
      kan worden voorkomen, heeft medegewerkt of zijn toestemming gegeven tot het doen van geldopnemingen op bezwarende
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel355
  - number: 355.3°
    text: |-
      indien aan hem te wijten is, dat aan de in [artikel 15a, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1]
      omschreven verplichtingen niet is voldaan of dat de boeken, bescheiden en andere gegevensdragers, waarmee volgens
      dat artikel administratie gevoerd is, en de boeken, bescheiden en andere gegevensdragers die ingevolge dat artikel
      zijn bewaard, niet in ongeschonden staat worden te voorschijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 15a
  - number: '356'
    text: |-
      De bestuurder of commissaris eener naamlooze vennootschap of besloten vennootschap welke in staat van faillissement
      is verklaard, wordt gestraft met gevangenisstraf van ten hoogste zes jaren, indien hij ter bedrieglijke verkorting
      van de rechten der schuldeischers van de vennootschap:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel356
  - number: 356.1°
    text: |-
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij eenig
      goed aan den boedel onttrokken heeft of onttrekt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel356
  - number: 356.2°
    text: eenig goed hetzij om niet, hetzij klaarblijkelijk beneden de waarde heeft vervreemd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel356
  - number: 356.3°
    text: |-
      ter gelegenheid van het faillissement of op een tijdstip waarop hij wist dat het faillissement niet kon worden
      voorkomen, een der schuldeischers op eenige wijze bevoordeeld heeft of bevoordeelt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel356
  - number: 356.4°
    text: |-
      niet voldaan heeft of niet voldoet aan de op hem rustende verplichtingen ten opzichte van het voeren van een
      administratie ingevolge [artikel 15a van Boek 3 van het Burgerlijk Wetboek BES][ref1], en het bewaren en te
      voorschijn brengen van boeken, bescheiden en gegevensdragers in dat artikel bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel356
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 15a
  - number: '357'
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren en zes maanden wordt gestraft hij die ter bedrieglijke verkorting
      van de rechten der schuldeischers:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel357
  - number: 357.1°
    text: |-
      ingeval van faillissement of in het vooruitzicht daarvan, indien het faillissement is gevolgd, enig goed aan de
      boedel onttrekt of betaling aanneemt, hetzij van een niet opeisbare schuld, hetzij van een opeisbare schuld, in het
      laatste geval wetende, dat het faillissement van de schuldenaar reeds was aangevraagd of ten gevolge van overleg
      met de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel357
  - number: 357.2°
    text: |-
      bij verificatie der schuldvorderingen in geval van faillissement, eene niet bestaande schuldvordering voorwendt of
      eene bestaande tot een verhoogd bedrag doet gelden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel357
  - number: '358'
    text: |-
      De schuldeischer die tot een aangeboden gerechtelijk akkoord toetreedt tengevolge van eene overeenkomst hetzij
      met den schuldenaar, hetzij met een derde, waarbij hij bijzondere voordeelen heeft bedongen, wordt, in geval van
      aanneming van het akkoord, gestraft met gevangenisstraf van ten hoogste een jaar. Gelijke straf wordt in hetzelfde
      geval toegepast op den schuldenaar of, indien deze eene vennootschap, vereniging of stichting is, op den bestuurder
      of commissaris, die zoodanige overeenkomst sluit.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel358
  - number: '359'
    text: |-
      Hij die zonder koopman te zijn in staat van faillissement is verklaard, wordt gestraft met gevangenisstraf van ten
      hoogste vier jaren en zes maanden, indien hij, ter bedrieglijke verkorting van de rechten zijner schuldeischers,
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij eenig
      goed aan den boedel onttrokken heeft of onttrekt, hetzij eenig goed om niet of klaarblijkelijk beneden de waarde
      heeft vervreemd, hetzij ter gelegenheid van zijn faillissement, of op een tijdstip waarop hij wist, dat het niet
      kon worden voorkomen een zijner schuldeischers op eenige wijze bevoordeeld heeft of bevoordeelt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel359
  - number: '360'
    text: |-
      De bestuurder of commissaris eener naamlooze vennootschap of besloten vennootschap die, buiten het geval van
      [artikel 335][ref1], zijne medewerking heeft verleend of zijne toestemming gegeven tot eenige handeling in strijd
      met eenige wettelijke bepaling van de akte van oprichting, ten gevolge waarvan de vennootschap of vereniging
      ernstig nadeel ondervindt, wordt gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel335
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel360
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '335'
  - number: '361'
    text: |-
      Hij die opzettelijk zijn eigen goed of, ten behoeve van degene aan wie het toebehoort, een hem niet toebehorend
      goed onttrekt aan een pandrecht, een retentierecht of een recht van vruchtgebruik of gebruik van een ander, wordt
      gestraft met een gevangenisstraf van ten hoogste een jaar en zes maanden. Met dezelfde straf wordt gestraft hij
      die opzettelijk een goed dat is onderworpen aan een pandrecht, een retentierecht of een recht van vruchtgebruik of
      gebruik van een ander, vernielt, beschadigt of onbruikbaar maakt. De bepaling van [artikel 329][ref1] is op deze
      misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel329
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel361
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '329'
  - number: '362'
    text: |-
      Bij veroordeeling wegens een der in [artikelen 354][ref1], [356][ref2], [357][ref3] en [359][ref4] omschreven
      misdrijven, kan de schuldige worden ontzet van de in [artikel 32][ref5], N°. 1–4, vermelde rechten. Bij
      veroordeeling wegens een der in de [artikelen 353–359][ref6] omschreven misdrijven, kan openbaarmaking van de
      rechterlijke uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel354
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel356
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel357
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel359
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0028570#Artikel353
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel362
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '354'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '356'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '357'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '359'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '32'
      - id: ref6
        bwb_id: BWBR0028570
        artikel: '353'
  - number: '363'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel363
  - number: '364'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel364
  - number: '365'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel365
  - number: '366.1'
    text: |-
      Hij die opzettelijk en wederrechtelijk eenig goed dat geheel of ten deele aan een ander toebehoort, vernielt,
      beschadigt, onbruikbaar maakt of wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel366
  - number: '366.2'
    text: |-
      Gelijke straf wordt toegepast op hem die opzettelijk en wederrechtelijk een dier dat geheel of ten deele aan een
      ander toebehoort, doodt, beschadigt, onbruikbaar maakt of wegmaakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel366
  - number: '367'
    text: |-
      Hij die opzettelijk en wederrechtelijk hetgeen tot afbakening der grenzen van ervan of perceelen dient, vernielt,
      verplaatst, verwijdert, of onbruikbaar maakt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367
  - number: 367a.1
    text: |-
      Hij die opzettelijk en wederrechtelijk gegevens die door middel van een geautomatiseerd werk of door middel van
      telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, verandert, wist, onbruikbaar of ontoegankelijk
      maakt, dan wel andere gegevens daaraan toevoegt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367a
  - number: 367a.2
    text: |-
      Hij die het feit, bedoeld in het eerste lid, pleegt na door tussenkomst van een openbaar telecommunicatienetwerk,
      wederrechtelijk in een geautomatiseerd werk te zijn binnengedrongen en daar ernstige schade met betrekking tot
      die gegevens veroorzaakt, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367a
  - number: 367a.3
    text: |-
      Hij die opzettelijk en wederrechtelijk gegevens ter beschikking stelt of verspreidt die zijn bestemd om schade aan
      te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367a
  - number: 367a.4
    text: |-
      Niet strafbaar is degene die het feit, bedoeld in het derde lid, pleegt met het oogmerk om schade als gevolg van
      deze gegevens te beperken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367a
  - number: 367b.1
    text: |-
      Hij aan wiens schuld te wijten is dat gegevens die door middel van een geautomatiseerd werk of door middel van
      telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, wederrechtelijk worden veranderd, gewist,
      onbruikbaar of ontoegankelijk gemaakt, dan wel dat andere gegevens daaraan worden toegevoegd, wordt, indien
      daardoor ernstige schade met betrekking tot die gegevens wordt veroorzaakt, gestraft met gevangenisstraf of
      hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367b
  - number: 367b.2
    text: |-
      Hij aan wiens schuld te wijten is dat gegevens wederrechtelijk ter beschikking gesteld of verspreid worden die zijn
      bestemd om schade aan te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf of hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel367b
  - number: '368'
    text: |-
      Hij die spoorweg-, telegraaf-, telefoon- of electriciteitswerken, geautomatiseerde werken of werken voor
      telecommunicatie, werken dienende tot waterkeering of waterloozing, gas- of waterleidingen of riolen, voor zoover
      deze werken, leidingen of riolen ten algemeenen nutte gebezigd worden, opzettelijk en wederrechtelijk vernielt,
      beschadigt of onbruikbaar maakt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel368
  - number: '369'
    text: |-
      Hij aan wiens schuld te wijten is dat eenig in het [vorig artikel][ref1] bedoeld werk, leiding of riool vernield,
      beschadigd of onbruikbaar gemaakt wordt, wordt gestraft met hechtenis van ten hoogste een maand of een geldboete
      van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel368
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel369
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '368'
  - number: '370'
    text: |-
      Hij die opzettelijk en wederrechtelijk eenig gebouw, vaartuig of zijn lading, installatie ter zee of luchtvaartuig
      dat geheel of ten deele aan een ander toebehoort, vernielt of onbruikbaar maakt, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel370
  - number: '371'
    text: |-
      De bepaling van [artikel 329][ref1] is op de in dezen Titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel329
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel371
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '329'
  - number: '372'
    text: |-
      Indien een der in dezen Titel omschreven misdrijven door twee of meer vereenigde personen gepleegd wordt, kan de
      straf met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372
  - number: 372a.1
    text: |-
      Indien een der in de [artikelen 366][ref1], [367a][ref2], [368][ref3] en [370][ref4] omschreven feiten worden
      gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het
      feit gestelde gevangenisstraf met een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel366
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel367a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel368
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel370
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '366'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 367a
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '368'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '370'
  - number: 372a.2
    text: |-
      Indien een feit strafbaar gesteld in de [artikelen 366][ref1], [367a][ref2], [368][ref3] of [370][ref4] is begaan
      met een terroristisch oogmerk, wordt de op het feit gestelde gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel366
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel367a
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel368
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel370
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '366'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 367a
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '368'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '370'
  - number: 372bis
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie worden gestraft de hoofden van
      ministeriële departementen:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372bis
  - number: 372bis.1°
    text: |-
      die hun medeondertekening verlenen aan koninklijke besluiten of koninklijke beschikkingen, wetende dat daardoor de
      [Grondwet][ref1] of andere wetten of algemene maatregelen van inwendig bestuur van de staat worden geschonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372bis
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 372bis.2°
    text: |-
      die uitvoering geven aan koninklijke besluiten of koninklijke beschikkingen, wetende dat deze niet van de vereiste
      medeondertekening van een of meer ministers zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372bis
  - number: 372bis.3°
    text: |-
      die beschikkingen nemen of bevelen geven of bestaande beschikkingen of bevelen handhaven, wetende dat daardoor de
      Grondwet of andere wetten of algemene maatregelen van inwendig bestuur van de staat worden geschonden;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372bis
  - number: 372bis.4°
    text: |-
      die opzettelijk nalaten uitvoering te geven aan de bepalingen van de [Grondwet][ref1] of andere wetten of algemene
      maatregelen van inwendig bestuur van de staat, voor zover die uitvoering wegens de aard van het onderwerp tot hun
      ministeriële departementen behoort of uitdrukkelijk hem is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372bis
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 372ter
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie worden gestraft de hoofden van
      ministeriële departementen aan wier grove schuld te wijten is dat de in [artikel 372bis, onder 4°][ref1],
      omschreven uitvoering wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel372bis
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel372ter
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 372bis
  - number: '373'
    text: |-
      De bevelhebber der gewapende macht die weigert of opzettelijk nalaat, op de wettige vordering van het bevoegde
      burgerlijk gezag, de onder zijn bevel staande macht aan te wenden, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel373
  - number: '374.1'
    text: |-
      De ambtenaar die opzettelijk den bijstand der gewapende macht inroept tegen de uitvoering van wettelijke
      voorschriften, van wettige bevelen van het openbaar gezag of van rechterlijke uitspraken of bevelschriften, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel374
  - number: '374.2'
    text: |-
      Indien die uitvoering daardoor wordt verhinderd, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel374
  - number: 374bis
    text: |-
      De ambtenaar die, met het oogmerk om in de uitoefening van een openbare dienst stremming te veroorzaken of te doen
      voortduren, nalaat of op wettig gegeven last weigert werkzaamheden te verrichten, waartoe hij zich uitdrukkelijk
      of uit kracht van zijn ambt heeft verbonden, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel374bis
  - number: 374ter
    text: |-
      Indien twee of meer personen tengevolge van samenspanning het misdrijf plegen in het [vorig artikel][ref1]
      omschreven, worden de schuldigen, zomede de leiders of aanleggers der samenspanning, gestraft met gevangenisstraf
      van ten hoogste twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel374bis
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel374ter
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 374bis
  - number: 374quater
    text: |-
      Indien het oogmerk bij [artikel 374bis][ref1] omschreven wordt bereikt, wordt gevangenisstraf opgelegd: in geval
      van artikel 374bis van ten hoogste een jaar; in geval van [artikel 374ter][ref2] van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel374bis
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel374ter
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel374quater
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 374bis
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 374ter
  - number: '375'
    text: |-
      De ambtenaar of een ander met eenigen openbaren dienst voortdurend of tijdelijk belast persoon die opzettelijk
      geld, ongemunt goud of geldwaardig papier, dat hij in zijne bediening onder zich heeft, verduistert of toelaat dat
      het door een ander weggenomen of verduisterd wordt, of dien ander daarbij als medeplichtige ter zijde staat, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel375
  - number: '376'
    text: |-
      De ambtenaar of een ander met eenigen openbaren dienst voortdurend of tijdelijk belast persoon die opzettelijk
      boeken of registers, uitsluitend bestemd tot contrôle van de administratie, valschelijk opmaakt of vervalscht,
      wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel376
  - number: '377'
    text: |-
      De ambtenaar of een ander met eenigen openbaren dienst voortdurend of tijdelijk belast persoon die opzettelijk
      zaken bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten, bescheiden of registers,
      welke hij in zijne bediening onder zich heeft, verduistert, vernielt, beschadigt of onbruikbaar maakt, of toelaat
      dat zij door een ander worden weggemaakt, vernield, beschadigd of onbruikbaar gemaakt, of dien ander daarbij als
      medeplichtige ter zijde staat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel377
  - number: '378.1'
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: 378.1.1°
    text: |-
      die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan, verleend
      of aangeboden wordt teneinde hem te bewegen om, zonder daardoor in strijd met zijn plicht te handelen, in zijn
      bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: 378.1.2°
    text: |-
      die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan, verleend of
      aangeboden wordt ten gevolge of naar aanleiding van hetgeen door hem, zonder daardoor in strijd met zijn plicht te
      handelen, in zijn huidige of vroegere bediening is gedaan of nagelaten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: 378.1.3°
    text: |-
      die een gift, belofte of dienst vraagt teneinde hem te bewegen om, zonder daardoor in strijd met zijn plicht te
      handelen, in zijn bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: 378.1.4°
    text: |-
      die een gift, belofte of dienst vraagt ten gevolge of naar aanleiding van hetgeen door hem, zonder daardoor in
      strijd met zijn plicht te handelen, in zijn huidige of vroegere bediening is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: '378.2'
    text: |-
      Met dezelfde straf wordt gestraft, hij die in het vooruitzicht van een aanstelling als ambtenaar, indien de
      aanstelling als ambtenaar is gevolgd, een feit begaat als in het eerste lid, onder 1° en 3°, omschreven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: '378.3'
    text: |-
      Hij die een feit als omschreven in het eerste lid begaat in verband met zijn hoedanigheid van minister,
      staatssecretaris, gezaghebber of lid van het bestuurscollege dan wel lid van een algemeen vertegenwoordigend
      orgaan, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel378
  - number: '379.1'
    text: 'Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: 379.1.1°
    text: |-
      die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde hem te bewegen om, in strijd met zijn plicht, in zijn bediening iets te doen
      of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: 379.1.2°
    text: |-
      die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt ten gevolge of naar aanleiding van hetgeen door hem, in strijd met zijn plicht, in
      zijn huidige of vroegere bediening is gedaan of nagelaten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: 379.1.3°
    text: |-
      die een gift of belofte dan wel een dienst vraagt teneinde hem te bewegen om, in strijd met zijn plicht, in zijn
      bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: 379.1.4°
    text: |-
      die een gift of belofte dan wel een dienst vraagt ten gevolge of naar aanleiding van hetgeen door hem, in strijd
      met zijn plicht, in zijn huidige of vroegere bediening is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: '379.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die in het vooruitzicht van een aanstelling als ambtenaar, indien de
      aanstelling als ambtenaar is gevolgd, een feit begaat als in het eerste lid, onder 1° en 3°, omschreven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: '379.3'
    text: |-
      Hij die een feit als omschreven in het eerste lid begaat in verband met zijn hoedanigheid van minister,
      staatssecretaris, gezaghebber of lid van het bestuurscollege dan wel lid van een algemeen vertegenwoordigend
      orgaan, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel379
  - number: '380.1'
    text: |-
      De rechter die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde invloed uit te oefenen op de beslissing van een aan zijn oordeel onderworpen
      zaak, wordt gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380
  - number: '380.2'
    text: |-
      De rechter die een gift, belofte of dienst vraagt teneinde hem te bewegen om invloed uit te oefenen op de
      beslissing van een aan zijn oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380
  - number: '380.3'
    text: |-
      Indien de gift, belofte of dienst wordt aangenomen, wetende of redelijkerwijs vermoedende dat deze gedaan,
      verleend of aangeboden wordt om een veroordeling in een strafzaak te verkrijgen, wordt de rechter gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380
  - number: '380.4'
    text: |-
      Indien de gift, belofte of dienst wordt gevraagd teneinde hem te bewegen om een veroordeling in een strafzaak te
      verkrijgen, wordt de rechter gestraft met een gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380
  - number: 380a.1
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 377][ref1], [378][ref2] en [379][ref3] gelijkgesteld personen
      in de openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel377
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel378
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel379
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '377'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '378'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '379'
  - number: 380a.2
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 378, onder 2° en 4°][ref1], en [379, onder 2° en 4°][ref2],
      voormalige ambtenaren gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel379
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '378'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '379'
  - number: 380a.3
    text: |-
      Met rechter wordt ten aanzien van [artikel 380][ref1] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel380
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel380a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '380'
  - number: '381'
    text: |-
      De ambtenaar die door misbruik van gezag iemand dwingt iets te doen, niet te doen of te dulden, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel381
  - number: '382'
    text: |-
      De ambtenaar die in de uitoefening zijner bediening, als verschuldigd aan hem zelven, aan een ander ambtenaar
      of aan eenige openbare kas, vordert of ontvangt of bij eene uitbetaling terughoudt hetgeen hij weet dat niet
      verschuldigd is, wordt, als schuldig aan knevelarij, gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel382
  - number: '383'
    text: |-
      De ambtenaar die, belast met de bewaking van iemand die op openbaar gezag of krachtens rechterlijke uitspraak of
      beschikking van de vrijheid is beroofd, hem opzettelijk laat ontsnappen of bevrijdt of bij zijne bevrijding of
      zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste zes jaren. Indien de ontsnapping,
      bevrijding of zelfbevrijding aan zijne schuld te wijten is, wordt hij gestraft met hechtenis van ten hoogste vier
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel383
  - number: '384'
    text: Met gevangenisstraf van ten hoogste drie jaren wordt gestraft
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel384
  - number: 384.1°
    text: |-
      de ambtenaar met het opsporen van strafbare feiten belast, die opzettelijk niet voldoet aan de vordering om
      van eene wederrechtelijke vrijheidsberooving te doen blijken of daarvan aan de hoogere macht opzettelijk niet
      onverwijld kennis geeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel384
  - number: 384.2°
    text: |-
      de ambtenaar die, na in de uitoefening van zijne bediening kennis te hebben bekomen dat iemand op onwettige
      wijze van de vrijheid is beroofd, opzettelijk nalaat daarvan onverwijld kennis te geven aan een ambtenaar met het
      opsporen van strafbare feiten belast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel384
  - number: '385'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar wordt gestraft het hoofd van een gesticht, bestemd tot opsluiting
      van veroordeelden, voorloopig aangehoudenen of gegijzelden of van een opvoedingsgesticht of krankzinnigengesticht,
      die weigert te voldoen aan eene wettige vordering om iemand, die in het gesticht is opgenomen, te vertoonen, of
      om inzage te geven van het register van inschrijving of van de akte waarvan de inschrijving bij de wet gevorderd
      wordt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel385
  - number: '386'
    text: |-
      De ambtenaar die, met overschrijding van zijne bevoegdheid of zonder inachtneming van de bij de wet bepaalde
      vormen, hetzij in de woning of in het bij eene woning behoorend erf, hetzij in het besloten lokaal of erf, bij
      een ander in gebruik, diens ondanks binnentreedt of, wederrechtelijk aldaar vertoevende, zich niet op de vordering
      van of vanwege den rechthebbende aanstonds verwijdert, wordt gestraft met gevangenisstraf van ten hoogste een jaar
      of geldboete van de eerste categorie. Met gelijke straf wordt gestraft de ambtenaar die, ter gelegenheid eener
      huiszoeking, met overschrijding van zijne bevoegdheid of zonder inachtneming van de bij de wet bepaalde vormen,
      geschriften, boeken of andere papieren onderzoekt en in beslag neemt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel386
  - number: '387'
    text: |-
      De ambtenaar die, met overschrijding van zijne bevoegdheid, zich doet overleggen of in beslag neemt een aan eenige
      openbare instelling van vervoer toevertrouwden brief, briefkaart, stuk of pakket of een telegraphisch bericht
      dat zich in handen bevindt van een ambtenaar der telegraphie of van andere personen belast met den dienst van
      eene ten algemeenen nutte gebezigde telegraafinrichting, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren. Dezelfde straf wordt opgelegd aan den ambtenaar die, met overschrijding van zijne bevoegdheid, zich door
      een ambtenaar der telefonie of door andere personen belast met den dienst van eene ten algemeenen nutte gebezigde
      telefooninrichting, doet inlichten ter zake van eenig verkeer hetwelk door tusschenkomst van die instelling is
      geschied.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel387
  - number: '388'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel388
  - number: '389'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel389
  - number: '390'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel390
  - number: 390bis
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel390bis
  - number: '391'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel391
  - number: '392'
    text: |-
      De ambtenaar die opzettelijk deelneemt, middellijk of onmiddellijk, aan aannemingen of leverantiën waarover
      hem op het tijdstip der handeling geheel of ten deele het bestuur of toezicht is opgedragen, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel392
  - number: '393.1'
    text: |-
      De ambtenaar van den burgerlijken stand die iemands huwelijk sluit, wetende dat deze daardoor een dubbel huwelijk
      aangaat, wordt gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel393
  - number: '393.2'
    text: |-
      De ambtenaar van den burgerlijken stand die iemands huwelijk sluit, wetende dat daartegen eenig ander wettig
      beletsel bestaat, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel393
  - number: '394'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 375][ref1], [379][ref2], [380][ref3], [382][ref4],
      [389, laatste lid][ref5], en [393, eerste lid][ref6], omschreven misdrijven, kan ontzetting van de in
      [artikel 32][ref7], N°. 3 en 4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel375
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel379
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel380
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel382
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel389
      [ref6]: https://wetten.overheid.nl/BWBR0028570#Artikel393
      [ref7]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel394
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '375'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '379'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '380'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '382'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: '389'
      - id: ref6
        bwb_id: BWBR0028570
        artikel: '393'
      - id: ref7
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '395'
    text: 'Als schuldig aan zeeroof wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel395
  - number: 395.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren, hij die als schipper dienst neemt of dienst doet op een vaartuig,
      wetende dat het bestemd is of het gebruikende om in open zee daden van geweld te plegen tegen andere vaartuigen
      of tegen zich daarop bevindende personen of goederen, zonder door eene oorlogvoerende mogendheid daartoe zijn
      gemachtigd of tot de oorlogsmarine eener erkende mogendheid te behooren;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel395
  - number: 395.2°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren, hij die, bekend met deze bestemming of dit gebruik, als schepeling
      dienst neemt op zoodanig vaartuig of vrijwillig in dienst blijft na daarmede bekend te zijn geworden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel395
  - number: '396'
    text: |-
      Indien de in [artikel 395][ref1] omschreven daden van geweld den dood van een der zich op het aangevallen vaartuig
      of luchtvaartuig bevindende personen ten gevolge hebben, wordt de schipper of gezagvoerder en worden zij die aan de
      daden van geweld hebben deelgenomen met gevangenisstraf van ten hoogste vijftien jaren gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel395
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel396
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '395'
  - number: '397'
    text: |-
      Hij die voor eigen of vreemde rekening een vaartuig of luchtvaartuig uitrust met de in [artikel 395][ref1]
      omschreven bestemming, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel395
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel397
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '395'
  - number: '398'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig of luchtvaartuig, wetende dat het de in [artikel 395][ref1] omschreven bestemming
      heeft, wordt gestraft met gevangenisstraf van ten hoogste acht jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel395
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel398
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '395'
  - number: '399'
    text: 'Hij die een Nederlandsch vaartuig opzettelijk in de macht van zeeroovers brengt, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399
  - number: 399.1°
    text: indien hij de schipper is, met gevangenisstraf van ten hoogste twaalf jaren;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399
  - number: 399.2°
    text: in alle andere gevallen, met gevangenisstraf van ten hoogste negen jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399
  - number: 399a.1
    text: |-
      Hij die een luchtvaartuig door geweld, bedreiging met geweld of vreesaanjaging in zijn macht brengt of houdt dan
      wel van zijn route doet afwijken, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399a
  - number: 399a.2
    text: |-
      Indien twee of meer personen gezamenlijk of ten gevolge van samenspanning het feit plegen, of indien het feit zwaar
      lichamelijk letsel ten gevolge heeft, dan wel het feit is gepleegd met het oogmerk iemand wederrechtelijk van zijn
      vrijheid te beroven of beroofd te houden, wordt gevangenisstraf van ten hoogste vijftien jaren opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399a
  - number: 399a.3
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste twintig
      jaren opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399a
  - number: 399a.4
    text: |-
      De straffen, in het eerste lid bepaald, zijn toepasselijk op degene die de in dat lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig, een installatie ter zee, een autobus of een ander middel van openbaar vervoer dan wel
      een voertuig met gevaarlijke lading.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399a
  - number: 399b.1
    text: |-
      Hij die opzettelijk een ontplofbare of anderszins gemeengevaarlijke stof, of enig ander gemeengevaarlijk voorwerp
      aan boord van een luchtvaartuig plaatst of een daad van geweld begaat tegen iemand die zich aan boord van een
      luchtvaartuig tijdens de vlucht bevindt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399b
  - number: 399b.1.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren, indien daarvan gevaar voor de veiligheid van het luchtvaartuig te
      duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399b
  - number: 399b.1.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren, indien daarvan gevaar voor de veiligheid van het luchtvaartuig te
      duchten is en het feit zwaar lichamelijk letsel voor een ander ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399b
  - number: 399b.1.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan gevaar voor de veiligheid van het luchtvaartuig
      te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399b
  - number: 399b.2
    text: |-
      De straffen, in het eerste lid bepaald, zijn toepasselijk op degene die de in dit lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig en een installatie ter zee. Onder gevaar voor de veiligheid van het luchtvaartuig
      wordt in het eerste lid tevens begrepen gevaar voor de veilige vaart van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399b
  - number: 399c
    text: |-
      Hij die opzettelijk gegevens doorgeeft waarvan hij weet of ernstige reden heeft om te vermoeden dat zij onjuist
      zijn, wordt, indien daarvan gevaar voor een luchtvaartuig in vlucht of voor de veilige vaart van een vaartuig te
      duchten is, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399c
  - number: 399d
    text: 'Hij die opzettelijk een daad van geweld begaat tegen iemand die zich op een luchthaven bevindt, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399d
  - number: 399d.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daardoor levensgevaar
      of gevaar voor zwaar lichamelijk letsel voor anderen op de luchthaven te duchten valt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399d
  - number: 399d.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daardoor levensgevaar
      of gevaar voor zwaar lichamelijk letsel voor anderen op de luchthaven te duchten valt en het feit zwaar lichamelijk
      letsel voor een ander ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399d
  - number: 399d.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daardoor
      levensgevaar voor anderen op de luchthaven te duchten valt en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel399d
  - number: '400'
    text: |-
      De opvarende van een Nederlandsch schip, die zich wederrechtelijk van het schip meester maakt, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel400
  - number: '401'
    text: |-
      De schipper van een Nederlandsch schip die het schip aan den eigenaar of de reederij onttrekt en ten eigen bate
      gebruikt, wordt gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel401
  - number: '402'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel402
  - number: '403'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel403
  - number: 403bis.1
    text: |-
      De schipper van een Nederland vaartuig, die een scheepsverklaring doet opmaken, waarvan hij weet dat de inhoud in
      strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel403bis
  - number: 403bis.2
    text: |-
      De schepeling die medewerkt tot het doen opmaken van eene scheepsverklaring, waarvan hij weet, dat de inhoud in
      strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel403bis
  - number: 403ter
    text: |-
      Hij die ter voldoening aan het voorschrift van het vierde lid van [artikel 194][ref1] of van het vierde lid van
      [artikel 1303 van Boek 8 van het Burgerlijk Wetboek BES][ref2] een schriftelijke verklaring overlegt van welke hij
      weet dat de inhoud in strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel1303
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel403ter
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '1303'
  - number: '404'
    text: |-
      De schipper van een Nederlands vaartuig die gedurende de reis zich opzettelijk aan het voeren van het vaartuig
      onttrekt, wordt, indien die gedraging de veiligheid van de opvarenden, het vaartuig of de lading in gevaar brengt,
      gestraft met gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel404
  - number: '405'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel405
  - number: '406'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel406
  - number: '407'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel407
  - number: '408'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel408
  - number: '409'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel409
  - number: '410'
    text: |-
      De opvarende van een Nederlandsch schip die aan boord den schipper, of de schepeling, die aan boord of in
      dienst een meerdere in rang feitelijk aanrandt, zich met geweld of bedreiging met geweld tegen hem verzet of
      hem opzettelijk van zijne vrijheid van handelen beroofd, wordt als schuldig aan insubordinatie, gestraft met
      gevangenisstraf van ten hoogste twee jaren. De schuldige wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel410
  - number: 410.1°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren, indien het misdrijf of de daarmede gepaard gaande feitelijkheden
      eenig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel410
  - number: 410.2°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden, indien zij zwaar lichamelijk letsel ten gevolge
      hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel410
  - number: 410.3°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien zij den dood ten gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel410
  - number: '411'
    text: |-
      Insubordinatie gepleegd door twee of meer vereenigde personen, wordt, als muiterij, gestraft met gevangenisstraf
      van ten hoogste zes jaren. De schuldige wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel411
  - number: 411.1°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden, indien het door hem gepleegde misdrijf of de
      daarbij door hem gepleegde feitelijkheden eenig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel411
  - number: 411.2°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien zij zwaar lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel411
  - number: 411.3°
    text: met gevangenisstraf van ten hoogste vijftien jaren, indien zij den dood ten gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel411
  - number: '412'
    text: |-
      Hij die aan boord van een Nederlandsch schip tot muiterij op dat schip opruit, wordt gestraft met gevangenisstraf
      van ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel412
  - number: '413'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel413
  - number: '414'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel414
  - number: '415'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie wordt gestraft de opvarende
      van een Nederlandsch schip:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel415
  - number: 415.1°
    text: die opzettelijk niet gehoorzaamt aan eenig bevel des schippers in het belang van de veiligheid aan boord gegeven;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel415
  - number: 415.2°
    text: die, wetende dat de schipper van zijne vrijheid beroofd is, hem niet naar vermogen te hulp komt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel415
  - number: 415.3°
    text: |-
      die, kennis dragende van een voornemen tot het plegen van insubordinatie, opzettelijk nalaat daarvan tijdig aan den
      schipper kennis te geven;*
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel415
  - number: 415.4°
    text: |-
      niet zijnde schepeling van een Nederlands vaartuig, die opzettelijk niet gehoorzaamt aan enig bevel van de schipper
      tot handhaving van de orde en tucht aan boord gegeven.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel415
  - number: '416'
    text: |-
      De in de [artikelen 400][ref1], [410 tot en met 415][ref2] bepaalde straffen kunnen met een derde worden verhoogd,
      indien de schuldige aan een der in die artikelen omschreven misdrijven scheepsofficier is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel400
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel410
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '400'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '410'
  - number: '417'
    text: |-
      De schipper van een Nederlandsch schip, die met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen
      of zoodanige bevoordeeling te bedekken, hetzij het schip verkoopt, hetzij geld opneemt op het schip, het
      scheepstoebehooren of den scheepsvoorraad, hetzij zaken aan boord van het schip of zaken van den scheepsvoorraad
      verkoopt of verpandt, hetzij verdichte schaden of uitgaven in rekening brengt, hetzij niet zorgt dat aan boord de
      vereischte dagboeken overeenkomstig de wettelijke voorschriften worden gehouden, hetzij bij het verlaten van het
      schip niet zorgt voor het behoud der scheepspapieren, wordt gestraft met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel417
  - number: '418'
    text: |-
      De schipper van een Nederlandsch schip die, met het oogmerk om zich of een ander wederrechtelijk te bevoordeelen
      of zoodanige bevoordeeling te bedekken, van koers verandert, wordt gestraft met gevangenisstraf van ten hoogste
      drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel418
  - number: '419'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel419
  - number: '420'
    text: |-
      De schipper van een Nederlandsch vaartuig die, buiten noodzaak en buiten voorkennis van den eigenaar of de
      reederij, handelingen pleegt of gedoogt, wetende dat deze het vaartuig of de zaken aan boord daarvan aan
      opbrenging, aanhouding of ophouding blootstellen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de tweede categorie. De opvarende die buiten noodzaak en buiten voorkennis van den schipper, met
      gelijke wetenschap gelijke handelingen pleegt, wordt gestraft met gevangenisstraf van ten hoogste negen maanden of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel420
  - number: '421'
    text: |-
      De schipper van een Nederlandsch schip die opzettelijk buiten noodzaak aan een opvarende niet verschaft datgene wat
      hij verplicht is hem te verschaffen, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel421
  - number: '422'
    text: |-
      De schipper van een Nederlandsch schip die opzettelijk buiten noodzaak of in strijd met eenig wettelijk voorschrift
      goederen werpt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel422
  - number: '423'
    text: |-
      Hij die zaken aan boord van een vaartuig opzettelijk of wederrechtelijk vernielt, beschadigt, onbruikbaar maakt of
      wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel423
  - number: '424'
    text: |-
      De schipper die de Nederlandse vlag voert, wetende dat hij daartoe niet gerechtigd is, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel424
  - number: '425'
    text: |-
      De schipper die opzettelijk door het voeren van eenig onderscheidingsteeken aan zijn vaartuig den schijn geeft
      alsof het een Nederlandsch oorlogsvaartuig ware, of een loodsvaartuig in wateren of zeegaten van de openbare
      lichamen Bonaire, Sint Eustatius en Saba dienst doende, wordt gestraft met gevangenisstraf van ten hoogste drie
      maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel425
  - number: '426'
    text: |-
      Hij die buiten noodzaak op een Nederlandsch schip optreedt als schipper, stuurman of machinist, wetende dat hem
      krachtens wettelijk voorschrift de bevoegdheid daartoe is ontnomen, wordt gestraft met gevangenisstraf van ten
      hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel426
  - number: '427'
    text: |-
      De schipper van een Nederlands schip die zonder geldige reden weigert te voldoen aan een wettelijke vordering om
      een beklaagde of veroordeelde benevens de tot zijn zaak betrekkelijke stukken aan boord te nemen, wordt gestraft
      met een gevangenisstraf van ten hoogste drie maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel427
  - number: '428'
    text: |-
      De schipper van een Nederlandsch schip die een beklaagde of veroordeelde, die hij op een wettelijke vordering
      aan boord genomen heeft, opzettelijk laat ontsnappen of bevrijdt, of bij zijne bevrijding of zelfbevrijding
      behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste drie jaren. Indien de ontsnapping, bevrijding
      of zelfbevrijding aan zijne schuld is te wijten, wordt hij gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel428
  - number: '429'
    text: |-
      De schipper van een Nederlandsch vaartuig, die de op hem rustende verplichting tot hulpverleening, opzettelijk niet
      nakomt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel429
  - number: '430'
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 395–401][ref1], [417][ref2] en [418][ref3] omschreven
      misdrijven, kan ontzetting van de in [artikel 32][ref4], no. 1–4, vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel395
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel417
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel418
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel430
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '395'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '417'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '418'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 430a
    text: |-
      Indien een misdrijf, strafbaar gesteld in een van de [artikelen 399a tot en met 399d][ref1], is begaan met een
      terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en kan,
      indien op dit misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange
      gevangenisstraf of tijdelijke van ten hoogste vierentwintig jaren worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel399a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel430a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 399a
  - number: 430b
    text: |-
      De samenspanning tot een van de in de [artikelen 399a][ref1], [399b][ref2] en [399d][ref3] omschreven misdrijven,
      te begaan met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel399a
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel399b
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel399d
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel430b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 399a
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 399b
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 399d
  - number: '431'
    text: |-
      Hij, die opzettelijk eenig door misdrijf verkregen voorwerp koopt, huurt, inruilt in pand neemt, als geschenk
      aanneemt of uit winstbejag verkoopt, verhuurt, verruilt, in pand geeft, vervoert, bewaart of verbergt, wordt als
      schuldig aan heling bestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
      Dezelfde straf wordt opgelegd aan hem die opzettelijk uit opbrengst van enig door misdrijf verkregen voorwerp
      voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel431
  - number: '432'
    text: |-
      Hij die een gewoonte maakt van het opzettelijk koopen, inruilen, in pand nemen of verbergen van door misdrijf
      verkregen voorwerpen, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel432
  - number: 432bis
    text: |-
      Hij die eenig voorwerp koopt, huurt, inruilt, in pand neemt, als geschenk aanneemt of uit winstbejag verkoopt,
      verhuurt, verruilt, in pand geeft, vervoert, bewaart of verbergt, wordt, indien aan zijne schuld te wijten is dat
      zijne handeling een door misdrijf verkregen voorwerp betreft, gestraft wordt met gevangenisstraf van ten hoogste
      drie jaar of geldboete van de derde categorie. Dezelfde straf wordt opgelegd aan hem die uit de opbrengst van eenig
      voorwerp voordeel trekt, indien aan zijne schuld te wijten is, dat zijne handeling een door misdrijf verkregen
      voorwerp betreft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel432bis
  - number: 432ter
    text: |-
      Bij veroordeeling wegens een der in de [artikelen 431–432bis][ref1] omschreven misdrijven, kan ontzetting van
      de in [artikel 32][ref2] N°. 1–4 vermelde rechten worden uitgesproken en kan de schuldige worden ontzet van de
      uitoefening van het beroep waarin hij het misdrijf begaan heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel431
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel432ter
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '431'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '433'
    text: |-
      Hij die eenig geschrift of eenige afbeelding uitgeeft van strafbaren aard, wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de eerste categorie, indien:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel433
  - number: 433.1°
    text: |-
      de dader noch bekend is, noch op de eerste aanmaning nadat tot het instellen van een gerechtelijk vooronderzoek is
      overgegaan is bekend gemaakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel433
  - number: 433.2°
    text: |-
      de uitgever wist of moest verwachten, dat de dader op het tijdstip der uitgave strafrechtelijk niet vervolgbaar of
      buiten de openbare lichamen Bonaire, Sint Eustatius en Saba gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel433
  - number: '434'
    text: |-
      Hij die eenig geschrift of eenige afbeelding drukt van strafbare aard wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de eerste categorie, indien:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel434
  - number: 434.1°
    text: |-
      de persoon op wiens last het stuk gedrukt is noch bekend is, noch op de eerste aanmaning nadat tot het instellen
      van een gerechtelijk vooronderzoek is overgegaan is bekend gemaakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel434
  - number: 434.2°
    text: |-
      de drukker wist of moest verwachten, dat de persoon op wiens last het stuk gedrukt is, op het tijdstip der uitgave
      strafrechtelijk niet vervolgbaar of buiten de openbare lichamen Bonaire, Sint Eustatius en Saba gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel434
  - number: '435'
    text: |-
      Indien de aard van het geschrift of de afbeelding een misdrijf oplevert dat alleen op klachte vervolgbaar is, kan
      de uitgever of drukker in de gevallen der beide voorgaande artikelen alleen vervolgd worden op klachte van hem
      tegen wien dat misdrijf gepleegd is.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435
  - number: 435a.1
    text: |-
      Als schuldig aan witwassen wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435a
  - number: 435a.1.a
    text: |-
      hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij weet of begrijpt dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435a
  - number: 435a.1.b
    text: |-
      hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl hij
      weet of begrijpt dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435a
  - number: 435a.2
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435a
  - number: 435b
    text: |-
      Hij die van het plegen van witwassen een gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste zestien
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435b
  - number: 435c.1
    text: |-
      Als schuldig aan schuldwitwassen wordt gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de
      vierde categorie:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435c
  - number: 435c.1.a
    text: |-
      hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij redelijkerwijs moet vermoeden dat het voorwerp onmiddellijk of middellijk afkomstig is uit enig
      misdrijf;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435c
  - number: 435c.1.b
    text: |-
      hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl hij
      redelijkerwijs moet vermoeden dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435c
  - number: 435c.2
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435c
  - number: 435d
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de ontzetting van de in
      [artikel 32, eerste lid, onder 1° en 2°][ref1], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '32'
  - number: 435e.1
    text: |-
      Als schuldig aan het financieren van terrorisme wordt gestraft met een gevangenisstraf van ten hoogste acht jaren
      of geldboete van de vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435e
  - number: 435e.1.a
    text: |-
      hij die zich of een ander opzettelijk middelen of inlichtingen verschaft dan wel opzettelijk voorwerpen verzamelt,
      verwerft, voorhanden heeft of aan een ander verschaft, die geheel of gedeeltelijk, onmiddellijk of middellijk,
      dienen om geldelijke steun te verlenen aan het plegen van een terroristisch misdrijf of een misdrijf ter
      voorbereiding of vergemakkelijking van een terroristisch misdrijf;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel435e
  - number: 435e.1.b
    text: |-
      hij die zich of een ander opzettelijk middelen of inlichtingen verschaft dan wel opzettelijk voorwerpen
      verzamelt, verwerft, voorhanden heeft of aan een ander verschaft, die geheel of gedeeltelijk, onmiddellijk of
      middellijk, dienen om geldelijke steun te verlenen aan het plegen van een van de misdrijven omschreven in: -
      de [artikelen 124a tot en met 124c][ref1] alsmede [artikel 298][ref2], indien dat misdrijf is gericht tegen een
      internationaal beschermd persoon of diens beschermde goederen;
        - de [artikelen 79][ref3] en [80 van de Kernenergiewet][ref4], de [artikelen 167c][ref5], [179a][ref6]
      en [297a][ref7] alsmede de [artikelen 146][ref8], [163][ref9], [230][ref10], [323 tot en met 325][ref11],
      [330][ref12], [331][ref13], [334][ref14], [335][ref15] en [339][ref16], indien het feit opzettelijk wederrechtelijk
      handelen betreft met betrekking tot kernmateriaal;
        - de [artikelen 168][ref17], [168a][ref18], [172][ref19], [174][ref20], [295ao][ref21], [370][ref22],
      [399a tot en met 399d][ref23];
        - de [artikelen 97 tot en met 102][ref24], [114][ref25], [123][ref26], [129][ref27], [130][ref28], [146][ref29],
      [163][ref30], [167][ref31], [167a][ref32], [167c][ref33], [170][ref34], [177][ref35], [178][ref36], [300][ref37],
      [301][ref38] en [302][ref39], indien het feiten betreft die worden gepleegd door middel van het opzettelijk
      wederrechtelijk tot ontlading of ontploffing brengen van een springstof of ander voorwerp, of het laten vrijkomen,
      verspreiden of inwerken van een voorwerp, waardoor levensgevaar, gevaar voor zwaar lichamelijk letsel voor een
      ander of aanzienlijke materiële schade te duchten is.


