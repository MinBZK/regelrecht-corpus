        artikel: '378'
  - number: '7'
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op den schipper en de
      opvarenden van een Nederlandsch vaartuig, die zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba, ook
      buiten boord, schuldig maken aan een der strafbare feiten, omschreven in [Titel XXIX van het Tweede Boek][ref1] en
      [Titel IX van het Derde Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel7
    references:
