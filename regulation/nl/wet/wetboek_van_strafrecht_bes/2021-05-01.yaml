    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.1.b
    text: 'bijkomende straffen:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.1.b.1°
    text: ontzetting van bepaalde rechten;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.1.b.2°
    text: verbeurdverklaring van bepaalde voorwerpen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.1.b.3°
    text: openbaarmaking van de rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.1.b.4°
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: '9.2'
    text: |-
      Bij veroordeeling van een persoon die tijdens de uitspraak van het eindvonnis in eersten aanleg den leeftijd
      van achttien jaren nog niet bereikt heeft, wordt, behoudens het bepaalde bij [artikel 41ter, eerste lid][ref1],
      en [artikel 41septies, laatste lid][ref2], in plaats van de op het feit gestelde hoofdstraf, eene der volgende
      hoofdstraffen opgelegd naar de onderscheidingen gemaakt bij artikel 41septies:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel41ter
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel41septies
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 41ter
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 41septies
  - number: 9.2.1°
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: 9.2.2°
    text: berisping.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel9
  - number: '10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel10
  - number: '11.1'
    text: De gevangenisstraf is levenslang of tijdelijk.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel11
  - number: '11.2'
    text: |-
      De duur van de tijdelijke gevangenisstraf is tenminste een dag, tenzij bij wet een hoger minimum is vastgesteld, en
      ten hoogste vier en twintig achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel11
  - number: '11.3'
    text: |-
      Zij kan voor ten hoogste dertig achtereenvolgende jaren worden opgelegd in de gevallen waarin op het misdrijf
      levenslange en tijdelijke gevangenisstraf ter keuze van den rechter zijn gesteld, en in die, waarin wegens
      strafverhooging ter zake van samenloop van misdrijven, terroristische misdrijven, herhaling van misdrijf of
      het bepaalde bij de [artikelen 46][ref1], [317][ref2] en [416][ref3], de tijd van vier en twintig jaren wordt
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel317
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel416
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '317'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '416'
  - number: '11.4'
    text: Zij kan in geen geval den tijd van dertig jaren te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel11
  - number: '12'
    text: |-
      Gevangenisstraf wordt naar gelang de aard van de persoonlijkheid van de veroordeelde in algehele of in beperkte
      gemeenschap, dan wel in afzondering ondergaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel12
  - number: '13'
    text: |-
      Iedere tot gevangenisstraf veroordeelde wordt zoveel mogelijk geplaatst in een gesticht, waarvan het
      regime het meest met zijn persoonlijkheid strookt, waarbij zowel op de duur van de straf als op zijn
      reclasseringsmogelijkheden van de tot gevangenisstraf veroordeelde wordt gelet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel13
  - number: '14'
    text: |-
      Een tot gevangenisstraf veroordeelde die wegens de gebrekkige ontwikkeling of ziekelijke stoornis van zijn
      geestvermogens daarvoor in aanmerking komt kan worden geplaatst in een door Onze Minister van Justitie aangewezen
      instelling. [vervallen] De plaatsing en beëindiging daarvan geschieden volgens regels, bij algemene maatregel
      van bestuur, te stellen, op last van Onze Minister van Justitie gegeven na een met redenen omkleed en ondertekend
      advies van een psychiater.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel14
  - number: '15'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel15
  - number: '16'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel16
  - number: '17'
    text: |-
      De tot gevangenisstraf veroordeelde is verplicht tot het verrichten van den hem opgedragen arbeid, overeenkomstig
      de voorschriften ter uitvoering van [artikel 26][ref1] gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel26
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '26'
  - number: 17a
    text: |-
      In geval van veroordeling tot gevangenisstraf van ten hoogste zes jaren, tot hechtenis, vervangende hechtenis
      daaronder niet begrepen, of tot geldboete, kan de rechter daarbij tevens zowel ten aanzien van die straf als ten
      aanzien van de opgelegde bijkomende straffen het bevel geven, dat deze geheel of voor een door hem te bepalen
      gedeelte niet zullen worden ten uitvoer gelegd, tenzij hij later anders mocht gelasten op grond dat de veroordeelde
      zich voor het einde van een bij het bevel te bepalen proeftijd aan een strafbaar feit heeft schuldig gemaakt dan
      wel gedurende die proeftijd zich op andere wijze heeft misdragen of een bijzondere voorwaarde, welke bij het bevel
      mocht zijn gesteld, niet heeft nageleefd. In geval van veroordeling tot gevangenisstraf van ten hoogste zes jaren
      of tot hechtenis, vervangende hechtenis daaronder niet begrepen, met toepassing van het eerste lid, kan de rechter
      tevens geldboete opleggen. De geldboete bedraagt ten hoogste USD 8.400 bij feiten, waarop een gevangenisstraf van
      niet meer dan een jaar of hechtenis is gesteld, en ten hoogste USD 16.800 bij feiten, waarop gevangenisstraf van
      meer dan een jaar is gesteld. Het eerste lid vindt bij veroordeling tot geldboete in zaken van belastingen geen
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17a
  - number: 17b
    text: |-
      De proeftijd bedraagt bij misdrijven en bij de in de [artikelen 451][ref1] en [452][ref2] omschreven overtredingen
      ten hoogste drie jaren, bij de overige overtredingen ten hoogste twee jaren. De proeftijd gaat in zodra de
      uitspraak waarbij een bevel als in het [vorige artikel][ref3] bedoeld is gegeven, onherroepelijk is geworden. De
      proeftijd loopt niet gedurende den tijd dat den veroordeelde rechtens zijne vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel451
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel452
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '451'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '452'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17c.1
    text: |-
      Toepassing van [artikel 17a][ref1] geschiedt onder de algemene voorwaarde, dat de veroordeelde zich voor het einde
      van de proeftijd niet schuldig maakt aan een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17c.2
    text: |-
      Bij de toepassing van [artikel 17a][ref1] kunnen voorts de volgende bijzonder voorwaarden worden gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17c.2.a
    text: |-
      gehele of gedeeltelijke vergoeding van de door het strafbare feit veroorzaakte schade binnen een door de rechter te
      bepalen termijn, korter dan de proeftijd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.2.b
    text: |-
      opneming van de veroordeelde in een inrichting ter verpleging gedurende een door de rechter te bepalen termijn, ten
      hoogste gelijk aan de proeftijd;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.2.c
    text: |-
      storting van een door de rechter vast te stellen waarborgsom, gelijk aan het verschil tussen het maximum van de
      geldboete die voor het feit opgelegd kan worden, en de opgelegde boete;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.2.d
    text: |-
      storting van een door de rechter vast te stellen som ten gunste van een instelling die zich mede ten doel stelt om
      de belangen van slachtoffers van strafbare feiten te behartigen. Het bedrag kan niet hoger zijn dan de geldboete
      die ten hoogste voor het strafbare feit opgelegd kan worden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.2.e
    text: |-
      andere bijzondere voorwaarden, het gedrag van de veroordeelde betreffende, waaraan deze gedurende de proeftijd of
      een bij de veroordeling te bepalen gedeelte daarvan, heeft te voldoen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.3
    text: |-
      De bijzondere voorwaarden mogen de vrijheid van godsdienst of levensovertuiging te belijden of de staatkundige
      vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
  - number: 17c.4
    text: |-
      Bij het stellen van de bijzondere voorwaarde van storting van een waarborgsom vindt [artikel 27, eerste lid][ref1],
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel27
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '27'
  - number: 17d
    text: |-
      Met het toezicht op de naleving der voorwaarden is het openbaar minister belast. De rechter kan, indien hij
      daartoe termen vindt, bij zijn bevel aan een bij algemene maatregel van bestuur aangewezen instelling of aan een
      bijzonderen ambtenaar opdragen aan den veroordeelde ter zake van de naleving der bijzondere voorwaarden bijstand
      te verleenen. Voorschriften tot nadere regeling van dien bijstand en tot nadere aanwijzing van de instellingen
      en houders van inrichtingen, die met het verleenen daarvan kunnen worden belast, worden vastgesteld bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17d
  - number: 17e
    text: |-
      Nadat de uitspraak onherroepelijk is geworden, wordt ten spoedigste vanwege het openbaar ministerie door een
      deurwaarder of dienaar der openbare macht aan den veroordeelde eene kennisgeving beteekend, houdende de straf,
      waartoe hij is veroordeeld, en alle tot het in [artikel 17a][ref1] bedoelde bevel betrekkelijke beslissingen. In
      ieder geval, waarin bijzondere voorwaarden zijn gesteld of waarin het openbaar ministerie dit bepaalt, geschiedt de
      betekening aan de veroordeelde in persoon; in andere gevallen geschiedt dit zoveel mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17f
    text: |-
      Indien de voorwaarden niet worden nageleefd, kan het openbaar ministerie bij den rechter, die het in
      [artikel 17a][ref1] bedoelde bevel heeft gegeven, daarvan aan dien rechter kennis geven, met zoodanige vordering
      als het noodig zal oordelen. De kennisgeving dat door den veroordeelde opnieuw een strafbaar feit is begaan,
      geschiedt niet vóór de nieuwe uitspraak onherroepelijk is geworden. Het voorgaande lid is mede van toepassing,
      indien de veroordeelde vóór het einde van den proeftijd ter zake van een vóór het ingaan daarvan begaan strafbaar
      feit onherroepelijk wordt strafbaar verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17g
    text: |-
      De rechter die het in [artikel 17a][ref1] bedoelde bevel heeft gegeven, kan, hetzij na ontvangst ener vordering van
      het Openbaar Ministerie hetzij op het verzoek van de veroordeelde, gedurende de proeftijd of gedurende de tijd, dat
      deze is geschorst, in de gestelde bijzondere voorwaarden of in de termijn waartoe deze in haar werking binnen de
      proeftijd zijn beperkt, wijziging brengen, deze voorwaarden opheffen, alsnog bijzondere voorwaarden stellen, een
      opdracht als bedoeld in [artikel 17d][ref2] geven, het verlenen van bijstand aan een ander dan degene, die daarmede
      te voren was belast, opdragen, de proeftijd verkorten of deze eenmaal verlengen. Die verlenging geschiedt voor ten
      hoogste de helft van de langste termijn waarop de proeftijd bepaald had kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel17d
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 17d
  - number: 17h
    text: |-
      De rechter die het in [artikel 17a][ref1] bedoelde bevel heeft gegeven, kan na ontvangst eener vordering van het
      openbaar ministerie, indien de voorwaarden niet worden nageleefd, de veroordeelde zich misdraagt of vóór het einde
      van den proeftijd ter zake van een vóór het ingaan daarvan begaan strafbaar feit onherroepelijk wordt strafbaar
      verklaard, last tot tenuitvoerlegging geven of bepalen dat den veroordeelde van zijnentwege eene waarschuwing zal
      worden toegediend. In het laatste geval bepaalt hij tevens de wijze waarop zulks zal moeten geschieden. De last
      tot tenuitvoerlegging kan niet meer worden gegeven, wanneer sedert het einde van de proeftijd een termijn van drie
      maanden is verstreken, tenzij de veroordeelde vóór den afloop daarvan ter zake van een gedurende den proeftijd
      begaan strafbaar feit is vervolgd en de vervolging met eene onherroepelijke strafbaarverklaring eindigt. Alsdan
      kan nog ter zake van het begaan van dat feit binnen veertien dagen nadat de strafbaarverklaring onherroepelijk is
      geworden, last tot tenuitvoerlegging worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17a
  - number: 17i
    text: |-
      In de gevallen bij de [artikelen 17g][ref1] en [17h][ref2] bedoeld, brengt het openbaar ministerie de zaak
      aan door de indiening van eene met redenen omkleede vordering. Is door den veroordeelde een verzoekschrift tot
      toepassing van artikel 17g tot den rechter gericht, dan dient het openbaar ministerie ten spoedigste nadat dat
      verzoekschrift in zijne handen is gesteld, eene met redenen omkleede conclusie in. Onmiddellijk na de indiening
      der vordering of der conclusie bepaalt de rechter, tenzij de summiere kennisneming der stukken hem aanleiding
      geeft om de vordering of het verzoek buiten verdere behandeling te laten, een dag voor het onderzoek der zaak. Het
      openbaar ministerie doet daarna ten spoedigste den veroordeelde en dengene, die met het verleenen van bijstand is
      belast, tijdig tot bijwoning van het onderzoek oproepen, onder beteekening van de vordering of conclusie. Zoowel
      het openbaar ministerie als de veroordeelde zijn bevoegd getuigen en deskundigen te doen dagvaarden om bij het
      onderzoek tegenwoordig te zijn. De rechter kan, al dan niet op verzoek van den veroordeelde, bevelen dat bepaalde
      personen vanwege het openbaar ministerie zullen worden gedagvaard. De veroordeelde en degene die met het verleenen
      van bijstand is belast, kunnen vóór den aanvang van het onderzoek van de stukken ter griffie kennis nemen.
      Hetzelfde geldt ten aanzien van een advocaat, indien deze verklaart tot de kennisneming door den veroordeelde
      te zijn gemachtigd of, indien de zaak bij den rechter in eersten aanleg wordt behandeld, ten aanzien van een
      bijzonder daartoe door den veroordeelde gemachtigde. De oproepingen, dagvaardingen en beteekeningen bij dit artikel
      voorgeschreven, vinden plaats op de voet van [artikel 643 van het Wetboek van Strafvordering BES][ref3] en kunnen,
      voor zoover zij van het openbaar ministerie uitgaan, ook door een dienaar der openbare macht geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel17g
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel17h
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel643
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 17g
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 17h
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '643'
  - number: 17j.1
    text: |-
      Onverminderd [artikel 488 van het Wetboek van Strafvordering BES][ref1], vindt het onderzoek plaats in het
      openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel488
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '488'
  - number: 17j.2
    text: Het openbaar ministerie is bij het onderzoek tegenwoordig en wordt ter zake gehoord.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17j
  - number: 17j.3
    text: |-
      De veroordeelde en degene die met het verleenen van bijstand is belast, kunnen bij het onderzoek tegenwoordig zijn
      en worden alsdan gehoord. De veroordeelde kan zich door een advocaat of, indien de zaak bij den rechter in eersten
      aanleg wordt behandeld, door een bijzonder daartoe gemachtigde, als raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel17j
  - number: 17j.4
    text: |-
      De [artikelen 303][ref1], [308, eerste lid][ref2], [309, tweede tot en met vijfde lid][ref3],
      [310][ref4], [311][ref5], [313][ref6], [315][ref7], [318][ref8], [320 tot en met 334][ref9],
      [336 tot en met 353][ref10], [358][ref11], [362][ref12], [363, eerste en tweede lid][ref13],
      [369 tot en met 373 va n het Wetboek van Strafvordering BES][ref14] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel303
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel308
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel309
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel310
