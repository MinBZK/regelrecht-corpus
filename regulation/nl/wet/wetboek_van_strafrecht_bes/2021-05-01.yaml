        artikel: '123'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 124a
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 124c
  - number: '129'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de beide kamers der Staten-Generaal of van een
      van deze of van hun krachtens het reglement van orde gevormde of benoemde commissies uiteenjaagt, tot het nemen of
      niet nemen van enig besluit dwingt, een lid, een minister of een staatssecretaris uit die vergadering verwijdert of
      opzettelijk een lid, een minister of een staatssecretaris verhindert die vergadering bij te wonen of daarin vrij en
      onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel129
  - number: '130'
    text: |-
      De samenspanning tot het in [artikel 129][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren. [Artikel 102, tweede, derde en vierde lid][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel102
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '102'
  - number: '131'
    text: |-
      Hij die bij gelegenheid eener krachtens wettelijk voorschrift uitgeschreven verkiezing, door geweld of bedreiging
      met geweld opzettelijk iemand verhindert zijn of eens anders kiesrecht vrij en onbelemmerd uit te oefenen, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel131
  - number: '132'
    text: |-
      Hij die bij gelegenheid eener krachtens wettelijk voorschrift uitgeschreven verkiezing, door gift of belofte iemand
      omkoopt om zijn of eens anders kiesrecht hetzij niet, hetzij op bepaalde wijze uit te oefenen, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie. Dezelfde straf wordt toegepast op
      de kiezer of de gemachtigde van een kiezer die zich door gift of belofte tot een of ander laat omkoopen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel132
  - number: '133'
    text: |-
      Hij die bij gelegenheid eener krachtens wettelijk voorschrift uitgeschreven verkiezing, eenige bedriegelijke
      handeling pleegt waardoor de stem van een kiezer van onwaarde wordt of een ander dan de door dien kiezer bedoelde
      persoon wordt aangewezen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel133
  - number: '134'
    text: |-
      Hij die opzettelijk zich voor een ander uitgevende, aan eene krachtens wettelijk voorschrift uitgeschreven
      verkiezing deelneemt, wordt gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel134
  - number: '135'
    text: |-
      Hij die, bij gelegenheid eener krachtens wettelijk voorschrift uitgeschreven verkiezing, opzettelijk eene
      plaats gehad hebbende stemming verijdelt of eenige bedriegelijke handeling pleegt waardoor aan de stemming een
      andere uitslag wordt gegeven dan door de wettig ingeleverde stembiljetten zou zijn verkregen, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar en zes maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel135
  - number: '136'
    text: |-
      Bij veroordeeling wegens het in [artikel 129][ref1] omschreven misdrijf kan ontzetting van de in
      [artikel 32][ref2], N°. 1–3, vermelde rechten worden uitgesproken. Bij veroordeeling wegens een der in de
      [artikelen 130–135][ref3] omschreven misdrijven, kan ontzetting van de in artikel 32 N°. 3 vermelde rechten
      worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel130
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '130'
  - number: 136a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 130][ref1], is begaan met een terroristisch oogmerk, wordt de in
      dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel130
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '130'
  - number: 136bis
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136bis
  - number: 136ter
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136ter
  - number: 136quater
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136quater
  - number: 136quinquies
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel136quinquies
  - number: '137.1'
    text: |-
      Hij, die, mondeling of bij geschrifte, in het openbaar tot eenig strafbaar feit, tot gewelddadig optreden tegen het
      openbaar gezag of tot eenige ongehoorzaamheid hetzij aan de wet hetzij aan een krachtens de wet gegeven ambtelijk
      bevel opruit, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel137
  - number: '137.2'
    text: |-
      Indien het strafbare feit waartoe wordt opgeruid een terroristisch misdrijf dan wel een misdrijf ter voorbereiding
      of vergemakkelijking van een terroristisch misdrijf inhoudt, wordt de gevangenisstraf, gesteld op het in het eerste
      lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel137
  - number: '138.1'
    text: |-
      Hij, die een geschrift, waarin tot eenig strafbaar feit, tot gewelddadig optreden tegen het openbaar gezag of tot
      eenige ongehoorzaamheid als in het [vorige artikel][ref1] omschreven wordt opgeruid, met het oogmerk om aan den
      opruienden inhoud ruchtbaarheid te geven of de ruchtbaarheid daarvan te vermeerderen, verspreidt, openlijk ten
      toon stelt of aanslaat, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de eerste
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel137
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '137'
  - number: '138.2'
    text: |-
      Indien het strafbare feit waartoe bij geschrift wordt opgeruid een terroristisch misdrijf dan wel een misdrijf ter
      voorbereiding of vergemakkelijking van een terroristisch misdrijf inhoudt, wordt de gevangenisstraf, gesteld op het
      in het eerste lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel138
  - number: 138a
    text: |-
      Bij veroordeling wegens een der misdrijven, omschreven in de [artikelen 137][ref1] en [138][ref2], kan ontzetting
      van de in [artikel 32][ref3] vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '138'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '139'
    text: |-
      Hij die in het openbaar, mondeling of bij geschrifte, aanbiedt inlichtingen, gelegenheid of middelen te verschaffen
      om eenig strafbaar feit te plegen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van
      de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel139
  - number: '140'
    text: |-
      Hij die een geschrift waarin wordt aangeboden inlichtingen, gelegenheid of middelen te verschaffen om eenig
      strafbaar feit te plegen, met het oogmerk om aan dat aanbod ruchtbaarheid te geven of de ruchtbaarheid daarvan te
      vermeerderen, verspreidt, openlijk ten toon stelt of aanslaat, wordt gestraft met gevangenisstraf van ten hoogste
      drie maanden of geldboete van de eerste categorie. Indien de schuldige het misdrijf in zijn beroep begaat en er,
      tijdens het plegen van het misdrijf, nog geen vijf jaren zijn verloopen, sedert eene vroegere veroordeeling van
      den schuldige wegens gelijk misdrijf onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden
      ontzet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel140
  - number: 140a
    text: |-
      Hij die zich of een ander opzettelijk gelegenheid, middelen of inlichtingen verschaft of tracht te verschaffen
      tot het plegen van een terroristisch misdrijf dan wel een misdrijf ter voorbereiding of vergemakkelijking van een
      terroristisch misdrijf, dan wel zich kennis of vaardigheden daartoe verwerft of een ander bijbrengt, wordt gestraft
      met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel140a
  - number: 140bis
    text: |-
      Hij die door een der in [artikel 49][ref1] N°. 2° vermelde middelen een ander tracht te bewegen om een misdrijf te
      begaan, wordt, indien het misdrijf of een strafbare poging daartoe niet is gevolgd, gestraft met gevangenisstraf
      van ten hoogste vijf jaren of geldboete van de eerste categorie, echter met dien verstande dat nimmer eene
      zwaardere straf wordt uitgesproken dan terzake van poging tot het misdrijf of, indien zoodanige poging niet
      strafbaar is, terzake van het misdrijf zelf kan worden opgelegd. Deze bepaling is op hem niet van toepassing,
      indien het misdrijf of eene strafbare poging daartoe niet is gevolgd ten gevolge van omstandigheden van zijnen
      wil afhankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel49
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel140bis
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '49'
  - number: '141'
    text: |-
      Hij die, kennis dragende van een strafbare samenspanning tot enig misdrijf dan wel van een voornemen tot het
      plegen van een terroristisch misdrijf op een tijdstip waarop het plegen van dit misdrijf nog kan worden voorkomen,
      opzettelijk nalaat daarvan tijdig voldoende kennis te geven, hetzij aan de ambtenaren van de justitie of politie,
      hetzij aan de bedreigde, wordt, indien het misdrijf is gevolgd, gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel141
  - number: '142'
    text: |-
      Hij die, kennis dragende van een voornemen tot het plegen van een der in de [artikelen 97–116][ref1] omschreven
      misdrijven, tot desertie in tijd van oorlog, tot militair verraad, tot moord, menschenroof of verkrachting of
      tot een der in [Titel VII van dit Boek][ref2] omschreven misdrijven voor zoover daardoor levensgevaar wordt
      veroorzaakt, op een tijdstip waarop het plegen van deze misdrijven nog kan worden voorkomen, opzettelijk nalaat
      daarvan tijdig voldoende kennis te geven, hetzij aan de ambtenaren der justitie of politie, hetzij aan den
      bedreigde, wordt, indien het misdrijf is gevolgd, gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de eerste categorie. Dezelfde straf is toepasselijk op hem die, kennis dragende van eenig in het
      eerste lid vermeld reeds gepleegd misdrijf waardoor levensgevaar is ontstaan, op een tijdstip waarop de gevolgen
      nog kunnen worden afgewend, opzettelijk nalaat daarvan gelijke kennisgeving te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0028570
  - number: '143'
    text: |-
      De bepalingen van de [artikelen 141][ref1] en [142][ref2] zijn niet van toepassing op hem die door de kennisgeving
      gevaar voor eene strafvervolging zou doen ontstaan voor zich zelven, voor een zijner bloedverwanten of aangehuwden
      in de rechte linie of in den tweeden of derden graad der zijlinie, voor zijn echtgenoot of gewezen echtgenoot, of
      voor een ander bij wiens vervolging hij zich, uit hoofde van zijn ambt of beroep, van het afleggen van getuigenis
      zou kunnen verschoonen.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel142
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '142'
  - number: 143a.1
    text: |-
      Hij die zich in het openbaar, mondeling of bij geschrift of afbeelding, opzettelijk beledigend uitlaat over een
      groep mensen wegens hun ras, hun godsdienst of hun levensovertuiging, hun hetero- of homoseksuele gerichtheid of
      hun lichamelijke, psychische of verstandelijke handicap of geslacht, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143a
  - number: 143a.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143a
  - number: 143b.1
    text: |-
      Hij die in het openbaar, mondeling of bij geschrift of afbeelding, aanzet tot haat tegen of discriminatie
      van mensen of gewelddadig optreden tegen persoon of goed van mensen wegens hun ras, hun godsdienst of hun
      levensovertuiging, hun hetero- of homoseksuele gerichtheid of hun lichamelijke, psychische of verstandelijke
      handicap of geslacht, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143b
  - number: 143b.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143b
  - number: 143c.1
    text: Hij die, anders dan ten behoeve van zakelijke berichtgeving,
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143c
  - number: 143c.1.1°
    text: |-
      een uitlating openbaarmaakt, die, naar hij weet of redelijkerwijs moet vermoeden, voor een groep mensen wegens
      hun ras, hun godsdienst of hun levensovertuiging, hun hetero- of homoseksuele gerichtheid of hun lichamelijke,
      psychische of verstandelijke handicap of geslacht, beledigend is of aanzet tot haat of discriminatie van mensen of
      gewelddadig optreden tegen persoon of goed van mensen wegens hun ras, hun godsdienst of hun levensovertuiging, hun
      hetero- of homoseksuele gerichtheid of hun lichamelijke, psychische of verstandelijke handicap of geslacht;*
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143c
  - number: 143c.1.2°
    text: |-
      een voorwerp waarin, naar hij weet of redelijkerwijs moet vermoeden, zulk een uitlating is vervat, verspreidt of
      ter openbaarmaking van die uitlating of verspreiding in voorraad heeft; wordt gestraft met gevangenisstraf van ten
      hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143c
  - number: 143c.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143c
  - number: 143c.3
    text: |-
      Indien de schuldige een der strafbare feiten, omschreven in dit artikel, in zijn beroep begaat en er, tijdens het
      plegen van dit feit, nog geen vijf jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een
      van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143c
  - number: 143d
    text: |-
      Hij die deelneemt of geldelijke of andere stoffelijke steun verleent aan activiteiten gericht op discriminatie van
      mensen wegens hun ras, hun godsdienst, hun levensovertuiging, hun geslacht, hun hetero- of homoseksuele gerichtheid
      of hun lichamelijke, psychische of verstandelijke handicap, wordt gestraft met gevangenisstraf van ten hoogste drie
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143d
  - number: 143e.1
    text: |-
      Hij die in de uitoefening van een ambt, beroep of bedrijf personen opzettelijk discrimineert wegens hun ras, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143e
  - number: 143e.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel143e
  - number: '144'
    text: |-
      Hij die, hetzij in de woning of in het bij eene woning behorend erf, hetzij in het besloten lokaal of erf, bij een
      ander in gebruik, wederrechtelijk binnendringt of, wederrechtelijk aldaar vertoevende, zich niet op de vordering
      van of vanwege den rechthebbende aanstonds verwijdert, wordt gestraft met gevangenisstraf van ten hoogste zes
      maanden of geldboete van de eerste categorie. Hij die zich den toegang heeft verschaft door middel van braak of
      inklimming, van valsche sleutels, van een valsche order of van een valsch kostuum, of die, zonder voorkennis van
      den rechthebbende en anders dan tengevolge van vergissing binnengekomen, aldaar bij nacht wordt aangetroffen, wordt
      geacht te zijn binnengedrongen. Indien hij bedreigingen uit of zich bedient van middelen geschikt om vrees aan
      te jagen, wordt hij gestraft met gevangenisstraf van ten hoogste een jaar. De in het eerste en derde lid bepaalde
      straffen kunnen met een derde worden verhoogd, indien twee of meer vereenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144
  - number: 144a.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt, als schuldig aan
      computervredebreuk, gestraft hij die opzettelijk en wederrechtelijk binnendringt in een geautomatiseerd werk of in
      een deel daarvan. Van binnendringen is in ieder geval sprake indien de toegang tot het werk wordt verworven:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.1.a
    text: door het doorbreken van een beveiliging;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.1.b
    text: door een technische ingreep;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.1.c
    text: met behulp van valse signalen of een valse sleutel, of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.1.d
    text: door het aannemen van een valse hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.2
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk, indien de dader vervolgens gegevens die zijn opgeslagen, worden verwerkt of overgedragen door
      middel van een geautomatiseerd werk waarin hij zich wederrechtelijk bevindt, voor zichzelf of een ander overneemt,
      aftapt of opneemt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.3
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk gepleegd door tussenkomst van een openbaar telecommunicatie netwerk, indien de dader vervolgens:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.3.a
    text: |-
      met het oogmerk zichzelf of een ander wederrechtelijk te bevoordelen gebruik maakt van verwerkingscapaciteit van
      een geautomatiseerd werk;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144a.3.b
    text: |-
      door tussenkomst van een geautomatiseerd werk waarin hij is binnengedrongen de toegang verwerft tot het
      geautomatiseerd werk van een derde.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144a
  - number: 144b
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk de toegang tot of het gebruik van een geautomatiseerd werk belemmert door daaraan
      gegevens aan te bieden of toe te zenden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel144b
  - number: '145'
    text: |-
      Hij die in een voor den openbaren dienst bestemd lokaal wederrechtelijk binnendringt of, wederrechtelijk aldaar
      vertoevende, zich niet op de vordering van den bevoegden ambtenaar aanstonds verwijdert, wordt gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de eerste categorie. Hij die zich den toegang heeft
      verschaft door middel van braak of inklimming, van valsche sleutels, van een valsche order of een valsch kostuum,
      of die zonder voorkennis van den bevoegden ambtenaar en anders dan tengevolge van vergissing binnengekomen, aldaar
      bij nacht wordt aangetroffen, wordt geacht te zijn binnengedrongen. Indien hij bedreigingen uit of zich bedient van
      middelen geschikt om vrees aan te jagen, wordt hij gestraft met gevangenisstraf van ten hoogste een jaar. De in het
      eerste en derde lid bepaalde straffen kunnen met een derde worden verhoogd, indien twee of meer vereenigde personen
      het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145
  - number: 145a.1
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die met een
      technisch hulpmiddel een gesprek dat in een woning, besloten lokaal of erf wordt gevoerd opzettelijk:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.1.1°
    text: anders dan in opdracht van een deelnemer aan dat gesprek afluistert;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.1.2°
    text: zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.2
    text: 'Het eerste lid is niet van toepassing op het opnemen:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.2.1°
    text: |-
      van gegevens die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een
      geautomatiseerd werk;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.2.2°
    text: |-
      behoudens in geval van kennelijk misbruik, met een technisch hulpmiddel dat op gezag van degene bij wie de woning,
      het lokaal of het erf in gebruik is, niet heimelijk aanwezig is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
  - number: 145a.2.3°
    text: |-
      ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: 145b.1
    text: |-
      Met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft hij die, met
      het oogmerk een gesprek dat elders dan in een woning, besloten lokaal of erf wordt gevoerd af te luisteren of op te
      nemen, dat gesprek met een technisch hulpmiddel heimelijk:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145b
  - number: 145b.1.1°
    text: anders dan in opdracht van een deelnemer aan dat gesprek afluistert;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145b
  - number: 145b.1.2°
    text: zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145b
  - number: 145b.2
    text: |-
      [Artikel 145a, tweede lid, onder 1° en 3°][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel145a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 145a
  - number: 145c.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk met een technisch hulpmiddel gegevens aftapt of opneemt die niet voor hem bestemd
      zijn en die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een geautomatiseerd
      werk.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145c
  - number: 145c.2
    text: 'Het eerste lid is niet van toepassing op het aftappen of opnemen:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145c
  - number: 145c.2.1°
    text: |-
      van door middel van een radio-ontvangapparaat ontvangen gegevens, tenzij om de ontvangst mogelijk te maken een
      bijzondere inspanning is geleverd of een niet toegestane ontvanginrichting is gebruikt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145c
  - number: 145c.2.2°
    text: |-
      door of in opdracht van de gerechtigde tot een voor de telecommunicatie gebezigde aansluiting, behoudens in geval
      van kennelijk misbruik;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145c
  - number: 145c.2.3°
    text: |-
      ten behoeve van de goede werking van een openbaar telecommunicatienetwerk, ten behoeve van de strafvordering, dan
      wel ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145c
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: 145d.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die met het
      oogmerk dat daardoor een gesprek, telecommunicatie of andere gegevensoverdracht of andere gegevensverwerking door
      een geautomatiseerd werk wederrechtelijk wordt afgeluisterd, afgetapt of opgenomen, een technisch hulpmiddel op een
      bepaalde plaats aanwezig doet zijn.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145d
  - number: 145d.2
    text: |-
      Met dezelfde straf wordt gestraft hij die, met het oogmerk dat daarmee een misdrijf als bedoeld in
      [artikel 144a, eerste lid][ref1], [144b][ref2] of [145c][ref3] wordt gepleegd:


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel144a
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel144b
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel145c
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 144a
      - id: ref2
        bwb_id: BWBR0028570
        artikel: 144b
      - id: ref3
        bwb_id: BWBR0028570
        artikel: 145c
  - number: 145d.2.a
    text: |-
      een technisch hulpmiddel dat hoofdzakelijk geschikt gemaakt of ontworpen is tot het plegen van een zodanig
      misdrijf, vervaardigt, verkoopt, verwerft, invoert, verspreidt of anderszins ter beschikking stelt of voorhanden
      heeft, of
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145d
  - number: 145d.2.b
    text: |-
      een computerwachtwoord, toegangscode of daarmee vergelijkbaar gegeven waardoor toegang kan worden gekregen tot een
      geautomatiseerd werk of een deel daarvan, verkoopt, verwerft, verspreidt of anderszins ter beschikking stelt of
      voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145d
  - number: 145d.3
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft hij die
      het in het tweede lid bedoelde feit pleegt terwijl zijn oogmerk is gericht op een misdrijf als bedoeld in
      [artikel 144a, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel144a
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: 144a
  - number: 145e
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145e
  - number: 145e.1°
    text: |-
      hij die de beschikking heeft over een voorwerp waarop, naar hij weet of redelijkerwijs moet vermoeden, gegevens
      zijn vastgelegd die door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek, telecommunicatie of
      andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145e
  - number: 145e.2°
    text: |-
      hij die gegevens die hij door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek, telecommunicatie of
      andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk heeft verkregen of die, naar
      hij weet of redelijkerwijs moet vermoeden, ten gevolge van zulk afluisteren, aftappen of opnemen te zijner kennis
      zijn gekomen, opzettelijk aan een ander bekend maakt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145e
  - number: 145e.3°
    text: hij die een voorwerp als omschreven onder 1° opzettelijk ter beschikking stelt van een ander.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel145e
  - number: '146'
    text: |-
      Deelneming aan eene organisatie, die tot oogmerk heeft het plegen van misdrijven, wordt gestraft met
      gevangenisstraf van ten hoogste vijf jaren of geldboete van de vijfde categorie. Deelneming aan een andere bij
      algemene maatregel van bestuur verboden organisatie wordt gestraft met gevangenisstraf van ten hoogste zes maanden
      of geldboete van de eerste categorie. Ten aanzien der oprichters of bestuurders kunnen deze gevangenisstraffen met
      een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel146
  - number: 146a.1
    text: |-
      Deelneming aan een organisatie die tot oogmerk heeft het plegen van terroristische misdrijven, wordt gestraft met
      gevangenisstraf van ten hoogste achttien jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel146a
  - number: 146a.2
    text: |-
      Oprichters, leiders of bestuurders van een organisatie als bedoeld in het eerste lid, worden gestraft met
      levenslange gevangenisstraf of tijdelijke van ten hoogste vierentwintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel146a
  - number: 146a.3
    text: |-
      Onder deelneming als omschreven in het eerste lid wordt mede begrepen het verlenen van geldelijke of andere
      stoffelijke steun aan alsmede het werven van gelden of personen ten behoeve van de in dat lid omschreven
      organisatie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel146a
  - number: '147'
    text: |-
      Zij die openlijk met vereenigde krachten geweld plegen tegen personen of goederen worden gestraft met
      gevangenisstraf van ten hoogste vier jaren en zes maanden. De schuldige wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel147
  - number: 147.1°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren, indien hij opzettelijk goederen vernielt of indien het door hem
      gepleegde geweld eenig lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel147
  - number: 147.2°
    text: met gevangenisstraf van ten hoogste negen jaren, indien dat geweld zwaar lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel147
  - number: 147.3°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien dat geweld den dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel147
  - number: 147bis
    text: |-
      Hij, die door het opzettelijk verspreiden van een logenachtig bericht onrust verwekt onder de bevolking, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel147bis
  - number: '148'
    text: |-
      Hij die opzettelijk door valsche alarmkreten of signalen de rust verstoort, wordt gestraft met gevangenisstraf van
      ten hoogste twee weken of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel148
  - number: '149'
    text: |-
      Hij die door geweld of bedreiging met geweld eene geoorloofde openbare vergadering verhindert, wordt gestraft met
      gevangenisstraf van ten hoogste negen maanden.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel149
  - number: '150'
    text: |-
      Hij die opzettelijk door het verwekken van wanorde of het maken van gedruisch eene geoorloofde openbare vergadering
      stoort, wordt gestraft met gevangenisstraf van ten hoogste twee weken of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel150
  - number: '151'
    text: |-
      Hij die door geweld of bedreiging met geweld hetzij eene geoorloofde openbare godsdienstige bijeenkomst, hetzij
      eene geoorloofde kerkelijke plechtigheid of lijkplechtigheid verhindert, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel151
  - number: '152'
    text: |-
      Hij die opzettelijk door het verwekken van wanorde of het maken van gedruisch hetzij eene geoorloofde openbare
      godsdienstige bijeenkomst, hetzij eene geoorloofde kerkelijke plechtigheid of lijkplechtigheid stoort, wordt
      gestraft met gevangenisstraf van ten hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel152
  - number: '153'
    text: 'Met gevangenisstraf van ten hoogste drie maanden of geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel153
  - number: 153.1°
    text: |-
      hij die zich in het openbaar, mondeling of bij geschrift of afbeelding, door smalende Godslasteringen op voor
      godsdienstige gevoelens krenkende wijze uitlaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel153
  - number: 153.2°
    text: hij die een bedienaar van den godsdienst in de geoorloofde waarneming zijner bediening bespot;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel153
  - number: 153.3°
    text: |-
      hij die voorwerpen aan eenen eeredienst gewijd, waar en wanneer de uitoefening van dien dienst geoorloofd is,
      beschimpt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel153
  - number: '154'
    text: |-
      Hij die opzettelijk den geoorloofden toegang tot eene begraafplaats of crematorium of het geoorloofd vervoer van
      een lijk naar eene begraafplaats of crematorium verhindert of belemmert, wordt gestraft met gevangenisstraf van ten
      hoogste eene maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel154
  - number: '155'
    text: |-
      Hij die opzettelijk een graf schendt of eenig op eene begraafplaats opgericht gedenkteeken opzettelijk en
      wederrechtelijk vernielt of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel155
  - number: '156'
    text: |-
      Hij die opzettelijk en wederrechtelijk een lijk opgraaft of wegneemt of een opgegraven of weggenomen lijk
      verplaatst of vervoert, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel156
  - number: '157'
    text: |-
      Hij die een lijk begraaft, verbrandt, vernietigt, verbergt, wegvoert of wegmaakt, met het oogmerk om het feit of de
      oorzaak van het overlijden, dan wel van het dood ter wereld komen te verhelen, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaar of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel157
  - number: '158'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel158
  - number: '159'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel159
  - number: '160'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel160
  - number: '161'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel161
  - number: '162'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel162
  - number: '163'
    text: 'Hij die opzettelijk brand sticht, eene ontploffing teweegbrengt of eene overstrooming veroorzaakt, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel163
  - number: 163.1°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien daarvan gemeen gevaar voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel163
  - number: 163.2°
    text: met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel163
  - number: 163.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren, indien daarvan levensgevaar voor een
      ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel163
  - number: '164'
    text: 'Hij aan wiens schuld brand, ontploffing of overstrooming te wijten is, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel164
  - number: 164.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie, indien daardoor
      gemeen gevaar voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel164
  - number: 164.2°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden, of geldboete van de eerste categorie, indien daardoor
      levensgevaar voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel164
  - number: 164.3°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar, indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel164
  - number: '165'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van brand bluschgereedschappen of bluschmiddelen wederrechtelijk
      verbergt of onbruikbaar maakt, of op eenige wijze de blussching van brand verhindert of belemmert, wordt gestraft
      met gevangenisstraf van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel165
  - number: '166'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van watersnood, dijkmaterialen of gereedschappen wederrechtelijk
      verbergt of onbruikbaar maakt, eenige poging tot herstel van dijken of andere waterstaatswerken verijdelt, of de
      aangewende middelen tot het voorkomen of stuiten van overstrooming tegenwerkt, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel166
  - number: '167'
    text: |-
      Hij die opzettelijk enig werk, dienend tot waterkering, waterlozing, gas- of waterleiding of riolering, vernielt,
      onbruikbaar maakt of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167
  - number: 167.1°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren, indien daarvan gevaar voor overstroming of gemeen gevaar voor
      goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167
  - number: 167.2°
    text: met gevangenisstraf van ten hoogste negen jaren, indien daarvan levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167
  - number: 167.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is en het
      feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167
  - number: 167a
    text: |-
      Hij die opzettelijk eenig electriciteitswerk vernielt, beschadigt of onbruikbaar maakt, stoornis in den gang of
      in de werking van zoodanig werk veroorzaakt, of een ten opzichte van zoodanig werk genomen veiligheidsmaatregel
      verijdelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167a
  - number: 167a.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de eerste categorie, indien daardoor verhindering
      of bemoeilijking van stroomlevering ten algemeenen nutte ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167a
  - number: 167a.2°
    text: met gevangenisstraf van ten hoogste zes jaren, indien daarvan gemeen gevaar voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167a
  - number: 167a.3°
    text: met gevangenisstraf van ten hoogste negen jaren, indien daarvan levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167a
  - number: 167a.4°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is en het
      feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167a
  - number: 167b
    text: |-
      Hij aan wiens schuld te wijten is, dat eenig electriciteitswerk wordt vernield, beschadigd, of onbruikbaar gemaakt,
      dat stoornis in den gang of in de werking van zoodanig werk ontstaat, of dat een ten opzichte van zoodanig werk
      genomen veiligheidsmaatregel wordt verijdeld, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167b
  - number: 167b.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie, indien daardoor
      verhindering of bemoeilijking van stroomlevering ten algemeenen nutte of gemeen gevaar voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167b
  - number: 167b.2°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie, indien daardoor
      levensgevaar voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167b
  - number: 167b.3°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar, indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167b
  - number: 167c
    text: |-
      Hij die opzettelijk mensen, dieren, planten of goederen aan ioniserende stralen blootstelt, dan wel mensen, dieren,
      planten, goederen, bodem, water of lucht met radioactieve stoffen besmet, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167c
  - number: 167c.1°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan gevaar voor de openbare gezondheid of
      levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167c
  - number: 167c.2°
    text: |-
      met levenslange gevangenisstraf of tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167c
  - number: 167d
    text: |-
      Hij aan wiens schuld te wijten is dat mensen, dieren, planten of goederen aan ioniserende stralen worden
      blootgesteld, dan wel mensen, dieren, planten, goederen, bodem, water of lucht met radioactieve stoffen worden
      besmet, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167d
  - number: 167d.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien daarvan
      gevaar voor de openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167d
  - number: 167d.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167d
  - number: 167e
    text: |-
      Hij die opzettelijk enig geautomatiseerd werk of enig werk voor telecommunicatie vernielt, beschadigt of
      onbruikbaar maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van
      zodanig werk genomen veiligheidsmaatregel verijdelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167e
  - number: 167e.1°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daardoor
      wederrechtelijk verhindering of bemoeilijking van de opslag, verwerking of overdracht van gegevens ten
      algemene nutte of stoornis in een openbaar telecommunicatienetwerk of in de uitvoering van een openbare
      telecommunicatiedienst, ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167e
  - number: 167e.2°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren, indien daarvan gemeen gevaar voor goederen of voor de verlening van
      diensten te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167e
  - number: 167e.3°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167e
  - number: 167e.4°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is en het
      feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167e
  - number: 167f
    text: |-
      Hij aan wiens schuld te wijten is dat enig geautomatiseerd werk voor opslag of verwerking van gegevens of enig werk
      voor telecommunicatie wordt vernield, beschadigd of onbruikbaar gemaakt, dat stoornis in de gang of in de werking
      van zodanig werk ontstaat, of dat een ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167f
  - number: 167f.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de derde categorie, indien daardoor
      verhindering of bemoeilijking van de opslag of verwerking van gegevens ten algemenen nutte, stoornis in een
      openbaar telecommunicatienetwerk of in de uitvoering van een openbare telecommunicatiedienst, of gemeen gevaar voor
      goederen of voor de verlening van diensten ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167f
  - number: 167f.2°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de derde categorie, indien daardoor
      levensgevaar voor een ander bestaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167f
  - number: 167f.3°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien het feit
      iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel167f
  - number: '168'
    text: |-
      Hij die opzettelijk eenig werk dienende voor het openbaar verkeer of het luchtverkeer vernielt, onbruikbaar maakt
      of beschadigt, eenigen openbaren land- of waterweg verspert of een ten aanzien van zoodanig werk of van zoodanigen
      weg genomen veiligheidsmaatregel verijdelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168
  - number: 168.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren, indien daarvan gevaar voor de veiligheid van het verkeer te
      duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168
  - number: 168.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan gevaar voor de veiligheid van het verkeer te
      duchten is en het iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168
  - number: 168a
    text: |-
      Hij die opzettelijk op een luchthaven een luchtvaartuig buiten bedrijf of enige voorziening vernielt, onbruikbaar
      maakt of beschadigt, dan wel de diensten op een luchthaven verstoort, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168a
  - number: 168a.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren, indien daarvan gevaar voor de veiligheid van de luchtvaart of
      gemeen gevaar voor goederen, gebouwen of diensten op de luchthaven te duchten valt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168a
  - number: 168a.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan gevaar voor de veiligheid van de luchtvaart of
      gemeen gevaar voor goederen, gebouwen of diensten op de luchthaven te duchten valt en het feit iemands dood ten
      gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel168a
  - number: '169'
    text: |-
      Hij aan wiens schuld te wijten is dat eenig werk dienende voor het openbaar verkeer of het luchtverkeer wordt
      vernield, onbruikbaar gemaakt of beschadigd, eenige openbare land- of waterweg versperd of een ten aanzien van
      zoodanig werk of van zoodanigen weg genomen veiligheidsmaatregel verijdeld wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel169
  - number: 169.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie, indien daardoor
      het verkeer onveilig wordt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel169
  - number: 169.2°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel169
  - number: '170'
    text: |-
      Hij die opzettelijk gevaar veroorzaakt voor het verkeer door mechanische kracht over een spoorweg of voor het
      luchtverkeer, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren. Indien het feit iemands dood ten
      gevolge heeft, wordt de schuldige gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig
      jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel170
  - number: '171'
    text: |-
      Hij aan wiens schuld te wijten is dat gevaar ontstaat voor het verkeer door mechanische kracht over een spoorweg
      of voor het luchtverkeer, wordt gestraft met gevangenisstraf of hechtenis van ten hoogste zes maanden of
      geldboete van de eerste categorie. Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met
      gevangenisstraf of hechtenis van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel171
  - number: '172'
    text: |-
      Hij die opzettelijk een voor de veiligheid der scheepvaart of luchtvaart gesteld teken of hulpmiddel vernielt,
      beschadigt, wegneemt of verplaatst, de werking daarvan verijdelt, of een verkeerd teken stelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel172
  - number: 172.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren, indien daarvan gevaar voor de veiligheid der scheepvaart of
      luchtvaart te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel172
  - number: 172.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan gevaar voor de veiligheid der scheepvaart of
      luchtvaart te duchten is en het feit het zinken, stranden of verongelukken van een vaartuig of een luchtvaartuig
      ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel172
  - number: 172.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren, indien daarvan gevaar voor de
      veiligheid der scheepvaart of luchtvaart te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel172
  - number: '173'
    text: |-
      Hij aan wiens schuld vernieling, beschadiging, wegneming of verplaatsing van een voor de veiligheid der scheepvaart
      of luchtvaart gesteld teken of hulpmiddel dan wel de verijdeling van de werking daarvan of het stellen van een
      verkeerd teken te wijten is, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel173
  - number: 173.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie, indien daardoor
      de scheepvaart of de luchtvaart onveilig wordt;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel173
  - number: 173.2°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie, indien het feit
      het zinken, stranden of verongelukken van een vaartuig of een luchtvaartuig ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel173
  - number: 173.3°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar, indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel173
  - number: '174'
    text: |-
      Hij die enig vaartuig of luchtvaartuig opzettelijk en wederrechtelijk doet zinken, stranden of verongelukken,
      vernielt, onbruikbaar maakt of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel174
  - number: 174.1°
    text: met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel174
  - number: 174.2°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren, indien daarvan levensgevaar voor een
      ander te duchten is en het feit iemand dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel174
  - number: '175'
    text: |-
      Hij aan wiens schuld te wijten is dat eenig vaartuig of luchtvaartuig zinkt, strandt of verongelukt, vernield,
      onbruikbaar gemaakt of beschadigd wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel175
  - number: 175.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie, indien daardoor
      levensgevaar voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel175
  - number: 175.2°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar, indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel175
  - number: '176'
    text: |-
      Hij die enig gebouw, getimmerte, installatie ter zee of voor het publiek toegankelijke plaats opzettelijk vernielt
      of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel176
  - number: 176.1°
    text: met gevangenisstraf van ten hoogste twaalf jaren, indien daarvan gemeen gevaar voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel176
  - number: 176.2°
    text: met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel176
  - number: 176.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren, indien daarvan levensgevaar voor een
      ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel176
  - number: '177'
    text: |-
      Hij aan wiens schuld de vernieling of beschadiging van enig gebouw, getimmerte, installatie ter zee of voor het
      publiek toegankelijke plaats te wijten is, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel177
  - number: 177.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie, indien daardoor
      gemeen gevaar voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel177
  - number: 177.2°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie, indien daardoor
      levensgevaar voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel177
  - number: 177.3°
    text: met gevangenisstraf of hechtenis van ten hoogste een jaar, indien het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel177
  - number: '178.1'
    text: |-
      Hij die opzettelijk en wederrechtelijk een stof in een inrichting ten behoeve van de drinkwatervoorziening of in
      een tot gezamenlijk gebruik van of met anderen bestemde waterleiding brengt, dan wel de aanmaak van drinkwater in
      of de toevoer van drinkwater vanuit de openbare drinkwatervoorziening belemmert, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel178
  - number: 178.1.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel178
  - number: 178.1.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel178
  - number: '178.2'
    text: |-
      Hij die opzettelijk enig voor de openbare drinkwatervoorziening bestemd werk vernielt, beschadigt of onbruikbaar
      maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van zodanig werk
      genomen veiligheidsmaatregel verijdelt, wordt, indien daardoor verhindering of bemoeilijking van de openbare
      drinkwatervoorziening te duchten is, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel178
  - number: '179.1'
    text: |-
      Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof in een inrichting ten behoeve van de
      drinkwatervoorziening of in een tot gezamenlijk gebruik van of met anderen bestemde waterleiding, wordt gebracht,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179
  - number: 179.1.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor de
      openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179
  - number: 179.1.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179
  - number: '179.2'
    text: |-
      Hij aan wiens schuld te wijten is, dat enig voor de openbare drinkwatervoorziening bestemd werk wordt vernield,
      beschadigd, of onbruikbaar gemaakt, dat stoornis in de gang of in de werking van een zodanig werk ontstaat of dat
      een ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld, wordt, indien daardoor verhindering
      of bemoeilijking van de openbare drinkwatervoorziening te duchten is, gestraft met een gevangenisstraf van ten
      hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179
  - number: 179a
    text: |-
      Hij die opzettelijk en wederrechtelijk een stof op of in de bodem, in de lucht of in het oppervlaktewater brengt,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179a
  - number: 179a.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren, indien daarvan gevaar voor de openbare gezondheid of levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179a
  - number: 179a.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren, indien daarvan levensgevaar voor een ander te duchten is en het
      feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179a
  - number: 179b
    text: |-
      Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof op of in de bodem, in de lucht of in het
      oppervlaktewater wordt gebracht, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179b
  - number: 179b.1°
    text: |-
      met gevangenisstraf of hechtenis van ten hoogste een jaar en geldboete van de derde categorie, indien daarvan
      gevaar voor de openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179b
  - number: 179b.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel179b
  - number: '180'
    text: |-
      Hij die waren verkoopt, te koop aanbiedt, aflevert of uitdeelt, wetende dat zij voor het leven of de gezondheid
      schadelijk zijn, en dat schadelijk karakter verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste
      vijftien jaren. Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel180
  - number: '181'
    text: |-
      Hij, aan wiens schuld te wijten is dat waren, schadelijk voor het leven of de gezondheid, verkocht, afgeleverd of
      uitgedeeld worden, zonder dat de kooper of verkrijger met dat schadelijk karakter bekend is, wordt gestraft met
      gevangenisstraf of hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie. Indien het feit
      iemands dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf of hechtenis van ten hoogste een
      jaar. De waren kunnen worden verbeurd verklaard.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel181
  - number: '182'
    text: |-
      Bij veroordeeling wegens eenig in dezen Titel omschreven misdrijf, kan de schuldige worden ontzet van de
      uitoefening van het beroep waarin hij het misdrijf begaan heeft. Bij veroordeeling wegens een der in de
      [artikelen 180][ref1] en [181][ref2] omschreven misdrijven, kan de rechter de openbaarmaking zijner uitspraak
      gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel181
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '181'
  - number: 182a.1
    text: |-
      Indien op een misdrijf, strafbaar gesteld in de [artikelen 163][ref1], [165][ref2], [166][ref3], [167][ref4],
      [167a][ref5], [168][ref6], [168a][ref7], [172][ref8], [174][ref9], [176][ref10], [178][ref11] en [180][ref12], een
      gevangenisstraf van minder dan vijftien jaar is gesteld en het is begaan met een terroristisch oogmerk, wordt de in
      dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel166
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel167
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel167a
      [ref6]: https://wetten.overheid.nl/BWBR0028570#Artikel168
      [ref7]: https://wetten.overheid.nl/BWBR0028570#Artikel168a
      [ref8]: https://wetten.overheid.nl/BWBR0028570#Artikel172
      [ref9]: https://wetten.overheid.nl/BWBR0028570#Artikel174
      [ref10]: https://wetten.overheid.nl/BWBR0028570#Artikel176
      [ref11]: https://wetten.overheid.nl/BWBR0028570#Artikel178
      [ref12]: https://wetten.overheid.nl/BWBR0028570#Artikel180
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel182a
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '165'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '166'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '167'
      - id: ref5
        bwb_id: BWBR0028570
        artikel: 167a
      - id: ref6
        bwb_id: BWBR0028570
        artikel: '168'
      - id: ref7
        bwb_id: BWBR0028570
        artikel: 168a
      - id: ref8
        bwb_id: BWBR0028570
        artikel: '172'
      - id: ref9
        bwb_id: BWBR0028570
        artikel: '174'
      - id: ref10
        bwb_id: BWBR0028570
        artikel: '176'
      - id: ref11
        bwb_id: BWBR0028570
        artikel: '178'
      - id: ref12
        bwb_id: BWBR0028570
        artikel: '180'
  - number: 182a.2
    text: |-
      Indien op een misdrijf, strafbaar gesteld in de artikelen genoemd in het eerste lid, een gevangenisstraf van
      vijftien jaar is gesteld en het is begaan met een terroristisch oogmerk, kan levenslange gevangenisstraf of
      tijdelijke van ten hoogste vierentwintig jaren worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel182a
  - number: 182b
    text: |-
      De samenspanning tot de in de [artikelen 163][ref1], [167][ref2], [167a, onderdelen 3° en 4°][ref3], [168][ref4],
      [168a][ref5], [172][ref6], [174][ref7], [176][ref8], [178][ref9] en [180][ref10] omschreven misdrijven, te begaan
      met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel167a
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel168
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel168a
      [ref6]: https://wetten.overheid.nl/BWBR0028570#Artikel172
      [ref7]: https://wetten.overheid.nl/BWBR0028570#Artikel174
      [ref8]: https://wetten.overheid.nl/BWBR0028570#Artikel176
      [ref9]: https://wetten.overheid.nl/BWBR0028570#Artikel178
      [ref10]: https://wetten.overheid.nl/BWBR0028570#Artikel180
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel182b
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '163'
