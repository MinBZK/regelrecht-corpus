    text: |-
      de persoon in de openbare dienst van een in de openbare lichamen gevestigde volkenrechtelijke
      organisatie die zich buiten de openbare lichamen schuldig maakt aan een der misdrijven omschreven in de
      [artikelen 378 tot en met 380a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel378
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel6
