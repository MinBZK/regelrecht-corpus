      aan enig strafbaar feit waardoor de veiligheid van een luchtvaartuig, de veiligheid van personen of goederen
      aan boord of de goede orde en discipline aan boord in gevaar wordt gebracht, indien het strafbare feit is begaan
      aan boord van een luchtvaartuig waarvan het laatste punt van opstijgen of het volgende beoogde landingspunt zich
      bevindt in de openbare lichamen Bonaire, Sint Eustatius en Saba en dat luchtvaartuig vervolgens in een van die
      openbare lichamen landt met de verdachte aan boord.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel4
  - number: 4a.1
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op ieder tegen wie de
      strafvervolging door de openbare lichamen Bonaire, Sint Eustatius en Saba van een vreemde staat is overgenomen op
      grond van een verdrag waaruit de bevoegdheid tot strafvervolging voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba volgt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel4a
  - number: 4a.2
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is voorts toepasselijk op ieder wiens
      uitlevering ter zake van een terroristisch misdrijf dan wel een misdrijf ter voorbereiding of vergemakkelijking van
      een terroristisch misdrijf, ontoelaatbaar is verklaard, is afgewezen of geweigerd.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel4a
  - number: '5'
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op den ingezetene van de
      openbare lichamen Bonaire, Sint Eustatius en Saba die zich buiten de openbare lichamen Bonaire, Sint Eustatius en
      Saba schuldig maakt:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel5
