articles:
  - number: '1.1'
    text: Geen feit is strafbaar dan uit kracht van eene daaraan voorafgegane wettelijke strafbepaling.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel1
  - number: '1.2'
    text: |-
      Bij verandering in de wetgeving na het tijdstip waarop het feit begaan is, worden de voor den verdachte gunstigste
      bepalingen toegepast.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel1
  - number: '2'
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op ieder die zich binnen de
      openbare lichamen Bonaire, Sint Eustatius en Saba aan eenig strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel2
  - number: '3'
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op ieder, die zich buiten de
      openbare lichamen Bonaire, Sint Eustatius en Saba aan boord van een Nederlands vaartuig of luchtvaartuig aan enig
      strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel3
  - number: '4'
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is toepasselijk op ieder die zich buiten de
      openbare lichamen Bonaire, Sint Eustatius en Saba schuldig maakt:
    url: https://wetten.overheid.nl/BWBR0028570/2021-05-01#Artikel4
