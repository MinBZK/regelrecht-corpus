  - number: '18'
    text: |-
      In deze wet wordt verstaan: Onder «Schipper» elk gezagvoerder van een vaartuig, of die dezen ver vangt; Onder
      «eigenaar» ook de beheerder, en voorts ieder die krachtens zakelijk recht, bezit daaronder begrepen, beschikking
      over het vaartuig heeft.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel18
  - number: 18a
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen nadere voorschriften worden gegeven ter uitvoering
      van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Vaartuigenwet 1930 BES.'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel19
