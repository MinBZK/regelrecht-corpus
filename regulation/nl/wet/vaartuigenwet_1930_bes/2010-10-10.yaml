articles:
  - number: '1'
    text: |-
      Onverminderd de voorschriften in bestaande wettelijke regelingen voorkomende, wordt steeds door den havenmeester,
      de loodsen en hulploodsen en door de politie, ieder voor zooveel betreft het gebied, waarvoor hij is aangesteld,
      een scherp toezicht uitgeoefend op de bewegingen van alle vaartuigen van wat aard of grootte ook, in de havens en
      baaien en in de territoriale wateren rond Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel1
  - number: '2'
    text: |-
      De eigenaar van een zeil-, motor- of visschersvaartuig, dat in een van de openbare lichamen Bonaire, Sint Eustatius
      of Saba te huis behoort, is verplicht te zorgen, dat het vaartuig voorzien zij van een letter en een nummer,
      onderscheidenlijk aangevende het openbaar lichaam, waar het vaartuig te huis behoort (te weten: B. voor Bonaire; S.
      voor Saba; E. voor Sint Eustatius) en het nummer, waaronder het vaartuig, op aangifte door of vanwege den eigenaar,
      door of namens de betrokken gezaghebber is ingeschreven. Letter en nummer worden aan stuur- en bakboord op den boeg
      van het vaartuig gevoerd, en, indien het vaartuig zeilen heeft , tevens aan weerszijden van het grootzeil; letter
      en nummer moeten elk ten minste 3 d.m. hoog zijn en in witte kleur op donkeren ondergrond of in zwarte kleur op
      lichten ondergrond, en aan weerszijden van het grootzeil in zwarte kleur aangebracht zijn.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Onverminderd de voorschriften inzake nationaliteit van zeeschepen zoals die gelden in de openbare lichamen Bonaire,
      Sint Eustatius en Saba is de eigenaar van een vaartuig als bedoeld in [artikel 2][ref1], indien het een naam
      voert, verplicht te zorgen, dat deze aan weerszijden van den boeg en op den achtersteven met duidelijk waarneembare
      letters aangebracht zij.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '4'
    text: |-
      Het is verboden als schipper met een vaartuig als bedoeld in [artikel 2][ref1], van een der openbare lichamen
      Bonaire, Sint Eustatius of Saba te vertrekken, of als Schipper op te treden op een zoodanig zich op zee bevindend
      vaartuig, tenzij ten aanzien van dat vaartuig voldaan zij aan de bepalingen van [artikelen 2][ref2] en [3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028292#Artikel3
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028292
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0028292
        artikel: '3'
  - number: '5.1'
    text: |-
      Door of namens de gezaghebber wordt een register gehouden waarin alle vaartuigen als bedoeld in [artikel 2][ref1]
      van het betrokken openbaar lichaam worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '5.2'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan regelen stellen over het register, bedoeld in het eerste lid, en de
      wijze waarop het wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Het is verboden als Schipper van een der openbare lichamen Bonaire, Sint Eustatius of Saba te vertrekken met een –
      of als Schipper op te treden op een zich op zee bevindend – op een van de openbare lichamen Bonaire, Sint Eustatius
      of Saba te huis behoorend zeilvaartuig, ten aanzien waarvan de monstering niet verplichtend is, of motor- of
      visschersvaartuig, tenzij aan boord daarvan aanwezig zij een schriftelijke geteekende vrij van zegel en kosteloos
      afgegeven vergunning vermeldende:
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: 6.a
    text: 'het registernummer en – indien het vaartuig er een voert – den naam van het vaartuig:'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: 6.b
    text: den naam van den eigenaar en dien van den Schipper;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: 6.c
    text: de sterkte en namen van de leden der bemanning;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: 6.d
    text: de havens of baaien van de openbare lichamen Bonaire, Sint Eustatius of Saba, welke mogen worden aangedaan;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: 6.e
    text: en, voor wat visschersvaartuigen aangaat, de omschrijving waar gevischt mag worden.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Indien de in het [voorgaand artikel][ref1] bedoelde termijn verstrijkt terwijl het vaartuig zich op zee bevindt,
      blijft de schriftelijke vergunning van kracht tot aan het eerstvolgende binnenvaren na dien in een der havens of
      baaien van de openbare lichamen Bonaire, Sint Eustatius of Saba. Indien het vaartuig niet binnengevaren is ter
      plaatse waar de vergunning werd afgegeven, gelijk mede indien de in het [voorgaand artikel][ref2] bedoelde termijn
      verstrijkt, terwijl het vaartuig zich bevindt in een der havens of baaien van de openbare lichamen Bonaire, Sint
      Eustatius of Saba, doch niet ter plaatse, waar de vergunning werd afgegeven, zal de op zoodanige plaats tot het
      afgeven van dergelijke vergunning bevoegde ambtenaar op de vergunning een aanteekening stellen, houdende een
      voorloopige verlenging daarvan voor ten hoogste één maand, welke daarna nog voor ten hoogste twee keeren op gelijke
      wijze kan worden herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel6
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028292
        artikel: '6'
  - number: '8'
    text: |-
      De schipper van een vaartuig als bedoeld in [artikel 6][ref1] is, verplicht de in dat artikel vermelde vergunning
      aan boord te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel6
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '6'
  - number: '9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel9
  - number: '10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel10
  - number: '11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Nadat door een daartoe bevoegd persoon is geconstateerd niet-nakoming van een der bepalingen van de
      [artikelen 2][ref1] of [3][ref2], of – voor zoover de eigenaar tevens schipper is – van de [artikelen 6][ref3],
      [8][ref4], of [15a, vijfde lid][ref5], is de ambtenaar, door wien de in artikel 6 bedoelde vergunning is
      afgegeven, bevoegd die schriftelijk onder opgave van redenen in te trekken, met bepaling dat gedurende een daarbij
      te bepalen termijn van ten hoogte drie maanden van af den dag van het constateeren der niet-nakoming geen nieuwe
      vergunning aan den betrokken eigenaar zal worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028292#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028292#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0028292#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028292
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028292
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028292
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0028292
        artikel: 15a
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Het is verboden aan de vaartuigen of op de plaatsen bedoeld in de [artikelen 2][ref1] of [3][ref2], andere dan in
      die artikelen bedoelde letters, nummers of namen aan te brengen of te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel3
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028292
        artikel: '3'
  - number: '15'
    text: |-
      Tijdens het verrichten van herstellingen of schilderwerk aan het vaartuig, is het bepaalde bij de
      [artikelen 2][ref1] en [3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel3
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028292
        artikel: '3'
  - number: 15a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de politieambtenaren,
      alsmede andere, daartoe bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren. Een zodanige
      aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2
    text: |-
      De in het eerste lid bedoelde personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2.d
    text: |-
      vaartuigen, met uitzondering van de tot woning bestemde gedeelten daarvan zonder de uitdrukkelijke toestemming van
      de bewoner, te betreden, vergezeld van door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.2.e
    text: vaartuigen en de lading daarvan te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.3
    text: |-
      Zo nodig, wordt de toegang tot een vaartuig als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.4
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen regels worden gesteld met betrekking tot de wijze
      van taakuitoefening van de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: 15a.5
    text: |-
      Een ieder is verplicht aan de in het eerste lid bedoelde personen alle medewerking te verlenen die op grond van het
      tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel15a
  - number: '16.1'
    text: |-
      Overtreding van het bij deze wet bepaalde wordt, voor zover het [Wetboek van Strafrecht BES][ref1] daarin niet
      voorziet, gestraft met hechtenis van ten hoogste een maand of geldboete van ten hoogste de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '16.2'
    text: De bij deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '17.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel17
  - number: 17a
    text: |-
      Bij overtreding binnen de territoriale wateren van de [artikelen 2][ref1], [3][ref2], [4][ref3], [6][ref4] of
      [8][ref5], dan wel indien niet wordt voldaan aan een vordering krachtens [artikel 15a, vijfde lid][ref6], zijn de
      in [artikel 17, eerste lid][ref7], genoemde opsporingsambtenaren bevoegd het vaartuig naar de haven of baai van de
      openbare lichamen Bonaire, Sint Eustatius of Saba van waar is uitgevaren, of anders naar de dichtstbijzijnde haven
      of baai op te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028292#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028292#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028292#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028292#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0028292#Artikel15a
      [ref7]: https://wetten.overheid.nl/BWBR0028292#Artikel17
    url: https://wetten.overheid.nl/BWBR0028292/2010-10-10#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
