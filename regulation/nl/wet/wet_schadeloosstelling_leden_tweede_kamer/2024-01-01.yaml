preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling te treffen voor de
    schadeloosstelling en onkostenvergoedingen van de leden van de Tweede Kamer der Staten-Generaal en in verband
    daarmee de Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement (Stb. 1979, 379) te wijzigen:

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - schadeloosstelling: de schadeloosstelling,
      bedoeld in [artikel 2][ref1] van deze wet;
        - kamerlid: lid van de Tweede Kamer der Staten-Generaal;
        - de voorzitter: de voorzitter van de Tweede Kamer der Staten-Generaal;
        - de eerste, tweede en overige ondervoorzitters: de eerste, tweede respectievelijk overige ondervoorzitters van de
      Tweede Kamer der Staten-Generaal;
        - fractievoorzitter: kamerlid waarvan door de voorzitter is vastgesteld dat dat lid voorzitter is van een fractie,
      dan wel enig lid is van een fractie;
        - griffier: de griffier van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
  - number: '1.2'
    text: Deze wet is niet van toepassing op kamerleden die het ambt van minister of staatssecretaris bekleden.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel1
  - number: '1.3'
    text: |-
      De [artikelen 2 tot en met 6][ref1] van deze wet zijn van overeenkomstige toepassing op het kamerlid aan wie
      ingevolge [artikel X 10 van de Kieswet][ref2] tijdelijk ontslag is verleend wegens zwangerschap en bevalling of
      ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '2.1'
    text: |-
      De kamerleden genieten een schadeloosstelling van € 9.293,93 per maand, vermeerderd met een vakantie-uitkering van
      8 procent.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van
      het loon is overeengekomen en daarbij is bepaald dat die wijziging een algemeen karakter draagt, wordt bij
      ministeriële regeling met ingang van de datum, waarop die wijziging ingaat, de schadeloosstelling van kamerleden
      dienovereenkomstig gewijzigd, onder nadere vaststelling, voor zoveel nodig, van het in het eerste lid genoemde
      bedrag.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel2
  - number: 2a.1
    text: |-
      Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst is overeengekomen dat zij een
      eenmalige uitkering ontvangen en daarbij is bepaald dat dat deze uitkering een algemeen karakter draagt, ontvangen
      de kamerleden een uitkering op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Indien de hoogte van de uitkering, bedoeld in het eerste lid, afhankelijk is van de hoogte van de
      schadeloosstelling, wordt bij de vaststelling hiervan rekening gehouden met een eventuele vermindering van de
      schadeloosstelling als bedoeld in [artikel 3][ref1], met een eventuele toelage als bedoeld in [artikel 11][ref2],
      alsmede met een verhoging van de schadeloosstelling als bedoeld in [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel12
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004939
        artikel: '12'
        paragraaf: '4'
  - number: 2b
    text: |-
      De kamerleden ontvangen een eindejaarsuitkering van 8,3 procent van de schadeloosstelling, bedoeld in
      [artikel 2][ref1], verminderd met de vakantie-uitkering en indien van toepassing rekening houdend met de toelagen,
      bedoeld in de [artikelen 11][ref2] en [12][ref3], en met een eventuele vermindering van de schadeloosstelling als
      bedoeld in [artikel 3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004939
