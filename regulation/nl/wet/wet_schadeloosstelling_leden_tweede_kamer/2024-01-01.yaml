                    20 km


                    –


                    € 130
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Voorts ontvangen de kamerleden met uitzondering van de voorzitter ter vergoeding van reiskosten buiten het woon-
      werkverkeer een bedrag van € 4900 per jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het in het tweede lid genoemde bedrag wordt aangepast bij ministeriële regeling overeenkomstig de wijziging in
      de vergoeding die in een collectieve arbeidsovereenkomst is overeengekomen voor de ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties
      voor dienstreizen voor het gebruik van een eigen motorvoertuig indien openbaar vervoer niet mogelijk of niet
      doelmatig is.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel7
  - number: '7.4'
    text: |-
      De griffier stelt ten laste van de Tweede Kamer op aanvraag de noodzakelijke faciliteiten ten behoeve van vervoer
      en verblijf ter beschikking in verband met buitenlandse reizen die een kamerlid in het kader van de uitoefening van
      het kamerlidmaatschap maakt.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      De kamerleden ontvangen ter vergoeding voor verblijfkosten een bedrag waarvan de hoogte afhankelijk is van de
      afstand van de woonplaats van het kamerlid of het door het kamerlid bewoonde deel van de woonplaats tot het gebouw
      van de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: '8.2'
    text: 'De hoogte van het in het eerste lid bedoelde bedrag wordt berekend als volgt:'
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: 8.2.0
    text: km.100 * bedrag A + 10 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: 8.2.10
    text: km.100 * bedrag A + 40 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: 8.2.75
    text: km.55 * bedrag A + 85 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: 8.2.150
    text: km. en meer:140 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het kamerlid aan wie ingevolge [artikel X 10 van de Kieswet][ref1] tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte heeft aanspraak op een vergoeding van € 500,– per maand indien de afstand
      van de woonplaats van het kamerlid of het door het kamerlid bewoonde deel van de woonplaats tot het gebouw van de
      Tweede Kamer der Staten-Generaal groter is dan 75 km en hij voor de uitoefening van het kamerlidmaatschap beschikt
      over huisvesting voor verblijf in of nabij ’s-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '9.1'
    text: |-
      De kamerleden ontvangen een vergoeding voor aan de uitoefening van het kamerlidmaatschap verbonden kosten die
      € 3.406,54 per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het kamerlid aan wie ingevolge [artikel X 10 van de Kieswet][ref1] tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte ontvangt een onkostenvergoeding ter hoogte van de helft van het in het eerste
      lid genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '9.3'
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het tweede kalenderjaar voorafgaand aan die
      datum ten opzichte van hetzelfde indexcijfer geldend voor de maand september van het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      De griffier kent een kamerlid dat naar het oordeel van een arts een structurele functionele
      beperking heeft, ten laste van de Tweede Kamer op aanvraag een voorziening toe als bedoeld in
      [artikel 35, tweede en derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel een financiële
      vergoeding daarvoor.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '10.2'
    text: |-
      Het gestelde bij of krachtens [artikel 35, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
  - number: 10a
    text: |-
      De griffier stelt ten laste van de Tweede Kamer aan een kamerlid voor de duur van diens kamerlidmaatschap
      informatie- en communicatievoorzieningen ter beschikking, daarbij inbegrepen de abonnementen, die noodzakelijk zijn
      voor de uitoefening van het kamerlidmaatschap.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10a
  - number: 10b
    text: |-
      De kosten die een kamerlid maakt omdat hij zich tijdens het vervullen van het ambt oriënteert op zijn verdere
      loopbaan of mobiliteit bevorderende activiteiten ontplooit, komen ten laste van de Staat, op voorwaarde dat de
      voorzitter van oordeel is dat:
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10b
  - number: 10b.a
    text: |-
      de prijs/kwaliteitverhouding van de desbetreffende loopbaan oriëntatie of mobiliteit bevorderende activiteit
      redelijk is;
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10b
  - number: 10b.b
    text: |-
      die loopbaan oriëntatie of mobiliteit bevorderende activiteit niet kan worden aangemerkt als een
      sollicitatieactiviteit; en
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10b
  - number: 10b.c
    text: de kosten ervan niet reeds uit anderen hoofde voor vergoeding in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10b
  - number: 10c
    text: De voorzitter treft voor de kamerleden een voorziening voor bedrijfsgeneeskundige zorg.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel10c
  - number: '11.1'
    text: |-
      Naast de schadeloosstelling ontvangt de voorzitter een toelage gelijk aan 34% van de schadeloosstelling op
      jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      De eerste en tweede ondervoorzitter ontvangen een toelage gelijk aan 3,5% respectievelijk 2,5% van de
      schadeloosstelling op jaarbasis, en de overige ondervoorzitters ontvangen een toelage gelijk aan 1% van de
      schadeloosstelling op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      De eerste ondervoorzitter die gedurende meer dan 30 dagen onafgebroken de functie van de voorzitter waarneemt,
      ontvangt voor die tijd in plaats van de toelage, bedoeld in het tweede lid, een toelage ten bedrage van de helft
      van die van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      Naast de schadeloosstelling ontvangen de fractievoorzitters voor de duur van hun voorzitterschap per jaar
      een toelage gelijk aan 1% van de schadeloosstelling op jaarbasis en een toelage gelijk aan 0,3% van de
      schadeloosstelling op jaarbasis voor elk lid dat de fractie buiten de fractievoorzitter telt. De toelagen tezamen
      bedragen ten hoogste 11,5% van de schadeloosstelling op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12
  - number: '12.2'
    text: 'Voor de toepassing van het eerste lid stelt de voorzitter vast:'
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12
  - number: 12.2.a
    text: hoeveel leden een fractie telt;
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12
  - number: 12.2.b
    text: de duur van het fractievoorzitterschap.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12
  - number: 12a.1
    text: |-
      Ten behoeve van het woon-werkverkeer en dienstreizen van de voorzitter kan in plaats van de voorziening, bedoeld in
      [artikel 7, eerste en tweede lid][ref1], een dienstauto ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel7
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '7'
        paragraaf: '3'
  - number: 12a.2
    text: |-
      Op een daartoe strekkend advies van de Nationaal Coördinator Terrorismebestrijding en Veiligheid kan aan de
      voorzitter in plaats van de voorziening, bedoeld in [artikel 7, eerste en tweede lid][ref1], voor de duur van het
      voorzitterschap een dienstauto met chauffeur ter beschikking worden gesteld voor zowel zakelijk als privégebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel7
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '7'
        paragraaf: '3'
  - number: 12a.3
    text: |-
      De prijs per kilometer van de dienstauto, bedoeld in het eerste of tweede lid, bedraagt niet meer dan € 0,76
      exclusief BTW, berekend op de grondslag van een gebruiksduur van twee jaar en 60 000 gereden kilometers per jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Het bedrag, genoemd in het derde lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd
      overeenkomstig de procentuele wijziging van het prijsindexcijfer jaargemiddelde operationele autolease inclusief
      brandstof, zoals door het Centraal Bureau voor de Statistiek gepubliceerd, over het tweede kalenderjaar voorafgaand
      aan genoemde datum ten opzichte van hetzelfde indexcijfer over het jaar daaraan voorafgaand.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
  - number: 12a.5
    text: |-
      De prijs per kilometer wordt berekend aan de hand van de formule (((n / (l/12)) + o + f + g + h + p) / m) +
      i, waarin: n = (((a-c)/1,19) + (b/1,19) + c) – (d/1,19) afschrijving over looptijd (inclusief belasting van
      personenauto's en motorrijwielen en exclusief belasting over de toegevoegde waarde (omzetbelasting)); o = ((d/1,19)
      x e) + ((n/2) x e) rente per jaar; p = ((k/1,19) x (m/100) x j) brandstofkosten per jaar; en: a = consumentenprijs
      inclusief accessoires af fabriek (inclusief belasting van personenauto's en motorrijwielen en belasting over de
      toegevoegde waarde (omzetbelasting)); b = consumentenprijs van accessoires achteraf en/of door derden (inclusief
      belasting over de toegevoegde waarde (omzetbelasting)); c = totale belasting van personenauto's en motorrijwielen;
      d = totale marktconforme restwaarde inclusief belasting over de toegevoegde waarde (omzetbelasting) en belasting
      van personenauto's en motorrijwielen; e = rentetarief in procenten; f = administratiekosten inclusief management
      fee per jaar doch exclusief belasting over de toegevoegde waarde (omzetbelasting) (of interne kosten ingeval
      niet wordt uitbesteed); g = houderschapsbelasting per jaar; h = het in het kader van het omslagstelsel door het
      Bureau Schade Afwikkeling vastgestelde bedrag; i = prijs van reparatie, onderhoud en banden exclusief belasting
      over de toegevoegde waarde (omzetbelasting); j = brandstofverbruik in liters per 100 kilometer; k = tarief bij
      brandstofsoort inclusief belasting over de toegevoegde waarde (omzetbelasting); l = looptijd in maanden; m =
      jaarkilometrage.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
  - number: 12a.6
    text: |-
      De dienstauto, bedoeld in het eerste of tweede lid, wordt slechts in gebruik genomen nadat is vastgesteld dat
      aan de voorschriften van het tweede tot en met vierde lid is voldaan, tenzij afwijking van deze voorschriften
      noodzakelijk is om redenen van veiligheid of wegens een individuele werkplekanalyse, verricht of getoetst door een
      deskundige persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1]. Artikel 14,
      tweede lid, onderdelen b en c, van de Arbeidsomstandighedenwet is in het tweede geval van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 12b.1
    text: |-
      Indien aan de voorzitter op grond van [artikel 12a, tweede lid][ref1], een dienstauto ter beschikking is gesteld,
      ontvangt hij een maandelijkse vergoeding voor de door hem verschuldigde loonbelasting over het privégebruik van de
      dienstauto. De vergoeding wordt berekend aan de hand van de formule waarin: M = het bedrag van de vergoeding; CAT
      = de catalogusprijs van de dienstauto, met inbegrip van BTW en BPM, verminderd met het deel van de catalogusprijs,
      met inbegrip van BTW en BPM, dat toerekenbaar is aan buitengewone beveiligingsmaatregelen; P = het toepasselijke
      percentage, genoemd in [artikel 13bis, eerste lid, van de Wet op de loonbelasting 1964][ref2]; T = het hoogste
      van de in de tarieftabel van [artikel 20a, eerste lid, van de Wet op de loonbelasting 1964][ref3] opgenomen
      percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: 12a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 13bis
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 20a
  - number: 12b.2
    text: |-
      Aangewezen als een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1] wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 12b.2.a
    text: de maandelijkse vergoeding, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12b
  - number: 12b.2.b
    text: |-
      het tot het belastbare loon in de zin van de [Wet op de loonbelasting 1964][ref1] van de voorzitter behorend
      voordeel ter zake van de dienstauto toerekenbaar aan buitengewone beveiligingsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '13'
    text: |-
      Ten aanzien van een kamerlid waarvan de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing
      van die wet als dienstbetrekking wordt aangemerkt, worden als eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref2] aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 13.a
    text: |-
      de bedragen, bedoeld in [artikel 7, eerste lid][ref1], voor zover deze niet worden gerekend tot een vergoeding als
      bedoeld in [artikel 31a, tweede lid, onderdeel a, onder 2˚ en 3˚, van de Wet op de loonbelasting 1964][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 31a
  - number: 13.b
    text: |-
      de bedragen, bedoeld in [artikel 7, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel7
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '7'
        paragraaf: '3'
  - number: 13.c
    text: |-
      het bedrag, bedoeld in [artikel 8, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel8
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '8'
        paragraaf: '3'
  - number: 13.d
    text: |-
      de vergoeding, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel9
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '9'
        paragraaf: '3'
  - number: 13.e
    text: |-
      een voorziening of financiële tegemoetkoming als bedoeld in [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel10
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '10'
        paragraaf: '3'
  - number: 13.f
    text: |-
      de verstrekkingen, bedoeld in [artikel 10a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel10a
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: 10a
        paragraaf: '3'
  - number: 13.g
    text: |-
      de vergoeding, bedoeld in [artikel 10b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel10b
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: 10b
        paragraaf: '3'
  - number: '18.1'
    text: |-
      De Wet van 30 oktober 1968, houdende regeling schadeloosstelling leden Tweede Kamer der Staten-Generaal (*Stb.*
      1990, 477) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      De algemene maatregel van bestuur van 21 september 1990 (*Stb.* 1990, 506) tot nadere vaststelling van de
      vergoeding voor de leden van de Tweede Kamer der Staten-Generaal voor de overige kosten, welke uit de vervulling
      van hun betrekking voortvloeien, blijft voor wat betreft de vergoeding voor de overige kosten, bedoeld in artikel
      11 van de in het eerste lid bedoelde wet, voor de maanden november en december 1989 van kracht.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel18
  - number: '19'
    text: |-
      De Wet van 28 december 1989, houdende voorzieningen ten behoeve van de leden van de Tweede Kamer der Staten-
      Generaal en belanghebbenden in de zin van de [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1]
      in verband met de voorstellen van de commissie tot vereenvoudiging van de loonbelasting en de inkomstenbelasting
      (*Stb.* 1989, 591) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: 19a
    text: |-
      Onder neveninkomsten als bedoeld in [artikel 3, tweede lid][ref1], wordt met betrekking tot aan het kalenderjaar
      2001 voorafgaande kalenderjaren verstaan winst uit onderneming en zuivere inkomsten uit tegenwoordige arbeid. Met
      betrekking tot die jaren wordt in [artikel 3, derde lid, onder Wet inkomstenbelasting 2001](onbekend) verstaan Wet
      op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
  - number: '21'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met 1 januari 1990.
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel21
  - number: '22'
    text: 'Deze wet kan worden aangehaald als: Wet schadeloosstelling leden Tweede Kamer.'
    url: https://wetten.overheid.nl/BWBR0004939/2024-01-01#Artikel22
