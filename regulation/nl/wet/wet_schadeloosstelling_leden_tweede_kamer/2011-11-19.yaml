preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling te treffen voor de
    schadeloosstelling en onkostenvergoedingen van de leden van de Tweede Kamer der Staten-Generaal en in verband
    daarmee de Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement (Stb. 1979, 379) te wijzigen:

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - Onze Minister: Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties;
        - schadeloosstelling: de schadeloosstelling, bedoeld in [artikel 2][ref1] van deze wet;
        - kamerlid: lid van de Tweede Kamer der Staten-Generaal;
        - de voorzitter: de voorzitter van de Tweede Kamer der Staten-Generaal;
        - de eerste, tweede en overige ondervoorzitters: de eerste, tweede respectievelijk overige ondervoorzitters van de
      Tweede Kamer der Staten-Generaal;
        - fractievoorzitter: kamerlid waarvan door de voorzitter is vastgesteld dat dat lid voorzitter is van een fractie,
      dan wel enig lid is van een fractie.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
  - number: '1.2'
    text: Deze wet is niet van toepassing op kamerleden die het ambt van minister of staatssecretaris bekleden.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel1
  - number: '1.3'
    text: |-
      De [artikelen 2 tot en met 6][ref1] van deze wet zijn van overeenkomstige toepassing op het kamerlid aan wie
      ingevolge [artikel X 10 van de Kieswet][ref2] tijdelijk ontslag is verleend wegens zwangerschap en bevalling of
      ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '2.1'
    text: |-
      De kamerleden genieten een schadeloosstelling van € 7311,56 per maand, vermeerderd met een percentage dat gelijk is
      aan het percentage van de vakantie-uitkering voor het burgerlijk rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel2
  - number: '2.2'
    text: |-
      Indien de bezoldiging van het burgerlijk rijkspersoneel wordt gewijzigd en wordt bepaald dat die wijziging een
      algemeen karakter draagt, wordt bij ministeriële regeling met ingang van de datum, waarop die wijziging ingaat, de
      schadeloosstelling van kamerleden dienovereenkomstig gewijzigd, onder nadere vaststelling, voor zoveel nodig, van
      het in het eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel2
  - number: 2a.1
    text: |-
      Indien aan het burgerlijk rijkspersoneel een eenmalige uitkering wordt toegekend en wordt bepaald dat deze
      uitkering een algemeen karakter draagt, ontvangen de kamerleden een uitkering op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel2a
  - number: 2a.2
    text: |-
      Indien de hoogte van de uitkering, bedoeld in het eerste lid, afhankelijk is van de hoogte van de
      schadeloosstelling, wordt bij de vaststelling hiervan rekening gehouden met een eventuele vermindering van de
      schadeloosstelling als bedoeld in [artikel 3][ref1], met een eventuele toelage als bedoeld in [artikel 11][ref2],
      alsmede met een verhoging van de schadeloosstelling als bedoeld in [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel12
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004939
        artikel: '12'
        paragraaf: '4'
  - number: 2b
    text: |-
      De kamerleden ontvangen een eindejaarsuitkering overeenkomstig de bepalingen welke daaromtrent voor het burgerlijk
      rijkspersoneel zijn vastgesteld. Grondslag voor de eindejaarsuitkering is de schadeloosstelling, bedoeld in
      [artikel 2][ref1], verminderd met het in dat artikel bedoelde percentage en rekening houdend met een eventuele
      vermindering van de schadeloosstelling als bedoeld in [artikel 3][ref2], alsmede de toelagen, bedoeld in
      de[ artikelen 11][ref3] en [12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004939#Artikel12
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004939
        artikel: '11'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004939
        artikel: '12'
        paragraaf: '4'
  - number: '3.1'
    text: |-
      De schadeloosstelling wordt verminderd met de helft van het bedrag waarmee de neveninkomsten van het kamerlid per
      jaar een bedrag gelijk aan 14% van de schadeloosstelling te boven gaan, met dien verstande dat deze vermindering
      ten hoogste 35% van de schadeloosstelling bedraagt. Indien het kamerlid een gedeelte van het kalenderjaar lid van
      de Kamer is, gelden de bedragen naar evenredigheid.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
  - number: '3.2'
    text: |-
      Onder neveninkomsten wordt verstaan het gezamenlijke bedrag dat het kamerlid wegens het verrichten van
      nevenactiviteiten tijdens het lidmaatschap geniet als:
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
  - number: 3.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.2.b
    text: belastbaar loon uit tegenwoordige arbeid en
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
  - number: 3.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.3'
    text: |-
      De neveninkomsten worden bepaald overeenkomstig de regels van de [Wet inkomstenbelasting 2001][ref1] en worden
      verrekend in het jaar waarin deze zijn genoten in de zin van die [wet][ref2], met dien verstande dat geen
      verrekening meer plaats heeft, indien de neveninkomsten worden genoten na 31 december van het jaar waarin het
      lidmaatschap wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
  - number: 3a.1
    text: De schadeloosstelling eindigt met de dag waarop het kamerlidmaatschap wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3a
  - number: 3a.2
    text: |-
      Zo spoedig mogelijk na het overlijden van het kamerlid wordt aan de weduwe of weduwnaar, van wie het overleden
      kamerlid niet duurzaam gescheiden leefde, een bedrag uitgekeerd, gelijk aan driemaal het bedrag van de
      schadeloosstelling, dat over de laatste volle maand aan het kamerlid is uitgekeerd. Indien de overledene geen
      weduwe of weduwnaar als bedoeld in de vorige volzin, nalaat, geschiedt de uitkering ten behoeve van de minderjarige
      kinderen tot wie de overledene in familierechtelijke betrekking stond, of minderjarige kinderen waarover de
      overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering aan degenen die
      geheel of grotendeels afhankelijk waren van de schadeloosstelling van het kamerlid.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3a
  - number: 3a.3
    text: |-
      Voor de toepassing van dit artikel wordt onder weduwe of weduwnaar mede verstaan de achtergebleven geregistreerde
      partner en de nabestaande levenspartner met wie het overleden niet-gehuwde kamerlid samenwoonde en - met het
      oogmerk duurzaam samen te leven - een gemeenschappelijke huishouding heeft gevoerd op basis van een notarieel
      verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en
      gemeenschappelijke huishouding. Tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt. Onze
      Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een
      samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel3a
  - number: '4.1'
    text: |-
      Telkenjare voor 1 april of binnen twee maanden na zijn beëdiging verstrekt het kamerlid aan de voorzitter van het
      managementteam van de Belastingdienst/Haaglanden een opgave van de neveninkomsten welke het kamerlid verwacht over
      het desbetreffende kalenderjaar of gedeelte daarvan te zullen genieten, dan wel een verklaring, dat hij verwacht
      niet meer dan 14% van de schadeloosstelling op jaarbasis aan neveninkomsten over dat jaar of een evenredig deel
      daarvan over het desbetreffende gedeelte van dat jaar te zullen genieten.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.2'
    text: |-
      De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt aan Onze Minister het bedrag van de
      voorlopige aftrek op de schadeloosstelling mede en verstrekt een afschrift daarvan aan het kamerlid.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.3'
    text: |-
      Het kamerlid kan een verklaring inzenden dat een opgave van neveninkomsten achterwege zal blijven. In dit geval,
      alsmede indien binnen de in het eerste lid bedoelde termijn geen opgave of verklaring is ingezonden, bedraagt de
      schadeloosstelling 65% van de schadeloosstelling op jaarbasis per jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.4'
    text: |-
      Zo spoedig mogelijk na afloop van het kalenderjaar, zendt het kamerlid of zenden zijn nabestaanden aan de
      voorzitter van het managementteam van de Belastingdienst/Haaglanden een opgave van de neveninkomsten welke over dat
      kalenderjaar zijn genoten, dan wel een verklaring dat over dat jaar niet meer dan 14% van de schadeloosstelling op
      jaarbasis of, indien het kamerlid een gedeelte van het kalenderjaar lid van de Kamer is geweest, een evenredig deel
      van dit bedrag, is genoten.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.5'
    text: |-
      De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt zo spoedig mogelijk na ontvangst van
      de in het vierde lid bedoelde opgave of verklaring aan Onze Minister het bedrag van de definitieve aftrek op de
      schadeloosstelling mede en verstrekt een afschrift daarvan aan het kamerlid.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.6'
    text: |-
      Indien een opgave of verklaring als in het vierde lid bedoeld, niet binnen zes maanden na afloop van het
      kalenderjaar is ontvangen, geeft de voorzitter van het managementteam van de Belastingdienst/Haaglanden daarvan
      kennis aan Onze Minister. In dit geval bedraagt de schadeloosstelling 65% van de schadeloosstelling op jaarbasis
      per jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.7'
    text: |-
      Het bedrag van de uitbetaalde schadeloosstelling kan, al dan niet op verzoek van het kamerlid, worden herzien,
      indien op grond van de onherroepelijk geworden aanslag in de inkomstenbelasting daartoe aanleiding blijkt te
      bestaan.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '4.8'
    text: Bij de toepassing van het zevende lid vindt zo nodig terugbetaling of verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel4
  - number: '5.1'
    text: |-
      De kamerleden maken hun nevenfuncties en de inkomsten uit hun nevenfuncties openbaar. Zij leggen uiterlijk op
      1 april na het kalenderjaar waarin de nevenfuncties zijn vervuld en de inkomsten zijn genoten een opgave ter inzage
      bij de griffie van de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel5
  - number: '5.2'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '5.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de in Nederland gekozen vertegenwoordigers in de
      Vergadering bestaande uit de vertegenwoordigers van de volkeren van de in de Europese Gemeenschappen verenigde
      staten.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel5
  - number: 6a.1
    text: |-
      Het kamerlid dat ingevolge [artikel X 12 van de Kieswet][ref1] is benoemd in de plaats die is opengevallen als
      gevolg van het tijdelijk ontslag van een lid wegens zwangerschap en bevalling of ziekte, ontvangt een bedrag van
      € 590 per maand waarmee voorzieningen kunnen worden getroffen ter zake van arbeidsongeschiktheid, ouderdom en
      overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_12
  - number: 6a.2
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt bij ministeriële regeling gewijzigd overeenkomstig de procentuele
      wijzigingen die de schadeloosstelling, bedoeld in [artikel 2][ref1], ondergaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      De kamerleden ontvangen naar keuze een Openbaar Vervoer-jaarkaart, geldig voor reizen in de eerste klas van de
      N.V. Nederlandse Spoorwegen, of een compensatie voor de reiskosten in het woon-werkverkeer overeenkomend met de
      tegemoetkoming voor het rijkspersoneel van kosten van woon-werkverkeer, niet zijnde kosten van openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel7
  - number: '7.2'
    text: |-
      Voorts ontvangen de kamerleden ter vergoeding van de reiskosten buiten het woon-werkverkeer een bedrag gelijk aan
      de vergoeding die geldt voor burgerlijk rijkspersoneel voor het gebruik van een eigen motorvoertuig indien openbaar
      vervoer niet mogelijk of niet doelmatig is, op basis van 17.500 kilometer per jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel7
  - number: '7.3'
    text: |-
      Ten aanzien van een kamerlid van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing van die wet als
      dienstbetrekking wordt aangemerkt, wordt het bedrag, berekend met toepassing van het tweede lid, vermenigvuldigd
      met 100/P, waarbij P wordt berekend door het getal 100 te verminderen met het getal van het hoogste tarief, bedoeld
      in [kolom IV van artikel 2.10 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '7.4'
    text: |-
      De voorzitter draagt zorg voor verstrekking van een Openbaar Vervoer-jaarkaart aan de kamerleden die hun keuze op
      grond van het eerste lid daartoe aan hem kenbaar hebben gemaakt. De voorzitter deelt voorts aan Onze Minister mede
      welke kamerleden op grond van het eerste lid recht hebben op de in dat lid bedoelde compensatie voor de reiskosten.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel7
  - number: '8.1'
    text: |-
      De kamerleden ontvangen ter vergoeding voor verblijfkosten een bedrag waarvan de hoogte afhankelijk is van de
      afstand van de woonplaats van het kamerlid of het door het kamerlid bewoonde deel van de woonplaats tot het gebouw
      van de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: '8.2'
    text: 'De hoogte van het in het eerste lid bedoelde bedrag wordt berekend als volgt:'
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: 8.2.0
    text: km.100 * bedrag A + 10 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: 8.2.10
    text: km.100 * bedrag A + 40 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: 8.2.75
    text: km.55 * bedrag A + 85 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: 8.2.150
    text: km. en meer:140 * bedrag B
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
  - number: '8.3'
    text: |-
      Het kamerlid aan wie ingevolge [artikel X 10 van de Kieswet][ref1] tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte heeft aanspraak op een vergoeding van € 500,– per maand indien de afstand
      van de woonplaats van het kamerlid of het door het kamerlid bewoonde deel van de woonplaats tot het gebouw van de
      Tweede Kamer der Staten-Generaal groter is dan 75 km en hij voor de uitoefening van het kamerlidmaatschap beschikt
      over huisvesting voor verblijf in of nabij ’s-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '8.4'
    text: |-
      Ten aanzien van een kamerlid van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing van die wet als
      dienstbetrekking wordt aangemerkt, wordt het bedrag, berekend met toepassing van het tweede lid, vermenigvuldigd
      met 100/P, waarbij P wordt berekend door het getal 100 te verminderen met het getal van het hoogste tarief, bedoeld
      in kolom IV van [artikel 2.10 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '9.1'
    text: |-
      De kamerleden ontvangen een vergoeding voor aan de uitoefening van het kamerlidmaatschap verbonden kosten die €
      2443,30 per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel9
  - number: '9.2'
    text: |-
      Ten aanzien van een kamerlid van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing van die wet als
      dienstbetrekking wordt aangemerkt, wordt het bedrag, genoemd in het eerste lid, vermenigvuldigd met 100/P, waarbij
      P wordt berekend door het getal 100 te verminderen met het getal van het hoogste tarief, bedoeld in kolom IV van
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '9.3'
    text: |-
      Het kamerlid aan wie ingevolge [artikel X 10 van de Kieswet][ref1] tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte ontvangt een onkostenvergoeding ter hoogte van de helft van het in het eerste
      lid genoemde bedrag. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '9.4'
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel9
  - number: '11.1'
    text: |-
      Naast de schadeloosstelling ontvangt de voorzitter een toelage gelijk aan 34% van de schadeloosstelling op
      jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel11
  - number: '11.2'
    text: |-
      De eerste en tweede ondervoorzitter ontvangen een toelage gelijk aan 3,5% respectievelijk 2,5% van de
      schadeloosstelling op jaarbasis, en de overige ondervoorzitters ontvangen een toelage gelijk aan 1% van de
      schadeloosstelling op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel11
  - number: '11.3'
    text: |-
      De eerste ondervoorzitter die gedurende meer dan 30 dagen onafgebroken de functie van de voorzitter waarneemt,
      ontvangt voor die tijd in plaats van de toelage, bedoeld in het tweede lid, een toelage ten bedrage van de helft
      van die van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel11
  - number: '12.1'
    text: |-
      Naast de schadeloosstelling ontvangen de fractievoorzitters voor de duur van hun voorzitterschap per jaar
      een toelage gelijk aan 1% van de schadeloosstelling op jaarbasis en een toelage gelijk aan 0,3% van de
      schadeloosstelling op jaarbasis voor elk lid dat de fractie buiten de fractievoorzitter telt. De toelagen tezamen
      bedragen ten hoogste 11,5% van de schadeloosstelling op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel12
  - number: '12.2'
    text: 'Voor de toepassing van het eerste lid stelt de voorzitter vast:'
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel12
  - number: 12.2.a
    text: hoeveel leden een fractie telt;
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel12
  - number: 12.2.b
    text: de duur van het fractievoorzitterschap.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel12
  - number: '18.1'
    text: |-
      De Wet van 30 oktober 1968, houdende regeling schadeloosstelling leden Tweede Kamer der Staten-Generaal (*Stb.*
      1990, 477) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel18
  - number: '18.2'
    text: |-
      De algemene maatregel van bestuur van 21 september 1990 (*Stb.* 1990, 506) tot nadere vaststelling van de
      vergoeding voor de leden van de Tweede Kamer der Staten-Generaal voor de overige kosten, welke uit de vervulling
      van hun betrekking voortvloeien, blijft voor wat betreft de vergoeding voor de overige kosten, bedoeld in artikel
      11 van de in het eerste lid bedoelde wet, voor de maanden november en december 1989 van kracht.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel18
  - number: '19'
    text: |-
      De Wet van 28 december 1989, houdende voorzieningen ten behoeve van de leden van de Tweede Kamer der Staten-
      Generaal en belanghebbenden in de zin van de [Algemene pensioenwet politieke ambtsdragers][ref1] in verband met de
      voorstellen van de commissie tot vereenvoudiging van de loonbelasting en de inkomstenbelasting (*Stb.* 1989, 591)
      wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: 19a
    text: |-
      Onder neveninkomsten als bedoeld in [artikel 3, tweede lid][ref1], wordt met betrekking tot aan het kalenderjaar
      2001 voorafgaande kalenderjaren verstaan winst uit onderneming en zuivere inkomsten uit tegenwoordige arbeid. Met
      betrekking tot die jaren wordt in [artikel 3, derde lid, onder Wet inkomstenbelasting 2001](onbekend) verstaan Wet
      op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Onze Minister maakt de voor het jaar 1990 geldende bedragen, bedoeld in de[ artikelen 2][ref1], [7][ref2],
      [8][ref3] en [9][ref4], bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004939#Artikel9
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel20
