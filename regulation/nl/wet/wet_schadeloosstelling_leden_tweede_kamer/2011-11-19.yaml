  - number: '21'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met 1 januari 1990.
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel21
  - number: '22'
    text: 'Deze wet kan worden aangehaald als: Wet schadeloosstelling leden Tweede Kamer.'
    url: https://wetten.overheid.nl/BWBR0004939/2011-11-19#Artikel22
