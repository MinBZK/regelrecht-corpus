        artikel: '9'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Bij de vaststelling van de bedragen bedoeld in de[ artikelen 5][ref1], [11][ref2] en [12][ref3] wordt de eenmalige
      uitkering van f 250 die per 1 april 1990 aan het rijksoverheidspersoneel is toegekend, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel12
