    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel10
  - number: '11.1'
    text: |-
      De directie Informatisering (DI) is belast met de advisering van de departementsleiding over, de coördinatie van
      departementale vraagstukken en projectleiding van sectoroverstijgende projecten op het gebied van informatie- en
      communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel11
  - number: '11.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel11
  - number: 11.2.a
    text: de sectie ICT-advies;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel11
  - number: 11.2.b
    text: de sectie Programmamanagement;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel11
  - number: 11.2.c
    text: het projectenbureau.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel11
  - number: '12.1'
    text: 'De Departementale Auditdienst (DAD) is belast met:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: 12.1.a
    text: |-
      het uitvoeren van de wettelijke controletaak, bedoeld in [artikel 66 van de Comptabiliteitswet 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
  - number: 12.1.b
    text: |-
      het verrichten van overig periodiek onderzoek naar de bedrijfs- en de beleidsvoering op basis van de
      [artikelen 20][ref1] en [21 van de Comptabiliteitswet 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '21'
  - number: '12.2'
    text: De DAD bestaat uit
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: 12.2.a
    text: het cluster I DGWIAV en SG/pSG-blok;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: 12.2.b
    text: het cluster II DGPJS;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: 12.2.c
    text: het cluster III DGRR en NCTb;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: 12.2.d
    text: het Bureau Bedrijfsvoering en Beheersondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel12
  - number: '13.1'
    text: |-
      De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB) is voor de departementsleiding en directies
      in de sector bestuursdepartement dé dienstverlener op het gebied van huisvesting, werkplekservices, documentaire
      informatievoorziening, en inkoopondersteuning binnen het bestuursdepartement.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: '13.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: 13.2.a
    text: de hoofdafdeling Facilitaire Zaken;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: 13.2.b
    text: de hoofdafdeling Documentaire Informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: 13.2.c
    text: de hoofdafdeling Commerciële Zaken;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: 13.2.d
    text: de afdeling Bedrijfsvoering, Kwaliteit en Productcommunicatie (BKP).
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel13
  - number: '14.1'
    text: |-
      Het Gemeenschappelijk Dienstencentrum ICT (GDI) is belast met het leveren van generieke ICT-beheerdiensten
      (financiële systemen, websites en infrastructurele ICT-diensten), specifieke ICT-beheerdiensten (beheer van
      netwerk, werkplekken en applicaties) aan het Ministerie van Justitie en andere ministeries.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: '14.2'
    text: 'Het GDI bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: 14.2.a
    text: de afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: 14.2.b
    text: de afdeling Business Development;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: 14.2.c
    text: de afdeling Front Office;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: 14.2.d
    text: de afdeling Beheer.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel14
  - number: '15'
    text: |-
      De directie Inkoop, Huisvesting en Milieu (DIHM) is belast met het realiseren van beleid, kaders en richtlijnen op
      het bedrijfsvoeringterrein van inkoop, huisvesting en milieu.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel15
  - number: '16.1'
    text: |-
      De Inspectie voor de Sanctietoepassing (ISt) ziet toe op de sanctietoepassing met het oog op zichtbare verbetering
      van de effectiviteit en kwaliteit van de sanctietoepassing.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel16
  - number: '16.2'
    text: |-
      De Inspectie voor de Sanctietoepassing adviseert de departementsleiding ten behoeve van borging van behoorlijke
      sanctietoepassing
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel16
  - number: 16a
    text: |-
      De Justitie Beleidsacademie is belast met de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van
      alle beleidsambtenaren van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel16a
  - number: 16b
    text: |-
      Het bureau Adviescollege Verloftoetsing tbs is belast met het ondersteunen van het Adviescollege Verloftoetsing tbs
      alsmede het ontwikkelen van richtlijnen en andere vormen van methodische aanpak ten behoeve van dat Adviescollege.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel16b
  - number: '17.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Wetgeving, Internationale Aangelegenheden en
      Vreemdelingenzaken integraal verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-
      generaal Wetgeving, Internationale Aangelegenheden en Vreemdelingenzaken ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
  - number: '17.2'
    text: |-
      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel17
  - number: '18.1'
    text: |-
      De directie Wetgeving (DW) is belast met de ontwikkeling, de totstandkoming, het beheer en het onderhoud van
      Justitiewetgeving en van andere wetgeving voor zover deze tot het werkterrein van een dienstonderdeel van het
      ministerie behoort, alsmede met het ontwikkelen en uitdragen van het wetgevingskwaliteitsbeleid en de toetsing
      van ontwerpwetgeving van de ministeries op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip van de
      constitutionele, Europeesrechtelijke en internationaalrechtelijke toetsing van wetgeving.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: '18.2'
    text: 'De directie voert juridische adviestaken uit betreffende:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.2.a
    text: de coördinatie van contacten met de landsadvocaat;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.2.b
    text: het geven van juridisch advies in gecompliceerde aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.2.c
    text: het uitvoeren van bijzondere opdrachten van de departementsleiding.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: '18.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.a
    text: de sector Straf- en sanctierecht;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.b
    text: de sector Staats- en bestuursrecht;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.c
    text: de sector Privaatrecht;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.d
    text: de sector Wetgevingskwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.e
    text: de Juridisch Adviseur;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: 18.3.f
    text: het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: '18.4'
    text: |-
      Onder de sector Privaatrecht ressorteert het Bureau Religie en Levensbeschouwing in het Publiek Domein (BRLPD),
      dat is belast met algemene aangelegenheden op het terrein van religie en levensbeschouwing, waaronder het namens
      de centrale overheid onderhouden van betrekkingen met kerkgenootschappen en genootschappen op levensbeschouwelijke
      grondslag.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel18
  - number: '19.1'
    text: |-
      De directie Europese en Internationale Aangelegenheden (DEIA) draagt zorg voor een Justitiebrede strategie- en
      visieontwikkeling ten aanzien van multilaterale, Europese en bilaterale horizontale dossiers en beleidsvraagstukken
      en ten aanzien van Koninkrijkssamenwerking, internationale projecten en expertisegebieden. Tevens is de directie
      belast met de zorg voor een gecoördineerde en effectieve Justitie-inzet van Nederland binnen het kader van
      de samenwerking binnen de Europese Unie en in het kader van de samenwerking op multilateraal, bilateraal en
      Koninkrijksniveau. Tenslotte faciliteert de directie de politieke en ambtelijke leiding alsmede de directies
      in logistieke en instrumentele zin op voornoemde terreinen en verzorgt zij de daarop betrekking hebbende
      informatievoorziening aan interne dossierhouders en belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: '19.2'
    text: |-
      De directie bevordert en bewaakt de eenheid van optreden op de in het eerste lid genoemde terreinen met
      inachtneming van de eigen beleidsverantwoordelijkheid van andere dienstonderdelen voor de internationale aspecten
      van hun beleidsterrein
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: '19.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: 19.3.a
    text: de afdeling Europese Unie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: 19.3.b
    text: de afdeling Internationale Betrekkingen en Projecten;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: 19.3.c
    text: de Justitieafdeling Permanente Vertegenwoordiging Europese Unie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: 19.3.d
    text: de Justitieattaché’s op andere Nederlandse ambassades en permanente vertegenwoordigingen in het buitenland;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: 19.3.e
    text: de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel19
  - number: '20.1'
    text: |-
      De directie Migratiebeleid (DMb) is belast met de zorg voor een gereglementeerde en beheerste toelating tot
      verblijf in en vertrek uit Nederland of terugkeer van vreemdelingen op een in nationaal en internationaal opzicht
      maatschappelijk verantwoorde wijze.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: '20.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: 20.2.a
    text: de afdeling Toezicht, Regulier en Nationaliteit;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: 20.2.b
    text: de afdeling Besturing, Informatie en Control;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: 20.2.c
    text: de afdeling Asiel, Opvang en Terugkeer;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: 20.2.d
    text: de stafafdeling Juridische en Algemene Zaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel20
  - number: '21.1'
    text: |-
      Het secretariaat van de Commissie Integraal Toezicht Terugkeer (secretariaat CITT) is belast met de ambtelijke
      ondersteuning van de Commissie Integraal Toezicht Terugkeer.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel21
  - number: '21.2'
    text: 'Hiertoe verricht het secretariaat de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel21
  - number: 21.2.a
    text: |-
      het verzamelen en bewerken van informatie van toezichthouders en organisaties die betrokken zijn bij het
      terugkeerproces;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel21
  - number: 21.2.b
    text: het organiseren en begeleiden van werkbezoeken;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel21
  - number: 21.2.c
    text: het opstellen van conceptadviezen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel21
  - number: '22.1'
    text: |-
      De dienst Terugkeer & Vertrek (DT&V) is als taakorganisatie belast met de uitvoering van de vreemdelingenwetgeving
      terzake van vertrek en uitzetting. De dienst bevordert, organiseert en realiseert het daadwerkelijk vertrek uit
      Nederland van vreemdelingen zonder verblijfsrecht. Bij het uitvoeren van deze taak staat het stimuleren van het
      zelfstandig vertrek voorop. Desnoods realiseert de dienst het gedwongen vertrek van de vreemdeling uit Nederland.
      De dienst voert zijn taak uit in samenwerking met andere ketenpartners van de overheid die een taak hebben in het
      vertrekproces. Taken die wettelijk zijn voorbehouden aan ambtenaren belast met het toezicht of de grensbewaking,
      worden niet verricht door de dienst. Het projectbureau van het project Terugkeer is bij de dienst ondergebracht.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: '22.2'
    text: 'De dienst bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: 22.2.a
    text: de directie Staf;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: 22.2.b
    text: de directie Voorbereiden Vertrek;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: 22.2.c
    text: de directie Bewaring;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: 22.2.d
    text: de directie Operationele Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel22
  - number: '23.1'
    text: |-
      Het secretariaat van de Adviescommissie voor vreemdelingenzaken (secretariaat ACVZ) is belast met de ambtelijke
      ondersteuning van die commissie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel23
  - number: '23.2'
    text: 'Het secretariaat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel23
  - number: 23.2.a
    text: het procescluster Advisering;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel23
  - number: 23.2.b
    text: het procescluster Informatie en Documentatie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel23
  - number: 23.2.c
    text: het procescluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel23
  - number: '24'
    text: |-
      De Immigratie- en Naturalisatiedienst (IND) is belast met de uitvoering van de vreemdelingenwetgeving en van de
      [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '25.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Rechtspleging en Rechtshandhaving integraal
      verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Rechtspleging en
      Rechtshandhaving ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
  - number: '25.2'
    text: De directeur-generaal is daarnaast beheersverantwoordelijk voor het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel25
  - number: '25.3'
    text: |-
      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel25
  - number: '26.1'
    text: |-
      De directie Rechtshandhaving en Criminaliteitsbestrijding (DRC) is belast met het ontwikkelen van visie, beleid
      en samenwerkingsvormen op het terrein van de rechtshandhaving, de criminaliteitsbestrijding en het waarborgen van
      de veiligheid.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: '26.2'
    text: 'de directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: 26.2.a
    text: de afdeling Strategische Beleidsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: 26.2.b
    text: de afdeling Georganiseerde Criminaliteit;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: 26.2.c
    text: de afdeling Fraude en Ordening;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: 26.2.d
    text: de afdeling Criminaliteit en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel26
  - number: '27.1'
    text: |-
      De directie Rechtsbestel (DRb) is belast met de instandhouding en ontwikkeling van het rechtsbestel, in het
      bijzonder met betrekking tot de toegang tot het recht, de organisatie en de kwaliteit van het rechtsbestel.
      Hieronder wordt in ieder geval begrepen het stelsel van de rechterlijke organisatie, alsmede de volgende
      beleidsterreinen: rechtsbijstand, juridische vrije beroepen, alternatieve geschillenbeslechting (ADR),
      schuldsanering natuurlijke personen en tolken en vertalers.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: '27.2'
    text: |-
      De directie is voorts belast met het beheer van de Hoge Raad, de Nederlandse Vereniging voor Rechtspraak en het
      bureau van het Nederlands Register Gerechtelijk Deskundigen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: '27.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: 27.3.a
    text: de afdeling Strafrechtelijk Bestel & Arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: 27.3.b
    text: de afdeling Rechtspraak & Geschiloplossing;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: 27.3.c
    text: de afdeling Toegang Rechtsbestel.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel27
  - number: '28.1'
    text: |-
      De directie Instrumentatie Rechtspleging en Rechtshandhaving (DIRR) is belast met de instrumentatie van de overige
      directies binnen het directoraat-generaal Rechtspleging en Rechtshandhaving en de taakorganisaties op dit terrein.
      Onder deze instrumentatie wordt begrepen:
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.1.a
    text: |-
      de ontwikkeling van het informatievoorzieningbeleid voor de verschillende ketens op het terrein van de
      rechtspleging en rechtshandhaving, in het bijzonder de strafrechtsketen,
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.1.b
    text: het stellen van financiële kaders, en
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.1.c
    text: instrumentontwikkeling.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: '28.2'
    text: |-
      Tevens fungeert de directie als centrale voorziening ten behoeve van de registratie van justitiële en
      strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: '28.3'
    text: |-
      De directie is voorts belast met het beheer van het College bescherming persoonsgegevens en de Commissie gelijke
      behandeling.)
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: '28.4'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.a
    text: de afdeling Begrotingscoördinatie en Interne Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.b
    text: de afdeling Financiële Advisering en Control;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.c
    text: de afdeling Keteninformatievoorziening;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.d
    text: het Expertisecentrum Rechtspleging en Rechtshandhaving;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.e
    text: de Justitiële Informatiedienst (JustID);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.f
    text: het Financial Intelligence Unit netwerk (FIU.NET);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.g
    text: het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: 28.4.h
    text: het Platform Interceptie & Decriptie & Signaalanalyse (PIDS);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel28
  - number: '29.1'
    text: |-
      De directie Juridische en Operationele Aangelegenheden (DJOA) is belast met de voorbereiding van beslissingen
      in individuele gevallen op het terrein van rechtspleging en rechtshandhaving met toepassing van bestaande
      regels en beleidskaders. De beslissingen hebben betrekking op bestuurlijk-juridische zaken, operationele zaken,
      rechtshulpverzoeken of incidenten. De directie levert op deze terreinen ook bijdragen aan beleidsvoorstellen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '29.2'
    text: |-
      De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties bij
      de afdoening van incidenten waaraan politiek-bestuurlijke aspecten zijn verbonden. De directie ontwikkelt en
      onderhoudt daartoe de benodigde expertise, een incidentenstrategie en organiseert de voorbereiding van Justitie aan
      crisisbeheersing in het kader van het nationaal handboek crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '29.3'
    text: |-
      De directie fungeert als het juridisch expertisecentrum van het directoraat-generaal. De directie bewaakt de
      juridische kwaliteit van de diverse producten van het directoraat-generaal en beperkt de juridische risico’s.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '29.4'
    text: |-
      De directie is belast met de voorbereiding en uitvoering van beslissingen van de minister aangaande internationale
      rechtshulp in strafzaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '29.5'
    text: |-
      De directie is voorts belast met de beantwoording van brieven van burgers alsmede de coördinatie van de
      beantwoording van Kamervragen en andere parlementaire zaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '29.6'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: 29.6.a
    text: de afdeling Bestuurlijke en Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: 29.6.b
    text: de afdeling Operationele Zaken en Incidentenmanagement;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: 29.6.c
    text: de afdeling Internationale Rechtshulp in strafzaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel29
  - number: '30.1'
    text: |-
      Het Nederlands Forensisch Instituut (NFI) staat, met het oog op de waarheidsvinding op het terrein van de
      forensische wetenschap ten dienste van het openbaar ministerie, de politie, overige personen en instanties die
      zijn belast met de opsporing van strafbare feiten, de zittende magistratuur en het Ministerie van Justitie. Indien
      de bijzondere deskundigheid van het NFI of gronden aan het algemeen belang daartoe aanleiding geven, kan worden
      besloten dat het NFI ook diensten verricht in het kader van de ondersteuning bij de daadwerkelijke handhaving van
      de (inter)nationale rechtsorde of de hulpverleningstaak van de politie dan wel ten behoeve van enig andere zaak.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel30
  - number: '30.2'
    text: 'De kerntaken van het NFI zijn:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel30
  - number: 30.2.a
    text: |-
      het verrichten van forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en natuurwetenschappelijk
      gebied en het ter zake uitbrengen van een verslag;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel30
  - number: 30.2.b
    text: |-
      het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken zowel ten behoeve van het NFI als
      politie en justitie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel30
  - number: 30.2.c
    text: het zijn van (inter)nationaal kennis- en expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel30
  - number: '31'
    text: |-
      Het Centraal Justitieel Incassobureau (CJIB) heeft tot taak het openbaar Ministerie en de Minister te ondersteunen
      bij hun werkzaamheden ten behoeve van de tenuitvoerlegging van strafrechtelijke en administratieve sancties alsmede
      met betrekking tot het beheer en de verwerking van gegevens dienaangaande. Het CJIB heeft tevens tot taak door de
      Minister aangewezen andere werkzaamheden te verrichten ter ondersteuning van het Rijk bij de uitvoering zijn taken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel31
  - number: '32'
    text: |-
      De projectdirectie Veiligheid begint bij Voorkomen (PDVbbV) is belast met de coördinatie van de uitvoering van het
      project ‘Veiligheid begint bij Voorkomen’ in het kader van pijler 5 van het Coalitieakkoord van 7 februari 2007
      (Kamerstukken II 2006/07, 30 891, nr. 4, blz. 8) en het beleidsprogramma ‘Samen werken, samen leven’ (Kamerstukken
      II 2006/2007, 31 070, nr. 1).
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel32
  - number: '33.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de directeur-generaal Preventie, Jeugd en Sancties integraal verantwoordelijk
      voor de tot de verantwoordelijkheid van de minister behorende beleids- en bedrijfsvoering van de binnen het
      directoraat-generaal Preventie, Jeugd en Sancties ondergebrachte dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
  - number: '33.2'
    text: |-
      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel33
  - number: '33.3'
    text: 'Bij de directeur-generaal zijn de volgende programma’s ondergebracht:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel33
  - number: 33.3.a
    text: het programma Vernieuwing Forensische Zorg;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel33
  - number: 33.3.b
    text: het programma Modernisering Gevangeniswezen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel33
  - number: '34.1'
    text: |-
      De directie Sanctie- en Preventiebeleid (DSP) is belast met de advisering aan de departementsleiding over en
      de coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het bevorderen van de veiligheid van de
      maatschappij door:
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.1.a
    text: |-
      de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.1.b
    text: de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.1.c
    text: het aanbieden van dienstverlening aan slachtoffers van criminaliteit;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.1.d
    text: |-
      het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en rechtvaardige
      samenleving.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '34.2'
    text: |-
      Tevens is de directie belast met de advisering aan de departementsleiding over en de ontwikkeling, coördinatie en
      evaluatie van beleid dat gericht is op het reguleren en beheersen van kansspelen met bijzondere aandacht voor het
      beschermen van de consument, het tegengaan van gokverslaving en het tegengaan van illegaliteit en criminaliteit.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '34.3'
    text: |-
      De directie heeft op haar terrein een coördinerende taak in de besturing en beleidsvoering van de baten-
      lastendienst Dienst JUSTIS en de dienst Justitiële Inrichtingen, voorzover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '34.4'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties en
      instellingen en stuurt deze aan.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '34.5'
    text: 'De directie wordt ondersteund door een staf en bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.a
    text: de afdeling Sanctie- en Reclasseringsbeleid;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.b
    text: de afdeling Preventie- en Slachtofferbeleid;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.c
    text: het programma Sluitende aanpak nazorg;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.d
    text: het programma Justitiële Voorwaarden;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.e
    text: het programma Aanpak geweld in het (semi-)publieke domein;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.f
    text: het tijdelijke programma Kansspelen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.g
    text: het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.h
    text: het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming (secretariaat RSJ);
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: 34.5.i
    text: het bureau van het College van toezicht op de kansspelen (bureau CvtK).
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '34.6'
    text: |-
      De in het vijfde lid onder g, h en i, genoemde dienstonderdelen zijn belast met de bedrijfsvoering en ondersteuning
      van de in die onderdelen genoemde zelfstandige bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel34
  - number: '35.1'
    text: |-
      De directie Justitieel Jeugdbeleid (DJJ) is belast met de advisering aan de departementsleiding en aan de Minister
      voor Jeugd en Gezin over en de coördinatie, ontwikkeling en evaluatie van beleid dat zich richt op:
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.1.a
    text: de bescherming van minderjarigen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.1.b
    text: het voorkomen en aanpakken van bedreigende situaties voor kinderen en gezinnen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.1.c
    text: het met justitiële instrumenten voorkomen en aanpakken van jeugdcriminaliteit;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.1.d
    text: |-
      de bevordering van een samenhangende strafrechtelijke en pedagogische aanpak van de jeugdige nadat deze zich
      schuldig heeft gemaakt aan strafwaardig gedrag.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: '35.2'
    text: |-
      De directie heeft een adviserende taak in de besturing en beleidsvoering van de raad voor de kinderbescherming en
      de dienst Justitiële Inrichtingen, voorzover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: '35.3'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties en
      instellingen en stuurt deze aan. Daarnaast onderhoudt de directie de besturingsrelatie omtrent de doeluitkeringen
      aan de provincies en grootstedelijke regio’s ten aanzien van de jeugdbescherming en jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: '35.4'
    text: |-
      De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdragen beheersmatig en financieel aan
      te sturen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: '35.5'
    text: 'De directie wordt ondersteund door een staf en bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.5.a
    text: de afdeling Jeugdbescherming;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.5.b
    text: de afdeling Jeugdsancties en -preventie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35.5.c
    text: het programma Aanpak jeugdcriminaliteit.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35
  - number: 35a.1
    text: |-
      De directie Control, Bedrijfsvoering en Juridische Zaken (CBJ) is belast met een integrale controltaak en
      advisering daarover aan de directeur-generaal Preventie, Jeugd en Sancties en de directeuren Sanctie- en
      Preventiebeleid en Justitieel Jeugdbeleid. De controltaak omvat in ieder geval de financiële en beleidsmatige
      control ten aanzien van de taakorganisaties, rechtspersonen met een wettelijke taak, zelfstandige bestuursorganen
      en gesubsidieerde organisaties en instellingen op het terrein van DGPJS.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.2
    text: |-
      Daarnaast is de directie belast met het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings- en
      juridische vraagstukken, het ondersteunen bij en voeren van juridische procedures en de verzorging van de interne
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.3
    text: |-
      De uitvoering van de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit
      internationale kinderbescherming en de Centrale autoriteit internationale kinderontvoering is binnen de directie
      belegd bij de in het vierde lid, onder c, genoemde afdeling.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.4
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.4.a
    text: de afdeling Control;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.4.b
    text: de afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: 35a.4.c
    text: de afdeling Juridische en Internationale Zaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel35a
  - number: '36'
    text: |-
      De baten-lastendienst Dienst JUSTIS is belast met het namens de minister nemen van besluiten en verwerken van
      informatie ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare
      belangen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel36
  - number: '37'
    text: |-
      De dienst Justitiële Inrichtingen (DJI) is belast met het leveren van een bijdrage aan de veiligheid van de
      samenleving door tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen en door de aan de zorg
      van het Ministerie van Justitie toevertrouwde personen de kans te bieden een maatschappelijk aanvaardbaar bestaan
      op te bouwen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel37
  - number: '38'
    text: |-
      De raad voor de kinderbescherming (RvdK) is belast met het waarborgen van het fundamentele recht van het kind
      op een gezonde en evenwichtige ontwikkeling en uitgroei naar volwassenheid. De raad voert de volgende taken uit:
      beschermingszaken, scheiding en omgang, adoptie en strafzaken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel38
  - number: 38a
    text: |-
      Het bureau van de Erkenningscommissie Gedragsinterventies Justitie is belast met de bedrijfsvoering en de
      ondersteuning van de Erkenningscommissie Gedragsinterventies Justitie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel38a
  - number: '39.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de Nationaal Coördinator Terrorismebestrijding integraal verantwoordelijk voor de
      beleids- en bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
  - number: '39.2'
    text: |-
      De NCTb legt inhoudelijk direct verantwoording af aan de Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel39
  - number: '39.3'
    text: De NCTb wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de Staf NCTb.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel39
  - number: '40.1'
    text: |-
      Het bureau Algemene Zaken is belast met de ondersteuning van de NCTb in de dagelijkse aansturing van de Staf NCTb
      en de ondersteuning van de Staf NCTb in primaire processen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel40
  - number: '40.2'
    text: |-
      Het bureau coördineert en beheert de inzet van de voor terrorismebestrijding beschikbare middelen, bereidt
      beslissingen over de aanwending van die middelen voor, brengt hierover advies uit aan de Ministers van Justitie
      en van Binnenlandse Zaken en Koninkrijksrelaties en waarborgt de informatievoorziening over de inzet van deze
      middelen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel40
  - number: '40.3'
    text: Het bureau adviseert de NCTb over beleidsvoorstellen waaraan financiële of uitvoeringsconsequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel40
  - number: '40.4'
    text: Het bureau behandelt juridische vraagstukken, met name op het gebied van de toepassing van wetgeving.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel40
  - number: '41'
    text: |-
      De afdeling Communicatie en voorlichting is belast met de invulling van de communicatiefilosofie, -concepten en
      -strategie per fase van terrorismebestrijding alsmede met het maken van draaiboeken en protocollen op het terrein
      van communicatie per fase ten tijde van crisis.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel41
  - number: '42.1'
    text: |-
      De directie Beleid en Strategie (DBS) zorgt voor de ontwikkeling van een helder en eenduidig beleid op het vlak van
      terrorismebestrijding, daaronder begrepen strategische en internationale beleidsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel42
  - number: '42.2'
    text: |-
      De directie integreert bestaande beleidsactiviteiten van de diverse actoren, regisseert de beleidsmatige inbreng
      van andere betrokkenen binnen de Ministeries van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties en
      draagt zorg voor de noodzakelijke onderzoeksprogrammering.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel42
  - number: '43'
    text: 'De directie Regie (DR) is belast met:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel43
  - number: 43.a
    text: |-
      het regisseren van de samenwerking van de verschillende partijen op het specifieke terrein van
      terrorismebestrijding via structurele (procesgerichte) en incidentele (actiegerichte) regie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel43
  - number: 43.b
    text: het realiseren van een hogere samenwerkingsgraad tussen die partijen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel43
  - number: '44.1'
    text: |-
      De directie Kennis & Analyse (DKA) vormt het centrale punt in de integratie van inlichtingen en informatie tot
      concrete analyses en een helder actueel dreigingsbeeld inzake terrorisme.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel44
  - number: '44.2'
    text: |-
      De directie functioneert als het expertise- en informatiecentrum waarin alle andere partners op dit vlak
      participeren en hun informatie aanleveren. Verder vindt hier de waardering plaats van alle informatie uit
      bronnen op hoog en laag niveau binnen zeer diverse kringen, waarvoor het noodzakelijk is om informatiestromen te
      organiseren en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel44
  - number: '45.1'
    text: |-
      De directie Beveiliging Burgerluchtvaart (DBB) is belast met de beveiliging van de burgerluchtvaart tegen
      terrorisme.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: '45.2'
    text: 'De directie heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.a
    text: |-
      het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.b
    text: |-
      het opstellen van regels en het geven van aanwijzingen aan de Koninklijke Marechaussee en de luchtvaartsector op
      basis van de [Luchtvaartwet][ref1] en de [Politiewet 1993][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0006299
  - number: 45.2.c
    text: |-
      het aansturen van de Koninklijke Marechaussee, voorzover deze onder het gezag van de Minister van Justitie is
      belast met het toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.d
    text: het opstellen en actualiseren van het nationaal beveiligingsplan voor de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.e
    text: het uitvoeren van risicoanalyses op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.f
    text: het goedkeuren van beveiligingsplannen van zowel de luchthavens als de luchtvaartmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.g
    text: het onderzoeken van nieuwe beveiligingsconcepten, beveiligingsprocessen en beveiligingsapparatuur;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.h
    text: het certificeren van opleidingsorganisaties;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: 45.2.i
    text: het deelnemen aan internationale beveiligingsaudits op luchthavens.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel45
  - number: '46.1'
    text: 'De Inspectie Beveiliging Burgerluchtvaart (IBBLV) is belast met:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel46
  - number: 46.1.a
    text: het toezicht op de inrichting van de keten van de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel46
  - number: 46.1.b
    text: |-
      het toezicht op de kwaliteit van de beveiliging van de burgerluchtvaart, daaronder begrepen het toezicht op
      de taakuitoefening door de directie Beveiliging Burgerluchtvaart, en door de Commandant van de Koninklijke
      marechaussee, bedoeld in [artikel 37t van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37t
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37t
  - number: '46.2'
    text: |-
      De Inspectie adviseert de Nationaal Coördinator Terrorismebestrijding ten behoeve van borging van een aanvaardbaar
      niveau van beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel46
  - number: '47'
    text: |-
      De Eenheid Bewaking en Beveiliging (EBB) is belast met het onderhouden, uitvoeren en vernieuwen van een
      gezaghebbend, robuust en transparant nationaal stelsel van bewaken en beveiligen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel47
  - number: '48'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde dienstonderdelen liggen voor het daarbij werkzame personeel
      ter inzage:


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: 48.a
    text: een exemplaar van deze regeling;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel48
  - number: 48.b
    text: het organisatie- en formatierapport van het betreffende dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel48
  - number: '49.1'
    text: |-
      Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, wordt genomen door de
      secretaris generaal, gehoord de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel49
  - number: '49.2'
    text: |-
      De directeur Personeel en Organisatie adviseert de secretaris generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel49
  - number: '50.1'
    text: |-
      Elk van de in [artikel 2][ref1] genoemde dienstonderdelen ontwerpt en onderhoudt een organisatierapport en een
      formatierapport en, voorzover van toepassing, een taakbesluit en een baten-lastendienstregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: '50.2'
    text: |-
      Voorzover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder a en e][ref1], is de secretaris-generaal bevoegd het document namens de minister vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: '50.3'
    text: |-
      Voorzover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder b, c en d][ref1], is de directeur-generaal onder wie het dienstonderdeel ressorteert, bevoegd het
      document namens de minister vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: '50.4'
    text: |-
      De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
  - number: '50.5'
    text: |-
      Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
  - number: '50.6'
    text: |-
      Het eerste lid is op de in [artikel 2, onder b en c][ref1], genoemde dienstonderdelen eerst van toepassing met
      ingang van 1 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: '51.1'
    text: De directeur Personeel en Organisatie is belast met het beheer van deze regeling.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel51
  - number: '51.2'
    text: |-
      De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de Nationaal
      Coördinator Terrorismebestrijding zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de
      directeur Personeel en Organisatie van de gegevens die een goed beheer van deze regeling mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel51
  - number: '52'
    text: |-
      Na inwerkingtreding van deze regeling berust het Taak- en bevoegdheidsbesluit pSG Justitie op de
      [artikelen 3, tweede lid, tweede volzin][ref1], en [4, tweede lid][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022607#Artikel4
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022607
        artikel: '4'
        hoofdstuk: II
  - number: '53'
    text: |-
      De[ Organisatieregeling Ministerie van Justitie 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018331
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018331
  - number: '54.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: '54.2'
    text: |-
      De [artikelen 1][ref1] en [7][ref2] werken terug tot en met 22 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022607#Artikel7
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022607
        artikel: '7'
        hoofdstuk: II
  - number: '54.3'
    text: |-
      [Artikel 2, onderdeel b, met uitzondering van subonderdeel 4°, en onderdeel c][ref1],
      [hoofdstuk III, met uitzondering van artikel 22][ref2], en [hoofdstuk IV][ref3] werken terug tot en met 1 oktober
      2006, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022607#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0022607#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022607
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0022607
        hoofdstuk: IV
  - number: 54.3.a
    text: 'tot en met 21 februari 2007 wordt gelezen in plaats van:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: 54.3.a.1°
    text: |-
      ‘Wetgeving, Internationale Aangelegenheden en Vreemdelingenzaken’: Wetgeving, Internationale aangelegenheden,
      Integratie en Vreemdelingenzaken;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: 54.3.a.2°
    text: '‘WIAV’: WIIV;'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: 54.3.b
    text: |-
      als dienstonderdeel van het directoraat-generaal Wetgeving, Internationale aangelegenheden, Integratie en
      Vreemdelingenzaken tevens wordt aangemerkt:
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: 54.3.b.1°
    text: 'van 1 oktober 2006 tot en met 31 december 2006: de directie Coördinatie Integratiebeleid Minderheden (DCIM);'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: 54.3.b.2°
    text: 'van 1 januari 2007 tot en met 21 februari 2007: de directie Inburgering en Integratie (DI&I).'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
  - number: '54.4'
    text: |-
      De [artikelen 2, onderdeel b, subonderdeel 4°][ref1], en [22][ref2] werken terug tot en met 1 augustus 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022607#Artikel22
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022607
        artikel: '22'
        hoofdstuk: III
  - number: '55'
    text: 'Deze regeling wordt aangehaald als: Organisatieregeling Ministerie van Justitie 2007.'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel55
