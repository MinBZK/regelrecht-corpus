    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel9
  - number: 9.2.c
    text: de afdeling Financieel-Economische Advisering & Control;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel9
  - number: 9.2.d
    text: het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel9
