  - number: '3.1'
    text: |-
      De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel2
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '2'
        hoofdstuk: I
  - number: '3.2'
    text: |-
      De secretaris-generaal wordt bij afwezigheid volledig vervangen door de plaatsvervangend secretaris-generaal.
      Daarnaast treedt de plaatsvervangend secretaris-generaal ten aanzien van door de secretaris-generaal vast te
      stellen taken in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel3
  - number: '3.3'
    text: |-
      De directeuren-generaal zijn belast met de beleids- en bedrijfsvoering van de tot hun directoraat-generaal
      behorende onderdelen. Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de
      betreffende directeur-generaal namens de minister door de secretaris-generaal aangewezen als plaatsvervangend
      directeur-generaal. De eerste en tweede volzin zijn van overeenkomstige toepassing op de Nationaal Coördinator
      Terrorismebestrijding.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel3
  - number: '3.4'
    text: |-
      De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal en de directeuren-generaal vormen
      samen de bestuursraad. De bestuursraad formuleert de Justitiebrede en gemeenschappelijke kaders en bewaakt dat de
      activiteiten en het beleid van de onderscheiden directoraten-generaal daarbinnen blijven. De voorzitter van het
      College van procureurs-generaal neemt als toehoorder deel aan de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel3
  - number: '3.5'
    text: |-
      In afwijking van het derde lid, tweede volzin, worden voor het directoraat-generaal Wetgeving, Internationale
      Aangelegenheden en Vreemdelingenzaken twee plaatsvervangend directeuren-generaal aangewezen, voor de terreinen
      Wetgeving en Internationale Aangelegenheden onderscheidenlijk Vreemdelingenzaken. De plaatsvervangend directeur-
      generaal Wetgeving en Internationale Aangelegenheden treedt op als eerste plaatsvervanger in de ministersstaf, de
      bestuursraad en de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd [artikel 3][ref1] is de secretaris-generaal integraal verantwoordelijk voor de beleids- en
      bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022607#Artikel3
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022607
        artikel: '3'
        hoofdstuk: I
  - number: '4.2'
    text: |-
      Ten aanzien van door hem aan te wijzen dienstonderdelen kan de secretaris-generaal taken opdragen aan de
      plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel4
  - number: '5'
    text: |-
      De directie Algemene Justitiële Strategie (DAJS) is belast met het ondersteunen van de departementsleiding bij het
      ontwikkelen en vormgeven van justitiebrede strategie. Dit bewerkstelligt zij in het bijzonder door het uitvoeren
      van toekomst- en omgevingsgerichte verkenningen en het op basis daarvan signaleren van strategische thema’s alsmede
      het bevorderen van de doorwerking daarvan, dit in goed samenspel met partners binnen en buiten het ministerie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel5
  - number: '6.1'
    text: |-
      Het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC) is belast met het verrichten van onderzoek en
      het doen verrichten van onderzoek, het adviseren over voorgenomen beleidsprogramma’s en te voeren beleid en te
      verrichten onderzoek alsmede het verspreiden van binnen het WODC aanwezige kennis op het terrein van Justitie en
      met de documentatie van (sociaal-)wetenschappelijke publicaties;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: '6.2'
    text: 'Het WODC bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.a
    text: de onderzoeksafdeling Asiel & Migratie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.b
    text: de onderzoeksafdeling Criminaliteitspreventie, Slachtofferzorg, Jeugdbescherming en Sanctietoepassing;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.c
    text: de onderzoeksafdeling Regelgeving, Rechtspleging & Rechtsbijstand;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.d
    text: de onderzoeksafdeling Rechtshandhaving;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.e
    text: de afdeling Externe Wetenschappelijke Betrekkingen;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.f
    text: de afdeling Statistische lnformatievoorziening en Beleidsanalyse;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.g
    text: de afdeling Documentaire lnformatievoorziening;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: 6.2.h
    text: het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel6
  - number: '7'
    text: |-
      Het bureau Secretaris-Generaal (BSG) is belast met algemene staftaken en de secretariële, administratieve en
      organisatorische ondersteuning van de minister, de staatssecretaris, de secretaris-generaal en de plaatsvervangend
      secretaris-generaal. Het is voorts belast met de protocollaire ondersteuning van de departementsleiding van het
      ministerie en vervult daarbij een coördinerende rol. Deze taken worden gekenmerkt door een representatief of
      vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel7
  - number: '8.1'
    text: |-
      De directie Voorlichting (DV) is belast met het geven van informatie van en over de Justitieorganisatie. Hierbij
      wordt gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft
      de directie tot taak om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen de
      Justitieorganisatie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel8
  - number: '8.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel8
  - number: 8.2.a
    text: het Stafbureau;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel8
  - number: 8.2.b
    text: de afdeling Persvoorlichting en Beleidspresentatie;
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel8
  - number: 8.2.c
    text: de afdeling Communicatie & Redactie.
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel8
  - number: '9.1'
    text: |-
      De directie Financieel-Economische Zaken (DFEZ) is belast met de advisering van de departementsleiding
      over financiële en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1] en de daaruit voortvloeiende regelgeving.
      De directie is tevens belast met de advisering van de Minister voor Jeugd en Gezin over deze onderwerpen, voor
      zover deze het tot diens verantwoordelijkheid behorende werkterrein betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0022607/2010-10-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '27'
  - number: '9.2'
    text: 'De directie bestaat uit:'
