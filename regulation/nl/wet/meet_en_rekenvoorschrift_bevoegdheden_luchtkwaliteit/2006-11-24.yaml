        artikel: '4'
        paragraaf: '2'
  - number: '12'
    text: |-
      De gevolgen voor de luchtkwaliteit, bedoeld in [artikel 2, eerste lid][ref1], bij een inrichting worden bepaald
      vanaf de grens van het terrein van die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '2'
        paragraaf: '2'
  - number: '13'
    text: |-
      1 Het bepalen, door middel van berekeningen, van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], bij een inrichting vindt plaats volgens de rekenmethode van het Nieuw Nationaal
      Model (Uitgave 1998, ISBN 90-76323-003), zoals deze luidt op 1 oktober 2006, voor zover de desbetreffende situatie
      valt binnen het toepassingsgebied van die rekenmethode.

      2 Van het Nieuw Nationaal Model, genoemd in het eerste lid, kan geheel of gedeeltelijk worden afgeweken, mits een
      andere methode waarmee wordt afgeweken passend is en gelijkwaardig aan het Nieuw Nationaal Model.

      3 In situaties voor zover die vallen buiten het toepassingsgebied van het Nieuw Nationaal Model wordt een andere,
      passende methode toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      Van een andere methode als bedoeld in [artikel 13, tweede of derde lid][ref1], kunnen bestuursorganen gebruik maken
      indien de andere methode is goedgekeurd door de Minister. De goedkeuring wordt in elk geval onthouden indien de
      methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel13
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '13'
        paragraaf: '4'
  - number: '15'
    text: |-
      1 De resultaten van het bepalen van de gevolgen voor de luchtkwaliteit, bedoeld in [artikel 2, eerste lid][ref1],
      bij een weg of inrichting worden op een inzichtelijke en te verifiëren wijze vastgelegd in een rapport dat verder
      in elk geval bevat:

      a. een verantwoording van de gebruikte methode en van de redenen waarom de betreffende situatie valt binnen het
      toepassingsbereik van die methode, en

      b. een vermelding van alle gegevens die bij de berekening zijn gebruikt, alsmede een onderbouwing van die gegevens
      en van de wijze van invoer daarvan.

      2 In situaties waarin gebruik is gemaakt van een andere methode als bedoeld in
      [artikel 9, tweede of derde lid][ref2], of [artikel 13, tweede of derde lid][ref3], bevat het rapport een
      beschrijving en een verantwoording van die andere methode en de toepassing daarvan.

      3 In situaties waarin gebruik is gemaakt van een afstand groter dan vijf respectievelijk tien meter van de wegrand
      als bedoeld in [artikel 8, tweede lid][ref4], bevat het rapport een motivering daarvan, alsmede van de gehanteerde
      afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020453#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020453#Artikel8
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel15
