  - number: '17'
    text: |-
      Deze regeling is niet van toepassing op besluiten die zijn voortgevloeid uit de uitoefening van bevoegdheden als
      bedoeld in [artikel 7 van het Besluit][ref1], noch op de uit die besluiten voortvloeiende rechts- en feitelijke
      handelingen, voor zover het ontwerp van een dergelijk besluit voor het tijdstip van inwerkingtreding van deze
      regeling ter inzage is gelegd of een dergelijk besluit voor dat tijdstip is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel7
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel17
