  - number: '11'
    text: |-
      Bij het bepalen, door middel van berekeningen, van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], bij een inrichting wordt, naast de gegevens bedoeld in [artikel 4][ref2], gebruik
      gemaakt van gegevens met betrekking tot de te verwachten:

      a. fysieke kenmerken van de bron;

      b. kenmerken van de emissie, en

      c. kenmerken van de omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel4
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel11
    references:
