  - number: '5'
    text: |-
      1 De gevolgen voor de luchtkwaliteit, bedoeld in [artikel 2, eerste lid][ref1], worden op een zodanige wijze
      bepaald dat afwijkingen van de berekende concentraties ten opzichte van de werkelijke jaargemiddelde concentraties
      niet meer bedragen dan:

      a. 30 procent voor stikstofdioxide bij wegen;

      b. 50 procent voor zwevende deeltjes (PM);

      c. 50 procent voor benzeen, en

      d. 50 procent voor lood.

      2 De gevolgen voor de luchtkwaliteit worden voorts op een zodanige wijze bepaald dat afwijkingen van de berekende
      concentraties voor:

      a. stikstofdioxide bij inrichtingen ten opzichte van de werkelijke uurgemiddelde concentraties niet meer bedragen
      dan 60 procent;

      b. zwevende deeltjes (PM) ten opzichte van de werkelijke vierentwintig-uurgemiddelde concentraties niet meer
      bedragen dan een factor twee;

      c. koolmonoxide ten opzichte van de werkelijke acht-uurgemiddelde concentraties niet meer bedragen dan 50 procent,
      en

      d. zwaveldioxide ten opzichte van de werkelijke uurgemiddelde concentraties niet meer bedragen dan 60 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel5
    references:
