        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      Wanneer de waarde van een door middel van berekeningen bepaalde concentratie aan een grenswaarde als genoemd in
      [paragraaf 2 van het Besluit][ref1] wordt getoetst, wordt die waarde afgerond naar het dichtstbijzijnde hele getal,
      waarbij een halve eenheid wordt afgerond naar het dichtstbijzijnde even getal.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018458
        paragraaf: '2'
  - number: '7'
    text: |-
      Bij het door middel van berekeningen bepalen van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], bij een weg wordt, naast de gegevens, bedoeld in [artikel 4][ref2], gebruik gemaakt
      van gegevens met betrekking tot de te verwachten:

      a. verkeersintensiteit van de onderscheidenlijke categorieën van motorvoertuigen;

      b. wijze waarop het verkeer zich afwikkelt;

      c. kenmerken van de betreffende weg, en

      d. kenmerken van de omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel4
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel7
