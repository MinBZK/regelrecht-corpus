  - number: '8'
    text: |-
      1 Bij het door middel van berekeningen bepalen van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], bij een voor motorvoertuigen bestemde weg, worden:

      a. concentraties op een zodanige punt bepaald dat gegevens worden verkregen waarvan aannemelijk is dat deze
      representatief zijn voor de luchtkwaliteit in een gebied van tenminste 200 m2 ;

      b. concentraties van stikstofdioxide, bepaald op maximaal vijf meter van de wegrand;

      c. concentraties van zwevende deeltjes (PM), bepaald op maximaal tien meter van de wegrand.

      2 Indien het bepaalde in het eerste lid, onder b of c, ertoe leidt dat door middel van berekeningen concentraties
      worden bepaald op een zodanige punt dat de verkregen gegevens niet in overeenstemming zijn met het bepaalde in het
      eerste lid, onder a, worden de concentraties in afwijking van het bepaalde in het eerste lid onder b of c, bepaald
      op een afstand groter dan vijf respectievelijk tien meter van de wegrand.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '2'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Het bepalen, door middel van berekeningen, van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], bij een weg vindt plaats volgens de in [bijlage IA][ref2] beschreven
      standaardrekenmethode 1, dan wel volgens de in [bijlage IB][ref3] beschreven standaardrekenmethode 2, al naar
      gelang en voor zover de desbetreffende situatie valt binnen het toepassingsgebied van de ene dan wel de andere
      methode.

      2 In situaties voor zover die binnen het toepassingsgebied vallen van de standaardrekenmethode 1 of 2, genoemd in
      het eerste lid, kan geheel of gedeeltelijk worden afgeweken van die standaardrekenmethoden, mits een andere methode
      waarmee wordt afgeweken passend is en gelijkwaardig aan die standaardrekenmethoden.

      3 In situaties voor zover die buiten het toepassingsgebied vallen van de standaardrekenmethode 1 of 2, genoemd in
      het eerste lid, wordt een andere, passende methode toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020453
      [ref3]: https://wetten.overheid.nl/BWBR0020453
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020453
      - id: ref3
        bwb_id: BWBR0020453
  - number: '10'
    text: |-
      Van een andere methode als bedoeld in [artikel 9, tweede of derde lid][ref1], kunnen bestuursorganen gebruik maken
      indien die methode is goedgekeurd door de Minister. De goedkeuring wordt in elk geval onthouden indien:

      a. de methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is beschreven, of

      b. de resultaten van de toepassing van een andere methode als bedoeld in [artikel 9, tweede lid][ref2], in een
      situatie die valt binnen het toepassingsbereik van standaardrekenmethode 1, meer dan 15 procent afwijken van de
      referentiewaarde voor zover deze betrekking hebben op de concentraties van stikstofdioxide, of meer dan 10 procent
      afwijken van de referentiewaarde voor zover deze betrekking hebben op de concentraties van zwevende deeltjes (PM)
      of

      c. de resultaten van de toepassing van een andere methode als bedoeld in [artikel 9, tweede lid][ref3], in een
      situatie die valt binnen het toepassingsbereik van standaardrekenmethode 2, meer dan 10 procent afwijken van de
      referentiewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020453#Artikel9
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel10
