        bwb_id: BWBR0018590
        paragraaf: '4'
  - number: '3'
    text: |-
      Vóór 15 maart van ieder kalenderjaar worden de volgende gegevens bekendgemaakt:

      a. een overzicht van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide, stikstofoxiden,
      zwevende deeltjes (PM), lood, koolmonoxide, ozon en benzeen van het voorafgaande kalenderjaar;

      b. een overzicht van de prognoses van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide,
      stikstofoxiden, zwevende deeltjes (PM), lood, koolmonoxide, ozon en benzeen van het tiende kalenderjaar volgend op
      het voorafgaande kalenderjaar en de jaren 2010 en 2020;

      c. een overzicht van de emissiefactoren van zwaveldioxide, stikstofoxiden, zwevende deeltjes (PM), lood,
      koolmonoxide en benzeen van het voorafgaande kalenderjaar;

      d. een overzicht van de prognoses van de emissiefactoren van zwaveldioxide, stikstofoxiden, zwevende deeltjes (PM),
      lood, koolmonoxide en benzeen van het tiende kalenderjaar volgend op het voorafgaande kalenderjaar en de jaren 2010
      en 2020;

      e. de meteorologische gegevens van het voorafgaande kalenderjaar en de vijfjarige gemiddelde meteorologische
      gegevens;

      f. de ruwheidskaart.
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel3
  - number: '4'
    text: |-
      1 Bij het door middel van berekeningen bepalen van de gevolgen voor de luchtkwaliteit, bedoeld in
      [artikel 2, eerste lid][ref1], maken bestuursorganen gebruik van de gegevens, bedoeld in [artikel 3][ref2].

      2 In afwijking van het eerste lid kunnen bestuursorganen andere gegevens gebruiken dan de gegevens bedoeld in
      [artikel 3, onder a of b][ref3], indien die andere gegevens zijn goedgekeurd door de Minister. De goedkeuring wordt
      in elk geval onthouden indien:

      a. bij de totstandkoming van die andere gegevens, de [Meetregeling luchtkwaliteit 2005][ref4] niet op een juiste
      wijze is toegepast;

      b. de andere gegevens niet een beeld geven van de grootschalige concentratiegegevens en de prognoses daarvan
      in een bepaald gebied dat qua representativiteit ten minste gelijkwaardig is aan de gegevens, bedoeld in
      [artikel 3, onder a en b][ref5], of

      c. de totstandkoming of het gebruik van de andere gegevens niet op een deugdelijke wijze is onderbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel2
