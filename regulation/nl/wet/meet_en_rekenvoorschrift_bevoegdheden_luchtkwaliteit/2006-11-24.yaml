  - number: '2'
    text: |-
      1 Deze regeling is van toepassing op het door middel van metingen en berekeningen bepalen van de gevolgen voor
      de luchtkwaliteit van de uitoefening van bevoegdheden of de toepassing van wettelijke voorschriften, bedoeld in
      [artikel 7 van het Besluit][ref1].

      2 Voor zover de gevolgen voor de luchtkwaliteit, bedoeld in het eerste lid, worden bepaald door middel van
      metingen, zijn de [paragrafen 4 tot en met 12][ref2] en de [bijlage van de Meetregeling luchtkwaliteit 2005]
      (onbekend) van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018590#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel2
    references:
