  - number: '16'
    text: |-
      In afwijking van [artikel 3][ref1] worden de in [dat artikel][ref2] bedoelde gegevens in het jaar 2006 binnen twee
      weken na de inwerkingtreding van deze regeling bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel3
