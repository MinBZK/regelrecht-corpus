articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      Besluit: [Besluit luchtkwaliteit 2005][ref1];

      emissiefactor: factor die de uitstoot van een luchtverontreinigende stof per voertuigkilometer weergeeft;

      grootschalige concentratiegegevens: gegevens met betrekking tot de gemiddelde concentraties op een schaalniveau van
      één bij één km;

      referentiewaarde: in [bijlage IC][ref2] opgenomen concentraties bepaald met behulp van de in [die bijlage][ref3]
      omschreven situaties;

      ruwheidskaart: kaart, houdende een overzicht van de gemiddelde ruwheidslengte op een schaalniveau van één bij één
      km;

      ruwheidslengte: parameter voor de mechanische wrijving tussen luchtstromen en het landoppervlak;

      verkeersintensiteit: aantal motorvoertuigen dat gemiddeld gedurende een bepaald tijdvak een waarneempunt bij een
      weg passeert.


      [ref1]: https://wetten.overheid.nl/BWBR0018458
      [ref2]: https://wetten.overheid.nl/BWBR0020453
      [ref3]: https://wetten.overheid.nl/BWBR0020453
