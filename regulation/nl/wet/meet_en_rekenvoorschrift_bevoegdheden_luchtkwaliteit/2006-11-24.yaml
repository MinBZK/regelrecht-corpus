        artikel: '7'
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van de vierde week na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Meet- en rekenvoorschrift bevoegdheden luchtkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0020453/2006-11-24#Artikel19
