  - number: '5'
    text: |-
      1 Tot de middelen bedoeld in [artikel 4][ref1] worden alle vermogens- en inkomensbestanddelen gerekend waarover de
      asielzoeker beschikt of redelijkerwijs kan beschikken.

      2 Niet tot de middelen van de asielzoeker worden gerekend:

      a. kinderbijslag;

      b. vergoedingen en tegemoetkomingen, waaronder begrepen de tegemoetkoming ontvangen op grond van het
      [Tijdelijk besluit tegemoetkoming buitengewone uitgaven][ref2], voor, alsmede de vermindering of teruggave van
      loonbelasting of inkomensbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen
      noodzakelijke bestaanskosten behoren;

      c. rente ontvangen over op grond van [artikel 7, tweede lid, onder b, c, en d][ref3], niet in aanmerking genomen
      vermogen;

      d. een uitkering in verband met geleden immateriële schade voor zover dit, gelet op de aard en de hoogte van de
      uitkering, uit een oogpunt van het verlenen van verstrekkingen als bedoeld in [artikel 9 van de Rva 2005][ref4],
      verantwoord is;

      e. giften van instellingen en particulieren voor zover deze, gezien de bestemming en de hoogte van de giften, uit
      een oogpunt van het verlenen van verstrekkingen als bedoeld in [artikel 9 van de Rva 2005][ref5], verantwoord zijn.

      3 Onverminderd het bepaalde in het tweede lid worden niet tot de middelen van een asielzoeker, niet
      zijnde een vergunninghouder, gerekend inkomsten uit arbeid gedurende ten hoogste 24 weken binnen een
      periode van 52 weken tot 25 procent van deze inkomsten, met een maximum van het bedrag, genoemd in
      [artikel 31, tweede lid, onderdeel n, van de Participatiewet][ref6], per maand.

      4 Onverminderd het bepaalde in het tweede lid worden tot de middelen van een vergunninghouder niet
      gerekend inkomsten uit arbeid tot 25 procent van deze inkomsten, met een maximum van het bedrag, genoemd in
      [artikel 31, tweede lid, onderdeel n, van de Participatiewet][ref7], per maand.

      5 De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:

      a. de daarover door de asielzoeker verschuldigde loonbelasting of inkomstenbelasting;

      b. de daarover door de asielzoeker verschuldigde premies volksverzekeringen, premies werknemersverzekeringen dan
      wel een inhouding die met een of meer van deze premies overeenkomt;

      c. ten laste van de asielzoeker komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen; en

      d. andere ten laste van de asielzoeker komende verplichtingen.


