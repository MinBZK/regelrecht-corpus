  - number: '4'
    text: |-
      De vergoeding, bedoeld in [artikel 20, tweede lid, van de Rva 2005][ref1], per maand is gelijk aan de in aanmerking
      te nemen middelen van de asielzoeker en zijn gezinsleden tot een maximum van de economische waarde van de
      verstrekkingen bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0024733#Artikel3
