    text: |-
      1 Voor de toepassing van deze regeling wordt verstaan onder ‘Rva 2005’: de
      [Regeling verstrekkingen asielzoekers en andere categorie vreemdelingen 2005][ref1].

      2 Voor de toepassing van deze regeling wordt verstaan onder ‘vergunninghouder’: de vreemdeling bedoeld in
      [artikel 3, derde lid, onderdeel c, van de Rva 2005][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017959
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel3
