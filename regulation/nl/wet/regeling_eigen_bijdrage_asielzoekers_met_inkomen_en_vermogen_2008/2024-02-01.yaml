  - number: '2'
    text: |-
      Tot de aan de asielzoeker feitelijk geboden verstrekkingen, bedoeld in
      [artikel 20, tweede lid, van de Rva 2005][ref1], worden gerekend:

      a. de aan of ten behoeve van de asielzoeker en zijn gezinsleden verstrekte financiële toelage ten behoeve van
      voedsel, kleding en andere persoonlijke uitgaven en de in natura verstrekte maaltijden;

      b. het onderdak in een opvangcentrum of de financiële toelage ten behoeve van de huisvesting buiten een
      opvangcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel20
    url: https://wetten.overheid.nl/BWBR0024733/2024-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '20'
  - number: '3'
    text: |-
      De economische waarde per maand, bedoeld in [artikel 20, tweede lid, van de Rva 2005][ref1], bedraagt:

      a. van de verstrekkingen bedoeld in artikel 2, onderdeel a: de toelage bedoeld in
      [artikel 14, tweede lid, van de Rva 2005][ref2], die aan of ten behoeve van de asielzoeker of vergunninghouder
      wordt of zou worden verstrekt voor het volledig zelf verzorgen van maaltijden, vermenigvuldigd met de factor 4,33;

      b. van de verstrekkingen bedoeld in artikel 2, onderdeel b: € 50,00 voor een alleenstaande asielzoeker of
      vergunninghouder of eerste gezinslid, € 25,00, voor het tweede gezinslid en € 12,50 per volgend gezinslid,
      vermenigvuldigd met de factor 4,33, tot een maximum van € 433,00.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel14
    url: https://wetten.overheid.nl/BWBR0024733/2024-02-01#Artikel3
