      van toepassing voor zover voor de inwerkingtreding van deze regeling door de asielzoeker een vergoeding bedoeld in
      [artikel 20, tweede lid, Rva 2005][ref2] werd afgedragen en voor zover dit voor de asielzoeker gunstiger is.


