  - number: '6'
    text: |-
      1 Onder inkomen wordt verstaan de middelen voor zover deze:

      a. betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, sociale zekerheidsuitkeringen,
      uitkeringen tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref1], voorlopige teruggave of
      teruggave van inkomstenbelasting, loonbelasting, premies volksverzekeringen, zorgtoeslag, studiefinanciering, dan
      wel naar hun aard met deze inkomsten of uitkeringen overeenkomen;

      b. betrekking hebben op een periode waarover beroep op opvang wordt gedaan.

      2 Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0024733/2024-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '7'
    text: |-
      1 Onder vermogen wordt verstaan:

      a. de waarde van de bezittingen waarover de asielzoeker bij de aanvang van de opvang beschikt of redelijkerwijs kan
      beschikken, verminderd met de op dat tijdstip aanwezige schulden. De waarde van de bezittingen wordt vastgesteld op
      de waarde in het economische verkeer bij vrije oplevering;

      b. middelen die worden ontvangen tijdens de periode waarover beroep op opvang wordt gedaan, voor zover deze geen
      inkomen zijn als bedoeld in [artikel 6][ref1].

      2 Niet als vermogen wordt in aanmerking genomen:

      a. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;

      b. het bij de aanvang van de opvang aanwezige vermogen voor zover dit minder bedraagt dan de vermogensgrens als
      bedoeld in [artikel 20, tweede lid, van de Rva 2005][ref2];

      c. vermogen ontvangen tijdens de periode waarover beroep op opvang wordt gedaan, tot het bedrag dat
      het bij de aanvang van de opvang aanwezige vermogen minder bedroeg dan de vermogensgrens, bedoeld in
      [artikel 20, tweede lid, van de Rva 2005][ref3];

      d. spaargelden opgebouwd tijdens de periode waarin opvang wordt geboden;

      e. vergoedingen voor immateriële schade voor zover dit, gelet op de aard en de hoogte van de uitkering, vanuit een
      oogpunt van het verlenen van verstrekkingen als bedoeld in [artikel 9 van de Rva 2005][ref4], verantwoord is.


