$id: invoeringswet_wet_stedelijke_vernieuwing
regulatory_layer: WET
publication_date: '2012-03-09'
valid_from: '2000-12-01'
bwb_id: BWBR0011789
url: https://wetten.overheid.nl/BWBR0011789/2000-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de met betrekking tot deWet stedelijke vernieuwing
    noodzakelijke overgangsbepalingen tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder stedelijke vernieuwing, ontwikkelingsprogramma,
      investeringsbudget, investeringstijdvak onderscheidenlijk Onze Minister, hetgeen daaronder wordt verstaan in
      [artikel 1 van de Wet stedelijke vernieuwing][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel1
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '1'
  - number: '1.2'
    text: |-
      Waar bij of krachtens deze wet bevoegdheden zijn toegekend aan Onze Minister, oefent hij deze uit in
      overeenstemming met Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel1
  - number: '2'
    text: |-
      De programma's inzake stedelijke vernieuwing voor de jaren 2000 tot en met 2004, op basis waarvan Onze
      Minister met gemeenten als bedoeld in [artikel 5, tweede lid, van de Wet stedelijke vernieuwing][ref1] bij
      zogenoemd stadsconvenant is overeengekomen dat investeringsbudget zal worden verleend, worden aangemerkt als
      ontwikkelingsprogramma's behoudens noodzakelijke wijzigingen daarin als gevolg van het bij of krachtens deze wet en
      de [Wet stedelijke vernieuwing][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011788
  - number: '3.1'
    text: |-
      In afwijking van
      [artikel 6, eerste lid onderscheidenlijk derde lid, eerste volzin, van de Wet stedelijke vernieuwing][ref1]
      geldt voor het investeringstijdvak 2000 tot en met 2004 dat Onze Minister, onderscheidenlijk gedeputeerde staten,
      uiterlijk vier weken na de inwerkingtreding van deze wet inzicht geeft, onderscheidenlijk geven, in de hoogte
      van het investeringsbudget, onderscheidenlijk de verdeling van de middelen voor investeringsbudget. Indien vóór
      de dag waarop deze wet in werking treedt, het in de eerste volzin bedoelde inzicht is gegeven, wordt dat inzicht
      aangemerkt als te zijn gegeven ingevolge [artikel 6 van de Wet stedelijke vernieuwing][ref2], uitgezonderd de
      gevallen waarin ingevolge die wet een ander inzicht dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '6'
  - number: '3.2'
    text: |-
      In afwijking van [artikel 6, derde lid, van de Wet stedelijke vernieuwing][ref1] geldt voor het investeringstijdvak
      2000 tot en met 2004, dat gedeputeerde staten uiterlijk vier weken na de inwerkingtreding van deze wet gemeenten
      aanwijzen waarvan naar hun oordeel een ontwikkelingsprogramma wordt verlangd. Indien vóór de inwerkingtreding
      van deze wet de in de eerste volzin bedoelde aanwijzing is gegeven, wordt die aanwijzing aangemerkt als te zijn
      gegeven ingevolge [artikel 6, derde lid, van de Wet stedelijke vernieuwing][ref2], uitgezonderd de gevallen waarin
      ingevolge die wet een andere aanwijzing dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '6'
  - number: '4'
    text: |-
      Indien vóór de inwerkingtreding van deze wet bij provinciale verordening ingevolge
      [artikel 145 van de Provinciewet][ref1] regels zijn gegeven omtrent de wijze waarop de verdeling tussen de
      gemeenten van de middelen voor investeringsbudget wordt vastgesteld, berust die verordening na de inwerkingtreding
      van deze wet op [artikel 6, vierde lid, van de Wet stedelijke vernieuwing][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel6
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '6'
  - number: '5.1'
    text: |-
      In afwijking van [artikel 11, tweede lid, van de Wet stedelijke vernieuwing][ref1], wordt een aanvraag tot
      verlening van investeringsbudget voor het investeringstijdvak 2000 tot en met 2004 ingediend uiterlijk vier weken
      na de dag waarop deze wet in werking treedt. Indien vóór de dag waarop deze wet in werking treedt, een aanvraag
      als bedoeld in de eerste volzin is ingediend, wordt die aanvraag aangemerkt als een aanvraag als bedoeld in
      [artikel 11 van de Wet stedelijke vernieuwing][ref2], met dien verstande dat voor de toepassing van de termijnen,
      genoemd in het derde lid van dat artikel, het tijdstip van ontvangst van de aanvraag wordt gesteld op de dag van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel11
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '11'
  - number: '5.2'
    text: |-
      Indien vóór de dag waarop deze wet in werking treedt, het in
      [artikel 11, vierde lid, van de Wet stedelijke vernieuwing][ref1] bedoelde advies van gedeputeerde staten
      aan Onze Minister is uitgebracht, wordt dat advies aangemerkt als een advies als bedoeld in dat artikellid.
      Indien Onze Minister vóór die dag gedeputeerde staten gedurende ten minste vier weken in de gelegenheid
      heeft gesteld hem te adviseren in de zin als bedoeld in de eerste volzin en gedeputeerde staten van die
      gelegenheid geen gebruik hebben gemaakt, wordt dit aangemerkt als het verstrijken van de termijn, bedoeld in
      [artikel 11, vierde lid, van de Wet stedelijke vernieuwing][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel11
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '11'
  - number: '5.3'
    text: |-
      Zo nodig in afwijking van [artikel 11, vierde en vijfde lid, van de Wet stedelijke vernieuwing][ref1], kan Onze
      Minister op een aanvraag tot verlening van investeringsbudget voor het investeringstijdvak 2000 tot en met 2004 nog
      in het kalenderjaar 2000 beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel11
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '11'
  - number: '5.4'
    text: |-
      Op de aanvraag wordt eerst beslist na de inwerkingtreding van de [Wet stedelijke vernieuwing][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011788
  - number: '6'
    text: |-
      [Artikel 26 van de Wet stedelijke vernieuwing][ref1] is, behoudens de tweede volzin van het eerste lid, niet
      van toepassing op het voor de eerste maal vaststellen van de algemene maatregelen van bestuur, bedoeld in
      de [artikelen 5, tweede lid][ref2], [6, tweede lid][ref3], [7, tweede lid][ref4], [13, tweede lid][ref5], en
      [19, eerste lid, van die wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011788#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011788#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011788#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011788#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0011788#Artikel19
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011788
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011788
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0011788
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0011788
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0011788
        artikel: '19'
  - number: '8'
    text: |-
      Ten aanzien van op 31 december 1999 reeds verleende of vastgestelde financiële middelen of subsidies
      voor activiteiten in het kader van stedelijke vernieuwing uit 's Rijks kas op voet van of krachtens de
      [artikelen 81, eerste lid][ref1], of [82, eerste lid, van de Woningwet][ref2], zoals die artikelleden op die
      dag luidden, blijft het bij of krachtens [afdeling 5 van hoofdstuk V van de Woningwet](onbekend) bepaalde,
      zoals dat op die dag luidde, van toepassing. De eerste volzin is niet van toepassing, voorzover bij of krachtens
      [artikel 9][ref3] andere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0011789#Artikel9
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0011789
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de uitbetaling en de
      besteding van de financiële middelen en de subsidies, bedoeld in [artikel 8][ref1], alsmede over de verslaglegging
      met betrekking tot die besteding. Bij of krachtens algemene maatregel van bestuur worden voorts regels gegeven met
      betrekking tot de gevallen waarin Onze Minister zodanige financiële middelen die zijn verleend in verband met de
      ontwikkeling van bouwlocaties, kan verhogen.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel8
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen voorschriften worden gegeven omtrent het
      door provincies overdragen van krachtens [artikel 81, derde lid, van de Woningwet][ref1], zoals dat artikel luidde
      op 31 december 1999, aan hen toegekende bevoegdheden en verplichtingen aan een gemeente of een samenwerkingsverband
      van gemeenten. De voorschriften betreffen in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel81
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '81'
  - number: 9.2.a
    text: het geval waarin een provincie bevoegdheden en verplichtingen al dan niet dient over te dragen;
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
  - number: 9.2.b
    text: |-
      de gehoudenheid van een provincie uitvoering te geven aan een door Onze Minister gegeven aanwijzing ter zake van
      een overdracht als bedoeld in onderdeel a, binnen een in die aanwijzing bepaalde termijn, en
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
  - number: 9.2.c
    text: de wijze waarop in geval van overdracht verantwoording aan Onze Minister wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
  - number: '9.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald dat de
      gemeenteraad onderscheidenlijk provinciale staten dan wel het samenwerkingsverband van gemeenten waaraan
      bevoegdheden of verplichtingen zijn overgedragen, voorschriften geven omtrent het door hen verstrekken van subsidie
      ten laste van de uit 's Rijks kas aan hen verstrekte financiële middelen, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel8
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.4'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen ter bevordering van eenheid in de
      voorschriften, bedoeld in het derde lid, regels worden gegeven omtrent de inhoud van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
  - number: '9.5'
    text: |-
      De gemeenteraad of provinciale staten dan wel het samenwerkingsverband van gemeenten waaraan bevoegdheden en
      verplichtingen zijn overgedragen, brengen de door hen gegeven voorschriften, bedoeld in het derde lid, binnen zes
      maanden na het van kracht worden van de regels, bedoeld in het vierde lid, in overeenstemming met die regels.
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
  - number: '9.6'
    text: |-
      Na de inwerkingtreding van deze wet berusten het [Besluit woninggebonden subsidies 1995][ref1] en het
      [Besluit locatiegebonden subsidies][ref2] uitsluitend op het eerste lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006950
      [ref2]: https://wetten.overheid.nl/BWBR0006425
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006950
      - id: ref2
        bwb_id: BWBR0006425
  - number: '11'
    text: |-
      Ten aanzien van op 31 december 1999 reeds verleende of vastgestelde financiële middelen of subsidies
      voor activiteiten in het kader van stedelijke vernieuwing uit 's Rijks kas op voet van of krachtens de
      [Wet op de stads- en dorpsvernieuwing][ref1] blijft het bij of krachtens die wet bepaalde, zoals dat op die dag
      luidde, van toepassing. De eerste volzin is niet van toepassing, voorzover bij of krachtens [artikel 14][ref2]
      andere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003709
      [ref2]: https://wetten.overheid.nl/BWBR0011789#Artikel14
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003709
      - id: ref2
        bwb_id: BWBR0011789
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      Verordeningen die onmiddellijk voorafgaande aan de inwerkingtreding van deze wet berustten op
      [artikel 41 van de Wet op de stads- en dorpsvernieuwing][ref1], blijven behoudens eerdere intrekking van kracht tot
      twee jaar na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel41
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '41'
  - number: '13'
    text: |-
      Voorzover door Onze Minister toezeggingen zijn gedaan of afspraken zijn gemaakt, als bedoeld in
      [artikel 19, eerste lid][ref1], met betrekking tot het verstrekken van financiële middelen of subsidie
      ingevolge de [Wet op de stads- en dorpsvernieuwing][ref2] aan een gemeente aan welke ingevolge die
      wet rechtstreeks door Onze Minister financiële middelen werden verleend en aan welke ingevolge de
      [Wet stedelijke vernieuwing][ref3] door de provincie investeringsbudget wordt verleend, gaan de uit die
      toezeggingen of afspraken voortvloeiende verplichtingen tot het verstrekken van financiële middelen aan
      die gemeente van Onze Minister over op de provincie. Onze Minister stelt de provincie daartoe op voet van
      [artikel 5, derde lid, van de Wet stedelijke vernieuwing][ref4] financiële middelen beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003709
      [ref3]: https://wetten.overheid.nl/BWBR0011788
      [ref4]: https://wetten.overheid.nl/BWBR0011788#Artikel5
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003709
      - id: ref3
        bwb_id: BWBR0011788
      - id: ref4
        bwb_id: BWBR0011788
        artikel: '5'
  - number: '14.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de uitbetaling en de
      besteding van de financiële middelen en de subsidies, bedoeld in [artikel 11][ref1], alsmede over de verslaglegging
      met betrekking tot die besteding.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel11
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Na de inwerkingtreding van deze wet berust het [Besluit op de stads- en dorpsvernieuwing][ref1] uitsluitend op het
      eerste lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003719
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003719
  - number: '15'
    text: |-
      In afwijking van [artikel 11][ref1] kan Onze Minister de op 1 januari 2005 nog in een stadsvernieuwingsfonds
      aanwezige gelden als bedoeld in [artikel 41a, tweede lid, van de Wet op de stads- en dorpsvernieuwing][ref2],
      zoals dat artikel luidde op 31 december 1999, terugvorderen, voorzover op eerstgenoemd tijdstip voor die gelden
      geen verplichtingen als bedoeld in dat artikel zijn aangegaan. Na 1 januari 2005 vrijvallende gelden worden niet
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel41a
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003709
        artikel: 41a
  - number: '18'
    text: |-
      Ten aanzien van op het tijdstip van inwerkingtreding van deze wet verleende subsidies uit 's Rijks kas
      ingevolge de [Wet geluidhinder][ref1] voor maatregelen die met ingang van dat tijdstip genoemd zijn in
      [artikel 126, tweede lid, van de Wet geluidhinder][ref2], blijft het bij of krachtens die wet bepaalde, zoals dat
      laatstelijk voor bedoeld tijdstip luidde, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel126
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '126'
  - number: '19.1'
    text: |-
      Voorzover vóór de inwerkingtreding van deze wet door Onze Minister aan provincies of gemeenten onderscheidenlijk
      door een provincie aan gemeenten bestuurlijke toezeggingen zijn gedaan dan wel door Onze Minister met provincies
      of gemeenten onderscheidenlijk door een provincie met gemeenten bestuurlijke afspraken zijn gemaakt, die
      geen betrekking hebben op financiële middelen of subsidies in de zin van de [artikelen 8][ref1], [11][ref2]
      of [18][ref3] en inhouden dat na 31 december 1999 subsidie voor activiteiten in het kader van stedelijke
      vernieuwing zal worden verstrekt, worden deze bij de inwerkingtreding van deze wet aangemerkt als te zijn begrepen
      in de aanspraken die de desbetreffende provincies en gemeenten ingevolge de [Wet stedelijke vernieuwing][ref4] over
      het desbetreffende investeringstijdvak hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011789#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0011789#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011789
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011789
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0011788
  - number: '19.2'
    text: |-
      Indien het bedrag van het investeringsbudget van een provincie of een gemeente op voet van de
      [Wet stedelijke vernieuwing][ref1] over het eerste of tweede investeringstijdvak lager is dan het totaalbedrag
      van de financiële middelen en de subsidie die ingevolge de in het eerste lid bedoelde toezeggingen en afspraken
      over het desbetreffende tijdvak zou zijn verleend, de afspraken gemaakt bij zogenoemd stadsconvenant als
      bedoeld in [artikel 2][ref2] daaronder niet begrepen, wordt het bedrag van het investeringsbudget op voet van de
      [Wet stedelijke vernieuwing][ref3] voor de desbetreffende provincie of gemeente voor dat tijdvak verhoogd tot het
      totaalbedrag van de financiële middelen en de subsidie die ingevolge de in het eerste lid bedoelde toezeggingen en
      afspraken over dat tijdvak zou zijn verleend. Voor de toepassing van dit lid wordt onder bestuurlijke toezeggingen
      of afspraken slechts verstaan toezeggingen of afspraken waaromtrent het desbetreffende bestuursorgaan aan de hand
      van uiterlijk 31 december 1999 gedane schriftelijke mededelingen van Onze Minister of van de provincie, uiterlijk
      zes maanden na de inwerkingtreding van deze wet heeft aangetoond dat die mededelingen redelijkerwijs moeten worden
      beschouwd als bestuurlijke toezeggingen of afspraken over het verstrekken van subsidie na de inwerkingtreding van
      deze wet voor activiteiten in het kader van stedelijke vernieuwing. Onze Minister kan categorieën van schriftelijk
      vastgelegde bestuurlijke toezeggingen of afspraken aanwijzen waarvoor de in de tweede volzin voorgeschreven
      procedure niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0011788
      [ref2]: https://wetten.overheid.nl/BWBR0011789#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011788
      - id: ref2
        bwb_id: BWBR0011789
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011788
  - number: '19.3'
    text: |-
      Indien een provincie als gevolg van het tweede lid investeringsbudget op voet van de
      [Wet stedelijke vernieuwing][ref1] dient te verhogen, komt die verhoging, voorzover die het gevolg is van
      toezeggingen door of afspraken met Onze Minister en die redelijkerwijs niet door die provincie binnen het ingevolge
      de [Wet stedelijke vernieuwing][ref2] beschikbaar gestelde budget kan worden betaald, ten laste van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011788
      [ref2]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011788
      - id: ref2
        bwb_id: BWBR0011788
  - number: '22.1'
    text: |-
      Bij ministeriële regeling kunnen nadere regels van procedurele of administratieve aard worden
      gegeven met betrekking tot de uitvoering van de overgang van financiële middelen of subsidies naar de
      [Wet stedelijke vernieuwing][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011788
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels met betrekking tot andere aspecten van overgangsrecht dan de
      vaststelling van voorschriften van procedurele of administratieve aard, als bedoeld in het eerste lid, worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel22
  - number: '22.3'
    text: |-
      Indien dit in het belang van een goede uitvoering van de overgang van financiële middelen naar
      de[ Wet stedelijke vernieuwing][ref1] naar het oordeel van Onze Minister dringend noodzakelijk is en naar zijn
      oordeel de totstandkoming van een algemene maatregel van bestuur als bedoeld in het tweede lid niet kan worden
      afgewacht, kan aanvankelijk bij ministeriële regeling toepassing worden gegeven aan het tweede lid. Een zodanige
      regeling vervalt op het tijdstip waarop de in het tweede lid bedoelde algemene maatregel van bestuur in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011788
  - number: '24'
    text: |-
      Deze wet en de [Wet stedelijke vernieuwing][ref1] treden in werking met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin deze wet wordt geplaatst. Deze wet en de [Wet stedelijke vernieuwing][ref2] werken, met
      uitzondering van de [artikelen 17][ref3] en [18][ref4] van deze wet, terug tot en met 1 januari 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011788
      [ref2]: https://wetten.overheid.nl/BWBR0011788
      [ref3]: https://wetten.overheid.nl/BWBR0011789#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0011789#Artikel18
    url: https://wetten.overheid.nl/BWBR0011789/2000-12-01#Artikel24
