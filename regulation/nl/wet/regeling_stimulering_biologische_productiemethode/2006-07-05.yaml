  - number: '4'
    text: |-
      1 Indien de aanvrager het landbouwbedrijf geheel of gedeeltelijk pacht dan wel op het landbouwbedrijf of op
      een gedeelte daarvan een gebruiksrecht heeft, kan de subsidie slechts worden verleend indien de pachter of de
      gerechtigde gedurende de periode waarvoor de verplichtingen zijn aangegaan, een gebruiksrecht heeft ten aanzien van
      de grond waarop het biologisch teeltplan van toepassing is.

      2 In het geval dat het gebruiksrecht, bedoeld in het eerste lid, een kortere dan de daar genoemde periode beslaat,
      kan een subsidie slechts worden verleend indien de verpachter of eigenaar toestemming heeft gegeven voor het
      deelnemen aan de regeling.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel4
  - number: 4a
    text: |-
      Bij een besluit als bedoeld in [artikel 14, eerste lid][ref1], kan de minister bepalen dat subsidie slechts wordt
      verleend ten behoeve van:

      a. bij dat besluit bepaalde gewassen, groepen van gewassen of productierichtingen;

      b. arealen die tenminste, onderscheidenlijk ten hoogste, overeenkomen met een bij dat besluit bepaalde omvang;

      c. bedrijven waarvan, gelet op de economische omstandigheden, de noodzaak van een financiële ondersteuning van de
      omschakeling groter is ten opzichte van andere bedrijven;

      d. bedrijven die aantoonbaar beschikken over afzetgaranties van biologisch geproduceerde producten;

      e. bedrijven waarvan de directeur onderscheidenlijk bedrijfsleider beschikt over een bij dat besluit bepaalde mate
      van opleiding of vakbekwaamheid;

      f. het stadium van omschakeling van bedrijven onderscheidenlijk productierichtingen;

      g. andere bij dat besluit nader gedefinieerde bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel14
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006677
        artikel: '14'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Een subsidie kan slechts worden verleend indien de aanvrager zich verplicht om gedurende een periode van vijf
      jaren:

      a. het gehele landbouwbedrijf dan wel een of meer van de productierichtingen, bedoeld in
      [artikel 1, onderdeel f][ref1], te gaan voeren overeenkomstig het biologisch teeltplan of

      b. het gehele landbouwbedrijf dan wel een of meer van de productierichtingen, bedoeld in
      [artikel 1, onderdeel f][ref2], voort te zetten overeenkomstig het biologisch teeltplan;

      en voor de productierichtingen waarvoor geen verplichting ingevolge onderdeel a of b is aangegaan, de goede
      landbouwpraktijken in acht neemt.

      2 De periode van vijf jaren geldt voor elk afzonderlijk perceel waarop de aanvraag tot subsidieverlening betrekking
      heeft.

      3 Wijzigingen met betrekking tot het biologisch teeltplan of de percelen waarop dit plan betrekking heeft worden
      vooraf ter goedkeuring aan de stichting Skal voorgelegd en, direct na goedkeuring, in afschrift aan Dienst
      Regelingen gezonden.

      4 Een bijdrage voor de biologische teelt van veevoedergewassen kan slechts worden verleend indien aan de
      aanvrager geen recht op een bijdrage is of wordt verleend op grond van de Subsidieregeling extensivering
      vleesstierenhouderij.

      5 De subsidieverlening wordt geweigerd aan, onderscheidenlijk ingetrokken voor aanvragers die door ernstige
      nalatigheid of opzet een onjuiste aanvraag tot subsidieverlening of -vaststelling hebben ingediend in het lopende
      kalenderjaar alsmede, indien er sprake was van opzet, in het voorafgaande kalenderjaar, ingevolge een regeling
      gebaseerd op [Verordening (EEG) nr. 2078/92](31992R2078) onderscheidenlijk hoofdstuk VI van de Verordening (EC)
      nr. 1257/1999.

      6 De verplichtingen, genoemd in het eerste lid, gelden met ingang van de datum van de beschikking tot
      subsidieverlening onderscheidenlijk op enige datum daarna die door de aanvrager op het biologisch teeltplan is
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006677#Artikel1
