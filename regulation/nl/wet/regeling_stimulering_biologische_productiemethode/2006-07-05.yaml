  - number: BI:23
    text: |-
      1 De controle op de naleving door aangeslotenen van de verplichtingen als bedoeld in artikel 5 van de Statuten
      wordt uitgevoerd door één of meerdere controleurs der Stichting.

      2 De controleur(s) voert/voeren naast onaangekondigde inspectiebezoeken, tenminste éénmaal per jaar een volledig
      fysieke controle uit van de bedrijven dan wel processen dan wel productsamenstellingen, eenheden en administraties
      der aangeslotenen. Daarnaast kan controle plaatsvinden in/op de in artikel 5, vierde lid, van de Statuten bedoelde
      vervoermiddelen, terreinen en opslagplaatsen van de leveranciers en afnemers.

      3 Van elk inspectie-/controlebezoek wordt door de controleur een inspectierapport gemaakt, dat medeondertekend
      dient te worden door degene die verantwoordelijk is voor de gecontroleerde eenheid. Door medeondertekening
      verklaart de desbetreffende aangeslotene accoord te zijn met de inhoud van het desbetreffende rapport en de
      consequenties ervan te aanvaarden. Het inspectie-rapport wordt bij de directeur gedeponeerd.

      4 De directeur geeft maandelijks een overzicht van de resultaten van de controles/inspecties aan de voorzitter van
      de Stichting.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel23
  - number: BI:24
    text: |-
      1 De controleur is bevoegd om, ingeval de productiewijze, de wijze van afleveren of administratie dan wel de
      handelswijze van een aangeslotene niet in overeenstemming is met het bepaalde bij of krachtens de Statuten en
      reglementen der Stichting of op grond daarvan wettig genomen besluiten, aanwijzingen te geven die ertoe strekken
      één en ander met de desbetreffende bepaling(en) in overeenstemming te brengen.

      2 De controleur is bevoegd om, ingeval de wijze van aanbrengen van de aanduidingen bedoeld in artikel 22 van
      dit reglement en/of, indien van toepassing, het EKO-keur merk, niet voldoet aan het bepaalde bij of krachtens de
      Statuten en reglementen der Stichting, aanwijzingen te geven die ertoe strekken één en ander met de desbetreffende
      bepaling(en) in overeenstemming te brengen.

      3 De controleur is bevoegd om, in het geval dat de aankoop, het vervoer of de aflevering van norm-produkten, of
      de administratie van de aangeslotene niet voldoet aan het bepaalde bij of krachtens de Statuten en reglementen
      der Stichting, aanwijzingen te geven die ertoe strekken één en ander met de desbetreffende bepalingen in
      overeenstemming te brengen.

      4 De controleur is bevoegd om voor een onderzoek naar bij of krachtens de Statuten bepaalde (w.o. de Skal-normen)
      niet toegestane produkten, monsters te nemen.

      5 De controleur is, onverminderd het bepaalde in het eerste, tweede en derde lid, bevoegd om, wanneer hij
      constateert dat met betrekking tot een produkt of een productpartij, waarvoor de naam van de Stichting dan wel het
      EKO-keurmerk wordt gebezigd, het bepaalde bij of krachtens de Statuten door een aangeslotene niet wordt nageleefd,
      de betreffende aangeslotene de verplichting op te leggen om dat merk dan wel die aanduidingen of vermeldingen die
      verwijzen naar de biologische productiemethode en of de Stichting, van de normprodukten te verwijderen of te doen
      verwijderen alsmede de betreffende aangeslotene het recht te ontnemen de betreffende produkten te verhandelen.

      Deze bevoegdheid bestaat tevens indien een aangeslotene, na hiertoe te zijn aangemaand, niet aan een op hem
      rustende betalingsverplichting ingevolge het [Bijdragereglement van Skal][ref1] voldoet.

      6 De controleur is onverminderd het bepaalde in het eerste, tweede en derde lid, bevoegd om, wanneer hij
      constateert dat met betrekking tot een produkt of een productpartij, waarvoor de naam van de Stichting dan wel
      het EKO-keurmerk wordt gebezigd, het bepaalde bij of krachtens de Statuten door een aangeslotene niet wordt
      nageleefd, de betreffende aangeslotene het recht te ontnemen om norm-produkten met één of meerdere van voornoemde
      aanduiding(en) te (doen) voorzien dan wel te verhandelen gedurende een langere periode.

      Deze bevoegdheid bestaat tevens indien een aangeslotene, na hiertoe te zijn aangemaand, niet aan een op hem
      rustende betalingsverplichting ingevolge het [Bijdragerelement van Skal][ref2] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0018852
      [ref2]: https://wetten.overheid.nl/BWBR0018852
