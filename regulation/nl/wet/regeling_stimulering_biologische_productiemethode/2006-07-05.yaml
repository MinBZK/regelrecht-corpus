  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening wordt bij Dienst Regelingen ingediend.

      2 Voor de aanvraag tot subsidieverlening, bedoeld in het tweede lid, maakt de aanvrager gebruik van een daartoe
      vastgesteld formulier.

      3 Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de daarin gestelde
      voorwaarden en verplichtingen, en stemt hij in met een doorgifte door de Stichting Skal aan Dienst Regelingen van
      alle gegevens betrekking hebbende op de uitoefening van de biologische productiemethode op zijn landbouwbedrijf.

      4 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een bouwplan met betrekking tot het gehele landbouwbedrijf over het jaar waarin de aanvraag tot
      subsidieverlening wordt ingediend;

      b. een biologisch teeltplan;

      c. in voorkomend geval: andere stukken die voor de vaststelling van het subsidiebedrag relevant zijn.

      5 a. Indien de aanvraag tot subsidieverlening betrekking heeft op de subsidie, bedoel in
      [artikel 10, derde lid, of vierde lid][ref1], voor zover het subsidie voor veevoedergewassen betreft die nog niet
      als biologische producten kunnen worden afgezet, bevat het biologisch teeltplan ten minste de navolgende gegevens:

        - een overzicht met betrekking tot de percelen van de produktierichtingen waarvoor de verplichtingen worden
      aangegaan, waaruit blijkt dat de omschakeling op een evenwichtige wijze zal plaatsvinden en binnen vijf jaar na
      de ingangsdatum van de verplichtingen zal zijn voltooid, met dien verstande dat voor de betrokken percelen het
      bedrijfsaansluitingscertificaat zal zijn verkregen, en waaruit blijkt dat op elk afzonderlijk omgeschakeld perceel
      ten minste vijf jaren de biologische produktiewijze zal worden toegepast;
        - de ingangsdatum van de verplichtingen;
        - de meest actuele versie van de door Dienst Regelingen verstrekte topografische kaart, schaal 1:10.000, met unieke
      perceelsnummering van voormelde percelen;
        - een afschrift van de bedrijfsaansluitingsbevestiging.

      b. Indien de aanvraag tot subsidieverlening betrekking heeft op de subsidie, bedoeld in
      [artikel 10, vierde lid][ref2], met uitzondering van subsidies voor veevoedergewassen die nog niet als biologische
      producten kunnen worden afgezet, bevat het biologisch teeltplan ten minste de navolgende gegevens:

        - de meest actuele versie van de door Dienst Regelingen verstrekte topografische kaart, schaal 1:10.000, met unieke
      perceelsnummering van de percelen van de productierichtingen waarop de biologische productiemethode reeds wordt
      toegepast en gedurende de komende vijf jaar zal worden voortgezet;
        - de ingangsdatum van de verplichtingen;
        - een afschrift van het meest recente bedrijfsaansluitingscertificaat.

      6 De subsidieontvanger is verplicht gedurende de looptijd van de verplichtingen bij de boekhouding te bewaren:

      a. bewijsstukken waaruit blijkt dat de subsidieontvanger, voor zover van toepassing, voldoet aan
      [artikel 4, eerste lid][ref3];

      b. een verklaring van de verpachter dan wel de eigenaar dat deze instemt met het deelnemen aan deze regeling met
      het landbouwbedrijf dat geheel of gedeeltelijk verpacht is dan wel waarop enig gebruiksrecht is gevestigd, in het
      in [artikel 4, tweede lid][ref4], bedoelde geval;

      c. de bedrijfsaansluitingsbevestiging en, voor zover van toepassing, de bedrijfsaansluitingscertificaten die
      betrekking hebben op alle jaren waarin de verplichtingen, bedoeld in [artikel 5, tweede lid][ref5], gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006677#Artikel10
