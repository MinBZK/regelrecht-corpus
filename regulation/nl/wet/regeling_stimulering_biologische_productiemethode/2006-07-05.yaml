  - number: '14'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van
      deze regeling.

      2 De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor de op grond van deze
      regeling te verstrekken subsidies en kan daarbij onderscheid maken tussen subsidies ter zake van
      [artikel 5, eerste lid, onderdeel a][ref1] dan wel [onderdeel b][ref2] dan wel de gewasgroep onderscheidenlijk
      de productierichting.

      3 Indien een subsidieplafond dreigt te worden overschreden kan de minister besluiten dat geen aanvragen tot
      subsidieverlening meer kunnen worden ingediend.

      4 De minister maakt de besluiten, bedoeld in het eerste, tweede en derde lid, bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel5
