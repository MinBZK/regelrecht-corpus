  - number: 14b
    text: |-
      De minister kan ter stimulering van de omschakeling naar of voortzetting van de biologische productiemethode aan
      biologische landbouwers subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel14b
  - number: 14c
    text: |-
      1 Subsidie wordt verleend voor:

      a. de eenmalige aansluitingsbijdrage bedoeld in [artikel 2 van het Skal-bijdragereglement][ref1] en

      b. de basisbijdrage, bedoeld in [artikel 3, onderdeel a, van het Skal-bijdragereglement][ref2].

      2 Geen subsidie wordt verleend voor incassokosten, administratiekosten en overige kosten verbonden aan de inning
      van de in het eerste lid bedoelde bedragen.

      3 De subsidie bedraagt 100% van de in het eerste lid bedoelde bedragen.

      4 Het subsidieplafond voor de op grond van deze regeling te verstrekken subsidie bedraagt € 5.600.000,00.


      [ref1]: https://wetten.overheid.nl/BWBR0018852#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018852#Artikel3
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel14c
