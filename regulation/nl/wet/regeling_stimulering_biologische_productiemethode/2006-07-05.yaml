    text: |-
      1 1. [Artikel 4:49, eerste lid, onderdeel c][ref1], vindt geen toepassing ten aanzien van reeds uitbetaalde
      subsidies indien niet-nakoming van de uit deze regeling voortvloeiende verplichtingen het gevolg is van:

      a. overlijden van de subsidieontvanger;

      b. overmacht;

      c. onteigening of gedwongen verkoop in de zin van de [Onteigeningswet][ref2] van de oppervlakte grond waarop het
      biologisch teeltplan betrekking heeft, voorzover deze onteigening of gedwongen verkoop niet te voorzien was op de
      dag waarop de aanvraag tot subsidieverlening is ingediend.

      2 Een subsidieontvanger dient het beroep op een van de in het eerste lid bedoelde gevallen bij Dienst Regelingen
      in binnen een termijn van tien werkdagen, te rekenen vanaf het tijdstip waarop dit voor hem mogelijk is. Dit beroep
      gaat vergezeld van bewijzen.


