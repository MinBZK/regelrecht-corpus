  - number: '2'
    text: |-
      De minister kan ter vermindering van de belasting voor het milieu en de natuur door de landbouw op grond van de
      volgende bepalingen een subsidie verstrekken ten behoeve van de biologische produktiemethode en van de biologische
      teelt van veevoedergewassen.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel2
  - number: '3'
    text: |-
      1 De subsidie kan slechts worden verleend aan natuurlijke personen en rechtspersonen, indien:

      a. zij voor eigen rekening en risico een landbouwbedrijf exploiteren;

      b. de natuurlijke persoon dan wel de directeur/bedrijfsleider op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening voor eigen rekening en risico als eigenaar, gerechtigde of, in het in [artikel 4][ref1] bedoelde
      geval, als pachter een landbouwbedrijf exploiteert;

      c. de natuurlijke persoon dan wel de directeur/bedrijfsleider op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening geen recht heeft op een ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref2].

      2 Indien meer dan een natuurlijke persoon of rechtspersoon voor gezamenlijke rekening en risico een landbouwbedrijf
      exploiteert, kan een subsidie worden verleend indien ten minste een van de natuurlijke personen dan wel
      rechtspersonen op het tijdstip van het indienen van de aanvraag tot subsidieverlening eigenaar, gerechtigde of,
      in het in [artikel 4][ref3] bedoelde geval, pachter van dit landbouwbedrijf is en voldoet aan het eerste lid,
      onderdeel a, en indien ten minste een van de natuurlijke personen dan wel de directeuren/bedrijfsleiders van de
      rechtspersonen voldoet aan het eerste lid, onderdeel c.

      3 Een subsidie voor de biologische teelt van veevoedergewassen kan slechts worden verleend aan natuurlijke of
      rechtspersonen indien zij zijn aangesloten bij de Stichting Skal te Zwolle.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0006677#Artikel4
