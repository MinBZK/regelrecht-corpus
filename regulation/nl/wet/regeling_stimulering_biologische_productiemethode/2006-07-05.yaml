        bwb_id: BWBR0018852
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018852
        artikel: '3'
  - number: 14d
    text: |-
      1 De subsidie kan jaarlijks worden verstrekt gedurende een periode van vijf jaar aan biologische landbouwers die

        - in Nederland gevestigd zijn en
        - bij de Stichting Skal zijn aangesloten.

      2 De subsidie kan voor het hele jaar of een deel daarvan worden vergoed afhankelijk van de periode dat de
      biologische landbouwer de biologische productiemethode uitoefent.

      3 Op de aanvraag tot subsidieverlening is [artikel 8, eerste, tweede en derde lid][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel8
