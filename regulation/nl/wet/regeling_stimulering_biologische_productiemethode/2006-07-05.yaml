  - number: '17'
    text: |-
      Deze regeling wordt aangehaald als: Regeling stimulering biologische productiemethode.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel17
  - number: BI:1
    text: |-
      Dit reglement neemt over de terminologie van de [Landbouwkwaliteitswet][ref1] (Stb. 1971, 371), het
      Landbouwkwaliteitsbesluit biologische productiemethode (Stb. 1992, 661), de Landbouwkwaliteitsregeling biologische
      productiemethode (Stcrt. 1992, 253) en de Statuten van de Stichting Skal (Stcrt. 1993, 73) en verstaat voorts
      onder:




                *Statuten:*


                de Statuten van de Stichting Skal;




                *controleur:*


                de controleur(s) dan wel inspecteur(s) in dienst van de Stichting Skal;




                *secundair productieproces:*


                verhandelen, opslaan, bereiden, marktklaar maken, invoeren van (landbouw)producten;




                *primaire productie:*


                handelingen die zijn gericht op het voortbrengen van landbouwproducten in de oorspronkelijke staat;




                *secundaire productie:*


                alle handelingen van verwerking, verduurzaming, verpakking, invoering, verhandeling, marktklaar maken en
      opslag van (landbouw)producten;




                *primair producent:*


                marktdeelnemer die enkel landbouwproducten produceert en enkel de door hem geproduceerde producten in de
      handel brengt;




                *secundair producent:*


                marktdeelnemer, niet zijnde een primair producent, die (landbouw)producten verhandelt, opslaat, bereidt,
      marktklaar maakt en/of invoert;




                *bedrijfsnummer:*


                bedrijfspecifiek nummer; het nummer waaronder de desbetreffende aangeslotene bij de Stichting staat
      geregistreerd;




                *procesnummer:*


                processpecifiek nummer, verbonden aan de procesomschrijving en gekoppeld aan het bedrijfsnummer; het
      nummer waaronder het desbetreffende proces bij de Stichting staat geregistreerd;




                *productnummer:*


                productspecifiek nummer verbonden aan het productregistratiecertificaat; het nummer waaronder het
      desbetreffende product bij de Stichting staat geregistreerd;




                *bedrijfsaansluitingsbevestiging:*


                aansluitbevestiging als bedoeld in artikel 2, derde lid, van dit reglement. Het vormt tezamen met het
      aanvraagformulier voor registratie de overeenkomst als bedoeld in artikel 5, eerste lid van de Statuten;




                *bedrijfsaansluitingscertificaat:*


                certificaat als bedoeld in artikel 2, achtste lid, van dit reglement en waarvan een model als bijlage 2
      bij dit reglement is gevoegd;




                *procesregistratiebevestiging:*


                registratiebevestiging als bedoeld in artikel 7, derde lid, van dit reglement. Het vormt tezamen met het
      aanvraagformulier voor registratie de overeenkomst als bedoeld in artikel 5, eerste lid van de Statuten;




                *procesregistratiecertificaat:*


                certificaat als bedoeld in artikel 7, achtste lid, van dit reglement en waarvan een model als bijlage 3
      bij dit reglement is gevoegd;




                *productregistratiebevestiging:*


                registratiebevestiging als bedoeld in artikel 12, derde lid, van dit reglement. Het vormt tezamen met het
      aanvraagformulier voor registratie de overeenkomst als bedoeld in artikel 5, eerste lid van de Statuten;




                *productregistratiecertificaat:*


                certificaat als bedoeld in artikel 12, zevende lid, van dit reglement en waarvan een model als bijlage 4
      bij dit reglement is gevoegd;




                *importeursaansluitingscertificaat:*


                certificaat als bedoeld in artikel 17, derde lid, van dit reglement en waarvan een model als bijlage
      5 bij dit reglement is gevoegd. Het vormt tezamen met het aanvraagformulier voor registratie de overeenkomst als
      bedoeld in artikel 5, eerste lid van de Statuten;




                *Skal-certificaat:*


                certificaat als bedoeld in artikel 22, eerste lid onder c, van dit reglement en waarvan een model als
      bijlage 6 bij dit reglement is gevoegd;




                *Bijdrage-reglement:*


                het [Bijdrage-reglement van de Stichting][ref2];




                *importeur:*


                natuurlijk of rechtspersoon die producten invoert uit niet-EG-landen om ze in de EG in de handel te
      brengen;




                *door Skal erkend controlesysteem:*


                controlesysteem van de in bijlage 7 van dit reglement bedoelde controleorganisaties;




                *norm-product(en):*


                product(en) niet vallend onder de werking van het Besluit maar wel vallend onder de werking van een
      overeenkomst.


