    text: |-
      1 Bij een besluit als bedoeld in [artikel 14, eerste lid][ref1], kan de minister bepalen dat bij subsidies als
      bedoeld in [artikel 5, eerste lid, onderdeel a][ref2]:

      a. per ontvanger niet meer subsidie wordt verstrekt dan een bij dat besluit bepaald bedrag, of

      b. de subsidie wordt berekend op grond van het derde lid.

      2 In zoverre in afwijking van [artikel 10, derde lid][ref3], bedraagt de subsidie, in geval van toepassing van
      het eerste lid, onderdeel a, en in geval het totaal van de door de betrokken subsidieontvanger aangevraagde
      subsidie meer bedraagt dan het uit hoofde van het eerste lid bepaalde bedrag, per hectare voor de in
      [artikel 10, derde lid][ref4], onderscheiden jaren en categorieën het desbetreffende in dat lid genoemde bedrag,
      vermenigvuldigd met de uitkomst van de deling van het ingevolge het eerste lid, onderdeel a, bepaalde bedrag door
      het totaal van de aangevraagde subsidie, berekend op de grondslag van [artikel 10, derde lid][ref5].

      3 In zoverre in afwijking van [artikel 10, derde lid][ref6], bedraagt de subsidie, in geval van toepassing
      van het eerste lid, onderdeel b, per hectare voor de in [artikel 10, derde lid][ref7], onderscheiden jaren en
      categorieën het desbetreffende in dat lid genoemde bedrag, vermenigvuldigd met de uitkomst van de deling van:
      a. het bedrag dat wordt verkregen door het totaal van de aangevraagde subsidie te berekenen op de grondslag van
      [artikel 10, derde lid][ref8] en op het aldus berekende bedrag een korting toe te passen van:

      1º 20% voor zover dit bedrag hoger is dan € 90.756,04, doch niet hoger dan € 136.134,06;

      2º 40% voor zover dit bedrag hoger is dan € 136.134,06, doch niet hoger dan € 181.512,08;

      3º 60% voor zover dit bedrag hoger is dan € 181.512,08, doch niet hoger dan € 226.890,11;

      4º 80% voor zover dit bedrag hoger is dan € 226.890,11, doch niet hoger dan € 272.268,13;

      5º 100% voor zover dit bedrag hoger is dan € 272.268,13;

      door

      b. het totaal van de aangevraagde subsidie, berekend op de grondslag van [artikel 10, derde lid][ref9].


