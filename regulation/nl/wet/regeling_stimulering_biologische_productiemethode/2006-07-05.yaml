  - number: BI:2
    text: |-
      1 Een ieder die zich op de voet van het bepaalde in artikel 4, tweede lid, van de Statuten als aangeslotene uit
      hoofde van een erkenning op basis van de Skal-normen en een overeenkomst wenst aan te sluiten bij de Stichting,
      wordt onverminderd het bepaalde in de volgende leden, toegelaten als aangeslotene bij de Stichting zodra:

      a. hij zich met een daartoe strekkend verzoek schriftelijk tot het Bestuur van de Stichting heeft gewend en de
      directeur een door hem ondertekend aanmeldingsformulier met bijbehorende bijlagen heeft ontvangen;

      b. de bedrijfsaansluitingsbijdrage als bedoeld in artikel 2, eerste lid, van het Bijdrage-reglement, is betaald.

      2 Door ondertekening van het in het eerste lid bedoelde aanmeldingsformulier verklaart de betrokkene dat hij zich
      overeenkomstig het bepaalde in de Statuten en de bij of krachtens deze vastgestelde reglementen, aan het toezicht
      van de Stichting zal onderwerpen en dat hij de verplichtingen genoemd in artikel 5 van de Statuten volledig en
      nauwkeurig zal nakomen.

      3 Zodra het in het eerste lid bedoelde ondertekende aanmeldingsformulier met bijbehorende bijlagen door de
      Stichting is ontvangen en aan het bepaalde in het eerste lid onder b is voldaan, bevestigt de directeur de
      betrokkene door middel van een bedrijfsaansluitingsbevestiging, dat hij als aangeslotene tot de Stichting is
      toegelaten als primaire productie-aangeslotene.

      De directeur draagt gelijktijdig de controleur op het bedrijf van de aangeslotene te inspecteren ter zake van het
      bij of krachtens de Statuten bepaalde (w.o. de Skal-normen) en een inspectieverslag op te stellen. De controleur
      kan zo nodig aanwijzingen geven, welke mede betrekking kunnen hebben op de organisatorische en administratieve
      voorzieningen op het bedrijf.

      4 De bedrijfsaansluitingsbevestiging, als bedoeld in het derde lid, bevat:

      a. de handelsnaam van de aangeslotene;

      b. het nummer waaronder de aangeslotene bij de Stichting is geregistreerd;

      c. een aanduiding omtrent de productiesector waar de aansluiting betrekking op heeft;

      d. de omvang van de eenheid waar de aansluiting betrekking op heeft;

      e. naam en adres van de aangeslotene;

      f. aard van de activiteiten die de aangeslotene uitvoert;

      g. locatie waar de aangeslotene zijn activiteiten uitvoert;

      5 Het in het derde lid bedoelde inspectieverslag dient in elk geval te bevatten:

      a. een volledige beschrijving van de eenheden met vermelding van de opslag- en productieplaatsen, de percelen en,
      voor zover van toepassing, van de plaatsen waar producten worden verwerkt en/of marktklaar worden gemaakt;

      b. alle concrete maatregelen die op de eenheid moeten worden genomen om de naleving van het bij of krachtens de
      Statuten bepaalde (w.o. de Skal-normen) te garanderen;

      c. de datum van de laatste toepassing op de betrokken eenheid van producten waarvan het gebruik niet in
      overeenstemming is met het bij of krachtens de Statuten bepaalde (w.o. de Skal-normen).

      6 Het inspectieverslag dient mede ondertekend te worden door degene die verantwoordelijk is voor de betrokken
      eenheid.

      7 Tegen aanwijzingen, als bedoeld in het derde lid, kan de betrokkene een klacht indienen bij de desbetreffende
      hoofdcontroleur op welke uitspraak beroep open staat bij de directeur.

      8 Op het moment dat de directeur vastgesteld heeft dat aan de aanwijzingen is voldaan en de directeur de
      aangeslotene daarvan schriftelijk in kennis heeft gesteld door middel van een bedrijfsaansluitingscertificaat,
      heeft de aangeslotene het recht tot het op producten aanbrengen van de aanduidingen als genoemd in artikel 22 van
      dit reglement. Op basis van het hier bedoelde certificaat kan overeenkomstig het ‘Reglement gebruik EKO-keurmerk’
      het recht op het gebruik van het EKO-keurmerk verkregen worden.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel2
  - number: BI:3
    text: |-
      Het bedrijfsaansluitingscertificaat bevat:

      a. de naam en handelsnaam van de aangeslotene;

      b. adres en woonplaats of plaats van vestiging van aangeslotene;

      c. een aanduiding omtrent de productiesector waar de aansluiting betrekking op heeft;

      d. de omvang van het bedrijf dan wel de productie-eenheid waar de aansluiting betrekking op heeft;

      e. een verklaring dat het bedrijf van de aangeslotene is gecontroleerd en dat de op het bedrijf gebezigde
      productiewijze voldoet aan het bij of krachtens de Statuten bepaalde (w.o. de Skal-normen);

      f. het nummer waaronder de aangeslotene bij de Stichting is geregistreerd;

      g. periode waarvoor het bedrijfsaansluitingscertificaat geldig is; dit is maximaal één kalenderjaar;

      h. de datum van controle en keuring;

      i. de verplichting van de aangeslotene om de Stichting onverwijld in kennis te stellen van wijzigingen in de onder
      a, b, c of d bedoelde gegevens, alsmede van wijzigingen in het bij de Stichting bekende productieschema.

      1. Zolang zich geen wijzigingen hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan wordt
      telkenjare een nieuw bedrijfsaansluitingscertificaat afgegeven.

      Het bedrijfsaansluitingscertificaat is geldig voor de daarop vermelde periode en zolang zich geen wijzigingen
      van de op het certificaat vermelde gegevens hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde
      is voldaan.

      2. Het bedrijfsaansluitingscertificaat wordt ondertekend en afgegeven door de directeur.

      3. Wijzigingen op het bedrijf van de aangeslotene die leiden tot omstandigheden van dien aard dat, waren zij reeds
      aanwezig geweest ten tijde van de afgifte van het bedrijfsaansluitingscertificaat, dit certificaat toen niet zou
      zijn verstrekt, maken het ongeldig, waarmee het recht als bedoeld in artikel 2, achtste lid, komt te vervallen. De
      houder is in dat geval verplicht het bedrijfsaansluitingscertificaat op eerste vordering aan de controleur af te
      geven, die het onder zich houdt tot de oorzaken van ongeldigheid zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel3
  - number: BI:4
    text: |-
      1 Het bedrijfsaansluitingscertificaat wordt jaarlijks in origineel afgegeven aan de betrokken aangeslotene, die
      dit in zijn administratie dient te bewaren. Bij verlies vervallen de aan het aansluitingscertificaat te ontlenen
      rechten.

      2 Een afschrift van het bedrijfsaansluitingscertificaat wordt door de directeur gehouden. Deze kan meerdere
      afschriften maken en waarmerken.

      3 Van de ongeldigheid van het bedrijfsaansluitingscertificaat kan de directeur elke bij de Stichting bekende
      afnemer van de desbetreffende aangeslotene op de hoogte stellen, onder mededeling dat van het bedrijf van de
      betrokken producent afkomstige producten niet meer met de aanduidingen bedoeld in artikel 22 van dit reglement
      alsmede, indien van toepassing, het EKO-keurmerk in de handel gebracht mogen worden. De directeur geeft daarvan een
      schriftelijke bevestiging. Zodra door de directeur is vastgesteld dat de oorzaak van de ongeldigheid is weggenomen,
      bericht hij dienovereenkomstig aan de voorbedoelde afnemers.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel4
  - number: BI:5
    text: |-
      De aangeslotene is verplicht:

      a. een zodanige administratie, schriftelijk of anderszins, bij te houden dat de controleur:

        - de oorsprong, de herkomst, de aard en de hoeveelheden alsmede het gebruik van alle aangekochte producten kan
      nagaan, alsmede,
        - de oorsprong, de herkomst, de aard, de hoeveelheden en de bestemmingen (waaronder: naam en adres van de
      desbetreffende afnemers met vermelding van de data van aflevering) van alle verkochte producten kan nagaan. De
      hoeveelheden dienen, wanneer zij betrekking hebben op de rechtstreekse verkopen aan de eindconsument, per product
      per dag te zijn samengesteld, alsmede,
        - wanneer de eenheid landbouwproducten verwerkt die zij zelf heeft geproduceerd, alle andere gegevens kan
      controleren die, naar de mening van de controleur, voor een adequate controle van de behandelingen dan wel
      bereidingen nodig zijn, zoals de oorsprong, de aard en de hoeveelheden van de ingrediënten, de additieven en de
      hulpstoffen voor fabricage die aan een te onderscheiden eenheid zijn geleverd en de samenstelling van de bereide
      producten;

      b. bij ontvangst van producten de sluiting van de verpakking of container en de aanwezigheid van de gegevens als
      bedoeld in artikel 22 te controleren. Het resultaat van deze controle moet expliciet in de administratie van de
      aangeslotene worden vermeld. Wanneer deze controle twijfel doet rijzen of het betrokken product wel afkomstig is
      van een marktdeelnemer die onder controle van een door Skal erkend controlesysteem valt, mag met de verwerking of
      de verpakking ervan slechts worden begonnen nadat hieromtrent uitsluitsel is verkregen;

      c. door hem verhandelde norm-producten vergezeld te doen gaan van een document dan wel te verpakken; een en ander
      overeenkomstig artikel 22 van dit reglement;

      d. te handelen overeenkomstig het gestelde in artikel 3, eerste lid, onder i;

      e. jaarlijks vóór de aan te geven datum het (per perceel) gespecificeerde productieschema dan wel het aantal
      aanwezige dieren en of de aanwezige productiecapaciteit aan de Stichting mee te delen, overeenkomstig het gestelde
      in [artikel 4, eerste lid, van het Bijdragereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018852
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel5
