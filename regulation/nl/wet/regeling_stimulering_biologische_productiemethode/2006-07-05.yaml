  - number: '11'
    text: |-
      De Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit is belast met het toezicht
      op de naleving van de in deze regeling gestelde voorschriften. Zij kan daartoe gebruik maken van de diensten van de
      stichting SKAL.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel11
  - number: 11a
    text: |-
      1 Ingeval de subsidieverlening betrekking heeft op een subsidie als bedoeld in
      [artikel 5, eerste lid, onderdeel a][ref1], wordt de subsidieverlening gewijzigd, indien:

      a. de subsidieontvanger, binnen de periode waarop de subsidieverlening betrekking heeft, wijzigingen doorvoert in
      het biologisch teelt- of bouwplan, na voorafgaande goedkeuring daarvan door de stichting Skal, en

      b. het bedrag aan subsidie, berekend over het gewijzigde biologische teelt- of bouwplan lager is dan het bedrag
      waarop de subsidieverlening betrekking heeft.

      2 De wijziging van de subsidieverlening, bedoeld in het eerste lid, gaat in op de eerste dag van het
      verplichtingenjaar waarin de wijziging van het biologische teelt- of bouwplan op het landbouwbedrijf wordt
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel5
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0006677
        artikel: '5'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 De subsidieverlening of -vaststelling wordt ingetrokken indien:

      a. de subsidieontvanger wijzigingen in het biologisch teelt- of bouwplan heeft doorgevoerd zonder voorafgaande
      goedkeuring van de stichting SKAL of

      b. aan de subsidieontvanger een subsidie is verleend op grond van de Subsidieregeling extensivering
      vleesstierenhouderij.

      2 Indien de in [artikel 10, zesde lid][ref1], bedoelde aanvraag tot subsidievaststelling wordt ingediend na
      de uiterste termijn voor indiening, wordt de subsidie met 1% per werkdag, tot een maximum van 25 dagen, lager
      vastgesteld.

      3 De subsidieverlening of -vaststelling wordt ingetrokken voor het betrokken verplichtingenjaar indien bij controle
      blijkt dat de oppervlakte waarvoor de aanvraag tot subsidieverlening is ingediend ten minste 2% en ten minste 20
      are doch ten hoogste 10% en ten hoogste 2 hectare groter is dan de bij de controle geconstateerde oppervlakte.

      4 Indien de aanvrager door ernstige nalatigheid of opzet een onjuiste aanvraag tot subsidievaststelling heeft
      ingediend, wordt de subsidieverlening onderscheidenlijk -vaststelling geweigerd, gewijzigd onderscheidenlijk
      ingetrokken, en wordt de betrokken subsidieontvanger voor het betreffende kalenderjaar uitgesloten van alle
      steun voor plattelandsontwikkeling ingevolge een regeling gebaseerd op hoofdstuk VI van [Verordening (EG) nr.
      1257/1999](31999R1257). In het geval van een opzettelijk onjuiste aanvraag tot subsidieverlening onderscheidenlijk
      -vaststelling wordt de subsidieontvanger tevens voor het daaropvolgende kalenderjaar uitgesloten.

      5 Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref2] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref3], worden terug te vorderen bedragen vermeerderd met de rente over
      de periode vanaf de eerste uitbetaling tot aan het moment van algehele voldoening. Indien de ingetrokken subsidie,
      vermeerderd met de wettelijke rente, kan worden verrekend met de betaling van de subsidie voor een volgende
      periode, wordt geen toepassing gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref4].

      6 De door de subsidieontvanger te betalen rente is de wettelijke rente in Nederland geldende op de laatste dag van
      de kalendermaand waarin de subsidie werd betaald.

      7 Geen wettelijke rente is verschuldigd indien de oorzaak van het onverschuldigd betalen bij de minister is
      gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel10
