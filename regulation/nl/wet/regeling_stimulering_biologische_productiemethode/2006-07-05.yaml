    text: |-
      De aangeslotene is verplicht:

      a. een zodanige administratie, schriftelijk of anderszins, bij te houden dat de controleur:

        - de oorsprong, de herkomst, de aard en de hoeveelheden alsmede het gebruik van alle aan een te onderscheiden
      eenheid geleverde producten kan nagaan, alsmede,
        - de oorsprong, de herkomst, de aard, de hoeveelheden en de bestemmingen alsmede het gebruik van alle producten die
      een te onderscheiden eenheid hebben verlaten kan nagaan, alsmede,
        - alle andere gegevens kan controleren die, naar de mening van de controleur, voor een adequate controle van de
      behandelingen dan wel bereidingen nodig zijn, zoals de oorsprong, de aard en de hoeveelheden van de ingrediënten,
      de additieven en de hulpstoffen voor fabricage die aan een te onderscheiden eenheid zijn geleverd en de
      samenstelling van de bereide producten;

      b. bij ontvangst van norm-producten de sluiting van de verpakking of container en de aanwezigheid van de gegevens
      als bedoeld in artikel 22 te controleren. Het resultaat van deze controle moet expliciet in de administratie van de
      aangeslotene worden vermeld.

      Wanneer deze controle twijfel doet rijzen of het betrokken product wel afkomstig is van een marktdeelnemer die
      onder controle van een door Skal erkend controlesysteem valt, mag met de verwerking of de verpakking ervan slechts
      worden begonnen nadat hieromtrent uitsluitsel is verkregen.

      c. een administratie, schriftelijk of anderszins, bij te houden van de aard, de hoeveelheden en de bestemming (waar
      onder: naam en adres van de desbetreffende afnemers met vermelding van de data van aflevering) van alle afgeleverde
      producten;

      d. door hem bereide norm-producten vergezeld te doen gaan van een document dan wel te verpakken, een en ander
      overeenkomstig artikel 22 van dit reglement;

      e. te handelen overeenkomstig het gestelde in artikel 8, eerste lid, onder h;

      f. periodiek vóór de aan te geven datum de gevraagde gegevens aan de Stichting mee te delen door het volledig en
      correct invullen van een productie-opgave-formulier.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel10
  - number: BI:11
    text: |-
      Wanneer in een te onderscheiden eenheid andere dan norm-producten worden verwerkt, bereid, marktklaar gemaakt of
      opgeslagen:

      a. dient de te onderscheiden eenheid te beschikken over afzonderlijke ruimten voor de opslag van de norm-producten
      vóór en na de behandelingen;

      b. dient een partij ineens en zonder onderbreking te worden behandeld en fysiek of in de tijd gescheiden te worden
      gehouden van gelijksoortige behandelingen betreffende niet norm-producten;

      c. dienen genoemde behandelingen, indien zij niet frequent (minder dan één keer per vier weken) worden verricht,
      van te voren bij de Stichting gemeld te worden, met inachtname van een termijn van vier werkdagen;

      d. dienen alle maatregelen te worden genomen om ervoor te zorgen dat de partijen kunnen worden geïdentificeerd en
      dat vermenging met producten die niet in overeenstemming met het bij of krachtens de Statuten bepaalde (w.o. de
      Skal-normen) zijn verkregen, wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel11
  - number: BI:12
    text: |-
      1 Een ieder die zich op de voet van het bepaalde in artikel 4, tweede lid, van de Statuten als aangeslotene uit
      hoofde van een erkenning op basis van de Skal-normen en een overeenkomst wenst aan te sluiten bij de Stichting,
      wordt onverminderd het bepaalde in de volgende leden, toegelaten als aangeslotene bij de Stichting zodra:

      a. hij zich met een daartoe strekkend verzoek schriftelijk tot het Bestuur van de Stichting heeft gewend en de
      directeur een door hem ondertekend aanmeldingsformulier met bijbehorende bijlagen heeft ontvangen;

      b. de productaanmeldingsbijdrage als bedoeld in artikel 2, eerste lid, van het Bijdrage-reglement, is betaald.

      2 Door ondertekening van het in het eerste lid bedoelde aanmeldingsformulier verklaart de betrokkene dat hij zich
      overeenkomstig het bepaalde in de Statuten en bij of krachtens deze vastgestelde reglementen, aan het toezicht
      van de Stichting zal onderwerpen en dat hij de verplichtingen genoemd in artikel 5 van de Statuten volledig en
      nauwkeurig zal nakomen.

      3 Zodra het in het eerste lid bedoelde ondertekende aanmeldingsformulier met bijbehorende bijlagen, door de
      Stichting is ontvangen en aan het bepaalde in het eerste lid onder b is voldaan, bevestigt de directeur de
      betrokkene door middel van een produktregistratiebevestiging, dat hij als aangeslotene tot de Stichting is
      toegelaten als produkt-aangeslotene.

      De directeur draagt gelijktijdig de controleur op de opgave van de aangeslotene te controleren ter zake van het bij
      of krachtens de Statuten bepaalde (w.o. de Skal-normen). De controleur kan zo nodig aanwijzingen geven.

      4 De produktregistratiebevestiging als bedoeld in het derde lid bevat:

      a. de handelsnaam van de aangeslotene;

      b. het nummer waaronder de aangeslotene, het desbetreffende norm-produkt alsmede het (de) desbetreffende
      proces(sen) waar het desbetreffende norm-produkt mee bereid, verwerkt en of marktklaar gemaakt zal worden bij de
      Stichting is (zijn) geregistreerd;

      c. een aanduiding omtrent het type produkt waar de productregistratie betrekking op heeft;

      d. naam en adres van de aangeslotene;

      e. aard van de activiteiten die de aangeslotene uitvoert;

      f. locatie waar de aangeslotene zijn activiteiten uitvoert;

      5 Bij de in het derde lid bedoelde controle wordt de opgave in elk geval getoetst op:

      a. volledigheid en juistheid van de beschrijving van het desbetreffende produkt, met vermelding van het (de)
      procesregistratiecertificaatnummer(s) waar het desbetreffende produkt mee verwerkt, marktklaar dan wel bereid zal
      gaan worden;

      b. de volledigheid en juistheid van de opgegeven concrete maatregelen die moeten worden genomen om de naleving van
      het bij of krachtens de Statuten bepaalde (w.o. de Skal-normen) te garanderen.

      6 Tegen aanwijzingen, als bedoeld in het derde lid, kan de betrokkene een klacht indienen bij de desbetreffende
      hoofdcontroleur op welke uitspraak beroep open staat bij de directeur.

      7 Op het moment dat de directeur vastgesteld heeft dat aan de aanwijzingen is voldaan en de directeur de
      aangeslotene daarvan schriftelijk in kennis heeft gesteld, door middel van een produktregistratiecertificaat, heeft
      de aangeslotene het recht tot het (doen) verwerken, bereiden dan wel marktklaar maken van het op het voornoemde
      certificaat omschreven norm-produkt en het daarop aanbrengen van de aanduidingen genoemd in artikel 22 van dit
      reglement. Op basis van het hier bedoelde certificaat kan overeenkomstig het ‘Reglement gebruik EKO-keurmerk’ het
      recht op het gebruik van het EKO-keurmerk verkregen worden.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel12
  - number: BI:13
    text: |-
      1 Het produktregistratiecertificaat bevat:

      a. de naam en handelsnaam van de aangeslotene;

      b. adres en woonplaats of plaats van vestiging van aangeslotene;

      c. een aanduiding omtrent het type produkt waar de registratie betrekking op heeft;

      d. de samenstelling, benaming(en) en verpakkingseenheid van het norm-produkt waar de productregistratie betrekking
      op heeft;

      e. het (de) procesregistratiecertificaatnummer(s) waar het norm-produkt mee bereid wordt;

      f. een verklaring dat de productsamenstelling is gecontroleerd en dat deze voldoet aan het bij of krachtens de
      Statuten bepaalde (w.o. de Skal-normen);

      g. het nummer waaronder de aangeslotene alsmede het desbetreffende produkt bij de Stichting is geregistreerd;

      h. periode waarvoor het produktregistratiecertificaat geldig is; dit is maximaal één kalenderjaar;

      i. de datum van controle en eventueel keuring;

      j. de verplichting van de aangeslotene om de Stichting onverwijld in kennis te stellen van wijzigingen in de onder
      a, b, c, d of e bedoelde gegevens.

      2 Zolang zich geen wijzigingen hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan wordt
      telkenjare een nieuw produktregistratiecertificaat afgegeven. Het produktregistratiecertificaat is geldig voor
      de daarop vermelde periode en zolang zich geen wijzigingen van de op het certificaat vermelde gegevens hebben
      voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan.

      3 Het produktregistratiecertificaat wordt ondertekend en afgegeven door de directeur.

      4 Wijzigingen van de in het eerste lid onder a, b, c, d, of e bedoelde gegevens die leiden tot omstandigheden van
      zodanige aard dat, waren zij reeds aanwezig geweest ten tijde van de afgifte van het produktregistratiecertificaat,
      dit certificaat toen niet zou zijn verstrekt, maken het produktregistratiecertificaat ongeldig, waarmee
      het recht als bedoeld in artikel 12, zevende lid komt te vervallen. De houder is in dat geval verplicht het
      productregistratie-certificaat op eerste vordering aan de controleur af te geven, die het onder zich houdt tot de
      oorzaken van ongeldigheid zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel13
  - number: BI:14
    text: |-
      1 Het produktregistratiecertificaat wordt jaarlijks in origineel afgegeven aan de betrokken aangeslotene, die
      dit in zijn administratie dient te bewaren. Bij verlies vervallen de aan het registratiecertificaat te ontlenen
      rechten.

      2 Eén afschrift van het produktregistratiecertificaat wordt door de directeur gehouden. Deze kan meerdere
      afschriften maken en waarmerken.

      3 De aangeslotene dient er zorg voor te dragen dat iedere desbetreffende, in artikel 7, achtste lid bedoelde,
      producent dan wel bereider in het bezit is van een afschrift van het produktregistratiecertificaat en dit onder
      zich houdt overeenkomstig het bepaalde voor het desbetreffende procesregistratiecertificaat.

      4 Van de ongeldigheid van een produktregistratiecertificaat kan de directeur elke bij de Stichting bekende afnemer
      dan wel in lid 3 bedoelde producent/bereider van de desbetreffende aangeslotene op de hoogte stellen, onder
      mededeling dat het van het bedrijf van de betrokken aangeslotene afkomstige desbetreffende norm-produkt niet met
      de aanduidingen bedoeld in artikel 22 van dit reglement alsmede, indien van toepassing, het EKO-keurmerk in de
      handel gebracht mag worden. De directeur geeft daarvan een schriftelijke bevestiging. Zodra door de directeur is
      vastgesteld dat de oorzaak van de ongeldigheid is weggenomen, bericht hij dienovereenkomstig aan de voorbedoelde
      afnemers dan wel producent/bereider.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel14
  - number: BI:15
    text: |-
      De aangeslotene is verplicht:

      a. een zodanige administratie, schriftelijk of anderszins, bij te houden dat de controleur:

        - de oorsprong, de herkomst, de aard en de hoeveelheden alsmede het gebruik van alle aan een te onderscheiden
      eenheid geleverde produkten kan nagaan, alsmede,
        - de oorsprong, de herkomst, de aard, de hoeveelheden en de bestemmingen alsmede het gebruik van alle produkten die
      een te onderscheiden eenheid hebben verlaten kan nagaan, alsmede,
        - alle andere gegevens kan controleren die, naar mening van de controleur, voor een adequate controle van de
      behandelingen dan wel bereidingen nodig zijn, zoals de oorsprong, de aard en de hoeveelheden van de ingrediënten en
      de hulpstoffen voor fabricage die aan een te onderscheiden eenheid zijn geleverd en de samenstelling van de bereide
      norm-produkten;

      b. bij ontvangst van norm-produkten de sluiting van de verpakking of container en de aanwezigheid van de gegevens
      als bedoeld in artikel 22 te controleren. Het resultaat van deze controle moet expliciet in de administratie van de
      aangeslotene worden vermeld.

      Wanneer deze controle twijfel doet rijzen of het betrokken produkt wel afkomstig is van een marktdeelnemer die
      onder controle van een door Skal erkend controlesysteem valt, mag met de verwerking of de verpakking ervan slechts
      worden begonnen nadat uitsluitsel is verkregen;

      c. een administratie, schriftelijk of anderszins, bij te houden van de aard, de hoeveelheden, de financiële
      omzet en de bestemming (waar onder: naam en adres van de desbetreffende afnemers met vermelding van de data van
      aflevering) van alle verkochte produkten. De hoeveelheden dienen, wanneer zij betrekking hebben op de rechtstreekse
      verkopen aan de eindconsument, per dag per produkt te zijn samengesteld;

      d. door hem verhandelde norm-produkten vergezeld te doen gaan van een document dan wel te (doen) verpakken, een en
      ander overeenkomstig artikel 22 van dit reglement;

      e. te handelen overeenkomstig het gestelde in artikel 13, eerste lid, onder j;

      f. periodiek vóór de aan te geven datum de gevraagde gegevens aan de Stichting mee te delen, overeenkomstig het
      gestelde in artikel 4, eerste lid, van het Bijdrage-reglement.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel15
  - number: BI:16
    text: |-
      Wanneer in een te onderscheiden eenheid andere dan norm-produkten worden verwerkt, bereid, marktklaar gemaakt of
      opgeslagen:

      a. dient de te onderscheiden eenheid te beschikken over afzonderlijke ruimten voor de opslag van de normprodukten
      vóór en na de behandelingen;

      b. dient een partij ineens en zonder onderbreking worden behandeld en fysiek of in de tijd gescheiden te worden
      gehouden van gelijksoortige behandelingen betreffende niet norm-produkten;

      c. dienen genoemde behandelingen, indien zij niet frequent (minder dan één keer per vier weken) worden verricht,
      van te voren bij de Stichting gemeld te worden, met inachtname van een termijn van vier werkdagen;

      d. dienen alle maatregelen te worden genomen om ervoor te zorgen dat de partijen kunnen worden geïdentificeerd en
      dat vermenging met produkten die niet in overeenstemming met het bij of krachtens de Statuten bepaalde (w.o. de
      Skal-normen) zijn verkregen, wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel16
  - number: BI:17
    text: |-
      1 Een ieder die zich op de voet van het bepaalde in artikel 4, tweede lid, van de Statuten als aangeslotene uit
      hoofde van een erkenning op basis van de Skal-normen en een overeenkomst wenst aan te sluiten bij de Stichting,
      wordt onverminderd het bepaalde in de volgende leden, toegelaten als aangeslotene bij de Stichting zodra:

      a. hij zich met een daartoe strekkend verzoek schriftelijk tot het Bestuur van de Stichting heeft gewend en de
      directeur een door hem ondertekend aanmeldingsformulier met bijbehorende bijlagen heeft ontvangen;

      b. de importeursaansluitingsbijdrage als bedoeld in artikel 2, eerste lid, van het Bijdrage-reglement is betaald.

      2 Door ondertekening van het in het eerste lid bedoelde aanmeldingsformulier verklaart de betrokkene dat hij zich
      overeenkomstig het bepaalde in de Statuten en bij of krachtens deze vastgestelde reglementen, aan het toezicht
      van de Stichting zal onderwerpen en dat hij de verplichtingen genoemd in artikel 5 van de Statuten volledig en
      nauwkeurig zal nakomen.

      3 Zodra het in het eerste lid bedoelde ondertekende aanmeldingsformulier met bijbehorende bijlagen door de
      Stichting is ontvangen en aan het bepaalde in het eerste lid onder b is voldaan, bevestigt de directeur de
      betrokkene door middel van een importeursaansluitingscertificaat, dat hij als aangeslotene tot de Stichting is
      toegelaten als importeuraangeslotene. De aangeslotene wordt hiermee het recht verleend tot het invoeren van norm-
      produkten in de categorie als omschreven op het desbetreffende importeursaansluitingscertificaat, een en ander met
      inachtname van het gestelde in de overige Paragrafen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel17
  - number: BI:18
    text: |-
      1 Het importeursaansluitingscertificaat, bedoeld in artikel 17, derde lid, bevat:

      a. de naam en handelsnaam van de aangeslotene;

      b. adres en woonplaats of plaats van vestiging van aangeslotene;

      c. een aanduiding omtrent de produkten dan wel de produktgroepen waar de aansluiting betrekking op heeft;

      d. een verklaring dat de door de Stichting ontvangen gegevens omtrent het bedrijf van de aangeslotene zijn
      gecontroleerd en dat de volgens opgave op het bedrijf gehanteerde wijze van administreren en invoeren voldoet aan
      het bij of krachtens de Statuten bepaalde;

      e. het nummer waaronder de aangeslotene bij de Stichting is geregistreerd;

      f. periode waarvoor het importeursaansluitingscertificaat geldig is; dit is maximaal één kalenderjaar;

      g. de datum van controle van de door de Stichting ontvangen gegevens;

      h. de verplichting van de aangeslotene om de Stichting onverwijld in kennis te stellen van wijzigingen in de onder
      a, b, of c bedoelde gegevens, alsmede van wijzigingen in het bij de Stichting bekende administratieschema.

      2 Zolang zich geen wijzigingen hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan wordt
      telkenjare een nieuw importeursaansluitingscertificaat afgegeven.

      Het importeursaansluitingscertificaat is geldig voor de daarop vermelde periode en zolang zich geen wijzigingen
      van de op het certificaat vermelde gegevens hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde
      is voldaan.

      3 Het importeursaansluitingscertificaat wordt ondertekend en afgegeven door de directeur.

      4 Wijzigingen op het bedrijf dan wel in de administratie van de aangeslotene die leiden tot omstandigheden van
      dien aard dat, waren zij reeds aanwezig geweest ten tijde van de afgifte van het importeursaansluitingscertificaat,
      dit certificaat toen niet zou zijn verstrekt, maken het ongeldig, waarmee het recht als bedoeld in artikel 17,
      derde lid, komt te vervallen. De houder is in dat geval verplicht het importeursaansluitingscertificaat op eerste
      vordering aan de controleur af te geven, die het onder zich houdt tot de oorzaken van ongeldigheid zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel18
  - number: BI:19
    text: |-
      1 Het importeursaansluitingscertificaat wordt jaarlijks in origineel afgegeven aan de betrokken aangeslotene, die
      dit in zijn administratie dient te bewaren. Bij verlies vervallen de aan het registratiecertificaat te ontlenen
      rechten.

      2 Een afschrift van het importeursaansluitingscertificaat wordt door de directeur gehouden. Deze kan meerdere
      afschriften maken en waarmerken.

      3 Van de ongeldigheid van een importeursaansluitingscertificaat als bedoeld in artikel 18, vierde lid, kan de
      directeur elke bij de Stichting bekende afnemer van de desbetreffende aangeslotene op de hoogte stellen, onder
      mededeling dat van het bedrijf van de betrokken importeur afkomstige produkten niet met de aanduidingen bedoeld in
      artikel 22 van dit reglement alsmede, indien van toepassing, het EKO-keurmerk in de handel gebracht mogen worden.
      De directeur geeft daarvan een schriftelijke bevestiging. Zodra door de directeur is vastgesteld dat de oorzaak van
      de ongeldigheid is weggenomen, bericht hij dienovereenkomstig aan de voorbedoelde afnemers.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel19
  - number: BI:20
    text: |-
      De aangeslotene is verplicht:

      a. een zodanige administratie, schriftelijk of anderszins, bij te houden dat de controleur:

        - de oorsprong, de herkomst, de aard en de hoeveelheden alsmede het gebruik van alle ingevoerde produkten kan
      nagaan, alsmede,
        - de oorsprong, de herkomst, de aard, de hoeveelheden en de bestemmingen alsmede het gebruik van alle in de handel
      gebrachte ingevoerde produkten kan nagaan, alsmede,
        - zich ervan kan vergewissen dat voldaan is aan de bepalingen zoals gesteld bij of krachtens de Statuten bepaalde;
        - alle andere gegevens kan controleren die, naar mening van de controleur, voor een adequate controle van de invoer
      nodig zijn;

      b. bij ontvangst van norm-produkten de sluiting van de verpakking of container en de aanwezigheid van de gegevens
      als bedoeld in artikel 22 te controleren. Het resultaat van deze controle moet expliciet in de administratie van de
      aangeslotene worden vermeld.

      Wanneer deze controle twijfel doet rijzen of het betrokken produkt wel afkomstig is van een marktdeelnemer die
      onder controle van een door Skal erkend controlesysteem valt, mag met de verwerking of de verpakking ervan slechts
      worden begonnen nadat uitsluitsel is verkregen;

      c. een administratie, schriftelijk of anderszins, bij te houden van de aard, de hoeveelheden en de bestemming (waar
      onder: naam en adres van de desbetreffende leveranciers en afnemers met vermelding van de data van aflevering) van
      alle ingevoerde en in de handel gebrachte produkten. De hoeveelheden dienen, wanneer zij betrekking hebben op de
      rechtstreekse verkopen aan de eindconsument, per dag te zijn samengesteld;

      d. door hem verhandelde norm-produkten vergezeld te doen gaan van een document dan wel te verpakken; een en ander
      overeenkomstig artikel 22 van dit reglement;

      e. te handelen overeenkomstig het gestelde in artikel 18, eerste lid, onder h;

      f. periodiek vóór de aan te geven datum de gevraagde gegevens aan de Stichting mee te delen
      door het volledig en correct invullen van het productie-opgave-formulier, als bedoeld in
      [artikel 4, eerste lid, van het Bijdragereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018852
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018852
  - number: BI:21
    text: |-
      1 Elke natuurlijke of rechtspersoon die norm-produkten wil invoeren uit derde landen, zijnde niet EG-Lidstaten,
      dient zich overeenkomstig het gestelde in Paragraaf IV van dit reglement bij de Stichting aan te sluiten
      en als aangeslotene te zijn toegelaten, als bedoeld in artikel 4 van de Statuten, wat moet blijken uit een
      importeursaansluitingscertificaat, als bedoeld in artikel 17, derde lid.

      2 De aangeslotene, als bedoeld in het voorgaande lid, is verplicht al de door of namens hem ingevoerde norm-
      produkten, bij de Stichting te melden met behulp van het gestelde in het Invoeraanmeldingsformulier, welke te
      verkrijgen is bij de Stichting.

      3 Door ondertekening van het in het voorgaande lid bedoelde Invoeraanmeldingsformulier verklaart de betrokkene
      dat hij zich overeenkomstig het bepaalde in de Statuten en bij of krachtens deze vastgestelde reglementen, aan
      het toezicht van de Stichting zal onderwerpen en dat hij de verplichtingen genoemd in artikel 5 van de Statuten
      volledig en nauwkeurig zal nakomen.

      4 Iedere melding als bedoeld in het tweede lid wordt na ontvangst door de Stichting getoetst aan het bij of
      krachtens de Statuten bepaalde.

      De in dit lid bedoelde toetsing houdt in ieder geval een beoordeling in:

      a. van de juistheid en volledigheid van de verstrekte gegevens;

      b. of de desbetreffende partij:

        - is verkregen volgens een productiemethode waarbij gelijkwaardige regels worden toegepast zoals die vastgelegd
      zijn als bedoeld in de Statuten en de Skal-normen, en
        - is gecontroleerd in het kader van een controleregeling van een door Skal erkend controlesysteem.

      5 Binnen 2 werkdagen ontvangt de desbetreffende aangeslotene de beoordeling van de Stichting.

        - Bij een positieve beoordeling heeft de desbetreffende aangeslotene het recht de desbetreffende partij, met
      inachtname van de van toepassing zijnde artikelen van dit reglement (w.o. Paragraaf II en Paragraaf III), in te
      voeren en in de handel te brengen met de aanduidingen bedoeld in artikel 22 van dit reglement dan wel te verwerken
      alsmede, indien van toepassing, het EKO-keurmerk een en ander overeenkomstig het gestelde in artikel 22 van dit
      reglement.
        - Bij een negatieve beoordeling is het niet toegestaan de desbetreffende partij in te voeren en in de handel te
      brengen met aanduidingen die zouden kunnen suggereren dat de desbetreffende partij geproduceerd is overeenkomstig
      de bij of krachtens de Statuten vastgestelde regels. De desbetreffende aangeslotene zal in dit schrijven tevens
      gewezen worden op de mogelijkheid van aanvullende diensten van de Stichting.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel21
  - number: BI:22
    text: |-
      1 Door bij Skal aangeslotenen geproduceerde, bereide, marktklaar gemaakte dan wel met het oog op verhandeling
      ingevoerde norm-produkten, mogen slechts naar andere eenheden worden vervoerd dan wel in de handel worden gebracht
      in zodanig gesloten verpakkingen of containers dat de inhoud ervan niet kan worden vervangen en die voorzien zijn
      van een etiket, dan wel, indien dit laatste niet mogelijk is, vergezeld worden van een Skal-certificaat of Skal-
      bon. Op dit certificaat, deze bon dan wel etiket dienen in ieder geval de volgende gegevens te zijn vermeld:

      a. naam en adres van degene op wiens naam het desbetreffende bedrijfsaansluitingscertificaat dan wel
      productregistratiecertificaat staat, en dus verantwoordelijk is voor de laatst uitgevoerde productie, verwerking,
      bereiding of het marktklaar maken van het norm-produkt;

      b. de benaming van het norm-produkt;

      c. een aanduiding waaruit blijkt dat het produkt onder de in of krachtens de Statuten bedoelde controle valt: de
      naam van de Stichting, met daarachter het bedrijfsnummer waaronder de primaire-productie-aangeslotene dan wel de
      productaangeslotene bij de Stichting staat geregistreerd;

      d. een aanduiding waaruit de datum blijkt waarop de laatste handeling(en) van productie, verwerking, bereiding dan
      wel het marktklaar maken van het norm-produkt is (zijn) verricht.

      2 a. Verpakkingen, etiketten, labels en dergelijke waarop de aanduiding(en) als bedoeld in het eerste lid van dit
      artikel worden afgebeeld, dienen voor het drukken of anderszins vervaardigen schriftelijk te zijn goedgekeurd door
      de Stichting.

      b. Ontwerpen van de onder a bedoelde verpakkingen, etiketten, labels en dergelijke dienen tijdig aan de Stichting
      te worden toegezonden. De beoordeling door de Stichting neemt maximaal 1 werkdag in beslag, wanneer zij door de
      Stichting zijn ontvangen op werkdagen van maandag tot en met donderdag 15.00 uur.

      3 Het Skal-certificaat als bedoeld in het eerste lid dient door de verkoper vóór de levering bij de Stichting
      aangevraagd te worden.

      4 Op afleveringsbonnen, verkoop-, leveringsfacturen en andere begeleidende documenten dienen de norm-produkten
      aangeduid te worden met een verwijzing naar de biologische productiemethode overeenkomstig het bij of krachtens de
      Statuten bepaalde.

      5 Met betrekking tot produkten die gedeeltelijk zijn bereid uit ingrediënten die niet voldoen aan de in de
      Skal-normen genoemde voorwaarden, mag bij de verhandeling en in de reclame worden verwezen naar de biologische
      productiemethode (Skal-normen), indien:

      a. ten minste 50% van de ingrediënten van agrarische oorsprong voldoet aan de in de Skal-normen genoemde
      voorwaarden voor een norm-produkt of voldoet aan de bij of krachtens het Besluit vastgestelde voorwaarden;

      b. het produkt als ingrediënten van niet-agrarische oorsprong geen andere dan in de Skal-normen toegestane stoffen
      bevat;

      c. het produkt of de ingrediënten ervan tijdens de bereiding niet zijn behandeld met ioniserende stralen of met
      andere stoffen dan toegestaan volgens de Skal-normen;

      d. de aanduidingen met betrekking tot de biologische productiemethode of de Skal-normen slechts voorkomen in
      de lijst van ingrediënten als bedoeld in [Richtlijn 79/112/EEG](31979L0112) (PbEG 1979, L33, zoals sindsdien
      gewijzigd) en duidelijk slechts verwijzen naar die ingrediënten die volgens de methoden, bedoeld in de Skal-normen
      zijn geproduceerd;

      e. deze aanduidingen in de lijst van ingrediënten niet afwijkend zijn van kleur, lettergrootte en lettertype;

      f. aan de bij of krachtens de Statuten vastgestelde voorwaarden voor norm-produkten is voldaan.

      6 Met betrekking tot de in het voorgaande lid bedoelde produkten, mag bij de verhandeling en in de reclame nimmer
      worden verwezen naar het EKO-keurmerk.
