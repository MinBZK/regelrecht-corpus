  - number: '9'
    text: |-
      Een aanvraag tot subsidieverlening kan slechts worden ingediend, indien de aanvrager op het tijdstip van het
      indienen van de aanvraag tot subsidieverlening voor de betrokken percelen niet reeds een subsidie is verleend op
      grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel9
  - number: '10'
    text: |-
      1 De subsidie wordt ten hoogste gedurende vijf jaren verleend.

      2 De subsidie wordt verleend op basis van de gegevens van het bouwplan van het jaar van indienen van de aanvraag in
      combinatie met het biologisch teeltplan.

      3 De subsidie bedraagt voor gewassen die op het tijdstip van indienen van de aanvraag nog niet als biologische
      producten kunnen worden afgezet, met uitzondering van veevoedergewassen, ten hoogste:

      a. € 226,89 per jaar per hectare:

      1º. akkerbouwgewas;

      2º. hazelaars;

      3º. doperwten;

      4º. knolselderij, voor zover de geteelde oppervlakte groter of gelijk is aan één hectare;

      5º. schorseneren;

      6º. spinazie, voor zover de geteelde oppervlakte groter of gelijk is aan twee hectaren;

      7º. spruitkool;

      8º. stamsperziebonen (groen), voor zover de geteelde oppervlakte groter of gelijk is aan anderhalve hectare;

      9º. tuinbonen, voor zover de geteelde oppervlakte groter of gelijk is aan anderhalve hectare;

      10º. was- en bospeen, voor zover de geteelde oppervlakte groter of gelijk is aan een halve hectare;

      11º. winterpeen, voor zover de geteelde oppervlakte groter of gelijk is aan anderhalve hectare, of

      12º. witlofwortel;

      13º. kruiden, voor zover de geteelde oppervlakte groter of gelijk is aan twee hectare.

      b. € 1.134,45 per jaar per hectare tuinbouw, met uitzondering van de in onderdeel a genoemde gewassen of
      gewasgroepen, zwarte bes of zure kers, en

      c. € 1.361,34 per jaar per hectare fruitteelt, met uitzondering van de in onderdelen a en b genoemde gewassen of
      gewasgroepen.

      4 De subsidie bedraagt voor veevoedergewassen en voor gewassen die op het tijdstip van indienen van de aanvraag als
      biologische producten kunnen worden afgezet:

      a. € 181,51 per hectare in het eerste jaar,

      b. € 158,82 per hectare in het tweede jaar,

      c. € 136,13 per hectare in het derde jaar,

      d. € 113,45 per hectare in het vierde jaar,

      e. € 90,76 per hectare in het vijfde jaar, van de vijfjarige periode waarin de verplichtingen, bedoeld
      in [artikel 5, tweede lid][ref1], gelden, met dien verstande dat de subsidie ten hoogste € 22.689,01 per
      landbouwbedrijf bedraagt en, indien dit bedrag zou worden overschreden, de onder a tot en met e genoemde
      vergoedingen naar evenredigheid worden verminderd.

      5 Geen subsidie wordt verleend indien het subsidiebedrag minder dan € 4.537,80 zou bedragen.

      6 De subsidieontvanger dient vóór het einde van elk verplichtingenjaar van de periode van vijf jaar, genoemd in
      [artikel 5, eerste lid][ref2], bij Dienst Regelingen middels een daartoe vastgesteld formulier een aanvraag tot
      subsidievaststelling in voor het betrokken verplichtingenjaar.

      7 Bij een besluit als bedoeld in [artikel 14, eerste lid][ref3], stelt de minister de subsidiebedragen vast voor
      gewassen die op het tijdstip van het indienen van de aanvraag nog niet als biologische producten kunnen worden
      afgezet, met uitzondering van veevoedergewassen.

      8 De minister stelt de subsidie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006677#Artikel5
