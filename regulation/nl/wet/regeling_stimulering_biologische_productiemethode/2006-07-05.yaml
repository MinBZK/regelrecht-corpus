  - number: 14a
    text: |-
      1 Gelijktijdig met de vaststelling van een subsidieplafond stelt de minister, bij in de Staatscourant bekend te
      maken besluit, de wijze van verdeling van het beschikbare bedrag vast op basis van:

      a. de volgorde van de datum van ontvangst van de aanvragen door Dienst Regelingen, of

      b. een beoordeling van de mate waarin de desbetreffende subsidieaanvraag bijdraagt aan het bereiken van de
      doelstellingen van de regeling.

      2 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel a, en door toewijzing van de aanvragen
      tot subsidieverlening met dezelfde datum van ontvangst het subsidieplafond zou worden overschreden, geschiedt de
      rangschikking door middel van een loting verricht door een notaris van de op dezelfde dag ontvangen aanvragen. De
      loting geschiedt door een door de minister of Dienst Regelingen aan te wijzen notaris.

      3 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel b, stelt de minister tevens de criteria
      vast aan de hand waarvan de beoordeling van de aanvraag tot subsidieverlening zal plaatsvinden, alsmede de rangorde
      van die criteria en de onderlinge wegingsfactoren. Tot de criteria kunnen in ieder geval behoren:

      a. de doelmatigheid van de subsidieinzet bij het omschakelende bedrijf;

      b. de continuïteit en de economische perspectieven van het bedrijf, waarbij de volgende

      elementen mede bepalend kunnen zijn:

        - het opleidingsniveau of de vakbekwaamheid van de subsidieontvanger;
        - de aanwezigheid van mogelijkheden voor de afzet van biologisch geproduceerde producten;

      c. de financiële levensvatbaarheid van het bedrijf;

      d. de betekenis van het bedrijf voor de instandhouding en verbetering van de natuurwaarden en de biodiversiteit op
      bedrijfsniveau, lokaal, regionaal of nationaal niveau;

      e. de betekenis van het bedrijf voor de ontwikkeling van de biologische landbouw op lokaal, regionaal of nationaal
      niveau;

      f. de omvang van het om te schakelen areaal;

      g. de gewasgroep, groepen van gewassen of productierichting;

      h. de betekenis van het omschakelende bedrijf voor de diversificatie van de biologische bedrijvigheid op lokaal,
      regionaal of nationaal niveau;

      i. het stadium van omschakeling van bedrijven onderscheidenlijk productierichtingen.

      4 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel b, zal, indien noodzakelijk, de nadere
      rangorde van de aanvragen worden vastgesteld overeenkomstig het eerste lid, onderdeel a.

      5 De minister kan één of meer adviseurs, als bedoeld in [afdeling 3.3 van de Algemene wet bestuursrecht][ref1],
      belasten met de advisering ten aanzien van de subsidieaanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.3
