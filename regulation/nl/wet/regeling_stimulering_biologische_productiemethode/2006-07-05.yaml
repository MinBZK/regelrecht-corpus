    text: |-
      1 Het procesregistratiecertificaat bevat:

      a. de naam en handelsnaam van de aangeslotene;

      b. adres en woonplaats of plaats van vestiging van aangeslotene;

      c. een aanduiding omtrent het type proces waar de aansluiting betrekking op heeft;

      d. een verklaring dat het bedrijf/proces van de aangeslotene is gecontroleerd en dat de op het bedrijf gebezigde
      productiewijze voldoet aan het bij of krachtens de Statuten bepaalde (w.o. de Skal-normen);

      e. het bedrijfsnummer waaronder de aangeslotene alsmede het procesnummer waaronder het proces bij de Stichting
      is geregistreerd;

      f. periode waarvoor het procesregistratiecertificaat geldig is; dit is maximaal één kalenderjaar;

      g. de datum van controle en keuring;

      h. de verplichting van de aangeslotene om de Stichting onverwijld in kennis te stellen van wijzigingen in de onder
      a, b, of c bedoelde gegevens, alsmede van wijzigingen in bij de Stichting bekende omvang van het bedrijf, locatie
      van de productie en proces-schema.

      2 Zolang zich geen wijzigingen hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan wordt
      telkenjare een nieuw procesregistratiecertificaat afgegeven.

      Het procesregistratiecertificaat is geldig voor de daarop vermelde periode en zolang zich geen wijzigingen van de
      op het certificaat vermelde gegevens hebben voorgedaan en aan het bij of krachtens de Statuten bepaalde is voldaan.

      3 Het procesregistratiecertificaat wordt ondertekend en afgegeven door de directeur.

      4 Wijzigingen op het bedrijf dan wel van het proces van de aangeslotene die leiden tot omstandigheden van dien
      aard dat, waren zij reeds aanwezig geweest ten tijde van de afgifte van het procesregistratiecertificaat, dit
      certificaat toen niet zou zijn verstrekt, maken het ongeldig, waarmee het recht als bedoeld in artikel 7, achtste
      lid, komt te vervallen. De houder is in dat geval verplicht het procesregistratiecertificaat op eerste vordering
      aan de controleur af te geven, die het onder zich houdt tot de oorzaken van ongeldigheid zijn weggenomen.
