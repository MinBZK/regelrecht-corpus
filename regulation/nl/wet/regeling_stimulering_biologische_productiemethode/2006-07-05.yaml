  - number: '6'
    text: |-
      1 Indien de subsidieontvanger vóór de afloop van de periode waarin de verplichtingen, bedoeld in
      [artikel 5, tweede lid][ref1], gelden, één of meer percelen waarop het biologisch teeltplan betrekking heeft,
      verkoopt, verpacht of daarop een gebruiksrecht vestigt, kan de bedrijfsopvolger zich er tegenover de minister toe
      verbinden de verplichtingen voortvloeiend uit de subsidieverlening verder na te komen.

      2 Voor de toepassing van deze regeling wordt de bedrijfsopvolger die de in het eerste lid bedoelde verbintenis
      aangaat, vanaf het moment dat deze verbintenis is aangegaan, aangemerkt als de subsidieontvanger.

      3 [Artikel 3, eerste lid, onderdelen b en c][ref2], alsmede het tweede en derde lid, zijn van overeenkomstige
      toepassing.

      4 Indien de bedrijfsopvolger de in het eerste lid bedoelde verbintenis niet aangaat, wordt de subsidieverlening
      ingetrokken voor de betrokken percelen. [Artikel 12, vierde lid][ref3], is van overeenkomstige toepassing, tenzij:

      a. de subsidieontvanger de op de betrokken percelen betrekking hebbende verplichtingen reeds drie jaren is
      nagekomen,

      b. de subsidieontvanger zijn landbouwactiviteiten definitief beëindigt en

      c. overname van deze verbintenis niet te verwezenlijken valt.


      [ref1]: https://wetten.overheid.nl/BWBR0006677#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006677#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006677#Artikel12
