preamble:
  text: |-
    Gelet op verordening (EEG) nr. 2078/92 van de Raad van 30 juni 1992 betreffende landbouwproduktiemethoden die
    verenigbaar zijn met de eisen inzake milieubescherming, en betreffende natuurbeheer (PbEG L 215), als ook gelet op
    de artikelen 15 en 19 van de Landbouwwet;

    Gezien het advies van het Landbouwschap, het Hoofdproduktschap voor Akkerbouwprodukten, de Vereniging Biologisch
    Dynamische Landbouw, de Stichting Biologica, de Stichting Skal en Platform Biologische Landbouw en Voeding;

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikking nr. C(94)543 van 29 april
    1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b

              *Dienst Regelingen:*


              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c

              *stichting Skal:*


              controle-instelling belast met het toezicht op de naleving van het bij of krachtens het
      Landbouwkwaliteitsbesluit biologische productiemethode bepaalde;



            d

              *landbouwtelling:*


              landbouwtelling als bedoeld in [artikel 24 van de Landbouwwet][ref1];



            e

              *veevoedergewassen:*


              blijvend grasland, corn cob mix, luzerne, snijmaïs en andere snijgranen, tijdelijk grasland, veldbonen,
      voederbiet en zonnebloem;



            f

              *landbouwbedrijf:*


              in Nederland gevestigd bedrijf waarop blijkens de gegevens van de landbouwtelling of het bouwplan van het
      jaar van indienen van de aanvraag, een of meer van de navolgende productierichtingen plaatsvindt:
              akker- en vollegrondstuinbouw, met inbegrip van de teelt van veevoedergewassen,
      glastuinbouw of
      fruitteelt;



            g

              *pacht:*


              recht dat wordt ontleend aan een door de grondkamer goedgekeurde overeenkomst als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Pachtwet][ref2], welke is aangegaan voor ten minste de wettelijke
      termijn;



            h

              *verordening (EG) nr. 1257/1999:*


              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van 17 mei 1999 inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
      instelling van een aantal verordeningen (PbEG L 160);



            i

              *verordening (EEG) nr. 2078/92:*


              [verordening (EEG) nr. 2078/92](31992R2078) van de Raad van 30 juni 1992 betreffende
      landbouwproductiemethoden die verenigbaar zijn met de eisen inzake milieubescherming, en betreffende natuurbeheer
      (PbEG L 215);.



            j
            rechtspersoon:

              rechtspersoon, anders dan een publiekrechtelijke rechtspersoon;



            k
            biologische productiemethode:

              productiemethode als bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische productiemethode][ref3];



            l

              *biologische teelt van veevoedergewassen:*


              voortbrenging van veevoedergewassen overeenkomstig de voorschriften van [bijlage 1 van de
      Landbouwkwaliteitsregeling biologische productiemethode](onbekend) met uitzondering van onderdeel A. 1;



            m

              *biologisch teeltplan:*


              door de stichting Skal goedgekeurd plan waarin voor alle percelen van het landbouwbedrijf waarvoor de
      verplichtingen worden aangegaan, de wijze waarop omschakeling naar dan wel de voortzetting van de toepassing van de
      biologische productiemethode of de uitoefening van de biologische teelt van veevoedergewassen wordt aangegeven;



            n

              *Controlereglement Skal-controle:*


              Controlereglement Skal-controle zoals vastgesteld door het bestuur van de stichting Skal en opgenomen in
      [bijlage 1][ref4];



            o

              *bedrijfsaansluitingsbevestiging:*


              bedrijfsaansluitingsbevestiging als bedoeld in artikel 2, derde lid, van het Controlereglement biologische
      productiemethode onderscheidenlijk artikel 2, derde lid, van het Controlereglement Skal-controle van de stichting
      Skal;



            p

              *bedrijfsaansluitingscertificaat:*


              bedrijfsaansluitingscertificaat als bedoeld in artikel 2, achtste lid, van het Controlereglement
      biologische productiemethode onderscheidenlijk artikel 2, achtste lid, van het Controlereglement Skal-controle van
      de stichting Skal;



            q

              *bouwplan:*


              het plan waarin voor het landbouwbedrijf een overzicht is gegeven van het soort gewas dat per perceel wordt
      geteeld;



            r
             goede landbouwpraktijken:

              de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn
      en hygiëne, hetgeen omvat de geldende normen bij of krachtens de [Wet milieubeheer][ref5], de
      [Wet verontreiniging oppervlaktewater][ref6], de [Meststoffenwet][ref7], de [Wet bodembescherming][ref8],
      de [Bestrijdingsmiddelenwet 1962][ref9], de [Gezondheids- en welzijnswet voor dieren][ref10], de
      [Diergeneesmiddelenwet][ref11] en de [Plantenziektenwet][ref12];



            s
            biologische landbouwer:

              degene die enige vorm van akkerbouw, veehouderij en tuinbouw – daaronder begrepen fruitteelt en het kweken
      van bomen, planten, bloemen en bloembollen – met inachtneming van de biologische productiemethode uitoefent;



            t
            aangeslotene:

              biologische landbouwer die op grond van
      [artikel 4, eerste lid, van het Landbouwkwaliteitsbesluit biologische produktiemethode][ref13] is aangesloten bij
      de Stichting Skal.


