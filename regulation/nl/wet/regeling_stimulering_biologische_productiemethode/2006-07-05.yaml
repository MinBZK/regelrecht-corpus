  - number: BI:6
    text: |-
      1 De productie van norm-producten moet plaatsvinden in een eenheid waarvan de percelen en de productie- en
      opslagplaatsen duidelijk zijn gescheiden van die van ieder andere eenheid die niet overeenkomstig het bij of
      krachtens de Statuten bepaalde (w.o. de Skal-normen) produceert; deze eenheid kan werkplaatsen voor verwerking en
      of marktklaar maken omvatten, wanneer deze eenheid zich beperkt tot de verwerking en of het marktklaar maken van
      haar eigen productie.

      2 In de eenheid waar norm-producten zijn opgeslagen mogen geen andere producten worden opgeslagen dan die welke op
      grond van het bij of krachtens de Statuten bepaalde (w.o. de Skal-normen) mogen worden gebruikt.

      3 Wanneer een aangeslotene in hetzelfde gebied meer dan één productie-eenheid beheert, vallen de eenheden in het
      gebied waar andere dan norm-producten worden geproduceerd, ook onder de controle voor wat betreft het in artikel 2,
      vijfde lid onder a en b, artikel 5 en het tweede lid van dit artikel bepaalde. In die eenheden mogen geen producten
      worden geproduceerd van hetzelfde type en ras, als die niet visueel te onderscheiden zijn van die welke in de in
      artikel 2, vijfde lid, bedoelde eenheid worden geproduceerd.
