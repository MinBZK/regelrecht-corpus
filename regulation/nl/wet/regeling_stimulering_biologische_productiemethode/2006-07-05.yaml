  - number: BI:25
    text: |-
      1 Tegen een door of namens de Stichting genomen eerste beslissing tot ongeldigverklaring, een afkeuring of
      ontzegging van het recht de aanduidingen bedoeld in artikel 22 van dit reglement en/of het EKO-keurmerk aan te
      brengen of te voeren, kan bezwaar worden gemaakt.

      2 Op het bezwaar wordt uitspraak gedaan door een hoofdcontroleur van de Stichting of door een door hem aangewezen
      assistent-hoofdcontroleur, behoudens het bepaalde in lid 3.

      3 Indien een hoofdcontroleur direct betrokken is geweest bij de beslissing, waartegen bezwaar wordt gemaakt, wordt
      op het bezwaar uitspraak gedaan door de directeur van de Stichting of een door hem aangewezen persoon.

      4 Het bezwaar wordt ingesteld door aan de functionaris die de controle verrichtte, of aan de hoofdcontroleur ten
      spoedigste schriftelijk mededeling te doen, dat een controle na bezwaar gewenst wordt.

      5 Indien het bezwaar wordt ingesteld bij de functionaris, die de controle verrichtte, dient deze zich zo spoedig
      mogelijk met de hoofdcontroleur in verbinding te stellen om een uitspraak op het bezwaar te verkrijgen.

      6 Degene die bezwaar instelt, kan verplicht worden een cautie te storten, welke aan de Stichting vervalt, indien op
      het bezwaar afwijzend wordt beslist. De directeur van de Stichting stelt de hoogte van de cautie vast.

      7 Indien op het bezwaar afwijzend is beslist, kan tegen deze beslissing beroep worden ingesteld bij de
      beroepscommissie van de Stichting.

      8 In geval de beroepscommissie van de Stichting zich geheel of deels met de beroepsgrond(en) kan verenigen, zal
      daarvan aan de betrokken functionarissen, en voor zover nodig, aan andere functionarissen van de Stichting in de
      vorm van instructies mededeling worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel25
