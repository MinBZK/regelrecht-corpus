  - number: 6a
    text: |-
      1 Indien de subsidieontvanger gedurende de periode waarin zijn verplichtingen gelden in het biologisch
      teeltplan opgenomen percelen ruilt in het kader van een project op grond van de [Landinrichtingswet][ref1], de
      [Reconstructiewet Midden-Delfland][ref2], de Herinrichtingswet Oost-Groninger, en Gronings-Drentse Veenkoloniën
      of de Regeling reconstructie oude glastuinbouwgebieden, komt hij de verplichtingen ten aanzien van deze percelen
      verder na op de nieuw verkregen, gelijkwaardige, percelen, met dien verstande dat de verplichtingenperiode van vijf
      jaar ter zake opnieuw begint op het tijdstip van verkrijging van de nieuwe percelen.

      2 Indien de oppervlakte van de nieuw verkregen percelen meer dan 10% kleiner is dan de oppervlakte van de geruilde
      percelen, wordt de subsidie naar evenredigheid verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003094
      [ref2]: https://wetten.overheid.nl/BWBR0003094
    url: https://wetten.overheid.nl/BWBR0006677/2006-07-05#Artikel6a
