        artikel: '2'
  - number: '1.3'
    text: |-
      De woonplaats en het adres van de houder worden niet vermeld in de reisdocumenten, bedoeld in
      [artikel 2 van de wet][ref1] en in [artikel 1.2][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel1.3
