  - number: '2.10'
    text: >-
      1 Het verstrekken van een nooddocument kan uitsluitend geschieden voor een aanvrager ten aanzien van wie voldoende
      aannemelijk is dat zijn reis geen uitstel gedoogt, en die niet in staat moet worden geacht op tijd een ander geldig
      reisdocument of Nederlandse identiteitskaart te verkrijgen.


      2 Van de aanvrager kan worden verlangd, dat hij reisbescheiden overlegt waaruit de spoedeisendheid van zijn reis
      kan worden afgeleid, zoals vlieg-, boot-, trein- of bus tickets, hotelreserveringen en reisverzekeringen.


      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de verificatie van de identiteit,
      nationaliteit en verblijfsrechtelijke positie van de aanvrager en over de situaties waarin een noodpaspoort dan wel
      een laissez-passer wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.10
  - number: '2.11'
    text: >-
      1 Een noodpaspoort is geldig:


      a. voor één jaar of zoveel korter als mogelijk, afhankelijk van de duur van de reis, alsmede van de door het land
      van bestemming en de landen van doorreis vereiste minimale geldigheid van het reisdocument na binnenkomst, dan wel
      vertrek van de houder; en


      b. voor alle landen.


      2 Een laissez-passer is geldig:


      a. voor één jaar of zoveel korter als mogelijk, afhankelijk van de duur van de reis, alsmede van de door het land
      van bestemming en de landen van doorreis vereiste minimale geldigheid van het reisdocument na binnenkomst, dan wel
      vertrek van de houder; en


      b. voor het land van bestemming en de landen waarvan de houder op zijn doorreis de grens passeert.


      3 Indien de verstrekking van het laissez-passer geschiedt ten behoeve van een niet-Nederlander, omvat de
      territoriale geldigheid nooit het land waarvan de houder de nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 Aan een staatloze persoon die op grond van de [Wet betreffende de positie van Molukkers][ref1] als Nederlander
      wordt behandeld, wordt op zijn verzoek een faciliteitenpaspoort verstrekt.

      2 [Artikel 2.1][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003052
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.12
