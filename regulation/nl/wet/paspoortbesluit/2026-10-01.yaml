  - number: '10.2'
    text: Deze algemene maatregel van rijksbestuur wordt aangehaald als «Paspoortbesluit».
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel10.2
  - number: '10.3'
    text: >-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel10.3
