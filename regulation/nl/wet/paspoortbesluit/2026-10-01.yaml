        paragraaf: '1'
  - number: '1.4'
    text: Noodpaspoorten en laissez-passers worden niet voorzien van vingerafdrukken van de houder.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel1.4
  - number: '1.5'
    text: >-
      Het burgerservicenummer van de houder wordt vermeld in het nationaal paspoort, het faciliteitenpaspoort en het
      tweede paspoort, tenzij aan de houder geen burgerservicenummer is toegekend.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel1.5
  - number: '1.7'
    text: |-
      De werkzaamheden op grond van de [wet][ref1] en de daarop berustende bepalingen worden uitgevoerd door bevoegde en
      gekwalificeerde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel1.7
