  - number: '2.1'
    text: |-
      1 Voor het verkrijgen van de nodige zekerheid over de identiteit van de aanvrager, alsmede over zijn
      Nederlanderschap dan wel zijn behandeling als Nederlander, indien het een persoon betreft op wie de
      [Wet betreffende de positie van Molukkers][ref1] van toepassing is, wordt gebruik gemaakt van het door de
      aanvrager overgelegde Nederlandse reisdocument of de door de aanvrager overlegde Nederlandse identiteitskaart, de
      door de aanvrager bij de aanvraag verstrekte gegevens, alsmede van de in de basisadministratie dan wel de in het
      basisregister reisdocumenten opgenomen gegevens of van overige bij de tot uitreiking bevoegde autoriteit aanwezige
      documenten, waaronder in ieder geval worden verstaan documenten in verband met eerdere aanvragen van reisdocumenten
      of Nederlandse identiteitskaarten.

      2 Indien onzekerheid bestaat over de identiteit dan wel over het Nederlanderschap van de aanvrager wordt daarnaar
      een gericht onderzoek ingesteld. Dit onderzoek omvat zoveel mogelijk verificatie van de identiteit dan wel de
      nationaliteit met behulp van door de aanvrager over te leggen documenten die zijn afgegeven door een bevoegde
      autoriteit, waaronder zijn geboorteakte, reisdocumenten of Nederlandse identiteitskaarten die op zijn naam zijn
      gesteld, dan wel buitenlandse reisdocumenten waarin hij staat vermeld en eventuele andere bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: '2.2'
    text: >-
      1 Het nationaal paspoort is geldig voor tien jaren en voor alle landen. Indien de aanvrager bij de aanvraag de
      leeftijd van achttien jaar nog niet heeft bereikt, is het nationaal paspoort geldig voor vijf jaren en voor alle
      landen.


      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het nationaal paspoort
      worden opgenomen, bedraagt de geldigheidsduur van het nationaal paspoort één jaar.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 De vaststelling van een aanspraak op verstrekking van een diplomatiek paspoort of een dienstpaspoort geschiedt
      door Onze Minister van Buitenlandse Zaken, met gebruikmaking van de gegevens die door de aanvrager bij de aanvraag
      zijn verstrekt.

      2 Tot de uitreiking van een diplomatiek paspoort of een dienstpaspoort wordt slechts overgegaan indien
      de aanvrager beschikt over een op de aanvrager betrekking hebbend geldig document als bedoeld in
      [artikel 1, eerste lid, onderdeel 1°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '2.4'
    text: >-
      1 De geldigheid van een diplomatiek paspoort of een dienstpaspoort wordt bij elke verstrekking afzonderlijk
      vastgesteld door Onze Minister van Buitenlandse Zaken, met een maximale geldigheid van tien jaar. Indien de
      aanvrager bij de aanvraag de leeftijd van achttien jaar nog niet heeft bereikt, wordt de geldigheid vastgesteld op
      maximaal vijf jaar.


      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het paspoort kunnen
      worden opgenomen, wordt de geldigheidsduur vastgesteld met een maximale geldigheid van een jaar.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.4
  - number: '2.5'
    text: >-
      1 De vaststelling van een aanspraak op plaatsing van een dienstpaspoortclausule in een nationaal paspoort, waardoor
      dat paspoort tijdelijk de status van een dienstpaspoort verkrijgt, geschiedt door Onze Minister van Buitenlandse
      Zaken, met gebruikmaking van de gegevens die door de aanvrager bij de aanvraag zijn verstrekt.


      2 De geldigheidsduur van een dienstpaspoortclausule mag de geldigheidsduur van het nationaal paspoort waarin deze
      wordt aangebracht, niet overschrijden.


      3 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de dienstenpaspoortclausule in het
      nationale paspoort wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 De vaststelling van het recht op een reisdocument voor vluchtelingen als bedoeld in [artikel 11 van de wet][ref1]
      geschiedt op grond van de gegevens die over het verblijfsrecht en de nationaliteit van de aanvrager in de
      basisadministratie, dan wel in het daarvoor bestemde aanvraag-informatieformulier zijn opgenomen, alsmede aan de
      hand van het door de aanvrager overgelegde verblijfsdocument waaruit diens nationaliteit blijkt, en:

      a. waaruit diens verblijfsrecht ingevolge [artikel 28][ref2] of [33 van de Vreemdelingenwet 2000][ref3] blijkt; of

      b. waaruit diens verblijfsrecht ingevolge [artikel 12a van de Wet toelating en uitzetting BES][ref4] blijkt.

      2 De vaststelling van het recht op een reisdocument voor vreemdelingen als bedoeld in [artikel 13 van de wet][ref5]
      geschiedt op grond van de gegevens die over het verblijfsrecht en de staatloosheid van de aanvrager in de
      basisadministratie, dan wel in het daarvoor bestemde aanvraag-informatieformulier zijn opgenomen, alsmede aan de
      hand van het door de aanvrager overgelegde verblijfsdocument, waaruit het gegeven van diens staatloosheid blijkt,
      en:

      a. waaruit diens verblijfsrecht ingevolge [artikel 14][ref6] of [20 van de Vreemdelingenwet 2000][ref7] blijkt, of

      b. waaruit diens toelating als staatloze in de openbare lichamen blijkt.

      3 Indien de in de basisadministratie, dan wel in het aanvraag-informatieformulier opgenomen gegevens afwijken van
      de gegevens die zijn vermeld in het door de aanvrager overgelegde verblijfsdocument dan wel anderszins onzekerheid
      bestaat over deze gegevens, wordt daarnaar een gericht onderzoek ingesteld waarbij de gegevens die over het
      verblijfsrecht en de nationaliteit dan wel staatloosheid van de aanvrager in de vreemdelingenadministratie zijn
      opgenomen, mede worden betrokken.

      4 Onze Minister stelt nadere regels over het aanvraag-informatieformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel33
