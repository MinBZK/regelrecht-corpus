  - number: '7.1'
    text: |-
      1 Een reisdocument wordt, naast het in [artikel 42, vierde lid, van de wet][ref1] gestelde, ook terstond definitief
      aan het verkeer onttrokken door de daartoe op grond van [artikel 57 van de wet][ref2] bevoegde autoriteit die het
      document onder zich heeft, indien:

      a. het daartoe, al dan niet bij de uitreiking van een nieuw reisdocument of een vervangende Nederlandse
      identiteitskaart als bedoeld in [artikel 12 van de Wet op de Nederlandse identiteitskaart][ref3], is ingeleverd;

      b. het vervallen is verklaard dan wel ingevolge [artikel 54, eerste lid, van de wet][ref4] is ingehouden, tenzij
      nog een beroepstermijn open staat, een beroepsprocedure aanhangig is of het reisdocument anderszins in een
      gerechtelijke procedure nodig is;

      c. het na uitreiking als onbruikbaar is beschouwd ten gevolge van misdruk of verkeerde personalisatie en
      dientengevolge is ingehouden of ingeleverd;

      d. het als gevonden reisdocument is ontvangen, tenzij:

      1°. de gezaghebber in de gelegenheid is het terug te geven aan de in de basisadministratie als ingezetene van zijn
      openbaar lichaam ingeschreven houder die nog geen verklaring als bedoeld in [artikel 31 van de wet][ref5] heeft
      afgelegd; of

      2°. Onze Minister van Buitenlandse Zaken of de commandant, bedoeld in [artikel 4.5][ref6], in de gelegenheid is het
      terug te geven aan de houder, die nog geen verklaring als bedoeld in [artikel 31 van de wet][ref7] heeft afgelegd.

      2 Het eerste lid, aanhef en onderdeel c, is niet van toepassing op onttrekking aan het verkeer van een op
      grond van [artikel 16, eerste lid, van de wet][ref8] verstrekt laissez-passer door de commandant, bedoeld in
      [artikel 4.5][ref9].

      3 In afwijking van het eerste lid, aanhef en onderdeel d, onttrekt de commandant, bedoeld in [artikel 4.5][ref10],
      een noodpaspoort of een op grond van [artikel 16, eerste lid, van de wet][ref11] verstrekt laissez-passer terstond
      definitief aan het verkeer, indien het als gevonden reisdocument is ontvangen.

      4 Onverminderd het bepaalde in het eerste lid, onttrekt de Gouverneur een Nederlandse identiteitskaart die hij onder
      zich heeft, naast het gestelde in [artikel 27, vierde lid, van de Wet op de Nederlandse identiteitskaart][ref12],
      ook terstond definitief aan het verkeer, indien:

      a. het daartoe, al dan niet bij de uitreiking van een nieuw reisdocument, is ingeleverd;

      b. het ingevolge [artikel 37, eerste lid, van de Wet op de Nederlandse identiteitskaart][ref13] is ingehouden,
      tenzij nog een beroepstermijn open staat, een beroepsprocedure aanhangig is of het reisdocument anderszins in een
      gerechtelijke procedure nodig is;

      c. het na uitreiking als onbruikbaar is beschouwd ten gevolge van misdruk of verkeerde personalisatie en
      dientengevolge is ingehouden of ingeleverd;

      d. het als gevonden Nederlandse identiteitskaart is ontvangen.

      5 Bij ministeriële regeling worden nadere regels gesteld over de wijze van onttrekking aan het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel42
