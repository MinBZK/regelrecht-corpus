  - number: '2.9'
    text: |-
      1 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor onbepaalde tijd als bedoeld in [artikel 20 van de Vreemdelingenwet 2000][ref1] of als bedoeld in
      [artikel 6 van de Wet toelating en uitzetting BES][ref2], dan wel over een overeenkomstige verblijfsvergunning
      in Aruba, Curaçao of Sint Maarten, is geldig voor vijf jaren en voor alle landen, met uitzondering van het land
      waarvan de houder de nationaliteit bezit.

      2 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3], dan wel als bedoeld in
      [artikel 6 van de Wet toelating en uitzetting BES][ref4], dan wel over een overeenkomstige verblijfsvergunning in
      Aruba, Curaçao of Sint Maarten, is geldig:

      a. tot de datum waarop de geldigheidsduur van de verblijfsvergunning eindigt, met een maximale geldigheidsduur van
      vijf jaren; en

      b. voor alle landen, met uitzondering van het land waarvan de houder de nationaliteit bezit.

      3 Op een reisdocument als bedoeld in [artikel 14 van de wet][ref5], verstrekt aan een in Nederland geboren
      minderjarige vreemdeling, is het bepaalde in het eerste en tweede lid van overeenkomstige toepassing, met dien
      verstande dat het reisdocument ten hoogste geldig is tot de datum waarop de houder de leeftijd van zestien jaren
      bereikt.

      4 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die op grond van de
      [Wet betreffende de positie van Molukkers][ref6] als Nederlander wordt behandeld, is geldig voor vijf jaren en voor
      alle landen.

      5 Een reisdocument als bedoeld in [artikel 15, tweede lid, van de wet][ref7], is geldig:

      a. voor het land van bestemming en de landen waarvan de houder op zijn doorreis de grens passeert, met uitzondering
      van het land waarvan de houder de nationaliteit bezit;

      b. voor de duur van de reis, waarbij rekening wordt gehouden met de door het land van bestemming en de landen van
      doorreis vereiste minimale geldigheid van het reisdocument na binnenkomst, dan wel na vertrek van de houder, met
      een maximum van een jaar.

      6 De geldigheidsduur van het reisdocument bedraagt, in afwijking van het eerste tot en met het vijfde lid, maximaal
      een jaar indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document
      worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0028571#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0003052
      [ref7]: https://wetten.overheid.nl/BWBR0005212#Artikel15
