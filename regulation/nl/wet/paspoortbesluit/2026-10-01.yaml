preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 17 juli 2020, nr. 2020001558;


    Gelet op de artikelen 2, eerste tot en met derde lid, 3, eerste, derde, vierde en achtste lid, 3a, eerste, tweede,
    vierde en vijfde lid, 4c, tweede lid, 4d, derde en vierde lid, 4e, tweede en derde lid, 7, eerste, derde en zesde
    lid, 16, tweede lid, 26, eerste tot en met derde lid, 28, vierde lid, 40, eerste tot en met derde lid, 41, vierde
    lid, 42, vijfde lid, 43, 46b, 47, vierde lid, 50a, 54, zesde lid, 57 en 59, eerste lid, van de Paspoortwet;


    De Afdeling advisering van de Raad van State van het Koninkrijk gehoord (advies van 2 september 2020,
    nr. W04.20.0260/I/K);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 13 oktober 2020, 2020-
    0000590495;


    De bepalingen van het Statuut van het Koninkrijk in acht genomen zijnde;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *basisadministratie:* de basisregistratie personen in het Europese deel van Nederland, dan wel een
      basisadministratie als bedoeld in [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref1], dan wel
      een bij landsverordening van Aruba, Curaçao of Sint Maarten ingestelde bevolkingsadministratie;
      - *basisregister reisdocumenten:* het register, bedoeld in [Hoofdstuk 1, paragraaf 3 van de wet][ref2];
      - *register paspoortsignaleringen:* het register, bedoeld in [artikel 25, derde lid, van de Paspoortwet][ref3];
      - *register vermiste of vervallen reisdocumenten:* het register, bedoeld in [artikel 4a van de wet][ref4];
      - *reisdocumentenstation:* door Onze Minister beschikbaar gestelde apparatuur en programmatuur, waarin gegevens
      met betrekking tot aangevraagde en uitgereikte reisdocumenten worden verwerkt en gearchiveerd en waarmee de
      gegevensuitwisseling tussen de bevoegde autoriteit en de leverancier plaatsvindt;
      - *wet:* [Paspoortwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005212#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref5]: https://wetten.overheid.nl/BWBR0005212
