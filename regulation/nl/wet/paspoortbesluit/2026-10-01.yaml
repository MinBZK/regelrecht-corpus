  - number: '8.1'
    text: >-
      1 De tot uitreiking bevoegde autoriteiten treffen passende technische en organisatorische maatregelen ter
      beveiliging van de onder hen berustende gegevens tegen verlies of aantasting van deze gegevens en tegen onbevoegde
      kennisneming, wijziging of verstrekking van deze gegevens.


      2 De in het eerste lid bedoelde maatregelen omvatten ten minste:


      a. maatregelen gericht op personen die werkzaam zijn voor de verantwoordelijke voor de verwerking van de gegevens;


      b. maatregelen gericht op de toegang tot gebouwen en ruimten waarin de in registers dan wel administraties
      opgenomen gegevens aanwezig zijn;


      c. maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur, programmatuur en opslagmedia;


      d. maatregelen voor het geval de geheimhouding of integriteit van de gegevens is geschaad;


      e. maatregelen bij calamiteiten.


      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het eerste en tweede lid bedoelde
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel8.1
  - number: '8.3'
    text: |-
      Onverminderd het bepaalde in [artikel 4e, eerste lid, van de wet][ref1] kunnen de gegevens uit het basisregister
      reisdocumenten ook worden verstrekt aan het Centraal Bureau voor de Statistiek ten behoeve van statistische
      doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4e
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4e
  - number: '8.4'
    text: |-
      Aan de autoriteiten, bedoeld in de [artikelen 26][ref1], [40][ref2], [42][ref3] en
      [50b van de wet][ref4] en de autoriteiten, bedoeld in de [artikelen 15][ref5], [25][ref6] en
      [36 van de Wet op de Nederlandse identiteitskaart][ref7] kunnen ten behoeve van de taken bedoeld in
      [artikel 4e, eerste lid, onderdelen a en b, van de wet][ref8], alle in het basisregister reisdocumenten opgenomen
      gegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
