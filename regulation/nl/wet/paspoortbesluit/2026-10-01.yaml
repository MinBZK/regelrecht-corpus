        bwb_id: BWBR0005212
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '3.5'
    text: >-
      Aangewezen tot het in ontvangst nemen van aanvragen voor noodpaspoorten zijn de commandanten van de navolgende
      brigades: Grensbewaking, Noord-Holland, Zuid-Holland, Drenthe-IJsselstreek, Oostgrens-Noord, Brabant-Zuid en
      Limburg-Zuid.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.5
  - number: '3.6'
    text: |-
      Van het opnemen van vingerafdrukken overeenkomstig [artikel 3, tweede lid, van de wet][ref1], wordt afgezien,
      indien:

      a. de aanvrager op het moment van het indienen van de aanvraag de leeftijd van twaalf jaar nog niet heeft bereikt,
      of

      b. de daartoe aangewezen persoon van oordeel is dat het fysiek dan wel als gevolg van een tijdelijke verhindering
      onmogelijk is om van de aanvrager te verlangen dat bij hem op het moment van het indienen van de aanvraag een of
      meer vingerafdrukken worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '3'
  - number: '3.7'
    text: >-
      Van het opnemen van een handtekening op het aangevraagde reisdocument wordt afgezien, indien de persoon aan wie het
      aangevraagde reisdocument moet worden verstrekt door leeftijd of een handicap niet in staat is zijn handtekening
      te plaatsen.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.7
  - number: '4.1'
    text: |-
      1 De burgemeester of de gezaghebber gaat ten behoeve van ingezetenen van zijn gemeente, onderscheidenlijk openbaar
      lichaam naast de in [artikel 40, eerste lid, van de wet][ref1] bedoelde reisdocumenten tevens over tot verstrekking
      van:

      a. faciliteitenpaspoorten;

      b. tweede paspoorten.

      2 De gezaghebber gaat, naast de in [artikel 40, eerste lid, van de wet][ref2] bedoelde
      reisdocumenten, ten behoeve van personen die in aanmerking komen voor een reisdocument als bedoeld in
      [artikel 2, eerste lid, onderdelen a, d of e, van de wet][ref3], maar op het moment van vertrek uit het openbaar
      lichaam niet in het bezit zijn van een van deze reisdocumenten ook over tot de verstrekking van:

      a. noodpaspoorten, indien de aanvrager Nederlander is;

      b. laissez-passers, indien de aanvrager vreemdeling is of indien verstrekking van een noodpaspoort met
      gebruikmaking van het reisdocumentenstation niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel40
