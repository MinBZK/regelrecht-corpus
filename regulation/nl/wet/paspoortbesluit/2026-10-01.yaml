  - number: '2.13'
    text: >-
      1 Een faciliteitenpaspoort is geldig voor tien jaren en voor alle landen. Indien de aanvrager bij de aanvraag de
      leeftijd van achttien jaar nog niet heeft bereikt, is het faciliteitenpaspoort geldig voor vijf jaren en voor alle
      landen.


      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document worden
      opgenomen, bedraagt de geldigheidsduur van het reisdocument een jaar.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.13
  - number: '2.14'
    text: |-
      1 Een tweede paspoort als bedoeld in [artikel 30 van de wet][ref1] kan worden verstrekt op verzoek van houders van
      een nationaal paspoort, die aantonen dat zij:

      a. in een reis achtereenvolgens verschillende landen moeten bezoeken waarbij zij de gerede kans lopen dat hun
      toelating tot een land op problemen zal stuiten, omdat uit het daartoe over te leggen nationaal paspoort blijkt dat
      zij eerder in een ander land zijn geweest, of

      b. regelmatig dringend moeten reizen op een tijdstip dat hun nationaal paspoort zich in verband met visering bij
      een buitenlandse vertegenwoordiging bevindt.

      2 Onze Minister stelt na overleg met Onze Minister van Buitenlandse Zaken een overzicht op van de in het eerste
      lid, onderdeel a, bedoelde landen.

      3 Bij de aanvraag dient het oorspronkelijke paspoort en het eventueel eerder uitgereikte tweede paspoort te worden
      overgelegd.

      4 In afwijking van het derde lid kan bij de aanvraag worden volstaan met afschriften van de houderpagina en van
      alle bestempelde visumbladzijden van het oorspronkelijke paspoort en het eventueel eerder uitgereikte tweede
      paspoort, indien de aanvrager met een door een buitenlandse vertegenwoordiging verstrekte verklaring of ander
      schriftelijk bewijs kan aantonen, dat het over te leggen reisdocument zich op dat moment in verband met visering
      bij die buitenlandse vertegenwoordiging bevindt.

      5 Indien bij de aanvraag blijkt dat de geldigheidsduur van het oorspronkelijke paspoort binnen zes maanden zal
      verstrijken, wordt de beslissing op de aanvraag pas genomen nadat het oorspronkelijke paspoort is vervangen door
      een nieuw nationaal paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel30
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '30'
  - number: '2.15'
    text: >-
      1 Een tweede paspoort is geldig voor twee jaren en voor alle landen.


      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document worden
      opgenomen, bedraagt de geldigheidsduur van het reisdocument een jaar.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.15
  - number: '3.1'
    text: |-
      1 De burgemeester of de gezaghebber neemt ten behoeve van ingezetenen van zijn gemeente, onderscheidenlijk openbaar
      lichaam naast de in [artikel 26, eerste lid, van de wet][ref1] bedoelde reisdocumenten tevens de aanvragen in
      ontvangst voor:

      a. faciliteitenpaspoorten;

      b. tweede paspoorten.

      2 De gezaghebber neemt naast de in [artikel 26, eerste lid, van de wet][ref2] bedoelde
      reisdocumenten ten behoeve van personen die in aanmerking komen voor een reisdocument als bedoeld in
      [artikel 2, eerste lid, onderdeel a, d of e, van de wet][ref3] maar die op het moment van vertrek uit het openbaar
      lichaam niet in het bezit zijn van een van deze reisdocumenten ook aanvragen in ontvangst voor:

      a. noodpaspoorten, indien de aanvrager Nederlander is;

      b. laissez-passers, indien de aanvrager vreemdeling is of indien verstrekking van een noodpaspoort met
      gebruikmaking van het reisdocumentenstation niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '3.2'
    text: |-
      In de bij ministeriële regeling aangewezen gemeenten is de burgemeester tevens bevoegd aanvragen in ontvangst te
      nemen voor de in [artikel 2, eerste lid, onderdelen a, d, e of g, van de wet][ref1] bedoelde reisdocumenten voor
      zover het personen betreft die niet in de basisregistratie personen als ingezetene zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '3.3'
    text: |-
      1 De Gouverneur is namens Onze Minister van Buitenlandse Zaken bevoegd tot het in ontvangst nemen van aanvragen
      voor diplomatieke paspoorten en dienstpaspoorten ten behoeve van personen die in Aruba, Curaçao of Sint Maarten in
      de basisadministratie als ingezetene zijn ingeschreven.

      2 De Gouverneur deelt Onze Minister mede welke autoriteiten hij ingevolge
      [artikel 26, eerste lid, onderdeel b, van de wet][ref1] heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '26'
  - number: '3.4'
    text: |-
      Onze Minister van Buitenlandse Zaken neemt naast de in [artikel 26, derde lid, van de wet][ref1] bedoelde gevallen
      tevens aanvragen in ontvangst voor laissez-passers aan de in [artikel 15, tweede lid, van de wet][ref2] bedoelde
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel3.4
    references:
