  - number: '2.8'
    text: |-
      1 Een reisdocument voor vluchtelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning voor
      onbepaalde tijd als bedoeld in [artikel 33 van de Vreemdelingenwet 2000][ref1], dan wel over een toelating als
      vluchteling in Aruba, Curaçao of Sint Maarten, is geldig voor vijf jaren en voor alle landen, met uitzondering van
      het land waarvan de houder de nationaliteit bezit.

      2 Een reisdocument voor vluchtelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref2], of als bedoeld in
      [artikel 6 van de Wet toelating en uitzetting BES][ref3], dan wel over een overeenkomstige verblijfsvergunning in
      Aruba, Curaçao of Sint Maarten, is geldig:

      a. tot de datum waarop de geldigheidsduur van de verblijfsvergunning eindigt, met een minimale geldigheidsduur van
      een jaar en een maximale geldigheidsduur van drie jaren; en

      b. voor alle landen, met uitzondering van het land waarvan de houder de nationaliteit bezit.

      3 De geldigheidsduur van het reisdocument bedraagt, in afwijking van het eerste en tweede lid, maximaal een jaar
      indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document worden
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel2.8
