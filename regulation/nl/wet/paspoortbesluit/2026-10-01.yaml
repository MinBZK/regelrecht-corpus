  - number: '8.5'
    text: >-
      1 In het basisregister reisdocumenten worden gegevens bijgehouden met betrekking tot de aanvraag, verstrekking,
      uitreiking dan wel weigering of vervallenverklaring van reisdocumenten en Nederlandse identiteitskaarten.


      2 De in het basisregister reisdocumenten opgenomen gegevens met betrekking tot verstrekking en uitreiking van
      reisdocumenten en Nederlandse identiteitskaarten, worden na de datum van verstrekking bewaard gedurende een periode
      van:


      a. 11 jaar indien de geldigheidsduur van het verstrekte document 5 jaar of korter is of indien het verstrekte
      document niet wordt uitgereikt;


      b. 16 jaar indien de geldigheidsduur van het verstrekte document langer dan 5 jaar is.


      3 De in het basisregister reisdocumenten opgenomen gegevens die betrekking hebben op een aanvraag waarbij geen
      reisdocument of een Nederlandse identiteitskaart is verstrekt, worden bewaard gedurende een periode van vijf jaar.


      4 Na het verstrijken van de bewaartermijn worden de gegevens zo spoedig mogelijk vernietigd.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel8.5
  - number: '10.1'
    text: |-
      Bij ministeriële regeling kunnen:

      a. regels worden gesteld ter uitvoering van [artikel 3, achtste lid][ref1], [26, eerste lid, onderdeel e][ref2],
      [40, eerste lid, onderdeel e][ref3], en [43 van de wet][ref4];

      b. aanvullende regels worden gesteld ter uitvoering van de [artikelen 2, tweede lid][ref5], [3, derde lid][ref6],
      [4d, vierde lid][ref7], [28, vierde lid][ref8], [42, vijfde lid][ref9], en [59, eerste lid, van de wet][ref10]; en

      c. nadere regels worden vastgesteld ter uitwerking van het bepaalde in de [artikelen 2.1 tot en met 2.5][ref11],
      [2.7][ref12], [2.8][ref13], [2.10 tot en met 2.15][ref14], [3.1 tot en met 3.6][ref15],
      [8.4 tot en met 8.5][ref16].


