  - number: '4.5'
    text: >-
      Aangewezen tot het overgaan tot verstrekking van noodpaspoorten zijn de commandanten van de navolgende brigades:
      Grensbewaking, Noord-Holland, Zuid-Holland, Drenthe-IJsselstreek, Oostgrens-Noord, Brabant-Zuid en Limburg-Zuid.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel4.5
  - number: '4.6'
    text: |-
      Tot uitreiking van het reisdocument wordt slechts overgegaan, nadat de identiteit van de aanvrager in zijn
      aanwezigheid is vastgesteld. [Artikel 28, derde lid, van de wet][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '4.7'
    text: >-
      1 Indien de tot uitreiking bevoegde persoon twijfelt aan de identiteit van de aanvrager worden de vingerafdrukken
      van de aanvrager geverifieerd tegen de vingerafdrukken die in het uit te reiken reisdocument zijn opgenomen.


      2 Indien de verificatie niet slaagt, wordt het reisdocument niet uitgereikt.
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel4.7
  - number: '6.1'
    text: |-
      1 De burgemeester, de gezaghebber, Onze Minister van Buitenlandse Zaken onderscheidenlijk de aangewezen
      autoriteit, bedoeld in de [artikelen 3.3, tweede lid][ref1], en [4.3, tweede lid][ref2], deelt met het oog op
      een vermelding in het register paspoortsignaleringen op grond van [artikel 47, derde lid, van de wet][ref3] Onze
      Minister onderscheidenlijk de Gouverneur de gegevens mede van de houder van een reisdocument dat van rechtswege is
      vervallen, indien de houder weigert het reisdocument in te leveren dan wel de woon- of verblijfplaats van de houder
      niet kan worden achterhaald.

      2 De aangewezen autoriteit, bedoeld in de [artikelen 3.3, tweede lid][ref4], en
      [4.3, tweede lid][ref5], deelt met het oog op een vermelding in het register dat door
      Onze Minister wordt bijgehouden op grond van [artikel 25 van de wet][ref6], op grond van
      [artikel 30, derde lid, van de Wet op de Nederlandse identiteitskaart][ref7] Onze Minister de gegevens mede
      van de houder van een Nederlandse identiteitskaart die van rechtswege is vervallen, indien de houder weigert
      de Nederlandse identiteitskaart in te leveren dan wel de woon- of verblijfplaats van de houder niet kan worden
      achterhaald.

      3 De autoriteit die het in het eerste lid bedoelde reisdocument of de in het tweede lid bedoelde Nederlandse
      identiteitskaart heeft ingehouden, dan wel bij wie het desbetreffende reisdocument onderscheidenlijk de Nederlandse
      identiteitskaart is ingeleverd, deelt Onze Minister zulks terstond mede met het oog op de verwijdering van de in
      het eerste lid bedoelde vermelding uit het register.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de in het eerste en tweede lid
      bedoelde mededeling wordt gedaan.


