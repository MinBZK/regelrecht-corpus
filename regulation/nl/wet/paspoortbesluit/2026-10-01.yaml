  - number: '1.2'
    text: |-
      Reisdocumenten van het Koninkrijk der Nederlanden als bedoeld in
      [artikel 2, eerste lid, onderdeel g, van de wet][ref1] zijn:

      a. faciliteitenpaspoort;

      b. tweede paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0044308/2026-10-01#Artikel1.2
    references:
