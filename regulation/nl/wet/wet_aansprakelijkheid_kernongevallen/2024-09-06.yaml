  - number: '28'
    text: |-
      1 De door de rechter-commissaris vastgestelde staat van verdeling ligt gedurende drie maanden ter griffie van de
      rechtbank ter kosteloze inzage van partijen. Dezen kunnen gedurende deze termijn bij de rechtbank tegen de staat
      van verdeling in verzet komen door indiening van een met redenen omkleed bezwaarschrift ter griffie.

      2 Na afloop van de termijn geeft de rechtbank haar beschikking, nadat zij partijen heeft gehoord of behoorlijk
      doen oproepen.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel28
  - number: '29'
    text: |-
      Nadat een staat van verdeling door de rechter-commissaris of, indien tijdig verzet is gedaan, door de rechtbank is
      vastgesteld betaalt de commissie aan de schuldeisers de hun toekomende bedragen.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel29
  - number: '30'
    text: |-
      1 De rechter-commissaris kan gedurende de termijn die voorafgaat aan de vaststelling van de staat van verdeling
      op voorstel van de commissie aan degenen die schade hebben geleden ten gevolge van een kernongeval de nodige
      voorschotten verlenen.[ Artikel 22, vijfde lid][ref1], is van overeenkomstige toepassing.

      2 Gedurende de in het eerste lid bedoelde termijn kan de rechter-commissaris bovendien een voorlopige staat van
      verdeling vaststellen. In dat geval zijn de [artikelen 22, vijfde lid][ref2], en [26 tot en met 29][ref3] van
      overeenkomstige toepassing.

      3 De rechter-commissaris kan bepalen dat door schuldeisers aan wie op grond van het bepaalde in het eerste of het
      tweede lid een uitkering wordt gedaan, een door hem aan te wijzen vorm van zekerheid wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003234#Artikel26
