  - number: '31'
    text: |-
      1 De beschikkingen van de rechter-commissaris, de beschikking van de rechtbank tot inwilliging van een
      verzoek als bedoeld in [artikel 22, tweede lid][ref1], alsmede de beschikking van de rechtbank krachtens
      [artikel 28, tweede lid][ref2], zijn niet vatbaar voor hoger beroep, noch voor beroep in cassatie.

      2 De wijze en de plaats van indiening van de vorderingen bij de commissie, de beschikkingen van de rechter-
      commissaris en die van de rechtbank krachtens [artikel 28, tweede lid][ref3], alsmede alle nederleggingen worden
      door de commissie op een door de rechter-commissaris te bepalen wijze ter kennis van belanghebbenden gebracht.

      3 Behoudens de toepassing van de [tweede paragraaf van de twaalfde afdeling van de tweede titel van het eerste boek
      van het Wetboek van Burgerlijke Rechtsvordering](onbekend) komen de kosten voortvloeiende uit de toepassing van dit
      hoofdstuk ten laste van de personen die ingevolge [artikel 22, vijfde lid][ref4], verplicht zijn tot storting, naar
      rato van het door hen verschuldigde.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
