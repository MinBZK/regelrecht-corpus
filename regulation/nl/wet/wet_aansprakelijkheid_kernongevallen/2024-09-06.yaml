  - number: '23'
    text: |-
      1 De commissie treedt, al dan niet op verzoek van een der personen die ingevolge [artikel 22, vijfde lid][ref1],
      verplicht zijn tot storting, of uit eigen beweging, naar aanleiding van de indiening van een vordering met
      belanghebbenden in overleg.

      2 De commissie kan te allen tijde door haar aan te wijzen deskundigen raadplegen.

      3 De rechter-commissaris bepaalt, de commissie gehoord hebbende, telkens wanneer daartoe aanleiding is de dag of
      de dagen met bepaling van tijd en plaats, waarop door hem zal worden overgegaan tot verificatie van ingediende
      vorderingen.

      4 De commissie is bevoegd van een schuldeiser overleggen van ontbrekende stukken en inzage van de oorspronkelijke
      bewijsstukken te vorderen.

      5 De commissie stelt een lijst op van de ingediende vorderingen, met summiere vermelding van de gronden waarop
      zij het voornemen heeft een vordering op een in [artikel 24, eerste lid][ref2], bedoelde zitting te betwisten.
      Deze lijst ligt gedurende ten minste drie weken voor de dag voor de verificatie bestemd, ter griffie ter kosteloze
      inzage voor ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel24
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel23
    references:
