        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001827
  - number: '26'
    text: |-
      1 Na afloop van de in [artikel 24][ref1] bedoelde zittingen, of, indien deze tot een betwisting aanleiding hebben
      gegeven, nadat daarover onherroepelijk is beslist, wordt door de commissie een staat van verdeling opgemaakt en aan
      de goedkeuring van de rechter-commissaris onderworpen.

      2 De staat van verdeling vermeldt afzonderlijk de iedere schuldeiser toekomende rente, alsmede te wiens laste de
      kosten van het geding komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel24
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '24'
        hoofdstuk: V
  - number: '27'
    text: |-
      1 Indien het totaal der vorderingen het bedrag van de aansprakelijkheid van de exploitant uit hoofde van
      [artikel 5 van deze wet][ref1], het bedrag genoemd in artikel 3, onder *a)*, van het Verdrag van Brussel of het in
      [artikel 18, eerste lid, van deze wet][ref2] genoemde bedrag overtreft, zijn op de vorderingen telkens voor zover
      zij vergoed kunnen worden uit deze bedragen de navolgende regels van toepassing:

      a. wanneer de vorderingen uitsluitend betreffen schade aan personen, worden zij in evenredigheid gekort;

      b. wanneer de vorderingen uitsluitend betreffen niet in onderdeel a bedoelde schade, worden zij in evenredigheid
      gekort;

      c. wanneer de vorderingen betreffen zowel schade als bedoeld in onderdeel a als schade bedoeld in onderdeel b,
      wordt twee derde van het betrokken bedrag uitsluitend bestemd voor de voldoening van de vorderingen als bedoeld
      in onderdeel a, welke vorderingen - zo nodig - in evenredigheid worden gekort, terwijl het overblijvende bestemd
      zal worden voor de voldoening van de vorderingen als bedoeld in onderdeel b en voor de vorderingen als bedoeld in
      onderdeel a, voor zover deze nog onvoldaan zouden blijven. Blijft overeenkomstig de vorige zinsnede na voldoening
      van de vorderingen als bedoeld in onderdeel a een bedrag over, dan zal het overblijvende bestemd worden voor de
      voldoening als bedoeld in onderdeel b, voor zover deze nog onvoldaan zouden blijven.

      2 Bij de toepassing van [artikel 18][ref3] bedraagt de vergoeding voor vorderingen ter zake van schade aan
      personen, die worden ingesteld na een termijn van tien jaren na de datum van het kernongeval, ten minste tien
      procent van het door de Staat beschikbaar te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003234#Artikel18
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel27
