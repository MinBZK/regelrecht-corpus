        artikel: '24'
        hoofdstuk: V
  - number: '24'
    text: |-
      1 Op de ingevolge [artikel 23, derde lid][ref1], bepaalde dag of dagen houdt de rechter-commissaris in
      tegenwoordigheid van de commissie of van één of meer van haar leden één of meer openbare zittingen.

      2 Alle schuldeisers, de personen die ingevolge [artikel 22, vijfde lid][ref2], verplicht zijn tot storting, als ook
      de commissie kunnen ter zitting een vordering betwisten.

      3 Vorderingen die niet worden betwist, worden door de rechter-commissaris vastgesteld op het beweerde bedrag.

      4 Ingeval van betwisting van een vordering verwijst de rechter-commissaris partijen, zo hij hen niet kan verenigen,
      naar een of meer door hem te bepalen zittingen van de rechtbank ter beslissing van het punt van geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel22
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel24
