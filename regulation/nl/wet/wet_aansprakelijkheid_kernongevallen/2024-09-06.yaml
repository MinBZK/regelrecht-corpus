preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen met betrekking tot de
    aansprakelijkheid voor schade, veroorzaakt door kernongevallen, in verband met het op 29 juli 1960 te Parijs tot
    stand gekomen Verdrag inzake wettelijke aansprakelijkheid op het gebied van de kernenergie en het op 31 januari
    1963 te Brussel tot stand gekomen Verdrag tot aanvulling van eerstgenoemd Verdrag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      *Verdrag van Parijs:* het op 29 juli 1960 te Parijs tot stand gekomen Verdrag inzake wettelijke aansprakelijkheid
      op het gebied van de kernenergie (*Trb.* 1961, 27; 1962, 64), zoals dit Verdrag is gewijzigd bij het op 28 januari
      1964 te Parijs gesloten Aanvullend Protocol bij dit Verdrag (*Trb.* 1964, 178), bij het op 16 november 1982 te
      Parijs gesloten Protocol bij dit Verdrag (*Trb.* 1983, 80) en bij het op 12 februari 2004 te Parijs gesloten
      Protocol bij dit Verdrag (Trb. 2005, 89);

      *Verdrag van Brussel:* het op 31 januari 1963 te Brussel tot stand gekomen Verdrag tot aanvulling van het Verdrag
      van Parijs (*Trb.* 1963, 171), zoals dit Verdrag is gewijzigd bij het op 28 januari 1964 te Parijs gesloten
      Aanvullend Protocol bij dit Verdrag (*Trb.* 1964, 179), bij het op 16 november 1982 te Parijs gesloten Protocol
      bij dit Verdrag (*Trb.* 1983, 81) en bij het op 12 februari 2004 te Parijs gesloten Protocol bij dit Verdrag (Trb.
      2005, 90);

      *Gezamenlijk Protocol:* het op 21 september 1988 te Wenen tot stand gekomen Gezamenlijk Protocol betreffende de
      toepassing van het Verdrag van Wenen en het Verdrag van Parijs (*Trb.* 1988, 160);

      *kernongeval, kerninstallatie, splijtstoffen, radioactieve producten of afvalstoffen, nucleaire stoffen en
      exploitant:* hetgeen daaronder in het Verdrag van Parijs wordt verstaan;

      *schade:* hetgeen in artikel 1(a)(vii) van het Verdrag van Parijs onder «kernschade» wordt verstaan, met dien
      verstande dat de aldaar in de onderdelen 3 tot en met 6 vermelde elementen daaronder ten volle zijn begrepen.

      2 Voor de toepassing van het bepaalde bij of krachtens het Verdrag van Parijs, het Verdrag van Brussel en deze wet
      wordt als exploitant van een in Nederland gelegen kerninstallatie aangemerkt degene, die daartoe bevoegd zijnde,
      in Nederland een kerninstallatie opricht, in werking brengt of in werking houdt. Verlies van die bevoegdheid
      door intrekking of schorsing van de betrokken vergunning of ontheffing, doet de hoedanigheid van exploitant van
      een in Nederland gelegen kerninstallatie niet verloren gaan voor zover betreft de aansprakelijkheid voor schade,
      veroorzaakt door een kernongeval, waarbij betrokken zijn splijtstoffen of radioactieve produkten of afvalstoffen
      ten aanzien waarvan hij ten tijde van het verlies van zijn bevoegdheid aansprakelijk was of ten gevolge van op dat
      tijdstip reeds aangegane verplichtingen aansprakelijk zou zijn geworden, een en ander totdat zijn aansprakelijkheid
      als exploitant door een ander is overgenomen.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel1
  - number: '2'
    text: Bij de toepassing van het Verdrag van Parijs worden de bepalingen van deze wet in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel2
  - number: 2a
    text: |-
      Indien de exploitant van een in Nederland gelegen kerninstallatie aantoont dat de door een kernongeval veroorzaakte
      schade geheel of gedeeltelijk het gevolg is van hetzij grove nalatigheid van de persoon die de schade lijdt, hetzij
      een handelen of nalaten van die persoon met het opzet schade te veroorzaken, kan de bevoegde rechter de exploitant
      geheel of gedeeltelijk ontslaan van de verplichting schadevergoeding te betalen ter zake van de door die persoon
      geleden schade.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel2a
  - number: '4'
    text: |-
      Iedere persoon die met betrekking tot door een kernongeval veroorzaakte schade waarvoor de exploitant van een in
      Nederland gelegen kerninstallatie aansprakelijk is, schadevergoeding heeft betaald krachtens de bepalingen van
      een andere internationale overeenkomst dan de Verdragen van Parijs en Brussel of de wetgeving van andere Staten,
      verkrijgt de rechten ingevolge deze wet van de persoon die schade heeft geleden en aan wie hij de schadevergoeding
      heeft betaald, tot het bedrag dat hij heeft betaald. Artikel 6, onder *(g)*, van het Verdrag van Parijs is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel4
  - number: '5'
    text: |-
      1 Het bedrag van de aansprakelijkheid van de exploitant van een in Nederland gelegen kerninstallatie wordt
      vastgesteld op € 1,2 miljard.

      2 In afwijking van het eerste lid kan bij regeling van Onze Minister van Financiën, in overeenstemming met Onze
      Minister van Veiligheid en Justitie en Onze Minister van Infrastructuur en Waterstaat:

      a. in de gevallen waarin naar zijn oordeel de aard van de desbetreffende kerninstallatie alsmede de te verwachten
      gevolgen van een kernongeval dat daarin zijn oorsprong heeft dit rechtvaardigt, het bedrag van de aansprakelijkheid
      van de betrokken exploitant worden vastgesteld op een lager bedrag, met dien verstande dat een aldus vastgesteld
      bedrag niet minder bedraagt dan € 70 miljoen;

      b. in de gevallen waarin naar zijn oordeel de aard van de desbetreffende nucleaire stoffen alsmede de te verwachten
      gevolgen van een kernongeval dat daarin zijn oorsprong heeft dit rechtvaardigt, voor het vervoer van deze nucleaire
      stoffen het bedrag van de aansprakelijkheid van de betrokken exploitant worden vastgesteld op een lager bedrag, met
      dien verstande dat een aldus vastgesteld bedrag niet minder bedraagt dan € 80 miljoen.

      3 In afwijking van het eerste lid wordt het bedrag van de aansprakelijkheid van de betrokken exploitant voor
      kernschade geleden op het grondgebied van of binnen maritieme zones ingesteld in overeenstemming met het
      internationale recht van, of aan boord van een schip of luchtvaartuig dat is geregistreerd in een Staat als bedoeld
      in artikel 2, onder (a), aanhef en (i), (ii) of (iv), van het Verdrag van Parijs, vastgesteld op het bedrag dat
      naar het recht van de betrokken Staat op wederkerige basis toekomt aan benadeelden in Nederland, indien dit bedrag
      lager is dan het in het eerste lid genoemde bedrag.

      4 Bij algemene maatregel van bestuur kan, gelet op de mogelijkheden tot het verkrijgen van dekking, het in het
      eerste lid genoemde bedrag worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel5
  - number: 5a
    text: |-
      1 Onze Minister van Financiën kan, met inachtneming van de krachtens artikel 1, onderdeel b, van het Verdrag
      van Parijs door de Bestuurscommissie genomen besluiten, in Nederland gelegen kerninstallaties van de toepassing
      van dat verdrag uitsluiten, indien de geringe omvang van de betrokken risico’s in relatie tot de kosten van de
      verdragsverplichtingen dat naar zijn oordeel rechtvaardigen. Het besluit daartoe wordt genomen in overeenstemming
      met Onze Minister van Veiligheid en Justitie en Onze Minister van Infrastructuur en Milieu.

      2 In een besluit op grond van het eerste lid kan worden bepaald dat de exploitant van de kerninstallatie
      aansprakelijk blijft voor schade waarop ten gevolge van dat besluit het Verdrag van Parijs niet meer van toepassing
      is. Aan het besluit kunnen tevens voorschriften worden verbonden met betrekking tot het bedrag en de vorm van die
      aansprakelijkheid, alsmede voorschriften met betrekking tot de wijze waarop daarvoor financiële zekerheid wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel5a
  - number: '6'
    text: |-
      Op verzoek van een vervoerder en met toestemming van de exploitant van een in Nederland gelegen kerninstallatie
      kan Onze Minister van Financiën, indien voldaan is aan de vereisten van artikel 10, onder *(a)*, van het Verdrag
      van Parijs, bepalen, dat onder door hem te stellen voorwaarden die vervoerder in de plaats van die exploitant
      aansprakelijk zal zijn overeenkomstig het Verdrag van Parijs en deze wet.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel6
  - number: '7'
    text: |-
      1 Onverminderd het tweede en vierde lid, verjaart een rechtsvordering tot schadevergoeding door verloop van
      drie jaren na de aanvang van de dag waarop de betrokkene of, indien hij een wettelijke vertegenwoordiger heeft,
      deze laatste kennis draagt of redelijkerwijs kennis had behoren te dragen van de schade en van de aansprakelijke
      exploitant.

      2 Het recht op schadevergoeding vervalt:

      a. ter zake van schade aan personen, indien niet binnen dertig jaren na de datum van het kernongeval een
      rechtsvordering is ingesteld;

      b. ter zake van alle andere schade, indien niet binnen tien jaren na de datum van het kernongeval een
      rechtsvordering is ingesteld.

      3 Voor de aansprakelijkheid van de exploitant met betrekking tot alle rechtsvorderingen tot schadevergoeding ter
      zake van schade aan personen, welke zijn ingesteld na een termijn van tien jaren na de datum van het kernongeval,
      doch voor het verstrijken van een termijn van dertig jaren na het kernongeval, worden door de Minister van
      Financiën verzekeringsovereenkomsten aangegaan of andere garanties verstrekt als bedoeld in [artikel 9][ref1].

      4 Rechtsvorderingen tot schadevergoeding ingesteld na een termijn van tien jaren na de datum van het kernongeval
      laten onverlet het recht op schadevergoeding van een ieder die een rechtsvordering heeft ingesteld binnen die
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel9
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '9'
        hoofdstuk: II
  - number: '8'
    text: |-
      1 Het bevoegde openbare gezag, bedoeld in artikel 10, onder (a) en (d), van het Verdrag van Parijs, is Onze
      Minister van Financiën.

      2 Onze Minister van Financiën kan in overeenstemming met Onze Ministers, wie het mede aangaat, bepalen, dat twee of
      meer kerninstallaties, welke door eenzelfde exploitant op hetzelfde terrein worden geëxploiteerd, met inbegrip van
      iedere andere opstal op dat terrein waar zich radioactieve stoffen bevinden, voor de toepassing van het Verdrag van
      Parijs en van deze wet als één kerninstallatie worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel8
  - number: '9'
    text: |-
      Indien een exploitant van een in Nederland gelegen kerninstallatie naar het oordeel van Onze Minister van Financiën
      geen of geen voldoende financiële zekerheid als bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs, kan
      verkrijgen, of indien deze financiële zekerheid naar het oordeel van Onze Minister van Financiën slechts tegen een
      onredelijke premie of vergoeding is te verkrijgen, is Onze voornoemde Minister gemachtigd op voorwaarden en tegen
      premies of vergoedingen als door hem te bepalen, voor de Staat als verzekeraar verzekeringsovereenkomsten ter zake
      aan te gaan of namens de Staat andere garanties ter zake te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel9
  - number: '10'
    text: |-
      1 Voor zover de uit de financiële zekerheid, bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs
      beschikbaar komende middelen ontoereikend zijn voor vergoeding van schade, waarvoor de exploitant van een in
      Nederland gelegen kerninstallatie aansprakelijk is, stelt de Staat aan die exploitant openbare middelen beschikbaar
      tot het bedrag van zijn aansprakelijkheid.

      2 Voor zover het ontbreken van de financiële zekerheid, bedoeld in het eerste lid, aan schuld van de exploitant te
      wijten is, heeft de Staat voor de in verband daarmede door hem beschikbaar gestelde middelen recht van verhaal op
      de exploitant.

      3 Tot het bedrag, dat de Staat ingevolge het eerste lid uit de openbare middelen aan de exploitant beschikbaar
      heeft gesteld, heeft hij het recht van verhaal van de exploitant, bedoeld in artikel 6, onder *(f)*, van het
      Verdrag van Parijs. Bij de uitoefening van dit recht heeft de Staat voorrang boven de verzekeraars of andere
      personen, die financiële zekerheid als bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs, hebben
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel10
  - number: '11'
    text: |-
      Handelingen van de verzekeraars of andere personen, die financiële zekerheid als bedoeld in artikel 10, onder
      *(a)*, van het Verdrag van Parijs, hebben gesteld in strijd met het bepaalde in artikel 10, onder (d), van dit
      Verdrag, zijn van rechtswege nietig. De nietigheid wordt door de rechter ambtshalve uitgesproken.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel11
  - number: '12'
    text: Bij de toepassing van het Verdrag van Brussel worden de bepalingen van deze wet in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel12
  - number: '13'
    text: |-
      Voor zover het ingevolge [artikel 5][ref1] van deze wet geldende bedrag van de aansprakelijkheid ontoereikend is
      voor vergoeding van schade als bedoeld in [artikel 2][ref2] van het Verdrag van Brussel, waarvoor de exploitant
      van een in Nederland gelegen kerninstallatie ingevolge het Verdrag van Parijs aansprakelijk is, worden de openbare
      middelen, bedoeld in artikel 3, onder (b) ii) en iii) en g), van het Verdrag van Brussel voor vergoeding van die
      schade beschikbaar gesteld anders dan ter dekking van de aansprakelijkheid van die exploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel2
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '2'
        hoofdstuk: II
  - number: '14'
    text: |-
      De staten die ingevolge artikel 5 van het Verdrag van Brussel recht van verhaal hebben voor de beschikbaar gestelde
      openbare middelen, hebben bij de uitoefening van dit recht voorrang boven de verzekeraars of andere personen die
      financiële zekerheid als bedoeld in artikel 10, onder (a), van het Verdrag van Parijs hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel14
  - number: '16'
    text: |-
      Het Verdrag van Parijs en de [hoofdstukken I][ref1], [II][ref2] en [V][ref3] van deze wet zijn mede van toepassing
      ten aanzien van in Nederland gelegen kerninstallaties, welke niet zijn vermeld op de lijst, die overeenkomstig
      artikel 13 van het Verdrag van Brussel wordt opgesteld en bijgehouden, met dien verstande dat als bedrag van de
      aansprakelijkheid, bedoeld in [artikel 5][ref4] van deze wet, geldt het in artikel 3 onder *a)* van het Verdrag van
      Brussel genoemd bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003234#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003234#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0003234#Artikel5
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel16
