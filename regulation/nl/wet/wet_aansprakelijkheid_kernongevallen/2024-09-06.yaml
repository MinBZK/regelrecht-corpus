  - number: '25'
    text: |-
      1 Verschijnt de schuldeiser die de verificatie vraagt, niet op de zitting, waarnaar de zaak ingevolge
      [artikel 24, vierde lid][ref1], is verwezen, dan wordt hij geacht zijn vordering, voor zover zij betwist is, te
      hebben ingetrokken.

      2 Verschijnt hij die een vordering heeft betwist niet, dan wordt hij geacht deze betwisting te hebben laten varen.

      3 De rechtsgang na een verwijzing verloopt voor het overige overeenkomstig de dagvaardingsprocedure van het
      [Eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel25
    references:
