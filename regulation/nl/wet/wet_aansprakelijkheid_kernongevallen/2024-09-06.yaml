  - number: '17'
    text: |-
      1 Ten aanzien van een kernongeval dat plaats vindt op het grondgebied van Nederland, worden de verzender en de
      vervoerder van de bij dat ongeval betrokken nucleaire stoffen, zomede degene die die stoffen ten tijde van het
      ongeval voorhanden had, aangemerkt als de exploitant van een in Nederland gelegen kerninstallatie en als zodanig
      hoofdelijk aansprakelijk gehouden voor de daardoor veroorzaakte schade, tenzij zij bewijzen dat een ander daarvoor
      aansprakelijk is ingevolge het Verdrag van Parijs of het Gezamenlijk Protocol, zulks met dien verstande dat als
      bedrag van de gezamenlijke aansprakelijkheid geldt het in artikel 3, onder *a)*, van het Verdrag van Brussel
      genoemde bedrag.

      2 Op de aansprakelijkheid ingevolge het eerste lid zijn artikel 6 van het Verdrag van Parijs en
      [hoofdstuk V, van deze wet][ref1] mede van toepassing.

      3 Het eerste lid geldt niet:

      a. ten aanzien van degene die de nucleaire aard van de betrokken stoffen niet kende noch redelijkerwijze had
      behoren te kennen;

      b. ten aanzien van degene die ten tijde van het kernongeval de daarbij betrokken nucleaire stoffen ter voldoening
      aan een tot vervoer strekkende overeenkomst vervoerde of bij opslag in verband met zodanig vervoer voorhanden had,
      indien hij redelijkerwijs mocht aannemen:

      1e. dat een ander ingevolge het Verdrag van Parijs voor de schade aansprakelijk zou zijn, of

      2e. dat een ander ingevolge het eerste lid voor de schade aansprakelijk zou zijn en deze beschikte over een
      door Onze Minister van Financiën goedgekeurde verzekering of andere financiële zekerheid ter dekking van diens
      aansprakelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel17
