        hoofdstuk: V
  - number: 17a
    text: |-
      De exploitant van een in Nederland gelegen kerninstallatie die nucleaire stoffen laat vervoeren naar of van een
      exploitant op het grondgebied van een Staat, partij bij het Gezamenlijk Protocol, doch geen partij bij het Verdrag
      van Parijs, is aansprakelijk voor schade tijdens dat vervoer, indien op dat vervoer het Verdrag van Brussel van
      toepassing zou zijn geweest in het geval de betrokken Staat geen partij was bij het Gezamenlijk Protocol.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel17a
  - number: '18'
    text: |-
      1 Indien op het grondgebied van Nederland ten gevolge van een kernongeval schade wordt geleden, die ingevolge
      het Verdrag van Brussel of deze wet dient te worden vergoed en de daarvoor uit anderen hoofde beschikbaar komende
      middelen ontoereikend zijn voor de vergoeding van die schade tot een bedrag van € 3,2 miljard, stelt de Staat de
      openbare middelen beschikbaar die benodigd zijn ten einde die schade tot dat bedrag te vergoeden. Indien het een
      ongeval betreft waarbij de aansprakelijkheid van de exploitant op grond van [artikel 5, derde lid][ref1], op een
      lager bedrag is vastgesteld dan het op grond van artikel 5, eerste lid, geldende bedrag, stelt de Staat tot een
      bedrag van € 1,5 miljard aan openbare middelen beschikbaar. Indien voor de desbetreffende installatie op grond
      van artikel 5, tweede lid, een lager bedrag is vastgesteld, stelt de Staat tot een bedrag van € 1,5 miljard aan
      openbare middelen beschikbaar.

      2 De Staat heeft voor de uitgekeerde bedragen en de daaraan verbonden kosten verhaal op degenen, die daarvoor
      ingevolge deze wet aansprakelijk zijn.

      3 Op de beschikbaarstelling van openbare middelen ingevolge het eerste lid is [artikel 14][ref2] van
      overeenkomstige toepassing.

      4 Het eerste lid vindt mede toepassing op schade als daarin bedoeld, geleden in staten waarin ten tijde van het
      desbetreffende kernongeval een regeling van kracht is, die naar haar aard en toepassingsgebied gelijkwaardig is aan
      die van deze wet, tot het bedrag dat in de betrokken staat op wederkerige basis beschikbaar is.

      5 Bij algemene maatregel van bestuur kan het in het eerste lid genoemde bedrag in verband met geldontwaarding
      worden gewijzigd en kunnen nadere regels worden gesteld aangaande de beschikbaarstelling van openbare middelen
      ingevolge het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel14
