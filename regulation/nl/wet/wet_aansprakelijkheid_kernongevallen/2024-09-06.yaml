  - number: '33'
    text: |-
      Ten aanzien van schade, veroorzaakt door een kernongeval dat heeft plaatsgevonden voor het in werking treden van de
      Wet van 30 oktober 2008 tot wijziging van de Wet aansprakelijkheid kernongevallen ter uitvoering van het Protocol
      van 12 februari 2004 houdende wijziging van het Verdrag van 29 juli 1960 inzake wettelijke aansprakelijkheid op het
      gebied van de kernenergie en ter uitvoering van het Protocol van 12 februari 2004 houdende wijziging van Verdrag
      van 31 januari 1963 tot aanvulling van het Verdrag van 29 juli 1960 inzake wettelijke aansprakelijkheid op het
      gebied van de kernenergie (Stb. 509), blijven de bepalingen van deze wet van toepassing zoals deze luidden voor
      die datum.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel33
  - number: '34'
    text: |-
      1 Deze wet kan worden aangehaald als: Wet aansprakelijkheid kernongevallen.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003234/2024-09-06#Artikel34
