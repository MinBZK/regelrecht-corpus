$id: wet_aansprakelijkheid_kernongevallen
regulatory_layer: WET
publication_date: '2012-09-13'
valid_from: '2017-08-01'
bwb_id: BWBR0003234
url: https://wetten.overheid.nl/BWBR0003234/2017-08-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen met betrekking tot de
    aansprakelijkheid voor schade, veroorzaakt door kernongevallen, in verband met het op 29 juli 1960 te Parijs tot
    stand gekomen Verdrag inzake wettelijke aansprakelijkheid op het gebied van de kernenergie en het op 31 januari
    1963 te Brussel tot stand gekomen Verdrag tot aanvulling van eerstgenoemd Verdrag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: *Verdrag van Parijs:* het op 29
      juli 1960 te Parijs tot stand gekomen Verdrag inzake wettelijke aansprakelijkheid op het gebied van de kernenergie
      (*Trb.* 1961, 27; 1962, 64), zoals dit Verdrag is gewijzigd bij het op 28 januari 1964 te Parijs gesloten
      Aanvullend Protocol bij dit Verdrag (*Trb.* 1964, 178) en bij het op 16 november 1982 te Parijs gesloten Protocol
      bij dit Verdrag (*Trb.* 1983, 80); *Verdrag van Brussel:* het op 31 januari 1963 te Brussel tot stand gekomen
      Verdrag tot aanvulling van het Verdrag van Parijs (*Trb.* 1963, 171), zoals dit Verdrag is gewijzigd bij het op 28
      januari 1964 te Parijs gesloten Aanvullend Protocol bij dit Verdrag (*Trb.* 1964, 179) en bij het op 16 november
      1982 te Parijs gesloten Protocol bij dit Verdrag (*Trb.* 1983, 81); *Gezamenlijk Protocol:* het op 21 september
      1988 te Wenen tot stand gekomen Gezamenlijk Protocol betreffende de toepassing van het Verdrag van Wenen en het
      Verdrag van Parijs (*Trb.* 1988, 160); *kernongeval, kerninstallatie, nucleaire stoffen, exploitant en schade:*
      hetgeen daaronder in het Verdrag van Parijs wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens het Verdrag van Parijs, het Verdrag van Brussel en deze wet
      wordt als exploitant van een in Nederland gelegen kerninstallatie aangemerkt degene, die daartoe bevoegd zijnde,
      in Nederland een kerninstallatie opricht, in werking brengt of in werking houdt. Verlies van die bevoegdheid
      door intrekking of schorsing van de betrokken vergunning of ontheffing, doet de hoedanigheid van exploitant van
      een in Nederland gelegen kerninstallatie niet verloren gaan voor zover betreft de aansprakelijkheid voor schade,
      veroorzaakt door een kernongeval, waarbij betrokken zijn splijtstoffen of radioactieve produkten of afvalstoffen
      ten aanzien waarvan hij ten tijde van het verlies van zijn bevoegdheid aansprakelijk was of ten gevolge van op dat
      tijdstip reeds aangegane verplichtingen aansprakelijk zou zijn geworden, een en ander totdat zijn aansprakelijkheid
      als exploitant door een ander is overgenomen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel1
  - number: '2'
    text: Bij de toepassing van het Verdrag van Parijs worden de bepalingen van deze wet in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel2
  - number: '3'
    text: |-
      De in [artikel 9][ref1] van het Verdrag van Parijs genoemde uitsluiting van aansprakelijkheid voor schade
      veroorzaakt door een kernongeval dat rechtstreeks is te wijten aan een ernstige natuurramp van uitzonderlijke aard,
      is niet van toepassing op de aansprakelijkheid van de exploitant van een in Nederland gelegen kerninstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel9
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '9'
        hoofdstuk: II
  - number: '4'
    text: |-
      Iedere persoon die met betrekking tot door een kernongeval veroorzaakte schade waarvoor de exploitant van een in
      Nederland gelegen kerninstallatie aansprakelijk is, schadevergoeding heeft betaald krachtens de bepalingen van
      een andere internationale overeenkomst dan de Verdragen van Parijs en Brussel of de wetgeving van andere Staten,
      verkrijgt de rechten ingevolge deze wet van de persoon die schade heeft geleden en aan wie hij de schadevergoeding
      heeft betaald, tot het bedrag dat hij heeft betaald. Artikel 6, onder *(g)*, van het Verdrag van Parijs is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel4
  - number: '5.1'
    text: |-
      Het maximumbedrag van de aansprakelijkheid van de exploitant van een in Nederland gelegen kerninstallatie wordt
      overeenkomstig artikel 7, onder *(b)* (i), van het Verdrag van Parijs vastgesteld op € 1,2 miljard.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel5
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur kan, gelet op de mogelijkheden tot het verkrijgen van dekking, het in het eerste
      lid bedoelde maximumbedrag worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel5
  - number: '5.3'
    text: |-
      In de gevallen waarin naar het oordeel van Onze Minister van Financiën de aard van de desbetreffende
      kerninstallatie of van de desbetreffende nucleaire stoffen, alsmede de te verwachten gevolgen van een ongeval
      waarbij deze betrokken zijn dit rechtvaardigt, kan hij in overeenstemming met Onze Minister van Veiligheid
      en Justitie en Onze Minister van Infrastructuur en Milieu het ingevolge het eerste en tweede lid geldende
      maximumbedrag van de aansprakelijkheid van de betrokken exploitant op een lager bedrag vaststellen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister van Financiën kan, met inachtneming van de krachtens artikel 1, onderdeel b, van het Verdrag van
      Parijs door de Bestuurscommissie genomen besluiten, in Nederland gelegen kerninstallaties van de toepassing
      van dat verdrag uitsluiten, indien de geringe omvang van de betrokken risico’s in relatie tot de kosten van de
      verdragsverplichtingen dat naar zijn oordeel rechtvaardigen. Het besluit daartoe wordt genomen in overeenstemming
      met Onze Minister van Veiligheid en Justitie en Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel5a
  - number: 5a.2
    text: |-
      In een besluit op grond van het eerste lid kan worden bepaald dat de exploitant van de kerninstallatie
      aansprakelijk blijft voor schade waarop ten gevolge van dat besluit het Verdrag van Parijs niet meer van toepassing
      is. Aan het besluit kunnen tevens voorschriften worden verbonden met betrekking tot het bedrag en de vorm van die
      aansprakelijkheid, alsmede voorschriften met betrekking tot de wijze waarop daarvoor financiële zekerheid wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel5a
  - number: '6'
    text: |-
      Op verzoek van een vervoerder en met toestemming van de exploitant van een in Nederland gelegen kerninstallatie
      kan Onze Minister van Financiën, indien voldaan is aan de vereisten van artikel 10, onder *(a)*, van het Verdrag
      van Parijs, bepalen, dat onder door hem te stellen voorwaarden die vervoerder in de plaats van die exploitant
      aansprakelijk zal zijn overeenkomstig het Verdrag van Parijs en deze wet.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel6
  - number: '7.1'
    text: |-
      Onverminderd de vervaltermijnen, genoemd in het tweede, vierde en vijfde lid, verjaart een rechtsvordering tot
      schadevergoeding door verloop van drie jaren na de aanvang van de dag waarop de betrokkene of, indien hij een
      wettelijke vertegenwoordiger heeft, deze laatste kennis draagt of redelijkerwijs kennis had behoren te dragen van
      de schade en van de aansprakelijke exploitant.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: '7.2'
    text: 'Het recht op schadevergoeding vervalt:'
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: 7.2.a
    text: |-
      ter zake van schade aan personen, indien niet binnen dertig jaren na de datum van het kernongeval een
      rechtsvordering is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: 7.2.b
    text: |-
      ter zake van alle andere schade, indien niet binnen tien jaren na de datum van het kernongeval een rechtsvordering
      is ingesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de aansprakelijkheid van de exploitant met betrekking tot alle vorderingen tot schadevergoeding welke zijn
      ingesteld na een termijn van tien jaren na de datum van het kernongeval, doch voor het verstrijken van een termijn
      van dertig jaren na het kernongeval, worden door de Minister van Financiën verzekeringsovereenkomsten aangegaan of
      andere garanties verstrekt als bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel9
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '9'
        hoofdstuk: II
  - number: '7.4'
    text: |-
      Rechtsvorderingen tot schadevergoeding ingesteld na een termijn van tien jaren na de datum van het kernongeval
      laten onverlet het recht op schadevergoeding van een ieder die een rechtsvordering heeft ingesteld binnen die
      termijn.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: '7.5'
    text: |-
      In geval van schade veroorzaakt door een kernongeval waarbij splijtstoffen of radioactieve produkten of
      afvalstoffen zijn betrokken die ten tijde van het ongeval zijn gestolen, verloren, geworpen of verlaten en niet
      opnieuw in bezit zijn genomen, vervalt het recht op schadevergoeding twintig jaren na de datum van de diefstal, het
      verlies, de werping of het verlaten.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel7
  - number: '8.1'
    text: |-
      Het bevoegde openbare gezag, bedoeld in artikel 10, onder *(a)* en *(b)*, van het Verdrag van Parijs, is Onze
      Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister van Financiën kan in overeenstemming met Onze Ministers, wie het mede aangaat, bepalen, dat twee of
      meer kerninstallaties, welke door eenzelfde exploitant op hetzelfde terrein worden geëxploiteerd, met inbegrip van
      iedere andere opstal op dat terrein waar zich radioactieve stoffen bevinden, voor de toepassing van het Verdrag van
      Parijs en van deze wet als één kerninstallatie worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel8
  - number: '9'
    text: |-
      Indien een exploitant van een in Nederland gelegen kerninstallatie naar het oordeel van Onze Minister van Financiën
      geen of geen voldoende financiële zekerheid als bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs, kan
      verkrijgen, of indien deze financiële zekerheid naar het oordeel van Onze Minister van Financiën slechts tegen een
      onredelijke premie of vergoeding is te verkrijgen, is Onze voornoemde Minister gemachtigd op voorwaarden en tegen
      premies of vergoedingen als door hem te bepalen, voor de Staat als verzekeraar verzekeringsovereenkomsten ter zake
      aan te gaan of namens de Staat andere garanties ter zake te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel9
  - number: '10.1'
    text: |-
      Voor zover de uit de financiële zekerheid, bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs
      beschikbaar komende middelen ontoereikend zijn voor vergoeding van schade, waarvoor de exploitant van een in
      Nederland gelegen kerninstallatie aansprakelijk is, stelt de Staat aan die exploitant openbare middelen beschikbaar
      tot het maximumbedrag van zijn aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel10
  - number: '10.2'
    text: |-
      Voor zover het ontbreken van de financiële zekerheid, bedoeld in het eerste lid, aan schuld van de exploitant te
      wijten is, heeft de Staat voor de in verband daarmede door hem beschikbaar gestelde middelen recht van verhaal op
      de exploitant.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel10
  - number: '10.3'
    text: |-
      Tot het bedrag, dat de Staat ingevolge het eerste lid uit de openbare middelen aan de exploitant beschikbaar heeft
      gesteld, heeft hij het recht van verhaal van de exploitant, bedoeld in artikel 6, onder *(f)*, van het Verdrag
      van Parijs. Bij de uitoefening van dit recht heeft de Staat voorrang boven de verzekeraars of andere personen, die
      financiële zekerheid als bedoeld in artikel 10, onder *(a)*, van het Verdrag van Parijs, hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel10
  - number: '11'
    text: |-
      Handelingen van de verzekeraars of andere personen, die financiële zekerheid als bedoeld in artikel 10, onder
      *(a)*, van het Verdrag van Parijs, hebben gesteld in strijd met het bepaalde in artikel 10, onder *(b)*, van dit
      Verdrag, zijn van rechtswege nietig. De nietigheid wordt door de rechter ambtshalve uitgesproken.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel11
  - number: '12'
    text: Bij de toepassing van het Verdrag van Brussel worden de bepalingen van deze wet in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel12
  - number: '13'
    text: |-
      Voor zover het ingevolge [artikel 5][ref1] van deze wet geldende maximumbedrag ontoereikend is voor vergoeding van
      schade als bedoeld in [artikel 2][ref2] van het Verdrag van Brussel, waarvoor de exploitant van een in Nederland
      gelegen kerninstallatie ingevolge het Verdrag van Parijs aansprakelijk is, worden de openbare middelen, bedoeld in
      artikel 3, onder *b)* ii) en iii) en *f)*, van het Verdrag van Brussel voor vergoeding van die schade beschikbaar
      gesteld anders dan ter dekking van de aansprakelijkheid van die exploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel2
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '2'
        hoofdstuk: II
  - number: '14'
    text: |-
      De staten, die openbare middelen beschikbaar hebben gesteld krachtens artikel 3, onder *b)* ii) en iii) en
      *f)*, van het Verdrag van Brussel, hebben tot het aldus beschikbaar gestelde bedrag het recht van verhaal van de
      exploitant, bedoeld in artikel 6, onder *(f)*, van het Verdrag van Parijs. Bij de uitoefening van dit recht hebben
      die staten voorrang boven de verzekeraars of andere personen, die financiële zekerheid als bedoeld in artikel 10,
      onder *(a)*, van het Verdrag van Parijs, hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel14
  - number: '15.1'
    text: |-
      De in [artikel 2][ref1] van het Verdrag van Parijs genoemde beperkingen van de werkingssfeer zijn niet van
      toepassing op de aansprakelijkheid van de exploitant van een in Nederland gelegen kerninstallatie voor schade:


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel2
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '2'
        hoofdstuk: II
  - number: 15.1.a
    text: |-
      die geleden is op het grondgebied van een Staat partij bij het Verdrag van Parijs, ongeacht waar het ongeval zich
      heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
  - number: 15.1.b
    text: |-
      die geleden is op het grondgebied van een andere Staat dan bedoeld in onderdeel *a*, partij bij het Gezamenlijk
      Protocol, die het gevolg is van een kernongeval dat zich op het grondgebied van een Staat partij bij het
      Gezamenlijk Protocol heeft voorgedaan; of
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
  - number: 15.1.c
    text: |-
      ongeacht waar deze geleden is, die het gevolg is van een kernongeval dat zich op het grondgebied van Nederland
      heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover betreft de aansprakelijkheid van de exploitant van een in
      Nederland gelegen kerninstallatie, ook andere uitzonderingen worden gemaakt op de bepaling van artikel 2 van het
      Verdrag van Parijs, dan die genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
  - number: '15.3'
    text: |-
      Indien Wij niet binnen drie maanden na het in werking treden van een algemene maatregel van bestuur als bedoeld
      in het tweede lid, aan de Staten-Generaal een voorstel van wet hebben doen toekomen tot wijziging van deze wet
      overeenkomstig die maatregel, of indien zodanig voorstel wordt ingetrokken of verworpen, trekken Wij de maatregel
      onverwijld in.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel15
  - number: '16'
    text: |-
      Het Verdrag van Parijs en de [hoofdstukken I][ref1], [II][ref2] en [V][ref3] van deze wet zijn mede van toepassing
      ten aanzien van in Nederland gelegen kerninstallaties, welke niet zijn vermeld op de lijst, die overeenkomstig
      artikel 13 van het Verdrag van Brussel wordt opgesteld en bijgehouden, met dien verstande dat als maximumbedrag van
      de aansprakelijkheid, bedoeld in [artikel 5][ref4] van deze wet, geldt het in artikel 3 onder *a)* van het Verdrag
      van Brussel genoemd bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003234#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003234#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0003234#Artikel5
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003234
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003234
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003234
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
  - number: '17.1'
    text: |-
      Ten aanzien van een kernongeval dat plaats vindt op het grondgebied van Nederland, worden de verzender en de
      vervoerder van de bij dat ongeval betrokken nucleaire stoffen, zomede degene die die stoffen ten tijde van het
      ongeval voorhanden had, aangemerkt als de exploitant van een in Nederland gelegen kerninstallatie en als zodanig
      hoofdelijk aansprakelijk gehouden voor de daardoor veroorzaakte schade, tenzij zij bewijzen dat een ander daarvoor
      aansprakelijk is ingevolge het Verdrag van Parijs of het Gezamenlijk Protocol, zulks met dien verstande dat als
      maximum bedrag voor hun gezamenlijke aansprakelijkheid geldt het in artikel 3, onder *a)*, van het Verdrag van
      Brussel genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: '17.2'
    text: |-
      Op de aansprakelijkheid ingevolge het eerste lid zijn artikel 6 van het Verdrag van Parijs en
      [hoofdstuk V, van deze wet][ref1] mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003234
        hoofdstuk: V
  - number: '17.3'
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: 17.3.a
    text: |-
      ten aanzien van degene die de nucleaire aard van de betrokken stoffen niet kende noch redelijkerwijze had behoren
      te kennen;
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: 17.3.b
    text: |-
      ten aanzien van degene die ten tijde van het kernongeval de daarbij betrokken nucleaire stoffen ter voldoening
      aan een tot vervoer strekkende overeenkomst vervoerde of bij opslag in verband met zodanig vervoer voorhanden had,
      indien hij redelijkerwijs mocht aannemen:
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: 17.3.b.1e
    text: dat een ander ingevolge het Verdrag van Parijs voor de schade aansprakelijk zou zijn, of
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: 17.3.b.2e
    text: |-
      dat een ander ingevolge het eerste lid voor de schade aansprakelijk zou zijn en deze beschikte over een door
      Onze Minister van Financiën goedgekeurde verzekering of andere financiële zekerheid ter dekking van diens
      aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel17
  - number: '18.1'
    text: |-
      Indien op het grondgebied van Nederland ten gevolge van een kernongeval schade wordt geleden, die ingevolge het
      Verdrag van Brussel of deze wet dient te worden vergoed en de daarvoor uit anderen hoofde beschikbaar komende
      middelen ontoereikend zijn voor de vergoeding van die schade tot een bedrag van € 2 268 901.080,45, stelt de Staat
      de openbare middelen beschikbaar die benodigd zijn ten einde die schade tot dat bedrag te vergoeden. Indien het
      een ongeval betreft waarbij de aansprakelijkheid van de exploitant op grond van [artikel 5, derde lid][ref1], op
      een lager bedrag is vastgesteld dan het op grond van artikel 5, eerste lid, geldende bedrag, stelt de Staat tot een
      bedrag van € 1,5 miljard aan openbare middelen beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
  - number: '18.2'
    text: |-
      De Staat heeft voor de uitgekeerde bedragen en de daaraan verbonden kosten verhaal op degenen, die daarvoor
      ingevolge deze wet aansprakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel18
  - number: '18.3'
    text: |-
      Op de beschikbaarstelling van openbare middelen ingevolge het eerste lid is [artikel 14][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel14
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '14'
        hoofdstuk: III
  - number: '18.4'
    text: |-
      Het bepaalde in het eerste lid vindt mede toepassing op schade als daarin bedoeld, geleden in Staten, die partij
      zijn bij het Verdrag van Brussel en waarin ten tijde van het betreffende kernongeval een regeling van kracht is,
      die naar haar aard, toepassingsgebied en bedrag gelijkwaardig is aan die van de onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel18
  - number: '18.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden aangaande de
      beschikbaarstelling van openbare middelen ingevolge het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel18
  - number: '19'
    text: |-
      Onze Minister van Financiën kan voor het ingevolge de [artikelen 13][ref1] of [18][ref2] door de Staat beschikbaar
      stellen van openbare middelen een door hem te bepalen bedrag aan de exploitant in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel18
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '18'
        hoofdstuk: IV
  - number: '20'
    text: |-
      Indien en voor zover ter vergoeding van de schade recht bestaat op uitkering krachtens Nederlandse sociale
      wetten, komt het recht op vergoeding van die schade ingevolge de Verdragen van Parijs en Brussel, het Gezamenlijk
      Protocol en deze wet toe aan degenen, te wier laste die uitkeringen komen, met dien verstande, dat bij periodieke
      uitkeringen als schade zal worden aangemerkt de gekapitaliseerde waarde van de verschuldigde uitkeringen. Overigens
      blijven de bepalingen van bedoelde wetten van kracht.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel20
  - number: '21'
    text: |-
      Onze Minister van Financiën is gemachtigd ten behoeve van de exploitant van een in Nederland gelegen
      kerninstallatie terzake van vergoeding van schade, veroorzaakt door een kernongeval, anders dan ingevolge het
      Verdrag van Parijs en deze wet, op voorwaarden en tegen premies of vergoedingen als door hem te bepalen, voor de
      Staat als verzekeraar verzekeringsovereenkomsten aan te gaan of namens de Staat andere garanties te verstrekken tot
      ten hoogste een bedrag van € 2 268 901.080,45 per kernongeval.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel21
  - number: '22.1'
    text: In eerste aanleg is bij uitsluiting bevoegd de rechtbank Den Haag.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
  - number: '22.2'
    text: |-
      Indien redelijkerwijs rekening moet worden gehouden met de mogelijkheid dat het totaal der vorderingen het
      maximumbedrag van de aansprakelijkheid van de exploitant uit hoofde van [artikel 5 van deze wet][ref1] overtreft,
      legt de rechtbank Den Haag op verzoek van een belanghebbende, de exploitant en Onze Minister van Financiën gehoord,
      ter zake van de vergoeding van de schade een verbod van betaling op, wijst zij een rechter-commissaris aan ter
      vaststelling van de staten van verdeling van de bedragen bedoeld in [artikel 27, eerste lid, aanhef][ref2] en
      stelt zij tevens een commissie van vereffenaars in, hierna te noemen: de commissie. De rechtbank kan meer dan
      één rechter-commissaris benoemen en kan een rechter-commissaris bij defungeren vervangen. Zij kan wijzigingen
      aanbrengen in de samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel27
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '27'
        hoofdstuk: V
  - number: '22.3'
    text: |-
      De beschikking, bedoeld in het tweede lid, wordt door de griffier aanstonds ter kennis gebracht van de exploitant
      en de verzekeraars of andere personen die financiële zekerheid als bedoeld in artikel 10, onder *(a)*, van het
      Verdrag van Parijs hebben gesteld, de personen die ingevolge het Gezamenlijk Protocol gehouden zijn tot betaling,
      alsmede van Onze Minister van Financiën. De beschikking wordt voorts door de griffier aanstonds bekend gemaakt in
      de *Staatscourant*, onder vermelding van het bepaalde in de tweede zin van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
  - number: '22.4'
    text: |-
      Betalingen in strijd met een verbod als bedoeld in het tweede lid zijn van rechtswege nietig vanaf het moment
      waarop degene die de betaling verrichtte kennis heeft verkregen van de beschikking. Vanaf dat moment worden
      alle vorderingen tot vergoeding van de schade ter verificatie ingediend bij de commissie door de overlegging van
      een rekening of andere schriftelijke verklaring aangevende de aard en het bedrag der vordering vergezeld van de
      bewijsstukken of een afschrift daarvan. De commissie zendt aanstonds een afschrift van alle ingediende stukken aan
      de exploitant en aan Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
  - number: '22.5'
    text: |-
      De exploitant en de verzekeraars of andere personen die financiële zekerheid als bedoeld in artikel 10, onder
      *(a)*, van het Verdrag van Parijs hebben gesteld, de personen die ingevolge het Gezamenlijk Protocol gehouden zijn
      tot betaling, alsmede de Staat, zijn verplicht op bevel van de rechter-commissaris op een door de commissie aan
      te wijzen rekening de bedragen te storten benodigd voor de voldoening aan het bepaalde in [artikel 29][ref1], met
      dien verstande dat het totale door ieder van deze personen afzonderlijk te storten bedrag wordt verminderd met de
      bedragen die deze persoon ter zake van de vergoeding van de schade heeft betaald voor het moment waarop hij kennis
      heeft gekregen van de beschikking bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel29
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '29'
        hoofdstuk: V
  - number: '22.6'
    text: Op de ingevolge het vijfde lid gestorte bedragen kan geen beslag worden gelegd.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel22
  - number: '23.1'
    text: |-
      De commissie treedt, al dan niet op verzoek van een der personen die ingevolge [artikel 22, vijfde lid][ref1],
      verplicht zijn tot storting, of uit eigen beweging, naar aanleiding van de indiening van een vordering met
      belanghebbenden in overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
  - number: '23.2'
    text: De commissie kan te allen tijde door haar aan te wijzen deskundigen raadplegen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel23
  - number: '23.3'
    text: |-
      De rechter-commissaris bepaalt, de commissie gehoord hebbende, telkens wanneer daartoe aanleiding is de dag of
      de dagen met bepaling van tijd en plaats, waarop door hem zal worden overgegaan tot verificatie van ingediende
      vorderingen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel23
  - number: '23.4'
    text: |-
      De commissie is bevoegd van een schuldeiser overleggen van ontbrekende stukken en inzage van de oorspronkelijke
      bewijsstukken te vorderen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel23
  - number: '23.5'
    text: |-
      De commissie stelt een lijst op van de ingediende vorderingen, met summiere vermelding van de gronden waarop zij
      het voornemen heeft een vordering op een in [artikel 24, eerste lid][ref1], bedoelde zitting te betwisten. Deze
      lijst ligt gedurende ten minste drie weken voor de dag voor de verificatie bestemd, ter griffie ter kosteloze
      inzage voor ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel24
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '24'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      Op de ingevolge [artikel 23, derde lid][ref1], bepaalde dag of dagen houdt de rechter-commissaris in
      tegenwoordigheid van de commissie of van één of meer van haar leden één of meer openbare zittingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel23
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '23'
        hoofdstuk: V
  - number: '24.2'
    text: |-
      Alle schuldeisers, de personen die ingevolge [artikel 22, vijfde lid][ref1], verplicht zijn tot storting, als ook
      de commissie kunnen ter zitting een vordering betwisten.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
  - number: '24.3'
    text: Vorderingen die niet worden betwist, worden door de rechter-commissaris vastgesteld op het beweerde bedrag.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel24
  - number: '24.4'
    text: |-
      Ingeval van betwisting van een vordering verwijst de rechter-commissaris partijen, zo hij hen niet kan verenigen,
      naar een of meer door hem te bepalen terechtzittingen van de rechtbank ter beslissing van het punt van geschil.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel24
  - number: '25.1'
    text: |-
      Verschijnt de schuldeiser die de verificatie vraagt, niet op de terechtzitting, waarnaar de zaak ingevolge
      [artikel 24, vierde lid][ref1], is verwezen, dan wordt hij geacht zijn vordering, voor zover zij betwist is, te
      hebben ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel24
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '24'
        hoofdstuk: V
  - number: '25.2'
    text: Verschijnt hij die een vordering heeft betwist niet, dan wordt hij geacht deze betwisting te hebben laten varen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel25
  - number: '25.3'
    text: |-
      De rechtsgang na een verwijzing verloopt voor het overige overeenkomstig het bepaalde in het [Eerste Boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel25
  - number: '26.1'
    text: |-
      Na afloop van de in [artikel 24][ref1] bedoelde zittingen, of, indien deze tot een betwisting aanleiding hebben
      gegeven, nadat daarover onherroepelijk is beslist, wordt door de commissie een staat van verdeling opgemaakt en aan
      de goedkeuring van de rechter-commissaris onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel24
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '24'
        hoofdstuk: V
  - number: '26.2'
    text: |-
      De staat van verdeling vermeldt afzonderlijk de iedere schuldeiser toekomende rente, alsmede te wiens laste de
      kosten van het geding komen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel26
  - number: '27.1'
    text: |-
      Indien het totaal der vorderingen het maximumbedrag van de aansprakelijkheid van de exploitant uit hoofde van
      [artikel 5 van deze wet][ref1], het bedrag genoemd in artikel 3, onder *a)*, van het Verdrag van Brussel of het in
      [artikel 18, eerste lid, van deze wet][ref2] genoemde bedrag overtreft, zijn op de vorderingen telkens voor zover
      zij vergoed kunnen worden uit deze bedragen de navolgende regels van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel18
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '18'
        hoofdstuk: IV
  - number: 27.1.a
    text: wanneer de vorderingen uitsluitend betreffen schade aan personen, worden zij in evenredigheid gekort;
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel27
  - number: 27.1.b
    text: wanneer de vorderingen uitsluitend betreffen niet onder *a* bedoelde schade, worden zij in evenredigheid gekort;
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel27
  - number: 27.1.c
    text: |-
      wanneer de vorderingen betreffen zowel schade als bedoeld in *a* als schade bedoeld in *b*, wordt twee derde
      van het betrokken bedrag uitsluitend bestemd voor de voldoening van de vorderingen als bedoeld in *a*, welke
      vorderingen - zo nodig - in evenredigheid worden gekort, terwijl het overblijvende bestemd zal worden voor de
      voldoening van de vorderingen als bedoeld in *b* en voor de vorderingen als bedoeld in *a*, voor zover deze nog
      onvoldaan zouden blijven. Blijft overeenkomstig de vorige zinsnede na voldoening van de vorderingen als bedoeld
      in *a* een bedrag over, dan zal het overblijvende bestemd worden voor de voldoening als bedoeld in *b*, voor zover
      deze nog onvoldaan zouden blijven.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel27
  - number: '27.2'
    text: |-
      Bij de toepassing van [artikel 18][ref1] bedraagt de vergoeding voor vorderingen ter zake van schade aan personen,
      die worden ingesteld na een termijn van tien jaren na de datum van het kernongeval, ten minste tien procent van het
      door de Staat beschikbaar te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel18
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '18'
        hoofdstuk: IV
  - number: '28.1'
    text: |-
      De door de rechter-commissaris vastgestelde staat van verdeling ligt gedurende drie maanden ter griffie van de
      rechtbank ter kosteloze inzage van partijen. Dezen kunnen gedurende deze termijn bij de rechtbank tegen de staat
      van verdeling in verzet komen door indiening van een met redenen omkleed bezwaarschrift ter griffie.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel28
  - number: '28.2'
    text: |-
      Na afloop van de termijn geeft de rechtbank haar beschikking, nadat zij partijen heeft gehoord of behoorlijk doen
      oproepen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel28
  - number: '29'
    text: |-
      Nadat een staat van verdeling door de rechter-commissaris of, indien tijdig verzet is gedaan, door de rechtbank is
      vastgesteld betaalt de commissie aan de schuldeisers de hun toekomende bedragen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel29
  - number: '30.1'
    text: |-
      De rechter-commissaris kan gedurende de termijn die voorafgaat aan de vaststelling van de staat van verdeling
      op voorstel van de commissie aan degenen die schade hebben geleden ten gevolge van een kernongeval de nodige
      voorschotten verlenen.[ Artikel 22, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
  - number: '30.2'
    text: |-
      Gedurende de in het eerste lid bedoelde termijn kan de rechter-commissaris bovendien een voorlopige staat van
      verdeling vaststellen. In dat geval zijn de [artikelen 22, vijfde lid][ref1], en [26 tot en met 29][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel26
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '26'
        hoofdstuk: V
  - number: '30.3'
    text: |-
      De rechter-commissaris kan bepalen dat door schuldeisers aan wie op grond van het bepaalde in het eerste of het
      tweede lid een uitkering wordt gedaan, een door hem aan te wijzen vorm van zekerheid wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel30
  - number: '31.1'
    text: |-
      De beschikkingen van de rechter-commissaris, de beschikking van de rechtbank tot inwilliging van een
      verzoek als bedoeld in [artikel 22, tweede lid][ref1], alsmede de beschikking van de rechtbank krachtens
      [artikel 28, tweede lid][ref2], zijn niet vatbaar voor hoger beroep, noch voor beroep in cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel28
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '28'
        hoofdstuk: V
  - number: '31.2'
    text: |-
      De wijze en de plaats van indiening van de vorderingen bij de commissie, de beschikkingen van de rechter-
      commissaris en die van de rechtbank krachtens [artikel 28, tweede lid][ref1], alsmede alle nederleggingen worden
      door de commissie op een door de rechter-commissaris te bepalen wijze ter kennis van belanghebbenden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel28
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '28'
        hoofdstuk: V
  - number: '31.3'
    text: |-
      Behoudens de toepassing van de [tweede paragraaf van de twaalfde afdeling van de tweede titel van het eerste boek
      van het Wetboek van Burgerlijke Rechtsvordering](onbekend) komen de kosten voortvloeiende uit de toepassing van dit
      hoofdstuk ten laste van de personen die ingevolge [artikel 22, vijfde lid][ref1], verplicht zijn tot storting, naar
      rato van het door hen verschuldigde.


      [ref1]: https://wetten.overheid.nl/BWBR0003234#Artikel22
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003234
        artikel: '22'
        hoofdstuk: V
  - number: '33.1'
    text: |-
      De Wet van 27 oktober 1965, houdende regelen inzake wettelijke aansprakelijkheid op het gebied van de kernenergie
      (*Stb.* 546), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel33
  - number: '33.2'
    text: |-
      Ten aanzien van schade, veroorzaakt door een kernongeval, dat heeft plaatsgevonden vóór het in werking treden van
      deze wet, blijft de in het eerste lid genoemde wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel33
  - number: '33.3'
    text: |-
      Het Koninklijk besluit van 28 december 1965, *Stb.* 647, tot uitvoering van artikel 2 van de in het eerste lid
      genoemde wet, en de beschikkingen van Onze Minister van Financiën op grond van artikel 1, tweede lid, en artikel
      10, tweede lid van die wet, worden geacht op grond van de overeenkomstige bepalingen van deze wet te zijn genomen
      en blijven van kracht tot zij worden ingetrokken of vervangen.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel33
  - number: '34.1'
    text: 'Deze wet kan worden aangehaald als: Wet aansprakelijkheid kernongevallen.'
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel34
  - number: '34.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003234/2017-08-01#Artikel34
