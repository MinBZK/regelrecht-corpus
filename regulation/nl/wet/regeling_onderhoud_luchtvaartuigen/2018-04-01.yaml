preamble:
  text: |-
    Gelet op artikel 20 en 22 van het Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *belangrijke herstelling:* werkzaamheden om een defect of beschadigd
      luchtvaartuig of onderdeel daarvan te herstellen die, indien deze niet op de juiste wijze worden uitgevoerd, in
      een niet te verwaarlozen mate invloed hebben op de luchtwaardigheid of het voldoen aan de geluidseisen van het
      luchtvaartuig of de deugdelijkheid van het onderdeel;
        - *complex onderhoud:* onderhoud als genoemd in Aanhangsel VII bij Part M van Verordening (EU) nr. 1321/2014;
        - *CS-STAN:* door EASA geaccepteerde methoden en technieken om standaardwijzigingen en standaardreparaties uit te
      voeren en te documenteren (Certification Specifications Standard Changes and Standard Repairs);
        - *erkenninghouder:* houder van een erkenning als bedoeld in
      [artikel 17 van het Besluit luchtvaartuigen 2008][ref1];
        - *minister:* Minister van Infrastructuur en Milieu;
        - *niet-complex onderhoud:* onderhoud anders dan genoemd in Aanhangsel VII bij Part M van Verordening (EU) nr.
      1321/2014;
        - *onderhoud:* revisie, reparatie, inspectie, vervanging, uitvoering van een wijziging, of de herstelling van een
      defect van een luchtvaartuig of luchtvaartuigonderdeel of een combinatie van deze werkzaamheden, met uitzondering
      van direct aan elke vlucht voorafgaande inspectie van het luchtvaartuig of daarmee gelijk te stellen inspecties;
        - *onderhoudsprogramma:* gedetailleerd overzicht van het geplande onderhoud dat aan het luchtvaartuig moet worden
      uitgevoerd om het luchtwaardig te houden;
        - *onderhoudstechnicus:* houder van een geldig, ingevolge [artikel 3.30 van de Wet luchtvaart][ref2] afgegeven
      bewijs van bevoegdheid betreffende onderhoud van luchtvaartuigen;
        - *revisie:* het weer in goede staat brengen van een luchtvaartuig of luchtvaartuigonderdeel door middel van
      inspectie en vervanging in overeenstemming met een goedgekeurde norm ter verlenging van de operationele levensduur.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1
    references:
