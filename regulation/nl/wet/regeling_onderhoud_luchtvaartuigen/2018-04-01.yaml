  - number: 1a
    text: |-
      Deze regeling berust op [artikel 1.5 van de Wet luchtvaart][ref1] en de [artikelen 8, derde lid][ref2],
      [12, tweede lid][ref3], en [13, onderdeel d, van het Besluit luchtvaartuigen 2008][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023922#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0023922#Artikel13
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023922
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0023922
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0023922
        artikel: '13'
  - number: 1b
    text: 'Deze regeling is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
  - number: 1b.a
    text: |-
      Nederlandse luchtvaartuigen, als bedoeld in bijlage II bij de basisverordening die niet onder een AOC vliegen en
      zijn voorzien van een speciaal-BvL, met dien verstande dat paragraaf 6 niet van toepassing is op MLA’s, MLH’s,
      schermvliegtuigen en amateurbouwluchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
  - number: 1b.b
    text: |-
      Nederlandse luchtvaartuigen, als bedoeld in onderdeel a, b of d van bijlage II bij de basisverordening die niet
      onder een AOC vliegen en zijn voorzien van een ICAO-standaard-BvL;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
  - number: 1b.c
    text: |-
      Nederlandse luchtvaartuigen die volledig worden ingezet voor niet-militaire staatsactiviteiten of diensten die zijn
      voorzien van een ICAO-standaard-BvL;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
  - number: 1b.d
    text: |-
      Nederlandse luchtvaartuigen die onder de werking van de basisverordening vallen voor zover het betreft
      [artikel 7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel7
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '7'
        paragraaf: '3'
  - number: 1b.e
    text: |-
      zweefvliegtechnici voor zover het betreft [artikel 7, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel7
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '7'
        paragraaf: '3'
  - number: 1b.f
    text: |-
      Nederlandse luchtvaartuigen, als bedoeld in de [Regeling Yakovlev-52 vliegtuigen][ref1], die niet onder een
      AOC vliegen en zijn voorzien van een speciaal-BvL, met uitzondering van de [artikelen 2 tot en met 4][ref2] en
      [artikel 5, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032948
      [ref2]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012882#Artikel5
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0032948
      - id: ref2
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012882
        artikel: '5'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      De houder van een luchtvaartuig is er voor verantwoordelijk dat een bij dat luchtvaartuig behorend
      onderhoudsprogramma wordt opgesteld, bijgehouden en bij uitvoering van onderhoud wordt gebruikt tenzij
      deze verantwoordelijkheid door middel van een schriftelijk contract is overdragen aan een gecontracteerde
      onderhoudsmanagementorganisatie.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.2'
    text: |-
      Een onderhoudsprogramma omvat ten minste de volgende aspecten: inspectieperiodes, inspectiestaten,
      bedrijfsgegevens, de van toepassing zijnde aanwijzingen van de minister en aanvullende onderhoudsinformatie.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.3'
    text: |-
      Onderhoudsprogramma's worden opgesteld en bijgehouden volgens de meest recente aanbevelingen van de houder van het
      goedgekeurde ontwerp van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.4'
    text: |-
      Wanneer door de houder van het goedgekeurde ontwerp van het luchtvaartuig geen aanbevelingen terzake worden gedaan,
      als gevolg van de inbouw van een andere motor, propeller, onderdeel of uitrustingsstuk, worden de meest recente
      aanbevelingen van de houder van het goedgekeurde ontwerp van respectievelijk de motor, propeller, onderdeel of
      uitrustingsstuk in het onderhoudsprogramma opgenomen.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.5'
    text: |-
      Wijzigingen in de aanbevelingen als bedoeld in het derde en vierde lid worden tijdig, doch uiterlijk binnen 6
      maanden na uitgiftedatum in het onderhoudsprogramma verwerkt.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.6'
    text: |-
      Aanvullend onderhoud, dat door de minister is aangewezen bij de certificatie die in Nederland van toepassing is,
      wordt opgenomen in het onderhoudsprogramma.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.7'
    text: |-
      Aanwijzingen van de minister in de vorm van onderhoudsaanwijzingen en bijzondere luchtwaardigheidsaanwijzingen
      worden tijdig verwerkt in het onderhoudsprogramma.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.8'
    text: |-
      Aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp, die periodiek onderhoud aanbeveelt,
      wordt in het onderhoudsprogramma verwerkt.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.9'
    text: |-
      Indien aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp afwijkt van een aanwijzing van
      de minister, prevaleert de aanwijzing van de minister.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
  - number: '2.10'
    text: |-
      Voor luchtvaartuigen als bedoeld in [artikel 1b, onderdeel c][ref1], is het aanvullend onderhoud als bedoeld in het
      zesde lid te onderscheiden ten opzichte van het onderhoudsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel1b
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: 1b
        paragraaf: '1'
  - number: '3.1'
    text: |-
      De houder van een luchtvaartuig heeft de mogelijkheid om een alternatief onderhoudsprogramma op te stellen
      dat afwijkt van [artikel 2, derde en vierde lid][ref1], voor vliegtuigen met een maximaal toegelaten
      startmassa van 5700 kg of minder, helikopters met een maximaal toegelaten startmassa van 2730 kg of
      minder, ballonnen en zweefvliegtuigen, tenzij daarmee vluchten worden uitgevoerd onder een ontheffing van
      [artikel 16 van de Luchtvaartwet][ref2] voor het vervoer ten behoeve van eigen bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '3.2'
    text: 'De volgens het eerste lid toegestane afwijkingen mogen uitsluitend bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a
    text: |-
      het overschrijden van een door de houder van het goedgekeurde ontwerp aanbevolen revisie-interval of
      bedrijfslimiet, indien:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a.1º
    text: de conditie van het onderdeel periodiek wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a.2º
    text: tijdens de conditiebepaling wordt vastgesteld dat het onderdeel tot de volgende conditiebepaling betrouwbaar is;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a.3º
    text: de periode en de methode van de conditiebepaling in het onderhoudsprogramma zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a.4º
    text: |-
      een advies van een onderhoudstechnicus, of een erkend onderhoudsbedrijf ten aanzien van de periode en de methode
      van de conditiebepaling in het onderhoudsprogramma is opgenomen, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.a.5º
    text: een lijst met onderdelen en componenten waarvoor deze afwijking is toegepast in het journaal is opgenomen,
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: 3.2.b
    text: |-
      het niet opnemen van aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp die een periodieke
      inspectie of test aanbeveelt, zolang deze niet als verplicht door de houder van het goedgekeurde ontwerp wordt
      aangemerkt, dan wel als spoedinformatie wordt uitgegeven.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel3
  - number: '4.1'
    text: |-
      Een basis onderhoudsprogramma als bedoeld in [artikel 2][ref1] mag, behalve wanneer het facetten betreft die zijn
      bedoeld in [artikel 2, zesde en zevende lid][ref2], worden gewijzigd door de houder van het luchtvaartuig indien de
      minister of een houder van een daartoe strekkende erkenning daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Met een wijziging als bedoeld in het eerste lid wordt door de minister ingestemd indien uit de motivering blijkt
      dat:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.a
    text: de houder van het goedgekeurde ontwerp met de voorgestelde afwijking instemt;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.b
    text: |-
      aan de wijziging een analyse ten grondslag ligt, die aantoont, dat hetzelfde niveau van luchtwaardigheid en het
      voldoen aan de geluidseisen wordt bereikt en ten minste betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.b.1º
    text: een of meer luchtvaartuigen van één type en een representatieve ervaringsperiode of bedrijfstijd;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.b.2º
    text: |-
      een situatie die zowel operationeel als onderhoudstechnisch gedurende lange tijd niet ingrijpend veranderd is en op
      korte termijn niet zal worden gewijzigd, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.b.3º
    text: luchtvaartuigen die meer dan 300 vlieguren per jaar gebruikt worden,
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4.2.c
    text: |-
      dat de wijziging stringenter is dan de aanbevelingen van de houder van het goedgekeurde ontwerp als bedoeld in
      [artikel 2, derde of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Wanneer door de houder van het goedgekeurde ontwerp een nieuwe aanbeveling wordt gedaan, die een onderdeel van het
      gewijzigde onderhoudsprogramma betreft, is een nieuwe motivering nodig om de nieuwe aanbeveling te mogen wijzigen.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: '4.4'
    text: |-
      Wijzigingen in het onderhoudsprogramma als bedoeld in het eerste lid, kunnen alleen door een volgende houder
      van het luchtvaartuig worden overgenomen wanneer deze dat tegenover de minister of de in het eerste lid bedoelde
      erkenninghouder, kan motiveren.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4
  - number: 4a
    text: |-
      Het onderhoudsprogramma van een luchtvaartuig als bedoeld in [artikel 1b, onderdelen b en c][ref1], en wijzigingen
      daarop worden goedgekeurd door de minister of door een daartoe erkende CAMO die tevens de uitvoering van het
      onderhoud aanstuurt.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel1b
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: 1b
        paragraaf: '1'
  - number: '5.1'
    text: Het onderhoudsprogramma wordt beheerd door of namens de houder van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel5
  - number: '5.2'
    text: Het onderhoudsprogramma wordt op verzoek zo spoedig mogelijk toegezonden aan de minister.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel5
  - number: '6.1'
    text: 'Periodiek onderhoud mag door de houder van het luchtvaartuig worden uitgesteld onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel6
  - number: 6.1.a
    text: |-
      de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref1], geeft in zijn
      onderhoudsaanbevelingen een mogelijkheid tot uitstel van periodieke inspecties binnen gestelde grenzen;


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: 6.1.b
    text: |-
      indien de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref1] hierin
      niet voorziet geldt dat periodieke inspecties mogen worden uitgesteld met maximaal 10% van het in het
      onderhoudsprogramma opgenomen inspectie-interval. Uitstel mag echter niet cumulatief gehanteerd worden, behalve
      voor inspecties op basis van kalendertijd.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Voor zover de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref1] dit niet
      uitdrukkelijk verbiedt, mogen onderdelen en uitrustingsstukken worden meegenomen in het uitstel. De uitvoering van
      een aanwijzing van de minister die gekoppeld is aan een periodieke inspectie van het luchtvaartuig, mag meegenomen
      worden in het uitstel.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Indien wordt afgeweken van het eerste, respectievelijk tweede lid, is vooraf toestemming van de minister vereist.
      Voor de toestemming is in ieder geval een goedkeurende verklaring van de houder van het goedgekeurde ontwerp
      vereist.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel6
  - number: '7.1'
    text: |-
      Met betrekking tot het onderhoud van een luchtvaartuig is de houder verplicht ervoor te zorgen, dat de minister op
      zijn verzoek wordt ingelicht omtrent het tijdstip, waarop met het onderhoud dan wel met bepaalde daartoe behorende
      werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.2'
    text: |-
      Het onderhoud van een amateurbouwluchtvaartuig, een MLA, een MLH of een gemotoriseerd schermvliegtuig mag worden
      uitgevoerd door of onder toezicht van de houder van het luchtvaartuig, met uitzondering van het onderhoud aan de
      verplichte instrumenten, radio's, ELT’s en transponders.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.3'
    text: |-
      Met uitzondering van het tweede lid geldt dat niet-complex onderhoud wordt uitgevoerd door of onder toezicht van
      een daartoe bevoegde onderhoudstechnicus of door of onder toezicht van een daartoe geschikte erkenninghouder en dat
      complex onderhoud wordt uitgevoerd door of onder toezicht van een daartoe geschikte erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.4'
    text: |-
      Een bevoegd onderhoudstechnicus mag onverminderd het derde lid, beperkt complex onderhoud uitvoeren zoals
      omschreven in Part M, wanneer hij voldoet aan de relevante eisen daarvoor zoals gesteld in Part M.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.5'
    text: |-
      Het onderhoud van vliegtuigen met een maximaal toegelaten startmassa van ten minste 5700 kg en van helikopters met
      een maximaal toegelaten startmassa van ten minste 2730 kg, wordt uitgevoerd door of onder toezicht van een daartoe
      geschikte erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.6'
    text: |-
      Het onderhoud van een luchtvaartuig als bedoeld in [artikel 1b, onderdeel c][ref1], wordt uitgevoerd door een
      daartoe erkend onderhoudsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel1b
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: 1b
        paragraaf: '1'
  - number: '7.7'
    text: |-
      Indien het onderhoudsbedrijf bedoeld in het zesde lid, een volgens bijlage II bij Verordening (EU) Nr. 1321/2014
      erkende organisatie betreft, wordt het aanvullend onderhoud vrijgegeven met de volgende verklaring: ‘Certificaat
      van vrijgave voor gebruik, afgegeven ingevolge de bevoegdheid op grond van het door de Minister van Infrastructuur
      en Milieu afgegeven bewijs van toestemming nr ....’, dan wel ‘Certificate of release to service, released in
      accordance with the approval by the Minister of Infrastructure and the Environment of the Netherlands reference
      degree no. ...’.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.8'
    text: |-
      Met betrekking tot het onderhoud aan een luchtvaartuig of luchtvaartuigonderdeel is de uitvoerder er voor
      verantwoordelijk:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.a
    text: |-
      dat de organisatie en inrichting van de bij het onderhoud betrokken werkplaatsen, de werkwijzen en
      controlemethoden, de gereedschappen, de onderhoudsdocumentatie, alsmede de kundigheid van het bij de werkzaamheden
      betrokken personeel, zodanig zijn dat een goede uitvoering van het onderhoud is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.b
    text: |-
      dat materialen, onderdelen en halfproducten, alsmede uitrustingsstukken alvorens deze bij het onderhoud te
      verwerken, zijn:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.b.1º
    text: |-
      geproduceerd volgens een goedgekeurd ontwerp, door of onder verantwoording van een houder van een daartoe
      strekkende erkenning, dan wel
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.b.2º
    text: |-
      onderhouden volgens de aanwijzingen van de houder van het goedgekeurde ontwerp, door of onder de verantwoording van
      een houder van een daartoe strekkende bevoegdheid of erkenning;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.c
    text: |-
      dat het luchtvaartuig na het onderhoud luchtwaardig zal zijn en zal voldoen aan de geluidseisen, door het uitvoeren
      of laten uitvoeren van de inspecties en proeven waaruit blijkt, dat:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.c.1º
    text: |-
      de vervaardigde delen ten minste gelijkwaardig zijn aan de te vervangen oorspronkelijke delen in deugdelijke
      toestand;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.c.2º
    text: |-
      de vervaardigingswijzen, de samenvoeging en de beproevingswijzen door de minister zijn goedgekeurd of als zodanig
      zijn aanvaard, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.c.3º
    text: de werking van het luchtvaartuig juist is;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: 7.8.d
    text: |-
      dat er een goede identificatie is van de ter vervanging bestemde onderdelen. Bedoelde onderdelen zijn zoveel
      mogelijk vergezeld van instructies voor het aanbrengen en gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '7.9'
    text: |-
      Aan het bepaalde in het achtste lid wordt voldaan, indien het onderhoud wordt verricht door een houder van een
      daartoe strekkende erkenning.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel7
  - number: '8.1'
    text: 'Voor onderhoud aan luchtvaartuigen en onderdelen daarvan buiten Nederland geldt:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.1.a
    text: |-
      dat luchtvaartuigen en onderdelen daarvan buiten Nederland mogen worden onderhouden door onderhoudsbedrijven,
      erkend of geaccepteerd overeenkomstig de geldende Europese procedures voor onderhoud aan luchtvaartuigen en
      onderdelen;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.1.b
    text: 'dat niet-complex onderhoud aan:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.1.b.1
    text: vliegtuigen met een maximaal toegelaten startmassa van 5700 kg of minder,
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.1.b.2
    text: helikopters met een maximaal toegelaten startmassa van 2730 kg of minder,
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.1.b.3
    text: ballonnen en zweefvliegtuigen,
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: '8.2'
    text: |-
      De minister kan in afwijking van het eerste lid toestaan, dat buiten Nederland het onderhoud van
      luchtvaartuigen en onderdelen daarvan wordt uitgevoerd door of onder toezicht van een daartoe door buitenlandse
      burgerluchtvaartautoriteiten:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.2.a
    text: bevoegd verklaarde onderhoudstechnicus, dan wel
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.2.b
    text: erkend persoon.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: '8.3'
    text: |-
      De in het tweede lid bedoelde toestemming wordt verleend indien door de aanvrager is aangetoond dat een goede
      uitvoering van de werkzaamheden is gewaarborgd. De minister kan voorwaarden en beperkingen aan de toestemming
      verbinden.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: '8.4'
    text: 'Bij de beoordeling of aan het derde lid is voldaan, neemt de minister in ieder geval het volgende in overweging:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.4.a
    text: |-
      de eisen, welke de bedoelde buitenlandse burgerluchtvaartautoriteiten stellen met betrekking tot het verlenen van
      bevoegdheden, dan wel het erkennen van personen voor het verrichten van de betrokken werkzaamheden en voorts de
      wijze waarop het overheidstoezicht is geregeld;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: 8.4.b
    text: terzake dienende inlichtingen en gegevens, welke door de houder van het luchtvaartuig zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel8
  - number: '9.1'
    text: |-
      Alvorens na het verrichten van onderhoud het luchtvaartuig of onderdeel daarvan weer in gebruik wordt genomen,
      wordt een certificaat van vrijgave of een certificaat van vrijgave voor gebruik opgesteld:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
  - number: 9.1.a
    text: waarin de bevindingen en de verrichte werkzaamheden bij het onderhoud worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
  - number: 9.1.b
    text: |-
      waarin verklaard wordt dat bij het onderhoud is gehandeld overeenkomstig de krachtens deze regeling gegeven
      aanwijzingen, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
  - number: 9.1.c
    text: |-
      dat is ondertekend door de persoon, de onderhoudstechnicus, of door de erkenningshouder, dan wel door het
      certificeringspersoneel van die erkenningshouder door wie of onder wiens toezicht de werkzaamheden krachtens
      [artikel 7][ref1] van deze regeling zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel7
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '7'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Alvorens na het verrichten van onderhoud het luchtvaartuig weer in gebruik wordt genomen, wordt onder
      verantwoording van de houder van het luchtvaartuig, een verklaring, verder aangeduid als onderhoudsverklaring,
      opgesteld waarin is opgenomen wanneer het eerstvolgende geplande onderhoud dient te worden uitgevoerd. Als een
      onderhoudsverklaring wordt aangemerkt: het Journaal, de kolom ‘uren ‘over’ tot eerstvolgende onderhoudsbeurt'
      tezamen met een vermelding van de datum waarop het eerstvolgende onderhoud dat middels kalendertijd wordt bepaald
      in de kolom ‘opmerkingen'.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
  - number: '9.3'
    text: |-
      Zowel de inhoud als de vorm van de onder het eerste en tweede lid bedoelde certificaten en verklaringen zijn in
      overeenstemming met nadere aanwijzingen, voor zover die door de minister zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel9
  - number: '10.1'
    text: |-
      De houder van een luchtvaartuig is tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven BvL
      verplicht een technische administratie te voeren ten aanzien van het luchtvaartuig en van de volgende onderdelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.1.a
    text: voortstuwingsinrichtingen;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.1.b
    text: luchtschroeven;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.1.c
    text: 'onderdelen:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.1.c.1º
    text: die na revisie of herstelling in het algemeen niet in hetzelfde luchtvaartuig zullen worden gemonteerd, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.1.c.2º
    text: |-
      waarvoor de in het derde lid, genoemde gegevens noodzakelijk zijn om na montage van het onderdeel in het
      luchtvaartuig het tijdstip te bepalen, waarop het onderdeel moet worden geïnspecteerd, gereviseerd of in verband
      met de beperkte levensduur buiten gebruik moet worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.2'
    text: |-
      In de technische administratie van een luchtvaartuig zijn de onderhoudsverklaringen, de certificaten van
      vrijgave of de certificaten van vrijgave voor gebruik alsmede de onderliggende documenten betreffende de aan het
      luchtvaartuig verrichte werkzaamheden, opgenomen. Deze documenten bevatten, met vermelding van de data, ten minste
      de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.2.a
    text: |-
      het aantal vlieguren, of cycli, zodanig dat hieruit blijkt hoe lang het luchtvaartuig heeft gevlogen sinds de bouw
      en sinds het laatste periodieke onderhoud;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.2.b
    text: de technische storingen, de opgelopen schade en de proefvluchten, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.2.c
    text: het onderhoud dat het luchtvaartuig heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.3'
    text: |-
      In de technische administratie van onderdelen van luchtvaartuigen zijn de certificaten van vrijgave, alsmede
      de onderliggende documenten betreffende de aan het onderdeel verrichte werkzaamheden opgenomen. Deze documenten
      bevatten, met vermelding van de data, ten minste de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.3.a
    text: de inschrijvingskenmerken van het luchtvaartuig, waarin het onderdeel is ingebouwd, of is ingebouwd geweest;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.3.b
    text: |-
      het aantal bedrijfsuren of cycli, en wel zo, dat hieruit blijkt hoelang het onderdeel in bedrijf is geweest, sinds
      de vervaardiging en sinds het laatste periodieke onderhoud;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.3.c
    text: de technische storingen en de opgelopen schade, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: 10.3.d
    text: het onderhoud dat het onderdeel heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.4'
    text: |-
      De gegevens worden beveiligd vastgelegd en mogen niet worden uitgewist, verwijderd of onleesbaar worden gemaakt. De
      gegevens zijn volledig, duidelijk leesbaar en begrijpelijk.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.5'
    text: |-
      De technische administratie van luchtvaartuigen en van de onderdelen van luchtvaartuigen wordt gevoerd op
      aanwijzingen van de minister in daartoe bestemde boeken, op daartoe bestemde formulieren of in het daarvoor
      bestemde techlog systeem.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.6'
    text: |-
      Op de boeken, formulieren en andere bescheiden moeten ten minste de benaming, de typeaanduiding, het serienummer en
      de naam van de fabrikant van het luchtvaartuig of het onderdeel worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '10.7'
    text: |-
      Volgboeken en volgkaarten, die ter voortzetting van de reeks aantekeningen worden gebruikt, moeten zijn voorzien
      van een volgnummer. De bladzijden van de boeken moeten doorlopend genummerd zijn.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel10
  - number: '11.1'
    text: |-
      Tenzij de minister een andere termijn heeft vastgesteld, wordt de technische administratie onder
      verantwoordelijkheid van de houder van het luchtvaartuig gedurende de hieronder aangegeven termijnen bewaard:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: 11.1.a
    text: 'met betrekking tot onderhoud anders dan revisie, wijzigingen of belangrijke herstellingen: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: 11.1.b
    text: 'met betrekking tot revisies: zo lang, dat de aantekeningen van voorlaatste en laatste revisie beschikbaar zijn;'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: 11.1.c
    text: |-
      met betrekking tot wijzigingen en belangrijke herstellingen: tot één jaar is verstreken, nadat het luchtvaartuig in
      het luchtvaartuigregister is doorgehaald;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: 11.1.d
    text: |-
      met betrekking tot onderdelen met beperkte levensduur: totdat één jaar is verstreken na de vervanging van het
      betreffende onderdeel.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: '11.2'
    text: |-
      De technische administratie onder verantwoordelijkheid van een onderhoudsmanagementorganisatie als bedoeld in
      [artikel 2, eerste lid][ref1], wordt gedurende de termijnen, bedoeld in Part M, subpart G, van verordening (EU) nr.
      1321/2014 bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '2'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      De in het eerste lid, onder a, b en d gestelde verplichtingen blijven slechts één jaar van kracht, nadat het
      luchtvaartuig in het luchtvaartuigregister is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel11
  - number: '12.1'
    text: |-
      De houder van een luchtvaartuig is tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven bewijs van
      luchtwaardigheid verplicht op een door de minister gedaan verzoek het luchtvaartuig voor een onderzoek naar de
      luchtwaardigheid ter beschikking te stellen op een nader door de minister te bepalen tijdstip en plaats, waarbij
      zoveel mogelijk rekening zal worden gehouden met de belangen van de houder.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: '12.2'
    text: 'Tijdens een onderzoek als bedoeld in het eerste lid dient de houder:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.a
    text: |-
      voldoende en deskundig personeel beschikbaar te stellen om de nodige assistentie te verlenen, alsmede de nodige
      hulpmiddelen, in het bijzonder voor het onderzoek van de installaties;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.b
    text: |-
      te zorgen dat het luchtvaartuig goed is gereinigd en dat indien zulks voor het onderzoek noodzakelijk wordt
      geacht, alle wegneembare bekappingen, beplatingen en inspectieluiken zijn verwijderd of geopend en eventueel het
      luchtvaartuig verder voor inspectie toegankelijk worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.c
    text: te zorgen dat de proeven en proefvluchten die de minister noodzakelijk acht worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.d
    text: 'te zorgen dat op verzoek van de minister:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.d.1º
    text: het gewicht en het zwaartepunt van het luchtvaartuig wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: 12.2.d.2º
    text: de technische administratie wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: '12.3'
    text: |-
      Het eerste en tweede lid zijn met betrekking tot het onderzoek naar het voldoen aan de geluidseisen van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel12
  - number: '13'
    text: |-
      De houder van een luchtvaartuig of de uitvoerder van onderhoud aan een luchtvaartuig dient de bekende en vermoede
      gebreken van het luchtvaartuig alsmede defecten en beschadigingen, die zijn opgetreden of ontdekt in installaties
      of onderdelen van het luchtvaartuig en de luchtwaardigheid of het voldoen aan de geluidseisen nadelig beïnvloeden,
      schriftelijk en zo snel mogelijk maar ten minste binnen 72 uur na de waarneming aan de minister te melden.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel13
  - number: '14.1'
    text: Wijzigingen van luchtvaartuigen behoeven de instemming van de minister.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel14
  - number: '14.2'
    text: |-
      Met het ontwerp van een wijziging van een luchtvaartuig wordt ingestemd nadat is aangetoond dat het gewijzigde
      luchtvaartuig voldoet aan de luchtwaardigheidsvoorschriften die toegepast zijn bij de toelating in Nederland van
      het type luchtvaartuig zoals die van kracht zijn op de datum van het verzoek om instemming.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel14
  - number: '15.1'
    text: 'De minister stemt in met het ontwerp van een wijziging van een luchtvaartuig indien:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a
    text: 'met betrekking tot het ontwerp:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.1º
    text: het ontwerp en de uitvoering van de wijziging zijn voorbereid door de houder van een ontwerperkenning;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.2º
    text: |-
      met het ontwerp van de wijziging is ingestemd door middel van een aanvullend typecertificaat voor het betreffende
      type luchtvaartuig als bedoeld in de [Regeling aanvullende typecertificatie luchtwaardigheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025367
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025367
  - number: 15.1.a.3º
    text: met het ontwerp van de wijziging is ingestemd als typewijziging voor het betreffende type luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.4º
    text: met eenzelfde wijziging reeds eerder is ingestemd voor het betreffende type luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.5º
    text: indien een aldus gewijzigd luchtvaartuig reeds eerder in Nederland is toegelaten;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.6º
    text: het de inbouw van een in Nederland toegelaten uitrustingsstuk voor het betreffende type luchtvaartuig betreft;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.7º
    text: een aanvullend typecertificaat is afgegeven door een lidstaat van de EASA overeenkomstig de procedures van Part 21;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.8º
    text: Service Informatie is verstrekt en de wijziging is goedgekeurd door de primair certificerende autoriteit, of
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.a.9°
    text: het ontwerp en de uitvoering van de wijziging is opgenomen in CS-STAN zoals laatstelijk gewijzigd;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.b
    text: 'met betrekking tot de geluidsproductie:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.b.1º
    text: |-
      de uitvoerende heeft aan de hand van [bijlage 1][ref1] bij deze regeling vastgesteld dat de wijziging geen invloed
      heeft op de geluidsproductie van het luchtvaartuig, of


      [ref1]: https://wetten.overheid.nl/BWBR0012882
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012882
  - number: 15.1.b.2º
    text: |-
      de minister heeft verklaard dat de gewijzigde configuratie van het luchtvaartuig voldoet aan de op het tijdstip van
      uitvoering geldende geluidseisen;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.c
    text: 'met betrekking tot de gegevens:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.c.1º
    text: |-
      de uitvoerende heeft aan de hand van [bijlage 2][ref1] vastgesteld dat de wijziging geen invloed heeft op de
      gegevens van het luchtvaartuig die zijn vastgelegd in het Nederlandse luchtvaartuigregister, of


      [ref1]: https://wetten.overheid.nl/BWBR0012882
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012882
  - number: 15.1.c.2º
    text: de uitvoerende de gewijzigde configuratie heeft gemeld aan de minister;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.1.d
    text: |-
      de uitvoerende heeft vastgesteld dat deze wijziging in combinatie met eerder uitgevoerde wijzigingen geen nadelige
      invloed op de luchtwaardigheid van het luchtvaartuig heeft.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: '15.2'
    text: |-
      De instemming, bedoeld in het eerste lid, geldt alleen indien bij het uitvoeren van een wijziging aantoonbaar
      gebruik wordt gemaakt van de benodigde informatie van:
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.a
    text: het aanvullend typecertificaat;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.b
    text: de typewijziging;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.c
    text: eenzelfde reeds eerder verleende instemming met wijziging voor eenzelfde type luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.d
    text: een aldus gewijzigd luchtvaartuig dat met die wijziging vanuit het buitenland is toegelaten;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.e
    text: de installatie-instructies van het uitrustingsstuk;
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.f
    text: de Service Informatie, of
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: 15.2.g
    text: de CS-STAN.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel15
  - number: '16.1'
    text: 'De aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: 16.1.a
    text: het verkrijgen van instemming met het ontwerp van een wijziging van een luchtvaartuig, en
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: 16.1.b
    text: het verkrijgen van de verklaring ten aanzien van het voldoen aan de geluidseisen, alsmede
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: 16.1.c
    text: |-
      de melding van de uitvoering van een wijziging die invloed heeft op de gegevens van het luchtvaartuig die zijn
      vastgelegd in het Nederlands luchtvaartuigregister, wordt ingediend respectievelijk gedaan bij de minister
      door middel van een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de minister
      verkrijgbaar zijn. Houders van een ontwerperkenning en erkende inspecteurs kunnen bij de aanvraag gebruik maken van
      eigen formulieren indien dat is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.2'
    text: |-
      Bij de aanvraag en de melding, genoemd in het eerste lid, worden de voor de beoordeling noodzakelijke gegevens
      gevoegd.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.3'
    text: |-
      Wanneer de bij de aanvraag of de melding gevraagde aanvullende informatie niet binnen 6 maanden wordt verstrekt,
      vervalt de aanvraag en wordt deze terug gezonden.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.4'
    text: Een inspectie van het ingebouwde ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.5'
    text: De aanvraag, genoemd in het eerste lid, wordt in tweevoud ingediend.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.6'
    text: |-
      De melding genoemd in het eerste lid, en de bijlagen bij de aanvraag of de melding kunnen in enkelvoud worden
      bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.7'
    text: |-
      De aanvraag wordt tenminste vier weken voor de gewenste datum van verkrijging van instemming ingediend, de melding
      zo spoedig mogelijk na de uitvoering van de wijziging.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '16.8'
    text: |-
      Verkregen instemming met de in het eerste lid genoemde aanvraag blijkt uit een stempel en een handtekening namens
      de minister op het formulier.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel16
  - number: '17'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling onderhoud luchtvaartuigen.'
    url: https://wetten.overheid.nl/BWBR0012882/2018-04-01#Artikel18
