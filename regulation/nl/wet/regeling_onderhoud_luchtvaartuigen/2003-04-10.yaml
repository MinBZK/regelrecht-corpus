  - number: '7'
    text: |-
      1 Met betrekking tot het onderhoud van een luchtvaartuig is de houder verplicht ervoor te zorgen, dat de minister
      op zijn verzoek wordt ingelicht omtrent het tijdstip, waarop met het onderhoud dan wel met bepaalde daartoe
      behorende werkzaamheden zal worden aangevangen.

      2 Het onderhoud van een micro light aeroplane mag worden uitgevoerd door of onder toezicht van de houder van het
      vliegtuig.

      3 Het onderhoud van een amateurbouwluchtvaartuig mag worden uitgevoerd door of onder toezicht van de houder van het
      luchtvaartuig, met uitzondering van het onderhoud aan de verplichte instrumenten, radio's en transponders.

      4 Met uitzondering van het gestelde in het tweede en derde lid geldt dat klein onderhoud wordt uitgevoerd
      door of onder toezicht van een daartoe bevoegde onderhoudstechnicus of door of onder toezicht van een daartoe
      geschikte erkenninghouder en dat groot onderhoud wordt uitgevoerd door of onder toezicht van een daartoe geschikte
      erkenninghouder.

      5 Het onderhoud van vliegtuigen met een maximaal toegelaten startmassa van ten minste 5700 kg en van helikopters
      met een maximaal toegelaten startmassa van ten minste 2730 kg, wordt uitgevoerd door of onder toezicht van een
      daartoe geschikte erkenninghouder.

      6 Met betrekking tot het onderhoud aan een luchtvaartuig of luchtvaartuigonderdeel is de uitvoerder er voor
      verantwoordelijk:

      a. dat de organisatie en inrichting van de bij het onderhoud betrokken werkplaatsen, de werkwijzen en
      controlemethoden, de gereedschappen, de onderhoudsdocumentatie, alsmede de kundigheid van het bij de werkzaamheden
      betrokken personeel, zodanig zijn dat een goede uitvoering van het onderhoud is gewaarborgd;

      b. dat materialen, onderdelen en halfproducten, alsmede uitrustingsstukken alvorens deze bij het onderhoud te
      verwerken, zijn:

      1º . geproduceerd volgens een goedgekeurd ontwerp, door of onder verantwoording van een houder van een daartoe
      strekkende erkenning, dan wel

      2º . onderhouden volgens de aanwijzingen van de houder van het goedgekeurde ontwerp, door of onder de
      verantwoording van een houder van een daartoe strekkende bevoegdheid of erkenning;

      c. dat het luchtvaartuig na het onderhoud luchtwaardig zal zijn, door het uitvoeren of laten uitvoeren van de
      inspecties en proeven waaruit blijkt, dat:

      1º. de vervaardigde delen ten minste gelijkwaardig zijn aan de te vervangen oorspronkelijke delen in deugdelijke
      toestand;

      2º. de vervaardigingswijzen, de samenvoeging en de beproevingswijzen door de minister zijn goedgekeurd of als
      zodanig zijn aanvaard, en

      3º. de werking van het luchtvaartuig juist is;

      en

      d. dat er een goede identificatie is van de ter vervanging bestemde onderdelen. Bedoelde onderdelen zijn zoveel
      mogelijk vergezeld van instructies voor het aanbrengen en gebruik daarvan.

      7 Aan het bepaalde in het zesde lid wordt voldaan, indien het onderhoud wordt verricht door een houder van een
      daartoe strekkende erkenning.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel7
  - number: '8'
    text: |-
      1 Voor onderhoud aan luchtvaartuigen en onderdelen daarvan buiten Nederland geldt:

      a. dat luchtvaartuigen en onderdelen daarvan buiten Nederland mogen worden onderhouden door onderhoudsbedrijven,
      erkend of geaccepteerd overeenkomstig de geldende JAA-procedures;

      b. dat klein onderhoud aan:

      1° vliegtuigen met een maximaal toegelaten startmassa van 5700 kg of minder,

      2° helikopters met een maximaal toegelaten startmassa van 2730 kg of minder,

      3° ballonnen en zweefvliegtuigen,

      tenzij daarmee vluchten worden uitgevoerd onder een vergunning tot vluchtuitvoering of een AOC, of een ontheffing
      van artikel 16 van de Luchtvaartwet voor het vervoer ten behoeve van het eigen bedrijf, mag worden uitgevoerd in
      Duitsland, Oostenrijk en Zwitserland door onderhoudsbedrijven, erkend overeenkomstig de in deze landen geldende
      nationale procedures.

      2 De minister kan in afwijking van het eerste lid toestaan, dat buiten Nederland het onderhoud van
      luchtvaartuigen en onderdelen daarvan wordt uitgevoerd door of onder toezicht van een daartoe door buitenlandse
      burgerluchtvaartautoriteiten:

      a. bevoegd verklaarde onderhoudstechnicus, dan wel

      b. erkend persoon.

      3 De in het tweede lid bedoelde toestemming wordt verleend indien door de aanvrager is aangetoond dat een goede
      uitvoering van de werkzaamheden is gewaarborgd. De minister kan voorwaarden en beperkingen aan de toestemming
      verbinden.

      4 Bij de beoordeling of aan het derde lid is voldaan, neemt de minister in ieder geval het volgende in overweging:

      a. de eisen, welke de bedoelde buitenlandse burgerluchtvaartautoriteiten stellen met betrekking tot het verlenen
      van bevoegdheden, dan wel het erkennen van personen voor het verrichten van de betrokken werkzaamheden en voorts de
      wijze waarop het overheidstoezicht is geregeld;

      b. terzake dienende inlichtingen en gegevens, welke door de houder van het luchtvaartuig zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel8
  - number: '9'
    text: |-
      1 Alvorens na het verrichten van onderhoud het luchtvaartuig of onderdeel daarvan weer in gebruik wordt genomen,
      wordt een certificaat van vrijgave of een certificaat van vrijgave voor gebruik opgesteld:

      a. waarin de bevindingen en de verrichte werkzaamheden bij het onderhoud worden vastgelegd;

      b. waarin verklaard wordt dat bij het onderhoud is gehandeld overeenkomstig de krachtens deze regeling gegeven
      aanwijzingen, en

      c. dat is ondertekend door de persoon, de onderhoudstechnicus, of door de erkenningshouder, dan wel door het
      certificeringspersoneel van die erkenningshouder door wie of onder wiens toezicht de werkzaamheden krachtens
      [artikel 7][ref1] van deze regeling zijn verricht.

      2 Alvorens na het verrichten van onderhoud het luchtvaartuig weer in gebruik wordt genomen, wordt onder
      verantwoording van de houder van het luchtvaartuig, een verklaring, verder aangeduid met onderhoudsverklaring,
      opgesteld waarin is opgenomen wanneer het eerstvolgende geplande onderhoud dient te worden uitgevoerd. Als een
      onderhoudsverklaring wordt gezien:

      a. het JAR-OPS 1.915 Operators Aeroplane Technical Log of JAR-OPS 3.915 Helicopter Technical Log;

      b. het Balloon Technical Log van een houder van een vergunning tot vluchtuitvoering voor ballonnen, of

      c. het Journaal, de kolom `uren “over” tot eerstvolgende onderhoudsbeurt' tezamen met een vermelding van de datum
      waarop het eerstvolgende onderhoud dat middels kalendertijd wordt bepaald in de kolom `opmerkingen'.

      3 Zowel de inhoud als de vorm van de onder het eerste en tweede lid bedoelde certificaten en verklaringen zijn in
      overeenstemming met nadere aanwijzingen, voor zover die door de minister zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel7
