  - number: '10'
    text: |-
      1 De houder van een luchtvaartuig is tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven BvL
      verplicht een technische administratie te voeren ten aanzien van het luchtvaartuig en van de volgende onderdelen
      daarvan.

      a. voortstuwingsinrichtingen;

      b. luchtschroeven;

      c. onderdelen:

      1º . die na revisie of herstelling in het algemeen niet in hetzelfde luchtvaartuig zullen worden gemonteerd, en

      2º . waarvoor de in het derde lid, genoemde gegevens noodzakelijk zijn om na montage van het onderdeel in het
      luchtvaartuig het tijdstip te bepalen, waarop het onderdeel moet worden geïnspecteerd, gereviseerd of in verband
      met de beperkte levensduur buiten gebruik moet worden gesteld.

      2 In de technische administratie van een luchtvaartuig zijn de onderhoudsverklaringen, de certificaten van
      vrijgave of de certificaten van vrijgave voor gebruik alsmede de onderliggende documenten betreffende de aan het
      luchtvaartuig verrichte werkzaamheden, opgenomen. Deze documenten bevatten, met vermelding van de data, ten minste
      de gegevens met betrekking tot:

      a. het aantal vlieguren, of cycli, zodanig dat hieruit blijkt hoe lang het luchtvaartuig heeft gevlogen sinds de
      bouw en sinds het laatste periodieke onderhoud;

      b. de technische storingen, de opgelopen schade en de proefvluchten, en

      c. het onderhoud dat het luchtvaartuig heeft ondergaan.

      3 In de technische administratie van onderdelen van luchtvaartuigen zijn de certificaten van vrijgave, alsmede
      de onderliggende documenten betreffende de aan het onderdeel verrichte werkzaamheden opgenomen. Deze documenten
      bevatten, met vermelding van de data, ten minste de gegevens met betrekking tot:

      a. de inschrijvingskenmerken van het luchtvaartuig, waarin het onderdeel is ingebouwd, of is ingebouwd geweest;

      b. het aantal bedrijfsuren of cycli, en wel zo, dat hieruit blijkt hoelang het onderdeel in bedrijf is geweest,
      sinds de vervaardiging en sinds het laatste periodieke onderhoud;

      c. de technische storingen en de opgelopen schade, en

      d. het onderhoud dat het onderdeel heeft ondergaan;

      4 De gegevens worden beveiligd vastgelegd en mogen niet worden uitgewist, verwijderd of onleesbaar worden gemaakt.
      De gegevens zijn volledig, duidelijk leesbaar en begrijpelijk.

      5 De technische administratie van luchtvaartuigen en van de onderdelen van luchtvaartuigen wordt gevoerd op
      aanwijzingen van de minister in daartoe bestemde boeken, op daartoe bestemde formulieren of in het daarvoor
      bestemde techlog systeem.

      6 Op de boeken, formulieren en andere bescheiden moeten ten minste de benaming, de typeaanduiding, het serienummer
      en de naam van de fabrikant van het luchtvaartuig of het onderdeel worden vermeld.

      7 Volgboeken en volgkaarten, die ter voortzetting van de reeks aantekeningen worden gebruikt, moeten zijn voorzien
      van een volgnummer. De bladzijden van de boeken moeten doorlopend genummerd zijn.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel10
  - number: '11'
    text: |-
      1 Tenzij de minister een andere termijn heeft vastgesteld, wordt de technische administratie onder
      verantwoordelijkheid van de houder van het luchtvaartuig gedurende de hieronder aangegeven termijnen bewaard:

      a. met betrekking tot onderhoud anders dan revisie, wijzigingen of belangrijke herstellingen: twee jaar;

      b. met betrekking tot revisies: zo lang, dat de aantekeningen van voorlaatste en laatste revisie beschikbaar zijn;

      c. met betrekking tot wijzigingen en belangrijke herstellingen: tot één jaar is verstreken, nadat het luchtvaartuig
      in het luchtvaartuigregister is doorgehaald;

      d. met betrekking tot onderdelen met beperkte levensduur: totdat één jaar is verstreken na de vervanging van het
      betreffende onderdeel.

      2 De in het vorige lid, onder a, b en d gestelde verplichtingen blijven slechts één jaar van kracht, nadat het
      luchtvaartuig in het luchtvaartuigregister is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel11
  - number: '12'
    text: |-
      1 De houder van een luchtvaartuig is tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven bewijs
      van luchtwaardigheid verplicht op een door de minister gedaan verzoek het luchtvaartuig voor een onderzoek naar de
      luchtwaardigheid ter beschikking te stellen op een nader door de minister te bepalen tijdstip en plaats, waarbij
      zoveel mogelijk rekening zal worden gehouden met de belangen van de houder.

      2 Tijdens een onderzoek als bedoeld in het eerste lid dient de houder:

      a. voldoende en deskundig personeel beschikbaar te stellen om de nodige assistentie te verlenen, alsmede de nodige
      hulpmiddelen, in het bijzonder voor het onderzoek van de installaties;

      b. te zorgen dat het luchtvaartuig goed is gereinigd en dat indien zulks voor het onderzoek noodzakelijk wordt
      geacht, alle wegneembare bekappingen, beplatingen en inspectieluiken zijn verwijderd of geopend en eventueel het
      luchtvaartuig verder voor inspectie toegankelijk worden gemaakt;

      c. te zorgen dat de proeven en proefvluchten die de minister noodzakelijk acht worden uitgevoerd;

      d. te zorgen dat op verzoek van de minister:

      1º. het gewicht en het zwaartepunt van het luchtvaartuig wordt bepaald;

      2º. de technische administratie wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel12
  - number: '13'
    text: |-
      De houder van een luchtvaartuig dient de bekende en vermoede gebreken van het luchtvaartuig alsmede defecten
      en beschadigingen, die zijn opgetreden of ontdekt in installaties of onderdelen van het luchtvaartuig en de
      luchtwaardigheid nadelig beïnvloeden, schriftelijk en zo snel mogelijk maar ten minste binnen 72 uur na de
      waarneming aan de minister te melden.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel13
  - number: '14'
    text: |-
      1 Wijzigingen van luchtvaartuigen behoeven de instemming van de minister.

      2 Met het ontwerp van een wijziging van een luchtvaartuig wordt als typewijziging ingestemd, nadat
      is aangetoond dat het gewijzigde luchtvaartuig voldoet aan de luchtwaardigheidseisen, bedoeld in
      [artikel 5 van het Besluit luchtwaardigheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '5'
  - number: '15'
    text: |-
      1 De minister stemt in met het ontwerp van een wijziging van een luchtvaartuig indien:

      a. met betrekking tot het ontwerp:

      1º. het ontwerp en de uitvoering van de wijziging zijn voorbereid door de houder van een DOA-JA of een DOA-JB;

      2º. met het ontwerp van de wijziging is ingestemd als Nederlands aanvullend typecertificaat voor het betreffende
      type luchtvaartuig;

      3º. met het ontwerp van de wijziging is ingestemd als typewijziging voor het betreffende type luchtvaartuig;

      4º. met eenzelfde wijziging reeds eerder is ingestemd voor het betreffende type luchtvaartuig;

      5º. indien een aldus gewijzigd luchtvaartuig reeds eerder in Nederland is toegelaten;

      6º. het de inbouw van een in Nederland toegelaten uitrustingsstuk voor het betreffende type luchtvaartuig betreft;

      7º. een aanvullend typecertificaat is afgegeven door een lidstaat van de JAA overeenkomstig de procedures van JAR
      21, of

      8º. Service Informatie is verstrekt en de wijziging is goedgekeurd door de primair certificerende autoriteit;

      b. met betrekking tot de geluidsproductie:

      1º. de uitvoerende heeft aan de hand van [bijlage 1][ref1] bij deze regeling vastgesteld dat de wijziging geen
      invloed heeft op de geluidsproductie van het luchtvaartuig, of

      2º. de minister heeft verklaard dat de gewijzigde configuratie van het luchtvaartuig voldoet aan de op het tijdstip
      van uitvoering geldende geluidseisen;

      c. met betrekking tot de gegevens of het vlieghandboek:

      1º. de uitvoerende heeft aan de hand van [bijlage 2][ref2] vastgesteld dat de wijziging geen invloed heeft op de
      gegevens van het luchtvaartuig die zijn vastgelegd in het Nederlandse luchtvaartuigregister of het door de minister
      uitgegeven vlieghandboek, of

      2º. de uitvoerende de gewijzigde configuratie heeft gemeld aan de minister;

      en

      d. de uitvoerende heeft vastgesteld dat deze wijziging in combinatie met eerder uitgevoerde wijzigingen geen
      nadelige invloed op de luchtwaardigheid van het luchtvaartuig heeft.

      2 De instemming, bedoeld in het eerste lid, geldt alleen indien bij het uitvoeren van een wijziging aantoonbaar
      gebruik wordt gemaakt van de benodigde informatie van:

      a. het aanvullend typecertificaat;

      b. de typewijziging;

      c. eenzelfde reeds eerder verleende instemming met wijziging voor eenzelfde type luchtvaartuig;

      d. een aldus gewijzigd luchtvaartuig dat met die wijziging vanuit het buitenland is toegelaten;

      e. de installatie-instructies van het uitrustingsstuk, of

      f. de Service Informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0012882
      [ref2]: https://wetten.overheid.nl/BWBR0012882
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012882
      - id: ref2
        bwb_id: BWBR0012882
  - number: '16'
    text: |-
      1 De aanvraag voor:

      a. het verkrijgen van instemming met het ontwerp van een wijziging van een luchtvaartuig als typewijziging, en

      b. het verkrijgen van de verklaring ten aanzien van het voldoen aan de geluidseisen,

      c. als mede de melding dat de uitvoering van een wijziging die invloed heeft op de gegevens van het luchtvaartuig
      die zijn vastgelegd in het Nederlands luchtvaartuigregister of in het door de minister uitgegeven vlieghandboek,

      wordt ingediend bij de minister middels een volledig ingevuld en ondertekend formulier, waarvan exemplaren
      kosteloos bij de minister verkrijgbaar zijn.

      Houders van een DOA-JA of een DOA-JB en erkende inspecteurs kunnen bij de aanvraag gebruik maken van eigen
      formulieren indien dat is overeengekomen.

      2 Bij de aanvraag en de melding, genoemd in het eerste lid, worden de voor de beoordeling noodzakelijke gegevens
      gevoegd.

      3 Wanneer de bij de aanvraag of de melding gevraagde aanvullende informatie niet binnen 6 maanden wordt verstrekt,
      vervalt de aanvraag en wordt deze terug gezonden.

      4 Een inspectie van het ingebouwde ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.

      5 De aanvraag, genoemd in het eerste lid, wordt in tweevoud ingediend.

      6 De melding genoemd in het eerste lid, en de bijlagen bij de aanvraag of de melding kunnen in enkelvoud worden
      bijgevoegd.

      7 De aanvraag wordt tenminste vier weken voor de gewenste datum van verkrijging van instemming ingediend, de
      melding zo spoedig mogelijk na de uitvoering van de wijziging.

      8 Verkregen instemming met de in het eerste lid genoemde aanvraag blijkt uit een stempel en een handtekening namens
      de minister op het formulier.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel16
