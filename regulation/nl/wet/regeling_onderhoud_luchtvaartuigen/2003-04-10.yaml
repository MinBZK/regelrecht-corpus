      1 Een basis onderhoudsprogramma als bedoeld in [artikel 2][ref1] mag, behalve wanneer het facetten betreft die zijn
      bedoeld in [artikel 2, zesde en zevende lid][ref2], worden gewijzigd door de houder van het luchtvaartuig indien de
      minister of een houder van een daartoe strekkende erkenning daarmee heeft ingestemd.

      2 Met een wijziging als bedoeld in het eerste lid wordt door de minister ingestemd indien uit de motivering blijkt
      dat:

      a. de houder van het goedgekeurde ontwerp met de voorgestelde afwijking instemt;

      b. aan de wijziging een analyse ten grondslag ligt die een gelijk luchtwaardigheidsniveau aantoont en ten minste
      betrekking heeft op:

      1º . een of meer luchtvaartuigen van één type en een representatieve ervaringsperiode of bedrijfstijd;

      2º . een situatie die zowel operationeel als onderhoudstechnisch gedurende lange tijd niet ingrijpend veranderd is
      en op korte termijn niet zal worden gewijzigd, en

      3º . luchtvaartuigen die meer dan 300 vlieguren per jaar gebruikt worden,

      of

      c. dat de wijziging stringenter is dan de aanbevelingen van de houder van het goedgekeurde ontwerp als bedoeld in
      [artikel 2, derde of vierde lid][ref3].

      3 Wanneer door de houder van het goedgekeurde ontwerp een nieuwe aanbeveling wordt gedaan, die een onderdeel
      van het gewijzigde onderhoudsprogramma betreft, is een nieuwe motivering nodig om de nieuwe aanbeveling te mogen
      wijzigen.

      4 Wijzigingen in het onderhoudsprogramma als bedoeld in het eerste lid, kunnen alleen door een volgende houder
      van het luchtvaartuig worden overgenomen wanneer deze dat tegenover de minister of de in het eerste lid bedoelde
      erkenninghouder, kan motiveren.


