  text: |-
    Gelet op artikel 20 en 22 van het Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *belangrijke herstelling:*


              werkzaamheden om een defect of beschadigd luchtvaartuig of onderdeel daarvan te herstellen die, indien deze
      niet op de juiste wijze worden uitgevoerd, in een niet te verwaarlozen mate invloed hebben op de luchtwaardigheid
      van het luchtvaartuig of de deugdelijkheid van het onderdeel;



            b

              *erkenninghouder:*


              een houder van een erkenning bedoeld in [artikel 23 van het Besluit luchtwaardigheid][ref1];



            c

              *groot onderhoud:*


              onderhoud dat niet valt onder de definitie van klein onderhoud;



            d

              *JAR-OPS 1:*


              Joint Aviation Requirements, Commercial Air Transportation (Aeroplanes) als vastgesteld door de Joint
      Aviation Authorities Committee;



            e

              *JAR-OPS 3:*


              Joint Aviation Requirements, Commercial Air Transportation (Helicopters) als vastgesteld door de Joint
      Aviation Authorities Committee;



            f

              *klein onderhoud:*


              onderhoud dat op eenvoudige wijze uit te voeren is, met uitzondering van revisie;



            g

              *minister:*


              Minister van Verkeer en Waterstaat;



            h

              *onderhoud:*


              de revisie, reparatie, inspectie, vervanging, uitvoering van een wijziging, of de herstelling van een
      defect van een luchtvaartuig of luchtvaartuigonderdeel of een combinatie van deze werkzaamheden, met uitzondering
      van de direct aan elke vlucht voorafgaande inspectie van het luchtvaartuig of daarmee gelijk te stellen inspecties;



            i

              *onderhoudstechnicus:*


              een houder van een geldig, ingevolge [artikel 3.30 van de Wet luchtvaart][ref2] afgegeven bewijs van
      bevoegdheid betreffende onderhoud van luchtvaartuigen;



            j

              *revisie:*


              het weer in goede staat brengen van een luchtvaartuig of luchtvaartuigonderdeel door middel van inspectie
      en vervanging in overeenstemming met een goedgekeurde norm ter verlenging van de operationele levensduur.


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.30
