      1 Het onderhoudsprogramma wordt beheerd door of namens de houder van het luchtvaartuig.

      2 Het onderhoudsprogramma wordt op verzoek zo spoedig mogelijk toegezonden aan de minister.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel5
  - number: '6'
    text: |-
      1 Periodiek onderhoud mag door de houder van het luchtvaartuig worden uitgesteld onder de volgende voorwaarden:

      a. de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref1], geeft in zijn
      onderhoudsaanbevelingen een mogelijkheid tot uitstel van periodieke inspecties binnen gestelde grenzen;

      b. voor luchtvaartuigen die opereren onder een AOC volgens JAR-OPS 1 of 3, mogen periodieke inspecties worden
      uitgesteld volgens de in het geaccepteerde onderhoudsprogramma van de AOC-houder opgenomen regels;

      c. indien de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref2] hierin niet
      voorziet geldt voor luchtvaartuigen die niet opereren onder een AOC volgens JAR-OPS, dat periodieke inspecties
      mogen worden uitgesteld met maximaal 10% van het in het onderhoudsprogramma opgenomen inspectie-interval. Uitstel
      mag echter niet cumulatief gehanteerd worden, behalve voor inspecties op basis van kalendertijd.

      2 Voor zover de houder van het goedgekeurde ontwerp als bedoeld in [artikel 2, derde en vierde lid][ref3] dit niet
      uitdrukkelijk verbiedt, mogen onderdelen en uitrustingsstukken worden meegenomen in het uitstel. De uitvoering van
      een aanwijzing van de minister die gekoppeld is aan een periodieke inspectie van het luchtvaartuig, mag meegenomen
      worden in het uitstel.

      3 Indien wordt afgeweken van het eerste, respectievelijk tweede lid, is vooraf toestemming van de minister vereist.
      Voor de toestemming is in ieder geval een goedkeurende verklaring van de houder van het goedgekeurde ontwerp
      vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012882#Artikel2
