      1 De houder van een luchtvaartuig is er voor verantwoordelijk dat een bij dat luchtvaartuig behorend
      onderhoudsprogramma wordt opgesteld, bijgehouden en bij uitvoering van onderhoud wordt gebruikt.

      2 Een onderhoudsprogramma omvat ten minste de volgende aspecten: inspectieperiodes, inspectiestaten,
      bedrijfsgegevens, de van toepassing zijnde aanwijzingen van de minister en aanvullende onderhoudsinformatie.

      3 Onderhoudsprogramma's worden opgesteld en bijgehouden volgens de meest recente aanbevelingen van de houder van
      het goedgekeurde ontwerp van het luchtvaartuig.

      4 Wanneer door de houder van het goedgekeurde ontwerp van het luchtvaartuig geen aanbevelingen terzake worden
      gedaan, als gevolg van de inbouw van een andere motor, propeller, onderdeel of uitrustingsstuk, worden de meest
      recente aanbevelingen van de houder van het goedgekeurde ontwerp van respectievelijk de motor, propeller, onderdeel
      of uitrustingsstuk in het onderhoudsprogramma opgenomen.

      5 Wijzigingen in de aanbevelingen als bedoeld in het derde en vierde lid worden tijdig, doch uiterlijk binnen 6
      maanden na uitgiftedatum in het onderhoudsprogramma verwerkt.

      6 Aanvullend onderhoud, dat door de minister is aangewezen bij de certificatie die in Nederland van toepassing is,
      wordt opgenomen in het onderhoudsprogramma.

      7 Aanwijzingen van de minister in de vorm van onderhoudsaanwijzingen en bijzondere luchtwaardigheidsaanwijzingen
      worden tijdig verwerkt in het onderhoudsprogramma.

      8 Aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp, die periodiek onderhoud aanbeveelt,
      wordt in het onderhoudsprogramma verwerkt.

      9 Indien aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp afwijkt van een aanwijzing van
      de minister, prevaleert de aanwijzing van de minister.
    url: https://wetten.overheid.nl/BWBR0012882/2003-04-10#Artikel2
  - number: '3'
    text: |-
      1 De houder van een luchtvaartuig heeft de mogelijkheid om een alternatief onderhoudsprogramma op te stellen
      dat afwijkt van [artikel 2, derde en vierde lid][ref1], voor vliegtuigen met een maximaal toegelaten startmassa
      van 5700 kg of minder, helikopters met een maximaal toegelaten startmassa van 2730 kg of minder, ballonnen en
      zweefvliegtuigen, tenzij daarmee vluchten worden uitgevoerd onder

      a. een vergunning tot vluchtuitvoering of een AOC, of

      b. een ontheffing van [artikel 16 van de Luchtvaartwet][ref2] voor het vervoer ten behoeve van eigen bedrijf.

      2 De volgens het eerste lid toegestane afwijkingen mogen uitsluitend bestaan uit:

      a. het overschrijden van een door de houder van het goedgekeurde ontwerp aanbevolen revisie-interval of
      bedrijfslimiet, indien:

      1º . de conditie van het onderdeel periodiek wordt bepaald;

      2º . tijdens de conditiebepaling wordt vastgesteld dat het onderdeel tot de volgende conditiebepaling betrouwbaar
      is;

      3º . de periode en de methode van de conditiebepaling in het onderhoudsprogramma zijn opgenomen;

      4º . een advies van een onderhoudstechnicus, of een erkend onderhoudsbedrijf ten aanzien van de periode en de
      methode van de conditiebepaling in het onderhoudsprogramma is opgenomen, en

      5º . een lijst met onderdelen en componenten waarvoor deze afwijking is toegepast in het journaal is opgenomen,

      of

      b. het niet opnemen van aanvullende onderhoudsinformatie van de houder van het goedgekeurde ontwerp, die een
      periodieke inspectie of test aanbeveelt.


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16
