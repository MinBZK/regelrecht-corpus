$id: wijzigingswet_burgerlijk_wetboek_boek_1_clausuleren_recht_op_contact_of_omgang_na_partnerdoding
regulatory_layer: WET
publication_date: '2017-06-16'
valid_from: '2018-01-01'
bwb_id: BWBR0039645
url: https://wetten.overheid.nl/BWBR0039645/2018-01-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het in het belang van het kind wenselijk is om nadere regels te stellen
    omtrent het recht op contact of omgang van de ouder die de andere ouder heeft gedood, en dat daartoe Boek 1 van het
    Burgerlijk Wetboek dient te worden gewijzigd;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039645/2018-01-01#ArtikelAanhef
articles:
  - number: IIa
    text: >-
      Onze Minister van Veiligheid en Justitie zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039645/2018-01-01#ArtikelIIa
  - number: III
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039645/2018-01-01#ArtikelIII
