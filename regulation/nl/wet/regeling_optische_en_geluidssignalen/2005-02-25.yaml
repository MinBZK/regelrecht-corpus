  - number: '2'
    text: |-
      1 De in [artikel 1][ref1] aangewezen hulpverleningsdiensten wijzen bij hen in dienst zijnde personen of groepen
      van personen aan, die daartoe ingerichte motorvoertuigen met de inwerking zijnde optische en geluidssignalen mogen
      besturen. De in [artikel 1, eerste lid, onderdeel o][ref2], aangewezen hulpverleningsdienst wijst personen aan die
      in haar opdracht de desbetreffende voertuigen mogen besturen.

      2 De in het eerste lid bedoelde aanwijzing geschiedt voor de
      [onderdelen e, f, f1, h, m en n van het tweede lid van artikel 1][ref3] door de desbetreffende Minister.

      3 De in het eerste lid bedoelde personen worden aangewezen, nadat zij een speciale instructie hebben gekregen,
      waarin gewezen wordt op onder andere de strafrechtelijke en civielrechtelijke consequenties van het aanrichten
      van schade tijdens de rit, het gedrag en de reactie van weggebruikers op de bijzondere signalen en het gewenste
      rijgedrag van de betrokken bestuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0009147#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009147#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009147#Artikel1
