  - number: '3'
    text: |-
      De volgende signalen moeten als volgt zijn uitgevoerd:

      1 blauw zwaailicht of blauw knipperlicht:

      - *op een motorvoertuig:* licht aan de bovenzijde van het voertuig, dat rondom licht uitstraalt dan wel twee
      lichten, indien door de bouw van het voertuig één licht niet uit alle verkeersrichtingen voldoende zichtbaar is;
      - *op een motorfiets:* in plaats van het licht als bedoeld voor een motorvoertuig mag ook een licht aan de
      voorzijde van het voertuig zijn aangebracht, dat zowel aan de voorzijde als opzij goed zichtbaar is;
      - *motorvoertuig ten behoeve van de brandweer:* aan de voorzijde van het voertuig mag op een hoogte van 1,20 m
      boven het wegdek bovendien één licht worden gevoerd, indien door de bouw van het voertuig het aan de voorzijde
      bevestigde licht niet kan worden waargenomen door op korte afstand vóór het voertuig rijdende bestuurders;

      2 tweetonige hoorn:

      een hoorn die achtereenvolgens de tonen b en e aangeeft in een geluidsterkte van tenminste 100 decibel;

      3 drietonige hoorn:

      een hoorn die achtereenvolgens de tonen c - e - g - e aangeeft;

      4 geel zwaai- of knipperlicht:

      één geel zwaai- of knipperlicht aan de bovenzijde van het motorvoertuig dan wel twee gele zwaai- of knipperlichten,
      indien door de bouw van het voertuig één licht niet uit alle verkeersrichtingen voldoende zichtbaar is;

      5 De meting van de geluidssterkte van de meertonige hoorns vindt plaats overeenkomstig Hoofdstuk 11 van de Regeling
      toelatingseisen.
    url: https://wetten.overheid.nl/BWBR0009147/2005-02-25#Artikel3
  - number: '4'
    text: |-
      1 Door een ziekenauto alsmede door het Rode Kruis Korps en de Bloedbank als bedoeld in
      [artikel 1, tweede lid, onderdelen a en c][ref1], mogen een blauw zwaailicht of blauw knipperlicht en een
      drietonige hoorn worden gevoerd.

      2 Door motorvoertuigen ten dienste van de politie en van de brandweer alsmede door motorvoertuigen , bedoeld in
      [artikel 1, tweede lid, onderdelen b en d tot en met o][ref2], mogen een blauw zwaailicht of blauw knipperlicht en
      een tweetonige hoorn worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009147#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009147#Artikel1
