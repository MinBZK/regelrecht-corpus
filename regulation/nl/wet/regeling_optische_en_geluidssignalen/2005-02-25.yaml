  - number: '5'
    text: |-
      Bij de volgende werkzaamheden of omstandigheden moet een voertuig, indien de kans bestaat dat het voertuig niet
      tijdig door andere weggebruikers wordt opgemerkt, geel zwaai- of knipperlicht voeren:

      a. werkzaamheden ten behoeve van de hulpverlening op of langs de weg met kennelijk daartoe ingerichte
      motorvoertuigen;

      b. werkzaamheden ten behoeve van wegen, werken of inrichtingen op, aan, in of boven wegen, daaronder begrepen
      gladheidsbestrijding of sneeuwruimen;

      c. werkzaamheden met kennelijk daartoe ingerichte motorvoertuigen voor de hulpverlening aan en het repareren of
      bergen en wegslepen van voertuigen;

      d. vervoer van ondeelbare lading voorzover het voertuigen betreft waarvoor krachtens het [Voertuigreglement][ref1]
      ontheffing is verleend inzake de afmetingen van deze voertuigen of hun lading;

      e. het begeleiden van transporten waarvoor een ontheffing is verleend, voor zover die begeleiding uit de ontheffing
      voortvloeit en dit geschiedt met daartoe speciaal uitgeruste voertuigen;

      f. het begeleiden van militaire colonnes;

      g. het rijden met landbouwtrekkers en motorvoertuigen met beperkte snelheid, of daardoor voortbewogen
      aanhangwagens, die, met inbegrip van de lading, breder zijn dan 2,60 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
