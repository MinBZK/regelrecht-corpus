    text: >-
      De regeling van de Minister van Verkeer en Waterstaat van 1 oktober 1991, nr. RVR 103388, houdende aanwijzing
      hulpverleningsdiensten, omschrijving werkzaamheden en omstandigheden en vaststelling van optische en
      geluidssignalen (Stcrt. 202), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009147/2005-02-25#Artikel6
