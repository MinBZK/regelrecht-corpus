articles:
  - number: '1'
    text: |-
      1 Als hulpverleningsdiensten worden aangewezen die diensten die, voorzover de aan hen opgedragen taak hierin
      voorziet, voor het vervullen van een dringende taak worden ingezet

      a. in geval van hulpverlening bij rampen, ernstige ongevallen en bijzondere gebeurtenissen of

      b. ter bestrijding of ter voorkoming van (dreigende) ongevallen en rampen.

      2 De in het eerste lid bedoelde diensten zijn de volgende:

      a. het Rode Kruis Korps van het Nederlandse Rode Kruis;

      b. de ambulancediensten aan wie krachtens de [Wet Ambulancevervoer][ref1] vergunning is verleend voor het
      verrichten van ambulancevervoer, voorzover gebruik wordt gemaakt van daartoe uitgeruste dienstvoertuigen die
      aan beide zijden tenminste zijn voorzien van het in bijlage 1 vastgestelde symbool, alsmede daartoe uitgeruste
      voertuigen van andere hulpverleningsdiensten die zich in opdracht van de Centrale Post Ambulancevervoer als bedoeld
      in de [Wet ambulancevervoer][ref2], bezig houden met het verlenen van de eerstelijns spoedeisende hulpverlening,
      voor zover die voertuigen aan beide zijden tenminste zijn voorzien van het in bijlage 1 vastgestelde symbool;

      c. de Stichting Rode Kruis Bloedbank ’Zuid-West Nederland’ voor een spoedtransport van bloed of bloedprodukten in
      voor de overige weggebruikers herkenbare dienstauto’s.

      d. de afdeling Ongevallenbestrijding van N.S. Beveiligingsservices;

      e. de Eenheid Crisisbeheersing van het Ministerie van Volksgezondheid, Welzijn en Sport ten behoeve van het gebruik
      van met autotelefoon of mobilofoon uitgeruste auto’s;

      f. het Wapen der Koninklijke Marechaussee, alsmede andere door de Minister van Defensie aangewezen
      bijstandseenheden;

      f1. de Stafafdeling Beveiliging, Bewaking & Vervoer van de Arrondissementale Stafdienst Amsterdam;

      g. het Rijksinstituut voor Volksgezondheid en Milieu;

      h. het Inspectoraat-Generaal VROM; ten behoeve van het gebruik van een kernfysische meetauto of met autotelefoon of
      mobilofoon uitgeruste auto’s door ambtenaren die door de betrokken minister zijn aangewezen;

      i. de afdeling Spoorwegpolitie van de N.V. Nederlandse Spoorwegen;

      j. de Technische Milieudienst Drechtsteden (TMD);

      k. de DCRM Milieudienst Rijnmond;

      l. de divisie Rotterdam Port Authority van Havenbedrijf Rotterdam N.V.;

      ten behoeve van het gebruik van uitrukwagens; en

      m. de Explosieven Opruimings Diensten van het Ministerie van Defensie;

      n. de door de Minister van Justitie aangewezen functionarissen van de Landelijke Vervoersdienst Justitie of de
      Landelijke Bijzondere Bijstandsver-lening van de Dienst Justitiële Inrichtingen.

      o. het door de Minister van Volksgezondheid, Welzijn en Sport aangewezen orgaancentrum, bedoeld
      in [artikel 24 van de Wet op de orgaandonatie][ref3], ten behoeve van het spoedeisende vervoer van
      transplantatieorganen en het spoedeisende vervoer van transplantatieteams, voor zover gebruik wordt gemaakt van
      daartoe uitgeruste en duidelijk herkenbare voertuigen die tenminste aan beide zijden zijn voorzien van het in
      bijlage 1 vastgestelde symbool.


