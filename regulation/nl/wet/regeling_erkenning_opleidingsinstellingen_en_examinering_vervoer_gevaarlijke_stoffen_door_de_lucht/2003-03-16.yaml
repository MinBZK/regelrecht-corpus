preamble:
  text: |-
    Gelet op artikel 6.56, eerste en derde lid, van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *erkende opleidingsinstelling:* een door de minister erkende opleidingsinstelling voor het geven van opleidingen
      en het afnemen van examens ter verkrijging van een certificaat inzake het vervoer van gevaarlijke stoffen door
      de lucht;

      b. *minister:* Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel1
  - number: '2'
    text: |-
      De aanvraag voor verlening van een erkenning wordt ingediend door middel van een daartoe volledig ingevuld en
      ondertekend formulier, waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel2
  - number: '3'
    text: |-
      De aanvraag voor verlening van een erkenning gaat vergezeld van:

      a. een verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de opleiding zal
      worden uitgevoerd in overeenstemming met deze regeling;

      b. een overzicht en curriculum vitae van de bij de opleiding betrokken instructeurs;

      c. beschrijving van de accommodatie, theorie-instructievoorzieningen en theorie-examenorganisatie;

      d. bewijs van beschikbaarheid van de vereiste trainingsuitrusting, voorzieningen en instructeurs;

      e. een organigram van de organisatie, inclusief een korte omschrijving van de organisatie;

      f. een opleidingsplan en een opleidingssyllabus; de inhoud van het plan en van de syllabus bevat in ieder geval de
      informatie als bedoeld in de bij deze regeling behorende [Bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014765
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014765
  - number: '4'
    text: |-
      1 De minister verleent de erkenning als bedoeld in [artikel 6.56 van de wet][ref1] indien de aanvrager aan de
      volgende eisen voldoet:

      a. wat betreft de opleidingsinstelling: de eisen, bedoeld in [bijlage A][ref2];

      b. wat betreft de inhoud van de opleidingen: de eisen, bedoeld in de bij deze regeling behorende [bijlage B][ref3];

      c. wat betreft de examinering: de eisen in [hoofdstuk 3][ref4] van deze regeling.

      2 De opleiding voor een erkenning kan inhouden:

      a. opleiding voor handelingen ten aanzien van alle klassen met uitzondering van klasse 7; of

      b. opleiding voor handelingen uitsluitend ten aanzien van klasse 7.

      3 De opleiding voor de E-erkenning als bedoeld in [bijlage B][ref5] kan uitsluitend de inhoud als bedoeld in het
      tweede lid onder a inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.56
      [ref2]: https://wetten.overheid.nl/BWBR0014765
      [ref3]: https://wetten.overheid.nl/BWBR0014765
      [ref4]: https://wetten.overheid.nl/BWBR0014765#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0014765
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel4
