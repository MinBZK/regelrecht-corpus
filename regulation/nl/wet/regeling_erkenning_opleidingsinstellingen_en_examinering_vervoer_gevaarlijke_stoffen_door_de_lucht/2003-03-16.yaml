  - number: '5'
    text: |-
      1 De erkenning wordt voor onbepaalde tijd verleend.

      2 Van de erkenning geeft de minister een bewijs af, waarop is aangegeven voor welke opleiding de erkenning is
      afgegeven.

      3 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014765
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014765
  - number: '6'
    text: |-
      Wanneer de erkenning is verleend, worden in de Staatscourant de volgende gegevens gepubliceerd:

      a. de naam van de erkende opleidingsinstelling;

      b. een omschrijving van de opleiding die door de erkende opleidingsinstelling wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel6
  - number: '7'
    text: |-
      1 Een erkenning wordt gewijzigd, nadat de houder van de erkenning heeft aangetoond, dat hij voldoet aan de eisen,
      zoals die gelden voor de erkenning, nadat deze is gewijzigd.

      2 De [artikelen 2 tot en met 6][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014765#Artikel2
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014765
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8'
    text: |-
      1 De minister stelt op voordracht van elke erkende opleidingsinstelling ieder kalenderjaar examens vast voor ieder
      type opleiding.

      2 De examens bestaan uit maximaal 10 open vragen over de onderwerpen, genoemd in [bijlage B][ref1] als bedoeld in
      [artikel 4, onder b][ref2]; meer keuze vragen worden niet gesteld.

      3 De examens worden afgenomen door de op grond van deze regeling erkende opleidingsinstellingen; de examens worden
      bijgewoond door een door de minister aangewezen gecommitteerde.

      4 De duur van de examens bedraagt voor:

      a. vervoer gevaarlijke stoffen door de lucht 2,5 uur;

      b. vervoer radioactieve stoffen door de lucht 2 uur.

      5 De minister kan een examenreglement vaststellen, waarin onder meer aanvullende voorwaarden omtrent de uitvoering
      van examens en de examinering opgenomen kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0014765
      [ref2]: https://wetten.overheid.nl/BWBR0014765#Artikel4
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014765
      - id: ref2
        bwb_id: BWBR0014765
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9'
    text: |-
      Een erkende opleidingsinstelling geeft aan de examenkandidaat ten bewijze van het met goed gevolg afgelegd hebben
      van één van de examens een certificaat inzake het vervoer van gevaarlijke stoffen door de lucht af.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel9
  - number: '10'
    text: De geldigheidsduur van het certificaat bedraagt 24 maanden.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 16 maart 2003.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling erkenning opleidingsinstellingen en examinering vervoer gevaarlijke
      stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0014765/2003-03-16#Artikel12
