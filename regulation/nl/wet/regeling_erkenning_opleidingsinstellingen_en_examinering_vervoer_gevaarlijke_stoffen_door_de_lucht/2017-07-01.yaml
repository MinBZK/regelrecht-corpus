preamble:
  text: |-
    Gelet op artikel 6.56, eerste en derde lid, van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *erkende opleidingsinstelling:* een door de minister erkende opleidingsinstelling voor het geven van opleidingen
      en het afnemen van examens ter verkrijging van een certificaat inzake het vervoer van gevaarlijke stoffen door
      de lucht;

      b. *minister:* Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel1
  - number: '2'
    text: |-
      1 Een erkenning wordt aangevraagd door indiening bij de minister van een volledig ingevuld en ondertekend
      aanvraagformulier.

      2 Exemplaren van het aanvraagformulier, bedoeld in het eerste lid, zijn kosteloos bij de minister te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel2
  - number: '3'
    text: |-
      De aanvraag voor verlening van een erkenning gaat vergezeld van:

      a. een verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de opleiding zal
      worden uitgevoerd in overeenstemming met deze regeling;

      b. een overzicht en curriculum vitae van de bij de opleiding betrokken instructeurs;

      c. een beschrijving van de accommodatie, theorie-instructievoorzieningen en theorie-examenorganisatie;

      d. een bewijs van beschikbaarheid van de vereiste trainingsuitrusting, voorzieningen en instructeurs;

      e. een organogram van de aanvrager, inclusief een korte omschrijving, en

      f. een opleidingsplan en een opleidingssyllabus; de inhoud van het plan en van de syllabus bevat in ieder geval de
      informatie als bedoeld in [Bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014765
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014765
  - number: '4'
    text: |-
      1 De minister verleent een erkenning als bedoeld in [artikel 6.56 van de Wet luchtvaart][ref1], indien de aanvrager
      aan de volgende eisen voldoet:

      a. voor wat betreft de opleidingsinstelling: de eisen, bedoeld in [Bijlage A][ref2];

      b. voor wat betreft de inhoud van de opleidingen: de eisen, bedoeld in [Bijlage B][ref3], en

      c. voor wat betreft de examinering: de eisen, bedoeld in [hoofdstuk 3][ref4] van deze regeling.

      2 De opleiding voor een erkenning houdt in:

      a. een opleiding voor handelingen ten aanzien van alle klassen met uitzondering van klasse 7; of

      b. een opleiding voor handelingen uitsluitend ten aanzien van klasse 7.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.56
      [ref2]: https://wetten.overheid.nl/BWBR0014765
      [ref3]: https://wetten.overheid.nl/BWBR0014765
      [ref4]: https://wetten.overheid.nl/BWBR0014765#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6.56'
      - id: ref2
        bwb_id: BWBR0014765
      - id: ref3
