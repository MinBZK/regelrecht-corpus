        hoofdstuk: '3'
  - number: '5'
    text: |-
      1 Een erkenning wordt voor onbepaalde tijd verleend.

      2 Van een erkenning geeft de minister een bewijs af, waarop is aangegeven voor welke opleiding de erkenning is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel5
  - number: '6'
    text: |-
      Wanneer een erkenning is verleend, worden in de Staatscourant de volgende gegevens gepubliceerd:

      a. de naam van de erkende opleidingsinstelling, en

      b. een omschrijving van de opleiding die door de erkende opleidingsinstelling wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel6
  - number: '7'
    text: |-
      1 Een erkenning wordt gewijzigd, nadat de houder van de erkenning heeft aangetoond, dat hij voldoet aan de eisen,
      zoals die gelden voor de erkenning, nadat deze is gewijzigd.

      2 De [artikelen 2 tot en met 6][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014765#Artikel2
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014765
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8'
    text: |-
      1 De minister stelt op voordracht van elke erkende opleidingsinstelling aan het eind van ieder even kalenderjaar
      examens vast voor ieder type opleiding.

      2 De examens bestaan uit maximaal 11 open vragen of meerkeuzevragen over de onderwerpen bedoeld in de van
      toepassing zijnde categorie van de bij deze regeling behorende [Bijlage B][ref1].

      3 De examens worden afgenomen door de erkende opleidingsinstellingen; de examens kunnen worden bijgewoond door een
      door de minister aangewezen gecommitteerde.

      4 De duur van de examens bedraagt voor:

      a. vervoer gevaarlijke stoffen door de lucht 2,5 uur;

      b. vervoer radioactieve stoffen door de lucht 2 uur.

      5 De minister kan een examenreglement vaststellen, waarin onder meer aanvullende voorwaarden omtrent de uitvoering
      van examens en de examinering opgenomen kunnen worden.

      6 Voor het met goed gevolg afleggen van een examen is een minimale score van zeventig punten benodigd. In afwijking
      hiervan is voor het met goed gevolg afleggen van een examen voor een E-erkenning een minimale score van negentig
      punten benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014765
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014765
  - number: '9'
    text: |-
      Een erkende opleidingsinstelling geeft aan de examenkandidaat ten bewijze van het met goed gevolg afgelegd hebben
      van één van de examens een certificaat inzake het vervoer van gevaarlijke stoffen door de lucht af.
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel9
  - number: '10'
    text: |-
      De geldigheidsduur van een certificaat als bedoeld in [artikel 9][ref1], bedraagt 24 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014765#Artikel9
    url: https://wetten.overheid.nl/BWBR0014765/2017-07-01#Artikel10
