  - number: '2'
    text: >-
      Er is een handelsregister van ondernemingen en rechtspersonen:


      a. ter bevordering van de rechtszekerheid in het economisch verkeer;


      b. voor de verstrekking van gegevens van algemene, feitelijke aard omtrent de samenstelling van ondernemingen en
      rechtspersonen ter bevordering van de economische belangen van handel, industrie, ambacht en dienstverlening;


      c. voor het registreren van alle ondernemingen en rechtspersonen als onderdeel van de gegevenshuishouding die
      bijdraagt aan het efficiënt functioneren van en de rechtshandhaving door de overheid;


      d. voor het registreren van uiteindelijk belanghebbenden ter voorkoming van het gebruik van het financiële stelsel
      voor het witwassen van geld en terrorismefinanciering.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel2
  - number: '3'
    text: >-
      1 Het handelsregister wordt gehouden door de Kamer.


      2 Ten aanzien van verwerkingen ten behoeve van het handelsregister is de Kamer verwerkingsverantwoordelijke.


      3 De Kamer kan met machtiging van Onze Minister werkzaamheden laten verrichten door een verwerker.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel3
  - number: '4'
    text: >-
      1 Onze Minister stelt bij ministeriële regeling een systeembeschrijving vast. De systeembeschrijving geeft de
      inrichting en werking van het handelsregister aan.


      2 De Kamer draagt zorg voor een goede beschikbaarheid, werking en beveiliging van het handelsregister.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel4
  - number: '5'
    text: >-
      In het handelsregister worden de volgende ondernemingen ingeschreven:


      a. een onderneming die in Nederland is gevestigd en die toebehoort aan een naamloze vennootschap, een besloten
      vennootschap met beperkte aansprakelijkheid, een vennootschap onder firma, een commanditaire vennootschap, een
      maatschap, een rederij, een coöperatie, een onderlinge waarborgmaatschappij, een vereniging, een stichting, een
      kerkgenootschap of een publiekrechtelijke rechtspersoon;


      b. een onderneming die in Nederland gevestigd is en die toebehoort aan een natuurlijke persoon;


      c. een onderneming die toebehoort aan een Europese naamloze vennootschap, een Europese coöperatieve vennootschap of
      een Europees economisch samenwerkingverband die volgens haar statuten haar zetel in Nederland heeft;


      d. een onderneming die toebehoort aan een buitenlandse rechtspersoon die een hoofd- of een nevenvestiging in
      Nederland heeft;


      e. een onderneming die in Nederland is gevestigd en die toebehoort aan een ander dan genoemd in onderdeel a tot en
      met d;


      f. een onderneming die niet in Nederland is gevestigd en die toebehoort aan een in Nederland opgerichte maatschap,
      vennootschap onder firma, commanditaire vennootschap of rederij.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel5
  - number: '6'
    text: |-
      1 In het handelsregister worden de volgende rechtspersonen die volgens hun statuten hun zetel in Nederland hebben
      ingeschreven:

      a. een naamloze vennootschap, een besloten vennootschap met beperkte aansprakelijkheid, een Europese naamloze
      vennootschap, een Europees economisch samenwerkingsverband, een Europese coöperatieve vennootschap, een coöperatie
      en een onderlinge waarborgmaatschappij;

      b. een vereniging met volledige rechtsbevoegdheid, een vereniging van eigenaars, een stichting en overige
      privaatrechtelijke rechtspersonen;

      c. een publiekrechtelijke rechtspersoon, met dien verstande dat in plaats van de Staat de ministeries, bedoeld
      in [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref1] en de dienstonderdelen van een ministerie die
      overeenkomstig [artikel 2.20 van de Comptabiliteitswet 2016][ref2] zijn aangewezen worden ingeschreven.

      2 Een vereniging zonder volledige rechtsbevoegdheid kan worden ingeschreven.

      3 Bij algemene maatregel van bestuur wordt bepaald op welke wijze de organisatie waarvan een of meer
      kerkgenootschappen deel uitmaken, wordt ingeschreven in het handelsregister en tevens kan worden bepaald of
      en in hoeverre zelfstandige onderdelen of lichamen waarin zij zijn verenigd moeten worden ingeschreven in het
      handelsregister.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      5 Bij algemene maatregel van bestuur kan worden bepaald dat, in aanvulling op het eerste lid, onderdeel c,
      onderdelen van een publiekrechtelijke rechtspersoon kunnen worden ingeschreven in het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2.20
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel6
