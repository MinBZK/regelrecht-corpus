  - number: '18'
    text: |-
      1 Tot het doen van opgave ter inschrijving in het handelsregister is verplicht degene aan wie een
      onderneming toebehoort, of, indien het de inschrijving betreft van een rechtspersoon als bedoeld in
      [artikel 6, eerste lid, onderdeel a en b, het tweede lid en derde lid][ref1], ieder der bestuurders van de
      rechtspersoon.

      2 Indien het eerste lid niet van toepassing is, is tot het doen van opgave ter inschrijving in het handelsregister
      verplicht degene die belast is met de dagelijkse leiding van een onderneming of rechtspersoon.

      3 Indien geen van de in het eerste lid bedoelde personen in Nederland is gevestigd, is tot het doen van de opgave
      tevens verplicht degene die in Nederland belast is met de dagelijkse leiding van een onderneming of rechtspersoon.

      4 Indien een onderneming of rechtspersoon buiten Nederland is gevestigd, is tot het doen van de opgave tevens
      verplicht degene die belast is met de dagelijkse leiding van de hoofdnederzetting of, indien die er niet is, de
      door de onderneming of rechtspersoon aangewezen gevolmachtigde handelsagent.

      5 Tot het doen van opgave ter inschrijving in het handelsregister is een publiekrechtelijke rechtspersoon
      verplicht.

      6 Bij algemene maatregel van bestuur kunnen andere personen worden aangewezen die verplicht of bevoegd zijn tot het
      doen van daarbij aangewezen opgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
