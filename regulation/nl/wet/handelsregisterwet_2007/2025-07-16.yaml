  - number: '39'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot:

      a. de melding, bedoeld in [artikel 32][ref1];

      b. de doorzending van de melding, bedoeld in [artikel 33][ref2];

      c. het plaatsen van de aantekening in onderzoek, bedoeld in [artikel 34, eerste lid][ref3];

      d. het besluit over de melding, bedoeld in [artikel 34, tweede lid][ref4];

      e. de gegevens die over de terugmelding en het onderzoek in het register worden opgenomen ingevolge
      [artikel 16, eerste lid][ref5];

      f. de criteria om een inschrijving te weigeren.


