        artikel: '34'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '36'
    text: |-
      1 Indien tegen een beslissing, bedoeld in [artikel 34, eerste en tweede lid][ref1], bezwaar wordt gemaakt of beroep
      wordt ingesteld, tekent, voor zover dit nog niet het geval is, de Kamer in het handelsregister aan dat een gegeven
      in onderzoek is.

      2 Nadat op het bezwaar of beroep onherroepelijk is beslist, schrijft de Kamer indien nodig een wijziging in het
      handelsregister in en verwijdert de Kamer de aantekening dat een gegeven in onderzoek is.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel34
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel36
    references:
