  - number: '7'
    text: |-
      Indien aan een rechtspersoon als bedoeld in [artikel 6][ref1] een onderneming toebehoort die als zodanig
      overeenkomstig [artikel 5][ref2] moet worden ingeschreven, geldt de inschrijving van de onderneming tevens als
      inschrijving van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel7
