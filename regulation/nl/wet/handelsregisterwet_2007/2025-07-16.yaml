  - number: '19'
    text: |-
      1 De daartoe verplichte personen doen, met inachtneming van het bij algemene maatregel van bestuur
      bepaalde, de opgaven die de Kamer nodig heeft om ervoor te zorgen dat de in [artikel 9 tot en met 14][ref1],
      [15a, tweede lid][ref2], en [16a, eerste lid][ref3], genoemde en de in [artikel 17, onderdeel a][ref4], bedoelde
      gegevens te allen tijde juist en volledig in het handelsregister ingeschreven zijn.

      2 Het eerste lid is van overeenkomstige toepassing op het deponeren van bescheiden.

      3 Op berichtenverkeer met betrekking tot enige inschrijving of doorhaling in het handelsregister tussen de
      Kamer en een onderneming, niet zijnde een dienstverrichter als bedoeld in [artikel 1 van de Dienstenwet][ref5]
      die onder de reikwijdte van [die wet][ref6] valt, zijn de [paragrafen 3.3][ref7], [3.4][ref8] en
      [artikel 5, tweede lid, van de Dienstenwet][ref9] van overeenkomstige toepassing.

      4 Regels die op grond van [artikel 5, derde lid, van de Dienstenwet][ref10] bij of krachtens algemene maatregel van
      bestuur zijn gesteld, zijn van overeenkomstige toepassing op berichtenverkeer als bedoeld in het derde lid.

      5 Het derde en vierde lid zijn niet van toepassing op:

      a. uitwisseling van gegevens of bescheiden die betrekking hebben op procedures van bezwaar, beroep of andere
      rechterlijke procedures of vormen van geschilbeslechting;

      b. het verrichten van betalingen.


