  - number: '22'
    text: |-
      1 De Kamer verstrekt op elektronisch verzoek, indien gewenst in elektronische vorm, een afschrift van of uittreksel
      uit de gegevens en bescheiden, bedoeld in [artikel 21][ref1].

      2 De Kamer verstrekt op elektronisch verzoek gegevens van algemene, feitelijke aard omtrent de samenstelling van
      ondernemingen en rechtspersonen uit het handelsregister ter bevordering van de economische belangen van handel,
      industrie, ambacht en dienstverlening. Bij het verstrekken van gegevens omtrent de samenstelling van ondernemingen
      en rechtspersonen worden deze gegevens niet gerangschikt naar natuurlijke personen.

      3 Een verzoek als bedoeld in het eerste of tweede lid wordt mede door de Kamer in behandeling genomen indien het op
      andere dan elektronische wijze is gedaan.

      4 In afwijking van het eerste lid verstrekt de Kamer een handtekening niet in elektronische vorm.

      5

      6 De Kamer geeft een uiteindelijk belanghebbende op verzoek inzicht in het aantal keer dat zijn gegevens, bedoeld
      in [artikel 15a][ref2], zijn verstrekt, met uitzondering van verstrekkingen aan de Financiële inlichtingen
      eenheid, bevoegde autoriteiten en bestuursorganen, instellingen of andere personen of rechtspersonen als bedoeld
      in [artikel 28, tweede lid][ref3]. Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de
      uiteindelijk belanghebbende inzicht kan krijgen.

      7

      8 De Kamer verstrekt aan een vennootschap of andere juridische entiteit op elektronisch verzoek, indien gewenst in
      elektronische vorm, een afschrift van haar gegevens, bedoeld in artikel 15a, tweede lid, onderdelen c en e.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel28
