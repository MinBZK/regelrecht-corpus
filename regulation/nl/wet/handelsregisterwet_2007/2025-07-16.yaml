  - number: 19a
    text: >-
      1 Bij algemene maatregel van bestuur wordt voor daarbij aangewezen rechtspersonen bepaald dat voor daarbij
      aangewezen bescheiden waarvan bij of krachtens de wet is voorgeschreven dat die bij het handelsregister worden
      gedeponeerd, deponering daarvan uitsluitend langs elektronische weg plaatsvindt en worden regels gesteld over de
      wijze waarop die deponering moet plaatsvinden.


      2 Voor aangewezen bescheiden als bedoeld in het eerste lid, waarvan de inhoud betrekking heeft op enig boekjaar,
      wordt bij de in het eerste lid bedoelde algemene maatregel van bestuur tevens bepaald vanaf welk boekjaar de in het
      eerste lid bedoelde verplichting daarop van toepassing is.


      3 De Kamer draagt zorg voor het langs elektronische weg kunnen ontvangen van aangewezen bescheiden als bedoeld in
      het eerste lid op de in dat lid genoemde algemene maatregel van bestuur vastgestelde wijze.


      4 Bij algemene maatregel van bestuur kan worden bepaald dat de Kamer ondersteunende voorzieningen beschikbaar
      stelt, voor zover dit ten behoeve van het deponeren van op grond van het eerste lid aangewezen bescheiden door op
      grond van het eerste lid aangewezen rechtspersonen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel19a
  - number: '20'
    text: |-
      1 De opgave voor de eerste inschrijving van een onderneming wordt gedaan binnen een periode van twee weken,
      die begint een week vóór en eindigt een week ná de aanvang van de bedrijfsuitoefening. De opgave voor de eerste
      inschrijving van een rechtspersoon wordt gedaan binnen één week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot inschrijving ontstaat.

      2 De andere voorgeschreven opgaven worden gedaan uiterlijk een week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot de opgave ontstaat.

      3 De verplichting tot het doen van een opgave eindigt zodra die opgave is gedaan door iemand anders die daartoe
      verplicht of bevoegd was of, voor zover de Kamer bevoegd is tot het wijzigen van gegevens, zodra de Kamer de
      desbetreffende wijziging heeft ingeschreven.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de wijze waarop gegevens in het handelsregister worden opgenomen;

      b. de termijnen voor het opnemen van gegevens in het handelsregister;

      c. de actualiteit van het overnemen van een gegeven uit een ander basisregister.

      5 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een opgave ter inschrijving in
      het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
