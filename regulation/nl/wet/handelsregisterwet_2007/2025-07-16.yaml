  - number: 16b
    text: |-
      1 In het handelsregister wordt over een rechtspersoon dan wel een onderneming een indicatie van het aantal
      arbeidsverhoudingen opgenomen, samengesteld op basis van gegevens uit de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], met een aanduiding van de
      verhouding naar in ieder geval geslacht en arbeidsduur.

      2 Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste lid, betreffende in ieder
      geval de werkwijze omtrent het opnemen van de indicatie van het aantal arbeidsverhoudingen in het handelsregister
      en de samenstelling van die indicatie.

      3 De [artikelen 25][ref2] en [32, derde en vierde lid][ref3], zijn niet van toepassing op de in het eerste lid
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
