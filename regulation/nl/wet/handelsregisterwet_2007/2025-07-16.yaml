        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: 15a
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '58'
    text: >-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze betrokken Ministers, gegevens worden aangewezen die
      eenmalig worden gebruikt om ondernemingen en rechtspersonen die thans niet in het handelsregister zijn opgenomen,
      in te schrijven in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel58
  - number: '59'
    text: |-
      1 In afwijking van [artikel 30][ref1] kunnen gedurende zes jaar na de inwerkingtreding van artikel 30 bij
      ministeriële regeling, in overeenstemming met Onze betrokken Ministers, bestuursorganen worden aangewezen voor wie
      de in artikel 30 genoemde verplichting uitsluitend geldt.

      2 In afwijking van [artikel 32][ref2] kunnen gedurende zes jaar na de inwerkingtreding van artikel 32 bij
      ministeriële regeling, in overeenstemming met Onze betrokken Ministers, bestuursorganen worden aangewezen voor wie
      de in artikel 32 genoemde verplichting uitsluitend geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel30
