        artikel: 1:1
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '32'
        hoofdstuk: '6'
  - number: '31'
    text: |-
      Een onderneming of rechtspersoon aan wie door een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] een gegeven wordt gevraagd, waarop
      [artikel 30, eerste lid][ref2], van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover
      het gegeven noodzakelijk wordt geacht voor een deugdelijke vaststelling van de identiteit van de onderneming of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel30
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel31
