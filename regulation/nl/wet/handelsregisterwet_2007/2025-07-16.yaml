  - number: '16'
    text: |-
      1 In het handelsregister worden gegevens opgenomen die noodzakelijk zijn voor een goede vastlegging en verstrekking
      van de in [artikel 9 tot en met 14][ref1] bedoelde gegevens en gegevens omtrent de herkomst van die gegevens.

      2 In het handelsregister wordt indien een gegeven in onderzoek is, een aantekening opgenomen dat het gegeven in
      onderzoek is.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
