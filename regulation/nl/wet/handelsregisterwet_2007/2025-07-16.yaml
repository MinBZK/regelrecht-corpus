        paragraaf: '5.2'
  - number: '32'
    text: |-
      1 Een bestuursorgaan als bedoeld in [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1]
      dat gerede twijfel heeft over de juistheid van een authentiek gegeven dat hij verstrekt heeft gekregen uit het
      handelsregister, doet hiervan melding aan de Kamer.

      2 Een bestuursorgaan als bedoeld in [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref2]
      dat gerede twijfel heeft over de juistheid van het ontbreken van een authentiek gegeven in het handelsregister,
      doet hiervan melding aan de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel11
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel32
