  - number: '38'
    text: |-
      1 Indien de Kamer gerede twijfel heeft over de juistheid van authentieke gegevens, zijn de
      [artikelen 33 tot en met 36][ref1] van overeenkomstige toepassing.

      2 Bij algemene maatregel van bestuur kunnen niet-authentieke gegevens worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.

      3 Op een verzoek als bedoeld in de artikelen 16 en 17 van de Algemene verordening gegevensbescherming, zijn de
      [artikelen 33 tot en met 36][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel33
