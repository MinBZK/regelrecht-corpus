        artikel: 1:1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 1:1
  - number: '33'
    text: |-
      Indien de melding betrekking heeft op een gegeven dat ingevolge [artikel 17, onderdeel b][ref1], uit een ander
      register is overgenomen, zendt de Kamer deze melding aan de beheerder van het register waaruit dit gegeven
      afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel17
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '34'
    text: |-
      1 Indien een melding als bedoeld in [artikel 32, eerste lid][ref1], niet is doorgezonden naar de beheerder van een
      ander register, tekent de Kamer binnen een bij ministeriële regeling vastgestelde termijn aan dat het gegeven in
      onderzoek is, tenzij de Kamer binnen deze termijn beslist over de wijziging van dat gegeven.

      2 Indien een gegeven in onderzoek is, beslist de Kamer over wijziging van dat gegeven.

      3 Indien een beslissing, bedoeld in het eerste of tweede lid, leidt tot wijziging van de gegevens, doet de Kamer
      onverwijld schriftelijk mededeling aan een tot opgave verplichte persoon.

      4 De Kamer verwijdert de aantekening dat een gegeven in onderzoek is indien een besluit als bedoeld in het tweede
      lid niet tot wijziging van gegevens leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel32
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '32'
        hoofdstuk: '6'
  - number: '35'
    text: |-
      De beslissing, bedoeld in [artikel 34, tweede lid][ref1], geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel35
    references:
