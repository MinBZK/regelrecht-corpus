  - number: '11'
    text: >-
      1 In het handelsregister worden over een vestiging van een onderneming opgenomen:


      a. een door de Kamer toegekend uniek nummer;


      b. de handelsnaam of handelsnamen;


      c. het post- en bezoekadres;


      d. de datum van ingebruikname en beëindiging.


      2 Indien een onderneming meerdere vestigingen heeft, wordt in het handelsregister opgenomen welke vestiging de
      hoofdvestiging of de hoofdnederzetting is.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel11
  - number: '12'
    text: >-
      In het handelsregister worden over een rechtspersoon opgenomen:


      a. een door de Kamer toegekend uniek nummer;


      b. de naam;


      c. de rechtsvorm en de statutaire zetel;


      d. de datum van aanvang of beëindiging;


      e. de identificatiecode voor juridische entiteiten (Legal Entity Identifier) volgens een door Onze Minister
      aangewezen norm van het Nederlands Normalisatie-Instituut, die de Kamer of een andere tot uitgifte van de LEI
      geaccrediteerde instantie uitgeeft aan een in het handelsregister ingeschreven rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel12
  - number: '13'
    text: >-
      In het handelsregister worden over een activiteit van een rechtspersoon waaraan geen onderneming toebehoort
      opgenomen:


      a. een door de Kamer toegekend uniek nummer voor de activiteiten van de rechtspersoon, tenzij er sprake is van een
      publiekrechtelijke rechtspersoon;


      b. de datum van aanvang, voortzetting of beëindiging;


      c. de vestigingen.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel13
  - number: '14'
    text: >-
      1 In het handelsregister worden over een vestiging van een rechtspersoon waaraan geen onderneming toebehoort
      opgenomen:


      a. een door de Kamer toegekend uniek nummer;


      b. de naam;


      c. het post- en bezoekadres;


      d. de datum van ingebruikname of beëindiging.


      2 Indien een rechtspersoon meerdere vestigingen heeft, wordt in het handelsregister opgenomen welke vestiging de
      hoofdvestiging of de hoofdnederzetting is.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel14
  - number: '15'
    text: |-
      De in [artikel 9 tot en met 14][ref1] genoemde gegevens zijn authentieke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
