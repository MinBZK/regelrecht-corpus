  - number: '8'
    text: >-
      Bij algemene maatregel van bestuur:


      a. kunnen andere rechtspersonen worden aangewezen die worden ingeschreven in het handelsregister indien dit
      noodzakelijk is voor het toereikend functioneren van het handelsregister;


      b. kan nader worden bepaald wanneer sprake is van een onderneming.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel8
  - number: '9'
    text: >-
      In het handelsregister worden over een onderneming opgenomen:


      a. een door de Kamer toegekend uniek nummer;


      b. de handelsnaam of de handelsnamen;


      c. de datum van aanvang, voortzetting of beëindiging;


      d. degene aan wie de onderneming toebehoort;


      e. de vestigingen;


      f. de identificatiecode voor juridische entiteiten (Legal Entity Identifier) volgens een door Onze Minister
      aangewezen norm van het Nederlands Normalisatie-Instituut, die de Kamer of een andere tot uitgifte van de LEI
      geaccrediteerde instantie uitgeeft aan een in het handelsregister ingeschreven onderneming.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel9
  - number: '10'
    text: |-
      1 In het handelsregister worden over degene aan wie een onderneming toebehoort, indien deze een rechtspersoon is,
      de in [artikel 12][ref1] genoemde gegevens opgenomen.

      2 In het handelsregister worden over degene aan wie een onderneming toebehoort, indien deze een natuurlijke persoon
      is, opgenomen:

      a. het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref2], het geslacht, de geboorteplaats
      en het geboorteland;

      b. de naam;

      c. het adres;

      d. de geboortedatum;

      e. de datum van overlijden.

      3 In het handelsregister worden over degene aan wie een onderneming toebehoort, die geen rechtspersoon en geen
      natuurlijke persoon is, opgenomen:

      a. een door de Kamer toegekend uniek nummer;

      b. de naam;

      c. de datum van aanvang, voortzetting of beëindiging;

      d. de rechtsvorm;

      e. de leden, maten of vennoten, met uitzondering van de commanditaire vennoten, en:

      1°. indien deze natuurlijke personen zijn,

      - het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3], het geslacht, de geboorteplaats
      en het geboorteland,
      - de naam,
      - het adres,
      - de geboortedatum,
      - de datum van overlijden;

      2°. indien deze geen natuurlijke personen zijn,

      - een door een kamer toegekend uniek nummer;
      - de naam;
      - de rechtsvorm en de statutaire zetel,
      - de datum van aanvang of beëindiging.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel10
