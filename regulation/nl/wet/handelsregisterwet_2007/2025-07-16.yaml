  - number: '61'
    text: |-
      Bij algemene maatregel van bestuur kan gedurende vier jaar na inwerkingtreding van [artikel 2][ref1], met het oog
      op een goede invoering van deze wet regels stellen waarbij zo nodig kan worden afgeweken van het bepaalde bij en
      krachtens deze wet.


