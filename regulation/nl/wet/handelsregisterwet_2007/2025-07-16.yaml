  - number: '28'
    text: |-
      1 De in [artikel 10, tweede lid, onderdeel a, en derde lid, onderdeel e, onder 1°, eerste gedachtestreepje][ref1],
      en [artikel 16, eerste lid][ref2], bedoelde gegevens kunnen worden ingezien door een bestuursorgaan in het kader
      van de uitoefening van zijn wettelijke taak of bevoegdheid of een rechtspersoon met een overheidstaak als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ___ in het kader van de uitoefening van zijn wettelijke bevoegdheid.

      2 De in [artikel 15a, tweede lid][ref4], genoemde gegevens en de in artikel 15a, derde lid, genoemde bescheiden
      kunnen worden ingezien door:

      a. de Financiële inlichtingen eenheid en een bij algemene maatregel van bestuur aangewezen bevoegde autoriteit;

      b. een op grond van [artikel 10, eerste lid, van de Sanctiewet 1977][ref5] aangewezen ambtenaar of andere persoon
      in het kader van het uitoefenen van het toezicht op de naleving van het bij of krachtens die wet bepaalde;

      c. een krachtens [artikel 10, tweede lid, van de Sanctiewet 1977][ref6] door Onze Minister van Financiën aangewezen
      rechtspersoon in het kader van het toezicht op de naleving van het bij of krachtens [afdeling 5 van die wet][ref7]
      bepaalde met betrekking tot het financieel verkeer;

      d. bij algemene maatregel van bestuur aangewezen bestuursorganen en rechtspersonen met een overheidstaak, voor
      zover dit noodzakelijk is in het kader van de uitoefening van een taak of bevoegdheid waar bestuursorganen en
      rechtspersonen met een overheidstaak bij of krachtens de wet dan wel bij of krachtens een verordening als bedoeld
      in artikel 288 van het Verdrag betreffende de werking van de Europese Unie mee zijn belast;

      e. de instellingen, genoemd in artikel 11, eerste lid, onderdelen e tot en met h, van [Richtlijn (EU) 2024/1640]
      (32024L1640) van het Europees Parlement en de Raad van 31 mei 2024 betreffende de mechanismen die de lidstaten
      moeten invoeren om het gebruik van het financiële stelsel voor witwassen of terrorismefinanciering te voorkomen,
      tot wijziging van [Richtlijn (EU) 2019/1937](32019L1937), en tot wijziging en intrekking van [Richtlijn (EU)
      2015/849](32015L0849) (PbEU 2024, L 2024/1640).

      3 [Artikel 22][ref8] is van overeenkomstige toepassing op verstrekking van gegevens als bedoeld in het eerste of
      tweede lid.

      4 Bij het verstrekken van gegevens omtrent de samenstelling van ondernemingen en rechtspersonen worden deze
      gegevens uitsluitend gerangschikt naar natuurlijke personen, indien het verzoek daartoe wordt gedaan door een bij
      algemene maatregel van bestuur aangewezen bestuursorgaan of rechtspersoon met een overheidstaak als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___ in het kader van de uitoefening van zijn wettelijke taak of bevoegdheid.

      5 Bij het verstrekken van gegevens en bescheiden omtrent de uiteindelijk belanghebbenden worden deze gegevens
      uitsluitend gerangschikt naar natuurlijke personen, indien het verzoek daartoe wordt gedaan door de Financiële
      inlichtingen eenheid of een krachtens het tweede lid aangewezen bevoegde autoriteit, bestuursorgaan, instelling
      of andere persoon of rechtspersoon, voor zover de Financiële inlichtingen eenheid of die bevoegde autoriteit,
      bestuursorgaan, instelling of andere persoon of rechtspersoon handelt in het kader van de uitoefening van haar
      wettelijke taak of bevoegdheid.

      6 De Kamer verstrekt de gegevens en bescheiden omtrent een uiteindelijk belanghebbende aan de Financiële
      inlichtingen eenheid of aan een krachtens het tweede lid aangewezen bevoegde autoriteit, bestuursorgaan, instelling
      of andere persoon of rechtspersoon op een zodanige wijze dat de vennootschap of andere juridische entiteit, bedoeld
      in [artikel 15a, eerste lid][ref10], geen weet heeft van de verstrekking.


