  - number: '60'
    text: |-
      In afwijking van [artikel 41][ref1] geschiedt de controle, bedoeld in [artikel 41][ref2], gedurende zes jaar na de
      inwerkingtreding van [artikel 41][ref3], eens per twee jaar.


