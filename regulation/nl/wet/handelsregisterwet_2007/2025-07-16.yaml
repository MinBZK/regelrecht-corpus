preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een goede vervulling van publiekrechtelijke
    taken wenselijk is om het handelsregister uit te breiden en om te vormen tot een basisregister van ondernemingen
    en rechtspersonen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      b. onderneming: een onderneming als bedoeld in [artikel 5][ref1];

      c. rechtspersoon: een rechtspersoon als bedoeld in [artikel 6][ref2];

      d. publiekrechtelijke rechtspersoon: een publiekrechtelijke rechtspersoon als bedoeld in
      [artikel 1 van Boek 2 van het Burgerlijk Wetboek][ref3];

      e. kerkgenootschap: een kerkgenootschap als bedoeld in [artikel 2 van Boek 2 van het Burgerlijk Wetboek][ref4];

      f. basisregister: een verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;

      g. authentiek gegeven: een in een basisregister opgenomen gegeven dat bij of krachtens wet als authentiek wordt
      aangemerkt;

      h. handelsregister: het register, bedoeld in [artikel 2][ref5];

      i. Kamer: de Kamer van Koophandel, genoemd in [artikel 2 van de Wet op de Kamer van Koophandel][ref6];

      j. vestiging: een gebouw of complex van gebouwen waar duurzame uitoefening van de activiteiten van een onderneming
      of rechtspersoon plaatsvindt;

      k. hoofdvestiging: een door een onderneming of een rechtspersoon als zodanig aangemerkte vestiging;

      l. nevenvestiging: een vestiging niet zijnde de hoofdvestiging;

      m. hoofdnederzetting: een in Nederland gelegen nevenvestiging van een buiten Nederland gevestigde onderneming
      of rechtspersoon of, indien er meer nevenvestigingen zijn, de door een onderneming of rechtspersoon als
      hoofdnederzetting aangemerkte nevenvestiging;

      n. [verordening 2137/85](31985R2137): [verordening (EEG) nr. 2137/85](31985R2137) van de Raad van de Europese
      Gemeenschappen van 25 juli 1985 tot instelling van Europese economische samenwerkingsverbanden (EESV) (PbEG L 199);

      o. [verordening 2157/2001](32001R2157): [verordening (EG) nr. 2157/2001](32001R2157) van de Raad van de Europese
      Unie van 8 oktober 2001 betreffende het statuut van de Europese vennootschap (SE) (PbEG L 294);

      p. uiteindelijk belanghebbende: uiteindelijk belanghebbende als bedoeld in [artikel 10a, eerste lid, van de Wet ter
      voorkoming van witwassen en financieren van terrorisme](onbekend);

      q. Financiële inlichtingen eenheid: de Financiële inlichtingen eenheid, bedoeld in
      [artikel 12, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref7].

      2 Onder publiekrechtelijke rechtspersoon wordt mede verstaan een Europese groepering voor territoriale samenwerking
      als bedoeld in artikel 1 van verordening (EG) nr. 1082/2006 van het Europees Parlement en de Raad van de Europese
      Unie van 5 juli 2006 betreffende een Europese groepering voor territoriale samenwerking (EGTS) (PbEU L 210).


