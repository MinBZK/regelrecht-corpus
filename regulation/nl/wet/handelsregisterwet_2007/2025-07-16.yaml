        artikel: '34'
        hoofdstuk: '6'
  - number: '37'
    text: |-
      Op een melding als bedoeld in [artikel 32, tweede lid][ref1], zijn de [artikelen 33][ref2],
      [34, tweede en derde lid][ref3], [35][ref4] en [36][ref5] van overeenkomstige toepassing.


