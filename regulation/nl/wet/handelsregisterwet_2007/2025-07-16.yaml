  - number: 22a
    text: |-
      1 De in [artikel 15a, tweede lid, onderdelen c en e][ref1], bedoelde gegevens kunnen worden ingezien door:

      a. een instelling als bedoeld in
      [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] ten behoeve
      van een op grond van die wet of de Wet toezicht trustkantoren 2018 verplicht cliëntenonderzoek;

      b. een instelling als bedoeld in [artikel 10, tweede lid, onderdelen a tot en met m, van de Sanctiewet 1977][ref3]
      ten behoeve van de naleving van de bij of krachtens [afdeling 5 van die wet][ref4] bepaalde verplichtingen met
      betrekking tot het financieel verkeer.

      2 Voor zover zij een aantoonbaar legitiem belang hebben bij inzage van de in het eerste lid bedoelde gegevens,
      kunnen die gegevens op verzoek tevens worden ingezien door bij algemene maatregel van bestuur aan te wijzen
      categorieën van natuurlijke personen en rechtspersonen. Dit legitiem belang houdt verband met het voorkomen of
      bestrijden van witwassen, daarmee verband houdende basisdelicten, of financieren van terrorisme.

      3 Indien een verzoek als bedoeld in het tweede lid is toegewezen, stelt de kamer de uiteindelijk belanghebbende op
      wiens gegevens het verzoek ziet daarvan op de hoogte, alsmede van welk doel het verzoek dient.

      4 [Artikel 22][ref5] is van overeenkomstige toepassing op verstrekking van gegevens als bedoeld in het eerste of
      tweede lid.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de wijze waarop de in het eerste en tweede lid bedoelde gegevens kunnen worden ingezien;

      b. de bij het inzien van die gegevens te stellen voorschriften;

      c. de wijze waarop een legitiem belang als bedoeld in het tweede lid kan worden aangetoond;

      d. het in behandeling nemen van een aanvraag om gegevens in te zien voor personen en rechtspersonen met een
      legitiem belang als bedoeld in het tweede lid en de beslissing op deze aanvraag; en

      e. het verlenen van een certificaat of het weigeren, opschorten of intrekken van de toegang, bedoeld in artikel 13,
      zesde tot en met achtste lid en tiende lid, van [Richtlijn (EU) 2024/1640](32024L1640) van het Europees Parlement
      en de Raad van 31 mei 2024 betreffende de mechanismen die de lidstaten moeten invoeren om het gebruik van het
      financiële stelsel voor witwassen of terrorismefinanciering te voorkomen, tot wijziging van [Richtlijn (EU)
      2019/1937](32019L1937), en tot wijziging en intrekking van [Richtlijn (EU) 2015/849](32015L0849) (PbEU 2024,
      L 2024/1640).

      6 De in [artikel 15a, tweede lid en derde lid][ref6], genoemde gegevens en bescheiden kunnen worden ingezien
      door degene die tot het doen van opgave ter inschrijving in het handelsregister is verplicht voor zover het die
      vennootschap of de andere juridische entiteit betreft.

      7 De voordracht voor een krachtens het tweede of vierde lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


