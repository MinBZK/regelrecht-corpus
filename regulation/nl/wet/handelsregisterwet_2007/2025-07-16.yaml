  - number: '24'
    text: >-
      1 Heeft de opgave van een gegeven ter inschrijving in het handelsregister betrekking op een naamloze vennootschap,
      een besloten vennootschap met beperkte aansprakelijkheid, een Europese naamloze vennootschap, een Europees
      economisch samenwerkingsverband, een Europese coöperatieve vennootschap of een andere bij algemene maatregel van
      bestuur aangewezen rechtspersoon of vennootschap, dan draagt de Kamer er zorg voor dat daarvan zo spoedig mogelijk
      mededeling wordt gedaan in een door Onze Minister aangewezen publicatieblad of een ander, even doeltreffend
      instrument, dat ten minste het gebruik van een systeem omvat dat in chronologische volgorde via een centraal
      elektronisch platform toegang tot de openbaar gemaakte informatie biedt.


      2 Het eerste lid is mede van toepassing op een wijziging van het ingeschrevene en op een deponering van bescheiden.


      3 Bij algemene maatregel van bestuur kunnen gegevens en bescheiden worden aangewezen waarvoor het eerste of tweede
      lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel24
  - number: '25'
    text: |-
      1 Op een feit dat door inschrijving of deponering moet worden bekendgemaakt, kan tegenover derden die daarvan
      onkundig waren geen beroep worden gedaan zolang de inschrijving of deponering en, voor zover van toepassing, de in
      [artikel 24][ref1] bedoelde mededeling niet hebben plaatsgevonden.

      2 Indien de derde aantoont dat hij onmogelijk kennis heeft kunnen nemen van een mededeling als bedoeld in
      [artikel 24][ref2] kan hij zich erop beroepen dat hij van het bekendgemaakte feit onkundig was, mits dit beroep
      betrekking heeft op hetgeen heeft plaatsgevonden binnen vijftien dagen nadat de mededeling was geschied. De
      [Algemene Termijnenwet][ref3] is op deze termijn niet van toepassing.

      3 Degene aan wie een onderneming toebehoort, de ingeschreven rechtspersoon of degene die enig feit heeft
      opgegeven of verplicht is enig feit op te geven, kan aan derden die daarvan onkundig waren niet de onjuistheid
      of onvolledigheid van de inschrijving of van de in [artikel 24][ref4] bedoelde mededeling tegenwerpen. Met de
      inschrijving wordt de deponering van bescheiden gelijkgesteld.

      4 Dit artikel is niet van toepassing ten aanzien van:

      a. artikel 811, tweede lid, van Boek 7 van het Burgerlijk Wetboek;

      b. opgaven betreffende aangelegenheden die ingevolge enig wettelijk voorschrift – niet zijnde
      [Boek 2 van het Burgerlijk Wetboek][ref5], [verordening 2137/85](31985R2137) of [verordening 2157/2001](32001R2157)
      – ook op andere wijze worden bekend gemaakt;

      c. de bij algemene maatregel van bestuur aangewezen gegevens;

      d. de gegevens, bedoeld in [artikel 15a, tweede lid][ref6], en de bescheiden, bedoeld in artikel 15a, derde lid.


