  - number: '29'
    text: |-
      1 De Kamer registreert bij het handelsregister:

      a. de bij onherroepelijke uitspraak uitgesproken ontzetting uit het beroep van een bestuurder dan wel commissaris
      van een rechtspersoon, bedoeld in [artikel 28, eerste lid, sub 5°, van het Wetboek van Strafrecht][ref1], voor de
      duur waarvoor het is opgelegd;

      b. het bij onherroepelijke uitspraak uitgesproken ontslag van een bestuurder, alsmede de termijn van vijf
      jaar na het ontslag dat de ontslagen bestuurder geen bestuurder van een stichting kan worden, bedoeld in
      [artikel 298, eerste lid, respectievelijk derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      2 Daartoe doet de griffier van de rechtbank of, in geval van hoger beroep, het gerechtshof, de betreffende
      uitspraak met bekwame spoed aan de Kamer toekomen, die overeenkomstig de uitspraak terstond overgaat tot
      uitschrijving van de betrokken bestuurder uit het handelsregister.

      3 Bij algemene maatregel van bestuur wordt bepaald welke gegevens in verband met de in het eerste lid,
      respectievelijk [artikel 106b, derde lid, van de Faillissementswet][ref3] bedoelde uitspraak bij het
      handelsregister worden geregistreerd en welke daarvan door een ieder kunnen worden ingezien.

      4 De op grond van het derde lid bij het handelsregister geregistreerde gegevens blijven gedurende
      acht jaar na het verstrijken van een bestuursverbod beschikbaar voor een bij algemene maatregel
      van bestuur aangewezen bestuursorgaan of rechtspersoon met een overheidstaak als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___ in het kader van de uitoefening van zijn wettelijke taak of bevoegdheid.

      5 De betrokken bestuurder of commissaris kan bij de Kamer een opgave doen om ervoor te zorgen dat de gegevens,
      bedoeld in het derde lid, juist en volledig bij het handelsregister zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel298
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel106b
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel1
