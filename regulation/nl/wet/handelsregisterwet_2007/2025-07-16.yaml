  - number: 38a
    text: |-
      1 Een instelling als bedoeld in [artikel 22a, eerste lid, onderdeel b][ref1], of een krachtens
      [artikel 28, tweede lid][ref2], aangewezen bevoegde autoriteit of bestuursorgaan of andere persoon of
      rechtspersoon doet melding aan de Kamer van iedere discrepantie die zij aantreft tussen een gegeven omtrent een
      uiteindelijk belanghebbende dat zij verstrekt heeft gekregen uit het handelsregister en de informatie over die
      uiteindelijk belanghebbende waarover zij uit anderen hoofde beschikt.

      2 Het eerste lid is niet van toepassing indien nakoming van de in dat lid neergelegde verplichting de uitoefening
      van de wettelijke taak of bevoegdheid van de betreffende bevoegde autoriteit onnodig zou doorkruisen.

      3 Op een melding als bedoeld in het eerste lid is het bepaalde bij of krachtens de [artikelen 33][ref3],
      [34][ref4], [35][ref5] en [36][ref6] van toepassing.

      4 Bij een melding als bedoeld in het eerste lid verstrekt een instelling of aangewezen bevoegde autoriteit,
      bestuursorgaan of andere persoon of rechtspersoon de gegevens, bedoeld in [artikel 15a, tweede lid][ref7],
      waarover zij beschikt en kan zij de bescheiden, bedoeld in artikel 15a, derde lid, verstrekken waarover zij
      beschikt.

      5 De Kamer bepaalt de wijze waarop een melding als bedoeld in het eerste lid wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22a
