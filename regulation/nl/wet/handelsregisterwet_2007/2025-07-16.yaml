  - number: 47c
    text: |-
      1 Onze Minister van Financiën is bevoegd van een vennootschap of andere juridische entiteit waarvan op
      grond van [artikel 15a, eerste lid][ref1], de uiteindelijk belanghebbenden zijn ingeschreven in het
      handelsregister, inlichtingen te vorderen die hij redelijkerwijs voor de vervulling van zijn taak, bedoeld in
      de [artikelen 47a][ref2] en [47b][ref3], nodig heeft. De vennootschappen en andere juridische entiteiten zijn
      verplicht aan Onze Minister van Financiën binnen de door hem gestelde redelijke termijn alle medewerking te
      verlenen die deze redelijkerwijs kan vorderen bij de uitvoering van deze bevoegdheid.

      2 Het eerste lid is van overeenkomstige toepassing op een instelling die een melding als bedoeld in
      [artikel 10c, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4] heeft
      gedaan.


