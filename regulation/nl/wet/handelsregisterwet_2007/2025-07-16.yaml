  - number: 15a
    text: |-
      1 In het handelsregister wordt opgenomen wie de uiteindelijk belanghebbende is of de uiteindelijk
      belanghebbenden zijn van vennootschappen of andere juridische entiteiten als bedoeld in
      [artikel 10a, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] die
      overeenkomstig de [artikelen 5][ref2] of [6, eerste of derde lid][ref3], zijn ingeschreven in het handelsregister,
      met uitzondering van verenigingen van eigenaars en overige privaatrechtelijke rechtspersonen als bedoeld in
      [artikel 6, eerste lid, onderdeel b][ref4].

      2 In het handelsregister wordt over een uiteindelijk belanghebbende opgenomen:

      a. het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref5], indien dat aan hem is
      toegekend;

      b. een fiscaal identificatienummer van een ander land dan Nederland waarvan hij ingezetene is, indien dat door zijn
      woonstaat aan hem is toegekend;

      c. de naam, de geboortemaand en het geboortejaar, de woonstaat en de nationaliteit;

      d. de geboortedag, de geboorteplaats, het geboorteland en het woonadres;

      e. de aard van het door de uiteindelijk belanghebbende gehouden economische belang en de omvang van dit belang,
      aangeduid in bij algemene maatregel van bestuur vast te stellen klassen.

      3 In het handelsregister worden ten aanzien van een uiteindelijk belanghebbende gedeponeerd:

      a. afschriften van de documenten op grond waarvan de gegevens, bedoeld in het tweede lid, onderdelen a, b, c en d,
      zijn geverifieerd;

      b. afschriften van de documenten, behorende tot bij algemene maatregel van bestuur aan te wijzen categorieën,
      waaruit de aard en omvang van het economische belang, bedoeld in het tweede lid, onderdeel e, blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel10a
