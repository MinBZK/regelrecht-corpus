        artikel: '33'
  - number: 50a
    text: >-
      De Kamer is bevoegd de betaling van een vergoeding of bijdrage af te dwingen door het uitvaardigen van een
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel50a
  - number: 50b
    text: |-
      1 Voor de identificatiecode voor juridische entiteiten (Legal Entity Identifier), bedoeld in de
      [artikelen 9, onderdeel f][ref1], en [12, onderdeel e][ref2], welke door de Kamer wordt uitgegeven, is een bij
      of krachtens algemene maatregel van bestuur te bepalen eenmalige uitgiftevergoeding en een jaarlijkse vergoeding
      verschuldigd.

      2 De in het eerste lid bedoelde vergoedingen zijn verschuldigd zonder dat deze bij beschikking zijn vastgesteld.

      3 Bij algemene maatregel van bestuur wordt de betalingstermijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel12
