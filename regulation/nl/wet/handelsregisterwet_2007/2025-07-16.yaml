  - number: 16a
    text: |-
      1 In het handelsregister wordt de door een publiekrechtelijke rechtspersoon verleende volmacht tot het verrichten
      van privaatrechtelijke rechtshandelingen opgenomen.

      2 [Artikel 25][ref1] is niet van toepassing op de in het eerste lid bedoelde gegevens.


