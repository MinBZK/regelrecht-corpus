    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald:

      a. dat andere gegevens dan de in [artikel 9 tot en met 14][ref1] genoemde gegevens in het handelsregister worden
      opgenomen of dat bescheiden bij het handelsregister worden gedeponeerd voor zover dit van belang is voor de in
      [artikel 2][ref2] genoemde doelen en er geen gewichtige redenen zijn die zich daartegen verzetten;

      b. dat in het handelsregister opgenomen gegevens worden overgenomen uit een ander basisregister;

      c. dat voor de in [artikel 6, eerste lid, onderdeel c][ref3], en [artikel 6, derde lid][ref4], bedoelde
      rechtspersonen bepaalde in [artikel 12][ref5], [13][ref6] en [14][ref7] bedoelde gegevens niet behoeven te worden
      ingeschreven.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


