  - number: '63'
    text: >-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel63
  - number: '64'
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel64
  - number: '65'
    text: >-
      Deze wet wordt aangehaald als: Handelsregisterwet met vermelding van het jaartal van het Staatsblad waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel65
