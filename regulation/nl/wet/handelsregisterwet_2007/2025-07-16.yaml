  - number: '48'
    text: |-
      De Kamer draagt zorg voor een procedure voor de behandeling van klachten over de uitvoering van deze wet. Bij
      de behandeling van klachten wordt de procedure, bedoeld in [titel 9.1 van de Algemene wet bestuursrecht][ref1]
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '49'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat een onderneming of rechtspersoon die een
      opgave doet tot eerste inschrijving in het handelsregister daarvoor eenmalig een vergoeding verschuldigd is
      (inschrijfvergoeding). De voordracht voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      2 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld voor het bepalen van de hoogte
      van de inschrijfvergoeding waarbij rechtsvorm van de onderneming of rechtspersoon en de wijze waarop opgave wordt
      gedaan in aanmerking kunnen worden genomen.

      3 Zelfstandige onderdelen van een kerkgenootschap en lichamen waarin zij zijn verenigd zijn de
      inschrijfvergoeding, bedoeld in het eerste lid, niet verschuldigd bij een opgave ter inschrijving ingevolge
      [artikel 6, derde lid][ref1].

      4 De inschrijfvergoeding is verschuldigd zonder dat deze bij beschikking is vastgesteld.

      5 Bij algemene maatregel van bestuur wordt de betalingstermijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '50'
    text: |-
      1 Voor de inzage of de verstrekking van gegevens is een bij of krachtens algemene maatregel van bestuur te bepalen
      vergoeding verschuldigd, welke kan variëren naar de wijze van inzage of verstrekking van gegevens en de hoeveelheid
      gegevens.

      2 [Artikel 9a, derde lid, van de Wet hergebruik van overheidsinformatie](onbekend) is van toepassing op de
      vergoeding, bedoeld in het eerste lid.

      3 De verplichting tot betaling van een vergoeding als bedoeld in het eerste lid geldt niet indien
      het verzoek om gegevens wordt gedaan door de directeur-generaal van de statistiek op grond van
      [artikel 33, vierde lid, van de Wet op het Centraal bureau voor de statistiek][ref1].

      4 De in het eerste lid bedoelde vergoeding is verschuldigd zonder dat dit bij beschikking is vastgesteld.

      5 Bij algemene maatregel van bestuur wordt de betalingstermijn vastgesteld.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      bestuursorganen door wie, de gevallen waarin en de voorwaarden waaronder de vergoeding voor de inzage of de
      verstrekking van gegevens door middel van een abonnement wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel50
    references:
      - id: ref1
