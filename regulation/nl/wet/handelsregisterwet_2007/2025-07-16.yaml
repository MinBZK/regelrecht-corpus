  - number: '30'
    text: |-
      1 Een bestuursorgaan als bedoeld in [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1]
      dat bij de vervulling van zijn taak informatie over een onderneming of rechtspersoon nodig heeft die in de vorm van
      een authentiek gegeven beschikbaar is in het handelsregister, gebruikt voor die informatie dat gegeven.

      2 Het eerste lid is niet van toepassing indien:

      a. in het handelsregister is opgenomen dat een gegeven in onderzoek is;

      b. het bestuursorgaan een melding doet als bedoeld in [artikel 32, eerste lid][ref2];

      c. bij wettelijk voorschrift anders is bepaald;

      d. een goede vervulling van de taak van het bestuursorgaan door de onverkorte toepassing van het eerste lid wordt
      belet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel32
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel30
    references:
      - id: ref1
