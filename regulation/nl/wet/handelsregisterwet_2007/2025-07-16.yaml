  - number: '40'
    text: De Kamer treft maatregelen die ertoe strekken te waarborgen dat het handelsregister juist, actueel en volledig is.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel40
  - number: '41'
    text: |-
      1 De Kamer laat eens per drie jaar de uitvoering van deze wet alsmede de juistheid van de
      in het handelsregister opgenomen gegevens controleren door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels betreffende de controle worden gesteld,
      waaronder regels omtrent de elementen die de controle moet bevatten.

      3 De Kamer zendt aan Onze Minister een afschrift van de controleresultaten en maakt deze controleresultaten
      openbaar. Onze Minister zendt een uittreksel van deze controleresultaten aan de Autoriteit persoonsgegevens.

      4 Indien uit de controle, bedoeld in het eerste lid, blijkt dat niet voldaan wordt aan bij of krachtens
      algemene maatregel van bestuur te stellen voorwaarden, laat de Kamer binnen een jaar een hercontrole uitvoeren
      op die onderdelen die bij de eerdere controle niet voldeden aan de gestelde voorwaarden. Het tweede lid is van
      overeenkomstige toepassing.

      5 De in het eerste lid bedoelde accountant heeft ten behoeve van een controle als bedoeld in het eerste of derde
      lid inzage in het handelsregister. De Kamer verleent hiertoe de nodige medewerking.

      6 Eenieder die is betrokken bij een controle als bedoeld in het eerste of vierde lid is verplicht tot geheimhouding
      van de gegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift hem tot
      mededeling verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.

      7 Bij ministeriële regeling worden regels gesteld over de vergoeding van de kosten van de controle. Een hercontrole
      als bedoeld in het vierde lid wordt niet vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 41a
    text: |-
      1 De Kamer stelt een protocol op, dat betrekking heeft op:

      a. de beschikbaarheid, werking en beveiliging van het handelsregister, bedoeld in [artikel 4, tweede lid][ref1];

      b. de juistheid, actualiteit en volledigheid van het handelsregister, bedoeld in [artikel 40, eerste lid][ref2];

      c. de controle, bedoeld in [artikel 41, eerste lid][ref3];

      d. de procedure voor de behandeling van klachten, bedoeld in [artikel 48][ref4].

      2 Het protocol behoeft de goedkeuring van Onze Minister. Onze Minister handelt daarbij in overeenstemming met
      Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid voor het deel van het handelsregister dat
      betrekking heeft op de gegevens en bescheiden omtrent uiteindelijk belanghebbenden.

      3 De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel4
