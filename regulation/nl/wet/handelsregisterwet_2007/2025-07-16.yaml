  - number: '47'
    text: >-
      Het is verboden te handelen in strijd met dan wel niet te voldoen aan een bij of krachtens deze wet gestelde
      verplichting tot het doen van een opgave ter inschrijving in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel47
  - number: 47a
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding van [artikel 47][ref1],
      indien er sprake is van het handelen in strijd met [artikel 19, eerste lid][ref2], voor zover de daartoe verplichte
      persoon niet de opgave doet die de Kamer nodig heeft om ervoor te zorgen dat de in [artikel 15a, tweede lid][ref3],
      bedoelde gegevens te allen tijde juist en volledig zijn ingeschreven in het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel15a
