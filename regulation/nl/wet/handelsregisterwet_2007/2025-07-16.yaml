  - number: '51'
    text: >-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van een goede uitvoering van
      de wet of in het belang van de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie
      van de Europese Gemeenschappen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel51
  - number: 51a
    text: |-
      Het recht, bedoeld in [artikel 2, eerste lid, van de Databankenwet][ref1] is, ten aanzien van het handelsregister,
      voorbehouden aan de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0010591#ArtikelI
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0010591
        artikel: I
  - number: '52'
    text: >-
      Onze Minister overlegt periodiek met een representatieve vertegenwoordiging van de gebruikers van het
      handelsregister over de inhoud, de inrichting, de werking en de beveiliging van het handelsregister.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel52
  - number: '56'
    text: |-
      De [Handelsregisterwet 1996][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: '57'
    text: |-
      1 Opgaven ter inschrijving in het handelsregister en deponering van bescheiden waartoe de verplichting ontstaat als
      gevolg van de inwerkingtreding van deze wet, worden gedaan binnen 18 maanden na inwerkingtreding van deze wet.

      2 Indien op het tijdstip van inwerkingtreding van deze wet in het handelsregister gegevens staan ingeschreven die
      niet op grond van een wettelijk voorschrift behoeven te worden ingeschreven, haalt de Kamer die gegevens binnen
      drie maanden na het eerder genoemde tijdstip door.

      3 In afwijking van [artikel 20, tweede lid][ref1], doen vennootschappen en andere juridische entiteiten die op het
      tijdstip van inwerkingtreding van de [Implementatiewet registratie uiteindelijk belanghebbenden van vennootschappen
      en andere juridische entiteiten](onbekend) zijn ingeschreven in het handelsregister, de eerste opgave van gegevens
      en deponering van bescheiden als bedoeld in [artikel 15a, tweede en derde lid][ref2], binnen 18 maanden na dat
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel15a
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel57
    references:
