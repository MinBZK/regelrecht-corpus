  - number: '27'
    text: |-
      1 De volgende in het handelsregister ingeschreven ondernemingen of rechtspersonen zorgen ervoor dat op alle van
      die onderneming of die rechtspersoon uitgaande brieven, orders, facturen, offertes en andere aankondigingen, met
      uitzondering van reclames, is vermeld onder welk nummer deze in het handelsregister is ingeschreven:

      a. de in [artikel 5][ref1] en [6, eerste lid, onderdeel a][ref2], genoemde ondernemingen en rechtspersonen;

      b. de in [artikel 6, eerste lid, onderdeel b][ref3], genoemde rechtspersonen, tenzij stukken uitgaan van een
      rechtspersoon waaraan geen onderneming toebehoort.

      2 Het in het eerste lid bedoelde nummer is het nummer, bedoeld in [artikel 9, onderdeel a][ref4], of in
      [artikel 13, onderdeel a][ref5].

      3 Bij ministeriële regeling kan vrijstelling worden verleend van het in het eerste lid bepaalde. Een vrijstelling
      kan niet worden verleend:

      a. aan Europese economische samenwerkingsverbanden;

      b. voor zover het betreft brieven en orders, aan naamloze vennootschappen, besloten vennootschappen met beperkte
      aansprakelijkheid en Europese naamloze vennootschappen.


