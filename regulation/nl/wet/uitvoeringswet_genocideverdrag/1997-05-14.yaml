  - number: '5'
    text: |-
      1 De Nederlandse strafwet is toepasselijk op de Nederlander, die zich buiten Nederland schuldig maakt:

      1°. aan een misdrijf omschreven in de [artikelen 1][ref1] en [2][ref2] van deze wet;

      2°. aan het misdrijf omschreven in [artikel 131 van het Wetboek van Strafrecht][ref3], indien het strafbare feit
      of het misdrijf waarvan in dat artikel gesproken wordt, is een misdrijf als bedoeld in de [artikelen 1][ref4] en
      [2][ref5] van deze wet.

      2 De vervolging kan ook plaats hebben, indien de verdachte eerst na het begaan van het feit Nederlander wordt.


