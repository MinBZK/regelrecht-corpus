  - number: '2'
    text: |-
      Met gelijke straf, als gesteld op de in het voorgaande artikel bedoelde feiten, wordt gestraft hij die opzettelijk
      toelaat dat een aan hem ondergeschikte een zodanig feit begaat.
    url: https://wetten.overheid.nl/BWBR0002453/1997-05-14#Artikel2
  - number: '3'
    text: |-
      Ten aanzien van de feiten, bedoeld in de [artikelen 1][ref1] en [2][ref2], zijn de [artikelen 42][ref3] en
      [43][ref4], alsmede de [artikelen 70][ref5] en [76 van het Wetboek van Strafrecht][ref6] niet van toepassing.


