preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen tot uitvoering van het op 9
    december 1948 te Parijs tot stand gekomen Verdrag nopens de voorkoming en de bestraffing van genocide en dat in
    verband daarmede de Wet Oorlogsstrafrecht, de Uitleveringswet en de Wet overlevering inzake oorlogsmisdrijven
    moeten worden gewijzigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002453/1997-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Hij die met het oogmerk een nationale of etnische groep, een groep behorend tot een bepaald ras, dan wel een
      groep met een bepaalde godsdienst of levensovertuiging, geheel of gedeeltelijk, als zodanig te vernietigen,
      opzettelijk:

      1°. leden van de groep doodt;

      2°. leden van de groep zwaar lichamelijk of geestelijk letsel toebrengt;

      3°. aan de groep levensvoorwaarden oplegt die op haar gehele of gedeeltelijke lichamelijke vernietiging zijn
      gericht;

      4°. maatregelen neemt, welke tot doel hebben geboorten binnen de groep te voorkomen;

      5°. kinderen van de groep gewelddadig overbrengt naar een andere groep

      wordt als schuldig aan genocide gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig
      jaren of geldboete van de vijfde categorie.

      2 De samenspanning wordt gestraft gelijk de poging.

      3 De uitdrukkingen samenspanning en zwaar lichamelijk letsel hebben in dit artikel dezelfde betekenis als in het
      [Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002453/1997-05-14#Artikel1
