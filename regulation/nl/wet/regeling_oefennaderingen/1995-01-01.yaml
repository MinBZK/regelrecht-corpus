      Beschikkingen van 1 september 1982, nr. LT/L 24155 Rijksluchtvaartdienst en van 5 september 1983, nr. LVB/L 24529
      Rijksluchtvaartdienst, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007092/1995-01-01#Artikel3
