preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op artikel 45, tweede lid, aanhef en onder c, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007092/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt onder oefennadering verstaan het met een vliegtuig uitvoeren van naderingsprocedures en
      procedures ter voorbereiding van een landing zonder dat deze procedures gevolgd worden door een landing waarbij de
      wielen het aardoppervlak raken, zulks in het kader van een vliegopleiding of het onderhoud van vliegvaardigheid.
    url: https://wetten.overheid.nl/BWBR0007092/1995-01-01#Artikel1
  - number: '2'
    text: |-
      1 Voor het uitvoeren van de in het tweede lid bedoelde oefennaderingen zijn de volgende gebieden aangewezen:
      Deventer en Flevopolder, onder verwijzing naar de luchtvaartgids, volume 1, hoofdstuk RAC-5-5-1, alwaar deze
      gebieden zijn gepubliceerd;

      Gouda, onder verwijzing naar de luchtvaartgids, volume 1, hoofdstuk RAC-5-5-2, alwaar dit gebied is gepubliceerd.

      Van wijzigingen in de bladzijden in de luchtvaartgids wordt mededeling gedaan in de Staatscourant.

      2 Het bepaalde in [artikel 45, eerste lid, onder b van het Luchtverkeersreglement][ref1] geldt niet voor
      oefennaderingen voor zover deze worden uitgevoerd met een éénmotorig vliegtuig en met inachtneming van een minimum
      vlieghoogte van 30 meter (100 ft) boven grond of water, doch tenminste 30 meter (100 ft) boven de hoogste hindernis
      gelegen binnen een afstand van 600 meter van het vliegtuig, gedurende de daglichtperiode, boven de in het eerste
      lid genoemde gebieden.

      3 Oefennaderingen mogen niet worden uitgevoerd boven wegen, kanalen, meren, rivieren en gebieden ingericht voor het
      verblijf van personen, gelegen binnen de in het eerste lid bedoelde gebieden.

      4 Oefennaderingen mogen niet worden uitgevoerd indien zich op het terrein personen of vee bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0007092/1995-01-01#Artikel2
