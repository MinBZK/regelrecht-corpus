      in artikel 65 van verordening (EU) nr. 2019/6, is een retributie verschuldigd waarvan de hoogte gelijk is aan het
      bedrag dat in het vijfde lid is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.14
  - number: 4.14.7
    text: |-
      In afwijking van het zesde lid, is bij een werkverdelingsprocedure waarin uitsluitend nationale
      vergunningen voor het in de handel brengen zijn betrokken en de minister beoordelende autoriteit
      is, een retributie verschuldigd waarvan de hoogte gelijk is aan het desbetreffende bedrag,
      genoemd in de [artikelen 4.3, tweede lid, onderdeel a][ref1], [4.3, derde lid, onderdeel a][ref2],
      [4.4, derde lid, onderdeel a][ref3], [4.4, vierde lid, onderdeel a][ref4], [4.9, tweede lid, onderdeel a][ref5],
      [4.9, derde lid, onderdeel a][ref6], [4.10, derde lid, onderdeel a][ref7], of
      [4.10, vierde lid, onderdeel a][ref8].


