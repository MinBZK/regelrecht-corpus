        artikel: '2'
        hoofdstuk: '2'
  - number: 7.2.2
    text: Dit artikel vervalt met ingang van 30 januari 2027.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel7.2
  - number: '7.4'
    text: |-
      De [Regeling diergeneesmiddelen][ref1] wordt ingetrokken.


