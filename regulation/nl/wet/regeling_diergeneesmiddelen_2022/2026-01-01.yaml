  - number: 5a.3.1
    text: |-
      Het voorhanden of in voorraad hebben van ziekteverwekkers als bedoeld in [artikel 5a.2][ref1] is uitsluitend
      toegestaan aan door de minister erkende laboratoria, voorzieningen of andere natuurlijke of rechtspersonen als
      bedoeld in artikel 16, eerste lid, van [verordening (EU) 2016/429](32329R2016) van het Europees Parlement en de
      Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen
      op het gebied van diergezondheid (‘diergezondheidswetgeving’) (PbEU 2016, L84).


