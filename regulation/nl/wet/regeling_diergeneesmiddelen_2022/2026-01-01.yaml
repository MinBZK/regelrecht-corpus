  - number: 4.14.8
    text: |-
      In afwijking van het zesde lid is, indien de minister in een werkverdelingsprocedure geen beoordelende autoriteit
      is en waarbij vergunningen voor het in de handel brengen zijn betrokken die via de decentrale of wederzijdse
      erkenningsprocedure, of de nationale procedure zijn verleend, een retributie verschuldigd waarvan de hoogte gelijk
      is aan het bedrag dat is vastgesteld voor aanvragen voor vergunningen die volgens de decentrale of de wederzijdse
      erkenningsprocedure worden verleend, waarbij Nederland geen referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.14
  - number: 4.14.9
    text: |-
      Indien de minister beoordelende autoriteit is en de werkverdelingsprocedure betrekking heeft op meerdere
      Nederlandse vergunningen voor het in de handel brengen, is, in afwijking van het zesde lid, voor alle wijzigingen
      een gelijke retributie verschuldigd, waarvan de hoogte gelijk is aan het hoogste bedrag dat van toepassing is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.14
  - number: '4.15'
    text: |-
      Indien een aanvrager uitsluitend met het oog op eenzelfde wijziging waarvoor geen beoordeling vereist is als
      bedoeld in artikel 61, derde lid, van verordening (EU) nr. 2019/6, voor verschillende vergunningen voor het in
      de handel brengen gelijktijdig meerdere wijzigingen aanvraagt, bedraagt de retributie in totaal niet meer dan
      € 3.752,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.15
  - number: 4.16.1
    text: |-
      Voor behandeling van een aanvraag voor overdracht van een vergunning voor het in de handel brengen aan een andere
      houder is de aanvrager een retributie verschuldigd van € 421,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.16
  - number: 4.16.2
    text: |-
      Indien een aanvrager tegelijkertijd meerdere aanvragen indient, bedraagt de retributie in totaal niet meer dan
      € 3.752,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.16
