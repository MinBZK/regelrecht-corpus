    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.25
  - number: 4.25a.1
    text: |-
      Voor de behandeling van een aanvraag voor vermelding in de lijst van kleinhandel op afstand als bedoeld in artikel
      104, achtste lid, onderdeel c, van [verordening (EU) nr. 2019/6](31906R2019) is de aanvrager een retributie
      verschuldigd van € 225,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.25a
  - number: 4.25a.2
    text: Voor de behandeling van een wijziging van de vermelding is de aanvrager een retributie verschuldigd van € 126,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.25a
  - number: 4.26.1
    text: |-
      Voor de betaling van een op grond van deze regeling verzonden factuur met betrekking tot een retributie geldt een
      betalingstermijn van dertig dagen, gerekend vanaf de datering van de factuur.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.2
    text: |-
      Indien dertig dagen na de datering van de in het eerste lid bedoelde factuur het verschuldigde niet is voldaan,
      deelt de minister aan de schuldenaar mede, dat zolang het verschuldigde niet is voldaan, de behandeling van de
      aanvraag, het verrichten van werkzaamheden of het leveren van materialen is opgeschort tot:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.2.a
    text: de factuur is voldaan; of
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.2.b
    text: |-
      betaling van de verschuldigde bedragen naar het oordeel van de minister voldoende is gegarandeerd door borgstelling
      door een door de schuldenaar voorgestelde bankinstelling, welke instelling zich voor twee jaar borg stelt voor
      betaling van de verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.3
    text: Na de mededeling, bedoeld in het tweede lid, kan worden overgegaan tot gerechtelijke invordering.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.4
    text: Voor zover verschuldigd, is de omzetbelasting in het tarief begrepen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.5
    text: |-
      Indien de retributie, bedoeld in [artikel 4.1, zesde lid][ref1], niet is betaald, kan de minister de vergunning
      voor kleinhandel schorsen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.26.6
    text: De hoogte van de totaal op grond van deze regeling verschuldigde retributie wordt vastgesteld door de minister.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: 4.26.7
    text: De ingevolge deze regeling verschuldigde retributies zijn verschuldigd aan de minister.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.26
  - number: '5.1'
    text: |-
      Een dierenarts stelt de houder van de vergunning voor het in de handel brengen of de minister onverwijld doch
      uiterlijk binnen vijftien dagen in kennis van de volgende vermoedelijke ongewenste effecten:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.1
  - number: 5.1.a
    text: elke ongunstige en onbedoelde reactie bij een dier op een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.1
  - number: 5.1.b
    text: |-
      elke vaststelling van een gebrek aan werkzaamheid van een diergeneesmiddel na toediening ervan aan een dier, al dan
      niet in overeenstemming met de samenvatting van productkenmerken;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.1
  - number: 5.1.c
    text: elke schadelijke reactie bij mensen die zijn blootgesteld aan een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.1
  - number: 5.1.d
    text: |-
      elke vaststelling van de van de aanwezigheid van een farmacologisch werkzame stof of een indicatorresidu in een
      product van dierlijke oorsprong in hogere hoeveelheden dan de overeenkomstig [verordening (EG) nr. 470/2009]
      (32009R0470) vastgestelde maximale waarden voor residuen, nadat de vastgestelde wachttijd in acht is genomen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Een dierenarts meldt een behandeling van een dier als bedoeld in de artikelen 112, tweede lid, 113, tweede
      lid, en 114, vierde lid, van verordening (EU) nr. 2019/6 uiterlijk veertien dagen na het verstrekken van het
      diergeneeskundig voorschrift bij de minister.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
  - number: 5.2.2
    text: 'Bij de melding verstrekt de dierenarts:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
  - number: 5.2.2.a
    text: |-
      het registratienummer in het register, bedoeld in [artikel 4.3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 5.2.2.b
    text: de naam van het voorgeschreven diergeneesmiddel, alsmede de werkzame stoffen van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
  - number: 5.2.2.c
    text: de naam of handelsnaam van de houder van de vergunning voor het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
  - number: 5.2.2.d
    text: |-
      een verklaring dat de toepassing in overeenstemming is met de artikelen 112, tweede lid, 113, tweede lid, of 114,
      vierde lid, van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.2
  - number: 5.3.1
    text: 'Het is een ieder verboden:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.1.a
    text: |-
      landbouwhuisdieren of aquacultuurdieren waarbij op enigerlei wijze substanties als bedoeld in bijlage II en III
      van [richtlijn 96/22/EG](31996L0022) met thyreostatische, oestrogene, androgene of gestagene werking alsmede ß-
      agonisten zijn toegepast in de handel te brengen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.1.b
    text: |-
      landbouwhuisdieren of aquacultuurdieren in de handel te brengen waarbij op enigerlei wijze in strijd met
      verordening (EG) nr. 470/2009 farmacologisch werkzame substanties zijn toegepast;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.1.c
    text: |-
      landbouwhuisdieren of aquacultuurdieren in de handel te brengen waarvoor in het geval van toediening van toegestane
      stoffen of producten de daarvoor voorgeschreven wachttijd niet in acht is genomen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.1.d
    text: verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Het eerste lid, onderdelen a, b en d, is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel
      a, en verwerkte producten of vlees van die dieren, indien bij die dieren diergeneesmiddelen zijn toegepast
      overeenkomstig [verordening (EU) nr. 2019/6](31906R2019).
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Het eerste lid, aanhef en onderdeel b, is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel
      a, en verwerkte producten of vlees van die dieren, indien overeenkomstig de artikelen 18 en 19 van verordening (EG)
      nr. 470/2009 een actiedrempel voor een farmacologisch werkzame substantie is vastgesteld en deze actiedrempel niet
      is overschreden.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      Een aanvraag voor erkenning als bedoeld in artikel 13, eerste lid, van [verordening (EU) nr. 2019/4](31904R2019),
      dan wel tot wijziging daarvan, wordt ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      De minister is bevoegd tot aanwijzing van nationale referentielaboratoria als bedoeld in artikel 100, eerste lid,
      eerste zin, van [verordening (EU) 2017/625](32525R2017), ten aanzien van onderwerpen die diergeneesmiddelen of
      substanties als bedoeld in [artikel 5.3][ref1] betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.6'
    text: |-
      De website van het agentschap College ter Beoordeling van Geneesmiddelen is de website, bedoeld in
      [artikel 8.3 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel8
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '8'
  - number: '5.7'
    text: |-
      Een vergunning als bedoeld in de artikelen 47, 49, 52 en 53 van verordening (EU) nr. 2019/6 wordt verleend in
      overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel5.7
  - number: 5a.1
    text: |-
      Als ziekteverwekkers als bedoeld in [artikel 6.1 van het besluit][ref1] worden aangewezen de in de bijlage genoemde
