$id: regeling_diergeneesmiddelen_2022
regulatory_layer: WET
publication_date: '2022-01-26'
valid_from: '2026-01-01'
bwb_id: BWBR0046239
url: https://wetten.overheid.nl/BWBR0046239/2026-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op Verordening (EU) 2019/6 van het Europees Parlement en de Raad van 11 december 2018 betreffende
    diergeneesmiddelen en tot intrekking van Richtlijn 2001/82/EG (PbEU 2019, L 4), Verordening (EU) 2019/4 van het
    Europees Parlement en de Raad van 11 december 2018 betreffende de vervaardiging, het in de handel brengen en het
    gebruik van gemedicineerde diervoeders, tot wijziging van Verordening (EG) nr. 183/2005 van het Europees Parlement
    en de Raad en tot intrekking van Richtlijn 90/167/EEG van de Raad (PbEU 2019, L 4), Verordening (EU) 2016/429
    van het Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging
    en intrekking van bepaalde handelingen op het gebied van diergezondheid (‘diergezondheidswetgeving’) (PbEU 2016,
    L 84), Richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij,
    van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van β-
    agonisten en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125), de
    artikelen 2.20, tweede lid, 6.2, eerste lid, 6.4, eerste lid, 7.1, 7.6, eerste en tweede lid, en 9.1 van de Wet
    dieren, de artikelen 4.9, eerste lid, 5.8, 6.2, tweede lid, 9.3, van het Besluit diergeneesmiddelen en artikel 2.2,
    derde lid, van het Besluit handhaving en overige zaken Wet dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit diergeneesmiddelen 2022][ref1];
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *richtlijn 96/22/EG:* [Richtlijn 96/22/EG](31996L0022) van de Raad van 29 april 1996 betreffende het verbod
      op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met
      thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602),
      [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG 1996, L 125);
        - *verordening (EG) nr. 470/2009:* Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van
      6 mei 2009 tot vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van
      farmacologisch werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG)
      nr. 2377/90 van de Raad en tot wijziging van [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de
      Raad en van Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad (PbEG 2009, L 152);
        - *verordening (EU) nr. 2018/1882:* [Uitvoeringsverordening (EU) 2018/1882](33782R2018) van de Commissie van
      3 december 2018 betreffende de toepassing, op de categorieën in de lijst opgenomen ziekten, van bepaalde regels
      voor de preventie en bestrijding van ziekten en tot vaststelling van een lijst van soorten en groepen soorten die
      een aanzienlijk risico vormen in verband met de verspreiding van die ziekten (PbEU 2018, L 308);
        - *verordening (EU) nr. 2023/361:* Gedelegeerde [Verordening (EU) 2023/361](32261R2023) van de Commissie van
      28 november 2022 tot aanvulling van [Verordening (EU) 2016/429](32329R2016) van het Europees Parlement en de Raad
      wat betreft regels voor het gebruik van bepaalde diergeneesmiddelen voor de preventie en bestrijding van bepaalde
      in de lijst opgenomen ziekten (PbEU 2023, L 52);
        - *wachttijd:* wachttijd als bedoeld in artikel 4, onderdeel 34, van [verordening (EU) nr. 2019/6](31906R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0046416
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0046416
  - number: '1.2'
    text: |-
      Deze regeling berust mede op de [artikelen 4.2, vierde lid][ref1], en
      [5.3, derde lid van het Besluit diergeneesmiddelen 2022][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0046416#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0046416
        artikel: '5'
  - number: '2.1'
    text: |-
      Artikel 5, eerste lid, van [verordening (EU) nr. 2019/6](31906R2019) is niet van toepassing op diergeneesmiddelen
      die bestemd zijn voor uitsluitend als gezelschapsdier gehouden aquarium- of vijverdieren, siervissen, kooivogels,
      postduiven, terrariumdieren, kleine knaagdieren, fretten en konijnen, mits:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.1
  - number: 2.1.a
    text: |-
      voor de diergeneesmiddelen geen diergeneeskundig voorschrift vereist is als bedoeld in artikel 34 van [verordening
      (EU) nr. 2019/6](31906R2019);
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.1
  - number: 2.1.b
    text: |-
      de diergeneesmiddelen voldoen aan artikel 2.2 en de artikelen 10, eerste en tweede lid, 11, eerste lid, aanhef en
      onderdelen a tot en met g, derde en vierde lid, 12, 13 en 14 van [verordening (EU) nr. 2019/6](31906R2019); en
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.1
  - number: 2.1.c
    text: de diergeneesmiddelen bij de minister zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Op de primaire verpakking van een diergeneesmiddel wordt een identificatiecode aangebracht, in aanvulling op de
      gegevens, genoemd in artikel 10, eerste lid, van [verordening (EU) nr. 2019/6](31906R2019).
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Op de buitenverpakking van een diergeneesmiddel wordt een identificatiecode aangebracht, in aanvulling op de
      gegevens, genoemd in artikel 11, eerste lid, van [verordening (EU) nr. 2019/6](31906R2019).
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.2
  - number: '2.3'
    text: 'In de bijsluiter bij een diergeneesmiddel wordt, indien van toepassing, vermeld dat het diergeneesmiddel:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.3
  - number: 2.3.a
    text: |-
      uitsluitend wordt geleverd door een dierenarts of een apotheker als bedoeld in
      [artikel 5.1, eerste lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '5'
  - number: 2.3.b
    text: |-
      is aangewezen als diergeneesmiddel dat kan worden geleverd door iedere persoon met een vergunning voor kleinhandel
      op grond van [artikel 5.1, tweede lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '5'
  - number: 2.3.c
    text: |-
      is aangewezen voor toepassing door een dierenarts of een andere persoon die is toegelaten tot het beroepsmatig
      verrichten van diergeneeskundige handelingen op grond van [artikel 5.3, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '5'
  - number: '2.4'
    text: De bijsluiter bij een diergeneesmiddel wordt op papier of in elektronische vorm beschikbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Voor parallelhandel in diergeneesmiddelen als bedoeld in artikel 102 van verordening (EU) nr. 2019/6 is een
      vergunning voor parallelhandel vereist.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: De aanvraag voor de vergunning wordt ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De vergunning wordt verleend indien de aanvrager voldoet aan de voorwaarden, genoemd in artikel 102, eerste,
      tweede, vijfde en zesde lid, van verordening (EU) nr. 2019/6.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 2.5.4
    text: Op de aanvraag wordt binnen een termijn van zestig dagen beslist.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 2.5.5
    text: |-
      De minister kan de vergunning schorsen zolang de Nederlandse vergunning of de vergunning voor het in de handel
      brengen van de lidstaat van herkomst is geschorst voor het diergeneesmiddel dat een gemeenschappelijke oorsprong
      deelt met het diergeneesmiddel waarvoor de vergunning is afgegeven.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 2.5.6
    text: |-
      De minister trekt de vergunning in indien de Nederlandse vergunning of de vergunning voor het in de handel brengen
      van het diergeneesmiddel van de lidstaat van herkomst is ingetrokken of vervallen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel2.5
  - number: 3.1.1
    text: 'Een kleinhandelaar levert uitsluitend een diergeneesmiddel aan een houder van een dier indien:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      de minister of de Europese Commissie voor het diergeneesmiddel een vergunning voor het in de handel brengen heeft
      verleend op grond van de artikelen 44, 47, 49, 52, 53 of 54 van [verordening (EU) nr. 2019/6](31906R2019);
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.b
    text: |-
      het een diergeneesmiddel betreft als bedoeld in [artikel 2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel2
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1.c
    text: |-
      de kleinhandelaar een dierenarts is die het dier op zijn verantwoordelijkheid door de houder van het dier laat
      behandelen overeenkomstig de artikelen 112, 113 of 114 van [verordening (EU) nr. 2019/6](31906R2019);
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.d
    text: |-
      de minister op grond van de artikelen 110, tweede, derde of vijfde lid, of 116 van [verordening (EU) nr. 2019/6]
      (31906R2019) het gebruik van het diergeneesmiddel heeft toegestaan;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.e
    text: |-
      het diergeneesmiddel wordt toegepast overeenkomstig artikel 106, vijfde lid, van [verordening (EU) nr. 2019/6]
      (31906R2019); of
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.f
    text: 'het diergeneesmiddel:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.f.1°
    text: in een apotheek of door een andere persoon voor een bepaald dier of een kleine groep dieren is bereid; of
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.1.f.2°
    text: |-
      in een apotheek overeenkomstig de aanwijzingen van een farmacopee is bereid en voor directe verstrekking aan de
      eindgebruiker is bestemd.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Een kleinhandelaar levert een voorschriftplichtig diergeneesmiddel uitsluitend aan een houder van een dier nadat de
      dierenarts het diergeneeskundig voorschrift heeft opgesteld.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.1
  - number: 3.2.1
    text: 'Een kleinhandelaar levert een diergeneesmiddel slechts aan een houder van een dier indien:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.a
    text: |-
      de primaire verpakking of, indien van toepassing, de buitenverpakking een niet verbroken en oorspronkelijke
      sluiting bevat;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.b
    text: de houdbaarheidstermijn van het diergeneesmiddel niet verstreken is of verstrijkt tijdens de behandeling;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.c
    text: |-
      het diergeneesmiddel, voor zover het is voorgeschreven, een goed zichtbare, duidelijk leesbare en onuitwisbare
      aanduiding van de volgende vermeldingen bevat:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.c.1°
    text: het woord ‘dierenarts’, ‘apotheker’ of ‘vergunninghouder’;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.c.2°
    text: de naam en het adres van de betreffende kleinhandelaar;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.1.c.3°
    text: de datum van levering van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.2
    text: 'Het eerste lid, aanhef en onderdeel a, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.2.a
    text: een diergeneesmiddel wordt geleverd door een dierenarts of apotheker; en
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.2.2.b
    text: |-
      de oorspronkelijke sluiting is vervangen door een sluiting die is voorzien van de naam en het adres van de
      betreffende dierenarts of apotheker.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.2
  - number: 3.3.1
    text: 'Een kleinhandelaar draagt er zorg voor dat de lokalen waar diergeneesmiddelen worden bewaard en behandeld:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.a
    text: goed onderhouden worden, schoon en opgeruimd zijn en goed worden verlicht;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      zijn voorzien van een zodanige klimaatbeheersing dat de temperatuur, de vochtigheidsgraad en de ventilatie geen
      ongewenste invloed uitoefenen op de zich daarin bevindende diergeneesmiddelen en de temperatuur door de houder van
      de vergunning gecontroleerd en geregistreerd wordt;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.c
    text: zijn uitgevoerd met vloeren, muren en plafonds zonder een voor reiniging belemmerende constructie;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.d
    text: |-
      zodanig zijn ingericht dat door leidingen, ventilatoren en overige voorzieningen geen voor de reiniging
      ontoegankelijke plaatsen ontstaan;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.e
    text: mede door ontwerp en uitrusting van het gebouw optimale bescherming bieden tegen het binnendringen van ongedierte;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.f
    text: over voldoende capaciteit beschikken voor de ordelijke opslag van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.g
    text: |-
      zodanig zijn ingericht dat voorschriftplichtige diergeneesmiddelen buiten het bereik van het publiek worden
      bewaard;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.h
    text: |-
      zijn voorzien van een afgescheiden opslagruimte voor diergeneesmiddelen die zijn afgekeurd, teruggeroepen of
      geretourneerd;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.i
    text: |-
      zodanig zijn ingericht dat diergeneesmiddelen die zich op laad- en losplaatsen bevinden tegen de invloed van
      weersomstandigheden beschermd zijn;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.j
    text: |-
      door het ontwerp, inrichting, en uitrusting blootstelling van het personeel aan gevaren van in het lokaal
      opgeslagen werkzame stoffen voorkomen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.k
    text: voor dieren een behuizing voor dieren bevatten die goed is afgescheiden van andere ruimtes; en
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.1.l
    text: zodanig zijn ingericht dat de aanwezige apparatuur gemakkelijk en grondig kan worden schoongemaakt en schoon is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Het eerste lid, onderdeel b, is van overeenkomstige toepassing ten aanzien van transportmiddelen waarmee
      diergeneesmiddelen voor de kleinhandel worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.3
  - number: '3.4'
    text: 'Een kleinhandelaar levert voorschriftplichtige diergeneesmiddelen uitsluitend af aan een houder van een dier:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.4
  - number: 3.4.a
    text: |-
      in een lokaal als bedoeld in [artikel 3.3][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.4.b
    text: |-
      vanuit een lokaal als bedoeld in [artikel 3.3][ref1] bij het bedrijf, met een voor het diergeneesmiddel geschikte
      wijze van vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.5'
    text: |-
      Een kleinhandelaar bewaart uitsluitend diergeneesmiddelen die hij mag leveren op grond van
      [artikel 3.1, eerste lid, aanhef en onderdelen a tot en met f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.7'
    text: |-
      Een dierenarts levert immunologische diergeneesmiddelen die worden toegepast bij varkens ter voorkoming van,
      onderscheidenlijk, bij een besmetting met influenza, vlekziekte, Porcine reproductive and Respiratory syndrome,
      Atrofische rhinitis, Escherichia coli, Clostridium perfringens, Mycoplasma hyopneumoniae, Actinobacillus
      pleuropneumoniae, parvovirus, rotavirus, de ziekte van Glässer, Lawsonia intracellularis, Porcine Circo Virus type
      2 of berengeur slechts af aan de houder van een varken indien:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a
    text: 'de dierenarts een schriftelijke overeenkomst heeft met de houder:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.1°
    text: |-
      waarin de houder is verplicht de immunologische diergeneesmiddelen uitsluitend af te nemen van de dierenarts
      waarmee de overeenkomst is gesloten of een apotheker op basis van een diergeneeskundig voorschrift van de
      dierenarts waarmee de overeenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.2°
    text: |-
      waarin de houder is verplicht de dierenarts toegang te verschaffen tot alle lokalen waar door de houder varkens
      worden gehouden en inzage te verschaffen in de diergeneesmiddelenadministratie;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.3°
    text: |-
      die de dierenarts en de houder verplicht zich ten minste eenmaal per jaar te laten controleren op het nakomen van
      de in dit artikel opgenomen verplichtingen door een instelling die:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.3°.a
    text: |-
      door de Raad voor Accreditatie of een andere accreditatie-instantie als bedoeld in artikel 4 van Verordening
      (EG) Nr. 765/2008 van het Europees Parlement en de Raad van 9 juli 2008 tot vaststelling van de eisen inzake
      accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van Verordening (EEG)
      nr. 339/93 (PBEU 2008 L 218) op basis van NEN-EN-ISO 17020:2004 of NEN-EN-ISO 17020:2012 is geaccrediteerd voor het
      uitvoeren van inspecties op varkenshouderijen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.3°.b
    text: |-
      onverwijld de minister op de hoogte brengt van een geconstateerde overtreding van die voorwaarden door de
      dierenarts of de houder; en
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.a.4°
    text: |-
      die voorziet in ontbinding van de overeenkomst ingeval niet wordt voldaan aan de controleverplichting, bedoeld in
      onderdeel 3°;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b
    text: 'de dierenarts:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.1°
    text: de diergeneesmiddelen heeft voorgeschreven voor een periode van ten hoogste vier weken;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.2°
    text: |-
      ten minste eenmaal per vier weken alle lokalen bezoekt waar door de houder varkens worden gehouden, waarbij in elk
      geval wordt onderzocht:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.2°.a
    text: de noodzaak tot het toepassen van immunologische diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.2°.b
    text: nakoming van de verplichting, bedoeld in artikel 108, eerste en tweede lid, van verordening (EU) nr. 2019/6;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.3°
    text: |-
      een verslag maakt van elk bezoek als bedoeld in onderdeel 2° en dat verslag bewaart tot ten minste één jaar na
      het bezoek;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.b.4°
    text: |-
      de kennis, benodigd voor de uitvoering van de in dit punt genoemde taken, ten minste eenmaal per twee jaar
      bijschoolt.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.c
    text: 'de houder:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.c.1°
    text: |-
      zich voorafgaand aan het eerste gebruik heeft laten scholen in het verantwoord toepassen van immunologische
      diergeneesmiddelen bij varkens en in het omgaan met eventuele complicaties bij varkens na toepassing van
      immunologische diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.c.2°
    text: |-
      het immunologische diergeneesmiddel bewaart en dit bij varkens toepast overeenkomstig de aanwijzingen van de
      dierenarts;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.c.3°
    text: |-
      uitsluitend beschikt over immunologische diergeneesmiddelen die zijn afgeleverd door de dierarts of door een
      apotheker op recept van de dierenarts;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: 3.7.c.4°
    text: uitsluitend beschikt over immunologische diergeneesmiddelen gedurende de door de dierenarts voorgeschreven termijn.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      In deze paragraaf wordt verstaan onder: - *varken:* varken dat wordt gehouden op een bedrijf dat varkens houdt met
      het oog op de fokkerij of mesterij;
        - *vleeskalf:* rund dat niet ouder is dan twaalf maanden en dat wordt gehouden met het oog op de productie van
      vlees;
        - *melkveerund:* rund dat wordt gehouden op een bedrijf dat runderen houdt met het oog op de productie van melk
      of een verwerking daarvan, bestemd voor humane consumptie, met inbegrip van kalveren van deze dieren die op dit
      bedrijf aanwezig zijn;
        - *vleeskuiken:* dier van de soort Gallus gallus dat wordt gehouden op een bedrijf dat pluimvee houdt met het oog
      op de productie van vlees;
        - *konijn:* konijn dat wordt gehouden op een bedrijf dat konijnen houdt met het oog op de fokkerij of de productie
      van vlees;
        - *geit:* geit die wordt gehouden op een bedrijf dat geiten houdt met het oog op de fokkerij of de productie van
      melk of vlees;
        - *kalkoen:* kalkoen die wordt gehouden op een bedrijf dat kalkoenen houdt met het oog op de fokkerij of de
      productie van vlees.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Een houder van vijf of meer varkens, vijf of meer vleeskalveren, vijf of meer melkveerunderen, 25 of meer geiten,
      250 of meer kalkoenen, 250 of meer konijnen of 250 of meer vleeskuikens past antimicrobiële diergeneesmiddelen toe
      overeenkomstig de [artikelen 3.10 tot en met 3.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.9.2
    text: |-
      Een houder die dieren houdt, anders dan de dieren, bedoeld in het eerste lid, past een antimicrobieel
      diergeneesmiddel toe overeenkomstig het behandeladvies van de dierenarts.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.9
  - number: 3.9.3
    text: |-
      De [artikelen 3.10 tot en met 3.16][ref1] zijn uitsluitend van toepassing op houders als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.10.1
    text: De houder heeft een schriftelijke overeenkomst met een dierenarts.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Indien de houder bij meerdere diersoorten antimicrobiële diergeneesmiddelen gebruikt, heeft de houder één
      overeenkomst per diersoort.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      In de overeenkomst zijn ten minste de verplichtingen, bedoeld in de [artikelen 3.11][ref1] en
      [3.12, eerste en tweede lid][ref2], [artikel 1.28, tweede lid, van het Besluit houders van dieren][ref3] en
      [artikel 5.9, tweede lid, van het Besluit diergeneeskundigen][ref4], opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046239#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 3.10.4
    text: De houder en dierenarts handelen overeenkomstig het bepaalde in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.10
  - number: '3.11'
    text: 'De houder:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
  - number: 3.11.a
    text: |-
      neemt alle diergeneeskundige zorg die ingevolge het bepaalde bij of krachtens [artikel 4.1 van de wet][ref1]
      uitsluitend door een dierenarts wordt uitgevoerd, af van de dierenarts met wie hij de overeenkomst sluit, met
      uitzondering van die gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 3.11.a.1°
    text: een diergeneeskundige noodzaak vereist dat hiervan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
  - number: 3.11.a.2°
    text: |-
      een dierenarts bij de uitvoering van de overeenkomst en na instemming van de houder zich laat bijstaan door een
      andere dierenarts met specifieke kundigheid, expertise of ervaring.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
  - number: 3.11.b
    text: |-
      verschaft de dierenarts toegang tot alle ruimten waar de houder dieren houdt waar de overeenkomst betrekking op
      heeft;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
  - number: 3.11.c
    text: |-
      verschaft de dierenarts inzage in de registers, bedoeld in artikel 108, eerste lid, van [verordening (EU) nr.
      2019/6](31906R2019).
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      De veehouder vraagt de dierenarts waarmee hij een overeenkomst heeft gesloten regelmatig een bezoek op zijn bedrijf
      af te leggen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.2
    text: 'De dierenarts:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.2.a
    text: brengt regelmatig een bezoek aan het bedrijf van de houder waarmee hij een overeenkomst heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.2.b
    text: maakt een verslag van elk bezoek, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.3
    text: 'Een bezoek als bedoeld in het eerste en tweede lid, bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.3.a
    text: het beoordelen van de algehele gezondheidstoestand van de dieren waarop de overeenkomst betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.3.b
    text: het evalueren van het gebruik van antimicrobiële middelen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4
    text: 'Een bezoek als bedoeld in het eerste en tweede lid, vindt ten minste overeenkomstig de volgende frequentie plaats:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.a
    text: voor vleeskuikens eenmaal per ronde dat een koppel wordt opgezet;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.b
    text: voor varkens eenmaal per maand;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.c
    text: voor vleeskalveren eenmaal per drie maanden;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.d
    text: voor melkveerunderen eenmaal per drie maanden;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.e
    text: voor konijnen tweemaal per drie maanden;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.f
    text: voor geiten eenmaal per drie maanden;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.4.g
    text: voor kalkoenen eenmaal per ronde dat een koppel wordt opgezet.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.5
    text: |-
      In afwijking van het vierde lid, kan het bezoek voor melkveerunderen eenmaal per zes maanden plaatsvinden,
      mits in de tussenliggende periode een beoordeling en een evaluatie als bedoeld in het derde lid, onderdelen a
      respectievelijk b, plaatsvindt en hiervan een verslag wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.6
    text: |-
      De dierenarts bezoekt het bedrijf, waarbij een individuele behandeling als bedoeld in
      [artikel 3.13, derde lid, onderdeel c][ref1], plaatsvindt ten minste eenmaal per twee weken bij behandeling van:


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.6.1°
    text: biggen tot en met de leeftijd van acht weken;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.6.2°
    text: kalveren in de eerste zes weken na opzet op het eerste bedrijf tot en met een leeftijd van maximaal tien weken.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.7
    text: |-
      Bij een bezoek als bedoeld in het zesde lid, laat de dierenarts een schriftelijke instructie inzake het gebruik van
      het middel achter, waarin in ieder geval de mogelijk te behandelen dieren ondubbelzinnig geïdentificeerd worden,
      dan wel het moederdier indien het een ongeboren dier betreft.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
  - number: 3.12.8
    text: |-
      De houder bewaart de verslagen, bedoeld in het tweede lid, onderdeel b, en het vijfde lid, alsmede de instructie,
      bedoeld in het zevende lid en in [artikel 3.13, vierde lid][ref1], gedurende vijf jaar op zijn bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.13.1
    text: |-
      Het bedrijfsgezondheidsplan, bedoeld in [artikel 1.28, eerste lid, van het Besluit houders van dieren][ref1],
      bevat, in aanvulling op het bepaalde in [artikel 5.14, van de Regeling diergeneeskundigen][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '5'
  - number: 3.13.1.a
    text: |-
      een reductiedoelstelling voor het gebruik van antimicrobiële middelen die gekoppeld is aan de maatregelen, bedoeld
      in [artikel 5.14, eerste lid, onderdeel g, van de Regeling diergeneeskundigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0035238
        artikel: '5'
  - number: 3.13.1.b
    text: een beschrijving van de voorziening voor noodzakelijke vervanging van de dierenarts.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.2
    text: |-
      In het bedrijfsbehandelplan, bedoeld in [artikel 1.28, eerste lid, van het Besluit houders van dieren][ref1],
      is, in aanvulling op het bepaalde in [artikel 5.17, van de Regeling diergeneeskundigen][ref2], met betrekking tot
      antimicrobiële middelen in ieder geval opgenomen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '5'
  - number: 3.13.2.a
    text: |-
      de dierenarts uitsluitend op basis van een klinische inspectie van de te behandelen dieren en de op grond daarvan
      gestelde diagnose antimicrobiële middelen aflevert waarmee deze dieren overeenkomstig de bijsluiter bij het
      diergeneesmiddel eenmaal behandeld kunnen worden;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.2.b
    text: |-
      de dierenarts antimicrobiële middelen aflevert en de houder en de dierenarts antimicrobiële middelen toepassen
      overeenkomstig de geldende goede veterinaire praktijken, waaronder gidsen voor goede praktijken als bedoeld in
      [artikel 8.44 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 3.13.2.c
    text: de houder en de dierenarts afspraken maken over het volgen van de te behandelen dieren tijdens de behandeling.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.3
    text: |-
      In afwijking van het tweede lid, onderdeel a, kan in het bedrijfsbehandelplan worden opgenomen dat de dierenarts
      ter behandeling van in het bedrijfsbehandelplan genoemde aandoeningen of ziekten antimicrobiële middelen af
      kan leveren en dat de houder bij deze aandoeningen of ziekten zelf kan overgaan tot individuele behandeling
      van de dieren met deze middelen. Dit betreft slechts antimicrobiële middelen die ingevolge de goede veterinaire
      praktijken, waaronder gidsen voor goede praktijken als bedoeld in [artikel 8.44 van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 3.13.3.a
    text: als middel van eerste keuze zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.3.b
    text: als middel van tweede keuze zijn aangemerkt en dienen ter behandeling van mastitis bij melkveerunderen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.3.c
    text: |-
      als middel van tweede keuze zijn aangemerkt en dienen ter behandeling van één van maximaal drie aandoeningen of
      ziekten opgenomen in het bedrijfsbehandelplan, mits:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.3.c.1°
    text: |-
      in het bedrijfsgezondheidsplan de noodzaak om middelen van tweede keuze voor die aandoeningen voorhanden te hebben
      is opgenomen;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.3.c.2°
    text: |-
      in het bedrijfsgezondheidsplan maatregelen zijn opgenomen om de uitbraak voor die aandoeningen te bestrijden en
      herhaling te voorkomen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Behoudens de gevallen, genoemd [artikel 3.12, zesde lid][ref1], vraagt de houder bij een individuele behandeling
      van dieren als bedoeld in het derde lid, onderdeel c, toestemming aan de dierenarts. De dierenarts stelt vervolgens
      een schriftelijke instructie inzake het gebruik van het middel op voor de houder, inclusief de datum en tijd van de
      toestemming voor de behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.13.5
    text: 'Op het bedrijf van de houder mogen niet meer antimicrobiële middelen aanwezig zijn dan de hoeveelheid:'
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.5.a
    text: |-
      afgeleverd overeenkomstig het tweede lid, onderdeel a, ten behoeve van het voltooien van een behandeling, tenzij
      de kleinste primaire verpakking die is toegelaten overeenkomstig [verordening (EU) nr. 2019/6](31906R2019) de
      hoeveelheid noodzakelijk om de dieren te behandelen, overschrijdt en het niet mogelijk is dat het diergeneesmiddel
      wordt verdeeld in een kleinere verpakking;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.5.b
    text: |-
      afgeleverd overeenkomstig het derde lid, onderdeel a of b, waarmee 15% van de op het bedrijf aanwezige en voor
      de aandoening of ziekte vatbare dieren waar de overeenkomst betrekking op heeft overeenkomstig de bijsluiter bij
      het diergeneesmiddel eenmaal behandeld kunnen worden, tenzij de kleinste primaire verpakking die is toegelaten
      overeenkomstig [verordening (EU) nr. 2019/6](31906R2019) de hoeveelheid noodzakelijk om de dieren te behandelen,
      overschrijdt en het niet mogelijk is dat het diergeneesmiddel wordt verdeeld in een kleinere verpakking;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.5.c
    text: |-
      afgeleverd overeenkomstig het derde lid, onderdeel c, waarmee 5% van de in de stal aanwezige vleeskalveren, 10% van
      de op het bedrijf aanwezige melkveerunderen of 10% van de in de afdeling aanwezige varkens die vatbaar zijn voor de
      aandoening of ziekte waar de overeenkomst betrekking op heeft overeenkomstig de bijsluiter bij het diergeneesmiddel
      eenmaal behandeld kunnen worden, tenzij de kleinste primaire verpakking die is toegelaten overeenkomstig
      [verordening (EU) nr. 2019/6](31906R2019) de hoeveelheid noodzakelijk om de dieren te behandelen, overschrijdt en
      het niet mogelijk is dat het diergeneesmiddel wordt verdeeld in een kleinere verpakking.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.6
    text: |-
      Op houders die minder dan 25 varkens, minder dan 25 vleeskalveren of minder dan 25 melkveerunderen houden is het
      derde lid van toepassing met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.6.a
    text: de verplichting in het eerste lid niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.13.6.b
    text: |-
      van de mogelijkheid van het derde lid gebruik gemaakt kan worden zonder opname daarvan in het
      bedrijfsgezondheidsplan en zonder dat er sprake is van behandeling van de in het bedrijfsgezondheidsplan genoemde
      aandoeningen of ziekten;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Indien de overeenkomst eindigt stelt de houder de verslagen van het regelmatig bezoek, bedoeld in
      [artikel 3.12, tweede lid, onderdeel b, en vijfde lid][ref1], en het bedrijfsgezondheidsplan, bedoeld in
      [artikel 3.13][ref2], ter hand aan de dierenarts met wie de houder een nieuwe overeenkomst sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.14.2
    text: |-
      De reden van het opzeggen van de overeenkomst wordt door de dierenarts waarmee de overeenkomst eindigt, in het
      bedrijfsgezondheidsplan vermeld.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      De dierenarts doet binnen tien werkdagen na het sluiten of eindigen van de overeenkomst bij de minister melding van
      de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.15
  - number: 3.15.a
    text: de naam van de houder en het nummer waaronder zijn bedrijf is geregistreerd bij de minister;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.15
  - number: 3.15.b
    text: |-
      de naam van de dierenarts en het nummer waaronder hij is opgenomen in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
  - number: 3.16.1
    text: |-
      Een houder van dieren die een structureel laag gebruik van antimicrobiële middelen heeft, is uitgezonderd van de
      verplichtingen, bedoeld in:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
  - number: 3.16.1.a
    text: |-
      [artikel 3.12, derde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.16.1.b
    text: |-
      [artikel 3.12, vierde lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.16.1.c
    text: |-
      [artikel 3.12, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.16.1.d
    text: |-
      [artikel 3.13, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.16.2
    text: |-
      Ingeval de houder is uitgezonderd van de verplichting, bedoeld in het eerste lid, onderdeel b, zorgt hij er voor
      dat de dierenarts, bedoeld in [artikel 3.12, eerste lid][ref1], eenmaal per jaar een bezoek aan zijn bedrijf
      brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel3
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.17.1
    text: |-
      Het is verboden de volgende diergeneesmiddelen te gebruiken bij dieren voor de preventie en bestrijding van ziekten
      die in de tabel in de bijlage bij [verordening (EU) nr. 2018/1882](33782R2018), zijn aangeduid als categorieën A
      of B:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 3.17.1.a
    text: immunologische diergeneesmiddelen om de immuniteitsstatus van dieren te diagnosticeren;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 3.17.1.b
    text: hyperimmuunserum;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 3.17.1.c
    text: |-
      geïnactiveerde immunologische diergeneesmiddelen als bedoeld in artikel 2, derde lid, van [verordening (EU) 2019/6]
      (31906R2019); en
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 3.17.1.d
    text: antimicrobiële stoffen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing indien het diergeneesmiddel wordt gebruikt voor de
      preventie en bestrijding van een in deel 3 van bijlage I bij [verordening (EU) nr. 2023/361](32261R2023) vermelde
      ziekte, overeenkomstig de in dat deel daarvoor opgenomen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel3.17
  - number: 4.1.1
    text: |-
      Een houder van een vergunning voor het in de handel brengen van een diergeneesmiddel als bedoeld in artikel 5,
      eerste lid, van [verordening (EU) nr. 2019/6](31906R2019) is jaarlijks een retributie verschuldigd van € 655,00
      voor de instandhouding van die vergunning.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Een houder van een registratie van een homeopathisch diergeneesmiddel als bedoeld in artikel 85, eerste lid,
      van [verordening (EU) nr. 2019/6](31906R2019) is jaarlijks een retributie verschuldigd van € 328,00 voor de
      instandhouding van die registratie.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      In afwijking van het eerste en tweede lid bedraagt de vergoeding een gedeelte van een jaar nadat de vergunning is
      verstrekt naar rato van het aantal maanden waarin het is toegestaan het diergeneesmiddel in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Een houder van een vergunning voor de vervaardiging als bedoeld in artikel 88, eerste lid, van [verordening
      (EU) nr. 2019/6](31906R2019) is jaarlijks een retributie verschuldigd van € 66,00 voor de instandhouding van die
      vergunning.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Een houder van een vergunning voor groothandel als bedoeld in artikel 99, eerste lid, van [verordening (EU) nr.
      2019/6](31906R2019) is jaarlijks een retributie verschuldigd van € 66,00 voor de instandhouding van die vergunning.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.6
    text: |-
      Een houder van een vergunning voor kleinhandel als bedoeld in [artikel 4.2, eerste lid, van het besluit][ref1] is
      jaarlijks een retributie verschuldigd van € 66,00 voor de instandhouding van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0046416#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0046416
        artikel: '4'
  - number: 4.1.7
    text: |-
      Een importeur, fabrikant of distributeur van werkzame stoffen bestemd voor diergeneesmiddelen die zich heeft
      aangemeld overeenkomstig artikel 95, eerste lid, van [verordening (EU) nr. 2019/6](31906R2019) is jaarlijks een
      retributie verschuldigd van € 37,00 voor de instandhouding van de aanmelding.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.8
    text: |-
      Een houder van een vergunning voor parallelhandel als bedoeld in [artikel 2.5][ref1] is jaarlijks een retributie
      verschuldigd van € 66,00 voor de instandhouding van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel2
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.1.9
    text: |-
      Een houder van een registratie als bedoeld in [artikel 2.1, onderdeel c][ref1], is jaarlijks een retributie
      verschuldigd van € 328,00 voor de instandhouding van die registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel2
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.1.10
    text: |-
      Voor de instandhouding van de opname in de lijst, bedoeld in artikel 104, achtste lid, onderdeel c, van
      [verordening (EU) nr. 2019/6](31906R2019) is de aanvrager een jaarlijkse retributie verschuldigd van € 37,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: 4.1.11
    text: Dit artikel is uitsluitend van toepassing op vergunningen en registraties die door de minister zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op diergeneesmiddelen die zijn bestemd voor voedselproducerende
      dieren.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Voor de behandeling van een aanvraag voor een nationale vergunning voor het in de handel brengen van een
      diergeneesmiddel als bedoeld in artikel 47 van verordening (EU) nr. 2019/6 is de aanvrager een retributie
      verschuldigd van € 27.559,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Voor de behandeling van een aanvraag voor een gedecentraliseerde vergunning voor het in de handel brengen van
      een diergeneesmiddel als bedoeld in artikel 49 van verordening (EU) nr. 2019/6 is de aanvrager een retributie
      verschuldigd van:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.2.a
    text: € 43.876,00, indien Nederland referentielidstaat is;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.2.b
    text: € 17.098,00, indien Nederland geen referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Voor de behandeling van een aanvraag voor een wederzijdse erkenning van een nationale vergunning voor het in de
      handel brengen als bedoeld in artikel 52 van verordening (EU) nr. 2019/6, inclusief een voorafgaande nationale
      vergunning voor het in de handel brengen, is de aanvrager een retributie verschuldigd van:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.3.a
    text: € 43.876,00, indien Nederland referentielidstaat is;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.3.b
    text: € 10.822,00, indien Nederland geen referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.4
    text: |-
      Voor de behandeling van een aanvraag voor een vervolgerkenning in de procedures voor wederzijdse erkenning en
      voor gedecentraliseerde vergunningen voor het in de handel brengen als bedoeld in artikel 53 van verordening (EU)
      nr. 2019/6 is de aanvrager een retributie verschuldigd van € 5.621,00 indien Nederland referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.3.5
    text: |-
      Voor de behandeling van een aanvraag op basis van geïnformeerde toestemming als bedoeld in artikel 21 van
      [verordening (EU) nr. 2019/6](31906R2019) is de aanvrager een retributie verschuldigd van € 1.686,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      In afwijking van [artikel 4.3][ref1] is dit artikel van toepassing indien een aanvraag betrekking heeft op een
      generiek diergeneesmiddel of een hybride diergeneesmiddel als bedoeld in artikel 18, onderscheidenlijk artikel 19,
      van verordening (EU) nr. 2019/6.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Artikel4
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0046239
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.4.2
    text: |-
      Voor de behandeling van een aanvraag voor een nationale vergunning voor het in de handel brengen van een
      diergeneesmiddel als bedoeld in artikel 47 van [verordening (EU) nr. 2019/6](31906R2019) is de aanvrager een
      retributie verschuldigd van € 7.159,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Voor de behandeling van een aanvraag voor een gedecentraliseerde vergunning voor het in de handel brengen van
      een diergeneesmiddel als bedoeld in artikel 49 van verordening (EU) nr. 2019/6 is de aanvrager een retributie
      verschuldigd van:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.3.a
    text: € 23.573,00, indien Nederland referentielidstaat is;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.3.b
    text: € 4.546,00 indien Nederland geen referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.4
    text: |-
      Voor de behandeling van een aanvraag voor een wederzijdse erkenning van een nationale vergunning voor het in de
      handel brengen als bedoeld in artikel 52 van verordening (EU) nr. 2019/6, inclusief een voorafgaande nationale
      vergunning voor het in de handel brengen, is de aanvrager een retributie verschuldigd van:
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.4.a
    text: € 17.098,00, indien Nederland referentielidstaat is;
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: 4.4.4.b
    text: € 4.546,00, indien Nederland geen referentielidstaat is.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Voor de behandeling van een aanvraag voor een nationale vergunning voor het in de handel brengen van een
      diergeneesmiddel als bedoeld in artikel 47 van [verordening (EU) nr. 2019/6](31906R2019) voor een homeopathisch
      diergeneesmiddel is de aanvrager een retributie verschuldigd van € 7.159,00.
    url: https://wetten.overheid.nl/BWBR0046239/2026-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      Voor de behandeling van een aanvraag voor een nationale registratie van een homeopathisch diergeneesmiddel
      als bedoeld in artikel 85, eerste lid, van [verordening (EU) nr. 2019/6](31906R2019) voor een homeopathisch
      diergeneesmiddel is de aanvrager een retributie verschuldigd van € 1.506,00.
