      verlengd tot 90 dagen is de houder van de vergunning, in afwijking van het derde en vierde lid, een retributie
      verschuldigd waarvan de hoogte gelijk is aan het bedrag dat in de [paragrafen 2][ref1] of [3][ref2] is vastgesteld
      voor de aanvraag voor de vergunning voor het in de handel brengen van het desbetreffende type vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0046239#Hoofdstuk4
