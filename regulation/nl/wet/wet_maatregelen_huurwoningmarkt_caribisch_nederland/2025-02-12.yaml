        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '5'
  - number: '1.10'
    text: |-
      De huurcommissie verstrekt op verzoek aan het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba nadere
      inlichtingen over een door haar gedane uitspraak, alsmede, ingeval zij geen uitspraak heeft gedaan, indien het
      Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba geacht kan worden daarbij belang te hebben, over de
      aan een woning toe te kennen kwaliteit en een voor die woning redelijk te achten huurprijs.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.10
  - number: '1.11'
    text: |-
      De voorzitter heeft tot taak in afwijking van [artikel 1.9, eerste lid][ref1], en de in het tweede en derde lid van
      dat artikel aangegeven gevallen uitspraak te doen indien ten aanzien van een aan de huurcommissie gedaan verzoek
      een van de in [artikel 1.25, eerste lid][ref2], bedoelde gevallen zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '5'
  - number: 1.12.1
    text: |-
      Een verzoek aan de huurcommissie wordt schriftelijk ingediend. De huurcommissie behandelt en beslist de bij haar
      aangebrachte zaken binnen zes weken na ontvangst van het verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.12
  - number: 1.12.2
    text: |-
      De huurcommissie toetst bij aan haar gedane verzoeken of voldaan is aan de voor die verzoeken bij of krachtens deze
      wet gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.12
  - number: 1.13.1
    text: |-
      Bij eilandsverordening worden per categorie woning regels gegeven voor de waardering van de kwaliteit van een
      woonruimte, van de redelijkheid van de huurprijs en van wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.13
  - number: 1.13.2
    text: |-
      De huurcommissie kan, indien de aard van de woning daartoe aanleiding geeft, de kwaliteit van de woning beoordelen
      in afwijking van het in eerste lid bepaalde, indien zij daartoe regels heeft gesteld en deze openbaar heeft
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.13
  - number: 1.13.3
    text: |-
      Bij eilandsverordening wordt het maximale huurverhogingspercentage vastgesteld. Bij eilandsverordening kan het
      maximale huurverlagingspercentage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.13
  - number: 1.14.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603b van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak omtrent de redelijkheid van de overeengekomen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603b
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603b
  - number: 1.14.2
    text: |-
      De huurcommissie toetst in dat geval de redelijkheid van de overeengekomen huurprijs aan de krachtens
      [artikel 1.13, eerste lid][ref1], gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.14.3
    text: |-
      Indien de huurcommissie de overeengekomen huurprijs niet redelijk acht, vermeldt zij in haar uitspraak de huurprijs
      die zij redelijk acht.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.14
  - number: 1.14.4
    text: |-
      In geval sprake is van een huurovereenkomst als bedoeld in [artikel 1.3, tweede lid][ref1], spreekt de
      huurcommissie, indien de beoordeling, bedoeld in het tweede lid, zou leiden tot een huurprijs boven de in
      [artikel 7a:1603, derde lid, van het Burgerlijk Wetboek BES][ref2] bedoelde grens, uit dat de door partijen
      overeengekomen huurprijs redelijk is. Indien de huurprijs na de uitspraak van de huurcommissie en in voorkomend
      geval na de vaststelling ervan door het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba dan wel
      het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba
      onherroepelijk is komen vast te staan en niet boven die grens uitkomt, is artikel 7a:1603, derde lid, van het
      Burgerlijk Wetboek BES op die huurovereenkomst niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: '1603'
  - number: 1.14.5
    text: |-
      De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de huurprijs naar de toestand op
      de datum van ingang van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.14
  - number: 1.15.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603b van het Burgerlijk Wetboek BES][ref1] spreekt
      de huurcommissie tevens uit of zij van oordeel is dat de overeengekomen huurprijs of de op grond van
      [artikel 1.14, derde lid][ref2], redelijk geachte huurprijs, gelet op de gebreken ten aanzien van de woonruimte, in
      rekening dient te worden gebracht. Indien de huurcommissie van oordeel is dat die huurprijs, gelet op de gebreken,
      niet in rekening dient te worden gebracht, geeft zij deze gebreken in de uitspraak aan en vermeldt zij een in
      verhouding tot die gebreken lagere huurprijs als de in rekening te brengen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603b
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603b
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: 1.15.2
    text: |-
      Bij eilandsverordening worden regels gegeven die de huurcommissie bij de beoordeling van de redelijkheid van de in
      rekening te brengen huurprijs in acht neemt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.15
  - number: 1.15.3
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de ingangsdatum van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.15
  - number: 1.15.4
    text: |-
      De huurcommissie bepaalt in de uitspraak dat, nadat de in die uitspraak genoemde gebreken zijn verholpen, de in
      rekening te brengen lagere huurprijs niet meer van toepassing is met ingang van de eerste dag van de maand, volgend
      op die waarin de opheffing van die gebreken heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.15
  - number: 1.15.5
    text: |-
      Indien tussen huurder en verhuurder geen overeenstemming bestaat over het al dan niet verholpen zijn van de
      gebreken, doet de huurcommissie daarover op verzoek van de verhuurder uitspraak. In voorkomend geval geeft zij
      daarbij aan in welke maand de opheffing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.15
  - number: 1.16.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603f van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak omtrent de redelijkheid van de huurprijsverhoging die is vermeld in het daaraan ten
      grondslag liggende voorstel. De huurcommissie spreekt uit welke huurprijsverhoging zij redelijk acht, in welk geval
      zij tevens aangeeft tot welke huurprijs die huurprijsverhoging leidt, dan wel dat zij een huurprijsverhoging niet
      redelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603f
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603f
  - number: 1.16.2
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de huurprijsverhoging, zijnde de in het eerste
      lid bedoelde voorstel vermelde datum van ingang, dan wel een latere datum indien de wet dat voorschrijft.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
  - number: 1.16.3
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging aan het krachtens [artikel 1.13, derde lid][ref1],
      geldende maximale huurverhogingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.16.4
    text: |-
      Bij de beoordeling van de kwaliteit van de woonruimte worden voorzieningen die de huurder onverplicht voor eigen
      rekening heeft aangebracht en waardoor het woongerief geacht kan worden te zijn gestegen, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
  - number: 1.16.5
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging indien de huurprijs, vermeerderd met de
      voorgestelde huurprijsverhoging, de maximale huurprijsgrens zou kunnen overschrijden, tevens aan de krachtens
      [artikel 1.13, eerste lid][ref1], gegevens regels.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.16.6
    text: |-
      De huurcommissie beoordeelt de redelijkheid van de wijziging van de huurprijs naar de toestand op het tijdstip van
      de in het voorstel tot verhoging van de huurprijs genoemde ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.16
  - number: 1.17.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603g van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak omtrent de redelijkheid van de huurprijsverlaging die is vermeld in het daaraan ten
      grondslag liggende voorstel. De huurcommissie spreekt uit welke huurprijsverlaging zij redelijk acht, in welk geval
      zij tevens aangeeft tot welke huurprijs die huurprijsverlaging leidt, dan wel dat zij een huurprijsverlaging niet
      redelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603g
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603g
  - number: 1.17.2
    text: |-
      [Artikel 1.16, tweede, vierde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.18.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603h van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak omtrent de huurprijswijziging die zij redelijk acht. De huurcommissie vermeldt in de
      uitspraak dat de overeengekomen huurprijs redelijk is dan wel welke de huurprijs is die zij redelijk acht,
      alsmede de datum van ingang van de huurprijswijziging, zijnde de eerste dag van de maand, volgend op die waarin de
      voorzieningen, veranderingen of verbeteringen zijn gereedgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603h
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603h
  - number: 1.18.2
    text: |-
      De huurcommissie toetst of het bedrag van de verhoging van de huurprijs in redelijke verhouding staat tot
      de door de verhuurder gemaakte kosten met betrekking tot de voorzieningen, veranderingen of toevoegingen. De
      [artikelen 1.13, eerste lid][ref1], en [1.16, vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.19.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603i van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak of zij van oordeel is dat de overeengekomen huurprijs, in verband met de gebreken ten
      aanzien van de woonruimte, in rekening dient te worden gebracht. Indien de commissie van oordeel is dat die
      huurprijs, in verband met de gebreken, niet in rekening dient te worden gebracht, geeft zij deze gebreken in de
      uitspraak aan en vermeldt zij een in verhouding tot die gebreken lagere huurprijs als de in rekening te brengen
      huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603i
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603i
  - number: 1.19.2
    text: |-
      De huurcommissie neemt bij haar oordeel de krachtens [artikel 1.15, tweede lid][ref1], vastgestelde regels in acht,
      met dien verstande dat de huurcommissie zich slechts een eigen oordeel over de gebreken vormt, voor zover deze aan
      de verhuurder door middel van de in [artikel 7a:1603i, eerste lid, van het Burgerlijk Wetboek BES][ref2] bedoelde
      kennisgeving door de huurder zijn gemeld, alsmede over de gebreken die van zodanige aard of samenhang zijn dat
      ze ook zonder aanzegging aan de verhuurder bekend moesten zijn, zulks naar de toestand op het tijdstip waarop de
      bedoelde kennisgeving door de huurder is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603i
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603i
  - number: 1.19.3
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de eerste dag van de maand, volgend op die waarin de in het tweede lid bedoelde aanzegging door de huurder
      aan de verhuurder is verzonden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.19
  - number: 1.19.4
    text: |-
      [Artikel 1.15, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: 1.20.1
    text: |-
      Indien de huurcommissie in geval van een verzoek als bedoeld in
      [artikel 7a:1603j van het Burgerlijk Wetboek BES][ref1] van oordeel is dat niet een huurprijs is overeengekomen,
      stelt zij de huurprijs vast op 55% van de overeengekomen prijs en het voorschotbedrag aan servicekosten op 25% van
      de overeengekomen prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603j
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603j
  - number: 1.20.2
    text: |-
      De huurprijs en het bedrag aan servicekosten, bedoeld in het eerste lid, treden in de plaats van de overeengekomen
      prijs met ingang van de eerste dag, volgend op die waarin het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.20
  - number: 1.21.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603k van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak omtrent de betalingsverplichting van de huurder met betrekking tot de servicekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603k
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603k
  - number: 1.21.2
    text: |-
      De huurcommissie toetst de servicekosten aan de voor de berekening daarvan geldende wettelijke voorschriften en aan
      de redelijkheid.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.21
  - number: 1.22.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603l van het Burgerlijk Wetboek BES][ref1] doet
      de huurcommissie uitspraak omtrent de vraag of met een beding in verband met de totstandkoming van een
      huurovereenkomst een niet redelijk voordeel is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603l
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603l
  - number: 1.22.2
    text: |-
      Indien de huurcommissie het overeengekomen voordeel niet redelijk acht, vermeldt zij in haar uitspraak hetgeen zij
      met betrekking tot het onderwerp van het beding redelijk acht.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.22
  - number: '1.23'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7a:1603o van het Burgerlijk Wetboek BES][ref1] doet de
      huurcommissie uitspraak of zij van oordeel is dat de huurovereenkomst op juiste gronden is opgezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603o
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603o
  - number: '1.24'
    text: |-
      Indien bij de behandeling van het verzoek blijkt, dat er tussen de verhuurder en de huurder een geschil
      bestaat over het bedrag van de huurprijs, dat op grond van bepalingen van dit hoofdstuk verschuldigd is, zal
      de huurcommissie daarnaar onderzoek doen, aan partijen mededelen, welk bedrag van de huurprijs naar haar mening
      verschuldigd is en de vordering niet toewijzen alvorens de huurder een termijn te hebben gegund om alsnog aan zijn
      verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.24
  - number: 1.25.1
    text: |-
      De voorzitter doet onverwijld binnen drie weken na het voorbereidend onderzoek, bedoeld in [artikel 1.33][ref1],
      schriftelijk en met redenen omkleed uitspraak, indien het verzoek kennelijk niet-ontvankelijk of kennelijk redelijk
      of niet redelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '6'
  - number: 1.25.2
    text: |-
      Van een kennelijk redelijk verzoek is in ieder geval sprake in het geval, bedoeld in
      [artikel 7a: 1603f, vijfde lid, van het Burgerlijk Wetboek BES][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603f
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603f
  - number: 1.25.2.a
    text: |-
      de huurcommissie in een eerdere uitspraak heeft uitgesproken dat op grond van
      [artikel 7a: 1603i van het Burgerlijk Wetboek BES][ref1] een lagere huurprijs redelijk is en de in die uitspraak
      genoemde gebreken nog niet zijn verholpen;


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603i
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603i
  - number: 1.25.2.b
    text: |-
      het percentage van de in het voorstel opgenomen huurverhoging het in [artikel 1.13, derde lid][ref1], bedoelde
      maximale huurverhogingspercentage te boven gaat, in welk geval het verzoek slechts kennelijk redelijk is, voor
      zover het dat percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.25.3
    text: |-
      De voorzitter vermeldt in voorkomende gevallen in de uitspraak tot welke huurprijs zijn uitspraak leidt, alsmede de
      datum van ingang.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
  - number: 1.25.4
    text: De huurcommissie zendt onverwijld een afschrift van de voorzittersuitspraak aan partijen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
  - number: 1.25.5
    text: |-
      Tegen de uitspraak, bedoeld in het eerste lid, kan de huurder en verhuurder binnen zes weken na verzending van het
      afschrift van die uitspraak schriftelijk en gemotiveerd in verzet gaan bij de huurcommissie. De voorzitter wijst in
      zijn uitspraak partijen op deze mogelijkheid en op de vorm en de termijn die daarbij in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
  - number: 1.25.6
    text: |-
      Is de huurcommissie van oordeel dat het verzet, bedoeld in het vijfde lid, gegrond is, dan vervalt de uitspraak,
      bedoeld in het eerste lid, en wordt het aan de in het eerste lid bedoelde uitspraak ten grondslag liggende verzoek
      overeenkomstig [afdeling 4][ref1] door de huurcommissie in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
        afdeling: '4'
  - number: 1.25.7
    text: |-
      Indien geen van de in het zesde lid genoemde partijen binnen de in dat lid genoemde termijn in verzet is gegaan, is
      hetgeen in [artikel 7a:1603s van het Burgerlijk Wetboek BES][ref1] is bepaald met betrekking tot een uitspraak van
      de huurcommissie, van overeenkomstige toepassing op de uitspraak van de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603s
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.25
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603s
  - number: '1.26'
    text: |-
      Bij afwezigheid of ontstentenis van de voorzitter worden zijn werkzaamheden verricht door de plaatsvervangend
      voorzitter. Bij afwezigheid of ontstentenis van een lid, neemt een der plaatsvervangende leden zitting op verzoek
      van de voorzitter en met inachtneming van het bepaalde bij [artikel 1.5, derde lid][ref1]. Bij afwezigheid of
      ontstentenis van de secretaris worden zijn werkzaamheden verricht door de plaatsvervangend secretaris of, bij
      afwezigheid of ontstentenis van deze, door het lid van de huurcommissie dat de voorzitter daartoe zal aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.26
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.27.1
    text: |-
      Waar in [hoofdstuk 1][ref1] van deze wet sprake is van de voorzitter van de huurcommissie, wordt daaronder mede
      verstaan de plaatsvervangend voorzitter, die bij afwezigheid of ontstentenis van de voorzitter diens werkzaamheden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.27
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: 1.27.2
    text: |-
      Onder de secretaris wordt mede verstaan de plaatsvervangend secretaris, wanneer deze op verzoek van de voorzitter
      de werkzaamheden van de secretaris verricht.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.27
  - number: 1.27.3
    text: |-
      Een plaatsvervangend lid, dat op verzoek van de voorzitter aan de werkzaamheden van de huurcommissie deelneemt is,
      wat die werkzaamheden betreft, lid van de huurcommissie in de plaats van het lid dat hij vervangt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.27
  - number: '1.28'
    text: |-
      De huurcommissie kan geen zaak behandelen, indien niet de voorzitter en twee leden aanwezig zijn en de belangen van
      huurders en die van verhuurders van woningen niet gelijkelijk vertegenwoordigd zijn.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.28
  - number: '1.29'
    text: |-
      De voorzitter, de leden en de secretaris van de huurcommissie zijn verplicht het geheim van de beraadslagingen te
      bewaren. Zij zijn voorts verplicht tot geheimhouding omtrent al hetgeen hun in hun hoedanigheid is bekend geworden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.29
  - number: '1.30'
    text: |-
      Hij die een verzoekschrift tot de huurcommissie heeft gericht, verschaft haar alle hem ten dienste staande gegevens
      ter vervulling van haar taak. Hij volgt de aanwijzingen hem door of namens de huurcommissie gegeven.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.30
  - number: 1.31.1
    text: De secretaris doet alle ingekomen stukken onverwijld aan de voorzitter ter kennisneming toekomen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.31
  - number: 1.31.2
    text: De secretaris stelt de partij die niet de verzoeker is in kennis van de inhoud van het verzoek.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.31
  - number: '1.32'
    text: |-
      Indien een verzoekschrift niet voldoende mededeling bevat, stelt de secretaris de verzoeker in de gelegenheid het
      verzoekschrift aan te vullen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.32
  - number: 1.33.1
    text: |-
      De voorzitter en de leden kunnen de zaak onderzoeken, voordat deze door haar wordt beslist. Van het onderzoek wordt
      een schriftelijk rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.33
  - number: 1.33.2
    text: De voorzitter en de leden kunnen voorts een plaatselijk onderzoek instellen of getuigen of deskundigen horen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.33
  - number: 1.33.3
    text: |-
      De huurcommissie kan, voor zover dat redelijkerwijs voor de uitoefening van haar taken als bedoeld in
      [artikel 1.9, tweede tot en met vierde lid][ref1], en de taken van de voorzitter, bedoeld in [artikel 1.11][ref2],
      nodig is van de verhuurder inzage en het nemen van afschrift vorderen van boeken en andere zakelijke bescheiden.
      De verhuurder is verplicht van hem krachtens de eerste volzin gevorderde inzage en nemen van afschrift van boeken
      en andere zakelijke bescheiden te verlenen, een en ander op de wijze en binnen de termijn, door de huurcommissie
      respectievelijk de voorzitter te bepalen. Het niet voldoen aan de in de tweede volzin omschreven verplichting wordt
      gestraft met een geldboete van de tweede categorie. Het strafbare feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.33
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.33.4
    text: |-
      De voorzitter en de leden hebben toegang tot alle woningen, alsmede tot ruimte die als zodanig kan worden gebruikt,
      voor zover dat redelijkerwijs voor de uitoefening van hun taak nodig is. Zij kunnen zich bij het betreden door
      bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig verschaffen zij zich toegang met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.33
  - number: 1.34.1
    text: |-
      De voorzitter bepaalt dag, plaats en uur van behandeling van de zaak. De secretaris geeft daarvan onverwijld kennis
      aan de leden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.34
  - number: 1.34.2
    text: |-
      Schriftelijke bescheiden met betrekking tot de zaak worden voor de behandeling bij de secretaris neergelegd ter
      kennisneming van de leden.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.34
  - number: '1.35'
    text: |-
      De oproeping van de huurder en van de verhuurder om bij de behandeling van een verzoek krachtens dit hoofdstuk
      tegenwoordig te zijn, geschiedt schriftelijk door de secretaris.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.35
  - number: '1.36'
    text: |-
      Huurder en verhuurder kunnen zich voor de huurcommissie door een gemachtigde doen bijstaan of door een schriftelijk
      gemachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.36
  - number: 1.37.1
    text: |-
      De huurcommissie is bevoegd zodanige personen op te roepen en, al of niet na beëdiging, als getuigen of deskundigen
      te horen of te doen horen, als zij voor de voorlichting nodig achten. Die personen zijn verplicht te verschijnen en
      de gevorderde voorlichting te geven. Zij worden door de secretaris opgeroepen bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.37
  - number: 1.37.2
    text: |-
      Aan de verschenen personen kan vergoeding worden toegekend op de voet van het tarief van
      [Besluit tarief justitiekosten strafzaken BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028534
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.37
    references:
      - id: ref1
        bwb_id: BWBR0028534
  - number: 1.37.3
    text: |-
      Indien de huurcommissie beëdiging van een getuige wenselijk oordeelt, geschiedt deze op de wijze van zijn
      godsdienstige gezindheid voor het afleggen van een verklaring.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.37
  - number: 1.37.4
    text: |-
      De huurcommissie kan getuigen of deskundigen horen, die door een der partijen meegebracht, vrijwillig voor haar
      verschijnen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.37
  - number: '1.38'
    text: |-
      De secretaris is bij de zitting van de huurcommissie aanwezig. Hij houdt aantekening van hetgeen aldaar verhandeld
      wordt, met vermelding van de zakelijke inhoud van de verklaringen van de door de huurcommissie gehoorde personen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.38
  - number: '1.39'
    text: |-
      De voorzitter en de leden onthouden zich van deelneming aan de behandeling van enige zaak, welke hun, hun
      echtgenoten of bloed- of aanverwanten tot en met de derde graad, persoonlijk aangaat, of waarin zij of een der
      genoemde personen als gemachtigden zijn betrokken. Deze onthouding wordt ten aanzien van een dergelijke zaak als
      afwezigheid aangemerkt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.39
  - number: 1.40.1
    text: |-
      In alle zaken doet de voorzitter hoofdelijk rondvraag, te beginnen met het jongste lid in leeftijd. Zelf brengt hij
      het laatst zijn advies uit.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.40
  - number: 1.40.2
    text: Ieder aanwezig lid brengt zijn advies uit.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.40
  - number: '1.41'
    text: Alle beslissingen worden genomen bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.41
  - number: 1.42.1
    text: De uitspraak van de huurcommissie wordt op het verzoekschrift gesteld of daaraan gehecht.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.42
  - number: 1.42.2
    text: |-
      De uitspraak is met redenen omkleed, zij vermeldt de voorzitter en de leden, die haar hebben gegeven, en wordt door
      de voorzitter en de secretaris van de zitting, waarin de beslissing genomen is, ondertekend.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.42
  - number: 1.42.3
    text: |-
      De mededeling van de uitspraak van de huurcommissie aan partijen geschiedt bij gedagtekende aan te tekenen brieven
      van de secretaris, waarbij aan ieder van hen een afschrift van de uitspraak en van het verzoekschrift toegezonden
      wordt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.42
  - number: 1.43.1
    text: |-
      De secretaris houdt een openbaar register aan, waarin met weglating van de namen van de betrokken huurders en
      verhuurders de slotwoorden van de uitspraken van de huurcommissie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.43
  - number: 1.43.2
    text: |-
      In dit register worden, ieder onder een afzonderlijk nummer, vermeld alle zaken in de volgorde waarin zij worden
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.43
  - number: 1.43.3
    text: Bij eilandsverordening kunnen nadere regels worden gesteld over de inrichting van het register.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.43
  - number: '1.44'
    text: |-
      Voor de bestrijding van bureaukosten en de uitbetaling van de aan getuigen en deskundigen toe te leggen
      vergoedingen worden door het bestuurscollege aan de secretaris gelden ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.44
  - number: '1.45'
    text: |-
      Bij eilandsverordening kunnen ter uitvoering van [afdeling 4][ref1] nadere regels worden gesteld, waarbij
      formulieren kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.45
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
        afdeling: '4'
  - number: '1.46'
    text: |-
      De op het tijdstip van inwerkingtreding van [hoofdstuk 1][ref1] van deze wet in een openbaar lichaam bij een
      huurcommissie onderscheidenlijk de voorzitter van de huurcommissie aanhangige verzoeken worden met toepassing van
      het vóór het tijdstip van inwerkingtreding van hoofdstuk 1 van deze wet in dat openbaar lichaam geldende recht
      behandeld door de huurcommissie onderscheidenlijk de voorzitter van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '1.47'
    text: |-
      De toepasselijkheid van de bepalingen van [hoofdstuk 1][ref1] van deze wet kan niet bij overeenkomst worden
      uitgesloten of beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.47
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '1.48'
    text: |-
      In elke na het verstrijken van de termijn, bedoeld in
      [artikel 7a:1603k, tweede lid, van het Burgerlijk Wetboek BES][ref1], ingestelde rechtsvordering ter zake van
      de vergoedingen, bedoeld in het eerste lid van dat artikel, wordt een uitspraak van de huurcommissie dan wel
      beschikking van het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba omtrent de betalingsverplichting
      van de huurder met betrekking tot deze vergoedingen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603k
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.48
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603k
  - number: '1.49'
    text: |-
      In elke rechtsvordering ter zake van hetgeen onverschuldigd mocht zijn betaald in verband met een overeenkomst
      als bedoeld in [artikel 7a:1603j van het Burgerlijk Wetboek BES][ref1] waarbij partijen slechts de hoogte van
      de prijs en niet die van de huurprijs zijn overeengekomen, wordt een uitspraak van de huurcommissie, bedoeld in
      [artikel 1.20][ref2], dan wel een beslissing van het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba
      als bedoeld in [artikel 7a: 1603s van het Burgerlijk Wetboek BES][ref3] overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603j
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1603s
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.49
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603j
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '7'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1603s
  - number: '1.50'
    text: |-
      De [Wet huurcommissieregeling BES][ref1] geldt niet voor een openbaar lichaam waarvoor hoofdstuk 1 van deze wet in
      werking is getreden en wordt ingetrokken op het moment dat hoofdstuk 1 van deze wet in alle openbare lichamen van
      toepassing is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028558
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.50
    references:
      - id: ref1
        bwb_id: BWBR0028558
  - number: 5.1 en 5.2
    text: '*[Vervallen]*'
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel5.1_en_5.2
  - number: '5.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen vijf jaar na het tijdstip waarop
      [hoofdstuk 1][ref1] van deze wet voor alle openbare lichamen in werking is getreden aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten in de praktijk van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '5.4'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor [hoofdstuk 1][ref1] van deze
      wet voor de verschillende openbare lichamen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '5.5'
    text: 'Deze wet wordt aangehaald als: Wet maatregelen huurwoningmarkt Caribisch Nederland.'
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel5.5
