  - number: 1.9.3
    text: |-
      De huurcommissie doet uitspraak in gevallen waarin als gevolg van een uitspraak als bedoeld in de
      [artikelen 7a:1603b][ref1] en [7a:1603i van het Burgerlijk Wetboek BES][ref2] de in rekening te brengen huurprijs
      in verband met gebreken is verlaagd, omtrent het verholpen zijn van die gebreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603b
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603i
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.9
    references:
