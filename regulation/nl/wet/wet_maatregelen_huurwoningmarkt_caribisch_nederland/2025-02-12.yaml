        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.9.2
    text: 'De huurcommissie doet uitspraak:'
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.9
  - number: 1.9.2.a
    text: |-
      ingevolge [artikel 7a:1603b van het Burgerlijk Wetboek BES][ref1] over de redelijkheid van de overeengekomen
      aanvangshuurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603b
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.9
