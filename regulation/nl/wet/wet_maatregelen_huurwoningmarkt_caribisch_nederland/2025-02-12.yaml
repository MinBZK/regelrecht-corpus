preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is tegelijk met het voorstel van wet tot aanpassing van
    Boek 7a van het Burgerlijk Wetboek BES, de bepalingen van de Wet huurcommissieregeling BES te integreren in een
    nieuw wetsvoorstel en deze bepalingen waar mogelijk te rangschikken, te vereenvoudigen, te actualiseren alsmede
    in een aantal artikelen inhoudelijke wijzigingen aan te brengen en voorts de Wet volkshuisvesting, ruimtelijke
    ordening en milieubeheer BES aan te passen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *gebrek:* gebrek als bedoeld in
      [artikel 7a:1603i van het Burgerlijk Wetboek BES][ref1];
        - *huur en verhuur, huurprijs, servicekosten en woning:* hetgeen daaronder wordt verstaan in de
      [derde afdeling van titel 7 van Boek 7a van het Burgerlijk Wetboek BES][ref2];
        - *huurcommissie:* huurcommissie als bedoeld in [artikel 1.4][ref3];
        - *inflatiepercentage:* het onmiddellijk voorafgaand aan de datum van 1 juli, ieder jaar in januari door het
      Centraal Bureau voor de Statistiek bekendgemaakte percentage, waarmee de consumentenprijzen (alle huishoudens) ten
      opzichte van het aan die bekendmaking voorafgaande jaar zijn verhoogd, met dien verstande dat dat percentage ten
      minste 0 bedraagt;
        - *openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603i
      [ref2]: https://wetten.overheid.nl/BWBR0028752#AfdelingDerde
      [ref3]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.1
