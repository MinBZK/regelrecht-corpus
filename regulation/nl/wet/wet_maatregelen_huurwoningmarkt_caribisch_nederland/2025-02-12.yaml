        artikel: 1603b
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603i
  - number: 1.9.4
    text: |-
      De huurcommissie doet ten aanzien van een huurovereenkomst als bedoeld in [artikel 1.3, tweede lid][ref1],
      desverzocht uitspraak over aangelegenheden waaromtrent de huurcommissie bevoegd zou zijn uitspraak te doen
      indien artikel 1.3, tweede lid, daaraan niet in de weg zou staan. De huurcommissie doet een dergelijke uitspraak
      slechts voor zover in de huurovereenkomst of anderszins tussen partijen is afgesproken dat de desbetreffende
      aangelegenheden bij geschil aan de huurcommissie worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '2'
  - number: 1.9.5
    text: |-
      De huurcommissie doet uitspraak indien ingevolge [artikel 1.25, vijfde lid][ref1], verzet is gedaan tegen een
      uitspraak van de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.9
    references:
