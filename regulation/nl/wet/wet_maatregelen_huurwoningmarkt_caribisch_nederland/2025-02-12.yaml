  - number: '1.2'
    text: Deze wet is van toepassing in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.2
  - number: 1.3.1
    text: |-
      [Hoofdstuk 1][ref1] van deze wet is niet van toepassing op overeenkomsten van huur en verhuur van een woning die
      een gebruik betreffen, dat naar zijn aard slechts van korte duur is.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: 1.3.2
    text: |-
      Op huurovereenkomsten waarop ingevolge [artikel 7a:1603, derde lid, van het Burgerlijk Wetboek BES][ref1] de
      [onderafdelingen 2][ref2] en [3 van de derde afdeling van titel 7 van Boek 7a van het Burgerlijk Wetboek BES][ref3]
      ten dele van toepassing zijn, is dit hoofdstuk slechts van toepassing voor zover dat uit die onderafdelingen
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603
      [ref2]: https://wetten.overheid.nl/BWBR0028752#AfdelingTweede
      [ref3]: https://wetten.overheid.nl/BWBR0028752#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1603'
      - id: ref2
        bwb_id: BWBR0028752
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028752
        afdeling: Derde
  - number: 1.3.3
    text: |-
      Bij eilandsverordening wordt het in [artikel 7a:1603, derde lid, van het Burgerlijk Wetboek BES][ref1] bedoelde
      bedrag van de huurprijs bij de aanvang van de bewoning vastgesteld, waarboven ingevolge dat artikel voornoemde
      onderafdelingen ten dele van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1603'
  - number: 1.3.4
    text: |-
      Bij eilandsverordening wordt het bedrag, bedoeld in het derde lid, jaarlijks, met ingang van 1 juli, aangepast met
      het inflatiepercentage.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.3
  - number: '1.4'
    text: |-
      In elk der openbare lichamen wordt door het bestuurscollege een huurcommissie ingesteld die bevoegd is voor het
      betreffende openbare lichaam.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.4
  - number: 1.5.1
    text: |-
      De huurcommissie bestaat uit een voorzitter en twee leden. De leden zijn afkomstig uit de kring van huurders
      onderscheidenlijk verhuurders.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.5
  - number: 1.5.2
    text: |-
      Aan de huurcommissie worden een secretaris en een plaatsvervangend secretaris toegevoegd. De secretaris en
      de plaatsvervangend secretaris verrichten de werkzaamheden, hen door de huurcommissie of door haar voorzitter
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.5
  - number: 1.5.3
    text: |-
      Voor iedere huurcommissie worden voorts benoemd een plaatsvervangend voorzitter, een plaatsvervangend lid,
      uitsluitend om bij afwezigheid of ontstentenis van het daartoe benoemd lid in de huurcommissie de belangen
      van de huurders van woningen te vertegenwoordigen, een plaatsvervangend lid, uitsluitend om bij afwezigheid of
      ontstentenis van het daartoe benoemd lid in de huurcommissie de belangen van de verhuurders te vertegenwoordigen.
      Zij voldoen aan dezelfde vereisten als de voorzitter onderscheidenlijk de leden van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.5
  - number: 1.6.1
    text: |-
      Het bestuurscollege van elk van de openbare lichamen benoemt, schorst en ontslaat de voorzitter, de
      plaatsvervangend voorzitter, de secretaris en de plaatsvervangend secretaris van de huurcommissie. De voorzitter,
      de plaatsvervangend voorzitter, de secretaris en de plaatsvervangend secretaris van de huurcommissie worden in
      ieder geval ontslagen indien zij de leeftijd van zeventig jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.6
  - number: 1.6.2
    text: |-
      Een besluit houdende benoeming, schorsing en ontslag van de voorzitter, de plaatsvervangend voorzitter,
      de secretaris en de plaatsvervangend secretaris van de huurcommissie behoeft de goedkeuring van de
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba. De goedkeuring kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.6
  - number: 1.6.3
    text: |-
      Het eerste en tweede lid en de [artikelen 1.7][ref1] en [1.8, eerste lid][ref2], zijn ten aanzien van de voorzitter
      van de huurcommissie eerst van toepassing met ingang van een bij koninklijk besluit te bepalen tijdstip dat voor
      elk van de openbare lichamen verschillend kan worden vastgesteld. Tot dat tijdstip is de zittingsvoorzitter,
      bedoeld in [artikel 3a, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref3], voor de uitvoering
      van de [hoofdstukken 1][ref4] en [2][ref5] van deze wet tevens werkzaam in de kwaliteit van voorzitter van de
      huurcommissie van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
      [ref5]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.6
