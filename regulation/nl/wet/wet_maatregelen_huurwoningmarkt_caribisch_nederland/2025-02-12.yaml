  - number: 1.6.4
    text: |-
      Het bestuurscollege van elk van de openbare lichamen benoemt de leden en de plaatsvervangende leden van de
      huurcommissie. Hij is tevens bevoegd de leden en de plaatsvervangende leden van de huurcommissie te schorsen en
      te ontslaan.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.6
  - number: 1.7.1
    text: |-
      De voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangende leden van de huurcommissie zijn
      meerderjarige Nederlandse onderdanen, waarbij die voorzitter, die plaatsvervangend voorzitter, die leden en die
      plaatsvervangende leden ingezetenen zijn van het eiland, waarvoor de huurcommissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.7
  - number: 1.7.2
    text: |-
      Aan de voorzitter en de plaatsvervangend voorzitter is op grond van het afleggen van een examen van een
      opleiding in het wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht verleend, dan wel heeft die voorzitter en
      die plaatsvervangend voorzitter op grond van het afleggen van een examen van een opleiding aan een universiteit
      dan wel de Open Universiteit waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft,
      het recht om de titel meester te voeren verkregen, of blijk heeft gegeven op andere wijze de voor de functie
      van voorzitter dan wel plaatsvervangend voorzitter benodigde kennis te hebben verworven. De leden, de secretaris
      en de plaatsvervangend secretaris hebben blijk gegeven de voor de functie van lid, secretaris respectievelijk
      plaatsvervangend secretaris benodigde kennis te hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 1.7.3
    text: |-
      Niemand kan worden benoemd in meer dan een van de in [artikel 1.5][ref1] genoemde hoedanigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.7.4
    text: |-
      De voorzitter, de plaatsvervangend voorzitter, de leden, de plaatsvervangende leden, de secretaris en de
      plaatsvervangend secretaris van de huurcommissie zijn niet metterdaad betrokken bij de uitoefening van een bedrijf
      dat werkzaam is of mede werkzaam is op het gebied van een woning, noch is het hen toegestaan beroepsmatig betrokken
      te zijn bij het beheer van en de beschikking over een woning dan wel deel uit te maken van het bestuur van een
      vereniging, vennootschap of stichting die daarbij is betrokken.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.7
  - number: 1.8.1
    text: |-
      De voorzitter, de secretaris en de plaatsvervangend secretaris van de huurcommissie genieten een bezoldiging en
      verdere vergoedingen volgens bij eilandsverordening te stellen regels. Hun rechtspositie wordt nader geregeld bij
      eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.8
  - number: 1.8.2
    text: |-
      De plaatsvervangend voorzitter, de leden en de plaatsvervangende leden genieten een vergoeding volgens bij
      eilandsverordening te stellen regels.
    url: https://wetten.overheid.nl/BWBR0039553/2025-02-12#Artikel1.8
  - number: 1.9.1
    text: |-
      De huurcommissie heeft de in het tweede tot en met vierde lid en de in [artikel 1.10][ref1] aangegeven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
