preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen inzake de jacht en
    daarbij nieuwe regelingen te treffen met betrekking tot schade door wild en het behoud van een wildstand, welke met
    de belangen van de landbouw verenigbaar is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder:

      "Onze Minister": Onze Minister van Landbouw, Natuurbeheer en Visserij;

      "jagen": het opsporen, bemachtigen of doden van wild en het doen van pogingen daartoe;

      "jachthouder": degene, die overeenkomstig het in de [artikelen 4][ref1] en [6][ref2] bepaalde het gehele of
      gedeeltelijke genot heeft van de jacht;

      "landbouw": akkerbouw, weidebouw, tuinbouw, bosbouw, teelt van griendhout, veeteelt, pluimveeteelt en visserij;

      "grondgebruiker": degene, die gerechtigd is de grond te gebruiken, hetzij als eigenaar, hetzij krachtens een
      zakelijk recht, hetzij krachtens een pachtovereenkomst;

      "jachtopzichter": degene, die is belast met de bescherming van de jachtbelangen van een jachthouder en buitengewoon
      opsporingsambtenaar is;

      "kooiker": degene, die ingevolge [artikel 39][ref3] als zodanig is geregistreerd;

      "wildhandelaar": ieder, die als ondernemer handel drijft in wild;

      "verzekerde": hij, wiens aansprakelijkheid overeenkomstig de bepalingen van deze wet is gedekt;

      "benadeelde": hij die schade heeft geleden, welke grond oplevert voor toepassing van de [artikelen 12][ref4] en
      [12][ref5] van deze wet alsmede zijn rechtverkrijgenden.

      2 Deze wet begrijpt onder:

      "grond": water;

      "veld": stranden, schorren, gorzen, kwelders, slikken, wadden, binnenwateren en territoriale wateren, alsmede
      wegen en paden, voorzover deze geacht kunnen worden deel uit te maken van een tot jachtbedrijf bestemd of geschikt
      terrein;

      "eieren": schalen van eieren;

      "dood wild": dood wild en delen van wild al dan niet geprepareerd of op andere wijze geschikt gemaakt om duurzaam
      te worden bewaard;

      "produkten van wild": al hetgeen afkomstig is van wild en al hetgeen geheel of gedeeltelijk is vervaardigd uit wild
      of uit delen daarvan alsmede alle goederen waarvan uit een begeleidend document, de verpakking, een merk of etiket
      of enige andere omstandigheid blijkt dat zij afkomstig zijn van of geheel of gedeeltelijk vervaardigd zijn uit wild
      of uit delen daarvan.


