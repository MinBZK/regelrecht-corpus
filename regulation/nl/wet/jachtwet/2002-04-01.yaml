  - number: '28'
    text: |-
      1 Er is een openbaar lichaam, genaamd Jachtfonds, hetwelk tot taak heeft het in stand houden te bevorderen van niet
      tot het in [artikel 8, eerste lid][ref1], genoemd wild behorende wildsoorten, welker handhaving in de vrije natuur
      waardevol is en de belangen van de landbouw met betrekking tot de jacht te dienen.

      2 Het Jachtfonds tracht het in het eerste lid omschreven doel te bereiken door het ter hand nemen of bevorderen
      van wetenschappelijk onderzoek, het bevorderen van voorlichting en opleiding, het bevorderen van maatregelen tot
      voorkoming van schade door wild en door het treffen van andere maatregelen, welke voor de verwezenlijking van het
      in het eerste lid omschreven doel van belang kunnen zijn. Deze maatregelen kunnen ook bestaan in het verlenen van
      tegemoetkomingen in door wild aangerichte schade, met inachtneming van door Onze Minister te stellen regelen.

      3 Het Jachtfonds is rechtspersoon en heeft zijn zetel te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0002155#Artikel8
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002155
        artikel: '8'
  - number: '29'
    text: |-
      1 Het bestuur van het Jachtfonds bestaat uit negen leden.

      2 Onze Minister benoemt de voorzitter en twee leden van het bestuur.

      3 De overige zes leden van het bestuur worden benoemd door de door Ons aan te wijzen representatieve organisaties
      op het gebied van de landbouw, de jacht en de natuurbescherming.

      4 Elk der in het derde lid bedoelde organisaties benoemt twee leden.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel29
  - number: '30'
    text: |-
      Het bestuur regelt zijn werkwijze bij een reglement, hetwelk de instemming behoeft van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '31'
    text: Onze Minister kan bepalen, dat de bestuursleden volgens door hem te stellen regelen een vergoeding genieten.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel31
  - number: '32'
    text: |-
      Bij algemene maatregel van bestuur worden regelen vastgesteld betreffende het nemen van besluiten door het
      Jachtfonds, zijn dagelijkse leiding, zijn secretariaat, zijn vertegenwoordiging in en buiten rechte en zijn
      boekjaar.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel32
  - number: '33'
    text: |-
      1 Jaarlijks vóór 1 september dient het bestuur bij Onze Minister een begroting van inkomsten en uitgaven voor het
      volgend boekjaar in. Deze begroting behoeft de instemming van Onze Minister.

      2 Heeft Onze Minister niet ingestemd met de begroting vóór de aanvang van het boekjaar, waarvoor zij moet dienen,
      dan is het bestuur bevoegd tot het innen van inkomsten en het doen van uitgaven, in de begroting voorzien,
      voorzover Onze Minister daartegen geen bezwaren heeft gemaakt.

      3 Onze Minister is bevoegd de begroting vast te stellen, indien daaromtrent met het bestuur geen overeenstemming
      wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel33
  - number: '34'
    text: |-
      Jaarlijks vóór 1 mei dient het bestuur bij Onze Minister een financieel verslag in over het afgelopen boekjaar met
      daarbij behorende balans en verlies- en winstrekening. Dit verslag behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel34
  - number: '37'
    text: Ten behoeve van het Jachtfonds kan het Rijk een bijdrage verlenen.
    url: https://wetten.overheid.nl/BWBR0002155/2002-04-01#Artikel37
