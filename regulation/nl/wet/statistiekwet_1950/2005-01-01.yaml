preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede in het kader van de verwezenlijking van een
    economische unie tussen Nederland en de Belgisch-Luxemburgsche Economische Unie, de heffing van het statistiekrecht
    af te schaffen en in verband daarmede nadere voorzieningen te treffen ten behoeve van de statistiek van de in-,
    uit- en doorvoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Wij behouden Ons voor bij algemene maatregel van bestuur, ten dienste van de statistiek van de in-, uit- en
      doorvoer, nadere bepalingen vast te stellen omtrent de aangiften die volgens de wettelijke bepalingen, bedoeld in
      de [Douanewet][ref1], worden vereist.

      2 De nadere bepalingen betreffen onder meer de aangifte van soort, hoeveelheid en waarde, alsmede van land van
      herkomst en van bestemming der goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: '2'
    text: |-
      1 De aangever is op vordering van de ambtenaar bij wie een aangifte als bedoeld in [artikel 1][ref1] wordt gedaan,
      verplicht deze terstond inzage te verlenen van de bij de goederen behorende vrachtbrieven, cognossementen of andere
      ladingspapieren.

      2 Hij aan wie inzage van de in het vorige lid bedoelde bescheiden wordt verzocht, wordt geacht die in zijn bezit te
      hebben, tenzij het tegendeel aannemelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel1
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '1'
        hoofdstuk: I
  - number: '3'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, zijn bevoegd de volgende goederen te onderzoeken
      en daarvan de hoeveelheid op te nemen:

      a. binnengekomen goederen welke op regelmatige wijze zijn aangebracht en aangegeven of op regelmatige wijze
      zijn aangebracht onder geleide van een document voor communautair douanevervoer in de zin van [verordening (EEG)
      nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van
      het communautair douanewetboek (*PbEG* L 302) voor zover die goederen nog niet zijn vrijgegeven voor een van de
      douanebestemmingen als bedoeld in artikel 4, onderdeel 16, onder *a, d* of *f* van voornoemde verordening;

      b. communautaire goederen die zijn aangegeven voor de douaneregeling uitvoer en niet-communautaire goederen
      waarvoor, nadat zij onder de douaneregeling actieve veredeling dan wel tijdelijke invoer zijn geplaatst, een
      aangifte tot wederuitvoer is gedaan in de zin van de in onderdeel *a* genoemde verordening.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Hij die, voor zich zelf of voor een ander, een aangifte doet als bedoeld is bij [artikel 2][ref1], wordt gestraft
      met een geldboete van de eerste categorie:

      1°. indien de soort, het land van herkomst of het land van bestemming van de goederen onjuist is aangegeven;

      2°. indien de hoeveelheid of de waarde van de goederen meer dan tien ten honderd te hoog of te laag is aangegeven;

      3°. indien goederen op het tijdstip waarop zij worden geplaatst onder de douaneregeling bedoeld in artikel 4,
      onderdeel 16, onder *a*, van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen
      van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (*PbEG* L 302) kennelijk een buitenlandse
      bestemming hebben, zonder dat van die bestemming in de aangifte melding is gemaakt;

      4°. indien goederen zijn aangegeven voor de doauneregeling, bedoeld in artikel 4, onderdeel 16, onder *h*,
      van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992
      tot vaststelling van het communautair douanewetboek (*PbEG* L 302) kennelijk tevoren overeenkomstig artikel 4,
      onderdeel 16, onder *a*, van voornoemde verordening in Nederland in het vrije verkeer zijn gebracht, zonder dat
      daarvan in de aangifte melding is gemaakt.

      2 Hij die niet voldoet aan een hem krachtens [artikel 2][ref2] opgelegde verplichting wordt gestraft met geldboete
      van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel2
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
    references:
      - id: ref1
