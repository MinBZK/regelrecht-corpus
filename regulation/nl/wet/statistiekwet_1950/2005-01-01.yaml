---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: statistiekwet_1950
regulatory_layer: WET
publication_date: '2008-04-15'
valid_from: '2005-01-01'
bwb_id: BWBR0002064
url: https://wetten.overheid.nl/BWBR0002064/2005-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede in het kader van de verwezenlijking van een
    economische unie tussen Nederland en de Belgisch-Luxemburgsche Economische Unie, de heffing van het statistiekrecht
    af te schaffen en in verband daarmede nadere voorzieningen te treffen ten behoeve van de statistiek van de in-,
    uit- en doorvoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur, ten dienste van de statistiek van de in-, uit- en
      doorvoer, nadere bepalingen vast te stellen omtrent de aangiften die volgens de wettelijke bepalingen, bedoeld in
      de [Douanewet][ref1], worden vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007632
    machine_readable:
      execution:
        output:
          - name: nadere_bepalingen_statistiek
            type: object
            description: Nadere bepalingen omtrent de aangiften voor de in-, uit-, en doorvoerstatistiek
        actions:
          - output: nadere_bepalingen_statistiek
            value: $nadere_bepalingen_statistiek
  - number: '1.2'
    text: |-
      De nadere bepalingen betreffen onder meer de aangifte van soort, hoeveelheid en waarde, alsmede van land van
      herkomst en van bestemming der goederen.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel1
    references: []
  - number: '2.1'
    text: |-
      De aangever is op vordering van de ambtenaar bij wie een aangifte als bedoeld in [artikel 1][ref1] wordt gedaan,
      verplicht deze terstond inzage te verlenen van de bij de goederen behorende vrachtbrieven, cognossementen of andere
      ladingspapieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel1
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '1'
        hoofdstuk: I
    machine_readable:
      execution:
        parameters:
          - name: is_vordering_gedaan
            type: boolean
            required: true
            description: Is er een vordering tot inzage gedaan door de ambtenaar?
        output:
          - name: is_inzage_verlenend_verplicht
            type: boolean
            description: Is de aangever verplicht inzage te verlenen van de vrachtbrieven?
        actions:
          - output: is_inzage_verlenend_verplicht
            value:
              operation: EQUALS
              subject: $is_vordering_gedaan
              value: true
  - number: '2.2'
    text: |-
      Hij aan wie inzage van de in het vorige lid bedoelde bescheiden wordt verzocht, wordt geacht die in zijn bezit te
      hebben, tenzij het tegendeel aannemelijk is.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel2
    references: []
    machine_readable:
      execution:
        parameters:
          - name: is_tegendeel_aannemelijk
            type: boolean
            required: true
            description: Is het tegendeel aannemelijk dat de bescheiden niet in bezit zijn?
        output:
          - name: is_in_bezit
            type: boolean
            description: Wordt de persoon geacht de bescheiden in zijn bezit te hebben?
        actions:
          - output: is_in_bezit
            value:
              operation: NOT
              value: $is_tegendeel_aannemelijk
  - number: '3'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, zijn bevoegd de volgende goederen te onderzoeken
      en daarvan de hoeveelheid op te nemen:
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel3
    references: []
    machine_readable:
      execution:
        parameters:
          - name: is_binnengekomen_op_regelmatige_wijze
            type: boolean
            required: true
            description: Zijn de goederen op regelmatige wijze binnengekomen?
          - name: is_aangebracht_onder_geleide_communautair_douanevervoer
            type: boolean
            required: true
            description: Zijn de goederen aangebracht onder geleide van een document voor communautair douanevervoer?
          - name: estatus_vrijgegeven_douanebestemming
            type: string
            required: true
            description: Status van vrijgave voor douanebestemmingen (a, d, f)
          - name: is_communautair_goed
            type: boolean
            required: true
            description: Betreft het communautaire goederen?
          - name: is_aangegeven_voor_uitvoer
            type: boolean
            required: true
            description: Zijn de goederen aangegeven voor de douaneregeling uitvoer?
          - name: is_niet_communautair_goed
            type: boolean
            required: true
            description: Betreft het niet-communautaire goederen?
          - name: is_aangifte_tot_wederuitvoer_gedaan
            type: boolean
            required: true
            description: Is er een aangifte tot wederuitvoer gedaan?
        output:
          - name: is_onderzoek_toegestaan
            type: boolean
            description: Zijn de ambtenaren bevoegd de goederen te onderzoeken?
        actions:
          - output: is_onderzoek_goederen_3a
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_binnengekomen_op_regelmatige_wijze
                  value: true
                - operation: OR
                  conditions:
                    - operation: EQUALS
                      subject: $is_aangebracht_onder_geleide_communautair_douanevervoer
                      value: true
                    - operation: EQUALS
                      subject: $is_aangegeven_voor_uitvoer
                      value: true
                - operation: NOT
                  value:
                    operation: IN
                    subject: $estatus_vrijgegeven_douanebestemming
                    values: ["a", "d", "f"]
          - output: is_onderzoek_goederen_3b
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_communautair_goed
                      value: true
                    - operation: EQUALS
                      subject: $is_aangegeven_voor_uitvoer
                      value: true
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_niet_communautair_goed
                      value: true
                    - operation: EQUALS
                      subject: $is_aangifte_tot_wederuitvoer_gedaan
                      value: true
          - output: is_onderzoek_toegestaan
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $is_onderzoek_goederen_3a
                  value: true
                - operation: EQUALS
                  subject: $is_onderzoek_goederen_3b
                  value: true
  - number: 3.a
    text: |-
      binnengekomen goederen welke op regelmatige wijze zijn aangebracht en aangegeven of op regelmatige wijze zijn
      aangebracht onder geleide van een document voor communautair douanevervoer in de zin van [verordening (EEG)
      nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van
      het communautair douanewetboek (*PbEG* L 302) voor zover die goederen nog niet zijn vrijgegeven voor een van de
      douanebestemmingen als bedoeld in artikel 4, onderdeel 16, onder *a, d* of *f* van voornoemde verordening;
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel3
    references: []
  - number: 3.b
    text: |-
      communautaire goederen die zijn aangegeven voor de douaneregeling uitvoer en niet-communautarie goederen waarvoor,
      nadat zij onder de douaneregeling actieve veredeling dan wel tijdelijke invoer zijn geplaatst, een aangifte tot
      wederuitvoer is gedaan in de zin van de in onderdeel *a* genoemde verordening.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel3
    references: []
  - number: '4.1'
    text: |-
      Hij die, voor zich zelf of voor een ander, een aangifte doet als bedoeld is bij [artikel 2][ref1], wordt gestraft
      met een geldboete van de eerste categorie:


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel2
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '2'
        hoofdstuk: I
    machine_readable:
      execution:
        parameters:
          - name: is_aangifte_ongjuist_4_1_1
            type: boolean
            required: true
            description: Is de soort, het land van herkomst, of het land van bestemming onjuist aangegeven?
          - name: is_aangifte_ongjuist_4_1_2
            type: boolean
            required: true
            description: Is de hoeveelheid of waarde meer dan 10% te hoog of te laag aangegeven?
          - name: is_aangifte_ongjuist_4_1_3
            type: boolean
            required: true
            description: Hebben de goederen kennelijk een buitenlandse bestemming zonder melding in de aangifte?
          - name: is_aangifte_ongjuist_4_1_4
            type: boolean
            required: true
            description: Zijn goederen ten onrechte aangegeven voor douaneregeling h zonder melding van eerdere vrije verkeer status?
        output:
          - name: is_geldboete_4_1_toepasselijk
            type: boolean
            description: Is een geldboete van de eerste categorie toepasselijk volgens Artikel 4.1?
        actions:
          - output: is_geldboete_4_1_toepasselijk
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $is_aangifte_ongjuist_4_1_1
                  value: true
                - operation: EQUALS
                  subject: $is_aangifte_ongjuist_4_1_2
                  value: true
                - operation: EQUALS
                  subject: $is_aangifte_ongjuist_4_1_3
                  value: true
                - operation: EQUALS
                  subject: $is_aangifte_ongjuist_4_1_4
                  value: true
  - number: 4.1.1°
    text: indien de soort, het land van herkomst of het land van bestemming van de goederen onjuist is aangegeven;
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
  - number: 4.1.2°
    text: indien de hoeveelheid of de waarde van de goederen meer dan tien ten honderd te hoog of te laag is aangegeven;
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
  - number: 4.1.3°
    text: |-
      indien goederen op het tijdstip waarop zij worden geplaatst onder de douaneregeling bedoeld in artikel 4, onderdeel
      16, onder *a*, van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van
      12 oktober 1992 tot vaststelling van het communautair douanewetboek (*PbEG* L 302) kennelijk een buitenlandse
      bestemming hebben, zonder dat van die bestemming in de aangifte melding is gemaakt;
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
  - number: 4.1.4°
    text: |-
      indien goederen zijn aangegeven voor de doauneregeling, bedoeld in artikel 4, onderdeel 16, onder *h*, van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992
      tot vaststelling van het communautair douanewetboek (*PbEG* L 302) kennelijk tevoren overeenkomstig artikel 4,
      onderdeel 16, onder *a*, van voornoemde verordening in Nederland in het vrije verkeer zijn gebracht, zonder dat
      daarvan in de aangifte melding is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Hij die niet voldoet aan een hem krachtens [artikel 2][ref1] opgelegde verplichting wordt gestraft met geldboete
      van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel2
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '2'
        hoofdstuk: I
    machine_readable:
      execution:
        parameters:
          - name: is_verplichting_artikel_2_niet_nagekomen
            type: boolean
            required: true
            description: Is de verplichting uit Artikel 2 niet nagekomen?
        output:
          - name: is_geldboete_4_2_toepasselijk
            type: boolean
            description: Is een geldboete van de eerste categorie toepasselijk volgens Artikel 4.2?
        actions:
          - output: is_geldboete_4_2_toepasselijk
            value:
              operation: EQUALS
              subject: $is_verplichting_artikel_2_niet_nagekomen
              value: true
  - number: '9'
    text: |-
      Hij die voor goederen aangifte doet tot plaatsing onder het stelsel van douane-entrepots dan wel aanvraag doet met
      het oog op de beëindiging van dat stelsel, wordt, indien de goederen niet overeenkomstig de aangifte hun bestemming
      volgen, gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel9
    machine_readable:
      execution:
        parameters:
          - name: is_goederen_niet_conform_aangifte
            type: boolean
            required: true
            description: Volgen de goederen niet overeenkomstig de aangifte hun bestemming?
        output:
          - name: is_geldboete_9_toepasselijk
            type: boolean
            description: Is een geldboete van de eerste categorie toepasselijk volgens Artikel 9?
        actions:
          - output: is_geldboete_9_toepasselijk
            value:
              operation: EQUALS
              subject: $is_goederen_niet_conform_aangifte
              value: true
  - number: '10'
    text: |-
      De [artikelen 4][ref1] en [9][ref2] zijn niet van toepassing, indien het feit strafbaar is gesteld bij
      de wettelijke bepalingen, bedoeld in de [Douanewet][ref3], of indien ingevolge die bepalingen ter zake een
      administratieve boete is belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002064
        artikel: '9'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007632
    machine_readable:
      execution:
        parameters:
          - name: is_feit_strafbaar_douanewet
            type: boolean
            required: true
            description: Is het feit strafbaar gesteld volgens de Douanewet?
          - name: is_administratieve_boete_belopen
            type: boolean
            required: true
            description: Is ingevolge de Douanewet een administratieve boete belopen?
        output:
          - name: zijn_artikelen_4_en_9_niet_toepasselijk
            type: boolean
            description: Zijn Artikel 4 en 9 niet van toepassing volgens Artikel 10?
        actions:
          - output: zijn_artikelen_4_en_9_niet_toepasselijk
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $is_feit_strafbaar_douanewet
                  value: true
                - operation: EQUALS
                  subject: $is_administratieve_boete_belopen
                  value: true
  - number: '12.1'
    text: |-
      Hij die bij de toepassing van dit hoofdstuk een vals of vervalst geschrift vertoont, doet vertonen, overlegt of
      doet overleggen, wordt gestraft met een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel12
    machine_readable:
      execution:
        parameters:
          - name: is_vals_of_vervalst_geschrift_vertoond
            type: boolean
            required: true
            description: Is een vals of vervalst geschrift vertoond, vertond, overlegd, of doen overleggen?
        output:
          - name: is_geldboete_12_1_toepasselijk
            type: boolean
            description: Is een geldboete van de tweede categorie toepasselijk volgens Artikel 12.1?
        actions:
          - output: is_geldboete_12_1_toepasselijk
            value:
              operation: EQUALS
              subject: $is_vals_of_vervalst_geschrift_vertoond
              value: true
  - number: '12.2'
    text: |-
      Indien de schuldige weet of redelijkerwijs moet vermoeden dat het geschrift vals of vervalst is, kan hij bovendien
      worden gestraft met een gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel12
    machine_readable:
      execution:
        parameters:
          - name: is_vals_of_vervalst_geschrift_vertoond
            type: boolean
            required: true
            description: Is een vals of vervalst geschrift vertoond?
          - name: weet_of_moet_vermoeden_vals
            type: boolean
            required: true
            description: Weet de schuldige of moet redelijkerwijs vermoeden dat het geschrift vals of vervalst is?
        output:
          - name: is_straf_12_2_toepasselijk
            type: boolean
            description: Is een gevangenisstraf of geldboete van de derde categorie toepasselijk volgens Artikel 12.2?
        actions:
          - output: is_straf_12_2_toepasselijk
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_vals_of_vervalst_geschrift_vertoond
                  value: true
                - operation: EQUALS
                  subject: $weet_of_moet_vermoeden_vals
                  value: true
  - number: '12.3'
    text: |-
      Het bepaalde in de vorige leden van dit artikel is mede toepasselijk op ieder, die zich buiten Nederland aan het
      daarin omschrevene schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel12
  - number: '13'
    text: |-
      De [artikelen 72][ref1], [73][ref2], [76][ref3], [77][ref4] en [80][ref5] tot en met [88][ref6] vinden
      overeenkomstige toepassing, met dien verstande dat waar in die artikelen wordt gesproken van belastingwet daaronder
      mede wordt verstaan de Statistiekwet 1950.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel77
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel88b
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '73'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '77'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 88b
    machine_readable:
      execution:
        parameters:
          - name: artikel_72_tot_88_awr_toepasselijk
            type: boolean
            required: true
            description: Zijn de artikelen 72 tot en met 88 van de AWR (BWBR0002320) van toepassing?
        output:
          - name: zijn_artikelen_72_tot_88_awr_toepasselijk
            type: boolean
            description: Zijn de artikelen 72 tot en met 88 van de AWR overeenkomstig toepasselijk volgens Artikel 13?
        actions:
          - output: zijn_artikelen_72_tot_88_awr_toepasselijk
            value:
              operation: EQUALS
              subject: $artikel_72_tot_88_awr_toepasselijk
              value: true
  - number: '14'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, bewaren het geheim omtrent hetgeen zij bij de
      uitvoering van dit hoofdstuk leren kennen, voorzover mededeling daarvan voor de juiste uitoefening van de hun
      opgedragen werkzaamheden niet vereist wordt.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel14
  - number: '23'
    text: |-
      Waar in andere wetten of besluiten in een of andere vorm wordt verwezen naar de Statistiekwet (*Staatsblad* 1916,
      no. 175), wordt die verwijzing geacht betrekking te hebben op deze wet.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel23
  - number: '24'
    text: |-
      Deze wet, welke kan worden aangehaald onder de titel "Statistiekwet 1950", treedt in werking met ingang van een
      door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002064/2005-01-01#Artikel24
