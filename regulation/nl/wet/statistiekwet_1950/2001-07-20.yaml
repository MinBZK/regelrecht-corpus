  - number: '22'
    text: |-
      De in het kader van [verordening 3330/91](31991R3330) aan het Centraal bureau voor de statistiek verstrekte
      gegevens worden uitsluitend gebruikt voor de uitvoering van die verordening of andere statistische doeleinden.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel22
  - number: '23'
    text: |-
      Waar in andere wetten of besluiten in een of andere vorm wordt verwezen naar de Statistiekwet (*Staatsblad* 1916,
      no. 175), wordt die verwijzing geacht betrekking te hebben op deze wet.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel23
  - number: '24'
    text: |-
      Deze wet, welke kan worden aangehaald onder de titel "Statistiekwet 1950", treedt in werking met ingang van een
      door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel24
