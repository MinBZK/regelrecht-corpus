  - number: '14'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, bewaren het geheim omtrent hetgeen zij bij de
      uitvoering van dit hoofdstuk leren kennen, voorzover mededeling daarvan voor de juiste uitoefening van de hun
      opgedragen werkzaamheden niet vereist wordt.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel14
  - number: '15'
    text: |-
      In dit hoofdstuk alsmede in de daarop berustende bepalingen wordt verstaan onder:

      a. [verordening 3330/91](31991R3330): [verordening (EEG) nr. 3330/91](31991R3330) van 7 november 1991 van de Raad
      van de Europese Gemeenschappen, betreffende de statistieken van het goederenverkeer tussen Lid-Staten (*PbEG*
      L 316);

      b. Onze Minister: Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel15
  - number: '16'
    text: |-
      De informatieplichtigen, bedoeld in [verordening 3330/91](31991R3330), die gehouden zijn tot het doen van een
      periodieke opgave als bedoeld in [artikel 13][ref1] van voornoemde verordening, verstrekken deze opgave aan het
      Centraal bureau voor de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel13
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '13'
        hoofdstuk: I
  - number: '17'
    text: |-
      Bij regeling van Onze Minister wordt vastgesteld:

      a. welke gegevens als bedoeld in artikel 23, tweede en derde lid, van [verordening 3330/91](31991R3330) de in
      [artikel 16][ref1] bedoelde opgave moet bevatten;

      b. de hoogte van de in artikel 28 van [verordening 3330/91](31991R3330) bedoelde statistische drempels;

      c. al hetgeen verder nodig is ter voldoening aan op [verordening 3330/91](31991R3330) berustende voorschriften van
      de EEG, met uitzondering van de in [artikel 19, tweede lid][ref2], bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel19
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002064
        artikel: '19'
        hoofdstuk: II
  - number: '18'
    text: |-
      1 Bij regeling van Onze Minister kan worden bepaald:

      a. met toepassing van artikel 12, tweede lid, van [verordening 3330/91](31991R3330): dat voor het doen van de in
      [artikel 16][ref1] bedoelde opgave het gebruik van een daarbij aan te wijzen andere dan de in artikel 12, eerste
      lid, van die verordening bedoelde gegevensdrager is toegelaten;

      b. met toepassing van artikel 34, tweede lid, van [verordening 3330/91](31991R3330): dat een daarbij aan te
      wijzen andere procedure dan de in artikel 34, eerste lid, van die verordening bedoelde voor het doen van de in
      [artikel 16][ref2] bedoelde opgave is toegelaten.

      2 Een regeling als bedoeld in het eerste lid kan namens Onze Minister worden vastgesteld door de directeur-generaal
      van de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel16
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002064
        artikel: '16'
        hoofdstuk: II
  - number: '19'
    text: |-
      1 Overeenkomstig artikel 4, eerste lid, onderdelen *a* en *b*, van [verordening 3330/91](31991R3330), alsmede
      de voor de toepassing van dat artikel door de Raad van de Europese Gemeenschappen vastgestelde bepalingen, wordt
      door het Centraal bureau voor de statistiek een doorvoer- en entrepotstatistiek opgesteld met betrekking tot het
      goederenverkeer tussen lid-staten van de Europese Gemeenschappen.

      2 De nadere bepalingen ten behoeve van de in het eerste lid bedoelde doorvoer- en entrepotstatistiek kunnen bij of
      krachtens algemene maatregel van bestuur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel19
  - number: '20'
    text: |-
      1 Met de verificatie van de in [artikel 16][ref1] bedoelde opgaven en de opgaven ten behoeve van de in
      [artikel 19][ref2] bedoelde doorvoer- en entrepotstatistiek zijn belast de ambtenaren van het Centraal bureau voor
      de statistiek die daartoe door de directeur-generaal van de statistiek zijn aangewezen.

      2 Van een aanwijzing als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 De aangewezen ambtenaren zijn bevoegd:

      a. van een informatieplichtige inlichtingen te vorderen, voor zover dat voor de vervulling van hun taak
      redelijkerwijze nodig is;

      b. van een informatieplichtige inzage te vorderen van zakelijke gegevens en bescheiden, waarvan de inzage
      redelijkerwijs voor de vervulling van hun taak nodig is;

      c. van de gegevens en bescheiden kopieën te maken.

      4 Indien het maken van kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel19
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002064
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002064
        artikel: '19'
        hoofdstuk: II
  - number: '21'
    text: |-
      Als strafbare feiten worden aangemerkt:

      a. het niet of niet uiterlijk op het daarvoor ingevolge [artikel 17, onder ][ref1], vastgestelde uiterste tijdstip
      doen van een opgave als bedoeld in [artikel 16][ref2];

      b. het verstrekken van onjuiste of onvolledige gegevens in een opgave als bedoeld in [artikel 16][ref3];

      c. het niet voldoen aan een krachtens [artikel 20][ref4] gedane vordering tot het geven van inlichtingen of tot het
      verlenen van inzage in zakelijke gegevens of bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002064#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002064#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002064#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0002064#Artikel20
