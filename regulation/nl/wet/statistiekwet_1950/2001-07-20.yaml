      - id: ref3
        bwb_id: BWBR0007632
  - number: '12'
    text: |-
      1 Hij die bij de toepassing van dit hoofdstuk een vals of vervalst geschrift vertoont, doet vertonen, overlegt of
      doet overleggen, wordt gestraft met een geldboete van de tweede categorie.

      2 Indien de schuldige weet of redelijkerwijs moet vermoeden dat het geschrift vals of vervalst is, kan hij
      bovendien worden gestraft met een gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      3 Het bepaalde in de vorige leden van dit artikel is mede toepasselijk op ieder, die zich buiten Nederland aan het
      daarin omschrevene schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0002064/2001-07-20#Artikel12
  - number: '13'
    text: |-
      De [artikelen 72][ref1], [73][ref2], [76][ref3], [77][ref4] en [80][ref5] tot en met [88][ref6] vinden
      overeenkomstige toepassing, met dien verstande dat waar in die artikelen wordt gesproken van belastingwet daaronder
      mede wordt verstaan de Statistiekwet 1950.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel72
