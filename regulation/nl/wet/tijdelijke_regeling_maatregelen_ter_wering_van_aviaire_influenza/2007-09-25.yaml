$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_regeling_maatregelen_ter_wering_van_aviaire_influenza
regulatory_layer: WET
publication_date: '2007-12-06'
valid_from: '2007-09-25'
bwb_id: BWBR0020199
url: https://wetten.overheid.nl/BWBR0020199/2007-09-25
preamble:
  text: |-
    Gelet op Richtlijn 2005/94/EG van de Raad van de Europese Unie van 20 december 2005 betreffende communautaire
    maatregelen ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40 (PbEU L 10);

    Gelet op artikel 10, eerste lid, van Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van
    26 juni 1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde
    levende dieren en producten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    Gelet op Beschikking 2005/734/EG van de Commissie van de Europese Gemeenschappen van 19 oktober 2005 tot
    vaststelling van bioveiligheidsmaatregelen ter beperking van het risico van overdracht van hoogpathogene aviaire
    influenza, veroorzaakt door het influenza A-virus subtype H5N1, van in het wild levende vogels naar pluimvee en
    andere in gevangenschap gehouden vogels en tot instelling van een systeem voor vroege opsporing in risicogebieden
    (PbEU L 274);

    Gelet op Beschikking 2006/474/EG van de Commissie van de Europese Gemeenschappen van 6 juli 2006 tot vaststelling
    van voorschriften voor de preventie van hoogpathogene aviaire influenza, veroorzaakt door influenza A-virus subtype
    H5N1, naar vogels in dierentuinen en officieel erkende instellingen, instituten of centra in de lidstaten en tot
    intrekking van Beschikking 2005/744/EG (PbEU L 187);

    Gelet op artikel 17, eerste lid, 18, 32 en 107 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: 1.a
    text: |-
      gevogelte: pluimvee, alsmede andere gehouden dieren van een soort behorende tot de orde van de eendvogels
      (*Anseriformes*), tot de families van de struisvogels (*Struthionidae*), emoes (*Dromaiidae*) en nandoes
      (*Rheidae*) en de familie van de duiven (*Columbidae*);
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: 1.b
    text: |-
      hobbypluimvee: gevogelte als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________;


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel1
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019657
        artikel: '1'
  - number: 1.c
    text: |-
      vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat voertuig
      voortbewogen aanhangwagens, opleggers of containers;
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: 1.d
    text: 'VWA: Voedsel en Waren Autoriteit;'
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: 1.e
    text: |-
      dierentuin: dierentuin als bedoeld in artikel 2, tweede alinea, van beschikking 2006/474/EG van de Commissie van
      de Europese Gemeenschappen van 6 juli 2006 tot vaststelling van voorschriften voor de preventie van hoogpathogene
      aviaire influenza, veroorzaakt door influenza A-virus subtype H5N1, naar vogels in dierentuinen en officieel
      erkende instellingen, instituten of centra in de lidstaten en tot intrekking van Beschikking 2005/744/EG (PbEU
      L 187);
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: 1.f
    text: |-
      richtlijn 2005/94/EG: Richtlijn 2005/94/EG van de Raad van de Europese Unie van 20 december 2005 betreffende
      communautaire maatregelen ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40 (PbEG L10).
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel1
  - number: '2.1'
    text: Het is verboden bedrijfsmatig gevogelte te houden.
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel2
  - number: '2.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing indien wordt voldaan aan [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020199#Artikel4
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020199
        artikel: '4'
        paragraaf: '2'
  - number: '4.1'
    text: 'De houder van bedrijfsmatig gehouden gevogelte draagt ervoor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel4
  - number: 4.1.a
    text: |-
      voedsel en water aan het gevogelte wordt verstrekt in een ruimte die ten minste aan de bovenzijde ondoorlaatbaar is
      afgedekt, en
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel4
  - number: 4.1.b
    text: |-
      het gevogelte geen water krijgt dat afkomstig is van oppervlaktewateren waartoe wilde vogels toegang hebben, tenzij
      dat water behandeld is om eventueel aanwezig virus te inactiveren.
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel4
  - number: '4.2'
    text: |-
      De houder die zowel bedrijfsmatig gehouden gevogelte als, niet-bedrijfsmatig gehouden eenden of ganzen houdt, neemt
      passende maatregelen om te voorkomen dat zijn eenden of ganzen in contact komen met het bedrijfsmatig gehouden
      gevogelte.
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van de
      __REF000___________________________________________________________________________________________________________
      __________________________ is het verboden gevogelte, met uitzondering van sierduiven, afkomstig van verschillende
      plaatsen tijdelijk op één plaats te verzamelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel44
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '44'
  - number: '5.2'
    text: |-
      Het eerste lid is niet van toepassing op het tijdelijk op één plaats verzamelen ten behoeve van wedvluchten,
      culturele evenementen, tentoonstellingen, keuringen of andere tijdelijke verzamelingen, anders dan markten waar
      gevogelte worden verhandeld, indien:
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
  - number: 5.2.a
    text: |-
      degene, die voornemens is gevogelte van verschillende plaatsen tijdelijk op één plaats te verzamelen de VWA van dit
      voornemen ten minste 8 dagen van tevoren kennis heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
  - number: 5.2.b
    text: het gevogelte dat tijdelijk worden verzameld afkomstig is van plaatsen binnen Nederland;
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
  - number: 5.2.c
    text: |-
      het gevogelte, alvorens dit wordt toegelaten bij de plaats van aanvoer, op de kosten van degene, die voornemens
      is gevogelte van verschillende plaatsten tijdelijk op één plaats te verzamelen, wordt onderzocht door één of meer
      dierenartsen;
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
  - number: 5.2.d
    text: |-
      voor zover het een tentoonstelling of keuring betreft, slechts gevogelte wordt
      toegelaten dat vergezeld gaat van een op deze vogels betrekking hebbende, volledig
      ingevulde en ondertekende verklaring van enting tegen Newcastle Disease zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, en


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel45
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '45'
  - number: '5.3'
    text: |-
      Een aanvraag op grond van
      [artikel 4b, derde lid, van de Tijdelijke regeling ter wering van Aviaire Influenza II][ref1], zoals deze luidde
      voordat onderhavige regeling van kracht werd, geldt als kennisgeving als bedoeld in het tweede lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0018797#Artikel4b
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018797
        artikel: 4b
  - number: '6.1'
    text: |-
      Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van gevogelte of broedeieren in derde landen,
      alsmede in lidstaten van de Europese Unie waar een uitbraak van hoogpathogene Aviaire Influenza is bevestigd, en
      vanuit deze derde landen of lidstaten, anders dan in doorvoer leeg in Nederland wordt gebracht, wordt gereinigd
      en ontsmet op een reinigings- en ontsmettingsplaats voor vervoermiddelen die is geregistreerd overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________. De vervoerder overlegt binnen 24 uur na binnenkomst in Nederland aan de VWA een bewijs van de reiniging
      en ontsmetting.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel78
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '78'
  - number: '6.2'
    text: |-
      Voor de werking van dit artikel wordt onder een uitbraak van hoogpathogene Aviaire Influenza in een lidstaat
      niet verstaan een uitbraak in een circus, een dierentuin, een vogelwinkel, een wildpark, een omheind terrein waar
      gevogelte voor wetenschappelijke doeleinden of met het oog op de bescherming van zeldzame pluimveerassen wordt
      gehouden, zoals bedoeld in artikel 13, eerste lid, van [richtlijn 2005/94/EG](32005L0094).
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
  - number: '6.3'
    text: |-
      Het bewijs van de laatste reiniging en ontsmetting, bedoeld in het eerste lid, dient in ieder geval een datum,
      tijdstip van reiniging en ontsmetting en kenteken van het gereinigde vervoermiddel te bevatten en is te allen tijde
      in het vervoermiddel aanwezig.
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
  - number: '6.4'
    text: |-
      De reiniging en ontsmetting, bedoeld in het eerste lid, geschiedt overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '6.5'
    text: |-
      In afwijking van het eerste lid, is het toegestaan vervoermiddelen te reinigen en te ontsmetten op andere plaatsen
      dan die, bedoeld in het eerste lid, indien deze plaatsen zodanig zijn ingericht en uitgerust dat de reiniging en
      ontsmetting met het oog op de wering van Aviaire Influenza op adequate wijze plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
  - number: '6.6'
    text: |-
      De plaatsen, bedoeld in het vijfde lid, worden door de minister geregistreerd
      nadat is gebleken dat aan de voorwaarden, genoemd in het vijfde lid, is voldaan.
      __REF000___________________________________________________________________________________________________________
      _______________________________________, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel78
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '78'
  - number: '7.1'
    text: |-
      Het is verboden een vervoermiddel als bedoeld in [artikel 6, eerste lid][ref1], dat in een derde land is gebruik
      om gevogelte of broedeieren te vervoeren, alsmede in lidstaten van de Europese Unie waar een uitbraak van
      hoogpathogene Aviaire Influenza is bevestigd, vanuit deze derde landen en lidstaten, anders dan in doorvoer, leeg
      in Nederland te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020199#Artikel6
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020199
        artikel: '6'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Het verbod in het eerste lid is niet van toepassing indien wordt voldaan aan het bepaalde in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020199#Artikel6
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020199
        artikel: '6'
        paragraaf: '2'
  - number: '8'
    text: |-
      In afwijking van [artikel 50, eerste lid, onderdelen d en e, van de Flora- en Faunawet][ref1] is het gebruik van
      gehouden eenden als lokvogels als middel tot jagen verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel50
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '50'
  - number: '9'
    text: |-
      De [artikelen 4 tot en met 8][ref1] zijn niet van toepassing op gevogelte, gehouden in dierentuinen.


      [ref1]: https://wetten.overheid.nl/BWBR0020199#Artikel4
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020199
        artikel: '4'
        paragraaf: '2'
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling maatregelen ter wering van Aviaire Influenza.'
    url: https://wetten.overheid.nl/BWBR0020199/2007-09-25#Artikel11
