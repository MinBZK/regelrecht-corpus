  - number: '2'
    text: |-
      1 Het is verboden gevogelte te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien wordt voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0020199/2006-11-22#Artikel2
  - number: '3'
    text: |-
      1 De houder van gevogelte neemt passende maatregelen om zo veel mogelijk te voorkomen dat de door hem gehouden
      dieren in contact komen met wilde vogels of hun uitwerpselen.

      2 Onder passende maatregelen als bedoeld in het eerste lid, wordt ten minste begrepen het niet doorlaatbaar
      afdichten aan de bovenzijde van de al dan niet beperkte uitloop en het afschermen met netten van de zijkanten van
      deze uitloop.

      3 Voor zover de in het eerste lid bedoelde maatregelen genomen worden ten aanzien van hobbypluimvee behorende
      tot de orde van de eendvogels (Anseriformes) of fazanten, wordt, in afwijking van het tweede lid, onder passende
      maatregelen als bedoeld in het eerste lid, ten minste begrepen het afdichten aan de bovenzijde van de al dan niet
      beperkte uitloop met gaas of netten met een maaswijdte van maximaal tien centimeter, en het daarbij afschermen met
      gaas of netten met een maaswijdte van maximaal tien centimeter van de zijkanten van deze uitloop.

      4 De houder die de in het derde lid bedoelde uitloop op de in dat lid beschreven wijze afdicht:

      a. meldt zich vóór het treffen van deze maatregelen telefonisch aan bij het LNV-loket, waarbij ten minste de
      volgende gegevens dienen te worden verstrekt:

      1°. naam, adres, postcode, woonplaats van de houder en, voor zover beschikbaar, UBN-nummer; en

      2°. soorten en aantallen hobbypluimvee, bedoeld in het derde lid;

      b. draagt er zorg voor dat door een op grond van
      [artikel 10, eerste lid, van de Wet op de uitoefening van de Diergeneeskunde 1990][ref1] bij de VWA geregistreerde
      dierenarts bloedmonsters van de desbetreffende dieren worden afgenomen; en

      c. draagt er zorg voor dat de bloedmonsters, bedoeld in onderdeel b, door tussenkomst van de dierenarts die de
      in onderdeel b bedoelde bloedmonsters heeft afgenomen, terstond na het afnemen worden verstuurd naar de GD voor
      onderzoek naar de aanwezigheid van het Aviaire Influenzavirus.

      5 De bloedmonsters, bedoeld in het vierde lid, onderdeel b, worden in de periode vanaf 1 november 2006 tot en met
      31 december 2006 afgenomen bij vijf procent van de in het derde lid bedoelde dieren, waarbij van ten minste vijf
      en ten hoogste twintig dieren een bloedmonster wordt afgenomen. Indien sprake is van minder dan vijf van de in het
      derde lid bedoelde dieren, wordt van ieder dier een bloedmonster afgenomen.


