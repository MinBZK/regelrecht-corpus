  - number: 3a
    text: |-
      De verplichting tot het nemen van de maatregelen, bedoeld in [artikel 3, eerste lid][ref1], geldt niet:

      a. voor de houder van in dierentuinen gehouden gevaccineerd gevogelte, enkel ten aanzien van het
      gevogelte dat na 21 november 2005, maar niet langer dan 1 jaar geleden, is gevaccineerd overeenkomstig de
      [Tijdelijke vrijstellingsregeling enten AI-gevoelige vogels dierentuinen 2003][ref2];

      b. voor de houder van gevaccineerd hobbypluimvee, gevaccineerde biologische legkippen of gevaccineerde legkippen
      met vrije uitloop, mits voedsel en water wordt verstrekt in een ruimte die ten minste aan de bovenzijde
      ondoorlaatbaar is afgedekt voor wat betreft:

      1°. de gevaccineerde dieren, een week na de datum van de tweede
      vaccinatie, bedoeld in de [artikelen 8, eerste lid][ref3], en
      __REF001___________________________________________________________________________________________________________
      ______________, en

      2°. de gevaccineerde dieren, die niet langer dan 1 jaar geleden volledig zijn gevaccineerd overeenkomstig de
      __REF000___________________________________________________________________________________________________________
      ____, zoals deze van kracht was tot 31 juli 2006;

      c. voor de houder van struisvogels, emoes, nandoes, duiven, niet zijnde voor consumptie gehouden duiven, mits
      voedsel en water wordt verstrekt in een ruimte die ten minste aan de bovenzijde ondoorlaatbaar is afgedekt.


