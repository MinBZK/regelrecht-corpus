preamble:
  text: |-
    Gelet op Richtlijn 2005/94/EG van de Raad van de Europese Unie van 20 december 2005 betreffende communautaire
    maatregelen ter bestrijding van aviaire influenza en tot intrekking van Richtlijn 92/40 (PbEU L 10);

    Gelet op artikel 10, eerste lid, van Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van
    26 juni 1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde
    levende dieren en producten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    Gelet op Beschikking 2005/734/EG van de Commissie van de Europese Gemeenschappen van 19 oktober 2005 tot
    vaststelling van bioveiligheidsmaatregelen ter beperking van het risico van overdracht van hoogpathogene aviaire
    influenza, veroorzaakt door het influenza A-virus subtype H5N1, van in het wild levende vogels naar pluimvee en
    andere in gevangenschap gehouden vogels en tot instelling van een systeem voor vroege opsporing in risicogebieden
    (PbEU L 274);

    Gelet op Beschikking 2006/474/EG van de Commissie van de Europese Gemeenschappen van 6 juli 2006 tot vaststelling
    van voorschriften voor de preventie van hoogpathogene aviaire influenza, veroorzaakt door influenza A-virus subtype
    H5N1, naar vogels in dierentuinen en officieel erkende instellingen, instituten of centra in de lidstaten en tot
    intrekking van Beschikking 2005/744/EG (PbEU L 187);

    Gelet op artikel 17, eerste lid, 18, 32 en 107 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020199/2006-11-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. gevogelte: pluimvee, alsmede andere gehouden dieren van een soort behorende tot de orde van de eendvogels
      (anseriformes), tot de families van de struisvogels (Struthionidae), emoes (Dromaiidae) en nandoes (Rheidae) en de
      familie van de duiven (Columbidae);

      b. hobbypluimvee: gevogelte als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________;

      c. vervoermiddel: voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat
      voertuig voortbewogen aanhangwagens, opleggers of containers;

      d. VWA: Voedsel en Waren Autoriteit;

      e. dierentuin: dierentuin als bedoeld in artikel 2, tweede alinea, van beschikking 2006/474/EG;

      f. [richtlijn 2005/94/EG](32005L0094): [Richtlijn 2005/94/EG](32005L0094) van de Raad van de Europese Unie van
      20 december 2005 betreffende communautaire maatregelen ter bestrijding van aviaire influenza en tot intrekking van
      [Richtlijn 92/40](31992L0040) (PbEG L10);

      g. beschikking 2005/734/EG: Beschikking 2005/734/EG van de Commissie van de Europese Gemeenschappen van 19 oktober
      2005 tot vaststelling van bioveiligheidsmaatregelen ter beperking van het risico van overdracht van hoogpathogene
      aviaire influenza, veroorzaakt door het influenza A-virus subtype H5N1, van in het wild levende vogels naar
      pluimvee en andere in gevangenschap gehouden vogels en tot instelling van een systeem voor vroege opsporing in
      risicogebieden (PbEU L 274);

      h. beschikking 2006/474/EG: Beschikking 2006/474/EG van de Commissie van de Europese Gemeenschappen van 6 juli
      2006 tot vaststelling van voorschriften voor de preventie van hoogpathogene aviaire influenza, veroorzaakt door
      influenza A-virus subtype H5N1, naar vogels in dierentuinen en officieel erkende instellingen, instituten of centra
      in de lidstaten en tot intrekking van Beschikking 2005/744/EG (PbEU L 187).


