  - number: '4'
    text: |-
      1 De houder van bedrijfsmatig gehouden gevogelte draagt ervoor zorg dat:

      a. voedsel en water aan het gevogelte wordt verstrekt in een ruimte die ten minste aan de bovenzijde ondoorlaatbaar
      is afgedekt, en

      b. het gevogelte geen water krijgt dat afkomstig is van oppervlaktewateren waartoe wilde vogels toegang hebben,
      tenzij dat water behandeld is om eventueel aanwezig virus te inactiveren.

      2 De houder die zowel bedrijfsmatig gehouden gevogelte als, niet-bedrijfsmatig gehouden eenden of ganzen houdt,
      neemt passende maatregelen om te voorkomen dat zijn eenden of ganzen in contact komen met het bedrijfsmatig
      gehouden gevogelte.
    url: https://wetten.overheid.nl/BWBR0020199/2006-11-22#Artikel4
  - number: '5'
    text: |-
      1 In afwijking van de
      __REF000___________________________________________________________________________________________________________
      __________________________ is het verboden gevogelte, met uitzondering van sierduiven, afkomstig van verschillende
      plaatsen tijdelijk op één plaats te verzamelen.

      2 Het eerste lid is niet van toepassing op het tijdelijk op één plaats verzamelen ten behoeve van wedvluchten,
      culturele evenementen, tentoonstellingen, keuringen of andere tijdelijke verzamelingen, anders dan markten waar
      gevogelte worden verhandeld, indien:

      a. degene, die voornemens is gevogelte van verschillende plaatsen tijdelijk op één plaats te verzamelen de VWA van
      dit voornemen ten minste 8 dagen van tevoren kennis heeft gegeven;

      b. het gevogelte dat tijdelijk worden verzameld afkomstig is van plaatsen binnen Nederland;

      c. het gevogelte, alvorens dit wordt toegelaten bij de plaats van aanvoer, op de kosten van degene, die voornemens
      is gevogelte van verschillende plaatsten tijdelijk op één plaats te verzamelen, wordt onderzocht door één of meer
      dierenartsen;

      d. voor zover het een tentoonstelling of keuring betreft, slechts gevogelte wordt
      toegelaten dat vergezeld gaat van een op deze vogels betrekking hebbende, volledig
      ingevulde en ondertekende verklaring van enting tegen Newcastle Disease zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, en

      3 Een aanvraag op grond van
      [artikel 4b, derde lid, van de Tijdelijke regeling ter wering van Aviaire Influenza II][ref3], zoals deze luidde
      voordat onderhavige regeling van kracht werd, geldt als kennisgeving als bedoeld in het tweede lid, onderdeel a.


