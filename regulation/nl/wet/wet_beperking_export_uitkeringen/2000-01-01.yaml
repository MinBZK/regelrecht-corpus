preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de handhaafbaarheid van de
    socialeverzekeringswetten het exporteren van uitkeringen te beperken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010479/2000-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      [Artikel 19a van de Ziektewet][ref1] is niet van toepassing op de persoon, die op de dag voorafgaand aan de
      inwerkingtreding van deze wet op grond van [artikel 19 van de Ziektewet][ref2] recht heeft op ziekengeld en op die
      dag niet woont in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19
