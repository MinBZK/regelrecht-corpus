  - number: XIV
    text: |-
      [Hoofdstuk 3, afdeling I, paragraaf 9, van de Algemene nabestaandenwet][ref1] is gedurende drie jaren na
      inwerkingtreding van deze wet niet van toepassing op de persoon, die op de dag voorafgaand aan de inwerkingtreding
      van deze wet, op grond van [artikel 14][ref2], [22][ref3] dan wel [26 van de Algemene nabestaandenwet][ref4]
      recht heeft op nabestaandenuitkering, halfwezenuitkering dan wel wezenuitkering en op die dag niet woont
      in Nederland. Genoemde paragraaf is gedurende drie jaren na inwerkingtreding van deze wet evenmin van
      toepassing op de persoon, die op de dag voorafgaand aan de inwerkingtreding van deze wet, op grond van
      [artikel 22 van de Algemene nabestaandenwet][ref5] recht heeft op halfwezenuitkering, indien de halfwees op die dag
      niet woont in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#AfdelingI
