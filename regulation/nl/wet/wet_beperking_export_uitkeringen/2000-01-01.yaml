  - number: XIII
    text: |-
      [Artikel 7b van de Algemene Kinderbijslagwet][ref1] is gedurende drie jaren na inwerkingtreding van deze wet niet
      van toepassing op:

      a. de verzekerde, die over het kwartaal voorafgaand aan de dag van inwerkingtreding van deze wet, op grond van
      [artikel 7 van de Algemene Kinderbijslagwet][ref2] recht heeft op kinderbijslag en op de laatste dag van dat
      kwartaal niet in Nederland woont, en

      b. de verzekerde, voorzover die over het kwartaal voorafgaand aan de dag van inwerkingtreding van deze wet, op
      grond van [artikel 7 van de Algemene Kinderbijslagwet][ref3] recht heeft op kinderbijslag ten behoeve van het eigen
      kind, het aangehuwde kind of het pleegkind, dat op de laatste dag van dat kwartaal niet in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel7
