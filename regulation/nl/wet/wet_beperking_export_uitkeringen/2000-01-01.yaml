  - number: XVI
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen twee jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0010479/2000-01-01#ArtikelXVI
  - number: XVII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat niet eerder is gelegen dan
      zes maanden na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst en dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010479/2000-01-01#ArtikelXVII
  - number: XVIII
    text: 'Deze wet wordt aangehaald als: Wet beperking export uitkeringen.'
    url: https://wetten.overheid.nl/BWBR0010479/2000-01-01#ArtikelXVIII
