  - number: X
    text: |-
      De [artikelen 7a][ref1], [19a][ref2], [21a][ref3], en
      [22a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] zijn gedurende drie
      jaren na de dag van inwerkingtreding van deze wet niet van toepassing op de persoon, die op
      de dag voorafgaand aan de inwerkingtreding van deze wet, op grond van de [artikelen 7][ref5]
      dan wel [22 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] recht heeft op
      arbeidsongeschiktheidsuitkering dan wel recht op uitkering in verband met bevalling en op die dag niet woont in
      Nederland.


