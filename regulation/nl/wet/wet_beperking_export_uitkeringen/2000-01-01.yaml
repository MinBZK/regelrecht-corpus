  - number: XII
    text: |-
      1 Artikel [8a van de Algemene Ouderdomswet][ref1] is gedurende drie jaren na inwerkingtreding van deze wet niet van
      toepassing op de pensioengerechtigde, die op de dag voor de inwerkingtreding van deze wet niet in Nederland woont
      en op die dag op grond van [artikel 8 van de Algemene Ouderdomswet][ref2] recht heeft op een toeslag.

      2 [Artikel 9a van de Algemene Ouderdomswet][ref3] is gedurende drie jaren na inwerkingtreding van deze wet niet
      van toepassing op de pensioengerechtigde, die op de dag voor de inwerkingtreding van deze wet niet in Nederland
      woont en op die dag op grond van [artikel 9, tiende lid, van de Algemene Ouderdomswet][ref4] aanspraak heeft op een
      bruto-ouderdomspensioen gelijk aan het bedrag, bedoeld in [artikel 9, tiende lid, onderdeel a of c][ref5].

      3 Het eerste en tweede lid is van overeenkomstige toepassing op de pensioengerechtigde,
