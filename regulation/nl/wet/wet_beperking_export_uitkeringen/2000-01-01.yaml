  - number: XI
    text: |-
      In afwijking van [artikel 4a van de Toeslagenwet][ref1] wordt aan de persoon, die op de dag voor de
      inwerkingtreding van deze wet op grond van [artikel 2 van de Toeslagenwet][ref2] recht heeft op een toeslag en op
      die dag niet woont in Nederland:

      a. gedurende het eerste jaar na inwerkingtreding van deze wet het bedrag uitbetaald waarop recht zou bestaan indien
      betrokkene in Nederland zou wonen;

      b. gedurende het tweede jaar na inwerkingtreding van deze wet twee derden van het bedrag uitbetaald waarop recht
      zou bestaan indien betrokkene in Nederland zou wonen;

      c. gedurende het derde jaar na inwerkingtreding van deze wet een derde van het bedrag uitbetaald waarop recht zou
      bestaan indien betrokkene in Nederland zou wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
