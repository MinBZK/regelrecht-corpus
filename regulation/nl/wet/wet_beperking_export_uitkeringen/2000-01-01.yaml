  - number: IX
    text: |-
      De [artikelen 20][ref1], [43b][ref2], en [47a, van de Wet op de arbeidsongeschiktheidsverzekering][ref3]
      zijn gedurende drie jaren na de dag van inwerkingtreding van deze wet niet van toepassing
      op de persoon, die op de dag voorafgaand aan de inwerkingtreding van deze wet, op grond
      van [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref4] recht heeft op
      arbeidsongeschiktheidsuitkering en op die dag niet woont in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43b
