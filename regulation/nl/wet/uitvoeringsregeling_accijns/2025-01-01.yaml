  - number: 22c
    text: |-
      1 De inspecteur bepaalt het bedrag van de zekerheid, bedoeld in [artikel 76, tweede lid, van de wet][ref1], op
      basis van het accijnsbelang.

      2 Het accijnsbelang van de bedrukte accijnszegels is gelijk aan het bedrag aan accijns dat de bedrukte
      accijnszegels vertegenwoordigen die de houder van de toestemming gemiddeld per maand in voorraad heeft.

      3 Het accijnsbelang van de onbedrukte accijnszegels is gelijk aan het bedrag aan accijns behorend bij een
      kleinhandelsprijs en hoeveelheid die de houder van de toestemming gemiddeld per maand op de onbedrukte blanco
      accijnszegels vermeldt of heeft vermeld.

      4 De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van
      € 9 000 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel76
