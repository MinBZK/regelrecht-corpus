  - number: '41'
    text: |-
      1 Onverminderd het bepaalde in [artikel 40][ref1] blijkt uit de zegeladministratie van de houder van een
      accijnsgoederenplaats of een geregistreerde geadresseerde die toestemming heeft om onbedrukte blanco accijnszegels
      aan te vragen, welke gegevens op de onbedrukte blanco accijnszegels zijn gedrukt.

      2 In de zegeladministratie, die een gescheiden onderdeel vormt van de administratie, bedoeld in de
      [artikelen 8][ref2] of [9a van het besluit][ref3], worden in ieder geval de procedures vastgelegd die zien op het
      zelf bedrukken of laten bedrukken met de in [artikel 49, eerste lid][ref4], genoemde gegevens.

      3 De administratieve organisatie moet zodanig zijn ingericht dat deze voldoende waarborgen biedt voor de
      functiescheiding tussen:

      a. de ontvangst van de onbedrukte blanco accijnszegels,

      b. het beheer van de onbedrukte blanco accijnszegels,

      c. het bedrukken van de onbedrukte blanco accijnszegels en

      d. het aanbrengen van de zelf bedrukte accijnszegels op de kleinhandelsverpakking.

      4 In de zegeladministratie wordt een duidelijk verband gelegd tussen de aangevraagde onbedrukte blanco
      accijnszegels en de op de accijnszegels gedrukte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel8
