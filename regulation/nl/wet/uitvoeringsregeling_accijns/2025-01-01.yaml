    text: |-
      1 Indien de inspecteur op grond van [artikel 9 van het besluit][ref1] voorwaarden stelt voor een vergunning voor
      een accijnsgoederenplaats waar accijnsgoederen worden geproduceerd of verwerkt, kan daarbij worden bepaald dat ter
      zake van de productie of verwerking werkaangiften moeten worden gedaan.

      2 De werkaangiften dienen ten minste twee werkdagen voor de aanvang van de productie of verwerking te worden
      ingediend bij de inspecteur.

      3 In de werkaangifte dienen te worden vermeld:

      a. de voorgenomen te produceren of verwerken hoeveelheden; en

      b. de tijdstippen waarop de productie of verwerking aanvangt en wordt beëindigd.

      4 De werkaangifte kan per werkweek geschieden.

      5 Indien overige alcoholhoudende producten worden geproduceerd of verwerkt, kan de inspecteur het gebruik van een
      ambtelijk afgesloten opvangreservoir voorschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel9
