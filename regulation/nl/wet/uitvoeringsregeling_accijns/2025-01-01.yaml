  - number: 3c
    text: |-
      1 Voor de toepassing van [artikel 2e, vijfde lid, van de wet][ref1] wordt verstaan onder normale reservoirs:

      a. de door de fabrikant blijvend in of aan alle voertuigen van hetzelfde type als het betrokken voertuig
      aangebrachte reservoirs, waarvan de blijvende inrichting het rechtstreeks verbruik van brandstof mogelijk maakt,
      zowel voor de voortbeweging van het voertuig als, in voorkomend geval, de werking van koelsystemen en andere
      systemen tijdens het vervoer. Als normale reservoirs gelden ook gasreservoirs die zijn aangepast voor gebruik in
      voertuigen en die het rechtstreeks verbruik van gas als brandstof mogelijk maken, alsmede de reservoirs die zijn
      aangesloten op andere systemen waarmee die voertuigen eventueel zijn uitgerust;

      b. de door de fabrikant blijvend in of aan alle containers van hetzelfde type als de betrokken container
      aangebrachte reservoirs, waarvan de blijvende inrichting het rechtstreeks verbruik van brandstof mogelijk maakt
      voor de werking, tijdens het vervoer, van koelsystemen en andere systemen waarmee containers voor speciale
      doeleinden zijn uitgerust;

      2 Voor de toepassing van [artikel 2e, vijfde lid, van de wet][ref2] wordt verstaan onder containers voor speciale
      doeleinden: alle containers die zijn uitgerust met aangepaste koelsystemen, systemen voor zuurstoftoevoer,
      thermische isolatiesystemen of andere systemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2e
  - number: '4'
    text: |-
      1 Het van toepassing zijn van het tarief van de accijns, bedoeld in [artikel 7, tweede lid, van de wet][ref1],
      moet bij de uitslag tot verbruik worden aangetoond door degene die het bier uitslaat tot verbruik.

      2 Indien de inrichting waar het bier is geproduceerd of verwerkt, slechts gedurende een deel van het aan de in het
      eerste lid bedoelde uitslag tot verbruik voorafgaande kalenderjaar in werking is geweest, wordt voor de toepassing
      van [artikel 7, tweede lid, van de wet][ref2], de productie van het desbetreffende kalenderjaar vastgesteld door de
      feitelijke productie te vermenigvuldigen met twaalf, gedeeld door het aantal maanden dat de inrichting in werking
      is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel7
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel4
