    text: |-
      1 De verklaring, bedoeld in [artikel 18a van het besluit][ref1], bevat de volgende gegevens:

      a. een uniek identificeerbaar nummer;

      b. indien de verklaring wordt opgesteld door de vergunninghouder van de accijnsgoederenplaats, de naam, het adres
      en het vergunningnummer van de vergunninghouder van de accijnsgoederenplaats;

      c. indien de verklaring wordt opgesteld door de handelaar die over een vergunning beschikt als bedoeld in
      [artikel 65, derde lid, van de wet][ref2], de naam, het adres en het vergunningnummer van de handelaar in de
      alcoholhoudende restproducten als grondstof voor het produceren van het diervoeder;

      d. de naam, adres en handtekening van de ontvanger die de alcoholhoudende restproducten als grondstof voor het
      produceren van het diervoeder gaat gebruiken;

      e. de plaats van levering;

      f. de soort en hoeveelheid van de alcoholhoudende restproducten die zijn geleverd;

      g. de datum van levering.

      2 De verklaring wordt in het Nederlands opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel18a
