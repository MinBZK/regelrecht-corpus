  - number: '32.1'
    text: |-
      Degene die in het bezit is van een vergunning als bedoeld in [artikel 23, eerste lid, van het besluit][ref1], dient
      in zijn administratie met betrekking tot de accijnsgoederen die worden gebruikt voor onderzoek, kwaliteitscontroles
      of smaaktesten buiten de accijnsgoederenplaats, op overzichtelijke wijze bij te houden:


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel23
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '23'
  - number: 32.1.a
    text: de soort, de hoeveelheid en de voor de accijnsheffing van belang zijnde samenstelling van de accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: 32.1.b
    text: het tijdstip van de overbrenging van de accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: 32.1.c
    text: |-
      het tijdstip van de overbrenging van de na afloop van het onderzoek, de controle of de smaaktest resterende
      accijnsgoederen alsmede de plaats waar de accijnsgoederen naar worden overgebracht. In de administratie
      worden ingeval van overbrenging naar een andere accijnsgoederenplaats dan die van de in de aanhef bedoelde
      vergunninghouder de naam, het adres en het vergunningnummer van de vergunninghouder van die andere
      accijnsgoederenplaats vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: '32.2'
    text: 'Degene die de accijnsgoederen met vrijstelling uitslaat tot verbruik neemt in zijn administratie tevens op:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: 32.2.a
    text: |-
      een afschrift van het ingevolge [artikel 23, tweede lid, van het besluit][ref1] gedane verzoek en van de daarbij
      overgelegde schriftelijke opdracht voor de onderzoeken, controles of testen;


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel23
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '23'
  - number: 32.2.b
    text: |-
      ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden overgebracht
      naar een derde land: elektronische of geprinte exemplaren van het uitvoergeleidedocument of de aangifte ten uitvoer
      alsmede van de bevestiging van uitgang, welke documenten zijn vereist op grond van de wettelijke bepalingen,
      bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 32.2.c
    text: |-
      ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden overgebracht
      naar een andere lidstaat: een bescheid waaruit blijkt dat de accijnsgoederen hun bestemming hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: 32.2.d
    text: |-
      ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden vernietigd
      onder ambtelijk toezicht: een afschrift van de ter zake opgemaakte ambtelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
  - number: '32.3'
    text: |-
      Degene die de accijnsgoederen met vrijstelling invoert neemt in zijn administratie tevens een elektronisch of
      geprint exemplaar op van de voor de desbetreffende accijnsgoederen ingevolge de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], gedane aangifte voor het vrije verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 32a.1
    text: |-
      Vrijstelling van accijns ter zake van de uitslag van accijnsgoederen uit een accijnsgoederenplaats wordt verleend
      in gevallen waarin bij invoer deze accijnsgoederen met toepassing van de [artikelen 7:8][ref1], [7:9][ref2] of
      [7:11 van de Algemene douaneregeling][ref3] met vrijstelling van rechten bij invoer zouden kunnen worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0024291#Artikel7
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0024291
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0024291
        artikel: '7'
  - number: 32a.2
    text: |-
      Vóór de uitslag dient een vergunning van de inspecteur te zijn verkregen. De vergunninghouder van de
      accijnsgoederenplaats dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32a
  - number: 32a.3
    text: De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32a
  - number: 32b.1
    text: |-
      Voor een verzoek om teruggaaf van accijns wordt gebruik gemaakt van een van rijkswege beschikbaar gesteld
      elektronisch formulier dat via elektronische weg wordt ingediend op de op dat formulier aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: 32b.2
    text: |-
      De inspecteur kan ontheffing verlenen voor het gebruik van het van rijkswege beschikbaar gestelde elektronische
      formulier, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: 32b.3
    text: |-
      Tenzij anders bepaald wordt een verzoek om teruggaaf van accijns ingediend bij de inspecteur uiterlijk drie maanden
      na afloop van het kalenderkwartaal waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: 32b.4
    text: |-
      Degene die verzoekt om teruggaaf van accijns neemt in zijn administratie de aankoopfacturen van de desbetreffende
      accijnsgoederen op alsmede alle andere bescheiden die in verband met het verzoek om teruggaaf zijn vereist.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: 32b.5
    text: |-
      De administratie van degene die verzoekt om teruggaaf van accijns is voorts zodanig ingericht, dat daarin op
      overzichtelijke wijze alle van belang zijnde gegevens zijn opgenomen voor de beoordeling van het bedrag van de
      teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: '33.1'
    text: |-
      Een verzoek om teruggaaf van accijns als bedoeld in [artikel 70, eerste lid, van de wet][ref1] wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel70
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
