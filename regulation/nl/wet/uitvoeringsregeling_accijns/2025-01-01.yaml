  - number: 3a
    text: |-
      De hoeveelheden, bedoeld in [artikel 2d, tweede lid, van de wet][ref1], bedragen voor:

      a. bier: 110 L;

      b. wijn: 90 L (waarvan maximaal 60 L mousserende wijn);

      c. tussenproducten: 20 L;

      d. overige alcoholhoudende producten: 10 L;

      e. sigaretten: 800 stuks;

      f. sigaren: 200 stuks;

      g. cigarillo’s (sigaren met een maximumgewicht van 3 g/stuk): 400 stuks;

      h. rooktabak: 1 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
    references:
