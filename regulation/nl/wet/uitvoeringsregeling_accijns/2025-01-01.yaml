  - number: '40'
    text: |-
      1 In de zegeladministratie, bedoeld in [artikel 9e, eerste lid, van het besluit][ref1], wordt in ieder geval
      aantekening gehouden van:

      a. de aangevraagde en ontvangen accijnszegels;

      b. de tariefcode, de kleinhandelsprijs en de hoeveelheid op iedere accijnszegel;

      c. het aanbrengen van accijnszegels op de verpakking in Nederland en in het buitenland;

      d. het terugsturen van vellen met accijnszegels die niet aan de kwaliteitseisen voldoen of niet zijn geleverd
      overeenkomstig de aanvraag;

      e. het vernietigen onder ambtelijk toezicht van losse accijnszegels of beschadigde vellen met accijnszegels en het
      verloren gaan van de accijnszegels ten gevolge van ongeval of overmacht;

      f. de accijnszegels die zijn aangebracht op de tot verbruik uitgeslagen tabaksproducten;

      g. als het een accijnsgoederenplaats betreft de accijnszegels die zijn aangebracht op de tot verbruik uitgeslagen
      tabaksproducten die in de accijnsgoederenplaats opnieuw zijn ingeslagen; en

      h. de locatie waar de accijnszegels zich bevinden of de locatie waar de tabaksproducten zich bevinden waarop de
      accijnszegels zijn aangebracht voor zover deze tabaksproducten nog niet zijn opgenomen in een aangifte als bedoeld
      in de [artikelen 53][ref2] en [53a van de wet][ref3] of in een aangifte tot het brengen in het vrije verkeer van de
      EU, bedoeld in artikel 201 van het Douanewetboek van de Unie.

      2 Bij de zegeladministratie worden de volgende bescheiden bewaard:

      a. de aanvragen om accijnszegels en de afgetekende kopie ontvangstbewijzen van de geleverde accijnszegels;

      b. de door de zegelproducent voor ontvangst afgetekende formulieren voor teruggezonden accijnszegels;

      c. de ambtelijke verklaringen met betrekking tot de accijnszegels die zijn vernietigd of verloren gegaan; en

      d. een specificatie, waaruit blijkt hoe het bedrag aan accijns dat op de aangifte, bedoeld in [artikel 53][ref4]
      of [53a van de wet][ref5], of naar aanleiding van de uitnodiging van betaling, bedoeld in artikel 102 van
      het Douanewetboek van de Unie, is voldaan, is berekend onderscheiden naar het soort tabaksproduct en de op de
      accijnszegel vermelde hoeveelheid en kleinhandelsprijs.

      3 De administratie van een bedrijf dat een toestemming voor het aanvragen van accijnszegels heeft als bedoeld in
      [artikel 75, tweede lid, van de wet][ref6], moet zodanig zijn ingericht dat:

      a. een juiste, volledige en tijdige vastlegging van de bedrijfshandelingen gewaarborgd is; en

      b. alle voor de heffing van accijns van belang zijnde gegevens op overzichtelijke wijze zijn opgenomen.

      4 Onverminderd het eerste en tweede lid moet bij een bedrijf dat een toestemming voor het aanvragen van
      accijnszegels heeft als bedoeld in [artikel 75, tweede lid, van de wet][ref7]:

      a. de zegeladministratie gerelateerd kunnen worden aan de administratie waarin de orders van en de financiële
      transacties met het bedrijf dat in het buitenland de tabaksproducten van accijnszegels voorziet zijn opgenomen; en

      b. bij de zegeladministratie een afschrift worden bewaard van de aangifte, bedoeld in de [artikelen 53][ref8] en
      [53a van de wet][ref9] of van de aangifte tot het brengen in het vrije verkeer van de EU, bedoeld in artikel 201
      van het Douanewetboek van de Unie, voor de van accijnszegels voorziene tabaksproducten.


