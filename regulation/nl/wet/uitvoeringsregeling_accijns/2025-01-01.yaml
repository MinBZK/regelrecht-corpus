  - number: '20'
    text: |-
      1 In een verzoek om een vergunning voor een accijnsgoederenplaats dienen met betrekking tot hetgeen in
      [artikel 42 van de wet][ref1] is bepaald, in elk geval te worden vermeld:

      a. een omschrijving van de aard van het bedrijf waaruit onder meer moet blijken of de vergunning mede wordt
      gevraagd voor de productie of verwerking van de desbetreffende accijnsgoederen of uitsluitend voor het voorhanden
      of in opslag hebben van de desbetreffende accijnsgoederen;

      b. het adres en de kadastrale aanduiding van de plaats waar de accijnsgoederenplaats wordt gevestigd;

      c. een omschrijving van de administratie en de administratieve organisatie, alsmede het adres waar de administratie
      wordt gehouden;

      d. met betrekking tot accijnsgoederenplaatsen waar overige alcoholhoudende producten worden geproduceerd of
      verwerkt, het aantal en de inhoud van de apparaten waarin de productie of verwerking plaatsvindt; en

      e. met betrekking tot accijnsgoederenplaatsen waar bier wordt geproduceerd of verwerkt, het aantal en de inhoud van
      de bierketels waarin het wort wordt gekookt.

      2 Indien toepassing van [artikel 2a van het besluit][ref2] wordt gewenst, wordt dit in het verzoek, bedoeld in het
      eerste lid, opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
