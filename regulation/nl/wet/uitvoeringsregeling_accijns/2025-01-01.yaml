        artikel: '3'
  - number: 3bis
    text: |-
      1 Als uitslag tot verbruik wordt niet aangemerkt het gedeeltelijke verlies als gevolg van de aard van de goederen,
      bedoeld in de [artikelen 2, achtste lid][ref1], en [3, vierde lid, van de wet][ref2], dat zich voordoet tijdens
      het vervoer van minerale oliën en ethylalcohol per tankwagen of tanker in hoeveelheden van ten minste 5.000 liter
      of kilogram per soort accijnsgoed, voor zover het verlies niet hoger is dan de volgende vastgestelde verliesnormen:

        - lichte olie: 0,3%;
        - halfzware olie: 0,2%;
        - gasolie: 0,2%;
        - zware stookolie: 0,4%;
        - vloeibaar gemaakt petroleumgas: 1%;
        - ethylalcohol: 0,3%.

      2 In afwijking van het eerste lid geldt voor het gedeeltelijke verlies dat zich voordoet tijdens het vervoer over
      zee per tanker, in hoeveelheden van ten minste 150.000 liter of kilogram, een norm van 1% voor vloeibaar gemaakt
      petroleumgas en 0,4% voor alle andere minerale oliën en ethylalcohol.

      3 Het gedeeltelijke verlies, bedoeld in het eerste lid:

      a. is ontstaan door meetonnauwkeurigheden, ladingresten of verdamping van het accijnsproduct;

      b. is niet ontstaan door fraude of een onregelmatigheid tijdens het vervoer.

      4 Bij ontvangst van de accijnsgoederen tekent de geadresseerde de werkelijk ontvangen hoeveelheid en de
      minderbevonden hoeveelheid accijnsgoederen aan in de administratie van de ontvanger alsmede in het bericht van
      ontvangst of op de maandverklaring.

      5 Ingeval het daadwerkelijke verlies groter is dan de verliesnorm wordt op het daadwerkelijke verlies de
      verliesnorm in mindering gebracht

      6 Ingeval het daadwerkelijke verlies minder is dan de verliesnorm wordt alleen het daadwerkelijke verlies niet als
      uitslag tot verbruik aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
    references:
