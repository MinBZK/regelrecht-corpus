  - number: 35i
    text: |-
      1 Het verzoek om teruggaaf van accijns, bedoeld in [artikel 69a, eerste lid, van de wet][ref1], wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin het gebruik voor het opwekken van elektriciteit in
      een installatie met een elektrisch vermogen van minimaal 60 kilowatt heeft plaatsgevonden.

      2 In de administratie van degene die verzoekt om teruggaaf van accijns is opgenomen:

      a. het tijdvak waarover teruggaaf van accijns is verzocht;

      b. de hoeveelheid en de soort minerale olie waarvoor teruggaaf van accijns is verzocht; en

      c. de datum van ontvangst van de desbetreffende minerale oliën.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69a
