    text: |-
      In een verzoek om een vergunning voor een geregistreerde geadresseerde moeten met betrekking tot hetgeen in
      [artikel 50c van de wet][ref1] is bepaald, in ieder geval worden vermeld:

      a. een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf waar de
      accijnsgoederen worden ontvangen;

      b. het adres waar de geregistreerde geadresseerde wordt gevestigd;

      c. een omschrijving van de administratie, alsmede het adres waar de administratie wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50c
