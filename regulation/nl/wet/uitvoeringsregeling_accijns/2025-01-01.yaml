  - number: '42'
    text: |-
      1 De accijnszegels worden aangevraagd bij de zegelproducent die door de directeur-generaal Douane, bedoeld in
      [artikel 4, tweede lid, van de Uitvoeringsregeling belastingdienst 2003][ref1], is aangewezen.

      2 De zegelproducent mag zich laten vertegenwoordigen door een distributeur van de accijnszegels.

      3 Voor het aanvragen van accijnszegels wordt gebruikgemaakt van het formulier dat door de zegelproducent
      verkrijgbaar wordt gesteld. De aanvraag bevat de volgende gegevens:

      a. naam, adres en plaats van de aanvrager;

      b. naam en telefoonnummer van de contactpersoon van de aanvrager;

      c. het nummer van de toestemming om accijnszegels aan te vragen;

      d. een door de aanvrager toegekend doorlopend nummer;

      e. het aantal vellen bedrukte accijnszegels waarbij per tabaksproduct wordt aangegeven:

      1° het aantal accijnszegels per vel;

      2° de kleinhandelsprijs en de hoeveelheid op de accijnszegel, voor sigaretten in stuks en voor rooktabak het
      nettogewicht in grammen; en

      3° de aanwezige voorraad accijnszegels onderscheiden naar tariefcode en het soort tabaksproduct;

      f. het aantal vellen onbedrukte blanco accijnszegels.

      4 Het formulier wordt elektronisch ingediend. De zegelproducent stelt middelen ter beschikking voor het
      elektronisch indienen en ondertekenen van het formulier.

      5 De zegelproducent en de aanvrager leggen de aanvraag vast in hun administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel4
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '4'
  - number: '43'
    text: |-
      1 De accijnszegels worden verkrijgbaar gesteld door de zegelproducent op het distributiepunt in hoeveelheden van
      één of meer vellen.

      2 De onbedrukte blanco accijnszegels worden in één vel met een aantal accijnszegels beschikbaar gesteld. De vellen
      met onbedrukte blanco accijnszegels worden in een veelvoud van 100 stuks aangevraagd.

      3 De bedrukte accijnszegels worden per tabaksproduct in vellen met een verschillend aantal accijnszegels
      beschikbaar gesteld. Het aantal accijnszegels per vel wordt door de zegelproducent vastgesteld.

      4 Als de aangevraagde accijnszegels niet binnen vier weken na het tijdstip waarop zij op het distributiepunt
      beschikbaar zijn gesteld zijn afgehaald, wordt de aanvraag geacht niet te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel43
  - number: '44'
    text: |-
      1 De accijnszegels hebben de vorm van een rechthoek en hebben een grootte van 2,0 x 4,4 cm.

      2 Voor sigaretten en rooktabak worden op de accijnszegels de hoeveelheid (nettomassa of aantal stuks), de soort
      van het tabaksproduct en de kleinhandelsprijs gedrukt op een door de inspecteur voorgeschreven plaats. Voor sigaren
      worden op de accijnszegels de soort van het tabaksproduct en de kleinhandelsprijs gedrukt op een door de inspecteur
      voorgeschreven plaats. De naam van degene die de accijnszegels heeft aangevraagd wordt opgenomen op een door de
      inspecteur voorgeschreven plaats.

      3 Op de zegel is op een door de inspecteur voorgeschreven plaats de tariefcode AB12 voor sigaretten en BB12 voor
      rooktabak vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel44
  - number: '45'
    text: |-
      1 De accijnszegels worden met een kleefstof duurzaam bevestigd op de verpakking van tabaksproducten.

      2 De accijnszegels moeten op de verpakking zodanig worden aangebracht dat alle op de accijnszegels voorkomende
      vermeldingen duidelijk leesbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel45
  - number: '46'
    text: |-
      1 Op de verpakking van tabaksproducten worden de soort en de hoeveelheid van het tabaksproduct, het merk waaronder
      het tabaksproduct in de handel wordt gebracht en, ter keuze van degene die de accijnszegels heeft aangevraagd, zijn
      naam dan wel het fabrieks- of handelsmerk of het nummer, bedoeld in [artikel 48, eerste lid][ref1], vermeld. De
      vermelding van de soort van het tabaksproduct kan achterwege blijven als er geen twijfel bestaat over de inhoud van
      de verpakking.

      2 De verpakking bevat geen andere voorwerpen dan tabaksproducten.

      3 De verpakking is niet zodanig van aard en vorm dat daarmee tevens een later gebruik voor andere doeleinden wordt
      beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel48
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel46
    references:
      - id: ref1
