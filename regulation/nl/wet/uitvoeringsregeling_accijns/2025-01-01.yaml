        artikel: 2d
  - number: 3b
    text: |-
      1 De inspecteur bepaalt na overleg met de vergunninghouder welke in [artikel 6c, tweede lid, van het besluit][ref1]
      bedoelde productie-eenheden tot een productielocatie kunnen worden gerekend.

      2 De in [artikel 6c, vierde lid, van het besluit][ref2] bedoelde energiebalans wordt opgesteld op basis van in
      overleg met de inspecteur te bepalen energie-equivalenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6c
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel6c
