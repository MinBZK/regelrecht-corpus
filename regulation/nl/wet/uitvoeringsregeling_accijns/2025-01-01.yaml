  - number: '16'
    text: |-
      Indien bier, wijn, tussenproducten, overige alcoholhoudende producten en tabaksproducten zijn verpakt in
      kleinhandelsverpakking, wordt het volume of de massa in aanmerking genomen dat op de verpakking is vermeld,
      mits de wijze waarop dat is vastgesteld en de aanduiding ervan voldoen aan de voorschriften gesteld bij het
      [Warenwetbesluit hoeveelheden voorverpakkingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035560
