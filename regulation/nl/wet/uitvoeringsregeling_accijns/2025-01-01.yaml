      In een verzoek om een vergunning als gecertificeerde afzender wordt met betrekking tot hetgeen in
      [artikel 50k van de wet][ref1] is bepaald in ieder geval vermeld:

      a. een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf;

      b. het adres waar de gecertificeerde afzender wordt gevestigd;

      c. een omschrijving van de administratie van de gecertificeerde afzender en het adres waar deze administratie wordt
