  - number: '32'
    text: |-
      1 Degene die in het bezit is van een vergunning als bedoeld in [artikel 23, eerste lid, van het besluit][ref1],
      dient in zijn administratie met betrekking tot de accijnsgoederen die worden gebruikt voor onderzoek,
      kwaliteitscontroles of smaaktesten buiten de accijnsgoederenplaats, op overzichtelijke wijze bij te houden:

      a. de soort, de hoeveelheid en de voor de accijnsheffing van belang zijnde samenstelling van de accijnsgoederen;

      b. het tijdstip van de overbrenging van de accijnsgoederen;

      c. het tijdstip van de overbrenging van de na afloop van het onderzoek, de controle of de smaaktest resterende
      accijnsgoederen alsmede de plaats waar de accijnsgoederen naar worden overgebracht. In de administratie
      worden ingeval van overbrenging naar een andere accijnsgoederenplaats dan die van de in de aanhef bedoelde
      vergunninghouder de naam, het adres en het vergunningnummer van de vergunninghouder van die andere
      accijnsgoederenplaats vermeld.

      2 Degene die de accijnsgoederen met vrijstelling uitslaat tot verbruik neemt in zijn administratie tevens op:

      a. een afschrift van het ingevolge [artikel 23, tweede lid, van het besluit][ref2] gedane verzoek en van de daarbij
      overgelegde schriftelijke opdracht voor de onderzoeken, controles of testen;

      b. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden
      overgebracht naar een derde land: elektronische of geprinte exemplaren van het uitvoergeleidedocument of de
      aangifte ten uitvoer alsmede van de bevestiging van uitgang, welke documenten zijn vereist op grond van de
      wettelijke bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref3];

      c. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden
      overgebracht naar een andere lidstaat: een bescheid waaruit blijkt dat de accijnsgoederen hun bestemming hebben
      bereikt.

      d. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende accijnsgoederen worden vernietigd
      onder ambtelijk toezicht: een afschrift van de ter zake opgemaakte ambtelijke verklaring.

      3 Degene die de accijnsgoederen met vrijstelling invoert neemt in zijn administratie tevens een elektronisch of
      geprint exemplaar op van de voor de desbetreffende accijnsgoederen ingevolge de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref4], gedane aangifte voor het vrije verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel11
