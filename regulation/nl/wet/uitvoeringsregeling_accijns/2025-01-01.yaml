  - number: '14'
    text: |-
      1 De herleiding tot een hoeveelheid bij een temperatuur van 15°C van een hoeveelheid lichte olie, halfzware
      olie of gasolie waarvan de dichtheid, gemeten met de areometer en uitgedrukt in grammen per milliliter bij een
      andere temperatuur is opgenomen, geschiedt aan de hand van de in [bijlage MO.2][ref1] bij deze regeling opgenomen
      tabel, dan wel met gebruikmaking van de ASTM-IP tabellen 54A en 54B, genoemd in de meest actuele versie van de
      gestandaardiseerde methoden ASTM-D1250 of ISO 91-1.

      2 Indien de temperatuur waarbij de hoeveelheid van de minerale olie is opgenomen lager of hoger is dan 15°C wordt
      de door de tabel aangegeven correctie bijgeteld, onderscheidenlijk afgetrokken.

      3 Het verschil tussen de dichtheid, uitgedrukt in grammen per milliliter, bij de temperatuur waarbij de hoeveelheid
      is opgenomen en de dichtheid, bepaald bij de temperatuur van de proef, wordt verwaarloosd.

      4 Het bepaalde in het eerste tot en met derde lid is eveneens van toepassing op minerale oliën die ingevolge
      [artikel 28 van de wet][ref2] als lichte olie, halfzware olie of gasolie worden aangemerkt.

      5 In afwijking van het bepaalde in het vierde lid kan met betrekking tot de in dat lid bedoelde mengsels, hetzij
      op verzoek van de belanghebbende, hetzij ambtshalve, een door laboratoriumonderzoek vastgestelde volumecorrectie
      worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
