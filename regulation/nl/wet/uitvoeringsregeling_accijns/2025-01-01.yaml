    text: |-
      1 Voor een verzoek om teruggaaf van accijns wordt gebruik gemaakt van een van rijkswege beschikbaar gesteld
      elektronisch formulier dat via elektronische weg wordt ingediend op de op dat formulier aangegeven wijze.

      2 De inspecteur kan ontheffing verlenen voor het gebruik van het van rijkswege beschikbaar gestelde elektronische
      formulier, bedoeld in het eerste lid.

      3 Tenzij anders bepaald wordt een verzoek om teruggaaf van accijns ingediend bij de inspecteur uiterlijk drie
      maanden na afloop van het kalenderkwartaal waarin het recht op teruggaaf is ontstaan.

      4 Degene die verzoekt om teruggaaf van accijns neemt in zijn administratie de aankoopfacturen van de desbetreffende
      accijnsgoederen op alsmede alle andere bescheiden die in verband met het verzoek om teruggaaf zijn vereist.

      5 De administratie van degene die verzoekt om teruggaaf van accijns is voorts zodanig ingericht, dat daarin op
      overzichtelijke wijze alle van belang zijnde gegevens zijn opgenomen voor de beoordeling van het bedrag van de
      teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel32b
  - number: '33'
    text: |-
      1 Een verzoek om teruggaaf van accijns als bedoeld in [artikel 70, eerste lid, van de wet][ref1] wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin:

      a. de in [artikel 64a van de wet][ref2] bedoelde accijnsgoederen zijn geproduceerd of verwerkt;

      b. de accijnsgoederen zijn gebruikt overeenkomstig de in de [artikelen 64][ref3], [64a][ref4] of
      [65, eerste lid, onderdeel b, van de wet][ref5] bedoelde bestemming;

      c. de minerale oliën de in [artikel 66 van de wet][ref6] bedoelde bestemming hebben gevolgd;

      d. de accijnsgoederen de in [artikel 66a van de wet][ref7] bedoelde bestemming hebben gevolgd.

      2 De verklaring, bedoeld in [artikel 25 van het besluit][ref8], bevat in het geval van levering aan een schip de
      volgende gegevens:

      a. een uniek identificeerbaar nummer;

      b. de naam en het adres van degene die de accijnsgoederen levert;

      c. de naam en het adres van de eigenaar of exploitant van het schip;

      d. de naam van het schip en het registratienummer;

      e. de plaats van levering;

      f. de soort en de hoeveelheid van de accijnsgoederen die zijn geleverd;

      g. de datum van levering;

      h. de naam en handtekening van de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van
      het schip;

      i. in geval van levering van de in [artikel 19a van het besluit][ref9] bedoelde accijnsgoederen, het reisdoel van
      het schip;

      j. in geval van levering uit een schip, de naam en het registratienummer van het schip van waaruit is geleverd.

      3 De verklaring, bedoeld in [artikel 25 van het besluit][ref10], bevat in het geval van levering aan een
      luchtvaartuig de volgende gegevens:

      a. een uniek identificeerbaar nummer;

      b. de naam en het adres van degene die de accijnsgoederen levert;

      c. de naam en het adres van de eigenaar of exploitant van het luchtvaartuig;

      d. het registratienummer van het luchtvaartuig waarvoor de accijnsgoederen zijn bestemd;

      e. het vertrek- en eindpunt van de vlucht;

      f. de plaats van levering;

      g. de soort en de hoeveelheid van de accijnsgoederen die zijn geleverd;

      h. de datum van levering;

      i. de naam en handtekening van de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord
      van het luchtvaartuig.

      4 De verklaring bedoeld in het tweede en derde lid wordt in het Nederlands of in het Engels opgesteld.


