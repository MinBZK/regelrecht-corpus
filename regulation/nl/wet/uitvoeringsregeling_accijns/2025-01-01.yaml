  - number: '34'
    text: |-
      1 Een verzoek om teruggaaf van accijns als bedoeld in [artikel 71, eerste lid, onderdelen a en b, van de wet][ref1]
      voor accijnsgoederen die zijn verloren gegaan of onder ambtelijk toezicht zijn vernietigd wordt gedaan uiterlijk
      drie maanden na afloop van het kalenderkwartaal waarin de accijnsgoederen zijn verloren gegaan of onder ambtelijk
      toezicht zijn vernietigd.

      2 In de administratie van degene die verzoekt om teruggaaf van accijns zijn de volgende gegevens opgenomen:

      a. de soort en de hoeveelheid van de accijnsgoederen alsmede de waarde ervan of de andere voor de vaststelling van
      het bedrag van de teruggaaf van belang zijnde gegevens;

      b. het tijdstip, de plaats en de oorzaak van het verloren gaan, dan wel de vermelding van de ambtelijke verklaring
      van de vernietiging;

      c. wanneer mededeling is gedaan van het verloren gaan; en

      d. de soort en de hoeveelheid alsmede de waarde van de restanten van verloren gegane goederen en andere van belang
      zijnde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: '35'
    text: |-
      Een verzoek om teruggaaf van accijns als bedoeld in
      [artikel 71, eerste lid, onderdelen c, d, e en f, van de wet][ref1] wordt gedaan uiterlijk drie maanden na afloop
      van het kalenderkwartaal waarin de accijnsgoederen hun bestemming hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 35c
    text: |-
      [Artikel 26 van de Uitvoeringsregeling belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing
      op de teruggaafregeling, bedoeld in [artikel 71g, eerste lid, van de wet][ref2], met dien verstande dat in
      [artikel 26, eerste lid, onderdeel c, en tweede lid, onderdeel c][ref3], voor ‘eindfactuur’ wordt gelezen:
      aankoopfactuur. De in artikel 26, eerste lid, onderdelen a en c, en tweede lid, onderdelen a, c en d, genoemde
      bescheiden moeten zijn opgenomen in de administratie. Hetgeen op grond van artikel 26, eerste lid, onderdeel d, en
      tweede lid, onderdeel b, moet worden verklaard wordt aangetoond aan de hand van de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007159#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel26
