  - number: '58'
    text: |-
      1 In een vergunning voor het vervaardigen van distilleertoestellen worden opgenomen:

      a. de naam en het adres van degene aan wie de vergunning wordt verleend;

      b. de plaats waar de vervaardiging plaatsvindt;

      c. dat uit de administratie dient te blijken het gebruiksdoel en de naam en het adres van degene voor wie het
      toestel is bestemd, alsmede het adres waar het toestel zal worden gebruikt.

      2 In een vergunning voor het voorhanden hebben van een distilleertoestel worden opgenomen de naam en het adres van
      degene aan wie de vergunning wordt verleend, het gebruiksdoel van het toestel en het adres waar het toestel wordt
      gebruikt.

      3 In het verzoek om een vergunning dienen de in het eerste lid, onderdelen a en b, dan wel het tweede lid bedoelde
      gegevens te worden vermeld.

      4 De inspecteur is bevoegd distilleertoestellen te voorzien van ambtelijke herkenningsmerken.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: '59'
    text: |-
      Als distilleertoestellen als bedoeld in [artikel 90, zevende lid, onderdeel b, van de wet][ref1] worden aangewezen
      de in [bijlage A.3][ref2] bij deze regeling omschreven toestellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0005355
  - number: 59a
    text: |-
      1 In een vergunning voor het in het vrije verkeer brengen, het brengen naar een andere lidstaat of de uitvoer naar
      een derde land van een tabaksproductieapparaat worden opgenomen:

      a. de naam en het adres van degene aan wie de vergunning wordt verleend;

      b. de naam en het adres van degene voor wie het betreffende tabaksproductieapparaat is bestemd; en

      c. een specifieke beschrijving van het betreffende tabaksproductieapparaat.

      2 In een vergunning voor het vervaardigen van een tabaksproductieapparaat worden opgenomen:

      a. de naam en het adres van degene aan wie de vergunning wordt verleend;

      b. het adres waar de vervaardiging plaatsvindt;

      c. een verklaring dat uit de administratie het volgende blijkt:

      1°. de naam en het adres van degene voor wie het tabaksproductieapparaat is bestemd en het adres waar het
      tabaksproductieapparaat zal worden gebruikt zodra deze informatie bekend is;

      2°. het adres waar het tabaksproductieapparaat voorhanden wordt gehouden totdat het tabaksproductieapparaat een
      nadere bestemming krijgt; en

      d. een specifieke beschrijving van het te vervaardigen tabaksproductieapparaat.

      3 In een vergunning voor het voorhanden hebben van een tabaksproductieapparaat worden opgenomen:

      a. de naam en het adres van degene aan wie de vergunning wordt verleend;

      b. de bestemming van het tabaksproductieapparaat;

      c. een specifieke beschrijving van het betreffende tabaksproductieapparaat; en

      d. het adres waar het tabaksproductieapparaat voorhanden wordt gehouden.

      4 Een vergunning voor het in het vrije verkeer brengen, het brengen naar een andere lidstaat, de uitvoer naar een
      derde land of het vervaardigen van een tabaksproductieapparaat houdt tevens in een vergunning voor het voorhanden
      hebben van het vervaardigde apparaat.

      5 In het verzoek om een vergunning dienen de voor het verlenen van de vergunning benodigde gegevens te worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59b
    text: |-
      Een vrijstelling van de vergunningplicht als bedoeld in [artikel 90a, vierde lid, onderdeel b, van de wet][ref1]
      geldt in de gevallen waarin:

      a. een tabaksproductieapparaat is bestemd te worden gebruikt voor het op eenvoudige wijze produceren van een
      sigaret in de persoonlijke sfeer, waarbij die sigaret wordt verbruikt door de producent, door een gezinslid of
      huisgenoot van de producent of zijn gasten en er geen sprake is van productie van sigaretten voor commerciële
      doeleinden;

      b. een tabaksproductieapparaat voorhanden wordt gehouden in een accijnsgoederenplaats waar onder schorsing van
      accijns tabaksproducten mogen worden geproduceerd of verwerkt, mits uit de administratie van de vergunninghouder
      van de accijnsgoederenplaats blijkt welke tabaksproductieapparaten hij in gebruik heeft of die hij voornemens is te
      gaan gebruiken;

      c. een tabaksproductieapparaat wordt vervoerd naar een houder van een vergunning als bedoeld in
      [artikel 90a, eerste lid, van de wet][ref2] dan wel naar een accijnsgoederenplaats als bedoeld in onderdeel b
      indien dit vervoer blijkt uit de administratie of de vrachtbrief van de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel90a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59b
    references:
