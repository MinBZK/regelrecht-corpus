  - number: '21'
    text: |-
      1 Een vergunninghouder van een accijnsgoederenplaats die tevens vergunninghouder is van één of meer andere
      accijnsgoederenplaatsen kan op verzoek één aangifte voor die plaatsen tezamen doen, indien:

      a. de administratie van de desbetreffende accijnsgoederenplaatsen op één centrale plaats wordt gevoerd;

      b. de centrale administratie en de administratieve organisatie van de desbetreffende accijnsgoederenplaatsen
      zodanig is dat het toezicht op de heffing is gewaarborgd en uit de administratie op duidelijke wijze blijkt op
      welke accijnsgoederenplaats de onderscheiden posten van die aangifte betrekking hebben.

      2 Het verzoek wordt ingediend bij de inspecteur onder wie de plaats ressorteert waar de centrale administratie
      wordt gevoerd. Een afschrift van het verzoek wordt gezonden naar de inspecteurs die de vergunningen voor de
      desbetreffende accijnsgoederenplaatsen hebben verleend.

      3 De toestemming voor toepassing van het eerste lid wordt opgenomen in de vergunningen voor de desbetreffende
      accijnsgoederenplaatsen. Daarbij kunnen aanvullende voorwaarden worden opgenomen omtrent het doen van de
      verzamelaangifte en de wijze waarop de administratie en de administratieve organisatie van de desbetreffende
      accijnsgoederenplaatsen moeten zijn ingericht.

      4 Op de toestemming zijn de [artikelen 43 tot en met 50 van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '22'
    text: |-
      1 Voor de accijns die de vergunninghouder van een accijnsgoederenplaats verschuldigd is of kan worden, stelt hij
      zekerheid. De zekerheid wordt bepaald op basis van het accijnsbelang.

      2 Het accijnsbelang is de som van het bedrag aan accijns dat wordt vertegenwoordigd door de hoeveelheid
      accijnsgoederen die:

      a. gemiddeld in de accijnsgoederenplaats voorhanden of in opslag is;

      b. gemiddeld in een aangiftetijdvak wordt uitgeslagen tot verbruik;

      c. gemiddeld in een aangiftetijdvak met een e-AD of een ander daartoe aangewezen bescheid wordt overgebracht naar
      een accijnsgoederenplaats, een douane-entrepot of het buitenland; en

      d. gemiddeld in een aangiftetijdvak met toepassing van [artikel 2a van het besluit][ref1] wordt overgebracht naar
      een andere accijnsgoederenplaats.

      3 Indien op grond van [artikel 21][ref2] toestemming is verleend voor het doen van één aangifte voor twee of meer
      accijnsgoederenplaatsen worden de afzonderlijke zekerheidstellingen voor de desbetreffende accijnsgoederenplaatsen
      vervangen door één zekerheid die voor die accijnsgoederenplaatsen tezamen van toepassing is. Het hierbij in
      acht te nemen accijnsbelang wordt gevormd door het totale accijnsbelang dat op basis van het tweede lid en in
      [artikel 22c, tweede lid][ref3] voor de desbetreffende accijnsgoederenplaatsen is vastgesteld.

      4 De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van €
      9 000 000.

      5 Geen zekerheidstelling is vereist wanneer een overheidslichaam de accijns verschuldigd is of kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
