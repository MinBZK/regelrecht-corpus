  - number: '49'
    text: |-
      1 De houder van een toestemming om onbedrukte blanco zegels aan te vragen drukt op de accijnszegels
      de tariefcode, het soort tabaksproduct, de kleinhandelsprijs en de hoeveelheid overeenkomstig
      [artikel 44, tweede en derde lid][ref1].

      2 De soort van het tabaksproduct, de kleinhandelsprijs en, bij rooktabak en sigaretten, de hoeveelheid die op de
      onbedrukte blanco accijnszegels worden vermeld komen overeen met de inhoud van de verpakking van de tabaksproducten
      en de kleinhandelsprijs waartegen de tabaksproducten aan anderen dan wederverkopers worden verkocht.

      3 De vermeldingen worden op een duidelijke en onuitwisbare wijze aangebracht op de plaats, bedoeld in
      [artikel 44, tweede en derde lid][ref2]. Het bedrukken vindt plaats met zwarte inkt en met hetzelfde lettertype als
      waarmee de gegevens, bedoeld in [artikel 48, tweede en derde lid][ref3], worden gedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel44
