        bwb_id: BWBR0005251
        artikel: '70'
  - number: 33.1.a
    text: |-
      de in [artikel 64a van de wet][ref1] bedoelde accijnsgoederen zijn geproduceerd of verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
    references:
