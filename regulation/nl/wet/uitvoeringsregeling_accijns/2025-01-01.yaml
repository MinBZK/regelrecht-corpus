  - number: 52a
    text: |-
      1 De inspecteur kan bepalen dat accijnszegels die bij het normale productieproces verloren zijn gegaan niet als
      vermist worden aangemerkt.

      2 De aanvrager doet maandelijks mededeling van de hoeveelheid accijnszegels, bedoeld in het eerste lid, die
      verloren zijn gegaan bij het normale productieproces.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52a
  - number: '54'
    text: |-
      1 Als een in [artikel 34, eerste lid, van het besluit][ref1] bedoeld bescheid kan dienen een (elektronische)
      factuur of een (elektronisch) vervoersbescheid. Indien het bescheid betrekking heeft op het vervoer van wijn kan,
      in plaats van de factuur of het vervoersbescheid, als bescheid tevens dienen een etiket dat op de andere verpakking
      dan de rechtstreekse verpakking van de wijn is aangebracht.

      2 Een (elektronische) kopie van het bescheid wordt bij de administratie bewaard.

      3 Het (elektronische) bescheid vermeldt de volgende gegevens:

      a. de plaats en dagtekening van afgifte;

      b. de naam, het adres en de hoedanigheid van de afzender;

      c. de naam, het adres en de hoedanigheid van de ontbieder en de plaats waar het pand zich bevindt waar de goederen
      naartoe worden vervoerd;

      d. de soort van de accijnsgoederen naar de onderscheidingen van de wet en de hoeveelheid van de accijnsgoederen;

      e. de merken en nummers, aantal en soort van de verpakkingen;

      f. indien het (elektronische) bescheid is uitgereikt in een andere lidstaat: het ARC of VARC.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel34
