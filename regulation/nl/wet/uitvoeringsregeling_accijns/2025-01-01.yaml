      [65, eerste lid, onderdeel b, van de wet][ref3] bedoelde bestemming;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel64a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel65
