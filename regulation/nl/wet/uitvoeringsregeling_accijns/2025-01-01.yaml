        artikel: '12'
  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder: - *ARC:* de unieke administratieve referentiecode die door de inspecteur
      of de bevoegde autoriteiten van een lidstaat is toegekend aan het e-AD, bedoeld in artikel 20, derde lid, van de
      Richtlijn;
        - *besluit:* het [Uitvoeringsbesluit accijns][ref1];
        - *Richtlijn:* [Richtlijn 2020/262](32020L0262) van de Raad van 19 december 2019 houdende een algemene regeling
      inzake accijns (PbEU 2020, L 58);
        - *VARC:* de unieke vereenvoudigde administratieve referentiecode die door de inspecteur of de bevoegde
      autoriteiten van een lidstaat is toegekend aan het e-VAD, bedoeld in artikel 36, tweede lid, van de Richtlijn;
        - *wet:* de [Wet op de accijns][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005360
      [ref2]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005360
      - id: ref2
        bwb_id: BWBR0005251
  - number: '3.1'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats doet van de algehele vernietiging of het onherstelbare algehele
      of gedeeltelijke verlies van accijnsgoederen door niet te voorziene omstandigheden of overmacht, bedoeld in
      [artikel 2, vijfde en zesde lid, van de wet][ref1], in zijn accijnsgoederenplaats onverwijld mededeling aan de
      inspecteur onder opgaaf van het tijdstip en de oorzaak van de algehele vernietiging of het onherstelbare algehele
      of gedeeltelijke verlies.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: '3.2'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats, de geregistreerde afzender of de geregistreerde geadresseerde
      doet van de algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies van accijnsgoederen door
      niet te voorziene omstandigheden of overmacht, bedoeld in [artikel 2, vijfde en zesde lid, van de wet][ref1],
      tijdens het overbrengen van onder een accijnsschorsingsregeling geplaatste accijnsgoederen onverwijld mededeling
      aan de inspecteur onder opgaaf van het tijdstip en de oorzaak van het verloren gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: '3.3'
    text: |-
      Van een voorgenomen vernietiging van in een accijnsgoederenplaats voorhanden of in opslag zijnde accijnsgoederen
      die onbruikbaar of onverkoopbaar zijn geworden, wordt uiterlijk twee werkdagen voor de voorgenomen vernietiging
      door de vergunninghouder van de accijnsgoederenplaats mededeling gedaan aan de inspecteur, onder vermelding van het
      tijdstip waarop de vernietiging zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3
  - number: '3.4'
    text: |-
      De gecertificeerde afzender of de gecertificeerde geadresseerde doet van de algehele vernietiging of het
      onherstelbare algehele of gedeeltelijke verlies van reeds tot verbruik uitgeslagen accijnsgoederen door niet te
      voorziene omstandigheden of overmacht, bedoeld in [artikel 3 van de wet][ref1], tijdens het overbrengen onverwijld
      mededeling aan de inspecteur onder opgaaf van het tijdstip en de oorzaak van het verloren gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '3'
  - number: 3bis.1
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het gedeeltelijke verlies als gevolg van de aard van de goederen,
      bedoeld in de [artikelen 2, achtste lid][ref1], en [3, vierde lid, van de wet][ref2], dat zich voordoet tijdens
      het vervoer van minerale oliën en ethylalcohol per tankwagen of tanker in hoeveelheden van ten minste 5.000 liter
      of kilogram per soort accijnsgoed, voor zover het verlies niet hoger is dan de volgende vastgestelde verliesnormen:
        - lichte olie: 0,3%;
        - halfzware olie: 0,2%;
        - gasolie: 0,2%;
        - zware stookolie: 0,4%;
        - vloeibaar gemaakt petroleumgas: 1%;
        - ethylalcohol: 0,3%.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '3'
  - number: 3bis.2
    text: |-
      In afwijking van het eerste lid geldt voor het gedeeltelijke verlies dat zich voordoet tijdens het vervoer over
      zee per tanker, in hoeveelheden van ten minste 150.000 liter of kilogram, een norm van 1% voor vloeibaar gemaakt
      petroleumgas en 0,4% voor alle andere minerale oliën en ethylalcohol.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.3
    text: 'Het gedeeltelijke verlies, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.3.a
    text: is ontstaan door meetonnauwkeurigheden, ladingresten of verdamping van het accijnsproduct;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.3.b
    text: is niet ontstaan door fraude of een onregelmatigheid tijdens het vervoer.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.4
    text: |-
      Bij ontvangst van de accijnsgoederen tekent de geadresseerde de werkelijk ontvangen hoeveelheid en de
      minderbevonden hoeveelheid accijnsgoederen aan in de administratie van de ontvanger alsmede in het bericht van
      ontvangst of op de maandverklaring.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.5
    text: |-
      Ingeval het daadwerkelijke verlies groter is dan de verliesnorm wordt op het daadwerkelijke verlies de verliesnorm
      in mindering gebracht
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3bis.6
    text: |-
      Ingeval het daadwerkelijke verlies minder is dan de verliesnorm wordt alleen het daadwerkelijke verlies niet als
      uitslag tot verbruik aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3bis
  - number: 3a
    text: |-
      De hoeveelheden, bedoeld in [artikel 2d, tweede lid, van de wet][ref1], bedragen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
  - number: 3a.a
    text: 'bier: 110 L;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.b
    text: 'wijn: 90 L (waarvan maximaal 60 L mousserende wijn);'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.c
    text: 'tussenproducten: 20 L;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.d
    text: 'overige alcoholhoudende producten: 10 L;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.e
    text: 'sigaretten: 800 stuks;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.f
    text: 'sigaren: 200 stuks;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.g
    text: 'cigarillo’s (sigaren met een maximumgewicht van 3 g/stuk): 400 stuks;'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3a.h
    text: 'rooktabak: 1 kg.'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3a
  - number: 3b.1
    text: |-
      De inspecteur bepaalt na overleg met de vergunninghouder welke in [artikel 6c, tweede lid, van het besluit][ref1]
      bedoelde productie-eenheden tot een productielocatie kunnen worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6c
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 6c
  - number: 3b.2
    text: |-
      De in [artikel 6c, vierde lid, van het besluit][ref1] bedoelde energiebalans wordt opgesteld op basis van in
      overleg met de inspecteur te bepalen energie-equivalenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel6c
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 6c
  - number: 3c.1
    text: |-
      Voor de toepassing van [artikel 2e, vijfde lid, van de wet][ref1] wordt verstaan onder normale reservoirs:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
  - number: 3c.1.a
    text: |-
      de door de fabrikant blijvend in of aan alle voertuigen van hetzelfde type als het betrokken voertuig aangebrachte
      reservoirs, waarvan de blijvende inrichting het rechtstreeks verbruik van brandstof mogelijk maakt, zowel voor de
      voortbeweging van het voertuig als, in voorkomend geval, de werking van koelsystemen en andere systemen tijdens het
      vervoer. Als normale reservoirs gelden ook gasreservoirs die zijn aangepast voor gebruik in voertuigen en die het
      rechtstreeks verbruik van gas als brandstof mogelijk maken, alsmede de reservoirs die zijn aangesloten op andere
      systemen waarmee die voertuigen eventueel zijn uitgerust;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3c
  - number: 3c.1.b
    text: |-
      de door de fabrikant blijvend in of aan alle containers van hetzelfde type als de betrokken container aangebrachte
      reservoirs, waarvan de blijvende inrichting het rechtstreeks verbruik van brandstof mogelijk maakt voor de
      werking, tijdens het vervoer, van koelsystemen en andere systemen waarmee containers voor speciale doeleinden zijn
      uitgerust;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3c
  - number: 3c.2
    text: |-
      Voor de toepassing van [artikel 2e, vijfde lid, van de wet][ref1] wordt verstaan onder containers voor speciale
      doeleinden: alle containers die zijn uitgerust met aangepaste koelsystemen, systemen voor zuurstoftoevoer,
      thermische isolatiesystemen of andere systemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
  - number: '4.1'
    text: |-
      Het van toepassing zijn van het tarief van de accijns, bedoeld in [artikel 7, tweede lid, van de wet][ref1], moet
      bij de uitslag tot verbruik worden aangetoond door degene die het bier uitslaat tot verbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel7
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '7'
  - number: '4.2'
    text: |-
      Indien de inrichting waar het bier is geproduceerd of verwerkt, slechts gedurende een deel van het aan de in het
      eerste lid bedoelde uitslag tot verbruik voorafgaande kalenderjaar in werking is geweest, wordt voor de toepassing
      van [artikel 7, tweede lid, van de wet][ref1], de productie van het desbetreffende kalenderjaar vastgesteld door de
      feitelijke productie te vermenigvuldigen met twaalf, gedeeld door het aantal maanden dat de inrichting in werking
      is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel7
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '7'
  - number: '12'
    text: |-
      Het loodgehalte van lichte olie wordt bepaald volgens de in [bijlage MO.1][ref1] bij deze regeling omschreven
      methode.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005355
  - number: '13.1'
    text: |-
      Als herkenningsmiddel als bedoeld in [artikel 1a, derde lid, van de wet][ref1] wordt aan halfzware olie toegevoegd:
      per liter ten minste 12,5 mg en niet meer dan 18,75 mg ACCUTRACE™ PLUS. Het gehalte aan ACCUTRACE™ PLUS komt
      overeen met ten minste 9,5 mg en niet meer dan 14,25 mg butoxybenzeen per liter.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: '13.2'
    text: |-
      Als herkenningsmiddel als bedoeld in [artikel 1a, derde lid, van de wet][ref1] wordt aan gasolie toegevoegd: per
      liter ten minste 12,5 mg en niet meer dan 18,75 mg ACCUTRACE™ PLUS’. Het gehalte aan ACCUTRACE™ PLUS komt overeen
      met ten minste 9,5 mg en niet meer dan 14,25 mg butoxybenzeen per liter.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: '13.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid wordt aan lichte gasolie een voldoende hoeveelheid kleursel toegevoegd
      om aan de gasolie een goed zichtbare en blijvende rode kleur te geven.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel13
  - number: '14.1'
    text: |-
      De herleiding tot een hoeveelheid bij een temperatuur van 15°C van een hoeveelheid lichte olie, halfzware olie
      of gasolie waarvan de dichtheid, gemeten met de areometer en uitgedrukt in grammen per milliliter bij een andere
      temperatuur is opgenomen, geschiedt aan de hand van de in [bijlage MO.2][ref1] bij deze regeling opgenomen
      tabel, dan wel met gebruikmaking van de ASTM-IP tabellen 54A en 54B, genoemd in de meest actuele versie van de
      gestandaardiseerde methoden ASTM-D1250 of ISO 91-1.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005355
  - number: '14.2'
    text: |-
      Indien de temperatuur waarbij de hoeveelheid van de minerale olie is opgenomen lager of hoger is dan 15°C wordt de
      door de tabel aangegeven correctie bijgeteld, onderscheidenlijk afgetrokken.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het verschil tussen de dichtheid, uitgedrukt in grammen per milliliter, bij de temperatuur waarbij de hoeveelheid
      is opgenomen en de dichtheid, bepaald bij de temperatuur van de proef, wordt verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het bepaalde in het eerste tot en met derde lid is eveneens van toepassing op minerale oliën die ingevolge
      [artikel 28 van de wet][ref1] als lichte olie, halfzware olie of gasolie worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
  - number: '14.5'
    text: |-
      In afwijking van het bepaalde in het vierde lid kan met betrekking tot de in dat lid bedoelde mengsels, hetzij
      op verzoek van de belanghebbende, hetzij ambtshalve, een door laboratoriumonderzoek vastgestelde volumecorrectie
      worden toegepast.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het alcoholgehalte van bier, wijn, tussenproducten en overige alcoholhoudende producten wordt bepaald volgens de in
      [bijlage A.1][ref1] bij deze regeling omschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005355
  - number: '15.2'
    text: |-
      Indien bier, wijn, tussenproducten en overige alcoholhoudende producten zijn verpakt in kleinhandelsverpakking,
      wordt het alcoholgehalte in aanmerking genomen dat op de verpakking is vermeld, mits de wijze waarop dat is
      vastgesteld en de aanduiding ervan voldoen aan de voorwaarden gesteld bij Verordening (EU) nr. 1169/2011 van het
      Europees Parlement en de Raad van 25 oktober 2011 betreffende de verstrekking van voedselinformatie aan consumenten
      (PbEU 2011, L 304).
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel15
  - number: '15.3'
    text: |-
      Bij de vermelding in de aangifte van het alcoholgehalte van bier op andere wijze verpakt dan in
      kleinhandelsverpakking is een tolerantie toegestaan in positieve en negatieve zin. De tolerantie is
      0,5 volumeprocent alcohol bij biersoorten met een alcoholgehalte van ten hoogste 5,5 volumeprocent en
      1 volumeprocent alcohol bij biersoorten met een alcoholgehalte van meer dan 5,5 volumeprocent, onverminderd de
      toleranties die voortvloeien uit de voor de bepaling van het alcoholgehalte toegepaste analysemethode.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel15
  - number: '16'
    text: |-
      Indien bier, wijn, tussenproducten, overige alcoholhoudende producten en tabaksproducten zijn verpakt in
      kleinhandelsverpakking, wordt het volume of de massa in aanmerking genomen dat op de verpakking is vermeld,
      mits de wijze waarop dat is vastgesteld en de aanduiding ervan voldoen aan de voorschriften gesteld bij het
      [Warenwetbesluit hoeveelheden voorverpakkingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035560
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035560
  - number: '17.1'
    text: |-
      Een plaats waar geen accijnsgoederen worden geproduceerd of verwerkt, kan uitsluitend als accijnsgoederenplaats
      voor de opslag van accijnsgoederen van een of meer soorten in aanmerking komen, indien de hoeveelheid die aldaar
      gemiddeld over een jaar van het desbetreffende soort accijnsgoed voorhanden of in opslag is, meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.1.a
    text: bier 40.000 L;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.1.b
    text: wijn 10.000 L;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.1.c
    text: tussenproducten 7500 L;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.1.d
    text: overige alcoholhoudende producten 5000 L;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.1.e
    text: |-
      minerale oliën 10.000 hl, dan wel 50.000 kg onderscheidenlijk 1.000.000 kg indien het vloeibaar gemaakt
      petroleumgas onderscheidenlijk zware stookolie betreft.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid kan de inspecteur onder door hem te stellen voorwaarden een vergunning voor een
      accijnsgoederenplaats verlenen als de gemiddeld over een jaar voorhanden of in opslag zijnde voorraad gelijk is
      aan of lager is dan de aldaar genoemde hoeveelheden, indien en voor zover de desbetreffende accijnsgoederen vanuit
      die plaats in belangrijke mate worden overgebracht naar een belastingentrepot, naar een in een andere lidstaat
      gevestigde geregistreerde geadresseerde of naar een plaats waar de accijnsgoederen het grondgebied van de Unie
      verlaten.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: '17.3'
    text: |-
      In afwijking van het eerste lid kan de inspecteur onder door hem te stellen voorwaarden een vergunning voor een
      accijnsgoederenplaats verlenen indien de gemiddelde voorraad lager is dan de in dat onderdeel genoemde hoeveelheden
      mits:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.3.a
    text: |-
      die accijnsgoederenplaats uitsluitend wordt aangewezen voor minerale oliën voorzien van herkenningsmiddelen als
      bedoeld in [artikel 13][ref1] die met vrijstelling van accijns worden afgeleverd om te worden gebruikt voor de
      aandrijving van schepen of als scheepsbehoeften aan boord van schepen, niet zijnde pleziervaartuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel13
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '13'
        hoofdstuk: II
        afdeling: '5'
  - number: 17.3.b
    text: |-
      die accijnsgoederenplaats uitsluitend wordt aangewezen voor het voorhanden of in opslag hebben, ontvangen en
      verzenden van minerale oliën van de GN-codes 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00; of
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: 17.3.c
    text: |-
      die accijnsgoederenplaats uitsluitend wordt aangewezen voor accijnsgoederen die met vrijstelling van accijns
      worden afgeleverd om te worden gebruikt aan boord van luchtvaartuigen in het verkeer van Nederland naar een andere
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel17
  - number: '18.1'
    text: |-
      In afwijking van [artikel 40, tweede lid, van de wet][ref1] kunnen als accijnsgoederenplaats in aanmerking komen:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
  - number: 18.1.a
    text: |-
      plaatsen van waaruit groothandelaren minerale oliën afleveren aan vliegtuigen en schepen, dan wel aan
      grootverbruikers van minerale oliën die per keer meer minerale oliën afnemen dan 50 hl;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.1.b
    text: |-
      plaatsen van waaruit accijnsgoederen worden geleverd met vrijstelling als bedoeld in [artikel 32a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel32a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: 32a
        hoofdstuk: IV
        afdeling: '1'
  - number: 18.1.c
    text: plaatsen van waaruit groothandelaren in wijn rechtstreeks aan particulieren verkopen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.1.d
    text: |-
      plaatsen, gelegen op een luchthaven of op een haventerrein, van waaruit goederen worden meegevoerd in de
      persoonlijke bagage van een reiziger die zich door de lucht of over zee naar een derdelandsgebied of een derde
      land begeeft;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.1.e
    text: |-
      plaatsen van waaruit door buitenlandse NAVO-strijdkrachten als bedoeld in
      [artikel 69, eerste lid, onderdeel c, van de wet][ref1] accijnsgoederen rechtstreeks worden geleverd aan personeel
      van die strijdkrachten of hun gezinsleden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '69'
  - number: '18.2'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.a
    text: |-
      *NAVO-statusverdrag:* het op 19 juni 1951 te Londen tot stand gekomen Verdrag tussen de Staten die partij zijn bij
      het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten (Trb. 1951, 114);
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.b
    text: |-
      *Hoofdkwartierenprotocol:* het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni
      1951 te Londen gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantische Verdrag – nopens
      de rechtspositie van hun krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren,
      ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11);
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c
    text: '*gezinslid:*'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c.1°
    text: |-
      een inwonende persoon als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag of
      als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c.2°
    text: |-
      een niet-inwonend kind als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol dat afhankelijk
      is van een lid van een krijgsmacht of civiele dienst voor zijn onderhoud, voor zover dat kind zich op Nederlands
      grondgebied bevindt;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c.3°
    text: |-
      een niet-inwonende partner als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol, voor zover die
      partner zich op Nederlands grondgebied bevindt;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c.4°
    text: |-
      een persoon voor wie een NAVO-strijdkracht (Delegatieleider) verklaart dat deze de status heeft van ‘afgeleide
      NAVO-statusgerechtigde ’of ‘afgeleide Paris Protocol-gerechtigde’;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
  - number: 18.2.c.5°
    text: |-
      een partner als bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: '19.1'
    text: |-
      Indien de inspecteur op grond van [artikel 9 van het besluit][ref1] voorwaarden stelt voor een vergunning voor een
      accijnsgoederenplaats waar accijnsgoederen worden geproduceerd of verwerkt, kan daarbij worden bepaald dat ter zake
      van de productie of verwerking werkaangiften moeten worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel9
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '9'
  - number: '19.2'
    text: |-
      De werkaangiften dienen ten minste twee werkdagen voor de aanvang van de productie of verwerking te worden
      ingediend bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: '19.3'
    text: 'In de werkaangifte dienen te worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: 19.3.a
    text: de voorgenomen te produceren of verwerken hoeveelheden; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: 19.3.b
    text: de tijdstippen waarop de productie of verwerking aanvangt en wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: '19.4'
    text: De werkaangifte kan per werkweek geschieden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: '19.5'
    text: |-
      Indien overige alcoholhoudende producten worden geproduceerd of verwerkt, kan de inspecteur het gebruik van een
      ambtelijk afgesloten opvangreservoir voorschrijven.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel19
  - number: '20.1'
    text: |-
      In een verzoek om een vergunning voor een accijnsgoederenplaats dienen met betrekking tot hetgeen in
      [artikel 42 van de wet][ref1] is bepaald, in elk geval te worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '42'
  - number: 20.1.a
    text: |-
      een omschrijving van de aard van het bedrijf waaruit onder meer moet blijken of de vergunning mede wordt gevraagd
      voor de productie of verwerking van de desbetreffende accijnsgoederen of uitsluitend voor het voorhanden of in
      opslag hebben van de desbetreffende accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
  - number: 20.1.b
    text: het adres en de kadastrale aanduiding van de plaats waar de accijnsgoederenplaats wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
  - number: 20.1.c
    text: |-
      een omschrijving van de administratie en de administratieve organisatie, alsmede het adres waar de administratie
      wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
  - number: 20.1.d
    text: |-
      met betrekking tot accijnsgoederenplaatsen waar overige alcoholhoudende producten worden geproduceerd of verwerkt,
      het aantal en de inhoud van de apparaten waarin de productie of verwerking plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
  - number: 20.1.e
    text: |-
      met betrekking tot accijnsgoederenplaatsen waar bier wordt geproduceerd of verwerkt, het aantal en de inhoud van de
      bierketels waarin het wort wordt gekookt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien toepassing van [artikel 2a van het besluit][ref1] wordt gewenst, wordt dit in het verzoek, bedoeld in het
      eerste lid, opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 2a
  - number: 20a
    text: |-
      In een verzoek om een vergunning voor een geregistreerde geadresseerde moeten met betrekking tot hetgeen in
      [artikel 50c van de wet][ref1] is bepaald, in ieder geval worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50c
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50c
  - number: 20a.a
    text: |-
      een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf waar de accijnsgoederen
      worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20a
  - number: 20a.b
    text: het adres waar de geregistreerde geadresseerde wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20a
  - number: 20a.c
    text: een omschrijving van de administratie, alsmede het adres waar de administratie wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20a
  - number: 20b
    text: |-
      In een verzoek om een vergunning als geregistreerde afzender moeten met betrekking tot hetgeen in
      [artikel 50d van de wet][ref1] is bepaald, in ieder geval worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50d
  - number: 20b.a
    text: een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20b
  - number: 20b.b
    text: het adres waar de geregistreerde afzender wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20b
  - number: 20b.c
    text: |-
      een omschrijving van de administratie van de geregistreerde afzender, alsmede het adres waar deze administratie
      wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20b
  - number: 20c
    text: |-
      In een verzoek om een vergunning als fiscaal vertegenwoordiger van de afzender die in een andere lidstaat een
      zelfstandige economische activiteit verricht, wordt met betrekking tot hetgeen in [artikel 50f van de wet][ref1] is
      bepaald, in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50f
  - number: 20c.a
    text: |-
      de naam en het adres van de afzender, een omschrijving van de aard van diens bedrijf, alsmede het adres waar de
      afzender is gevestigd en het adres waar de administratie van de afzender wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20c
  - number: 20c.b
    text: |-
      de naam en het btw-identificatienummer van de fiscaal vertegenwoordiger van de afzender en het adres waar deze
      wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20c
  - number: 20c.c
    text: |-
      een omschrijving van de administratie van de fiscaal vertegenwoordiger van de afzender, alsmede het adres waar deze
      administratie wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20c
  - number: 20ca
    text: |-
      De afzender, bedoeld in [artikel 50f, eerste lid, van de wet][ref1], meldt zich op een door de inspecteur bepaald
      adres.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20ca
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50f
  - number: 20d
    text: |-
      In een verzoek om een vergunning voor een accijnsgoederenplaats als bedoeld in [artikel 42a van de wet][ref1] wordt
      met betrekking tot hetgeen in artikel 42a van de wet is bepaald, in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel42a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 42a
  - number: 20d.a
    text: een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20d
  - number: 20d.b
    text: het adres waar het bedrijf van de vergunninghouder wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20d
  - number: 20d.c
    text: een omschrijving van de administratie, alsmede het adres waar deze administratie wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20d
  - number: 20e
    text: |-
      In een verzoek om een vergunning voor een gecertificeerde geadresseerde wordt met betrekking tot hetgeen in
      [artikel 50i van de wet][ref1] is bepaald in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50i
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50i
  - number: 20e.a
    text: |-
      een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf waar de accijnsgoederen
      worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20e
  - number: 20e.b
    text: een omschrijving van de administratie en het adres waar de administratie wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20e
  - number: 20f
    text: |-
      In een verzoek om een vergunning als gecertificeerde afzender wordt met betrekking tot hetgeen in
      [artikel 50k van de wet][ref1] is bepaald in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50k
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50k
  - number: 20f.a
    text: een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20f
  - number: 20f.b
    text: het adres waar de gecertificeerde afzender wordt gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20f
  - number: 20f.c
    text: |-
      een omschrijving van de administratie van de gecertificeerde afzender en het adres waar deze administratie wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel20f
  - number: '21.1'
    text: |-
      Een vergunninghouder van een accijnsgoederenplaats die tevens vergunninghouder is van één of meer andere
      accijnsgoederenplaatsen kan op verzoek één aangifte voor die plaatsen tezamen doen, indien:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
  - number: 21.1.a
    text: de administratie van de desbetreffende accijnsgoederenplaatsen op één centrale plaats wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
  - number: 21.1.b
    text: |-
      de centrale administratie en de administratieve organisatie van de desbetreffende accijnsgoederenplaatsen zodanig
      is dat het toezicht op de heffing is gewaarborgd en uit de administratie op duidelijke wijze blijkt op welke
      accijnsgoederenplaats de onderscheiden posten van die aangifte betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het verzoek wordt ingediend bij de inspecteur onder wie de plaats ressorteert waar de centrale administratie
      wordt gevoerd. Een afschrift van het verzoek wordt gezonden naar de inspecteurs die de vergunningen voor de
      desbetreffende accijnsgoederenplaatsen hebben verleend.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
  - number: '21.3'
    text: |-
      De toestemming voor toepassing van het eerste lid wordt opgenomen in de vergunningen voor de desbetreffende
      accijnsgoederenplaatsen. Daarbij kunnen aanvullende voorwaarden worden opgenomen omtrent het doen van de
      verzamelaangifte en de wijze waarop de administratie en de administratieve organisatie van de desbetreffende
      accijnsgoederenplaatsen moeten zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
  - number: '21.4'
    text: |-
      Op de toestemming zijn de [artikelen 43 tot en met 50 van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: '22.1'
    text: |-
      Voor de accijns die de vergunninghouder van een accijnsgoederenplaats verschuldigd is of kan worden, stelt hij
      zekerheid. De zekerheid wordt bepaald op basis van het accijnsbelang.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: '22.2'
    text: |-
      Het accijnsbelang is de som van het bedrag aan accijns dat wordt vertegenwoordigd door de hoeveelheid
      accijnsgoederen die:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: 22.2.a
    text: gemiddeld in de accijnsgoederenplaats voorhanden of in opslag is;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: 22.2.b
    text: gemiddeld in een aangiftetijdvak wordt uitgeslagen tot verbruik;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: 22.2.c
    text: |-
      gemiddeld in een aangiftetijdvak met een e-AD of een ander daartoe aangewezen bescheid wordt overgebracht naar een
      accijnsgoederenplaats, een douane-entrepot of het buitenland; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: 22.2.d
    text: |-
      gemiddeld in een aangiftetijdvak met toepassing van [artikel 2a van het besluit][ref1] wordt overgebracht naar een
      andere accijnsgoederenplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 2a
  - number: '22.3'
    text: |-
      Indien op grond van [artikel 21][ref1] toestemming is verleend voor het doen van één aangifte voor twee of meer
      accijnsgoederenplaatsen worden de afzonderlijke zekerheidstellingen voor de desbetreffende accijnsgoederenplaatsen
      vervangen door één zekerheid die voor die accijnsgoederenplaatsen tezamen van toepassing is. Het hierbij in
      acht te nemen accijnsbelang wordt gevormd door het totale accijnsbelang dat op basis van het tweede lid en in
      [artikel 22c, tweede lid][ref2] voor de desbetreffende accijnsgoederenplaatsen is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel22c
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: 22c
        hoofdstuk: III
        afdeling: '3'
  - number: '22.4'
    text: |-
      De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van € 9
      000 000.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: '22.5'
    text: Geen zekerheidstelling is vereist wanneer een overheidslichaam de accijns verschuldigd is of kan worden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22
  - number: 22a.1
    text: |-
      De geregistreerde geadresseerde, de geregistreerde afzender, de gecertificeerde geadresseerde, de afzender in
      een andere lidstaat die een zelfstandige economische activiteit verricht dan wel de fiscaal vertegenwoordiger van
      een afzender die in een andere lidstaat een zelfstandige economische activiteit verricht, stelt zekerheid voor de
      accijns die hij verschuldigd is of kan worden. De zekerheid wordt bepaald op basis van het accijnsbelang.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Met betrekking tot de geregistreerde geadresseerde of gecertificeerde geadresseerde geldt als accijnsbelang het
      bedrag aan accijns dat wordt vertegenwoordigd door de hoeveelheid accijnsgoederen die gemiddeld per maand door de
      geregistreerde geadresseerde of gecertificeerde geadresseerde wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22a.3
    text: |-
      Met betrekking tot de geregistreerde afzender geldt als accijnsbelang het bedrag aan accijns dat wordt
      vertegenwoordigd door de hoeveelheid accijnsgoederen die gemiddeld per maand door de geregistreerde afzender wordt
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22a.4
    text: |-
      Met betrekking tot de afzender die in een andere lidstaat een zelfstandige economische activiteit verricht of
      diens fiscaal vertegenwoordiger geldt als accijnsbelang het bedrag aan accijns dat wordt vertegenwoordigd door de
      accijnsgoederen die gemiddeld per maand door die afzender of voor diens rekening direct of indirect naar Nederland
      worden verzonden of vervoerd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22a.5
    text: |-
      De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van € 2
      250 000.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22a.6
    text: Geen zekerheidstelling is vereist wanneer een overheidslichaam de accijns verschuldigd is of kan worden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22b.1
    text: |-
      De vervoerder, de eigenaar of de gecertificeerde afzender, bedoeld in [artikel 56, derde lid, van de wet][ref1],
      stelt zekerheid in plaats van de vergunninghouder van een accijnsgoederenplaats, de geregistreerde afzender of de
      gecertificeerde geadresseerde, bedoeld in artikel 56, eerste lid, van de wet, voor de accijns die hij verschuldigd
      is of kan worden. De zekerheid wordt bepaald op basis van het accijnsbelang.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
  - number: 22b.2
    text: |-
      Het accijnsbelang, bedoeld in het eerste lid, is het bedrag aan accijns dat wordt vertegenwoordigd door de
      hoeveelheid accijnsgoederen die door of namens de vervoerder, de eigenaar of de gecertificeerde afzender
      wordt vervoerd de bestemmingen, bedoeld in [artikel 2a, eerste of derde lid, van de wet][ref1], of naar de
      gecertificeerde geadresseerde.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
  - number: 22b.3
    text: |-
      De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van € 2
      250 000.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22b
  - number: 22c.1
    text: |-
      De inspecteur bepaalt het bedrag van de zekerheid, bedoeld in [artikel 76, tweede lid, van de wet][ref1], op basis
      van het accijnsbelang.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel76
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '76'
  - number: 22c.2
    text: |-
      Het accijnsbelang van de bedrukte accijnszegels is gelijk aan het bedrag aan accijns dat de bedrukte accijnszegels
      vertegenwoordigen die de houder van de toestemming gemiddeld per maand in voorraad heeft.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22c
  - number: 22c.3
    text: |-
      Het accijnsbelang van de onbedrukte accijnszegels is gelijk aan het bedrag aan accijns behorend bij een
      kleinhandelsprijs en hoeveelheid die de houder van de toestemming gemiddeld per maand op de onbedrukte blanco
      accijnszegels vermeldt of heeft vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22c
  - number: 22c.4
    text: |-
      De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van
      € 9 000 000.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22c
  - number: '25'
    text: |-
      De vrijstelling van accijns voor overige alcoholhoudende producten, bedoeld in [artikel 64a, aanhef en eerste lid,
      onderdelen a en b, van de wet](onbekend), is uitsluitend van toepassing:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel25
  - number: 25.a
    text: |-
      in geval van volledig gedenatureerde alcohol als bedoeld in [artikel 64a, eerste lid, onderdeel a, van de wet]
      (onbekend), indien die overige alcoholhoudende producten zijn vermengd op de wijze, genoemd in de bijlage, onder
      I, bij Verordening (EG) nr. 3199/93 van de Commissie van 22 november 1993 inzake de wederzijdse erkenning van
      procedures voor de volledige denaturering van alcohol in verband met de vrijstelling van accijns (PbEG 1993,
      L 288);
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel25
  - number: 25.b
    text: |-
      in geval van denaturering als bedoeld in [artikel 64a, eerste lid, onderdeel b, van de wet](onbekend), indien die
      overige alcoholhoudende producten zijn vermengd op een wijze als bedoeld in [bijlage A.2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005355
  - number: '28.1'
    text: |-
      In het verzoek om een vergunning als bedoeld in [artikel 65, vierde lid, van de wet][ref1], dienen te worden
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
  - number: 28.1.a
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
  - number: 28.1.b
    text: de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting per jaar zal worden betrokken;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
  - number: 28.1.c
    text: de locatie en de inrichting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
  - number: 28.1.d
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting per jaar met vrijstelling wordt
      geproduceerd, verwerkt of verbruikt;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
  - number: 28.1.e
    text: |-
      de administratie en de administratieve organisatie met betrekking tot het bedrijf waarvoor de vergunning wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
  - number: '28.2'
    text: |-
      Met betrekking tot het verlenen, het aanpassen en het intrekken van de vergunning zijn de
      [artikelen 43 tot en met 50 van de wet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
  - number: 28a.1
    text: |-
      De verklaring, bedoeld in [artikel 18a van het besluit][ref1], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 18a
  - number: 28a.1.a
    text: een uniek identificeerbaar nummer;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel28a
  - number: 28a.1.b
    text: |-
      indien de verklaring wordt opgesteld door de vergunninghouder van de accijnsgoederenplaats, de naam, het adres en
      het vergunningnummer van de vergunninghouder van de accijnsgoederenplaats;
