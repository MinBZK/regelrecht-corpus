    text: |-
      1 Vrijstelling van accijns ter zake van de uitslag van accijnsgoederen uit een accijnsgoederenplaats wordt verleend
      in gevallen waarin bij invoer deze accijnsgoederen met toepassing van de [artikelen 7:8][ref1], [7:9][ref2] of
      [7:11 van de Algemene douaneregeling][ref3] met vrijstelling van rechten bij invoer zouden kunnen worden betrokken.

      2 Vóór de uitslag dient een vergunning van de inspecteur te zijn verkregen. De vergunninghouder van de
      accijnsgoederenplaats dient daartoe een verzoek in bij de inspecteur.

      3 De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel78
