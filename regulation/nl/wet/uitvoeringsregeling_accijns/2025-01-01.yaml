  - number: '61'
    text: |-
      1 [Artikel 94, eerste lid, van de wet][ref1] is niet van toepassing ingeval een zelfde tabaksproduct
      onder hetzelfde merk in de handel wordt gebracht in verpakkingseenheden met verschillende inhoud en de
      kleinhandelsprijzen van die verpakkingseenheden, omgerekend tot een prijs van een hoeveelheid van 1000
      stuks of 1 kg nettomassa, niet met elkaar overeenkomen voor zover dit het gevolg is van de afronding van de
      kleinhandelsprijzen per verpakkingseenheid naar boven of naar beneden op € 0,05.

      2 [Artikel 94, eerste lid, van de wet][ref2] is niet van toepassing bij wijziging van de kleinhandelsprijs van
      een tabaksproduct gedurende een tijdvak van vier weken, dat aanvangt op het tijdstip met ingang waarvan het
      tabaksproduct tegen de gewijzigde kleinhandelsprijs in de handel wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel94
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel61
