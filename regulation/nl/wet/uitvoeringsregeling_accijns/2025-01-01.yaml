  - number: 35k
    text: |-
      1 Het verzoek om teruggaaf van accijns, bedoeld in [artikel 71h, eerste lid, van de wet][ref1], vermeldt:

      a. naam en fiscaal nummer van degene die het verzoek om teruggaaf doet;

      b. de soort en hoeveelheid duurzaam geproduceerde biobrandstof waarvoor teruggaaf van accijns wordt verzocht;

      c. het bedrag aan accijns dat wordt teruggevraagd, berekend als bedoeld in
      [artikel 71h, vierde lid, van de wet][ref2]; en

      d. de periode waarop het verzoek om teruggaaf betrekking heeft.

      2 Teruggaaf van accijns wordt slechts verleend indien uit de administratie van degene die verzoekt om teruggaaf van
      accijns blijkt:

      a. wat de energie-inhoud per volume is van de duurzaam geproduceerde biobrandstof en van de gelijkwaardige
      motorbrandstof waarvan het accijnstarief van toepassing is; en

      b. dat de duurzaam geproduceerde biobrandstof is afgeleverd als motorbrandstof voor het aandrijven van
      motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
