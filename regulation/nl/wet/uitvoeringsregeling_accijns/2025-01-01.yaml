  - number: '38'
    text: |-
      1 De toestemming om onbedrukte blanco zegels aan te vragen wordt verleend aan een geregistreerde geadresseerde
      of een vergunninghouder van een accijnsgoederenplaats die ten minste 10 miljoen accijnszegels in het voorafgaande
      kalenderjaar heeft aangevraagd en op de verpakking van de tot verbruik uitgeslagen sigaretten, rooktabak en sigaren
      heeft aangebracht.

      2 Degene die toestemming heeft om onbedrukte blanco zegels aan te vragen, kan geen bedrukte zegels aanvragen.

      3 Een niet in Nederland gevestigd bedrijf als bedoeld in [artikel 75, eerste lid, onderdeel c, van de wet][ref1]
      kan slechts door één fiscaal vertegenwoordiger worden vertegenwoordigd.

      4 Een fiscaal vertegenwoordiger die meerdere toestemmingen heeft en de aangevraagde accijnszegels zelf in voorraad
      houdt slaat de aangevraagde accijnszegels per toestemming fysiek gescheiden op.

      5 De inspecteur stelt in de toestemming om accijnszegels aan te vragen nadere voorwaarden ten aanzien van het
      aantal per maand aan te vragen accijnszegels en het aantal accijnszegels dat in voorraad wordt gehouden.

      6 De inspecteur kan in de toestemming om accijnszegels aan te vragen nadere voorwaarden stellen ten aanzien van de
      zegeladministratie, bedoeld in [artikel 9e, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel9e
