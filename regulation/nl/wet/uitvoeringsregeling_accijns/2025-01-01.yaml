    text: |-
      In een verzoek om een vergunning als geregistreerde afzender moeten met betrekking tot hetgeen in
      [artikel 50d van de wet][ref1] is bepaald, in ieder geval worden vermeld:

      a. een omschrijving van de aard van het bedrijf en het btw-identificatienummer van het bedrijf;

      b. het adres waar de geregistreerde afzender wordt gevestigd;

      c. een omschrijving van de administratie van de geregistreerde afzender, alsmede het adres waar deze administratie
      wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
