  - number: '37'
    text: |-
      In een verzoek om toestemming als bedoeld in [artikel 75, tweede lid, van de wet][ref1], wordt in ieder geval
      vermeld:

      a. de persoon op wiens naam de toestemming moet worden gesteld en zijn btw-identificatienummer;

      b. het adres en de woonplaats waar de houder van de toestemming is gevestigd;

      c. een omschrijving van de aard van het bedrijf waaruit ook moet blijken voor welk soort bedrijf als bedoeld in
      [artikel 75, eerste lid, van de wet][ref2] de toestemming wordt gevraagd;

      d. een omschrijving van de zegeladministratie en het adres waar deze administratie wordt gehouden;

      e. het aantal onbedrukte blanco accijnszegels dat gemiddeld per maand wordt aangevraagd en het aantal accijnszegels
      dat gemiddeld in voorraad wordt gehouden onderscheiden naar soort van het tabaksproduct en de gemiddelde
      kleinhandelsprijs per soort;

      f. het aantal bedrukte accijnszegels dat gemiddeld per maand wordt aangevraagd en het aantal accijnszegels
      dat gemiddeld in voorraad wordt gehouden onderscheiden naar de soort van het tabaksproduct, de gemiddelde
      kleinhandelsprijs en, voor rooktabak en sigaretten, de gemiddelde hoeveelheid op de accijnszegels;

      g. de naam, het adres, de woonplaats, het land en de aard van het niet in Nederland gevestigde bedrijf als het een
      fiscaal vertegenwoordiger betreft; en

      h. de naam en het adres van degene die de tabaksproducten uitslaat tot verbruik als het een bedrijf als bedoeld in
      [artikel 75, eerste lid, onderdelen c of d][ref3], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel75
