  - number: 22a
    text: |-
      1 De geregistreerde geadresseerde, de geregistreerde afzender, de gecertificeerde geadresseerde, de afzender in
      een andere lidstaat die een zelfstandige economische activiteit verricht dan wel de fiscaal vertegenwoordiger van
      een afzender die in een andere lidstaat een zelfstandige economische activiteit verricht, stelt zekerheid voor de
      accijns die hij verschuldigd is of kan worden. De zekerheid wordt bepaald op basis van het accijnsbelang.

      2 Met betrekking tot de geregistreerde geadresseerde of gecertificeerde geadresseerde geldt als accijnsbelang het
      bedrag aan accijns dat wordt vertegenwoordigd door de hoeveelheid accijnsgoederen die gemiddeld per maand door de
      geregistreerde geadresseerde of gecertificeerde geadresseerde wordt ontvangen.

      3 Met betrekking tot de geregistreerde afzender geldt als accijnsbelang het bedrag aan accijns dat wordt
      vertegenwoordigd door de hoeveelheid accijnsgoederen die gemiddeld per maand door de geregistreerde afzender wordt
      overgebracht.

      4 Met betrekking tot de afzender die in een andere lidstaat een zelfstandige economische activiteit verricht of
      diens fiscaal vertegenwoordiger geldt als accijnsbelang het bedrag aan accijns dat wordt vertegenwoordigd door de
      accijnsgoederen die gemiddeld per maand door die afzender of voor diens rekening direct of indirect naar Nederland
      worden verzonden of vervoerd.

      5 De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van €
      2 250 000.

      6 Geen zekerheidstelling is vereist wanneer een overheidslichaam de accijns verschuldigd is of kan worden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel22a
  - number: 22b
    text: |-
      1 De vervoerder, de eigenaar of de gecertificeerde afzender, bedoeld in [artikel 56, derde lid, van de wet][ref1],
      stelt zekerheid in plaats van de vergunninghouder van een accijnsgoederenplaats, de geregistreerde afzender of de
      gecertificeerde geadresseerde, bedoeld in artikel 56, eerste lid, van de wet, voor de accijns die hij verschuldigd
      is of kan worden. De zekerheid wordt bepaald op basis van het accijnsbelang.

      2 Het accijnsbelang, bedoeld in het eerste lid, is het bedrag aan accijns dat wordt vertegenwoordigd door
      de hoeveelheid accijnsgoederen die door of namens de vervoerder, de eigenaar of de gecertificeerde afzender
      wordt vervoerd de bestemmingen, bedoeld in [artikel 2a, eerste of derde lid, van de wet][ref2], of naar de
      gecertificeerde geadresseerde.

      3 De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het accijnsbelang met een maximum van €
      2 250 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
