  - number: '12'
    text: |-
      Het loodgehalte van lichte olie wordt bepaald volgens de in [bijlage MO.1][ref1] bij deze regeling omschreven
      methode.


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005355
  - number: '13'
    text: |-
      1 Als herkenningsmiddel als bedoeld in [artikel 1a, derde lid, van de wet][ref1] wordt aan halfzware olie
      toegevoegd: per liter ten minste 12,5 mg en niet meer dan 18,75 mg ACCUTRACE™ PLUS. Het gehalte aan ACCUTRACE™ PLUS
      komt overeen met ten minste 9,5 mg en niet meer dan 14,25 mg butoxybenzeen per liter.

      2 Als herkenningsmiddel als bedoeld in [artikel 1a, derde lid, van de wet][ref2] wordt aan gasolie toegevoegd: per
      liter ten minste 12,5 mg en niet meer dan 18,75 mg ACCUTRACE™ PLUS’. Het gehalte aan ACCUTRACE™ PLUS komt overeen
      met ten minste 9,5 mg en niet meer dan 14,25 mg butoxybenzeen per liter.

      3 Onverminderd het bepaalde in het tweede lid wordt aan lichte gasolie een voldoende hoeveelheid kleursel
      toegevoegd om aan de gasolie een goed zichtbare en blijvende rode kleur te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
