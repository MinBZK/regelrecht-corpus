        bwb_id: BWBR0005355
        artikel: 35f
        hoofdstuk: IV
        afdeling: '2'
  - number: 35h
    text: |-
      1 Met betrekking tot door een in het buitenland geregistreerd luchtvaartuig in Nederland getankte minerale oliën
      wordt of worden, in afwijking in zoverre van [artikel 32b, eerste lid][ref1], en van [artikel 35f][ref2]:

      a. indien voor die levering teruggaaf van omzetbelasting wordt gevraagd, het verzoek om teruggaaf van accijns
      ingediend tezamen met en over dezelfde periode als het verzoek om teruggaaf van omzetbelasting voor deze
      motorbrandstoffen;

      b. bij het verzoek de tankbonnen of de facturen meegezonden alsmede de bescheiden waaruit blijkt dat de vlucht
      waarvoor de minerale olie is gebruikt waarvoor teruggaaf van accijns wordt gevraagd een ander karakter heeft gehad
      dan plezierluchtvaart.

      2 Indien het verzoek om teruggaaf van accijns wordt ingediend door een ander dan de eigenaar van het luchtvaartuig
      wordt een door de eigenaar ondertekende machtiging bijgevoegd. Het eerste lid is van overeenkomstige toepassing.

      3 De in het tweede lid bedoelde machtiging bevat de volgende gegevens:

      a. het registratienummer van het luchtvaartuig waarop de machtiging betrekking heeft;

      b. naam en adres van de eigenaar; en

      c. de periode of perioden waarover door de gemachtigde in plaats van de eigenaar teruggaaf van accijns wordt
      gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel35f
