        bwb_id: BWBR0005251
        artikel: 90a
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 90a
  - number: '60'
    text: |-
      1 In afwijking van [artikel 91, tweede lid, van de wet][ref1] mag vóór 1 januari 2013 gekochte en afgeleverde
      gasolie voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen voorhanden zijn in:

      a. brandstoftanks van waaruit de brandstof via een gesloten systeem wordt gebracht naar een noodstroomvoorziening
      voor de opwekking van elektriciteit;

      b. brandstoftanks van historische vaartuigen als bedoeld in
      [artikel 2, eerste lid, onderdeel a, onder 5°, van de Wet pleziervaartuigen 2016][ref2].

      2 De gasolie voorzien van herkenningsmiddelen als bedoeld in [artikel 13, tweede lid][ref3], mag voorhanden zijn in
      tanks als bedoeld in het eerste lid tot deze is verbruikt of wordt vervangen door gasolie die niet is voorzien van
      genoemde herkenningsmiddelen.

      3 Desgevraagd moeten aan de inspecteur alle noodzakelijke gegevens worden verstrekt om aan te tonen:

      a. wanneer de gasolie voorzien van de herkenningsmiddelen, bedoeld in [artikel 13, tweede lid][ref4], is gekocht en
      afgeleverd in de tanks;

      b. wanneer en hoeveel vóór 1 januari 2013 in tanks aanwezige gasolie voorzien van de herkenningsmiddelen, bedoeld
      in [artikel 13, tweede lid][ref5], is verbruikt.

      4 Ontheffing van het verbod, bedoeld in [artikel 91, tweede lid, van de wet][ref6], wordt verleend voor minerale
      olie die is uitgeslagen tot verbruik als bedoeld in artikel 2, eerste lid, aanhef en onderdeel b, van de wet en die
      voorhanden is in een opslagtank op het bedrijfsterrein van een scheepsonderhoudsbedrijf, mits:

      a. de ingezamelde minerale olie uitsluitend wordt afgegeven aan een houder van een vergunning als bedoeld
      in [artikel 9, onderdeel c, van het Besluit inzamelen afvalstoffen][ref7] die tevens in het bezit is van een
      vergunning voor een accijnsgoederenplaats voor minerale oliën; en

      b. in de administratie van het scheepsonderhoudsbedrijf op overzichtelijke wijze de ontvangst uit schepen, niet
      zijnde een pleziervaartuig, en de afgifte aan een vergunninghouder als bedoeld in onderdeel a worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel91
