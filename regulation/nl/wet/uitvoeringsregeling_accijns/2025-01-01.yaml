  - number: 20c
    text: |-
      In een verzoek om een vergunning als fiscaal vertegenwoordiger van de afzender die in een andere lidstaat een
      zelfstandige economische activiteit verricht, wordt met betrekking tot hetgeen in [artikel 50f van de wet][ref1] is
      bepaald, in ieder geval vermeld:

      a. de naam en het adres van de afzender, een omschrijving van de aard van diens bedrijf, alsmede het adres waar de
      afzender is gevestigd en het adres waar de administratie van de afzender wordt gehouden;

      b. de naam en het btw-identificatienummer van de fiscaal vertegenwoordiger van de afzender en het adres waar deze
      wordt gevestigd;

      c. een omschrijving van de administratie van de fiscaal vertegenwoordiger van de afzender, alsmede het adres waar
      deze administratie wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
