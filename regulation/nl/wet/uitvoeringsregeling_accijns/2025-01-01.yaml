  - number: 35j
    text: |-
      1 Het verzoek om teruggaaf van accijns, bedoeld in [artikel 71a, eerste lid, van de wet][ref1], wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin de accijns door de andere lidstaat is geheven.

      2 In de administratie van degene die verzoekt om teruggaaf van accijns zijn opgenomen:

      a. de soort en de hoeveelheid accijnsgoederen waarvoor teruggaaf van accijns is verzocht; en

      b. bescheiden waarmee wordt aangetoond dat de accijns door de andere lidstaat is geheven en is geïnd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71a
