  - number: '36'
    text: |-
      In afwijking van [artikel 73, eerste lid van de wet][ref1], hoeven tabaksproducten niet te zijn voorzien van
      accijnszegels als die tabaksproducten:

      a. door particulieren als bedoeld in [artikel 2d, eerste lid van de wet][ref2], voor eigen behoefte door henzelf
      vanuit een lidstaat naar Nederland worden vervoerd;

      b. deel uitmaken van de persoonlijke bagage van reizigers en door henzelf voor eigen behoeften vanuit een derde
      land of derdelandsgebied worden meegenomen;

      c. worden gebruikt als bedoeld in [artikel 66a, eerste lid, van de wet][ref3];

      d. overeenkomstig [artikel 66b, eerste en tweede lid, van de wet][ref4] met vrijstelling van accijns worden
      uitgeslagen;

      e. overeenkomstig [artikel 69 van de wet][ref5] met vrijstelling van accijns tot verbruik worden uitgeslagen; of

      f. na de uitslag tot verbruik worden overgebracht naar een plaats waar zij onder ambtelijk toezicht worden
      vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel73
