  - number: '33.3'
    text: |-
      De verklaring, bedoeld in [artikel 25 van het besluit][ref1], bevat in het geval van levering aan een luchtvaartuig
      de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel25
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '25'
  - number: 33.3.a
    text: een uniek identificeerbaar nummer;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.b
    text: de naam en het adres van degene die de accijnsgoederen levert;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.c
    text: de naam en het adres van de eigenaar of exploitant van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.d
    text: het registratienummer van het luchtvaartuig waarvoor de accijnsgoederen zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.e
    text: het vertrek- en eindpunt van de vlucht;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.f
    text: de plaats van levering;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.g
    text: de soort en de hoeveelheid van de accijnsgoederen die zijn geleverd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.h
    text: de datum van levering;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: 33.3.i
    text: |-
      de naam en handtekening van de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord van
      het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: '33.4'
    text: De verklaring bedoeld in het tweede en derde lid wordt in het Nederlands of in het Engels opgesteld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel33
  - number: '34.1'
    text: |-
      Een verzoek om teruggaaf van accijns als bedoeld in [artikel 71, eerste lid, onderdelen a en b, van de wet][ref1]
      voor accijnsgoederen die zijn verloren gegaan of onder ambtelijk toezicht zijn vernietigd wordt gedaan uiterlijk
      drie maanden na afloop van het kalenderkwartaal waarin de accijnsgoederen zijn verloren gegaan of onder ambtelijk
      toezicht zijn vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: '34.2'
    text: 'In de administratie van degene die verzoekt om teruggaaf van accijns zijn de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
  - number: 34.2.a
    text: |-
      de soort en de hoeveelheid van de accijnsgoederen alsmede de waarde ervan of de andere voor de vaststelling van het
      bedrag van de teruggaaf van belang zijnde gegevens;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
  - number: 34.2.b
    text: |-
      het tijdstip, de plaats en de oorzaak van het verloren gaan, dan wel de vermelding van de ambtelijke verklaring van
      de vernietiging;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
  - number: 34.2.c
    text: wanneer mededeling is gedaan van het verloren gaan; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
  - number: 34.2.d
    text: |-
      de soort en de hoeveelheid alsmede de waarde van de restanten van verloren gegane goederen en andere van belang
      zijnde gegevens.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel34
  - number: '35'
    text: |-
      Een verzoek om teruggaaf van accijns als bedoeld in
      [artikel 71, eerste lid, onderdelen c, d, e en f, van de wet][ref1] wordt gedaan uiterlijk drie maanden na afloop
      van het kalenderkwartaal waarin de accijnsgoederen hun bestemming hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 35c
    text: |-
      [Artikel 26 van de Uitvoeringsregeling belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing
      op de teruggaafregeling, bedoeld in [artikel 71g, eerste lid, van de wet][ref2], met dien verstande dat in
      [artikel 26, eerste lid, onderdeel c, en tweede lid, onderdeel c][ref3], voor ‘eindfactuur’ wordt gelezen:
      aankoopfactuur. De in artikel 26, eerste lid, onderdelen a en c, en tweede lid, onderdelen a, c en d, genoemde
      bescheiden moeten zijn opgenomen in de administratie. Hetgeen op grond van artikel 26, eerste lid, onderdeel d, en
      tweede lid, onderdeel b, moet worden verklaard wordt aangetoond aan de hand van de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0007159#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel26
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0007159
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 71g
      - id: ref3
        bwb_id: BWBR0005355
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: 35f.1
    text: |-
      In de administratie van degene die verzoekt om teruggaaf van accijns op grond van
      [artikel 71d, eerste lid, van de wet][ref1] is opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71d
  - number: 35f.1.a
    text: per luchtvaartuig waarop het verzoek om teruggaaf betrekking heeft de typeaanduiding en het registratienummer;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.1.b
    text: |-
      per luchtvaartuig, onder vermelding van het registratienummer, de soort en de hoeveelheid minerale oliën waarvoor
      teruggaaf wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.1.c
    text: per soort minerale olie de totale hoeveelheid en het bedrag waarvoor teruggaaf wordt gevraagd; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.1.d
    text: de periode waarop het verzoek om teruggaaf betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.2
    text: |-
      Het verzoek om teruggaaf van accijns wordt ingediend uiterlijk drie maanden na afloop van het kalenderkwartaal
      waarin de desbetreffende afleveringen in de brandstoftanks van de luchtvaartuigen hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.3
    text: |-
      Het recht op teruggaaf van accijns wordt aangetoond aan de hand van de administratie van degene die verzoekt om
      teruggaaf van accijns, waartoe op de tankbonnen en facturen met betrekking tot minerale oliën waarvoor teruggaaf
      van accijns wordt gevraagd, per aflevering is vermeld:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.3.a
    text: het registratienummer van het luchtvaartuig, in de brandstoftanks waarvan de minerale olie is afgeleverd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.3.b
    text: de datum waarop die aflevering heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.3.c
    text: de soort en hoeveelheid minerale olie die is afgeleverd in de brandstoftanks van dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35f.4
    text: |-
      De administratie van degene die verzoekt om teruggaaf van accijns is voorts zodanig ingericht dat daaruit per
      luchtvaartuig op overzichtelijke wijze blijkt dat de vlucht waarvoor de minerale olie is gebruikt waarvoor
      teruggaaf van accijns wordt gevraagd, geen plezierluchtvaart betreft.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
  - number: 35g.1
    text: |-
      Indien een luchtvaartuig feitelijk ter beschikking staat van een ander dan degene op wiens naam het is
      geregistreerd, kan de inspecteur op verzoek de teruggaaf verlenen aan degene die feitelijk de beschikking over het
      luchtvaartuig heeft gehad, indien deze in zijn administratie een machtiging heeft opgenomen die is ondertekend door
      degene op wiens naam het luchtvaartuig is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
  - number: 35g.2
    text: 'De in het eerste lid bedoelde machtiging bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
  - number: 35g.2.a
    text: het registratienummer van het luchtvaartuig waarop de machtiging betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
  - number: 35g.2.b
    text: naam en adres van degene op wiens naam het luchtvaartuig is geregistreerd; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
  - number: 35g.2.c
    text: de periode of perioden waarin het luchtvaartuig feitelijk ter beschikking heeft gestaan.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
  - number: 35g.3
    text: |-
      [Artikel 35f][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel35f
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: 35f
        hoofdstuk: IV
        afdeling: '2'
  - number: 35h.1
    text: |-
      Met betrekking tot door een in het buitenland geregistreerd luchtvaartuig in Nederland getankte minerale oliën
      wordt of worden, in afwijking in zoverre van [artikel 32b, eerste lid][ref1], en van [artikel 35f][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel35f
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: 32b
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: 35f
        hoofdstuk: IV
        afdeling: '2'
  - number: 35h.1.a
    text: |-
      indien voor die levering teruggaaf van omzetbelasting wordt gevraagd, het verzoek om teruggaaf van accijns
      ingediend tezamen met en over dezelfde periode als het verzoek om teruggaaf van omzetbelasting voor deze
      motorbrandstoffen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.1.b
    text: |-
      bij het verzoek de tankbonnen of de facturen meegezonden alsmede de bescheiden waaruit blijkt dat de vlucht
      waarvoor de minerale olie is gebruikt waarvoor teruggaaf van accijns wordt gevraagd een ander karakter heeft gehad
      dan plezierluchtvaart.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.2
    text: |-
      Indien het verzoek om teruggaaf van accijns wordt ingediend door een ander dan de eigenaar van het luchtvaartuig
      wordt een door de eigenaar ondertekende machtiging bijgevoegd. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.3
    text: 'De in het tweede lid bedoelde machtiging bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.3.a
    text: het registratienummer van het luchtvaartuig waarop de machtiging betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.3.b
    text: naam en adres van de eigenaar; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35h.3.c
    text: de periode of perioden waarover door de gemachtigde in plaats van de eigenaar teruggaaf van accijns wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35h
  - number: 35i.1
    text: |-
      Het verzoek om teruggaaf van accijns, bedoeld in [artikel 69a, eerste lid, van de wet][ref1], wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin het gebruik voor het opwekken van elektriciteit in
      een installatie met een elektrisch vermogen van minimaal 60 kilowatt heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35i
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 69a
  - number: 35i.2
    text: 'In de administratie van degene die verzoekt om teruggaaf van accijns is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35i
  - number: 35i.2.a
    text: het tijdvak waarover teruggaaf van accijns is verzocht;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35i
  - number: 35i.2.b
    text: de hoeveelheid en de soort minerale olie waarvoor teruggaaf van accijns is verzocht; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35i
  - number: 35i.2.c
    text: de datum van ontvangst van de desbetreffende minerale oliën.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35i
  - number: 35j.1
    text: |-
      Het verzoek om teruggaaf van accijns, bedoeld in [artikel 71a, eerste lid, van de wet][ref1], wordt ingediend
      uiterlijk drie maanden na afloop van het kalenderkwartaal waarin de accijns door de andere lidstaat is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35j
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71a
  - number: 35j.2
    text: 'In de administratie van degene die verzoekt om teruggaaf van accijns zijn opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35j
  - number: 35j.2.a
    text: de soort en de hoeveelheid accijnsgoederen waarvoor teruggaaf van accijns is verzocht; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35j
  - number: 35j.2.b
    text: bescheiden waarmee wordt aangetoond dat de accijns door de andere lidstaat is geheven en is geïnd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35j
  - number: 35k.1
    text: |-
      Het verzoek om teruggaaf van accijns, bedoeld in [artikel 71h, eerste lid, van de wet][ref1], vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71h
  - number: 35k.1.a
    text: naam en fiscaal nummer van degene die het verzoek om teruggaaf doet;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: 35k.1.b
    text: de soort en hoeveelheid duurzaam geproduceerde biobrandstof waarvoor teruggaaf van accijns wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: 35k.1.c
    text: |-
      het bedrag aan accijns dat wordt teruggevraagd, berekend als bedoeld in
      [artikel 71h, vierde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71h
  - number: 35k.1.d
    text: de periode waarop het verzoek om teruggaaf betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: 35k.2
    text: |-
      Teruggaaf van accijns wordt slechts verleend indien uit de administratie van degene die verzoekt om teruggaaf van
      accijns blijkt:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: 35k.2.a
    text: |-
      wat de energie-inhoud per volume is van de duurzaam geproduceerde biobrandstof en van de gelijkwaardige
      motorbrandstof waarvan het accijnstarief van toepassing is; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: 35k.2.b
    text: dat de duurzaam geproduceerde biobrandstof is afgeleverd als motorbrandstof voor het aandrijven van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35k
  - number: '36'
    text: |-
      In afwijking van [artikel 73, eerste lid van de wet][ref1], hoeven tabaksproducten niet te zijn voorzien van
      accijnszegels als die tabaksproducten:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel73
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '73'
  - number: 36.a
    text: |-
      door particulieren als bedoeld in [artikel 2d, eerste lid van de wet][ref1], voor eigen behoefte door henzelf
      vanuit een lidstaat naar Nederland worden vervoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
  - number: 36.b
    text: |-
      deel uitmaken van de persoonlijke bagage van reizigers en door henzelf voor eigen behoeften vanuit een derde land
      of derdelandsgebied worden meegenomen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
  - number: 36.c
    text: |-
      worden gebruikt als bedoeld in [artikel 66a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66a
  - number: 36.d
    text: |-
      overeenkomstig [artikel 66b, eerste en tweede lid, van de wet][ref1] met vrijstelling van accijns worden
      uitgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66b
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66b
  - number: 36.e
    text: |-
      overeenkomstig [artikel 69 van de wet][ref1] met vrijstelling van accijns tot verbruik worden uitgeslagen; of


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '69'
  - number: 36.f
    text: na de uitslag tot verbruik worden overgebracht naar een plaats waar zij onder ambtelijk toezicht worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel36
  - number: '37'
    text: |-
      In een verzoek om toestemming als bedoeld in [artikel 75, tweede lid, van de wet][ref1], wordt in ieder geval
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: 37.a
    text: de persoon op wiens naam de toestemming moet worden gesteld en zijn btw-identificatienummer;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.b
    text: het adres en de woonplaats waar de houder van de toestemming is gevestigd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.c
    text: |-
      een omschrijving van de aard van het bedrijf waaruit ook moet blijken voor welk soort bedrijf als bedoeld in
      [artikel 75, eerste lid, van de wet][ref1] de toestemming wordt gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: 37.d
    text: een omschrijving van de zegeladministratie en het adres waar deze administratie wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.e
    text: |-
      het aantal onbedrukte blanco accijnszegels dat gemiddeld per maand wordt aangevraagd en het aantal accijnszegels
      dat gemiddeld in voorraad wordt gehouden onderscheiden naar soort van het tabaksproduct en de gemiddelde
      kleinhandelsprijs per soort;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.f
    text: |-
      het aantal bedrukte accijnszegels dat gemiddeld per maand wordt aangevraagd en het aantal accijnszegels
      dat gemiddeld in voorraad wordt gehouden onderscheiden naar de soort van het tabaksproduct, de gemiddelde
      kleinhandelsprijs en, voor rooktabak en sigaretten, de gemiddelde hoeveelheid op de accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.g
    text: |-
      de naam, het adres, de woonplaats, het land en de aard van het niet in Nederland gevestigde bedrijf als het een
      fiscaal vertegenwoordiger betreft; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
  - number: 37.h
    text: |-
      de naam en het adres van degene die de tabaksproducten uitslaat tot verbruik als het een bedrijf als bedoeld in
      [artikel 75, eerste lid, onderdelen c of d][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: '38.1'
    text: |-
      De toestemming om onbedrukte blanco zegels aan te vragen wordt verleend aan een geregistreerde geadresseerde of
      een vergunninghouder van een accijnsgoederenplaats die ten minste 10 miljoen accijnszegels in het voorafgaande
      kalenderjaar heeft aangevraagd en op de verpakking van de tot verbruik uitgeslagen sigaretten, rooktabak en sigaren
      heeft aangebracht.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
  - number: '38.2'
    text: Degene die toestemming heeft om onbedrukte blanco zegels aan te vragen, kan geen bedrukte zegels aanvragen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
  - number: '38.3'
    text: |-
      Een niet in Nederland gevestigd bedrijf als bedoeld in [artikel 75, eerste lid, onderdeel c, van de wet][ref1] kan
      slechts door één fiscaal vertegenwoordiger worden vertegenwoordigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: '38.4'
    text: |-
      Een fiscaal vertegenwoordiger die meerdere toestemmingen heeft en de aangevraagde accijnszegels zelf in voorraad
      houdt slaat de aangevraagde accijnszegels per toestemming fysiek gescheiden op.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
  - number: '38.5'
    text: |-
      De inspecteur stelt in de toestemming om accijnszegels aan te vragen nadere voorwaarden ten aanzien van het aantal
      per maand aan te vragen accijnszegels en het aantal accijnszegels dat in voorraad wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
  - number: '38.6'
    text: |-
      De inspecteur kan in de toestemming om accijnszegels aan te vragen nadere voorwaarden stellen ten aanzien van de
      zegeladministratie, bedoeld in [artikel 9e, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel9e
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 9e
  - number: '39'
    text: |-
      Met betrekking tot het verlenen en aanpassen van de toestemming om accijnszegels aan te vragen zijn de
      [artikelen 43][ref1], [44, tweede en derde lid][ref2], [45][ref3] en [46 van de wet][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '45'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '46'
  - number: '40.1'
    text: |-
      In de zegeladministratie, bedoeld in [artikel 9e, eerste lid, van het besluit][ref1], wordt in ieder geval
      aantekening gehouden van:


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel9e
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: 9e
  - number: 40.1.a
    text: de aangevraagde en ontvangen accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.b
    text: de tariefcode, de kleinhandelsprijs en de hoeveelheid op iedere accijnszegel;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.c
    text: het aanbrengen van accijnszegels op de verpakking in Nederland en in het buitenland;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.d
    text: |-
      het terugsturen van vellen met accijnszegels die niet aan de kwaliteitseisen voldoen of niet zijn geleverd
      overeenkomstig de aanvraag;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.e
    text: |-
      het vernietigen onder ambtelijk toezicht van losse accijnszegels of beschadigde vellen met accijnszegels en het
      verloren gaan van de accijnszegels ten gevolge van ongeval of overmacht;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.f
    text: de accijnszegels die zijn aangebracht op de tot verbruik uitgeslagen tabaksproducten;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.g
    text: |-
      als het een accijnsgoederenplaats betreft de accijnszegels die zijn aangebracht op de tot verbruik uitgeslagen
      tabaksproducten die in de accijnsgoederenplaats opnieuw zijn ingeslagen; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.1.h
    text: |-
      de locatie waar de accijnszegels zich bevinden of de locatie waar de tabaksproducten zich bevinden waarop de
      accijnszegels zijn aangebracht voor zover deze tabaksproducten nog niet zijn opgenomen in een aangifte als bedoeld
      in de [artikelen 53][ref1] en [53a van de wet][ref2] of in een aangifte tot het brengen in het vrije verkeer van de
      EU, bedoeld in artikel 201 van het Douanewetboek van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel53a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 53a
  - number: '40.2'
    text: 'Bij de zegeladministratie worden de volgende bescheiden bewaard:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.2.a
    text: de aanvragen om accijnszegels en de afgetekende kopie ontvangstbewijzen van de geleverde accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.2.b
    text: de door de zegelproducent voor ontvangst afgetekende formulieren voor teruggezonden accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.2.c
    text: de ambtelijke verklaringen met betrekking tot de accijnszegels die zijn vernietigd of verloren gegaan; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.2.d
    text: |-
      een specificatie, waaruit blijkt hoe het bedrag aan accijns dat op de aangifte, bedoeld in [artikel 53][ref1]
      of [53a van de wet][ref2], of naar aanleiding van de uitnodiging van betaling, bedoeld in artikel 102 van
      het Douanewetboek van de Unie, is voldaan, is berekend onderscheiden naar het soort tabaksproduct en de op de
      accijnszegel vermelde hoeveelheid en kleinhandelsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel53a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 53a
  - number: '40.3'
    text: |-
      De administratie van een bedrijf dat een toestemming voor het aanvragen van accijnszegels heeft als bedoeld in
      [artikel 75, tweede lid, van de wet][ref1], moet zodanig zijn ingericht dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: 40.3.a
    text: een juiste, volledige en tijdige vastlegging van de bedrijfshandelingen gewaarborgd is; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.3.b
    text: alle voor de heffing van accijns van belang zijnde gegevens op overzichtelijke wijze zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: '40.4'
    text: |-
      Onverminderd het eerste en tweede lid moet bij een bedrijf dat een toestemming voor het aanvragen van accijnszegels
      heeft als bedoeld in [artikel 75, tweede lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
  - number: 40.4.a
    text: |-
      de zegeladministratie gerelateerd kunnen worden aan de administratie waarin de orders van en de financiële
      transacties met het bedrijf dat in het buitenland de tabaksproducten van accijnszegels voorziet zijn opgenomen; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
  - number: 40.4.b
    text: |-
      bij de zegeladministratie een afschrift worden bewaard van de aangifte, bedoeld in de [artikelen 53][ref1] en
      [53a van de wet][ref2] of van de aangifte tot het brengen in het vrije verkeer van de EU, bedoeld in artikel 201
      van het Douanewetboek van de Unie, voor de van accijnszegels voorziene tabaksproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel53a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 53a
  - number: '41.1'
    text: |-
      Onverminderd het bepaalde in [artikel 40][ref1] blijkt uit de zegeladministratie van de houder van een
      accijnsgoederenplaats of een geregistreerde geadresseerde die toestemming heeft om onbedrukte blanco accijnszegels
      aan te vragen, welke gegevens op de onbedrukte blanco accijnszegels zijn gedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel40
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '40'
        hoofdstuk: V
        afdeling: '1'
  - number: '41.2'
    text: |-
      In de zegeladministratie, die een gescheiden onderdeel vormt van de administratie, bedoeld in de
      [artikelen 8][ref1] of [9a van het besluit][ref2], worden in ieder geval de procedures vastgelegd die zien op het
      zelf bedrukken of laten bedrukken met de in [artikel 49, eerste lid][ref3], genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel49
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005360
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0005355
        artikel: '49'
        hoofdstuk: V
        afdeling: '1'
  - number: '41.3'
    text: |-
      De administratieve organisatie moet zodanig zijn ingericht dat deze voldoende waarborgen biedt voor de
      functiescheiding tussen:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: 41.3.a
    text: de ontvangst van de onbedrukte blanco accijnszegels,
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: 41.3.b
    text: het beheer van de onbedrukte blanco accijnszegels,
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: 41.3.c
    text: het bedrukken van de onbedrukte blanco accijnszegels en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: 41.3.d
    text: het aanbrengen van de zelf bedrukte accijnszegels op de kleinhandelsverpakking.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: '41.4'
    text: |-
      In de zegeladministratie wordt een duidelijk verband gelegd tussen de aangevraagde onbedrukte blanco accijnszegels
      en de op de accijnszegels gedrukte gegevens.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel41
  - number: '42.1'
    text: |-
      De accijnszegels worden aangevraagd bij de zegelproducent die door de directeur-generaal Douane, bedoeld in
      [artikel 4, tweede lid, van de Uitvoeringsregeling belastingdienst 2003][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel4
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '4'
  - number: '42.2'
    text: De zegelproducent mag zich laten vertegenwoordigen door een distributeur van de accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: '42.3'
    text: |-
      Voor het aanvragen van accijnszegels wordt gebruikgemaakt van het formulier dat door de zegelproducent verkrijgbaar
      wordt gesteld. De aanvraag bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.a
    text: naam, adres en plaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.b
    text: naam en telefoonnummer van de contactpersoon van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.c
    text: het nummer van de toestemming om accijnszegels aan te vragen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.d
    text: een door de aanvrager toegekend doorlopend nummer;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.e
    text: 'het aantal vellen bedrukte accijnszegels waarbij per tabaksproduct wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.e.1
    text: het aantal accijnszegels per vel;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.e.2
    text: |-
      de kleinhandelsprijs en de hoeveelheid op de accijnszegel, voor sigaretten in stuks en voor rooktabak het
      nettogewicht in grammen; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.e.3
    text: de aanwezige voorraad accijnszegels onderscheiden naar tariefcode en het soort tabaksproduct;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: 42.3.f
    text: het aantal vellen onbedrukte blanco accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: '42.4'
    text: |-
      Het formulier wordt elektronisch ingediend. De zegelproducent stelt middelen ter beschikking voor het elektronisch
      indienen en ondertekenen van het formulier.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: '42.5'
    text: De zegelproducent en de aanvrager leggen de aanvraag vast in hun administratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel42
  - number: '43.1'
    text: |-
      De accijnszegels worden verkrijgbaar gesteld door de zegelproducent op het distributiepunt in hoeveelheden van één
      of meer vellen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel43
  - number: '43.2'
    text: |-
      De onbedrukte blanco accijnszegels worden in één vel met een aantal accijnszegels beschikbaar gesteld. De vellen
      met onbedrukte blanco accijnszegels worden in een veelvoud van 100 stuks aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel43
  - number: '43.3'
    text: |-
      De bedrukte accijnszegels worden per tabaksproduct in vellen met een verschillend aantal accijnszegels beschikbaar
      gesteld. Het aantal accijnszegels per vel wordt door de zegelproducent vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel43
  - number: '43.4'
    text: |-
      Als de aangevraagde accijnszegels niet binnen vier weken na het tijdstip waarop zij op het distributiepunt
      beschikbaar zijn gesteld zijn afgehaald, wordt de aanvraag geacht niet te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel43
  - number: '44.1'
    text: De accijnszegels hebben de vorm van een rechthoek en hebben een grootte van 2,0 x 4,4 cm.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel44
  - number: '44.2'
    text: |-
      Voor sigaretten en rooktabak worden op de accijnszegels de hoeveelheid (nettomassa of aantal stuks), de soort van
      het tabaksproduct en de kleinhandelsprijs gedrukt op een door de inspecteur voorgeschreven plaats. Voor sigaren
      worden op de accijnszegels de soort van het tabaksproduct en de kleinhandelsprijs gedrukt op een door de inspecteur
      voorgeschreven plaats. De naam van degene die de accijnszegels heeft aangevraagd wordt opgenomen op een door de
      inspecteur voorgeschreven plaats.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel44
  - number: '44.3'
    text: |-
      Op de zegel is op een door de inspecteur voorgeschreven plaats de tariefcode AB12 voor sigaretten en BB12 voor
      rooktabak vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel44
  - number: '45.1'
    text: De accijnszegels worden met een kleefstof duurzaam bevestigd op de verpakking van tabaksproducten.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel45
  - number: '45.2'
    text: |-
      De accijnszegels moeten op de verpakking zodanig worden aangebracht dat alle op de accijnszegels voorkomende
      vermeldingen duidelijk leesbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel45
  - number: '46.1'
    text: |-
      Op de verpakking van tabaksproducten worden de soort en de hoeveelheid van het tabaksproduct, het merk waaronder
      het tabaksproduct in de handel wordt gebracht en, ter keuze van degene die de accijnszegels heeft aangevraagd, zijn
      naam dan wel het fabrieks- of handelsmerk of het nummer, bedoeld in [artikel 48, eerste lid][ref1], vermeld. De
      vermelding van de soort van het tabaksproduct kan achterwege blijven als er geen twijfel bestaat over de inhoud van
      de verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel48
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '48'
        hoofdstuk: V
        afdeling: '1'
  - number: '46.2'
    text: De verpakking bevat geen andere voorwerpen dan tabaksproducten.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel46
  - number: '46.3'
    text: |-
      De verpakking is niet zodanig van aard en vorm dat daarmee tevens een later gebruik voor andere doeleinden wordt
      beoogd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel46
  - number: '48.1'
    text: |-
      De inspecteur kan op verzoek van degene die de accijnszegels heeft aangevraagd, toestaan dat op de accijnszegel,
      in plaats van de naam van de aanvrager, een fabrieks- of handelsmerk of een door de directeur-generaal Douane,
      bedoeld in [artikel 4, tweede lid, van de Uitvoeringsregeling belastingdienst 2003][ref1], vastgesteld nummer wordt
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel4
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '4'
  - number: '48.2'
    text: |-
      De accijnszegels worden afgeleverd zonder vermelding van de naam, bedoeld in [artikel 44, tweede lid][ref1],
      of van het in het eerste lid bedoelde fabrieks- of handelsmerk of nummer. Eén van deze vermeldingen wordt door
      degene die de accijnszegels heeft aangevraagd op duidelijke en onuitwisbare wijze aangebracht op de plaats van de
      accijnszegel, bedoeld in artikel 44, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel44
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '44'
        hoofdstuk: V
        afdeling: '1'
  - number: '48.3'
    text: |-
      Degene die de accijnszegels heeft aangevraagd kan een code aanbrengen, bestaande uit letters dan wel uit een nummer
      voorafgegaan door een letter. Deze code wordt boven de kleinhandelsprijs vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel48
  - number: '48.4'
    text: |-
      Het is verboden om zonder toestemming van de inspecteur op de accijnszegels andere dan de in dit artikel
      voorgeschreven en toegestane vermeldingen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel48
  - number: '49.1'
    text: |-
      De houder van een toestemming om onbedrukte blanco zegels aan te vragen drukt op de accijnszegels
      de tariefcode, het soort tabaksproduct, de kleinhandelsprijs en de hoeveelheid overeenkomstig
      [artikel 44, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel44
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '44'
        hoofdstuk: V
        afdeling: '1'
  - number: '49.2'
    text: |-
      De soort van het tabaksproduct, de kleinhandelsprijs en, bij rooktabak en sigaretten, de hoeveelheid die op de
      onbedrukte blanco accijnszegels worden vermeld komen overeen met de inhoud van de verpakking van de tabaksproducten
      en de kleinhandelsprijs waartegen de tabaksproducten aan anderen dan wederverkopers worden verkocht.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel49
  - number: '49.3'
    text: |-
      De vermeldingen worden op een duidelijke en onuitwisbare wijze aangebracht op de plaats, bedoeld in
      [artikel 44, tweede en derde lid][ref1]. Het bedrukken vindt plaats met zwarte inkt en met hetzelfde lettertype als
      waarmee de gegevens, bedoeld in [artikel 48, tweede en derde lid][ref2], worden gedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel48
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '44'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: '48'
        hoofdstuk: V
        afdeling: '1'
  - number: '50.1'
    text: |-
      Als de vellen met accijnszegels niet aan de kwaliteitseisen voldoen of niet overeenkomen met de aangevraagde
      soorten accijnszegels of als er te veel dan wel te weinig accijnszegels zijn geleverd, wordt dit direct gemeld bij
      de zegelproducent en de inspecteur. In overleg met de inspecteur en de zegelproducent worden de accijnszegels die
      niet aan de kwaliteitseisen voldoen, niet overeenkomen met de aangevraagde soorten accijnszegels of die te veel
      zijn geleverd, door degene die de accijnszegels heeft aangevraagd teruggezonden naar de zegelproducent.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: '50.2'
    text: |-
      Voor het terugzenden van de vellen met accijnszegels wordt gebruikgemaakt van een door de zegelproducent
      vastgesteld formulier in drievoud (exemplaar voor de aanvrager, exemplaar voor de inspecteur en een exemplaar voor
      de zegelproducent). Dit formulier bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.a
    text: naam, adres en plaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.b
    text: naam en telefoonnummer van de contactpersoon van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.c
    text: het oorspronkelijke unieke leveringsnummer van de zegelproducent;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.d
    text: het doorlopende nummer van de aanvraag om accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.e
    text: het aantal vellen onbedrukte blanco accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.f
    text: het aantal bedrukte vellen met accijnszegels onderscheiden naar tariefcode en soort tabaksproduct; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.g
    text: |-
      per vel met bedrukte accijnszegels de hoeveelheid tabaksproduct (het aantal stuks of nettogewicht in grammen), de
      kleinhandelsprijs per accijnszegel en het bedrag van de totale kleinhandelsprijs;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: 50.2.h
    text: welke vervangende accijnszegels moeten worden geleverd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: '50.3'
    text: |-
      Het exemplaar voor de inspecteur van het formulier, bedoeld in het tweede lid, wordt door de aanvrager naar
      de inspecteur gezonden. De aanvrager en de zegelproducent nemen hun exemplaren van het formulier op in hun
      administratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: '51.1'
    text: |-
      Op verzoek van degene die de accijnszegels heeft aangevraagd kunnen de volgende accijnszegels of vellen met
      accijnszegels onder ambtelijk toezicht in Nederland worden vernietigd:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.a
    text: de onbeschadigde accijnszegels of vellen met accijnszegels waarop een oude tariefcode is vermeld;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.b
    text: de onbeschadigde bedrukte accijnszegels die niet meer bruikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.c
    text: de beschadigde vellen met accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.d
    text: de beschadigde of onbeschadigde losse accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.e
    text: de beschadigde aangesneden vellen met accijnszegels; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: 51.1.f
    text: |-
      accijnszegels of vellen accijnszegels, waarop niet de juiste gegevens, bedoeld in
      [artikel 48, tweede en derde lid][ref1], en [artikel 49, eerste lid][ref2], zijn gedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel49
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '48'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: '49'
        hoofdstuk: V
        afdeling: '1'
  - number: '51.2'
    text: |-
      Een verzoek om vernietiging van accijnszegels onder ambtelijk toezicht kan plaatsvinden met een formulier dat van
      rijkswege verkrijgbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: '51.3'
    text: |-
      Als de accijnszegels, bedoeld in het eerste lid, in een andere lidstaat worden vernietigd, gebeurt dat
      onder ambtelijk toezicht en wordt dit aan de hand van een ambtelijke verklaring van de (douane)autoriteiten
      in die lidstaat aangetoond. De verklaring bevat dezelfde gegevens als de gegevens, genoemd in het in het
      tweede lid bedoelde formulier. Degene die de accijnszegels heeft aangevraagd neemt de verklaring op in zijn
      zegeladministratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: '51.4'
    text: |-
      De accijnszegels met een oude tariefcode moeten uiterlijk de laatste dag van de maand waarin het nieuwe
      accijnstarief van toepassing is geworden worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: '51.5'
    text: |-
      Als tabaksproducten waarop accijnszegels zijn aangebracht in overeenstemming met [artikel 3, derde lid][ref1],
      in een accijnsgoederenplaats onder ambtelijk toezicht worden vernietigd, neemt degene die de accijnszegels
      heeft aangevraagd een afschrift van de mededeling tot vernietiging met een specificatie van de soort vernietigde
      accijnszegels op in zijn zegeladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: '51.6'
    text: |-
      Als tabaksproducten waarop de accijnszegels in een andere lidstaat zijn aangebracht en die zich aldaar onder een
      accijnsschorsingsregeling bevinden op verzoek worden vernietigd, gebeurt dat onder ambtelijk toezicht en wordt dit
      aan de hand van een ambtelijke verklaring van (douane)autoriteiten van die lidstaat aangetoond. De verklaring bevat
      dezelfde gegevens als de gegevens die zijn genoemd in de mededeling tot vernietiging en de specificatie, bedoeld in
      het vijfde lid. Degene die de accijnszegels heeft aangevraagd neemt de verklaring op in zijn zegeladministratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel51
  - number: '52.1'
    text: |-
      Als accijnszegels door overmacht of ongeval in Nederland verloren gaan of geacht worden te zijn vermist, doet
      degene die de accijnszegels heeft aangevraagd hiervan onverwijld mededeling aan de inspecteur, onder vermelding van
      het tijdstip, de plaats en de oorzaak van het verloren gaan dan wel van de vermissing.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52
  - number: '52.2'
    text: |-
      De mededeling, bedoeld in het eerste lid, moet plaatsvinden met het formulier dat van rijkswege verkrijgbaar is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52
  - number: '52.3'
    text: |-
      Als accijnszegels in een andere lidstaat door overmacht of ongeval verloren zijn gegaan, blijkt dit uit een
      ambtelijke verklaring van de (douane)autoriteiten van die lidstaat. De verklaring bevat dezelfde gegevens als de
      gegevens, genoemd in het in het tweede lid genoemde formulier. Degene die de accijnszegels heeft aangevraagd neemt
      deze verklaring op in zijn zegeladministratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52
  - number: '52.4'
    text: |-
      Als de tabaksproducten waarop accijnszegels zijn aangebracht tijdens het vervoer in Nederland onder een
      accijnsschorsingsregeling of in een accijnsgoederenplaats verloren gaan, neemt degene die de accijnszegels heeft
      aangevraagd een afschrift van de in [artikel 3, tweede en derde lid][ref1], genoemde mededeling en een specificatie
      van de soorten accijnszegels op in zijn zegeladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: '52.5'
    text: |-
      Als tabaksproducten waarop in een andere lidstaat accijnszegels zijn aangebracht en die zich aldaar onder een
      accijnsschorsingsregeling bevinden in die lidstaat verloren gaan, blijkt dit uit een ambtelijke verklaring van de
      (douane)autoriteiten in die lidstaat. De verklaring bevat dezelfde gegevens als de gegevens die zijn genoemd in
      het formulier, bedoeld in het tweede lid. Degene die de accijnszegels heeft aangevraagd neemt de verklaring op in
      zijn zegeladministratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52
  - number: 52a.1
    text: |-
      De inspecteur kan bepalen dat accijnszegels die bij het normale productieproces verloren zijn gegaan niet als
      vermist worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52a
  - number: 52a.2
    text: |-
      De aanvrager doet maandelijks mededeling van de hoeveelheid accijnszegels, bedoeld in het eerste lid, die verloren
      zijn gegaan bij het normale productieproces.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel52a
  - number: '54.1'
    text: |-
      Als een in [artikel 34, eerste lid, van het besluit][ref1] bedoeld bescheid kan dienen een (elektronische) factuur
      of een (elektronisch) vervoersbescheid. Indien het bescheid betrekking heeft op het vervoer van wijn kan, in plaats
      van de factuur of het vervoersbescheid, als bescheid tevens dienen een etiket dat op de andere verpakking dan de
      rechtstreekse verpakking van de wijn is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel34
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '34'
  - number: '54.2'
    text: Een (elektronische) kopie van het bescheid wordt bij de administratie bewaard.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: '54.3'
    text: 'Het (elektronische) bescheid vermeldt de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.a
    text: de plaats en dagtekening van afgifte;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.b
    text: de naam, het adres en de hoedanigheid van de afzender;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.c
    text: |-
      de naam, het adres en de hoedanigheid van de ontbieder en de plaats waar het pand zich bevindt waar de goederen
      naartoe worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.d
    text: de soort van de accijnsgoederen naar de onderscheidingen van de wet en de hoeveelheid van de accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.e
    text: de merken en nummers, aantal en soort van de verpakkingen;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: 54.3.f
    text: 'indien het (elektronische) bescheid is uitgereikt in een andere lidstaat: het ARC of VARC.'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel54
  - number: '55'
    text: |-
      Op het in [artikel 35 van het besluit][ref1] bedoelde bescheid van herkomst voor ruwe en voor gedeeltelijk tot
      verbruik bereide tabak is [artikel 54][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel54
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: '54'
        hoofdstuk: V
        afdeling: '2'
  - number: 55a
    text: |-
      Met betrekking tot de vordering, bedoeld in [artikel 83, vierde lid, van de wet][ref1] is de regeling
      van de Minister van Justitie en Veiligheid, bedoeld in de [artikelen 1:24, vierde lid][ref2], en
      [1:27, tweede lid, van de Algemene douanewet][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '56'
    text: |-
      Een op grond van [artikel 84 van de wet][ref1] gevorderd monster wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel84
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '84'
  - number: 56.a
    text: genomen onder toezicht van de inspecteur of een door hem aangewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel56
  - number: 56.b
    text: zodanig verpakt, dat de identiteit van het monster is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel56
  - number: 56.c
    text: |-
      onderzocht in of in opdracht van het Douane Laboratorium met gebruikmaking van internationaal erkende
      onderzoeksmethoden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel56
  - number: '58.1'
    text: 'In een vergunning voor het vervaardigen van distilleertoestellen worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: 58.1.a
    text: de naam en het adres van degene aan wie de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: 58.1.b
    text: de plaats waar de vervaardiging plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: 58.1.c
    text: |-
      dat uit de administratie dient te blijken het gebruiksdoel en de naam en het adres van degene voor wie het toestel
      is bestemd, alsmede het adres waar het toestel zal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: '58.2'
    text: |-
      In een vergunning voor het voorhanden hebben van een distilleertoestel worden opgenomen de naam en het adres van
      degene aan wie de vergunning wordt verleend, het gebruiksdoel van het toestel en het adres waar het toestel wordt
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: '58.3'
    text: |-
      In het verzoek om een vergunning dienen de in het eerste lid, onderdelen a en b, dan wel het tweede lid bedoelde
      gegevens te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: '58.4'
    text: De inspecteur is bevoegd distilleertoestellen te voorzien van ambtelijke herkenningsmerken.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel58
  - number: '59'
    text: |-
      Als distilleertoestellen als bedoeld in [artikel 90, zevende lid, onderdeel b, van de wet][ref1] worden aangewezen
      de in [bijlage A.3][ref2] bij deze regeling omschreven toestellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0005355
  - number: 59a.1
    text: |-
      In een vergunning voor het in het vrije verkeer brengen, het brengen naar een andere lidstaat of de uitvoer naar
      een derde land van een tabaksproductieapparaat worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.1.a
    text: de naam en het adres van degene aan wie de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.1.b
    text: de naam en het adres van degene voor wie het betreffende tabaksproductieapparaat is bestemd; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.1.c
    text: een specifieke beschrijving van het betreffende tabaksproductieapparaat.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2
    text: 'In een vergunning voor het vervaardigen van een tabaksproductieapparaat worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.a
    text: de naam en het adres van degene aan wie de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.b
    text: het adres waar de vervaardiging plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.c
    text: 'een verklaring dat uit de administratie het volgende blijkt:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.c.1°
    text: |-
      de naam en het adres van degene voor wie het tabaksproductieapparaat is bestemd en het adres waar het
      tabaksproductieapparaat zal worden gebruikt zodra deze informatie bekend is;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.c.2°
    text: |-
      het adres waar het tabaksproductieapparaat voorhanden wordt gehouden totdat het tabaksproductieapparaat een nadere
      bestemming krijgt; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.2.d
    text: een specifieke beschrijving van het te vervaardigen tabaksproductieapparaat.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.3
    text: 'In een vergunning voor het voorhanden hebben van een tabaksproductieapparaat worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.3.a
    text: de naam en het adres van degene aan wie de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.3.b
    text: de bestemming van het tabaksproductieapparaat;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.3.c
    text: een specifieke beschrijving van het betreffende tabaksproductieapparaat; en
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.3.d
    text: het adres waar het tabaksproductieapparaat voorhanden wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.4
    text: |-
      Een vergunning voor het in het vrije verkeer brengen, het brengen naar een andere lidstaat, de uitvoer naar een
      derde land of het vervaardigen van een tabaksproductieapparaat houdt tevens in een vergunning voor het voorhanden
      hebben van het vervaardigde apparaat.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59a.5
    text: |-
      In het verzoek om een vergunning dienen de voor het verlenen van de vergunning benodigde gegevens te worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59a
  - number: 59b
    text: |-
      Een vrijstelling van de vergunningplicht als bedoeld in [artikel 90a, vierde lid, onderdeel b, van de wet][ref1]
      geldt in de gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 90a
  - number: 59b.a
    text: |-
      een tabaksproductieapparaat is bestemd te worden gebruikt voor het op eenvoudige wijze produceren van een sigaret
      in de persoonlijke sfeer, waarbij die sigaret wordt verbruikt door de producent, door een gezinslid of huisgenoot
      van de producent of zijn gasten en er geen sprake is van productie van sigaretten voor commerciële doeleinden;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59b
  - number: 59b.b
    text: |-
      een tabaksproductieapparaat voorhanden wordt gehouden in een accijnsgoederenplaats waar onder schorsing van accijns
      tabaksproducten mogen worden geproduceerd of verwerkt, mits uit de administratie van de vergunninghouder van de
      accijnsgoederenplaats blijkt welke tabaksproductieapparaten hij in gebruik heeft of die hij voornemens is te gaan
      gebruiken;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59b
  - number: 59b.c
    text: |-
      een tabaksproductieapparaat wordt vervoerd naar een houder van een vergunning als bedoeld in
      [artikel 90a, eerste lid, van de wet][ref1] dan wel naar een accijnsgoederenplaats als bedoeld in onderdeel b
      indien dit vervoer blijkt uit de administratie of de vrachtbrief van de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90a
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 90a
  - number: '60.1'
    text: |-
      In afwijking van [artikel 91, tweede lid, van de wet][ref1] mag vóór 1 januari 2013 gekochte en afgeleverde gasolie
      voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen voorhanden zijn in:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel91
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '91'
  - number: 60.1.a
    text: |-
      brandstoftanks van waaruit de brandstof via een gesloten systeem wordt gebracht naar een noodstroomvoorziening voor
      de opwekking van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
  - number: 60.1.b
    text: |-
      brandstoftanks van historische vaartuigen als bedoeld in
      [artikel 2, eerste lid, onderdeel a, onder 5°, van de Wet pleziervaartuigen 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel2
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '2'
  - number: '60.2'
    text: |-
      De gasolie voorzien van herkenningsmiddelen als bedoeld in [artikel 13, tweede lid][ref1], mag voorhanden zijn in
      tanks als bedoeld in het eerste lid tot deze is verbruikt of wordt vervangen door gasolie die niet is voorzien van
      genoemde herkenningsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel13
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '13'
        hoofdstuk: II
        afdeling: '5'
  - number: '60.3'
    text: 'Desgevraagd moeten aan de inspecteur alle noodzakelijke gegevens worden verstrekt om aan te tonen:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
  - number: 60.3.a
    text: |-
      wanneer de gasolie voorzien van de herkenningsmiddelen, bedoeld in [artikel 13, tweede lid][ref1], is gekocht en
      afgeleverd in de tanks;


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel13
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '13'
        hoofdstuk: II
        afdeling: '5'
  - number: 60.3.b
    text: |-
      wanneer en hoeveel vóór 1 januari 2013 in tanks aanwezige gasolie voorzien van de herkenningsmiddelen, bedoeld in
      [artikel 13, tweede lid][ref1], is verbruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel13
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '13'
        hoofdstuk: II
        afdeling: '5'
  - number: '60.4'
    text: |-
      Ontheffing van het verbod, bedoeld in [artikel 91, tweede lid, van de wet][ref1], wordt verleend voor minerale
      olie die is uitgeslagen tot verbruik als bedoeld in artikel 2, eerste lid, aanhef en onderdeel b, van de wet en die
      voorhanden is in een opslagtank op het bedrijfsterrein van een scheepsonderhoudsbedrijf, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel91
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '91'
  - number: 60.4.a
    text: |-
      de ingezamelde minerale olie uitsluitend wordt afgegeven aan een houder van een vergunning als bedoeld in
      [artikel 9, onderdeel c, van het Besluit inzamelen afvalstoffen][ref1] die tevens in het bezit is van een
      vergunning voor een accijnsgoederenplaats voor minerale oliën; en


      [ref1]: https://wetten.overheid.nl/BWBR0016530#Artikel9
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0016530
        artikel: '9'
  - number: 60.4.b
    text: |-
      in de administratie van het scheepsonderhoudsbedrijf op overzichtelijke wijze de ontvangst uit schepen, niet zijnde
      een pleziervaartuig, en de afgifte aan een vergunninghouder als bedoeld in onderdeel a worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel60
  - number: '61.1'
    text: |-
      [Artikel 94, eerste lid, van de wet][ref1] is niet van toepassing ingeval een zelfde tabaksproduct onder hetzelfde
      merk in de handel wordt gebracht in verpakkingseenheden met verschillende inhoud en de kleinhandelsprijzen van
      die verpakkingseenheden, omgerekend tot een prijs van een hoeveelheid van 1000 stuks of 1 kg nettomassa, niet met
      elkaar overeenkomen voor zover dit het gevolg is van de afronding van de kleinhandelsprijzen per verpakkingseenheid
      naar boven of naar beneden op € 0,05.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel94
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '94'
  - number: '61.2'
    text: |-
      [Artikel 94, eerste lid, van de wet][ref1] is niet van toepassing bij wijziging van de kleinhandelsprijs van
      een tabaksproduct gedurende een tijdvak van vier weken, dat aanvangt op het tijdstip met ingang waarvan het
      tabaksproduct tegen de gewijzigde kleinhandelsprijs in de handel wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel94
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '94'
  - number: '62'
    text: |-
      In afwijking van [artikel 95, eerste lid, van de wet][ref1] mogen sigaren in de detailhandelszaken voorhanden zijn
      in de geopende oorspronkelijke kleinhandelsverpakking met een inhoud van maximaal 100 stuks sigaren. Deze sigaren
      mogen zonder accijnszegel per stuk worden verkocht tegen een kleinhandelsprijs die is vastgesteld naar rato van
      de hoeveelheid in de oorspronkelijke kleinhandelsverpakking en de kleinhandelsprijs op de accijnszegel die op de
      oorspronkelijke kleinhandelsverpakking is aangebracht. In het geval de sigaren buiten de oorspronkelijke verpakking
      voorhanden zijn, dient deze oorspronkelijke verpakking in de detailhandelszaak aanwezig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel95
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '95'
  - number: 62a
    text: |-
      In afwijking van [artikel 95, eerste lid, van de wet][ref1] mogen tabaksproducten worden verkocht, te koop worden
      aangeboden of worden afgeleverd in onderscheidenlijk aan militaire winkels, kantines, restaurants, clubs of messes
      als bedoeld in [artikel 42g van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref2] zonder dat
      op die producten of kleinhandelsverpakking een accijnszegel is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel42g
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '95'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: 42g
  - number: '63'
    text: 'Strafbare feiten zijn:'
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel63
  - number: 63.a
    text: |-
      het niet voldoen aan de verplichtingen, bedoeld in [artikel 13, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel13
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '13'
        hoofdstuk: II
        afdeling: '5'
  - number: 63.b
    text: |-
      het overtreden van het in [artikel 48, vierde lid][ref1], bedoelde verbod;


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel48
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '48'
        hoofdstuk: V
        afdeling: '1'
  - number: 63.c
    text: |-
      het niet voldoen aan een in [artikel 33, tweede, derde en vierde lid][ref1], [45][ref2] of [46][ref3] opgelegde
      verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel46
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005355
        artikel: '33'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005355
        artikel: '45'
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005355
        artikel: '46'
        hoofdstuk: V
        afdeling: '1'
  - number: '64.1'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [Wet op de accijns][ref1] in werking treedt, met
      uitzondering van de [artikelen 4][ref2], [5][ref3] en [6][ref4] die in werking treden met ingang van 1 januari
      1993.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005355#Artikel6
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005251
      - id: ref2
        bwb_id: BWBR0005355
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005355
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005355
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '64.2'
    text: |-
      Deze regeling kan worden aangehaald als [Uitvoeringsregeling accijns][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005355
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005355
