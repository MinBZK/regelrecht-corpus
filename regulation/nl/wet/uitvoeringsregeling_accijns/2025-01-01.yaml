    text: |-
      1 In het verzoek om een vergunning als bedoeld in [artikel 65, vierde lid, van de wet][ref1], dienen te worden
      vermeld:

      a. de persoon op wiens naam de vergunning dient te worden gesteld;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting per jaar zal worden betrokken;

      c. de locatie en de inrichting van het bedrijf;

      d. de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting per jaar met vrijstelling
      wordt geproduceerd, verwerkt of verbruikt;

      e. de administratie en de administratieve organisatie met betrekking tot het bedrijf waarvoor de vergunning wordt
      gevraagd.

      2 Met betrekking tot het verlenen, het aanpassen en het intrekken van de vergunning zijn de
      [artikelen 43 tot en met 50 van de wet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel43
