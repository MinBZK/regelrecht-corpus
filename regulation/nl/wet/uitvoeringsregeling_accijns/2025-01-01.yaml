  - number: 35f
    text: |-
      1 In de administratie van degene die verzoekt om teruggaaf van accijns op grond van
      [artikel 71d, eerste lid, van de wet][ref1] is opgenomen:

      a. per luchtvaartuig waarop het verzoek om teruggaaf betrekking heeft de typeaanduiding en het registratienummer;

      b. per luchtvaartuig, onder vermelding van het registratienummer, de soort en de hoeveelheid minerale oliën
      waarvoor teruggaaf wordt gevraagd;

      c. per soort minerale olie de totale hoeveelheid en het bedrag waarvoor teruggaaf wordt gevraagd; en

      d. de periode waarop het verzoek om teruggaaf betrekking heeft.

      2 Het verzoek om teruggaaf van accijns wordt ingediend uiterlijk drie maanden na afloop van het kalenderkwartaal
      waarin de desbetreffende afleveringen in de brandstoftanks van de luchtvaartuigen hebben plaatsgevonden.

      3 Het recht op teruggaaf van accijns wordt aangetoond aan de hand van de administratie van degene die verzoekt om
      teruggaaf van accijns, waartoe op de tankbonnen en facturen met betrekking tot minerale oliën waarvoor teruggaaf
      van accijns wordt gevraagd, per aflevering is vermeld:

      a. het registratienummer van het luchtvaartuig, in de brandstoftanks waarvan de minerale olie is afgeleverd;

      b. de datum waarop die aflevering heeft plaatsgevonden; en

      c. de soort en hoeveelheid minerale olie die is afgeleverd in de brandstoftanks van dat luchtvaartuig.

      4 De administratie van degene die verzoekt om teruggaaf van accijns is voorts zodanig ingericht dat daaruit
      per luchtvaartuig op overzichtelijke wijze blijkt dat de vlucht waarvoor de minerale olie is gebruikt waarvoor
      teruggaaf van accijns wordt gevraagd, geen plezierluchtvaart betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71d
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35f
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71d
  - number: 35g
    text: |-
      1 Indien een luchtvaartuig feitelijk ter beschikking staat van een ander dan degene op wiens naam het is
      geregistreerd, kan de inspecteur op verzoek de teruggaaf verlenen aan degene die feitelijk de beschikking over het
      luchtvaartuig heeft gehad, indien deze in zijn administratie een machtiging heeft opgenomen die is ondertekend door
      degene op wiens naam het luchtvaartuig is geregistreerd.

      2 De in het eerste lid bedoelde machtiging bevat de volgende gegevens:

      a. het registratienummer van het luchtvaartuig waarop de machtiging betrekking heeft;

      b. naam en adres van degene op wiens naam het luchtvaartuig is geregistreerd; en

      c. de periode of perioden waarin het luchtvaartuig feitelijk ter beschikking heeft gestaan.

      3 [Artikel 35f][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel35f
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel35g
    references:
