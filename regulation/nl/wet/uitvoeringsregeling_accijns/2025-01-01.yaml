    text: |-
      Strafbare feiten zijn:

      a. het niet voldoen aan de verplichtingen, bedoeld in [artikel 13, eerste en tweede lid][ref1];

      b. het overtreden van het in [artikel 48, vierde lid][ref2], bedoelde verbod;

      c. het niet voldoen aan een in [artikel 33, tweede, derde en vierde lid][ref3], [45][ref4] of [46][ref5] opgelegde
      verplichting.


