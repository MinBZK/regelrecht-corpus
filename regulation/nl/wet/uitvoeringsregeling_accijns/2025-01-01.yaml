        artikel: '48'
        hoofdstuk: V
        afdeling: '1'
  - number: '48'
    text: |-
      1 De inspecteur kan op verzoek van degene die de accijnszegels heeft aangevraagd, toestaan dat op de accijnszegel,
      in plaats van de naam van de aanvrager, een fabrieks- of handelsmerk of een door de directeur-generaal Douane,
      bedoeld in [artikel 4, tweede lid, van de Uitvoeringsregeling belastingdienst 2003][ref1], vastgesteld nummer wordt
      vermeld.

      2 De accijnszegels worden afgeleverd zonder vermelding van de naam, bedoeld in [artikel 44, tweede lid][ref2],
      of van het in het eerste lid bedoelde fabrieks- of handelsmerk of nummer. Eén van deze vermeldingen wordt door
      degene die de accijnszegels heeft aangevraagd op duidelijke en onuitwisbare wijze aangebracht op de plaats van de
      accijnszegel, bedoeld in artikel 44, tweede lid.

      3 Degene die de accijnszegels heeft aangevraagd kan een code aanbrengen, bestaande uit letters dan wel uit een
      nummer voorafgegaan door een letter. Deze code wordt boven de kleinhandelsprijs vermeld.

      4 Het is verboden om zonder toestemming van de inspecteur op de accijnszegels andere dan de in dit artikel
      voorgeschreven en toegestane vermeldingen aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel44
