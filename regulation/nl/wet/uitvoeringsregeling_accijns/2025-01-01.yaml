      Een op grond van [artikel 84 van de wet][ref1] gevorderd monster wordt:

      a. genomen onder toezicht van de inspecteur of een door hem aangewezen ambtenaar;

      b. zodanig verpakt, dat de identiteit van het monster is gewaarborgd; en

      c. onderzocht in of in opdracht van het Douane Laboratorium met gebruikmaking van internationaal erkende
