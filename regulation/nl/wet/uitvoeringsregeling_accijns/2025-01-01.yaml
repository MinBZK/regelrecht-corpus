  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:

        - *ARC:* de unieke administratieve referentiecode die door de inspecteur of de bevoegde autoriteiten van een
      lidstaat is toegekend aan het e-AD, bedoeld in artikel 20, derde lid, van de Richtlijn;
        - *besluit:* het [Uitvoeringsbesluit accijns][ref1];
        - *Richtlijn:* [Richtlijn 2020/262](32020L0262) van de Raad van 19 december 2019 houdende een algemene regeling
      inzake accijns (PbEU 2020, L 58);
        - *VARC:* de unieke vereenvoudigde administratieve referentiecode die door de inspecteur of de bevoegde
      autoriteiten van een lidstaat is toegekend aan het e-VAD, bedoeld in artikel 36, tweede lid, van de Richtlijn;
        - *wet:* de [Wet op de accijns][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005360
      [ref2]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005360
      - id: ref2
        bwb_id: BWBR0005251
  - number: '3'
    text: |-
      1 De vergunninghouder van een accijnsgoederenplaats doet van de algehele vernietiging of het onherstelbare algehele
      of gedeeltelijke verlies van accijnsgoederen door niet te voorziene omstandigheden of overmacht, bedoeld in
      [artikel 2, vijfde en zesde lid, van de wet][ref1], in zijn accijnsgoederenplaats onverwijld mededeling aan de
      inspecteur onder opgaaf van het tijdstip en de oorzaak van de algehele vernietiging of het onherstelbare algehele
      of gedeeltelijke verlies.

      2 De vergunninghouder van een accijnsgoederenplaats, de geregistreerde afzender of de geregistreerde geadresseerde
      doet van de algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies van accijnsgoederen door
      niet te voorziene omstandigheden of overmacht, bedoeld in [artikel 2, vijfde en zesde lid, van de wet][ref2],
      tijdens het overbrengen van onder een accijnsschorsingsregeling geplaatste accijnsgoederen onverwijld mededeling
      aan de inspecteur onder opgaaf van het tijdstip en de oorzaak van het verloren gaan.

      3 Van een voorgenomen vernietiging van in een accijnsgoederenplaats voorhanden of in opslag zijnde accijnsgoederen
      die onbruikbaar of onverkoopbaar zijn geworden, wordt uiterlijk twee werkdagen voor de voorgenomen vernietiging
      door de vergunninghouder van de accijnsgoederenplaats mededeling gedaan aan de inspecteur, onder vermelding van het
      tijdstip waarop de vernietiging zal plaatsvinden.

      4 De gecertificeerde afzender of de gecertificeerde geadresseerde doet van de algehele vernietiging of het
      onherstelbare algehele of gedeeltelijke verlies van reeds tot verbruik uitgeslagen accijnsgoederen door niet te
      voorziene omstandigheden of overmacht, bedoeld in [artikel 3 van de wet][ref3], tijdens het overbrengen onverwijld
      mededeling aan de inspecteur onder opgaaf van het tijdstip en de oorzaak van het verloren gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel3
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel3
