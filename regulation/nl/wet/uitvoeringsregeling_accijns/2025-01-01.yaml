  - number: '50'
    text: |-
      1 Als de vellen met accijnszegels niet aan de kwaliteitseisen voldoen of niet overeenkomen met de aangevraagde
      soorten accijnszegels of als er te veel dan wel te weinig accijnszegels zijn geleverd, wordt dit direct gemeld bij
      de zegelproducent en de inspecteur. In overleg met de inspecteur en de zegelproducent worden de accijnszegels die
      niet aan de kwaliteitseisen voldoen, niet overeenkomen met de aangevraagde soorten accijnszegels of die te veel
      zijn geleverd, door degene die de accijnszegels heeft aangevraagd teruggezonden naar de zegelproducent.

      2 Voor het terugzenden van de vellen met accijnszegels wordt gebruikgemaakt van een door de zegelproducent
      vastgesteld formulier in drievoud (exemplaar voor de aanvrager, exemplaar voor de inspecteur en een exemplaar voor
      de zegelproducent). Dit formulier bevat de volgende gegevens:

      a. naam, adres en plaats van de aanvrager;

      b. naam en telefoonnummer van de contactpersoon van de aanvrager;

      c. het oorspronkelijke unieke leveringsnummer van de zegelproducent;

      d. het doorlopende nummer van de aanvraag om accijnszegels;

      e. het aantal vellen onbedrukte blanco accijnszegels;

      f. het aantal bedrukte vellen met accijnszegels onderscheiden naar tariefcode en soort tabaksproduct; en

      g. per vel met bedrukte accijnszegels de hoeveelheid tabaksproduct (het aantal stuks of nettogewicht in grammen),
      de kleinhandelsprijs per accijnszegel en het bedrag van de totale kleinhandelsprijs;

      h. welke vervangende accijnszegels moeten worden geleverd.

      3 Het exemplaar voor de inspecteur van het formulier, bedoeld in het tweede lid, wordt door de aanvrager naar
      de inspecteur gezonden. De aanvrager en de zegelproducent nemen hun exemplaren van het formulier op in hun
      administratie.
    url: https://wetten.overheid.nl/BWBR0005355/2025-01-01#Artikel50
  - number: '51'
    text: |-
      1 Op verzoek van degene die de accijnszegels heeft aangevraagd kunnen de volgende accijnszegels of vellen met
      accijnszegels onder ambtelijk toezicht in Nederland worden vernietigd:

      a. de onbeschadigde accijnszegels of vellen met accijnszegels waarop een oude tariefcode is vermeld;

      b. de onbeschadigde bedrukte accijnszegels die niet meer bruikbaar zijn;

      c. de beschadigde vellen met accijnszegels;

      d. de beschadigde of onbeschadigde losse accijnszegels;

      e. de beschadigde aangesneden vellen met accijnszegels; en

      f. accijnszegels of vellen accijnszegels, waarop niet de juiste gegevens, bedoeld in
      [artikel 48, tweede en derde lid][ref1], en [artikel 49, eerste lid][ref2], zijn gedrukt.

      2 Een verzoek om vernietiging van accijnszegels onder ambtelijk toezicht kan plaatsvinden met een formulier dat van
      rijkswege verkrijgbaar is gesteld.

      3 Als de accijnszegels, bedoeld in het eerste lid, in een andere lidstaat worden vernietigd, gebeurt dat
      onder ambtelijk toezicht en wordt dit aan de hand van een ambtelijke verklaring van de (douane)autoriteiten
      in die lidstaat aangetoond. De verklaring bevat dezelfde gegevens als de gegevens, genoemd in het in het
      tweede lid bedoelde formulier. Degene die de accijnszegels heeft aangevraagd neemt de verklaring op in zijn
      zegeladministratie.

      4 De accijnszegels met een oude tariefcode moeten uiterlijk de laatste dag van de maand waarin het nieuwe
      accijnstarief van toepassing is geworden worden vernietigd.

      5 Als tabaksproducten waarop accijnszegels zijn aangebracht in overeenstemming met [artikel 3, derde lid][ref3],
      in een accijnsgoederenplaats onder ambtelijk toezicht worden vernietigd, neemt degene die de accijnszegels
      heeft aangevraagd een afschrift van de mededeling tot vernietiging met een specificatie van de soort vernietigde
      accijnszegels op in zijn zegeladministratie.

      6 Als tabaksproducten waarop de accijnszegels in een andere lidstaat zijn aangebracht en die zich aldaar onder een
      accijnsschorsingsregeling bevinden op verzoek worden vernietigd, gebeurt dat onder ambtelijk toezicht en wordt dit
      aan de hand van een ambtelijke verklaring van (douane)autoriteiten van die lidstaat aangetoond. De verklaring bevat
      dezelfde gegevens als de gegevens die zijn genoemd in de mededeling tot vernietiging en de specificatie, bedoeld in
      het vijfde lid. Degene die de accijnszegels heeft aangevraagd neemt de verklaring op in zijn zegeladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0005355#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005355#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005355#Artikel3
