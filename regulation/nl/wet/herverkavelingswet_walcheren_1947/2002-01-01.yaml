---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: herverkavelingswet_walcheren_1947
regulatory_layer: WET
publication_date: '2008-04-08'
valid_from: '2002-01-01'
bwb_id: BWBR0002034
url: https://wetten.overheid.nl/BWBR0002034/2002-01-01
preamble:
  text: |-
    In naam van Hare Majesteit Wilhelmina, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau,
    enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot de agrarische
    wederopbouw en de noodzakelijk gebleken herverkaveling van Walcheren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.1°
    text: '"De Minister": De met de zaken van de Landbouw belaste Minister;'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.2°
    text: '"blok": geheel van in de herverkaveling van Walcheren begrepen onroerende goederen;'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.3°
    text: |-
      "eigenaar": hem, die een recht van eigendom, opstal, erfpacht, vruchtgebruik, gebruik of bewoning heeft op tot het
      blok behorende onroerende goederen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.4°
    text: |-
      "rechthebbende": eigenaar, en hem, die een niet onder 3°. genoemd zakelijk recht of een recht van huur of pacht
      heeft op tot het blok behorende onroerende goederen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.5°
    text: '"herverkavelingscommissie": de met de leiding en uitvoering der herverkaveling van Walcheren belaste commissie;'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.6°
    text: |-
      "Raad van Beroep": de raad, welke in beroep oordeelt over de bezwaarschriften in de gevallen, waarin deze wet het
      indienen van zodanige bezwaren bij die raad toelaat;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: 1.7°
    text: '"Gedeputeerde Staten": Gedeputeerde Staten van Zeeland.'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Ter bevordering van het herstel van land-, tuin-, bosbouw en veehouderij op het eiland Walcheren heeft aldaar
      herverkaveling plaats. De Minister stelt het blok vast bij beschikking, die in de *Nederlandse Staatscourant* wordt
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      In het blok worden niet opgenomen begraafplaatsen, gesloten begraafplaatsen binnen dertig jaren na de sluiting
      en graven of grafkelders, als bedoeld in de artikelen 2 en 15 der wet van 10 April 1869 (Staatsblad n°. 65) tot
      vaststelling van bepalingen betrekkelijk tot het begraven van lijken, de begraafplaatsen en de begrafenisregten,
      zoals deze wet sedert dien is gewijzigd, binnen de termijnen, genoemd in de artikelen 23 en 25 dier wet.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Gebieden, waarvoor een wederopbouwplan bestaat, worden niet in het blok opgenomen, dan met goedkeuring van de
      Minister van Wederopbouw en Volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel3
  - number: '4'
    text: |-
      In de eigendoms- of gebruikstoestand van onroerende goederen, welke bestemd zijn voor militaire doeleinden, wordt
      geen wijziging gebracht zonder toestemming van de Ministers van Oorlog en van Marine.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Iedere eigenaar heeft recht op het in eigendom, opstal, erfpacht, vruchtgebruik, gebruik of bewoning verkrijgen
      van een waarde in kavels, welke tot het geheel der waarde van alle kavels staat als de waarde van zijn, in het blok
      opgenomen onroerende goederen, tot het geheel der waarde van alle opgenomen onroerende goederen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onder waarde wordt in dit artikel verstaan, de schattingswaarde, zoals deze voor elk onroerend goed vaststaat of,
      in geval het [derde lid van artikel 32][ref1] toepassing heeft gevonden, door de rechter-commissaris voorlopig
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel32
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '32'
  - number: '5.3'
    text: |-
      Van het bepaalde in het eerste lid kan slechts worden afgeweken, indien het de totstandkoming ener behoorlijke
      herverkaveling in de weg zou staan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel5
  - number: '5.4'
    text: |-
      Tegen de wil van de eigenaar of van degene, die op het onroerend goed een recht van hypotheek of van grondrente
      heeft, mag deze afwijking niet meer bedragen dan vijf ten honderd van de waarde van het onroerend goed, op het
      verkrijgen waarvan de eigenaar, ingevolge het eerste lid, recht heeft.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel5
  - number: '5.5'
    text: |-
      De herverkavelingscommissie is bevoegd te bepalen, dat een eigenaar, in afwijking van het bepaalde in het eerste
      tot en met het vierde lid, geen recht heeft op het verkrijgen van een waarde in kavels en dat algehele vergoeding
      in geld door het Rijk, overeenkomstig het bepaalde in [artikel 6][ref1], zal plaats vinden, wanneer de waarde van
      de van hem in het blok opgenomen onroerende goederen zo gering is, dat de toepassing van het eerste tot en met het
      vierde lid zou leiden tot de vorming van een niet behoorlijk te exploiteren kavel en hij geacht kan worden geen
      redelijk belang bij het verkrijgen van een zodanige kavel te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel6
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '6'
  - number: '6.1'
    text: |-
      Het nadelig of voordelig verschil tussen de waarde der van de eigenaar in het blok opgenomen onroerende goederen,
      zoals deze uiteindelijk is vastgesteld en de waarde van de hem toebedeelde onroerende goederen, zoals deze na
      herschatting uiteindelijk is vastgesteld, wordt door het Rijk aan de eigenaar, onderscheidenlijk door de eigenaar
      aan het Rijk, in geld vergoed.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien niet bekend is aan wie een geldelijke vergoeding, als bedoeld in het eerste lid, zou moeten worden gegeven,
      wordt het bedrag in consignatie in 's Rijks kas gestort.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd het bepaalde bij of krachtens enige andere wettelijke regeling heeft een overeenkomst, aangegaan in
      het tijdvak vanaf de inwerkingtreding dezer wet tot aan de overschrijving van de acte van toedeling in de openbare
      registers en waarbij onder bezwarende titel of bij schenking onder de levenden:
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel7
  - number: 7.a
    text: in het blok opgenomen onroerende goederen worden overgedragen of
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel7
  - number: 7.b
    text: |-
      een recht van erfpacht, opstal, vruchtgebruik, gebruik of bewoning op zodanige goederen wordt gevestigd of
      gewijzigd, of waarbij een zodanig recht wordt overgedragen,
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Aan de Staat kunnen kavels worden toebedeeld; deze worden beheerd door de Minister. Overdracht van het beheer
      geschiedt door Ons op voordracht van de Minister.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel8
  - number: '9'
    text: 'Tenzij het belang der herverkaveling het vordert, wordt geen wijziging gebracht in de eigenaarsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel9
  - number: 9.1°
    text: parken;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel9
  - number: 9.2°
    text: gedenktekenen met bijbehorende terreinen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel9
  - number: 9.3°
    text: |-
      onroerende goederen van rechtspersonen, die bevordering van natuurschoon ten doel hebben, indien en zolang zij als
      zodanig door Ons zijn erkend;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel9
  - number: 9.4°
    text: onroerende goederen, bestemd voor andere bedrijven dan land-, tuin-, bosbouw, veehouderij, jacht of visserij.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel9
  - number: '10'
    text: 'Elke kavel moet zó worden gevormd, dat hij:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel10
  - number: 10.1°
    text: uitweg heeft op een openbare land- of waterweg en zo mogelijk daaraan belendt;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel10
  - number: 10.2°
    text: zo nodig en mogelijk de gelegenheid tot behoorlijke afwatering heeft.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      De eigendom van de openbare wegen en waterlopen met de daartoe behorende kunstwerken in het blok behoort aan een
      door Gedeputeerde Staten aangewezen publiekrechtelijk lichaam.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Gedeputeerde Staten regelen het beheer en het onderhoud van de openbare wegen, waterlopen en kaden met de daartoe
      behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel11
  - number: '11.3'
    text: De toewijzing van de eigendom, het beheer en het onderhoud geschiedt zonder geldelijke verrekening.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      De zakelijke rechten, het recht van huur en van pacht en de lasten, welke op de onroerende goederen rusten,
      worden geregeld of opgeheven onder regeling van de geldelijke gevolgen daarvan; tiendrenten en jachtrenten worden
      afgekocht overeenkomstig de daaromtrent geldende wettelijke bepalingen. Van een regeling en van het opheffen van
      een recht van pacht wordt door de herverkavelingscommissie mededeling gedaan aan de Grondkamer.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      De hypotheken gaan met behoud van haar rang over op de kavels of gedeelten van kavels, welke in de
      plaats van het onroerend goed, waarop zij rusten, worden toegedeeld. In geval van toepassing van het
      [vijfde lid van artikel 5][ref1], wordt het bedrag der algehele vergoeding in geld door de herverkavelingscommissie
      besteed voor het aflossen van de schuldvorderingen van hypotheekhouders, die zulks wensen, onverschillig of deze
      schuldvorderingen al dan niet opeisbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel5
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '5'
  - number: '12.3'
    text: |-
      Conservatoire en executoriale beslagen gaan over op de kavels of gedeelten van kavels, welke in de plaats van het
      onroerend goed, waarop zij gelegd zijn, worden toegedeeld, alsmede op de geldsommen, welke in de plaats van kavels
      of ter zake van ondertoedeling worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Pachtovereenkomsten en overeenkomsten tot wijziging, aanvulling of verlenging van een pachtovereenkomst, aangegaan
      in het tijdvak vanaf de inwerkingtreding dezer wet tot aan de overschrijving van de acte van toedeling in de
      openbare registers ten aanzien van de in het blok opgenomen onroerende goederen, hebben onverminderd het bepaalde
      bij of krachtens enige andere wettelijke regeling, geen rechtskracht zonder schriftelijke verklaring van de
      herverkavelingscommissie, waaruit blijkt, dat de overeenkomst niet in strijd is met een behoorlijke uitvoering
      der herverkaveling.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      In het belang der herverkaveling kan door de herverkavelingscommissie een recht van pacht worden gevestigd; de
      aldus gevestigde verbintenis heeft dezelfde kracht als een tussen partijen gesloten en overeenkomstig de wet
      goedgekeurde pachtovereenkomst. Alvorens een recht van pacht te vestigen, pleegt de herverkavelingscommissie
      overleg met de Grondkamer in zake de pachtvoorwaarden; zo mogelijk vindt overleg plaats met de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Toepassing van het eerste lid mag niet ten gevolge hebben, dat daardoor de exploitatie van enig bedrijf ernstig
      zou worden bemoeilijkt, tenzij het betreft een bedrijf ten aanzien waarvan een aantekening, als bedoeld in
      [artikel 47, onder ][ref1] op de lijst van de in het blok gelegen bedrijven is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '47'
  - number: '14.3'
    text: |-
      Indien de eigenaar ten gevolge van de toepassing van het eerste lid schade lijdt, wordt deze door het Rijk aan de
      eigenaar vergoed.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Er is een Herverkavelingscommissie, bestaande uit ten hoogste vijftien leden, die door Ons worden benoemd en
      ontslagen. Er kunnen plaatsvervangende leden worden benoemd. Zij kan zich door deskundigen doen bijstaan; de
      Minister stelt voor haar een instructie vast.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Er is een Raad van Beroep, bestaande uit ten hoogste vijf leden, die door Ons worden benoemd. Er kunnen
      plaatsvervangende leden worden benoemd. Zij zijn onafzetbaar gedurende de werkingsduur van deze wet, behoudens in
      de gevallen, bedoeld in [artikel 11, onder 1°., 2°., en 3°. van de Wet op de Rechterlijke Organisatie ][ref1](Wet
      van 18 April 1827, *Staatsblad* no. 20). De ontzetting wordt uitgesproken op de wijze, in
      [artikel 11 van de Wet op de Rechterlijke Organisatie][ref2] bepaald. De derde tot en met achtste alinea van dat
      artikel, alsmede [artikel 13 van de Wet op de Rechterlijke Organisatie][ref3] zijn ten aanzien van de leden van de
      Raad van Beroep van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '13'
  - number: '15.3'
    text: |-
      De Raad van Beroep kan getuigen en deskundigen horen. De oproeping geschiedt bij aangetekende brief. Getuigen en
      deskundigen zijn na oproeping verplicht te verschijnen en de gevraagde inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: '15.4'
    text: 'Wij behouden Ons voor regelen te stellen betreffende:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: 15.4.a
    text: het toekennen van een vergoeding aan de leden van de Raad van Beroep;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: 15.4.b
    text: het toekennen van schadevergoeding aan de getuigen en deskundigen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: 15.4.c
    text: het vaststellen van een tarief voor de werkzaamheden van de Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      Van de benoeming der herverkavelingscommissie en van de Raad van Beroep wordt door de Minister bericht gezonden aan
      Gedeputeerde Staten en aan de Arrondissementsrechtbank te Middelburg. De toezending gaat vergezeld van een kaart,
      waarop het te verkavelen gebied is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Zo spoedig mogelijk, in elk geval binnen dertig dagen na ontvangst van dit bericht, benoemt de rechtbank een
      rechtercommissaris en doet zij hiervan mededeling aan Gedeputeerde Staten, aan de herverkavelingscommissie en aan
      de Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het is aan eigenaren en gebruiksgerechtigden van tot het blok behorende onroerende goederen verboden handelingen
      te verrichten, waardoor de waarde van hun onroerende goederen zou verminderen, tenzij hun daartoe door de
      herverkavelingscommissie vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel17
  - number: '17.2'
    text: Overtreding van het bepaalde in het vorige lid wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel17
  - number: '17.3'
    text: Het strafbare feit wordt als een overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel17
  - number: '17.4'
    text: |-
      Waardeverminderingen, die het gevolg zijn van handelingen, bedoeld in het eerste lid van dit artikel, komen, voor
      de toepassing van de [artikelen 5][ref1] en [6][ref2], ten laste van de eigenaren. De herverkavelingscommissie
      houdt hiermede rekening bij het opmaken van het plan van toedeling en van de lijst van geldelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel6
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '6'
  - number: '18.1'
    text: |-
      Wanneer de herverkavelingscommissie het ten behoeve van de herverkaveling nodig acht, dat iemands grond wordt
      betreden of daarop gravingen of opmetingen worden verricht of tekens gesteld, moeten zowel de eigenaren als de
      gebruikers van die grond dit gedogen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien het verrichten van de in het vorige lid bedoelde handelingen niet wordt gedoogd, wordt de tussenkomst
      ingeroepen van de burgemeester of kantonrechter, op wiens bevel het verrichten der handelingen, desnoods met behulp
      van de sterke arm, wordt mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel18
  - number: '18.3'
    text: De schade, welke uit de toepassing van het eerste lid mocht voortvloeien, wordt door het Rijk vergoed.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Indien toepassing van deze wet tengevolge zou hebben, dat een eigenaar reeds ontvangen of reeds toegezegde
      vergoeding voor geleden materiële oorlogsschade nogmaals geheel of gedeeltelijk zou ontvangen, vindt hiervoor
      verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel19
  - number: '20'
    text: |-
      De herverkavelingscommissie stelt een zo volledig mogelijke lijst samen van alle rechthebbenden met vermelding van
      de aard en de omvang van ieders recht.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      De herverkavelingscommissie benoemt een aantal schatters, die onder haar leiding de in het blok gelegen onroerende
      goederen schatten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel21
  - number: '21.2'
    text: De herverkavelingscommissie verdeelt het werk der schatters; deze treden steeds in oneven getale op.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      De herverkavelingscommissie ontwerpt een stelsel van classificatie van de grond en bepaalt van elke klasse de
      waarde per ha. Zij maakt van deze verrichtingen een proces-verbaal van classificatie op.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel22
  - number: '22.2'
    text: De schatters delen de grond aan de hand van het proces-verbaal van classificatie in klassen in.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de gronden schade hebben geleden ten gevolge van bezettings- of oorlogshandelingen, geschiedt de schatting
      naar de toestand, waarin deze gronden zich bevonden, voordat zij hierdoor werden getroffen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      De door de herverkavelingscommissie samengestelde lijst van rechthebbenden, een register van de uitkomsten der
      schattingen en een kaart waarop de klasse-grenzen staan aangegeven, worden door de herverkavelingscommissie ter
      kosteloze inzage van een ieder neergelegd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Van de nederlegging geschiedt openbare kennisgeving in ten minste twee nieuwsbladen en in de gemeenten op de aldaar
      gebruikelijke wijze, alsmede bij bijzondere kennisgeving bij aangetekende brief aan de bekende rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel23
  - number: '23.3'
    text: Op het niet ontvangen van de kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel23
  - number: '23.4'
    text: De lijst van rechthebbenden wordt in haar geheel of in uittreksel tegen betaling der kosten verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel23
  - number: '24.1'
    text: |-
      Binnen dertig dagen na de verzending van de bijzondere kennisgeving, in [artikel 23][ref1] bedoeld, kan iedere
      belanghebbende schriftelijk zijn bezwaren tegen de toekenning en omschrijving van rechten op de lijst van
      rechthebbenden en tegen de schattingen bij de herverkavelingscommissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel23
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '23'
  - number: '24.2'
    text: Deze bevoegdheid wordt met aanwijzing van de dag der verzending in de kennisgevingen vermeld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel24
  - number: '24.3'
    text: |-
      Na afloop van de in het eerste lid bepaalde termijn kunnen slechts zij als rechthebbenden worden erkend, die
      voorkomen op de lijst van rechthebbenden of tegen de daarop voorkomende toekenning of omschrijving van rechten
      bezwaren hebben ingediend, benevens hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel24
  - number: '25'
    text: |-
      Voor zover daartegen binnen de termijn en op de wijze, in het vorige artikel bepaald, geen bezwaren zijn ingediend,
      staan de rechten, zoals zij op de lijst van rechthebbenden zijn omschreven en toegekend, en de uitkomsten van de
      schattingen vast. Daarvan wordt door de herverkavelingscommissie proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      De herverkavelingscommissie onderzoekt de tijdig ingediende bezwaren en tracht daaromtrent met belanghebbenden
      overeenstemming te bereiken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel26
  - number: '26.2'
    text: Indien overeenstemming is verkregen, vinden de bepalingen van het vorige artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel26
  - number: '27'
    text: |-
      Indien geen overeenstemming is verkregen, wordt door de herverkavelingscommissie een proces-verbaal opgemaakt van
      het omtrent de ingebrachte bezwaren verhandelde.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel27
  - number: '28'
    text: |-
      De herverkavelingscommissie zendt zo spoedig mogelijk een afschrift van de lijst van rechthebbenden en van de in de
      [artikelen 25][ref1], [26][ref2] of [27][ref3] bedoelde processen-verbaal aan de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel27
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '27'
  - number: '29.1'
    text: |-
      Indien binnen de termijn en op de wijze, in [artikel 24][ref1] bepaald, bezwaren zijn ingediend en hieromtrent niet
      overeenkomstig [artikel 26][ref2] overeenstemming is bereikt, bepaalt de rechter-commissaris terstond na ontvangst
      van de in het vorige artikel bedoelde stukken tijd en plaats der bijeenkomst, waarop de belanghebbenden bij deze
      bezwaren of hun schriftelijk gemachtigden voor hem kunnen verschijnen, ten einde voor zover nog nodig, te geraken
      tot toekenning en vaststelling van rechten en tot vaststelling van de uitkomst der schattingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel26
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '26'
  - number: '29.2'
    text: Hij doet hiervan mededeling aan de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      De bekende belanghebbenden bij de in het eerste lid bedoelde bezwaren, die op de lijst van rechthebbenden zijn
      geplaatst of binnen de termijn en op de wijze, in [artikel 24][ref1] bepaald, bezwaren hebben ingediend, worden bij
      aangetekende brief opgeroepen om in persoon of bij schriftelijk gemachtigde de bijeenkomst bij te wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel24
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '24'
  - number: '29.4'
    text: Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
  - number: '29.5'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg, door de wet aan het niet bijwonen der bijeenkomst en
      het vaststellen van de lijst van rechthebbenden verbonden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
  - number: '29.6'
    text: De bijeenkomst wordt niet gehouden, dan nadat ten minste veertien dagen na de oproeping zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel29
  - number: '30.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de Griffier der Arrondissements-Rechtbank.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      De bijeenkomst wordt bijgewoond door één of meer leden der herkavelingscommissie met zo nodig één of meer
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '30.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen verdaagt de rechter-commissaris de bijeenkomst tot een
      andere dag zonder nadere oproeping.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '30.4'
    text: |-
      In de bijeenkomst worden eerst de toekenning en de vaststelling van de rechten en daarna de schattingen behandeld.
      Van het verhandelde omtrent elk onderwerp wordt een afzonderlijk proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '30.5'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde op de bijeenkomst aanwezig zijn, wanneer hun bezwaren
      worden behandeld, worden geacht die bezwaren te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '30.6'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet verschijnen op de bijeenkomst verkaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel30
  - number: '31.1'
    text: Voorzover omtrent de toekenning, de aard en de omvang der rechten overeenstemming is verkregen, staan deze vast.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel31
  - number: '31.2'
    text: |-
      Partijen, tussen wie geen overeenstemming is verkregen, worden, voorzover hun geschil niet reeds aanhangig is, door
      de rechter-commissaris naar een door hem te bepalen zitting van de rechtbank verwezen. Deze verwijzing vervangt
      de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel31
  - number: '32.1'
    text: Voorzover overeenstemming wordt verkregen omtrent de schattingen staan deze vast.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel32
  - number: '32.2'
    text: |-
      Indien geschil blijft bestaan, verwijst de rechter-commissaris de zaak naar een nader te bepalen zitting van de
      rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het staat de rechter-commissaris vrij de uitkomsten der schattingen, waaromtrent geen overeenstemming is verkregen,
      voorlopig vast te stellen, indien de herverkavelingscommissie hem zulks met het oog op een vlot verloop van de
      herverkaveling verzoekt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel32
  - number: '33'
    text: |-
      De rechtbank behandelt zaken betreffende de toekenning en de vaststelling van de rechten vóór elke andere, met
      uitzondering van die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel33
  - number: '34.1'
    text: |-
      Ten dage dienende geven zij, tussen wie geschil bestaat over de rechten betreffende in het blok gelegen percelen
      de gronden hunner beweringen en de middelen tot staving daarvan op bij conclusie, door een procureur getekend.
      Afschrift der conclusie wordt ter terechtzitting aan de procureur der weder-partij overgegeven.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel34
  - number: '34.2'
    text: |-
      Op een uiterlijk veertien dagen hierna te stellen door de rechtbank te bepalen dag kunnen partijen haar conclusiën
      bij pleidooi door een advocaat mondeling doen toelichten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel34
  - number: '35.1'
    text: |-
      Uiterlijk een maand na de dienende dag of, indien een dag voor pleidooi werd vastgesteld, na de daarvoor bepaalde
      dag, doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel35
  - number: '35.2'
    text: Tegen uitspraak is geen verzet nog enige andere voorziening dan die in cassatie toegelaten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel35
  - number: '36.1'
    text: De cassatie wordt ingesteld binnen een maand, te rekenen van de dag, waarop het vonnis is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.2'
    text: Zij geschiedt door een verklaring ter griffie der rechtbank, die het vonnis heeft gewezen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.3'
    text: |-
      Deze verklaring wordt binnen veertien dagen met een ontwikkeling van de gronden der cassatie aan de tegenpartij
      betekend en gaat vergezeld van dagvaarding tegen de eerstvolgende, voor de behandeling van burgerlijke zaken
      bestemde, terechtzitting na de in het volgende lid bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.4'
    text: De tegenpartij is bevoegd om uiterlijk binnen veertien dagen te antwoorden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.5'
    text: |-
      In de genoemde terechtzitting nemen de partijen haar conclusiën desverkiezende bij pleidooi mits in dezelfde
      terechtzitting, nader te ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.6'
    text: Het Openbaar Ministerie neemt zijn conclusie uiterlijk veertien dagen na de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '36.7'
    text: Uiterlijk zes weken na de terechtzitting doet de Hooge Raad uitspraak.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel36
  - number: '37'
    text: |-
      Zodra omtrent alle geschillen over de rechten betreffende de tot het blok behorende onroerende goederen
      onherroepelijk is beslist, wordt de lijst van rechthebbenden door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      Nadat alle rechten betreffende bij de herverkaveling betrokken percelen vaststaan, worden zij, met wie geen
      overeenstemming omtrent de schattingen is verkregen, alsmede de herverkavelingscommissie opgeroepen om te
      verschijnen op een bepaalde zitting van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel38
  - number: '38.2'
    text: |-
      De rechtbank behandelt de zaken betreffende de schattingen vóór elke andere, met uitzondering van die betreffende
      onteigening.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      Ten dage dienende lichten zij, met wie geen overeenstemming is verkregen, hun standpunt, hetzij in persoon, hetzij
      bij schriftelijk gemachtigde, mondeling toe.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel39
  - number: '39.2'
    text: De rechtbank hoort de vertegenwoordigers van de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel39
  - number: '39.3'
    text: Uiterlijk een maand na het in het tweede lid genoemde verhoor doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel39
  - number: '39.4'
    text: |-
      Indien deze uitspraak van invloed is op de uitkomsten van andere schattingen, is zij bevoegd hierin wijziging aan
      te brengen. Zij doet dit niet alvorens belanghebbenden te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel39
  - number: '39.5'
    text: Het register van de uitkomsten der schattingen wordt door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel39
  - number: '40'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet noch ook enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hooge Raad om zich, in het belang der wet, in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel40
  - number: '41'
    text: |-
      De kosten van het geding betreffende de schattingen komen ten laste van de belanghebbende met wie geen
      overeenstemming is verkregen, indien deze in het ongelijk is gesteld, ten laste van het Rijk, indien hij in het
      gelijk wordt gesteld. Indien de rechter daartoe termen vindt in de omstandigheden van het geding, kan hij de kosten
      geheel of voor een deel compenseren.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel41
  - number: '42'
    text: |-
      Zoodra de lijst van rechthebbenden en het register van de uitkomsten der schattingen zijn gesloten, geeft de
      rechter-commissaris hiervan kennis aan de herverkavelingscommissie; hij zendt een afschrift van de lijst van
      rechthebbenden aan deze commissie en aan de hypotheekbewaarder, wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel42
  - number: '43.1'
    text: |-
      De herverkavelingscommissie maakt door openbare kennisgeving in ten minste twee nieuwsbladen en in de gemeenten
      op de aldaar gebruikelijke wijze bekend, tegen welke voorwaarden en in welke gebieden, gebruikers van in het blok
      gelegen gronden door de Staat in de gelegenheid kunnen worden gesteld om buiten het blok grond te pachten en roept
      tevens de gegadigden daartoe op.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel43
  - number: '43.2'
    text: |-
      De grondgebruikers, die aan deze oproep gehoor geven en naar het oordeel van de herverkavelingscommissie in
      aanmerking komen om buiten het blok grond te pachten en met wie de herverkavelingscommissie tot overeenstemming
      komt, tekenen een verklaring, dat zij de hun in eigendom toebehorende percelen of de kavels, die daarvoor in de
      plaats treden, zullen verpachten, of, dat het recht van pacht op de tot dusver door hen gepachte percelen wordt
      beëindigd en dat te hunnen behoeve geen nieuw recht van pacht op in het blok gelegen kavels zal worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel43
  - number: '43.3'
    text: |-
      Voor het vaststellen van tijdstip en inhoud van de openbare kennisgeving bedoeld in het eerste lid, alsmede voor
      het sluiten van overeenkomsten als bedoeld in het tweede lid, behoeft de herverkavelingscommissie de voorafgaande
      goedkeuring van de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel43
  - number: '44.1'
    text: |-
      De ondertekening der verklaring heeft tengevolge: ten aanzien van de eigenaar: dat hij verplicht is, met
      inachtneming van het bepaalde in [artikel 13][ref1], met ingang van een door de herverkavelingscommissie te bepalen
      dag de onroerende goederen, waarop hij tot dusver zijn bedrijf uitoefende, of de kavels, welke daarvoor in de
      plaats treden, te verpachten; ten aanzien van de pachter: dat zijn pachtovereenkomst eindigt met ingang van een
      door de herverkavelingscommissie te bepalen dag en dat hij geen recht heeft op het in pacht verkrijgen van een of
      meer in het blok gelegen kavels.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel13
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '13'
  - number: '44.2'
    text: |-
      De grondgebruikers, die deze verklaring getekend hebben, worden door de Staat, overeenkomstig het bepaalde in het
      [eerste lid van artikel 43][ref1], in de gelegenheid gesteld buiten het blok grond te pachten.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel43
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '43'
  - number: '44.3'
    text: |-
      De herverkavelingscommissie doet aan de verpachter bij aangetekende brief onverwijld mededeling van de
      ondertekening van de verklaring door de pachter. Op het niet ontvangen van de mededeling kan geen beroep worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel44
  - number: '45.1'
    text: |-
      De herverkavelingscommissie onderzoekt of op de wijze, aangegeven in de [artikelen 43][ref1] en [44][ref2],
      voldoende grond ter beschikking komt om aan de overige rechthebbenden voorzover zij een bedrijf uitoefenen, met
      inachtneming van het bepaalde in de [artikelen 5][ref3], [12][ref4], [13][ref5] en [14][ref6], het gebruik van
      kavels tot een zodanige oppervlakte toe te kennen, dat daarop levensvatbare bedrijven kunnen worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002034#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0002034#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0002034#Artikel14
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002034
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0002034
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0002034
        artikel: '14'
  - number: '45.2'
    text: |-
      Indien zulks niet het geval is, stelt de herverkavelingscommissie een zo volledig mogelijke lijst samen van de in
      het blok gelegen bedrijven, waaronder in deze titel worden verstaan: landbouw-, veeteelt- en tuinbouwbedrijven.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel45
  - number: '46.1'
    text: 'Alsdan kan de herverkavelingscommissie bepalen, dat met ingang van een bepaalde dag:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: 46.1.a
    text: |-
      een pachtovereenkomst eindigt en de pachter geen recht heeft op het in pacht verkrijgen van één of meer in het blok
      gelegen kavels;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: 46.1.b
    text: |-
      de eigenaar-grondgebruiker verplicht is de onroerende goederen, waarop hij tot dusver zijn bedrijf uitoefende, of
      de kavels, die daarvoor in de plaats treden, te verpachten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: '46.2'
    text: |-
      Een bepaling als bedoeld onder *b* van het vorige lid komt bij voorkeur eerst in aanmerking, indien het gestelde in
      de aanhef van het [ tweede lid van artikel 45][ref1] zich nog voordoet, nadat het bepaalde onder *a* van het vorige
      lid zoveel mogelijk is toegepast. Een bepaling als bedoeld onder *b* van het vorige lid komt bij voorkeur niet in
      aanmerking ten aanzien van de eigenaar-grondgebruiker, die zijn hoofdberoep in de landbouw heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel45
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '45'
  - number: '46.3'
    text: |-
      De eigenaar-grondgebruiker en de pachters, bedoeld in het eerste lid, worden door het Rijk schadeloos gesteld.
      Zoveel mogelijk vindt de schadeloosstelling plaats bij minnelijk overleg, desgewenst door hen in de gelegenheid te
      stellen buiten het blok grond te pachten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: '46.4'
    text: |-
      Bij toepassing van het bepaalde in het eerste lid, onder *a*, doet de herverkavelingscommissie hiervan onverwijld
      bij aangetekende brief mededeling aan de verpachter. Op het niet ontvangen van de mededeling kan geen beroep worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: '46.5'
    text: |-
      Voor het nemen van een besluit als bedoeld in het eerste lid behoeft de herverkavelingscommissie de voorafgaande
      goedkeuring van de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel46
  - number: '47'
    text: 'De herverkavelingscommissie tekent op de lijst van de in het blok gelegen bedrijven aan:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel47
  - number: 47.a
    text: |-
      ten aanzien van welke percelen een verklaring, als bedoeld in [artikel 43][ref1], getekend is;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel43
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '43'
  - number: 47.b
    text: |-
      welke percelen de eigenaar verplicht is te verpachten en ten aanzien van welke percelen een pachtovereenkomst zal
      eindigen, overeenkomstig het bepaalde in [artikel 46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel46
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '46'
  - number: 47.c
    text: |-
      voorzover dit niet bij minnelijk overleg is vastgesteld, de schadevergoeding, bedoeld in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel46
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '46'
  - number: '48.1'
    text: |-
      De herverkavelingscommissie legt de lijst van de in het blok gelegen bedrijven, met de daarop ingevolge het
      bepaalde in [artikel 47][ref1] gestelde aantekeningen, neer ter kosteloze inzage van een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '47'
  - number: '48.2'
    text: |-
      Van de nederlegging geschiedt openbare en bijzondere kennisgeving op de wijze in het
      [tweede lid van artikel 23][ref1] aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel23
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '23'
  - number: '48.3'
    text: Op het niet ontvangen van de kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel48
  - number: '48.4'
    text: |-
      De lijst van de in het blok gelegen bedrijven, met de daarop gestelde aantekeningen, wordt in haar geheel of in
      uittreksel tegen betaling der kosten beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel48
  - number: '49.1'
    text: |-
      Binnen dertig dagen na de verzending van de bijzondere kennisgeving, in [artikel 48][ref1] bedoeld, kan ieder
      belanghebbende zijn bezwaren tegen de aantekeningen, gesteld op de lijst van de in het blok gelegen bedrijven,
      schriftelijk bij de herverkavelingscommissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel48
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '48'
  - number: '49.2'
    text: Deze bevoegdheid wordt met aanwijzing van de dag der verzending in de kennisgeving vermeld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel49
  - number: '50'
    text: |-
      Voorzover binnen de termijn en op de wijze in [artikel 49][ref1] vermeld geen bezwaren zijn ingediend, staan de
      aantekeningen vast. Daarvan wordt door de herverkavelingscommissie proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel49
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '49'
  - number: '51.1'
    text: |-
      De herverkavelingscommissie onderzoekt de tijdig ingediende bezwaren en tracht daaromtrent overeenstemming te
      bereiken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel51
  - number: '51.2'
    text: Indien overeenstemming is verkregen, vinden de bepalingen van het vorige artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel51
  - number: '52'
    text: |-
      Indien geen overeenstemming is verkregen, wordt door de herverkavelingscommissie proces-verbaal opgemaakt van het
      omtrent de ingebrachte bezwaren verhandelde.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel52
  - number: '53'
    text: |-
      De herverkavelingscommissie zendt zo spoedig mogelijk een afschrift van de lijst van de in het blok gelegen
      bedrijven met de daarop gestelde aantekeningen en van de in de [artikelen 50][ref1], [51][ref2] en [52][ref3]
      bedoelde processen-verbaal aan de Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel52
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '52'
  - number: '54'
    text: |-
      De behandeling van de bezwaren tegen de aantekeningen, gesteld op de lijst van de in het blok gelegen bedrijven,
      welke ingevolge het bepaalde in [artikel 49][ref1] zijn ingebracht en waaromtrent de herverkavelingscommissie geen
      overeenstemming heeft weten te bereiken, geschiedt door de Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel49
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '49'
  - number: '55.1'
    text: |-
      De Voorzitter van de Raad van Beroep bepaalt terstond na ontvangst van de in [artikel 53][ref1] bedoelde stukken
      tijd en plaats der zitting, waarop de belanghebbenden bij de bezwaren of hun schriftelijk gemachtigden ter
      behandeling zullen verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel53
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '53'
  - number: '55.2'
    text: De Voorzitter doet hiervan mededeling aan de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
  - number: '55.3'
    text: |-
      De bekende belanghebbenden bij de in het eerste lid bedoelde bezwaren, die op de lijst van rechthebbenden zijn
      geplaatst of binnen de termijn en op de wijze, in [artikel 49][ref1] bepaald, bezwaren hebben ingediend, worden bij
      aangetekende brief opgeroepen om in persoon of bij schriftelijk gemachtigde op de zitting te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel49
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '49'
  - number: '55.4'
    text: Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
  - number: '55.5'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg, door de wet aan het niet bijwonen der zitting
      verbonden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
  - number: '55.6'
    text: De zitting wordt niet gehouden, dan nadat ten minste veertien dagen na de oproeping zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      De zitting wordt bijgewoond door één of meer leden van de herverkavelingscommissie met zo nodig een of meer
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde, op de zitting aanwezig zijn, wanneer hun bezwaren
      worden behandeld, worden geacht die bezwaren te hebben ingetrokken. Daarvan wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
  - number: '56.3'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der zitting bij
      aangetekende brief, gericht aan de voorzitter van de Raad van Beroep, het niet verschijnen ter zitting verklaren
      met een beroep op overmacht en de gegrondheid van deze bewering binnen een door de voorzitter van de Raad van
      Beroep te bepalen termijn aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
  - number: '56.4'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de voorzitter van de Raad van Beroep de zitting
      tot een andere dag zonder nadere oproeping.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
  - number: '56.5'
    text: De Raad van Beroep doet uitspraak over de ingebrachte bezwaren. Van het verhandelde wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
  - number: '56.6'
    text: |-
      Voorzover deze bezwaren betrekking hadden op de aantekeningen, bedoeld in [artikel 47, onder ][ref1], staan deze
      aantekeningen door de uitspraak van de Raad van Beroep vast en is van deze uitspraak geen beroep noch enige andere
      voorziening mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '47'
  - number: '57.1'
    text: |-
      Van de uitspraak wordt afschrift gezonden aan de herverkavelingscommissie, aan de rechter-commissaris en, bij
      aangetekende brief, aan de bij de uitspraak betrokken belanghebbenden onder mededeling van het bepaalde in het
      eerste lid van het volgend artikel.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel57
  - number: '57.2'
    text: Op het niet ontvangen van deze mededeling kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel57
  - number: '58.1'
    text: |-
      Binnen dertig dagen na de verzending van de in [artikel 57][ref1] bedoelde mededeling kan ieder, die
      overeenkomstig het bepaalde in [artikel 49][ref2] bezwaren had ingebracht tegen een aantekening, als bedoeld in
      [artikel 47, onder ][ref3], schriftelijk aan de Raad van Beroep verklaren, dat hij zich met de uitspraak van de
      Raad van Beroep daaromtrent niet kan verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '47'
  - number: '58.2'
    text: |-
      Voorzover binnen de termijn en op de wijze, bedoeld in het [eerste lid van dit artikel][ref1], geen verklaringen
      zijn ingezonden, staan de aantekeningen, bedoeld in [artikel 47, onder ][ref2], door de uitspraak van de Raad van
      Beroep vast en is van deze uitspraak geen beroep, noch enige andere voorziening mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '47'
  - number: '58.3'
    text: |-
      Van de ingezonden verklaringen zendt de Raad van Beroep afschrift aan de herverkavelingscommissie en aan de
      rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel58
  - number: '59.1'
    text: |-
      De rechter-commissaris verwijst partijen naar een door hem te bepalen zitting van de rechtbank. Deze verwijzing
      vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel59
  - number: '59.2'
    text: |-
      De rechtbank behandelt alle zaken betreffende de aantekeningen, gesteld op de lijst van de in het blok gelegen
      bedrijven, vóór elke andere, met uitzondering van die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel59
  - number: '60.1'
    text: |-
      Ten dage dienende geven zij, die verklaard hebben, dat zij zich met de uitspraak van de Raad van Beroep niet kunnen
      verenigen, de gronden hunner beweringen en de middelen tot staving daarvan op bij conclusie, door een procureur
      getekend. Afschrift der conclusie wordt ter terechtzitting aan de procureur der weder-partij overgegeven.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel60
  - number: '60.2'
    text: |-
      Op een uiterlijk veertien dagen hierna te stellen, door de rechtbank te bepalen, dag kunnen partijen haar
      conclusiën bij pleidooi door een advocaat mondeling doen toelichten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel60
  - number: '61.1'
    text: |-
      Uiterlijk een maand na de dienende dag of, indien een dag voor pleidooi werd vastgesteld, na de daarvoor bepaalde
      dag, doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel61
  - number: '61.2'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet, noch enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hooge Raad om zich, in het belang der wet, in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel61
  - number: '61.3'
    text: |-
      De lijst van de in het blok gelegen bedrijven, met de daarop gestelde aantekeningen, wordt door de rechtbank
      gesloten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel61
  - number: '62.1'
    text: |-
      De herverkavelingscommissie vervaardigt een kaart van het blok met de wegen, waterlopen en kaden met de daartoe
      behorende kunstwerken met inachtneming van door Gedeputeerde Staten te geven richtlijnen en aanwijzingen in verband
      met die richtlijnen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
  - number: '62.2'
    text: |-
      Zij doet deze kaart aan Gedeputeerde Staten toekomen, vergezeld van haar advies en van een voorstel omtrent
      de eigendom, het beheer en het onderhoud van de openbare wegen, waterlopen en kaden met de daartoe behorende
      kunstwerken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
  - number: '62.3'
    text: |-
      Zo spoedig mogelijk nadat de herverkavelingscommissie deze stukken heeft verzonden, stellen Gedeputeerde Staten het
      plan van wegen, waterlopen en kaden met de daartoe behorende kunstwerken met hun afmetingen vast; de vaststelling
      kan ook in gedeelten geschieden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
  - number: '62.4'
    text: |-
      Wegen met de daartoe behorende kunstwerken, welke voorheen voor het openbaar verkeer waren opengesteld
      en niet in het plan worden opgenomen, worden in afwijking van het bepaalde in de [artikelen 8 ][ref1] en
      [9 van de Wegenwet ][ref2]door het enkele feit van de niet opname aan het openbaar verkeer onttrokken. Aan wegen
      met de daartoe behorende kunstwerken, welke in het plan als openbare wegen worden opgenomen, maar die voorheen
      niet voor het openbaar verkeer waren opengesteld, wordt in afwijking van het bepaalde in de [artikelen 4][ref3] en
      [5 van de Wegenwet][ref4] door het enkele feit van de opname de bestemming van openbare weg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel5
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0001948
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '5'
  - number: '62.5'
    text: |-
      Gedeputeerde Staten zenden een afschrift van hun besluit tot vaststelling van het plan of van een gedeelte van het
      plan van wegen, waterlopen en kaden met de daartoe behorende kunstwerken aan de belanghebbende openbare lichamen en
      aan de herverkavelingscommissie, vergezeld van een kaart, aangevende de afmetingen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
  - number: '62.6'
    text: |-
      Binnen 30 dagen na dagtekening van de verzending van de in het vorige lid bedoelde kennisgevingen, staat aan de in
      het vorige lid bedoelde lichamen en aan de Commissaris in de provincie Zeeland beroep op Ons open.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel62
  - number: '63.1'
    text: |-
      Na het verstrijken van de in het [6e lid van artikel 62][ref1] genoemde termijn, zonder dat beroep is ingesteld,
      en, ten aanzien van die onderdelen van het plan van wegen, waterlopen en kaden met de daartoe behorende
      kunstwerken, waartegen beroep is ingesteld, met ingang van de dag, volgende op die, waarop Onze beslissing
      in hoger beroep door Gedeputeerde Staten ter kennis van de betrokken publiekrechtelijke lichamen en van de
      herverkavelingscommissie is gebracht, kan de aanleg of verbetering van wegen, waterlopen en kaden met de daartoe
      behorende kunstwerken en de uitvoering van de overige werkzaamheden ter hand worden genomen. Zo nodig kunnen
      Gedeputeerde Staten toestaan, dat reeds op een vroeger tijdstip met deze werkzaamheden wordt begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel62
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '62'
  - number: '63.2'
    text: |-
      De uitvoering der werkzaamheden geschiedt door de zorg van de herverkavelingscommissie. Gedeputeerde Staten kunnen
      evenwel na overleg met de herverkavelingscommissie bepalen, dat met name te noemen werken worden uitgevoerd door
      de openbare lichamen, die met het beheer en onderhoud daarvan zijn belast, of dat deze werken onder hun toezicht
      worden uitgevoerd, waarbij een doelmatig verband met andere werken voor zoveel nodig verzekerd moet zijn. Omtrent
      het tijdstip der uitvoering plegen de openbare lichamen overleg met de herverkavelingscommissie. Omtrent de
      uitvoering van werken, met het beheer en onderhoud waarvan het Rijk is belast beslist de betrokken Minister,
      gehoord de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.3'
    text: |-
      Op de terreinen kunnen tekens worden gesteld en kan houtgewas worden gekapt; zoden, aarde, grint of andere specie
      kan aan de terreinen worden onttrokken of daarop worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.4'
    text: |-
      Indien naar het oordeel der herverkavelingscommissie het belang der herverkaveling zulks vordert, kunnen gronden
      worden drooggelegd, ontgonnen of herontgonnen, tijdelijk geëxploiteerd, begreppeld of gedraineerd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.5'
    text: |-
      Opstallen kunnen worden afgebroken, verbouwd, verplaatst, gebouwd of herbouwd, indien naar het oordeel der
      herverkavelingscommissie het belang der herverkaveling zulks vordert.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.6'
    text: |-
      De schade, welke een rechtstreeks gevolg is van de uitvoering van de in het eerste tot en met het vijfde lid
      bedoelde handelingen, wordt door het Rijk vergoed.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.7'
    text: |-
      De eigenaren en gebruikers zijn verplicht te gedogen, dat hun terrein wordt betreden en daarop de werkzaamheden,
      bedoeld in het eerste tot en met het vijfde lid, worden verricht.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '63.8'
    text: |-
      Indien het verrichten van de in het vorige lid bedoelde handelingen niet wordt gedoogd, wordt de tussenkomst
      ingeroepen van de burgemeester of kantonrechter, op wiens bevel het verrichten der handelingen, desnoods met behulp
      van de sterke arm, wordt mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel63
  - number: '64'
    text: 'Zodra:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel64
  - number: 64.a
    text: |-
      de herverkavelingscommissie de bezwaren, die betrekking hebben op de lijst van rechthebbenden, heeft behandeld en
      de processen-verbaal, bedoeld in de [artikelen 25][ref1], [26][ref2] en [27][ref3], heeft opgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel27
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '27'
  - number: 64.b
    text: de uitkomsten der schattingen vaststaan of voorlopig zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel64
  - number: 64.c
    text: |-
      de aantekeningen, bedoeld in [artikel 47, onder ][ref1], op de lijst van de in het blok gelegen bedrijven
      vaststaan, alsmede.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '47'
  - number: 64.d
    text: het plan van wegen, waterlopen en kaden met de daartoe behorende kunstwerken is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel64
  - number: '65'
    text: 'Het plan van toedeling houdt in:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
  - number: 65.1°
    text: de kavelindeling;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
  - number: 65.2°
    text: de toedeling der kavels;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
  - number: 65.3°
    text: |-
      de in [artikel 12][ref1] bedoelde regelingen van de zakelijke rechten, het recht van huur en van pacht en de
      lasten, welke op de onroerende goederen rusten;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel12
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '12'
  - number: 65.4°
    text: |-
      de ingevolge [artikel 14][ref1] gevestigde verbintenissen;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel14
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '14'
  - number: 65.5°
    text: bepalingen omtrent de inbezitneming.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel65
  - number: '66.1'
    text: |-
      De Minister is bevoegd, op voorstel der herverkavelingscommissie, tot het tijdstip waarop ingevolge artikel 64 met
      het opmaken van het plan van toedeling wordt begonnen, de grenzen van het blok te wijzigen, wanneer blijkt, dat
      voor de uitvoering der herverkaveling bepaalde percelen niet nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel66
  - number: '66.2'
    text: |-
      In het plan van toedeling kunnen met toestemming van hen, die bevoegd zijn te beschikken, ten aanzien van niet
      tot het blok behorende onroerende goederen regelingen worden opgenomen betreffende grenswijziging, burenrechten
      en erfdienstbaarheden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel66
  - number: '67.1'
    text: |-
      Zodra het plan van toedeling door de herverkavelingscommissie is opgemaakt, worden de grenzen der kavels zo
      mogelijk op het terrein uitgezet en wordt het plan van toedeling door de herverkavelingscommissie ter kosteloze
      inzage van een ieder neergelegd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel67
  - number: '67.2'
    text: |-
      Van de nederlegging geschiedt openbare kennisgeving op de wijze in het [tweede lid van artikel 23][ref1]
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel23
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '23'
  - number: '68'
    text: |-
      Binnen dertig dagen na de openbare kennisgeving in het vorige artikel bedoeld, kan ieder belanghebbende
      schriftelijk zijn bezwaren bij de herverkavelingscommissie indienen; deze bevoegdheid wordt in de kennisgeving
      vermeld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel68
  - number: '69.1'
    text: |-
      Indien binnen de termijn en op de wijze, in het vorige artikel bedoeld, geen bezwaren zijn ingediend, staat het
      plan van toedeling vast. Hiervan wordt door de herverkavelingscommissie proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel69
  - number: '69.2'
    text: |-
      Indien binnen de termijn en op de wijze, in het vorige artikel bedoeld, bezwaren zijn ingediend, tracht de
      herverkavelingscommissie overeenstemming te verkrijgen; indien overeenstemming wordt verkregen, vindt de bepaling
      van het vorige lid overeenkomstige toepassing. Van het verhandelde wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel69
  - number: '69.3'
    text: |-
      De herverkavelingscommissie zendt zo spoedig mogelijk afschriften van de processen-verbaal en van de ingediende
      bezwaarschriften aan de Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel69
  - number: '70.1'
    text: |-
      Indien geen overeenstemming is verkregen, bepaalt de voorzitter van de Raad van Beroep tijd en plaats der zitting,
      waarop zij, die bij de ingediende bezwaren belang hebben, of hun schriftelijk gemachtigden voor de Raad van Beroep
      kunnen verschijnen, teneinde voor zoveel nodig te geraken tot vaststelling van het plan van toedeling.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel70
  - number: '70.2'
    text: De voorzitter doet hiervan mededeling aan de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel70
  - number: '70.3'
    text: |-
      De bekende belanghebbenden worden bij aangetekende brief opgeroepen om in persoon of bij schriftelijk gemachtigde
      de zitting bij te wonen. Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel70
  - number: '70.4'
    text: |-
      In de oproepingen wordt opmerkzaam gemaakt op het rechtsgevolg, door de wet aan het niet bijwonen der zitting
      verbonden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel70
  - number: '70.5'
    text: De zitting wordt niet gehouden, dan nadat ten minste veertien dagen na de oproeping zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel70
  - number: '71.1'
    text: |-
      De zitting wordt bijgewoond door een of meer leden der herverkavelingscommissie met zo nodig een of meer
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '71.2'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde ter zitting aanwezig zijn, wanneer hun bezwaren worden
      behandeld, worden geacht die bezwaren te hebben ingetrokken. Daarvan wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '71.3'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen één week na de dag der zitting bij
      aangetekende brief, gericht aan de voorzitter van de Raad van Beroep, het niet verschijnen ter zitting verklaren
      met een beroep op overmacht en de gegrondheid van deze bewering binnen een door de voorzitter van de Raad van
      Beroep te bepalen termijn aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '71.4'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de voorzitter van de Raad van Beroep de zitting
      tot een andere dag zonder nadere oproeping.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '71.5'
    text: De Raad van Beroep stelt het plan van toedeling vast.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '71.6'
    text: Van het verhandelde wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel71
  - number: '72'
    text: |-
      Wanneer tengevolge van de behandeling van bezwaren tegen de lijst van rechthebbenden door de rechter wijzigingen in
      die lijst worden aangebracht, brengt de Raad van Beroep de daardoor noodzakelijk geworden wijzigingen in het plan
      van toedeling aan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel72
  - number: '73.1'
    text: |-
      Zolang Gedeputeerde Staten nog geen besluit betreffende de eigendom, het beheer en het onderhoud der openbare
      wegen en waterlopen met de daartoe behorende kunstwerken en betreffende het beheer en het onderhoud der kaden
      hebben genomen, worden deze beschouwd als in eigendom, beheer en onderhoud of, wat de kaden betreft, in beheer
      en onderhoud toe te komen aan de Provincie Zeeland. Het beheer en het onderhoud der openbare wegen, waterlopen
      en kaden met de daartoe behorende kunstwerken gaat over op de Provincie Zeeland of op de door haar aangewezen
      beheerders of onderhoudsplichtigen op de tijdstippen, dat deze werken gereed zijn en door Gedeputeerde Staten zijn
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel73
  - number: '73.2'
    text: |-
      Wegen, waterlopen en kaden met de daartoe behorende kunstwerken, waarvoor een publiekrechtelijk lichaam als belast
      met het beheer en onderhoud wordt aangewezen, hetwelk daarmede voorheen niet was belast, gaan in afwijking van het
      bepaalde in de [artikelen 1][ref1] en [2 van de Waterstaatswet 1900 ][ref2]en de [artikelen 18][ref3], [19][ref4]
      en [20 van de Wegenwet][ref5], door het enkele feit van die aanwijzing in beheer en onderhoud op dat lichaam over
      op de wijze en op het tijdstip als in het eerste lid bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0001948#Artikel20
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001948
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0001948
        artikel: '20'
  - number: '73.3'
    text: |-
      Zodra de Gedeputeerde Staten het in het eerste lid bedoelde besluit hebben genomen, zenden zij daarvan een
      afschrift aan de belanghebbende openbare lichamen, aan de herverkavelingscommissie en ter overschrijving in de
      openbare registers aan de hypotheekbewaarder, wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel73
  - number: '73.4'
    text: |-
      Binnen dertig dagen na dagtekening van de verzending van de in het vorige lid bedoelde kennisgevingen, staat de in
      het vorige lid bedoelde lichamen beroep op Ons open.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel73
  - number: '73.5'
    text: |-
      De Minister zendt een afschrift van Ons besluit ter overschrijving in de openbare registers aan de
      hypotheekbewaarder, wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel73
  - number: '74'
    text: |-
      Indien de herverkavelingscommissie zulks verzoekt, wordt degene, aan wie krachtens het plan van toedeling enig
      perceel toekomt, op bevelschrift van de rechter-commissaris, desnoods door middel van de sterke arm, bij voorraad
      in het bezit daarvan gesteld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel74
  - number: '75.1'
    text: |-
      Zodra het plan van toedeling vaststaat en de lijst van rechthebbenden door de rechtbank is gesloten, maakt een door
      de herverkavelingscommissie aangewezen notaris de acte van toedeling op.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.2'
    text: Zij wordt ondertekend door de rechter-commissaris en de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.3'
    text: |-
      Aan de acte wordt gehecht een kaart van het blok met aanwijzing van de kavels en wegen, waterlopen en kaden met de
      daartoe behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.4'
    text: |-
      In afwijking van het bepaalde in artikel 37, tweede lid, van de wet van 9 Juli 1842 (Staatsblad n°. 20) op
      het notarisambt, zooals deze sedert dien gewijzigd is, worden de nieuwe kavels in deze acte aangeduid met de
      kavelnummers, voorkomende op de in het vorige lid bedoelde kaart.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.5'
    text: |-
      De acte geldt als titel voor de daarin omschreven rechten. Door de overschrijving der acte van toedeling in de
      openbare registers worden de daarin omschreven zakelijke rechten verkregen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.6'
    text: |-
      De aantekening van de zakelijke rechten in de openbare registers geschiedt op grond van de in de acte opgenomen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.7'
    text: |-
      De hypotheekbewaarder tekent op grond van de acte in de registers van inschrijving van hypotheken bij elke
      inschrijving aan, dat de hypotheek in het vervolg zal rusten op de in de acte aangewezen kavels of gedeelten van
      kavels.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '75.8'
    text: |-
      De inschrijvingen van hypotheken en de overschrijvingen van conservatoire en executoriale beslagen, welke blijkens
      de acte niet blijven bestaan, worden ambtshalve doorgehaald.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel75
  - number: '76'
    text: 'In de acte worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel76
  - number: 76.1°
    text: |-
      de in [artikel 12][ref1] bedoelde regelingen van de zakelijke rechten, het recht van huur en van pacht en
      de lasten, welke op de onroerende goederen rusten, met uitzondering van bepalingen betreffende geldelijke
      verrekeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel12
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '12'
  - number: 76.2°
    text: |-
      de ingevolge [artikel 14][ref1] gevestigde verbintenissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel14
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '14'
  - number: '77'
    text: |-
      Na de overschrijving van de in [artikel 75][ref1] bedoelde acte wordt hij, aan wie daarbij enig perceel is
      toegewezen, op bevelschrift van de rechter-commissaris desnoods door middel van de sterke arm in het bezit daarvan
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel75
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '75'
  - number: '78.1'
    text: |-
      Na voltooiing der terreinwerkzaamheden geeft de herverkavelingscommissie aan de schatters, bedoeld in
      [artikel 21][ref1], opdracht tot het herschatten der in het blok gelegen onroerende goederen, naar de toestand
      waarin zij zich alsdan bevinden. Deze schatting geschiedt naar dezelfde grondslagen als de schatting, genoemd in
      [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel22
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '22'
  - number: '78.2'
    text: |-
      De commissie ontwerpt een stelsel van classificatie van de grond en bepaalt van elke klasse de waarde per ha. Zij
      maakt van deze verrichtingen een proces-verbaal van classificatie op.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel78
  - number: '78.3'
    text: De schatters delen de grond aan de hand van het proces-verbaal van classificatie in klassen in.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel78
  - number: '78.4'
    text: De gebouwen, werken en beplantingen worden zo nodig afzonderlijk geschat.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel78
  - number: '79'
    text: |-
      De herverkavelingscommissie gaat daarna zo spoedig mogelijk over tot het opmaken van de lijst der geldelijke
      regelingen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel79
  - number: '80'
    text: 'De lijst der geldelijke regelingen houdt in:'
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
  - number: 80.1°
    text: de uitkomsten der herschattingen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
  - number: 80.2°
    text: |-
      de in de [artikelen 5][ref1] en [6][ref2] bedoelde vergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel6
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '6'
  - number: 80.3°
    text: |-
      de vergoedingen, bedoeld in [artikel 14, derde lid][ref1], en in [artikel 18, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel18
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '18'
  - number: 80.4°
    text: |-
      de te verrekenen bedragen bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel19
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '19'
  - number: 80.5°
    text: |-
      de bepalingen der geldelijke gevolgen, voorkomende in de regelingen, bedoeld in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel12
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '12'
  - number: 80.6°
    text: de afkoopsommen van tiendrenten en jachtrenten;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
  - number: 80.7°
    text: |-
      de bedragen der schadevergoedingen, bedoeld in [artikel 47, onder ][ref1], zoals deze uiteindelijk zijn
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel47
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '47'
  - number: 80.8°
    text: |-
      de vergoedingen, bedoeld in het [zesde lid van artikel 63][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel63
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '63'
  - number: 80.9°
    text: de vergoedingen voor de overneming van gebouwen, werken en beplantingen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
  - number: 80.10°
    text: de vergoedingen voor de overneming van gewassen, afrasteringen en andere prestaties van die aard.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel80
  - number: '81.1'
    text: |-
      De in het vorige artikel bedoelde lijst der geldelijke regelingen wordt door de herverkavelingscommissie ter
      kosteloze inzage van een ieder neergelegd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel81
  - number: '81.2'
    text: |-
      Van de nederlegging geschiedt openbare en bijzondere kennisgeving op de wijze in het
      [tweede lid van artikel 23][ref1] aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel23
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '23'
  - number: '81.3'
    text: Op het niet ontvangen van de kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel81
  - number: '81.4'
    text: |-
      De lijst der geldelijke regelingen wordt in haar geheel of in uittreksel tegen betaling der kosten verkrijgbaar
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel81
  - number: '82.1'
    text: |-
      Binnen dertig dagen na de verzending van de bijzondere kennisgeving, in [artikel 81][ref1] bedoeld, kan iedere
      belanghebbende schriftelijk zijn bezwaren tegen de lijst der geldelijke regelingen bij de herverkavelingscommissie
      indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel81
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '81'
  - number: '82.2'
    text: Deze bevoegdheid wordt met aanwijzing van de dag der verzending in de kennisgevingen vermeld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel82
  - number: '83'
    text: |-
      Voor zover binnen de termijn en op de wijze, in het vorige artikel bepaald, geen bezwaren zijn ingediend, staat de
      lijst der geldelijke regelingen vast. Daarvan wordt door de herverkavelingscommissie proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel83
  - number: '84.1'
    text: |-
      De herverkavelingscommissie onderzoekt de tijdig ingediende bezwaren en tracht daaromtrent overeenstemming te
      bereiken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel84
  - number: '84.2'
    text: Indien overeenstemming is verkregen vinden de bepalingen van het vorige artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel84
  - number: '85'
    text: |-
      Indien geen overeenstemming is verkregen, wordt door de herverkavelingscommissie proces-verbaal opgemaakt van het
      omtrent de ingebrachte bezwaren verhandelde.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel85
  - number: '86'
    text: |-
      De herverkavelingscommissie zendt zo spoedig mogelijk een afschrift van de lijst der geldelijke regelingen en van
      de in de [artikelen 83][ref1], [84][ref2] of [85][ref3] bedoelde processen-verbaal aan de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0002034#Artikel85
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '84'
      - id: ref3
        bwb_id: BWBR0002034
        artikel: '85'
  - number: '87.1'
    text: |-
      Indien binnen de termijn en op de wijze, in [artikel 82][ref1] bepaald, bezwaren zijn ingediend en hieromtrent niet
      overeenkomstig [artikel 84][ref2] overeenstemming is bereikt, bepaalt de rechter-commissaris terstond na ontvangst
      van de in het vorige artikel bedoelde stukken tijd en plaats der bijeenkomst, waarop de belanghebbenden bij deze
      bezwaren of hun schriftelijk gemachtigden voor hem kunnen verschijnen, teneinde voorzover nog nodig te geraken tot
      vaststelling van de lijst der geldelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel84
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '84'
  - number: '87.2'
    text: Hij doet hiervan mededeling aan de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
  - number: '87.3'
    text: |-
      De bekende belanghebbenden bij de in het eerste lid bedoelde bezwaren, worden bij aangetekende brief opgeroepen om
      in persoon of bij schriftelijk gemachtigde de bijeenkomst bij te wonen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
  - number: '87.4'
    text: Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
  - number: '87.5'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg, door de wet aan het niet bijwonen der bijeenkomst
      verbonden.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
  - number: '87.6'
    text: De bijeenkomst wordt niet gehouden dan nadat ten minste veertien dagen na de oproeping zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel87
  - number: '88.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de Griffier der Arrondissements-Rechtbank.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '88.2'
    text: |-
      De bijeenkomst wordt bijgewoond door één of meer leden der herverkavelingscommissie met zo nodig één of meer
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '88.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de rechter-commissaris de bijeenkomst tot een
      andere dag zonder nadere oproeping.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '88.4'
    text: Van het verhandelde omtrent elk onderwerp wordt een afzonderlijk proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '88.5'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde op de bijeenkomst aanwezig zijn, wanneer hun bezwaren
      worden behandeld, worden geacht die bezwaren te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '88.6'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet verschijnen op de bijeenkomst verklaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel88
  - number: '89.1'
    text: Voorzover overeenstemming wordt verkregen omtrent de lijst der geldelijke regelingen staat deze vast.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel89
  - number: '89.2'
    text: |-
      Indien geschil blijft bestaan, verwijst de rechter-commissaris de zaak naar een door hem te bepalen zitting van de
      rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel89
  - number: '90'
    text: |-
      De rechtbank behandelt zaken betreffende de lijst der geldelijke regelingen vóór elke andere, met uitzondering van
      die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel90
  - number: '91.1'
    text: |-
      Ten dage dienende lichten zij, met wie geen overeenstemming is verkregen hun standpunt, hetzij in persoon, hetzij
      bij schriftelijk gemachtigde, mondeling toe.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
  - number: '91.2'
    text: De rechtbank hoort de vertegenwoordigers van de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
  - number: '91.3'
    text: Uiterlijk een maand na het in het tweede lid genoemde verhoor doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
  - number: '91.4'
    text: |-
      Indien deze uitspraak van invloed is op de uitkomsten van andere herschattingen, is zij bevoegd hierin wijziging
      aan te brengen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
  - number: '91.5'
    text: De lijst der geldelijke regelingen wordt door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
  - number: '91.6'
    text: |-
      Ten aanzien van de kosten van het geding vindt het bepaalde in [artikel 41][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel41
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '41'
  - number: '92'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet noch ook enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hoge Raad om zich, in het belang der wet, in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel92
  - number: '93.1'
    text: |-
      Zodra de lijst der geldelijke regelingen door de rechtbank is gesloten, maakt de notaris, bedoeld in
      [artikel 75][ref1], de acte der geldelijke regelingen op.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel75
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '75'
  - number: '93.2'
    text: Zij wordt ondertekend door de rechter-commissaris en de herverkavelingscommissie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel93
  - number: '93.3'
    text: De acte geldt als titel voor de daarin omschreven rechten.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel93
  - number: '94'
    text: Ten laste van het Rijk komen alle kosten der herverkaveling.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel94
  - number: '95.1'
    text: |-
      Terzake van de op grond van [artikel 6][ref1] door de eigenaren verschuldigde bedragen rust op de hun toegedeelde
      kavels onder de naam van "herverkavelingsrente" een schuldplichtigheid ten behoeve van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel6
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '6'
  - number: '95.2'
    text: |-
      De overige door de eigenaren verschuldigde bedragen kunnen, ter keuze van de eigenaren, ineens worden voldaan, dan
      wel in de herverkavelingsrente worden begrepen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel95
  - number: '96'
    text: |-
      De rente bedraagt vijf ten honderd van het volgens [artikel 95][ref1] verschuldigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel95
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '95'
  - number: '98'
    text: |-
      De rente is verschuldigd over dertig achtereenvolgende jaren te beginnen met het jaar volgende op dat, waarin de
      herverkavelingsrente in de kadastrale legger is aangetekend.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel98
  - number: '99.1'
    text: |-
      Bij splitsing van een perceel wordt de rente van de nog niet ingetreden jaren verdeeld naar verhouding van de
      grootte van die percelen volgens de kadastrale registratie.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel99
  - number: '99.2'
    text: |-
      Wordt het perceel, of, in geval van splitsing, een gedeelte van het perceel, met andere grond samengevoegd,
      dan gaat de rente of het betrekkelijke gedeelte der rente voor de nog niet ingetreden jaren op het door die
      samenvoeging gevormde perceel over.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel99
  - number: '100.1'
    text: |-
      De rente is verschuldigd door hem, die het genot heeft van het perceel als bezitter, eigenaar of beperkt
      gerechtigde.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel100
  - number: '100.2'
    text: |-
      In geval van vruchtgebruik is de degene aan wie de bezwaarde eigendom toebehoort verplicht de vruchtgebruiker bij
      het eindigen van zijn vruchtgebruik te vergoeden hetgeen deze, in verband met de vermindering van de waarde van de
      rente, berekend volgens [artikel 104][ref1], geacht moet worden voor aflossing te hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002034#Artikel104
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002034
        artikel: '104'
  - number: '100.3'
    text: |-
      In geval van het recht van opstal is de rente slechts verschuldigd, voor zover zodanig recht niet betreft het
      leggen en houden van leidingen in, op of boven de onroerende zaak van een ander.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel100
  - number: '101'
    text: |-
      Het bedrag van de rente wordt door de zorg van Het bestuur van de Dienst voor het kadaster en de openbare registers
      in de kadastrale registratie bij de desbetreffende percelen opgenomen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel101
  - number: '102.1'
    text: De rente wordt geheven en ingevorderd door of vanwege Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: '102.2'
    text: |-
      De heffing en de invordering van de rente geschieden met toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) en de [Invorderingswet 1990][ref2] (*Stb.* 221) als
      ware die rente een rijksbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '102.3'
    text: |-
      De rente wordt geheven bij wege van aanslag. Indien met betrekking tot een zelfde perceel twee of meer personen
      renteplichtig zijn kan de rente bij wege van één aanslag worden geheven ten name van één van hen.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: '102.4'
    text: |-
      Bezwaar en beroep bedoeld in [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] kunnen niet zijn
      gegrond op de stelling dat het op grond van [artikel 95][ref2] verschuldigde bedrag ten onrechte of te hoog is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002034#Artikel95
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002034
        artikel: '95'
  - number: '102.5'
    text: |-
      Indien met toepassing van de tweede volzin van het derde lid de aanslag ten name van één renteplichtige is gesteld
      kan:
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: 102.5.a
    text: |-
      de ontvanger de aanslag op het gehele perceel verhalen ten name van degene te wiens name de aanslag is gesteld,
      zonder rekening te houden met de renten van de overige renteplichtigen;
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: 102.5.b
    text: |-
      de renteplichtige die de aanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn renteplicht
      verhalen op de overige renteplichtigen naar evenredigheid van ieders renteplicht.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: '102.6'
    text: Van het vijfde lid, aanhef en onderdeel b, kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel102
  - number: '104.1'
    text: |-
      Vóór of op de 1ste Juli van elk jaar kan de rente over de nog niet ingetreden jaren worden afgekocht voor hare
      waarde op genoemde dag.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel104
  - number: '104.2'
    text: |-
      Ter berekening van die waarde wordt het over een jaar verschuldigde bedrag geacht op de 1ste Juli van dat jaar te
      verschijnen. De berekening geschiedt voorts naar de rentevoet van drie ten honderd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel104
  - number: '104.3'
    text: De verdere bepalingen omtrent den afkoop worden door de Minister van Financiën vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel104
  - number: '105'
    text: De medewerking van de hypotheekbewaarder bij de uitvoering dezer wet geschiedt kosteloos.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel105
  - number: '106'
    text: |-
      Indien ten tijde van de totstandkoming van deze wet rechtsgeschillen aanhangig zijn met betrekking tot in de
      herverkaveling begrepen percelen, worden deze voortgezet en vóór alle andere, met uitzondering van die betreffende
      onteigening, behandeld.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel106
  - number: '107'
    text: |-
      Na beëindiging der werkzaamheden dragen de rechter-commissaris en de Raad van Beroep alle stukken, op de
      herverkaveling betrekking hebbende, over aan de herverkavelingscommissie, die zorg draagt voor de toezending der
      stukken aan de Minister.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel107
  - number: '108.1'
    text: |-
      Deze wet kan worden aangehaald onder de titel "Herverkavelingswet Walcheren" met bijvoeging van het jaartal van het
      *Staatsblad*, waarin zij is afgekondigd.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel108
  - number: '108.2'
    text: Zij treedt in werking op de tweede dag na die harer afkondiging.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel108
  - number: '108.3'
    text: Zij zal worden afgekondigd met inachtneming van het bepaalde in de wet van 14 Februari 1947, *Staatsblad* no. H 52.
    url: https://wetten.overheid.nl/BWBR0002034/2002-01-01#Artikel108
