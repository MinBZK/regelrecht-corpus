  - number: '20'
    text: |-
      1 Ten behoeve van de taken, bedoeld in [artikel 9][ref1], kan de Koninklijke Bibliotheek subsidie verstrekken.

      2 Indien de Koninklijke Bibliotheek subsidie verstrekt stelt het algemeen bestuur een reglement vast waarin in
      ieder geval wordt vastgelegd de werkwijze, de procedures en de criteria die het bestuur bij het verstrekken van
      subsidies hanteert, alsmede de verplichtingen die aan de subsidieontvanger worden opgelegd.

      3 In een reglement kunnen ook regels worden gesteld met betrekking tot de vaststelling van een subsidieplafond en
      de wijze van verdeling daarvan, de betaling en terugvordering van de subsidie alsmede de verlening van voorschotten
      op de subsidie. Onze Minister kan met betrekking tot genoemde onderwerpen het algemeen bestuur voorschrijven ter
      zake een reglement te wijzigen.

      4 Een besluit tot vaststelling van een reglement of een wijziging daarvan treedt slechts in werking na goedkeuring
      door Onze Minister. Goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.

      5 Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van de beslissing
      omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
        hoofdstuk: '2'
  - number: '21'
    text: |-
      1 Onze Minister kan ten behoeve van het netwerk van openbare bibliotheekvoorzieningen in bijzondere gevallen
      subsidie verstrekken.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld voor het verstrekken van subsidie.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel21
  - number: '22'
    text: |-
      1 Bij het uitvoeren van de taken, bedoeld in [artikel 9][ref1], streeft de Koninklijke Bibliotheek er naar
      de eigendom of een overdraagbaar gebruiksrecht te verkrijgen van bij die uitvoering gevestigde intellectuele
      eigendomsrechten.

      2 Op verzoek van Onze Minister werkt de Koninklijke Bibliotheek mee aan het tot stand komen van een overeenkomst
      tot het overdragen aan de Staat der Nederlanden van de rechten, bedoeld in het eerste lid. Voor zover wettelijk
      mogelijk, doet zij afstand van persoonlijkheidsrechten als bedoeld in de Auteurswet die haar of haar personeel
      toebehoren.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
        hoofdstuk: '2'
  - number: '23'
    text: |-
      1 Met het toezicht op de naleving van de verplichtingen die van toepassing zijn op een subsidieontvanger bij
      verstrekking van subsidie als bedoeld in [artikel 21][ref1], zijn belast de bij besluit van Onze Minister
      aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      4 Aan door Onze Minister verstrekte subsidies is de verplichting verbonden dat de subsidieontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij het uitoefenen van zijn
      bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel23
