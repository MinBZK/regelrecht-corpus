  - number: '7'
    text: |-
      De lokale bibliotheken, de provinciale ondersteuningsinstellingen en de Koninklijke Bibliotheek, voor wat
      betreft haar taak tot het in stand houden van de landelijke digitale bibliotheek, vormen één netwerk van openbare
      bibliotheekvoorzieningen als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel6
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '6'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Een deelnemer aan het netwerk als bedoeld in [artikel 7][ref1]:

      a. maakt met de andere deelnemers gebruik van een gezamenlijke catalogus van beschikbare werken;

      b. is onderdeel van het interbibliothecaire leenverkeer, bedoeld in [artikel 15][ref2];

      c. voert zijn collectiebeleid overeenkomstig het gezamenlijk collectieplan, bedoeld in [artikel 10][ref3];

      d. maakt gebruik van een op de andere deelnemers afgestemde digitale infrastructuur;

      e. stemt zijn administratie van leden en zijn algemene voorwaarden af op de andere deelnemers; en

      f. ondersteunt het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035878#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0035878#Artikel10
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel8
    references:
