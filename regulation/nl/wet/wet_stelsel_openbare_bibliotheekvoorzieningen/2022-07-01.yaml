  - number: '18'
    text: |-
      1 De Koninklijke Bibliotheek verricht namens de Staat der Nederlanden het inkopen van werken voor de landelijke
      digitale bibliotheek.

      2 Onze Minister stelt jaarlijks aan de Koninklijke Bibliotheek een bedrag ter beschikking voor het inkopen van
      werken.

      3 De inkoop wordt uitsluitend verricht op voordracht van vertegenwoordigers van de lokale bibliotheken, welke is
      afgestemd op het bedrag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel18
  - number: '19'
    text: |-
      1 De Koninklijke Bibliotheek ontvangt voor de vervulling van haar taken, bedoeld in [artikel 9][ref1], een
      aanvulling op haar rijksbijdrage, bedoeld in [artikel 2.6a van de WHW][ref2].

      2 Op de aanvulling is [artikel 2.6a van de WHW][ref3] van overeenkomstige toepassing.

      3 De Koninklijke Bibliotheek geeft invulling aan en legt beleidsmatig en financieel verantwoording af over de
      vervulling van haar taken, bedoeld in artikel 9, in een daartoe apart opgenomen onderdeel van:

      a. het instellingsplan, bedoeld in [artikel 2.2a van de WHW][ref4];

      b. de begroting, bedoeld in [artikel 2.8 van de WHW][ref5], waarin een allocatie van middelen is opgenomen die
      overeenstemt met het instellingsplan; en

      c. in de jaarverslaglegging, bedoeld in [artikel 2.9 van de WHW][ref6].

      4 De [hoofdstukken 2][ref7], [3][ref8], [4][ref9], [13][ref10], [14][ref11] en [15 van de WHW][ref12], zijn voor
      zover zij betrekking hebben op de Koninklijke Bibliotheek, van overeenkomstige toepassing op haar taakvervulling op
      grond van deze wet.


