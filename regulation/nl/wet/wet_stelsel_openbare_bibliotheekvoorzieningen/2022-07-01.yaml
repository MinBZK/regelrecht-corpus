preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke bepalingen ten aanzien van openbare
    bibliotheken te actualiseren en de landelijke digitale openbare bibliotheek vorm te geven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Koninklijke Bibliotheek:* Koninklijke Bibliotheek als bedoeld in [artikel 1.5, tweede lid, van de WHW][ref1];
        - *landelijke digitale bibliotheek:* plaats- en tijdonafhankelijke voor een ieder toegankelijke
      bibliotheekvoorziening;
        - *lokale bibliotheek:* organisatie met rechtspersoonlijkheid die een of meerdere voor een ieder toegankelijke
      openbare bibliotheekvoorzieningen verzorgt en die in overwegende mate door een of meer gemeenten dan wel de
      openbare lichamen Bonaire, Sint Eustatius of Saba wordt gesubsidieerd of in stand gehouden. De verplichtingen in
      deze wet zijn van toepassing op de rechtspersoon als geheel en niet op iedere vestiging afzonderlijk;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *provinciale ondersteuningsinstelling:* in overwegende mate door een of meer provincies gesubsidieerde of in
      stand gehouden voorziening die een pakket aan ondersteunende activiteiten biedt voor de lokale bibliotheken in de
      desbetreffende provincie of provincies;
        - *werk:* exemplaar van een werk als bedoeld in [artikel 10 van de Auteurswet][ref2];
        - *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].

      2 Voor zover in deze wet over een lid van een openbare bibliotheekvoorziening wordt gesproken, wordt hieronder
      verstaan een voor die bibliotheekvoorziening geregistreerde gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005682
