        artikel: '1.2'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '2'
  - number: '13'
    text: |-
      1 Voor het uitlenen van gedrukte werken of overige werken door lokale bibliotheken aan personen beneden de leeftijd
      van achttien jaar wordt geen contributie of andere geldelijke bijdrage geheven.

      2 Voor personen beneden de leeftijd van achttien jaar wordt geen tarief als bedoeld in [artikel 14][ref1],
      contributie of geldelijke bijdrage vastgesteld voor de toegang tot door de Koninklijke Bibliotheek aangewezen
      digitale werken.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel14
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel13
    references:
