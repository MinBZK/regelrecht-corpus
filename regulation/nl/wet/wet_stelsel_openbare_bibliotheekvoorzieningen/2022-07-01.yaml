        bwb_id: BWBR0035878
        artikel: '14'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De Koninklijke Bibliotheek kan na overleg met vertegenwoordigers van de lokale bibliotheken tarieven vaststellen
      voor de toegang tot digitale werken of het gebruik van digitale diensten of bronnen.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel14
  - number: '15'
    text: |-
      1 Alle lokale bibliotheken en provinciale ondersteuningsinstellingen nemen deel aan het interbibliothecaire
      leenverkeer.

      2 Deelname aan het interbibliothecaire leenverkeer houdt in ieder geval in:

      a. op verzoek van een lokale bibliotheek ter beschikking stellen van fysieke werken ten behoeve van gebruikers van
      die bibliotheek;

      b. op verzoek van een gebruiker doen van een verzoek als bedoeld in onderdeel a aan de daarvoor in aanmerking
      komende bibliotheek; en

      c. distributie van fysieke werken door provinciale ondersteuningsinstellingen.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel15
  - number: '16'
    text: |-
      1 Een provinciale ondersteuningsinstelling is verantwoordelijk voor de distributie van fysieke werken door middel
      van het interbibliothecaire leenverkeer binnen de provincie of provincies waardoor zij wordt gesubsidieerd of in
      stand gehouden.

      2 De provinciale ondersteuningsinstellingen zijn gezamenlijk verantwoordelijk voor:

      a. distributie van fysieke werken door middel van het interbibliothecaire leenverkeer tussen de provincies; en

      b. ontwikkeling van innovaties ten behoeve van de lokale bibliotheken, in overeenstemming met de Koninklijke
      Bibliotheek in verband met haar coördinerende taak.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel16
  - number: '17'
    text: |-
      1 Het in stand houden van de landelijke digitale bibliotheek door de Koninklijke Bibliotheek houdt in ieder geval
      in:

      a. ontwikkelen en beheren van de digitale infrastructuur;

      b. beheren en van context voorzien van de digitale collectie en de afstemming met de collectie digitale werken van
      de Koninklijke Bibliotheek op grond van [artikel 1.5, tweede lid, van de WHW][ref1];

      c. opstellen van een reglement voor de toegang tot digitale werken;

      d. bereiken van verschillende doelgroepen; en

      e. samenwerken met andere publieke aanbieders van digitale werken.

      2 De Koninklijke Bibliotheek gaat in een apart onderdeel van het instellingsplan, bedoeld in
      [artikel 2.2a van de WHW][ref2], in op de wijze waarop zij de landelijke digitale bibliotheek in stand houdt. Zij
      gaat daarbij specifiek in op de onderdelen, bedoeld in het eerste lid. Dit onderdeel van het instellingsplan heet
      beheerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2.2a
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel17
