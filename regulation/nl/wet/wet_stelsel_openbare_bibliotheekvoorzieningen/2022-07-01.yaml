  - number: '9'
    text: |-
      De Koninklijke Bibliotheek verricht in aanvulling op de taken, bedoeld in
      [artikel 1.5, tweede lid, van de WHW][ref1], de volgende taken:

      a. aansturen van het netwerk van openbare bibliotheekvoorzieningen door:

      i. afstemming en coördinatie;

      ii. educatie, informatie en reflectie; en

      iii. vertegenwoordiging en promotie;

      b. in stand houden van de landelijke digitale bibliotheek; en

      c. verzorgen van een bibliotheekvoorziening van noodzakelijk omgezette werken voor personen met een handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1.5'
  - number: '10'
    text: |-
      1 De Koninklijke Bibliotheek stelt elke vier jaar voor de deelnemers aan het netwerk, bedoeld in [artikel 7][ref1],
      een gezamenlijk collectieplan vast.

      2 Het collectieplan heeft tot doel samenhang te bewerkstelligen tussen de fysieke en digitale collecties van de
      openbare bibliotheekvoorzieningen. Het biedt een kader voor het samenstellen en beheren van de collectie door een
      voorziening.

      3 De Koninklijke Bibliotheek stelt het gezamenlijk collectieplan vast in overeenstemming met vertegenwoordigers van
      de lokale bibliotheken en provinciale ondersteuningsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel7
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '7'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Ten behoeve van de gezamenlijke catalogus voor de landelijke digitale bibliotheek verstrekken lokale bibliotheken
      en provinciale ondersteuningsinstellingen gegevens over de collectie en de beschikbaarheid daarvan aan de
      Koninklijke Bibliotheek.

      2 Ten behoeve van de beleidsontwikkeling verstrekken lokale bibliotheken, de provinciale ondersteuningsinstellingen
      en de Koninklijke Bibliotheek aan Onze Minister gegevens over de desbetreffende openbare bibliotheekvoorziening die
      niet tot de persoon herleidbare gegevens van gebruikers en personeel betreffen.

      3 De Koninklijke Bibliotheek stelt de aard van de gegevens, bedoeld in het eerste lid, nader vast en stelt regels
      over het tijdstip en de wijze waarop de gegevens worden verstrekt.

      4 Onze Minister stelt de aard van de gegevens, bedoeld in het tweede lid, nader vast en stelt regels over het
      tijdstip en de wijze waarop de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel11
  - number: '12'
    text: |-
      1 Een ieder die als ingezetene is ingeschreven in de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref1], of in een basisadministratie als bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref2] kan lid worden van de openbare bibliotheek.

      2 Het lidmaatschap bij de openbare bibliotheek kan het gebruik van een fysieke voorziening, de digitale voorziening
      of beide voorzieningen omvatten.

      3 Een fysieke voorziening is een lokale bibliotheek, de digitale voorziening is de landelijke digitale bibliotheek.

      4 Onze Minister of het college van burgemeester en wethouders of bestuurscollege kan bepalen dat ook andere groepen
      natuurlijke personen lid van de landelijke digitale bibliotheek onderscheidenlijk een lokale bibliotheek kunnen
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel12
    references:
      - id: ref1
