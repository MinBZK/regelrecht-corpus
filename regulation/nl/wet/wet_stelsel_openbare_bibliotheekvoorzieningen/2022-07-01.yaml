  - number: '2'
    text: |-
      Deze wet heeft betrekking op lokale bibliotheken, provinciale ondersteuningsinstellingen en de Koninklijke
      Bibliotheek, voor haar taken op grond van deze wet. Zij zijn in het kader van deze wet openbare
      bibliotheekvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0035878/2022-07-01#Artikel2
  - number: '3'
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met uitzondering van de
      [artikelen 8, onderdelen a, b, c en e][ref1], [10][ref2], [11, eerste lid][ref3], [15][ref4] en [16][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel8
