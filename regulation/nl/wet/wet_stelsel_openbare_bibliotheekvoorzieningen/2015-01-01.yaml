bwb_id: BWBR0035878
url: https://wetten.overheid.nl/BWBR0035878/2015-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke bepalingen ten aanzien van openbare
    bibliotheken te actualiseren en de landelijke digitale openbare bibliotheek vorm te geven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Koninklijke Bibliotheek:* Koninklijke
      Bibliotheek als bedoeld in [artikel 1.5, tweede lid, van de WHW][ref1];
        - *landelijke digitale bibliotheek:* plaats- en tijdonafhankelijke voor een ieder toegankelijke
      bibliotheekvoorziening;
        - *lokale bibliotheek:* organisatie met rechtspersoonlijkheid die een of meerdere voor een ieder toegankelijke
      openbare bibliotheekvoorzieningen verzorgt en die in overwegende mate door een of meer gemeenten dan wel de
      openbare lichamen Bonaire, Sint Eustatius of Saba wordt gesubsidieerd of in stand gehouden. De verplichtingen in
      deze wet zijn van toepassing op de rechtspersoon als geheel en niet op iedere vestiging afzonderlijk;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *provinciale ondersteuningsinstelling:* in overwegende mate door een of meer provincies gesubsidieerde of in
      stand gehouden voorziening die een pakket aan ondersteunende activiteiten biedt voor de lokale bibliotheken in de
      desbetreffende provincie of provincies;
        - *werk:* exemplaar van een werk als bedoeld in [artikel 10 van de Auteurswet][ref2];
        - *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005682
  - number: '1.2'
    text: |-
      Voor zover in deze wet over een lid van een openbare bibliotheekvoorziening wordt gesproken, wordt hieronder
      verstaan een voor die bibliotheekvoorziening geregistreerde gebruiker.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel1
  - number: '2'
    text: |-
      Deze wet heeft betrekking op lokale bibliotheken, provinciale ondersteuningsinstellingen en de Koninklijke
      Bibliotheek, voor haar taken op grond van deze wet. Zij zijn in het kader van deze wet openbare
      bibliotheekvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met uitzondering van de
      [artikelen 8, onderdelen a, b, c en e][ref1], [10][ref2], [11, eerste lid][ref3], [15][ref4] en [16][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035878#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035878#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0035878#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0035878#Artikel16
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035878
        artikel: '10'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0035878
        artikel: '11'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0035878
        artikel: '15'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0035878
        artikel: '16'
        hoofdstuk: '3'
  - number: '4'
    text: |-
      Een openbare bibliotheekvoorziening heeft een publieke taak die zij voor het algemene publiek vervult op basis van
      de waarden onafhankelijkheid, betrouwbaarheid, toegankelijkheid, pluriformiteit en authenticiteit.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel4
  - number: '5'
    text: |-
      Een voor een ieder toegankelijke openbare bibliotheekvoorziening omvat in ieder geval de volgende functies, die
      bijdragen aan de persoonlijke ontwikkeling en verbetering van de maatschappelijke kansen van het algemene publiek:
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: 5.a
    text: ter beschikking stellen van kennis en informatie;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: 5.b
    text: bieden van mogelijkheden tot ontwikkeling en educatie;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: 5.c
    text: bevorderen van lezen en het laten kennismaken met literatuur;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: 5.d
    text: organiseren van ontmoeting en debat; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: 5.e
    text: laten kennis maken met kunst en cultuur.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister, de provinciebesturen, de gemeentebesturen en de besturen van de openbare lichamen Bonaire, Sint
      Eustatius en Saba zijn gezamenlijk verantwoordelijk voor een netwerk van openbare bibliotheekvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      De partijen, genoemd in het eerste lid, geven zich bij de uitoefening van de verantwoordelijkheid, bedoeld in het
      eerste lid, rekenschap van de gemiddelde afstand tussen de lokale bibliotheekvoorziening en de inwoners van de
      financierende gemeente of gemeenten.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      Zij bevorderen dat een door hen gesubsidieerde of in stand gehouden openbare bibliotheekvoorziening aan de
      verplichtingen, bedoeld in [artikel 8][ref1], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel8
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '8'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      Bij een voorgenomen besluit van een partij als bedoeld in het eerste lid dat tot gevolg heeft dat een openbare
      bibliotheekvoorziening ophoudt te bestaan of redelijkerwijs niet meer kan voldoen aan de verplichtingen in deze
      wet, overlegt zij eerst met de andere partijen op wie dit van invloed kan zijn waaronder de ingezetenen. Zo nodig
      maken zij afspraken over de toegankelijkheid van een openbare bibliotheekvoorziening voor het betrokken algemene
      publiek.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
  - number: '6.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop ingezetenen en
      maatschappelijke initiatieven bij de uitvoering van het beleid kunnen worden betrokken, het uitvoeren van taken van
      het college op grond van deze wet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
  - number: '6.6'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het vijfde lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers der Staten-
      Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan zes
      weken na het besluit van die kamer der Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel6
  - number: '7'
    text: |-
      De lokale bibliotheken, de provinciale ondersteuningsinstellingen en de Koninklijke Bibliotheek, voor wat
      betreft haar taak tot het in stand houden van de landelijke digitale bibliotheek, vormen één netwerk van openbare
      bibliotheekvoorzieningen als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel6
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '6'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Een deelnemer aan het netwerk als bedoeld in [artikel 7][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel7
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '7'
        hoofdstuk: '2'
  - number: 8.a
    text: maakt met de andere deelnemers gebruik van een gezamenlijke catalogus van beschikbare werken;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
  - number: 8.b
    text: |-
      is onderdeel van het interbibliothecaire leenverkeer, bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel15
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '15'
        hoofdstuk: '3'
  - number: 8.c
    text: |-
      voert zijn collectiebeleid overeenkomstig het gezamenlijk collectieplan, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel10
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '10'
        hoofdstuk: '2'
  - number: 8.d
    text: maakt gebruik van een op de andere deelnemers afgestemde digitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
  - number: 8.e
    text: stemt zijn administratie van leden en zijn algemene voorwaarden af op de andere deelnemers; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
  - number: 8.f
    text: ondersteunt het onderwijs.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel8
  - number: '9'
    text: |-
      De Koninklijke Bibliotheek verricht in aanvulling op de taken, bedoeld in
      [artikel 1.5, tweede lid, van de WHW][ref1], de volgende taken:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 9.a
    text: 'aansturen van het netwerk van openbare bibliotheekvoorzieningen door:'
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: 9.a.i
    text: afstemming en coördinatie;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: 9.a.ii
    text: educatie, informatie en reflectie; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: 9.a.iii
    text: vertegenwoordiging en promotie;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: 9.b
    text: in stand houden van de landelijke digitale bibliotheek; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: 9.c
    text: verzorgen van een bibliotheekvoorziening van noodzakelijk omgezette werken voor personen met een handicap.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      De Koninklijke Bibliotheek stelt elke vier jaar voor de deelnemers aan het netwerk, bedoeld in [artikel 7][ref1],
      een gezamenlijk collectieplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel7
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '7'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      Het collectieplan heeft tot doel samenhang te bewerkstelligen tussen de fysieke en digitale collecties van de
      openbare bibliotheekvoorzieningen. Het biedt een kader voor het samenstellen en beheren van de collectie door een
      voorziening.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel10
  - number: '10.3'
    text: |-
      De Koninklijke Bibliotheek stelt het gezamenlijk collectieplan vast in overeenstemming met vertegenwoordigers van
      de lokale bibliotheken en provinciale ondersteuningsinstellingen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Ten behoeve van de gezamenlijke catalogus voor de landelijke digitale bibliotheek verstrekken lokale bibliotheken
      en provinciale ondersteuningsinstellingen gegevens over de collectie en de beschikbaarheid daarvan aan de
      Koninklijke Bibliotheek.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel11
  - number: '11.2'
    text: |-
      Ten behoeve van de beleidsontwikkeling verstrekken lokale bibliotheken, de provinciale ondersteuningsinstellingen
      en de Koninklijke Bibliotheek aan Onze Minister gegevens over de desbetreffende openbare bibliotheekvoorziening die
      niet tot de persoon herleidbare gegevens van gebruikers en personeel betreffen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      De Koninklijke Bibliotheek stelt de aard van de gegevens, bedoeld in het eerste lid, nader vast en stelt regels
      over het tijdstip en de wijze waarop de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel11
  - number: '11.4'
    text: |-
      Onze Minister stelt de aard van de gegevens, bedoeld in het tweede lid, nader vast en stelt regels over het
      tijdstip en de wijze waarop de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een ieder die als ingezetene is ingeschreven in de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref1], of in een basisadministratie als bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref2] kan lid worden van de openbare bibliotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '2'
  - number: '12.2'
    text: |-
      Het lidmaatschap bij de openbare bibliotheek kan het gebruik van een fysieke voorziening, de digitale voorziening
      of beide voorzieningen omvatten.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel12
  - number: '12.3'
    text: Een fysieke voorziening is een lokale bibliotheek, de digitale voorziening is de landelijke digitale bibliotheek.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister of het college van burgemeester en wethouders of bestuurscollege kan bepalen dat ook andere groepen
      natuurlijke personen lid van de landelijke digitale bibliotheek onderscheidenlijk een lokale bibliotheek kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voor het uitlenen van gedrukte werken door lokale bibliotheken aan personen beneden de leeftijd van achttien jaren
      wordt geen contributie of andere geldelijke bijdrage geheven, tenzij het college van burgemeester en wethouders of
      het bestuurscollege heeft besloten dat een geldelijke bijdrage wordt geheven. De contributie of andere geldelijke
      bijdrage bedraagt ten hoogste de helft van de contributie of andere geldelijke bijdrage die wordt geheven van
      personen die achttien jaren of ouder zijn.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voor het uitlenen van overige werken door lokale bibliotheken aan personen beneden de leeftijd van achttien jaren
      wordt ten hoogste de helft van de contributie of andere geldelijke bijdrage geheven van die geldt voor personen
      van boven de achttien jaren. Voor personen beneden de leeftijd van achttien jaren wordt geen tarief als bedoeld
      in [artikel 14][ref1], contributie of geldelijke bijdrage vastgesteld voor de toegang tot door de Koninklijke
      Bibliotheek aangewezen digitale werken.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel14
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '14'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De Koninklijke Bibliotheek kan na overleg met vertegenwoordigers van de lokale bibliotheken tarieven vaststellen
      voor de toegang tot digitale werken of het gebruik van digitale diensten of bronnen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel14
  - number: '15.1'
    text: |-
      Alle lokale bibliotheken en provinciale ondersteuningsinstellingen nemen deel aan het interbibliothecaire
      leenverkeer.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel15
  - number: '15.2'
    text: 'Deelname aan het interbibliothecaire leenverkeer houdt in ieder geval in:'
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel15
  - number: 15.2.a
    text: |-
      op verzoek van een lokale bibliotheek ter beschikking stellen van fysieke werken ten behoeve van gebruikers van
      die bibliotheek;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel15
  - number: 15.2.b
    text: |-
      op verzoek van een gebruiker doen van een verzoek als bedoeld in onderdeel a aan de daarvoor in aanmerking komende
      bibliotheek; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel15
  - number: 15.2.c
    text: distributie van fysieke werken door provinciale ondersteuningsinstellingen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel15
  - number: '16.1'
    text: |-
      Een provinciale ondersteuningsinstelling is verantwoordelijk voor de distributie van fysieke werken door middel
      van het interbibliothecaire leenverkeer binnen de provincie of provincies waardoor zij wordt gesubsidieerd of in
      stand gehouden.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel16
  - number: '16.2'
    text: 'De provinciale ondersteuningsinstellingen zijn gezamenlijk verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel16
  - number: 16.2.a
    text: distributie van fysieke werken door middel van het interbibliothecaire leenverkeer tussen de provincies; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel16
  - number: 16.2.b
    text: |-
      ontwikkeling van innovaties ten behoeve van de lokale bibliotheken, in overeenstemming met de Koninklijke
      Bibliotheek in verband met haar coördinerende taak.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel16
  - number: '17.1'
    text: 'Het in stand houden van de landelijke digitale bibliotheek door de Koninklijke Bibliotheek houdt in ieder geval in:'
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
  - number: 17.1.a
    text: ontwikkelen en beheren van de digitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
  - number: 17.1.b
    text: |-
      beheren en van context voorzien van de digitale collectie en de afstemming met de collectie digitale werken van de
      Koninklijke Bibliotheek op grond van [artikel 1.5, tweede lid, van de WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 17.1.c
    text: opstellen van een reglement voor de toegang tot digitale werken;
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
  - number: 17.1.d
    text: bereiken van verschillende doelgroepen; en
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
  - number: 17.1.e
    text: samenwerken met andere publieke aanbieders van digitale werken.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
  - number: '17.2'
    text: |-
      De Koninklijke Bibliotheek gaat in een apart onderdeel van het instellingsplan, bedoeld in
      [artikel 2.2a van de WHW][ref1], in op de wijze waarop zij de landelijke digitale bibliotheek in stand houdt. Zij
      gaat daarbij specifiek in op de onderdelen, bedoeld in het eerste lid. Dit onderdeel van het instellingsplan heet
      beheerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '18.1'
    text: |-
      De Koninklijke Bibliotheek verricht namens de Staat der Nederlanden het inkopen van werken voor de landelijke
      digitale bibliotheek.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister stelt jaarlijks aan de Koninklijke Bibliotheek een bedrag ter beschikking voor het inkopen van
      werken.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel18
  - number: '18.3'
    text: |-
      De inkoop wordt uitsluitend verricht op voordracht van vertegenwoordigers van de lokale bibliotheken, welke is
      afgestemd op het bedrag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel18
  - number: '19.1'
    text: |-
      De Koninklijke Bibliotheek ontvangt voor de vervulling van haar taken, bedoeld in [artikel 9][ref1], een aanvulling
      op haar rijksbijdrage, bedoeld in [artikel 2.6a van de WHW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '19.2'
    text: |-
      Op de aanvulling is [artikel 2.6a van de WHW][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '19.3'
    text: |-
      De Koninklijke Bibliotheek geeft invulling aan en legt beleidsmatig en financieel verantwoording af over de
      vervulling van haar taken, bedoeld in artikel 9, in een daartoe apart opgenomen onderdeel van:
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
  - number: 19.3.a
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2a van de WHW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 19.3.b
    text: |-
      de begroting, bedoeld in [artikel 2.8 van de WHW][ref1], waarin een allocatie van middelen is opgenomen die
      overeenstemt met het instellingsplan; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 19.3.c
    text: |-
      in de jaarverslaglegging, bedoeld in [artikel 2.9 van de WHW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '19.4'
    text: |-
      De [hoofdstukken 2][ref1], [3][ref2], [4][ref3], [13][ref4], [14][ref5] en [15 van de WHW][ref6], zijn voor zover
      zij betrekking hebben op de Koninklijke Bibliotheek, van overeenkomstige toepassing op haar taakvervulling op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk13
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk14
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk15
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '13'
      - id: ref5
        bwb_id: BWBR0005682
        hoofdstuk: '14'
      - id: ref6
        bwb_id: BWBR0005682
        hoofdstuk: '15'
  - number: '20.1'
    text: |-
      Ten behoeve van de taken, bedoeld in [artikel 9][ref1], kan de Koninklijke Bibliotheek subsidie verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
        hoofdstuk: '2'
  - number: '20.2'
    text: |-
      Indien de Koninklijke Bibliotheek subsidie verstrekt stelt het algemeen bestuur een reglement vast waarin in ieder
      geval wordt vastgelegd de werkwijze, de procedures en de criteria die het bestuur bij het verstrekken van subsidies
      hanteert, alsmede de verplichtingen die aan de subsidieontvanger worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel20
  - number: '20.3'
    text: |-
      In een reglement kunnen ook regels worden gesteld met betrekking tot de vaststelling van een subsidieplafond en de
      wijze van verdeling daarvan, de betaling en terugvordering van de subsidie alsmede de verlening van voorschotten op
      de subsidie. Onze Minister kan met betrekking tot genoemde onderwerpen het algemeen bestuur voorschrijven ter zake
      een reglement te wijzigen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel20
  - number: '20.4'
    text: |-
      Een besluit tot vaststelling van een reglement of een wijziging daarvan treedt slechts in werking na goedkeuring
      door Onze Minister. Goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel20
  - number: '20.5'
    text: |-
      Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van de beslissing
      omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister kan ten behoeve van het netwerk van openbare bibliotheekvoorzieningen in bijzondere gevallen subsidie
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel21
  - number: '21.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor het verstrekken van subsidie.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel21
  - number: '22.1'
    text: |-
      Bij het uitvoeren van de taken, bedoeld in [artikel 9][ref1], streeft de Koninklijke Bibliotheek er naar de
      eigendom of een overdraagbaar gebruiksrecht te verkrijgen van bij die uitvoering gevestigde intellectuele
      eigendomsrechten.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
        hoofdstuk: '2'
  - number: '22.2'
    text: |-
      Op verzoek van Onze Minister werkt de Koninklijke Bibliotheek mee aan het tot stand komen van een overeenkomst
      tot het overdragen aan de Staat der Nederlanden van de rechten, bedoeld in het eerste lid. Voor zover wettelijk
      mogelijk, doet zij afstand van persoonlijkheidsrechten als bedoeld in de Auteurswet die haar of haar personeel
      toebehoren.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel22
  - number: '23.1'
    text: |-
      Met het toezicht op de naleving van de verplichtingen die van toepassing zijn op een subsidieontvanger bij
      verstrekking van subsidie als bedoeld in [artikel 21][ref1], zijn belast de bij besluit van Onze Minister
      aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel21
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '21'
        hoofdstuk: '5'
  - number: '23.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '23.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel23
  - number: '23.4'
    text: |-
      Aan door Onze Minister verstrekte subsidies is de verplichting verbonden dat de subsidieontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij het uitoefenen van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel23
  - number: '29'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel29
  - number: '30'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet stelsel openbare bibliotheekvoorzieningen.'
    url: https://wetten.overheid.nl/BWBR0035878/2015-01-01#Artikel31
