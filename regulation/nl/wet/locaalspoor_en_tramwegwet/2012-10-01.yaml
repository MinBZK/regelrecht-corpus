  - number: '5.2'
    text: |-
      Onder voorbehoud van [afdeling 5 van titel 2 van Boek 8 van het Burgerlijk Wetboek](onbekend) is de ondernemer
      verantwoordelijk voor de schade door de reizigers bij de uitoefening van den dienst geleden, ten ware de schade
      buiten zijne schuld of die zijner beambten of bedienden zij ontstaan.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
  - number: '5.3'
    text: 'Bij algemeenen maatregel van bestuur wordt geregeld:'
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
  - number: 5.3.a
    text: |-
      hetgeen ter verzekering van het veilig en ordelijk verkeer over deze spoorwegen en omtrent de aankondiging van de
      opening en van de regeling van den dienst, alsmede omtrent de openbaarmaking van de tarieven is voor te schrijven;
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
  - number: 5.3.b
    text: |-
      de wijze, waarop ten aanzien van deze spoorwegen, op verzoek van bestuurders van den spoorwegdienst, het tweede lid
      van dit artikel op tot vervoer aangenomen goederen van toepassing kan worden verklaard, en de [artikelen 3][ref1],
      [25][ref2] en [27 der in artikel 4 aangehaalde wet][ref3] behoudens voor te schrijven afwijkingen van toepassing
      kunnen worden verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel27
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '27'
  - number: 5.3.c
    text: |-
      de wijze, waarop ten aanzien van niet op openbare wegen aangelegde gedeelten van deze spoorwegen de artikelen
      33*a*, 36 tot en met 41 en 68 der in [artikel 4][ref1] aangehaalde wet behoudens voor te schrijven afwijkingen van
      toepassing kunnen worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel4
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '4'
  - number: '5.4'
    text: De ondernemer is verplicht tot uitoefening van de dienst overeenkomstig de vastgestelde dienstregeling.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel5
  - number: '6.1'
    text: |-
      Op spoorwegen, welke niet voor openbaar vervoer van personen of van goederen zijn opengesteld, zijn
      [artikel 1][ref1] en de in [artikel 4][ref2] aangehaalde wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel4
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001866
        artikel: '4'
  - number: '6.2'
    text: |-
      Bij algemeenen maatregel van bestuur kunnen voorschriften worden gegeven ter verzekering van het veilig gebruik
      van deze spoorwegen, indien zij aansluiten aan spoorwegen, in de in [artikel 4][ref1] aangehaalde wet bedoeld, aan
      locaalspoorwegen, aan stadsspoorwegen of aan tramwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel4
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '4'
  - number: '7.1'
    text: |-
      De Staten der provinciën zijn bevoegd omtrent den dienst en het gebruik van tramwegen voor spoorweggedeelten op
      openbare wegen aangelegd voorschriften te geven voor zooveel betreft punten, waaromtrent in [artikel 5][ref1] niet
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel5
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '5'
  - number: '7.2'
    text: |-
      Indien bijzondere omstandigheden van plaatselijken aard in eene gemeente voorschriften noodig maken omtrent
      den dienst en het gebruik van locaalspoorwegen of van tramwegen, kunnen deze voorschriften, voor zoover zij
      spoorweggedeelten betreffen op openbare wegen aangelegd, door den gemeenteraad worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel7
  - number: '7.3'
    text: |-
      De [artikelen 139 tot en met 144][ref1] en [artikel 154 van de Gemeentewet][ref2] (*Stb.* , ) zijn op deze
      plaatselijke verordening van toepassing. Van de intrekking van deze verordening geschiedt binnen acht dagen
      mededeling aan Ons.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '154'
  - number: '7.4'
    text: |-
      De Staten der provinciën en de gemeenteraden zijn bevoegd omtrent het veilig gebruik van spoorwegen, in
      [artikel 6, tweede lid][ref1], bedoeld, voor spoorweggedeelten op openbare wegen aangelegd voorschriften te
      geven voor zooveel betreft punten, waaromtrent bij den aldaar bedoelden algemeenen maatregel van bestuur niet is
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel6
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '6'
  - number: '8.1'
    text: |-
      Op spoorwegen, waarop geen ander vervoer plaats heeft dan personenvervoer binnen ééne gemeente, zijn
      [artikel 1][ref1] en de in [artikel 4][ref2] aangehaalde wet niet van toepassing. [Artikel 5, vierde lid][ref3],
      blijft op deze spoorwegen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001866#Artikel5
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001866
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0001866
        artikel: '5'
  - number: '8.2'
    text: |-
      Met die spoorwegen kunnen door Ons, den Raad van State gehoord, worden gelijk gesteld spoorwegen of
      spoorweggedeelten, waarop in hoofdzaak geen ander dan zoodanig vervoer plaats heeft, of welke uit anderen hoofde
      niet van aanmerkelijke beteekenis zijn voor het doorgaand verkeer.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel8
  - number: '8.3'
    text: |-
      Bij Ons besluit tot gelijkstelling kan worden bepaald, dat de artikelen 2 en 3 op in dat besluit bedoelde
      spoorwegen of spoorweggedeelten van toepassing blijven.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel8
  - number: '8.4'
    text: De voorgaande leden zijn niet van toepassing op stadsspoorwegen.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel8
  - number: '9.1'
    text: |-
      Overtreding van de bepalingen van: [artikel 5][ref1], de in [artikel 5][ref2] toepasselijk verklaarde
      wetsartikelen, voor zooveel deze overtreding betrekking heeft op tramwegen, daaronder begrepen niet-naleving
      van artikel 35, tweede lid, der in [artikel 4][ref3] aangehaalde wet door de bij artikel 63, tweede lid, dier
      wet deswege aansprakelijk gestelden, de in de [artikelen 4][ref4], [4a][ref5], [5][ref6] en [6][ref7] bedoelde
      algemeene maatregelen van bestuur, wordt gestraft met geldboete van de eerste categorie


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0001866#Artikel4a
      [ref6]: https://wetten.overheid.nl/BWBR0001866#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0001866#Artikel6
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001866
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001866
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001866
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0001866
        artikel: 4a
      - id: ref6
        bwb_id: BWBR0001866
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0001866
        artikel: '6'
  - number: '9.2'
    text: |-
      De beambten en bedienden zijn niet strafbaar zoo hunne overtreding een gevolg is van den last, door de bestuurders
      van den spoorwegdienst gegeven.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel9
  - number: '9.3'
    text: |-
      Die beambten en bedienden kunnen de reizigers, die zich aan overtreding der bepalingen van den in de
      [artikelen 4][ref1], [4a][ref2] en [5][ref3] bedoelden algemeenen maatregel van bestuur schuldig maken, uit de
      rijtuigen weren of verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0001866#Artikel5
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '4'
