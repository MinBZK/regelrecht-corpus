        artikel: '5'
  - number: '9.4'
    text: |-
      Overtreding van [artikel 3][ref1] wordt gestraft met hechtenis van ten hoogste *zes maanden* of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel3
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '3'
  - number: '9.5'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van het in [artikel 3][ref1] neergelegde verbod, alsmede ter handhaving van de in de [artikelen 4][ref2],
      [4a][ref3], [5][ref4] en [6][ref5] bedoelde algemene maatregelen van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001866#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0001866#Artikel5
