preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodig is den dienst en het gebruik van spoorwegen, waarop
    uitsluitend met beperkte snelheid wordt vervoerd, nader te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat bepaalt, welke spoorwegen in de zin dezer wet als locaalspoorwegen, welke
      als stadsspoorwegen en welke als tramwegen worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel1
  - number: '1.2'
    text: |-
      Als tramwegen beschouwde spoorwegen, welke alleen voor vervoer van goederen bestemd zijn, kunnen door
      Onzen Minister voornoemd, bestuurders van den spoorwegdienst gehoord, ten deele met locaalspoorwegen worden
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Spoorwegwet: [Spoorwegwet 1875][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: '2.1'
    text: |-
      Voor de aanleg van een locaalspoorweg, een stadsspoorweg of een tramweg en de uitoefening van de dienst op die
      locaalspoorweg, die stadsspoorweg of die tramweg wordt een door Ons of met Onze machtiging verleende concessie
      vereist.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel2
  - number: '2.2'
    text: De concessie wordt niet verleend, dan nadat Gedeputeerde Staten zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel2
  - number: '2.3'
    text: |-
      De concessie houdt, voor zooveel tramwegen betreft, voorschriften in ter verzekering, dat bepalingen omtrent
      rechten en verplichtingen der beambten en bedienden van den spoorwegdienst worden onderworpen aan de instemming van
      Onzen Minister voornoemd, en door dezen kunnen worden vastgesteld, voor zooveel overeenstemming met bestuurders van
      den spoorwegdienst ontbreekt.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel2
  - number: '2.4'
    text: |-
      Ten aanzien van buitenlandsche spoorwegdiensten, welke mede hier te lande worden uitgeoefend, kan worden afgeweken
      van het bepaalde in het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel2
  - number: '3'
    text: |-
      Uitoefening van den dienst op een locaalspoorweg, op een stadsspoorweg of op een tramweg is den bestuurders
      verboden, tenzij eene concessie, als bedoeld in [artikel 2][ref1], van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel2
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '2'
  - number: '4.1'
    text: |-
      Bij algemeenen maatregel van bestuur kunnen omtrent den dienst en het gebruik van locaalspoorwegen
      bepalingen worden gemaakt, waarbij wordt afgeweken van de [artikelen 27][ref1], [33][ref2] en
      [36, tweede lid, van de Spoorwegwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel36
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '36'
  - number: '4.2'
    text: |-
      Zijn gedeelten van die spoorwegen op openbare wegen aangelegd, dan kan daarvoor ook van [artikel 1][ref1] dier
      wet worden afgeweken, behalve met betrekking tot de verantwoordelijkheid ten aanzien van reizigers en tot vervoer
      aangenomen goederen, alsmede van de [artikelen 34][ref2], [35][ref3], [43][ref4] en [44 dier wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel44
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '43'
      - id: ref5
        bwb_id: BWBR0001848
        artikel: '44'
  - number: 4a.1
    text: |-
      Op stadsspoorwegen zijn van de in [artikel 4 aangehaalde wet hoofdstuk III][ref1] en [artikel 35][ref2] niet
      van toepassing. Het bij of krachtens de [artikelen 27][ref3] en [52][ref4] bepaalde inzake goederen is op deze
      spoorwegen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel52
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '52'
  - number: 4a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen omtrent de dienst op, alsmede de afsluiting van
      stadsspoorwegen bepalingen worden vastgesteld, waarbij wordt afgeweken van de [artikelen 26][ref1] en
      [34 van de in artikel 4 aangehaalde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel34
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '34'
  - number: 4a.3
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van stadsspoorwegdiensten onder beheer van een publiekrechtelijk
      lichaam worden bepaald, dat voor de naleving van die algemene maatregel van bestuur zij als bestuurders worden
      aangemerkt, die door dit publiekrechtelijk lichaam aan het hoofd van die stadsspoorwegdienst zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4a
  - number: 4a.4
    text: |-
      Indien het gezag, gesteld boven de bestuurders, in het vorige lid bedoeld, deze de middelen onthoudt, welke nodig
      zijn hen in staat te stellen de verplichtingen na te komen, welke bij of krachtens de in het vorige lid bedoelde
      algemene maatregel van bestuur op hen zijn gelegd, wordt echter dat gezag als bestuurder aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel4a
  - number: '5.1'
    text: |-
      Op tramwegen zijn van de in [artikel 4][ref1] aangehaalde wet van toepassing de [artikelen 4][ref2], [5][ref3],
      [7][ref4], [9 tot en met 12][ref5], [16][ref6], [17][ref7], [20 tot en met 22][ref8], [42][ref9], [69][ref10]
      en [71][ref11]; de [artikelen 34][ref12], [35][ref13], [43][ref14] en [44][ref15] zijn van toepassing op
      spoorweggedeelten niet op openbare wegen aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel5
