  - number: '10.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing ten aanzien van de in [artikel 10 van de Spoorwegwet][ref4] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel10
    references:
