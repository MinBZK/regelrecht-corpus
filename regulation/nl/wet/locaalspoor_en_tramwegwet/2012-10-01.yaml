  - number: '9.6'
    text: |-
      Ten aanzien van beschadiging van waterstaatswerken, in beheer of onderhoud bij ondernemers van locaal-, stadsspoor-
      of tramwegdiensten, voor welke schippers, reeders, eigenaars of gebruikers van vaartuigen of vlotten volgens de wet
      aansprakelijk zijn, vindt § 6a der [Waterstaatswet 1900][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001867
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001867
  - number: '10.1'
    text: |-
      Met de opsporing van de bij [artikel 9][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de in [artikel 10 van de Spoorwegwet][ref3]
      bedoelde ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179][ref4] tot en met [182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel10
    references:
