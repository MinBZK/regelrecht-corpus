        artikel: '10'
  - number: '10.3'
    text: |-
      Ook zijn tot het opsporen der overtredingen in [artikel 9][ref1] bedoeld bevoegd de beambten en bedienden van den
      spoorweg, beëedigd volgens regelen bij algemeenen maatregel van bestuur te stellen, over de geheele uitgestrektheid
      van den weg, waarop zij dienst doen, en binnen den kring van honderd meter aan beide zijden van dien weg.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel9
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '9'
  - number: '11'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel11
  - number: '13'
    text: De wet van 28 October 1889 (*Staatsblad* n°. 146) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel13
  - number: '14'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001866/2012-10-01#Artikel14
