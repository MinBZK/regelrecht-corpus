  - number: '1'
    text: |-
      Mandaten, ondermandaten, volmachten en machtigingen die op 13 oktober 2010 van kracht waren ten behoeve van
      functionarissen van het Ministerie van Justitie ten aanzien van de aangelegenheden die de hieronder onder d en f
      tot en met k bedoelde dienstonderdelen van het Ministerie van Justitie betroffen, worden aangemerkt als mandaten,
      volmachten en machtigingen die zijn verleend door de Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel
      de Minister voor Immigratie en Asiel aan:

      a. de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. de directeur-generaal belast met de zorg voor Immigratie en Asiel;

      c. de directeur-generaal belast met de zorg voor de uitvoering van de [Rijkswet op het Nederlanderschap][ref1];

      d. de directeur van de directie Migratiebeleid;

      e. de directeur belast met de zorg voor de uitvoering van de [Rijkswet op het Nederlanderschap][ref2];

      f. de algemeen directeur van de dienst Terugkeer en Vertrek;

      g. het hoofd van het secretariaat van de Commissie Integraal Toezicht Terugkeer;

      h. het hoofd van het secretariaat van de Adviescommissie voor vreemdelingenzaken;

      i. de hoofddirecteur van de Immigratie- en Naturalisatiedienst;

      j. de functionarissen aan wie door of namens de algemeen directeur van de dienst Terugkeer en Vertrek ondermandaat,
      volmacht of machtiging is verleend;

      k. de functionarissen aan wie door of namens de hoofddirecteur van de Immigratie- en Naturalisatiedienst
      ondermandaat, volmacht of machtiging is verleend;

      ten aanzien van de aangelegenheden die hun dienstonderdelen betreffen.


