  - number: '6'
    text: |-
      1 Het totale bedrag, bedoeld in [artikel 5, tweede lid][ref1], kan in het jaar waarop het bedrag betrekking heeft
      en in het daaropvolgende jaar bij wet worden verhoogd indien de ontwikkeling van de uitkeringslasten daartoe
      aanleiding geeft.

      2 Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 5, eerste lid][ref2], wordt verhoogd binnen een periode van vier weken na de herziening door Onze Minister
      vastgesteld.

      3 Indien toepassing is gegeven aan het tweede lid wordt voor de toepassing van de [artikelen 7][ref3] en
      [8][ref4], onder het bedrag van de uitkering verstaan: het bedrag van de uitkering inclusief de verhoging, bedoeld
      in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011670#Artikel5
