  - number: '9'
    text: |-
      Onze Minister stelt regels inzake de betaling van:

      a. de uitkering, bedoeld in [artikel 5, eerste lid][ref1];

      b. het bedrag waarmee de uitkering op grond van [artikel 6][ref2] wordt verhoogd;

      c. de aanvullende uitkering, bedoeld in [artikel 8][ref3].


