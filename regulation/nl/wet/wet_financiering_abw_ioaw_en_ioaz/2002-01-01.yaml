  - number: '2'
    text: |-
      De door burgemeester en wethouders van een gemeente toegekende algemene bijstand, bijzondere bijstand, bijstand
      ter voorziening in de behoefte aan bedrijfskapitaal, bijstand ter voorziening in met de voorbereiding van een
      bedrijf of zelfstandig beroep samenhangende kosten, uitkeringen op grond van de [IOAW][ref1] en de [IOAZ][ref2] en
      de hiermee verband houdende uitvoeringskosten komen ten laste van die gemeente, voorzover in deze wet niet anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0011670/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: '3'
    text: |-
      1 Onze Minister vergoedt, ten laste van 's Rijks kas, 75% van de in een kalenderjaar ten laste van de gemeente
      gebleven kosten van:

      a. algemene bijstand, waaronder begrepen de loonbelasting, premies volksverzekeringen en de ziekenfondspremie
      die daarover verschuldigd zijn, voorzover de algemene bijstand niet bij wijze van voorschot op grond van
      [artikel 74 van de Abw][ref1] is verleend;

      b. bijstand ter voorziening in de behoefte aan bedrijfskapitaal;

      c. bijstand ter voorziening in met de voorbereiding van een bedrijf of zelfstandig beroep samenhangende kosten;

      d. uitkeringen op grond van de [IOAW][ref2], waaronder begrepen de premies volksverzekeringen en de
      ziekenfondspremie die daarover verschuldigd zijn;

      e. uitkeringen op grond van de [IOAZ][ref3], waaronder begrepen de premies volksverzekeringen en de
      ziekenfondspremie die daarover verschuldigd zijn.

      2 In afwijking van het eerste lid, onderdelen a, b en c, is de vergoeding 100% indien de bijstand is verleend met
      toepassing van [artikel 63, tweede lid, van de Abw][ref4].

      3 Onder ten laste van de gemeente gebleven kosten, bedoeld in het eerste lid, wordt verstaan, de in een
      kalenderjaar door de gemeente verleende bijstand en uitkering, bedoeld in het eerste lid, onder a tot en met e,
      verminderd met alle ontvangsten van de gemeente in dat jaar in verband met de verlening van bijstand en uitkering,
      waaronder begrepen de bedragen die de gemeente ontvangt door toepassing van de artikelen [14a van de Abw][ref5],
      [20a van de IOAW][ref6] en [20a van de IOAZ][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0004044
