preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om nieuwe regels te stellen met betrekking tot de
    financiering van de Algemene bijstandswet, deWet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte
    werkloze werknemers en de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen,
    teneinde aan gemeenten een verdere stimulans te bieden het beroep op deze regelingen te verminderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011670/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Abw: [Algemene bijstandswet][ref1];

      c. IOAW: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2];

      d. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];

      e. algemene bijstand: bijstand als bedoeld in [artikel 6, onder a, van de Abw][ref4];

      f. bijzondere bijstand: bijstand als bedoeld in [artikel 6, onder b, van de Abw][ref5];

      g. bijstand ter voorziening in de behoefte aan bedrijfskapitaal: bijstand als bedoeld in
      [artikel 8, vijfde lid, van de Abw][ref6];

      h. bijstand ter voorziening in met de voorbereiding van een bedrijf ofzelfstandig beroep samenhangende kosten:
      bijstand als bedoeld in [artikel 8, zesde lid, onder c, van de Abw][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004044
