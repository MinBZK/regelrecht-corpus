  - number: '22'
    text: |-
      1 De bij of krachtens de [artikelen 134][ref1] en [136 van de Abw][ref2] gestelde regels, zoals deze luidden
      voor de inwerkingtreding van deze wet, blijven van toepassing op de vergoeding van voor de inwerkingtreding van
      deze wet ten laste van de gemeente gebleven kosten van algemene bijstand, bijstand ter voorziening in de kosten
      van bedrijfskapitaal en bijstand ter voorziening in met de voorbereiding van een bedrijf of zelfstandig beroep
      samenhangende kosten.

      2 [Artikel 134a van de Abw][ref3], zoals dit artikel luidde voor de inwerkingtreding van deze wet,
      blijft van toepassing op voor de inwerkingtreding van deze wet door de gemeente ontvangen inkomsten uit
      hoofde van terugvordering en verhaal als bedoeld in [Hoofdstuk VI, paragraaf 2][ref4], respectievelijk
      [Hoofdstuk VII van de Abw][ref5].

      3 De bij of krachtens [artikel 137 van de Abw][ref6] gestelde regels, zoals deze luidden voor de inwerkingtreding
      van deze wet, blijven van toepassing op voor de inwerkingtreding van deze wet gemaakte kosten verband houdende met
      aan derden opgedragen onderzoek en rapportage inzake de verlening van bijstand aan zelfstandigen als bedoeld in
      [artikel 8 van de Abw][ref7], met aan derden opgedragen begeleiding van personen aan wie algemene bijstand wordt
      verstrekt als bedoeld in [artikel 8, tweede en zesde lid, van de Abw][ref8] en met de verlening van bijstand met
      toepassing van [artikel 63, tweede lid, van de Abw][ref9].


