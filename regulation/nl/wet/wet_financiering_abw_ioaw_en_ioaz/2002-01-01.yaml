  - number: '4'
    text: |-
      1 Onze Minister stelt regels met betrekking tot het verlenen van voorschotten op de vergoeding, bedoeld in
      [artikel 3][ref1].

      2 Indien de uitvoering van de [Abw][ref2], de [IOAW][ref3] of de [IOAZ][ref4] door burgemeester en wethouders,
      of de administratie, bedoeld in respectievelijk de [artikelen 117 van de Abw][ref5], [41 van de IOAW][ref6]
      of [41 van de IOAZ][ref7] ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast
      te stellen dan uit de op grond van het eerste lid gestelde regels voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0011670#Artikel3
