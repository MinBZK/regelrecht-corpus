    text: |-
      1 Onze Minister stelt de vergoeding, bedoeld in [artikel 12][ref1], vast binnen een jaar na ontvangst van
      het verslag, bedoeld in de [artikelen 130, tweede lid, van de Abw][ref2], [52, tweede lid, van de IOAW][ref3]
      en [52, tweede lid, van de IOAZ][ref4] en daarop betrekking hebbende verklaring, bedoeld
      in de [artikelen 130, vierde lid, van de Abw][ref5], [52, vierde lid, van de IOAW][ref6] en
      [52, vierde lid, van de IOAZ][ref7].

      2 Indien het verslag niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft of niet is
      voorzien van een daarop betrekking hebbende verklaring wordt de vergoeding ambtshalve vastgesteld.


