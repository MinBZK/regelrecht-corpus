  - number: '12'
    text: |-
      1 Onze Minister vergoedt ten laste van 's Rijks kas:

      a. aan gemeenten, bedoeld in [artikel 63, tweede lid, van de Abw][ref1], een bij ministeriële regeling te bepalen
      bedrag per besluit op een aanvraag van ondernemers in de binnenvaart om verlening van algemene bijstand, bijstand
      ter voorziening in de behoefte aan bedrijfskapitaal en bijstand ter voorziening in met de voorbereiding van een
      bedrijf of zelfstandig beroep samenhangende kosten;

      b. 90% van de kosten van aan derden opgedragen onderzoek inzake verlening van algemene bijstand en bijstand ter
      voorziening in de behoefte aan bedrijfskapitaal aan zelfstandigen als bedoeld in [artikel 8 van de Abw][ref2];

      c. 90% van de kosten van aan derden opgedragen begeleiding van personen aan wie algemene bijstand wordt verstrekt
      als bedoeld in [artikel 8, tweede en zesde lid, van de Abw][ref3];

      d. 90% van de kosten van bij de toepassing van [artikel 14, derde lid, van de IOAZ][ref4] aan derden opgedragen
      onderzoek.

      2 In afwijking van het eerste lid, onderdelen b en c, is de vergoeding 100%, indien het onderzoek of
      de begeleiding betrekking heeft op ondernemers of gewezen ondernemers in de binnenvaart als bedoeld in
      [artikel 63, tweede lid, van de Abw][ref5].

      3 Onder onderzoek, bedoeld in het eerste en tweede lid, wordt verstaan, een bedrijfseconomisch of bedrijfstechnisch
      onderzoek, waaronder begrepen de taxatie van vermogensbestanddelen, afgerond met een schriftelijke rapportage,
      voorzover dit onderzoek noodzakelijk is voor de uitvoering van de bij of krachtens [artikel 8 van de Abw][ref6] of
      [artikel 14, derde lid, van de IOAZ][ref7] gestelde regels.


