  - number: '7'
    text: |-
      1 Indien bij de vaststelling van de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 10][ref1],
      blijkt, dat de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 5, eerste lid][ref2], minder
      bedragen dan de volgens opgave van burgemeester en wethouders, bedoeld in [artikel 11][ref3], ten laste gebleven
      kosten, bedoeld in [artikel 5, eerste lid][ref4], en minder bedragen dan het bedrag van de uitkering, bedoeld in
      [artikel 5][ref5], wordt van de uitkering een bedrag teruggevorderd.

      2 Het terug te vorderen bedrag is:

      a. gelijk aan het verschil tussen de volgens opgave van burgemeester en wethouders, ten laste gebleven kosten,
      bedoeld in [artikel 5, eerste lid][ref6], en het op grond van [artikel 10][ref7] vastgestelde bedrag van de ten
      laste van de gemeente gebleven kosten, bedoeld in [artikel 5, eerste lid][ref8]; of, indien de volgens opgave van
      burgemeester en wethouders, ten laste gebleven kosten, bedoeld in [artikel 5, eerste lid][ref9], gelijk is aan of
      hoger is dan het bedrag van de uitkering,

      b. gelijk aan het verschil tussen het bedrag van de uitkering en het op grond van [artikel 10][ref10] vastgestelde
      bedrag van de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 5, eerste lid][ref11].


