  - number: '11'
    text: |-
      1 De volgens opgave van burgemeester en wethouders ten laste gebleven kosten worden bij de vaststelling, bedoeld in
      [artikel 10, eerste lid][ref1], buiten aanmerking gelaten indien:

      a. het bijstand betreft die is verleend in strijd met de bij of krachtens de [Abw][ref2] gestelde regels, of die
      niet of niet volledig overeenkomstig [hoofdstuk VI][ref3] en [VII van de Abw](onbekend) is of wordt teruggevorderd
      of verhaald;

      b. het uitkering betreft die is verleend in strijd met de bij of krachtens de [IOAW][ref4] of de [IOAZ][ref5]
      gestelde regels, of die niet of niet volledig overeenkomstig [hoofdstuk II, paragraaf 5, van de IOAW][ref6],
      respectievelijk [hoofdstuk II, paragraaf 5, van de IOAZ][ref7], is of wordt teruggevorderd;

      c. niet is voldaan aan de bij of krachtens de [artikelen 14][ref8] of [14a van de Abw][ref9], [20][ref10]
      of [20a van de IOAW][ref11] of [20][ref12] of [20a van de IOAZ][ref13] gestelde regels, voor een bedrag gelijk aan
      het bedrag waarmee de kosten zouden zijn verlaagd indien burgemeester en wethouders op een juiste wijze toepassing
      zouden hebben gegeven aan deze artikelen.

      2 Indien als gevolg van het niet hebben voldaan door burgemeester en wethouders aan de bij of krachtens
      de [artikelen 65 tot en met 71][ref14] en [117 van de Abw][ref15], [13 tot en met 19][ref16] en
      [41 van de IOAW][ref17], of [13 tot en met 19][ref18] en [41 van de IOAZ][ref19] gestelde regels, niet kan worden
      vastgesteld of en voor welk bedrag de ten laste van de gemeenten gebleven kosten buiten aanmerking moeten worden
      gelaten, wordt volgens door Onze Minister te stellen regels hiervoor een bedrag vastgesteld.

      3 Het eerste en tweede lid zijn niet van toepassing voorzover naar het oordeel van Onze Minister:

      a. de tekortkomingen van bijzondere aard of geringe betekenis zijn;

      b. burgemeester en wethouders zich voldoende hebben ingespannen om de tekortkomingen op te heffen.


