  - number: '5'
    text: |-
      1 Voor de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 3][ref1], die op grond van het eerste
      lid van dat artikel niet voor vergoeding in aanmerking komen, verstrekt Onze Minister jaarlijks ten laste van 's
      Rijks kas aan de gemeente een uitkering, met dien verstande dat geen uitkering wordt verstrekt voor op grond van
      [artikel 74 van de Abw][ref2] verleende algemene bijstand. De uitkering wordt ten minste drie maanden voorafgaande
      aan het kalenderjaar waarop zij betrekking heeft door Onze Minister vastgesteld.

      2 Het bedrag van de uitkering wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      berekend aan de hand van het voor ieder jaar bij wet vast te stellen totale bedrag dat beschikbaar is voor de
      uitkeringen, bedoeld in het eerste lid. Bij of krachtens deze maatregel kunnen regels worden gesteld omtrent het
      verzamelen en vaststellen van gegevens noodzakelijk voor de berekening van het bedrag van de uitkering.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011670#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel74
    url: https://wetten.overheid.nl/BWBR0011670/2002-01-01#Artikel5
