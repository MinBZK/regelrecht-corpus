  - number: '10'
    text: |-
      1 Onze Minister stelt de ten laste van de gemeente gebleven kosten, bedoeld in de[artikelen 3][ref1]
      en [5][ref2], de vergoeding, bedoeld in [artikel 3][ref3], het terug te vorderen bedrag, bedoeld
      in [artikel 7][ref4] en de aanvullende uitkering, bedoeld in [artikel 8][ref5], vast, binnen een
      jaar na ontvangst van het verslag, bedoeld in de [artikelen 130, derde lid, van de Abw][ref6],
      [52, derde lid, van de IOAW][ref7] en [52, derde lid, van de IOAZ][ref8] en de daarop betrekking hebbende
      verklaring, bedoeld in de [artikelen 130, vijfde lid, van de Abw][ref9], [52, vijfde lid, van de IOAW][ref10] en
      [52, vijfde lid, van de IOAZ][ref11].

      2 Indien het verslag niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft of niet
      is voorzien van een daarop betrekking hebbende verklaring worden de ten laste van de gemeente gebleven kosten
      ambtshalve vastgesteld.


