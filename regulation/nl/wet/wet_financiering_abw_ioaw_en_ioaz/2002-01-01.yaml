      uitkeringen op grond van de [IOAW][ref5] respectievelijk de [IOAZ][ref6] en op de vergoeding van voor de
      inwerkingtreding van deze wet gemaakte kosten verband houdende met aan derden opgedragen onderzoek als bedoeld in
      [artikel 14, derde lid, van de IOAZ][ref7].


