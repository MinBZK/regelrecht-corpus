  - number: '23'
    text: |-
      De bij of krachtens de [artikelen 57][ref1] en [59 van de IOAW][ref2] en [57][ref3] en [59 van de IOAZ][ref4]
      gestelde regels, zoals deze luidden voor de inwerkingtreding van deze wet, blijven van toepassing op
