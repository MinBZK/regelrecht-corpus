  - number: '15'
    text: |-
      De kosten, bedoeld in [artikel 12, eerste lid, onder b, c en d, en tweede lid][ref1], worden niet vergoed:

      a. indien het onderzoek of de begeleiding is opgedragen aan een deskundige derde die onder verantwoordelijkheid van
      burgemeester en wethouders werkzaam is;

      b. voorzover zij hoger zijn dan de door Onze Minister vast te stellen maximaal voor vergoeding in aanmerking
      komende kosten voor onderzoek of begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011670#Artikel12
