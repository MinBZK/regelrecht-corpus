---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsregeling_strategische_goederen_2012
regulatory_layer: WET
publication_date: '2021-08-30'
valid_from: '2021-09-09'
bwb_id: BWBR0030610
url: https://wetten.overheid.nl/BWBR0030610/2021-09-09
preamble:
  text: |-
    Gelet op verordening (EG) nr. 428/2009 van de Raad van 5 mei 2009 tot instelling van een communautaire regeling
    voor de controle op de uitvoer, de overbrenging, de tussenhandel en de doorvoer van producten voor tweeërlei
    gebruik (PbEU 2009, L 134), richtlijn 2009/43/EG van het Europees Parlement en de Raad van 6 mei 2009 betreffende
    de vereenvoudiging van de voorwaarden voor de overdracht van defensiegerelateerde producten binnen de Gemeenschap
    (PbEU 2009, L 146) en de artikelen 1, 4b, derde lid, 6, eerste lid, 7, derde lid, 10, tweede en derde lid, 12,
    eerste lid, 14, derde lid, 16, tweede en derde lid, 17, tweede lid, 19, eerste lid, 21, vierde lid, 24, tweede en
    derde lid, 25, tweede lid, 26, tweede lid, en 27, derde lid, van het Besluit strategische goederen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* het [Besluit strategische goederen][ref1];
        - *ERA:* het Europees Ruimte Agentschap in Noordwijk, opgericht bij het Verdrag tot oprichting van het Europees
      Ruimte Agentschap (Trb. 1990, 43);
        - *gemeenschappelijke EU-lijst van militaire goederen:* de lijst van goederen waarop het Gemeenschappelijk
      standpunt 2008/944/GBVB van de Raad van 8 december 2008 tot vaststelling van gemeenschappelijke voorschriften voor
      de controle op de uitvoer van militaire goederen en technologie (PbEU 2008, L 335) van toepassing is;
        - *inspecteur:* de directeur-generaal Douane;
        - *Joint Force Command Brunssum:* het te Brunssum gevestigde hoofdkwartier, bedoeld in de Overeenkomst tussen
      het Koninkrijk der Nederlanden en het Algemeen Hoofdkwartier van de Geallieerde Mogendheden in Europa inzake de
      bijzondere voorwaarden die toepasselijk zijn op de vestiging en het functioneren van internationale militaire
      hoofdkwartieren binnen het Europese grondgebied van het Koninkrijk der Nederlanden (Trb. 1964, 131);
        - *Minister:* de Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking;
        - *NAVO-strijdkrachten:* de strijdkrachten van een vreemde mogendheid, die partij is bij het Noord-Atlantisch
      Verdrag (Stb. J 335);
        - *vergunning:* een doorvoervergunning, een individuele of globale uitvoervergunning of een individuele of globale
      overdrachtsvergunning;
        - *verordening 952/2013:* verordening (EU) nr. 952/2013 van het Europees Parlement en van de Raad van 9 oktober
      2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);


      [ref1]: https://wetten.overheid.nl/BWBR0024139
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024139
  - number: 1a
    text: Deze regeling berust mede op de Verordening producten voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel1a
  - number: '2'
    text: |-
      Als militaire goederen worden aangewezen de goederen, opgenomen in de gemeenschappelijke EU-lijst van militaire
      goederen.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel2
  - number: '3.1'
    text: |-
      Een vergunning voor militaire goederen wordt aangevraagd door de beschikkingsbevoegde, door degene die voor hem de
      douaneformaliteiten verricht, of, indien geen douaneformaliteiten worden verricht, door de persoon die de goederen
      vervoert.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel3
  - number: '3.2'
    text: |-
      Een vergunning als bedoeld in artikel 3 van de Verordening producten voor tweeërlei gebruik of een vergunning voor
      militaire goederen wordt aangevraagd bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel3
  - number: '3.3'
    text: |-
      In Nederland gevestigde exporteurs als bedoeld in artikel 2, derde lid, van de Verordening producten voor tweeërlei
      gebruik dienen aanvragen ter verkrijging van een vergunning als bedoeld in artikel 3 van de Verordening producten
      voor tweeërlei gebruik, schriftelijk in bij de inspecteur, ook al bevinden de goederen zich op het grondgebied van
      een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel3
  - number: '3.4'
    text: |-
      De beschikkingsbevoegde verklaart bij het aanvragen van een uitvoervergunning voor militaire goederen, indien de
      militaire goederen die uit een andere lidstaat zijn ontvangen aan uitvoerbeperkingen zijn verbonden, dat zij aan de
      voorwaarden van deze beperkingen hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel3
  - number: '3.5'
    text: |-
      Een vergunning voor militaire goederen kan betrekking hebben op meegeleverde reserveonderdelen en toebehoren,
      voor zover deze worden geleverd uit hoofde van dezelfde overeenkomst die betrekking heeft op de levering van de
      militaire goederen waarvoor de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel3
  - number: '4'
    text: 'De inspecteur kan bij de vergunningaanvraag in ieder geval verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel4
  - number: 4.a
    text: de overeenkomst die ten grondslag ligt aan de betreffende doorvoer, uitvoer of overdracht;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel4
  - number: 4.b
    text: een verklaring betreffende het eindgebruik.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel4
  - number: '5'
    text: |-
      [Artikel 5, eerste lid][ref1], [artikel 11, eerste lid][ref2], en [artikel 18, eerste lid, van het besluit][ref3]
      zijn niet van toepassing op de doorvoer, uitvoer of overdracht van:


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024139#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0024139#Artikel18
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024139
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0024139
        artikel: '18'
  - number: 5.a
    text: militaire goederen, bestemd voor gebruik door de Nederlandse strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5
  - number: 5.b
    text: |-
      militaire goederen, eigendom van en bestemd voor gebruik door NAVO-strijdkrachten of het Joint Force Command in
      Brunssum;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5
  - number: 5.c
    text: militaire goederen, eigendom van het ERA;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5
  - number: 5.d
    text: |-
      militaire voertuigen die worden gebruikt door vreemde strijdkrachten bij gelegenheden als staats- of
      beleefdheidsbezoeken, vlootschouwen of luchtvaartmanifestaties.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5
  - number: 5a
    text: |-
      Voorwaarde voor gebruik van een vergunning als bedoeld in artikel 12, eerste lid, onder d, van de Verordening
      producten voor tweeërlei gebruik, is dat ten minste twee weken voorafgaand aan het gebruik ervan een schriftelijk
      verzoek om registratie wordt ingediend bij de Centrale dienst voor in- en uitvoer (CDIU), Postbus 30003, 9700 RD
      Groningen. Het verzoek tot registratie bevat in ieder geval de naam- en adresgegevens van de exporteur en indien
      de exporteur daarover beschikt, het nummer, bedoeld in artikel 1, onderdeel 18 van de gedelegeerde verordening (EU)
      nr. 2015/2446 van de Commissie van 28 juli 2015 tot aanvulling van verordening 952/2013 (PbEU 2015, L 343) (EORI-
      nummer).
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel5a
  - number: '6.1'
    text: |-
      De melding, bedoeld in [artikel 10 van het besluit][ref1] wordt schriftelijk gedaan door de beschikkingsbevoegde,
      door degene die voor hem de douaneformaliteiten verricht, of, indien geen douaneformaliteiten worden verricht, door
      de persoon die de goederen vervoert en vindt plaats bij de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel10
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '10'
  - number: '6.2'
    text: 'De melding bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: 6.2.a
    text: het land van bestemming;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: 6.2.b
    text: de naam van de ontvanger van de militaire goederen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: 6.2.c
    text: |-
      een omschrijving van de militaire goederen waarop de melding betrekking heeft, met inbegrip van het postnummer
      waarmee de desbetreffende goederen zijn aangeduid in de gemeenschappelijke EU-lijst van militaire goederen, de
      merken en nummers, het aantal en de soort van de colli, of, voor onverpakte goederen, het aantal voorwerpen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: 6.2.d
    text: het land waar de militaire goederen zich op het moment van de melding bevinden.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: '6.3'
    text: |-
      De inspecteur kan een persoon die gehouden is om meldingen te doen, schriftelijk toestemming geven de melding
      anders dan schriftelijk te doen.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: '6.4'
    text: De melding wordt gedaan uiterlijk op het moment van binnenkomst op het grondgebied van Nederland.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: '6.5'
    text: |-
      Als melding inzake de doorvoer door Nederland als bedoeld in het eerste lid gelden, mits voorzien van de bij het
      tweede lid, onder c en d, bedoelde gegevens:
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: 6.5.a
    text: |-
      een aanvraag ter verkrijging van een consent tot binnenkomen als bedoeld in
      [artikel 14 van de Wet wapens en munitie][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel14
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '14'
  - number: 6.5.b
    text: een summiere aangifte bij binnenkomst als bedoeld in artikel 127 van verordening 952/2013;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
  - number: '6.6'
    text: |-
      Een consent tot binnenkomen en uitgaan als bedoeld in [artikel 14, eerste lid, van de Wet wapens en munitie][ref1]
      geldt als een individuele doorvoervergunning als bedoeld in [artikel 5, eerste lid, van het besluit][ref2], indien
      de doorvoerzending niet is bestemd voor commerciële doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0024139#Artikel5
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0024139
        artikel: '5'
  - number: '7'
    text: 'Geen melding is vereist voor:'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel7
  - number: 7.a
    text: |-
      de doorvoer van militaire goederen die zonder aanlanding worden vervoerd door de territoriale wateren, of door het
      luchtruim van Nederland;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel7
  - number: 7.b
    text: |-
      de doorvoer, uitvoer of overdracht van militaire goederen, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030610#Artikel5
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030610
        artikel: '5'
        paragraaf: '3'
  - number: 7.c
    text: de overdracht uit Nederland van militaire goederen naar België en Luxemburg.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel7
  - number: '8'
    text: |-
      Aan een vergunning als bedoeld in artikel 3 van de Verordening producten voor tweeërlei gebruik of een vergunning
      voor militaire goederen kunnen ten minste de volgende voorschriften worden verbonden:
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.a
    text: |-
      de goederen, waarop de vergunning betrekking heeft, worden binnen een bij de vergunning te bepalen termijn
      wederingevoerd, welke wederinvoer wordt aangetoond binnen een maand na de wederinvoer;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.b
    text: |-
      bij elke doorvoer, uitvoer of overdracht die met een vergunning als bedoeld in het eerste lid wordt verricht wordt
      een factuur ingezonden aan de inspecteur, die in elk geval bevat:
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.b.1°
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.b.2°
    text: de naam en het adres van de ontvanger;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.b.3°
    text: |-
      een omschrijving van de door te voeren, uit te voeren of over te dragen goederen, met inbegrip van het postnummer
      waarmee de desbetreffende goederen zijn aangeduid in de gemeenschappelijke EU-lijst van militaire goederen of in
      bijlage I bij de Verordening producten voor tweeërlei gebruik;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.b.4°
    text: de hoeveelheid en de waarde van de door te voeren, uit te voeren of over te dragen goederen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: 8.c
    text: |-
      door middel van een bewijsstuk van ontvangst, een ambtelijk gewaarmerkte kopie van een invoerdocument of een
      eindgebruikersverklaring bij de inspecteur wordt aangetoond dat de goederen de bestemming waarvoor de vergunning is
      verleend, hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel8
  - number: '9'
    text: |-
      Een vergunning waarvan geen gebruik wordt gemaakt, wordt onder opgave van redenen terstond ingezonden aan de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel9
  - number: '10'
    text: |-
      De beschikkingsbevoegde rapporteert aan de inspecteur binnen twee maanden na afloop van elk half kalenderjaar over
      het gebruik van een individuele of globale uitvoervergunning of een individuele of globale overdrachtsvergunning
      voor militaire goederen door middel van een overzicht waarin de volgende informatie staat:
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel10
  - number: 10.a
    text: |-
      een omschrijving van de militaire goederen, met inbegrip van het postnummer waarmee de desbetreffende goederen zijn
      aangeduid in de gemeenschappelijke EU-lijst van militaire goederen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel10
  - number: 10.b
    text: |-
      de hoeveelheid en waarde van de militaire goederen, tenzij het tijdelijke uitvoer of overdracht van militaire
      goederen betreft in verband met demonstratie of reparatiedoeleinden;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel10
  - number: 10.c
    text: de data van de leveringen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel10
  - number: 10.d
    text: naam en adres van de ontvanger en indien bekend, de eindgebruiker van militaire goederen.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel10
  - number: '11.1'
    text: |-
      Het verzoek om erkenning, bedoeld in [artikel 27 van het besluit][ref1], wordt schriftelijk ingediend bij de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel27
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '27'
  - number: '11.2'
    text: 'Een besluit tot erkenning wordt verleend indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.a
    text: ervaring heeft met defensieactiviteiten;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.b
    text: een relevante industriële activiteit heeft in militaire goederen binnen de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.c
    text: het vermogen heeft om systemen en subsystemen te integreren en integreert de militaire goederen in (sub)systemen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.d
    text: een directielid heeft benoemd dat verantwoordelijk is voor de overdracht en uitvoer van militaire goederen;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.e
    text: |-
      een door het in onderdeel d bedoelde directielid ondertekende schriftelijke verklaring overlegt van de onderneming
      dat deze alle noodzakelijke maatregelen zal nemen om te voldoen aan alle specifieke voorwaarden in verband met het
      eindgebruik en de uitvoer van elk afgenomen specifiek onderdeel of product;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.f
    text: |-
      een door het in onder d bedoelde directielid ondertekende schriftelijke verklaring overlegt van de onderneming
      dat deze de bevoegde autoriteiten bij verzoeken en onderzoeken met de benodigde zorgvuldigheid gedetailleerde
      informatie zal geven over de eindgebruikers of het eindgebruik van alle producten die deze onderneming in het kader
      van een algemene overdrachtsvergunning van een andere lidstaat heeft overgedragen of afgenomen en
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.2.g
    text: |-
      beschikt over een door het in onder d bedoelde directielid medeondertekende uitgebreide beschrijving van het
      interne programma tot naleving van de overdracht- en uitvoercontroleprocedure of het uitvoerbeheerssysteem van
      de onderneming.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: '11.3'
    text: 'Het besluit tot erkenning bevat:'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.3.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.3.b
    text: een verklaring dat de aanvrager aan de in het tweede lid genoemde voorwaarden voldoet;
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: 11.3.c
    text: de afgiftedatum en de geldigheidsperiode van de erkenning.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: '11.4'
    text: De minister kan verzoeken om nadere informatie ter controle van de in het tweede lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel11
  - number: '12'
    text: |-
      De [Uitvoeringsregeling strategische goederen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024269
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024269
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 30 juni 2012.
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling strategische goederen 2012.'
    url: https://wetten.overheid.nl/BWBR0030610/2021-09-09#Artikel14
