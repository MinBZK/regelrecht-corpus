  - number: '2'
    text: |-
      De volgende bepalingen zijn van toepassing op het sparen van vrije dagen, als bedoeld in
      [artikel 1, tweede lid][ref1]:

      a. het bevoegd gezag verstrekt jaarlijks een opgave van het aantal gespaarde dagen aan de ambtenaar;

      b. de opname van de vrije dagen wordt opgeschort, gedurende de periode dat de ambtenaar langer dan een maand
      ongeschikt is tot het verrichten van zijn arbeid wegens ziekte;

      c. bij arbeidsongeschiktheid wegens ziekte en gedeeltelijke arbeidsongeschiktheid wegens ziekte langer dan een
      maand staakt de opbouw van het spaartegoed;

      d. bij overlijden wordt aan de nagelaten betrekkingen of rechtverkrijgenden een bedrag voor ieder gespaard uur
      uitbetaald ter grootte van het salaris per uur dat de ambtenaar laatstelijk voor het overlijden genoot.


