  text: |-
    gelet op de artikelen 21, twaalfde lid, van het Algemeen Rijksambtenaren-reglement en 34, twaalfde lid, van het
    Ambtenarenreglement Staten-Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008344/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het bevoegd gezag kan op verzoek van de ambtenaar en indien het belang van de
      dienst zich daartegen niet verzet een werktijdregeling vaststellen, als bedoeld in
      [artikel 21, eerste lid, van het Algemeen Rijksambte-narenreglement][ref1] onderscheidenlijk

      [artikel 34, eerste lid, van het Ambte-narenreglement Staten-Generaal][ref2], waarbij het aantal te werken uren
      gelijk is aan het aantal kalenderdagen per jaar verminderd met het aantal zaterdagen en zondagen en niet op
      zaterdag of zondag vallende feest-dagen, genoemd in het zevende lid, onder a, vermenigvuldigd met 8.

      2 Bij toepassing van het eerste lid heeft de ambtenaar aanspraak op een compensatie in vrije dagen.
      Deze compensatie wordt berekend door de ingeroosterde werktijd te verminderen met de arbeidsduur,
      bedoeld in [artikel 21, derde lid, van het Algemeen Rijksambtenarenreglement][ref3] onderscheidenlijk
      [artikel 34, derde lid, van het Ambtenarenreglement Staten-Generaal][ref4]. De compensatie kan worden opgenomen
      binnen een tijdvak van één jaar of over een periode van ten hoogste zeven jaren worden opgespaard, waarna de
      gespaarde dagen aaneengesloten worden opgenomen.

      3 Bij de vaststelling van de werktijdregeling, bedoeld in het eerste lid, wordt in overleg tussen de ambtenaar en
      het bevoegd gezag tevens vastgesteld hoe de compensatie in vrije dagen zal geschieden.


