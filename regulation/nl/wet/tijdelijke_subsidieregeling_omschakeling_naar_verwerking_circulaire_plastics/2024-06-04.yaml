preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, 4, eerste en tweede lid, 6, zesde lid, 7, derde lid, 8, eerste en tweede lid,
    10, tweede en vierde lid, 13, 15, eerste en vijfde lid, en 22, tweede lid, van het Kaderbesluit subsidies I en M;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *biogebaseerd plastic:* plastic waarvan de polymeerfractie voor minimaal 25 massaprocent afkomstig is uit
      biologische grondstoffen, inclusief bijproducten en reststromen die vrijkomen bij de verwerking van biologische
      grondstoffen;
        - *circulaire plastics:* plasticrecyclaat en biogebaseerd plastic;
        - *fossiele grondstoffen:* aardolie, aardgas of steenkool;
        - *fossiele plastics:* plastics gemaakt op basis van fossiele grondstoffen en niet van plasticrecyclaat;
        - *Kaderbesluit:* [Kaderbesluit subsidies I en M][ref1];
        - *plastic:* een materiaal bestaande uit polymeren waaraan additieven of vulstoffen kunnen zijn toegevoegd;
        - *plasticrecyclaat:* plastics die verkregen zijn door een recyclingproces van kunststofafval dat afkomstig is van
      in de handel gebrachte kunststofproducten en die nieuw primair plastic kunnen vervangen;
        - *productietest:* technische test gericht op het verwerken van circulaire plastics in de eigen producten;
        - *verklaring de-minimissteun:* verklaring als bedoeld in [Verordening (EU) 2023/2831](32023R2831) van de Commissie
      van 13 december 2023 betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking
      van de Europese Unie op de-minimissteun (PB L 2023/2831);
        - *verwerker:* ondernemer die polymeren, waaraan additieven of vulstoffen kunnen zijn toegevoegd, verwerkt tot
      plastic deel- of eindproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0036381
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036381
  - number: '2'
    text: |-
      Deze regeling heeft tot doel verwerkers te stimuleren productietesten uit te voeren ter voorbereiding op de
      omschakeling van het verwerken van fossiele plastics naar het verwerken van meer circulaire plastics in het
      bestaande portfolio van plastic producten van de betreffende verwerker. Het percentage circulair plastic in de
      productietest dient een significante toename te zijn ten opzichte van hetgeen de verwerker reeds in het betreffende
      product toepast.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel2
  - number: '3'
    text: |-
      De Minister kan op aanvraag subsidie verstrekken aan verwerkers voor het binnen een jaar na de datum van
      subsidieverlening uitvoeren van één of meer productietesten en de daaraan direct verbonden activiteiten.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel3
  - number: '4'
    text: |-
      Een aanvraag wordt ingediend door een verwerker die is ingeschreven bij de Kamer van Koophandel, met een vestiging
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel4
  - number: '5'
    text: |-
      1 Voor subsidieverlening komen uitsluitend na indiening van de subsidieaanvraag gemaakte kosten in aanmerking.

      2 De kosten van de activiteiten worden berekend door het aantal voorziene uren dat de direct bij de subsidiabele
      activiteiten betrokken eigen medewerkers ten behoeve van deze activiteiten maken te vermenigvuldigen met een vast
      uurtarief van € 60 waarin zowel de directe loonkosten als de daaraan toegerekende indirecte kosten zijn begrepen,
      eventueel te vermeerderen met:

      a. voorziene kosten van het gebruik van bestaande apparatuur, indien deze in de administratie te onderscheiden
      zijn;

      b. kosten van verbruikte materialen en van hulpmiddelen;

      c. aan derden te betalen kosten op basis van offerte.

      3 In afwijking van het tweede lid komen de volgende kosten niet voor subsidie in aanmerking:

      a. kosten voor marketing- en salesactiviteiten;

      b. kosten van opleidingen.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel5
  - number: '6'
    text: De subsidie bedraagt 75 procent van de subsidiabele kosten met een maximum van € 25.000.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel6
  - number: '7'
    text: |-
      1 Het subsidieplafond bedraagt voor 2024 € 6.000.000.

      2 De Minister stelt het subsidieplafond voor de daaropvolgende jaren vast en maakt dit bekend in de Staatscourant
      voor de aanvang van het tijdvak waarvoor het wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel7
  - number: '8'
    text: Het totale beschikbare subsidiebedrag wordt verdeeld op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel8
  - number: '9'
    text: Een aanvraag kan worden ingediend van 18 juni 2024, 9.00 uur tot en met 3 oktober 2024, 12.00 uur.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel9
  - number: '10'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend bij de Rijksdienst voor Ondernemend Nederland met gebruikmaking van een
      daartoe door de Minister beschikbaar gesteld middel.

      2 De aanvraag om subsidieverlening bevat naast de in [artikel 10, vierde lid, van het Kaderbesluit][ref1] genoemde
      gegevens en bescheiden een verklaring de-minimissteun en indien sprake is van aan derden te betalen kosten als
      bedoeld in [artikel 5, eerste lid, aanhef en onder c][ref2], de betreffende offertes.

      3 In afwijking van [artikel 10, vierde lid, aanhef en onderdeel f, van het Kaderbesluit][ref3] hoeft de aanvraag
      niet een bewijs te bevatten dat de bankrekening op naam van de aanvrager staat.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0049758#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0049758
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0036381
        artikel: '10'
  - number: '11'
    text: |-
      In aanvulling op de [artikelen 11][ref1] en [12 van het Kaderbesluit][ref2] wordt een subsidieaanvraag afgewezen
      indien:

      a. eerder in hetzelfde kalenderjaar op grond van deze regeling subsidie is verstrekt aan de aanvrager;

      b. geen productietest wordt uitgevoerd;

      c. de activiteiten geen betrekking hebben op de verwerking van circulaire polymeren in plastic deel- of
      eindproducten;

      d. de activiteiten betrekking hebben op de verwerking van elastomeren, thermoharders of composietmaterialen of de
      productie van composietmaterialen.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '12'
  - number: '12'
    text: |-
      De subsidieontvanger is verplicht om:

      a. onverwijld een schriftelijke melding te doen zodra aannemelijk is dat de activiteiten waarvoor de subsidie is
      verleend niet, niet tijdig of niet geheel zullen worden verricht of dat niet, niet tijdig of niet geheel aan de aan
      de subsidie verbonden verplichtingen zal worden voldaan;

      b. desgevraagd aan de hand van een per omgaande toe te zenden verslag van de uitgevoerde productietest of
      productietesten aan te tonen dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan
      aan de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel12
  - number: '13'
    text: |-
      Bij subsidieverstrekking wordt een beschikking tot subsidieverlening gegeven, met vermelding van de datum waarop de
      subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel13
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt vijf jaar na het tijdstip van inwerkingtreding met dien verstande dat zij van toepassing
      blijft op voordien ingediende aanvragen om subsidie.
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling omschakeling naar verwerking circulaire plastics.'
    url: https://wetten.overheid.nl/BWBR0049758/2024-06-04#Artikel15
