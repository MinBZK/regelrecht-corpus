preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in een afzonderlijke wet regels te stellen voor de
    bijzondere opsporingsdiensten, in verband met de samenhang van de rechtshandhaving en de democratische controle en
    ter verbetering van de handhaving van de ordeningswetgeving, alsmede de instelling van het functioneel parket;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. bijzondere opsporingsdienst: een van de diensten, bedoeld in [artikel 2][ref1];

      b. opsporingsambtenaar: een ambtenaar van een bijzondere opsporingsdienst die is aangewezen voor de uitvoering van
      de taken, bedoeld in [artikel 3][ref2];

      c. Onze betrokken Minister: Onze minister onder wie een bijzondere opsporingsdienst ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '3'
        hoofdstuk: II
  - number: '2'
    text: |-
      Er zijn vier bijzondere opsporingsdiensten, te weten:

      a. een bijzondere opsporingsdienst, ressorterend onder Onze Minister van Financiën;

      b. een bijzondere opsporingsdienst, ressorterend onder Onze Minister van Infrastructuur en Milieu;

      c. een bijzondere opsporingsdienst, ressorterend onder Onze Minister van Economische Zaken, Landbouw en Innovatie;

      d. een bijzondere opsporingsdienst, ressorterend onder Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel2
  - number: '3'
    text: |-
      Een bijzondere opsporingsdienst is onder gezag van de officier van justitie belast met:

      a. de strafrechtelijke handhaving van de rechtsorde op de beleidsterreinen waarvoor Onze betrokken Minister
      verantwoordelijkheid draagt;

      b. de strafrechtelijke handhaving van de rechtsorde op een beleidsterrein waarvoor een andere minister dan de onder
      a. bedoelde, verantwoordelijkheid draagt en die door die minister in overeenstemming met Onze betrokken Minister en
      Onze Minister van Veiligheid en Justitie aan die bijzondere opsporingsdienst is opgedragen;

      c. opsporingshandelingen in verband met strafbare feiten die zijn geconstateerd in het kader van de taakuitoefening
      bedoeld onder a. en b., en die met die taakuitoefening verband houden;

      d. de opsporing van andere strafbare feiten, indien de bijzondere opsporingsdienst daarmee is belast door de
      officier van justitie;

      e. de opsporing van strafbare feiten als bedoeld in de artikelen 22 en 25 van de Verordening (EU) 2017/1939 van de
      Raad van 12 oktober 2017 betreffende nauwere samenwerking bij de instelling van het Europees Openbaar Ministerie
      («EOM») (PbEU 2017, L 283).
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel3
  - number: '4'
    text: |-
      De officier van justitie kan, onverlet de toepassing van
      [artikel 80, vierde lid, van de Algemene wet inzake rijksbelastingen][ref1], de betrokken opsporingsambtenaren de
      nodige aanwijzingen geven voor de vervulling van de in [artikel 3][ref2] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: De opsporingsambtenaar is bevoegd zijn taak uit te oefenen in het gehele land.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel5
  - number: '6'
    text: |-
      1 De opsporingsambtenaar is bevoegd in de rechtmatige uitoefening van zijn taak geweld te gebruiken, wanneer het
      daarmee beoogde doel dit, mede gelet op de aan het gebruik van geweld verbonden gevaren, rechtvaardigt en dat doel
      niet op een andere wijze kan worden bereikt.

      2 Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      3 De opsporingsambtenaar is bevoegd tot het onderzoek aan de kleding van personen bij de uitoefening van
      een hem wettelijk toegekende bevoegdheid of bij een handeling ter uitvoering van zijn taak, indien uit
      feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid, die van de
      opsporingsambtenaar zelf of van derden en dit onderzoek noodzakelijk is ter afwending van dit gevaar.

      4 De uitoefening van de bevoegdheden, bedoeld in het eerste en derde lid, dient in verhouding tot het beoogde doel
      redelijk en gematigd te zijn.

      5 Met overeenkomstige toepassing van [artikel 9 van de Politiewet 2012][ref1] wordt een ambtsinstructie voor de
      opsporingsambtenaren vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel9
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '9'
  - number: 6a
    text: |-
      De opsporingsambtenaar is bevoegd tot het vorderen van inzage in een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] van personen, voor zover dat redelijkerwijs noodzakelijk is
      voor de uitoefening van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '7'
    text: |-
      1 Het College van procureurs-generaal ziet erop toe dat de bijzondere opsporingsdiensten de taken, bedoeld in
      [artikel 3][ref1], naar behoren uitvoeren.

      2 Het hoofd van het functioneel parket heeft tot taak erop toe te zien dat:

      a. de opsporingsambtenaar beschikt over de bekwaamheid en betrouwbaarheid die noodzakelijk zijn voor de uitoefening
      van opsporingsbevoegdheden;

      b. de opsporingsambtenaar zijn taak op de juiste wijze uitoefent.

      3 Bij algemene maatregel van bestuur, op voordracht van Onze Minister van Veiligheid en Justitie, worden regels
      gegeven met betrekking tot de bekwaamheid en betrouwbaarheid die noodzakelijk zijn voor de uitoefening van
      opsporingsbevoegdheden.

      4 Het bepaalde in het eerste lid laat het bepaalde in
      [artikel 126nba, achtste lid, van het Wetboek van Strafvordering][ref2] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126nba
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126nba
  - number: '8'
    text: |-
      Het College van procureurs-generaal kan Onze betrokken Minister adviseren over de uitoefening van de taken van de
      bijzondere opsporingsdienst en de feitelijke toepassing van de opsporingsbevoegdheden door de opsporingsambtenaren.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 De bijzondere opsporingsdienst is als afzonderlijke organisatorische eenheid geplaatst in de organisatie van het
      ministerie waartoe deze behoort.

      2 De aanwijzing van het hoofd van de bijzondere opsporingsdienst, op voordracht van Onze betrokken Minister,
      geschiedt na overleg met Onze Minister van Veiligheid en Justitie. De aanwijzing eindigt van rechtswege met ingang
      van de datum dat de uitoefening van de functie van hoofd van de opsporingsdienst geen onderdeel meer uitmaakt van
      de werkzaamheden van de betreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel9
  - number: '10'
    text: |-
      Onze betrokken Minister en Onze Minister van Veiligheid en Justitie stellen, gehoord het College van procureurs-
      generaal, periodiek de hoofdlijnen van het beleid met betrekking tot de taakuitoefening door de bijzondere
      opsporingsdiensten vast.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Jaarlijks stellen Onze betrokken Minister en het College van procureurs-generaal voor het komende jaar,
      met inachtneming van de hoofdlijnen van het beleid met betrekking tot de taakuitoefening door de bijzondere
      opsporingsdiensten, bedoeld in [artikel 10][ref1], een handhavingsarrangement vast, waarin de wederzijdse afspraken
      over opsporing en afhandeling van de opsporingsonderzoeken zijn opgenomen.

      2 Onze betrokken Minister en het College van procureurs-generaal stellen jaarlijks een jaarverslag vast over de
      verwezenlijking van de afspraken in het handhavingsarrangement.

      3 Onze betrokken Minister zendt het jaarverslag na de vaststelling ervan aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel10
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '10'
        hoofdstuk: IV
  - number: '12'
    text: |-
      1 Er is een eenheid binnen de bijzondere opsporingsdienst die, onder gezag van de officier van justitie,
      persoonsgegevens verwerkt ten behoeve van het voorkomen en opsporen van misdrijven die gezien hun ernst, frequentie
      of het georganiseerd verband waarin ze worden gepleegd, een ernstige inbreuk kunnen maken op de rechtsorde op de
      terreinen waarop de bijzondere opsporingsdienst een taak heeft als bedoeld in [artikel 3][ref1].

      2 Bij regeling van Onze betrokken Minister in overeenstemming met Onze Minister van Veiligheid en Justitie worden
      regels gesteld omtrent de werkzaamheden van de eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 Onze betrokken Minister en Onze Minister van Veiligheid en Justitie kunnen tezamen bij ministeriële regeling
      regels geven over de samenwerking tussen de bijzondere opsporingsdienst en de politie.

      2 Onze betrokken Minister, Onze Minister van Veiligheid en Justitie en Onze Minister van Defensie kunnen tezamen
      bij ministeriële regeling regels geven over de samenwerking tussen de bijzondere opsporingsdienst en de Koninklijke
      marechaussee.

      3 Onze betrokken Ministers en Onze Minister van Veiligheid en Justitie kunnen tezamen bij ministeriële regeling
      regels geven over de samenwerking van bijzondere opsporingsdiensten onderling.

      4 Onze betrokken Ministers en Onze Minister van Veiligheid en Justitie, eventueel in overeenstemming met andere
      terzake verantwoordelijke ministers kunnen, op de terreinen waarop de bijzondere opsporingsdiensten een taak
      hebben als bedoeld in [artikel 3][ref1], tezamen bij ministeriële regeling regels geven over de samenwerking van
      bijzondere opsporingsdiensten met toezichthoudende instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
        hoofdstuk: II
  - number: '14'
    text: |-
      1 Onze betrokken Minister draagt zorg voor de behandeling van een klacht over een gedraging van een
      opsporingsambtenaar. Onze betrokken Minister stelt nadere regels vast over de behandeling van klachten over
      gedragingen van opsporingsambtenaren.

      2 In een ministeriële regeling als bedoeld in het eerste lid, wordt voorzien in:

      a. de instelling van een commissie, bestaande uit onafhankelijke leden, die overeenkomstig
      [Hoofdstuk 9, afdeling 9.1.3, van de Algemene wet bestuursrecht][ref1], is belast met de behandeling van klachten
      en advisering over de afhandeling daarvan;

      b. de registratie van de ingediende klachten en, indien beschikbaar, de daarop genomen beslissingen, alsmede

      c. een jaarlijkse publicatie van de geregistreerde klachten en beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
  - number: '15'
    text: |-
      Tenzij reeds naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, wordt van de klacht onverwijld
      na de ontvangst daarvan afschrift gezonden aan het functioneel parket. Het hoofd van het functioneel parket wordt
      in de gelegenheid gesteld advies over de afhandeling van de klacht uit te brengen.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel15
  - number: '16'
    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen veertien weken na de ontvangst van het klaagschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel911
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:11
  - number: '22'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet op de bijzondere opsporingsdiensten.'
    url: https://wetten.overheid.nl/BWBR0019919/2025-07-01#Artikel23
