preamble:
  text: |-
    Gelet op artikel 93 van de Wet op de bedrijfsorganisatie, artikel 5, lid 1, van de Instellingsverordening
    Productschap Zuivel, alsmede op artikel 8, lid 5, en artikel 13, lid 1, van de Zuivelverordening 2000, Uitbetaling
    van boerderijmelk naar kwaliteit, samenstelling en gewicht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1], voor zover het koemelk betreft en de
      terminologie van [Zuivelverordening 2010, Grondslag uitbetaling geitenmelk][ref2], voor zover het geitenmelk
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017209
      [ref2]: https://wetten.overheid.nl/BWBR0029878
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017209
      - id: ref2
        bwb_id: BWBR0029878
  - number: '2'
    text: |-
      Een melkcontrolestation beschikt over een voorschriftenbundel met een gedetailleerde en actuele beschrijving van de
      methoden die worden toegepast voor het onderzoek van de samenstelling en kwaliteit van boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel2
  - number: '3'
    text: Voor de bepaling van het kerngetal geldt NEN-EN-ISO 4833 als referentiemethode.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel3
  - number: '4'
    text: |-
      In plaats van de referentiemethode mogen andere gevalideerde methoden worden toegepast, met dien verstande dat: - -
      de verkregen resultaten worden omgerekend naar een plaatkiemgetal volgens NEN-EN-ISO 4833;
        - - de daartoe benodigde conversievergelijking wordt vastgesteld en onderhouden volgens de richtlijnen in ISO
      21187.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel4
  - number: '5'
    text: |-
      Het resultaat wordt uitgedrukt in kolonievormende eenheden per ml. Voor uitslagen boven 999.000 per ml dient
      999.000 per ml te worden vermeld als uitslag.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel5
  - number: '6'
    text: |-
      De toe te passen methode berust op het filtreren van 22 tot 28 ml melk met een temperatuur van 37 ±2 ºC bij een
      drukverschil van 25 tot 30 kPa. De verontreinigingsgraad wordt vastgesteld na droging van het filter, waarbij
      een gradatiecijfer wordt toegekend op grond van vergelijking met een grensstandaard. Deze grensstandaard wordt
      periodiek verstrekt door het COKZ.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel6
  - number: '7'
    text: |-
      Een gradatiecijfer II wordt toegekend aan een monster indien de daardoor veroorzaakte verontreinigingsgraad van het
      filter groter is dan die van de grensstandaard. In de andere gevallen wordt een gradatiecijfer I toegekend.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel7
  - number: '8'
    text: |-
      Het onderzoek op melkvreemde bacteriegroeiremmende stoffen vindt plaats volgens een onderzoekschema dat bestaat uit
      een screeningsmethode (A), een bevestigingsmethode (B) en een test ter nadere kwalificering van de groeiremming.
      Met de screeningsmethode A worden monsters rauwe melk opgespoord die aantoonbaar bacteriegroeiremmende stoffen
      kunnen bevatten. Met de bevestigingsproef B wordt nagegaan of na verhitting van de met methode A opgespoorde
      monsters de bacteriegroeiremming in deze monsters wordt bevestigd. Indien ook in bevestigingsproef B sprake
      is van groeiremming, wordt een test uitgevoerd ter nadere kwalificering in aard en mate van de groeiremming.
      De concentraties van enkele bacteriegroeiremmende stoffen die ten minste aantoonbaar moeten zijn in de
      screeningsmethode (A) en de bevestigingsmethode (B) zijn weergegeven in de onderstaande tabel.






                  **Stof**


                  **Aantoonbare concentraties (µg/ml) methoden A en B**






                  **Beta-lactam antibiotica**





                  benzylpenicilline


                  0,003*




                  ampicilline


                  0,002




                  cloxacilline


                  0,02




                  cefalixine


                  0,1




                  ceftiofur


                  0,05







                  **Beta-lactam antibiotica**





                  sulfamethazine


                  0,2




                  oxytetracycline


                  0,2




                  neomycine


                  0,5




                  tylosine


                  0,05




         * uitgedrukt in Internationale Eenheden per ml In geval bij de test ter nadere kwalificering een groeiremming
      wordt vastgesteld die groter is dan die voor de meelopende grensstandaard van 0,0037 IE/ml penicilline en een
      test op penicillinen en cefalosporinen (ß-lactam antibiotica) positief is, wordt het resultaat als positief
      gekwalificeerd en met een P aangeduid. In geval bij koemelk bij de test ter nadere kwalificering een groeiremming
      wordt vastgesteld die groter is dan die voor de meelopende grensstandaard van 0,0037 IE/ml penicilline en een
      test op penicillinen en cefalosporinen (ß-lactam antibiotica) negatief is, wordt het resultaat als positief
      gekwalificeerd en met een O aangeduid. In geval van een positieve bevinding dient ten minste 2 ml van het
      betreffende monsterrestant tot ten minste 3 maanden na datum monsterneming bij -20 °C of lager te worden bewaard.
      Dit monsterrestant moet zijn voorzien van een adequate identificatie.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel8
  - number: '9'
    text: |-
      Voor de bepaling van het celgetal in koemelk geldt de microscopische celtelling volgens NEN-EN-ISO 13366-1 als
      referentiemethode.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel9
  - number: '10'
    text: |-
      In plaats van de referentiemethode mogen andere gevalideerde methoden worden toegepast, met dien verstande dat bij
      koemelk: '- - de herhaalbaarheid van de meting bij 400.000 cellen per ml kleiner dient te zijn dan 40.000 cellen'
      per ml;
        - - de standaardafwijking van de verschillen ten opzichte van resultaten met de referentiemethode bij 400.000
      cellen per ml kleiner dient te zijn dan 40.000 cellen per ml.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel10
  - number: 10a
    text: |-
      Voor bepaling van het celgetal in geitenmelk gelden de richtlijnen volgens NEN-EN-ISO 13366-2, met dien verstande
      dat de herhaalbaarheid van de meting bij 1.000.000 cellen per ml kleiner dient te zijn dan 80.000 per ml.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel10a
  - number: '11'
    text: |-
      Het celgetal wordt uitgedrukt in cellen per ml. Voor celgetallen boven 9.999.000 per ml wordt 9.999.000 per ml
      vermeld als uitslag.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel11
  - number: '12'
    text: |-
      De toe te passen methode voor de bepaling van de aanwezigheid van sporen van boterzuurbacteriën vindt plaats
      volgens NEN 6877, met dien verstande dat: - - per monster 2 buizen worden ingezet;
        - - per buis 0,1 ml van de te onderzoeken melk wordt gedoseerd;
        - - gebruik kan worden gemaakt van een kleinere buis (circa 9 ml) met dienovereenkomstige hoeveelheden paraffine
      en medium.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel12
  - number: '13'
    text: Gasvorming in de buis wordt aangeduid met een " + ", anders wordt een " - " genoteerd.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel13
  - number: '14.1'
    text: |-
      Voor de bepaling van de zuurtegraad vet komt de bepaling overeen met NEN 6854 (titreerbare zuurtegraad), met dien
      verstande dat: - het volume melk 31 ± 2 ml bedraagt;
        - de normen voor de herhaalbaarheid en reproduceerbaarheid zijn gesteld op respectievelijk 0,07 en 0,11 mmol/100
      g vet.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel14
  - number: '14.2'
    text: |-
      In plaats van de bepaling in het eerste lid mogen andere gevalideerde methoden worden toegepast, met dien verstande
      dat: '- bij een zuurtegraad vet tot 1,5 mmol/100 g vet de herhaalbaarheid van de meting (r) kleiner dient te zijn'
      dan 0,15 mmol/100 g vet;
        - de uitbetaling plaatsvindt op basis van het rekenkundig gemiddelde van minimaal n meetresultaten, waarbij n
      > (r/0,07)2.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel14
  - number: '15'
    text: De zuurtegraad van het vet wordt uitgedrukt in mmol per 100 g vet.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel15
  - number: '16'
    text: Voor de bepaling van het vriespunt geldt NEN-EN-ISO 5764 als referentiemethode.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel16
  - number: '17'
    text: |-
      In plaats van de referentiemethode mogen andere gevalideerde methoden worden toegepast, met dien verstande dat: - -
      de herhaalbaarheid van de meting kleiner dient te zijn dan 0,004 °C;
        - - de standaardafwijking van de verschillen ten opzichte van resultaten met de referentiemethode kleiner dient te
      zijn dan 0,004 °C.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel17
  - number: '18'
    text: Het vriespunt wordt uitgedrukt in °C.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel18
  - number: 18a
    text: |-
      De toe te passen methode berust op de verwarming van een hoeveelheid monster in een afgesloten flesje met een
      septum. Aansluitend wordt een deel van de bovenstaande gasfase (headspace) in een gaschromatograaf geïnjecteerd.
      Na scheiding van de gehalogeneerde koolwaterstoffen vindt detectie plaats middels een EC-detector en wordt
      het chloroformgehalte met behulp van een kalibratiecurve gekwantificeerd. Het gemeten gehalte wordt vervolgens
      gecombineerd met het volgens [artikel 19][ref1] gemeten vetgehalte van het monster. Het chloroformgehalte wordt
      uitgedrukt in milligram chloroform per kilogram vet. Bij een vetgehalte van 4,5% en een chloroformgehalte van 0,2
      mg/kg vet dient de herhaalbaarheid van de meting kleiner te zijn dan 0,02 mg/kg vet.


      [ref1]: https://wetten.overheid.nl/BWBR0014032#Artikel19
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0014032
        artikel: '19'
  - number: '19'
    text: |-
      Voor de bepaling van het vetgehalte geldt de methode volgens NEN-EN-ISO 1211 als referentiemethode. Voor de
      bepaling van het eiwitgehalte geldt de methode volgens NEN-EN-ISO 8968 deel 1 of deel 2 als referentiemethode.
      Bij toepassing van alternatieve methoden voor de bepaling van het vet- en eiwitgehalte mogen geen wezenlijke
      afwijkingen worden verkregen van de uitslagen volgens de genoemde referentiemethoden.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel19
  - number: '20'
    text: |-
      Per kalendermaand neemt het COKZ minimaal twee series monsters voor uitvoering van heronderzoek bij een door het
      productschap aangewezen laboratorium. Per serie worden 6 willekeurig gekozen monsters onderzocht op vetgehalte met
      de methode volgens NEN-EN-ISO 1211 en 6 willekeurig gekozen monsters op eiwitgehalte met de methode volgens NEN-EN-
      ISO 8968 deel 1 of deel 2. Voor de beoordeling van de resultaten gelden per serie onderzochte monsters ten aanzien
      van gemiddelde verschillen en standaardafwijking de volgende normen:
          Gemiddelde verschillen (% m/m)







                  vet:


                  goed


                  : < 0,025%





                  voldoende


                  : ≥ 0,025% en ≤ 0,040%





                  onvoldoende


                  : > 0,040%




                  eiwit:


                  goed


                  : < 0,030%





                  voldoende


                  : ≥ 0,030% en ≤ 0,045%





                  onvoldoende


                  : > 0,045%





          Standaardafwijking (% m/m)







                  vet


                  goed


                  : < 0,035%





                  voldoende


                  : ≥ 0,035% en ≤ 0,040%





                  onvoldoende


                  : > 0,040%




                  eiwit


                  goed


                  : < 0,040%





                  voldoende


                  : ≥ 0,040% en ≤ 0,045%





                  onvoldoende


                  : > 0,045%
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel20
  - number: '21'
    text: |-
      Gemiddeld mag, over een willekeurige periode van 1 jaar, het gemiddelde verschil per component hoogstens plus of
      min 0,010% bedragen voor het voldoen aan het criterium, als bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014032#Artikel20
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014032
        artikel: '20'
  - number: '22'
    text: |-
      De Zuivelverordening 2000, Methoden van kwaliteitsonderzoek en het Besluit 2000, Beoordeling resultaten onderzoek
      samenstelling boerderijmelk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel22
  - number: '23'
    text: Deze verordening wordt aangehaald als Zuivelverordening 2003, Eisen methoden van onderzoek.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel23
  - number: '24'
    text: Deze verordening treedt in werking op een nader door het bestuur vast te stellen datum.
    url: https://wetten.overheid.nl/BWBR0014032/2014-05-03#Artikel24
