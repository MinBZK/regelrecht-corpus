  - number: XII
    text: |-
      Op de berekening van de hoogte van de transitievergoeding blijft
      [artikel 673, eerste, tweede, vierde en negende lid van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat luidde
      voor het tijdstip van inwerkingtreding van [artikel I, onderdeel J][ref2], van toepassing, indien:

      a. de arbeidsovereenkomst voor dat tijdstip is opgezegd;

      b. de werknemer voor dat tijdstip schriftelijke instemming als bedoeld in
      [artikel 671, eerste lid, aanhef, van Boek 7 van het Burgerlijk Wetboek][ref3] heeft gegeven;

      c. de arbeidsovereenkomst is opgezegd met toestemming als bedoeld in
      [artikel 671a, eerste of tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref4] en het verzoek om toestemming
      voor dat tijdstip is gedaan; of

      d. het verzoek tot ontbinding van de arbeidsovereenkomst voor dat tijdstip is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel673
      [ref2]: https://wetten.overheid.nl/BWBR0042307#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel671
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel671a
