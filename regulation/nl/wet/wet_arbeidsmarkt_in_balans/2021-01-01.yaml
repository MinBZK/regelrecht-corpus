  - number: X
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0042307/2021-01-01#ArtikelX
  - number: XI
    text: |-
      De [artikelen 669, derde lid, onderdeel i][ref1], en
      [671b, achtste lid, van Boek 7 van het Burgerlijk Wetboek][ref2], zoals deze luiden na het tijdstip van
      inwerkingtreding van [artikel I, onderdelen G en H][ref3], zijn niet van toepassing, indien het verzoek tot
      ontbinding van de arbeidsovereenkomst voor dat tijdstip is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel669
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel671b
      [ref3]: https://wetten.overheid.nl/BWBR0042307#ArtikelI
