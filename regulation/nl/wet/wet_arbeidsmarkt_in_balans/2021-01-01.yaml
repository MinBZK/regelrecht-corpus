  - number: XV
    text: |-
      1 De [artikelen 673a][ref1], [673c][ref2] en [673d van Boek 7 van het Burgerlijk Wetboek][ref3], zoals deze luidden
      op 31 december 2019, blijven van toepassing, indien:

      a. de arbeidsovereenkomst voor 1 januari 2020 is opgezegd;

      b. de werknemer voor 1 januari 2020 schriftelijke instemming als bedoeld in
      [artikel 671, eerste lid, aanhef, van Boek 7 van het Burgerlijk Wetboek][ref4] heeft gegeven;

      c. de arbeidsovereenkomst is opgezegd met toestemming als bedoeld in
      [artikel 671a, eerste of tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref5] en het verzoek om toestemming is
      gedaan voor 1 januari 2020; of

      d. het verzoek tot ontbinding van de arbeidsovereenkomst voor 1 januari 2020 is ingediend.

      2 [Artikel 673a][ref6], zoals dat luidde op 31 december 2019, is niet van toepassing, indien op grond van
      [artikel 673b, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref7] bij collectieve arbeidsovereenkomst of
      regeling door of namens een daartoe bevoegd bestuursorgaan is bepaald dat geen transitievergoeding is verschuldigd.


