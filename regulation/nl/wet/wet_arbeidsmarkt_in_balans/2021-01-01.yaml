  - number: XIII
    text: |-
      1 In afwijking van
      [artikel 673e, eerste lid, onderdeel a, aanhef, en onder 2, van Boek 7 van het Burgerlijk Wetboek][ref1], wordt de
      vergoeding, bedoeld in het eerste lid van dat artikel ook verstrekt, indien de arbeidsovereenkomst van rechtswege
      is geëindigd voor het tijdstip van inwerkingtreding van [artikel I, onderdeel J][ref2], en de periode, bedoeld in
      [artikel 670, eerste lid, onderdeel a, en lid 11, van Boek 7 van het Burgerlijk Wetboek][ref3] nog niet verstreken
      was.

      2 Indien [artikel 673, eerste, tweede, vierde en negende lid, van Boek 7 van het Burgerlijk Wetboek][ref4],
      zoals dat luidt na het tijdstip van inwerkingtreding van [artikel I, onderdeel J][ref5], van toepassing
      is op de berekening van de hoogte van de transitievergoeding, is dat artikel tevens van toepassing
      op de berekening van de hoogte van de transitievergoeding die, voor aftrek van de kosten, bedoeld in
      artikel 673, lid 6, van Boek 7 van het Burgerlijk Wetboek, verschuldigd zou zijn bij het beëindigen of
      niet voortzetten van de arbeidsovereenkomst op de dag na het verstrijken van het tijdvak, bedoeld in
      [artikel 629, lid 1 of 2, van Boek 7 van het Burgerlijk Wetboek][ref6].


