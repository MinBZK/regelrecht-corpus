preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om Boek 7 van het Burgerlijk Wetboek, de Wet allocatie
    arbeidskrachten door intermediairs, de Wet financiering sociale verzekeringen en enige andere wetten te wijzigen
    om een nieuwe ontslaggrond in te voeren, de mogelijkheden om een flexibele arbeidsovereenkomst aan te gaan te
    verruimen waar de aard van het werk dit vereist, de proeftijd te verlengen, de transitievergoeding voor langdurige
    arbeidsovereenkomsten te verlagen en tegelijkertijd vanaf de eerste dag recht op transitievergoeding te laten
    ontstaan, regels te stellen ter voorkoming van permanente beschikbaarheid van werknemers met oproepcontracten, te
    bewerkstelligen dat concurrentie op arbeidsvoorwaarden bij payrolling wordt voorkomen, een WW-premie in te voeren
    waarvan de hoogte afhankelijk is van de contractvorm en de sectorpremies af te schaffen, teneinde de balans tussen
    vaste en flexibele arbeidsovereenkomsten te verbeteren;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042307/2021-01-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      Indien sprake is van een oproepovereenkomst als bedoeld in
      [artikel 628a, negende en tiende lid, van Boek 7 van het Burgerlijk Wetboek][ref1], en de arbeidsovereenkomst op
      het tijdstip van inwerkingtreding van [artikel I, onderdeel B][ref2], langer dan 12 maanden heeft geduurd, doet de
      werkgever het aanbod, bedoeld in artikel 628a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek, in afwijking van
      de eerste zin van dat lid, voor de eerste keer binnen een maand na het tijdstip van inwerkingtreding van artikel
      I, onderdeel B. Het aanbod is ten minste gelijk aan de gemiddelde omvang van de arbeid per maand in de 12 maanden
      voorafgaand aan het tijdstip van inwerkingtreding van artikel I, onderdeel B. Voor de berekening van de periode van
      12 maanden, bedoeld in de eerste zin, worden arbeidsovereenkomsten, die elkaar met tussenpozen van ten hoogste zes
      maanden hebben opgevolgd, samengeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628a
      [ref2]: https://wetten.overheid.nl/BWBR0042307#ArtikelI
    url: https://wetten.overheid.nl/BWBR0042307/2021-01-01#ArtikelIX
