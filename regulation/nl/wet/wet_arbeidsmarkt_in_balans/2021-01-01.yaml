  - number: XVI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met uitzondering van
      [artikel III, onderdelen J en K][ref1], dat in werking treedt met ingang van de dag na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst en terugwerkt tot en met 29 juni 2018, 17.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0042307#ArtikelIII
