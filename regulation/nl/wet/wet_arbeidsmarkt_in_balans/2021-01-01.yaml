  - number: XIV
    text: |-
      Op de payrollovereenkomst, bedoeld in [artikel 692 van Boek 7 van het Burgerlijk Wetboek][ref1], zoals dat artikel
      luidt na het tijdstip van inwerkingtreding van [artikel I, onderdeel O][ref2], die is gesloten voor het tijdstip
      van inwerkingtreding van dat artikel:

      a. blijft [artikel 691, eerste en achtste lid, van Boek 7 van het Burgerlijk Wetboek][ref3], zoals dat artikel
      luidde voor het tijdstip van inwerkingtreding van [artikel I, onderdeel N][ref4], voor zover het betreft de
      termijn, bedoeld in artikel 691, eerste lid, van toepassing;

      b. blijft [artikel 668a, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref5], zoals dat luidde voor het
      tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref6], van toepassing; en

      c. is [artikel 692a, vijfde lid][ref7], zoals dat luidt na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel P][ref8], niet van toepassing.


