        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '11'
  - number: '77'
    text: |-
      Voor zover deze wet niet anders bepaalt, wordt hetgeen tot haar uitvoering nodig is bij of krachtens algemene
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel77
  - number: '79'
    text: 'Deze wet wordt aangehaald als: Algemene Wet Bijzondere Ziektekosten.'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel79
