  - number: 76a.1
    text: |-
      De voordracht tot het vaststellen van een algemene maatregel van bestuur als bedoeld in de
      [artikel 5, derde en vierde lid][ref1], en [artikel 6][ref2], wordt gedaan door Onze Minister in overeenstemming
      met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 76a.2
    text: |-
      Indien een algemene maatregel van bestuur, bedoeld in [artikel 6][ref1], geen zodanige invloed
      heeft op de geldelijke omvang van de verstrekkingen dat zulks verhoging of verlaging van de in
      [artikel 11, tweede lid, van de Wet financiering volksverzekeringen][ref2] bedoelde premies tot gevolg heeft, zal,
      in afwijking van het eerste lid, een voordracht tot het vaststellen daarvan worden gedaan door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel11
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel76a
    references:
