      uitvoerend orgaan: een orgaan als bedoeld in [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel38
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
    references:
