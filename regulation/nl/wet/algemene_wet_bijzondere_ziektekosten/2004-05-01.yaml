      het College: het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 1.1.g
    text: 'het College toezicht: het College van toezicht op de zorgverzekeringen, bedoeld in de Ziekenfondswet;'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.1.h
    text: 'uitvoeringsorgaan: een ziekenfonds, een ziektekostenverzekeraar en een uitvoerend orgaan;'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.1.i
    text: |-
      Algemeen Fonds Bijzondere Ziektekosten: het fonds, bedoeld in
      [artikel 38 van de Wet financiering volksverzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel38
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '38'
  - number: 1.1.j
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.1.k
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel1
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke in Nederland hun thuishaven hebben,
      ten opzichte van de bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in de
      Nederlandse Antillen, Aruba of op het grondgebied van een andere Mogendheid te hebben gewoond, wordt ook voor de
      duur van zijn afwezigheid geacht in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel3
  - number: '4'
    text: |-
      In de uitvoering van de in deze wet geregelde verzekering wordt, voor zover bij of krachtens deze wet niet anders
      is bepaald, voorzien door de uitvoeringsorganen en het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel4
  - number: '5.1'
    text: 'Verzekerd overeenkomstig de bepalingen van deze wet is degene, die:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: 5.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: 5.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland in dienstbetrekking verrichte arbeid aan de loonbelasting is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid zijn vreemdelingen die niet rechtmatig in Nederland verblijf genieten als bedoeld
      in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], niet verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden. In die algemene maatregel van bestuur kan aan het College
      zorgverzekeringen worden opgedragen op een aanvraag van een belanghebbende die bij de algemene maatregel van
      bestuur van de verzekering ingevolge deze wet is uitgezonderd, een verklaring af te geven dat hij niet verzekerd
      is.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding worden
      gegeven aan de kring der verzekerden voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: 5.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
  - number: 5.4.b
    text: |-
      vreemdelingen die, na in Nederland rechtmatig verblijf te hebben genoten als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], tijdig toelating in aansluiting op dat
      verblijf hebben aangevraagd, dan wel bezwaar hebben gemaakt of beroep hebben ingesteld tegen de intrekking van het
      besluit tot toelating, totdat op die aanvraag, dat bezwaar of dat beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5a.1
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of de kosten daarvan vervalt met
      ingang van de dag waarop en voor zover voor een verzekerde ingevolge deze wet uit deze wet aanspraken voortvloeien
      gelijkwaardig aan die, welke aan genoemde overeenkomst kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5a
  - number: 5a.2
    text: |-
      Een ziektekostenverzekeraar verlaagt voor alle verzekerden in gelijke mate en naar rato van het vervallen
      gedeelte van de in het eerste lid bedoelde overeenkomsten de tarieven van gesloten en nieuw af te sluiten
      ziektekostenverzekeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5a
  - number: 5a.3
    text: |-
      De premie, welke degene wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk is
      vervallen, heeft vooruitbetaald, wordt door de ziektekostenverzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 percent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5a
  - number: 5b
    text: |-
      Zo nodig in afwijking van [artikel 5][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 5b.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5b
  - number: 5b.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel5b
  - number: '6.1'
    text: |-
      De verzekerden hebben aanspraak op zorg ter voorkoming van ziekten en ter voorziening in hun geneeskundige
      behandeling, verpleging en verzorging. Onder vorenbedoelde zorg zijn begrepen voorzieningen tot behoud, herstel
      of ter bevordering van de arbeidsgeschiktheid of strekkende tot verbetering van levensomstandigheden, alsmede
      maatschappelijke dienstverlening. Bij of krachtens algemene maatregel van bestuur worden aard, inhoud en omvang
      van de zorg waarop aanspraak bestaat, geregeld; daarbij kunnen met betrekking tot de inhoud en omvang van de
      desbetreffende zorg beperkingen worden gesteld. De uitvoeringsorganen dragen zorg dat de bij hen ingeschreven
      verzekerden hun aanspraak op zorg tot gelding kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.2'
    text: |-
      Uitvoeringsorganen bepalen bij reglement of zorg, bedoeld in het eerste lid, aan bij hen ingeschreven verzekerden
      als verstrekking wordt verleend danwel dat aan de verzekerden uitkeringen in geld worden gedaan wegens kosten die
      deze verzekerden hebben gemaakt voor de bedoelde zorg of voor een in het reglement aangegeven deel daarvan danwel
      dat de verzekerden de keuze wordt gelaten tussen zorgverlening als verstrekking en een zodanige uitkering in
      geld. Behoudens toepassing van het derde lid is de uitkering, bedoeld in de vorige volzin, gelijk aan het aan de
      verzekerde rechtsgeldig in rekening gebrachte tarief. Bij de in het eerste lid bedoelde algemene maatregel kan met
      betrekking tot bij die maatregel aan te geven vormen van zorg worden bepaald dat deze uitsluitend als verstrekking
      aan de verzekerden wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan als voorwaarde voor het verkrijgen van een verstrekking worden
      gesteld dat de verzekerde bijdraagt in de kosten daarvan: de bijdrage kan verschillen naar gelang de groep waartoe
      de verzekerde behoort en de zorg en voorzieningen die verstrekt worden en mede afhankelijk gesteld worden van
      het inkomen van de verzekerde en diens echtgenoot. Indien een uitvoeringsorgaan met toepassing van het tweede lid
      aan de verzekerde een uitkering in geld doet blijft een overeenkomstig de vorige volzin te berekenen bedrag voor
      rekening van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.4'
    text: |-
      De laatste volzin van het eerste lid is niet van toepassing met betrekking tot het verlenen van verstrekkingen
      onder verantwoordelijkheid, waaronder begrepen de financiële verantwoordelijkheid, van Onze Minister van Justitie
      in het kader van de uitvoering van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat een verstrekking wordt voortgezet na het
      tijdstip, waarop de verzekering is geëindigd of dat aanspraak op een uitkering bestaat voor zorg die wordt verleend
      na dat tijdstip. Daarbij kunnen beperkingen en voorwaarden worden gesteld. De wijze waarop een zodanige aanspraak
      geldend wordt gemaakt wordt daarbij eveneens geregeld.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.6'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat de uitvoeringsorganen een verstrekking weigeren of op
      een later tijdstip doen ingaan, dan wel een hogere bijdrage van de verzekerde vorderen dan krachtens het tweede lid
      van dit artikel is vastgesteld, dan wel een uitkering geheel of gedeeltelijk weigeren, in de bij of krachtens die
      maatregel aan te geven gevallen en omstandigheden, waarin de kosten van het verlenen van de desbetreffende zorg in
      redelijkheid niet of niet volledig ten laste van de in deze wet geregelde verzekering dienen te komen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '6.7'
    text: |-
      Onverminderd hetgeen elders in deze wet wordt bepaald, dient de wijze waarop de in dit artikel bedoelde aanspraken
      tot gelding worden gebracht, door het uitvoeringsorgaan met de verzekerde schriftelijk te worden overeengekomen.
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 9, derde lid][ref1], kunnen regels worden gesteld met
      betrekking tot de duur van een overeenkomst als bedoeld in de eerste volzin. Het uitvoeringsorgaan bepaalt bij
      reglement de wijze waarop de in dit artikel bedoelde aanspraken tot gelding worden gebracht voor zolang een in de
      eerste volzin bedoelde overeenkomst niet tot stand is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '9'
        hoofdstuk: III
  - number: '6.8'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-
      Generaal overgelegd. Zij treedt in werking op een tijdstip dat nadat dertig dagen na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der Kamers de wens te kennen
      wordt gegeven dat het in de algemene maatregel geregelde onderwerp bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en wordt de algemene maatregel ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel6
  - number: '7.1'
    text: |-
      Voor militairen in werkelijke dienst treden de aanspraken inzake geneeskundige verzorging door of vanwege de
      Militair Geneeskundige Dienst in de plaats van de aanspraken krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt een regeling getroffen voor de verzekerden die, onder
      voorwaarden en regelen te stellen door Onze Minister van Defensie, als gezinslid van een militair aanspraak
      hebben op geneeskundige behandeling, verpleging en verzorging of een tegemoetkoming in de kosten daarvan jegens
      Onze Minister van Defensie. Bij deze algemene maatregel van bestuur kan worden bepaald, dat voor de betrokken
      verzekerden de aanspraken, voortvloeiende uit de desbetreffende van Onze Minister van Defensie uitgaande regeling
      in de plaats treden van de aanspraken krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur worden regelen gesteld inzake een
      uitkering door het College zorgverzekeringen aan Onze Minister van Defensie ten laste van het Algemeen Fonds
      Bijzondere Ziektekosten in verband met het vervallen van de aanspraken ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel7
  - number: '7.4'
    text: |-
      Al hetgeen de verdere uitvoering van dit artikel betreft wordt bij of krachtens algemene maatregel van bestuur
      geregeld. Daarbij kan tevens de controle worden geregeld op het verlenen van verstrekkingen ingevolge de aanspraken
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel7
  - number: '8.1'
    text: |-
      Een instelling die zorg als bedoeld in [artikel 6][ref1] verleent, moet als zodanig zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een instelling, behorende tot een bij de maatregel aan te
      wijzen categorie van instellingen, voor de toepassing van deze wet als toegelaten wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8
  - number: '8.3'
    text: Het College zorgverzekeringen beslist op aanvragen om toelating.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8
  - number: '8.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden bepaald de aard van de te verstrekken gegevens, alsmede de
      wijze waarop en de termijn waarbinnen de gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8
  - number: 8b
    text: 'Een toelating wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8b
  - number: 8b.a
    text: |-
      met betrekking tot instellingen die een ziekenhuisvoorziening in de zin van de [Wet ziekenhuisvoorzieningen][ref1]
      in stand houden: voor zover de instelling niet voldoet aan de ingevolge die wet geldende voorschriften inzake
      spreiding en behoefte;


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: 8b.b
    text: |-
      met betrekking tot de overige instellingen: voor zover de instelling niet voldoet aan de door Onze Minister vast te
      stellen voorschriften inzake spreiding en behoefte.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8b
  - number: 8d.1
    text: |-
      Instellingen, aangewezen door Onze Minister, in overeenstemming met hetzij Onze Minister van Justitie, hetzij Onze
      Minister van Defensie, worden beschouwd als instellingen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8d
  - number: 8d.2
    text: Academische ziekenhuizen worden beschouwd als instellingen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8d
  - number: 8e
    text: |-
      Behoudens voor zover bij de toelating anders is aangegeven, worden de werkzaamheden van de instelling ter zake
      van de verlening van zorg, bedoeld in [artikel 6][ref1] verricht op de wijze en in de omvang overeenkomstig de
      gegevens, verstrekt bij de aanvraag om toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 8f
    text: 'Een toelating wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8f
  - number: 8f.a
    text: |-
      voor zover de instelling niet meer voldoet aan de voorschriften, bedoeld in [artikel 8b, onder a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 8b
        hoofdstuk: III
  - number: 8f.b
    text: |-
      indien de instelling in strijd handelt met [artikel 8e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8e
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 8e
        hoofdstuk: III
  - number: 8g
    text: |-
      Een toegelaten instelling is verplicht, voor zover het College zorgverzekeringen zulks voor de toepassing van deze
      paragraaf behoeft, deze alle gevraagde mondeling en schriftelijke inlichtingen en gegevens te verstrekken en inzage
      te geven van boeken en bescheiden, welke betrekking hebben op het gevoerde beheer en de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8g
  - number: 8h
    text: |-
      Indien een maatregel als bedoeld in [artikel 18][ref1] is getroffen, wordt de toelating geacht dienovereenkomstig
      te zijn gewijzigd dan wel ingetrokken. In afwijking van [artikel 62][ref2] kan ter zake geen voorziening worden
      gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel62
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel8h
    references:
      - id: ref1
        bwb_id: BWBR0002753
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '62'
        hoofdstuk: IX
  - number: '9.1'
    text: |-
      Voor degene, die verzekerd is in de zin van de [Ziekenfondswet][ref1] en als zodanig bij een ziekenfonds is
      ingeschreven, dan wel in verband met zijn geneeskundige verzorging verzekerd is bij een ziektekostenverzekeraar,
      geldt met inachtneming van hetgeen overigens in dit artikel is bepaald de inschrijving bij het ziekenfonds,
      onderscheidenlijk de verzekering bij de ziektekostenverzekeraars, tevens als inschrijving voor de toepassing van
      deze wet. Voor degene, die deelnemer is aan een publiekrechtelijke ziektekostenregeling voor ambtenaren geldt het
      deelnemerschap tevens als inschrijving voor de toepassing van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '9.2'
    text: |-
      Degene, die noch bij een ziekenfonds is ingeschreven noch bij een ziektekostenverzekeraar is verzekerd noch
      deelneemt aan een publiekrechtelijke ziektekostenregeling voor ambtenaren, doch die als verzekerde in de
      zin van deze wet de aanspraken, welke hem ingevolge deze wet toekomen, geldend wil maken, meldt zich met
      inachtneming van het krachtens het derde lid bepaalde daartoe aan, hetzij bij een ziekenfonds dan wel bij een
      ziektekostenverzekeraar, werkende in de gemeente of het deel van de gemeente waar hij woont. Deze zijn verplicht
      hem voor dit doel als verzekerde in te schrijven.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9
  - number: '9.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen betreffende de inschrijving nadere en zonodig van deze wet
      afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9
  - number: '9.4'
    text: |-
      Onverminderd het eerste en tweede lid komt voor degene, die vrijwillig verzekerde is ingevolge [artikel 32a][ref1],
      de inschrijving eerst tot stand nadat hij de beschikking, bedoeld in [artikel 32b, derde lid][ref2], heeft
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 32b
        hoofdstuk: IVA
  - number: '9.5'
    text: |-
      Het uitvoeringsorgaan waarbij betrokkene wordt ingeschreven, stelt de Sociale verzekeringsbank terstond van de
      inschrijving in kennis.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9
  - number: 9a.1
    text: |-
      Burgemeester en wethouders voorzien erin dat in hun gemeente ten behoeve van de inwoners een onafhankelijk
      indicatieorgaan werkzaam is, dat kosteloos besluit of een inwoner is aangewezen op een van de bij algemene
      maatregel van bestuur aangewezen vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9a
  - number: 9a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de samenstelling en de werkwijze
      van het indicatieorgaan, alsmede over de geldigheidsduur van besluiten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9a
  - number: 9a.3
    text: Een indicatieorgaan verricht geen andere dan bij of krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9a
  - number: 9a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen aan indicatieorganen werkzaamheden worden opgedragen die
      verband houden met de taken die bij de wet zijn opgedragen. Burgemeester en wethouders kunnen het indicatieorgaan
      advies vragen omtrent toekenning van voorzieningen waarbij de gezondheid of het maatschappelijk functioneren van
      een persoon van belang is.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9a
  - number: 9b.1
    text: |-
      Aanspraak op zorg, aangewezen ingevolge artikel 9a, eerste lid, bestaat slechts indien en gedurende de periode
      waarvoor het bevoegde indicatieorgaan op een door de verzekerde ingediende aanvraag heeft besloten dat deze naar
      aard, inhoud en omvang op die zorg is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9b
  - number: 9b.2
    text: |-
      In afwijking van het eerste lid worden er bij algemene maatregel van bestuur regels gesteld voor gevallen waarin
      het besluit niet afgewacht kan worden.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9b
  - number: 9b.3
    text: |-
      De aanspraak op andere vormen van zorg dan die zijn aangewezen ingevolge artikel 9a, eerste lid, kan slechts
      tot gelding worden gebracht voor zover de verzekerde, gelet op zijn behoefte en uit een oogpunt van doelmatige
      zorgverlening, daarop naar aard, inhoud en omvang redelijkerwijs is aangewezen. Bij of krachtens algemene maatregel
      van bestuur kan worden geregeld door wie en op welke wijze wordt beoordeeld of de verzekerde aangewezen is op een
      bepaalde vorm van zorg. Deze regels zijn zodanig dat wordt gewaarborgd dat de beoordeling onafhankelijk geschiedt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9b
  - number: 9c.1
    text: |-
      De verzekerde is verplicht desgevraagd aan het uitvoeringsorgaan, waarbij hij zich aanmeldt
      onderscheidenlijk waarbij hij is ingeschreven of waaraan hij deelneemt, een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 9c.2
    text: |-
      Het uitvoeringsorgaan stelt voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet de
      identiteit vast van de persoon bedoeld in het eerste lid aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] en neemt daarvan aard en nummer op in de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 9c.3
    text: |-
      Het uitvoeringsorgaan verlangt van de vreemdeling die zich als verzekerde aanmeldt een kopie van het document
      of de schriftelijke verklaring bedoeld in [artikel 9, tweede lid, van de Vreemdelingenwet 2000][ref1], dat wordt
      aangemerkt als een bescheid als bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.1'
    text: |-
      De verzekerde die zijn aanspraak op zorg tot gelding wil brengen, wendt zich voor het ontvangen van de
      desbetreffende zorg, behalve in gevallen, genoemd bij of krachtens de algemene maatregel van bestuur,
      bedoeld in [het eerste lid van artikel 6][ref1], en voor wat betreft de verstrekkingen, bedoeld in
      [artikel 6, vierde lid][ref2], tot een persoon of instelling naar eigen keuze, met wie of met welke het
      uitvoeringsorgaan, waarbij hij is ingeschreven, tot dat doel een overeenkomst heeft gesloten, een en ander
      behoudens het bepaalde in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      Een uitvoeringsorgaan kan aan een verzekerde toestemming verlenen zich voor het tot gelding brengen van zijn
      aanspraak op zorg, in afwijking van het bepaalde in het eerste lid, te wenden tot een andere persoon of instelling
      in Nederland, indien zulks voor de verkrijging van de in [artikel 6][ref1] bedoelde zorg voor de verzekerde nodig
      is. Bij ministeriële regeling kan worden bepaald in welke gevallen en onder welke voorwaarden aan een verzekerde
      ook toestemming kan worden verleend zich voor het tot gelding brengen van zijn aanspraak te wenden tot een persoon
      of inrichting buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '10.3'
    text: |-
      In de overeenkomsten, bedoeld in het eerste lid, kan worden bepaald dat verzekerden om hun aanspraak op zorg tot
      gelding te brengen door het uitvoeringsorgaan moeten zijn ingeschreven op naam van een persoon of een instelling
      als bedoeld in het eerste lid. Daarbij kunnen regels worden gesteld ter beperking van het aantal ten name van
      een persoon of instelling in te schrijven verzekerden. Bij reglement van het uitvoeringsorgaan kan het aantal
      overschrijvingen van een verzekerde in een bepaald tijdvak aan een maximum worden gebonden en kunnen regels worden
      gesteld betreffende de tijdstippen van overschrijving.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel10
  - number: '10.4'
    text: |-
      Het verlenen van verstrekkingen, bedoeld in [artikel 6, vierde lid][ref1], geschiedt overeenkomstig hetgeen
      daaromtrent elders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke mate en onder welke voorwaarden aanspraak
      bestaat op een verstrekking of op een uitkering ter zake van zorg, bedoeld in [artikel 6][ref1], verleend in of
      buiten Nederland, in gevallen, waarin aan een verzekerde als gevolg van in die algemene maatregel van bestuur
      omschreven omstandigheden zorg is verleend, welke hij, hadden die omstandigheden zich niet voorgedaan, op de in
      [artikel 10][ref2] omschreven wijze had kunnen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel10
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '10'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Indien Onze Minister van oordeel is dat alle of door hem aan te wijzen uitvoeringsorganen in de onmogelijkheid
      verkeren op voor hen aanvaardbare voorwaarden met een genoegzaam aantal personen of instellingen overeenkomsten te
      sluiten als bedoeld in [artikel 42][ref1], kan bij ministeriële regeling worden bepaald dat de verzekerden van die
      uitvoeringsorganen jegens het uitvoeringsorgaan aanspraak hebben op een uitkering in geld wegens gemaakte kosten
      ter zake van aan die verzekerden verleende zorg, bedoeld in [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, wordt tevens bepaald onder welke voorwaarden en tot welk
      bedrag aanspraak op een uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel12
  - number: '12.3'
    text: De bekendmaking van een besluit als bedoeld in het eerste lid, gaat vergezeld van een toelichting daarop.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel12
  - number: '14'
    text: |-
      Een uitvoeringsorgaan is verplicht zijn werkzaamheden op een doelmatige wijze uit te voeren. Het treft de nodige
      maatregelen ter voorkoming van onnodige verstrekkingen en van uitgaven, welke hoger dan noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel14
  - number: '16.1'
    text: |-
      Ten aanzien van het verlenen van bij algemene maatregel van bestuur aan te wijzen zorg, bedoeld in
      [artikel 6][ref1], kan bij algemene maatregel van bestuur worden bepaald, dat de administratie geheel of ten dele
      wordt verricht door een of meer door Onze Minister aan te wijzen rechtspersonen en dat de controle geheel of ten
      dele wordt uitgeoefend door een of meer door Onze Minister aan te wijzen rechtspersonen. Daarbij wordt tevens
      bepaald, volgens welke regels en onder wiens verantwoordelijkheid in zodanig geval de administratie wordt verricht
      en de controle wordt uitgeoefend, alsmede op welke wijze de kosten hiervan worden gedekt uit het Algemeen Fonds
      Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '16.2'
    text: |-
      Controle op het verlenen van verstrekkingen, als bedoeld in [het vierde lid van artikel 6][ref1], wordt geregeld
      bij ministeriële regeling, in overeenstemming met Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '16.3'
    text: |-
      Bij de in [het derde lid van artikel 6][ref1] bedoelde maatregel wordt nader bepaald of en in welke mate wordt
      afgeweken van het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verzekerde die de leeftijd van achttien jaren
      heeft bereikt, aan het uitvoeringsorgaan, waarbij hij is ingeschreven, een, voor alle verzekerden gelijke,
      bij ministeriële regeling vast te stellen premie is verschuldigd. Bij de algemene maatregel van bestuur kan
      worden bepaald dat ten aanzien van daarbij aangegeven groepen van verzekerden een afwijkende premie kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel17
  - number: '17.2'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur kunnen regels worden gesteld omtrent de betaling
      van de premie en de gevolgen van niet tijdige betaling.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel17
  - number: '17.3'
    text: |-
      De premie wordt aangewend ter dekking van de kosten van verstrekkingen en vergoedingen die aan de uitvoering van
      deze wet voor het uitvoeringsorgaan zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel17
  - number: '17.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de *Staatscourant* is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel17
  - number: '32.1'
    text: |-
      Degene, die gemoedsbezwaren heeft tegen de in deze wet geregelde verzekering, alsmede de rechtspersoon waarbij
      natuurlijke personen zijn betrokken die zodanige gemoedsbezwaren hebben, kunnen van verplichtingen, welke hun bij
      of krachtens [Hoofdstuk II van de Wet financiering volksverzekeringen][ref1] (*Stb.* 1989, 129) zijn opgelegd,
      overeenkomstig het bij of krachtens [paragraaf 8 van dat hoofdstuk][ref2] bepaalde, worden vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004538
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004538
        paragraaf: '8'
  - number: '32.2'
    text: |-
      De aan een verzekerde verleende vrijstelling, bedoeld in het eerste lid, geldt tevens als vrijstelling voor de
      verplichtingen bij of krachtens [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel17
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '17'
        hoofdstuk: IV
  - number: 32a.1
    text: |-
      Degene, wiens verzekering ingevolge [artikel 5][ref1] is geëindigd, kan de verzekering op grond van deze wet
      vrijwillig voortzetten indien hij buiten Nederland woont en:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 32a.1.a)
    text: |-
      op de dag van vertrek uit Nederland recht had op: 1e een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], 2e een uitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref2], 3e een pensioen op basis van arbeidsongeschiktheid
      op grond van de [Algemene burgerlijke pensioenwet](onbekend), zoals die luidde voor 1 januari 1996, dan
      wel een WAO-conforme uitkering op grond van de [Wet privatisering ABP](onbekend), zoals die luidde voor 1
      januari 1998, een pensioen op basis van arbeidsongeschiktheid op grond van de Spoorwegpensioenwet, zoals
      die luidde voor 1 januari 1994, dan wel een pensioen op basis van arbeidsongeschiktheid op grond van de
      [Wet privatisering Spoorwegpensioenfonds][ref3] of een pensioen op basis van arbeidsongeschiktheid op grond
      van de Algemene militaire pensioenwet, zoals die luidde voor 1 januari 1998, 4e een uitkering op grond van de
      [Algemene Ouderdomswet][ref4], 5e een nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref5], 6e
      een uitkering of toelage op grond van de Algemene Arbeidsongeschiktheidswet, zoals die luidde op de dag voorafgaand
      aan de inwerkingtreding van de [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref6], 7e een
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], 8e een uitkering op grond
      van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], voorzover en zolang hij die uitkering, dat
      pensioen of die toelage ontvangt en die uitkering, dat pensioen of die toelage ten minste gelijk is aan 35% van het
      in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref9] bedoelde bedrag,
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002822
      [ref3]: https://wetten.overheid.nl/BWBR0006319
      [ref4]: https://wetten.overheid.nl/BWBR0002221
      [ref5]: https://wetten.overheid.nl/BWBR0007795
      [ref6]: https://wetten.overheid.nl/BWBR0008658
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002822
      - id: ref3
        bwb_id: BWBR0006319
      - id: ref4
        bwb_id: BWBR0002221
      - id: ref5
        bwb_id: BWBR0007795
      - id: ref6
        bwb_id: BWBR0008658
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 32a.1.b
    text: |-
      recht heeft op een uitkering, een pensioen of een toelage als bedoeld [onder a][ref1], indien dat recht
      aansluit op de verzekering van rechtswege op grond van de volksverzekeringen, dan wel, ter vervanging daarvan,
      op een andere uitkering, pensioen of toelage, bedoeld onder a, zolang hij die uitkering, dat pensioen of
      die toelage ontvangt en die uitkering, dat pensioen of die toelage ten minste gelijk is aan 35% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2] bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 32a.2
    text: |-
      Het eerste lid is slechts van toepassing op personen die onmiddellijk voorafgaand aan de ingangsdatum van de
      vrijwillige verzekering ten minste een jaar onafgebroken verzekerd zijn geweest ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
  - number: 32a.3
    text: |-
      Het eerste lid is niet van toepassing op personen die buiten Nederland arbeid verrichten of een uitkering ontvangen
      krachtens een buitenlandse wettelijke regeling.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
  - number: 32a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen andere groepen van rechthebbenden op uitkeringen of pensioenen dan
      bedoeld in het eerste lid worden aangewezen die de verzekering op grond van deze wet vrijwillig kunnen voortzetten,
      dan wel kan daarbij worden bepaald dat de echtgenoot van een persoon als bedoeld in het eerste lid of in dit lid
      deze verzekering vrijwillig kan voortzetten.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32a
  - number: 32b.1
    text: |-
      Aanmelding voor de vrijwillige verzekering geschiedt uiterlijk twaalf maanden na de dag, waarop de verzekering
      ingevolge [artikel 5][ref1] is geëindigd, bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 32b.2
    text: |-
      De vrijwillige verzekering ingevolge [artikel 32a][ref1] gaat in op de dag volgend op die waarop de verzekering
      ingevolge [artikel 5][ref2] is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 32b.3
    text: |-
      De Sociale verzekeringsbank verstrekt bij beschikking aan de persoon, die voldoet aan de in dit hoofdstuk gestelde
      voorwaarden, een verklaring waaruit blijkt dat betrokkene is verzekerd ingevolge [artikel 32a][ref1] en vanaf welke
      datum.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
  - number: 32b.4
    text: |-
      Degene, die vrijwillig is verzekerd ingevolge [artikel 32a][ref1] is verplicht aan de Sociale verzekeringsbank de
      gegevens te verschaffen die deze behoeft voor de vaststelling van de premie voor de vrijwillige verzekering. Tevens
      is hij verplicht de Sociale verzekeringsbank en het uitvoeringsorgaan op verzoek of onverwijld uit eigen beweging
      alle feiten en omstandigheden mee te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op de rechten en verplichtingen voortvloeiend uit de vrijwillige verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
  - number: 32b.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanmelding voor de vrijwillige verzekering en
      de te verschaffen gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32b
  - number: 32c.1
    text: |-
      De vrijwillige verzekering ingevolge [artikel 32a][ref1] eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
  - number: 32c.1.a)
    text: |-
      met ingang van de dag, waarop betrokkene niet langer voldoet aan de in [artikel 32a][ref1] gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 32a
        hoofdstuk: IVA
  - number: 32c.1.b)
    text: |-
      met ingang van de eerste dag van de tweede maand volgend op die waarin de Sociale verzekeringsbank een
      schriftelijke opzegging van de verzekerde heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
  - number: 32c.1.c)
    text: |-
      met ingang van de dag, waarop de betrokkene van rechtswege verzekerd wordt ingevolge [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 32c.1.d)
    text: |-
      met ingang van de dag, volgend op de laatste dag van de door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de premie, bedoeld in [artikel 25 van de Wet financiering volksverzekeringen][ref1], uiterlijk moet zijn
      betaald indien die betaling niet heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel25
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '25'
  - number: 32c.1.e)
    text: |-
      met ingang van de dag volgend op de laatste dag van de door de Sociale verzekeringsbank gestelde termijn waarbinnen
      de voor de uitvoering van de vrijwillige verzekering verlangde gegevens moeten zijn verstrekt indien die gegevens
      niet zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
  - number: 32c.2
    text: |-
      De Sociale verzekeringsbank en het uitvoeringsorgaan waarbij betrokkene is ingeschreven, stellen elkaar over en
      weer terstond in kennis van het einde van de vrijwillige verzekering.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
  - number: 32c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de beëindiging van de
      vrijwillige verzekering.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel32c
  - number: '33.1'
    text: |-
      Een rechtspersoon welke als ziektekostenverzekeraar werkzaam is, moet daartoe zijn toegelaten door het College
      zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
  - number: '33.2'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '33.3'
    text: |-
      Toelating als ziektekostenverzekeraar wordt verleend indien de aanvrager een rechtspersoon met volledige
      rechtsbevoegdheid is:
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
  - number: 33.3.a
    text: |-
      die ingevolge haar statuten ten doel heeft in een daarin aangegeven werkgebied het ziektekostenverzekeringsbedrijf
      uit te oefenen,
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
  - number: 33.3.b
    text: die voldoet aan de overige bij of krachtens deze wet aan ziektekostenverzekeraars gestelde eisen, en
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
  - number: 33.3.c
    text: waarvan ook overigens is te verwachten dat zij de taak van een ziektekostenverzekeraar naar behoren zal uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel33
  - number: '34.1'
    text: |-
      Bij de beschikking tot toelating als ziektekostenverzekeraar kunnen aan de ziektekostenverzekeraar met het oog op
      een goede uitvoering van deze wet verplichtingen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel34
  - number: '34.2'
    text: |-
      Ook op een later tijdstip kunnen aan de ziektekostenverzekeraar met het oog op een goede uitvoering van deze wet
      verplichtingen worden opgelegd. Een beschikking als bedoeld in de eerste volzin treedt niet in werking dan na
      verloop van vier weken na de dag waarop zij is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel34
  - number: '35.1'
    text: 'De toelating wordt ingetrokken indien de ziektekostenverzekeraar:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel35
  - number: 35.1.a
    text: |-
      niet meer voldoet aan de eisen, vervat in [artikel 33, derde lid][ref1], of de aan hem opgelegde verplichtingen, of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel33
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '33'
        hoofdstuk: V
  - number: 35.1.b
    text: |-
      in ernstige mate handelt in strijd met de bij enig wettelijk voorschrift ten aanzien van ziektekostenverzekeraars
      gestelde eisen of anderszins zijn taak niet naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel35
  - number: '35.2'
    text: |-
      Op aanvraag van de ziektekostenverzekeraar wordt de toelating met ingang van een daarbij te bepalen datum
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel35
  - number: '35.3'
    text: |-
      Het College zorgverzekeringen regelt de gevolgen van de intrekking van de toelating en de afwikkeling der lopende
      zaken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel35
  - number: '36'
    text: |-
      Van beschikkingen ingevolge de [artikelen 33][ref1], [34, tweede lid][ref2], en [35][ref3] wordt mededeling gedaan
      in de Staatscourant, onder vermelding van het werkgebied van de betrokken ziektekostenverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel35
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '33'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '34'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '35'
        hoofdstuk: V
  - number: '38'
    text: |-
      Een orgaan, dat een publiekrechtelijke ziektekostenregeling voor ambtenaren uitvoert, en zich als zodanig bij het
      College zorgverzekeringen heeft aangemeld, is uitvoerend orgaan.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel38
  - number: 38a
    text: |-
      De [artikelen 38b][ref1], [43e][ref2] en [43f van de Ziekenfondswet][ref3] zijn ten aanzien van uitvoeringsorganen
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel43e
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel43f
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 43e
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 43f
  - number: '40'
    text: |-
      [Artikel 1x7 van de Ziekenfondswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x7
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x7
  - number: 40a.1
    text: |-
      In de administratie van de uitvoeringsorganen ter zake van de uitvoering
      van deze wet wordt het sociaal-fiscaalnummer van de verzekerde, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1], opgenomen, tenzij aan de
      verzekerde geen sociaal-fiscaalnummer is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 40a.2
    text: |-
      Bij de verstrekking van gegevens door uitvoeringsorganen en de in de [artikelen 56][ref1] en [57][ref2] genoemde
      organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel57
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '56'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '57'
        hoofdstuk: VIII
  - number: 40a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      personen en instellingen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel40a
  - number: '41.1'
    text: |-
      Het is een ziektekostenverzekeraar en een uitvoerend orgaan verboden zelf diensten of zaken te leveren, welke
      behoren tot de zorg, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '41.2'
    text: Het in het eerste lid bedoelde verbod geldt niet ten aanzien van het in gebruik geven van medische hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: '41.3'
    text: |-
      Het is een ziektekostenverzekeraar en een uitvoerend orgaan verboden aan een instelling in de zin van deze wet
      gelden voor bedrijfsuitoefening te verschaffen, zich als borg of hoofdelijk medeschuldenaar voor die instelling
      te verbinden, zich voor die instelling sterk te maken, zich tot zekerheid voor een schuld van die instelling te
      verbinden, dan wel aan die instelling bestuurlijk deel te nemen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: '41.4'
    text: |-
      De in het eerste en derde lid bedoelde verboden gelden niet in door het College zorgverzekeringen aan te geven
      gevallen. Het College zorgverzekeringen kan ontheffing van het bepaalde in het eerste en derde lid verlenen in
      bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: '41.5'
    text: |-
      Een ontheffing ingevolge het vierde lid kan onder beperkingen worden verleend; aan de ontheffing kunnen
      voorschriften worden verbonden. Ook na het verlenen van een ontheffing kunnen daaraan beperkingen worden gesteld
      of voorschriften worden verbonden dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: '41.6'
    text: 'Een ontheffing kan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: 41.6.a
    text: indien wordt gehandeld in strijd met aan de ontheffing verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: 41.6.b
    text: indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: '41.7'
    text: Van besluiten als bedoeld in het vierde, vijfde en zesde lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41
  - number: 41a
    text: |-
      Het is een ziektekostenverzekeraar verboden personen als verzekerden in te schrijven die woonachtig zijn buiten
      de gemeente, gemeenten of delen daarvan, waar de rechtspersoon volgens zijn statuten zijn werkzaamheden als
      ziektekostenverzekeraar wil uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel41a
  - number: '42.1'
    text: |-
      Met inachtneming van het bepaalde in [artikel 6][ref1] sluiten de uitvoeringsorganen overeenkomsten met
      personen en instellingen, die één of meer van de in [artikel 43, eerste lid, onder ][ref2], bedoelde
      vormen van zorg kunnen verlenen. Met personen en instellingen, die verstrekkingen verlenen als bedoeld in
      [het vierde lid van artikel 6][ref3], worden voor wat deze verstrekkingen betreft geen overeenkomsten als hier
      bedoeld gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '43'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '42.3'
    text: Een overeenkomst als bedoeld in het eerste lid dient schriftelijk te worden gesloten.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
  - number: '42.4'
    text: |-
      Behoudens toepassing van het zesde lid dient een overeenkomst als bedoeld in het eerste lid in ieder geval in te
      houden de bepalingen als bedoeld in [artikel 43, eerste onderscheidenlijk tweede lid][ref1], alsmede bepalingen
      omtrent de kwaliteit van de zorg en de doelmatigheid van de zorgverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel43
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '43'
        hoofdstuk: VI
  - number: '42.5'
    text: |-
      Behoudens toepassing van het zesde lid, dient een overeenkomst als bedoeld in het eerste lid overeen te stemmen met
      een op grond van [artikel 44, tweede lid][ref1], goedgekeurde uitkomst of met een voor de betrokken categorie van
      personen of instellingen op grond van [artikel 42][ref2], tot stand gekomen modelovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel42a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 42a
        hoofdstuk: VI
  - number: '42.6'
    text: |-
      Het College zorgverzekeringen kan aan een uitvoeringsorgaan toestemming verlenen een overeenkomst als bedoeld in
      het eerste lid te sluiten, welke afwijkt van het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
  - number: '42.7'
    text: |-
      Aan de in het eerste lid bedoelde overeenkomsten welke zijn gesloten in strijd met de voorgaande leden, dan wel aan
      de bepalingen van een overeenkomst als bedoeld in het eerste lid, welke afwijken van de voorgaande leden, kunnen
      geen rechten worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
  - number: '42.8'
    text: |-
      Een overeenkomst als bedoeld in het eerste lid, die wordt gesloten met een persoon, wordt aangegaan voor een
      bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
  - number: '42.9'
    text: |-
      De geldingsduur van een overeenkomst als bedoeld in het eerste lid wordt, indien voor de beëindiging van de
      overeenkomst geen nieuwe overeenkomst tot stand komt, verlengd met een periode van zes maanden of tot het moment
      waarop gedurende die periode een nieuwe overeenkomst als bedoeld in het eerste lid in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
  - number: '42.10'
    text: |-
      Gedurende de in het achtste en negende lid bedoelde periode kan een overeenkomst niet door opzegging worden
      beëindigd, behoudens op grond van bijzondere omstandigheden, bedoeld in [artikel 43, onder ][ref1], en behoudens
      in die gevallen waarin niet voldaan wordt aan de in het vierde lid bedoelde bepalingen omtrent de kwaliteit van de
      zorg en de doelmatigheid van de zorgverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel43
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '43'
        hoofdstuk: VI
  - number: '42.11'
    text: |-
      Een rechtspersoon als bedoeld in [het eerste lid van artikel 16][ref1] is bevoegd, met toestemming van het het
      College zorgverzekeringen, overeenkomsten te sluiten met de in het eerste lid bedoelde personen en instellingen.
      Deze overeenkomsten worden voor de toepassing van deze wet gelijkgesteld met overeenkomsten als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '16'
        hoofdstuk: III
  - number: 42a.1
    text: |-
      Het College zorgverzekeringen stelt ten behoeve van de te sluiten overeenkomsten als bedoeld in
      [artikel 42, eerste lid][ref1], voor categorieën van personen of instellingen een modelovereenkomst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: 42a.2
    text: |-
      Alvorens een modelovereenkomst vast te stellen, hoort het College zorgverzekeringen de daarbij betrokken
      organisaties van ziekenfondsen en ziektekostenverzekeraars en een vertegenwoordiging van de uitvoerende organen
      enerzijds en organisaties van personen en instellingen anderzijds.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42a
  - number: 42a.3
    text: |-
      Het eerste lid is niet van toepassing indien het overleg tussen de organisaties, bedoeld in
      [artikel 44, eerste lid][ref1], binnen de termijn van zes maanden, bedoeld in [artikel 42, negende lid][ref2],
      heeft geleid tot de in [artikel 44, tweede lid][ref3], bedoelde overeenstemming en de uitkomst daarvan voldoet aan
      [artikel 43, eerste lid][ref4], en deze uitkomst de goedkeuring van het College zorgverzekeringen heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel43
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '44'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '43'
        hoofdstuk: VI
  - number: '43.1'
    text: |-
      Een modelovereenkomst als bedoeld in [artikel 42][ref1] met betrekking tot een categorie van personen bevat slechts
      bepalingen betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 42a
        hoofdstuk: VI
  - number: 43.1.a
    text: |-
      het tijdstip waarop de overeenkomst aanvangt te werken en de duur van de periode waarvoor de overeenkomst is
      gesloten;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: 43.1.b
    text: |-
      de aard en de omvang van de wederzijdse rechten en verplichtingen van partijen, behoudens voorzover deze zijn
      geregeld bij of krachtens de [Wet tarieven gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: 43.1.c
    text: |-
      de te verlenen vormen van zorg, bedoeld in de algemene maatregel van bestuur ter uitvoering van [artikel 6][ref1],
      alsmede algemene voorwaarden ten aanzien van de kwaliteit van de zorg; indien een zodanige vorm van zorg door meer
      dan één categorie van personen of instellingen kan worden verleend, dienen deze bepalingen met betrekking tot elk
      van deze categorieën van personen of instellingen afzonderlijk te worden vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 43.1.d
    text: de voorwaarden van administratieve aard, waaraan de partijen hebben te voldoen;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: 43.1.e
    text: |-
      de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verrichten dan wel
      verrichte prestaties en op de juistheid van de daarvoor in rekening gebrachte bedragen, alsmede de verplichting tot
      het verstrekken van gegevens ten behoeve van deze controle;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: 43.1.f
    text: |-
      de beëindiging van de overeenkomst, met dien verstande, dat door opzegging de overeenkomst alleen kan worden
      beëindigd met ingang van 1 januari en de opzegtermijn ten minste zes maanden bedraagt, behoudens in de gevallen dat
      op grond van bijzondere omstandigheden verdere nakoming van de overeenkomst door een der partijen redelijkerwijs
      niet kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: 43.1.g
    text: |-
      de voorziening voor de situaties waarin de overeenkomsten als bedoeld in [artikel 42][ref1] kunnen afwijken van
      de modelovereenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: 43.1.h
    text: |-
      de mogelijkheid van instelling van een commissie welke bemiddeling kan verlenen bij de oplossing van geschillen
      welke uit de overeenkomst voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: '43.2'
    text: |-
      Het eerste lid is ten aanzien van modelovereenkomsten met betrekking tot instellingen van overeenkomstige
      toepassing, met dien verstande dat het woord "slechts" wordt vervangen door: ten minste, en dat bij algemene
      maatregel van bestuur onderwerpen kunnen worden aangegeven ten aanzien waarvan de modelovereenkomst nadere
      bepalingen dient te bevatten.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel43
  - number: '44.1'
    text: |-
      Onverminderd [artikel 42, vierde lid][ref1], wordt omtrent de inhoud van de in het eerste lid van dat
      artikel bedoelde overeenkomsten overleg gepleegd tussen de betrokken organisaties van ziekenfondsen,
      ziektekostenverzekeraars en een vertegenwoordiging van de uitvoerende organen enerzijds en van personen en
      instellingen anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: '44.2'
    text: |-
      Indien het in het vorige lid bedoelde overleg tot overeenstemming heeft geleid, wordt de uitkomst daarvan, voor
      zover deze geen betrekking heeft op het tarief, bedoeld in de [Wet tarieven gezondheidszorg][ref1] (*Stb.* 1980,
      646), onderworpen aan de goedkeuring van het College zorgverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '44.3'
    text: |-
      Een overeenkomst als bedoeld in [artikel 42, eerste lid][ref1], eindigt op hetzelfde tijdstip als de in het tweede
      lid bedoelde uitkomst eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: 44a.1
    text: |-
      De betrokken organisaties van ziekenfondsen en ziektekostenverzekeraars en een vertegenwoordiging van de
      uitvoerende organen enerzijds en organisaties van personen en instellingen anderzijds treffen een regeling
      ter zake van de instelling en werkwijze van een commissie die, nadat Onze Minister uitvoering heeft gegeven
      aan [artikel 12][ref1], voor de desbetreffende vorm van zorg het tarief, bedoeld in [artikel 17][ref2], kan
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel17f
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 17f
  - number: 44a.2
    text: De regeling wordt zo spoedig mogelijk medegedeeld aan het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel44a
  - number: '45.1'
    text: |-
      Een uitvoeringsorgaan is verplicht met iedere instelling op zijn verzoek een overeenkomst te sluiten als bedoeld
      in [artikel 42, eerste lid][ref1], tenzij het uitvoeringsorgaan daartegen ernstige bezwaren heeft. Bij algemene
      maatregel van bestuur kan worden bepaald in welke gevallen van de in de eerste volzin bedoelde verplichting mag
      worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: '45.2'
    text: |-
      Voorzover een uitvoeringsorgaan een statutair omschreven werkgebied heeft, is de in het eerste lid bedoelde
      verplichting beperkt tot de instellingen die zijn gelegen binnen dit werkgebied en de instellingen waarvan de
      bevolking van dit werkgebied regelmatig gebruik maakt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel45
  - number: '45.3'
    text: |-
      Het College zorgverzekeringen kan bij het verlenen van een ontheffing als bedoeld in artikel 41, vierde lid, van
      het bepaalde in het eerste lid van dat artikel, bepalen of en in hoeverre van het gestelde in het eerste en tweede
      lid van dit artikel kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel45
  - number: '45.4'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 8, tweede lid][ref1], kan worden bepaald dat het eerste
      lid niet geldt voor de bij die maatregel aangewezen categorieën van instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
        hoofdstuk: III
  - number: '45.5'
    text: |-
      Een rechtspersoon als bedoeld in [artikel 16, eerste lid][ref1], is verplicht met een daarvoor in aanmerking
      komende instelling voor verzorging, verpleging en behandeling, welke hiertoe is aangewezen door het College
      zorgverzekeringen, op haar verzoek een overeenkomst te sluiten als bedoeld in [artikel 42, elfde lid][ref2], tenzij
      de rechtspersoon daartegen ernstige bezwaren heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
  - number: '46'
    text: |-
      Een instelling die met een uitvoeringsorgaan een overeenkomst als bedoeld in [artikel 42, eerste lid][ref1], heeft
      gesloten, is gehouden op daartoe door een ander uitvoeringsorgaan gedaan verzoek met deze een gelijke overeenkomst
      te sluiten, tenzij die instelling daartegen ernstige bedenkingen heeft. De eerste volzin is niet van toepassing,
      voor zover bij een algemene maatregel van bestuur als bedoeld in [artikel 45, eerste of vierde lid][ref2], is
      bepaald dat van de in de eerste volzin van [artikel 45, eerste lid][ref3], bedoelde verplichting mag worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
  - number: '47'
    text: |-
      Indien overeenkomsten, welke nodig zijn ter verwezenlijking van de aanspraken, bedoeld in [artikel 6][ref1], niet
      of niet in voldoende aantal tot stand komen, kan bij ministeriële regeling worden bepaald, dat overeenkomsten ter
      zake van de bedoelde zorg slechts mogen worden gesloten met inachtneming van daarbij te stellen richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '48'
    text: |-
      De Rijksbelastingdienst biedt jaarlijks voor 1 november een verklaring aan het College zorgverzekeringen
      aan omtrent de rechtmatigheid van ontvangsten over het afgelopen kalenderjaar betreffende de ingevolge de
      [Wet financiering volksverzekeringen][ref1] geheven premies Algemene Wet Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004538
  - number: '49.1'
    text: |-
      Het College zorgverzekeringen is tegenover personen of instellingen, die ter zake van aan verzekerden verleende
      verstrekkingen op grond van deze wet vorderingen hebben op een ziekenfonds of een ziektekostenverzekeraar,
      aansprakelijk voor de betaling daarvan, wanneer dat ziekenfonds of die ziektekostenverzekeraar verkeert in de
      toestand, dat hij heeft opgehouden te betalen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel49
  - number: '49.2'
    text: Het Rijk is tegenover het College zorgverzekeringen aansprakelijk voor de betalingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel49
  - number: '56.1'
    text: |-
      Een ieder verstrekt op verzoek aan het College zorgverzekeringen, het College toezicht, Onze Minister van
      Sociale Zaken en Werkgelegenheid, het Uitvoeringsinstituut werknemersverzekeringen, genoemd in hoofdstuk 5 van
      de Wet structuur uitvoeringsorganisatie werk en inkomen, de Sociale verzekeringsbank, genoemd in hoofdstuk 6
      van de Wet structuur uitvoeringsorganisatie werk en inkomen, de Rijksbelastingdienst, het gemeentebestuur, de
      uitvoeringsorganen en de indicatieorganen, bedoeld in artikel 9a, eerste lid, of aan een daartoe door of vanwege
      een van deze instanties aangewezen persoon kosteloos alle gegevens en inlichtingen die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende instantie.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel56
  - number: '56.2'
    text: |-
      De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm, of in een
      andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het in
      het eerste lid bedoelde verzoek.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel56
  - number: '56.3'
    text: |-
      Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel56
  - number: '57.1'
    text: |-
      De in [artikel 56, eerste lid][ref1], bedoelde instanties zijn bevoegd uit eigen beweging en verplicht op verzoek
      uit de onder hun verantwoordelijkheid gevoerde administratie, aan elkaar of aan een daartoe door of vanwege een
      van deze instanties aangewezen persoon de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze
      wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of krachtens wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel56
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '56'
        hoofdstuk: VIII
  - number: '57.2'
    text: |-
      Publiekrechtelijke lichamen zijn verplicht hun medewerking te verlenen bij het verkrijgen van inlichtingen,
      benodigd voor de uitvoering van deze wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of
      krachtens wet anders is bepaald. Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kunnen regelen stellen met betrekking tot de wijze waarop en de vorm waarin de inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel57
  - number: '57.3'
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een in
      [artikel 56, eerste lid][ref1], bedoelde instantie de door deze gevraagde uittreksels uit de registers kosteloos
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel56
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '56'
        hoofdstuk: VIII
  - number: '57.4'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      het College zorgverzekeringen, aan het College toezicht en aan de ziekenfondsen alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel57
  - number: '58.1'
    text: |-
      Een beslissing van een uitvoeringsorgaan of een indicatieorgaan als bedoeld in artikel 9a, eerste lid, op bezwaar
      inzake een aanspraak op zorg of een daarmee overeenkomende uitkering ingevolge deze wet wordt niet genomen dan
      nadat daaromtrent door het College zorgverzekeringen op verzoek van het bestuursorgaan advies is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: '58.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover het bezwaarschrift betrekking heeft op een ingevolge het bepaalde
      krachtens deze wet verschuldigde bijdrage in de kosten van zorg, waarvan de hoogte niet afhankelijk is van een
      medisch oordeel.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: '58.3'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: 58.3.a
    text: het bezwaar kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: 58.3.b
    text: aan het bezwaar volledig tegemoet wordt gekomen, of
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: 58.3.c
    text: |-
      het College zorgverzekeringen geen advies heeft uitgebracht binnen de in het vierde lid genoemde termijn of heeft
      medegedeeld geen advies te zullen uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: '58.4'
    text: |-
      Het College zorgverzekeringen brengt een advies als bedoeld in het eerste lid uit binnen tien weken na ontvangst
      van alle gegevens en bescheiden die voor de beoordeling van het verzoek noodzakelijk zijn, en zendt gelijktijdig
      afschrift daarvan aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
  - number: '58.5'
    text: |-
      Indien het College zorgverzekeringen is verzocht advies uit te brengen, wordt de beslissing op bezwaar in afwijking
      van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] genomen binnen een en twintig weken na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '59'
    text: |-
      Het beroep en het hoger beroep inzake een geschil van uitsluitend geneeskundige aard wordt behandeld met toepassing
      van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '61.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van het bepaalde bij of krachtens een der [artikelen 1, tweede lid][ref1],
      [2][ref2], [3][ref3] en [5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '3'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: '61.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel61
  - number: '62'
    text: |-
      Een belanghebbende kan tegen ingevolge deze wet genomen besluiten van Onze Minister, het College zorgverzekeringen
      en van het College toezicht, beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. De
      eerste volzin geldt niet ten aanzien van een besluit van het bestuur van College zorgverzekeringen krachtens
      [artikel 5, derde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: '64'
    text: |-
      Bij afwijzing van verzoeken als bedoeld in de [artikelen 45][ref1] en [46][ref2] kan de beslissing van het College
      zorgverzekeringen worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel46
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '46'
        hoofdstuk: VI
  - number: 65a
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van een feit, dat aanleiding geeft tot het verlenen van zorg, bedoeld in [artikel 6][ref1], houdt de rechter
      rekening met de aanspraken, die de verzekerde krachtens deze wet heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 65b.1
    text: |-
      Behoudens toepassing van het derde lid, eerste volzin, heeft een uitvoeringsorgaan voor de krachtens deze wet
      gemaakte kosten verhaal op degene, die in verband met het in [artikel 65a][ref1] bedoelde feit jegens de verzekerde
      naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het
      ontbreken van de aanspraken krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een
      bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde
      naar burgerlijk recht is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 65a
        hoofdstuk: IXA
  - number: 65b.2
    text: |-
      Voorzover de geldswaarde van de in het eerste lid bedoelde verleende zorg niet kan worden vastgesteld, wordt deze
      bepaald op een geschat bedrag. Onze Minister kan hieromtrent nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65b
  - number: 65b.3
    text: |-
      Het College zorgverzekeringen kan met verzekeraars een overeenkomst sluiten inhoudende een door die verzekeraars
      aan het College zorgverzekeringen te betalen afkoopsom voor de voor de komende periode te verwachten schadelast
      tengevolge van de schadeplichtigheid van diens verzekerden ingevolge het eerste lid. De overeenkomst heeft geen
      betrekking op de schadelast van een uitvoeringsorgaan dat voor de aanvang van de onderhandelingen over de bedoelde
      overeenkomst aan het College zorgverzekeringen te kennen heeft gegeven van zijn bevoegdheid in het eerste lid
      gebruik te maken. Het College zorgverzekeringen stelt voor aanvang van de periode waarvoor een afkoopsom is
      overeengekomen, uitvoeringsorganen op de hoogte van de totstandkoming van bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65b
  - number: 65c.1
    text: |-
      Indien de verzekerde in dienstbetrekking werkzaam is, geldt [artikel 65b][ref1], ten aanzien van de naar burgerlijk
      recht tot schadevergoeding verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar
      burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot dezelfde werkgever
      als de verzekerde jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien
      het feit als genoemd in [artikel 65a][ref2] is te wijten aan opzet of bewuste roekeloosheid van die werkgever
      onderscheidenlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel65b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 65b
        hoofdstuk: IXA
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 65a
        hoofdstuk: IXA
  - number: 65c.2
    text: |-
      Voor de toepassing van het eerste lid wordt mede als werkgever beschouwd degene, die krachtens het eerste lid van
      [artikel 16a van de Coördinatiewet Sociale Verzekering][ref1] mede als werkgever wordt beschouwd, ongeacht de bij
      het tweede lid van dat artikel bedoelde uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65c
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 16a
  - number: 65d.1
    text: |-
      Een uitvoeringsorgaan kan van hem, die, zonder daartoe gerechtigd te zijn, opzettelijk aanspraken als verzekerde
      bij hem doet gelden onderscheidenlijk deed gelden, alsmede van hem, die daaraan opzettelijk zijn medewerking
      verleent onderscheidenlijk heeft verleend, geheel of gedeeltelijk het bedrag vorderen van de verstrekkingen of van
      de uitkeringen die hem te veel of ten onrechte zijn verleend. Voorzover de geldswaarde van de in de eerste volzin
      bedoelde zorg niet vaststaat, kan deze worden vastgesteld op een geschat bedrag.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65d
  - number: 65d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de in het eerste lid
      bedoelde terugvordering.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel65d
  - number: '66'
    text: |-
      Hij die werkzaamheden verricht, welke ingevolge deze wet uitsluitend aan uitvoeringsorganen zijn toegestaan,
      of die zodanige werkzaamheden blijft verrichten nadat zijn toelating overeenkomstig het bepaalde in
      [artikel 36 der Ziekenfondswet][ref1] of [artikel 35][ref2] van deze wet is ingetrokken, of die voorwaarden
      waaronder toelating is verleend overtreedt, wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete
      van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel35
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '35'
        hoofdstuk: V
  - number: '68'
    text: |-
      Hij die niet voldoet aan een der verplichtingen, bedoeld in [artikel 56, derde lid][ref1], wordt gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel56
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '56'
        hoofdstuk: VIII
  - number: 68a
    text: |-
      Overtreding van [artikel 41a][ref1] wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel41a
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 41a
        hoofdstuk: V
  - number: '71'
    text: |-
      Overtreding van het bepaalde bij of krachtens een algemene maatregel van bestuur, strekkende tot uitvoering van
      deze wet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien en
      voor zover deze overtreding bij die algemene maatregel als strafbaar feit is aangeduid.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel71
  - number: '73.1'
    text: |-
      Met de opsporing van feiten die zijn strafbaar gesteld bij of krachtens deze wet, alsmede, voor
      zover het feit voor de toepassing van deze wet van belang is, van de feiten omschreven in de
      [artikelen 225 tot en met 227b][ref1], [447c][ref2] en [447d van het Wetboek van Strafrecht][ref3] zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4], belast de ambtenaren, aangewezen bij besluit
      van Onze Minister en Onze Minister van Justitie. Deze ambtenaren zijn tevens belast met de opsporing van feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel447c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel447d
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 447c
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 447d
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '73.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel73
  - number: '74'
    text: |-
      Bij het opsporen van een bij of krachtens deze wet strafbaar gesteld feit hebben de in [artikel 73][ref1] bedoelde
      personen toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel73
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '73'
        hoofdstuk: X
  - number: '76'
    text: |-
      De in de [artikelen 66][ref1], [68][ref2], [68a][ref3] en [71][ref4] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel68a
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel71
    url: https://wetten.overheid.nl/BWBR0002614/2004-05-01#Artikel76
