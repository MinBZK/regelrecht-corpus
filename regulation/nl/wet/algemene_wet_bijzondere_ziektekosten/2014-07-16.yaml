  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel1
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van de
      bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Sint Maarten, Curaçao, de openbare lichamen Bonaire, Sint Eustatius, Saba, Aruba of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel3
  - number: '4'
    text: |-
      In de uitvoering van de in deze wet geregelde verzekering wordt, voor zover bij of krachtens deze wet niet anders
      is bepaald, voorzien door de zorgverzekeraars en het Zorginstituut.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel4
  - number: '5.1'
    text: 'Verzekerd overeenkomstig de bepalingen van deze wet is degene, die:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: 5.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: 5.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte arbeid
      aan de loonbelasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid zijn vreemdelingen die niet rechtmatig in Nederland verblijf genieten als bedoeld
      in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], niet verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '5.3'
    text: 'In afwijking van het tweede lid zijn verzekerd:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: 5.3.a
    text: |-
      kinderen in Nederland geboren uit een in Nederland wonende vreemdeling die rechtmatig verblijf geniet
      als bedoeld in [artikel 8, onder a tot en met e of l, van de Vreemdelingenwet 2000][ref1], dan wel in
      het buitenland geboren uit in Nederland wonende ouders die rechtmatig verblijf genieten als bedoeld in
      [artikel 8, onder a tot en met e of l, van de Vreemdelingenwet 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.3.b
    text: |-
      kinderen die door in Nederland wonende personen met de Nederlandse nationaliteit dan wel met rechtmatig
      verblijf als bedoeld in [artikel 8, onder a tot en met e of l, van de Vreemdelingenwet 2000][ref1],
      worden geadopteerd en voor wie met het oog op adoptie beginseltoestemming is verleend op grond van
      [artikel 2, van de Wet opneming buitenlandse kinderen ter adoptie][ref2]. De verzekering gaat in vanaf
      het moment van adoptie naar het recht van het land waar het kind zijn gewone verblijf heeft of vanaf het
      moment van de gezagsoverdracht van het kind met het oog op adoptie aan een echtpaar of een persoon die zijn
      gewone verblijf in Nederland heeft en die de procedure van opneming ter adoptie van een kind ingevolge de
      [Wet opneming buitenlandse kinderen ter adoptie][ref3] heeft gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004447
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste lid, uitbreiding dan wel beperking
      worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding worden
      gegeven aan de kring der verzekerden voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: 5.5.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
  - number: 5.5.b
    text: |-
      vreemdelingen die, na in Nederland rechtmatig verblijf te hebben genoten als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], tijdig toelating in aansluiting op dat
      verblijf hebben aangevraagd, dan wel bezwaar hebben gemaakt of beroep hebben ingesteld tegen de intrekking van het
      besluit tot toelating, totdat op die aanvraag, dat bezwaar of dat beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5b
    text: |-
      Zo nodig in afwijking van [artikel 5][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: 5b.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5b
  - number: 5b.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5b
  - number: 5c
    text: |-
      De Sociale Verzekeringsbank stelt ambtshalve en, desgevraagd, op aanvraag vast of een natuurlijke persoon voldoet
      aan de bij of krachtens de [artikelen 5][ref1] of[ 5b][ref2] vastgestelde voorwaarden voor het verzekerd zijn
      ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 5b
        hoofdstuk: II
  - number: '6.1'
    text: |-
      De verzekerden hebben aanspraak op zorg ter voorkoming van ziekten en ter voorziening in hun geneeskundige
      behandeling, verpleging en verzorging. Tot deze zorg behoren voorzieningen tot behoud, herstel of ter bevordering
      van de arbeidsgeschiktheid of strekkende tot verbetering van levensomstandigheden, alsmede maatschappelijke
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '6.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden aard, inhoud en omvang van de zorg waarop aanspraak bestaat,
      geregeld, en kunnen voor het tot gelding brengen van de aanspraken voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '6.3'
    text: |-
      De zorgverzekeraars dragen er zorg voor dat de bij hen ingeschreven verzekerden hun aanspraken op zorg tot gelding
      kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '6.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de aanspraak op zorg slechts tot gelding
      kan worden gebracht indien de verzekerde bijdraagt in de kosten daarvan. De bijdrage kan verschillen naar gelang de
      groep waartoe de verzekerde behoort en de zorg die verstrekt wordt, en kan mede afhankelijk gesteld worden van het
      inkomen en vermogen van de verzekerde en diens echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '6.5'
    text: |-
      Het derde lid is niet van toepassing met betrekking tot het verlenen van zorg onder verantwoordelijkheid, waaronder
      begrepen de financiële verantwoordelijkheid, van Onze Minister van Justitie in het kader van de uitvoering van een
      rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '6.6'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het vierde lid die betrekking heeft op het in
      dat lid bedoelde vermogen, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd. Indien een der kamers der Staten-Generaal besluit niet in te stemmen met het ontwerp, wordt
      er geen voordracht gedaan en kan niet eerder dan zes weken na het besluit van die kamer der Staten-Generaal een
      nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel6
  - number: '7.1'
    text: |-
      Voor militairen in werkelijke dienst treden de aanspraken inzake geneeskundige verzorging door of vanwege de
      Militair Geneeskundige Dienst in de plaats van de aanspraken krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt een regeling getroffen voor de verzekerden die, onder
      voorwaarden en regelen te stellen door Onze Minister van Defensie, als gezinslid van een militair aanspraak
      hebben op geneeskundige behandeling, verpleging en verzorging of een tegemoetkoming in de kosten daarvan jegens
      Onze Minister van Defensie. Bij deze algemene maatregel van bestuur kan worden bepaald, dat voor de betrokken
      verzekerden de aanspraken, voortvloeiende uit de desbetreffende van Onze Minister van Defensie uitgaande regeling
      in de plaats treden van de aanspraken krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur worden regelen gesteld inzake
      een uitkering door het Zorginstituut aan Onze Minister van Defensie ten laste van het Algemeen Fonds Bijzondere
      Ziektekosten in verband met het vervallen van de aanspraken ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel7
  - number: '7.4'
    text: |-
      Al hetgeen de verdere uitvoering van dit artikel betreft wordt bij of krachtens algemene maatregel van bestuur
      geregeld. Daarbij kan tevens de controle worden geregeld op het verlenen van zorg ingevolge de aanspraken bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel7
  - number: '9.1'
    text: |-
      De verzekerde, bedoeld in [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref1], is met ingang van het
      tijdstip waarop de zorgverzekering ingevolge [die wet][ref2] ingaat, voor de toepassing van deze wet als verzekerde
      ingeschreven bij zijn zorgverzekeraar in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref3],
      mits deze zich overeenkomstig [artikel 33][ref4] heeft aangemeld voor de uitvoering van deze wet.
      Indien de zorgverzekering is ingegaan binnen vier maanden nadat de verzekeringsplicht, bedoeld in de
      [Zorgverzekeringswet][ref5], is ontstaan, werkt de inschrijving terug tot en met de dag waarop die
      verzekeringsplicht ontstond.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '33'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0018450
  - number: '9.2'
    text: |-
      De verzekerde die voor de uitvoering van deze wet niet bij een zorgverzekeraar is ingeschreven, meldt zich voor de
      toepassing van deze wet met inachtneming van bij algemene maatregel van bestuur te stellen regels ter inschrijving
      aan bij een zorgverzekeraar die werkzaam is in de gemeente waar hij woont. Een in het buitenland woonachtige
      verzekerde meldt zich aan bij een zorgverzekeraar naar eigen keuze. De zorgverzekeraar is verplicht hem tot dat
      doel in te schrijven.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9
  - number: '9.3'
    text: |-
      Het is een zorgverzekeraar verboden anderen dan personen met wie hij een zorgverzekering als bedoeld in de
      [Zorgverzekeringswet][ref1] is aangegaan, als verzekerde in te schrijven indien deze woonachtig zijn buiten het
      werkgebied van de zorgverzekeraar, tenzij het betreft een in het buitenland woonachtige verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 9bis.1
    text: |-
      De verzekerde die zich ingevolge [artikel 9, tweede lid][ref1], bij een zorgverzekeraar aanmeldt ter inschrijving,
      vermeldt daarbij zijn burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9bis
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '9'
        hoofdstuk: III
  - number: 9bis.2
    text: |-
      De zorgverzekeraar stelt, voor zover dat redelijkerwijs nodig is voor de uitvoering van deze wet, de identiteit van
      de te verzekeren persoon vast.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9bis
  - number: 9bis.3
    text: |-
      De in het tweede lid bedoelde vaststelling geschiedt aan de hand van documenten als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], die de verzekerde hem desgevraagd ter inzage geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9bis
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 9bis.4
    text: De zorgverzekeraar neemt aard en nummer van de in het derde lid bedoelde documenten in zijn administratie op.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9bis
  - number: 9bis.5
    text: |-
      De zorgverzekeraar verlangt van de vreemdeling die zich ter inschrijving aanmeldt, een kopie van het document of
      de schriftelijke verklaring, bedoeld in [artikel 9, tweede lid, van de Vreemdelingenwet 2000][ref1], dat wordt
      aangemerkt als een bescheid als bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9bis
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9a.1
    text: |-
      Burgemeester en wethouders voorzien erin dat in hun gemeente ten behoeve van de inwoners een onafhankelijk
      indicatieorgaan werkzaam is, dat kosteloos besluit of een inwoner is aangewezen op een van de bij algemene
      maatregel van bestuur aangewezen vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9a
  - number: 9a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de samenstelling en de werkwijze
      van het indicatieorgaan, alsmede over de geldigheidsduur van besluiten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9a
  - number: 9a.3
    text: Een indicatieorgaan verricht geen andere dan bij of krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9a
  - number: 9a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen aan indicatieorganen werkzaamheden worden opgedragen die
      verband houden met de taken die bij de wet zijn opgedragen. Burgemeester en wethouders kunnen het indicatieorgaan
      advies vragen omtrent toekenning van voorzieningen waarbij de gezondheid of het maatschappelijk functioneren van
      een persoon van belang is.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9a
  - number: 9b.1
    text: |-
      Aanspraak op zorg, aangewezen ingevolge [artikel 9a, eerste lid][ref1], bestaat slechts indien en gedurende
      de periode waarvoor het bevoegde indicatieorgaan op een door de verzekerde ingediende aanvraag heeft besloten
      dat deze naar aard, inhoud en omvang op die zorg is aangewezen. De verzekerde vermeldt bij de aanvraag zijn
      burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
  - number: 9b.2
    text: |-
      In afwijking van het eerste lid worden er bij algemene maatregel van bestuur regels gesteld voor gevallen waarin
      het besluit niet afgewacht kan worden.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
  - number: 9b.3
    text: |-
      De aanspraak op andere vormen van zorg dan die zijn aangewezen ingevolge [artikel 9a, eerste lid][ref1], kan
      slechts tot gelding worden gebracht voor zover de verzekerde, gelet op zijn behoefte en uit een oogpunt van
      doelmatige zorgverlening, daarop naar aard, inhoud en omvang redelijkerwijs is aangewezen. Bij of krachtens
      algemene maatregel van bestuur kan worden geregeld door wie en op welke wijze wordt beoordeeld of de verzekerde
      aangewezen is op een bepaalde vorm van zorg. Deze regels zijn zodanig dat wordt gewaarborgd dat de beoordeling
      onafhankelijk geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
  - number: 9b.4
    text: |-
      In afwijking van het eerste tot en met derde lid hebben cliënten als bedoeld in
      [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1] slechts aanspraak op zorg aangewezen krachtens
      [artikel 5, tweede lid, onder b en c, van die wet][ref2], indien de stichting die werkzaam is in de provincie
      waar de betrokken jeugdige duurzaam verblijft een besluit heeft genomen waaruit blijkt dat die cliënt op die zorg
      is aangewezen. De regels gesteld krachtens [artikel 3, vijfde lid, van de Wet op de jeugdzorg][ref3] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel3
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '3'
  - number: 9b.5
    text: |-
      Het vierde lid is niet van toepassing ten aanzien van zorg als bedoeld in
      [artikel 5, tweede lid, onder b, van de Wet op de jeugdzorg][ref1], met betrekking tot een jeugdige van wie een
      beroepsbeoefenaar, behorende tot een bij of krachtens algemene maatregel van bestuur aangewezen beroepsgroep
      of een daarmee in die maatregel gelijkgestelde behandelaar, een redelijk vermoeden heeft dat bij de jeugdige
      sprake is van een bij of krachtens die maatregel aangewezen psychische stoornis van een bij die maatregel
      aan te geven ernst en tevens het vermoeden heeft dat de jeugdige, zijn ouders, stiefouders of anderen die de
      jeugdige als behorende tot hun gezin verzorgen en opvoeden, niet zijn aangewezen op jeugdzorg waarop aanspraak
      bestaat op grond van de [Wet op de jeugdzorg][ref2] of de [Beginselenwet justitiële jeugdinrichtingen][ref3].
      Bij de maatregel, bedoeld in de eerste volzin, worden tevens regels gesteld omtrent de informatie die de
      beroepsbeoefenaar in een geval als bedoeld in die volzin verstrekt aan de betrokken stichting, bedoeld in
      [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637
      [ref3]: https://wetten.overheid.nl/BWBR0011756
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
      - id: ref3
        bwb_id: BWBR0011756
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 9b.6
    text: |-
      Op het indicatieorgaan, bedoeld in het eerste lid, is het bepaalde bij of krachtens
      [artikel 52, tweede tot en met negende lid][ref1], van overeenkomstige toepassing met betrekking tot het nemen van
      het besluit, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel52
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '52'
        hoofdstuk: VIII
  - number: '10.1'
    text: |-
      De verzekerde die zijn aanspraak op zorg tot gelding wil brengen, wendt zich daartoe tot een zorgaanbieder naar
      eigen keuze, met wie de zorgverzekeraar waarbij hij is ingeschreven tot dat doel een overeenkomst als bedoeld
      in [artikel 15][ref1] heeft gesloten. Een aanspraak als bedoeld in de vorige volzin kan uitsluitend tot gelding
      worden gebracht bij een zorgaanbieder die is gevestigd binnen het grondgebied van het Europese deel van Nederland,
      de staten behorende tot de Europese Unie, de Europese Economische Ruimte of van Zwitserland en die de zorg waarop
      aanspraak bestaat levert binnen het desbetreffende grondgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      Een verzekerde heeft buiten het grondgebied van het Europese deel van Nederland, maar binnen het grondgebied van
      de staten behorende tot de Europese Unie, de Europese Economische Ruimte en Zwitserland, ook aanspraken op zorg
      als bedoeld bij of krachtens [artikel 6][ref1], niet zijnde zorg met verblijf in een instelling, indien deze wordt
      verleend door een zorgaanbieder met wie een zorgverzekeraar geen overeenkomst heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '10.3'
    text: 'Bij algemene maatregel van bestuur kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
  - number: 10.3.a
    text: |-
      in welke gevallen en onder welke voorwaarden een verzekerde die een aanspraak op zorg als bedoeld bij of krachtens
      [artikel 6][ref1], tot gelding wil brengen, zich voor deze zorg kan wenden tot een zorgaanbieder met wie de
      zorgverzekeraar geen overeenkomst heeft gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 10.3.b
    text: |-
      in welke gevallen en onder welke voorwaarden zorg als bedoeld bij of krachtens [artikel 6][ref1], buiten het
      grondgebied van het Europese deel van Nederland, de staten behorende tot de Europese Unie, de Europese Economische
      Ruimte en Zwitserland kan worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 10.3.c
    text: |-
      in welke gevallen en onder welke voorwaarden de verzekerde in plaats van aanspraak op zorg als bedoeld bij of
      krachtens [artikel 6][ref1], aanspraak heeft op gehele of gedeeltelijke vergoeding van de voor deze zorg gemaakte
      kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 10.3.d
    text: |-
      door wie in welke gevallen en onder welke voorwaarden werkzaamheden die zijn opgedragen aan het indicatieorgaan
      bedoeld bij en krachtens de [artikelen 9a][ref1] en [9b][ref2], in plaats van door dat orgaan kunnen worden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9b
        hoofdstuk: III
  - number: '10.4'
    text: |-
      In de overeenkomsten, bedoeld in het eerste lid, kan worden bepaald dat verzekerden, om hun aanspraak op zorg tot
      gelding te brengen, door de zorgverzekeraar ingeschreven moeten zijn op naam van een zorgaanbieder als bedoeld
      in het eerste lid. Tevens kunnen daarin bepalingen worden opgenomen ter beperking van het aantal ten name van
      een zorgaanbieder in te schrijven verzekerden. De zorgverzekeraar kan schriftelijk vaststellen dat het aantal
      overschrijvingen van een verzekerde in een bepaald tijdvak aan een maximum is gebonden en dat overschrijvingen
      slechts kunnen plaatsvinden op daarbij aangegeven tijdstippen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
  - number: '10.5'
    text: |-
      De in het eerste lid genoemde verplichting, zich te wenden tot een door het uitvoeringsorgaan gecontracteerde
      persoon of instelling, geldt niet voor de zorg, bedoeld in [artikel 6, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '10.6'
    text: |-
      Het verlenen van zorg, bedoeld in [artikel 6, vijfde lid][ref1], geschiedt overeenkomstig hetgeen daarover elders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 10a.1
    text: |-
      Degene die als verzekerde zijn aanspraak op een bij ministeriële regeling aangewezen vorm van
      zorg geldend wil maken, verstrekt aan de persoon of instelling tot wie onderscheidenlijk welke
      hij zich wendt voor het ontvangen van de desbetreffende zorg, een identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid van de Wet op de identificatieplicht][ref1] of een ander bij ministeriële regeling aan
      te wijzen document ter inzage waarmee zijn identiteit kan worden vastgesteld. Indien het identiteitsbewijs niet
      onmiddellijk ter inzage kan worden verstrekt, kan de persoon of instelling bepalen dat uiterlijk binnen een termijn
      van veertien dagen aan deze verplichting wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 10a.2
    text: |-
      De persoon of instelling die de in het eerste lid bedoelde zorg verleent, stelt de identiteit van degene aan wie
      deze zorg wordt verleend vast aan de hand van het ter inzage verstrekte document.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel10a
  - number: '12.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen vormen van zorg worden aangewezen waarvoor de zorgverzekeraar
      schriftelijk kan vaststellen dat bij hem ingeschreven verzekerden, in afwijking van [artikel 6, eerste lid][ref1],
      in plaats van aanspraak op deze zorg, jegens hem aanspraak op vergoeding van de voor deze zorg gemaakte kosten
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      De [artikelen 6, tweede tot en met vijfde lid][ref1], [9b][ref2] en [10][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel10
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '10'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Indien voor de betrokken vorm van zorg krachtens [artikel 6, vierde lid][ref1], een eigen bijdrage is vastgesteld,
      wordt de vergoeding met deze eigen bijdrage verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '12.4'
    text: |-
      In afwijking van het tweede lid kan bij algemene maatregel van bestuur voor een of meer van de in het eerste
      lid bedoelde vormen van zorg worden bepaald dat de zorgverzekeraar schriftelijk kan vaststellen dat de in
      [artikel 10, eerste lid][ref1], neergelegde verplichting zich te wenden tot een door de zorgverzekeraar
      gecontracteerde persoon of instelling, voor bij hem ingeschreven verzekerden niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel10
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '10'
        hoofdstuk: III
  - number: '12.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met vierde lid nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12
  - number: 12a.1
    text: |-
      Indien de zorgverzekeraar in de onmogelijkheid verkeert op voor hem aanvaardbare voorwaarden met een genoegzaam
      aantal personen of instellingen ter zake van een of meer vormen van zorg overeenkomsten als bedoeld in
      [artikel 15][ref1] te sluiten, kan bij ministeriële regeling worden bepaald dat de bij de zorgverzekeraar
      ingeschreven verzekerden tijdelijk in plaats van aanspraak op deze zorg, jegens hun zorgverzekeraar aanspraak
      hebben op vergoeding van de voor deze zorg gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: 12a.2
    text: |-
      In de ministeriële regeling wordt tevens bepaald onder welke voorwaarden en tot welk bedrag aanspraak op vergoeding
      bestaat en kunnen nadere regels voor de aanspraak op een vergoeding worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12a
  - number: 12a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien een vorm van zorg is aangewezen in
      een algemene maatregel van bestuur als bedoeld in [artikel 12, eerste lid][ref1], zonder dat van de in het
      [vierde lid van dat artikel][ref2] bedoelde mogelijkheid gebruik is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel12
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '12'
        hoofdstuk: III
  - number: 12a.4
    text: |-
      Voor zover een zorgverzekeraar in de onmogelijkheid verkeert op voor hem aanvaardbare voorwaarden met een
      genoegzaam aantal zorgaanbieders ter zake van een of meer vormen van zorg overeenkomsten te sluiten als bedoeld in
      [artikel 15][ref1], kan de zorgautoriteit hem ontheffen van de verplichting zodanige overeenkomsten te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: '13.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat zorg wordt voortgezet na het tijdstip waarop
      de verzekering is geëindigd of dat een aanspraak op een vergoeding bestaat voor zorg die wordt verleend na dat
      tijdstip. Daarbij kunnen beperkingen en voorwaarden worden gesteld. De wijze waarop een zodanige aanspraak tot
      gelding wordt gebracht, wordt daarbij eveneens geregeld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
  - number: '13.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor gevallen of omstandigheden waarin de kosten van het
      verlenen van de desbetreffende zorg in redelijkheid niet of niet volledig ten laste van de in deze wet geregelde
      verzekering dienen te komen, worden bepaald dat:
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
  - number: 13.2.a
    text: de zorg wordt geweigerd;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
  - number: 13.2.b
    text: de zorg op een later tijdstip ingaat;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
  - number: 13.2.c
    text: |-
      een hogere bijdrage van de verzekerde wordt gevorderd dan krachtens [artikel 6, vierde lid][ref1], is vastgesteld;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 13.2.d
    text: een vergoeding van gemaakte kosten geheel of gedeeltelijk wordt geweigerd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd het bij of krachtens deze wet bepaalde kan de zorgverzekeraar schriftelijk de voorwaarden vaststellen
      waaronder de aanspraken, bedoeld in de [artikelen 6][ref1] en [10 tot en met 13][ref2], tot gelding worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel10
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '10'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      De zorgverzekeraar zorgt er voor dat de bij hem ingeschreven verzekerden bij inschrijving en vervolgens periodiek
      de door de zorgverzekeraar vastgestelde regels of een weergave van de inhoud daarvan ontvangen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel14
  - number: '14.3'
    text: |-
      De zorgverzekeraar verstrekt eenieder op diens verzoek de door de zorgverzekeraar vastgestelde regels of een
      weergave van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel14
  - number: '15.1'
    text: |-
      Zorgverzekeraars sluiten schriftelijke overeenkomsten met zorgaanbieders die zorg kunnen verlenen waarop ingevolge
      [artikel 6][ref1] aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '15.2'
    text: De duur van een overeenkomst bedraagt maximaal vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
  - number: '15.3'
    text: |-
      Met zorgaanbieders die vormen van zorg verlenen als bedoeld in [artikel 6, vijfde lid][ref1], worden wat deze
      vormen van zorg betreft geen overeenkomsten gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '15.4'
    text: |-
      Indien na beëindiging van een overeenkomst voor een bepaalde vorm van zorg door een zorgverzekeraar geen
      aansluitende overeenkomst voor die vorm van zorg met dezelfde zorgaanbieder tot stand komt, behoudt de verzekerde,
      zolang die zorg noodzakelijk is, jegens de zorgverzekeraar aanspraak op ononderbroken voortzetting van die vorm van
      zorg, te verlenen door dezelfde zorgaanbieder, wanneer die zorg is aangevangen voor de datum waarop de overeenkomst
      met die zorgaanbieder voor die desbetreffende vorm van zorg is beëindigd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
  - number: '15.5'
    text: |-
      Gedurende de tijdelijke voortzetting van de zorg, bedoeld in het vierde lid, gelden tussen de zorgverzekeraar en
      de zorgaanbieder de voorwaarden van de overeenkomst waaronder de zorg aan de in het vierde lid bedoelde verzekerde
      is aangevangen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
  - number: '15.6'
    text: |-
      De zorgverzekeraar die een overeenkomst sluit als bedoeld in [artikel 10, eerste lid][ref1], met een zorgaanbieder
      buiten het Europese deel van Nederland stelt de zorgautoriteit daarvan in kennis. De zorgverzekeraar is gehouden
      desgevraagd aan de zorgautoriteit of aan een door deze aangewezen persoon kosteloos een afschrift van de gesloten
      overeenkomst te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel10
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '10'
        hoofdstuk: III
  - number: '16.1'
    text: 'De overeenkomsten bevatten ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.a
    text: |-
      het tijdstip waarop de overeenkomst aanvangt te werken, de duur van de overeenkomst en tussentijdse beëindiging van
      de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.b
    text: de aard, de kwaliteit, de doelmatigheid en de omvang van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.c
    text: de prijs van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.d
    text: de wijze waarop de verzekerden van informatie worden voorzien;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.e
    text: |-
      de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verlenen dan wel verleende
      zorg en op de juistheid van de daarvoor in rekening gebrachte bedragen;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16.1.f
    text: |-
      de administratieve voorwaarden die partijen bij de uitvoering van de overeenkomst in acht zullen nemen, waaronder
      in elk geval de in [artikel 10a, tweede lid][ref1], genoemde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 10a
        hoofdstuk: III
  - number: '16.2'
    text: Bij algemene maatregel van bestuur kunnen nadere regels over de inhoud van de overeenkomsten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16
  - number: 16a
    text: |-
      Overeenkomsten die in strijd met het bij of krachtens de [artikelen 15][ref1] of [16][ref2] bepaalde zijn gesloten,
      zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '16'
        hoofdstuk: III
  - number: 16b.1
    text: |-
      Een zorgverzekeraar is verplicht met iedere instelling als bedoeld in [artikel 1, onderdeel e, onder 1°][ref1]
      op haar verzoek een overeenkomst te sluiten als bedoeld in [artikel 15, eerste lid][ref2], tenzij hij daartegen
      ernstige bezwaren heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: 16b.2
    text: |-
      Indien een zorgverzekeraar een werkgebied heeft dat niet alle Nederlandse provincies omvat, is de in het eerste lid
      bedoelde verplichting beperkt tot de instellingen die zijn gelegen binnen dit werkgebied en de instellingen waarvan
      de bevolking van dit werkgebied naar verwachting regelmatig gebruik zal maken.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16b
  - number: 16b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16b
  - number: 16b.4
    text: |-
      Het Zorginstituut kan bij het verlenen van een ontheffing van [artikel 38, eerste lid][ref1], bepalen of en in
      hoeverre van het gestelde in het eerste en tweede lid van dit artikel kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel38
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '38'
        hoofdstuk: V
  - number: 16c.1
    text: |-
      Een instelling als bedoeld in [artikel 1, onderdeel e, onder 1°][ref1], die met een zorgverzekeraar een
      overeenkomst als bedoeld in [artikel 15, eerste lid][ref2], heeft gesloten, is gehouden op daartoe door een andere
      zorgverzekeraar gedaan verzoek met deze een gelijke overeenkomst te sluiten, tenzij die instelling daartegen
      ernstige bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: 16c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel16c
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verzekerde die de leeftijd van achttien jaren heeft
      bereikt, aan de zorgverzekeraar waarbij hij is ingeschreven, een, voor alle verzekerden gelijke, bij ministeriële
      regeling vast te stellen premie is verschuldigd. Bij de algemene maatregel van bestuur kan worden bepaald dat ten
      aanzien van daarbij aangegeven groepen van verzekerden een afwijkende premie kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel17
  - number: '17.2'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur kunnen regels worden gesteld omtrent de betaling
      van de premie en de gevolgen van niet tijdige betaling.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel17
  - number: '17.3'
    text: |-
      De premie wordt aangewend ter dekking van de kosten van zorg en van vergoedingen die aan de uitvoering van deze wet
      voor de zorgverzekeraar zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel17
  - number: '17.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de *Staatscourant* is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel17
  - number: '32'
    text: |-
      De aan een verzekerde op grond van [hoofdstuk 5 van de Wet financiering sociale verzekeringen][ref1] verleende
      ontheffing geldt tevens als ontheffing van de verplichtingen opgelegd bij of krachtens [artikel 17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel17
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '17'
        hoofdstuk: IV
  - number: '33.1'
    text: |-
      Een zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1] die deze wet ten
      aanzien van de verzekerden wenst uit te voeren, meldt zich daartoe aan bij de zorgautoriteit, onder vermelding van
      de dag met ingang waarvan hij zulks gaat doen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '33.2'
    text: |-
      Na aanmelding is de zorgverzekeraar verplicht te voldoen aan de voorschriften die bij of krachtens deze wet aan
      zorgverzekeraars zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel33
  - number: '33.3'
    text: |-
      [Artikel 26 van de Zorgverzekeringswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel26
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '26'
  - number: '34'
    text: |-
      De zorgverzekeraar is verplicht zijn werkzaamheden op een doelmatige wijze uit te voeren. Hij treft de nodige
      maatregelen ter voorkoming van de verstrekking van onnodige zorg en van uitgaven die hoger dan noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel34
  - number: '35'
    text: |-
      De zorgverzekeraar voert ter zake van de uitvoering van deze wet een van zijn overige activiteiten gescheiden
      administratie.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel35
  - number: '36.1'
    text: |-
      Een zorgverzekeraar en het CAK zenden elk voor 1 juli aan de zorgautoriteit een financieel verslag over het
      voorafgaande kalenderjaar. Daarin wordt onderscheid gemaakt tussen de beheerskosten en de kosten van verstrekking
      van zorg en vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel36
  - number: '36.2'
    text: |-
      Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door
      een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een verslag
      van zijn bevindingen over de ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de inhoud van het financieel verslag.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel36
  - number: '36.4'
    text: |-
      De zorgautoriteit zendt het College zorgverzekering onverwijld een exemplaar van de in het eerste en tweede lid
      bedoelde stukken.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel36
  - number: '36.5'
    text: |-
      Op aanvraag van een zorgverzekeraar is de zorgautoriteit bevoegd voor in haar besluit aan te wijzen baten en lasten
      te besluiten dat het ontbreken van een overeenkomst als bedoeld in [artikel 15][ref1] geen gevolgen heeft voor de
      inhoud van de verklaring, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: '37.1'
    text: |-
      De zorgverzekeraar en het CAK zenden elk voor 1 juli aan de zorgautoriteit in tweevoud een uitvoeringsverslag
      waarin zij:
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: 37.1.a
    text: rapporteren over de uitvoering van deze wet in het voorafgaande kalenderjaar, en
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: 37.1.b
    text: |-
      een overzicht geven van hun voornemens met betrekking tot de uitvoering van deze wet in het lopende kalenderjaar en
      het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: '37.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de inhoud van het uitvoeringsverslag.
      De voorschriften kunnen in het bijzonder betrekking hebben op naleving van een in de regeling aan te wijzen
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: '37.3'
    text: |-
      De zorgverzekeraar en het CAK voegen elk bij het uitvoeringsverslag twee exemplaren van een verslag met bevindingen
      van een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] over de vraag of:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 37.3.a
    text: het uitvoeringsverslag overeenkomstig de daarvoor geldende regels is opgesteld;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: 37.3.b
    text: |-
      de uitvoering is geschied overeenkomstig de verplichtingen die bij of krachtens deze wet in het voorafgaande
      kalenderjaar op de zorgverzekeraar en het CAK rustten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
  - number: '37.4'
    text: |-
      [Artikel 36, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel36
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '36'
        hoofdstuk: V
  - number: '39.1'
    text: |-
      Indien krachtens [afdeling 3.5.5 van de Wet op het financieel toezicht][ref1] jegens een zorgverzekeraar of
      een voormalige zorgverzekeraar de noodregeling is uitgesproken, of een voormalige zorgverzekeraar failliet is
      verklaard, voldoet het Zorginstituut aan verzekerden en aan zorgaanbieders jegens die zorgverzekeraar of voormalige
      zorgverzekeraar bestaande vorderingen ter zake van op grond van deze wet verstrekte zorg of vergoeding van daarvoor
      gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Afdeling3.5.5
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        afdeling: 3.5.5
  - number: '39.2'
    text: |-
      De vorderingen, bedoeld in het eerste lid, gaan bij wijze van subrogatie op het Zorginstituut over voor zover dat
      instituut deze heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel39
  - number: '39.3'
    text: Het Rijk is tegenover het Zorginstituut aansprakelijk voor de betalingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel39
  - number: '40.1'
    text: |-
      Ten aanzien van het verlenen van bij algemene maatregel van bestuur aan te wijzen zorg, waarop ingevolge
      [artikel 6][ref1] aanspraak bestaat, kan bij die maatregel worden bepaald, dat de administratie geheel of ten
      dele wordt verricht door een of meer door Onze Minister aan te wijzen rechtspersonen en dat de controle geheel of
      ten dele wordt uitgeoefend door een of meer door Onze Minister aan te wijzen rechtspersonen. Daarbij wordt tevens
      bepaald, volgens welke regels en onder wiens verantwoordelijkheid in zodanig geval de administratie wordt verricht
      en de controle wordt uitgeoefend, alsmede op welke wijze de kosten hiervan worden gedekt uit het Algemeen Fonds
      Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '40.2'
    text: |-
      Controle op het verlenen van zorg als bedoeld in [artikel 6, vijfde lid][ref1], kan worden geregeld bij
      ministeriële regeling, in overeenstemming met Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '40.3'
    text: |-
      Bij de maatregel, bedoeld in [artikel 6, vierde lid][ref1], wordt bepaald of en in welke mate wordt afgeweken van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '41.1'
    text: |-
      Het Zorginstituut bevordert de rechtmatige en doelmatige uitvoering van deze wet door de zorgverzekeraars, het CAK,
      door het CAK en door de rechtspersonen, bedoeld in [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '40'
        hoofdstuk: V
  - number: '41.2'
    text: |-
      Het Zorginstituut kan met het oog op de rechtmatige en doelmatige uitvoering van deze wet beleidsregels stellen
      voor de zorgverzekeraars, het CAK, voor het CAK en voor de rechtspersonen, bedoeld in [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '40'
        hoofdstuk: V
  - number: '42'
    text: |-
      Het Zorginstituut geeft aan zorgverzekeraars, aan zorgaanbieders en aan burgers voorlichting over de aard, inhoud
      en omvang van de aanspraken op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel42
  - number: '43.1'
    text: |-
      Het Zorginstituut rapporteert Onze Minister desgevraagd over voorgenomen beleid inzake aard, inhoud en omvang van
      de aanspraken, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '43.2'
    text: |-
      Het Zorginstituut signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen die aanleiding
      kunnen geven tot wijzigingen van de aard, inhoud en omvang van de aanspraken op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel43
  - number: '44.1'
    text: 'Bij ministeriële regeling kan worden bepaald dat het Zorginstituut overeenkomstig in die regeling gestelde regels:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: 44.1.a
    text: |-
      tijdelijk subsidies verstrekt voor zorg, ten aanzien waarvan het voornemen bestaat deze te doen opnemen in de
      aanspraken op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: 44.1.b
    text: |-
      subsidies verstrekt om verzekerden de mogelijkheid te geven om in plaats van het tot gelding brengen van een
      aanspraak op grond van deze wet zelf te voorzien in de zorg die zij behoeven;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: 44.1.c
    text: |-
      subsidies verstrekt voor zwangerschapsafbrekingen in de zin van de [Wet afbreking zwangerschap][ref1],
      overtijdbehandelingen en aan beide behandelingsvormen verbonden nazorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003396
  - number: '44.2'
    text: |-
      In een regeling als bedoeld in het eerste lid kan worden bepaald dat daarbij aan te wijzen bevoegdheden
      met betrekking tot de verstrekking van de subsidies, behorende tot een in die regeling genoemde categorie,
      worden uitgeoefend door een of meer door het Zorginstituut aan te wijzen rechtspersonen, als bedoeld in
      [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '40'
        hoofdstuk: V
  - number: '44.3'
    text: Onze Minister kan jaarlijks voor een categorie van subsidies het subsidieplafond voor het komende jaar bekendmaken.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: '44.4'
    text: In een regeling als bedoeld in het eerste lid kan aan het Zorginstituut worden opgedragen nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: '44.5'
    text: Nadere regels als bedoeld in het vierde lid behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: '44.6'
    text: Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44
  - number: 44a.1
    text: |-
      Het Zorginstituut zendt jaarlijks voor 15 april aan Onze Minister een zoveel mogelijk met overeenkomstige
      toepassing van [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] ingericht financieel verslag uitvoeringstaken
      over het afgelopen kalenderjaar, met een financiële verantwoording over bij ministeriële regeling aan te wijzen, op
      die uitvoeringstaken betrekking hebbende geldstromen, alsmede het verslag van bevindingen, waarin per geldstroom de
      bevindingen worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 44a.2
    text: Het financieel verslag uitvoeringstaken gaat vergezeld van een verklaring omtrent de getrouwheid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44a
  - number: 44a.3
    text: |-
      Het verslag van bevindingen geeft aan of het beheer en de organisatie voldoen aan eisen van rechtmatigheid,
      ordelijkheid, controleerbaarheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44a
  - number: 44a.4
    text: |-
      De verklaring omtrent getrouwheid en het verslag van bevindingen worden opgesteld door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '45.1'
    text: |-
      Het Zorginstituut zendt jaarlijks voor 31 december aan Onze Minister met betrekking tot het Algemeen Fonds
      Bijzondere Ziektekosten een jaarrekening over het voorafgaande kalenderjaar, alsmede het verslag van bevindingen,
      bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: '45.2'
    text: |-
      Het Zorginstituut legt in de jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 45.2.a
    text: de baten en lasten van het Algemeen Fonds Bijzondere Ziektekosten,
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: 45.2.b
    text: |-
      de geldstromen, bedoeld in [artikel 44a, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
  - number: 45.2.c
    text: de rechtmatigheid en doelmatigheid van het beheer van het Algemeen Fonds Bijzondere Ziektekosten,
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: 45.2.d
    text: de toestand van het Algemeen Fonds Bijzondere Ziektekosten per 31 december van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: '45.3'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '45.4'
    text: |-
      De verklaring, bedoeld in het derde lid, heeft mede betrekking op de rechtmatige verkrijging en besteding van de
      middelen van het Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: '45.5'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het derde lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en
      doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel45
  - number: '46.1'
    text: |-
      Het financieel verslag uitvoeringstaken, bedoeld in [artikel 44a][ref1], en de jaarrekening, bedoeld in
      [artikel 45][ref2], behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
  - number: '46.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden over de inhoud en de inrichting van:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
  - number: 46.2.a
    text: |-
      het financieel verslag uitvoeringstaken, bedoeld in [artikel 44a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
  - number: 46.2.b
    text: |-
      de jaarrekening, bedoeld in [artikel 45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
  - number: 46.2.c
    text: |-
      de accountantscontrole van het financieel verslag uitvoeringstaken, bedoeld in [artikel 44a][ref1], en van de
      jaarrekening, bedoeld in [artikel 45][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
  - number: 46.2.d
    text: |-
      de bij het financieel verslag uitvoeringstaken, bedoeld in [artikel 44a][ref1], en de jaarrekening, bedoeld in
      [artikel 45][ref2], behorende verslagen van bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '45'
        hoofdstuk: VI
  - number: '46.3'
    text: |-
      Na de goedkeuring, bedoeld in het eerste lid, stelt het Zorginstituut het financieel verslag uitvoeringstaken,
      bedoeld in [artikel 44a][ref1], en de jaarrekening van het Algemeen Fonds Bijzondere Ziektekosten algemeen
      verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 44a
        hoofdstuk: VI
  - number: '47'
    text: |-
      Het Zorginstituut rapporteert Onze Minister gevraagd en ongevraagd omtrent de benodigde omvang van de ten laste van
      het Algemeen Fonds Bijzondere Ziektekosten beschikbare middelen voor de in deze wet geregelde verzekering en van de
      premie, bedoeld in [artikel 90, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel90
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '90'
  - number: '48.1'
    text: Er is een CAK, dat rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.2'
    text: Het CAK is gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.3'
    text: Het CAK bestaat uit ten hoogste drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.4'
    text: Het CAK wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.5'
    text: |-
      Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het CAK
      alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.6'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
  - number: '48.7'
    text: |-
      In afwijking van [artikel 15 van de Kaderwet zelfstandige bestuursorganen][ref1] worden de personeelsleden van
      de in het eerste lid bedoelde rechtspersoon in dienst genomen op arbeidsovereenkomst naar burgerlijk recht. De
      bepalingen van [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn op deze overeenkomst van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0005290
  - number: '49'
    text: 'Het CAK is belast met:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
  - number: 49.a
    text: |-
      de vaststelling en de inning van de eigen bijdragen, bedoeld in [artikel 6, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 49.b
    text: |-
      de vaststelling en inning van de eigen bijdragen, bedoeld in
      [artikel 16 van de Wet maatschappelijke ondersteuning][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel16
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '16'
  - number: 49.c
    text: |-
      de vaststelling van het recht op en de verstrekking van de tegemoetkomingen, bedoeld in
      [artikel 2, eerste en tweede lid, van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '2'
  - number: 49.d
    text: |-
      de vaststelling van het recht op en de verstrekking van de tegemoetkomingen, bedoeld in
      [artikel 11a van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 11a
  - number: 49.e
    text: |-
      de vaststelling van het recht op en de verstrekking van de uitkeringen, bedoeld in
      [artikel 118a, eerste lid, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
  - number: 49.f
    text: |-
      het namens zorgverzekeraars of het College zorgverzekeringen verrichten van betalingen aan zorgaanbieders, welke de
      zorgverzekeraars, of het College zorgverzekeringen, uit hoofde van de uitvoering van deze wet verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel49
  - number: '50.1'
    text: Het CAK stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel50
  - number: '50.2'
    text: Vergaderingen van het CAK zijn niet openbaar, behoudens voor zover in het bestuursreglement anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel50
  - number: '51.1'
    text: Het CAK zendt Onze Minister jaarlijks voor 1 november een werkprogramma en een begroting.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51
  - number: '51.2'
    text: |-
      Het werkprogramma bevat een beschrijving van de activiteiten die het CAK voornemens is in het volgende kalenderjaar
      te verrichten. Het werkprogramma behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51
  - number: '51.3'
    text: |-
      Onverminderd [artikel 27 van de Kaderwet zelfstandige bestuursorganen][ref1] bevat de begroting een meerjarenraming
      van de beheerskosten voor de vier kalenderjaren, volgend op het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
  - number: '51.4'
    text: |-
      De in de [artikelen 26][ref1] en [34 van de Kaderwet zelfstandige bestuursorganen][ref2] bedoelde begroting
      en jaarrekening hebben betrekking op de beheerskosten van het CAK en op de tegemoetkomingen, bedoeld in
      [artikel 2, eerste lid, van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0025003
        artikel: '2'
  - number: '51.5'
    text: |-
      Onverminderd [artikel 35, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref1] doet de accountant
      tevens verslag van zijn bevindingen over de vraag of het beheer en de organisatie van het CAK voldoen aan eisen van
      rechtmatigheid, ordelijkheid en controleerbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '35'
  - number: 51a.1
    text: |-
      Onze Minister stelt jaarlijks voor 1 december het budget vast voor de door het CAK ter uitvoering van zijn in
      [artikel 49][ref1] genoemde taken in het volgende kalenderjaar te maken beheerskosten alsmede voor de kosten van de
      tegemoetkomingen, bedoeld in [artikel 2 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0025003#Artikel2
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '49'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0025003
        artikel: '2'
  - number: 51a.2
    text: Het door Onze Minister vastgestelde budget wordt gedekt uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51a
  - number: 51a.3
    text: |-
      Indien het budget niet is vastgesteld voor 1 januari van het kalenderjaar waarop de begroting betrekking heeft, is
      het CAK bevoegd, teneinde zijn activiteiten gaande te houden, te beschikken over ten hoogste een derde gedeelte van
      het in het budget opgenomen bedrag voor beheerskosten dat laatstelijk voor hem voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51a
  - number: 51a.4
    text: |-
      Het CAK gaat met betrekking tot de met de uitvoering van zijn taken gepaard gaande beheerskosten geen
      verplichtingen aan en doet geen uitgaven die leiden tot overschrijding van het in het budget opgenomen bedrag voor
      de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51a
  - number: 51a.5
    text: Onze Minister kan besluiten het in het budget opgenomen bedrag voor de beheerskosten te wijzigen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51a
  - number: 51b
    text: |-
      In afwijking van [artikel 29 van de Kaderwet zelfstandige bestuursorganen][ref1] behoeven wijzigingen in de
      bedragen die in de goedgekeurde begroting zijn opgenomen voor de beheerskosten geen goedkeuring van Onze Minister,
      mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: 51b.a
    text: de totale omvang van het in die begroting opgenomen bedrag voor beheerskosten geen wijziging ondergaat, en
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51b
  - number: 51b.b
    text: |-
      de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van vijf procent van het in [artikel 51a, eerste lid][ref1], bedoelde budget, voor zover dat betrekking heeft op
      beheerskosten, niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel51a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 51a
        hoofdstuk: VII
  - number: 51c
    text: |-
      Na de goedkeuring, bedoeld in [artikel 51, tweede lid][ref1], alsmede de goedkeuring, bedoeld in de
      [artikelen 29, eerste lid][ref2], en [34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3], stelt
      het CAK het werkprogramma, de begroting, het jaarverslag en de jaarrekening algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '51'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
  - number: 51d
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
  - number: 51d.a
    text: |-
      de inhoud en inrichting van het werkprogramma, bedoeld in [artikel 51, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel51
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '51'
        hoofdstuk: VII
  - number: 51d.b
    text: |-
      de inhoud en inrichting van de begroting, bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: 51d.c
    text: |-
      de inhoud en inrichting van het jaarverslag en de jaarrekening, bedoeld in de [artikelen 18][ref1] en
      [34 van de Kaderwet zelfstandige bestuursorganen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '34'
  - number: 51d.d
    text: de accountantscontrole van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
  - number: 51d.e
    text: |-
      de omvang van de door het CAK te vormen egalisatiereserve, bedoeld in
      [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel33
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '33'
  - number: 51d.f
    text: |-
      de wijze waarop en de voorwaarden waaronder het budget, bedoeld in [artikel 51a][ref1], wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel51a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 51a
        hoofdstuk: VII
  - number: 51d.g
    text: de gegevens die worden verstrekt ten behoeve van de vaststelling van het budget.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel51d
  - number: '52.1'
    text: |-
      De zorgverzekeraar neemt het burgerservicenummer van zijn verzekerden met het oog op de uitvoering van deze wet in
      zijn administratie op en bewaart deze gedurende zeven jaren na het einde van de inschrijving van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
  - number: '52.2'
    text: |-
      De zorgverzekeraar stelt bij de eerste opname in zijn administratie en vervolgens indien daartoe
      aanleiding is het burgerservicenummer van de verzekerde vast met overeenkomstige toepassing van
      [artikel 7 van de Wet gebruik burgerservicenummer in de zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel7
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '7'
  - number: '52.3'
    text: |-
      De zorgverzekeraar gebruikt het burgerservicenummer van de verzekerde met het doel te waarborgen dat de in het
      kader van de verzekering van zorg te verwerken persoonsgegevens op die verzekerde betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
  - number: '52.4'
    text: |-
      Bij gegevensuitwisseling tussen de zorgverzekeraars en de in de [artikelen 53 tot en met 56][ref1] genoemde
      personen en instanties wordt voor zover die personen en instanties tot gebruik van dat nummer bevoegd zijn, het
      burgerservicenummer gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel53
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '53'
        hoofdstuk: VIII
  - number: '52.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op de gegevensuitwisseling tussen de
      zorgverzekeraars en de zorgaanbieders, indicatieorganen en zorgverzekeraars in de zin van de
      [Wet gebruik burgerservicenummer in de zorg][ref1] die niet in de [artikelen 53 tot en met 56][ref2] zijn genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0023864
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel53
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0023864
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '53'
        hoofdstuk: VIII
  - number: '52.6'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
  - number: '52.7'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in het
      eerste, vierde en vijfde lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
  - number: '52.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden over de bij de gegevensuitwisseling,
      bedoeld in het vierde en vijfde lid, te verwerken feiten of gegevens met betrekking tot verzekerden van wie het
      vaststellen van het burgerservicenummer onmogelijk blijkt of een onevenredige inspanning kost. Bij of krachtens die
      maatregel kan worden bepaald aan welke beveiligingseisen de verwerking van die feiten of gegevens voldoet.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
  - number: '52.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen vormen van zorg als bedoeld in [artikel 6][ref1], alsmede categorieën van
      zorgverzekeraars en in de [artikelen 53 tot en met 56][ref2] genoemde personen en instanties worden uitgezonderd
      van de toepassing van het bepaalde bij of krachtens eerste tot en met het achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel53
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '53'
        hoofdstuk: VIII
  - number: '53.1'
    text: 'Een zorgverzekeraar of een door een zorgverzekeraar of Onze Minister aangewezen persoon en:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.1.a
    text: een zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.1.b
    text: |-
      een indicatieorgaan als bedoeld in [artikel 9a, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
  - number: '53.2'
    text: |-
      Voor zover de verzekerde daartoe uitdrukkelijk toestemming heeft verleend, verstrekken een indicatieorgaan als
      bedoeld in het eerste lid, en een zorgaanbieder elkaar kosteloos de persoonsgegevens van de verzekerde, waaronder
      persoonsgegevens betreffende de gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '53.3'
    text: |-
      Indien een zorgaanbieder anders dan krachtens een door hem met de zorgverzekeraar gesloten overeenkomst aan een
      verzekerde zorg heeft verleend als bedoeld in deze wet, verstrekt hij de verzekerde kosteloos de persoonsgegevens,
      waaronder persoonsgegevens betreffende zijn gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref1],
      die voor zijn zorgverzekeraar of voor een door die zorgverzekeraar of door Onze Minister aangewezen persoon
      noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '53.4'
    text: |-
      Personen werkzaam ten behoeve van een zorgaanbieder of een indicatieorgaan als bedoeld in het eerste lid,
      verstrekken die zorgaanbieder of dat indicatieorgaan de persoonsgegevens die zij nodig hebben om te kunnen voldoen
      aan hun verplichtingen, bedoeld in het eerste, tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: '53.5'
    text: |-
      Personen werkzaam bij een door een zorgverzekeraar of Onze Minister aangewezen persoon als bedoeld in het eerste
      of derde lid, voor wie niet reeds uit hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht
      tot geheimhouding van de gegevens als bedoeld in het eerste of derde lid, behoudens voor zover enig wettelijk
      voorschrift hen mededeling toestaat.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: '53.6'
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.a
    text: tot welke gegevens de verplichting, bedoeld in het eerste of derde lid, zich in ieder geval uitstrekt;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.b
    text: op welke wijze gegevens, bedoeld in het eerste, tweede of derde lid, worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.c
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.d
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.e
    text: |-
      in welke gevallen gegevens, bedoeld in het eerste of derde lid, verder worden verwerkt met het oog op de
      uitvoering van deze wet, een zorgverzekering als bedoeld in de [Zorgverzekeringswet][ref1] of een aanvullende
      ziektekostenverzekering, voor zover deze gegevens niet worden gebruikt voor het beoordelen en accepteren van een
      aspirant-verzekerde voor een aanvullende verzekering en bovendien noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 53.6.e.1°
    text: de betaling aan een zorgaanbieder of de vergoeding van zorgkosten aan een verzekerde,
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.e.2°
    text: de vaststelling van eigen bijdragen,
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.e.3°
    text: het uitoefenen van het verhaalsrecht, of
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: 53.6.e.4°
    text: het verrichten van controle of fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel53
  - number: '54.1'
    text: |-
      Een ieder verstrekt op verzoek aan de zorgverzekeraars, het Zorginstituut, de zorgautoriteit, Onze Minister, de
      rijksbelastingdienst, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, het college
      van burgemeester en wethouders, Onze Minister van Sociale Zaken en Werkgelegenheid, een indicatieorgaan als bedoeld
      in [artikel 9a, eerste lid][ref1], het CAK, of aan een daartoe door of vanwege een van deze zorgverzekeraars
      of instanties of door Onze Minister aangewezen persoon kosteloos alle inlichtingen en gegevens, waaronder
      persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref2], die noodzakelijk zijn voor de
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0011468
  - number: '54.2'
    text: |-
      De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm of in een
      andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het in
      het eerste lid bedoelde verzoek.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel54
  - number: '54.3'
    text: |-
      Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voor zover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      zorgverzekeraars of instanties.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel54
  - number: '54.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel54
  - number: '55.1'
    text: |-
      De in [artikel 54, eerste lid][ref1], bedoelde zorgverzekeraars, instanties en personen zijn bevoegd
      uit eigen beweging en verplicht op verzoek binnen een bij dat verzoek genoemde termijn, uit de onder hun
      verantwoordelijkheid gevoerde administratie, aan elkaar, aan een daartoe door of vanwege hen aangewezen persoon
      of aan een door Onze Minister aangewezen persoon, kosteloos, de gegevens, waaronder persoonsgegevens als bedoeld
      in de [Wet bescherming persoonsgegevens][ref2], te verstrekken die noodzakelijk zijn voor de uitvoering van de
      zorgverzekeringen of van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '54'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0011468
  - number: '55.2'
    text: |-
      Een zorgverzekeraar en het CAK verlenen op verzoek van het Zorginstituut dan wel van de zorgautoriteit aan door
      het desbetreffende instituut aangewezen personen inzage in alle bescheiden en andere gegevensdragers, stelt deze op
      verzoek ter beschikking voor het nemen van afschrift en verleent de terzake verlangde medewerking, voor zover het
      desbetreffende instituut dit nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
  - number: '55.3'
    text: |-
      Onze Minister is bevoegd zorgverzekeraars en zorgaanbieders, ter handhaving van het bepaalde bij of krachtens het
      eerste lid, een aanwijzing te geven betreffende de verstrekking van gegevens die het CAK voor de uitvoering van
      zijn taak, bedoeld in [artikel 49, aanhef en onderdeel a][ref1], nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel49
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '49'
        hoofdstuk: VII
  - number: '55.4'
    text: |-
      Indien een zorgverzekeraar of een zorgaanbieder niet binnen vier weken aan een aanwijzing als bedoeld in het derde
      lid voldoet, is Onze Minister bevoegd een last onder dwangsom op te leggen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
  - number: '55.5'
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een
      in [artikel 54, eerste lid][ref1], bedoelde zorgverzekeraar of instantie de door deze gevraagde uittreksels uit de
      registers kosteloos toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel54
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '54'
        hoofdstuk: VIII
  - number: '55.6'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      een zorgverzekeraar, aan het CAK, aan het Zorginstituut of aan de zorgautoriteit alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de zorgverzekeraar of het desbetreffende instituut.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
  - number: '55.7'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel55
  - number: '56.1'
    text: |-
      De zorgautoriteit, onderscheidenlijk het Zorginstituut, kan na overleg met het Zorginstituut, onderscheidenlijk de
      zorgautoriteit, bij regeling bepalen welke gegevens en inlichtingen regelmatig door de zorgverzekeraars en het CAK
      moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel56
  - number: '56.2'
    text: |-
      De regels kunnen mede omvatten het tijdstip en de wijze waarop de gegevens en inlichtingen moeten worden verstrekt,
      alsmede dat een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de juistheid
      van de verstrekte gegevens en inlichtingen bevestigt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '56.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke statistische gegevens de zorgverzekeraars en het CAK verzamelen
      betreffende vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel56
  - number: '57.1'
    text: |-
      Het Zorginstituut en de zorgautoriteit verstrekken desgevraagd aan Onze Minister of aan het College bouw of het
      College sanering, genoemd in [artikel 19][ref1] respectievelijk [32 van de Wet toelating zorginstellingen][ref2],
      de voor de uitoefening van hun taak benodigde inlichtingen en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel32
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '32'
  - number: '57.2'
    text: |-
      Het Zorginstituut en de zorgautoriteit verlenen aan door Onze Minister of door een bestuursorgaan, bedoeld in het
      eerste lid, aangewezen personen toegang tot en inzage in zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57
  - number: 57a.1
    text: |-
      Een zorgverzekeraar maakt voor de verstrekking of ontvangst van gegevens aan of van personen, aan te wijzen door
      het Zorginstituut, gebruik van een elektronische infrastructuur.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57a.2
    text: 'Het Zorginstituut kan met betrekking tot het eerste lid regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57a.2.a
    text: de aard en omvang van de gegevens en de voorschriften waaraan de verstrekking of ontvangst ten minste moet voldoen;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57a.2.b
    text: |-
      de wijze waarop de verstrekking of ontvangst van gegevens plaatsvindt, waaronder begrepen de aansluiting van
      zorgverzekeraars op de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57a.2.c
    text: |-
      de wijze waarop het gebruik van de infrastructuur wordt georganiseerd en beheerd, waaronder begrepen de inrichting
      en instandhouding van een gemeenschappelijke database;
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57a.2.d
    text: de financiering van het gebruik van de infrastructuur en de wijze waarop de kosten ervan worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57a
  - number: 57b.1
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van De Nederlandsche
      Bank N.V. of de Stichting Autoriteit Financiële Markten zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of bij of krachtens deze wet
      wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 57b.2
    text: |-
      In afwijking van het eerste lid kunnen de zorgautoriteit en het Zorginstituut met gebruikmaking van vertrouwelijke
      gegevens of inlichtingen verkregen bij de uitvoering van hun taken op grond van deze wet, mededelingen doen, indien
      deze niet kunnen worden herleid tot afzonderlijke personen of ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
  - number: 57b.3
    text: |-
      In afwijking van het eerste lid en in overeenstemming met [artikel 1:89 van de Wet op het financieel toezicht][ref1]
      zijn de zorgautoriteit, het Zorginstituut, De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële
      Markten, voor zover dat voor hun taakuitoefening noodzakelijk is, bevoegd aan elkaar en aan Onze Minister
      vertrouwelijk gegevens of inlichtingen omtrent afzonderlijke verzekeraars te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 57b.4
    text: 'Het eerste lid laat, ten aanzien van degene op wie dat lid van toepassing is, onverlet:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
  - number: 57b.4.a
    text: |-
      de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1] welke betrekking hebben op het als
      getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of inlichtingen verkregen bij de
      vervulling van de ingevolge deze wet opgedragen taak;


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 57b.4.b
    text: |-
      de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en van
      [artikel 66 van de Faillissementswet][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: 57b.4.c
    text: |-
      de bevoegdheden van de Algemene Rekenkamer ingevolge [artikel 91 van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
  - number: 57b.5
    text: |-
      Het vierde lid, onderdeel b, geldt niet voor gegevens of inlichtingen die betrekking hebben op verzekeraars die
      betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar in staat te stellen zijn bedrijf voort
      te zetten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
  - number: 57b.6
    text: |-
      De Algemene Rekenkamer is bij het doen van mededelingen als bedoeld in
      [artikel 91, elfde tot en met veertiende lid, van de Comptabiliteitswet 2001][ref1], verplicht tot geheimhouding,
      voor zover het betreft gegevens en inlichtingen die haar ingevolge het vierde lid, onderdeel c, bekend zijn
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
  - number: '58.1'
    text: |-
      Een beslissing van een zorgverzekeraar of een indicatieorgaan als bedoeld in [artikel 9a, eerste lid][ref1],
      op bezwaar inzake een aanspraak op zorg of op een vergoeding ingevolge deze wet wordt niet genomen dan nadat
      daaromtrent door het Zorginstituut op verzoek van het bestuursorgaan advies is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
        hoofdstuk: III
  - number: '58.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover het bezwaarschrift betrekking heeft op een ingevolge het bepaalde
      krachtens deze wet verschuldigde bijdrage, waarvan de hoogte niet afhankelijk is van een medisch oordeel.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: '58.3'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: 58.3.a
    text: het bezwaar kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: 58.3.b
    text: aan het bezwaar volledig tegemoet wordt gekomen, of
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: 58.3.c
    text: |-
      het Zorginstituut geen advies heeft uitgebracht binnen de in het vierde lid genoemde termijn of heeft medegedeeld
      geen advies te zullen uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: '58.4'
    text: |-
      Het Zorginstituut brengt een advies als bedoeld in het eerste lid uit binnen tien weken na ontvangst van alle
      gegevens en bescheiden die voor de beoordeling van het verzoek noodzakelijk zijn, en zendt gelijktijdig afschrift
      daarvan aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
  - number: '58.5'
    text: |-
      Indien het Zorginstituut is verzocht advies uit te brengen, wordt de beslissing op bezwaar in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] genomen binnen een en twintig weken gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '59'
    text: |-
      Het beroep en het hoger beroep inzake een geschil van uitsluitend geneeskundige aard wordt behandeld met toepassing
      van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '61.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van het bepaalde bij of krachtens een der [artikelen 1, tweede lid][ref1],
      [2][ref2], [3][ref3] en [5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '3'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: '61.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel61
  - number: '64.1'
    text: |-
      Bij afwijzing van verzoeken als bedoeld in de [artikelen 16b][ref1] en [16c][ref2] kan de beslissing van het
      Zorginstituut worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16c
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 16b
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 16c
        hoofdstuk: III
  - number: '64.2'
    text: |-
      Het eerste lid geldt niet voor zover er voor zorgverzekeraars of instellingen op grond van bij of krachtens
      algemene maatregel van bestuur gestelde regels geen verplichting bestaat tot het sluiten van overeenkomsten als
      bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: '65.1'
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of de kosten daarvan vervalt met
      ingang van de dag waarop en voor zover voor een verzekerde uit deze wet aanspraken voortvloeien gelijkwaardig aan
      die, welke aan genoemde overeenkomst kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65
  - number: '65.2'
    text: |-
      Een verzekeraar verlaagt voor alle verzekerden in gelijke mate en naar rato van het vervallen gedeelte
      van de in het eerste lid bedoelde overeenkomsten de tarieven van gesloten en nieuw af te sluiten
      ziektekostenverzekeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65
  - number: '65.3'
    text: |-
      De premie, welke degene wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk
      is vervallen, heeft vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 percent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65
  - number: 65a
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van een feit, dat aanleiding geeft tot het verlenen van zorg, bedoeld in [artikel 6][ref1], dan wel zorg
      die is bekostigd ingevolge [artikel 44, eerste lid, onderdelen a en b][ref2], houdt de rechter rekening met de
      aanspraken, die de verzekerde krachtens deze wet heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '44'
        hoofdstuk: VI
  - number: 65b.1
    text: |-
      Behoudens toepassing van het derde lid, eerste volzin, heeft een zorgverzekeraar voor de krachtens deze wet
      gemaakte kosten verhaal op degene, die in verband met het in [artikel 65a][ref1] bedoelde feit jegens de verzekerde
      naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het
      ontbreken van de aanspraken krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een
      bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde
      naar burgerlijk recht is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 65a
        hoofdstuk: IXA
  - number: 65b.2
    text: |-
      Voorzover de geldswaarde van de in het eerste lid bedoelde verleende zorg niet kan worden vastgesteld, wordt deze
      bepaald op een geschat bedrag. Onze Minister kan hieromtrent nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65b
  - number: 65b.3
    text: |-
      Het Zorginstituut kan met verzekeraars een overeenkomst sluiten inhoudende een door die verzekeraars aan het
      Zorginstituut te betalen afkoopsom voor de voor de komende periode te verwachten schadelast tengevolge van de
      schadeplichtigheid van diens verzekerden ingevolge het eerste lid. De overeenkomst heeft geen betrekking op de
      schadelast van een zorgverzekeraar die voor de aanvang van de onderhandelingen over de bedoelde overeenkomst
      aan het Zorginstituut te kennen heeft gegeven van zijn bevoegdheid in het eerste lid gebruik te maken. Het
      Zorginstituut stelt voor aanvang van de periode waarvoor een afkoopsom is overeengekomen, zorgverzekeraars op de
      hoogte van de totstandkoming van bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65b
  - number: 65c.1
    text: |-
      Indien de verzekerde in dienstbetrekking werkzaam is, geldt [artikel 65b][ref1], ten aanzien van de naar burgerlijk
      recht tot schadevergoeding verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar
      burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot dezelfde werkgever
      als de verzekerde jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien
      het feit als genoemd in [artikel 65a][ref2] is te wijten aan opzet of bewuste roekeloosheid van die werkgever
      onderscheidenlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel65b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65c
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 65b
        hoofdstuk: IXA
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 65a
        hoofdstuk: IXA
  - number: 65c.2
    text: |-
      Voor de toepassing van het eerste lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65c
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: 65d.1
    text: |-
      Een zorgverzekeraar kan van hem, die, zonder daartoe gerechtigd te zijn, opzettelijk aanspraken als verzekerde bij
      hem doet gelden onderscheidenlijk deed gelden, alsmede van hem, die daaraan opzettelijk zijn medewerking verleent
      onderscheidenlijk heeft verleend, geheel of gedeeltelijk het bedrag vorderen van de zorg of van de vergoedingen die
      hem te veel of ten onrechte zijn verleend. Voorzover de geldswaarde van de in de eerste volzin bedoelde zorg niet
      vaststaat, kan deze worden vastgesteld op een geschat bedrag.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65d
  - number: 65d.2
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65d
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 65d.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de in het eerste lid
      bedoelde terugvordering.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel65d
  - number: '68'
    text: |-
      Hij die niet voldoet aan een der verplichtingen, bedoeld in [artikel 54, derde lid][ref1], wordt gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel54
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '54'
        hoofdstuk: VIII
  - number: 68a
    text: |-
      Overtreding van [artikel 9, derde lid][ref1], wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete
      van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '9'
        hoofdstuk: III
  - number: '71'
    text: |-
      Overtreding van het bepaalde bij of krachtens een algemene maatregel van bestuur, strekkende tot uitvoering van
      deze wet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien en
      voor zover deze overtreding bij die algemene maatregel als strafbaar feit is aangeduid.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel71
  - number: '73.1'
    text: |-
      Met de opsporing van feiten die zijn strafbaar gesteld bij of krachtens deze wet, alsmede, voor
      zover het feit voor de toepassing van deze wet van belang is, van de feiten omschreven in de
      [artikelen 225 tot en met 227b][ref1], [447c][ref2] en [447d van het Wetboek van Strafrecht][ref3] zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4], belast de ambtenaren, aangewezen bij besluit
      van Onze Minister en Onze Minister van Justitie. Deze ambtenaren zijn tevens belast met de opsporing van feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel447c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel447d
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 447c
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 447d
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '73.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel73
  - number: '74'
    text: |-
      Bij het opsporen van een bij of krachtens deze wet strafbaar gesteld feit hebben de in [artikel 73][ref1] bedoelde
      personen toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel73
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '73'
        hoofdstuk: X
  - number: '76'
    text: |-
      De in de [artikelen 68][ref1], [68a][ref2] en [71][ref3] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel68a
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel71
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '68'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 68a
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '71'
        hoofdstuk: X
  - number: 76a.1
    text: |-
      De voordracht tot het vaststellen van een algemene maatregel van bestuur als bedoeld in de
      [artikel 5, derde en vierde lid][ref1], en [artikel 6][ref2], wordt gedaan door Onze Minister in overeenstemming
      met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 76a.2
    text: |-
      Indien een algemene maatregel van bestuur, bedoeld in [artikel 6][ref1], geen zodanige invloed
      heeft op de geldelijke omvang van de verstrekkingen dat zulks verhoging of verlaging van de in
      [artikel 11, derde lid, van de Wet financiering sociale verzekeringen][ref2] bedoelde premies tot gevolg heeft,
      zal, in afwijking van het eerste lid, een voordracht tot het vaststellen daarvan worden gedaan door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '11'
  - number: '77'
    text: |-
      Voor zover deze wet niet anders bepaalt, wordt hetgeen tot haar uitvoering nodig is bij of krachtens algemene
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel77
  - number: 78b
    text: |-
      Onze Minister zendt voor 1 februari 2008 en vervolgens na vier jaar aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van de [artikelen 15 tot en met 16c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel15
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '15'
        hoofdstuk: III
  - number: '79'
    text: 'Deze wet wordt aangehaald als: Algemene Wet Bijzondere Ziektekosten.'
    url: https://wetten.overheid.nl/BWBR0002614/2014-07-16#Artikel79
