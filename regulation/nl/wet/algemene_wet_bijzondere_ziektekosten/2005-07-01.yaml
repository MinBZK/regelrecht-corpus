  - number: '14'
    text: |-
      1 Onverminderd het bij of krachtens deze wet bepaalde kan het uitvoeringsorgaan bij reglement de voorwaarden
      vaststellen waaronder de aanspraken, bedoeld in de [artikelen 6][ref1] en [10 tot en met 13][ref2], tot gelding
      worden gebracht.

      2 Het uitvoeringsorgaan zorgt er voor dat de bij hem ingeschreven verzekerden bij inschrijving en vervolgens
      periodiek het reglement of een weergave van de inhoud daarvan ontvangen.

      3 Het uitvoeringsorgaan verstrekt eenieder op diens verzoek het reglement of een weergave van de inhoud daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel10
