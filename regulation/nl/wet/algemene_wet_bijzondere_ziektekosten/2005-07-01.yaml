  - number: '33'
    text: |-
      1 Een rechtspersoon welke als ziektekostenverzekeraar werkzaam is, moet daartoe zijn toegelaten door het College
      zorgverzekeringen.

      2 Op de voorbereiding van een beschikking tot toelating is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.

      3 Toelating als ziektekostenverzekeraar wordt verleend indien de aanvrager een rechtspersoon met volledige
      rechtsbevoegdheid is:

      a. die ingevolge haar statuten ten doel heeft in een daarin aangegeven werkgebied het
      ziektekostenverzekeringsbedrijf uit te oefenen,

      b. die voldoet aan de overige bij of krachtens deze wet aan ziektekostenverzekeraars gestelde eisen, en

      c. waarvan ook overigens is te verwachten dat zij de taak van een ziektekostenverzekeraar naar behoren zal
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '34'
    text: >-
      1 Bij de beschikking tot toelating als ziektekostenverzekeraar kunnen aan de ziektekostenverzekeraar met het oog op
      een goede uitvoering van deze wet verplichtingen worden opgelegd.


      2 Ook op een later tijdstip kunnen aan de ziektekostenverzekeraar met het oog op een goede uitvoering van deze
      wet verplichtingen worden opgelegd. Een beschikking als bedoeld in de eerste volzin treedt niet in werking dan na
      verloop van vier weken na de dag waarop zij is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel34
  - number: '35'
    text: |-
      1 De toelating wordt ingetrokken indien de ziektekostenverzekeraar:

      a. niet meer voldoet aan de eisen, vervat in [artikel 33, derde lid][ref1], of de aan hem opgelegde verplichtingen,
      of

      b. in ernstige mate handelt in strijd met de bij enig wettelijk voorschrift ten aanzien van
      ziektekostenverzekeraars gestelde eisen of anderszins zijn taak niet naar behoren vervult.

      2 Op aanvraag van de ziektekostenverzekeraar wordt de toelating met ingang van een daarbij te bepalen datum
      ingetrokken.

      3 Het College zorgverzekeringen regelt de gevolgen van de intrekking van de toelating en de afwikkeling der lopende
      zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel33
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '33'
        hoofdstuk: V
  - number: '36'
    text: |-
      Van beschikkingen ingevolge de [artikelen 33][ref1], [34, tweede lid][ref2], en [35][ref3] wordt mededeling gedaan
      in de Staatscourant, onder vermelding van het werkgebied van de betrokken ziektekostenverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel35
