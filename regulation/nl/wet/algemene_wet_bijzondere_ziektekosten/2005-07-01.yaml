  - number: 32a
    text: |-
      1 Degene, wiens verzekering ingevolge [artikel 5][ref1] is geëindigd, kan de verzekering op grond van deze wet
      vrijwillig voortzetten indien hij buiten Nederland woont en:

      a) op de dag van vertrek uit Nederland recht had op:

      1e een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2],

      2e een uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref3],

      3e een pensioen op basis van arbeidsongeschiktheid op grond van de [Algemene burgerlijke pensioenwet](onbekend),
      zoals die luidde voor 1 januari 1996, dan wel een WAO-conforme uitkering op grond van de [Wet privatisering ABP]
      (onbekend), zoals die luidde voor 1 januari 1998, een pensioen op basis van arbeidsongeschiktheid op grond van de
      Spoorwegpensioenwet, zoals die luidde voor 1 januari 1994, dan wel een pensioen op basis van arbeidsongeschiktheid
      op grond van de [Wet privatisering Spoorwegpensioenfonds][ref4] of een pensioen op basis van arbeidsongeschiktheid
      op grond van de Algemene militaire pensioenwet, zoals die luidde voor 1 januari 1998,

      4e een uitkering op grond van de [Algemene Ouderdomswet][ref5],

      5e een nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref6],

      6e een uitkering of toelage op grond van de Algemene Arbeidsongeschiktheidswet,
      zoals die luidde op de dag voorafgaand aan de inwerkingtreding van de
      [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref7],

      7e een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],

      8e een uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9],

      voorzover en zolang hij die uitkering, dat pensioen of die toelage ontvangt en
      die uitkering, dat pensioen of die toelage ten minste gelijk is aan 35% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref10] bedoelde bedrag,
      dan wel

      b. recht heeft op een uitkering, een pensioen of een toelage als bedoeld [onder a][ref11], indien dat recht
      aansluit op de verzekering van rechtswege op grond van de volksverzekeringen, dan wel, ter vervanging daarvan,
      op een andere uitkering, pensioen of toelage, bedoeld onder a, zolang hij die uitkering, dat pensioen of
      die toelage ontvangt en die uitkering, dat pensioen of die toelage ten minste gelijk is aan 35% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref12] bedoelde bedrag.

      2 Het eerste lid is slechts van toepassing op personen die onmiddellijk voorafgaand aan de ingangsdatum van de
      vrijwillige verzekering ten minste een jaar onafgebroken verzekerd zijn geweest ingevolge deze wet.

      3 Het eerste lid is niet van toepassing op personen die buiten Nederland arbeid verrichten of een uitkering
      ontvangen krachtens een buitenlandse wettelijke regeling.

      4 Bij algemene maatregel van bestuur kunnen andere groepen van rechthebbenden op uitkeringen of pensioenen dan
      bedoeld in het eerste lid worden aangewezen die de verzekering op grond van deze wet vrijwillig kunnen voortzetten,
      dan wel kan daarbij worden bepaald dat de echtgenoot van een persoon als bedoeld in het eerste lid of in dit lid
      deze verzekering vrijwillig kan voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
