  - number: '10'
    text: |-
      1 De verzekerde die zijn aanspraak op zorg tot gelding wil brengen, wendt zich daartoe tot een persoon of een
      instelling naar eigen keuze, met wie of met welke het uitvoeringsorgaan waarbij hij is ingeschreven tot dat doel
      een overeenkomst als bedoeld in [artikel 42][ref1] heeft gesloten.

      2 In afwijking van het eerste lid kan een uitvoeringsorgaan een verzekerde die een aanspraak op zorg tot gelding
      kan brengen toestemming verlenen zich voor deze zorg tot een niet door het uitvoeringsorgaan gecontracteerde
      persoon of instelling te wenden. In dit geval heeft de verzekerde in plaats van aanspraak op deze zorg, aanspraak
      op gehele of gedeeltelijke vergoeding van de voor deze zorg gemaakte kosten.

      3 Bij ministeriële regeling:

      a. wordt bepaald in welke gevallen en onder welke voorwaarden de verzekerde voor het verkrijgen van een aanspraak
      op vergoeding als bedoeld in het tweede lid, geen toestemming van het uitvoeringsorgaan behoeft;

      b. wordt de hoogte van de vergoeding bepaald, waarbij deze voor verschillende gevallen verschillend kan worden
      vastgesteld;

      c. kunnen voorwaarden worden bepaald waaraan de verzekerde moet voldoen, wil toestemming kunnen worden verleend;

      d. kan worden bepaald in welke gevallen geen toestemming wordt verleend.

      4 In de overeenkomsten, bedoeld in het eerste lid, kan worden bepaald dat verzekerden, om hun aanspraak op zorg tot
      gelding te brengen, door het uitvoeringsorgaan ingeschreven moeten zijn op naam van een persoon of instelling als
      bedoeld in het eerste lid. Tevens kunnen daarin bepalingen worden opgenomen ter beperking van het aantal ten name
      van een persoon of instelling in te schrijven verzekerden. Bij reglement van het uitvoeringsorgaan kan het aantal
      overschrijvingen van een verzekerde in een bepaald tijdvak aan een maximum worden gebonden en kunnen regels worden
      gesteld betreffende de tijdstippen van overschrijving.

      5 De in het eerste lid genoemde verplichting, zich te wenden tot een door het uitvoeringsorgaan gecontracteerde
      persoon of instelling, geldt niet voor de zorg, bedoeld in [artikel 6, vijfde lid][ref2].

      6 Het verlenen van zorg, bedoeld in [artikel 6, vijfde lid][ref3], geschiedt overeenkomstig hetgeen daarover elders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
