  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel2
  - number: '3'
    text: >-
      1 Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.


      2 Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke in Nederland hun thuishaven hebben,
      ten opzichte van de bemanning als deel van Nederland beschouwd.


      3 Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      de Nederlandse Antillen, Aruba of op het grondgebied van een andere Mogendheid te hebben gewoond, wordt ook voor de
      duur van zijn afwezigheid geacht in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel3
  - number: '4'
    text: >-
      In de uitvoering van de in deze wet geregelde verzekering wordt, voor zover bij of krachtens deze wet niet anders
      is bepaald, voorzien door de uitvoeringsorganen en het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel4
  - number: '5'
    text: |-
      1 Verzekerd overeenkomstig de bepalingen van deze wet is degene, die:

      a. ingezetene is;

      b. geen ingezetene is, doch ter zake van in Nederland in dienstbetrekking verrichte arbeid aan de loonbelasting
      is onderworpen.

      2 In afwijking van het eerste lid zijn vreemdelingen die niet rechtmatig in Nederland verblijf genieten als bedoeld
      in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], niet verzekerd.

      3 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden. In die algemene maatregel van bestuur kan aan het College
      zorgverzekeringen worden opgedragen op een aanvraag van een belanghebbende die bij de algemene maatregel van
      bestuur van de verzekering ingevolge deze wet is uitgezonderd, een verklaring af te geven dat hij niet verzekerd
      is.

      4 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding
      worden gegeven aan de kring der verzekerden voor zover het betreft:

      a. vreemdelingen die rechtmatig in Nederland arbeid verrichten dan wel hebben verricht;

      b. vreemdelingen die, na in Nederland rechtmatig verblijf te hebben genoten als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2], tijdig toelating in aansluiting op dat
      verblijf hebben aangevraagd, dan wel bezwaar hebben gemaakt of beroep hebben ingesteld tegen de intrekking van het
      besluit tot toelating, totdat op die aanvraag, dat bezwaar of dat beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5a
    text: >-
      1 Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of de kosten daarvan vervalt met
      ingang van de dag waarop en voor zover voor een verzekerde ingevolge deze wet uit deze wet aanspraken voortvloeien
      gelijkwaardig aan die, welke aan genoemde overeenkomst kunnen worden ontleend.


      2 Een ziektekostenverzekeraar verlaagt voor alle verzekerden in gelijke mate en naar rato van het vervallen
      gedeelte van de in het eerste lid bedoelde overeenkomsten de tarieven van gesloten en nieuw af te sluiten
      ziektekostenverzekeringsovereenkomsten.


      3 De premie, welke degene wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk is
      vervallen, heeft vooruitbetaald, wordt door de ziektekostenverzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 percent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel5a
  - number: 5b
    text: |-
      Zo nodig in afwijking van [artikel 5][ref1] en de daarop berustende bepalingen:

      a. wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;

      b. wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '5'
        hoofdstuk: II
  - number: '6'
    text: >-
      1 De verzekerden hebben aanspraak op zorg ter voorkoming van ziekten en ter voorziening in hun geneeskundige
      behandeling, verpleging en verzorging.


      Tot deze zorg behoren voorzieningen tot behoud, herstel of ter bevordering van de arbeidsgeschiktheid of strekkende
      tot verbetering van levensomstandigheden, alsmede maatschappelijke dienstverlening.


      2 Bij of krachtens algemene maatregel van bestuur worden aard, inhoud en omvang van de zorg waarop aanspraak
      bestaat, geregeld, en kunnen voor het tot gelding brengen van de aanspraken voorwaarden worden gesteld.


      3 De uitvoeringsorganen dragen er zorg voor dat de bij hen ingeschreven verzekerden hun aanspraken op zorg tot
      gelding kunnen brengen.


      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de aanspraak op zorg slechts tot gelding
      kan worden gebracht indien de verzekerde bijdraagt in de kosten daarvan. De bijdrage kan verschillen naar gelang de
      groep waartoe de verzekerde behoort en de zorg die verstrekt wordt, en kan mede afhankelijk gesteld worden van het
      inkomen van de verzekerde en diens echtgenoot.


      5 Het derde lid is niet van toepassing met betrekking tot het verlenen van zorg onder verantwoordelijkheid,
      waaronder begrepen de financiële verantwoordelijkheid, van Onze Minister van Justitie in het kader van de
      uitvoering van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel6
  - number: '7'
    text: >-
      1 Voor militairen in werkelijke dienst treden de aanspraken inzake geneeskundige verzorging door of vanwege de
      Militair Geneeskundige Dienst in de plaats van de aanspraken krachtens deze wet.


      2 Bij of krachtens algemene maatregel van bestuur wordt een regeling getroffen voor de verzekerden die, onder
      voorwaarden en regelen te stellen door Onze Minister van Defensie, als gezinslid van een militair aanspraak
      hebben op geneeskundige behandeling, verpleging en verzorging of een tegemoetkoming in de kosten daarvan jegens
      Onze Minister van Defensie. Bij deze algemene maatregel van bestuur kan worden bepaald, dat voor de betrokken
      verzekerden de aanspraken, voortvloeiende uit de desbetreffende van Onze Minister van Defensie uitgaande regeling
      in de plaats treden van de aanspraken krachtens deze wet.


      3 Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur worden regelen gesteld inzake
      een uitkering door het College zorgverzekeringen aan Onze Minister van Defensie ten laste van het Algemeen Fonds
      Bijzondere Ziektekosten in verband met het vervallen van de aanspraken ingevolge deze wet.


      4 Al hetgeen de verdere uitvoering van dit artikel betreft wordt bij of krachtens algemene maatregel van bestuur
      geregeld. Daarbij kan tevens de controle worden geregeld op het verlenen van zorg ingevolge de aanspraken bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel7
  - number: '8'
    text: |-
      1 Een instelling die zorg als bedoeld in [artikel 6][ref1] verleent, moet als zodanig zijn toegelaten.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een instelling, behorende tot een bij de maatregel aan
      te wijzen categorie van instellingen, voor de toepassing van deze wet als toegelaten wordt aangemerkt.

      3 Het College zorgverzekeringen beslist op aanvragen om toelating.

      4 Bij of krachtens algemene maatregel van bestuur kan de aard van de te leveren gegevens worden bepaald, alsmede de
      wijze waarop en de termijn waarbinnen de aanlevering van deze gegevens geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 8b
    text: |-
      Een toelating wordt geweigerd:

      a. met betrekking tot instellingen die een ziekenhuisvoorziening in de zin van de
      [Wet ziekenhuisvoorzieningen][ref1] in stand houden: voor zover de instelling niet voldoet aan de ingevolge die wet
      geldende voorschriften inzake spreiding en behoefte;

      b. met betrekking tot de overige instellingen: voor zover de instelling niet voldoet aan de door Onze Minister vast
      te stellen voorschriften inzake spreiding en behoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: 8d
    text: >-
      1 Instellingen, aangewezen door Onze Minister, in overeenstemming met hetzij Onze Minister van Justitie, hetzij
      Onze Minister van Defensie, worden beschouwd als instellingen in de zin van deze wet.


      2 Academische ziekenhuizen worden beschouwd als instellingen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8d
  - number: 8e
    text: >-
      Indien bij de aanvraag tot toelating gegevens over de omvang van de te verlenen zorg of de werkwijze van de
      instelling zijn verstrekt, verricht de instelling zijn werkzaamheden volgens die gegevens, behoudens voor zover bij
      de toelating anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8e
  - number: 8f
    text: |-
      Een toelating wordt ingetrokken:

      a. voor zover de instelling niet meer voldoet aan de voorschriften, bedoeld in [artikel 8b, onder a en b][ref1];

      b. indien de instelling in strijd handelt met [artikel 8e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel8e
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 8b
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 8e
        hoofdstuk: III
  - number: 8g
    text: >-
      Een toegelaten instelling is verplicht, voor zover het College zorgverzekeringen zulks voor de toepassing van deze
      paragraaf behoeft, deze alle gevraagde mondeling en schriftelijke inlichtingen en gegevens te verstrekken en inzage
      te geven van boeken en bescheiden, welke betrekking hebben op het gevoerde beheer en de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8g
  - number: 8h
    text: |-
      Indien een maatregel als bedoeld in [artikel 18][ref1] is getroffen, wordt de toelating geacht dienovereenkomstig
      te zijn gewijzigd dan wel ingetrokken. In afwijking van [artikel 62][ref2] kan ter zake geen voorziening worden
      gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel62
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel8h
    references:
      - id: ref1
        bwb_id: BWBR0002753
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '62'
        hoofdstuk: IX
  - number: '9'
    text: |-
      1 Voor degene, die verzekerd is in de zin van de [Ziekenfondswet][ref1] en als zodanig bij een ziekenfonds is
      ingeschreven, dan wel in verband met zijn geneeskundige verzorging verzekerd is bij een ziektekostenverzekeraar,
      geldt met inachtneming van hetgeen overigens in dit artikel is bepaald de inschrijving bij het ziekenfonds,
      onderscheidenlijk de verzekering bij de ziektekostenverzekeraars, tevens als inschrijving voor de toepassing van
      deze wet. Voor degene, die deelnemer is aan een publiekrechtelijke ziektekostenregeling voor ambtenaren geldt het
      deelnemerschap tevens als inschrijving voor de toepassing van deze wet.

      2 Degene, die noch bij een ziekenfonds is ingeschreven noch bij een ziektekostenverzekeraar is verzekerd
      noch deelneemt aan een publiekrechtelijke ziektekostenregeling voor ambtenaren, doch die als verzekerde in
      de zin van deze wet de aanspraken, welke hem ingevolge deze wet toekomen, geldend wil maken, meldt zich met
      inachtneming van het krachtens het derde lid bepaalde daartoe aan, hetzij bij een ziekenfonds dan wel bij een
      ziektekostenverzekeraar, werkende in de gemeente of het deel van de gemeente waar hij woont. Deze zijn verplicht
      hem voor dit doel als verzekerde in te schrijven.

      3 Bij of krachtens algemene maatregel van bestuur kunnen betreffende de inschrijving nadere en zonodig van deze wet
      afwijkende regels worden gesteld.

      4 Onverminderd het eerste en tweede lid komt voor degene, die vrijwillig verzekerde is ingevolge
      [artikel 32a][ref2], de inschrijving eerst tot stand nadat hij de beschikking, bedoeld in
      [artikel 32b, derde lid][ref3], heeft overgelegd.

      5 Het uitvoeringsorgaan waarbij betrokkene wordt ingeschreven, stelt de Sociale verzekeringsbank terstond van de
      inschrijving in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel9
    references:
