  - number: 32c
    text: |-
      1 De vrijwillige verzekering ingevolge [artikel 32a][ref1] eindigt:

      a) met ingang van de dag, waarop betrokkene niet langer voldoet aan de in [artikel 32a][ref2] gestelde voorwaarden;

      b) met ingang van de eerste dag van de tweede maand volgend op die waarin de Sociale verzekeringsbank een
      schriftelijke opzegging van de verzekerde heeft ontvangen;

      c) met ingang van de dag, waarop de betrokkene van rechtswege verzekerd wordt ingevolge [artikel 5][ref3];

      d) met ingang van de dag, volgend op de laatste dag van de door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de premie, bedoeld in [artikel 25 van de Wet financiering volksverzekeringen][ref4], uiterlijk moet zijn
      betaald indien die betaling niet heeft plaatsgevonden;

      e) met ingang van de dag volgend op de laatste dag van de door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de voor de uitvoering van de vrijwillige verzekering verlangde gegevens moeten zijn verstrekt indien die
      gegevens niet zijn verstrekt.

      2 De Sociale verzekeringsbank en het uitvoeringsorgaan waarbij betrokkene is ingeschreven, stellen elkaar over en
      weer terstond in kennis van het einde van de vrijwillige verzekering.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de beëindiging van de
      vrijwillige verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004538#Artikel25
