  - number: '40'
    text: |-
      [Artikel 1x7 van de Ziekenfondswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x7
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x7
  - number: 40a
    text: |-
      1 In de administratie van de uitvoeringsorganen ter zake van de uitvoering
      van deze wet wordt het sociaal-fiscaalnummer van de verzekerde, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1], opgenomen, tenzij aan de
      verzekerde geen sociaal-fiscaalnummer is bekendgemaakt.

      2 Bij de verstrekking van gegevens door uitvoeringsorganen en de in de [artikelen 56][ref2] en [57][ref3] genoemde
      organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      personen en instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel57
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel40a
    references:
      - id: ref1
