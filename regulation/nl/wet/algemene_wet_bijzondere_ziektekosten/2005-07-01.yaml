  - number: 9c
    text: |-
      1 De verzekerde is verplicht desgevraagd aan het uitvoeringsorgaan, waarbij hij zich aanmeldt
      onderscheidenlijk waarbij hij is ingeschreven of waaraan hij deelneemt, een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      2 Het uitvoeringsorgaan stelt voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet
      de identiteit vast van de persoon bedoeld in het eerste lid aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] en neemt daarvan aard en nummer op in de administratie.

      3 Het uitvoeringsorgaan verlangt van de vreemdeling die zich als verzekerde aanmeldt een kopie van het document
      of de schriftelijke verklaring bedoeld in [artikel 9, tweede lid, van de Vreemdelingenwet 2000][ref3], dat wordt
      aangemerkt als een bescheid als bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
