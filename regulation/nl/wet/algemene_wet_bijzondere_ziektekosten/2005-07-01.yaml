        artikel: '56'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '56'
        hoofdstuk: VIII
  - number: '58'
    text: |-
      1 Een beslissing van een uitvoeringsorgaan of een indicatieorgaan als bedoeld in [artikel 9a, eerste lid][ref1],
      op bezwaar inzake een aanspraak op zorg of op een vergoeding ingevolge deze wet wordt niet genomen dan nadat
      daaromtrent door het College zorgverzekeringen op verzoek van het bestuursorgaan advies is uitgebracht.

      2 Het eerste lid is niet van toepassing voor zover het bezwaarschrift betrekking heeft op een ingevolge het
      bepaalde krachtens deze wet verschuldigde bijdrage, waarvan de hoogte niet afhankelijk is van een medisch oordeel.

      3 Het eerste lid is niet van toepassing indien:

      a. het bezwaar kennelijk niet-ontvankelijk is,

      b. aan het bezwaar volledig tegemoet wordt gekomen, of

      c. het College zorgverzekeringen geen advies heeft uitgebracht binnen de in het vierde lid genoemde termijn of
      heeft medegedeeld geen advies te zullen uitbrengen.

      4 Het College zorgverzekeringen brengt een advies als bedoeld in het eerste lid uit binnen tien weken na ontvangst
      van alle gegevens en bescheiden die voor de beoordeling van het verzoek noodzakelijk zijn, en zendt gelijktijdig
      afschrift daarvan aan de belanghebbende.

      5 Indien het College zorgverzekeringen is verzocht advies uit te brengen, wordt de beslissing op bezwaar in
      afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2] genomen binnen een en twintig
      weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel58
