  - number: '48'
    text: |-
      De Rijksbelastingdienst biedt jaarlijks voor 1 november een verklaring aan het College zorgverzekeringen
      aan omtrent de rechtmatigheid van ontvangsten over het afgelopen kalenderjaar betreffende de ingevolge de
      [Wet financiering volksverzekeringen][ref1] geheven premies Algemene Wet Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004538
  - number: '49'
    text: >-
      1 Het College zorgverzekeringen is tegenover personen of instellingen, die ter zake van aan verzekerden verleende
      zorg op grond van deze wet vorderingen hebben op een ziekenfonds of een ziektekostenverzekeraar, aansprakelijk voor
      de betaling daarvan, wanneer dat ziekenfonds of die ziektekostenverzekeraar verkeert in de toestand, dat hij heeft
      opgehouden te betalen.


      2 Het Rijk is tegenover het College zorgverzekeringen aansprakelijk voor de betalingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel49
  - number: '56'
    text: >-
      1 Een ieder verstrekt op verzoek aan het College zorgverzekeringen, het College toezicht, Onze Minister van
      Sociale Zaken en Werkgelegenheid, het Uitvoeringsinstituut werknemersverzekeringen, genoemd in hoofdstuk 5 van
      de Wet structuur uitvoeringsorganisatie werk en inkomen, de Sociale verzekeringsbank, genoemd in hoofdstuk 6
      van de Wet structuur uitvoeringsorganisatie werk en inkomen, de Rijksbelastingdienst, het gemeentebestuur, de
      uitvoeringsorganen en de indicatieorganen, bedoeld in artikel 9a, eerste lid, of aan een daartoe door of vanwege
      een van deze instanties aangewezen persoon kosteloos alle gegevens en inlichtingen die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende instantie.


      2 De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm, of in
      een andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het
      in het eerste lid bedoelde verzoek.


      3 Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel56
  - number: '57'
    text: |-
      1 De in [artikel 56, eerste lid][ref1], bedoelde instanties zijn bevoegd uit eigen beweging en verplicht op verzoek
      uit de onder hun verantwoordelijkheid gevoerde administratie, aan elkaar of aan een daartoe door of vanwege een
      van deze instanties aangewezen persoon de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze
      wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of krachtens wet anders is bepaald.

      2 Publiekrechtelijke lichamen zijn verplicht hun medewerking te verlenen bij het verkrijgen van inlichtingen,
      benodigd voor de uitvoering van deze wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of
      krachtens wet anders is bepaald.

      Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regelen stellen met betrekking
      tot de wijze waarop en de vorm waarin de inlichtingen worden verstrekt.

      3 Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een
      in [artikel 56, eerste lid][ref2], bedoelde instantie de door deze gevraagde uittreksels uit de registers kosteloos
      toe te zenden.

      4 Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      het College zorgverzekeringen, aan het College toezicht en aan de ziekenfondsen alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel56
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel57
    references:
      - id: ref1
