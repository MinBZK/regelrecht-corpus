  - number: 9a
    text: >-
      1 Burgemeester en wethouders voorzien erin dat in hun gemeente ten behoeve van de inwoners een onafhankelijk
      indicatieorgaan werkzaam is, dat kosteloos besluit of een inwoner is aangewezen op een van de bij algemene
      maatregel van bestuur aangewezen vormen van zorg.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de samenstelling en de
      werkwijze van het indicatieorgaan, alsmede over de geldigheidsduur van besluiten als bedoeld in het eerste lid.


      3 Een indicatieorgaan verricht geen andere dan bij of krachtens de wet opgedragen taken.


      4 Bij of krachtens algemene maatregel van bestuur kunnen aan indicatieorganen werkzaamheden worden opgedragen die
      verband houden met de taken die bij de wet zijn opgedragen. Burgemeester en wethouders kunnen het indicatieorgaan
      advies vragen omtrent toekenning van voorzieningen waarbij de gezondheid of het maatschappelijk functioneren van
      een persoon van belang is.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel9a
  - number: 9b
    text: |-
      1 Aanspraak op zorg, aangewezen ingevolge [artikel 9a, eerste lid][ref1], bestaat slechts indien en gedurende de
      periode waarvoor het bevoegde indicatieorgaan op een door de verzekerde ingediende aanvraag heeft besloten dat deze
      naar aard, inhoud en omvang op die zorg is aangewezen.

      2 In afwijking van het eerste lid worden er bij algemene maatregel van bestuur regels gesteld voor gevallen waarin
      het besluit niet afgewacht kan worden.

      3 De aanspraak op andere vormen van zorg dan die zijn aangewezen ingevolge [artikel 9a, eerste lid][ref2], kan
      slechts tot gelding worden gebracht voor zover de verzekerde, gelet op zijn behoefte en uit een oogpunt van
      doelmatige zorgverlening, daarop naar aard, inhoud en omvang redelijkerwijs is aangewezen. Bij of krachtens
      algemene maatregel van bestuur kan worden geregeld door wie en op welke wijze wordt beoordeeld of de verzekerde
      aangewezen is op een bepaalde vorm van zorg. Deze regels zijn zodanig dat wordt gewaarborgd dat de beoordeling
      onafhankelijk geschiedt.

      4 In afwijking van het eerste tot en met derde lid hebben cliënten als bedoeld in
      [artikel 1, onder d, van de Wet op de jeugdzorg][ref3] slechts aanspraak op zorg aangewezen krachtens
      [artikel 5, tweede lid, onder b en c, van die wet][ref4], indien de stichting die werkzaam is in de provincie
      waar de betrokken jeugdige duurzaam verblijft een besluit heeft genomen waaruit blijkt dat die cliënt op die zorg
      is aangewezen. De regels gesteld krachtens [artikel 3, vijfde lid, van de Wet op de jeugdzorg][ref5] zijn van
      toepassing.

      5 Het vierde lid is niet van toepassing ten aanzien van zorg als bedoeld in
      [artikel 5, tweede lid, onder b, van de Wet op de jeugdzorg][ref6], met betrekking tot een jeugdige van wie een
      beroepsbeoefenaar, behorende tot een bij of krachtens algemene maatregel van bestuur aangewezen beroepsgroep
      of een daarmee in die maatregel gelijkgestelde behandelaar, een redelijk vermoeden heeft dat bij de jeugdige
      sprake is van een bij of krachtens die maatregel aangewezen psychische stoornis van een bij die maatregel
      aan te geven ernst en tevens het vermoeden heeft dat de jeugdige, zijn ouders, stiefouders of anderen die de
      jeugdige als behorende tot hun gezin verzorgen en opvoeden, niet zijn aangewezen op jeugdzorg waarop aanspraak
      bestaat op grond van de [Wet op de jeugdzorg][ref7] of de [Beginselenwet justitiële jeugdinrichtingen][ref8].
      Bij de maatregel, bedoeld in de eerste volzin, worden tevens regels gesteld omtrent de informatie die de
      beroepsbeoefenaar in een geval als bedoeld in die volzin verstrekt aan de betrokken stichting, bedoeld in
      [artikel 1, onder f, van de Wet op de jeugdzorg][ref9].


