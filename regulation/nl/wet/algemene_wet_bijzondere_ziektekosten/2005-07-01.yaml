  - number: '62'
    text: |-
      Een belanghebbende kan tegen ingevolge deze wet genomen besluiten, niet zijnde besluiten als bedoeld in
      [artikel 8:2 van de Algemene wet bestuursrecht][ref1], van Onze Minister, het College zorgverzekeringen en
      van het College toezicht, beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. De
      eerste volzin geldt niet ten aanzien van een besluit van het bestuur van College zorgverzekeringen krachtens
      [artikel 5, derde lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel82
