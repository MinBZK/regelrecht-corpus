  - number: 12a
    text: |-
      1 Indien een uitvoeringsorgaan in de onmogelijkheid verkeert op voor hem aanvaardbare voorwaarden met een
      genoegzaam aantal personen of instellingen ter zake van een of meer vormen van zorg overeenkomsten als bedoeld
      in [artikel 42][ref1] te sluiten, kan bij ministeriële regeling worden bepaald dat de bij het uitvoeringsorgaan
      ingeschreven verzekerden tijdelijk in plaats van aanspraak op deze zorg, jegens hun uitvoeringsorgaan aanspraak
      hebben op vergoeding van de voor deze zorg gemaakte kosten.

      2 In de ministeriële regeling wordt tevens bepaald onder welke voorwaarden en tot welk bedrag aanspraak op
      vergoeding bestaat en kunnen nadere regels voor de aanspraak op een vergoeding worden gesteld.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing indien een vorm van zorg is aangewezen in
      een algemene maatregel van bestuur als bedoeld in [artikel 12, eerste lid][ref2], zonder dat van de in het
      [vierde lid van dat artikel][ref3] bedoelde mogelijkheid gebruik is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel12
