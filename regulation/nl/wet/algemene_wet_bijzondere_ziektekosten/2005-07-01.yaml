        artikel: '57'
        hoofdstuk: VIII
  - number: '41'
    text: |-
      1 Het is een ziektekostenverzekeraar en een uitvoerend orgaan verboden zelf diensten of zaken te leveren, welke
      behoren tot de zorg, bedoeld in [artikel 6][ref1].

      2 Het in het eerste lid bedoelde verbod geldt niet ten aanzien van het in gebruik geven van medische hulpmiddelen.

      3 Het is een ziektekostenverzekeraar en een uitvoerend orgaan verboden aan een instelling in de zin van deze wet
      gelden voor bedrijfsuitoefening te verschaffen, zich als borg of hoofdelijk medeschuldenaar voor die instelling
      te verbinden, zich voor die instelling sterk te maken, zich tot zekerheid voor een schuld van die instelling te
      verbinden, dan wel aan die instelling bestuurlijk deel te nemen.

      4 De in het eerste en derde lid bedoelde verboden gelden niet in door het College zorgverzekeringen aan te geven
      gevallen. Het College zorgverzekeringen kan ontheffing van het bepaalde in het eerste en derde lid verlenen in
      bijzondere gevallen.

      5 Een ontheffing ingevolge het vierde lid kan onder beperkingen worden verleend; aan de ontheffing kunnen
      voorschriften worden verbonden.

      Ook na het verlenen van een ontheffing kunnen daaraan beperkingen worden gesteld of voorschriften worden verbonden
      dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of ingetrokken.

      6 Een ontheffing kan worden ingetrokken:

      a. indien wordt gehandeld in strijd met aan de ontheffing verbonden voorschriften;

      b. indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.

      7 Van besluiten als bedoeld in het vierde, vijfde en zesde lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: 41a
    text: >-
      Het is een ziektekostenverzekeraar verboden personen als verzekerden in te schrijven die woonachtig zijn buiten
      de gemeente, gemeenten of delen daarvan, waar de rechtspersoon volgens zijn statuten zijn werkzaamheden als
      ziektekostenverzekeraar wil uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel41a
  - number: '42'
    text: |-
      1 Uitvoeringsorganen sluiten schriftelijke overeenkomsten met personen en instellingen die zorg kunnen verlenen
      waarop ingevolge [artikel 6][ref1] aanspraak bestaat.

      2 De duur van een overeenkomst bedraagt maximaal vijf jaar.

      3 Met personen en instellingen die vormen van zorg verlenen als bedoeld in [artikel 6, vijfde lid][ref2], worden
      wat deze vormen van zorg betreft geen overeenkomsten gesloten.

      4 Indien na beëindiging door het uitvoeringsorgaan van een overeenkomst voor een bepaalde vorm van zorg geen
      aansluitende overeenkomst voor die vorm van zorg met dezelfde persoon of instelling tot stand komt, behoudt de
      verzekerde zolang die zorg noodzakelijk is jegens het uitvoeringsorgaan aanspraak op ononderbroken voortzetting van
      die vorm van zorg, te verlenen door dezelfde persoon of instelling, wanneer die zorg is aangevangen voor de datum
      waarop de overeenkomst met die persoon of instelling voor die desbetreffende vorm van zorg is beëindigd.

      5 Gedurende de tijdelijke voortzetting van de zorg, bedoeld in het vierde lid, gelden tussen het uitvoeringsorgaan
      en de persoon of instelling de voorwaarden van de overeenkomst waaronder de zorg aan de in het vierde lid bedoelde
      verzekerde is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
        hoofdstuk: III
  - number: '43'
    text: >-
      1 De overeenkomsten bevatten ten minste bepalingen over:


      a. het tijdstip waarop de overeenkomst aanvangt te werken, de duur van de overeenkomst en tussentijdse beëindiging
      van de overeenkomst;


      b. de aard, de kwaliteit, de doelmatigheid en de omvang van de te verlenen zorg;


      c. de prijs van de te verlenen zorg;


      d. de wijze waarop de verzekerden van informatie worden voorzien;


      e. de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verlenen dan wel
      verleende zorg en op de juistheid van de daarvoor in rekening gebrachte bedragen;


      f. de administratieve voorwaarden die partijen bij de uitvoering van de overeenkomst in acht zullen nemen.


      2 Bij algemene maatregel van bestuur kunnen nadere regels over de inhoud van de overeenkomsten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel43
  - number: '44'
    text: |-
      Overeenkomsten die in strijd met het bij of krachtens de [artikelen 42][ref1] of [43][ref2] bepaalde zijn gesloten,
      zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel43
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '43'
        hoofdstuk: VI
  - number: '45'
    text: |-
      1 Een uitvoeringsorgaan is verplicht met iedere instelling op haar verzoek een overeenkomst te sluiten als bedoeld
      in [artikel 42, eerste lid][ref1], tenzij het uitvoeringsorgaan daartegen ernstige bezwaren heeft.

      2 Voor zover een uitvoeringsorgaan een statutair omschreven werkgebied heeft, is de in het eerste lid bedoelde
      verplichting beperkt tot de instellingen die zijn gelegen binnen dit werkgebied en de instellingen waarvan de
      bevolking van dit werkgebied naar verwachting regelmatig gebruik zal maken.

      3 Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.

      4 Het College zorgverzekeringen kan bij het verlenen van een ontheffing van [artikel 41, eerste lid][ref2], bepalen
      of en in hoeverre van het gestelde in het eerste en tweede lid van dit artikel kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel41
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '42'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '41'
        hoofdstuk: V
  - number: '46'
    text: |-
      1 Een instelling als bedoeld in [artikel 1, onderdeel d, onder 1°][ref1], die met een uitvoeringsorgaan een
      overeenkomst als bedoeld in [artikel 42, eerste lid][ref2], heeft gesloten, is gehouden op daartoe door een ander
      uitvoeringsorgaan gedaan verzoek met deze een gelijke overeenkomst te sluiten, tenzij die instelling daartegen
      ernstige bedenkingen heeft.

      2 Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel46
