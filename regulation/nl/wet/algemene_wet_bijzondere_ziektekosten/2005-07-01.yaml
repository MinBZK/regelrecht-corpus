  - number: '13'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat zorg wordt voortgezet na het tijdstip
      waarop de verzekering is geëindigd of dat een aanspraak op een vergoeding bestaat voor zorg die wordt verleend na
      dat tijdstip. Daarbij kunnen beperkingen en voorwaarden worden gesteld. De wijze waarop een zodanige aanspraak tot
      gelding wordt gebracht, wordt daarbij eveneens geregeld.

      2 Bij of krachtens algemene maatregel van bestuur kan voor gevallen of omstandigheden waarin de kosten van het
      verlenen van de desbetreffende zorg in redelijkheid niet of niet volledig ten laste van de in deze wet geregelde
      verzekering dienen te komen, worden bepaald dat:

      a. de zorg wordt geweigerd;

      b. de zorg op een later tijdstip ingaat;

      c. een hogere bijdrage van de verzekerde wordt gevorderd dan krachtens [artikel 6, vierde lid][ref1], is
      vastgesteld; of

      d. een vergoeding van gemaakte kosten geheel of gedeeltelijk wordt geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel13
    references:
