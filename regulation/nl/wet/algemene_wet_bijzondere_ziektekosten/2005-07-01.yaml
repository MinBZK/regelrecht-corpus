  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen vormen van zorg worden aangewezen waarvoor een uitvoeringsorgaan bij
      reglement kan bepalen dat bij hem ingeschreven verzekerden, in afwijking van [artikel 6, eerste lid][ref1], in
      plaats van aanspraak op deze zorg, jegens hem aanspraak op vergoeding van de voor deze zorg gemaakte kosten hebben.

      2 De [artikelen 6, tweede tot en met vijfde lid][ref2], [9, tweede tot en met vijfde lid][ref3], [9b][ref4] en
      [10][ref5] zijn van overeenkomstige toepassing.

      3 Indien voor de betrokken vorm van zorg krachtens [artikel 6, vierde lid][ref6], een eigen bijdrage is
      vastgesteld, wordt de vergoeding met deze eigen bijdrage verminderd.

      4 In afwijking van het tweede lid kan bij algemene maatregel van bestuur voor een of meer van de in het eerste
      lid bedoelde vormen van zorg worden bepaald dat het uitvoeringsorgaan bevoegd is bij reglement te bepalen dat
      de in [artikel 10, eerste lid][ref7], neergelegde verplichting zich te wenden tot een door het uitvoeringsorgaan
      gecontracteerde persoon of instelling, voor bij hem ingeschreven verzekerden niet geldt.

      5 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met vierde lid nadere
      regels worden gesteld.


