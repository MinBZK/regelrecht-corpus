  - number: 32b
    text: |-
      1 Aanmelding voor de vrijwillige verzekering geschiedt uiterlijk twaalf maanden na de dag, waarop de verzekering
      ingevolge [artikel 5][ref1] is geëindigd, bij de Sociale verzekeringsbank.

      2 De vrijwillige verzekering ingevolge [artikel 32a][ref2] gaat in op de dag volgend op die waarop de verzekering
      ingevolge [artikel 5][ref3] is geëindigd.

      3 De Sociale verzekeringsbank verstrekt bij beschikking aan de persoon, die voldoet aan de in dit hoofdstuk
      gestelde voorwaarden, een verklaring waaruit blijkt dat betrokkene is verzekerd ingevolge [artikel 32a][ref4] en
      vanaf welke datum.

      4 Degene, die vrijwillig is verzekerd ingevolge [artikel 32a][ref5] is verplicht aan de Sociale verzekeringsbank de
      gegevens te verschaffen die deze behoeft voor de vaststelling van de premie voor de vrijwillige verzekering. Tevens
      is hij verplicht de Sociale verzekeringsbank en het uitvoeringsorgaan op verzoek of onverwijld uit eigen beweging
      alle feiten en omstandigheden mee te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op de rechten en verplichtingen voortvloeiend uit de vrijwillige verzekering.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanmelding voor de vrijwillige verzekering
      en de te verschaffen gegevens en inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel32a
