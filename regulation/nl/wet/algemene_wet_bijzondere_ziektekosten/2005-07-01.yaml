  - number: '15'
    text: >-
      Een uitvoeringsorgaan is verplicht zijn werkzaamheden op een doelmatige wijze uit te voeren. Het treft de nodige
      maatregelen ter voorkoming van onnodige verstrekking van zorg en van uitgaven, welke hoger dan noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002614/2005-07-01#Artikel15
  - number: '16'
    text: |-
      1 Ten aanzien van het verlenen van bij algemene maatregel van bestuur aan te wijzen zorg, bedoeld in
      [artikel 6][ref1], kan bij algemene maatregel van bestuur worden bepaald, dat de administratie geheel of ten dele
      wordt verricht door een of meer door Onze Minister aan te wijzen rechtspersonen en dat de controle geheel of ten
      dele wordt uitgeoefend door een of meer door Onze Minister aan te wijzen rechtspersonen.

      Daarbij wordt tevens bepaald, volgens welke regels en onder wiens verantwoordelijkheid in zodanig geval de
      administratie wordt verricht en de controle wordt uitgeoefend, alsmede op welke wijze de kosten hiervan worden
      gedekt uit het Algemeen Fonds Bijzondere Ziektekosten.

      2 Controle op het verlenen van zorg als bedoeld in [artikel 6, vijfde lid][ref2], wordt geregeld bij ministeriële
      regeling, in overeenstemming met Onze Minister van Justitie.

      3 Bij de in [artikel 6, vierde lid][ref3], bedoelde maatregel wordt nader bepaald of en in welke mate wordt
      afgeweken van het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
