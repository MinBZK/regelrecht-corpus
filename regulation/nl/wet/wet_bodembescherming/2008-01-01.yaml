        paragraaf: '3'
  - number: 39b
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot bij ministeriële
      regeling aan te wijzen categorieën van uniforme saneringen bestaande uit eenvoudige, gelijksoortige saneringen
      van korte duur. De sanering kan betrekking hebben op slechts een gedeelte van het geval van verontreiniging. Bij
      de aanwijzing van de categorieën wordt aangegeven welke categorieën tevens of uitsluitend betrekking hebben op
      sanering van de bodem onder oppervlaktewater als bedoeld in de [artikelen 63a][ref1] en [63d][ref2].

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid, bevat in ieder geval regels omtrent:

      a. het onderzoek dat aan de sanering vooraf gaat;

      b. de gegevens die bij de melding, bedoeld in [artikel 28][ref3], moeten worden verstrekt waarbij van
      [artikel 28, tweede lid][ref4], kan worden afgeweken, alsmede de wijze waarop die gegevens worden verstrekt;

      c. de gegevens die degene die saneert tijdens de sanering aan gedeputeerde staten moet verstrekken en de wijze en
      het tijdstip waarop dat gebeurt;

      d. de aanpak en wijze van sanering waaronder begrepen aanvang, duur en afronding van de sanering.

      3 Degene die voornemens is te saneren overeenkomstig de regels gesteld krachtens het eerste lid, maakt dat
      voornemen kenbaar bij de melding, bedoeld in artikel 28. Gedeputeerde staten geven in dat geval uitvoering aan
      [artikel 28, vijfde lid][ref5], uiterlijk twee weken na ontvangst van de melding.

      4 Met de sanering kan met inachtneming van de regels gesteld krachtens het eerste lid worden begonnen nadat vijf
      weken zijn verstreken vanaf de datum van ontvangst van de melding, bedoeld in [artikel 28][ref6], door gedeputeerde
      staten. In bij algemene maatregel van bestuur aangegeven omstandigheden kan bij die maatregel een kortere termijn
      dan vijf weken worden gesteld. De melding vervalt indien niet met de sanering wordt begonnen binnen een bij
      algemene maatregel van bestuur gestelde termijn.

      5 De [artikelen 29][ref7], [37][ref8], [39][ref9], [39a][ref10] en [40][ref11] zijn niet van toepassing indien
      de sanering wordt gemeld en vervolgens wordt uitgevoerd overeenkomstig de regels gesteld bij of krachtens het
      eerste, derde en vierde lid. Bij een algemene maatregel van bestuur als bedoeld in het eerste lid, kan van de
      [artikelen 39c][ref12] en [39d][ref13] worden afgeweken.


