  - number: '91'
    text: |-
      1 De voordracht voor een algemene maatregel van bestuur krachtens deze wet, die betrekking heeft op handelingen
      waarbij uit landbouwkundig oogpunt stoffen op of in de bodem worden gebracht, wordt Ons gedaan door Onze Minister
      van Landbouw, Natuur en Voedselkwaliteit en Onze Minister gezamenlijk; de voordracht voor een algemene maatregel
      van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister en Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit gezamenlijk, voor zover de maatregel in belangrijke mate mede betrekking heeft op handelingen die
      van invloed kunnen zijn op het agrarisch produktievermogen van de bodem dan wel op handelingen die van belang zijn
      met het oog op de bescherming van natuur en landschap.

      2 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 36][ref1] wordt Ons gedaan door Onze
      Minister en Onze Minister van Verkeer en Waterstaat gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel36
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel91
