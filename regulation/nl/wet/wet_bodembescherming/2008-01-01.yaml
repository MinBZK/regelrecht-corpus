        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '70'
        hoofdstuk: VI
  - number: '72'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in daarbij aan te wijzen categorieën van gevallen de
      rechthebbende op een grondgebied waar een handeling is of wordt verricht waardoor de bodem kan worden verontreinigd
      of aangetast, is verplicht tot het verrichten van bij die maatregel aangegeven onderzoek met betrekking tot de
      kwaliteit van de bodem, alsmede tot het overleggen van de resultaten van dat onderzoek aan bij die maatregel
      aangewezen bestuursorganen. Artikel 71 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel72
  - number: '73'
    text: |-
      De schade ten gevolge van een onderzoek als bedoeld in [artikel 70][ref1] onderscheidenlijk [artikel 71][ref2],
      wordt vergoed door het gezag dat de verplichting tot het gedogen van dat onderzoek heeft opgelegd,
      onderscheidenlijk door degene op wiens verzoek een zodanige verplichting is opgelegd. De vordering tot
      schadevergoeding staat ter kennisneming van het gerecht binnen het rechtsgebied waarvan het onderzoek is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel71
