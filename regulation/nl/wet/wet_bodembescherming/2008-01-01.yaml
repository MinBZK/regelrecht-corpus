  - number: '48'
    text: |-
      Gedeputeerde staten zijn belast met het oriënterend onderzoek en het nader onderzoek in hun provincie alsmede met
      het saneringsonderzoek en de sanering van in hun provincie gelegen gevallen van ernstige verontreiniging voor zover
      daarin niet is voorzien op de wijze, bedoeld in [de artikelen 13][ref1], [27][ref2], [28][ref3], [43][ref4] tot en
      met [47][ref5] of [72][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel13
