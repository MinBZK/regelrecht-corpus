        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '33'
    text: |-
      1 De burgemeester van een gemeente waar zich een verontreiniging of een aantasting als bedoeld in
      [artikel 30][ref1] voordoet dan wel de directe gevolgen daarvan zich voordoen, en de inspecteur kunnen gedeputeerde
      staten onderscheidenlijk Onze commissaris verzoeken aan de in [artikel 30][ref2] bedoelde maatregelen toepassing
      te geven.

      2 Van de beschikking, houdende de beslissing op zodanig verzoek, wordt tevens mededeling gedaan aan de andere in
      het eerste lid genoemde instantie die kan verzoeken toepassing aan de in [artikel 30][ref3] bedoelde maatregelen
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel30
