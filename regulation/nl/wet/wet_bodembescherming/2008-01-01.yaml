  - number: '76'
    text: |-
      Onze Minister kan aan provincies budget verlenen voor een periode van vijf jaar ter financiering van het onderzoek
      van onderzoeksgevallen, het saneringsonderzoek en de sanering van gevallen van ernstige verontreiniging.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76
  - number: 76a
    text: |-
      1 Voorafgaand aan een budgetperiode geeft Onze Minister een indicatie van de hoogte van het budget per provincie.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de in het eerste lid, bedoelde
      indicatie.

      3 Naast de in het eerste lid bedoelde indicatief aangegeven budgetten kan Onze Minister eveneens budget aan
      provincies ter beschikking stellen ten behoeve van de in [artikel 76][ref1] genoemde doelstellingen, indien het
      betreft bijzondere gevallen van ernstige verontreiniging en financiering niet of niet geheel uit de indicatief
      aangegeven budgetten zal plaatsvinden. [Artikel 76b, tweede volzin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76a
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '76'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 76a
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76b
    text: |-
      Naast het in [artikel 76][ref1] genoemde budget, kan Onze minister een aanvullende vergoeding toekennen voor
      apparaatskosten en andere niet-projectgebonden kosten die betrekking hebben op de bodemsanering en niet uit het
      budget mogen worden voldaan. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter zake
      van deze kosten en ter zake van de toekenning daarvan, waarbij de [artikelen 76c tot en met 76iii ][ref2]geheel of
      ten dele van overeenkomstige toepassing kunnen worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76c
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76b
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '76'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 76c
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76c
    text: |-
      1 Een aanvraag tot verlening van het budget wordt voorafgaand aan de budgetperiode gedaan en gaat vergezeld van
      een programma waarin de doelstellingen voor de bodemsanering worden aangegeven en inzicht wordt gegeven in de
      aard en de omvang van de activiteiten tegen de achtergrond van die doelstellingen en in de kosten en de wijze van
      financiering van het programma. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter
      zake van het bepaalde in de eerste volzin.

      2 Tenzij het een in [artikel 88, eerste lid][ref1], bedoelde gemeente betreft, beslist Onze Minister niet op een
      aanvraag van een gemeente dan nadat hij gedeputeerde staten van de betrokken provincie gedurende tenminste vier
      weken in de gelegenheid heeft gesteld hem van advies te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '88'
        hoofdstuk: IX
  - number: 76d
    text: |-
      1 Onze Minister verleent het budget, waarvan de hoogte volgens bij algemene maatregel van bestuur vast te stellen
      regels wordt bepaald.

      2 De verlening van het budget kan geheel of gedeeltelijk worden geweigerd indien het programma niet voldoet aan de
      eisen die op grond van [artikel 76c, eerste lid][ref1], zijn gesteld dan wel het advies van de provincie, bedoeld
      in [artikel 76c, tweede lid][ref2], daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76c
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76c
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 76c
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 76c
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76e
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald onder welke omstandigheden gedeputeerde staten
      gedurende de budgetperiode, een geactualiseerd en geconcretiseerd overzicht moeten indienen van de doelstellingen
      van het programma alsmede de gevolgen daarvan voor de aard en de omvang van de activiteiten tegen de achtergrond
      van die doelstellingen, en voor de kosten en wijze van financiering van het programma.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76e
  - number: 76f
    text: |-
      1 Zolang het budget niet is vastgesteld, kan Onze Minister, nadat tenminste twee jaren van de budgetperiode
      zijn verstreken, de verlening van het budget ten nadele van de provincie in ieder geval wijzigen, indien de
      doelstellingen waarvoor het budget is verleend kennelijk niet of niet geheel zullen worden verwezenlijkt en dit
      gedeputeerde staten kan worden toegerekend.

      2 Zolang het budget niet is vastgesteld, kan Onze Minister de verlening van het budget ten nadele van gedeputeerde
      staten in ieder geval wijzigen, indien:

      a. verleend budget aan een ander doel is besteed dan waarvoor het beschikbaar is gesteld;

      b. gedeputeerde staten onjuiste of onvolledige gegevens hebben verstrekt en de verstrekking van juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot verlening van het budget zou hebben geleid, of

      c. de verlening van het budget anderszins onjuist was en gedeputeerde staten dit wisten of behoorden te weten.

      3 De wijziging werkt terug tot het tijdstip waarop het budget is verleend, tenzij bij de wijziging anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76f
  - number: 76g
    text: |-
      1 Gedeputeerde staten dienen na afloop van de budgetperiode een aanvraag in tot vaststelling van het budget bij
      Onze Minister.

      2 Bij de aanvraag wordt een verantwoordingsverslag gevoegd waarin de doelstellingen uit het in [artikel 76c][ref1]
      genoemde programma en de aan het budget verbonden verplichtingen worden vergeleken met de bereikte resultaten en de
      verschillen worden toegelicht. Tevens wordt een verslag over de besteding van het verleende budget toegevoegd. Bij
      of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de aanvraag en deze verslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76c
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76g
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 76c
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76h
    text: |-
      Naar aanleiding van de aanvraag stelt Onze Minister het budget vast op het bedrag van het verleende budget,
      voorzover voldaan is aan de voorwaarden geregeld bij of krachtens [artikel 76g][ref1], geen van de in
      [artikel 76f, eerste en tweede lid][ref2], bedoelde omstandigheden zich voordoen en geen toepassing wordt gegeven
      aan het bepaalde in de [artikelen 76i tot en met 76iii][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76g
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76f
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel76i
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76h
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 76g
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 76f
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: 76i
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76hh
    text: |-
      1 Onze Minister verleent gedurende de budgetperiode per jaar een voorschot aan de provincies waaraan hij budget
      heeft verleend.

      2 Voorschotten worden overeenkomstig de voorschotverlening betaald. Het voorschot wordt binnen vier weken na de
      voorschotverlening betaald.

      3 De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot dan wel de wijze waarop dit bedrag
      wordt bepaald.

      4 Indien budgettaire omstandigheden daartoe aanleiding geven, kan de verlening van voorschot in afwijking van het
      eerste en tweede lid plaatsvinden over zeven kalenderjaren, waarbij over de uitgestelde betalingen van voorschotten
      geen rente wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76hh
  - number: 76i
    text: |-
      Onze Minister kan jegens de betrokken provincie verplichtingen verbinden aan het budget dat voor de lopende
      budgetperiode wordt of is verleend, indien met betrekking tot de afgelopen budgetperiode:

      a. de in het programma opgenomen doelstellingen naar het oordeel van Onze Minister onvoldoende zijn bereikt en dit
      de provincie kan worden toegerekend;

      b. de verleende budgetten door de provincie zijn besteed aan een ander doel dan waarvoor het beschikbaar is
      gesteld, of

      c. de aanvraag tot vaststelling van het budget niet of niet tijdig is ingediend.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76i
  - number: 76ii
    text: |-
      Indien naar het oordeel van Onze Minister genoegzaam vaststaat dat aan de in [artikel 76i][ref1] bedoelde
      verplichtingen niet zal worden voldaan, dan wel van het opleggen daarvan in redelijkheid onvoldoende resultaat kan
      worden verwacht, kan het budget over de afgelopen budgetperiode, lager worden vastgesteld dan het eerder voor dat
      tijdvak verleende budget.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76i
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76ii
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 76i
        hoofdstuk: VII
        paragraaf: '3'
  - number: 76iii
    text: |-
      Onze Minister kan onverschuldigd betaalde bedragen aan budget terugvorderen, voor zover na de dag waarop het
      budget is vastgesteld nog geen vijf jaren zijn verstreken. Bij de terugvordering kan worden bepaald dat over de
      onverschuldigd betaalde bedragen een rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76iii
  - number: 76j
    text: |-
      1 Onze Minister kan voor bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling aangewezen
      activiteiten op het gebied van onderzoek en sanering van gevallen van ernstige verontreiniging subsidie
      verstrekken.

      2 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen in ieder geval regels worden
      gesteld omtrent:

      a. criteria voor de verstrekking;

      b. het tijdvak waarvoor de subsidie wordt verleend;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de aanvraag van een subsidie en de besluitvorming daarover;

      e. de verplichtingen voor de subsidie-ontvanger;

      f. het bedrag van de subsidie dan wel de wijze waarop dit wordt bepaald;

      g. de betaling van de subsidie en het verlenen van voorschotten.

      3 Onze Minister kan ieder jaar bij ministeriële regeling subsidieplafonds vaststellen voor de verschillende
      activiteiten waarvoor subsidie kan worden verstrekt. Daarbij bepaalt hij de wijze van verdeling van het beschikbare
      bedrag.

      4 Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76j
  - number: 76k
    text: |-
      1 De door Onze Minister op grond van [artikel 76l, eerste lid][ref1], aangewezen personen zijn bevoegd van de
      aanvrager van een subsidie inlichtingen te vorderen. De [artikelen 5:13][ref2], [5:15][ref3], voor zover het door
      de aanvrager gebruikte plaatsen betreft, en [5:17 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige
      toepassing.

      2 Een aanvraag kan worden afgewezen, indien de aanvrager geen medewerking verleent bij de uitoefening van de in het
      eerste lid bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76l
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel517
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 76l
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:13
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:15
      - id: ref4
        bwb_id: BWBR0005537
        artikel: 5:17
  - number: 76l
    text: |-
      1 Met het toezicht op de naleving van de aan de subsidie-ontvanger opgelegde verplichtingen zijn belast de bij
      besluit van Onze Minister aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.

      4 Aan de krachtens deze wet verstrekte subsidies is de verplichting verbonden dat de subsidieontvanger aan
      een toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: 76m
    text: |-
      De [artikelen 76n][ref1] en [76o][ref2] zijn van toepassing voor de sanering van de bodem in gevallen als bedoeld
      in [artikel 63d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76n
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76o
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76m
    references:
