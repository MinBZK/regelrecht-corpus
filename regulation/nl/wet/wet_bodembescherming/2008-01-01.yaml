  - number: 63h
    text: |-
      In gevallen waarin de verontreiniging of aantasting van de bodem of de gevolgen daarvan zich niet beperken tot
      de bodem of de oever van het oppervlaktewater dat tot het beheer van de desbetreffende kwaliteitsbeheerder hoort,
      plegen gedeputeerde staten en de betrokken waterkwaliteitsbeheerder, alvorens van hun bevoegdheden gebruik te
      maken, terzake overleg.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel63h
  - number: 63i
    text: |-
      1 Bij een melding als bedoeld in [artikel 28][ref1], welke slechts betrekking heeft op een voornemen om een
      oppervlaktewater op diepte te brengen:

      a. zijn [de artikelen 28, vijfde lid, tweede volzin][ref2], [37][ref3], [52][ref4] en
      [63c, eerste lid, onder b, en tweede lid, onder b en c][ref5], niet van toepassing,

      b. wordt een beschikking als bedoeld in [artikel 29, eerste lid][ref6], uiterlijk genomen:

      1°. binnen vier weken na ontvangst van de melding, indien op de voorbereiding van de beschikking niet
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref7] van toepassing is;

      2°. binnen vijftien weken na ontvangst van de melding, in andere gevallen dan bedoeld onder ten eerste, en

      c. kan bij deze beschikking ten aanzien van de gemelde activiteiten tevens ontheffing worden verleend van
      [artikel 39][ref8], indien bij de melding daarom is verzocht.

      2 Indien de melding een ingewikkeld geval betreft en [afdeling 3.4 van de Algemene wet bestuursrecht][ref9] is niet
      van toepassing, kan het bestuursorgaan, binnen vier weken na ontvangst van de melding, de termijn van vier weken
      die is bedoeld in het eerste lid, onder *b*, onder ten eerste, met ten hoogste vier weken verlengen.

      3 Een ontheffing als bedoeld in het eerste lid, onder *c*, kan slechts worden verleend:

      a. indien bij de melding voldoende gegevens zijn verstrekt waaruit blijkt wat de nadelige gevolgen kunnen zijn
      van het baggerwerk voor de verspreiding, het onderzoek of de sanering van het deel van het geval van ernstige
      verontreiniging dat niet wordt verplaatst, en

      b. indien de waterkwaliteitsbeheerder in de gelegenheid is gesteld terzake advies uit te brengen.

      4 Bij regeling van Onze Minister van Verkeer en Waterstaat, onderscheidenlijk bij provinciale verordening, kunnen
      regels worden gesteld met betrekking tot de gegevens, bedoeld in het derde lid, onder *a*.

      5 Aan een ontheffing kunnen beperkingen worden verbonden met betrekking tot het oppervlaktewater waarop deze
      betrekking heeft, alsmede met betrekking tot de tijd waarvoor deze geldt. Voorts worden aan een ontheffing de
      voorschriften verbonden die in het belang van de bescherming van de bodem nodig zijn en worden deze voorschriften
      in acht genomen door degene aan wie de ontheffing is verleend.

      6 [Artikel 20.3, eerste lid, van de Wet milieubeheer][ref10] is niet van toepassing op een beschikking als bedoeld
      in het eerste lid, onder *b* en *c*.


