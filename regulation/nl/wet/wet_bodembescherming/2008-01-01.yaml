        bwb_id: BWBR0003994
        artikel: 76c
        hoofdstuk: VII
        paragraaf: '3'
  - number: '87'
    text: |-
      1 Beroep op de administratieve rechter staat open overeenkomstig hoofdstuk 20 van de Wet milieubeheer.

      2 Geen beroep staat open tegen een besluit op grond van [artikel 43][ref1], voor zover inhoudende de afwijzing van
      een verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel43
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 87a
    text: |-
      1 Onze Minister doet de Staten-Generaal jaarlijks voor de derde woensdag in mei een verslag toekomen over de
      voortgang van de uitvoering van de bodemsaneringsoperatie.

      2 Gedeputeerde staten doen Onze Minister ieder jaar voor de tweede dinsdag in januari de gegevens ten behoeve van
      het verslag, bedoeld in het eerste lid, toekomen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de gegevens, bedoeld in het tweede
      lid.

      4 Burgemeester en wethouders van de gemeenten die niet in [artikel 88, eerste en achtste lid][ref1], worden genoemd
      doen met betrekking tot het grondgebied van hun gemeente aan gedeputeerde staten van een provincie een opgave van
      de gegevens, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '88'
        hoofdstuk: IX
  - number: 87b
    text: |-
      1 Gedeputeerde staten doen Onze Minister ieder jaar voor 1 mei verslag over de uitvoering van deze wet op hun
      grondgebied.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop het verslag wordt
      gedaan, alsmede omtrent de gegevens die daarbij worden verstrekt.

      3 Naar aanleiding van het verslag, bedoeld in het tweede lid, kan een gesprek van Onze Minister met gedeputeerde
      staten over de uitvoering van de wet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel87b
  - number: '88'
    text: |-
      1 De gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht worden gelijkgesteld met een provincie voor de
      toepassing van:

      a. de [artikelen 27 tot en met 34][ref1], [37][ref2], [artikel 38, derde en vierde lid][ref3], [39][ref4],
      [39a][ref5], [39b][ref6], [39c][ref7], [39d, derde, vierde en vijfde lid][ref8], [39f, eerste lid][ref9],
      [40][ref10], [42][ref11], [43 tot en met 52][ref12], [55][ref13], [55b, derde lid][ref14],
      [74 tot en met 76l][ref15], [83][ref16], [86b][ref17], [87a][ref18], [87b][ref19] en [92b][ref20];

      b. de [artikelen 4.14, eerste lid, en tweede lid, onder a, onder 1°, en onder b][ref21], voor zover het de
      activiteiten, bedoeld onder a , onder 1°, betreft, en [4.15, derde lid, van de Wet milieubeheer][ref22].

      2 Een plusregio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref23] die de gemeente of
      gemeenten Amsterdam, Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of
      Utrecht omvat wordt gelijkgesteld met een provincie voor de toepassing van de in het eerste lid genoemde artikelen,
      alsmede voor de [artikelen 41][ref24], [51][ref25], [53][ref26] en [54][ref27]. De gelijkstelling vindt toepassing:

        - voor de locaties waarvoor de plusregio rechtstreeks middelen van het Rijk ontvangt voor de in [artikel 76][ref28]
      omschreven activiteiten, en
        - indien de in deze artikelen bedoelde bevoegdheden aan de plusregio bij algemene maatregel van bestuur zijn
      overgedragen.

      3 In de gevallen waarin de in het eerste lid bedoelde gelijkstelling van toepassing is, blijven de
      [artikelen 41][ref29], [51][ref30], [53][ref31] en [54][ref32] buiten toepassing.

      4 In de gevallen waarin de in het tweede lid bedoelde gelijkstelling van toepassing is, blijft het eerste lid
      buiten toepassing voor een in die plusregio gelegen gemeente.

      5 De in het eerste en het tweede lid bedoelde gelijkstelling is niet van toepassing voor zover de in het eerste lid
      genoemde artikelen de verontreiniging of aantasting betreffen van:

      a. de bodem onder oppervlaktewater;

      b. de kust of de oever van oppervlaktewater, indien redelijkerwijs moet worden aangenomen dat de verontreiniging of
      aantasting van de kust of de oever gevolgen heeft voor de bodem onder dat water.

      6 Onverlet het derde tot en met het vijfde lid, treden in de gevallen, bedoeld in het eerste en het tweede lid:

      a. de raad onderscheidenlijk het algemeen bestuur van de plusregio op in de plaats van provinciale staten,

      b. burgemeester en wethouders onderscheidenlijk het dagelijks bestuur van de plusregio op in de plaats van
      gedeputeerde staten, en

      c. de burgemeester onderscheidenlijk de voorzitter van de plusregio op in de plaats van Onze commissaris in de
      provincie.

      7 In de gevallen, bedoeld in het zesde lid:

      a. worden tevens gedeputeerde staten in de gelegenheid gesteld van advies te dienen overeenkomstig
      [artikel 32][ref33];

      b. kunnen ook gedeputeerde staten een verzoek doen als bedoeld in [artikel 33][ref34];

      c. wordt een beschikking, houdende een beslissing op een zodanig verzoek tevens aan gedeputeerde staten
      toegezonden;

      d. wordt de inhoud van een ingevolge [artikel 30][ref35] of [31][ref36] gegeven beschikking tevens onverwijld aan
      gedeputeerde staten medegedeeld en wordt de beschikking tevens in afschrift aan hen gezonden.

      8 Bij algemene maatregel van bestuur kan het eerste lid van overeenkomstige toepassing worden verklaard op andere
      gemeenten dan die, genoemd in het eerste lid.


