  - number: '82'
    text: |-
      1 De kosten die in verband staan met de in [artikel 57][ref1] bedoelde verplichting, komen geheel ten laste van de
      betrokken gemeente.

      2 Indien een gemeente verkeert of door toepassing van het eerste lid zou komen te verkeren in een geval als bedoeld
      in [artikel 12 van de Financiële-verhoudingswet][ref2] kan Onze Minister in overeenstemming met Onze Ministers van
      Binnenlandse Zaken en Koninkrijksrelaties en van Financiën op verzoek van burgemeester en wethouders een bijdrage
      in de in het eerste lid bedoelde kosten vaststellen.

      3 Gedeputeerde staten verlenen de ingevolge het tweede lid vastgestelde bijdrage aan de gemeente.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de kosten ten behoeve
      waarvan een bijdrage als bedoeld in het tweede lid, kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '83'
    text: |-
      Gedeputeerde staten verlenen op verzoek van burgemeester en wethouders aan een gemeente een bijdrage ter hoogte van
      22,5 procent van de overeenkomstig [artikel 57][ref1] vastgestelde koopprijs, indien die gemeente aantoont dat zij:

      a. gedurende de periode waarin de verontreiniging is veroorzaakt geen duurzame rechtsbetrekkingen heeft gehad met
      de veroorzaker of de veroorzakers;

      b. geen directe of indirecte betrokkenheid heeft gehad bij de veroorzaking van de verontreiniging en

      c. op het moment waarop de grond voor woningbouw is verkocht of in erfpacht is uitgegeven, niet op de hoogte was
      dan wel redelijkerwijs niet op de hoogte had kunnen zijn van de verontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel57
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 86a
    text: Met betrekking tot beschikkingen krachtens deze wet worden geen rechten geheven.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel86a
  - number: 86b
    text: |-
      Indien het bedrag dat uit s Rijks kas beschikbaar is voor het budget gedurende de budgetperiode wordt verhoogd dan
      wel op andere wijze budgettaire ruimte ontstaat, kan Onze Minister het budget verhogen volgens bij of krachtens
      algemene maatregel van bestuur te stellen regels waarbij de criteria neergelegd in de krachtens het eerste lid van
      [artikel 76c][ref1] tot stand gebrachte algemene maatregel van bestuur kunnen worden uitgebreid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76c
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel86b
    references:
