  - number: '55'
    text: |-
      1 Een beschikking als bedoeld in de [artikelen 29, eerste lid][ref1], juncto [37, eerste lid][ref2],
      [39b][ref3] juncto [artikel 14 van het Besluit uniforme saneringen][ref4], [39c, tweede lid][ref5], en
      [39d, derde lid][ref6], en een bevel als bedoeld in de [artikelen 30][ref7], [43][ref8] en [49][ref9],
      vermelden, onder verwijzing naar een bijgevoegde kadastrale kaart, de kadastrale aanduiding van de onroerende
      zaak of zaken ten aanzien waarvan uit de beschikking of het bevel een publiekrechtelijke beperking als bedoeld
      in [artikel 1, onderdeel a, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref10]
      voortvloeit, dan wel ten aanzien waarvan bij de beschikking of het bevel zodanige beperking wordt gewijzigd of komt
      te vervallen.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de uitvoering van het eerste lid.


