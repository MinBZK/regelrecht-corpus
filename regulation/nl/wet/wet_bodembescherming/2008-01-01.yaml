  - number: 12b
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat van bij of krachtens de
      [artikelen 6 tot en met 12a][ref1] gestelde regels mag worden afgeweken

      a. voor zover die regels betrekking hebben op in die artikelen bedoelde werkzaamheden waarbij bouwstoffen, grond of
      baggerspecie op of in de bodem worden toegepast, en

      b. door Onze Minister is vastgesteld dat anders dan door toepassing van die regels ten minste eenzelfde mate van
      bescherming van de bodem is gewaarborgd als is beoogd met die regels.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de toepassing van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '6'
        hoofdstuk: III
  - number: '13'
    text: |-
      Ieder die op of in de bodem handelingen verricht als bedoeld in de [artikelen 6 tot en met 11][ref1] en die weet
      of redelijkerwijs had kunnen vermoeden dat door die handelingen de bodem kan worden verontreinigd of aangetast, is
      verplicht alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd, teneinde die verontreiniging
      of aantasting te voorkomen, dan wel indien die verontreiniging of aantasting zich voordoet, de verontreiniging
      of de aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken. Indien de
      verontreiniging of aantasting het gevolg is van een ongewoon voorval, worden de maatregelen onverwijld genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '6'
        hoofdstuk: III
  - number: '15'
    text: |-
      1 Tot de krachtens de [artikelen 6 tot en met 12a][ref1] bij of krachtens algemene maatregel van bestuur te stellen
      regels kunnen behoren regels, inhoudende:

      a. een verbod een werkzaamheid als daar bedoeld te verrichten indien daarbij niet voldaan wordt aan bij of
      krachtens die maatregel gestelde eisen met betrekking tot de in het kader van die werkzaamheid te gebruiken stoffen
      of voorwerpen;

      b. een verbod zodanige werkzaamheid te verrichten anders dan overeenkomstig bij of krachtens die maatregel aan te
      geven eisen met betrekking tot de wijze waarop, de omstandigheden waaronder of de plaats waar die werkzaamheid mag
      worden verricht;

      c. een verbod zodanige werkzaamheid te verrichten zonder dat bij een onderzoek op een bij of krachtens die
      maatregel aan te geven wijze is aangetoond dat daardoor geen verontreiniging of aantasting van de bodem zal
      optreden, dan wel geen verontreiniging of aantasting die een bepaalde waarde overschrijdt;

      d. een verbod zodanige werkzaamheid te verrichten zonder zulks te melden op een bij of krachtens die maatregel aan
      te geven wijze aan een daarbij aan te geven bestuursorgaan onder vermelding van bij of krachtens die maatregel aan
      te geven gegevens.

      2 Tot de in het eerste lid bedoelde regels kan tevens een verbod behoren in het kader van een werkzaamheid als
      daar bedoeld een bij of krachtens die maatregel aan te geven voorwerp bestemd voor het opslaan of transporteren van
      daarbij aan te geven stoffen, te gebruiken indien dat voorwerp:

      a. niet op een bij of krachtens die maatregel aan te geven wijze is goedgekeurd;

      b. niet behoort tot een type dat bij een keuring verricht aan de hand van bij of krachtens die maatregel daartoe
      vastgestelde voorschriften, is goedgekeurd.

      3 Indien van een werkzaamheid als bedoeld in de [artikelen 6 tot en met 12][ref2] een ernstige verontreiniging of
      aantasting van de bodem het gevolg kan zijn, kunnen de krachtens die artikelen bij algemene maatregel van bestuur
      vast te stellen regels een algeheel verbod inhouden zodanige werkzaamheid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel6
