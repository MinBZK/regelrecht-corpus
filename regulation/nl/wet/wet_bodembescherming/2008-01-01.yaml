  - number: '20'
    text: |-
      Indien een onmiddellijke voorziening geboden is, kan Onze Minister in het belang van de bescherming van de bodem
      een besluit nemen met betrekking tot een werkzaamheid als bedoeld in [de artikelen 6][ref1] tot en met [11][ref2].
      Een zodanige ministeriële regeling vervalt zes maanden nadat zij in werking is getreden of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      van die inwerkingtreding. De termijn kan bij ministeriële regeling eenmaal met ten hoogste zes maanden worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel11
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel20
