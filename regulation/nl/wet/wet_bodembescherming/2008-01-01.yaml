  - number: '68'
    text: |-
      Indien toepassing is gegeven aan [artikel 65, eerste lid][ref1], houden de krachtens dat artikellid aangewezen
      bestuursorganen een register bij, waarin aantekening wordt gehouden van de met betrekking tot ontheffingen genomen
      beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel65
