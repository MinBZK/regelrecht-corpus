  - number: '66'
    text: |-
      1 Beperkingen waaronder een ontheffing is verleend, en voorschriften die daaraan zijn verbonden, kunnen in het
      belang van de bescherming van de bodem worden gewijzigd, aangevuld of ingetrokken. Indien geen beperkingen of
      voorschriften zijn gesteld kan zulks in dat belang alsnog geschieden.

      2 Een ontheffing kan geheel of gedeeltelijk worden ingetrokken indien:

      a. een aan de ontheffing verbonden voorschrift niet wordt nageleefd;

      b. zulks noodzakelijk is in het belang van de bescherming van de bodem.

      3 Op de voorbereiding van een beschikking op een verzoek van de houder van een ontheffing tot wijziging
      van daaraan verbonden voorschriften of beperkingen waaronder zij is verleend en op de voorbereiding van
      andere beschikkingen krachtens het eerste lid en van beschikkingen krachtens het tweede lid, onder b, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
