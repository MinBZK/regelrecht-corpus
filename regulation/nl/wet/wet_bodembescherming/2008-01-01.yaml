  - number: 63b
    text: |-
      1 Onze Minister van Verkeer en Waterstaat stelt jaarlijks een programma vast met betrekking tot de hem bekende
      onderzoeksgevallen en gevallen van ernstige verontreiniging, waarbij sprake is van een verontreiniging of
      aantasting als bedoeld in [artikel 63a, eerste of tweede lid][ref1], hierna te noemen: saneringsprogramma voor de
      waterbodem van rijkswateren.

      2 Het saneringsprogramma voor de waterbodem van rijkswateren bevat met betrekking tot de in het eerste lid bedoelde
      gevallen ten minste een overzicht van de door of vanwege Onze Minister van Verkeer en Waterstaat en van de aan hem
      bekende door anderen in de eerstvolgende vier jaren te verrichten activiteiten en een aanduiding van het tijdstip
      waarop met het onderzoek of de sanering van die gevallen zal of dient te worden aangevangen.

      3 Onze Minister van Verkeer en Waterstaat pleegt bij de voorbereiding van het saneringsprogramma voor de waterbodem
      van rijkswateren overleg met de overheidsorganen die betrokken zijn of een belang hebben bij de activiteiten,
      bedoeld in het tweede lid.

      4 Onze Minister van Verkeer en Waterstaat legt het saneringsprogramma voor de waterbodem van rijkswateren bij
      de aanbieding van de rijksbegroting over aan de Staten-Generaal. Het gaat vergezeld van een verslag over de
      besteding in het voorafgaande kalenderjaar van gelden op de begroting, bestemd voor de sanering van de bodem van
      rijkswateren.

      5 Ten aanzien van de inhoud van het verslag, bedoeld in het vierde lid, tweede volzin, omvat het verslag in ieder
      geval gegevens omtrent de wijze van onderzoek van de betrokken onderzoeksgevallen en gegevens omtrent de wijze
      waarop het saneringsonderzoek en de sanering in de betrokken gevallen zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63a
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 63a
        hoofdstuk: IV
        paragraaf: '5'
  - number: 63c
    text: |-
      1 Bij regeling van Onze Minister van Verkeer en Waterstaat worden regels gesteld met betrekking tot de wijze
      waarop:

      a. belanghebbenden worden betrokken bij de voorbereiding van het saneringsprogramma voor de waterbodem van
      rijkswateren, en

      b. gedeputeerde staten van de provincie en burgemeester en wethouders van de gemeente waar zich een geval voordoet,
      waarin nader onderzoek zal plaats vinden, of waar zich een geval van ernstige verontreiniging voordoet, dat is
      opgenomen in het saneringsprogramma voor de waterbodem van rijkswateren dan wel daarin tussentijds is opgenomen,
      alsmede ingezetenen van die provincie of gemeente, andere waterkwaliteitsbeheerders en andere belanghebbenden
      bij de uitvoering van dat nader onderzoek, het saneringsonderzoek of de sanering van dat geval bij die uitvoering
      worden betrokken.

      2 De in het eerste lid bedoelde inspraak wordt verleend door toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], voorzover bij de regeling van Onze Minister van Verkeer en
      Waterstaat niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel63c
