  - number: '17'
    text: |-
      1 De krachtens de [artikelen 6 tot en met 12a][ref1] bij of krachtens algemene maatregel van bestuur vast te
      stellen regels kunnen de verplichting inhouden bij of krachtens die maatregel aan te geven metingen, registraties
      of controles te verrichten ten einde gegevens te verkrijgen met betrekking tot een in de bodem gebrachte,
      geraakte of getransporteerde stof dan wel met betrekking tot de invloed van die stof op de bodem. Daarbij kunnen
      tevens eisen worden gesteld met betrekking tot de wijze waarop de metingen, registraties of controles dienen te
      worden verricht en de door middel daarvan verkregen gegevens aan een bij of krachtens die maatregel aan te geven
      bestuursorgaan dienen te worden overgelegd.

      2 De krachtens de [artikelen 6 tot en met 12][ref2] bij of krachtens algemene maatregel van bestuur vast te stellen
      regels kunnen voorts de verplichting inhouden te voldoen aan door bij of krachtens die maatregel aan te geven
      bestuursorganen, omtrent daarbij vermelde onderwerpen, aan de betrokkene gestelde nadere eisen. In een beschikking
      waarbij een nadere eis wordt gesteld of gewijzigd, wordt tevens een termijn, aanvangende op het tijdstip waarop die
      beschikking in werking is getreden, vastgesteld, eerst bij het verstrijken waarvan de in de beschikking vervatte
      eis van toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel17
