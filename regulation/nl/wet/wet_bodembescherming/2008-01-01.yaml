  - number: '98'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie, worden voor
      zover nodig bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die de in deze
      wet vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij de uitvoering dienen te worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel98
  - number: '99'
    text: |-
      1 De [artikelen 6 tot en met 12b][ref1] zijn niet van toepassing op gedragingen, voor zover daaromtrent regels
      gelden, die zijn gesteld bij of krachtens de [Bestrijdingsmiddelenwet][ref2], de [Kernenergiewet][ref3],
      de [Natuurbeschermingswet][ref4], de [Wet verontreiniging oppervlaktewateren][ref5] of de
      [Wet verontreiniging zeewater][ref6].

      2 De [artikelen 6 tot en met 12b][ref7] zijn niet van toepassing op mijnbouwwerken als bedoeld in
      [artikel 1 van de Mijnbouwwet][ref8]. Bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 49 van de Mijnbouwwet][ref9] kan worden bepaald dat de [artikelen 6 tot en met 12b][ref10] en de daarop
      berustende bepalingen geheel of gedeeltelijk wel van toepassing zijn op deze werken.

      3 De [artikelen 27 tot en met 54][ref11] zijn niet van toepassing ten aanzien van maatregelen met het
      oog op ongewone voorvallen of sanering van de bodem, voor zover daarin kan worden voorzien krachtens de
      [artikelen 39][ref12] en [44 van de Kernenergiewet][ref13].

      4 De [artikelen 27 tot en met 54][ref14] zijn evenmin van toepassing op gedragingen, voor zover daaromtrent
      voorschriften gelden die zijn gesteld bij of krachtens de Wet verontreiniging oppervlaktewateren.


