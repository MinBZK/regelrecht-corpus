  - number: '56'
    text: |-
      In deze paragraaf wordt onder redelijke prijs verstaan: prijs die tot stand komt bij een koop in het vrije
      commerciële verkeer tussen redelijk handelende partijen, waarbij buiten beschouwing blijft de verontreiniging van
      de bodem.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel56
  - number: '57'
    text: |-
      1 Een gemeente is verplicht tot aankoop van grond, de daarop staande woning of een recht met betrekking tot de
      grond of de woning, indien:

      a. de woning staat op een gedeelte van het grondgebied van de gemeente dat een geval van ernstige verontreiniging
      omvat of dat deel uitmaakt van een geval van ernstige verontreiniging;

      b. ingevolge [artikel 37, eerste lid][ref1], is vastgesteld dat het huidige dan wel voorgenomen gebruik van de
      bodem of de mogelijke verspreiding van de verontreiniging leiden tot zodanige risico's voor mens, plant of dier dat
      spoedige sanering noodzakelijk is en

      c. dat gedeelte voor woningbouw is verkocht of in erfpacht is uitgegeven nadat de verontreiniging is veroorzaakt.

      2 De aankoop geschiedt tegen een redelijke prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '58'
    text: |-
      De verplichting bestaat slechts indien een verzoek tot aankoop is gedaan door:

      a. de eigenaar van de grond of de woning;

      b. degene aan wie het recht van erfpacht, van opstal, van vruchtgebruik of van gebruik en bewoning toebehoort,
      waaraan de grond of de woning is onderworpen.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel58
  - number: '59'
    text: |-
      1 De verplichting bestaat uitsluitend jegens een rechthebbende die aantoont dat hij:

      a. de woning bewoont;

      b. gedurende de periode waarin de verontreiniging is veroorzaakt geen duurzame rechtsbetrekkingen heeft gehad met
      de veroorzaker of veroorzakers;

      c. geen directe of indirecte betrokkenheid heeft gehad bij de veroorzaking van de verontreiniging en

      d. op het moment van de verkrijging van zijn recht niet op de hoogte was dan wel redelijkerwijs niet op de hoogte
      had kunnen zijn van de verontreiniging.

      2 Voorts moet de rechthebbende aantonen dat de woning in het vrije commerciële verkeer niet tegen een redelijke
      prijs verkoopbaar is. Hij kan dit in ieder geval aantonen indien hij de woning drie maal in een dagblad tegen
      een redelijke prijs tevergeefs te koop heeft aangeboden, gedurende een periode van zes maanden nadat ingevolge
      [artikel 37, eerste lid][ref1], is vastgesteld dat het huidige dan wel voorgenomen gebruik van de bodem of de
      mogelijke verspreiding van de verontreiniging leiden tot zodanige risico's voor mens, plant of dier dat spoedige
      sanering noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '60'
    text: |-
      De gemeente is niet verplicht tot aankoop, indien:

      a. de verontreiniging slechts het grondwater betreft of

      b. gedeputeerde staten een verzoek als bedoeld in [artikel 50, eerste lid][ref1], of daarop vooruitlopend, een
      aanbod tot minnelijke schikking als bedoeld in [artikel 50, tweede lid][ref2], hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel50
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '61'
    text: |-
      [Artikel 75, derde lid][ref1], vindt geen toepassing op:

      a. de in artikel 59 bedoelde rechthebbende;

      b. de gemeente die de grond, de woning of een recht met betrekking tot de grond of de woning koopt;

      c. degene aan wie de gemeente de grond, de woning of het recht met betrekking tot de grond of de woning vervolgens
      verkoopt, tenzij deze de woning bewoont of heeft bewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel75
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '75'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '62'
    text: |-
      Burgemeester en wethouders beslissen binnen drie maanden op het verzoek. Zij zenden een afschrift van het verzoek
      en van hun beslissing daarop aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel62
  - number: '63'
    text: |-
      Geschillen over de beslissing van de gemeente op het verzoek of met betrekking tot de koopprijs staan ter
      kennisneming van de rechtbank binnen het rechtsgebied waarvan de woning is gelegen.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel63
  - number: 63a
    text: |-
      1 In gevallen waarin de verontreiniging of aantasting de bodem onder oppervlaktewater betreft waarvoor Onze
      Minister van Verkeer en Waterstaat waterkwaliteitsbeheerder is, berusten de in de [artikelen 27][ref1], [28][ref2],
      [29][ref3], [37][ref4], [38][ref5], [39][ref6], [39a][ref7], [39b][ref8], [39c][ref9], [39d][ref10], [39f][ref11],
      [40][ref12], [41][ref13], [42][ref14], [43][ref15], [45][ref16], [46][ref17], [48][ref18], [49][ref19], [55][ref20]
      en [55b][ref21] aan gedeputeerde staten, de in de [artikelen 39][ref22], [39c][ref23] en [39d][ref24] aan
      provinciale staten en de in [artikel 50][ref25] aan Onze Minister toegekende taken en bevoegdheden in afwijking van
      die artikelen bij Onze Minister van Verkeer en Waterstaat.

      2 Gelijke taken en bevoegdheden berusten bij Onze Minister van Verkeer en Waterstaat voor zover de verontreiniging
      of aantasting de kust of de oever van oppervlaktewater betreft, tenzij redelijkerwijs kan worden aangenomen dat die
      verontreiniging of aantasting geen gevolgen heeft voor de bodem onder dat water.

      3 In een geval als bedoeld in het eerste of tweede lid vergoedt Onze Minister van Verkeer en Waterstaat de schade
      ten gevolge van een bevel als bedoeld in [artikel 49][ref26] juncto [artikel 30, derde of vierde lid][ref27], en is
      [artikel 74, tweede, derde en vierde lid][ref28], op die schadevergoeding van overeenkomstige toepassing.

      4 In een geval als bedoeld in het eerste of tweede lid:

      a. blijft [artikel 49, derde lid][ref29], buiten toepassing;

      b. doet Onze Minister van Verkeer en Waterstaat een vordering als bedoeld in [artikel 50][ref30], zonder een
      verzoek van gedeputeerde staten ter zake, gaat hij niet tot vordering over dan nadat hij heeft getracht hetgeen
      gevorderd moet worden te verkrijgen bij minnelijke schikking en legt hij een verslag van het met de betrokken
      rechthebbende daaromtrent gevoerde overleg over bij de kennisgeving aan de Staten-Generaal, en

      c. blijven de [artikelen 76 tot en met 86b][ref31], met uitzondering van [artikel 86a][ref32], buiten toepassing.

      5 In gevallen waarin de verontreiniging of aantasting van de bodem of de gevolgen daarvan, niet beperkt zijn tot
      de bodem, bedoeld in het eerste lid, of de kust of de oever, bedoeld in het tweede lid, plegen Onze Minister van
      Verkeer en Waterstaat en gedeputeerde staten, alvorens van hun bevoegdheden gebruik te maken, terzake overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel27
