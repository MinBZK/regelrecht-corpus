        hoofdstuk: III
  - number: '65'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 11][ref1] kan bepaald worden
      dat bij de maatregel aangewezen bestuursorganen, in gevallen waarin het belang van de bescherming van de bodem
      zich daartegen niet verzet, op daartoe strekkend verzoek ontheffing kunnen verlenen van bij de maatregel aangegeven
      verboden en verplichtingen. Indien als bestuursorgaan niet een orgaan van het Rijk is aangewezen, wordt bij een
      beschikking met betrekking tot een ontheffing de ingevolge [artikel 1.2 van de Wet milieubeheer][ref2] vastgestelde
      provinciale milieuverordening in acht genomen.

      2 Een bevoegdheid als bedoeld in het eerste lid geldt niet met betrekking tot inrichtingen waarvoor een vergunning
      als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref3] is vereist.

      3 Een ontheffing kan onder beperkingen worden verleend; aan de ontheffing kunnen voorschriften worden verbonden. De
      beperkingen en voorschriften worden gesteld in het belang van de bescherming van de bodem.

      4 Bij een maatregel als bedoeld in het eerste lid kunnen ter uitvoering van een voor Nederland verbindend verdrag
      of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld met betrekking
      tot de gevallen waarin een ontheffing kan worden verleend en de voorschriften of beperkingen, die in ieder geval
      aan een ontheffing dienen te worden verbonden.

      5 Op de voorbereiding van een beschikking op een verzoek om verlening van een ontheffing zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] en [afdeling 13.2 van de Wet milieubeheer][ref5] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
