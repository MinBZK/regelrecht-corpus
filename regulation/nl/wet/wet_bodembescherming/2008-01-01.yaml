      Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 12b][ref1] wordt voorzien in
      hetgeen met betrekking tot het gaan gelden van het in zodanige maatregel bepaalde regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
