  - number: 77a
    text: |-
      Voorzover bij de voorbereiding of de uitvoering van een provinciaal milieuprogramma verplichtingen zijn aangegaan
      met betrekking tot gevallen waarvoor een bijdrage is verleend krachtens [artikel 76][ref1] en [76n][ref2], blijft
      voor die gevallen deze wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76n
