        bwb_id: BWBR0003994
        artikel: 76n
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 76o
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: 63d
        hoofdstuk: IV
        paragraaf: '5'
  - number: 76n
    text: |-
      1 Onze Minister verleent voor een periode van vijf jaar een door hem vast te stellen budget aan de provincie ter
      tegemoetkoming in de in de daarop volgende vijf jaar te maken kosten van het onderzoek van onderzoeksgevallen
      en van het saneringsonderzoek en de sanering van gevallen van ernstige verontreiniging als bedoeld in
      [artikel 63d, eerste lid][ref1], die door de waterkwaliteitsbeheerders in de betrokken provincie zullen worden
      uitgevoerd.

      2 De [artikelen 76a tot en met 76iii][ref2] zijn van overeenkomstige toepassing. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld voor de berekening van de in het eerste lid, bedoelde bijdrage en over
      de in aanmerking te nemen kosten.

      3 Uit het budget bekostigt de provincie per geval van verontreiniging negentig procent van de kosten van nader
      onderzoek en van saneringsonderzoek en sanering van gevallen van ernstige verontreiniging als bedoeld in het eerste
      lid, voorzover die kosten niet overeenkomstig [artikel 76o, eerste lid][ref3], ten laste komen van de betrokken
      waterkwaliteitsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel76o
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76n
