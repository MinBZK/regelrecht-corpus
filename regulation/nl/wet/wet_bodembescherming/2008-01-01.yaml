  - number: 63k
    text: |-
      1 Een bevel tot sanering wordt, tenzij het tijdelijke beveiligingsmaatregelen betreft, niet gegeven aan de
      eigenaar of erfpachter van de bodem onder een oppervlaktewater, indien deze ter gelegenheid van het ingevolge
      [artikel 45, derde lid][ref1], met hem gevoerde overleg aantoont:

      a. 1°. dat hij gedurende de periode waarin de verontreiniging is veroorzaakt geen duurzame rechtsbetrekking heeft
      gehad met de veroorzaker of veroorzakers van de verontreiniging, of

      2°. dat de duurzame rechtsbetrekking met de veroorzaker slechts bestond uit het in gebruik geven van de grond,
      en de verontreiniging is veroorzaakt door een lozing die niet in strijd was met de voorschriften, gesteld bij of
      krachtens de Wet verontreiniging oppervlaktewateren, dan wel door een lozing waarvan de waterkwaliteitsbeheerder op
      de hoogte was of redelijkerwijs had moeten zijn;

      b. dat hij geen directe of indirecte betrokkenheid heeft gehad bij de veroorzaking van de verontreiniging, en

      c. 1°. dat hij op het moment van de verkrijging van het recht op het grondgebied niet op de hoogte was dan wel
      redelijkerwijs niet op de hoogte had kunnen zijn van de verontreiniging, of

      2°. dat degene die op 1 augustus 1995 eigenaar of erfpachter van het desbetreffende perceel was, en diens
      rechtsopvolgers voldeden aan de onderdelen a en b.

      2 Indien een eigenaar of erfpachter:

      a. niet voldoet aan het eerste lid, onder *a*, onder ten eerste, doch de veroorzaker niet in overwegende mate is
      betrokken bij de veroorzaking van de verontreiniging, of

      b. niet voldoet aan het eerste lid, onder *b*, doch niet in overwegende mate is betrokken bij de veroorzaking van
      de verontreiniging en overigens voldoet aan het eerste lid, wordt hem geen bevel gegeven, indien het bestuursorgaan
      dat bevoegd is een bevel te geven met hem overeenkomt dat hij aan dat orgaan een bedrag betaalt dat overeenkomt
      met de kosten van de sanering van het deel van de verontreiniging waarbij de veroorzaker onderscheidenlijk hij
      is betrokken.

      3 Het tweede lid is van overeenkomstige toepassing op degene door wiens handelen een geval van ernstige
      verontreiniging mede is ontstaan, doch die niet in overwegende mate is betrokken bij de veroorzaking van de
      verontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel45
