      1 De verlening van budget of subsidie op grond van deze wet kan worden ingetrokken of gewijzigd wegens strijd met
      een uit een verdrag voor de staat voortvloeiende verplichting. Bij de intrekking of wijziging kan worden bepaald
      dat over onverschuldigd betaalde subsidiebedragen een rentevergoeding verschuldigd is.

      2 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verleend, tenzij bij de
      intrekking of wijziging anders is bepaald.
