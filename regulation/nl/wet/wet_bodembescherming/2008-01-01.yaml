  - number: 63g
    text: |-
      Bij provinciale verordening:

      a. wordt geregeld op welke wijze de waterkwaliteitsbeheerder aan gedeputeerde staten informatie dient te
      verschaffen omtrent de resultaten van door hem uitgevoerde saneringen en de besteding van de daarvoor aan hem
      toegekende gelden;

      b. kan nader worden geregeld welke gegevens moeten worden opgenomen in het saneringsplan, bedoeld in
      [artikel 63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63e
