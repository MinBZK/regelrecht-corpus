    text: |-
      1 Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 18.3 tot en met 18.14][ref1], [18.15, onder b][ref2], en [18.16 van de Wet milieubeheer][ref3] van
      toepassing.

      2 Het in [artikel 18.2 van de Wet milieubeheer][ref4] bedoelde bestuursorgaan heeft tot taak zorg te dragen voor de
      bestuursrechtelijke handhaving van het ten aanzien van de betrokken inrichting bij of krachtens deze wet bepaalde.

      3 Onze betrokken Minister, gedeputeerde staten, burgemeester en wethouders en de waterkwaliteitsbeheerder hebben
      tot taak zorg te dragen voor de bestuursrechtelijke handhaving van [artikel 13][ref5].

      4 De volgende bestuursorganen hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het
      bepaalde bij of krachtens [§ 3 van hoofdstuk IV][ref6] en [artikel 72][ref7]:

      a. in gevallen als bedoeld in de [artikelen 63a][ref8] en [63d][ref9]: de waterkwaliteitsbeheerder;

      b. in gevallen als bedoeld in [artikel 88, eerste, tweede en achtste lid en negende lid][ref10]: burgemeester en
      wethouders, onderscheidenlijk het dagelijks bestuur van de plusregio;

      c. in andere gevallen: gedeputeerde staten.

      5 Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 12a][ref11] kan worden
      aangegeven onder welke voorwaarden en in welke gevallen de bevoegdheid tot bestuursrechtelijke handhaving niet bij
      het bevoegd gezag maar bij Onze Minister berust.


