  - number: 76o
    text: |-
      1 In gevallen als bedoeld in [artikel 63d, eerste lid][ref1], draagt de waterkwaliteitsbeheerder in een geval
      waarin nader onderzoek zal plaats vinden of in een geval van ernstige verontreiniging, voorzover dit geval de bodem
      onder of de oever van oppervlaktewater dat tot zijn beheer behoort, betreft, met betrekking tot dat geval:

      a. de in [artikel 76n, derde lid][ref2], bedoelde kosten per geval, tot ten hoogste het bedrag dat wordt
      verkregen door een bij algemene maatregel van bestuur vast te stellen bedrag te vermenigvuldigen met het aantal
      inwonerequivalenten waarover de betrokken waterkwaliteitsbeheerder op 1 januari van het jaar waarop de bijdrage
      verschuldigd wordt, de heffing, bedoeld in [artikel 21 van de Wet verontreiniging oppervlaktewateren][ref3], heft,
      en daarenboven,

      b. indien de in [artikel 76n, derde lid][ref4], bedoelde kosten per geval meer bedragen dan het bij toepassing van
      onderdeel a door vermenigvuldiging verkregen bedrag, tien procent van het overblijvende gedeelte van die kosten.

      2 Bij de maatregel, bedoeld in het eerste lid, onder a, wordt een maximum gesteld aan het bij toepassing van dat
      onderdeel door vermenigvuldiging verkregen bedrag.

      3 Voor de berekening van de kosten per geval, als bedoeld in het eerste lid, worden de kosten van de gevallen
      waarvan de sanering met toepassing van [artikel 42][ref5] tezelfdertijd wordt begonnen, beschouwd als kosten van
      een enkel geval.

      4 De waterkwaliteitsbeheerder draagt de volledige kosten van oriënterend onderzoek van gevallen die de bodem onder
      oppervlaktewater betreffen, die tot zijn beheer behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel76n
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel76n
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel42
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel76o
