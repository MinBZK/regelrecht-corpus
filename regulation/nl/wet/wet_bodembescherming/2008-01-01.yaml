  - number: '51'
    text: |-
      1 Gedeputeerde staten kunnen na overleg met burgemeester en wethouders, de provinciale
      planologische commissie gehoord, burgemeester en wethouders uitnodigen om met toepassing van
      [artikel 17, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1] voor een door hen te bepalen termijn van ten
      hoogste vijf jaren vrijstelling te verlenen van een bestemmingsplan, indien het met het oog op de voortgang van
      de bodemsanering noodzakelijk is voor die termijn grond of ander materiaal op te slaan in afwijking van dat plan.
      Indien niet binnen acht weken nadat die uitnodiging is verzonden, daaraan gevolg is gegeven, kunnen gedeputeerde
      staten de vrijstelling verlenen.

      2 Het bij of krachtens de [artikelen 15, derde lid][ref2], en
      [17, tweede tot en met zevende lid, van de Wet op de Ruimtelijke Ordening][ref3] bepaalde is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
