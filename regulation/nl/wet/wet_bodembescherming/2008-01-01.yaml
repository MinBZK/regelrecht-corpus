  - number: '52'
    text: |-
      Gedeputeerde staten betrekken bij de uitvoering van het nader onderzoek, of, in een geval van ernstige
      verontreiniging, dat is opgenomen in het provinciaal milieuprogramma, het saneringsonderzoek of de sanering
      burgemeester en wethouders alsmede de ingezetenen van de betrokken gemeente en belanghebbenden, op de wijze
      voorzien in de krachtens [artikel 147 van de Provinciewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel147
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel52
    references:
