        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '35'
    text: |-
      1 Voor zover de verontreiniging of aantasting de bodem onder oppervlaktewater betreft, berusten - in
      afwijking van [artikel 30][ref1] - de in dat artikel aan gedeputeerde staten toegekende bevoegdheden bij
      de waterkwaliteitsbeheerder. Gelijke bevoegdheden berusten bij de waterkwaliteitsbeheerder voor zover de
      verontreiniging of aantasting de kust of de oever van oppervlaktewater betreft, tenzij redelijkerwijs kan worden
      aangenomen dat die verontreiniging of aantasting geen gevolgen heeft voor de bodem onder dat water.

      2 In een geval als bedoeld in het eerste lid:

      a. heeft, behoudens indien de verontreiniging of aantasting de bodem onder of de kust of de oever van
      oppervlaktewater betreft waarvoor Onze Minister van Verkeer en Waterstaat waterkwaliteitsbeheerder is, Onze
      commissaris in de provincie waar de verontreiniging of aantasting zich voordoet, de in [artikel 31][ref2] bedoelde
      bevoegdheden totdat de waterkwaliteitsbeheerder van zijn bevoegdheden gebruik maakt;

      b. zijn [de artikelen 32][ref3] tot en met [34][ref4] van overeenkomstige toepassing, met dien verstande dat
      voor de toepassing van die artikelen gedeputeerde staten van de betrokken provincie worden gelijkgesteld met de
      burgemeester van de betrokken gemeente.

      3 Ten aanzien van de schade ten gevolge van een overeenkomstig het eerste lid j°
      [artikel 30, derde of vierde lid][ref5], door de waterkwaliteitsbeheerder gegeven bevel is [artikel 74][ref6] van
      overeenkomstige toepassing.


