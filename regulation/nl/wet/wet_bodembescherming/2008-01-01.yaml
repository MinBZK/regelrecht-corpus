  - number: 39e
    text: |-
      1 De eigenaar, erfpachter of gebruiker van het grondgebied waar sprake is van verontreiniging als bedoeld
      in [artikel 39d][ref1], neemt de beperkingen in het gebruik van de bodem in acht die zijn beschreven in het
      nazorgplan, bedoeld in het eerste lid van dat artikel.

      2 Met de uitvoering van de maatregelen die zijn beschreven in het nazorgplan, is belast degene die de bodem
      heeft gesaneerd, dan wel degene die daartoe is aangewezen in het nazorgplan, waarmee gedeputeerde staten hebben
      ingestemd. De uitvoering geschiedt overeenkomstig het nazorgplan waarmee door gedeputeerde staten is ingestemd, en
      overeenkomstig de voorschriften die aan de instemming zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel39e
