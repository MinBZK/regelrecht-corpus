  - number: 39d
    text: |-
      1 Indien na de sanering verontreiniging in de bodem aanwezig is gebleven en in het verslag, bedoeld in
      [artikel 39c][ref1] is aangegeven dat beperkingen in het gebruik van de bodem of maatregelen als bedoeld in
      [artikel 39c, eerste lid, onder f][ref2], noodzakelijk zijn, wordt tegelijk met of zo spoedig mogelijk na de
      toezending van dat verslag door degene die de bodem heeft gesaneerd een nazorgplan ingediend waarin die beperkingen
      in het gebruik of die maatregelen worden beschreven. Het nazorgplan bevat tevens een begroting van de kosten van
      de maatregelen.

      2 De maatregelen kunnen onder meer inhouden:

      a. het regelmatig inspecteren van de voorzieningen die ter uitvoering van de sanering zijn aangebracht en de
      tijdstippen waarop hierover tussentijds aan het bevoegd gezag verslag wordt gedaan;

      b. het in stand houden en onderhouden alsmede waar nodig het herstellen, verbeteren of vervangen van die
      voorzieningen.

      3 Het nazorgplan behoeft de instemming van gedeputeerde staten, die slechts met het nazorgplan instemmen indien de
      daarin opgenomen beperkingen in het gebruik van de bodem of maatregelen naar hun oordeel voldoende zijn om er voor
      te zorgen dat de verontreiniging die na de sanering is achtergebleven niet zal leiden tot een vermindering van de
      kwaliteit van de bodem zoals beschreven in het verslag op grond van [artikel 39c, eerste lid, onder b][ref3]. Met
      de uitvoering van het nazorgplan kan worden begonnen nadat gedeputeerde staten met dat plan hebben ingestemd of
      die instemming van rechtswege is verleend. Aan de instemming kunnen voorschriften worden verbonden. De instemming
      is van rechtswege verleend, indien gedeputeerde staten niet binnen de termijn van zes maanden na ontvangst van het
      nazorgplan een beslissing hebben genomen. Een instemming van rechtswege wordt aangemerkt als een besluit in de zin
      van [artikel 1:3 van de Algemene wet bestuursrecht][ref4]. [Artikel 28, vijfde lid][ref5], is van overeenkomstige
      toepassing voor wat betreft de instemming met het nazorgplan.

      4 Bij de beschikking tot instemming met het nazorgplan kunnen gedeputeerde staten aangeven welke wijzigingen in het
      gebruik van de bodem aan hen dienen te worden gemeld. Naar aanleiding van die melding kunnen gedeputeerde staten
      bepalen dat een aanvullende sanering moet plaatsvinden.

      5 Provinciale staten kunnen nadere regels stellen omtrent de gegevens die in het nazorgplan worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel28
