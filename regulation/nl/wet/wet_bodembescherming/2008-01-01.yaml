        artikel: '147'
  - number: '53'
    text: |-
      1 Burgemeester en wethouders kunnen gedeputeerde staten verzoeken hen te belasten met het onderzoek van
      onderzoeksgevallen, het saneringsonderzoek of de sanering van gevallen van ernstige verontreiniging, voor zover
      zodanig onderzoek of sanering door of vanwege gedeputeerde staten op het grondgebied van hun gemeente zal worden
      uitgevoerd.

      2 Gedeputeerde staten beslissen op een verzoek als bedoeld in het eerste lid binnen vier weken na de ontvangst
      daarvan. Van de beschikking wordt mededeling gedaan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel53
  - number: '54'
    text: |-
      [Artikel 52][ref1] is van overeenkomstige toepassing indien burgemeester en wethouders overgaan tot het onderzoek
      van onderzoeksgevallen of het saneringsonderzoek of de sanering van gevallen van ernstige verontreiniging, met dien
      verstande dat de verordening door de gemeenteraad wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel52
    url: https://wetten.overheid.nl/BWBR0003994/2008-01-01#Artikel54
