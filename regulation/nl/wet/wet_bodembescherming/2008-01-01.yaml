  - number: 63f
    text: |-
      In gevallen als bedoeld in [artikel 63d, eerste lid][ref1]:

      a. stellen gedeputeerde staten, ingeval een melding wordt gedaan overeenkomstig [artikel 27][ref2] of [28][ref3],
      tevens de waterkwaliteitsbeheerder daarvan op de hoogte;

      b. nemen gedeputeerde staten geen beschikking als bedoeld in [de artikelen 29, eerste lid][ref4],
      [37, zesde lid][ref5], [38, derde of vierde lid][ref6], [39, tweede, vierde of vijfde lid][ref7],
      [39c, tweede lid][ref8], [39d, derde lid][ref9], of [40, eerste of tweede lid][ref10], dan na de
      waterkwaliteitsbeheerder de gelegenheid te hebben geboden hen terzake van advies te dienen en stellen zij de
      waterkwaliteitsbeheerder van de door hen genomen beschikking op de hoogte;

      c. gaan gedeputeerde staten niet over tot het geven van een bevel krachtens [artikel 43][ref11] dan na tevens
      de waterkwaliteitsbeheerder de gelegenheid te hebben geboden hen terzake van advies te dienen en zenden zij een
      exemplaar van de beschikking ook aan de waterkwaliteitsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
