  - number: '40'
    text: |-
      1 Indien het belang van de bescherming van de bodem zich daartegen niet verzet, kunnen gedeputeerde staten, in
      afwijking van de [artikelen 28][ref1] en [39][ref2], toestaan bij een melding als bedoeld in [artikel 28][ref3],
      die een voornemen betreft om een handeling te verrichten ten gevolge waarvan slechts een gedeelte van de
      verontreiniging van de bodem wordt verplaatst, te volstaan met het verstrekken van:

      a. de resultaten van een nader onderzoek van het betrokken gedeelte en

      b. een saneringsplan voor het betrokken gedeelte.

      2 De stukken, bedoeld in het eerste lid, behoeven de instemming van gedeputeerde staten.
      [Artikel 39, tweede lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
