  - number: '74'
    text: |-
      1 De schade ten gevolge van een bevel als bedoeld in [artikel 30, derde of vierde lid][ref1], of artikel 49 j°
      [artikel 30, derde of vierde lid][ref2], wordt vergoed door gedeputeerde staten of door burgemeester en wethouders
      die het bevel hebben gegeven.

      2 Indien gedeputeerde staten of burgemeester en wethouders een bevel hadden kunnen geven als bedoeld in
      [artikel 30, derde of vierde lid][ref3], of artikel 49 j ° [artikel 30, derde of vierde lid][ref4], maar dat
      achterwege hebben gelaten in verband met de vrijwillige medewerking van degene tot wie het bevel had kunnen worden
      gericht, is het eerste lid van overeenkomstige toepassing.

      3 Geen vergoeding van schade vindt plaats voor zover de schade is toe te rekenen aan de tot schadevergoeding
      gerechtigde, dan wel voor zover deze door de schadevergoeding ongerechtvaardigd wordt verrijkt.

      4 De vordering tot schadevergoeding staat ter kennisneming van de rechtbank binnen het rechtsgebied waarvan het
      betrokken grondgebied is gelegen.


