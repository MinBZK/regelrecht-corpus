  - number: '90'
    text: |-
      1 Wij kunnen in het belang van de landsverdediging van krachtens [hoofdstuk III][ref1] en [hoofdstuk IV][ref2],
      paragraaf 3, gestelde regels:

      a. bij algemene maatregel van bestuur vrijstelling verlenen;

      b. op daartoe strekkend verzoek ontheffing verlenen.

      2 Aan een vrijstelling of ontheffing worden de voorschriften verbonden die naar Ons oordeel in het belang van de
      bescherming van de bodem nodig zijn.

      3 De voordracht voor een besluit krachtens het eerste lid wordt Ons niet gedaan dan op verzoek van Onze Minister
      van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0003994#HoofdstukIV
