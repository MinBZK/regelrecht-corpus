  - number: 75a
    text: |-
      1 De [artikelen 76 tot en met 83][ref1] zijn niet van toepassing op de kosten van het
      onderzoek van onderzoeksgevallen en van het saneringsonderzoek en de sanering van gevallen
      van ernstige verontreiniging die worden genoemd in een ontwikkelingsprogramma als bedoeld in
      [artikel 7, eerste lid, van de Wet stedelijke vernieuwing][ref2], een aanvraag als bedoeld in
      [artikel 7, vierde lid, van die wet][ref3] of een aanvraag voor een subsidie als bedoeld in de
      [artikelen 19, eerste lid][ref4], of [20, eerste lid, van die wet][ref5].

      2 Bijdragen als bedoeld in [artikel 76][ref6] worden niet gebruikt voor het onderzoek van onderzoeksgevallen
      en van het saneringsonderzoek en de sanering van gevallen van ernstige verontreiniging die worden genoemd in
      een ontwikkelingsprogramma als bedoeld in [artikel 7, eerste lid, van de Wet stedelijke vernieuwing][ref7], een
      aanvraag als bedoeld in [artikel 7, vierde lid, van die wet][ref8] of een aanvraag voor een subsidie als bedoeld in
      de [artikelen 19, eerste lid][ref9], of [20, eerste lid, van die wet][ref10].


