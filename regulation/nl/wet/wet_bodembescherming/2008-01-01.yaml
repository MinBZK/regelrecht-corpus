  - number: '89'
    text: |-
      Voor de toepassing van de [artikelen 28][ref1], [32 tot en met 34][ref2], [35][ref3] j ° [artikel 32][ref4],
      [33][ref5] of [34][ref6], [41][ref7], [43][ref8], [45][ref9], [47][ref10], [49][ref11], [51][ref12],
      [52 tot en met 54][ref13] en [75][ref14] wordt onderscheidenlijk het gebied van een bovengemeentelijk openbaar
      lichaam met een gemeente en het bestuur van zodanig lichaam met de gemeenteraad, onderscheidenlijk burgemeester en
      wethouders gelijk gesteld.


