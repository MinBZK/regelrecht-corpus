        artikel: '1.1'
  - number: '2'
    text: Er is een Technische commissie bodem.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel2
  - number: 2a
    text: |-
      1 De commissie heeft tot taak Onze Minister desgevraagd te adviseren over de uitvoering van wettelijke
      voorschriften en beleid, voor zover deze betrekking hebben op aangelegenheden van technische aard op het gebied van
      de bodembescherming.

      2 Een verzoek om advies omtrent een aangelegenheid die niet in de eerste plaats tot de verantwoordelijkheid van
      Onze Minister behoort, wordt door deze gedaan in overeenstemming met Onze Minister wie die aangelegenheid in het
      bijzonder aangaat.

      3 Een advies omtrent een aangelegenheid als bedoeld in het tweede lid wordt door de commissie mede toegezonden aan
      Onze Minister wie deze aangelegenheid in het bijzonder aangaat.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel2a
  - number: 2b
    text: |-
      Onze Minister en Onze Ministers wie het mede aangaat, dragen er zorg voor dat de commissie op de hoogte wordt
      gehouden ten aanzien van het beleid op het gebied van de bodembescherming.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel2b
  - number: 2c
    text: |-
      Telkens binnen een termijn van vier jaren brengt de commissie een rapport uit aan Onze Minister, waarin ten minste
      de taak, de samenstelling, de inrichting en werkwijze van de commissie aan een onderzoek worden onderworpen. Onze
      Minister zendt dit rapport, voorzien van zijn standpunt, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel2c
  - number: '3'
    text: |-
      1 De commissie bestaat uit een voorzitter en ten hoogste elf andere leden.

      2 De voorzitter en de andere leden van de commissie worden benoemd op grond van hun deskundigheid op het gebied van
      de bodembescherming.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel3
  - number: 3a
    text: |-
      1 De voorzitter en de andere leden van de commissie worden door Onze Minister benoemd. Onze Minister hoort de
      commissie alvorens hij de voorzitter benoemt.

      2 De voorzitter en de leden worden voor de tijd van vier jaren benoemd. Zij zijn terstond weer benoembaar.

      3 De voorzitter en de leden kunnen te allen tijde hun functie neerleggen door een schriftelijke kennisgeving aan
      Onze Minister.

      4 In bijzondere gevallen kunnen de voorzitter en de leden door Onze Minister in hun functie worden geschorst en uit
      hun functie worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel3a
  - number: 3b
    text: |-
      1 De commissie wijst uit haar midden een plaatsvervangend voorzitter aan.

      2 De plaatsvervangend voorzitter kan te allen tijde zijn functie neerleggen door een schriftelijke kennisgeving aan
      de voorzitter.

      3 In bijzondere gevallen kan de commissie de plaatsvervangend voorzitter in zijn functie schorsen en uit zijn
      functie ontslaan.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel3b
  - number: '4'
    text: |-
      1 De commissie wordt bijgestaan door een secretaris.

      2 De secretaris wordt door Onze Minister benoemd, in zijn functie geschorst en uit zijn functie ontslagen, de
      commissie gehoord.

      3 De secretaris is geen lid van de commissie.

      4 De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de commissie.

      5 Onze Minister kan voorzien in een bureau voor de commissie, dat onder leiding staat van de secretaris.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel4
  - number: '5'
    text: |-
      1 De commissie kan zich bij haar werkzaamheden doen bijstaan door personen die geen lid zijn van de commissie.

      2 Onze Minister kan ambtenaren aanwijzen, die bevoegd zijn tot het bijwonen van de door de commissie te houden
      vergaderingen, met dien verstande dat in de vergaderingen van de commissie ten hoogste één van die ambtenaren
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5
  - number: 5a
    text: |-
      1 De vergaderingen van de commissie zijn openbaar.

      2 Een vergadering of een gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 5.1, eerste lid, van de Wet open overheid][ref1] en in gevallen waarin het belang van openbaarheid niet
      opweegt tegen de in artikel 5.1, tweede lid, van die wet genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: 5b
    text: |-
      1 De adviezen van de commissie worden uitgebracht overeenkomstig het gevoelen van de meerderheid van de
      vergadering.

      2 Ter vergadering ingebrachte minderheidsstandpunten worden in of bij de adviezen vermeld.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5b
  - number: 5c
    text: |-
      De commissie houdt de op de door haar uitgebrachte adviezen betrekking hebbende voorbereidende stukken ter
      beschikking van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5c
  - number: 5d
    text: |-
      1 De voorzitter van de commissie pleegt ten minste eenmaal per jaar overleg met Onze Minister over de door de
      commissie voorgenomen werkzaamheden voor de komende twaalf maanden. De commissie stelt vervolgens het programma van
      haar werkzaamheden vast en zendt dit aan Onze Minister.

      2 Ten behoeve van de voorbereiding van het in het eerste lid bedoelde overleg stelt de commissie een overzicht van
      de door haar voorgenomen werkzaamheden op en legt dit tijdig aan Onze Minister voor. De commissie voegt bij het
      overzicht een raming van de met de uitvoering van de werkzaamheden gepaard gaande kosten.

      3 De commissie oefent haar werkzaamheden uit binnen het raam van de middelen welke haar jaarlijks ingevolge de
      begrotingswet ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5d
  - number: 5e
    text: De commissie stelt nadere regels betreffende haar werkwijze en zendt deze aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel5e
  - number: '6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels
      worden gesteld met betrekking tot het verrichten van handelingen waarbij stoffen die de bodem kunnen verontreinigen
      of aantasten, op of in de bodem worden gebracht, ten einde deze aldaar te laten.

      2 Hiertoe kunnen behoren regels met betrekking tot:

      a. het ter bewaring opslaan van bij die maatregel aan te geven stoffen op of in de bodem;

      b. het brengen van afvalstoffen op of in de bodem;

      c. het op of in de bodem doen uitstromen van verontreinigd water of slib;

      d. het begraven van stoffelijke resten;

      e. het op de bodem verspreiden van as, afkomstig van de verbranding van stoffelijke resten.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel6
  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels
      worden gesteld met betrekking tot het verrichten van handelingen waarbij stoffen die de bodem kunnen verontreinigen
      of aantasten, aan de bodem worden toegevoegd, ten einde de structuur of de kwaliteit van de bodem te beïnvloeden.

      2 Hiertoe kunnen behoren regels met betrekking tot:

      a. het op of in de bodem brengen van stoffen die de draagkracht van de bodem beïnvloeden;

      b. het op of in de bodem brengen van meststoffen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel7
  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels
      worden gesteld met betrekking tot het uitvoeren of gebruik maken van werken op of in de bodem, waarbij ingrepen
      worden verricht of stoffen worden gebruikt, die de bodem kunnen verontreinigen of aantasten.

      2 Hiertoe kunnen behoren regels met betrekking tot:

      a. grond- en funderingswerken;

      b. bodemonderzoek;

      c. de aanleg van pijpleidingen of andere leidingen;

      d. het aanbrengen van opslagtanks of reservoirs;

      e. ontginningen, ontgrondingen of ontgravingen;

      f. diepe grondbewerking;

      g. werken in het kader van ontwatering, bronnering of grondwaterwinning;

      h. werken ten behoeve van een bodemenergiesysteem.

      3 Ten aanzien van werken als bedoeld in het tweede lid, onder h, kunnen de in het eerste lid bedoelde regels ook
      worden gesteld in het belang van een doelmatig gebruik van bodemenergie.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel8
  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels worden gesteld
      met betrekking tot het transporteren van bij die maatregel aan te geven stoffen die de bodem kunnen verontreinigen
      of aantasten.

      2 Hiertoe kunnen behoren regels met betrekking tot:

      a. het transporteren van zodanige stoffen met behulp van pijpleidingen of andere leidingen;

      b. het verrichten van overslaghandelingen met zodanige stoffen;

      c. het transporteren van zodanige stoffen met behulp van voertuigen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel9
  - number: '10'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels worden gesteld met
      betrekking tot het verrichten van handelingen waarbij als nevengevolg stoffen die de bodem kunnen verontreinigen of
      aantasten, op of in de bodem geraken.

      2 Hiertoe kunnen behoren regels met betrekking tot:

      a. het toepassen van gladheidsbestrijdingsmiddelen;

      b. het met bij die maatregel aan te geven stoffen behandelen van voorwerpen, ten einde oppervlaktelagen daarop aan
      te brengen of daarvan te verwijderen;

      c. het bewerken van voorwerpen, waarbij bij die maatregel aan te geven stoffen vrijkomen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel10
  - number: '11'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem regels worden gesteld met
      betrekking tot het verrichten van niet onder [de artikelen 6][ref1] tot en met [10][ref2] vallende handelingen die
      erosie, verdichting of verzilting van de bodem tot gevolg kunnen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel10
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel11
