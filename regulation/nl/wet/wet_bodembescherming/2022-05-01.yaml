  - number: 63c
    text: |-
      1 In afwijking van [artikel 99, vierde lid][ref1], zijn de [artikelen 28][ref2], [28a][ref3] en [29][ref4], de
      [paragrafen 3][ref5] en [3a van hoofdstuk IV][ref6] en [artikel 75][ref7] mede van toepassing op de bodem of oever
      van een oppervlaktewaterlichaam, indien:

      a. een geval van ernstige verontreiniging zich mede uitstrekt tot die bodem of oever;

      b. voor dat geval overeenkomstig [artikel 37][ref8], eerste lid, is vastgesteld dat spoedige sanering noodzakelijk
      is; en

      c. de bron van de verontreiniging of aantasting buiten die bodem of oever is gelegen.

      2 In een geval als bedoeld in het eerste lid plegen gedeputeerde staten, alvorens van hun bevoegdheden gebruik te
      maken, ter zake overleg met de beheerder.


