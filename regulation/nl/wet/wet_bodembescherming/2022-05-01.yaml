  - number: 28a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de beoordeling van de reinigbaarheid of de immobiliseerbaarheid van verontreinigde grond, bedoeld in
      de [artikelen 27][ref1] en [28][ref2] van deze wet of in een algemene maatregel van bestuur krachtens
      [artikel 8.40 van de Wet milieubeheer][ref3];

      b. de wijze van indeling in partijen van de verontreinigde bodem op de te ontgraven locatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel28
