  - number: '30'
    text: |-
      1 Indien ten gevolge van een ongewoon voorval een geval van ernstige verontreiniging ontstaat of de bodem
      ernstig is of dreigt te worden aangetast, nemen gedeputeerde staten onverwijld de naar hun oordeel noodzakelijke
      maatregelen ten einde de oorzaak van de verontreiniging of aantasting weg te nemen en de verontreiniging of de
      aantasting en de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.

      2 Met betrekking tot degene die een handeling verricht, die naar het oordeel van gedeputeerde staten de oorzaak of
      mede de oorzaak is van de verontreiniging of aantasting, kunnen de in het eerste lid bedoelde maatregelen inhouden:

      a. een bevel die handeling te staken;

      b. een bevel die handeling te staken indien niet voldaan wordt aan door gedeputeerde staten te stellen eisen.

      3 Met betrekking tot degene op wiens grondgebied de oorzaak van de verontreiniging of de aantasting zich bevindt,
      dan wel de verontreiniging, de aantasting of de directe gevolgen zich voordoen, kunnen de in het eerste lid
      bedoelde maatregelen een bevel inhouden daarbij aan te geven personen op zijn grondgebied toe te laten en in de
      gelegenheid te stellen, zonodig met gebruik van hulpmiddelen:

      a. ter plaatse een onderzoek in te stellen naar de oorzaak en de omvang van de verontreiniging, de aantasting of de
      directe gevolgen;

      b. de oorzaak van de verontreiniging of de aantasting weg te nemen dan wel de verontreiniging of de aantasting en
      de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.

      4 Met betrekking tot degene op wiens grondgebied maatregelen moeten worden getroffen om op een in de directe
      omgeving gelegen grondgebied van een ander de verontreiniging of de aantasting en de directe gevolgen daarvan te
      kunnen beperken en zoveel mogelijk ongedaan te maken, kunnen de in het eerste lid bedoelde maatregelen een bevel
      inhouden daarbij aan te geven personen op zijn grondgebied toe te laten en in de gelegenheid te stellen de daarbij
      aan te geven maatregelen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel30
  - number: '31'
    text: |-
      Indien Onze commissaris in de provincie waar een verontreiniging of aantasting als bedoeld in [artikel 30][ref1]
      zich voordoet, van oordeel is dat deze een zodanig gevaar voor het milieu oplevert, dan wel daarvan een zodanige
      schade aan goederen te duchten is dat onverwijld handelen noodzakelijk is, worden de in [artikel 30][ref2] bedoelde
      maatregelen, zolang deze toestand voortduurt en totdat gedeputeerde staten van hun bevoegdheden gebruik maken, door
      hem genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel30
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel31
