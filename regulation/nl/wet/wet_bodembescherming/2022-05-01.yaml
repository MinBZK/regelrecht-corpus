        artikel: '36'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '92'
    text: |-
      1 Het ontwerp van een algemene maatregel van bestuur krachtens de [artikelen 6 tot en met 12b][ref1], [36][ref2]
      en [38, tweede lid][ref3], of [72][ref4], wordt overgelegd aan de beide kamers der Staten-Generaal en in de
      *Staatscourant* bekendgemaakt. Aan een ieder wordt de gelegenheid geboden binnen een bij die bekendmaking te
      stellen termijn van ten minste vier weken opmerkingen over het ontwerp schriftelijk ter kennis van Onze Minister
      te brengen.

      2 Een algemene maatregel van bestuur krachtens de [artikelen 6 tot en met 12b][ref5], of [72][ref6], wordt, nadat
      hij is vastgesteld, toegezonden aan beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst.

      3 Een krachtens de [artikelen 36][ref7] en [38, tweede lid][ref8], vastgestelde algemene maatregel van bestuur
      treedt in werking op een tijdstip dat, nadat vier weken na de toezending ervan aan de Staten-Generaal zijn
      verstreken, bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der Kamers der
      Staten-Generaal de wens te kennen wordt gegeven dat het in de algemene maatregel van bestuur geregelde onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en
      wordt de algemene maatregel van bestuur onverwijld ingetrokken.

      4 Het derde lid is niet van toepassing, indien een krachtens de [artikelen 36][ref9] en [38, tweede lid][ref10],
      vastgestelde algemene maatregel van bestuur uitsluitend strekt ter uitvoering van een voor Nederland verbindend
      verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie. In dat geval wordt de
      procedure, bedoeld in het tweede lid, gevolgd.


