  - number: '97'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 12b][ref1] wordt voorzien in
      hetgeen met betrekking tot het gaan gelden van het in zodanige maatregel bepaalde regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '6'
        hoofdstuk: III
  - number: '98'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie, worden voor
      zover nodig bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die de in deze
      wet vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij de uitvoering dienen te worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel98
  - number: '99'
    text: |-
      1 De [artikelen 6 tot en met 12b][ref1] zijn niet van toepassing op gedragingen, voor zover daaromtrent
      regels gelden, die zijn gesteld bij of krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref2], de
      [Kernenergiewet][ref3] en [hoofdstuk 2 van de Wet natuurbescherming][ref4].

      2 De [artikelen 6 tot en met 12b][ref5] zijn niet van toepassing op mijnbouwwerken als bedoeld in
      [artikel 1 van de Mijnbouwwet][ref6]. Bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 49 van de Mijnbouwwet][ref7] kan worden bepaald dat de artikelen 6 tot en met 12b en de daarop berustende
      bepalingen geheel of gedeeltelijk wel van toepassing zijn op deze werken.

      3 De [artikelen 27 tot en met 51][ref8] en [53][ref9] zijn niet van toepassing ten aanzien van maatregelen met
      het oog op ongewone voorvallen of sanering van de bodem, voor zover daarin kan worden voorzien krachtens de
      [artikelen 39][ref10] en [44 van de Kernenergiewet][ref11].

      4 Deze wet is niet van toepassing op de bodem en de oevers van een oppervlaktewaterlichaam als bedoeld in
      [artikel 1.1 van de Waterwet][ref12] en, voor zover het oppervlaktewaterlichaam behoort tot de zee, bedoeld in dat
      artikel, de ondergrond van de zeebodem.


