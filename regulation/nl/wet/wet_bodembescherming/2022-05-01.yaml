    text: |-
      Gedeputeerde staten zijn belast met het oriënterend onderzoek en het nader onderzoek in hun provincie alsmede
      met het saneringsonderzoek en de sanering van in hun provincie gelegen gevallen van ernstige verontreiniging
      voor zover daarin niet is voorzien op de wijze, bedoeld in [de artikelen 13][ref1], [27][ref2], [28][ref3],
      [43 tot en met 47][ref4], [55b][ref5] of [72][ref6].


