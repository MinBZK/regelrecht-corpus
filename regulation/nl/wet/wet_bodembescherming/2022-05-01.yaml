  - number: '38'
    text: |-
      1 Degene die de bodem saneert, voert de sanering zodanig uit dat:

      a. de bodem ten minste geschikt wordt gemaakt voor de functie die hij na de sanering krijgt waarbij het risico voor
      mens, plant of dier als gevolg van blootstelling aan de verontreiniging zoveel mogelijk wordt beperkt;

      b. het risico van de verspreiding van verontreinigende stoffen zoveel mogelijk wordt beperkt;

      c. de noodzaak tot het nemen van maatregelen en beperkingen in het gebruik van de bodem als bedoeld in
      [artikel 39c][ref1] en [artikel 39d][ref2] zoveel mogelijk wordt beperkt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het bepaalde in het eerste lid nadere
      regels worden gesteld.

      3 Indien het belang van de bescherming van de bodem zich daartegen niet verzet, kunnen gedeputeerde staten op
      verzoek van degene die de bodem saneert, bepalen dat de sanering in fasen wordt uitgevoerd. Zij geven daarbij aan:

      a. voor de uitvoering van welke fasen vooraf een melding aan hen wordt gedaan en welke gegevens daarbij worden
      overgelegd;

      b. in welke fase welke tijdelijke beveiligingsmaatregelen dienen te worden getroffen;

      c. op welke wijze en op welke tijdstippen aan hen verslag wordt gedaan van de uitvoering van de tijdelijke
      beveiligingsmaatregelen en

      d. welke wijzigingen van het gebruik van de bodem aan hen dienen te worden gemeld.

      4 Naar aanleiding van een melding als bedoeld in het derde lid, onder *a* of *d*, of een verslag als bedoeld in het
      derde lid, onder *c*, kunnen gedeputeerde staten aanwijzingen geven omtrent de verdere uitvoering van de sanering,
      die een wijziging inhouden van onderdelen van het saneringsplan waarmee reeds is ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel38
