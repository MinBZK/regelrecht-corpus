        artikel: '37'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 55b
    text: |-
      1 De eigenaar of indien op het bedrijfsterrein een recht van erfpacht rust, de erfpachter van een bedrijfsterrein
      waar een geval van ernstige verontreiniging is ontstaan, is verplicht de bodem te saneren indien in een beschikking
      als bedoeld in [artikel 37, eerste lid][ref1], is vastgesteld dat spoedige sanering noodzakelijk is. Met de
      sanering wordt begonnen uiterlijk voor het tijdstip dat is bepaald in de beschikking. De bedoelde eigenaar of
      erfpachter is verplicht tijdelijke beveiligingsmaatregelen als bedoeld in [artikel 37, derde lid][ref2], of
      maatregelen als bedoeld in [artikel 37, vierde lid][ref3], te nemen en van de uitvoering van die maatregelen
      verslag te doen, voor zover dat is aangegeven in de beschikking, bedoeld in [artikel 37, eerste lid][ref4].

      2 [Artikel 43, derde lid][ref5], is niet van toepassing voor zover het de mogelijkheid van gedeputeerde staten
      betreft om de eigenaar of de erfpachter van een bedrijfsterrein als bedoeld in het eerste lid, te bevelen de
      bodem te saneren, tijdelijke beveiligingsmaatregelen te nemen dan wel de maatregelen te nemen die zijn aangegeven
      overeenkomstig [artikel 37, vierde lid][ref6].

      3 Indien de eigendom of de erfpacht wordt overgedragen, blijft de verplichting om te saneren mede rusten op de
      eigenaar of de erfpachter die zijn eigendom respectievelijk zijn recht van erfpacht heeft overgedragen tot het
      tijdstip waarop de opvolgende eigenaar of de opvolgende erfpachter financiële zekerheid voor de saneringskosten
      heeft gesteld, en daarmee door gedeputeerde staten is ingestemd. [Artikel 39f, tweede lid][ref7], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
