  - number: '95'
    text: |-
      1 Met betrekking tot de kwaliteit van de uitvoering en handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 5.3 tot en met 5.16][ref1] en [5.18 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref2]
      van toepassing.

      2 Het in [artikel 5.2, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3] bedoelde bestuursorgaan
      heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van het bepaalde bij of
      krachtens deze wet voor degene die het project, bedoeld in dat lid, uitvoert, geldende voorschriften.

      3 Onze betrokken Minister, gedeputeerde staten en burgemeester en wethouders hebben tot taak zorg te dragen voor de
      bestuursrechtelijke handhaving van [artikel 13][ref4].

      4 De volgende bestuursorganen hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het
      bepaalde bij of krachtens [§ 3][ref5] en [§ 3a van hoofdstuk IV][ref6] en [artikel 72][ref7]:

      a. In gevallen als bedoeld in [artikel 88, eerste en vijfde lid][ref8],: burgemeester en wethouders;

      b. in andere gevallen: gedeputeerde staten.

      5 Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 12a][ref9] kan worden aangegeven
      onder welke voorwaarden en in welke gevallen de bevoegdheid tot bestuursrechtelijke handhaving niet bij het bevoegd
      gezag maar bij Onze Minister berust.


