    text: |-
      1 Van een beschikking krachtens [artikel 43][ref1] wordt mededeling gedaan aan burgemeester en wethouders van de
      betrokken gemeente en de inspecteur.

      2 In een geval als bedoeld in [artikel 45, zesde lid][ref2], wordt bovendien van de beschikking mededeling gedaan
      aan degene op wiens grondgebied dat onderzoeksgeval of geval van ernstige verontreiniging zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel43
