  - number: 39f
    text: |-
      1 Gedeputeerde staten kunnen aan de instemming met een saneringsplan, bedoeld in [artikel 39, tweede lid][ref1],
      onderscheidenlijk de instemming met een nazorgplan, bedoeld in [artikel 39d, derde lid][ref2], voorschriften
      verbinden tot het stellen van financiële zekerheid door degene die de bodem saneert voor het treffen
      van maatregelen ter uitvoering van het saneringsplan, onderscheidenlijk van maatregelen als bedoeld in
      [artikel 39d, eerste lid][ref3]. Daarbij wordt in ieder geval aangegeven het bedrag waarvoor de zekerheid ten
      hoogste in stand wordt gehouden.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze waarop
      financiële zekerheid zal worden gesteld, alsmede omtrent het instandhouden van de financiële zekerheidstelling.
      Bij de maatregel kan worden bepaald dat gedeputeerde staten het bij het niet nakomen van de verplichtingen waarvoor
      financiële zekerheid is gesteld te verhalen bedrag kunnen invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
