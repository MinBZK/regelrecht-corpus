  - number: 86a
    text: Met betrekking tot beschikkingen krachtens deze wet worden geen rechten geheven.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel86a
  - number: 87a
    text: |-
      1 Op verzoek van Onze Minister doen gedeputeerde staten verslag over:

      a. de uitvoering van deze wet op hun grondgebied, en

      b. de voortgang van de uitvoering van de bodemsaneringsoperatie.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop het verslag,
      bedoeld in het eerste lid, wordt gedaan, alsmede omtrent de gegevens die daarbij worden verstrekt.

      3 Naar aanleiding van het verslag, bedoeld in het eerste lid, kan een gesprek van Onze Minister met gedeputeerde
      staten over de uitvoering van de wet plaatsvinden.

      4 Burgemeester en wethouders van de gemeenten die niet in [artikel 88, eerste lid][ref1] of krachtens het vijfde
      lid, zijn genoemd, doen met betrekking tot het grondgebied van hun gemeente aan gedeputeerde staten van een
      provincie een opgave van de gegevens, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel87a
