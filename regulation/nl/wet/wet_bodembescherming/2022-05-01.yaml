  - number: '75'
    text: |-
      1 De Staat kan - behoudens matiging door de rechter - de ten laste van het Rijk komende kosten van onderzoek van
      onderzoeksgevallen en van saneringsonderzoek en sanering van gevallen van ernstige verontreiniging verhalen op
      degene door wiens onrechtmatige daad de verontreiniging of de aantasting van de bodem in het betrokken geval is
      veroorzaakt en die deswege of anderszins buiten overeenkomst jegens enige overheid krachtens burgerlijk recht
      aansprakelijk is voor de gevolgen daarvan.

      2 De Staat kan, indien kosten van een geval als bedoeld in het eerste lid, mede ten laste van een provincie of een
      gemeente komen, ook deze kosten overeenkomstig dat lid verhalen.

      3 De Staat kan ten laste van het Rijk komende kosten als bedoeld in het eerste lid, overeenkomstig de
      regels betreffende ongerechtvaardigde verrijking verhalen op degene die door dat onderzoek of die sanering
      ongerechtvaardigd wordt verrijkt. Het tweede lid is van overeenkomstige toepassing.

      4 De bevoegdheden, bedoeld in het eerste en derde lid, komen toe aan de provincie of de gemeente in gevallen waarin
      de kosten als bedoeld in het eerste lid geheel te haren laste komen, alsmede in gevallen waarin de Staat niet van
      deze bevoegdheid gebruik maakt, voor zover zodanige kosten te haren laste komen.

      5 In de gevallen waarin de veroorzaker van een verontreiniging of aantasting niet op grond van het eerste lid
      aansprakelijk is omdat hij door het verontreinigen of aantasten niet jegens enige overheid onrechtmatig handelde,
      kunnen de in dat lid bedoelde kosten niettemin door de Staat worden verhaald, indien aan de voorwaarden is voldaan,
      dat:

      a. de veroorzaker op het moment waarop de verontreiniging of aantasting door zijn toedoen werd veroorzaakt de
      ernstige gevaren kende die aan de stoffen die de verontreiniging of aantasting hebben veroorzaakt verbonden waren,
      dan wel deze gevaren behoorde te kennen, en

      b. de veroorzaker met het oog op deze ernstige gevaren zich ernstig verwijtbaar niet van de verontreinigende
      of aantastende gedragingen heeft onthouden, terwijl, indien deze gedragingen in beroep of bedrijf hebben
      plaatsgevonden, voor wat betreft de ernstige verwijtbaarheid in het bijzonder in aanmerking moeten worden genomen:

      1°. de destijds in vergelijkbare bedrijven gebruikelijke bedrijfsvoering, en

      2°. de destijds bestaande en voor de veroorzaker redelijkerwijs toepasbare alternatieven.

      6 Onze Minister kan mandaat verlenen aan gedeputeerde staten of burgemeester en wethouders om afstand te doen van
      het recht de ten laste van het Rijk komende kosten als bedoeld in het eerste lid overeenkomstig het eerste of derde
      lid te verhalen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel75
  - number: 76j
    text: |-
      1 Onze Minister kan voor bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling aangewezen
      activiteiten op het gebied van onderzoek en sanering van gevallen van ernstige verontreiniging subsidie
      verstrekken.

      2 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen in ieder geval regels worden
      gesteld omtrent:

      a. criteria voor de verstrekking;

      b. het tijdvak waarvoor de subsidie wordt verleend;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de aanvraag van een subsidie en de besluitvorming daarover;

      e. de verplichtingen voor de subsidie-ontvanger;

      f. het bedrag van de subsidie dan wel de wijze waarop dit wordt bepaald;

      g. de betaling van de subsidie en het verlenen van voorschotten.

      3 Onze Minister kan ieder jaar bij ministeriële regeling subsidieplafonds vaststellen voor de verschillende
      activiteiten waarvoor subsidie kan worden verstrekt. Daarbij bepaalt hij de wijze van verdeling van het beschikbare
      bedrag.

      4 Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel76j
  - number: 76k
    text: |-
      1 De door Onze Minister op grond van [artikel 76l, eerste lid][ref1], aangewezen personen zijn bevoegd van de
      aanvrager van een subsidie inlichtingen te vorderen. De [artikelen 5:13][ref2], [5:15][ref3], voor zover het door
      de aanvrager gebruikte plaatsen betreft, en [5:17 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige
      toepassing.

      2 Een aanvraag kan worden afgewezen, indien de aanvrager geen medewerking verleent bij de uitoefening van de in het
      eerste lid bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76l
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel513
