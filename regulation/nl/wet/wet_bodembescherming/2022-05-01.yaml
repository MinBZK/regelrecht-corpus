        artikel: '75'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '62'
    text: |-
      Burgemeester en wethouders beslissen binnen drie maanden op het verzoek. Zij zenden een afschrift van het verzoek
      en van hun beslissing daarop aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel62
  - number: '63'
    text: |-
      Geschillen over de beslissing van de gemeente op het verzoek of met betrekking tot de koopprijs staan ter
      kennisneming van de rechtbank binnen het rechtsgebied waarvan de woning is gelegen.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel63
  - number: 63a
    text: |-
      1 Voor de toepassing van deze paragraaf wordt onder «beheerder» verstaan hetgeen daaronder in
      [artikel 1.1 van de Waterwet][ref1] wordt verstaan.

      2 Voor de toepassing van deze paragraaf wordt onder «oppervlaktewaterlichaam» verstaan hetgeen daaronder in
      [artikel 1.1 van de Waterwet][ref2] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
