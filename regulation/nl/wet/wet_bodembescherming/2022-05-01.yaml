  - number: 55i
    text: |-
      Indien in het gebied meer dan één bestuursorgaan bevoegd is op grond van [artikel 88, eerste of vijfde lid][ref1],
      dan wel de artikelen genoemd in dat eerste lid, geldt dat de bevoegdheden van gedeputeerde staten, bedoeld in deze
      paragraaf, worden uitgeoefend door:

      a. gedeputeerde staten van de provincie waarin het grootste gedeelte van het gebied is gelegen, indien het gebied
      in meer dan één provincie is gelegen;

      b. burgemeester en wethoudersvan de gemeentewaarop [artikel 88, eerste lid][ref2], van toepassing is, indien
      op een deel van het gebied gedeputeerde staten bevoegd gezag is, en het grootste gedeelte van het gebied in die
      gemeente is gelegen;

      c. gedeputeerde staten, in alle overige grensoverschrijdende situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel88
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel55i
