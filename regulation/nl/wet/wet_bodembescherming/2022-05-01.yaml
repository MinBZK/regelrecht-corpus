        artikel: '10'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur worden ten aanzien van het infiltreren van water, bedoeld in
      [artikel 1.1 van de Waterwet][ref1], regels gesteld waarin wordt aangegeven:

      a. in welke gevallen sprake is van gevaar voor verontreiniging van het grondwater, als bedoeld in
      [artikel 6.26, tweede lid, van die wet][ref2];

      b. welke voorschriften ter bescherming van het grondwater moeten worden verbonden aan een vergunning voor dat
      infiltreren van water.

      2 Bij de maatregel kunnen ook anderszins regels ter bescherming van de bodem worden gesteld.

      3 Bij de maatregel kan worden bepaald dat de daarbij gestelde regels slechts gelden in daarbij aangegeven
      categorieën van gevallen.

      4 Bij de maatregel kan voorts worden bepaald in hoeverre gedeputeerde staten of het dagelijks bestuur van het
      waterschap met betrekking tot daarbij aangegeven onderwerpen van bij de maatregel gestelde regels kunnen afwijken,
      hetzij in het algemeen, hetzij in bij de maatregel aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.26
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6.26'
  - number: 12a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de bescherming van de bodem voor daarbij
      aangegeven categorieën van bodem regels worden gesteld ten aanzien van het toepassen van grond en baggerspecie op
      of in de bodem.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat bij besluit van een daarin aangewezen bestuursorgaan,
      grond of baggerspecie kan worden toegepast in andere gevallen dan die ingevolge de regels bedoeld in het eerste
      lid, mits dit geen onaanvaardbare risico’s oplevert voor de volksgezondheid en geen bedreiging vormt van de
      functionele eigenschappen van water, bodem en lucht voor mens, plant en dier. Een bestuursorgaan dat van deze
      mogelijkheid gebruik maakt stelt in het daartoe strekkend besluit de nodige eisen aan de kwaliteit, waaronder de
      samenstelling, van grond of baggerspecie.

      3 Tot de in het eerste lid bedoelde regels kunnen in elk geval behoren regels ten aanzien van de kwaliteit,
      waaronder de samenstelling en emissie, van grond of baggerspecie en de wijze van toetsing aan de kwaliteit en het
      gebruik van de bodem waarop of waarin grond of baggerspecie wordt toegepast.

      4 Bij de in het eerste lid bedoelde maatregel kan worden bepaald in welke gevallen de in het tweede lid bedoelde
      afwijking moet voldoen aan de krachtens [artikel 36][ref1] en [37, eerste en achtste lid][ref2], van de Wet
      bodembescherming gestelde regels.

      5 Bij de in het eerste lid bedoelde maatregel kan worden bepaald dat het aangewezen bestuursorgaan, bedoeld in het
      tweede lid, een kaart vaststelt met gegevens over de kwaliteit en functie van de bodem.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel12a
