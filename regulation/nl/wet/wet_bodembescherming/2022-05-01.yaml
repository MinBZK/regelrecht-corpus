        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '36'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen de functionele eigenschappen die de
      bodem voor mens, plant of dier heeft, ernstig zijn of dreigen te worden verminderd.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel36
  - number: '37'
    text: |-
      1 Gedeputeerde staten stellen in een beschikking als bedoeld in [artikel 29, eerste lid][ref1], waarbij zij
      vaststellen dat er sprake is van een geval van ernstige verontreiniging, tevens vast of het huidige dan wel
      voorgenomen gebruik van de bodem of de mogelijke verspreiding van de verontreiniging leiden tot zodanige risico's
      voor mens, plant of dier dat spoedige sanering noodzakelijk is.

      2 Indien gedeputeerde staten vaststellen dat van risico's sprake is als bedoeld in het eerste lid, bepalen zij dat
      met de sanering dient te worden begonnen voor een door hen vast te stellen tijdstip dat ligt zo spoedig mogelijk
      na de inwerkingtreding van de beschikking, bedoeld in het eerste lid. Bij de beschikking kunnen gedeputeerde staten
      het uiterste tijdstip van indienen van het saneringsplan, bedoeld in [artikel 39][ref2], aangeven.

      3 Bij de beschikking kunnen gedeputeerde staten aangeven welke tijdelijke beveiligingsmaatregelen aan de sanering
      vooraf dienen te gaan en op welke wijze en tijdstippen aan hen verslag wordt gedaan van de uitvoering van die
      maatregelen.

      4 Indien gedeputeerde staten vaststellen dat geen sprake is van risico’s als bedoeld in het eerste lid, kunnen
      gedeputeerde staten bij de beschikking aangeven welke maatregelen in het belang van de bescherming van de
      bodem genomen moeten worden en op welke wijze en tijdstippen aan hen verslag wordt gedaan van de uitvoering van
      die maatregelen. Tevens kan worden aangegeven welke beperkingen in het gebruik van de bodem door de eigenaar,
      erfpachter of gebruiker van het grondgebied waar sprake is van ernstige verontreiniging, in acht worden genomen.

      5 Bij de beschikking kunnen gedeputeerde staten aangeven door welke natuurlijke persoon of rechtspersoon een
      verplichting, bij de beschikking opgelegd met toepassing van het tweede lid, het derde lid of de eerste volzin van
      het vierde lid, moet worden nagekomen.

      6 Bij de beschikking geven gedeputeerde staten aan welke wijzigingen van het gebruik van de bodem aan hen dienen te
      worden gemeld.

      7 Gedeputeerde staten kunnen naar aanleiding van een verslag als bedoeld in het derde en vierde lid, een melding
      als bedoeld in het zesde lid, of een wijziging van omstandigheden de risico's, bedoeld in het eerste lid, anders
      vaststellen of het tijdstip van de sanering of van het indienen van het saneringsplan, bedoeld in het tweede lid,
      vaststellen of anders vaststellen.

      8 Bij de maatregel, bedoeld in [artikel 36][ref3], kunnen regels worden gesteld met betrekking tot de toepassing
      van het eerste, tweede en zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel36
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel37
