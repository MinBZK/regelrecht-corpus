  - number: '27'
    text: |-
      1 Degene die op of in de bodem handelingen verricht als bedoeld in de [artikelen 6 tot en met 11][ref1] en daarbij
      kennis neemt van een verontreiniging of aantasting van de bodem die door die handelingen wordt veroorzaakt, maakt
      zo spoedig mogelijk melding van de verontreiniging of de aantasting bij gedeputeerde staten van de provincie waar
      zij plaatsvindt, en geeft daarbij aan welke van de in [artikel 13][ref2] bedoelde maatregelen hij voornemens is te
      treffen of reeds heeft getroffen.

      2 In een geval als bedoeld in het eerste lid kunnen gedeputeerde staten aanwijzingen geven met betrekking tot
      de te nemen maatregelen. Gedeputeerde staten kunnen tevens een aanwijzing geven tot het laten beoordelen van
      de reinigbaarheid en de immobiliseerbaarheid van de verontreinigde grond op een bij die aanwijzing te bepalen
      wijze. Tenzij de geboden spoed zich daartegen verzet, geven gedeputeerde staten geen aanwijzing tot het afgraven
      van verontreinigde bodem, dan nadat zij kennis hebben genomen van het resultaat van de beoordeling van de
      reinigbaarheid en de immobiliseerbaarheid van die bodem.

      3 Degene die bij de handelingen is betrokken, maakt terstond melding van de verontreiniging of de aantasting bij
      degene die de handelingen verricht, dan wel bij gedeputeerde staten van de provincie waar zij plaatsvindt.

      4 Gedeputeerde staten stellen zo spoedig mogelijk burgemeester en wethouders van de gemeente waar zich de
      verontreiniging of de aantasting voordoet, op de hoogte van de meldingen die bij hen overeenkomstig het eerste of
      het derde lid zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel13
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel27
