  - number: '34'
    text: |-
      Een ingevolge [artikel 30][ref1] of 31 genomen beschikking wordt onverwijld aan de betrokkene bekendgemaakt alsmede
      medegedeeld aan de burgemeester van de gemeente waar de verontreiniging, de aantasting of de directe gevolgen
      daarvan zich voordoen en de provinciale milieucommissie, bedoeld in artikel 2.41 van de Wet milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel34
