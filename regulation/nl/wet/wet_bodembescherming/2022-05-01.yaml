  - number: '29'
    text: |-
      1 Gedeputeerde staten kunnen in een beschikking vaststellen of sprake is van een geval van ernstige
      verontreiniging:

      a. naar aanleiding van een nader onderzoek of

      b. naar aanleiding van een melding als bedoeld in [artikel 28, eerste lid][ref1].

      2 Gedeputeerde staten nemen in ieder geval een beschikking:

      a. op aanvraag van degene die het nader onderzoek heeft overgelegd of degene die de melding, bedoeld in
      [artikel 28, eerste lid][ref2], heeft gedaan;

      b. indien toepassing wordt gegeven aan [artikel 39, eerste lid][ref3].

      3 Gedeputeerde staten nemen een beschikking zo spoedig mogelijk, doch uiterlijk binnen vijftien weken na ontvangst
      van:

      a. het nader onderzoek of de melding, bedoeld in [artikel 28, eerste lid][ref4], of

      b. een later daartoe strekkende aanvraag van degene die het nader onderzoek heeft overgelegd of degene die de
      melding, bedoeld in [artikel 28, eerste lid][ref5], heeft gedaan.

      4 Degene die een melding als bedoeld in [artikel 28, eerste lid][ref6], heeft gedaan, gaat niet over tot de in dat
      lid bedoelde handelingen dan:

      a. nadat een beschikking als bedoeld in het eerste lid, onder b, is gegeven, dan wel

      b. indien binnen de termijn, bedoeld in het derde lid, geen beschikking is gegeven als bedoeld in het eerste lid,
      onder b: nadat die termijn is verstreken.

      5 In afwijking van het eerste en tweede lid nemen gedeputeerde staten geen beschikking als bedoeld in het eerste
      lid naar aanleiding van een melding die is gedaan overeenkomstig [artikel 28, derde lid][ref7]. Degene die een
      melding als bedoeld in artikel 28, derde lid, heeft gedaan, gaat niet over tot de in dat lid bedoelde handelingen
      dan:

      a. nadat sinds de melding ten minste vijf weken zijn verlopen, en

      b. indien voor die handelingen een vergunning is vereist op grond van de [Waterwet][ref8] of de verordening van een
      waterschap: nadat die vergunning is verleend.


