  - number: 55ab
    text: |-
      1 De eigenaar of indien op het bedrijfsterrein een recht van erfpacht rust, de erfpachter van een bedrijfsterrein
      waar zich blijkens een oriënterend onderzoek of een ander veldonderzoek met betrekking tot de kwaliteit van de
      bodem een verontreiniging bevindt of de directe gevolgen van een verontreiniging zich voordoen en dat behoort tot
      een bij of krachtens algemene maatregel van bestuur aangewezen categorie bedrijfsterreinen waarvan aannemelijk is
      dat een geval van ernstige verontreiniging is ontstaan en spoedige sanering noodzakelijk zal zijn als bedoeld in
      [artikel 37, eerste lid][ref1], verricht een nader onderzoek met betrekking tot die verontreiniging.

      2 Het nader onderzoek wordt verricht binnen zes maanden na de datum van inwerkingtreding van dit artikel, en
      onverwijld overgelegd aan gedeputeerde staten.

      3 Indien de eigendom of de erfpacht wordt overgedragen, blijft de verplichting om het nader onderzoek te
      verrichten rusten op de eigenaar of de erfpachter die zijn eigendom respectievelijk zijn recht van erfpacht heeft
      overgedragen, en komt deze verplichting mede te rusten op de opvolgende eigenaar of erfpachter.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel55ab
