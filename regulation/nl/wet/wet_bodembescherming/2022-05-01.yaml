  - number: 55e
    text: |-
      1 Het plan, bedoeld in [artikel 55d, eerste lid][ref1], wordt vastgesteld door:

      a. het bestuursorgaan dat voornemens is het verzoek, bedoeld in [artikel 55c, eerste lid][ref2], te doen, of

      b. gedeputeerde staten, indien zij voornemens zijn ambtshalve een besluit te nemen als bedoeld in
      [artikel 55c, eerste lid][ref3].

      2 Het plan bevat ten minste de volgende gegevens:

      a. de doelstellingen van de gebiedsgerichte aanpak binnen het beheergebied alsmede de maatregelen die ter
      verwezenlijking hiervan worden genomen;

      b. de termijn waarbinnen deze doelstellingen zullen worden verwezenlijkt;

      c. een beschrijving van het onderzoek dat is verricht met het oog op het opstellen van het plan;

      d. de wijze waarop het plan past binnen relevante ruimtelijke en waterplannen;

      e. een begroting van de kosten van de sanering en een overzicht van de daarvoor beschikbare middelen;

      f. de wijze waarop belemmeringen voor een doelmatige gebiedsgerichte aanpak zullen worden weggenomen, alsmede de
      wijze waarop met gedeputeerde staten zal worden samengewerkt indien het plan niet door gedeputeerde staten wordt
      vastgesteld, en

      g. de verontreinigingen in het diepere grondwater, bedoeld in [artikel 55g][ref4].

      3 In het plan wordt rekening gehouden met de gevolgen van de gebiedsgerichte aanpak voor terreinen die daarvan geen
      onderdeel uitmaken, en worden zo nodig voorzieningen opgenomen om mogelijk voor die terreinen optredende gevolgen
      te monitoren alsmede maatregelen om alsdan in te grijpen.

      4 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van toepassing.

      5 Indien een verzoek wordt gedaan als bedoeld in [artikel 55c, eerste lid][ref6], wordt het vastgestelde plan
      bedoeld in het eerste lid, onder a, bij dat verzoek aan gedeputeerde staten ter instemming overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel55d
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel55c
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel55c
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel55g
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref6]: https://wetten.overheid.nl/BWBR0003994#Artikel55c
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel55e
