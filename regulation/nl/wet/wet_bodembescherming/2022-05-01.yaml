  - number: '88'
    text: |-
      1 De gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht worden gelijkgesteld met een provincie voor de
      toepassing van:

      a. de [artikelen 27 tot en met 34][ref1], [37][ref2], [artikel 38, derde en vierde lid][ref3],
      [39][ref4], [39a][ref5], [39b][ref6], [39c][ref7], [39d, derde, vierde en vijfde lid][ref8],
      [39f, eerste lid][ref9], [40][ref10], [42][ref11], [43 tot en met 51][ref12], [55][ref13],
      [55ab, tweede lid][ref14], [55b, derde lid][ref15], [55c, eerste en derde lid][ref16],
      [55e, eerste, tweede lid, onder f, en vijfde lid][ref17], [55f][ref18], [55g, derde lid][ref19],
      [63c, tweede lid][ref20], [74 tot en met 76l][ref21], [83][ref22], [87a][ref23] en [92b][ref24];

      b.

      2 In de gevallen waarin de in het eerste lid bedoelde gelijkstelling van toepassing is, blijven de
      [artikelen 41][ref25], [51][ref26] en [53][ref27] buiten toepassing.

      3 Onverminderd het tweede lid, treedt in de gevallen, bedoeld in het eerste lid, de raad op in plaats van
      provinciale staten, treedt het college van burgemeester en wethouders op in plaats van gedeputeerde staten en
      treedt de burgemeester op in plaats van Onze commissaris in de provincie.

      4 In de gevallen, bedoeld in het derde lid:

      a. worden tevens gedeputeerde staten in de gelegenheid gesteld van advies te dienen overeenkomstig
      [artikel 32][ref28];

      b. kunnen ook gedeputeerde staten een verzoek doen als bedoeld in [artikel 33][ref29];

      c. wordt een beschikking, houdende een beslissing op een zodanig verzoek tevens aan gedeputeerde staten
      toegezonden;

      d. wordt de inhoud van een ingevolge [artikel 30][ref30] of [31][ref31] gegeven beschikking tevens onverwijld aan
      gedeputeerde staten medegedeeld en wordt de beschikking tevens in afschrift aan hen gezonden.

      5 Bij algemene maatregel van bestuur kan het eerste lid van overeenkomstige toepassing worden verklaard op andere
      gemeenten dan die, genoemd in het eerste lid.


