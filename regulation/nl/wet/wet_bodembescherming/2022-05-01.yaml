        artikel: 55c
        hoofdstuk: IV
        paragraaf: 3b
  - number: 55g
    text: |-
      1 Het bestuursorgaan dat het plan, bedoeld in [artikel 55d, eerste lid][ref1], vaststelt, treedt voor een
      verontreiniging die zal worden gesaneerd als onderdeel van de gebiedsgerichte aanpak en welke als zodanig in het
      overeenkomstig [artikel 55e][ref2] vastgestelde, en onherroepelijk geworden, plan is vermeld, onherroepelijk in de
      plaats van degene aan wie krachtens [artikel 43][ref3] met betrekking tot de betrokken verontreiniging een bevel
      kan worden gegeven of op wie een verplichting als bedoeld in [artikel 55b][ref4] van toepassing is.

      2 Het bestuursorgaan dat het plan, bedoeld in [artikel 55d, eerste lid][ref5], heeft vastgesteld, kan aan het
      vastgestelde plan verontreinigingen toevoegen. [Artikel 55e, vierde lid][ref6], en [55f][ref7], zijn op deze
      wijzigingen niet van toepassing. Het eerste lid is op een zodanige verontreiniging van overeenkomstige toepassing
      zodra het wijzigingsbesluit onherroepelijk is geworden.

      3 Het bestuursorgaan dat het plan vaststelt, stelt gedeputeerde staten op de hoogte van een wijziging van het plan,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel55d
