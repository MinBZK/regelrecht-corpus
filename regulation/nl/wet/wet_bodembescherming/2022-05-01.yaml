preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in het belang van de bescherming van het milieu
    regels te stellen ten einde de bodem te beschermen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;

      bodem: het vaste deel van de aarde met de zich daarin bevindende vloeibare en gasvormige bestanddelen en
      organismen;

      belang van de bescherming van de bodem: het belang van het voorkomen, beperken of ongedaan maken van veranderingen
      van hoedanigheden van de bodem, die een vermindering of bedreiging betekenen van de functionele eigenschappen die
      de bodem voor mens, plant of dier heeft;

      geval van verontreiniging: geval van verontreiniging of dreigende verontreiniging van de bodem dat betrekking heeft
      op grondgebieden die vanwege die verontreiniging, de oorzaak of de gevolgen daarvan in technische, organisatorische
      en ruimtelijke zin met elkaar samenhangen;

      oriënterend onderzoek: onderzoek naar aanleiding van een vermoeden dat sprake is van een geval van verontreiniging;

      nader onderzoek: onderzoek met betrekking tot de vraag of een geval van verontreiniging een geval van ernstige
      verontreiniging is;

      onderzoeksgeval: geval waarin oriënterend of nader onderzoek zal plaatsvinden of plaatsvindt;

      saneren: het beperken en zoveel mogelijk ongedaan maken van verontreiniging en de directe gevolgen daarvan of van
      dreigende verontreiniging van de bodem;

      geval van ernstige verontreiniging: geval van verontreiniging waarbij de bodem zodanig is of dreigt te worden
      verontreinigd, dat de functionele eigenschappen die de bodem voor mens, plant of dier heeft, ernstig zijn of
      dreigen te worden verminderd;

      saneringsonderzoek: inventarisatie van de mogelijke wijzen van sanering, inhoudende een beschrijving van hun
      milieuhygiënische, technische en financiële aspecten, alsmede van de kwaliteit van de bodem die met de op die
      wijzen uitgevoerde sanering zal worden bereikt, uitmondend in een keuze van de wijze van sanering;

      beheerder: beheerder als bedoeld in [artikel 1.1 van de Waterwet][ref1];

      gebiedsgerichte aanpak: aanpak die is gericht op de sanering van meerdere verontreinigingen van het diepere
      grondwater in een daartoe aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel1
    references:
      - id: ref1
