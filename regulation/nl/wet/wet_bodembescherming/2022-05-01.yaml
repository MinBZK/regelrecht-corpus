  - number: 39c
    text: |-
      1 Na de uitvoering van de sanering of een fase van de sanering als bedoeld in [artikel 38, derde lid][ref1], doet
      degene die de bodem heeft gesaneerd dan wel een fase van de sanering heeft uitgevoerd, daarvan zo spoedig mogelijk
      schriftelijk verslag aan gedeputeerde staten. Het verslag houdt ten minste in:

      a. een beschrijving van de getroffen saneringsmaatregelen;

      b. een beschrijving van de kwaliteit van de bodem na het uitvoeren van de sanering, waaronder mede begrepen
      een beschrijving van de aard en omvang van de verontreiniging indien na de sanering verontreiniging in de bodem
      aanwezig is gebleven;

      c. indien de verontreinigde grond is afgegraven of het verontreinigde grondwater aan de bodem is onttrokken, de
      hoeveelheid, de kwaliteit en de bestemming van die grond onderscheidenlijk dat grondwater;

      d. indien ten behoeve van de sanering grond is aangevoerd de hoeveelheid, de kwaliteit en de herkomst van de
      aangevoerde grond;

      e. een evaluatie van de mate waarin de effecten van de getroffen saneringsmaatregelen overeenstemmen met de beoogde
      effecten, bedoeld in [artikel 39, eerste lid, onder b][ref2];

      f. indien na de sanering nog verontreiniging in de bodem aanwezig is en alleen beperkingen in het gebruik van
      de bodem noodzakelijk zijn, een beschrijving van deze beperkingen. Indien na de sanering alleen maatregelen
      in het belang van de bescherming van de bodem nodig zijn, het aangeven van de noodzaak daarvan. Indien na de
      sanering zowel beperkingen als maatregelen noodzakelijk zijn, het aangeven van de noodzaak van deze beperkingen
      en maatregelen.

      2 Het verslag behoeft de instemming van gedeputeerde staten, die slechts met het verslag instemmen indien gesaneerd
      is overeenkomstig het bepaalde bij of krachtens [artikel 38][ref3], en indien de daarin opgenomen beperkingen
      in het gebruik van de bodem naar hun oordeel voldoende zijn om ervoor te zorgen dat de verontreiniging die na de
      sanering is achtergebleven niet zal leiden tot een vermindering van de kwaliteit van de bodem zoals beschreven
      in het verslag op grond van het eerste lid, onder b. Gedeputeerde staten kunnen hun instemming aan het verslag
      onthouden, indien de sanering niet is geschied overeenkomstig het saneringsplan waarmee door gedeputeerde staten
      is ingestemd, de beschikking waarbij gedeputeerde staten met het saneringsplan hebben ingestemd en de daaraan
      verbonden voorschriften, of aanwijzingen die gedeputeerde staten op grond van [artikel 39, vijfde lid][ref4],
      hebben gegeven. Aan de instemming kunnen voorschriften worden verbonden. [Artikel 28, zevende lid][ref5], is van
      overeenkomstige toepassing voor wat betreft de instemming met het verslag.

      3 Provinciale staten kunnen nadere regels stellen omtrent de gegevens die in het verslag worden opgenomen.

      4 Bij de beschikking tot instemming met het schriftelijk verslag kunnen gedeputeerde staten aangeven welke
      wijzigingen in het gebruik van de bodem aan hen dienen te worden gemeld. Naar aanleiding van die melding kunnen
      gedeputeerde staten bepalen dat een aanvullende sanering moet plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel28
