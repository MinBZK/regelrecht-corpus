  - number: '39'
    text: |-
      1 Indien een geval van ernstige verontreiniging wordt vermoed gaat de melding, bedoeld in [artikel 28][ref1], voor
      zover dit niet reeds ingevolge dat artikel is vereist, tevens vergezeld van de resultaten van het nader onderzoek
      alsmede, indien het voornemen bestaat de bodem te saneren, van de resultaten van het saneringsonderzoek en van een
      saneringsplan, dat in ieder geval inhoudt:

      a. een nadere beschrijving van de wijze waarop de sanering zal worden uitgevoerd, waarbij is aangegeven hoe aan
      [artikel 38, eerste lid][ref2], zal worden voldaan;

      b. een beschrijving van de effecten die met de te treffen saneringsmaatregelen worden beoogd, waaronder mede
      begrepen een nadere beschrijving van de kwaliteit van de bodem die met de sanering zal worden bereikt;

      c. indien na de sanering verontreiniging in de bodem aanwezig blijft: een beschrijving van beperkingen in het
      gebruik van de bodem of maatregelen die naar verwachting nodig zijn in het belang van de bescherming van de bodem,
      alsmede een indicatie van de kosten van die maatregelen;

      d. een begroting van de kosten van de sanering en een overzicht van de daarvoor beschikbare middelen;

      e. indien de verontreinigde grond zal worden afgegraven of het verontreinigde grondwater zal worden onttrokken, de
      bestemming van die grond onderscheidenlijk dat grondwater;

      f. indien verontreinigde grond binnen het geval van de verontreiniging wordt verplaatst, een beschrijving van de
      omstandigheden waaronder dit gebeurt;

      g. het tijdstip waarop de sanering naar verwachting zal zijn uitgevoerd;

      h. indien de verontreiniging zich kan verspreiden en de saneringsmaatregelen zich uitstrekken over een periode van
      drie jaar of meer:

      1°. een overzicht van de tussentijds beoogde effecten, en de tijdstippen waarop gedeputeerde staten schriftelijk
      worden geïnformeerd omtrent de effecten van de getroffen maatregelen en in hoeverre deze overeenstemmen met de
      beoogde effecten;

      2°. een beschrijving van een andere methode om de beoogde effecten, bedoeld onder b, te bereiken, voor het geval de
      in het saneringsplan opgenomen methode niet tot die effecten zou leiden.

      Provinciale staten kunnen nadere regels stellen omtrent de gegevens die in het saneringsplan worden opgenomen.

      2 Het saneringsplan behoeft de instemming van gedeputeerde staten, die slechts met het plan instemmen indien door
      de daarin beschreven sanering naar hun oordeel wordt voldaan aan het bij of krachtens [artikel 38][ref3] bepaalde.
      Gedeputeerde staten kunnen hun instemming aan het plan onthouden, indien niet is voldaan aan het bepaalde bij of
      krachtens het eerste lid. Zij beslissen hierover binnen vijftien weken na de indiening van het saneringsplan. Zij
      kunnen deze termijn binnen zes weken na de datum van ontvangst van de melding verlengen met ten hoogste vijftien
      weken. Met de uitvoering van het saneringsplan kan worden begonnen nadat gedeputeerde staten met dat plan hebben
      ingestemd of die instemming van rechtswege is verleend. Aan de instemming kunnen voorschriften worden verbonden.
      De instemming is van rechtswege verleend, indien gedeputeerde staten niet binnen de instemmingstermijn van vijftien
      weken of voor de afloop van de termijn waarmee is verlengd een beslissing hebben genomen. Een instemming van
      rechtswege wordt aangemerkt als een besluit in de zin van [artikel 1:3 van de Algemene wet bestuursrecht][ref4].

      3 Indien het voornemen, bedoeld in [artikel 28, eerste lid][ref5], inhoudt dat de sanering niet onmiddellijk wordt
      uitgevoerd nadat de beschikking, bedoeld in [artikel 29, eerste lid][ref6], is gegeven, kunnen gedeputeerde staten
      bepalen dat de in het eerste lid bedoelde stukken niet reeds bij de melding behoeven te worden ingediend.

      4 Degene die de bodem saneert, meldt wijzigingen van het saneringsplan, waarmee door gedeputeerde
      staten is ingestemd, uiterlijk twee weken voorafgaand aan de uitvoering daarvan aan gedeputeerde staten.
      Provinciale staten kunnen nadere regels stellen omtrent de gegevens die bij de melding worden verstrekt.
      [Artikel 28, zevende lid][ref7], is van overeenkomstige toepassing.

      5 Gedeputeerde staten kunnen naar aanleiding van de melding, bedoeld in het vierde lid, aanwijzingen geven omtrent
      de verdere uitvoering van de sanering, die een wijziging inhouden van onderdelen van het saneringsplan waarmee
      reeds is ingestemd.

      6 Dit artikel is niet van toepassing op een melding als bedoeld in [artikel 28, derde lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
