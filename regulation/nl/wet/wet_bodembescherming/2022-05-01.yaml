  - number: 55c
    text: |-
      1 Gedeputeerde staten kunnen op verzoek van een bestuursorgaan of ambtshalve een gebied aanwijzen waar een
      gebiedsgerichte aanpak zal plaatsvinden.

      2 Een gebiedsgerichte aanpak is gericht op:

      a. het zoveel mogelijk voorkomen van de risico’s van verspreiding van verontreiniging buiten het aangewezen gebied,
      en

      b. de bescherming van bestaande en beoogde functies van, in en op de bodem binnen het aangewezen gebied.

      3 Van de in het eerste lid bedoelde bevoegdheid kan gebruik worden gemaakt indien gevallen van verontreiniging
      in het diepere grondwater in een gebied zodanig gemengd zijn of gemengd kunnen raken dat deze gevallen voor de
      toepassing van deze wet naar het oordeel van gedeputeerde staten niet ten opzichte van elkaar zijn te onderscheiden
      en af te bakenen, dan wel indien gevallen van verontreiniging in het diepere grondwater in een gebied elkaar
      naar het oordeel van gedeputeerde staten bij een afzonderlijke aanpak van die gevallen in betekenende mate kunnen
      beïnvloeden, en, naar het oordeel van gedeputeerde staten:

      a. wenselijk geachte ruimtelijke ontwikkelingen en andere plannen voor ontwikkeling van het gebied hierdoor worden
      belemmerd;

      b. het treffen van maatregelen ter voorkoming van verspreiding van verontreiniging buiten het gebied hierdoor
      achterwege dreigt te blijven of niet op doelmatige of kosteneffectieve wijze kan plaatsvinden, of

      c. andere bijzondere omstandigheden een gebiedsgerichte aanpak wenselijk maken.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel55c
  - number: 55d
    text: |-
      1 Een gebiedsgerichte aanpak wordt uitgevoerd overeenkomstig een daartoe vastgesteld en goedgekeurd plan. De
      uitvoering geschiedt door het bestuursorgaan dat het plan heeft vastgesteld.

      2 [Artikel 29][ref1], alsmede de [paragrafen 3][ref2] en [3a van hoofdstuk IV][ref3] vinden geen toepassing op
      de sanering van de verontreinigingen in het diepere grondwater die overeenkomstig [artikel 55g][ref4] in het plan
      zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
