  - number: 63b
    text: |-
      Indien een verontreiniging of aantasting van de bodem als bedoeld in [artikel 13][ref1] zich mede uitstrekt tot de
      bodem of oever van een oppervlaktewaterlichaam, plegen gedeputeerde staten, alvorens van hun bevoegdheden gebruik
      te maken, ter zake overleg met de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel13
