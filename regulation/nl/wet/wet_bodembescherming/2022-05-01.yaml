  - number: '69'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald:

      a. dat bij het van overheidswege verrichten van onderzoek in het belang van de bescherming van de bodem de bij die
      maatregel gestelde regels moeten worden in acht genomen;

      b. dat bij die maatregel aangewezen colleges van burgemeester en wethouders, colleges van gedeputeerde staten,
      besturen van rechtspersoonlijkheid bezittende lichamen als bedoeld in de [Wet gemeenschappelijke regelingen][ref1]
      of andere openbare lichamen gehouden zijn in hun gezagsgebied met inachtneming van de bij die maatregel gestelde
      regels onderzoek als bedoeld onder a te verrichten of mede te werken aan zodanig onderzoek.

      2 Regels als bedoeld in het eerste lid, onder *a* en *b*, kunnen onder meer betrekking hebben op:

      a. de wijze waarop het onderzoek dient te worden verricht;

      b. de frequentie van het onderzoek;

      c. de dichtheid van het net van in het kader van het onderzoek te gebruiken meetpunten;

      d. de verwerking en registratie van de uitkomsten van het onderzoek;

      e. de terbeschikkingstelling van uitkomsten en de verstrekking van inlichtingen daaromtrent aan de bij die
      maatregel aangewezen bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '70'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in bij die maatregel aan te geven gevallen daarbij
      aangewezen bestuursorganen, indien zij in het belang van de bescherming van de bodem een onderzoek ter plaatse
      nodig oordelen, aan de rechthebbenden ten aanzien van het gedeelte van de bodem waar dat onderzoek wordt ingesteld,
      de verplichting op kunnen leggen het verrichten van het onderzoek, zomede het aanbrengen, het aanwezig zijn, het
      onderhoud, het gebruik en het verwijderen van de voor dat onderzoek nodige middelen te gedogen, onverminderd het
      recht van deze rechthebbenden op schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel70
  - number: '71'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 6 tot en met 11][ref1] kan worden bepaald
      dat degene die ingevolge die maatregel, op een daarbij aangegeven wijze onderzoek dient te verrichten op of in een
      gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid ontbreekt, een bij de maatregel aan te wijzen
      bestuursorgaan kan verzoeken de rechthebbenden daartoe een verplichting als bedoeld in [artikel 70][ref2] op te
      leggen.

      2 Bij toepassing van het eerste lid wordt in de maatregel tevens omschreven welke gegevens bij een verzoek
      overeenkomstig het eerste lid dienen te worden overgelegd.

      3 Het betrokken bestuursorgaan stelt bij het opleggen van de verplichting zodanige voorwaarden dat de vergoeding
      van schade aan de rechthebbenden op voldoende wijze is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel70
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel71
