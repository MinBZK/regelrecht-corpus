  - number: '50'
    text: |-
      1 Onze Minister kan, indien dat noodzakelijk is om de sanering van een geval van ernstige verontreiniging mogelijk
      te maken, op verzoek van gedeputeerde staten ten behoeve van een bij dat verzoek aangewezen openbaar lichaam
      vorderen:

      a. de eigendom of het gebruik van onroerende zaken, gelegen binnen het grondgebied waarop zich in dat geval de
      oorzaak van de verontreiniging bevindt, dan wel de verontreiniging of de directe gevolgen daarvan zich voordoen;

      b. beperkte rechten, waaraan zaken als bedoeld onder a onderworpen zijn, dan wel het gebruik daarvan.

      2 Alvorens gedeputeerde staten een verzoek doen als bedoeld in het eerste lid, trachten zij hetgeen gevorderd
      moet worden, bij minnelijke schikking te verkrijgen. Bij hun verzoek doen zij verslag van het daaromtrent met de
      betrokken rechthebbenden gevoerde overleg. Onze Minister oefent de hem in het eerste lid toegekende bevoegdheden
      niet uit dan nadat hij aan de Staten-Generaal kennis heeft gegeven van zijn voornemen daartoe; daarbij legt hij het
      in de tweede volzin bedoelde verslag over.

      3 De [Vorderingswet][ref1] is van toepassing, met dien verstande dat de [artikelen 3][ref2], [3a][ref3] ,
      [5][ref4], [9, derde lid][ref5], en [13, derde lid, tweede volzin][ref6], buiten toepassing blijven.

      4 Bij de bepaling van de schadeloosstelling blijft de verontreiniging van de bodem buiten beschouwing, voor zover
      de schade niet aan de tot schadeloosstelling gerechtigde is toe te rekenen, dan wel voor zover deze daardoor niet
      ongerechtvaardigd wordt verrijkt.

      5 Degene te wiens behoeve is gevorderd, betaalt aan de rechthebbende met wie over de vaststelling van het
      bedrag van de schadeloosstelling niet in het overleg overeenkomstig [artikel 17 van de Vorderingswet ][ref7]
      overeenstemming is bereikt, of die niet aan dat overleg heeft deelgenomen, een voorschot op die schadeloosstelling
      ten bedrage van 90 procent van het hem als schadeloosstelling aangeboden bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002393
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002393#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0002393#Artikel5
