  - number: '19'
    text: |-
      Bij een algemene maatregel van bestuur, vastgesteld krachtens [de artikelen 6][ref1] tot en met [12][ref2], kan
      worden bepaald dat het gezag dat bevoegd is een omgevingsvergunning voor activiteiten met betrekking tot een
      inrichting als bedoeld in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref3]
      te verlenen, bij het verlenen of wijzigen van de vergunning met betrekking tot daarbij aangegeven onderwerpen in de
      beperkingen waaronder de vergunning wordt verleend, of in de daaraan verbonden voorschriften van bij de maatregel
      gestelde regels kan afwijken. In dat geval wordt bij de maatregel aangegeven in hoeverre het bevoegd gezag van de
      regels kan afwijken. Bij de maatregel kan tevens worden bepaald dat de bevoegdheid tot afwijken slechts geldt in
      daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
