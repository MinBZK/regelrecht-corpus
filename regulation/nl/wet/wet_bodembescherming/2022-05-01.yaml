  - number: '33'
    text: |-
      De burgemeester van een gemeente waar zich een verontreiniging of een aantasting als bedoeld in [artikel 30][ref1]
      voordoet dan wel de directe gevolgen daarvan zich voordoen kan gedeputeerde staten onderscheidenlijk Onze
      commissaris verzoeken aan de in artikel 30 bedoelde maatregelen toepassing te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel33
