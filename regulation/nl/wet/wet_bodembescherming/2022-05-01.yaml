  - number: '28'
    text: |-
      1 Degene die voornemens is de bodem te saneren dan wel handelingen te verrichten ten gevolge waarvan de
      verontreiniging van de bodem wordt verminderd of verplaatst, doet van dat voornemen melding bij gedeputeerde staten
      van de betrokken provincie.

      2 Bij de melding, bedoeld in het eerste lid, worden de volgende gegevens verstrekt:

      a. de resultaten van onderzoek met betrekking tot de kwaliteit van de bodem;

      b. de resultaten van nader onderzoek, indien dat is uitgevoerd;

      c. het tijdstip waarop met de handelingen, bedoeld in het eerste lid, zal worden aangevangen;

      d. indien verontreinigd grondwater zal worden onttrokken, de bestemming van dat grondwater;

      e. indien verontreinigde bodem zal worden afgegraven, de bestemming van de grond en of de verontreinigde grond zal
      worden gereinigd of geïmmobiliseerd;

      f. indien de verontreinigde bodem geheel of gedeeltelijk niet zal worden gereinigd, wordt tevens een beoordeling
      van de reinigbaarheid of de immobiliseerbaarheid van de verontreinigde grond overgelegd.

      3 In afwijking van het tweede lid, worden bij een melding als bedoeld in het eerste lid, waarbij een
      verontreiniging wordt verminderd of verplaatst uitsluitend door het onttrekken van grondwater als bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref1], waarvoor:

      a. een vergunning is vereist op grond van [artikel 6.4 van de Waterwet][ref2], en de onttrekking geschiedt ten
      behoeve van een bodemenergiesysteem,

      b. een vergunning is vereist krachtens verordening van een waterschap, of

      c. krachtens de [Waterwet][ref3] een melding moet worden gedaan aan het bevoegd gezag, bedoeld in die wet,

      de in het vierde lid bedoelde gegevens verstrekt.

      4 Bij een melding, bedoeld in het derde lid, worden de volgende gegevens verstrekt:

      a. het tijdstip waarop de onttrekking van verontreinigd grondwater volgens voornemen zal aanvangen en de
      voorgenomen duur van deze onttrekking;

      b. de bestemming van het grondwater;

      c. gegevens waaruit blijkt dat de onttrekking van het grondwater en indien van toepassing het terug brengen van dat
      grondwater het belang van de bescherming van de bodem niet schaadt, en

      d. een afschrift van de aanvraag van die vergunning dan wel van die melding aan het bevoegd gezag, bedoeld in die
      [wet][ref4].

      5 Een melding als bedoeld in het eerste lid kan achterwege blijven, indien de betrokkene redelijkerwijs
      kan aannemen dat de sanering of de handeling waarop zijn voornemen betrekking heeft geen geval van ernstige
      verontreiniging betreft en tevens vaststaat:

      1°. dat de betreffende hoeveelheid verontreinigde grond of verontreinigd grondwater 50 kubieke meter
      onderscheidenlijk 1000 kubieke meter niet te boven gaat, of

      2°. dat uit de aard van de in het eerste lid bedoelde handelingen volgt dat de grond slechts tijdelijk wordt
      verplaatst en na verplaatsing wordt teruggebracht.

      6 Bij algemene maatregel van bestuur kan worden bepaald in welke andere gevallen dan die, genoemd in het vijfde
      lid, een melding als bedoeld in het eerste lid achterwege kan blijven, mits het niet gevallen van ernstige
      verontreiniging betreft.

      7 Gedeputeerde staten stellen, indien het niet hun voornemen betreft, burgemeester en wethouders van de betrokken
      gemeente op de hoogte van een ingevolge het eerste lid gedane melding. Tegelijkertijd doen zij daarvan kennisgeving
      op de in [artikel 12 van de Bekendmakingswet][ref5] bepaalde wijze.

      8 Dit artikel is niet van toepassing in gevallen als bedoeld in de [artikelen 27][ref6], [30, eerste lid][ref7],
      en [43][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
