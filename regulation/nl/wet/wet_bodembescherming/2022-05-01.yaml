  - number: 55h
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. de gegevens die worden overgelegd bij een verzoek als bedoeld in [artikel 55c, eerste lid][ref1];

      b. het verrichten van bodemonderzoek ter voorbereiding van een plan als bedoeld in
      [artikel 55d, eerste lid][ref2];

      c. de onderwerpen die ten minste in het plan worden opgenomen;

      d. de monitoring en evaluatie van de voortgang van een gebiedsgerichte aanpak.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel55c
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel55d
