  - number: 55f
    text: |-
      Een plan dat niet door gedeputeerde staten is vastgesteld, behoeft de instemming van gedeputeerde staten.
      Gedeputeerde staten kunnen de instemming met het plan onthouden indien zij geen gebruik maken van hun bevoegdheid
      bedoeld in [artikel 55c, eerste lid][ref1], of naar hun oordeel voldoende aannemelijk is dat de gebiedsgerichte
      aanpak niet zal voldoen aan de doelstellingen, genoemd in artikel 55c, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel55c
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel55f
