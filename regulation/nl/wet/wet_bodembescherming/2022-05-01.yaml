  - number: '49'
    text: |-
      1 Gedeputeerde staten kunnen, indien dat noodzakelijk is om nader onderzoek, saneringsonderzoek, sanering,
      de uitvoering van maatregelen, bedoeld in [artikel 37, derde en vierde lid][ref1], of de uitvoering van de
      maatregelen, bedoeld in [artikel 39e, tweede lid][ref2], mogelijk te maken, maatregelen nemen als bedoeld in
      [artikel 30, tweede, derde en vierde lid][ref3]. De maatregelen kunnen mede betrekking hebben op het treffen van
      maatregelen als bedoeld in artikel 37, derde en vierde lid.

      2 Ten behoeve van het verrichten van oriënterend onderzoek kunnen gedeputeerde staten voorts een maatregel
      nemen als bedoeld in [artikel 30, derde lid, onder a ][ref4], met betrekking tot degene op wiens grondgebied dat
      onderzoek moet geschieden.

      3 Met betrekking tot gevallen als bedoeld in het eerste en tweede lid, waarvan het onderzoek of de sanering
      wordt uitgevoerd door burgemeester en wethouders, komen de overeenkomstig die leden aan gedeputeerde staten
      toekomende bevoegdheden toe aan burgemeester en wethouders. [Artikel 55][ref5] is van overeenkomstige toepassing op
      burgemeester en wethouders.

      4 [Artikel 47, eerste lid][ref6], is met betrekking tot de uitoefening van de in het eerste, tweede en derde lid
      bedoelde bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel37
