  - number: '46'
    text: |-
      1 Een bevel tot sanering als bedoeld in [artikel 43, derde lid][ref1], wordt, tenzij het tijdelijke
      beveiligingsmaatregelen betreft, niet gegeven aan de eigenaar of de erfpachter van het grondgebied, indien deze ter
      gelegenheid van het ingevolge [artikel 45, derde lid][ref2], met hem gevoerde overleg aantoont dat hij:

      a. gedurende de periode waarin de verontreiniging is veroorzaakt geen duurzame rechtsbetrekking heeft gehad met de
      veroorzaker of veroorzakers;

      b. geen directe of indirecte betrokkenheid heeft gehad bij de veroorzaking van de verontreiniging, en

      c. op het moment van de verkrijging van het recht op het grondgebied niet op de hoogte was dan wel redelijkerwijs
      niet op de hoogte had kunnen zijn van de verontreiniging.

      2 Indien een eigenaar of erfpachter:

      a. niet voldoet aan het eerste lid, onder *a*, doch de veroorzaker niet in overwegende mate is betrokken bij de
      veroorzaking van de verontreiniging of

      b. niet voldoet aan het eerste lid, onder *b*, doch niet in overwegende mate is betrokken bij de veroorzaking van
      de verontreiniging,

      doch overigens voldoet aan het eerste lid, geven gedeputeerde staten hem geen bevel, indien zij met hem
      overeenkomen dat hij aan hen een bedrag betaalt dat overeenkomt met de kosten van de sanering van het deel van de
      verontreiniging waarbij de veroorzaker onderscheidenlijk hij is betrokken.

      3 Het tweede lid is van overeenkomstige toepassing op degene door wiens handelen een geval van ernstige
      verontreiniging mede is ontstaan, doch die niet in overwegende mate is betrokken bij de veroorzaking van de
      verontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel43
