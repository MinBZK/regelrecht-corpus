  - number: 39a
    text: |-
      Degene die de bodem saneert, alsmede degene die de sanering feitelijk uitvoert, voeren de sanering uit
      overeenkomstig het saneringsplan waarmee door gedeputeerde staten is ingestemd, en overeenkomstig de
      voorschriften die aan de instemming zijn verbonden. Indien gedeputeerde staten aanwijzingen als bedoeld in
      [artikel 39, vijfde lid][ref1], hebben gegeven, wordt bij de uitvoering van de sanering overeenkomstig die
      aanwijzingen gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0003994/2022-05-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 39b
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot bij ministeriële
      regeling aan te wijzen categorieën van uniforme saneringen bestaande uit eenvoudige, gelijksoortige saneringen van
      korte duur. De sanering kan betrekking hebben op slechts een gedeelte van het geval van verontreiniging.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid, bevat in ieder geval regels omtrent:

      a. het onderzoek dat aan de sanering vooraf gaat;

      b. de gegevens die bij de melding, bedoeld in het derde lid, moeten worden verstrekt, alsmede de wijze waarop die
      gegevens worden verstrekt;

      c. de gegevens die degene die saneert tijdens de sanering aan gedeputeerde staten moet verstrekken en de wijze en
      het tijdstip waarop dat gebeurt;

      d. de aanpak en wijze van sanering waaronder begrepen aanvang, duur en afronding van de sanering.

      3 Degene die voornemens is te saneren dan wel handelingen te verrichten ten gevolge waarvan de verontreiniging
      van de bodem wordt verminderd of verplaatst overeenkomstig de regels gesteld krachtens het eerste lid, doet van
      dat voornemen melding bij gedeputeerde staten van de betrokken provincie.[ Artikel 28, zevende lid][ref1], is van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze en het
      tijdstip waarop de kennisgeving van de melding plaatsvindt en kan worden bepaald in welke gevallen een dergelijke
      kennisgeving achterwege kan worden gelaten.

      4 Met de sanering kan met inachtneming van de regels gesteld krachtens het eerste lid worden begonnen nadat vijf
      weken zijn verstreken vanaf de datum van ontvangst van de melding, bedoeld in het derde lid, door gedeputeerde
      staten. In bij algemene maatregel van bestuur aangegeven omstandigheden kan bij die maatregel een kortere termijn
      dan vijf weken worden gesteld. De melding vervalt indien niet met de sanering wordt begonnen binnen een bij
      algemene maatregel van bestuur gestelde termijn.

      5 De [artikelen 28][ref2], [29][ref3], [37][ref4], [39][ref5], [39a][ref6], [39c][ref7], [39d][ref8] en [40][ref9]
      zijn niet van toepassing indien de sanering wordt gemeld en vervolgens wordt uitgevoerd overeenkomstig de regels
      gesteld bij of krachtens het eerste, derde en vierde lid.

      6 Na de uitvoering van de sanering doet degene die de bodem heeft gesaneerd daarvan schriftelijk verslag aan
      gedeputeerde staten. Het verslag behoeft de instemming van gedeputeerde staten die slechts met het verslag
      instemmen indien is gesaneerd overeenkomstig de regels gesteld bij of krachtens het eerste, derde en vierde lid.
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gegevens die bij het
      verslag moeten worden verstrekt, de wijze waarop die gegevens worden verstrekt, en het tijdstip waarop dat gebeurt
      en de termijn waarbinnen de instemming met het verslag plaatsvindt.

      7 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van saneringen worden aangewezen waarvoor het
      verslag, bedoeld in het zesde lid, geen instemming van gedeputeerde staten behoeft.

      8 Dit artikel is niet van toepassing in gevallen als bedoeld in de [artikelen 27][ref10], [30, eerste lid][ref11],
      en [43][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
