  - number: '51'
    text: |-
      1 Gedeputeerde staten kunnen burgemeester en wethouders uitnodigen om met toepassing van
      [artikel 3.22, eerste lid, van de Wet ruimtelijke ordening][ref1] voor een door hen te bepalen termijn van ten
      hoogste vijf jaar ontheffing te verlenen van een bestemmingsplan, indien het met het oog op de voortgang van de
      bodemsanering noodzakelijk is voor die termijn grond of een ander materiaal op te slaan in afwijking van dat plan.
      Indien niet binnen tien weken nadat de uitnodiging is verzonden daaraan gevolg is gegeven, kunnen gedeputeerde
      staten de ontheffing verlenen.

      2 Het bij of krachtens [artikel 3.22, derde, vierde of vijfde lid, van de Wet ruimtelijke ordening][ref2] bepaalde
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.22
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.22
