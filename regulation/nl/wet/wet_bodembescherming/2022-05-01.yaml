  - number: '18'
    text: |-
      1 Bij een algemene maatregel van bestuur, vastgesteld krachtens de [artikelen 6 tot en met 12][ref1], kan worden
      bepaald dat bij die maatregel gestelde regels slechts gelden in gebieden behorende tot een daarbij met het oog op
      het karakter van de bodem aangegeven categorie.

      2 Bij een algemene maatregel van bestuur, vastgesteld krachtens de [artikelen 6 tot en met 12][ref2], kan worden
      bepaald dat bij die maatregel gestelde regels slechts gelden in gebieden die daartoe bij of krachtens provinciale
      verordening zijn aangewezen.

      3 Bij een maatregel krachtens [artikel 8, eerste lid][ref3], kan met betrekking tot bodemenergiesystemen worden
      bepaald dat bij provinciale of gemeentelijke verordening gebieden worden aangewezen, waarin de bij die maatregel
      gestelde regels van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel6
