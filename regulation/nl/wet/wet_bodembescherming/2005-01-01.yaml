  - number: '37'
    text: |-
      1 Gedeputeerde staten stellen in een beschikking als bedoeld in [artikel 29, eerste lid][ref1], waarbij zij
      vaststellen dat er sprake is van een geval van ernstige verontreiniging, tevens vast of er van urgentie sprake
      is om het geval te saneren, waarbij zij in ieder geval rekening houden met het risico voor mens, plant of dier
      als gevolg van blootstelling aan de verontreiniging, gegeven het gebruik van de bodem op het ogenblik waarop de
      beschikking wordt gegeven.

      2 Indien gedeputeerde staten vaststellen dat van urgentie sprake is als bedoeld in het eerste lid, bepalen zij dat
      met de sanering dient te worden begonnen voor een door hen vast te stellen tijdstip dat ligt:

      a. zo spoedig mogelijk na de inwerkingtreding van de beschikking, bedoeld in het eerste lid, doch uiterlijk vier
      jaar nadien, of

      b. ten minste vier jaar na de inwerkingtreding van die beschikking.

      3 Bij de beschikking kunnen gedeputeerde staten aangeven welke tijdelijke beveiligingsmaatregelen aan de sanering
      vooraf dienen te gaan en op welke wijze en tijdstippen aan hen verslag wordt gedaan van de uitvoering van die
      maatregelen.

      4 Bij de beschikking geven gedeputeerde staten aan welke wijzigingen van het gebruik van de bodem aan hen dienen te
      worden gemeld.

      5 Gedeputeerde staten kunnen naar aanleiding van een verslag als bedoeld in het derde lid, een melding als bedoeld
      in het vierde lid, of een wijziging van omstandigheden de urgentie, bedoeld in het eerste lid, anders vaststellen
      of het tijdstip van de sanering, bedoeld in het tweede lid, vaststellen of anders vaststellen.

      6 Bij de maatregel, bedoeld in [artikel 36][ref2], kunnen regels worden gesteld met betrekking tot de toepassing
      van het eerste, tweede en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel36
