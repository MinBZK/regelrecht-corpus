  - number: '88'
    text: |-
      1 De gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht worden gelijkgesteld met een provincie voor de
      toepassing van:

      a. de artikelen 27 tot en met 34, 37, artikel 38, vierde en vijfde lid, 39, 40, 42, 43 tot en met 52, 55, 74 tot en
      met 78, 81, 83 tot en met 86;

      b. de artikelen 4.14, eerste lid, en tweede lid, onder *a*, onder 1°, en onder *b*, voor zover het de activiteiten,
      bedoeld [onder ][ref1], [onder 1°][ref2], betreft, en 4.15, derde lid, van de Wet milieubeheer.

      2 Een regionaal openbaar lichaam als bedoeld in de Kaderwet bestuur in verandering wordt gelijkgesteld met een
      provincie voor de toepassing van de in het eerste lid genoemde artikelen, alsmede voor [de artikelen 41][ref3],
      [51][ref4], [53][ref5] en [54][ref6]. De gelijkstelling vindt toepassing indien de in [deze artikelen][ref7]
      bedoelde bevoegdheden aan het regionaal openbaar lichaam bij algemene maatregel van bestuur zijn overgedragen.

      3 In de gevallen waarin de in het eerste lid bedoelde gelijkstelling van toepassing is, blijven
      [de artikelen 41][ref8], [51][ref9], [53][ref10] en [54][ref11] buiten toepassing.

      4 In de gevallen waarin de in het tweede lid bedoelde gelijkstelling van toepassing is, blijft het eerste lid
      buiten toepassing voor een in het gebied van het openbaar lichaam gelegen gemeente.

      5 De in het eerste en het tweede lid bedoelde gelijkstelling is niet van toepassing voor zover de in het eerste lid
      genoemde artikelen de verontreiniging of aantasting betreffen van:

      a. de bodem onder oppervlaktewater;

      b. de kust of de oever van oppervlaktewater, indien redelijkerwijs moet worden aangenomen dat de verontreiniging of
      aantasting van de kust of de oever gevolgen heeft voor de bodem onder dat water.

      6 Onverlet het derde tot en met het vijfde lid, treden in de gevallen, bedoeld in het eerste en het tweede lid:

      a. de raad onderscheidenlijk het algemeen bestuur van het regionaal openbaar lichaam op in de plaats van
      provinciale staten,

      b. burgemeester en wethouders onderscheidenlijk het dagelijks bestuur van het regionaal openbaar lichaam op in de
      plaats van gedeputeerde staten, en

      c. de burgemeester onderscheidenlijk de voorzitter van het regionaal openbaar lichaam op in de plaats van Onze
      commissaris in de provincie.

      7 In de gevallen, bedoeld in het zesde lid, stellen burgemeester en wethouders onderscheidenlijk het dagelijks
      bestuur van het regionaal openbaar lichaam de inspecteur op de hoogte van de hun bekende en binnen het grondgebied
      van hun gemeente onderscheidenlijk zijn grondgebied gelegen onderzoeksgevallen en gevallen van ernstige
      verontreiniging.

      8 In de gevallen, bedoeld in het zesde lid:

      a. worden tevens gedeputeerde staten in de gelegenheid gesteld van advies te dienen overeenkomstig
      [artikel 32][ref12];

      b. kunnen ook gedeputeerde staten een verzoek doen als bedoeld in [artikel 33][ref13];

      c. wordt een beschikking, houdende een beslissing op een zodanig verzoek tevens aan gedeputeerde staten
      toegezonden;

      d. wordt de inhoud van een ingevolge [artikel 30][ref14] of 31 gegeven beschikking tevens onverwijld aan
      gedeputeerde staten medegedeeld en wordt de beschikking tevens in afschrift aan hen gezonden.

      9 Bij algemene maatregel van bestuur kan het eerste lid van overeenkomstige toepassing worden verklaard op andere
      gemeenten dan die, genoemd in het eerste lid.


