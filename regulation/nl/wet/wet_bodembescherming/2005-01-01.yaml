  - number: '17'
    text: |-
      1 De krachtens [de artikelen 6][ref1] tot en met [12][ref2] bij algemene maatregel van bestuur vast te stellen
      regels kunnen de verplichting inhouden bij die maatregel aan te geven metingen, registraties of controles
      te verrichten ten einde gegevens te verkrijgen met betrekking tot een in de bodem gebrachte, geraakte of
      getransporteerde stof dan wel met betrekking tot de invloed van die stof op de bodem. Daarbij kunnen tevens eisen
      worden gesteld met betrekking tot de wijze waarop de metingen, registraties of controles dienen te worden verricht
      en de door middel daarvan verkregen gegevens aan een bij die maatregel aan te geven bestuursorgaan dienen te worden
      overgelegd.

      2 De krachtens [de artikelen 6][ref3] tot en met [12][ref4] bij algemene maatregel van bestuur vast te stellen
      regels kunnen voorts de verplichting inhouden te voldoen aan door bij die maatregel aan te geven bestuursorganen,
      omtrent daarbij vermelde onderwerpen, aan de betrokkene gestelde nadere eisen. In een beschikking waarbij een
      nadere eis wordt gesteld of gewijzigd, wordt tevens een termijn, aanvangende op het tijdstip waarop die beschikking
      in werking is getreden, vastgesteld, eerst bij het verstrijken waarvan de in de beschikking vervatte eis van
      toepassing wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel12
