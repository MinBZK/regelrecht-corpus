  - number: 63b
    text: |-
      1 Onze Minister van Verkeer en Waterstaat stelt jaarlijks een programma vast met betrekking tot de hem bekende
      onderzoeksgevallen en gevallen van ernstige verontreiniging, waarbij sprake is van een verontreiniging of
      aantasting als bedoeld in [artikel 63][ref1], hierna te noemen: saneringsprogramma voor de waterbodem van
      rijkswateren.

      2 Het saneringsprogramma voor de waterbodem van rijkswateren bevat met betrekking tot de in het eerste lid bedoelde
      gevallen ten minste een overzicht van de door of vanwege Onze Minister van Verkeer en Waterstaat en van de aan hem
      bekende door anderen in de eerstvolgende vier jaren te verrichten activiteiten en een aanduiding van het tijdstip
      waarop met het onderzoek of de sanering van die gevallen zal of dient te worden aangevangen.

      3 Onze Minister van Verkeer en Waterstaat pleegt bij de voorbereiding van het saneringsprogramma voor de waterbodem
      van rijkswateren overleg met de overheidsorganen die betrokken zijn of een belang hebben bij de activiteiten,
      bedoeld in het tweede lid.

      4 Onze Minister van Verkeer en Waterstaat legt het saneringsprogramma voor de waterbodem van rijkswateren bij
      de aanbieding van de rijksbegroting over aan de Staten-Generaal. Het gaat vergezeld van een verslag over de
      besteding in het voorafgaande kalenderjaar van gelden op de begroting, bestemd voor de sanering van de bodem van
      rijkswateren.

      5 Ten aanzien van de inhoud van het verslag, bedoeld in het vierde lid, tweede volzin, is
      [artikel 84, tweede lid, tweede volzin][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel84
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel63b
