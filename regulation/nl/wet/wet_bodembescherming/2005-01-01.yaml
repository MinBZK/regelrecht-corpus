  - number: '54'
    text: |-
      [Artikel 52][ref1] is van overeenkomstige toepassing indien burgemeester en wethouders overgaan tot het onderzoek
      van onderzoeksgevallen of het saneringsonderzoek of de sanering van gevallen van ernstige verontreiniging, met dien
      verstande dat de verordening door de gemeenteraad wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel52
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel54
