  - number: '95'
    text: |-
      1 Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de artikelen 18.3-18.16 van de
      Wet milieubeheer van toepassing.

      2 Het in artikel 18.2 van de Wet milieubeheer bedoelde bestuursorgaan heeft tot taak zorg te dragen voor de
      bestuursrechtelijke handhaving van het ten aanzien van de betrokken inrichting bij of krachtens deze wet bepaalde.

      3 Onze betrokken Minister, gedeputeerde staten, burgemeester en wethouders en de waterkwaliteitsbeheerder hebben
      tot taak zorg te dragen voor de bestuursrechtelijke handhaving van [artikel 13][ref1].

      4 De volgende bestuursorganen hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het
      bepaalde bij of krachtens § 3 van [hoofdstuk IV][ref2] en artikel 72:

      a. in gevallen als bedoeld in [de artikelen 63a][ref3] en [63d][ref4]: de waterkwaliteitsbeheerder;

      b. in gevallen als bedoeld in [artikel 88, eerste, tweede en negende lid][ref5]: burgemeester en wethouders,
      onderscheidenlijk het dagelijks bestuur van het regionaal openbaar lichaam;

      c. in andere gevallen: gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003994#HoofdstukIV
