  - number: '77'
    text: |-
      1 Indien de in [artikel 76, vierde lid][ref1], bedoelde kosten van een geval naar verwachting een bij algemene
      maatregel van bestuur vast te stellen bedrag te boven gaan, kan, Onze Minister, voor zover hij met het onderzoek en
      de sanering van dat geval instemt, aan de betrokken provincie een bijdrage in de kosten daarvan verlenen. De eerste
      volzin is van overeenkomstige toepassing op de kosten die ten laste van gedeputeerde staten komen bij de toepassing
      van [artikel 42][ref2].

      2 Ten aanzien van de in het eerste lid bedoelde bijdrage en de in dat lid bedoelde kosten zijn
      [artikel 76, derde en vierde lid][ref3], 79 en 81 van overeenkomstige toepassing.

      3 Onze Minister stelt nadere regels omtrent de indiening van een verzoek om een bijdrage als bedoeld in het eerste
      lid, omtrent de gegevens die ten behoeve van de vaststelling van een zodanige bijdrage worden verstrekt, alsmede
      omtrent de doelmatigheid van de besteding van die bijdrage.

      4 Renteopbrengsten van nog niet bestede gelden die de provincie ingevolge het eerste lid heeft ontvangen, worden
      in het jaar volgend op het jaar waarvoor de bijdrage is verleend, besteed ten behoeve van gevallen als bedoeld in
      [artikel 76, eerste lid][ref4]. Artikel 76, zevende lid, tweede en derde volzin, is van overeenkomstige toepassing.


