  - number: '80'
    text: |-
      1 De gemeente kan Onze Minister verzoeken vrijgesteld te worden van de verplichting tot het betalen van de
      ingevolge [artikel 79][ref1] verschuldigde bijdrage, indien zij ten genoegen van Onze Minister aantoont dat zij ten
      aanzien van het betrokken geval getracht heeft de verontreiniging te voorkomen of tegen te gaan met alle middelen
      die haar daarvoor redelijkerwijs ter beschikking stonden.

      2 Indien Onze Minister besluit tot vrijstelling, verhoogt hij de in [artikel 76, eerste lid][ref2], bedoelde
      bijdrage voor de betrokken provincie met een bedrag ter hoogte van de in het eerste lid bedoelde bijdrage dan wel,
      indien [artikel 77][ref3] van toepassing is, verleent hij aan de betrokken provincie een afzonderlijke bijdrage ter
      hoogte van de in het eerste lid bedoelde bijdrage.

      3 De vrijstelling wordt slechts verleend voor gevallen waarin de oorzaak van de verontreiniging of aantasting zich
      heeft voorgedaan voor de datum waarop [dit artikel][ref4] in werking treedt.


