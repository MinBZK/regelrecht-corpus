  - number: '76'
    text: |-
      1 Onze Minister verleent ieder jaar voor 1 oktober aan iedere provincie een door hem vast te stellen bijdrage ter
      tegemoetkoming in de in het daarop volgende jaar te maken kosten van het onderzoek van onderzoeksgevallen en van
      het saneringsonderzoek en de sanering van gevallen van ernstige verontreiniging, die in de betrokken provincie
      zullen worden uitgevoerd door of vanwege gedeputeerde staten, of, indien het betreft gevallen als bedoeld in
      [artikel 63][ref1], door de waterkwaliteitsbeheerders in de betrokken provincie. De bijdrage is mede bedoeld
      ter tegemoetkoming in de kosten, bedoeld in [de artikelen 79, vijfde lid][ref2], en [82, vierde lid][ref3].
      In afwijking van [de eerste volzin][ref4] kan Onze Minister op verzoek van gedeputeerde staten of een
      waterkwaliteitsbeheerder als bedoeld in [artikel 63d, eerste lid][ref5], een bijdrage verlenen voor een periode van
      vijf jaar.

      2 Onze Minister stelt regels omtrent de berekening en de doelmatigheid van de besteding van de overeenkomstig het
      eerste lid te verlenen bijdrage.

      3 Uit de bijdrage bekostigt de provincie volledig:

      a. de kosten van oriënterend onderzoek, uitgezonderd in de gevallen, bedoeld in [artikel 63][ref6], en

      b. indien ingevolge:

      1°. artikel 79, vierde lid, de bijdrage van de gemeente is verlaagd dan wel geen bijdrage is verschuldigd, het
      bedrag waarmee die bijdrage is verlaagd onderscheidenlijk die bijdrage;

      2°. Artikel 82, tweede lid, een bijdrage aan een gemeente wordt verleend, die bijdrage.

      4 Uit de bijdrage bekostigt de provincie per geval van verontreiniging negentig procent van de kosten van nader
      onderzoek en van saneringsonderzoek en sanering van gevallen van ernstige verontreiniging als bedoeld in het eerste
      lid, voor zover die kosten niet overeenkomstig [artikel 79, eerste lid][ref7], of [artikel 81][ref8], ten laste van
      de betrokken gemeente onderscheidenlijk de betrokken waterkwaliteitsbeheerder komen.

      5 Onder de kosten van onderzoek en sanering zijn mede begrepen de kosten van:

      a. schadevergoedingen verleend op grond van [artikel 74][ref9];

      b. verkrijging bij minnelijke schikking van de eigendom of het gebruik van onroerende zaken dan wel van beperkte
      rechten als bedoeld in [artikel 50, eerste lid, onder ][ref10];

      c. vordering krachtens [artikel 50][ref11];

      d. indien ingevolge [artikel 83][ref12] een bijdrage aan een gemeente wordt verleend, die bijdrage.

      6 Bij ministeriële regeling kunnen de in [dit artikel][ref13] bedoelde kosten nader worden benoemd.

      7 Renteopbrengsten van nog niet bestede gelden die de provincie ingevolge het eerste lid heeft ontvangen, worden in
      het jaar volgend op het jaar waarvoor de bijdrage is verleend, besteed ten behoeve van gevallen als bedoeld in dat
      lid. Het in artikel 84 bedoelde verslag heeft mede betrekking op die rente. Bij ministeriële regeling worden regels
      gesteld omtrent de berekening ervan.


