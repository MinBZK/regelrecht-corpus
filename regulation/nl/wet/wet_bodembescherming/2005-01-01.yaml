  - number: '29'
    text: |-
      1 Gedeputeerde staten stellen in een beschikking vast of sprake is van een geval van ernstige verontreiniging:

      a. naar aanleiding van een nader onderzoek of

      b. naar aanleiding van een melding als bedoeld in [artikel 28, eerste lid][ref1].

      2 Zij beslissen zo spoedig mogelijk, doch uiterlijk binnen dertien weken na ontvangst van het nader onderzoek of
      de melding.

      3 Degene die een melding als bedoeld in [artikel 28, eerste lid][ref2], heeft gedaan, gaat niet over tot de in dat
      lid bedoelde handelingen dan:

      a. nadat het advies, bedoeld in [artikel 23, eerste lid][ref3], is gevraagd, en

      b. nadat een beschikking als bedoeld in het eerste lid, onder *b*, is gegeven, dan wel

      c. indien binnen de termijn, bedoeld in het tweede lid, geen beschikking is gegeven als bedoeld in het eerste lid,
      onder *b*: nadat die termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel23
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel29
