  - number: 75a
    text: |-
      1 [De artikelen 76][ref1] tot en met [86][ref2] zijn niet van toepassing op de kosten van het
      onderzoek van onderzoeksgevallen en van het saneringsonderzoek en de sanering van gevallen
      van ernstige verontreiniging die worden genoemd in een ontwikkelingsprogramma als bedoeld in
      [artikel 7, eerste lid, van de Wet stedelijke vernieuwing][ref3], een aanvraag als bedoeld in
      [artikel 7, vierde lid, van die wet][ref4] of een aanvraag voor een subsidie als bedoeld in de
      [artikelen 19, eerste lid][ref5], of [20, eerste lid, van die wet][ref6].

      2 Bijdragen als bedoeld in [artikel 76, eerste lid][ref7], worden niet gebruikt voor het
      onderzoek van onderzoeksgevallen en van het saneringsonderzoek en de sanering van gevallen
      van ernstige verontreiniging die worden genoemd in een ontwikkelingsprogramma als bedoeld in
      [artikel 7, eerste lid, van de Wet stedelijke vernieuwing][ref8], een aanvraag als bedoeld in
      [artikel 7, vierde lid, van die wet][ref9] of een aanvraag voor een subsidie als bedoeld in de
      [artikelen 19, eerste lid][ref10], of [20, eerste lid, van die wet][ref11].


