  - number: 92a
    text: |-
      1 De inspecteur is bevoegd van een bestuursorgaan dat met de uitvoering of de handhaving van het bij of krachtens
      deze wet bepaalde is belast, daarover inlichtingen te vorderen.

      2 De artikelen 5:13, 5:17 en 5:20 van de Algemene wet bestuursrecht zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel92a
  - number: '93'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel93
  - number: '94'
    text: |-
      Een gedraging in strijd met een voorschrift, krachtens [de artikelen 64, tweede lid][ref1], [65, derde lid][ref2],
      of [66, eerste lid][ref3], aan een vrijstelling of ontheffing verbonden, is verboden.


