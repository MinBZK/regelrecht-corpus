  - number: '40'
    text: |-
      1 In afwijking van [de artikelen 28][ref1] en [39][ref2] kunnen gedeputeerde staten toestaan bij een melding als
      bedoeld in [artikel 28][ref3], die een voornemen betreft om een handeling te verrichten ten gevolge waarvan slechts
      een gering gedeelte van de verontreiniging van de bodem wordt verplaatst, te volstaan met het verstrekken van:

      a. de resultaten van een nader onderzoek van het betrokken gedeelte en

      b. een saneringsplan voor het betrokken gedeelte.

      2 De stukken, bedoeld in het eerste lid, behoeven de goedkeuring van gedeputeerde staten. Artikel 39, tweede lid,
      tweede en derde volzin, is van overeenkomstige toepassing voor het betrokken gedeelte.


