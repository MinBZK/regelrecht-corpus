  - number: '85'
    text: |-
      Indien gedeputeerde staten niet hebben voldaan aan de ingevolge [artikel 84][ref1] geldende verplichting, kan Onze
      Minister bepalen dat de provincie, naast de bijdragen, bedoeld in [artikel 81, eerste lid][ref2], aan hem nogmaals
      een bedrag betaalt, gelijk aan het totaal van die bijdragen verschuldigd in het jaar waarop het verslag, bedoeld in
      [artikel 84, eerste lid][ref3], betrekking heeft.


