  - number: '15'
    text: |-
      1 Tot de krachtens [de artikelen 6][ref1] tot en met [12][ref2] bij algemene maatregel van bestuur te stellen
      regels kunnen behoren regels, inhoudende:

      a. een verbod een werkzaamheid als daar bedoeld te verrichten indien daarbij niet voldaan wordt aan bij die
      maatregel gestelde eisen met betrekking tot de in het kader van die werkzaamheid te gebruiken stoffen of
      voorwerpen;

      b. een verbod zodanige werkzaamheid te verrichten anders dan overeenkomstig bij die maatregel aan te geven eisen
      met betrekking tot de wijze waarop, de omstandigheden waaronder of de plaats waar die werkzaamheid mag worden
      verricht;

      c. een verbod zodanige werkzaamheid te verrichten zonder dat bij een onderzoek op een bij die maatregel aan te
      geven wijze is aangetoond dat daardoor geen verontreiniging of aantasting van de bodem zal optreden, dan wel geen
      verontreiniging of aantasting die een bepaalde waarde overschrijdt;

      d. een verbod zodanige werkzaamheid te verrichten zonder zulks te melden op een bij die maatregel aan te geven
      wijze aan een daarbij aan te geven bestuursorgaan onder vermelding van daarbij aan te geven gegevens.

      2 Tot de in het eerste lid bedoelde regels kan tevens een verbod behoren in het kader van een werkzaamheid als daar
      bedoeld een bij die maatregel aan te geven voorwerp bestemd voor het opslaan of transporteren van daarbij aan te
      geven stoffen, te gebruiken indien dat voorwerp:

      a. niet op een bij of krachtens die maatregel aan te geven wijze is goedgekeurd;

      b. niet behoort tot een type dat bij een keuring verricht aan de hand van bij of krachtens die maatregel daartoe
      vastgestelde voorschriften, is goedgekeurd.

      3 Indien van een werkzaamheid als bedoeld in [de artikelen 6][ref3] tot en met [12][ref4] een ernstige
      verontreiniging of aantasting van de bodem het gevolg kan zijn, kunnen de krachtens die artikelen bij algemene
      maatregel van bestuur vast te stellen regels een algeheel verbod inhouden zodanige werkzaamheid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel12
