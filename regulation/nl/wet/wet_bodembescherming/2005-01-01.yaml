  - number: 63j
    text: |-
      1 Indien een oppervlaktewater onverwijld op diepte moet worden gebracht uit een oogpunt van bevaarbaarheid,
      inname van water of waterkwantiteitsbeheer en in verband met een onvoorziene lokale verondieping als gevolg van
      buitengewone hydrodynamische omstandigheden, kan op verzoek ontheffing worden verleend van [artikel 28][ref1]:

      a. als er sprake is van een verontreiniging of aantasting als bedoeld in [artikel 63][ref2]: door Onze Minister van
      Verkeer en Waterstaat;

      b. als er sprake is van een verontreiniging of aantasting als bedoeld in [artikel 63][ref3]: door gedeputeerde
      staten.

      2 Aan een ontheffing worden de voorschriften verbonden die naar het oordeel van Onze Minister van Verkeer en
      Waterstaat onderscheidenlijk gedeputeerde staten in het belang van de sanering van de bodem nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
