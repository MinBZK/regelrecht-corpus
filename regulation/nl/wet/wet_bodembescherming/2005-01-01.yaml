  - number: '38'
    text: |-
      1 Degene die de bodem saneert, dient de sanering zodanig uit te voeren dat daardoor de functionele eigenschappen
      die de bodem voor mens, plant of dier heeft, worden behouden of hersteld, tenzij zich omstandigheden voordoen als
      bedoeld in het derde lid.

      2

      3 Bij algemene maatregel van bestuur wordt bepaald in welke daarbij aangewezen omstandigheden die verband houden
      met bijzondere kenmerken van het betrokken geval van verontreiniging, maatregelen kunnen worden genomen, die
      leiden tot het isoleren en het beheersen van de verontreiniging alsmede tot het controleren van de effecten van het
      isoleren en het beheersen. Bij ministeriële regeling worden nadere regels gesteld omtrent isoleren, beheersen en
      controleren als bedoeld in de eerste volzin.

      4 Indien het belang van de bescherming van de bodem zich daartegen niet verzet, kunnen gedeputeerde staten op
      verzoek van degene die de bodem saneert, bepalen dat de sanering in fasen wordt uitgevoerd. Zij geven daarbij aan:

      a. voor de uitvoering van welke fasen vooraf een melding aan hen wordt gedaan en welke gegevens daarbij worden
      overgelegd;

      b. in welke fase welke tijdelijke beveiligingsmaatregelen dienen te worden getroffen;

      c. op welke wijze en op welke tijdstippen aan hen verslag wordt gedaan van de uitvoering van de tijdelijke
      beveiligingsmaatregelen en

      d. welke wijzigingen van het gebruik van de bodem aan hen dienen te worden gemeld.

      5 Naar aanleiding van een melding als bedoeld in het vierde lid, onder *a* of *d*, of een verslag als bedoeld
      in het vierde lid, onder *c*, kunnen gedeputeerde staten aanwijzingen geven omtrent de verdere uitvoering van de
      sanering, die een wijziging inhouden van onderdelen van het saneringsplan waarmee reeds is ingestemd.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel38
  - number: '39'
    text: |-
      1 Indien een geval van ernstige verontreiniging wordt vermoed gaat de melding, bedoeld in [artikel 28][ref1], voor
      zover dit niet reeds ingevolge dat artikel is vereist, tevens vergezeld van de resultaten van het nader onderzoek
      alsmede de resultaten van het saneringsonderzoek en van een saneringsplan, dat in ieder geval inhoudt:

      a. een nadere beschrijving van de wijze waarop de sanering zal worden uitgevoerd;

      b. een beschrijving van de effecten die met de te treffen saneringsmaatregelen worden beoogd, waaronder mede
      begrepen een nadere beschrijving van de kwaliteit van de bodem die met de sanering zal worden bereikt;

      c. indien na de sanering verontreiniging in de bodem aanwezig blijft: een beschrijving van de wijze waarop het
      betrokken grondgebied in verband met het isoleren van die verontreiniging zal worden beheerd en van de maatregelen
      die zullen worden genomen in verband met beperkingen die de verontreiniging voor het gebruik van de bodem met zich
      brengt;

      d. een begroting van de kosten van de sanering en een overzicht van de daarvoor beschikbare middelen;

      e. indien de verontreinigde grond zal worden afgegraven of het verontreinigde grondwater zal worden onttrokken, de
      bestemming van die grond onderscheidenlijk dat grondwater;

      f. een beschrijving van de werkzaamheden op grond waarvan gedeputeerde staten kunnen beoordelen of de sanering
      overeenkomstig het plan is uitgevoerd.

      Provinciale staten kunnen nadere regels stellen omtrent de gegevens die in het saneringsplan worden opgenomen.

      2 Het saneringsplan behoeft de instemming van gedeputeerde staten, die slechts met het plan instemmen indien door
      de daarin beschreven sanering naar hun oordeel wordt voldaan aan het bij of krachtens [artikel 38][ref2] bepaalde.
      Zij beslissen hierover binnen dertien weken na de indiening van het saneringsplan. Zij kunnen deze termijn binnen
      vier weken na de datum van ontvangst van de melding verlengen met ten hoogste dertien weken. Met de uitvoering van
      het saneringsplan kan worden begonnen nadat gedeputeerde staten met dat plan hebben ingestemd of die instemming
      van rechtswege is verleend. Aan de instemming kunnen voorwaarden worden verbonden. De instemming is van rechtswege
      verleend, indien gedeputeerde staten niet binnen de instemmingstermijn van dertien weken of voor de afloop van de
      termijn waarmee is verlengd een beslissing hebben genomen. Een instemming van rechtswege wordt aangemerkt als een
      besluit in de zin van [artikel 1:3 van de Algemene wet bestuursrecht][ref3].

      3 Indien het voornemen, bedoeld in [artikel 28, eerste lid][ref4], inhoudt dat de sanering niet onmiddellijk wordt
      uitgevoerd nadat de beschikking, bedoeld in [artikel 29, eerste lid][ref5], is gegeven, kunnen gedeputeerde staten
      bepalen dat de in het eerste lid bedoelde stukken niet reeds bij de melding behoeven te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel29
