        paragraaf: '4'
  - number: '84'
    text: |-
      1 Gedeputeerde staten doen Onze Minister ieder jaar voor 1 september verslag over de besteding van de door
      hem overeenkomstig [de artikelen 76][ref1] en [77][ref2] ten behoeve van het voorgaande kalenderjaar verleende
      bijdragen.

      2 Onze Minister stelt regels omtrent de wijze waarop het verslag wordt gedaan, alsmede omtrent de gegevens die
      daarbij dienen te worden verstrekt. Die gegevens omvatten in ieder geval gegevens omtrent de wijze van onderzoek
      van de betrokken onderzoeksgevallen en omtrent de wijze waarop het saneringsonderzoek en de sanering in de
      betrokken gevallen zijn uitgevoerd.

      3 Onze Minister doet de Staten-Generaal jaarlijks een verslag toekomen waarin de provinciale verslagen zijn
      samengevat.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel77
