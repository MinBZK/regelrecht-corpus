  - number: '18'
    text: |-
      Bij een algemene maatregel van bestuur, vastgesteld krachtens [de artikelen 6][ref1] tot en met [12][ref2], kan
      worden bepaald dat bij die maatregel gestelde regels slechts gelden in gebieden behorende tot een daarbij met het
      oog op het karakter van de bodem aangegeven categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel18
