  - number: '65'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in [de artikelen 6][ref1] tot en met [11][ref2] kan bepaald
      worden dat bij de maatregel aangewezen bestuursorganen, in gevallen waarin het belang van de bescherming van de
      bodem zich daartegen niet verzet, op daartoe strekkend verzoek ontheffing kunnen verlenen van bij de maatregel
      aangegeven verboden en verplichtingen. Indien als bestuursorgaan niet een orgaan van het Rijk is aangewezen, wordt
      bij een beschikking met betrekking tot een ontheffing de ingevolge artikel 1.2 van de Wet milieubeheer vastgestelde
      provinciale milieuverordening in acht genomen.

      2 Een bevoegdheid als bedoeld in het eerste lid geldt niet met betrekking tot inrichtingen waarvoor een vergunning
      als bedoeld in artikel 8.1 van de Wet milieubeheer is vereist.

      3 Een ontheffing kan onder beperkingen worden verleend; aan de ontheffing kunnen voorschriften worden verbonden. De
      beperkingen en voorschriften worden gesteld in het belang van de bescherming van de bodem.

      4 Bij een maatregel als bedoeld in het eerste lid kunnen ter uitvoering van een voor Nederland verbindend verdrag
      of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld met betrekking
      tot de gevallen waarin een ontheffing kan worden verleend en de voorschriften of beperkingen, die in ieder geval
      aan een ontheffing dienen te worden verbonden.

      5 Afdeling 3.5 van de Algemene wet bestuursrecht en afdeling 13.2 van de Wet milieubeheer zijn van toepassing met
      betrekking tot de totstandkoming van een beschikking op een verzoek om verlening van een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel11
