  - number: '64'
    text: |-
      1 Onze Minister kan in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, de Technische
      commissie bodembescherming gehoord, bij ministeriële regeling voor daarbij aangegeven categorieën van handelingen
      vrijstelling verlenen van krachtens [Hoofdstuk III][ref1], gestelde regels, voor zover het belang van de
      bescherming van de bodem zich daartegen niet verzet.

      2 Aan een vrijstelling worden de voorschriften verbonden, die nodig zijn in het belang van de bescherming van de
      bodem.

      3 Indien de in het eerste lid bedoelde, krachtens [hoofdstuk III][ref2] gestelde regels handelingen betreffen
      die tot doel hebben om de bodem te bemesten dan wel door toevoeging van materiaal de structuur van de bodem
      te verbeteren, kan in afwijking van het eerste lid Onze Minister van Landbouw, Natuurbeheer en Visserij in
      overeenstemming met Onze Minister, de Technische commissie bodembescherming gehoord, vrijstelling verlenen van deze
      regels, voor zover het belang van de bescherming van de bodem zich daartegen niet verzet. Het tweede lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0003994#HoofdstukIII
