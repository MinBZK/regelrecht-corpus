  - number: 63d
    text: |-
      1 In gevallen van verontreiniging of aantasting van de bodem onder oppervlaktewater dat behoort tot de
      oppervlaktewateren, bedoeld in artikel 3, tweede lid, van de Wet verontreiniging oppervlaktewateren, berusten
      de in [artikel 48][ref1] en [49, eerste en tweede lid][ref2], juncto [artikel 30][ref3] aan gedeputeerde staten
      toegekende taken en bevoegdheden bij de waterkwaliteitsbeheerder. Het bepaalde in de eerste volzin is tevens van
      toepassing op gevallen van verontreiniging of aantasting van de oever van oppervlaktewater als bedoeld in die
      volzin, tenzij redelijkerwijs kan worden aangenomen dat die verontreiniging of aantasting geen gevolgen heeft voor
      de bodem onder dat water.

      2 In gevallen als bedoeld in het eerste lid:

      a. is met betrekking tot de uitoefening van de krachtens dat lid aan de waterkwaliteitsbeheerder toekomende
      bevoegdheden [artikel 47][ref4] van overeenkomstige toepassing;

      b. treedt, indien de waterkwaliteitsbeheerder een bevel geeft als bedoeld in [artikel 35, eerste lid][ref5],
      juncto [artikel 30][ref6], of als bedoeld in [artikel 49][ref7] juncto [artikel 30][ref8], voor de toepassing van
      [artikel 55][ref9] de waterkwaliteitsbeheerder in de plaats van gedeputeerde staten, en

      c. wordt de schade ten gevolge van een door de waterkwaliteitsbeheerder gegeven bevel als bedoeld in
      [artikel 49][ref10] juncto [artikel 30, derde of vierde lid][ref11], vergoed door de waterkwaliteitsbeheerder, en
      is [artikel 74, tweede, derde en vierde lid][ref12], op die schadevergoeding van overeenkomstige toepassing.

      3 De opgave op grond van [artikel 41][ref13] wordt ook gedaan door de waterkwaliteitsbeheerder voor zover
      het betreft hem bekende onderzoeksgevallen en gevallen van ernstige verontreiniging in de bodem onder
      oppervlaktewater dat tot zijn beheer behoort. [Artikel 41, eerste lid, tweede volzin][ref14], is ten aanzien van de
      waterkwaliteitsbeheerder van overeenkomstige toepassing.


