  - number: 81a
    text: |-
      1 In gevallen als bedoeld in [artikel 63][ref1], blijven [de artikelen 79][ref2] tot en met [81][ref3] buiten
      toepassing.

      2 In gevallen als bedoeld in het eerste lid, draagt de waterkwaliteitsbeheerder in een geval waarin nader onderzoek
      zal plaats vinden of in een geval van ernstige verontreiniging, voor zover dit geval de bodem onder of de oever van
      oppervlaktewater dat tot zijn beheer behoort betreft, met betrekking tot dat geval:

      a. de in artikel 76, vierde lid, bedoelde kosten per geval, tot ten hoogste het bedrag dat wordt
      verkregen door een bij algemene maatregel van bestuur vast te stellen bedrag te vermenigvuldigen
      met het aantal vervuilingseenheden met betrekking tot het zuurstofverbruik waarover de betrokken
      waterkwaliteitsbeheerder op 1 januari van het jaar waarop de bijdrage verschuldigd wordt, de heffing, bedoeld in
      [artikel 18, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref4] heft, en daarenboven,

      b. indien de in [artikel 76, vierde lid][ref5], bedoelde kosten per geval meer bedragen dan het bij toepassing
      van [onderdeel ][ref6] door vermenigvuldiging verkregen bedrag, tien procent van het overblijvende gedeelte van
      die kosten.

      3 Bij de maatregel, bedoeld in het tweede lid, onder *a*, wordt een maximum gesteld aan het bij toepassing van dat
      onderdeel door vermenigvuldiging verkregen bedrag.

      4 Voor de berekening van de kosten per geval, bedoeld in het tweede lid, worden de kosten van de gevallen waarvan
      de sanering met toepassing van [artikel 42][ref7] tezelfdertijd wordt begonnen, beschouwd als kosten van een enkel
      geval.

      5 De waterkwaliteitsbeheerder draagt de volledige kosten van oriënterend onderzoek van gevallen die de bodem onder
      oppervlaktewater betreffen die tot zijn beheer behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
