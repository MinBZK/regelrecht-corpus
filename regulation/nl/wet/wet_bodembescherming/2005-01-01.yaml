  - number: '66'
    text: |-
      1 Beperkingen waaronder een ontheffing is verleend, en voorschriften die daaraan zijn verbonden, kunnen in het
      belang van de bescherming van de bodem worden gewijzigd, aangevuld of ingetrokken. Indien geen beperkingen of
      voorschriften zijn gesteld kan zulks in dat belang alsnog geschieden.

      2 Een ontheffing kan geheel of gedeeltelijk worden ingetrokken indien:

      a. een aan de ontheffing verbonden voorschrift niet wordt nageleefd;

      b. zulks noodzakelijk is in het belang van de bescherming van de bodem.

      3 De paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht en afdeling 13.2 van de Wet milieubeheer
      zijn van toepassing met betrekking tot de totstandkoming van de beschikking op een verzoek van de houder van een
      ontheffing tot wijziging van daaraan verbonden voorschriften of beperkingen waaronder zij is verleend. Paragraaf
      3.5.6 van de Algemene wet bestuursrecht en afdeling 13.2 van de Wet milieubeheer zijn van toepassing met betrekking
      tot de totstandkoming van andere beschikkingen krachtens het eerste lid en van beschikkingen krachtens het tweede
      lid, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel66
  - number: '67'
    text: |-
      1 Het bestuursorgaan dat krachtens [artikel 65, eerste lid][ref1], bevoegd is of zou zijn te beslissen op een
      verzoek om een ontheffing, stelt de inspecteur in de gelegenheid hem van advies te dienen omtrent het ontwerp van
      de beschikking op het verzoek om ontheffing, alsmede omtrent het voornemen tot het geven van een beschikking en het
      ontwerp van een beschikking krachtens [artikel 66][ref2], anders dan op verzoek van de houder van de ontheffing.
      Bij algemene maatregel van bestuur kunnen andere bestuursorganen worden aangewezen, die, indien het verzoek een
      daarbij aangegeven onderwerp betreft, overeenkomstig de eerste volzin van dit lid in de gelegenheid worden gesteld
      van advies te dienen.

      2 Gedeputeerde staten onderscheidenlijk burgemeester en wethouders zenden een afschrift van een overeenkomstig
      [artikel 65][ref3] of [66][ref4] genomen beschikking aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel65
