        artikel: '13'
        hoofdstuk: III
  - number: '28'
    text: |-
      1 Degene die voornemens is de bodem te saneren dan wel handelingen te verrichten ten gevolge waarvan de
      verontreiniging van de bodem wordt verminderd of verplaatst, doet van dat voornemen melding bij gedeputeerde staten
      van de betrokken provincie.

      2 Bij de melding, bedoeld in het eerste lid, worden gegevens verstrekt omtrent de resultaten van onderzoek met
      betrekking tot de kwaliteit van de bodem, daarbij inbegrepen de resultaten van eventueel nader onderzoek, het
      tijdstip waarop met die handeling zal worden aangevangen, en indien verontreinigde grond zal worden afgegraven of
      verontreinigd grondwater zal worden onttrokken, de bestemming van die grond en dat grondwater. Indien grond zal
      worden afgegraven, wordt bij de melding tevens aangegeven of deze zal worden gereinigd en, indien de grond geheel
      of gedeeltelijk niet zal worden gereinigd, worden de redenen daarvoor vermeld.

      3 Een melding als bedoeld in het eerste lid kan achterwege blijven, indien de betrokkene redelijkerwijs
      kan aannemen dat de sanering of de handeling waarop zijn voornemen betrekking heeft geen geval van ernstige
      verontreiniging betreft en tevens vaststaat:

      1°. dat de betreffende hoeveelheid verontreinigde grond of verontreinigd grondwater 50 kubieke meter
      onderscheidenlijk 1000 kubieke meter niet te boven gaat, of

      2°. dat uit de aard van de in het eerste lid bedoelde handelingen volgt dat de grond slechts tijdelijk wordt
      verplaatst en na verplaatsing wordt teruggebracht.

      4 Bij algemene maatregel van bestuur kan worden bepaald in welke andere gevallen dan die, genoemd in het derde
      lid, een melding als bedoeld in het eerste lid achterwege kan blijven, mits het niet gevallen van ernstige
      verontreiniging betreft.

      5 Gedeputeerde staten stellen de inspecteur en, indien het niet hun voornemen betreft, burgemeester en wethouders
      van de betrokken gemeente op de hoogte van een ingevolge het eerste lid gedane melding. Tegelijkertijd doen zij
      daarvan kennisgeving in één of meer dag-, nieuws- of huis-aan-huis-bladen.

      6 [Dit artikel][ref1] is niet van toepassing in gevallen als bedoeld in [de artikelen 27][ref2],
      [30, eerste lid][ref3], en [43][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel43
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel28
