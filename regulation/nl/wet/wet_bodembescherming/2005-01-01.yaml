    text: |-
      [Artikel 55, eerste, derde en vierde lid][ref1], is niet van toepassing op beschikkingen en bevelen als bedoeld
      in dat artikel, die betrekking hebben op bodem onder oppervlaktewater die eigendom is van een publiekrechtelijke
      rechtspersoon.


