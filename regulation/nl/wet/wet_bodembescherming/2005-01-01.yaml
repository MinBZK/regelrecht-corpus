  - number: '97'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [de artikelen 6][ref1] tot en met [11][ref2] wordt voorzien
      in hetgeen met betrekking tot het gaan gelden van het in zodanige maatregel bepaalde regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel11
