  - number: '79'
    text: |-
      1 De gemeente op wier grondgebied zich de oorzaak voordoet van de verontreiniging in een geval waarin nader
      onderzoek zal plaatsvinden of van een geval van ernstige verontreiniging, draagt met betrekking tot dat geval:

      a. de in artikel 76, vierde lid, bedoelde kosten per geval, tot een bedrag van:

      1°. voor gemeenten die volgens de bevolkingscijfers van het Centraal Bureau voor de Statistiek op 1 januari van het
      jaar waarin een bijdrage verschuldigd wordt, 20 000 of meer inwoners hebben: € 45 378,02;

      2°. voor de overige gemeenten: het bedrag dat wordt verkregen door het aantal inwoners dat de betrokken gemeente op
      1 januari van het jaar waarin de bijdrage verschuldigd wordt, volgens de bevolkingscijfers van het Centraal Bureau
      voor de Statistiek heeft, te vermenigvuldigen met € 2,27, of

      b. indien de in [artikel 76, vierde lid][ref1], bedoelde kosten per geval meer bedragen dan het met toepassing van
      [onderdeel ][ref2] bepaalde bedrag: die kosten tot dat bedrag, vermeerderd met zeven en een half procent van het
      overblijvende gedeelte van die kosten.

      2 Indien het onderzoek of de sanering door de provincie wordt verricht, betaalt de gemeente het door haar te dragen
      gedeelte aan de provincie op verzoek van gedeputeerde staten.

      3 Voor de berekening van de kosten per geval, bedoeld in het eerste lid, worden de kosten van de gevallen waarvan
      de sanering met toepassing van [artikel 42][ref3] tezelfdertijd wordt begonnen, beschouwd als kosten van een enkel
      geval.

      4 Indien een gemeente verkeert of door toepassing van het eerste lid zou komen te verkeren in een geval als bedoeld
      in [artikel 12 van de Financiële-verhoudingswet][ref4] kan Onze Minister in overeenstemming met Onze Ministers
      van Binnenlandse Zaken en van Financiën na overleg met gedeputeerde staten van de betrokken provincie op verzoek
      van burgemeester en wethouders de bijdrage op een lager bedrag vaststellen, dan wel bepalen dat de gemeente geen
      bijdrage verschuldigd is.

      5 In een geval als bedoeld in het vierde lid, vullen gedeputeerde staten de bijdrage van de gemeente aan met het
      bedrag waarmee zij is verminderd, onderscheidenlijk verlenen zij die bijdrage.


