  - number: '81'
    text: |-
      1 De provincie draagt twee en een half procent van de in [artikel 76, vierde lid][ref1], bedoelde kosten per
      geval van ernstige verontreiniging of geval waarin nader onderzoek zal plaatsvinden, indien die kosten niet
      overeenkomstig [artikel 79, eerste lid, onder ][ref2], geheel ten laste van de betrokken gemeente komen.

      2 Indien het onderzoek of de sanering ingevolge een door gedeputeerde staten toegewezen verzoek als bedoeld in
      [artikel 53, eerste lid][ref3], door burgemeester en wethouders wordt verricht, betaalt de provincie op hun verzoek
      het door haar te dragen gedeelte van de kosten aan de gemeente.


