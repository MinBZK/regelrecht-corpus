  - number: '96'
    text: |-
      1 De bevoegdheid van gemeenten en waterschappen tot het maken van verordeningen blijft ten aanzien van het
      onderwerp waarin deze wet voorziet, gehandhaafd, voor zover deze verordeningen niet met het bij of krachtens deze
      wet bepaalde in strijd zijn.

      2 In afwijking van de [artikelen 119 van de Provinciewet][ref1], 122 van de [Gemeentewet][ref2] en 59, tweede
      lid, van de [Waterschapswet][ref3] blijven de bepalingen van verordeningen van provincies, van gemeenten en van
      waterschappen betreffende het onderwerp waarin deze wet voorziet - behoudens in de gevallen waarin strijd met de
      bij of krachtens deze wet gestelde voorschriften zou ontstaan - nog van kracht tot twee jaar na het in werking
      treden van [dit artikel][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005416
