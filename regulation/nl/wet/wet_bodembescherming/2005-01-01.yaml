  - number: 63f
    text: |-
      In gevallen als bedoeld in [artikel 63][ref1]:

      a. stellen gedeputeerde staten, ingeval een melding wordt gedaan overeenkomstig [artikel 27][ref2] of 28, tevens de
      waterkwaliteitsbeheerder daarvan op de hoogte;

      b. nemen gedeputeerde staten geen beschikking als bedoeld in [de artikelen 29, eerste lid][ref3],
      [37, vijfde lid][ref4], [38, vierde of vijfde lid][ref5], [39, tweede lid][ref6], of
      [40, eerste of tweede lid][ref7], dan na de waterkwaliteitsbeheerder de gelegenheid te hebben geboden hen terzake
      van advies te dienen en stellen zij de waterkwaliteitsbeheerder van de door hen genomen beschikking op de hoogte;

      c. gaan gedeputeerde staten niet over tot het geven van een bevel krachtens [artikel 43][ref8] dan na tevens
      de waterkwaliteitsbeheerder de gelegenheid te hebben geboden hen terzake van advies te dienen en zenden zij een
      exemplaar van de beschikking ook aan de waterkwaliteitsbeheerder, en

      d. zenden gedeputeerde staten een exemplaar van een beschikking als bedoeld in [artikel 44][ref9], ook aan de
      waterkwaliteitsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
