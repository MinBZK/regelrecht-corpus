  - number: '49'
    text: |-
      1 Gedeputeerde staten kunnen, indien dat noodzakelijk is om nader onderzoek, saneringsonderzoek of sanering
      mogelijk te maken, maatregelen nemen als bedoeld in [artikel 30, tweede, derde en vierde lid][ref1].

      2 Ten behoeve van het verrichten van oriënterend onderzoek kunnen gedeputeerde staten voorts een maatregel nemen
      als bedoeld in [artikel 30, derde lid, onder ][ref2], met betrekking tot degene op wiens grondgebied dat onderzoek
      moet geschieden.

      3 Met betrekking tot gevallen als bedoeld in het eerste en tweede lid, waarvan het onderzoek of de sanering wordt
      uitgevoerd door burgemeester en wethouders, komen de overeenkomstig die leden aan gedeputeerde staten toekomende
      bevoegdheden toe aan burgemeester en wethouders. Artikel 55 is van overeenkomstige toepassing op burgemeester en
      wethouders.

      4 [Artikel 47, eerste lid][ref3], is met betrekking tot de uitoefening van de in het eerste, tweede en derde lid
      bedoelde bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel47
