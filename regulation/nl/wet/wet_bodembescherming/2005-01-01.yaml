    text: |-
      1 Het ontwerp van een algemene maatregel van bestuur krachtens [de artikelen 6][ref1] tot en met [12][ref2],
      [36][ref3] en [38, tweede en derde lid][ref4], [72][ref5], [77, eerste lid][ref6], of [81][ref7], wordt overgelegd
      aan de beide kamers der Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een ieder wordt de gelegenheid
      geboden binnen een bij die bekendmaking te stellen termijn van ten minste vier weken opmerkingen over het ontwerp
      schriftelijk ter kennis van Onze Minister te brengen.

      2 Een algemene maatregel van bestuur krachtens [de artikelen 6][ref8] tot en met [12][ref9],
      [38, derde lid][ref10], [72][ref11], [77, eerste lid][ref12], en [81][ref13], wordt, nadat hij is vastgesteld,
      toegezonden aan beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van
      uitgifte van het *Staatsblad* waarin hij is geplaatst.

      3 Een krachtens [de artikelen 36][ref14] en [38, tweede lid][ref15], vastgestelde algemene maatregel van bestuur
      treedt in werking op een tijdstip dat, nadat vier weken na de toezending ervan aan de Staten-Generaal zijn
      verstreken, bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der Kamers der
      Staten-Generaal de wens te kennen wordt gegeven dat het in de algemene maatregel van bestuur geregelde onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en
      wordt de algemene maatregel van bestuur onverwijld ingetrokken.


