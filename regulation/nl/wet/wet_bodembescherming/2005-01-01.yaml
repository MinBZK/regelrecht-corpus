  - number: 63c
    text: |-
      1 Bij regeling van Onze Minister van Verkeer en Waterstaat worden regels gesteld met betrekking tot de wijze
      waarop:

      a. belanghebbende natuurlijke personen en rechtspersonen worden betrokken bij de voorbereiding van het
      saneringsprogramma voor de waterbodem van rijkswateren, en

      b. gedeputeerde staten van de provincie en burgemeester en wethouders van de gemeente waar zich een geval voordoet,
      waarin nader onderzoek zal plaats vinden, of waar zich een geval van ernstige verontreiniging voordoet, dat is
      opgenomen in het saneringsprogramma voor de waterbodem van rijkswateren dan wel daarin tussentijds is opgenomen,
      alsmede ingezetenen van die provincie of gemeente, andere waterkwaliteitsbeheerders en andere bij de uitvoering van
      dat nader onderzoek, het saneringsonderzoek of de sanering van dat geval een belang hebbende overheidsorganen en
      natuurlijke of rechtspersonen bij die uitvoering worden betrokken.

      2 Tot de in het eerste lid bedoelde regels behoren in ieder geval regels omtrent:

      a. de wijze waarop het ontwerp van het saneringsprogramma voor de waterbodem van rijkswateren dan wel gegevens die
      betrekking hebben op het nader onderzoek, het saneringsonderzoek of de sanering van de in dat programma opgenomen
      gevallen worden bekendgemaakt;

      b. de wijze waarop de in het eerste lid, onder *a* en *b*, bedoelde organen en personen in staat worden gesteld
      hun mening omtrent het ontwerp van het saneringsprogramma voor de waterbodem van rijkswateren onderscheidenlijk
      de uitvoering van het nader onderzoek, het saneringsonderzoek of de sanering kenbaar te maken en daarover met Onze
      Minister van Verkeer en Waterstaat van gedachten te wisselen;

      c. de rapportering over [de onder ][ref1] bedoelde inspraak en over de uitkomsten daarvan;

      d. de wijze waarop belanghebbende natuurlijke personen en rechtspersonen in de gelegenheid worden gesteld hun
      beklag te doen over de uitvoering van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63c
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel63c
