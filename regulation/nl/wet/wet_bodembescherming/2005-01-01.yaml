  - number: '86'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de gevallen waarin aan de provincie of de gemeente
      bijdragen worden verleend ten behoeve van kosten als bedoeld in [artikel 76, derde of vierde lid][ref1], die reeds
      te haren laste zijn gekomen voor het tijdstip waarop blijkens het programma, bedoeld in artikel 4.14 van de Wet
      milieubeheer, met het onderzoek of de sanering van het betrokken geval van verontreiniging zou worden aangevangen.
      Bij de ministeriële regeling kan tevens worden bepaald dat slechts een daarbij aan te geven percentage van de
      bijdragen wordt besteed aan gevallen als bedoeld in [de eerste volzin][ref2].

      2 De bijdrage heeft geen betrekking op de kosten die ten laste van de provincie of de gemeente komen of zijn
      gekomen in verband met een door haar ten behoeve van de financiering van het betrokken geval aangegane geldlening.

      3 In gevallen als bedoeld in [artikel 63][ref3], treedt voor de toepassing van het eerste en tweede lid de
      waterkwaliteitsbeheerder in de plaats van de gemeente.


