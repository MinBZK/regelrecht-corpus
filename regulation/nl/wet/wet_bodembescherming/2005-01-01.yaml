  - number: '42'
    text: |-
      Indien:

      a. binnen het grondgebied van een geval van ernstige verontreiniging een ander geval van ernstige verontreiniging
      is gelegen dan wel

      b. zich gevallen van ernstige verontreiniging binnen aan elkaar grenzende grondgebieden voordoen en

      naar het oordeel van gedeputeerde staten binnen de groep van gevallen, bedoeld onder *a* onderscheidenlijk onder
      *b*, met het oog op de aanpak van de verontreiniging voldoende samenhang bestaat, bepalen gedeputeerde staten dat
      met de sanering van beide gevallen tezelfdertijd wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel42
  - number: '43'
    text: |-
      1 Gedeputeerde staten kunnen met betrekking tot het grondgebied waarop de verontreiniging zich bevindt of de
      directe gevolgen daarvan zich voordoen:

      a. bij een onderzoeksgeval bevelen op de daarbij aangegeven wijze nader onderzoek te verrichten of

      b. bij een geval van ernstige verontreiniging bevelen tijdelijke beveiligingsmaatregelen te treffen.

      De in [de eerste volzin][ref1] bedoelde bevelen kunnen mede inhouden een bevel tot het inwinnen van advies bij het
      servicecentrum over de reinigbaarheid van de verontreinigde grond. Tenzij de geboden spoed zich daartegen verzet,
      geven gedeputeerde staten geen bevel tot het afgraven van verontreinigde grond, dan nadat zij kennis hebben genomen
      van het advies van het servicecentrum over de reinigbaarheid van die grond.

      2 De in het eerste lid bedoelde bevelen kunnen slechts worden gegeven aan degene die een zakelijk of persoonlijk
      recht heeft op dat grondgebied en het tevens in gebruik heeft of heeft gehad in de uitoefening van een bedrijf.

      3 Gedeputeerde staten kunnen tevens:

      a. degene door wiens handelen een onderzoeksgeval of geval van ernstige verontreiniging is veroorzaakt, dan wel

      b. de eigenaar of de erfpachter van het grondgebied waarop zich bij zodanige gevallen de verontreiniging bevindt of
      de directe gevolgen daarvan zich voordoen,

      bevelen op de daarbij aangegeven wijze nader onderzoek te verrichten dan wel, ingeval het een geval van ernstige
      verontreiniging betreft, saneringsonderzoek te verrichten of de bodem te saneren.

      4 Het bevel de bodem te saneren, bedoeld in het derde lid, kan onder meer strekken tot het treffen van tijdelijke
      beveiligingsmaatregelen of tot het opstellen van een saneringsplan.

      5 Het bevel de bodem te saneren, bedoeld in het derde lid, kan niet worden gegeven, indien ten aanzien van het
      betrokken geval van verontreiniging:

      a. is gesaneerd overeenkomstig [artikel 38, eerste lid][ref2], of

      b. maatregelen als bedoeld in [artikel 38, derde lid][ref3], zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel38
