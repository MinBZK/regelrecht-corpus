  - number: '21'
    text: |-
      1 Het servicecentrum heeft in elk geval tot taak het geven van advies over de reinigbaarheid van verontreinigde
      grond.

      2 Het servicecentrum brengt binnen vier weken na de datum van ontvangst van een adviesaanvrage over de
      reinigbaarheid van verontreinigde grond schriftelijk advies uit aan de aanvrager. Het zendt tegelijkertijd met de
      verzending van het in [de eerste volzin][ref1] bedoelde advies afschrift daarvan aan gedeputeerde staten van de
      provincie, waarin de verontreinigde grond is gelegen.

      3 Het advies omvat mede het met de reiniging te bereiken resultaat en de daarmee gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel21
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '22'
    text: |-
      1 Het servicecentrum heeft een reglement met betrekking tot de wijze waarop het zijn in [artikel 21][ref1]
      bedoelde taak zal vervullen en houdt een register bij met betrekking tot de door hem uitgebrachte adviezen.
      Bij dat reglement worden tevens de bedragen vastgesteld ter dekking van de kosten die verband houden met zijn
      werkzaamheden, ter uitvoering van de in [artikel 21, eerste lid][ref2], bedoelde taak alsmede voor de kosten die
      voor hem voortvloeien uit overige door hem verleende diensten. Het regelt daarbij de wijze van inning van het uit
      dien hoofde door degenen die van zijn diensten gebruik maken, verschuldigde.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de inrichting van het in het eerste lid bedoelde
      register en de in dat register op te nemen gegevens.

      3 Het reglement en wijzigingen daarvan worden ter kennis van Onze Minister gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel21
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '23'
    text: |-
      1 Degene die voornemens is verontreinigde grond af te graven, gaat niet tot afgraven over dan nadat hij aan het
      servicecentrum advies over de reinigbaarheid van die grond heeft gevraagd, tenzij in een geval als bedoeld in
      [artikel 27, eerste lid][ref1], de geboden spoed zich daartegen verzet.

      2 [Artikel 28, derde lid][ref2], is van overeenkomstige toepassing op de in het eerste lid bedoelde adviesaanvrage.

      3 Bij ministeriële regeling kunnen categorieën verontreinigde grond of activiteiten waarbij verontreinigde grond
      wordt afgegraven, worden aangewezen, waarvoor een adviesaanvrage aan het servicecentrum achterwege kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel28
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '28'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent:

      a. de bij de adviesaanvrage te verstrekken gegevens en

      b. de beoordeling van de reinigbaarheid van verontreinigde grond.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel24
  - number: '25'
    text: |-
      De statuten van het servicecentrum en wijzigingen daarvan behoeven de instemming van Onze Minister. De artikelen
      10:28 tot en met 10:31 van de Algemene wet bestuursrecht zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel25
  - number: '26'
    text: |-
      Benoeming, schorsing of ontslag van de leden van de raad van commissarissen alsmede van het bestuur van het
      servicecentrum behoeven de instemming van Onze Minister. De artikelen 10:28 tot en met 10:31 van de Algemene wet
      bestuursrecht zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel26
  - number: '27'
    text: |-
      1 Degene die op of in de bodem handelingen verricht als bedoeld in [de artikelen 6][ref1] tot en met [11][ref2] en
      daarbij kennis neemt van een verontreiniging of aantasting van de bodem die door die handelingen wordt veroorzaakt,
      maakt zo spoedig mogelijk melding van de verontreiniging of de aantasting bij gedeputeerde staten van de provincie
      waar zij plaatsvindt, en geeft daarbij aan welke van de in [artikel 13][ref3] bedoelde maatregelen hij voornemens
      is te treffen of reeds heeft getroffen.

      2 In een geval als bedoeld in het eerste lid kunnen gedeputeerde staten aanwijzingen geven met betrekking tot de
      te nemen maatregelen. De in de eerste volzin bedoelde maatregelen kunnen tevens een aanwijzing inhouden tot het
      inwinnen van advies bij het servicecentrum over de reinigbaarheid van de verontreinigde grond. Tenzij de geboden
      spoed zich daartegen verzet, geven gedeputeerde staten geen aanwijzing tot het afgraven van verontreinigde grond,
      dan nadat zij kennis hebben genomen van het advies van het servicecentrum over de reinigbaarheid van die grond.

      3 Degene die bij de handelingen is betrokken, maakt terstond melding van de verontreiniging of de aantasting bij
      degene die de handelingen verricht, dan wel bij gedeputeerde staten van de provincie waar zij plaatsvindt.

      4 Gedeputeerde staten stellen zo spoedig mogelijk burgemeester en wethouders van de gemeente waar zich
      de verontreiniging of de aantasting voordoet, en de inspecteur op de hoogte van de meldingen die bij hen
      overeenkomstig het eerste of het derde lid zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel13
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '6'
        hoofdstuk: III
