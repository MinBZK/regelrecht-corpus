  - number: '51'
    text: |-
      1 Gedeputeerde staten kunnen na overleg met burgemeester en wethouders, de provinciale planologische commissie
      gehoord, burgemeester en wethouders uitnodigen om met toepassing van artikel 17, eerste lid, van de Wet op de
      Ruimtelijke Ordening voor een door hen te bepalen termijn van ten hoogste vijf jaren vrijstelling te verlenen van
      een bestemmingsplan, indien het met het oog op de voortgang van de bodemsanering noodzakelijk is voor die termijn
      grond of ander materiaal op te slaan in afwijking van dat plan. Indien niet binnen acht weken nadat die uitnodiging
      is verzonden, daaraan gevolg is gegeven, kunnen gedeputeerde staten de vrijstelling verlenen.

      2 Het bij of krachtens de artikelen 15, derde lid, en 17, tweede tot en met zevende lid, van de Wet op de
      Ruimtelijke Ordening bepaalde is van overeenkomstige toepassing.

      3 Een afschrift van een door burgemeester en wethouders onderscheidenlijk gedeputeerde staten verleende
      vrijstelling als bedoeld in het eerste lid, wordt aan de inspecteur gezonden.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel51
  - number: '52'
    text: |-
      1 Provinciale staten stellen een verordening vast, waarin regels worden gesteld met betrekking tot de wijze waarop
      burgemeester en wethouders van de gemeente waar zich een geval voordoet waarin nader onderzoek zal plaatsvinden, of
      een geval van ernstige verontreiniging, dat is opgenomen in het provinciaal milieuprogramma, alsmede de ingezetenen
      van die gemeente, de inspecteur en andere bij de uitvoering van dat nader onderzoek, het saneringsonderzoek of de
      sanering van dat geval een belang hebbende natuurlijke en rechtspersonen bij die uitvoering worden betrokken.

      2 De in het eerste lid bedoelde regels hebben in elk geval betrekking op:

      a. de wijze waarop de in het eerste lid bedoelde organen en personen in staat worden gesteld hun mening omtrent
      de uitvoering van het onderzoek of de sanering kenbaar te maken en daarover met het bestuur van de provincie van
      gedachten te wisselen;

      b. de rapportering van [de onder ][ref1] bedoelde inspraak en over de uitkomsten daarvan;

      c. de wijze waarop ingezetenen en in de provincie, onderscheidenlijk de gemeente een belang hebbende natuurlijke en
      rechtspersonen in de gelegenheid worden gesteld hun beklag te doen over de uitvoering van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel52
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel52
    references:
