  - number: '44'
    text: |-
      Gedeputeerde staten kunnen degene die de bodem saneert niet overeenkomstig een door hem ingediend, saneringsplan
      waarmee door gedeputeerde staten is ingestemd, bevelen alsnog overeenkomstig dat plan te handelen.
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel44
  - number: '45'
    text: |-
      1 Indien gedeputeerde staten overwegen krachtens [artikel 43][ref1] een bevel te geven naar aanleiding van een
      melding als bedoeld in [artikel 28][ref2], doen zij degene die de melding heeft gedaan, daarvan mededeling.

      2 Gedeputeerde staten gaan tot het geven van een bevel krachtens [artikel 43][ref3] niet over dan na burgemeester
      en wethouders van de betrokken gemeente en de inspecteur de gelegenheid te hebben geboden hen terzake van advies
      te dienen.

      3 Gedeputeerde staten gaan evenmin over tot het geven van een bevel krachtens [artikel 43][ref4] zonder aan de
      betrokkene de gelegenheid te hebben geboden binnen een daartoe, na overleg met de betrokkene, te stellen termijn
      nader onderzoek of saneringsonderzoek te verrichten, de bodem te saneren, tijdelijke beveiligingsmaatregelen te
      treffen of een saneringsplan op te stellen.

      4 In een geval als bedoeld in het derde lid kunnen gedeputeerde staten aanwijzingen geven met betrekking tot de
      wijze waarop zulks dient te geschieden.

      5 Indien gedeputeerde staten van een andere provincie eveneens voornemens zijn een bevel te geven aan de
      betrokkene, betrekken gedeputeerde staten op verzoek van de betrokkene ook gedeputeerde staten van die andere
      provincie bij het overleg, bedoeld in het derde lid, en bij de vaststelling van de periode waarin het betrokken
      geval krachtens een te geven bevel moet worden onderzocht of gesaneerd.

      6 Indien gedeputeerde staten een bevel geven op grond van [artikel 43][ref5] met betrekking tot een onderzoeksgeval
      of geval van ernstige verontreiniging, niet gelegen op het grondgebied van degene aan wie het bevel wordt gegeven,
      gaan zij daartoe bovendien niet over dan na overleg met degene op wiens grondgebied dat onderzoeksgeval of geval
      van ernstige verontreiniging zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel43
