  - number: '41'
    text: |-
      1 Burgemeester en wethouders doen aan gedeputeerde staten opgave van de hun bekende en binnen het grondgebied
      van hun gemeente gelegen onderzoeksgevallen en gevallen van ernstige verontreiniging. Burgemeester en wethouders
      stellen degene op wiens grondgebied zich een geval voordoet als bedoeld in [de eerste volzin][ref1] daarvan zo
      spoedig mogelijk op de hoogte.

      2 Gedeputeerde staten stellen de inspecteur op de hoogte van een ingevolge het eerste lid gedane opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel41
