  - number: 63e
    text: |-
      1 In de gevallen als bedoeld in [artikel 63][ref1], stelt de waterkwaliteitsbeheerder, indien er sprake is van een
      geval van ernstige verontreiniging, een saneringsplan op. Het saneringsplan gaat vergezeld van de resultaten van
      het nader onderzoek alsmede van de resultaten van het saneringsonderzoek.

      2 Ten aanzien van de inhoud van het saneringsplan is [artikel 39, eerste lid, eerste volzin, onder ][ref2], van
      overeenkomstige toepassing.

      3 Het saneringsplan behoeft de instemming van gedeputeerde staten. Artikel 39, tweede lid, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel63d
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
