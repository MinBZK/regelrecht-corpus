  - number: '16'
    text: |-
      1 De krachtens [de artikelen 6][ref1] tot en met [12][ref2] bij algemene maatregel van bestuur vast te stellen
      regels kunnen de verplichting inhouden dat met betrekking tot werkzaamheden, behorende tot een daarbij aangewezen
      categorie die ernstige verontreiniging of aantasting van de bodem kunnen veroorzaken, degene die zodanige
      werkzaamheden verricht of doet verrichten, anders dan als ondergeschikte:

      a. financiële zekerheid stelt voor het nakomen van krachtens de maatregel voor hem geldende regels;

      b. financiële zekerheid stelt ter dekking van zijn aansprakelijkheid voor schade die voortvloeit uit door de
      werkzaamheden veroorzaakte verontreiniging of aantasting van de bodem.

      2 Bij de maatregel worden nadere regels gesteld met betrekking tot die verplichting. Daarbij worden in ieder
      geval het bedrag waarvoor en de termijn gedurende welke de zekerheid ten hoogste moet worden in stand gehouden,
      aangegeven, alsmede de voorwaarden waaraan moet worden voldaan alvorens de verplichting kan komen te vervallen.
      Tevens kan daarbij nader worden geregeld op welke van de in het eerste lid bedoelde personen de verplichting rust.
      Bij de maatregel wordt het bestuursorgaan aangewezen, dat bevoegd is bij het niet nakomen van een regel waarvoor
      financiële zekerheid is gesteld, te bepalen tot welk bedrag het verhaal zal nemen op de gestelde zekerheid.
      Artikel 5:26, tweede tot en met vierde lid, van de Algemene wet bestuursrecht is van overeenkomstige toepassing
      met betrekking tot de invordering van het te verhalen bedrag. Bij de maatregel kunnen regels worden gesteld
      voor gevallen waarin aan de verplichting uitvoering wordt gegeven door het sluiten en in stand houden van een
      verzekering; daarbij wordt rekening gehouden met hetgeen redelijkerwijs door verzekering kan worden gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel12
    url: https://wetten.overheid.nl/BWBR0003994/2005-01-01#Artikel16
