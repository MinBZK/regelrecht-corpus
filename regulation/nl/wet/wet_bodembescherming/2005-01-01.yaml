    text: |-
      1 De voordracht voor een algemene maatregel van bestuur krachtens deze wet, die betrekking heeft op handelingen
      waarbij uit landbouwkundig oogpunt stoffen op of in de bodem worden gebracht, wordt Ons gedaan door Onze Minister
      van Landbouw, Natuurbeheer en Visserij en Onze Minister gezamenlijk; de voordracht voor een algemene maatregel
      van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister en Onze Minister van Landbouw, Natuurbeheer
      en Visserij gezamenlijk, voor zover de maatregel in belangrijke mate mede betrekking heeft op handelingen die van
      invloed kunnen zijn op het agrarisch produktievermogen van de bodem dan wel op handelingen die van belang zijn met
      het oog op de bescherming van natuur en landschap.

      2 De voordracht voor een algemene maatregel van bestuur krachtens [de artikelen 36][ref1] en
      [38, tweede en derde lid][ref2], wordt Ons gedaan door Onze Minister en Onze Minister van Verkeer en Waterstaat
      gezamenlijk; de voordracht voor een algemene maatregel van bestuur krachtens [artikel 81][ref3], wordt Ons gedaan
      door Onze Minister in overeenstemming met Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel36
