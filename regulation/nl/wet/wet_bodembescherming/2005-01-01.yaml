        paragraaf: '3'
  - number: '55'
    text: |-
      1 Gedeputeerde staten doen onverwijld een afschrift van een beschikking als bedoeld in
      [de artikelen 29, eerste lid][ref1], en [37, eerste lid][ref2], en van bevelen als bedoeld in
      [de artikelen 30][ref3] , [43][ref4], [44][ref5] en [49][ref6] toekomen aan het desbetreffende kantoor
      van de Dienst voor het kadaster en de openbare registers ter vermelding van een korte aanduiding van de
      aard van die beschikking en die bevelen bij de betrokken percelen in de kadastrale registratie, bedoeld in
      [artikel 48 van de Kadasterwet][ref7], welke vermelding onverwijld geschiedt.

      2 De in het eerste lid bedoelde beschikking en bevelen vermelden, onder verwijzing naar een bijgevoegde kadastrale
      kaart, ten aanzien van de onroerende zaken waarop zij betrekking hebben, de kadastrale aanduiding daarvan, de
      grootte van elk der desbetreffende percelen volgens de kadastrale registratie en, indien een in een beschikking
      dan wel bevel opgenomen onroerende zaak tevens een gedeelte van een perceel uitmaakt, bovendien de grootte van dat
      gedeelte. Op de bijgevoegde kadastrale kaart zijn de desbetreffende onroerende zaken en de bijbehorende percelen en
      perceelsgedeelten duidelijk aangegeven.

      3 Het eerste lid is van overeenkomstige toepassing ingeval een beschikking of bevel als bedoeld in het eerste lid,
      ingevolge een beschikking of uitspraak in rechte waarbij die beschikking of dat bevel is vernietigd, ingetrokken
      of gewijzigd, of anderszins haar onderscheidenlijk zijn waarde heeft verloren, in dier voege dat op grond van de
      betrokken mededeling van gedeputeerde staten de vermelding van de desbetreffende korte aanduiding in de kadastrale
      registratie wordt verwijderd bij de betrokken percelen.

      4 De afschriften van beschikkingen en bevelen als bedoeld in het eerste lid, alsmede de in het derde lid bedoelde
      mededelingen worden op het desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers bewaard
      en zijn openbaar.


