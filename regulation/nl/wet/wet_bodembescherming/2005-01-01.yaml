  - number: '82'
    text: |-
      1 De kosten die in verband staan met de in [artikel 57][ref1] bedoelde verplichting, komen geheel ten laste van de
      betrokken gemeente.

      2 Indien een gemeente verkeert of door toepassing van het eerste lid zou komen te verkeren in een geval als bedoeld
      in [artikel 12 van de Financiële-verhoudingswet][ref2] kan Onze Minister in overeenstemming met Onze Ministers van
      Binnenlandse Zaken en van Financiën op verzoek van burgemeester en wethouders een bijdrage in de in het eerste lid
      bedoelde kosten vaststellen.

      3 Onze Minister stelt de in het tweede lid bedoelde bijdrage slechts vast voor zover de in
      [artikel 76, vierde lid][ref3], bedoelde kosten per geval de in [artikel 79, vierde lid][ref4], bedoelde
      gemeentelijke bijdrage overschrijden.

      4 Gedeputeerde staten verlenen de ingevolge het tweede lid vastgestelde bijdrage aan de gemeente.

      5 Onze Minister stelt regels met betrekking tot de kosten ten behoeve waarvan een bijdrage als bedoeld in het
      tweede lid, kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel57
