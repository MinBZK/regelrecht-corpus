  - number: '78'
    text: |-
      1 Gedeputeerde staten doen Onze Minister elk jaar voor 15 april en voor 1 september een overzicht toekomen met
      betrekking tot de voortgang van de bodemsanering in de provincie ten aanzien van de gevallen waarvoor een bijdrage
      is verleend op grond van [artikel 76, eerste lid][ref1], of 77, eerste lid. In dit overzicht zijn weergegeven de
      bedragen die de provincie heeft besteed, en de verplichtingen die de provincie is aangegaan ten behoeve van die
      gevallen alsmede de verplichtingen die de provincie in het betrokken kalenderjaar ten behoeve van die gevallen
      voornemens is aan te gaan en de uitgaven die de provincie daarvoor in dat jaar verwacht te doen.

      2 Onze Minister kan een overeenkomstig [artikel 76][ref2] dan wel [artikel 77][ref3] aan een provincie verleende
      bijdrage verlagen, voor zover naar zijn oordeel uit een in het eerste lid bedoeld overzicht blijkt dat de provincie
      die bijdrage in het jaar waarvoor zij is verleend niet zal besteden ten behoeve van de in die artikelen bedoelde
      gevallen. Hij kan de bijdragen verhogen van provincies die naar zijn oordeel ten behoeve van die gevallen meer
      verplichtingen kunnen aangaan of meer kunnen besteden dan mogelijk zou zijn ten laste van de hun toekomende
      bijdragen.


