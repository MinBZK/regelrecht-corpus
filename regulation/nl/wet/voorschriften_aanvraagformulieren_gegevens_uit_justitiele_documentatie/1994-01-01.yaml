  - number: '2'
    text: |-
      De vorm waarin de in [artikel 1, onder a tot en met g][ref1], bedoelde aanvragen worden gedaan kan worden gekozen
      door de aanvragende instantie, mits de zakelijke gegevens zoals deze in de bijlagen van deze regeling vermeld en de
      in margine vermelde aanduidingen in het aanvraagformulier worden opgenomen.


