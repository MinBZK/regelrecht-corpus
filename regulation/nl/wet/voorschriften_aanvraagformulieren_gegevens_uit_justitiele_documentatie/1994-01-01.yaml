preamble:
  text: |-
    Gelet op de artikelen 14 en 15 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag,
    artikel 10 van het Besluit inlichtingen justitiële documentatie en de artikelen 1, eerste lid, en 2b van het
    Besluit inlichtingen strafregisters;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006302/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aanvragen om inlichtingen uit de justitiële documentatie dienen te geschieden door middel van de formulieren
      volgens de [bijlagen I][ref1] tot en met [VII][ref2] van deze regeling, te weten:

      a. aanvragen van een uittreksel uit het strafregister als bedoeld in artikel 14 of 15 van de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref3], door middel van een formulier
      volgens de [bijlage I][ref4].

      b. aanvragen om inlichtingen over de gegevens uit de algemene documentatieregisters als bedoeld in
      [artikel 2 van het Besluit inlichtingen justitiële documentatie][ref5], door middel van een formulier volgens
      de [bijlage II][ref6].

      c. aanvragen om inlichtingen over de gegevens uit de algemene documentatieregisters als bedoeld in
      [artikel 3 van het Besluit inlichtingen justitiële documentatie][ref7], door middel van een formulier volgens
      de [bijlage III][ref8].

      d. aanvragen om een uittreksel uit de strafregisters en om inlichtingen over de gegevens
      die vermeld stonden op de uit de strafregisters verwijderde strafbladen als bedoeld in
      [artikel 4 van het Besluit inlichtingen justitiële documentatie][ref9], door middel van een formulier volgens
      de [bijlage IV][ref10].

      e. aanvragen om een uittreksel uit de strafregisters en om inlichtingen over de gegevens
      die vermeld stonden op de uit de strafregisters verwijderde strafbladen als bedoeld in
      [artikel 5, eerste en derde lid, van het Besluit inlichtingen justitiële documentatie][ref11], door middel van een
      formulier volgens de [bijlage V][ref12].

      f. aanvragen om een uittreksel uit de strafregisters en om inlichtingen uit de algemene documentatieregisters als
      bedoeld in [artikel 7 van het Besluit inlichtingen justitiële documentatie][ref13], door middel van een formulier
      volgens de [bijlage VI][ref14].

      g. aanvragen om een uittreksel uit de strafregisters als bedoeld in
      [artikel 2b van het Besluit inlichtingen strafregisters][ref15] door middel van een formulier volgens de
      [bijlage VII][ref16].


