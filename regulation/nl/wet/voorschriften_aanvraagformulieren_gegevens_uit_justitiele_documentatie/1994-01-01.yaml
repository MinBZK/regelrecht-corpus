        artikel: '1'
  - number: '3.1'
    text: |-
      Het besluit van de Minister van Justitie van 2 december 1958, hoofdafdeling Rechterlijke Organisatie, nr. 549/858
      (Stcrt. 1958, nr. 238) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006302/1994-01-01#Artikel3
  - number: '3.2'
    text: |-
      De aanvraagformulieren, als bijlagen A tot en met D, F en G gevoegd bij het in het eerste lid genoemde besluit,
      mogen nog gedurende een jaar na de inwerkingtreding van deze regeling worden gebruikt, met dien verstande dat bij
      de ondertekening van het formulier de naam en de functie van de aanvrager dienen te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0006302/1994-01-01#Artikel3
  - number: '4'
    text: Deze regeling treedt in werking op 1 januari 1994 en wordt met haar bijlagen in de Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0006302/1994-01-01#Artikel4
