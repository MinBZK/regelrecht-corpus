  - number: XVI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan
      een ander tijdstip worden vastgesteld, waarop [artikel I, onderdelen X, Y, en Z, onderdeel 2][ref1], en
      [artikel XIV, vierde lid][ref2], in werking treden.


