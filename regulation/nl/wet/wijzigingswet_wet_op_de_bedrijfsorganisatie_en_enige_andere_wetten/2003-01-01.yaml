preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enkele wijzigingen aan te brengen in het stelsel van
    de publiekrechtelijke bedrijfsorganisatie, met name op het punt van de verhouding tussen de organen van het stelsel
    en de rijksoverheid, en dat het daartoe noodzakelijk is, de Wet op de bedrijfsorganisatie en enkele andere wetten
    te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010389/2003-01-01#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      1 Ten aanzien van een bedrijfslichaam, ingesteld vóór het tijdstip van inwerkingtreding van deze wet, gelden de
      volgende bepalingen.

      2 De regeling, waarbij het bedrijfslichaam is ingesteld, blijft van kracht, totdat het wordt ingesteld op de
      in[ artikel 67 van de Wet op de bedrijfsorganisatie][ref1] voorziene wijze; zodanige instelling geschiedt zodra
      voor de eerste maal na het tijdstip van inwerkingtreding van deze wet een wijziging in de betrokken regeling moet
      worden aangebracht, doch uiterlijk binnen vier jaar na dat tijdstip.

      3 De op het tijdstip van inwerkingtreding van deze wet van kracht zijnde verordeningen en andere besluiten van
      een bedrijfslichaam blijven van kracht. Deze verordeningen vervallen vier jaar na dat tijdstip; dat geldt niet
      voor verordeningen, opgesteld in het kader van bij of krachtens een wet gevorderde medewerking, tenzij bij of
      krachtens die wet anders wordt bepaald. Bepalingen in verordeningen omtrent onderwerpen, die geen grondslag meer
      vinden in het door deze wet gewijzigde [artikel 93, tweede lid, van de Wet op de bedrijfsorganisatie][ref2], worden
      ingetrokken, zodra de betrokken verordening voor de eerste maal na de inwerkingtreding van deze wet wordt gewijzigd
      dan wel wordt vervangen door een nieuwe verordening.

      4 Bepalingen in een verordening, van kracht op het tijdstip van inwerkingtreding van dit lid, waarin
      tuchtrechtelijke maatregelen zijn gesteld op overtredingen die als strafbare feiten zijn aangewezen, worden
      aangepast aan het door deze wet gewijzigde [artikel 104 van de Wet op de bedrijfsorganisatie][ref3] zodra de
      betrokken verordening voor de eerste maal na de inwerkingtreding van deze wet wordt gewijzigd dan wel wordt
      vervangen door een nieuwe verordening. Tot dat tijdstip beslist in dat geval de officier van justitie of een
      overtreding tuchtrechtelijk zal worden afgedaan; in het bevestigende geval verwijst hij de zaak naar het bevoegde
      tuchtgerecht.

      5 Nadere voorschriften omtrent bij een verordening geregelde onderwerpen als bedoeld in
      [artikel 95, derde lid, van de Wet op de bedrijfsorganisatie][ref4], zoals dat artikel luidde vóór de
      inwerkingtreding van deze wet, blijven van kracht, totdat de betrokken verordening voor de eerste maal na de
      inwerkingtreding van deze wet wordt gewijzigd dan wel wordt vervangen door een nieuwe verordening. Het geven
      van nieuwe nadere voorschriften of het wijzigen van bestaande nadere voorschriften door andere organen van een
      bedrijfslichaam dan het bestuur, is na de inwerkingtreding van deze wet niet meer mogelijk.

      6 Een rechtspersoonlijkheid bezittend lichaam als bedoeld in
      [artikel 110 van de Wet op de bedrijfsorganisatie][ref5], dat is opgericht vóór de inwerkingtreding van deze
      wet, blijft bestaan. Verordeningen van een orgaan van zo'n lichaam blijven van kracht, totdat de voorziening
      waarbij het lichaam is ingesteld voor de eerste maal na de inwerkingtreding van deze wet wordt gewijzigd dan wel
      wordt vervangen door een nieuwe voorziening. Deze verordeningen vervallen uiterlijk vier jaar na de datum van
      inwerkingtreding van deze wet; dat geldt niet voor verordeningen, opgesteld in het kader van bij of krachtens een
      wet gevorderde medewerking, tenzij bij of krachtens die wet anders wordt bepaald. De organen van zo'n lichaam maken
      na de datum van inwerkingtreding van deze wet geen gebruik meer van hun gedelegeerde bevoegdheid om bij verordening
      regelen te stellen.

      7 Een bedrijfslichaam meldt aan Onze Minister van Sociale Zaken en Werkgelegenheid, welke rechtspersonen het op
      het tijdstip van inwerkingtreding van deze wet reeds heeft opgericht en in welke rechtspersonen het op dat tijdstip
      deelneemt.


