preamble:
  text: |-
    Gelet op de artikelen 93, 95 en 102 van de Wet op de bedrijfsorganisatie en de artikelen 5 en 6 van het
    Instellingsbesluit Productschap Vis (Stb. 2003, 253);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026171/2009-06-06#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op een verplichting tot betaling van een geldsom aan het productschap die is vastgesteld of ontstaan voor
      het tijdstip van inwerkingtreding van deze verordening, blijft het recht zoals dat gold voor dat tijdstip van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0026171/2009-06-06#ArtikelII
  - number: III
    text: |-
      Deze verordening treedt in werking met ingang van de dag na bekendmaking in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026171/2009-06-06#ArtikelIII
