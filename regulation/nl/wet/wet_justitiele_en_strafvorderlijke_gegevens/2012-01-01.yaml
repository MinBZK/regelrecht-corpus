  - number: '25'
    text: |-
      1 Onze Minister kan voor een mededeling als bedoeld in [artikel 18][ref1] of [19][ref2] een vergoeding van kosten
      verlangen die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag. Daarbij
      wordt tevens de wijze van betaling bepaald.

      2 De vergoeding wordt teruggegeven ingeval Onze Minister op verzoek van de betrokkene, op aanbeveling van het
      College bescherming persoonsgegevens of op bevel van de rechter tot verbetering, aanvulling, verwijdering of
      afscherming is overgegaan of wanneer het verzoek moet worden geweigerd ingevolge [artikel 21][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
