        artikel: '6'
  - number: '43'
    text: |-
      1 Onze Minister deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke deze persoon betreffende
      rapporten in de persoonsdossiers in de documentatie persoonsdossiers zijn opgenomen.

      2 Hij doet daarbij geen mededelingen in schriftelijke vorm, tenzij hij weigert een mededeling te doen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verzoek en de wijze van kennisneming.
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel43
  - number: '44'
    text: |-
      1 Elke verstrekking van afschriften van rapporten uit persoonsdossiers, overeenkomstig [artikel 41][ref1] wordt
      vastgelegd en ten minste gedurende één jaar bewaard.

      2 Onze Minister deelt een ieder op diens verzoek schriftelijk binnen vier weken mede of hem betreffende afschriften
      van rapporten uit de persoonsdossiers in het jaar voorafgaande aan het verzoek overeenkomstig [artikel 42][ref2]
      zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel42
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel44
