  - number: '7'
    text: |-
      1 Onze Minister legt passende technische en organisatorische maatregelen ten uitvoer om de justitiële gegevens te
      beveiligen tegen verlies of tegen enige vorm van onrechtmatige verwerking. Deze maatregelen garanderen, rekening
      houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een passend beveiligingsniveau gelet op
      de risico's die de verwerking en de aard van de justitiële gegevens met zich brengen.

      2 [Artikel 49, eerste tot en met derde lid][ref1], en
      [artikel 50, eerste lid, van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel50
