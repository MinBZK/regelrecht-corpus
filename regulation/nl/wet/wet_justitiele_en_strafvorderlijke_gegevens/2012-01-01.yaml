  - number: 39l
    text: |-
      Een mededeling als bedoeld in de [artikelen 39i, eerste lid][ref1], en [39j, tweede lid][ref2], blijft achterwege
      voorzover dit noodzakelijk is in het belang van:

      a. de veiligheid van de staat,

      b. het voorkomen, opsporen en vervolgen van strafbare feiten,

      c. het toezicht op de naleving van wettelijke voorschriften die zijn gesteld ten behoeve van de belangen, bedoeld
      onder b, of

      d. de bescherming van de betrokkene of van de rechten en vrijheden van anderen.


