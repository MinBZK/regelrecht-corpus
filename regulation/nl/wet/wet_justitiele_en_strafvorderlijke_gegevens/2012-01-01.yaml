        bwb_id: BWBR0011468
        artikel: '9'
  - number: 39c
    text: |-
      1 De [artikelen 3][ref1] en [7][ref2] zijn van overeenkomstige toepassing, met dien verstande dat daar waar in
      deze artikelen wordt gesproken over «Onze Minister» «het College van procureurs-generaal» wordt gelezen.

      2 Het College van procureurs-generaal verwerkt slechts strafvorderlijke gegevens, voorzover het, gelet op de
      doeleinden waarvoor zij worden verwerkt, toereikend, ter zake dienend en niet bovenmatig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel7
