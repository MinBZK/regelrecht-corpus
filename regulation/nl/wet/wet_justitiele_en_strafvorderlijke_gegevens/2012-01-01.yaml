  - number: '12'
    text: |-
      1 Met betrekking tot personen ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref1], worden aan de in [artikel 9][ref2] bedoelde
      personen of instanties slechts gegevens verstrekt, indien de veroordeelde tijdens het begaan van het strafbare feit
      de leeftijd van zestien jaren had bereikt, de veroordeling onherroepelijk is en is gewezen wegens een misdrijf en
      daarbij, al dan niet tezamen met andere straffen of maatregelen, is opgelegd:

      a. jeugddetentie, anders dan vervangende;

      b. geldboete van meer dan € 113;

      c. een taakstraf met een duur van meer dan veertig uren of

      d. plaatsing in een inrichting voor jeugdigen.

      Met deze personen worden gelijkgesteld minderjarigen tegen wie een strafbeschikking is uitgevaardigd.

      2 Geen gegevens worden verstrekt indien:

      a. na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd,

      b. de veroordeling door een andere dan een Nederlandse rechter is gewezen wegens een feit dat naar Nederlands recht
      geen misdrijf oplevert, tenzij ingevolge deze veroordeling in Nederland de in het eerste lid genoemde straffen of
      maatregelen moeten worden ondergaan, of

      c. de rechter met toepassing van [artikel 77x, eerste lid, van het Wetboek van Strafrecht][ref3] heeft bepaald, dat
      de straf of maatregel geheel niet zal worden tenuitvoergelegd en de tenuitvoerlegging later niet alsnog voor het
      geheel of een deel is bevolen.

      3 Geen gegevens worden verstrekt indien na het onherroepelijk worden van de veroordeling of strafbeschikking twee
      jaren zijn verstreken tenzij jeugddetentie, anders dan vervangende, of plaatsing in een inrichting voor jeugdigen
      is opgelegd. In dat geval bedraagt de termijn vier jaren.

      4 De termijn bedoeld in het derde lid, wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde
      jeugddetentie met uitzondering van de straf of het gedeelte daarvan dat voorwaardelijk is opgelegd en ten aanzien
      waarvan de gehele of gedeeltelijke tenuitvoerlegging later niet is bevolen.

      5 De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke
      veroordeling.

      6 Onverminderd het bepaalde in het derde lid kunnen over een veroordeling waarbij de maatregel van plaatsing in
      een inrichting voor jeugdigen is opgelegd gegevens worden verstrekt zolang de plaatsing niet onvoorwaardelijk is
      beëindigd.

      7 De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling of
      strafbeschikking als bedoeld in het eerste lid, niet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
