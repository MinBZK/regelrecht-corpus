  - number: '50'
    text: |-
      1 Degene over wie één of meer persoonsgegevens in persoonsdossiers zijn verwerkt kan bij Onze Minister verzet
      hiertegen aantekenen wegens bijzondere persoonlijke omstandigheden.

      2 Onze Minister beoordeelt, gehoord het openbaar ministerie en de instelling die het rapport heeft opgemaakt,
      binnen vier weken na ontvangst van het verzet of het verzet gerechtvaardigd is. Indien het verzet gerechtvaardigd
      is, beëindigt hij terstond de verwerking.

      3 [Artikel 49][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel49
