  - number: '46'
    text: |-
      1 Degene aan wie overeenkomstig [artikel 43][ref1] kennis is gegeven van hem betreffende rapporten, kan Onze
      Minister schriftelijk verzoeken de persoonsgegevens in deze rapporten te verbeteren, aan te vullen, te verwijderen
      of af te schermen, indien deze feitelijk onjuist, voor het doel van de verwerking onvolledig of niet ter zake
      dienend zijn dan wel in strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de aan te brengen
      wijzigingen.

      2 Het [tweede en derde lid van artikel 22][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
