  - number: 39q
    text: |-
      1 Betrokkene kan bij het College van procureurs-generaal verzet aantekenen wegens bijzondere persoonlijke
      omstandigheden.

      2 Het College van procureurs-generaal beoordeelt, gehoord het hoofd van het arrondissementsparket, het landelijk
      parket, het functioneel parket of het ressortsparket, binnen vier weken na ontvangst van het verzet of het verzet
      gerechtvaardigd is. Indien het verzet gerechtvaardigd is, beëindigt het terstond de verwerking.

      3 De [artikelen 39n][ref1] en [39p][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39n
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39p
