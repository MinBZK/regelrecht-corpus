  - number: '18'
    text: |-
      1 Onze Minister deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke deze persoon betreffende
      gegevens in de justitiële documentatie zijn vastgelegd.

      2 Hij doet daarbij geen mededelingen in schriftelijke vorm, tenzij hij weigert een mededeling te doen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verzoek en de wijze van kennisneming
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel18
  - number: '19'
    text: |-
      1 Elke verstrekking van justitiële gegevens overeenkomstig de [artikelen 9][ref1], [13][ref2] en [14][ref3] wordt
      vastgelegd en ten minste gedurende één jaar bewaard.

      2 Onze Minister deelt een ieder op diens verzoek schriftelijk binnen vier weken mede of hem betreffende gegevens
      in het jaar voorafgaande aan het verzoek overeenkomstig de [artikelen 9][ref4], [13][ref5] en [14][ref6] zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
