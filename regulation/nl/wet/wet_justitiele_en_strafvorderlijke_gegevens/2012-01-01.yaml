  - number: '22'
    text: |-
      1 Degene aan wie overeenkomstig [artikel 18][ref1] kennis is gegeven van hem betreffende justitiële gegevens, kan
      Onze Minister schriftelijk verzoeken deze te verbeteren, aan te vullen, te verwijderen of af te schermen, indien
      deze feitelijk onjuist, voor het doel van de verwerking onvolledig of niet ter zake dienend zijn dan wel in strijd
      met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de aan te brengen wijzigingen.

      2 Onze Minister bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of, dan wel
      in hoeverre, hij daaraan voldoet. Het [eerste lid van artikel 37 Wet bescherming persoonsgegevens][ref2] is van
      overeenkomstige toepassing.

      3 Onze Minister draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo spoedig
      mogelijk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel22
