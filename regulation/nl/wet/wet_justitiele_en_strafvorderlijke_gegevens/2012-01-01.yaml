  - number: '13'
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor een goede taakuitoefening
      van degene aan wie justitiële gegevens worden verstrekt, kunnen bij algemene maatregel van bestuur personen of
      instanties als bedoeld in [artikel 9][ref1] worden aangewezen aan wie meer gegevens kunnen worden verstrekt dan
      genoemd in de [artikelen 10][ref2], [11][ref3] en [12][ref4]. Daarbij wordt tevens bepaald welke gegevens worden
      verstrekt. Tevens kunnen nadere voorschriften worden gegeven in verband met de verwerking en verdere verwerking.

      2 [Artikel 8, vierde lid][ref5], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
