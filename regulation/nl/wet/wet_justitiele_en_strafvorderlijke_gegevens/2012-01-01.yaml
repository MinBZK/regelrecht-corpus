    text: |-
      Op de behandeling van verzoeken als bedoeld in het [eerste lid van artikel 43][ref1] en het
      [tweede lid van artikel 44][ref2] is [artikel 20][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
