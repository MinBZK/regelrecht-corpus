  - number: '27'
    text: |-
      1 Het College bescherming persoonsgegevens ziet toe op de verwerking van justitiële gegevens overeenkomstig het bij
      en krachtens deze wet bepaalde.

      2 De [artikelen 51, tweede lid][ref1], [60][ref2] en [61 van de Wet bescherming persoonsgegevens][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
