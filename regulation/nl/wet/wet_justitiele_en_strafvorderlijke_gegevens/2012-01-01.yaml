        artikel: '50'
  - number: '8'
    text: |-
      1 Ten behoeve van de rechtspleging worden justitiële gegevens verstrekt aan Nederlandse rechterlijke ambtenaren en
      rechterlijke ambtenaren van Aruba en de Nederlandse Antillen.

      2 Ten behoeve van de strafrechtspleging worden justitiële gegevens verstrekt aan Onze Minister.

      3 Aan lichamen of personen aan wie krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] de
      bevoegdheid is toegekend een strafbeschikking uit te vaardigen, worden ten behoeve van de uitoefening van die
      bevoegdheid justitiële gegevens verstrekt met betrekking tot de delicten waarop hun bevoegdheid betrekking heeft.

      4 Justitiële gegevens worden niet voor een ander doel gebruikt dan waarvoor zij zijn verstrekt, tenzij bij
      wettelijk voorschrift anders is bepaald dan wel de uitvoering van de taak met het oog waarop de gegevens zijn
      verstrekt, daartoe noodzaakt.

      5 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent het verstrekken van
      justitiële gegevens aan de in het eerste, tweede en derde lid genoemde personen of instanties, alsmede omtrent de
      daarbij te stellen voorwaarden aan het gebruik daarvan.

      6 Bij algemene maatregel van bestuur kan worden bepaald welke gegevens ingevolge het internationale recht worden
      verstrekt aan andere rechterlijke ambtenaren dan bedoeld in het eerste lid dan wel aan andere autoriteiten. Het
      vijfde lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel8
