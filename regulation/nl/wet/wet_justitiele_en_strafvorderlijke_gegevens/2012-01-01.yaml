  - number: '40'
    text: |-
      1 Onze Minister verwerkt persoonsgegevens in persoonsdossiers in de documentatie persoonsdossiers met als doel de
      bevordering van een juiste toepassing van het strafrecht.

      2 Bij of krachtens algemene maatregel van bestuur wordt de wijze bepaald waarop de rapporten die het
      persoonsdossier vormen worden verkregen.

      3 De [artikelen 3][ref1] en [7][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel7
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel40
