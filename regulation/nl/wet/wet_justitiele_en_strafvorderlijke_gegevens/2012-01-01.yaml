preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is nieuwe regels met betrekking tot het verwerken
    van justitiële gegevens en het stellen van regels met betrekking tot de verwerking van justitiële gegevens in
    persoonsdossiers en de verklaring omtrent het gedrag vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. justitiële gegevens of gegevens: bij algemene maatregel van bestuur te omschrijven gegevens omtrent natuurlijke
      personen en rechtspersonen inzake de toepassing van het strafrecht of de strafvordering;

      b. strafvorderlijke gegevens: gegevens over een natuurlijk persoon of rechtspersoon die zijn verkregen in het kader
      van een strafvorderlijk onderzoek en die het openbaar ministerie in een strafdossier of langs geautomatiseerde
      weg verwerkt;

      c. persoonsdossier: een dossier waarin zijn opgenomen de aan rechterlijke autoriteiten uitgebrachte rapporten
      over onderzoeken naar het gedrag of de levensomstandigheden van een natuurlijk persoon in verband met tegen hem
      aanhangige strafzaken, de tenuitvoerlegging van aan hem opgelegde straffen of maatregelen of zijn reclassering;

      d. rechtspersoon: een rechtspersoon als bedoeld in [boek 2 van het Burgerlijk Wetboek][ref1], alsmede de daarmee
      gelijkgestelde organisaties als bedoeld in [artikel 51, derde lid, van het Wetboek van Strafrecht][ref2];

      e. justitiële documentatie: een samenhangende verzameling van op verschillende personen betrekking hebbende
      justitiële gegevens die langs geautomatiseerde weg wordt gevoerd;

      f. documentatie persoonsdossiers: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsdossiers die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van
      die gegevens systematisch is aangelegd;

      g. persoonsgegeven, verwerking van persoonsgegevens, verantwoordelijke, betrokkene, het College bescherming
      persoonsgegevens en het verstrekken van persoonsgegevens: hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref3];

      h. Onze Minister: Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
