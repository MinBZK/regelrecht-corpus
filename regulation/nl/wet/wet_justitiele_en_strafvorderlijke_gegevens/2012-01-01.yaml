  - number: 8a
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal in de gevallen waarin het ingevolge [artikel 39e][ref1] of [39f][ref2] bevoegd is strafvorderlijke
      gegevens te verstrekken, justitiële gegevens verstrekken.

      2 De [artikelen 39e, derde lid][ref3], en [39f, tweede lid, onder a, en derde lid][ref4], zijn van overeenkomstige
      toepassing.


