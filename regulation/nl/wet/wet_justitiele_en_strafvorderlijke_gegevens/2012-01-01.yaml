  - number: '14'
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor bijzondere doeleinden,
      kan Onze Minister in bijzondere gevallen toestemming geven tot het verstrekken van daartoe omschreven justitiële
      gegevens overeenkomstig door hem te geven voorschriften en onder door hem te stellen voorwaarden. Van zijn
      desbetreffend besluit zendt hij een afschrift aan het College bescherming persoonsgegevens.

      2 Tenzij Onze Minister anders bepaalt, worden de justitiële gegevens die zijn verstrekt niet voor een ander doel
      gebruikt dan waarvoor zij zijn verstrekt.

      3 Onze Minister kan voorschriften geven in verband met de verwerking en verdere verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 Justitiële gegevens kunnen worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en
      statistiek, onder de voorwaarde dat de resultaten daarvan geen persoonsgegevens mogen bevatten.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van justitiële gegevens,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014194/2012-01-01#Artikel15
  - number: '17'
    text: |-
      Voor het verstrekken van justitiële gegevens, als bedoeld in de [artikelen 9][ref1], [13][ref2], [14][ref3] en
      [15][ref4], kan een kostenvergoeding worden verlangd die niet hoger mag zijn dan een bij of krachtens algemene
      maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel13
