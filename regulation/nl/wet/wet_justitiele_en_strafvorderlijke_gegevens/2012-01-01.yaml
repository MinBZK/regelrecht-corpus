    text: |-
      Een mededeling als bedoeld in [artikel 18, eerste lid][ref1], en [artikel 19, tweede lid][ref2], blijft achterwege
      voorzover dit noodzakelijk is in het belang van de veiligheid van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
