  - number: '48'
    text: |-
      1 Indien Onze Minister persoonsgegevens in rapporten uit een persoonsdossier heeft verbeterd, aangevuld,
      verwijderd of afgeschermd doet hij aan de in [artikel 42][ref1] bedoelde personen of instanties aan wie in het
      jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de betrokken persoonsgegevens zijn
      verstrekt, zo spoedig mogelijk mededeling van deze verbetering, aanvulling, verwijdering of afscherming, tenzij dit
      onmogelijk blijkt of een onevenredige inspanning kost.

      2 Het [tweede lid van artikel 24][ref2] is van overeenkomstige toepassing.


