---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_justitiele_en_strafvorderlijke_gegevens
regulatory_layer: WET
publication_date: '2018-02-16'
valid_from: '2013-07-01'
bwb_id: BWBR0014194
url: https://wetten.overheid.nl/BWBR0014194/2013-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is nieuwe regels met betrekking tot het verwerken
    van justitiële gegevens en het stellen van regels met betrekking tot de verwerking van justitiële gegevens in
    persoonsdossiers en de verklaring omtrent het gedrag vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.a
    text: |-
      justitiële gegevens: bij algemene maatregel van bestuur te omschrijven persoonsgegevens of gegevens over een
      rechtspersoon inzake de toepassing van het strafrecht of de strafvordering;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.b
    text: |-
      strafvorderlijke gegevens: persoonsgegevens of gegevens over een rechtspersoon die zijn verkregen in het kader
      van een strafvorderlijk onderzoek en die het openbaar ministerie in een strafdossier of langs geautomatiseerde
      wet verwerkt;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.c
    text: |-
      persoonsdossier: een dossier waarin zijn opgenomen de aan rechterlijke autoriteiten uitgebrachte rapporten
      over onderzoeken naar het gedrag of de levensomstandigheden van een natuurlijk persoon in verband met tegen hem
      aanhangige strafzaken, de tenuitvoerlegging van aan hem opgelegde straffen of maatregelen of zijn reclassering;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.d
    text: |-
      rechtspersoon: een rechtspersoon als bedoeld in [boek 2 van het Burgerlijk Wetboek][ref1], alsmede de daarmee
      gelijkgestelde organisaties als bedoeld in [artikel 51, derde lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 1.e
    text: |-
      justitiële documentatie: een samenhangende verzameling van op verschillende personen betrekking hebbende justitiële
      gegevens die langs geautomatiseerde weg wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.f
    text: |-
      documentatie persoonsdossiers: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsdossiers die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van
      die gegevens systematisch is aangelegd;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.g
    text: |-
      persoonsgegeven, verwerken van persoonsgegevens, verantwoordelijke, betrokkene, bewerker, ontvanger, het
      verstrekken van persoonsgegevens en toestemming van de betrokkene: hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 1.h
    text: |-
      kenmerken: het markeren van opgeslagen justitiële, strafvorderlijke of persoonsgegevens, zonder dat de mogelijkheid
      tot verwerking van die gegevens wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.i
    text: |-
      markeren: het voorzien van een kenmerk aan justitiële, strafvorderlijke of persoonsgegevens, zonder dat de
      mogelijkheid tot verwerking van die gegevens wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.j
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
  - number: 1.k
    text: |-
      College bescherming persoonsgegevens: het College, bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
  - number: '2.1'
    text: |-
      Onze Minister verwerkt in de justitiële documentatie justitiële gegevens ten behoeve van een goede
      strafrechtspleging.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel2
  - number: '2.2'
    text: Bij algemene maatregel van bestuur worden de gegevens aangewezen die als justitiële gegevens worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister treft de nodige maatregelen opdat de justitiële gegevens, gelet op de doeleinden waarvoor zij worden
      verwerkt, juist en nauwkeurig zijn. Hij verbetert of verwijdert de gegevens dan wel vult deze aan of schermt deze
      af indien hem blijkt dat deze onjuist of onvolledig zijn.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel3
  - number: '3.2'
    text: |-
      Justitiële gegevens worden slechts verwerkt voor zover dit noodzakelijk is voor de bij of krachtens deze wet
      geformuleerde doeleinden.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel3
  - number: '3.3'
    text: |-
      Justitiële gegevens worden uitsluitend voor een ander doel verwerkt dan waarvoor zij zijn verkregen voor zover
      deze verwerking niet onverenigbaar is met het doel waarvoor deze gegevens zijn verkregen en de verwerking voor
      dat andere doel overigens noodzakelijk is en in verhouding staat tot dat doel. De verdere verwerking is alleen
      mogelijk door personen en instanties die bij of krachtens de wet met het oog op een zwaarwegend algemeen belang
      zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister treft de nodige maatregelen opdat justitiële gegevens worden verwijderd of vernietigd zodra zij
      niet langer noodzakelijk zijn voor het doel waarvoor ze zijn verwerkt of dit door enige wettelijke bepaling wordt
      vereist.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel3
  - number: '4.1'
    text: 'Justitiële gegevens van verdachten en veroordeelden wegens misdrijven worden vernietigd:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
  - number: 4.1.a
    text: |-
      dertig jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een misdrijf
      waarop naar de wettelijke omschrijving een gevangenisstraf van zes jaar of meer is gesteld, en in het kader van
      het misdrijf de justitiële gegevens zijn verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten
      uitvoer is gelegd, dan wel twintig jaar na het overlijden van betrokkene,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 4.1.b
    text: |-
      twintig jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een misdrijf
      waarop naar de wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld, en in het kader van
      het misdrijf de justitiële gegevens zijn verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten
      uitvoer is gelegd, dan wel twaalf jaar na het overlijden van betrokkene, of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 4.1.c
    text: na het vervallen van het recht tot strafvordering door verjaring.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
  - number: '4.2'
    text: |-
      De termijn van dertig en twintig jaar, genoemd in het eerste lid, wordt verlengd indien tegen de betrokkene een
      einduitspraak als bedoeld in de [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] in verband
      met een ander misdrijf is gedaan. In dat geval worden de justitiële gegevens vernietigd twintig dan wel dertig
      jaar nadat het vonnis is uitgesproken of de strafbeschikking volledig ten uitvoer is gelegd, al naar gelang op het
      misdrijf naar de wettelijke omschrijving minder dan zes jaar of zes jaar of meer gevangenisstraf is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: '4.3'
    text: |-
      De termijn van dertig jaar, genoemd in het eerste lid, wordt met twintig jaar verlengd indien de duur van de
      gevangenisstraf of vrijheidsbenemende maatregel langer is dan twintig jaar. Indien de gevangenisstraf levenslang
      is of de vrijheidsbenemende maatregel de duur van veertig jaar overstijgt, worden de justitiële gegevens na tachtig
      jaar vernietigd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste tot en met derde lid worden justitiële gegevens van verdachten en veroordeelden wegens
      misdrijven als bedoeld in de [artikelen 240b tot en met 250 van het Wetboek van Strafrecht][ref1] na tachtig jaar
      vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel241
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '241'
  - number: '6'
    text: 'Justitiële gegevens van verdachten en veroordeelden wegens overtredingen worden vernietigd:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel6
  - number: 6.a
    text: |-
      vijf jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een overtreding en
      in het kader van de overtreding de justitiële gegevens zijn verwerkt of een strafbeschikking wegens een overtreding
      volledig ten uitvoer is gelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 6.b
    text: |-
      tien jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een overtreding en
      in het kader van de overtreding de justitiële gegevens zijn verwerkt of een strafbeschikking wegens een overtreding
      volledig ten uitvoer is gelegd, en daarbij een vrijheidsstraf, vervangende hechtenis daaronder niet begrepen, of
      een taakstraf is opgelegd, dan wel aan een rechtspersoon een geldboete van de derde categorie of hoger is opgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 6.c
    text: twee jaar na het overlijden van betrokkene, of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel6
  - number: 6.d
    text: na het vervallen van het recht tot strafvordering door verjaring.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel6
  - number: '7.1'
    text: |-
      De verantwoordelijke treft passende technische en organisatorische maatregelen om justitiële gegevens te beveiligen
      tegen onbedoelde of onrechtmatige vernietiging, tegen wijziging, ongeoorloofde mededeling of toegang, met name
      indien de verwerking verzending van gegevens via een netwerk of beschikbaarstelling via directe geautomatiseerde
      toegang omvat, en tegen alle andere vormen van onrechtmatige verwerking, waarbij met name rekening wordt gehouden
      met de risico’s van de verwerking en de aard van de te beschermen gegevens. Deze maatregelen garanderen, rekening
      houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een passend beveiligingsniveau, gelet
      op de risico’s van de verwerking en de aard van de justitiële gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel7
  - number: '7.2'
    text: |-
      Toegang tot justitiële gegevens is uitsluitend voorbehouden aan personen die onder het beheer van de Onze Minister
      ressorteren of op grond van zijn instructie, behoudens een bij of krachtens de wet gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel7
  - number: '7.3'
    text: |-
      De [artikelen 14, eerste, tweede, derde en vijfde lid][ref1], en [49][ref2] en
      [50 van de Wet bescherming persoonsgegevens][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel50
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '50'
  - number: '8.1'
    text: |-
      Ten behoeve van de rechtspleging worden justitiële gegevens verstrekt aan Nederlandse rechterlijke ambtenaren en
      rechterlijke ambtenaren van Aruba en de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.2'
    text: Ten behoeve van de strafrechtspleging worden justitiële gegevens verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.3'
    text: |-
      Aan lichamen of personen aan wie krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] de bevoegdheid
      is toegekend een strafbeschikking uit te vaardigen, worden ten behoeve van de uitoefening van die bevoegdheid
      justitiële gegevens verstrekt met betrekking tot de delicten waarop hun bevoegdheid betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257ba
  - number: '8.4'
    text: |-
      Justitiële gegevens kunnen worden verstrekt aan een internationaal orgaan of aan een internationaal strafgerecht
      voor zover dit voortvloeit uit een verdrag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.5'
    text: |-
      Justitiële gegevens kunnen ten behoeve van de strafrechtspleging worden verstrekt aan rechterlijke ambtenaren dan
      wel aan andere autoriteiten in het buitenland.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.6'
    text: |-
      Justitiële gegevens kunnen worden verstrekt of doorgegeven aan de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie of aan een orgaan van de Europese Unie dat is belast met de ondersteuning en versterking
      van de wetshandhavingsdiensten van de lidstaten bij de voorkoming, bestrijding, onderzoek en vervolging van zware
      criminaliteit en dat bij algemene maatregel van bestuur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.7'
    text: |-
      Justitiële gegevens worden alleen ingevolge het vierde of vijfde lid verstrekt indien het ontvangende land of
      internationaal orgaan een toereikend beschermingsniveau voor de voorgenomen gegevensverwerking garandeert. Of het
      beschermingsniveau toereikend is wordt beoordeeld met inachtneming van alle omstandigheden die op de doorgifte
      van gegevens of op een groep van gegevensverstrekkingen van invloed zijn. In het bijzonder wordt rekening
      gehouden met de aard van de gegevens, met het doel en de duur van de voorgenomen verwerking en verwerkingen,
      het land van herkomst en het land of internationale orgaan van eindbestemming van de gegevens, de algemene en
      sectorale rechtsregels die in het derde land of het internationale orgaan gelden, alsmede de beroepscodes en de
      veiligheidsmaatregelen die in het land of het orgaan van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.8'
    text: 'In afwijking van het zevende lid kunnen justitiële gegevens worden verstrekt of doorgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: 8.8.a
    text: |-
      dit noodzakelijk is ten behoeve van specifieke belangen van de betrokkene of een dringend zwaarwegend algemeen
      belang; of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: 8.8.b
    text: |-
      het betreffende land of het ontvangende internationale orgaan passende garanties biedt voor een zorgvuldige
      gegevensverwerking in het concrete geval.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: '8.9'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking of doorgifte van justitiële
      gegevens, bedoeld in het eerste, tweede, derde, vierde, vijfde en zesde lid, alsmede over de daarbij te stellen
      voorwaarden aan het gebruik daarvan door ontvangstgerechtigde autoriteiten of internationale organen en over de
      ontvangst van justitiële gegevens vanuit het buitenland.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8
  - number: 8a.1
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal in de gevallen waarin het ingevolge [artikel 39e][ref1] of [39f][ref2] bevoegd is strafvorderlijke
      gegevens te verstrekken, justitiële gegevens verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: 8a.2
    text: |-
      De [artikelen 39e, derde lid][ref1], en [39f, tweede lid, onder a, en derde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: '9.1'
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor een goede taakuitoefening
      van degene aan wie justitiële gegevens worden verstrekt, kunnen bij algemene maatregel van bestuur personen of
      instanties die met een publieke taak zijn belast, worden aangewezen aan wie justitiële gegevens kunnen worden
      verstrekt. Daarbij kunnen nadere voorschriften worden gegeven in verband met de verwerking en verdere verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel9
  - number: '9.2'
    text: |-
      [Artikel 8, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
        afdeling: '2'
  - number: '10.1'
    text: |-
      Behoudens het bepaalde in [artikel 12][ref1] worden aan de in [artikel 9][ref2] bedoelde personen of instanties
      slechts gegevens verstrekt betreffende onherroepelijke veroordelingen wegens misdrijf waarbij een straf, al dan
      niet tezamen met een maatregel, is opgelegd, en wegens overtreding indien daarbij vrijheidsstraf – anders dan
      vervangende – of een taakstraf is opgelegd. Met een veroordeling worden gelijkgesteld een rechterlijke beslissing
      waarbij een maatregel als bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref3] is opgelegd en een
      strafbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '12'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37a
  - number: '10.2'
    text: 'Geen gegevens worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: 10.2.a
    text: |-
      na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: 10.2.b
    text: na het onherroepelijk worden van de uitspraak of strafbeschikking vier jaren zijn verstreken, of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: 10.2.c
    text: |-
      de veroordeling door een andere dan een Nederlandse rechter is gewezen wegens een feit dat naar Nederlands recht
      geen misdrijf oplevert, tenzij ingevolge deze veroordeling in Nederland vrijheidsstraf – anders dan vervangende –
      of een taakstraf moet worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '10.3'
    text: |-
      De termijn bedoeld in het tweede lid, onder b, beloopt acht jaren indien bij de veroordeling een onvoorwaardelijke
      vrijheidsstraf dan wel een voorwaardelijke vrijheidsstraf waarvan later de gehele of gedeeltelijke
      tenuitvoerlegging is bevolen, is opgelegd. Hetzelfde geldt indien bij de veroordeling een taakstraf is opgelegd,
      dan wel de tenuitvoerlegging van een bij de taakstraf opgelegde vervangende hechtenis is bevolen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '10.4'
    text: |-
      De termijn wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde vrijheidsstraf met uitzondering
      van de straf of het gedeelte daarvan dat voorwaardelijk is opgelegd en ten aanzien waarvan de gehele of
      gedeeltelijke tenuitvoerlegging later niet is bevolen. De termijn wordt met zes maanden verlengd indien een
      taakstraf is opgelegd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '10.5'
    text: |-
      De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke veroordeling
      en met de termijn van de verlenging van de terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '10.6'
    text: |-
      De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling als
      bedoeld in het eerste lid, niet is geëindigd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '10.7'
    text: |-
      Ingeval van tenuitvoerlegging in Nederland van een veroordeling door een andere dan de Nederlandse rechter
      gewezen vangt de in het tweede lid, onder b, en het derde lid, bedoelde termijn aan op de dag na die, waarop die
      veroordeling onherroepelijk is geworden. De duur van de termijn wordt bepaald aan de hand van de bij de uitspraak
      of beslissing, krachtens welke de bovenbedoelde veroordeling in Nederland kan worden ten uitvoer gelegd, opgelegde
      of uitvoerbaar geworden straf of maatregel.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel10
  - number: '11.1'
    text: |-
      Aan de in [artikel 9][ref1] bedoelde personen of instanties worden gegevens verstrekt betreffende onherroepelijke
      veroordelingen van rechtspersonen wegens enige overtreding, indien daarbij een geldboete is opgelegd van de derde
      of een hogere categorie. Met een veroordeling wordt gelijkgesteld een strafbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
  - number: '11.2'
    text: 'Geen gegevens worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
  - number: 11.2.a
    text: |-
      na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd, of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
  - number: 11.2.b
    text: na het onherroepelijk worden van de uitspraak of strafbeschikking vier jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
  - number: '11.3'
    text: |-
      De termijn bedoeld in het tweede lid, onder b, beloopt acht jaren indien is veroordeeld tot onvoorwaardelijke
      betaling van een geldboete dan wel tot voorwaardelijke betaling van een geldboete waarvan later de gehele of
      gedeeltelijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
  - number: '11.4'
    text: De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke veroordeling.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
  - number: '11.5'
    text: |-
      De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling als
      bedoeld in het [eerste lid van artikel 10][ref1] en het [eerste lid van 11][ref2] niet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel11
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '11'
        afdeling: '2'
  - number: '12.1'
    text: |-
      Met betrekking tot personen ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref1], worden aan de in [artikel 9][ref2] bedoelde
      personen of instanties slechts gegevens verstrekt, indien de veroordeelde tijdens het begaan van het strafbare feit
      de leeftijd van zestien jaren had bereikt, de veroordeling onherroepelijk is en is gewezen wegens een misdrijf en
      daarbij, al dan niet tezamen met andere straffen of maatregelen, is opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77aa
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
  - number: 12.1.a
    text: jeugddetentie, anders dan vervangende;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.1.b
    text: geldboete van meer dan € 113;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.1.c
    text: een taakstraf met een duur van meer dan veertig uren of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.1.d
    text: plaatsing in een inrichting voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '12.2'
    text: 'Geen gegevens worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.2.a
    text: |-
      na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.2.b
    text: |-
      de veroordeling door een andere dan een Nederlandse rechter is gewezen wegens een feit dat naar Nederlands recht
      geen misdrijf oplevert, tenzij ingevolge deze veroordeling in Nederland de in het eerste lid genoemde straffen of
      maatregelen moeten worden ondergaan, of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: 12.2.c
    text: |-
      de rechter met toepassing van [artikel 77x, eerste lid, van het Wetboek van Strafrecht][ref1] heeft bepaald, dat
      de straf of maatregel geheel niet zal worden tenuitvoergelegd en de tenuitvoerlegging later niet alsnog voor het
      geheel of een deel is bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77x
  - number: '12.3'
    text: |-
      Geen gegevens worden verstrekt indien na het onherroepelijk worden van de veroordeling of strafbeschikking twee
      jaren zijn verstreken tenzij jeugddetentie, anders dan vervangende, of plaatsing in een inrichting voor jeugdigen
      is opgelegd. In dat geval bedraagt de termijn vier jaren.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '12.4'
    text: |-
      De termijn bedoeld in het derde lid, wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde
      jeugddetentie met uitzondering van de straf of het gedeelte daarvan dat voorwaardelijk is opgelegd en ten aanzien
      waarvan de gehele of gedeeltelijke tenuitvoerlegging later niet is bevolen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '12.5'
    text: De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke veroordeling.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '12.6'
    text: |-
      Onverminderd het bepaalde in het derde lid kunnen over een veroordeling waarbij de maatregel van plaatsing in
      een inrichting voor jeugdigen is opgelegd gegevens worden verstrekt zolang de plaatsing niet onvoorwaardelijk is
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '12.7'
    text: |-
      De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling of
      strafbeschikking als bedoeld in het eerste lid, niet is geëindigd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel12
  - number: '13.1'
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor een goede taakuitoefening
      van degene aan wie justitiële gegevens worden verstrekt, kunnen bij algemene maatregel van bestuur personen of
      instanties als bedoeld in [artikel 9][ref1] worden aangewezen aan wie meer gegevens kunnen worden verstrekt dan
      genoemd in de [artikelen 10][ref2], [11][ref3] en [12][ref4]. Daarbij wordt tevens bepaald welke gegevens worden
      verstrekt. Tevens kunnen nadere voorschriften worden gegeven in verband met de verwerking en verdere verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel12
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '10'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '11'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '12'
        afdeling: '2'
  - number: '13.2'
    text: |-
      [Artikel 8, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
        afdeling: '2'
  - number: '14.1'
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor bijzondere doeleinden, kan
      Onze Minister in bijzondere gevallen toestemming geven tot het verstrekken van daartoe omschreven justitiële
      gegevens overeenkomstig door hem te geven voorschriften en onder door hem te stellen voorwaarden. Van zijn
      desbetreffend besluit zendt hij een afschrift aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel14
  - number: '14.2'
    text: |-
      Tenzij Onze Minister anders bepaalt, worden de justitiële gegevens die zijn verstrekt niet voor een ander doel
      gebruikt dan waarvoor zij zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel14
  - number: '14.3'
    text: Onze Minister kan voorschriften geven in verband met de verwerking en verdere verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel14
  - number: '15.1'
    text: |-
      Justitiële gegevens kunnen worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en
      statistiek, onder de voorwaarde dat de resultaten daarvan geen persoonsgegevens mogen bevatten.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel15
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van justitiële gegevens,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel15
  - number: '17'
    text: |-
      Voor het verstrekken van justitiële gegevens, als bedoeld in de [artikelen 9][ref1], [13][ref2], [14][ref3] en
      [15][ref4], kan een kostenvergoeding worden verlangd die niet hoger mag zijn dan een bij of krachtens algemene
      maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel15
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '13'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '14'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '15'
        afdeling: '2'
  - number: '18.1'
    text: |-
      Onze Minister deelt een ieder op diens schriftelijke verzoek binnen vier weken mede of, en zo ja welke, deze
      persoon betreffende justitiële gegevens verwerking ondergaan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel18
  - number: '18.2'
    text: |-
      Hij doet daarbij geen mededelingen in schriftelijke vorm, tenzij hij weigert een mededeling te doen. Een gehele of
      gedeeltelijke afwijzing vindt schriftelijk plaats.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel18
  - number: '18.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verzoek en de wijze van kennisneming
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel18
  - number: '19.1'
    text: |-
      Elke verstrekking van justitiële gegevens overeenkomstig de bepalingen van deze Afdeling wordt vastgelegd en ten
      minste vier jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister deelt een ieder op diens schriftelijk verzoek binnen vier weken mede of hem betreffende gegevens
      gedurende een periode van vier jaar voorafgaande aan het verzoek overeenkomstig de bepalingen van deze Afdeling
      zijn verstrekt en over de ontvangers of categorieën van ontvangers aan wie de gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel19
  - number: '20.1'
    text: |-
      Bij de behandeling van verzoeken als bedoeld in de [artikelen 18][ref1] en [19][ref2] draagt Onze Minister zorg
      voor een deugdelijke vaststelling van de identiteit van de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '19'
        afdeling: '3'
  - number: '20.2'
    text: |-
      De verzoeken worden ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en
      ten aanzien van onder curatele gestelden gedaan door hun wettelijke vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel20
  - number: '20.3'
    text: Verzoeken ten aanzien van rechtspersonen worden gedaan door een vertegenwoordiger van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel20
  - number: '20.4'
    text: |-
      De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. Bij
      ministeriële regeling kunnen aan de bijzondere machtiging nadere eisen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel20
  - number: '21'
    text: |-
      Een mededeling als bedoeld in [artikel 18, eerste lid][ref1], en [artikel 19, tweede lid][ref2], blijft achterwege
      voorzover dit noodzakelijk is in het belang van de veiligheid van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '19'
        afdeling: '3'
  - number: '22.1'
    text: |-
      Een ieder over wiens persoon justitiële gegevens worden verwerkt kan de verantwoordelijke schriftelijk verzoeken
      deze te verbeteren, aan te vullen, te verwijderen of af te schermen indien deze feitelijk onjuist, voor het doel
      van de verwerking onvolledig of niet ter zake dienend zijn, dan wel in strijd met een wettelijk voorschrift worden
      verwerkt. Het verzoek bevat de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of, dan wel in
      hoeverre, hij daaraan voldoet. Het [eerste lid van artikel 37 Wet bescherming persoonsgegevens][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '37'
  - number: '22.3'
    text: |-
      De verantwoordelijke draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo
      spoedig mogelijk wordt uitgevoerd. Hij draagt zorg voor het kenmerken van een gegeven als de juistheid daarvan door
      de betrokkene wordt betwist en niet kan worden vastgesteld of het gegeven al dan niet juist is.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel22
  - number: '23.1'
    text: |-
      Een beslissing op een verzoek als bedoeld in [artikel 18][ref1], [19][ref2] of [22][ref3] geldt als een beschikking
      in de zin van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '19'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '22'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '23.2'
    text: |-
      De [artikelen 47][ref1] en [48 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel48
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '48'
  - number: '24.1'
    text: |-
      Indien Onze Minister justitiële gegevens heeft verbeterd, aangevuld, verwijderd of afgeschermd doet hij aan de
      in [artikel 8, vijfde lid][ref1], [9][ref2], [13][ref3] en [14][ref4] bedoelde personen of instanties aan wie
      in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de betrokken gegevens zijn
      verstrekt, zo spoedig mogelijk mededeling van deze verbetering, aanvulling, verwijdering of afscherming, tenzij dit
      onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel14
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '13'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '14'
        afdeling: '2'
  - number: '24.2'
    text: |-
      Onze Minister deelt aan de verzoeker en voorzover van toepassing aan de wettelijk vertegenwoordiger, desgevraagd
      mede aan wie hij de mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister kan voor een mededeling als bedoeld in [artikel 18][ref1] of [19][ref2] een vergoeding van kosten
      verlangen die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag. Daarbij
      wordt tevens de wijze van betaling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel19
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '19'
        afdeling: '3'
  - number: '25.2'
    text: |-
      De vergoeding wordt teruggegeven ingeval Onze Minister op verzoek van de betrokkene, op aanbeveling van het College
      bescherming persoonsgegevens of op bevel van de rechter tot verbetering, aanvulling, verwijdering of afscherming is
      overgegaan of wanneer het verzoek moet worden geweigerd ingevolge [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel21
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '21'
        afdeling: '3'
  - number: '26.1'
    text: Betrokkene kan bij Onze Minister verzet aantekenen wegens bijzondere persoonlijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel26
  - number: '26.2'
    text: |-
      Onze Minister beoordeelt, gehoord het openbaar ministerie, binnen vier weken na ontvangst van het verzet of het
      verzet gerechtvaardigd is. Indien het verzet gerechtvaardigd is, beëindigt hij terstond de verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel26
  - number: '26.3'
    text: |-
      De [artikelen 23][ref1] en [25][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel25
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '23'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '25'
        afdeling: '3'
  - number: '27.1'
    text: |-
      Het College bescherming persoonsgegevens ziet toe op de verwerking van justitiële gegevens overeenkomstig het bij
      en krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel27
  - number: '27.2'
    text: |-
      De [artikelen 51, tweede lid][ref1], [60][ref2], [61][ref3] en [65 van de Wet bescherming persoonsgegevens][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel65
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '61'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '65'
  - number: '27.3'
    text: |-
      Het College bescherming persoonsgegevens wordt gehoord over de voorgenomen verwerking van justitiële gegevens
      die in een nieuw bestand zullen worden opgenomen, wanneer de aard van de verwerking specifieke risico’s met
      zich meebrengt voor de fundamentele rechten van de betrokkene, in het bijzonder het recht op bescherming van de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel27
  - number: '27.4'
    text: |-
      Indien de verantwoordelijke handelt in strijd met hetgeen is bepaald bij of krachtens
      [artikel 19, eerste lid][ref1], [artikel 39j, eerste lid][ref2], en [artikel 44, eerste lid][ref3], kan het College
      hem een bestuurlijke boete opleggen. De [artikelen 66 tot en met 74 van de Wet bescherming persoonsgegevens][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39j
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel66
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '19'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39j
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '44'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '66'
  - number: '28'
    text: |-
      Een verklaring omtrent het gedrag is een verklaring van Onze Minister dat uit een onderzoek met betrekking tot het
      gedrag van de betrokken natuurlijke persoon of rechtspersoon ingesteld, gelet op het risico voor de samenleving in
      verband met het doel waarvoor de afgifte is gevraagd en na afweging van het belang van betrokkene, niet is gebleken
      van bezwaren tegen die natuurlijke persoon of rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel28
  - number: '29'
    text: |-
      De beslissing omtrent de afgifte van de verklaring omtrent het gedrag geldt als een beschikking in de zin van
      [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '30.1'
    text: |-
      De aanvraag om afgifte van de verklaring omtrent het gedrag van een natuurlijk persoon wordt ingediend bij de
      burgemeester van de gemeente, waar de aanvrager op het tijdstip van de aanvraag als ingezetene is ingeschreven in
      de basisadministratie persoonsgegevens. In alle andere gevallen wordt de aanvraag ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel30
  - number: '30.2'
    text: |-
      De burgemeester en Onze Minister onderzoeken de volledigheid van de bij de aanvraag verstrekte gegevens en
      verschaffen zich de nodige zekerheid over de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel30
  - number: '30.3'
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel30
  - number: '30.4'
    text: De burgemeester zendt de aanvraag terstond door aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel30
  - number: '31'
    text: |-
      In afwijking van [artikel 30][ref1] kan een aanvraag om afgifte van de verklaring omtrent het gedrag
      van een natuurlijk persoon desgewenst rechtstreeks elektronisch worden ingediend bij Onze Minister.
      [Artikel 30, tweede en derde lid][ref2], is van overeenkomstige toepassing. [Artikel 34, tweede lid][ref3], is niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel34
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '30'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '34'
        afdeling: '5'
  - number: '32.1'
    text: |-
      De aanvraag tot het afgeven van een verklaring omtrent het gedrag van een natuurlijk persoon bevat de voornamen
      en de geboortedatum van de aanvrager, alsmede een omschrijving van het doel, waarvoor de afgifte van de verklaring
      wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel32
  - number: '32.2'
    text: |-
      Indien de aanvraag betrekking heeft op een rechtspersoon, bevat zij de naam van de rechtspersoon en het
      inschrijvingsnummer van de Kamers van Koophandel, of, indien geen inschrijving heeft plaatsgevonden in
      het handelsregister, de naam, de rechtsvorm en de statutaire, of bij ontstentenis daarvan, de feitelijke
      vestigingsplaats van deze rechtspersoon alsmede de naam, het adres en de geboortedatum van ieder van de
      bestuurders, vennoten, maten of beheerders en de naam van degene die de aanvraag doet.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel32
  - number: '32.3'
    text: |-
      Bij de aanvraag doet degene te wiens behoeve de verklaring wordt verzocht opgave van het risico voor de samenleving
      dat in het geding is.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel32
  - number: '33'
    text: |-
      De aanvraag wordt ingediend door degene omtrent wiens gedrag een verklaring wordt gevraagd of door een
      vertegenwoordiger van de rechtspersoon omtrent wiens gedrag een verklaring wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister neemt de aanvraag niet in behandeling, indien een onderzoek naar het gedrag van de aanvrager
      kennelijk niet noodzakelijk is om, gelet op het doel van de aanvraag, een risico voor de samenleving te beperken.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel34
  - number: '34.2'
    text: |-
      Onze Minister stelt de burgemeester, bedoeld in [artikel 30, eerste lid][ref1], terstond in kennis van de
      beslissing tot het niet in behandeling nemen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
        afdeling: '5'
  - number: '35.1'
    text: |-
      Onze Minister weigert de afgifte van een verklaring omtrent het gedrag, indien in de justitiële documentatie
      met betrekking tot de aanvrager een strafbaar feit is vermeld, dat, indien herhaald, gelet op het risico voor de
      samenleving en de overige omstandigheden van het geval, aan het doel waarvoor de verklaring omtrent het gedrag
      wordt gevraagd, in de weg zal staan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel35
  - number: '35.2'
    text: |-
      Indien de aanvraag betrekking heeft op een rechtspersoon betrekt Onze Minister mede in zijn oordeel de justitiële
      gegevens met betrekking tot strafbare feiten op naam van de rechtspersoon en van ieder van de bestuurders,
      vennoten, maten of beheerders van die rechtspersoon alsmede de gegevens met betrekking tot strafbare feiten waaraan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref1] ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '35.3'
    text: |-
      Onze Minister betrekt niet in zijn oordeel de justitiële gegevens met betrekking tot de strafbare feiten die zijn
      afgedaan met een onherroepelijke vrijspraak.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel35
  - number: '36.1'
    text: |-
      Onze Minister kan bij zijn onderzoek met betrekking tot de afgifte van de verklaring omtrent het gedrag van
      een natuurlijk persoon kennis nemen van op de aanvrager betrekking hebbende justitiële gegevens alsmede van
      politiegegevens als bedoeld in [artikel 1, onder a, van de Wet politiegegevens][ref1], met uitzondering van de
      gegevens waarover op grond van [artikel 21][ref2] geen mededeling kan worden gedaan aan de verzoeker, die gebruik
      maakt van zijn recht, als bedoeld in [artikel 18, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel18
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '21'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
  - number: '36.2'
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, kan Onze Minister bij zijn onderzoek met betrekking
      tot de afgifte van de verklaring omtrent het gedrag van een rechtspersoon kennis nemen van op de
      betrokkenen, bedoeld in artikel 35, betrekking hebbende justitiële gegevens, politiegegevens, als bedoeld
      in [artikel 1, onder a, van de Wet politiegegevens][ref1], alsmede gegevens uit de registratie, bedoeld in
      [artikel 1, onder b, van de Wet controle op rechtspersonen][ref2]. De uitzondering, bedoeld in het eerste lid, is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015049
        artikel: '1'
  - number: '36.3'
    text: |-
      Voorzover dat voor een goede oordeelsvorming noodzakelijk is, kan Onze Minister inlichtingen
      omtrent betrokkene inwinnen bij het openbaar ministerie en bij instellingen die op grond van
      [artikel 4, eerste lid, van de Reclasseringsregeling 1995][ref1] bevoegd zijn om reclasseringswerkzaamheden te
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
  - number: '36.4'
    text: |-
      De justitiële gegevens en de gegevens uit de politieregisters die zijn verstrekt worden niet voor een ander doel
      gebruikt dan waarvoor zij zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel36
  - number: '37.1'
    text: |-
      Onze Minister beslist op de aanvraag met betrekking tot de afgifte van de verklaring omtrent het gedrag van een
      natuurlijk persoon binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel37
  - number: '37.2'
    text: |-
      Indien Onze Minister voornemens is afwijzend te beslissen op de aanvraag, bedoeld in het eerste lid, beslist hij
      binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel37
  - number: '37.3'
    text: |-
      Indien de verklaring omtrent het gedrag wordt afgegeven, zijn de [artikelen 3:8][ref1] en
      [3:50 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '38.1'
    text: |-
      Onze Minister beslist op de aanvraag met betrekking tot de afgifte van de verklaring omtrent het gedrag van een
      rechtspersoon binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel38
  - number: '38.2'
    text: |-
      Indien Onze Minister voornemens is afwijzend te beslissen op de aanvraag, bedoeld in het eerste lid, beslist hij
      binnen twaalf weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel38
  - number: '38.3'
    text: |-
      Alvorens te beslissen tot weigering van de afgifte, stelt Onze Minister degene van wie een of meer gegevens
      als bedoeld in het [tweede lid van artikel 36][ref1], ten grondslag hebben gelegen aan de beslissing,
      in de gelegenheid om binnen twee weken een verzoek als bedoeld in [artikel 22 van deze wet][ref2] of
      [artikel 28 van de Wet politiegegevens][ref3] dan wel [artikel 36 van de Wet bescherming persoonsgegevens][ref4]
      te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel36
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '36'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '22'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '36'
  - number: '38.4'
    text: |-
      De termijn voor het geven van de beschikking, bedoeld in het eerste lid, wordt opgeschort met ingang van de
      dag waarop Onze Minister de gelegenheid heeft geboden tot het doen van een verzoek en tot de dag waarop een
      schriftelijke mededeling is gedaan dat geen verzoek zal worden ingediend of twee weken zijn verstreken dan wel tot
      de dag waarop de procedure naar aanleiding van een verzoek is beëindigd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel38
  - number: '38.5'
    text: De aanvrager van de verklaring wordt in kennis gesteld van de opschorting.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel38
  - number: '39.1'
    text: |-
      Voor het in behandeling nemen van een aanvraag tot afgifte van een verklaring omtrent het gedrag kunnen de
      burgemeester en Onze Minister een vergoeding van kosten verlangen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39
  - number: '39.2'
    text: |-
      De kostenvergoedingen zijn niet hoger dan een bij of krachtens algemene maatregel van bestuur vast te stellen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39
  - number: '39.3'
    text: |-
      Voorzover de aanvragen zijn ingediend bij de burgemeester, zijn de gemeenten ter zake van de afgifte van de
      verklaring door Onze Minister een bij ministeriële regeling vastgestelde vergoeding verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39
  - number: '39.4'
    text: |-
      Bij ministeriële regeling worden regels vastgesteld met betrekking tot de wijze van afdracht van de vergoeding,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39
  - number: 39a.1
    text: Het College van procureurs-generaal is verantwoordelijke voor het verwerken van strafvorderlijke gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39a
  - number: 39a.2
    text: |-
      Het hoofd van een arrondissementsparket, het landelijk parket, het functioneel parket of het ressortsparket voert
      het beheer over de strafvorderlijke gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39a
  - number: 39b.1
    text: |-
      Het College van procureurs-generaal verwerkt slechts strafvorderlijke gegevens, indien dit noodzakelijk is voor een
      goede vervulling van de taak van het openbaar ministerie of het nakomen van een andere wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39b
  - number: 39b.2
    text: |-
      Het College van procureurs-generaal verwerkt strafvorderlijke gegevens niet verder op een wijze die onverenigbaar
      is met de doeleinden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39b
  - number: 39b.3
    text: |-
      [Artikel 9, tweede en derde lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel9
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '9'
  - number: 39c.1
    text: |-
      De [artikelen 3][ref1] en [7][ref2] zijn van overeenkomstige toepassing, met dien verstande dat daar waar in deze
      artikelen wordt gesproken over «Onze Minister» «het College van procureurs-generaal» wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel7
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '7'
        afdeling: '1'
  - number: 39c.2
    text: |-
      Het College van procureurs-generaal verwerkt slechts strafvorderlijke gegevens, voorzover het, gelet op de
      doeleinden waarvoor zij worden verwerkt, toereikend, ter zake dienend en niet bovenmatig zijn.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39c
  - number: 39c.3
    text: |-
      De verwerking van strafvorderlijke gegevens betreffende iemands godsdienst of levensovertuiging, ras, politieke
      gezindheid, gezondheid, seksuele leven, alsmede persoonsgegevens betreffende het lidmaatschap van een vakvereniging
      vindt slechts plaats in aanvulling op de verwerking van andere strafvorderlijke gegevens en voor zover dit voor het
      doel van de verwerking onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39c
  - number: 39d
    text: |-
      Strafvorderlijke gegevens worden vernietigd overeenkomstig de termijnen, genoemd in de [artikelen 4][ref1] en
      [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel6
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39d
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '6'
        afdeling: '1'
  - number: 39e.1
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal aan de volgende personen of instanties strafvorderlijke gegevens verstrekken:
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.1.a
    text: Nederlandse rechterlijke ambtenaren en rechterlijke ambtenaren van Aruba en de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.1.b
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.1.c
    text: |-
      lichamen of personen aan wie krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] de bevoegdheid is
      toegekend een strafbeschikking uit te vaardigen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257ba
  - number: 39e.1.d
    text: |-
      ambtenaren van politie als bedoeld in [artikel 2, onder a, van de Politiewet 2012][ref1] en ambtenaren van politie
      als bedoeld in artikel 2, onder c en d, voor zover zij zijn aangesteld voor de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 39e.1.e
    text: |-
      ambtenaren als bedoeld in [artikel 141, onderdeel c en d, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 39e.1.f
    text: |-
      buitengewone opsporingsambtenaren als bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 39e.1.g
    text: |-
      instanties die belast zijn met de tenuitvoerlegging van rechterlijke beslissingen of handelingen, beslissingen van
      de officier van justitie dan wel van vrijheidsbenemende straffen of maatregelen;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.1.h
    text: |-
      verantwoordelijken voor de verwerking van politiegegevens als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
  - number: 39e.1.i
    text: |-
      bewaarders als bedoeld in [artikel 118, eerste en tweede lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel118
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '118'
  - number: 39e.1.j
    text: |-
      andere autoriteiten in het buitenland als bedoeld in onderdeel a en instanties die ingevolge het internationaal
      recht een taak hebben in het kader van de strafrechtspleging.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.2
    text: |-
      Het College van procureurs-generaal verstrekt aan de ambtenaren die werkzaam zijn ten behoeve van de justitiële
      documentatie strafvorderlijke gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.3
    text: |-
      Het College van procureurs-generaal kan strafvorderlijke gegevens verstrekken aan een internationaal orgaan of aan
      een internationaal strafgerecht voorzover dit voortvloeit uit een Verdrag.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.4
    text: |-
      Het College van procureurs-generaal kan strafvorderlijke gegevens verstrekken aan rechterlijke ambtenaren in een
      ander land of aan een internationaal orgaan in het buitenland, ten behoeve van de strafrechtspleging.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.5
    text: |-
      Strafvorderlijke gegevens kunnen worden verstrekt of doorgegeven aan de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie of aan een orgaan van de Europese Unie dat is belast met de ondersteuning en versterking
      van de wetshandhavingsdiensten van de lidstaten bij de voorkoming, bestrijding, onderzoek en vervolging van zware
      criminaliteit en dat bij algemene maatregel van bestuur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
  - number: 39e.6
    text: |-
      [Artikel 8, zevende, achtste en negende lid][ref1] en [artikel 9, eerste lid, tweede volzin][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
  - number: 39f.1
    text: |-
      Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal, onverminderd [artikel 39e][ref1], aan personen of instanties voor de volgende doeleinden strafvorderlijke
      gegevens verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
  - number: 39f.1.a
    text: het voorkomen en opsporen van strafbare feiten,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.b
    text: het handhaven van de orde en veiligheid,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.c
    text: het uitoefenen van toezicht op het naleven van regelgeving,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.d
    text: het nemen van een bestuursrechtelijke beslissing,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.e
    text: het beoordelen van de noodzaak tot het treffen van een rechtspositionele of tuchtrechtelijke maatregel,
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.f
    text: het verlenen van hulp aan slachtoffers en anderen die bij een strafbaar feit betrokken zijn, of
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.1.g
    text: |-
      het verrichten van een privaatrechtelijke rechtshandeling door een persoon of instantie die met een publieke taak
      is belast.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.2
    text: |-
      Het College van procureurs-generaal kan slechts strafvorderlijke gegevens aan personen of instanties als bedoeld in
      het eerste lid verstrekken, voorzover die gegevens voor die personen of instanties:
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.2.a
    text: |-
      noodzakelijk zijn met het oog op een zwaarwegend algemeen belang of de vaststelling, de uitoefening of de
      verdediging van een recht in rechte, en
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.2.b
    text: |-
      in zodanige vorm worden verstrekt dat herleiding tot andere personen dan betrokkene, redelijkerwijs wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
  - number: 39f.3
    text: |-
      De [artikelen 8, vierde lid][ref1], en [9, eerste lid, tweede volzin][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '9'
        afdeling: '2'
  - number: 39g
    text: |-
      De [artikelen 14][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel15
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39g
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '14'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '15'
        afdeling: '2'
  - number: 39h
    text: |-
      Voor het verstrekken van strafvorderlijke gegevens als bedoeld in [artikel 39f][ref1] kan een kostenvergoeding
      worden verlangd die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39h
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: 39i.1
    text: |-
      Het College van procureurs-generaal deelt een ieder op diens schriftelijke verzoek binnen zes weken mede of, en
      zo ja welke, deze persoon betreffende strafvorderlijke gegevens verwerking ondergaan. Het College van procureurs-
      generaal kan zijn beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk mededeling
      gedaan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39i
  - number: 39i.2
    text: |-
      [Artikel 18, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39i
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '18'
        afdeling: '3'
  - number: 39j.1
    text: |-
      Elke verstrekking van strafvorderlijke gegevens overeenkomstig de [artikelen 39e][ref1] en [39f][ref2] wordt
      vastgelegd en gedurende ten minste vier jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39j
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: 39j.2
    text: |-
      Het College van procureurs-generaal deelt een ieder op diens verzoek schriftelijk binnen vier weken mede of
      hem betreffende strafvorderlijke gegevens gedurende een periode van vier jaar voorafgaande aan het verzoek
      overeenkomstig de [artikelen 39e][ref1] en [39f][ref2] zijn verstrekt en over de ontvangers of categorieën van
      ontvangers aan wie de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39j
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: 39k.1
    text: |-
      Bij de behandeling van verzoeken als bedoeld in de [artikelen 39i, eerste lid][ref1], en [39j, tweede lid][ref2],
      draagt het College van procureurs-generaal zorg voor een deugdelijke vaststelling van de identiteit van de
      verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39i
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39j
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39k
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39i
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39j
        afdeling: '3'
  - number: 39k.2
    text: |-
      [Artikel 20, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel20
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39k
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '20'
        afdeling: '3'
  - number: 39l
    text: |-
      Een mededeling, als bedoeld in de [artikelen 39i, eerste lid][ref1], en [39j, tweede lid][ref2], blijft achterwege
      voor zover dit noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39i
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39j
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39l
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39i
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39j
        afdeling: '3'
  - number: 39l.a
    text: de voorkoming van de belemmering van gerechtelijke procedures;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39l
  - number: 39l.b
    text: het voorkomen, opsporen en vervolgen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39l
  - number: 39l.c
    text: de bescherming van de betrokkene of van de rechten en vrijheden van derden;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39l
  - number: 39l.d
    text: de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39l
  - number: 39m.1
    text: |-
      Een ieder over wiens persoon strafvorderlijke gegevens worden verwerkt kan de verantwoordelijke schriftelijk
      verzoeken deze te verbeteren, aan te vullen, te verwijderen of af te schermen indien deze feitelijk onjuist,
      voor het doel van de verwerking onvolledig of niet ter zake dienend zijn, dan wel in strijd met een wettelijk
      voorschrift worden verwerkt. Het verzoek bevat de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39m
  - number: 39m.2
    text: |-
      [Artikel 22, tweede en derde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat daar waar in dit
      artikel wordt gesproken over «Onze Minister» «het College van procureurs-generaal» wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel22
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39m
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '22'
        afdeling: '3'
  - number: 39m.3
    text: |-
      De verantwoordelijke draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo
      spoedig mogelijk wordt uitgevoerd. Hij draagt zorg voor het kenmerken van een gegeven als de juistheid daarvan door
      de betrokkene wordt betwist en niet kan worden vastgesteld of het gegeven al dan niet juist is.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39m
  - number: 39n.1
    text: |-
      Een beslissing op een verzoek als bedoeld in [artikel 39i][ref1], [39j][ref2] of [39m][ref3] geldt als een
      beschikking in de zin van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39i
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39j
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel39m
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39n
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39i
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39j
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: 39m
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 39n.2
    text: |-
      De [artikelen 47][ref1] en [48 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel48
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39n
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '48'
  - number: 39o.1
    text: |-
      Indien het College van procureurs-generaal strafvorderlijke gegevens heeft verbeterd, aangevuld, verwijderd
      of afgeschermd, doet het aan de personen of instanties, bedoeld in de [artikelen 39e, eerste lid][ref1], en
      [39f, eerste lid][ref2], aan wie in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken
      periode de betrokken gegevens zijn verstrekt, zo spoedig mogelijk mededeling van deze verbetering, aanvulling,
      verwijdering of afscherming, tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39o
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39e
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39f
        afdeling: '2'
  - number: 39o.2
    text: |-
      [Artikel 24, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande dat daar waar in dit artikel
      wordt gesproken over «Onze Minister» «het College van procureurs-generaal» wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel24
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39o
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '24'
        afdeling: '3'
  - number: 39p.1
    text: |-
      Het College van procureurs-generaal kan voor een mededeling als bedoeld in de [artikelen 39i, eerste lid][ref1],
      en [39j, tweede lid][ref2], een kostenvergoeding verlangen die niet hoger is dan een bij of krachtens algemene
      maatregel van bestuur vast te stellen bedrag. Daarbij wordt tevens de wijze van betaling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39i
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39j
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39p
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39i
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39j
        afdeling: '3'
  - number: 39p.2
    text: |-
      De vergoeding wordt teruggegeven ingeval het College van procureurs-generaal op verzoek van betrokkene, op
      aanbeveling van het College bescherming persoonsgegevens of op bevel van de rechter, tot verbetering, aanvulling,
      verwijdering of afscherming is overgegaan of het verzoek wordt geweigerd ingevolge [artikel 39l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39l
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39p
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39l
        afdeling: '3'
  - number: 39q.1
    text: |-
      Betrokkene kan bij het College van procureurs-generaal verzet aantekenen wegens bijzondere persoonlijke
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39q
  - number: 39q.2
    text: |-
      Het College van procureurs-generaal beoordeelt, gehoord het hoofd van het arrondissementsparket, het landelijk
      parket, het functioneel parket of het ressortsparket, binnen vier weken na ontvangst van het verzet of het verzet
      gerechtvaardigd is. Indien het verzet gerechtvaardigd is, beëindigt het terstond de verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39q
  - number: 39q.3
    text: |-
      De [artikelen 39n][ref1] en [39p][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39n
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39p
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39q
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 39n
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: 39p
        afdeling: '3'
  - number: 39r
    text: |-
      [Artikel 27][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel27
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel39r
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '27'
        afdeling: '4'
  - number: '40.1'
    text: |-
      Onze Minister verwerkt persoonsgegevens in persoonsdossiers in de documentatie persoonsdossiers met als doel de
      bevordering van een juiste toepassing van het strafrecht.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel40
  - number: '40.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt de wijze bepaald waarop de rapporten die het persoonsdossier
      vormen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel40
  - number: '40.3'
    text: |-
      De [artikelen 3][ref1], [7][ref2] en [39c, derde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel39c
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '7'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: 39c
        afdeling: '1'
  - number: '41.1'
    text: |-
      Een rapport in een persoonsdossier wordt verwijderd na verloop van tien jaren. De termijn vangt aan op de dag van
      sluiting van het rapport.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel41
  - number: '41.2'
    text: |-
      Indien de straf of maatregel de duur van tien jaren te boven gaat, is de termijn, bedoeld in het eerste lid,
      gelijk aan de duur van de aan de betrokken persoon in de strafzaak waarop het rapport betrekking heeft, opgelegde
      vrijheidsstraf of vrijheidsbenemende maatregel krachtens het strafrecht.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel41
  - number: '42.1'
    text: |-
      Onze Minister kan afschriften van de in een persoonsdossier opgenomen rapporten gebruiken ten behoeve van de
      behandeling van een gratieverzoek of met het oog op het onderzoek, bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
        afdeling: '5'
  - number: '42.2'
    text: |-
      Onze Minister verstrekt ten behoeve van een goede rechtspleging, de vervolging en berechting van strafbare feiten,
      de tenuitvoerlegging van straffen of maatregelen en het geven van advies over een gratieverzoek desgevraagd
      afschriften van de in een persoonsdossier opgenomen rapporten aan:
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: 42.2.a
    text: Nederlandse rechterlijke ambtenaren;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: 42.2.b
    text: rechterlijke ambtenaren van Aruba en de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: 42.2.c
    text: andere dan de onder a en b genoemde rechterlijke ambtenaren, voorzover Onze Minister dat bepaalt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: '42.3'
    text: |-
      Onze Minister verstrekt ten behoeve van de selectie of bejegening desgevraagd afschriften van de in een
      persoonsdossier opgenomen rapporten aan de selectiefunctionarissen en de hoofden van de inrichtingen waar de aan
      een persoon opgelegde straf of maatregel wordt ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: '42.4'
    text: |-
      Onze Minister verstrekt ten behoeve van het voorbereiden van enig rapport of het uitoefenen van enig toezicht
      desgevraagd afschriften van de in een persoonsdossier opgenomen rapporten aan:
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: 42.4.a
    text: |-
      de directeuren van de stichting en de reclasseringsinstellingen, bedoeld in
      [artikel 1, onder b en c van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: 42.4.b
    text: |-
      de reclasseringswerkers, bedoeld in [artikel 6, eerste lid, van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel6
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '6'
  - number: 42.4.c
    text: de directeur of ressortsdirecteur van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: '42.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere personen of instanties worden aangewezen aan wie ten behoeve
      van een juiste toepassing van het strafrecht afschriften van rapporten uit een persoonsdossier kunnen worden
      verstrekt. Daarbij kan tevens worden bepaald van welke rapporten afschriften worden verstrekt. Tevens kunnen nadere
      voorschriften worden gegeven in verband met de verstrekking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: '42.6'
    text: |-
      Behoudens ontheffing van Onze Minister, kunnen ten behoeve van wetenschappelijk onderzoek of statistiek desgevraagd
      afschriften uit rapporten uit een persoonsdossier worden verstrekt in zodanige vorm dat herleiding tot individuele
      natuurlijke personen redelijkerwijs wordt voorkomen. Onze Minister kan voorwaarden verbinden aan de verstrekking
      van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke deze persoon betreffende
      rapporten in de persoonsdossiers in de documentatie persoonsdossiers zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel43
  - number: '43.2'
    text: |-
      Hij doet daarbij geen mededelingen in schriftelijke vorm, tenzij hij weigert een mededeling te doen. Een gehele of
      gedeeltelijke afwijzing vindt schriftelijk plaats.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel43
  - number: '43.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verzoek en de wijze van kennisneming.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel43
  - number: '44.1'
    text: |-
      Elke verstrekking van afschriften van rapporten uit persoonsdossiers, overeenkomstig [artikel 41][ref1] wordt
      vastgelegd en tenminste vier jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel41
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '41'
  - number: '44.2'
    text: |-
      Onze Minister deelt een ieder op diens verzoek schriftelijk binnen vier weken mede of hem betreffende afschriften
      van rapporten uit de persoonsdossiers in het jaar voorafgaande aan het verzoek overeenkomstig [artikel 42][ref1]
      zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel42
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '42'
  - number: '45'
    text: |-
      Op de behandeling van verzoeken als bedoeld in het [eerste lid van artikel 43][ref1] en het
      [tweede lid van artikel 44][ref2] is [artikel 20][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel20
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '20'
        afdeling: '3'
  - number: '46.1'
    text: |-
      Degene aan wie overeenkomstig [artikel 43][ref1] kennis is gegeven van hem betreffende rapporten, kan Onze Minister
      schriftelijk verzoeken de persoonsgegevens in deze rapporten te verbeteren, aan te vullen, te verwijderen of af te
      schermen, indien deze feitelijk onjuist, voor het doel van de verwerking onvolledig of niet ter zake dienend zijn
      dan wel in strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de aan te brengen wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '43'
  - number: '46.2'
    text: |-
      Het [tweede en derde lid van artikel 22][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel22
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '22'
        afdeling: '3'
  - number: '47.1'
    text: |-
      Een beslissing op een verzoek als bedoeld in [artikel 44][ref1] of [46][ref2] geldt als een beschikking in de zin
      van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '47.2'
    text: |-
      De [artikelen 47][ref1] en [48 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel48
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '48'
  - number: '48.1'
    text: |-
      Indien Onze Minister persoonsgegevens in rapporten uit een persoonsdossier heeft verbeterd, aangevuld, verwijderd
      of afgeschermd doet hij aan de in [artikel 42][ref1] bedoelde personen of instanties aan wie in het jaar
      voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de betrokken persoonsgegevens zijn
      verstrekt, zo spoedig mogelijk mededeling van deze verbetering, aanvulling, verwijdering of afscherming, tenzij dit
      onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel42
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '42'
  - number: '48.2'
    text: |-
      Het [tweede lid van artikel 24][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel24
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '24'
        afdeling: '3'
  - number: '49.1'
    text: |-
      Onze Minister kan voor een mededeling als bedoeld in [artikel 43][ref1] of [44][ref2] een vergoeding van kosten
      verlangen die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag. Daarbij
      wordt tevens de wijze van betaling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel44
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '44'
  - number: '49.2'
    text: |-
      De vergoeding wordt teruggegeven ingeval Onze Minister op verzoek van de betrokkene, op aanbeveling van de College
      bescherming persoonsgegevens of op bevel van de rechter tot verbetering, aanvulling, verwijdering of afscherming
      is overgegaan.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel49
  - number: '50.1'
    text: |-
      Degene over wie één of meer persoonsgegevens in persoonsdossiers zijn verwerkt kan bij Onze Minister verzet
      hiertegen aantekenen wegens bijzondere persoonlijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel50
  - number: '50.2'
    text: |-
      Onze Minister beoordeelt, gehoord het openbaar ministerie en de instelling die het rapport heeft opgemaakt, binnen
      vier weken na ontvangst van het verzet of het verzet gerechtvaardigd is. Indien het verzet gerechtvaardigd is,
      beëindigt hij terstond de verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel50
  - number: '50.3'
    text: |-
      [Artikel 49][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel49
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '49'
  - number: '51'
    text: |-
      [Artikel 27][ref1] is van overeenkomstige toepassing op de verwerking van persoonsgegevens in persoonsdossiers.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel27
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '27'
        afdeling: '4'
  - number: '52.1'
    text: |-
      Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht tot
      geheimhouding daarvan, behoudens voorzover een bij of krachtens deze wet gegeven voorschrift mededelingen toelaat,
      dan wel de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt tot het ter kennis brengen daarvan
      noodzaakt.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel52
  - number: '52.2'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] is niet van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel52
    references:
      - id: ref1
