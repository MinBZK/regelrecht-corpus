  - number: '76'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel76
  - number: '77'
    text: |-
      Indien voor het moment van inwerkingtreding van deze wet een aanvraag om afgifte van een verklaring omtrent het
      gedrag van een natuurlijk persoon is gedaan, zijn op de behandeling van de aanvraag en de daaruit voortvloeiende
      procedures de bepalingen van toepassing zoals die luiden voor inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel77
  - number: '78'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel78
  - number: '79'
    text: 'Deze wet wordt aangehaald als: Wet justitiële en strafvorderlijke gegevens.'
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel79
