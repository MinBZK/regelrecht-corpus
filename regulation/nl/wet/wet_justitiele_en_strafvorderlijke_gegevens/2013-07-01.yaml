  - number: '53'
    text: |-
      De [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag](onbekend) (Stb. 1955, 395) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014194/2013-07-01#Artikel53
  - number: '75'
    text: |-
      Aan de in [artikel 9][ref1] bedoelde personen of instanties worden tevens de justitiële gegevens over minderjarigen
      verstrekt die overeenkomstig de [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref2]
      zoals die luidde voor de inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      _____________________________________________________________________ (Stb. 528) waren opgenomen in het
      strafregister.


