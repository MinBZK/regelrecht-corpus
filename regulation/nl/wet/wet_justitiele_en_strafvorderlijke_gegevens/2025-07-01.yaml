  - number: '43'
    text: |-
      1 De betrokkene heeft het recht om op diens schriftelijke verzoek binnen vier weken van Onze Minister uitsluitsel
      te krijgen over de al dan niet verwerking van hem betreffende rapporten in de persoonsdossiers in de documentatie
      persoonsdossiers en, wanneer dat het geval is, om die rapporten in te zien en hierover de informatie, bedoeld in
      [artikel 18, onderdelen a tot en met g][ref1], te verkrijgen.

      2 Onze Minister doet daarbij geen mededelingen in schriftelijke vorm, tenzij hij weigert een mededeling te doen.
      Een gehele of gedeeltelijke afwijzing vindt schriftelijk plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel43
