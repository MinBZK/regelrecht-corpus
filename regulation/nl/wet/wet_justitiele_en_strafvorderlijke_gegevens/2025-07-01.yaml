        artikel: 7b
        afdeling: '1'
  - number: '27'
    text: |-
      1 De Autoriteit persoonsgegevens, bedoeld in
      [artikel 6, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], ziet in het Europese
      deel van Nederland toe op de verwerking van justitiële gegevens overeenkomstig het bij en krachtens deze wet
      bepaalde.

      2 [Artikel 16 van de Uitvoeringswet algemene verordening gegevensbescherming][ref2] is van overeenkomstige
      toepassing.

      3 De [artikelen 35a][ref3], [35b][ref4] en [35d, van de Wet politiegegevens][ref5] zijn van overeenkomstige
      toepassing op justitiële gegevens.

      4 De Autoriteit persoonsgegevens is bevoegd:

      a. de verwerkingsverantwoordelijke of de verwerker te waarschuwen dat met de voorgenomen verwerkingen
      waarschijnlijk een inbreuk wordt gemaakt op het bij of krachtens deze wet bepaalde;

      b. een last onder bestuursdwang op te leggen ter handhaving van het bij of krachtens deze wet bepaalde;

      c. een bestuurlijke boete op te leggen indien de verwerkingsverantwoordelijke handelt in strijd met hetgeen is
      bepaald bij of krachtens:

        - de [artikelen 7][ref6], [7a][ref7], [7b][ref8], [7d][ref9], [26c][ref10], [26f][ref11],
      [26g][ref12] en [26h][ref13], van ten hoogste het bedrag van de geldboete van de vijfde categorie van
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref14];
        - de [artikelen 7e][ref15], [17a][ref16], [17b][ref17], [18][ref18], [22][ref19] en [24][ref20], van ten hoogste het
      bedrag van de geldboete van de zesde categorie van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref21];

      d. een advies te verstrekken aan de verwerkingsverantwoordelijke naar aanleiding van een voorafgaande raadpleging,
      bedoeld in [artikel 26h][ref22];

      e. de verwerkingsverantwoordelijke te verplichten een inbreuk in verband met persoonsgegevens te melden aan de
      betrokkene.

      5 Bij het besluit over het opleggen van een bestuurlijke boete, bedoeld in het vierde lid, en over de hoogte
      daarvan wordt voor elk concreet geval naar behoren rekening gehouden met:

      a) de aard, de ernst en de duur van de inbreuk, rekening houdend met de aard, de omvang of het doel van de
      verwerking in kwestie alsmede het aantal getroffen betrokkenen en de omvang van de door hen geleden schade;

      b) de opzettelijke of nalatige aard van de inbreuk;

      c) de door de verwerkingsverantwoordelijke of de verwerker genomen maatregelen om de door betrokkenen geleden
      schade te beperken;

      d) de mate waarin de verwerkingsverantwoordelijke of de verwerker verantwoordelijk is gezien de technische en
      organisatorische maatregelen die hij heeft uitgevoerd overeenkomstig de [artikelen 7][ref23] en [7a][ref24];

      e) eerdere relevante inbreuken door de verwerkingsverantwoordelijke of de verwerker;

      f) de mate waarin er met de Autoriteit persoonsgegevens is samengewerkt om de inbreuk te verhelpen en de mogelijke
      negatieve gevolgen daarvan te beperken;

      g) de categorieën van persoonsgegevens waarop de inbreuk betrekking heeft;

      h) de wijze waarop de Autoriteit persoonsgegevens kennis heeft gekregen van de inbreuk, met name of, en zo ja in
      hoeverre, de verwerkingsverantwoordelijke of de verwerker de inbreuk heeft gemeld;

      i. de naleving van de in het eerste lid genoemde maatregelen, voor zover die eerder ten aanzien van de
      verwerkingsverantwoordelijke of de verwerker in kwestie met betrekking tot dezelfde aangelegenheid zijn genomen.

      6 De werking van de beschikking tot oplegging van de bestuurlijke boete, bedoeld in het vierde lid, onder c, wordt
      opgeschort totdat de bezwaar- of beroepstermijn is verstreken of, indien bezwaar is gemaakt respectievelijk beroep
      is ingesteld, op het bezwaar respectievelijk het beroep is beslist.

      7 De bevoegdheden, bedoeld in het vierde lid, onderdelen d en e, gelden als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref25].


