  - number: 39m
    text: |-
      1 De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke rectificatie
      van de hem betreffende strafvorderlijke gegevens te verkrijgen, en rekening houdend met het doel van de verwerking,
      onvolledige strafvorderlijke gegevens te laten aanvullen. Het verzoek bevat de aan te brengen wijzigingen.

      2 De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke zonder onnodige
      vertraging vernietiging van de hem betreffende strafvorderlijke gegevens te verkrijgen, indien de gegevens in
      strijd met een wettelijk voorschrift worden verwerkt of een wettelijk voorschrift tot vernietiging verplicht.

      3 In plaats van vernietiging draagt de verwerkingsverantwoordelijke zorg voor afscherming van strafvorderlijke
      gegevens, indien:

      a. de juistheid van de strafvorderlijke gegevens door de betrokkene wordt betwist en de juistheid of onjuistheid
      niet kan worden geverifieerd, in welk geval de verwerkingsverantwoordelijke de betrokkene informeert voordat de
      beperking van de verwerking wordt opgeheven, of

      b. de persoonsgegevens moeten worden bewaard als bewijsmateriaal.

      4 De verwerkingsverantwoordelijke stelt de betrokkene binnen vier weken schriftelijk in kennis met betrekking tot
      de opvolging van zijn verzoek.

      5 [Artikel 22, vijfde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat daar waar in dit
      artikel wordt gesproken over «Onze Minister» «het College van procureurs-generaal» wordt gelezen.

      6 De verwerkingsverantwoordelijke draagt zorg dat een beslissing tot verbetering, aanvulling, vernietiging of
      afscherming zo spoedig mogelijk wordt uitgevoerd. Hij draagt zorg voor het kenmerken van een gegeven als de
      juistheid daarvan door de betrokkene wordt betwist en niet kan worden vastgesteld of het gegeven al dan niet juist
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel22
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel39m
    references:
