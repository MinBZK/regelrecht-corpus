  - number: 39ha
    text: |-
      1 Het College van procureurs-generaal maakt ten minste de volgende informatie toegankelijk voor de betrokkene:

      a. de identiteit en contactgegevens van de verwerkingsverantwoordelijke en, in voorkomend geval, van de
      functionaris voor gegevensbescherming;

      b. de doelen van de verwerking waarvoor de strafvorderlijke gegevens zijn bestemd;

      c. het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;

      d. de rechten van betrokkene, bedoeld in de [artikelen 39i, eerste lid][ref1], en [39m, eerste lid][ref2].

      2 [Artikel 17b][ref3] is van overeenkomstige toepassing, met dien verstande dat daar waar in dit artikel wordt
      gesproken over «Onze Minister» wordt gelezen «het College van procureurs-generaal».

      3 De verstrekking van informatie, bedoeld in de [artikelen 17b][ref4],
      [39i, eerste lid][ref5], en [39m, eerste lid][ref6], vindt plaats overeenkomstig de
      [artikelen 30 tot en met 34, van het Wetboek van Strafvordering][ref7] als de gegevens in een processtuk worden
      verwerkt.


