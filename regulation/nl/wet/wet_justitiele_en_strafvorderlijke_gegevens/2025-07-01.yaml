  - number: 42a
    text: |-
      1 Onze Minister kan met overeenkomstige toepassing van [artikel 16][ref1], afschriften van de in een
      persoonsdossier opgenomen rapporten ter beschikking stellen aan de bevoegde autoriteit van een andere lidstaat van
      de Europese Unie of aan organen of instanties die zijn opgericht krachtens de hoofdstukken 4 en 5 van titel V van
      het Verdrag betreffende de werking van de Europese Unie, die zijn belast met taken van rechtshandhaving, voor zover
      dat voortvloeit uit een rechtsinstrument op grond van het Verdrag betreffende de werking van de Europese Unie.

      2 Onze Minister kan met overeenkomstige toepassing van [artikel 16a][ref2], afschriften van de in een
      persoonsdossier opgenomen rapporten doorgeven aan rechterlijke ambtenaren dan wel aan een andere bevoegde
      autoriteit in een derde land of aan een internationale organisatie, ten behoeve van de strafrechtspleging.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel16a
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel42a
