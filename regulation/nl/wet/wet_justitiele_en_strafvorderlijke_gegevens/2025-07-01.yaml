      1 Het College van procureurs-generaal kan ten behoeve van de strafrechtspleging met overeenkomstige toepassing
      van [artikel 16][ref1], strafvorderlijke gegevens ter beschikking stellen aan de bevoegde autoriteit van een
      andere lidstaat van de Europese Unie of aan organen en instanties die zijn opgericht krachtens de hoofdstukken
      4 en 5 van titel V van het Verdrag betreffende de werking van de Europese Unie, die zijn belast met taken van
      rechtshandhaving, voor zover dat voortvloeit uit een rechtsinstrument op grond van het verdrag betreffende de
      werking van de Europese Unie.

      2 Het College van procureurs-generaal kan met overeenkomstige toepassing van [artikel 16a][ref2], strafvorderlijke
      gegevens verstrekken aan rechterlijke ambtenaren dan wel aan een andere bevoegde autoriteit in een derde land of
      aan een internationale organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel16
