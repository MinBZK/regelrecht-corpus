  - number: '21'
    text: |-
      1 Indien de betrokkene verzoekt om een overzicht, op grond van [artikel 18][ref1], of rectificatie, bedoeld
      in [artikel 22, eerste en tweede lid][ref2], wordt hij schriftelijk in kennis gesteld van de ontvangst van
      het verzoek, de termijn voor uitsluitsel en de mogelijkheid om een klacht in te dienen bij de Autoriteit
      persoonsgegevens.

      2 Een verzoek als bedoeld in [artikel 18][ref3] of [artikel 22, eerste en tweede lid][ref4], wordt afgewezen voor
      zover dit een noodzakelijke en evenredige maatregel is:

      a. ter vermijding van belemmering van de gerechtelijke onderzoeken of procedures;

      b. ter vermijding van nadelige gevolgen voor de voorkoming, de opsporing, het onderzoek en de vervolging van
      strafbare feiten of de tenuitvoerlegging van straffen;

      c. ter bescherming van de openbare veiligheid;

      d. ter bescherming van de rechten en vrijheden van derden;

      e. ter bescherming van de nationale veiligheid;

      f. ingeval van een kennelijk ongegrond of buitensporig verzoek, als bedoeld in [artikel 25, tweede lid][ref5].

      3 Een gehele of gedeeltelijke afwijzing van een verzoek als bedoeld in het eerste lid is schriftelijk en bevat de
      redenen voor de afwijzing.


