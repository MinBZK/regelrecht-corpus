      1 Indien de betrokkene verzoekt om inzage op grond van [artikel 43, eerste lid][ref1], of rectificatie, bedoeld
      in [artikel 46, eerste lid][ref2], wordt hij schriftelijk in kennis gesteld van de ontvangst van het verzoek, de
      termijn voor uitsluitsel en de mogelijkheid om naar aanleiding daarvan een klacht in te dienen bij de Autoriteit
      persoonsgegevens.

      2 [Artikel 21, eerste en tweede lid][ref3], is van overeenkomstige toepassing.


