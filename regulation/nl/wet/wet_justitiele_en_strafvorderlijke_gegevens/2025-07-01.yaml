  - number: '3'
    text: |-
      1 Onze Minister treft de nodige maatregelen opdat de justitiële gegevens, gelet op de doeleinden waarvoor zij
      worden verwerkt, juist en nauwkeurig zijn. Hij zorgt voor het onverwijld vernietigen of rectificeren van justitiële
      gegevens als blijkt dat deze, gelet op de doeleinden waarvoor zij worden verwerkt, onjuist zijn.

      2 Justitiële gegevens worden slechts verwerkt voor zover dit noodzakelijk is voor de bij of krachtens deze wet
      geformuleerde doeleinden.

      3 Justitiële gegevens worden slechts verwerkt voor zover dit behoorlijk en rechtmatig is, de gegevens rechtmatig
      zijn verkregen en de gegevens, gelet op de doeleinden waarvoor zij worden verwerkt, toereikend, ter zake dienend en
      niet bovenmatig zijn.

      4 Justitiële gegevens kunnen worden verwerkt voor een ander doel dan een bij of krachtens deze wet vastgesteld
      doel waarvoor zij zijn verkregen, voor zover bij wet of in een ieder verbindend besluit van de Europese Unie
      uitdrukkelijk daarin is voorzien en de verwerking voor dat andere doel noodzakelijk is en in verhouding staat tot
      dat doel. De verdere verwerking is alleen mogelijk door personen en instanties die bij of krachtens de wet met het
      oog op een zwaarwegend algemeen belang of in een bindend besluit van de Europese Unie zijn aangewezen.

      5 Onze Minister controleert, voor zover praktisch uitvoerbaar, de kwaliteit van justitiële gegevens voordat de
      gegevens worden verstrekt. Voor zover mogelijk wordt bij de doorzending van justitiële gegevens de noodzakelijke
      informatie toegevoegd aan de hand waarvan de ontvangende bevoegde autoriteit de mate van juistheid, volledigheid en
      betrouwbaarheid van justitiële gegevens kan beoordelen, alsmede de mate waarin zij actueel zijn.

      6 Justitiële gegevens worden uitsluitend voor een ander doel verwerkt dan waarvoor zij zijn verkregen voor zover
      deze verwerking niet onverenigbaar is met het doel waarvoor deze gegevens zijn verkregen en de verwerking voor
      dat andere doel overigens noodzakelijk is en in verhouding staat tot dat doel. De verdere verwerking is alleen
      mogelijk door personen en instanties die bij of krachtens de wet met het oog op een zwaarwegend algemeen belang
      zijn aangewezen.

      7 Onze Minister treft de nodige maatregelen opdat justitiële gegevens worden verwijderd of vernietigd zodra zij
      niet langer noodzakelijk zijn voor het doel waarvoor ze zijn verwerkt of dit door enige wettelijke bepaling wordt
      vereist.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel3
  - number: '4'
    text: |-
      1 Justitiële gegevens van verdachten en veroordeelden wegens misdrijven worden vernietigd:

      a. dertig jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een misdrijf
      waarop naar de wettelijke omschrijving een gevangenisstraf van zes jaar of meer is gesteld, en in het kader van
      het misdrijf de justitiële gegevens zijn verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten
      uitvoer is gelegd, dan wel twintig jaar na het overlijden van betrokkene,

      b. twintig jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref3] en [352 van het Wetboek van Strafvordering][ref4] is gedaan in verband met een misdrijf
      waarop naar de wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld, en in het kader van
      het misdrijf de justitiële gegevens zijn verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten
      uitvoer is gelegd, dan wel twaalf jaar na het overlijden van betrokkene, of

      c. na het vervallen van het recht tot strafvordering door verjaring.

      2 De termijn van dertig en twintig jaar, genoemd in het eerste lid, wordt verlengd indien tegen de betrokkene een
      einduitspraak als bedoeld in de [artikelen 351][ref5] en [352 van het Wetboek van Strafvordering][ref6] in verband
      met een ander misdrijf is gedaan. In dat geval worden de justitiële gegevens vernietigd twintig dan wel dertig
      jaar nadat het vonnis is uitgesproken of de strafbeschikking volledig ten uitvoer is gelegd, al naar gelang op het
      misdrijf naar de wettelijke omschrijving minder dan zes jaar of zes jaar of meer gevangenisstraf is gesteld.

      3 De termijn van dertig jaar, genoemd in het eerste lid, wordt met twintig jaar verlengd indien de duur van de
      gevangenisstraf of vrijheidsbenemende maatregel langer is dan twintig jaar. Indien de gevangenisstraf levenslang
      is of de vrijheidsbenemende maatregel de duur van veertig jaar overstijgt, worden de justitiële gegevens na tachtig
      jaar vernietigd.

      4 In afwijking van het eerste tot en met derde lid worden justitiële gegevens van verdachten
      en veroordeelden wegens misdrijven als bedoeld in de [artikelen 241][ref7], [243][ref8], en
      [245 tot en met 253 van het Wetboek van Strafrecht][ref9] na tachtig jaar vernietigd.


