  - number: 26d
    text: |-
      1 De verwerkingsverantwoordelijke draagt zorg voor de schriftelijke vastlegging van:

      a. de feitelijke of juridische redenen die ten grondslag liggen aan een beslissing tot afwijzing op een verzoek tot
      inzage of rectificatie;

      b. de verstrekking of doorgifte van justitiële gegevens, bedoeld in
      [artikel 16a, tweede lid, onderdeel b, derde en vierde lid][ref1];

      c. een inbreuk op de beveiliging van justitiële gegevens, inclusief de feiten omtrent de inbreuk, de gevolgen ervan
      en de maatregelen die zijn getroffen ter correctie.

      2 Bij de doorgifte van justitiële gegevens aan een verwerkingsverantwoordelijke in een derde land of van een
      internationale organisatie omvat de schriftelijke vastlegging de datum en tijd van doorgifte, informatie over de
      ontvangende bevoegde autoriteit, de reden van doorgifte en de doorgegeven gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel16a
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: 16a
        afdeling: '2'
  - number: 26e
    text: |-
      1 De verwerkingsverantwoordelijke en de verwerker dragen zorg voor de vastlegging langs elektronische weg (logging)
      van ten minste de volgende verwerkingen van justitiële gegevens in geautomatiseerde systemen: het verzamelen,
      wijzigen, raadplegen, verstrekken onder meer in de vorm van doorgiften, combineren en vernietigen van justitiële
      gegevens.

      2 De vastgelegde gegevens, bedoeld in het eerste lid, worden uitsluitend gebruikt voor de controle van de
      rechtmatigheid van de gegevensverwerking, voor interne controles, ter waarborging van de integriteit en de
      beveiliging van de justitiële gegevens en voor strafrechtelijke procedures.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26e
  - number: 26f
    text: |-
      1 De verwerkingsverantwoordelijke benoemt een functionaris voor gegevensbescherming. Voor verschillende
      bevoegde autoriteiten kan, rekening houdend met hun organisatiestructuur en omvang, één functionaris
      voor gegevensbescherming worden aangewezen. De functionaris voor gegevensbescherming wordt door de
      verwerkingsverantwoordelijke tijdig en naar behoren betrokken bij alle aangelegenheden die verband houden met de
      bescherming van justitiële gegevens.

      2 De functionaris voor gegevensbescherming wordt aangewezen op grond van zijn professionele kwaliteiten en, in
      het bijzonder, zijn deskundigheid op het gebied van de wetgeving en de praktijk inzake gegevensbescherming en zijn
      vermogen de taken, bedoeld in het derde lid, te vervullen.

      3 De functionaris voor gegevensbescherming is tenminste belast met de volgende taken:

      a. het informeren en adviseren van de verwerkingsverantwoordelijke en het onder hem ressorterend personeel dat
      justitiële gegevens verwerkt over hun verplichtingen op grond van het bepaalde bij of krachtens deze wet en andere
      gegevensbeschermingsbepalingen op grond van het Unierecht of het Nederlandse recht;

      b. het toezien op de naleving van het bepaalde bij of krachtens deze wet, van andere gegevensbeschermingsbepalingen
      van het Unierecht of het Nederlandse recht en van het beleid van de verwerkingsverantwoordelijke met betrekking
      tot de bescherming van persoonsgegevens, met inbegrip van de toewijzing van verantwoordelijkheden, bewustmaking en
      opleiding van het voor de verwerkingsverantwoordelijke werkzame personeel dat betrokken is bij de verwerking van
      justitiële gegevens en de betreffende audits;

      c. het desgevraagd verstrekken van advies over de effectbeoordeling, bedoeld in [artikel 7b][ref1], en het toezien
      op de uitvoering ervan;

      d. het samenwerken met de Autoriteit persoonsgegevens;

      e. het optreden als contactpunt voor de Autoriteit persoonsgegevens inzake aangelegenheden in verband met de
      verwerking van persoonsgegevens en, voor zover dienstig, plegen van overleg over enige andere aangelegenheid.

      4 De functionaris voor de gegevensbescherming stelt jaarlijks een verslag op van zijn bevindingen.

      5 De verwerkingsverantwoordelijke maakt de contactgegevens van de functionaris voor gegevensbescherming openbaar en
      meldt hem aan bij de Autoriteit persoonsgegevens.

      6 De verwerkingsverantwoordelijke ondersteunt de functionaris voor gegevensbescherming bij de vervulling van zijn
      taken door hem toegang te verschaffen tot persoonsgegevens en stelt de functionaris voor gegevensbescherming de
      benodigde middelen ter beschikking voor het vervullen van de taken, bedoeld in het derde lid, en het in standhouden
      van zijn deskundigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel7b
