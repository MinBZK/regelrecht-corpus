      d. een advies te verstrekken aan de verwerkingsverantwoordelijke naar aanleiding van een voorafgaande raadpleging,
      bedoeld in [artikel 26h][ref25];

      e. de verwerkingsverantwoordelijke te verplichten een inbreuk in verband met persoonsgegevens te melden aan de
      betrokkene.

      4 [Artikel 27, vijfde lid][ref26], is van overeenkomstige toepassing.

      5 De werking van de beschikking tot oplegging van de bestuurlijke boete, bedoeld in het derde lid, onder c, wordt
