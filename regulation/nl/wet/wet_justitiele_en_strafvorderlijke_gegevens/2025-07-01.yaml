  - number: 51g
    text: |-
      1 De gerechtelijke strafgegevens worden verwijderd zodra die voor de gerechten, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], niet langer noodzakelijk zijn voor de uitoefening van
      hun rechterlijke taken.

      2 De verwerkingsverantwoordelijke verstrekt gerechtelijke strafgegevens ten behoeve van de behandeling van
      strafzaken, in overeenstemming met het bepaalde bij of krachtens het [Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel51g
    references:
