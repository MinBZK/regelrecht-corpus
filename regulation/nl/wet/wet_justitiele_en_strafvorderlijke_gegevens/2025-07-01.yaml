  - number: 26b
    text: |-
      Een vordering tegen de Autoriteit persoonsgegevens wordt ingesteld bij een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 26c
    text: |-
      1 De verwerkingsverantwoordelijke houdt een register bij dat de volgende gegevens bevat:

      a. de naam en de contactgegevens van de verwerkingsverantwoordelijke en de functionaris voor gegevensbescherming;

      b. de doelen van de verwerking;

      c. de categorieën van ontvangers aan wie justitiële gegevens zijn of zullen worden verstrekt, met inbegrip van
      ontvangers in derde landen of internationale organisaties;

      d. een beschrijving van de categorieën van betrokkenen en van de categorieën van persoonsgegevens;

      e. in voorkomend geval, het gebruik van profilering;

      f. in voorkomend geval, de categorieën van doorgiften van justitiële gegevens aan een derde land of een
      internationale organisatie;

      g. een aanwijzing van de rechtsgrondslag van de verwerking, met inbegrip van doorgiften, waarvoor de justitiële
      gegevens bedoeld zijn;

      h. zo mogelijk, de beoogde termijnen waarbinnen de verschillende categorieën van gegevens worden verwijderd of
      vernietigd;

      i. zo mogelijk, een algemene beschrijving van de technische en organisatorische maatregelen ter beveiliging,
      bedoeld in [artikel 7][ref1].

      2 De verwerker houdt een register bij dat de volgende gegevens bevat:

      a. de naam en de contactgegevens van de verwerker of verwerkers en van iedere verwerkingsverantwoordelijke ten
      behoeve van wie de verwerker handelt en, in voorkomend geval, van de functionaris voor gegevensbescherming;

      b. de categorieën van verwerkingen die namens iedere verwerkingsverantwoordelijke zijn uitgevoerd;

      c. indien van toepassing, doorgiften van justitiële gegevens aan een derde land of een internationale
      organisatie, onder vermelding van dat derde land of die internationale organisatie, indien daartoe door de
      verwerkingsverantwoordelijke uitdrukkelijk geïnstrueerd;

      d. indien mogelijk, een algemene beschrijving van de technische en organisatorische maatregelen, bedoeld in
      [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel7
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26c
