  - number: '2'
    text: |-
      1 Onze Minister verwerkt in de justitiële documentatie justitiële gegevens ten behoeve van een goede
      strafrechtspleging.

      2 Bij algemene maatregel van bestuur worden de gegevens aangewezen die als justitiële gegevens worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel2
  - number: 2a
    text: |-
      1 Onze Minister maakt gebruik van Ecris-TCN ten behoeve van de strafrechtspleging en daarnaast voor de volgende
      doelen:

      a. een verzoek van de betrokkene om hem betreffende justitiële gegevens als bedoeld in [artikel 18][ref1];

      b. veiligheidsonderzoek in verband met werving of vrijwillige activiteiten waarbij sprake is van rechtstreeks en
      geregeld contact met kinderen, nadat betrokkene een aanvraag heeft gedaan om afgifte van een verklaring omtrent het
      gedrag als bedoeld in [artikel 28][ref2];

      2 Onze Minister verzoekt de centrale autoriteit van een lidstaat om doorgifte van justitiële gegevens ten behoeve
      van de in het eerste lid genoemde doelen.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld over het doen van een verzoek om doorgifte van
      justitiële gegevens aan de centrale autoriteiten van andere lidstaten van de Europese Unie en over de ontvangst van
      justitiële gegevens vanuit andere lidstaten van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel2a
