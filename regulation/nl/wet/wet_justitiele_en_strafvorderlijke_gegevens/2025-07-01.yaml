  - number: '37'
    text: |-
      1 Onze Minister beslist op de aanvraag met betrekking tot de afgifte van de verklaring omtrent het gedrag van een
      natuurlijk persoon binnen vier weken na ontvangst van de aanvraag.

      2 Indien Onze Minister voornemens is afwijzend te beslissen op de aanvraag, bedoeld in het eerste lid, beslist hij
      binnen acht weken na ontvangst van de aanvraag.

      3 Indien de verklaring omtrent het gedrag wordt afgegeven, zijn de [artikelen 3:8][ref1] en
      [3:50 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel38
