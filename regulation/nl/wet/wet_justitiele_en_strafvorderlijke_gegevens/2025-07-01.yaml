  - number: '18'
    text: |-
      De betrokkene heeft het recht om op diens schriftelijke verzoek van Onze Minister binnen zes weken uitsluitsel te
      verkrijgen over de al dan niet verwerking van hem betreffende justitiële gegevens en, wanneer dat het geval is, om
      een overzicht van die justitiële gegevens te verkrijgen en om de volgende informatie te verkrijgen:

      a. de doelen en de rechtsgrond van de verwerking;

      b. de betrokken categorie van de gegevens;

      c. de vraag of de deze persoon betreffende justitiële gegevens gedurende een periode van vier jaar voorafgaande aan
      het verzoek zijn verstrekt en over de ontvangers of categorieën van ontvangers aan wie de gegevens zijn verstrekt,
      met name ontvangers in derde landen of internationale organisaties;

      d. de voorziene periode van opslag of indien dat niet mogelijk is, de criteria om die termijn te bepalen;

      e. het recht te verzoeken om verbetering, vernietiging of afscherming van de verwerking van hem betreffende
      persoonsgegevens;

      f. het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;

      g. alle beschikbare informatie over de oorsprong van de verwerking van hem betreffende justitiële gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Elke verstrekking van justitiële gegevens overeenkomstig de bepalingen van [Afdeling 2][ref1] wordt vastgelegd en
      ten minste vier jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Afdeling2
