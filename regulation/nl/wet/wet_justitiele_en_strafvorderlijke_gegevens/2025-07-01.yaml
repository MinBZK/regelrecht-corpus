  - number: 39n
    text: |-
      1 Een beslissing op een verzoek als bedoeld in [artikel 39i][ref1] of [39m][ref2] geldt als een beschikking in de
      zin van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref3].

      2 De belanghebbende kan zich binnen de termijn bepaald voor het beroep op grond van de
      [Algemene wet bestuursrecht][ref4] tot de Autoriteit persoonsgegevens wenden met het verzoek te bemiddelen
      of te adviseren in zijn geschil met de verwerkingsverantwoordelijke. In dat geval kan in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref5] het beroep nog worden ingesteld nadat de belanghebbende van
      de Autoriteit persoonsgegevens bericht heeft ontvangen dat de behandeling van de zaak is beëindigd, doch uiterlijk
      zes weken na dat tijdstip.


