  - number: 51h
    text: |-
      1 De [artikelen 26a tot en met 26e][ref1], [26g][ref2], [26h][ref3] en [27, eerste en tweede lid][ref4], en
      [39c, tweede tot en met vijfde lid][ref5], zijn van overeenkomstige toepassing op gerechtelijke strafgegevens.

      2 De [artikelen 35a][ref6], [35b][ref7] en [35d, van de Wet politiegegevens][ref8] zijn van overeenkomstige
      toepassing op gerechtelijke strafgegevens.

      3 De Autoriteit persoonsgegevens is bevoegd:

      a. de verwerkingsverantwoordelijke of de verwerker te waarschuwen dat met de voorgenomen verwerkingen
      waarschijnlijk een inbreuk wordt gemaakt op het bij of krachtens deze wet bepaalde;

      b. een last onder bestuursdwang op te leggen ter handhaving van het bij of krachtens deze wet bepaalde;

      c. een bestuurlijke boete op te leggen indien de verwerkingsverantwoordelijke handelt in strijd met hetgeen is
      bepaald bij of krachtens:

        - de [artikelen 51f, eerste lid][ref9], voor wat betreft de overeenkomstige toepassing van de
      [artikelen 7][ref10], [7a][ref11], [7b][ref12] en [7d][ref13] in dat lid, en [51h, eerste lid][ref14],
      voor wat betreft de overeenkomstige toepassing van de [artikelen 26c][ref15], [26g][ref16] en
      [26h][ref17] in dat lid, van ten hoogste het bedrag van de geldboete van de vijfde categorie van
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref18];
        - [artikel 51f, eerste lid][ref19], voor wat betreft de overeenkomstige toepassing van de [artikelen 7e][ref20],
      [17a][ref21], [17b][ref22], [22][ref23] en [24][ref24], alsmede [artikel 51f, derde lid][ref25], van ten hoogste het
      bedrag van de geldboete van de zesde categorie van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref26];

      d. een advies te verstrekken aan de verwerkingsverantwoordelijke naar aanleiding van een voorafgaande raadpleging,
      bedoeld in [artikel 26h][ref27];

      e. de verwerkingsverantwoordelijke te verplichten een inbreuk in verband met persoonsgegevens te melden aan de
      betrokkene.

      4 [Artikel 27, vijfde lid][ref28], is van overeenkomstige toepassing.

      5 De werking van de beschikking tot oplegging van de bestuurlijke boete, bedoeld in het derde lid, onder c, wordt
      opgeschort totdat de bezwaar- of beroepstermijn is verstreken of, indien bezwaar is gemaakt respectievelijk beroep
      is ingesteld, op het bezwaar respectievelijk het beroep is beslist.

      6 De bevoegdheden, bedoeld in het derde lid, onderdelen d en e, gelden als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref29].

      7 In afwijking van het eerste lid, is de Autoriteit persoonsgegevens niet belast met het
      toezicht op de verwerking van gerechtelijke strafgegevens door de gerechten, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref30], in het kader van de uitoefening van hun rechterlijke
      taken.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel26a
