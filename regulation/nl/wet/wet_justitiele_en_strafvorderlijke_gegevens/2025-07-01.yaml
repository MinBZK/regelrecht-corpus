        afdeling: '2'
  - number: '20'
    text: |-
      1 Bij de behandeling van verzoeken als bedoeld in de [artikelen 18][ref1] en [22, eerste lid][ref2], draagt
      Onze Minister zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker. Wanneer Onze Minister
      redenen heeft om te twijfelen aan de identiteit van de persoon die het verzoek doet, kan hij de nodige aanvullende
      informatie vragen ter bevestiging van de identiteit van de betrokkene.

      2 De verzoeken worden ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en
      ten aanzien van onder curatele gestelden gedaan door hun wettelijke vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijke vertegenwoordigers.

      3 Verzoeken ten aanzien van rechtspersonen worden gedaan door een vertegenwoordiger van de rechtspersoon.

      4 De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. Bij
      ministeriële regeling kunnen aan de bijzondere machtiging nadere eisen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
