  - number: '24'
    text: |-
      1 Indien Onze Minister heeft vastgesteld dat onjuiste justitiële gegevens zijn verstrekt, of dat de justitiële
      gegevens onrechtmatig zijn verstrekt stelt hij de ontvangers onverwijld hiervan in kennis. In dat geval dienen de
      gegevens te worden gerectificeerd, vernietigd of te worden afgeschermd.

      2 Onze Minister deelt aan de verzoeker en voorzover van toepassing aan de wettelijk vertegenwoordiger, desgevraagd
      mede aan wie hij de mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel24
  - number: '25'
    text: |-
      1 De verstrekking van de informatie, bedoeld in de [artikelen 18][ref1] en [22, eerste lid][ref2], geschiedt
      kosteloos.

      2 In het geval van kennelijk ongegronde of buitensporige verzoeken, met name vanwege de geringe tussenpozen tussen
      opeenvolgende verzoeken, kan Onze Minister weigeren gevolg te geven aan het verzoek.


