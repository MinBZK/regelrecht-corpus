  - number: 51a
    text: |-
      1 Onze Minister dan wel het College van procureurs-generaal verwerkt tenuitvoerleggingsgegevens, indien dit
      noodzakelijk is voor een goede vervulling van een wettelijke taak of het nakomen van een andere wettelijke
      verplichting.

      2 De directeur van een penitentiaire inrichting of afdeling, het hoofd van een inrichting voor verpleging
      van ter beschikking gestelden of de directeur van een justitiële jeugdinrichting, voert het beheer over de
      tenuitvoerleggingsgegevens inzake vrijheidsbenemende straffen of maatregelen bij de uitvoering waarvan hij
      betrokken is.

      3 Het hoofd van een arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale
      verwerking openbaar ministerie of het ressortsparket voert het beheer over de tenuitvoerleggingsgegevens waarvoor
      het College van procureurs-generaal verwerkingsverantwoordelijke is.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel51a
  - number: 51b
    text: |-
      1 De [artikelen 3][ref1], [7][ref2], [7a][ref3], [7b][ref4], [7d tot en met 7f][ref5], [15][ref6], [16][ref7],
      [16a][ref8], [17a][ref9], [17b][ref10], [20 tot en met 25][ref11], en [39c, tweede tot en met vijfde lid][ref12],
      zijn van overeenkomstige toepassing op tenuitvoerleggingsgegevens.

      2 Onverminderd het verder bij wet bepaalde over kennisneming of inzage van tenuitvoerleggingsgegevens heeft
      de betrokkene het recht om op diens schriftelijke verzoek binnen vier weken van Onze Minister uitsluitsel
      te krijgen over de al dan niet verwerking van hem betreffende tenuitvoerleggingsgegevens en, wanneer
      dat het geval is, om die tenuitvoerleggingsgegevens in te zien en hierover de informatie, bedoeld in
      [artikel 18, onderdelen a tot en met g][ref13], te verkrijgen. Onze Minister doet daarbij geen mededelingen in
      schriftelijke vorm over de verwerking van de betrokkene betreffende tenuitvoerleggingsgegevens, tenzij hij weigert
      een mededeling te doen. Een gehele of gedeeltelijke afwijzing vindt schriftelijk plaats.

      3 Indien de verwerking betrekking heeft op tenuitvoerleggingsgegevens waarvoor het College van procureurs-generaal
      verwerkingsverantwoordelijke is, wordt bij de overeenkomstige toepassing van de artikelen, bedoeld in het eerste
      lid, in die artikelen alsmede in het tweede lid waar wordt gesproken over «Onze Minister» gelezen «het College van
      procureurs-generaal».


