  - number: '26'
    text: |-
      1 Betrokkene kan bij Onze Minister verzet aantekenen wegens bijzondere persoonlijke omstandigheden.

      2 Onze Minister beoordeelt, gehoord het openbaar ministerie, binnen vier weken na ontvangst van het verzet of het
      verzet gerechtvaardigd is. Indien het verzet gerechtvaardigd is, beëindigt hij terstond de verwerking.

      3 De [artikelen 23][ref1] en [25][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel23
