  - number: '22'
    text: |-
      1 De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke rectificatie
      van de hem betreffende justitiële gegevens te verkrijgen en, rekening houdend met het doel van de verwerking,
      onvolledige justitiële gegevens te laten aanvullen. Het verzoek bevat de aan te brengen wijzigingen.

      2 De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke zonder onnodige
      vertraging vernietiging van de hem betreffende justitiële gegevens te verkrijgen, indien de gegevens in strijd met
      een wettelijk voorschrift worden verwerkt of een wettelijk voorschrift tot vernietiging verplicht.

      3 In plaats van vernietiging draagt de verwerkingsverantwoordelijke zorg voor afscherming van justitiële gegevens,
      als:

      a. de juistheid van de gegevens door de betrokkene wordt betwist en de juistheid of onjuistheid niet kan worden
      geverifieerd, in welk geval de verwerkingsverantwoordelijke de betrokkene informeert voordat de afscherming wordt
      opgeheven, of

      b. de persoonsgegevens moeten worden bewaard als bewijsmateriaal.

      4 De verwerkingsverantwoordelijke stelt de betrokkene binnen vier weken na ontvangst van het verzoek schriftelijk
      in kennis of, dan wel in hoeverre, hij daaraan voldoet.

      5 De verwerkingsverantwoordelijke deelt de rectificatie van de onjuiste justitiële gegevens mede aan de bevoegde
      autoriteit van wie de gegevens afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel22
  - number: '23'
    text: |-
      1 Een beslissing op een verzoek als bedoeld in [artikel 18][ref1] of [22][ref2] geldt als een beschikking in de zin
      van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref3].

      2 De belanghebbende kan zich binnen de termijn bepaald voor het beroep op grond van de
      [Algemene wet bestuursrecht][ref4] tot de Autoriteit persoonsgegevens wenden met het verzoek te bemiddelen
      of te adviseren in zijn geschil met de verwerkingsverantwoordelijke. In dat geval kan in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref5] het beroep nog worden ingesteld nadat de belanghebbende van
      de Autoriteit persoonsgegevens bericht heeft ontvangen dat de behandeling van de zaak is beëindigd, doch uiterlijk
      zes weken na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
