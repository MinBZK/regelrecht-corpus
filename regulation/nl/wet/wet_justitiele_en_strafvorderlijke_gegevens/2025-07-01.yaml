  - number: '10'
    text: |-
      1 Behoudens het bepaalde in [artikel 12][ref1] worden aan de in [artikel 9][ref2] bedoelde personen of instanties
      slechts gegevens verstrekt betreffende onherroepelijke veroordelingen wegens misdrijf waarbij een straf, al dan
      niet tezamen met een maatregel, is opgelegd, en wegens overtreding indien daarbij vrijheidsstraf – anders dan
      vervangende – of een taakstraf is opgelegd. Met een veroordeling worden gelijkgesteld een rechterlijke beslissing
      waarbij een maatregel als bedoeld in [artikel 37a van het Wetboek van Strafrecht][ref3] is opgelegd en een
      strafbeschikking.

      2 Geen gegevens worden verstrekt indien:

      a. na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd,

      b. na het onherroepelijk worden van de uitspraak of strafbeschikking vier jaren zijn verstreken, of

      c. de veroordeling door een andere dan een Nederlandse rechter is gewezen wegens een feit dat naar Nederlands recht
      geen misdrijf oplevert, tenzij ingevolge deze veroordeling in Nederland vrijheidsstraf – anders dan vervangende –
      of een taakstraf moet worden ondergaan.

      3 De termijn bedoeld in het tweede lid, onder b, beloopt acht jaren indien bij de veroordeling een
      onvoorwaardelijke vrijheidsstraf dan wel een voorwaardelijke vrijheidsstraf waarvan later de gehele of
      gedeeltelijke tenuitvoerlegging is bevolen, is opgelegd. Hetzelfde geldt indien bij de veroordeling een taakstraf
      is opgelegd, dan wel de tenuitvoerlegging van een bij de taakstraf opgelegde vervangende hechtenis is bevolen.

      4 De termijn wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde vrijheidsstraf met uitzondering
      van de straf of het gedeelte daarvan dat voorwaardelijk is opgelegd en ten aanzien waarvan de gehele of
      gedeeltelijke tenuitvoerlegging later niet is bevolen. De termijn wordt met zes maanden verlengd indien een
      taakstraf is opgelegd.

      5 De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke
      veroordeling en met de termijn van de verlenging van de terbeschikkingstelling.

      6 De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling als
      bedoeld in het eerste lid, niet is geëindigd.

      7 Ingeval van tenuitvoerlegging in Nederland van een veroordeling door een andere dan de Nederlandse rechter
      gewezen vangt de in het tweede lid, onder b, en het derde lid, bedoelde termijn aan op de dag na die, waarop die
      veroordeling onherroepelijk is geworden. De duur van de termijn wordt bepaald aan de hand van de bij de uitspraak
      of beslissing, krachtens welke de bovenbedoelde veroordeling in Nederland kan worden ten uitvoer gelegd, opgelegde
      of uitvoerbaar geworden straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
