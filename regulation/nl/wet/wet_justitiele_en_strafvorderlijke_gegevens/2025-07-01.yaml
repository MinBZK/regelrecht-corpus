  - number: '11'
    text: |-
      1 Aan de in [artikel 9][ref1] bedoelde personen of instanties worden gegevens verstrekt betreffende onherroepelijke
      veroordelingen van rechtspersonen wegens enige overtreding, indien daarbij een geldboete is opgelegd van de derde
      of een hogere categorie. Met een veroordeling wordt gelijkgesteld een strafbeschikking.

      2 Geen gegevens worden verstrekt indien:

      a. na het gegrond bevinden van de aanvraag tot herziening van een in kracht van gewijsde gegane einduitspraak deze
      wordt vernietigd en geen straf of maatregel is opgelegd, of

      b. na het onherroepelijk worden van de uitspraak of strafbeschikking vier jaren zijn verstreken.

      3 De termijn bedoeld in het tweede lid, onder b, beloopt acht jaren indien is veroordeeld tot onvoorwaardelijke
      betaling van een geldboete dan wel tot voorwaardelijke betaling van een geldboete waarvan later de gehele of
      gedeeltelijke tenuitvoerlegging is bevolen.

      4 De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke
      veroordeling.

      5 De termijnen eindigen niet zolang de termijn met betrekking tot enige andere onherroepelijke veroordeling als
      bedoeld in het [eerste lid van artikel 10][ref2] en het [eerste lid van 11][ref3] niet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel9
