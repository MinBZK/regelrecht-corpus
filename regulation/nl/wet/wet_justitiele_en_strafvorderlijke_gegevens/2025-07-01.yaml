      1 Indien de betrokkene verzoekt om inzage, op grond van [artikel 39i, eerste lid][ref1], of rectificatie, bedoeld
      in [artikel 39m, eerste lid][ref2], wordt hij schriftelijk in kennis gesteld van de ontvangst van het verzoek, de
      termijn voor uitsluitsel en de mogelijkheid om naar aanleiding daarvan een klacht in te dienen bij de Autoriteit
      persoonsgegevens.

      2 Een verzoek als bedoeld in de [artikelen 39i, eerste lid][ref3], en [39m, eerste lid][ref4], wordt afgewezen,
      voor zover het onthouden van inzage of het achterwege laten van rectificatie een noodzakelijke en evenredige
      maatregel is gelet op één of meer van de gronden, bedoeld in [artikel 21, tweede lid][ref5].

      3 De gehele of gedeeltelijke afwijzing van een verzoek als bedoeld in het eerste lid is schriftelijk.


