  - number: '45'
    text: |-
      Op de behandeling van verzoeken als bedoeld in het [eerste lid van artikel 43][ref1] is [artikel 20][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel20
