  - number: 51c
    text: |-
      1 Tenuitvoerleggingsgegevens van veroordeelden voor andere strafrechtelijke beslissingen dan vrijheidsbenemende
      straffen of maatregelen worden vernietigd met overeenkomstige toepassing van de termijnen voor vernietiging,
      bedoeld in de [artikelen 4][ref1] en [6][ref2].

      2 Voor zover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang kan Onze Minister of het College
      van procureurs-generaal aan personen of instanties tenuitvoerleggingsgegevens verstrekken voor het doel van:

      a. de tenuitvoerlegging van een strafrechtelijke beslissing;

      b. de voorkoming, de opsporing, het onderzoek en de vervolging van strafbare feiten;

      c. schuldhulpverlening of resocialisatie van betrokkene;

      d. bestuurlijk handelen of het nemen van een bestuursrechtelijke beslissing, of

      e. het verlenen van hulp aan slachtoffers.

      3 Onze Minister of het College van procureurs-generaal kan slechts gegevens aan personen of instanties als bedoeld
      in het tweede lid verstrekken, voor zover die gegevens voor die personen of instanties:

      a. noodzakelijk zijn met het oog op een zwaarwegend algemeen belang of de vaststelling, de uitoefening of de
      verdediging van een recht in rechte, en

      b. in zodanige vorm worden verstrekt dat herleiding tot andere personen dan betrokkene, redelijkerwijs wordt
      voorkomen.

      4 Elke verstrekking, bedoeld in het derde lid, en bedoeld in de van overeenkomstige van toepassing zijnde
      [artikelen 16][ref3] en [16a][ref4], wordt vastgelegd en ten minste vier jaar bewaard.


