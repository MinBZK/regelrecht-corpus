  - number: 26g
    text: |-
      1 De verwerkingsverantwoordelijke meldt een inbreuk op de beveiliging onverwijld en uiterlijk binnen 72 uur nadat
      hij ervan kennis heeft genomen aan de Autoriteit persoonsgegevens, tenzij het niet waarschijnlijk is dat de inbreuk
      een risico voor de rechten en vrijheden van personen met zich meebrengt. In het geval de melding na 72 uur wordt
      gedaan, gaat deze vergezeld van een motivering voor de vertraging.

      2 De melding, bedoeld in het eerste lid, bevat ten minste de volgende informatie:

      a. een beschrijving van de aard en omvang van de inbreuk, bedoeld in het eerste lid, waaronder begrepen, waar
      mogelijk, de categorieën van betrokkenen en van gegevensbestanden en, bij benadering, het aantal betrokkenen en
      gegevensbestanden.

      b. de mededeling van de naam en de contactgegevens van de functionaris voor gegevensbescherming of een ander
      contactpunt waar meer informatie kan worden verkregen;

      c. een beschrijving van de waarschijnlijke gevolgen van de inbreuk, bedoeld in het eerste lid;

      d. een beschrijving van de voorgestelde of uitgevoerde maatregelen om de inbreuk, bedoeld in het eerste lid, te
      beëindigen en, in voorkomend geval, de maatregelen ter beperking van de eventuele nadelige gevolgen ervan.

      3 Voor zover het niet mogelijk is de informatie, bedoeld in het tweede lid, gelijktijdig te verstrekken, kan deze
      zonder onnodige vertraging in stappen worden verstrekt.

      4 De verwerkingsverantwoordelijke deelt een inbreuk op de beveiliging met betrekking tot justitiële gegevens, die
      zijn doorgezonden door of aan een verwerkingsverantwoordelijke van een andere lidstaat, zonder onnodige vertraging
      mee aan de verwerkingsverantwoordelijke van deze lidstaat.

      5 De verwerkingsverantwoordelijke deelt een inbreuk op de beveiliging mede aan de betrokkene als deze inbreuk
      waarschijnlijk een hoog risico voor de rechten en vrijheden van personen met zich meebrengt. De mededeling bevat
      een omschrijving van de aard van de inbreuk op de beveiliging en ten minste de informatie, bedoeld in het tweede
      lid, onderdelen b, c en d.

      6 De mededeling aan de betrokkene, bedoeld in het vijfde lid, is niet vereist wanneer:

      a. de verwerkingsverantwoordelijke passende technische en organisatorische beschermingsmaatregelen heeft getroffen
      en deze maatregelen zijn toegepast op de justitiële gegevens waarop de inbreuk, bedoeld in het eerste lid,
      betrekking heeft;

      b. de verwerkingsverantwoordelijke maatregelen heeft getroffen om ervoor te zorgen dat het hoge risico, bedoeld in
      het vijfde lid, zich waarschijnlijk niet meer zal voordoen, of

      c. de mededeling een onevenredige inspanning zou vergen. In dat geval volgt een openbare mededeling of
      vergelijkbare maatregel waarmee de betrokkenen even doeltreffend worden geïnformeerd.

      7 De mededeling aan de betrokkene kan worden uitgesteld, beperkt of achterwege gelaten vanwege de gronden, bedoeld
      in [artikel 21, tweede lid][ref1].

      8 De melding door een verwerkingsverantwoordelijke aan een betrokkene van een inbreuk op de beveiliging, geschiedt
      kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel21
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '21'
        afdeling: '3'
  - number: 26h
    text: |-
      1 De Autoriteit persoonsgegevens wordt door de verwerkingsverantwoordelijke of de verwerker geraadpleegd over de
      voorgenomen verwerking van justitiële gegevens, die in een nieuw gegevensbestand zullen worden opgenomen, wanneer:

      a. de aard van de verwerking, in het bijzonder met gebruikmaking van nieuwe technologieën, mechanismen of
      procedures, een hoog risico voor de rechten en vrijheden van de betrokkene met zich meebrengt;

      b. uit een gegevensbeschermingseffectbeoordeling, bedoeld in artikel 7b, blijkt dat de verwerking een hoog risico
      zou opleveren als de verwerkingsverantwoordelijke geen maatregelen treft om het risico te beperken.

      2 De Autoriteit persoonsgegevens kan een lijst opstellen van de verwerkingen waarvoor raadpleging, overeenkomstig
      het eerste lid, vereist is.

      3 De verwerkingsverantwoordelijke verstrekt de Autoriteit persoonsgegevens de
      gegevensbeschermingseffectbeoordeling, bedoeld in [artikel 7b][ref1], en, desgevraagd alle andere informatie op
      grond waarvan de Autoriteit persoonsgegevens de conformiteit van de verwerking en met name de risico’s voor de
      bescherming van persoonsgegevens van de betrokkene en de betrokken waarborgen kan beoordelen.

      4 Wanneer de Autoriteit persoonsgegevens van oordeel is dat de voorgenomen verwerking van justitiële gegevens,
      bedoeld in het eerste lid, niet voldoet aan het bij of krachtens deze wet bepaalde, geeft zij binnen een termijn
      van ten hoogste zes weken schriftelijk advies aan de verwerkingsverantwoordelijke en, in voorkomend geval, aan de
      verwerker. De advisering geschiedt kosteloos.

      5 De termijn, bedoeld in het vierde lid, kan, rekening houdend met de complexiteit van de voorgenomen verwerking,
      worden verlengd met een maand. In dit geval wordt de verwerkingsverantwoordelijke en, in voorkomend geval, de
      verwerker, binnen een maand na de ontvangst van het verzoek in kennis gesteld van de verlenging en de redenen
      daarvoor.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel7b
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel26h
    references:
