  - number: '14'
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang en voor bijzondere doeleinden,
      kan Onze Minister in bijzondere gevallen toestemming geven tot het verstrekken van daartoe omschreven justitiële
      gegevens overeenkomstig door hem te geven voorschriften en onder door hem te stellen voorwaarden. Van zijn
      desbetreffend besluit zendt hij een afschrift aan de Autoriteit persoonsgegevens.

      2 Tenzij Onze Minister anders bepaalt, worden de justitiële gegevens die zijn verstrekt niet voor een ander doel
      gebruikt dan waarvoor zij zijn verstrekt.

      3 Onze Minister kan voorschriften geven in verband met de verwerking en verdere verwerking.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel14
  - number: '15'
    text: |-
      1 Justitiële gegevens, kunnen met het oog op de doelen waarvoor die gegevens dienen, worden verwerkt ten behoeve
      van beleidsinformatie en wetenschappelijk onderzoek en statistiek, onder de voorwaarde dat de resultaten daarvan
      geen persoonsgegevens mogen bevatten.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van justitiële gegevens ten
      behoeve van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel15
  - number: '16'
    text: |-
      1 Justitiële gegevens worden of kunnen worden ter beschikking gesteld ten behoeve van de strafrechtspleging aan de
      bevoegde autoriteit van een andere lidstaat van de Europese Unie of aan organen en instanties die zijn opgericht
      krachtens de hoofdstukken 4 en 5 van titel V van het verdrag betreffende de werking van de Europese Unie, die zijn
      belast met taken van rechtshandhaving, voor zover dat voortvloeit uit een rechtsinstrument op grond van het verdrag
      betreffende de werking van de Europese Unie.

      2 Justitiële gegevens kunnen worden ter beschikking gesteld ten behoeve van andere doelen dan de strafrechtspleging
      aan de bevoegde autoriteit van een andere lidstaat van de Europese Unie.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld over het ter beschikking stellen van justitiële
      gegevens, bedoeld in het eerste en tweede lid, alsmede over de aan het gebruik daarvan te stellen voorwaarden
      door ontvangstgerechtigde bevoegde autoriteiten of internationale organen en instanties. Onverminderd specifieke
      voorzieningen in een rechtsinstrument, bedoeld in het eerste en tweede lid, mogen de voorwaarden niet afwijken van
      de voorwaarden voor vergelijkbare doorzendingen van politiegegevens binnen het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel16
  - number: 16a
    text: |-
      1 Justitiële gegevens kunnen met inachtneming van het bij of krachtens deze wet bepaalde worden doorgegeven aan
      rechterlijke ambtenaren dan wel aan andere bevoegde autoriteiten in een derde land of aan een internationale
      organisatie, voor zover dit noodzakelijk is ten behoeve van de strafrechtspleging, en indien de Commissie van de
      Europese Unie heeft besloten dat het derde land of de internationale organisatie een toereikend beschermingsniveau
      voor de voorgenomen gegevensverwerking verzekert.

      2 Bij ontstentenis van een besluit van de Commissie, bedoeld in het eerste lid, kunnen justitiële gegevens worden
      doorgegeven, indien:

      a. in een juridisch bindend instrument passende waarborgen voor de bescherming van persoonsgegevens zijn geboden,
      of

      b. de verwerkingsverantwoordelijke na beoordeling van alle omstandigheden heeft geconcludeerd dat het betreffende
      derde land of de ontvangende internationale organisatie passende waarborgen biedt voor de bescherming van
      persoonsgegevensverwerking. De verwerkingsverantwoordelijke informeert de Autoriteit persoonsgegevens over de
      categorieën van doorgifte op grond van dit onderdeel.

      3 Bij ontstentenis van een besluit van de Commissie, bedoeld in het eerste lid, of van passende waarborgen, bedoeld
      in het tweede lid, is een doorgifte of een categorie van doorgiften van justitiële gegevens aan een derde land of
      internationale organisatie slechts toegelaten indien de doorgifte noodzakelijk is:

      a. om een vitaal belang van de betrokkene of van een ander persoon te beschermen;

      b. om de gerechtvaardigde belangen van de betrokkene te beschermen, wanneer het recht van de lidstaat van waaruit
      de doorgifte van justitiële gegevens plaatsvindt aldus bepaalt;

      c. om een onmiddellijk en ernstig gevaar voor de openbare veiligheid van een lidstaat of derde land te voorkomen;

      d. in afzonderlijke gevallen met het oog op de strafrechtspleging;

      e. in afzonderlijke gevallen is met het oog op het instellen, uitoefenen of verdedigen van rechtsvorderingen met
      het oog op de strafrechtspleging,

      en de grondrechten en fundamentele vrijheden van de betrokkene niet prevaleren boven het algemeen belang van de
      doorgifte, bedoeld in de onderdelen d en e.

      4 In afwijking van het eerste, tweede en derde lid en onverminderd een internationale overeenkomst tussen lidstaten
      en derde landen, kunnen in afzonderlijke en specifieke gevallen justitiële gegevens worden doorgegeven aan een
      ontvanger in een derde land, zonder tussenkomst van een bevoegde autoriteit in dat land, indien de doorgifte strikt
      noodzakelijk is voor de strafrechtspleging en indien aan de volgende voorwaarden is voldaan:

      a. de doorgifte is strikt noodzakelijk voor de uitvoering van een in het Unierecht of het lidstatelijke recht
      omschreven taak van de bevoegde autoriteit die de doorgifte doet, ter verwezenlijking van de doeleinden van artikel
      1, eerste lid, van de richtlijn;

      b. de bevoegde autoriteit die de doorgifte doet, bepaalt dat er geen grondrechten en fundamentele vrijheden van de
      betrokkene zijn die zwaarder wegen dan het openbaar belang dat de doorgifte in dat specifieke geval noodzakelijk
      maakt;

      c. de bevoegde autoriteit die de doorgifte doet, is van mening dat de doorgifte aan een autoriteit die in het
      derde land bevoegd is voor de in artikel 1, eerste lid, van de richtlijn, bedoelde doeleinden, ondoeltreffend of
      ongeschikt is, met name omdat de doorgifte niet tijdig kan worden bewerkstelligd;

      d. de autoriteit die in het derde land bevoegd is voor de in artikel 1, eerste lid, van de richtlijn, bedoelde
      doeleinden wordt zonder onnodige vertraging op de hoogte gebracht, tenzij dit ondoeltreffend of ongeschikt is;

      e. de bevoegde autoriteit die de doorgifte doet, licht de ontvanger in over het nader bepaalde doel of de nader
      bepaalde doeleinden waarvoor de persoonsgegevens bij uitsluiting door laatstgenoemde mogen worden verwerkt, op
      voorwaarde dat een dergelijke verwerking noodzakelijk is.

      5 Indien een doorgifte als bedoeld in het eerste, tweede of derde lid justitiële gegevens betreft die van een
      andere lidstaat afkomstig zijn, is onverminderd deze leden toestemming van de bevoegde autoriteit uit die lidstaat
      voor doorgifte vereist, tenzij doorgifte noodzakelijk is met het oog op het voorkomen van een onmiddellijk en
      ernstig gevaar voor de openbare veiligheid van een lidstaat of derde land of voor de fundamentele belangen van een
      lidstaat. De voor het geven van voorafgaande toestemming verantwoordelijke autoriteit wordt onverwijld in kennis
      gesteld.

      6 Justitiële gegevens kunnen door een derde land of internationale organisatie verder worden doorgegeven aan een
      ander derde land of een andere internationale organisatie, indien de verwerkingsverantwoordelijke die deze gegevens
      oorspronkelijk had doorgegeven toestemming verleent voor die verdere doorgifte, na alle relevante factoren naar
      behoren in aanmerking te hebben genomen, waaronder de ernst van het strafbare feit, het doel waarvoor de gegevens
      oorspronkelijk waren doorgegeven en het niveau van gegevensbescherming in het derde land of de internationale
      organisatie waaraan de persoonsgegevens verder worden doorgegeven.

      7 Bij algemene maatregel van bestuur worden nadere regels gesteld over de doorgifte van justitiële gegevens,
      bedoeld in het eerste tot en met derde en zesde lid, alsmede over de aan het gebruik daarvan te stellen voorwaarden
      door ontvangstgerechtigde autoriteiten of internationale organen, en over de ontvangst van justitiële gegevens
      vanuit derde landen.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel16a
