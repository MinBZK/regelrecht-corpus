  - number: '39'
    text: |-
      1 Voor het in behandeling nemen van een aanvraag tot afgifte van een verklaring omtrent het gedrag kunnen de
      burgemeester en Onze Minister een vergoeding van kosten verlangen.

      2 De kostenvergoedingen zijn niet hoger dan een bij of krachtens algemene maatregel van bestuur vast te stellen
      bedrag.

      3 Voorzover de aanvragen zijn ingediend bij de burgemeester, zijn de gemeenten ter zake van de afgifte van de
      verklaring door Onze Minister een bij ministeriële regeling vastgestelde vergoeding verschuldigd aan Onze Minister.

      4 Bij ministeriële regeling worden regels vastgesteld met betrekking tot de wijze van afdracht van de vergoeding,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel39
  - number: 39a
    text: |-
      1 Het College van procureurs-generaal is verwerkingsverantwoordelijke voor het verwerken van strafvorderlijke
      gegevens.

      2 Het hoofd van een arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale
      verwerking openbaar ministerie of het ressortsparket voert het beheer over de strafvorderlijke gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel39a
  - number: 39b
    text: |-
      1 Het College van procureurs-generaal verwerkt slechts strafvorderlijke gegevens, indien dit noodzakelijk is voor
      een goede vervulling van de taak van het openbaar ministerie of het nakomen van een andere wettelijke verplichting.

      2 De verwerkingsverantwoordelijke maakt in voorkomend geval en voor zover mogelijk een duidelijk onderscheid tussen
      strafvorderlijke gegevens betreffende verschillende categorieën van betrokkenen, zoals:

      a. personen ten aanzien van wie gegronde vermoedens bestaan dat zij een strafbaar feit hebben gepleegd of zullen
      plegen;

      b. slachtoffers van een strafbaar feit, of personen ten aanzien van wie op basis van bepaalde feiten wordt vermoed
      dat zij slachtoffer kunnen worden van een strafbaar feit;

      c. derden, zoals getuigen of personen die anderszins informatie kunnen verstrekken over strafbare feiten, of
      personen die contact hebben of banden onderhouden met één van de personen als bedoeld onder a of d;

      d. personen die voor een strafbaar feit zijn veroordeeld.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel39b
  - number: 39c
    text: |-
      1 De [artikelen 3][ref1], [7][ref2], [7a][ref3], [7b][ref4], [7d tot en met 7f][ref5], zijn van overeenkomstige
      toepassing, met dien verstande dat daar waar in deze artikelen wordt gesproken over «Onze Minister» «het College
      van procureurs-generaal» wordt gelezen.

      2 Strafvorderlijke gegevens worden slechts verwerkt, voorzover dit behoorlijk en rechtmatig is en de gegevens,
      gelet op de doeleinden waarvoor zij worden verwerkt, toereikend, ter zake dienend en niet bovenmatig zijn.

      3 De verwerking van strafvorderlijke gegevens waaruit ras, etnische afkomst, politieke opvattingen, religieuze
      of levensbeschouwelijke overtuiging, of het lidmaatschap van een vakbond blijkt, en de verwerking van genetische
      gegevens, biometrische gegevens met het oog op de unieke identificatie van een natuurlijke persoon, of gegevens
      over gezondheid, seksuele leven en seksuele gerichtheid vindt slechts plaats voor zover dit voor het doel van de
      verwerking onvermijdelijk is, in aanvulling op de verwerking van andere strafvorderlijke gegevens betreffende de
      persoon en de gegevens afdoende zijn beveiligd

      4 Een besluit uitsluitend gebaseerd op geautomatiseerde verwerking als bedoeld in [artikel 7e, eerste lid][ref6],
      wordt niet gebaseerd op de categorieën van strafvorderlijke gegevens, bedoeld in het derde lid,
      tenzij de Autoriteit persoonsgegevens over de voorgenomen verwerking is geraadpleegd, overeenkomstig
      [artikel 26h, eerste lid][ref7].

      5 Profilering die leidt tot discriminatie van personen is verboden.


