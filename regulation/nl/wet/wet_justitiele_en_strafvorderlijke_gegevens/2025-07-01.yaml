  - number: 39f
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal, onverminderd [artikel 39e][ref1], aan personen of instanties voor de volgende doeleinden strafvorderlijke
      gegevens verstrekken:

      a. het voorkomen en opsporen van strafbare feiten,

      b. het handhaven van de orde en veiligheid,

      c. het uitoefenen van toezicht op het naleven van regelgeving,

      d. het nemen van een bestuursrechtelijke beslissing,

      e. het beoordelen van de noodzaak tot het treffen van een rechtspositionele of tuchtrechtelijke maatregel,

      f. het verlenen van hulp aan slachtoffers en anderen die bij een strafbaar feit betrokken zijn, of

      g. het verrichten van een privaatrechtelijke rechtshandeling door een persoon of instantie die met een publieke
      taak is belast.

      2 Het College van procureurs-generaal kan slechts strafvorderlijke gegevens aan personen of instanties als bedoeld
      in het eerste lid verstrekken, voorzover die gegevens voor die personen of instanties:

      a. noodzakelijk zijn met het oog op een zwaarwegend algemeen belang of de vaststelling, de uitoefening of de
      verdediging van een recht in rechte, en

      b. in zodanige vorm worden verstrekt dat herleiding tot andere personen dan betrokkene, redelijkerwijs wordt
      voorkomen.

      3 [Artikel 9, eerste lid, tweede volzin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel9
