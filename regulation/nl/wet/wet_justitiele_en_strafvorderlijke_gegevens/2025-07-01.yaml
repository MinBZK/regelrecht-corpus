preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is nieuwe regels met betrekking tot het verwerken
    van justitiële gegevens en het stellen van regels met betrekking tot de verwerking van justitiële gegevens in
    persoonsdossiers en de verklaring omtrent het gedrag vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. justitiële gegevens: bij algemene maatregel van bestuur te omschrijven persoonsgegevens of gegevens over een
      rechtspersoon inzake de toepassing van het strafrecht of de strafvordering, die in een gegevensbestand zijn of
      worden verwerkt;

      b. strafvorderlijke gegevens: persoonsgegevens of gegevens over een rechtspersoon die zijn verkregen in het kader
      van een strafvorderlijk onderzoek en die het openbaar ministerie in een strafdossier of langs geautomatiseerde weg
      in een gegevensbestand verwerkt;

      c. persoonsdossier: een gestructureerd dossier waarin zijn opgenomen de aan rechterlijke autoriteiten uitgebrachte
      rapporten over onderzoeken naar het gedrag of de levensomstandigheden van een natuurlijk persoon in verband
      met tegen hem aanhangige strafzaken, de tenuitvoerlegging van aan hem opgelegde straffen of maatregelen of zijn
      reclassering;

      d. tenuitvoerleggingsgegevens: persoonsgegevens of gegevens over een rechtspersoon inzake de tenuitvoerlegging van
      strafrechtelijke beslissingen, die in een dossier of een ander gegevensbestand zijn of worden verwerkt;

      e. gerechtelijke strafgegevens: persoonsgegevens of gegevens over een rechtspersoon die zijn verkregen in het
      kader van het behandelen en beslissen van zaken waarop het Nederlandse strafrecht van toepassing is en die in een
      gegevensbestand zijn of worden verwerkt;

      f. rechtspersoon: een rechtspersoon als bedoeld in [boek 2 van het Burgerlijk Wetboek][ref1], alsmede de daarmee
      gelijkgestelde organisaties als bedoeld in [artikel 51, derde lid, van het Wetboek van Strafrecht][ref2];

      g. justitiële documentatie: een samenhangende verzameling van op verschillende personen betrekking hebbende
      justitiële gegevens die langs geautomatiseerde weg wordt gevoerd;

      h. documentatie persoonsdossiers: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsdossiers die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van
      die gegevens systematisch is aangelegd;

      i. persoonsgegeven: alle informatie over een geïdentificeerde of identificeerbare natuurlijke persoon;

      j. betrokkene: degene op wie een justitieel, strafvorderlijk, gerechtelijk strafgegeven of een
      tenuitvoerleggingsgegeven betrekking heeft, of van wie persoonsgegevens in een persoonsdossier zijn verwerkt;

      k. verwerkingsverantwoordelijke: dit is voor:

      1°. justitiële gegevens en rapporten in een persoonsdossier: Onze Minister;

      2°. strafvorderlijke gegevens: het College van procureurs-generaal;

      3°. tenuitvoerleggingsgegevens: Onze Minister dan wel, uitsluitend in de gevallen dat dit uit de
      verantwoordelijkheid voor de uitvoering van een specifieke wettelijke taak volgt, het College van procureurs-
      generaal;

      4°. gerechtelijke strafgegevens: de gerechten, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref3];

      l. verwerker: de natuurlijke persoon of rechtspersoon, overheidsinstantie, dienst of een ander orgaan die of
      dat ten behoeve van de verwerkingsverantwoordelijke justitiële of strafvorderlijke gegevens, gerechtelijke
      strafgegevens, tenuitvoerleggingsgegevens of persoonsgegevens uit een persoonsdossier, verwerkt. Indien een
      verwerker in strijd met het bij of krachtens deze wet bepaalde de doeleinden en middelen van de verwerking bepaalt,
      wordt die verwerker met betrekking tot die verwerking als verwerkingsverantwoordelijke aangemerkt;

      m. verwerking: elke bewerking of elk geheel van bewerkingen met betrekking tot justitiële of strafvorderlijke
      gegevens, gerechtelijke strafgegevens, tenuitvoerleggingsgegevens of rapporten, of afschriften daarvan, die
      zijn of worden opgenomen in een persoonsdossier, al dan niet uitgevoerd via geautomatiseerde procedés, zoals het
      verzamelen, vastleggen, ordenen, structureren, opslaan, bijwerken of wijzigen, opvragen, raadplegen, gebruiken,
      verstrekken door middel van doorzending, verspreiden of op andere wijze ter beschikking stellen, samenbrengen, met
      elkaar in verband brengen, afschermen, of vernietigen van deze gegevens, rapporten of afschriften daarvan;

      n. afschermen: het markeren van opgeslagen justitiële of strafvorderlijke gegevens, gerechtelijke strafgegevens,
      tenuitvoerleggingsgegevens of persoonsgegevens met als doel de verwerking ervan in de toekomst te beperken;

      o. gegevensbestand: justitiële documentatie, persoonsdossiers, documentatie persoonsdossiers en elk
      ander gestructureerd geheel van justitiële of strafvorderlijke gegevens, gerechtelijke strafgegevens of
      tenuitvoerleggingsgegevens dat volgens bepaalde criteria toegankelijk is, ongeacht of dit geheel van gegevens
      gecentraliseerd of gedecentraliseerd is, dan wel verspreid op een functioneel of geografisch bepaalde wijze;

      p. inbreuk op de beveiliging: een inbreuk op de beveiliging met de vernietiging, het verlies, de
      wijziging, de bekendmaking of de ter beschikkingstelling van of de ongeoorloofde toegang tot doorgezonden,
      opgeslagen of anderszins verwerkte justitiële of strafvorderlijke gegevens, gerechtelijke strafgegevens,
      tenuitvoerleggingsgegevens of rapporten in persoonsdossiers, tot gevolg;

      q. genetische gegevens: persoonsgegevens met betrekking tot de overgeërfde of verworven genetische kenmerken van
      een natuurlijke persoon die unieke informatie verschaffen over de fysiologie of de gezondheid van die persoon en
      die met name voorkomen uit een analyse van een biologisch monster van die persoon;

      r. biometrische gegevens: persoonsgegevens die het resultaat zijn van een specifieke technische verwerking met
      betrekking tot de fysieke, fysiologische, of gedragskenmerken van een natuurlijke persoon op grond waarvan de
      eenduidige identificatie van die persoon mogelijk is of bevestigd wordt, zoals afbeeldingen van het gezicht of
      dactyloscopische gegevens;

      s. gegevens over gezondheid: persoonsgegevens met betrekking tot de fysieke of mentale gezondheid van een
      natuurlijke persoon, waaronder gegevens over verleende gezondheidsdiensten, waarmee informatie over zijn gezondheid
      wordt gegeven;

      t. profilering: elke vorm van geautomatiseerde verwerking van persoonsgegevens waarbij aan de hand van die
      gegevens bepaalde persoonlijke aspecten van een natuurlijke persoon worden geëvalueerd, met de bedoeling met name
      aspecten betreffende zijn beroepsprestaties, economische situatie, gezondheid, persoonlijke voorkeuren, interesses,
      betrouwbaarheid, gedrag, locatie of verplaatsingen te analyseren of te voorspellen;

      u. ontvanger: de natuurlijke persoon aan wie of rechtspersoon of overheidsinstantie waaraan justitiële of
      strafvorderlijke gegevens, gerechtelijke strafgegevens, tenuitvoerleggingsgegevens of afschriften van rapporten uit
      persoonsdossiers, worden verstrekt;

      v. bevoegde autoriteit: de overheidsinstantie die bevoegd is voor of ieder ander orgaan of iedere andere entiteit
      met openbaar gezag of openbare bevoegdheden ter voorkoming van, het onderzoek naar, de opsporing van of de
      vervolging van strafbare feiten, of voor de tenuitvoerlegging van straffen of maatregelen;

      w. derde land: ieder land of gebied dat geen lidstaat is of daarvan geen uitmaakt;

      x. internationale organisatie: een organisatie en de daaronder ressorterende internationaalpubliekrechtelijke
      organen of andere organen die zijn opgericht bij of op grond van een overeenkomst tussen twee of meer landen;

      y. Onze Minister: Onze Minister van Veiligheid en Justitie;

      z. Autoriteit persoonsgegevens: de autoriteit, bedoeld in
      [artikel 6 van de Uitvoeringswet algemene verordening gegevensbescherming][ref4];

      aa. lidstaat: lidstaat van de Europese Unie die de richtlijn heeft geïmplementeerd;

      ab. richtlijn: richtlijn (EU) 2016/680 van het Europees Parlement en de Raad van 27 april 2016 betreffende
      de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens door bevoegde
      autoriteiten met het oog op de voorkoming, het onderzoek, de opsporing en de vervolging van strafbare feiten of
      de tenuitvoerlegging van straffen, en betreffende het vrije verkeer van die gegevens en tot intrekking van het
      Kaderbesluit 2008/977/JBZ van de Raad;

      ac. centrale autoriteit: de centrale autoriteit, bedoeld in artikel 3, eerste lid, van het kaderbesluit 2009/315/
      JBZ van de Raad van de Europese Unie van 26 februari 2009 betreffende de organisatie en de inhoud van uitwisseling
      van gegevens uit het strafregister tussen de lidstaten (PbEU L 93/23);

      ad. Ecris-TCN: Het Europees strafregisterinformatiesysteem-derdelanders, bedoeld in artikel 4, eerste lid, van
      [Verordening (EU) 2019/816](32716R2019).


