  - number: 51e
    text: |-
      De gerechten, bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1], verwerken slechts
      gerechtelijke strafgegevens voor zover dit noodzakelijk is voor de rechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 51f
    text: |-
      1 De [artikelen 3][ref1], [7][ref2], [7a][ref3], [7b][ref4], [7d tot en met 7f][ref5], [15][ref6], [16][ref7],
      [16a][ref8], [17a][ref9], [17b][ref10] en [20 tot en met 25][ref11], zijn van overeenkomstige toepassing op
      gerechtelijke strafgegevens.

      2 Bij de overeenkomstige toepassing van de artikelen, bedoeld in het eerste lid, wordt
      in de artikelen waar over «Onze Minister» wordt gesproken «een gerecht als bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref12]» gelezen.

      3 De betrokkene heeft het recht om op diens schriftelijke verzoek binnen vier weken van een gerecht als bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref13] uitsluitsel te krijgen over de al dan niet verwerking
      van hem betreffende gerechtelijke strafgegevens en, wanneer dat het geval is, om die gerechtelijke strafgegevens
      in te zien en hierover de informatie, bedoeld in [artikel 18, onderdelen a tot en met g][ref14], te verkrijgen.
      Het gerecht doet daarbij geen mededelingen in schriftelijke vorm over de verwerking van de betrokkene betreffende
      gerechtelijke strafgegevens, tenzij het gerecht weigert een mededeling te doen. Een gehele of gedeeltelijke
      afwijzing vindt schriftelijk plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel3
