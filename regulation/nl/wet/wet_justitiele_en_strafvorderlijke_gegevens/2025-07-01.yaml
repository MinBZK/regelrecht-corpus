  - number: '41'
    text: |-
      1 Een rapport in een persoonsdossier wordt verwijderd na verloop van tien jaren. De termijn vangt aan op de dag van
      sluiting van het rapport.

      2 Indien de straf of maatregel de duur van tien jaren te boven gaat, is de termijn, bedoeld in het eerste lid,
      gelijk aan de duur van de aan de betrokken persoon in de strafzaak waarop het rapport betrekking heeft, opgelegde
      vrijheidsstraf of vrijheidsbenemende maatregel krachtens het strafrecht.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel41
  - number: '42'
    text: |-
      1 Onze Minister kan afschriften van de in een persoonsdossier opgenomen rapporten gebruiken ten behoeve van de
      behandeling van een gratieverzoek of met het oog op het onderzoek, bedoeld in [artikel 28][ref1].

      2 Onze Minister verstrekt ten behoeve van een goede rechtspleging, de vervolging en berechting van strafbare
      feiten, de tenuitvoerlegging van straffen of maatregelen en het geven van advies over een gratieverzoek desgevraagd
      afschriften van de in een persoonsdossier opgenomen rapporten aan Nederlandse rechterlijke ambtenaren.

      3 Onze Minister verstrekt ten behoeve van de selectie of bejegening desgevraagd afschriften van de in een
      persoonsdossier opgenomen rapporten aan de selectiefunctionarissen en de hoofden van de inrichtingen waar de aan
      een persoon opgelegde straf of maatregel wordt ten uitvoer gelegd.

      4 Onze Minister verstrekt ten behoeve van het voorbereiden van enig rapport of het uitoefenen van enig toezicht
      desgevraagd afschriften van de in een persoonsdossier opgenomen rapporten aan:

      a. de directeuren van de stichting en de reclasseringsinstellingen, bedoeld in
      [artikel 1, onder b en c van de Reclasseringsregeling 1995][ref2];

      b. de reclasseringswerkers, bedoeld in [artikel 6, eerste lid, van de Reclasseringsregeling 1995][ref3];

      c. de directeur of ressortsdirecteur van de raad voor de kinderbescherming.

      5 Bij algemene maatregel van bestuur kunnen andere personen of instanties worden aangewezen aan wie ten behoeve
      van een juiste toepassing van het strafrecht afschriften van rapporten uit een persoonsdossier kunnen worden
      verstrekt. Daarbij kan tevens worden bepaald van welke rapporten afschriften worden verstrekt. Tevens kunnen nadere
      voorschriften worden gegeven in verband met de verstrekking.

      6 [Artikel 15][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007120#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007120#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel15
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel42
