  - number: 17a
    text: |-
      Onze Minister maakt ten minste de volgende informatie toegankelijk voor de betrokkene:

      a. de identiteit en contactgegevens van de verwerkingsverantwoordelijke en, in voorkomend geval, van de
      functionaris voor gegevensbescherming;

      b. de doelen van de verwerking waarvoor de justitiële gegevens zijn bestemd;

      c. het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;

      d. de rechten van de betrokkene, bedoeld in de [artikelen 18][ref1] en [22, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
