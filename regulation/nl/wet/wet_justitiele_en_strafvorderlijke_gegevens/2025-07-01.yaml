  - number: '32'
    text: |-
      1 De aanvraag tot het afgeven van een verklaring omtrent het gedrag van een natuurlijk persoon bevat de voornamen
      en de geboortedatum van de aanvrager, alsmede een omschrijving van het doel, waarvoor de afgifte van de verklaring
      wordt gevraagd.

      2 Indien de aanvraag betrekking heeft op een rechtspersoon, bevat zij de naam van de rechtspersoon en
      het inschrijvingsnummer van de Kamer van Koophandel, of, indien geen inschrijving heeft plaatsgevonden in
      het handelsregister, de naam, de rechtsvorm en de statutaire, of bij ontstentenis daarvan, de feitelijke
      vestigingsplaats van deze rechtspersoon alsmede de naam, het adres en de geboortedatum van ieder van de
      bestuurders, vennoten, maten of beheerders en de naam van degene die de aanvraag doet.

      3 Bij de aanvraag doet degene te wiens behoeve de verklaring wordt verzocht opgave van het risico voor de
      samenleving dat in het geding is.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel32
  - number: '33'
    text: |-
      De aanvraag wordt ingediend door degene omtrent wiens gedrag een verklaring wordt gevraagd of door een
      vertegenwoordiger van de rechtspersoon omtrent wiens gedrag een verklaring wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel33
  - number: '34'
    text: |-
      1 Onze Minister neemt de aanvraag niet in behandeling, indien een onderzoek naar het gedrag van de aanvrager
      kennelijk niet noodzakelijk is om, gelet op het doel van de aanvraag, een risico voor de samenleving te beperken.

      2 Onze Minister stelt de burgemeester, bedoeld in [artikel 30, eerste lid][ref1], terstond in kennis van de
      beslissing tot het niet in behandeling nemen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
        afdeling: '5'
  - number: '35'
    text: |-
      1 Onze Minister weigert de afgifte van een verklaring omtrent het gedrag, indien in de justitiële documentatie
      met betrekking tot de aanvrager een strafbaar feit is vermeld, dat, indien herhaald, gelet op het risico voor de
      samenleving en de overige omstandigheden van het geval, aan het doel waarvoor de verklaring omtrent het gedrag
      wordt gevraagd, in de weg zal staan.

      2 Indien de aanvraag betrekking heeft op een rechtspersoon betrekt Onze Minister mede in zijn oordeel de justitiële
      gegevens met betrekking tot strafbare feiten op naam van de rechtspersoon en van ieder van de bestuurders,
      vennoten, maten of beheerders van die rechtspersoon alsmede de gegevens met betrekking tot strafbare feiten waaraan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref1] ten grondslag heeft gelegen.

      3 Onze Minister betrekt niet in zijn oordeel de justitiële gegevens met betrekking tot de strafbare feiten die zijn
      afgedaan met een onherroepelijke vrijspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 35a
    text: |-
      1 Onverminderd [artikel 35][ref1] weigert Onze Minister de afgifte van een verklaring omtrent het gedrag voor bij
      ministeriële regeling aangewezen functies die een hoge mate van integriteit vereisen indien politiegegevens met
      betrekking tot de aanvrager blijk geven van verbanden tussen de aanvrager en strafbare feiten die zouden zijn of
      zullen worden gepleegd en die, gelet op de omstandigheden van het geval en het doel waarvoor de verklaring omtrent
      het gedrag wordt gevraagd, een risico vormen voor de uitoefening van de functie. Bij de beoordeling van de aanvraag
      wordt rekening gehouden met de aard, frequentie, actualiteit en onderlinge samenhang van de politiegegevens.

      2 Voor aanwijzing bij ministeriële regeling komen functies in aanmerking waarin sprake is van:

      a. een bevoegdheid geweld te gebruiken;

      b. toegang tot gevoelige informatie bij de uitvoering van wettelijke taken op het terrein van openbare orde en
      veiligheid of handhaving van de rechtsorde;

      c. integriteitsbeoordelingen door het openbaar bestuur.

      3 De politiegegevens, bedoeld in het eerste lid, betreffen uitsluitend politiegegevens die worden
      verwerkt overeenkomstig de [artikelen 8][ref2], [9][ref3], [10, eerste lid, onderdelen a en c][ref4], en
      [13 van de Wet politiegegevens][ref5].

      4 Er is een Adviescommissie VOG-Politiegegevens. De commissie heeft tot taak de kwaliteit van de besluiten over
      aanvragen voor een verklaring omtrent gedrag, bedoeld in het eerste lid, en de zorgvuldigheid waarmee deze tot
      stand komen, te beoordelen. De commissie rapporteert aan Onze Minister en brengt jaarlijks een verslag uit.

      5 Een ministeriële regeling als bedoeld in het eerste lid wordt niet eerder vastgesteld dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel13
