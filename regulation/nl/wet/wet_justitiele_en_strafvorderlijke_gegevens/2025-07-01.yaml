  - number: '7'
    text: |-
      1 De verwerkingsverantwoordelijke en de verwerker treffen passende technische en organisatorische maatregelen om:

      a. te waarborgen en te kunnen aantonen dat de verwerking van justitiële gegevens wordt verricht in overeenstemming
      met hetgeen bij of krachtens deze wet is bepaald;

      b. het gegevensbeschermingsbeleid en de gegevensbeschermingsbeginselen op een doeltreffende manier uit te voeren
      respectievelijk toe te passen;

      c. bij de bepaling van de verwerkingsmiddelen en de verwerking zelf de nodige waarborgen in de verwerking in te
      bouwen ter naleving van hetgeen bij of krachtens deze wet is bepaald en ter bescherming van de rechten van de
      betrokkenen.

      2 De verwerkingsverantwoordelijke en de verwerker treffen passende en organisatorische maatregelen om een
      beveiligingsniveau te waarborgen dat op het risico is afgestemd.

      3 Bij het treffen van de maatregelen, bedoeld in het eerste en tweede lid, houden de verwerkingsverantwoordelijke
      en de verwerker rekening met de aard, de reikwijdte, de context en de doeleinden van de verwerking, alsmede met de
      qua waarschijnlijkheid en ernst uiteenlopende risico’s voor de rechten en vrijheden van natuurlijke personen.

      4 In aanvulling op het derde lid houden de verwerkingsverantwoordelijke en de verwerker ten aanzien van het eerste
      lid, onder c, rekening met de stand van de techniek en de uitvoeringskosten.

      5 De maatregelen, bedoeld in het eerste en tweede lid, worden periodiek geëvalueerd en zo nodig geactualiseerd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de maatregelen, bedoeld in het
      eerste en tweede lid.

      7 Toegang tot justitiële gegevens is uitsluitend voorbehouden aan personen die onder het beheer van de
      verwerkingsverantwoordelijke voor die gegevens ressorteren of op grond van zijn instructie, behoudens een bij of
      krachtens de wet gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7
  - number: 7a
    text: |-
      1 De verwerkingsverantwoordelijke treft passende technische en organisatorische maatregelen om te waarborgen dat
      standaard:

      a. alleen die justitiële gegevens worden verwerkt die noodzakelijk zijn voor elk specifiek doel van de verwerking,
      en

      b. justitiële gegevens niet zonder tussenkomst van een natuurlijke persoon voor een onbeperkt aantal natuurlijke
      personen toegankelijk wordt gemaakt.

      2 De maatregelen, bedoeld in het eerste lid, onder a, betreffen in ieder geval de hoeveelheid verzamelde justitiële
      gegevens, de mate waarin zij worden verwerkt, de periode van opslag en de toegankelijkheid van de justitiële
      gegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7a
  - number: 7b
    text: |-
      1 Wanneer een soort verwerking, in het bijzonder een verwerking waarbij nieuwe technologieën worden gebruikt, gelet
      op de aard, de omvang, de context of doelen ervan, waarschijnlijk een hoog risico voor de rechten en vrijheden van
      personen oplevert, voert de verwerkingsverantwoordelijke voorafgaand aan de verwerking een beoordeling uit van het
      effect van de voorgenomen verwerkingsactiviteiten op de bescherming van persoonsgegevens.

      2 De beoordeling bevat ten minste:

      a. een algemene beschrijving van de beoogde verwerkingen;

      b. een beoordeling van de risico’s voor de rechten en vrijheden van betrokkenen;

      c. de beoogde maatregelen ter beperking van de risico’s;

      d. de voorzorgs- en beveiligingsmaatregelen en mechanismen om de justitiële gegevens te beschermen en aan te tonen
      dat aan het bij of krachtens deze wet bepaalde is voldaan, met inachtneming van de rechten en gerechtvaardigde
      belangen van de betrokkenen en andere betrokken personen.

      3 Indien nodig verricht de verwerkingsverantwoordelijke een toetsing om te beoordelen of de verwerking
      overeenkomstig de gegevensbeschermingseffectbeoordeling wordt uitgevoerd, zulks ten minste wanneer sprake is van
      een toename van het risico dat de verwerkingen inhouden.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7b
  - number: 7c
    text: |-
      De verwerkingsverantwoordelijke maakt in voorkomend geval en voor zover mogelijk een duidelijk onderscheid tussen
      justitiële gegevens betreffende verschillende categorieën van betrokkenen, zoals:

      a. personen die terzake van een strafbaar feit zijn veroordeeld;

      b. personen die terzake van een strafbaar feit zijn ontslagen van rechtsvervolging;

      c. personen die terzake van een strafbaar feit zijn vrijgesproken.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7c
  - number: 7d
    text: |-
      1 Indien Onze Minister justitiële gegevens te zijnen behoeve laat verwerken door een verwerker maakt hij
      uitsluitend gebruik van een verwerker die afdoende garandeert dat de passende technische en organisatorische
      maatregelen en procedures zodanig worden geïmplementeerd dat bij de verwerking wordt voldaan aan het bij of
      krachtens deze wet bepaalde en de rechten van de betrokkene worden gewaarborgd.

      2 De uitvoering van verwerkingen door een verwerker wordt geregeld in een schriftelijke overeenkomst of andere
      rechtshandeling die de verwerker aan de verwerkingsverantwoordelijke bindt. Bij of krachtens algemene maatregel van
      bestuur worden nadere regels gesteld over de inhoud van de overeenkomst of rechtshandeling.

      3 De verwerker en eenieder die onder het gezag van Onze Minister of van de verwerker staat verwerkt de justitiële
      gegevens uitsluitend met inachtneming van de instructies van Onze Minister, tenzij hij bij of krachtens wet of een
      ieder verbindend besluit van Europese Unie tot die verwerking verplicht is.

      4 De verwerker schakelt geen andere verwerker in dan na voorafgaande schriftelijke toestemming van de
      verwerkingsverantwoordelijke. In het geval van een algemene schriftelijke toestemming informeert de verwerker
      de verwerkingsverantwoordelijke over de toevoeging of vervanging van andere verwerkers, met de mogelijkheid van
      bezwaar door de verwerkingsverantwoordelijke.

      5 De verwerker stelt de verwerkingsverantwoordelijke zonder onredelijke vertraging in kennis van een inbreuk op de
      bescherming van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7d
  - number: 7e
    text: |-
      1 Een besluit dat uitsluitend is gebaseerd op geautomatiseerde verwerking, met inbegrip van profilering, dat
      voor de betrokkene nadelige rechtsgevolgen heeft of hem in aanmerkelijke mate treft en waarin justitiële gegevens
      zijn verwerkt, is verboden, tenzij wordt voorzien in voorafgaande menselijke tussenkomst door of namens de
      verwerkingsverantwoordelijke en in specifieke voorlichting aan de betrokkene.

      2 Profilering die leidt tot discriminatie van personen is verboden.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7e
  - number: 7f
    text: |-
      1 Indien iemand schade lijdt doordat ten opzichte van hem in strijd wordt gehandeld met de bij of krachtens deze
      wet gegeven voorschriften zijn de volgende leden van toepassing, onverminderd de aanspraken op grond van andere
      wettelijke regels.

      2 Voor nadeel dat niet in vermogensschade bestaat, heeft de benadeelde recht op een naar billijkheid vast te
      stellen schadevergoeding.

      3 De verwerkingsverantwoordelijke is aansprakelijk voor de schade of het nadeel, voortvloeiende uit het niet-
      nakomen van de in het eerste lid bedoelde voorschriften. De verwerker is aansprakelijk voor die schade of dat
      nadeel, voor zover ontstaan door zijn werkzaamheid.

      4 De verwerkingsverantwoordelijke of de verwerker kan geheel of gedeeltelijk worden ontheven van deze
      aansprakelijkheid, indien hij bewijst dat de schade hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel7f
  - number: '8'
    text: |-
      1 Ten behoeve van de rechtspleging worden justitiële gegevens verstrekt aan Nederlandse rechterlijke ambtenaren.

      2 Ten behoeve van de strafrechtspleging worden justitiële gegevens verstrekt aan Onze Minister.

      3 Aan lichamen of personen aan wie krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] de
      bevoegdheid is toegekend een strafbeschikking uit te vaardigen, worden ten behoeve van de uitoefening van die
      bevoegdheid justitiële gegevens verstrekt met betrekking tot de delicten waarop hun bevoegdheid betrekking heeft.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking of doorgifte van justitiële
      gegevens, bedoeld in het eerste, tweede en derde lid, alsmede over de daarbij te stellen voorwaarden aan het
      gebruik daarvan door ontvangstgerechtigde autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
