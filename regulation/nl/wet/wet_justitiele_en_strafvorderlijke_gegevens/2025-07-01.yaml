      Justitiële gegevens van verdachten en veroordeelden wegens overtredingen worden vernietigd:

      a. vijf jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref1] en [352 van het Wetboek van Strafvordering][ref2] is gedaan in verband met een overtreding en
      in het kader van de overtreding de justitiële gegevens zijn verwerkt of een strafbeschikking wegens een overtreding
      volledig ten uitvoer is gelegd,

      b. tien jaar nadat een beslissing om niet te vervolgen is genomen, nadat een einduitspraak als bedoeld in de
      [artikelen 351][ref3] en [352 van het Wetboek van Strafvordering][ref4] is gedaan in verband met een overtreding en
      in het kader van de overtreding de justitiële gegevens zijn verwerkt of een strafbeschikking wegens een overtreding
      volledig ten uitvoer is gelegd, en daarbij een vrijheidsstraf, vervangende hechtenis daaronder niet begrepen, of
      een taakstraf is opgelegd, dan wel aan een rechtspersoon een geldboete van de derde categorie of hoger is opgelegd,

      c. twee jaar na het overlijden van betrokkene, of

      d. na het vervallen van het recht tot strafvordering door verjaring.


