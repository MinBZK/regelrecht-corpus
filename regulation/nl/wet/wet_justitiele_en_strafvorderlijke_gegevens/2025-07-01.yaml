        afdeling: '2'
  - number: 42b
    text: |-
      1 Onze Minister maakt ten minste de volgende informatie toegankelijk voor betrokkene:

      a. de identiteit en contactgegevens van de verwerkingsverantwoordelijke en, in voorkomend geval, van de
      functionaris voor gegevensbescherming;

      b. de doelen van de verwerking waarvoor de verwerking van de betrokkene betreffende rapporten in persoonsdossiers
      zijn bestemd;

      c. het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;

      d. de rechten van betrokkene, bedoeld in de [artikelen 43, eerste lid][ref1], en [46, eerste lid][ref2].

      2 [Artikel 17b][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel17b
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel42b
