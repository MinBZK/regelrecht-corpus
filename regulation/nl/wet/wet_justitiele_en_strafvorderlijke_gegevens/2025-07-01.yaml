  - number: 39fb
    text: |-
      Indien het openbaar ministerie deelneemt aan een casusoverleg als bedoeld in de
      [Wet gegevensverwerking persoonsgerichte aanpak radicalisering en terroristische activiteiten][ref1], worden aan
      het casusoverleg strafvorderlijke gegevens verstrekt, voor zover dat noodzakelijk is met het oog op het doel van
      het casusoverleg, tenzij naar het oordeel van de verwerkingsverantwoordelijke zwaarwegende redenen zich daartegen
      verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0050740
