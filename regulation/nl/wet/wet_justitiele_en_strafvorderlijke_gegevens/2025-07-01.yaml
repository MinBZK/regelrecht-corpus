  - number: '36'
    text: |-
      1 Onze Minister kan bij zijn onderzoek met betrekking tot de afgifte van de verklaring omtrent het gedrag van
      een natuurlijk persoon kennis nemen van op de aanvrager betrekking hebbende justitiële gegevens alsmede van
      politiegegevens als bedoeld in [artikel 1, onder a, van de Wet politiegegevens][ref1], met uitzondering van de
      gegevens waarover op grond van [artikel 21, eerste lid, onderdeel e][ref2], geen mededeling kan worden gedaan aan
      de verzoeker, die gebruik maakt van zijn recht, als bedoeld in [artikel 18][ref3].

      2 Tenzij bij wettelijk voorschrift anders is bepaald, kan Onze Minister bij zijn onderzoek met betrekking
      tot de afgifte van de verklaring omtrent het gedrag van een rechtspersoon kennis nemen van op de
      betrokkenen, bedoeld in artikel 35, betrekking hebbende justitiële gegevens, politiegegevens, als bedoeld
      in [artikel 1, onder a, van de Wet politiegegevens][ref4], alsmede gegevens uit de registratie, bedoeld in
      [artikel 1, onder b, van de Wet controle op rechtspersonen][ref5]. De uitzondering, bedoeld in het eerste lid, is
      van toepassing.

      3 Voorzover dat voor een goede oordeelsvorming noodzakelijk is, kan Onze Minister inlichtingen
      omtrent betrokkene inwinnen bij het openbaar ministerie en bij instellingen die op grond van
      [artikel 4, eerste lid, van de Reclasseringsregeling 1995][ref6] bevoegd zijn om reclasseringswerkzaamheden te
      verrichten.

      4 De justitiële gegevens en de politiegegevens die zijn verstrekt worden niet voor een ander doel gebruikt dan
      waarvoor zij zijn verstrekt.


