  - number: '46'
    text: |-
      1 Degene aan wie overeenkomstig [artikel 43][ref1] uitsluitsel is gegeven van hem betreffende rapporten, heeft het
      recht op diens schriftelijke verzoek van Onze Minister rectificatie van de hem betreffende persoonsgegevens in deze
      rapporten te verkrijgen, en rekening houdend met het doel van de verwerking onvolledige persoonsgegevens te laten
      aanvullen. Het verzoek bevat de aan te brengen wijzigingen.

      2 De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke zonder onnodige
      vertraging vernietiging van de hem betreffende persoonsgegevens in persoonsdossiers te verkrijgen, indien de
      gegevens in strijd met een wettelijk voorschrift worden verwerkt of een wettelijk voorschrift tot vernietiging
      verplicht.

      3 In plaats van vernietiging draagt de verwerkingsverantwoordelijke zorg voor het afschermen van rapporten uit een
      persoonsdossier als:

      a. de juistheid van die rapporten door de betrokkene wordt betwist en de juistheid of onjuistheid niet kan worden
      geverifieerd, in welk geval de verwerkingsverantwoordelijke de betrokkene informeert voordat de afscherming wordt
      opgeheven, of

      b. de persoonsgegevens moeten worden bewaard als bewijsmateriaal.

      4 De verwerkingsverantwoordelijke stelt de betrokkene binnen vier weken schriftelijk in kennis met betrekking tot
      de opvolging van zijn verzoek.

      5 [Artikel 22, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel46
