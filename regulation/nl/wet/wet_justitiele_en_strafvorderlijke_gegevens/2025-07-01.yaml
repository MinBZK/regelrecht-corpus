  - number: 39e
    text: |-
      1 Voorzover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, kan het College van procureurs-
      generaal aan de volgende personen of instanties strafvorderlijke gegevens verstrekken:

      a. Nederlandse rechterlijke ambtenaren;

      b. Onze Minister;

      c. lichamen of personen aan wie krachtens [artikel 257ba van het Wetboek van Strafvordering][ref1] de bevoegdheid
      is toegekend een strafbeschikking uit te vaardigen;

      d. ambtenaren van politie als bedoeld in [artikel 2, onder a, van de Politiewet 2012][ref2] en ambtenaren
      van politie als bedoeld in artikel 2, onder c en d, voor zover zij zijn aangesteld voor de uitvoering van de
      politietaak;

      e. ambtenaren als bedoeld in [artikel 141, onderdeel c en d, van het Wetboek van Strafvordering][ref3];

      f. buitengewone opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref4];

      g. instanties die belast zijn met de tenuitvoerlegging van rechterlijke beslissingen of handelingen, beslissingen
      van de officier van justitie dan wel van vrijheidsbenemende straffen of maatregelen;

      h. verwerkingsverantwoordelijken voor de verwerking van politiegegevens als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet politiegegevens][ref5];

      i. bewaarders als bedoeld in [artikel 118, eerste en tweede lid, van het Wetboek van Strafvordering][ref6].

      2 Het College van procureurs-generaal verstrekt aan de ambtenaren die werkzaam zijn ten behoeve van de justitiële
      documentatie strafvorderlijke gegevens.

      3 Het College van procureurs-generaal kan strafvorderlijke gegevens verstrekken aan Onze
      Minister van Buitenlandse Zaken ten behoeve van het versturen van notificaties als bedoeld in
      [artikel 5c van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref7].

      4 Het College van procureurs-generaal verstrekt strafvorderlijke gegevens aan de geneesheer-
      directeur en de psychiater, bedoeld in de [artikelen 5:4][ref8], [7:1][ref9], [7:11][ref10] en
      [8:19 van de Wet verplichte geestelijke gezondheidszorg][ref11], voor zover dit voortvloeit uit de verplichtingen
      van de officier van justitie op grond van die artikelen.

      5 Het College van procureurs-generaal verstrekt strafvorderlijke gegevens aan het CIZ, genoemd in
      __REF000___________________________________________________________________________________________________________
      __, en aan de arts die de medische verklaring, bedoeld in artikel 28a, tweede lid, onderdeel b, van die wet,
      vaststelt, voor zover dit voortvloeit uit de in dat artikel bedoelde verplichtingen van de officier van justitie.

      6 [Artikel 9, eerste lid, tweede volzin][ref13] is van overeenkomstige toepassing.


