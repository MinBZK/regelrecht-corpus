  - number: 17b
    text: |-
      1 Onze Minister verstrekt aan een betrokkene informatie over de verwerking van justitiële gegevens in een beknopte
      en toegankelijke vorm en in duidelijke en eenvoudige taal. De informatie wordt met passende middelen, waaronder
      elektronische, verstrekt en in het algemeen in dezelfde vorm als de vorm van het verzoek.

      2 Indien de betrokkene verzoekt om een overzicht, op grond van [artikel 18][ref1], of rectificatie, bedoeld
      in [artikel 22, eerste en tweede lid][ref2], wordt hij schriftelijk in kennis gesteld van de ontvangst van het
      verzoek, de termijn voor uitsluitsel en de mogelijkheid om naar aanleiding daarvan een klacht in te dienen bij de
      Autoriteit persoonsgegevens.

      3 In specifieke gevallen stelt Onze Minister de volgende informatie ter beschikking aan de betrokkene:

      a. de rechtsgrondslag van de verwerking;

      b. de bewaartermijn van de justitiële gegevens;

      c. in voorkomend geval, de categorieën van de ontvangers van de justitiële gegevens;

      d. indien noodzakelijk, extra informatie, in het bijzonder wanneer de justitiële gegevens zonder medeweten van de
      betrokkene worden verzameld;

      e. het bestaan van geautomatiseerde besluitvorming, met inbegrip van de in [artikel 7e, eerste lid][ref3] bedoelde
      profilering, en nuttige informatie over de onderliggende logica, alsmede het belang en de verwachte gevolgen van
      die verwerking voor de betrokkene.

      4 De verwerkingsverantwoordelijke kan de verstrekking van informatie, als bedoeld in het derde lid, uitstellen,
      beperken of achterwege laten voor zover dit een noodzakelijke en evenredige maatregel is in verband met een belang,
      bedoeld in [artikel 21, tweede lid, onderdelen a tot en met e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel7e
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel21
