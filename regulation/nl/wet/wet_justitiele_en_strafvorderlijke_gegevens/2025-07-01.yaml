        artikel: '49'
  - number: '51'
    text: |-
      1 De [artikelen 26a tot en met 26h][ref1] en [27, eerste en tweede lid][ref2], zijn van overeenkomstige toepassing
      op persoonsgegevens in persoonsdossiers.

      2 De [artikelen 35a][ref3], [35b][ref4] en [35d, van de Wet politiegegevens][ref5] zijn van overeenkomstige
      toepassing persoonsgegevens in persoonsdossiers.

      3 De Autoriteit persoonsgegevens is bevoegd:

      a. de verwerkingsverantwoordelijke of de verwerker te waarschuwen dat met de voorgenomen verwerkingen
      waarschijnlijk een inbreuk wordt gemaakt op het bij of krachtens deze wet bepaalde;

      b. een last onder bestuursdwang op te leggen ter handhaving van het bij of krachtens deze wet bepaalde;

      c. een bestuurlijke boete op te leggen indien de verwerkingsverantwoordelijke handelt in strijd met hetgeen is
      bepaald bij of krachtens:

        - de [artikelen 40, derde lid][ref6], voor wat betreft de overeenkomstige toepassing van de
      [artikelen 7][ref7], [7a][ref8], [7b][ref9] en [7d][ref10] in dat lid, en [51, eerste lid][ref11], voor
      wat betreft de overeenkomstige toepassing van de [artikelen 26c][ref12], [26f][ref13], [26g][ref14]
      en [26h][ref15] in dat lid, van ten hoogste het bedrag van de geldboete van de vijfde categorie van
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref16];
        - de [artikelen 40, derde lid][ref17], voor wat betreft de overeenkomstige toepassing van [artikel 7e][ref18] in
      dat lid, [42b][ref19], [43][ref20], [46][ref21], en [48][ref22], van ten hoogste het bedrag van de geldboete van de
      zesde categorie van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref23];

      d. een advies te verstrekken aan de verwerkingsverantwoordelijke naar aanleiding van een voorafgaande raadpleging,
      bedoeld in [artikel 26h][ref24], over een voorgenomen verwerking van persoonsgegevens in een persoonsdossier;

      e. de verwerkingsverantwoordelijke te verplichten een inbreuk in verband met persoonsgegevens te melden aan de
      betrokkene.

      4 [Artikel 27, vijfde lid][ref25], is van overeenkomstige toepassing.

      5 De werking van de beschikking tot oplegging van de bestuurlijke boete, bedoeld in het derde lid, onder c, wordt
      opgeschort totdat de bezwaar- of beroepstermijn is verstreken of, indien bezwaar is gemaakt respectievelijk beroep
      is ingesteld, op het bezwaar respectievelijk het beroep is beslist.

      6 De bevoegdheden, bedoeld in het derde lid, onderdelen d en e, gelden als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref26].


