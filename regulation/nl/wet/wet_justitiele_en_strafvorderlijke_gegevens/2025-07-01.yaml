    text: |-
      Indien het openbaar ministerie deelneemt aan een samenwerkingsverband als bedoeld in de
      [Wet gegevensverwerking door samenwerkingsverbanden][ref1], worden aan het samenwerkingsverband strafvorderlijke
      gegevens verstrekt, voor zover dit noodzakelijk is voor het doel van dat verband, tenzij naar het oordeel van de
      verwerkingsverantwoordelijke zwaarwegende redenen zich daartegen verzetten. Bij algemene maatregel van bestuur
      kunnen voorwaarden en beperkingen worden gesteld aan de verstrekkingen op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0049962
    url: https://wetten.overheid.nl/BWBR0014194/2025-07-01#Artikel39fa
