      1 Bij de behandeling van een verzoek als bedoeld in [artikel 39i, eerste lid][ref1], draagt het College van
      procureurs-generaal zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker. Wanneer het College
      van procureurs-generaal redenen heeft om te twijfelen aan de identiteit van de persoon die het verzoek doet, kan
      hij de nodige aanvullende informatie vragen ter bevestiging van de identiteit van de betrokkene.

      2 [Artikel 20, tweede tot en met vierde lid][ref2], is van toepassing.


