  - number: '44'
    text: |-
      1 Elke verstrekking van afschriften van rapporten uit persoonsdossiers, overeenkomstig [artikel 41][ref1] wordt
      vastgelegd en tenminste vier jaar bewaard.

      2 Indien een verzoek als bedoeld in [artikel 43][ref2] zich uitstrekt tot het verkrijgen van informatie over
      de verstrekking van afschriften uit persoonsdossiers, deelt Onze Minister binnen vier weken aan verzoeker mede
      of hem betreffende afschriften van rapporten uit de persoonsdossiers in het jaar voorafgaande aan het verzoek
      overeenkomstig [artikel 42][ref3] en [42a][ref4] zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel42a
