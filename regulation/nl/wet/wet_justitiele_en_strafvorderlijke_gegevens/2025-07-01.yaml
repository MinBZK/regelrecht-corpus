  - number: 39i
    text: |-
      1 De betrokkene heeft het recht om op diens schriftelijke verzoek van het College van procureurs-generaal
      uitsluitsel te krijgen over de al dan niet verwerking van hem betreffende strafvorderlijke gegevens en, wanneer dat
      het geval is, om die strafvorderlijke gegevens in te zien en om de volgende informatie te verkrijgen:

      a. de doelen en de rechtsgrond van de verwerking;

      b. de betrokken categorie van de gegevens;

      c. de vraag of de deze persoon betreffende strafvorderlijke gegevens gedurende een periode van vier jaar
      voorafgaande aan het verzoek overeenkomstig de [artikelen 39e][ref1], [39f][ref2] en [39ga][ref3] zijn verstrekt en
      over de ontvangers of categorieën van ontvangers aan wie de gegevens zijn verstrekt, met name ontvangers in derde
      landen of internationale organisaties;

      d. de voorziene periode van opslag of indien dat niet mogelijk is, de criteria om die termijn te bepalen;

      e. het recht te verzoeken om verbetering, vernietiging of beperking van de verwerking van hem betreffende
      persoonsgegevens;

      f. het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;

      g. de herkomst, voor zover beschikbaar, van de verwerking van hem betreffende strafvorderlijke gegevens.

      2 Het College van procureurs-generaal geeft op een verzoek als bedoeld in het eerste lid, binnen zes weken
      uitsluitsel, met uitzondering van het deel van het verzoek om inlichtingen, bedoeld in het eerste lid, onderdeel
      c. Het College van procureurs-generaal kan zijn beslissing voor ten hoogste vier weken verdagen, dan wel voor ten
      hoogste zes weken indien blijkt dat bij verschillende parketten strafvorderlijke gegevens over de verzoeker worden
      verwerkt. Van de verdaging wordt schriftelijk mededeling gedaan.

      3 Op het deel van een verzoek om inlichtingen, bedoeld in het eerste lid, onderdeel c, geeft het College van
      procureurs-generaal binnen vier weken uitsluitsel.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39e
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel39f
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel39ga
