preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen;

    Gelet op de artikelen 3.33, tweede lid, 3.37, eerste lid, 3.38 en 3.42b, zesde lid, van de Wet inkomstenbelasting
    2001;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#ArtikelAanhef
articles:
  - number: '1'
    text: In deze regeling wordt verstaan onder *wet:* Wet inkomstenbelasting 2001.
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel1
  - number: '2'
    text: |-
      Als filminvesteringen als bedoeld in artikel 3.33 van de wet worden aangewezen: films die primair zijn bestemd
      voor vertoning in bioscopen, noch reclamefilms noch voorlichtingsfilms betreffend, aan de voortbrenging waarvan een
      projectvoorstel ten grondslag ligt dat bestaat uit de volgende onderdelen:

      a. de totale productiebegroting die niet meer bedraagt dan € 15.000.000; indien de productiebegroting meer bedraagt
      dan € 2.500.000 wordt een kopie van de principe-overeenkomst met de completion-guarantor voor de oplevering van de
      film overgelegd;

      b. het financieringsplan;

      c. het verkoop- en exploitatieplan waaruit onder meer blijkt dat de opbrengstgaranties ten minste 25% van de kosten
      zoals opgenomen in de productiebegroting bedragen;

      d. het marketing- en promotieplan;

      e. het scenario en de synopsis;

      f. ten minste een optie op de verfilmingsrechten.
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel2
  - number: '3'
    text: |-
      1 Willekeurige afschrijving op filminvesteringen is alleen van toepassing indien door de Minister van Economische
      Zaken een verklaring als bedoeld in artikel 3.37, eerste lid, van de wet is afgegeven.

      2 De Minister van Economische Zaken geeft op een door of namens de belastingplichtige gedaan verzoek een verklaring
      af als bedoeld in het eerste lid indien de filminvesteringen voldoen aan de eisen, genoemd in [artikel 2][ref1].

      3 Indien artikel VI, eerste lid, aanhef en onderdeel a, van de wet van 14 december 2001 tot wijziging van
      belastingwetten c.a. (Belastingplan 2002 II - Economische infrastructuur) (Stb. 2001, 641) van toepassing is, wordt
      de in het eerste lid bedoelde verklaring geacht te zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013875#Artikel2
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013875
        artikel: '2'
  - number: '4'
    text: |-
      1 De Minister van Economische Zaken geeft op een door of namens de belastingplichtige gedaan verzoek een verklaring
      af als bedoeld in artikel 3.42b, eerste lid, van de wet indien de filminvesteringen voldoen aan de eisen,
      genoemd in [artikel 2][ref1], en toekenning van de filminvesteringsaftrek terzake past binnen het hiervoor in de
      rijksbegroting opgenomen bedrag.

      2 De verklaring, bedoeld in het eerste lid, wordt afgegeven onder de voorwaarde dat binnen 5 maanden na afgifte van
      de verklaring de met de belastingdienst gesloten vaststellingsovereenkomst ter zake van de filminvesteringen aan
      Senter te Zwolle is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013875#Artikel2
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013875
        artikel: '2'
  - number: '5'
    text: |-
      1 Het formulier voor het indienen van een verzoek om een verklaring als bedoeld in de [artikelen 3][ref1] en
      [4][ref2] wordt vastgesteld overeenkomstig de bij deze regeling behorende bijlage.

      2 Het aanvraagformulier dient volledig en juist te worden ingevuld en vergezeld van de gevraagde bijlagen
      schriftelijk te worden ingediend bij Senter te Zwolle.

      3 De verzoeken worden in volgorde van ontvangst behandeld met dien verstande dat, indien de belastingplichtige of
      zijn gemachtigde niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van het verzoek
      en met toepassing van artikel 4.5 van de Algemene wet bestuursrecht de gelegenheid heeft gehad het verzoek aan te
      vullen, de dag waarop het verzoek voldoet aan de wettelijke voorschriften met betrekking tot de behandeling als
      datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0013875#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013875#Artikel4
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel5
    references:
