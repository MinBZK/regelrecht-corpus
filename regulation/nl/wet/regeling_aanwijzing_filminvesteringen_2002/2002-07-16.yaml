        artikel: '4'
  - number: '6'
    text: |-
      1 De in de [artikelen 3][ref1] en [4][ref2] bedoelde verklaringen kunnen worden ingetrokken indien de te harer
      verkrijging verstrekte gegevens of bescheiden zodanig onjuist of onvolledig zijn geweest dat op het verzoek een
      andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens en bescheiden volledig
      bekend zouden zijn geweest en de onjuistheid of onvolledigheid van de gegevens of bescheiden de Minister van
      Economische Zaken niet bekend was of redelijkerwijs niet bekend had kunnen zijn.

      2 De in [artikel 4][ref3] bedoelde verklaring wordt ingetrokken indien niet binnen 5 maanden na afgifte van de
      verklaring de met de belastingdienst gesloten vaststellingsovereenkomst ter zake van de filminvesteringen aan
      Senter te Zwolle is overgelegd.

      3 De bevoegdheid tot het intrekken van een verklaring vervalt door verloop van vijf jaren na de dagtekening van
      de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013875#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013875#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013875#Artikel4
