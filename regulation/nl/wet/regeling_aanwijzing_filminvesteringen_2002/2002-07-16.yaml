  - number: '9'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop artikel I, onderdelen A en F, en artikel VI
      (overgangsbepaling in verband met artikel I, onderdeel F) van de wet van 14 december 2001 tot wijziging van
      belastingwetten c.a. (Belastingplan 2002 II - Economische infrastructuur) (Stb. 2001, 641) in werking treden.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst, met uitzondering van de bijlage, die ter
      inzage wordt gelegd. Van deze terinzagelegging zal mededeling worden gedaan in de Staatscourant .
    url: https://wetten.overheid.nl/BWBR0013875/2002-07-16#Artikel9
