  - number: '4'
    text: |-
      1 De hoogte van de eenmalige vergoeding bedraagt de uitkomst van de volgende formule:

      (Nieuw – Oud + V) x 0,65 + R

      hierbij staat:

      Nieuw voor het totaalbedrag van de WIA-uitkering, met uitzondering van de vakantiebijslag, dat de persoon, bedoeld
      in [artikel 2][ref1], zou hebben genoten gedurende de periode, bedoeld in het tweede of derde lid, als de onjuiste
      berekening van de hoogte van de WIA-uitkering, bedoeld in artikel 2, niet had plaatsgevonden;

      Oud voor het totaalbedrag van de WIA-uitkering, met uitzondering van de vakantiebijslag, dat de persoon, bedoeld in
      [artikel 2][ref2], heeft genoten gedurende de periode, bedoeld in het tweede of derde lid;

      V voor 0,08 x (Nieuw – Oud);

      R voor 0,125 x (Nieuw – Oud + V).

      2 De periode waarover de hoogte van de eenmalige vergoeding wordt berekend is:

      a. voor de persoon, bedoeld in [artikel 2, onderdelen a en b][ref3], de periode van 1 januari 2020 tot en met de
      dag voorafgaand aan de eerste dag van de maand waarin de beschikking tot herziening rechtsgevolg heeft;

      b. voor de persoon, bedoeld in [artikel 2, onderdeel c][ref4], de periode van 29 november 2023 tot en met de dag
      voorafgaand aan de eerste dag van de maand waarin de beschikking tot herziening rechtsgevolg heeft;

      c. voor de persoon, bedoeld in [artikel 2, onderdeel d][ref5], de periode van 30 juli 2024 tot en met de dag
      voorafgaand aan de eerste dag van de maand waarin de beschikking tot herziening rechtsgevolg heeft.

      3 Als het recht op de WIA-uitkering is beëindigd voorafgaand aan de vaststelling van het recht op de vergoeding, is
      in afwijking van het tweede lid, de periode waarover de hoogte van de eenmalige vergoeding wordt berekend:

      a. voor de persoon bedoeld in [artikel 2, onderdelen a, c of d][ref6], een periode van maximaal vijf jaar
      voorafgaand aan de datum waarop het recht op de WIA-uitkering is beëindigd;

      b. voor de persoon, bedoeld in [artikel 2, onderdeel b][ref7], voor wie het recht op de WIA-uitkering is
      beëindigd op of na 1 januari 2020, een periode van maximaal vijf jaar voorafgaand aan de datum waarop het recht op
      de WIA-uitkering is beëindigd.

      4 Als meerdere onderdelen van [artikel 2][ref8] voor een persoon van toepassing zijn, is de periode waarover de
      hoogte van de vergoeding wordt berekend, de ruimste periode die voor die persoon op grond van het tweede of derde
      lid van toepassing is.


