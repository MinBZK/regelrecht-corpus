  - number: '3'
    text: |-
      1 Geen recht op een eenmalige vergoeding heeft de persoon, bedoeld in [artikel 2, onderdeel a][ref1], als
      door het UWV is vastgesteld dat de hoogte van de WIA-uitkering onjuist is berekend als gevolg van een te hoge
      vaststelling van het dagloon en artikel 2, onderdeel b, c of d, niet van toepassing is.

      2 Geen recht op een eenmalige vergoeding heeft de persoon, bedoeld in [artikel 2, onderdeel b][ref2], wiens WIA-
      uitkering is beëindigd voor 1 januari 2020.

      3 Geen recht op een eenmalige vergoeding heeft de persoon wiens WIA-uitkering met terugwerkende kracht is herzien
      wegens een van de in [artikel 2][ref3] bedoelde situaties.

      4 Het derde lid is niet van toepassing als het UWV heeft vastgesteld dat de herziening met terugwerkende kracht
      heeft geleid tot een onjuiste berekening van de hoogte van de WIA-uitkering als bedoeld in [artikel 2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0052927#Artikel2
