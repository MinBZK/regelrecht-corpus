articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      - *beschikking tot herziening:* beschikking waarin het UWV heeft vastgesteld dat de hoogte van de WIA-uitkering
      onjuist is berekend, als bedoeld in [artikel 2][ref1];
      - *dagloon:* het dagloon, bedoeld in [artikel 13 van de Wet werk en inkomen naar arbeidsvermogen][ref2];
      - *loon:* loon als bedoeld in [artikel 14 van het Dagloonbesluit werknemersverzekeringen][ref3];
      - *loonloos tijdvak:* kalendermaand in de referteperiode waarin de werknemer geen loon heeft genoten als bedoeld in
      [artikel 5, vijfde lid, van het Dagloonbesluit werknemersverzekeringen][ref4];
      - *minister:* Minister van Sociale Zaken en Werkgelegenheid;
      - *referteperiode:* referteperiode voor de dagloonvaststelling van een WIA-uitkering als bedoeld in
      [artikel 13 van het Dagloonbesluit werknemersverzekeringen][ref5];
      - *UWV:* Uitvoeringsinstituut werknemersverzekeringen, genoemd in hoofdstuk 2 van de Wet structuur
      uitvoeringsorganisatie werk en inkomen;
      - *vakantiebijslag:* de vakantiebijslag, bedoeld in
      [artikel 68 van de Wet werk en inkomen naar arbeidsvermogen][ref6];
      - *WIA-uitkering:* uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref7], met uitzondering van
      de overlijdensuitkering, bedoeld in [artikel 74 van de Wet werk en inkomen naar arbeidsvermogen][ref8].


