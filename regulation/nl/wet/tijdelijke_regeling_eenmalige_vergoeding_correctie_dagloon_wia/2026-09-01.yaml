  - number: '5'
    text: >-
      1 De minister kent het recht op de eenmalige vergoeding ambtshalve toe, nadat:


      a. het UWV een beschikking tot herziening heeft genomen; en


      b. de persoon ten aanzien van wie het voornemen bestaat om het recht op de eenmalige vergoeding ambtshalve toe te
      kennen, in de gelegenheid is gesteld om te kennen te geven niet in aanmerking te willen komen voor de eenmalige
      vergoeding.


      2 De minister kent het recht op de eenmalige vergoeding niet ambtshalve toe ten aanzien van de persoon die te
      kennen heeft gegeven niet in aanmerking te willen komen voor de eenmalige vergoeding.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel5
  - number: '6'
    text: De minister betaalt de eenmalige vergoeding binnen zes weken na de toekenning daarvan uit.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel6
  - number: '7'
    text: |-
      De minister herziet beschikkingen op grond van deze regeling of trekt dergelijke beschikkingen in, als:

      a. de eenmalige vergoeding ten onrechte of tot een te hoog bedrag is toegekend;

      b. na de toekenning van de eenmalige vergoeding een herziening van de hoogte van de WIA-uitkering
      heeft plaatsgevonden vanwege een onjuiste berekening van de hoogte van de WIA-uitkering als bedoeld in
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0052927#Artikel2
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0052927
        artikel: '2'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 De eenmalige vergoeding die als gevolg van een besluit als bedoeld in [artikel 7][ref1] ten onrechte of tot
      een te hoog bedrag is toegekend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de minister
      teruggevorderd.

      2 In afwijking van het eerste lid ziet de minister af van terugvordering voor zover de onverschuldigde betaling het
      gevolg is van een handelen of nalaten van de minister, tenzij het aan de belanghebbende redelijkerwijs duidelijk
      had moeten zijn dat ten onrechte of tot een te hoog bedrag aan vergoeding werd betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0052927#Artikel7
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0052927
        artikel: '7'
        hoofdstuk: '4'
  - number: '9'
    text: >-
      De minister kan afzien van een herziening, intrekking of terugvordering als de nadelige gevolgen voor een
      belanghebbende onevenredig zijn in verhouding tot de met het besluit te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel9
  - number: '10'
    text: |-
      1 De minister verleent de voorzitter van de Raad van Bestuur van het UWV mandaat, volmacht en machtiging om, in het
      kader van de uitvoering van deze regeling:

      a. besluiten te nemen, privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een
      privaatrechtelijke rechtshandeling noch een besluit zijn;

      b. te beslissen op bezwaarschriften, met dien verstande dat de persoon die betrokken is bij het
      besluitvormingsproces ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij het
      besluitvormingsproces in eerste aanleg; en

      c. in rechte op te treden en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te
      zien van hoger beroep of cassatie.

      2 De Raad van Bestuur van het UWV is in het kader van de uitvoering van deze regeling bevoegd tot het verlenen van
      ondermandaat als bedoeld in [artikel 10:9 van de Algemene wet bestuursrecht][ref1] of het doorverlenen van zijn
      andere vertegenwoordigingsbevoegdheden aan bij het UWV werkzame functionarissen.

      3 [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref2] is van toepassing op de
      uitoefening van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens
      ondermandaat respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0024956#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:9
      - id: ref2
        bwb_id: BWBR0024956
        hoofdstuk: '4'
  - number: '11'
    text: >-
      1 De minister is de verwerkingsverantwoordelijke als bedoeld in artikel 4 van de Algemene verordening
      gegevensbescherming, voor de verwerking van persoonsgegevens op basis van deze regeling.


      2 De voorzitter van de Raad van Bestuur van het UWV is verwerker als bedoeld in artikel 28 van de Algemene
      verordening gegevensbescherming voor de verwerking van persoonsgegevens ter uitvoering van de aan hem gemandateerde
      taken.


      3 De persoonsgegevens die worden verwerkt ter uitvoering van deze regeling worden niet verder verwerkt voor andere
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel11
  - number: '12'
    text: >-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.


      2 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.


      3 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel12
  - number: '13'
    text: |-
      De minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1],
      na overleg met het UWV, maandelijks een periodiek voorschot op de rijksbijdrage, bedoeld in
      [artikel 12, derde lid][ref2], van:

      a. de geraamde vergoedingen met als valutadatum de tweeëntwintigste dag van elke maand; en

      b. de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0052927#Artikel12
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5.16'
      - id: ref2
        bwb_id: BWBR0052927
        artikel: '12'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 Het UWV brengt aan de minister inhoudelijk en financieel verslag uit over de uitvoering van deze regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2 In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      worden de baten en lasten alsmede de ontvangen voorschotten, bedoeld in [artikel 13][ref3], uitgesplitst naar de
      eenmalige vergoedingen en de uitvoeringkosten, met betrekking tot deze regeling opgenomen.

      3 Op de in het tweede lid bedoelde eenmalige vergoedingen komen in mindering de eenmalige vergoedingen die zijn
      teruggevorderd en de bedragen die anderszins zijn terugbetaald.

      4 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref4], rekent de minister de baten en
      lasten, alsmede de ontvangen voorschotten op grond van [artikel 13][ref5], met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


