  - number: '2'
    text: |-
      Recht op een eenmalige vergoeding heeft de persoon ten aanzien van wie ambtshalve, of na een aanvraag tot
      herziening van de WIA-uitkering die is ingediend voor 1 september 2028, door het UWV is vastgesteld dat de hoogte
      van de WIA-uitkering onjuist is berekend door:

      a. een onjuiste toepassing van [hoofdstuk 3][ref1], [3a][ref2] en
      [4 van het Dagloonbesluit werknemersverzekeringen][ref3], of een onjuiste toepassing van
      [artikel 33a, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], als het recht op de
      WIA-uitkering van die persoon is ontstaan in de periode van 1 januari 2020 tot en met 31 december 2024;

      b. een onjuiste indexering van het dagloon als bedoeld in [artikel 14 van de WIA][ref5], als het recht op de WIA-
      uitkering van die persoon is ontstaan in de periode van 1 juli 2006 tot en met 31 december 2022;

      c. toepassing van [artikel 33, eerste lid, van de Werkloosheidswet][ref6] waardoor een loonloos tijdvak in de
      referteperiode is ontstaan en dit een verlagend effect heeft op de hoogte van de WIA-uitkering op of na 29 november
      2023, als het recht op de WIA-uitkering van die persoon is ontstaan in de periode van 1 juli 2015 tot en met
      30 april 2026;

      d. om andere redenen dan bedoeld in onderdeel c een of meerdere loonloze tijdvakken in de referteperiode zijn
      ontstaan en dit een verlagend effect heeft op de hoogte van de WIA-uitkering op of na 30 juli 2024, als het recht
      op de WIA-uitkering van die persoon is ontstaan in de periode van 1 juli 2015 tot en met 30 april 2026;


