  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling eenmalige vergoeding correctie dagloon WIA.'
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel16
  - number: '17'
    text: >-
      1 Deze regeling treedt in werking met ingang van 1 september 2026.


      2 Deze regeling vervalt met ingang van 1 september 2031, met dien verstande dat deze regeling van toepassing blijft
      op beschikkingen die verstrekt zijn op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0052927/2026-09-01#Artikel17
