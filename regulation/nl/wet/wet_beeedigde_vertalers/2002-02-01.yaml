preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is bij de wet bepalingen vast te stellen omtrent de
    beëedigde vertalers;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Hij, die bevoegd is tot het geven van middelbaar onderwijs in een of meer vreemde talen, wordt op zijn verlangen
      door de arrondissements-regtbank zijner woonplaats als vertaler voor een of meer dier talen beëedigd, wanneer
      hij tevens voldoende blijken geeft van kennis der Nederlandsche taal, ter beoordeeling van de regtbank, en
      een getuigschrift overlegt van goed zedelijk gedrag, afgegeven door burgemeester en wethouders der gemeente of
      gemeenten waar hij gedurende de twee laatste jaren heeft gewoond.
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel1
  - number: '2'
    text: |-
      Ook anderen dan de in [art. 1][ref1] genoemde worden, op hun verlangen, door de arrondissements-regtbank hunner
      woonplaats als vertaler voor een of meer talen beëedigd, wanneer zij voldoende blijken geven van kennis van die
      taal of talen en van de Nederlandsche taal, ter beoordeeling van de regtbank, en een getuigschrift overleggen van
      goed zedelijk gedrag, afgegeven door burgemeester en wethouders der gemeente of gemeenten waar zij gedurende de
      twee laatste jaren hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0001849#Artikel1
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001849
        artikel: '1'
  - number: '3'
    text: |-
      1 Hij, die aan de vereischten van [art. 1][ref1] of [art. 2][ref2] voldoet, legt ter openbare teregtzitting van de
      regtbank den eed of de belofte af, dat hij zijne pligten als vertaler met naauwgezetheid zal vervullen.

      2 Hem wordt, na nederlegging van zijne handteekening ter griffie, eene acte uitgereikt, houdende zijne toelating
      als beëedigd vertaler voor de daarin vermelde taal of talen.


      [ref1]: https://wetten.overheid.nl/BWBR0001849#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001849#Artikel2
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001849
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001849
        artikel: '2'
  - number: '4'
    text: |-
      De legalisatie der handteekening van den beëedigden vertaler op door hem als zoodanig uitgegeven stukken geschiedt,
      indien zij vereischt of door belanghebbenden verlangd wordt, door de voorzieningenrechter van de rechtbank,
      voor welke hij den eed heeft afgelegd, of, bij verandering van woonplaats, door de voorzieningenrechter van die
      rechtbank van het arrondissement, waartoe zijne nieuwe woonplaats behoort, mits hij, met vertooning zijner acte van
      toelating, ter griffie van die rechtbank zijne handteekening heeft nedergelegd.
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel4
  - number: '5'
    text: |-
      De acte van toelating geeft de bevoegdheid om in het geheele Rijk als beëedigd vertaler op te treden voor de taal
      of talen, in de acte vermeld.
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel5
  - number: '6'
    text: |-
      1 De acte van toelating kan ten allen tijde worden herroepen door de arrondissements-regtbank der woonplaats van
      den vertaler, op grond dat hij is gebleken onbekwaam of onbetrouwbaar te zijn.

      2 Van die herroeping geschiedt openbare aankondiging in de nieuwsbladen door de zorg van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel6
  - number: '7'
    text: |-
      1 De [artikelen 5][ref1] en [6][ref2] dezer wet zijn mede van toepassing op hen, die vóór hare in werking treding
      als vertalers door eenig regterlijk collegie waren beëedigd.

      2 De legalisatie, bedoeld in [artikel 4][ref3], geschiedt door de voorzieningenrechter van de rechtbank van
      het arrondissement waarin hun woonplaats is gelegen, mits zij, met vertooning hunner acte, ter griffie van die
      rechtbank hunne handteekening hebben nedergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001849#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001849#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001849#Artikel4
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel7
    references:
      - id: ref1
