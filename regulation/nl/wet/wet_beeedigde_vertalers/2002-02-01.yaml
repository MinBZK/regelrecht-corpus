        bwb_id: BWBR0001849
        artikel: '4'
  - number: '8'
    text: |-
      1 Indien stukken of opgaven, welke ingevolge wettelijk voorschrift in openbare registers moeten worden
      ingeschreven, in eene vreemde taal zijn gesteld, wordt daarnevens de overlegging gevorderd van letterlijke
      vertalingen, vervaardigd en voor overeenstemmend verklaard door een voor die taal als bevoegd toegelaten beëedigd
      vertaler. Indien het betreft een notariële akte in de Friese taal van oprichting van een vereniging of stichting
      dan wel houdende de statuten van een dergelijk rechtspersoon, kan worden volstaan met een letterlijke vertaling
      in het Nederlands vervaardigd en voor overeenstemmend verklaard door een notaris voor wie de akte is verleden. Van
      een vertaling in het Nederlands kan worden afgezien indien de vereniging of stichting haar werkzaamheden geheel of
      nagenoeg geheel in de provincie Fryslân verricht.Wanneer een belanghebbende die de Friese taal niet machtig is een
      Nederlandse vertaling wenst van de akten van laatstgenoemde stichtingen of verenigingen, verschaft deze stichting
      of vereniging een Nederlandse vertaling die door een notaris vervaardigd en voor overeenstemmend verklaard is.

      2 De vertalingen worden ingeschreven in plaats van de in eene vreemde taal gestelde stukken of opgaven, welke aan
      het register blijven gehecht. Voorts wordt met de vertalingen gehandeld op dezelfde wijze als anders ten aanzien
      van die stukken of opgaven zou moeten geschieden.

      3 Het bepaalde in het eerste en tweede lid is van toepassing, tenzij bij de wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0001849/2002-02-01#Artikel8
