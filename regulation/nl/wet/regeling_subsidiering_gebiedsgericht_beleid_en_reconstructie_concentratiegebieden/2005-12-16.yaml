preamble:
  text: |-
    Mede gelet op artikel 33 van verordening (EG) nr. 1257/99 van de Raad van de Europese Unie van 17 mei 1999
    betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw
    (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L160);

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV subsidies;

    Gelet op artikel 15.13, eerste tot en met derde lid, van de Wet milieubeheer;

    Na overleg met de provincies;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            de ministers:

              de Minister van Landbouw, Natuur en Voedselkwaliteit, de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer en de Minister van Verkeer en Waterstaat;



            b
            DLG:

              Dienst landelijk gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c
            bestuursovereenkomst:

              bestuursovereenkomst als bedoeld in [artikel 11, eerste lid][ref1];



            d
            gebiedsplan:

              gebiedsplan als bedoeld in [artikel 10, eerste lid][ref2];



            e
            uitvoeringsprogramma behorend bij een gebiedsplan:

              uitvoeringsprogramma als bedoeld in [artikel 10, eerste lid][ref3];



            f
            plangebied:

              bij de vaststelling van een gebiedsplan begrensd gebied overeenkomstig [artikel 10, tweede lid][ref4];



            g
            reconstructieplan:

              reconstructieplan als bedoeld in [artikel 11 van de Reconstructiewet concentratiegebieden][ref5];



            h
            uitvoeringsprogramma behorend bij een reconstructieplan:

              uitvoeringsprogramma voor reconstructiegebieden als bedoeld in
      [artikel 31 van de Reconstructiewet concentratiegebieden][ref6];



            i
            reconstructiegebied:

              reconstructiegebied als bedoeld in [artikel 1 van de Reconstructiewet concentratiegebieden][ref7];



            j
            Vinac-gebied:

              uitbreidingslocatie als bedoeld in de Actualisering Vierde Nota over de Ruimtelijke Ordening Extra,
      planologische kernbeslissing.



            k
            provinciaal uitvoeringsprogramma:

              provinciaal uitvoeringsprogramma als bedoeld in [artikel 12, eerste lid][ref8];



            l
            uitvoeringscontract:

              uitvoeringscontract als bedoeld in [artikel 13][ref9];



            m
            activiteiten:

              concreet uit te voeren werken of werkzaamheden, die passen binnen een of meerdere van de categorieën,
      bedoeld in de [artikelen 16 tot en met 19][ref10];



            n

              [verordening (EG) nr. 1257/1999](31999R1257):

              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende
      steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot
      wijziging en instelling van een aantal verordeningen (PbEG L160);



            o
            probleemgebied:

              probleemgebied als bedoeld in [artikel 1, onder l, van de Subsidieregeling agrarisch natuurbeheer][ref11].


