  - number: '2'
    text: 'Op grond van deze regeling kunnen de ministers op aanvraag subsidie verstrekken in de kosten van activiteiten:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel2
  - number: 2.a
    text: |-
      die passen binnen een provinciaal uitvoeringsprogramma, een uitvoeringscontract, een gebiedsplan en
      uitvoeringsprogramma behorend bij een gebiedsplan, ter verbetering van de kwaliteit van de fysieke leefomgeving
      van plangebieden met betrekking tot landbouw, natuur, bos, landschap, openluchtrecreatie, cultuurhistorie, water of
      milieu, of;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel2
  - number: 2.b
    text: |-
      die passen binnen een provinciaal uitvoeringsprogramma, een uitvoeringscontract en een reconstructieplan en
      een uitvoeringsprogramma behorend bij een reconstructieplan, ter verbetering van de kwaliteit van de fysieke
      leefomgeving van reconstructiegebieden met betrekking tot landbouw, natuur, bos, landschap, openluchtrecreatie,
      cultuurhistorie, water of milieu.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel2
  - number: '3.1'
    text: De subsidie bedraagt maximaal 75% van de subsidiabele kosten van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie maximaal 40%, en in probleemgebieden maximaal 50%, van de
      subsidiabele kosten van de activiteiten voorzover deze investeringen in landbouwbedrijven betreffen als bedoeld in
      artikel 7 van [verordening (EG) nr. 1257/1999](31999R1257). Indien het gaat om investeringen in landbouwbedrijven
      door boeren jonger dan 40 jaar die zich als bedrijfshoofd vestigen als bedoeld in artikel 7 van [verordening (EG)
      nr. 1257/1999](31999R1257), bedragen deze percentages maximaal 45% en in de probleemgebieden maximaal 55%.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel3
  - number: '3.4'
    text: |-
      Voor plangebieden stellen gedeputeerde staten voor de afzonderlijke subcategorieën, als bedoeld in de
      [artikelen 16][ref1] tot en met 19, de subsidiepercentages vast in het uitvoeringsprogramma behorend bij een
      gebiedsplan, met als gemiddelde per uitvoeringsprogramma behorend bij een gebiedsplan maximaal 50% van de
      subsidiabele kosten van de activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel16
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '16'
        hoofdstuk: '4'
  - number: '3.5'
    text: |-
      In afwijking van het vierde lid, bedraagt het gemiddelde subsidiepecentage per uitvoeringsprogramma behorend bij
      een gebiedsplan maximaal 60% van de subsidiabele kosten van de activiteiten, voorzover het activiteiten betreft in
      VINAC-gebieden.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel3
  - number: '3.6'
    text: |-
      Voor reconstructiegebieden stellen gedeputeerde staten van de betreffende provincies voor de afzonderlijke
      subcategorieën als bedoeld in de [artikelen 16][ref1] tot en met 19 de subsidiepercentages vast in het
      uitvoeringsprogramma behorend bij een reconstructieplan, met als gemiddelde maximaal 50% van de subsidiabele kosten
      van de activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel16
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '16'
        hoofdstuk: '4'
  - number: '4'
    text: |-
      Voorzover voor dezelfde activiteiten eveneens subsidie aan particulieren wordt verstrekt door andere
      overheidsorganen en hierdoor het totaal van de overheidsbijdrage meer zou bedragen dan 90% van de subsidiabele
      kosten, of in de gevallen bedoeld in [artikel 3, tweede of derde lid][ref1], de aldaar genoemde percentages van de
      subsidiabele kosten, wordt de subsidie op grond van deze regeling zoveel lager vastgesteld dat het totaal van de
      overheidsbijdrage die 90% respectievelijk de in [artikel 3, tweede lid of derde lid][ref2], genoemde percentages
      niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel3
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012833
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Subsidie wordt niet verstrekt aan aanvragers ter voldoening aan verplichtingen die op grond van enig wettelijk
      voorschrift zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: '5.2'
    text: 'Niet subsidiabel op grond van deze regeling zijn:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.a
    text: kosten waarin uit anderen hoofde vanwege de staat een bijdrage kan worden verleend;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.b
    text: exploitatiekosten, waaronder begrepen de kosten van regulier beheer en onderhoud;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.c
    text: |-
      kosten verbonden aan het verwerven van grond of gebouwen, tenzij de kosten noodzakelijk zijn voor het aanbrengen
      van voorzieningen ten behoeve van de uitvoering van de activiteit en de kosten redelijkerwijs niet ten laste kunnen
      worden gebracht van individuele ondernemers;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.d
    text: |-
      kosten verbonden aan het toekennen van vergoedingen op grond van de [artikelen 15.20][ref1] en
      [15.21 van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 5.2.e
    text: |-
      kosten, verbonden aan het compenseren van waardeverlies van grond of gebouwen en andere kosten als gevolg van
      kapitaalsverliezen of inkomensverliezen, of tenzij de kosten zijn verbonden aan de realisatie van niet-agrarische
      doeleinden en deze kosten redelijkerwijs niet ten laste kunnen worden gebracht van individuele ondernemers;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.f
    text: accountantskosten die niet voortvloeien uit activiteiten;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.g
    text: de door de aanvrager van de subsidie verrekenbare BTW;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: 5.2.h
    text: |-
      kosten ten aanzien van de uitvoering van activiteiten, gemaakt voorafgaande aan de beschikking tot
      subsidieverlening, met uitzondering van de kosten ten aanzien van het ontwikkelen van plannen, onderzoek en
      voorlichting als bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel20
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '20'
        hoofdstuk: '4'
  - number: 5.2.i
    text: |-
      kosten van werkzaamheden die tot de reguliere taken van andere overheden of van andere rechtspersonen behoren,
      gemaakt ter uitvoering van activiteiten.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel5
  - number: '6'
    text: |-
      Indien de aanvrager door ernstige nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of
      -vaststelling heeft ingediend of anderszins onjuiste gegevens zijn verstrekt in het kader van een andere regeling
      ter uitvoering van hoofdstuk IX van [verordening (EG) nr. 1257/1999](31999R1257), of indien een verleende subsidie
      wordt ingetrokken op grond van [artikel 27, eerste lid][ref1], of een vastgestelde subsidie wordt ingetrokken
      op grond van [artikel 27, tweede lid][ref2], wordt geen subsidie verleend in het kalenderjaar waarin de onjuiste
      aanvraag is ingediend of anderszins onjuiste gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel27
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012833
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '7.1'
    text: |-
      Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening of vaststelling heeft ingediend of
      anderszins onjuiste gegevens heeft verstrekt in het kader van een andere regeling ter uitvoering van hoofdstuk
      IX van [verordening (EG) nr. 125/1999](31999R0125), of indien in geval van opzet een verleende subsidie wordt
      ingetrokken op grond van [artikel 27, eerste lid][ref1], of een vastgestelde subsidie wordt ingetrokken of
      gewijzigd op grond van [artikel 27, tweede lid][ref2], wordt tevens geen subsidie verleend in het jaar volgende op
      het kalenderjaar waarin de onjuiste aanvraag is ingediend of anderszins onjuiste gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel27
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012833
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '7.2'
    text: |-
      Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening in het kader van deze regeling heeft
      ingediend of anderszins onjuiste gegevens heeft verstrekt wordt geen subsidie verleend voor het jaar volgend op het
      kalenderjaar waarin de onjuiste aanvraag is ingediend of anderszins onjuiste gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel7
  - number: '8.1'
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit stelt, na overleg met de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en de Minister van Verkeer en Waterstaat, voor ieder begrotingsjaar voor de op
      basis van deze regeling te verstrekken subsidies een subsidieplafond vast.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel8
  - number: '8.2'
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit kan daarbij, na overleg met de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en de Minister van Verkeer en Waterstaat, voor de plangebieden of de
      reconstructiegebieden afzonderlijke subsidieplafonds vaststellen.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel8
  - number: '8.3'
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit maakt de besluiten als bedoeld in het eerste en tweede lid
      bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel8
  - number: '8.4'
    text: |-
      In enig begrotingsjaar worden anavragen alleen in behandeling genomen indien voor het betreffende begrotingsjaar
      een subsidieplafond als bedoeld in het eerste lid is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel8
  - number: '9.1'
    text: |-
      Ten behoeve van de uitvoering van [artikel 2, onder a][ref1], wijzen gedeputeerde staten van de provincies bij
      besluit gebieden aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel2
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 9.1.a
    text: die zijn gelegen binnen de gebieden zoals van rijkswege aangegeven in de bestuursovereenkomst;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
  - number: 9.1.b
    text: |-
      die uit het oogpunt van de beleidsterreinen landbouw, natuur, bos, landschap, openluchtrecreatie, cultuurhistorie,
      water en milieu waardevol en kwetsbaar zijn; en
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
  - number: 9.1.c
    text: |-
      waarin sprake is van een samenhangende en meervoudige problematiek met betrekking tot deze beleidsterreinen
      waarvoor gezocht wordt naar een integrale oplossing, met inachtneming van het rijksbeleid terzake.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
  - number: '9.2'
    text: |-
      In de reconstructiegebieden als bedoeld in [artikel 1 van de Reconstructiewet concentratiegebieden][ref1] worden
      geen gebieden aangewezen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel1
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '1'
  - number: '9.3'
    text: De aanwijzing, bedoeld in het eerste lid, behoeft de instemming van de ministers.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel9
  - number: '10.1'
    text: |-
      Gedeputeerde staten stellen voor elk gebied als bedoeld in [artikel 9, eerste lid][ref1], waar de ministers
      overeenkomstig [artikel 9, derde lid][ref2], mee hebben ingestemd, een gebiedsplan en een uitvoeringsprogramma
      behorend bij een gebiedsplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel9
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012833
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.2'
    text: 'Een gebiedsplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.2.a
    text: de begrenzing van het plangebied;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.2.b
    text: |-
      een omschrijving van de in het plangebied bestaande toestand van de beleidsterreinen, bedoeld in
      [artikel 9, eerste lid][ref1], kwalitatief en kwantitatief weergegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel9
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10.2.c
    text: |-
      een omschrijving van de gewenste ontwikkeling van het plangebied ten aanzien van de beleidsterreinen, bedoeld
      in [artikel 9, eerste lid][ref1], in de vorm van lange termijndoelstellingen, kwalitatief en waar mogelijk
      kwantitatief weergegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel9
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10.2.d
    text: een kaart die betrekking heeft op de in onderdeel c bedoelde omschrijving;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.2.e
    text: |-
      een omschrijving van de operationele doelstellingen ten aanzien van de beleidsterreinen, bedoeld in
      [artikel 9, eerste lid][ref1], voor een periode van vier jaar, kwalitatief en kwantitatief weergegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel9
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10.2.f
    text: een omschrijving van de samenhang tussen de operationele doelstellingen en de lange termijndoelstellingen;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.2.g
    text: een indicatie van de totale kosten die gemoeid zijn met de realisatie van de onder c bedoelde ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: '10.3'
    text: 'Een uitvoeringsprogramma behorend bij een gebiedsplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.3.a
    text: |-
      een zo nauwkeurig mogelijke opsomming en beschrijving van voorgenomen activiteiten voor een periode van
      vier jaar die passen binnen een of meerdere subcategorieën bedoeld in de [artikelen 16][ref1] tot en met 19,
      en een vermelding van de bij de desbetreffende subcategorieën behorende subsidiepercentages als bedoeld in
      [artikel 3, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel3
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '16'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012833
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 10.3.b
    text: |-
      een beschrijving van de mate waarin de activiteiten bijdragen aan het bereiken van de operationele doelstellingen,
      als bedoeld in [artikel 10, tweede lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel10
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 10.3.c
    text: een fasering van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: 10.3.d
    text: |-
      een zo nauwkeurig mogelijke raming van de kosten en de verdeling daarvan over een periode van vier jaar, alsmede de
      wijze van financiering daarvan, inclusief bijdragen van andere overheden en derden.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel10
  - number: '11.1'
    text: |-
      De ministers voeren tenminste eenmaal per jaar overleg met gedeputeerde staten van de provincies over de te
      bereiken beleidsdoelen en indicaties van daarvoor beschikbare middelen voor een periode van vier jaren. Het overleg
      is erop gericht overeenstemming te bereiken. Van overeenstemming wordt blijk gegeven bij bestuursovereenkomst.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel11
  - number: '11.2'
    text: |-
      De ministers voeren tenminste eenmaal per jaar met gedeputeerde staten van de provincies overleg over de
      bestuursovereenkomst en de realisatie daarvan. De ministers en de gedeputeerde staten kunnen daarbij besluiten tot
      wijziging van de te bereiken beleidsdoelen en indicaties van de daarvoor beschikbare middelen.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel11
  - number: '12.1'
    text: Met inachtneming van de bestuursovereenkomst stellen gedeputeerde staten een provinciaal uitvoeringsprogramma vast.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: '12.2'
    text: Het provinciaal uitvoeringsprogramma wordt jaarlijks vastgesteld voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: '12.3'
    text: 'Het provinciaal uitvoeringsprogramma bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: 12.3.a
    text: de gebiedsplannen en de uitvoeringsprogramma's behorend bij een gebiedsplan;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: 12.3.b
    text: de reconstructieplannen en de uitvoeringsprogramma's behorende bij de reconstructieplannen;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: 12.3.c
    text: een beschrijving van de verhouding tussen de onder a en b genoemde documenten en de bestuursovereenkomst;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: 12.3.d
    text: |-
      een programma voor de monitoring en evaluatie van de uitvoering van de afzonderlijke gebiedsplannen en
      reconstructieplannen met betrekking tot de operationele doelstellingen en de lange termijndoelstellingen.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel12
  - number: '13'
    text: |-
      De ministers en gedeputeerde staten sluiten telkens voor het tijdvak waarvoor het provinciaal uitvoeringsprogramma
      is vastgesteld, een uitvoeringscontract, in ieder geval ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel13
  - number: 13.a
    text: |-
      de realisatie van de operationele doelstellingen als bedoeld in [artikel 10, tweede lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel10
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.b
    text: |-
      de bedragen die de afzonderlijke partijen ten hoogste bijdragen in de financiering van de bedoelde operationele
      doelstellingen;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel13
  - number: 13.c
    text: |-
      het in [artikel 12, derde lid, onder d][ref1], bedoelde programma.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel12
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '12'
        hoofdstuk: '3'
  - number: '14.1'
    text: Een provinciaal uitvoeringsprogramma kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel14
  - number: '14.2'
    text: Een wijziging van het provinciaal uitvoeringsprogramma past binnen de bestuursovereenkomst.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel14
  - number: '14.3'
    text: |-
      Alvorens een provinciaal uitvoeringsprogramma wordt gewijzigd, bezien de gedeputeerde staten die het aangaat of
      het uitvoeringscontract wijziging behoeft. In voorkomend geval plegen de gedeputeerde staten hierover overleg met
      de ministers.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel14
  - number: '15.1'
    text: |-
      De ministers kunnen regels vaststellen met het oog op de toepassing van [artikel 12, derde lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel12
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '12'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Gedeputeerde staten dienen binnen zes maanden na afloop van de periode waarvoor het provinciaal
      uitvoeringsprogramma is vastgesteld, een verslag in terzake van de monitoring en evaluatie als bedoeld in
      [artikel 12, derde lid onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel12
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '12'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      Subsidie kan worden verstrekt voor activiteiten in plangebieden en in reconstructiegebieden die tot doel hebben
      het herstel van hydrologische systemen met het oog op behoud, herstel of ontwikkeling van natuur, cultuurhistorie,
      landschap of landbouw, waar mogelijk gecombineerd met beperking van wateroverlast en bescherming van de
      drinkwaterwinning, en die passen in een of meerdere van de volgende subcategorieën:
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.a
    text: inrichtingsactiviteiten bestrijding verdroging;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.b
    text: aanleg natuurlijke oevers en natte verbindingszones;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.c
    text: herstel oorspronkelijke uiterlijke verschijningsvormen van watersystemen;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.d
    text: |-
      terugdringing van ongezuiverde lozingen en emissies op oppervlaktewater of in de bodem door de aanleg van riolering
      en rioolvervangende systemen in landbouwgebieden;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.e
    text: |-
      bestrijding van eutrofiëring in natuurgebieden door: - de aanleg van dammen en stuwen,
        - het scheiden van waterstromen, of
        - het aanleggen van helofyten-vijvers daar waar de problemen zijn ontstaan door diffuse lozingen en derden daarvoor
      niet aansprakelijk gesteld kunnen worden;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.f
    text: |-
      vasthouden gebiedseigen water door: - het aanleggen van bekkens,
        - plaatsen van stuwen of cascades, of
        - werken uit te voeren gericht op het laten meanderen van beken, verondiepen en verbreden van de watergangen;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: 16.1.g
    text: |-
      verbeteren kwaliteit waterbodems door het uitgraven, afvoeren, opslaan of verwerken van kleinschalige, reeds lang
      vervuilde gronden, waarvoor een derde niet aansprakelijk gesteld kan worden.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: '16.2'
    text: |-
      De activiteiten bedoeld in het eerste lid, onderdelen e en g, worden slechts gesubsidieerd indien de eutrofiëring
      of vervuiling bij de bron wordt aangepakt en opgelost.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel16
  - number: '17'
    text: |-
      Subsidie kan worden verstrekt voor activiteiten in plangebieden en reconstructiegebieden die tot doel hebben
      diversificatie van de bedrijvigheid in de landbouw en in verwante activiteiten gericht op het combineren van
      verscheidene activiteiten of het aanboren van alternatieve inkomstenbronnen, of die tot doel hebben vergroting van
      de recreatieve toegankelijkheid en de belevings- en gebruiksmogelijkheden van landbouw, natuur, bos of landschap,
      of die tot doel hebben herstel of ontwikkeling van landschap, cultuurhistorie of biodiversiteit, en die passen in
      een of meer van de volgende subcategorieën:
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: 17.a
    text: |-
      ontwikkeling recreatief-toeristische of streekeigen producten op landbouwbedrijven of in bossen en vergroting van
      de inkomensvorming uit die producten;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: 17.b
    text: |-
      vergroting van de toegankelijkheid en belevings- en gebruiksmogelijkheden van natuur, landbouw, bos, landschap,
      water, cultuurhistorische of archeologische waarden, in overeenstemming met behoud, herstel of ontwikkeling van
      natuur en landschap;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: 17.c
    text: landschappelijke inpassing bedrijfsgebouwen of recreatieve terreinen in verband met functiewijziging;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: 17.d
    text: behoud, herstel of ontwikkeling van cultuurhistorische en archeologische waarden;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: 17.e
    text: |-
      instandhouding oude streekeigen landbouwrassen met het oog op behoud biodiversiteit, kwaliteitsverbetering
      landschap, openluchtrecreatie of cultuurhistorie.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel17
  - number: '18.1'
    text: |-
      Subsidie kan worden verstrekt voor activiteiten in plangebieden en reconstructiegebieden die tot doel hebben de
      vermindering van de milieubelasting en die vallen onder een of meer van de in de bijlage bij deze regeling, onder
      hoofdstuk II, bedoelde categorieën, en indien, voor zover van toepassing, wordt voldaan aan de in de bijlage bij
      deze regeling gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel18
  - number: '18.2'
    text: |-
      Subsidie kan worden verstrekt voor activiteiten in plangebieden en reconstructiegebieden die tot doel hebben het
      terugdringen van de verstoring door geluid, licht, stank en verkeer en die vallen onder een of meer van de in de
      bijlage bij deze regeling, onder hoofdstuk III, bedoelde categorieën, en indien, voor zover van toepassing, wordt
      voldaan aan de in de bijlage bij deze regeling gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel18
  - number: '20'
    text: |-
      Subsidie kan worden verstrekt voor onderzoek, voorlichtingsactiviteiten en het ontwikkelen van plannen, niet
      zijnde reconstructieplannen, uitvoeringsprogramma's behorend bij een reconstructieplan, gebiedsplannen en
      uitvoeringsprogramma's behorend bij een gebiedsplan, voorzover die onderdeel zijn van een of meerdere activiteiten.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel20
  - number: '21.1'
    text: |-
      Aanvragen tot subsidieverlening uit hoofde van de [artikelen 16][ref1] tot en met 19 worden ingediend bij de
      directeur DLG.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel16
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '16'
        hoofdstuk: '4'
  - number: '21.2'
    text: 'In de aanvraag tot subsidieverlening wordt in ieder geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel21
  - number: 21.2.a
    text: |-
      een verwijzing naar het desbetreffende provinciale uitvoeringsprogramma, het gebiedsplan en uitvoeringsprogramma
      behorend bij een gebiedsplan, dan wel het desbetreffende reconstructieplan en uitvoeringsprogramma behorend bij
      het reconstructieplan;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel21
  - number: 21.2.b
    text: een gespecificeerde omschrijving van de voorgenomen activiteit en tijdsplanning, en;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel21
  - number: 21.2.c
    text: |-
      een gespecificeerde begroting van de kosten, alsmede een opgave van de financieringswijze, met daarbij behorende
      toelichting.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel21
  - number: '22'
    text: |-
      De subsidie-ontvanger dient een aanvraag tot subsidievaststelling in bij de directeur DLG binnen zes maanden na
      uitvoering van de activiteit.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel22
  - number: '23.1'
    text: |-
      De subsidie-ontvanger is verplicht de activiteiten ten behoeve waarvan subsidie is verleend binnen twee jaar na de
      datum van subsidieverlening te hebben uitgevoerd overeenkomstig de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel23
  - number: '23.2'
    text: |-
      In bijzondere gevallen kunnen de ministers op verzoek van de aanvrager bij de aanvraag tot subsidieverlening, de in
      het eerste lid bedoelde termijn op voorhand verlengen met maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel23
  - number: '24'
    text: |-
      Bij de beschikking tot subsidieverlening kunnen aan de subsidie-ontvanger verplichtingen als bedoeld in
      [artikel 4:37 van de Algemene wet bestuursrecht][ref1] worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '25'
    text: |-
      De subsidie-ontvanger is verplicht een overzichtelijke en deugdelijke administratie te voeren ten aanzien van de
      activiteit waar de subsidieverlening betrekking op heeft en deze te bewaren gedurende tenminste drie jaren na datum
      van de subsidievaststelling overeenkomstig artikel 4 van [verordening (EG) nr. 4045/1989](31989R4045) van de Raad
      van 21 december 1989 inzake de door de Lidstaten uit te voeren controles op de verrichtingen in het kader van de
      financieringsregeling van de afdeling Garantie van het Europees Oriëntatie- en Garantiefonds voor de Landbouw en
      houdende intrekking van [Richtlijn 77/435/EEG](31977L0435) (PbEG L388).
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel25
  - number: '26'
    text: |-
      De ministers verstrekken op aanvraag voorschotten met inachtneming van de stand van de werkzaamheden, tot
      een totaal van ten hoogste tachtig procent van het in de beschikking tot subsidieverlening vermelde maximum
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel26
  - number: '27.1'
    text: |-
      Een beschikking tot subsidieverlening wordt ingetrokken indien de aanvrager door ernstige nalatigheid of
      opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of anderszins onjuiste
      gegevens heeft verstrekt in het kader van een andere regeling ter uitvoering van hoofdstuk IX van [verordening (EG)
      nr. 1257/1999](31999R1257).
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel27
  - number: '27.2'
    text: |-
      Een beschikking tot subsidievaststelling wordt ingetrokken indien de aanvrager door ernstige nalatigheid of
      opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of anderszins onjuiste
      informatie heeft verstrekt in het kader van een andere regeling ter uitvoering van hoofdstuk IX van [verordening
      (EG) nr. 1257/1999](31999R1257).
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel27
  - number: '28'
    text: |-
      Indien de beschikking tot subsidieverlening of -vaststelling is ingetrokken of ten nadele van de subsidie-ontvanger
      is gewijzigd, betaalt de aanvrager de door hem ontvangen subsidiebedragen en voorschotten terug op eerste vordering
      van de ministers vermeerderd met de wettelijke rente over de periode van de datum van uitbetaling van de subsidie
      tot het tijdstip van voldoening.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel28
  - number: '29'
    text: |-
      Voorzover de activiteit niet voor cofinanciering van de Europese Unie in aanmerking komt op grond van [verordening
      (EG) nr. 1257/1999](31999R1257), kan de subsidieverlening of de subsidievaststelling worden ingetrokken
      of ten nadele van de subsidie-ontvanger gewijzigd worden indien het verstrekken van de subsidie een met de
      gemeenschappelijke markt onverenigbare steunmaatregel is in de zin van [artikel 87 van het Verdrag tot oprichting
      van de Europese Gemeenschap](onbekend).
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel29
  - number: '30.1'
    text: 'De ministers kunnen aan de provincies subsidie verstrekken ter bestrijding van de volgende kosten:'
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: 30.1.a
    text: |-
      de kosten, verbonden aan het opstellen en voorbereiden van een reconstructieplan, een gebiedsplan en een
      uitvoeringsprogramma behorend bij een gebiedsplan;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: 30.1.b
    text: de kosten van monitoring en evaluatie van een gebiedsplan;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: 30.1.c
    text: de kosten, verbonden aan de begeleiding en uitvoering van het uitvoeringsprogramma behorend bij een gebiedsplan;
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: 30.1.d
    text: de kosten van monitoring en evaluatie van een reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: '30.2'
    text: De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: '30.3'
    text: De subsidie op grond van het eerste lid, onderdeel a, wordt verstrekt voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel30
  - number: '31.1'
    text: |-
      Aanvragen tot subsidieverlening uit hoofde van [artikel 30][ref1] worden ingediend bij de Minister van Landbouw,
      Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel30
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012833
        artikel: '30'
        hoofdstuk: '6'
  - number: '31.2'
    text: |-
      Aanvragen tot subsidievaststelling worden ingediend bij de directeur DLG binnen zes maanden na verloop van de
      termijn waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel31
  - number: '32'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de daartoe door de Minister van Landbouw, Natuur en
      Voedselkwaliteit aangewezen medewerkers van DLG.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel32
  - number: '33.1'
    text: De Regeling gebiedsgerichte bestrijding van verdroging wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel33
  - number: '33.2'
    text: Op subsidies verleend op grond van de in het eerste lid bedoelde regeling blijft die regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel33
  - number: '34.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het eerste lid treden de [artikelen 2][ref1] tot en met [8][ref2] en [16][ref3] tot en met
      [29][ref4] in werking op een nader door de Minister van Landbouw, Natuurbeheer en Visserij te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0012833#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012833#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012833#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0012833#Artikel29
    url: https://wetten.overheid.nl/BWBR0012833/2005-12-16#Artikel34
