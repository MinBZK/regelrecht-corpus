        artikel: '4'
  - number: 2b
    text: |-
      1 Van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref1] vervatte verboden
      wordt vrijstelling verleend voor zover het betreft:

      a. het middellijk of onmiddellijk aanbieden van rechten van deelneming in een beleggingsinstelling aan minder
      dan 100 natuurlijke personen of rechtspersonen, niet zijnde natuurlijke personen of rechtspersonen als bedoeld in
      [artikel 1][ref2], per staat;

      b. het aanbieden van rechten van deelneming in een beleggingsinstelling die slechts kunnen worden verworven tegen
      een tegenwaarde van ten minste € 50.000 per deelnemer; of

      c. het aanbieden van rechten van deelneming in een beleggingsinstelling met een nominale waarde per recht van
      deelneming van ten minste € 50.000.

      2 Het bepaalde in het eerste lid is niet van toepassing op beheerders van beleggingsinstellingen die voorzieningen
      aanhouden in het kader van een levensloopregeling als bedoeld in [artikel 19g Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
