    text: |-
      1 Van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref1] vervatte verboden
      ter zake van het ter deelneming vragen of verkrijgen van gelden of andere goederen, wordt vrijstelling verleend
      aan ondernemingen en instellingen die zijn erkend als particuliere participatiemaatschappijen ingevolge het
      [Besluit particuliere participatiemaatschappijen][ref2] (Stb. 1994, 318) of die zijn erkend als startersfondsen
      onder de [Regeling seed capital technostarters][ref3] (Stcrt. 2005, 62).

      2 Van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref4] vervatte verboden
      wordt vrijstelling verleend aan participatiemaatschappijen, niet zijnde particuliere participatiemaatschappijen als
      bedoeld in het eerste lid, voor zover:

      a. de aandelen van de ondernemingen die worden gehouden door de participatiemaatschappijen moeilijk dan wel
      in het geheel niet te plaatsen zijn bij andere dan de natuurlijke personen of rechtspersonen, bedoeld in
      [artikel 1][ref5]; en

      b. de participatiemaatschappijen op grond van een schriftelijk vastgelegde overeenkomst, die een
      beëindigingsregeling bevat, het bestuur of de raad van commissarissen van de ondernemingen waarvan de aandelen
      worden gehouden kunnen benoemen, schorsen of ontslaan dan wel op andere wijze invloed kunnen uitoefenen op het
      bestuur en het dagelijks beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
