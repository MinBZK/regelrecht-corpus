  - number: 2a
    text: |-
      1 Van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref1] vervatte verboden
      wordt vrijstelling verleend indien:

      a. de gelden of andere goederen worden gevraagd of verkregen ter deelneming in een beleggingsinstelling waarvan het
      balanstotaal voor minder dan 50% bestaat uit beleggingen dan wel indien rechten van deelneming in een dergelijke
      beleggingsinstelling worden aangeboden, en

      b. minder dan 50% van de totale gerealiseerde opbrengsten gegenereerd wordt uit beleggingen.

      2 De in het vorige lid onder a en b genoemde criteria worden bepaald ongeacht de presentatie in de jaarrekening en
      vastgesteld per balansdatum einde boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004879/2005-09-01#Artikel2a
    references:
      - id: ref1
