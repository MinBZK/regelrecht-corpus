  - number: 2c
    text: |-
      Van het in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref1] vervatte verboden
      wordt vrijstelling verleend voor het aanbieden van rechten van deelneming, aan bestuurders, leden van de raad
      van commissarissen of werknemers van de beleggingsinstelling van die rechten van deelneming, of aan bestuurders,
      leden van de raad van commissarissen of werknemers van een met die beleggingsinstelling in een groep verbonden
      rechtspersoon, vennootschap of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004879/2005-09-01#Artikel2c
