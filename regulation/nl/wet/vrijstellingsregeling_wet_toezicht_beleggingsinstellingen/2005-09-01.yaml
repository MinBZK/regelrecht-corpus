articles:
  - number: '1'
    text: |-
      1 Van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref1] vervatte verboden
      wordt vrijstelling verleend indien de gelden of andere goederen ter deelneming in een beleggingsinstelling
      uitsluitend worden gevraagd aan of verkregen van natuurlijke personen of rechtspersonen die beroeps- of
      bedrijfsmatig handelen of beleggen in beleggingsobjecten dan wel indien de rechten van deelneming in een
      beleggingsinstelling als hiervoor bedoeld uitsluitend worden aangeboden aan deze categorie natuurlijke personen
      en rechtspersonen.

      2 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat in het aanbod dan wel in
      advertenties of documenten waarin het aanbod in het vooruitzicht wordt gesteld, wordt vermeld dat het aanbod
      uitsluitend is onderscheidenlijk zal zijn gericht tot de in het eerste lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
