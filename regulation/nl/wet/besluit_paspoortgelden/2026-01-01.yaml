      3 De in het eerste en tweede lid genoemde rechten worden niet geheven, indien de verstrekking van het reisdocument
      of de wijziging plaatsvindt in verband met een ambtelijke fout of indien de verstrekking plaatsvindt in
      verband met de vervanging van een eerder geleverd document als bedoeld in [artikel 2, derde lid][ref5], of
      [artikel 2a, derde lid][ref6].

      4 Het in het eerste lid, onderdeel a, dan wel tweede lid, onderdeel a, genoemde recht wordt niet geheven voor
      de verstrekking van diplomatieke paspoorten of dienstpaspoorten ten behoeve van personen die bij een Nederlandse
      vertegenwoordiging in het buitenland zijn tewerkgesteld, hun inwonende huwelijkspartner, geregistreerde partner of
      levenspartner en bij hen inwonende minderjarige kinderen. Met levenspartner wordt bedoeld degene met wie personen,
      die bij een Nederlandse vertegenwoordiging zijn tewerkgesteld, samenwonen en – met het oogmerk duurzaam samen te
      leven – een gemeenschappelijke huishouding voeren op basis van een notarieel verleden samenlevingscontract, dat de
      wederzijdse rechten en verplichtingen bevat ter zake van die samenwoning en gemeenschappelijke huishouding.


