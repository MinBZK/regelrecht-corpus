  - number: '7'
    text: |-
      Bevoegd tot het heffen van de in [artikel 12][ref1] vastgelegde rechten, dan wel tot het verlenen van gehele of
      gedeeltelijke kwijtschelding daarvan zijn:

      a. in het Europese deel van Nederland: Onze Minister en de door hem daartoe aangewezen autoriteiten, voor zover de
      aanvraag niet bij een burgemeester is ingediend;

      b. in het Caribische deel van Nederland: Onze Minister en de door hem daartoe aangewezen autoriteiten, voor zover
      de aanvraag betrekking heeft op verstrekking van een noodpaspoort of een laissez-passer;

      c. buiten het Koninkrijk: de hoofden van de door Onze Minister van Buitenlandse Zaken aangewezen consulaire posten;

      d. Onze Minister van Buitenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
    url: https://wetten.overheid.nl/BWBR0005264/2026-01-01#Artikel7
    references:
