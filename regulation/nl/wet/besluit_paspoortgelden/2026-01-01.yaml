      ten hoogste de kosten die de lokale bezorgdienst in rekening brengt voor het bezorgen van het document;

      g. voor het versneld aanvragen van een document als bedoeld in de onderdelen a, b of c, zijnde een toeslag op de in
      de onderdelen a tot en met c genoemde bedragen: € 12,40;

      h. voor het aanvragen van een document als bedoeld in de onderdelen a en c buiten het Koninkrijk
