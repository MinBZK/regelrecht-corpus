  - number: '3'
    text: |-
      1 Onze Minister stelt maandelijks het bedrag vast van de kosten die door een gemeente of een openbaar lichaam aan
      het Rijk moeten worden afgedragen. Deze vaststelling geschiedt:

      a. voor een gemeente: aan de hand van de in de voorafgaande maand geleverde reisdocumenten en verrichte
      spoedleveringen, bedoeld in [artikel 2, eerste lid][ref1], verminderd met de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in artikel 2, derde lid;

      b. voor een openbaar lichaam: aan de hand van de in de voorafgaande maand geleverde reisdocumenten, bedoeld in
      [artikel 2a, eerste lid][ref2], verminderd met de in de voorafgaande maand geleverde reisdocumenten, bedoeld in
      artikel 2a, derde lid.

      2 Onze Minister zendt voor het einde van elke kalendermaand een factuur aan de gemeente of het openbaar lichaam,
      waarin het bedrag van de overeenkomstig het eerste lid vastgestelde kosten die aan het Rijk moeten worden
      afgedragen, wordt vermeld.

      3 Onze Minister stelt het bedrag vast van de kosten die aan een gemeente of een openbaar lichaam worden
      gerestitueerd en maakt, tegelijk met het verzenden van de factuur, bedoeld in het tweede lid, schriftelijk aan de
      gemeente of het openbaar lichaam bekend welk bedrag wordt gerestitueerd en op welke wijze de betaling daarvan zal
      plaatsvinden. De vaststelling van het te restitueren bedrag geschiedt:

      a. voor een gemeente op basis van de door de gemeente verstrekte afschriften van de beschikkingen, inhoudende
      gehele of gedeeltelijke kwijtschelding als bedoeld in [artikel 2, tweede lid][ref3], en de van de gemeente
      ontvangen en bij de leverancier geverifieerde mededelingen omtrent gevallen waarin een spoedlevering niet binnen de
      gestelde periode heeft plaatsgevonden dan wel de met spoed geleverde reisdocumenten niet op de juiste wijze blijken
      te zijn vervaardigd, als bedoeld in artikel 2, vierde lid;

      b. voor een openbaar lichaam op basis van de door het openbaar lichaam verstrekte afschriften van de beschikkingen,
      inhoudende gehele of gedeeltelijke kwijtschelding als bedoeld in [artikel 2a, tweede lid][ref4].

      4 De afdracht van de aan het Rijk verschuldigde kosten, bedoeld in het tweede lid, geschiedt:

      a. door een gemeente in het kader van de rijksverrekening op grond van het
      __REF000___________________________________________________________________________________________________________
      _____, waarbij automatische verrekening bij de N.V. Bank voor Nederlandsche Gemeenten dient plaats te vinden,
      uiterlijk binnen vier weken na de verzending van de factuur, bedoeld in het tweede lid;

      b. door een openbaar lichaam door middel van automatische incasso van een door het openbaar lichaam daartoe
      geopende bankrekening.

      5 Onze Minister regelt op welke wijze de juistheid van de bedragen die terzake van de verschuldigde kosten aan het
      Rijk zijn afgedragen, wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
