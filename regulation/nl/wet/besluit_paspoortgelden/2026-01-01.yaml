  - number: 2a
    text: |-
      1 Een openbaar lichaam is aan het Rijk de in [artikel 6, eerste lid, onderdelen a en c][ref1], vastgelegde kosten
      verschuldigd in verband met door de leverancier geleverde reisdocumenten.

      2 De in het eerste lid bedoelde kosten zijn niet dan wel gedeeltelijk verschuldigd naar rato van de aan de
      aanvrager verleende kwijtschelding van de rechten, die op grond van de toepasselijke eilandsverordening voor de
      desbetreffende handeling geheven kunnen worden, indien de kwijtschelding is verleend overeenkomstig de krachtens
      [artikel 8.58, eerste lid, van de Belastingwet BES][ref2] gestelde regels.

      3 De in het eerste lid bedoelde kosten zijn niet verschuldigd in verband met de levering van een reisdocument, die
      plaatsvindt ter vervanging van een eerder geleverd reisdocument, dat door toedoen van de leverancier niet op de
      juiste wijze was vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8.58
