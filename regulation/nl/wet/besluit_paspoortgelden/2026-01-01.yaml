  - number: '2'
    text: |-
      1 Een gemeente is aan het Rijk de in[ artikel 6][ref1], eerste lid, vastgelegde kosten verschuldigd in verband
      met door de leverancier geleverde reisdocumenten en door de leverancier verrichte spoedleveringen. Van een
      spoedlevering als bedoeld in dit artikel is sprake, indien naar aanleiding van een daartoe vanuit de gemeente
      verstrekte opdracht, die de leverancier op werkdagen vóór 16.00 uur heeft bereikt, een gepersonaliseerd
      reisdocument de daarop volgende werkdag uiterlijk 16.00 uur is afgeleverd bij de in de aanvraag opgegeven
      uitgiftelocatie.

      2 De in het eerste lid bedoelde kosten zijn niet dan wel gedeeltelijk verschuldigd naar rato van de aan de
      aanvrager verleende kwijtschelding van de rechten, die op grond van de toepasselijke gemeentelijke verordening voor
      de desbetreffende handeling geheven kunnen worden, indien de kwijtschelding is verleend overeenkomstig de krachtens
      [artikel 255, tweede lid, van de Gemeentewet][ref2] gestelde regels.

      3 De in [artikel 6, eerste lid, onderdelen a tot en met e][ref3], vastgelegde kosten zijn niet verschuldigd in
      verband met de levering van een reisdocument ter vervanging van een eerder geleverd reisdocument, indien:

      a. het eerder geleverde reisdocument door toedoen van de leverancier niet op de juiste wijze was vervaardigd, of

      b. bij de uitreiking van het eerder geleverde reisdocument een verificatie van de vingerafdrukken heeft
      plaatsgevonden en bij deze verificatie anders dan door toedoen van de aanvrager niet kon worden vastgesteld
      dat diens vingerafdrukken overeenkomen met de vingerafdrukken, opgenomen in het reisdocument. In laatstgenoemde
      situatie wordt het verschil tussen het toepasselijke bedrag, genoemd in [artikel 6, eerste lid][ref4], en het
      toepasselijke bedrag, genoemd in artikel 6, tweede lid, gerestitueerd aan de betreffende gemeente.

      4 De in [artikel 6, eerste lid, onderdeel e][ref5], vastgelegde kosten zijn niet verschuldigd, indien de
      spoedlevering door toedoen van de leverancier niet binnen de gestelde periode heeft plaatsgevonden, dan wel de met
      spoed geleverde reisdocumenten door toedoen van de leverancier niet op de juiste wijze blijken te zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
