preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 30 augustus 1991, Directoraat-Generaal Openbaar
    Bestuur, IBI91/1223-RD, gedaan mede namens Onze Ministers van Financiën, van Buitenlandse Zaken en voor Nederlands-
    Antilliaanse en Arubaanse Zaken;

    Overwegende, dat het wenselijk is de afdracht van de aan het Rijk verschuldigde kosten en de heffing van de aan het
    Rijk verschuldigde rechten terzake van reisdocumenten nader te regelen en daarvoor bedragen vast te stellen;

    Gelet op artikel 7, eerste lid, van de Paspoortwet (Stb. 1991, 498);

    De Raad van State van het Koninkrijk gehoord (advies van 14 oktober 1991, no. WO.4.91 0477/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 31 oktober 1991, Directoraat-Generaal
    Openbaar Bestuur, IBI91/1659/RD, uitgebracht mede namens Onze Ministers van Financiën, van Buitenlandse Zaken a.i.
    en voor Nederlands-Antilliaanse en Arubaanse Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005264/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - kosten: de kosten, bedoeld in [artikel 7, eerste lid, onder a, van de Paspoortwet][ref1];
        - leverancier: het bedrijf dat in opdracht van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties belast
      is met het verrichten van diensten in verband met de verstrekking van reisdocumenten, waaronder de vervaardiging en
      levering van reisdocumenten;
        - rechten: de rechten, bedoeld in [artikel 7, eerste lid, onder b, van de Paspoortwet][ref2];
        - spoedlevering: de versnelde aflevering van een gepersonaliseerd reisdocument, bedoeld in
      [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005264#Artikel2
