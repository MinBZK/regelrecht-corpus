    text: |-
      1 Aruba, Curaçao en Sint Maarten zijn aan het Rijk de in [artikel 6, eerste lid, onderdeel a][ref1] vastgelegde
      kosten verschuldigd in verband met door de leverancier geleverde reisdocumenten, indien de aanvraag voor de
      desbetreffende handeling bij de ingevolge [artikel 26 van de Paspoortwet][ref2] door de Gouverneur aangewezen
      autoriteit is ingediend.

      2 De in het eerste lid bedoelde kosten zijn niet verschuldigd in verband met de levering van een reisdocument, als
      bedoeld in [artikel 2, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005264#Artikel2
