  - number: '5'
    text: |-
      1 De Gouverneur stelt maandelijks het bedrag vast van de kosten die door Aruba, Curaçao en Sint Maarten aan het
      Rijk moeten worden afgedragen. Deze vaststelling geschiedt aan de hand van de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in [artikel 4, eerste lid][ref1], verminderd met de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in artikel 4, tweede lid en, indien het in [artikel 2, derde lid, onderdeel b][ref2],
      bedoelde geval zich heeft voorgedaan, verminderd met een overeenkomstig bedrag, als bedoeld in artikel 2, derde
      lid, laatste volzin.

      2 De Gouverneur zendt voor het einde van elke kalendermaand een factuur aan Aruba, Curaçao en Sint Maarten,
      waarin het bedrag van de aan het Rijk af te dragen kosten in verband met de in de voorafgaande maand geleverde
      reisdocumenten, wordt vermeld.

      3 De afdracht van de aan het Rijk verschuldigde kosten geschiedt uiterlijk binnen vier weken na de verzending van
      de factuur, bedoeld in het tweede lid, door overmaking van het daarin genoemde bedrag op de daartoe aangewezen
      rekening van het kabinet van de Gouverneur.

      4 De Gouverneur kan, na overleg met de bevoegde autoriteiten, bepalen dat de overmaking van de aan het Rijk
      verschuldigde kosten plaats vindt door middel van automatische incasso van een door Aruba, Curaçao of Sint Maarten,
      daartoe speciaal geopende bankof girorekening.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005264#Artikel2
