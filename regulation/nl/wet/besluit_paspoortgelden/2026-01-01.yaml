        bwb_id: BWBR0005264
        artikel: '12'
        hoofdstuk: III
        paragraaf: '3'
  - number: '8'
    text: |-
      Aan de aanvrager in het buitenland die woonachtig is in het ressort van de consulaire post waar hij zijn aanvraag
      indient en niet in staat is anders dan met buitengewoon bezwaar de door hem aan het Rijk verschuldigde rechten
      geheel of gedeeltelijk te betalen kan geheel of gedeeltelijk kwijtschelding van deze rechten worden verleend.
    url: https://wetten.overheid.nl/BWBR0005264/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens
      [artikel 26 van de Invorderingswet 1990][ref1] door Onze Minister van Financiën gestelde regels betreffende de
      kwijtschelding van rijksbelastingen in de privé-sfeer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005264/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: '10'
    text: |-
      De vaststelling van de valuta waarin de betaling van de in [artikel 12][ref1] vastgelegde rechten in het
      buitenland plaatsvindt en de herleiding van deze rechten in de vastgestelde valuta geschieden overeenkomstig
      [artikel 6 van de Rijkswet op de consulaire tarieven][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013618#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '12'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013618
        artikel: '6'
  - number: '11'
    text: |-
      1 In Aruba, Curaçao en Sint Maarten vindt heffing dan wel kwijtschelding van de in [artikel 12][ref1]
      vastgelegde rechten plaats door of namens de Gouverneur, voor zover de aanvraag niet bij een ingevolge
      [artikel 26 van de Paspoortwet][ref2] door de Gouverneur aangewezen autoriteit is ingediend.

      2 Aan de aanvrager in Aruba, Curaçao of Sint Maarten die niet in staat is anders dan met buitengewoon bezwaar
      de door hem aan het Rijk verschuldigde rechten geheel of gedeeltelijk te voldoen omdat hij geen of geringe
      betalingscapaciteit bezit, kan op zijn schriftelijk verzoek geheel of gedeeltelijk kwijtschelding van deze rechten
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
