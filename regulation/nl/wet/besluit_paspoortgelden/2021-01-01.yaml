preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 30 augustus 1991, Directoraat-Generaal Openbaar
    Bestuur, IBI91/1223-RD, gedaan mede namens Onze Ministers van Financiën, van Buitenlandse Zaken en voor Nederlands-
    Antilliaanse en Arubaanse Zaken;

    Overwegende, dat het wenselijk is de afdracht van de aan het Rijk verschuldigde kosten en de heffing van de aan het
    Rijk verschuldigde rechten terzake van reisdocumenten nader te regelen en daarvoor bedragen vast te stellen;

    Gelet op artikel 7, eerste lid, van de Paspoortwet (Stb. 1991, 498);

    De Raad van State van het Koninkrijk gehoord (advies van 14 oktober 1991, no. WO.4.91 0477/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken van 31 oktober 1991, Directoraat-Generaal
    Openbaar Bestuur, IBI91/1659/RD, uitgebracht mede namens Onze Ministers van Financiën, van Buitenlandse Zaken a.i.
    en voor Nederlands-Antilliaanse en Arubaanse Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - kosten: de kosten, bedoeld in
      [artikel 7, eerste lid, onder a, van de Paspoortwet][ref1];
        - leverancier: het bedrijf dat in opdracht van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties belast
      is met het verrichten van diensten in verband met de verstrekking van reisdocumenten, waaronder de vervaardiging en
      levering van reisdocumenten;
        - rechten: de rechten, bedoeld in [artikel 7, eerste lid, onder b, van de Paspoortwet][ref2];
        - spoedlevering: de versnelde aflevering van een gepersonaliseerd reisdocument, bedoeld in
      [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005264
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Een gemeente is aan het Rijk de in[ artikel 6][ref1], eerste lid, vastgelegde kosten verschuldigd in verband
      met door de leverancier geleverde reisdocumenten en door de leverancier verrichte spoedleveringen. Van een
      spoedlevering als bedoeld in dit artikel is sprake, indien naar aanleiding van een daartoe vanuit de gemeente
      verstrekte opdracht, die de leverancier op werkdagen vóór 16.00 uur heeft bereikt, een gepersonaliseerd
      reisdocument de daarop volgende werkdag uiterlijk 16.00 uur is afgeleverd bij de in de aanvraag opgegeven
      uitgiftelocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde kosten zijn niet dan wel gedeeltelijk verschuldigd naar rato van de aan de aanvrager
      verleende kwijtschelding van de rechten, die op grond van de toepasselijke gemeentelijke verordening voor de
      desbetreffende handeling geheven kunnen worden, indien de kwijtschelding is verleend overeenkomstig de krachtens
      [artikel 255, tweede lid, van de Gemeentewet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel255
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '255'
  - number: '2.3'
    text: |-
      De in [artikel 6, eerste lid, onderdelen a tot en met d][ref1], vastgelegde kosten zijn niet verschuldigd in
      verband met de levering van een reisdocument ter vervanging van een eerder geleverd reisdocument, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 2.3.a
    text: het eerder geleverde reisdocument door toedoen van de leverancier niet op de juiste wijze was vervaardigd, of
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
  - number: 2.3.b
    text: |-
      bij de uitreiking van het eerder geleverde reisdocument een verificatie van de vingerafdrukken heeft plaatsgevonden
      en bij deze verificatie anders dan door toedoen van de aanvrager niet kon worden vastgesteld dat diens
      vingerafdrukken overeenkomen met de vingerafdrukken, opgenomen in het reisdocument. In laatstgenoemde situatie
      wordt het verschil tussen het toepasselijke bedrag, genoemd in [artikel 6, eerste lid][ref1], en het toepasselijke
      bedrag, genoemd in artikel 6, tweede lid, gerestitueerd aan de betreffende gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '2.4'
    text: |-
      De in [artikel 6, eerste lid, onderdeel d][ref1], vastgelegde kosten zijn niet verschuldigd, indien de
      spoedlevering door toedoen van de leverancier niet binnen de gestelde periode heeft plaatsgevonden, dan wel de met
      spoed geleverde reisdocumenten door toedoen van de leverancier niet op de juiste wijze blijken te zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 2a.1
    text: |-
      Een openbaar lichaam is aan het Rijk de in [artikel 6, eerste lid, onderdelen a en c][ref1], vastgelegde kosten
      verschuldigd in verband met door de leverancier geleverde reisdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 2a.2
    text: |-
      De in het eerste lid bedoelde kosten zijn niet dan wel gedeeltelijk verschuldigd naar rato van de aan de
      aanvrager verleende kwijtschelding van de rechten, die op grond van de toepasselijke eilandsverordening voor de
      desbetreffende handeling geheven kunnen worden, indien de kwijtschelding is verleend overeenkomstig de krachtens
      [artikel 8.58, eerste lid, van de Belastingwet BES][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: 2a.3
    text: |-
      De in het eerste lid bedoelde kosten zijn niet verschuldigd in verband met de levering van een reisdocument, die
      plaatsvindt ter vervanging van een eerder geleverd reisdocument, dat door toedoen van de leverancier niet op de
      juiste wijze was vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Onze Minister stelt maandelijks het bedrag vast van de kosten die door een gemeente of een openbaar lichaam aan het
      Rijk moeten worden afgedragen. Deze vaststelling geschiedt:
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: 3.1.a
    text: |-
      voor een gemeente: aan de hand van de in de voorafgaande maand geleverde reisdocumenten en verrichte
      spoedleveringen, bedoeld in [artikel 2, eerste lid][ref1], verminderd met de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in artikel 2, derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 3.1.b
    text: |-
      voor een openbaar lichaam: aan de hand van de in de voorafgaande maand geleverde reisdocumenten, bedoeld in
      [artikel 2a, eerste lid][ref1], verminderd met de in de voorafgaande maand geleverde reisdocumenten, bedoeld in
      artikel 2a, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: 2a
        hoofdstuk: II
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Onze Minister zendt voor het einde van elke kalendermaand een factuur aan de gemeente of het openbaar lichaam,
      waarin het bedrag van de overeenkomstig het eerste lid vastgestelde kosten die aan het Rijk moeten worden
      afgedragen, wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister stelt het bedrag vast van de kosten die aan een gemeente of een openbaar lichaam worden gerestitueerd
      en maakt, tegelijk met het verzenden van de factuur, bedoeld in het tweede lid, schriftelijk aan de gemeente of het
      openbaar lichaam bekend welk bedrag wordt gerestitueerd en op welke wijze de betaling daarvan zal plaatsvinden. De
      vaststelling van het te restitueren bedrag geschiedt:
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: 3.3.a
    text: |-
      voor een gemeente op basis van de door de gemeente verstrekte afschriften van de beschikkingen, inhoudende gehele
      of gedeeltelijke kwijtschelding als bedoeld in [artikel 2, tweede lid][ref1], en de van de gemeente ontvangen en
      bij de leverancier geverifieerde mededelingen omtrent gevallen waarin een spoedlevering niet binnen de gestelde
      periode heeft plaatsgevonden dan wel de met spoed geleverde reisdocumenten niet op de juiste wijze blijken te zijn
      vervaardigd, als bedoeld in artikel 2, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 3.3.b
    text: |-
      voor een openbaar lichaam op basis van de door het openbaar lichaam verstrekte afschriften van de beschikkingen,
      inhoudende gehele of gedeeltelijke kwijtschelding als bedoeld in [artikel 2a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
    references:
