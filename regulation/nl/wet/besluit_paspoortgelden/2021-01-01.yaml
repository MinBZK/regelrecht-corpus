  - number: '12.4'
    text: |-
      Het in het eerste lid, onderdeel a, dan wel tweede lid, onderdeel a, genoemde recht wordt niet geheven voor de
      verstrekking van diplomatieke paspoorten of dienstpaspoorten ten behoeve van personen die bij een Nederlandse
      vertegenwoordiging in het buitenland zijn tewerkgesteld, hun inwonende huwelijkspartner, geregistreerde partner of
      levenspartner en bij hen inwonende minderjarige kinderen. Met levenspartner wordt bedoeld degene met wie personen,
      die bij een Nederlandse vertegenwoordiging zijn tewerkgesteld, samenwonen en – met het oogmerk duurzaam samen te
      leven – een gemeenschappelijke huishouding voeren op basis van een notarieel verleden samenlevingscontract, dat de
      wederzijdse rechten en verplichtingen bevat ter zake van die samenwoning en gemeenschappelijke huishouding.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel12
  - number: '12.5'
    text: |-
      Hetgeen in dit artikel is bepaald ten aanzien van een Nederlandse identiteitskaart ten behoeve van een persoon
      die op het moment van de aanvraag de leeftijd van achttien jaar nog niet heeft bereikt, is van overeenkomstige
      toepassing op een vervangende Nederlandse identiteitskaart voor personen met een uitreisverbod, ongeacht de
      leeftijd van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel12
  - number: '13'
    text: |-
      De in [artikel 12][ref1] bedoelde rechten worden geheven bij wege van een mondelinge dan wel een gedagtekende
      schriftelijke kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel13
