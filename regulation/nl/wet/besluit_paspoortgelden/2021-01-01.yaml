    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041549
  - number: 3.4.b
    text: |-
      door een openbaar lichaam door middel van automatische incasso van een door het openbaar lichaam daartoe geopende
      bankrekening.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister regelt op welke wijze de juistheid van de bedragen die terzake van de verschuldigde kosten aan het
      Rijk zijn afgedragen, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: '4.1'
    text: |-
      Aruba, Curaçao en Sint Maarten zijn aan het Rijk de in [artikel 6, eerste lid, onderdeel a][ref1] vastgelegde
      kosten verschuldigd in verband met door de leverancier geleverde reisdocumenten, indien de aanvraag voor de
      desbetreffende handeling bij de ingevolge [artikel 26 van de Paspoortwet][ref2] door de Gouverneur aangewezen
      autoriteit is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '26'
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde kosten zijn niet verschuldigd in verband met de levering van een reisdocument, als
      bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.1'
    text: |-
      De Gouverneur stelt maandelijks het bedrag vast van de kosten die door Aruba, Curaçao en Sint Maarten aan het
      Rijk moeten worden afgedragen. Deze vaststelling geschiedt aan de hand van de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in [artikel 4, eerste lid][ref1], verminderd met de in de voorafgaande maand geleverde
      reisdocumenten, bedoeld in artikel 4, tweede lid en, indien het in [artikel 2, derde lid, onderdeel b][ref2],
      bedoelde geval zich heeft voorgedaan, verminderd met een overeenkomstig bedrag, als bedoeld in artikel 2, derde
      lid, laatste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel5
    references:
      - id: ref1
