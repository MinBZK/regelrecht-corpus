  - number: '6.6'
    text: |-
      Hetgeen in dit artikel is bepaald ten aanzien van een Nederlandse identiteitskaart ten behoeve van een persoon
      die op het moment van de aanvraag de leeftijd van achttien jaar nog niet heeft bereikt, is van overeenkomstige
      toepassing op een vervangende Nederlandse identiteitskaart voor personen met een uitreisverbod, ongeacht de
      leeftijd van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Bevoegd tot het heffen van de in [artikel 12][ref1] vastgelegde rechten, dan wel tot het verlenen van gehele of
      gedeeltelijke kwijtschelding daarvan zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
