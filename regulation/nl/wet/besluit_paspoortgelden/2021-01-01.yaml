  - number: '3.4'
    text: 'De afdracht van de aan het Rijk verschuldigde kosten, bedoeld in het tweede lid, geschiedt:'
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel3
  - number: 3.4.a
    text: |-
      door een gemeente in het kader van de rijksverrekening op grond van het
