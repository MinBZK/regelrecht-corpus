        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005264
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.2'
    text: |-
      De Gouverneur zendt voor het einde van elke kalendermaand een factuur aan Aruba, Curaçao en Sint Maarten,
      waarin het bedrag van de aan het Rijk af te dragen kosten in verband met de in de voorafgaande maand geleverde
      reisdocumenten, wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel5
  - number: '5.3'
    text: |-
      De afdracht van de aan het Rijk verschuldigde kosten geschiedt uiterlijk binnen vier weken na de verzending van
      de factuur, bedoeld in het tweede lid, door overmaking van het daarin genoemde bedrag op de daartoe aangewezen
      rekening van het kabinet van de Gouverneur.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel5
  - number: '5.4'
    text: |-
      De Gouverneur kan, na overleg met de bevoegde autoriteiten, bepalen dat de overmaking van de aan het Rijk
      verschuldigde kosten plaats vindt door middel van automatische incasso van een door Aruba, Curaçao of Sint Maarten,
      daartoe speciaal geopende bankof girorekening.
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel5
