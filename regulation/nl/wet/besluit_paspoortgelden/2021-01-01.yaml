      vastgelegde rechten plaats door of namens de Gouverneur, voor zover de aanvraag niet bij een ingevolge
      [artikel 26 van de Paspoortwet][ref2] door de Gouverneur aangewezen autoriteit is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
    url: https://wetten.overheid.nl/BWBR0005264/2021-01-01#Artikel11
