        afdeling: '7.1'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
  - number: 13.Ia
    text: |-
      [Artikel 20.3 van de Wet milieubeheer][ref1], zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop
      deze wet in werking treedt, blijft gedurende zes weken na dat tijdstip van kracht met betrekking tot besluiten:

      a. waarop [artikel 20.1 van de Wet milieubeheer][ref2] van toepassing is,

      b. waartegen ingevolge [artikel 7:1 van de Algemene wet bestuursrecht][ref3] bezwaar moet worden gemaakt alvorens
      daartegen beroep kan worden ingesteld, en

      c. die zijn genomen voor het tijdstip waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel71
    url: https://wetten.overheid.nl/BWBR0007364/1995-05-17#Artikel13.Ia
