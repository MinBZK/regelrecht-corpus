  - number: 13.Ib
    text: |-
      Voor de studerenden voor wie de omzetting met betrekking tot het studiejaar 1993/94 van beurs in rentedragende
      lening als bedoeld in [artikel 31][ref1], zoals dit luidde voor inwerkingtreding van deze wet, niet op 31 december
      1994 heeft plaatsgevonden, vindt van rechtswege omzetting plaats op de laatste dag van de maand waarin deze wet in
      werking treedt. In dat geval gaat de renteberekening in op de eerste dag na de omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel31a
    url: https://wetten.overheid.nl/BWBR0007364/1995-05-17#Artikel13.Ib
