preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het na de invoering van de Algemene wet bestuursrecht wenselijk is
    gebleken de Algemene wet bestuursrecht en een aantal andere wetten op een aantal punten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007364/1995-05-17#ArtikelAanhef
articles:
  - number: 13.I
    text: |-
      [Afdeling 7.1 van de Algemene wet bestuursrecht][ref1] vindt geen toepassing ten aanzien van geschillen
      die betrekking hebben op besluiten die zijn voorbereid met toepassing van een van de procedures,
      geregeld in de hoofdstukken 3 en 4 van de Wet algemene bepalingen milieuhygiëne onderscheidenlijk
      [hoofdstuk 13 van de Wet milieubeheer][ref2], zoals deze golden voor 1 maart 1993 onderscheidenlijk voor 1 januari
      1994.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0007364/1995-05-17#Artikel13.I
    references:
      - id: ref1
