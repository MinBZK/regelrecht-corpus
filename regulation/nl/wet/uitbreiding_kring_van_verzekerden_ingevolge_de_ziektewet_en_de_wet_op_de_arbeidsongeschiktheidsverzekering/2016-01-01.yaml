        bwb_id: BWBR0019057
  - number: 2.1.a
    text: |-
      op grond van het bepaalde in
      [artikel 19, eerste lid, onderdelen j en k, en derde, vierde en zesde lid, van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel2
    references:
