  text: |-
    Gelet op de artikelen 7, onder e, 8, onder b, 11 en 55, tweede lid, van de Ziektewet en de artikelen 7, onder g,
    7a, onder b, en 66, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering,

