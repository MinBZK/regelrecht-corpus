articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] wordt als werknemer beschouwd degene, die wegens ziekte niet
      werkt, doch aan wie geen ziekengeld ingevolge de verplichte verzekering wordt verleend:

      a. over de zaterdagen en de zondagen, bedoeld in [artikel 29, tweede lid][ref4], dan wel op grond van het bepaalde
      bij of krachtens [artikel 32][ref5], of [artikel 32a van de Ziektewet][ref6];

      b. op grond van [artikel 44, eerste lid, van de Ziektewet][ref7], mits de periode, waarover op grond van
      dit artikel geen ziekengeld wordt verleend, voorafgaat aan of een onderbreking vormt van een periode,
      waarover wel ziekengeld wordt verleend, dan wel volgt op een periode, waarover ziekengeld wordt verleend,
      en onmiddellijk voorafgaat aan een tijdvak, waarover recht bestaat op arbeidsongeschiktheidsuitkering
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref8], berekend naar een arbeidsongeschiktheid
      van ten minste 45%, of waarover recht bestaat op een arbeidsongeschiktheidsuitkering als bedoeld in
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref9] of een werkhervattingsuitkering gedeeltelijk
      arbeidsgeschikten als bedoeld in [hoofdstuk 7 van die wet][ref10] voor zover de verzekerde in staat is met arbeid
      ten hoogste 55% te verdienen van het maatmaninkomen per uur.

      2 Voor de toepassing van de [Wet op de arbeidsongeschiktheidsverzekering][ref11] of
      de [Wet werk en inkomen naar arbeidsvermogen][ref12] is het bepaalde in het vorige lid
      niet van toepassing, indien de betrokkene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref13] heeft bereikt.

      3 Voor de toepassing van de [Ziektewet][ref14] en de [Wet op de arbeidsongeschiktheidsverzekering][ref15] wordt in
      de gevallen, bedoeld in het eerste lid, aangewezen als werkgever het Uitvoeringsinstituut werknemersverzekeringen.


