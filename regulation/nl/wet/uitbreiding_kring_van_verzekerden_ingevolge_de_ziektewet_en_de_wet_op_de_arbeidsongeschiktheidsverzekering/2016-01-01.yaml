        artikel: '19'
  - number: 2.1.b
    text: |-
      op grond van het bepaalde in de [artikelen 19, eerste lid, onderdeel e][ref1], [24, eerste lid, onderdeel b][ref2],
      [25][ref3], [26, eerste lid][ref4], en [27 van de Werkloosheidswet][ref5], mits de periode, waarover op grond van
      laatstbedoelde bepalingen geen uitkering wordt verleend, voorafgaat aan, dan wel een onderbreking vormt van een
      periode, waarover wel uitkering wordt verleend;


