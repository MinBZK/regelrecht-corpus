    Besluit:
  url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] wordt als werknemer beschouwd degene, die wegens ziekte niet
      werkt, doch aan wie geen ziekengeld ingevolge de verplichte verzekering wordt verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
  - number: 1.1.a
    text: |-
      over de zaterdagen en de zondagen, bedoeld in [artikel 29, tweede lid][ref1], dan wel op grond van het bepaalde bij
      of krachtens [artikel 32][ref2], of [artikel 32a van de Ziektewet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 32a
  - number: 1.1.b
    text: |-
      op grond van [artikel 44, eerste lid, van de Ziektewet][ref1], mits de periode, waarover op grond van
      dit artikel geen ziekengeld wordt verleend, voorafgaat aan of een onderbreking vormt van een periode,
      waarover wel ziekengeld wordt verleend, dan wel volgt op een periode, waarover ziekengeld wordt verleend,
      en onmiddellijk voorafgaat aan een tijdvak, waarover recht bestaat op arbeidsongeschiktheidsuitkering
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref2], berekend naar een arbeidsongeschiktheid
      van ten minste 45%, of waarover recht bestaat op een arbeidsongeschiktheidsuitkering als bedoeld in
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref3] of een werkhervattingsuitkering gedeeltelijk
      arbeidsgeschikten als bedoeld in [hoofdstuk 7 van die wet][ref4] voor zover de verzekerde in staat is met arbeid
      ten hoogste 55% te verdienen van het maatmaninkomen per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '44'
