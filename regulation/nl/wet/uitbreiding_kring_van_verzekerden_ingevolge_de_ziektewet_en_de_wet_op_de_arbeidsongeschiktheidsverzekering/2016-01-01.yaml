        hoofdstuk: '7'
  - number: '1.2'
    text: |-
      Voor de toepassing van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] is het bepaalde in het vorige lid niet van toepassing, indien de
      betrokkene de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3]
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '1.3'
    text: |-
      Voor de toepassing van de [Ziektewet][ref1] en de [Wet op de arbeidsongeschiktheidsverzekering][ref2] wordt in de
      gevallen, bedoeld in het eerste lid, aangewezen als werkgever het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002622/2016-01-01#Artikel1
    references:
