  - number: '2'
    text: |-
      1 Voor de toepassing van de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] wordt als werknemer beschouwd degene die wegens werkloosheid niet
      werkt, doch aan wie geen uitkering wordt verleend:

      a. op grond van het bepaalde in
      [artikel 19, eerste lid, onderdelen j en k, en derde, vierde en zesde lid, van de Werkloosheidswet][ref4];

      b. op grond van het bepaalde in de [artikelen 19, eerste lid, onderdeel e][ref5],
      [24, eerste lid, onderdeel b][ref6], [25][ref7], [26, eerste lid][ref8], en [27 van de Werkloosheidswet][ref9],
      mits de periode, waarover op grond van laatstbedoelde bepalingen geen uitkering wordt verleend, voorafgaat aan, dan
      wel een onderbreking vormt van een periode, waarover wel uitkering wordt verleend;

      c. over de zaterdagen en zondagen.

      2 Voor de toepassing van de [Ziektewet][ref10] en de [Wet op de arbeidsongeschiktheidsverzekering][ref11] wordt in
      de gevallen, bedoeld in het eerste lid, aangewezen als werkgever het Uitvoeringsinstituut werknemersverzekeringen.


