    text: |-
      1 Voor de toepassing van de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] wordt als werknemer beschouwd degene, die wegens werkloosheid niet
      werkt, doch aan wie geen uitkering wordt verleend:

      a. op grond van het bepaalde in
      [artikel 19, eerste lid, onderdelen j en k, en derde lid van de Werkloosheidswet][ref4] (Stb. 1986, 566);

      b. op grond van het bepaalde in de [artikelen 19, eerste lid, onderdeel e][ref5],
      [24, eerste lid, onderdeel b][ref6], [25][ref7], [26, eerste lid][ref8], en [27 van de Werkloosheidswet][ref9],
      mits de periode, waarover op grond van laatstbedoelde bepalingen geen uitkeringen wordt verleend, voorafgaand aan,
      dan wel een onderbreking vormt van een periode, waarover wel uitkering wordt verleend;

      c. over de zaterdagen en zondagen.

      1a Voor de toepassing van de [Ziektewet][ref10] wordt in de gevallen, bedoeld in het vorige lid, aangewezen als
      werkgever de bedrijfsvereniging, bij welke degene, die ingevolge het bepaalde in het vorige lid als werknemer wordt
      beschouwd, verzekerd zou zijn, indien hem de in dat lid bedoelde uitkering zou zijn verleend.


