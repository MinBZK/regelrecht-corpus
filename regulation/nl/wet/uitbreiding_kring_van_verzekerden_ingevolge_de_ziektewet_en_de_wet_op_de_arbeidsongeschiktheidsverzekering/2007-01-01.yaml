  - number: '3'
    text: |-
      Voor de toepassing van de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] wordt als werknemer beschouwd degene wiens dienstbetrekking is
      geëindigd anders dan door opzegging met inachtneming van de rechtens geldende termijn, doch aan wie geen uitkering
      op grond van de [Werkloosheidswet][ref4] wordt verleend, aangezien hij in verband met die beëindiging recht heeft
      op inkomsten die worden gelijkgesteld met het recht op onverminderde doorbetaling van zijn loon als bedoeld in
      [artikel 16, derde lid, van de Werkloosheidswet][ref5].


