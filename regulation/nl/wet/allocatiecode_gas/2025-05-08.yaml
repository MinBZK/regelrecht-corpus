$id: allocatiecode_gas
regulatory_layer: WET
publication_date: '2026-02-20'
valid_from: '2025-05-08'
bwb_id: BWBR0037931
url: https://wetten.overheid.nl/BWBR0037931/2025-05-08
preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Het bepaalde in deze code betreft het proces van allocatie ten behoeve van erkende programmaverantwoordelijken
      en leveranciers op grond van gegevens van aangeslotenen op de regionale gasttransportnetten en op het landelijk
      gastransportnet, alsmede de daarbij behorende instrumenten en informatiestromen.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel1.1.1
  - number: 1.1.2
    text: |-
      Begrippen, die in de [Gaswet][ref1] of de Begrippencode gas zijn gedefinieerd, hebben de in de Gaswet of
      [Begrippencode gas][ref2] gedefinieerde betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
  - number: 1.1.3
    text: |-
      Onder off line allocatie wordt binnen deze code verstaan de maandelijkse allocatie op de 6e en 16e werkdag na
      afloop van de maand en de 10e werkdag van de vierde maand na afloop van de maand.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel1.1.3
  - number: 2.0.1
    text: |-
      De netbeheerder van het landelijk gastransportnet verzamelt elk uur, kort na het volle uur, voor alle entry- en
      exitpunten met een jaarlijkse hoeveelheid gemeten gas ≥ 170.000 m3 de meetwaarden per uur.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.1
  - number: 2.0.2
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt uiterlijk 5 minuten na afloop van het uur waarop
      de gegevens betrekking hebben, aan erkende programmaverantwoordelijke(n) de near-real-time allocatiegegevens,
      samengesteld op grond van de conform [2.0.1][ref1] verzamelde meetwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.3
    text: |-
      In afwijking van [2.0.2][ref1] verstrekt de netbeheerder van het landelijk gastransportnet aan erkende
      programmaverantwoordelijke(n) de near-real-time allocatiegegevens, samengesteld op grond van de conform
      [2.0.1][ref2] verzamelde meetwaarden voor de exitpunten waar het landelijk gastransportnet is verbonden met een
      regionaal gastransportnet uiterlijk 15 minuten na afloop van het uur waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.4
    text: |-
      Voor informatieve doeleinden verzamelt de netbeheerder van het landelijk gastransportnet de in [2.0.1][ref1]
      genoemde meetwaarden ook voor alle intervallen van 5 minuten binnen een uur. Indien de netbeheerder van het
      landelijk gastransportnet niet tijdig een in 2.0.1 genoemde meetwaarde voor een uur beschikbaar heeft, gebruikt de
      netbeheerder van het landelijk gastransportnet in plaats van de uurwaarde een lineaire extrapolatie van de laatst
      ontvangen 5 minuten waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.5
    text: |-
      Indien de in [2.0.4][ref1] genoemde 5 minuten waarde niet beschikbaar is gebruikt de netbeheerder van het landelijk
      gastransportnet de laatst beschikbare uurwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.6
    text: |-
      Met behulp van het Centraal Systeem Stuursignaal wordt, uitgaande van de meetwaarden afkomstig van meetinrichtingen
      op de exitpunten waar het landelijk gastransportnet is verbonden met een regionaal gastransportnet, elk uur,
      kort na het volle uur, de allocatie van de meetwaarde per erkende programmaverantwoordelijke per netgebied per
      afnamecategorie uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.6
  - number: 2.0.7
    text: |-
      Bij het bepalen van de allocaties conform [2.0.6][ref1] wordt gebruik gemaakt van gegevens, geregistreerd door
      meetinrichtingen bij aangeslotenen die voorzien zijn van afnamecategorie GGV en GIS en die zijn aangesloten op een
      regionaal gastransportnet en van het aansluitingenregister van de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.7a
    text: |-
      Bij het bepalen van de allocaties conform [2.0.6][ref1] wordt voor aansluitingen op gesloten distributiesystemen
      aangesloten op een regionaal distributienet waarvan de beheerder heeft aangegeven gebruik te willen maken
      van de in deze code genoemde berichten, gebruik gemaakt van gegevens, geregistreerd door meetinrichtingen bij
      aangeslotenen op dat gesloten distributiesysteem die voorzien zijn van afnamecategorie GGV en GIS en van het
      aansluitingenregister van de beheerder van het gesloten distributiesysteem. Deze gegevens treden in de plaats van
      de gegevens van de aansluiting van het gesloten distributiesysteem op het regionale gastransportnet. Indien de
      gegevens van de beheerder van het gesloten distributiesysteem ontbreken worden de gegevens van de aansluiting van
      het gesloten distributiesysteem op het regionale gastransportnet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.7a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.8
    text: |-
      Bij het samenstellen conform [2.0.6][ref1] van de allocatiegegevens van aangeslotenen op gastransportnetten
      van regionale netbeheerders niet behorende tot de afnamecategorie GGV of GIS of met de afnamecategorie
      GGV of GIS, maar waarvoor geen meetwaarden zijn aangeleverd, worden de rekenregels toegepast
      van de methodiek Verbruiksprofielen, beschreven in respectievelijk bijlage 1a van deze code en
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.8
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 2.0.8a
    text: |-
      Bij het samenstellen conform [2.0.6][ref1] van de allocatiegegevens van aangeslotenen op gesloten
      distributiesystemen aangesloten op een regionaal net waarvan de beheerder van het gesloten distributiesysteem
      heeft aangegeven gebruik te willen maken van de in deze code genoemde berichten, niet behorende tot
      de afnamecategorie GGV of GIS of met de afnamecategorie GGV of GIS, maar waarvoor geen meetwaarden
      zijn aangeleverd, worden de rekenregels toegepast van de methodiek Verbruiksprofielen, beschreven in
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.8a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 2.0.9
    text: |-
      Nadere regels voor het uit te voeren allocatieproces zijn opgenomen in de [hoofdstukken 4][ref1] en [4a][ref2] en
      in bijlage 2a.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.0.9
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: 4a
  - number: 2.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet, de regionale netbeheerders en de beheerders van gesloten
      distributiesystemen die hebben aangegeven gebruik te willen maken van de in deze code genoemde berichten
      verzamelen maandelijks de meetwaarden per uur afkomstig van meetinrichtingen bij de telemetriegrootverbruikers die
      rechtstreeks zijn aangesloten op hun net. De netbeheerder van het landelijk gastransportnet verzamelt maandelijks
      de meetwaarden per uur afkomstig van meetinrichtingen op de entrypunten met uurmeting en op de overige exitpunten
      met uurmeting.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De regionale netbeheerder maakt bij het samenstellen van de allocatiegegevens gebruik van gegevens, geregistreerd
      door meetinrichtingen bij verbruikers en systeemverbindingen en van het aansluitingenregister van het
      distributienet.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.2
  - number: 2.2.2.2
    text: |-
      De beheerder van een gesloten distributienet die heeft aangegeven gebruik te willen maken van de in deze code
      genoemde berichten, maakt bij het samenstellen van de allocatiegegevens gebruik van gegevens geregistreerd door
      meetinrichtingen bij verbruikers en van het aansluitingenregister van het gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.2
  - number: 2.2.2.3
    text: |-
      Voor exitpunten die de verbinding vormen tussen het landelijk gastransportnet en een regionaal gastransportnet
      maakt de netbeheerder van het landelijk gastransportnet bij het samenstellen van de allocatiegegevens gebruik van
      gegevens, geregistreerd door meetinrichtingen op de punten waar het landelijk gastransportnet is verbonden met
      een regionaal gastransportnet en van de door de regionale netbeheerder aangeleverde allocatiegegevens en van de
      allocatiegegevens die zijn aangeleverd door de beheerder van een gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.2
  - number: 2.2.2.4
    text: |-
      Voor exitpunten die gekoppeld zijn aan de aansluiting van een verbruiker op het landelijk gastransportnet maakt de
      netbeheerder van het landelijk gastransportnet bij het samenstellen van de allocatiegegevens gebruik van gegevens,
      geregistreerd door meetinrichtingen van de netbeheerder van het landelijk gastransportnet, van confirmaties en van
      zijn aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.2
  - number: 2.2.2.5
    text: |-
      Voor overige entry- en exitpunten maakt de netbeheerder van het landelijk gastransportnet bij het samenstellen
      van de allocaties gebruik van gegevens, geregistreerd door meetinrichtingen op deze entry- en exitpunten en van
      confirmaties.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.2
  - number: 2.2.3
    text: |-
      De regionale netbeheerder past bij het samenstellen van de allocatiegegevens afkomstig van meetinrichtingen van de
      op zijn net aangesloten profielgrootafnemers, de rekenregels toe van de methodiek Verbruiksprofielen, beschreven in
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 2.2.4
    text: |-
      Nadere regels voor het maandelijks uit te voeren allocatieproces zijn opgenomen in de [hoofdstukken 4][ref1] en
      [4a][ref2] en bijlage 2.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: 4a
  - number: 2.4.1.1
    text: |-
      De regionale netbeheerder verstrekt uiterlijk op de zesde werkdag na afloop van de maand waarop de gegevens
      betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.4.1
  - number: 2.4.1.2
    text: |-
      De beheerder van een gesloten distributienet die heeft aangegeven gebruik te willen maken van de in deze
      code genoemde berichten, verstrekt uiterlijk op de zevende werkdag na afloop van de maand waarop de gegevens
      betrekking hebben, de allocatiegegevens door middel van berichten aan de erkende programmaverantwoordelijke(n)
      en leverancier(s).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.4.1
  - number: 2.4.1.3
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt uiterlijk de zesde werkdag na afloop van de maand
      waarop de gegevens betrekking hebben, door middel van berichten aan erkende programmaverantwoordelijke(n) en
      leverancier(s) de allocatiegegevens, samengesteld op grond van de op het landelijk gastransportnet aangesloten
      verbruikers.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.4.1
  - number: 2.4.2
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.4.1][ref1]worden beschouwd als de
      voorlopige allocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.3
    text: |-
      Indien de regionale netbeheerder of de beheerder van een gesloten distributiesysteem die heeft aangegeven gebruik
      te willen maken van de in deze code genoemde berichten met betrekking tot een aansluiting niet tijdig of niet
      volledig meetgegevens heeft ontvangen van de erkende meetverantwoordelijke zal hij ten behoeve van de maandelijkse
      allocatie een schatting maken van het verbruik van de betreffende aansluiting voor de betreffende periode en dit
      verbruik vlak verdelen over de uren.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.4.3
  - number: 2.5.1
    text: |-
      De regionale netbeheerder en de beheerder van een gesloten distributiesysteem die gebruik wil maken van de in
      deze code genoemde berichten verstrekken uiterlijk op de zestiende werkdag na afloop van de maand waarop de
      gegevens betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s). De netbeheerder van het landelijk
      gastransportnet verstrekt uiterlijk op de zestiende werkdag na afloop van de maand waarop de gegevens betrekking
      hebben, door middel van berichten aan erkende programmaverantwoordelijke(n) en leverancier(s) de allocatiegegevens,
      samengesteld op grond van de op het landelijk gastransportnet aangesloten verbruikers. Voor de overige entry- en
      exitpunten verstrekt de netbeheerder van het landelijk gastransportnet de allocatiegegevens uiterlijk de zestiende
      werkdag na afloop van de maand waarop de gegevens betrekking hebben aan erkende programmaverantwoordelijke(n).
      Voor een balansrelatie op het virtuele handelspunt verstrekt de netbeheerder van het landelijk gastransportnet de
      allocatiegegevens aan erkende programmaverantwoordelijke(n) 2 werkdagen na de ontvangst van de door alle regionale
      beheerders aan de netbeheerder van het landelijk gastransportnet verstrekte allocatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.5.1
  - number: 2.5.2
    text: |-
      Indien een regionale netbeheerder niet in staat blijkt om allocatiegegevens aan te leveren binnen de in
      [2.5.1][ref1] gestelde termijn, kan de netbeheerder van het landelijk gastransportnet na overleg met betrokkenen
      – waaronder in elk geval worden begrepen de desbetreffende regionale netbeheerder en de betrokken erkende
      programmaverantwoordelijke(n) – de allocatie vaststellen met behulp van door de netbeheerder van het landelijk
      gastransportnet geschatte waardes.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.2a
    text: |-
      Indien een beheerder van een gesloten distributiesysteem die gebruik wil maken van de in deze code genoemde
      berichten niet in staat blijkt om allocatiegegevens aan te leveren binnen de in [2.5.1][ref1] gestelde termijn,
      zal de netbeheerder van het landelijk gastransportnet de allocatie vaststellen met behulp van door de regionale
      netbeheerder aangeleverde gegevens over de aansluiting van het gesloten distributiesysteem op het regionale
      distributienet.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.5.2a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.3
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.5.1][ref1] of [2.5.2][ref2] worden
      beschouwd als de definitieve allocatie die de basis vormt voor de financiële afwikkeling van handels- en/of
      transporttransacties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.1.1
    text: |-
      De regionale netbeheerder en de beheerder van een gesloten distributiesysteem die gebruik wil maken van de in
      deze code genoemde berichten verstrekken uiterlijk op de tiende werkdag van de vierde maand na afloop van de maand
      waarop de gegevens betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het
      landelijk gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.6.1
  - number: 2.6.1.2
    text: |-
      Voor een balansrelatie op het virtuele handelspunt verstrekt de netbeheerder van het landelijk gastransportnet
      de allocatiegegevens aan erkende programmaverantwoordelijke(n) twee werkdagen na de ontvangst van de door alle
      regionale beheerders aan de netbeheerder van het landelijk gastransportnet verstrekte allocatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.6.1
  - number: 2.6.2
    text: |-
      Indien een regionale netbeheerder niet in staat blijkt om allocatiegegevens aan te leveren binnen de in
      [2.6.1][ref1] gestelde termijn, kan de netbeheerder van het landelijk gastransportnet na overleg met betrokkenen
      – waaronder in elk geval worden begrepen de desbetreffende regionale netbeheerder en de betrokken erkende
      programmaverantwoordelijke(n) – de allocatie vaststellen met behulp van door de netbeheerder van het landelijk
      gastransportnet geschatte waardes.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.2a
    text: |-
      Indien een beheerder van een gesloten distributiesysteem die gebruik wil maken van de in deze code genoemde
      berichten niet in staat blijkt om allocatiegegevens aan te leveren binnen de in [artikel 2.6.1][ref1] gestelde
      termijn, zal de netbeheerder van het landelijk gastransportnet de allocatie vaststellen met behulp van door de
      regionale netbeheerder aangeleverde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.6.2a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.3
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.6.1][ref1] of [2.6.2][ref2] worden
      beschouwd als correcties op de definitieve allocatie, die de basis vormen voor correcties op de financiële
      afwikkeling van handels- en/of transporttransacties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.7.1
    text: |-
      De regionale netbeheerder en de beheerder van een gesloten distributiesysteem die gebruik wil maken van de
      berichten genoemd in deze code draagt er zorg voor dat informatie, die aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt verschaft, consistent is (inclusief de
      restvolumes en correctievolumes).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.7.1
  - number: 2.7.2
    text: |-
      De netbeheerder van het landelijk gastransportnet draagt er zorg voor dat informatie, die aan erkende
      programmaverantwoordelijken en leveranciers wordt verschaft, consistent is (inclusief de restvolumes en
      correctievolumes).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel2.7.2
  - number: '3.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet en de regionale netbeheerders voeren maandelijks de reconciliatie
      uit aan de hand van de door de meetverantwoordelijke voor aangeslotenen op de regionale gastransportnetten
      aangeleverde standen en verbruiken. De verrekening van de reconciliatie vindt tweemaal per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.1
  - number: '3.2'
    text: |-
      De regionale netbeheerders zenden uiterlijk op de negende werkdag van elke maand de reconciliatiegegevens
      door middel van berichten aan de netbeheerder van het landelijk gastransportnet en de betrokken erkende
      programmaverantwoordelijken en leveranciers. In aanmerking nemende dat de regionale netbeheerders de
      allocatiegegevens conform het bepaalde in [2.6.1][ref1] uiterlijk op de tiende werkdag verstrekken, voeren de
      regionale netbeheerders de maandelijkse reconciliatie uit in de periode tussen de tiende werkdag van elke maand en
      de negende werkdag van elke daaropvolgende maand. De regionale netbeheerder draagt er zorg voor dat informatie, die
      aan de netbeheerder van het landelijk gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt
      verschaft, consistent is.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '3.3'
    text: |-
      In uitzonderlijke gevallen kan de netbeheerder van het landelijk gastransportnet een regionale netbeheerder
      toestaan de reconciliatiegegevens na het in het [vorige artikel][ref1] gestelde tijdstip te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel3
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.4'
    text: |-
      Nadat alle regionale netbeheerders de gegevens ter beschikking hebben gesteld totaliseert de netbeheerder van het
      landelijk gastransportnet de aangeleverde te reconciliëren hoeveelheden gas en verrekent dit tweemaal per jaar met
      de betrokken erkende programmaverantwoordelijken. Dit betreft in principe een herverdeling van een reeds eerder
      berekende hoeveelheid gas, waarbij het saldo van de verrekening over een kalendermaand nul is. De reconciliatie
      betreft vooral een verrekening tussen erkende programmaverantwoordelijken, waarbij de netbeheerder van het
      landelijk gastransportnet een faciliterende rol speelt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.4
  - number: '3.5'
    text: |-
      De netbeheerder van het landelijk gastransportnet verzendt tweemaal per jaar, in april en in oktober, op uiterlijk
      de veertiende werkdag van de maand de debetfacturen naar de desbetreffende erkende programmaverantwoordelijken.
      Deze facturering is gebaseerd op de in de voorgaande kalendermaanden ontvangen reconciliatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.5
  - number: '3.6'
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt de creditfacturen op en verzendt deze, zo spoedig
      mogelijk doch uiterlijk binnen 14 werkdagen nadat alle debetfacturen zijn voldaan, naar de desbetreffende erkende
      programmaverantwoordelijken. Op deze creditnota’s zijn de betalingen op de debetnota’s verwerkt, die inmiddels door
      de netbeheerder van het landelijk gastransportnet zijn ontvangen. In het geval dat na 3 maanden na de verzending
      van de debetfacturen (nog) niet alle debetfacturen zijn betaald door de erkende programmaverantwoordelijken, zal
      de uitbetaling van de creditnota’s onder vermindering van het nog niet betaalde bedrag worden uitbetaald aan de
      erkende programmaverantwoordelijken. De uitbetaling van de creditfacturen (zo nodig onder aftrek van niet-betaalde
      debetfacturen) wordt door de netbeheerder van het landelijk gastransportnet uitgevoerd op de veertiende werkdag
      na de factuurdatum. Betalingen op debetfacturen, die door de netbeheerder van het landelijk gastransportnet zijn
      ontvangen nadat de creditfacturen zijn opgesteld, zullen worden verwerkt in gecorrigeerde creditfacturen, die door
      de netbeheerder van het landelijk gastransportnet de eerstvolgende keer zullen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.6
  - number: '3.7'
    text: |-
      Nadere regels voor het maandelijks uit te voeren reconciliatieproces zijn opgenomen in [paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '5'
  - number: 4.0.1
    text: |-
      Op aansluitingen van een verbruiker of een invoeder die zijn verbonden met een netgebied is slechts één erkende
      programmaverantwoordelijke toegestaan.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.0.1
  - number: 4.0.2
    text: |-
      Op exitpunten waar het landelijk gastransportnet is verbonden met een netgebied zijn meerdere erkende
      programmaverantwoordelijken toegestaan.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.0.2
  - number: 4.1.0
    text: |-
      De netbeheerder van het landelijk gastransportnet zorgt er voor dat de gegevens, die noodzakelijk zijn voor het
      uitvoeren van de near-real-time allocatie op exitpunten waar het landelijk gastransportnet is verbonden met een
      regionaal gastransportnet, uiterlijk vijf minuten na afloop van het uur in het Centraal Systeem Stuursignaal
      beschikbaar zijn. Indien B5.2 van toepassing is in situatie B5.2.4 zorgt de regionale netbeheerder die de
      meetinrichting beheert dat de gegevens, die noodzakelijk zijn voor het uitvoeren van de near-real-time allocatie
      op exitpunten waar het landelijk gastransportnet is verbonden met een regionaal gastransportnet, uiterlijk vijf
      minuten na afloop van het uur in het Centraal Systeem Stuursignaal beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.1.0
  - number: 4.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt de gegevens, die noodzakelijk zijn voor het uitvoeren
      van de maandelijkse allocatie, uiterlijk de vierde werkdag na afloop van de maand om 07.00 uur aan de regionale
      netbeheerder door middel van het bericht ‘MINFO’. Deze gegevens worden beschouwd als zijnde definitieve gegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Voor elk relevant netgebied worden voor elk uur van de betreffende periode de volgende gegevens verstrekt: - de
      gemeten hoeveelheid gas (uitgedrukt in MJ)
        - de calorische bovenwaarde van het gas
        - de voor de allocatie relevante gegevens betreffende de gaskwaliteit. Tevens wordt bij de maandelijkse allocatie
      restenergie verstrekt conform bijlage B3.1.1.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.1.3
  - number: 4.1a.1
    text: |-
      Uiterlijk de zesde werkdag na afloop van de maand verstrekt de regionale netbeheerder aan de beheerder van een
      gesloten distributiesysteem die heeft aangegeven gebruik te willen maken van de in deze code genoemde berichten
      en die op zijn netgebied is aangesloten voor elk uur van de betreffende periode de te gebruiken calorische
      bovenwaarde.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.1a.1
  - number: 4.1a.2
    text: |-
      De regionale netbeheerder gebruikt hiervoor de calorische waarde die hij heeft ontvangen van de netbeheerder van
      het landelijk transportnet of, indien van toepassing, de waarde die hij conform B5.6.13 heeft berekend.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.1a.2
  - number: 4.2.1
    text: |-
      De regionale netbeheerder voert voor elk relevant netgebied de off line allocatie uit. Daarvoor bepaalt de
      regionale netbeheerder voor elke verbruiker via welk netgebied het gas voor de verbruiker in het distributienet van
      de regionale netbeheerder wordt gevoed en legt dit vast in het aansluitingenregister. Ten behoeve van de near-real-
      time allocatie zorgt de regionale netbeheerder dat deze informatie ook dagelijks beschikbaar is in het Centraal
      Systeem Stuursignaal.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.2.1
  - number: 4.2.1a
    text: |-
      Met behulp van het Centraal Systeem Stuursignaal wordt voor elk relevant netgebied de near-real-time allocatie
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.2.1a
  - number: 4.2.2
    text: |-
      Bij het uitvoeren van de allocatie wordt er voor gezorgd dat de som van de verstrekte allocaties (betreffende
      de verbruikers) van een netgebied voor elk uur gelijk is aan de op het netgebied gemeten hoeveelheid gas van het
      desbetreffende uur.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.2.2
  - number: 4.3.1
    text: |-
      De allocaties worden samengesteld, gesommeerd per afnamecategorie, waarbij per verbruiker de afnamecategorie
      bepalend is welke in het aansluitingenregister is opgenomen.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1
  - number: 4.3.1.1
    text: |-
      Voor die profielafnemers, waarvoor met behulp van de verbruiksprofielenmethodiek het
      verbruik per uur wordt berekend, gelden de respectievelijke profielcategorieën volgens
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref1] als afnamecategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 4.3.1.2
    text: |-
      Toewijzing van afnamecategorieën door de regionale netbeheerder of de netbeheerder van het landelijk
      gastransportnet aan grootverbruikers gebeurt jaarlijks per 1 augustus op basis van de op dat moment bekende
      gegevens en de onderstaande toewijzingscriteria en is geldig vanaf 1 januari van het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.2
  - number: 4.3.1.2a
    text: |-
      Indien op grond van [4.3.1.2][ref1] de afnamecategorie van een aangeslotene wijzigt, informeert de netbeheerder,
      uiterlijk per 1 september volgend op de toewijzing, de betreffende aangeslotene, zijn meetverantwoordelijke en
      leverancier schriftelijk over de toegewezen afnamecategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.3
    text: |-
      Voor grootverbruikers met een gemiddelde jaarafname over de laatste 36 maanden groter dan 1.000.000 m3(n;35,17)
      of die beschikken over een aansluiting met een aansluitcapaciteit groter dan 2.500 m³(n;35,17) per uur wordt de
      afnamecategorie GGV gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.3
  - number: 4.3.1.4
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] bedoelde grootverbruikers, die beschikken over een uurlijks op afstand
      uitleesbare meetinrichting kan op verzoek van de aangeslotene de afnamecategorie GGV worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.5
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] of [4.3.1.4][ref2] bedoelde grootverbruikers met een gemiddelde jaarafname
      over de laatste 36 maanden groter dan 170.000 m3 (n;35,17) dan wel een verbruik over de laatste 12 maanden van
      meer dan 250.000 m3 (n;35,17) of die beschikken over een aansluiting met een aansluitcapaciteit groter dan 400
      m³(n;35,17) per uur wordt de afnamecategorie GXX gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.6
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] of [4.3.1.4][ref2] of [4.3.1.5][ref3] bedoelde grootverbruikers, die
      beschikken over een dagelijks op afstand uitleesbare meetinrichting kan op verzoek van de aangeslotene de
      afnamecategorie GXX worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.7
    text: |-
      Voor andere dan in [4.3.1.3][ref1] of [4.3.1.4][ref2] of [4.3.1.5][ref3] of [4.3.1.6][ref4] bedoelde
      grootverbruikers wordt de afnamecategorie G2C gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.8
    text: |-
      Voor een aansluiting op een regionaal gastransportnet waar gas in het gastransportnet gevoed wordt met een
      gemiddeld jaarvolume over de laatste 36 maanden groter dan 1.000.000 m3 (n;35,17) wordt de afnamecategorie GIS
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.8
  - number: 4.3.1.9
    text: |-
      Voor andere dan de in [4.3.1.8][ref1] bedoelde aansluitingen aan een regionaal gastransportnet waar gas in het
      gastransportnet gevoed wordt en die beschikken over een uurlijks op afstand uitleesbare meetinrichting kan op
      verzoek van de aangeslotene de afnamecategorie GIS worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.10
    text: |-
      Voor andere dan de in [4.3.1.8][ref1] en [4.3.1.9][ref2] bedoelde aansluitingen op een regionaal gastransportnet
      met een capaciteit groter dan 40 m³(n)/uur waar gas in het gastransportnet gevoed wordt, wordt afnamecategorie
      GIN gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.11
    text: |-
      Voor een aansluiting op een regionaal transportnet met een capaciteit kleiner dan of gelijk aan 40 m³(n)/uur waar
      gas in het gastransportnet gevoed wordt, wordt de afnamecategorie G2A gebruikt. Ten behoeve van de allocatie wordt
      het standaard jaarverbruik gelijkgesteld aan 0.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.11
  - number: 4.3.1.12
    text: |-
      Voor een aansluiting waar een netbeheerder het netverlies van een netgebied op administreert wordt de
      afnamecategorie GMN gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.12
  - number: 4.3.1.13
    text: |-
      Voor de indeling in afnamecategorieën van aansluitingen op een gesloten distributiesysteem, aangesloten op een
      regionaal gastransportnet, waarvan de beheerder van het gesloten distributiesysteem aangegeven heeft gebruik te
      willen maken van de in deze code genoemde berichten geldt dat:
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.a
    text: |-
      voor verbruikers met een gemiddelde jaarafname over de laatste 36 maanden groter dan 1.000.000 m3(n;35,17) de
      afnamecategorie GGV wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.b
    text: |-
      voor overige verbruikers die beschikken over een uurlijks op afstand uitleesbare meetinrichting, op verzoek van de
      aangeslotene, de afnamecategorie GGV kan worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.c
    text: voor overige verbruikers de afnamecategorie GXX wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.d
    text: |-
      voor een aansluiting waar gas in het gastransportnet gevoed wordt met een gemiddeld jaarvolume over de laatste 36
      maanden groter dan 1.000.000 m3(n;35,17) de afnamecategorie GIS wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.e
    text: |-
      voor andere aansluitingen waar gas in het gastransportnet gevoed wordt en die beschikken over een uurlijks op
      afstand uitleesbare meetinrichting, op verzoek van de aangeslotene, de afnamecategorie GIS wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.3.1.13.f
    text: voor overige aansluitingen waar gas in het gastransportnet gevoed wordt, de afnamecategorie GIN wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.3.1.13
  - number: 4.4.1
    text: |-
      De regionale netbeheerder stelt de allocatiegegevens per netgebied vast op grond van gegevens van de op zijn net
      aangesloten verbruikers. De regionale netbeheerder voert voor elk uur van de maand de allocatie uit. In bijlage
      2 (het allocatieproces door de RNB) zijn de door de regionale netbeheerder uit te voeren activiteiten stapsgewijs
      uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.4.1
  - number: 4.4.2
    text: |-
      De regionale netbeheerder is gehouden de samengestelde allocatiegegevens uitsluitend toe te wijzen aan tot het
      landelijk gastransportnet toegelaten erkende programmaverantwoordelijken met erkenning LB.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.4.2
  - number: 4.4.3
    text: |-
      Als de netbeheerder van het landelijk gastransportnet constateert dat (een gedeelte van) de door een regionale
      netbeheerder samengestelde allocatiegegevens zijn toegewezen aan niet-erkende programmaverantwoordelijken of aan
      erkende programmaverantwoordelijken zonder erkenning LB, zal de netbeheerder van het landelijk gastransportnet de
      betreffende regionale netbeheerder hierop wijzen en in de gelegenheid stellen de verstrekte gegevens te corrigeren.
      Indien de regionale netbeheerder de correctie niet binnen de in [2.6.1][ref1] gestelde termijn uitvoert, of indien,
      na correctie, de verstrekte allocatiegegevens nog niet voldoen aan het in hiervoor gestelde, zal de netbeheerder
      van het landelijk gastransportnet de regionale netbeheerder voor de desbetreffende allocatie beschouwen als een
      levering aan de regionale netbeheerder en derhalve de geleverde transportdienst volgens de standaard voorwaarden
      factureren aan de regionale netbeheerder, tenzij dit niet aan de regionale netbeheerder kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.5.1
    text: |-
      De restenergie wordt vastgesteld conform de [Meetcode gas LNB][ref1]. De wijze waarop de restenergie zal worden
      verwerkt in de allocatiegegevens is uitgewerkt in bijlage 3 (Verwerken van restenergie).


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 4.5.2
    text: In geval van de near-real-time allocatie wordt de restenergie op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.5.2
  - number: 4.6.0
    text: |-
      Verschillen tussen near-real-time allocaties en de allocaties op de 10e werkdag van de vierde maand na afloop
      van de maand worden verrekend via het settlement proces conform [4.1.6 van de Transportcode gas LNB][ref1]. Het
      portfolio onbalans signaal en het systeem balans signaal worden niet opnieuw berekend naar aanleiding van off line
      allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.1.6
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.0
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 4.1.6
  - number: 4.6.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet binnen drie maanden nadat de gegevens conform
      [4.1.2][ref1] verstuurd zijn, constateert dat een conform 4.1.2 en [4.1.3][ref2] aan de regionale netbeheerder
      beschikbaar gestelde uurhoeveelheid voor een netgebied of een hoeveelheid restenergie op een netgebied onjuist is,
      verstrekt de netbeheerder van het landelijk gastransportnet na overleg met de regionale netbeheerder aangepaste
      gegevens conform 4.1.2 en 4.1.3.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.6.2
    text: |-
      Indien een regionale netbeheerder binnen 80 dagen nadat de gegevens conform [2.5.1][ref1] verstuurd zijn,
      vaststelt dat een door hem samengesteld allocatiegegeven onjuist is, zal de daaruit voortvloeiende correctie worden
      uitgevoerd in het allocatieproces conform [2.6.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.6.3
    text: |-
      Erkende programmaverantwoordelijken en leveranciers zijn gehouden de conform de [artikelen 2.4.1][ref1] en
      [2.5.1][ref2] door de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet verstrekte
      gegevens bij ontvangst te controleren op plausibiliteit en eventuele vermeende fouten zo spoedig mogelijk, doch in
      elk geval vijf werkdagen vóór de verstrekking van nieuwe gegevens conform respectievelijk de artikelen 2.4.1, 2.5.1
      en [2.6.1][ref3], te melden bij de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet en,
      in geval van vermeende fouten in de meting, bij de partij die de meting verricht, opdat deze fouten gecorrigeerd
      kunnen worden vóór de verstrekking van nieuwe gegevens conform respectievelijk de artikelen 2.4.1, 2.5.1 en 2.6.1.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.6.4
    text: |-
      Indien een regionale netbeheerder vaststelt dat een door hem samengesteld allocatiegegeven, dat betrekking heeft
      op (een uur van) een maand binnen de reconciliatieperiode, onjuist is, zal de daaruit voortvloeiende correctie (de
      zogenaamde correctie-energie) worden uitgevoerd in het reconciliatieproces. Deze correcties kunnen alleen worden
      uitgevoerd ingeval de correctie betrekking heeft op een binnen de reconciliatieperiode vallende periode.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.4
  - number: 4.6.5
    text: |-
      De wijze waarop de correctie-energie zal worden verwerkt in de reconciliatiegegevens is uitgewerkt in bijlage 4
      (Verwerken van correctie-energie).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.6.5
  - number: 4.7.1
    text: |-
      De allocatieregels richten zich op de normale omstandigheden. Een strikte toepassing van de regels kan in
      bijzondere omstandigheden leiden tot onbetrouwbare uitkomsten van het allocatieproces. Een aantal van deze
      bijzondere situaties, inclusief de te volgen werkwijze bij de allocatie, zijn beschreven in bijlage 5 (Bijzondere
      omstandigheden). In overige uitzonderingssituaties, indien deze het allocatieproces dreigen te verstoren, beslist
      de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet, na overleg met betrokkenen.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.7.1
  - number: 4.8.1
    text: |-
      Van regionale netbeheerder naar de netbeheerder van het landelijk gastransportnet, betreffende erkende
      programmaverantwoordelijken en leveranciers: Voor elk relevant Netgebied: de berekende meetcorrectiefactor;
      hiervoor wordt het bericht ‘CINFO’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.8.1
  - number: 4.8.2
    text: |-
      Van de regionale netbeheerder respectievelijk de beheerder van een gesloten distributiesysteem die gebruik wil
      maken van de berichten genoemd in deze code naar de netbeheerder van het landelijk gastransportnet: Voor elk
      relevant netgebied respectievelijk gesloten distributiesysteem: de gesommeerde allocaties voor elke voorkomende
      combinatie van erkende programmaverantwoordelijken, leverancier en afnamecategorie wordt het bericht ‘LALL’
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.8.2
  - number: 4.8.3
    text: |-
      Van de regionale netbeheerder respectievelijk de beheerder van een gesloten distributiesysteem die gebruik wil
      maken van de berichten genoemd in deze code naar desbetreffende erkende programmaverantwoordelijken: Voor elk
      relevant netgebied respectievelijk gesloten distributiesysteem: de gesommeerde allocaties voor de desbetreffende
      erkende programmaverantwoordelijke voor elke voorkomende combinatie met een leverancier en afnamecategorie wordt
      het bericht ‘LALL’ gebruikt. Van de netbeheerder van het landelijk gastransportnet naar desbetreffende erkende
      programmaverantwoordelijken: Bij een verbruiker met een aansluiting op het landelijk gastransportnet, voor elk
      relevant netgebied: de gesommeerde allocaties voor de desbetreffende erkende programmaverantwoordelijke voor elke
      voorkomende combinatie met een leverancier en afnamecategorie wordt het bericht ‘LALL’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.8.3
  - number: 4.8.4
    text: |-
      Van de regionale netbeheerder respectievelijk de beheerder van een gesloten distributiesysteem die gebruik wil
      maken van de berichten genoemd in deze code naar desbetreffende leveranciers: - voor elk relevant netgebied
      respectievelijk gesloten distributiesysteem: de gesommeerde allocaties voor de desbetreffende leverancier voor
      elke voorkomende combinatie met een erkende programmaverantwoordelijke en afnamecategorie wordt het bericht ‘LALL’
      gebruikt;
        - voor elke telemetriegrootverbruiker: de gealloceerde uurhoeveelheid; hiervoor wordt het bericht ‘BALL’ gebruikt.
      Van de netbeheerder van het landelijk gastransportnet naar desbetreffende leveranciers geldt dat: - bij een
      verbruiker met een aansluiting op het landelijk gastransportnet: de gesommeerde allocaties voor de desbetreffende
      leverancier voor elke voorkomende combinatie met een erkende programmaverantwoordelijke en afnamecategorie wordt
      het bericht ‘LALL’ gebruikt;
        - voor elke telemetriegrootverbruiker: de gealloceerde uurhoeveelheid; hiervoor wordt het bericht ‘BALL’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.8.4
  - number: 4.9.1
    text: |-
      Ten behoeve van de allocatie van het netverlies, berekent de regionale netbeheerder jaarlijks voor 1 oktober per
      netgebied het te alloceren netverlies per uur voor het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.1
  - number: 4.9.2
    text: |-
      Uiterlijk op de vijfde werkdag in oktober publiceert de netbeheerder het te alloceren netverlies, bedoeld in het
      eerste lid, op elektronische wijze op een publiek toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.2
  - number: 4.9.3
    text: Bij de berekening, bedoeld in het eerste lid, volgt de netbeheerder achtereenvolgens de volgende stappen.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.a
    text: |-
      De netbeheerder berekent per netgebied voor elke maand van het eerstvolgende kalenderjaar het gemiddelde
      gerealiseerde netverlies per maand van de drie meest recente volledig gereconcilieerde kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.b
    text: |-
      Met het gemiddelde gerealiseerde netverlies als bedoeld in onderdeel a berekent de netbeheerder voor zijn gehele
      verzorgingsgebied:
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.b.1
    text: de som van het netverlies per maand;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.b.2
    text: de som van het netverlies per jaar;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.b.3
    text: de som van het netverlies per jaar voor zover de som van het netverlies per maand bedoeld in sub 1° positief is.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.c
    text: |-
      De netbeheerder berekent een jaarcorrectiefactor door de som van het netverlies per jaar bedoeld in onderdeel b,
      sub 2° te delen door de som van het netverlies per jaar bedoeld in onderdeel b, sub 3°.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.d
    text: |-
      Indien de som van het netverlies per maand bedoeld in onderdeel b, sub 1° negatief is, stelt de netbeheerder het te
      alloceren netverlies voor die maand in alle netgebieden gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.e
    text: |-
      Per maand, per netgebied waarvan de netbeheerder het netverlies niet gelijk heeft gesteld aan nul op grond van
      onderdeel d, berekent de netbeheerder een gecorrigeerd netverlies door het gemiddelde gerealiseerde netverlies per
      maand, bedoeld in onderdeel a, te vermenigvuldigen met de jaarcorrectiefactor.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.f
    text: |-
      Met het gecorrigeerde netverlies bedoeld in onderdeel e berekent de netbeheerder voor zijn gehele
      verzorgingsgebied:
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.f.1
    text: de som van het gecorrigeerde netverlies per maand;
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.f.2
    text: de som van het gecorrigeerde netverlies per maand voor zover het gecorrigeerde netverlies positief is.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.g
    text: |-
      De netbeheerder berekent per maand een maandcorrectiefactor door de som van het gecorrigeerde netverlies bedoeld in
      onderdeel f, sub 1° te delen door de som van het gecorrigeerde netverlies bedoeld in onderdeel f, sub 2°.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.h
    text: |-
      Voor elke maand waarin het gecorrigeerde netverlies, bedoeld in onderdeel e, negatief is, stelt de netbeheerder het
      te alloceren netverlies gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.i
    text: |-
      Voor de maanden waarin het gecorrigeerde netverlies niet gelijk is gesteld aan nul op grond van onderdeel h,
      berekent de netbeheerder het te alloceren netverlies per maand per netgebied door het gecorrigeerde netverlies,
      bedoeld in onderdeel e, te vermenigvuldigen met de maandcorrectiefactor.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.3.j
    text: |-
      De netbeheerder berekent voorts het te alloceren netverlies per netgebied, per uur door het te alloceren
      netverlies per maand, zoals berekend op basis van de voorgaande stappen te vermenigvuldigen met het quotiënt van
      de profielfractie van het G2C-profiel bij standaardtemperatuur van het betreffende uur en de som van dezelfde
      profielfracties van de betreffende gasmaand.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.3
  - number: 4.9.4
    text: |-
      Bij de berekening van het gerealiseerde netverlies bedoeld in het eerste lid, houdt de netbeheerder rekening
      met historische verschillen in de berekeningswijze van de volumeherleiding. Dit houdt in ieder geval in dat de
      netbeheerder voor de periode vanaf 1 januari 2015 tot en met 31 december 2016 de reconciliatieresultaten corrigeert
      op basis van een MMCF van 1, een volumeherleidingsfactor van 0,99203 voor de afnamecategorieën G1A en G2A en
      een volumeherleidingsfactor van 1 voor de afnamecategorie G2C, waarbij verondersteld wordt dat elk volume in het
      kleinverbruiksegment tot stand is gekomen met de administratieve volumeherleiding.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4.9.4
  - number: 4a.1.1
    text: |-
      In beginsel is de allocatie gelijk aan de confirmatie. Indien de meting ongelijk is aan de som van de
      confirmaties, wordt het verschil tussen de meting en de som van de confirmaties gealloceerd volgens
      [artikelen 4a.1.1.1 tot en met 4a.1.1.3][ref1]. Hierbij geeft de netbeheerder van het landelijk gastransportnet
      op alle overige entry- en exitpunten aan de erkende programmaverantwoordelijken de keuze tussen de allocatierollen
      Balancerend en Proportioneel.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.1.1
    text: |-
      Indien er op een entry- of exitpunt voor het uur waarvoor de allocatie wordt uitgevoerd een OBA, als bedoeld in
      [artikel 5.1.8 van de Invoedcode gas LNB](onbekend), actief is, wordt voor dat uur het verschil tussen de meting
      en de som van de confirmaties toegekend aan de OBA. Indien een OBA actief wordt op een entry- of exitpunt, krijgen
      alle portfolio’s op dat entry- of exitpunt de allocatierol Proportioneel. De netbeheerder van het landelijk
      gastransportnet publiceert op haar website op welke entry- en exitpunten een OBA actief is. Indien een OBA
      inactief of niet aanwezig is, wordt het verschil tussen de meting en de som van de confirmaties gealloceerd conform
      [artikel 4a.1.1.2][ref1] of [4a.1.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.1.2
    text: |-
      Indien er op een entry- of exitpunt één of meerdere portfolio(s) met de allocatierol Balancerend aanwezig zijn,
      geldt het volgende. Het verschil tussen de meting en de som van de confirmaties wordt toegekend aan de portfolio’s
      met de allocatierol Balancerend waarvan de richting van de gasstroom overeenkomt met de richting van de gasstroom
      van het verschil tussen de meting en de som van de confirmaties. Het verschil wordt pro rata aan de confirmaties
      toegekend aan deze portfolio’s. De allocatie is dan gelijk aan de confirmatie plus het pro rata bepaalde verschil.
      Indien er geen portfolio met de allocatierol Balancerend is waarvan de richting van de gasstroom overeenkomt met
      de richting van de gasstroom van het verschil tussen de meting en de som van de confirmaties, wordt het verschil
      tussen de meting en de som van de confirmaties gealloceerd conform [artikel 4a.1.1.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.1.3
    text: |-
      Indien er op een entry- of exitpunt geen OBA actief is en de allocatierol Balancerend ook niet voorkomt, geldt het
      volgende. Het verschil tussen de meting en de som van de confirmaties wordt toegekend aan de portfolio’s waarvan de
      confirmatie dezelfde richting van de gasstroom heeft als de meting. Het verschil wordt pro rata aan de betreffende
      confirmaties toegekend aan deze portfolio’s. De allocatie is dan gelijk aan de confirmatie plus het pro rata
      bepaalde verschil.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.1.3
  - number: 4a.1.2
    text: |-
      Indien een erkende programmaverantwoordelijke volgens [4a.1.1][ref1] op een entry- of exitpunt de keuze heeft
      tussen verschillende allocatierollen, zal de erkende programmaverantwoordelijke de netbeheerder van het landelijk
      gastransportnet per entry- en exitpunt schriftelijk melden welke allocatierol hij zal vervullen. Indien de
      netbeheerder van het landelijk gastransport deze informatie niet uiterlijk 5 werkdagen voor aanvang van de
      programmaverantwoordelijkheid op het betreffende entry- of exitpunt ontvangt zal de netbeheerder van het landelijk
      gastransportnet aan de erkende programmaverantwoordelijke de rol proportioneel toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.3
    text: |-
      Indien een erkende programmaverantwoordelijke kiest voor de allocatierol balancerend terwijl er al een andere
      balancerende erkende programmaverantwoordelijke op het entry- of exitpunt aanwezig is, zal de netbeheerder
      van het landelijk gastransportnet in overleg gaan met zowel de oorspronkelijke balancerende erkende
      programmaverantwoordelijke als de nieuwe balancerende erkende programmaverantwoordelijke, met als resultaat een van
      de volgende situaties:
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.3
  - number: 4a.1.3.1
    text: Beide erkende programmaverantwoordelijken krijgen de allocatierol balancerend.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.3
  - number: 4a.1.3.2
    text: Een van beide partijen verandert zijn allocatierol in proportioneel.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.3
  - number: 4a.1.4
    text: |-
      Indien de gecontracteerde entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/of
      exitcapaciteit wordt overgedragen aan een andere erkende programmaverantwoordelijke dan wordt de allocatierol ook
      overgedragen, tenzij de ontvangende erkende programmaverantwoordelijke anders aangeeft. Indien de gecontracteerde
      entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/of exitcapaciteit gedeeltelijk
      wordt overgedragen, zullen de betrokken erkende programmaverantwoordelijken handelen volgens [4a.1.2][ref1].
      Indien de gecontracteerde entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/
      of exitcapaciteit wordt overgedragen aan een andere erkende programmaverantwoordelijke die reeds actief is
      op het betreffende entry- en/of exitpunt, dan wordt de vigerende allocatierol van de ontvangende erkende
      programmaverantwoordelijke toegepast op de extra entry- en/of exitcapaciteit, tenzij anders aangegeven volgens
      4a.1.2.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.5
    text: |-
      Indien uitvoering van de [artikelen 4a.1.2][ref1], [4a.1.3][ref2] en [4a.1.4][ref3] niet uiterlijk 5 werkdagen
      voor aanvang van de programmaverantwoordelijkheid op het betreffende entry- en/of exitpunt leiden tot een
      uitvoerbaar allocatiealgoritme zal de netbeheerder van het landelijk gastransportnet de betrokken erkende
      programmaverantwoordelijken een allocatierol toedelen en deze hierover informeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
      - id: ref3
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.6
    text: |-
      Binnen de condities van [artikel 4a.2][ref1] is een erkende programmaverantwoordelijke bevoegd zijn allocatierol
      te wijzigen volgens de volgende regels. De erkende programmaverantwoordelijke zal de netbeheerder van het landelijk
      gastransportnet zijn nieuwe allocatierol schriftelijk melden. Deze nieuwe allocatierol zal in werking treden
      op de eerste gasdag van de eerstkomende gasmaand, rekening houdend met een verwerkingstijd van 5 werkdagen door
      de netbeheerder van het landelijk gastransportnet na ontvangst van de melding, tenzij anders overeen gekomen.
      Indien ten gevolge van voorgenoemde melding, of ten gevolge van het niet langer contracteren van entry- en/
      of exitcapaciteit door een erkende programmaverantwoordelijke met de allocatierol balancerend, niet langer een
      erkende programmaverantwoordelijke met de allocatierol balancerend op een entry- en/of exitpunt aanwezig is, zal
      de netbeheerder van het landelijk gastransportnet de andere erkende programmaverantwoordelijken op het betreffende
      entry- en/of exitpunt uiterlijk drie werkdagen voordat de wijziging in werking treedt schriftelijk op de hoogte
      brengen. Indien ten gevolge van een wijziging van de allocatierol van een erkende programmaverantwoordelijke of
      ten gevolge van de aanvang van het contracteren door een erkende programmaverantwoordelijke met de allocatierol
      balancerend, een erkende programmaverantwoordelijke met de allocatierol balancerend actief wordt op een entry- en/
      of exitpunt, zal de netbeheerder van het landelijk gastransportnet de andere erkende programmaverantwoordelijken op
      het betreffende entry- en/of exitpunt uiterlijk drie werkdagen voordat de wijziging in werking treedt schriftelijk
      op de hoogte brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: 4a
        paragraaf: 4a.2
  - number: 4a.1.7
    text: |-
      De netbeheerder van het landelijk gastransportnet zal per entry- en exitpunt per erkende programmaverantwoordelijke
      de allocatierol opnemen in zijn administratie. Deze informatie is opvraagbaar voor erkende
      programmaverantwoordelijken die actief zijn op de betreffende entry- en/of exitpunten en zal verstrekt worden
      rekening houdend met belangen van alle betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.1.7
  - number: 4a.2.4
    text: |-
      Allocatie op het TTF Op het TTF geldt dat de gealloceerde hoeveelheid gelijk is aan de geconfirmeerde hoeveelheid;
      een uitzondering hierop is de balansrelatie.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.2.4
  - number: 4a.2.5
    text: |-
      Balansrelatie op het TTF

      In een balansrelatie wordt de op het TTF gealloceerde hoeveelheid tussen één of meer balansleverende- en één
      balansontvangende erkende programmaverantwoordelijke bepaald op basis van de fysieke levering op binnenlandse
      verbruikspunten in een portfolio van de balansontvangende erkende programmaverantwoordelijke. Met behulp van de
      balansrelatie kan daarmee onbalansrisico op binnenlandse verbruikspunten over één- of meerdere balansleverende
      partijen verdeeld worden.

      De gealloceerde hoeveelheid wordt bepaald door de inzet van één of meer van de onderstaande varianten:

      Een balansleverende- en een balansontvangende erkende programmaverantwoordelijke kunnen een balansrelatie beperken
      tot een of meer gespecificeerde afnamecategorieën binnen het gemeten verbruik binnen de balansontvangende erkende
      programmaverantwoordelijke.

      De verdeling van de fysieke levering vindt plaats op basis van een vooraf door de balansleverende- en een
      balansontvangende erkende programmaverantwoordelijken genomineerd en geconfirmeerd percentage.

      De gealloceerde hoeveelheid op het TTF tussen een balansleverende en een balansontvangende erkende
      programmaverantwoordelijke heeft een vooraf gespecificeerde bovengrens.

      De gealloceerde hoeveelheid op het TTF tussen een balansleverende en een balansontvangende erkende
      programmaverantwoordelijke heeft een vooraf gespecificeerde ondergrens waaronder geen overdracht plaats heeft.

      Voor de toepassing van een balansrelatie op het TTF:

      – staat de balansontvangende partij als erkende programmaverantwoordelijke in het aansluitingenregister van de
      betreffende netbeheerder vermeld – wordt de overdracht tussen de balansleverende en de balansontvangende partij
      geacht plaats te vinden bij de fysieke exit. – worden de realisaties van de balansleverende partij onder de
      balansrelatie beschouwd als exitallocaties.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.2.5
  - number: 4a.3.1
    text: |-
      Erkende programmaverantwoordelijken op een entry- en/of exitpunt kunnen de netbeheerder van het landelijk
      gastransportnet verzoeken de allocatie op het betreffende entry- en/of exitpunt door een andere partij te laten
      uitvoeren. De netbeheerder van het landelijk gastransportnet en de betreffende erkende programmaverantwoordelijken
      dienen vooraf overeenstemming te bereiken over de werkwijze. Als voorwaarde geldt dat de gemeten hoeveelheid
      energie en de som van de allocaties voor het betreffende entry- en/of exitpunt voor elk uur exact overeen dienen
      te komen; tevens geldt dat het tijdstip van beschikbaarstelling van de allocaties aan de netbeheerder van het
      landelijk gastransportnet overeen dient te komen met 2 minuten voor het in [2.0.3][ref1] genoemde tijdstip voor de
      near-real-time allocaties en met 2 werkdagen voor het in [2.5][ref2] genoemde moment voor de definitieve off line
      allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 4a.3.2
    text: |-
      Indien de netbeheerder van het landelijk gastransport niet conform [4a.3.1][ref1] en de overige met die andere
      partij gemaakte afspraken de allocaties krijgt aangeleverd, zal de netbeheerder van het landelijk gastransportnet
      zelf die allocaties voor het betreffende entry- en/of exitpunt bepalen in overeenstemming met het bepaalde in deze
      Allocatiecode gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: 4a.3
  - number: 4a.4.1
    text: |-
      Verschillen tussen near-real-time allocaties en de definitieve allocaties worden verrekend via het settlement
      proces conform [4.1.6 van de Transportcode gas LNB][ref1]. Het portfolio onbalans signaal en het systeem balans
      signaal worden niet opnieuw berekend naar aanleiding van off line allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.1.6
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 4.1.6
  - number: 4a.4.2
    text: |-
      Erkende programmaverantwoordelijken zijn gehouden de conform [artikel 2.4.1][ref1] door de netbeheerder van het
      landelijk gastransportnet verstrekte gegevens bij ontvangst te controleren op plausibiliteit en eventuele vermeende
      fouten zo spoedig mogelijk te melden bij de netbeheerder van het landelijk gastransportnet en, in geval van
      vermeende fouten in de meting, bij de partij die de meting verricht, opdat deze fouten gecorrigeerd kunnen worden
      binnen de termijn zoals genoemd in [2.5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 4a.4.3
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet binnen de termijn zoals genoemd in [2.5.1][ref1] vaststelt
      dat een door hem samengesteld allocatiegegeven onjuist is, zal de netbeheerder van het landelijk gastransportnet:
        - informatie verstrekken over de correctie aan de erkende programmaverantwoordelijke met betrekking tot de
      aansluiting waarop de gecorrigeerde uurwaarde betrekking heeft;
        - een correctie uitvoeren op de gealloceerde uurhoeveelheid binnen de termijn zoals genoemd in [2.5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel4a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 5.1.1
    text: |-
      De regionale netbeheerders voeren de reconciliatie uit per netgebied. De regionale netbeheerders zorgen er voor
      dat tijdens het uitvoeren van het reconciliatieproces (gegevens van de) verbruikers aan hetzelfde netgebied zijn
      ‘gekoppeld’ als ten tijde van het uitvoeren van het allocatieproces.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.1.1
  - number: 5.1.2
    text: |-
      Voor elke profielafnemer waarvoor bij het samenstellen van de allocatiegegevens gedurende (een deel van) de
      reconciliatieperiode het verbruik per uur met behulp van de verbruiksprofielenmethodiek is berekend, berekent
      de regionale netbeheerder tijdens het reconciliatieproces het verbruik. De door de regionale netbeheerders uit
      te voeren bewerkingen zijn gespecificeerd in paragraaf B6.2 van bijlage 6 (Rekenregels reconciliatie). Van de
      verbruikers waarvoor slechts gedurende een gedeelte van de reconciliatieperiode het verbruik per uur met behulp
      van de verbruiksprofielenmethodiek is berekend, worden uitsluitend de gegevens van het desbetreffende deel van de
      reconciliatieperiode berekend conform het bepaalde in paragraaf B6.2 van bijlage 6 (Rekenregels reconciliatie).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.1.2
  - number: 5.1.3
    text: |-
      Voor elke verbruiker waarvoor de in het vorige artikel genoemde voorwaarden niet gelden, berekent de regionale
      netbeheerder tijdens het reconciliatieproces het verbruik per uur. De door de regionale netbeheerder uit te
      voeren bewerkingen zijn gespecificeerd in paragraaf B6.3 van bijlage 6 (Rekenregels reconciliatie). Van de
      verbruikers waarvoor slechts gedurende een gedeelte van de reconciliatieperiode het verbruik per uur met behulp
      van de verbruiksprofielenmethodiek is berekend, berekent de regionale netbeheerder de gegevens van het deel van
      de reconciliatieperiode dat niet met behulp van de verbruiksprofielenmethodiek is bepaald, conform het bepaalde
      paragraaf B6.3 van bijlage 6 (Rekenregels reconciliatie).
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.1.3
  - number: 5.1.4
    text: |-
      Nadat de berekeningen voor alle relevante verbruikers door de regionale netbeheerder zijn uitgevoerd, berekent
      de regionale netbeheerder het netverlies van de desbetreffende maand van het desbetreffende netgebied, zoals
      uitgewerkt in paragraaf B6.4 van bijlage 6 (Rekenregels reconciliatie). De regionale netbeheerder informeert de
      betrokken erkende programmaverantwoordelijken en leveranciers over het netverlies.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.1.4
  - number: 5.1.5
    text: |-
      De regionale netbeheerder berekent voor elk netgebied voor iedere erkende programmaverantwoordelijke /leverancier
      combinatie voor elke kalendermaand de door de in [5.1.2][ref1] en [5.1.3][ref2] bedoelde verbruikers afgenomen
      hoeveelheid energie. Dit is het maandtotaal per erkende programmaverantwoordelijke /leverancier combinatie. De
      wijze van berekening is beschreven in paragraaf B6.5 van bijlage 6 (Rekenregels reconciliatie).


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel5
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.1
    text: |-
      Nadat de reconciliatiegegevens door alle regionale netbeheerders zijn aangeleverd sommeert de netbeheerder
      van het landelijk gastransportnet deze aangeleverde reconciliatiegegevens tot een met de betreffende erkende
      programmaverantwoordelijke te verrekenen hoeveelheid per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.2.1
  - number: 5.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt per kalendermaand de verrekenprijs. Als verrekenprijs zal
      de maandgemiddelde prijs worden gebruikt van de in [artikel 4.1.6.4 van de Transportcode gas LNB][ref1] bepaalde
      gasprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
  - number: 5.3.1
    text: |-
      Door regionale netbeheerder aan de netbeheerder van het landelijk gastransportnet, betreffende erkende
      programmaverantwoordelijken en leveranciers: Voor elk netgebied: per kalendermaand per afnamecategorie voor elke
      voorkomende erkende programmaverantwoordelijke /leverancier combinatie de tijdens het lopende reconciliatieproces
      vastgestelde totale hoeveelheid gas (uitgedrukt in MJ), de totale hoeveelheid gas vóór de uitvoering van dit
      reconciliatieproces, alsmede het netverlies van de desbetreffende maand; hiervoor wordt het bericht ‘RNINFO’
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.3.1
  - number: 5.3.2
    text: |-
      Door de netbeheerder van het landelijk gastransportnet aan de betreffende erkende programmaverantwoordelijken:
      Per kalendermaand de te reconciliëren hoeveelheid gas (verschil tussen de tijdens het lopende reconciliatieproces
      vastgestelde totale hoeveelheid gas en de totale hoeveelheid gas vóór de uitvoering van dit reconciliatieproces),
      uitgedrukt in MJ, en het bij deze hoeveelheid behorende factuurbedrag; hiervoor wordt het bericht ‘RSINFO’
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.3.2
  - number: 5.3.3
    text: |-
      Door de netbeheerder aan de leveranciers: Per gereconcilieerde aansluiting per kalendermaand het toegerekende
      volume, het verbruik dat aanleiding is geweest voor de toerekening van de volumes, de afnamecategorie en het
      standaardjaarverbruik gas die zijn toegepast in de toerekening aan de desbetreffende leverancier.
    url: https://wetten.overheid.nl/BWBR0037931/2025-05-08#Artikel5.3.3
  - number: '6.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet voert maandelijks de settlement uit aan de hand van de near-real-
      time allocaties per uur conform [2.0][ref1], de definitieve allocatiegegevens conform [2.5][ref2] en de correcties
      op de definitieve allocatiegegevens conform [2.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
