$id: allocatiecode_gas
regulatory_layer: WET
publication_date: '2026-02-20'
valid_from: '2019-07-04'
bwb_id: BWBR0037931
url: https://wetten.overheid.nl/BWBR0037931/2019-07-04
preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Het bepaalde in deze code betreft het proces van allocatie ten behoeve van erkende programmaverantwoordelijken
      en leveranciers op grond van gegevens van aangeslotenen op de regionale gasttransportnetten en op het landelijk
      gastransportnet, alsmede de daarbij behorende instrumenten en informatiestromen.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel1.1.1
  - number: 1.1.2
    text: |-
      Begrippen, die in de [Gaswet][ref1] of de Begrippencode gas zijn gedefinieerd, hebben de in de Gaswet of
      [Begrippencode gas][ref2] gedefinieerde betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
  - number: 1.1.3
    text: |-
      Onder off line allocatie wordt binnen deze code verstaan de maandelijkse allocatie op de 6e en 16e werkdag na
      afloop van de maand en de 10e werkdag van de vierde maand na afloop van de maand.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel1.1.3
  - number: 2.0.1
    text: |-
      De netbeheerder van het landelijk gastransportnet verzamelt elk uur, kort na het volle uur, voor alle entry- en
      exitpunten met een jaarlijkse hoeveelheid gemeten gas ≥ 170.000 m3 de meetwaarden per uur.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.1
  - number: 2.0.2
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt uiterlijk 5 minuten na afloop van het uur waarop
      de gegevens betrekking hebben, aan erkende programmaverantwoordelijke(n) de near-real-time allocatiegegevens,
      samengesteld op grond van de conform [2.0.1][ref1] verzamelde meetwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.1
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.3
    text: |-
      In afwijking van [2.0.2][ref1] verstrekt de netbeheerder van het landelijk gastransportnet aan erkende
      programmaverantwoordelijke(n) de near-real-time allocatiegegevens, samengesteld op grond van de conform
      [2.0.1][ref2] verzamelde meetwaarden voor de exitpunten waar het landelijk gastransportnet is verbonden met een
      regionaal gastransportnet uiterlijk 15 minuten na afloop van het uur waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.2
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.0.1
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.4
    text: |-
      Voor informatieve doeleinden verzamelt de netbeheerder van het landelijk gastransportnet de in [2.0.1][ref1]
      genoemde meetwaarden ook voor alle intervallen van 5 minuten binnen een uur. Indien de netbeheerder van het
      landelijk gastransportnet niet tijdig een in 2.0.1 genoemde meetwaarde voor een uur beschikbaar heeft, gebruikt de
      netbeheerder van het landelijk gastransportnet in plaats van de uurwaarde een lineaire extrapolatie van de laatst
      ontvangen 5 minuten waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.1
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.5
    text: |-
      Indien de in [2.0.4][ref1] genoemde 5 minuten waarde niet beschikbaar is gebruikt de netbeheerder van het landelijk
      gastransportnet de laatst beschikbare uurwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.4
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.4
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.6
    text: |-
      Met behulp van het Centraal Systeem Stuursignaal wordt, uitgaande van de meetwaarden afkomstig van meetinrichtingen
      op de exitpunten waar het landelijk gastransportnet is verbonden met een regionaal gastransportnet, elk uur,
      kort na het volle uur, de allocatie van de meetwaarde per erkende programmaverantwoordelijke per netgebied per
      afnamecategorie uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.6
  - number: 2.0.7
    text: |-
      Bij het bepalen van de allocaties conform [2.0.6][ref1] wordt gebruik gemaakt van gegevens, geregistreerd door
      meetinrichtingen bij aangeslotenen die voorzien zijn van afnamecategorie GGV en GIS en die zijn aangesloten op een
      regionaal gastransportnet en van het aansluitingenregister van de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.6
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.6
        hoofdstuk: '2'
        paragraaf: '2.0'
  - number: 2.0.8
    text: |-
      Bij het samenstellen conform [2.0.6][ref1] van de allocatiegegevens van aangeslotenen op gastransportnetten
      van regionale netbeheerders niet behorende tot de afnamecategorie GGV of GIS of met de afnamecategorie
      GGV of GIS, maar waarvoor geen meetwaarden zijn aangeleverd, worden de rekenregels toegepast
      van de methodiek Verbruiksprofielen, beschreven in respectievelijk bijlage 1a van deze code en
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.8
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.6
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 2.0.9
    text: |-
      Nadere regels voor het uit te voeren allocatieproces zijn opgenomen in de [hoofdstukken 4][ref1] en [4a][ref2] en
      in bijlage 2a.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.0.9
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: 4a
  - number: 2.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet en de regionale netbeheerders verzamelen maandelijks de
      meetwaarden per uur afkomstig van meetinrichtingen bij de telemetriegrootverbruikers die rechtstreeks zijn
      aangesloten op hun net. De netbeheerder van het landelijk gastransportnet verzamelt maandelijks de meetwaarden per
      uur afkomstig van meetinrichtingen op de entrypunten met uurmeting en op de overige exitpunten met uurmeting
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.2.1
  - number: 2.2.2
    text: |-
      De regionale netbeheerder maakt bij het samenstellen van de allocatiegegevens gebruik van gegevens, geregistreerd
      door meetinrichtingen bij verbruikers en systeemverbindingen en van het aansluitingenregister. Voor exitpunten
      die de verbinding vormen tussen het landelijk gastransportnet en een regionaal gastransportnet maakt de
      netbeheerder van het landelijk gastransportnet bij het samenstellen van de allocatiegegevens gebruik van gegevens,
      geregistreerd door meetinrichtingen op de punten waar het landelijk gastransportnet is verbonden met een regionaal
      gastransportnet en van de door de regionale netbeheerder aangeleverde allocatiegegevens. Voor exitpunten die
      gekoppeld zijn aan de aansluiting van een verbruiker op het landelijk gastransportnet maakt de netbeheerder van
      het landelijk gastransportnet bij het samenstellen van de allocatiegegevens gebruik van gegevens, geregistreerd
      door meetinrichtingen van de netbeheerder van het landelijk gastransportnet, van confirmaties en van zijn
      aansluitingenregister. Voor overige entry- en exitpunten maakt de netbeheerder van het landelijk gastransportnet
      bij het samenstellen van de allocaties gebruik van gegevens, geregistreerd door meetinrichtingen op deze entry- en
      exitpunten en van confirmaties
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.2.2
  - number: 2.2.3
    text: |-
      De regionale netbeheerder past bij het samenstellen van de allocatiegegevens afkomstig van meetinrichtingen van de
      op zijn net aangesloten profielgrootafnemers, de rekenregels toe van de methodiek Verbruiksprofielen, beschreven in
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 2.2.4
    text: |-
      Nadere regels voor het maandelijks uit te voeren allocatieproces zijn opgenomen in de [hoofdstukken 4][ref1] en
      [4a][ref2] en bijlage 2.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: 4a
  - number: 2.4.1
    text: |-
      De regionale netbeheerder verstrekt uiterlijk op de zesde werkdag na afloop van de maand waarop de gegevens
      betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s). De netbeheerder van het landelijk
      gastransportnet verstrekt uiterlijk de zesde werkdag na afloop van de maand waarop de gegevens betrekking hebben,
      door middel van berichten aan erkende programmaverantwoordelijke(n) en leverancier(s) de allocatiegegevens,
      samengesteld op grond van de op het landelijk gastransportnet aangesloten verbruikers.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.4.1
  - number: 2.4.2
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.4.1][ref1]worden beschouwd als de
      voorlopige allocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.4.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.4.1
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.3
    text: |-
      Indien de regionale netbeheerder met betrekking tot een aansluiting niet tijdig of niet volledig meetgegevens heeft
      ontvangen van de erkende meetverantwoordelijke zal hij ten behoeve van de maandelijkse allocatie een schatting
      maken van het verbruik van de betreffende aansluiting voor de betreffende periode en dit verbruik vlak verdelen
      over de uren.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.4.3
  - number: 2.5.1
    text: |-
      De regionale netbeheerder verstrekt uiterlijk op de zestiende werkdag na afloop van de maand waarop de gegevens
      betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s). De netbeheerder van het landelijk
      gastransportnet verstrekt uiterlijk op de zestiende werkdag na afloop van de maand waarop de gegevens betrekking
      hebben, door middel van berichten aan erkende programmaverantwoordelijke(n) en leverancier(s) de allocatiegegevens,
      samengesteld op grond van de op het landelijk gastransportnet aangesloten verbruikers. Voor de overige entry- en
      exitpunten verstrekt de netbeheerder van het landelijk gastransportnet de allocatiegegevens uiterlijk de zestiende
      werkdag na afloop van de maand waarop de gegevens betrekking hebben aan erkende programmaverantwoordelijke(n).
      Voor een balansrelatie op het virtuele handelspunt verstrekt de netbeheerder van het landelijk gastransportnet de
      allocatiegegevens aan erkende programmaverantwoordelijke(n) 2 werkdagen na de ontvangst van de door alle regionale
      beheerders aan de netbeheerder van het landelijk gastransportnet verstrekte allocatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.5.1
  - number: 2.5.2
    text: |-
      Indien een regionale netbeheerder niet in staat blijkt om allocatiegegevens aan te leveren binnen de in
      [2.5.1][ref1] gestelde termijn, kan de netbeheerder van het landelijk gastransportnet na overleg met betrokkenen
      – waaronder in elk geval worden begrepen de desbetreffende regionale netbeheerder en de betrokken erkende
      programmaverantwoordelijke(n) – de allocatie vaststellen met behulp van door de netbeheerder van het landelijk
      gastransportnet geschatte waardes.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.3
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.5.1][ref1] of [2.5.2][ref2] worden
      beschouwd als de definitieve allocatie die de basis vormt voor de financiële afwikkeling van handels- en/of
      transporttransacties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.5.2
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.1
    text: |-
      De regionale netbeheerder verstrekt uiterlijk op de tiende werkdag van de vierde maand na afloop van de maand
      waarop de gegevens betrekking hebben, de allocatiegegevens door middel van berichten aan de netbeheerder van het
      landelijk gastransportnet, erkende programmaverantwoordelijke(n) en leverancier(s). Voor een balansrelatie op het
      virtuele handelspunt verstrekt de netbeheerder van het landelijk gastransportnet de allocatiegegevens aan erkende
      programmaverantwoordelijke(n) 2 werkdagen na de ontvangst van de door alle regionale beheerders aan de netbeheerder
      van het landelijk gastransportnet verstrekte allocatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.6.1
  - number: 2.6.2
    text: |-
      Indien een regionale netbeheerder niet in staat blijkt om allocatiegegevens aan te leveren binnen de in
      [2.6.1][ref1] gestelde termijn, kan de netbeheerder van het landelijk gastransportnet na overleg met betrokkenen
      – waaronder in elk geval worden begrepen de desbetreffende regionale netbeheerder en de betrokken erkende
      programmaverantwoordelijke(n) – de allocatie vaststellen met behulp van door de netbeheerder van het landelijk
      gastransportnet geschatte waardes.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.6.1
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.3
    text: |-
      De allocatiegegevens die verstrekt zijn volgens het bepaalde in [artikel 2.6.1][ref1] of [2.6.2][ref2] worden
      beschouwd als correcties op de definitieve allocatie, die de basis vormen voor correcties op de financiële
      afwikkeling van handels- en/of transporttransacties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.6.1
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.6.2
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.7.1
    text: |-
      De regionale netbeheerder draagt er zorg voor dat informatie, die aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt verschaft, consistent is (inclusief de
      restvolumes en correctievolumes).
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.7.1
  - number: 2.7.2
    text: |-
      De netbeheerder van het landelijk gastransportnet draagt er zorg voor dat informatie, die aan erkende
      programmaverantwoordelijken en leveranciers wordt verschaft, consistent is (inclusief de restvolumes en
      correctievolumes).
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel2.7.2
  - number: '3.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet en de regionale netbeheerders voeren maandelijks de reconciliatie
      uit aan de hand van de door de meetverantwoordelijke voor aangeslotenen op de regionale gastransportnetten
      aangeleverde standen en verbruiken. De verrekening van de reconciliatie vindt tweemaal per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.1
  - number: '3.2'
    text: |-
      De regionale netbeheerders zenden uiterlijk op de negende werkdag van elke maand de reconciliatiegegevens
      door middel van berichten aan de netbeheerder van het landelijk gastransportnet en de betrokken erkende
      programmaverantwoordelijken en leveranciers. In aanmerking nemende dat de regionale netbeheerders de
      allocatiegegevens conform het bepaalde in [2.6.1][ref1] uiterlijk op de tiende werkdag verstrekken, voeren de
      regionale netbeheerders de maandelijkse reconciliatie uit in de periode tussen de tiende werkdag van elke maand en
      de negende werkdag van elke daaropvolgende maand. De regionale netbeheerder draagt er zorg voor dat informatie, die
      aan de netbeheerder van het landelijk gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt
      verschaft, consistent is.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.6.1
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '3.3'
    text: |-
      In uitzonderlijke gevallen kan de netbeheerder van het landelijk gastransportnet een regionale netbeheerder
      toestaan de reconciliatiegegevens na het in het [vorige artikel][ref1] gestelde tijdstip te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '3.2'
        hoofdstuk: '3'
  - number: '3.4'
    text: |-
      Nadat alle regionale netbeheerders de gegevens ter beschikking hebben gesteld totaliseert de netbeheerder van het
      landelijk gastransportnet de aangeleverde te reconciliëren hoeveelheden gas en verrekent dit tweemaal per jaar met
      de betrokken erkende programmaverantwoordelijken. Dit betreft in principe een herverdeling van een reeds eerder
      berekende hoeveelheid gas, waarbij het saldo van de verrekening over een kalendermaand nul is. De reconciliatie
      betreft vooral een verrekening tussen erkende programmaverantwoordelijken, waarbij de netbeheerder van het
      landelijk gastransportnet een faciliterende rol speelt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.4
  - number: '3.5'
    text: |-
      De netbeheerder van het landelijk gastransportnet verzendt tweemaal per jaar, in april en in oktober, de
      debetfacturen naar de desbetreffende erkende programmaverantwoordelijken op de veertiende werkdag van de maand
      en informeert de erkende programmaverantwoordelijken over de bedragen van de creditnota’s. Deze facturering is
      gebaseerd op de in de voorgaande kalendermaanden ontvangen reconciliatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.5
  - number: '3.6'
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt de creditfacturen op en verzendt deze, zo spoedig
      mogelijk doch uiterlijk binnen 14 werkdagen nadat alle debetfacturen zijn voldaan, naar de desbetreffende erkende
      programmaverantwoordelijken. Op deze creditnota’s zijn de betalingen op de debetnota’s verwerkt, die inmiddels door
      de netbeheerder van het landelijk gastransportnet zijn ontvangen. In het geval dat na 3 maanden na de verzending
      van de debetfacturen (nog) niet alle debetfacturen zijn betaald door de erkende programmaverantwoordelijken, zal
      de uitbetaling van de creditnota’s onder vermindering van het nog niet betaalde bedrag worden uitbetaald aan de
      erkende programmaverantwoordelijken. De uitbetaling van de creditfacturen (zo nodig onder aftrek van niet-betaalde
      debetfacturen) wordt door de netbeheerder van het landelijk gastransportnet uitgevoerd op de veertiende werkdag
      na de factuurdatum. Betalingen op debetfacturen, die door de netbeheerder van het landelijk gastransportnet zijn
      ontvangen nadat de creditfacturen zijn opgesteld, zullen worden verwerkt in gecorrigeerde creditfacturen, die door
      de netbeheerder van het landelijk gastransportnet de eerstvolgende keer zullen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.6
  - number: '3.7'
    text: |-
      Nadere regels voor het maandelijks uit te voeren reconciliatieproces zijn opgenomen in [paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '5'
  - number: 4.0.1
    text: |-
      Op aansluitingen verbonden met een regionaal gastransportnet is slechts één erkende programmaverantwoordelijke
      toegestaan. Deze erkende programmaverantwoordelijke zal de allocatierol balancerend hebben conform [4a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.0.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4.0.2
    text: |-
      Op exitpunten waar het landelijk gastransportnet is verbonden met een verbruiker zijn meerdere erkende
      programmaverantwoordelijken toegestaan. Alle erkende programmaverantwoordelijken die actief zijn op deze exitpunten
      zullen de allocatierol balancerend hebben conform [4a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.0.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4.1.0
    text: |-
      De netbeheerder van het landelijk gastransportnet zorgt er voor dat de gegevens, die noodzakelijk zijn voor het
      uitvoeren van de near-real-time allocatie op exitpunten waar het landelijk gastransportnet is verbonden met een
      regionaal gastransportnet, uiterlijk vijf minuten na afloop van het uur in het Centraal Systeem Stuursignaal
      beschikbaar zijn. Indien B5.2 van toepassing is in situatie B5.2.4 zorgt de regionale netbeheerder die de
      meetinrichting beheert dat de gegevens, die noodzakelijk zijn voor het uitvoeren van de near-real-time allocatie
      op exitpunten waar het landelijk gastransportnet is verbonden met een regionaal gastransportnet, uiterlijk vijf
      minuten na afloop van het uur in het Centraal Systeem Stuursignaal beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.1.0
  - number: 4.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt de gegevens, die noodzakelijk zijn voor het uitvoeren
      van de maandelijkse allocatie, uiterlijk de vierde werkdag na afloop van de maand om 07.00 uur aan de regionale
      netbeheerder door middel van het bericht ‘MINFO’. Deze gegevens worden beschouwd als zijnde definitieve gegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Voor elk relevant netgebied worden voor elk uur van de betreffende periode de volgende gegevens verstrekt:

        - de gemeten hoeveelheid gas (uitgedrukt in MJ)
        - de calorische bovenwaarde van het gas
        - de voor de allocatie relevante gegevens betreffende de gaskwaliteit.

      Tevens wordt bij de maandelijkse allocatie restenergie verstrekt conform bijlage B3.1.1.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.1.3
  - number: 4.2.1
    text: |-
      De regionale netbeheerder voert voor elk relevant netgebied de off line allocatie uit. Daarvoor bepaalt de
      regionale netbeheerder voor elke verbruiker via welk netgebied het gas voor de verbruiker in het distributienet van
      de regionale netbeheerder wordt gevoed en legt dit vast in het aansluitingenregister. Ten behoeve van de near-real-
      time allocatie zorgt de regionale netbeheerder dat deze informatie ook dagelijks beschikbaar is in het Centraal
      Systeem Stuursignaal.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.2.1
  - number: 4.2.1a
    text: |-
      Met behulp van het Centraal Systeem Stuursignaal wordt voor elk relevant netgebied de near-real-time allocatie
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.2.1a
  - number: 4.2.2
    text: |-
      Bij het uitvoeren van de allocatie wordt er voor gezorgd dat de som van de verstrekte allocaties (betreffende
      de verbruikers) van een netgebied voor elk uur gelijk is aan de op het netgebied gemeten hoeveelheid gas van het
      desbetreffende uur.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.2.2
  - number: 4.3.1
    text: |-
      De allocaties worden samengesteld, gesommeerd per afnamecategorie, waarbij per verbruiker de afnamecategorie
      bepalend is welke in het aansluitingenregister is opgenomen.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1
  - number: 4.3.1.1
    text: |-
      Voor die profielafnemers, waarvoor met behulp van de verbruiksprofielenmethodiek het
      verbruik per uur wordt berekend, gelden de respectievelijke profielcategorieën volgens
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref1] als afnamecategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 4.3.1.2
    text: |-
      Toewijzing van afnamecategorieën door de regionale netbeheerder of de netbeheerder van het landelijk
      gastransportnet aan grootverbruikers gebeurt jaarlijks per 1 augustus op basis van de op dat moment bekende
      gegevens en de onderstaande toewijzingscriteria en is geldig vanaf 1 januari van het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.2
  - number: 4.3.1.2a
    text: |-
      Indien op grond van [4.3.1.2][ref1] de afnamecategorie van een aangeslotene wijzigt, informeert de netbeheerder,
      uiterlijk per 1 september volgend op de toewijzing, de betreffende aangeslotene, zijn meetverantwoordelijke en
      leverancier schriftelijk over de toegewezen afnamecategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.2
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.3
    text: |-
      Voor grootverbruikers met een gemiddelde jaarafname over de laatste 36 maanden groter dan 1.000.000 m3(n;35,17)
      wordt de afnamecategorie GGV gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.3
  - number: 4.3.1.4
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] bedoelde grootverbruikers, die beschikken over een uurlijks op afstand
      uitleesbare meetinrichting kan op verzoek van de aangeslotene de afnamecategorie GGV worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.3
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.3
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.5
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] of [4.3.1.4][ref2] bedoelde grootverbruikers met een gemiddelde jaarafname
      over de laatste 36 maanden groter dan 170.000 m3 (n;35,17) dan wel een verbruik over de laatste 12 maanden van meer
      dan 250.000 m3 (n;35,17) wordt de afnamecategorie GXX gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.4
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.3
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.4
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.6
    text: |-
      Voor andere dan de in [4.3.1.3][ref1] of [4.3.1.4][ref2] of [4.3.1.5][ref3] bedoelde grootverbruikers, die
      beschikken over een dagelijks op afstand uitleesbare meetinrichting kan op verzoek van de aangeslotene de
      afnamecategorie GXX worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.5
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.3
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.4
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037931
        artikel: 4.3.1.5
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.7
    text: |-
      Voor andere dan in [4.3.1.3][ref1] of [4.3.1.4][ref2] of [4.3.1.5][ref3] of [4.3.1.6][ref4] bedoelde
      grootverbruikers wordt de afnamecategorie G2C gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.5
      [ref4]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.6
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.3
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.4
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037931
        artikel: 4.3.1.5
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0037931
        artikel: 4.3.1.6
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.8
    text: |-
      Voor een aansluiting op een regionaal gastransportnet waar gas in het gastransportnet gevoed wordt met een
      gemiddeld jaarvolume over de laatste 36 maanden groter dan 1.000.000 m3 (n;35,17) wordt de afnamecategorie GIS
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.8
  - number: 4.3.1.9
    text: |-
      Voor andere dan de in [4.3.1.8][ref1] bedoelde aansluitingen aan een regionaal gastransportnet waar gas in het
      gastransportnet gevoed wordt en die beschikken over een uurlijks op afstand uitleesbare meetinrichting kan op
      verzoek van de aangeslotene de afnamecategorie GIS worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.8
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.8
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.10
    text: |-
      Voor andere dan de in [4.3.1.8][ref1] en [4.3.1.9][ref2] bedoelde aansluitingen op een regionaal gastransportnet
      met een capaciteit groter dan 40 m³(n)/uur waar gas in het gastransportnet gevoed wordt, wordt afnamecategorie
      GIN gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.8
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1.9
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.3.1.8
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1.9
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.1.11
    text: |-
      Voor een aansluiting op een regionaal transportnet met een capaciteit kleiner dan of gelijk aan 40 m³(n)/uur waar
      gas in het gastransportnet gevoed wordt, wordt de afnamecategorie G2A gebruikt. Ten behoeve van de allocatie wordt
      het standaard jaarverbruik gelijkgesteld aan 0.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.11
  - number: 4.3.1.12
    text: |-
      Voor een aansluiting waar een netbeheerder het netverlies van een netgebied op administreert wordt de
      afnamecategorie GMN gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.3.1.12
  - number: 4.4.1
    text: |-
      De regionale netbeheerder stelt de allocatiegegevens per netgebied vast op grond van gegevens van de op zijn net
      aangesloten verbruikers. De regionale netbeheerder voert voor elk uur van de maand de allocatie uit. In bijlage
      2 (het allocatieproces door de RNB) zijn de door de regionale netbeheerder uit te voeren activiteiten stapsgewijs
      uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.4.1
  - number: 4.4.2
    text: |-
      De regionale netbeheerder is gehouden de samengestelde allocatiegegevens uitsluitend toe te wijzen aan tot het
      landelijk gastransportnet toegelaten erkende programmaverantwoordelijken met erkenning LB.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.4.2
  - number: 4.4.3
    text: |-
      Als de netbeheerder van het landelijk gastransportnet constateert dat (een gedeelte van) de door een regionale
      netbeheerder samengestelde allocatiegegevens zijn toegewezen aan niet-erkende programmaverantwoordelijken of aan
      erkende programmaverantwoordelijken zonder erkenning LB, zal de netbeheerder van het landelijk gastransportnet de
      betreffende regionale netbeheerder hierop wijzen en in de gelegenheid stellen de verstrekte gegevens te corrigeren.
      Indien de regionale netbeheerder de correctie niet binnen de in [2.6.1][ref1] gestelde termijn uitvoert, of indien,
      na correctie, de verstrekte allocatiegegevens nog niet voldoen aan het in hiervoor gestelde, zal de netbeheerder
      van het landelijk gastransportnet de regionale netbeheerder voor de desbetreffende allocatie beschouwen als een
      levering aan de regionale netbeheerder en derhalve de geleverde transportdienst volgens de standaard voorwaarden
      factureren aan de regionale netbeheerder, tenzij dit niet aan de regionale netbeheerder kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.6.1
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.5.1
    text: |-
      De restenergie wordt vastgesteld conform de [Meetcode gas LNB][ref1]. De wijze waarop de restenergie zal worden
      verwerkt in de allocatiegegevens is uitgewerkt in bijlage 3 (Verwerken van restenergie).


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 4.5.2
    text: In geval van de near-real-time allocatie wordt de restenergie op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.5.2
  - number: 4.6.0
    text: |-
      Verschillen tussen near-real-time allocaties en de allocaties op de 10e werkdag van de vierde maand na afloop
      van de maand worden verrekend via het settlement proces conform [4.1.6 van de Transportcode gas LNB][ref1]. Het
      portfolio onbalans signaal en het systeem balans signaal worden niet opnieuw berekend naar aanleiding van off line
      allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.1.6
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.0
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 4.1.6
  - number: 4.6.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet binnen drie maanden nadat de gegevens conform
      [4.1.2][ref1] verstuurd zijn, constateert dat een conform 4.1.2 en [4.1.3][ref2] aan de regionale netbeheerder
      beschikbaar gestelde uurhoeveelheid voor een netgebied of een hoeveelheid restenergie op een netgebied onjuist is,
      verstrekt de netbeheerder van het landelijk gastransportnet na overleg met de regionale netbeheerder aangepaste
      gegevens conform 4.1.2 en 4.1.3.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.1.3
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.1.2
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.1.3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.6.2
    text: |-
      Indien een regionale netbeheerder binnen 80 dagen nadat de gegevens conform [2.5.1][ref1] verstuurd zijn,
      vaststelt dat een door hem samengesteld allocatiegegeven onjuist is, zal de daaruit voortvloeiende correctie worden
      uitgevoerd in het allocatieproces conform [2.6.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.6.1
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.6.3
    text: |-
      Erkende programmaverantwoordelijken en leveranciers zijn gehouden de conform de [artikelen 2.4.1][ref1] en
      [2.5.1][ref2] door de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet verstrekte
      gegevens bij ontvangst te controleren op plausibiliteit en eventuele vermeende fouten zo spoedig mogelijk, doch in
      elk geval vijf werkdagen vóór de verstrekking van nieuwe gegevens conform respectievelijk de artikelen 2.4.1, 2.5.1
      en [2.6.1][ref3], te melden bij de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet en,
      in geval van vermeende fouten in de meting, bij de partij die de meting verricht, opdat deze fouten gecorrigeerd
      kunnen worden vóór de verstrekking van nieuwe gegevens conform respectievelijk de artikelen 2.4.1, 2.5.1 en 2.6.1.

      Indien de hierboven bedoelde gegevens een direct aangeslotene op het landelijk gastransportnet betreffen, dan geldt
      de controleverplichting conform [artikel 2.5.1][ref4] en het melden van geconstateerde fouten niet.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel2.6.1
      [ref4]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.4.1
        hoofdstuk: '2'
