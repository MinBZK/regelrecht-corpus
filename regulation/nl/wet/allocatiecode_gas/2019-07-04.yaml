  - number: 4.6.4
    text: |-
      Indien een regionale netbeheerder vaststelt dat een door hem samengesteld allocatiegegeven, dat betrekking heeft
      op (een uur van) een maand binnen de reconciliatieperiode, onjuist is, zal de daaruit voortvloeiende correctie (de
      zogenaamde correctie-energie) worden uitgevoerd in het reconciliatieproces. Deze correcties kunnen alleen worden
      uitgevoerd ingeval de correctie betrekking heeft op een binnen de reconciliatieperiode vallende periode.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.4
  - number: 4.6.5
    text: |-
      De wijze waarop de correctie-energie zal worden verwerkt in de reconciliatiegegevens is uitgewerkt in bijlage 4
      (Verwerken van correctie-energie).
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.6.5
  - number: 4.7.1
    text: |-
      De allocatieregels richten zich op de normale omstandigheden. Een strikte toepassing van de regels kan in
      bijzondere omstandigheden leiden tot onbetrouwbare uitkomsten van het allocatieproces. Een aantal van deze
      bijzondere situaties, inclusief de te volgen werkwijze bij de allocatie, zijn beschreven in bijlage 5 (Bijzondere
      omstandigheden). In overige uitzonderingssituaties, indien deze het allocatieproces dreigen te verstoren, beslist
      de regionale netbeheerder of de netbeheerder van het landelijk gastransportnet, na overleg met betrokkenen.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.7.1
  - number: 4.8.1
    text: |-
      Van regionale netbeheerder naar de netbeheerder van het landelijk gastransportnet, betreffende erkende
      programmaverantwoordelijken en leveranciers: Voor elk relevant Netgebied: de berekende meetcorrectiefactor;
      hiervoor wordt het bericht ‘CINFO’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.8.1
  - number: 4.8.2
    text: |-
      Van de regionale netbeheerder naar de netbeheerder van het landelijk gastransportnet: Voor elk relevant netgebied:
      de gesommeerde allocaties voor elke voorkomende combinatie van erkende programmaverantwoordelijken, leverancier en
      afnamecategorie; hiervoor wordt het bericht ‘LALL’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.8.2
  - number: 4.8.3
    text: |-
      Van de regionale netbeheerder naar desbetreffende erkende programmaverantwoordelijken:

      Voor elk relevant netgebied: de gesommeerde allocaties voor de desbetreffende erkende programmaverantwoordelijke
      voor elke voorkomende combinatie met een leverancier en afnamecategorie; hiervoor wordt het bericht ‘LALL’
      gebruikt.

      Van de netbeheerder van het landelijk gastransportnet naar desbetreffende erkende programmaverantwoordelijken: Bij
      een verbruiker met een aansluiting op het landelijk gastransportnet, voor elk relevant netgebied: de gesommeerde
      allocaties voor de desbetreffende erkende programmaverantwoordelijke voor elke voorkomende combinatie met een
      leverancier en afnamecategorie; hiervoor wordt het bericht ‘LALL’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.8.3
  - number: 4.8.4
    text: |-
      Van de regionale netbeheerder naar desbetreffende leveranciers:

        - Voor elk relevant netgebied: de gesommeerde allocaties voor de desbetreffende leverancier voor elke voorkomende
      combinatie met een erkende programmaverantwoordelijke en afnamecategorie; hiervoor wordt het bericht ‘LALL’
      gebruikt;
        - Voor elke telemetriegrootverbruiker: de gealloceerde uurhoeveelheid; hiervoor wordt het bericht ‘BALL’ gebruikt.

      Van de netbeheerder van het landelijk gastransportnet naar desbetreffende leveranciers:

        - Bij een verbruiker met een aansluiting op het landelijk gastransportnet, voor elk relevant netgebied: de
      gesommeerde allocaties voor de desbetreffende leverancier voor elke voorkomende combinatie met een erkende
      programmaverantwoordelijke en afnamecategorie; hiervoor wordt het bericht ‘LALL’ gebruikt;
        - Voor elke telemetriegrootverbruiker: de gealloceerde uurhoeveelheid; hiervoor wordt het bericht ‘BALL’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.8.4
  - number: 4.9.1
    text: |-
      Ten behoeve van de allocatie van het netverlies, berekent de regionale netbeheerder jaarlijks voor 1 oktober per
      netgebied het te alloceren netverlies per uur voor het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.9.1
  - number: 4.9.2
    text: |-
      Uiterlijk op de vijfde werkdag in oktober publiceert de netbeheerder het te alloceren netverlies, bedoeld in het
      eerste lid, op elektronische wijze op een publiek toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.9.2
  - number: 4.9.3
    text: |-
      Bij de berekening, bedoeld in het eerste lid, volgt de netbeheerder achtereenvolgens de volgende stappen.

      a. De netbeheerder berekent per netgebied voor elke maand van het eerstvolgende kalenderjaar het gemiddelde
      gerealiseerde netverlies per maand van de drie meest recente volledig gereconcilieerde kalenderjaren.

      b. Met het gemiddelde gerealiseerde netverlies als bedoeld in onderdeel a berekent de netbeheerder voor zijn gehele
      verzorgingsgebied:

      1° de som van het netverlies per maand;

      2° de som van het netverlies per jaar;

      3° de som van het netverlies per jaar voor zover de som van het netverlies per maand bedoeld in sub 1° positief is.

      c. De netbeheerder berekent een jaarcorrectiefactor door de som van het netverlies per jaar bedoeld in onderdeel b,
      sub 2° te delen door de som van het netverlies per jaar bedoeld in onderdeel b, sub 3°.

      d. Indien de som van het netverlies per maand bedoeld in onderdeel b, sub 1° negatief is, stelt de netbeheerder het
      te alloceren netverlies voor die maand in alle netgebieden gelijk aan nul.

      e. Per maand, per netgebied waarvan de netbeheerder het netverlies niet gelijk heeft gesteld aan nul op grond van
      onderdeel d, berekent de netbeheerder een gecorrigeerd netverlies door het gemiddelde gerealiseerde netverlies per
      maand, bedoeld in onderdeel a, te vermenigvuldigen met de jaarcorrectiefactor.

      f. Met het gecorrigeerde netverlies bedoeld in onderdeel e berekent de netbeheerder voor zijn gehele
      verzorgingsgebied:

      1° de som van het gecorrigeerde netverlies per maand;

      2° de som van het gecorrigeerde netverlies per maand voor zover het gecorrigeerde netverlies positief is.

      g. De netbeheerder berekent per maand een maandcorrectiefactor door de som van het gecorrigeerde netverlies bedoeld
      in onderdeel f, sub 1° te delen door de som van het gecorrigeerde netverlies bedoeld in onderdeel f, sub 2°.

      h. Voor elke maand waarin het gecorrigeerde netverlies, bedoeld in onderdeel e, negatief is, stelt de netbeheerder
      het te alloceren netverlies gelijk aan nul.

      i. Voor de maanden waarin het gecorrigeerde netverlies niet gelijk is gesteld aan nul op grond van onderdeel h,
      berekent de netbeheerder het te alloceren netverlies per maand per netgebied door het gecorrigeerde netverlies,
      bedoeld in onderdeel e, te vermenigvuldigen met de maandcorrectiefactor.

      j. De netbeheerder berekent voorts het te alloceren netverlies per netgebied, per uur door het te alloceren
      netverlies per maand, zoals berekend op basis van de voorgaande stappen te vermenigvuldigen met het quotiënt van
      de profielfractie van het G2C-profiel bij standaardtemperatuur van het betreffende uur en de som van dezelfde
      profielfracties van de betreffende gasmaand.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.9.3
  - number: 4.9.4
    text: |-
      Bij de berekening van het gerealiseerde netverlies bedoeld in het eerste lid, houdt de netbeheerder rekening
      met historische verschillen in de berekeningswijze van de volumeherleiding. Dit houdt in ieder geval in dat de
      netbeheerder voor de periode vanaf 1 januari 2015 tot en met 31 december 2016 de reconciliatieresultaten corrigeert
      op basis van een MMCF van 1, een volumeherleidingsfactor van 0,99203 voor de afnamecategorieën G1A en G2A en
      een volumeherleidingsfactor van 1 voor de afnamecategorie G2C, waarbij verondersteld wordt dat elk volume in het
      kleinverbruiksegment tot stand is gekomen met de administratieve volumeherleiding.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4.9.4
  - number: 4a.1.1
    text: |-
      De netbeheerder van het landelijk gastransportnet kent de volgende allocatierollen:

      Het verschil tussen het te alloceren volume en de som van de confirmaties aan de erkende
      programmaverantwoordelijken met de allocatierol proportioneel (inclusief backhaul) wordt gealloceerd aan de erkende
      programmaverantwoordelijke met de allocatierol balancerend (enkel ingeval de richting van dit verschil overeenkomt
      met de richting waarin de erkende programmaverantwoordelijke balancerend is). Indien er meerdere erkende
      programmaverantwoordelijken zijn met de allocatierol balancerend dienen deze erkende programmaverantwoordelijken
      te nomineren en zal het genoemde verschil verdeeld worden naar rato van de confirmaties aan de betreffende erkende
      programmaverantwoordelijken.

      In de situatie dat gas wordt afgeleverd in een stromingsrichting die gelijk is aan de fysieke stromingsrichting
      zal de hoeveelheid zoals aangegeven in de confirmatie in principe worden gealloceerd aan de erkende
      programmaverantwoordelijke. Indien in deze situatie het verschil tussen het gemeten volume en de som van de
      confirmaties aan de erkende programmaverantwoordelijken met de allocatierol proportioneel niet gealloceerd kan
      worden aan erkende programmaverantwoordelijken met de allocatierol balancerend zal dit verschil worden gealloceerd
      aan de in de eerste zin genoemde erkende programmaverantwoordelijken naar rato van de hoeveelheden zoals aangegeven
      in de confirmaties. In de situatie van backhaul zal de hoeveelheid zoals aangegeven in de confirmatie worden
      gealloceerd aan de erkende programmaverantwoordelijke.

      Bij deze allocatierol zal geen gas worden gealloceerd aan de erkende programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.1
  - number: 4a.1.2
    text: |-
      Indien een erkende programmaverantwoordelijke volgens [4a.2][ref1] op een entry- of exitpunt de keuze heeft
      tussen verschillende allocatierollen, zal de erkende programmaverantwoordelijke de netbeheerder van het landelijk
      gastransportnet per entry- en exitpunt schriftelijk melden welke allocatierol hij zal vervullen. Indien de
      netbeheerder van het landelijk gastransport deze informatie niet uiterlijk 5 werkdagen voor aanvang van de
      programmaverantwoordelijkheid op het betreffende entry- of exitpunt ontvangt zal de netbeheerder van het landelijk
      gastransportnet aan de erkende programmaverantwoordelijke de rol proportioneel toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: 4a
        paragraaf: 4a.2
  - number: 4a.1.3
    text: |-
      Indien een erkende programmaverantwoordelijke kiest voor de allocatierol balancerend terwijl er al een andere
      balancerende erkende programmaverantwoordelijke op het entry- of exitpunt aanwezig is, zal de netbeheerder
      van het landelijk gastransportnet in overleg gaan met zowel de oorspronkelijke balancerende erkende
      programmaverantwoordelijke als de nieuwe balancerende erkende programmaverantwoordelijke, met als resultaat een van
      de volgende situaties:

      Beide erkende programmaverantwoordelijken krijgen de allocatierol balancerend en beide zullen nomineren. Een van
      beide partijen verandert zijn allocatierol in proportioneel en zal nomineren. Een van beide partijen verandert zijn
      allocatierol in “geen allocatie”.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.3
  - number: 4a.1.4
    text: |-
      Indien de gecontracteerde entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/of
      exitcapaciteit wordt overgedragen aan een andere erkende programmaverantwoordelijke dan wordt de allocatierol ook
      overgedragen, tenzij de ontvangende erkende programmaverantwoordelijke anders aangeeft. Indien de gecontracteerde
      entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/of exitcapaciteit gedeeltelijk
      wordt overgedragen, zullen de betrokken erkende programmaverantwoordelijken handelen volgens [4a.1.2][ref1].
      Indien de gecontracteerde entry- en/of exitcapaciteit of het gebruiksrecht van de gecontracteerde entry- en/
      of exitcapaciteit wordt overgedragen aan een andere erkende programmaverantwoordelijke die reeds actief is
      op het betreffende entry- en/of exitpunt, dan wordt de vigerende allocatierol van de ontvangende erkende
      programmaverantwoordelijke toegepast op de extra entry- en/of exitcapaciteit, tenzij anders aangegeven volgens
      4a.1.2.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.1.2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a.1.2
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.5
    text: |-
      Indien uitvoering van de [artikelen 4a.1.2][ref1], [4a.1.3][ref2] en [4a.1.4][ref3] niet uiterlijk 5 werkdagen
      voor aanvang van de programmaverantwoordelijkheid op het betreffende entry- en/of exitpunt leiden tot een
      uitvoerbaar allocatiealgoritme zal de netbeheerder van het landelijk gastransportnet de betrokken erkende
      programmaverantwoordelijken een allocatierol toedelen en deze hierover informeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.1.4
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a.1.2
        hoofdstuk: 4a
        paragraaf: 4a.1
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4a.1.3
        hoofdstuk: 4a
        paragraaf: 4a.1
      - id: ref3
        bwb_id: BWBR0037931
        artikel: 4a.1.4
        hoofdstuk: 4a
        paragraaf: 4a.1
  - number: 4a.1.6
    text: |-
      Binnen de condities van [artikel 4a.2][ref1] is een erkende programmaverantwoordelijke bevoegd zijn allocatierol
      te wijzigen volgens de volgende regels. De erkende programmaverantwoordelijke zal de netbeheerder van het landelijk
      gastransportnet zijn nieuwe allocatierol schriftelijk melden. Deze nieuwe allocatierol zal in werking treden
      op de eerste gasdag van de eerstkomende gasmaand, rekening houdend met een verwerkingstijd van 5 werkdagen door
      de netbeheerder van het landelijk gastransportnet na ontvangst van de melding, tenzij anders overeen gekomen.
      Indien ten gevolge van voorgenoemde melding, of ten gevolge van het niet langer contracteren van entry- en/
      of exitcapaciteit door een erkende programmaverantwoordelijke met de allocatierol balancerend, niet langer een
      erkende programmaverantwoordelijke met de allocatierol balancerend op een entry- en/of exitpunt aanwezig is, zal
      de netbeheerder van het landelijk gastransportnet de andere erkende programmaverantwoordelijken op het betreffende
      entry- en/of exitpunt uiterlijk drie werkdagen voordat de wijziging in werking treedt schriftelijk op de hoogte
      brengen. Indien ten gevolge van een wijziging van de allocatierol van een erkende programmaverantwoordelijke of
      ten gevolge van de aanvang van het contracteren door een erkende programmaverantwoordelijke met de allocatierol
      balancerend, een erkende programmaverantwoordelijke met de allocatierol balancerend actief wordt op een entry- en/
      of exitpunt, zal de netbeheerder van het landelijk gastransportnet de andere erkende programmaverantwoordelijken op
      het betreffende entry- en/of exitpunt uiterlijk drie werkdagen voordat de wijziging in werking treedt schriftelijk
      op de hoogte brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: 4a
        paragraaf: 4a.2
  - number: 4a.1.7
    text: |-
      De netbeheerder van het landelijk gastransportnet zal per entry- en exitpunt per erkende programmaverantwoordelijke
      de allocatierol opnemen in zijn administratie. Deze informatie is opvraagbaar voor erkende
      programmaverantwoordelijken die actief zijn op de betreffende entry- en/of exitpunten en zal verstrekt worden
      rekening houdend met belangen van alle betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.1.7
  - number: 4a.2.1
    text: |-
      Allocatie op entry- en exitpunten op de landsgrens (grenspunten)

      Op grenspunten zijn meerdere erkende programmaverantwoordelijken toegestaan. De erkende programmaverantwoordelijken
      die actief zijn op deze grenspunten kunnen de allocatierollen balancerend, proportioneel en “geen allocatie”
      hebben.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.2.1
  - number: 4a.2.2
    text: |-
      Allocatie op entry- of exitpunten waar een installatie voor de opslag van gas of LNG is verbonden met het landelijk
      gastransportnet.

      Op deze entry- of exitpunten zijn meerdere erkende programmaverantwoordelijken toegestaan. De erkende
      programmaverantwoordelijken die actief zijn op deze entry- of exitpunten kunnen de allocatierollen balancerend,
      proportioneel en “geen allocatie” hebben.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.2.2
  - number: 4a.2.3
    text: |-
      Allocatie op entrypunten waar een gasproductienet is verbonden met het landelijk gastransportnet.

      Op deze entrypunten zijn meerdere erkende programmaverantwoordelijken toegestaan. De erkende
      programmaverantwoordelijken die actief zijn op deze entrypunten kunnen de allocatierollen balancerend,
      proportioneel en “geen allocatie” hebben.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.2.3
  - number: 4a.2.4
    text: |-
      Allocatie op het virtuele handelspunt

      Op het virtuele handelspunt geldt dat de gealloceerde hoeveelheid gelijk is aan de geconfirmeerde hoeveelheid; een
      uitzondering hierop is de balansrelatie.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.2.4
  - number: 4a.2.5
    text: |-
      Balansrelatie op het virtuele handelspunt

      In een balansrelatie wordt de op het virtuele handelspunt gealloceerde hoeveelheid tussen één of meer
      balansleverende- en één balansontvangende erkende programmaverantwoordelijke bepaald op basis van de
      fysieke levering op binnenlandse verbruikspunten in een portfolio van de balansontvangende erkende
      programmaverantwoordelijke. Met behulp van de balansrelatie kan daarmee onbalansrisico op binnenlandse
      verbruikspunten over één- of meerdere balansleverende partijen verdeeld worden.

      De gealloceerde hoeveelheid wordt bepaald door de inzet van één of meer van de onderstaande varianten:

      Een balansleverende- en een balansontvangende erkende programmaverantwoordelijke kunnen een balansrelatie beperken
      tot een of meer gespecificeerde afnamecategorieën binnen het gemeten verbruik binnen de balansontvangende erkende
      programmaverantwoordelijke.

      De verdeling van de fysieke levering vindt plaats op basis van een vooraf door de balansleverende- en een
      balansontvangende erkende programmaverantwoordelijken genomineerd en geconfirmeerd percentage.

      De gealloceerde hoeveelheid op het virtuele handelspunt tussen een balansleverende en een balansontvangende erkende
      programmaverantwoordelijke heeft een vooraf gespecificeerde bovengrens.

      De gealloceerde hoeveelheid op het virtuele handelspunt tussen een balansleverende en een balansontvangende erkende
      programmaverantwoordelijke heeft een vooraf gespecificeerde ondergrens waaronder geen overdracht plaats heeft.

      De balansontvangende erkende programmaverantwoordelijke brengt zelf een vaste hoeveelheid gas in in de
      balansrelatie

      Voor de toepassing van een balansrelatie op het virtuele handelspunt:

      – staat de balansontvangende partij als erkende programmaverantwoordelijke in het aansluitingenregister van de
      betreffende netbeheerder vermeld – wordt de overdracht tussen de balansleverende en de balansontvangende partij
      geacht plaats te vinden bij de fysieke exit. – worden de realisaties van de balansleverende partij onder de
      balansrelatie beschouwd als exitallocaties.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.2.5
  - number: 4a.3.1
    text: |-
      Erkende programmaverantwoordelijken op een entry- en/of exitpunt kunnen de netbeheerder van het landelijk
      gastransportnet verzoeken de allocatie op het betreffende entry- en/of exitpunt door een andere partij te laten
      uitvoeren. De netbeheerder van het landelijk gastransportnet en de betreffende erkende programmaverantwoordelijken
      dienen vooraf overeenstemming te bereiken over de werkwijze. Als voorwaarde geldt dat de gemeten hoeveelheid
      energie en de som van de allocaties voor het betreffende entry- en/of exitpunt voor elk uur exact overeen dienen
      te komen; tevens geldt dat het tijdstip van beschikbaarstelling van de allocaties aan de netbeheerder van het
      landelijk gastransportnet overeen dient te komen met 2 minuten voor het in [2.0.3][ref1] genoemde tijdstip voor de
      near-real-time allocaties en met 2 werkdagen voor het in [2.5][ref2] genoemde moment voor de definitieve off line
      allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.0.3
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.0.3
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 4a.3.2
    text: |-
      Indien de netbeheerder van het landelijk gastransport niet conform [4a.3.1][ref1] en de overige met die andere
      partij gemaakte afspraken de allocaties krijgt aangeleverd, zal de netbeheerder van het landelijk gastransportnet
      zelf die allocaties voor het betreffende entry- en/of exitpunt bepalen in overeenstemming met het bepaalde in deze
      Allocatiecode gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.3.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a.3.1
        hoofdstuk: 4a
        paragraaf: 4a.3
  - number: 4a.4.1
    text: |-
      Verschillen tussen near-real-time allocaties en de definitieve allocaties worden verrekend via het settlement
      proces conform [4.1.6 van de Transportcode gas LNB][ref1]. Het portfolio onbalans signaal en het systeem balans
      signaal worden niet opnieuw berekend naar aanleiding van off line allocaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.1.6
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 4.1.6
  - number: 4a.4.2
    text: |-
      Erkende programmaverantwoordelijken zijn gehouden de conform [artikel 2.4.1][ref1] door de netbeheerder van het
      landelijk gastransportnet verstrekte gegevens bij ontvangst te controleren op plausibiliteit en eventuele vermeende
      fouten zo spoedig mogelijk te melden bij de netbeheerder van het landelijk gastransportnet en, in geval van
      vermeende fouten in de meting, bij de partij die de meting verricht, opdat deze fouten gecorrigeerd kunnen worden
      binnen de termijn zoals genoemd in [2.5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.4.1
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 4a.4.3
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet binnen de termijn zoals genoemd in [2.5.1][ref1] vaststelt
      dat een door hem samengesteld allocatiegegeven onjuist is, zal de netbeheerder van het landelijk gastransportnet:

        - informatie verstrekken over de correctie aan de erkende programmaverantwoordelijke met betrekking tot de
      aansluiting waarop de gecorrigeerde uurwaarde betrekking heeft;
        - een correctie uitvoeren op de gealloceerde uurhoeveelheid binnen de termijn zoals genoemd in [2.5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel4a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 2.5.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 5.1.1
    text: |-
      De regionale netbeheerders voeren de reconciliatie uit per netgebied. De regionale netbeheerders zorgen er voor
      dat tijdens het uitvoeren van het reconciliatieproces (gegevens van de) verbruikers aan hetzelfde netgebied zijn
      ‘gekoppeld’ als ten tijde van het uitvoeren van het allocatieproces.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.1.1
  - number: 5.1.2
    text: |-
      Voor elke profielafnemer waarvoor bij het samenstellen van de allocatiegegevens gedurende (een deel van) de
      reconciliatieperiode het verbruik per uur met behulp van de verbruiksprofielenmethodiek is berekend, berekent
      de regionale netbeheerder tijdens het reconciliatieproces het verbruik. De door de regionale netbeheerders uit
      te voeren bewerkingen zijn gespecificeerd in paragraaf B6.2 van bijlage 6 (Rekenregels reconciliatie). Van de
      verbruikers waarvoor slechts gedurende een gedeelte van de reconciliatieperiode het verbruik per uur met behulp
      van de verbruiksprofielenmethodiek is berekend, worden uitsluitend de gegevens van het desbetreffende deel van de
      reconciliatieperiode berekend conform het bepaalde in paragraaf B6.2 van bijlage 6 (Rekenregels reconciliatie).
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.1.2
  - number: 5.1.3
    text: |-
      Voor elke verbruiker waarvoor de in het vorige artikel genoemde voorwaarden niet gelden, berekent de regionale
      netbeheerder tijdens het reconciliatieproces het verbruik per uur. De door de regionale netbeheerder uit te
      voeren bewerkingen zijn gespecificeerd in paragraaf B6.3 van bijlage 6 (Rekenregels reconciliatie). Van de
      verbruikers waarvoor slechts gedurende een gedeelte van de reconciliatieperiode het verbruik per uur met behulp
      van de verbruiksprofielenmethodiek is berekend, berekent de regionale netbeheerder de gegevens van het deel van
      de reconciliatieperiode dat niet met behulp van de verbruiksprofielenmethodiek is bepaald, conform het bepaalde
      paragraaf B6.3 van bijlage 6 (Rekenregels reconciliatie).
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.1.3
  - number: 5.1.4
    text: |-
      Nadat de berekeningen voor alle relevante verbruikers door de regionale netbeheerder zijn uitgevoerd, berekent de
      regionale netbeheerder de maand-meetcorrectiefactor (MMCF) van het desbetreffende netgebied, zoals uitgewerkt in
      paragraaf B6.4 van bijlage 6 (Rekenregels reconciliatie). De regionale netbeheerder informeert de betrokken erkende
      programmaverantwoordelijken en leveranciers over de maand-meetcorrectiefactor.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.1.4
  - number: 5.1.5
    text: |-
      De regionale netbeheerder berekent voor elk netgebied voor iedere erkende programmaverantwoordelijke /leverancier
      combinatie voor elke kalendermaand de door de in [5.1.2][ref1] en [5.1.3][ref2] bedoelde verbruikers afgenomen
      hoeveelheid energie. Dit is het maandtotaal per erkende programmaverantwoordelijke /leverancier combinatie. De
      wijze van berekening is beschreven in paragraaf B6.5 van bijlage 6 (Rekenregels reconciliatie).


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel5.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel5.1.3
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 5.1.2
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 5.1.3
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.1
    text: |-
      Nadat de reconciliatiegegevens door alle regionale netbeheerders zijn aangeleverd sommeert de netbeheerder
      van het landelijk gastransportnet deze aangeleverde reconciliatiegegevens tot een met de betreffende erkende
      programmaverantwoordelijke te verrekenen hoeveelheid per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.2.1
  - number: 5.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt per kalendermaand de verrekenprijs. Als verrekenprijs zal
      de maandgemiddelde prijs worden gebruikt van de in [artikel 4.1.6.4 van de Transportcode gas LNB][ref1] bepaalde
      gasprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.6.4
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.1.6.4
  - number: 5.3.1
    text: |-
      Door regionale netbeheerder aan de netbeheerder van het landelijk gastransportnet, betreffende erkende
      programmaverantwoordelijken en leveranciers: Voor elk netgebied: per kalendermaand per afnamecategorie voor elke
      voorkomende erkende programmaverantwoordelijke /leverancier combinatie de tijdens het lopende reconciliatieproces
      vastgestelde totale hoeveelheid gas (uitgedrukt in MJ), de totale hoeveelheid gas vóór de uitvoering van dit
      reconciliatieproces, alsmede de maand-meetcorrectiefactor; hiervoor wordt het bericht ‘RNINFO’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.3.1
  - number: 5.3.2
    text: |-
      Door de netbeheerder van het landelijk gastransportnet aan de betreffende erkende programmaverantwoordelijken:
      Per kalendermaand de te reconciliëren hoeveelheid gas (verschil tussen de tijdens het lopende reconciliatieproces
      vastgestelde totale hoeveelheid gas en de totale hoeveelheid gas vóór de uitvoering van dit reconciliatieproces),
      uitgedrukt in MJ, en het bij deze hoeveelheid behorende factuurbedrag; hiervoor wordt het bericht ‘RSINFO’
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel5.3.2
  - number: '6.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet voert maandelijks de settlement uit aan de hand van de near-real-
      time allocaties per uur conform [2.0][ref1], de definitieve allocatiegegevens conform [2.5][ref2] en de correcties
      op de definitieve allocatiegegevens conform [2.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.0'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '6.2'
    text: |-
      Het settlement voorschot wordt berekend met behulp van de definitieve allocatiegegevens conform [2.5][ref1] door
      van de vastgestelde netto afwijking van de off line allocaties conform 2.5 ten opzichte van het goedgekeurde entry-
      en/of exitprogramma af te trekken de vastgestelde netto afwijking van de near-real-time allocaties ten opzichte van
      het goedgekeurde entry- en/of exitprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '6.3'
    text: |-
      De settlement afrekening wordt berekend met behulp van de correcties op de definitieve allocatiegegevens conform
      [2.6][ref1] door van de vastgestelde netto afwijking van de off line allocaties conform 2.6 ten opzichte van het
      goedgekeurde entry- en/of exitprogramma af te trekken de vastgestelde netto afwijking van de off line allocaties
      conform [2.5][ref2] ten opzichte van het goedgekeurde entry- en/of exitprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037931
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '6.4'
    text: |-
      De netbeheerder van het landelijk gastransportnet totaliseert de te verrekenen hoeveelheden gas en verrekent dit
      met de betrokken erkende programmaverantwoordelijken. Dit betreft in principe een herverdeling van een reeds eerder
      berekende hoeveelheid gas, waarbij het saldo van de verrekening over een gasmaand nul is. De settlement betreft
      vooral een verrekening tussen erkende programmaverantwoordelijken, waarbij de netbeheerder van het landelijk
      gastransportnet een faciliterende rol speelt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.4
  - number: '6.5'
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt de debetfacturen op en verzendt deze naar de desbetreffende
      erkende programmaverantwoordelijken aan het eind van elke maand. Deze facturering is gebaseerd op de in deze
      kalendermaand ontvangen off line allocatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.5
  - number: '6.6'
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt de creditfacturen op en verzendt deze naar de
      desbetreffende erkende programmaverantwoordelijken uiterlijk 10 werkdagen volgend op het moment dat de
      debetfacturen zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel6.6
  - number: '7.1'
    text: |-
      De Allocatievoorwaarden Gas, zoals vastgesteld bij besluit van 27 juni 2006 en nadien diverse malen gewijzigd,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel7.1
  - number: '7.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel7.2
  - number: '7.3'
    text: 'Dit besluit wordt aangehaald als: Allocatiecode gas.'
    url: https://wetten.overheid.nl/BWBR0037931/2019-07-04#Artikel7.3
