$id: wet_lidmaatschap_koninklijk_huis
regulatory_layer: WET
publication_date: '2002-06-11'
valid_from: '1985-12-09'
bwb_id: BWBR0003875
url: https://wetten.overheid.nl/BWBR0003875/1985-12-09
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ter voldoening aan het bepaalde in artikel 39 van de Grondwet de wet
    dient te regelen, wie lid is van het koninklijk huis;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Met de Koning als hoofd van het koninklijk huis zijn daarvan lid:

      a. zij die krachtens de [Grondwet][ref1] de Koning kunnen opvolgen;

      b. een Koning die afstand van het koningschap heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '2'
    text: |-
      1 Lid van het koninklijk huis zijn eveneens de echtgenoten van hen die ingevolge het voorgaande artikel het
      lidmaatschap van het koninklijk huis bezitten.

      2 Voor hen die het lidmaatschap van het koninklijk huis bezaten als echtgenote of echtgenoot, blijft dit
      lidmaatschap gedurende hun staat van weduwe of weduwnaar behouden, zolang de overleden echtgenote of echtgenoot bij
      leven ingevolge artikel 1 lid van het koninklijk huis zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#Artikel2
  - number: '3'
    text: |-
      Het lidmaatschap van het koninklijk huis wordt niet verkregen bij gemis en eindigt bij verlies van het
      Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#Artikel3
  - number: '4'
    text: |-
      Het lidmaatschap van het koninklijk huis eindigt voorts door ontslag, verleend bij een in het *Staatsblad* te
      plaatsen koninklijk besluit, waarover de Raad van State is gehoord.
    url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#Artikel4
  - number: '5'
    text: 'Deze wet kan worden aangehaald als: Wet lidmaatschap koninklijk huis.'
    url: https://wetten.overheid.nl/BWBR0003875/1985-12-09#Artikel5
