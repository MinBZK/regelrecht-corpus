---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_lidmaatschap_koninklijk_huis
regulatory_layer: WET
publication_date: '2002-06-11'
valid_from: '2002-06-12'
bwb_id: BWBR0013729
url: https://wetten.overheid.nl/BWBR0013729/2002-06-12
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling inzake het lidmaatschap van het
    koninklijk huis krachtens artikel 39 Grondwet vast te stellen alsmede enkele voorzieningen inzake de daaraan
    verbonden titels en namen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#ArtikelAanhef
articles:
  - number: '1'
    text: 'Met de Koning als hoofd van het koninklijk huis zijn daarvan lid:'
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel1
  - number: 1.a
    text: |-
      zij die krachtens de [Grondwet][ref1] de Koning kunnen opvolgen en deze niet verder bestaan dan in de tweede graad
      van bloedverwantschap;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 1.b
    text: de vermoedelijke opvolger van de Koning;
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel1
  - number: 1.c
    text: de Koning die afstand van het koningschap heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel1
  - number: '2.1'
    text: |-
      Lid van het koninklijk huis zijn eveneens de echtgenoten van hen die ingevolge [artikel 1][ref1] het lidmaatschap
      van het koninklijk huis bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0013729#Artikel1
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013729
        artikel: '1'
  - number: '2.2'
    text: |-
      Voor hen die het lidmaatschap van het koninklijk huis bezaten als echtgenote of echtgenoot, blijft dit lidmaatschap
      gedurende hun staat van weduwe of weduwnaar behouden, zolang de overleden echtgenote of echtgenoot bij leven
      ingevolge artikel 1 lid van het koninklijk huis zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel2
  - number: '3.1'
    text: |-
      Lid van het koninklijk huis blijven zij die op het tijdstip van inwerkingtreding van deze wet meerderjarig lid zijn
      van het koninklijk huis en krachtens de [Grondwet][ref1] de Koning kunnen opvolgen. Zij behouden hun lidmaatschap
      zolang zij krachtens de [Grondwet][ref2] de Koning kunnen opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
  - number: '3.2'
    text: |-
      Lid blijven voorts de echtgenoten van hen die ingevolge het eerste lid het lidmaatschap van het koninklijk huis
      bezitten.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel3
  - number: '3.3'
    text: |-
      Op hen die als echtgenoten het lidmaatschap van het koninklijk huis bezaten, is [artikel 2, tweede lid][ref1],
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013729#Artikel2
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013729
        artikel: '2'
  - number: '4'
    text: |-
      Het lidmaatschap van het koninklijk huis kan bij een koninklijk besluit waarover de Raad van State is gehoord
      worden verleend aan:
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel4
  - number: 4.a
    text: |-
      personen die krachtens de [Grondwet][ref1] de Koning kunnen opvolgen;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 4.b
    text: hun echtgenoten.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel4
  - number: '5'
    text: |-
      Het lidmaatschap van het koninklijk huis eindigt door ontslag verleend bij een koninklijk besluit waarover de Raad
      van State is gehoord.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel5
  - number: '6'
    text: |-
      Het lidmaatschap van het koninklijk huis wordt niet verkregen bij gemis van het Nederlanderschap en eindigt bij
      verlies van het Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel6
  - number: '7'
    text: De vermoedelijke opvolger van de Koning draagt de titel van Prins (Prinses) van Oranje.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel7
  - number: '8.1'
    text: |-
      De vermoedelijke opvolger van de Koning en de Koning die afstand van het koningschap heeft gedaan dragen de titel
      «Prins (Prinses) der Nederlanden».
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: '8.2'
    text: |-
      De titel «Prins (Prinses) der Nederlanden» kan bij koninklijk besluit uitsluitend worden verleend aan de volgende
      leden van het koninklijk huis:
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: 8.2.a
    text: de echtgenoot of echtgenote van de Koning;
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: 8.2.b
    text: kinderen geboren uit een huwelijk van de Koning;
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: 8.2.c
    text: de echtgenoot of echtgenote van de vermoedelijke opvolger van de Koning;
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: 8.2.d
    text: kinderen geboren uit een huwelijk van de vermoedelijke opvolger van de Koning;
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: 8.2.e
    text: |-
      zij die krachtens [artikel 4 lid][ref1] zijn van het koninklijk huis.


      [ref1]: https://wetten.overheid.nl/BWBR0013729#Artikel4
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013729
        artikel: '4'
  - number: '8.3'
    text: De titel «Prins (Prinses) der Nederlanden» vervalt met het verlies van het lidmaatschap van het koninklijk huis.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel8
  - number: '9.1'
    text: |-
      De Koning, diens vermoedelijke opvolger en de Koning die afstand van het koningschap heeft gedaan dragen de titel
      «Prins (Prinses) van Oranje-Nassau».
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel9
  - number: '9.2'
    text: |-
      De titel «Prins (Prinses) van Oranje-Nassau» kan bij koninklijk besluit uitsluitend worden verleend aan leden van
      het koninklijk huis.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel9
  - number: '9.3'
    text: |-
      Binnen drie maanden na verlies van het lidmaatschap van het koninklijk huis wordt bij koninklijk besluit beslist
      over het behoud van de titel «Prins (Prinses) van Oranje-Nassau» als persoonlijke titel voor degenen die het
      lidmaatschap hebben verloren.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel9
  - number: '9.4'
    text: |-
      Bij het koninklijk besluit genoemd in het derde lid kan tevens de geslachtsnaam worden bepaald.
      [Artikel 5, eerste tot en met elfde lid][ref1], en [artikel 7 van Boek 1 van het Burgerlijk Wetboek][ref2] zijn
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel7
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '7'
  - number: '10'
    text: |-
      Degenen die titels en namen dragen krachtens de koninklijke besluiten van 26 oktober 1937 (Stb. 1937, nr. 5) en 2
      januari 1967 (Stb. 1967, nr. 1), behouden deze.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel10
  - number: '11'
    text: |-
      De koninklijke besluiten bedoeld in deze wet, worden genomen op voordracht van Onze Minister-President, Minister
      van Algemene Zaken, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie en in
      het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel11
  - number: '12'
    text: |-
      De [Wet lidmaatschap koninklijk huis][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003875
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003875
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet lidmaatschap koninklijk huis.'
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013729/2002-06-12#Artikel15
