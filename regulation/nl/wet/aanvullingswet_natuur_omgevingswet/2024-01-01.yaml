  - number: 2.6.1
    text: |-
      Ontheffingen als bedoeld in de [artikelen 3.3, eerste of derde lid][ref1], [3.4, tweede of derde lid][ref2],
      [3.8, eerste, derde of vierde lid][ref3], [3.9, tweede lid][ref4], [3.10, tweede lid][ref5] in samenhang
