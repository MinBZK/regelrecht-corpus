preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de in de Wet natuurbescherming gestelde regels te
    integreren in het stelsel van de Omgevingswet;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#ArtikelAanhef
articles:
  - number: '2.1'
    text: |-
      1 Besluiten tot aanwijzing van gebieden als bedoeld in [artikel 2.1, eerste lid, van de Wet natuurbescherming][ref1]
      die onherroepelijk zijn, gelden als besluiten als bedoeld in [artikel 2.44, eerste lid, van de Omgevingswet][ref2].

      2 Besluiten tot aanwijzing van gebieden als bedoeld in
      [artikel 2.11, eerste lid, van de Wet natuurbescherming][ref3] die onherroepelijk zijn, gelden als besluiten als
      bedoeld in [artikel 2.44, tweede lid, van de Omgevingswet][ref4].

      3 Besluiten tot aanwijzing van gebieden als bedoeld in [artikel 8.3, eerste lid, van de Wet natuurbescherming][ref5]
      die onherroepelijk zijn, gelden als besluiten als bedoeld in [artikel 2.44, derde lid, van de Omgevingswet][ref6].

      4 Besluiten tot aanwijzing van gebieden als bedoeld in
      [artikel 1.12, tweede lid, van de Wet natuurbescherming][ref7] die onherroepelijk zijn, gelden als besluiten als
      bedoeld in [artikel 2.44, vierde lid, van de Omgevingswet][ref8].

      5 Besluiten tot aanwijzing van gebieden als bedoeld in
      [artikel 1.12, derde lid, van de Wet natuurbescherming][ref9] die onherroepelijk zijn, gelden als besluiten als
      bedoeld in [artikel 2.44, vijfde lid, van de Omgevingswet][ref10].


