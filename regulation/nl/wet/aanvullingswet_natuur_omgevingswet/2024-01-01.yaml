  - number: '2.5'
    text: |-
      1 Besluiten tot goedkeuring van faunabeheerplannen als bedoeld in
      [artikel 3.12, zevende lid, van de Wet natuurbescherming][ref1] die onherroepelijk zijn, gelden als besluiten tot
      goedkeuring als bedoeld in de regels, gesteld op grond van [artikel 8.1, tweede lid, van de Omgevingswet][ref2].

      2 Jachtakten als bedoeld in [artikel 3.26, eerste lid, onder a, van de Wet natuurbescherming][ref3]
      die onherroepelijk zijn, gelden als omgevingsvergunningen voor een jachtgeweeractiviteit als bedoeld in
      [artikel 5.1, eerste lid, onder f, van de Omgevingswet][ref4].

      3 Valkeniersakten als bedoeld in [artikel 3.30, eerste lid, van de Wet natuurbescherming][ref5] die
      onherroepelijk zijn, gelden als omgevingsvergunningen voor een valkeniersactiviteit als bedoeld in
      [artikel 5.1, eerste lid, onder g, van de Omgevingswet][ref6].

      4 Erkenningen van jachtexamens als bedoeld in
      [artikel 3.28, tweede lid, onderdeel a, van de Wet natuurbescherming][ref7], examens voor het gebruik van
      jachtvogels als bedoeld in [artikel 3.30, tweede lid, van de Wet natuurbescherming][ref8] en examens voor het
      gebruik van eendenkooien als bedoeld in artikel 3.30, derde lid, van de Wet natuurbescherming die onherroepelijk
      zijn, gelden als erkenningen als bedoeld in de regels, gesteld op grond van [artikel 4.3][ref9], in samenhang met
      [artikel 4.32, van de Omgevingswet][ref10].

      5 Vergunningen en ontheffingen, verleend krachtens de Vogelwet 1936, de [Jachtwet][ref11],
      [artikel 25 van de Natuurbeschermingswet][ref12] of de Wet bedreigde uitheemse dier- en plantensoorten blijven van
      kracht voor de tijd dat zij zijn verleend. De [artikelen 5.39][ref13] en [5.40 van de Omgevingswet][ref14] zijn van
      overeenkomstige toepassing.

      6 Een omgevingsvergunning voor een jachtgeweeractiviteit wordt niet geweigerd als de aanvrager niet met gunstig
      gevolg een jachtexamen heeft afgelegd, als hem in de periode van 1 januari 1977 tot en met 31 maart 2002 een
      jachtakte als bedoeld in de [Jachtwet][ref15] is uitgereikt of als hem in de periode van 1 april 2002 tot en met
      30 september 2004 een jachtakte als bedoeld in de [Flora- en faunawet][ref16] is uitgereikt onder het met gunstig
      gevolg behalen van een krachtens de Jachtwet erkend jachtexamen.


