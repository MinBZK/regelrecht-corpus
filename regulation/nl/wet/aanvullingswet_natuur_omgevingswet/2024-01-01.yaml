    text: |-
      Benoemingen en herbenoemingen als bedoeld in [artikel 3.41, derde lid, van de Wet natuurbescherming][ref1]
      die onherroepelijk zijn, gelden als benoemingen en herbenoemingen als bedoeld in
      [artikel 17.2, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel17
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.7
