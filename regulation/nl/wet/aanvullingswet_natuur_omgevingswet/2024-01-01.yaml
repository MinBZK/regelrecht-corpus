      voor aanvragen van een omgevingsvergunning die ook betrekking heeft op het verrichten van een handeling als bedoeld
      in de [artikelen 3.1][ref2], [3.5][ref3] of [3.10, eerste lid, van de Wet natuurbescherming][ref4], gelden als
      instemmingen als bedoeld in [artikel 16.16 van de Omgevingswet][ref5].


