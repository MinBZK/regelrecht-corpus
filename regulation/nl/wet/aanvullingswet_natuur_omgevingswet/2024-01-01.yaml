        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 2.9.1
    text: |-
      Als voor de inwerkingtreding van deze wet een aanvraag om een besluit op grond van de [Wet natuurbescherming][ref1]
      is ingediend, blijft het oude recht van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: 2.9.1.a
    text: als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.1.b
    text: als tegen het besluit geen beroep open staat, tot het besluit van kracht is.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Als voor de inwerkingtreding van deze wet een ontwerp ter inzage is gelegd van een besluit op de voorbereiding
      waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, blijft het oude recht van
      toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.9.2.a
    text: als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.2.b
    text: als tegen het besluit geen beroep openstaat, tot het besluit van kracht is.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Als voor de inwerkingtreding van deze wet voor een ambtshalve te nemen besluit toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] of het besluit is bekendgemaakt, blijft het oude recht van
      toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.9.3.a
    text: als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.3.b
    text: als tegen het besluit geen beroep openstaat, tot het besluit van kracht is.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.4
    text: |-
      Wanneer voor de inwerkingtreding van deze wet een overtreding plaatsvond of is aangevangen of het gevaar
      klaarblijkelijk dreigde voor een overtreding van het bepaalde bij en krachtens de [Wet natuurbescherming][ref1],
      en voor die overtreding een bestuurlijke sanctie is opgelegd of een schriftelijk voornemen daartoe is verzonden aan
      een belanghebbende, is het oude recht van toepassing tot het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: 2.9.4.a
    text: de beschikking onherroepelijk is geworden en ten uitvoer is gelegd,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.4.b
    text: de beschikking is ingetrokken, of
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.4.c
    text: 'als de beschikking de oplegging van een last onder dwangsom betreft:'
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.4.c.1°
    text: de dwangsom is ingevorderd, of
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: 2.9.4.c.2°
    text: de bij de beschikking opgelegde last onder dwangsom is opgeheven.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.9
  - number: '3.1'
    text: |-
      De [Wet natuurbescherming][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: 4.1.1
    text: |-
      Op de voorbereiding van een algemene maatregel van bestuur in verband met de invoering van de Aanvullingswet natuur
      Omgevingswet zijn de [artikelen 23.4][ref1] en [23.5 van de Omgevingswet][ref2] van overeenkomstige toepassing.
      Op de voorbereiding van een ministeriële regeling in verband met de invoering van de Aanvullingswet natuur
      Omgevingswet is [artikel 23.4 van de Omgevingswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel23
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '23'
  - number: 4.1.2
    text: 'De artikelen, bedoeld in het eerste lid, treden in de plaats van wettelijke voorschriften waarin is bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.a
    text: |-
      over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd of
      extern overleg moet worden gevoerd,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.b
    text: van het ontwerp van een regeling kennis moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.c
    text: |-
      de voordracht niet eerder wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.d
    text: |-
      de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze Minister
      van Landbouw, Natuur en Voedselkwaliteit,
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.e
    text: |-
      door of namens een van de kamers der Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, en
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.2.f
    text: |-
      een regeling niet eerder in werking kan treden dan nadat sinds haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Het tweede lid, aanhef en onder a, is niet van toepassing op het vragen van advies aan de Afdeling advisering van
      de Raad van State.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.2
  - number: '4.3'
    text: 'Deze wet wordt aangehaald als: Aanvullingswet natuur Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel4.3
