        artikel: '4'
  - number: 2.8.2
    text: |-
      Verboden als bedoeld in [artikel 4.2, derde lid, van de Wet natuurbescherming][ref1], vastgesteld
      bij: '- beschikking die onherroepelijk is, gelden als maatwerkvoorschriften als bedoeld in'
      [artikel 4.5, eerste lid, van de Omgevingswet][ref2],
        - verordening, gelden maatwerkregels in een omgevingsverordening als bedoeld in
      [artikel 4.6, tweede lid, van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
