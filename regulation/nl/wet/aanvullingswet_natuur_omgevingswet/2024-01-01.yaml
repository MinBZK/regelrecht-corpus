  - number: 2.6.2
    text: |-
      Onderdelen van een omgevingsvergunning als bedoeld in de [Wet algemene bepalingen omgevingsrecht][ref1]
      die onherroepelijk is, die betrekking hebben op het verrichten van een handeling als bedoeld in
      de [artikelen 3.1][ref2], [3.5][ref3] of [3.10, eerste lid, van de Wet natuurbescherming][ref4],
      gelden als onderdelen van een omgevingsvergunning voor meer activiteiten als bedoeld in
      [artikel 5.7, eerste lid, van de Omgevingswet][ref5], die betrekking hebben op een flora- en fauna-activiteit als
      bedoeld in [artikel 5.1, tweede lid, onder g, van de Omgevingswet][ref6].


