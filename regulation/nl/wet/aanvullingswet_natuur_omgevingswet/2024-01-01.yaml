  - number: 2.8.1
    text: |-
      Meldingen als bedoeld in [artikel 4.2, eerste lid, van de Wet natuurbescherming][ref1] gelden als meldingen als
      bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.8
