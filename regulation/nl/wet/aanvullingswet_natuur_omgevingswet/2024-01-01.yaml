  - number: 2.5.6
    text: |-
      Een omgevingsvergunning voor een jachtgeweeractiviteit wordt niet geweigerd als de aanvrager niet met gunstig
      gevolg een jachtexamen heeft afgelegd, als hem in de periode van 1 januari 1977 tot en met 31 maart 2002 een
      jachtakte als bedoeld in de [Jachtwet][ref1] is uitgereikt of als hem in de periode van 1 april 2002 tot en met
      30 september 2004 een jachtakte als bedoeld in de [Flora- en faunawet][ref2] is uitgereikt onder het met gunstig
      gevolg behalen van een krachtens de Jachtwet erkend jachtexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.5
