    text: |-
      1 Besluiten tot het opleggen van verplichtingen als bedoeld in
      [artikel 2.4, eerste lid, van de Wet natuurbescherming][ref1] die onherroepelijk zijn, gelden als besluiten tot het
      stellen van maatwerkvoorschriften als bedoeld in [artikel 4.5 van de Omgevingswet][ref2].

      2 Besluiten tot het opleggen van verboden of beperkingen als bedoeld in
      [artikel 2.5, eerste lid, van de Wet natuurbescherming][ref3] die onherroepelijk zijn, gelden als besluiten tot het
      opleggen van verboden of beperkingen als bedoeld in [artikel 2.45, eerste lid, van de Omgevingswet][ref4].

      3 Besluiten tot het opleggen van verboden of beperkingen als bedoeld in [artikel 2.5, eerste lid][ref5],
      in samenhang met [2.10, eerste lid, onder b, van de Wet natuurbescherming][ref6], die onherroepelijk
      zijn, gelden als besluiten tot het opleggen van verboden of beperkingen als bedoeld in
      [artikel 2.45, tweede lid, van de Omgevingswet][ref7].

      4 Besluiten tot het opleggen van verboden of beperkingen als bedoeld in [artikel 2.11, derde lid][ref8], in
      samenhang met [2.5 van de Wet natuurbescherming][ref9], die onherroepelijk zijn, vastgesteld door:

      a. Onze Minister van Landbouw, Natuur en Voedselkwaliteit gelden als besluiten tot het opleggen van verboden of
      beperkingen als bedoeld in [artikel 2.45, derde lid, van de Omgevingswet][ref10],

      b. provinciale staten of gedeputeerde staten, gelden als besluiten tot het opleggen van verboden of beperkingen als
      bedoeld in [artikel 2.45, vierde lid, van de Omgevingswet][ref11].

      5 Feitelijke handelingen als bedoeld in [artikel 2.6, eerste lid, van de Wet natuurbescherming][ref12] die
      op het tijdstip van inwerkingtreding van deze wet nog niet zijn voltooid, en de plaatsing van kentekenen
      als bedoeld in [artikel 2.6, tweede lid, van de Wet natuurbescherming][ref13], wel dan niet in samenhang met
      [artikel 2.10, eerste lid, onder a][ref14], of [2.11, derde lid, van de Wet natuurbescherming][ref15], gelden als
      maatregelen als bedoeld in [artikel 10.10a van de Omgevingswet][ref16].


