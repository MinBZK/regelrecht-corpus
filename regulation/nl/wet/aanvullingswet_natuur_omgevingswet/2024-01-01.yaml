  - number: '2.9'
    text: |-
      1 Als voor de inwerkingtreding van deze wet een aanvraag om een besluit op grond van de
      [Wet natuurbescherming][ref1] is ingediend, blijft het oude recht van toepassing:

      a. als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,

      b. als tegen het besluit geen beroep open staat, tot het besluit van kracht is.

      2 Als voor de inwerkingtreding van deze wet een ontwerp ter inzage is gelegd van een besluit op de voorbereiding
      waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is, blijft het oude recht van
      toepassing:

      a. als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,

      b. als tegen het besluit geen beroep openstaat, tot het besluit van kracht is.

      3 Als voor de inwerkingtreding van deze wet voor een ambtshalve te nemen besluit toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref3] of het besluit is bekendgemaakt, blijft het oude recht van
      toepassing:

      a. als tegen het besluit beroep openstaat, tot het besluit onherroepelijk is,

      b. als tegen het besluit geen beroep openstaat, tot het besluit van kracht is.

      4 Wanneer voor de inwerkingtreding van deze wet een overtreding plaatsvond of is aangevangen of het gevaar
      klaarblijkelijk dreigde voor een overtreding van het bepaalde bij en krachtens de [Wet natuurbescherming][ref4],
      en voor die overtreding een bestuurlijke sanctie is opgelegd of een schriftelijk voornemen daartoe is verzonden aan
      een belanghebbende, is het oude recht van toepassing tot het tijdstip waarop:

      a. de beschikking onherroepelijk is geworden en ten uitvoer is gelegd,

      b. de beschikking is ingetrokken, of

      c. als de beschikking de oplegging van een last onder dwangsom betreft:

      1°. de dwangsom is ingevorderd, of

      2°. de bij de beschikking opgelegde last onder dwangsom is opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0037552
