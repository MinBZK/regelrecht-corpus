        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '17'
  - number: 2.7.2
    text: |-
      De [artikelen 18.16a][ref1] en [18.16b van de Omgevingswet][ref2] zijn van overeenkomstige toepassing op dieren,
      planten of producten van planten of dieren of eieren die in strijd met de [Flora- en faunawet][ref3] of de
      [Wet natuurbescherming][ref4] binnen het grondgebied van Nederland zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009640
      [ref4]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.7
