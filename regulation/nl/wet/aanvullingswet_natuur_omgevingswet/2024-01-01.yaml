  - number: '2.6'
    text: |-
      1 Ontheffingen als bedoeld in de [artikelen 3.3, eerste of derde lid][ref1], [3.4, tweede of derde lid][ref2],
      [3.8, eerste, derde of vierde lid][ref3], [3.9, tweede lid][ref4], [3.10, tweede lid][ref5] in samenhang
      met [3.8, eerste lid][ref6], [artikel 3.32, tweede lid][ref7], of [3.34, derde of vijfde lid][ref8],
      en opdrachten als bedoeld in [artikel 3.18, eerste lid, van de Wet natuurbescherming][ref9] die
      onherroepelijk zijn, gelden als omgevingsvergunningen voor flora- en fauna-activiteiten als bedoeld in
      [artikel 5.1, tweede lid, onder g, van de Omgevingswet][ref10].

      2 Onderdelen van een omgevingsvergunning als bedoeld in de [Wet algemene bepalingen omgevingsrecht][ref11]
      die onherroepelijk is, die betrekking hebben op het verrichten van een handeling als bedoeld in de
      [artikelen 3.1][ref12], [3.5][ref13] of [3.10, eerste lid, van de Wet natuurbescherming][ref14],
      gelden als onderdelen van een omgevingsvergunning voor meer activiteiten als bedoeld in
      [artikel 5.7, eerste lid, van de Omgevingswet][ref15], die betrekking hebben op een flora- en fauna-activiteit als
      bedoeld in [artikel 5.1, tweede lid, onder g, van de Omgevingswet][ref16].

      3 Verklaringen van geen bedenkingen als bedoeld in de [Wet algemene bepalingen omgevingsrecht][ref17] die zijn
      gegeven voor aanvragen van een omgevingsvergunning die ook betrekking heeft op het verrichten van een handeling
      als bedoeld in de [artikelen 3.1][ref18], [3.5][ref19] of [3.10, eerste lid, van de Wet natuurbescherming][ref20],
      gelden als instemmingen als bedoeld in [artikel 16.16 van de Omgevingswet][ref21].

      4 Vrijstellingen in een kavelbesluit als bedoeld in [artikel 7, eerste lid, van de Wet windenergie op zee][ref22],
      zoals deze gold onmiddellijk voor inwerkingtreding van deze wet, gelden als afwijkingen in een kavelbesluit als
      bedoeld in artikel 7, eerste lid, van de Wet windenergie op zee.


