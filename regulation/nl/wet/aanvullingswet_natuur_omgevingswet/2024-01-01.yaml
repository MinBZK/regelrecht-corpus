  - number: '2.2'
    text: |-
      1 Beheerplannen als bedoeld in [artikel 2.3, eerste lid, van de Wet natuurbescherming][ref1] die onherroepelijk
      zijn, gelden als beheerplannen als bedoeld in [artikel 3.8, derde lid, van de Omgevingswet][ref2].

      2 In afwijking van het eerste lid gelden beheerplannen als bedoeld in [artikel 2.3, eerste lid][ref3], in
      samenhang met [artikel 2.10, eerste lid, onder a, van de Wet natuurbescherming][ref4] die onherroepelijk zijn, als
      beheerplannen als bedoeld in [artikel 3.9, derde lid, van de Omgevingswet][ref5].

      3 Het eerste beheerplan voor een Natura 2000-gebied na aanwijzing van dat gebied
      op grond van [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref6] of
      [artikel 2.1, eerste lid, van de Wet natuurbescherming][ref7], wordt uiterlijk drie jaar na dat besluit tot
      aanwijzing vastgesteld.

      4 Het programma aanpak stikstof, zoals dat is vastgesteld en gewijzigd op grond van
      [artikel 2.1 van het Besluit natuurbescherming][ref8], geldt als programma aanpak stikstof als bedoeld in
      [artikel 3.9, vierde lid, van de Omgevingswet][ref9].


