      1 Meldingen als bedoeld in [artikel 4.2, eerste lid, van de Wet natuurbescherming][ref1] gelden als meldingen als
      bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref2].

      2 Verboden als bedoeld in [artikel 4.2, derde lid, van de Wet natuurbescherming][ref3], vastgesteld bij:

        - beschikking die onherroepelijk is, gelden als maatwerkvoorschriften als bedoeld in
      [artikel 4.5, eerste lid, van de Omgevingswet][ref4],
        - verordening, gelden maatwerkregels in een omgevingsverordening als bedoeld in
      [artikel 4.6, tweede lid, van de Omgevingswet][ref5].

      3 Ontheffingen als bedoeld in [artikel 4.5, eerste of derde lid][ref6], of
      [artikel 4.9 van de Wet natuurbescherming][ref7] die onherroepelijk zijn, gelden als besluiten tot het stellen van
      maatwerkvoorschriften als bedoeld in [artikel 4.5 van de Omgevingswet][ref8].


