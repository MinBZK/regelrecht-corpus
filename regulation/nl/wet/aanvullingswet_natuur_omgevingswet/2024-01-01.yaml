      kracht voor de tijd dat zij zijn verleend. De [artikelen 5.39][ref3] en [5.40 van de Omgevingswet][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel5
