  - number: '2.4'
    text: |-
      1 Vergunningen als bedoeld in [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref1] die
      onherroepelijk zijn, gelden als omgevingsvergunningen voor Natura 2000-activiteiten als bedoeld in
      [artikel 5.1, eerste lid, onder e, van de Omgevingswet][ref2].

      2 Voorschriften, verbonden aan vergunningen als bedoeld in
      [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref3] die onherroepelijk zijn, gelden als voorschriften als
      bedoeld in [artikel 5.34, eerste lid, van de Omgevingswet][ref4].

      3 Onderdelen van een omgevingsvergunning als bedoeld in de [Wet algemene bepalingen omgevingsrecht][ref5]
      die onherroepelijk is, die betrekking hebben op het realiseren van een project als bedoeld in
      [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref6], gelden als onderdelen van een omgevingsvergunning
      voor meer activiteiten als bedoeld in [artikel 5.7, eerste lid, van de Omgevingswet][ref7], die betrekking hebben
      op een Natura 2000-activiteit als bedoeld in [artikel 5.1, eerste lid, onder e, van de Omgevingswet][ref8].

      4 Verklaringen van geen bedenkingen als bedoeld in de [Wet algemene bepalingen omgevingsrecht][ref9] die zijn
      gegeven voor aanvragen van een omgevingsvergunning die ook betrekking hebben op het realiseren van een project als
      bedoeld in [artikel 2.7, tweede lid, van de Wet natuurbescherming,][ref10] gelden als instemmingen als bedoeld in
      [artikel 16.16 van de Omgevingswet][ref11].

      5 [Artikel 5.1, eerste lid, aanhef en onder e, van de Omgevingswet][ref12] is niet van toepassing op besluiten
      als bedoeld in [artikel 9.4, achtste of negende lid, van de Wet natuurbescherming][ref13] die onherroepelijk
      zijn. De [paragrafen 5.1.3][ref14], [5.1.4][ref15] en [5.1.5 van de Omgevingswet][ref16] zijn van overeenkomstige
      toepassing.


