        artikel: '4'
  - number: 2.8.3
    text: |-
      Ontheffingen als bedoeld in [artikel 4.5, eerste of derde lid][ref1], of
      [artikel 4.9 van de Wet natuurbescherming][ref2] die onherroepelijk zijn, gelden als besluiten tot het stellen van
      maatwerkvoorschriften als bedoeld in [artikel 4.5 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0044063/2024-01-01#Artikel2.8
    references:
      - id: ref1
