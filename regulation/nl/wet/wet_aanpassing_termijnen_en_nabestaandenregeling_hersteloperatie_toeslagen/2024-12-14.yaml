preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is aanvullende maatregelen te treffen om beslistermijnen
    in de hersteloperatie toeslagen in overeenstemming te brengen met de termijn waarbinnen in de praktijk een besluit
    wordt genomen, om de termijn voor het doen van een aanvraag voor aanvullende compensatie of een aanvullende O/
    GS-tegemoetkoming te verlengen, om de bezwaartermijn te verlengen, om de peildatum te wijzigen die geldt voor
    gedupeerden die zich in het buitenland bevinden om in aanmerking te komen voor brede ondersteuning en om de
    nabestaandenregeling aan te passen zodat deze uitvoerbaar is;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050567/2024-12-14#ArtikelAanhef
articles:
