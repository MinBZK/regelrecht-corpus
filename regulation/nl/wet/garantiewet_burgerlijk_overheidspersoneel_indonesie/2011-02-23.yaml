---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: garantiewet_burgerlijk_overheidspersoneel_indonesie
regulatory_layer: WET
publication_date: '2012-12-27'
valid_from: '2011-02-23'
bwb_id: BWBR0002060
url: https://wetten.overheid.nl/BWBR0002060/2011-02-23
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de overgang naar een nieuwe rechtsorde
    zekere waarborgen van het Rijk jegens bepaalde groepen burgerlijke overheidsdienaren en gewezen burgerlijke
    overheidsdienaren van Indonesië en hun nagelaten betrekkingen bij de wet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.I
    text: |-
      "overheidsdienaren": burgerlijke landsdienaren van Indonesië, en personen in dienst van de zelfstandige
      gemeenschappen, ingesteld op de voet van de artikelen 119, 121 of 123 der Indische Staatsregeling,
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.I.a
    text: |-
      die op 5 Augustus 1949: hetzij in vaste dienst waren, hetzij waren aangenomen op een kortverband, waaraan recht
      op vrije overtocht naar Nederland is verbonden, mits op die aanneming een feitelijke indiensttreding is gevolgd,
      hetzij in tijdelijke dienst waren sedert een aan 1 Maart 1942 voorafgaand tijdstip, hetzij in tijdelijke dienst
      waren in aansluiting op een dienstverband, dat door het Reglement betreffende de aanneming en de dienstvoorwaarden
      van werkkrachten op maand-, dag- of uurloon (M.D.R. 1939) of daarmede in aard overeenkomende reglementen werd
      beheerst, of op een kortverband, dan wel op een betrekking als bijzondere leerkracht in de zin van artikel 1
      onder 2° van het Pensioenreglement voor bijzondere leerkrachten, mits deze verbanden of deze betrekking bestonden
      sedert een aan 1 Maart 1942 voorafgaand tijdstip, hetzij in tijdelijke dienst waren en sedert een aan 1 Maart 1942
      voorafgaand tijdstip tot aan dat van aanstelling in tijdelijke dienst als dienst- of reserveplichtige onafgebroken
      in militaire dienst zijn geweest;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.I.b
    text: |-
      die na 5 Augustus 1949, doch vóór de souvereiniteitsoverdracht zijn aangesteld in vaste dienst, of aangenomen op
      een kortverband, waaraan recht op vrije overtocht naar Nederland is verbonden;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.I.c
    text: |-
      die voor de toepassing van deze wet door Onze Minister in overeenstemming met Onze Minister van Financiën met een
      der onder *a* of *b* bedoelde categorieën zijn gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.II
    text: '"gewezen overheidsdienaren":'
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.II.a
    text: |-
      personen, die na Augustus 1945 in overheidsdienst aan de wederopbouw van Indonesië daadwerkelijk hebben medegewerkt
      dan wel - ter beslissing van de commissie - daartoe wel bereid zijnde, buiten eigen schuld of toedoen daartoe
      verhinderd zijn geweest, wier dienstverband op een tijdstip vóór 5 Augustus 1949 is geëindigd en die op dat
      tijdstip een der dienstverbanden hadden als omschreven onder I;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.II.b
    text: |-
      personen, die op of na 1 Maart 1942, doch vóór het tijdstip van de souvereiniteitsoverdracht in tijdelijke dienst
      van het Land of van een der onder I bedoelde zelfstandige gemeenschappen zijn getreden en wegens in en door de
      dienst bekomen letsel of gebreken zijn of zullen zijn ontslagen;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.III
    text: |-
      "nagelaten betrekkingen": betrekkingen van een overleden overheidsdienaar, een overleden gewezen overheidsdienaar,
      zomede van een Nederlander, die nà 1 Maart 1942, doch vóór September 1945, dan wel wegens oorlogsletsel in het
      tijdvak van 8 December 1941 tot en met 1 Maart 1942 is overleden, en op het tijdstip van overlijden een der
      dienstverbanden had als omschreven onder I, een en ander voor zover zij op grond van dat overlijden gerechtigd zijn
      tot een uitkering van overheidswege en voor zover zij Nederlander zijn en zolang zij deze status behouden, tenzij
      [artikel 8][ref1] op hen van toepassing is, dan wel dispensatie is verleend als bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel5
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '5'
  - number: 1.IV
    text: |-
      "afvloeiingsvoorwaarden": de afvloeiingsvoorwaarden, behorende bij de Overeenkomst inzake de positie van de
      Burgerlijke Overheidsdienaren in verband met de souvereiniteitsoverdracht (*Stb.* J 570).
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.V
    text: |-
      "normaal pensioen": het pensioen, waarop recht wordt verkregen bij het bereiken van een diensttijd van 20 en een
      leeftijd van 50 jaar, onderscheidenlijk van een diensttijd van 25 en een leeftijd van 55 jaar, naar gelang de door
      de betrokken overheidsdienaar beklede betrekking krachtens de terzake op 5 Augustus 1949 voor hem van kracht zijnde
      pensioenregeling is ingedeeld in de daarin bedoelde pensioengroep I, onderscheidenlijk pensioengroep II.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.VI
    text: |-
      "de commissie": de bevoegde commissie, als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel8
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '8'
  - number: 1.VII
    text: |-
      "Onze Minister": Onze Minister, belast met de uitvoering van de Garantiewet Burgerlijk Overheidspersoneel
      Indonesië.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.VIII
    text: |-
      "Onze Ministers": Onze Minister, belast met de uitvoering van de Garantiewet Burgerlijk Overheidspersoneel
      Indonesië en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: 1.IX
    text: |-
      "Pensioenstichting": Stichting tot verzorging en afwikkeling van pensioensaangelegenheden betreffende gewezen
      overheidspersoneel van Indonesië en hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel1
  - number: '2.1'
    text: |-
      Met inachtneming van het bepaalde in de volgende leden en in de volgende artikelen garandeert het Rijk aan
      de overheidsdienaren, die hun in [artikel 1, onder I][ref1] bedoeld dienstverband vóór of op 31 December 1959
      vrijwillig beëindigen, dan wel uit dat dienstverband vóór of op 31 December 1959 worden ontslagen anders dan op
      eigen verzoek, mits dit ontslag niet is te wijten aan eigen schuld, de voldoening van alle rechten en aanspraken,
      welke hun op grond van die beëindiging bij toepassing van de terzake op 5 Augustus 1949 van kracht zijnde
      regelingen toekomen, en overigens de gevolgen, als omschreven in de afvloeiingsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: '2.2'
    text: 'Voor de toepassing van deze wet:'
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2.2.a
    text: |-
      wordt het in de afvloeiingsvoorwaarden onder B genoemde bedrag van € 79,41 ’s maands gesteld op € 136,13 ’s maands
      voor kostwinners en op € 102,10 ’s maands voor niet-kostwinners, en vervalt de daarbij gestelde eis van tenminste
      10 jaar;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2.2.b
    text: |-
      wordt onder de in de afvloeiingsvoorwaarden onder A en B bedoelde laatstelijk genoten activiteitswedde
      onderscheidenlijk activiteitswedde verstaan de activiteitsbezoldiging, waarop volgens de op 5 Augustus 1949 van
      kracht zijnde regelingen op het tijdstip van de dienstbeëindiging rechtens aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2.2.c
    text: |-
      worden op de op basis van de afvloeiingsvoorwaarden verleende uitkeringen in Indonesië duurte-, gezins- en
      kindertoelagen toegekend volgens de ter plaatse geldende regelingen, behoudens de bevoegdheid van Onze Ministers om
      van deze regelingen af te wijken;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2.2.d
    text: eindigt de wachtgeldperiode als bedoeld in de afvloeiingsvoorwaarden uiterlijk 31 December 1961.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: '2.3'
    text: |-
      Voorzover recht of aanspraak op vrije overtocht naar Nederland op de voet van de terzake op 5 Augustus 1949
      van kracht zijnde regelingen niet reeds bestaat of bij deze wet wordt gegarandeerd, garandeert het Rijk - met
      inachtneming van het bepaalde bij de volgende artikelen - aan de overheidsdienaren en hun gezinsleden in verband
      met een beëindiging van een in [artikel 1, onder I][ref1] bedoeld dienstverband, vrij vervoer naar Nederland op
      redelijke voorwaarden, indien die overheidsdienaren:


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: 2.3.a
    text: |-
      op het tijdstip van beëindiging van dat dienstverband een bezoldiging genoten van ten minste R 485 ’s maands en -
      ter beslissing van de commissie - bijzondere belangen in Europa hebben in de zin van artikel 3, tweede lid van het
      Buitenlands verlofreglement 1937;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2.3.b
    text: |-
      niet voldoen aan de onder *a* gestelde voorwaarden, doch - zulks ter beslissing van de commissie - in
      omstandigheden zijn komen te verkeren, welke van dien aard zijn, dat zij niet langer in Indonesië kunnen
      verblijven, hetzij ten gevolge van dan wel in samenhang met de uitoefening van hun functie, hetzij ten gevolge
      van het uittreden uit die functie nadat doordienen ten gevolge van dan wel in samenhang met de uitoefening van hun
      functie onmogelijk was geworden.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: '2.4'
    text: |-
      Op verzoek van betrokkene kan Onze Minister beslissen, dat in de gevallen, waarin recht bestaat op vrije overtocht
      naar Nederland ten laste van het Rijk, in de plaats van die vrije overtocht ten laste van het Rijk een geldelijke
      uitkering aan betrokkene wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2
  - number: 2a.1
    text: |-
      Met inachtneming van het bepaalde in de volgende artikelen garandeert het Rijk aan de overheidsdienaren, wier in
      [artikel 1, onder I][ref1] bedoeld dienstverband na 31 December 1959 wordt voortgezet, gerekend van dat tijdstip
      de voldoening van alle rechten en aanspraken, welke hun ingevolge het bepaalde in [artikel 2, lid 1][ref2], zouden
      zijn toegekomen, ingeval zij op 31 December 1959 de dienst zouden hebben beëindigd, met dien verstande, dat zij,
      zolang zij hun dienstverband met de Republiek Indonesië nog niet daadwerkelijk hebben beëindigd, geen aanspraak
      kunnen doen gelden op uitkeringen uit hoofde van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel2
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '2'
  - number: 2a.2
    text: |-
      Onverminderd het bepaalde in het vorige lid en met inachtneming van het bepaalde in de volgende artikelen
      garandeert het Rijk aan de in dat lid bedoelde overheidsdienaren bij daadwerkelijke dienstbeëindiging op een
      tijdstip na 31 December 1959 met recht op pensioen of aanspraak op onderstand bij wijze van pensioen volgens de
      op dat tijdstip bij de Republiek Indonesië van kracht zijnde regelingen de voldoening van de eigen pensioenen en
      onderstanden bij wijze van pensioen, waarop op dat tijdstip volgens de op 5 Augustus 1949 bestaande regelingen
      recht of aanspraak zou bestaan bij ontslag wegens welbewezen ziels- of lichaamsgebreken.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel2a
  - number: '3'
    text: |-
      Met inachtneming van het bepaalde in de volgende artikelen garandeert het Rijk aan de gewezen overheidsdienaren de
      voldoening van alle rechten en aanspraken, welke hun op grond van het hun verleende ontslag volgens de ten tijde
      van dat ontslag van kracht zijnde regelingen toekomen, met dien verstande, dat de garantie voor hen, die op of nà
      5 Augustus 1949 zijn of zullen zijn ontslagen, de voldoening van alle rechten en aanspraken omvat, welke hun op
      grond van het hun verleende ontslag bij toepassing van de terzake op 5 Augustus 1949 van kracht zijnde regelingen
      toekomen.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel3
  - number: '4'
    text: |-
      Onverminderd de verplichting tot toekenning en voldoening van weduwenpensioenen en wezenonderstanden, waartoe het
      Rijk uit anderen hoofde rechtstreeks gehouden is, garandeert het Rijk aan de nagelaten betrekkingen, behoudens en
      met inachtneming van het bepaalde in de volgende artikelen, de voldoening van alle rechten en aanspraken, welke
      hun volgens de ten tijde van het overlijden van kracht zijnde regelingen toekomen, met dien verstande, dat de
      garantie voor de nagelaten betrekkingen van hem, die na 5 Augustus 1949 is of zal zijn overleden, de voldoening
      van alle rechten en aanspraken omvat, welke hun bij toepassing van de terzake op 5 Augustus 1949 van kracht zijnde
      regelingen toekomen.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4
  - number: 4a.1
    text: |-
      Bij beëindiging van het dienstverband onder toekenning van een uitkering krachtens [artikel 2][ref1] of [2][ref2]
      behoudt de overheidsdienaar in vaste dienst voor zijn weduwe en wezen recht op pensioen onderscheidenlijk
      onderstand ten laste van de Pensioenstichting op de voet van de rechten en verplichtingen, verbonden aan het
      verplichte deelgenootschap in een der voormalige Weduwen- en Wezenfondsen of van het voormalige Europees Locaal
      Pensioenfonds, zulks gerekend van de datum van die beëindiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002060
        artikel: 2a
  - number: 4a.2
    text: |-
      Wanneer de door een overheidsdienaar in vaste dienst terzake van de dienstbeëindiging genoten inkomsten
      blijvend ophouden, is van dat tijdstip af het bepaalde in het vorige lid alleen van toepassing, indien door
      de Pensioenstichting van de betrokken overheidsdienaar het verzoek daartoe wordt ontvangen binnen zes maanden
      nadat die inkomsten hebben opgehouden dan wel, indien deze termijn bij de inwerkingtreding van deze wet reeds
      geheel of ten dele is verstreken, binnen zes maanden na die inwerkingtreding. In dit geval worden de door hem
      verschuldigde bijdragen, behoudens het bepaalde in de volgende leden, berekend over de laatstelijk terzake van die
      dienstbeëindiging genoten inkomsten.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4a
  - number: 4a.3
    text: |-
      In het geval bedoeld in het vorige lid zijn de bepalingen inzake het voldoen van de bijdragen, het bepalen van de
      bijdrage naar de grondslag van een fictief pensioen, het ophouden of de opzegging van het deelgenootschap, zoals
      die golden voor het vrijwillig deelgenootschap in de voormalige in lid 1 genoemde fondsen, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4a
  - number: 4a.4
    text: |-
      De vaststelling van het bedrag van de ingevolge dit artikel verschuldigde bijdragen, van de wijze van voldoening
      daarvan en hetgeen overigens ter uitvoering van het bepaalde in dit artikel nodig is, geschiedt door de Raad
      van Beheer van de Pensioenstichting. Over bijdragen, welke ingevolge het in werking treden van deze wet alsnog
      verschuldigd zijn, is geen rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4a
  - number: 4a.5
    text: |-
      In de gevallen, waarin in de regelingen op het gebied van weduwen- en wezenuitkeringen bevoegdheden tot afwijking
      van die regelingen of tot het treffen van een afzonderlijke voorziening waren voorbehouden aan de Kroon of aan
      de Gouverneur-Generaal, worden deze bevoegdheden met betrekking tot de buiten het grondgebied van de Republiek
      Indonesië gevestigde weduwen en wezen uitgeoefend door de Raad van Beheer van de Pensioenstichting na voorafgaande
      goedkeuring van Onze Ministers van Binnenlandse Zaken en van Financiën.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4a
  - number: 4b
    text: |-
      In de gevallen, waarin in de op 5 Augustus 1949 van kracht zijnde regelingen aan de Kroon of aan de Gouverneur-
      Generaal de bevoegdheid was voorbehouden om ter aanvulling of in afwijking van die regelingen beslissingen te nemen
      of bijzondere voorzieningen te treffen, worden deze bevoegdheden, behoudens het bepaalde in [artikel 4][ref1], voor
      de toepassing van deze wet uitgeoefend door Onze Minister in overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: 4a
  - number: 4c.1
    text: |-
      Voor de toepassing van deze wet wordt aangenomen, dat bij wijziging of intrekking van de op 5 Augustus 1949 van
      kracht zijnde bezoldigingsregelingen deze ongewijzigd van kracht zijn gebleven.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4c
  - number: 4c.2
    text: |-
      Op pensioen of onderstand bij wijze van pensioen wordt, indien bij de vaststelling van de grondslagen daarvan
      rekening is gehouden met bezoldigingen, welke zijn toegekend op grond van na 31 December 1948 geldende
      bezoldigingregelingen, buiten Indonesië geen duurtetoeslag en kindertoelage toegekend, tenzij het bedrag van
      dat pensioen of die onderstand minder bedraagt dan het bedrag aan pensioen of onderstand bij wijze van pensioen,
      dat zou zijn genoten, indien voor de vaststelling van de grondslag uitsluitend rekening zou zijn gehouden met
      bezoldigingen, toegekend op basis van de vóór 1 Januari 1949 bestaande bezoldigingsregelingen, vermeerderd met de
      toekomende duurtetoeslag en kindertoelage, in welk geval het verschil tussen beide bedoelde bedragen in de vorm van
      een duurtetoeslag wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4c
  - number: 4d.1
    text: |-
      De uitkeringen, waartoe het Rijk uit hoofde van of krachtens deze wet gehouden is, worden, behoudens het bepaalde
      in lid 4, vastgesteld en toegekend door of namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4d
  - number: 4d.2
    text: |-
      Over de in lid 1 bedoelde uitkeringen zijn door de betrokkene volgens de terzake op 5 Augustus 1949 van
      kracht zijnde regelingen bijdragen verschuldigd voor de eigen pensioenen en op de voet van het bepaalde in
      [artikel 4a][ref1] voor de weduwenpensioenen en wezenonderstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: 4a
  - number: 4d.3
    text: |-
      De nominale bedragen van de onderstand bij wijze van pensioen, bedoeld sub B van de afvloeiingsvoorwaarden, zomede
      van de blijvende onderstand, bedoeld in [artikel 12 van de wet van 21 December 1951 (][ref1], worden naar boven
      afgerond tot het naastbijliggende veelvoud van een halve euro of halve rupiah. De nominale bedragen van andere
      periodieke uitkeringen worden naar boven afgerond tot het naastbijliggende veelvoud van één euro of één rupiah.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel12
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '12'
  - number: 4d.4
    text: |-
      De periodieke uitkeringen aan buiten het grondgebied van de Republiek Indonesië gevestigde weduwen en wezen, uit
      hoofde van of krachtens de in [artikel 4][ref1] van deze wet gegeven garantie, worden met inachtneming van de door
      of namens Onze Minister te geven aanwijzingen toegekend door de Raad van Beheer van de Pensioenstichting ten laste
      van die stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel4
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '4'
  - number: 4e.1
    text: |-
      Indien een overheidsdienaar of gewezen overheidsdienaar op grond van de dienstbeëindiging rechten of aanspraken
      heeft op uitkeringen ten laste van de Republiek Indonesië, kan hij door Onze Minister worden verplicht het nodige
      te verrichten teneinde deze rechten en aanspraken geldend te maken.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4e
  - number: 4e.2
    text: |-
      Bij niet-nakoming van de in het vorige lid bedoelde verplichting, zomede indien door of vanwege de Republiek
      Indonesië op grond van de dienstbeëindiging uitkeringen zijn of worden toegekend, zullen de garanties volgens door
      Onze Minister te stellen regelen slechts worden verwezenlijkt, voorzover en voorzolang de vanwege de Republiek
      Indonesië toekomende dan wel toegekende uitkeringen minder bedragen dan de uitkeringen, waarop uit hoofde van of
      krachtens deze wet recht of aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel4e
  - number: '5'
    text: |-
      Door Onze Minister kan in overeenstemming met Onze Ministers van Financiën en van Sociale Zaken en Volksgezondheid
      in bijzondere gevallen worden bepaald, dat de garanties uit hoofde van of krachtens deze wet blijven gelden bij
      verandering van nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel5
  - number: '6.1'
    text: |-
      Het nominale bedrag van de periodieke uitkeringen, waartoe het Rijk uit hoofde van of krachtens deze wet is
      gehouden, wordt betaalbaar gesteld:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: 6.1.a
    text: in euro's over het tijdvak, dat de rechthebbende is gevestigd buiten het grondgebied van de Republiek Indonesië;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: 6.1.b
    text: |-
      in Indonesisch courant over het tijdvak, dat de rechthebbende is gevestigd binnen het grondgebied van de Republiek
      Indonesië.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '6.2'
    text: |-
      De betaalbaarstelling van duurtetoeslagen en kindertoelagen, welke op de in het vorige lid bedoelde uitkeringen
      zijn toegekend, geschiedt in dezelfde munteenheid als waarin die uitkeringen betaalbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '6.3'
    text: |-
      Het nominale bedrag van de krachtens een kortverband verschuldigde kortverbandtoelage en bonus, waartoe het Rijk
      uit hoofde van of krachtens deze wet is gehouden, wordt uitbetaald: hetzij in Indonesisch courant, hetzij, indien
      de rechthebbende zich binnen een jaar na beëindiging van het kortverband heeft gevestigd buiten het grondgebied van
      de Republiek Indonesië, in euro's.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '6.4'
    text: |-
      Terugbetaling van overtochts- en vervoerskosten, waartoe het Rijk uit hoofde van of krachtens deze wet is gehouden,
      vindt plaats in Nederland tot de tegenwaarde in euro's.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '6.5'
    text: |-
      Indien betrokkene buiten Nederland en buiten het grondgebied van de Republiek Indonesië is gevestigd, geschiedt de
      bij dit artikel bedoelde betaalbaarstelling dan wel uitbetaling aan een door hem daartoe aan te wijzen gemachtigde
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '6.6'
    text: |-
      In bijzondere gevallen kan van het bepaalde in dit artikel door Onze Minister in overeenstemming met Onze Minister
      van Financiën ten gunste van belanghebbende worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel6
  - number: '7.1'
    text: |-
      Een overheidsdienaar of gewezen overheidsdienaar, die uit hoofde van of krachtens deze wet ten laste van het Rijk
      een periodieke uitkering geniet, is, zolang hij de voor normaal pensioen vereiste leeftijd nog niet heeft bereikt,
      verplicht:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.1.1e
    text: |-
      indien hij in de gelegenheid komt om in het land, waarin hij is gevestigd, op een wijze, welke in verband met zijn
      persoonlijkheid en omstandigheden voor hem passend kan worden geacht, inkomsten uit arbeid te verkrijgen, van die
      gelegenheid gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.1.2e
    text: |-
      een hem aangeboden ambt of betrekking in het land, waarin hij is gevestigd, welke hem in verband met zijn
      persoonlijkheid en omstandigheden redelijkerwijze kan worden opgedragen, te aanvaarden, met dien verstande, dat
      deze verplichting niet omvat het treden in vreemde overheidsdienst.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.1.3e
    text: |-
      van het ter hand nemen van enige betaalde arbeid of van enig bedrijf onverwijld mededeling te doen aan Onze
      Minister;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.1.4e
    text: van de verworven inkomsten en van de eventuele wijzigingen daarin tijdig opgave te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.2'
    text: |-
      Wanneer de in het vorige lid bedoelde persoon inkomsten uit arbeid geniet, wordt, zolang hij de voor normaal
      pensioen vereiste leeftijd nog niet heeft bereikt, op de in dat lid bedoelde uitkering, na aftrek van de
      maandelijks verschuldigde pensioenbijdragen, een korting toegepast ten bedrage van een percentage van de opbrengst
      van arbeid, gelijk aan het percentage, dat de periodieke uitkering uitmaakt van de grondslag, waarover die
      uitkering is berekend, wordende voor de toepassing van dit artikel als opbrengst van arbeid niet in aanmerking
      genomen:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.2.a
    text: voor ongehuwden een bedrag van € 22,69 ’s maands,
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7.2.b
    text: voor gehuwden een bedrag van € 45,38 ’s maands,
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister kan het bepaalde in artikel 7, tweede lid, buiten toepassing laten, of daarvan afwijken, zo
      nodig onder het stellen van voorwaarden, voor zover toepassing ervan zal leiden tot een onbillijkheid van
      overwegende aard, gelet op het uitgangspunt van het bieden van waarborgen van het Rijk jegens bepaalde groepen
      overheidsdienaren, gewezen overheidsdienaren en hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.4'
    text: |-
      Bij niet- of niet behoorlijke nakoming van de in lid 1 bedoelde verplichtingen, alsmede indien de inkomsten zonder
      voldoende reden vrijwillig worden prijs gegeven of door eigen schuld verloren gaan, kan de commissie op daartoe
      van of vanwege Onze Minister ontvangen verzoek beslissen, dat de uitkering gerekend van een door haar te bepalen
      tijdstip geheel of gedeeltelijk, voor een bepaalde tijdsduur, dan wel blijvend, wordt gestaakt.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.5'
    text: |-
      In de gevallen, bedoeld in lid 4, kan Onze Minister bepalen, dat in afwachting van de beslissing van de commissie
      de uitkering geheel of gedeeltelijk wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.6'
    text: |-
      Met de in lid 1 bedoelde personen kan een regeling worden getroffen, krachtens welke het wachtgeld, de onderstand
      bij wijze van wachtgeld of de aflopende onderstand geheel of ten dele wordt vervangen door een afkoopsom. In dit
      geval telt als diensttijd, geldig voor pensioen, mede de tijd, welke als zodanig zou zijn medegeteld, indien geen
      afkoopregeling ware getroffen.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: '7.7'
    text: |-
      Ter uitvoering van dit artikel kunnen door Onze Minister nadere voorschriften en aanwijzingen, hetzij in het
      algemeen hetzij voor enig bijzonder geval, worden gegeven. Bij niet- of niet behoorlijke naleving door de
      belanghebbende van deze voorschriften of aanwijzingen, is het bepaalde in de leden 4 en 5 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7
  - number: 7a.1
    text: |-
      Indien een overheidsdienaar of gewezen overheidsdienaar een periodieke uitkering ten laste van de Republiek
      Indonesië geniet, is hij bevoegd zich voor de toepassing van deze wet tot de commissie te wenden met het verzoek om
      te beslissen:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
  - number: 7a.1.a
    text: |-
      of hij een hem aangeboden ambt of betrekking mag weigeren - dan wel al dan niet terecht heeft geweigerd - te
      aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
  - number: 7a.1.b
    text: |-
      of hij al dan niet terecht geen gebruik heeft gemaakt van een gelegenheid om in het land, waarin hij is gevestigd,
      passende arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
  - number: 7a.1.c
    text: |-
      of door hem verworven inkomsten uit arbeid al dan niet zonder voldoende reden zijn of kunnen worden prijsgegeven,
      dan wel al dan niet door eigen schuld verloren zijn gegaan.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
  - number: 7a.2
    text: Ambten of betrekkingen buiten het land, waarin betrokkene is gevestigd, behoeven niet te worden aanvaard.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
  - number: 7a.3
    text: |-
      Het bepaalde in [artikel 7, leden 2 en 3][ref1], is op een overheidsdienaar of gewezen overheidsdienaar, bedoeld in
      lid 1, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel7
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '7'
  - number: '8.1'
    text: |-
      Wij stellen een of meer commissies in, die - behalve de andere bevoegdheden en werkzaamheden, welke haar bij of
      krachtens deze wet zijn of zullen worden verleend of opgedragen - tot taak hebben voor de toepassing van deze wet:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: 8.1.a
    text: |-
      op verzoek van betrokkenen - in verband met het bepaalde in [artikel 1, onder II, sub b][ref1], - te beslissen,
      of het verkregen ontslag ten rechte wegens in en door de dienst bekomen letsel of gebreken had behoren te zijn
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: 8.1.b
    text: |-
      op verzoek van betrokkenen - in verband met het bepaalde in [artikel 2, lid 1][ref1], - te beslissen, of het
      verkregen ontslag terecht is geoordeeld aan eigen schuld te wijten te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel2
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '2'
  - number: 8.1.c
    text: |-
      op verzoek van betrokkenen te beslissen, of al dan niet dan wel in hoeverre rekening zal worden gehouden met na de
      souvereiniteitsoverdracht ondergane verslechteringen in ambt of betrekking en/of rang;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: 8.1.d
    text: |-
      op verzoek van of vanwege Onze Minister te beslissen, of al dan niet dan wel in hoeverre rekening zal worden
      gehouden met na de souvereiniteitsoverdracht ingetreden verbeteringen in ambt of betrekking en/of rang van de
      betrokken overheidsdienaar;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: 8.1.e
    text: |-
      bij ontbreken van een ontslagbesluit, op verzoek van betrokkenen te beslissen of zij voor de toepassing van deze
      wet moeten worden aangemerkt als te hebben verkregen een ontslag anders dan op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: '8.2'
    text: |-
      De commissie kan, nadat door of vanwege Onze Minister terzake haar oordeel is gevraagd, beslissen, dat de garanties
      uit hoofde van of krachtens deze wet tijdelijk of blijvend en geheel of gedeeltelijk vervallen, indien zij van
      oordeel is, dat:
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: 8.2.a
    text: |-
      een ontslag, als bedoeld in [artikel 1, onder II, sub b][ref1], ten onrechte wegens in en door de dienst bekomen
      letsel of gebreken is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: 8.2.b
    text: |-
      een ontslag, als bedoeld in [artikel 2, lid 1][ref1], terecht is geoordeeld aan eigen schuld te wijten te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel2
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '2'
  - number: 8.2.c
    text: |-
      een overheidsdienaar zich vóór de beëindiging van het in [artikel 1, onder I][ref1], bedoelde dienstverband zodanig
      heeft misdragen, dat, ware hij in dienst gebleven, hem op deze grond ontslag had kunnen zijn verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: 8.2.d
    text: |-
      een overheidsdienaar, gewezen overheidsdienaar of nagelaten betrekking onjuiste of onvolledige gegevens heeft
      verstrekt voor de beoordeling van de aanspraak op de garanties uit hoofde van of krachtens deze wet dan wel voor de
      toekenning en vaststelling van de uitkeringen uit hoofde van of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: '8.3'
    text: Aan de beslissingen van de commissie kunnen door haar voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: '8.4'
    text: |-
      De samenstelling, standplaats, werkwijze en, voorzoveel nodig, de onderlinge verdeling van bevoegdheden
      van commissies worden geregeld bij algemene maatregel van bestuur. Daarbij kunnen binnen het kader van de
      doelstellingen van deze wet de taak en bevoegdheden der commissie worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: '8.5'
    text: |-
      Bij algemene maatregel van bestuur wordt tevens voorzien in de mogelijkheid tot instelling van beroep tegen
      beslissingen van de commissie.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8
  - number: 8a.1
    text: |-
      Onverminderd het bepaalde in lid 5 en met inachtneming van het bepaalde in de [artikelen 4c tot en met 8][ref1],
      garandeert het Rijk bij dienstbeëindiging vóór of op 27 December 1954 aan Indonesische staatsburgers, gewezen
      Nederlanders, die, waren zij Nederlanders gebleven, zouden hebben behoord tot de overheidsdienaren als bedoeld
      in [artikel 1, onder I][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: 4c
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '1'
  - number: 8a.1.a
    text: |-
      indien hun in dat artikel bedoeld dienstverband is of wordt beëindigd met recht op pensioen of aanspraak op
      onderstand bij wijze van pensioen volgens de bij de Republiek Indonesië van kracht zijnde regelingen, de voldoening
      van de eigen pensioenen en onderstanden bij wijze van pensioen, waarop op het tijdstip van dienstbeëindiging
      volgens de op 5 Augustus 1949 bestaande regelingen recht of aanspraak zou bestaan bij ontslag wegens welbewezen
      ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
  - number: 8a.1.b
    text: |-
      indien zij vóór het tijdstip, waarop recht op pensioen of aanspraak op onderstand bij wijze van pensioen volgens de
      bij de Republiek Indonesië van kracht zijnde regelingen is verkregen, uit hun in [artikel 1, onder I][ref1] bedoeld
      dienstverband worden ontslagen, mits dat ontslag, zulks ter beslissing van de commissie, is verleend anders dan
      op eigen verzoek en niet is te wijten aan eigen schuld of toedoen, de voldoening van de rechten en aanspraken als
      omschreven in [artikel 2, lid 1][ref2], met uitzondering van het recht op vrije overtocht naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel2
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '2'
  - number: 8a.2
    text: |-
      Aan Indonesische staatsburgers, gewezen Nederlanders, die, waren zij Nederlanders gebleven, zouden hebben
      behoord tot de gewezen overheidsdienaren als bedoeld in [artikel 1, onder II][ref1], garandeert het Rijk de
      voldoening van alle rechten en aanspraken, welke hun op grond van het verleende ontslag ingevolge het bepaalde in
      [artikel 3][ref2] zouden zijn toegekomen, indien zij Nederlanders waren gebleven, met uitzondering van het recht op
      vrije overtocht naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel3
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '3'
  - number: 8a.3
    text: |-
      Aan de weduwe en wezen van een overleden Indonesische staatsburger als bedoeld in de leden 1 en 2 garandeert het
      Rijk de voldoening van alle rechten en aanspraken, welke hun op grond van dat overlijden ingevolge het bepaalde in
      [artikel 4][ref1] zouden toekomen, indien de overledene Nederlander ware gebleven, met uitzondering van het recht
      op vrije overtocht naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel4
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '4'
  - number: 8a.4
    text: |-
      In bijzondere gevallen kan, ter beslissing van de commissie, aan de in de vorige leden bedoelde personen, die,
      waren zij Nederlanders gebleven, uit hoofde van of krachtens deze wet recht op vrije overtocht naar Nederland
      zouden hebben, vrij vervoer naar Nederland op redelijke voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
  - number: 8a.5
    text: |-
      De Indonesische staatsburgers, die garanties genieten krachtens het bepaalde in [lid 2 van artikel 8a][ref1], zoals
      dat luidde ingevolge de wet van 21 December 1951 (*Stb.* 591), behouden deze garanties, met dien verstande, dat de
      [artikelen 4a tot en met 8][ref2] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002060
        artikel: 4a
  - number: 8b
    text: |-
      Voor gevallen, waarin deze wet of de afvloeiingsvoorwaarden niet of niet naar billijkheid voorzien, kunnen door
      Ons op voordracht van Onze Ministers ten behoeve van de overheidsdienaren, gewezen overheidsdienaren en nagelaten
      betrekkingen aanvullende garanties van het Rijk worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8b
  - number: 8c
    text: |-
      De garanties strekken zich niet uit over het recht op kindertoelage voor kinderen, voor wie aanspraak bestaat
      op kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref1], de Kinderbijslagwet voor loontrekkenden, of de
      algemene maatregel van bestuur bedoeld in [artikel 10][ref2] van laatstgenoemde wet, terwijl de kindertoelage
      voor die kinderen voor de berekening van de in het [tweede lid van artikel 4][ref3] bedoelde duurtetoeslag buiten
      aanmerking wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002060#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002060
        artikel: 4c
  - number: '9.1'
    text: |-
      Door Ons kunnen op voordracht van Onze Ministers overeenkomstige garanties als bij de voorgaande artikelen
      van deze wet zijn verleend, worden vastgesteld ten behoeve van andere Nederlanders, dan genoemd in
      [artikel 1, onder I of II][ref1], zomede in bijzondere gevallen ten behoeve van niet-Nederlanders, voor zover
      betrokkenen een functie bekleden of hebben bekleed, gelegen in de overheidssfeer van Indonesië.


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002060
        artikel: '1'
  - number: '9.2'
    text: Aan de vaststelling van de in het vorige lid bedoelde garanties kunnen door Ons voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel9
  - number: 9a
    text: |-
      Tenzij bij of krachtens deze wet uitdrukkelijk anders is bepaald, worden de ter uitvoering van deze wet te nemen
      beslissingen genomen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel9a
  - number: 9c.1
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet of een ander wettelijk voorschrift of andere regeling als bedoeld in [onderdeel B van de bijlage die
      bij de Beroepswet](onbekend) behoort, de rechtbank te 's-Gravenhage bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9c.2
    text: |-
      Tegen een besluit op grond van de Algemene Oorlogsongevallenregeling kan een belanghebbende beroep instellen bij de
      Centrale Raad van Beroep. Het griffierecht bedraagt € 35.
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel9c
  - number: '10'
    text: |-
      Deze wet treedt in werking met ingang van de dag, volgende op die van haar afkondiging. Zij kan worden aangehaald
      als "Garantiewet Burgerlijk Overheidspersoneel Indonesië".
    url: https://wetten.overheid.nl/BWBR0002060/2011-02-23#Artikel10
