        artikel: '12'
  - number: IV.7
    text: |-
      In afwijking van het eerste lid van dit artikel is het rangordebedrag voor het eerste kind gelijk aan het bedrag
      genoemd in [artikel 12, eerste lid, van de Algemene Kinderbijslagwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0007157/2002-01-01#ArtikelIV
