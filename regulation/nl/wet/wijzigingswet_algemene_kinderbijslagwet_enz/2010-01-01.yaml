preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige wijzigingen aan te brengen in de hoogte van de
    kinderbijslagbedragen ingevolge de Algemene Kinderbijslagwet, alsmede enige daarmee samenhangende wijzigingen in de
    nominale premies voor de Ziekenfondswet en de Algemene Wet Bijzondere Ziektekosten en daarmee een vermindering van
    de collectieve uitgavendruk te bereiken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007157/2010-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 In afwijking van [artikel 12, eerste lid, van de Algemene Kinderbijslagwet][ref1], geldt voor een kind dat is
      geboren vóór 1 januari 1995, [artikel 12, eerste tot en met vijfde lid, van de Algemene Kinderbijslagwet][ref2],
      zoals dit voor inwerkingtreding van deze wet luidde.

      2

      3 In afwijking van [artikel 28, eerste lid, van de Algemene Kinderbijslagwet][ref3], bedraagt de kinderbijslag voor
      een kind, dat op 1 oktober 1994 de leeftijd van 18 jaar had bereikt, 100% van het basiskinderbijslagbedrag, bedoeld
      in [artikel 12, vijfde lid, van de Algemene Kinderbijslagwet][ref4], zoals dit voor inwerkingtreding van deze wet
      luidde.

      4

      5 Op een beschikking als gevolg van een herziening van de kinderbijslag op grond van het bepaalde in
      [artikel I, onderdeel C][ref5], zijn de [artikelen 3.41](onbekend) en [3.45 van de Algemene wet bestuursrecht]
      (onbekend) niet van toepassing.

      6 Onverminderd [artikel V][ref6], is [artikel 13 van de Algemene Kinderbijslagwet][ref7] van overeenkomstige
      toepassing ten aanzien van de rangordebedragen, bedoeld in [artikel 12, vierde lid, onderdeel ][ref8], zoals dat
      artikel luidde voor inwerkingtreding van deze wet.

      7 In afwijking van het eerste lid van dit artikel is het rangordebedrag voor het eerste kind gelijk aan het bedrag
      genoemd in [artikel 12, eerste lid, van de Algemene Kinderbijslagwet][ref9].


