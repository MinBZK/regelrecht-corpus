---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetregeling_dieetvoeding_voor_medisch_gebruik
regulatory_layer: WET
publication_date: '2016-04-26'
valid_from: '2012-01-19'
bwb_id: BWBR0010600
url: https://wetten.overheid.nl/BWBR0010600/2012-01-19
preamble:
  text: |-
    Gelet op richtlijn 1999/21/EG van de Commissie van de Europese Gemeenschappen van 25 maart 1999 betreffende
    dieetvoeding voor medisch gebruik (PbEG L 91), alsmede op artikel 10, eerste lid, van het Warenwetbesluit Produkten
    voor bijzondere voeding;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             zuigelingen:

              kinderen jonger dan twaalf maanden;



            b
            dieetvoeding voor medisch gebruik:

              een categorie speciaal bewerkte of samengestelde producten voor bijzondere voeding die door patiënten als
      dieetvoeding onder medisch toezicht gebruikt wordt.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel1
  - number: '2'
    text: |-
      Dieetvoeding voor medisch gebruik is bestemd voor de volledige of gedeeltelijke voeding van patiënten die: -
      een beperkt, aangetast of verstoord vermogen hebben om gewone eet- of drinkwaren, bepaalde nutriënten daarin of
      bepaalde metabolieten, in te nemen, te verteren, te absorberen, te metaboliseren of uit te scheiden; of
        - andere medisch-bepaalde behoeften aan nutriënten hebben; voor de behandeling waarvan niet louter volstaan kan
      worden met wijziging van het normale voedingspatroon, of met andere producten voor bijzondere voeding.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel2
  - number: '3.1'
    text: 'Dieetvoeding voor medisch gebruik wordt ingedeeld in drie categorieën:'
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel3
  - number: 3.1.a
    text: |-
      qua voedingswaarde volledige eet- of drinkwaren met een gestandaardiseerde samenstelling, die bij gebruik volgens
      de aanwijzingen van de fabrikant de enige voedingsbron kunnen zijn voor de personen waarvoor zij bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel3
  - number: 3.1.b
    text: |-
      qua voedingswaarde volledige eet- of drinkwaren met een aan een specifieke ziekte, aandoening of kwaal aangepaste
      samenstelling, die bij gebruik volgens de aanwijzingen van de fabrikant de enige voedingsbron kunnen zijn voor de
      personen waarvoor zij bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel3
  - number: 3.1.c
    text: |-
      qua voedingswaarde onvolledige eet- of drinkwaren met een gestandaardiseerde of aan een specifieke ziekte,
      aandoening of kwaal aangepaste samenstelling, die ongeschikt zijn om als enige voedingsbron te dienen.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid, onder c, bedoelde eet- of drinkwaren worden niet gebruikt als enige voedingsbron van de
      patiënt.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel3
  - number: '4.1'
    text: De samenstelling van dieetvoeding voor medisch gebruik berust op degelijke medische en voedingsbeginselen.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel4
  - number: '4.2'
    text: |-
      Dieetvoeding voor medisch gebruik voldoet bij gebruik volgens de aanwijzingen van de fabrikant, op veilige,
      heilzame en doeltreffende wijze aan de speciale voedingsbehoeften van de personen waarvoor zij bestemd is. Deze
      werking is aangetoond met algemeen aanvaarde wetenschappelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel4
  - number: '5.1'
    text: |-
      Dieetvoeding voor medisch gebruik, speciaal bestemd voor zuigelingen, die gebruiksklaar in de handel is gebracht en
      volgens de aanwijzingen van de fabrikant is gereconstitueerd, heeft de volgende essentiële samenstelling:
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel5
  - number: 5.1.a
    text: |-
      de in [artikel 3, eerste lid, onder a][ref1], bedoelde dieetvoeding voor medisch gebruik, speciaal bestemd voor
      zuigelingen, voldoet aan [bijlage 1][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: 5.1.b
    text: |-
      de in [artikel 3, eerste lid, onder b][ref1], bedoelde dieetvoeding voor medisch gebruik, speciaal bestemd voor
      zuigelingen, voldoet aan [bijlage 1][ref2], met dien verstande dat daarvan af mag worden geweken indien dat
      noodzakelijk is in verband met het gebruiksdoel van de waar;


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: 5.1.c
    text: |-
      de in [artikel 3, eerste lid, onder c][ref1], bedoelde dieetvoeding voor medisch gebruik, speciaal bestemd voor
      zuigelingen, bevat niet meer vitaminen en mineralen dan bedoeld in [bijlage 1][ref2], met dien verstande dat
      daarvan af mag worden geweken indien dat noodzakelijk is in verband met het gebruiksdoel van de waar.


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: '5.2'
    text: |-
      Onverminderd het voorgaande lid voldoet dieetvoeding voor medisch gebruik, speciaal bestemd voor zuigelingen,
      aan de voor andere nutriënten dan vitaminen en mineralen geldende voorschriften voor volledige zuigelingenvoeding
      en opvolgzuigelingen in de [Warenwetregeling Zuigelingenvoeding][ref1], tenzij dit in strijd is met uit het
      gebruiksdoel voortvloeiende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006126
  - number: '6'
    text: |-
      Dieetvoeding voor medisch gebruik, niet speciaal bestemd voor zuigelingen, die gebruiksklaar in de handel
      is gebracht en volgens de aanwijzingen van de fabrikant is gereconstitueerd, heeft de volgende essentiële
      samenstelling:
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel6
  - number: 6.a
    text: |-
      de in [artikel 3, eerste lid, onder a][ref1], bedoelde dieetvoeding voor medisch gebruik, niet speciaal bestemd
      voor zuigelingen, voldoet aan [bijlage 2][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: 6.b
    text: |-
      de in [artikel 3, eerste lid, onder b][ref1], bedoelde dieetvoeding voor medisch gebruik, niet speciaal bestemd
      voor zuigelingen, voldoet aan [bijlage 2][ref2], met dien verstande dat daarvan af mag worden geweken indien dat
      noodzakelijk is in verband met het gebruiksdoel van de waar;


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: 6.c
    text: |-
      de in [artikel 3, eerste lid, onder c][ref1], bedoelde dieetvoeding voor medisch gebruik, niet speciaal bestemd
      voor zuigelingen, bevat niet meer vitaminen en mineralen dan bedoeld in [bijlage 2][ref2], met dien verstande dat
      daarvan af mag worden geweken indien dat noodzakelijk is in verband met het gebruiksdoel van de waar.


      [ref1]: https://wetten.overheid.nl/BWBR0010600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010600
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010600
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010600
  - number: '7'
    text: |-
      De aanduiding dieetvoeding voor medisch gebruik mag uitsluitend en moet worden gebezigd voor dieetvoeding voor
      medisch gebruik.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel7
  - number: '8'
    text: 'Bij de verhandeling van dieetvoeding voor medisch gebruik worden de volgende vermeldingen gebezigd:'
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.a
    text: de energetische waarde in kJ en kcal;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.b
    text: |-
      het in cijfers uitgedrukte gehalte aan eiwitten, koolhydraten en vetten per 100 mg of per 100 ml van de waar zoals
      die verkocht wordt en, in voorkomend geval, per 100 g of 100 ml van de volgens de aanwijzingen van de fabrikant
      gebruiksklaar gemaakte waar;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.c
    text: |-
      de in cijfers uitgedrukte gemiddelde hoeveelheid van alle in de bijlage vermelde en in de waar aanwezige mineralen
      en vitaminen per 100 g of 100 ml van de waar zoals die verkocht wordt en, in voorkomend geval, per 100 g of 100 ml
      in de volgens de aanwijzingen van de fabrikant gebruiksklaar gemaakte waar;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.d
    text: |-
      naar keuze, het in cijfers uitgedrukte gehalte aan bestanddelen van eiwitten, koolhydraten en vetten of aan andere
      nutriënten en de bestanddelen ervan, indien vermelding daarvan voor het geëigende, bedoelde gebruik van de waar
      noodzakelijk is, per 100 g of 100 ml van de waar zoals die verkocht wordt en, in voorkomend geval, per 100 g of 100
      ml van de volgens de aanwijzingen van de fabrikant gebruiksklaar gemaakte waar;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.e
    text: in voorkomend geval, informatie over de osmolaliteit of over de osmolariteit van de waar;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.f
    text: informatie over de oorsprong en de aard van de eiwitten of eiwithydrolysaten die de waar bevat;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.g
    text: 'voorafgegaan door de woorden ’belangrijke mededeling’ of woorden van gelijke strekking:'
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.g.1º
    text: ’het product moet onder medisch toezicht worden gebruikt’;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.g.2º
    text: |-
      ’het product is geschikt om als enige voedingsbron te dienen’ of ’het product is niet geschikt om als enige
      voedingsbron te dienen’;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.g.3º
    text: 'in voorkomend geval: ’het product is voor een speciale leeftijdsgroep bestemd’; en'
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.g.4º
    text: |-
      in voorkomend geval: ’het product houdt een gezondheidsrisico in wanneer het wordt gebruikt door personen die niet
      aan de ziekte(n), aandoening(en) of kwa(a)l(en) lijden waarvoor het product bestemd is’;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.h
    text: |-
      ’dieetvoeding bij ...’, waarbij op de plaats van de stippellijn de ziekte(n), aandoening(en) of kwa(a)l(en)
      waarvoor de waar bestemd is, wordt dan wel worden ingevuld;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.i
    text: in voorkomend geval, de te nemen voorzorgsmaatregelen en de tegenindicaties;
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.j
    text: |-
      een omschrijving van de eigenschappen of kenmerken waaraan de waar zijn nut ontleent, met name wanneer er sprake is
      van toevoeging, vermindering, verwijdering of het op een andere wijze wijzigen van de nutriënten, en van de redenen
      voor het gebruik van de waar; en
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: 8.k
    text: in voorkomend geval, een waarschuwing dat de waar niet voor parenteraal gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel8
  - number: '9.1'
    text: |-
      De fabrikant van dieetvoeding voor medisch gebruik stelt bij het voor de eerste keer in de handel brengen van een
      dieetvoeding voor medisch gebruik een specimen van het etiket van de desbetreffende waar ter beschikking gesteld
      van de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de importeur die een niet in Nederland bereide dieetvoeding
      voor medisch gebruik voor de eerste keer binnen Nederlands grondgebied brengt,
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van 1 mei 2000, met dien verstande dat eet- en drinkwaren die niet
      voldoen aan deze regeling nog verhandeld mogen worden tot 1 november 2001.
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Warenwetregeling Dieetvoeding voor medisch gebruik.'
    url: https://wetten.overheid.nl/BWBR0010600/2012-01-19#Artikel11
