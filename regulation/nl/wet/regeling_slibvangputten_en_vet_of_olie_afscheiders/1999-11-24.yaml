  - number: '2'
    text: |-
      Als merkteken als bedoeld in:

      a. voorschrift 5.8, derde lid, van bijlage I, onderdeel II, van het Besluit herstelinrichtingen voor
      motorvoertuigen milieubeheer,

      b. voorschrift 4.7, derde lid, van [bijlage I][ref1],
      [onderdeel II, van het Besluit melkrundveehouderijen milieubeheer][ref2],

      c. voorschrift 12.1, derde lid, van [bijlage I][ref3],
      [onderdeel II, van het Besluit tankstations milieubeheer][ref4],

      d. voorschrift 8.12, derde lid, van [bijlage I][ref5],
      [onderdeel II, van het Besluit akkerbouwbedrijven milieubeheer][ref6],

      e. voorschrift 1.3.13, onder c en h, van onderdeel B van de bijlage bij het Besluit woon- en verblijfsgebouwen
      milieubeheer,

      f. voorschrift 1.3.12, onder c, van [bijlage 2][ref7],
      [onderdeel B, van het Besluit detailhandel en ambachtsbedrijven milieubeheer][ref8], en

      g. voorschrift 1.3.11, [onder c, van onderdeel B](28659) van de [bijlage bij het Besluit horeca-, sport- en
      recreatie-inrichtingen milieubeheer](28659),

      wordt vastgesteld het beeldmerk ’KOMO’, gedeponeerd onder registratienummer 402721 bij het Benelux Merkenbureau en
      onder registratienummer 381290 bij het Internationale Bureau voor de bescherming van het industriële eigendom.


