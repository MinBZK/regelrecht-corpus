  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst. Als de dagtekening van die Staatscourant 15 april 1999 of een latere datum is, werkt zij terug tot
      en met 16 april 1999.
