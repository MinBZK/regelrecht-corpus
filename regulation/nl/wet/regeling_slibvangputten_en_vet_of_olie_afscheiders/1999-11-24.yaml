articles:
  - number: '1'
    text: |-
      1 Als voorschriften ten aanzien van de toepassing en afwijking van NEN 7087 met betrekking tot slibvangputten en
      vetafscheiders als bedoeld in:

      a. voorschrift 1.3.13, onder b, van onderdeel B van de bijlage bij het Besluit woon- en verblijfsgebouwen
      milieubeheer,

      b. voorschrift 1.3.12, onder b, van [bijlage 2][ref1],
      [onderdeel B, van het Besluit detailhandel en ambachtsbedrijven milieubeheer][ref2], en

      c. voorschrift 1.3.11, [onder b, van onderdeel B](28659) van de [bijlage bij het Besluit horeca-, sport- en
      recreatie-inrichtingen milieubeheer](28659),

      worden vastgesteld de voorschriften opgenomen in de door het College van Deskundigen Bodembeschermende
      Voorzieningen van KIWA NV vastgestelde Nationale Beoordelingsrichtlij-nen BRL 5252 van 1 mei 1996, BRL 5254 van 15
      oktober 1996, BRL 5256 van 1 april 1997 en BRL 5257 van 1 september 1997.

      2 Als voorschriften ten aanzien van de toepassing en afwijking van NEN 7089 met betrekking tot slibvangputten en
      olie-afscheiders als bedoeld in:

      a. voorschrift 5.8, tweede lid, van bijlage I, onderdeel II, van het Besluit herstelinrichtingen voor
      motorvoertuigen milieubeheer,

      b. voorschrift 4.7, tweede lid, van [bijlage I][ref3],
      [onderdeel II, van het Besluit melkrundveehouderijen milieubeheer][ref4],

      c. voorschrift 12.1, tweede lid, van [bijlage I][ref5],
      [onderdeel II, van het Besluit tankstations milieubeheer][ref6],

      d. voorschrift 8.12, tweede lid, van [bijlage I][ref7],
      [onderdeel II, van het Besluit akkerbouwbedrijven milieubeheer][ref8], en

      voorschrift 1.3.13 onder g, van onderdeel B van de bijlage bij het Besluit woon-en verblijfsgebouwen milieubeheer

      worden vastgesteld de voorschriften opgenomen in de door het College van Deskundigen Bodembeschermende
      Voorzieningen van KIWA NV vastgestelde Nationale Beoordelingsrichtlij-nen BRL 5253 van 1 mei 1996, BRL 5255 van 1
      april 1997 en BRL 5251 van 1 maart 1998.


