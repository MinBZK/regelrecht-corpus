---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rijkswet_goedkeuring_en_bekendmaking_verdragen
regulatory_layer: WET
publication_date: '2013-12-18'
valid_from: '2023-01-01'
bwb_id: BWBR0006799
url: https://wetten.overheid.nl/BWBR0006799/2023-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat, ingevolge artikel 91, eerste en tweede lid, van de Grondwet, de wet
    dient te bepalen de gevallen waarin geen goedkeuring van verdragen of van het voornemen tot opzegging daarvan is
    vereist en de wijze waarop de goedkeuring wordt verleend, en dat het voorts wenselijk is de in artikel 95 van de
    Grondwet bedoelde wettelijke regeling inzake de bekendmaking van verdragen en van besluiten van volkenrechtelijke
    organisaties aan te passen, onder meer vanwege wijzigingen die hebben plaatsgevonden in de Grondwet en in het
    Statuut voor het Koninkrijk der Nederlanden;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onze Minister van Buitenlandse Zaken verstrekt periodiek aan de Staten-Generaal en aan de Staten van Aruba, Curaçao
      en Sint Maarten een lijst van ontwerp-verdragen over de totstandkoming waarvan voor het Koninkrijk onderhandeld
      wordt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: '1.2'
    text: 'De in het eerste lid bedoelde lijst bevat per ontwerp-verdrag een opgave van:'
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: 1.2.a
    text: de strekking;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: 1.2.b
    text: de bij de onderhandelingen betrokken toekomstige verdragspartijen;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: 1.2.c
    text: in voorkomend geval, de internationale organisatie onder auspiciën waarvan de onderhandelingen worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: 1.2.d
    text: de meest betrokken ministeries.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: '1.3'
    text: |-
      Op de in het eerste lid bedoelde lijst worden niet opgenomen ontwerp-verdragen ten aanzien waarvan het belang van
      het Koninkrijk zich er bepaaldelijk tegen verzet dat het feit dat daarover onderhandelingen worden gevoerd in de
      openbaarheid wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: '1.4'
    text: |-
      In het in het derde lid bedoelde geval kan in het eerste en tweede lid bedoelde informatie vertrouwelijk worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel1
  - number: '2.1'
    text: |-
      Verdragen ten aanzien waarvan de regering het wenselijk acht dat het Koninkrijk daaraan wordt gebonden, worden zo
      spoedig mogelijk ter goedkeuring aan de Staten-Generaal voorgelegd.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de voorlegging van een verdrag ter goedkeuring als bedoeld in het eerste lid wordt aangegeven of het verdrag
      naar het oordeel van de regering bepalingen bevat die naar hun inhoud een ieder kunnen verbinden en, indien dit het
      geval is, welke bepalingen het betreft.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tegelijk met de voorlegging, bedoeld in het eerste lid, worden verdragen aan de Staten van Aruba, Curaçao en Sint
      Maarten overgelegd, indien het verdragen betreft die Aruba, Curaçao of Sint Maarten raken.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel2
  - number: '3'
    text: De goedkeuring wordt uitdrukkelijk of stilzwijgend verleend.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel3
  - number: '4'
    text: De uitdrukkelijke goedkeuring wordt verleend bij wet.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel4
  - number: '5.1'
    text: |-
      De stilzwijgende goedkeuring is verleend, indien niet binnen dertig dagen na een daartoe strekkende overlegging
      van een verdrag aan de Staten-Generaal door of namens een van de kamers of door ten minste een vijfde van
      het grondwettelijk aantal leden van een van de kamers de wens te kennen wordt gegeven, dat het verdrag aan de
      uitdrukkelijke goedkeuring zal worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel5
  - number: '5.2'
    text: |-
      De Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten kan binnen dezelfde termijn dezelfde wens te kennen
      geven, indien het een verdrag betreft dat Aruba, Curaçao of Sint Maarten raakt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien de in het eerste of tweede lid bedoelde wens te kennen wordt gegeven, wordt zo spoedig mogelijk een voorstel
      van wet tot goedkeuring ingediend.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien een verdrag bepalingen bevat welke afwijken van de [Grondwet][ref1] of tot zodanig afwijken noodzaken, wordt
      dit verdrag aan de uitdrukkelijke goedkeuring onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '6.2'
    text: |-
      In het voorstel van wet tot goedkeuring van een zodanig verdrag wordt tot uitdrukking gebracht dat de goedkeuring
      wordt verleend met inachtneming van het bepaalde in [artikel 91, derde lid, van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel91
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '91'
  - number: '7'
    text: |-
      Tenzij een verdrag bepalingen bevat welke afwijken van de [Grondwet][ref1] of tot zodanig afwijken noodzaken, is de
      goedkeuring niet vereist:


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 7.a
    text: indien het een verdrag betreft, waarvoor dit bij wet is bepaald;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
  - number: 7.b
    text: |-
      indien het verdrag uitsluitend betreft de uitvoering van een goedgekeurd verdrag, behoudens het bepaalde in
      [artikel 8, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel8
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '8'
  - number: 7.c
    text: |-
      indien het verdrag geen belangrijke geldelijke verplichtingen aan het Koninkrijk oplegt en voor ten hoogste een
      jaar is gesloten;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
  - number: 7.d
    text: |-
      indien in buitengewone gevallen van dwingende aard het belang van het Koninkrijk het bepaald noodzakelijk maakt dat
      het verdrag een geheim of vertrouwelijk karakter draagt;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
  - number: 7.e
    text: |-
      indien het verdrag betreft de verlenging van een aflopend verdrag, behoudens het bepaalde in
      [artikel 9, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel9
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '9'
  - number: 7.f
    text: |-
      indien het verdrag betreft wijziging van een integrerend onderdeel van een goedgekeurd verdrag vormende bijlage
      waarvan de inhoud van uitvoerende aard is ten opzichte van de bepalingen van het verdrag waar de bijlage onderdeel
      van vormt, voor zover in de wet tot goedkeuring geen voorbehoud terzake is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel7
  - number: '8.1'
    text: |-
      Wanneer de regering het voornemen heeft om over te gaan tot de sluiting van een verdrag uitsluitend betreffende de
      uitvoering van een goedgekeurd verdrag, deelt zij dit voornemen schriftelijk mee aan de Staten-Generaal en, indien
      het uitvoeringsverdrag voor Aruba, Curaçao of Sint Maarten zal gelden, aan de Staten van Aruba, Curaçao en Sint
      Maarten.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien binnen dertig dagen na de in het eerste lid bedoelde mededeling door of namens een van de kamers of door
      tenminste een vijfde van het grondwettelijk aantal leden van een van de kamers, of door de Gevolmachtigde Minister
      van Aruba, Curaçao of Sint Maarten, de wens te kennen wordt gegeven dat het uitvoeringsverdrag aan de goedkeuring
      van de Staten-Generaal zal worden onderworpen, is in afwijking van het bepaalde in [artikel 7, onderdeel b][ref1],
      de goedkeuring van de Staten-Generaal vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '7'
  - number: '9.1'
    text: |-
      Wanneer de regering het voornemen heeft om over te gaan tot verlenging van een aflopend verdrag deelt zij dit
      voornemen schriftelijk mee aan de Staten-Generaal en, indien het verdrag voor Aruba, Curaçao of Sint Maarten geldt,
      aan de Staten van Aruba, Curaçao of Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien binnen dertig dagen na de in het eerste lid bedoelde mededeling door of namens een van de kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een van de kamers, of door de Gevolmachtigde Minister van
      Aruba, Curaçao of Sint Maarten, de wens te kennen wordt gegeven dat het verdrag tot verlenging aan de goedkeuring
      van de Staten-Generaal zal worden onderworpen, is in afwijking van het bepaalde in [artikel 7, onder e][ref1], de
      goedkeuring van de Staten-Generaal vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '7'
  - number: '9.3'
    text: |-
      Wanneer de regering het voornemen heeft een aflopend verdrag niet te verlengen terwijl één of meer van de overige
      verdragspartijen dat verdrag wel wenst te verlengen, deelt zij dit voornemen schriftelijk mee aan de Staten-
      Generaal en, indien het verdrag voor Aruba, Curaçao of Sint Maarten geldt, aan de Staten van Aruba, Curaçao of
      Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel9
  - number: '10.1'
    text: |-
      Tenzij een verdrag bepalingen bevat welke afwijken van de [Grondwet][ref1], of tot zodanig afwijken noodzaken, kan,
      indien in buitengewone gevallen van dringende aard het belang van het Koninkrijk zich er bepaaldelijk tegen verzet
      dat een verdrag aan de goedkeuring van de Staten-Generaal wordt onderworpen voordat het Koninkrijk aan dat verdrag
      wordt gebonden, de binding direct tot stand worden gebracht. Het verdrag wordt daarna zo spoedig mogelijk aan de
      goedkeuring van de Staten-Generaal onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '10.2'
    text: |-
      Een zodanig verdrag wordt aangegaan onder voorbehoud van beëindiging voor het Koninkrijk bij onthouding van de
      goedkeuring.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien op grond van [artikel 7, onder d][ref1], het Koninkrijk zonder goedkeuring van de Staten-Generaal aan een
      verdrag is gebonden, wordt een zodanig verdrag alsnog zo spoedig mogelijk aan de goedkeuring van de Staten-Generaal
      onderworpen wanneer het geheim of vertrouwelijk karakter daarvan is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '7'
  - number: '11.2'
    text: |-
      Een zodanig verdrag wordt slechts aangegaan wanneer daarin is voorzien in een mogelijkheid tot beëindiging voor het
      Koninkrijk op een redelijke termijn, tenzij het belang van het Koninkrijk zich daartegen bepaaldelijk verzet.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel11
  - number: '12'
    text: |-
      Indien in de gevallen, bedoeld in de [artikelen 10][ref1] en [11][ref2], de goedkeuring aan het verdrag wordt
      onthouden, wordt het verdrag zo spoedig als dat rechtens mogelijk is, beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel11
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006799
        artikel: '11'
  - number: '13.1'
    text: |-
      Verdragen die op grond van het bepaalde in [artikel 7][ref1] geen goedkeuring behoeven en waaraan het Koninkrijk
      is gebonden, en verdragen waaraan het Koninkrijk op grond van het bepaalde in [artikel 10, eerste lid][ref2], is
      gebonden voordat deze aan de goedkeuring van de Staten-Generaal zijn onderworpen, worden zo spoedig mogelijk aan de
      Staten-Generaal ter kennis gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel10
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006799
        artikel: '10'
  - number: '13.2'
    text: |-
      Gelijktijdig daarmee worden zij aan de Staten van Aruba, Curaçao of Sint Maarten ter kennis gebracht, indien het
      verdragen betreft die Aruba, Curaçao of Sint Maarten raken.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel13
  - number: '13.3'
    text: |-
      Verdragen met een geheim of vertrouwelijk karakter worden, tenzij het belang van het Koninkrijk zich bepaaldelijk
      tegen ter kennis brenging verzet, ter kennis gebracht onder voorwaarde van geheimhouding.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien een verdrag door de Staten-Generaal is goedgekeurd en de regering besluit niet over te gaan tot binding van
      het Koninkrijk aan dat verdrag, stelt de regering de Staten-Generaal direct daarvan in kennis; gelijktijdig daarmee
      stelt zij de Staten van Aruba, Curaçao of Sint Maarten, daarvan in kennis, indien het een verdrag betreft dat
      Aruba, Curaçao of Sint Maarten, raakt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ten aanzien van voornemens tot opzegging van verdragen vinden de bepalingen van de [artikelen 2][ref1], [3][ref2],
      [4][ref3], [5][ref4], [6][ref5], [7, onder ][ref6], en [13][ref7], overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006799#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006799#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0006799#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0006799#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0006799#Artikel13
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006799
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006799
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0006799
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0006799
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0006799
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0006799
        artikel: '13'
  - number: '14.2'
    text: |-
      Indien krachtens [artikel 10, eerste lid][ref1], een verdrag zonder voorafgaande goedkeuring van de Staten-Generaal
      is opgezegd en de Staten-Generaal vervolgens de goedkeuring aan de opzegging onthouden, wordt de opzegging, of het
      gevolg daarvan, zo spoedig als zulks rechtens mogelijk is ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel10
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '10'
  - number: '15.1'
    text: |-
      Behoudens in het geval dat het gaat om een verdrag dat bepalingen bevat welke afwijken van de [Grondwet][ref1]
      dan wel tot zodanig afwijken noodzaken, kan, indien het belang van het Koninkrijk het vordert, de regering
      bewerkstelligen dat een verdrag voor het Koninkrijk voorlopig wordt toegepast voorafgaande aan de inwerkingtreding
      van dat verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '15.2'
    text: |-
      Met betrekking tot een verdrag dat voor zijn inwerkingtreding de goedkeuring van de Staten-Generaal behoeft is
      voorlopige toepassing niet geoorloofd ten aanzien van bepalingen van dat verdrag welke afwijken van de wet of tot
      zonodig afwijken noodzaken.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien een verdrag bepalingen bevat die naar het oordeel van de regering naar hun inhoud een ieder kunnen
      verbinden, en de regering wil bewerkstelligen dat ook die bepalingen voorlopig zullen worden toegepast, wordt de
      tekst van het verdrag en het feit dat het voorlopig zal worden toegepast, bekend gemaakt voordat de voorlopige
      toepassing een aanvang neemt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel15
  - number: '15.4'
    text: |-
      Indien overgegaan wordt tot voorlopige toepassing van een verdrag wordt zulks onverwijld aan de Staten-Generaal
      medegedeeld. Gelijktijdig daarmee wordt zulks ook medegedeeld aan de Staten van Aruba, Curaçao of Sint Maarten,
      indien het een verdrag betreft dat Aruba, Curaçao of Sint Maarten raakt.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel15
  - number: '16.1'
    text: |-
      De bekendmaking van verdragen en van besluiten van volkenrechtelijke organisaties geschiedt in het Tractatenblad
      van het Koninkrijk der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: '16.2'
    text: Onze minister van Buitenlandse Zaken geeft het Tractatenblad uit.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: '16.3'
    text: De uitgifte van het Tractatenblad geschiedt elektronisch op een algemeen toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: '16.4'
    text: Na de uitgifte blijft het Tractatenblad elektronisch op een algemeen toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: '16.5'
    text: Voor het inzien van het Tractatenblad worden geen kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: '16.6'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de uitgifte en het beschikbaar blijven van het
      Tractatenblad.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16
  - number: 16a
    text: |-
      Indien elektronische uitgifte van het Tractatenblad op de in [artikel 16][ref1] voorziene wijze geheel of
      gedeeltelijk onmogelijk is, voorziet Onze minister van Buitenlandse Zaken in een vervangende uitgave volgens bij
      ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel16
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '16'
  - number: 16b.1
    text: |-
      Aan een ieder wordt op verzoek een papieren afschrift van het Tractatenblad verstrekt tegen ten hoogste de kosten
      van het maken van een zodanig afschrift.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16b
  - number: 16b.2
    text: Onze minister van Buitenlandse Zaken wijst een uitgiftepunt aan waar het afschrift verkregen kan worden.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16b
  - number: 16c.1
    text: |-
      De teksten en eventuele vertalingen in het Nederlands van de op grond van deze wet bekendgemaakte verdragen en
      besluiten van volkenrechtelijke organisaties zijn in geconsolideerde vorm voor een ieder beschikbaar door middel
      van een bij ministeriële regeling aangewezen algemeen toegankelijk elektronisch medium.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16c
  - number: 16c.2
    text: |-
      Bij ministeriële regeling kunnen categorieën van verdragen en van besluiten van volkenrechtelijke organisaties
      worden aangewezen, waarop het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16c
  - number: 16c.3
    text: |-
      Een geconsolideerde tekst van een verdrag of van een besluit van een volkenrechtelijke organisatie die op grond van
      het eerste lid beschikbaar is gesteld, blijft beschikbaar indien het verdrag of besluit na de beschikbaarstelling
      is gewijzigd, buiten werking getreden of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel16c
  - number: '17'
    text: 'In het *Tractatenblad* worden geplaatst:'
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel17
  - number: 17.a
    text: de tekst van het verdrag of het besluit in één of meer talen;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel17
  - number: 17.b
    text: |-
      de vermelding van het tijdstip van inwerkingtreding, hetzij voor het Koninkrijk in zijn geheel, hetzij voor een of
      meer der landen van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel17
  - number: 17.c
    text: |-
      de vermelding van het tijdstip van buitenwerkingtreding, hetzij voor het Koninkrijk in zijn geheel, hetzij voor een
      of meer der landen van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel17
  - number: 17.d
    text: |-
      de vermelding van voorlopige toepassing van een verdrag als bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel15
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '15'
  - number: '18'
    text: 'Voorts kunnen in het *Tractatenblad* worden geplaatst:'
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: 18.a
    text: een vertaling in het Nederlands van het verdrag of het besluit;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: 18.b
    text: gegevens omtrent parlementaire goedkeuring;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: 18.c
    text: gegevens omtrent het tijdstip van inwerkingtreding voor andere staten en voor volkenrechtelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: 18.d
    text: gegevens omtrent het tijdstip van buitenwerkingtreding voor andere staten en voor volkenrechtelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: 18.e
    text: andere gegevens.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel18
  - number: '19.1'
    text: |-
      Verdragen en besluiten van volkenrechtelijke organisaties gelden als bekend gemaakt in het gehele Koninkrijk met
      ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van het *Tractatenblad* waarin zij
      zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister van Buitenlandse Zaken kan voor een bepaald geval deze termijn, hetzij voor het Koninkrijk der
      Nederlanden in zijn geheel, hetzij voor een of meer der landen van het Koninkrijk, wijzigen door een mededeling in
      het *Tractatenblad*.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het ter kennis brengen van verdragen of van besluiten van volkenrechtelijke organisaties door Onze Minister van
      Buitenlandse Zaken aan bepaalde personen geldt te hunnen aanzien als bekendmaking mits daarbij wordt meegedeeld dat
      deze kennisgeving die werking heeft.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel20
  - number: '20.2'
    text: |-
      De [artikelen 16, eerste lid][ref1], [17, onder a, b, en c][ref2], en [19][ref3] van deze wet zijn niet van
      toepassing op verdragen en op besluiten van volkenrechtelijke organisaties waarvan de bekendmaking is geregeld in
      of ingevolge een verdrag dat in het *Tractatenblad* is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006799#Artikel19
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0006799
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0006799
        artikel: '19'
  - number: '20.3'
    text: |-
      In bijzondere gevallen kan Onze Minister van Buitenlandse Zaken bepalen dat bijlagen bij een verdrag of besluiten
      van volkenrechtelijke organisaties niet door plaatsing in het *Tractatenblad*, doch door terinzagelegging worden
      bekendgemaakt. Van zodanige bekendmaking wordt mededeling gedaan in het *Tractatenblad*.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel20
  - number: '21'
    text: |-
      De Rijkswet van 22 juni 1961 (*Stb.* 207) houdende regeling inzake de bekendmaking van internationale
      overeenkomsten en van besluiten van volkenrechtelijke organisaties wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel21
  - number: '22'
    text: |-
      Deze wet treedt in werking op de dertigste dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel22
  - number: '23'
    text: 'Deze wet kan worden aangehaald als: Rijkswet goedkeuring en bekendmaking verdragen.'
    url: https://wetten.overheid.nl/BWBR0006799/2023-01-01#Artikel23
