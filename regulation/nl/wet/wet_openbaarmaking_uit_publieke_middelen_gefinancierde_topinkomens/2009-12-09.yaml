  - number: '2'
    text: |-
      [Artikel 6][ref1] is van toepassing op:

      a. de organisaties waarover de ministers, bedoeld in [artikel 51, eerste lid][ref2], juncto
      [artikel 1 van de Comptabiliteitswet 2001][ref3], gehouden zijn financiële verantwoording af te leggen;

      b. de provincies;

      c. de gemeenten;

      d. de waterschappen;

      e. de openbare lichamen voor beroep en bedrijf;

      f. de andere lichamen waaraan krachtens de [Grondwet][ref4] verordenende bevoegdheid is toegekend;

      g. de rechtspersonen ingesteld bij of krachtens de wet,

      h. de Europese groeperingen voor territoriale samenwerking met een statutaire zetel in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel51
