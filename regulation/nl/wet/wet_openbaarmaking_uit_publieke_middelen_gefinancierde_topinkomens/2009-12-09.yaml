        artikel: '6'
  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van deze wet zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel10
  - number: '11'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel11
  - number: '12'
    text: |-
      In geval van uitkeringen in verband met beëindiging van het dienstverband als bedoeld in
      [artikel 6, tweede lid][ref1], waarbij het betreffende dienstverband is geëindigd voorafgaand aan de
      inwerkingtreding van deze wet, vermeldt de verantwoordelijke de in [artikel 6, tweede lid][ref2], genoemde gegevens
      indien het totaal van de uitkeringen in verband met beëindiging van het dienstverband meer bedraagt of zal bedragen
      dan het gemiddelde belastbare loon van Onze Ministers in het jaar voorafgaand aan het jaar waarin deze wet in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019562#Artikel6
