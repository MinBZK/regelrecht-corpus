  - number: '8'
    text: |-
      1 Het gemiddelde belastbare loon van Onze Ministers wordt jaarlijks binnen zes weken na afloop van het kalenderjaar
      waarop het betrekking heeft, door Onze Minister in de Staatscourant gepubliceerd. Het bedrag wordt afgerond op een
      veelvoud van € 1000.

      2 Onze Minister kan regels stellen over de wijze waarop het gemiddelde belastbare loon van Onze Ministers
      wordt berekend. Hij kan daarbij bepalen dat op het gemiddelde belastbare loon van Onze Ministers een correctie
      wordt toegepast om de vergelijkbaarheid te vergroten met het belastbaar loon zoals opgenomen in het financieel
      verantwoordingsdocument.
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel8
  - number: '9'
    text: |-
      Onze Minister zendt jaarlijks voor 31 december aan de Staten-Generaal een overzicht van de gegevens die op grond
      van [artikel 6, eerste tot en met vierde lid][ref1], zijn of hadden moeten worden opgenomen in het financieel
      verantwoordingsdocument over het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel9
