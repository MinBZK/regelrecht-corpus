  - number: '3'
    text: |-
      1 [Artikel 6][ref1] is tevens van toepassing op:

      a. rechtspersonen voor zover die een bij of krachtens de wet geregelde taak uitoefenen en gedurende ten minste twee
      achtereenvolgende kalenderjaren daartoe voor ten minste 33% worden bekostigd uit de opbrengst van bij of krachtens
      de wet ingestelde heffingen;

      b. rechtspersonen waaraan gedurende ten minste twee achtereenvolgende kalenderjaren rechtstreeks of middellijk een
      subsidie, lening of garantie van ten minste € 100.000,–, die ten minste 50% van de inkomsten van de rechtspersoon
      omvat is verleend, dan wel verstrekt door:

      1°. een of meer van de in [artikel 2][ref2] bedoelde organen of rechtspersonen, of

      2°. een of meer andere rechtspersonen, voor rekening of risico van een of meer van de in [artikel 2][ref3] bedoelde
      organen of rechtspersonen.

      2 Op rechtspersonen als bedoeld in het eerste lid, onder b, die een lening of een garantie ontvangen, is
      [artikel 6][ref4] slechts van toepassing indien dit met een of meer van de in [artikel 2][ref5] bedoelde organen of
      rechtspersonen bij de toekenning of een wijziging van een lening of garantie is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
