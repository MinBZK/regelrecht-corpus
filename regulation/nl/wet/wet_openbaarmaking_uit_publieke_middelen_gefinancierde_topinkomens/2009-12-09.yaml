preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat rekenschap wordt gegeven over de besteding van
    publieke middelen en in dat kader organisaties en rechtspersonen die volledig of in aanzienlijke mate uit publieke
    middelen gefinancierd worden of die zijn aangewezen, waaronder woningcorporaties, te verplichten tot openbaarmaking
    van de beloningen die het gemiddelde belastbare loon per jaar van Onze Ministers te boven gaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. verantwoordelijke:

      1°. de ministers, bedoeld in [artikel 51 van de Comptabiliteitswet 2001][ref1];

      2°. gedeputeerde staten van de provincies;

      3°. de colleges van burgemeester en wethouders van de gemeenten;

      4°. de dagelijkse besturen van de waterschappen;

      5°. de dagelijkse besturen van de bedrijfslichamen in de zin van de Wet op de bedrijfsorganisatie; en

      6°. het orgaan of de organen van een rechtspersoon als bedoeld in [artikel 2, onder f en g][ref2], een
      rechtspersoon als bedoeld in [artikel 3][ref3], een vereniging of stichting als bedoeld in [artikel 4][ref4] of
      een rechtspersoon of organisatie als bedoeld in [artikel 5][ref5], die bij of krachtens de wet belast zijn met het
      opstellen en vaststellen van een financieel verantwoordingsdocument;

      b. belastbaar loon: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref6], verminderd met de
      eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref7];

      c. financieel verslagleggingsdocument: jaarverslag als bedoeld in
      [artikel 51 van de Comptabiliteitswet 2001][ref8], jaarrekening als bedoeld in
      [artikel 201 van de Provinciewet][ref9], jaarrekening als bedoeld in [artikel 197 van de Gemeentewet][ref10] of
      jaarrekening in de zin van [Boek 2, titel 9, van het Burgerlijk Wetboek][ref11] dan wel, indien deze artikelen niet
      van toepassing zijn, een ander bij of krachtens de wet voorgeschreven document dat jaarlijks wordt opgesteld tot
      verschaffing van inzicht in de financiële positie van een rechtspersoon of een organisatie van een rechtspersoon;

      d. boekjaar: het jaar waarop het financieel verslagleggingsdocument betrekking heeft;

      e. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


