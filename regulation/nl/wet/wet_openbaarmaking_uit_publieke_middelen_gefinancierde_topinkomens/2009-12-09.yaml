  - number: '5'
    text: |-
      Op voordracht van Onze Minister in overeenstemming met Onze Ministers die het mede aangaat kunnen bij algemene
      maatregel van bestuur rechtspersonen of organisaties worden aangewezen waarop [artikel 6][ref1] van toepassing is,
      indien de financiering van deze rechtspersonen of organisaties middellijk of rechtstreeks geheel of gedeeltelijk
      uit publieke middelen plaatsvindt of heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019562
        artikel: '6'
  - number: '6'
    text: |-
      1 De verantwoordelijke vermeldt in het financieel verslagleggingsdocument het belastbare loon, de voorzieningen
      ten behoeve van beloningen betaalbaar op termijn, de functie of functies en de duur van het dienstverband in dat
      jaar van eenieder van wie de som van het belastbare loon en de voorzieningen ten behoeve van beloningen betaalbaar
      op termijn van zijn functie of functies het gemiddelde belastbare loon van Onze Ministers te boven is gegaan. Het
      voorgaande is van overeenkomstige toepassing in geval van een dienstverband van een kleinere omvang dan het bij
      de verantwoordelijke gebruikelijk voltijdse dienstverband, en de som van het belastbaar loon en de voorzieningen
      ten behoeve van beloningen betaalbaar op termijn meer bedraagt dan het gemiddeld belastbaar jaarloon van Onze
      Ministers, vermenigvuldigd met het aantal uren waarop het dienstverband betrekking heeft en gedeeld door het aantal
      uren van een voltijds dienstverband.

      2 De verantwoordelijke vermeldt in het financieel verslagleggingsdocument uitkeringen in verband met beëindiging
      van het dienstverband, alsmede de functie of functies die tijdens het dienstverband zijn bekleed en het jaar waarin
      het dienstverband is geëindigd van eenieder

      a. wiens gegevens in enig voorafgaand jaar op grond van het eerste lid in het financieel verslagleggingsdocument
      zijn opgenomen of hadden moeten worden opgenomen, of

      b. van wie het totaal van de uitkeringen in verband met beëindiging van het dienstverband meer bedraagt of zal
      bedragen dan het gemiddelde belastbare loon van Onze Ministers in het jaar waarin het dienstverband is geëindigd.

      3 Indien het boekjaar niet overeenkomt met een kalenderjaar, betreft de vermelding, bedoeld in het eerste lid,
      het belastbare loon, de functie of functies die betrekking hebben op het kalenderjaar direct voorafgaande aan het
      boekjaar.

      4 In de gevallen, bedoeld in het eerste of tweede lid, motiveert de verantwoordelijke in het financieel
      verslagleggingsdocument de overschrijding van het gemiddelde belastbare loon van Onze Ministers.

      5 De verantwoordelijke vermeldt in het financieel verslagleggingsdocument tevens van hen van wie het belastbare
      loon, de functie of functies en de duur van het dienstverband vermeld wordt, deze gegevens over het kalenderjaar
      voorafgaand aan het jaar waarop de verplichting in het eerste en tweede lid betrekking heeft.

      6 De verantwoordelijke zendt Onze Minister uiterlijk op 1 juli de gegevens en motivering, bedoeld in het eerste tot
      en met vijfde lid. Onze Minister kan voor de verstrekking van deze gegevens een formulier vaststellen.

      7 Onder het belastbaar loon van ministers of staatssecretarissen, dan wel van andere personen voor zover Onze
      Minister daartoe besluit, wordt voor de toepassing van dit artikel verstaan: het belastbaar loon, verminderd met de
      loonbestanddelen die betrekking hebben op getroffen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019562/2009-12-09#Artikel6
  - number: '7'
    text: |-
      1 Indien een rechtspersoon als bedoeld in [artikel 3][ref1] niet meer voldoet aan de voorwaarden genoemd in
      [dat artikel][ref2], blijven de verplichtingen, bedoeld in [artikel 6][ref3], van toepassing twee jaar na
      het boekjaar, respectievelijk het kalenderjaar waarin de rechtspersoon laatstelijk aan de voorwaarden van
      [artikel 3][ref4] voldeed.

      2 Het eerste lid is van overeenkomstige toepassing op de rechtspersonen of de organisaties waarvan een aanwijzing
      ingevolge [artikel 5][ref5] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel3
