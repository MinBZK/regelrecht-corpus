preamble:
  text: |-
    Gelet op artikel 14 van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor het gebruik van de volgende meetmiddelen moet een verklaring van een onderzoek zijn afgegeven door het
      Nederlands Meetinstituut NMi N.V. waaruit blijkt, dat deze voldoen aan de eisen als vermeld in de bijlage behorend
      bij deze regeling:

      a. snelheidscontrolemeters, met uitzondering van de standaardsnelheidsmeter in politievoertuigen;

      b. remvertragingsmeters, waaraan al dan niet een pedaalkrachtmeter is verbonden;

      c. wiellastmeters;

      d. andere door de Minister van Veiligheid en Justitie aan te wijzen meetmiddelen.
    url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#Artikel1
  - number: '2'
    text: |-
      1 De verklaring, bedoeld in [artikel 1][ref1], is geldig voor twee jaar.

      2 De verklaring die is afgegeven voor radarsnelheidscontrolemeters is geldig voor één jaar.

      3 De verklaring verliest haar geldigheid bij herstelling of verandering van het meetmiddel indien deze op het
      meetresultaat van invloed kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008821#Artikel1
    url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008821
        artikel: '1'
  - number: '3'
    text: |-
      Na de inwerkingtreding van deze regeling berusten de verklaringen, bedoeld in [artikel 1][ref1], welke krachtens de
      Regeling meetmiddelen politie (Stcrt. 1994, 64) zijn afgegeven door het Nederlandse Meetinstituut NMi N.V., op deze
      regeling. Zij behouden hun geldigheid overeenkomstig het bepaalde in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008821#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008821#Artikel2
    url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008821
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008821
        artikel: '2'
  - number: '4'
    text: |-
      1 Met de in deze regeling bedoelde meetmiddelen worden gelijkgesteld meetmiddelen die rechtmatig zijn geproduceerd
      of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en die ten minste aan gelijkwaardige eisen voldoen.

      2 Met de in deze regeling bedoelde verklaring van een onderzoek wordt gelijkgesteld een verklaring van een
      onderzoek, afgegeven door een wat betreft technische deskundigheid en onafhankelijkheid gelijkwaardig instituut
      in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, welke verklaring is afgegeven op basis van onderzoeken die ten minste aan
      gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#Artikel4
  - number: '5'
    text: De Regeling meetmiddelen politie (Stcrt. 1994, 64) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008821/2013-01-01#Artikel5
  - number: 5a
    text: |-
      Deze regeling berust op [artikel 22 van het Besluit bewapening en uitrusting politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel22
