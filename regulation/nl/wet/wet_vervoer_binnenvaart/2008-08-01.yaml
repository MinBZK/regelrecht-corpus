---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: wet_vervoer_binnenvaart
regulatory_layer: WET
publication_date: '2009-06-30'
valid_from: '2008-08-01'
bwb_id: BWBR0005319
url: https://wetten.overheid.nl/BWBR0005319/2008-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een in sociaal-economische opzicht goede
    bedrijfsuitoefening in het vervoer van goederen en personen met binnenschepen en gelet op de internationale
    ontwikkelingen op het terrein van het vervoer van goederen en personen met binnenschepen wenselijk is, een nieuwe
    regeling tot stand te brengen voor het vervoer met binnenschepen, waarbij mede uitvoering wordt gegeven aan
    Aanvullend Protocol nr. 2 bij de Herziene Rijnvaartakte (Trb. 1980, 7), goedgekeurd bij de wet van 1 juli 1981
    (Stb. 424), Verordening (EEG) nr. 2919/85 van de Raad van 17 oktober 1985 houdende vaststelling van de voorwaarden
    waaraan moet worden voldaan om in aanmerking te komen voor het regime dat door de Herziene Rijnvaartakte wordt
    gereserveerd voor vaartuigen die tot de Rijnvaart behoren (PbEG L 280), alsmede aan Richtlijn (EEG) nr. 87/540 van
    de Raad van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van nationaal en internationaal
    goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep betreffende diploma's,
    certificaten en andere titels ( PbEG L 322), en die mede kan dienen ter uitvoering van verdragen of besluiten van
    volkenrechtelijke organisaties:

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.b
    text: 'binnenschip: elk vaartuig dat wordt gebruikt tot de vaart op de binnenwateren of dat daartoe bestemd is;'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.c
    text: |-
      binnenwateren: de wateren, die in Nederland zijn gelegen binnen een langs de Nederlandse kust gaande, bij algemene
      maatregel van bestuur aan te wijzen lijn;
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.d
    text: |-
      binnenlands vervoer: vervoer met binnenschepen tussen twee binnen Nederland gelegen punten, ongeacht of daarbij de
      landsgrenzen worden overschreden;
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.e
    text: |-
      eigen vervoer: vervoer met binnenschepen van goederen, uitsluitend bestemd voor of afkomstig van eigen onderneming
      of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.f
    text: 'beroepsvervoer: vervoer met binnenschepen tegen vergoeding, niet zijnde eigen vervoer;'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.g
    text: |-
      Herziene Rijnvaartakte: de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (*Trb.* 1955,
      161);
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: 1.h
    text: 'Rijnvaartverklaring: de verklaring, bedoeld in artikel 2, derde lid, van de Herziene Rijnvaartakte.'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel1
  - number: '2.1'
    text: Deze wet is van toepassing op het vervoer van goederen en personen met binnenschepen op de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: '2.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder vervoer mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: 2.2.a
    text: het aanbieden van binnenschepen voor het vervoer van goederen en personen,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: 2.2.b
    text: het laden en lossen van goederen alsmede het in- en ontschepen van personen en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: 2.2.c
    text: het opslaan van goederen in binnenschepen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen bepaalde vormen van vervoer met binnenschepen, soorten
      binnenschepen, vervoer en op bepaalde binnenwateren of vervoer onder bepaalde omstandigheden worden aangewezen,
      waarop deze wet geheel of gedeeltelijk niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel2
  - number: '5.1'
    text: |-
      Onze Minister geeft met betrekking tot een binnenschip dat in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], te boek staat op aanvraag van de
      desbetreffende eigenaar, de mede-eigenaar of de exploitant van het schip een Rijnvaartverklaring af, mits wordt
      voldaan aan bij of krachtens algemene maatregel van bestuur te stellen eisen omtrent de nationaliteit alsmede de
      woon- en verblijfplaats in geval van een natuurlijke persoon onderscheidenlijk de oprichting, de zetel, het centrum
      van de handelsactiviteit, de plaats, van waaruit de exploitatie wordt geleid alsmede het bestuur en het beheer in
      geval van een rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde persoon danwel personen aan wie een verklaring is afgegeven, doet respectievelijk
      doen, elk voor zich, aan Onze Minister onverwijld schriftelijk mededeling van iedere wijziging in de omstandigheden
      op grond waarvan de verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan de verklaring ambtshalve of op aanvraag van de persoon of personen aan wie deze is afgegeven,
      intrekken. Hij trekt de verklaring ambtshalve in, indien niet langer aan de desbetreffende eisen voor afgifte wordt
      voldaan.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd het tweede lid, geeft Onze Minister voor een binnenschip, dat niet in aanmerking komt voor een
      Rijnvaartverklaring, op aanvraag van de eigenaar, mede-eigenaar of exploitant van het schip een bewijs van
      toelating af.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan hetzij op de gronden, bedoeld in artikel 4, tweede lid, van de Herziene Rijnvaartakte, hetzij om
      redenen van internationaal vervoerbeleid:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel6
  - number: 6.2.a
    text: de afgifte van een bewijs van toelating weigeren of een dergelijk bewijs intrekken danwel
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel6
  - number: 6.2.b
    text: |-
      een bewijs van toelating onder beperkingen verlenen of daaraan voorschriften verbinden of zodanige voorschriften of
      beperkingen wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel6
  - number: '6.3'
    text: |-
      [Het tweede en derde lid van artikel 5][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel5
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '7'
    text: |-
      Degene die vervoer van goederen of personen met een binnenschip verricht, heeft, voor zover van toepassing,
      gedurende het vervoer aan boord danwel draagt zorg dat anderszins, bij of krachtens algemene maatregel van bestuur
      te bepalen, controleerbaar is:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel7
  - number: 7.a
    text: de voor het binnenschip afgegeven Rijnvaartverklaring,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel7
  - number: 7.b
    text: |-
      het door Onze Minister aangewezen geëigend document van de bevoegde autoriteit van een andere Lid-Staat van
      de Europese Gemeenschappen of van een van de overige Staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel7
  - number: 7.c
    text: |-
      het voor het binnenschip afgegeven bewijs van toelating voor zover niet anders bepaald bij of krachtens algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel7
  - number: '8'
    text: 'Bij of krachtens algemene maatregel van bestuur worden in elk geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel8
  - number: 8.a
    text: de vorm, de inhoud en de afgifte van de Rijnvaartverklaring en het bewijs van toelating,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel8
  - number: 8.b
    text: |-
      de gegevens die bij een aanvraag om afgifte of intrekking van de Rijnvaartverklaring en het bewijs van toelating
      worden verstrekt en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel8
  - number: 8.c
    text: |-
      de wijze waarop een aanvraag om afgifte of intrekking van een Rijnvaartverklaring respectievelijk een bewijs van
      toelating wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel8
  - number: '9.1'
    text: 'Het is verboden vervoer van goederen of personen met een binnenschip op de binnenwateren te verrichten:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: 9.1.a
    text: |-
      tussen twee punten gelegen aan de wateren, bedoeld in artikel 4, eerste lid, van de Herziene Rijnvaartakte, zonder
      dat voor het binnenschip een Rijnvaartverklaring is afgegeven en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: 9.1.b
    text: 'in andere dan in onderdeel *a* bedoelde gevallen zonder dat voor het binnenschip is afgegeven:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: 9.1.b.1°
    text: een Rijnvaartverklaring,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: 9.1.b.2°
    text: |-
      een door Onze Minister aangewezen geëigend document van de bevoegde autoriteit van een andere Lid-Staat van
      de Europese Gemeenschappen of van een van de overige Staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: 9.1.b.3°
    text: een bewijs van toelating.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: '9.2'
    text: Van het verbod, bedoeld in het eerste lid, kan bij of krachtens algemene maatregel van bestuur worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel9
  - number: '10'
    text: |-
      Het is verboden te handelen in strijd met een beperking waaronder een bewijs van toelating is afgegeven of met een
      voorschrift dat aan een bewijs van toelating is verbonden.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister verleent op aanvraag een vergunning voor het beroepsvervoer van goederen, indien is voldaan aan bij
      of krachtens algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde eisen betreffen vakbekwaamheid, zoals vermeld in de Richtlijn van de Raad van de
      Europese Gemeenschappen van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van nationaal en
      internationaal goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep betreffende
      diploma's, certificaten en andere titels (*PbEG* L 322).
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister of een door hem aangewezen bevoegde instantie geeft, met in achtneming van het ter zake bepaalde
      in de EEG-Richtlijn, genoemd in het tweede lid, een verklaring af waaruit blijkt dat is voldaan aan eisen met
      betrekking tot betrouwbaarheid of kredietwaardigheid als bedoeld in het tweede lid, indien de betrokken ontvangende
      Lid-Staat dergelijke eisen stelt met het oog op het verrichten van beroepsvervoer van goederen op vaarwegen binnen
      haar gebied.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel11
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden bewijsstukken respectievelijk verklaringen aangewezen
      waarmee kan worden aangetoond, dat aan de eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel11
  - number: '12.1'
    text: |-
      Aan de in [artikel 11, tweede lid][ref1], bedoelde eis van vakbekwaamheid moet worden voldaan door degene, die
      daadwerkelijk en bij voortduring leiding geeft aan het beroepsvervoer of, indien deze leiding bij meer personen
      berust, door ten minste een van hen.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '12.2'
    text: |-
      Indien [artikel 11, derde lid][ref1], toepassing vindt, moet aan de in dat lid bedoelde eisen worden voldaan voor
      wat betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 12.2.a
    text: |-
      betrouwbaarheid door degene, die daadwerkelijk en bij voortduring leiding geeft aan het beroepsvervoer of, indien
      deze leiding bij meer personen berust, door ieder van hen en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel12
  - number: 12.2.b
    text: kredietwaardigheid door de ondernemer of, indien er meer ondernemers zijn, door hen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel12
  - number: '13.1'
    text: Een vergunning is niet overdraagbaar en wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel13
  - number: '13.2'
    text: |-
      In de vergunning wordt in elk geval de naam van de vergunninghouder alsmede, in voorkomend geval, de naam van
      degene die vakbekwaam is, niet zijnde de vergunninghouder, vermeld.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister is belast met de uitvoering van het bepaalde in artikel 4, tweede lid, van de in
      [artikel 11, tweede lid][ref1], genoemde Richtlijn van de Raad van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '15.1'
    text: |-
      Onze Minister kan een vergunning ambtshalve intrekken of op aanvraag van de vergunninghouder wijzigen of intrekken.
      Hij trekt de vergunning ambtshalve in, indien niet langer wordt voldaan aan het bepaalde in de [artikelen 11][ref1]
      en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel12
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '15.2'
    text: |-
      De vergunninghouder doet aan Onze Minister onverwijld schriftelijk mededeling van iedere wijziging in de
      omstandigheden op grond waarvan de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel15
  - number: '16.1'
    text: 'Een vergunning vervalt van rechtswege met ingang van de dag van:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel16
  - number: 16.1.a
    text: overlijden of intreden van lichamelijke ongeschiktheid of wettelijke onbekwaamheid van de vergunninghouder of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel16
  - number: 16.1.b
    text: |-
      ontbinding van de rechtspersoon, de vennootschap zonder rechtspersoonlijkheid of de maatschap, waaraan de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel16
  - number: '16.2'
    text: |-
      Op degene, die treedt in de rechten en verplichtingen van de in het eerste lid bedoelde vergunninghouder, is het
      bepaalde in [artikel 15, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel15
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '17.1'
    text: |-
      Onze Minister verleent een vergunning voor voortzetting van het beroepsvervoer van goederen gedurende een termijn
      van ten hoogste een jaar op een daartoe strekkende aanvraag:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
  - number: 17.1.a
    text: |-
      van de erfgenaam of, indien er meer erfgenamen zijn, van de gezamenlijke erfgenamen van de overleden
      vergunninghouder of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
  - number: 17.1.b
    text: |-
      van een, door of namens de vergunninghouder, gemachtigde in geval van lichamelijke ongeschiktheid of wettelijke
      onbekwaamheid van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid bedoelde termijn gaat in op de dag van het plaatshebben van een omstandigheid als bedoeld
      in dat lid. Onze Minister kan op aanvraag in bijzondere gevallen deze termijn met ten hoogste zesentwintig weken
      verlengen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister verleent de vergunning, bedoeld in het eerste lid, binnen vier weken na de datum van indiening van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
  - number: '17.4'
    text: |-
      Het bepaalde in de [artikelen 11, eerste lid][ref1], en [13, eerste lid][ref2], is, voor zover het vakbekwaamheid
      betreft, niet van toepassing op de vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel13
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '18.1'
    text: |-
      Als niet langer wordt voldaan aan de eis van vakbekwaamheid, bedoeld in [artikel 11][ref1], ten gevolge van
      overlijden of lichamelijke ongeschiktheid danwel wettelijke onbekwaamheid van degene, die aan de eisen voldeed
      en niet de vergunninghouder is, verleent Onze Minister, indien hem daartoe een aanvraag van de vergunninghouder
      heeft bereikt, een vergunning voor voortzetting van het onderhavige beroepsvervoer gedurende een termijn van ten
      hoogste een jaar. Deze termijn gaat in op de dag van het plaatshebben van een omstandigheid als bedoeld in de
      eerste volzin. Onze Minister kan op aanvraag in bijzondere gevallen deze termijn met ten hoogste zesentwintig weken
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '18.2'
    text: |-
      Onze Minister verleent de vergunning, bedoeld in het eerste lid, binnen vier weken na de datum van indiening van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel18
  - number: '18.3'
    text: |-
      De [artikelen 11, eerste lid][ref1], en [13, eerste lid][ref2], zijn niet van toepassing op de vergunning, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel13
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '19'
    text: 'Bij of krachtens algemene maatregel van bestuur worden in elk geval nadere regels gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: 19.a
    text: de wijze waarop een aanvraag om verlening, wijziging of intrekking van een vergunning wordt ingediend,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: 19.b
    text: de gegevens die in verband met onderdeel *a* worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: 19.c
    text: de termijnen waarbinnen op een aanvraag wordt beslist,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: 19.d
    text: de inhoud en de afgifte van een vergunning,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: 19.e
    text: |-
      hetgeen nodig is ter uitvoering van het bepaalde in [artikel 14][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel14
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 19.f
    text: de wijze waarop ambtshalve intrekking plaatsheeft.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel19
  - number: '20.1'
    text: 'Het is verboden beroepsvervoer van goederen op de binnenwateren te verrichten zonder dat daarvoor is afgegeven:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: 20.1.a
    text: |-
      een vergunning als bedoeld in [artikel 11][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 20.1.b
    text: |-
      een door Onze Minister aangewezen geëigend en op het betreffende vervoer betrekking hebbend document van de
      bevoegde autoriteit van een andere Lid-Staat van de Europese Gemeenschappen, van een van de overige Staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, of van Zwitserland.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: '20.2'
    text: Van het verbod, bedoeld in het eerste lid, kan bij of krachtens algemene maatregel van bestuur worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: '20.3'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: 20.3.a
    text: |-
      beroepsvervoer van goederen tussen twee punten gelegen aan de wateren, bedoeld in artikel 1 van de Herziene
      Rijnvaartakte, met een binnenschip waarvoor door de bevoegde Zwitserse autoriteit een Rijnvaartverklaring is
      afgegeven,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: 20.3.b
    text: |-
      beroepsvervoer van goederen met binnenschepen, waarvan het laadvermogen bij maximale diepgang ten hoogste 200
      metrieke ton bedraagt.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister kan het maximum, genoemd in het derde lid, voor alle vervoer, voor een gedeelte daarvan of voor
      sommige soorten van vervoer verlagen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel20
  - number: '21'
    text: |-
      Het is verboden te handelen in strijd met het bepaalde bij of krachtens [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel14
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '22'
    text: |-
      Onze Minister geeft op aanvraag van de vergunninghouder een vergunningbewijs af voor elk binnenschip waarmee deze
      beroepsvervoer van goederen wil gaan verrichten, mits:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
  - number: 22.a
    text: |-
      geen inschrijvingsbewijs als bedoeld in [artikel 46][ref1] voor dat schip is verleend en


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel46
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '46'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 22.b
    text: 'dat schip is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
  - number: 22.b.1°
    text: |-
      een geldig certificaat van onderzoek als bedoeld in [artikel 5, eerste lid, van de Binnenschepenwet][ref1] (*Stb.*
      1981, 678),


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
  - number: 22.b.2°
    text: |-
      een geldig certificaat van onderzoek als bedoeld in artikel 1.03, eerste lid, van het Reglement onderzoek schepen
      op de Rijn (*Stb.* 1976, 476),
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
  - number: 22.b.3°
    text: |-
      een geldig certificaat van deugdelijkheid, afgegeven krachtens de [Schepenwet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 22.b.4°
    text: |-
      een geldig document als bedoeld in [artikel 4, eerste lid onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
  - number: '23.1'
    text: 'Een voor een binnenschip afgegeven vergunningbewijs vervalt van rechtswege indien:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: 23.1.a
    text: |-
      het binnenschip niet langer voldoet aan het bepaalde in [artikel 22, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 23.1.b
    text: de vergunninghouder het binnenschip kennelijk niet langer voor beroepsvervoer van goederen gebruikt, of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: 23.1.c
    text: de vergunning, bedoeld in paragraaf 1 van deze afdeling, wordt ingetrokken danwel van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: '23.2'
    text: |-
      De vergunninghouder doet aan Onze Minister onverwijld schriftelijk mededeling van iedere wijziging in de
      omstandigheden op grond waarvan het vergunningbewijs is verleend.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister wijzigt een voor een binnenschip afgegeven vergunningbewijs ambtshalve, indien een verandering ten
      aanzien van de gegevens vermeld op het vergunningbewijs of de vergunning daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: '23.4'
    text: |-
      De vergunninghouder is verplicht een voor een binnenschip afgegeven vergunningbewijs, dat van rechtswege is
      vervallen, bij Onze Minister in te leveren.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel23
  - number: '24'
    text: |-
      Een voor een binnenschip afgegeven vergunningbewijs of een bewijsstuk als bedoeld in [artikel 26][ref1] moet op het
      desbetreffende binnenschip aanwezig danwel anderszins, bij of krachtens algemene maatregel van bestuur te bepalen,
      controleerbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel26
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '25'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in elk geval nadere regels gesteld omtrent de inhoud,
      afgifte, wijziging en inlevering van een vergunningbewijs.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel25
  - number: '26'
    text: |-
      Het is verboden beroepsvervoer van goederen te verrichten zonder dat voor het desbetreffende binnenschip een
      vergunningbewijs als bedoeld in [artikel 22][ref1] of een, bij of krachtens algemene maatregel van bestuur
      aangewezen, overeenkomstig bewijsstuk is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '41.1'
    text: 'Onze Minister verleent op aanvraag een inschrijving eigen vervoer, indien:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel41
  - number: 41.1.a
    text: |-
      aannemelijk wordt gemaakt dat het vervoer waarvoor de inschrijving wordt gevraagd, is aan te merken als eigen
      vervoer en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel41
  - number: 41.1.b
    text: |-
      wordt voldaan aan eisen inzake de rechtsbetrekkingen waarin de eigen vervoerder ten opzichte van de bij het eigen
      vervoer te gebruiken binnenschepen staat en inzake de rechtsverhoudingen ten aanzien van het bij het eigen vervoer
      in te zetten personeel.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel41
  - number: '41.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven omtrent de eisen, bedoeld in het eerste lid
      onderdelen *a* en *b*.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel41
  - number: '42.1'
    text: |-
      Een inschrijving eigen vervoer wordt verleend voor hetzij onbepaalde tijd hetzij bij algemene maatregel van bestuur
      te regelen bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel42
  - number: '42.2'
    text: 'In de inschrijving worden in elk geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel42
  - number: 42.2.a
    text: de naam van de ingeschrevene,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel42
  - number: 42.2.b
    text: de omschrijving van de te vervoeren goederen en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel42
  - number: 42.2.c
    text: de aard van de bedrijfsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel42
  - number: '43.1'
    text: |-
      Indien een wijziging is ingetreden in een omstandigheid waarop een onderdeel van de inschrijving als bedoeld
      in [artikel 42, tweede lid][ref1], betrekking heeft, dient de ingeschrevene onmiddellijk een aanvraag voor een
      nieuwe inschrijving in bij Onze Minister, onder vermelding van de bedoelde wijziging. Onverminderd het bepaalde in
      [artikel 41][ref2] verleent Onze Minister, onder doorhaling van de bestaande inschrijving, een nieuwe inschrijving,
      waarin de wijziging is verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel41
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '41'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '43.2'
    text: |-
      Onze Minister kan een inschrijving eigen vervoer ambtshalve of op aanvraag van de ingeschrevene doorhalen. Hij
      haalt de inschrijving door, indien:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel43
  - number: 43.2.a
    text: |-
      niet langer wordt voldaan aan het bepaalde in [artikel 41][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel41
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '41'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 43.2.b
    text: de bedrijfsactiviteit, die tot het vervoer heeft geleid, is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel43
  - number: '43.3'
    text: |-
      Na de doorhaling, bedoeld in het tweede lid, wordt een nieuwe inschrijving niet eerder verleend dan nadat ten
      minste zesentwintig weken zijn verstreken met ingang van de dag van doorhaling van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel43
  - number: '44'
    text: |-
      Op een inschrijving is [artikel 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel16
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '45.1'
    text: |-
      Onze Minister verleent voor het voortzetten van hetzelfde eigen vervoer een inschrijving eigen vervoer op eigen
      naam op een daartoe strekkende aanvraag:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel45
  - number: 45.1.a
    text: |-
      van de erfgenaam of, indien er meer erfgenamen zijn, van de gezamenlijke erfgenamen van de overleden ingeschrevene
      of
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel45
  - number: 45.1.b
    text: |-
      van een, door of namens de ingeschrevene, gemachtigde in geval van lichamelijke ongeschiktheid of wettelijke
      onbekwaamheid van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel45
  - number: '45.2'
    text: De inschrijving gaat in op de dag van het plaatshebben van een omstandigheid als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel45
  - number: '45.3'
    text: |-
      Onze Minister verleent de inschrijving, bedoeld in het eerste lid, binnen vier weken na de datum van indiening van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel45
  - number: '46.1'
    text: |-
      Onze Minister geeft aan de ingeschrevene op aanvraag een inschrijvingsbewijs af voor elk binnenschip waarmee deze
      binnenlands eigen vervoer wil gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel46
  - number: '46.2'
    text: |-
      Op het inschrijvingsbewijs zijn de [artikelen 22][ref1], [23, tweede, derde en vierde lid][ref2], [24][ref3] en
      [41][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0005319#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0005319#Artikel41
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005319
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005319
        artikel: '41'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '47'
    text: 'Bij of krachtens algemene maatregel van bestuur worden in elk geval nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: 47.a
    text: de wijze waarop een aanvraag om inschrijving of doorhaling van een inschrijving wordt ingediend,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: 47.b
    text: de gegevens die in verband met onderdeel *a* worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: 47.c
    text: de termijnen waarbinnen op een aanvraag wordt beslist,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: 47.d
    text: |-
      de inhoud en verlening van een inschrijving en de inhoud, afgifte, wijziging en inlevering van een
      inschrijvingsbewijs alsmede
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: 47.e
    text: de wijze waarop ambtshalve doorhaling plaatsheeft.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel47
  - number: '48.1'
    text: |-
      Het is verboden binnenlands eigen vervoer van goederen op de binnenwateren te verrichten zonder dat daarvoor een
      inschrijving eigen vervoer van Onze Minister is verleend. Het is verboden binnenlands eigen vervoer van goederen te
      verrichten zonder dat voor het desbetreffende binnenschip een inschrijvingsbewijs als bedoeld in [artikel 46][ref1]
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel46
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '46'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '48.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel48
  - number: 48.2.a
    text: |-
      binnenlands eigen vervoer van goederen tussen twee punten gelegen aan de wateren, bedoeld in artikel 1 van de
      Herziene Rijnvaartakte, met een binnenschip waarvoor door de bevoegde autoriteit van een andere Lid-Staat van de
      Europese Gemeenschappen dan Nederland of een van de overige Staten die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte dan wel van Zwitserland een Rijnvaartverklaring is afgegeven,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel48
  - number: 48.2.b
    text: |-
      binnenlands eigen vervoer van goederen met binnenschepen, waarvan het laadvermogen bij maximale diepgang ten
      hoogste 200 metrieke ton bedraagt.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel48
  - number: '48.3'
    text: |-
      Onze Minister kan het maximum, genoemd in het tweede lid, voor alle vervoer, voor een gedeelte daarvan of voor
      sommige soorten van vervoer verlagen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel48
  - number: '49'
    text: |-
      In het binnenlands eigen vervoer is het verboden andere goederen op de binnenwateren te vervoeren dan die waarop de
      desbetreffende inschrijving eigen vervoer en het desbetreffende inschrijvingsbewijs betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel49
  - number: '52'
    text: |-
      [Artikel 22, onderdeel a][ref1], is niet van toepassing op binnenlands vervoer met binnenschepen, welke uitsluitend
      of nagenoeg uitsluitend zijn ingericht voor het in tanks in bulk vervoeren van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '53'
    text: |-
      De eigenaar van een binnenschip dat in Nederland krachtens de artikelen 193 of 783 van Boek 8 van het Burgerlijk
      Wetboek is teboekgesteld, is onverwijld verplicht:
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel53
  - number: 53.a
    text: zijn binnenschip in een door Onze Minister bijgehouden register te laten registreren,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel53
  - number: 53.b
    text: |-
      het registratienummer op zijn binnenschip aan te brengen op een door Onze Minister te bepalen plaats en wijze
      alsmede
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel53
  - number: 53.c
    text: elke wijziging die de geregistreerde gegevens betreft in het register te laten aanbrengen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel53
  - number: '54'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel54
  - number: 54.a
    text: de wijze waarop een aanvraag om registratie alsmede wijziging van die registratie wordt ingediend,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel54
  - number: 54.b
    text: de te registreren gegevens,
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel54
  - number: 54.c
    text: de bescherming van de geregistreerde gegevens en
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel54
  - number: 54.d
    text: |-
      de wijze waarop de geregistreerde personen kennis kunnen nemen en verbetering kunnen laten aanbrengen van de over
      hen en hun binnenschepen opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel54
  - number: '55'
    text: |-
      Het is verboden vervoer te verrichten met een binnenschip als bedoeld in [artikel 53][ref1], dat niet is
      geregistreerd in het door Onze Minister bijgehouden register.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel53
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '53'
        hoofdstuk: '2'
        afdeling: '7'
  - number: '56.1'
    text: |-
      Aan degene die een aanvraag doet tot afgifte of wijziging van de in het tweede lid genoemde documenten kan daarvoor
      een vergoeding van de kosten in rekening worden gebracht, verschuldigd volgens door Onze Minister vast te stellen
      tarieven.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel56
  - number: '56.2'
    text: 'De in het eerste lid bedoelde documenten zijn:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel56
  - number: 56.2.a
    text: |-
      de Rijnvaartverklaring, bedoeld in [artikel 5,][ref1]


