  - number: 58a.2
    text: |-
      Ter uitvoering van de [artikelen 11, derde lid][ref1], en [15][ref2] kunnen strafrechtelijke persoonsgegevens
      worden verwerkt, indien dit voor de beoordeling van de betrouwbaarheid of kredietwaardigheid van een betrokkene
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel15
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 58a.3
    text: Onze Minister is verantwoordelijke voor de verwerking van de in het eerste en tweede lid bedoelde persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58a
  - number: 58b.1
    text: |-
      Ter uitvoering van de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte kunnen
      persoonsgegevens worden verwerkt betreffende de gezondheid van de bemanning van schepen op de Rijn in Nederland,
      met inbegrip van de Waal en de Lek. De verwerking van deze gegevens vindt plaats teneinde de lichamelijke
      geschiktheid van de bemanning vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58b
  - number: 58b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald wie verantwoordelijke is voor de verwerking van de
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58b
  - number: '59'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel59
  - number: '60.1'
    text: 'Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast:'
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel60
  - number: 60.1.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 60.1.b
    text: de door Onze Minister aangewezen ambtenaren van het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel60
  - number: '60.2'
    text: Onze Minister kan beleidsregels vaststellen met betrekking tot het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel60
  - number: '62'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel62
  - number: '72.1'
    text: |-
      Beroep bij het College van Beroep voor het bedrijfsleven met betrekking tot verlening, weigering, overdracht of
      wijziging van een vergunning voor ongeregeld vervoer dat is ingesteld voor het tijdstip van inwerking treden van
      dit artikel en waarop voor dat tijdstip nog niet is beslist of ingesteld na het tijdstip van inwerking treden van
      dit artikel, maar binnen de beroepstermijn, dan wel ingesteld na verloop van de beroepstermijn, doch waaromtrent
      ten genoegen van het College is aangetoond, dat ter zake van de overschrijding van de beroepstermijn redelijkerwijs
      geen verwijt kan worden gemaakt, wordt door het College overeenkomstig het bepaalde bij of krachtens de Wet
      Goederenvervoer Binnenscheepvaart afgehandeld.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel72
  - number: '72.2'
    text: |-
      Indien een beslissing als bedoeld in het eerste lid leidt tot verlening, overdracht of wijziging van de vergunning
      voor ongeregeld vervoer als bedoeld in [artikel 32][ref1] of 33 van de Wet Goederenvervoer Binnenscheepvaart,
      danwel van de vergunning voor beperkt ongeregeld vervoer als bedoeld in artikel 34 van de voornoemde wet,
      zijn daarop de [artikelen 66][ref2] en [67][ref3] respectievelijk [68][ref4] en [69][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005319#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0005319#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0005319#Artikel69
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '32'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005319
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005319
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005319
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '2'
        afdeling: '1'
  - number: '78.1'
    text: |-
      Natuurlijke personen die ten genoegen van Onze Minister kunnen bewijzen dat zij voor het tijdstip, bedoeld in
      artikel 5 van de in [artikel 11][ref1] genoemde Richtlijn van de Raad van de Europese Gemeenschappen, in een Lid-
      Staat of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte het beroep
      van ondernemer van nationaal of internationaal goederenvervoer over de binnenwateren wettelijk hebben uitgeoefend,
      voldoen aan de eis van vakbekwaamheid, bedoeld in [artikel 11][ref2], en ontvangen van Onze Minister op aanvraag
      een desbetreffend bewijsstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel11
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '78.2'
    text: Het eerste lid is van overeenkomstige toepassing op rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel78
  - number: '80'
    text: |-
      Afgifte van een vergunningbewijs als bedoeld in [artikel 22][ref1], verlening van een inschrijving als
      bedoeld in [artikel 42][ref2] of afgifte van een inschrijvingsbewijs als bedoeld in [artikel 46][ref3], of, in
      voorkomende gevallen, beide hebben niet eerder plaats, dan nadat ten genoegen van Onze Minister is aangetoond,
      dat de eigenaar van het desbetreffende binnenschip heeft voldaan aan artikel 4, eerste lid, van [Verordening
      nr. 718/1999](31999R0718) van de Raad van de Europese Unie van 29 maart 1999 betreffende het beleid ten aanzien
      van de capaciteit van de communautaire binnenvaartvloot met het oog op de bevordering van het vervoer over de
      binnenwateren (PbEG L 90).


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0005319#Artikel46
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005319
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005319
        artikel: '46'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '81'
    text: |-
      Een voor een binnenschip afgegeven vergunningbewijs vervalt van rechtswege, indien niet is voldaan aan artikel 4,
      eerste lid, van de in [artikel 80][ref1] genoemde verordening. Het in de vorige volzin bedoelde vergunningbewijs
      dient door de desbetreffende vergunninghouder bij Onze Minister te worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel80
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '80'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '1'
  - number: '82'
    text: |-
      Een inschrijving of een voor een binnenschip afgegeven inschrijvingsbewijs of, in voorkomende gevallen, beide
      vervallen van rechtswege, indien niet is voldaan aan artikel 4, eerste lid, van de in [artikel 80][ref1] genoemde
      verordening. Het in de vorige volzin bedoelde inschrijvingsbewijs dient door de desbetreffende ingeschrevene bij
      Onze Minister te worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel80
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '80'
        hoofdstuk: '8'
        paragraaf: '7'
        afdeling: '1'
  - number: '83.1'
    text: |-
      Onverminderd het bepaalde in [artikel 22, onderdeel ][ref1], geeft Onze Minister desgevraagd aan de
      vergunninghouder een vergunningbewijs af voor elk binnenschip waarmee deze beroepsvervoer van goederen wil
      gaan verrichten, mits deze kan aantonen dat het binnenschip voldoet aan de vereisten voor de afgifte van het
      communautair certificaat van onderzoek, bedoeld in artikel 3 van de Richtlijn van de Raad van de Europese
      Gemeenschappen van 4 oktober 1982 tot vaststelling van de technische voorschriften voor binnenschepen (*PbEG*
      L 301).


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel22
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '83.2'
    text: |-
      Dit artikel geldt voor een tijdsduur als vermeld in de Regeling vaststelling tijdschema eerste onderzoek bestaande
      vrachtschepen, sleepboten en duwboten van 12 april 1988, nr. S/J 30 570/88 (*Stcrt.* 1988, 96) die voor de daarbij
      genoemde categorieën verschilt.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel83
  - number: '83.3'
    text: |-
      Het bepaalde in het eerste en het tweede lid is van overeenkomstige toepassing op de afgifte van een
      inschrijvingsbewijs als bedoeld in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel46
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '46'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '84'
    text: |-
      Verklaringen inzake het behoren tot de Rijnvaart als bedoeld in artikel 2, derde lid, van de Herziene
      Rijnvaartakte, die zijn afgegeven door Onze Minister voor het tijdstip van inwerking treden van dit artikel, worden
      met ingang van dat tijdstip aangemerkt als Rijnvaartverklaringen als bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel5
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005319
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '85'
    text: |-
      Op aanvragen om verklaringen inzake het behoren tot de Rijnvaart als bedoeld in artikel 2, derde lid, van de
      Herziene Rijnvaartakte, die zijn ingediend voor het tijdstip van inwerking treden van dit artikel, zijn, voor zover
      daarop voor dat tijdstip nog niet is beslist, de bepalingen van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel85
  - number: '86'
    text: |-
      Op beroepen tegen beschikkingen op aanvragen om of met betrekking tot het intrekken van verklaringen inzake het
      behoren tot de Rijnvaart als bedoeld in artikel 2, derde lid, van de Herziene Rijnvaartakte, die aanhangig zijn op
      het tijdstip van inwerking treden van dit artikel of na die datum binnen de beroepstermijn aanhangig zijn gemaakt,
      wordt beslist door het orgaan waarvoor het beroep dient respectievelijk zou dienen.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel86
  - number: '92'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel92
  - number: '93'
    text: Deze wet kan worden aangehaald als Wet vervoer binnenvaart.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel93
