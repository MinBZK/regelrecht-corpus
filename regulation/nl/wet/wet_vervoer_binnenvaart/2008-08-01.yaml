  - number: 56.2.k
    text: gewaarmerkte afschriften van de in de onderdelen *a* tot en met *l* genoemde documenten.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel56
  - number: '56.3'
    text: |-
      De in het eerste lid bedoelde vergoeding bedraagt niet meer dan de voor de aldaar bedoelde handelingen werkelijk
      gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel56
  - number: '57'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de verstrekking van gegevens
      betreffende het vervoer.
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel57
  - number: '58'
    text: |-
      In het bij of krachtens dit hoofdstuk bepaalde wordt verstaan onder verwerken van
      persoonsgegevens, onderscheidenlijk verantwoordelijke: hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 58a.1
    text: |-
      Ter uitvoering van de [artikelen 11][ref1], [15][ref2], [16][ref3], [17][ref4], [18][ref5], [43][ref6] en
      [45][ref7], alsmede voor het verlenen van ontheffing onderscheidenlijk vrijstelling van deze artikelen, worden
      persoonsgegevens verwerkt betreffende de gezondheid, waaronder mede begrepen de wettelijke onbekwaamheid. De
      verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of aan deze artikelen toepassing kan worden
      gegeven, dan wel of ontheffing onderscheidenlijk vrijstelling kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005319#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005319#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0005319#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0005319#Artikel43
      [ref7]: https://wetten.overheid.nl/BWBR0005319#Artikel45
    url: https://wetten.overheid.nl/BWBR0005319/2008-08-01#Artikel58a
    references:
