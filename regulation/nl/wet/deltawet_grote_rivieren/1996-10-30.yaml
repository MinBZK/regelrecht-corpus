  - number: '3'
    text: |-
      1 Voor zover [richtlijn nr. 85/337/EEG](31985L0337) van de Raad van de Europese Gemeenschappen van 27 juni
      1985 betreffende de milieu-effectbeoordeling van bepaalde openbare en particuliere projecten (*PbEG* L 175) van
      toepassing is met betrekking tot werken als bedoeld in [artikel 1][ref1], wordt voor de uitvoering van die werken
        - met toepassing van artikel 2, derde lid, van die richtlijn - geheel vrijstelling verleend van de bepalingen van
      die richtlijn.

      2 [Hoofdstuk 7 van de Wet milieubeheer][ref2] is op die werken niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007338#Artikel1
