preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een bijzondere voorziening nodig is ten behoeve van een onverwijlde
    uitvoering van werken tot versterking van een aantal dijkvakken met het oog op het zo spoedig mogelijk bereikt
    moeten zijn van veiligheid tegen overstromingsgevaar bij hoogwater op de Rijn of een van zijn zijtakken of de Maas,
    alsmede ten behoeve van een onverwijlde uitvoering van werken tot aanleg of verhoging van kaden langs de onbedijkte
    gedeelten van de Maas alsmede langs een gedeelte van de Rijksweg A2 met het oog op het zo spoedig mogelijk moeten
    voorkomen of beperken van wateroverlast;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007338/1996-10-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet is van toepassing op de uitvoering van werken voor:

      a. de versterking van de dijkvakken, opgenomen in de bij deze wet behorende lijst ( [bijlage 1][ref1]);

      b. de aanleg of de versterking van de kaden, aangegeven op de bij deze wet behorende lijst met bijbehorende kaarten
      ( [bijlage 2][ref2]);

      c. de aanleg van opslagplaatsen - in de nabijheid van de onder *a* en *b* bedoelde werken - van verontreinigde
      bodemmaterialen, afkomstig van de onder *a* en *b* bedoelde werken dan wel van in samenhang daarmee uitgevoerde
      rivierwerken;

      d. de aanleg van kaden langs het gedeelte van de Rijksweg A2, aangegeven op de bij deze wet behorende kaart
      ( [bijlage 3][ref3]).

      2 De in het eerste lid bedoelde bijlagen kunnen worden gewijzigd bij algemene maatregel van bestuur. Een krachtens
      de eerste volzin vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee weken na de
      datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal.

      3 Na 1 januari 1997 is deze wet slechts van toepassing op de uitvoering van werken die zijn opgenomen op
      de lijst zoals deze bij wet is vastgesteld en ten aanzien waarvan vóór die datum een besluit als bedoeld in
      [artikel 4, derde lid][ref4], is genomen.


