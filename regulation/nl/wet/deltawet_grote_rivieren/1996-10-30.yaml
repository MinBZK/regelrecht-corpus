  - number: '4'
    text: |-
      1 Degene die als beheerder dient over te gaan tot de uitvoering van een werk als bedoeld in [artikel 1][ref1],
      stelt een concept-plan van uitvoering met toelichting vast.

      2 Uit het concept-plan en de toelichting blijkt welke gevolgen aan de uitvoering zijn verbonden en op
      welke wijze met de daarbij betrokken belangen, waaronder die van landschap, natuur, cultuurhistorie,
      volkshuisvesting, ruimtelijke ordening en milieu conform de aanbevelingen van de Commissie Toetsing Uitgangspunten
      Rivierdijkversterkingen (Boertien I), is rekening gehouden.

      3 Gedeputeerde staten stellen op basis van het concept-plan het plan met toelichting vast. Zij nemen hun besluit
      zo spoedig mogelijk doch uiterlijk binnen vier weken nadat het concept-plan met toelichting door de beheerder aan
      hen is toegezonden. In bijzondere omstandigheden kunnen gedeputeerde staten de in de tweede volzin genoemde termijn
      met ten hoogste twee weken verlengen. Indien gedeputeerde staten niet binnen de in de derde volzin bepaalde termijn
      beslissen, wordt het concept-plan met toelichting zoals het door de beheerder aan hen is toegezonden geacht te zijn
      vastgesteld door gedeputeerde staten.

      4 Op de voorbereiding van het besluit van gedeputeerde staten is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure van toepassing. In afwijking
      van artikel 3:11, eerste lid, van die wet bedraagt de daarin genoemde termijn twee weken. In de in
      [artikel 3:12 van de Algemene wet bestuursrecht][ref3] bedoelde kennisgeving wordt vermeld op welk tijdstip het
      concept-plan met toelichting door de beheerder aan gedeputeerde staten is toegezonden.

      5 De in [artikel 1][ref4] bedoelde werken worden door de beheerder uitgevoerd overeenkomstig het door gedeputeerde
      staten vastgestelde plan. In geval van uitvoering in strijd met het plan kunnen gedeputeerde staten de beheerder
      gelasten die uitvoering te staken en ongedaan te maken hetgeen in strijd met het plan is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007338#Artikel1
