  - number: '5'
    text: |-
      1 Indien onverwijlde inbezitneming van onroerende zaken ten behoeve van de uitvoering van een werk als bedoeld
      in [artikel 1][ref1] volstrekt noodzakelijk geacht wordt, kan deze, voor zover die onroerende zaken in het plan
      zijn aangewezen, op last van de beheerder geschieden. De [artikelen 73][ref2], vijfde en zesde lid, [74][ref3],
      [75][ref4] en [76 van de Onteigeningswet][ref5] zijn van toepassing.

      2 Indien onroerende zaken als bedoeld in het eerste lid zijn aangewezen in het concept-plan, geschiedt daarvan
      kennisgeving aan degenen die in de kadastrale registratie staan vermeld als eigenaren van die onroerende zaken of
      als rechthebbenden op een beperkt recht waaraan die onroerende zaken onderworpen zijn. De kennisgeving wordt gedaan
      gelijktijdig met de in [artikel 3:12 van de Algemene wet bestuursrecht][ref6] bedoelde kennisgeving en bevat de in
      het derde lid van dat artikel alsmede de in [artikel 4, vierde lid, derde volzin][ref7], bedoelde gegevens.

      3 Tegen een besluit van de beheerder tot het geven van een last als bedoeld in het eerste lid, kan geen beroep
      worden ingesteld.


