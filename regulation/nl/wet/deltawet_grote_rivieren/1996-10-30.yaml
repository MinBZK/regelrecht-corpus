  - number: '7'
    text: |-
      Voor zover blijkt dat een belanghebbende ten gevolge van de uitvoering van een werk als bedoeld in
      [artikel 1][ref1] schade lijdt of zal lijden welke redelijkerwijs niet of niet geheel te zijnen laste behoort te
      blijven en waarvan de vergoeding niet of niet voldoende op andere wijze is verzekerd, kent het bestuursorgaan dat
      tot de uitvoering van het werk overgaat, aan die belanghebbende een naar billijkheid te bepalen schadevergoeding
      toe.


      [ref1]: https://wetten.overheid.nl/BWBR0007338#Artikel1
