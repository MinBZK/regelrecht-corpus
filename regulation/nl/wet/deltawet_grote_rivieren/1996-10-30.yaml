  - number: '8'
    text: |-
      1 Besluiten als bedoeld in [artikel 2, eerste lid][ref1], die voor het tijdstip van inwerkingtreding van deze wet
      zijn genomen en op dat tijdstip nog niet onherroepelijk zijn geworden, vervallen van rechtswege. Besluiten die mede
      betrekking hebben op andere onderwerpen dan de uitvoering van de in [artikel 1][ref2] bedoelde werken, vervallen
      slechts voor zover het die uitvoering betreft.

      2 Een besluit als bedoeld in [artikel 4, derde lid][ref3], geldt als aanvulling op besluiten als bedoeld in
      [artikel 2, eerste lid][ref4], die voor het tijdstip van inwerkingtreding van deze wet zijn genomen en op dat
      tijdstip onherroepelijk zijn.


