    text: |-
      1 Ten aanzien van de uitvoering van de in [artikel 1][ref1] bedoelde werken zijn de wettelijke voorschriften
      krachtens welke daarvoor een vergunning, ontheffing, vrijstelling of enig ander besluit is vereist, niet van
      toepassing.

      2 Indien wettelijke voorschriften een zodanige belemmering voor de uitvoering van het in het plan van uitvoering
      beschreven werk vormen, dat het volstrekt noodzakelijk wordt geacht die voorschriften buiten toepassing te
      laten, kunnen gedeputeerde staten bij de vaststelling van het plan als bedoeld in [artikel 4][ref2], bepalen dat
      die bij hun besluit aan te wijzen voorschriften buiten toepassing blijven. Deze bevoegdheid geldt niet indien
      het buiten toepassing laten van een wettelijk voorschrift in strijd zou komen met de [Grondwet][ref3] of enige
      internationaalrechtelijke verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007338#Artikel1
