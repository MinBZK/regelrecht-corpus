  - number: '6'
    text: |-
      1 Tegen een besluit als bedoeld in [artikel 4, derde lid][ref1], kan een belanghebbende beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.

      2 [Artikel 7:1 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      3 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref3] bedraagt de termijn voor het instellen van
      beroep twee weken.

      4 Het beroep wordt behandeld met toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref4].

      5 De Afdeling bestuursrechtspraak beslist binnen zes weken na afloop van de termijn, bedoeld in het derde lid. In
      bijzondere omstandigheden kan de Afdeling deze termijn met ten hoogste vier weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007338#Artikel4
