publication_date: '2005-03-30'
valid_from: '2004-04-01'
bwb_id: BWBR0016525
url: https://wetten.overheid.nl/BWBR0016525/2004-04-01
preamble:
  text: |-
    – Gelet op artikel 32, eerste lid van de Verordening (EG) nr. 2342/1999 van de Commissie van 28 oktober
    1999 tot vaststelling van uitvoeringsbepalingen van Verordening (EG) nr. 1254/1999 van de Raad houdende een
    gemeenschappelijke ordening der markten in de sector rundvlees met betrekking tot de premieregelingen;

    – Gelet op artikel 7, eerste lid, van de Regeling EG-steunverlening akkerbouwgewassen, op artikel 4.2a, eerste
    lid, van de Regeling dierlijke EG-premies, en op artikel 5a van het Besluit administratieve verplichtingen
    Meststoffenwet;

    – Voorts gelet op de artikelen 24 en 25 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. LASER: Agentschap LASER van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. beschrijvingsbiljet: in [bijlage I][ref1] opgenomen modelformulier voor de periodieke inventarisatie in de land-
      en tuinbouw;

      c. opgaveplichtige: persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de
      landbouw zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet,
      bedoeld in onderdeel b, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016525
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2004 tot en met 15 mei 2004 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt een beschrijvingsbiljet uitgereikt of verzonden
      door de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0016525#Artikel2
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016525
        artikel: '2'
  - number: '4'
    text: |-
      1 De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2004.

      2 De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de toestand op 1 april
      2004. Indien een oppervlakte op 1 april 2004 nog niet is beteeld, wordt de eerstvolgende geplande teelt opgegeven.

      3 Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet of door LASER anders is aangegeven, en
      neemt daarbij de overige op het biljet of door LASER gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel4
  - number: '5'
    text: |-
      1 De opgaveplichtige ondertekent het beschrijvingsbiljet en doet dat binnen veertien dagen na dagtekening van de
      aanbieding aan LASER toekomen.

      2 Indien het beschrijvingsbiljet aangetekend aan de opgaveplichtige is toegezonden, doet deze dat binnen vijf dagen
      ingevuld en ondertekend aan LASER toekomen.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel5
  - number: '6'
    text: |-
      1 Voor de bepaling van de bedrijfsomvang geldt dat één Nederlandse grootte-eenheid gelijk is aan 1375 eenheden
      bruto standaardsaldo.

      2 De bruto standaardsaldi respectievelijk de Nederlandse grootte-eenheid worden vastgesteld als vermeld in
      [bijlage II][ref1].

      3 Bruto-standaardsaldi worden overeenkomstig [bijlage II][ref2] omgerekend in Nederlandse grootte-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016525
      [ref2]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016525
      - id: ref2
        bwb_id: BWBR0016525
  - number: '7'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] maakt de uit dien hoofde opgaveplichtige die tevens gehouden is
      gegevens te verstrekken met betrekking tot:

      a. de aanvraag oppervlakten, bedoeld in [artikel 6 van de Regeling EG-steunverlening akkerbouwgewassen][ref2],

      b. het extensiveringsbedrag, bedoeld in [artikel 4.2a, eerste lid, van de Regeling dierlijke EG-premies][ref3], of

      c. de opgave gewaspercelen, bedoeld in
      [artikel 5a van de Regeling administratieve verplichtingen Meststoffenwet][ref4],

      voor het verstrekken van alle onderscheiden gegevens gebruik van het formulier waarvan het model is opgenomen als
      [bijlage III][ref5] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016525#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008007#Artikel4.2a
      [ref4]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016525
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008301
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0008007
        artikel: 4.2a
      - id: ref4
        bwb_id: BWBR0009228
        artikel: 5a
      - id: ref5
        bwb_id: BWBR0016525
  - number: '8'
    text: |-
      De opgave, bedoeld in [artikel 2 van deze Regeling][ref1], de aanvraag, bedoeld in
      [artikel 7a van de Regeling EG-steunverlening akkerbouwgewassen][ref2] en de verstrekking van gegevens, bedoeld in
      [artikel 5a van de Regeling administratieve verplichtingen Meststoffenwet][ref3] kunnen gezamenlijk elektronisch
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0016525#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016525
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008301
        artikel: 7a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 5a
  - number: '9'
    text: |-
      1 De gezamenlijke elektronische indiening geschiedt met het daartoe bestemde elektronische formulier.

      2 Het formulier wordt elektronisch ondertekend met een door de Minister aan de ondertekenaar ter beschikking
      gestelde eenmalig bruikbare tancode.

      3 De Minister bevestigt de ontvangst van een elektronisch ingediend formulier.

      4 De Minister bevestigt bij ontvangst van een door een gemachtigde ingediend elektronisch formulier aan de
      gemachtigde en de aanvrager.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel9
  - number: '10'
    text: |-
      Een tancode wordt uitsluitend overeenkomstig deze regeling gebruikt voor het doel waarvoor en door degene aan wie
      de tancode is verstrekt.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel10
  - number: '11'
    text: De Minister verstrekt ambtshalve een set tancodes aan bij hem bekende agrarische ondernemers.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel11
  - number: '12'
    text: |-
      De Minister verstrekt op een met redenen omkleed verzoek van de aanvrager een set tancodes ten behoeve van de
      elektronische handtekening, ingeval

      a. deze geen tancodes heeft ontvangen;

      b. de verstrekte tancodes zijn gebruikt, of

      c. van verlies van eerder verstrekte tancodes.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel12
  - number: '13'
    text: |-
      De Minister kan besluiten een set tancodes niet te verstrekken of in te trekken, indien de indiener of een met hem
      geassocieerd bedrijf of organisatie in het verleden een tancode heeft gebruikt in strijd met deze regeling of op
      andere wijze de integriteit van een verstrekte handtekening heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel13
  - number: '14'
    text: |-
      1 In afwijking van [artikel 10][ref1] kan een belanghebbende de aan hem verstrekte tancodes doen gebruiken door een
      gemachtigde als bedoeld in [artikel 2:1 van de Algemene wet bestuursrecht][ref2] ten behoeve van het indienen van
      een elektronische formulier namens belanghebbende.

      2 De gemachtigde maakt bij het indienen van de aanvraag, de opgave onderscheidenlijk de verstrekking als bedoeld
      in [artikel 8][ref3] slechts gebruik van de aan de gemachtigde ter beschikking gestelde toegangscodes tot het
      elektronische formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0016525#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0016525#Artikel8
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016525
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 2:1
      - id: ref3
        bwb_id: BWBR0016525
        artikel: '8'
  - number: '15'
    text: |-
      1 De Minister kan een elektronisch formulier weigeren, indien dit niet overeenkomstig deze regeling is ingediend.

      2 De Minister kan elektronisch verschafte gegevens en bescheiden weigeren voor zover de aanvaarding daarvan tot een
      onevenredige belasting voor de Minister zou leiden.

      3 De Minister kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of vertrouwelijkheid
      van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het
      wordt gebruikt.

      4 De Minister deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel15
  - number: '16'
    text: |-
      Als tijdstip waarop een elektronisch formulier door de Minister elektronisch is ontvangen, geldt het tijdstip
      waarop het bericht zijn systeem voor gegevensverwerking heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel16
  - number: '17'
    text: |-
      De Minister kan besluiten de elektronische aanvraag, opgave onderscheidenlijk verstrekking niet te behandelen,
      indien het elektronisch formulier geheel of gedeeltelijk is geweigerd op grond van [artikel 11][ref1].
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016525#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016525
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '18'
    text: |-
      De [Regeling landbouwtelling boomkwekerijgewassen, vaste planten en waterplanten 2001][ref1], de
      [Regeling landbouwtelling 2003][ref2], de Regeling GDI 2003 en de [Regeling elektronische indiening GDI 2003][ref3]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012862
      [ref2]: https://wetten.overheid.nl/BWBR0014885
      [ref3]: https://wetten.overheid.nl/BWBR0014886
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012862
      - id: ref2
        bwb_id: BWBR0014885
      - id: ref3
        bwb_id: BWBR0014886
  - number: '19'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling en GDI 2004.'
    url: https://wetten.overheid.nl/BWBR0016525/2004-04-01#Artikel20
