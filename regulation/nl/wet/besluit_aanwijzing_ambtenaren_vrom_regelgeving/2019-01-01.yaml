  - number: '16'
    text: |-
      De ambtenaren van de Arbeidsinspectie van het Ministerie van Sociale Zaken en Werkgelegenheid zijn mede belast met
      het toezicht op de naleving van het bepaalde bij of krachtens:

        - [hoofdstuk II van de Wet geluidhinder][ref1], voor zover het betrekking heeft op de bescherming van werknemers;
        - de [titels 9.2][ref2], [9.3][ref3] en [9.3a van de Wet milieubeheer][ref4];
        - de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
