      De directeur-generaal van Rijkswaterstaat en de door hem daartoe aangewezen onder zijn gezag werkzame ambtenaren
      van Rijkswaterstaat zijn mede belast met het toezicht op de naleving van het bepaalde bij of krachtens:

        - de [Wet bodembescherming][ref1], voor zover het betreft het bepaalde bij of krachtens
      [hoofdstuk IV, paragrafen 5.1][ref2], [5.3][ref3] en [5.4][ref4], met betrekking tot rijkswateren en het vervoer
      van stoffen die de bodem kunnen verontreinigen;
        - de [Wet milieubeheer][ref5], voor zover het betreft gevaarlijke afvalstoffen.


