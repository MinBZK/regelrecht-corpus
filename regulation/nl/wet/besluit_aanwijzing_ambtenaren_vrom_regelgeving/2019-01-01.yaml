  - number: '11'
    text: |-
      In afwijking van de [artikelen 7][ref1] en [12 tot en met 18][ref2] en
      [artikel 5.10, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref3],
      zijn ten aanzien van inrichtingen die behoren tot categorieën die zijn genoemd in
      [bijlage I, onder C, onder 29.1, onder a tot en met i, van het Besluit omgevingsrecht][ref4], en inrichtingen
      die zijn aangewezen krachtens [artikel 2.4, vierde lid, van de Wet algemene bepalingen omgevingsrecht][ref5],
      uitsluitend de door de inspecteur-generaal, de hoofddirecteur Uitvoering of de directeuren-inspecteur van het
      Inspectoraat-Generaal VROM daartoe aangewezen, onder hun bevelen werkzame ambtenaren belast met het toezicht op de
      naleving van het bepaalde bij of krachtens:

        - de [Wet algemene bepalingen omgevingsrecht][ref6];
        - de [Wet bodembescherming][ref7];
        - de [Wet geluidhinder][ref8];
        - de [Wet inzake de luchtverontreiniging][ref9];
        - de [Wet milieubeheer][ref10];
        - de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
        - de EG-verordening PRTR;
        - de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.


      [ref1]: https://wetten.overheid.nl/BWBR0017740#Artikel7
