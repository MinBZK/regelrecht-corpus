  - number: '10'
    text: |-
      De commandant en de controleurs van het Korps Militaire Controleurs Gevaarlijke Stoffen zijn mede belast met
      het toezicht op de naleving van de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen,
      de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels en het bepaalde bij of krachtens
      [titels 9.2][ref1], [9.3][ref2] en [9.3a van de Wet milieubeheer][ref3], voor zover het toezicht kan worden
      uitgeoefend in samenhang met de werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake het vervoer van
      stoffen en preparaten bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245
