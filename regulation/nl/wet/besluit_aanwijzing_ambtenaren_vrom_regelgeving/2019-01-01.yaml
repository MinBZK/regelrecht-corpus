    text: |-
      1 De directeuren-inspecteur van het Inspectoraat-Generaal VROM worden aangewezen als de ambtenaar, bedoeld in:

        - [artikel 2, onder d, van het Transactiebesluit milieudelicten][ref1];
        - de [artikelen 29, eerste lid][ref2], [31, tweede en vierde lid][ref3], [34][ref4], [40, derde lid][ref5],
      [46, derde lid][ref6], en[ 66b, tweede lid, van de Wet op de lijkbezorging][ref7].

      2 De inspecteur-generaal, de hoofddirecteur Uitvoering en de directeuren-inspecteur van het Inspectoraat-Generaal
      VROM en de onder hun bevelen werkzame ambtenaren worden aangewezen als als ambtenaren als bedoeld in:

        - [artikel 46, tweede lid, van de Wet bevordering eigenwoningbezit][ref8].


