  - number: '3'
    text: |-
      De inspecteur-generaal, de hoofddirecteur Uitvoering en de directeuren-inspecteur van het Inspectoraat-Generaal
      VROM en de door hen daartoe aangewezen, onder hun bevelen werkzame ambtenaren worden aangewezen als ambtenaren ten
      aanzien van wie, in geval van levering van leidingwater door een collectieve watervoorziening of een collectief
      leidingnet, het ten aanzien van de inspecteur in de [artikelen 35, tweede tot en met vierde lid][ref1], [36][ref2],
      [37, derde lid][ref3], [49][ref4], [51][ref5] en [52 van de Drinkwaterwet][ref6] bepaalde van toepassing is, met
      uitzondering van de gevallen bedoeld in [artikel 12][ref7].


