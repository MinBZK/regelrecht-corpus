  - number: '6'
    text: |-
      1 De directeur van de Auditdienst VROM en de onder zijn bevelen werkzame ambtenaren, met uitzondering van hen
      die meer in het bijzonder administratieve werkzaamheden uitoefenen, zijn, voor zover het betreft de onderzoeken,
      bedoeld in de [artikelen 20][ref1] en [21 van de Comptabiliteitswet 2001][ref2], en de controle, bedoeld in
      [artikel 66 van die wet][ref3], belast met het toezicht op de uitvoering en de handhaving van het bepaalde bij of
      krachtens de subsidieregelingen op het beleidsterrein van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer.

      2 In opdracht van de directeur van de Auditdienst VROM kunnen door hem aangewezen ambtenaren van auditdiensten van
      andere ministeries bij die opdracht aangegeven taken als bedoeld in het eerste lid, uitvoeren.

      3 De in het eerste en tweede lid aangewezen toezichthouders beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref4] en [5:19 van de Algemene wet bestuursrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel20
