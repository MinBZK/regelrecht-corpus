  - number: '12'
    text: |-
      De inspecteur-generaal der mijnen en de inspecteurs van het Staatstoezicht op de Mijnen worden aangewezen als
      ambtenaren ten aanzien van wie, in geval van levering van leidingwater door collectieve watervoorzieningen die
      aanwezig zijn op een mijnbouwinstallatie, aangewezen krachtens de [Mijnbouwwet][ref1], het ten aanzien van de
      inspecteur in de [artikelen 35, tweede tot en met vierde lid][ref2], [36][ref3], [37, derde lid][ref4], [49][ref5],
      [51][ref6] en [52 van de Drinkwaterwet][ref7] bepaalde van toepassing is.


