    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip waarop de wet van 22 oktober 2003 tot wijziging
      van diverse wetten in verband met de instelling van het Inspectoraat-Generaal VROM en ter verbetering van de
      doelmatigheid van gegevensverstrekking met het oog op toezicht (Stb. 2003, 449) in werking treedt.
