      De ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] zijn mede belast met het toezicht
      op de naleving van het bepaalde bij of krachtens:

        - [titel 10.7 van de Wet milieubeheer][ref2];
        - het Besluit inzameling afvalstoffen en de Regeling inzameling afvalstoffen;
        - de EG-verordening overbrenging van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003245
