  - number: '13'
    text: |-
      De inspecteur-generaal der mijnen en de inspecteurs van het Staatstoezicht op de Mijnen zijn, voor zover het
      betreft mijnbouwactiviteiten, mede belast met het toezicht op de naleving van het bepaalde bij of krachtens:

        - de [Wet algemene bepalingen omgevingsrecht][ref1];
        - de [Wet bodembescherming][ref2];
        - de [Wet explosieven voor civiel gebruik][ref3];
        - de [Wet geluidhinder][ref4];
        - de [Wet inzake de luchtverontreiniging][ref5];
        - de [Wet milieubeheer][ref6];
        - de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
        - de EG-verordening PRTR;
        - de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.


