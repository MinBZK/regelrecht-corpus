  - number: '7'
    text: |-
      De inspecteur-generaal, de hoofddirecteur Uitvoering en de directeuren-inspecteur van het Inspectoraat-
      Generaal VROM en de onder hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder
      administratieve werkzaamheden uitoefenen, zijn belast met het toezicht op de naleving van het bepaalde bij of
      krachtens:

        - de [Drinkwaterwet][ref1];
        - de [Huisvestingswet][ref2];
        - de [Wet algemene bepalingen omgevingsrecht][ref3];
        - [artikel 25a, zesde lid, onderdeel c, van de Wet belastingen op milieugrondslag][ref4];
        - de [Wet bescherming Antarctica][ref5];
        - de [Wet bevordering eigenwoningbezit][ref6];
        - de [Wet bodembescherming][ref7];
        - de [Wet explosieven voor civiel gebruik][ref8];
        - de [Wet geluidhinder][ref9];
        - de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref10];
        - de [Wet inzake de luchtverontreiniging][ref11];
        - de [Wet milieubeheer][ref12];
        - de [Wet op de openluchtrecreatie][ref13];
        - de [Wet stedelijke vernieuwing][ref14];
        - de [Woningwet][ref15], met uitzondering van de aangelegenheden
      met betrekking tot welke ingevolge de [artikelen 2][ref16] en
      __REF016___________________________________________________________________________________________________________
      ______________________ en de
      [artikelen 3 tot en met 5 van het Besluit mandaat Autoriteit woningcorporaties en WNT][ref18]
      mandaat en machtiging is verleend aan de Inspecteur-Generaal Leefomgeving en Transport, bedoeld in
      [artikel 1, tweede lid, van het Instellingbesluit Inspectie Leefomgeving en Transport][ref19];
        - de EG-verordening overbrenging van afvalstoffen;
        - de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
        - de EG-verordening PRTR;
        - de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.


