articles:
  - number: '1'
    text: |-
      1 Deze regeling vindt mede haar grondslag in de [Wet algemene bepalingen omgevingsrecht][ref1], de
      [Wet ruimtelijke ordening][ref2] en de [Wet belastingen op milieugrondslag][ref3].

      2 De directeur-inspecteur van het Inspectoraat-Generaal VROM in de betrokken regio wordt aangewezen als inspecteur
      in de zin van:

        - de [Drinkwaterwet][ref4];
        - de [Interimwet stad-en-milieubenadering][ref5];
        - het [Vuurwerkbesluit][ref6];
        - de [Wet algemene bepalingen omgevingsrecht][ref7];
        - de [Wet bodembescherming][ref8];
        - de [Wet geluidhinder][ref9];
        - de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref10];
        - de [Wet inzake de luchtverontreiniging][ref11];
        - de [Wet milieubeheer][ref12];
        - de [Wet ruimtelijke ordening][ref13];
        - de [Woningwet][ref14], met uitzondering van de aangelegenheden
      met betrekking tot welke ingevolge de [artikelen 2][ref15] en
      __REF012___________________________________________________________________________________________________________
      ______________________ en de
      [artikelen 3 tot en met 5 van het Besluit mandaat Autoriteit woningcorporaties en WNT][ref17]
      mandaat en machtiging is verleend aan de Inspecteur-Generaal Leefomgeving en Transport, bedoeld in
      [artikel 1, tweede lid, van het Instellingbesluit Inspectie Leefomgeving en Transport][ref18].


