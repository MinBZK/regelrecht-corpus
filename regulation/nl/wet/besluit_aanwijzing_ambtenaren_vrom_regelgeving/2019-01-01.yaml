  - number: '15'
    text: |-
      De ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit zijn,
      voor zover het de beleidsterreinen van dat ministerie betreft, mede belast met het toezicht op de naleving van
      het bepaalde:

        - bij of krachtens de [Wet bescherming Antarctica][ref1];
        - bij of krachtens de [Wet bodembescherming][ref2];
        - krachtens [artikel 1.2][ref3] of bij of krachtens [titels 9.2][ref4], [9.3][ref5], [9.3a][ref6] en
      [12.3 van de Wet milieubeheer][ref7];
        - de EG-verordening registratie, evaluatie, en autorisatie van chemische stoffen;
        - de EG-verordening PRTR;
        - de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.


