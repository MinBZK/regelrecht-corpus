  - number: '17'
    text: |-
      De inspecteur-generaal van de Inspectie Verkeer en Waterstaat en de door hem daartoe aangewezen onder zijn bevelen
      werkzame ambtenaren van die inspectie zijn mede belast met het toezicht op de naleving van het bepaalde bij of
      krachtens:

        - de [Wet bodembescherming][ref1], voor zover het betreft het bepaalde bij of krachtens
      [hoofdstuk IV, paragrafen 5.1][ref2], [5.3][ref3] en [5.4][ref4], met betrekking tot rijkswateren en het vervoer
      van stoffen die de bodem kunnen verontreinigen;
        - de [Wet milieubeheer][ref5], voor zover het betreft: a. gevaarlijke
      afvalstoffen, b. inrichtingen die behoren tot categorieën die zijn genoemd in
      __REF005___________________________________________________________________________________________________________
      ______________________________________________________, voor zover het toezicht kan worden uitgeoefend in samenhang
      met de werkzaamheden waartoe zij krachtens wettelijke bepalingen inzake vervoer van stoffen en preparaten bevoegd
      zijn, of c. hetgeen bepaald is bij of krachtens de [titels 9.2][ref7], [9.3][ref8], [9.3a][ref9], [11A.1][ref10] en
      [12.3][ref11] en [paragraaf 10.6.3][ref12];
        - de EG-verordening overbrenging van afvalstoffen;
        - [hoofdstuk III van de Wet explosieven voor civiel gebruik][ref13], met uitzondering van de gevallen bedoeld in
      [artikel 11][ref14];
        - de EG-verordening PRTR;
        - de EG-verordening registratie, evaluatie, en autorisatie van chemische stoffen;
        - de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.


