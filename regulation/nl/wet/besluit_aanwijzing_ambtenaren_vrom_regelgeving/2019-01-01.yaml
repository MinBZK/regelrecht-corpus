preamble:
  text: |-
    Handelende, voor zover nodig in overeenstemming met de Ministers van Defensie, van Economische Zaken, van
    Financiën, van Landbouw, Natuur en Voedselkwaliteit, van Sociale Zaken en Werkgelegenheid, van Verkeer en
    Waterstaat en van Volksgezondheid, Welzijn en Sport;

    Gelet op de Experimentenwet stad en milieu, de Huisvestingswet, de Huursubsidiewet, de Onteigeningswet, de
    Waterleidingwet, de Wet bescherming Antarctica, de Wet bevordering eigenwoningbezit, de Wet bodembescherming,
    de Wet geluidhinder, de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden, de Wet inzake de
    luchtverontreiniging, de Wet milieubeheer, de Wet milieugevaarlijke stoffen, de Wet op de lijkbezorging, de Wet
    op de openluchtrecreatie, de Wet op de Ruimtelijke Ordening, de Wet op de stads- en dorpsvernieuwing, de Wet
    stedelijke vernieuwing, de Woningwet en artikel 30, eerste lid, van de verordening (EEG) nr. 259/93 van de Raad van
    de Europese Gemeenschappen van 1 februari 1993 betreffende toezicht en controle op de overbrenging van afvalstoffen
    binnen, naar en uit de Europese Gemeenschappen (PbEG L 30), voor zover nodig juncto artikel 18.4, eerste en vierde
    lid, van de Wet milieubeheer;

    Besluit:
