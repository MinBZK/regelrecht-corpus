---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vergoedingsregeling_voor_uittreding_van_vissers_uit_de_visserij_2002
regulatory_layer: WET
publication_date: '2007-11-23'
valid_from: '2006-07-14'
bwb_id: BWBR0021774
url: https://wetten.overheid.nl/BWBR0021774/2006-07-14
preamble:
  text: |-
    Gelet op artikel 12 van verordening (EG) nr. 2792/1999 van de Raad van de Europese Unie van 17 december 1999
    tot vaststelling van de uitvoeringsbepalingen en voorwaarden voor de structurele acties van de Gemeenschap in de
    visserijsector (PbEG L 337);

    Gelet op artikel 2 en artikel 4 van de Kaderwet LNV-subsidies;

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikking SG(2002)D/230354 van 24 juni
    2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
  - number: 1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
  - number: 1.b
    text: |-
      vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij en dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het [Besluit registratie vissersvaartuigen 1998][ref2] staat geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009353
  - number: 1.c
    text: |-
      sanering: definitieve beëindiging van de visserijactiviteiten met het vissersvaartuig als bedoeld in de
      [Regeling capaciteitsvermindering zeevisserij 2005][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018732
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018732
  - number: 1.d
    text: 'visser: natuurlijke persoon die zijn hoofdberoep uitoefent aan boord van een in bedrijf zijnd vissersvaartuig;'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
  - number: 1.e
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel1
  - number: '2.1'
    text: |-
      De minister kan op aanvraag een eenmalige bijdrage verstrekken aan een visser voor de beëindiging van zijn
      beroepsactiviteit ten gevolge van:
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel2
  - number: 2.1.a
    text: de sanering van het vissersvaartuig waarop hij werkzaam is geweest, of
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel2
  - number: 2.1.b
    text: zijn vervroegde uittreding uit de zeevisserij.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel2
  - number: '2.2'
    text: |-
      De minister kan op aanvraag een eenmalige subsidie verstrekken aan een visser voor deelname aan een
      omscholingscursus in geval van beëindiging van zijn beroepsactiviteit.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel2
  - number: '3.1'
    text: |-
      Een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt slechts verstrekt aan de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 3.1.a
    text: |-
      van wie de arbeids- of maatschapsovereenkomst is beëindigd als rechtstreeks gevolg van de sanering van het
      vissersvaartuig waarop hij werkzaam is geweest;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.1.b
    text: die ten minste 12 maanden zijn beroepsactiviteit als visser op dit vissersvaartuig heeft uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.1.c
    text: |-
      die met de in onderdeel b bedoelde activiteit in de betrokken periode ten minste de helft van zijn in
      [artikel 3.1 van de Wet inkomstenbelasting 2001][ref1] bedoelde inkomen uit werk en woning heeft verdiend;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.1.d
    text: |-
      die op de datum van beëindiging van zijn arbeids- of maatschapsovereenkomst de leeftijd van 56 jaar nog niet heeft
      bereikt;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.1.e
    text: in voorkomend geval,
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.1.e.1
    text: |-
      ten aanzien van wie de maatschapsovereenkomst bepaalt dat de eigenaar van het vissersvaartuig niet gehouden is een
      bijdrage aan de visser te verstrekken wanneer hij het vissersvaartuig uit de maatschap terugtrekt of
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.1.e.2
    text: |-
      ten aanzien van wie uit de maatschapsovereenkomst voortvloeit dat de visser geen invloed heeft op de beslissing van
      de eigenaar van het vissersvaartuig dit uit de maatschap terug te trekken.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: '3.2'
    text: |-
      Van beëindiging van de arbeids- of maatschapsovereenkomst als rechtstreeks gevolg van de sanering van het
      vissersvaartuig waarop de aanvrager werkzaam is geweest, is slechts sprake indien:
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.2.a
    text: |-
      de werkgever, onderscheidenlijk de maat-eigenaar, voor deze sanering, naar aanleiding van een aanvraag, ingediend
      in de periode van 12 september tot en met 7 november 2005, een recht op subsidie heeft verkregen op grond van
      de [Regeling capaciteitsvermindering zeevisserij 2005][ref1], en heeft voldaan aan de vereisten, bedoeld in
      [artikel 8 van voornoemde regeling][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0018732
      [ref2]: https://wetten.overheid.nl/BWBR0018732#Artikel8
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018732
      - id: ref2
        bwb_id: BWBR0018732
        artikel: '8'
  - number: 3.2.b
    text: |-
      de arbeids- of maatschapsovereenkomst is beëindigd in het tijdvak beginnende op de dag van ontvangst van
      de aanvraag, bedoeld in onderdeel a, en eindigende op de dag zes maanden na het ontstaan voor de werkgever,
      onderscheidenlijk de maat-eigenaar, van het vissersvaartuig van het recht op subsidie en
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: 3.2.c
    text: |-
      de ontslagvergunning van de Centrale organisatie werk en inkomen of de schriftelijke opzegging van de
      maatschapsovereenkomst als reden voor de beëindiging van de arbeids- of maatschapsovereenkomst deze sanering
      vermeldt.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel3
  - number: '4'
    text: |-
      Een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt slechts verstrekt aan de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 4.a
    text: die zijn arbeids- of maatschapsovereenkomst beëindigt met het oog op zijn vervroegde uittreding uit de zeevisserij;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.b
    text: die op 1 januari 2006 de leeftijd van ten minste 56 jaar maar nog niet van 65 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.c
    text: die ten minste tien jaar zijn beroepsactiviteit als visser heeft uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.d
    text: |-
      die zonder onderbreking ten minste twaalf maanden werkzaam is geweest op een vissersvaartuig dat wordt gebruikt
      voor de zeevisserij, voorafgaand aan de datum:
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.d.1°
    text: |-
      waarop de aanvraag, bedoeld in [artikel 10][ref1] is ingediend, of


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel10
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '10'
  - number: 4.d.2°
    text: |-
      van beëindiging van de arbeids- of maatschapsovereenkomst, gelegen op een tijdstip in de periode van 12 september
      2005 tot en met 31 maart 2006 en er geen sprake is van toepassing van onderdeel 3°, of
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.d.3°
    text: |-
      waarop zijn arbeids- of maatschapsovereenkomst is beëindigd als rechtstreeks gevolg van de sanering van het
      vissersvaartuig waarop hij werkzaam is geweest;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.e
    text: |-
      die met de in onderdeel d bedoelde werkzaamheden in de betrokken periode de helft van zijn in
      [artikel 3.1 van de Wet inkomstenbelasting(2001][ref1] bedoelde inkomen uit werk en woning heeft verdiend;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 4.f
    text: in voorkomend geval,
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.f.1e
    text: |-
      ten aanzien van wie de maatschapsovereenkomst bepaalt dat de eigenaar van het vissersvaartuig niet gehouden is een
      bijdrage aan de visser te verstrekken wanneer hij het vissersvaartuig uit de maatschap terugtrekt of
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: 4.f.2e
    text: |-
      ten aanzien van wie uit de maatschapsovereenkomst voortvloeit dat de visser geen invloed heeft op de beslissing van
      de eigenaar van het vissersvaartuig dit uit de maatschap terug te trekken.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel4
  - number: '5'
    text: |-
      Een subsidie als bedoeld in [artikel 2, tweede lid][ref1], wordt slechts verstrekt aan de aanvrager die:


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 5.a
    text: |-
      geen bijdrage als bedoeld in [artikel 2, onderdeel a of onderdeel b][ref1], heeft verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 5.b
    text: die ten minste vijf jaar zijn beroepsactiviteit als visser heeft uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
  - number: 5.c
    text: |-
      zijn arbeids- of maatschapsovereenkomst heeft beëindigd als rechtstreeks gevolg van de sanering van
      het vissersvaartuig waarop hij werkzaam is geweest, waarvan slechts sprake is indien voldaan wordt aan
      [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel3
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '3'
  - number: 5.d
    text: op de datum van beëindiging van zijn arbeids- of maatschapsovereenkomst niet ouder is dan 55 jaar;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
  - number: 5.e
    text: |-
      een omscholingscursus volgt of heeft gevolgd die gericht is op tewerkstelling in andere economische sectoren dan
      de aanvoersector;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
  - number: 5.f
    text: |-
      de cursus heeft aangevangen binnen twaalf maanden na de datum van beëindiging van zijn arbeids- of
      maatschapsovereenkomst, en
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
  - number: 5.g
    text: een certificaat of diploma voor de betrokken cursus heeft behaald.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel5
  - number: '6'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de verstrekking van de
      bijdragen, bedoeld in [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '7.1'
    text: 'De aanvraag voor subsidieverlening kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
  - number: 7.1.a
    text: |-
      in de periode van 1 maart 2006 tot en met 31 maart 2006, voor een aanvraag als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 7.1.b
    text: |-
      in de periode van 24 juli tot en met 21 augustus 2006, voor een aanvraag als bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref1], voor zover voldaan wordt aan [artikel 4, onderdeel d, onder 2°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel4
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0021774
        artikel: '4'
  - number: '7.2'
    text: Het subsidieplafond voor de aanvraagperioden, bedoeld in het eerste lid, bedraagt € 1.800.000,–.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
  - number: '7.3'
    text: |-
      De minister verdeelt de beschikbare bedragen in volgorde van ontvangst van de aanvragen, met dien verstande dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag volledig is, als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.4'
    text: |-
      Indien door toewijzing van aanvragen met dezelfde datum van ontvangst het subsidieplafond zou worden overschreden,
      geschiedt toewijzing aan de hand van een rangschikking van de aanvragen, waarbij telkenmale de hoogst gerangschikte
      aanvraag het eerst voor toewijzing in aanmerking komt. De rangschikking vindt plaats volgens loting die geschiedt
      door een door de minister aan te wijzen notaris.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
  - number: '7.5'
    text: |-
      Voor de toepassing van het vierde lid komen uitsluitend aanvragen in aanmerking ten aanzien waarvan als datum van
      ontvangst geldt de dag waarop het subsidieplafond zou worden overschreden.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel7
  - number: '8.1'
    text: |-
      De bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], bedraagt voor de aanvrager die op de datum van
      beëindiging van zijn arbeids- of maatschapsovereenkomst niet ouder was dan 55 jaar: € 5000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '8.2'
    text: |-
      De bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], bedraagt € 500,- voor iedere kalendermaand
      gedurende de periode die aanvangt op de eerste dag van de maand waarin de arbeids- of maatschapsovereenkomst is of
      wordt beëindigd en die eindigt op de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '8.3'
    text: |-
      De subsidie, bedoeld in [artikel 2, tweede lid][ref1], is gelijk aan de werkelijke kosten van deelname aan de
      omscholingscursus, tot een maximum van € 7500,–.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '9.1'
    text: |-
      De aanvraag tot verstrekking van een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], of van
      een subsidie als bedoeld in [artikel 2, tweede lid][ref2], wordt ingediend bij de Dienst Regelingen op een daartoe
      bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '9.2'
    text: |-
      De aanvraag tot verstrekking van de in [artikel 2, eerste lid, onderdeel a][ref1], bedoelde bijdrage gaat vergezeld
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 9.2.a
    text: |-
      een kopie van de arbeids- of maatschapsovereenkomst, waaruit in elk geval blijkt de naam van de werkgever
      onderscheidenlijk de maat-eigenaar en het letterteken en nummer van het vissersvaartuig waarop de aanvrager
      werkzaam was;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: 9.2.b
    text: |-
      een ontslagvergunning van de Centrale organisatie werk en inkomen, waaruit in elk geval de periode waarin de
      ontslagaanzegging kan plaats vinden blijkt, of een schriftelijke opzegging van de maatschapsovereenkomst waaruit in
      elk geval de datum van de beëindiging van de arbeids- of maatschapsovereenkomst blijkt, en
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: 9.2.c
    text: |-
      bescheiden waaruit blijkt dat is voldaan aan de vereisten, bedoeld in
      [artikel 3, eerste lid, onderdelen b, c en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel3
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '3'
  - number: '9.3'
    text: |-
      De aanvraag tot verstrekking van de in [artikel 2, tweede lid][ref1], bedoelde subsidie gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 9.3.a
    text: bewijzen dat de kosten van de omscholingscursus zijn voldaan en
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: 9.3.b
    text: een afschrift van het certificaat of diploma.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: '9.4'
    text: |-
      De minister beslist op de aanvraag en geeft binnen acht weken na ontvangst van alle ingevolge het tweede of derde
      lid vereiste gegevens een beschikking omtrent verstrekking van de in het eerste lid bedoelde bijdrage of subsidie.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: '9.5'
    text: |-
      In afwijking van het derde lid, aanhef en onderdeel b, wordt, indien de cursus nog niet is afgerond, het afschrift
      van het diploma of certificaat aan de Dienst Regelingen verzonden, zodra dit is verkregen, maar in ieder geval voor
      1 september 2008.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel9
  - number: '10.1'
    text: |-
      De aanvraag tot verstrekking van een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt
      ingediend bij de Dienst Regelingen op een daartoe bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '10.2'
    text: 'De in het eerste lid bedoelde aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
  - number: 10.2.a
    text: |-
      een kopie van de arbeids- of maatschapsovereenkomst, waaruit in elk geval blijkt de naam van de werkgever
      onderscheidenlijk de maat-eigenaar en het letterteken en nummer van het vissersvaartuig waarop de aanvrager
      werkzaam is;
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
  - number: 10.2.b
    text: |-
      bescheiden waaruit blijkt dat de aanvrager heeft voldaan aan de vereisten, bedoeld in
      [artikel 4, onderdelen b, c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel4
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '4'
  - number: '10.3'
    text: |-
      De minister beslist op de aanvraag en geeft binnen acht weken na ontvangst van alle ingevolge het vorig lid
      vereiste gegevens een beschikking omtrent verstrekking van de in het eerste lid bedoelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
  - number: '10.4'
    text: |-
      De ontvanger van de in het eerste lid bedoelde bijdrage toont binnen een termijn van drie maanden na de beschikking
      tot verstrekking van de bijdrage ten genoegen van de minister aan dat hij zijn werkzaamheden als visser definitief
      heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
  - number: '10.5'
    text: |-
      De ontvanger van de in het eerste lid bedoelde bijdrage is verplicht desgevraagd aanvullende gegevens terstond
      te verschaffen.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
  - number: '10.6'
    text: |-
      Binnen acht weken na ontvangst van de gegevens, bedoeld in het vierde lid, stelt de minister de bijdrage als
      bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '11.1'
    text: 'Het is de ontvanger van een bijdrage of subsidie verboden zijn beroepsactiviteit als visser te hervatten:'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel11
  - number: 11.1.a
    text: |-
      binnen een jaar na uitkering van de bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 11.1.b
    text: |-
      binnen vijf jaar na uitkering van de subsidie, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '11.2'
    text: |-
      De ontvanger van een bijdrage of subsidie als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], is verplicht
      ten genoege van de minister aan te tonen dat hij zijn werkzaamheden als visser niet heeft hervat. Daartoe verstrekt
      hij aan de Dienst Regelingen jaarlijks vóór 31 maart op een daartoe bestemd formulier een overzicht van zijn
      inkomsten uit werk en woning of socialezekerheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '2'
  - number: '12'
    text: |-
      Een aanvraag tot verstrekking van een bijdrage of subsidie op grond van deze regeling wordt afgewezen indien de
      aanvrager reeds eerder een bijdrage of subsidie op grond van deze regeling, de Vergoedingsregeling voor uittreding
      van vissers uit de visserij, de [Vergoedingsregeling voor uittreding van vissers uit de visserij 2003][ref1] of de
      [Regeling capaciteitsvermindering zeevisserij 2005][ref2] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0016104
      [ref2]: https://wetten.overheid.nl/BWBR0018732
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016104
      - id: ref2
        bwb_id: BWBR0018732
  - number: '13'
    text: Het vastgestelde bedrag van de bijdrage of subsidie wordt in één gedeelte uitbetaald.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel13
  - number: '14'
    text: |-
      Indien toepassing wordt gegeven [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of aan
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de terugvordering tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: 14a.1
    text: |-
      Indien het subsidieplafond, bedoeld in [artikel 7, tweede lid][ref1], wordt overschreden, kan de minister besluiten
      het bedrag, bedoeld in [artikel 2, eerste lid, onderdeel b][ref2], te verlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0021774
        artikel: '2'
  - number: 14a.2
    text: De betrokken aanvrager wordt van het besluit bedoeld in het eerste lid, op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14a
  - number: 14a.3
    text: |-
      De betrokken aanvrager kan zijn aanvraag intrekken, indien het besluit bedoeld in het eerste lid, wordt genomen.
      Hij doet hiervan melding aan de Dienst Regelingen binnen vier weken na de kennisgeving bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14a
  - number: 14b.1
    text: Subsidie wordt verleend onder voorbehoud van goedkeuring door de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14b
  - number: 14b.2
    text: |-
      De beslissing tot verlening van subsidie kan worden ingetrokken of gewijzigd indien dit noodzakelijk is in verband
      met het verkrijgen van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling of het
      uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14b
  - number: 14c
    text: |-
      Op subsidies die voor de periode, bedoeld in [artikel 7, eerste lid][ref1], zijn verleend of vastgesteld, blijft
      deze regeling van toepassing zoals deze luidde op het moment dat de subsidie werd verleend of vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel7
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0021774
        artikel: '7'
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Vergoedingsregeling voor uittreding van vissers uit de visserij 2002.'
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel15
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0021774/2006-07-14#Artikel16
