        bwb_id: BWBR0009353
  - number: '2'
    text: |-
      1 De minister kan op aanvraag een eenmalige bijdrage verstrekken aan een visser voor de beëindiging van zijn
      beroepsactiviteit ten gevolge van:

      a. de sanering van het vissersvaartuig waarop hij werkzaam is geweest, of

      b. zijn vervroegde uittreding uit de zeevisserij.

      2 De minister kan op aanvraag een eenmalige subsidie verstrekken aan een visser voor deelname aan een
      omscholingscursus in geval van beëindiging van zijn beroepsactiviteit.
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel2
  - number: '3'
    text: |-
      1 Een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt slechts verstrekt aan de aanvrager:

      a. van wie de arbeids- of maatschapsovereenkomst is beëindigd als rechtstreeks gevolg van de sanering van het
      vissersvaartuig waarop hij werkzaam is geweest;

      b. die ten minste 12 maanden zijn beroepsactiviteit als visser op dit vissersvaartuig heeft uitgeoefend;

      c. die met de in onderdeel b bedoelde activiteit in de betrokken periode ten minste de helft van zijn in
      [artikel 3.1 van de Wet inkomstenbelasting 2001][ref2] bedoelde inkomen uit werk en woning heeft verdiend;

      d. die op de datum van beëindiging van zijn arbeids- of maatschapsovereenkomst de leeftijd van 65 jaar nog niet
      heeft bereikt;

      e. in voorkomend geval,

      1° ten aanzien van wie de maatschapsovereenkomst bepaalt dat de eigenaar van het vissersvaartuig niet gehouden is
      een bijdrage aan de visser te verstrekken wanneer hij het vissersvaartuig uit de maatschap terugtrekt of

      2° ten aanzien van wie uit de maatschapsovereenkomst voortvloeit dat de visser geen invloed heeft op de beslissing
      van de eigenaar van het vissersvaartuig dit uit de maatschap terug te trekken.

      2 Van beëindiging van de arbeids- of maatschapsovereenkomst als rechtstreeks gevolg van de sanering van het
      vissersvaartuig waarop de aanvrager werkzaam is geweest, is slechts sprake indien:

      a. de werkgever, onderscheidenlijk de maat-eigenaar, voor deze sanering naar aanleiding van een aanvraag,
      ingediend in de periode van 19 september tot en met 15 november 1999 respectievelijk 1 januari tot 1 maart 2001,
      een recht op subsidie heeft verkregen en heeft voldaan aan de vereisten, bedoeld in artikel 7 van de Regeling
      capaciteitsvermindering zeevisserij,

      b. de arbeids- of maatschapsovereenkomst is beëindigd in het tijdvak beginnende op de dag van ontvangst van
      de aanvraag, bedoeld in onderdeel a, en eindigende op de dag vijf maanden na het ontstaan voor de werkgever,
      onderscheidenlijk de maat-eigenaar, van het vissersvaartuig van het recht op subsidie en

      c. de ontslagvergunning van de Regionaal directeur voor de Arbeidsvoorziening of de schriftelijke opzegging van
      de maatschapsovereenkomst als reden voor de beëindiging van de arbeids- of maatschapsovereenkomst deze sanering
      vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel3
    references:
