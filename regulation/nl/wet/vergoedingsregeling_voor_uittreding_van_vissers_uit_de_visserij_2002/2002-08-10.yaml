  - number: '12'
    text: |-
      Een aanvraag tot verstrekking van een bijdrage of subsidie op grond van deze regeling wordt afgewezen indien de
      aanvrager reeds eerder een bijdrage of subsidie op grond van deze regeling is verstrekt.
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel12
  - number: '13'
    text: |-
      De minister bepaalt bij een in de Staatscourant bekend te maken besluit per aanvraagperiode in hoeveel gedeelten
      het bedrag van de bijdrage of subsidie wordt betaald. Indien het bedrag van de bijdrage of subsidie in gedeelten
      wordt betaald, stelt de minister vast op welke wijze de gedeelten worden berekend en op welke tijdstippen zij
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel13
  - number: '14'
    text: |-
      Indien toepassing wordt gegeven [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of aan
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de terugvordering tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel14
    references:
