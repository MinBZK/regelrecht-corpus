  - number: '10'
    text: |-
      1 De aanvraag tot verstrekking van een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt
      ingediend bij LASER op een daartoe bestemd formulier.

      2 De in het eerste lid bedoelde aanvraag gaat vergezeld van:

      a. een kopie van de arbeids- of maatschapsovereenkomst, waaruit in elk geval blijkt de naam van de werkgever
      onderscheidenlijk de maat-eigenaar en het letterteken en nummer van het vissersvaartuig waarop de aanvrager
      werkzaam is;

      b. bescheiden waaruit blijkt dat de aanvrager heeft voldaan aan de vereisten, bedoeld in
      [artikel 4, onderdelen b, c, d en e][ref2].

      2 De minister beslist op de aanvraag en geeft binnen acht weken na ontvangst van alle ingevolge het vorig lid
      vereiste gegevens een beschikking omtrent verstrekking van de in het eerste lid bedoelde bijdrage.

      3 De ontvanger van de in het eerste lid bedoelde bijdrage toont binnen een termijn van drie maanden na de
      beschikking tot verstrekking van de bijdrage ten genoegen van de minister aan dat hij zijn werkzaamheden als visser
      definitief heeft beëindigd.

      4 De ontvanger van de in het eerste lid bedoelde bijdrage is verplicht desgevraagd aanvullende gegevens terstond
      te verschaffen.

      5 Binnen acht weken na ontvangst van alle gegevens geeft de minister een beschikking omtrent vaststelling van de in
      het eerste lid bedoelde bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel4
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel10
