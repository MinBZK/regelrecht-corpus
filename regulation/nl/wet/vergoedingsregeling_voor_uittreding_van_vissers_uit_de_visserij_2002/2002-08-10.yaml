        artikel: '4'
  - number: '11'
    text: |-
      1 Het is de ontvanger van een bijdrage of subsidie verboden zijn beroepsactiviteit als visser te hervatten:

      a. binnen een jaar na uitkering van de bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1];

      b. binnen vijf jaar na uitkering van de subsidie, bedoeld in [artikel 2, tweede lid][ref2].

      2 De ontvanger van een bijdrage of subsidie als bedoeld in [artikel 2, eerste lid, onderdeel b][ref3], is verplicht
      ten genoege van de minister aan te tonen dat hij zijn werkzaamheden als visser niet heeft hervat. Daartoe verstrekt
      hij aan LASER jaarlijks vóór 31 maart op een daartoe bestemd formulier een overzicht van zijn inkomsten uit werk en
      woning of socialezekerheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel11
    references:
