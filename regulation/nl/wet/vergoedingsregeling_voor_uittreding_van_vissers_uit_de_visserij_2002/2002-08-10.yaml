  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Vergoedingsregeling voor uittreding van vissers uit de visserij 2002.'
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel15
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel16
