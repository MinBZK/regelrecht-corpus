        artikel: '2'
  - number: '6'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de verstrekking van de
      bijdragen, bedoeld in [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel6
    references:
