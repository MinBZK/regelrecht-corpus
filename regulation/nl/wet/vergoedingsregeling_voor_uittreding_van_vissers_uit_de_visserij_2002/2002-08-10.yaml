  - number: '5'
    text: |-
      Een subsidie als bedoeld in [artikel 2, tweede lid][ref1], wordt slechts verstrekt aan de aanvrager die:

      a. geen bijdrage als bedoeld in [artikel 2, onderdeel a of onderdeel b][ref2], heeft verkregen;

      b. die ten minste vijf jaar zijn beroepsactiviteit als visser heeft uitgeoefend;

      c. op de datum van beëindiging van zijn arbeids- of maatschapsovereenkomst niet ouder is dan 55 jaar;

      d. een omscholingscursus volgt of heeft gevolgd die gericht is op tewerkstelling in andere economische sectoren dan
      de aanvoersector;

      e. de cursus heeft aangevangen binnen zes maanden na de datum van beëindiging van zijn arbeids- of
      maatschapsovereenkomst, en

      f. een certificaat of diploma voor de betrokken cursus heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel5
