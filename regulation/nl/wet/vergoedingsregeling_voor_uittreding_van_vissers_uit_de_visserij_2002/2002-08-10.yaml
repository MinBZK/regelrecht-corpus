        artikel: '3.1'
  - number: '4'
    text: |-
      Een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt slechts verstrekt aan de aanvrager:

      a. die zijn arbeids- of maatschapsovereenkomst beëindigt met het oog op zijn vervroegde uittreding uit de
      zeevisserij;

      b. die op de datum van beëindiging van de arbeids- of maatschapsovereenkomst de leeftijd van ten minste 55 jaar
      maar nog niet van 65 jaar heeft bereikt;

      c. die ten minste tien jaar zijn beroepsactiviteit als visser heeft uitgeoefend;

      d. die zonder onderbreking ten minste 12 maanden voorafgaand aan de datum waarop de aanvraag, bedoeld in
      [artikel 9][ref2], is ingediend, werkzaam is geweest op een vissersvaartuig dat wordt gebruikt voor de zeevisserij;

      e. die met de in onderdeel d bedoelde werkzaamheden in de betrokken periode de helft van zijn in
      [artikel 3.1 van de Wet inkomstenbelasting(2001][ref3] bedoelde inkomen uit werk en woning heeft verdiend;

      f. in voorkomend geval,

      1e ten aanzien van wie de maatschapsovereenkomst bepaalt dat de eigenaar van het vissersvaartuig niet gehouden is
      een bijdrage aan de visser te verstrekken wanneer hij het vissersvaartuig uit de maatschap terugtrekt of

      2e ten aanzien van wie uit de maatschapsovereenkomst voortvloeit dat de visser geen invloed heeft op de beslissing
      van de eigenaar van het vissersvaartuig dit uit de maatschap terug te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel4
