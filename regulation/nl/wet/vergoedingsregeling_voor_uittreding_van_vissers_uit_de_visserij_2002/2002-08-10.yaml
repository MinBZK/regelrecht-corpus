preamble:
  text: |-
    Gelet op artikel 12 van verordening (EG) nr. 2792/1999 van de Raad van de Europese Unie van 17 december 1999
    tot vaststelling van de uitvoeringsbepalingen en voorwaarden voor de structurele acties van de Gemeenschap in de
    visserijsector (PbEG L 337);

    Gelet op artikel 2 en artikel 4 van de Kaderwet LNV-subsidies;

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikking SG(2002)D/230354 van 24 juni
    2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuurbeheer en Visserij;

      b. directeur: directeur Visserij van het Ministerie van Landbouw, Natuurbeheer en Visserij;

      c. vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij en dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het [Besluit registratie vissersvaartuigen 1998][ref2] staat geregistreerd;

      d. sanering: definitieve beëindiging van de visserijactiviteiten met het vissersvaartuig in de wateren van de
      Europese Unie in de zin van de Regeling capaciteitsvermindering zeevisserij;

      e. visser: natuurlijke persoon die zijn hoofdberoep uitoefent aan boord van een in bedrijf zijnd vissersvaartuig;

      f. LASER: Dienst Landelijke Service bij Regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel1
    references:
