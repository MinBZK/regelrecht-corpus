        artikel: 4:5
  - number: '8'
    text: |-
      1 De bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], bedraagt voor de aanvrager die op de datum
      van beëindiging van zijn arbeids- of maatschapsovereenkomst:

      a. niet ouder was dan 35 jaar: € 5.000,-;

      b. ouder was dan 35 jaar maar niet ouder dan 55 jaar: € 7.350,-;

      c. ouder was dan 55 jaar maar jonger dan 65 jaar, € 185,- voor iedere kalendermaand gedurende de periode die
      aanvangt op de eerste dag van de maand waarin de arbeids- of maatschapsoverkomst wordt beëindigd en die eindigt op
      de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt met dien verstande dat de totale bijdrage per
      aanvrager niet meer dan € 10.000,- bedraagt.

      2 De bijdrage, bedoeld in [artikel 2, eerste lid, onderdeel b][ref2], bedraagt € 500,- voor iedere kalendermaand
      gedurende de periode die aanvangt op de eerste dag van de maand waarin de arbeids- of maatschapsovereenkomst wordt
      beëindigd en die eindigt op de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt.

      3 De subsidie, bedoeld in [artikel 2, tweede lid][ref3], is gelijk aan de werkelijke kosten van deelname aan de
      omscholingscursus, tot een maximum van € 2.500,-.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021774#Artikel2
    url: https://wetten.overheid.nl/BWBR0021774/2002-08-10#Artikel8
