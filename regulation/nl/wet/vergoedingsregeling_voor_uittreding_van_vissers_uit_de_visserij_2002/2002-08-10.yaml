  - number: '9'
    text: |-
      1 De aanvraag tot verstrekking van een bijdrage als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], of
      van een subsidie als bedoeld in [artikel 2, tweede lid][ref2], wordt ingediend bij LASER op een daartoe bestemd
      formulier.

      2 De aanvraag tot verstrekking van de in [artikel 2, eerste lid, onderdeel a][ref3], bedoelde bijdrage gaat
      vergezeld van:

      a. een kopie van de arbeids- of maatschapsovereenkomst, waaruit in elk geval blijkt de naam van de werkgever
      onderscheidenlijk de maat-eigenaar en het letterteken en nummer van het vissersvaartuig waarop de aanvrager
      werkzaam was;

      b. een ontslagvergunning van de Regionaal Directeur voor de Arbeidsvoorziening, waaruit in elk geval de periode
      waarin de ontslagaanzegging kan plaats vinden blijkt, of een schriftelijke opzegging van de maatschapsovereenkomst
      waaruit in elk geval de datum van de beëindiging van de arbeids- of maatschapsovereenkomst blijkt, en

      c. bescheiden waaruit blijkt dat is voldaan aan de vereisten, bedoeld in
      [artikel 3, eerste lid, onderdelen b, c en d][ref4].

      2 De aanvraag tot verstrekking van de in [artikel 2, tweede lid][ref5], bedoelde subsidie gaat vergezeld van:

      a. bewijzen dat de kosten van de omscholingscursus zijn voldaan en

      b. een afschrift van het certificaat of diploma.

      3 De minister beslist op de aanvraag en geeft binnen acht weken na ontvangst van alle ingevolge het tweede of derde
      lid vereiste gegevens een beschikking omtrent verstrekking van de in het eerste lid bedoelde bijdrage of subsidie.

      4 In afwijking van het derde lid, aanhef en onderdeel b, wordt, indien de cursus nog niet is afgerond, het
      afschrift van het diploma of certificaat aan LASER gezonden zodra dit is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021774#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0021774#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0021774#Artikel2
