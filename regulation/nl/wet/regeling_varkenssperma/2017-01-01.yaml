---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_varkenssperma
regulatory_layer: WET
publication_date: '2021-04-16'
valid_from: '2017-01-01'
bwb_id: BWBR0012617
url: https://wetten.overheid.nl/BWBR0012617/2017-01-01
preamble:
  text: |-
    Gelet op Richtlijn nr. 90/429/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling
    van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van
    varkens en de invoer daarvan (PbEG L 224);

    Gelet op artikel 17 van de Gezondheids- en welzijnswet voor dieren, op artikel 2, onderdeel b, van het Besluit
    uitvoer dieren en produkten van dierlijke oorsprong en op de artikelen 3, derde lid, 4, tweede lid, en 7 van het
    Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.a
    text: 'besluit: Besluit eisen dierlijk sperma en spermawincentra;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.b
    text: 'Minister: Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.c
    text: 'NVWA: Nederlandse Voedsel- en Warenautoriteit;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.d
    text: 'keuringsdierenarts: dierenarts verbonden aan de NVWA;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.e
    text: 'winning: hoeveelheid sperma die op een bepaald moment van een donor is verkregen;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.f
    text: 'dierenarts van het centrum: dierenarts verbonden aan het erkende spermawincentrum;'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: 1.1.g
    text: |-
      quarantaineruimte: door de Minister voor de toepassing van deze regeling erkende afzonderingsruimte waarin zich
      slechts varkens bevinden die tenminste dezelfde gezondheidsstatus bezitten.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
  - number: '1.2'
    text: |-
      Deze regeling berust mede op
      [artikel 2, onderdeel c, van het Besluit uitvoer dieren en produkten van dierlijke oorsprong][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006427#Artikel2
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006427
        artikel: '2'
  - number: '2.1'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, van [richtlijn 90/429/EEG](31990L0429), voorziet
      de eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger in het opstellen van:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel2
  - number: 2.1.a
    text: |-
      voorschriften inzake: - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in
      contact komt met het sperma of met het donordier;
        - het winnen, bewerken en opslaan van sperma;
        - de reiniging en ontsmetting van de in [artikel 5][ref1] bedoelde ruimten en voorzieningen;
        - de toegang tot de werkruimten, en
        - de wijze van kleding van personeel en bezoekers;


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: 2.1.b
    text: |-
      een productieprotocol, waarin voor alle in [artikel 5][ref1] bedoelde ruimten en voorzieningen, de
      productieprocessen chronologisch en gedetailleerd beschreven zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: 2.1.c
    text: |-
      een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      De eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger zorgt dat het personeel
      zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en de daarop gebaseerde interne procedures
      en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte uitvoering van de
      werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde instructies.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel2
  - number: '3'
    text: |-
      Van voortdurend toezicht van een dierenarts van het centrum als bedoeld in Bijlage A, Hoofdstuk I, punt 1, van
      [richtlijn 90/429/EEG](31990L0429) is sprake, indien die dierenarts overeenkomstig de krachtens [artikel 2][ref1]
      vastgestelde procedures en protocollen erop toeziet dat de voorschriften van [richtlijn 90/429/EEG](31990L0429) in
      acht worden genomen en dat door betrokkenen de krachtens [artikel 2][ref2] vastgestelde procedures en protocollen
      correct worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012617#Artikel2
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012617
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: 'Aan Bijlage A, Hoofdstuk I, punt 3, van [richtlijn 90/429/EEG](31990L0429) is voldaan, indien:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de gebouwen van het varkensspermawincentrum zijn gelegen op een minimale afstand van 100 meter van de gebouwen
      behorend bij overige bedrijven waar varkens worden gehouden;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel4
  - number: 4.1.b
    text: |-
      het varkensspermawincentrum zodanig is omheind, dat vrije toegang tot het varkensspermawincentrum niet mogelijk
      is, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel4
  - number: 4.1.c
    text: |-
      voor het personeel en de bezoekers op het varkensspermawincentrum een hygiënesluis gesitueerd is, zodanig dat
      zij deze passeren alvorens zij in de in [artikel 5, eerste lid, onderdeel a, b, c en g][ref1], bedoelde ruimten
      betreden. De hygiënesluis is voorzien van omkleed-, douchefaciliteiten en van een toilet. Schone bedrijfskleding en
      laarzen zijn in de hygiënesluis aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      De eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger draagt ervoor zorg dat
      het personeel en de bezoekers zich douchen en zich kleden met schone bedrijfskleding en laarzen voordat zij de in
      [artikel 5, eerste lid, onderdeel a, b, c, en g][ref1], bedoelde ruimten betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Aan Bijlage A, Hoofdstuk I, punt 2, 3 en 4, van [richtlijn 90/429/EEG](31990L0429) is voldaan, indien het
      varkensspermawincentrum binnen de kadastrale eenheden waarop het varkensspermawincentrum is gesitueerd, de
      beschikking heeft over:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.a
    text: |-
      een stalruimte voor de dagelijkse huisvesting en verzorging van de varkens, die op effiiënte wijze fysiek is
      afgesloten van de overige ruimten binnen het varkensspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.b
    text: |-
      een stalruimte voor de tijdelijke afzondering van varkens die wegens veterinaire redenen van productie
      zijn uitgesloten, die op efficiënte wijze fysiek is afgesloten van de overige ruimten binnen het
      varkensspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een voor het winnen van sperma ingerichte ruimte, die zich bevindt in de in onderdeel a bedoelde stalruimte dan
      wel in een afzonderlijke hiertoe bestemde ruimte, die op efficiënte wijze fysiek is afgesloten van de overige
      ruimten binnen het varkensspermawincentrum en waarvan zich in de directe omgeving faciliteiten voor de reiniging en
      ontsmetting van de bij de spermaverkrijging te gebruiken voorzieningen bevinden;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.d
    text: een voorziening voor de reiniging en ontsmetting van de gebruikte materialen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.e
    text: |-
      voor varkens ontoegankelijke ruimten voor de opslag van voer, kleding en medicijnen alsmede voor de bij de
      verkrijging, bewerking en opslag van sperma te gebruiken materialen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.f
    text: |-
      een aan- en afvoervoorziening voor beren, die op efficiënte wijze fysiek is afgesloten van de overige ruimten van
      het varkensspermawincentrum en die uitsluitend wordt gebruikt ten behoeve van de aan- en afvoer van varkens;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.g
    text: |-
      een ruimte voor de behandeling van sperma, die op efficiënte wijze van de overige ruimten binnen het
      varkensspermawincentrum is geïsoleerd, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: 5.1.h
    text: |-
      een ruimte voor de opslag en distributie van sperma, die op efficiënte wijze van de overige ruimten binnen het
      varkensspermawincentrum is geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid kunnen de onder g en h bedoelde ruimten zich bevinden op een afzonderlijke
      kadastrale eenheid.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
  - number: '5.3'
    text: |-
      In de in het tweede lid bedoelde situatie is [artikel 4][ref1] op deze ruimten van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel4
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '4'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2, van [richtlijn 90/429/EEG]
      (31990L0429) zijn de in het varkensspermawincentrum aanwezige beren, onverminderd de krachtens het
      [Besluit identificatie en registratie van dieren][ref1] gestelde regels, voorzien van een onverbrekelijk met
      het dier verbonden, goed leesbaar nummer aan de hand waarvan de betrokken beer individueel geïdentificeerd kan
      worden en beschikt het varkensspermawincentrum over een door de keuringsdierenarts vanuit één plaats op het
      varkensspermawincentrum te raadplegen register, dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat
      daaruit te allen tijde op eenvoudige wijze met betrekking tot elk varken kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 6.1.a
    text: het ras;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.c
    text: het identificatienummer;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.d
    text: gegevens inzake de uitgevoerde vaccinaties;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.e
    text: gegevens uit het ziekte/gezondheidsdossier;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.f
    text: de datum van toelating op het varkensspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.g
    text: de quarantaineruimte dan wel het varkensspermawincentrum van waaruit het varken afkomstig is;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.h
    text: |-
      de beslagen of bedrijven waar het varken voordat het in de in onderdeel g bedoelde ruimte werd binnengebracht,
      heeft verbleven, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.1.i
    text: |-
      de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende de in Bijlage B van
      [richtlijn 90/429/EEG](31990L0429) voorgeschreven tests.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: '6.2'
    text: De in het eerste lid bedoelde gegevens worden tot één jaar na afvoer van het betrokken varken bewaard.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: '6.3'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 6, onderdeel g, van [richtlijn 90/429/EEG]
      (31990L0429), zijn op de verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.3.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.3.b
    text: de datum waarop het sperma verkregen is;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.3.c
    text: het identificatienummer van de beer waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: 6.3.d
    text: het identificatienummer van het varkensspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel6
  - number: '7'
    text: |-
      Als laboratorium bedoeld in Bijlage B, Hoofdstuk I, punt 2, en in Bijlage B, Hoofdstuk II, punt 2, van [richtlijn
      90/429/EEG](31990L0429) wordt aangewezen Wageningen Bioveterinary Research, te Lelystad.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel7
  - number: '8.1'
    text: |-
      De op het varkensspermawincentrum aanwezige vrouwelijke varkens voldoen aan Bijlage B van [richtlijn 90/429/EEG]
      (31990L0429).
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van het op het varkensspermawincentrum verkregen en opgeslagen sperma wordt voldaan aan Bijlage A en
      Bijlage C van [richtlijn 90/429/EEG](31990L0429).
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel8
  - number: '9.1'
    text: 'Bij de aanvraag om erkenning van een varkensspermawincentrum worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
  - number: 9.1.a
    text: de naam, het adres en de vestigingsplaats van het varkensspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
  - number: 9.1.b
    text: |-
      het aan het varkensspermawincentrum krachtens het [Besluit identificatie en registratie van dieren][ref1]
      uitgegeven uniek bedrijfsnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 9.1.c
    text: |-
      een plattegrond van kadastrale eenheden waarop het varkensspermawincentrum is gesitueerd, waarbij is aangegeven: -
      de afscheiding ten opzichte van de directe omgeving;
        - de afstand en de aard van de omliggende bedrijven, en
        - de ligging van de in [artikel 5, eerste lid][ref1], van deze regeling bedoelde ruimten en voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.d
    text: |-
      voor zover de in [artikel 5, eerste lid, onder g en h][ref1], bedoelde voorzieningen niet zijn gelegen op de
      kadastrale eenheden waarop het varkensspermawincentrum is gesitueerd, de naam, het adres en de vestigingsplaats van
      deze voorzieningen, en


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.e
    text: de naam van de dierenarts van het centrum.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een aanvraag om erkenning als bedoeld in
      [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel15
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '15'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      De erkenning wordt door de minister verleend, nadat uit een door de keuringsdierenarts ingesteld onderzoek is
      gebleken, dat voldaan wordt aan de in [artikel 3, tweede lid, van het besluit][ref1] bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
  - number: '10.2'
    text: |-
      De minister neemt gelijktijdig met de verlening van de erkenning, bedoeld in het eerste lid, een besluit omtrent de
      aanvraag om erkenning, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel15
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '15'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      De keuringsdierenarts is belast met de in Bijlage A, Hoofdstuk II, punt 3, van [richtlijn 90/429/EEG](31990L0429)
      bedoelde controle.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel11
  - number: '11.2'
    text: |-
      De eigenaar of de exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger draagt er zorg voor
      dat de keuringsdierenarts alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken
      in het kader van de in het eerste lid bedoelde controle noodzakelijk acht en dat diens aanwijzingen ter zake door
      de dierenarts en het personeel van het centrum worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de in
      [artikel 3, tweede lid, van het besluit][ref1] bedoelde voorschriften niet worden nageleefd dan wel dat niet
      voldaan wordt aan [artikel 11, tweede lid][ref2], en [artikel 14][ref3], doch niet dan nadat gedurende een
      redelijke termijn gelegenheid is gegeven de voor het behoud van de erkenning noodzakelijke voorzieningen te
      treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012617#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0012617#Artikel14
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012617
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012617
        artikel: '14'
        paragraaf: '3'
  - number: '12.2'
    text: 'De minister schorst de verleende erkenning, indien:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.2.a
    text: |-
      een of meer van de krachtens Bijlage B, Hoofdstuk II van [richtlijn 90/429/EEG](31990L0429) uit te voeren
      routinetests een positief resultaat heeft opgeleverd;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.2.b
    text: |-
      het varkensspermawincentrum is gelegen in een gebied waarvoor beperkingen gelden op grond van de communautaire
      regelgeving inzake besmettelijke ziekten bij varkens dan wel op grond van Hoofdstuk II, Afdeling 3, van de wet, of
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.2.c
    text: het varkensspermawincentrum de status vrij van ziekte van Aujeszky verliest.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: '12.3'
    text: 'De in het tweede lid bedoelde schorsing wordt opgeheven:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.3.a
    text: |-
      voorzover deze het gevolg was van de in het tweede lid, onder a, bedoelde omstandigheid, indien de
      gezondheidsstatus van het varkensspermawincentrum is hersteld;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.3.b
    text: |-
      voorzover deze het gevolg was van de in het tweede lid, onder b, bedoelde omstandigheid, indien de in dat onderdeel
      bedoelde beperkingen zijn opgeheven, of
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: 12.3.c
    text: |-
      voorzover deze het gevolg was van de in het tweede lid, onder c, bedoelde omstandigheid, indien 30 dagen verstreken
      zijn, nadat het varkensspermawincentrum de status vrij van ziekte van Aujeszky heeft herkregen.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien de erkenning ingevolge dit artikel is ingetrokken of is geschorst, kan de minister gelasten dat het in de
      door hem vast te stellen periode direct voorafgaand aan de intrekking of schorsing aanwezige of gewonnen sperma,
      in tijdelijke afzondering wordt geplaatst dan wel wordt vernietigd, met inachtneming van diens aanwijzingen, zonder
      vergoeding van Staatswege en voor rekening van de exploitant van het varkensspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: '12.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op van andere varkensspermawincentra afkomstig sperma dat
      is behandeld of opgeslagen in de in [artikel 5, eerste lid, onder g en h][ref1], bedoelde ruimten van het
      varkensspermawincentrum, waarvan de erkenning is geschorst of is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel5
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '5'
        paragraaf: '2'
  - number: '12.6'
    text: |-
      Onverminderd het eerste lid wordt de erkenning ingetrokken indien niet voldaan wordt aan de krachtens het vierde
      lid gelaste maatregelen.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel12
  - number: '13'
    text: |-
      Een varkensspermawincentrum waarvan de erkenning werd ingetrokken of waarvan een aanvraag voor het opnieuw
      verlenen van de erkenning werd afgewezen en dat weer voor erkenning in aanmerking wenst te komen, moet opnieuw een
      aanvraag indienen, de gegevens, bedoeld in [artikel 9][ref1], opnieuw verstrekken en tevens kunnen aantonen, dat de
      omstandigheden welke tot de intrekking dan wel de afwijzing hebben geleid, zijn opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel9
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '9'
        paragraaf: '3'
  - number: '14'
    text: |-
      Een erkend varkensspermawincentrum stelt de minister in kennis van elke wijziging van de bij de oorspronkelijke
      aanvraag verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel14
  - number: '15.1'
    text: |-
      Een quarantaineruimte als bedoeld in Bijlage B, Hoofdstuk I, van [richtlijn 90/429/EEG](31990L0429) wordt na een
      daartoe strekkende aanvraag door de minister erkend, nadat uit een door de keuringsdierenarts ingesteld onderzoek
      is gebleken dat voldaan wordt aan [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel16
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '16'
        paragraaf: '3'
  - number: '15.2'
    text: Aan een erkende quarantaineruimte wordt in verband met de erkenning een registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
  - number: '15.3'
    text: 'Bij de aanvraag om erkenning van een quarantaineruimte worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
  - number: 15.3.a
    text: de naam, het adres en de vestigingsplaats van de quarantaineruimte;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
  - number: 15.3.b
    text: |-
      het aan de quarantaineruimte krachtens het [Besluit identificatie en registratie van dieren][ref1] uitgegeven uniek
      bedrijfsnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 15.3.c
    text: |-
      een plattegrond van kadastrale eenheden waarop de quarantaineruimte is gesitueerd, waarbij is aangegeven: -
      afscheiding ten opzichte van de directe omgeving;
        - afstand en aard van de omliggende bedrijven, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
  - number: 15.3.d
    text: de naam van de aan de quarantaineruimte verbonden dierenarts.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
  - number: '15.4'
    text: |-
      De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de van toepassing
      zijnde voorschriften van [artikel 16][ref1] niet worden nageleefd, doch niet dan nadat gedurende een redelijke
      termijn gelegenheid is gegeven, de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel16
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '16'
        paragraaf: '3'
  - number: '16'
    text: 'Een erkende quarantaineruimte voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.a
    text: |-
      de gebouwen van de quarantaineruimte zijn gelegen op een minimale afstand van 100 meter van de gebouwen behorend
      bij overige bedrijven waar varkens worden gehouden;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.b
    text: de quarantaineruimte is zodanig omheind, dat vrije toegang tot de quarantaineruimte niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.c
    text: |-
      voor het personeel en de bezoekers is een hygiënesluis aanwezig die zodanig gesitueerd is, dat zij deze passeren
      alvorens zij de quarantaineruimte betreden. De hygiënesluis is voorzien van omkleed- en douchefaciliteiten. Schone
      bedrijfskleding en laarzen zijn in de hygiënesluis aanwezig;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.d
    text: |-
      de quarantaineruimte beschikt over: - een stalruimte voor de dagelijkse huisvesting en verzorging van de varkens
      die op efficiënte wijze fysiek is afgesloten van de overige ruimten van de quarantaineruimte; - een lokaal voor de
      reiniging en ontsmetting van de gebruikte materialen, en
        - voor varkens ontoegankelijke ruimten voor de opslag van stro, voer, kleding en medicijnen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.e
    text: |-
      de quarantaineruimte voldoet aan de relevante voorschriften van Bijlage B, Hoofdstuk I, van [richtlijn 90/429/
      EEG](31990L0429);
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.f
    text: |-
      de eigenaar of exploitant van de quarantaineruimte dan wel diens vertegenwoordiger draagt ervoor zorg dat het
      personeel en de bezoekers zich douchen en zich kleden met schone bedrijfskleding en laarzen voordat zij de
      quarantaineruimte betreden;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.g
    text: |-
      de quarantaineruimte beschikt over een door de keuringsdierenarts vanuit één plaats op de quarantaineruimte te
      raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige wijze met betrekking tot elk varken kan worden afgeleid: - het identificatienummer;
        - gegevens inzake de uitgevoerde vaccinaties;
        - gegevens uit het ziekte/gezondheidsdossier;
        - de datum van toelating op de quarantaineruimte;
        - de beslagen of bedrijven van waaruit het varken afkomstig is, en
        - de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende de in Bijlage B,
      Hoofdstuk I, onderdelen 1.3, 1.4, 1.5.1 en 1.5.2 van [richtlijn 90/429/EEG](31990L0429) voorgeschreven tests, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: 16.h
    text: |-
      de keuringsdierenarts wordt in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a tot
      en met g, praktisch in de gelegenheid gesteld de werkzaamheden van de quarantaineruimte te controleren.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel16
  - number: '17'
    text: |-
      Het in [artikel 4, eerste lid, van het besluit][ref1] bedoelde calamiteitenplan bevat ten minste voorschriften
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel4
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '4'
  - number: 17.a
    text: |-
      de onverwijlde interne melding aan de dierenarts van het centrum van afwijkingen van de wettelijke voorschriften en
      de daarop gebaseerde interne procedures;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel17
  - number: 17.b
    text: |-
      het onverwijld melden aan de keuringsdierenarts van mogelijke verdenking van ingevolge
      [artikel 15 van de wet][ref1] aangewezen ziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: 17.c
    text: |-
      het uitoefenen van de interne controle op de naleving van de relevante wettelijke voorschriften en de daarop
      gebaseerde interne procedures, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel17
  - number: 17.d
    text: |-
      de wijze van optreden bij incidenten, ongevallen en afwijkingen van de geldende regels, alsmede de evaluatie en
      rapportage hierover aan de eigenaar of exploitant van het varkensspermawincentrum dan wel diens vertegenwoordiger
      alsmede aan de dierenarts van het centrum.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel17
  - number: '18.1'
    text: |-
      De eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger beschikt over een vanuit
      één plaats op het varkensspermawincentrum te raadplegen register, dat dagelijks wordt bijgehouden en dat zodanig is
      ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking elke winning kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.a
    text: het aan de winning toegekende identificatienummer;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.c
    text: de lichaamstemperatuur van de beer;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.d
    text: de eventuele calamiteiten die zich bij het verkrijgen van het sperma hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.e
    text: het identificatienummer van de beer waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: 18.1.f
    text: de doses waarin de winning is verdeeld.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: '18.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden tot één jaar nadat de laatste dosis van de betrokken winning van het
      varkensspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel18
  - number: '19'
    text: |-
      De eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      administratie waarmee de keuringsdierenarts op elk moment een overzicht kan worden geboden van het sperma dat
      in het varkensspermawincentrum gewonnen dan wel opgeslagen is, en die de tracering van contacten tussen het
      varkensspermawincentrum met inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma
      inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel19
  - number: '20.1'
    text: |-
      De in [artikel 19][ref1] bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze
      met betrekking tot elke transactie kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel19
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '19'
        paragraaf: '4'
  - number: 20.1.a
    text: de datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: 20.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: 20.1.c
    text: het ontvangen of afgeleverde aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: 20.1.d
    text: naam en adres van de ontvanger of de leverancier;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: 20.1.e
    text: het registratienummer van het varkensspermawincentrum waar het sperma gewonnen is, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: 20.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel b][ref1], of in
      [artikel 9.6, derde lid, onderdeel b, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '20.2'
    text: |-
      De in het eerste lid, bedoelde gegevens worden tot één jaar na afvoer van het varken waarvan het sperma afkomstig
      is, bewaard.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel20
  - number: '21'
    text: |-
      Behoudens indien het sperma bestemd is om overeenkomstig de Regeling handel levende dieren en levende producten
      buiten Nederland te worden gebracht, gaat een partij sperma bij afvoer van de kadastrale eenheid, waarop het
      varkensspermawincentrum is gelegen, vergezeld van een geleidebiljet, waarop met betrekking tot de partij de
      volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.a
    text: de datum van afvoer;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.c
    text: het identificatienummer van de beer waarvan het sperma is gewonnen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.d
    text: het afgeleverde aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.e
    text: de naam en het adres van de ontvanger, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: 21.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het gezondheidscertificaat, bedoeld in artikel
      9.5, onderdeel b, of in artikel 9.6, derde lid, onderdeel b, van de Regeling handel levende dieren en levende
      producten, alsmede de datum waarop dit sperma binnen Nederland is gebracht.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het is de eigenaar of exploitant van een varkensspermawincentrum dan wel diens vertegenwoordiger uitsluitend
      toegestaan varkenssperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in
      [artikel 6, derde lid][ref1], bedoelde gegevens zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel6
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '6'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Onverminderd het eerste lid is het de eigenaar of exploitant van een varkensspermawincentrum dan wel diens
      vertegenwoordiger uitsluitend toegestaan varkenssperma voorhanden te hebben, in voorraad te hebben, te bewaren, op
      te slaan, te gebruiken, te ontvangen of af te leveren, indien hij door middel van de ingevolge onderhavige regeling
      bijgehouden administraties aannemelijk kan maken dat het sperma afkomstig is van één varken.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel22
  - number: '23.1'
    text: |-
      Degene die varkenssperma vervoert of verhandelt, beschikt over een administratie waarmee de keuringsdierenarts
      op elk moment een overzicht kan worden geboden van het sperma dat hij in voorraad heeft of heeft gehad en die de
      tracering van contacten met het varkensspermawincentrum waar het sperma gewonnen is alsmede met inseminatoren,
      dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel23
  - number: '23.2'
    text: |-
      [Artikel 20][ref1] is op de in het eerste lid bedoelde administratie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel20
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '20'
        paragraaf: '4'
  - number: '24'
    text: |-
      Behoudens indien het sperma bestemd is om overeenkomstig de Regeling handel levende dieren en levende producten
      buiten Nederland te worden gebracht, is een partij sperma gedurende het vervoer en de verhandeling voorzien van het
      in [artikel 21][ref1] bedoelde geleidebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel21
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '21'
        paragraaf: '4'
  - number: '25.1'
    text: |-
      Het is uitsluitend toegestaan varkenssperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan,
      te gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de
      navolgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: 25.1.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: 25.1.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: 25.1.c
    text: het identificatienummer van de beer waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: 25.1.d
    text: het identificatienummer van het varkensspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: '25.2'
    text: |-
      Onverminderd het eerste lid is het uitsluitend toegestaan varkenssperma voorhanden te hebben, in voorraad te
      hebben, te bewaren, op te slaan, te gebruiken, te ontvangen of af te leveren, indien door middel van de ingevolge
      onderhavige regeling bijgehouden administraties aannemelijk gemaakt kan worden dat het sperma afkomstig is van
      één varken.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel25
  - number: '26.1'
    text: |-
      Degene die ingevolge deze regeling gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die deze ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      De op het tijdstip van inwerkingtreding van deze regeling ingevolge
      [artikel 9.10 van de Regeling handel levende dieren en levende producten][ref1], zoals dit luidde voor het tijdstip
      van inwerkingtreding van de regeling, erkende varkensspermawincentra, worden voor de duur van twaalf maanden na
      inwerkingtreding van deze regeling voorlopig erkend als varkensspermawincentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '27.2'
    text: |-
      Niet ingevolge de in het eerste lid bedoelde bepaling erkende varkensspermawincentra worden, onder de voorwaarde
      dat een daartoe strekkende volledige aanvraag als bedoeld in [artikel 15][ref1] binnen drie maanden na
      inwerkingtreding van deze regeling is ingediend, voor de duur van zes maanden na inwerkingtreding van deze regeling
      voorlopig erkend als varkensspermawincentrum of tot zoveel eerder als op die aanvraag onherroepelijk zal zijn
      besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel15
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '15'
        paragraaf: '3'
  - number: '27.3'
    text: |-
      Quarantaineruimten worden, onder de voorwaarde dat een daartoe strekkende volledige aanvraag als bedoeld in
      [artikel 15][ref1] binnen drie maanden na inwerkingtreding van deze regeling is ingediend, voor de duur van zes
      maanden na inwerkingtreding van deze regeling voorlopig erkend als quarantaineruimte of tot zoveel eerder als op
      die aanvraag onherroepelijk zal zijn besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012617#Artikel15
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012617
        artikel: '15'
        paragraaf: '3'
  - number: '30'
    text: Regeling verbod gebruik mengsperma wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel30
  - number: '31'
    text: Deze regeling treedt in werking met ingang van 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel31
  - number: '32'
    text: 'Deze regeling wordt aangehaald als: Regeling varkenssperma.'
    url: https://wetten.overheid.nl/BWBR0012617/2017-01-01#Artikel32
