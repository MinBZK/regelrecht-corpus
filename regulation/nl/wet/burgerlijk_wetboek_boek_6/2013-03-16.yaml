regulatory_layer: WET
publication_date: '2025-10-09'
valid_from: '2013-03-16'
bwb_id: BWBR0005289
url: https://wetten.overheid.nl/BWBR0005289/2013-03-16
articles:
  - number: '1'
    text: Verbintenissen kunnen slechts ontstaan, indien dit uit de wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel1
  - number: '2.1'
    text: |-
      Schuldeiser en schuldenaar zijn verplicht zich jegens elkaar te gedragen overeenkomstig de eisen van redelijkheid
      en billijkheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel2
  - number: '2.2'
    text: |-
      Een tussen hen krachtens wet, gewoonte of rechtshandeling geldende regel is niet van toepassing, voor zover dit in
      de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel2
  - number: '3.1'
    text: Een natuurlijke verbintenis is een rechtens niet- afdwingbare verbintenis.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel3
  - number: '3.2'
    text: 'Een natuurlijke verbintenis bestaat:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel3
  - number: 3.2.a
    text: wanneer de wet of een rechtshandeling aan een verbintenis de afdwingbaarheid onthoudt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel3
  - number: 3.2.b
    text: |-
      wanneer iemand jegens een ander een dringende morele verplichting heeft van zodanige aard dat naleving daarvan,
      ofschoon rechtens niet afdwingbaar, naar maatschappelijke opvattingen als voldoening van een aan die ander
      toekomende prestatie moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel3
  - number: '4'
    text: |-
      Op natuurlijke verbintenissen zijn de wettelijke bepalingen betreffende verbintenissen van overeenkomstige
      toepassing, tenzij de wet of haar strekking meebrengt dat een bepaling geen toepassing mag vinden op een niet-
      afdwingbare verbintenis.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel4
  - number: '5.1'
    text: |-
      Een natuurlijke verbintenis wordt omgezet in een rechtens afdwingbare door een overeenkomst van de schuldenaar met
      de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel5
  - number: '5.2'
    text: |-
      Een door de schuldenaar tot de schuldeiser gericht aanbod tot een zodanige overeenkomst om niet, geldt als
      aanvaard, wanneer het aanbod ter kennis van de schuldeiser is gekomen en deze het niet onverwijld heeft afgewezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel5
  - number: '5.3'
    text: Op de overeenkomst zijn de bepalingen betreffende schenkingen en giften niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel5
  - number: '6.1'
    text: |-
      Is een prestatie door twee of meer schuldenaren verschuldigd, dan zijn zij ieder voor een gelijk deel verbonden,
      tenzij uit wet, gewoonte of rechtshandeling voortvloeit dat zij voor ongelijke delen of hoofdelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel6
  - number: '6.2'
    text: |-
      Is de prestatie ondeelbaar of vloeit uit wet, gewoonte of rechtshandeling voort dat de schuldenaren ten aanzien van
      een zelfde schuld ieder voor het geheel aansprakelijk zijn, dan zijn zij hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel6
  - number: '6.3'
    text: |-
      Uit een overeenkomst van een schuldenaar met zijn schuldeiser kan voortvloeien dat, wanneer de schuld op twee of
      meer rechtsopvolgers overgaat, dezen voor ongelijke delen of hoofdelijk verbonden zullen zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel6
  - number: '7.1'
    text: |-
      Indien twee of meer schuldenaren hoofdelijk verbonden zijn, heeft de schuldeiser tegenover ieder van hen recht op
      nakoming voor het geheel.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel7
  - number: '7.2'
    text: |-
      Nakoming door een der schuldenaren bevrijdt ook zijn medeschuldenaren tegenover de schuldeiser. Hetzelfde geldt,
      wanneer de schuld wordt gedelgd door inbetalinggeving of verrekening, alsmede wanneer de rechter op vordering van
      een der schuldenaren [artikel 60][ref1] toepast, tenzij hij daarbij anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel60
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '60'
        afdeling: '8'
  - number: '8'
    text: |-
      Op de rechtsbetrekkingen tussen de hoofdelijke schuldenaren onderling is [artikel 2][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel2
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '2'
        afdeling: '1'
  - number: '9.1'
    text: |-
      Iedere hoofdelijke schuldenaar is bevoegd namens de overige schuldenaren een aanbod tot afstand om niet van het
      vorderingsrecht te aanvaarden, voor zover de afstand ook de andere schuldenaren betreft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel9
  - number: '9.2'
    text: |-
      Uitstel van betaling, door de schuldeiser aan een der schuldenaren verleend, werkt ook ten aanzien van zijn
      medeschuldenaren, voor zover blijkt dat dit de bedoeling van de schuldeiser is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel9
  - number: '10.1'
    text: |-
      Hoofdelijke schuldenaren zijn, ieder voor het gedeelte van de schuld dat hem in hun onderlinge verhouding aangaat,
      verplicht overeenkomstig de volgende leden in de schuld en in de kosten bij te dragen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel10
  - number: '10.2'
    text: |-
      De verplichting tot bijdragen in de schuld die ten laste van een der hoofdelijke schuldenaren wordt gedelgd voor
      meer dan het gedeelte dat hem aangaat, komt op iedere medeschuldenaar te rusten voor het bedrag van dit meerdere,
      telkens tot ten hoogste het gedeelte van de schuld dat de medeschuldenaar aangaat.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel10
  - number: '10.3'
    text: |-
      In door een hoofdelijke schuldenaar in redelijkheid gemaakte kosten moet iedere medeschuldenaar bijdragen naar
      evenredigheid van het gedeelte van de schuld dat hem aangaat, tenzij de kosten slechts de schuldenaar persoonlijk
      betreffen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel10
  - number: '11.1'
    text: |-
      Een uit hoofde van het vorige artikel tot bijdragen aangesproken medeschuldenaar kan de verweermiddelen die hij op
      het tijdstip van het ontstaan van de verplichting tot bijdragen jegens de schuldeiser had, ook inroepen tegen de
      hoofdelijke schuldenaar die de bijdrage van hem verlangt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel11
  - number: '11.2'
    text: |-
      Niettemin kan hij een zodanig verweermiddel niet tegen deze schuldenaar inroepen, indien het na hun beider
      verbintenis is ontstaan uit een rechtshandeling die de schuldeiser met of jegens de aangesprokene heeft verricht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel11
  - number: '11.3'
    text: |-
      Een beroep op verjaring van de rechtsvordering van de schuldeiser komt de tot bijdragen aangesprokene slechts toe,
      indien op het tijdstip van het ontstaan van de verplichting tot bijdragen zowel hijzelf als degene die de bijdrage
      verlangt, jegens de schuldeiser de voltooiing van de verjaring had kunnen inroepen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel11
  - number: '11.4'
    text: |-
      De vorige leden zijn slechts van toepassing, voor zover uit de rechtsverhouding tussen de schuldenaren niet anders
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel11
  - number: '12.1'
    text: |-
      Wordt de schuld ten laste van een hoofdelijke schuldenaar gedelgd voor meer dan het gedeelte dat hem aangaat,
      dan gaan de rechten van de schuldeiser jegens de medeschuldenaren en jegens derden krachtens subrogatie voor dit
      meerdere op die schuldenaar over, telkens tot ten hoogste het gedeelte dat de medeschuldenaar of de derde aangaat
      in zijn verhouding tot die schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel12
  - number: '12.2'
    text: |-
      Door de subrogatie wordt de vordering, indien zij een andere prestatie dan geld betrof, omgezet in een
      geldvordering van gelijke waarde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel12
  - number: '13.1'
    text: |-
      Blijkt verhaal op een hoofdelijke schuldenaar voor een vordering als bedoeld in de [artikelen 10][ref1]
      en [12][ref2] geheel of gedeeltelijk onmogelijk, dan wordt het onverhaalbaar gebleken deel over al zijn
      medeschuldenaren omgeslagen naar evenredigheid van de gedeelten waarvoor de schuld ieder van hen in hun onderlinge
      verhouding aanging.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel12
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '12'
        afdeling: '2'
  - number: '13.2'
    text: |-
      Werd de schuld geheel of gedeeltelijk gedelgd ten laste van een hoofdelijke schuldenaar wie de schuld zelf niet
      aanging en blijkt op geen van de medeschuldenaren wie de schuld wel aanging verhaal mogelijk, dan wordt het
      onverhaalbaar gebleken deel over alle medeschuldenaren wie de schuld niet aanging, omgeslagen naar evenredigheid
      van de bedragen waarvoor ieder op het tijdstip van de delging van de schuld jegens de schuldeiser aansprakelijk
      was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel13
  - number: '13.3'
    text: |-
      Ieder der in een omslag betrokkenen blijft gerechtigd het bijgedragene alsnog van hem die geen verhaal bood, terug
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel13
  - number: '14'
    text: |-
      Afstand door de schuldeiser van zijn vorderingsrecht jegens een hoofdelijke schuldenaar bevrijdt deze niet van
      zijn verplichting tot bijdragen. De schuldeiser kan hem niettemin van zijn verplichting tot bijdragen jegens een
      medeschuldenaar bevrijden door zich jegens deze laatste te verbinden zijn vordering op hem te verminderen met het
      bedrag dat als bijdrage gevorderd had kunnen worden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel14
  - number: '15.1'
    text: |-
      Is een prestatie aan twee of meer schuldeisers verschuldigd, dan heeft ieder van hen een vorderingsrecht voor een
      gelijk deel, tenzij uit wet, gewoonte of rechtshandeling voortvloeit dat de prestatie hun voor ongelijke delen
      toekomt of dat zij gezamenlijk één vorderingsrecht hebben.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel15
  - number: '15.2'
    text: |-
      Is de prestatie ondeelbaar of valt het recht daarop in een gemeenschap, dan hebben zij gezamenlijk één
      vorderingsrecht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel15
  - number: '15.3'
    text: |-
      Aan de schuldenaar kan niet worden tegengeworpen dat het vorderingsrecht in een gemeenschap valt, wanneer dit recht
      voortspruit uit een overeenkomst die hij met de deelgenoten heeft gesloten, maar hij niet wist noch behoefde te
      weten dat dit recht van die gemeenschap ging deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel15
  - number: '16'
    text: |-
      Wanneer met de schuldenaar is overeengekomen dat twee of meer personen als schuldeiser de prestatie van hem
      voor het geheel kunnen vorderen, des dat de voldoening aan de een hem ook jegens de anderen bevrijdt, doch
      in de onderlinge verhouding van die personen de prestatie niet aan hen allen gezamenlijk toekomt, zijn op hun
      rechtsverhouding jegens de schuldenaar de in geval van gemeenschap geldende regels van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel16
  - number: '17.1'
    text: |-
      Een verbintenis is alternatief, wanneer de schuldenaar verplicht is tot één van twee of meer verschillende
      prestaties ter keuze van hemzelf, van de schuldeiser of van een derde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel17
  - number: '17.2'
    text: De keuze komt toe aan de schuldenaar, tenzij uit wet, gewoonte of rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel17
  - number: '18'
    text: Een alternatieve verbintenis wordt enkelvoudig door het uitbrengen van de keuze door de daartoe bevoegde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel18
  - number: '19.1'
    text: |-
      Wanneer de keuze aan een der partijen toekomt, gaat de bevoegdheid om te kiezen op de andere partij over, indien
      deze haar wederpartij een redelijke termijn heeft gesteld tot bepaling van haar keuze en deze daarbinnen haar keuze
      niet heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel19
  - number: '19.2'
    text: |-
      De bevoegdheid om te kiezen gaat echter niet over op de schuldeiser voordat deze het recht heeft om nakoming te
      vorderen, noch op de schuldenaar voordat deze het recht heeft om te voldoen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel19
  - number: '19.3'
    text: |-
      Indien op de vordering een pandrecht of een beslag rust en de aangevangen executie bij gebreke van een keuze niet
      kan worden voortgezet, kan de pandhouder of de beslaglegger aan beide partijen een redelijke termijn stellen om
      overeenkomstig hun onderlinge rechtsverhouding een keuze uit te brengen. Indien de keuze niet binnen deze termijn
      geschiedt, gaat de bevoegdheid tot kiezen op de pandhouder of beslaglegger over. Zij zijn gehouden niet nodeloos
      van deze bevoegdheid gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel19
  - number: '20.1'
    text: De onmogelijkheid om een of meer der prestaties te verrichten doet geen afbreuk aan de bevoegdheid om te kiezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel20
  - number: '20.2'
    text: |-
      Indien de keuze aan de schuldenaar toekomt, is deze echter niet bevoegd een onmogelijke prestatie te kiezen, tenzij
      de onmogelijkheid een gevolg is van een aan de schuldeiser toe te rekenen oorzaak of deze met de keuze instemt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel20
  - number: '21'
    text: |-
      Een verbintenis is voorwaardelijk, wanneer bij rechtshandeling haar werking van een toekomstige onzekere
      gebeurtenis afhankelijk is gesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel21
  - number: '22'
    text: |-
      Een opschortende voorwaarde doet de werking der verbintenis eerst met het plaatsvinden der gebeurtenis aanvangen;
      een ontbindende voorwaarde doet de verbintenis met het plaatsvinden der gebeurtenis vervallen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel22
  - number: '23.1'
    text: |-
      Wanneer de partij die bij de niet-vervulling belang had, de vervulling heeft belet, geldt de voorwaarde als
      vervuld, indien redelijkheid en billijkheid dit verlangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel23
  - number: '23.2'
    text: |-
      Wanneer de partij die bij de vervulling belang had, deze heeft teweeggebracht, geldt de voorwaarde als niet
      vervuld, indien redelijkheid en billijkheid dit verlangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel23
  - number: '24.1'
    text: |-
      Nadat een ontbindende voorwaarde is vervuld, is de schuldeiser verplicht de reeds verrichte prestaties ongedaan te
      maken, tenzij uit de inhoud of strekking van de rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel24
  - number: '24.2'
    text: |-
      Strekt de verplichting tot ongedaanmaking tot teruggave van een goed, dan komen de na de vervulling van de
      voorwaarde afgescheiden natuurlijke of opeisbaar geworden burgerlijke vruchten aan de schuldenaar toe en zijn de
      [artikelen 120-124 van Boek 3][ref1] van overeenkomstige toepassing met betrekking tot hetgeen daarin is bepaald
      omtrent de vergoeding van kosten en van schade, voor zover die kosten en die schade na de vervulling zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
  - number: '25'
    text: |-
      Is een krachtens een verbintenis onder opschortende voorwaarde verschuldigde prestatie vóór de vervulling van de
      voorwaarde verricht, dan kan overeenkomstig [afdeling 2 van titel 4][ref1] ongedaanmaking van de prestatie worden
      gevorderd, zolang de voorwaarde niet in vervulling is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '2'
  - number: '26'
    text: |-
      Op voorwaardelijke verbintenissen zijn de bepalingen betreffende onvoorwaardelijke verbintenissen van toepassing,
      voor zover het voorwaardelijk karakter van de betrokken verbintenis zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel26
  - number: '27'
    text: |-
      Hij die een individueel bepaalde zaak moet afleveren, is verplicht tot de aflevering voor deze zaak zorg te dragen
      op de wijze waarop een zorgvuldig schuldenaar dit in de gegeven omstandigheden zou doen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel27
  - number: '28'
    text: |-
      Indien de verschuldigde zaak of zaken slechts zijn bepaald naar de soort en binnen de aangeduide soort verschil in
      kwaliteit bestaat, mag hetgeen de schuldenaar aflevert, niet beneden goede gemiddelde kwaliteit liggen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel28
  - number: '29'
    text: De schuldenaar is zonder toestemming van de schuldeiser niet bevoegd het verschuldigde in gedeelten te voldoen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel29
  - number: '30.1'
    text: |-
      Een verbintenis kan door een ander dan de schuldenaar worden nagekomen, tenzij haar inhoud of strekking zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel30
  - number: '30.2'
    text: |-
      De schuldeiser komt niet in verzuim, indien hij een door een derde aangeboden voldoening weigert met goedvinden van
      de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel30
  - number: '31'
    text: |-
      Betaling aan een onbekwame schuldeiser bevrijdt de schuldenaar, voor zover het betaalde de onbekwame tot werkelijk
      voordeel heeft gestrekt of in de macht is gekomen van diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel31
  - number: '32'
    text: |-
      Betaling aan een ander dan de schuldeiser of dan degene die met hem of in zijn plaats bevoegd is haar te ontvangen,
      bevrijdt de schuldenaar, voor zover degene aan wie betaald moest worden de betaling heeft bekrachtigd of erdoor
      is gebaat.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel32
  - number: '33'
    text: |-
      Is de betaling gedaan in weerwil van een beslag of terwijl de schuldeiser wegens een beperkt recht, een bewind of
      een soortgelijk beletsel onbevoegd was haar te ontvangen, en wordt de schuldenaar deswege genoodzaakt opnieuw te
      betalen, dan heeft hij verhaal op de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel33
  - number: '34.1'
    text: |-
      De schuldenaar die heeft betaald aan iemand die niet bevoegd was de betaling te ontvangen, kan aan degene aan
      wie betaald moest worden, tegenwerpen dat hij bevrijdend heeft betaald, indien hij op redelijke gronden heeft
      aangenomen dat de ontvanger der betaling als schuldeiser tot de prestatie gerechtigd was of dat uit anderen hoofde
      aan hem moest worden betaald.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel34
  - number: '34.2'
    text: |-
      Indien iemand zijn recht om betaling te vorderen verliest, in dier voege dat het met terugwerkende kracht aan
      een ander toekomt, kan de schuldenaar een inmiddels gedane betaling aan die ander tegenwerpen, tenzij hetgeen hij
      omtrent dit verlies kon voorzien, hem van de betaling had behoren te weerhouden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel34
  - number: '35.1'
    text: |-
      Is in geval van betaling door een derde te zijnen aanzien aan de vereiste van één der leden van het vorige artikel
      voldaan, dan kan hij te zijnen behoeve de bevrijdende werking van die betaling inroepen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel35
  - number: '35.2'
    text: |-
      De schuldenaar kan de bevrijdende werking van die betaling te zijnen behoeve inroepen, indien, bij betaling door
      hemzelf, ook wat hem betreft aan die vereisten zou zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel35
  - number: '36'
    text: |-
      In de gevallen, bedoeld in de twee voorgaande artikelen, heeft de ware gerechtigde verhaal op degene die de
      betaling zonder recht heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel36
  - number: '37'
    text: |-
      De schuldenaar is bevoegd de nakoming van zijn verbintenis op te schorten, indien hij op redelijke gronden twijfelt
      aan wie de betaling moet geschieden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel37
  - number: '38'
    text: |-
      Indien geen tijd voor de nakoming is bepaald, kan de verbintenis terstond worden nagekomen en kan terstond nakoming
      worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel38
  - number: '39.1'
    text: |-
      Is wel een tijd voor de nakoming bepaald, dan wordt vermoed dat dit slechts belet dat eerdere nakoming wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel39
  - number: '39.2'
    text: Betaling vóór de vervaldag geldt niet als onverschuldigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel39
  - number: '40'
    text: 'De schuldenaar kan de tijdsbepaling niet meer inroepen:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel40
  - number: 40.a
    text: |-
      wanneer hij in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel40
  - number: 40.b
    text: wanneer hij in gebreke blijft de door hem toegezegde zekerheid te verschaffen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel40
  - number: 40.c
    text: |-
      wanneer door een aan hem toe te rekenen oorzaak de voor de vordering gestelde zekerheid verminderd is, tenzij het
      overgeblevene nog een voldoende waarborg voor de voldoening oplevert.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel40
  - number: '41'
    text: 'Indien geen plaats voor de nakoming is bepaald, moet de aflevering van een verschuldigde zaak geschieden:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel41
  - number: 41.a
    text: 'in geval van een individueel bepaalde zaak: ter plaatse waar zij zich bij het ontstaan van de verbintenis bevond;'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel41
  - number: 41.b
    text: |-
      in geval van een naar de soort bepaalde zaak: ter plaatse waar de schuldenaar zijn beroep of bedrijf uitoefent of,
      bij gebreke daarvan, zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel41
  - number: '42'
    text: |-
      Hij die ter nakoming van een verbintenis een zaak heeft afgeleverd waarover hij niet bevoegd was te beschikken,
      kan vorderen dat deze wordt afgegeven aan degene aan wie zij toekomt, mits hij tegelijkertijd een andere, aan de
      verbintenis beantwoordende zaak aanbiedt en het belang van de schuldeiser zich niet tegen teruggave verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel42
  - number: '43.1'
    text: |-
      Verricht de schuldenaar een betaling die zou kunnen worden toegerekend op twee of meer verbintenissen jegens een
      zelfde schuldeiser, dan geschiedt de toerekening op de verbintenis welke de schuldenaar bij de betaling aanwijst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel43
  - number: '43.2'
    text: |-
      Bij gebreke van zodanige aanwijzing geschiedt de toerekening in de eerste plaats op de opeisbare verbintenissen.
      Zijn er ook dan nog meer verbintenissen waarop de toerekening zou kunnen plaatsvinden, dan geschiedt deze in de
      eerste plaats op de meest bezwarende en zijn de verbintenissen even bezwarend, op de oudste. Zijn de verbintenissen
      bovendien even oud, dan geschiedt de toerekening naar evenredigheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel43
  - number: '44.1'
    text: |-
      Betaling van een op een bepaalde verbintenis toe te rekenen geldsom strekt in de eerste plaats in mindering van de
      kosten, vervolgens in mindering van de verschenen rente en ten slotte in mindering van de hoofdsom en de lopende
      rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel44
  - number: '44.2'
    text: |-
      De schuldeiser kan, zonder daardoor in verzuim te komen, een aanbod tot betaling weigeren, indien de schuldenaar
      een andere volgorde voor de toerekening aanwijst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel44
  - number: '44.3'
    text: |-
      De schuldeiser kan volledige aflossing van de hoofdsom weigeren, indien daarbij niet tevens de verschenen en
      lopende rente alsmede de kosten worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel44
  - number: '45'
    text: |-
      Slechts met toestemming van de schuldeiser kan een schuldenaar zich van zijn verbintenis bevrijden door een andere
      prestatie dan de verschuldigde, al mocht zij van gelijke of zelfs hogere waarde zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel45
  - number: '46.1'
    text: |-
      Wanneer de schuldeiser een cheque, postcheque, overschrijvingsorder of een ander hem bij wijze van betaling
      aangeboden papier in ontvangst neemt, wordt vermoed dat dit geschiedt onder voorbehoud van goede afloop.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel46
  - number: '46.2'
    text: |-
      Is de schuldeiser bevoegd de nakoming van een op hem rustende verplichting tot het tijdstip van de betaling op te
      schorten, dan behoudt hij dit opschortingsrecht totdat zekerheid van goede afloop bestaat of door hem had kunnen
      worden verkregen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel46
  - number: '47.1'
    text: De kosten van betaling komen ten laste van degene die de verbintenis nakomt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel47
  - number: '47.2'
    text: De kosten van een kwitantie komen ten laste van degene ten behoeve van wie het stuk wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel47
  - number: '48.1'
    text: |-
      De schuldeiser is verplicht voor iedere voldoening een kwitantie af te geven, tenzij uit overeenkomst, gewoonte of
      billijkheid anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel48
  - number: '48.2'
    text: |-
      Indien de schuldeiser een ter zake van de schuld afgegeven bewijsstuk heeft, kan de schuldenaar bij voldoening
      bovendien de afgifte van dat bewijsstuk vorderen, tenzij de schuldeiser een redelijk belang heeft bij het behoud
      van het stuk en daarop de nodige aantekening tot bewijs van de bevrijding van de schuldenaar stelt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel48
  - number: '48.3'
    text: |-
      De schuldenaar kan de nakoming van zijn verbintenis opschorten, indien de schuldeiser niet voldoet aan het
      voorschrift van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel48
  - number: '49.1'
    text: |-
      Bij voldoening van een vordering aan toonder of order kan de schuldenaar eisen dat een kwijting op het papier wordt
      gesteld en dat hem het papier wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel49
  - number: '49.2'
    text: |-
      Indien de voldoening niet de gehele vordering betreft of de schuldeiser het papier nog voor de uitoefening van
      andere rechten nodig heeft, kan hij het papier behouden, mits hij naast de kwijting die op het papier is gesteld,
      tevens een afzonderlijke kwijting afgeeft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel49
  - number: '49.3'
    text: |-
      Hij kan, ongeacht of geheel of gedeeltelijk voldaan wordt volstaan met de enkele afgifte van een kwijting, mits hij
      op verlangen van de wederpartij aantoont dat het papier vernietigd of waardeloos geworden is, of zekerheid stelt
      voor twintig jaren of een zoveel kortere tijdsduur als verwacht mag worden dat de wederpartij nog aan een vordering
      uit hoofde van het papier bloot zal kunnen staan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel49
  - number: '49.4'
    text: |-
      De schuldenaar kan de nakoming van zijn verbintenis opschorten, indien de schuldeiser niet aan de vorige leden
      voldoet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel49
  - number: '50.1'
    text: |-
      Moeten op achtereenvolgende tijdstippen gelijksoortige prestaties worden verricht, dan leveren de kwitanties van
      twee achtereenvolgende termijnen het vermoeden op dat ook de vroegere termijnen zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel50
  - number: '50.2'
    text: |-
      Indien de schuldeiser een kwitantie afgeeft voor de hoofdsom, wordt vermoed dat ook de rente en de kosten zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel50
  - number: '51.1'
    text: |-
      Wanneer uit de wet voortvloeit dat iemand verplicht is tot het stellen van zekerheid of dat het stellen van
      zekerheid voorwaarde is voor het intreden van enig rechtsgevolg, heeft hij die daartoe overgaat, de keuze tussen
      persoonlijke en zakelijke zekerheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel51
  - number: '51.2'
    text: |-
      De aangeboden zekerheid moet zodanig zijn, dat de vordering en, zo daartoe gronden zijn, de daarop vallende rente
      en kosten behoorlijk gedekt zijn en dat de schuldeiser daarop zonder moeite verhaal zal kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel51
  - number: '51.3'
    text: |-
      Is de gestelde zekerheid door een niet aan de schuldeiser toe te rekenen oorzaak onvoldoende geworden, dan is de
      schuldenaar verplicht haar aan te vullen of te vervangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel51
  - number: '52.1'
    text: |-
      Een schuldenaar die een opeisbare vordering heeft op zijn schuldeiser, is bevoegd de nakoming van zijn verbintenis
      op te schorten tot voldoening van zijn vordering plaatsvindt, indien tussen vordering en verbintenis voldoende
      samenhang bestaat om deze opschorting te rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel52
  - number: '52.2'
    text: |-
      Een zodanige samenhang kan onder meer worden aangenomen ingeval de verbintenissen over en weer voortvloeien uit
      dezelfde rechtsverhouding of uit zaken die partijen regelmatig met elkaar hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel52
  - number: '53'
    text: Een opschortingsrecht kan ook worden ingeroepen tegen de schuldeisers van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel53
  - number: '54'
    text: 'Geen bevoegdheid tot opschorting bestaat:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel54
  - number: 54.a
    text: voor zover de nakoming van de verbintenis van de wederpartij wordt verhinderd door schuldeisersverzuim;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel54
  - number: 54.b
    text: voor zover de nakoming van de verbintenis van de wederpartij blijvend onmogelijk is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel54
  - number: 54.c
    text: voor zover op de vordering van de wederpartij geen beslag is toegelaten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel54
  - number: '55'
    text: |-
      Zodra zekerheid is gesteld voor de voldoening van de verbintenis van de wederpartij, vervalt de bevoegdheid tot
      opschorting, tenzij deze voldoening daardoor onredelijk zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel55
  - number: '56'
    text: Een bevoegdheid tot opschorting blijft ook na verjaring van de rechtsvordering op de wederpartij in stand.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel56
  - number: '57'
    text: |-
      Indien een bevoegdheid tot opschorting voldoet aan de omschrijving van het retentierecht in
      [artikel 290 van Boek 3][ref1], zijn de bepalingen van de onderhavige afdeling van toepassing, voor zover daarvan
      in [afdeling 4 van titel 10 van Boek 3][ref2] niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling4
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '4'
  - number: '58'
    text: |-
      De schuldeiser komt in verzuim, wanneer nakoming van de verbintenis verhinderd wordt doordat hij de daartoe
      noodzakelijke medewerking niet verleent of doordat een ander beletsel van zijn zijde opkomt, tenzij de oorzaak van
      verhindering hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel58
  - number: '59'
    text: |-
      De schuldeiser komt eveneens in verzuim, wanneer hij ten gevolge van hem toe te rekenen omstandigheden niet voldoet
      aan een verplichting zijnerzijds jegens de schuldenaar en deze op die grond bevoegdelijk de nakoming van zijn
      verbintenis jegens de schuldeiser opschort.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel59
  - number: '60'
    text: |-
      Is de schuldeiser in verzuim, dan kan de rechter op vordering van de schuldenaar bepalen dat deze van zijn
      verbintenis bevrijd zal zijn, al dan niet onder door de rechter te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel60
  - number: '61.1'
    text: Verzuim van de schuldeiser maakt een einde aan verzuim van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel61
  - number: '61.2'
    text: Zolang de schuldeiser in verzuim is, kan de schuldenaar niet in verzuim geraken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel61
  - number: '62'
    text: Gedurende het verzuim van de schuldeiser is deze niet bevoegd maatregelen tot executie te nemen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel62
  - number: '63'
    text: |-
      De schuldenaar heeft, binnen de grenzen der redelijkheid, recht op vergoeding van de kosten, gevallen op een aanbod
      of een inbewaringstelling als bedoeld in de [artikelen 66-70][ref1] of op andere wijze als gevolg van het verzuim
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel66
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '66'
        afdeling: '8'
  - number: '64'
    text: |-
      Komt tijdens het verzuim van de schuldeiser een omstandigheid op, die behoorlijke nakoming geheel of gedeeltelijk
      onmogelijk maakt, dan wordt dit niet aan de schuldenaar toegerekend, tenzij deze door zijn schuld of die van een
      ondergeschikte is tekortgeschoten in de zorg die in de gegeven omstandigheden van hem mocht worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel64
  - number: '65'
    text: |-
      Wanneer bij een verbintenis tot aflevering van soortzaken de schuldenaar bepaalde, aan de verbintenis
      beantwoordende zaken voor de aflevering heeft aangewezen en de schuldeiser daarvan heeft verwittigd, dan is hij in
      geval van verzuim van de schuldeiser nog slechts tot aflevering van deze zaken verplicht. Hij blijft echter bevoegd
      tot aflevering van andere zaken die aan de verbintenis beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel65
  - number: '66'
    text: |-
      Strekt de verbintenis tot betaling van een geldsom of tot aflevering van een zaak, dan is in geval van verzuim van
      de schuldeiser de schuldenaar bevoegd het verschuldigde ten behoeve van de schuldeiser in bewaring te stellen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel66
  - number: '67'
    text: |-
      De inbewaringstelling van een geldsom geschiedt door consignatie overeenkomstig de wet, die van een af te leveren
      zaak door deze in bewaring te geven aan iemand die zijn bedrijf maakt van het bewaren van zaken als de betrokkene
      ter plaatse waar de aflevering moet geschieden. Op deze bewaring zijn de regels betreffende gerechtelijke bewaring
      van toepassing, voor zover uit de [artikelen 68-71][ref1] niet anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel68
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '68'
        afdeling: '8'
  - number: '68'
    text: Gedurende de bewaring loopt over een in bewaring gestelde geldsom geen rente ten laste van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel68
  - number: '69.1'
    text: Gedurende de bewaring kan de schuldeiser zijn verzuim slechts zuiveren door het in bewaring gestelde te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel69
  - number: '69.2'
    text: |-
      Zolang de schuldeiser het in bewaring gestelde niet heeft aanvaard, is de bewaargever bevoegd het uit de bewaring
      terug te nemen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel69
  - number: '70'
    text: |-
      De bewaarder mag de zaak slechts aan de schuldeiser afgeven, indien deze hem alle kosten van de bewaring voldoet.
      Hij is na de afgifte verplicht aan de bewaargever terug te betalen, wat deze reeds had voldaan. Is de zaak
      afgegeven, vóórdat de schuldeiser alle kosten voldeed, dan gaan de rechten te dier zake door de betaling aan de
      bewaargever op de bewaarder over.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel70
  - number: '71'
    text: |-
      De rechtsvordering tegen de schuldenaar verjaart niet later dan de rechtsvordering tot uitlevering van het in
      bewaring gestelde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel71
  - number: '72'
    text: |-
      In geval van hoofdelijke verbondenheid gelden de rechtsgevolgen van het verzuim van de schuldeiser jegens ieder van
      de schuldenaren.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel72
  - number: '73'
    text: |-
      Weigert de schuldeiser een aanbod van een derde, dan zijn de [artikelen 60][ref1], [62][ref2], [63][ref3]
      en [66-70][ref4] ten behoeve van de derde van overeenkomstige toepassing, mits het aanbod aan de verbintenis
      beantwoordt en de derde bij de voldoening een gerechtvaardigd belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel66
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '60'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '62'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '63'
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '66'
        afdeling: '8'
  - number: '74.1'
    text: |-
      Iedere tekortkoming in de nakoming van een verbintenis verplicht de schuldenaar de schade die de schuldeiser
      daardoor lijdt te vergoeden, tenzij de tekortkoming de schuldenaar niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel74
  - number: '74.2'
    text: |-
      Voor zover nakoming niet reeds blijvend onmogelijk is, vindt lid 1 slechts toepassing met inachtneming van hetgeen
      is bepaald in de [tweede paragraaf][ref1] betreffende het verzuim van de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005289
        paragraaf: '2'
        afdeling: '9'
  - number: '75'
    text: |-
      Een tekortkoming kan de schuldenaar niet worden toegerekend, indien zij niet is te wijten aan zijn schuld, noch
      krachtens wet, rechtshandeling of in het verkeer geldende opvattingen voor zijn rekening komt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel75
  - number: '76'
    text: |-
      Maakt de schuldenaar bij de uitvoering van een verbintenis gebruik van de hulp van andere personen, dan is hij voor
      hun gedragingen op gelijke wijze als voor eigen gedragingen aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel76
  - number: '77'
    text: |-
      Wordt bij de uitvoering van een verbintenis gebruik gemaakt van een zaak die daartoe ongeschikt is, dan wordt
      de tekortkoming die daardoor ontstaat de schuldenaar toegerekend, tenzij dit, gelet op inhoud en strekking van
      de rechtshandeling waaruit de verbintenis voortspruit, de in het verkeer geldende opvattingen en de overige
      omstandigheden van het geval, onredelijk zou zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel77
  - number: '78.1'
    text: |-
      Indien een tekortkoming de schuldenaar niet kan worden toegerekend, maar hij in verband met die tekortkoming een
      voordeel geniet dat hij bij behoorlijke nakoming niet zou hebben gehad, heeft de schuldeiser met toepassing van de
      regels betreffende ongerechtvaardigde verrijking recht op vergoeding van zijn schade tot ten hoogste het bedrag van
      dit voordeel.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel78
  - number: '78.2'
    text: |-
      Bestaat dit voordeel uit een vordering op een derde, dan kan de schuldenaar aan het vorige lid voldoen door
      overdracht van die vordering.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel78
  - number: '79'
    text: |-
      Is de schuldeiser wiens schuldenaar door een hem niet toe te rekenen oorzaak verhinderd is na te komen, desondanks
      in staat zelf zich door executie of verrekening het verschuldigde te verschaffen, dan is hij daartoe bevoegd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel79
  - number: '80.1'
    text: 'De gevolgen van niet-nakoming treden reeds in voordat de vordering opeisbaar is:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel80
  - number: 80.1.a
    text: indien vaststaat dat nakoming zonder tekortkoming onmogelijk zal zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel80
  - number: 80.1.b
    text: |-
      indien de schuldeiser uit een mededeling van de schuldenaar moet afleiden dat deze in de nakoming zal
      tekortschieten; of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel80
  - number: 80.1.c
    text: |-
      indien de schuldeiser goede gronden heeft te vrezen dat de schuldenaar in de nakoming zal tekortschieten en deze
      niet voldoet aan een schriftelijke aanmaning met opgave van die gronden om zich binnen een bij die aanmaning
      gestelde redelijke termijn bereid te verklaren zijn verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel80
  - number: '80.2'
    text: |-
      Het oorspronkelijke tijdstip van opeisbaarheid blijft gelden voor de verschuldigdheid van schadevergoeding wegens
      vertraging en de toerekening aan de schuldenaar van onmogelijk worden van nakoming tijdens zijn verzuim.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel80
  - number: '81'
    text: |-
      De schuldenaar is in verzuim gedurende de tijd dat de prestatie uitblijft nadat zij opeisbaar is geworden en aan
      de eisen van de [artikelen 82][ref1] en [83][ref2] is voldaan, behalve voor zover de vertraging hem niet kan worden
      toegerekend of nakoming reeds blijvend onmogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel83
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '82'
        paragraaf: '2'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '83'
        paragraaf: '2'
        afdeling: '9'
  - number: '82.1'
    text: |-
      Het verzuim treedt in, wanneer de schuldenaar in gebreke wordt gesteld bij een schriftelijke aanmaning waarbij hem
      een redelijke termijn voor de nakoming wordt gesteld, en nakoming binnen deze termijn uitblijft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel82
  - number: '82.2'
    text: |-
      Indien de schuldenaar tijdelijk niet kan nakomen of uit zijn houding blijkt dat aanmaning nutteloos zou zijn, kan
      de ingebrekestelling plaatsvinden door een schriftelijke mededeling waaruit blijkt dat hij voor het uitblijven van
      de nakoming aansprakelijk wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel82
  - number: '83'
    text: 'Het verzuim treedt zonder ingebrekestelling in:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel83
  - number: 83.a
    text: |-
      wanneer een voor de voldoening bepaalde termijn verstrijkt zonder dat de verbintenis is nagekomen, tenzij blijkt
      dat de termijn een andere strekking heeft;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel83
  - number: 83.b
    text: |-
      wanneer de verbintenis voortvloeit uit onrechtmatige daad of strekt tot schadevergoeding als bedoeld in
      [artikel 74 lid 1][ref1] en de verbintenis niet terstond wordt nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel74
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '74'
        paragraaf: '1'
        afdeling: '9'
  - number: 83.c
    text: |-
      wanneer de schuldeiser uit een mededeling van de schuldenaar moet afleiden dat deze in de nakoming van de
      verbintenis zal tekortschieten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel83
  - number: '84'
    text: |-
      Elke onmogelijkheid van nakoming, ontstaan tijdens het verzuim van de schuldenaar en niet toe te rekenen aan de
      schuldeiser, wordt aan de schuldenaar toegerekend; deze moet de daardoor ontstane schade vergoeden, tenzij de
      schuldeiser de schade ook bij behoorlijke en tijdige nakoming zou hebben geleden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel84
  - number: '85'
    text: |-
      Tot vergoeding van schade wegens vertraging in de nakoming is de schuldenaar slechts verplicht over de tijd waarin
      hij in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel85
  - number: '86'
    text: |-
      De schuldeiser kan een na het intreden van het verzuim aangeboden nakoming weigeren, zolang niet tevens betaling
      wordt aangeboden van de inmiddels tevens verschuldigd geworden schadevergoeding en van de kosten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel86
  - number: '87.1'
    text: |-
      Voor zover nakoming niet reeds blijvend onmogelijk is, wordt de verbintenis omgezet in een tot vervangende
      schadevergoeding, wanneer de schuldenaar in verzuim is en de schuldeiser hem schriftelijk mededeelt dat hij
      schadevergoeding in plaats van nakoming vordert.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel87
  - number: '87.2'
    text: |-
      Geen omzetting vindt plaats, die door de tekortkoming, gezien haar ondergeschikte betekenis, niet wordt
      gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel87
  - number: '88.1'
    text: |-
      De schuldenaar die in de nakoming van zijn verbintenis is tekort geschoten, kan aan de schuldeiser een redelijke
      termijn stellen, waarbinnen deze moet mededelen welke van de hem bij de aanvang van de termijn ten dienste staande
      middelen hij wenst uit te oefenen, op straffe van slechts aanspraak te kunnen maken:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel88
  - number: 88.1.a
    text: |-
      op de schadevergoeding waarop de tekortkoming recht geeft en, zo de verbintenis strekt tot betaling van een
      geldsom, op die geldsom;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel88
  - number: 88.1.b
    text: |-
      op ontbinding van de overeenkomst waaruit de verbintenis voortspruit, indien de schuldenaar zich erop beroept dat
      de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel88
  - number: '88.2'
    text: |-
      Heeft de schuldeiser nakoming verlangd, doch wordt daaraan niet binnen een redelijke termijn voldaan, dan kan hij
      al zijn rechten wederom doen gelden; het vorige lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel88
  - number: '89'
    text: |-
      De schuldeiser kan op een gebrek in de prestatie geen beroep meer doen, indien hij niet binnen bekwame tijd
      nadat hij het gebrek heeft ontdekt of redelijkerwijze had moeten ontdekken, bij de schuldenaar terzake heeft
      geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel89
  - number: '90.1'
    text: |-
      Bij een verhindering tot aflevering van een zaak die aan snel tenietgaan of achteruitgaan onderhevig is of
      waarvan om een andere reden de verdere bewaring zo bezwaarlijk is dat zij in de gegeven omstandigheden niet van de
      schuldenaar kan worden gevergd, is deze bevoegd de zaak op een geschikte wijze te doen verkopen. De schuldenaar is
      jegens de schuldeiser tot een zodanige verkoop gehouden, wanneer diens belangen deze verkoop onmiskenbaar eisen of
      de schuldeiser te kennen geeft de verkoop te verlangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel90
  - number: '90.2'
    text: |-
      De netto-opbrengst treedt voor de zaak in de plaats, onverminderd de rechten van de schuldeiser wegens
      tekortkomingen in de nakoming van de verbintenis.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel90
  - number: '91'
    text: |-
      Als boetebeding wordt aangemerkt ieder beding waarbij is bepaald dat de schuldenaar, indien hij in de nakoming van
      zijn verbintenis tekortschiet, gehouden is een geldsom of een andere prestatie te voldoen, ongeacht of zulks strekt
      tot vergoeding van schade of enkel tot aansporing om tot nakoming over te gaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel91
  - number: '92.1'
    text: |-
      De schuldeiser kan geen nakoming vorderen zowel van het boetebeding als van de verbintenis waaraan het boetebeding
      verbonden is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel92
  - number: '92.2'
    text: Hetgeen ingevolge een boetebeding verschuldigd is treedt in de plaats van de schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel92
  - number: '92.3'
    text: |-
      De schuldeiser kan geen nakoming vorderen van het boetebeding, indien de tekortkoming niet aan de schuldenaar kan
      worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel92
  - number: '93'
    text: |-
      Voor het vorderen van nakoming van het boetebeding is een aanmaning of een andere voorafgaande verklaring nodig in
      dezelfde gevallen als deze is vereist voor het vorderen van schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel93
  - number: '94.1'
    text: |-
      Op verlangen van de schuldenaar kan de rechter, indien de billijkheid dit klaarblijkelijk eist, de bedongen boete
      matigen, met dien verstande dat hij de schuldeiser ter zake van de tekortkoming niet minder kan toekennen dan de
      schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel94
  - number: '94.2'
    text: |-
      Op verlangen van de schuldeiser kan de rechter, indien de billijkheid dit klaarblijkelijk eist, naast een
      bedongen boete die bestemd is in de plaats te treden van de schadevergoeding op grond van de wet, aanvullende
      schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel94
  - number: '94.3'
    text: Van lid 1 afwijkende bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel94
  - number: '95'
    text: |-
      De schade die op grond van een wettelijke verplichting tot schadevergoeding moet worden vergoed, bestaat in
      vermogensschade en ander nadeel, dit laatste voor zover de wet op vergoeding hiervan recht geeft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel95
  - number: '96.1'
    text: Vermogensschade omvat zowel geleden verlies als gederfde winst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: '96.2'
    text: 'Als vermogensschade komen mede voor vergoeding in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: 96.2.a
    text: |-
      redelijke kosten ter voorkoming of beperking van schade die als gevolg van de gebeurtenis waarop de
      aansprakelijkheid berust, mocht worden verwacht;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: 96.2.b
    text: redelijke kosten ter vaststelling van schade en aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: 96.2.c
    text: redelijke kosten ter verkrijging van voldoening buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: '96.3'
    text: |-
      Lid 2 onder b en c is niet van toepassing voor zover in het gegeven geval krachtens
      [artikel 241 van het Wetboek van Burgerlijke Rechtsvordering][ref1] de regels betreffende de proceskosten van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel241
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '241'
  - number: '96.4'
    text: |-
      In geval van een handelsovereenkomst als bedoeld in [artikel 119a lid 1][ref1] of [artikel 119b lid 1][ref2]
      bestaat de vergoeding van kosten bedoeld in lid 2 onder c uit ten minste een bedrag van 40 euro. Dit bedrag is
      zonder aanmaning verschuldigd vanaf de dag volgende op de dag waarop de wettelijke of overeengekomen uiterste dag
      van betaling is verstreken. Hiervan kan niet ten nadele van de schuldeiser worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119a
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 119a
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 119b
        afdeling: '11'
  - number: '96.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld voor de vergoeding van kosten als bedoeld in
      lid 2 onder c. Van deze regels kan niet ten nadele van de schuldenaar worden afgeweken indien de schuldenaar
      een natuurlijk persoon is, die niet handelt in de uitoefening van een beroep of bedrijf. In dit geval mist
      [artikel 241, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering toepassing][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel241
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '241'
  - number: '96.6'
    text: |-
      De vergoeding volgens de nadere regels kan indien de schuldenaar een natuurlijk persoon is, die niet handelt in
      de uitoefening van een beroep of bedrijf, eerst verschuldigd worden nadat de schuldenaar na het intreden van het
      verzuim, bedoeld in [artikel 81][ref1], onder vermelding van de gevolgen van het uitblijven van betaling, waaronder
      de vergoeding die in overeenstemming met de nadere regels wordt gevorderd, vruchteloos is aangemaand tot betaling
      binnen een termijn van veertien dagen, aanvangende de dag na aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel81
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '81'
        paragraaf: '2'
        afdeling: '9'
  - number: '96.7'
    text: |-
      Indien een schuldenaar voor meer dan een vordering door een schuldeiser kan worden aangemaand als bedoeld in lid 6,
      dan dient dit in één aanmaning te geschieden. Voor de berekening van de vergoeding worden de hoofdsommen van deze
      vorderingen bij elkaar opgeteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel96
  - number: '97'
    text: |-
      De rechter begroot de schade op de wijze die het meest met de aard ervan in overeenstemming is. Kan de omvang van
      de schade niet nauwkeurig worden vastgesteld, dan wordt zij geschat.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel97
  - number: '98'
    text: |-
      Voor vergoeding komt slechts in aanmerking schade die in zodanig verband staat met de gebeurtenis waarop de
      aansprakelijkheid van de schuldenaar berust, dat zij hem, mede gezien de aard van de aansprakelijkheid en van de
      schade, als een gevolg van deze gebeurtenis kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel98
  - number: '99'
    text: |-
      Kan de schade een gevolg zijn van twee of meer gebeurtenissen voor elk waarvan een andere persoon aansprakelijk is,
      en staat vast dat de schade door ten minste één van deze gebeurtenissen is ontstaan, dan rust de verplichting om de
      schade te vergoeden op ieder van deze personen, tenzij hij bewijst dat deze niet het gevolg is van een gebeurtenis
      waarvoor hijzelf aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel99
  - number: '100'
    text: |-
      Heeft een zelfde gebeurtenis voor de benadeelde naast schade tevens voordeel opgeleverd, dan moet, voor zover dit
      redelijk is, dit voordeel bij de vaststelling van de te vergoeden schade in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel100
  - number: '101.1'
    text: |-
      Wanneer de schade mede een gevolg is van een omstandigheid die aan de benadeelde kan worden toegerekend, wordt
      de vergoedingsplicht verminderd door de schade over de benadeelde en de vergoedingsplichtige te verdelen in
      evenredigheid met de mate waarin de aan ieder toe te rekenen omstandigheden tot de schade hebben bijgedragen, met
      dien verstande dat een andere verdeling plaatsvindt of de vergoedingsplicht geheel vervalt of in stand blijft,
      indien de billijkheid dit wegens de uiteenlopende ernst van de gemaakte fouten of andere omstandigheden van het
      geval eist.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel101
  - number: '101.2'
    text: |-
      Betreft de vergoedingsplicht schade, toegebracht aan een zaak die een derde voor de benadeelde in zijn macht had,
      dan worden bij toepassing van het vorige lid omstandigheden die aan de derde toegerekend kunnen worden, toegerekend
      aan de benadeelde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel101
  - number: '102.1'
    text: |-
      Rust op ieder van twee of meer personen een verplichting tot vergoeding van dezelfde schade, dan zijn
      zij hoofdelijk verbonden. Voor de bepaling van hetgeen zij krachtens [artikel 10][ref1] in hun onderlinge
      verhouding jegens elkaar moeten bijdragen, wordt de schade over hen verdeeld met overeenkomstige toepassing van
      [artikel 101][ref2], tenzij uit wet of rechtshandeling een andere verdeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel101
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '101'
        afdeling: '10'
  - number: '102.2'
    text: |-
      Wanneer de schade mede een gevolg is van een omstandigheid die aan de benadeelde kan worden toegerekend, vindt
      [artikel 101][ref1] toepassing op de vergoedingsplicht van ieder van de in het vorige lid bedoelde personen
      afzonderlijk, met dien verstande dat de benadeelde in totaal van hen niet meer kan vorderen dan hem zou
      zijn toegekomen, indien voor de omstandigheden waarop hun vergoedingsplichten berusten, slechts één persoon
      aansprakelijk zou zijn geweest. Indien verhaal op een der tot bijdragen verplichte personen niet ten volle mogelijk
      blijkt, kan de rechter op verlangen van een hunner bepalen dat bij toepassing van [artikel 13][ref2] het onvoldaan
      gebleven deel mede over de benadeelde omgeslagen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel13
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '101'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '13'
        afdeling: '2'
  - number: '103'
    text: |-
      Schadevergoeding wordt voldaan in geld. Nochthans kan de rechter op vordering van de benadeelde schadevergoeding in
      andere vorm dan betaling van een geldsom toekennen. Wordt niet binnen redelijke termijn aan een zodanige uitspraak
      voldaan, dan herkrijgt de benadeelde zijn bevoegdheid om schadevergoeding in geld te verlangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel103
  - number: '104'
    text: |-
      Indien iemand die op grond van onrechtmatige daad of een tekortkoming in de nakoming van een verbintenis jegens
      een ander aansprakelijk is, door die daad of tekortkoming winst heeft genoten, kan de rechter op vordering van die
      ander de schade begroten op het bedrag van die winst of op een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel104
  - number: '105.1'
    text: |-
      De begroting van nog niet ingetreden schade kan door de rechter geheel of gedeeltelijk worden uitgesteld of na
      afweging van goede en kwade kansen bij voorbaat geschieden. In het laatste geval kan de rechter de schuldenaar
      veroordelen, hetzij tot betaling van een bedrag ineens, hetzij tot betaling van periodiek uit te keren bedragen, al
      of niet met verplichting tot zekerheidstelling; deze veroordeling kan geschieden onder door de rechter te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel105
  - number: '105.2'
    text: |-
      Voor zover de rechter de schuldenaar veroordeelt tot betaling van periodiek uit te keren bedragen, kan hij in zijn
      uitspraak bepalen dat deze op verzoek van elk van de partijen door de rechter die in eerste aanleg van de vordering
      tot schadevergoeding heeft kennis genomen, kan worden gewijzigd, indien zich na de uitspraak omstandigheden
      voordoen, die voor de omvang van de vergoedingsplicht van belang zijn en met de mogelijkheid van het intreden
      waarvan bij de vaststelling der bedragen geen rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel105
  - number: '106.1'
    text: |-
      Voor nadeel dat niet in vermogensschade bestaat, heeft de benadeelde recht op een naar billijkheid vast te stellen
      schadevergoeding:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel106
  - number: 106.1.a
    text: indien de aansprakelijke persoon het oogmerk had zodanig nadeel toe te brengen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel106
  - number: 106.1.b
    text: |-
      indien de benadeelde lichamelijk letsel heeft opgelopen, in zijn eer of goede naam is geschaad of op andere wijze
      in zijn persoon is aangetast;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel106
  - number: 106.1.c
    text: |-
      indien het nadeel gelegen is in aantasting van de nagedachtenis van een overledene en toegebracht is aan de niet
      van tafel en bed gescheiden echtgenoot, de geregistreerde partner of een bloedverwant tot in de tweede graad van de
      overledene, mits de aantasting plaatsvond op een wijze die de overledene, ware hij nog in leven geweest, recht zou
      hebben gegeven op schadevergoeding wegens het schaden van zijn eer of goede naam.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel106
  - number: '106.2'
    text: |-
      Het recht op een vergoeding, als in het vorige lid bedoeld, is niet vatbaar voor overgang en beslag, tenzij het bij
      overeenkomst is vastgelegd of ter zake een vordering in rechte is ingesteld. Voor overgang onder algemene titel is
      voldoende dat de gerechtigde aan de wederpartij heeft medegedeeld op de vergoeding aanspraak te maken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel106
  - number: '107.1'
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander aansprakelijk is, lichamelijk of geestelijk letsel
      oploopt, is die ander behalve tot vergoeding van de schade van de gekwetste zelf, ook verplicht tot vergoeding van
      de kosten die een derde anders dan krachtens een verzekering ten behoeve van de gekwetste heeft gemaakt en die deze
      laatste, zo hij ze zelf zou hebben gemaakt, van die ander had kunnen vorderen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107
  - number: '107.2'
    text: |-
      Hij die krachtens het vorige lid door de derde tot schadevergoeding wordt aangesproken kan hetzelfde verweer voeren
      dat hem jegens de gekwetste ten dienste zou hebben gestaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107
  - number: 107a.1
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander aansprakelijk is, lichamelijk of geestelijk
      letsel oploopt, houdt de rechter bij de vaststelling van de schadevergoeding waarop de gekwetste aanspraak kan
      maken rekening met de aanspraak op loon die de gekwetste heeft krachtens [artikel 629, lid 1, van Boek 7][ref1] of
      krachtens individuele of collectieve arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 107a.2
    text: |-
      Indien een werkgever krachtens [artikel 629, lid 1, van Boek 7][ref1] of krachtens individuele of collectieve
      arbeidsovereenkomst verplicht is tijdens ziekte of arbeidsongeschiktheid van de gekwetste het loon door te
      betalen, heeft hij, indien de ongeschiktheid tot werken van de gekwetste het gevolg is van een gebeurtenis
      waarvoor een ander aansprakelijk is, jegens deze ander recht op schadevergoeding ten bedrage van de door hem
      betaalde loon, doch ten hoogste tot het bedrag, waarvoor de aansprakelijke persoon, bij het ontbreken van
      de loondoorbetalingsverplichting aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van de
      schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de gekwetste is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 107a.3
    text: |-
      De in lid 2 bedoelde aansprakelijke is eveneens verplicht tot vergoeding van de door de werkgever gemaakte
      redelijke kosten ter nakoming van zijn in [artikel 658a van Boek 7][ref1] bedoelde verplichtingen. De
      aansprakelijke kan hetzelfde verweer voeren dat hem jegens de gekwetste ten dienste zou hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
  - number: 107a.4
    text: |-
      Indien de aansprakelijke persoon een werknemer is, heeft de werkgever slechts recht op schadevergoeding indien de
      ongeschiktheid tot werken het gevolg is van diens opzet of bewuste roekeloosheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel107a
  - number: '108.1'
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander jegens hem aansprakelijk is overlijdt, is die
      ander verplicht tot vergoeding van schade door het derven van levensonderhoud:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: 108.1.a
    text: |-
      aan de niet van tafel en bed gescheiden echtgenoot, de geregistreerde partner en de minderjarige kinderen van de
      overledene, tot ten minste het bedrag van het hun krachtens de wet verschuldigde levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: 108.1.b
    text: |-
      aan andere bloed- of aanverwanten van de overledene, mits deze reeds ten tijde van het overlijden geheel of ten
      dele in hun levensonderhoud voorzag of daartoe krachtens rechterlijke uitspraak verplicht was;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: 108.1.c
    text: |-
      aan degenen die reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met de overledene in gezinsverband
      samenwoonden en in wier levensonderhoud hij geheel of voor een groot deel voorzag, voor zover aannemelijk is dat
      een en ander zonder het overlijden zou zijn voortgezet en zij redelijkerwijze niet voldoende in hun levensonderhoud
      kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: 108.1.d
    text: |-
      aan degene die met de overledene in gezinsverband samenwoonde en in wiens levensonderhoud de overledene bijdroeg
      door het doen van de gemeenschappelijke huishouding, voor zover hij schade lijdt doordat na het overlijden op
      andere wijze in de gang van deze huishouding moet worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: '108.2'
    text: |-
      Bovendien is de aansprakelijke verplicht aan degene te wiens laste de kosten van lijkbezorging zijn gekomen, deze
      kosten te vergoeden, voor zover zij in overeenstemming zijn met de omstandigheden van de overledene.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: '108.3'
    text: |-
      Hij die krachtens de vorige leden tot schadevergoeding wordt aangesproken, kan hetzelfde verweer voeren, dat hem
      tegenover de overledene zou hebben ten dienste gestaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel108
  - number: '109.1'
    text: |-
      Indien toekenning van volledige schadevergoeding in de gegeven omstandigheden waaronder de aard van de
      aansprakelijkheid, de tussen partijen bestaande rechtsverhouding en hun beider draagkracht, tot kennelijk
      onaanvaardbare gevolgen zou leiden, kan de rechter een wettelijke verplichting tot schadevergoeding matigen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel109
  - number: '109.2'
    text: |-
      De matiging mag niet geschieden tot een lager bedrag dan waarvoor de schuldenaar zijn aansprakelijkheid door
      verzekering heeft gedekt of verplicht was te dekken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel109
  - number: '109.3'
    text: Ieder beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel109
  - number: '110'
    text: |-
      Opdat de aansprakelijkheid die ter zake van schade kan ontstaan niet hetgeen redelijkerwijs door verzekering kan
      worden gedekt, te boven gaat, kunnen bij algemene maatregel van bestuur bedragen worden vastgesteld, waarboven de
      aansprakelijkheid zich niet uitstrekt. Afzonderlijke bedragen kunnen worden bepaald naar gelang van onder meer de
      aard van de gebeurtenis, de aard van de schade en de grond van de aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel110
  - number: '111'
    text: |-
      Een verbintenis tot betaling van een geldsom moet naar haar nominale bedrag worden voldaan, tenzij uit wet,
      gewoonte of rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel111
  - number: '112'
    text: |-
      Het geld dat ter voldoening van de verbintenis wordt betaald, moet op het tijdstip van de betaling gangbaar zijn in
      het land in welks geld de betaling geschiedt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel112
  - number: '114.1'
    text: |-
      Bestaat in een land waar de betaling moet of mag geschieden ten name van de schuldeiser een rekening, bestemd voor
      girale betaling, dan kan de schuldenaar de verbintenis voldoen door het verschuldigde bedrag op die rekening te
      doen bijschrijven, tenzij de schuldeiser betaling op die rekening geldig heeft uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel114
  - number: '114.2'
    text: |-
      In het geval van het vorige lid geschiedt de betaling op het tijdstip waarop de rekening van de schuldeiser wordt
      gecrediteerd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel114
  - number: '115'
    text: |-
      De plaats waar de betaling moet geschieden wordt bepaald door de [artikelen 116-118][ref1], tenzij uit wet,
      gewoonte of rechtshandeling voortvloeit dat op een andere plaats moet of mag worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel116
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '116'
        afdeling: '11'
  - number: '116.1'
    text: De betaling moet worden gedaan aan de woonplaats van de schuldeiser op het tijdstip van de betaling.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel116
  - number: '116.2'
    text: |-
      De schuldeiser is bevoegd een andere plaats voor de betaling aan te wijzen in het land van de woonplaats van de
      schuldeiser op het tijdstip van de betaling of op het tijdstip van het ontstaan van de verbintenis.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel116
  - number: '117'
    text: |-
      Indien de betaling overeenkomstig [artikel 116][ref1] moet geschieden op een andere plaats dan de woonplaats van
      de schuldeiser op het tijdstip van het ontstaan van de verbintenis en het voldoen aan de verbintenis daardoor
      voor de schuldenaar aanmerkelijk bezwaarlijker zou worden, is deze bevoegd de betaling op te schorten, totdat
      de schuldeiser in een der in [artikel 116, lid 2][ref2] bedoelde landen een andere plaats voor de betaling heeft
      aangewezen, waaraan een zodanig bezwaar niet is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel116
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '116'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '116'
        afdeling: '11'
  - number: '118'
    text: |-
      Indien de verbintenis is ontstaan bij de uitoefening van bedrijfs- of beroepsbezigheden van de schuldeiser, geldt
      in de [artikelen 116][ref1] en [117][ref2] de plaats van vestiging waar die bezigheden worden uitgeoefend, als
      woonplaats van de schuldeiser.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel117
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '116'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '117'
        afdeling: '11'
  - number: '119.1'
    text: |-
      De schadevergoeding, verschuldigd wegens vertraging in de voldoening van een geldsom, bestaat in de wettelijke
      rente van die som over de tijd dat de schuldenaar met de voldoening daarvan in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119
  - number: '119.2'
    text: |-
      Telkens na afloop van een jaar wordt het bedrag waarover de wettelijke rente wordt berekend, vermeerderd met de
      over dat jaar verschuldigde rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119
  - number: '119.3'
    text: |-
      Een bedongen rente die hoger is dan die welke krachtens de vorige leden verschuldigd zou zijn, loopt in plaats
      daarvan door nadat de schuldenaar in verzuim is gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119
  - number: 119a.1
    text: |-
      De schadevergoeding, verschuldigd wegens vertraging in de voldoening van een geldsom, bestaat in het geval
      van een handelsovereenkomst in de wettelijke rente van die som met ingang van de dag volgend op de dag die is
      overeengekomen als de uiterste dag van betaling tot en met de dag waarop de schuldenaar de geldsom heeft voldaan.
      Onder handelsovereenkomst wordt verstaan de overeenkomst om baat die een of meer van de partijen verplicht iets te
      geven of te doen en die tot stand is gekomen tussen een of meer natuurlijke personen die handelen in de uitoefening
      van een beroep of bedrijf of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.2
    text: 'Indien geen uiterste dag van betaling is overeengekomen, is de wettelijke rente van rechtswege verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.2.a
    text: vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de schuldenaar de factuur heeft ontvangen, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.2.b
    text: |-
      indien de datum van ontvangst van de factuur niet vaststaat, of indien de schuldenaar de factuur ontvangt voordat
      hij de prestatie heeft ontvangen, vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de prestatie is
      ontvangen, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.2.c
    text: |-
      indien de schuldenaar een termijn heeft bedongen waarbinnen hij de ontvangen prestatie kan aanvaarden dan wel kan
      beoordelen of deze aan de overeenkomst beantwoordt, en indien hij de factuur ontvangt voordat hij de prestatie
      heeft aanvaard of beoordeeld, vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de schuldenaar de
      prestatie heeft aanvaard of beoordeeld, dan wel, indien hij zich niet over goedkeuring of aanvaarding uitspreekt,
      vanaf 30 dagen na de aanvang van de dag volgende op die waarop de termijn verstrijkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.3
    text: |-
      Telkens na afloop van een jaar wordt het bedrag waarover de wettelijke rente wordt berekend, vermeerderd met de
      over dat jaar verschuldigde rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.4
    text: |-
      De termijn bedoeld in lid 2 onder c bedraagt niet meer dan 30 dagen vanaf de datum van ontvangst van de prestatie,
      tenzij partijen uitdrukkelijk een langere termijn overeenkomen en deze termijn niet kennelijk onbillijk is jegens
      de schuldeiser, mede gelet op:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.4.a
    text: de vraag of de schuldenaar objectieve redenen heeft om af te wijken van de 30 dagen termijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.4.b
    text: de aard van de prestatie; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.4.c
    text: elke aanmerkelijke afwijking van goede handelspraktijken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.5
    text: |-
      Partijen kunnen een uiterste dag van betaling overeenkomen van ten hoogste 60 dagen, tenzij zij uitdrukkelijk
      een langere termijn van betaling in de overeenkomst opnemen en deze termijn niet kennelijk onbillijk is jegens de
      schuldeiser, mede gelet op:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.5.a
    text: de vraag of de schuldenaar objectieve redenen heeft om af te wijken van de 60 dagen termijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.5.b
    text: de aard van de prestatie; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.5.c
    text: elke aanmerkelijke afwijking van goede handelspraktijken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.6
    text: Geen wettelijke rente is verschuldigd wanneer de schuldeiser zelf in verzuim is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.7
    text: |-
      De wettelijke rente is verschuldigd behalve voor zover de vertraging niet aan de schuldenaar kan worden
      toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119a.8
    text: Voor de toepassing van dit artikel wordt met de wettelijke rente gelijkgesteld een andere overeengekomen rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119a
  - number: 119b.1
    text: |-
      De schadevergoeding, verschuldigd door een overheidsinstantie wegens vertraging in de voldoening van een geldsom,
      bestaat in geval van een handelsovereenkomst met een overheidsinstantie in de wettelijke rente van die som met
      ingang van de dag volgend op de dag die is overeengekomen als uiterste dag van betaling tot en met de dag waarop
      de schuldenaar de geldsom heeft voldaan. Onder overheidsinstantie wordt verstaan de Staat, een provincie, een
      gemeente, een waterschap of een publiekrechtelijke instelling dan wel een samenwerkingsverband van deze overheden
      of publiekrechtelijke instellingen als bedoeld in artikel 2 lid 2 van richtlijn nr. 2011/7 van het Europees
      Parlement en de Raad van 23 februari 2011 betreffende bestrijding van betalingsachterstand bij handelstransacties
      (PbEU L48/11).
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.2
    text: 'Indien geen uiterste dag van betaling is overeengekomen, is de wettelijke rente van rechtswege verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.2.a
    text: vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de schuldenaar de factuur heeft ontvangen, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.2.b
    text: |-
      indien de datum van ontvangst van de factuur niet vaststaat, of indien de schuldenaar de factuur ontvangt voordat
      hij de prestatie heeft ontvangen, vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de prestatie is
      ontvangen, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.2.c
    text: |-
      indien de schuldenaar een termijn heeft bedongen waarbinnen hij de ontvangen prestatie kan aanvaarden dan wel kan
      beoordelen of deze aan de overeenkomst beantwoordt, en indien hij de factuur ontvangt voordat hij de prestatie
      heeft aanvaard of beoordeeld, vanaf 30 dagen na de aanvang van de dag, volgende op die waarop de schuldenaar de
      prestatie heeft aanvaard of beoordeeld, dan wel, indien hij zich niet over goedkeuring of aanvaarding uitspreekt,
      vanaf 30 dagen na de aanvang van de dag volgende op die waarop de termijn verstrijkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.3
    text: |-
      Telkens na afloop van een jaar wordt het bedrag waarover de wettelijke rente wordt berekend, vermeerderd met de
      over dat jaar verschuldigde rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.4
    text: |-
      De termijn bedoeld in lid 2 onder c bedraagt niet meer dan 30 dagen vanaf de datum van ontvangst van de prestatie,
      tenzij partijen uitdrukkelijk een langere termijn in de overeenkomst en aanbestedingsdocumenten opnemen en deze
      termijn niet kennelijk onbillijk is jegens de schuldeiser, mede gelet op:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.4.a
    text: de vraag of de schuldenaar objectieve redenen heeft om af te wijken van de 30 dagen termijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.4.b
    text: de aard van de prestatie; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.4.c
    text: elke aanmerkelijke afwijking van goede handelspraktijken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.5
    text: |-
      Bij overeenkomst kan niet van een uiterste dag van betaling van ten hoogste 30 dagen, overeenkomstig het tweede
      lid, worden afgeweken, tenzij partijen uitdrukkelijk een langere termijn van betaling in de overeenkomst opnemen en
      de bijzondere aard of eigenschappen van de overeenkomst dit objectief rechtvaardigen. De betalingstermijn bedraagt
      in dat geval ten hoogste 60 dagen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.6
    text: Geen wettelijke rente is verschuldigd wanneer de schuldeiser zelf in verzuim is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.7
    text: |-
      De wettelijke rente is verschuldigd behalve voor zover de vertraging niet aan de schuldenaar kan worden
      toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: 119b.8
    text: Voor de toepassing van dit artikel wordt met de wettelijke rente gelijkgesteld een hogere overeengekomen rente.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel119b
  - number: '120.1'
    text: |-
      De wettelijke rente bedoeld in [artikel 119][ref1] wordt bij algemene maatregel van bestuur vastgesteld. Wettelijke
      rente die loopt op het tijdstip van inwerkingtreding van een nieuwe bij algemene maatregel van bestuur vastgestelde
      rentevoet, wordt met ingang van dat tijdstip volgens de nieuwe rentevoet berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
        afdeling: '11'
  - number: '120.2'
    text: |-
      De wettelijke rente bedoeld in [artikel 119a][ref1] en [artikel 119b][ref2] is gelijk aan de herfinancieringsrente
      die door de Europese Centrale Bank is vastgesteld voor haar meest recente basisherfinancieringstransactie die
      heeft plaatsgevonden voor de eerste kalenderdag van het betreffende halfjaar, vermeerderd met acht procentpunten.
      Wettelijke rente die loopt op de eerste dag van het betreffende halfjaar, wordt met ingang van dat tijdstip volgens
      de nieuwe rentevoet berekend gedurende een half jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119a
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 119a
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 119b
        afdeling: '11'
  - number: '121.1'
    text: |-
      Strekt een verbintenis tot betaling van ander geld dan dat van het land waar de betaling moet geschieden, dan is de
      schuldenaar bevoegd de verbintenis in het geld van de plaats van betaling te voldoen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel121
  - number: '121.2'
    text: |-
      Het vorige lid geldt niet, indien uit wet, gewoonte of rechtshandeling voortvloeit dat de schuldenaar verplicht is
      tot betaling effectief in het geld tot betaling waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel121
  - number: '122.1'
    text: |-
      Strekt een verbintenis tot betaling van ander geld dan dat van het land waar de betaling moet geschieden en is
      de schuldenaar niet in staat of beweert hij niet in staat te zijn in dit geld te voldoen, dan kan de schuldeiser
      voldoening in het geld van de plaats van betaling vorderen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel122
  - number: '122.2'
    text: |-
      Het vorige lid geldt mede, indien de schuldenaar verplicht is tot betaling effectief in het geld tot betaling
      waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel122
  - number: '123.1'
    text: |-
      Ingeval in Nederland een rechtsvordering wordt ingesteld ter verkrijging van een geldsom, uitgedrukt in buitenlands
      geld, kan de schuldeiser veroordeling vorderen tot betaling te zijner keuze in dat buitenlandse geld of in
      Nederlands geld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel123
  - number: '123.2'
    text: |-
      De schuldeiser die een in buitenlands geld luidende executoriale titel in Nederland kan executeren, kan het hem
      verschuldigde bij deze executie opeisen in Nederlands geld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel123
  - number: '123.3'
    text: |-
      De vorige leden gelden mede, indien de schuldenaar verplicht is tot betaling effectief in het geld tot betaling
      waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel123
  - number: '124'
    text: |-
      Wordt de verbintenis als gevolg van toepassing van de [artikelen 121][ref1], [122][ref2] of [123][ref3] of van
      omzetting in een vordering tot schadevergoeding overeenkomstig het bepaalde in [afdeling 9 van titel 1][ref4]
      voldaan in ander geld dan tot betaling waarvan zij strekt, dan geschiedt de omrekening naar de koers van de dag
      waarop de betaling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel122
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '121'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '122'
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '123'
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0005289
        afdeling: '9'
  - number: '125.1'
    text: |-
      [Artikel 119][ref1] laat onverlet het recht van de schuldeiser op vergoeding van de schade die hij heeft geleden,
      doordat na het intreden van het verzuim de koers van het geld tot betaling waarvan de verbintenis strekt, zich ten
      opzichte van die van het geld van een of meer andere landen heeft gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
        afdeling: '11'
  - number: '125.2'
    text: |-
      Het vorige lid is niet van toepassing, indien de verbintenis strekt tot betaling van Nederlands geld, de betaling
      in Nederland moet geschieden en de schuldeiser op het tijdstip van het ontstaan van de verbintenis zijn woonplaats
      in Nederland had.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel125
  - number: '126'
    text: |-
      Voor de toepassing van deze afdeling geldt als koers de koers tegen welke de schuldeiser zich onverwijld het geld
      kan verschaffen, zulks met inachtneming van hetgeen uit wet, gewoonte en inhoud of strekking van de verbintenis
      mocht voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel126
  - number: '127.1'
    text: |-
      Wanneer een schuldenaar die de bevoegdheid tot verrekening heeft, aan zijn schuldeiser verklaart dat hij zijn
      schuld met een vordering verrekent, gaan beide verbintenissen tot hun gemeenschappelijk beloop teniet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel127
  - number: '127.2'
    text: |-
      Een schuldenaar heeft de bevoegdheid tot verrekening, wanneer hij een prestatie te vorderen heeft die beantwoordt
      aan zijn schuld jegens dezelfde wederpartij en hij bevoegd is zowel tot betaling van de schuld als tot het
      afdwingen van de betaling van de vordering.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel127
  - number: '127.3'
    text: |-
      De bevoegdheid tot verrekening bestaat niet ten aanzien van een vordering en een schuld die in van elkaar
      gescheiden vermogens vallen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel127
  - number: '128.1'
    text: |-
      De schuldeiser van een vordering aan toonder of order brengt deze in verrekening door zijn verrekeningsverklaring
      op het papier te stellen en dit aan de wederpartij af te geven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel128
  - number: '128.2'
    text: |-
      Indien de verrekening niet zijn gehele vordering betreft of hij het papier nog voor de uitoefening van andere
      rechten nodig heeft, kan hij het papier behouden, mits hij de verklaring niet alleen op het papier stelt, maar haar
      ook schriftelijk tot de wederpartij richt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel128
  - number: '128.3'
    text: |-
      Hij kan, ongeacht of de verrekening de gehele vordering betreft, bij enkele, niet op het papier gestelde
      schriftelijke verklaring verrekenen, mits hij op verlangen van de wederpartij aantoont dat het papier vernietigd of
      waardeloos geworden is, of zekerheid stelt voor twintig jaren of voor een zoveel kortere tijdsduur als verwacht mag
      worden dat de wederpartij nog aan een vordering uit hoofde van het papier bloot zal kunnen staan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel128
  - number: '129.1'
    text: De verrekening werkt terug tot het tijdstip, waarop de bevoegdheid tot verrekening is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel129
  - number: '129.2'
    text: |-
      Is over één der vorderingen of over beide reeds opeisbare rente betaald, dan werkt de verrekening niet verder terug
      dan tot het einde van de laatste termijn waarover rente is voldaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel129
  - number: '129.3'
    text: |-
      Indien voor de bepaling van de werking van een verrekening bij geldschulden een koersberekening nodig is, geschiedt
      deze volgens dezelfde maatstaven als wanneer op de dag der verrekening wederzijdse betaling had plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel129
  - number: '130.1'
    text: |-
      Is een vordering onder bijzondere titel overgegaan, dan is de schuldenaar bevoegd ondanks de overgang ook een
      tegenvordering op de oorspronkelijke schuldeiser in verrekening te brengen, mits deze tegenvordering uit dezelfde
      rechtsverhouding als de overgegane vordering voortvloeit of reeds vóór de overgang aan hem is opgekomen en
      opeisbaar geworden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel130
  - number: '130.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing, wanneer op een vordering beslag is gelegd of een beperkt recht is
      gevestigd waarvan mededeling aan de schuldenaar is gedaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel130
  - number: '130.3'
    text: |-
      De vorige leden zijn niet van toepassing, indien de overgang of de vestiging van het beperkte recht een vordering
      aan toonder of order betrof en is geschied overeenkomstig [artikel 93 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel93
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '93'
  - number: '131.1'
    text: De bevoegdheid tot verrekening eindigt niet door verjaring van de rechtsvordering.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel131
  - number: '131.2'
    text: |-
      Uitstel van betaling of van executie, bij wijze van gunst door de schuldeiser verleend, staat aan verrekening door
      de schuldeiser niet in de weg.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel131
  - number: '132'
    text: |-
      Wordt een verrekeningsverklaring uitgebracht door een daartoe bevoegde, dan kan niettemin de wederpartij die grond
      had om nakoming van haar verbintenis te weigeren, aan de verrekeningsverklaring haar werking ontnemen door op de
      weigeringsgrond een beroep te doen, onverwijld nadat die verklaring werd uitgebracht en zij tot dit beroep in staat
      was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel132
  - number: '133'
    text: |-
      Nadat de ene partij een verrekeningsverklaring heeft uitgebracht, kan de andere partij, mits onverwijld, aan die
      verklaring haar werking ontnemen door alsnog gebruik te maken van een eigen bevoegdheid tot verrekening, doch
      alleen indien deze laatste verrekening verder terugwerkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel133
  - number: '134'
    text: |-
      De schuldenaar uit een wederkerige overeenkomst, die tot verrekening bevoegd is, kan aan de verklaring van zijn
      wederpartij, strekkende tot ontbinding van de overeenkomst wegens niet-nakoming, haar werking ontnemen door
      onverwijld van zijn bevoegdheid tot verrekening gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel134
  - number: '135'
    text: 'Een schuldenaar is niet bevoegd tot verrekening:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel135
  - number: 135.a
    text: voor zover beslag op de vordering van de wederpartij niet geldig zou zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel135
  - number: 135.b
    text: indien zijn verplichting strekt tot vergoeding van schade die hij opzettelijk heeft toegebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel135
  - number: '136'
    text: |-
      De rechter kan een vordering ondanks een beroep van de gedaagde op verrekening toewijzen, indien de gegrondheid van
      dit verweer niet op eenvoudige wijze is vast te stellen en de vordering overigens voor toewijzing vatbaar is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel136
  - number: '137.1'
    text: |-
      Voor zover een verrekeningsverklaring onvoldoende aangeeft welke verbintenissen in de verrekening zijn betrokken,
      geldt de volgorde van toerekening, aangegeven in de [artikelen 43 lid 2][ref1] en [44 lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel44
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '43'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '44'
        afdeling: '6'
  - number: '137.2'
    text: |-
      De wederpartijj van degene die heeft verklaard te verrekenen, kan door een onverwijld protest aan die verklaring
      haar werking ontnemen, indien de toerekening op de haar verschuldigde hoofdsom, kosten en met inachtneming
      van [artikel 129][ref1] te berekenen rente in deze verklaring in een andere volgorde is geschied dan die van
      [artikel 44 lid 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel44
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '129'
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '44'
        afdeling: '6'
  - number: '138.1'
    text: |-
      De omstandigheid dat de plaats van voldoening der verbintenissen niet dezelfde is, sluit verrekening niet uit.
      Hij die verrekent, is in dit geval verplicht zijn wederpartij de schade te vergoeden die deze lijdt, doordat niet
      wederzijds te bestemder plaatse voldoening geschiedt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel138
  - number: '138.2'
    text: |-
      De wederpartij van degene die ondanks een verschil in de plaats van nakoming heeft verrekend, kan door een
      onverwijld protest aan de verklaring tot verrekening haar werking ontnemen, als zij er een gerechtvaardigd belang
      bij heeft dat geen verrekening, maar nakoming plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel138
  - number: '139.1'
    text: |-
      De borg en degene wiens goed voor de schuld van een ander verbonden is, kunnen de opschorting van hun
      aansprakelijkheid inroepen, voor zover de schuldeiser bevoegd is zijn vordering met een opeisbare schuld aan de
      schuldenaar te verrekenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel139
  - number: '139.2'
    text: |-
      Zij kunnen de bevrijding van hun aansprakelijkheid inroepen, voor zover de schuldeiser een bevoegdheid tot
      verrekening met een schuld aan de schuldenaar heeft doen verloren gaan, tenzij hij daartoe een redelijke grond had
      of hem geen schuld treft.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel139
  - number: '140.1'
    text: |-
      Moeten tussen twee partijen krachtens wet, gewoonte of rechtshandeling geldvorderingen en geldschulden in één
      rekening worden opgenomen, dan worden zij in de volgorde waarin partijen volgens de voorgaande artikelen van deze
      afdeling of krachtens hun onderlinge rechtsverhouding tot verrekening bevoegd worden, dadelijk van rechtswege
      verrekend en is op ieder tijdstip alleen het saldo verschuldigd. [Artikel 137][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel137
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '137'
        afdeling: '12'
  - number: '140.2'
    text: |-
      De partij die de rekening bijhoudt, sluit deze jaarlijks af en deelt het op dat tijdstip verschuldigde saldo mede
      aan de wederpartij met opgave van de aan deze nog niet eerder medegedeelde posten waaruit het is samengesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel140
  - number: '140.3'
    text: |-
      Indien de wederpartij niet binnen redelijke tijd tegen het ingevolge het vorige lid medegedeelde saldo protesteert,
      geldt dit als tussen partijen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel140
  - number: '140.4'
    text: |-
      Na vaststelling van het saldo kan ten aanzien van de afzonderlijke posten geen beroep meer worden gedaan op het
      intreden van verjaring of op het verstrijken van een vervaltermijn. De rechtsvordering tot betaling van het saldo
      verjaart door verloop van vijf jaren na de dag, volgende op die waarop de rekening is geëindigd en het saldo
      opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel140
  - number: '140.5'
    text: Uit de tussen partijen bestaande rechtsverhouding kan anders voortvloeien dan in de vorige leden is bepaald.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel140
  - number: '141'
    text: |-
      Indien een verbintenis geheel of gedeeltelijk door verrekening tenietgaat, zijn de
      [leden 1 en 2 van artikel 48][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel48
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '48'
        afdeling: '6'
  - number: '142.1'
    text: |-
      Bij overgang van een vordering op een nieuwe schuldeiser verkrijgt deze de daarbij behorende nevenrechten, zoals
      rechten van pand en hypotheek en uit borgtocht, voorrechten en de bevoegdheid om de ter zake van de vordering en de
      nevenrechten bestaande executoriale titels ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel142
  - number: '142.2'
    text: |-
      Onder de nevenrechten zijn tevens begrepen het recht van de vorige schuldeiser op bedongen rente of boete of op
      een dwangsom, behalve voor zover de rente opeisbaar of de boete of dwangsom reeds verbeurd was op het tijdstip van
      de overgang.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel142
  - number: '143.1'
    text: |-
      In geval van overgang van een vordering is de vorige schuldeiser verplicht de op de vordering en op de nevenrechten
      betrekking hebbende bewijsstukken af te geven aan de nieuwe schuldeiser. Behoudt hij zelf belang bij een
      bewijsstuk, dan is hij slechts verplicht om aan de nieuwe schuldeiser op diens verlangen en op diens kosten een
      afschrift of uittreksel af te geven, waaruit met overeenkomstige bewijskracht als uit het oorspronkelijke stuk van
      de vordering blijkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel143
  - number: '143.2'
    text: |-
      De vorige schuldeiser is tevens verplicht tot afgifte van de in het vorige artikel bedoelde executoriale titels
      of, indien hijzelf belang bij deze titels behoudt, om de nieuwe schuldeiser tot tenuitvoerlegging daarvan in de
      gelegenheid te stellen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel143
  - number: '143.3'
    text: |-
      In geval van overgang van de gehele vordering is de vorige schuldeiser verplicht de zich in zijn handen bevindende
      panden af te geven aan de nieuwe schuldeiser.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel143
  - number: '143.4'
    text: |-
      In geval van overgang van een vordering waaraan hypotheek is verbonden, is de vorige schuldeiser verplicht
      desverlangd ertoe mede te werken dat uit de openbare registers van deze overgang blijkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel143
  - number: '144.1'
    text: |-
      Brengt de overdracht van een vordering mee dat verplichtingen die uit het schuldeiserschap of uit nevenrechten
      voortvloeien, overgaan op de nieuwe schuldeiser, dan staat de vorige schuldeiser in voor de nakoming van deze
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel144
  - number: '144.2'
    text: |-
      Lid 1 is niet van toepassing in geval van overdracht van een vordering aan toonder of order overeenkomstig
      [artikel 93 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel93
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '93'
  - number: '145'
    text: Overgang van een vordering laat de verweermiddelen van de schuldenaar onverlet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel145
  - number: '146.1'
    text: |-
      Na een overdracht overeenkomstig [artikel 93 van Boek 3][ref1] van een vordering aan toonder of aan order kan
      de schuldenaar een verweermiddel, gegrond op zijn verhouding tot een vorige schuldeiser, niet tegenwerpen aan de
      verkrijger en diens rechtsopvolgers, tenzij op het tijdstip van de overdracht het verweermiddel bekend was aan de
      verkrijger of voor hem kenbaar was uit het papier.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel93
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '93'
  - number: '146.2'
    text: |-
      Een beroep op onbekwaamheid of onbevoegdheid kan ook jegens een daarmee niet bekende verkrijger worden gedaan,
      indien zij ten tijde van zijn verkrijging kenbaar was uit een in een openbaar register opgenomen inschrijving, bij
      of krachtens de wet voorgeschreven teneinde kennisneming mogelijk te maken van de feiten waarop de onbevoegdheid of
      onbekwaamheid berust.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel146
  - number: '147'
    text: |-
      In geval van overdracht van een papier aan toonder of aan order verliest degene die volgens dat papier schuldenaar
      is, en aan wie is toe te rekenen dat het papier tegen zijn wil in omloop is of dat zijn handtekening vals of
      het papier vervalst is, de bevoegdheid zich daarop te beroepen tegenover de verkrijger te goeder trouw en diens
      rechtsopvolgers.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel147
  - number: '148'
    text: |-
      De [artikelen 146][ref1] en [147][ref2] zijn van overeenkomstige toepassing in geval van vestiging van een beperkt
      recht op een vordering aan toonder of aan order.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel147
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '146'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '147'
        afdeling: '1'
  - number: '149.1'
    text: |-
      Oefent de schuldenaar na overgang van de vordering onder bijzondere titel jegens de oorspronkelijke schuldeiser
      een bevoegdheid uit tot vernietiging of ontbinding van de rechtshandeling waaruit de vordering voortspruit, dan is
      hij verplicht om de nieuwe schuldeiser zo spoedig mogelijk daarvan mededeling te doen, tenzij de vernietiging of
      ontbinding niet aan deze kan worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel149
  - number: '149.2'
    text: |-
      Na verjaring van de rechtsvordering tot vernietiging of ontbinding wordt een beroep op de vernietigings- of
      ontbindingsgrond ter afwering van een op de rechtshandeling steunende rechtsvordering of andere rechtsmaatregel
      gericht tot de nieuwe schuldeiser en is de schuldenaar verplicht zo spoedig mogelijk nadien mededeling daarvan aan
      de oorspronkelijke schuldeiser te doen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel149
  - number: '149.3'
    text: |-
      De vorige leden zijn van overeenkomstige toepassing ter zake van de uitoefening van een bevoegdheid van de
      schuldenaar tot vernietiging of ontbinding, nadat op de vordering met mededeling aan hem een beperkt recht is
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel149
  - number: '150'
    text: 'Een vordering gaat bij wijze van subrogatie over op een derde:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel150
  - number: 150.a
    text: indien een hem toebehorend goed voor de vordering wordt uitgewonnen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel150
  - number: 150.b
    text: indien hij de vordering voldoet omdat een hem toebehorend goed voor de vordering verbonden is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel150
  - number: 150.c
    text: |-
      indien hij de vordering voldoet om uitwinning te voorkomen van een hem niet toebehorend goed, mits door de
      uitwinning een recht dat hij op het goed heeft, verloren zou gaan of de voldoening van een hem toekomend
      vorderingsrecht in gevaar zou worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel150
  - number: 150.d
    text: |-
      krachtens overeenkomst tussen de derde die de vordering voldoet en de schuldenaar, mits de schuldeiser op het
      tijdstip van de voldoening deze overeenkomst kende of hem daarvan kennis was gegeven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel150
  - number: '151.1'
    text: |-
      Subrogatie overeenkomstig [artikel 150][ref1] vindt niet plaats voor zover de schuld de derde aangaat in zijn
      verhouding tot de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel150
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '150'
        afdeling: '2'
  - number: '151.2'
    text: |-
      De rechten van de schuldeiser jegens borgen en personen die geen schuldenaar zijn, gaan slechts op de derde over
      tot ten hoogste de bedragen, waarvoor de schuld ieder van hen aangaat in hun verhouding tot de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel151
  - number: '152.1'
    text: |-
      Blijkt verhaal krachtens subrogatie overeenkomstig [artikel 150][ref1] geheel of gedeeltelijk onmogelijk, dan
      wordt het onvoldaan gebleven deel over de gesubrogeerde en andere in lid 2 van het vorige artikel genoemde
      derden omgeslagen naar evenredigheid van de bedragen waarvoor ieder op het tijdstip van de voldoening jegens de
      schuldeiser aansprakelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel150
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '150'
        afdeling: '2'
  - number: '152.2'
    text: |-
      De gesubrogeerde kan van geen der andere bij de omslag betrokken derden een groter bedrag vorderen dan de
      oorspronkelijke schuldeiser op het tijdstip van de voldoening op deze had kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel152
  - number: '152.3'
    text: |-
      Ieder der in de omslag betrokkenen blijft gerechtigd het bijgedragene alsnog van hem die geen verhaal bood, terug
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel152
  - number: '153'
    text: |-
      In het geval van subrogatie in de hoofdvordering verkrijgt de gesubrogeerde het recht op bedongen rente slechts
      voor zover deze betrekking heeft op het tijdvak na de overgang.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel153
  - number: '154'
    text: |-
      De schuldeiser is jegens degene die, zo hij de vordering voldoet, zal worden gesubrogeerd, verplicht zich te
      onthouden van elke gedraging die ten koste van deze afbreuk doet aan de rechten waarin hij mag verwachten krachtens
      de subrogatie te zullen treden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel154
  - number: '155'
    text: |-
      Een schuld gaat van de schuldenaar over op een derde, indien deze haar van de schuldenaar overneemt. De
      schuldoverneming heeft pas werking jegens de schuldeiser, indien deze zijn toestemming geeft nadat partijen hem van
      de overneming kennis hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel155
  - number: '156.1'
    text: |-
      Heeft de schuldeiser bij voorbaat zijn toestemming tot een schuldoverneming gegeven, dan vindt de overgang plaats,
      zodra de schuldenaar tot overeenstemming is gekomen met de derde en partijen de schuldeiser schriftelijk van de
      overneming kennis hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel156
  - number: '156.2'
    text: |-
      De schuldeiser kan een bij voorbaat gegeven toestemming niet herroepen, tenzij hij zich de bevoegdheid daartoe bij
      de toestemming heeft voorbehouden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel156
  - number: '157.1'
    text: |-
      De bij de vordering behorende nevenrechten worden na het tijdstip van de overgang tegen de nieuwe in plaats van
      tegen de oude schuldenaar uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel157
  - number: '157.2'
    text: |-
      Tot zekerheid van de overgegane schuld strekkende rechten van pand en hypotheek op een aan een der partijen
      toebehorend goed blijven bestaan; die op een niet aan partijen toebehorend goed en rechten uit borgtocht gaan door
      de overgang teniet, tenzij de pand- of hypotheekgever of borg tevoren in handhaving heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel157
  - number: '157.3'
    text: |-
      Voorrechten op bepaalde goederen waarop de schuldeiser niet tevens een verhaalsrecht jegens derden heeft, gaan door
      de overgang teniet, tenzij de schuldoverneming plaatsvindt ter uitvoering van de overdracht van een onderneming
      waartoe ook het goed waarop het voorrecht rust, behoort. Voorrechten op het vermogen van de schuldenaar gelden na
      de overgang als voorrechten op het vermogen van de nieuwe schuldenaar.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel157
  - number: '157.4'
    text: |-
      Bedongen rechten en boeten, alsmede dwangsommen die vóór de overgang aan de schuldenaar werden opgelegd, worden
      door de nieuwe in plaats van door de oude schuldenaar verschuldigd, voor zover zij na het tijdstip van de overgang
      zijn opeisbaar geworden of verbeurd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel157
  - number: '158'
    text: |-
      Indien de rechtsverhouding tussen de vorige en de nieuwe schuldenaar op grond waarvan de schuld is overgenomen,
      nietig, vernietigd of ontbonden is, kan de schuldeiser de schuld weer op de vorige schuldenaar doen overgaan door
      daartoe strekkende kennisgevingen aan de beide betrokken partijen; elk van hen kan de schuldeiser daartoe een
      redelijke termijn stellen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel158
  - number: '159.1'
    text: |-
      Een partij bij een overeenkomst kan haar rechtsverhouding tot de wederpartij met medewerking van deze laatste
      overdragen aan een derde bij een tussen haar en de derde opgemaakte akte.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel159
  - number: '159.2'
    text: |-
      Hierdoor gaan alle rechten en verplichtingen over op de derde, voor zover niet ten aanzien van bijkomstige of reeds
      opeisbaar geworden rechten of verplichtingen anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel159
  - number: '159.3'
    text: |-
      [Artikel 156][ref1] en de [leden 1-3 van artikel 157][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel157
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '156'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '157'
        afdeling: '3'
  - number: '160.1'
    text: |-
      Een verbintenis gaat teniet door een overeenkomst van de schuldeiser met de schuldenaar, waarbij hij van zijn
      vorderingsrecht afstand doet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel160
  - number: '160.2'
    text: |-
      Een door de schuldeiser tot de schuldenaar gericht aanbod tot afstand om niet geldt als aanvaard, wanneer de
      schuldenaar van het aanbod heeft kennisgenomen en het niet onverwijld heeft afgewezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel160
  - number: '160.3'
    text: |-
      De [artikelen 48 leden 1 en 2][ref1] en[ 49 leden 1-3][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '48'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '49'
        afdeling: '6'
  - number: '161.1'
    text: |-
      Een verbintenis gaat teniet door vermenging, wanneer door overgang van de vordering of de schuld de hoedanigheid
      van schuldeiser en die van schuldenaar zich in één persoon verenigen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
  - number: '161.2'
    text: 'Het vorige lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
  - number: 161.2.a
    text: zolang de vordering en de schuld in van elkaar gescheiden vermogens vallen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
  - number: 161.2.b
    text: |-
      in geval van overdracht overeenkomstig [artikel 93 van Boek 3][ref1] van een vordering aan toonder of order;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel93
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '93'
  - number: 161.2.c
    text: |-
      indien de voormelde vereniging van hoedanigheden het gevolg is van een rechtshandeling onder ontbindende
      voorwaarde, zolang niet vaststaat dat de voorwaarde niet meer in vervulling kan gaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
  - number: '161.3'
    text: Tenietgaan van een verbintenis door vermenging laat de op de vordering rustende rechten van derden onverlet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel161
  - number: '162.1'
    text: |-
      Hij die jegens een ander een onrechtmatige daad pleegt, welke hem kan worden toegerekend, is verplicht de schade
      die de ander dientengevolge lijdt, te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel162
  - number: '162.2'
    text: |-
      Als onrechtmatige daad worden aangemerkt een inbreuk op een recht en een doen of nalaten in strijd met een
      wettelijke plicht of met hetgeen volgens ongeschreven recht in het maatschappelijk verkeer betaamt, een en ander
      behoudens de aanwezigheid van een rechtvaardigingsgrond.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel162
  - number: '162.3'
    text: |-
      Een onrechtmatige daad kan aan de dader worden toegerekend, indien zij te wijten is aan zijn schuld of aan een
      oorzaak welke krachtens de wet of de in het verkeer geldende opvattingen voor zijn rekening komt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel162
  - number: '163'
    text: |-
      Geen verplichting tot schadevergoeding bestaat, wanneer de geschonden norm niet strekt tot bescherming tegen de
      schade zoals de benadeelde die heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel163
  - number: '164'
    text: |-
      Een gedraging van een kind dat de leeftijd van veertien jaren nog niet heeft bereikt, kan aan hem niet als een
      onrechtmatige daad worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel164
  - number: '165.1'
    text: |-
      De omstandigheid dat een als een doen te beschouwen gedraging van een persoon van veertien jaren of ouder verricht
      is onder invloed van een geestelijke of lichamelijke tekortkoming, is geen beletsel haar als een onrechtmatige daad
      aan de dader toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel165
  - number: '165.2'
    text: |-
      Is jegens de benadeelde tevens een derde wegens onvoldoende toezicht aansprakelijk, dan is deze derde jegens de
      dader verplicht tot bijdragen in de schadevergoeding voor het gehele bedrag van zijn aansprakelijkheid jegens de
      benadeelde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel165
  - number: '166.1'
    text: |-
      Indien één van tot een groep behorende personen onrechtmatig schade toebrengt en de kans op het aldus toebrengen
      van schade deze personen had behoren te weerhouden van hun gedragingen in groepsverband, zijn zij hoofdelijk
      aansprakelijk indien deze gedragingen hun kunnen worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel166
  - number: '166.2'
    text: |-
      Zij moeten onderling voor gelijke delen in de schadevergoeding bijdragen, tenzij in de omstandigheden van het geval
      de billijkheid een andere verdeling vordert.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel166
  - number: '167.1'
    text: |-
      Wanneer iemand krachtens deze titel jegens een ander aansprakelijk is ter zake van een onjuiste of door
      onvolledigheid misleidende publicatie van gegevens van feitelijke aard, kan de rechter hem op vordering van die
      ander veroordelen tot openbaarmaking van een rectificatie op een door de rechter aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel167
  - number: '167.2'
    text: |-
      Hetzelfde geldt, indien aansprakelijkheid ontbreekt, omdat de publicatie aan de dader wegens diens onbekendheid met
      de onjuistheid of onvolledigheid niet als een onrechtmatige daad is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel167
  - number: '167.3'
    text: |-
      In het geval van lid 2 kan de rechter die de vordering toewijst bepalen dat de kosten van het geding en van de
      openbaarmaking van de rectificatie geheel of gedeeltelijk moeten worden gedragen door degene die de vordering
      heeft ingesteld. Elk der partijen heeft voor het gedeelte van de kosten van het geding en van de openbaarmaking
      van de rectificatie dat ingevolge de uitspraak door hem moet worden gedragen, verhaal op ieder die voor de door de
      publicatie ontstane schade aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel167
  - number: '168.1'
    text: |-
      De rechter kan een vordering, strekkende tot verbod van een onrechtmatige gedraging, afwijzen op de grond dat deze
      gedraging op grond van zwaarwegende maatschappelijke belangen behoort te worden geduld. De benadeelde behoudt zijn
      recht op vergoeding van de schade overeenkomstig de onderhavige titel.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel168
  - number: '168.2'
    text: |-
      In het geval van [artikel 170][ref1] is de ondergeschikte voor deze schade niet aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel170
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '170'
        afdeling: '2'
  - number: '168.3'
    text: |-
      Wordt aan een veroordeling tot schadevergoeding of tot het stellen van zekerheid daarvoor niet voldaan, dan kan de
      rechter alsnog een verbod van de gedraging opleggen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel168
  - number: '169.1'
    text: |-
      Voor schade aan een derde toegebracht door een als een doen te beschouwen gedraging van een kind dat nog niet de
      leeftijd van veertien jaren heeft bereikt en aan wie deze gedraging als een onrechtmatige daad zou kunnen worden
      toegerekend als zijn leeftijd daaraan niet in de weg zou staan, is degene die het ouderlijk gezag of de voogdij
      over het kind uitoefent, aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel169
  - number: '169.2'
    text: |-
      Voor schade, aan een derde toegebracht door een fout van een kind dat de leeftijd van veertien jaren al wel
      maar die van zestien jaren nog niet heeft bereikt, is degene die het ouderlijk gezag of de voogdij over het kind
      uitoefent, aansprakelijk, tenzij hem niet kan worden verweten dat hij de gedraging van het kind niet heeft belet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel169
  - number: '170.1'
    text: |-
      Voor schade, aan een derde toegebracht door een fout van een ondergeschikte, is degene in wiens dienst de
      ondergeschikte zijn taak vervult aansprakelijk, indien de kans op de fout door de opdracht tot het verrichten
      van deze taak is vergroot en degene in wiens dienst hij stond, uit hoofde van hun desbetreffende rechtsbetrekking
      zeggenschap had over de gedragingen waarin de fout was gelegen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel170
  - number: '170.2'
    text: |-
      Stond de ondergeschikte in dienst van een natuurlijke persoon en was hij niet werkzaam voor een beroep of bedrijf
      van deze persoon, dan is deze slechts aansprakelijk, indien de ondergeschikte bij het begaan van de fout handelde
      ter vervulling van de hem opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel170
  - number: '170.3'
    text: |-
      Zijn de ondergeschikte en degene in wiens dienst hij stond, beiden voor de schade aansprakelijk, dan behoeft de
      ondergeschikte in hun onderlinge verhouding niet in de schadevergoeding bij te dragen, tenzij de schade een gevolg
      is van zijn opzet of bewuste roekeloosheid. Uit de omstandigheden van het geval, mede gelet op de aard van hun
      verhouding, kan anders voortvloeien dan in de vorige zin is bepaald.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel170
  - number: '171'
    text: |-
      Indien een niet ondergeschikte die in opdracht van een ander werkzaamheden ter uitoefening van diens bedrijf
      verricht, jegens een derde aansprakelijk is voor een bij die werkzaamheden begane fout, is ook die ander jegens de
      derde aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel171
  - number: '172'
    text: |-
      Indien een gedraging van een vertegenwoordiger ter uitoefening van de hem als zodanig toekomende bevoegdheden een
      fout jegens een derde inhoudt, is ook de vertegenwoordigde jegens de derde aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel172
  - number: '173.1'
    text: |-
      De bezitter van een roerende zaak waarvan bekend is dat zij, zo zij niet voldoet aan de eisen die men in de
      gegeven omstandigheden aan de zaak mag stellen, een bijzonder gevaar voor personen of zaken oplevert, is, wanneer
      dit gevaar zich verwezenlijkt, aansprakelijk, tenzij aansprakelijkheid op grond van de vorige afdeling zou hebben
      ontbroken indien hij dit gevaar op het tijdstip van ontstaan daarvan zou hebben gekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel173
  - number: '173.2'
    text: |-
      Indien de zaak niet aan de in het vorige lid bedoelde eisen voldoet wegens een gebrek als bedoeld in
      [afdeling 3 van titel 3][ref1], bestaat geen aansprakelijkheid op grond van het vorige lid voor schade als in die
      afdeling bedoeld, tenzij


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: 173.2.a
    text: |-
      alle omstandigheden in aanmerking genomen, aannemelijk is dat het gebrek niet bestond op het tijdstip waarop het
      produkt in het verkeer is gebracht of dat het gebrek op een later tijdstip is ontstaan; of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel173
  - number: 173.2.b
    text: |-
      het betreft zaakschade ter zake waarvan krachtens [afdeling 3 van titel 3][ref1] geen recht op vergoeding bestaat
      op grond van de in die afdeling geregelde franchise.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: '173.3'
    text: De vorige leden zijn niet van toepassing op dieren, schepen en luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel173
  - number: '174.1'
    text: |-
      De bezitter van een opstal die niet voldoet aan de eisen die men daaraan in de gegeven omstandigheden mag stellen,
      en daardoor gevaar voor personen of zaken oplevert, is, wanneer dit gevaar zich verwezenlijkt, aansprakelijk,
      tenzij aansprakelijkheid op grond van de vorige afdeling zou hebben ontbroken indien hij dit gevaar op het tijdstip
      van het ontstaan ervan zou hebben gekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '174.2'
    text: |-
      Bij erfpacht rust de aansprakelijkheid op de bezitter van het erfpachtsrecht. Bij openbare wegen rust zij op
      het overheidslichaam dat moet zorgen dat de weg in goede staat verkeert, bij kabels en leidingen op de kabel- en
      leidingbeheerder, behalve voor zover de kabel of leiding zich bevindt in een gebouw of werk en strekt tot toevoer
      of afvoer ten behoeve van dat gebouw of werk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '174.3'
    text: |-
      Bij ondergrondse werken rust de aansprakelijkheid op degene die op het moment van het bekend worden van de schade
      het werk in de uitoefening van zijn bedrijf gebruikt. Indien na het bekend worden van de schade een ander gebruiker
      wordt, blijft de aansprakelijkheid rusten op degene die ten tijde van dit bekend worden gebruiker was. Indien de
      schade is bekend geworden na beëindiging van het gebruik van het ondergrondse werk, rust de aansprakelijkheid op
      degene die de laatste gebruiker was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '174.4'
    text: |-
      Onder opstal in dit artikel worden verstaan gebouwen en werken, die duurzaam met de grond zijn verenigd, hetzij
      rechtstreeks, hetzij door vereniging met andere gebouwen of werken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '174.5'
    text: |-
      Degene die in de openbare registers als eigenaar van de opstal of van de grond staat ingeschreven, wordt vermoed de
      bezitter van de opstal te zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '174.6'
    text: Voor de toepassing van dit artikel wordt onder openbare weg mede begrepen het weglichaam, alsmede de weguitrusting.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel174
  - number: '175.1'
    text: |-
      Degene die in de uitoefening van zijn beroep of bedrijf een stof gebruikt of onder zich heeft, terwijl van deze
      stof bekend is dat zij zodanige eigenschappen heeft, dat zij een bijzonder gevaar van ernstige aard voor personen
      of zaken oplevert, is aansprakelijk, wanneer dit gevaar zich verwezenlijkt. Onder degene die een bedrijf uitoefent,
      wordt mede begrepen elke rechtspersoon die de stof in de uitoefening van zijn taak gebruikt of onder zich heeft.
      Als bijzonder gevaar van ernstige aard geldt in elk geval dat de stof ontplofbaar, oxyderend, ontvlambaar, licht
      ontvlambaar of zeer licht ontvlambaar, dan wel vergiftig of zeer vergiftig is volgens de criteria en methoden,
      vastgesteld krachtens [artikel 9.2.3.1, derde lid, van de Wet milieubeheer][ref1] of indien de stof als zodanig
      is ingedeeld overeenkomstig de artikelen 3 en 4 en titel II van verordening (EG) nr. 1272/2008 van het Europees
      Parlement en de Raad van de Europese Unie van 16 december 2008 betreffende de indeling, etikettering en verpakking
      van stoffen en mengsels tot wijziging en intrekking van de Richtlijnen 67/548/EEG en 1999/45/EG en tot wijziging
      van Verordening (EG) nr. 1907/2006 (PbEU L 353).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '175.2'
    text: |-
      Bevindt de stof zich in de macht van een bewaarder die er zijn bedrijf van maakt zodanige stoffen te bewaren, dan
      rust de aansprakelijkheid uit het eerste lid op deze. Met een zodanige bewaarder wordt gelijkgesteld de vervoerder,
      expediteur, stuwadoor, bewaarder of soortgelijke ondernemer, die de stof ten vervoer of uit hoofde van een met
      het vervoer samenhangende overeenkomst in ontvangst heeft genomen, zulks voor de periode waarin de stof zich in
      zijn macht bevindt zonder dat [afdeling 4 van titel 6][ref1], [4 van titel 11][ref2], [1 van titel 14][ref3] of
      [4 van titel 19 van Boek 8][ref4] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Afdeling1
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005034
        afdeling: '4'
  - number: '175.3'
    text: |-
      Bevindt de stof zich in een leiding, dan rust de aansprakelijkheid uit het eerste lid op de leidingbeheerder,
      behalve voor zover de leiding zich bevindt in een gebouw of werk en strekt tot toevoer of afvoer ten behoeve van
      dit gebouw of werk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
  - number: '175.4'
    text: |-
      Is de schade een gevolg van verontreiniging met de stof van lucht, water of bodem, dan rust de aansprakelijkheid
      uit het eerste lid op degene die bij de aanvang van de tot verontreiniging leidende gebeurtenis door dit artikel
      als aansprakelijke persoon werd aangewezen. Heeft de verontreiniging plaatsgevonden doordat de stof in verpakte
      toestand in water of bodem is gekomen of op de bodem is achtergelaten, dan wordt die gebeurtenis geacht op dit
      tijdstip reeds te zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
  - number: '175.5'
    text: |-
      Vormt de stof, al of niet tezamen met andere bestanddelen, een roerende zaak als bedoeld in
      [artikel 173 lid 1][ref1], is zij in een zodanige zaak verpakt of is zij opgeslagen in een daartoe bestemd gebouw
      of werk als bedoeld in [artikel 174, vierde lid][ref2], dan rust de aansprakelijkheid uit de [artikelen 173][ref3]
      en [174][ref4], voor wat betreft de schade die door verwezenlijking van het aan de stof verbonden gevaar is
      veroorzaakt, op dezelfde persoon als op wie krachtens de voorgaande leden aansprakelijkheid ter zake van de stof
      rust.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel174
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
  - number: '175.6'
    text: |-
      Een stof wordt geacht aan de omschrijving van de eerste zin van het eerste lid te voldoen, wanneer zij bij algemene
      maatregel van bestuur als zodanig is aangewezen. Een stof kan in elk geval worden aangewezen, als:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
  - number: 175.6.a
    text: |-
      zij volgens de criteria en methoden, vastgesteld krachtens
      [artikel 9.2.3.1, derde lid, van de Wet milieubeheer][ref1], behoort tot een der categorieën bedoeld in het
      [tweede lid van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 175.6.b
    text: |-
      zij is ingedeeld overeenkomstig de artikelen 3 en 4 en titel II van verordening (EG) nr. 1272/2008 van het Europees
      Parlement en de Raad van de Europese Unie van 16 december 2008 betreffende de indeling, etikettering en verpakking
      van stoffen en mengsels tot wijziging en intrekking van de Richtlijnen 67/548/EEG en 1999/45/EG en tot wijziging
      van Verordening (EG) nr. 1907/2006 (PbEU L 353).
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel175
  - number: '176.1'
    text: |-
      De exploitant van een stortplaats is aansprakelijk voor de schade die voor of na de sluiting van de stortplaats
      ontstaat als gevolg van verontreiniging van lucht, water of bodem met de daar voor die sluiting gestorte stoffen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: '176.2'
    text: 'In dit artikel wordt onder exploitant van een stortplaats verstaan:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: 176.2.a
    text: |-
      degene voor wie een omgevingsvergunning geldt als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] om op het in lid 6 bedoelde
      terrein een stortplaats op te richten, te veranderen of de werking daarvan te veranderen of in werking te hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 176.2.b
    text: een ieder die de stortplaats exploiteert zonder dat voor hem een zodanige vergunning geldt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: '176.3'
    text: |-
      Indien na het bekend worden van de schade een ander exploitant van de stortplaats wordt, blijft de
      aansprakelijkheid voor die schade rusten op degene die tijdens dit bekend worden exploitant was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: '176.4'
    text: |-
      Indien de schade is bekend geworden na de sluiting van de stortplaats, rust de aansprakelijkheid op degene die de
      laatste exploitant was. Geen aansprakelijkheid op grond van dit artikel bestaat, wanneer op het tijdstip waarop
      de schade bekend wordt, meer dan twintig jaren waren verstreken nadat de stortplaats was gesloten met inachtneming
      van de geldende overheidsvoorschriften, of de schade een gevolg is van gebruik van de grond in strijd met hetgeen
      wegens de aanwezigheid van de gesloten stortplaats omtrent dit gebruik is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: '176.5'
    text: |-
      Indien de exploitatie als stortplaats wettelijk is toegelaten, zijn degenen die de stoffen waardoor
      de verontreiniging is opgetreden, daar hebben gestort of doen storten, noch aansprakelijk krachtens
      [artikel 175][ref1], noch krachtens [afdeling 4 van titel 6][ref2], [4 van titel 11][ref3], [1 van titel 14][ref4]
      of [4 van titel 19 van Boek 8][ref5]. Indien op de stortplaats een zaak als bedoeld in [artikel 173][ref6] of
      een stof als bedoeld in [artikel 175][ref7] is gestort, rust de aansprakelijkheid uit die artikelen op degene die
      krachtens de voorgaande leden als exploitant van de stortplaats aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Afdeling1
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Afdeling4
      [ref6]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref7]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005034
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
  - number: '176.6'
    text: |-
      Onder stortplaats is begrepen elk terrein dat door de exploitant daarvan is bestemd voor het storten van al of
      niet verpakte, geheel of ten dele van anderen afkomstige stoffen met als doel dat de exploitant of die anderen zich
      van die stoffen ontdoen door ze daar op of in de bodem te brengen. Onder storten wordt mede begrepen elke vorm van
      deponeren of afgeven van de stof op de stortplaats.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel176
  - number: '177.1'
    text: |-
      De exploitant van een mijnbouwwerk als bedoeld in [artikel 1, onderdeel n, van de Mijnbouwwet][ref1] is
      aansprakelijk voor de schade die ontstaat door:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 177.1.a
    text: |-
      uitstroming van delfstoffen als bedoeld in [artikel 1, onderdeel a, van de Mijnbouwwet][ref1] als gevolg van
      het niet beheersen van de ondergrondse natuurkrachten die door de aanleg of bij de exploitatie van het werk zijn
      ontketend;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 177.1.b
    text: beweging van de bodem als gevolg van de aanleg of de exploitatie van dat werk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
  - number: '177.2'
    text: 'In dit artikel wordt onder exploitant van een mijnbouwwerk verstaan:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
  - number: 177.2.a
    text: |-
      de houder van een vergunning als bedoeld in [artikel 6][ref1] of [25 van de Mijnbouwwet][ref2], die een
      mijnbouwwerk aanlegt of doet aanleggen dan wel in gebruik heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 177.2.b
    text: |-
      een ieder die, anders dan als ondergeschikte, een mijnbouwwerk aanlegt of doet aanleggen dan wel in gebruik heeft
      zonder dat hij houder is van een vergunning als bedoeld in onderdeel a, tenzij hij in opdracht van een ander
      handelt die houder is van een vergunning als vorenbedoeld dan wel, indien die ander dat niet is, hij daarmee niet
      bekend was of behoorde te zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
  - number: '177.3'
    text: |-
      Voor schade door uitstroming van delfstoffen is aansprakelijk degene die ten tijde van de gebeurtenis waardoor
      de uitstroming plaatsvindt, exploitant van een mijnbouwwerk is. Indien na deze gebeurtenis een ander exploitant
      wordt van het mijnbouwwerk, blijft de aansprakelijkheid voor deze schade rusten op degene die ten tijde van
      die gebeurtenis exploitant was. Indien de gebeurtenis plaatsvindt nadat het mijnbouwwerk is verlaten, rust
      de aansprakelijkheid op degene die de laatste exploitant van het werk was, tenzij op het tijdstip van die
      gebeurtenis meer dan vijf jaren waren verstreken nadat het werk was verlaten met inachtneming van de geldende
      overheidsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
  - number: '177.4'
    text: |-
      Voor schade door beweging van de bodem is aansprakelijk degene die ten tijde van het bekend worden van deze schade
      exploitant is. Indien na het bekend worden een ander exploitant wordt, blijft de aansprakelijkheid rusten op
      degene die ten tijde van dit bekend worden exploitant was. Indien deze schade bekend wordt na sluiting van het
      mijnbouwwerk, rust de aansprakelijkheid op degene die de laatste exploitant was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
  - number: '177.5'
    text: |-
      Indien op de gebeurtenis waardoor de uitstroming of de beweging van de bodem is ontstaan, tevens een
      aansprakelijkheid uit [artikel 173][ref1], [174][ref2] of [175][ref3] kan worden gegrond, rust die
      aansprakelijkheid, wat betreft de door die uitstroming of beweging van de bodem veroorzaakte schade, op dezelfde
      persoon als op wie de aansprakelijkheid ter zake van het mijnbouwwerk rust.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
  - number: '178'
    text: |-
      Geen aansprakelijkheid krachtens [artikel 175][ref1], [176][ref2] of [177][ref3] bestaat indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel176
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel177
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '176'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '177'
        afdeling: '2'
  - number: 178.a
    text: de schade is veroorzaakt door gewapend conflict, burgeroorlog, opstand, binnenlandse onlusten, oproer of muiterij;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
  - number: 178.b
    text: |-
      de schade is veroorzaakt door een natuurgebeuren van uitzonderlijke, onvermijdelijke en onweerstaanbare aard,
      behoudens de in [artikel 177 lid 1][ref1] bedoelde ondergrondse natuurkrachten in het geval van dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel177
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '177'
        afdeling: '2'
  - number: 178.c
    text: de schade is veroorzaakt uitsluitend door voldoening aan een bevel of dwingend voorschrift van de overheid;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
  - number: 178.d
    text: |-
      de schade is veroorzaakt bij een handeling met een stof als bedoeld in [artikel 175][ref1] in het belang van de
      benadeelde zelf, waarbij het jegens deze redelijk was hem aan het gevaar voor schade bloot te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
  - number: 178.e
    text: |-
      de schade is veroorzaakt uitsluitend door een handelen of nalaten van een derde, geschied met het opzet schade te
      veroorzaken, zulks onverminderd het bepaalde in de [artikelen 170][ref1] en [171][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel171
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '170'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '171'
        afdeling: '2'
  - number: 178.f
    text: |-
      het gaat om hinder, verontreiniging of andere gevolgen, ter zake waarvan aansprakelijkheid op grond van de vorige
      afdeling zou hebben ontbroken, zo zij door de aangesprokene bewust zouden zijn veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel178
  - number: '179'
    text: |-
      De bezitter van een dier is aansprakelijk voor de door het dier aangerichte schade, tenzij aansprakelijkheid op
      grond van de vorige afdeling zou hebben ontbroken indien hij de gedraging van het dier waardoor de schade werd
      toegebracht, in zijn macht zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel179
  - number: '180.1'
    text: |-
      In de gevallen van de [artikelen 173][ref1], [174][ref2] en [179][ref3] zijn medebezitters hoofdelijk
      aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '179'
        afdeling: '2'
  - number: '180.2'
    text: |-
      In geval van overdracht van een zaak onder opschortende voorwaarde van voldoening van een tegenprestatie rust
      de aansprakelijkheid die de [artikelen 173][ref1], [174][ref2] en [179][ref3] op de bezitter leggen, vanaf het
      tijdstip van deze overdracht op de verkrijger.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '179'
        afdeling: '2'
  - number: '181.1'
    text: |-
      Worden de in de [artikelen 173][ref1], [174][ref2] en [179][ref3] bedoelde zaken, opstallen of dieren
      gebruikt in de uitoefening van een bedrijf, dan rust de aansprakelijkheid uit de [artikelen 173 lid 1][ref4],
      [174 lid 1 en lid 2, eerste zin][ref5], en [179][ref6] op degene die dit bedrijf uitoefent, tenzij het een opstal
      betreft en het ontstaan van de schade niet met de uitoefening van het bedrijf in verband staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel174
      [ref6]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '179'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '174'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005289
        artikel: '179'
        afdeling: '2'
  - number: '181.2'
    text: |-
      Wanneer de zaken, opstallen of dieren in de uitoefening van een bedrijf worden gebruikt door ze ter beschikking te
      stellen voor gebruik in de uitoefening van het bedrijf van een ander, dan wordt die ander als de uit hoofde van het
      vorige lid aansprakelijke persoon aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel181
  - number: '181.3'
    text: |-
      Wanneer een stof als bedoeld in [artikel 175][ref1] in de uitoefening van een bedrijf wordt gebruikt door deze stof
      ter beschikking te stellen voor gebruik in de uitoefening van het beroep of bedrijf van een ander, wordt die ander
      als de uit hoofde van [artikel 175 lid 1][ref2] aansprakelijke persoon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '175'
        afdeling: '2'
  - number: '182'
    text: |-
      Indien er in de gevallen van de [artikelen 176][ref1] en [177][ref2] tegelijkertijd twee of meer al of niet
      gezamenlijk handelende exploitanten zijn, zijn zij hoofdelijk aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel176
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel177
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '176'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '177'
        afdeling: '2'
  - number: '183.1'
    text: |-
      Ter zake van aansprakelijkheid op grond van deze afdeling kan de aangesprokene geen beroep doen op zijn jeugdige
      leeftijd of geestelijke of lichamelijke tekortkoming.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel183
  - number: '183.2'
    text: |-
      Degene die het ouderlijk gezag of voogdij uitoefent over een kind dat nog niet de leeftijd van veertien jaren
      heeft bereikt, is in zijn plaats uit de [artikelen 173][ref1] en [179][ref2] voor de daar bedoelde zaken en dieren
      aansprakelijk, tenzij deze worden gebruikt in de uitoefening van een bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '179'
        afdeling: '2'
  - number: '184.1'
    text: |-
      Onder de schade waarvoor op grond van de [artikelen 173-182][ref1] aansprakelijkheid bestaat, vallen ook:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel173
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '173'
        afdeling: '2'
  - number: 184.1.a
    text: |-
      de kosten van iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook genomen, nadat een
      ernstige en onmiddellijke dreiging is ontstaan dat schade zal worden veroorzaakt die krachtens die artikelen voor
      vergoeding in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel184
  - number: 184.1.b
    text: schade en verlies veroorzaakt door zulke maatregelen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel184
  - number: '184.2'
    text: |-
      Indien de maatregelen, bedoeld in het vorige lid, door een ander worden genomen dan degene die de schade zou hebben
      geleden ter zake waarvan de ernstige en onmiddellijke dreiging is ontstaan, kan deze ander slechts vergoeding van
      de in het vorige lid bedoelde kosten, schaden en verliezen vorderen, voor zover zij gevorderd hadden kunnen worden
      door degene die de dreigende schade zou hebben geleden, en kan de aangesprokene jegens die ander hetzelfde verweer
      voeren als hem jegens deze ten dienste zou hebben gestaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel184
  - number: '185.1'
    text: 'De producent is aansprakelijk voor de schade veroorzaakt door een gebrek in zijn produkt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.a
    text: hij het produkt niet in het verkeer heeft gebracht;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.b
    text: |-
      het, gelet op de omstandigheden, aannemelijk is dat het gebrek dat de schade heeft veroorzaakt, niet bestond op het
      tijdstip waarop hij het produkt in het verkeer heeft gebracht, dan wel dat dit gebrek later is ontstaan;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.c
    text: |-
      het produkt noch voor de verkoop of voor enige andere vorm van verspreiding met een economisch doel van de
      producent is vervaardigd, noch is vervaardigd of verspreid in het kader van de uitoefening van zijn beroep of
      bedrijf;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.d
    text: het gebrek een gevolg is van het feit dat het produkt in overeenstemming is met dwingende overheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.e
    text: |-
      het op grond van de stand van de wetenschappelijke en technische kennis op het tijdstip waarop hij het produkt in
      het verkeer bracht, onmogelijk was het bestaan van het gebrek te ontdekken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: 185.1.f
    text: |-
      wat de producent van een grondstof of fabrikant van een onderdeel betreft, het gebrek is te wijten aan het ontwerp
      van het produkt waarvan de grondstof of het onderdeel een bestanddeel vormt, dan wel aan de instructies die door de
      fabrikant van het produkt zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: '185.2'
    text: |-
      De aansprakelijkheid van de producent wordt verminderd of opgeheven rekening houdende met alle omstandigheden,
      indien de schade is veroorzaakt zowel door een gebrek in het produkt als door schuld van de benadeelde of een
      persoon voor wie de benadeelde aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: '185.3'
    text: |-
      De aansprakelijkheid van de producent wordt niet verminderd, indien de schade is veroorzaakt zowel door een gebrek
      in het produkt als door de gedraging van een derde.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel185
  - number: '186.1'
    text: |-
      Een produkt is gebrekkig, indien het niet de veiligheid biedt die men daarvan mag verwachten, alle omstandigheden
      in aanmerking genomen en in het bijzonder
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel186
  - number: 186.1.a
    text: de presentatie van het produkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel186
  - number: 186.1.b
    text: het redelijkerwijs te verwachten gebruik van het produkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel186
  - number: 186.1.c
    text: het tijdstip waarop het produkt in het verkeer werd gebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel186
  - number: '186.2'
    text: |-
      Een produkt mag niet als gebrekkig worden beschouwd uitsluitend omdat nadien een beter produkt in het verkeer is
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel186
  - number: '187.1'
    text: |-
      Onder product wordt voor de toepassing van deze afdeling verstaan een roerende zaak, ook nadat deze een bestanddeel
      is gaan vormen van een andere roerende of onroerende zaak, alsmede elektriciteit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel187
  - number: '187.2'
    text: |-
      Onder "producent" wordt voor de toepassing van [artikel 185 tot en met 193][ref1] verstaan de fabrikant van een
      eindprodukt, de producent van een grondstof of de fabrikant van een onderdeel, alsmede een ieder die zich als
      producent presenteert door zijn naam, zijn merk of een ander onderscheidingsteken op het produkt aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
        afdeling: '3'
  - number: '187.3'
    text: |-
      Onverminderd de aansprakelijkheid van de producent, wordt een ieder die een produkt in de Europese Economische
      Ruimte invoert om dit te verkopen, te verhuren, te leasen of anderszins te verstrekken in het kader van zijn
      commerciële activiteiten, beschouwd als producent; zijn aansprakelijkheid is dezelfde als die van de producent.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel187
  - number: '187.4'
    text: |-
      Indien niet kan worden vastgesteld wie de producent van het produkt is, wordt elke leverancier als producent
      ervan beschouwd, tenzij hij de benadeelde binnen een redelijke termijn de identiteit meedeelt van de producent
      of van degene die hem het produkt heeft geleverd. Indien ten aanzien van een in de Europese Economische Ruimte
      geïmporteerd produkt niet kan worden vastgesteld wie de importeur van dat produkt is, wordt eveneens elke
      leverancier als producent ervan beschouwd, tenzij hij de benadeelde binnen een redelijke termijn de identiteit
      meedeelt van de importeur in de Europese Economische Ruimte of van een leverancier binnen de Europese Economische
      Ruimte die hem het produkt heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel187
  - number: '188'
    text: De benadeelde moet de schade, het gebrek en het oorzakelijk verband tussen het gebrek en de schade bewijzen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel188
  - number: '189'
    text: |-
      Indien verschillende personen op grond van [artikel 185, eerste lid][ref1], aansprakelijk zijn voor dezelfde
      schade, is elk hunner voor het geheel aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
        afdeling: '3'
  - number: '190.1'
    text: |-
      De aansprakelijkheid, bedoeld in [artikel 185, eerste lid][ref1], bestaat voor


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
        afdeling: '3'
  - number: 190.1.a
    text: schade door dood of lichamelijk letsel;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel190
  - number: 190.1.b
    text: |-
      schade door het produkt toegebracht aan een andere zaak die gewoonlijk voor gebruik of verbruik in de privésfeer is
      bestemd en door de benadeelde ook hoofdzakelijk in de privésfeer is gebruikt of verbruikt, met toepassing van een
      franchise ten belope van € 500.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel190
  - number: '190.2'
    text: |-
      Het bedrag genoemd in het eerste lid wordt bij algemene maatregel van bestuur aangepast, indien op grond van
      artikel 18, tweede lid, van de EEG-richtlijn van 25 juli 1985 (*PbEG* nr. L 210) de in die richtlijn genoemde
      bedragen worden herzien.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel190
  - number: '191.1'
    text: |-
      De rechtsvordering tot schadevergoeding van de benadeelde tegen de producent ingevolge
      [artikel 185, eerste lid][ref1], verjaart door verloop van drie jaren na de aanvang van de dag, volgende op die
      waarop de benadeelde met de schade, het gebrek en de identiteit van de producent bekend is geworden of had moeten
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
        afdeling: '3'
  - number: '191.2'
    text: |-
      Het recht op schadevergoeding van de benadeelde jegens de producent ingevolge [artikel 185, eerste lid][ref1],
      vervalt door verloop van tien jaren na de aanvang van de dag, volgende op die waarop de producent de zaak die de
      schade heeft veroorzaakt, in het verkeer heeft gebracht. Hetzelfde geldt voor het recht van een derde die mede voor
      de schade aansprakelijk is, terzake van regres jegens de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
        afdeling: '3'
  - number: '192.1'
    text: |-
      De aansprakelijkheid van de producent uit hoofde van deze afdeling kan jegens de benadeelde niet worden uitgesloten
      of beperkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel192
  - number: '192.2'
    text: |-
      Is jegens de benadeelde tevens een derde aansprakelijk die het produkt niet gebruikt in de uitoefening van een
      beroep of bedrijf, dan kan niet ten nadele van die derde worden afgeweken van de regels inzake het regres.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel192
  - number: '193'
    text: |-
      Het recht op schadevergoeding jegens de producent uit hoofde van deze afdeling komt de benadeelde toe, onverminderd
      alle andere rechten of vorderingen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193
  - number: 193a.1
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.a
    text: 'consument: natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf;'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.b
    text: |-
      handelaar: natuurlijk persoon of rechtspersoon die handelt in de uitoefening van een beroep of bedrijf of degene
      die ten behoeve van hem handelt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.c
    text: 'product: goed, elektriciteit daaronder begrepen, of dienst;'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.d
    text: |-
      handelspraktijk: iedere handeling, omissie, gedraging, voorstelling van zaken of commerciële communicatie, met
      inbegrip van reclame en marketing, van een handelaar, die rechtstreeks verband houdt met de verkoopbevordering,
      verkoop of levering van een product aan consumenten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.e
    text: |-
      besluit over een overeenkomst: een door een consument genomen besluit over de vraag of, en, zo ja, hoe en op welke
      voorwaarden hij een product koopt, geheel of gedeeltelijk betaalt, behoudt of van de hand doet, of een contractueel
      recht uitoefent in verband met het product, ongeacht of de consument overgaat tot handelen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.f
    text: |-
      professionele toewijding: normale niveau van bijzondere vakkundigheid en van zorgvuldigheid dat redelijkerwijs
      van een handelaar ten aanzien van consumenten mag worden verwacht, in overeenstemming met de op hem rustende
      verantwoordelijkheid, voortvloeiend uit de voor die handelaar geldende professionele standaard en eerlijke
      marktpraktijken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.g
    text: |-
      uitnodiging tot aankoop: commerciële boodschap die de kenmerken en de prijs van het product op een aan het
      gebruikte medium aangepaste wijze vermeldt en de consument aldus in staat stelt een aankoop te doen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.h
    text: |-
      ongepaste beïnvloeding: uitbuiten van een machtspositie ten aanzien van de consument om, zelfs zonder gebruik
      van of dreiging met fysiek geweld, pressie uit te oefenen op een wijze die het vermogen van de consument om een
      geïnformeerd besluit te nemen, aanzienlijk beperkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.i
    text: |-
      gedragscode: regels die vaststellen hoe handelaren die zich aan de code binden, zich gedragen met betrekking tot
      een of meer bepaalde handelspraktijken of bedrijfssectoren en die niet bij of krachtens wettelijke voorschriften
      zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.j
    text: |-
      houder van een gedragscode: rechtspersoon of groep van handelaren die verantwoordelijk is voor het opstellen en
      herzien van een gedragscode of het toezien op de naleving van de gedragscode door degenen die zich hieraan hebben
      gebonden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.1.k
    text: |-
      richtlijn: richtlijn nr. 2005/29/EG van het Europees Parlement en de Raad van de Europese Unie van 11 mei 2005
      betreffende oneerlijke handelspraktijken van ondernemingen jegens consumenten op de interne markt (PbEG L 149).
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.2
    text: |-
      In deze afdeling wordt mede verstaan onder gemiddelde consument: het gemiddelde lid van een specifieke groep waarop
      de handelaar zich richt of het gemiddelde lid van een specifieke groep waarvan de handelaar redelijkerwijs kan
      voorzien dat die groep wegens hun geestelijke of lichamelijke beperking, hun leeftijd of goedgelovigheid bijzonder
      vatbaar is voor de handelspraktijk of voor het onderliggende product.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193a.3
    text: |-
      Deze afdeling is niet van toepassing op de certificering van goederen van edelmetaal en de vermelding van het
      edelmetaalgehalte voor deze goederen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193a
  - number: 193b.1
    text: Een handelaar handelt onrechtmatig jegens een consument indien hij een handelspraktijk verricht die oneerlijk is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193b.2
    text: 'Een handelspraktijk is oneerlijk indien een handelaar handelt:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193b.2.a
    text: in strijd met de vereisten van professionele toewijding, en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193b.2.b
    text: |-
      het vermogen van de gemiddelde consument om een geïnformeerd besluit te nemen merkbaar is beperkt of kan worden
      beperkt,
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193b.3
    text: 'Een handelspraktijk is in het bijzonder oneerlijk indien een handelaar:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193b.3.a
    text: |-
      een misleidende handelspraktijk verricht als bedoeld in de [artikelen 193c tot en met 193g][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193c
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193c
        afdeling: 3A
  - number: 193b.3.b
    text: |-
      een agressieve handelspraktijk verricht als bedoeld in de [artikelen 193h][ref1] en [193i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193h
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel193i
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193h
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 193i
        afdeling: 3A
  - number: 193b.4
    text: |-
      De gangbare en rechtmatige reclamepraktijk waarbij overdreven uitspraken worden gedaan of uitspraken die niet
      letterlijk dienen te worden genomen, maken een reclame op zich niet oneerlijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193b
  - number: 193c.1
    text: |-
      Een handelspraktijk is misleidend indien informatie wordt verstrekt die feitelijk onjuist is of die de gemiddelde
      consument misleidt of kan misleiden, al dan niet door de algemene presentatie van de informatie, zoals ten aanzien
      van:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.a
    text: het bestaan of de aard van het product;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.b
    text: |-
      de voornaamste kenmerken van het product, zoals beschikbaarheid, voordelen, risico’s, uitvoering, samenstelling,
      accessoires, klantenservice en klachtenbehandeling, procédé en datum van fabricage of verrichting, levering,
      geschiktheid voor het gebruik, gebruiksmogelijkheden, hoeveelheid, specificatie, geografische of commerciële
      oorsprong, van het gebruik te verwachten resultaten, of de resultaten en wezenlijke kenmerken van op het product
      verrichte tests of controles;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.c
    text: |-
      de verplichtingen van de handelaar, de motieven voor de handelspraktijk en de aard van het verkoopproces, een
      verklaring of een symbool in verband met directe of indirecte sponsoring of erkenning van de handelaar of het
      product;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.d
    text: de prijs of de wijze waarop de prijs wordt berekend, of het bestaan van een specifiek prijsvoordeel;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.e
    text: de noodzaak van een dienst, onderdeel, vervanging of reparatie;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.f
    text: |-
      de hoedanigheid, kenmerken en rechten van de handelaar of zijn tussenpersoon, zoals zijn identiteit, vermogen,
      kwalificaties, status, erkenning, affiliatie, connecties, industriële, commerciële of eigendomsrechten of zijn
      prijzen, bekroningen en onderscheidingen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.1.g
    text: |-
      de rechten van de consument waaronder het recht van herstel of vervanging van de afgeleverde zaak of het recht om
      de prijs te verminderen, of de risico’s die de consument eventueel loopt,
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.2
    text: 'Een handelspraktijk is eveneens misleidend indien:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.2.a
    text: |-
      door de marketing van het product waaronder het gebruik van vergelijkende reclame verwarring wordt geschapen ten
      aanzien van producten, handelsmerken, handelsnamen of andere onderscheidende kenmerken van een concurrent;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.2.b
    text: 'de handelaar een verplichting die is opgenomen in een gedragscode niet nakomt, voor zover:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.2.b.1°
    text: de verplichting concreet en kenbaar is, en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193c.2.b.2°
    text: de handelaar aangeeft dat hij aan die gedragscode gebonden is,
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193c
  - number: 193d.1
    text: Een handelspraktijk is bovendien misleidend indien er sprake is van een misleidende omissie.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193d
  - number: 193d.2
    text: |-
      Een misleidende omissie is iedere handelspraktijk waarbij essentiële informatie welke de gemiddelde consument nodig
      heeft om een geïnformeerd besluit over een transactie te nemen, wordt weggelaten, waardoor de gemiddelde consument
      een besluit over een overeenkomst neemt of kan nemen, dat hij anders niet had genomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193d
  - number: 193d.3
    text: |-
      Van een misleidende omissie is eveneens sprake indien essentiële informatie als bedoeld in lid 2 verborgen wordt
      gehouden of op onduidelijke, onbegrijpelijke, dubbelzinnige wijze dan wel laat verstrekt wordt, of het commerciële
      oogmerk, indien dit niet reeds duidelijk uit de context blijkt, niet laat blijken, waardoor de gemiddelde consument
      een besluit over een overeenkomst neemt of kan nemen, dat hij anders niet had genomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193d
  - number: 193d.4
    text: |-
      Bij de beoordeling of essentiële informatie is weggelaten of verborgen is gehouden worden de feitelijke context, de
      beperkingen van het communicatiemedium alsook de maatregelen die zijn genomen om de informatie langs andere wegen
      ter beschikking van de consument te stellen, in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193d
  - number: 193e
    text: |-
      In het geval van een uitnodiging tot aankoop is de volgende informatie, voor zover deze niet reeds uit de context
      blijkt, essentieel als bedoeld in [artikel 193d lid 2][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193d
        afdeling: 3A
  - number: 193e.a
    text: de voornaamste kenmerken van het product, in de mate waarin dit gezien het medium en het product passend is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
  - number: 193e.b
    text: |-
      de identiteit en het geografisch adres van de handelaar, zijn handelsnaam en, in voorkomend geval, de identiteit en
      het geografisch adres van de handelaar namens wie hij optreedt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
  - number: 193e.c
    text: |-
      de prijs, inclusief belastingen, of, als het om een product gaat waarvan de prijs redelijkerwijs niet vooraf kan
      worden berekend, de manier waarop de prijs wordt berekend en, in voorkomend geval, de extra vracht-, leverings-
      of portokosten of, indien deze kosten redelijkerwijs niet vooraf kunnen worden berekend, het feit dat deze extra
      kosten moeten worden betaald;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
  - number: 193e.d
    text: |-
      de wijze van betaling, levering, uitvoering en het beleid inzake klachtenbehandeling, indien deze afwijken van de
      vereisten van professionele toewijding; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
  - number: 193e.e
    text: indien er een recht op herroeping of annulering is, het bestaan van dit recht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193e
  - number: 193f
    text: |-
      Indien er sprake is van commerciële communicatie, reclame of marketing daaronder begrepen, is de informatie genoemd
      bij of krachtens de volgende artikelen in ieder geval essentieel als bedoeld in [artikel 193d lid 2][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193d
        afdeling: 3A
  - number: 193f.a
    text: |-
      [artikel 15d leden 1 en 2][ref1] en [artikel 15e lid 1 van Boek 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15e
  - number: 193f.b
    text: |-
      [artikel 46c lid 1 van Boek 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
  - number: 193f.c
    text: |-
      [artikel 501 lid 1 van Boek 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel501
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '501'
  - number: 193f.d
    text: |-
      [artikelen 73 tot en met 75 van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel73
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '73'
  - number: 193f.e
    text: |-
      [artikelen 4:20][ref1], [4:73][ref2] en [5:13 van de Wet op het financieel toezicht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 193f.f
    text: |-
      [artikel 2b van de Prijzenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002353#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193f
    references:
      - id: ref1
        bwb_id: BWBR0002353
        artikel: 2b
  - number: 193g
    text: 'De volgende handelspraktijken zijn onder alle omstandigheden misleidend:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.a
    text: beweren aan een gedragscode gebonden te zijn en daarnaar te handelen, wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.b
    text: |-
      een vertrouwens-, kwaliteits- of ander soortgelijk label aanbrengen zonder daarvoor de vereiste toestemming te
      hebben gekregen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.c
    text: beweren dat een gedragscode door een publieke of andere instantie is erkend wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.d
    text: |-
      beweren dat een handelaar of een product door een openbare of particuliere instelling is aanbevolen, erkend
      of goedgekeurd terwijl dat niet het geval is, of iets dergelijks beweren zonder dat aan de voorwaarde voor de
      aanbeveling, erkenning of goedkeuring is voldaan;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.e
    text: |-
      producten tegen een genoemde prijs te koop aanbieden zonder dat de handelaar aangeeft dat er een gegrond vermoeden
      bestaat dat hij deze producten of gelijkwaardige producten niet tegen die prijs kan leveren of door een andere
      handelaar kan doen leveren gedurende een periode en in hoeveelheden die, rekening houdend met het product, de
      omvang van de voor het product gevoerde reclame en de aangeboden prijs, redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.f
    text: 'producten tegen een genoemde prijs te koop aanbieden en vervolgens:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.f.1°
    text: weigeren het aangeboden artikel aan de consument te tonen, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.f.2°
    text: weigeren een bestelling op te nemen of het product binnen een redelijke termijn te leveren, of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.f.3°
    text: een exemplaar van het artikel met gebreken tonen, met de bedoeling een ander product aan te prijzen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.g
    text: |-
      bedrieglijk beweren dat het product slechts gedurende een zeer beperkte tijd beschikbaar zal zijn of dat
      het slechts onder speciale voorwaarden gedurende een zeer beperkte tijd beschikbaar zal zijn om de consument
      onmiddellijk te doen beslissen en hem geen kans of onvoldoende tijd te geven een geïnformeerd besluit te nemen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.h
    text: |-
      de consument met wie de handelaar voorafgaand aan de transactie heeft gecommuniceerd in een taal die geen officiële
      taal is van de lidstaat waar de handelaar gevestigd is, beloven een klantendienst te verschaffen en deze dienst
      vervolgens enkel beschikbaar te stellen in een andere taal zonder dit duidelijk aan de consument te laten weten
      alvorens de consument de overeenkomst aangaat;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.i
    text: beweren of anderszins de indruk wekken dat een product legaal kan worden verkocht terwijl dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.j
    text: wettelijke rechten van consumenten voorstellen als een onderscheidend kenmerk van het aanbod van de handelaar;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.k
    text: |-
      redactionele inhoud in de media, waarvoor de handelaar heeft betaald, gebruiken om reclame te maken voor een
      product, zonder dat dit duidelijk uit de inhoud of uit duidelijk door de consument identificeerbare beelden of
      geluiden blijkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.l
    text: |-
      feitelijk onjuiste beweringen doen betreffende de aard en de omvang van het gevaar dat de persoonlijke veiligheid
      van de consument of zijn gezin zou bedreigen indien de consument het product niet koopt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.m
    text: |-
      een product dat lijkt op een door een bepaalde fabrikant vervaardigd product op een zodanige wijze aanbevelen
      dat bij de consument doelbewust de verkeerde indruk wordt gewekt dat het product inderdaad door die fabrikant is
      vervaardigd, terwijl dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.n
    text: |-
      een piramidesysteem opzetten, beheren of aanbevelen waarbij de consument tegen betaling kans maakt op een
      vergoeding die eerder voortkomt uit het aanbrengen van nieuwe consumenten in het systeem dan uit de verkoop of het
      verbruik van goederen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.o
    text: beweren dat de handelaar op het punt staat zijn zaak te beëindigen of te verhuizen, indien dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.p
    text: beweren dat producten het winnen bij kansspelen kunnen vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.q
    text: bedrieglijk beweren dat een product ziekten, gebreken of misvormingen kan genezen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.r
    text: |-
      feitelijk onjuiste informatie verstrekken over marktomstandigheden of de mogelijkheid het product te bemachtigen
      met de bedoeling de consument het product te doen aanschaffen tegen voorwaarden die minder gunstig zijn dan de
      normale marktvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.s
    text: |-
      in de context van een handelspraktijk beweren dat er een wedstrijd wordt georganiseerd of prijzen worden uitgeloofd
      zonder de aangekondigde prijzen of een redelijk alternatief daadwerkelijk toe te kennen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.t
    text: |-
      een product als gratis, voor niets of kosteloos te omschrijven als de consument iets anders moet betalen dan de
      onvermijdelijke kosten om in te gaan op het aanbod en het product af te halen dan wel dit te laten bezorgen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.u
    text: |-
      marketingmateriaal voorzien van een factuur of een soortgelijk document waarin om betaling wordt gevraagd, waardoor
      bij de consument de indruk wordt gewekt dat hij het aangeprezen product al heeft besteld terwijl dat niet het geval
      is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.v
    text: |-
      op bedrieglijke wijze beweren of de indruk wekken dat de handelaar niet optreedt ten behoeve van zijn handel,
      bedrijf, ambacht of beroep of zich op bedrieglijke wijze voordoen als consument;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193g.w
    text: |-
      op bedrieglijke wijze de indruk wekken dat voor een bepaald product service na verkoop beschikbaar is in een andere
      lidstaat dan die waar het product wordt verkocht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193g
  - number: 193h.1
    text: |-
      Een handelspraktijk is in haar feitelijke context, al haar kenmerken en omstandigheden in aanmerking genomen,
      agressief indien door intimidatie, dwang, waaronder het gebruik van lichamelijk geweld, of ongepaste beïnvloeding,
      de keuzevrijheid of de vrijheid van handelen van de gemiddelde consument met betrekking tot het product aanzienlijk
      wordt beperkt of kan worden beperkt waardoor de gemiddelde consument een besluit over een overeenkomst neemt of kan
      nemen, dat hij anders niet had genomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2
    text: 'Bij de bepaling of een handelspraktijk agressief is, wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2.a
    text: het tijdstip, de plaats, de aard en de vasthoudendheid die bij de handelspraktijk wordt gedemonstreerd;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2.b
    text: het gebruik van dreigende gedragingen of dreigende of grove taal;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2.c
    text: |-
      het uitbuiten door de handelaar van bepaalde tegenslagen of omstandigheden die zo ernstig zijn dat zij het
      beoordelingsvermogen van de consument kunnen beperken, hetgeen de handelaar bekend is, met het oogmerk het besluit
      van de consument met betrekking tot het product te beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2.d
    text: |-
      bezwarende of disproportionele niet-contractuele belemmeringen die door de handelaar zijn opgelegd ten aanzien van
      een consument die zijn rechten uit de overeenkomst wenst uit te oefenen waaronder het recht om de overeenkomst te
      beëindigen of een ander product te kiezen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193h.2.e
    text: het dreigen met maatregelen die wettelijk niet kunnen worden genomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193h
  - number: 193i
    text: 'De volgende handelspraktijken zijn onder alle omstandigheden agressief:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.a
    text: de indruk geven dat de consument het pand niet mag verlaten alvorens er een overeenkomst is opgesteld;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.b
    text: |-
      het verzoek van de consument om zijn huis te verlaten of niet meer terug te komen, te negeren, behalve indien, en
      voor zover wettelijk gerechtvaardigd wordt beoogd een contractuele verplichting te doen naleven;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.c
    text: |-
      hardnekkig en ongewenst aandringen per telefoon, fax, e-mail of andere afstandsmedia tenzij, voorzover wettelijk
      gerechtvaardigd, wordt beoogd een contractuele verplichting te doen naleven;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.d
    text: |-
      een consument die op grond van een verzekeringspolis een vordering indient, om documenten vragen die redelijkerwijs
      niet relevant kunnen worden geacht om de geldigheid van de vordering te beoordelen, dan wel systematisch weigeren
      antwoord te geven op daaromtrent gevoerde correspondentie met de bedoeling de consument ervan te weerhouden zijn
      contractuele rechten uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.e
    text: |-
      kinderen in reclame er rechtstreeks toe aanzetten om geadverteerde producten te kopen of om hun ouders of andere
      volwassenen ertoe over te halen die producten voor hen te kopen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.f
    text: |-
      vragen om onmiddellijke dan wel uitgestelde betaling of om terugzending of bewaring van producten die de handelaar
      heeft geleverd, maar waar de consument niet om heeft gevraagd, tenzij het product een vervangingsgoed is als
      bedoeld in [artikel 46f lid 3 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46f
  - number: 193i.g
    text: |-
      de consument uitdrukkelijk meedelen dat, als hij het product of de dienst niet koopt, de baan of de
      bestaansmiddelen van de handelaar in het gedrang komen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.h
    text: |-
      de bedrieglijke indruk wekken dat de consument al een prijs heeft gewonnen of zal winnen dan wel door een bepaalde
      handeling te verrichten een prijs zal winnen of een ander soortgelijk voordeel zal behalen, als er in feite:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.h.1°
    text: geen sprake is van een prijs of een ander soortgelijk voordeel; of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193i.h.2°
    text: |-
      als het ondernemen van stappen om in aanmerking te komen voor de prijs of voor een ander soortgelijk voordeel
      afhankelijk is van de betaling van een bedrag door de consument of indien daaraan voor hem kosten zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193i
  - number: 193j.1
    text: |-
      Indien een vordering wordt ingesteld, of een verzoekschrift als bedoeld in [artikel 305d lid 1 van Boek 3][ref1]
      wordt ingediend ingevolge de [artikelen 193b tot en met 193i][ref2], rust op de handelaar de bewijslast ter zake
      van de materiële juistheid en volledigheid van de informatie die hij heeft verstrekt als dat passend lijkt, gelet
      op de omstandigheden van het geval en met inachtneming van de rechtmatige belangen van de handelaar en van elke
      andere partij bij de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305d
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel193b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193j
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305d
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 193b
        afdeling: 3A
  - number: 193j.2
    text: |-
      Indien op grond van [artikel 193b][ref1] onrechtmatig door de handelaar is gehandeld, is hij voor de dientengevolge
      ontstane schade aansprakelijk, tenzij hij bewijst dat zulks noch aan zijn schuld is te wijten noch op andere grond
      voor zijn rekening komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel193j
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193b
        afdeling: 3A
  - number: '194'
    text: |-
      Hij die omtrent goederen of diensten die door hem of degene ten behoeve van wie hij handelt in de uitoefening van
      een beroep of bedrijf worden aangeboden, een mededeling openbaar maakt of laat openbaar maken, handelt onrechtmatig
      jegens een ander die handelt in de uitoefening van zijn bedrijf, indien deze mededeling in een of meer opzichten
      misleidend is, zoals ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.a
    text: de aard, samenstelling, hoeveelheid, hoedanigheid, eigenschappen of gebruiksmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.b
    text: de herkomst, de wijze op het tijdstip van vervaardigen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.c
    text: de omvang van de voorraad;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.d
    text: de prijs of de wijze van berekenen daarvan;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.e
    text: de aanleiding of het doel van de aanbieding;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.f
    text: |-
      de toegekende onderscheidingen, getuigschriften of andere door derden uitgebrachte beoordelingen of gedane
      verklaringen, of de gebezigde wetenschappelijke of vaktermen, technische bevindingen of statistische gegevens;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.g
    text: de voorwaarden, waaronder goederen worden geleverd of diensten worden verricht of de betaling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.h
    text: de omvang, inhoud of tijdsduur van de garantie;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194.i
    text: |-
      de identiteit, hoedanigheden, bekwaamheid of bevoegdheid en degene door wie, onder wiens leiding of toezicht of met
      wiens medewerking de goederen zijn of worden vervaardigd of aangeboden of de diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194
  - number: 194a.1
    text: |-
      Onder vergelijkende reclame wordt verstaan elke vorm van reclame waarbij een concurrent dan wel door een concurrent
      aangeboden goederen of diensten uitdrukkelijk of impliciet worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2
    text: 'Vergelijkende reclame is, wat de vergelijking betreft, geoorloofd op voorwaarde dat deze:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.a
    text: |-
      niet misleidend of een misleidende handelspraktijk als bedoeld in de [artikelen 193c tot en met 193g][ref1] is;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193c
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193c
        afdeling: 3A
  - number: 194a.2.b
    text: goederen of diensten vergelijkt die in dezelfde behoeften voorzien of voor hetzelfde doel zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.c
    text: |-
      op objectieve wijze een of meer wezenlijke, relevante, controleerbare en representatieve kenmerken van deze
      goederen en diensten, zoals de prijs, met elkaar vergelijkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.d
    text: |-
      er niet toe leidt dat op de markt de adverteerder wordt verward met een concurrent, of de merken, handelsnamen,
      andere onderscheidende kenmerken, goederen of diensten van de adverteerder met die van een concurrent;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.e
    text: |-
      niet de goede naam schaadt van of zich niet kleinerend uitlaat over de merken, handelsnamen, andere onderscheidende
      kenmerken, goederen, diensten, activiteiten of omstandigheden van een concurrent;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.f
    text: voor producten met een benaming van oorsprong in elk geval betrekking heeft op producten met dezelfde benaming;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.g
    text: |-
      geen oneerlijk voordeel oplevert ten gevolge van de bekendheid van een merk, handelsnaam of andere onderscheidende
      kenmerken van een concurrent dan wel van de oorsprongsbenamingen van concurrerende producten; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.2.h
    text: |-
      niet goederen of diensten voorstelt als een imitatie of namaak van goederen of diensten met een beschermd merk of
      beschermde handelsnaam.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: 194a.3
    text: |-
      Elke vergelijking die verwijst naar een speciale aanbieding, moet duidelijk en ondubbelzinnig het einde en, zo de
      speciale aanbieding nog niet loopt, het begin aangeven van de periode gedurende welke de speciale prijs of andere
      specifieke voorwaarden gelden dan wel vermelden dat de speciale aanbieding loopt zo lang de voorraad strekt of de
      diensten kunnen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel194a
  - number: '195.1'
    text: |-
      Indien een vordering ingevolge [artikel 194][ref1] of [artikel 194a][ref2] wordt ingesteld tegen iemand die inhoud
      en inkleding van de mededeling geheel of ten dele heeft bepaald of doen bepalen, rust op hem de bewijslast ter zake
      van de juistheid of volledigheid van de feiten die in de mededeling zijn vervat of daardoor worden gesuggereerd
      en waarop het beweerde misleidende karakter van de mededeling berust onderscheidenlijk waarop de ongeoorloofdheid
      van de vergelijkende reclame berust. Ingeval van vergelijkende reclame dient degene die inhoud en inkleding van
      de mededeling geheel of ten dele zelf heeft bepaald of doen bepalen binnen korte termijn de bewijzen aan te dragen
      waarop de materiële juistheid en volledigheid van de feitelijke gegevens in de reclame rust.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel194a
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '194'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 194a
        afdeling: '4'
  - number: '195.2'
    text: |-
      Indien volgens [artikel 194][ref1] en [artikel 194a][ref2] onrechtmatig is gehandeld door iemand die inhoud en
      inkleding van de mededeling geheel of ten dele zelf heeft bepaald of doen bepalen, is hij voor de dientengevolge
      ontstane schade aansprakelijk, tenzij hij bewijst dat zulks noch aan zijn schuld is te wijten noch op andere grond
      voor zijn rekening komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel194a
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '194'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 194a
        afdeling: '4'
  - number: '196.1'
    text: |-
      Indien iemand door het openbaar maken of laten openbaar maken van een in [artikel 194][ref1] omschreven mededeling
      of een ongeoorloofde vergelijkende reclame aan een ander schade heeft toegebracht of dreigt toe te brengen, kan
      de rechter hem op vordering van die ander niet alleen het openbaar maken of laten openbaar maken van zodanige
      mededeling of zodanige ongeoorloofde vergelijkende reclame verbieden, maar ook hem laten veroordelen tot het op een
      door de rechter aangegeven wijze openbaar maken of laten openbaar maken van een rectificatie van die mededeling of
      die ongeoorloofde vergelijkende reclame.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel194
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '194'
        afdeling: '4'
  - number: '196.2'
    text: |-
      Indien een vordering als in het vorige lid bedoeld wordt toegewezen jegens iemand die niet tevens aansprakelijk is
      voor de in [artikel 195 lid 2][ref1] bedoelde schade, is [artikel 167 lid 3][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel167
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '195'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '167'
        afdeling: '1'
  - number: 196b.1
    text: |-
      Indien een certificatiedienstverlener een certificaat aan het publiek afgeeft als een gekwalificeerd certificaat
      als bedoeld in [artikel 1.1, onderdeel ss, van de Telecommunicatiewet][ref1], of indien hij voor een zodanig
      certificaat publiekelijk instaat, en een persoon op grond daarvan handelt in redelijk vertrouwen op:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: 196b.1.a
    text: |-
      de juistheid, op het tijdstip van afgifte, van alle in het certificaat opgenomen gegevens en de opneming van alle
      voor dit certificaat voorgeschreven gegevens;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196b.1.b
    text: |-
      het feit dat, op het tijdstip van uitgifte, degene die in het certificaat is aangeduid als ondertekenaar de houder
      was van de gegevens voor het aanmaken van elektronische handtekeningen die behoren bij de in het certificaat
      vermelde gegevens voor het verifiëren van elektronische handtekeningen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196b.1.c
    text: |-
      het feit dat de gegevens voor het aanmaken van elektronische handtekeningen en de gegevens voor het verifiëren van
      elektronische handtekeningen, indien zij beide door de certificatiedienstverlener zijn gegenereerd, complementair
      kunnen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196b.2
    text: |-
      Een certificatiedienstverlener die een certificaat aan het publiek heeft afgegeven als een gekwalificeerd
      certificaat of voor een zodanig certificaat publiekelijk instaat, en nalaat de intrekking van dat certificaat
      te registreren, is, indien een persoon in redelijk vertrouwen daarop handelt, aansprakelijk voor de door deze
      persoon dientengevolge geleden schade, tenzij de certificatiedienstverlener bewijst dat hij niet onzorgvuldig heeft
      gehandeld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196b.3
    text: |-
      Een certificatiedienstverlener kan in een gekwalificeerd certificaat beperkingen ten aanzien van het gebruik
      daarvan opnemen, mits die beperkingen voor derden duidelijk zijn. Een certificatiedienstverlener is niet
      aansprakelijk voor schade die het gevolg is van het gebruik van een gekwalificeerd certificaat in strijd met daarin
      overeenkomstig de vorige volzin opgenomen beperkingen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196b.4
    text: |-
      Een certificatiedienstverlener kan in een gekwalificeerd certificaat een grens aangeven voor de waarde van
      de transacties waarvoor het certificaat kan worden gebruikt, mits deze grens voor derden duidelijk is. Een
      certificatiedienstverlener is niet aansprakelijk voor schade die het gevolg is van een overschrijding van een
      overeenkomstig de vorige volzin opgenomen grens.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196b
  - number: 196c.1
    text: |-
      Degene die diensten van de informatiemaatschappij verricht als bedoeld in [artikel 15d lid 3 van Boek 3][ref1],
      bestaande uit het doorgeven van van een ander afkomstige informatie of het verschaffen van toegang tot een
      communicatienetwerk is niet aansprakelijk voor de doorgegeven informatie, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 196c.1.a
    text: niet het initiatief tot het doorgeven van de informatie neemt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.1.b
    text: niet degene is die bepaalt aan wie de informatie wordt doorgegeven; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.1.c
    text: hij de doorgegeven informatie niet heeft geselecteerd of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.2
    text: |-
      Voor de toepassing van lid 1 wordt onder het enkele doorgeven van van een ander afkomstige informatie en het enkele
      verschaffen van toegang tot een communicatienetwerk mede verstaan de geautomatiseerde, tussentijdse en tijdelijke
      opslag van de doorgegeven informatie, voor zover deze opslag uitsluitend geschiedt ten behoeve van het doorgeven
      van die informatie en de duur van deze opslag niet langer is dan daarvoor redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.3
    text: |-
      Degene die diensten van de informatiemaatschappij verricht als bedoeld in [artikel 15d lid 3 van Boek 3][ref1],
      bestaande uit het geautomatiseerd, tussentijds en tijdelijk opslaan van van een ander afkomstige informatie
      voor zover het opslaan enkel geschiedt om het later doorgeven van die informatie aan anderen op hun verzoek
      doeltreffender te maken, is niet aansprakelijk voor het geautomatiseerd, tussentijds en tijdelijk opslaan van de
      informatie indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 196c.3.a
    text: de informatie niet wijzigt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.3.b
    text: de toegangsvoorwaarden voor de informatie in acht neemt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.3.c
    text: de in de bedrijfstak geldende of gebruikelijke regels betreffende de bijwerking van de informatie naleeft;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.3.d
    text: |-
      niet de in de bedrijfstak geldende of gebruikelijke technologie voor het verkrijgen van gegevens over het gebruik
      van de informatie wijzigt, en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.3.e
    text: |-
      prompt de nodige maatregelen neemt om de informatie te verwijderen of de toegang daartoe onmogelijk te maken, zodra
      hij weet dat de informatie is verwijderd van de plaats waar deze zich oorspronkelijk in het communicatienetwerk
      bevond of de toegang daartoe onmogelijk is gemaakt, of dat een bevoegde autoriteit heeft bevolen de informatie te
      verwijderen van de plaats waar deze zich oorspronkelijk in het communicatienetwerk bevond of de toegang daartoe
      heeft verboden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.4
    text: |-
      Degene die diensten van de informatiemaatschappij verricht als bedoeld in [artikel 15d lid 3 van Boek 3][ref1],
      bestaande uit het op verzoek opslaan van van een ander afkomstige informatie, is niet aansprakelijk voor de
      opgeslagen informatie, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 196c.4.a
    text: |-
      niet weet van de activiteit of informatie met een onrechtmatig karakter en, in geval van een
      schadevergoedingsvordering, niet redelijkerwijs behoort te weten van de activiteit of informatie met een
      onrechtmatig karakter, dan wel
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.4.b
    text: |-
      zodra hij dat weet of redelijkerwijs behoort te weten, prompt de informatie verwijdert of de toegang daartoe
      onmogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: 196c.5
    text: Het hiervoor bepaalde staat niet in de weg aan het verkrijgen van een rechterlijk verbod of bevel.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel196c
  - number: '197.1'
    text: |-
