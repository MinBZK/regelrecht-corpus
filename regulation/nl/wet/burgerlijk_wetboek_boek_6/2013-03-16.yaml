  - number: '197.3'
    text: |-
      Degene wiens verhaal of subrogatie door de vorige leden wordt uitgesloten, kan de in het tweede lid bedoelde
      rechten evenmin krachtens overeenkomst verkrijgen of te zijnen behoeve door de gerechtigde op diens naam doen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel197
  - number: '198'
    text: |-
      Zaakwaarneming is het zich willens en wetens en op redelijke grond inlaten met de behartiging van eens anders
      belang, zonder de bevoegdheid daartoe aan een rechtshandeling of een elders in de wet geregelde rechtsverhouding
      te ontlenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel198
  - number: '199.1'
    text: |-
      De zaakwaarnemer is verplicht bij de waarneming de nodige zorg te betrachten en, voor zover dit redelijkerwijze van
      hem kan worden verlangd, de begonnen waarneming voort te zetten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel199
  - number: '199.2'
    text: |-
      De zaakwaarnemer doet, zodra dit redelijkerwijze mogelijk is, aan de belanghebbende verantwoording van hetgeen hij
      heeft verricht. Heeft hij voor de belanghebbende gelden uitgegeven of ontvangen, dan doet hij daarvan rekening.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel199
  - number: '200.1'
    text: |-
      De belanghebbende is, voor zover zijn belang naar behoren is behartigd, gehouden de zaakwaarnemer de schade te
      vergoeden, die deze als gevolg van de waarneming heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel200
  - number: '200.2'
    text: |-
      Heeft de zaakwaarnemer in de uitoefening van een beroep of bedrijf gehandeld, dan heeft hij, voor zover dit
      redelijk is, bovendien recht op een vergoeding voor zijn verrichtingen, met inachtneming van de prijzen die
      daarvoor ten tijde van de zaakwaarneming gewoonlijk werden berekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel200
  - number: '201'
    text: |-
      Een zaakwaarnemer is bevoegd rechtshandelingen te verrichten in naam van de belanghebbende, voor zover diens belang
      daardoor naar behoren wordt behartigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel201
  - number: '202'
    text: |-
      Heeft iemand die is opgetreden ter behartiging van eens anders belang, zich zonder redelijke grond daarmede
      ingelaten of dit belang niet naar behoren behartigd, dan kan de belanghebbende door goedkeuring van het optreden
      zijn bevoegdheid prijsgeven jegens hem het gebrek in te roepen. Aan de belanghebbende kan door hem een redelijke
      termijn voor de goedkeuring worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel202
  - number: '203.1'
    text: |-
      Degene die een ander zonder rechtsgrond een goed heeft gegeven, is gerechtigd dit van de ontvanger als
      onverschuldigd betaald terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel203
  - number: '203.2'
    text: Betreft de onverschuldigde betaling een geldsom, dan strekt de vordering tot teruggave van een gelijk bedrag.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel203
  - number: '203.3'
    text: |-
      Degene die zonder rechtsgrond een prestatie van andere aard heeft verricht, heeft eveneens jegens de ontvanger
      recht op ongedaanmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel203
  - number: '204.1'
    text: |-
      Heeft de ontvanger in een periode waarin hij redelijkerwijze met een verplichting tot teruggave van het goed geen
      rekening behoefde te houden, niet als een zorgvuldig schuldenaar voor het goed zorg gedragen, dan wordt hem dit
      niet toegerekend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel204
  - number: '204.2'
    text: |-
      Degene die namens een ander, maar onbevoegd een niet aan die ander verschuldigde geldsom heeft ontvangen, is van
      zijn verplichting tot teruggave bevrijd, voor zover hij die geldsom aan die ander heeft doorbetaald in een periode
      waarin hij redelijkerwijze met die verplichting geen rekening behoefde te houden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel204
  - number: '205'
    text: Heeft de ontvanger het goed te kwader trouw aangenomen, dan is hij zonder ingebrekestelling in verzuim.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel205
  - number: '206'
    text: |-
      De [artikelen 120][ref1], [121][ref2], [123][ref3] en [124 van Boek 3][ref4] zijn van overeenkomstige toepassing
      met betrekking tot hetgeen daarin is bepaald omtrent de afgifte van vruchten en de vergoeding van kosten en schade.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel124
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '124'
  - number: '207'
    text: |-
      De ontvanger heeft, tenzij hij het goed te kwader trouw heeft aangenomen, binnen de grenzen van de redelijkheid
      ook recht op vergoeding van de kosten van het ontvangen en teruggeven van het goed, alsmede van uitgaven in de in
      [artikel 204][ref1] bedoelde periode die zouden zijn uitgebleven als hij het goed niet had ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel204
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '204'
        afdeling: '2'
  - number: '208'
    text: |-
      De ontvanger verliest zijn recht op de in de beide vorige artikelen bedoelde vergoedingen, indien de wederpartij
      afstand doet van haar recht op terugvordering en, voor zover nodig, het onverschuldigd betaalde ter bevrijding van
      deze vergoedingen op haar kosten aan de ontvanger overdraagt. De ontvanger is verplicht aan een zodanige overdracht
      mede te werken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel208
  - number: '209'
    text: |-
      Op de onbekwame die een onverschuldigde betaling heeft ontvangen, rusten de in deze afdeling omschreven
      verplichtingen slechts, voor zover het ontvangene hem tot werkelijk voordeel heeft gestrekt of in de macht van zijn
      wettelijke vertegenwoordiger is gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel209
  - number: '210.1'
    text: |-
      Op de ongedaanmaking van prestaties die niet in het geven van een goed hebben bestaan, zijn de
      [artikelen 204-209][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel204
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '204'
        afdeling: '2'
  - number: '210.2'
    text: |-
      Sluit de aard van de prestatie uit dat zij ongedaan wordt gemaakt, dan treedt, voor zover dit redelijk is,
      vergoeding van de waarde van de prestatie op het ogenblik van ontvangst daarvoor in de plaats, indien de ontvanger
      door de prestatie is verrijkt, indien het aan hem is toe te rekenen dat de prestatie is verricht, of indien hij
      erin had toegestemd een tegenprestatie te verrichten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel210
  - number: '211.1'
    text: |-
      Kan een prestatie die op grond van een nietige overeenkomst is verricht, naar haar aard niet ongedaan worden
      gemaakt en behoort zij ook niet in rechte op geld te worden gewaardeerd, dan is een tot ongedaanmaking van een
      tegenprestatie of tot vergoeding van de waarde daarvan strekkende vordering, voor zover deze deswege in strijd met
      redelijkheid en billijkheid zou zijn, eveneens uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel211
  - number: '211.2'
    text: |-
      Is ingevolge het vorige lid terugvordering van een overgedragen goed uitgesloten, dan brengt de nietigheid van de
      overeenkomst niet de nietigheid van de overdracht mede.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel211
  - number: '212.1'
    text: |-
      Hij die ongerechtvaardigd is verrijkt ten koste van een ander, is verplicht, voor zover dit redelijk is, diens
      schade te vergoeden tot het bedrag van zijn verrijking.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel212
  - number: '212.2'
    text: |-
      Voor zover de verrijking is verminderd als gevolg van een omstandigheid die niet aan de verrijkte kan worden
      toegerekend, blijft zij buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel212
  - number: '212.3'
    text: |-
      Is de verrijking verminderd in de periode waarin de verrijkte redelijkerwijze met een verplichting tot vergoeding
      van de schade geen rekening behoefde te houden, dan wordt hem dit niet toegerekend. Bij de vaststelling van deze
      vermindering wordt mede rekening gehouden met uitgaven die zonder de verrijking zouden zijn uitgebleven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel212
  - number: '213.1'
    text: |-
      Een overeenkomst in de zin van deze titel is een meerzijdige rechtshandeling, waarbij een of meer partijen jegens
      een of meer andere een verbintenis aangaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel213
  - number: '213.2'
    text: |-
      Op overeenkomsten tussen meer dan twee partijen zijn de wettelijke bepalingen betreffende overeenkomsten niet
      toepasselijk, voor zover de strekking van de betrokken bepalingen in verband met de aard van de overeenkomst zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel213
  - number: '214.1'
    text: |-
      Een overeenkomst door een der partijen gesloten in de uitoefening van haar bedrijf of beroep, is behalve aan de
      wettelijke bepalingen ook onderworpen aan een standaardregeling, wanneer voor de bedrijfstak waartoe het bedrijf
      behoort, of voor het beroep ten aanzien van zodanige overeenkomst een standaardregeling geldt. De bijzondere
      soorten van overeenkomsten waarvoor standaardregelingen kunnen worden vastgesteld en de bedrijfstak of het beroep,
      waarvoor elk dezer regelingen bestemd is te gelden, worden bij algemene maatregel van bestuur aangewezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel214
  - number: '214.2'
    text: |-
      Een standaardregeling wordt vastgesteld, gewijzigd en ingetrokken door een daartoe door Onze Minister van Justitie
      te benoemen commissie. Bij de wet worden nadere regelen gesteld omtrent de wijze van samenstelling en de werkwijze
      van de commissies.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel214
  - number: '214.3'
    text: |-
      De vaststelling, wijziging of intrekking van een standaardregeling wordt niet van kracht voordat zij door Ons is
      goedgekeurd en met Ons goedkeuringsbesluit in de *Nederlandse Staatscourant* is afgekondigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel214
  - number: '214.4'
    text: |-
      Bij een standaardregeling kan worden afgeweken van wettelijke bepalingen, voor zover daarvan ook afwijking bij
      overeenkomst, al of niet met inachtneming van een bepaalde vorm, is toegelaten. De vorige zin lijdt uitzondering,
      wanneer uit een wettelijke bepaling iets anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel214
  - number: '214.5'
    text: |-
      Partijen kunnen in hun overeenkomst van een standaardregeling afwijken. Een standaardregeling kan echter voor
      afwijking een bepaalde vorm voorschrijven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel214
  - number: '215'
    text: |-
      Voldoet een overeenkomst aan de omschrijving van twee of meer door de wet geregelde bijzondere soorten van
      overeenkomsten, dan zijn de voor elk van die soorten gegeven bepalingen naast elkaar op de overeenkomst van
      toepassing, behoudens voor zover deze bepalingen niet wel verenigbaar zijn of de strekking daarvan in verband met
      de aard van de overeenkomst zich tegen toepassing verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel215
  - number: '216'
    text: |-
      Hetgeen in deze en de volgende drie afdelingen is bepaald, vindt overeenkomstige toepassing op andere meerzijdige
      vermogensrechtelijke rechtshandelingen, voor zover de strekking van de betrokken bepalingen in verband met de aard
      van de rechtshandeling zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel216
  - number: '217.1'
    text: Een overeenkomst komt tot stand door een aanbod en de aanvaarding daarvan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel217
  - number: '217.2'
    text: |-
      De [artikelen 219-225][ref1] zijn van toepassing, tenzij iets anders voortvloeit uit het aanbod, uit een andere
      rechtshandeling of uit een gewoonte.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel219
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '219'
        afdeling: '2'
  - number: '218'
    text: Een aanbod is geldig, nietig of vernietigbaar overeenkomstig de regels voor meerzijdige rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel218
  - number: '219.1'
    text: |-
      Een aanbod kan worden herroepen, tenzij het een termijn voor de aanvaarding inhoudt of de onherroepelijkheid ervan
      op andere wijze uit het aanbod volgt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel219
  - number: '219.2'
    text: |-
      De herroeping kan slechts geschieden, zolang het aanbod niet is aanvaard en evenmin een mededeling, houdende de
      aanvaarding is verzonden. Bevat het aanbod de mededeling dat het vrijblijvend wordt gedaan, dan kan de herroeping
      nog onverwijld na de aanvaarding geschieden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel219
  - number: '219.3'
    text: |-
      Een beding waarbij één der partijen zich verbindt om, indien de wederpartij dit wenst, met haar een bepaalde
      overeenkomst te sluiten, geldt als een onherroepelijk aanbod.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel219
  - number: '220.1'
    text: |-
      Een bij wijze van uitloving voor een bepaalde tijd gedaan aanbod kan wegens gewichtige redenen worden herroepen
      of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel220
  - number: '220.2'
    text: |-
      In geval van herroeping of wijziging van een uitloving kan de rechter aan iemand die op grond van de uitloving met
      de voorbereiding van een gevraagde prestatie is begonnen, een billijke schadeloosstelling toekennen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel220
  - number: '221.1'
    text: |-
      Een mondeling aanbod vervalt, wanneer het niet onmiddellijk wordt aanvaard, een schriftelijk aanbod, wanneer het
      niet binnen een redelijke tijd wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel221
  - number: '221.2'
    text: Een aanbod vervalt, doordat het wordt verworpen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel221
  - number: '222'
    text: |-
      Een aanbod vervalt niet door de dood of het verlies van handelingsbekwaamheid van een der partijen, noch doordat
      een der partijen de bevoegdheid tot het sluiten van de overeenkomst verliest als gevolg van een bewind.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel222
  - number: '223.1'
    text: |-
      De aanbieder kan een te late aanvaarding toch als tijdig gedaan laten gelden, mits hij dit onverwijld aan de
      wederpartij mededeelt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel223
  - number: '223.2'
    text: |-
      Indien een aanvaarding te laat plaatsvindt, maar de aanbieder begrijpt of behoort te begrijpen dat dit voor de
      wederpartij niet duidelijk was, geldt de aanvaarding als tijdig gedaan, tenzij hij onverwijld aan de wederpartij
      mededeelt dat hij het aanbod als vervallen beschouwt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel223
  - number: '224'
    text: |-
      Indien een aanvaarding de aanbieder niet of niet tijdig bereikt door een omstandigheid op grond waarvan zij
      krachtens [artikel 37 lid 3, tweede zin, van Boek 3][ref1] niettemin haar werking heeft, wordt de overeenkomst
      geacht tot stand te zijn gekomen op het tijdstip waarop zonder de storende omstandigheid de verklaring zou zijn
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel37
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '37'
  - number: '225.1'
    text: |-
      Een aanvaarding die van het aanbod afwijkt, geldt als een nieuw aanbod en als een verwerping van het
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel225
  - number: '225.2'
    text: |-
      Wijkt een tot aanvaarding strekkend antwoord op een aanbod daarvan slechts op ondergeschikte punten af, dan geldt
      dit antwoord als aanvaarding en komt de overeenkomst overeenkomstig deze aanvaarding tot stand, tenzij de aanbieder
      onverwijld bezwaar maakt tegen de verschillen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel225
  - number: '225.3'
    text: |-
      Verwijzen aanbod en aanvaarding naar verschillende algemene voorwaarden, dan komt aan de tweede verwijzing geen
      werking toe, wanneer daarbij niet tevens de toepasselijkheid van de in de eerste verwijzing aangegeven algemene
      voorwaarden uitdrukkelijk van de hand wordt gewezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel225
  - number: '226'
    text: |-
      Stelt de wet voor de totstandkoming van een overeenkomst een vormvereiste, dan is dit voorschrift van
      overeenkomstige toepassing op een overeenkomst waarbij een partij in wier belang het strekt, zich tot het aangaan
      van een zodanige overeenkomst verbindt, tenzij uit de strekking van het voorschrift anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel226
  - number: '227'
    text: De verbintenissen die partijen op zich nemen, moeten bepaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227
  - number: 227a.1
    text: |-
      Indien uit de wet voortvloeit dat een overeenkomst slechts in schriftelijke vorm geldig of onaantastbaar tot stand
      komt, is aan deze eis tevens voldaan indien de overeenkomst langs elektronische weg is totstandgekomen en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227a.1.a
    text: raadpleegbaar door partijen is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227a.1.b
    text: de authenticiteit van de overeenkomst in voldoende mate gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227a.1.c
    text: het moment van totstandkoming van de overeenkomst met voldoende zekerheid kan worden vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227a.1.d
    text: de identiteit van de partijen met voldoende zekerheid kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227a.2
    text: |-
      Lid 1 is niet van toepassing op overeenkomsten waarvoor de wet de tussenkomst voorschrijft van de rechter, een
      overheidsorgaan of een beroepsbeoefenaar die een publieke taak uitoefent.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227a
  - number: 227b.1
    text: |-
      Voordat een overeenkomst langs elektronische weg tot stand komt verstrekt degene die een dienst van de
      informatiemaatschappij verleent als bedoeld in [artikel 15d lid 3 van Boek 3][ref1] de wederpartij ten minste op
      duidelijke, begrijpelijke en ondubbelzinnige wijze informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 227b.1.a
    text: de wijze waarop de overeenkomst tot stand zal komen en in het bijzonder welke handelingen daarvoor nodig zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.1.b
    text: |-
      het al dan niet archiveren van de overeenkomst nadat deze tot stand zal zijn gekomen, alsmede, indien de
      overeenkomst wordt gearchiveerd, op welke wijze deze voor de wederpartij te raadplegen zal zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.1.c
    text: |-
      de wijze waarop de wederpartij van door hem niet gewilde handelingen op de hoogte kan geraken, alsmede de wijze
      waarop hij deze kan herstellen voordat de overeenkomst tot stand komt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.1.d
    text: de talen waarin de overeenkomst kan worden gesloten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.1.e
    text: |-
      de gedragscodes waaraan hij zich heeft onderworpen en de wijze waarop deze gedragscodes voor de wederpartij langs
      elektronische weg te raadplegen zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.2
    text: |-
      De dienstverlener stelt voor of bij het sluiten van de overeenkomst de voorwaarden daarvan, niet zijnde algemene
      voorwaarden als bedoeld in [artikel 231][ref1], op zodanige wijze aan de wederpartij ter beschikking, dat deze door
      hem kunnen worden opgeslagen zodat deze voor hem toegankelijk zijn ten behoeve van latere kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
        afdeling: '3'
  - number: 227b.3
    text: |-
      Lid 1 is niet van toepassing op overeenkomsten die uitsluitend door middel van de uitwisseling van elektronische
      post of een soortgelijke vorm van individuele communicatie tot stand zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.4
    text: |-
      Een overeenkomst die tot stand is gekomen onder invloed van het niet naleven door de dienstverlener van zijn in lid
      1, aanhef en onder a, c of d, genoemde verplichtingen, is vernietigbaar. Indien de dienstverlener zijn in lid 1,
      aanhef en onder a of c genoemde verplichting niet is nagekomen, wordt vermoed dat een overeenkomst onder invloed
      daarvan tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.5
    text: |-
      Gedurende de tijd dat de dienstverlener de informatie, bedoeld in lid 1, onder b en e en lid 2, niet heeft
      verstrekt, kan de wederpartij de overeenkomst ontbinden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227b.6
    text: Tussen partijen die handelen in de uitoefening van een beroep of bedrijf kan van lid 1 worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227b
  - number: 227c.1
    text: |-
      Degene die een dienst van de informatiemaatschappij als bedoeld in [artikel 15d lid 3 van Boek 3][ref1] verleent,
      stelt de wederpartij passende, doeltreffende en toegankelijke middelen ter beschikking waarmee de wederpartij voor
      de aanvaarding van de overeenkomst van door hem niet gewilde handelingen op de hoogte kan geraken en waarmee hij
      deze kan herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 227c.2
    text: |-
      Indien een wederpartij van een dienstverlener langs elektronische weg een verklaring uitbrengt die door de
      dienstverlener mag worden opgevat hetzij als een aanvaarding van een door hem langs elektronische weg gedaan
      aanbod, hetzij als een aanbod naar aanleiding van een door hem langs elektronische weg gedane uitnodiging om in
      onderhandeling te treden, bevestigt de dienstverlener zo spoedig mogelijk langs elektronische weg de ontvangst
      van deze verklaring. Zolang de ontvangst van een aanvaarding niet is bevestigd, kan de wederpartij de overeenkomst
      ontbinden. Het niet tijdig bevestigen van de ontvangst van een aanbod geldt als verwerping daarvan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
  - number: 227c.3
    text: |-
      Een verklaring als bedoeld in lid 2 en de ontvangstbevestiging worden geacht te zijn ontvangen, wanneer deze
      toegankelijk zijn voor de partijen tot wie zij zijn gericht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
  - number: 227c.4
    text: |-
      De leden 1 en 2 zijn niet van toepassing indien de overeenkomst uitsluitend door middel van de uitwisseling van
      elektronische post of een soortgelijke vorm van individuele communicatie tot stand komt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
  - number: 227c.5
    text: |-
      Een overeenkomst die tot stand is gekomen onder invloed van het niet naleven door de dienstverlener van zijn in
      lid 1 genoemde verplichting, is vernietigbaar. Indien de dienstverlener zijn in lid 1 genoemde verplichting niet is
      nagekomen, wordt vermoed dat een overeenkomst onder invloed daarvan tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
  - number: 227c.6
    text: |-
      Van dit artikel kan slechts worden afgeweken tussen partijen die handelen in de uitoefening van een beroep of
      bedrijf.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel227c
  - number: '228.1'
    text: |-
      Een overeenkomst die is tot stand gekomen onder invloed van dwaling en bij een juiste voorstelling van zaken niet
      zou zijn gesloten, is vernietigbaar:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel228
  - number: 228.1.a
    text: |-
      indien de dwaling te wijten is aan een inlichting van de wederpartij, tenzij deze mocht aannemen dat de
      overeenkomst ook zonder deze inlichting zou worden gesloten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel228
  - number: 228.1.b
    text: |-
      indien de wederpartij in verband met hetgeen zij omtrent de dwaling wist of behoorde te weten, de dwalende had
      behoren in te lichten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel228
  - number: 228.1.c
    text: |-
      indien de wederpartij bij het sluiten van de overeenkomst van dezelfde onjuiste veronderstelling als de dwalende
      is uitgegaan, tenzij zij ook bij een juiste voorstelling van zaken niet had behoeven te begrijpen dat de dwalende
      daardoor van het sluiten van de overeenkomst zou worden afgehouden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel228
  - number: '228.2'
    text: |-
      De vernietiging kan niet worden gegrond op een dwaling die een uitsluitend toekomstige omstandigheid betreft of
      die in verband met de aard van de overeenkomst, de in het verkeer geldende opvattingen of de omstandigheden van het
      geval voor rekening van de dwalende behoort te blijven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel228
  - number: '229'
    text: |-
      Een overeenkomst die de strekking heeft voort te bouwen op een reeds tussen partijen bestaande rechtsverhouding,
      is vernietigbaar, indien deze rechtsverhouding ontbreekt, tenzij dit in verband met de aard van de overeenkomst,
      de in het verkeer geldende opvattingen of de omstandigheden van het geval voor rekening van degene die zich op dit
      ontbreken beroept, behoort te blijven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel229
  - number: '230.1'
    text: |-
      De bevoegdheid tot vernietiging op grond van de [artikelen 228][ref1] en [229][ref2] vervalt, wanneer de
      wederpartij tijdig een wijziging van de gevolgen van de overeenkomst voorstelt, die het nadeel dat de tot
      vernietiging bevoegde bij intstandhouding van de overeenkomst lijdt, op afdoende wijze opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel229
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '228'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '229'
        afdeling: '2'
  - number: '230.2'
    text: |-
      Bovendien kan de rechter op verlangen van een der partijen, in plaats van de vernietiging uit te spreken, de
      gevolgen van de overeenkomst ter opheffing van dit nadeel wijzigen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230
  - number: 230a
    text: |-
      In deze afdeling wordt verstaan onder: - *afnemer:* natuurlijke persoon die onderdaan is van een lidstaat of die
      rechten heeft die hem door communautaire besluiten zijn verleend, of een rechtspersoon in de zin van artikel 48 van
      het Verdrag die in een lidstaat is gevestigd en, al dan niet voor beroepsdoeleinden, van een dienst gebruik maakt
      of wil maken;
        - *bevoegde instantie:* bestuursorgaan, een ander orgaan of een autoriteit, dat of die een toezichthoudende,
      vergunningverlenende of regelgevende rol vervult ten aanzien van diensten;
        - *centraal loket:* het centraal loket, bedoeld in [artikel 5, eerste lid, van de Dienstenwet][ref1];
        - *dienst:* economische activiteit, anders dan in loondienst, die gewoonlijk tegen vergoeding geschiedt, als
      bedoeld in artikel 50 van het Verdrag;
        - *dienstverrichter:* natuurlijke persoon die onderdaan is van een lidstaat of een rechtspersoon in de zin van
      artikel 48 van het Verdrag, die in een lidstaat is gevestigd en die een dienst aanbiedt of verricht;
        - *lidstaat:* lidstaat van de Europese Unie of van de Europese Economische Ruimte;
        - *vergunning:* beslissing, uitdrukkelijk of stilzwijgend, over de toegang tot of de uitoefening van een dienst;
        - *vergunningstelsel:* procedure die voor een dienstverrichter of afnemer de verplichting inhoudt bij een bevoegde
      instantie stappen te ondernemen ter verkrijging van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel5
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '5'
  - number: 230b
    text: |-
      De dienstverrichter die diensten verricht als bedoeld in richtlijn 2006/123/EG van het Europees Parlement en de
      Raad van de Europese Unie van 12 december 2006 betreffende diensten op de interne markt (PbEU L 376), stelt de
      afnemer van die diensten de volgende gegevens ter beschikking:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.1
    text: |-
      zijn naam, rechtspositie en rechtsvorm, het geografisch adres waar hij is gevestigd, zijn adresgegevens, zodat de
      afnemers hem snel kunnen bereiken en rechtstreeks met hem kunnen communiceren, eventueel langs elektronische weg;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.2
    text: |-
      wanneer de dienstverrichter in een handelsregister of in een vergelijkbaar openbaar register is ingeschreven, de
      naam van dat register en het nummer waaronder hij is ingeschreven, of gelijkwaardige gegevens uit dat register die
      ter identificatie dienen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.3
    text: |-
      wanneer voor de activiteit een vergunningstelsel geldt, de adresgegevens van de bevoegde instantie of van het
      centraal loket;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.4
    text: |-
      wanneer de dienstverrichter een btw-plichtige activiteit uitoefent, het nummer bedoeld in artikel 214, eerste
      lid, onder a, van Richtlijn 2006/112/EG van de Raad van de Europese Unie van 28 november 2006 betreffende het
      Gemeenschappelijk stelsel van belasting over de toegevoegde waarde (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.5
    text: |-
      voor gereglementeerde beroepen: elke beroepsorde of vergelijkbare organisatie waarbij de dienstverrichter is
      ingeschreven, alsmede de beroepstitel en de lidstaat waar die is verleend;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.6
    text: in voorkomend geval, de algemene voorwaarden en bepalingen die de dienstverrichter hanteert;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.7
    text: |-
      het eventuele bestaan van door de dienstverrichter gehanteerde contractuele bepalingen betreffende het op de
      overeenkomst toepasselijke recht of de bevoegde rechter;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.8
    text: het eventuele bestaan van niet bij wet voorgeschreven garantie na verkoop;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.9
    text: de prijs van de dienst wanneer de dienstverrichter de prijs van een bepaald soort dienst vooraf heeft vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.10
    text: de belangrijkste kenmerken van de dienst wanneer deze niet uit de context blijken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.11
    text: |-
      de in artikel 23, lid 1 van de in de aanhef van dit artikel genoemde richtlijn, bedoelde verzekering of waarborgen,
      met name de adresgegevens van de verzekeraar of de borg en de geografische dekking;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.12
    text: |-
      adresgegevens, met name een postadres, faxnummer of e-mailadres en een telefoonnummer, waar alle afnemers,
      ook die die in andere lidstaten verblijven, een klacht kunnen indienen of informatie over de verrichte dienst
      kunnen vragen. Indien dit niet hun gebruikelijke correspondentieadres is, wordt hun wettelijke adres verstrekt.
      Op eventuele klachten wordt zo snel mogelijk gereageerd en alles wordt in het werk gesteld om een bevredigende
      oplossing te vinden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230b.13
    text: |-
      wanneer een dienstverrichter gebonden is aan een gedragscode of lid is van een handelsvereniging of beroepsorde die
      voorziet in een regeling voor buitengerechtelijke geschillenbeslechting, wordt dienaangaande informatie verstrekt.
      De dienstverrichter vermeldt dit in elk document waarin zijn diensten in detail worden beschreven en geeft daarbij
      aan hoe toegang kan worden verkregen tot gedetailleerde informatie over de kenmerken en toepassingsvoorwaarden van
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230b
  - number: 230c
    text: |-
      De in [artikel 230b][ref1] bedoelde informatie, naar keuze van de dienstverrichter, bedoeld in artikel 230b,
      aanhef:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230c
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230b
        afdeling: 2a
  - number: 230c.1
    text: wordt op eigen initiatief door de dienstverrichter verstrekt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230c
  - number: 230c.2
    text: |-
      is voor de afnemer gemakkelijk toegankelijk op de plaats waar de dienst wordt verricht of de overeenkomst wordt
      gesloten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230c
  - number: 230c.3
    text: is voor de afnemer gemakkelijk elektronisch toegankelijk op een door de dienstverrichter meegedeeld adres;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230c
  - number: 230c.4
    text: |-
      is opgenomen in alle door de dienstverrichter aan de afnemer verstrekte documenten waarin deze diensten in detail
      worden beschreven.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230c
  - number: 230d
    text: |-
      De dienstverrichters, bedoeld in [artikel 230b, aanhef][ref1], verstrekken de afnemer van diensten op diens verzoek
      de volgende aanvullende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230b
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230d
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230b
        afdeling: 2a
  - number: 230d.1
    text: |-
      wanneer de dienstverrichter de prijs van een bepaald soort dienst niet vooraf heeft vastgesteld, de prijs van de
      dienst of, indien de precieze prijs niet kan worden gegeven, de manier waarop de prijs wordt berekend, zodat de
      afnemer de prijs kan controleren, of een voldoende gedetailleerde kostenraming;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230d
  - number: 230d.2
    text: |-
      voor gereglementeerde beroepen, een verwijzing naar de in de lidstaat van vestiging geldende beroepsregels en de
      wijze waarop hierin inzage kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230d
  - number: 230d.3
    text: |-
      informatie over hun multidisciplinaire activiteiten en partnerschappen die rechtstreeks verband houden met de
      betrokken dienst, en over de maatregelen die zij ter voorkoming van belangenconflicten hebben genomen. Deze
      informatie is opgenomen in elk informatiedocument waarin dienstverrichters hun diensten in detail beschrijven;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230d
  - number: 230d.4
    text: |-
      gedragscodes die op dienstverrichters van toepassing zijn, alsmede het adres waar zij elektronisch kunnen worden
      geraadpleegd en de beschikbare talen waarin deze codes kunnen worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230d
  - number: 230e
    text: |-
      De informatie, bedoeld in deze afdeling, is correct, helder en ondubbelzinnig. De informatie wordt tijdig voor de
      sluiting van een schriftelijke overeenkomst of, indien er geen schriftelijke overeenkomst is, voor de verrichting
      van de dienst meegedeeld of beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230e
  - number: 230f
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van besluiten op grond van
      artikel 22, zesde lid, van richtlijn 2006/123/EG van het Europees Parlement en de Raad van de Europese Unie van
      12 december 2006 betreffende diensten op de interne markt (PbEU L 376).
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel230f
  - number: '231'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel231
  - number: 231.a
    text: |-
      algemene voorwaarden: een of meer bedingen die zijn opgesteld teneinde in een aantal overeenkomsten te worden
      opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven, voor zover deze laatstgenoemde
      bedingen duidelijk en begrijpelijk zijn geformuleerd;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel231
  - number: 231.b
    text: 'gebruiker: degene die algemene voorwaarden in een overeenkomst gebruikt;'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel231
  - number: 231.c
    text: |-
      wederpartij: degene die door ondertekening van een geschrift of op andere wijze de gelding van algemene voorwaarden
      heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel231
  - number: '232'
    text: |-
      Een wederpartij is ook dan aan de algemene voorwaarden gebonden als bij het sluiten van de overeenkomst de
      gebruiker begreep of moest begrijpen dat zij de inhoud daarvan niet kende.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel232
  - number: '233'
    text: Een beding in algemene voorwaarden is vernietigbaar
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel233
  - number: 233.a
    text: |-
      indien het, gelet op de aard en de overige inhoud van de overeenkomst, de wijze waarop de voorwaarden zijn tot
      stand gekomen, de wederzijds kenbare belangen van partijen en de overige omstandigheden van het geval, onredelijk
      bezwarend is voor de wederpartij; of
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel233
  - number: 233.b
    text: |-
      indien de gebruiker aan de wederpartij niet een redelijke mogelijkheid heeft geboden om van de algemene voorwaarden
      kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel233
  - number: '234.1'
    text: |-
      De gebruiker heeft aan de wederpartij de in [artikel 233 onder b][ref1] bedoelde mogelijkheid geboden, indien
      hij de algemene voorwaarden voor of bij het sluiten van de overeenkomst aan de wederpartij ter hand heeft
      gesteld, de voorwaarden overeenkomstig de in [artikel 230c][ref2] voorziene wijze heeft verstrekt of, indien dit
      redelijkerwijs niet mogelijk is, voor de totstandkoming van de overeenkomst aan de wederpartij heeft bekend gemaakt
      dat de voorwaarden bij hem ter inzage liggen of bij een door hem opgegeven Kamer van Koophandel en Fabrieken of
      een griffie van een gerecht zijn gedeponeerd, alsmede dat zij op verzoek zullen worden toegezonden. Indien de
      voorwaarden niet voor of bij het sluiten van de overeenkomst aan de wederpartij ter hand zijn gesteld, zijn de
      bedingen tevens vernietigbaar indien de gebruiker de voorwaarden niet op verzoek van de wederpartij onverwijld op
      zijn kosten aan haar toezendt. Het omtrent de verplichting tot toezending bepaalde is niet van toepassing, voor
      zover deze toezending redelijkerwijze niet van de gebruiker kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel230c
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 230c
        afdeling: 2a
  - number: '234.2'
    text: |-
      De gebruiker heeft tevens aan de wederpartij de in [artikel 233 onder b][ref1] bedoelde mogelijkheid geboden,
      indien hij de algemene voorwaarden voor of bij het sluiten van de overeenkomst aan de wederpartij langs
      elektronische weg ter beschikking heeft gesteld op een zodanige wijze dat deze door haar kunnen worden opgeslagen
      en voor haar toegankelijk zijn ten behoeve van latere kennisneming of, indien dit redelijkerwijs niet mogelijk
      is, voor de totstandkoming van de overeenkomst aan de wederpartij heeft bekend gemaakt waar van de voorwaarden
      langs elektronische weg kan worden kennisgenomen, alsmede dat zij op verzoek langs elektronische weg of op andere
      wijze zullen worden toegezonden. Indien de voorwaarden niet voor of bij het sluiten van de overeenkomst aan de
      wederpartij langs elektronische weg ter beschikking zijn gesteld, zijn de bedingen tevens vernietigbaar indien de
      gebruiker de voorwaarden niet op verzoek van de wederpartij onverwijld op zijn kosten langs elektronische weg of op
      andere wijze aan haar toezendt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
  - number: '234.3'
    text: |-
      Voor het op de in lid 2 bedoelde wijze bieden van een redelijke mogelijkheid om van de algemene voorwaarden kennis
      te nemen is de uitdrukkelijke instemming van de wederpartij vereist indien de overeenkomst niet langs elektronische
      weg tot stand komt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel234
  - number: '235.1'
    text: |-
      Op de vernietigingsgronden bedoeld in de [artikelen 233][ref1] en [234][ref2] kan geen beroep worden gedaan door


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel234
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '234'
        afdeling: '3'
  - number: 235.1.a
    text: |-
      een rechtspersoon bedoeld in [artikel 360 van Boek 2][ref1], die ten tijde van het sluiten van de overeenkomst
      laatstelijk zijn jaarrekening openbaar heeft gemaakt, of ten aanzien waarvan op dat tijdstip laatstelijk
      [artikel 403 lid 1 van Boek 2][ref2] is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '360'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '403'
  - number: 235.1.b
    text: |-
      een partij op wie het onder *a* bepaalde niet van toepassing is, indien op voormeld tijdstip bij haar vijftig of
      meer personen werkzaam zijn of op dat tijdstip uit een opgave krachtens de [Handelsregisterwet 2007][ref1] blijkt
      dat bij haar vijftig of meer personen werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '235.2'
    text: |-
      Op de vernietigingsgrond bedoeld in [artikel 233 onder a ][ref1], kan mede een beroep worden gedaan door een
      partij voor wie de algemene voorwaarden door een gevolmachtigde zijn gebruikt, mits de wederpartij meermalen
      overeenkomsten sluit waarop dezelfde of nagenoeg dezelfde algemene voorwaarden van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
  - number: '235.3'
    text: |-
      Op de vernietigingsgronden bedoeld in de [artikelen 233][ref1] en [234][ref2], kan geen beroep worden gedaan door
      een partij die meermalen dezelfde of nagenoeg dezelfde algemene voorwaarden in haar overeenkomsten gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel234
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '234'
        afdeling: '3'
  - number: '235.4'
    text: |-
      De termijn bedoeld in [artikel 52 lid 1 onder d van Boek 3][ref1], begint met de aanvang van de dag, volgende op
      die waarop een beroep op het beding is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '236'
    text: |-
      Bij een overeenkomst tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de
      uitoefening van een beroep of bedrijf, wordt als onredelijk bezwarend aangemerkt een in de algemene voorwaarden
      voorkomend beding
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.a
    text: |-
      dat de wederpartij geheel en onvoorwaardelijk het recht ontneemt de door de gebruiker toegezegde prestatie op te
      eisen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.b
    text: |-
      dat de aan de wederpartij toekomende bevoegdheid tot ontbinding, zoals deze in [afdeling 5 van titel 5][ref1] is
      geregeld, uitsluit of beperkt;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling5
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '5'
  - number: 236.c
    text: |-
      dat een de wederpartij volgens de wet toekomende bevoegdheid tot opschorting van de nakoming uitsluit of beperkt of
      de gebruiker een verdergaande bevoegdheid tot opschorting verleent dan hem volgens de wet toekomt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.d
    text: |-
      dat de beoordeling van de vraag of de gebruiker in de nakoming van een of meer van zijn verbintenissen is te kort
      geschoten aan hem zelf overlaat, of dat de uitoefening van de rechten die de wederpartij ter zake van een zodanige
      tekortkoming volgens de wet toekomen, afhankelijk stelt van de voorwaarde dat deze eerst een derde in rechte heeft
      aangesproken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.e
    text: |-
      krachtens hetwelk de wederpartij aan de gebruiker bij voorbaat toestemming verleent zijn uit de overeenkomst
      voortvloeiende verplichtingen op een der in [afdeling 3 van titel 2][ref1] bedoelde wijzen op een derde te doen
      overgaan, tenzij de wederpartij te allen tijde de bevoegdheid heeft de overeenkomst te ontbinden, of de gebruiker
      jegens de wederpartij aansprakelijk is voor de nakoming door de derde, of de overgang plaatsvindt in verband met de
      overdracht van een onderneming waartoe zowel die verplichtingen als de daartegenover bedongen rechten behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: 236.f
    text: |-
      dat voor het geval uit de overeenkomst voor de gebruiker voortvloeiende rechten op een derde overgaan, ertoe strekt
      bevoegdheden of verweermiddelen die de wederpartij volgens de wet jegens die derde zou kunnen doen gelden, uit te
      sluiten of te beperken;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.g
    text: |-
      dat een wettelijke verjarings- of vervaltermijn waarbinnen de wederpartij enig recht moet geldend maken, tot een
      verjarings- onderscheidenlijk vervaltermijn van minder dan een jaar verkort;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.h
    text: |-
      dat voor het geval bij de uitvoering van de overeenkomst schade aan een derde wordt toegebracht door de gebruiker
      of door een persoon of zaak waarvoor deze aansprakelijk is, de wederpartij verplicht deze schade hetzij aan de
      derde te vergoeden, hetzij in haar verhouding tot de gebruiker voor een groter deel te dragen dan waartoe zij
      volgens de wet verplicht zou zijn;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.i
    text: |-
      dat de gebruiker de bevoegdheid geeft de door hem bedongen prijs binnen drie maanden na het sluiten van de
      overeenkomst te verhogen, tenzij de wederpartij bevoegd is in dat geval de overeenkomst te ontbinden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.j
    text: |-
      dat in geval van een overeenkomst tot het geregeld afleveren van zaken, elektriciteit daaronder begrepen en dag-,
      nieuws- en weekbladen en tijdschriften niet daaronder begrepen, of tot het geregeld doen van verrichtingen, leidt
      tot stilzwijgende verlenging of vernieuwing in een overeenkomst voor bepaalde duur, dan wel tot een stilzwijgende
      voortzetting in een overeenkomst voor onbepaalde duur zonder dat de wederpartij de bevoegdheid heeft om de
      voortgezette overeenkomst te allen tijde op te zeggen met een opzegtermijn van ten hoogste een maand;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.k
    text: |-
      dat de bevoegdheid van de wederpartij om bewijs te leveren uitsluit of beperkt, of dat de uit de wet voortvloeiende
      verdeling van de bewijslast ten nadele van de wederpartij wijzigt, hetzij doordat het een verklaring van haar bevat
      omtrent de deugdelijkheid van de haar verschuldigde prestatie, hetzij doordat het haar belast met het bewijs dat
      een tekortkoming van de gebruiker aan hem kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.l
    text: |-
      dat ten nadele van de wederpartij afwijkt van [artikel 37 van Boek 3][ref1], tenzij het betrekking heeft op de vorm
      van door de wederpartij af te leggen verklaringen of bepaalt dat de gebruiker het hem door de wederpartij opgegeven
      adres als zodanig mag blijven beschouwen totdat hem een nieuw adres is meegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel37
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '37'
  - number: 236.m
    text: |-
      waarbij een wederpartij die bij het aangaan van de overeenkomst werkelijke woonplaats in een gemeente in Nederland
      heeft, woonplaats kiest anders dan voor het geval zij te eniger tijd geen bekende werkelijke woonplaats in die
      gemeente zal hebben, tenzij de overeenkomst betrekking heeft op een registergoed en woonplaats ten kantore van een
      notaris wordt gekozen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.n
    text: |-
      dat voorziet in de beslechting van een geschil door een ander dan hetzij de rechter die volgens de wet bevoegd
      zou zijn, hetzij een of meer arbiters, tenzij het de wederpartij een termijn gunt van tenminste een maand nadat de
      gebruiker zich schriftelijk jegens haar op het beding heeft beroepen, om voor beslechting van het geschil door de
      volgens de wet bevoegde rechter te kiezen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.o
    text: |-
      dat de bevoegdheid van de wederpartij om de overeenkomst, die mondeling, schriftelijk of langs elektronische weg
      tot stand is gekomen, op een overeenkomstige wijze op te zeggen, uitsluit of beperkt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.p
    text: |-
      dat in geval van een overeenkomst tot het geregeld afleveren van dag-, nieuws- en weekbladen en tijdschriften,
      leidt tot een stilzwijgende verlenging of vernieuwing van de overeenkomst met een duur die langer is dan drie
      maanden, dan wel tot een stilzwijgende verlenging of vernieuwing van de overeenkomst met een duur van ten hoogste
      drie maanden zonder dat de wederpartij de bevoegdheid heeft om de overeenkomst telkens tegen het einde van de duur
      van de verlenging of de vernieuwing op te zeggen met een opzegtermijn van ten hoogste een maand;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.q
    text: |-
      dat in geval van een overeenkomst tot het geregeld afleveren van dag-, nieuws- en weekbladen en tijdschriften,
      leidt tot een stilzwijgende voortzetting in een overeenkomst voor onbepaalde duur zonder dat de wederpartij de
      bevoegdheid heeft om de voortgezette overeenkomst te allen tijde op te zeggen met een opzegtermijn van ten hoogste
      een maand of, in geval de geregelde aflevering minder dan eenmaal per maand plaats heeft, met een opzegtermijn van
      ten hoogste drie maanden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.r
    text: |-
      dat de wederpartij verplicht de verklaring tot opzegging van een overeenkomst als bedoeld onder j of p
      respectievelijk q te laten plaatsvinden op een bepaald moment;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: 236.s
    text: |-
      dat in geval van een overeenkomst met beperkte duur tot het geregeld ter kennismaking afleveren van dag-, nieuws-,
      weekbladen en tijdschriften leidt tot voortzetting van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel236
  - number: '237'
    text: |-
      Bij een overeenkomst tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de
      uitoefening van een beroep of bedrijf, wordt vermoed onredelijk bezwarend te zijn een in de algemene voorwaarden
      voorkomend beding
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.a
    text: |-
      dat de gebruiker een, gelet op de omstandigheden van het geval, ongebruikelijk lange of onvoldoende bepaalde
      termijn geeft om op een aanbod of een andere verklaring van de wederpartij te reageren;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.b
    text: |-
      dat de inhoud van de verplichtingen van de gebruiker wezenlijk beperkt ten opzichte van hetgeen de wederpartij,
      mede gelet op de wettelijke regels die op de overeenkomst betrekking hebben, zonder dat beding redelijkerwijs mocht
      verwachten;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.c
    text: |-
      dat de gebruiker de bevoegdheid verleent een prestatie te verschaffen die wezenlijk van de toegezegde prestatie
      afwijkt, tenzij de wederpartij bevoegd is in dat geval de overeenkomst te ontbinden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.d
    text: |-
      dat de gebruiker van zijn gebondenheid aan de overeenkomst bevrijdt of hem de bevoegdheid daartoe geeft anders dan
      op in de overeenkomst vermelde gronden welke van dien aard zijn dat deze gebondenheid niet meer van hem kan worden
      gevergd;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.e
    text: dat de gebruiker een ongebruikelijk lange of onvoldoende bepaalde termijn voor de nakoming geeft;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.f
    text: dat de gebruiker of een derde geheel of ten dele bevrijdt van een wettelijke verplichting tot schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.g
    text: |-
      dat een de wederpartij volgens de wet toekomende bevoegdheid tot verrekening uitsluit of beperkt of de gebruiker
      een verdergaande bevoegdheid tot verrekening verleent dan hem volgens de wet toekomt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.h
    text: |-
      dat als sanctie op bepaalde gedragingen van de wederpartij, nalaten daaronder begrepen, verval stelt van haar
      toekomende rechten of van de bevoegdheid bepaalde verweren te voeren, behoudens voor zover deze gedragingen het
      verval van die rechten of verweren rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.i
    text: |-
      dat voor het geval de overeenkomst wordt beëindigd anders dan op grond van het feit dat de wederpartij in de
      nakoming van haar verbintenis is tekort geschoten, de wederpartij verplicht een geldsom te betalen, behoudens voor
      zover het betreft een redelijke vergoeding voor door de gebruiker geleden verlies of gederfde winst;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.j
    text: |-
      dat de wederpartij verplicht tot het sluiten van een overeenkomst met de gebruiker of met een derde, tenzij dit,
      mede gelet op het verband van die overeenkomst met de in dit artikel bedoelde overeenkomst, redelijkerwijze van de
      wederpartij kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.k
    text: |-
      dat voor een overeenkomst als bedoeld in [artikel 236 onder j of p respectievelijk q][ref1] een duur bepaalt van
      meer dan een jaar, tenzij de wederpartij na een jaar de bevoegdheid heeft de overeenkomst te allen tijde op te
      zeggen met een opzegtermijn van ten hoogste een maand;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
        afdeling: '3'
  - number: 237.l
    text: |-
      dat de wederpartij aan een opzegtermijn bindt die langer is dan de termijn waarop de gebruiker de overeenkomst
      kan opzeggen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.m
    text: |-
      dat voor de geldigheid van een door de wederpartij te verrichten verklaring een strengere vorm dan het vereiste van
      een onderhandse akte stelt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.n
    text: |-
      dat bepaalt dat een door de wederpartij verleende volmacht onherroepelijk is of niet eindigt door haar dood of
      ondercuratelestelling, tenzij de volmacht strekt tot levering van een registergoed;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
  - number: 237.o
    text: |-
      dat de wederpartij bij overeenkomsten, niet zijnde verlengde, vernieuwde of voortgezette overeenkomsten als bedoeld
      in [artikel 236, onder j of p respectievelijk q][ref1], aan een opzegtermijn bindt die langer is dan een maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
        afdeling: '3'
  - number: '238.1'
    text: |-
      Bij een overeenkomst als bedoeld in de [artikelen 236][ref1] en [237][ref2], kan jegens de wederpartij geen beroep
      worden gedaan


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
        afdeling: '3'
  - number: 238.1.a
    text: |-
      op het feit dat de overeenkomst in naam van een derde is gesloten, indien dit beroep berust op het enkele feit dat
      een beding van deze strekking in de algemene voorwaarden voorkomt;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel238
  - number: 238.1.b
    text: |-
      op het feit dat de algemene voorwaarden beperkingen bevatten van de bevoegdheid van een gevolmachtigde van de
      gebruiker, die zo ongebruikelijk zijn dat de wederpartij ze zonder het beding niet behoefde te verwachten, tenzij
      zij ze kende.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel238
  - number: '238.2'
    text: |-
      Bij een overeenkomst als bedoeld in de [artikelen 236][ref1] en [237][ref2] moeten de bedingen duidelijk en
      begrijpelijk zijn opgesteld. Bij twijfel over de betekenis van een beding, prevaleert de voor de wederpartij
      gunstigste uitleg.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
        afdeling: '3'
  - number: '239.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen de [onderdelen ][ref1] worden gewijzigd en kan hun toepassingsgebied
      worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '237'
        afdeling: '3'
  - number: '239.2'
    text: |-
      Alvorens een voordracht tot vaststelling, wijziging of intrekking van een maatregel als bedoeld in het eerste
      lid te doen, kan Onze Minister van Justitie de naar zijn oordeel representatieve organisaties van hen die bij het
      sluiten van de overeenkomsten waarop de maatregel betrekking heeft, algemene voorwaarden plegen te gebruiken en van
      hen die bij die overeenkomsten als hun wederpartij plegen op te treden, horen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel239
  - number: '239.3'
    text: |-
      Een besluit als in het eerste lid bedoeld wordt zodra het is vastgesteld toegezonden aan de voorzitters van de
      beide Kamers van de Staten-Generaal. Een dergelijk besluit treedt niet in werking dan nadat twee maanden zijn
      verstreken sinds de datum van uitgifte van het *Staatsblad* waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel239
  - number: '240.1'
    text: |-
      Op vordering van een rechtspersoon als bedoeld in lid 3 kunnen bepaalde bedingen in bepaalde algemene voorwaarden
      onredelijk bezwarend worden verklaard; de [artikelen 233 onder ][ref1], [236][ref2] en [237][ref3] zijn van
      overeenkomstige toepassing. Voor de toepassing van de vorige zin wordt een beding in algemene voorwaarden dat in
      strijd is met een dwingende wetsbepaling, als onredelijk bezwarend aangemerkt. Bij de beoordeling van een beding
      blijft de uitlegregel van [artikel 238 lid 2, tweede zin][ref4], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel238
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '236'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '237'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '238'
        afdeling: '3'
  - number: '240.2'
    text: |-
      De vordering kan worden ingesteld tegen de gebruiker, alsmede tegen een rechtspersoon met volledige
      rechtsbevoegdheid die ten doel heeft de behartiging van de belangen van personen die een beroep of bedrijf
      uitoefenen, indien hij het gebruik van de algemene voorwaarden door die personen bevordert.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
  - number: '240.3'
    text: |-
      De vordering komt toe aan rechtspersonen met volledige rechtsbevoegdheid die ten doel hebben de behartiging
      van belangen van personen die een beroep of bedrijf uitoefenen of van eindgebruikers van niet voor een beroep
      of bedrijf bestemde goederen of diensten. Zij kan slechts betrekking hebben op algemene voorwaarden die worden
      gebruikt of bestemd zijn te worden gebruikt in overeenkomsten met personen wier belangen door de rechtspersoon
      worden behartigd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
  - number: '240.4'
    text: |-
      De eiser is niet ontvankelijk indien niet blijkt dat hij, alvorens de vordering in te stellen, de gebruiker of,
      in het geval bedoeld in [artikel 1003 van het Wetboek van Burgerlijke Rechtsvordering][ref1], de aldaar bedoelde
      vereniging, de gelegenheid heeft geboden om in onderling overleg de algemene voorwaarden zodanig te wijzigen dat de
      bezwaren die grond voor de vordering zouden opleveren, zijn weggenomen. Een termijn van twee weken na de ontvangst
      van een verzoek tot overleg onder vermelding van de bezwaren, is daartoe in elk geval voldoende.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1003'
  - number: '240.5'
    text: |-
      Voor zover een rechtspersoon met het gebruik van bedingen in algemene voorwaarden heeft ingestemd, komt hem geen
      vordering als bedoeld in lid 1 toe.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
  - number: '240.6'
    text: |-
      Met een rechtspersoon als bedoeld in lid 3 wordt gelijk gesteld een organisatie of openbaar lichaam met zetel
      buiten Nederland welke geplaatst is op de lijst, bedoeld in artikel 4 lid 3 van [richtlijn nr. 98/27/EG]
      (31998L0027) van het Europees Parlement en de Raad van de Europese Unie van 19 mei 1998 betreffende het doen staken
      van inbreuken in het raam van de bescherming van consumentenbelangen (PbEG L 166), mits de vordering betrekking
      heeft op algemene voorwaarden die worden gebruikt of bestemd zijn te worden gebruikt in overeenkomsten met personen
      die hun gewone verblijfplaats hebben in het land waar de organisatie of het openbaar lichaam gezeteld is, en de
      organisatie deze belangen ingevolge haar doelstelling behartigt of aan het openbaar lichaam de behartiging van deze
      belangen is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel240
  - number: '241.1'
    text: |-
      Het gerechtshof Den Haag is bij uitsluiting bevoegd tot kennisneming van vorderingen als in het vorige artikel
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: '241.2'
    text: |-
      De in het vorige artikel bedoelde rechtspersonen hebben de bevoegdheden, geregeld in de [artikelen 217][ref1]
      en [376 van het Wetboek van Burgerlijke Rechtsvordering][ref2]; [artikel 379 van dat wetboek][ref3] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel376
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel379
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '376'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '379'
  - number: '241.3'
    text: Op vordering van de eiser kan aan de uitspraak worden verbonden
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: 241.3.a
    text: een verbod van het gebruik van de door de uitspraak getroffen bedingen of van het bevorderen daarvan;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: 241.3.b
    text: een gebod om een aanbeveling tot het gebruik van deze bedingen te herroepen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: 241.3.c
    text: |-
      een veroordeling tot het openbaar maken of laten openbaar maken van de uitspraak, zulks op door de rechter te
      bepalen wijze en op kosten van de door de rechter aan te geven partij of partijen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: '241.4'
    text: |-
      De rechter kan in zijn uitspraak aangeven op welke wijze het onredelijk bezwarend karakter van de bedingen waarop
      de uitspraak betrekking heeft, kan worden weggenomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: '241.5'
    text: |-
      Geschillen terzake van de tenuitvoerlegging van de in lid 3 bedoelde veroordelingen, alsmede van de veroordeling
      tot betaling van een dwangsom, zo deze is opgelegd, worden bij uitsluiting door het gerechtshof Den Haag beslist.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
  - number: '241.6'
    text: |-
      Tot kennisneming van vorderingen in kort geding strekkende tot veroordelingen als bedoeld in lid 3, ingesteld
      door rechtspersonen als bedoeld in [artikel 240 lid 3][ref1], is de voorzieningenrechter van de rechtbank Den Haag
      bij uitsluiting bevoegd. Lid 5, alsmede de [artikelen 62][ref2], [116 lid 2][ref3], [1003][ref4], [1005][ref5],
      [1006 van het Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel1005
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel1006
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '240'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '116'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '1003'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '1005'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '1006'
  - number: '242.1'
    text: |-
      Op vordering van een of meer van degenen tegen wie de in [artikel 240 lid 1][ref1] bedoelde uitspraak is
      gedaan, kan de rechter die uitspraak wijzigen of opheffen op grond dat zij tengevolge van een wijziging in de
      omstandigheden niet langer gerechtvaardigd is. De vordering wordt ingesteld tegen de rechtspersoon op wiens
      vordering de uitspraak was gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel240
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '240'
        afdeling: '3'
  - number: '242.2'
    text: |-
      Indien de rechtspersoon op wiens vordering de uitspraak was gedaan, is
      ontbonden, wordt de zaak met een verzoekschrift ingeleid. Voor de toepassing van
      [artikel 279 lid 1 van het Wetboek van Burgerlijke Rechtsvordering][ref1] worden rechtspersonen als bedoeld in
      [artikel 240 lid 3][ref2] als belanghebbenden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel279
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel240
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '279'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '240'
        afdeling: '3'
  - number: '242.3'
    text: |-
      [Artikel 241 leden 1, 2, 3 onder ][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel241
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '241'
        afdeling: '3'
  - number: '242.4'
    text: |-
      De vorige leden zijn niet van toepassing voor zover de uitspraak betrekking had op een beding dat door de wet als
      onredelijk bezwarend wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel242
  - number: '243'
    text: |-
      Een beding in algemene voorwaarden dat door degene jegens wie een verbod tot gebruik ervan is uitgesproken,
      in strijd met het verbod in een overeenkomst wordt opgenomen, is vernietigbaar. [Artikel 235][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel235
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '235'
        afdeling: '3'
  - number: '244.1'
    text: |-
      Een persoon die handelt in de uitoefening van een beroep of bedrijf, kan geen beroep doen op een beding in een
      overeenkomst met een partij die terzake van de goederen of diensten waarop die overeenkomst betrekking heeft, met
      gebruikmaking van algemene voorwaarden overeenkomsten met haar afnemers heeft gesloten, voor zover een beroep op
      dat beding onredelijk zou zijn wegens zijn nauwe samenhang met een in de algemene voorwaarden voorkomend beding dat
      krachtens deze afdeling is vernietigd of door een uitspraak als bedoeld in [artikel 240 lid 1][ref1] is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel240
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '240'
        afdeling: '3'
  - number: '244.2'
    text: |-
      Is tegen de gebruiker een vordering als bedoeld in [artikel 240 lid 1][ref1] ingesteld, dan is hij bevoegd die
      persoon in het geding te roepen teneinde voor recht te horen verklaren dat een beroep als bedoeld in het vorige
      lid onredelijk zou zijn. [Artikel 241 leden 2, 3 onder ][ref2] alsmede de [artikelen 210][ref3], [211][ref4] en
      [215 van het Wetboek van Burgerlijke Rechtsvordering][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel210
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel211
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel215
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '240'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '210'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '211'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '215'
  - number: '244.3'
    text: |-
      Op de uitspraak is [artikel 242][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel242
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '242'
        afdeling: '3'
  - number: '244.4'
    text: |-
      Op eerdere overeenkomsten met betrekking tot de voormelde goederen en diensten zijn de leden 1-3 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel244
  - number: '245'
    text: Deze afdeling is noch van toepassing op arbeidsovereenkomsten, noch op collectieve arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel245
  - number: '246'
    text: |-
      Noch van de [artikelen 231-244][ref1], noch van de bepalingen van de in [artikel 239 lid 1][ref2] bedoelde algemene
      maatregelen van bestuur kan worden afgeweken. De bevoegdheid om een beding krachtens deze afdeling door een
      buitengerechtelijke verklaring te vernietigen, kan niet worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel239
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel246
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '231'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '239'
        afdeling: '3'
  - number: '247.1'
    text: |-
      Op overeenkomsten tussen partijen die handelen in de uitoefening van een beroep of bedrijf en die beide in
      Nederland gevestigd zijn, is deze afdeling van toepassing, ongeacht het recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel247
  - number: '247.2'
    text: |-
      Op overeenkomsten tussen partijen die handelen in de uitoefening van een beroep of bedrijf en die niet beide in
      Nederland gevestigd zijn, is deze afdeling niet van toepassing, ongeacht het recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel247
  - number: '247.3'
    text: |-
      Een partij is in de zin van de leden 1 en 2 in Nederland gevestigd, indien haar hoofdvestiging, of, zo de prestatie
      volgens de overeenkomst door een andere vestiging dan de hoofdvestiging moet worden verricht, deze andere vestiging
      zich in Nederland bevindt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel247
  - number: '247.4'
    text: |-
      Op overeenkomsten tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de uitoefening
      van een beroep of bedrijf, is, indien de wederpartij haar gewone verblijfplaats in Nederland heeft, deze afdeling
      van toepassing, ongeacht het recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel247
  - number: '248.1'
    text: |-
      Een overeenkomst heeft niet alleen de door partijen overeengekomen rechtsgevolgen, maar ook die welke, naar de aard
      van de overeenkomst, uit de wet, de gewoonte of de eisen van redelijkheid en billijkheid voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel248
  - number: '248.2'
    text: |-
      Een tussen partijen als gevolg van de overeenkomst geldende regel is niet van toepassing, voor zover dit in de
      gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel248
  - number: '249'
    text: |-
      De rechtsgevolgen van een overeenkomst gelden mede voor de rechtverkrijgenden onder algemene titel, tenzij
      uit de overeenkomst iets anders voortvloeit. In het geval van verdeling van een nalatenschap ingevolge
      [artikel 13 van Boek 4][ref1] gelden de rechtsgevolgen van de overeenkomst niet mede voor de kinderen van de
      erflater, tenzij uit de overeenkomst anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '250'
    text: |-
      Bij overeenkomst kan worden afgeweken van de volgende artikelen van deze afdeling, met uitzondering van de
      [artikelen 251 lid 3][ref1], [252 lid 2][ref2] voor zover het de eis van een notariële akte betreft, en lid 3,
      [253 lid 1][ref3], [257][ref4], [258][ref5], [259][ref6] en [260][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel253
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel257
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel258
      [ref6]: https://wetten.overheid.nl/BWBR0005289#Artikel259
      [ref7]: https://wetten.overheid.nl/BWBR0005289#Artikel260
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '251'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '252'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '253'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '257'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '258'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005289
        artikel: '259'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0005289
        artikel: '260'
        afdeling: '4'
  - number: '251.1'
    text: |-
      Staat een uit een overeenkomst voortvloeiende, voor overgang vatbaar recht in een zodanig verband met een aan de
      schuldeiser toebehorend goed, dat hij bij dat recht slechts belang heeft, zolang hij het goed behoudt, dan gaat dat
      recht over op degene die dat goed onder bijzondere titel verkrijgt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel251
  - number: '251.2'
    text: |-
      Is voor het recht een tegenprestatie overeengekomen, dan gaat de verplichting tot het verrichten van die
      tegenprestatie mede over, voor zover deze betrekking heeft op de periode na de overgang. De vervreemder blijft
      naast de verkrijger jegens de wederpartij aansprakelijk, behoudens voor zover deze zich na de overgang in geval
      van uitblijven van de tegenprestatie van haar verbintenis kan bevrijden door ontbinding of beëindiging van de
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel251
  - number: '251.3'
    text: |-
      Het in de vorige leden bepaalde geldt niet, indien de verkrijger van het goed tot de wederpartij bij de
      overeenkomst een verklaring richt dat hij de overgang van het recht niet aanvaardt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel251
  - number: '251.4'
    text: Uit de rechtshandeling waarbij het goed wordt overgedragen, kan voortvloeien dat geen overgang plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel251
  - number: '252.1'
    text: |-
      Bij een overeenkomst kan worden bedongen dat de verplichting van een der partijen om iets te dulden of niet te
      doen ten aanzien van een haar toebehorend registergoed, zal overgaan op degenen die het goed onder bijzondere titel
      zullen verkrijgen, en dat mede gebonden zullen zijn degenen die van de rechthebbende een recht tot gebruik van het
      goed zullen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: '252.2'
    text: |-
      Voor de werking van het in lid 1 bedoelde beding is vereist dat van de overeenkomst tussen partijen een notariële
      akte wordt opgemaakt, gevolgd door inschrijving daarvan in de openbare registers. Degene jegens wie de verplichting
      bestaat, waarop het beding betrekking heeft, moet in de akte ter zake van de inschrijving woonplaats kiezen in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: '252.3'
    text: 'Ook na inschrijving heeft het beding geen werking:'
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: 252.3.a
    text: |-
      jegens hen die voor de inschrijving onder bijzondere titel een recht op het goed of tot gebruik van het goed hebben
      verkregen;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: 252.3.b
    text: |-
      jegens een beslaglegger op het goed of een recht daarop, indien de inschrijving op het tijdstip van de inschrijving
      van het proces-verbaal van inbeslagneming nog niet had plaats gevonden;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: 252.3.c
    text: |-
      jegens hen die hun recht hebben verkregen van iemand die ingevolge het onder *a* of *b* bepaalde niet aan de
      bedongen verplichting gebonden was.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: '252.4'
    text: |-
      Is voor de verplichting een tegenprestatie overeengekomen, dan gaat bij de overgang van de verplichting het recht
      op de tegenprestatie mee over, voor zover deze betrekking heeft op de periode na de overgang en ook het beding
      omtrent deze tegenprestatie in de registers ingeschreven is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: '252.5'
    text: |-
      Dit artikel is niet van toepassing op verplichtingen die een rechthebbende beperken in zijn bevoegdheid het goed te
      vervreemden of te bezwaren.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel252
  - number: '253.1'
    text: |-
      Een overeenkomst schept voor een derde het recht een prestatie van een der partijen te vorderen of op andere wijze
      jegens een van hen een beroep op de overeenkomst te doen, indien de overeenkomst een beding van die strekking
      inhoudt en de derde dit beding aanvaardt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel253
  - number: '253.2'
    text: Tot de aanvaarding kan het beding door degene die het heeft gemaakt, worden herroepen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel253
  - number: '253.3'
    text: |-
      Een aanvaarding of herroeping van het beding geschiedt door een verklaring, gericht tot een van de beide andere
      betrokkenen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel253
  - number: '253.4'
    text: |-
      Is het beding onherroepelijk en jegens de derde om niet gemaakt, dan geldt het als aanvaard, indien het ter kennis
      van de derde is gekomen en door deze niet onverwijld is afgewezen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel253
  - number: '254.1'
    text: Nadat de derde het beding heeft aanvaard, geldt hij als partij bij de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel254
  - number: '254.2'
    text: |-
      Hij kan, indien dit met de strekking van het beding in overeenstemming is, daaraan ook rechten ontlenen over de
      periode vóór de aanvaarding.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel254
  - number: '255.1'
    text: |-
      Heeft een beding ten behoeve van een derde ten opzichte van die derde geen gevolg, dan kan degene die het beding
      heeft gemaakt, hetzij zichzelf, hetzij een andere derde als rechthebbende aanwijzen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel255
  - number: '255.2'
    text: |-
      Hij wordt geacht zichzelf als rechthebbende te hebben aangewezen, wanneer hem door degene van wie de prestatie
      is bedongen, een redelijke termijn voor de aanwijzing is gesteld en hij binnen deze termijn geen aanwijzing heeft
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel255
  - number: '256'
    text: |-
      De partij die een beding ten behoeve van een derde heeft gemaakt, kan nakoming jegens de derde vorderen, tenzij
      deze zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel256
  - number: '257'
    text: |-
      Kan een partij bij een overeenkomst ter afwering van haar aansprakelijkheid voor een gedraging van een aan
      haar ondergeschikte aan de overeenkomst een verweermiddel jegens haar wederpartij ontlenen, dan kan ook de
      ondergeschikte, indien hij op grond van deze gedraging door de wederpartij wordt aangesproken, dit verweermiddel
      inroepen, als ware hijzelf bij de overeenkomst partij.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel257
  - number: '258.1'
    text: |-
      De rechter kan op verlangen van een der partijen de gevolgen van een overeenkomst wijzigen of deze geheel of
      gedeeltelijk ontbinden op grond van onvoorziene omstandigheden welke van dien aard zijn dat de wederpartij naar
      maatstaven van redelijkheid en billijkheid ongewijzigde instandhouding van de overeenkomst niet mag verwachten. Aan
      de wijziging of ontbinding kan terugwerkende kracht worden verleend.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel258
  - number: '258.2'
    text: |-
      Een wijziging of ontbinding wordt niet uitgesproken, voor zover de omstandigheden krachtens de aard van de
      overeenkomst of de in het verkeer geldende opvattingen voor rekening komen van degene die zich erop beroept.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel258
  - number: '258.3'
    text: |-
      Voor de toepassing van dit artikel staat degene op wie een recht of een verplichting uit een overeenkomst is
      overgegaan, met een partij bij die overeenkomst gelijk.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel258
  - number: '259.1'
    text: |-
      Indien een overeenkomst ertoe strekt een rechthebbende op of een gebruiker van een registergoed als zodanig te
      verplichten tot een prestatie die niet bestaat in of gepaard gaat met het dulden van voortdurend houderschap, kan
      de rechter op zijn verlangen de gevolgen van de overeenkomst wijzigen of deze geheel of gedeeltelijk ontbinden:
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel259
  - number: 259.1.a
    text: |-
      indien ten minste tien jaren na het sluiten van de overeenkomst zijn verlopen en het ongewijzigd voortduren van de
      verplichting in strijd is met het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel259
  - number: 259.1.b
    text: |-
      indien de schuldeiser bij de nakoming van de verplichting geen redelijk belang meer heeft en het niet aannemelijk
      is dat dit belang zal terugkeren.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel259
  - number: '259.2'
    text: |-
      Voor de termijn vermeld in lid 1 onder *a* telt mee de gehele periode waarin rechthebbende op of gebruikers van
      het goed aan een beding van dezelfde strekking gebonden zijn geweest. De termijn geldt niet, voor zover de strijd
      met het algemeen belang hierin bestaat dat het beding een beletsel vormt voor verwerkelijking van een geldend
      bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel259
  - number: '260.1'
    text: |-
      Een wijziging of ontbinding als bedoeld in de [artikelen 258][ref1] en [259][ref2] kan worden uitgesproken onder
      door de rechter te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel259
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '258'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '259'
        afdeling: '4'
  - number: '260.2'
    text: |-
      Indien hij op grond van die artikelen de overeenkomst wijzigt of gedeeltelijk ontbindt, kan hij bepalen dat een
      of meer der partijen de overeenkomst binnen een bij de uitspraak vast te stellen termijn door een schriftelijke
      verklaring geheel zal kunnen ontbinden. De wijziging of gedeeltelijke ontbinding treedt niet in, voordat deze
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel260
  - number: '260.3'
    text: |-
      Is de overeenkomst die op grond van de [artikelen 258][ref1] en [259][ref2] wordt gewijzigd of geheel of
      gedeeltelijk ontbonden, ingeschreven in de openbare registers, dan kan ook de uitspraak waarbij de wijziging
      of ontbinding plaatsvond, daarin worden ingeschreven, mits deze uitspraak in kracht van gewijsde is gegaan of
      uitvoerbaar bij voorraad is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel259
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '258'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '259'
        afdeling: '4'
  - number: '260.4'
    text: |-
      Wordt iemand te dier zake gedagvaard aan zijn overeenkomstig [artikel 252 lid 2, eerste zin][ref1], gekozen
      woonplaats, dan zijn daarmee tevens gedagvaard al zijn rechtverkrijgenden die geen nieuwe inschrijving hebben
      genomen. [Artikel 29 lid 2 en lid 3, tweede tot en met vierde zin, van Boek 3][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel29
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '29'
  - number: '260.5'
    text: |-
      Andere rechtsfeiten die een ingeschreven overeenkomst wijzigen of beëindigen, zijn eveneens inschrijfbaar, voor
      zover het rechterlijke uitspraken betreft mits zij in kracht van gewijsde zijn gegaan of uitvoerbaar bij voorraad
      zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel260
  - number: '261.1'
    text: |-
      Een overeenkomst is wederkerig, indien elk van beide partijen een verbintenis op zich neemt ter verkrijging van de
      prestatie waartoe de wederpartij zich daartegenover jegens haar verbindt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel261
  - number: '261.2'
    text: |-
      De bepalingen omtrent wederkerige overeenkomsten zijn van overeenkomstige toepassing op andere rechtsbetrekkingen
      die strekken tot het wederzijds verrichten van prestaties, voor zover de aard van die rechtsbetrekkingen zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel261
  - number: '262.1'
    text: |-
      Komt een der partijen haar verbintenis niet na, dan is de wederpartij bevoegd de nakoming van haar daartegenover
      staande verplichtingen op te schorten.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel262
  - number: '262.2'
    text: |-
      In geval van gedeeltelijke of niet behoorlijke nakoming is opschorting slechts toegelaten, voor zover de
      tekortkoming haar rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel262
  - number: '263.1'
    text: |-
      De partij die verplicht is het eerst te presteren, is niettemin bevoegd de nakoming van haar verbintenis op te
      schorten, indien na het sluiten van de overeenkomst te harer kennis gekomen omstandigheden haar goede grond geven
      te vrezen dat de wederpartij haar daartegenover staande verplichtingen niet zal nakomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel263
  - number: '263.2'
    text: |-
      In geval er goede grond bestaat te vrezen dat slechts gedeeltelijk of niet behoorlijk zal worden nagekomen, is de
      opschorting slechts toegelaten voor zover de tekortkoming haar rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel263
  - number: '264'
    text: |-
      In geval van opschorting op grond van de [artikelen 262][ref1] en [263][ref2] zijn de [artikelen 54 onder ][ref3]
      en [55][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel263
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel55
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '262'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '263'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '54'
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '55'
        afdeling: '7'
  - number: '265.1'
    text: |-
      Iedere tekortkoming van een partij in de nakoming van een van haar verbintenissen geeft aan de wederpartij de
      bevoegdheid om de overeenkomst geheel of gedeeltelijk te ontbinden, tenzij de tekortkoming, gezien haar bijzondere
      aard of geringe betekenis, deze ontbinding met haar gevolgen niet rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel265
  - number: '265.2'
    text: |-
      Voor zover nakoming niet blijvend of tijdelijk onmogelijk is, ontstaat de bevoegdheid tot ontbinding pas, wanneer
      de schuldenaar in verzuim is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel265
  - number: '266.1'
    text: |-
      Geen ontbinding kan worden gegrond op een tekortkoming in de nakoming van een verbintenis ten aanzien waarvan de
      schuldeiser zelf in verzuim is.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel266
  - number: '266.2'
    text: |-
      Wordt echter tijdens het verzuim van de schuldeiser behoorlijke nakoming geheel of gedeeltelijk onmogelijk, dan kan
      de overeenkomst ontbonden worden, indien door schuld van de schuldenaar of zijn ondergeschikte is tekortgeschoten
      in de zorg die in de gegeven omstandigheden van hem mocht worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel266
  - number: '267.1'
    text: |-
      De ontbinding vindt plaats door een schriftelijke verklaring van de daartoe gerechtigde. Indien de overeenkomst
      langs elektronische weg is totstandgekomen, kan deze tevens door een langs elektronische weg uitgebrachte
      verklaring worden ontbonden. [Artikel 227a lid 1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227a
        afdeling: '2'
  - number: '267.2'
    text: Zij kan ook op zijn vordering door de rechter worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel267
  - number: '268'
    text: |-
      De bevoegdheid tot buitengerechtelijke ontbinding vervalt door verjaring van de rechtsvordering tot ontbinding.
      De verjaring staat niet in de weg aan gerechtelijke of buitengerechtelijke ontbinding ter afwering van een op de
      overeenkomst steunende rechtsvordering of andere rechtsmaatregel.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel268
  - number: '269'
    text: |-
      De ontbinding heeft geen terugwerkende kracht, behoudens dat een aanbod tot nakoming, gedaan nadat de ontbinding is
      gevorderd, geen werking heeft, indien de ontbinding wordt uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel269
  - number: '270'
    text: |-
      Een gedeeltelijke ontbinding houdt een evenredige vermindering in van de wederzijdse prestaties in hoeveelheid
      of hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel270
  - number: '271'
    text: |-
      Een ontbinding bevrijdt de partijen van de daardoor getroffen verbintenissen. Voor zover deze reeds zijn nagekomen,
      blijft de rechtsgrond voor deze nakoming in stand, maar ontstaat voor partijen een verbintenis tot ongedaanmaking
      van de reeds door hen ontvangen prestaties.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel271
  - number: '272.1'
    text: |-
      Sluit de aard van de prestatie uit dat zij ongedaan wordt gemaakt, dan treedt daarvoor een vergoeding in de plaats
      ten belope van haar waarde op het tijdstip van de ontvangst.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel272
  - number: '272.2'
    text: |-
      Heeft de prestatie niet aan de verbintenis beantwoord, dan wordt deze vergoeding beperkt tot het bedrag van de
      waarde die de prestatie voor de ontvanger op dit tijdstip in de gegeven omstandigheden werkelijk heeft gehad.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel272
  - number: '273'
    text: |-
      Een partij die een prestatie heeft ontvangen, is vanaf het tijdstip dat zij redelijkerwijze met een ontbinding
      rekening moet houden, verplicht er als een zorgvuldig schuldenaar zorg voor te dragen dat de ingevolge
      die ontbinding verschuldigde ongedaanmaking van de prestatie mogelijk zal zijn. [Artikel 78][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel78
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '78'
        paragraaf: '1'
        afdeling: '9'
  - number: '274'
    text: |-
      Heeft een partij in weerwil van een dreigende ontbinding te kwader trouw een prestatie ontvangen, dan wordt zij na
      de ontbinding geacht vanaf de ontvangst van de prestatie in verzuim geweest te zijn.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel274
  - number: '275'
    text: |-
      De [artikelen 120-124 van Boek 3][ref1] zijn van overeenkomstige toepassing met betrekking tot hetgeen daarin is
      bepaald omtrent de afgifte van vruchten en de vergoeding van kosten en schade.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel120
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '120'
  - number: '276'
    text: |-
      Op de onbekwame die een prestatie heeft ontvangen, rusten de in deze afdeling omschreven verplichtingen
      slechts, voor zover het ontvangene hem tot werkelijk voordeel heeft gestrekt of in de macht van zijn wettelijke
      vertegenwoordiger is gekomen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel276
  - number: '277.1'
    text: |-
      Wordt een overeenkomst geheel of gedeeltelijk ontbonden, dan is de partij wier tekortkoming een grond voor
      ontbinding heeft opgeleverd, verplicht haar wederpartij de schade te vergoeden die deze lijdt, doordat geen
      wederzijdse nakoming doch ontbinding van de overeenkomst plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel277
  - number: '277.2'
    text: |-
      Indien de tekortkoming niet aan de schuldenaar kan worden toegerekend, is het vorige lid slechts van toepassing
      binnen de grenzen van het in [artikel 78][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel78
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '78'
        paragraaf: '1'
        afdeling: '9'
  - number: '278.1'
    text: |-
      De partij die ontbinding kiest van een reeds uitgevoerde overeenkomst, nadat de verhouding in waarde tussen hetgeen
      wederzijds bij ongedaanmaking zou moeten worden verricht, zich te haren gunste heeft gewijzigd, is verplicht door
      bijbetaling de oorspronkelijke waardeverhouding te herstellen, indien aannemelijk is dat zij zonder deze wijziging
      geen ontbinding zou hebben gekozen.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel278
  - number: '278.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing ingeval de partij te wier gunste de wijziging is ingetreden,
      op andere grond dan ontbinding de stoot tot ongedaanmaking geeft en aannemelijk is dat zij daartoe zonder deze
      wijziging niet zou zijn overgegaan.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel278
  - number: '279.1'
    text: |-
      Op overeenkomsten waaruit tussen meer dan twee partijen verbintenissen voortvloeien, vinden de bepalingen
      betreffende wederkerige overeenkomsten met inachtneming van de volgende leden overeenkomstige toepassing, voor
      zover de aard van de overeenkomst zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel279
  - number: '279.2'
    text: |-
      De partij die een verbintenis op zich heeft genomen ter verkrijging van een daartegenover van een of meer der
      andere partijen bedongen prestatie, kan haar recht op ontbinding gronden op een tekortkoming in de nakoming van de
      verbintenis jegens haarzelf.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel279
  - number: '279.3'
    text: |-
      Schiet een partij met samenhangende rechten en verplichtingen zelf tekort in de nakoming van haar verbintenis, dan
      kunnen in ieder geval de overige partijen gezamenlijk de overeenkomst ontbinden.
    url: https://wetten.overheid.nl/BWBR0005289/2013-03-16#Artikel279
