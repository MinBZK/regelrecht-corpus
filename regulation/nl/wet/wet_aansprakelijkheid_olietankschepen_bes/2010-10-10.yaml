    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot vergoedingen, verschuldigd
      voor de afgifte of waarmerking van een certificaat, bedoeld in [artikelen 18][ref1] en [19][ref2], betreffende
      de hoogte van de in [artikel 30, vierde lid][ref3], bedoelde rente, alsmede, indien dit in het belang van een
      goede uitvoering van deze wet of in verband met internationale afspraken inzake de uitvoering van het Verdrag
      noodzakelijk is, met betrekking tot andere in de [Hoofdstukken I tot en met V][ref4] geregelde onderwerpen.


