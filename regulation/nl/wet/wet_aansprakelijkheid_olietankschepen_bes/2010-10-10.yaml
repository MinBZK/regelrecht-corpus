  - number: '34'
    text: |-
      1 Indien een bij of krachtens deze wet strafbaar gestelde gedraging wordt begaan door of vanwege een rechtspersoon,
      een vennootschap, een andere vereniging van personen of een doelvermogen, wordt de strafvervolging ingesteld
      en worden de straffen uitgesproken hetzij tegen die rechtspersoon, die vennootschap, die vereniging of dat
      doelvermogen, hetzij tegen hen die tot de gedraging opdracht hebben gegeven of die feitelijk leiding hebben gehad
      bij het verboden handelen of nalaten, hetzij tegen hen gezamenlijk.

      2 Een bij of krachtens deze wet strafbaar gestelde gedraging wordt onder meer begaan door of vanwege een
      rechtspersoon, een vennootschap, een vereniging van personen of een doelvermogen, indien zij begaan wordt door
      personen die hetzij uit hoofde van een dienstbetrekking, hetzij uit anderen hoofde, handelen in de sfeer van de
      rechtspersoon, de vennootschap, de vereniging of het doelvermogen, ongeacht of deze personen ieder afzonderlijk de
      strafbare gedraging hebben begaan dan wel bij hen gezamenlijk de elementen van die gedraging aanwezig zijn.

      3 Indien een strafvervolging wordt ingesteld tegen een rechtspersoon, een vennootschap, een vereniging van personen
      of een doelvermogen, wordt deze respectievelijk dit tijdens de vervolging vertegenwoordigd door de bestuurder of
      indien er meer bestuurders zijn, door één van hen. De vertegenwoordiger kan bij gemachtigde verschijnen. De rechter
      kan de persoonlijke verschijning van een bepaalde bestuurder bevelen; hij kan alsdan medebrenging gelasten.

      4 Voor wat betreft de bij of krachtens deze wet strafbaar gestelde gedragingen worden rechtspersonen voor de
      toepassing van [artikel 20 van het Wetboek van Strafvordering BES][ref1] geacht te wonen, waar zij gevestigd zijn.

      5 Indien een strafvervolging wordt ingesteld tegen een rechtspersoon, een vennootschap, een vereniging van
      personen of een doelvermogen, geschieden de in het [Wetboek van Strafvordering BES][ref2] voorgeschreven
      betekeningen, dagvaardingen, oproepingen, kennisgevingen of andere mededelingen aan de persoon of de woonplaats
      van de bestuurder en indien er meer bestuurders zijn, aan één van hen of op de plaats waar het bestuur
      zitting of kantoor houdt, behoudens, indien het een dagvaarding betreft, overeenkomstig het bepaalde in
      [artikel 130, tweede en derde lid van het Wetboek van Strafvordering BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028681
