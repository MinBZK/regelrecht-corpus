  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *de minister:* Onze Minister van Verkeer en Waterstaat;

      b. *Verdrag:* het op 27 november 1992 te Londen tot stand gekomen Internationaal verdrag inzake de wettelijke
      aansprakelijkheid voor schade door verontreiniging door olie, 1992 (Trb. 1994, 229);

      c. *schip:* alle zeeschepen en andere zeegaande vaartuigen, van welk type ook, gebouwd of aangepast voor het
      vervoer van olie in bulk als lading, met dien verstande dat een schip dat olie en andere soorten lading kan
      vervoeren alleen als schip wordt beschouwd, wanneer het daadwerkelijk olie in bulk als lading vervoert en tijdens
      iedere reis na een zodanig vervoer, tenzij wordt aangetoond dat het geen residuen van zulk vervoer van olie aan
      boord heeft;

      d. *persoon:* een natuurlijke persoon of een privaatrechtelijke of publiekrechtelijke rechtspersoon;

      e. *eigenaar:* de persoon die in het register waarin het schip is teboekgesteld als eigenaar van het schip is
      ingeschreven of, bij gebreke van enige teboekstelling, de persoon die het schip in eigendom heeft, met dien
      verstande dat de persoon die een schip, dat eigendom is van een staat, exploiteert of reedt en die in die staat als
      exploitant of reder van dat schip is ingeschreven, als eigenaar van het schip wordt beschouwd;

      f. *olie:* alle persistente uit koolwaterstoffen bestaande minerale oliën, zoals ruwe olie, stookolie, zware
      dieselolie en smeerolie, alsmede zonodig bij algemene maatregel van bestuur, nader te omschrijven andere bestendige
      oliën, vervoerd aan boord van een schip als lading of in de bunkers van het schip;

      g. *schade door verontreiniging:*

      1. verlies of schade buiten het schip veroorzaakt door bevuiling ten gevolge van het ontsnappen of doen wegvloeien
      van olie uit het schip, waar zulk ontsnappen of doen wegvloeien ook mag plaatsvinden, met dien verstande dat
      vergoeding voor andere schade aan het milieu dan winstderving ten gevolge van deze schade, wordt beperkt tot de
      kosten van redelijke maatregelen tot herstel die daadwerkelijk worden ondernomen of zullen worden ondernomen,

      2. de kosten van preventieve maatregelen alsmede verlies of schade veroorzaakt door die maatregelen;

      h. *preventieve maatregelen:* na een voorval genomen redelijke maatregelen ter voorkoming of beperking van schade
      door verontreiniging;

      i. *voorval:* elk feit of elke opeenvolging van feiten met dezelfde oorzaak, waardoor schade door verontreiniging
      wordt veroorzaakt, of waardoor een ernstige en onmiddellijke dreiging ontstaat dat zulk een schade zal worden
      veroorzaakt;

      j. *ton:* een gewichtseenheid van 1.000 kilogram.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 Deze wet is van toepassing op schade door verontreiniging veroorzaakt op het grondgebied van de openbare lichamen
      Bonaire, Sint Eustatius en Saba, daaronder begrepen de territoriale zee, en in de exclusieve economische zone
      van Bonaire, Sint Eustatius en Saba of, zolang een zodanige zone niet is ingesteld, binnen het gebied buiten en
      grenzend aan de territoriale zee van de openbare lichamen Bonaire, Sint Eustatius en Saba dat zich niet verder
      uitstrekt dan 200 zeemijl van de basislijnen waarvan de breedte van de territoriale zee wordt gemeten, alsmede op
      preventieve maatregelen, waar ook genomen, ter voorkoming of ter beperking van zodanige schade.

      2 Deze wet is mede van toepassing op aansprakelijkheid wegens voorvallen ten tijde dat het schip, in verband met
      het vervoer, zich bevindt op een laad- of losplaats, in een haven of op een binnenwater in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.

      3 Het bepaalde bij of krachtens deze wet is niet van toepassing op oorlogsschepen of andere schepen in eigendom van
      of geëxploiteerd door een staat ten tijde dat zij uitsluitend worden gebruikt in dienst van de overheid voor andere
      dan handelsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 De eigenaar van het schip op het tijdstip van het voorval of, zo het voorval bestaat uit een opeenvolging van
      feiten, op het tijdstip van het eerste feit, is aansprakelijk voor schade door verontreiniging, veroorzaakt door
      het schip als gevolg van het voorval.

      2 De eigenaar is niet aansprakelijk indien hij bewijst dat de schade:

      a. het gevolg is van een oorlogshandeling, vijandelijkheden, burgeroorlog, opstand of een natuurverschijnsel van
      een uitzonderlijke, onvermijdelijke en onweerstaanbare aard, of

      b. geheel en al werd veroorzaakt door een handelen of nalaten van derden, met het opzet schade te veroorzaken, of

      c. geheel en al werd veroorzaakt door schuldig handelen of nalaten van een regering of andere autoriteit,
      verantwoordelijk voor het onderhouden van lichten of andere hulpmiddelen bij de navigatie, in de uitoefening van
      die taak.

      3 Indien de eigenaar bewijst dat de schade door verontreiniging geheel of gedeeltelijk het gevolg is van een
      handelen of nalaten van de persoon die de schade heeft geleden, met het opzet schade te veroorzaken of van de
      schuld van die persoon, kan de eigenaar geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover
      die persoon.

      4 Voor schade door verontreiniging kan de eigenaar niet uit anderen hoofde worden aangesproken.

      5 Voor schade door verontreiniging kunnen, onverminderd het in het zesde lid bepaalde, noch uit hoofde van deze wet
      noch uit anderen hoofde worden aangesproken:

      a. de ondergeschikten of lasthebbers van de eigenaar of de leden van de bemanning;

      b. de loods of enige andere persoon die, zonder lid van de bemanning te zijn, diensten voor het schip verricht;

      c. een bevrachter – hoe ook omschreven, met inbegrip van de rompbevrachter –, beheerder of degene in wiens handen
      de exploitatie van het schip is gelegd;

      d. personen die met instemming van de eigenaar of in opdracht van een bevoegde overheidsinstantie
      hulpverleningswerkzaamheden verrichten;

      e. personen die preventieve maatregelen nemen;

      f. alle ondergeschikten of lasthebbers van personen genoemd onder b, c, d en e; tenzij de schade het gevolg is van
      hun persoonlijk handelen of nalaten, begaan hetzij met het opzet zodanige schade te veroorzaken, hetzij roekeloos
      en in de wetenschap dat zodanige schade er waarschijnlijk uit zou voortvloeien.

      6 De eigenaar heeft een recht van verhaal op derden die voor de schade uit anderen hoofde, anders dan uit
      overeenkomst, jegens de benadeelden aansprakelijk zijn. Voor zover niet anders is overeengekomen, heeft hij op
      de in het vijfde lid genoemde, van aansprakelijkheid vrijgestelde personen echter geen recht van verhaal, tenzij
      de schade het gevolg is van hun persoonlijk handelen of nalaten, begaan hetzij met het opzet zodanige schade te
      veroorzaken, hetzij roekeloos en in de wetenschap dat zodanige schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Wanneer zich een voorval voordoet waarbij twee of meer schepen zijn betrokken en er ten gevolge daarvan
      schade door verontreiniging is ontstaan, zijn de eigenaren van alle betrokken schepen, tenzij zij ingevolge
      [artikel 3][ref1] van aansprakelijkheid zijn ontheven, hoofdelijk aansprakelijk voor alle schade die
      redelijkerwijs niet te scheiden is. Op de onderlinge verhouding van de eigenaren van de betrokken schepen is
      [artikel 545, derde lid, laatste volzin, van Boek 8 van het Burgerlijk Wetboek BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel545
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel4
