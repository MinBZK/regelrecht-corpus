  - number: '7'
    text: |-
      Indien vóór de verdeling van het fonds de eigenaar, één van zijn ondergeschikten of vertegenwoordigers, een
      verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de eigenaar,
      of enige andere persoon die er belang bij had de schuld van de eigenaar te voldoen, in verband met het voorval
      een vergoeding terzake van schade door verontreiniging heeft betaald, dan subrogeert deze persoon, tot het bedrag
      dat hij heeft betaald, in de rechten die de door hem schadeloos gestelde persoon op grond van deze wet zou hebben
      gehad.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Vorderingen tot vergoeding van schade door verontreiniging kunnen rechtstreeks worden ingesteld tegen de
      verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de eigenaar. In
      dit geval kan de verweerder, zelfs indien de eigenaar overeenkomstig [artikel 5, tweede lid][ref1], niet gerechtigd
      is zijn aansprakelijkheid te beperken, zich beroepen op de in artikel 5 bedoelde beperking van aansprakelijkheid.

      2 De verweerder komen alle verweermiddelen toe die de eigenaar tegen de vorderingen zou hebben kunnen aanvoeren,
      doch hij kan geen beroep doen op de omstandigheid dat de eigenaar surséance van betaling is verleend, of dat
      deze zich in staat van faillissement of vereffening bevindt. Hij kan zich voorts verweren met een beroep op het
      feit, dat de schade door verontreiniging is veroorzaakt door opzettelijk wangedrag van de eigenaar zelf. Andere
      verweermiddelen welke hij zou hebben kunnen aanvoeren tegen een door de eigenaar tegen hem ingestelde vordering
      komen hem niet toe.

      3 De verweerder kan de eigenaar steeds in het geding roepen.

      4 Een verzekeraar of andere persoon die financiële zekerheid heeft gesteld voor de aansprakelijkheid van de
      eigenaar, kan in diens plaats overeenkomstig het bepaalde in [artikel 6][ref2] een fonds vormen, zelfs indien
      ingevolge het bepaalde in [artikel 5, tweede lid][ref3], de eigenaar niet gerechtigd is zijn aansprakelijkheid te
      beperken. De vorming van dit fonds heeft dezelfde rechtsgevolgen als de vorming van een fonds door de eigenaar,
      doch in geval de eigenaar niet gerechtigd is zijn aansprakelijkheid te beperken ingevolge het bepaalde in artikel
      5, tweede lid, blijven de rechten van de schuldeisers, voor zover zij niet uit het fonds bevredigd zijn, tegenover
      de eigenaar onverlet en treden die rechtsgevolgen alleen in ten aanzien van degene die het fonds vormde.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028324#Artikel5
