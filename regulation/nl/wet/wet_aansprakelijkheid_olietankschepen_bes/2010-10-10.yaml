  - number: '17'
    text: |-
      Gelden uit een verzekering of andere financiële zekerheid die ingevolge de [artikelen 14][ref1] en [15][ref2] in
      stand wordt gehouden, zijn uitsluitend beschikbaar voor de voldoening van vorderingen ingevolge deze wet. Voor
      andere vorderingen kan op deze gelden geen beslag worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel15
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '14'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '15'
        hoofdstuk: V
  - number: '18'
    text: |-
      1 De minister geeft aan de eigenaar van een in de openbare lichamen Bonaire, Sint Eustatius en Saba teboekgesteld
      schip op diens verzoek een certificaat af als omschreven in artikel VII, tweede lid, van het Verdrag en in de vorm
      van het model uit de Bijlage van het Verdrag, of waarmerkt als certificaat een door de verstrekker van financiële
      zekerheid in deze vorm ten behoeve van de eigenaar afgegeven document, indien hem is gebleken dat de eigenaar aan
      zijn in [artikel 14][ref1] bedoelde verplichting voldoet.

      2 Bij het verzoek overlegt de eigenaar, bedoeld in het eerste lid, de volgende gegevens en stukken:

      a. de naam en woonplaats van de eigenaar en de plaats waar diens hoofdkantoor is gevestigd;

      b. een uittreksel uit het scheepsregister betreffende het schip waarop het verzoek betrekking heeft;

      c. een afschrift van de overeenkomst tot verstrekking van financiële zekerheid;

      d. de naam en de plaats waar het hoofdkantoor is gevestigd van degene die de financiële zekerheid verstrekt en, zo
      nodig, het kantoor waar deze zekerheid wordt verstrekt;

      e. het tijdstip waarop de financiële zekerheid ingaat en het tijdstip waarop deze een einde neemt.

      3 De eigenaar draagt er zorg voor dat het certificaat, bedoeld in het eerste lid, zich aan boord van het schip
      bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel14
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '14'
        hoofdstuk: V
  - number: '19'
    text: |-
      1 De minister is bevoegd aan de eigenaar van een schip, dat niet in een verdragsluitende staat is teboekgesteld,
      op diens verzoek een certificaat af te geven als omschreven in artikel VII, tweede lid, van het Verdrag en in
      de vorm van het model uit de Bijlage van het Verdrag, of als certificaat een door de verstrekker van financiële
      zekerheid in deze vorm ten behoeve van de eigenaar afgegeven document te waarmerken, indien hem is gebleken dat de
      eigenaar ten tijde dat daarmee waar ter wereld ook meer dan 2.000 ton olie in bulk als lading wordt vervoerd, een
      verzekering of andere financiële zekerheid in stand houdt tot het bedrag, vermeld in [artikel 5, eerste lid][ref1],
      ter dekking van zijn uit deze wet en uit het Verdrag voortvloeiende aansprakelijkheid.

      2 Bij zijn verzoek overlegt de eigenaar, bedoeld in het eerste lid, de in [artikel 18, tweede lid][ref2], bedoelde
      gegevens en stukken. De gegevens en stukken zijn gesteld in de Nederlandse, Engelse of Spaanse taal of bevatten een
      vertaling in één van voornoemde talen.

      3 Onverminderd het bepaalde in [artikel 2, derde lid][ref3], geeft de minister aan een schip dat in eigendom aan
      de Staat toebehoort en in de openbare lichamen Bonaire, Sint Eustatius en Saba is teboekgesteld, een certificaat
      af, houdende de verklaring dat het schip in eigendom toebehoort aan de Staat en dat de aansprakelijkheid voor het
      schip gedekt is binnen de grenzen van deze wet. Dit certificaat wordt zoveel mogelijk opgesteld volgens het model,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028324#Artikel2
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028324
        artikel: '2'
        hoofdstuk: I
  - number: '20'
    text: |-
      1 De minister wijst een verzoek als bedoeld in de [artikelen 18][ref1] en [19][ref2] af, indien de overgelegde
      gegevens of stukken onvoldoende of onjuist zijn, of indien de overeenkomst tot verstrekking van financiële
      zekerheid niet voldoet aan de daaraan bij of krachtens deze wet gestelde eisen.

      2 De beschikking bevat de gronden tot afwijzing en wordt de verzoeker schriftelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel19
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '19'
        hoofdstuk: V
  - number: '21'
    text: |-
      1 De eigenaar aan wie een certificaat is afgegeven, is verplicht om onverwijld aan de minister schriftelijk
      mededeling te doen van het ongeldig worden, de schorsing of de beëindiging van de overeenkomst tot verstrekking van
      financiële zekerheid binnen de tijdsduur waarvoor het certificaat is afgegeven, alsmede van elke wijziging die zich
      gedurende die tijdsduur voordoet in de gegevens welke bij het in [artikel 18][ref1] of [19][ref2] bedoelde verzoek
      zijn overgelegd.

      2 De minister draagt zorg dat een mededeling als bedoeld in het eerste lid ten aanzien van een overeenkomst
      tot verstrekking van financiële zekerheid met betrekking tot een certificaat, afgegeven ingevolge de
      [artikelen 18][ref3] of [19][ref4], wordt doorgegeven aan het kantoor van bewaring der scheepsbewijzen.

      3 De in het eerste lid bedoelde mededeling kan ook worden gedaan door de verstrekker van die financiële zekerheid.
      In dat geval vervalt de verplichting, bedoeld in het eerste lid, voor de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0028324#Artikel19
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '19'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0028324
        artikel: '19'
        hoofdstuk: V
  - number: '22'
    text: |-
      1 De minister kan, na overleg met de Minister van Financiën, een certificaat intrekken indien, door wijziging in de
      gegevens die bij het in [artikel 18][ref1] of [19][ref2] bedoelde verzoek zijn overgelegd of doordat die gegevens
      onvoldoende of onjuist blijken te zijn, de financiële zekerheid niet meer voldoet aan de bij of krachtens deze wet
      gestelde eisen of indien er goede gronden zijn om aan te nemen dat de financiële draagkracht van de verstrekker
      van de financiële zekerheid onvoldoende was of is geworden of, ingeval de verstrekker buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba is gevestigd, indien blijkt van een beletsel voor het werkelijk in de openbare
      lichamen Bonaire, Sint Eustatius en Saba beschikbaar komen van de gelden.

      2 De beschikking bevat de gronden tot de intrekking en wordt de eigenaar schriftelijk medegedeeld. In deze
      mededeling wordt een termijn gesteld voor de inlevering van het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel19
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '19'
        hoofdstuk: V
  - number: '23'
    text: |-
      1 De eigenaar is verplicht om het certificaat zo spoedig mogelijk nadat overeenkomstig
      [artikel 21, eerste lid][ref1], mededeling is gedaan van het ongeldig worden, de schorsing of de beëindiging
      van de overeenkomst tot verstrekking van financiële zekerheid of nadat de tijdsduur waarvoor het is afgegeven is
      verstreken, bij de minister in te leveren.

      2 De eigenaar is verplicht om het certificaat in geval van onherroepelijke intrekking bij de minister in te leveren
      binnen de termijn, bedoeld in [artikel 22, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel22
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '22'
        hoofdstuk: V
  - number: '24'
    text: |-
      1 De minister zendt een afschrift van elk door hem afgegeven certificaat alsmede van elke onherroepelijke
      beschikking tot intrekking van een door hem afgegeven certificaat aan het kantoor van bewaring der scheepsbewijzen.

      2 De Minister van Financiën kan voorschriften vaststellen met betrekking tot bewaring en registratie van de in het
      eerste lid bedoelde afschriften en de in [artikel 21, tweede lid][ref1], bedoelde mededelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel21
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '21'
        hoofdstuk: V
  - number: '25'
    text: |-
      1 Een ieder die door de in [artikel 20, eerste lid][ref1], en [artikel 22, tweede lid][ref2], bedoelde
      beschikkingen rechtstreeks in zijn belang is getroffen, kan daartegen beroep instellen bij het Gerecht in eerste
      aanleg van Bonaire, Sint Eustatius en Saba, zittingsplaats Bonaire.

      2 In geval van beroep vangt de termijn van inlevering, bedoeld in [artikel 22, tweede lid][ref3], aan op de dag
      volgende op die, waarop de eigenaar mededeling heeft ontvangen van de beslissing waarbij het beroep is afgewezen of
      niet-ontvankelijk is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0028324#Artikel22
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '20'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028324
        artikel: '22'
        hoofdstuk: V
  - number: '26'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel26
  - number: '27'
    text: |-
      De kapitein van een in de openbare lichamen Bonaire, Sint Eustatius en Saba teboekgesteld schip waarmee, waar ter
      wereld ook, meer dan 2.000 ton olie in bulk als lading wordt vervoerd, is verplicht een geldig certificaat als
      bedoeld in [artikel 18][ref1] aan boord te hebben en op eerste aanvraag te vertonen of te doen vertonen aan de
      ambtenaren, belast met het toezicht op de naleving van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
  - number: '28'
    text: |-
      De kapitein van een schip waarmee meer dan 2.000 ton olie in bulk als lading wordt vervoerd, is verplicht om bij
      het aanlopen of verlaten van een haven of een laad- of losplaats in de openbare lichamen Bonaire, Sint Eustatius
      en Saba en ten tijde dat het schip, in verband met het vervoer, zich aldaar of op een binnenwater in de openbare
      lichamen Bonaire, Sint Eustatius en Saba bevindt of een zodanig water bevaart, een geldig certificaat als bedoeld
      in [artikel 18][ref1] van deze wet of in artikel VII van het Verdrag aan boord te hebben en op eerste aanvraag
      te vertonen of te doen vertonen aan de ambtenaren, belast met het toezicht op de naleving van het bepaalde bij of
      krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
  - number: '29'
    text: |-
      1 Het is de eigenaar, de reder en de kapitein van een schip waarmee meer dan 2.000 ton olie in bulk als lading
      wordt vervoerd verboden, dit een haven of laad- of losplaats in de openbare lichamen Bonaire, Sint Eustatius en
      Saba te doen aanlopen of verlaten of, in verband met het vervoer, aldaar of op een binnenwater in de openbare
      lichamen Bonaire, Sint Eustatius en Saba te doen verblijven of een zodanig water te doen bevaren, indien met
      betrekking tot dat schip niet een certificaat als bedoeld in [artikel 18][ref1] van deze wet of in artikel VII
      van het Verdrag is afgegeven. Het verbod wordt ten aanzien van uitgaande schepen zonodig met behulp van de sterke
      arm gehandhaafd.

      2 In bijzondere gevallen kan in het belang van de bestrijding van verontreiniging door olie, de veiligheid van de
      scheepvaart of het welzijn van opvarenden van het schip, door of namens de minister ontheffing worden verleend van
      het in het eerste lid bedoelde verbod. Aan de verlening van ontheffing kunnen voorwaarden worden verbonden en aan
      de ontheffing kunnen beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel18
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '18'
        hoofdstuk: V
  - number: '30'
    text: |-
      1 Bij vermoeden van overtreding van [artikel 29][ref1] kan aan de kapitein bevel worden gegeven dat het schip de
      openbare lichamen Bonaire, Sint Eustatius en Saba niet mag verlaten, voordat op een bij het bevel aan te wijzen
      plaats een bij dat bevel bepaalde geldsom is gestort waarop een ter zake van die overtreding op te leggen geldboete
      zal kunnen worden verhaald. Het bevel wordt zonodig met behulp van de sterke arm gehandhaafd.

      2 Het in het eerste lid bedoelde bevel wordt op vordering van de officier van justitie gegeven door de rechter
      voor wie de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord of althans behoorlijk daartoe
      opgeroepen. Het bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.

      3 Van het bevel of de beschikking tot afwijzing van de vordering kan het Openbaar Ministerie binnen drie dagen
      en de verdachte binnen drie dagen na de betekening in beroep komen bij het Gemeenschappelijk Hof van Justitie van
      Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba. Het hof beslist zo spoedig mogelijk.

      4 Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld nadat daarop een bij dat vonnis opgelegde geldboete in mindering is
      gebracht. Tot dat tijdstip en te rekenen vanaf de dag dat de geldsom werd gestort, wordt over die som rente
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel29
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '29'
        hoofdstuk: VIII
  - number: '31'
    text: |-
      1 De minister kan eisen dat de eigenaar van een schip waarmee het verbod van [artikel 29, eerste lid][ref1], is
      overtreden, alsnog een overeenkomst tot verzekering of verstrekking van andere financiële zekerheid sluit ter
      dekking van zijn aansprakelijkheid wegens schade door verontreiniging, tot het in [artikel 5, eerste lid][ref2],
      bedoelde bedrag en voor de duur van de tijd dat het schip beladen met meer dan 2.000 ton olie een binnenwater in de
      openbare lichamen Bonaire, Sint Eustatius en Saba bevaart of, in verband met het vervoer, zich bevindt op een laad-
      of losplaats, in een haven of op een binnenwater in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Indien de eigenaar niet voldoet aan de eis, bedoeld in het eerste lid, dan kan de minister, in overeenstemming
      met de Minister van Financiën, voor de eigenaar een zodanige overeenkomst sluiten. In zodanig geval is het de
      kapitein verboden het schip te doen vertrekken alvorens de kosten van de overeenkomst aan de minister zijn vergoed
      of daarvoor zekerheid is gesteld. Het verbod wordt zonodig met behulp van de sterke arm gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel5
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '29'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028324
        artikel: '5'
        hoofdstuk: II
  - number: '32'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij regeling van de
      minister aangewezen ambtenaren en andere personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 Bij algemene maatregel van bestuur kunnen regels worden gegeven betreffende de taakuitoefening van de krachtens
      het eerste lid aangewezen ambtenaren of andere personen.

      3 De krachtens het eerste lid aangewezen ambtenaren of andere personen zijn, uitsluitend voor zover dat voor de
      vervulling van hun taak redelijkerwijs noodzakelijk is, bevoegd:

      a. van ieder alle inlichtingen te verlangen;

      b. van ieder inzage te verlangen van alle boeken en bescheiden en daarvan afschrift te nemen;

      c. alle plaatsen, met uitzondering van woningen tegen de wil van de bewoner, te betreden, vergezeld van door hen
      aangewezen personen.

      Zo nodig verschaffen zij zich toegang tot een plaats als bedoeld in onderdeel c, alsmede inzage van boeken en
      bescheiden, met behulp van de sterke arm.

      4 Een ieder is verplicht aan krachtens het eerste lid aangewezen ambtenaren of andere personen alle medewerking te
      verlenen die redelijkerwijs voor de uitoefening van hun bevoegdheden noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel32
  - number: '33'
    text: |-
      1 Handelen in strijd met de [artikelen 14][ref1], [15][ref2], [21, eerste lid][ref3], [23][ref4], [26][ref5],
      [27][ref6] of [28][ref7], of overtreding van het in de [artikelen 29, eerste lid][ref8], of [31, tweede lid][ref9],
      gestelde verbod wordt gestraft met een geldboete van ten hoogste USD 56.000,– en met gevangenisstraf van ten
      hoogste één jaar, hetzij met één van deze straffen.

      2 Het niet nakomen van de verplichting, bedoeld in [artikel 31, vierde lid][ref10], wordt gestraft met hechtenis
      van ten hoogste zes maanden en een geldboete van ten hoogste USD 5.600,–, hetzij met één van deze straffen.

      3 De in het eerste en tweede lid strafbaar gestelde gedragingen zijn overtredingen.


