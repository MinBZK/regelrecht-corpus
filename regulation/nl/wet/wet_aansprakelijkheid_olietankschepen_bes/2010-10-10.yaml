  - number: '9'
    text: |-
      Het recht op schadevergoeding uit hoofde van deze wet vervalt, wanneer niet binnen drie jaar na de datum waarop de
      schade is ontstaan een rechtsvordering ter zake is ingesteld, doch in ieder geval nadat zes jaar zijn verstreken na
      de datum van het voorval waaruit de schade is ontstaan. Indien het voorval bestond uit een opeenvolging van feiten
      met dezelfde oorzaak, loopt de termijn van zes jaren na de dag waarop het eerste van die feiten plaatsvond.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Tot de kennisneming in eerste aanleg van vorderingen tot schadevergoeding van schade door verontreiniging uit
      hoofde van het Verdrag en van deze wet is in de openbare lichamen Bonaire, Sint Eustatius en Saba bij uitsluiting
      bevoegd het Gerecht in eerste aanleg van de openbare lichamen Bonaire, Sint Eustatius en Saba, zittingsplaats
      Bonaire.
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 Degene die gebruik wenst te maken van de bevoegdheid tot beperking van zijn aansprakelijkheid, bedoeld in
      [artikel 5, eerste lid][ref1], verzoekt het gerecht het bedrag waartoe zijn aansprakelijkheid is beperkt vast te
      stellen en te bevelen, dat tot een procedure ter verdeling van dit bedrag wordt overgegaan.

      2 Op het verzoek en de procedure ter verdeling zijn de [artikelen 642a, tweede tot en met vierde lid][ref2],
      [642b tot en met 642d][ref3], [642e, eerste lid][ref4], [642f tot en met 642t, eerste lid][ref5], en
      [642u tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering BES][ref6] van overeenkomstige toepassing,
      met dien verstande dat in het geval van artikel 642e, eerste lid, de rechter de opheffing van de gelegde
      conservatoire beslagen dan wel teruggave van reeds gegeven zekerheid moet bevelen. Het fonds wordt verdeeld
      onder de schuldeisers in evenredigheid met de bedragen van hun erkende vorderingen. Indien het bedrag van alle
      vorderingen het door het gerecht vastgestelde bedrag overtreft, worden de vorderingen naar evenredigheid gekort.

      3 De vorderingen van de eigenaar ter zake van door hem vrijwillig en binnen de grenzen der redelijkheid gedane
      uitgaven en gebrachte offers ter voorkoming of beperking van schade door verontreiniging, staan in rang gelijk met
      andere vorderingen op het fonds.

      4 De in [artikel 5][ref7] bedoelde rekeneenheid wordt omgerekend in de munteenheid van Bonaire, Sint
      Eustatius en Saba volgens de waarderingsmethode die door het Internationale Monetaire Fonds wordt toegepast
      voor zijn eigen verrichtingen en transacties op de dag, waarop de eigenaar voldoet aan een ingevolge het
      [artikel 642c van het Wetboek van Burgerlijke Rechtsvordering BES][ref8] gegeven bevel tot storting of tot
      zekerheidstelling, en volgens de op die dag geldende koers.


