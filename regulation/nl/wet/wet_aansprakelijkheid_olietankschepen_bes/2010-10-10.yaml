  - number: '13'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], kan de eigenaar zich overeenkomstig
      het bepaalde in, [titel 7 van Boek 8 van het Burgerlijk Wetboek BES][ref2] en de
      [artikelen 642a tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering BES][ref3] beroepen op beperking
      van aansprakelijkheid uit anderen hoofde voor vorderingen terzake van schade door verontreiniging, toegebracht
      buiten het grondgebied van de openbare lichamen Bonaire, Sint Eustatius en Saba, daaronder begrepen de territoriale
      zee, buiten de exclusieve economische zone van Bonaire, Sint Eustatius en Saba of, zolang een zodanige zone niet
      is ingesteld, buiten het gebied buiten en grenzend aan de territoriale zee van de openbare lichamen Bonaire, Sint
      Eustatius en Saba dat zich niet verder uitstrekt dan 200 zeemijl van de basislijnen waarvan de breedte van de
      territoriale zee wordt gemeten, en buiten het gebied van een bij het Verdrag partij zijnde staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028753
      [ref3]: https://wetten.overheid.nl/BWBR0028496#Artikel642a
