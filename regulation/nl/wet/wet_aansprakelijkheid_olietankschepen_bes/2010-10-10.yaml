  - number: '5'
    text: |-
      1 De eigenaar van een schip kan zijn aansprakelijkheid uit hoofde van deze wet per voorval beperken tot een totaal
      bedrag dat als volgt wordt berekend:

      a. voor een schip met een brutotonnage van niet meer dan 5.000, drie miljoen rekeneenheden;

      b. voor een schip met een grotere brutotonnage dan in onderdeel a genoemd, voor elke toename van de brutotonnage
      met één, 420 rekeneenheden boven het onder a genoemde bedrag;

      met dien verstande dat dit bedrag 59,7 miljoen rekeneenheden niet te boven gaat.

      2 De eigenaar kan zijn aansprakelijkheid niet overeenkomstig het voorgaande lid beperken, indien de schade door
      verontreiniging het gevolg is van zijn persoonlijk handelen of nalaten, begaan hetzij met het opzet zodanige schade
      te veroorzaken, hetzij roekeloos en in de wetenschap dat zodanige schade er waarschijnlijk uit zou voortvloeien.

      3 De in het eerste lid genoemde rekeneenheid is het bijzondere trekkingsrecht, zoals dit is omschreven door het
      Internationale Monetaire Fonds.

      4 De brutotonnage van het schip wordt berekend overeenkomstig de voorschriften voor de meting, vervat in Bijlage I
      van het Internationaal Verdrag betreffende de meting van schepen, 1969 (P.B. 1981, no. 159).
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Teneinde zich te kunnen beroepen op de in [artikel 5][ref1] bedoelde beperking van aansprakelijkheid vormt de
      eigenaar een fonds bij het in [artikel 10][ref2] bedoelde gerecht, tot een bedrag gelijk aan het maximum van zijn
      aansprakelijkheid. Het fonds wordt gevormd door het storten van een geldsom of het stellen van een door het gerecht
      goed te keuren bankgarantie of andere financiële zekerheid.

      2 Heeft de eigenaar een fonds gevormd en is hij gerechtigd zijn aansprakelijkheid te beperken, dan is ter zake van
      vorderingen tot vergoeding van schade door verontreiniging gegrond op dat voorval, geen verhaal meer mogelijk op
      andere goederen van de eigenaar, indien het fonds werkelijk beschikbaar is tot voldoening van die vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel10
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel6
