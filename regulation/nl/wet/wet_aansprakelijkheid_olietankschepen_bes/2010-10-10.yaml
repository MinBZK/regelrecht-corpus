  - number: '12'
    text: |-
      1 Is als gevolg van eenzelfde voorval schade door verontreiniging, behalve op het grondgebied van de openbare
      lichamen Bonaire, Sint Eustatius en Saba, daaronder begrepen de territoriale zee, in de exclusieve economische
      zone van Bonaire, Sint Eustatius en Saba of, zolang een zodanige zone niet is ingesteld, binnen het gebied buiten
      en grenzend aan de territoriale zee van de openbare lichamen Bonaire, Sint Eustatius en Saba dat zich niet verder
      uitstrekt dan 200 zeemijl van de basislijnen waarvan de breedte van de territoriale zee wordt gemeten, ook ontstaan
      in één of meer andere bij het Verdrag partij zijnde staten, dan heeft de vorming van een fonds in die staat of in
      één van die staten overeenkomstig artikel V van het Verdrag, in de openbare lichamen Bonaire, Sint Eustatius en
      Saba dezelfde rechtsgevolgen als de vorming van een fonds in de openbare lichamen Bonaire, Sint Eustatius en Saba,
      indien de schuldeiser toegang heeft tot het gerecht dat het fonds beheert en het fonds werkelijk beschikbaar is tot
      voldoening van zijn vordering.

      2 Is in het geval, bedoeld in het eerste lid, het fonds in de openbare lichamen Bonaire, Sint Eustatius en Saba
      gevormd, dan is in eerste aanleg uitsluitend het in [artikel 10][ref1] bedoelde gerecht bevoegd tot de kennisneming
      van verzoeken als bedoeld in artikel 306 van het [Wetboek van Burgerlijke Rechtsvordering BES][ref2], ten
      aanzien van rechterlijke beslissingen uit een andere bij het Verdrag partij zijnde staat, waarbij vorderingen tot
      vergoeding van schade door verontreiniging zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028496
