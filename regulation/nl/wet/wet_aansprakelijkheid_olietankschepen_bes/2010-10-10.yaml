  - number: '14'
    text: |-
      De eigenaar van een in de openbare lichamen Bonaire, Sint Eustatius en Saba teboekgesteld schip dat meer dan
      2.000 ton olie in bulk als lading vervoert, is verplicht een verzekering of andere financiële zekerheid in stand
      te houden ter dekking van zijn uit deze wet en uit het Verdrag voortvloeiende aansprakelijkheid tot het bedrag,
      vermeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel5
