  - number: '15'
    text: |-
      De eigenaar van een schip dat is teboekgesteld buiten de openbare lichamen Bonaire, Sint Eustatius en Saba of een
      andere dan de vlag van het Koninkrijk der Nederlanden voert, is verplicht om, ten tijde dat dit schip meer dan
      2.000 ton olie in bulk als lading vervoert en een haven of laad- of losplaats in de openbare lichamen Bonaire, Sint
      Eustatius en Saba aanloopt of verlaat, of een binnenwater in de openbare lichamen Bonaire, Sint Eustatius en Saba
      bevaart, een verzekering of andere financiële zekerheid in stand te houden ter dekking van zijn uit deze wet en uit
      het Verdrag voortvloeiende aansprakelijkheid, tot het bedrag, vermeld in [artikel 5, eerste lid][ref1], van deze
      wet en in artikel V, eerste lid, van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel5
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028324
        artikel: '5'
        hoofdstuk: II
  - number: '16'
    text: |-
      De overeenkomst tot verstrekking van financiële zekerheid ten aanzien van een schip dat is teboekgesteld in
      een staat die niet bij het Verdrag partij is of dat de vlag voert van zulk een staat, voldoet aan de volgende
      vereisten:

      a. de overeenkomst is aangegaan met een verzekeraar, een bank of andere financiële instelling of een andere
      persoon, van wie de minister, na overleg met de Minister van Financiën, de financiële draagkracht tot het geven van
      dekking voor de uit deze wet en het Verdrag voortvloeiende aansprakelijkheid voldoende oordeelt;

      b. de gelden uit de overeenkomst kunnen, indien de verstrekker van financiële zekerheid buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba is gevestigd, werkelijk in de openbare lichamen Bonaire, Sint Eustatius en Saba ter
      beschikking komen;

      c. uit de overeenkomst blijkt dat de benadeelde, in overeenstemming met [artikel 8][ref1] van deze wet en met
      artikel VII, achtste lid, van het Verdrag, zijn vordering rechtstreeks tegen de verstrekker van financiële
      zekerheid kan instellen, met dien verstande dat indien de overeenkomst een beding inhoudt dat de eigenaar zelf
      voor een deel zal bijdragen in de vergoeding van de schade door verontreiniging, uit de overeenkomst blijkt dat
      de verstrekker van financiële zekerheid niettemin jegens de benadeelde ter zake van schade door verontreiniging
      gehouden blijft tot betaling ook van dat deel van de schadevergoeding;

      d. uit de overeenkomst blijkt dat de verstrekker van financiële zekerheid deze binnen de tijdsduur waarvoor
      het certificaat van de [artikelen 18][ref2] of [19][ref3] is afgegeven, niet eerder kan schorsen of beëindigen
      of zodanig wijzigen dat hij niet meer aan dit artikel voldoet, dan na verloop van drie maanden na de datum van
      ontvangst van een mededeling als bedoeld in [artikel 21, eerste lid][ref4]; tenzij het certificaat is ingeleverd of
      een nieuw is afgegeven vóór het verstrijken van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028324#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028324#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028324#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0028324#Artikel21
    url: https://wetten.overheid.nl/BWBR0028324/2010-10-10#Artikel16
    references:
      - id: ref1
