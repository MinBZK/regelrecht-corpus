$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kostenwet_invordering_rijksbelastingen
regulatory_layer: WET
publication_date: '2025-12-24'
valid_from: '2004-01-01'
bwb_id: BWBR0002645
url: https://wetten.overheid.nl/BWBR0002645/2004-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het tarief van de kosten van vervolging inzake
    rijksbelastingen te herzien en een voorziening te treffen om de betekening van dwangbevelen inzake rijksbelastingen
    te vereenvoudigen, alsmede in enkele andere wetten daarmede samenhangende wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ter zake van het verrichten van werkzaamheden voor de invordering van bedragen door de zorg van een inzake
      rijksbelastingen bevoegde ontvanger en door een belastingdeurwaarder op grond van de bepalingen van de
      [Invorderingswet 1990][ref1] of enige andere wettelijke bepaling worden aan degene die in gebreke is gebleven het
      verschuldigde tijdig te betalen, kosten in rekening gebracht volgens het bepaalde in de volgende artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: '2'
    text: |-
      Voor het verzenden van een aanmaning tot betaling is verschuldigd € 4 bij een gevorderde som tot € 454 en € 9 bij
      een gevorderde som van € 454 of meer.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor het betekenen van een dwangbevel met bevel tot betaling is verschuldigd € 23 verhoogd met € 2 van elk geheel
      bedrag van € 45 waarmee de gevorderde som € 45 te boven gaat, met dien verstande dat niet meer verschuldigd is dan
      € 6807.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel3
  - number: '3.2'
    text: Voor het ingevolge een wettelijk voorschrift doen van een ander exploot is verschuldigd € 9.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor het geven van kwitantie door de ambtenaar belast met de tenuitvoerlegging van een dwangbevel ter zake van een
      aan deze gedane betaling ter afwering van lijfsdwang of van beslaglegging, niet zijnde een beslag onder derden, op
      goederen die geen registergoederen zijn, is verschuldigd € 9.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      Voor het ingevolge een wettelijk voorschrift voor 'gezien' doen tekenen van een exploot of ander stuk, aanplakken
      van een exploot en doen aankondigen van een gedaan exploot in een dagblad is, voor elk dezer handelingen,
      verschuldigd € 2.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor het in beslag nemen van een goed en het deswege opmaken van proces-verbaal is verschuldigd € 32. Voor de
      verkoop van een goed en het deswege opmaken van proces-verbaal is verschuldigd € 41. Duren de verrichtingen ter
      plaatse langer dan vier uren, dan worden de genoemde bedragen verhoogd met € 9 voor elk volgend uur of gedeelte
      daarvan. Voor het bekendmaken van de verkoop door het aanslaan van de verkoopbiljetten, al dan niet gevolgd door
      het doen aankondigen van de verkoop in een dagblad is verschuldigd € 16.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel4
  - number: '4.2'
    text: Voor het ingevolge een wettelijk voorschrift opmaken van een ander proces-verbaal is verschuldigd € 9.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel4
  - number: '4.3'
    text: Voor iedere getuige is verschuldigd € 3 per uur of gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel4
  - number: '6'
    text: |-
      Behalve de in de voorgaande artikelen genoemde bedragen worden in rekening gebracht de bedragen toekomende aan
      derden voor de door hen rechtstreeks ten behoeve van de tenuitvoerlegging van het dwangbevel verrichte handelingen.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      Tegen de door de ontvanger of de belastingdeurwaarder in rekening gebrachte kosten van vervolging welke niet
      voortspruiten uit de gerechtelijke tenuitvoerlegging van het dwangbevel kan degene van wie die kosten worden
      gevorderd een bezwaarschrift, onderscheidenlijk een beroepschrift indienen bij de ontvanger. Met betrekking tot
      bezwaar tegen de in de eerste volzin bedoelde beschikking, met betrekking tot beroep ter zake van een uitspraak
      op het desbetreffende bezwaar, alsmede met betrekking tot beroep in cassatie ter zake van de desbetreffende
      rechterlijke uitspraak, gelden dezelfde regels als die welke van toepassing zijn op bezwaar, beroep of beroep in
      cassatie als bedoeld in [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '7.2'
    text: |-
      Het bezwaar- of beroepschrift kan niet zijn gegrond op de stelling dat het aanslagbiljet, de aanmaning of het op de
      voet van artikel 13, derde lid, van de Invorderingswet 1990 betekende dwangbevel niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel7
  - number: '11.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel11
  - number: '11.2'
    text: 'Deze wet kan worden aangehaald als: Kostenwet invordering rijksbelastingen.'
    url: https://wetten.overheid.nl/BWBR0002645/2004-01-01#Artikel11
