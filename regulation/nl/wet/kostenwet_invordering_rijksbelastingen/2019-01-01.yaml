        bwb_id: BWBR0029244
        artikel: '8'
  - number: '2'
    text: |-
      Voor het verzenden van een aanmaning tot betaling is verschuldigd € 7 bij een gevorderde som tot € 454 en € 16 bij
      een gevorderde som van € 454 of meer.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor het betekenen van een dwangbevel met bevel tot betaling is verschuldigd € 42 verhoogd met € 4 van elk geheel
      bedrag van € 45 waarmee de gevorderde som € 45 te boven gaat, met dien verstande dat niet meer verschuldigd is dan
      € 12.356.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel3
  - number: '3.2'
    text: Voor het ingevolge een wettelijk voorschrift doen van een ander exploot is verschuldigd € 16.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor het geven van kwitantie door de ambtenaar belast met de tenuitvoerlegging van een dwangbevel ter zake van een
      aan deze gedane betaling ter afwering van lijfsdwang of van beslaglegging, niet zijnde een beslag onder derden, op
      goederen die geen registergoederen zijn, is verschuldigd € 16.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel3
  - number: '3.4'
    text: |-
      Voor het ingevolge een wettelijk voorschrift voor 'gezien' doen tekenen van een exploot of ander stuk, aanplakken
      van een exploot en doen aankondigen van een gedaan exploot in een dagblad is, voor elk dezer handelingen,
      verschuldigd € 4.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor het in beslag nemen van een goed en het deswege opmaken van proces-verbaal is verschuldigd € 58. Voor de
      verkoop van een goed en het deswege opmaken van proces-verbaal is verschuldigd € 74. Duren de verrichtingen ter
      plaatse langer dan vier uren, dan worden de genoemde bedragen verhoogd met € 16 voor elk volgend uur of gedeelte
      daarvan. Voor het bekendmaken van de verkoop door het aanslaan van de verkoopbiljetten, al dan niet gevolgd door
      het doen aankondigen van de verkoop in een dagblad is verschuldigd € 29.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel4
  - number: '4.2'
    text: Voor het ingevolge een wettelijk voorschrift opmaken van een ander proces-verbaal is verschuldigd € 16.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel4
  - number: '4.3'
    text: Voor iedere getuige is verschuldigd € 5 per uur of gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel4
  - number: '6'
    text: |-
      Behalve de in de voorgaande artikelen genoemde bedragen worden in rekening gebracht de bedragen toekomende aan
      derden voor de door hen rechtstreeks ten behoeve van de tenuitvoerlegging van het dwangbevel verrichte handelingen.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel6
  - number: '7.1'
    text: |-
      Tegen de door de ontvanger of de belastingdeurwaarder in rekening gebrachte kosten van vervolging welke
      niet voortspruiten uit de gerechtelijke tenuitvoerlegging van het dwangbevel kan degene van wie die kosten
      worden gevorderd een bezwaarschrift, onderscheidenlijk een beroepschrift indienen bij de ontvanger. Op het
      bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in de eerste volzin bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '7.2'
    text: |-
      Het bezwaar- of beroepschrift kan niet zijn gegrond op de stelling dat het aanslagbiljet, de aanmaning, het op
      de voet van [artikel 13, derde lid, van de Invorderingswet 1990][ref1] betekende dwangbevel of de schriftelijke
      mededeling, genoemd in [artikel 27, eerste lid, van de Invorderingswet 1990][ref2] niet is ontvangen, tenzij degene
      van wie de kosten worden gevorderd aannemelijk maakt dat ontvangst redelijkerwijs moet worden betwijfeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel27
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '27'
  - number: '8.1'
    text: |-
      Bij het begin van het kalenderjaar worden het eerste en het derde bedrag, genoemd in [artikel 2][ref1], het
      eerste, het tweede en het vijfde bedrag, genoemd in [artikel 3, eerste lid][ref2], de bedragen, genoemd in
      [artikel 3, tweede tot en met vierde lid][ref3], en de bedragen, genoemd in [artikel 4][ref4], bij ministeriële
      regeling vervangen door andere. Deze bedragen worden berekend door de te vervangen bedragen te vermenigvuldigen
      met de correctiefactor en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande jaar een
      dergelijke afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002645#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002645#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002645#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002645#Artikel4
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002645
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002645
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002645
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002645
        artikel: '4'
  - number: '8.2'
    text: |-
      De correctiefactor is de verhouding van het gemiddelde van de indexcijfers van de achttiende tot en met de zevende
      aan het kalenderjaar voorafgaande maand, tot het gemiddelde van de indexcijfers van de dertigste tot en met de
      negentiende aan het kalenderjaar voorafgaande maand.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel8
  - number: '8.3'
    text: |-
      De indexcijfers zijn de cijfers uit de «CAO-lonen per uur inclusief bijzondere beloning, CAO-sector Overheid» van
      het Centraal Bureau voor de Statistiek. De gemiddelde indexcijfers worden berekend uit de indexcijfers vermeld in
      het nummer van het Statistisch bulletin, waarin het indexcijfer van de zevende respectievelijk negentiende aan het
      kalenderjaar voorafgaande maand voor het eerst, al dan niet voorlopig, wordt gepubliceerd. Indien in het nummer van
      het Statistisch bulletin, waarin het indexcijfer van de zevende respectievelijk negentiende aan het kalenderjaar
      voorafgaande maand voor het eerst, al dan niet voorlopig, zou moeten zijn gepubliceerd, dit indexcijfer niet is
      gepubliceerd, wordt voor dit en elk daaraan voorafgaand ontbrekend indexcijfer uitgegaan van het laatst bekende
      indexcijfer dat in dat nummer van het Statistisch bulletin is vermeld. Indien voor 1 december van het kalenderjaar
      voorafgaand aan de vervanging, bedoeld in het eerste lid, alsnog een ontbrekend indexcijfer als bedoeld in de derde
      volzin wordt gepubliceerd, wordt in afwijking van het bepaalde in die volzin uitgegaan van het alsdan voor het
      eerst, al dan niet voorlopig, gepubliceerde indexcijfer.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de basis voor de indexcijfers wijzigt, wordt bij ministeriële regeling aangegeven op welke wijze wordt
      overgegaan op de nieuwe reeks indexcijfers.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel8
  - number: '11.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel11
  - number: '11.2'
    text: 'Deze wet kan worden aangehaald als: Kostenwet invordering rijksbelastingen.'
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel11
