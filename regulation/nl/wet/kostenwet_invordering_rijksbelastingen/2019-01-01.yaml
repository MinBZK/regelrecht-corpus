preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het tarief van de kosten van vervolging inzake
    rijksbelastingen te herzien en een voorziening te treffen om de betekening van dwangbevelen inzake rijksbelastingen
    te vereenvoudigen, alsmede in enkele andere wetten daarmede samenhangende wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In afwijking van de[ afdelingen 4.4.4][ref1] en [4.4.5 van de Algemene wet bestuursrecht][ref2] worden ter zake
      van het verrichten van werkzaamheden voor de invordering van bedragen door de zorg van een inzake rijksbelastingen
      bevoegde ontvanger en door een belastingdeurwaarder op grond van de bepalingen van de [Invorderingswet 1990][ref3]
      of enige andere wettelijke bepaling aan degene die in gebreke is gebleven het verschuldigde tijdig te betalen,
      kosten in rekening gebracht volgens het bepaalde in de volgende artikelen, tenzij ter zake kosten verschuldigd zijn
      op grond van [artikel 8.39 van de Belastingwet BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.5
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0002645/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.4
