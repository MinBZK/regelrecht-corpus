    text: |-
      1

      2 Hij wijst in overeenstemming met Onze Minister wie het mede aangaat ondernemingen en openbare nutsbedrijven aan,
      ter bescherming waarvan hij bevelen kan geven op de voet van [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel7
    url: https://wetten.overheid.nl/BWBR0002096/1986-07-01#Artikel4
