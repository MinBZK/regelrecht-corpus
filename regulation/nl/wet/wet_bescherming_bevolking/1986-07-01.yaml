        artikel: '7'
  - number: '7'
    text: |-
      1 Onze Minister van Binnenlandse Zaken kan in het belang van de bescherming van bedrijven, aangewezen op de voet
      van [artikel 4, tweede lid][ref1], bevelen geven aan ondernemingen en openbare nutsbedrijven.

      2 Een bevel, als bedoeld in het vorige lid, wordt niet gegeven dan in overeenstemming met Onze Minister wie het
      mede aangaat en na overleg met de door Onze Minister van Binnenlandse Zaken aan te wijzen centrale organisaties van
      ondernemers dan wel, indien het overheidsbedrijven betreft, met de besturen dier bedrijven, tenzij zulks in verband
      met de vereiste spoed niet kan geschieden. In dit laatste geval wordt van het bevel onverwijld mededeling gedaan
      aan Onze Minister wie het mede aangaat en aan de aangewezen organisaties of besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel4
    url: https://wetten.overheid.nl/BWBR0002096/1986-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002096
        artikel: '4'
  - number: '29'
    text: |-
      1 Overtreding van hetgeen krachtens artikel 5 of 7 door Ons of Onze Minister van Binnenlandse Zaken, dan wel
      krachtens artikel 13 door de burgemeester of - bij toepassing van artikel 14 - door het kringbestuur is bepaald,
      wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van ten hoogste vijfduizend gulden.

      2 Indien het feit is gepleegd in de tijd, waarin de bescherming van de bevolking geheel of ten dele in staat van
      paraatheid is, worden de in het vorige lid gestelde maxima verdubbeld.

      3 Dit feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002096/1986-07-01#Artikel29
