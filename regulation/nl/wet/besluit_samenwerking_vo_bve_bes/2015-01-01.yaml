articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *WVO BES:* [Wet voortgezet onderwijs BES][ref1];

      b. *WEB BES:* [Wet educatie en beroepsonderwijs BES][ref2];

      c. *VAVO:* voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de WEB BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0028395
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7.3.1
