        artikel: 7.3.1
  - number: '5'
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 112 van de WVO BES][ref1] aangewezen school kan leerlingen van 16
      en 17 jaar die naar het oordeel van het bevoegd gezag een grotere kans hebben een diploma of volgend diploma als
      bedoeld in [artikel 72, derde lid, van de WVO BES][ref2] te behalen indien zij VAVO volgen in plaats van voortgezet
      onderwijs, in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven,
      deel te nemen aan een opleiding VAVO aan een instelling waarvoor wat betreft genoemde opleiding toepassing is
      gegeven aan [artikel 1.4.2 van de WEB BES][ref3], en die opleiding met een examen af te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel1.4.2
