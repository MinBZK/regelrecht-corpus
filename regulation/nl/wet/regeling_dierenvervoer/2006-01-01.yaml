$id: regeling_dierenvervoer
regulatory_layer: WET
publication_date: '2006-12-15'
valid_from: '2006-01-01'
bwb_id: BWBR0007482
url: https://wetten.overheid.nl/BWBR0007482/2006-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat;

    Gelet op artikel 94, eerste lid, onderdeel g, van de Gezondheids- en welzijnswet voor dieren en artikel 1,
    onderdeel f, onder 4°, artikel 4, derde lid, onderdeel b, artikel 7, vijfde lid, artikel 9, tweede lid, en artikel
    18, derde lid, van het Besluit dierenvervoer 1994;

    Gezien de adviezen van de Raad voor dierenaangelegenheden (21 december 1994, RDA/94479/HJ), het Produktschap Vee
    en Vlees tezamen met het Produktschap Pluimvee en Eieren (23 december 1994, fv/jz nr.034350), het Bedrijfschap
    voor de Handel in Vee (9 november 1994, 9084/ma), het Bedrijfschap Pluimveehandel en -industrie (22 december 1994,
    94SAP573), de Nederlandse Vereniging tot Bescherming van Dieren (2 januari 1995, U95.00002/PV/eb), de Stichting
    Lekker Dier (11 november 1994), Rechten voor al wat leeft (20 december 1994), ATAN (2 december 1994, K/NA/ATAN-
    320), FOCWA tezamen met SAVEETRA (11 januari 1995, SAV010.95/sch);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *besluit:*


              [Besluit dierenvervoer 1994][ref1];



            b
            VWA:

              Voedsel en Waren Autoriteit;



            c

              *groot vee:*


              éénhoevige dieren met een schofthoogte van meer dan 80 cm;
      kalveren met een kruishoogte van meer dan 110 cm, en
      runderen niet zijnde kalveren, met een kruishoogte van meer dan 80 cm;



            d

              *klein vee:*


              éénhoevigen, runderen en kalveren, voorzover niet zijnde groot vee, alsmede schapen en geiten;



            e

              *slachtvarkens:*


              varkens met een schofthoogte van meer dan 45 cm, die zijn gemest en worden vervoerd om te worden geslacht;



            f

              *fok- en gebruiksvarkens:*


              varkens niet zijnde slachtvarkens met een schofthoogte van meer dan 45 cm;



            g

              *biggen:*


              varkens met een schofthoogte van ten hoogste 45 cm;



            h

              *eendagskuikens:*


              pluimvee dat bij het inladen een ouderdom heeft van ten hoogste 36 uur;



            i

              *voertuig:*


              een motorrijtuig, bestemd voor vervoer over de weg met inbegrip van aanhangwagen(s), oplegger(s) en
      container(s);



            j

              *vliegtuiglaadeenheid:*


              afgesloten transporteerbare ruimte met een bodemoppervlakte van ten hoogste 15 m2per laadvloer, bestemd
      voor het vervoer van dieren;



            k

              *transportuitrusting:*


              hekken, schotten, vliegtuiglaadeenheden, laadbruggen en andere niet aan een luchtvaartuig verbonden
      uitrusting.


      [ref1]: https://wetten.overheid.nl/BWBR0006990
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006990
  - number: '2'
    text: |-
      De periode rust, bedoeld in [artikel 1, onderdeel f, onder 4°][ref1], van het besluit bedraagt voor alle soorten
      en categorieën van dieren één uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel1
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '1'
  - number: '3'
    text: |-
      Van het in individuele hokken vervoeren en van het niet samen vervoeren van eenhoevige dieren, alsmede van het
      gescheiden houden van dieren, bedoeld in punt 2, onder e en g, en punt 10, onderscheidenlijk punt 3, onder a, van
      de bijlage bij [richtlijn 91/628/EEG](31991L0628) is sprake, indien de dieren van elkaar worden gescheiden door
      een tussenschot of hek van voldoende hoogte en sterkte. Paarden mogen ook gescheiden worden door een laadboom van
      voldoende sterkte.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Niet als goederen die nadelig kunnen zijn voor het welzijn van dieren, bedoeld in punt 3, onder b, van
      de bijlage bij [richtlijn 91/628/EEG](31991L0628) worden beschouwd gevaarlijke stoffen als bedoeld in de
      [Regeling vervoer gevaarlijke stoffen door de lucht 1988][ref1] voorzover die stoffen zijn verpakt volgens de
      bepalingen neergelegd in de ’Technische Voorschriften’, behorende bij voornoemde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009493
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009493
  - number: '5'
    text: |-
      Als instrumenten voor het zo nodig doden van dieren, bedoeld in punt 23 en punt 29, van de bijlage bij [richtlijn
      91/628/EEG](31991L0628) worden goedgekeurd:
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel5
  - number: 5.a
    text: het schietmasker, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel5
  - number: 5.b
    text: centraal depressieve middelen.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel5
  - number: '6'
    text: |-
      Een aanvraag voor inschrijving in het register, bedoeld in [artikel 18, eerste lid, onderdeel b][ref1], van het
      besluit wordt op een daartoe bestemd formulier gezonden aan de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel18
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '18'
  - number: '7'
    text: |-
      Binnen vier weken na ontvangst van het volledig en naar waarheid ingevulde formulier wordt aan de aanvrager door de
      Minister een bewijs van inschrijving in het register volgens het in [bijlage A][ref1] opgenomen model verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007482
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007482
  - number: '8'
    text: |-
      De geldigheid van de registratie vervalt 5 jaar na de afgifte van het in [artikel 7][ref1] bedoelde bewijsstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel7
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '7'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Het model van het in [artikel 9, eerste lid, van het besluit][ref1] bedoelde bewijsstuk is het model opgenomen in
      de bij deze regeling behorende [bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007482
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007482
  - number: '9.2'
    text: |-
      Het in het eerste lid bedoelde bewijsstuk wordt door de Minister afgegeven na een keuring van het voertuig en is
      slechts geldig indien en voor zolang op het voertuig een daarbij behorende, door de Minister beschikbaar gestelde
      dierenvervoerplaat, waarop de in het bewijsstuk vermelde gegevens in code zijn vermeld, is bevestigd overeenkomstig
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel9
  - number: '9.3'
    text: |-
      De dierenvervoerplaat wordt aan de buitenzijde van de voertuigen welke voor het vervoeren van vee zijn goedgekeurd
      goed zichtbaar aangebracht vooraan aan de -gezien in de rijrichting- linkerzijkant van de wagenbak waarin het vee
      wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel9
  - number: '9.4'
    text: |-
      Onverminderd het bepaalde in het tweede lid vervalt de geldigheid van het bewijsstuk 5 jaar na de afgifte daarvan
      dan wel binnen die termijn zodra wordt vastgesteld, dat het voertuig niet meer voldoet aan de in het besluit en in
      [§ 2][ref1] van deze afdeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007482
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '9.5'
    text: |-
      Indien is vastgesteld dat het voertuig niet meer aan de gestelde eisen voldoet, wordt het bewijsstuk alsmede de in
      het tweede lid bedoelde dierenvervoerplaat op eerste vordering van de Minister, bij deze onverwijld ingeleverd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      De laadvloer van voertuigen, bestemd voor het vervoer van vee, bestaat uit: hardhout met een dikte van ten minste
      30 mm, zachthout met een dikte van ten minste 50 mm, hechthout met een dikte van ten minste 24 mm, lichtmetaal met
      een dikte van ten minste 20 mm en met een trekvastheid van ten minste 29 kg per mm
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      De wanden van het voertuig sluiten aan op de laadvloer en bestaan uit hout, hout bekleed met lichtmetaal,
      lichtmetaal of uit ander gelijkwaardig materiaal. Lichtmetalen wanden zijn dubbel met een tussenruimte van ten
      minste 20 mm terwijl de binnenwand, indien met het voertuig grootvee wordt vervoerd, tot 1 meter boven de laadvloer
      ten minste 2 mm dik is. De wanden zijn behoudens het hierna bepaalde dicht.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: 10.3.a
    text: |-
      De zijwanden, de voorwand of het dak van voertuigen, bestemd voor het vervoer van vee, zijn voorzien van
      afsluitbare ventilatie-openingen, welke een gezamenlijke oppervlakte per laadruimte hebben van ten minste 20 % van
      de oppervlakte van de laadvloer.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: 10.3.b
    text: |-
      In afwijking van het bepaalde onder a, zijn - voertuigen, bestemd voor het vervoer van biggen, welke voertuigen de
      onder a bedoelde 20 % niet bereiken per laadvloer voorzien van afsluitbare ventilatie-openingen met een hoogte van
      ten minste 20 cm over de gehele lengte van de zijwanden en, zo mogelijk, over de gehele breedte van de voorwand;
        - de zijwanden, de voorwand of het dak van voertuigen, bestemd voor het vervoer van paarden, voorzien van
      afsluitbare ventilatie-openingen met een oppervlakte van ten minste 400 cm² per paard, met dien verstande, dat
      wanneer het middenasaanhangwagens als bedoeld in [artikel 1.1, onderdeel al, van het Voertuigreglement][ref1]
      betreft, volstaan kan worden met afsluitbare ventilatie-openingen in de zijwanden, de voorwand of het dak, welke
      ten minste 400 cm² groot zijn;
        - de zijwanden, de voorwand of het dak van middenasaanhangwagens als bedoeld in
      [artikel 1.1, onderdeel al, van het Voertuigreglement][ref2] bestemd voor het vervoer van andere dieren dan
      paarden, voorzien van afsluitbare ventilatie-openingen, welke ten minste 1200 cm² per laadvloer groot zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel1
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '1'
  - number: 10.3.c
    text: |-
      Indien de hoogte van de ventilatie-openingen meer dan 13 cm bedraagt, zijn deze in het midden, doch in elk geval
      om de 13 cm horizontaal voorzien van een ronde metalen stang, tenzij in de ventilatie-openingen lichtmetalen
      platen zijn aangebracht in welk geval deze platen geheel geperforeerd dienen te zijn met gaten met ten minste 1
      cm middellijn.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: 10.3.d
    text: |-
      In plaats van ventilatie-openingen in de zijwanden, de voorwand en het dak is kunstmatige ventilatie toegestaan,
      mits deze gelijkwaardig is aan de onder a en b bedoelde ventilatie.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien in de zij- of achterwand een deur of schot is aangebracht, moet deze de laadruimte behoorlijk afdichten en
      voorzien zijn van een dubbele sluiting.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.5'
    text: |-
      Kanten of uitstekende hoeken van noodzakelijk in de laadruimte aanwezige delen van het koetswerk zijn rond
      afgewerkt en zo nodig afgezet met hout.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien in de laadruimte wielkasten uitsteken, moeten de zijden daarvan een rechthoekige vorm hebben waarvan
      de hoeken zijn afgerond; deze wielkasten zijn bij vervoer van ander vee dan groot vee, van hout vervaardigd of
      daarmede bedekt en bij vervoer van groot vee, van staalplaat met een dikte van ten minste 5 mm bedekt met hout.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.7'
    text: 'Indien voor het vastzetten van het vee aan de zijwanden:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: 10.7.a
    text: |-
      een aantal ringen is aangebracht, zijn deze verzonken in de wand of in daarop bevestigde klampen, waarvan de
      zijkanten rond zijn afgewerkt;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: 10.7.b
    text: |-
      een horizontale metalen staaf of buis is aangebracht, is deze op een hoogte van ongeveer 120 cm boven de laadvloer
      en op een afstand van ten hoogste 2 cm van de wand, met tussenruimte van 20 tot 40 cm, bevestigd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.8'
    text: In de laadruimte is deugdelijke verlichtingsapparatuur aanwezig.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '10.9'
    text: |-
      Indien het voertuig is voorzien van één of meer laadkleppen of laadbruggen moeten deze een sterkte hebben, die
      gelijk is aan de vereiste sterkte van de laadvloer en moeten deze op het loopvlak over de gehele breedte voorzien
      zijn van horizontaal geplaatste houten dwarslatten, op een onderlinge afstand van ongeveer 25 cm. Deze dwarslatten
      moeten hetzij door middel van moerbouten, voorzien van ronde in het hout verzonken koppen, aan de laadklep
      zijn bevestigd, hetzij tussen de planken van de laadklep of laadbruggen zijn ingelegd. De oppervlakte tussen de
      dwarslatten is voldoende stroef. Indien de laadkleppen of laadbruggen van lichtmetaal zijn vervaardigd, is over
      de gehele breedte van het loopvlak bovendien rubber met ten minste twee canvaslagen aangebracht of een ander
      stroef materiaal dat aan hetzelfde doel beantwoord. Aan de zijkanten van de laadkleppen of laadbruggen komen geen
      scherpe uitstekende delen voor. De lengte van de laadkleppen is zodanig dat de helling van de uitgelegde klep bij
      horizontale stand van het voertuig niet groter is dan 30° Bij neergelaten laadklep of laadbrug zijn de opstap,
      voor zover het vervoer van andere dieren dan paarden betreft, van de grond op de klep of brug en de opstap van de
      klep of de brug op de laadvloer niet groter dan 12 cm. Indien bij neergelaten laadklep of laadbrug een open naad
      ontstaat tussen de klep of de brug en de laadvloer, is deze naad niet breder dan 2 cm. Indien van voertuigen,
      waarvan de laadvloer zich ten minste 70 cm boven het wegdek bevindt, de breedte van de laadkleppen of laadbruggen
      minder bedraagt dan 100 cm zijn deze laadkleppen indien neergelaten, ter weerszijden voorzien van leuningen van
      een hoogte van ten minste 75 cm, gemeten loodrecht op de laadklep. De laadruimte moet door de laadklep, zo nodig
      voorzien van een hekwerk, zodanig kunnen worden afgesloten, dat de dieren niet ontsnappen. De laadklep is bovendien
      zodanig te sluiten, dat openvallen is uitgesloten. Indien voertuigen zijn voorzien van een hefinstallatie, moeten
      de laadvloeren daarmee bereikbaar zijn en is de laadruimte zodanig af te sluiten, dat de dieren niet kunnen
      ontsnappen. De opstap is, voor zover het vervoer van andere dieren dan paarden betreft, niet meer dan 12 cm en
      een eventuele naad tussen laadvloer enerzijds en hefplateau anderzijds, is niet breder dan 2 cm. Het hefplateau is
      voorzien van een stevige omheining welke geheel gesloten is of voorzien is van spijlen met tussenruimten van minder
      dan 12 cm. De hoogte van de omheining bedraagt ten minste 75 cm.Indien het gaat om een voertuig bestemd voor het
      vervoer van ten hoogste twee éénhoevige dieren, behoeft de laadklep in afwijking van het vorenstaande niet te zijn
      voorzien van leuningen alsmede niet van dwarslatten, mits de laadklep bij het in- en uitladen wordt bedekt met een
      mat van stroef materiaal. Deze mat moet de laadklep over de gehele lengte bedekken en dient ten minste 1,5 meter
      breed te zijn.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voor voertuigen, bestemd voor het vervoer van groot vee geldt voorts, dat de in [artikel 10, derde lid][ref1],
      bedoelde ventilatieopeningen zijn aangebracht op een hoogte van ten minste 130 cm boven elke laadvloer.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '11.2'
    text: Bij eenhoevig groot vee bestaat de vrije hoogte boven de laadvloer uit ten minste 175 cm.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel11
  - number: '12'
    text: |-
      Voor voertuigen, bestemd voor het vervoer van kalveren met een kruishoogte tussen 80 cm en 110 cm, geldt voorts
      het volgende:
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel12
  - number: 12.a
    text: de vrije hoogte boven de laadvloer bedraagt ten minste 125 cm, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel12
  - number: 12.b
    text: |-
      de ventilatie-openingen, bedoeld in [artikel 10, derde lid][ref1], zijn op een hoogte van ten minste 85 cm boven
      elke laadvloer aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '13'
    text: 'Voor voertuigen, bestemd voor het vervoer van klein vee geldt voorts het volgende:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel13
  - number: 13.a
    text: |-
      in afwijking van het bepaalde in [artikel 10, eerste lid][ref1], mag de laadvloer bestaan uit: hardhout met een
      dikte van ten minste 20 mm, zachthout met een dikte van ten minste 33 mm, hechthout met een dikte van ten minste 16
      mm, lichtmetaal met een dikte van ten minste 14 mm en met een trekkracht van ten minste 20 kg per mm² of uit ander
      gelijkwaardig materiaal van tenminste dezelfde sterkte;


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 13.b
    text: |-
      indien de vloeren van lichtmetaal of ander glad materiaal bedekt zijn met rubber mag de dikte daarvan in afwijking
      van het bepaalde in [artikel 10, eerste lid][ref1], 14 mm of meer bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 13.c
    text: de vrije hoogte boven de laadvloer bedraagt ten minste 90 cm, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel13
  - number: 13.d
    text: |-
      de ventilatie-openingen, bedoeld in [artikel 10, derde lid][ref1], zijn op een hoogte van ten minste 60 cm boven
      elke laadvloer aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '14'
    text: 'Voor voertuigen, bestemd voor het vervoer van varkens niet zijnde biggen geldt voorts het volgende:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel14
  - number: 14.a
    text: |-
      het bepaalde in [artikel 13, onderdelen a en b][ref1], is van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel13
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 14.b
    text: |-
      de vrije hoogte boven de laadvloer bedraagt ten minste 90 cm met dien verstande, dat voor het vervoer van varkens
      met een schofthoogte van meer dan 80 cm de vrije hoogte boven de laadvloer ten minste 110 cm bedraagt;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel14
  - number: 14.c
    text: |-
      de ventilatie-openingen, bedoeld in [artikel 10, derde lid][ref1], zijn op een hoogte van ten minste 40 cm boven
      elke laadvloer aangebracht, en


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 14.d
    text: |-
      indien het voertuig bestemd is voor het vervoer van slachtvarkens zijn de ventilatie-openingen, bedoeld in
      [artikel 10, derde lid][ref1], ten minste 24 cm en ten hoogste 36 cm hoog.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '15'
    text: 'Indien het voertuig bestemd is voor het vervoer van biggen geldt voorts het volgende:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel15
  - number: 15.a
    text: |-
      in afwijking van het bepaalde in [artikel 10, eerste lid][ref1], mag de laadvloer bestaan uit: hardhout met een
      dikte van ten minste 15 mm, zachthout met een dikte van ten minste 25 mm, hechthout met een dikte van ten minste
      12 mm, lichtmetaal met een dikte van ten minste 10 mm en met een trekvastheid van ten minste 15 kg per mm² of uit
      ander gelijkwaardig materiaal van tenminste dezelfde sterkte;


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 15.b
    text: |-
      indien de vloeren van lichtmetaal of ander glad materiaal bedekt zijn met rubber mag de dikte daarvan, in afwijking
      van het bepaalde in [artikel 10, eerste lid][ref1], 10 mm of meer bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 15.c
    text: de vrije hoogte boven de laadvloer is ten minste 60 cm, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel15
  - number: 15.d
    text: |-
      de ventilatie-openingen, bedoeld in [artikel 10, derde lid][ref1], zijn op een hoogte van ten minste 40 cm boven
      elke laadvloer aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel10
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '16.1'
    text: Bij het inladen van vee is de laadruimte goed verlicht.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien vee is geladen in de zwanenhals van een oplegger, wordt de verhoogde laadruimte afgesloten met een degelijk
      tussenschot of hek van voldoende hoogte en sterkte.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel16
  - number: '16.3'
    text: |-
      De ruimte die wordt begrensd door enerzijds de voorkant en de achterkant van een voertuig, danwel de voorkant en de
      achterkant van het gedeelte waarin het vee wordt vervoerd en anderzijds het wegdek en de bovenkant van de banden,
      wordt niet gebruikt als laadruimte voor het vervoer van vee.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel16
  - number: '17'
    text: |-
      Stieren worden zodanig geladen, dat zij elkaar niet kunnen bespringen. Fokstieren worden vastgezet met een stevig
      halster.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel17
  - number: '18'
    text: |-
      Eenhoevig groot vee beschikt over een vrije ruimte boven het hoofd van ten minste 20 centimeter. Ander groot vee
      beschikt over een vrije ruimte boven het schoft van ten minste 10 cm.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel18
  - number: '19'
    text: |-
      Bij vervoer van kalveren met een kruishoogte tussen 80 cm en 110 cm en van klein vee, zijn in de laadruimte op
      afstanden van ten hoogste 5 meter alsmede ter afsluiting van de lading schotten of hekken aangebracht, en wel
      zodanig, dat de dieren het vak waarin zij zijn geplaatst niet kunnen verlaten. Bij runderen met een kruishoogte van
      ten hoogste 80 cm is deze afstand ten hoogste 3 meter.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel19
  - number: '22.1'
    text: |-
      Indien fokvarkens of biggen worden ingeladen zijn in de laadruimte op afstanden van ten hoogste 3 meter alsmede ter
      afsluiting van de lading, degelijke schotten of hekken aangebracht van voldoende hoogte en sterkte.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien slachtvarkens worden ingeladen zijn de in het eerste lid bedoelde vakken gescheiden door een hek terwijl de
      afsluiting der lading mag geschieden met een schot of een hek.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel22
  - number: '23'
    text: Tijdens vervoer na zonsondergang brandt in de laadruimte een zwakke verlichting.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel23
  - number: '24'
    text: |-
      Tijdens het vervoer van groot vee is ter afsluiting van de lading op een hoogte van ongeveer 1 m boven de laadvloer
      in horizontale richting een stevige uitneembare buis, een ketting bekleed met plastic of rubber, dan wel een andere
      geschikte voorziening aangebracht.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel24
  - number: '25'
    text: |-
      Tijdens het vervoer van groot vee zijn de ventilatie-openingen, aangebracht op een geringere hoogte dan 130 cm
      boven de laadvloer, gesloten. Tijdens het vervoer van runderen zijn, indien de temperatuur de 25° C overschrijdt,
      deze ventilatie-openingen geopend. Boven 130 cm boven de laadvloer moet op voldoende wijze worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel25
  - number: '26'
    text: |-
      Tijdens het vervoer van kalveren met een kruishoogte tussen 80 cm en 110 cm zijn de ventilatieopeningen aangebracht
      op geringere hoogte dan 85 cm boven de laadvloer, gesloten; daarboven moet op voldoende wijze worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel26
  - number: '27'
    text: |-
      Tijdens het vervoer van klein vee zijn de ventilatie-openingen aangebracht op een geringere hoogte dan 60 cm boven
      de laadvloer, gesloten; daarboven moet op voldoende wijze worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel27
  - number: '28'
    text: |-
      Tijdens het vervoer van slachtvarkens zijn, indien de temperatuur de 25°C overschrijdt, ventilatie-openingen met
      een hoogte van ten minste 10 cm en ten hoogste 13 cm en aangebracht op een hoogte tussen 20 en 35 cm boven de
      laadvloer, geopend. Boven 40 cm boven de laadvloer moet op voldoende wijze worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel28
  - number: '29'
    text: |-
      Tijdens het vervoer van fokvarkens en biggen zijn de ventilatie-openingen aangebracht op geringere hoogte dan 40
      cm, gesloten. Daarboven moet op voldoende wijze worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel29
  - number: '30'
    text: |-
      Tijdens het vervoer van schapen dat langer duurt dan 14 uur is in het voertuig per laadvloer ten minste één voeder-
      en één drinktrog aanwezig.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel30
  - number: '31'
    text: 'Tijdens het vervoer van varkens dat langer duurt dan 8 uur zijn in het voertuig per laadvloer ten minste aanwezig:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel31
  - number: 31.a
    text: |-
      een drinknippelinstallatie bestaande uit 8 drinknippels per 3 meter laadruimte indien het om vervoer van biggen
      gaat en uit 4 drinknippels per 3 meter laadruimte indien het om vervoer van andere varkens dan biggen gaat, dan wel
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel31
  - number: 31.b
    text: één voeder- en één drinktrog.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel31
  - number: '32'
    text: |-
      Bij vervoer van vee in of op aanhangwagens als bedoeld in
      [artikel 4, derde lid, onderdeel d, van het Besluit dierenvervoer 1994][ref1] voldoet de wagen aan de navolgende
      eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel4
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '4'
  - number: 32.a
    text: de wagen is zodanig ingericht dat het ingeladen vee niet buiten het voertuig kan reiken;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.b
    text: de wagen is voorzien van wielen met luchtbanden;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.c
    text: met de wagen worden geen paarden met een schofthoogte van meer dan 1,47 m vervoerd;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.d
    text: de laadvloer van de wagen is dicht en vlak. De vloer bestaat uit hout met een dikte van ten minste 30 mm;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.e
    text: |-
      de wagen is aan alle zijden voorzien van gesloten wanden, die geheel op of aan de laadvloer aansluiten. De
      zijwanden zijn tot een hoogte van ten minste 1,20 m boven de laadvloer gesloten. Indien een overdekking wordt
      aangebracht, wordt zorg gedragen voor voldoende ventilatie;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.f
    text: |-
      de laadruimte is vrij van uitstekende delen; kanten of uitstekende hoeken van noodzakelijk in de laadruimte
      aanwezige delen van het koetswerk zijn rond en zo nodig met hout op- of aangevuld;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.g
    text: |-
      indien voor het vastzetten van het vee aan de zijwanden een aantal ringen is aangebracht, zijn deze verzonken in de
      wanden, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: 32.h
    text: |-
      indien binnen de laadruimte uitstekende wielkasten zijn aangebracht, hebben de zijden daarvan een rechthoekige
      vorm, terwijl de hoeken zijn afgerond; de wielkasten zijn vervaardigd van hout of zijn daarmee bedekt. Voor het
      vervoer van grootvee bevindt zich onder de houten wielkasten een ijzeren plaat van ten minste 5 mm dikte.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel32
  - number: '33'
    text: 'Bij vervoer van pluimvee niet zijnde eendagskuikens worden de volgende nadere regelen in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.a
    text: een voertuig bestemd voor het vervoer van pluimvee is voorzien van een gesloten, gemakkelijk te reinigen laadvloer;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.b
    text: |-
      het pluimvee wordt vervoerd in nieuwe of tevoren goed gereinigde verpakkingen. In afwijking daarvan kan wanneer
      meerdere malen per dag uitsluitend wordt vervoerd van één bedrijf naar één ander bedrijf, niet zijnde een
      slachterij, worden volstaan met het eenmaal per dag reinigen en ontsmetten van deze verpakking;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.c
    text: |-
      de hoogte van de verpakking bedraagt binnenwaarts op de grootste hoogte gemeten, ten minste: - voor pluimvee anders
      dan eenden, met een gewicht van ten hoogste 4 kg en eenden: 24-27 cm;
        - voor pluimvee anders dan eenden, met een gewicht van 4 kg of meer: 34-36 cm;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.d
    text: |-
      de boven-, voor-, achter- en zijwanden van het voertuig worden, indien de weersomstandigheden daartoe aanleiding
      geven, afgeschermd;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.e
    text: |-
      bij opeenstapeling en naast elkaar plaatsen van de verpakkingseenheden is een goede ventilatie door de totale
      lading zowel als door elke verpakkingseenheid afzonderlijk gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.f
    text: |-
      bij een luchttemperatuur van 20°C of meer worden tijdens het laden en lossen maatregelen genomen om de dieren te
      beschermen tegen zonnestraling door het plaatsen van het voertuig in de schaduw, door kunstmatige ventilatie of
      anderszins. De tijdsduur van het laden en lossen wordt in dat geval tot het uiterste beperkt;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.g
    text: |-
      indien het vervoer langer duurt dan 2 uur geschiedt dit vervoer bij een buitentemperatuur lager dan -2°C, in
      gesloten wagens. Er wordt gezorgd voor voldoende ventilatie tijdens dit vervoer, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: 33.h
    text: |-
      bij stilstand van het voertuig worden onmiddellijk alle nodige maatregelen genomen ten einde te voorkomen dat het
      pluimvee gebrek aan zuurstof krijgt.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel33
  - number: '34'
    text: 'Bij vervoer van eendagskuikens worden de volgende nadere regelen in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.a
    text: een voertuig bestemd voor het vervoer van eendagskuikens is voorzien van een gemakkelijk te reinigen laadvloer;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.b
    text: |-
      in het voertuig zijn in de wanden, in het dak of in de laadvloer openingen voor de toevoer van lucht aangebracht en
      wel zodanig dat het binnendringen van de uitlaatgassen van het voertuig wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.c
    text: |-
      in het dak of in de bovenkant van de zijwanden van het voertuig zijn voor de afvoer van lucht afzuigventilatoren
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.d
    text: |-
      de ventilatie moet vanuit de cabine van het voertuig kunnen worden geregeld en een capaciteit hebben van ten minste
      25 m³ per 1000 kuikens per uur;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.e
    text: de eendagskuikens worden verpakt in nieuwe of te voren goed gereinigde verpakkingen;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.f
    text: de hoogte van de verpakkingen bedraagt binnenwerks gemeten, ten minste 10,5 cm;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.g
    text: de bovenkant en de zijwanden van de verpakkingen zijn voorzien van ventilatiegaten;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.h
    text: de laadruimte van het voertuig is voor ten hoogste 50% met verpakkingen bezet;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.i
    text: |-
      de verpakkingen zijn zo ingeladen, dat de afstand tussen ten minste twee zijden der verpakkingen en andere
      verpakkingen of de wand van het voertuig ten minste 5 cm bedraagt;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.j
    text: |-
      tussen de onderste verpakking van de stapel en de laadvloer is een ruimte van ten minste 5 cm hoog aanwezig,
      terwijl de ruimte tussen de bovenste verpakking van een stapel en het plafond van de laadruimte ten minste 17 cm
      bedraagt, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: 34.k
    text: de temperatuur tussen de verpakkingen is ten hoogste 35°C en is in de cabine afleesbaar.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel34
  - number: '35'
    text: |-
      Het bepaalde in [artikel 34, onder c en d][ref1], alsmede onder k voor zover het de afleesbaarheid in de cabine
      betreft, is niet van toepassing indien het betreft het vervoer van tienduizend of minder eendagskuikens.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel34
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '34'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '36'
    text: Tijdens het in- en uitladen van vee is de laadruimte van het luchtvaartuig voldoende verlicht.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel36
  - number: '37'
    text: 'Bij het in- en uitladen van vee wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.a
    text: voor zover vee in vliegtuiglaadeenheden wordt vervoerd, vrachtliften, vorkhef-trucks of lopende banden, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.b
    text: 'voor zover vee anders dan in vliegtuiglaadeenheden wordt vervoerd, laadbruggen die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.b.1
    text: de oppervlakte is voorzien van een antisliplaag;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.b.2
    text: op de oppervlakte zijn dwarslatten aangebracht met een onderlinge afstand van ten hoogste 25 cm;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.b.3
    text: er zijn zijwanden aangebracht met een hoogte van ten minste 75 cm, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: 37.b.4
    text: de hoek van de laadbrug met het horizontale vlak bedraagt ten hoogste 20 graden.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel37
  - number: '38'
    text: |-
      Vee wordt zodanig geladen dat zich boven de kop onderscheidenlijk, voor zover het een paard betreft, het hoofd van
      elk dier een vrije ruimte bevindt van ten minste 10 cm.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel38
  - number: '39'
    text: |-
      Vee wordt vervoerd in een luchtvaartuig waarin de uitstekende delen van de laadruimte en van de
      transportuitrusting, voor zover de dieren met deze delen in contact kunnen komen, rond zijn afgewerkt.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel39
  - number: '40.1'
    text: |-
      Tijdens het vervoer is de temperatuur in een laadruimte waarin zich vee bevindt niet langer dan één uur lager dan
      10°C onderscheidenlijk hoger dan 25°C.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid mag de temperatuur, indien zich varkens met een gewicht van minder dan 15 kg in de
      laadruimte bevinden, niet langer dan één uur lager dan 20°C onderscheidenlijk hoger dan 25°C zijn.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel40
  - number: '41'
    text: Tijdens het vervoer overschrijdt de luchtvochtigheid in de laadruimte niet langer dan één uur de 80%-grens.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel41
  - number: '42.1'
    text: 'Voor zover vee in vliegtuiglaadeenheden wordt vervoerd, zijn deze vliegtuiglaadeenheden voorzien van:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel42
  - number: 42.1.a
    text: |-
      voor zover het gesloten vliegtuiglaadeenheden betreft, ventilatie-openingen met een hoogte van ten minste 9 cm over
      de gehele omtrek op een hoogte van ten minste 20 cm en ten hoogste 50 cm gemeten vanaf de laadvloer, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel42
  - number: 42.1.b
    text: zijkanten die in totaal lucht doorlaten over een oppervlakte van ten minste 20% van de oppervlakte per laadvloer.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel42
  - number: '42.2'
    text: Het eerste lid geldt niet voor het vervoer van eenhoevige dieren in vliegtuiglaadeenheden.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel42
  - number: '42.3'
    text: |-
      Indien de hoogte van de in het eerste lid bedoelde ventilatie-openingen meer dan 13 cm bedraagt, zijn deze in het
      midden doch in elk geval om de 13 cm horizontaal voorzien van een ronde metalen stang.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel42
  - number: '43.1'
    text: |-
      Vee dat anders dan in vliegtuiglaadeenheden wordt vervoerd, wordt in afgesloten vakken geplaatst, die door middel
      van hekken zijn afgebakend op een zodanige wijze dat een dier het vak niet kan verlaten.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien schapen, geiten en runderen worden vervoerd, worden de in het eerste lid bedoelde hekken met tussenruimten
      van ten hoogste 5 meter aangebracht. Indien varkens worden vervoerd bedragen deze tussenruimten ten hoogste 3
      meter.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel43
  - number: '44.1'
    text: |-
      Tijdens het vervoer van vee is een begeleider in het luchtvaartuig aanwezig, tenzij het in het luchtvaartuig
      aanwezige vee wordt vervoerd in ten hoogste twee vliegtuiglaadeenheden.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel44
  - number: '44.2'
    text: |-
      Indien ingevolge het eerste lid een begeleider in het luchtvaartuig aanwezig is, moet hij het vee tijdens het
      vervoer kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel44
  - number: '45.1'
    text: |-
      Pluimvee wordt vervoerd in ongebruikte of onmiddellijk voorafgaande aan het vervoer gereinigde verpakkingen,
      voorzien van ventilatie-openin- gen in de bovenkant en in de zijwanden.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel45
  - number: '45.2'
    text: 'De hoogte van de verpakking bedraagt, binnenwerks gemeten, tenminste:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel45
  - number: 45.2.a
    text: 24 cm voor pluimvee anders dan eenden, met een gemiddeld gewicht van 4 kg of minder, alsmede voor eenden;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel45
  - number: 45.2.b
    text: 34 cm voor pluimvee anders dan eenden, met een gemiddeld gewicht van meer dan 4 kg.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel45
  - number: '46.1'
    text: |-
      Eendagskuikens worden vervoerd in ongebruikte of onmiddellijk voorafgaande aan het vervoer gereinigde verpakkingen
      voorzien van ventilatie-openingen in de bovenkant en in de zijwanden.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel46
  - number: '46.2'
    text: De hoogte van de verpakking bedraagt, binnenwerks gemeten, ten minste 10,5 cm.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel46
  - number: '47'
    text: 'Verpakkingen waarin eendagskuikens worden vervoerd worden zodanig geladen dat:'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel47
  - number: 47.a
    text: |-
      de afstand tussen ten minste twee zijden van een verpakking en andere verpakkingen of de wand van de laadruimte ten
      minste 3 cm bedraagt;
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel47
  - number: 47.b
    text: |-
      tussen de onderste verpakking van een stapel en het vlak waarop deze is geplaatst een afstand van ten minste 3 cm
      bestaat, en
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel47
  - number: 47.c
    text: |-
      tussen de bovenste verpakking van een stapel en het plafond van de laadruimte een afstand van ten minste 17 cm
      bestaat.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel47
  - number: '48'
    text: |-
      Tijdens het vervoer van eendagskuikens wordt de lucht in de laadruimte ververst met ten minste 20 m³ per 1000
      eendagskuikens per uur.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel48
  - number: '49'
    text: |-
      Tijdens het vervoer van pluimvee of eendagskuikens is de temperatuur in de laadruimte niet langer dan één uur lager
      dan 20° C onderscheidenlijk 24° C, of hoger dan 30° C onderscheidenlijk 35° C.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel49
  - number: '51'
    text: |-
      Onverminderd punt 2, onder h, van de bijlage bij [richtlijn 91/628/EEG](31991L0628) worden goedkeuringsbewijzen
      afgegeven op grond van de Regeling wegvervoer vee en pluimvee 1980, waarvan de geldigheidsduur nog niet is
      verstreken op het tijdstip van inwerkingtreding van de onderhavige regeling, geacht te zijn verleend op grond van
      de Regeling dierenvervoer.
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel51
  - number: '52'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop het [Besluit dierenvervoer 1994][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006990
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006990
  - number: '53'
    text: 'Deze regeling wordt aangehaald als: Regeling dierenvervoer.'
    url: https://wetten.overheid.nl/BWBR0007482/2006-01-01#Artikel53
