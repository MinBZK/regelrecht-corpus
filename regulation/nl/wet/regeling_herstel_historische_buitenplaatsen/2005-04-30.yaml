---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_herstel_historische_buitenplaatsen
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-04-30'
bwb_id: BWBR0014003
url: https://wetten.overheid.nl/BWBR0014003/2005-04-30
preamble:
  text: |-
    Gelet op artikel 2 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b

              *Dienst Regelingen:*


              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c

              *eigenaar:*


              natuurlijke persoon die het recht van eigendom of een ander zakelijk recht heeft op (een deel van) een
      beschermde historische buitenplaats;
      naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid als bedoeld in
      [artikel 7a van de Natuurschoonwet 1928][ref1], voor zover de aandeelhouders uitsluitend natuurlijke personen
      zijn, die het recht van eigendom of een ander zakelijk recht heeft op (een deel van) een beschermde historische
      buitenplaats;
      rechtspersoon die krachtens privaatrecht is ingesteld en die het recht van eigendom of een ander zakelijk recht
      op (een deel van) een beschermde historische buitenplaats heeft verkregen van een natuurlijke persoon als bedoeld
      onder 1 of van een vennootschap als bedoeld onder 2, en die zich uitsluitend of nagenoeg uitsluitend ten doel stelt
      die buitenplaats in stand te houden;



            d

              *beschermde historische buitenplaats:*


              in het register, bedoeld in [artikel 6 van de Monumentenwet 1988][ref2], als zodanig vermeld complex waarin
      van oorsprong één of meer gebouwen een compositorisch geheel vormen met een tuin of met een park van ten minste 1
      hectare, waarvan de aanleg dateert van vóór 1850 en herkenbaar aanwezig is;



            e

              *herstel:*


              technische werkzaamheden aan onderdelen van een tuin of park, die het normale onderhoud te boven gaan,
      gericht op het behoud van het oorspronkelijke karakter daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '6'
  - number: '2'
    text: |-
      De minister kan ter instandhouding van beschermde historische buitenplaatsen subsidie verstrekken voor het herstel
      van onderdelen van parken en tuinen van beschermde historische buitenplaatsen, indien die onderdelen van belang
      zijn vanwege cultuurhistorische of natuurwetenschappelijke waarden of uit oogpunt van recreatie.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel2
  - number: '3'
    text: Voor subsidieverlening komen uitsluitend in aanmerking eigenaren van beschermde historische buitenplaatsen.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel3
  - number: '4'
    text: |-
      De minister stelt jaarlijks een subsidieplafond vast voor op grond van deze regeling te verstrekken subsidies. Het
      subsidieplafond wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel4
  - number: '5.1'
    text: |-
      De minister kan per kalenderjaar een aanvraagperiode vaststellen en geeft van dat besluit kennis in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel5
  - number: '5.2'
    text: |-
      Aanvragen worden alleen in behandeling genomen, indien een aanvraagperiode als bedoeld in het eerste lid, is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel5
  - number: '6'
    text: 'Geen subsidie wordt verleend voor:'
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel6
  - number: 6.a
    text: werkzaamheden waarvan de subsidiabele kosten minder dan € 2.250 bedragen;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel6
  - number: 6.b
    text: |-
      werkzaamheden met de uitvoering waarvan een aanvang is gemaakt alvorens de beschikking tot subsidieverlening
      schriftelijk aan de aanvrager is meegedeeld.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel6
  - number: '7.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2][ref1] kan worden verleend voor de volgende noodzakelijke kosten die met het
      herstel verband houden en die in het in [artikel 8][ref2] bedoelde werkplan zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014003#Artikel8
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014003
        artikel: '8'
        paragraaf: '3'
  - number: 7.1.a
    text: |-
      80% van de volgende kosten: - kosten van materialen;
        - loonkosten van werkzaamheden verricht door derden;
        - loonkosten van het betrokken personeel in dienst van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
  - number: 7.1.b
    text: |-
      kosten voor het opstellen van een werkplan als bedoeld in [artikel 8][ref1], overeenkomend met een percentage van
      de kosten van de werkzaamheden overeenkomstig onderstaande tabel:






                        **Kosten van werkzaamheden waarvoor op grond van onderdeel a subsidie wordt verleend (zonder
      omzetbelasting)**


                        **Bijbehorend percentage**




                        vanaf € 2.250 tot € 4.500


                        14%




                        vanaf € 4.500 tot € 9.000


                        12%




                        vanaf € 9.000 tot € 22.500


                        10%




                        vanaf € 22.500 en meer


                        8%


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel8
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '8'
        paragraaf: '3'
  - number: 7.1.c
    text: de kosten van de voor de vaststelling van de subsidie benodigde accountantsverklaring tot een maximum van € 1.800.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
  - number: '7.2'
    text: |-
      De kosten, bedoeld in het eerste lid, worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting
      indien de aanvrager de omzetbelasting niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
  - number: '7.3'
    text: |-
      Indien voor de werkzaamheden waarvoor op grond van deze regeling subsidie wordt verleend, andere subsidies door
      de rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van deze regeling verstrekt, dat de
      som van de subsidies de som van de kosten, die op basis van het eerste lid als subsidiabele kosten kunnen worden
      aangemerkt, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
  - number: '7.4'
    text: |-
      Indien voor de werkzaamheden waarvoor op grond van deze regeling subsidie wordt verleend, subsidies door anderen
      dan de rijksoverheid dan wel financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een
      zodanig bedrag op grond van deze regeling verstrekt, dat de som van de subsidies dan wel de som van de subsidie en
      de financiële middelen niet meer bedraagt dan 100% van de totale kosten van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel7
  - number: '8.1'
    text: |-
      Een aanvraag tot subsidieverlening wordt ingediend bij Dienst Regelingen met gebruikmaking van het daarvoor
      bestemde aanvraagformulier en gaat vergezeld van:
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.1.a
    text: een werkplan;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.1.b
    text: |-
      een kaart met ten minste een schaal van 1:1000, waarop de terreingedeelten of onderdelen aangegeven zijn, waarvoor
      subsidie wordt aangevraagd; en
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.1.c
    text: |-
      een advies van de Stichting tot behoud van Particuliere Historische Buitenplaatsen met betrekking tot de geplande
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: '8.2'
    text: 'Het in het eerste lid, onderdeel a, bedoelde werkplan houdt in ieder geval in:'
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.2.a
    text: |-
      een beschrijving van de huidige situatie, een gespecificeerde omschrijving van de te verrichten werkzaamheden, het
      doel van de werkzaamheden, de noodzaak van de werkzaamheden alsmede de noodzaak van de kosten;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.2.b
    text: |-
      een sluitende begroting voor de werkzaamheden en de plankosten alsmede een toelichting daarop; indien het een
      meerjarig plan betreft, is de begroting een meerjarenbegroting met een liquiditeitsplanning per jaar; en
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.2.c
    text: de realisatietermijn.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: '8.3'
    text: |-
      In het in het eerste lid, onderdeel c, bedoelde advies wordt aangegeven of de uit te voeren werkzaamheden het
      normale onderhoud te boven gaan. Voorts heeft het advies betrekking op:
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.3.a
    text: |-
      de bijdrage die de uit te voeren werkzaamheden leveren aan de instandhouding en het herstel van de beschermde
      historische buitenplaats;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.3.b
    text: het cultuurhistorische, natuurwetenschappelijke of recreatieve belang van de uit te voeren werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.3.c
    text: de urgentie van de uit te voeren werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.3.d
    text: de wijze van uitvoering en de te gebruiken materialen; en
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: 8.3.e
    text: de mogelijke samenhang met andere gesubsidieerde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel8
  - number: '9'
    text: |-
      De minister rangschikt, in overleg met de minister van Onderwijs, Cultuur en Wetenschappen, de aanvragen die voor
      subsidie in aanmerking komen zodanig dat zij hoger worden gerangschikt naarmate:
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel9
  - number: 9.a
    text: |-
      de uit te voeren werkzaamheden een grotere bijdrage leveren aan de instandhouding en het herstel van de beschermde
      historische buitenplaats;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel9
  - number: 9.b
    text: |-
      de uit te voeren werkzaamheden meer van belang zijn voor de cultuurhistorische of natuurwetenschappelijke waarde
      van de beschermde historische buitenplaats of voor de recreatie;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel9
  - number: 9.c
    text: een grotere urgentie bestaat voor de uit te voeren werkzaamheden; en
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel9
  - number: 9.d
    text: er samenhang is met andere gesubsidieerde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel9
  - number: '10.1'
    text: |-
      De minister beslist binnen vier maanden na afloop van de aanvraagperiode op aanvragen die in de betrokken
      aanvraagperiode zijn ingediend met inachtneming van [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel9
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '9'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      De minister kan bij de subsidieverlening bepalen dat de werkzaamheden voor een door hem te bepalen datum zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel10
  - number: '11'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '12'
    text: |-
      De subsidieontvanger maakt een aanvang met de uitvoering van de werkzaamheden binnen één jaar na afgifte van de
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel12
  - number: '13'
    text: De subsidieontvanger voert de werkzaamheden uit overeenkomstig het werkplan.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel13
  - number: '14'
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle kosten van het herstel kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 7][ref1] onderscheiden kostenposten, waarbij ter zake van de loonkosten van het personeel in dienst van de
      subsidieontvanger een door middel van een sluitende tijdschrijving vastgestelde urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel7
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '7'
        paragraaf: '2'
  - number: '15.1'
    text: De aanvraag tot subsidievaststelling wordt ingediend binnen twee maanden na afloop van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
  - number: '15.2'
    text: |-
      Voorzover de subsidie is verleend voor meer dan één jaar, dient de subsidieontvanger telkens binnen twee maanden
      na afloop van een jaar een aanvraag tot subsidievaststelling over dat jaar in, met dien verstande dat de laatste
      aanvraag wordt ingediend binnen twee maanden na afloop van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
  - number: '15.3'
    text: 'De aanvraag omvat:'
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
  - number: 15.3.a
    text: een financiële verantwoording van de werkzaamheden, met de daarbij behorende bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
  - number: 15.3.b
    text: |-
      indien de totale subsidiabele kosten meer bedragen dan € 22.500 een verklaring van een registeraccountant of een
      accountant-administratieconsulent als bedoeld in [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1]
      waaruit blijkt dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '15.4'
    text: |-
      De accountant, bedoeld in het tweede lid, onderdeel b, controleert met inachtneming van het in [bijlage 1][ref1]
      bij deze regeling opgenomen controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0014003
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014003
  - number: '15.5'
    text: |-
      De goedkeurende accountantsverklaring wordt opgesteld overeenkomstig de in [bijlage 2][ref1] opgenomen
      modelaccountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0014003
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014003
  - number: '15.6'
    text: |-
      De minister kan de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en Visserij een review laten
      uitvoeren op de door de accountant van de aanvrager verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel15
  - number: '16'
    text: |-
      De minister stelt binnen twee maanden na ontvangst van de in [artikel 15][ref1] bedoelde aanvraag de subsidie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel15
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '15'
        paragraaf: '5'
  - number: '17.1'
    text: |-
      De minister kan de subsidieontvanger op diens verzoek voorschotten verstrekken tot ten hoogste 50% van het
      verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel17
  - number: '17.2'
    text: De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel17
  - number: '18'
    text: |-
      De Regeling subsidies achterstallig onderhoud voor historische parken, tuinen en buitenplaatsen blijft van
      toepassing op op grond daarvan verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel18
  - number: '19'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel19
  - number: '20'
    text: |-
      Twee jaar na inwerkingtreding en voorts iedere drie jaar wordt een verslag gepubliceerd over de doeltreffendheid en
      de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling herstel historische buitenplaatsen.'
    url: https://wetten.overheid.nl/BWBR0014003/2005-04-30#Artikel21
