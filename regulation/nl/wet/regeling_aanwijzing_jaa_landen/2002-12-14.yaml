preamble:
  text: |-
    Gelet op de artikelen 2.1, tweede lid, 2.2, eerste lid, en 2.8, onderdeel a, van de Wet luchtvaart,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010716/2002-12-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] gestelde
      bepalingen, worden de bewijzen van bevoegdheid, bewijzen van gelijkstelling, bewijzen van kwalificatie of
      registratie van opleidingsinstellingen en medische verklaringen, zonder formaliteiten erkend, indien zij zijn
      afgegeven in overeenstemming met de bepalingen van JAR-FCL 1, 2, 3 of 4 door de bevoegde autoriteiten van de
      volgende staten:

      a. België,

      b. Denemarken,

      c. Finland,

      d. Frankrijk,

      e. Ierland,

      f. IJsland,

      g. Malta,

      h. Noorwegen,

      i. Spanje,

      j. Tsjechische Republiek,

      k. het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland,

      l. Zweden, en

      m. Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0010629
    url: https://wetten.overheid.nl/BWBR0010716/2002-12-14#Artikel1
    references:
      - id: ref1
