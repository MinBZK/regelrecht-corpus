  - number: '2'
    text: |-
      1 Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] gestelde
      bepalingen, worden de bewijzen van bevoegdheid en de bewijzen van erkenning van opleidingsinstellingen, zonder
      formaliteiten erkend indien zij zijn afgegeven in overeenstemming met de bepalingen van JAR-66 en JAR-147 door de
      bevoegde autoriteiten van de volgende staten:

      a. België,

      b. Denemarken,

      c. Duitsland,

      d. Finland,

      e. Frankrijk,

      f. Ierland,

      g. Italië,

      h. Noorwegen,

      i. Oostenrijk,

      j. Roemenië,

      k. het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland,

      l. Zweden, en

      m. Zwitserland.

      2 Onverminderd de bij of krachtens het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2] gestelde
      bepalingen, worden de certificaten van opleiding zonder formaliteiten erkend indien zij zijn afgegeven in
      overeenstemming met de bepalingen van JAR-66 en JAR-147 door opleidingsinstellingen die volgens JAR-147 zijn erkend
      door de autoriteiten van de staten, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010629
      [ref2]: https://wetten.overheid.nl/BWBR0010629
