preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat het wenselijk is regelen te stellen omtrent het houden van legkippen en
    daarbij tevens regelen te stellen omtrent het vervangen van het huidige systeem van legbatterijen door een meer op
    het welzijn van legkippen gericht huisvestingssysteem;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003684/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Landbouw en Visserij;

      b. legkip: de legrijpe hen van de soort Gallus Gallus die gehouden wordt ten behoeve van de produktie van
      consumptie-eieren;

      c. kooi: ruimte bestemd voor het houden van een of meer legkippen;

      d. kooi-oppervlakte: de oppervlakte van het door de wanden van de kooi of het denkbeeldig verlengde ervan begrensde
      horizontale vlak dat het vloer- of grondvlak in de kooi op het hoogste punt raakt;

      e. voederbaklengte: de lengte van de voor een legkip in of vanuit de kooi toegankelijke zijde of zijden van de
      voederbak.
    url: https://wetten.overheid.nl/BWBR0003684/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 Met ingang van 1 januari 1985 tot 1 juli 1994 is het houden van één of meer legkippen in een kooi slechts
      toegestaan indien:

      a. de kooi-oppervlakte tenminste 425 cm2 per legkip bedraagt;

      b. de voederbaklengte, in geval de kooi minder dan 100 cm diep is, tenminste 9,6 cm per legkip bedraagt.

      2 In afwijking van het bepaalde in het eerste lid, aanhef en onder *a,* mag de kooi-oppervlakte 400 cm2 per legkip
      bedragen, indien de voederbaklengte tenminste 10 cm per legkip bedraagt.

      3 In afwijking van het bepaalde in het eerste lid, aanhef en onder *a* en *b*, mag de kooi-oppervlakte 400 cm2 per
      legkip bedragen, indien het betreft kooien die op 1 januari 1985 in gebruik zijn en voor zolang ten genoegen van
      Onze Minister wordt aangetoond dat die kooien nog geen 10 jaar oud zijn.

      4 Onze Minister stelt bij in de *Nederlandse Staatscourant* bekend te maken beschikking regelen omtrent de wijze
      waarop dient te worden aangetoond dat een kooi nog geen 10 jaar oud is.
    url: https://wetten.overheid.nl/BWBR0003684/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Tenzij het bepaalde in de laatste volzin van het vierde lid toepassing vindt, is het vanaf 1 juli 1994 verboden
      om één of meer legkippen te houden in strijd met de bij algemene maatregel van bestuur vóór 1 januari 1990 te geven
      voorschriften omtrent het houden van legkippen.

      2 De krachtens het eerste lid gegeven voorschriften kunnen onder meer betrekking hebben op:

        - kooi-afmetingen en -uitvoeringen;
        - de vormgeving van kooien;
        - de aard van de wanden en van het vloer- of grondoppervlak van kooien;
        - de lichtdoorlatende oppervlakte van kooien en stallen waarin kooien staan opgesteld;
        - de temperatuur en de ventilatie in kooien;
        - de bezettingsdichtheid in kooien;
        - de aanwezigheid van zitstokken en legnesten;
        - de voeder- en drinkbaklengte.

      3 Een krachtens het eerste lid vastgestelde maatregel wordt aan de beide Kamers der Staten-Generaal overgelegd. De
      maatregel treedt in werking met ingang van een door Ons, met inachtneming van het eerste lid, te bepalen tijdstip,
      dat niet eerder gelegen zal zijn dan nadat dertig dagen na de overlegging zijn verstreken, indien gedurende die
      termijn niet door of namens één der Kamers of door tenminste één vijfde van het grondwettelijk aantal leden van
      één der Kamers de wens wordt te kennen gegeven, dat de inwerkingtreding van de maatregel bij de wet zal worden
      geregeld. Indien zodanige wens te kennen is gegeven, dienen Wij zo spoedig mogelijk een desbetreffend wetsontwerp
      in.
    url: https://wetten.overheid.nl/BWBR0003684/1998-01-01#Artikel3
  - number: '4'
    text: |-
      1 De krachtens [artikel 3, eerste lid][ref1], gegeven voorschriften zijn niet van toepassing op het houden van
      legkippen in op 1 juli 1994 in gebruik zijnde kooien, voor zolang ten genoegen van Onze Minister wordt aangetoond
      dat die kooien nog geen 10 jaar oud zijn en voor zover:

      a. de kooi-oppervlakte per legkip tenminste een bij algemene maatregel van bestuur vast te stellen omvang heeft;

      b. de kooi voldoet aan andere eisen welke bij algemene maatregel van bestuur kunnen worden vastgesteld.

      2 De in het eerste lid, onder *a*, bedoelde omvang wordt zodanig vastgesteld dat degenen die legkippen houden
      met gebruikmaking van de in het eerste lid bedoelde overgangsbepaling geen gunstiger concurrentievoorwaarden
      genieten dan degenen die legkippen houden met inachtneming van de krachtens [artikel 3, eerste lid][ref2], gegeven
      voorschriften.

      3 Onze Minister stelt bij in de *Staatscourant* bekend te maken beschikking regelen omtrent de wijze waarop dient
      te worden aangetoond dat een kooi nog geen 10 jaar oud is.

      4 In afwijking van het bepaalde in artikel 2 en in het eerste lid van het onderhavige artikel, zijn de aldaar
      gegeven voorschriften slechts van toepassing tot de inwerkingtreding van stringentere voorschriften dienaangaande
      gegeven bij of krachtens enige andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003684#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003684#Artikel3
    url: https://wetten.overheid.nl/BWBR0003684/1998-01-01#Artikel4
