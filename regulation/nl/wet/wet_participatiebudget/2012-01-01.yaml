  - number: 5a
    text: |-
      In afwijking van [artikel 7:11 van de Algemene wet bestuursrecht][ref1], wordt bij de toepassing van de
      [artikelen 2][ref2], [4, tweede lid][ref3], en [5, tweede lid][ref4], gebruikgemaakt van de gegevens, bedoeld
      in artikel 5, tweede lid, en de informatie, bedoeld in [artikel 6, onderdeel a][ref5], waarvan Onze Minister van
      Sociale Zaken en Werkgelegenheid kennis heeft op 15 augustus voor zover het betreft de artikelen 2 en 5, tweede
      lid, en 30 september voor zover het betreft artikel 4, tweede lid, van het jaar volgend op het verantwoordingsjaar,
      met dien verstande dat gegevens die het college op verzoek van Onze Minister van Sociale Zaken en Werkgelegenheid
      op een latere datum verstrekt mede in aanmerking worden genomen. Indien artikel 6, onderdeel b, van toepassing is,
      wordt voor het jaar volgend op het verantwoordingsjaar gelezen: het tweede jaar volgend op het verantwoordingsjaar.


