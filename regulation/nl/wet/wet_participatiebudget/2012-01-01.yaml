  - number: '5'
    text: |-
      1 Het college verstrekt desgevraagd aan Onze Ministers de gegevens die zij voor de statistiek en de beleidsvorming
      met betrekking tot deze wet nodig hebben. De gegevens worden kosteloos verstrekt.

      2 Het college verstrekt de gegevens ten behoeve van de verdeelsleutels, bedoeld in [artikel 2, vierde lid][ref1],
      als onderdeel van de verantwoordingsinformatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref2].

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de verstrekking van de in het eerste lid bedoelde gegevens;

      b. de betaling van de uitkering, bedoeld in [artikel 2, eerste lid][ref3], indien het college de in het eerste lid
      bedoelde gegevens niet of niet tijdig verstrekt dan wel de kwaliteit van die gegevens te kort schiet.

      4 Het college dient jaarlijks bij Onze Minister van Sociale Zaken en Werkgelegenheid een beeld van de uitvoering
      in.

      5 Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.


