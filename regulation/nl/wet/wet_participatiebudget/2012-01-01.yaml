  - number: '4'
    text: |-
      1 Het college legt verantwoording af aan Onze Minister van Sociale Zaken en Werkgelegenheid over de uitvoering van
      deze wet, op de wijze, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2], blijkt dat de uitkering, bedoeld in
      [artikel 2][ref3], niet volledig of onrechtmatig is besteed, wordt de uitkering ter hoogte van het niet of
      onrechtmatig bestede deel door Onze Minister van Sociale Zaken en Werkgelegenheid teruggevorderd. Onze Minister van
      Sociale Zaken en Werkgelegenheid doet binnen een jaar na ontvangst van de verantwoordingsinformatie mededeling van
      de terugvordering aan het college.

      3 Indien de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref4],
      niet volledig door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is ontvangen binnen dertien maanden
      na het kalenderjaar waarop zij betrekking heeft, wordt de uitkering teruggevorderd. Indien volledige terugvordering
      naar het oordeel van Onze Minister van Sociale Zaken en Werkgelegenheid leidt tot een onbillijkheid van overwegende
      aard, stelt Onze Minister van Sociale Zaken en Werkgelegenheid de terugvordering op een lager bedrag vast. Onze
      Minister van Sociale Zaken en Werkgelegenheid doet binnen drie maanden na afloop van de dertien maanden, bedoeld in
      de eerste zin, mededeling van terugvordering aan het college.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering, bedoeld
      in het tweede en derde lid, alsmede over de verdeling van de teruggevorderde gelden. Daarbij kan worden bepaald
      dat een gedeelte van het niet bestede deel van de uitkering niet wordt teruggevorderd. De tweede zin is niet van
      toepassing op het deel van de uitkering dat in strijd met [artikel 14][ref5] niet is besteed bij een regionaal
      opleidingencentrum.


