  - number: '13'
    text: |-
      1 In afwijking van [artikel 2][ref1] ontvangt het college van een gemeente die op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref2] een brede doeluitkering als bedoeld in
      dat besluit heeft ontvangen, voor het kalenderjaar 2009 geen uitkering op grond van de verdeelsleutel, bedoeld
      in [artikel 2, vierde lid][ref3], voor het bedrag dat door Onze Minister van Onderwijs, Cultuur en Wetenschap
      respectievelijk door Onze Minister voor Wonen, Wijken en Integratie beschikbaar is gesteld voor de uitkering,
      bedoeld in [artikel 2, eerste lid][ref4].

      2 In afwijking van [artikel 2, eerste lid][ref5], wordt het voor het kalenderjaar 2009 verstrekte deel
      van de uitkering, bedoeld in dat lid, dat het college van een gemeente als bedoeld in het eerste lid
      heeft ontvangen op grond van de verdeelsleutel voor het bedrag dat door Onze Minister van Sociale Zaken
      en Werkgelegenheid beschikbaar is gesteld niet gebruikt voor de bekostiging van de in het meerjaren
      ontwikkelingsprogramma, bedoeld in het [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref6],
      vastgestelde resultaten ten aanzien van volwasseneneducatie en inburgering, bedoeld in dat besluit en de
      [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref7].

      3 Het tweede lid is niet van toepassing voor zover de uitkering wordt gebruikt ter bekostiging van:

      a. een re-integratievoorziening indien die onderdeel uitmaakt van een participatievoorziening die een combinatie is
      van een inburgerings- en een re-integratievoorziening, of

      b. inburgeringsvoorzieningen of inburgeringsvoorzieningen die onderdeel uitmaken van een
      participatievoorziening als bedoeld in onderdeel a voor zover het totaal van de kosten van
      die inburgeringsvoorzieningen hoger is dan het totaal van de bijdragevergoedingen, bedoeld in
