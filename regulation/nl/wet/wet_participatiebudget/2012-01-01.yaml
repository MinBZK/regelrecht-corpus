preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat het WWB-werkdeel, inburgeringsbudgetten voor zover
    deze betrekking hebben op de inburgeringsvoorzieningen en de middelen voor volwasseneneducatie worden gebundeld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025039/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *college:* college van burgemeester en wethouders;
        - *doelgroep:* 1°. iedere in Nederland woonachtige Nederlander van achttien jaar of ouder, 2°. iedere in
      Nederland woonachtige vreemdeling van achttien jaar of ouder die rechtmatig in Nederland verblijf houdt in de
      zin van [artikel 8, onderdelen a tot en met e dan wel l, van de Vreemdelingenwet 2000][ref1], en 3°. iedere in
      Nederland woonachtige persoon van zeventien jaar of jonger die heeft voldaan aan de kwalificatieplicht, bedoeld
      in [paragraaf 2a van de Leerplichtwet 1969][ref2], dan wel aan wie een vrijstelling van die kwalificatieplicht
      is verleend;
        - *inburgeringsvoorziening:* inburgeringsvoorziening als bedoeld in de [artikelen 19, derde lid][ref3], en
      [24a, derde lid, van de Wet inburgering][ref4];
        - *IOAW:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5];
        - *IOAZ:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6];
        - *Onze Ministers:* Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van Onderwijs, Cultuur en
      Wetenschap en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *opleiding educatie:* opleiding als bedoeld in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref7];
        - *participatievoorziening:* opleiding educatie, inburgeringsvoorziening, taalkennisvoorziening of re-
      integratievoorziening;
        - *re-integratievoorziening:* voorziening, waaronder begrepen sociale activering als bedoeld in
      [artikel 6, eerste lid, onderdeel c, van de Wet werk en bijstand][ref8], gericht op arbeidsinschakeling als bedoeld
      in [artikel 6, eerste lid, onderdeel b, juncto tweede lid, van de Wet werk en bijstand][ref9];
        - *regionaal opleidingencentrum:* een instelling als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref10];
        - *taalkennisvoorziening:* taalkennisvoorziening als bedoeld in de [artikelen 19, derde lid][ref11], en
      [24a, derde lid, van de Wet inburgering][ref12].


