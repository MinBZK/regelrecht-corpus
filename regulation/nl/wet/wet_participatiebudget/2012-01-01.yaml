    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het doeltreffender
      uitvoeren van deze wet teneinde de doelen van educatie, inburgering en re-integratie te realiseren, voor een
      periode van drie jaar worden afgeweken van het bepaalde bij de [artikelen 2, eerste lid][ref1] en [3][ref2].

      2 Onze Minister van Sociale Zaken en Werkgelegenheid zendt uiterlijk zes maanden voor de beëindiging van een
      experiment als bedoeld in het eerste lid een verslag over de doeltreffendheid en de effecten in de praktijk van het
      experiment aan beide kamers der Staten-Generaal.

      3 De voordracht voor de krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
