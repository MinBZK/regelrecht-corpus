    text: |-
      1 Tot een bij algemene maatregel van bestuur te bepalen tijdstip wordt het deel van de uitkering dat
      het college ontvangt voor het desbetreffende kalenderjaar op basis van de verdeelsleutel, bedoeld in
      [artikel 2, vierde lid][ref1], voor het bedrag dat door Onze Minister van Onderwijs, Cultuur en Wetenschap
      beschikbaar is gesteld, besteed bij regionale opleidingencentra voor opleidingen educatie.

      2 Tot een bij algemene maatregel van bestuur te bepalen tijdstip wordt het deel van de uitkering dat
      het college ontvangt voor het desbetreffende kalenderjaar op basis van de verdeelsleutel, bedoeld in
      [artikel 2, vierde lid][ref2], voor het bedrag dat door Onze Minister van Onderwijs, Cultuur en Wetenschap
      beschikbaar is gesteld, besteed bij regionale opleidingencentra.

      3 De bestedingsverplichting bij regionale opleidingencentra voor opleidingen educatie, bedoeld in het eerste
      lid, geldt niet voor zover het college reeds vóór 15 september 2009 juridische verplichtingen met particuliere
      aanbieders voor opleidingen educatie is aangegaan.


