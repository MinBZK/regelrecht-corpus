    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van de
      [artikelen 2][ref3], [4][ref4] en [5][ref5], in de plaats van het college, met dien verstande dat:

      a. voor de toepassing van [artikel 2][ref6] en [artikel 5, tweede lid][ref7], de met toepassing van
      [artikel 34a van de Wet gemeenschappelijke regelingen][ref8] door het openbaar lichaam op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref9], verantwoorde informatie in aanmerking kan worden genomen;

      b. indien een openbaar lichaam de uitkering, bedoeld in [artikel 2][ref10], ontvangt van het college
      van de gemeente die deelneemt aan de gemeenschappelijke regeling, voor de termijn van dertien maanden in
      [artikel 4, derde lid][ref11], telkens wordt gelezen: vijfentwintig maanden.


