    text: |-
      1 De [Wet werk en bijstand][ref1] en de [Wet educatie en beroepsonderwijs][ref2] en de daarop berustende
      bepalingen, zoals deze luidden op 31 december 2008, blijven van toepassing op uitkeringen op grond van de
      [artikelen 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref3] en op de rijksbijdrage op grond van
      [artikel 2.3.1 van de Wet educatie en beroepsonderwijs][ref4] over de jaren gelegen voor 2009.

      2 Bij algemene maatregel van bestuur worden regels gegeven omtrent de vaststelling van de rijksbijdrage die op
      grond van [artikel 52 van de Wet inburgering][ref5] is verleend over de jaren voor 2009.

      3 Het deel van de uitkering op grond van [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref6]
      voor het jaar 2008 dat op grond van de algemene maatregel van bestuur, bedoeld in
      [artikel 70, derde lid, van die wet][ref7], zoals deze luidde op 31 december 2008, wordt toegevoegd aan de
      uitkering van het daaropvolgende kalenderjaar, wordt toegevoegd aan de uitkering, bedoeld in [artikel 2][ref8] van
      deze wet, voor het jaar 2009.

      4 In afwijking van [artikel 2, tweede lid][ref9], wordt de uitkering voor het kalenderjaar 2009 binnen vier weken
      na de inwerkingtreding van deze wet vastgesteld.


