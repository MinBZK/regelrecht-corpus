  - number: '2'
    text: |-
      1 Onze Minister van Sociale Zaken en Werkgelegenheid verstrekt aan het college een uitkering ten behoeve van
      de kosten van participatievoorzieningen, niet zijnde uitvoeringskosten, voor de doelgroep alsmede voor de
      voorzieningen, bedoeld in [artikel 3, tweede lid][ref1].

      2 De uitkering wordt vastgesteld in september voorafgaande aan het kalenderjaar waarop zij betrekking heeft.

      3 Het bedrag van de uitkering is de som van de uitkomsten van drie berekeningen, elk op basis van een
      verdeelsleutel die bepaalt hoe het voor het kalenderjaar bij begrotingswet vast te stellen bedrag dat Onze Minister
      wie het aangaat beschikbaar heeft voor de uitkering wordt verdeeld over de colleges.

      4 De verdeelsleutels worden bij of krachtens algemene maatregel van bestuur vastgesteld.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de betaalbaarstelling van de
      uitkering.

      6 Onder bij algemene maatregel van bestuur te bepalen voorwaarden kan een bij die algemene maatregel van
      bestuur te bepalen gedeelte van de uitkering worden aangewend voor andere kosten ten behoeve van de bevordering
      van participatie dan de kosten, bedoeld in het eerste lid, alsmede ten behoeve van de in dat lid bedoelde
      uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel3
    url: https://wetten.overheid.nl/BWBR0025039/2012-01-01#Artikel2
    references:
      - id: ref1
