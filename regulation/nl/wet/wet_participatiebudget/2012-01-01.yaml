        artikel: '3'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      1 Het college kan aan personen uit de doelgroep opleidingen educatie, inburgeringsvoorzieningen,
      taalkennisvoorzieningen of re-integratievoorzieningen aanbieden respectievelijk ten behoeve van personen uit de
      doelgroep inburgeringsvoorzieningen of taalkennisvoorzieningen vaststellen. Daarbij geldt dat opleidingen educatie
      alleen kunnen worden aangeboden aan personen van achttien jaar of ouder.

      2 In aanvulling op het eerste lid kan het college re-integratievoorzieningen of opleidingen educatie
      aanbieden aan iedere in Nederland woonachtige vreemdeling van achttien jaar of ouder die krachtens
      [artikel 11, derde lid, van de Wet werk en bijstand][ref1] met een Nederlander wordt gelijkgesteld.

      3 In aanvulling op het eerste en tweede lid kan het college re-integratievoorzieningen aanbieden aan personen van
      16 of 17 jaar oud voor wie de leerplicht of kwalificatieplicht nog niet is geëindigd en ten aanzien van wie het
      college van oordeel is dat een leer-werktraject geraden is, voor zover deze re-integratievoorzieningen voorzien in
      de kosten van ondersteuning die nodig zijn bij een leer-werktraject voor die personen.

      4 Voor zover het college:

      a. een opleiding educatie aanbiedt, is de [Wet educatie en beroepsonderwijs][ref2] van toepassing;

      b. een inburgeringsvoorziening of een taalkennisvoorziening aanbiedt aan een inburgeringsplichtige of
      aan een vrijwillige inburgeraar of vaststelt ten behoeve van een inburgeringsplichtige als bedoeld in de
      [Wet inburgering][ref3] is de [Wet inburgering][ref4] van toepassing, of

      c. een re-integratievoorziening aanbiedt aan een persoon als bedoeld in
      [artikel 7, eerste lid, onderdeel a, of derde lid, tweede zin, van de Wet werk en bijstand][ref5],
      [artikel 34, eerste lid, onderdeel a, van de IOAW][ref6], of
      [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref7], is de [Wet werk en bijstand][ref8], de [IOAW][ref9],
      respectievelijk de [IOAZ][ref10], van toepassing.

      5 Bij algemene maatregel van bestuur kunnen nadere voorwaarden worden gesteld waaronder de kosten van opleidingen
      educatie, inburgeringsvoorzieningen, taalkennisvoorzieningen of re-integratievoorzieningen, niet zijnde
      uitvoeringskosten, ten laste van de uitkering, bedoeld in [artikel 2, eerste lid][ref11], kunnen worden gebracht.

      6 In afwijking van het eerste en tweede lid wordt geen re-integratievoorziening aangeboden aan de persoon, bedoeld
      in [artikel 7, derde lid, onderdeel a of b, van de Wet werk en bijstand][ref12].


