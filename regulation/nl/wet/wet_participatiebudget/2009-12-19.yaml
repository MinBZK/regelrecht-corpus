  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorwaarden worden gesteld waaronder de kosten van opleidingen
      educatie, inburgeringsvoorzieningen, taalkennisvoorzieningen of re-integratievoorzieningen, niet zijnde
      uitvoeringskosten, ten laste van de uitkering, bedoeld in [artikel 2, eerste lid][ref1], kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      Het college legt verantwoording af aan Onze Minister van Sociale Zaken en Werkgelegenheid over de uitvoering van
      deze wet, op de wijze, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '4.2'
    text: |-
      Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1], blijkt dat de uitkering, bedoeld in
      [artikel 2][ref2], niet volledig of onrechtmatig is besteed, wordt de uitkering ter hoogte van het niet of
      onrechtmatig bestede deel door Onze Minister van Sociale Zaken en Werkgelegenheid teruggevorderd. Onze Minister van
      Sociale Zaken en Werkgelegenheid doet binnen een jaar na ontvangst van de verantwoordingsinformatie mededeling van
      de terugvordering aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      Indien de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1],
      niet volledig door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is ontvangen binnen dertien maanden
      na het kalenderjaar waarop zij betrekking heeft, wordt de uitkering teruggevorderd. Indien volledige terugvordering
      naar het oordeel van Onze Minister van Sociale Zaken en Werkgelegenheid leidt tot een onbillijkheid van overwegende
      aard, stelt Onze Minister van Sociale Zaken en Werkgelegenheid de terugvordering op een lager bedrag vast. Onze
      Minister van Sociale Zaken en Werkgelegenheid doet binnen drie maanden na afloop van de dertien maanden, bedoeld in
      de eerste zin, mededeling van terugvordering aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '4.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering, bedoeld
      in het tweede en derde lid, alsmede over de verdeling van de teruggevorderde gelden. Daarbij kan worden bepaald
      dat een gedeelte van het niet bestede deel van de uitkering niet wordt teruggevorderd. De tweede zin is niet van
      toepassing op het deel van de uitkering dat in strijd met [artikel 12][ref1] niet is besteed bij een regionaal
      opleidingencentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel12
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '12'
        hoofdstuk: '4'
  - number: '5.1'
    text: |-
      Het college verstrekt desgevraagd aan Onze Ministers de gegevens die zij voor de statistiek en de beleidsvorming
      met betrekking tot deze wet nodig hebben. De gegevens worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel5
  - number: '5.2'
    text: |-
      Het college verstrekt de gegevens ten behoeve van de verdeelsleutels, bedoeld in [artikel 2, vierde lid][ref1], als
      onderdeel van de verantwoordingsinformatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de verstrekking van de in het eerste lid
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel5
  - number: '5.4'
    text: Het college dient jaarlijks bij Onze Minister van Sociale Zaken en Werkgelegenheid een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel5
  - number: '5.5'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel5
  - number: '6'
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van de
      [artikelen 2][ref3], [4][ref4] en [5][ref5], in de plaats van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025039#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0025039#Artikel5
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0025039
        artikel: '4'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0025039
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het doeltreffender
      uitvoeren van deze wet teneinde de doelen van educatie, inburgering en re-integratie te realiseren, voor een
      periode van drie jaar worden afgeweken van het bepaalde bij de [artikelen 2, eerste lid][ref1] en [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025039#Artikel3
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025039
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt uiterlijk zes maanden voor de beëindiging van een
      experiment als bedoeld in het eerste lid een verslag over de doeltreffendheid en de effecten in de praktijk van het
      experiment aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel7
  - number: '7.3'
    text: |-
      De voordracht voor de krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel7
  - number: '12'
    text: |-
      Onze Ministers zenden binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel12
  - number: '13.1'
    text: |-
      In afwijking van [artikel 2][ref1] ontvangt het college van een gemeente die op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref2] een brede doeluitkering als bedoeld in
      dat besluit heeft ontvangen, voor het kalenderjaar 2009 geen uitkering op grond van de verdeelsleutel, bedoeld
      in [artikel 2, vierde lid][ref3], voor het bedrag dat door Onze Minister van Onderwijs, Cultuur en Wetenschap
      respectievelijk door Onze Minister voor Wonen, Wijken en Integratie beschikbaar is gesteld voor de uitkering,
      bedoeld in [artikel 2, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018238
      [ref3]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018238
      - id: ref3
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], wordt het voor het kalenderjaar 2009 verstrekte deel
      van de uitkering, bedoeld in dat lid, dat het college van een gemeente als bedoeld in het eerste lid
      heeft ontvangen op grond van de verdeelsleutel voor het bedrag dat door Onze Minister van Sociale Zaken
      en Werkgelegenheid beschikbaar is gesteld niet gebruikt voor de bekostiging van de in het meerjaren
      ontwikkelingsprogramma, bedoeld in het [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref2],
      vastgestelde resultaten ten aanzien van volwasseneneducatie en inburgering, bedoeld in dat besluit en de
      [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018238
      [ref3]: https://wetten.overheid.nl/BWBR0018516
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018238
      - id: ref3
        bwb_id: BWBR0018516
  - number: '13.3'
    text: 'Het tweede lid is niet van toepassing voor zover de uitkering wordt gebruikt ter bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel13
  - number: 13.3.a
    text: |-
      een re-integratievoorziening indien die onderdeel uitmaakt van een participatievoorziening die een combinatie is
      van een inburgerings- en een re-integratievoorziening, of
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel13
  - number: 13.3.b
    text: |-
      inburgeringsvoorzieningen of inburgeringsvoorzieningen die onderdeel uitmaken van een
      participatievoorziening als bedoeld in onderdeel a voor zover het totaal van de kosten van
      die inburgeringsvoorzieningen hoger is dan het totaal van de bijdragevergoedingen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '14.1'
    text: |-
      In 2009 wordt het deel van de uitkering dat het college ontvangt voor het kalenderjaar 2009 op basis van de
      verdeelsleutel, bedoeld in [artikel 2, vierde lid][ref1], voor het bedrag dat door Onze Minister van Onderwijs,
      Cultuur en Wetenschap beschikbaar is gesteld, besteed bij regionale opleidingencentra voor opleidingen educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      In 2010 wordt het deel van de uitkering dat het college ontvangt voor het kalenderjaar 2010 op basis van de
      verdeelsleutel, bedoeld in [artikel 2, vierde lid][ref1], voor het bedrag dat door Onze Minister van Onderwijs,
      Cultuur en Wetenschap beschikbaar is gesteld, besteed bij regionale opleidingencentra.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '14.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het op grond van het eerste lid bij regionale
      opleidingencentra te besteden bedrag voor opleidingen educatie geheel of gedeeltelijk ook bij die regionale
      opleidingencentra mag worden besteed aan inburgerings-, taalkennis- of re-integratievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel14
  - number: '15.1'
    text: |-
      De [Wet werk en bijstand][ref1] en de [Wet educatie en beroepsonderwijs][ref2] en de daarop berustende
      bepalingen, zoals deze luidden op 31 december 2008, blijven van toepassing op uitkeringen op grond van de
      [artikelen 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref3] en op de rijksbijdrage op grond van
      [artikel 2.3.1 van de Wet educatie en beroepsonderwijs][ref4] over de jaren gelegen voor 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven omtrent de vaststelling van de rijksbijdrage die op grond
      van [artikel 52 van de Wet inburgering][ref1] is verleend over de jaren voor 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel52
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '52'
  - number: '15.3'
    text: |-
      Het deel van de uitkering op grond van [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1]
      voor het jaar 2008 dat op grond van de algemene maatregel van bestuur, bedoeld in
      [artikel 70, derde lid, van die wet][ref2], zoals deze luidde op 31 december 2008, wordt toegevoegd aan de
      uitkering van het daaropvolgende kalenderjaar, wordt toegevoegd aan de uitkering, bedoeld in [artikel 2][ref3] van
      deze wet, voor het jaar 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '70'
      - id: ref3
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.4'
    text: |-
      In afwijking van [artikel 2, tweede lid][ref1], wordt de uitkering voor het kalenderjaar 2009 binnen vier weken na
      de inwerkingtreding van deze wet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
        hoofdstuk: '2'
  - number: '16'
    text: Deze wet treedt in werking met ingang van 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet participatiebudget.'
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel17
