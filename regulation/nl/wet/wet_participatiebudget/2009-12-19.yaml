  - number: '2.1'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid verstrekt aan het college een uitkering ten behoeve van
      de kosten van participatievoorzieningen, niet zijnde uitvoeringskosten, voor de doelgroep alsmede voor de
      voorzieningen, bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel3
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '3'
        hoofdstuk: '2'
  - number: '2.2'
    text: De uitkering wordt vastgesteld in september voorafgaande aan het kalenderjaar waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
  - number: '2.3'
    text: |-
      Het bedrag van de uitkering is de som van de uitkomsten van drie berekeningen, elk op basis van een verdeelsleutel
      die bepaalt hoe het voor het kalenderjaar bij begrotingswet vast te stellen bedrag dat Onze Minister wie het
      aangaat beschikbaar heeft voor de uitkering wordt verdeeld over de colleges.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
  - number: '2.4'
    text: De verdeelsleutels worden bij of krachtens algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
  - number: '2.5'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de betaalbaarstelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
  - number: '2.6'
    text: |-
      Onder bij algemene maatregel van bestuur te bepalen voorwaarden kan een bij die algemene maatregel van bestuur
      te bepalen gedeelte van de uitkering worden aangewend voor andere kosten ten behoeve van de bevordering
      van participatie dan de kosten, bedoeld in het eerste lid, alsmede ten behoeve van de in dat lid bedoelde
      uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel2
  - number: '3.1'
    text: |-
      Het college kan aan personen uit de doelgroep opleidingen educatie, inburgeringsvoorzieningen,
      taalkennisvoorzieningen of re-integratievoorzieningen aanbieden respectievelijk ten behoeve van personen uit de
      doelgroep inburgeringsvoorzieningen of taalkennisvoorzieningen vaststellen. Daarbij geldt dat opleidingen educatie
      alleen kunnen worden aangeboden aan personen van achttien jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
  - number: '3.2'
    text: |-
      In aanvulling op het eerste lid kan het college re-integratievoorzieningen of opleidingen educatie
      aanbieden aan iedere in Nederland woonachtige vreemdeling van achttien jaar of ouder die krachtens
      [artikel 11, derde lid, van de Wet werk en bijstand][ref1] met een Nederlander wordt gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '11'
  - number: '3.3'
    text: |-
      In aanvulling op het eerste en tweede lid kan het college re-integratievoorzieningen aanbieden aan personen van
      16 of 17 jaar oud voor wie de leerplicht of kwalificatieplicht nog niet is geëindigd en ten aanzien van wie het
      college van oordeel is dat een leer-werktraject geraden is, voor zover deze re-integratievoorzieningen voorzien in
      de kosten van ondersteuning die nodig zijn bij een leer-werktraject voor die personen.
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
  - number: '3.4'
    text: 'Voor zover het college:'
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
  - number: 3.4.a
    text: |-
      een opleiding educatie aanbiedt, is de [Wet educatie en beroepsonderwijs][ref1] van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 3.4.b
    text: |-
      een inburgeringsvoorziening of een taalkennisvoorziening aanbiedt aan een inburgeringsplichtige of vaststelt ten
      behoeve van een inburgeringsplichtige als bedoeld in de [Wet inburgering][ref1] is de [Wet inburgering][ref2] van
      toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020611
      - id: ref2
        bwb_id: BWBR0020611
  - number: 3.4.c
    text: |-
      een inburgeringsvoorziening aanbiedt aan een inburgeraar als bedoeld
      in de [Regeling vrijwillige inburgering niet-G31 2007][ref1] of de
      [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref2]
      is de [Regeling vrijwillige inburgering niet-G31 2007][ref3] respectievelijk de
      [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref4] van toepassing; of


      [ref1]: https://wetten.overheid.nl/BWBR0020646
      [ref2]: https://wetten.overheid.nl/BWBR0018516
      [ref3]: https://wetten.overheid.nl/BWBR0020646
      [ref4]: https://wetten.overheid.nl/BWBR0018516
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020646
      - id: ref2
        bwb_id: BWBR0018516
      - id: ref3
        bwb_id: BWBR0020646
      - id: ref4
        bwb_id: BWBR0018516
  - number: 3.4.d
    text: |-
      een re-integratievoorziening aanbiedt aan een persoon als bedoeld in
      [artikel 7, eerste lid, onderdeel a, of derde lid, tweede zin, van de Wet werk en bijstand][ref1],
      [artikel 34, eerste lid, onderdeel a, van de IOAW][ref2], of
      [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref3], is de [Wet werk en bijstand][ref4], de [IOAW][ref5],
      respectievelijk de [IOAZ][ref6], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0015703
      [ref5]: https://wetten.overheid.nl/BWBR0004044
      [ref6]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#Artikel3
    references:
      - id: ref1
