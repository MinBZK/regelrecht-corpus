preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat het WWB-werkdeel, inburgeringsbudgetten voor zover
    deze betrekking hebben op de inburgeringsvoorzieningen en de middelen voor volwasseneneducatie worden gebundeld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025039/2009-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *college:* college van burgemeester en
      wethouders;
        - *doelgroep:* 1°. iedere in Nederland woonachtige Nederlander van achttien jaar of ouder, 2°. iedere in
      Nederland woonachtige vreemdeling van achttien jaar of ouder die rechtmatig in Nederland verblijf houdt in de
      zin van [artikel 8, onderdelen a tot en met e dan wel l, van de Vreemdelingenwet 2000][ref1], en 3°. iedere in
      Nederland woonachtige persoon van zeventien jaar of jonger die heeft voldaan aan de kwalificatieplicht, bedoeld
      in [paragraaf 2a van de Leerplichtwet 1969][ref2], dan wel aan wie een vrijstelling van die kwalificatieplicht
      is verleend;
        - *inburgeringsvoorziening:* inburgeringsvoorziening als bedoeld
      in [artikel 19, derde lid, van de Wet inburgering][ref3],
      [artikel 4 van de Regeling vrijwillige inburgering niet-G31 2007][ref4] en
      [artikel 13b van de Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref5];
        - *IOAW:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6];
        - *IOAZ:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7];
        - *Onze Ministers:* Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van Onderwijs, Cultuur en
      Wetenschap en Onze Minister voor Wonen, Wijken en Integratie;
        - *opleiding educatie:* opleiding als bedoeld in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref8];
        - *participatievoorziening:* opleiding educatie, inburgeringsvoorziening, taalkennisvoorziening of re-
      integratievoorziening;
        - *re-integratievoorziening:* voorziening, waaronder begrepen sociale activering als bedoeld in
      [artikel 6, eerste lid, onderdeel c, van de Wet werk en bijstand][ref9], gericht op arbeidsinschakeling als
      bedoeld in [artikel 6, eerste lid, onderdeel b, juncto tweede lid, van de Wet werk en bijstand][ref10], alsmede een
      werkleeraanbod als bedoeld in [artikel 13, eerste lid, van de Wet investeren in jongeren][ref11];
        - *regionaal opleidingencentrum:* een instelling als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref12];
        - *taalkennisvoorziening:* taalkennisvoorziening als bedoeld in
      [artikel 19, derde lid, van de Wet inburgering][ref13].


