  - number: XVI.1
    text: |-
      De door de bedrijfsvereniging teruggevorderde bonusuitkeringen en de door de werkgever nog te betalen
      geldelijke bijdragen, die betrekking hebben op perioden gelegen vóór de datum van inwerkingtreding van
      [artikel I, onderdeel F, van deze wet][ref1], komen ten gunste van het Arbeidsongeschiktheidsfonds als bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007634#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0007634
        artikel: I
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '72'
  - number: XVI.2
    text: |-
      De door de bedrijfsvereniging nog te betalen bonusuitkeringen en de door de bedrijfsvereniging te verlenen
      restitutie van geldelijke bijdragen die betrekking hebben op perioden gelegen vóór de datum van inwerkingtreding
      van [artikel I, onderdeel F, van deze wet][ref1], komen ten laste van het Arbeidsongeschiktheidsfonds als bedoeld
      in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007634#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0007634
        artikel: I
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '72'
  - number: XVI.3
    text: |-
      De door het Fonds arbeidsongeschiktheidsverzekering overheidspersoneel, bedoeld in
      [artikel 21, eerste lid, van de Wet financiële voorzieningen privatisering ABP][ref1], met toepassing van
      [artikel 51 van de Wet privatisering ABP][ref2] teruggevorderde bonusuitkeringen en de door de werkgevers nog te
      betalen geldelijke bijdragen, bedoeld in dat artikel, die betrekking hebben op perioden gelegen voor de datum van
      inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref3], komen ten gunste van het vorengenoemde Fonds
      arbeidsongeschiktheidsverzekering overheidspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0007634#ArtikelI
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0007634
        artikel: I
        hoofdstuk: I
  - number: XVI.4
    text: |-
      De door het in het derde lid genoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel met toepassing van
      [artikel 51 van de Wet privatisering ABP][ref1] nog te betalen bonusuitkeringen als bedoeld in dat artikel, alsmede
      de door het vorengenoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel met toepassing van dat artikel
      nog te verlenen restitutie van geldelijke bijdragen als bedoeld in dat artikel, die betrekking hebben op perioden
      gelegen voor de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref2], komen ten laste van
      het vorengenoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0007634#ArtikelI
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0007634
        artikel: I
        hoofdstuk: I
  - number: XVII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVII
  - number: XVIII
    text: 'Deze wet wordt aangehaald als: Wet afschaffing malus en bevordering reïntegratie.'
    url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelXVIII
