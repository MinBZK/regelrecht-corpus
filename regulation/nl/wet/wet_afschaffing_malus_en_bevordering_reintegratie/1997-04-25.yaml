preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de bepalingen inzake het toekennen van
    bonusuitkeringen en opleggen van geldelijke bijdragen aan werkgevers, neergelegd in hoofdstuk IIIB van de Algemene
    Arbeidsongeschiktheidswet, af te schaffen, alsmede in de Wet op de arbeidsongeschiktheidsverzekering en de
    Werkloosheidswet bepalingen op te nemen ter bevordering van de reïntegratie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007634/1997-04-25#ArtikelAanhef
articles:
  - number: XIII
    text: |-
      Paragraaf 1 van hoofdstuk IIIB van de Algemene Arbeidsongeschiktheidswet, zoals deze paragraaf luidde vóór de datum
      van inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref1], blijft van kracht voor bonusuitkeringen als
      bedoeld in die paragraaf:

      a. die vóór de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet ][ref2]door de
      bedrijfsvereniging zijn toegekend,

      b. die vóór de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet ][ref3]zijn aangevraagd en
      betrekking hebben op een vóór die datum aangegane dienstbetrekking, doch die eerst op of na die datum door de
      bedrijfsvereniging worden toegekend,

      c. die op of na de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet ][ref4]worden
      aangevraagd, betrekking hebben op een vóór die datum aangegane dienstbetrekking en tot het toekennen waarvan de
      bedrijfsvereniging bevoegd is.


