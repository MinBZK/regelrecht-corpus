  - number: XVI
    text: |-
      1 De door de bedrijfsvereniging teruggevorderde bonusuitkeringen en de door de werkgever nog te betalen
      geldelijke bijdragen, die betrekking hebben op perioden gelegen vóór de datum van inwerkingtreding van
      [artikel I, onderdeel F, van deze wet][ref1], komen ten gunste van het Arbeidsongeschiktheidsfonds als bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2].

      2 De door de bedrijfsvereniging nog te betalen bonusuitkeringen en de door de bedrijfsvereniging te verlenen
      restitutie van geldelijke bijdragen die betrekking hebben op perioden gelegen vóór de datum van inwerkingtreding
      van [artikel I, onderdeel F, van deze wet][ref3], komen ten laste van het Arbeidsongeschiktheidsfonds als bedoeld
      in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref4].

      3 De door het Fonds arbeidsongeschiktheidsverzekering overheidspersoneel, bedoeld in
      [artikel 21, eerste lid, van de Wet financiële voorzieningen privatisering ABP][ref5], met toepassing van
      [artikel 51 van de Wet privatisering ABP][ref6] teruggevorderde bonusuitkeringen en de door de werkgevers nog te
      betalen geldelijke bijdragen, bedoeld in dat artikel, die betrekking hebben op perioden gelegen voor de datum van
      inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref7], komen ten gunste van het vorengenoemde Fonds
      arbeidsongeschiktheidsverzekering overheidspersoneel.

      4 De door het in het derde lid genoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel met toepassing
      van [artikel 51 van de Wet privatisering ABP][ref8] nog te betalen bonusuitkeringen als bedoeld in dat artikel,
      alsmede de door het vorengenoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel met toepassing van
      dat artikel nog te verlenen restitutie van geldelijke bijdragen als bedoeld in dat artikel, die betrekking hebben
      op perioden gelegen voor de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref9], komen ten
      laste van het vorengenoemde Fonds arbeidsongeschiktheidsverzekering overheidspersoneel.


