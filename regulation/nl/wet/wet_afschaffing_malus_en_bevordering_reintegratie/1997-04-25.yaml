  - number: XV
    text: |-
      Paragraaf 3 van hoofdstuk IIIB van de Algemene Arbeidsongeschiktheidswet, zoals deze paragraaf luidde vóór de datum
      van inwerkingtreding van [artikel I, onderdeel F, van deze wet][ref1], met uitzondering van artikel 59, blijft van
      kracht voor loonkostensubsidies als bedoeld in die paragraaf:

      a. die vóór de datum van inwerkingtreding van [artikel I, onderdeel F][ref2], van deze wet door de
      bedrijfsvereniging zijn toegekend,

      b. die vóór de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet ][ref3]zijn aangevraagd en
      betrekking hebben op

      1°. een dienstbetrekking als bedoeld in artikel 59*n*, eerste lid, onderdeel *a*, van de Algemene
      Arbeidsongeschiktheidswet die vóór die datum is aangegaan dan wel

      2°. op het laten verrichten van arbeid in een aangepaste dan wel in een andere functie als bedoeld in artikel
      59*n*, eerste lid, onderdeel *b*, van die wet, indien de aanvang van die werkzaamheden vóór die datum is gelegen,
      doch die eerst op of na die datum door de bedrijfsvereniging worden toegekend,

      c. die op of na de datum van inwerkingtreding van [artikel I, onderdeel F, van deze wet ][ref4]worden aangevraagd
      en betrekking hebben op een dienstbetrekking als bedoeld in artikel 59*n*, eerste lid, onderdeel *a*, van de
      Algemene Arbeidsongeschiktheidswet die vóór die datum is aangegaan of op het laten verrichten van arbeid in een
      aangepaste dan wel in een andere functie als bedoeld in artikel 59*n*, eerste lid, onderdeel *b*, van die wet,
      indien de aanvang van die werkzaamheden vóór die datum is gelegen.


