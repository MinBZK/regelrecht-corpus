  - number: 15.1.l
    text: |-
      krachtens de Ruilverkavelingswet 1954, de [Reconstructiewet Midden-Delfland][ref1], de
      [Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref2], de [Landinrichtingswet][ref3] en de
      [Reconstructiewet concentratiegebieden][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003094
      [ref2]: https://wetten.overheid.nl/BWBR0003143
      [ref3]: https://wetten.overheid.nl/BWBR0003793
      [ref4]: https://wetten.overheid.nl/BWBR0013399
