preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving betreffende de registratie- en de
    zegelbelasting te vervangen door een meer overzichtelijke en aanzienlijk vereenvoudigde nieuwe wettelijke regeling,
    welke is aangepast aan de Algemene wet inzake rijksbelastingen (Stb. 1959, 301) en aan de richtlijn van de Raad van
    de Europese Gemeenschappen van 17 juli 1969 betreffende de indirecte belastingen op het bijeenbrengen van kapitaal
    (Publikatieblad van 3 oktober 1969);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel1
  - number: 1.a
    text: een overdrachtsbelasting;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel1
  - number: 1.b
    text: een assurantiebelasting;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel1
  - number: 1.c
    text: een kapitaalsbelasting.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onder de naam 'overdrachtsbelasting' wordt een belasting geheven ter zake van de verkrijging van in Nederland
      gelegen onroerende zaken of van rechten waaraan deze zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van deze wet wordt onder verkrijging mede begrepen de verkrijging van de economische eigendom.
      Onder economische eigendom wordt verstaan een samenstel van rechten en verplichtingen met betrekking tot de in
      het eerste lid bedoelde onroerende zaken of rechten waaraan deze zijn onderworpen, dat een belang bij die zaken of
      rechten vertegenwoordigt. Het belang omvat ten minste enig risico van waardeverandering en komt toe aan een ander
      dan de eigenaar of beperkt gerechtigde. De verkrijging van uitsluitend het recht op levering wordt niet aangemerkt
      als verkrijging van economische eigendom.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel2
  - number: '3.1'
    text: 'Als verkrijging wordt niet aangemerkt die krachtens:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel3
  - number: 3.1.a
    text: boedelmenging, erfrecht of verjaring;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel3
  - number: 3.1.b
    text: |-
      verdeling van een huwelijksgemeenschap of nalatenschap, waarin de verkrijger was gerechtigd als rechtverkrijgende
      onder algemene titel;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel3
  - number: 3.1.c
    text: |-
      natrekking van een zaak op het tijdstip waarop die zaak wordt aangebracht op, aan of in een onroerende
      zaak, tenzij van die zaak omzetbelasting wordt geheven ter zake van de levering en de vergoeding, bedoeld
      in [artikel 8, eerste lid, van de Wet op de omzetbelasting 1968][ref1], te zamen met de verschuldigde
      omzetbelasting, lager is dan de waarde, bedoeld in [artikel 9][ref2], dan wel omzetbelasting wordt
      geheven ter zake van het beschikken over die zaak voor bedrijfsdoeleinden en de vergoeding, bedoeld in
      [artikel 8, derde lid, van de Wet op de omzetbelasting 1968][ref3], te zamen met de verschuldigde omzetbelasting,
      lager is dan de waarde, bedoeld in [artikel 9][ref4], en de verkrijger die omzetbelasting op grond van
      [artikel 15 van die wet][ref5] niet of niet nagenoeg geheel in aftrek kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002740#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel3
    references:
      - id: ref1
