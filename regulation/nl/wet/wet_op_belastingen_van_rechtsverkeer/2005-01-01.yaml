        artikel: '1'
  - number: 15.1.v
    text: |-
      van landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden waarop de
      [Landinrichtingswet][ref1] niet van toepassing is - daaronder begrepen de rechten van erfpacht of beklemming
      daarop - bij hervestiging van het landbouwbedrijf van de verkrijger, indien landerijen en als kweek- of teeltmiddel
      gebruikte ondergrond van glasopstanden waarop de [Landinrichtingswet][ref2] van toepassing is, worden afgestaan.
      Deze bepaling is van toepassing voor zover de belasting is verschuldigd over een bedrag gelijk aan de - met
      overeenkomstige toepassing van [artikel 11][ref3] bepaalde - waarde van de afgestane landerijen en van de als
      kweek- of teeltmiddel gebruikte ondergrond van glasopstanden;


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0003793
      [ref3]: https://wetten.overheid.nl/BWBR0002740#Artikel11
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0003793
      - id: ref3
        bwb_id: BWBR0002740
        artikel: '11'
        hoofdstuk: II
        afdeling: '2'
  - number: 15.1.w
    text: |-
      van landerijen en van ondergrond van glasopstanden - daaronder begrepen de rechten van erfpacht of beklemming
      daarop - bij hervestiging van een glastuinbouwbedrijf door de verkrijger indien de door hem afgestane landerijen en
      ondergrond van glasopstanden worden aangewend ter verbetering van de bedrijfsstructuur van het glastuinbouwbedrijf
      van de verkrijger van die afgestane gronden. Deze bepaling is van toepassing voor zover de belasting is
      verschuldigd over een bedrag gelijk aan de - met overeenkomstige toepassing van [artikel 11][ref1] bepaalde
        - waarde van de afgestane landerijen en ondergrond van de glasopstanden, in bij regeling van Onze Minister in
      overeenstemming met de Minister van Landbouw, Visserij en Natuurbeheer aan te wijzen gevallen en onder daarbij te
      stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel11
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
