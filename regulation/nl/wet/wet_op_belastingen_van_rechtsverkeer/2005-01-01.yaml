        bwb_id: BWBR0002740
        artikel: '11'
        hoofdstuk: II
        afdeling: '2'
  - number: 15.1.t
    text: |-
      van landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden - daaronder begrepen
      de rechten van erfpacht of beklemming daarop - bij hervestiging van het landbouwbedrijf van de verkrijger
      indien de afgestane landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden door
      overheidsbeleid inzake de ontwikkeling van de natuurlijke en landschappelijke waarden of de ruimtelijke ordening
      voortaan of waarschijnlijk binnenkort buiten het kader van de uitoefening van een landbouwbedrijf zullen worden
      aangewend, voor zover de belasting is verschuldigd over een bedrag gelijk aan de - met overeenkomstige toepassing
      van [artikel 11][ref1] bepaalde - waarde van die afgestane landerijen en van de als kweek- of teeltmiddel gebruikte
      ondergrond van glasopstanden, in bij regeling van Onze Minister in overeenstemming met Onze Ministers van Landbouw,
      Natuurbeheer en Visserij en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan te wijzen gevallen
      en onder daarbij te stellen voorwaarden. Voor de toepassing van deze bepaling wordt de waarde van de afgestane
      landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden bepaald zonder rekening te
      houden met de omstandigheid dat de grond voortaan of waarschijnlijk binnenkort buiten het kader van de uitoefening
      van het landbouwbedrijf zal worden aangewend;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel11
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '11'
        hoofdstuk: II
        afdeling: '2'
  - number: 15.1.u
    text: |-
      door Staatsbosbeheer van objecten, als bedoeld in
      [artikel 1, onderdeel e, van de Wet verzelfstandiging Staatsbosbeheer][ref1], niet zijnde bedrijfsondersteunende
      onroerende zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel1
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
