  - number: '15.2'
    text: |-
      Ingeval bodembestanddelen als bedoeld in het eerste lid, onderdeel j, of de waarde daarvan alsnog aan de verkrijger
      ten goede komen, wordt zulks beschouwd als een verkrijging in de zin van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '15.3'
    text: |-
      Verwijdering van zaken die ingevolge een beding of krachtens de wet nog na de verkrijging mogen worden weggenomen
      wordt, indien die verwijdering plaatsvindt binnen drie maanden na de verkrijging, ten aanzien van die zaken
      beschouwd als de vervulling van een aan de verkrijging verbonden ontbindende voorwaarde, mits zij of hun waarde
      niet aan de verkrijger zijn ten goede gekomen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
  - number: '15.4'
    text: |-
      De in het eerste lid bedoelde vrijstellingen zijn niet van toepassing in gevallen waarin de verkrijging plaatsvindt
      krachtens een levering of dienst in de zin van de [Wet op de omzetbelasting 1968][ref1] ter zake waarvan
      omzetbelasting is verschuldigd, indien de vergoeding, bedoeld in [artikel 8, eerste lid, van die wet][ref2], te
      zamen met de verschuldigde omzetbelasting, lager is dan de waarde, bedoeld in [artikel 9][ref3], en de verkrijger
      de omzetbelasting op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref4] niet of niet nagenoeg
      geheel in aftrek kan brengen. Voor de toepassing van deze bepaling wordt de waarde ten minste gesteld op de
      kostprijs van de onroerende zaak of van de zaak waarop het recht of de dienst betrekking heeft, met inbegrip van
      de omzetbelasting, zoals die zou ontstaan bij de voortbrenging door een onafhankelijke derde op het tijdstip van
      de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002740#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002740
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '15.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel e, onder 1°, wordt onder waarde van het vermogen van de
      ingebrachte onderneming mede verstaan de boekwaarde van dat vermogen, zoals die geldt voor de heffing van
      inkomstenbelasting of vennootschapsbelasting, in gevallen waarin de ondernemer inbrengt met voorbehoud van stille
      reserves.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
  - number: '16'
    text: De belasting wordt geheven van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel16
  - number: '17'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld welke ertoe strekken, dat de belasting ter zake van een
      verkrijging waarvan een notariële akte is opgemaakt, wordt voldaan ter gelegenheid van de aanbieding van die akte
      ter registratie.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel18
  - number: '19.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend, indien de toestand van vóór de verkrijging zowel feitelijk
      als rechtens wordt hersteld als gevolg van:
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
  - number: 19.1.a
    text: de vervulling van een ontbindende voorwaarde;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
  - number: 19.1.b
    text: nietigheid of vernietiging;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
  - number: 19.1.c
    text: |-
      ontbinding wegens niet-nakoming van een verbintenis. Indien in de gevallen als zijn bedoeld onder *a* en *b* een
      akte in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], is
      ingeschreven, wordt zodanig herstel in geen geval aanwezig geacht voor de inschrijving van een verklaring, akte of
      rechterlijke uitspraak waarbij de vervulling van de voorwaarde, de nietigheid of de vernietiging wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '19.2'
    text: |-
      Het verzoek om teruggaaf geschiedt door het doen van aangifte binnen drie maanden na afloop van het kalenderjaar
      waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
  - number: '19.3'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
  - number: '19.4'
    text: |-
      Een verkrijging ten aanzien waarvan op grond van het eerste lid teruggaaf van de belasting wordt verleend, blijft
      buiten beschouwing voor de toepassing van [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
        hoofdstuk: II
        afdeling: '2'
  - number: '20'
    text: |-
      Onder de naam 'assurantiebelasting' wordt een belasting geheven ter zake van verzekeringen waarvan het risico in
      Nederland is gelegen en ter zake van daarmee samenhangende diensten.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het risico van de verzekering is in Nederland gelegen indien de verzekeringnemer in Nederland woont, of, ingeval de
      verzekeringnemer een rechtspersoon is, indien de vestiging van deze rechtspersoon waarop de verzekering betrekking
      heeft zich in Nederland bevindt.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het risico van de verzekering is voor zover het eerste lid niet van toepassing is, voorts in Nederland gelegen
      indien de verzekering betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: 21.2.a
    text: |-
      in Nederland gelegen onroerende zaken, alsmede de zich daarin bevindende roerende zaken, met uitzondering van voor
      doorvoer bestemde handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: 21.2.b
    text: |-
      motorrijtuigen welke zijn ingeschreven in het krachtens de [Wegenverkeerswet 1994][ref1] aangehouden register van
      opgegeven kentekens;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 21.2.c
    text: |-
      schepen welke teboekstaan in het register, bedoeld in [artikel 193][ref1] of
      [artikel 783 van Boek 8 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel783
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '783'
  - number: 21.2.d
    text: |-
      luchtvaartuigen welke teboekstaan in het register, bedoeld in
      [artikel 1302 van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1302
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1302'
  - number: 21.2.e
    text: |-
      tijdens een reis of vakantie gelopen risico's, indien de verzekering in Nederland is gesloten en een looptijd heeft
      van vier maanden of minder.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid is het risico van de verzekering niet in Nederland gelegen indien de verzekering
      betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: 21.3.a
    text: |-
      in een andere lid-staat van de Europese Unie gelegen onroerende zaken, alsmede de zich daarin bevindende roerende
      zaken, met uitzondering van voor doorvoer bestemde handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: 21.3.b
    text: in een andere lid-staat van de Europese Unie geregistreerde voer- en vaartuigen van om het even welke aard;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: 21.3.c
    text: |-
      tijdens een reis of vakantie gelopen risico's, indien de verzekering in een andere lid-staat van de Europese Unie
      is gesloten en een looptijd heeft van vier maanden of minder.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: '21.4'
    text: |-
      Onder vestiging, bedoeld in het eerste lid, wordt verstaan: de hoofdvestiging van de rechtspersoon en elke andere
      duurzame aanwezigheid van die rechtspersoon in welke vorm dan ook.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel21
  - number: '22.1'
    text: |-
      De belasting wordt berekend over de premie, alsmede over de vergoeding voor met de verzekering samenhangende
      diensten.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel22
  - number: '22.2'
    text: |-
      Onder premie wordt verstaan het totale bedrag dat - of voor zover de tegenprestatie niet in een geldsom bestaat,
      de totale waarde van de tegenprestatie welke - in verband met de verzekering in rekening wordt gebracht, de
      assurantiebelasting niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel22
  - number: '23'
    text: De belasting bedraagt 7 percent.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel23
  - number: '24.1'
    text: 'Van de belasting zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.a
    text: levensverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.b
    text: ongevallen-, invaliditeits- en arbeidsongeschiktheidsverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.c
    text: ziekte- en ziektekostenverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.d
    text: werkloosheidsverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.e
    text: |-
      verzekeringen van zeeschepen, met uitzondering van pleziervaartuigen, alsmede verzekeringen van luchtvaartuigen
      welke hoofdzakelijk als openbaar vervoermiddel in het internationale verkeer zullen worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.f
    text: transportverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.g
    text: herverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: 24.1.h
    text: exportkredietverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: '24.2'
    text: |-
      Indien een samengestelde verzekering een of meer vrijgestelde verzekeringen omvat, wordt de vrijstelling toegepast
      op het aan die vrijgestelde verzekeringen toe te rekenen gedeelte van de premie.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel24
  - number: '25.1'
    text: |-
      De belasting ter zake van verzekeringen welke zijn gesloten door tussenkomst van een door Onze
      Minister aangewezen tussenpersoon, die als zodanig is ingeschreven in het register, bedoeld in
      [artikel 3, eerste lid, van de Wet assurantiebemiddelingsbedrijf][ref1] met de vermelding dat hij voldoet aan de
      in [artikel 4, eerste lid, onderdeel ][ref2] bedoelde vakbekwaamheidseisen, wordt geheven van die tussenpersoon,
      indien hij ter zake van de verzekering de premie int of doet innen en bovendien:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '4'
  - number: 25.1.1°
    text: |-
      de verzekering is gesloten bij een gevolmachtigd agent als bedoeld in de [Wet assurantiebemiddelingsbedrijf][ref1];
      of


      [ref1]: https://wetten.overheid.nl/BWBR0004993
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004993
  - number: 25.1.2°
    text: het risico dat de verzekering dekt krachtens één polis, wordt gedragen door ten minste twee verzekeraars; of
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: 25.1.3°
    text: |-
      de tussenpersoon jegens de verzekeraar aansprakelijk is voor de verschuldigde premie en de polis of het aanhangsel
      van de polis niet door de verzekeraar is of wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: '25.2'
    text: |-
      De belasting ter zake van verzekeringen welke zijn gesloten bij een gevolmachtigd agent als bedoeld in de
      [Wet assurantiebemiddelingsbedrijf][ref1] wordt steeds geheven van de agent, tenzij het eerste lid van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0004993
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004993
  - number: '25.3'
    text: |-
      De belasting wordt geheven van de tussenpersoon, indien en voor zover deze de vergoeding ontvangt van een ander
      dan de verzekeraar die in Nederland is gevestigd. Deze belastingplicht strekt zich niet verder uit dan tot die
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: '25.4'
    text: |-
      Indien het eerste, tweede en derde lid geen toepassing kunnen vinden, wordt de belasting geheven van de
      verzekeraar, ingeval deze in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: '25.5'
    text: |-
      Ingeval de verzekeraar niet in Nederland is gevestigd en het eerste en tweede lid geen toepassing kunnen vinden,
      wordt de belasting geheven van de vertegenwoordiger, bedoeld in [artikel 1, eerste lid, onderdeel ][ref1], al
      naar gelang die vertegenwoordiger de verzekering voor of namens de verzekeraar heeft gesloten. Indien er niet een
      dergelijke vertegenwoordiger is, wordt de belasting geheven van de in Nederland wonende of gevestigde tussenpersoon
      als bedoeld in de [Wet assurantiebemiddelingsbedrijf][ref2], door wiens bemiddeling de verzekering is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004993
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004993
  - number: '25.6'
    text: |-
      Indien het eerste, tweede, derde en vijfde lid geen toepassing kunnen vinden is de verzekeraar die niet in
      Nederland woont of is gevestigd gehouden een fiscaal vertegenwoordiger aan te stellen die in Nederland woont of
      gevestigd is. De belasting wordt in dat geval geheven van die fiscaal vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: '25.7'
    text: Ingeval de vorige leden geen toepassing kunnen vinden, wordt de belasting geheven van de verzekeringnemer.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25
  - number: 25a.1
    text: |-
      De fiscaal vertegenwoordiger, bedoeld in [artikel 25, zesde lid][ref1], dient in het bezit te zijn van een
      vergunning van de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: 25a.2
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens
      die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij het verzoek wordt een verklaring overgelegd van de in [artikel 25, zesde lid][ref1], bedoelde verzekeraar,
      waaruit blijkt dat deze degene die het verzoek indient, machtigt op te treden als zijn fiscaal vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: 25a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen,
      wijzigen en intrekken van de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel25a
  - number: '26'
    text: De belasting wordt verschuldigd op het tijdstip waarop de premie vervalt.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel26
  - number: '27'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel27
  - number: '28'
    text: |-
      In de gevallen bedoeld in [artikel 25, eerste tot en met vijfde lid][ref1], wordt het risico van de verzekering
      geacht in Nederland te zijn gelegen, tenzij aan de hand van boeken of bescheiden het tegendeel wordt aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: '29.1'
    text: |-
      Voor zover de premie niet is en niet zal worden ontvangen, dan wel wordt terugbetaald, wordt de belasting verrekend
      met die welke is verschuldigd geworden in het tijdvak waarin het recht op verrekening is ontstaan. Ingeval de voor
      verrekening in aanmerking komende belasting meer bedraagt dan de in het tijdvak verschuldigd geworden belasting,
      wordt het verschil op verzoek teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel29
  - number: '29.2'
    text: Het verzoek om teruggaaf geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel29
  - number: '29.3'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel29
  - number: '30'
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van deze wet of van een wijziging daarvan gesloten verzekering
      premies int of doet innen, is bevoegd hetgeen van hem wegens assurantiebelasting over die premies meer is gevorderd
      dan vóór die inwerkingtreding had kunnen geschieden, terug te vorderen van de verzekeringnemer. Hiermede strijdige
      bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel30
  - number: '31'
    text: |-
      De verzekeringnemer die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake
      assurantiebelasting gesloten verzekering premies voldoet, is bevoegd van hem aan wie de premies worden
      voldaan, terug te vorderen hetgeen wegens assurantiebelasting over die premies minder is gevorderd dan vóór die
      inwerkingtreding had kunnen geschieden. Hiermede strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onder de naam 'kapitaalsbelasting' wordt een belasting geheven ter zake van het bijeenbrengen van in aandelen
      verdeeld kapitaal in in Nederland gevestigde lichamen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel32
  - number: '32.2'
    text: Onder lichamen worden verstaan verenigingen, andere rechtspersonen, vennootschappen en doelvermogens.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel32
  - number: '32.3'
    text: |-
      Als lichamen worden niet aangemerkt fondsen ter verkrijging van voordelen voor de deelgerechtigden door het voor
      gemene rekening beleggen of anderszins aanwenden van gelden, indien na de instelling van het fonds toekenning van
      rechten van deelneming aan anderen dan deelgerechtigden of hun bloed- en aanverwanten in de rechte linie, alsmede
      vervreemding van rechten van deelneming aan anderen dan het fonds, deelgerechtigden en bedoelde verwanten is
      uitgesloten, dan wel voor die toekenning en vervreemding de toestemming van alle deelgerechtigden is vereist.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel32
  - number: '33'
    text: |-
      Een buiten de lid-staten van de Europese Unie gevestigd lichaam waarvan de statutaire zetel zich in Nederland
      bevindt, wordt geacht in Nederland te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel33
  - number: '34'
    text: 'Onder het bijeenbrengen van in aandelen verdeeld kapitaal wordt begrepen:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
  - number: 34.a
    text: |-
      de omzetting op de voet van [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] in een rechtsvorm met een in
      aandelen verdeeld kapitaal;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 34.b
    text: |-
      het toekennen van of het bijschrijven op aandelen zonder storting, voor zover het bedrag waarvoor de toekenning of
      de bijschrijving plaatsvindt, niet reeds in een van de lid-staten van de Europese Unie met een kapitaalsbelasting
      was belast;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
  - number: 34.c
    text: |-
      het bijeenbrengen van kapitaal waartegenover winstbewijzen, oprichtersbewijzen en dergelijke worden toegekend,
      welke recht geven op een aandeel in de winst of in het bij de ontbinding en vereffening aanwezige overschot;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
  - number: 34.d
    text: |-
      het verkrijgen van kapitaal van een aandeelhouder of een houder van winstbewijzen, oprichtersbewijzen en
      dergelijke, zonder uitdrukkelijke toekenning van de onder onderdeel *c* bedoelde rechten;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
  - number: 34.e
    text: |-
      het zich vestigen in Nederland van een lichaam, tenzij dat lichaam in een van de lid-staten van de Europese Unie
      was gevestigd of zijn statutaire zetel had.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34
  - number: 34a.1
    text: |-
      Onder het bijeenbrengen van in aandelen verdeeld kapitaal wordt bij een lichaam met een in aandelen
      verdeeld kapitaal niet begrepen de levering van aandelen in het kader van een optieverplichting
      jegens een werknemer van de eigen vennootschap of van een verbonden vennootschap als bedoeld in
      [artikel 10a, zesde lid, van de Wet op de loonbelasting 1964][ref1], waarbij deze aandelen door de vennootschap
      eerder zijn verworven met het oog op de nakoming van de optieverplichting. De eerste volzin is van overeenkomstige
      toepassing met betrekking tot de levering van aandelen die eerder zijn verworven met het oog op de nakoming van een
      optieverplichting bij een levering die plaats vindt binnen drie maanden na het tenietgaan van de optieverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 34a.2
    text: |-
      Voor de toepassing van dit artikel wordt onder een optieverplichting verstaan een verplichting die de tegenhanger
      is van een recht om een of meer aandelen of daarmee gelijk te stellen rechten te verwerven, of van een recht dat
      daarmee gelijk te stellen is.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel34a
  - number: '35.1'
    text: |-
      De belasting wordt berekend over de waarde van hetgeen is ingebracht na aftrek van de door het
      lichaam op zich genomen verplichtingen, dan wel over de nominale waarde van de aandelen, indien
      deze hoger is. In de gevallen, bedoeld in [artikel 3.65 van de Wet inkomstenbelasting 2001][ref1] en
      [artikel 14 van de Wet op de vennootschapsbelasting 1969][ref2], wordt tot de door het lichaam op zich genomen
      verplichtingen mede gerekend de vennootschapsbelasting welke het lichaam verschuldigd kan worden ter zake van in
      het vermogen van de overgenomen onderneming begrepen reserves; deze belasting wordt gesteld op 20 percent van het
      bedrag van die reserves na aftrek van bij het lichaam aanwezige compensabele verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '14'
  - number: '35.2'
    text: |-
      In het geval, bedoeld in [artikel 34, onderdeel ][ref1], wordt de belasting berekend over het bedrag waarvoor
      toekenning van of bijschrijving op aandelen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel34
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '34'
        hoofdstuk: IV
        afdeling: '1'
  - number: '35.3'
    text: |-
      In het geval, bedoeld in [artikel 34, onderdeel ][ref1], wordt de belasting berekend over de waarde van de
      bezittingen na aftrek van de schulden van het lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel34
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '34'
        hoofdstuk: IV
        afdeling: '1'
  - number: '35.4'
    text: |-
      In het geval van toekenning van een aandelenoptierecht aan een werknemer wordt als gestort aangemerkt het bedrag,
      bedoeld in [artikel 9, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1] vermeerderd met het bedrag
      dat de werknemer ter zake in rekening wordt gebracht, en wordt als tijdstip van storting aangemerkt het tijdstip,
      bedoeld in genoemd [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '9'
  - number: '35.5'
    text: |-
      Voor de effecten die zijn opgenomen in een prijscourant, aangewezen krachtens [artikel 5.21 van Wet
      inkomstenbelasting 2001](onbekend), wordt de waarde in het economische verkeer gesteld op de slotnotering die is
      vermeld in de prijscourant die betrekking heeft op de dag waarnaar de waarde moet worden bepaald, dan wel, indien
      geen prijscourant betrekking heeft op die dag, de slotnotering die is vermeld in de prijscourant die betrekking
      heeft op de laatste beursdag voorafgaande aan de dag waarnaar de waarde moet worden bepaald.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel35
  - number: '36'
    text: De belasting bedraagt 0,55 percent.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel36
  - number: '37.1'
    text: |-
      Onder door Ons bij algemene maatregel van bestuur vast te stellen voorwaarden is van de belasting vrijgesteld het
      bijeenbrengen van kapitaal:
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.1.a
    text: in geval van fusie, splitsing en interne reorganisatie;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.1.b
    text: ten gevolge van de omzetting van een lichaam met een in aandelen verdeeld kapitaal in een ander zodanig lichaam;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.1.c
    text: |-
      door lichamen met een ten algemenen nutte strekkend doel, indien volgens de statuten uitsluitend publiekrechtelijke
      lichamen houders van de aandelen kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: '37.2'
    text: 'De vrijstelling, bedoeld in het eerste lid, letter *a*, is slechts van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.2.a
    text: |-
      een lichaam met een in aandelen verdeeld kapitaal tegen toekenning van eigen aandelen uitsluitend aandelen in een
      ander zodanig lichaam verwerft en daarbij ten minste 75 percent van de aandelen in dat lichaam verwerft dan wel een
      bezit van 75 percent of meer uitbreidt;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.2.b
    text: |-
      een lichaam met een in aandelen verdeeld kapitaal tegen toekenning van eigen aandelen uitsluitend het gehele
      vermogen, dan wel de gehele onderneming of een zelfstandig onderdeel daarvan van een ander zodanig lichaam
      verwerft;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.2.c
    text: |-
      een tot een concern behorend lichaam met een in aandelen verdeeld kapitaal tegen toekenning van eigen aandelen
      uitsluitend alle bedrijfsmiddelen van gelijke aard van de andere zodanige lichamen van dat concern verwerft;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: 37.2.d
    text: |-
      sprake is van een splitsing van een lichaam met een in aandelen verdeeld kapitaal waarbij vermogen onder algemene
      titel overgaat, behoudens indien de splitsing in overwegende mate is gericht op het ontgaan of uitstellen van
      belastingheffing. De splitsing wordt, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate
      te zijn gericht op het ontgaan of uitstellen van belastingheffing indien de splitsing niet plaatsvindt op grond van
      zakelijke overwegingen zoals herstructurering of rationalisering van de actieve werkzaamheden van de splitsende-
      en de verkrijgende rechtspersonen. Indien aandelen in de gesplitste rechtspersoon, dan wel in een verkrijgende
      rechtspersoon binnen drie jaar na de splitsing geheel of ten dele, direct of indirect worden vervreemd aan een
      lichaam dat niet met de gesplitste rechtspersoon en met de verkrijgende rechtspersonen is verbonden als bedoeld
      in [artikel 10a van de Wet op de vennootschapsbelasting 1969][ref1], worden zakelijke overwegingen niet aanwezig
      geacht, tenzij het tegendeel aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: '37.3'
    text: |-
      Onder toekenning van eigen aandelen wordt begrepen het geval waarin naast de toekenning van aandelen tevens een
      bedrag in geld wordt betaald van ten hoogste 10 procent van de nominale waarde van de toegekende aandelen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: '37.4'
    text: |-
      Onder een concern wordt verstaan een lichaam waarvan niet alle of nagenoeg alle aandelen onmiddellijk of middellijk
      in het bezit zijn van een ander lichaam, te zamen met alle andere lichamen waarin het onmiddellijk of middellijk
      alle of nagenoeg alle aandelen bezit.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: '37.5'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, letter *a*, is niet van toepassing, indien een van de lichamen niet
      binnen een van de lid-staten van de Europese Unie is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel37
  - number: '38'
    text: De belasting wordt geheven van het lichaam.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel38
  - number: '39'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel39
  - number: '52'
    text: 'Onder waarde wordt verstaan: waarde in het economische verkeer.'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel52
  - number: '53'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel53
  - number: 53.a
    text: |-
      nadere, zo nodig van de bepalingen van deze wet afwijkende regels worden gesteld die tot vergemakkelijking van de
      heffing van belasting kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel53
  - number: 53.b
    text: andere in het kader van de wet passende regels worden gesteld ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel53
  - number: '54.1'
    text: |-
      Indien de verkrijging, bedoeld in [artikel 2, tweede lid][ref1], niet is neergelegd in een notariële akte of in een
      andere akte die ter registratie is aangeboden, is degene die de economische eigendom overdraagt, verplicht binnen
      twee weken na de verkrijging aan de inspecteur te melden dat de economische eigendom is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '54.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de melding moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel54
  - number: '54.3'
    text: |-
      Met betrekking tot de verplichtingen, bedoeld in dit artikel, blijven de [artikelen 47b, tweede lid][ref1], en
      [52a van de Algemene wet inzake rijksbelastingen][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 52a
  - number: '55'
    text: |-
      Degene die niet voldoet aan de verplichting, hem opgelegd bij [artikel 54][ref1], wordt gestraft met geldboete van
      de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel54
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '54'
        hoofdstuk: VIA
  - number: '61.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel61
  - number: '61.2'
    text: Zij kan worden aangehaald als 'Wet op belastingen van rechtsverkeer'.
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel61
