  - number: 15.1.m
    text: door het bureau beheer landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
  - number: 15.1.n
    text: |-
      van woningen door een in Nederland gevestigde landelijke werkende toegelaten instelling als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1], die geen winstoogmerk heeft en die hoofdzakelijk tot doel heeft
      de aankoop van woningen van andere toegelaten instellingen die betrokken zijn bij stedelijke herstructurering
      en de verkoop van deze woningen aan natuurlijke personen. De bepaling is van toepassing voorzover de andere
      toegelaten instellingen de bij de verkoop van woningen aan de landelijk werkende toegelaten instelling verkregen
      middelen binnen zeven kalenderjaren na het einde van het kalenderjaar waarin de woningen zijn verkocht,
      investeren ter bevordering van de stedelijke herstructurering. Bij regeling van Onze Minister, in overeenstemming
      met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Binnenlandse Zaken en
      Koninkrijksrelaties kunnen voorwaarden worden gesteld inzake toepassing van de bepaling. Voorzover de bedoelde
      investering niet uiterlijk binnen de genoemde termijn heeft plaatsgevonden, is de belasting alsnog verschuldigd op
      het tijdstip van het verstrijken van die termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 15.1.o
    text: |-
      door in Nederland gevestigde lichamen die de bevordering van stedelijke herstructurering ten doel hebben, dan
      wel, indien die lichamen geen rechtspersoonlijkheid hebben, door de vennoten van die lichamen. Deze bepaling
      is van toepassing in bij regeling van Onze Minister in overeenstemming met Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen gevallen onder
      daarbij te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
  - number: 15.1.p
    text: |-
      van monumenten in de zin van de [Monumentenwet 1988][ref1] door in Nederland gevestigde rechtspersonen welke naar
      het oordeel van Onze Minister hoofdzakelijk de instandhouding van dergelijke monumenten ten doel hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 15.1.q
    text: |-
      van landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden - of van een recht van
      erfpacht of beklemming daarop - tot een oppervlakte niet groter dan de oppervlakte van de naburige landerijen en
      van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden welke de verkrijger reeds gedurende ten
      minste vijf jaar in eigendom, economische eigendom, erfpacht of beklemming heeft, mits de verkrijging in het belang
      is van een verbetering van de landbouwstructuur; verkrijgingen binnen een tijdsverloop van vijf jaar door dezelfde
      verkrijger worden als één verkrijging beschouwd;
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
  - number: 15.1.r
    text: |-
      krachtens herstel als is bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel19
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '19'
        hoofdstuk: II
        afdeling: '4'
  - number: 15.1.s
    text: |-
      van landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden - daaronder begrepen
      de rechten van erfpacht of beklemming daarop - krachtens ruiling, voor zover de belasting is verschuldigd over
      een bedrag gelijk aan de - met overeenkomstige toepassing van [artikel 11][ref1] bepaalde - waarde van de door de
      verkrijger afgestane landerijen en van de als kweek- of teeltmiddel gebruikte ondergrond van glasopstanden welke
      zijn gelegen in dezelfde gemeente als de verkregen landerijen en als kweek- of teeltmiddel gebruikte ondergrond van
      glasopstanden of in een aangrenzende gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel11
    url: https://wetten.overheid.nl/BWBR0002740/2005-01-01#Artikel15
    references:
