        artikel: '13'
      - id: ref6
        bwb_id: BWBR0002226
        artikel: '1'
  - number: 15.1.y
    text: |-
      van een net gelegen in, op of boven de grond, bestaande uit een of meer kabels of leidingen, bestemd voor transport
      van vaste, vloeibare of gasvormige stoffen, van energie, of van informatie.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: '15.2'
    text: |-
      Ingeval bodembestanddelen als bedoeld in het eerste lid, onderdeel j, of de waarde daarvan alsnog aan de verkrijger
      ten goede komen, wordt zulks beschouwd als een verkrijging in de zin van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '15.3'
    text: |-
      Verwijdering van zaken die ingevolge een beding of krachtens de wet nog na de verkrijging mogen worden weggenomen
      wordt, indien die verwijdering plaatsvindt binnen drie maanden na de verkrijging, ten aanzien van die zaken
      beschouwd als de vervulling van een aan de verkrijging verbonden ontbindende voorwaarde, mits zij of hun waarde
      niet aan de verkrijger zijn ten goede gekomen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: '15.4'
    text: |-
      De in het eerste lid bedoelde vrijstellingen zijn niet van toepassing in gevallen waarin de verkrijging plaatsvindt
      krachtens een levering of dienst in de zin van de [Wet op de omzetbelasting 1968][ref1] ter zake waarvan
      omzetbelasting is verschuldigd, indien de vergoeding, bedoeld in [artikel 8, eerste lid, van die wet][ref2],
      tezamen met de verschuldigde omzetbelasting, lager is dan de waarde, bedoeld in [artikel 9][ref3], en de verkrijger
      de omzetbelasting op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref4] niet of niet nagenoeg
      geheel in aftrek kan brengen. Voor de toepassing van deze bepaling wordt de waarde ten minste gesteld op de
      kostprijs van de onroerende zaak of van de zaak waarop het recht of de dienst betrekking heeft, met inbegrip van
      de omzetbelasting, zoals die zou ontstaan bij de voortbrenging door een onafhankelijke derde op het tijdstip van
      de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002740#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002740
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '15.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel e, onder 1°, wordt onder waarde van het vermogen van de
      ingebrachte onderneming mede verstaan de boekwaarde van dat vermogen, zoals die geldt voor de heffing van
      inkomstenbelasting of vennootschapsbelasting, in gevallen waarin de ondernemer inbrengt met voorbehoud van stille
      reserves.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: '15.6'
    text: 'In afwijking van het eerste lid, onderdeel a, is de vrijstelling eveneens van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.6.a
    text: |-
      het goed als bedrijfsmiddel is gebruikt en de verkrijger de omzetbelasting op grond van
      [artikel 15 van de Wet op de omzetbelasting 1968][ref1] geheel of gedeeltelijk in aftrek kan brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 15.6.b
    text: |-
      de verkrijging plaatsvindt binnen zes maanden na het tijdstip van de eerste ingebruikneming of de eerdere
      ingangsdatum van een verhuur van dat goed; en
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.6.c
    text: |-
      de verkrijging wordt opgenomen in een notariële akte die wordt verleden binnen de termijn waarbinnen de verkrijging
      dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: '15.7'
    text: |-
      Bij algemene maatregel van bestuur kan in afwijking van het zesde lid tijdelijk een afwijkende termijn worden
      vastgesteld indien de ontwikkelingen van de vastgoedmarkt daartoe aanleiding geven. Voor zover nodig kan daarbij
      worden voorzien in overgangsrecht.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: '15.8'
    text: |-
      In afwijking van het eerste lid, onderdelen p en t, is de vrijstelling niet van toepassing op de verkrijging van
      aandelen, bedoeld in [artikel 4, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '15.9'
    text: |-
      Indien ter zake van een verkrijging een vrijstelling als bedoeld in het eerste of zesde lid wordt toegepast, wordt
      met betrekking tot die verkrijging aangifte gedaan. Indien met betrekking tot die verkrijging een notariële akte
      wordt opgemaakt, wordt, in afwijking in zoverre van de vorige zin, aangifte gedaan met overeenkomstige toepassing
      van [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel18
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '18'
        hoofdstuk: II
        afdeling: '4'
  - number: '15.10'
    text: |-
      Bij het begin van het kalenderjaar wordt bij ministeriële regeling het bedrag, genoemd in het eerste lid,
      onderdeel p, onder 4°, met ingang van 1 januari van het daaropvolgende kalenderjaar vervangen door een
      ander bedrag. Het bedrag wordt berekend door het te vervangen bedrag te delen door de factor iw, bedoeld in
      [artikel 10.3, vijfde lid, van de Wet inkomstenbelasting 2001][ref1]. Het aldus berekende bedrag wordt rekenkundig
      afgerond op € 5.000.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '15.11'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, onderdeel a, en zesde lid, blijft buiten toepassing op de verkrijging
      van aandelen in een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 15.11.a
    text: |-
      indien als gevolg van het niet toepassen van die vrijstelling indirect wordt geheven over de waarde van een of meer
      onroerende zaken in de zin van de omzetbelasting of rechten waaraan deze zijn onderworpen; en
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.11.b
    text: |-
      voor zover die onroerende zaken of rechten waaraan deze zijn onderworpen gedurende ten minste twee jaren na
      verkrijging daarvan worden gebruikt voor activiteiten waarvoor minder dan nagenoeg volledig recht op aftrek van
      belasting op de voet van [artikel 15 van de Wet op de omzetbelasting 1968][ref1] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: 15a.1
    text: |-
      De schriftelijke verklaring, bedoeld in [artikel 14, tweede lid][ref1],
      [artikel 15, eerste lid, onderdeel p, of het vierde lid][ref2], wordt door iedere verkrijger afgelegd door het:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '14'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 15a.1.a
    text: ondertekenen van de notariële akte waarin een door de inspecteur voorgeschreven standaardtekst is opgenomen; of
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: 15a.1.b
    text: afzonderlijk invullen van het daartoe door de inspecteur ter beschikking gestelde standaardformulier.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: 15a.2
    text: |-
      De schriftelijke verklaring is onderdeel van de aangifte en wordt indien die verklaring is afgelegd op de wijze,
      bedoeld in het eerste lid, onderdeel b:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: 15a.2.a
    text: |-
      aan de notariële akte gehecht, indien ter zake van de verkrijging een notariële akte moet worden opgemaakt
      en de belasting wordt voldaan ter gelegenheid van de aanbieding van die akte ter registratie, als bedoeld in
      [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel18
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '18'
        hoofdstuk: II
        afdeling: '4'
  - number: 15a.2.b
    text: |-
      toegezonden op de in de aangiftebrief aangegeven wijze, indien ter zake van de verkrijging geen notariële akte
      opgemaakt moet worden.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: 15a.3
    text: |-
      De notaris zendt een elektronische kopie van de schriftelijke verklaring indien die verklaring is afgelegd op de
      wijze, bedoeld in het eerste lid, onderdeel b, in afwijking van [artikel 7b van de Registratiewet 1970][ref1],
      ongevraagd, binnen een maand na de verkrijging aan de inspecteur op een wijze als bedoeld in de bij of krachtens
      dat artikel te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: 7b
  - number: 15a.4
    text: |-
      De verkrijger die aannemelijk maakt dat hij of zijn rechtsvoorganger krachtens erfrecht door onvoorziene
      omstandigheden die zich hebben voorgedaan voor het tijdstip van de verkrijging maar nadat de aan die verkrijging
      ten grondslag liggende koopovereenkomst tot stand is gekomen, redelijkerwijs niet in staat is de woning anders dan
      tijdelijk als hoofdverblijf te gaan gebruiken en dit voorafgaand aan de verkrijging duidelijk en stellig verklaart
      in een schriftelijke verklaring, wordt geacht die woning anders dan tijdelijk als hoofdverblijf te hebben gebruikt.
      De schriftelijke verklaring vervangt de schriftelijke verklaring, bedoeld in [artikel 14, tweede lid][ref1], of
      [artikel 15, eerste lid, onderdeel p, onder 3°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '14'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 15a.5
    text: |-
      De verkrijger, die de verklaring, bedoeld in het eerste lid, heeft afgelegd en die aannemelijk maakt dat hij door
      onvoorziene omstandigheden, die zich hebben voorgedaan na het tijdstip van de verkrijging, redelijkerwijs niet in
      staat is geweest de woning anders dan tijdelijk als hoofdverblijf te gaan gebruiken, wordt geacht die woning anders
      dan tijdelijk als hoofdverblijf te hebben gebruikt.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: 15a.6
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de inhoud en de wijze van aanleveren van
      de schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15a
  - number: '16'
    text: De belasting wordt geheven van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel16
  - number: '17'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld welke ertoe strekken, dat de belasting ter zake van een
      verkrijging waarvan een notariële akte is opgemaakt, wordt voldaan ter gelegenheid van de aanbieding van die akte
      ter registratie.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel18
  - number: '19.1'
    text: |-
      Op verzoek wordt teruggaaf van de belasting verleend, indien de toestand van vóór de verkrijging zowel feitelijk
      als rechtens wordt hersteld als gevolg van:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
  - number: 19.1.a
    text: de vervulling van een ontbindende voorwaarde;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
  - number: 19.1.b
    text: nietigheid of vernietiging;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
  - number: 19.1.c
    text: |-
      ontbinding wegens niet-nakoming van een verbintenis. Indien in de gevallen als zijn bedoeld onder *a* en *b* een
      akte in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], is
      ingeschreven, wordt zodanig herstel in geen geval aanwezig geacht voor de inschrijving van een verklaring, akte of
      rechterlijke uitspraak waarbij de vervulling van de voorwaarde, de nietigheid of de vernietiging wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '19.2'
    text: |-
      Het verzoek om teruggaaf geschiedt door het doen van aangifte binnen drie maanden na afloop van het kalenderjaar
      waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
  - number: '19.3'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
  - number: '19.4'
    text: |-
      Een verkrijging ten aanzien waarvan op grond van het eerste lid teruggaaf van de belasting wordt verleend, blijft
      buiten beschouwing voor de toepassing van [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
        hoofdstuk: II
        afdeling: '2'
  - number: '20'
    text: |-
      Onder de naam 'assurantiebelasting' wordt een belasting geheven ter zake van verzekeringen waarvan het risico in
      Nederland is gelegen en ter zake van daarmee samenhangende diensten.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het risico van de verzekering is in Nederland gelegen indien de verzekeringnemer in Nederland woont, of, ingeval de
      verzekeringnemer een rechtspersoon is, indien de vestiging van deze rechtspersoon waarop de verzekering betrekking
      heeft zich in Nederland bevindt.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het risico van de verzekering is voor zover het eerste lid niet van toepassing is, voorts in Nederland gelegen
      indien de verzekering betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.2.a
    text: |-
      in Nederland gelegen onroerende zaken, alsmede de zich daarin bevindende roerende zaken, met uitzondering van voor
      doorvoer bestemde handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.2.b
    text: |-
      motorrijtuigen welke zijn ingeschreven in het krachtens de [Wegenverkeerswet 1994](onbekend) aangehouden register
      van opgegeven kentekens;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.2.c
    text: |-
      schepen die te boek staan in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 21.2.d
    text: |-
      luchtvaartuigen die te boek staan in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 21.2.e
    text: |-
      tijdens een reis of vakantie gelopen risico's, indien de verzekering in Nederland is gesloten en een looptijd heeft
      van vier maanden of minder.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid is het risico van de verzekering niet in Nederland gelegen indien de verzekering
      betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.3.a
    text: |-
      in een andere lidstaat van de Europese Unie gelegen onroerende zaken, alsmede de zich daarin bevindende roerende
      zaken, met uitzondering van voor doorvoer bestemde handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.3.b
    text: in een andere lidstaat van de Europese Unie geregistreerde voer- en vaartuigen van om het even welke aard;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: 21.3.c
    text: |-
      tijdens een reis of vakantie gelopen risico's, indien de verzekering in een andere lidstaat van de Europese Unie is
      gesloten en een looptijd heeft van vier maanden of minder.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel21
  - number: '22.1'
    text: |-
      De belasting wordt berekend over de premie, alsmede over de vergoeding voor met de verzekering samenhangende
      diensten.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel22
  - number: '22.2'
    text: |-
      Onder premie wordt verstaan het totale bedrag dat - of voor zover de tegenprestatie niet in een geldsom bestaat,
      de totale waarde van de tegenprestatie welke - in verband met de verzekering in rekening wordt gebracht, de
      assurantiebelasting niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel22
  - number: '23'
    text: De belasting bedraagt 21 percent.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel23
  - number: '24.1'
    text: 'Van de belasting zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.a
    text: levensverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.b
    text: ongevallen-, invaliditeits- en arbeidsongeschiktheidsverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.c
    text: |-
      ziekte- en ziektekostenverzekeringen, waaronder zorgverzekeringen als bedoeld in de [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 24.1.d
    text: werkloosheidsverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.e
    text: |-
      verzekeringen van zeeschepen, met uitzondering van pleziervaartuigen, alsmede verzekeringen van luchtvaartuigen
      welke hoofdzakelijk als openbaar vervoermiddel in het internationale verkeer zullen worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.f
    text: transportverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.g
    text: herverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.h
    text: exportkredietverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.i
    text: 'door een werkgever afgesloten verzekeringen ter dekking van financiële verplichtingen voortvloeiend uit:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: 24.1.i.1°
    text: |-
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] of [artikel 76a, eerste lid, van de Ziektewet][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 24.1.i.2°
    text: |-
      [artikel 40, eerste lid, van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 24.1.j
    text: |-
      brede weersverzekeringen afgesloten door een actieve landbouwer als bedoeld in artikel 9, tweede lid, derde alinea,
      van Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling
      van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het
      gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG) nr. 637/2008 van de Raad en Verordening
      (EG) nr. 73/2009 van de Raad (PbEU 2013, L 347).
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: '24.2'
    text: |-
      Indien een samengestelde verzekering een of meer vrijgestelde verzekeringen omvat, wordt de vrijstelling toegepast
      op het aan die vrijgestelde verzekeringen toe te rekenen gedeelte van de premie.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel24
  - number: '25.1'
    text: |-
      De belasting ter zake van verzekeringen welke zijn gesloten door tussenkomst van een door Onze
      Minister aangewezen bemiddelaar in verzekeringen, aan wie een vergunning is verleend ingevolge de
      [Wet op het financieel toezicht][ref1], wordt geheven van die bemiddelaar, indien hij ter zake van de verzekering
      de premie int of doet innen en bovendien:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 25.1.1°
    text: |-
      de verzekering is gesloten bij een gevolmachtigd agent als bedoeld in de [Wet op het financieel toezicht][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 25.1.2°
    text: het risico dat de verzekering dekt krachtens één polis, wordt gedragen door ten minste twee verzekeraars; of
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: 25.1.3°
    text: |-
      de bemiddelaar jegens de verzekeraar aansprakelijk is voor de verschuldigde premie en de polis of het aanhangsel
      van de polis niet door de verzekeraar is of wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: '25.2'
    text: |-
      De belasting ter zake van verzekeringen welke zijn gesloten bij een gevolmachtigd agent als bedoeld in de
      [Wet op het financieel toezicht][ref1] wordt steeds geheven van de agent, tenzij het eerste lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '25.3'
    text: |-
      De belasting wordt geheven van de bemiddelaar, indien en voor zover deze de vergoeding ontvangt van een ander
      dan de verzekeraar die in Nederland is gevestigd. Deze belastingplicht strekt zich niet verder uit dan tot die
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: '25.4'
    text: |-
      Indien het eerste, tweede en derde lid geen toepassing kunnen vinden, wordt de belasting geheven van de
      verzekeraar, ingeval deze in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: '25.5'
    text: |-
      Ingeval de verzekeraar niet in Nederland is gevestigd en het eerste en tweede lid geen toepassing
      kunnen vinden, wordt de belasting geheven van de vertegenwoordiger van de verzekeraar als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], al naar gelang die vertegenwoordiger de verzekering
      voor of namens de verzekeraar heeft gesloten. Indien er niet een dergelijke vertegenwoordiger is, wordt
      de belasting geheven van de in Nederland wonende of gevestigde bemiddelaar in verzekeringen als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], door wiens bemiddeling de verzekering is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '25.6'
    text: |-
      Indien het eerste, tweede, derde en vijfde lid geen toepassing kunnen vinden en de verzekeraar in een lidstaat van
      de Europese Unie of in een bij ministeriële regeling aangewezen staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, maar niet in Nederland, woont of is gevestigd, wordt de belasting geheven van de
      verzekeraar of, indien de verzekeraar een fiscaal vertegenwoordiger heeft aangesteld die in Nederland woont of
      gevestigd is, van die fiscaal vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: '25.7'
    text: |-
      Indien het eerste, tweede, derde en vijfde lid geen toepassing kunnen vinden, is de verzekeraar die niet
      in een lidstaat van de Europese Unie of in een bij ministeriële regeling aangewezen staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte woont of is gevestigd gehouden een fiscaal
      vertegenwoordiger aan te stellen die in Nederland woont of gevestigd is. De belasting wordt in dat geval geheven
      van die fiscaal vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: '25.8'
    text: Ingeval de vorige leden geen toepassing kunnen vinden, wordt de belasting geheven van de verzekeringnemer.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25
  - number: 25a.1
    text: |-
      De fiscaal vertegenwoordiger, bedoeld in [artikel 25, zesde en zevende lid][ref1], dient in het bezit te zijn van
      een vergunning van de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: 25a.2
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens
      die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij het verzoek wordt een verklaring overgelegd van de in [artikel 25, zesde en zevende lid][ref1], bedoelde
      verzekeraar, waaruit blijkt dat deze degene die het verzoek indient, machtigt op te treden als zijn fiscaal
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: 25a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen,
      wijzigen en intrekken van de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel25a
  - number: '26'
    text: De belasting wordt verschuldigd op het tijdstip waarop de premie vervalt.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel26
  - number: '27'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel27
  - number: '28'
    text: |-
      In de gevallen bedoeld in [artikel 25, eerste tot en met vijfde lid][ref1], wordt het risico van de verzekering
      geacht in Nederland te zijn gelegen, tenzij aan de hand van boeken of bescheiden het tegendeel wordt aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel25
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '25'
        hoofdstuk: III
        afdeling: '4'
  - number: '29.1'
    text: |-
      Voor zover de premie niet is en niet zal worden ontvangen, dan wel wordt terugbetaald, wordt de belasting verrekend
      met die welke is verschuldigd geworden in het tijdvak waarin het recht op verrekening is ontstaan. Ingeval de voor
      verrekening in aanmerking komende belasting meer bedraagt dan de in het tijdvak verschuldigd geworden belasting,
      wordt het verschil op verzoek teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel29
  - number: '29.2'
    text: Het verzoek om teruggaaf geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel29
  - number: '29.3'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel29
  - number: '30'
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van deze wet of van een wijziging daarvan gesloten verzekering
      premies int of doet innen, is bevoegd hetgeen van hem wegens assurantiebelasting over die premies meer is gevorderd
      dan vóór die inwerkingtreding had kunnen geschieden, terug te vorderen van de verzekeringnemer. Hiermede strijdige
      bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel30
  - number: '31'
    text: |-
      De verzekeringnemer die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake
      assurantiebelasting gesloten verzekering premies voldoet, is bevoegd van hem aan wie de premies worden
      voldaan, terug te vorderen hetgeen wegens assurantiebelasting over die premies minder is gevorderd dan vóór die
      inwerkingtreding had kunnen geschieden. Hiermede strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel31
  - number: '52'
    text: 'Onder waarde wordt verstaan: waarde in het economische verkeer.'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel52
  - number: '53'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel53
  - number: 53.a
    text: |-
      nadere, zo nodig van de bepalingen van deze wet afwijkende regels worden gesteld die tot vergemakkelijking van de
      heffing van belasting kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel53
  - number: 53.b
    text: andere in het kader van de wet passende regels worden gesteld ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel53
  - number: '54.1'
    text: |-
      Indien de verkrijging, bedoeld in [artikel 2, tweede lid][ref1], niet is neergelegd in een notariële akte, is
      degene die de economische eigendom overdraagt, verplicht binnen twee weken na de verkrijging aan de inspecteur te
      melden dat de economische eigendom is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '54.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de melding moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel54
  - number: '54.3'
    text: |-
      Met betrekking tot de verplichtingen, bedoeld in dit artikel, blijven de [artikelen 47b][ref1] en
      [52a van de Algemene wet inzake rijksbelastingen][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 52a
  - number: '61.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel61
  - number: '61.2'
    text: Zij kan worden aangehaald als 'Wet op belastingen van rechtsverkeer'.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel61
