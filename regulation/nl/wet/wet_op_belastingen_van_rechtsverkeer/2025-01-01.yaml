    text: |-
      de verkrijger de verkregen woning of rechten waaraan deze is onderworpen na de verkrijging anders dan tijdelijk als
      hoofdverblijf gaat gebruiken en dit overeenkomstig [artikel 15a][ref1], voorafgaand aan de verkrijging duidelijk,
      stellig en zonder voorbehoud verklaart in een schriftelijke verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: 15a
        hoofdstuk: II
        afdeling: '3'
  - number: 15.1.p.4°
    text: |-
      het totaal van de waarde van de woning of rechten waaraan deze is onderworpen en tot die woning behorende
      aanhorigheden niet uitkomt boven € 525.000;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.q
    text: |-
      van ten behoeve van de landbouw bedrijfsmatig geëxploiteerde cultuurgrond, daaronder begrepen de rechten van
      erfpacht of beklemming daarop. Onder cultuurgrond wordt mede begrepen de ondergrond van glasopstanden. De belasting
      die door toepassing van deze bepaling niet is geheven, is alsnog verschuldigd indien de exploitatie als zodanig
      niet gedurende ten minste tien jaren wordt voortgezet. De vorige volzin is niet van toepassing indien binnen de
      aldaar bedoelde termijn de cultuurgrond door overheidsbeleid aan de landbouw wordt onttrokken ten behoeve van de
      ontwikkeling en instandhouding van natuur en landschap;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.r
    text: |-
      krachtens herstel als is bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel19
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '19'
        hoofdstuk: II
        afdeling: '4'
  - number: 15.1.s
    text: |-
      van natuurgrond, daaronder begrepen de rechten van erfpacht of beklemming daarop, waarvan de inrichting en het
      beheer geheel of nagenoeg geheel duurzaam zijn afgestemd op het behoud en de ontwikkeling van natuur en landschap.
      De belasting die door toepassing van deze bepaling niet is geheven, is alsnog verschuldigd indien binnen tien jaren
      na de verkrijging niet langer sprake is van natuurgrond. De vorige volzin is niet van toepassing indien binnen
      de aldaar bedoelde termijn de natuurgrond wordt omgezet in cultuurgrond als bedoeld in onderdeel q en als zodanig
      gedurende de rest van deze termijn bedrijfsmatig geëxploiteerd blijft;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.t
    text: |-
      van een woning of rechten waaraan deze is onderworpen, of van rechten van lidmaatschap als bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], voor zover deze laatste rechten betrekking hebben op een woning mits
      deze, wordt verkregen van een natuurlijk persoon, de verkrijging voortvloeit uit een verkoopregulerend beding bij
      de eerdere verkrijging dat een terugkooprecht of een terugkoopverplichting inhoudt en de verkrijger de vervreemder
      was bij die eerdere verkrijging. Deze bepaling is eveneens van toepassing op aanhorigheden die tot de woning
      behoren, indien zij gelijktijdig met deze woning worden verkregen. De vervreemder bij de eerdere verkrijging kan
      ook een rechtsvoorganger van de verkrijger zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 15.1.u
    text: |-
      door Staatsbosbeheer van objecten, als bedoeld in
      [artikel 1, onderdeel e, van de Wet verzelfstandiging Staatsbosbeheer][ref1], niet zijnde bedrijfsondersteunende
      onroerende zaken;


      [ref1]: https://wetten.overheid.nl/BWBR0008904#Artikel1
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008904
        artikel: '1'
  - number: 15.1.x
    text: |-
      krachtens uitoefening van een wilsrecht als bedoeld in de artikelen [19][ref1] , [20][ref2],
      [21][ref3] en [22 van Boek 4 van het Burgerlijk Wetboek][ref4], voorzover de totale waarde van de
      verkrijging uit de nalatenschap niet meer bedraagt dan het bedrag van de geldvordering, bedoeld in
      [artikel 13, derde lid, van Boek 4 van het Burgerlijk Wetboek][ref5], vermeerderd met de rentevergoeding waarmee
      ingevolge [artikel 1, derde lid, van de Successiewet 1956][ref6] voor de heffing van erfbelasting rekening is
      gehouden. Voor de toepassing van de vorige volzin blijft bij het bepalen van de waarde van een verkrijging een
      door de ouder of stiefouder op grond van [artikel 19](onbekend), onderscheidenlijk [artikel 21, van Boek 4 van het
      Burgerlijk Wetboek](onbekend) voorbehouden vruchtgebruik buiten beschouwing;


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0002226#Artikel1
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
