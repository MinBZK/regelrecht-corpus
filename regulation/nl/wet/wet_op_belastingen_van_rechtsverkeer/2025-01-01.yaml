  - number: '14.5'
    text: |-
      De belasting van 2 percent, genoemd in het tweede en vierde lid, is niet van toepassing op de verkrijging van
      aandelen, bedoeld in [artikel 4, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel14
