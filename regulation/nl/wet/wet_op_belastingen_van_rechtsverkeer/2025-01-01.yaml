  - number: 15.1.la.1°
    text: |-
      de vrijstelling niet van toepassing is op de verkrijging van een woning of rechten waaraan deze is onderworpen,
      de ondergrond en tot die woning behorende aanhorigheden, met uitzondering van een woning of rechten waaraan deze
      is onderworpen, met inbegrip van de ondergrond en tot die woning behorende aanhorigheden, die is gelegen op een
      kavel met een agrarische functie en functioneel is verbonden met het nabijgelegen agrarische bedrijf (agrarische
      bedrijfswoning);
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.la.2°
    text: |-
      de vrijstelling niet van toepassing is op de verkrijging van een andere opstal dan een woning, met de ondergrond of
      rechten waaraan die andere opstal is onderworpen en tot die andere opstal behorende aanhorigheden, behoudens indien
      die andere opstal geheel of nagenoeg geheel ten behoeve van de landbouw bedrijfsmatig wordt geëxploiteerd;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.la.3°
    text: |-
      de belasting die door toepassing van deze bepaling, aanhef en subonderdelen 1° en 2°, niet is geheven, alsnog
      verschuldigd is voor zover de agrarische bedrijfswoning niet gedurende ten minste tien jaren na de verkrijging als
      zodanig kwalificeert of voor zover de bedrijfsmatige exploitatie ten behoeve van de landbouw van de opstal, bedoeld
      in subonderdeel 2°, niet gedurende ten minste tien jaren wordt voortgezet;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.la.4°
    text: |-
      subonderdeel 3° niet van toepassing is indien binnen de aldaar bedoelde termijn de opstal door overheidsingrijpen
      als bedoeld in [artikel 3.54, twaalfde lid, van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende
      bepalingen aan de landbouw wordt onttrokken ten behoeve van de ontwikkeling en instandhouding van natuur en
      landschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15.1.m
    text: door het bureau beheer landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.n
    text: |-
      van woningen door een in Nederland gevestigde landelijke werkende toegelaten instelling als bedoeld in
      [artikel 19, eerste lid, van de Woningwet][ref1], die geen winstoogmerk heeft en die hoofdzakelijk tot doel heeft
      de aankoop van woningen van andere toegelaten instellingen die betrokken zijn bij stedelijke herstructurering
      en de verkoop van deze woningen aan natuurlijke personen. De bepaling is van toepassing voorzover de andere
      toegelaten instellingen de bij de verkoop van woningen aan de landelijk werkende toegelaten instelling verkregen
      middelen binnen zeven kalenderjaren na het einde van het kalenderjaar waarin de woningen zijn verkocht, investeren
      ter bevordering van de stedelijke herstructurering. Bij regeling van Onze Minister, in overeenstemming met Onze
      Minister voor Wonen en Rijksdienst kunnen voorwaarden worden gesteld inzake toepassing van de bepaling. Voorzover
      de bedoelde investering niet uiterlijk binnen de genoemde termijn heeft plaatsgevonden, is de belasting alsnog
      verschuldigd op het tijdstip van het verstrijken van die termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: 15.1.o
    text: |-
      door in Nederland gevestigde lichamen die de bevordering van stedelijke herstructurering ten doel hebben, dan wel,
      indien die lichamen geen rechtspersoonlijkheid hebben, door de vennoten van die lichamen. Deze bepaling is van
      toepassing in bij regeling van Onze Minister in overeenstemming met Onze Minister voor Wonen en Rijksdienst aan te
      wijzen gevallen onder daarbij te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.oa
    text: |-
      na voltooiing van een stedelijke herstructurering als bedoeld in onderdeel o, van onroerende zaken van een lichaam
      als bedoeld in onderdeel o, door degenen die de onroerende zaken met toepassing van de vrijstelling, bedoeld
      in onderdeel o, hebben ingebracht in dat lichaam of met toepassing van onderdeel o zoals dat luidde tot en met
      31 december 2002 hebben ingebracht in een samenwerkingsverband dat na die datum is aangemerkt als een zodanig
      lichaam, dan wel, indien de verkrijgers behoren tot de kring van oprichters van het lichaam, van die onroerende
      zaken tot het beloop van hun gerechtigdheid in het lichaam;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.p
    text: |-
      van een woning of rechten waaraan deze is onderworpen of van rechten van lidmaatschap als bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], voor zover deze laatste rechten betrekking hebben op een woning, en de
      gelijktijdige verkrijging van de tot die woning behorende aanhorigheden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
    references:
