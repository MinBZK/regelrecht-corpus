$id: wet_op_belastingen_van_rechtsverkeer
regulatory_layer: WET
publication_date: '2010-12-29'
valid_from: '2025-01-01'
bwb_id: BWBR0002740
url: https://wetten.overheid.nl/BWBR0002740/2025-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving betreffende de registratie- en de
    zegelbelasting te vervangen door een meer overzichtelijke en aanzienlijk vereenvoudigde nieuwe wettelijke regeling,
    welke is aangepast aan de Algemene wet inzake rijksbelastingen (Stb. 1959, 301) en aan de richtlijn van de Raad van
    de Europese Gemeenschappen van 17 juli 1969 betreffende de indirecte belastingen op het bijeenbrengen van kapitaal
    (Publikatieblad van 3 oktober 1969);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel1
  - number: 1.a
    text: een overdrachtsbelasting;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel1
  - number: 1.b
    text: een assurantiebelasting.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onder de naam 'overdrachtsbelasting' wordt een belasting geheven ter zake van de verkrijging van in Nederland
      gelegen onroerende zaken of van rechten waaraan deze zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van deze wet wordt onder verkrijging mede begrepen de verkrijging van de economische eigendom.
      Onder economische eigendom wordt verstaan een samenstel van rechten en verplichtingen met betrekking tot de in
      het eerste lid bedoelde onroerende zaken of rechten waaraan deze zijn onderworpen, dat een belang bij die zaken
      of rechten vertegenwoordigt. Het belang omvat ten minste enig risico van waardeverandering en komt toe aan een
      ander dan de eigenaar of beperkt gerechtigde. Onder de verkrijging van de economische eigendom van onroerende zaken
      of van rechten waaraan deze zijn onderworpen wordt mede verstaan de verkrijging van een samenstel van rechten en
      verplichtingen dat een belang als hiervoor bedoeld vertegenwoordigt bij een bestanddeel van een onroerende zaak
      dat zelfstandig aan een recht kan worden onderworpen, dan wel bij een recht waaraan een onroerende zaak kan worden
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '2.3'
    text: 'Als verkrijging van economische eigendom wordt niet aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.3.a
    text: de verkrijging van uitsluitend het recht op levering;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.3.b
    text: |-
      de verkrijging van het recht op levering van een woning door een natuurlijk persoon in combinatie met de toegang
      tot die woning of de toestemming om enige werkzaamheden in of aan de woning te verrichten of te laten verrichten
      voorafgaande aan de verkrijging van die woning, bedoeld in het eerste lid, mits:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.3.b.1°
    text: |-
      de verkrijging van de woning, bedoeld in het eerste lid, plaatsvindt binnen zes maanden na de verkrijging van het
      recht op die toegang of die toestemming; en
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.3.b.2°
    text: |-
      op de verkrijging van de woning het tarief, bedoeld in [artikel 14, tweede lid][ref1], of de vrijstelling, bedoeld
      in [artikel 15, eerste lid, onderdeel p][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '14'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '2.4'
    text: |-
      Voor de toepassing van het derde lid wordt onder «woning» mede verstaan: rechten waaraan een woning is onderworpen,
      rechten van lidmaatschap als bedoeld in [artikel 4, eerste lid, onderdeel b][ref1], voor zover deze betrekking
      hebben op een woning, en de tot die woning behorende aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '2.5'
    text: 'Het tweede lid is niet van toepassing bij verkrijging van rechten van deelneming in:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.5.a
    text: een beleggingsfonds;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.5.b
    text: een fonds voor collectieve belegging in effecten;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '2.6'
    text: 'Het vijfde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.6.a
    text: |-
      de verkrijger, al dan niet tezamen met een verbonden lichaam als bedoeld in
      [artikel 4, zesde of zevende lid][ref1], of een verbonden natuurlijk persoon als bedoeld in artikel 4, achtste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 2.6.b
    text: |-
      de verkrijger een natuurlijk persoon is tezamen met zijn echtgenoot, zijn bloed- en aanverwanten in de rechte linie
      en in de tweede graad van de zijlinie;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '2.7'
    text: 'Voor toepassing van het vijfde lid worden verkrijgingen binnen een tijdsverloop van twee jaren door:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.7.a
    text: |-
      een natuurlijk persoon, zijn echtgenoot, zijn bloed- en aanverwanten in de rechte linie en door een lichaam waarin
      hij, al dan niet tezamen met zijn echtgenoot en zijn bloed- en aanverwanten in de rechte linie, een geheel of
      nagenoeg geheel belang heeft;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: 2.7.b
    text: |-
      een rechtspersoon en door een tot hetzelfde concern als gedefinieerd krachtens
      [artikel 15, eerste lid, onderdeel h][ref1], behorend lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '2.8'
    text: |-
      Onder verkrijging van rechten als bedoeld in het vijfde lid wordt mede begrepen de verkrijging van de economische
      eigendom door bestaande deelnemers in een beleggingsfonds of fonds voor collectieve beleggingen in effecten als
      gevolg van de intrekking van bewijzen van deelgerechtigdheid na gehele of gedeeltelijke uittreding door een andere
      deelnemer.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '2.9'
    text: |-
      Voor de toepassing van dit artikel worden onder lichamen verstaan verenigingen, andere rechtspersonen, maat- en
      vennootschappen en doelvermogens.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel2
  - number: '3.1'
    text: 'Als verkrijging wordt niet aangemerkt die krachtens:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel3
  - number: 3.1.a
    text: boedelmenging, erfrecht of verjaring;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel3
  - number: 3.1.b
    text: |-
      verdeling van een huwelijksgemeenschap of nalatenschap, waarin de verkrijger was gerechtigd als rechtverkrijgende
      onder algemene titel;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel3
  - number: 3.1.c
    text: |-
      natrekking van een zaak op het tijdstip waarop die zaak wordt aangebracht op, aan of in een onroerende
      zaak, tenzij van die zaak omzetbelasting wordt geheven ter zake van de levering en de vergoeding, bedoeld in
      [artikel 8, eerste lid, van de Wet op de omzetbelasting 1968][ref1], tezamen met de verschuldigde omzetbelasting,
      lager is dan de waarde, bedoeld in [artikel 9][ref2], en de verkrijger die omzetbelasting op grond van
      [artikel 15 van die wet][ref3] niet of niet nagenoeg geheel in aftrek kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '3.2'
    text: |-
      Als verkrijging als bedoeld in het eerste lid, onderdeel a of b, wordt niet aangemerkt hetgeen wordt verkregen
      krachtens de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref1], [20][ref2], [21][ref3] en
      [22 van Boek 4 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '4.1'
    text: |-
      Als zaken als bedoeld in [artikel 2][ref1] worden mede aangemerkt (fictieve onroerende zaken):


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 4.1.a
    text: |-
      aandelen in een rechtspersoon, waarvan de bezittingen op het tijdstip van de verkrijging of op enig tijdstip in het
      daaraan voorafgaande jaar grotendeels bestaan of hebben bestaan uit onroerende zaken en tegelijkertijd ten minste
      30% van de bezittingen bestaat of heeft bestaan uit in Nederland gelegen onroerende zaken, mits de onroerende
      zaken, als geheel genomen, op dat tijdstip geheel of hoofdzakelijk dienstbaar zijn of waren aan het verkrijgen,
      vervreemden of exploiteren van die onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.1.b
    text: |-
      rechten van lidmaatschap van verenigingen of coöperaties, indien in die rechten is begrepen het recht op
      uitsluitend of nagenoeg uitsluitend gebruik van een in Nederland gelegen gebouw of van een gedeelte daarvan dat
      blijkens zijn inrichting is bestemd om als afzonderlijk geheel te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder onroerende zaken mede verstaan fictieve onroerende zaken,
      rechten waaraan onroerende zaken of fictieve onroerende zaken zijn onderworpen, alsmede de economische eigendom van
      deze zaken of rechten.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij toepassing van het eerste lid, onderdeel a, wordt ter zake van de verkrijging van aandelen alleen belasting
      geheven wanneer de verkrijger met inbegrip van de reeds aan hem toebehorende aandelen en ingevolge dezelfde of een
      samenhangende overeenkomst nog te verkrijgen aandelen:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.3.a
    text: |-
      als natuurlijk persoon, al dan niet tezamen met zijn echtgenoot, zijn bloed- en aanverwanten in de rechte linie en
      in de tweede graad van de zijlinie of een verbonden lichaam, voor ten minste een derde gedeelte, en, al dan niet
      tezamen met zijn echtgenoot, voor meer dan zeven percent belang in de rechtspersoon heeft;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.3.b
    text: |-
      als rechtspersoon, al dan niet tezamen met een verbonden lichaam of een verbonden natuurlijk persoon, voor ten
      minste een derde gedeelte belang in de rechtspersoon heeft.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.4'
    text: 'Voor de toepassing van het eerste lid, onderdeel a:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.4.a
    text: |-
      heeft, wanneer een rechtspersoon, al dan niet tezamen met een tot hetzelfde concern als gedefinieerd krachtens
      [artikel 15, eerste lid, onderdeel h][ref1], behorend lichaam, of met een natuurlijk persoon die, al dan niet
      tezamen met zijn echtgenoot of zijn bloed- en aanverwanten in de rechte linie, een geheel of nagenoeg geheel
      belang heeft in de rechtspersoon, voor ten minste een derde gedeelte een belang bezit of heeft bezeten in een ander
      lichaam, bij het bepalen van zijn bezittingen naar evenredigheid toerekening plaats van de bezittingen en schulden
      van het andere lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 4.4.b
    text: |-
      worden, na toepassing van de toerekening uit onderdeel a, vorderingen van de rechtspersoon op de verkrijger of
      op met de rechtspersoon of de verkrijger verbonden lichamen en verbonden natuurlijke personen als bedoeld in het
      derde, zesde, zevende of achtste lid van dit artikel, niet tot de bezittingen gerekend, tenzij aannemelijk wordt
      gemaakt dat deze vorderingen voortvloeien of voortvloeiden uit een bij de aard en omvang van de rechtspersoon en de
      verkrijger, of daarmee verbonden lichamen of natuurlijke personen, passende normale bedrijfsuitoefening;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.4.c
    text: |-
      worden, na toepassing van de toerekening uit onderdeel a, bezittingen van de rechtspersoon, andere dan onroerende
      zaken en de vorderingen bedoeld in onderdeel b, bij aanwezigheid van schulden van de rechtspersoon aan de
      verkrijger of aan met de rechtspersoon of de verkrijger verbonden lichamen of verbonden natuurlijke personen
      als bedoeld in het derde, zesde, zevende of achtste lid van dit artikel, geacht te zijn gefinancierd door die
      schulden en worden die bezittingen in zoverre niet in aanmerking genomen, tenzij aannemelijk wordt gemaakt dat deze
      bezittingen voortvloeien of voortvloeiden uit een bij de aard en omvang van de rechtspersoon en de verkrijger, of
      daarmee verbonden lichamen of natuurlijke personen, passende normale bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.5'
    text: 'Voor de toepassing van het derde en vierde lid:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.5.a
    text: |-
      wordt onder degene die een belang heeft mede verstaan degene die, anders dan als pandhouder, rechthebbende
      is op rechten waaraan het in dat lid bedoelde belang is onderworpen, alsmede degene die rechthebbende is op
      de economische eigendom van dat belang. Deze rechten en economische eigendom worden geacht een belang in de
      rechtspersoon te vertegenwoordigen dat overeenstemt met het belang dat kan worden toegekend aan de aandelen waarop
      ze betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.5.b
    text: |-
      worden de volgende verkrijgingen beschouwd als te hebben plaatsgehad ingevolge dezelfde of een samenhangende
      overeenkomst:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.5.b.1°
    text: |-
      verkrijgingen binnen een tijdsverloop van twee jaren door dezelfde verkrijger als bedoeld in het derde lid,
      onderdeel a, zijn echtgenoot, zijn bloed- en aanverwanten in de rechte linie en door een lichaam waarin hij, al dan
      niet tezamen met zijn echtgenoot en zijn bloed- en aanverwanten in de rechte linie, een geheel of nagenoeg geheel
      belang heeft;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.5.b.2°
    text: |-
      verkrijgingen binnen een tijdsverloop van twee jaren door dezelfde verkrijger als bedoeld
      in het derde lid, onderdeel b, en door een tot hetzelfde concern als gedefinieerd krachtens
      [artikel 15, eerste lid, onderdeel h][ref1], behorend lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 4.5.c
    text: |-
      wordt ter vaststelling van het belang van de verkrijger, bij: - samenloop van middellijk belang via een verbonden
      lichaam met het belang van het verbonden lichaam, uitsluitend het belang van het verbonden lichaam in aanmerking
      genomen;
        - samenloop van middellijk belang van een verbonden lichaam of een verbonden natuurlijk persoon via de verkrijger
      met het belang van de verkrijger, uitsluitend het belang van de verkrijger in aanmerking genomen; en
        - samenloop van belang bij wege van economische eigendom met belang bij wege van juridische eigendom, dan wel van
      blote eigendom met vruchtgebruik, het belang slechts eenmaal in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.6'
    text: |-
      Voor de toepassing van het derde lid, onderdeel a, wordt als een met de verkrijger verbonden lichaam aangemerkt
      een lichaam waarin de verkrijger, zijn echtgenoot of zijn bloed- en aanverwanten in de rechte linie en in de tweede
      graad van de zijlinie, al dan niet tezamen, voor ten minste een derde gedeelte belang heeft.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.7'
    text: 'Voor de toepassing van het derde lid, onderdeel b, wordt als een met de verkrijger verbonden lichaam aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.7.a
    text: een lichaam waarin de verkrijger voor ten minste een derde gedeelte belang heeft;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.7.b
    text: een lichaam dat voor ten minste een derde gedeelte belang heeft in de verkrijger;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: 4.7.c
    text: |-
      een lichaam waarin een derde, zijn echtgenoot of zijn bloed- en aanverwanten in de rechte linie en in de tweede
      graad van de zijlinie, al dan niet tezamen, voor ten minste een derde gedeelte belang heeft, terwijl deze derde al
      dan niet tezamen met zijn echtgenoot of zijn bloed- en aanverwanten in de rechte linie en in de tweede graad van de
      zijlinie tevens voor ten minste een derde gedeelte belang heeft in de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.8'
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, wordt als een met de verkrijger verbonden natuurlijk persoon
      aangemerkt een natuurlijk persoon die, al dan niet tezamen met zijn echtgenoot en zijn bloed- en aanverwanten
      in de rechte linie en in de tweede graad van de zijlinie, voor ten minste een derde gedeelte belang heeft in de
      verkrijger of in een met de verkrijger verbonden lichaam, alsmede de echtgenoot van deze persoon en de bloed- en
      aanverwanten in de rechte linie en in de tweede graad van de zijlinie van deze persoon.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '4.9'
    text: |-
      De rechtspersonen, bedoeld in het eerste lid, zijn gehouden met inachtneming van bij ministeriële
      regeling te stellen regels bij aangifte de gegevens te verstrekken waarvan de kennisneming van
      belang kan zijn voor de heffing van de belasting. Met betrekking tot deze verplichtingen blijft
      [artikel 53, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '4.10'
    text: |-
      Voor de toepassing van dit artikel is [artikel 2, negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '4.11'
    text: |-
      Onder aandelen als bedoeld in het eerste lid, onderdeel a, en het derde lid worden mede verstaan rechten uit
      bestaande aandelen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel4
  - number: '5'
    text: Als rechten waaraan zaken zijn onderworpen worden niet aangemerkt de rechten van grondrente, pand en hypotheek.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel5
  - number: '6.1'
    text: |-
      Opzegging van een beperkt recht wordt beschouwd als verkrijging van dat recht door degene ten behoeve van wie de
      opzegging plaats heeft.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel6
  - number: '6.2'
    text: |-
      Wijziging van een beperkt recht wordt beschouwd als afstand van dat recht tegen verkrijging van een nieuw beperkt
      recht.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien bij het einde van een beperkt recht tot gebruik van een onroerende zaak door de gebruiker daarop
      aangebrachte zaken ten goede komen aan een andere gerechtigde tot die onroerende zaak, worden die zaken geacht door
      die gerechtigde te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel6
  - number: '7'
    text: Hetgeen bij een verdeling wordt toegedeeld, wordt geacht voor het geheel te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien voor de verkrijging van een goed als bedoeld in [artikel 2][ref1] een akte in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2], moet worden ingeschreven, vindt de
      verkrijging plaats op het tijdstip waarop de akte wordt opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '8.2'
    text: |-
      Een verkrijging krachtens een rechtshandeling die onder opschortende voorwaarde is verricht, komt tot stand op het
      tijdstip waarop de voorwaarde wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel8
  - number: '8.3'
    text: Nietigheid van een verkrijging wordt buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel8
  - number: '9.1'
    text: |-
      De belasting wordt berekend over de waarde van de onroerende zaak of het recht waaraan deze is onderworpen, waarop
      de verkrijging betrekking heeft. De waarde is ten minste gelijk aan die van de tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien van een beperkt recht afstand wordt gedaan tegen verkrijging van een nieuw beperkt recht, wordt de belasting
      berekend over het verschil in waarde tussen de beperkte rechten. Wordt uitsluitend de schuldplichtigheid gewijzigd,
      dan wordt bedoeld verschil op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij verkrijging van een met grondrente bezwaarde zaak, wordt de belasting berekend over de waarde van die zaak
      zonder aftrek van de grondrente.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
  - number: '9.4'
    text: |-
      Ingeval een verkrijging als bedoeld in [artikel 2, tweede lid][ref1], wordt gevolgd door een verkrijging als
      bedoeld in [artikel 2, eerste lid][ref2], of andersom, door dezelfde persoon of door zijn rechtsopvolger krachtens
      huwelijksvermogensrecht of erfrecht, wordt de waarde verminderd met het bedrag waarover ter zake van de eerste
      verkrijging was verschuldigd hetzij overdrachtsbelasting welke niet in mindering heeft gestrekt van schenk- of
      erfbelasting, hetzij omzetbelasting welke op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref3] in
      het geheel niet in aftrek kon worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '9.5'
    text: |-
      In afwijking van het vierde lid wordt ingeval een verkrijging als bedoeld in [artikel 2, tweede lid][ref1], wordt
      gevolgd door een verkrijging als bedoeld in artikel 2, eerste lid, of andersom, door dezelfde persoon of door
      zijn rechtsopvolger krachtens huwelijksvermogensrecht of erfrecht, waarbij ter zake van die vorige verkrijging het
      tarief, genoemd in [artikel 14, tweede, derde, vierde of zevende lid][ref2] is toegepast, het bedrag aan belasting
      verminderd met het bedrag aan belasting dat ter zake van de vorige verkrijging was verschuldigd en niet in
      mindering heeft gestrekt van schenk- of erfbelasting. Het verminderde bedrag aan belasting is niet lager dan nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel14
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '14'
        hoofdstuk: II
        afdeling: '3'
  - number: '9.6'
    text: |-
      Indien voor een goed als bedoeld in [artikel 2][ref1] een verkoopregulerend beding geldt dat rechtstreeks of
      middellijk jegens de verkrijger is gemaakt door een publiekrechtelijk lichaam of een toegelaten instelling als
      bedoeld in [artikel 19, eerste lid, van de Woningwet][ref2], is de waarde gelijk aan die van de tegenprestatie en
      worden voor de bepaling van de tegenprestatie de uit het beding voortvloeiende lasten buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '19'
  - number: '9.7'
    text: |-
      Indien op grond van [artikel 15, vierde lid][ref1], de vrijstelling niet van toepassing is, wordt de waarde ten
      minste gesteld op de kostprijs van de onroerende zaak of van de zaak waarop het recht of de dienst betrekking
      heeft, met inbegrip van de omzetbelasting, zoals die zou ontstaan bij de voortbrenging door een onafhankelijke
      derde op het tijdstip van de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '9.8'
    text: |-
      In geval een verkrijging van een woning of rechten waaraan deze is onderworpen op of na 1 april 2021, waarbij
      de vrijstelling, bedoeld in [artikel 15, eerste lid, onderdeel p][ref1], is toegepast, binnen twaalf maanden
      wordt gevolgd door een of meer andere verkrijgingen die betrekking hebben op de woning of rechten waaraan deze
      is onderworpen of een aanhorigheid bij die woning, door dezelfde persoon, en de som van de waarde van al deze
      verkrijgingen het bedrag, genoemd in artikel 15, eerste lid, onderdeel p, onder 4, overschrijdt, wordt de waarde
      van de verkrijging waarbij dit bedrag wordt overschreden vermeerderd met het bedrag waarover ter zake van de
      eerdere verkrijging de vrijstelling van artikel 15, eerste lid, onderdeel p, is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '10'
    text: |-
      De waarde van aandelen en rechten, als bedoeld in [artikel 4, eerste lid][ref1], is gelijk aan de
      waarde van de goederen als bedoeld in [artikel 2][ref2], welke door die aandelen of rechten middellijk
      of onmiddellijk worden vertegenwoordigd, met dien verstande dat de waarde van de goederen, bedoeld in
      [artikel 15, eerste lid, onderdeel y][ref3], buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '11.1'
    text: |-
      Bij verkrijging van een erfdienstbaarheid of van een recht van erfpacht, opstal of beklemming wordt de waarde
      vermeerderd met die van de canon, de retributie of de huur, met dien verstande dat de som van beide waarden niet
      hoger wordt gesteld dan de waarde van de zaak waarop het recht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij verkrijging van eigendom, bezwaard met een erfdienstbaarheid of met een recht van erfpacht, opstal of
      beklemming, wordt de waarde verminderd met die van de canon, de retributie of de huur.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: '11.3'
    text: |-
      De waarde van de canon, de retributie of de huur wordt bepaald volgens bij algemene maatregel van bestuur te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: '11.4'
    text: 'Het tweede lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: 11.4.a
    text: |-
      eigendom wordt verkregen door een levering onder voorbehoud van een erfdienstbaarheid, een recht van erfpacht of
      een recht van opstal ten behoeve van diegene die de eigendom vervreemdt; of
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: 11.4.b
    text: |-
      eigendom wordt verkregen, welke is bezwaard met een erfdienstbaarheid, een recht van erfpacht of een recht van
      opstal, indien het desbetreffende beperkte recht was gevestigd tegelijk met of binnen drie jaar voorafgaand aan de
      verkrijging en ter zake van de vestiging van het beperkte recht of een daarmee samenhangende verkrijging van bloot
      eigendom de vrijstelling, bedoeld in [artikel 15, eerste lid, onderdeel h][ref1], van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '11.5'
    text: |-
      Wanneer een verkrijging als bedoeld in het vierde lid wordt gevolgd door een verkrijging als bedoeld in het eerste
      lid, door dezelfde verkrijger of een rechtsopvolger onder algemene titel en met betrekking tot dezelfde onroerende
      zaak, wordt de maatstaf van heffing bij de opvolgende verkrijging verminderd met het bedrag waarover bij de vorige
      verkrijging:
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: 11.5.a
    text: overdrachtsbelasting was verschuldigd welke niet in mindering heeft gestrekt van schenk- of erfbelasting; of
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
  - number: 11.5.b
    text: |-
      omzetbelasting was verschuldigd welke op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref1] in het
      geheel niet in aftrek kon worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '12.1'
    text: |-
      Bij verkrijging krachtens verdeling wordt de waarde verminderd met die van het aandeel van de verkrijger of van
      zijn rechtsvoorganger onder algemene titel in de verdeelde goederen als zijn bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '12.2'
    text: |-
      De vermindering met de waarde van het aandeel van een rechtsvoorganger vindt, ingeval aan verschillende
      rechtverkrijgenden onder algemene titel goederen als zijn bedoeld in [artikel 2][ref1] worden toegedeeld, voor
      iedere toedeling plaats naar evenredigheid van de waarde van het toegedeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '12.3'
    text: |-
      Het eerste en het tweede lid blijven buiten toepassing, voor zover de gerechtigdheid tot de verdeelde
      goederen is ontstaan door inbreng in een vennootschap met toepassing van de vrijstelling, bedoeld in
      [artikel 15, eerste lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '13.1'
    text: |-
      In geval van verkrijging binnen zes maanden na een vorige verkrijging van dezelfde goederen door een ander
      wordt de waarde verminderd met het bedrag waarover ter zake van de vorige verkrijging was verschuldigd hetzij
      overdrachtsbelasting welke niet in mindering heeft gestrekt van schenk- of erfbelasting, hetzij omzetbelasting
      welke in het geheel niet op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref1] in aftrek kon worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
  - number: '13.2'
    text: |-
      Voor de toepassing van het eerste lid worden aandelen of rechten, als bedoeld in [artikel 4, eerste lid][ref1], en
      de daardoor middellijk of onmiddellijk vertegenwoordigde goederen als dezelfde goederen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kan, indien de ontwikkelingen van de vastgoedmarkt daartoe aanleiding geven,
      in afwijking van het eerste lid tijdelijk een afwijkende termijn worden vastgesteld waarbij voor woningen en niet-
      woningen een verschillende termijn gehanteerd kan worden en voor zover nodig kan worden voorzien in overgangsrecht.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel13
  - number: '13.4'
    text: |-
      In het geval van een verkrijging binnen zes maanden na een vorige verkrijging van dezelfde
      goederen door een ander waarbij ter zake van die vorige verkrijging het tarief, genoemd in
      [artikel 14, tweede, derde, vierde of zevende lid][ref1], is toegepast, wordt, in afwijking van het eerste lid,
      het bedrag aan belasting verminderd met het bedrag aan belasting dat ter zake van de vorige verkrijging was
      verschuldigd en welke niet in mindering heeft gestrekt van schenk- of erfbelasting. Het verminderde bedrag aan
      belasting is niet lager dan nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel14
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '14'
        hoofdstuk: II
        afdeling: '3'
  - number: '14.1'
    text: De belasting bedraagt 10,4 percent.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid bedraagt de belasting 2 percent voor de verkrijging door een natuurlijk
      persoon van een woning of rechten waaraan deze is onderworpen, of van rechten van lidmaatschap als
      [bedoeld in artikel 4, eerste lid, onderdeel b][ref1], voor zover deze laatste rechten betrekking hebben op een
      woning, als de verkrijger de woning na de verkrijging anders dan tijdelijk als hoofdverblijf gaat gebruiken en
      dit overeenkomstig [artikel 15a][ref2], voorafgaand aan de verkrijging duidelijk, stellig en zonder voorbehoud
      verklaart in een schriftelijke verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: 15a
        hoofdstuk: II
        afdeling: '3'
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid bedraagt de belasting 2 percent over de waardevermeerdering, bedoeld in
      [artikel 9, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel9
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: '14.4'
    text: |-
      In afwijking van het eerste lid bedraagt de belasting 2 percent voor de verkrijging door een wooncoöperatie als
      bedoeld in [artikel 18a van de Woningwet][ref1] van een woning of rechten waaraan deze is onderworpen, of van
      rechten van lidmaatschap als bedoeld in [artikel 4, eerste lid, onderdeel b][ref2], voor zover deze laatste rechten
      betrekking hebben op een woning, als die wooncoöperatie de woning verkrijgt van een toegelaten instelling als
      bedoeld in [artikel 19 van de Woningwet][ref3], mits de vervreemding door de toegelaten instelling, die krachtens
      [artikel 27 aanhef, en eerste lid, onderdeel a, van de Woningwet][ref4] onderhevig is aan goedkeuring door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, is goedgekeurd in het kader van een experiment als bedoeld
      in [artikel 120a van die wet][ref5]. Bij of krachtens algemene maatregel van bestuur kunnen nadere voorwaarden
      worden gesteld.


