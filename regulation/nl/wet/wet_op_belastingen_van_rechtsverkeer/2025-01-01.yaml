  - number: 15.1.e
    text: 'krachtens inbreng van een onderneming in een vennootschap, in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.e.1°
    text: |-
      bij inbreng in een vennootschap die geen in aandelen verdeeld kapitaal heeft, mits: - ter zake van de inbreng de
      inbrenger wordt bijgeschreven op de kapitaalrekening van de vennootschap voor een bedrag dat ten minste 90 percent
      is van de waarde van het vermogen van de ingebrachte onderneming; en
        - de ingebrachte onderneming niet heeft behoord tot het vermogen van een rechtspersoon als bedoeld in
      [artikel 4, eerste lid, onderdeel a][ref1], tenzij deze rechtspersoon verschillende ondernemingen bezit of heeft
      bezeten en de bezittingen van de ingebrachte onderneming niet zouden leiden tot het aanmerken van de rechtspersoon
      als een rechtspersoon als bedoeld in [artikel 4, eerste lid, onderdeel a][ref2], wanneer de ingebrachte onderneming
      de enige onderneming van de rechtspersoon zou zijn. Onder kapitaalrekening wordt verstaan de rekening op de
      balans van de vennootschap waarop de deelgerechtigdheid van de vennoot in het vermogen van de vennootschap wordt
      opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
