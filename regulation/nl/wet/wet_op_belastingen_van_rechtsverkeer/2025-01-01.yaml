        afdeling: '1'
  - number: '14.6'
    text: |-
      De belasting van 2 percent, genoemd in het tweede en vierde lid, is eveneens van toepassing op aanhorigheden
      die tot de woning behoren, indien zij gelijktijdig met deze woning worden verkregen en dat belastingtarief van
      toepassing is op die woning.
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel14
  - number: '14.7'
    text: |-
      In afwijking van het eerste lid bedraagt de belasting 4 percent indien de vrijstelling, bedoeld in
      [artikel 15, eerste lid, onderdeel a, en zesde lid][ref1], buiten toepassing blijft op grond van artikel 15,
      elfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
