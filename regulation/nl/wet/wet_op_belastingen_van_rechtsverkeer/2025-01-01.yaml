    text: de verkrijger een meerderjarig natuurlijk persoon jonger dan vijfendertig jaar is;
    url: https://wetten.overheid.nl/BWBR0002740/2025-01-01#Artikel15
  - number: 15.1.p.2°
    text: |-
      de verkrijger deze vrijstelling niet eerder heeft toegepast en dit overeenkomstig [artikel 15a][ref1], voorafgaand
      aan de verkrijging duidelijk, stellig en zonder voorbehoud verklaart in een schriftelijke verklaring; en


