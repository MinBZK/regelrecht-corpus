articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Vreemdelingenzaken en Integratie;

      b. gemeente: een gemeente, niet zijnde een gemeente als bedoeld in
      [artikel 1, aanhef en onder b, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1] en als
      bedoeld in de [Regeling inburgering oudkomers G25 2006][ref2];

      c. college: het college van burgemeesters en wethouders van een gemeente;

      d. samenwerkingsverband: een openbaar lichaam of gemeenschappelijk orgaan als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref3] waaraan de deelnemende gemeenten de hen ingevolge deze
      regeling toekomende rechten en de ingevolge deze regeling op hen rustende verplichtingen hebben overgedragen;

      e. bestuur: het bestuur van een samenwerkingsverband;

      f. oudkomer:

      1°. een persoon die 18 jaar of ouder is, die buiten Nederland is geboren en behoort tot een etnische
      minderheidsgroep, die rechtmatig in Nederland verblijft anders dan voor een tijdelijk doel als bepaald
      bij of krachtens de [Wet inburgering nieuwkomers][ref4], en die niet verplicht is om op grond van de
      [Wet inburgering nieuwkomers][ref5] een inburgeringsprogramma te volgen;

      2°. een geestelijk bedienaar als bedoeld in de
      [Regeling aanwijzing bijzondere categorieën vreemdelingen ten behoeve van inburgering][ref6], die niet verplicht
      is om op grond van de [Wet inburgering nieuwkomers][ref7] een inburgeringsprogramma te volgen;

      g. inburgeringsprogramma: een programma dat de oudkomer volgt waarbij het onderdeel Nederlands als tweede taal
      wordt gekoppeld aan onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning of
      sociale activering;

      h. bijdrage: de financiële bijdrage, bedoeld in [artikel 2][ref8];

      i. prognose: het aantal oudkomers dat naar de verwachting van het college in de periode van 1 januari tot en met 30
      juni 2006 zal aanvangen met een inburgeringsprogramma;

      j. budget: het door de Minister vastgestelde budget dat beschikbaar is voor de bevoorschotting van gemeenten en
      samenwerkingsverbanden ten behoeve van de periode van 1 januari tot en met 30 juni 2006;

      k. monitor: het door de Minister vastgestelde model-document aan de hand waarvan het college of het bestuur de
      Minister informatie verschaft over de wijze waarop de gemeente of het samenwerkingsverband invulling heeft gegeven
      aan de inburgering van oudkomers en de resultaten ervan en aan de hand waarvan de hoogte van de bijdrage wordt
      vastgesteld.


