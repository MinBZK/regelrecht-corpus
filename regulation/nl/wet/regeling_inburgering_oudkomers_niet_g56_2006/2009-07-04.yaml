  - number: '2'
    text: |-
      1 De Minister kan aan een gemeente of een samenwerkingsverband, onder de in deze regeling genoemde voorwaarden,
      een financiële bijdrage verlenen teneinde de gemeente of het samenwerkingsverband in staat te stellen oudkomers
      die in een maatschappelijke achterstandssituatie verkeren, waaronder in het bijzonder diegenen die behoren tot
      de groep werklozen, opvoeders of geestelijk bedienaren, deel te laten nemen aan een inburgeringsprogramma en dit
      inburgeringsprogramma te laten afronden.

      2 De bijdrage wordt beschikbaar gesteld onder voorbehoud van autorisatie door de begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0019120/2009-07-04#Artikel2
  - number: '3'
    text: |-
      1 Indien een college of een bestuur in aanmerking wenst te komen voor verlening van een bijdrage, dient het college
      of het bestuur binnen zes weken na inwerkingtreding van deze regeling een aanvraag in. De aanvraag gaat vergezeld
      van de prognose(s).

      2 De Minister beoordeelt alle ingediende aanvragen gezamenlijk en verleent per aanvraag voorschotten op de
      bijdrage. Het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 bestaat uit een
      bijdrage voor de vaste kosten en een bijdrage voor de variabele kosten en wordt vastgesteld aan de hand van het
      bepaalde in het derde tot en met het vijfde lid. Het voorschot met betrekking tot de periode van 1 juli tot en met
      31 december 2006 wordt ambtshalve vastgesteld.

      3 De hoogte van het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 voor de bijdrage
      voor de vaste kosten bedraagt € 1.200, vermenigvuldigd met de prognose(s). De hoogte van dit voorschot is ten
      minste € 6.000 en ten hoogste € 24.000. Indien de aanvraag is ingediend door een samenwerkingsverband is de hoogte
      van dit voorschot ten minste € 6.000, vermenigvuldigd met het aantal deelnemende gemeenten, en ten hoogste €
      24.000, vermenigvuldigd met het aantal deelnemende gemeenten.

      4 De hoogte van het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 voor de bijdrage
      voor de variabele kosten bedraagt € 5.100, vermenigvuldigd met de prognose(s).

      5 Het bepaalde in het derde en vierde lid is van toepassing indien het budget toereikend is. Indien het budget
      niet toereikend is, bepaalt de Minister het relatieve aandeel van de ingediende prognose(s) in het totaal van de
      prognoses, aan de hand waarvan de Minister vervolgens de ingediende prognoses neerwaarts bijstelt. De hoogte van
      het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 wordt in dat geval vastgesteld
      overeenkomstig de bijgestelde prognoses, vermenigvuldigd met de in het derde en vierde lid genoemde bedragen.

      6 De beschikking tot verlening van het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni
      2006 wordt binnen tien weken na inwerkingtreding van deze regeling aan het college bekendgemaakt.

      7 De beschikking tot verlening van het voorschot met betrekking tot de periode van 1 juli tot en met 31 december
      2006 wordt voor 1 juli 2006 aan het college bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0019120/2009-07-04#Artikel3
  - number: '4'
    text: |-
      1 Het college of het bestuur stelt het inburgeringsprogramma vast, waarbij zoveel mogelijk wordt aangesloten bij de
      persoonlijke situatie van de desbetreffende oudkomer.

      2 Het inburgeringsprogramma vangt aan in 2006 en is op uiterlijk 31 december 2007 afgerond.

      3 Het college of het bestuur draagt er zorg voor dat een inburgeringsprogramma ten minste 300 contacturen omvat.
    url: https://wetten.overheid.nl/BWBR0019120/2009-07-04#Artikel4
  - number: '5'
    text: |-
      1 Het college of het bestuur sluit een overeenkomst met de oudkomer die een inburgeringsprogramma gaat volgen. De
      datum van ondertekening van de overeenkomst geldt als aanvangsdatum van het inburgeringsprogramma.

      2 De overeenkomst bevat ten minste bepalingen met betrekking tot:

      a. het doel van het inburgeringsprogramma;

      b. de onderdelen van het inburgeringsprogramma;

      c. het aantal contacturen van het inburgeringsprogramma;

      d. de aard en de omvang van de individuele begeleiding;

      e. de verplichtingen van het college of het bestuur;

      f. de verplichtingen van de oudkomer;

      g. de informatieoverdracht tussen het college of het bestuur, de bij het aanbieden van het inburgeringsprogramma
      betrokken instellingen en de oudkomer met betrekking tot de voortgang van het inburgeringsprogramma;

      h. de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst door de oudkomer.

      3 Het college of het bestuur sluit op grond van deze regeling met een oudkomer slechts één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0019120/2009-07-04#Artikel5
  - number: '6'
    text: |-
      1 Het college of het bestuur draagt er zorg voor dat de oudkomer met wie een overeenkomst als bedoeld in
      [artikel 5][ref1] is gesloten een begintoets en een eindtoets aflegt aan de hand waarvan het niveau Nederlands als
      tweede taal van de oudkomer wordt vastgesteld.

      2 Voor de begintoets en de eindtoets wordt uitsluitend gebruik gemaakt van de hierna volgende combinaties van
      toetsen:

      a. de Intaketoets NT2 als begintoets met de NT2-Profieltoets als eindtoets; of

      b. de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.


      [ref1]: https://wetten.overheid.nl/BWBR0019120#Artikel5
