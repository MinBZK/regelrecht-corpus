  - number: '8'
    text: |-
      1 De Minister stelt de bijdrage voor een gemeente of een samenwerkingsverband vast aan de hand van de in
      [artikel 7, eerste lid][ref1], bedoelde informatie en de in [artikel 7, vierde lid][ref2], bedoelde verklaring
      omtrent de getrouwheid.

      2 De hoogte van de bijdrage voor de vaste kosten voor een gemeente of samenwerkingsverband wordt als volgt
      vastgesteld: € 1.200 voor iedere oudkomer met wie in 2006 een overeenkomst als bedoeld in [artikel 5][ref3] is
      gesloten, tot ten hoogste het bedrag van de verleende voorschoten voor de vaste kosten.

      3 De hoogte van de bijdrage voor de variabele kosten voor een gemeente of samenwerkingsverband wordt als volgt
      vastgesteld:

      a. € 1.375 voor iedere oudkomer met wie in 2006 een overeenkomst als bedoeld in [artikel 5][ref4] is gesloten; en

      b. € 6.000 voor iedere oudkomer die, evenals het college, aan de verplichtingen, genoemd in de overeenkomst,
      bedoeld in [artikel 5][ref5], heeft voldaan en die een begintoets en uiterlijk 31 december 2007 een eindtoets als
      bedoeld in [artikel 6][ref6] is afgenomen.

      4 Het aantal oudkomers dat de Minister bij het vaststellen van de bijdrage betrekt, kan het in de beschikkingen tot
      verlening van het voorschot genoemde aantal oudkomers niet overtreffen.


