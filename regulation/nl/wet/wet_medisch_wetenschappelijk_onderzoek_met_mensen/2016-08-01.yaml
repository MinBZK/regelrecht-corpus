  - number: '33.3'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn misdrijven; de in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel33
  - number: '37.1'
    text: |-
      Onze Minister zendt binnen 4 jaar na de inwerkingtreding van deze wet, en vervolgens telkens na 5 jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel37
  - number: '37.2'
    text: |-
      Het verslag, bedoeld in [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], maakt
      onderdeel uit van het in het eerste lid bedoelde verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '38'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel38
  - number: '39'
    text: 'Deze wet wordt aangehaald als: Wet medisch-wetenschappelijk onderzoek met mensen.'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel39
