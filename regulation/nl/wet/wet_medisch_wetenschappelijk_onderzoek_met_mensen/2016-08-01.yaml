  - number: '2.1'
    text: Wetenschappelijk onderzoek wordt verricht overeenkomstig een daartoe opgesteld onderzoeksprotocol.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: '2.2'
    text: 'Over dit onderzoeksprotocol moet een positief oordeel zijn verkregen:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: 2.2.a
    text: van een commissie die daartoe bevoegd is, wanneer onderdeel b, onder 2°, 3° en 4°, niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: 2.2.b
    text: 'van de centrale commissie, wanneer het betreft:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: 2.2.b.1°
    text: een beslissing op een administratief beroep;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: 2.2.b.2°
    text: |-
      een wetenschappelijk onderzoek als bedoeld in de [tweede volzin van artikel 4 , eerste lid][ref1], dat niet aan de
      betrokken proefpersoon ten goede kan komen en waarbij diens toestand opzettelijk wordt gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel4
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '4'
        paragraaf: '2'
  - number: 2.2.b.3°
    text: |-
      een wetenschappelijk onderzoek waarvan de beoordeling ingevolge [artikel 19][ref1] bij de centrale commissie
      berust;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel19
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '19'
        paragraaf: '6'
  - number: 2.2.b.4°
    text: |-
      overige bij algemene maatregel van bestuur aangewezen vormen van wetenschappelijk onderzoek waarvan beoordeling
      door de centrale commissie gewenst is gelet op de aan het onderzoek verbonden maatschappelijke, ethische of
      juridische aspecten.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
  - number: '2.3'
    text: |-
      De beoordeling door de onderscheiden commissies geschiedt op de grondslag van de [paragrafen 2][ref1] en [3][ref2]
      en de [artikelen 9][ref3], [10][ref4], [11][ref5] en [12][ref6] en, voorzover het wetenschappelijk onderzoek met
      geneesmiddelen betreft, [paragraaf 5a][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009408#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0009408#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0009408#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0009408#Paragraaf5a
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2
