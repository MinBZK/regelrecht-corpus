        artikel: '16'
        paragraaf: '6'
  - number: 1.1.i
    text: |-
      centrale commissie: de commissie bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel14
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '14'
        paragraaf: '6'
  - number: 1.1.j
    text: |-
      College: het College ter beoordeling van geneesmiddelen, genoemd in
      [artikel 2, eerste lid, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '2'
  - number: 1.1.k
    text: 'andere lidstaten: andere lidstaten van de Europese Unie dan Nederland;'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.l
    text: |-
      het Europees Bureau voor de geneesmiddelenbeoordeling: het Europees Bureau voor de geneesmiddelenbeoordeling
      opgericht bij [verordening nr. (EEG) 2309/93](31993R2309) van de Raad van 22 juli 1993 tot vaststelling van
      communautaire procedures voor het verlenen van vergunningen voor en het toezicht op geneesmiddelen voor menselijk
      en diergeneeskundig gebruik en tot het oprichten van een Europees Bureau voor de geneesmiddelenbewaking, (PbEG
      L 214);
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.m
    text: |-
      gespreid uitgevoerd wetenschappelijk onderzoek: wetenschappelijk onderzoek dat volgens één bepaald protocol door
      meer dan een onderzoeker wordt uitgevoerd op verschillende locaties;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.n
    text: |-
      wetenschappelijk onderzoek met geneesmiddelen: wetenschappelijk onderzoek met geneesmiddelen dat bedoeld is om de
      klinische, farmacologische of andere farmacodynamische effecten van een of meer geneesmiddelen voor onderzoek vast
      te stellen of te bevestigen of eventuele bijwerkingen van een of meer geneesmiddelen voor onderzoek te signaleren
      of de resorptie, de distributie, het metabolisme en de uitscheiding van een of meer geneesmiddelen voor onderzoek
      te bestuderen teneinde de veiligheid of werkzaamheid van deze geneesmiddelen vast te stellen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.o
    text: |-
      geneesmiddel voor onderzoek: een farmaceutische vorm van een werkzame stof of een placebo die bij een
      wetenschappelijk onderzoek met geneesmiddelen wordt onderzocht of als referentie wordt gebruikt, met inbegrip van
      een geneesmiddel waarvoor een vergunning voor het in de handel brengen is afgegeven maar dat op een andere manier
      wordt gebruikt of samengesteld, geformuleerd of verpakt dan de toegelaten vorm, voor een niet toegelaten indicatie
      wordt gebruikt of wordt gebruikt om nadere informatie over een toegelaten toepassing te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.p
    text: |-
      onderzoekersdossier: het geheel van de klinische en niet klinische gegevens over het geneesmiddel of de
      geneesmiddelen voor onderzoek die relevant zijn voor de bestudering van het geneesmiddel of de geneesmiddelen voor
      onderzoek bij mensen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.q
    text: |-
      ongewenst voorval: een schadelijk verschijnsel bij een proefpersoon dat niet noodzakelijk met het wetenschappelijk
      onderzoek verband houdt;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.r
    text: |-
      bijwerking: een schadelijke en niet gewenste reactie op een geneesmiddel voor onderzoek, ongeacht de toegediende
      dosis;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.s
    text: |-
      ernstig ongewenst voorval: een ongewenst voorval dat dodelijk is, levensgevaar oplevert voor de proefpersoon,
      opname in een ziekenhuis of verlenging van de opname noodzakelijk maakt, blijvende of significante invaliditeit of
      arbeidsongeschiktheid veroorzaakt dan wel zich uit in een aangeboren afwijking of misvorming;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.t
    text: |-
      ernstige bijwerking: een bijwerking die dodelijk is, levensgevaar oplevert voor de proefpersoon, opname in
      een ziekenhuis of verlenging van de opname noodzakelijk maakt, blijvende of significante invaliditeit of
      arbeidsongeschiktheid veroorzaakt dan wel zich uit in een aangeboren afwijking of misvorming;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.u
    text: |-
      onverwachte bijwerking: een bijwerking waarvan de aard en de ernst niet overeenkomen met de informatie over het
      product zoals opgenomen in het onderzoekersdossier voor een geneesmiddel voor onderzoek waarvoor geen vergunning
      is afgegeven of in het geval van een geneesmiddel waarvoor een marktvergunning is afgegeven, de in de bijsluiter
      vervatte samenvatting van de kenmerken van het product;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.v
    text: |-
      schriftelijke toestemming: geïnformeerde, schriftelijke, gedagtekende en ondertekende toestemming om aan een
      wetenschappelijk onderzoek deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: '1.2'
    text: |-
      Het onderwerpen van personen aan handelingen en het opleggen aan personen van een bepaalde gedragswijze uitsluitend
      ten behoeve van de hulpverlening aan hen is onder het eerste lid, onder b, niet begrepen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is niet van toepassing op wetenschappelijk onderzoek voor het verrichten waarvan een vergunning is
      vereist op grond van de [Wet op het bevolkingsonderzoek][ref1] en, met uitzondering van de [artikelen 7][ref2]
      en [9][ref3] en de [artikelen 8][ref4], [11][ref5] en [33][ref6], voor zover deze betrekking hebben op
      [artikel 7][ref7], op wetenschappelijk onderzoek waarvan het onderzoeksprotocol ingevolge de [Embryowet][ref8] een
      positief oordeel heeft gekregen van de ingevolge [artikel 3 van de Embryowet][ref9] bevoegde commissie. Op oordelen
      van de ingevolge artikel 3 van de Embryowet bevoegde commissie is [artikel 23][ref10] van deze wet van toepassing.


