bwb_id: BWBR0009408
url: https://wetten.overheid.nl/BWBR0009408/2016-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met de artikelen 10 en 11 van de Grondwet,
    wenselijk is regelen te stellen met betrekking tot medisch-wetenschappelijk onderzoek met mensen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.b
    text: |-
      wetenschappelijk onderzoek: medisch-wetenschappelijk onderzoek waarvan deel uitmaakt het onderwerpen van personen
      aan handelingen of het opleggen aan personen van een bepaalde gedragswijze;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.c
    text: 'proefpersoon: de persoon, bedoeld onder b;'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.d
    text: |-
      onderzoeksprotocol: de volledige beschrijving van een voorgenomen wetenschappelijk onderzoek waaronder de
      doelstellingen, de opzet, de methodologie, de statistische aspecten en de organisatie van het wetenschappelijk
      onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.e
    text: |-
      facilitaire instelling: instelling of bedrijf waar handelingen ter uitvoering van een wetenschappelijk onderzoek
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.f
    text: |-
      degene die het wetenschappelijk onderzoek verricht: een persoon, bedrijf, instelling of organisatie die de
      verantwoordelijkheid op zich neemt voor het starten, het beheer of de financiering van het wetenschappelijk
      onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
  - number: 1.1.g
    text: |-
      degene die het wetenschappelijk onderzoek uitvoert: een arts of een in [artikel 3, onder e][ref1], bedoelde
      persoon, die verantwoordelijk is voor de uitvoering van het wetenschappelijk onderzoek op een bepaalde locatie.
      Indien de feitelijke uitvoering geschiedt door een werknemer of een andere hulppersoon, wordt degene die van deze
      persoon gebruik maakt aangemerkt als degene die het onderzoek uitvoert;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel3
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '3'
        paragraaf: '2'
  - number: 1.1.h
    text: |-
      commissie: een krachtens [artikel 16][ref1] erkende commissie;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel1
    references:
      - id: ref1
