  - number: 2a
    text: |-
      Wetenschappelijk onderzoek, met inbegrip van gespreid uitgevoerd wetenschappelijk onderzoek, wordt beoordeeld door
      één bevoegde commissie daartoe aangewezen door degene die het onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel2a
  - number: '3'
    text: |-
      De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie kan slechts een positief oordeel over een
      onderzoeksprotocol geven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 3.a
    text: |-
      redelijkerwijs aannemelijk is dat het wetenschappelijk onderzoek tot de vaststelling van nieuwe inzichten op het
      gebied van de medische wetenschap zal leiden;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.b
    text: |-
      redelijkerwijs aannemelijk is dat de vaststelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek dan wetenschappelijk onderzoek met proefpersonen of door het verrichten van onderzoek
      van minder ingrijpende aard kan geschieden;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.c
    text: |-
      redelijkerwijs aannemelijk is dat het met het onderzoek te dienen belang van de proefpersoon en andere huidige of
      toekomstige patiënten in evenredige verhouding staat tot de bezwaren en het risico voor de proefpersoon;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.d
    text: het onderzoek voldoet aan de eisen van een juiste methodologie van wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.e
    text: |-
      het onderzoek wordt uitgevoerd in daarvoor geschikte instellingen en door of onder leiding van personen die
      deskundig zijn op het gebied van wetenschappelijk onderzoek en waarvan er ten minste één deskundig is op het gebied
      van de verrichtingen die ter uitvoering van het onderzoek ten aanzien van de proefpersoon plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.f
    text: |-
      redelijkerwijs aannemelijk is dat aan de proefpersoon te betalen vergoedingen niet in onevenredige mate van invloed
      zijn op het geven van toestemming voor deelneming aan het onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.g
    text: |-
      degene die het wetenschappelijk onderzoek uitvoert en de instelling waar dit onderzoek plaatsvindt, een vergoeding
      ontvangen die niet hoger is dan een bedrag dat in redelijke verhouding staat tot de aard, de omvang en het doel van
      het wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.h
    text: |-
      in het onderzoeksprotocol duidelijk is aangegeven in hoeverre het wetenschappelijk onderzoek aan de betrokken
      proefpersoon ten goede kan komen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.i
    text: |-
      in het onderzoeksprotocol op het wetenschappelijk onderzoek toegesneden criteria voor de werving van proefpersonen
      zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.j
    text: |-
      de resultaten van het onderzoek door de centrale commissie openbaar toegankelijk zullen worden gemaakt, tenzij
      daartegen bezwaar wordt gemaakt door degene die het wetenschappelijk onderzoek verricht;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3.k
    text: het onderzoek ook overigens voldoet aan redelijkerwijs daaraan te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3
  - number: 3a.1
    text: |-
      Een commissie kan een door haar gegeven positief oordeel over een onderzoeksprotocol opschorten of intrekken
      indien er gegronde redenen zijn om aan te nemen dat voortzetting van het wetenschappelijk onderzoek zou leiden tot
      onaanvaardbare risico’s voor de proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3a
  - number: 3a.2
    text: |-
      Indien er gegronde redenen zijn om aan te nemen dat voortzetting van het wetenschappelijk onderzoek zou leiden
      tot onaanvaardbare risico’s voor de proefpersoon, kan de centrale commissie of Onze Minister, ingeval het vijfde
      lid van [artikel 13i][ref1] van toepassing is, de uitvoering van het wetenschappelijk onderzoek opschorten tot
      een commissie een nader positief oordeel heeft gegeven over dit onderzoeksprotocol. De centrale commissie of Onze
      Minister, ingeval het vijfde lid van artikel 13i van toepassing is, meldt de opschorting van de uitvoering van het
      onderzoek aan de commissie die als laatste een positief oordeel heeft gegeven over het onderzoeksprotocol en aan
      degene die het wetenschappelijk onderzoek verricht en degene die het onderzoek uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 3a.3
    text: |-
      Behoudens ingeval van dreigend gevaar, stelt de commissie, de centrale commissie of Onze Minister, ingeval het
      vijfde lid van [artikel 13i][ref1] van toepassing is, alvorens het positieve oordeel op te schorten of in te
      trekken, dan wel de uitvoering van het wetenschappelijke onderzoek op te schorten, degene die het wetenschappelijk
      onderzoek verricht of degene die het wetenschappelijk onderzoek uitvoert, in de gelegenheid binnen één week zijn
      zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 3a.4
    text: |-
      Indien een commissie besluit een door haar gegeven positief oordeel over een onderzoeksprotocol inzake
      wetenschappelijk onderzoek met geneesmiddelen op te schorten of in te trekken, stelt zij de centrale commissie of
      Onze Minister, ingeval [artikel 13i, vijfde lid][ref1], van toepassing is, en het College hiervan op de hoogte,
      onder opgaaf van redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 3a.5
    text: |-
      Het College stelt onder opgaaf van redenen het Europese Bureau voor de geneesmiddelenbeoordeling en de Europese
      Commissie onmiddellijk op de hoogte van de opschorting of intrekking van een gegeven positief oordeel over een
      onderzoeksprotocol inzake een wetenschappelijk onderzoek met geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel3a
  - number: '4.1'
    text: |-
      Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen die de leeftijd van achttien jaar nog
      niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen ter zake. Dit verbod
      is niet van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan
      komen en op wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de
      proefpersoon behoort, kan worden verricht en waarvan voor hen de risico's verwaarloosbaar en de bezwaren minimaal
      zijn.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de betrokken proefpersoon zich bij een in het eerste lid, tweede volzin, bedoeld wetenschappelijk onderzoek
      verzet tegen een handeling waaraan hij wordt onderworpen of tegen een aan hem opgelegde gedragswijze, vindt het
      onderzoek niet plaats met die proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen van wie redelijkerwijs moet worden
      aangenomen dat zij gezien de feitelijke of juridische verhouding tot degene die het onderzoek verricht of uitvoert
      of degene die de proefpersonen werft, niet in vrijheid over deelneming daaraan kunnen beslissen. Dit verbod is niet
      van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan komen en op
      wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de proefpersoon
      behoort, kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel5
  - number: '6.1'
    text: 'Het is verboden wetenschappelijk onderzoek te verrichten:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.1.a
    text: |-
      indien de proefpersoon meerderjarig is, en onderdeel c niet van toepassing is: zonder de schriftelijke toestemming
      van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.1.b
    text: |-
      indien de proefpersoon minderjarig is doch de leeftijd van twaalf jaar heeft bereikt en onderdeel c niet van
      toepassing is: zonder schriftelijke toestemming van de betrokkene alsmede die van de ouders die het gezag
      uitoefenen of van zijn voogd;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.1.c
    text: |-
      indien de proefpersoon twaalf jaar of ouder is en niet in staat is tot een redelijke waardering van zijn belangen
      ter zake: zonder de schriftelijke toestemming van de ouders die het gezag uitoefenen of van de voogd dan wel
      indien hij meerderjarig is, van de wettelijke vertegenwoordiger van de betrokkene of, indien deze ontbreekt, van de
      persoon die daartoe door de betrokkene schriftelijk is gemachtigd of, bij het ontbreken van zodanig persoon, van de
      echtgenoot, geregistreerde partner of andere levensgezel van de betrokkene of, indien deze ontbreekt, de ouders van
      de betrokkene of, indien ook dezen ontbreken, de redelijkerwijs bereikbare meerderjarige kinderen dan wel, indien
      dezen eveneens ontbreken, de redelijkerwijs bereikbare meerderjarige broers en zussen van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.1.d
    text: |-
      indien de proefpersoon de leeftijd van twaalf jaar nog niet heeft bereikt: zonder de schriftelijke toestemming van
      de ouders die het gezag uitoefenen of van zijn voogd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.2'
    text: |-
      Als de betrokkene niet in staat is te schrijven, kan de toestemming mondeling worden gegeven in de aanwezigheid van
      ten minste één getuige.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.3'
    text: |-
      De vervangende toestemming van de in het eerste lid, onder c en d, genoemde personen geeft de vermoedelijke wil van
      de proefpersoon weer.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.4'
    text: |-
      Indien het wetenschappelijk onderzoek alleen kan worden uitgevoerd in noodsituaties waarin de ingevolge het eerste
      lid vereiste toestemming niet kan worden gegeven, en ten goede kan komen aan de persoon die in die noodsituatie
      verkeert, kunnen handelingen ter uitvoering ervan plaatsvinden zonder die toestemming zolang de omstandigheid die
      de verhindering van het geven van toestemming vormt, zich voordoet.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.5'
    text: |-
      Alvorens toestemming wordt gevraagd, draagt degene die het onderzoek uitvoert er zorg voor dat de persoon wiens
      toestemming is vereist, schriftelijk en desgewenst in een aan de toestemming voorafgaand onderhoud wordt ingelicht
      over:
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.5.a
    text: het doel, de aard en de duur van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.5.b
    text: de risico's die het onderzoek voor de gezondheid van de proefpersoon met zich zou brengen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.5.c
    text: |-
      de risico's die het tussentijds beëindigen van het onderzoek voor de gezondheid van de proefpersoon met zich zou
      brengen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: 6.5.d
    text: de bezwaren die het onderzoek voor de proefpersoon met zich zou kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.6'
    text: |-
      De inlichtingen worden op zodanige wijze verstrekt dat redelijkerwijs zeker is dat de betrokkene deze naar haar
      inhoud heeft begrepen. Hij krijgt een zodanige bedenktijd dat hij op grond van deze inlichtingen een zorgvuldig
      overwogen beslissing omtrent de gevraagde toestemming kan geven. Bij ministeriële regeling kunnen nadere eisen
      worden gesteld aan de inlichtingen die aan betrokkene worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.7'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, draagt ervoor zorg dat proefpersonen die de leeftijd van
      twaalf jaar nog niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen
      ter zake, over het onderzoek worden ingelicht door een daartoe geschoolde persoon op een wijze die past bij hun
      bevattingsvermogen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.8'
    text: |-
      De wijze waarop uitvoering wordt gegeven aan het bepaalde in dit artikel wordt vastgelegd in het
      onderzoeksprotocol.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '6.9'
    text: |-
      De proefpersoon dan wel, indien deze ingevolge dit artikel niet bevoegd is tot het geven van toestemming, degene
      die daartoe in zijn plaats bevoegd is, kan de toestemming te allen tijde, zonder opgaaf van redenen, intrekken. Hij
      is ter zake van de intrekking geen schadevergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel6
  - number: '7.1'
    text: |-
      Het wetenschappelijk onderzoek wordt slechts verricht indien op het tijdstip waarop het onderzoek aanvangt, een
      verzekering is gesloten die de bij algemene maatregel van bestuur aangewezen door het onderzoek veroorzaakte schade
      door dood of letsel van de proefpersoon dekt. De verzekering behoeft niet te dekken de schade waarvan op grond van
      de aard van het onderzoek zeker of nagenoeg zeker was dat deze zich zou voordoen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.2'
    text: |-
      Op de verplichting van de verzekeraar tot vergoeding van de schade, bedoeld in het eerste lid, zijn van
      [afdeling 6.1.10 van het Burgerlijk Wetboek][ref1] de [artikelen 95][ref2], [96, eerste lid][ref3], [97][ref4],
      [100 tot en met 102][ref5], [105 tot en met 107a, eerste lid][ref6], en [108][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel97
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel100
      [ref6]: https://wetten.overheid.nl/BWBR0005289#Artikel105
      [ref7]: https://wetten.overheid.nl/BWBR0005289#Artikel108
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '96'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '97'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '100'
      - id: ref6
        bwb_id: BWBR0005289
        artikel: '105'
      - id: ref7
        bwb_id: BWBR0005289
        artikel: '108'
  - number: '7.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter zake van de verzekering en ter zake van de omvang van
      de dekking van de verzekering nadere regelen gesteld. Krachtens algemene maatregel van bestuur te stellen regels
      betreffen slechts wijziging van in die maatregel opgenomen geldbedragen die naar hun aard met regelmaat wijziging
      behoeven. De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum van uitgifte
      van het Staatsblad, waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.4'
    text: De verzekering dekt uitsluitend de schade van natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.5'
    text: |-
      Indien naar het oordeel van de commissie die belast is met de beoordeling van het desbetreffende
      onderzoeksprotocol, aan het wetenschappelijk onderzoek voor de proefpersoon naar zijn aard geen risico’s verbonden
      zijn, kan zij bij positief oordeel over het onderzoeksprotocol de verrichter op diens verzoek ontheffing verlenen
      van de verplichting een verzekering te sluiten.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.6'
    text: |-
      Bij een onderzoek dat tot doel heeft in de kring der beroepsgenoten gebruikelijke handelingen op het gebied van
      de geneeskunst met elkaar te vergelijken, kan de commissie die belast is met de beoordeling van het desbetreffende
      onderzoeksprotocol, bij een positief oordeel de verrichter op diens verzoek ontheffing verlenen van de verplichting
      een verzekering te sluiten indien aan het onderzoek ten gevolge van het vergelijkende karakter daarvan naar het
      oordeel van de commissie voor de proefpersonen naar zijn aard hooguit verwaarloosbare risico’s verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.7'
    text: De wijze waarop uitvoering wordt gegeven aan het eerste en negende lid wordt vastgelegd in het onderzoeksprotocol.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.8'
    text: |-
      Is degene die het wetenschappelijk onderzoek uitvoert aansprakelijk voor de schade door dood of letsel van
      de proefpersoon, dan is mede aansprakelijk degene die het wetenschappelijk onderzoek verricht. Voor zover ter
      uitvoering van een wetenschappelijk onderzoek verrichtingen plaatsvinden in een facilitaire instelling, rust deze
      aansprakelijkheid, ook indien het onderzoek niet door die instelling wordt verricht of uitgevoerd, mede op die
      instelling.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.9'
    text: |-
      Het wetenschappelijk onderzoek wordt voorts slechts verricht indien op het tijdstip waarop het onderzoek aanvangt
      een verzekering is gesloten ter dekking van het risico van de in het achtste lid bedoelde aansprakelijkheid
      van degene die het onderzoek uitvoert of van degene die het onderzoek verricht, dan wel anderszins voldoende is
      gewaarborgd dat hun verplichtingen ter zake van hun aansprakelijkheid kunnen worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.10'
    text: |-
      Het eerste en negende lid zijn niet van toepassing ter zake van het verrichten van wetenschappelijk onderzoek door
      diensten, instellingen of bedrijven van de rijksoverheid die door Onze Minister zijn aangewezen. De benadeelde
      heeft jegens een dienst, instelling of bedrijf van de rijksoverheid die geen verzekering als bedoeld in het eerste
      lid heeft gesloten de rechten welke hij overeenkomstig dit artikel anders tegenover de verzekeraar zou hebben.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '7.11'
    text: |-
      De aansprakelijkheid van de uitvoerder of, in het geval bedoeld in het achtste lid, van degene die het
      wetenschappelijk onderzoek verricht of van de facilitaire instelling, kan niet worden beperkt of uitgesloten.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel7
  - number: '8.1'
    text: |-
      De verplichting zorg te dragen voor de nakoming van de [artikelen 2, eerste en tweede lid][ref1], en [7][ref2]
      rust op degene die het wetenschappelijk onderzoek verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel7
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      De verplichting zorg te dragen voor de nakoming van [artikel 2, eerste en tweede lid][ref1], rust in het geval
      bedoeld in [artikel 7, achtste lid, tweede volzin][ref2], mede op de facilitaire instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel7
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '7'
        paragraaf: '3'
  - number: '9'
    text: |-
      Degene die het wetenschappelijk onderzoek verricht, draagt er zorg voor dat de proefpersoon zich voor inlichtingen
      en advies betreffende het onderzoek kan wenden tot een in het onderzoeksprotocol aan te wijzen arts die niet bij de
      uitvoering van het onderzoek is betrokken of een andere deskundige die in staat moet worden geacht de proefpersoon
      adequaat van inlichtingen en advies betreffende het onderzoek te voorzien en die niet bij de uitvoering van het
      onderzoek is betrokken.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel9
  - number: '10.1'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, rapporteert alle ernstige ongewenste voorvallen, met
      uitzondering van de ernstige ongewenste voorvallen waarover volgens het onderzoeksprotocol geen onmiddellijke
      rapportage door degene die het wetenschappelijk onderzoek uitvoert, is vereist, onmiddellijk aan degene die het
      wetenschappelijk onderzoek verricht. De onmiddellijke rapportage wordt gevolgd door gedetailleerde schriftelijke
      rapporten, waarin de proefpersonen met codenummer worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: '10.2'
    text: |-
      Degene die het wetenschappelijk onderzoek verricht, rapporteert alle ernstige ongewenste voorvallen, met
      uitzondering van die ernstige ongewenste voorvallen waarover volgens het onderzoeksprotocol geen rapportage
      is vereist, aan de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie en, indien dit niet de centrale
      commissie is, in afschrift aan de centrale commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Tenzij in het onderzoeksprotocol andere termijnen zijn bepaald, geschiedt de rapportage, bedoeld in het tweede lid,
      zo spoedig mogelijk en:
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: 10.3.a
    text: |-
      binnen zeven dagen nadat degene die het wetenschappelijk onderzoek verricht kennis heeft genomen van de voorvallen,
      indien het voorvallen betreft die tot de dood van een proefpersoon hebben geleid of kunnen leiden, waarbij een
      aanvullende termijn van acht dagen geldt waarbinnen relevante informatie over de nasleep van het voorval wordt
      overgelegd;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: 10.3.b
    text: |-
      binnen vijftien dagen nadat degene die het wetenschappelijk onderzoek verricht kennis heeft genomen van de
      voorvallen, indien het andere voorvallen betreft.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: '10.4'
    text: |-
      Indien er tijdens het wetenschappelijk onderzoek gegronde redenen zijn om aan te nemen dat voortzetting van het
      wetenschappelijk onderzoek zou leiden tot onaanvaardbare risico’s voor de proefpersoon, schort degene die het
      wetenschappelijk onderzoek verricht de uitvoering van het onderzoek op tot een nader positief oordeel is verkregen
      van de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      Onder opgave van redenen doet degene die het wetenschappelijk onderzoek verricht aan de ingevolge
      [artikel 2, tweede lid][ref1], bevoegde commissie:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 10.5.a
    text: onmiddellijk mededeling van een beslissing tot opschorting van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: 10.5.b
    text: binnen vijftien dagen mededeling van een beslissing tot voortijdige beëindiging van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: '10.6'
    text: |-
      Voor de toepassing van dit artikel wordt onder ernstig ongewenst voorval mede verstaan een zodanig verschijnsel
      bij een proefpersoon dat zich naar het oordeel van degene die het wetenschappelijk onderzoek uitvoert tijdens
      het onderzoek zou hebben kunnen ontwikkelen tot een ernstig ongewenst voorval, maar waarbij dit ernstig ongewenst
      voorval zich als gevolg van ingrijpen niet heeft verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: '10.7'
    text: |-
      De centrale commissie brengt ieder kalenderjaar verslag uit van het aantal ernstige ongewenste voorvallen in
      het voorafgaande kalenderjaar, met uitzondering van die ernstige ongewenste voorvallen waarover volgens het
      onderzoeksprotocol geen rapportage is vereist.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel10
  - number: '11.1'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, draagt er zorg voor dat de proefpersoon tijdig wordt ingelicht
      over:
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel11
  - number: 11.1.a
    text: |-
      het bepaalde in de [artikelen 6, zesde lid, tweede volzin, en negende lid][ref1], [7][ref2], [9][ref3] en
      [12][ref4]; en


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009408#Artikel12
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009408
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009408
        artikel: '12'
        paragraaf: '5'
  - number: 11.1.b
    text: |-
      het verloop van het onderzoek, waaronder in ieder geval worden begrepen situaties als bedoeld in
      [artikel 10, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel10
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '10'
        paragraaf: '5'
  - number: '11.2'
    text: De verstrekte inlichtingen worden desgevraagd aangevuld.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel11
  - number: '11.3'
    text: |-
      De verplichtingen, bedoeld in het eerste en tweede lid, gelden tevens ten opzichte van de andere personen van wie
      op grond van [artikel 6][ref1] de toestemming is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel6
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '6'
        paragraaf: '2'
  - number: '12'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat de persoonlijke levenssfeer van de
      proefpersoon zoveel mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel12
  - number: '13'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat, alvorens de uitvoering van een
      onderzoek een aanvang neemt, degenen wier beroepsmatige medewerking nodig is bij de uitvoering van het onderzoek,
      over de aard en het doel van het onderzoek zijn ingelicht.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13
  - number: 13a
    text: |-
      Op wetenschappelijk onderzoek met geneesmiddelen is naast het bepaalde in de [paragrafen 1 tot en met 4][ref1] het
      bepaalde in deze paragraaf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '1'
  - number: 13b.1
    text: |-
      Wetenschappelijk onderzoek met geneesmiddelen, met inbegrip van onderzoek naar de biologische beschikbaarheid en de
      biologische equivalentie, is wat betreft opzet, uitvoering en rapportage in overeenstemming met de beginselen van
      goede klinische praktijken.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13b
  - number: 13b.2
    text: Bij of krachtens algemene maatregel van bestuur worden regels betreffende goede klinische praktijken vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13b
  - number: 13c
    text: |-
      Het is verboden in het kader van gentherapie wetenschappelijk onderzoek met geneesmiddelen te verrichten dat
      gericht is op modificatie van de kiembaan en de daarin vastgelegde genetische identiteit van de proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13c
  - number: 13d
    text: |-
      Onverminderd het bepaalde in[ paragraaf 2][ref1] kan de ingevolge [artikel 2, tweede lid][ref2], bevoegde commissie
      slechts een positief oordeel geven over een onderzoeksprotocol dat betrekking heeft op wetenschappelijk onderzoek
      met geneesmiddelen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13d.a
    text: |-
      degene die het wetenschappelijk onderzoek verricht of zijn wettelijk vertegenwoordiger op het grondgebied van de
      Europese Unie gevestigd is;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13d
  - number: 13d.b
    text: |-
      de geneesmiddelen voor onderzoek of in voorkomend geval de hulpmiddelen voor toediening, behoudens indien het
      wetenschappelijk onderzoek met geregistreerde geneesmiddelen betreft, gratis ter beschikking worden gesteld door
      degene die het wetenschappelijk onderzoek verricht;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13d
  - number: 13d.c
    text: |-
      een op grond van de [Wet op de beroepen in de individuele gezondheidszorg][ref1] geregistreerde arts of tandarts,
      werkzaam in de gezondheidszorg, verantwoordelijk is voor de medische verzorging en de medische beslissingen over
      de proefpersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 13e
    text: |-
      Onverminderd het bepaalde in [paragraaf 2][ref1] mag wetenschappelijk onderzoek met geneesmiddelen bij minderjarige
      proefpersonen slechts worden verricht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '2'
  - number: 13e.a
    text: |-
      het onderzoek van essentieel belang is om de resultaten te kunnen bevestigen van wetenschappelijk onderzoek met
      geneesmiddelen met personen die wel hun toestemming volgens deze wet kunnen geven of van andere onderzoeksmethoden
      en het onderzoek enig direct voordeel inhoudt voor de betrokken groep van patiënten;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
  - number: 13e.b
    text: |-
      de desbetreffende door het Europese Bureau voor de geneesmiddelenbeoordeling vastgestelde wetenschappelijke
      richtsnoeren in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
  - number: 13e.c
    text: |-
      het risico, bedoeld in [artikel 4][ref1], en de belastingsgraad specifiek worden gedefinieerd en permanent worden
      gecontroleerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel4
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '4'
        paragraaf: '2'
  - number: 13e.d
    text: |-
      de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie beschikt over expertise op het gebied van
      kindergeneeskunde of pediatrisch advies heeft ingewonnen inzake de klinische, ethische en psychosociale aspecten
      van het onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13e.e
    text: de belangen van de patiënt altijd prevaleren boven die van de wetenschap en de samenleving.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13e
  - number: 13f
    text: |-
      Onverminderd het bepaalde in [paragraaf 2][ref1] mag wetenschappelijk onderzoek met geneesmiddelen bij
      meerderjarige proefpersonen die niet in staat zijn tot een redelijke waardering van hun belangen ter zake, slechts
      worden uitgevoerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '2'
  - number: 13f.a
    text: |-
      het onderzoek van essentieel belang is om de resultaten te kunnen bevestigen van wetenschappelijk onderzoek
      met geneesmiddelen bij personen die wel volgens deze wet hun toestemming kunnen geven, of van andere
      onderzoeksmethoden, en het direct gerelateerd is aan een klinische toestand die levensbedreigend is of de
      gezondheid ondermijnt, en waarin de proefpersoon verkeert;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
  - number: 13f.b
    text: |-
      het risico, bedoeld in [artikel 4][ref1], en de belastingsgraad specifiek worden gedefinieerd en permanent worden
      gecontroleerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel4
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '4'
        paragraaf: '2'
  - number: 13f.c
    text: |-
      de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie beschikt over expertise op het gebied van de
      desbetreffende ziekte en de betrokken populatie of advies heeft ingewonnen inzake de klinische, ethische en
      psychosociale aspecten van de desbetreffende ziekte en populatie;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13f.d
    text: de belangen van de patiënt altijd prevaleren boven die van de wetenschap en de samenleving;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
  - number: 13f.e
    text: |-
      de redelijke verwachting bestaat dat de voordelen van toediening van het geneesmiddel voor onderzoek voor de
      patiënt in kwestie opwegen tegen de risico’s of dat aan de toediening in het geheel geen risico verbonden is.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13f
  - number: 13g.1
    text: |-
      De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie geeft haar oordeel mede gelet op het
      onderzoekersdossier en beslist op een aanvraag tot het verkrijgen van een positief oordeel over een
      onderzoeksprotocol met betrekking tot wetenschappelijk onderzoek met geneesmiddelen binnen zestig dagen na
      ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13g.2
    text: |-
      Gedurende de termijn waarbinnen de aanvraag wordt behandeld kan de ingevolge [artikel 2, tweede lid][ref1],
      bevoegde commissie eenmaal nadere informatie vragen als aanvulling op de door de aanvrager reeds verstrekte
      informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13g.3
    text: |-
      De in het eerste lid genoemde termijn kan bij wetenschappelijk onderzoek met geneesmiddelen voor gentherapie en
      somatische celtherapie en alle geneesmiddelen die genetisch gemodificeerde organismen bevatten, met ten hoogste
      dertig dagen worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13g
  - number: 13g.4
    text: |-
      De in het eerste en derde lid genoemde termijnen gelden niet voor de beoordeling van wetenschappelijk onderzoek met
      geneesmiddelen voor xenogene celtherapie.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13g
  - number: 13h.1
    text: |-
      Een aanvraag om een oordeel van een daartoe ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie over een
      wetenschappelijk onderzoek met geneesmiddelen moet voldoen aan bij ministeriële regeling gestelde regels. Deze
      regels betreffen de vorm van het verzoek en de bescheiden die daarbij moeten worden overgelegd, met name ten
      aanzien van de informatie die aan proefpersonen wordt verstrekt, en de adequate waarborgen ter bescherming van
      persoonlijke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13h.2
    text: |-
      Indien de in het eerste lid bedoelde aanvraag betrekking heeft op wetenschappelijk onderzoek met geregistreerde
      geneesmiddelen, behoeft bij de aanvraag slechts de samenvatting van de productinformatie zoals die bij de
      registratie is vastgesteld te worden verstrekt. Indien sprake is van een ten opzichte van de registratie afwijkende
      toedieningsvorm, indicatie, patiëntengroep of dosering wordt de samenvatting van de productinformatie aangevuld met
      de voor het desbetreffende onderzoek relevante aanvullende informatie.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13h
  - number: 13i.1
    text: |-
      Wetenschappelijk onderzoek met geneesmiddelen mag slechts worden uitgevoerd voor zover de centrale commissie
      daartegen niet binnen de in het derde lid bedoelde termijn gemotiveerde bezwaren kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13i.2
    text: |-
      Voordat de uitvoering van het wetenschappelijk onderzoek met geneesmiddelen aanvangt, stelt degene die het
      onderzoek verricht, de centrale commissie onder overlegging van het onderzoekersdossier in kennis van het
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13i.3
    text: |-
      De centrale commissie kan uiterlijk binnen veertien dagen na ontvangst van de in het tweede lid bedoelde
      kennisgeving haar gemotiveerde bezwaren tegen het onderzoek meedelen aan degene die het onderzoek verricht. In dat
      geval kan deze eenmaal wijziging in het voorgenomen onderzoeksprotocol aanbrengen teneinde aan de bezwaren van de
      centrale commissie tegemoet te komen. Maakt degene die het onderzoek verricht van die mogelijkheid geen gebruik,
      dan mag het onderzoek niet aanvangen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13i.4
    text: |-
      Heeft de in het tweede lid bedoelde kennisgeving betrekking op wetenschappelijk onderzoek met geneesmiddelen
      voor gentherapie, somatische celtherapie, xenogene celtherapie of geneesmiddelen die genetisch gemodificeerde
      organismen bevatten, dan mag de uitvoering van het onderzoek slechts aanvangen indien de centrale commissie dan
      wel Onze Minister, indien het vijfde lid van toepassing is, uitdrukkelijk schriftelijk heeft verklaard geen bezwaar
      tegen het onderzoek te hebben. In dat geval kan de in het derde lid bedoelde termijn worden verlengd met ten
      hoogste dertig dagen, met dien verstande dat op grond van deze wet geen termijn geldt voor het kenbaar maken van
      gemotiveerde bezwaren tegen onderzoek met geneesmiddelen voor xenogene celtherapie.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13i.5
    text: |-
      In afwijking van het eerste en tweede lid wordt, indien de beoordeling van het onderzoeksprotocol ingevolge
      [artikel 2, tweede lid, onder b, 2°, 3° of 4°][ref1] plaatsvindt door de centrale commissie, de in het tweede
      lid bedoelde kennisgeving gedaan bij Onze Minister en beslist deze ter zake met overeenkomstige toepassing van
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13i.6
    text: |-
      Bij ministeriële regeling worden regels vastgesteld betreffende de vorm en de inhoud van de in het tweede lid
      bedoelde kennisgeving, de hierbij in te dienen bewijsstukken, de vorm en inhoud van een voorstel tot substantiële
      wijzigingen die in het protocol worden aangebracht en de verklaring dat het onderzoek is beëindigd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13i.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de bedragen die voor de met de uitvoering van
      dit artikel gemoeide kosten door de centrale commissie of Onze Minister, ingeval het vijfde lid van artikel 13i van
      toepassing is, in rekening kunnen worden gebracht aan degene die de in het tweede lid bedoelde kennisgeving heeft
      gedaan.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13i
  - number: 13j.1
    text: |-
      De centrale commissie of Onze Minister, ingeval het [vijfde lid van artikel 13i][ref1] van toepassing is, maakt
      gemotiveerd bezwaar indien in de Europese databank reeds bijwerkingen van het geneesmiddel voor onderzoek zijn
      opgenomen die leiden tot onaanvaardbare risico’s voor de proefpersoon of indien er anderszins aanwijzingen zijn dat
      het wetenschappelijk onderzoek leidt tot onaanvaardbare risico’s voor de proefpersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13j.2
    text: |-
      De Inspectie voor de Gezondheidszorg controleert op verzoek van de centrale commissie of van Onze Minister, ingeval
      het [vijfde lid van artikel 13i][ref1] van toepassing is, of het wetenschappelijk onderzoek met geneesmiddelen
      naar verwachting kan plaats vinden overeenkomstig deze wet. Het bepaalde in [artikel 5:12][ref2], [5:13][ref3] en
      [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 13k.1
    text: |-
      Na aanvang van het onderzoek kan degene die het wetenschappelijk onderzoek verricht, het onderzoeksprotocol
      betreffende het wetenschappelijk onderzoek met geneesmiddelen wijzigen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
  - number: 13k.2
    text: |-
      Indien de wijziging substantieel is en effect kan hebben op de veiligheid van proefpersonen of kan leiden tot een
      andere interpretatie van de wetenschappelijke documenten die het verloop van het onderzoek onderbouwen of indien de
      wijziging anderszins significant is, mag degene die het onderzoek verricht het protocol slechts wijzigen indien:
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
  - number: 13k.2.a
    text: |-
      hij de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie, de in [artikel 13i, eerste of vijfde lid][ref2],
      bedoelde instantie en in voorkomend geval de bevoegde instantie van een andere lidstaat, die als laatste haar
      oordeel heeft gegeven, in kennis stelt van de redenen en de inhoud van de voorgenomen wijziging;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13k.2.b
    text: |-
      de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie een positief oordeel uitspreekt over het voorstel
      tot wijziging van het protocol en


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13k.2.c
    text: |-
      de in [artikel 13i, eerste of vijfde lid][ref1], bedoelde instantie geen gemotiveerde bezwaren tegen de
      voorgestelde wijziging van het protocol heeft ingebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13k.3
    text: |-
      Ingeval de in [artikel 13i, eerste of vijfde lid][ref1], bedoelde instantie of de bevoegde instanties van andere
      lidstaten gemotiveerde bezwaren tegen de wijziging van het protocol hebben ingebracht, kan het onderzoek slechts
      doorgang vinden indien degene die het wetenschappelijk onderzoek verricht, de voorgenomen wijziging van het
      protocol aanpast aan de gemaakte bezwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13k.4
    text: |-
      De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie beoordeelt de wijziging van het protocol binnen een
      termijn van vijfendertig dagen na ontvangst van het voorstel tot wijziging van het protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13k.5
    text: |-
      De in [artikel 13i, eerste of vijfde lid][ref1], bedoelde instantie maakt uiterlijk binnen vijfendertig dagen na
      ontvangst van het voorstel tot wijziging van het protocol daartegen gemotiveerde bezwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13l.1
    text: |-
      Degene die het onderzoek verricht stelt de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie, de in
      [artikel 13i, eerste of vijfde lid][ref2], bedoelde instantie en in voorkomend geval de bevoegde instantie van een
      andere lidstaat binnen negentig dagen na het einde van een wetenschappelijk onderzoek met geneesmiddelen ervan op
      de hoogte dat het onderzoek beëindigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13l
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13l.2
    text: |-
      Wanneer het onderzoek voortijdig moet worden stopgezet, stelt degene die het onderzoek verricht de in
      [artikel 13i, eerste of vijfde lid][ref1], bedoelde instantie en in voorkomend geval de bevoegde instantie van een
      andere lidstaat binnen vijftien dagen na de stopzetting onder opgaaf van redenen op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13l
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13m.1
    text: |-
      De in [artikel 13i, eerste lid en vijfde lid][ref1], bedoelde instantie stelt de bij of krachtens algemene
      maatregel van bestuur aangewezen gegevens betreffende wetenschappelijk onderzoek met geneesmiddelen, dat
      plaatsvindt in Nederland, ter beschikking van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13m
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13m.2
    text: |-
      Het College draagt zorg voor de invoering van deze gegevens in een Europese databank die uitsluitend toegankelijk
      is voor het College, de centrale commissie of Onze Minister, ingeval het [vijfde lid van artikel 13i][ref1] van
      toepassing is, de Inspectie voor de Gezondheidszorg, de bevoegde instanties van andere lidstaten, het Europees
      Bureau voor de geneesmiddelenbeoordeling en voor de Europese Commissie. Bij of krachtens algemene maatregel
      van bestuur kunnen regels worden gesteld met betrekking tot de vertrouwelijkheid van de in de Europese databank
      opgenomen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13m
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13m.3
    text: |-
      Op een met redenen omkleed verzoek van een andere lidstaat, het Europees Bureau voor geneesmiddelenbeoordeling
      of de Europese Commissie verstrekt de in [artikel 13i, eerste lid en vijfde lid][ref1], bedoelde instantie alle
      aanvullende inlichtingen betreffende een wetenschappelijk onderzoek met geneesmiddelen, die nog niet in de Europese
      databank zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13m
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13m.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aangaande de methoden van elektronische
      gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13m
  - number: 13n
    text: |-
      Indien de centrale commissie of Onze Minister, ingeval [artikel 13i, vijfde lid][ref1] van toepassing is,
      objectieve redenen heeft om aan te nemen dat degene die het wetenschappelijk onderzoek met geneesmiddelen
      verricht of uitvoert of enige andere bij de proef betrokken persoon zijn verplichtingen niet langer nakomt,
      stelt de centrale commissie of Onze Minister deze daarvan onmiddellijk op de hoogte en geeft daarbij te kennen
      welke gedragslijn genoemde persoon moet volgen om de genoemde situatie te corrigeren. De centrale commissie
      of Onze Minister, ingeval [artikel 13i, vijfde lid][ref2], van toepassing is, stelt onmiddellijk de ingevolge
      [artikel 2, tweede lid][ref3], bevoegde commissie die als laatste haar oordeel heeft gegeven over het betreffende
      wetenschappelijke onderzoek met geneesmiddelen, de bevoegde instanties van andere lidstaten en de Europese
      Commissie van genoemde gedragslijn op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13n
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
      - id: ref3
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13o.1
    text: |-
      Ongewenste voorvallen of abnormale laboratoriumwaarden die volgens het protocol voor de veiligheidsbeoordeling
      van cruciaal belang zijn, worden binnen de in het protocol vermelde termijn aan degene die het wetenschappelijk
      onderzoek verricht, gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13o
  - number: 13o.2
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, verstrekt aan degene die het wetenschappelijk onderzoek
      verricht, en aan de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie die als laatste haar oordeel heeft
      gegeven, alle gevraagde aanvullende informatie over gerapporteerde sterfgevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13o
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13o.3
    text: |-
      Degene die het wetenschappelijk onderzoek verricht, houdt gedetailleerde registers bij van alle ongewenste
      voorvallen die hem door degene die het wetenschappelijk onderzoek uitvoert, worden gerapporteerd. Deze informatie
      wordt op verzoek overgedragen aan de Inspectie voor de Gezondheidszorg en de centrale commissie of Onze Minister
      indien [artikel 13i, vijfde lid][ref1], van toepassing is en de bevoegde instanties van de lidstaten op het
      grondgebied waarvan het wetenschappelijk onderzoek wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13o
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13p.1
    text: |-
      Degene die wetenschappelijk onderzoek met geneesmiddelen verricht, draagt er zorg voor dat alle relevante
      informatie over vermoedens van onverwachte ernstige bijwerkingen van geneesmiddelen voor onderzoek die tot de dood
      van een proefpersoon hebben geleid of kunnen leiden, wordt geregistreerd en zo spoedig mogelijk doch uiterlijk
      binnen zeven dagen nadat hij daarvan kennis heeft genomen, wordt gerapporteerd aan het College, de centrale
      commissie, de betrokken bevoegde instanties van andere lidstaten en de ingevolge [artikel 2, tweede lid][ref1],
      bevoegde commissie en dat relevante informatie over de nasleep daarvan binnen nog eens acht dagen wordt medegedeeld
      aan genoemde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13p
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13p.2
    text: |-
      Alle vermoedens van andere dan in het eerste lid genoemde onverwachte ernstige bijwerkingen van geneesmiddelen voor
      onderzoek worden zo spoedig mogelijk doch uiterlijk binnen vijftien dagen nadat degene die het onderzoek verricht,
      er kennis van heeft genomen, gerapporteerd aan het College, de centrale commissie, de betrokken bevoegde instanties
      van andere lidstaten en de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13p
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13p.3
    text: Degene die het wetenschappelijk onderzoek verricht, informeert alle anderen die het onderzoek uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13p
  - number: 13p.4
    text: |-
      Het College draagt zorg voor de invoering van alle gemelde vermoedens van onverwachte ernstige bijwerkingen van een
      geneesmiddel voor onderzoek in een Europese databank, als bedoeld in [artikel 13m, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13m
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13p
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13m
        paragraaf: 5a
  - number: 13q
    text: |-
      Tijdens de gehele duur van het wetenschappelijk onderzoek met geneesmiddelen verstrekt degene die het onderzoek
      verricht, eenmaal per jaar een lijst van alle vermoedens van ernstige bijwerkingen van geneesmiddelen voor
      onderzoek, die zich in dat jaar hebben voorgedaan en een rapport betreffende de veiligheid van de proefpersonen
      aan:
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13q
  - number: 13q.a
    text: |-
      de centrale commissie of Onze Minister indien [artikel 13i, vijfde lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13q
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: 13q.b
    text: |-
      de bevoegde instanties van de andere lidstaten op het grondgebied waarvan het wetenschappelijk onderzoek met
      geneesmiddelen wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13q
  - number: 13q.c
    text: |-
      de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13q
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13r
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld aan de rapportage, bedoeld in de [artikelen 13o][ref1],
      [13p][ref2] en [13q][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13o
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13p
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel13q
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel13r
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13o
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0009408
        artikel: 13p
        paragraaf: 5a
      - id: ref3
        bwb_id: BWBR0009408
        artikel: 13q
        paragraaf: 5a
  - number: '14.1'
    text: |-
      Er is een centrale commissie voor medisch-wetenschappelijk onderzoek. Zij heeft ten hoogste vijftien leden. De
      [Kaderwet zelfstandige bestuursorganen][ref1] is op de centrale commissie van toepassing, met uitzondering van
      [artikel 22 van die wet][ref2], voor zover het besluiten betreft die de centrale commissie neemt ter uitvoering van
      deze wet en de [artikelen 10][ref3], [16][ref4] en [19 van de Embryowet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0013797#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0013797#Artikel19
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0013797
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0013797
        artikel: '19'
  - number: '14.2'
    text: |-
      De centrale commissie bestaat in elk geval uit een of meer artsen, en uit personen die deskundig zijn op het gebied
      van de embryologie, de farmacologie, de farmacie, de verpleegkunde, de gedragswetenschappen, de rechtswetenschap,
      de methodologie van wetenschappelijk onderzoek en de ethiek, alsmede een persoon die het wetenschappelijk onderzoek
      specifiek beoordeelt vanuit de invalshoek van de proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '14.3'
    text: Voor elk lid wordt een plaatsvervangend lid benoemd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '14.4'
    text: |-
      De leden, waaronder de voorzitter, en de plaatsvervangende leden van de centrale commissie worden voor ten hoogste
      vier jaar benoemd. Onze Minister wijst een persoon aan die als waarnemer de vergaderingen van de commissie kan
      bijwonen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '14.5'
    text: De centrale commissie wijst uit haar midden een of meer plaatsvervangers voor de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '14.6'
    text: |-
      Herbenoeming van de leden en de plaatsvervangende leden kan tweemaal en telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '14.7'
    text: |-
      De centrale commissie regelt haar werkwijze bij een reglement. Het reglement bevat een voorziening op grond
      waarvan een lid of een plaatsvervangend lid van de centrale commissie niet deelneemt aan de beoordeling van
      een onderzoeksprotocol indien het betrokken is bij het verrichten dan wel uitvoeren van het te beoordelen
      wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel14
  - number: '15'
    text: |-
      De centrale commissie heeft een secretariaat, waarvan de ambtenaren door Onze Minister, gehoord de centrale
      commissie, worden benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel15
  - number: '16.1'
    text: |-
      De centrale commissie kan commissies erkennen, die belast zijn met de toetsing van onderzoeksprotocollen
      overeenkomstig het bepaalde bij of krachtens deze wet of de [Embryowet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013797
  - number: '16.2'
    text: 'Voor erkenning komt slechts in aanmerking een commissie:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.a
    text: |-
      die in elk geval bestaat uit een of meer artsen en uit personen die deskundig zijn op het gebied van de
      rechtswetenschap, de methodologie van wetenschappelijk onderzoek en de ethiek, alsmede een persoon die het
      wetenschappelijk onderzoek specifiek beoordeelt vanuit de invalshoek van de proefpersoon en die ingeval van
      beoordeling van wetenschappelijk onderzoek met geneesmiddelen tevens bestaat uit personen die deskundig zijn op het
      gebied van de farmacie en de klinische farmacologie;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.b
    text: |-
      waarvan de leden voldoen aan door de centrale commissie vast te stellen nadere eisen betreffende opleiding en
      ervaring;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.c
    text: |-
      waarvan de leden worden benoemd voor een periode van ten hoogste vier jaar en herbenoeming van de leden twee maal
      kan plaatsvinden voor telkens een periode van ten hoogste vier jaar;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.d
    text: |-
      in welker reglement genoegzaam is voorzien in medewerking door andere deskundigen met het oog op de aard van de
      haar ter beoordeling voorgelegde onderzoeksprotocollen;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.e
    text: uit welker reglement blijkt voor welke kring zij werkzaam zal zijn;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.f
    text: |-
      in welker reglement genoegzaam is voorzien in de onafhankelijkheid ten opzichte van de organisatie die de commissie
      heeft ingesteld;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.g
    text: |-
      welker reglement voorziet in een behoorlijke regeling van haar werkwijze en dat onder andere bevat een voorziening
      op grond waarvan een lid of een plaatsvervangend lid niet deelneemt aan de beoordeling van een onderzoeksprotocol
      indien het betrokken is bij het verrichten dan wel uitvoeren van het te beoordelen wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: 16.2.h
    text: |-
      waarvan redelijkerwijs aannemelijk is dat aan haar onderzoeksprotocollen ter beoordeling zullen worden voorgelegd
      tot tenminste het door de centrale commissie daartoe vastgestelde aantal.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel16
  - number: '17.1'
    text: |-
      De centrale commissie brengt een erkenning als bedoeld in artikel 16, eerste lid, terstond ter kennis van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel17
  - number: '17.2'
    text: |-
      Van een erkenning als bedoeld in artikel 16, eerste lid, wordt door de zorg van Onze Minister mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel17
  - number: '18'
    text: |-
      Een commissie doet van een wijziging van haar reglement en van haar opheffing schriftelijk mededeling aan de
      centrale commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel18
  - number: '19.1'
    text: |-
      Binnen zes weken na de indiening van een protocol betreffende een wetenschappelijk onderzoek als bedoeld in de
      tweede volzin van artikel 4, eerste lid, waarbij de toestand van de proefpersoon niet opzettelijk wordt gewijzigd,
      kan de commissie besluiten de beoordeling daarvan over te dragen aan de centrale commissie. De commissie doet
      degene die het protocol heeft ingediend, mededeling van de overdracht.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel19
  - number: '19.2'
    text: |-
      De centrale commissie kan bepalen dat de beoordeling van protocollen betreffende een door haar aangewezen vorm van
      wetenschappelijk onderzoek als bedoeld in het eerste lid door haar geschiedt.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel19
  - number: '20'
    text: |-
      Als vergoeding voor de met de beoordeling gemoeide kosten kunnen de commissie en de centrale commissie aan degene
      die een onderzoeksprotocol ter beoordeling indient, een bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel20
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de op grond van [artikel 16][ref1] erkende commissies
      nagaan of bij de maatregel aan te wijzen vormen van wetenschappelijk onderzoek waarover de desbetreffende commissie
      ingevolge [artikel 2][ref2] haar oordeel heeft gegeven, een verloop nemen dat in noemenswaardige mate voor de
      proefpersoon ongunstiger is dan in het onderzoeksprotocol is voorzien. In dat geval kan de commissie een nader
      oordeel over het onderzoeksprotocol geven. [Artikel 10, vierde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel10
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009408
        artikel: '10'
        paragraaf: '5'
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de wijze waarop de commissies de
      in het eerste lid bedoelde taak uitoefenen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel21
  - number: '21.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de centrale commissie, voor zover
      deze ingevolge [artikel 2, tweede lid, onderdeel b, onder 2°, 3° en 4°][ref1], is belast met de beoordeling
      van onderzoeksprotocollen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: '22.1'
    text: |-
      De commissie zendt aan de centrale commissie afschrift van elk ingevolge deze wet gegeven oordeel alsmede van het
      desbetreffende onderzoeksprotocol of de hoofdzaken daarvan binnen zeven dagen na de dag waarop het oordeel gegeven
      is. Voorts doet de commissie van de in [artikel 10, vijfde lid, onderdeel b][ref1], bedoelde mededelingen binnen
      zeven dagen na ontvangst ervan melding bij de centrale commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel10
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '10'
        paragraaf: '5'
  - number: '22.2'
    text: |-
      De commissie brengt jaarlijks vóór 1 april verslag uit van haar werkzaamheden in het afgelopen kalenderjaar. Dit
      verslag wordt gezonden aan de centrale commissie en wordt overigens door de commissie, tegen betaling der kosten,
      voor een ieder verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel22
  - number: '22.3'
    text: |-
      De commissie verleent aan de centrale commissie alle medewerking die voor de vervulling van haar taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel22
  - number: '23'
    text: |-
      Tegen een door een commissie gegeven oordeel kan een belanghebbende administratief beroep instellen bij de centrale
      commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel23
  - number: '24'
    text: |-
      De centrale commissie houdt toezicht op de werkzaamheden van de commissies. Zij kan richtlijnen vaststellen ter
      zake van de door hen overeenkomstig deze wet te verrichten werkzaamheden. Zodanige richtlijnen worden door de zorg
      van Onze Minister bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel24
  - number: '25.1'
    text: 'De centrale commissie trekt een aan een commissie verleende erkenning in indien:'
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
  - number: 25.1.a
    text: |-
      de commissie niet langer voldoet aan een van de in [artikel 16, tweede lid, onder a tot en met g][ref1], met het
      oog op erkenning gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
        paragraaf: '6'
  - number: 25.1.b
    text: de commissie de verplichtingen die voor haar voortvloeien uit deze wet, onvoldoende nakomt;
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
  - number: 25.1.c
    text: |-
      door een wijziging van het reglement van de commissie een goede uitoefening van de werkzaamheden waarmee zij
      ingevolge deze wet is belast, redelijkerwijs niet langer is verzekerd.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
  - number: '25.2'
    text: |-
      De centrale commissie kan voorts een erkenning intrekken indien door de commissie in de laatste
      twee kalenderjaren een kleiner aantal onderzoeksprotocollen is beoordeeld dan het aantal, bedoeld in
      [artikel 16, tweede lid, onder h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
        paragraaf: '6'
  - number: '25.3'
    text: |-
      Een beslissing tot intrekking van een erkenning wordt niet genomen dan nadat de commissie door de centrale
      commissie is gehoord.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
  - number: '25.4'
    text: |-
      Van de intrekking wordt schriftelijk mededeling gedaan aan de commissie. [Artikel 17, tweede lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel17
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '17'
        paragraaf: '6'
  - number: '27'
    text: |-
      Telkens binnen een periode van vijf jaar brengt de centrale commissie een rapport uit aan Onze Minister, waarin de
      taakvervulling van de centrale commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan
      voor gewenste veranderingen. Onze Minister neemt zijn opvattingen over dit rapport op in het verslag, bedoeld in
      [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] en voegt het rapport bij dat verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: 27a
    text: |-
      Bij ministeriële regeling kan worden bepaald dat toezending van informatie, die op grond van deze wet moet worden
      verstrekt aan de centrale commissie, aan Onze Minister ingeval [artikel 13i, vijfde lid][ref1], van toepassing is,
      en voorts aan de commissie, het College of de Inspectie voor de Gezondheidszorg, elektronisch geschiedt. Daarbij
      kunnen regels worden gesteld inzake de vorm waarin dit dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13i
        paragraaf: 5a
  - number: '28.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel28
  - number: '28.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel28
  - number: '28.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake het toezicht op
      de naleving van het bepaalde bij of krachtens deze wet met betrekking tot wetenschappelijk onderzoek met
      geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel28
  - number: '29.1'
    text: |-
      Indien het betreft wetenschappelijk onderzoek met geneesmiddelen wordt van de inspectie, bedoeld in
      [artikel 28, eerste lid][ref1], een verslag opgesteld dat ter beschikking wordt gesteld aan degene die
      het wetenschappelijk onderzoek verricht. Voor zover het verslag persoonsgegevens betreft als bedoeld in
      [hoofdstuk 2, paragraaf 2, van de Wet bescherming persoonsgegevens][ref2], blijft opname in het verslag daarvan
      achterwege, tenzij daardoor kennelijk geen inbreuk wordt gemaakt op de persoonlijke levenssfeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '28'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0011468
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Het verslag wordt daarnaast op een met redenen omkleed verzoek en uitsluitend ter beschikking gesteld aan
      lidstaten van de Europese Unie, de centrale commissie, de commissie en aan het Europees Bureau voor de
      geneesmiddelenbeoordeling.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel29
  - number: '30'
    text: |-
      De toepassing van deze wet door de commissies geschiedt met inachtneming van de voor de rijksdienst geldende
      nationale en internationale voorschriften ter beveiliging van gegevens waarvan geheimhouding door het belang van de
      Staat of van zijn bondgenoten is geboden.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel30
  - number: '31.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, artikel 32 in werking worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
  - number: '31.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
  - number: '31.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
  - number: '31.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
  - number: '31.5'
    text: |-
      Het besluit, bedoel in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
  - number: '31.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel31
  - number: '32'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Defensie, de artikelen 16, tweede lid, onder a, en
      25, eerste lid, onder a, buiten werking stellen ten aanzien van commissies die belast zijn met de toetsing van
      wetenschappelijk onderzoek naar bescherming tegen de omstandigheden waaraan militair personeel bij operationele
      inzet kan worden blootgesteld, voor zover dit onderzoek wordt verricht met proefpersonen die behoren tot het
      militair personeel.
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel32
  - number: '33.1'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die al dan
      niet opzettelijk handelt in strijd met een verbod, vervat in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel6
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '6'
        paragraaf: '2'
  - number: '33.2'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die handelt
      in strijd met de verplichting zorg te dragen voor de nakoming van[ artikel 2, eerste lid of tweede lid][ref1], of
      [7][ref2] dan wel in strijd met een verplichting, vervat in de [artikelen 10][ref3], [11][ref4], [12][ref5] en
      [13][ref6] en [paragraaf 5a][ref7], of in strijd met een gedragslijn bedoeld in [artikel 13n][ref8]. Met dezelfde
      straf wordt gestraft degene die handelt in strijd met een verbod, vervat in de [artikelen 4][ref9], [5][ref10] en
      [13c][ref11], degene die wetenschappelijk onderzoek uitvoert zonder een protocol waarover een positief oordeel is
      verkregen, dan wel in strijd daarmee en degene die wetenschappelijk onderzoek uitvoert terwijl de commissie een
      door haar gegeven positief oordeel over het onderzoeksprotocol heeft opgeschort dan wel ingetrokken of de centrale
      commissie of Onze Minister, ingeval het vijfde lid van [artikel 13i][ref12] van toepassing is, de uitvoering van
      het onderzoek heeft opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0009408#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0009408#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0009408#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0009408#Paragraaf5a
      [ref8]: https://wetten.overheid.nl/BWBR0009408#Artikel13n
      [ref9]: https://wetten.overheid.nl/BWBR0009408#Artikel4
      [ref10]: https://wetten.overheid.nl/BWBR0009408#Artikel5
      [ref11]: https://wetten.overheid.nl/BWBR0009408#Artikel13c
      [ref12]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2016-08-01#Artikel33
    references:
