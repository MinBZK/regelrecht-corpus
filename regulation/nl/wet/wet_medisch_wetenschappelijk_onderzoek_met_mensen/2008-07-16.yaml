  - number: '14'
    text: |-
      1 Er is een centrale commissie voor medisch-wetenschappelijk onderzoek. Zij heeft ten hoogste vijftien leden.

      2 De centrale commissie bestaat in elk geval uit een of meer artsen, en uit personen die deskundig zijn op
      het gebied van de embryologie, de farmacologie, de farmacie, de verpleegkunde, de gedragswetenschappen, de
      rechtswetenschap, de methodologie van wetenschappelijk onderzoek en de ethiek, alsmede een persoon die het
      wetenschappelijk onderzoek specifiek beoordeelt vanuit de invalshoek van de proefpersoon.

      3 Voor elk lid wordt een plaatsvervangend lid benoemd.

      4 De leden, waaronder de voorzitter, en de plaatsvervangende leden van de centrale commissie worden bij koninklijk
      besluit, op voordracht van Onze Minister, voor ten hoogste vier jaar benoemd. Onze Minister wijst een persoon aan
      die als waarnemer de vergaderingen van de commissie kan bijwonen.

      5 De centrale commissie wijst uit haar midden een of meer plaatsvervangers voor de voorzitter aan.

      6 Herbenoeming van de leden en de plaatsvervangende leden kan tweemaal en telkens voor ten hoogste vier jaar
      plaatsvinden. Op hun verzoek wordt hun bij koninklijk besluit, op voordracht van Onze Minister, tussentijds ontslag
      verleend.

      7 De leden en de plaatsvervangende leden kunnen anders dan op eigen verzoek tussentijds bij koninklijk besluit, op
      voordracht van Onze Minister, worden ontslagen:

      a. indien zij de verplichtingen die voor hen voortvloeien uit het lidmaatschap van de centrale commissie,
      onvoldoende nakomen;

      b. indien zij wegens hun lichamelijke of geestelijke toestand moeten worden geacht de geschiktheid voor het
      vervullen van hun functie te hebben verloren.

      8 De leden en de plaatsvervangende leden ontvangen een vacatiegeld alsmede een vergoeding van reis- en
      verblijfkosten, een en ander overeenkomstig bij ministeriële regeling te stellen regels.

      9 De centrale commissie regelt haar werkwijze bij een reglement dat de goedkeuring van Onze Minister behoeft. Het
      reglement bevat een voorziening op grond waarvan een lid of een plaatsvervangend lid van de centrale commissie
      niet deelneemt aan de beoordeling van een onderzoeksprotocol indien het betrokken is bij het verrichten dan wel
      uitvoeren van het te beoordelen wetenschappelijk onderzoek. Wijzigingen in het reglement behoeven eveneens de
      goedkeuring van Onze Minister. Een goedkeuring kan slechts worden geweigerd, indien een goede uitvoering van de
      werkzaamheden redelijkerwijs niet of niet langer is verzekerd.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel14
  - number: '15'
    text: |-
      1 De centrale commissie heeft een secretariaat, waarvan de ambtenaren door Onze Minister, gehoord de centrale
      commissie, worden benoemd, geschorst en ontslagen. Tot hoofd van het secretariaat wordt benoemd de secretaris van
      de Gezondheidsraad.

      2 De ambtenaren van het secretariaat zijn voor de uitoefening van hun taak uitsluitend verantwoording verschuldigd
      aan de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel15
  - number: '16'
    text: |-
      1 De centrale commissie kan commissies erkennen, die belast zijn met de toetsing van onderzoeksprotocollen
      overeenkomstig het bepaalde bij of krachtens deze wet.

      2 Voor erkenning komt slechts in aanmerking een commissie:

      a. die in elk geval bestaat uit een of meer artsen en uit personen die deskundig zijn op het gebied van de
      rechtswetenschap, de methodologie van wetenschappelijk onderzoek en de ethiek, alsmede een persoon die het
      wetenschappelijk onderzoek specifiek beoordeelt vanuit de invalshoek van de proefpersoon en die ingeval van
      beoordeling van wetenschappelijk onderzoek met geneesmiddelen tevens bestaat uit personen die deskundig zijn op het
      gebied van de farmacie en de klinische farmacologie;

      b. waarvan de leden voldoen aan door de centrale commissie vast te stellen nadere eisen betreffende opleiding en
      ervaring;

      c. in welker reglement genoegzaam is voorzien in medewerking door andere deskundigen met het oog op de aard van de
      haar ter beoordeling voorgelegde onderzoeksprotocollen;

      d. uit welker reglement blijkt voor welke kring zij werkzaam zal zijn;

      e. in welker reglement genoegzaam is voorzien in de onafhankelijkheid ten opzichte van de organisatie die de
      commissie heeft ingesteld;

      f. welker reglement voorziet in een behoorlijke regeling van haar werkwijze en dat onder andere bevat een
      voorziening op grond waarvan een lid of een plaatsvervangend lid niet deelneemt aan de beoordeling van
      een onderzoeksprotocol indien het betrokken is bij het verrichten dan wel uitvoeren van het te beoordelen
      wetenschappelijk onderzoek;

      g. waarvan redelijkerwijs aannemelijk is dat aan haar onderzoeksprotocollen ter beoordeling zullen worden
      voorgelegd tot tenminste het door de centrale commissie daartoe vastgestelde aantal.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel16
  - number: '17'
    text: |-
      1 De centrale commissie brengt een erkenning als bedoeld in artikel 16, eerste lid, terstond ter kennis van Onze
      Minister.

      2 Van een erkenning als bedoeld in artikel 16, eerste lid, wordt door de zorg van Onze Minister mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel17
  - number: '18'
    text: |-
      Een commissie doet van een wijziging van haar reglement en van haar opheffing schriftelijk mededeling aan de
      centrale commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel18
  - number: '19'
    text: |-
      1 Binnen zes weken na de indiening van een protocol betreffende een wetenschappelijk onderzoek als bedoeld in de
      tweede volzin van artikel 4, eerste lid, waarbij de toestand van de proefpersoon niet opzettelijk wordt gewijzigd,
      kan de commissie besluiten de beoordeling daarvan over te dragen aan de centrale commissie. De commissie doet
      degene die het protocol heeft ingediend, mededeling van de overdracht.

      2 De centrale commissie kan bepalen dat de beoordeling van protocollen betreffende een door haar aangewezen vorm
      van wetenschappelijk onderzoek als bedoeld in het eerste lid door haar geschiedt.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel19
  - number: '20'
    text: |-
      Als vergoeding voor de met de beoordeling gemoeide kosten kan de commissie aan degene die een onderzoeksprotocol
      ter beoordeling indient, een bedrag in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel20
  - number: '21'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat de op grond van artikel 16 erkende commissies nagaan
      of bij de maatregel aan te wijzen vormen van wetenschappelijk onderzoek waarover de desbetreffende commissie
      ingevolge artikel 2 haar oordeel heeft gegeven, een verloop nemen dat in noemenswaardige mate voor de proefpersoon
      ongunstiger is dan in het onderzoeksprotocol is voorzien. In dat geval kan de commissie een nader oordeel over het
      onderzoeksprotocol geven.

      De tweede volzin van artikel 10 , eerste lid, is van toepassing.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de wijze waarop de commissies
      de in het eerste lid bedoelde taak uitoefenen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de centrale commissie, voor
      zover deze ingevolge artikel 2, tweede lid, onderdeel b, onder 2°, 3° en 4°, is belast met de beoordeling van
      onderzoeksprotocollen.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel21
  - number: '22'
    text: |-
      1 De commissie zendt aan de centrale commissie afschrift van elk ingevolge deze wet gegeven oordeel alsmede van
      het desbetreffende onderzoeksprotocol of de hoofdzaken daarvan. Voorts doet de commissie bij de centrale commissie
      melding van de in artikel 10, tweede lid, bedoelde mededelingen.

      2 De commissie brengt jaarlijks vóór 1 april verslag uit van haar werkzaamheden in het afgelopen kalenderjaar. Dit
      verslag wordt gezonden aan de centrale commissie en wordt overigens door de commissie, tegen betaling der kosten,
      voor een ieder verkrijgbaar gesteld.

      3 De commissie verleent aan de centrale commissie alle medewerking die voor de vervulling van haar taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel22
  - number: '23'
    text: |-
      Tegen een door een commissie gegeven oordeel dat geen betrekking heeft op wetenschappelijk onderzoek met
      geneesmiddelen kan een belanghebbende administratief beroep instellen bij de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel23
  - number: '24'
    text: |-
      De centrale commissie houdt toezicht op de werkzaamheden van de commissies. Zij kan richtlijnen vaststellen ter
      zake van de door hen overeenkomstig deze wet te verrichten werkzaamheden. Zodanige richtlijnen worden door de zorg
      van Onze Minister bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel24
  - number: '25'
    text: |-
      1 De centrale commissie trekt een aan een commissie verleende erkenning in indien:

      a. de commissie niet langer voldoet aan een van de in [artikel 16, tweede lid, onder a tot en met f][ref1], met het
      oog op erkenning gestelde voorwaarden;

      b. de commissie de verplichtingen die voor haar voortvloeien uit deze wet, onvoldoende nakomt;

      c. door een wijziging van het reglement van de commissie een goede uitoefening van de werkzaamheden waarmee zij
      ingevolge deze wet is belast, redelijkerwijs niet langer is verzekerd.

      2 De centrale commissie kan voorts een erkenning intrekken indien door de commissie in de laatste
      twee kalenderjaren een kleiner aantal onderzoeksprotocollen is beoordeeld dan het aantal, bedoeld in
      [artikel 16, tweede lid, onder g][ref2].

      3 Een beslissing tot intrekking van een erkenning wordt niet genomen dan nadat de commissie door de centrale
      commissie is gehoord.

      4 Van de intrekking wordt schriftelijk mededeling gedaan aan de commissie. [Artikel 17, tweede lid][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel17
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '16'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0009408
        artikel: '17'
        paragraaf: '6'
  - number: '26'
    text: |-
      Bij algemene maatregel van bestuur kunnen richtlijnen worden vastgesteld ter zake van de uitoefening van de taak
      van de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel26
  - number: '27'
    text: |-
      1 De centrale commissie brengt jaarlijks vóór 1 april aan Onze Minister verslag uit van haar werkzaamheden in het
      afgelopen kalenderjaar. Dit verslag wordt door de centrale commissie, tegen betaling der kosten, voor een ieder
      verkrijgbaar gesteld.

      2 Telkens binnen een periode van vier jaar brengt de centrale commissie een rapport uit aan Onze Minister, waarin
      de taakvervulling van de centrale commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan
      voor gewenste veranderingen. Onze Minister zendt dit rapport aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel27
  - number: '28'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake het toezicht
      op de naleving van het bepaalde bij of krachtens deze wet met betrekking tot wetenschappelijk onderzoek met
      geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel28
  - number: '30'
    text: |-
      De toepassing van deze wet geschiedt met inachtneming van de voor de rijksdienst geldende nationale en
      internationale voorschriften ter beveiliging van gegevens waarvan geheimhouding door het belang van de Staat of van
      zijn bondgenoten is geboden.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel30
  - number: '31'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, artikel 32 in werking worden
      gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoel in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
  - number: '32'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Defensie, de artikelen 16, tweede lid, onder a, en
      25, eerste lid, onder a, buiten werking stellen ten aanzien van commissies die belast zijn met de toetsing van
      wetenschappelijk onderzoek naar bescherming tegen de omstandigheden waaraan militair personeel bij operationele
      inzet kan worden blootgesteld, voor zover dit onderzoek wordt verricht met proefpersonen die behoren tot het
      militair personeel.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel32
  - number: '33'
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die al
      dan niet opzettelijk handelt in strijd met een verbod, vervat in [artikel 6, eerste lid][ref1].

      2 Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die handelt
      in strijd met de verplichting zorg te dragen voor de nakoming van[ artikel 2, eerste lid of tweede lid][ref2], of
      [7][ref3] dan wel in strijd met een verplichting, vervat in de [paragrafen 5][ref4] en [5a][ref5] of in strijd met
      een gedragslijn bedoeld in [artikel 13n][ref6]. Met dezelfde straf wordt gestraft degene die handelt in strijd met
      een verbod, vervat in de [artikelen 4][ref7], [5][ref8] en [13c][ref9] en degene die wetenschappelijk onderzoek
      uitvoert zonder een protocol waarover een positief oordeel is verkregen, dan wel in strijd daarmee.

      3 De in het eerste lid strafbaar gestelde feiten zijn misdrijven; de in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.


