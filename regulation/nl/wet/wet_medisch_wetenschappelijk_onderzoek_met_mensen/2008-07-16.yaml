  - number: 13n
    text: |-
      Indien de centrale commissie of Onze Minister, ingeval [artikel 13i, vijfde lid][ref1] van toepassing is,
      objectieve redenen heeft om aan te nemen dat degene die het wetenschappelijk onderzoek met geneesmiddelen
      verricht of uitvoert of enige andere bij de proef betrokken persoon zijn verplichtingen niet langer nakomt,
      stelt de centrale commissie of Onze Minister deze daarvan onmiddellijk op de hoogte en geeft daarbij te kennen
      welke gedragslijn genoemde persoon moet volgen om de genoemde situatie te corrigeren. De centrale commissie
      of Onze Minister, ingeval [artikel 13i, vijfde lid][ref2], van toepassing is, stelt onmiddellijk de ingevolge
      [artikel 2, tweede lid][ref3], bevoegde commissie die als laatste haar oordeel heeft gegeven over het betreffende
      wetenschappelijke onderzoek met geneesmiddelen, de bevoegde instanties van andere lidstaten en de Europese
      Commissie van genoemde gedragslijn op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel2
