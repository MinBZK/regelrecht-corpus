  - number: '37'
    text: |-
      Onze Minister zendt binnen 4 jaar na de inwerkingtreding van deze wet, en vervolgens telkens na 5 jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel37
  - number: '38'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel38
  - number: '39'
    text: 'Deze wet wordt aangehaald als: Wet medisch-wetenschappelijk onderzoek met mensen.'
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel39
