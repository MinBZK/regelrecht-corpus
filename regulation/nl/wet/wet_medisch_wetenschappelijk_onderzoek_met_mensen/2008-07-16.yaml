  - number: '12'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat de persoonlijke levenssfeer van de
      proefpersoon zoveel mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel12
  - number: '13'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat, alvorens de uitvoering van een
      onderzoek een aanvang neemt, degenen wier beroepsmatige medewerking nodig is bij de uitvoering van het onderzoek,
      over de aard en het doel van het onderzoek zijn ingelicht.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13
  - number: 13a
    text: |-
      Op wetenschappelijk onderzoek met geneesmiddelen is naast het bepaalde in de [paragrafen 1 tot en met 5][ref1] het
      bepaalde in deze paragraaf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '1'
  - number: 13b
    text: |-
      1 Wetenschappelijk onderzoek met geneesmiddelen, met inbegrip van onderzoek naar de biologische beschikbaarheid en
      de biologische equivalentie, is wat betreft opzet, uitvoering en rapportage in overeenstemming met de beginselen
      van goede klinische praktijken.

      2 Bij of krachtens algemene maatregel van bestuur worden regels betreffende goede klinische praktijken vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13b
  - number: 13c
    text: |-
      Het is verboden in het kader van gentherapie wetenschappelijk onderzoek met geneesmiddelen te verrichten dat
      gericht is op modificatie van de kiembaan en de daarin vastgelegde genetische identiteit van de proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13c
  - number: 13d
    text: |-
      Onverminderd het bepaalde in[ paragraaf 2][ref1] kan de ingevolge [artikel 2, tweede lid][ref2], bevoegde commissie
      slechts een positief oordeel geven over een onderzoeksprotocol dat betrekking heeft op wetenschappelijk onderzoek
      met geneesmiddelen indien:

      a. degene die het wetenschappelijk onderzoek verricht of zijn wettelijk vertegenwoordiger op het grondgebied van de
      Europese Gemeenschap gevestigd is;

      b. de geneesmiddelen voor onderzoek of in voorkomend geval de hulpmiddelen voor toediening, behoudens indien het
      wetenschappelijk onderzoek met geregistreerde geneesmiddelen betreft, gratis ter beschikking worden gesteld door
      degene die het wetenschappelijk onderzoek verricht;

      c. een op grond van de [Wet op de beroepen in de individuele gezondheidszorg][ref3] geregistreerde arts of
      tandarts, werkzaam in de gezondheidszorg, verantwoordelijk is voor de medische verzorging en de medische
      beslissingen over de proefpersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13d
    references:
