preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met de artikelen 10 en 11 van de Grondwet,
    wenselijk is regelen te stellen met betrekking tot medisch-wetenschappelijk onderzoek met mensen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. wetenschappelijk onderzoek: medisch-wetenschappelijk onderzoek waarvan deel uitmaakt het onderwerpen van
      personen aan handelingen of het opleggen aan personen van een bepaalde gedragswijze;

      c. proefpersoon: de persoon, bedoeld onder b;

      d. onderzoeksprotocol: de volledige beschrijving van een voorgenomen wetenschappelijk onderzoek waaronder de
      doelstellingen, de opzet, de methodologie, de statistische aspecten en de organisatie van het wetenschappelijk
      onderzoek;

      e. facilitaire instelling: instelling of bedrijf waar handelingen ter uitvoering van een wetenschappelijk onderzoek
      plaatsvinden;

      f. degene die het wetenschappelijk onderzoek verricht: een persoon, bedrijf, instelling of organisatie die de
      verantwoordelijkheid op zich neemt voor het starten, het beheer of de financiering van het wetenschappelijk
      onderzoek;

      g. degene die het wetenschappelijk onderzoek uitvoert: een arts of een in [artikel 3, onder e][ref1], bedoelde
      persoon, die verantwoordelijk is voor de uitvoering van het wetenschappelijk onderzoek op een bepaalde locatie.
      Indien de feitelijke uitvoering geschiedt door een werknemer of een andere hulppersoon, wordt degene die van deze
      persoon gebruik maakt aangemerkt als degene die het onderzoek uitvoert;

      h. commissie: een krachtens [artikel 16][ref2] erkende commissie;

      i. centrale commissie: de commissie bedoeld in [artikel 14][ref3];

      j. College: het College ter beoordeling van geneesmiddelen, genoemd in
      [artikel 2, eerste lid, van de Geneesmiddelenwet][ref4];

      k. andere lidstaten: andere lidstaten van de Europese Unie dan Nederland;

      l. het Europees Bureau voor de geneesmiddelenbeoordeling: het Europees Bureau voor de geneesmiddelenbeoordeling
      opgericht bij [verordening nr. (EEG) 2309/93](31993R2309) van de Raad van 22 juli 1993 tot vaststelling van
      communautaire procedures voor het verlenen van vergunningen voor en het toezicht op geneesmiddelen voor menselijk
      en diergeneeskundig gebruik en tot het oprichten van een Europees Bureau voor de geneesmiddelenbewaking, (PbEG
      L 214);

      m. gespreid uitgevoerd wetenschappelijk onderzoek: wetenschappelijk onderzoek dat volgens één bepaald protocol door
      meer dan een onderzoeker wordt uitgevoerd op verschillende locaties;

      n. wetenschappelijk onderzoek met geneesmiddelen: wetenschappelijk onderzoek met geneesmiddelen dat bedoeld is om
      de klinische, farmacologische of andere farmacodynamische effecten van een of meer geneesmiddelen voor onderzoek
      vast te stellen of te bevestigen of eventuele bijwerkingen van een of meer geneesmiddelen voor onderzoek te
      signaleren of de resorptie, de distributie, het metabolisme en de uitscheiding van een of meer geneesmiddelen voor
      onderzoek te bestuderen teneinde de veiligheid of werkzaamheid van deze geneesmiddelen vast te stellen;

      o. geneesmiddel voor onderzoek: een farmaceutische vorm van een werkzame stof of een placebo die bij een
      wetenschappelijk onderzoek met geneesmiddelen wordt onderzocht of als referentie wordt gebruikt, met inbegrip van
      een geneesmiddel waarvoor een vergunning voor het in de handel brengen is afgegeven maar dat op een andere manier
      wordt gebruikt of samengesteld, geformuleerd of verpakt dan de toegelaten vorm, voor een niet toegelaten indicatie
      wordt gebruikt of wordt gebruikt om nadere informatie over een toegelaten toepassing te verkrijgen;

      p. onderzoekersdossier: het geheel van de klinische en niet klinische gegevens over het geneesmiddel of de
      geneesmiddelen voor onderzoek die relevant zijn voor de bestudering van het geneesmiddel of de geneesmiddelen voor
      onderzoek bij mensen;

      q. ongewenst voorval: een schadelijk verschijnsel bij een patiënt of een proefpersoon bij een klinisch onderzoek
      aan wie een geneesmiddel wordt toegediend dat niet noodzakelijk met die behandeling verband houdt;

      r. bijwerking: een schadelijke en niet gewenste reactie op een geneesmiddel voor onderzoek, ongeacht de toegediende
      dosis;

      s. ernstig ongewenst voorval of ernstige bijwerking: een ongewenst voorval of een bijwerking die, ongeacht de
      dosis, dodelijk is, levensgevaar oplevert voor de proefpersoon, opname in een ziekenhuis of verlenging van de
      opname noodzakelijk maakt, blijvende of significante invaliditeit of arbeidsongeschiktheid veroorzaakt dan wel zich
      uit in aangeboren afwijking of misvorming;

      t. onverwachte bijwerking: een bijwerking waarvan de aard en de ernst niet overeenkomen met de informatie over het
      product zoals opgenomen in het onderzoekersdossier voor een geneesmiddel voor onderzoek waarvoor geen vergunning
      is afgegeven of in het geval van een geneesmiddel waarvoor een marktvergunning is afgegeven, de in de bijsluiter
      vervatte samenvatting van de kenmerken van het product;

      u. schriftelijke toestemming: geïnformeerde, schriftelijke, gedagtekende en ondertekende toestemming om aan een
      wetenschappelijk onderzoek deel te nemen.

      2 Het onderwerpen van personen aan handelingen en het opleggen aan personen van een bepaalde gedragswijze
      uitsluitend ten behoeve van de hulpverlening aan hen is onder het eerste lid, onder b, niet begrepen.

      3 Deze wet is niet van toepassing op wetenschappelijk onderzoek voor het verrichten waarvan een vergunning is
      vereist op grond van de [Wet op het bevolkingsonderzoek][ref5] en, met uitzondering van de [artikelen 7][ref6]
      en [9][ref7] en de [artikelen 8][ref8], [11][ref9] en [33][ref10], voor zover deze betrekking hebben op
      [artikel 7][ref11], op wetenschappelijk onderzoek waarvan het onderzoeksprotocol ingevolge de [Embryowet][ref12]
      een positief oordeel heeft gekregen van de centrale commissie, bedoeld in [artikel 14][ref13].


