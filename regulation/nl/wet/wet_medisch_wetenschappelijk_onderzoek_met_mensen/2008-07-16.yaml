  - number: 13o
    text: |-
      1 Degene die het wetenschappelijk onderzoek met geneesmiddelen uitvoert, rapporteert alle ernstige ongewenste
      voorvallen, met uitzondering van de ernstige ongewenste voorvallen waarover volgens het protocol of het
      onderzoekersdossier geen onmiddellijke rapportage is vereist, onmiddellijk aan degene die het wetenschappelijk
      onderzoek verricht. De onmiddellijke rapportage wordt gevolgd door gedetailleerde schriftelijke rapporten, waarin
      de proefpersonen met een codenummer worden aangeduid.

      2 Ongewenste voorvallen of abnormale laboratoriumwaarden die volgens het protocol voor de veiligheidsbeoordeling
      van cruciaal belang zijn, worden binnen de in het protocol vermelde termijn aan degene die het wetenschappelijk
      onderzoek verricht, gerapporteerd.

      3 Degene die het wetenschappelijk onderzoek uitvoert, verstrekt aan degene die het wetenschappelijk onderzoek
      verricht, en aan de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie die als laatste haar oordeel heeft
      gegeven, alle gevraagde aanvullende informatie over gerapporteerde sterfgevallen.

      4 Degene die het wetenschappelijk onderzoek verricht, houdt gedetailleerde registers bij van alle ongewenste
      voorvallen die hem door degene die het wetenschappelijk onderzoek uitvoert, worden gerapporteerd. Deze informatie
      wordt op verzoek overgedragen aan de Inspectie voor de Gezondheidszorg en de centrale commissie of Onze Minister
      indien [artikel 13i, vijfde lid][ref2], van toepassing is en de bevoegde instanties van de lidstaten op het
      grondgebied waarvan het wetenschappelijk onderzoek wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13o
