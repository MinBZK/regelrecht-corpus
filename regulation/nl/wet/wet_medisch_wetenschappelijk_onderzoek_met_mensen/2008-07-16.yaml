        artikel: '2'
        paragraaf: '1'
  - number: 13j
    text: |-
      1 De centrale commissie of Onze Minister, ingeval het [vijfde lid van artikel 13i][ref1] van toepassing is, maakt
      slechts gemotiveerd bezwaar indien in de Europese databank reeds bijwerkingen van het geneesmiddel voor onderzoek
      zijn opgenomen, die leiden tot onaanvaardbare risico’s voor de proefpersoon.

      2 De Inspectie voor de Gezondheidszorg controleert op verzoek van de centrale commissie of van Onze Minister,
      ingeval het [vijfde lid van artikel 13i][ref2] van toepassing is, of het wetenschappelijk onderzoek met
      geneesmiddelen naar verwachting kan plaats vinden overeenkomstig deze wet. Het bepaalde in [artikel 5:12][ref3],
      [5:13][ref4] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
