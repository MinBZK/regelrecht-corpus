  - number: 13p
    text: |-
      1 Degene die wetenschappelijk onderzoek met geneesmiddelen verricht, draagt er zorg voor dat alle relevante
      informatie over vermoedens van onverwachte ernstige bijwerkingen van geneesmiddelen voor onderzoek die tot de dood
      van een proefpersoon hebben geleid of kunnen leiden, wordt geregistreerd en zo spoedig mogelijk doch uiterlijk
      binnen zeven dagen nadat hij daarvan kennis heeft genomen, wordt gerapporteerd aan het College, de centrale
      commissie, de betrokken bevoegde instanties van andere lidstaten en de ingevolge [artikel 2, tweede lid][ref1],
      bevoegde commissie en dat relevante informatie over de nasleep daarvan binnen nog eens acht dagen wordt medegedeeld
      aan genoemde instanties.

      2 Alle vermoedens van andere dan in het eerste lid genoemde onverwachte ernstige bijwerkingen van geneesmiddelen
      voor onderzoek worden zo spoedig mogelijk doch uiterlijk binnen vijftien dagen nadat degene die het onderzoek
      verricht, er kennis van heeft genomen, gerapporteerd aan het College, de centrale commissie, de betrokken bevoegde
      instanties van andere lidstaten en de ingevolge [artikel 2, tweede lid][ref2], bevoegde commissie.

      3 Degene die het wetenschappelijk onderzoek verricht, informeert alle anderen die het onderzoek uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13p
