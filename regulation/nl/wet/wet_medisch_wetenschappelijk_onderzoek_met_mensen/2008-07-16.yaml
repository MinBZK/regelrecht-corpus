  - number: '2'
    text: |-
      1 Wetenschappelijk onderzoek wordt verricht overeenkomstig een daartoe opgesteld onderzoeksprotocol.

      2 Over dit onderzoeksprotocol moet een positief oordeel zijn verkregen:

      a. van een commissie die daartoe bevoegd is, wanneer onderdeel b, onder 2°, 3° en 4°, niet van toepassing is;

      b. van de centrale commissie, wanneer het betreft:

      1°. een beslissing op een administratief beroep;

      2°. een wetenschappelijk onderzoek als bedoeld in de [tweede volzin van artikel 4 , eerste lid][ref1], dat niet aan
      de betrokken proefpersoon ten goede kan komen en waarbij diens toestand opzettelijk wordt gewijzigd;

      3°. een wetenschappelijk onderzoek waarvan de beoordeling ingevolge [artikel 19][ref2] bij de centrale commissie
      berust;

      4°. overige bij algemene maatregel van bestuur aangewezen vormen van wetenschappelijk onderzoek waarvan beoordeling
      door de centrale commissie gewenst is gelet op de aan het onderzoek verbonden maatschappelijke, ethische of
      juridische aspecten.

      3 De beoordeling door de onderscheiden commissies geschiedt op de grondslag van de [paragrafen 2][ref3], [3][ref4]
      en voor zover het wetenschappelijk onderzoek met geneesmiddelen betreft, [5a][ref5].


