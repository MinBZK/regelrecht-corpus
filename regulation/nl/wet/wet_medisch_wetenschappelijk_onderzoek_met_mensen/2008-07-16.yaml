  - number: 2a
    text: |-
      Wetenschappelijk onderzoek, met inbegrip van gespreid uitgevoerd wetenschappelijk onderzoek, wordt beoordeeld door
      één bevoegde commissie daartoe aangewezen door degene die het onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel2a
  - number: '3'
    text: |-
      De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie kan slechts een positief oordeel over een
      onderzoeksprotocol geven, indien:

      a. redelijkerwijs aannemelijk is dat het wetenschappelijk onderzoek tot de vaststelling van nieuwe inzichten op het
      gebied van de medische wetenschap zal leiden;

      b. redelijkerwijs aannemelijk is dat de vaststelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek dan wetenschappelijk onderzoek met proefpersonen of door het verrichten van onderzoek
      van minder ingrijpende aard kan geschieden;

      c. redelijkerwijs aannemelijk is dat het met het onderzoek te dienen belang van de proefpersoon en andere huidige
      of toekomstige patiënten in evenredige verhouding staat tot de bezwaren en het risico voor de proefpersoon;

      d. het onderzoek voldoet aan de eisen van een juiste methodologie van wetenschappelijk onderzoek;

      e. het onderzoek wordt uitgevoerd in daarvoor geschikte instellingen en door of onder leiding van personen die
      deskundig zijn op het gebied van wetenschappelijk onderzoek en waarvan er ten minste één deskundig is op het gebied
      van de verrichtingen die ter uitvoering van het onderzoek ten aanzien van de proefpersoon plaatsvinden;

      f. redelijkerwijs aannemelijk is dat aan de proefpersoon te betalen vergoedingen niet in onevenredige mate van
      invloed zijn op het geven van toestemming voor deelneming aan het onderzoek;

      g. degene die het wetenschappelijk onderzoek uitvoert en de instelling waar dit onderzoek plaatsvindt, een
      vergoeding ontvangen die niet hoger is dan een bedrag dat in redelijke verhouding staat tot de aard, de omvang en
      het doel van het wetenschappelijk onderzoek;

      h. in het onderzoeksprotocol duidelijk is aangegeven in hoeverre het wetenschappelijk onderzoek aan de betrokken
      proefpersoon ten goede kan komen;

      i. in het onderzoeksprotocol op het wetenschappelijk onderzoek toegesneden criteria voor de werving van
      proefpersonen zijn opgenomen;

      j. het onderzoek ook overigens voldoet aan redelijkerwijs daaraan te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel3
    references:
