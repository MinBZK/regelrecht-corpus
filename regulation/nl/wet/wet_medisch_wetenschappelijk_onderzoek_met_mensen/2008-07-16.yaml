  - number: 13q
    text: |-
      1 Tijdens de gehele duur van het wetenschappelijk onderzoek met geneesmiddelen verstrekt degene die het onderzoek
      verricht, eenmaal per jaar een lijst van alle vermoedens van ernstige bijwerkingen van geneesmiddelen voor
      onderzoek, die zich in dat jaar hebben voorgedaan en een rapport betreffende de veiligheid van de proefpersonen
      aan:

      a. het College;

      b. de centrale commissie of Onze Minister indien [artikel 13i, vijfde lid][ref1], van toepassing is;

      c. de bevoegde instanties van de andere lidstaten op het grondgebied waarvan het wetenschappelijk onderzoek met
      geneesmiddelen wordt uitgevoerd;

      d. de ingevolge [artikel 2, tweede lid][ref2], bevoegde commissie.

      2 Het College draagt zorg voor invoering van alle gemelde vermoedens van onverwachte ernstige bijwerkingen van een
      geneesmiddel voor onderzoek in de Europese databank, als bedoeld in [artikel 13m, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
