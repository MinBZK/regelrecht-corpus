        paragraaf: '1'
  - number: 3a
    text: |-
      1 Een commissie kan een door haar gegeven positief oordeel over een onderzoeksprotocol opschorten of intrekken
      indien er gegronde redenen zijn om aan te nemen dat voortzetting van het wetenschappelijk onderzoek zou leiden tot
      onaanvaardbare risico’s voor de proefpersoon.

      2 Behoudens ingeval van dreigend gevaar, stelt de commissie, alvorens het positieve oordeel op te schorten of in te
      trekken, degene die het wetenschappelijk onderzoek verricht of degene die het wetenschappelijk onderzoek uitvoert,
      in de gelegenheid binnen één week zijn zienswijze naar voren te brengen.

      3 Indien een commissie besluit een door haar gegeven positief oordeel over een onderzoeksprotocol inzake
      wetenschappelijk onderzoek met geneesmiddelen op te schorten of in te trekken, stelt zij de centrale commissie of
      Onze Minister, ingeval [artikel 13i, vijfde lid][ref1], van toepassing is, en het College hiervan op de hoogte,
      onder opgaaf van redenen.

      4 Het College stelt onder opgaaf van redenen het Europese Bureau voor de geneesmiddelenbeoordeling en de Europese
      Commissie onmiddellijk op de hoogte van de opschorting of intrekking van een gegeven positief oordeel over een
      onderzoeksprotocol inzake een wetenschappelijk onderzoek met geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel3a
