  - number: 13k
    text: |-
      1 Na aanvang van het onderzoek kan degene die het wetenschappelijk onderzoek verricht, het onderzoeksprotocol
      betreffende het wetenschappelijk onderzoek met geneesmiddelen wijzigen.

      2 Indien de wijziging substantieel is en effect kan hebben op de veiligheid van proefpersonen of kan leiden tot een
      andere interpretatie van de wetenschappelijke documenten die het verloop van het onderzoek onderbouwen of indien de
      wijziging anderszins significant is, mag degene die het onderzoek verricht het protocol slechts wijzigen indien:

      a. hij de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie, de in
      [artikel 13i, eerste of vijfde lid][ref2], bedoelde instantie en in voorkomend geval de bevoegde instantie van een
      andere lidstaat, die als laatste haar oordeel heeft gegeven, in kennis stelt van de redenen en de inhoud van de
      voorgenomen wijziging;

      b. de ingevolge [artikel 2, tweede lid][ref3], bevoegde commissie een positief oordeel uitspreekt over het voorstel
      tot wijziging van het protocol en

      c. de in [artikel 13i, eerste of vijfde lid][ref4], bedoelde instantie geen gemotiveerde bezwaren tegen de
      voorgestelde wijziging van het protocol heeft ingebracht.

      3 Ingeval de in [artikel 13i, eerste of vijfde lid][ref5], bedoelde instantie of de bevoegde instanties van andere
      lidstaten gemotiveerde bezwaren tegen de wijziging van het protocol hebben ingebracht, kan het onderzoek slechts
      doorgang vinden indien degene die het wetenschappelijk onderzoek verricht, de voorgenomen wijziging van het
      protocol aanpast aan de gemaakte bezwaren.

      4 De ingevolge [artikel 2, tweede lid][ref6], bevoegde commissie beoordeelt de wijziging van het protocol binnen
      een termijn van vijfendertig dagen na ontvangst van het voorstel tot wijziging van het protocol.

      5 De in [artikel 13i, eerste of vijfde lid][ref7], bedoelde instantie maakt uiterlijk binnen vijfendertig dagen na
      ontvangst van het voorstel tot wijziging van het protocol daartegen gemotiveerde bezwaren.


