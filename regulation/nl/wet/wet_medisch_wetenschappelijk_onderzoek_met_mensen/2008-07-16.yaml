  - number: '4'
    text: |-
      1 Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen die de leeftijd van achttien jaar nog
      niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen ter zake. Dit verbod
      is niet van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan
      komen en op wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de
      proefpersoon behoort, kan worden verricht en waarvan voor hen de risico's verwaarloosbaar en de bezwaren minimaal
      zijn.

      2 Indien de betrokken proefpersoon zich bij een in het eerste lid, tweede volzin, bedoeld wetenschappelijk
      onderzoek verzet tegen een handeling waaraan hij wordt onderworpen of tegen een aan hem opgelegde gedragswijze,
      vindt het onderzoek niet plaats met die proefpersoon.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel4
  - number: '5'
    text: |-
      Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen van wie redelijkerwijs moet worden
      aangenomen dat zij gezien de feitelijke of juridische verhouding tot degene die het onderzoek verricht of uitvoert
      of degene die de proefpersonen werft, niet in vrijheid over deelneming daaraan kunnen beslissen. Dit verbod is niet
      van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan komen en op
      wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de proefpersoon
      behoort, kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden wetenschappelijk onderzoek te verrichten:

      a. indien de proefpersoon meerderjarig is, en onderdeel c niet van toepassing is: zonder de schriftelijke
      toestemming van de betrokkene;

      b. indien de proefpersoon minderjarig is doch de leeftijd van twaalf jaar heeft bereikt en onderdeel c niet
      van toepassing is: zonder schriftelijke toestemming van de betrokkene alsmede die van de ouders die het gezag
      uitoefenen of van zijn voogd;

      c. indien de proefpersoon twaalf jaar of ouder is en niet in staat is tot een redelijke waardering van zijn
      belangen ter zake: zonder de schriftelijke toestemming van de ouders die het gezag uitoefenen of van de voogd dan
      wel indien hij meerderjarig is, van de wettelijke vertegenwoordiger van de betrokkene of, indien deze ontbreekt,
      van de persoon die daartoe door de betrokkene schriftelijk is gemachtigd of, bij het ontbreken van zodanig persoon,
      van de echtgenoot, geregistreerde partner of andere levensgezel van de betrokkene of, indien deze ontbreekt,
      de ouders van de betrokkene of, indien ook dezen ontbreken, de redelijkerwijs bereikbare meerderjarige kinderen
      dan wel, indien dezen eveneens ontbreken, de redelijkerwijs bereikbare meerderjarige broers en zussen van de
      betrokkene;

      d. indien de proefpersoon de leeftijd van twaalf jaar nog niet heeft bereikt: zonder de schriftelijke toestemming
      van de ouders die het gezag uitoefenen of van zijn voogd.

      2 Als de betrokkene niet in staat is te schrijven, kan de toestemming mondeling worden gegeven in de aanwezigheid
      van ten minste één getuige.

      3 De vervangende toestemming van de in het eerste lid, onder c en d, genoemde personen geeft de vermoedelijke wil
      van de proefpersoon weer.

      4 Indien het wetenschappelijk onderzoek alleen kan worden uitgevoerd in noodsituaties waarin de ingevolge
      het eerste lid vereiste toestemming niet kan worden gegeven, en ten goede kan komen aan de persoon die in die
      noodsituatie verkeert, kunnen handelingen ter uitvoering ervan plaatsvinden zonder die toestemming zolang de
      omstandigheid die de verhindering van het geven van toestemming vormt, zich voordoet.

      5 Alvorens toestemming wordt gevraagd, draagt degene die het onderzoek uitvoert er zorg voor dat de persoon wiens
      toestemming is vereist, schriftelijk en desgewenst in een aan de toestemming voorafgaand onderhoud wordt ingelicht
      over:

      a. het doel, de aard en de duur van het onderzoek;

      b. de risico's die het onderzoek voor de gezondheid van de proefpersoon met zich zou brengen;

      c. de risico's die het tussentijds beëindigen van het onderzoek voor de gezondheid van de proefpersoon met zich
      zou brengen;

      d. de bezwaren die het onderzoek voor de proefpersoon met zich zou kunnen brengen.

      6 De inlichtingen worden op zodanige wijze verstrekt dat redelijkerwijs zeker is dat de betrokkene deze naar haar
      inhoud heeft begrepen. Hij krijgt een zodanige bedenktijd dat hij op grond van deze inlichtingen een zorgvuldig
      overwogen beslissing omtrent de gevraagde toestemming kan geven.

      7 Degene die het wetenschappelijk onderzoek uitvoert, draagt ervoor zorg dat proefpersonen die de leeftijd van
      twaalf jaar nog niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen
      ter zake, over het onderzoek worden ingelicht door een daartoe geschoolde persoon op een wijze die past bij hun
      bevattingsvermogen.

      8 De wijze waarop uitvoering wordt gegeven aan het bepaalde in dit artikel wordt vastgelegd in het
      onderzoeksprotocol.

      9 De proefpersoon dan wel, indien deze ingevolge dit artikel niet bevoegd is tot het geven van toestemming, degene
      die daartoe in zijn plaats bevoegd is, kan de toestemming te allen tijde, zonder opgaaf van redenen, intrekken. Hij
      is ter zake van de intrekking geen schadevergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel6
  - number: '7'
    text: |-
      1 Het wetenschappelijk onderzoek wordt slechts verricht indien op het tijdstip waarop het onderzoek aanvangt, een
      verzekering is gesloten die de door het onderzoek veroorzaakte schade door dood of letsel van de proefpersoon dekt.
      De verzekering behoeft niet te dekken de schade waarvan op grond van de aard van het onderzoek zeker of nagenoeg
      zeker was dat deze zich zou voordoen.

      2 Op de verplichting van de verzekeraar tot vergoeding van de schade als bedoeld in het eerste lid is
      [afdeling 10 van titel 1 van Boek 6 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing, voor zover de
      strekking van de betrokken bepalingen in verband met de aard van de verplichting zich daartegen niet verzet.

      3 Bij of krachtens algemene maatregel van bestuur worden ter zake van de verzekering nadere regelen gesteld. De bij
      algemene maatregel van bestuur te stellen regelen kunnen ook afwijkingen bevatten van het bepaalde in het eerste
      en tweede lid. Krachtens algemene maatregel van bestuur te stellen regels betreffen slechts wijziging van in die
      maatregel opgenomen geldbedragen die naar hun aard met regelmaat wijziging behoeven. De algemene maatregel van
      bestuur treedt niet eerder in werking dan acht weken na de datum van uitgifte van het Staatsblad, waarin hij is
      geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.

      4 De wijze waarop uitvoering wordt gegeven aan het eerste en zesde lid wordt vastgelegd in het onderzoeksprotocol.

      5 Is degene die het wetenschappelijk onderzoek uitvoert aansprakelijk voor de schade door dood of letsel van
      de proefpersoon, dan is mede aansprakelijk degene die het wetenschappelijk onderzoek verricht. Voor zover ter
      uitvoering van een wetenschappelijk onderzoek verrichtingen plaatsvinden in een facilitaire instelling, rust deze
      aansprakelijkheid, ook indien het onderzoek niet door die instelling wordt verricht of uitgevoerd, mede op die
      instelling.

      6 Het wetenschappelijk onderzoek wordt voorts slechts verricht indien op het tijdstip waarop het onderzoek aanvangt
      een verzekering is gesloten ter dekking van het risico van de in het vijfde lid bedoelde aansprakelijkheid van
      degene die het onderzoek uitvoert of van degene die het onderzoek verricht, dan wel anderszins voldoende is
      gewaarborgd dat hun verplichtingen ter zake van hun aansprakelijkheid kunnen worden nagekomen.

      7 Het eerste en zesde lid zijn niet van toepassing ter zake van het verrichten van wetenschappelijk onderzoek door
      diensten, instellingen of bedrijven van de rijksoverheid die door Onze Minister zijn aangewezen. De benadeelde
      heeft jegens een dienst, instelling of bedrijf van de rijksoverheid die geen verzekering als bedoeld in het eerste
      lid heeft gesloten de rechten welke hij overeenkomstig dit artikel anders tegenover de verzekeraar zou hebben.

      8 De aansprakelijkheid van de uitvoerder of, in het geval bedoeld in het vijfde lid, van degene die het
      wetenschappelijk onderzoek verricht of van de facilitaire instelling, kan niet worden beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '10'
  - number: '8'
    text: |-
      1 De verplichting zorg te dragen voor de nakoming van de artikelen 2, eerste en tweede lid, en 7 rust op degene die
      het wetenschappelijk onderzoek verricht.

      2 De verplichting zorg te dragen voor de nakoming van artikel 2, eerste en tweede lid, rust in het geval bedoeld in
      artikel 7, vijfde lid, tweede volzin, mede op de facilitaire instelling.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel8
  - number: '9'
    text: |-
      Degene die het wetenschappelijk onderzoek verricht, draagt er zorg voor dat de proefpersoon zich voor inlichtingen
      en advies betreffende het onderzoek kan wenden tot een in het onderzoeksprotocol aan te wijzen arts die niet bij de
      uitvoering van het onderzoek is betrokken.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel9
  - number: '10'
    text: |-
      1 Indien het wetenschappelijk onderzoek een verloop neemt dat in noemenswaardige mate voor de proefpersoon
      ongunstiger is dan in het onderzoeksprotocol is voorzien, doet degene die het onderzoek uitvoert, daarvan
      terstond mededeling aan de proefpersoon, dan wel indien deze ingevolge deze wet niet bevoegd was tot het geven
      van toestemming, aan degene die daartoe in zijn plaats bevoegd was en aan de commissie die ingevolge artikel 2
      als laatste haar oordeel heeft gegeven, met een verzoek om een nader oordeel. Tot het tijdstip waarop een nader
      positief oordeel wordt gegeven, wordt de uitvoering van het onderzoek opgeschort, tenzij de gezondheid van de
      proefpersoon opschorting of beëindiging niet toelaat.

      2 Degene die het wetenschappelijk onderzoek uitvoert, doet onder opgave van de redenen aan de in het eerste lid
      bedoelde commissie eveneens mededeling van de voortijdige beëindiging van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel10
  - number: '11'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, draagt er zorg voor dat de proefpersoon tijdig wordt ingelicht
      over het bepaalde in de [artikelen 6, zesde lid, tweede volzin, en negende lid][ref1], [7][ref2], [9][ref3],
      [10][ref4] en [12][ref5] en over het verloop van het onderzoek. De verstrekte inlichtingen worden desgevraagd
      aangevuld. Gelijke verplichting geldt ten opzichte van de andere personen van wie op grond van [artikel 6][ref6] de
      toestemming is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009408#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0009408#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0009408#Artikel6
