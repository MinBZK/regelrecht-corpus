      - id: ref3
        bwb_id: BWBR0006251
  - number: 13e
    text: |-
      Onverminderd het bepaalde in [paragraaf 2][ref1] mag wetenschappelijk onderzoek met geneesmiddelen bij minderjarige
      proefpersonen slechts worden verricht indien:

      a. het onderzoek van essentieel belang is om de resultaten te kunnen bevestigen van wetenschappelijk onderzoek met
      geneesmiddelen met personen die wel hun toestemming volgens deze wet kunnen geven of van andere onderzoeksmethoden
      en het onderzoek enig direct voordeel inhoudt voor de betrokken groep van patiënten;

      b. de desbetreffende door het Europese Bureau voor de geneesmiddelenbeoordeling vastgestelde wetenschappelijke
      richtsnoeren in acht worden genomen;

      c. het risico, bedoeld in [artikel 4][ref2], en de belastingsgraad specifiek worden gedefinieerd en permanent
      worden gecontroleerd;

      d. de ingevolge [artikel 2, tweede lid][ref3], bevoegde commissie beschikt over expertise op het gebied van
      kindergeneeskunde of pediatrisch advies heeft ingewonnen inzake de klinische, ethische en psychosociale aspecten
      van het onderzoek;

      e. de belangen van de patiënt altijd prevaleren boven die van de wetenschap en de samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0009408
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13f
    text: |-
      Onverminderd het bepaalde in [paragraaf 2][ref1] mag wetenschappelijk onderzoek met geneesmiddelen bij
      meerderjarige proefpersonen die niet in staat zijn tot een redelijke waardering van hun belangen ter zake, slechts
      worden uitgevoerd indien:

      a. het onderzoek van essentieel belang is om de resultaten te kunnen bevestigen van wetenschappelijk
      onderzoek met geneesmiddelen bij personen die wel volgens deze wet hun toestemming kunnen geven, of van andere
      onderzoeksmethoden, en het direct gerelateerd is aan een klinische toestand die levensbedreigend is of de
      gezondheid ondermijnt, en waarin de proefpersoon verkeert;

      b. het risico, bedoeld in [artikel 4][ref2], en de belastingsgraad specifiek worden gedefinieerd en permanent
      worden gecontroleerd;

      c. de ingevolge [artikel 2, tweede lid][ref3], bevoegde commissie beschikt over expertise op het gebied van
      de desbetreffende ziekte en de betrokken populatie of advies heeft ingewonnen inzake de klinische, ethische en
      psychosociale aspecten van de desbetreffende ziekte en populatie;

      d. de belangen van de patiënt altijd prevaleren boven die van de wetenschap en de samenleving;

      e. de redelijke verwachting bestaat dat de voordelen van toediening van het geneesmiddel voor onderzoek voor de
      patiënt in kwestie opwegen tegen de risico’s of dat aan de toediening in het geheel geen risico verbonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel2
