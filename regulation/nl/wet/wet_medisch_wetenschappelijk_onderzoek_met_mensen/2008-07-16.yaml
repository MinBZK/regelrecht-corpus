  - number: 13g
    text: |-
      1 De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie geeft haar oordeel mede gelet op het
      onderzoekersdossier en beslist op een aanvraag tot het verkrijgen van een positief oordeel over een
      onderzoeksprotocol met betrekking tot wetenschappelijk onderzoek met geneesmiddelen binnen zestig dagen na
      ontvangst van de aanvraag.

      2 Gedurende de termijn waarbinnen de aanvraag wordt behandeld kan de ingevolge [artikel 2, tweede lid][ref2],
      bevoegde commissie eenmaal nadere informatie vragen als aanvulling op de door de aanvrager reeds verstrekte
      informatie.

      3 De in het eerste lid genoemde termijn kan bij wetenschappelijk onderzoek met geneesmiddelen voor gentherapie en
      somatische celtherapie en alle geneesmiddelen die genetisch gemodificeerde organismen bevatten, met ten hoogste
      dertig dagen worden verlengd.

      4 De in het eerste en derde lid genoemde termijnen gelden niet voor de beoordeling van wetenschappelijk onderzoek
      met geneesmiddelen voor xenogene celtherapie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13h
    text: |-
      1 Een aanvraag om een oordeel van een daartoe ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie over
      een wetenschappelijk onderzoek met geneesmiddelen moet voldoen aan bij ministeriële regeling gestelde regels.
      Deze regels betreffen de vorm van het verzoek en de bescheiden die daarbij moeten worden overgelegd, met name ten
      aanzien van de informatie die aan proefpersonen wordt verstrekt, en de adequate waarborgen ter bescherming van
      persoonlijke gegevens.

      2 Indien de in het eerste lid bedoelde aanvraag betrekking heeft op wetenschappelijk onderzoek met geregistreerde
      geneesmiddelen, behoeft bij de aanvraag slechts de samenvatting van de productinformatie zoals die bij de
      registratie is vastgesteld te worden verstrekt. Indien sprake is van een ten opzichte van de registratie afwijkende
      toedieningsvorm, indicatie, patiëntengroep of dosering wordt de samenvatting van de productinformatie aangevuld met
      de voor het desbetreffende onderzoek relevante aanvullende informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
        paragraaf: '1'
  - number: 13i
    text: |-
      1 Wetenschappelijk onderzoek met geneesmiddelen mag slechts worden uitgevoerd voor zover de centrale commissie
      daartegen niet binnen de in het derde lid bedoelde termijn gemotiveerde bezwaren kenbaar heeft gemaakt.

      2 Voordat de uitvoering van het wetenschappelijk onderzoek met geneesmiddelen aanvangt, stelt degene die het
      onderzoek verricht, de centrale commissie onder overlegging van het onderzoekersdossier in kennis van het
      onderzoek.

      3 De centrale commissie kan uiterlijk binnen veertien dagen na ontvangst van de in het tweede lid bedoelde
      kennisgeving haar gemotiveerde bezwaren tegen het onderzoek meedelen aan degene die het onderzoek verricht. In dat
      geval kan deze eenmaal wijziging in het voorgenomen onderzoeksprotocol aanbrengen teneinde aan de bezwaren van de
      centrale commissie tegemoet te komen. Maakt degene die het onderzoek verricht van die mogelijkheid geen gebruik,
      dan mag het onderzoek niet aanvangen.

      4 Heeft de in het tweede lid bedoelde kennisgeving betrekking op wetenschappelijk onderzoek met geneesmiddelen
      voor gentherapie, somatische celtherapie, xenogene celtherapie of geneesmiddelen die genetisch gemodificeerde
      organismen bevatten, dan mag de uitvoering van het onderzoek slechts aanvangen indien de centrale commissie dan
      wel Onze Minister, indien het vijfde lid van toepassing is, uitdrukkelijk schriftelijk heeft verklaard geen bezwaar
      tegen het onderzoek te hebben. In dat geval kan de in het derde lid bedoelde termijn worden verlengd met ten
      hoogste dertig dagen, met dien verstande dat op grond van deze wet geen termijn geldt voor het kenbaar maken van
      gemotiveerde bezwaren tegen onderzoek met geneesmiddelen voor xenogene celtherapie.

      5 In afwijking van het eerste en tweede lid wordt, indien de beoordeling van het onderzoeksprotocol ingevolge
      [artikel 2, tweede lid, onder b, 2°, 3° of 4°][ref1] plaatsvindt door de centrale commissie, de in het tweede
      lid bedoelde kennisgeving gedaan bij Onze Minister en beslist deze ter zake met overeenkomstige toepassing van
      dit artikel.

      6 Bij ministeriële regeling worden regels vastgesteld betreffende de vorm en de inhoud van de in het tweede lid
      bedoelde kennisgeving, de hierbij in te dienen bewijsstukken, de vorm en inhoud van een voorstel tot substantiële
      wijzigingen die in het protocol worden aangebracht en de verklaring dat het onderzoek is beëindigd.

      7 Bij ministeriële regeling kunnen regels worden gesteld betreffende de bedragen die voor de met de uitvoering van
      dit artikel gemoeide kosten door de centrale commissie of Onze Minister, ingeval het vijfde lid van artikel 13i van
      toepassing is, in rekening kunnen worden gebracht aan degene die de in het tweede lid bedoelde kennisgeving heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0009408/2008-07-16#Artikel13i
    references:
      - id: ref1
