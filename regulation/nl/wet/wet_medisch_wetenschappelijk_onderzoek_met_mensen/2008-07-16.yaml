  - number: 13l
    text: |-
      1 Degene die het onderzoek verricht stelt de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie, de in
      [artikel 13i, eerste of vijfde lid][ref2], bedoelde instantie en in voorkomend geval de bevoegde instantie van een
      andere lidstaat binnen negentig dagen na het einde van een wetenschappelijk onderzoek met geneesmiddelen ervan op
      de hoogte dat het onderzoek beëindigd is.

      2 Wanneer het onderzoek voortijdig moet worden stopgezet, stelt degene die het onderzoek verricht de ingevolge
      [artikel 2, tweede lid][ref3], bevoegde commissie, de in [artikel 13i, eerste of vijfde lid][ref4], bedoelde
      instantie en in voorkomend geval de bevoegde instantie van een andere lidstaat binnen vijftien dagen na de
      stopzetting onder opgaaf van redenen op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009408#Artikel13i
