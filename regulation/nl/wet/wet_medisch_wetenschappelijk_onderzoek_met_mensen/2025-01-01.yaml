    text: |-
      1 Indien de betrokken proefpersoon zich bij een in de [artikelen 4, tweede volzin][ref1], of
      [5, tweede volzin][ref2], bedoeld wetenschappelijk onderzoek verzet tegen een handeling waaraan hij wordt
      onderworpen of tegen een aan hem opgelegde gedragswijze, vindt het onderzoek niet plaats met die proefpersoon.

      2 De bezwaren en het risico, bedoeld in [artikel 3, onderdeel c][ref3], worden gedefinieerd en permanent
      gecontroleerd door degene die het wetenschappelijk onderzoek uitvoert.


