  - number: 2a
    text: |-
      Wetenschappelijk onderzoek, met inbegrip van wetenschappelijk onderzoek dat volgens één bepaald onderzoeksprotocol
      wordt uitgevoerd op verschillende locaties, wordt beoordeeld door één bevoegde commissie daartoe aangewezen door
      degene die het onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel2a
  - number: '3'
    text: |-
      1 De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie kan slechts een positief oordeel over een
      onderzoeksprotocol geven, indien:

      a. redelijkerwijs aannemelijk is dat het wetenschappelijk onderzoek tot de vaststelling van nieuwe inzichten op het
      gebied van de medische wetenschap zal leiden;

      b. redelijkerwijs aannemelijk is dat de vaststelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek dan wetenschappelijk onderzoek met proefpersonen of door het verrichten van onderzoek
      van minder ingrijpende aard kan geschieden;

      c. redelijkerwijs aannemelijk is dat het met het onderzoek te dienen belang van de proefpersoon en andere huidige
      of toekomstige patiënten in evenredige verhouding staat tot de bezwaren en het risico voor de proefpersoon, waarbij
      mede in aanmerking worden genomen de omstandigheden waarin personen uit de groep waartoe de proefpersoon behoort,
      verkeren;

      d. het onderzoek slechts een minimaal risico en een minimale belasting inhoudt in vergelijking met de
      standaardbehandeling van de aandoening van de proefpersoon in het geval van wetenschappelijk onderzoek dat niet
      aan de betrokken proefpersoon zelf ten goede kan komen, met proefpersonen die de leeftijd van zestien jaar nog niet
      hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen ter zake;

      e. het onderzoek voldoet aan de eisen van een juiste methodologie van wetenschappelijk onderzoek;

      f. het onderzoek wordt uitgevoerd in daarvoor geschikte instellingen en door of onder leiding van personen die
      deskundig zijn op het gebied van wetenschappelijk onderzoek en waarvan er ten minste één deskundig is op het gebied
      van de verrichtingen die ter uitvoering van het onderzoek ten aanzien van de proefpersoon plaatsvinden;

      g. redelijkerwijs aannemelijk is dat aan de proefpersoon te betalen vergoedingen niet van invloed zijn op het geven
      van toestemming voor deelneming aan het onderzoek indien de proefpersoon de leeftijd van achttien jaar nog niet
      heeft bereikt;

      h. redelijkerwijs aannemelijk is dat aan de proefpersoon te betalen vergoedingen niet in onevenredige mate van
      invloed zijn op het geven van toestemming voor deelneming aan het onderzoek indien de proefpersoon de leeftijd van
      achttien jaar heeft bereikt;

      i. degene die het wetenschappelijk onderzoek uitvoert en de instelling waar dit onderzoek plaatsvindt, een
      vergoeding ontvangen die niet hoger is dan een bedrag dat in redelijke verhouding staat tot de aard, de omvang en
      het doel van het wetenschappelijk onderzoek;

      j. in het onderzoeksprotocol duidelijk is aangegeven wat de belastinggraad voor de proefpersoon is en in hoeverre
      het wetenschappelijk onderzoek aan de betrokken proefpersoon ten goede kan komen;

      k. in het onderzoeksprotocol op het wetenschappelijk onderzoek toegesneden criteria voor de werving van
      proefpersonen zijn opgenomen;

      l. de resultaten van het onderzoek door de centrale commissie openbaar toegankelijk zullen worden gemaakt, tenzij
      daartegen bezwaar wordt gemaakt door degene die het wetenschappelijk onderzoek verricht;

      m. het onderzoek ook overigens voldoet aan redelijkerwijs daaraan te stellen eisen.

      2 Indien geen sprake is van een standaardbehandeling als bedoeld in het eerste lid, onderdeel d, kan de bevoegde
      commissie, onverminderd het eerste lid, een positief oordeel over een onderzoeksprotocol geven indien het onderzoek
      slechts een minimaal risico en een minimale belasting inhoudt gezien de aard en ernst van de aandoening van de
      proefpersoon in het geval van wetenschappelijk onderzoek dat niet aan de betrokken proefpersoon zelf ten goede kan
      komen, met proefpersonen die de leeftijd van zestien jaar nog niet hebben bereikt of die niet in staat zijn tot een
      redelijke waardering van hun belangen ter zake.


