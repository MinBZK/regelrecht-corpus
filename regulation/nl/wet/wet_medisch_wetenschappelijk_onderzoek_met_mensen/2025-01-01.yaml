  - number: '4'
    text: |-
      Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen die de leeftijd van zestien jaar nog
      niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen ter zake. Dit verbod
      is niet van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan
      komen en op wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de
      proefpersoon behoort, kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden wetenschappelijk onderzoek te verrichten met proefpersonen van wie redelijkerwijs moet worden
      aangenomen dat zij gezien de feitelijke of juridische verhouding tot degene die het onderzoek verricht of uitvoert
      of degene die de proefpersonen werft, niet in vrijheid over deelneming daaraan kunnen beslissen. Dit verbod is niet
      van toepassing op wetenschappelijk onderzoek dat mede aan de betrokken proefpersonen zelf ten goede kan komen en op
      wetenschappelijk onderzoek dat niet dan met medewerking van proefpersonen uit de categorie waartoe de proefpersoon
      behoort, kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden wetenschappelijk onderzoek te verrichten:

      a. indien de proefpersoon de leeftijd van zestien jaar heeft bereikt, en onderdeel c niet van toepassing is: zonder
      de schriftelijke toestemming van de betrokkene;

      b. indien de proefpersoon de leeftijd van twaalf maar nog niet die van zestien jaar heeft bereikt en onderdeel c
      niet van toepassing is: zonder schriftelijke toestemming van de betrokkene alsmede die van de ouders die het gezag
      uitoefenen of van zijn voogd;

      c. indien de proefpersoon twaalf jaar of ouder is en niet in staat is tot een redelijke waardering van zijn
      belangen ter zake: zonder de schriftelijke toestemming van de ouders die het gezag uitoefenen of van de voogd dan
      wel indien hij de leeftijd van zestien jaar heeft bereikt, van de wettelijke vertegenwoordiger van de betrokkene
      of, indien deze ontbreekt, van de persoon die daartoe door de betrokkene schriftelijk is gemachtigd of, bij het
      ontbreken van zodanig persoon, van de echtgenoot, geregistreerde partner of andere levensgezel van de betrokkene
      of, indien deze ontbreekt, de ouders van de betrokkene of, indien ook dezen ontbreken, de redelijkerwijs bereikbare
      meerderjarige kinderen dan wel, indien dezen eveneens ontbreken, de redelijkerwijs bereikbare meerderjarige broers
      en zussen van de betrokkene;

      d. indien de proefpersoon de leeftijd van twaalf jaar nog niet heeft bereikt: zonder de schriftelijke toestemming
      van de ouders die het gezag uitoefenen of van zijn voogd.

      2 De in het eerste lid bedoelde toestemming kan op elektronische wijze worden verleend mits die wijze voldoende
      betrouwbaar en vertrouwelijk is, passend is voor het onderzoek en in het onderzoeksprotocol is vastgelegd. In het
      onderzoeksprotocol kan worden bepaald dat de toestemming, behoudens de hierna genoemde mogelijkheid van mondelinge
      toestemming, slechts op elektronische wijze kan worden verleend. Als de betrokkene niet in staat is te schrijven of
      op elektronische wijze toestemming te verlenen, kan de toestemming mondeling worden gegeven in de aanwezigheid van
      ten minste één getuige.

      3 De vervangende toestemming van de in het eerste lid, onder c en d, genoemde personen geeft de vermoedelijke wil
      van de proefpersoon weer.

      4 Indien het wetenschappelijk onderzoek alleen kan worden uitgevoerd in noodsituaties waarin de ingevolge
      het eerste lid vereiste toestemming niet kan worden gegeven, en ten goede kan komen aan de persoon die in die
      noodsituatie verkeert, kunnen handelingen ter uitvoering ervan plaatsvinden zonder die toestemming zolang de
      omstandigheid die de verhindering van het geven van toestemming vormt, zich voordoet.

      5 Alvorens toestemming wordt gevraagd draagt degene die het onderzoek uitvoert er zorg voor dat de persoon wiens
      toestemming is vereist, wordt ingelicht over:

      a. het doel, de aard en de duur van het onderzoek;

      b. de risico's die het onderzoek voor de gezondheid van de proefpersoon met zich zou brengen;

      c. de risico's die het tussentijds beëindigen van het onderzoek voor de gezondheid van de proefpersoon met zich
      zou brengen;

      d. de bezwaren die het onderzoek voor de proefpersoon met zich zou kunnen brengen, en

      e. de wijze waarop de toestemming kan worden verleend.

      6 De betreffende proefpersoon wordt op zo mogelijk dezelfde wijze als waarop de toestemming kan worden verleend
      ingelicht, op diens verzoek in ieder geval schriftelijk en desgewenst in een aan de toestemming voorafgaand
      onderhoud. De inlichtingen worden op zodanige wijze verstrekt dat redelijkerwijs zeker is dat de betrokkene deze
      naar haar inhoud heeft begrepen. Hij krijgt een zodanige bedenktijd dat hij op grond van deze inlichtingen een
      zorgvuldig overwogen beslissing omtrent de gevraagde toestemming kan geven. Bij ministeriële regeling kunnen nadere
      eisen worden gesteld aan de inlichtingen die aan betrokkene worden verstrekt.

      7 Degene die het wetenschappelijk onderzoek uitvoert, draagt ervoor zorg dat proefpersonen die de leeftijd van
      twaalf jaar nog niet hebben bereikt of die niet in staat zijn tot een redelijke waardering van hun belangen
      ter zake, over het onderzoek worden ingelicht door een daartoe geschoolde persoon op een wijze die past bij hun
      bevattingsvermogen.

      8 De wijze waarop uitvoering wordt gegeven aan het bepaalde in dit artikel wordt vastgelegd in het
      onderzoeksprotocol.

      9 De proefpersoon dan wel, indien deze ingevolge dit artikel niet bevoegd is tot het geven van toestemming, degene
      die daartoe in zijn plaats bevoegd is, kan de toestemming te allen tijde, zonder opgaaf van redenen, intrekken. Hij
      is ter zake van de intrekking geen schadevergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het wetenschappelijk onderzoek wordt slechts verricht indien op het tijdstip waarop het onderzoek aanvangt, een
      verzekering is gesloten die de bij algemene maatregel van bestuur aangewezen door het onderzoek veroorzaakte schade
      door dood of letsel van de proefpersoon dekt. De verzekering behoeft niet te dekken de schade waarvan op grond van
      de aard van het onderzoek zeker of nagenoeg zeker was dat deze zich zou voordoen.

      2 Op de verplichting van de verzekeraar tot vergoeding van de schade, bedoeld in het eerste lid, zijn van
      [afdeling 6.1.10 van het Burgerlijk Wetboek][ref1] de [artikelen 95][ref2], [96, eerste lid][ref3], [97][ref4],
      [100 tot en met 102][ref5], [105 tot en met 107a, eerste lid][ref6], en [108][ref7] van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur worden ter zake van de verzekering en ter zake van de omvang van
      de dekking van de verzekering nadere regelen gesteld. Krachtens algemene maatregel van bestuur te stellen regels
      betreffen slechts wijziging van in die maatregel opgenomen geldbedragen die naar hun aard met regelmaat wijziging
      behoeven. De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum van uitgifte
      van het Staatsblad, waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide
      kamers der Staten-Generaal.

      4 De verzekering dekt uitsluitend de schade van natuurlijke personen.

      5 Indien naar het oordeel van de commissie die belast is met de beoordeling van het desbetreffende
      onderzoeksprotocol, aan het wetenschappelijk onderzoek voor de proefpersoon naar zijn aard geen risico’s verbonden
      zijn, kan zij bij positief oordeel over het onderzoeksprotocol de verrichter op diens verzoek ontheffing verlenen
      van de verplichting een verzekering te sluiten.

      6 Bij een onderzoek dat tot doel heeft in de kring der beroepsgenoten gebruikelijke handelingen op het gebied van
      de geneeskunst met elkaar te vergelijken, kan de commissie die belast is met de beoordeling van het desbetreffende
      onderzoeksprotocol, bij een positief oordeel de verrichter op diens verzoek ontheffing verlenen van de verplichting
      een verzekering te sluiten indien aan het onderzoek ten gevolge van het vergelijkende karakter daarvan naar het
      oordeel van de commissie voor de proefpersonen naar zijn aard hooguit verwaarloosbare risico’s verbonden zijn.

      7 De wijze waarop uitvoering wordt gegeven aan het eerste en negende lid wordt vastgelegd in het
      onderzoeksprotocol.

      8 Is degene die het wetenschappelijk onderzoek uitvoert aansprakelijk voor de schade door dood of letsel van
      de proefpersoon, dan is mede aansprakelijk degene die het wetenschappelijk onderzoek verricht. Voor zover ter
      uitvoering van een wetenschappelijk onderzoek verrichtingen plaatsvinden in een facilitaire instelling, rust deze
      aansprakelijkheid, ook indien het onderzoek niet door die instelling wordt verricht of uitgevoerd, mede op die
      instelling.

      9 Het wetenschappelijk onderzoek wordt voorts slechts verricht indien op het tijdstip waarop het onderzoek aanvangt
      een verzekering is gesloten ter dekking van het risico van de in het achtste lid bedoelde aansprakelijkheid
      van degene die het onderzoek uitvoert of van degene die het onderzoek verricht, dan wel anderszins voldoende is
      gewaarborgd dat hun verplichtingen ter zake van hun aansprakelijkheid kunnen worden nagekomen.

      10 Het eerste en negende lid zijn niet van toepassing ter zake van het verrichten van wetenschappelijk onderzoek
      door diensten, instellingen of bedrijven van de rijksoverheid die door Onze Minister zijn aangewezen. De benadeelde
      heeft jegens een dienst, instelling of bedrijf van de rijksoverheid die geen verzekering als bedoeld in het eerste
      lid heeft gesloten de rechten welke hij overeenkomstig dit artikel anders tegenover de verzekeraar zou hebben.

      11 De aansprakelijkheid van de uitvoerder of, in het geval bedoeld in het achtste lid, van degene die het
      wetenschappelijk onderzoek verricht of van de facilitaire instelling, kan niet worden beperkt of uitgesloten.


