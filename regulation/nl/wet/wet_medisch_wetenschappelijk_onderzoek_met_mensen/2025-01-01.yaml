$id: wet_medisch_wetenschappelijk_onderzoek_met_mensen
regulatory_layer: WET
publication_date: '2019-11-11'
valid_from: '2025-01-01'
bwb_id: BWBR0009408
url: https://wetten.overheid.nl/BWBR0009408/2025-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met de artikelen 10 en 11 van de Grondwet,
    wenselijk is regelen te stellen met betrekking tot medisch-wetenschappelijk onderzoek met mensen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. wetenschappelijk onderzoek: medisch-wetenschappelijk onderzoek waarvan deel uitmaakt het onderwerpen van
      personen aan handelingen of het opleggen aan personen van een bepaalde gedragswijze;

      c. proefpersoon: de persoon, bedoeld onder b;

      d. onderzoeksprotocol: de volledige beschrijving van een voorgenomen wetenschappelijk onderzoek waaronder de
      doelstellingen, de opzet, de methodologie, de statistische aspecten en de organisatie van het wetenschappelijk
      onderzoek;

      e. facilitaire instelling: instelling of bedrijf waar handelingen ter uitvoering van een wetenschappelijk onderzoek
      plaatsvinden;

      f. degene die het wetenschappelijk onderzoek verricht: een persoon, bedrijf, instelling of organisatie die de
      verantwoordelijkheid op zich neemt voor het starten, het beheer of de financiering van het wetenschappelijk
      onderzoek;

      g. degene die het wetenschappelijk onderzoek uitvoert: een arts of een in [artikel 3, onder f][ref1], bedoelde
      persoon, die verantwoordelijk is voor de uitvoering van het wetenschappelijk onderzoek op een bepaalde locatie.
      Indien de feitelijke uitvoering geschiedt door een werknemer of een andere hulppersoon, wordt degene die van deze
      persoon gebruik maakt aangemerkt als degene die het onderzoek uitvoert;

      h. commissie: een krachtens [artikel 16][ref2] erkende commissie;

      i. centrale commissie: de commissie bedoeld in [artikel 14][ref3];

      j. ongewenst voorval: een schadelijk verschijnsel bij een proefpersoon dat niet noodzakelijk met het
      wetenschappelijk onderzoek verband houdt;

      k. ernstig ongewenst voorval: een ongewenst voorval dat dodelijk is, levensgevaar oplevert voor de proefpersoon,
      opname in een ziekenhuis of verlenging van de opname noodzakelijk maakt, blijvende of significante invaliditeit of
      arbeidsongeschiktheid veroorzaakt dan wel zich uit in een aangeboren afwijking of misvorming;

      l. schriftelijke toestemming: geïnformeerde, schriftelijke, gedagtekende en ondertekende toestemming om aan een
      wetenschappelijk onderzoek deel te nemen;

      m. inspectie: de Inspectie gezondheidszorg en jeugd;

      n. wetenschappelijk onderzoek met medische hulpmiddelen: een klinisch onderzoek waarop hoofdstuk VI van Verordening
      (EU) 2017/745 of een prestatiestudie waarop hoofdstuk VI van Verordening (EU) 2017/746 van toepassing is;

      o. wetenschappelijk onderzoek met geneesmiddelen: een klinische proef waarop [Verordening (EU) 536/2014]
      (32014R0536) van toepassing is;

      p. Verordening (EU) 2017/745: Verordening (EU) 2017/745 van het Europees Parlement en de Raad van 5 april
      2017 betreffende medische hulpmiddelen, tot wijziging van [Richtlijn 2001/83/EG](32001L0083), Verordening (EG)
      nr. 178/2002 en [Verordening (EG) nr. 1223/2009](32009R1223), en tot intrekking van [Richtlijnen 90/385/EEG]
      (31990L0385) en [93/42/EEG](31993L0042) van de Raad (PbEU 2017, L 117);

      q. Verordening (EU) 2017/746: Verordening (EU) 2017/746 van het Europees Parlement en de Raad van 5 april 2017
      betreffende medische hulpmiddelen voor in-vitrodiagnostiek en tot intrekking van [Richtlijn 98/79/EG](31998L0079)
      en Besluit 2010/227/EU van de Commissie (PbEU 2017, L 117);

      r. [Verordening (EU) 536/2014](32014R0536): [verordening (EU) nr. 536/2014](32014R0536) van het Europees Parlement
      en de Raad van 16 april 2014 betreffende klinische proeven met geneesmiddelen voor menselijk gebruik en tot
      intrekking van [Richtlijn 2001/20/EG](32001L0020) (PbEU 2014, L 158).

      2 Het onderwerpen van personen aan handelingen en het opleggen aan personen van een bepaalde gedragswijze
      uitsluitend ten behoeve van de hulpverlening aan hen is onder het eerste lid, onder b, niet begrepen.

      3 Deze wet is niet van toepassing op wetenschappelijk onderzoek voor het verrichten waarvan een vergunning is
      vereist op grond van de [Wet op het bevolkingsonderzoek][ref4] en, met uitzondering van de [artikelen 7][ref5]
      en [9][ref6] en de [artikelen 8][ref7], [11][ref8] en [33][ref9], voor zover deze betrekking hebben op
      [artikel 7][ref10], op wetenschappelijk onderzoek waarvan het onderzoeksprotocol ingevolge de [Embryowet][ref11]
      een positief oordeel heeft gekregen van de ingevolge [artikel 3 van de Embryowet][ref12] bevoegde commissie. Op
      oordelen van de ingevolge artikel 3 van de Embryowet bevoegde commissie is [artikel 23][ref13] van deze wet van
      toepassing.

      4 Het bepaalde in de [artikelen 2, eerste en derde lid][ref14], [2a][ref15], [3][ref16],
      [3a, eerste tot en met derde lid][ref17], [4][ref18], [5][ref19], [6, tweede tot en met negende lid][ref20],
      [8, tweede lid][ref21], [9][ref22], [10][ref23], [10a][ref24], [11][ref25], [12][ref26], [13][ref27],
      [21][ref28] en [30][ref29] is niet van toepassing op wetenschappelijk onderzoek met medische hulpmiddelen en op
      wetenschappelijk onderzoek met geneesmiddelen.

      5 In afwijking van het vierde lid, is het bepaalde in de [artikelen 2a][ref30],
      [3, eerste lid, onderdelen b, c, e, f, g, h en l][ref31], [3a, eerste tot en met derde lid][ref32],
      [6, negende lid][ref33], [10][ref34] en [10a, tweede lid][ref35], van toepassing op ander klinisch onderzoek als
      bedoeld in artikel 82 van Verordening (EU) 2017/745.


