      1 Bij algemene maatregel van bestuur kan worden bepaald dat de op grond van [artikel 16][ref1] erkende commissies
      nagaan of er bij de maatregel aan te wijzen vormen van wetenschappelijk onderzoek waarover de desbetreffende
      commissie ingevolge [artikel 2][ref2] haar oordeel heeft gegeven, gegronde redenen zijn om aan te nemen dat
      voortzetting van het wetenschappelijk onderzoek zou leiden tot onaanvaardbare risico’s voor de proefpersoon. In
      dat geval kan de commissie een nader oordeel over het onderzoeksprotocol geven. [Artikel 10, vierde lid][ref3], is
      van toepassing.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de wijze waarop de commissies
      de in het eerste lid bedoelde taak uitoefenen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de centrale commissie, voor zover
      deze ingevolge [artikel 2, tweede lid, onderdeel b, onder 2°, 3° en 4°][ref4], is belast met de beoordeling
      van onderzoeksprotocollen.


