      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat de persoonlijke levenssfeer van de
      proefpersoon zoveel mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel12
  - number: '13'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert draagt er zorg voor dat, alvorens de uitvoering van een
      onderzoek een aanvang neemt, degenen wier beroepsmatige medewerking nodig is bij de uitvoering van het onderzoek,
      over de aard en het doel van het onderzoek zijn ingelicht.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel13
  - number: '14'
    text: |-
      1 Er is een centrale commissie voor medisch-wetenschappelijk onderzoek. Zij heeft ten hoogste tweeëndertig leden.
      De [Kaderwet zelfstandige bestuursorganen][ref1] is op de centrale commissie van toepassing, met uitzondering van
      [artikel 22 van die wet][ref2], voor zover het besluiten betreft die de centrale commissie neemt ter uitvoering van
      deze wet en de [artikelen 10][ref3], [16][ref4] en [19 van de Embryowet][ref5].

      2 De centrale commissie bestaat in elk geval uit een of meer artsen, en een kinderarts, en uit personen
      die deskundig zijn op het gebied van de embryologie, de farmacologie, de farmacie, de verpleegkunde, de
      gedragswetenschappen, de rechtswetenschap, de methodologie van wetenschappelijk onderzoek en de ethiek, medische
      hulpmiddelen alsmede een persoon die het wetenschappelijk onderzoek specifiek beoordeelt vanuit de invalshoek van
      de proefpersoon.

      3 De leden van de centrale commissie waaronder de voorzitter, worden voor ten hoogste vier jaar benoemd. Onze
      Minister wijst een persoon aan die als waarnemer de vergaderingen van de commissie kan bijwonen.

      4 De centrale commissie wijst uit haar midden een of meer plaatsvervangers voor de voorzitter aan.

      5 Herbenoeming van de leden kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.

      6 De centrale commissie regelt haar werkwijze bij een reglement. Het reglement bevat een voorziening op grond
      waarvan een lid of een plaatsvervangend lid van de centrale commissie niet deelneemt aan de beoordeling van
      een onderzoeksprotocol indien het betrokken is bij het verrichten dan wel uitvoeren van het te beoordelen
      wetenschappelijk onderzoek. In van toepassing zijnde gevallen bevat het reglement een voorziening op grond waarvan
      de beoordeling van onderzoeksprotocollen plaatsvindt in overeenstemming met het bepaalde in artikel 71, eerste
      en tweede lid, van Verordening (EU) 2017/745, artikel 67, eerste en tweede lid, van Verordening (EU) 2017/746 en
      artikel 9, eerste lid, van Verordening (EU) 536/2014.


