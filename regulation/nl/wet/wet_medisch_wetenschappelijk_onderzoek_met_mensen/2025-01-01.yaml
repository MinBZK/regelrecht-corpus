  - number: '32'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Defensie, de artikelen 16, tweede lid, onder a, en
      25, eerste lid, onder a, buiten werking stellen ten aanzien van commissies die belast zijn met de toetsing van
      wetenschappelijk onderzoek naar bescherming tegen de omstandigheden waaraan militair personeel bij operationele
      inzet kan worden blootgesteld, voor zover dit onderzoek wordt verricht met proefpersonen die behoren tot het
      militair personeel.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel32
  - number: '33'
    text: |-
      1 Overtreding van artikel 62, vierde lid, onderdeel f, van [Verordening (EU) 2017/745](32645R2017), artikel 58,
      vijfde lid, onderdeel f, van [Verordening (EU) 2017/746](32646R2017), artikel 28, eerste lid, aanhef en onderdeel
      c, van [Verordening (EU) 536/2014](32014R0536), en van artikel 6, eerste lid, van deze wet, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel33
  - number: 33a
    text: |-
      De ambtenaren van de inspectie zijn bevoegd tot oplegging van een last onder dwangsom:

      a. indien het wetenschappelijk onderzoek met medische hulpmiddelen betreft:

      1° ter handhaving van de artikelen 62, met uitzondering van het tweede lid, tweede alinea, 69, met uitzondering van
      het eerste lid, 72, met uitzondering van het vijfde lid, 77, met uitzondering van het tweede en zesde lid, 80 en 82
      van [Verordening (EU) 2017/745](32645R2017);

      2° ter handhaving van de artikelen 57, 58, met uitzondering van het vierde lid, tweede alinea, 65, met uitzondering
      van het eerste lid, 68, met uitzondering van het vijfde lid, 73, met uitzondering van het tweede en zesde lid, en
      76 van [Verordening (EU) 2017/746](32646R2017);

      3° aan degene die wetenschappelijk onderzoek uitvoert zonder een protocol waarover een positief oordeel is
      verkregen, dan wel in strijd daarmee;

      4° aan degene die wetenschappelijk onderzoek uitvoert terwijl de toelating voor het wetenschappelijk onderzoek is
      ingetrokken of het wetenschappelijk onderzoek is geschorst ingevolge artikel 76, eerste lid, onderdelen a en b,
      van [Verordening (EU) 2017/745](32645R2017), of artikel 72, eerste lid, onderdelen a en b, van [Verordening (EU)
      2017/746](32646R2017), of in strijd met de eisen tot wijziging, bedoeld in artikel 76, eerste lid, onderdeel c, van
      [Verordening (EU) 2017/745](32645R2017), of in artikel 72, eerste lid, onderdeel c, van [Verordening (EU) 2017/746]
      (32646R2017);

      b. indien het wetenschappelijk onderzoek met geneesmiddelen betreft:

      1° ter handhaving van de artikelen 28, eerste lid, aanhef en onderdeel d, 36, 37, 38, eerste lid, 41, 42, 43,
      eerste lid, 47, eerste en tweede volzin, 48, 49, 54, eerste lid, 72, tweede lid, en 76, tweede lid, van Verordening
      (EU) 536/2014;

      2° aan degene die wetenschappelijk onderzoek uitvoert zonder een protocol waarover een positief oordeel is
      verkregen, dan wel in strijd daarmee;

      3° aan degene die na een tijdelijke stopzetting het wetenschappelijk onderzoek hervat zonder dat de hervatting
      ingevolge artikel 38, tweede lid, van Verordening (EU) 536/2014, is toegestaan;

      4° aan degene die wetenschappelijk onderzoek uitvoert terwijl de toelating voor het wetenschappelijk onderzoek is
      ingetrokken of het wetenschappelijk onderzoek is geschorst ingevolge artikel 77, eerste lid, onderdelen a en b, van
      Verordening (EU) 536/2014, of in strijd met de eisen tot wijziging, bedoeld in artikel 77, eerste lid, onderdeel c,
      van Verordening (EU) 536/2014;

      c. indien het ander wetenschappelijk onderzoek betreft:

      1° ter handhaving van de artikelen 7, eerste en derde lid, en 10, met uitzondering van het zesde en zevende lid,
      van deze wet;

      2° aan degene die wetenschappelijk onderzoek uitvoert zonder een protocol waarover een positief oordeel is
      verkregen, dan wel in strijd daarmee;

      3° aan degene die wetenschappelijk onderzoek uitvoert terwijl de commissie een door haar gegeven positief oordeel
      over het onderzoeksprotocol heeft opgeschort of ingetrokken, of de centrale commissie de uitvoering van het
      onderzoek heeft opgeschort.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel33a
