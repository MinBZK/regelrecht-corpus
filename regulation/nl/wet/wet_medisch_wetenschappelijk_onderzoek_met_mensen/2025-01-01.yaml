  - number: 24a
    text: |-
      1 De centrale commissie kan richtlijnen vaststellen over de taal waarin een aanvraag als bedoeld in artikel
      70, eerste lid, van Verordening (EU) 2017/745, of een aanvraagdossier als bedoeld in artikel 5, eerste lid, van
      Verordening (EU) 536/2014 wordt gesteld.

      2 De centrale commissie kan informatie betreffende wetenschappelijk onderzoek in overeenstemming met het bij of
      krachtens Verordening (EU) 536/2014 bepaalde verstrekken aan de bevoegde autoriteiten van andere lidstaten voor
      zover zij die informatie behoeven voor de uitvoering van hun taak.

      3 Een commissie en de ambtenaren van de inspectie kunnen informatie betreffende wetenschappelijk onderzoek in
      overeenstemming met het bij of krachtens Verordening (EU) 536/2014, Verordening (EU) 2017/745 en Verordening (EU)
      2017/746 bepaalde uitwisselen voor zover zij die informatie behoeven voor de uitvoering van hun taken.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel24a
  - number: '25'
    text: |-
      1 De centrale commissie trekt een aan een commissie verleende erkenning in indien:

      a. de commissie niet langer voldoet aan een van de in [artikel 16, tweede lid, onder a tot en met g][ref1], met het
      oog op erkenning gestelde voorwaarden;

      b. de commissie de verplichtingen die voor haar voortvloeien uit deze wet, onvoldoende nakomt;

      c. door een wijziging van het reglement van de commissie een goede uitoefening van de werkzaamheden waarmee zij
      ingevolge deze wet is belast, redelijkerwijs niet langer is verzekerd.

      2 De centrale commissie kan voorts een erkenning intrekken indien door de commissie in de laatste
      twee kalenderjaren een kleiner aantal onderzoeksprotocollen is beoordeeld dan het aantal, bedoeld in
      [artikel 16, tweede lid, onder h][ref2].

      3 Een beslissing tot intrekking van een erkenning wordt niet genomen dan nadat de commissie door de centrale
      commissie is gehoord.

      4 Van de intrekking wordt schriftelijk mededeling gedaan aan de commissie. [Artikel 17, tweede lid][ref3], is van
      overeenkomstige toepassing.


