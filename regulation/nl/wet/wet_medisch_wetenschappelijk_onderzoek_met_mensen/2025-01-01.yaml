    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en van het bepaalde bij of krachtens
      de verordening en van het bepaalde bij of krachtens Verordening (EU) 2017/745, Verordening (EU) 2017/746 en
      Verordening (EU) 536/2014 zijn belast de ambtenaren van de inspectie.

      2 De aan de in het eerste lid bedoelde ambtenaren toekomende bevoegdheden, bedoeld in de [artikelen 5:16][ref1]
      en [5:17 van de Algemene wet bestuursrecht][ref2], hebben mede betrekking op gegevens over de gezondheid van
      proefpersonen.

      3 Voor zover de desbetreffende beroepsbeoefenaar uit hoofde van ambt, beroep of wettelijk voorschrift tot
      geheimhouding van het dossier en de daarin opgenomen persoonsgegevens verplicht is, kan diegene deze verplichting,
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref3], niet inroepen tegenover de
      toezichthouder. Op de toezichthouder rust dezelfde geheimhoudingsplicht als op de desbetreffende beroepsbeoefenaar.


