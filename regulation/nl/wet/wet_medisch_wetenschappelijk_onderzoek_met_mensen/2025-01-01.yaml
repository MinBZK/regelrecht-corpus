  - number: 3a
    text: |-
      1 Een commissie kan een door haar gegeven positief oordeel over een onderzoeksprotocol opschorten of intrekken
      indien er gegronde redenen zijn om aan te nemen dat voortzetting van het wetenschappelijk onderzoek zou leiden tot
      onaanvaardbare risico’s voor de proefpersoon.

      2 Indien er gegronde redenen zijn om aan te nemen dat voortzetting van het wetenschappelijk onderzoek zou leiden
      tot onaanvaardbare risico’s voor de proefpersoon, kan de centrale commissie de uitvoering van het wetenschappelijk
      onderzoek opschorten tot een commissie een nader positief oordeel heeft gegeven over dit onderzoeksprotocol.
      De centrale commissie meldt de opschorting van de uitvoering van het onderzoek aan de commissie die als laatste
      een positief oordeel heeft gegeven over het onderzoeksprotocol en aan degene die het wetenschappelijk onderzoek
      verricht en degene die het onderzoek uitvoert.

      3 Behoudens ingeval van dreigend gevaar, stelt de commissie of de centrale commissie alvorens het positieve
      oordeel op te schorten of in te trekken, dan wel de uitvoering van het wetenschappelijke onderzoek op te schorten,
      degene die het wetenschappelijk onderzoek verricht of degene die het wetenschappelijk onderzoek uitvoert, in de
      gelegenheid binnen één week zijn zienswijze naar voren te brengen.

      4 De ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie kan:

      a. maatregelen als bedoeld in artikel 77, eerste lid, van Verordening (EU) 536/2014 opleggen indien zij om
      gemotiveerde redenen van mening is dat een wetenschappelijk onderzoek met geneesmiddelen niet wordt uitgevoerd of
      verricht in overeenstemming met de voorschriften van die verordening;

      b. maatregelen als bedoeld in artikel 76, eerste lid, van Verordening (EU) 2017/745, of artikel 72, eerste lid,
      van Verordening (EU) 2017/746, opleggen indien zij om gemotiveerde redenen van mening is dat een wetenschappelijk
      onderzoek met medische hulpmiddelen niet wordt uitgevoerd of verricht in overeenstemming met de voorschriften van
      die verordeningen.

      5 Bij het opleggen van een maatregel op grond van het vierde lid neemt de ingevolge [artikel 2, tweede lid][ref2],
      bevoegde commissie:

      a. artikel 77, tweede en derde lid, van Verordening (EU) 536/2014 in acht, indien het betreft wetenschappelijk
      onderzoek met geneesmiddelen;

      b. artikel 76, tweede en derde lid, van Verordening (EU) 2017/745 en artikel 72, tweede en derde lid, van
      Verordening (EU) 2017/746 in acht, indien het betreft wetenschappelijk onderzoek met medische hulpmiddelen.


