  - number: '20'
    text: |-
      1 Als vergoeding voor de met de beoordeling van een onderzoeksprotocol samenhangende kosten kan de ingevolge
      [artikel 2, tweede lid][ref1], bevoegde commissie bij degene die het onderzoeksprotocol ter beoordeling bij haar
      indient, een bedrag in rekening brengen.

      2 De centrale commissie kan als vergoeding van de kosten die zij maakt voor de werkzaamheden, bedoeld in
      [artikel 17a, eerste lid][ref2], een bedrag in rekening brengen bij degene die een onderzoeksprotocol ter
      beoordeling indient.

      3 In afwijking van het eerste lid, kan de centrale commissie als vergoeding van de kosten die samenhangen met
      de beoordeling, bedoeld in [artikel 17a, derde lid][ref3], een bedrag in rekening brengen bij degene die het
      onderzoeksprotocol ter beoordeling heeft ingediend. In dat geval vergoedt de centrale commissie een evenredig deel
      van de kosten van de door de commissie verrichte werkzaamheden aan die commissie.

      4 Bij ministeriële regeling kunnen maximale tarieven worden vastgesteld voor de bedragen, bedoeld in het tweede en
      derde lid, die in rekening worden gebracht.


