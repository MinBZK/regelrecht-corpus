  - number: '36'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder:

        - *de bekendmaking van de mededeling:* de bekendmaking van de mededeling, bedoeld in artikel 82, derde lid, van
      Verordening (EU) 536/2014;
        - *de dag met ingang waarvan de verordening van toepassing is:* de dag, bedoeld in artikel 99, tweede volzin, van
      Verordening (EU) 536/2014.

      2 De aanvraag om een beoordeling van een onderzoeksprotocol voor een wetenschappelijk onderzoek met geneesmiddelen
      die is gedaan voor de dag met ingang waarvan Verordening (EU) 536/2014 van toepassing is, wordt tot drie jaar na
      die dag beoordeeld overeenkomstig deze wet zoals deze luidde op de dag van de aanvraag.

      3 Indien de aanvraag om een beoordeling van een onderzoeksprotocol voor wetenschappelijk onderzoek met
      geneesmiddelen is gedaan tussen zes en achttien maanden na de dag van bekendmaking van de mededeling kan met
      de uitvoering van die klinische proef worden aangevangen indien is voldaan aan het bepaalde in de artikelen 2,
      tweede lid, 2a, 3, 4, 6, eerste tot en met achtste lid, 7, 13c, 13g en 13i, van deze wet, zoals deze luidde op dag
      voorafgaand aan de dag met ingang waarvan Verordening (EU) 536/2014 van toepassing is. Dit overgangsregime geldt
      tot tweeënveertig maanden na de dag van bekendmaking van de mededeling.

      4 Indien de aanvraag om een beoordeling van een onderzoeksprotocol voor een wetenschappelijk onderzoek
      met geneesmiddelen is gedaan tussen 28 mei 2016 en 28 mei 2017 en de bekendmaking van de mededeling heeft
      plaatsgevonden voor 28 november 2015, kan met de uitvoering van die klinische proef worden aangevangen indien is
      voldaan aan het bepaalde in de artikelen 2, tweede lid, 2a, 3, 4, 6, eerste tot en met achtste lid, 7, 13c, 13g en
      13i, van deze wet, zoals deze luidde op dag voorafgaand aan de dag met ingang waarvan Verordening (EU) 536/2014 van
      toepassing is. Dit overgangsregime geldt tot 28 mei 2019.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet, en vervolgens elke vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en effecten van deze wet in de praktijk.

      2 De opvattingen van Onze Minister over het in [artikel 27][ref1] bedoelde rapport en het verslag, bedoeld in
      [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2], zijn onderdeel van het in het eerste
      lid bedoelde verslag.


