      1 Degene die het wetenschappelijk onderzoek verricht, kan voor wetenschappelijk onderzoek met medische hulpmiddelen
      een in Nederland gevestigde contactpersoon aanwijzen als bedoeld in artikel 62, tweede lid, tweede alinea,
      van [Verordening (EU) 2017/745](32645R2017) en in artikel 58, vierde lid, tweede alinea, van [Verordening (EU)
      2017/746](32646R2017). Artikel 62, tweede lid, eerste alinea, van [Verordening (EU) 2017/745](32645R2017) en
      artikel 58, vierde lid, eerste alinea, van [Verordening (EU) 2017/746](32646R2017) zijn in dat geval niet van
      toepassing.

      2 Degene die het wetenschappelijk onderzoek verricht, kan voor wetenschappelijk onderzoek met geneesmiddelen een
      in Nederland gevestigde contactpersoon aanwijzen als bedoeld in artikel 74, tweede lid, van [Verordening (EU)
      536/2014](32014R0536). Artikel 74, eerste lid, van de verordening is in dat geval niet van toepassing.

      3 Degene die het wetenschappelijk onderzoek verricht, kan voor wetenschappelijk onderzoek met geneesmiddelen een
      in de Europese Unie gevestigde contactpersoon aanwijzen als bedoeld in artikel 74, derde lid, van [Verordening (EU)
      536/2014](32014R0536). Artikel 74, eerste lid, van [Verordening (EU) 536/2014](32014R0536) is in dat geval niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel29
  - number: '30'
    text: |-
      De toepassing van deze wet door de commissies geschiedt met inachtneming van de voor de rijksdienst geldende
      nationale en internationale voorschriften ter beveiliging van gegevens waarvan geheimhouding door het belang van de
      Staat of van zijn bondgenoten is geboden.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel30
  - number: '31'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, artikel 32 in werking worden
      gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoel in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.


