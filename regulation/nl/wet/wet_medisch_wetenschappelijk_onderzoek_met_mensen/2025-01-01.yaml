      1 Degene die het wetenschappelijk onderzoek uitvoert, draagt er zorg voor dat de proefpersoon tijdig wordt
      ingelicht over:

      a. het bepaalde in de [artikelen 6, zesde lid, tweede volzin, en negende lid][ref1], [7][ref2], [9][ref3] en
      [12][ref4]; en

      b. het verloop van het onderzoek, waaronder in ieder geval worden begrepen situaties als bedoeld in
      [artikel 10, vierde lid][ref5].

      2 De verstrekte inlichtingen worden desgevraagd aangevuld.

      3 De verplichtingen, bedoeld in het eerste en tweede lid, gelden tevens ten opzichte van de andere personen van wie
      op grond van [artikel 6][ref6] de toestemming is vereist.


