  - number: '24'
    text: |-
      1 De centrale commissie houdt toezicht op de werkzaamheden van de commissies. Zij kan richtlijnen vaststellen ter
      zake van de door hen overeenkomstig deze wet te verrichten werkzaamheden. Zodanige richtlijnen worden door de zorg
      van Onze Minister bekend gemaakt in de Staatscourant.

      2 De centrale commissie draagt ervoor zorg dat de uitoefening van de taken, bedoeld in
      [artikel 17a, eerste lid][ref1], geen afbreuk doet aan de onafhankelijke uitoefening van de taak, bedoeld in
      het eerste lid, eerste volzin. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter
      waarborging van de onafhankelijkheid van de taakuitoefening door de centrale commissie.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel17a
