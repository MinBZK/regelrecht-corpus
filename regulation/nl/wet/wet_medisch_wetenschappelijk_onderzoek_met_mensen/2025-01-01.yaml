  - number: '17'
    text: |-
      1 De centrale commissie brengt een erkenning als bedoeld in artikel 16, eerste lid, terstond ter kennis van Onze
      Minister.

      2 Van een erkenning als bedoeld in artikel 16, eerste lid, wordt door de zorg van Onze Minister mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel17
  - number: 17a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde is de centrale commissie belast met:

      a. de communicatie over de bereidheid van Nederland om als coördinerende lidstaat op te treden, bedoeld in artikel
      78, tweede lid, van Verordening (EU) 2017/745 en in artikel 74, tweede lid, van Verordening (EU) 2017/746, of om
      als rapporterende lidstaat op te treden, bedoeld in artikel 5, eerste lid, van Verordening (EU) 536/2014;

      b. de validering van aanvraagdossiers, bedoeld in de artikelen 70, eerste lid, derde volzin, van Verordening (EU)
      2017/745, en 66, eerste lid, derde volzin, van Verordening (EU) 2017/746 en 5, derde lid, 17, tweede lid, en 20,
      eerste lid, van Verordening (EU) 536/2014;

      c. de toewijzing van aanvraagdossiers als bedoeld in artikel 70, eerste lid, van Verordening (EU) 2017/745,
      artikel 66, eerste lid, van Verordening (EU) 2017/746, of in artikel 5, eerste lid, van Verordening (EU) 536/2014,
      aan commissies, met uitzondering van aanvraagdossiers die betreffen wetenschappelijk onderzoek als bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel b, onder 2° tot en met 4°][ref1], van deze wet;

      d. het beheer van de toegang tot het elektronische systeem, bedoeld in artikel 73 van Verordening (EU) 2017/745, en
      in artikel 69, van Verordening (EU) 2017/746, en het beheer van de toegang tot het portaal, bedoeld in artikel 80
      van Verordening (EU) 536/2014;

      e. de administratieve ondersteuning van commissies die belast zijn met de beoordeling van aanvraagdossiers die
      betrekking hebben op wetenschappelijk onderzoek met medische hulpmiddelen, en op wetenschappelijk onderzoek met
      geneesmiddelen dat niet uitsluitend in Nederland wordt verricht.

      2 Bij de toewijzing van een aanvraagdossier aan een commissie ingevolge het eerste lid, onderdeel c, kan de
      centrale commissie onder meer de ervaring, samenstelling en werkwijze van de betreffende commissie in ogenschouw
      nemen.

      3 De commissie beoordeelt het aanvraagdossier dat op grond van het eerste lid, onderdeel c, aan haar is toegewezen
      en neemt daarbij de bepalingen van Verordening (EU) 2017/745, Verordening (EU) 2017/746 en Verordening (EU)
      536/2014 in acht.

      4 Indien de centrale commissie een aanvraagdossier beoordeelt als bedoeld in artikel 70, eerste lid, van
      Verordening (EU) 2017/745, artikel 66, eerste lid, van Verordening (EU) 2017/746 of in artikel 5, eerste lid, van
      Verordening (EU) 536/2014, neemt zij daarbij het bepaalde bij of krachtens die verordeningen in acht.


