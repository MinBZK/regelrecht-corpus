  - number: '9'
    text: |-
      Degene die het wetenschappelijk onderzoek verricht, draagt er zorg voor dat de proefpersoon zich voor inlichtingen
      en advies betreffende het onderzoek kan wenden tot een in het onderzoeksprotocol aan te wijzen arts die niet bij de
      uitvoering van het onderzoek is betrokken of een andere deskundige die in staat moet worden geacht de proefpersoon
      adequaat van inlichtingen en advies betreffende het onderzoek te voorzien en die niet bij de uitvoering van het
      onderzoek is betrokken.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel9
  - number: '10'
    text: |-
      1 Degene die het wetenschappelijk onderzoek uitvoert, rapporteert alle ernstige ongewenste voorvallen, met
      uitzondering van de ernstige ongewenste voorvallen waarover volgens het onderzoeksprotocol geen onmiddellijke
      rapportage door degene die het wetenschappelijk onderzoek uitvoert, is vereist, onmiddellijk aan degene die het
      wetenschappelijk onderzoek verricht. De onmiddellijke rapportage wordt gevolgd door gedetailleerde schriftelijke
      rapporten, waarin de proefpersonen met codenummer worden aangeduid.

      2 Degene die het wetenschappelijk onderzoek verricht, rapporteert alle ernstige ongewenste voorvallen, met
      uitzondering van die ernstige ongewenste voorvallen waarover volgens het onderzoeksprotocol geen rapportage
      is vereist, aan de ingevolge [artikel 2, tweede lid][ref1], bevoegde commissie en, indien dit niet de centrale
      commissie is, in afschrift aan de centrale commissie.

      3 Tenzij in het onderzoeksprotocol andere termijnen zijn bepaald, geschiedt de rapportage, bedoeld in het tweede
      lid, zo spoedig mogelijk en:

      a. binnen zeven dagen nadat degene die het wetenschappelijk onderzoek verricht kennis heeft genomen van de
      voorvallen, indien het voorvallen betreft die tot de dood van een proefpersoon hebben geleid of kunnen leiden,
      waarbij een aanvullende termijn van acht dagen geldt waarbinnen relevante informatie over de nasleep van het
      voorval wordt overgelegd;

      b. binnen vijftien dagen nadat degene die het wetenschappelijk onderzoek verricht kennis heeft genomen van de
      voorvallen, indien het andere voorvallen betreft.

      4 Indien er tijdens het wetenschappelijk onderzoek gegronde redenen zijn om aan te nemen dat voortzetting van
      het wetenschappelijk onderzoek zou leiden tot onaanvaardbare risico’s voor de proefpersoon, schort degene die het
      wetenschappelijk onderzoek verricht de uitvoering van het onderzoek op tot een nader positief oordeel is verkregen
      van de ingevolge [artikel 2, tweede lid][ref2], bevoegde commissie.

      5 Onder opgave van redenen doet degene die het wetenschappelijk onderzoek verricht aan de ingevolge
      [artikel 2, tweede lid][ref3], bevoegde commissie:

      a. onmiddellijk mededeling van een beslissing tot opschorting van het onderzoek;

      b. binnen vijftien dagen mededeling van een beslissing tot voortijdige beëindiging van het onderzoek.

      6 Voor de toepassing van dit artikel wordt onder ernstig ongewenst voorval mede verstaan een zodanig verschijnsel
      bij een proefpersoon dat zich naar het oordeel van degene die het wetenschappelijk onderzoek uitvoert tijdens
      het onderzoek zou hebben kunnen ontwikkelen tot een ernstig ongewenst voorval, maar waarbij dit ernstig ongewenst
      voorval zich als gevolg van ingrijpen niet heeft verwezenlijkt.

      7 De centrale commissie brengt ieder kalenderjaar verslag uit van het aantal ernstige ongewenste voorvallen
      in het voorafgaande kalenderjaar, met uitzondering van die ernstige ongewenste voorvallen waarover volgens het
      onderzoeksprotocol geen rapportage is vereist.


