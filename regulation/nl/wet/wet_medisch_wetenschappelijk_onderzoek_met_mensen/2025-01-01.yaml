  - number: '15'
    text: |-
      De centrale commissie heeft een secretariaat, ten behoeve waarvan Onze Minister namens de Staat, gehoord de
      centrale commissie, arbeidsovereenkomsten aangaat, wijzigt en beëindigt.
    url: https://wetten.overheid.nl/BWBR0009408/2025-01-01#Artikel15
  - number: '16'
    text: |-
      1 De centrale commissie kan commissies erkennen, die belast zijn met de toetsing van onderzoeksprotocollen
      overeenkomstig het bepaalde bij of krachtens deze wet of de [Embryowet][ref1].

      2 Voor erkenning komt slechts in aanmerking een commissie:

      a. die in elk geval bestaat uit een of meer artsen, en een kinderarts indien het betreft de toetsing van
      onderzoeksprotocollen voor onderzoek met een proefpersoon die de leeftijd van zestien jaar nog niet heeft bereikt,
      en uit personen die deskundig zijn op het gebied van de rechtswetenschap, de methodologie van wetenschappelijk
      onderzoek en de ethiek, alsmede een persoon die het wetenschappelijk onderzoek specifiek beoordeelt vanuit de
      invalshoek van de proefpersoon, en die in geval van beoordeling van wetenschappelijk onderzoek met medische
      hulpmiddelen tevens bestaat uit een persoon die deskundig is op het gebied van medische hulpmiddelen en die ingeval
      van beoordeling van wetenschappelijk onderzoek met geneesmiddelen tevens bestaat uit personen die deskundig zijn op
      het gebied van de farmacie en de klinische farmacologie;

      b. waarvan de leden voldoen aan door de centrale commissie vast te stellen nadere eisen betreffende opleiding en
      ervaring;

      c. waarvan de leden worden benoemd voor een periode van ten hoogste vier jaar en herbenoeming van de leden twee
      maal kan plaatsvinden voor telkens een periode van ten hoogste vier jaar;

      d. in welker reglement genoegzaam is voorzien in medewerking door andere deskundigen met het oog op de aard van de
      haar ter beoordeling voorgelegde onderzoeksprotocollen;

      e. uit welker reglement blijkt voor welke kring zij werkzaam zal zijn;

      f. in welker reglement genoegzaam is voorzien in de onafhankelijkheid ten opzichte van de organisatie die de
      commissie heeft ingesteld;

      g. welker reglement voorziet in een behoorlijke regeling van haar werkwijze en dat onder andere bevat een
      voorziening op grond waarvan de beoordeling van onderzoeksprotocollen plaatsvindt in overeenstemming met het
      bepaalde in artikel 9, eerste lid, van de verordening of, in van toepassing zijnde gevallen, welker reglement
      voorziet in een behoorlijke regeling van haar werkwijze en dat onder andere een voorziening bevat op grond waarvan
      de beoordeling van onderzoeksprotocollen plaatsvindt in overeenstemming met het bepaalde in artikel 71, eerste
      en tweede lid, van Verordening (EU) 2017/745, artikel 67, eerste en tweede lid, van Verordening (EU) 2017/746 en
      artikel 9, eerste lid, van Verordening (EU) 536/2014;

      h. waarvan redelijkerwijs aannemelijk is dat aan haar onderzoeksprotocollen ter beoordeling zullen worden
      voorgelegd tot tenminste het door de centrale commissie daartoe vastgestelde aantal.

      3 Bij de toepassing van de voorwaarden voor erkenning, bedoeld in het tweede lid, onderdelen a, b en d, kan de
      centrale commissie de aard van de aan de commissie voor te leggen onderzoeksprotocollen in ogenschouw nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0013797
