  - number: V
    text: |-
      1 De meerderjarige die vóór het tijdstip van de inwerkingtreding van deze Rijkswet op grond van of, als
      minderjarige, wegens [ artikel 15, aanhef en onder c, van de Rijkswet op het Nederlanderschap][ref1] zijn
      Nederlanderschap heeft verloren, herkrijgt het Nederlanderschap door het afleggen van een daartoe strekkende
      schriftelijke verklaring binnen een termijn van twee jaar na de inwerkingtreding van deze Rijkswet. Deze
      herkrijging werkt terug tot het moment van verlies. [Artikel 6, tweede en vierde lid][ref2], zijn van
      overeenkomstige toepassing. Het minderjarige niet-Nederlandse kind van de vader, moeder of adoptiefouder als
      bedoeld in [artikel 11, achtste lid][ref3], die een verklaring tot herkrijging van het Nederlanderschap aflegt,
      deelt in die verkrijging, indien het in de verklaring tot dat doel is vermeld. Kinderen van een kind dat in die
      verkrijging deelt, delen onder dezelfde voorwaarden in die verkrijging. Een kind dat ten tijde van het afleggen
      van de verklaring de leeftijd van 16 jaar heeft bereikt, deelt slechts in de verkrijging, indien het daarmee
      uitdrukkelijk instemt. De in [artikel 15, eerste lid, aanhef en onder c][ref4], genoemde periode vangt aan op de
      dag van de bevestiging als bedoeld in [artikel 6, tweede lid][ref5].

      2 Hij die op grond van [artikel 15, aanhef en onder c, van de Rijkswet op het Nederlanderschap][ref6], zoals
      dat luidde voor de inwerkingtreding van deze Rijkswet, zijn Nederlanderschap heeft verloren en aan wie na 1
      januari 1990 een verklaring omtrent het bezit van het Nederlanderschap dan wel een reisdocument in de zin van de
      [Paspoortwet][ref7] is verstrekt, wordt geacht het Nederlanderschap niet te hebben verloren.


