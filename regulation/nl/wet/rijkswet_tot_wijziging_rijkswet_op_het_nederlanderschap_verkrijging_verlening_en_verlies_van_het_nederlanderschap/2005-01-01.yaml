  - number: IV
    text: |-
      De in [artikel 15, eerste lid, onder c][ref1], genoemde periode vangt niet eerder aan dan op het tijdstip van
      inwerkingtreding van deze Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0012089/2005-01-01#ArtikelIV
