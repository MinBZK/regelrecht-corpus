  - number: III
    text: |-
      De [artikelen 14, lid 2][ref1], en [16, tweede lid, onder a, b, c en d, van de Rijkswet op het Nederlanderschap][ref2]
      zoals zij op grond van deze Rijkswet komen te luiden, hebben terugwerkende kracht tot en met het tijdstip waarop de
      [Rijkswet op het Nederlanderschap][ref3] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003738
