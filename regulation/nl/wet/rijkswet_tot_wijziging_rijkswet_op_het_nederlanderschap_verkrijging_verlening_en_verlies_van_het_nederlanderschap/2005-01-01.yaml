  - number: VI
    text: |-
      De Rijkswet van 14 november 1963, Stb. 467, houdende wijziging van de Wet op het Nederlanderschap en het
      ingezetenschap (Stb.1892, 268) in verband met het huwelijk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012089/2005-01-01#ArtikelVI
  - number: VII
    text: |-
      1 De artikelen van deze Rijkswet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 De [onderdelen c en d van artikel 8, eerste lid][ref1], zoals deze komen te luiden ingevolge
      [artikel I, onderdeel J][ref2] van deze rijkswet zijn niet van toepassing op verzoeken ingediend voor de datum van
      de inwerkingtreding van dit onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
