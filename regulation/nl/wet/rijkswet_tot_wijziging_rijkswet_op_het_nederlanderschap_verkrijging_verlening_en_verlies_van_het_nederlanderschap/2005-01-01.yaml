    machine_readable:
      paragraph_1:
        inputs:
          - id: loss_of_nationality_before_2005
            type: boolean
            description: Indicates if the person lost Dutch nationality before 2005-01-01 under BWBR0003738 Article 15c
            source:
              regulation: BWBR0003738
              artikel: '15'
          - id: declaration_submitted_date
            type: date
            description: Date of written declaration submission
          - id: applicant_age
            type: integer
            description: Age of the applicant in years
          - id: minors_in_declaration
            type: list
            description: List of minors included in the declaration
            items:
              type: object
              properties:
                age:
                  type: integer
                  description: Age of the minor in years
                explicit_consent:
                  type: boolean
                  description: Explicit consent for minors aged 16 or older
          - id: loss_of_nationality_date
            type: date
            description: Date when Dutch nationality was lost
            source:
              regulation: BWBR0003738
              artikel: '15'
        outputs:
          - id: dutch_nationality_reacquired
            type: boolean
            description: Indicates if Dutch nationality is reacquired
          - id: reacquisition_effective_date
            type: date
            description: Effective date of reacquisition (backdated to loss_of_nationality_date)
        conditions:
          - id: is_adult_or_minor_with_guardian
            description: Applicant is an adult or a minor with a parent/guardian
            expression: applicant_age >= 18
          - id: declaration_submitted_within_deadline
            description: Declaration submitted within 2 years of 2005-01-01
            expression: declaration_submitted_date <= '2007-01-01'
          - id: lost_nationality_under_article_15c
            description: Lost nationality under BWBR0003738 Article 15c
            expression: loss_of_nationality_before_2005 == true
        logic:
          - if:
              - and:
                  - is_adult_or_minor_with_guardian
                  - declaration_submitted_within_deadline
                  - lost_nationality_under_article_15c
            then:
              - set: dutch_nationality_reacquired = true
              - set: reacquisition_effective_date = loss_of_nationality_date
        untranslatables:
          - id: retroactive_reacquisition
            description: The reacquisition works back to the moment of loss (werkt terug tot het moment van verlies)
            reasoning: The engine does not support retroactive date logic for nationality status
      paragraph_2:
        inputs:
          - id: loss_under_article_15c_before_2005
            type: boolean
            description: Indicates if the person lost nationality under BWBR0003738 Article 15c before 2005-01-01
            source:
              regulation: BWBR0003738
              artikel: '15'
          - id: document_or_certificate_after_1990
            type: boolean
            description: Indicates if a nationality certificate or travel document was issued after 1990-01-01
        outputs:
          - id: nationality_not_lost
            type: boolean
            description: Indicates if the person is deemed not to have lost Dutch nationality
        conditions:
          - id: loss_under_article_15c
            expression: loss_under_article_15c_before_2005 == true
          - id: document_issued_after_1990
            expression: document_or_certificate_after_1990 == true
        logic:
          - if:
              - and:
                  - loss_under_article_15c
                  - document_issued_after_1990
            then:
              - set: nationality_not_lost = true
  - number: VI
    text: |-
      De Rijkswet van 14 november 1963, Stb. 467, houdende wijziging van de Wet op het Nederlanderschap en het
      ingezetenschap (Stb.1892, 268) in verband met het huwelijk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012089/2005-01-01#ArtikelVI
    void: true
    void_reason: "Repeal provision - non-computable"
  - number: VII
    text: |-
      1 De artikelen van deze Rijkswet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 De [onderdelen c en d van artikel 8, eerste lid][ref1], zoals deze komen te luiden ingevolge
      [artikel I, onderdeel J][ref2] van deze rijkswet zijn niet van toepassing op verzoeken ingediend voor de datum van
      de inwerkingtreding van dit onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
       [ref2]: https://wetten.overheid.nl/BWBR0012089#ArtikelI
    url: https://wetten.overheid.nl/BWBR0012089/2005-01-01#ArtikelVII
