preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Rijkswet op het Nederlanderschap te wijzigen,
    in het bijzonder op het punt van de bepalingen betreffende de verkrijging, de verlening en het verlies van het
    Nederlanderschap;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012089/2005-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 De intrekking van het Nederlanderschap op grond van [artikel 14, eerste lid][ref1], werkt niet verder terug dan
      tot het tijdstip van inwerkingtreding van deze Rijkswet, indien het Nederlanderschap voor dat tijdstip is verleend.

      2 Voor de toepassing van [artikel 6, eerste lid, onder f][ref2], en [artikel 8, tweede lid][ref3], wordt hij wiens
      Nederlanderschap is ingetrokken op grond van [artikel 14, eerste lid][ref4], juncto het eerste lid van dit artikel,
      niet geacht het Nederlanderschap te hebben bezeten.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel8
