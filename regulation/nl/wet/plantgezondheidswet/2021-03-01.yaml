preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van Verordening
    (EU) 2016/2031 betreffende beschermende maatregelen tegen plaagorganismen bij planten en Verordening (EU)
    2017/625 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
    van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
    plantgezondheid en gewasbeschermingsmiddelen te waarborgen en ter versterking van de handhaving;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *ander materiaal:* ander materiaal als bedoeld in artikel 2, onder 5, van [verordening 2016/2031](32016R2031);
        - *EU gereguleerde niet-quarantaineorganisme:* een EU gereguleerd niet-quarantaineorganisme als bedoeld in artikel
      36 van [verordening 2016/2031](32016R2031);
        - *EU-quarantaineorganisme:* een EU-quarantaineorganisme als bedoeld in artikel 4 van [verordening 2016/2031]
      (32016R2031);
        - *fytosanitaire maatregel:* een fytosanitaire maatregel als bedoeld in artikel 2, onder 22, van [verordening
      2016/2031](32016R2031);
        - *geregistreerde marktdeelnemer:* een geregistreerde marktdeelnemer als bedoeld in artikel 2, onder 10, van
      [verordening 2016/2031](32016R2031);
        - *gesloten faciliteit:* een gesloten faciliteit als bedoeld in artikel 2, onder 20, van [verordening 2016/2031]
      (32016R2031);
        - *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *plant:* een plant als bedoeld in artikel 2, onder 1, van [verordening 2016/2031](32016R2031);
        - *plantaardige producten:* plantaardige producten als bedoeld in artikel 2, onder 2, van [verordening 2016/2031]
      (32016R2031);
        - *plantenpaspoort:* een plantenpaspoort als bedoeld in artikel 78 van [verordening 2016/2031](32016R2031);
        - *professionele marktdeelnemer:* een professionele marktdeelnemer als bedoeld in artikel 2, onder 9, van
      [verordening 2016/2031](32016R2031) en een exploitant als bedoeld in artikel 3, negenentwintigste lid, van
      [verordening 2017/625](32017R0625);
        - *quarantainestation:* een quarantainestation als bedoeld in artikel 2, onder 19, van [verordening 2016/2031]
      (32016R2031);
        - *register:* het register, bedoeld in artikel 65, eerste lid, van [verordening 2016/2031](32016R2031);
        - *schadelijk organisme:* een plaagorganisme als bedoeld in artikel 1, eerste lid, van [verordening 2016/2031]
      (32016R2031);
        - *verordening 2016/2031:* Verordening (EU) 2016/2031 van het Europees Parlement en de Raad van 26 oktober 2016
      betreffende beschermende maatregelen tegen plaagorganismen bij planten, tot wijziging van de Verordeningen (EU)
      nr. 228/213, (EU) nr. 652/2014 en (EU) nr. 1143/2014 van het Europees Parlement en de Raad en tot intrekking van
      de [Richtlijnen 69/464/EEG](31969L0464), [74/647/EEG](31974L0647), [93/85/EEG](31993L0085), [98/57/EG](31998L0057),
      [2000/29/EG](32000L0029), [2006/91/EG](32006L0091) en [2007/33/EG](32007L0033) van de Raad (PbEU 2016, L 317);
        - *verordening 2017/625:* Verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart 2017
      betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de Verordeningen (EG) nr. 999/2001,
      (EG) nr. 396/2005, (EG) nr. 1069/2009, (EG) nr. 1107/2009, (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en
      (EU) 2016/2031 van het Europees Parlement en de Raad, de Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009 van
      de Raad en de [Richtlijnen 98/58/EG](31998L0058), [1999/74/EG](31999L0074), [2007/43/EG](32007L0043), [2008/119/EG]
      (32008L0119) en [2008/120/EG](32008L0120) van de Raad, en tot intrekking van de Verordeningen (EG) nr. [854/2004]
      (32754L2004) en [(EG) nr. 882/2004](32782L2004) van het Europees Parlement en de Raad, de Richtlijnen [89/608/EEG]
      (31989L0608), [89/662/EEG](31989L0662), [90/425/EEG](31990L0425), [91/496/EEG](31991L0496), [96/23/EG](31996L0023),
      [96/93/EG](31996L0093) en [97/78/EG](31997L0078) van de Raad en Besluit [92/438/EEG](31992L0438) van de Raad
      (verordening officiële controles) (PbEU 2017, L 95).

      2 Onder [verordening 2016/2031](32016R2031) wordt mede verstaan de door de Europese Commissie vastgestelde
      gedelegeerde handelingen en uitvoeringshandelingen op grond van deze verordening.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister wordt aangewezen als bevoegde autoriteit, bedoeld in:

      a. artikel 2, zesde lid, van [verordening 2016/2031](32016R2031);

      b. artikel 3, derde lid, onderdeel a, van [verordening 2017/625](32017R0625) voor zover het betreft het gebied,
      genoemd in artikel 1, tweede lid, onderdeel g, van [verordening 2017/625](32017R0625).

      2 Onze Minister wordt aangewezen als de coördinerende instantie, bedoeld in artikel 4, tweede lid, onderdeel b, van
      [verordening 2017/625](32017R0625).

      3 Bij algemene maatregel van bestuur worden één of meer bevoegde autoriteiten als bedoeld in artikel 2, zesde
      lid, van [verordening 2016/2031](32016R2031) en artikel 3, derde lid, onderdeel b, van [verordening 2017/625]
      (32017R0625) aangewezen voor artikelen van bindende onderdelen van EU-rechtshandelingen betreffende beschermende
      maatregelen tegen schadelijke organismen bij planten.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister treft fytosanitaire maatregelen in een situatie als bedoeld in artikel 10, derde alinea en artikel
      29, eerste lid, vierde alinea, van [verordening 2016/2031](32016R2031) met inachtneming van bijlage II, deel 2, van
      [verordening 2016/2031](32016R2031).

      2 Onze Minister treft fytosanitaire maatregelen als bedoeld in bijlage II van [verordening 2016/2031](32016R2031)
      in een situatie als bedoeld in artikel 29, eerste lid, eerste alinea, van [verordening 2016/2031](32016R2031).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister kan in situaties als bedoeld in artikel 31, eerste lid, van [verordening 2016/2031](32016R2031),
      strengere fytosanitaire maatregelen treffen dan de fytosanitaire maatregelen, bedoeld in artikel 28, eerste, tweede
      en derde lid, en artikel 30, eerste, derde en vierde lid, van [verordening 2016/2031](32016R2031).

      2 Onze Minister kan in situaties als bedoeld in artikel 37, negende lid, van [verordening 2016/2031](32016R2031),
      strengere fytosanitaire maatregelen treffen dan de fytosanitaire maatregelen, bedoeld in artikel 37, vierde lid,
      van [verordening 2016/2031](32016R2031).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van de verplichting, bedoeld in artikel 14, eerste lid,
      of artikel 15, eerste lid, van [verordening 2016/2031](32016R2031) in situaties als bedoeld in artikel 14, tweede
      lid, of artikel 15, tweede lid, van [verordening 2016/2031](32016R2031).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel5
  - number: '6'
    text: |-
      1 Bij ministeriële regeling kan een afgebakend gebied als bedoeld in artikel 18, eerste lid, van [verordening
      2016/2031](32016R2031) worden ingesteld, gewijzigd of opgeheven en worden fytosanitaire maatregelen getroffen als
      bedoeld in bijlage II van [verordening 2016/2031](32016R2031).

      2 De burgemeester van een betrokken gemeente verleent medewerking aan Onze Minister bij het nemen van fytosanitaire
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan tijdelijke fytosanitaire maatregelen treffen als bedoeld in artikel 52, tweede lid, van
      [verordening 2016/2031](32016R2031).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel7
  - number: '8'
    text: |-
      1 De fytosanitaire maatregelen, bedoeld in de [hoofdstukken 3][ref1] en [4][ref2], kunnen, indien zij een besluit
      zijn, voor één of meer afzonderlijke gevallen worden genomen.

      2 Aan deze besluiten kunnen voorschriften of beperkingen worden verbonden.

      3 Het is verboden te handelen in strijd met deze besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel8
