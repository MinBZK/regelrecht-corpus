    text: |-
      1 Bij ministeriële regeling kunnen andere categorieën telers of professionele marktdeelnemers dan bedoeld in
      artikel 65, eerste lid, onderdeel a tot en met e, van [verordening 2016/2031](32016R2031), worden verplicht zich in
      te schrijven in het register.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent het register.

      3 Onze Minister stelt de in het register opgenomen gegevens ter beschikking overeenkomstig artikel 68 van
      [verordening 2016/2031](32016R2031).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel14
  - number: '15'
    text: |-
      1 Een ieder verstrekt Onze Minister desgevraagd de gegevens en inlichtingen en verschaft hem desgevraagd inzage in
      de gegevens en bescheiden die redelijkerwijs nodig zijn voor de uitvoering van zijn taken.

      2 Zij die uit hoofde van hun ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. het verstrekken van gegevens en inlichtingen aan Onze Minister;

      b. het bewaren en registreren van gegevens.

      4 Het is verboden te handelen in strijd met dit artikel.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen er sprake is van de situatie, bedoeld in artikel 82,
      eerste alinea, van [verordening 2016/2031](32016R2031) en welke documenten in die situatie vereist zijn.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel16
  - number: '17'
    text: |-
      Onze Minister kan in de situatie als bedoeld in artikel 94, tweede lid van [verordening 2016/2031](32016R2031) het
      fytosanitair certificaat vervangen door een gewaarmerkt afschrift hiervan.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister kan op verzoek een erkenning verlenen tot het aanbrengen van een merkteken op houten
      verpakkingsmateriaal, hout of andere materialen als bedoeld in artikel 98, eerste en tweede lid, van [verordening
      2016/2031](32016R2031) of tot het herstellen van houten verpakkingsmateriaal overeenkomstig artikel 97 van
      [verordening 2016/2031](32016R2031).

      2 Een verzoek tot erkenning wordt bij Onze Minister ingediend met gebruikmaking van een middel dat door Onze
      Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister wijst een nationaal referentielaboratorium aan als bedoeld in artikel 100 van [verordening
      2017/625](32017R0625).

      2 Onze Minister wijst een grenscontrolepost aan als bedoeld in artikel 59 van [verordening 2017/625](32017R0625).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel19
  - number: '20'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. plannen voor de beheersing van risico’s op schadelijke organismen als bedoeld in artikel 91 van [verordening
      2016/2031](32016R2031);

      b. andere maatregelen voor de beheersing van risico’s op schadelijke organismen.

      2 Het is verboden te handelen in strijd met de maatregelen, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel20
  - number: '21'
    text: |-
      1 Een professionele marktdeelnemer is een retributie verschuldigd voor kosten van officiële controles, bedoeld
      in artikel 79 van [verordening 2017/625](32017R0625) en kosten van officiële controles en andere officiële
      activiteiten, bedoeld in artikel 80 van [verordening 2017/625](32017R0625).

      2 Een professionele marktdeelnemer kan een retributie verschuldigd zijn voor:

      a. toelating;

      b. herinspectie.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de retributie.

      4 Het tarief van de retributie en de betalingstermijn wordt bij ministeriële regeling vastgesteld.

      5 Onze Minister kan de verschuldigde bedragen, verhoogd met de invorderingskosten, invorderen bij dwangbevel.

      6 In afwijking van het vierde lid stelt de bevoegde autoriteit het tarief van de retributie met betrekking
      tot de officiële controles en andere officiële activiteiten ten aanzien van de bij of krachtens artikel 37 van
      [verordening 2016/2031](32016R2031) bedoelde voorschriften vast voor de werkzaamheden die de bevoegde autoriteit
      uitvoert.

      7 De bevoegde autoriteit kan de op grond van het zesde lid verschuldigde bedragen, verhoogd met de
      invorderingskosten, invorderen bij dwangbevel.

      8 Indien een professionele marktdeelnemer niet binnen de gestelde betalingstermijn aan zijn betalingsverplichting
      ter zake van retributies voor eerder uitgevoerde werkzaamheden heeft voldaan, kan de bevoegde autoriteit besluiten
      om werkzaamheden als bedoeld in het eerste, tweede en zesde lid voor dezelfde marktdeelnemer niet uit te voeren
      dan nadat deze aan zijn betalingsverplichting ter zake van retributies voor die eerder uitgevoerde werkzaamheden
      heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel21
  - number: '22'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, van het bepaalde bij of krachtens
      [verordening 2016/2031](32016R2031) en het bepaalde bij of krachtens [verordening 2017/625](32017R0625) met
      betrekking tot beschermende maatregelen tegen schadelijke organismen bij planten zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren, alsmede de bij besluit van Onze Minister aangewezen personen, werkzaam bij
      een controle-instelling of een keuringsinstelling als bedoeld in [artikel 8 van de Landbouwkwaliteitswet][ref1]
      onderscheidenlijk [artikel 19 van de Zaaizaad- en plantgoedwet 2005][ref2].

      2 De door Onze Minister aangewezen ambtenaren en personen verstrekken elkaar ter uitvoering van hun taak uit eigen
      beweging of desgevraagd onderling de voor de uitvoering van hun taak noodzakelijke inlichtingen en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel22
