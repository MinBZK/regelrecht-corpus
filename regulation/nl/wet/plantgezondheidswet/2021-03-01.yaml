  - number: '10'
    text: |-
      1 Onze Minister kan een ontheffing verlenen van artikel 5, eerste lid, van [verordening 2016/2031](32016R2031) in
      verband met de in artikel 8, eerste lid, van [verordening 2016/2031](32016R2031) genoemde situaties.

      2 Onze Minister kan een ontheffing verlenen van artikel 40, eerste lid, 41, eerste lid, en 42, tweede lid, van
      [verordening 2016/2031](32016R2031) in verband met de in artikel 48, eerste lid, van [verordening 2016/2031]
      (32016R2031) genoemde situaties.

      3 Onze Minister kan een ontheffing verlenen van artikel 53, eerste lid, en 54, eerste lid, van [verordening
      2016/2031](32016R2031) in verband met de in artikel 58 van [verordening 2016/2031](32016R2031) genoemde situaties.

      4 Een verzoek om ontheffing wordt bij Onze Minister ingediend met gebruikmaking van een middel dat door Onze
      Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel10
  - number: '11'
    text: |-
      1 Onze Minister kan een quarantainestation of een gesloten faciliteit als bedoeld in artikel 60, eerste lid, onder
      a, van [verordening 2016/2031](32016R2031) aanwijzen.

      2 Onze Minister kan op verzoek een bedrijfsruimte tijdelijk als gesloten faciliteit als bedoeld in artikel 60,
      eerste lid, onder c, van [verordening 2016/2031](32016R2031) aanwijzen.

      3 Een verzoek om aanwijzing wordt bij Onze Minister ingediend met gebruikmaking van een middel dat door Onze
      Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister kan op verzoek een vergunning verlenen voor het gebruik van een aangewezen quarantainestation of
      een gesloten faciliteit in een andere lidstaat als bedoeld in artikel 60, eerste lid, onder b, van [verordening
      2016/2031](32016R2031).

      2 Onze Minister kan op verzoek een vergunning verlenen voor het verlaten van planten, plantaardige producten of
      andere materialen uit een quarantainestation of een gesloten faciliteit als bedoeld in artikel 64, eerste lid, van
      [verordening 2016/2031](32016R2031).

      3 Onze Minister kan op verzoek een vergunning verlenen voor het overbrengen van planten, plantaardige producten
      of andere materialen die besmet zijn, van een quarantainestation of een gesloten faciliteit naar een ander
      quarantainestation of een gesloten faciliteit als bedoeld in artikel 64, tweede lid, van [verordening 2016/2031]
      (32016R2031).

      4 Een verzoek om een vergunning wordt bij Onze Minister ingediend met gebruikmaking van een middel dat door Onze
      Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel12
