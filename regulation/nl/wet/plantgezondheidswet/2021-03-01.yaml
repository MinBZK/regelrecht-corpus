  - number: '24'
    text: |-
      1 Eenieder wie zulks aangaat handelt overeenkomstig dan wel verleent zijn medewerking aan de uitvoering van een
      krachtens deze wet genomen maatregel of verrichte handeling, en verleent de in [artikel 22, eerste lid][ref1],
      bedoelde ambtenaren en personen alle medewerking die redelijkerwijs nodig is voor de fytosanitaire controle- en
      inspectiewerkzaamheden.

      2 Eenieder die planten, plantaardige producten of ander materiaal als bedoeld in artikel 2, tweede lid, onder 5,
      van [verordening 2016/2031](32016R2031) onder zich heeft of heeft gehad met betrekking waartoe krachtens deze wet
      een fytosanitaire maatregel is getroffen, verstrekt op het eerste verzoek van de in [artikel 22, eerste lid][ref2],
      bedoelde ambtenaren en personen naar waarheid alle inlichtingen omtrent herkomst en verhandeling hiervan.

      3 Het is verboden te handelen in strijd met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0043194#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Artikel22
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0043194
        artikel: '22'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0043194
        artikel: '22'
        hoofdstuk: '12'
  - number: '25'
    text: |-
      Het is verboden te handelen in strijd met bij ministeriële regeling aangewezen voorschriften van [verordening
      2016/2031](32016R2031), van [verordening 2017/625](32017R0625) met betrekking tot beschermende maatregelen tegen
      schadelijke organismen bij planten en van EU gedelegeerde- en uitvoeringshandelingen van [verordening 2016/2031]
      (32016R2031) en van [verordening 2017/625](32017R0625).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel25
  - number: '26'
    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen in geval van overtreding van het bepaalde bij of krachtens
      de [artikelen 8, derde lid][ref1], [13, tweede lid][ref2], [15, vierde lid][ref3], [20, tweede lid][ref4],
      [24, derde lid][ref5] en [25][ref6].

      2 Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt
      zij aan het Openbaar Ministerie voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0043194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0043194#Artikel15
