  - number: '27'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete
      die voor een overtreding of voor categorieën van overtredingen ten hoogste kan worden opgelegd.

      2 De bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], per overtreding begaan door een natuurlijke
      persoon, en ten hoogste het bedrag dat is bepaald voor de derde categorie, bedoeld in artikel 23, vierde lid, van
      het Wetboek van Strafrecht per overtreding, begaan door een rechtspersoon of een vennootschap of, indien dat meer
      is, 10 procent van de jaaromzet in het boekjaar voorafgaande aan het boekjaar waarin de boete wordt opgelegd.

      3 De berekening van de jaaromzet geschiedt op voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel27
    references:
