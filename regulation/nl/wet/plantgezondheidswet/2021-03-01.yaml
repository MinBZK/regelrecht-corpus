      apparatuur, een woning binnen te treden zonder toestemming van de bewoner.

      2 In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref3] bedoelde geval verpakken en
      verzegelen de in [artikel 22, eerste lid][ref4], bedoelde ambtenaren en personen de monsters ter plaatse.


