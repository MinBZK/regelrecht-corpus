  - number: '28'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij
      of krachtens deze wet en van het bepaalde bij of krachtens [verordening 2016/2031](32016R2031), [verordening
      2017/625](32017R0625) met betrekking tot beschermende maatregelen tegen schadelijke organismen bij planten en
      EU gedelegeerde- en uitvoeringshandelingen van [verordening 2016/2031](32016R2031) en van [verordening 2017/625]
      (32017R0625).
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel28
  - number: '29'
    text: |-
      Bij gebreke van volledige betaling binnen de gestelde termijn kan Onze Minister de bestuurlijke boete of dwangsom,
      verhoogd met de invorderingskosten, invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel29
  - number: 32b
    text: |-
      Onze Minister is bevoegd in gevallen waarin de schade, welke het gevolg is van het toepassen van krachtens de
      [hoofdstukken 3][ref1] en [4][ref2] getroffen fytosanitaire maatregelen, onevenredig zwaar op een of meer personen
      zou drukken, een tegemoetkoming te verlenen in de geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0043194
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0043194
        hoofdstuk: '4'
  - number: 32c
    text: |-
      Verzoeken tot tegemoetkoming in de geleden schade, welke het gevolg is van toepassing van krachtens
      [artikel 3 van de Plantenziektenwet][ref1] gegeven voorschriften, kunnen vanaf het tijdstip van inwerkingtreding
      van [artikel 32b][ref2] worden ingediend op grond van artikel 32b.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Artikel32b
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043194
        artikel: 32b
        hoofdstuk: 15b
  - number: 32d
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel32d
  - number: '33'
    text: |-
      Op de betaling van retributies op grond van de [Plantenziektenwet][ref1] die verschuldigd waren voor het tijdstip
      van inwerkingtreding van deze wet, blijven de regels van toepassing, geldende ten tijde van de dagtekening van
      de nota’s.


      [ref1]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002075
  - number: '34'
    text: |-
      De [Plantenziektenwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002075
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Plantgezondheidswet.'
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel37
  - number: '38'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een
      ander tijdstip worden vastgesteld waarop de [hoofdstukken 13][ref1] en [14][ref2] in werking treden.

      2 [Hoofdstuk 15A][ref3] treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin
      de wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk13
      [ref2]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk14
      [ref3]: https://wetten.overheid.nl/BWBR0043194#Hoofdstuk15a
    url: https://wetten.overheid.nl/BWBR0043194/2021-03-01#Artikel38
