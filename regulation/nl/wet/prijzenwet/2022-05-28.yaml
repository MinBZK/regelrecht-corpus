  - number: '4'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister en Onze Minister wie het mede aangaat tezamen aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel4
  - number: '5'
    text: |-
      1 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      2 Zo nodig oefent de toezichthouder de in [artikel 5:17 van de Algemene wet bestuursrecht][ref3] genoemde
      bevoegdheid uit met behulp van de sterke arm.


