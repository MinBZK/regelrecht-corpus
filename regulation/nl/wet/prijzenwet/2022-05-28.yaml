preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheid te openen regelen te stellen op het
    gebied van de prijzen van goederen of diensten, ingeval de ontwikkeling dier prijzen daartoe aanleiding geeft;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder:

      producten: roerende zaken in de zin van het Burgerlijk Wetboek;

      diensten: alle diensten, in de ruimste zin, met inbegrip van de verrichtingen, welke het voorwerp zijn van
      een verzekerings- of garantieovereenkomst, doch met uitzondering van die, welke het voorwerp zijn van een
      arbeidsovereenkomst;

      Onze Minister: Onze Minister van Economische Zaken en Klimaat.

      2 Deze wet verstaat onder prijzen niet de vergoedingen voor diensten op het gebied van het bankwezen, in de ruimste
      zin, en van de geld- en kapitaalmarkt, voor zover zij het karakter van rentevergoeding dragen.
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, indien er naar zijn oordeel als
      gevolg van een zich plotseling voordoende noodsituatie van de nationale economie, veroorzaakt door een of meer
      schoksgewijs optredende factoren, sprake is van een zodanig versnellende inflatie - of indien er aanwijsbare
      omstandigheden zijn, op grond waarvan hij kan vermoeden dat een dergelijke versnellende inflatie zal ontstaan -,
      dat het nemen van een zodanige maatregel is vereist:

      a. voor producten en diensten in het algemeen verbieden, voor zover het de binnenlandse markt betreft, het
      aanbieden, verkopen, verhuren, krachtens verkoop leveren of krachtens verhuur verschaffen van het genot van
      producten, onderscheidenlijk het aanbieden of verrichten van diensten of het zich verbinden deze te verrichten,
      tegen hogere dan door hem aan te geven prijzen;

      b. voorschriften geven betreffende het voeren van een administratie, waaruit de vorming blijkt van de prijzen,
      die voor producten of diensten, ten aanzien van welke het onder *a* bepaalde toepassing heeft gevonden, op de
      binnenlandse markt worden gevraagd, bedongen of in rekening gebracht.

      2 Een regeling op grond van het eerste lid dient gepaard te gaan met de aankondiging van andere maatregelen
      welke in verband met het zich voordoen van de aldaar bedoelde noodsituatie vereist zijn en die ten doel hebben de
      inflatie te beperken.

      3 Een krachtens het eerste lid vastgestelde regeling geldt voor een bij die regeling vast te stellen tijdvak van
      ten hoogste zes maanden. Dit tijdvak kan eenmaal worden verlengd met ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel2
  - number: 2b
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende:

      a. het bekendmaken van de prijzen, waartegen producten of diensten worden aangeboden;

      b. het bekendmaken van de prijzen per in die maatregel aangewezen meeteenheden, waartegen producten worden
      aangeboden;

      c. het bekendmaken van de vergoedingen, die bij het bepalen van prijzen van diensten voor werkzaamheden per bij
      die maatregel aangewezen tijdsduur in rekening worden gebracht, en het bekendmaken van de geldbedragen, die bij het
      bepalen van prijzen van diensten voor materialen en onderdelen, te gebruiken bij het verrichten van die diensten,
      in rekening worden gebracht;

      d. het specificeren van op verrichte diensten betrekking hebbende rekeningen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende het
      bekendmaken van prijsverminderingen.

      3 De voordracht tot het vaststellen, wijzigen of intrekken van een algemene maatregel van bestuur als in het eerste
      en tweede lid bedoeld wordt Ons gedaan door Onze Minister en Onze Minister wie het mede aangaat te zamen.
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel2b
  - number: '3'
    text: |-
      1 Onze Minister kan van het krachtens de [artikelen 2][ref1] of [2b][ref2] bepaalde op daartoe strekkend verzoek
      ontheffing verlenen.

      2 De ontheffingen kunnen onder beperkingen worden verleend. Aan de ontheffingen kunnen voorschriften worden
      verbonden.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] is van toepassing op de ontheffing, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002353#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel3
