  - number: '11'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan dit geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002353/2022-05-28#Artikel11
  - number: '12'
    text: |-
      1 Een gedraging in strijd met het krachtens de [artikelen 2, eerste lid][ref1], of [3][ref2] bepaalde is een
      misdrijf, wanneer zij opzettelijk geschiedt, en overigens een overtreding.

      2 Een gedraging in strijd met het bij of krachtens [artikel 11][ref3] bepaalde, indien uitdrukkelijk aangeduid als
      strafbaar feit, is een overtreding.


