preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat in verband met massale toestroom van ontheemden het wenselijk is om het
    mogelijk te maken om met spoed tijdelijke onderwijsvoorzieningen in te richten, indien dat noodzakelijk is om het
    recht op onderwijs voor leerplichtigen te waarborgen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046911/2022-08-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Onze Minister voor Primair en Voortgezet Onderwijs zendt binnen een jaar na het vervallen van het in
      [artikel II, onderdeel D][ref1], voorgestelde [artikel 9.5 van de Wet voortgezet onderwijs 2020][ref2], een verslag
      over de doeltreffendheid en de effecten van deze wet in de praktijk aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0046911#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel9
    url: https://wetten.overheid.nl/BWBR0046911/2022-08-01#ArtikelIV
    references:
      - id: ref1
