        artikel: '9'
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046911/2022-08-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet tijdelijke onderwijsvoorzieningen bij massale toestroom van ontheemden.'
    url: https://wetten.overheid.nl/BWBR0046911/2022-08-01#ArtikelVI
