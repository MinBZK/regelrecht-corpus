preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat volgens artikel 49 van de Veewet de algemene maatregel van bestuur
    van 27 April 1953, Stb. 211, houdende bepalingen tot wering van de besmettelijke ziekte van knaagdieren, genaamd
    tularaemie, behoort te worden vervangen door een regeling bij de wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      "Minister": Onze Minister van Landbouw, Visserij en Voedselvoorziening;

      2 Voorts verstaat deze wet onder:

      "knaagdieren": alle dieren, welke vóór in onder- en bovenkaak twee snijtanden hebben.
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Tot wering van besmettelijke ziekten van knaagdieren kan Onze Minister de invoer van:

      a. levende en dode knaagdieren;

      b. organen en andere delen van knaagdieren;

      c. huiden, haar en andere afvallen van knaagdieren;

      uit alle of uit bepaald aangewezen landen verbieden of niet dan voorwaardelijk toestaan.

      2 Van een verbod tot invoer van huiden en haar van knaagdieren zijn uitgezonderd:

      a. gedroogde huiden;

      b. bereid en verwerkt haar.

      3 Indien de invoer is toegestaan onder voorwaarde van voorafgaand onderzoek, wordt voor dat onderzoek vergoeding
      van kosten geheven naar een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Tot wering van besmettelijke ziekten van knaagdieren kan Onze Minister bepalen, dat de doorvoer van:

      a. levende en dode knaagdieren;

      b. organen en andere delen van knaagdieren;

      c. huiden, haar en andere afvallen van knaagdieren;

      slechts is toegestaan onder de voorwaarde, dat zij, na aankomst hier te lande, rechtstreeks onder douaneverband
      naar het kantoor van wederuitvoer worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 Overtreding van het bepaalde krachtens deze wet wordt gestraft met hechtenis van ten hoogste zes maanden of
      geldboete van de eerste categorie.

      2 De in het vorige lid strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn belast, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren:

      a. de ambtenaren der invoerrechten en accijnzen;

      b. de door Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '7'
    text: 'Deze wet kan worden aangehaald als: Wet tot wering van besmettelijke ziekten bij knaagdieren.'
    url: https://wetten.overheid.nl/BWBR0002115/2002-01-01#Artikel7
