  - number: '36.2'
    text: |-
      Indien het verzetschrift wordt ingetrokken omdat de officier van justitie geheel of gedeeltelijk aan de indiener
      van het verzetschrift is tegemoetgekomen wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende officier van justitie. In de overige gevallen kan de desbetreffende officier van justitie, indien
      het verzet wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel36
