bwb_id: BWBR0004581
url: https://wetten.overheid.nl/BWBR0004581/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen om op zichzelf niet ernstige
    gedragingen in strijd met verkeersvoorschriften, gesteld bij of krachtens de Wegenverkeerswet en enkele andere
    wetten, in plaats van op strafrechtelijke wijze op administratiefrechtelijke wijze af te kunnen doen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: *Onze Minister:* Onze Minister van Justitie; *motorrijtuig*, *kenteken* en
      *rijbewijs*: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, van de Wegenverkeerswet 1994][ref1];
      *bestuurder*: alle weggebruikers behalve voetgangers; *kentekenregister*: het register, bedoeld
      in [artikel 42 van de Wegenverkeerswet 1994][ref2]; *gedraging:* een gedraging als bedoeld in
      [artikel 2, eerste lid][ref3]; *administratieve sanctie:* de aan de Staat te betalen geldsom, bedoeld in
      [artikel 2][ref4]; *adres:* aanduiding van straatnaam, huisnummer, plaatsnaam en postcode van het woonhuis van
      de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '2'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004581
        artikel: '2'
        hoofdstuk: II
  - number: '1.2'
    text: |-
      In deze wet wordt mede verstaan onder: *bestuurder*: degene die wordt geacht een motorrijtuig onder zijn
      onmiddellijk toezicht te doen besturen; *kenteken*: het kenteken waaronder een motorrijtuig in het buitenland
      is geregistreerd, het registratienummer, vermeld op het registratiebewijs, afgegeven voor een motorrijtuig
      gebezigd ten behoeve van de strijdkrachten, alsmede enig ander registratienummer waaronder een motorrijtuig in
      Nederland mag worden geregistreerd; *kentekenregister*: een buitenlands register betreffende aldaar geregistreerde
      motorrijtuigen, de registratie betreffende motorrijtuigen gebezigd ten behoeve van de strijdkrachten, bijgehouden
      door Onze Minister van Defensie, alsmede enig andere registratie betreffende motorrijtuigen, waarvan de houder
      gerechtigd is deze in Nederland te voeren; *rijbewijs*: een door het bevoegde gezag in het buitenland afgegeven
      rijbewijs, alsmede een door het militaire gezag afgegeven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Ter zake van de in de bijlage bij deze wet omschreven gedragingen die in strijd zijn met op het verkeer betrekking
      hebbende voorschriften gesteld bij of krachtens de [Wegenverkeerswet 1994][ref1], de [Provinciewet][ref2] of de
      [Gemeentewet][ref3] (*Stb.* 1992, 96), worden op de wijze bij deze wet bepaald administratieve sancties opgelegd.
      Voorzieningen van strafrechtelijke of strafvorderlijke aard zijn uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0005645
      [ref3]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
      - id: ref2
        bwb_id: BWBR0005645
      - id: ref3
        bwb_id: BWBR0005416
  - number: '2.2'
    text: |-
      Als gedragingen in de zin van het eerste lid worden niet beschouwd die gedragingen waarbij letsel aan personen is
      ontstaan of schade aan goederen is toegebracht.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor elke gedraging bepaalt de in het eerste lid bedoelde bijlage de aan de Staat te betalen geldsom. Deze geldsom
      kan niet meer zijn dan € 340 per gedraging.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
  - number: '2.4'
    text: |-
      De in het derde lid bedoelde geldsom wordt voor personen die ten tijde van de gedraging nog geen zestien jaar oud
      waren, gehalveerd.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
  - number: '2.5'
    text: |-
      De in het eerste lid bedoelde bijlage kan bij algemene maatregel van bestuur worden gewijzigd. Deze algemene
      maatregel van bestuur treedt niet eerder in werking dan vier weken na de datum van uitgifte van het *Staatsblad*
      waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
  - number: '2.6'
    text: |-
      Een algemene maatregel van bestuur, als bedoeld in het vijfde lid, wordt vastgesteld op voordracht van Onze
      Minister en Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      Met het toezicht op de naleving van de in [artikel 2, eerste lid][ref1], bedoelde voorschriften zijn belast de bij
      algemene maatregel van bestuur aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd tot het opleggen van een administratieve sanctie ter zake
      van de door hen of op geautomatiseerde wijze vastgestelde gedragingen aan personen die de leeftijd van twaalf jaren
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      De officier van justitie in het arrondissement waar de in het eerste lid bedoelde ambtenaren optreden, houdt
      toezicht op de wijze waarop zij van de hun verleende bevoegdheid gebruik maken. Hij kan daaromtrent beleidsregels
      vaststellen. Bij algemene maatregel van bestuur worden regels gesteld omtrent het toezicht op de wijze waarop
      de in het eerste lid bedoelde ambtenaren van de hun verleende bevoegdheid gebruik maken en de intrekking van die
      bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het College van procureurs-generaal houdt toezicht op de bij deze wet geregelde handhaving van
      verkeersvoorschriften. Het geeft daartoe bevelen aan de hoofden van de arrondissementsparketten.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      De administratieve sanctie wordt opgelegd bij een gedagtekende beschikking. De beschikking bevat een korte
      omschrijving, onder verwijzing naar de aanduiding in de bijlage, van de gedraging ter zake waarvan zij is gegeven
      en het voor die gedraging bepaalde bedrag van de administratieve sanctie, de datum en het tijdstip waarop, alsmede
      de plaats waar de gedraging is geconstateerd. Bij ministeriële regeling worden het model van de beschikking en dat
      van de aankondiging van de beschikking vastgesteld, of de eisen waaraan het model moet voldoen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      Zo mogelijk wordt aanstonds een aankondiging van de beschikking uitgereikt aan degene tot wie zij zich richt,
      of wordt deze achtergelaten in of aan het motorrijtuig. De bekendmaking van de beschikking geschiedt binnen vier
      maanden nadat de gedraging heeft plaatsgevonden, door toezending van de beschikking aan het adres dat betrokkene
      heeft opgegeven of, indien dat niet mogelijk is en de gedraging heeft plaatsgevonden met of door middel van een
      motorrijtuig waarvoor een kenteken is opgegeven, aan het adres dat is opgenomen in het kentekenregister. Indien de
      brief onbestelbaar blijkt te zijn, wordt de beschikking gezonden naar het in de basisadministratie persoonsgegevens
      vermelde adres, tenzij dit hetzelfde is als hetgeen is opgenomen in het kentekenregister. Indien de brief ook op
      het in de basisadministratie persoonsgegevens opgenomen adres onbestelbaar blijkt te zijn, wordt de beschikking
      geacht aan de betrokkene bekend te zijn.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      In een geval als bedoeld in [artikel 31, eerste lid][ref1], geschiedt de bekendmaking door uitreiking van de
      beschikking aan betrokkene. De weigering de beschikking in ontvangst te nemen, schort de bekendmaking daarvan niet
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel31
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '31'
        hoofdstuk: IX
  - number: '4.4'
    text: |-
      De beschikking vermeldt de dag waarop krachtens [artikel 23][ref1] de sanctie uiterlijk moet zijn voldaan. Tevens
      vermeldt de beschikking dat de sanctie dient te worden voldaan door middel van de toegezonden acceptgiro dan wel op
      een in die beschikking aangeduide plaats, alsmede de verhogingen die krachtens [artikel 23, tweede lid][ref2], en
      [artikel 25][ref3] op de administratieve sanctie vallen, indien deze niet tijdig wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel25
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '23'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '23'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '25'
        hoofdstuk: VIII
  - number: '5'
    text: |-
      Indien is vastgesteld dat de gedraging heeft plaatsgevonden met of door middel van een motorrijtuig waarvoor
      een kenteken is opgegeven, en niet aanstonds is vastgesteld wie daarvan de bestuurder is, wordt, onverminderd
      het bepaalde in [artikel 31, tweede lid][ref1], de administratieve sanctie opgelegd aan degene op wiens naam het
      kenteken ten tijde van de gedraging in het kentekenregister was ingeschreven. Daarbij wordt hij gewezen op het
      bepaalde in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel8
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '31'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '8'
        hoofdstuk: IV
  - number: 5a
    text: |-
      Indien is vastgesteld dat de gedraging heeft plaatsgevonden met of door middel van een motorrijtuig, waarmee
      een aanhangwagen waarvoor een kenteken is vereist, wordt voortbewogen, en niet aanstonds is vastgesteld wie
      daarvan de bestuurder is, wordt, onverminderd het bepaalde in [artikel 31, tweede lid][ref1], de administratieve
      sanctie opgelegd aan degene op wiens naam het kenteken van het motorrijtuig ten tijde van de gedraging in
      het kentekenregister was ingeschreven. Indien het kenteken van het motorrijtuig niet is vastgesteld, wordt,
      onverminderd het bepaalde in [artikel 31, tweede lid][ref2], de administratieve sanctie opgelegd aan degene op
      wiens naam het kenteken van de aanhangwagen ten tijde van de gedraging in het kentekenregister was ingeschreven. In
      beide gevallen wordt hij gewezen op het bepaalde in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel8
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '31'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '31'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '8'
        hoofdstuk: IV
  - number: '6.1'
    text: |-
      Tegen de oplegging van de administratieve sanctie kan degene tot wie de beschikking is gericht, beroep instellen
      bij de officier van justitie in het arrondissement waar de gedraging is verricht. Indien niet kan worden
      vastgesteld in welk arrondissement de gedraging is verricht, kan beroep worden ingesteld bij de officier van
      justitie in het arrondissement van de woonplaats van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onverminderd [artikel 6:5 van de Algemene wet bestuursrecht][ref1] vermeldt het beroepschrift de geboortedatum,
      de geboorteplaats en het geboortejaar van degene die het beroep heeft ingesteld, en het nummer van zijn giro- of
      bankrekening, indien hij die heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '7.1'
    text: |-
      De [artikelen 6:14, tweede lid][ref1], [7:16, tweede lid][ref2], [7:24, tweede en vijfde lid][ref3],
      [7:26, vierde lid][ref4], en [10:3, tweede lid, onder c, van de Algemene wet bestuursrecht][ref5] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '7.2'
    text: |-
      In afwijking van [artikel 7:16, eerste lid, van de Algemene wet bestuursrecht][ref1] stelt de officier van justitie
      slechts de indiener van het beroepschrift in de gelegenheid te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '8'
    text: |-
      De officier van justitie vernietigt de beschikking indien, in het geval van [artikel 5][ref1] onderscheidenlijk
      [artikel 5a][ref2], degene op wiens naam het kenteken in het kentekenregister is ingeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004581
        artikel: 5a
        hoofdstuk: III
  - number: 8.a
    text: |-
      aannemelijk maakt dat tegen zijn wil door een ander van het motorrijtuig onderscheidenlijk de aanhangwagen gebruik
      is gemaakt en dat hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen,
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel8
  - number: 8.b
    text: |-
      een voor een termijn van ten hoogste drie maanden schriftelijk bedrijfsmatig aangegane huurovereenkomst overlegt
      waaruit blijkt wie ten tijde van de gedraging de huurder van het motorrijtuig onderscheidenlijk de aanhangwagen
      was, dan wel
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel8
  - number: 8.c
    text: |-
      een vrijwaringsbewijs, bedoeld in [artikel 1, onderdeel ][ref1], of een verklaring als bedoeld in de
      [artikelen 31 tot en met 33 van het Kentekenreglement][ref2], overlegt waaruit blijkt dat hij ten tijde van
      de gedraging geen eigenaar of houder meer was van het betrokken motorrijtuig onderscheidenlijk de betrokken
      aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel31
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '31'
  - number: '9.1'
    text: |-
      Tegen de beslissing van de officier van justitie kan degene die administratief beroep heeft ingesteld, beroep
      instellen bij de rechtbank; het beroep wordt behandeld en beslist door de kantonrechter. In afwijking van
      [artikel 6:4, derde lid, van de Algemene wet bestuursrecht][ref1], wordt het beroepschrift ingediend bij de
      officier van justitie die ingevolge [artikel 6, eerste lid][ref2], op het administratief beroep heeft beslist.
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '6'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '9.2'
    text: 'Het beroep kan worden ingesteld ter zake dat:'
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
  - number: 9.2.a
    text: |-
      de gedraging niet is verricht of dat, buiten het geval van [artikel 5][ref1], degene tot wie de beschikking is
      gericht, de gestelde gedraging niet heeft verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel5
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '5'
        hoofdstuk: III
  - number: 9.2.b
    text: |-
      de officier van justitie had moeten beslissen dat de omstandigheden waaronder de gedraging heeft plaatsgevonden,
      het opleggen van een administratieve sanctie niet billijken dan wel dat hij, gelet op de omstandigheden waarin de
      betrokkene verkeert, een lager bedrag van de administratieve sanctie had moeten vaststellen;
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
  - number: 9.2.c
    text: |-
      de officier van justitie ten onrechte de beschikking niet op grond van [artikel 8][ref1] heeft vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel8
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '8'
        hoofdstuk: IV
  - number: '9.3'
    text: |-
      [ Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel6
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '6'
        hoofdstuk: IV
  - number: '10'
    text: |-
      De officier van justitie brengt het beroepschrift en de op de zaak betrekking hebbende stukken ter kennis
      van de rechtbank van het arrondissement waarin de gedraging is verricht, dan wel, in het geval bedoeld in
      [artikel 6, eerste lid, tweede volzin][ref1], bij de rechtbank van het arrondissement waarin de woonplaats van de
      betrokkene is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel6
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '6'
        hoofdstuk: IV
  - number: '11.1'
    text: |-
      Het beroepschrift en de op de zaak betrekking hebbende stukken worden door de officier van justitie aan de
      rechtbank ter kennis gebracht binnen zes weken nadat de indiener zekerheid heeft gesteld voor de betaling van de
      sanctie, dan wel nadat de termijn daarvoor is verstreken.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de officier van justitie geheel of gedeeltelijk aan de indiener van het beroepschrift tegemoetgekomen is,
      kan de in het eerste lid bedoelde termijn zonodig met vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel11
  - number: '11.3'
    text: |-
      De zekerheid wordt door de indiener bij het Centraal Justitieel Incassobureau te Leeuwarden, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1], gesteld, hetzij door middel
      van de aan betrokkene toegezonden accept-giro, hetzij anderszins door storting op de rekening van het Centraal
      Justitieel Incassobureau. De officier van justitie wijst de indiener van het beroepschrift na de ontvangst ervan
      op de verplichting tot zekerheidstelling en deelt hem mee dat de zekerheidstelling dient te geschieden binnen
      twee weken na de dag van verzending van zijn mededeling. Indien de zekerheidstelling niet binnen deze termijn is
      geschied, wordt het beroep door de kantonrechter niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden
      geoordeeld dat de indiener in verzuim is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: '11.4'
    text: |-
      Alle op een beroepschrift betrekking hebbende stukken worden, indien zekerheidstelling heeft plaatsgevonden,
      nedergelegd ter griffie van de rechtbank. Hiervan wordt door de griffier mededeling gedaan aan degene die het
      beroep heeft ingesteld. De betrokkene of zijn gemachtigde kan binnen een door de kantonrechter bepaalde en aan
      hem door de griffier medegedeelde termijn, deze stukken inzien en daarvan afschriften of uittreksels vragen.
      Op de voor de verstrekking van afschriften en uittreksels aan de betrokkene of zijn gemachtigde in rekening te
      brengen vergoedingen is het ter zake bepaalde bij of krachtens de [Wet tarieven in burgerlijke zaken][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '12.1'
    text: |-
      De kantonrechter stelt, alvorens te beslissen, partijen in de gelegenheid om op een door de kantonrechter bepaalde
      dag en uur op een openbare zitting hun zienswijze nader toe te lichten. Zij worden daartoe door de griffier
      opgeroepen. De oproep aan degene die het beroep heeft ingesteld wordt gericht aan het in het beroepschrift vermelde
      adres.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      Degene die het beroep heeft ingesteld, kan zich ter zitting doen bijstaan of doen vertegenwoordigen door een
      advocaat of door een daartoe schriftelijk door hem gemachtigde.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12
  - number: '12.3'
    text: |-
      Ter zitting kunnen getuigen en deskundigen worden meegebracht, ten einde door de kantonrechter te worden gehoord.
      Deze kan ambtshalve of op verzoek ook andere personen als getuige of deskundige horen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12
  - number: '12.4'
    text: |-
      De kantonrechter kan bevelen, dat getuigen niet zullen worden gehoord en tolken niet tot de uitoefening van hun
      taak zullen worden toegelaten dan na het afleggen van de eed of belofte.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12
  - number: '12.5'
    text: |-
      Zij leggen in dat geval ten overstaan van hem de eed of belofte af; de getuigen: dat zij zullen zeggen de gehele
      waarheid en niets dan de waarheid; de tolken: dat zij hun plichten als tolk met nauwkeurigheid zullen vervullen. De
      deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12
  - number: 12a
    text: |-
      [Titel IV van het Vierde Boek van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '13.1'
    text: |-
      Indien de kantonrechter bevindt dat het beroep ontvankelijk is en dat de beslissing van de officier van justitie
      niet of niet ten volle gehandhaafd kan worden, verklaart de kantonrechter het beroep geheel of gedeeltelijk gegrond
      en vernietigt of wijzigt het daarbij de bestreden beslissing.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      De beslissing van de kantonrechter is met redenen omkleed en wordt hetzij terstond, hetzij uiterlijk veertien dagen
      nadien, op een openbare zitting uitgesproken.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      De beslissing wordt in het proces-verbaal der zitting aangetekend. De aantekening bevat de gronden waarop de
      beslissing berust. Een afschrift van de aantekening van de beslissing wordt toegezonden aan partijen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13
  - number: 13a.1
    text: |-
      De kantonrechter is bij uitsluiting bevoegd een partij te veroordelen in de kosten die een andere partij
      in verband met de behandeling van het beroep bij de rechtbank, en van het bezwaar of van het administratief
      beroep redelijkerwijs heeft moeten maken. De [artikelen 7:15, tweede tot en met vierde lid][ref1], en
      [7:28, tweede lid, eerste volzin, derde en vierde lid, van de Algemene wet bestuursrecht][ref2] zijn van
      toepassing. Een natuurlijke persoon kan slechts in de kosten worden veroordeeld in geval van kennelijk onredelijk
      gebruik van procesrecht. Het [Besluit proceskosten bestuursrecht][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006358
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0006358
  - number: 13a.2
    text: |-
      In geval van een veroordeling in de kosten ten behoeve van een partij aan wie ter zake van het
      beroep op de kantonrechter, het bezwaar of het administratief beroep een toevoeging is verleend
      krachtens de [Wet op de rechtsbijstand][ref1], wordt het bedrag van de kosten betaald aan de griffier.
      [Artikel 243 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel243
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006368
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '243'
  - number: 13a.3
    text: |-
      In geval van een veroordeling in de kosten ten behoeve van de indiener van het beroepschrift worden de kosten door
      de Staat der Nederlanden vergoed.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13a
  - number: 13b.1
    text: |-
      In geval van intrekking van het beroep omdat de officier van justitie geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, kan de officier van justitie op verzoek van de indiener bij afzonderlijke
      uitspraak met toepassing van [artikel 13a][ref1] in de kosten worden veroordeeld. Het verzoek wordt gedaan tegelijk
      met de intrekking van het beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-ontvankelijk
      verklaard. Het verzoek wordt bij de officier van justitie ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel13a
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: 13a
        hoofdstuk: V
  - number: 13b.2
    text: |-
      De kantonrechter stelt de verzoeker zo nodig in de gelegenheid het verzoek schriftelijk toe te lichten en stelt de
      officier van justitie in de gelegenheid een verweerschrift in te dienen. Hij stelt hiervoor termijnen vast. Indien
      het verzoek mondeling wordt gedaan, kan de kantonrechter bepalen dat het toelichten van het verzoek en het voeren
      van verweer onmiddellijk mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13b
  - number: 13b.3
    text: |-
      Indien het toelichten van het verzoek en het voeren van verweer mondeling zijn geschied, sluit de kantonrechter
      het onderzoek.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13b
  - number: 13b.4
    text: |-
      Indien het verzoek schriftelijk wordt toegelicht, nodigt de kantonrechter partijen uit ter zitting te verschijnen.
      Indien partijen daarvoor toestemming hebben gegeven, kan de kantonrechter bepalen dat het onderzoek ter zitting
      achterwege blijft. De kantonrechter kan ook ambtshalve besluiten het verzoek buiten zitting af te doen. De
      kantonrechter sluit vervolgens het onderzoek.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel13b
  - number: '14.1'
    text: |-
      Degene die bij de rechtbank beroep heeft ingesteld, alsmede de officier van justitie, kunnen tegen de beslissing
      van de kantonrechter hoger beroep instellen bij het gerechtshof te Leeuwarden, tenzij de opgelegde administratieve
      sanctie bij die beslissing niet meer bedraagt dan € 70.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Eveneens kan degene die bij de rechtbank beroep heeft ingesteld doch daarin met toepassing van het bepaalde in
      [artikel 11, derde lid][ref1], niet-ontvankelijk is verklaard, tegen die beslissing hoger beroep instellen op de
      grond dat de kantonrechter ten onrechte heeft geoordeeld dat de zekerheid niet dan wel niet tijdig is gesteld dan
      wel ten onrechte niet heeft geoordeeld dat de indiener redelijkerwijs niet geacht kan worden in verzuim te zijn
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel11
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '11'
        hoofdstuk: V
  - number: '15.1'
    text: |-
      In afwijking van [artikel 6:4 van de Algemene wet bestuursrecht][ref1] geschiedt het instellen van hoger beroep
      door het indienen van een beroepschrift bij de rechtbank van de kantonrechter tegen wiens beslissing het beroep
      is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '15.2'
    text: |-
      Nadat de termijn voor het instellen van hoger beroep is verstreken, zendt de griffier van de rechtbank het
      ingekomen beroepschrift met de stukken van het geding en een afschrift van de beslissing onverwijld ter griffie van
      het gerechtshof te Leeuwarden in.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel15
  - number: '16.1'
    text: Het gerechtshof beslist, behoudens het bepaalde in het tweede lid, in enkelvoudige kamers.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      De oudste in rang van de voorzitters van de meervoudige kamers regelt de verdeling van de werkzaamheden over de
      kamers. Indien de voorzitter de zaak niet vatbaar acht voor afdoening door een enkelvoudige kamer, wijst hij voor
      de behandeling van de zaak de meervoudige kamer aan.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      De voorzitter is bevoegd een reeds door een meervoudige kamer in behandeling genomen zaak op voordracht van die
      kamer te verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel16
  - number: '16.4'
    text: Een enkelvoudige kamer kan een zaak in iedere stand van het geding naar een meervoudige kamer verwijzen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel16
  - number: '17'
    text: |-
      De [artikelen 512 tot en met 518 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: '18.1'
    text: |-
      Nadat het hoger beroep is ingesteld treedt de advocaat-generaal van het ressortsparket te Leeuwarden als partij in
      de plaats van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      De officier van justitie verstrekt de advocaat-generaal van het ressortsparket te Leeuwarden de nodige
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel18
  - number: '19.1'
    text: |-
      De griffier van het gerechtshof zendt een door hem voor eensluidend getekend afschrift van het beroepschrift
      onverwijld toe aan degene, die mede tot het instellen van hoger beroep gerechtigd was.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel19
  - number: '19.2'
    text: |-
      Deze kan binnen vier weken nadat het afschrift is verzonden, bij het gerechtshof een ondertekend verweerschrift
      indienen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel19
  - number: '19.3'
    text: |-
      De griffier van het gerechtshof zendt een door hem voor eensluidend getekend verweerschrift onverwijld aan
      degene die hoger beroep heeft ingesteld. Deze kan binnen twee weken nadat het afschrift van het verweerschrift is
      verzonden schriftelijk een nadere toelichting geven op zijn beroep. Indien een nadere toelichting gegeven wordt,
      stelt het gerechtshof de in het eerste lid bedoelde persoon in de gelegenheid hierop eveneens binnen twee weken
      te reageren.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel19
  - number: '19.4'
    text: |-
      Partijen kunnen afschriften van of uittreksels uit door hen omschreven stukken verkrijgen. Op de voor de
      verstrekking van afschriften of uittreksels in rekening te brengen vergoedingen is het bij of krachtens de Wet
      tarieven in burgerlijke zaken bepaalde van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel19
  - number: '20'
    text: |-
      Het gerechtshof kan partijen en zonodig getuigen en deskundigen opdragen binnen een bepaalde termijn schriftelijk
      inlichtingen te geven of onder hen berustende stukken in te zenden.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20
  - number: 20a.1
    text: |-
      Een partij kan schriftelijk verzoeken om een behandeling ter zitting. Zodanig verzoek wordt ingediend bij het
      beroepschrift of, indien een verweerschrift is ingediend, uiterlijk binnen twee weken na verzending daarvan door
      het gerechtshof aan de wederpartij.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20a
  - number: 20a.2
    text: De voorzitter van de kamer die de zaak in behandeling heeft bepaalt dag en uur van de behandeling ter zitting.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20a
  - number: 20a.3
    text: De zitting is openbaar.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20a
  - number: 20b
    text: |-
      Indien de zaak op een zitting zal worden behandeld worden de stukken van het geding neergelegd ter griffie van
      het gerechtshof. Hiervan wordt door de griffier mededeling gedaan aan partijen, onder vermelding van de termijn
      waarbinnen deze stukken aldaar kunnen worden ingezien en dat daarvan afschriften of uittreksels kunnen worden
      gevraagd. Op de voor de verstrekking van afschriften of uittreksels in rekening te brengen vergoedingen is het bij
      of krachtens de [Wet tarieven in burgerlijke zaken][ref1] bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: 20c.1
    text: |-
      Indien de zaak op een zitting zal worden behandeld worden partijen uitgenodigd ter zitting. De oproep aan degene
      die hoger beroep heeft ingesteld wordt gericht aan het adres opgegeven in het beroepschrift in hoger beroep
      dan wel, in geval de officier van justitie hoger beroep heeft ingesteld, aan het door de betrokkene in het
      verweerschrift of in het beroepschrift bij de rechtbank opgegeven adres.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20c.2
    text: |-
      Degene aan wie de administratieve sanctie is opgelegd, kan zich ter zitting laten bijstaan of zich door een
      gemachtigde laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20c.3
    text: |-
      Ter zitting kunnen getuigen of deskundigen worden meegebracht ten einde door het gerechtshof te worden gehoord. Het
      gerechtshof kan ambtshalve of op verzoek ook andere personen als getuige of deskundige horen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20c.4
    text: |-
      Het gerechtshof kan bevelen dat getuigen niet zullen worden gehoord en tolken niet tot de uitoefening van hun taak
      zullen worden toegelaten dan na het afleggen van de eed of belofte.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20c.5
    text: |-
      Ze leggen in dat geval ten overstaan van de voorzitter de eed of belofte af; de getuigen: dat zij zullen zeggen
      de gehele waarheid en niets dan de waarheid; de tolken: dat zij hun plichten als tolk met nauwkeurigheid zullen
      vervullen. De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te vervullen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20c.6
    text: |-
      Van het verhandelde ter zitting wordt proces-verbaal opgemaakt, hetwelk door de voorzitter en de griffier wordt
      vastgesteld en ondertekend.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20c
  - number: 20d.1
    text: |-
      Indien het gerechtshof het beroepschrift ontvankelijk acht, bevestigt het gerechtshof de beslissing van
      de kantonrechter, hetzij met overneming, hetzij met verbetering van de gronden, of doet het, met gehele of
      gedeeltelijke vernietiging van de bestreden beslissing van de kantonrechter, hetgeen de kantonrechter zou behoren
      te doen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20d
  - number: 20d.2
    text: |-
      Indien de beslissing van de kantonrechter moet worden vernietigd op de in [artikel 14, tweede lid][ref1], genoemde
      grond wijst het gerechtshof de zaak terug naar de rechtbank, tenzij door betrokkene de behandeling van het beroep
      door het gerechtshof zelf is verlangd. In geval van terugwijzing doet de kantonrechter recht met inachtneming van
      het arrest van het gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel14
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '14'
        hoofdstuk: VI
  - number: 20d.3
    text: |-
      Het arrest van het gerechtshof is met redenen omkleed. Het wordt op een openbare zitting uitgesproken. Indien
      de zaak ter zitting is behandeld wordt het arrest aangetekend in het proces-verbaal van die zitting en wordt het
      uiterlijk veertien dagen na de sluiting van het onderzoek ter zitting uitgesproken. Indien de zaak niet ter zitting
      is behandeld wordt het arrest op een door de voorzitter te bepalen dag uiterlijk zes weken nadat de laatste van de
      in [artikel 19][ref1] bedoelde termijnen is verstreken uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel19
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '19'
        hoofdstuk: VI
  - number: 20d.4
    text: |-
      De [artikelen 13a][ref1] en [13b][ref2] zijn van overeenkomstige toepassing, met uitzondering van de laatste volzin
      van [artikel 13b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: 13a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
  - number: 20d.5
    text: Een afschrift van het arrest wordt toegezonden aan partijen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel20d
  - number: '21.1'
    text: |-
      De verplichting tot zekerheidstelling vervalt nadat ten aanzien van de opgelegde administratieve sanctie een
      onherroepelijke beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel21
  - number: '21.2'
    text: |-
      Indien de in het eerste lid bedoelde beslissing inhoudt dat de opgelegde administratieve sanctie geheel of
      gedeeltelijk blijft gehandhaafd, wordt de verschuldigde administratieve sanctie op de zekerheidstelling verhaald.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel21
  - number: '22.1'
    text: Met de inning van de administratieve sancties is de officier van justitie belast.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel22
  - number: '22.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent de inning voorschriften gegeven. Deze voorschriften
      hebben in ieder geval betrekking op de plaats en wijze van betaling van de administratieve sanctie, de
      verantwoording van de ontvangen geldbedragen, alsmede op de kosten van verhaal, de invorderingskosten daaronder
      begrepen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel22
  - number: '23.1'
    text: |-
      Uiterlijk binnen twee weken nadat een beschikking waarbij een administratieve sanctie is opgelegd, onherroepelijk
      is geworden, moet de administratieve sanctie zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel23
  - number: '23.2'
    text: |-
      De sanctie wordt van rechtswege met vijfentwintig procent, doch ten minste € 4, verhoogd indien deze niet tijdig
      geheel wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel23
  - number: '24'
    text: |-
      Degene aan wie een administratieve sanctie is opgelegd, is tot betaling van het ingevolge [artikel 23][ref1]
      verhoogde bedrag verplicht binnen vier weken nadat de officier van justitie hem over de gewone post een aanmaning
      heeft toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel23
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '23'
        hoofdstuk: VIII
  - number: '25.1'
    text: |-
      Indien degene aan wie een administratieve sanctie is opgelegd nalatig blijft de sanctie en de daarop gevallen
      verhoging geheel te voldoen binnen de in de aanmaning gestelde termijn van vier weken, wordt het inmiddels
      verschuldigde bedrag van rechtswege verder verhoogd met vijftig procent van het bedrag van de sanctie en de
      daarop inmiddels gevallen verhoging, doch ten minste € 11, en kan door de officier van justitie verhaal worden
      genomen op de goederen, de inkomsten en het vermogen van degene aan wie een administratieve sanctie is opgelegd,
      overeenkomstig het bepaalde in de [artikelen 26][ref1] en [27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel27
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '26'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '27'
        hoofdstuk: VIII
  - number: '25.2'
    text: |-
      Door de officier van justitie kan verhaal worden genomen gedurende twee jaar nadat ten aanzien van de
      administratieve sanctie een onherroepelijke beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel25
  - number: '25.3'
    text: |-
      Het recht om verhaal te nemen vervalt door het overlijden van degene aan wie een administratieve sanctie is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Verhaal op de goederen van degene aan wie de administratieve sanctie is opgelegd geschiedt krachtens een
      dwangbevel, medebrengende het recht om die goederen zonder vonnis aan te tasten.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het dwangbevel wordt in naam des Konings uitgevaardigd door de officier van justitie in het arrondissement
      Leeuwarden. Het wordt ten uitvoer gelegd als een vonnis van de burgerlijke rechter.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.3'
    text: |-
      Tegen de tenuitvoerlegging van het dwangbevel kan verzet worden gedaan, hetwelk niet gericht zal kunnen zijn tegen
      de beslissing waarbij de administratieve sanctie werd opgelegd. Verzet wordt gedaan bij een met redenen omkleed
      verzetschrift. Het verzetschrift wordt binnen twee weken na de betekening van het dwangbevel ingediend bij de
      rechtbank van het arrondissement waar het adres is van degene aan wie de administratieve sanctie is opgelegd. Wordt
      binnen twee weken na de betekening tot inbeslagneming overgegaan, dan wordt het verzetschrift binnen een week na de
      dag van inbeslagneming ingediend. Bij het verzetschrift worden het dwangbevel en een afschrift van het exploit van
      betekening van het dwangbevel overgelegd.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.4'
    text: |-
      Degene aan wie de administratieve sanctie is opgelegd, is een griffierecht verschuldigd. De griffier wijst de
      indiener van het verzetschrift op de verschuldigdheid van het griffierecht en deelt hem mee dat het verschuldigde
      bedrag binnen twee weken na de dag van verzending van zijn mededeling dient te zijn bijgeschreven op de rekening
      van de rechtbank dan wel ter griffie te zijn gestort. Indien het bedrag niet binnen deze termijn is bijgeschreven
      of gestort, wordt het verzet niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de
      indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.5'
    text: |-
      Indien de in het derde lid bedoelde stukken niet zijn overgelegd, deelt de griffier de indiener van het
      verzetschrift mee dat deze stukken binnen twee weken na de dag van verzending van zijn mededeling ter griffie
      dienen te zijn overgelegd. Indien dit laatste niet binnen deze termijn is geschied, wordt het verzet niet-
      ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.6'
    text: |-
      De griffier brengt het verzetschrift en de daarop betrekking hebbende stukken ter kennis van de officier
      van justitie in het arrondissement Leeuwarden, ten einde hem in de gelegenheid te stellen daarover de nodige
      opmerkingen te maken. De officier van justitie stelt de betrokken gerechtsdeurwaarder ervan in kennis dat verzet
      is gedaan. De kantonrechter geeft zo spoedig mogelijk na afloop van deze termijn, na zo nodig degene aan wie de
      administratieve sanctie is opgelegd te hebben gehoord, althans opgeroepen om te verschijnen, zijn met redenen
      omklede beschikking, welke onverwijld aan degene die het verzet heeft gedaan en aan de officier van justitie in
      het arrondissement Leeuwarden wordt medegedeeld. De [artikelen 13][ref1] en [13][ref2] zijn van overeenkomstige
      toepassing, met uitzondering van de [laatste volzin van artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: 13a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
  - number: '26.7'
    text: |-
      Indien de kantonrechter het verzet gegrond oordeelt, houdt de beschikking tevens in dat aan de indiener van het
      verzetschrift het door hem betaalde griffierecht wordt vergoed door de griffier. In de overige gevallen kan de
      kantonrechter bepalen dat het betaalde griffierecht wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: '26.8'
    text: |-
      Ten aanzien van derden die bij een inbeslagneming van goederen daarop geheel of gedeeltelijk recht menen te hebben,
      zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '26.9'
    text: |-
      De kosten van het verhaal krachtens dit artikel worden op gelijke voet als de administratieve sanctie op degene aan
      wie deze sanctie is opgelegd verhaald. Onder de kosten van het verhaal zijn begrepen de invorderingskosten.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26
  - number: 26a.1
    text: |-
      De officier van justitie in het arrondissement Leeuwarden, alsmede degene aan wie de administratieve sanctie is
      opgelegd, kunnen tegen de beschikking van de kantonrechter binnen twee weken na de verzending van de mededeling
      van de beschikking van de kantonrechter hoger beroep instellen bij het gerechtshof te Leeuwarden. Het beroepschrift
      wordt ingediend bij de griffie van de rechtbank die de beschikking heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
  - number: 26a.2
    text: |-
      Degene aan wie de administratieve sanctie is opgelegd, is in zijn beroep slechts ontvankelijk
      na voorafgaande zekerheidstelling van het nog verschuldigde bedrag en van al de kosten. De
      zekerheid wordt gesteld bij het Centraal Justitieel Incassobureau te Leeuwarden, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1], door storting op de rekening van
      het Centraal Justitieel Incassobureau. De griffier van de rechtbank wijst de indiener van het beroepschrift op de
      verplichting tot zekerheidstelling en deelt hem mee dat de zekerheidstelling dient te geschieden binnen twee weken
      na de dag van verzending van zijn mededeling. Indien de zekerheidstelling niet binnen deze termijn is geschied,
      wordt het beroep niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de indiener in
      verzuim is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: 26a.3
    text: |-
      Degene aan wie de administratieve sanctie is opgelegd, is eveneens een griffierecht verschuldigd. De griffier
      van de rechtbank wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt
      hem mee dat het verschuldigde bedrag binnen twee weken na de dag van verzending van zijn mededeling dient te
      zijn bijgeschreven op de rekening van de rechtbank dan wel ter griffie te zijn gestort. Indien het griffierecht
      niet binnen deze termijn is bijgeschreven of gestort, wordt het beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
  - number: 26a.4
    text: |-
      Nadat de zekerheidstelling en de bijschrijving of de storting van het griffierecht hebben plaatsgevonden of nadat
      de termijnen voor het stellen van de zekerheid en de betaling van het griffierecht ongebruikt zijn verstreken,
      zendt de griffier van de rechtbank het beroepschrift met de daarop betrekking hebbende stukken en een afschrift van
      de beschikking van de kantonrechter onverwijld ter griffie van het gerechtshof in.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
  - number: 26a.5
    text: |-
      Op de behandeling van het hoger beroep zijn de [artikelen 16 tot en met 20c][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel13
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '13'
        hoofdstuk: V
  - number: 26a.6
    text: |-
      Het gerechtshof beslist zo spoedig mogelijk. De [artikelen 13a][ref1] en [13b][ref2], met uitzondering van de
      [laatste volzin van artikel 13b, eerste lid][ref3], en [20d, eerste en derde lid][ref4], zijn op de beschikking van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
      [ref4]: https://wetten.overheid.nl/BWBR0004581#Artikel20d
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: 13a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0004581
        artikel: 20d
        hoofdstuk: VI
  - number: 26a.7
    text: |-
      Afschrift van de beschikking wordt door de griffier van het gerechtshof gezonden aan degenen die tot het instellen
      van hoger beroep gerechtigd waren.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel26a
  - number: '27.1'
    text: 'Verhaal kan zonder dwangbevel worden genomen op:'
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: 27.1.a
    text: inkomsten in geld uit arbeid van degene aan wie een administratieve sanctie is opgelegd;
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: 27.1.b
    text: |-
      pensioenen, wachtgelden en andere periodieke uitkeringen waarop degene aan wie de administratieve sanctie is
      opgelegd, aanspraak heeft;
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: 27.1.c
    text: |-
      het tegoed van een rekening bij een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1],
      waarover degene aan wie de administratieve sanctie is opgelegd te eigen bate vermag te beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '27.2'
    text: |-
      Verhaal met toepassing van het eerste lid geschiedt door middel van een schriftelijke kennisgeving van het
      openbaar ministerie dat met de inning van de administratieve sanctie is belast. De kennisgeving bevat een voor
      de uitoefening van het verhaal voldoende aanduiding van degene aan wie de administratieve sanctie is opgelegd, en
      vermeldt welk bedrag uit hoofde van de beschikking nog verschuldigd is, dan wel bij welke rechterlijke uitspraak
      de administratieve sanctie is opgelegd, alsmede de plaats waar de betaling moet geschieden. Zij wordt verstrekt aan
      degene onder wie het verhaal wordt genomen, en betekend aan degene aan wie de administratieve sanctie is opgelegd.
      In het laatste geval zijn de [artikelen 529 tot en met 532][ref1] en de [artikelen 585 tot en met 588][ref2],
      [589][ref3] en [590 van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel529
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel585
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel589
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel590
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '529'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '585'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '589'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '590'
  - number: '27.3'
    text: |-
      Door de verstrekking van de kennisgeving is degene onder wie het verhaal wordt genomen, verplicht tot onverwijlde
      betaling aan de officier van justitie van het in de kennisgeving bedoelde bedrag voor zover degene aan wie de
      administratieve sanctie is opgelegd op hem een opeisbare vordering heeft of verkrijgt. De officier van justitie
      bepaalt de termijn waarbinnen de betaling moet geschieden. De verplichting tot betaling vervalt zodra het uit
      hoofde van de beschikking verschuldigde bedrag is betaald of verhaald en uiterlijk wanneer acht weken na de dag van
      verstrekking van de kennisgeving zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: '27.4'
    text: |-
      Degene onder wie het verhaal wordt genomen, kan zich niet tegenover de officier van justitie beroepen
      op het tenietgaan of de vermindering van zijn schuld aan degene aan wie de administratieve sanctie
      is opgelegd door betaling of door verrekening met een tegenvordering dan in de gevallen waarin hij
      daartoe ook bevoegd zou zijn geweest bij een op het tijdstip van de betekening overeenkomstig het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] gelegd beslag onder derden. Indien een andere schuldeiser op
      de vordering waarop het verhaal wordt genomen, beslag heeft gelegd, is [artikel 478 van het Wetboek][ref2]
      van overeenkomstige toepassing. Het verhaal wordt voor de toepassing van de [artikelen 33][ref3] en
      [301 van de Faillissementswet][ref4] met een beslag onder derden gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel478
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel301
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '478'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '33'
      - id: ref4
        bwb_id: BWBR0001860
        artikel: '301'
  - number: '27.5'
    text: |-
      Indien verhaal is genomen op een periodieke uitkering die ingevolge enig wettelijk voorschrift niet vatbaar is
      voor beslag, kan telkens ten hoogste een tiende gedeelte van de uitkering tot betaling van het uit hoofde van de
      beschikking verschuldigde bedrag worden bestemd. Overigens strekt het verhaal zich niet uit tot gelden waarvan de
      wet bepaald heeft, dat zij niet voor inbeslagneming vatbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: '27.6'
    text: |-
      Iedere belanghebbende kan binnen een week na de betekening van de in het tweede lid bedoelde kennisgeving bij met
      redenen omkleed verzetschrift verzet doen tegen het verhaal. [Artikel 26, derde tot en met negende lid][ref1], en
      [artikel 26a][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel26a
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '26'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: 26a
        hoofdstuk: VIII
  - number: '27.7'
    text: |-
      Een ieder, behoudens degene aan wie de administratieve sanctie is opgelegd, is verplicht desgevorderd
      onverwijld aan de officier van justitie, die met de inning van de administratieve sanctie is belast,
      de inlichtingen te verstrekken welke naar het redelijk oordeel van het openbaar ministerie noodzakelijk
      zijn ten behoeve van de toepassing van het eerste lid van dit artikel. De [artikelen 217][ref1] en
      [218 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel218
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '218'
  - number: '27.8'
    text: |-
      De kosten van het verhaal krachtens dit artikel worden op gelijke voet als de administratieve sanctie op degene aan
      wie deze sanctie is opgelegd verhaald. Onder de kosten van het verhaal zijn begrepen de invorderingskosten.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel27
  - number: '28.1'
    text: |-
      De officier van justitie te Leeuwarden kan, indien niet of niet volledig verhaal overeenkomstig de
      [artikelen 26][ref1] en [27][ref2] heeft plaatsgevonden, bij de kantonrechter van de rechtbank van het
      arrondissement waar het adres is van degene aan wie de administratieve sanctie is opgelegd een vordering instellen
      om te worden gemachtigd om per gedraging waarvoor een administratieve sanctie is opgelegd het dwangmiddel gijzeling
      toe te passen van degene aan wie de administratieve sanctie is opgelegd, voor ten hoogste één week. Indien degene
      aan wie de administratieve sanctie is opgelegd ingeschreven staat op een in de basisadministratie persoonsgegevens
      opgenomen adres, maar niet op dat adres woonachtig is, dan wel indien degene aan wie de administratieve sanctie
      is opgelegd geen bekende woon- of verblijfplaats in Nederland heeft, geschiedt de instelling van de bovenbedoelde
      vordering door de officier van justitie in het arrondissement Leeuwarden bij de rechtbank te Leeuwarden. Een
      verleende machtiging om gijzeling toe te passen kan tot uiterlijk vijf jaar nadat de opgelegde administratieve
      sanctie onherroepelijk is geworden, worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel27
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '26'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '27'
        hoofdstuk: VIII
  - number: '28.2'
    text: |-
      Op de vordering wordt niet beslist dan nadat degene aan wie de sanctie is opgelegd door de kantonrechter is
      gehoord, althans behoorlijk is opgeroepen. Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28
  - number: '28.3'
    text: |-
      De officier van justitie te Leeuwarden of de ambtenaar die door hem is belast met de toepassing van de gijzeling
      heeft voor het in gijzeling stellen van de betrokkene toegang tot elke plaats.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28
  - number: '28.4'
    text: |-
      De toepassing van het dwangmiddel wordt gestaakt, zodra het verschuldigde bedrag aan de instantie, belast met deze
      toepassing, is betaald. De toepassing van het dwangmiddel heft de verschuldigdheid niet op.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28
  - number: '28.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de tenuitvoerlegging van de gijzeling als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28
  - number: 28a
    text: |-
      Indien niet of niet volledig verhaal overeenkomstig de [artikelen 26][ref1] en [27][ref2] heeft plaatsgevonden,
      kan de officier van justitie te Leeuwarden het rijbewijs innemen van degene aan wie de administratieve sanctie
      is opgelegd. De officier kan tot uiterlijk vijf jaar nadat de opgelegde administratieve sanctie onherroepelijk is
      geworden van zijn bevoegdheid gebruik maken. De inneming van het rijbewijs duurt ten hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel27
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '26'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '27'
        hoofdstuk: VIII
  - number: 28b
    text: |-
      Indien niet of niet volledig verhaal overeenkomstig de [artikelen 26][ref1] en [27][ref2] heeft plaatsgevonden,
      kan de officier van justitie te Leeuwarden het voertuig waarmee de gedraging heeft plaatsgevonden buiten
      gebruik stellen of, indien dit voertuig niet wordt aangetroffen, een soortgelijk voertuig waarover degene
      aan wie de administratieve sanctie is opgelegd, vermag te beschikken. De officier kan tot uiterlijk vijf jaar
      nadat de opgelegde administratieve sanctie onherroepelijk is geworden van zijn bevoegdheid gebruik maken. De
      buitengebruikstelling duurt ten hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel27
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '26'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '27'
        hoofdstuk: VIII
  - number: '29.1'
    text: |-
      Indien degene wiens voertuig buiten gebruik kan worden gesteld door de officier van justitie te Leeuwarden niet
      terstond voldoet aan het overeenkomstig [artikel 23, tweede lid][ref1], en [artikel 25][ref2] verhoogde bedrag van
      de administratieve sanctie, is de officier van justitie bevoegd het voertuig op kosten van de betrokkene naar een
      door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen. Het voertuig wordt tussentijds aan
      de rechthebbende teruggegeven tegen betaling van het bedrag van de administratieve sanctie en de daarop gevallen
      verhogingen, alsmede van de kosten van overbrenging en bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel25
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '23'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '25'
        hoofdstuk: VIII
  - number: '29.2'
    text: |-
      De officier van justitie is tevens bevoegd om in het in het eerste lid bedoelde geval aan het voertuig een
      mechanisch hulpmiddel te doen aanbrengen, waardoor wordt verhinderd dat het voertuig wordt weggereden. Het
      mechanisch hulpmiddel wordt tussentijds niet verwijderd dan nadat het bedrag van de administratieve sanctie en de
      daarop gevallen verhogingen, alsmede de kosten van het aanbrengen en van het verwijderen ervan zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel29
  - number: '29.3'
    text: |-
      Indien twaalf weken na de aanvang van de buitengebruikstelling de rechthebbende zijn voertuig niet heeft afgehaald,
      wordt hij geacht zijn recht op de zaak te hebben opgegeven en is de officier van justitie bevoegd het voertuig om
      niet aan een derde in eigendom te doen overdragen, te doen verkopen of te doen vernietigen. Gelijke bevoegdheid
      bestaat ook binnen de bedoelde termijn, zodra het gezamenlijke bedrag van de opgelegde administratieve sanctie, de
      daarop gevallen verhoging, de kosten van het aanbrengen en het verwijderen, alsmede de kosten van overbrenging en
      bewaring, vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde kosten, in
      verhouding tot de waarde van het voertuig naar zijn oordeel onevenredig hoog zou worden.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel29
  - number: '29.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de overbrenging,
      bewaring, eigendomsoverdracht om niet, verkoop, vernietiging, de berekening van de kosten van overbrenging en
      bewaring, alsmede omtrent hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel29
  - number: '30.1'
    text: |-
      Degene wiens rijbewijs kan worden ingenomen door de officier van justitie te Leeuwarden, is verplicht op eerste
      vordering van de officier van justitie het rijbewijs in te leveren op een door de officier van justitie te bepalen
      tijdstip en aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      De termijn, bedoeld in [artikel 28a][ref1], vangt aan op het tijdstip waarop de inlevering van het rijbewijs heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel28a
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: 28a
        hoofdstuk: VIII
  - number: '30.3'
    text: |-
      Indien aan de verplichting tot inlevering van het rijbewijs niet wordt voldaan, is de officier van
      justitie bevoegd dat rijbewijs op kosten van de in het eerste lid bedoelde persoon te doen inleveren.
      [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
  - number: '30.4'
    text: |-
      De officier van justitie doet van het tijdstip, bedoeld in het eerste en in het tweede lid, onverwijld mededeling
      aan de beheerder van het rijbewijzenregister in de zin van de [Wegenverkeerswet 1994][ref1]. De officier van
      justitie doet op gelijke wijze mededeling van het tijdstip waarop het rijbewijs is teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '31.1'
    text: |-
      Indien de in [artikel 3, eerste lid][ref1], bedoelde ambtenaren bij de uitoefening van de in
      [artikel 3, eerste lid][ref2], omschreven bevoegdheid bevinden dat de bestuurder geen bekende woon- of
      verblijfplaats in Nederland heeft, dan wel geregistreerd staat voor het niet voldoen van een hem eerder
      overeenkomstig de bepalingen van deze wet opgelegde administratieve sanctie, kunnen zij vorderen dat het bedrag
      van de opgelegde en van de reeds verschuldigde administratieve sanctie terstond zal worden voldaan dan wel dat
      zekerheid wordt gesteld dat het bedrag van de bedoelde sanctie tijdig zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel3
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '3'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '3'
        hoofdstuk: III
  - number: '31.2'
    text: |-
      Indien de in [artikel 3, eerste lid][ref1], bedoelde ambtenaren hebben vastgesteld dat de gedraging heeft
      plaatsgevonden met of door middel van een motorrijtuig waarvoor een kenteken is opgegeven, en niet aanstonds is
      vastgesteld wie daarvan de bestuurder is en waarvan aannemelijk is dat de kentekenhouder geen bekende woon- of
      verblijfplaats in Nederland heeft, dan wel dat de kentekenhouder geregistreerd staat voor het niet voldoen van een
      hem eerder overeenkomstig de bepalingen van deze wet opgelegde sanctie, zijn zij bevoegd bij wijze van voorlopige
      maatregel het voertuig naar een door hen aangewezen plaats te doen overbrengen en in bewaring te stellen, dan
      wel aan het voertuig een mechanisch hulpmiddel te doen aanbrengen, waardoor wordt verhinderd dat het voertuig
      wordt weggereden. Zij kunnen vorderen dat, alvorens het voertuig aan de bestuurder wordt teruggegeven, naast de
      kosten van overbrenging en bewaring, eveneens het bedrag van de opgelegde administratieve sanctie en van de eerder
      overeenkomstig de bepalingen van deze wet opgelegde en inmiddels verschuldigde administratieve sanctie zal worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel3
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '3'
        hoofdstuk: III
  - number: '31.3'
    text: |-
      Voldoening van het bedrag van de opgelegde administratieve sanctie laat de bevoegdheid tegen de beschikking
      van de ambtenaar beroep in te stellen als omschreven in de [artikelen 6][ref1] en [9][ref2] onverlet.
      Wordt het beroep gegrond verklaard, dan wordt het bedrag van de administratieve sanctie teruggegeven.
      [Artikel 29, derde en vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel29
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '9'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '29'
        hoofdstuk: VIII
  - number: '32'
    text: |-
      Indien aan de in [artikel 31, eerste lid][ref1], bedoelde vordering niet wordt voldaan, is de ambtenaar bevoegd bij
      wijze van voorlopige maatregel het voertuig in bewaring te stellen, totdat het bedrag van de opgelegde en van de
      reeds verschuldigde administratieve sanctie, alsmede de inmiddels daarop gevallen kosten van de inbewaringstelling
      zijn voldaan. Daartoe kan hij op kosten van de bestuurder het voertuig naar een door hem aangewezen nabijgelegen
      plaats overbrengen of doen overbrengen en aldaar in bewaring doen stellen. Zo nodig roept hij hierbij de hulp van
      de sterke arm in. [Artikel 29, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel29
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '31'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '29'
        hoofdstuk: VIII
  - number: '33.1'
    text: |-
      Van iedere inbewaringstelling maakt de betrokken ambtenaar proces-verbaal op. Hij zendt dit proces-verbaal binnen
      vierentwintig uur aan de officier van justitie in het arrondissement waar de inbewaringstelling is geschied.
      Een afschrift van het proces-verbaal wordt gelijktijdig uitgereikt of toegezonden aan de bestuurder, alsmede
      aan degene aan wie het kenteken van het motorrijtuig is opgegeven. Daarbij wordt hij gewezen op het bepaalde in
      [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel29
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '29'
        hoofdstuk: VIII
  - number: '33.2'
    text: Tegen een inbewaringstelling kan elke belanghebbende beroep instellen bij de rechtbank op grond dat
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
  - number: 33.2.a
    text: de inbewaringstelling met een algemeen verbindend voorschrift strijdt;
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
  - number: 33.2.b
    text: |-
      de ambtenaar van zijn in [artikel 32][ref1] omschreven bevoegdheid op een kennelijk onredelijke wijze heeft gebruik
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel32
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '32'
        hoofdstuk: IX
  - number: '33.3'
    text: |-
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '33.4'
    text: |-
      Het beroepschrift wordt ingediend bij de officier van justitie in het arrondissement waar de inbewaringstelling is
      geschied. De officier van justitie brengt het beroepschrift en de op de zaak betrekking hebbende stukken ter kennis
      van de rechtbank van het arrondissement waar de inbewaringstelling is geschied.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
  - number: '33.5'
    text: |-
      Het beroepschrift en de op de zaak betrekking hebbende stukken worden door de officier van justitie aan de
      rechtbank ter kennis gebracht binnen vier dagen nadat de indiener zekerheid heeft gesteld voor de betaling van de
      sanctie, dan wel nadat de termijn daarvoor is verstreken.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
  - number: '33.6'
    text: |-
      De kantonrechter beslist zo spoedig mogelijk, doch uiterlijk binnen vier weken na de dag waarop het beroepschrift
      bij de officier van justitie is ingediend. Ten aanzien van de behandeling van het beroepschrift en de uitspraak
      zijn de [artikelen 11, tweede, derde en vierde lid][ref1], [12][ref2], [13][ref3], [13a][ref4] en [13b][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004581#Artikel13a
      [ref5]: https://wetten.overheid.nl/BWBR0004581#Artikel13b
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '11'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '12'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '13'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0004581
        artikel: 13a
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0004581
        artikel: 13b
        hoofdstuk: V
  - number: '33.7'
    text: Indien de kantonrechter het beroepschrift gegrond acht, gelast hij de onmiddellijke teruggave van het voertuig.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
  - number: '33.8'
    text: |-
      Het instellen van beroep schorst de bevoegdheid van de officier van justitie, bedoeld in
      [artikel 29, derde lid][ref1], tot de dag na die waarop de kantonrechter zijn beslissing heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel29
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '29'
        hoofdstuk: VIII
  - number: '34.1'
    text: 'Met geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel34
  - number: 34.1.a
    text: |-
      hij die niet voldoet aan vordering van een krachtens [artikel 3, eerste lid][ref1], aangewezen toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel3
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '3'
        hoofdstuk: III
  - number: 34.1.b
    text: hij die de gegevens waarop de in het eerste lid bedoelde vordering betrekking heeft, onjuist opgeeft;
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel34
  - number: 34.1.c
    text: |-
      hij die niet voldoet aan de in [artikel 30][ref1] omschreven verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel30
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '30'
        hoofdstuk: VIII
  - number: '34.2'
    text: Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel34
  - number: '35'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent hetgeen verder ter uitvoering van
      deze wet nodig is.
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel35
  - number: '36.1'
    text: |-
      Behoudens in geval van een verzetschrift als bedoeld in [artikel 26, derde lid][ref1], een beroepschrift bedoeld
      in [artikel 26a][ref2] en een verzetschrift als bedoeld in [artikel 27, zesde lid][ref3], is op grond van deze wet
      geen recht verschuldigd in de zin van de [Wet tarieven in burgerlijke zaken][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0004581/2007-01-01#Artikel36
