$id: regeling_vervoerbare_drukapparatuur_2011
regulatory_layer: WET
publication_date: '2023-04-14'
valid_from: '2023-04-19'
bwb_id: BWBR0030099
url: https://wetten.overheid.nl/BWBR0030099/2023-04-19
preamble:
  text: |-
    Gelet op richtlijn nr. 2010/35/EU van het Europees Parlement en de Raad van 16 juni 2010 betreffende vervoerbare
    drukapparatuur en houdende intrekking van richtlijnen 76/767/EEG, 84/525/EEG, 84/526/EEG, 84/527/EEG en 1999/36/
    EG van de Raad (PbEU 2010, L 165), artikel 10a van de Wet vervoer gevaarlijke stoffen en artikel 2 van het Besluit
    vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanbieder van diensten van de informatiemaatschappij:* aanbieder van een
      dienst zoals gedefinieerd in artikel 1, eerste lid, onderdeel b, van [Richtlijn (EU) 2015/1535](32015L1535) van het
      Europees Parlement en de Raad van 9 september 2015 betreffende een informatieprocedure op het gebied van technische
      voorschriften en regels betreffende de diensten van de informatiemaatschappij (PbEU 2015, L 241);
        - *aangemelde instantie:* aangemelde instantie als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *aanmeldende autoriteit:* aanmeldende autoriteit als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *aanmelding:* aanmelding als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *bijlagen bij richtlijn 2008/68/EG:* bijlagen als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *conformiteitsbeoordeling:* conformiteitsbeoordeling als bedoeld in artikel 2 van [richtlijn 2010/35]
      (32010L0035)/EU;
        - *de Minister:* Minister van Infrastructuur en Milieu;
        - *distributeur:* distributeur als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *eigenaar:* eigenaar als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *erkenning:* erkenning als bedoeld in [artikel 10a van de Wet vervoer gevaarlijke stoffen][ref1];
        - *fabrikant:* fabrikant als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *gebruik:* gebruik als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *gemachtigde:* gemachtigde als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *hernieuwde conformiteitsbeoordeling:* hernieuwde conformiteitsbeoordeling als bedoeld in artikel 2 van
      [richtlijn 2010/35](32010L0035)/EU;
        - *importeur:* importeur als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *in de handel brengen:* in de handel brengen als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 3, onderdeel 13, van de EU-verordening markttoezicht;
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *markttoezicht:* markttoezicht als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *op de markt aanbieden:* op de markt aanbieden als bedoeld in artikel 3, onderdeel 1, van de EU-verordening
      markttoezicht;
        - *op de markt aanbieden:* op de markt aanbieden als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *operator:* operator als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *pi-markering:* pi-markering als bedoeld in artikel 2 van [richtlijn 2010/35](32010L0035)/EU;
        - *richtlijn 2010/35/EU:* [richtlijn nr. 2010/35](32010L0035)/EU van het Europees Parlement en de Raad van 16
      juni 2010 betreffende vervoerbare drukapparatuur en houdende intrekking van [richtlijnen 76/767/EEG](31976L0767),
      [84/525/EEG](31984L0525), [84/526/EEG](31984L0526), [84/527/EEG](31984L0527) en [1999/36/EG](31999L0036) van de
      Raad (PbEU 2010, L 165);
        - *richtlijn nr. 2008/68/EG:* [richtlijn nr. 2008/68/EG](32008L0068) van het Europees Parlement en de Raad van
      24 september 2008 betreffende het vervoer van gevaarlijke goederen over land (PbEU 2008, L 260);
        - *vervoerbare drukapparatuur:* vervoerbare drukapparatuur als bedoeld in artikel 2 van [richtlijn 2010/35]
      (32010L0035)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel10a
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: 10a
  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op vervoerbare drukapparatuur als bedoeld in artikel 1, derde en vierde lid,
      van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden vervoerbare drukapparatuur in de handel te brengen, op de markt aan te bieden, ter beschikking te
      stellen of te gebruiken indien deze niet voldoet aan de in deze regeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel3
  - number: '3.2'
    text: |-
      Het is verboden om de pi-markering aan te brengen in strijd met artikel 14, eerste en tweede lid, van [richtlijn
      2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel3
  - number: '3.3'
    text: |-
      Het is verboden om merktekens, tekens of opschriften op vervoerbare drukapparatuur aan te brengen in strijd met
      artikel 14, vijfde lid, van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel3
  - number: '4'
    text: De fabrikant voldoet aan de artikelen 4, 11 en 14 van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel4
  - number: '5.1'
    text: |-
      De fabrikant die een gemachtigde aanstelt, voldoet aan en zorgt dat wordt voldaan aan artikel 5 van [richtlijn
      2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel5
  - number: '5.2'
    text: |-
      De gemachtigde, bedoeld in het eerste lid, voldoet aan de artikelen 5, tweede en vierde lid, en 11 van [richtlijn
      2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel5
  - number: '6'
    text: |-
      De importeur voldoet aan de artikelen 6 en 11 van [richtlijn 2010/35](32010L0035)/EU en in de gevallen, bedoeld in
      artikel 10 van [richtlijn 2010/35](32010L0035)/EU, aan artikel 4 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel6
  - number: '7'
    text: |-
      De distributeur voldoet aan de artikelen 7 en 11 van [richtlijn 2010/35](32010L0035)/EU en in de gevallen, bedoeld
      in artikel 10 van [richtlijn 2010/35](32010L0035)/EU, aan artikel 4 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel7
  - number: '8.1'
    text: De eigenaar voldoet aan de artikelen 8, eerste tot en met derde lid, en 11 van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing op particulieren die vervoerbare drukapparatuur voor persoonlijke of
      huishoudelijke doeleinden of voor hun vrijetijds- of sportactiviteiten willen gebruiken of reeds gebruiken.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel8
  - number: '9'
    text: De operator voldoet aan de artikelen 9 en 11 van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel9
  - number: '10.1'
    text: |-
      Vervoerbare drukapparatuur als bedoeld in artikel 1, tweede lid, onderdeel a en als bedoeld in artikel 1, tweede
      lid, onderdeel b, van [richtlijn 2010/35](32010L0035)/EU, voldoet aan artikel 12, eerste lid, respectievelijk
      tweede lid, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel10
  - number: '10.2'
    text: |-
      Met de certificaten en verslagen als bedoeld in artikel 12, derde lid, van [richtlijn 2010/35](32010L0035)/EU die
      door een hier te lande gevestigde aangemelde instantie zijn afgegeven, worden gelijkgesteld de certificaten en
      verslagen die zijn afgegeven door een in een andere lidstaat van de Europese Unie gevestigde aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel10
  - number: '10.3'
    text: |-
      Voor afneembare onderdelen van navulbare vervoerbare drukapparatuur kan een afzonderlijke conformiteitsbeoordeling
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel10
  - number: '11'
    text: |-
      De hernieuwde conformiteitsbeoordeling van vervoerbare drukapparatuur als bedoeld in artikel 13 van [richtlijn
      2010/35](32010L0035)/EU wordt uitgevoerd, respectievelijk de pi-markering wordt aangebracht, overeenkomstig bijlage
      III van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel11
  - number: '12.1'
    text: |-
      De Minister verleent voor het verrichten van activiteiten als bedoeld in artikel 21, tweede lid, onderdeel a, van
      [richtlijn 2010/35](32010L0035)/EU uitsluitend een erkenning aan een instantie die voldoet aan [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030099#Artikel13
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030099
        artikel: '13'
        paragraaf: '4'
  - number: '12.2'
    text: |-
      De instantie die met toepassing van het eerste lid wenst te worden erkend en aangemeld, dient bij de Minister een
      aanvraag in die voldoet aan artikel 21, tweede lid, van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel12
  - number: '12.3'
    text: |-
      De Minister meldt de op grond van het eerste lid erkende instantie aan bij de Europese Commissie en de andere
      lidstaten overeenkomstig artikel 22, eerste tot en met derde lid en zesde lid van [richtlijn 2010/35](32010L0035)/
      EU en verricht de taken als bedoeld in artikel 22, vijfde lid, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel12
  - number: '12.4'
    text: |-
      Bij de uitoefening van zijn taken als aanmeldende autoriteit voldoet de Minister aan de artikelen 24 en 26, derde
      lid, tweede volzin, van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel12
  - number: '13'
    text: |-
      De aangemelde instantie voldoet of zorgt dat wordt voldaan aan de artikelen 20, 22, vierde lid, 26, eerste en
      tweede lid, en 27 van [richtlijn 2010/35](32010L0035)/EU.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel13
  - number: '14'
    text: |-
      Indien er sprake is van markttoezicht handelen de in [artikel 34 van de Wet vervoer gevaarlijke stoffen][ref1]
      bedoelde ambtenaren en de marktdeelnemers overeenkomstig de artikelen 30, 31, tweede lid, 32 en 33 van [richtlijn
      2010/35](32010L0035)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel34
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '34'
  - number: 14a.1
    text: |-
      Het is marktdeelnemers die betrokken zijn of zijn geweest bij het op de markt aanbieden van vervoerbare
      drukapparatuur, verboden te handelen in strijd met artikel 7, eerste lid, van de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel14a
  - number: 14a.2
    text: |-
      Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het online te
      koop aanbieden van vervoerbare drukapparatuur, verboden te handelen in strijd met artikel 7, tweede lid, van de EU-
      verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel14a
  - number: '15'
    text: |-
      Voor de toepassing van deze regeling geldt een verwijzing in [richtlijn 2010/35](32010L0035)/
      EU naar de bijlagen bij [richtlijn 2008/68/EG](32008L0068) als een verwijzing naar de
      [bijlagen 1][ref1] en [2 bij de Regeling vervoer over land van gevaarlijke stoffen][ref2] en de
      [Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref3] en de [bijlagen 1a][ref4] en
      [2 van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0010054
      [ref3]: https://wetten.overheid.nl/BWBR0010053
      [ref4]: https://wetten.overheid.nl/BWBR0010115
      [ref5]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010054
      - id: ref2
        bwb_id: BWBR0010054
      - id: ref3
        bwb_id: BWBR0010053
      - id: ref4
        bwb_id: BWBR0010115
      - id: ref5
        bwb_id: BWBR0010115
  - number: '16.1'
    text: |-
      Certificaten van de EEG-modelgoedkeuringen en EG-ontwerponderzoek als bedoeld in artikel 40, eerste lid, van
      [richtlijn 2010/35](32010L0035)/EU, worden gelijkgesteld met de goedkeuringscertificaten waarnaar in de bijlagen
      bij [richtlijn 2008/68/EG](32008L0068) wordt verwezen en zijn onderworpen aan de bepalingen in die bijlagen inzake
      de in de tijd beperkte erkenning van goedkeuringen.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel16
  - number: '16.2'
    text: |-
      Kranen en toebehoren als bedoeld in artikel 40, tweede lid, van [richtlijn 2010/35](32010L0035)/EU mogen nog worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel16
  - number: '17.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 12, tweede lid][ref1], kan tot en met 31 december 2011 worden ingediend zonder
      overlegging van een bewijs van accreditatie als bedoeld in artikel 21, tweede lid, onderdeel d, van [richtlijn
      2010/35](32010L0035)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0030099#Artikel12
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030099
        artikel: '12'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, kan de erkenning als bedoeld in [artikel 12, eerste lid][ref1], slechts
      worden verleend uiterlijk tot en met 31 december 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0030099#Artikel12
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030099
        artikel: '12'
        paragraaf: '4'
  - number: '17.3'
    text: |-
      Deze regeling is tot en met 30 juni 2013 niet van toepassing op drukrecipiënten, hun kranen en ander toebehoren die
      worden gebruikt voor het vervoer van de in artikel 42, vierde lid, van [richtlijn 2010/35](32010L0035)/EU genoemde
      VN nummers.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel17
  - number: '18'
    text: |-
      Een wijziging van [richtlijn 2010/35](32010L0035)/EU gaat voor de toepassing van deze regeling gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel18
  - number: '19'
    text: |-
      De [Regeling vervoerbare drukapparatuur][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011832
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011832
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van 30 juni 2011. Indien de Staatscourant waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 29 juni 2011, treedt zij in werking met ingang van de eerste dag na de dagtekening
      van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling vervoerbare drukapparatuur 2011.'
    url: https://wetten.overheid.nl/BWBR0030099/2023-04-19#Artikel21
