  - number: '2'
    text: |-
      1 De voorzitter kan een laboratorium op aanvraag erkennen voor de detectie van Salmonella in de matrices mest,
      vlees of dons afkomstig van pluimvee indien het laboratorium naar zijn oordeel voldoet aan de in [bijlage I][ref1]
      opgenomen erkenningsvoorwaarden.

      2 De voorzitter kan een laboratorium op aanvraag erkennen voor de serotypering van Salmonella-isolaten indien het
      laboratorium naar zijn oordeel voldoet aan de in [bijlage II][ref2] opgenomen erkenningsvoorwaarden.

      3

      4 Het laboratorium dient de aanvraag tot erkenning schriftelijk in bij de voorzitter. De aanvraag bevat ten minste
      de naam en de contactgegevens van de indiener en de gewenste erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0031106
      [ref2]: https://wetten.overheid.nl/BWBR0031106
    url: https://wetten.overheid.nl/BWBR0031106/2014-03-09#Artikel2
    references:
