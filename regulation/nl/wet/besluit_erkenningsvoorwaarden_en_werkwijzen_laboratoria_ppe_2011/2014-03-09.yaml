    text: |-
      1 Het laboratorium voert de detectie van Salmonella uit overeenkomstig de daartoe vastgestelde methoden, opgenomen
      in [bijlage IV][ref1].

      2 Het laboratorium voert de serotypering van Salmonella uit overeenkomstig de daartoe vastgestelde methoden,
