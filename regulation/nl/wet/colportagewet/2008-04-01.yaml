$id: colportagewet
regulatory_layer: WET
publication_date: '2014-04-03'
valid_from: '2008-04-01'
bwb_id: BWBR0002896
url: https://wetten.overheid.nl/BWBR0002896/2008-04-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen tot het tegengaan van misbruiken
    bij colportage en mede in verband met die regelen een aantal wijzigingen aan te brengen in de Wet op het
    afbetalingsstelsel 1961 (Stb. 218);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: 1.1.a
    text: |-
      geldkrediet: geldkrediet als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.1.b
    text: |-
      goederenkrediet: goederenkrediet als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.1.c
    text: 'goed: een roerende zaak of een vermogensrecht dat geen registergoed is;'
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: 1.1.d
    text: |-
      colporteur: degene die in de uitoefening van een beroep of bedrijf door persoonlijk bezoek dan wel door of in
      samenhang met de aanprijzing van een goed of een dienst in een groep van ter plaatse van de aanprijzing aanwezige
      personen, tracht een particulier te bewegen tot het sluiten van een overeenkomst, strekkende tot het aan deze
      verschaffen van het genot van een goed, het aan deze verlenen van een dienst of het door deze als kredietnemer
      deelnemen aan een goederenkrediet;
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: 1.1.e
    text: |-
      kredietgever: een aanbieder van krediet als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.1.f
    text: |-
      kredietnemer: degene die een overeenkomst inzake krediet aangaat als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.1.g
    text: |-
      leverancier: degene die een geldsom ter beschikking krijgt gesteld van de kredietgever terzake van het aan een
      kredietnemer verschaffen van het genot van een roerende zaak;
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: 1.1.h
    text: 'Onze Minister: Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder een onderneming mede verstaan een
      bedrijf, waarmede niet wordt beoogd het maken van winst.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het eerste lid, onder c, wordt als persoonlijk bezoek niet aangemerkt het persoonlijk
      bezoek, dat in overwegende mate voortvloeit uit een initiatief van degene, die wordt bezocht, tenzij de bezoeker
      degene, die hij bezoekt, tracht te bewegen tot het sluiten van een overeenkomst betreffende een ander goed of
      een andere dienst dan het goed of de dienst, in verband waarmee om het bezoek is verzocht en degene, die wordt
      bezocht, toen hij het initiatief tot dat bezoek nam niet wist en redelijkerwijs niet kon weten, dat het sluiten
      van overeenkomsten betreffende dat andere goed of die andere dienst tot de bedrijfs- of beroepsuitoefening van de
      bezoeker behoorde.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van het eerste lid, onder c wordt als een groep van personen niet aangemerkt een groep, welke
      kennelijk niet met of mede met het oog op de aanprijzing van een goed of een dienst in die groep is bijeengebracht.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden niet als goed aangemerkt financiële
      instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], ongeacht of deze zijn
      toegelaten tot de handel op een gereglementeerde markt of een multilaterale handelsfaciliteit, als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2] of een met een gereglementeerde markt of multilaterale
      handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat is, voorzover de waarde daarvan door middel
      van een openbare prijsaanduiding voor een ieder kenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '6'
    text: |-
      Het is verboden in de uitoefening van een beroep of bedrijf door persoonlijk bezoek dan wel door of in samenhang
      met de aanprijzing van een geldkrediet of van een goed of een dienst in een groep van ter plaatse van de
      aanprijzing aanwezige personen te trachten een ander te bewegen tot het als kredietnemer deelnemen aan een
      geldkrediet, dan wel een ander die handelingen te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel6
  - number: '7.1'
    text: |-
      Een colporteur is verplicht bij de aanvang van handelingen als bedoeld in [artikel 1, eerste lid, onder d][ref1],
      aan degene die hij tot het sluiten van een overeenkomst tracht te bewegen, duidelijk mee te delen dat zulks zijn
      oogmerk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '1'
  - number: '7.2'
    text: |-
      Een onderneming waarin of voor rekening waarvan een colporteur werkzaam is, is verplicht deze te doen handelen in
      overeenstemming met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel7
  - number: '8'
    text: 'Het is een colporteur of een onderneming waarin of voor rekening waarvan een colporteur werkzaam is, verboden:'
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel8
  - number: 8.a
    text: |-
      handelingen te verrichten of te doen verrichten als bedoeld in [artikel 1, eerste lid, onder d][ref1], indien
      de colporteur weet of redelijkerwijs moet vermoeden dat de verplichtingen die daaruit voor de desbetreffende
      particulier kunnen voortvloeien, niet in overeenstemming zijn met diens draagkracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel1
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '1'
  - number: 8.b
    text: |-
      een mededeling te doen of te laten doen die misleidend is ten aanzien van een of meer van de onderwerpen, genoemd
      in [artikel 194 van Boek 6 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel194
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '194'
  - number: 8.c
    text: |-
      meer dan één overeenkomst als bedoeld in [artikel 1, eerste lid, onder d][ref1], te sluiten of te doen
      sluiten indien redelijkerwijs moet worden aangenomen dat daarmee wordt beoogd een of meer van de betalingen
      die de desbetreffende particulier per overeenkomst moet verrichten, te doen blijven beneden het in
      [artikel 26, eerste lid][ref2], bedoelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002896#Artikel26
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002896
        artikel: '26'
  - number: 8.d
    text: |-
      handelingen te verrichten of te doen verrichten die bij algemene maatregel van bestuur als onbehoorlijke
      gedragingen zijn aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel8
  - number: '23.1'
    text: |-
      Een overeenkomst, welke het onmiddellijk gevolg is van een werkzaamheid als bedoeld in [artikel 6][ref1], is
      vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel6
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '6'
  - number: '23.2'
    text: Een beroep op de vernietigbaarheid kan slechts worden gedaan door de kredietnemer.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel23
  - number: '23.3'
    text: |-
      Indien de kredietnemer een beroep op de vernietigbaarheid heeft gedaan, kan de rechter bepalen, in welke termijnen
      de kredietnemer aan zijn verplichting tot terugbetaling van hetgeen de kredietgever in verband met de nietigheid
      van hem heeft terug te vorderen zal hebben te voldoen.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel23
  - number: '23.4'
    text: |-
      De rechtsvordering tot vernietiging verjaart door verloop van een jaar na de aanvang van de dag waarop
      de kredietgever de kredietnemer schriftelijk heeft gewezen op de mogelijkheid een beroep te doen op de
      vernietigbaarheid.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel23
  - number: '23.5'
    text: |-
      Enige overeenkomst, volgens welke de kredietnemer verplicht is een bedrag te betalen of een andere prestatie
      te verrichten dan wel niet gerechtigd is reeds betaalde bedragen terug te vorderen ingeval hij een beroep op de
      vernietigbaarheid van de overeenkomst heeft gedaan, is nietig.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel23
  - number: '24.1'
    text: |-
      Voor een overeenkomst, welke het onmiddellijk gevolg is van de werkzaamheid van een colporteur, is op straffe van
      nietigheid vereist, dat door of namens de bij de overeenkomst betrokken partijen in twee gelijkluidende exemplaren
      een akte wordt ondertekend, en dat onmiddellijk na de ondertekening door de partij, die door de colporteur tot het
      aangaan van de overeenkomst is bewogen, een exemplaar van die akte is ontvangen door ieder van beide partijen.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel24
  - number: '24.2'
    text: |-
      Door de bij de overeenkomst partij zijnde eigenaar of eigenaren van de onderneming, waarin, onderscheidenlijk voor
      rekening waarvan, de colporteur werkzaam is, wordt zorggedragen, dat:
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel24
  - number: 24.2.a
    text: |-
      in de akte, bedoeld in het eerste lid, de in [artikel 25, eerste lid][ref1], bedoelde mogelijkheid om
      de overeenkomst te ontbinden wordt vermeld alsmede zijn of hun naam en zijn of hun adres, waarnaar de in
      [artikel 25, eerste lid][ref2], bedoelde mededeling kan worden gezonden, een en ander op straffe van nietigheid van
      de overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002896#Artikel25
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002896
        artikel: '25'
  - number: 24.2.b
    text: |-
      de akte is opgemaakt met inachtneming van de overigens bij algemene maatregel van bestuur te stellen regelen
      betreffende de inhoud van dergelijke akten, alsmede betreffende de wijze, waarop deze moeten zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel24
  - number: '25.1'
    text: |-
      Een overeenkomst als in [artikel 24, eerste lid][ref1], bedoeld is ontbonden, zodra de partij, die door
      de colporteur tot het deelnemen aan het goederenkrediet of het sluiten van de overeenkomst is bewogen, met
      inachtneming van het in het tweede lid bepaalde aan de wederpartij dan wel aan de betrokken leverancier of
      kredietgever heeft medegedeeld, dat hij ontbinding van de overeenkomst of van een tot het goederenkrediet behorende
      overeenkomst verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel24
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '24'
  - number: '25.2'
    text: |-
      De in het eerste lid bedoelde mededeling dient uiterlijk te worden gedaan op de achtste dag na die, waarop voor
      de eerste maal een exemplaar van de desbetreffende akte door de in het derde lid bedoelde Kamer van Koophandel en
      Fabrieken van een gewaarmerkte dagtekening is voorzien.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
  - number: '25.3'
    text: |-
      De dagtekening geschiedt door de Kamer van Koophandel en Fabrieken, binnen welker gebied de betrokken onderneming
      gevestigd is, of door de Kamer van Koophandel en Fabrieken voor Rotterdam, indien de betrokken onderneming
      buiten Nederland gevestigd is. Dagtekening heeft niet plaats alvorens degene, die deze verlangt, een bij algemene
      maatregel van bestuur vast te stellen bedrag heeft betaald. Bij of krachtens die maatregel kunnen tevens nadere
      regelen betreffende de dagtekening en de waarmerking daarvan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
  - number: '25.4'
    text: |-
      Een brief of briefkaart, die blijkens een bewijs van terpostbezorging uiterlijk op de in het tweede lid bedoelde
      achtste dag aangetekend aan het in [artikel 24, tweede lid, onder a][ref1], bedoelde adres is verzonden, wordt,
      behoudens tegenbewijs, geacht een mededeling te bevatten als in het eerste lid bedoeld. Zodanige brief of
      briefkaart wordt geacht de geadresseerde te hebben bereikt op het tijdstip, waarop die brief of briefkaart voor de
      eerste maal aan bedoeld adres ter uitreiking is aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel24
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '24'
  - number: '25.5'
    text: |-
      [Artikel 23, vijfde lid][ref1], is in geval van ontbinding als bedoeld in het eerste lid van overeenkomstige
      toepassing. Deze ontbinding heeft terugwerkende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel23
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '23'
  - number: '25.6'
    text: |-
      Nakoming van een uit de overeenkomst voortvloeiende verbintenis kan door ieder der partijen eerst worden gevorderd
      op de negende dag na die van de in het tweede lid bedoelde dagtekening van een exemplaar van de akte.
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel25
  - number: '26.1'
    text: |-
      De [artikelen 24][ref1] en [25][ref2] gelden niet voor overeenkomsten, waarbij het totaal van de betalingen,
      ingevolge de overeenkomst of het goederenkrediet door de in [artikel 25, eerste lid][ref3], bedoelde partij te
      verrichten, minder bedraagt dan een bij algemene maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002896#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002896#Artikel25
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002896
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0002896
        artikel: '25'
  - number: '26.2'
    text: |-
      De [artikelen 24][ref1] en [25][ref2] gelden voorts niet voor overeenkomsten, welke het onmiddellijk gevolg zijn
      van colportage door middel van persoonlijk bezoek, die plaatsvindt in de uitoefening van een bedrijf, waarin aan
      vaste afnemers door middel van colportage hoofdzakelijk levensmiddelen plegen te worden verkocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002896#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002896#Artikel25
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002896
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002896
        artikel: '25'
  - number: '34'
    text: 'Deze wet kan worden aangehaald als: Colportagewet.'
    url: https://wetten.overheid.nl/BWBR0002896/2008-04-01#Artikel34
