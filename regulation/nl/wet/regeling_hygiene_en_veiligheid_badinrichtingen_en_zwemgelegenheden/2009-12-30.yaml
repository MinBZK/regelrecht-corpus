$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_hygiene_en_veiligheid_badinrichtingen_en_zwemgelegenheden
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-30'
bwb_id: BWBR0026894
url: https://wetten.overheid.nl/BWBR0026894/2009-12-30
preamble:
  text: |-
    Gelet op richtlijn 2006/7/EG van het Europees Parlement en de Raad van de Europese Unie van 15 februari 2006
    betreffende het beheer van de zwemwaterkwaliteit en tot intrekking van Richtlijn 76/160/EEG (PbEU L 64), artikel 1,
    tweede lid, van de Wet op de hygiëne en veiligheid badinrichtingen en zwemgelegenheden en de artikelen 44a, vijfde
    lid, 44d, tweede en achtste lid, en 44g van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:*
      [Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003716
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003716
  - number: '2'
    text: De aanvang van het badseizoen wordt vastgesteld op 1 mei en het einde daarvan op 30 september.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel2
  - number: '3.1'
    text: |-
      Het bevoegd bestuursorgaan voert het onderzoek, bedoeld in [artikel 44d van het besluit][ref1], eenmaal kort voor
      het begin van het badseizoen uit en vervolgens ten minste eenmaal per maand gedurende het badseizoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44d
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid, is de frequentie van het onderzoek zo hoog als nodig om het aantal monsters, genoemd
      in [artikel 5, tweede lid][ref1], te verzamelen.


      [ref1]: https://wetten.overheid.nl/BWBR0026894#Artikel5
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026894
        artikel: '5'
        paragraaf: '3'
  - number: '4'
    text: |-
      Het bevoegd bestuursorgaan verricht de zwemwateranalyse, bedoeld in [artikel 44d, achtste lid][ref1], op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44d
  - number: 4.a
    text: ISO 7899-1 of ISO 7899-2 met betrekking tot de parameter Intestinale Enterokokken, en
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel4
  - number: 4.b
    text: ISO 9308-3 met betrekking tot de parameter Escherichia coli.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel4
  - number: '5.1'
    text: |-
      Het bevoegd bestuursorgaan baseert een reeks zwemwaterkwaliteitsgegevens op het aantal monsters dat verzameld is
      op basis van het onderzoek, bedoeld in [artikel 44d, van het besluit][ref1] gedurende een periode als bedoeld in
      [artikel 44a, tweede lid, onder b, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44d
      [ref2]: https://wetten.overheid.nl/BWBR0003716#Artikel44a
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44d
      - id: ref2
        bwb_id: BWBR0003716
        artikel: 44a
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, wordt een reeks zwemwaterkwaliteitsgegevens gebaseerd op ten minste 16 monsters
      indien zich een van de omstandigheden, bedoeld in [artikel 44a, vierde lid, van het besluit][ref1] voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel44a
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: 44a
  - number: '6.1'
    text: |-
      Gedeputeerde staten plaatsen een bord op een zichtbare en gemakkelijk toegankelijke plaats in de nabijheid van een
      aangewezen locatie.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel6
  - number: '6.2'
    text: |-
      Een bord als bedoeld in het eerste lid bevat de informatie, genoemd in artikel 12, eerste lid, van de
      zwemwaterrichtlijn.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel6
  - number: '6.3'
    text: |-
      Gedeputeerde staten verspreiden de informatie, genoemd in artikel 12, tweede lid, van de zwemwaterrichtlijn in
      ieder geval via internet en zo nodig in andere talen.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel6
  - number: '7.1'
    text: |-
      Gedeputeerde staten maken de op basis van artikel 10b, eerste lid, van de wet aangemerkte locaties voor 15 oktober
      bekend aan de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en aan de Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel7
  - number: '7.2'
    text: |-
      Gedeputeerde staten maken de op basis van artikel 10b, tweede lid, van de wet aangewezen locaties voor 15 april
      bekend aan de in het eerste lid genoemde Ministers.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel7
  - number: '8'
    text: |-
      Het bevoegd bestuursorgaan en gedeputeerde staten verstrekken de gegevens, bedoeld in
      [artikel 49 van het besluit][ref1], jaarlijks uiterlijk op 1 november.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel49
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003716
        artikel: '49'
  - number: '9.1'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de wet van 2 juli 2009 tot wijziging van de Wet hygiëne
      en veiligheid badinrichtingen en zwemgelegenheden en de Wet op de waterhuishouding (aanwijzing en kwaliteit van
      zwemwateren) (Stb. 2009, 312) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel9
  - number: '9.2'
    text: |-
      Indien het tijdstip van inwerkingtreding van de wet, bedoeld in het eerste lid, is gelegen voor of op de dag van de
      datum van uitgifte van de Staatscourant waarin deze regeling wordt geplaatst, treedt deze regeling in afwijking van
      het eerste lid in werking met ingang van de dag na die datum van uitgifte.
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling hygiëne en veiligheid badinrichtingen en zwemgelegenheden.'
    url: https://wetten.overheid.nl/BWBR0026894/2009-12-30#Artikel10
