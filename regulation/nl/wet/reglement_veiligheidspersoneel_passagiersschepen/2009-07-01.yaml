$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_veiligheidspersoneel_passagiersschepen
regulatory_layer: WET
publication_date: '2011-06-30'
valid_from: '2009-07-01'
bwb_id: BWBR0025994
url: https://wetten.overheid.nl/BWBR0025994/2009-07-01
articles:
  - number: '1.01'
    text: |-
      Voorzover hierna niets anders is bepaald, gelden de begripsbepalingen van
      [artikel 1.01 van het Reglement onderzoek schepen op de Rijn 1995][ref1]. In dit reglement gelden als:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
  - number: 1.01.1
    text: '*Schip voor dagtochten:* een passagiersschip met een overeenkomstige aantekening in het certificaat van onderzoek;'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
  - number: 1.01.2
    text: '*Hotelschip:* een passagiersschip met een overeenkomstige aantekening in het certificaat van onderzoek;'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
  - number: 1.01.3
    text: |-
      *Bemanning:* de vereiste minimum bemanning van het passagiersschip als bedoeld in
      [artikel 23.12 van het Reglement onderzoek schepen op de Rijn 1995][ref1] alsmede personen, die in dezelfde functie
      aanvullend aan boord zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel23
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '23'
  - number: 1.01.4
    text: '*Veiligheidspersoneel:* de deskundige voor de passagiersscheepvaart, eerste hulpverlener en persluchtmaskerdrager;'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
  - number: 1.01.5
    text: '*Passagier:* iedere persoon aan boord, die niet tot de bemanning of tot het boordpersoneel behoort.'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.01
  - number: '1.02'
    text: |-
      Het reglement regelt de verplichtingen voor de veilige exploitatie van passagiersschepen op de Rijn, in het
      bijzonder met betrekking tot het vereiste veiligheidspersoneel en hun kwalificatie.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.02
  - number: 1.03.1
    text: |-
      Aan boord van elk passagiersschip moet veiligheidspersoneel in voldoende aantal aanwezig zijn, zolang er passagiers
      aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.03
  - number: 1.03.2
    text: De leden van het veiligheidspersoneel kunnen tot de bemanning of tot het boordpersoneel behoren.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.03
  - number: '1.04'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden benadeeld. Deze voorschriften van tijdelijke aard
      worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren. Zij
      worden in alle Oeverstaten en België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde voorwaarden
      buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.04
  - number: '1.05'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voor de toepassing van dit reglement richtlijnen vaststellen. De
      bevoegde autoriteiten dienen zich aan deze richtlijnen te houden.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel1.05
  - number: '2.01'
    text: |-
      De deskundige voor de passagiervaart moet ten minste 18 jaar zijn en de vereiste bevoegdheid bezitten. Deze wordt
      geacht aanwezig te zijn, indien de betreffende persoon:
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.01
  - number: 2.01.a)
    text: |-
      aan een door de bevoegde autoriteit erkende basisopleiding heeft deelgenomen, die tenminste de eisen, bedoeld in
      [artikel 4.01][ref1], vervult, en het examen met goed gevolg heeft afgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.01
    references:
      - id: ref1
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.01.b)
    text: |-
      regelmatig ingevolge [artikel 4.02, tweede lid][ref1], wordt bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.01
    references:
      - id: ref1
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: '2.02'
    text: |-
      De eerste hulpverlener moet tenminste 17 jaar zijn en de vereiste bevoegdheid bezitten. Deze wordt geacht aanwezig
      te zijn, indien de desbetreffende persoon
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.02
  - number: 2.02.a)
    text: aan een cursus voor eerste hulpverlener heeft deelgenomen, en
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.02
  - number: 2.02.b)
    text: |-
      regelmatig ingevolge [artikel 4.03][ref1] wordt bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: '2.03'
    text: |-
      De persluchtmaskerdrager moet tenminste 18 jaar zijn en de vereiste bekwaamheid bezitten, om de ademhalingsapparatuur
      als bedoeld in [artikel 15.12, tiende lid, onder a, van het Reglement onderzoek schepen op de Rijn 1995][ref1]
      voor de redding van personen te kunnen gebruiken. Deze wordt geacht aanwezig te zijn, indien de betreffende persoon
      de lichamelijke geschiktheid en de bevoegdheid ingevolge de nationale voorschriften van de Oeverstaten of België
      aantoont en regelmatig ingevolge [artikel 4.03][ref2] is bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel2.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.01.1
    text: |-
      Deskundigen voor de passagiersvaart, eerste hulpverleners en persluchtmaskerdragers moeten ten minste in de
      navolgende aantallen beschikbaar zijn:
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.01.1.a)
    text: gedurende de vaart aan boord
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.01.1.a).aa)
    text: |-
      Schepen voor dagtochten








                            groep


                            aantal aanwezige personen


                            deskundige voor de passagiersvaart


                            eerste hulpverlener






                            1


                            tot en met 250


                            1


                            1




                            2


                            meer dan 250


                            1


                            2
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.01.1.a).bb)
    text: |-
      Hotelschepen









                            groep


                            aantal gereserveerde bedden


                            deskundige voor de passagiersvaart


                            eerste hulpverlener


                            persluchtmaskerdrager






                            1


                            tot en met 100


                            1


                            1


                            2




                            2


                            meer dan 100


                            1


                            2


                            2
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.01.1.b)
    text: |-
      tijdens het stilliggen moet het ingevolge onderdeel a voorgeschreven veiligheidspersoneel van de groep 1 permanent
      beschikbaar zijn. Voor hotelschepen waarvan de lengte niet meer is dan 45 m en waarvan in de kabines evenveel
      vluchtmaskers voor de aanwezige personen bij de hand zijn, zijn persluchtmaskerdragers niet vereist.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.01.2
    text: |-
      Op schepen voor dagtochten met een toegelaten aantal personen van niet meer dan 75 en op stilliggende
      passagiersschepen mogen de functies van deskundigen voor passagiersvaart en de eerste hulpverlener echter door
      een persoon worden waargenomen. In alle andere gevallen mogen de deskundige voor de passagiersvaart, eerste
      hulpverlener en persluchtmaskerdrager niet dezelfde persoon zijn.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.01
  - number: 3.02.1
    text: 'Onverminderd de voorschriften van het Rijnvaartpolitiereglement moet de schipper:'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.1.a)
    text: |-
      de deskundige voor de passagiersvaart met de veiligheidsrol en het veiligheidsplan, bedoeld in
      [artikel 15.13, van het Reglement onderzoek schepen op de Rijn 1995][ref1] vertrouwd maken,


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
  - number: 3.02.1.b)
    text: voor de instructie van de deskundige voor de passagiersvaart zorgdragen,
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.1.c)
    text: |-
      de vereiste bevoegdheid van het veiligheidspersoneel, bedoeld in de [artikelen 2.01 tot en met 2.03][ref1], steeds
      aan boord door overeenkomstige verklaringen als bedoeld in [artikel 4.04][ref2] kunnen aantonen,


      [ref1]: https://wetten.overheid.nl/BWBR0025994#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
    references:
      - id: ref1
        bwb_id: BWBR0025994
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.02.1.d)
    text: voor het aantonen van de uitvoering van controles zorgdragen.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.2
    text: |-
      De deskundige voor de passagiersvaart moet zorgdragen voor de bewaking van de veiligheidsinrichtingen en
      -uitrustingen overeenkomstig de veiligheidsrol en voor de veiligheid van de passagiersschepen in geval van gevaar
      en in noodsituaties aan boord. Hij moet de veiligheidsrol en het veiligheidsplan in detail kennen en volgens de
      door de schipper verstrekte instructies:
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.2.a)
    text: |-
      de leden van de bemanning en van het boordpersoneel, die taken in de veiligheidsrol hebben, de daar beschreven
      taken voor noodsituaties toedelen,
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.2.b)
    text: deze leden van de bemanning en van het boordpersoneel regelmatig in de hun toebedeelde taken instrueren,
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: 3.02.2.c)
    text: |-
      de passagiers aan boord van hotelschepen bij het begin van de reis op de gedragsregels en het veiligheidsplan
      attent maken.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.02
  - number: '3.03'
    text: |-
      Zolang zich passagiers aan boord bevinden, moet er ’s nachts ieder uur een controleronde gemaakt worden. Deze
      controle moet op geëigende wijze aantoonbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel3.03
  - number: 4.01.1
    text: |-
      Personen, die de taak als deskundige als bedoeld in [artikel 2.01][ref1] moeten waarnemen, moeten voor het
      verkrijgen van de vakkennis aan een basisopleiding deelnemen. De basisopleiding moet, in het kader van een door de
      bevoegde autoriteit georganiseerde of door haar erkende opleiding, uitgevoerd (gevolgd) worden en moet tenminste
      bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0025994#Artikel2
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0025994
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.01.1.a)
    text: 'een opleiding in de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).1°
    text: voorgeschreven inrichting en uitrusting van passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).2°
    text: veiligheidsvoorschriften en inleiding over de benodigde hulpmaatregelen;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).3°
    text: taken van de bemanning en van het boordpersoneel overeenkomstig de veiligheidsrol;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).4°
    text: grondbeginselen betreffende de stabiliteit van de passagiersschepen in het geval van een ongeval;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).5°
    text: |-
      voorkomen van brand en brandbestrijding, gebruik van de brandblusinrichtingen (wijze van werking van de
      automatische sprinklerinstallaties, brandmeldsystemen en vast geïnstalleerde brandblusinstallaties);
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).6°
    text: keuringsbewijs van de veiligheidsinrichtingen en -uitrustingen;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).7°
    text: principes van conflicthantering;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.a).8°
    text: grondbeginselen van het voorkomen van paniek;
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.b)
    text: 'een praktische oefening met de volgende thema’s:'
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.b).1°
    text: |-
      kennis betreffende de bediening en het gebruik van de veiligheidsuitrusting van passagiersschepen (bijvoorbeeld
      het omdoen van de reddingsvesten, het gebruik van drijflichamen, de bediening van de bijboot en van de overige
      reddingsmiddelen, de bediening van draagbare brandblussers);
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.b).2°
    text: |-
      kennis betreffende de praktische omzetting van veiligheidsvoorschriften en het op gang brengen van de noodzakelijke
      hulpmaatregelen (bijvoorbeeld het evacueren van passagiers uit een vol rook staande ruimte naar een veilige
      omgeving, de bestrijding van het begin van een brand, het gebruik van de waterdichte en brandvertragende deuren);
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.1.c)
    text: een afsluitend examen.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
  - number: 4.01.2
    text: |-
      Nadat het examen met goed gevolg is afgelegd geeft de bevoegde autoriteit of het opleidingsinstituut aan de
      deelnemer een verklaring als deskundige voor de passagiersvaart af volgens het model van [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025994
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0025994
  - number: 4.02.1
    text: |-
      De deskundige voor de passagiersvaart moet, voor het einde van een termijn van 5 jaar na een succesvolle deelname
      aan de basisopleiding, aan een door de bevoegde autoriteit erkende opfriscursus deelnemen.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.02
  - number: 4.02.2
    text: |-
      De opfriscursus moet de nadruk leggen op typische gevaarsituaties (zoals bijvoorbeeld het voorkomen van paniek,
      brandbestrijding) en – voorzover mogelijk – informatie met betrekking tot nieuwe kennis over passagiersveiligheid
      overdragen. Gedurende de herhalingscursus moet door middel van oefeningen en testen worden vastgesteld, dat de
      deelnemer actief aan de cursus heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.02
  - number: 4.02.3
    text: |-
      De deskundige voor de passagiersvaart moet telkens voor het einde van de termijn van 5 jaar na deelname aan de
      herhalingscursus opnieuw aan een herhalingscursus deelnemen.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.02
  - number: 4.02.4
    text: |-
      Na deelname aan een herhalingscursus verlengt de bevoegde autoriteit of het opleidingsinstituut de verklaring van
      de deelnemer als deskundige voor de passagiersvaart met 5 jaar, of geeft een nieuwe verklaring af.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.02
  - number: '4.03'
    text: |-
      De cursussen en herhalingscursussen voor eerste hulpverlener en persluchtmaskerdrager moeten volgens de
      voorschriften van een der Oeverstaten of België georganiseerd worden.
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.03
  - number: 4.04.1
    text: |-
      Het grote patent als bedoeld in het [Reglement Rijnpatenten 1998][ref1] en het bevoegdheidsbewijs, die volgens
      de nationale voorschriften van de Oeverstaten of België recht geven op het voeren van passagiersschepen of
      andere, door de Centrale Commissie voor de Rijnvaart als gelijkwaardig erkende bevoegdheidsbewijzen, vervangen de
      verklaring, bedoeld in [artikel 4.01, tweede lid][ref2], tot en met 31 december 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0008934
      [ref2]: https://wetten.overheid.nl/BWBR0025994#Artikel4
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.04
    references:
      - id: ref1
        bwb_id: BWBR0008934
      - id: ref2
        bwb_id: BWBR0025994
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.04.2
    text: |-
      Op vertoon van het cursusbewijs geeft de bevoegde autoriteit een verklaring af betreffende de bevoegdheid als
      eerste hulpverlener volgens het model van [bijlage 2][ref1] of verlengt deze. Als verklaringen gelden ook de
      documenten van de nationale of regionale organisaties van het Rode Kruis en vergelijkbare nationale of regionale
      reddingsorganisaties, die door de Centrale Commissie voor de Rijnvaart bekend worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025994
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.04
    references:
      - id: ref1
        bwb_id: BWBR0025994
  - number: 4.04.3
    text: |-
      Op vertoon van het cursusbewijs geeft de bevoegde autoriteit een verklaring af betreffende de bevoegdheid als
      persluchtmaskerdrager volgens het model van [bijlage 3][ref1] of verlengt deze. Deze cursusbewijzen gelden als
      verklaring, als deze zijn afgegeven door een volgens het nationale recht van de Oeverstaten of België erkend
      opleidingsinstituut en door de Centrale Commissie voor de Rijnvaart bekend zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0025994
    url: https://wetten.overheid.nl/BWBR0025994/2009-07-01#Artikel4.04
    references:
      - id: ref1
        bwb_id: BWBR0025994
