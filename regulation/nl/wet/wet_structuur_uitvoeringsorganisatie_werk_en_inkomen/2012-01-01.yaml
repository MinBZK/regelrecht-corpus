  - number: '74'
    text: |-
      1 Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet
      over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering
      van deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.

      2 Het in het eerste lid vervatte verbod is niet van toepassing indien:

      a. enig wettelijk voorschrift tot de bekendmaking verplicht;

      b. degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;

      c. de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.

      3 Degene die op grond van de [artikelen 62][ref1], [72][ref2] of [73][ref3] gegevens verstrekt dient na te gaan of
      degene aan wie de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.

      4 Onverminderd het eerste tot en met derde lid is [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref4]
      voorzover het betreft de overeenkomstige toepassing van de [artikelen 457][ref5] en
      [464, tweede lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref6] niet van toepassing indien in verband
      met de uitvoering van deze wet handelingen worden verricht op het gebied van de geneeskunst door personen, voor wie
      het in het eerste lid vervatte verbod geldt.


