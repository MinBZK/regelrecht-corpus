  - number: 30c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen neemt, onverminderd
      [artikel 41, tweede lid, van de Wet werk en bijstand][ref1], aanvragen in ontvangst van algemene
      bijstand op grond van de [Wet werk en bijstand][ref2] dan wel van een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3]. Bij het in ontvangst
      nemen van de aanvraag legt het Uitvoeringsinstituut werknemersverzekeringen de datum van de aanvraag vast en op
      welke dag hij naam, adres en woonplaats van de belanghebbende heeft geregistreerd en hem in staat heeft gesteld
      zijn aanvraag in te dienen.

      2 De belanghebbende verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen op verzoek alle gevraagde
      gegevens en bewijsstukken die nodig zijn voor de beslissing op zijn aanvraag door het college van burgemeester en
      wethouders van de betrokken gemeente.

      3 De belanghebbende deelt op verzoek van het Uitvoeringsinstituut werknemersverzekeringen of onverwijld uit eigen
      beweging in verband met de toepassing van dit artikel alle feiten en omstandigheden mee, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op bijstand of het recht op een uitkering, het
      geldend maken van het recht op bijstand of het recht op een uitkering, of de hoogte of de duur van de bijstand
      of de uitkering. Deze verplichting geldt niet indien die feiten en omstandigheden door het Uitvoeringsinstituut
      werknemersverzekeringen kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte
      gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële
      regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.

      4 [Artikel 33a, tweede en vierde lid][ref4], zijn van overeenkomstige toepassing.

      5 Het Uitvoeringsinstituut werknemersverzekeringen draagt de aanvraag met de daarbij verstrekte gegevens
      en bewijsstukken, alsmede het daarbij behorende burgerservicenummer of, bij het ontbreken daarvan, sociaal-
      fiscaalnummer, over aan het college van burgemeester en wethouders van de betrokken gemeente. Het
      Uitvoeringsinstituut werknemersverzekeringen doet tegelijkertijd van deze overdracht schriftelijk mededeling aan
      belanghebbende. De verplichting van het derde lid geldt tot het tijdstip van ontvangst van deze mededeling.

      6 Het Uitvoeringsinstituut werknemersverzekeringen sluit overeenkomsten met het college van burgemeester
      en wethouders van de betrokken gemeente over de wijze van uitvoering van dit artikel, waarbij voor bepaalde
      categorieën van aanvragen een andere taakverdeling kan worden vastgesteld dan die voortvloeit uit het eerste en
      tweede lid. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit lid.

      7 De gegevens en bewijsstukken, bedoeld in het tweede lid, worden door het college van burgemeester en
      wethouders niet verkregen van de belanghebbende voor zover ze zijn verkregen van het Uitvoeringsinstituut
      werknemersverzekeringen, tenzij hierdoor een goede vervulling van de taak van het college van burgemeester en
      wethouders op grond van dit artikel wordt belet.

      8 [Artikel 4:5 van de Algemene wet bestuursrecht][ref5] is niet van toepassing ten aanzien van de uitvoering van
      dit artikel door het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
