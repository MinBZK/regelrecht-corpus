      1 Het Uitvoeringsinstituut werknemersverzekeringen gebruikt het burgerservicenummer of, bij het ontbreken daarvan,
      het sociaal-fiscaalnummer bij de verwerking van persoonsgegevens:

      a. voor de uitvoering van de in [artikel 30, eerste lid][ref1], genoemde verzekeringen en wetten;

      b. in de polisadministratie, bedoeld in [artikel 33][ref2];

      c. bij de uitvoering van de taken, bedoeld in de [artikelen 30a][ref3], [30b][ref4], [30c][ref5] en [30d][ref6];

      d. bij de uitvoering van [artikel 30, zesde lid][ref7], voor zover dit betreft de uitvoering van het
      [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref8].

      2 Het Uitvoeringsinstituut werknemersverzekeringen verifieert het burgerservicenummer of, bij het ontbreken
      daarvan, het sociaal-fiscaalnummer in relatie tot de bijbehorende persoonsidentificerende gegevens, van
      de natuurlijke persoon, bedoeld in [artikel 33, tweede lid, onderdeel a][ref9], bij de eerste opname in de
      polisadministratie en vervolgens indien daartoe aanleiding is, bij de rijksbelastingdienst.

      3 Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Financiën, nadere regels worden
      gesteld ter uitvoering van dit artikel.


