  - number: 83k
    text: |-
      1 De werkzaamheden, die worden verricht uit hoofde van de uitoefening van de taak,
      bedoeld in [artikel 10 van de Wet op de (re)integratie arbeidsgehandicapten][ref1],
      zoals dit artikel luidde tot de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2],
      waardoor [dit artikel 10][ref3] vervalt, worden aangemerkt als werkzaamheden uitgevoerd op grond van
      [artikel 30a, achtste lid][ref4].

      2 Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in
      [artikel 30a, eerste lid][ref5], ten aanzien van personen die met toepassing van
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref6] geacht werden verzekerd te
      zijn voor de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7] ook na de inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref8], waardoor
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref9] vervalt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de uitvoering van dit
      artikel.


