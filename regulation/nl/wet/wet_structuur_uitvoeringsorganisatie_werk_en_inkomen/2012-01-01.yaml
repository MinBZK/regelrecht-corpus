  - number: '76'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank dragen op de voet van de ter
      zake voor de Rijksdienst geldende voorschriften zorg voor de nodige technische en organisatorische voorzieningen
      ter beveiliging van hun gegevens tegen verlies of aantasting en tegen onbevoegde kennisneming, wijziging en
      verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel76
  - number: '77'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de verstrekking van inlichtingen en het verlenen
      van inzage in gegevens en bescheiden door het Inlichtingenbureau, het Uitvoeringsinstituut werknemersverzekeringen,
      de Raad voor werk en inkomen en de Sociale verzekeringsbank aan Onze Minister en aan de Inspectie Werk en Inkomen
      op grond van deze wet en kunnen regels worden gesteld omtrent de inrichting van de administratie van de genoemde
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel77
  - number: '79'
    text: |-
      Indien een besluit goedkeuring behoeft op grond van deze wet of enige andere wet die wordt uitgevoerd door het
      Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank kan de goedkeuring worden onthouden op
      de grond dat het besluit in strijd met het recht of met het algemeen belang is.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel79
  - number: '82'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk
      zijn in verband met de goede uitvoering door het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank van hun wettelijke taken.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide Kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel82
  - number: 82a
    text: |-
      1 Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op
      het onderzoeken van mogelijkheden om deze wet, de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8] en de [Toeslagenwet][ref9] doeltreffender uit te voeren,
      worden afgeweken van het bepaalde bij of krachtens:

      a. de [artikelen 9][ref10], [10][ref11], [30][ref12] en [30a][ref13] van deze wet;

      b. de [artikelen 7][ref14], [8][ref15], [9][ref16], [10][ref17] en [55 van de Wet werk en bijstand][ref18];

      c. de
      __REF000___________________________________________________________________________________________________________
      _____________;

      d. de
      __REF000___________________________________________________________________________________________________________
      _______________;

      e. [hoofdstuk VI van de Werkloosheidswet][ref21];

      f. [paragraaf 4.2][ref22] en [artikel 39 van de Wet werk en inkomen naar arbeidsvermogen][ref23];

      g. [hoofdstuk IIB van de Wet op de arbeidsongeschiktheidsverzekering][ref24];

      h. [afdeling 5 van hoofdstuk 2][ref25], [afdeling 5 van hoofdstuk 3][ref26] en
      [hoofdstuk 5 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref27];

      i. [hoofdstuk 7 van de Wet financiering sociale verzekeringen][ref28];

      j. [artikel 13][ref29] en de [artikelen 19 tot en met 21 van de Wet inkomensvoorziening oudere werklozen][ref30].

      2 Bij een algemene maatregel van bestuur als bedoeld in het eerste lid wordt geregeld op welke wijze van welke
      artikelen wordt afgeweken en kunnen alleen regels worden gesteld:

      a. ter verbetering van de samenwerking tussen de uitvoeringsorganisaties van de in het eerste lid genoemde wetten;

      b. met betrekking tot de inzet van re-integratie-instrumenten en de financiering daarvan;

      c. over de verantwoording van de uitgaven ten laste van de fondsen, de uitkeringen, bedoeld in
      [artikel 69 van de Wet werk en bijstand][ref31], en rijksbijdragen;

      d. het verstrekken van inlichtingen over de resultaten van de experimenten.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid vervalt vijf jaar na de inwerkingtreding,
      tenzij:

      a. in de algemene maatregel van bestuur is bepaald dat deze eerder vervalt;

      b. binnen deze vijf jaar een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in
      een wettelijke regeling.

      4 Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel tot wet
      verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van die wet.

      5 Onze Minister kan op gezamenlijk verzoek van een college van burgemeester en wethouders, het Uitvoeringsinstituut
      werknemersverzekeringen en in voorkomend geval de Sociale verzekeringsbank, gemeenten aanwijzen waar door
      het college van burgemeester en wethouders, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank wordt deelgenomen aan een experiment. Bij of krachtens algemene maatregel van bestuur kunnen
      regels worden gesteld met betrekking tot de toepassing van deze bevoegdheid.

      6 Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.

      7 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


