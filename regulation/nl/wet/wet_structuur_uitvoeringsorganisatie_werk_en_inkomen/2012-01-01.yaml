  - number: '36'
    text: |-
      1 Er is een Inspectie Werk en Inkomen die onder Onze Minister ressorteert. Aan het hoofd van de Inspectie staat de
      inspecteur-generaal.

      2 Het toezicht op de uitvoering van de taken die bij of krachtens deze wet of enige andere wet zijn opgedragen
      aan het Inlichtingenbureau, de Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de
      Sociale verzekeringsbank, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel36
  - number: '37'
    text: |-
      De Inspectie Werk en Inkomen is belast met:

      a. het toezicht op de rechtmatigheid en doelmatigheid, waaronder begrepen doeltreffendheid, van de uitvoering van
      de bij of krachtens deze wet of enige andere wet aan het Inlichtingenbureau, de Raad voor werk en inkomen, het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank opgedragen taken;

      b. 1°. het toezicht op de rechtmatigheid van de uitvoering van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] door de colleges
      van burgemeester en wethouders, en de doeltreffendheid van die wetten;

      2°. het geven van het oordeel over de uitvoering van de [Wet werk en bijstand][ref4], bedoeld in
      [artikel 74, vierde lid, van die wet][ref5];

      3°. het toezicht op de rechtmatigheid en de doeltreffendheid van de uitvoering van de
      [Wet sociale werkvoorziening][ref6] door de colleges van burgemeester en wethouders en op de doeltreffendheid van
      die wetten.

      c. het toezicht op de rechtmatigheid en doelmatigheid, waaronder begrepen doeltreffendheid, van de wijze waarop
      het Uitvoeringsinstituut werknemersverzekeringen, de Sociale Verzekeringsbank en de colleges van burgemeester en
      wethouders bij de uitvoering van de aan hen opgedragen taken samenwerken;

      d. het verrichten van andere bij of krachtens een wet aan de Inspectie Werk en Inkomen opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
