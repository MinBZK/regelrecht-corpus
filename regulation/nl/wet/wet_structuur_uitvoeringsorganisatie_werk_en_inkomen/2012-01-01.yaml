      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen bij de uitoefening
      van hun taak de identiteit van de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], voorzover dit
      noodzakelijk is voor de uitoefening van die taak.

      2 Een ieder verstrekt op verzoek onverwijld aan de in het eerste lid genoemde rechtspersonen inzage in een op hem
      betrekking hebbend document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2], voorzover dit
      redelijkerwijs nodig is voor de uitvoering van wettelijke taken door de betrokken rechtspersoon.

      3 De werkgever treft in zijn bedrijf zodanige maatregelen dat de daar werkzame personen gedurende de arbeidstijd
      aan de verplichting bedoeld in het tweede lid kunnen voldoen.


