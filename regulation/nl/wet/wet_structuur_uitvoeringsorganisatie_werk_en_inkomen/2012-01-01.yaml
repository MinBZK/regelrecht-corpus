  - number: '34'
    text: |-
      1 De Sociale verzekeringsbank heeft tot taak:

      a. de [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Algemene Kinderbijslagwet][ref3],
      alsmede wetten die de uitvoering van deze wetten beheersen, uit te voeren, voorzover die uitvoering niet bij of
      krachtens enige andere wet aan anderen is opgedragen;

      b. beheren en administreren van de fondsen, bedoeld in
      [artikel 1, onderdelen f en g van de Wet financiering sociale verzekeringen][ref4] en het Algemeen
      Kinderbijslagfonds, genoemd in [artikel 29a van de Algemene Kinderbijslagwet][ref5];

      c. zorgdragen voor gevraagde en ongevraagde verstrekking van deugdelijke informatie aan werkgevers, werknemers,
      uitkeringsgerechtigden, verzekerden en andere belanghebbenden in verband met de uitvoering van de in onderdeel a
      genoemde wetten;

      d. het uitvoeren van taken die bij of krachtens enige andere wet dan de in onderdeel a bedoelde wetten, aan de
      Sociale verzekeringsbank zijn opgedragen;

      e. het in opdracht van Onze Minister of uit eigen beweging verrichten van onderzoek met betrekking tot de
      wettelijke taken van deze organisatie;

      f. het aan Onze Minister op zijn verzoek verstrekken van de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voorzover deze betrekking hebben op onderwerpen
      als bedoeld in dit artikel;

      g. het voeren van een adequate administratie ten behoeve van de uitoefening van haar taak.

      2 De Sociale verzekeringsbank verricht diensten voor gegevensverkeer met het buitenland, waarbij de Sociale
      verzekeringsbank en de hierna genoemde bestuursorganen de omvang van die diensten nader kunnen overeenkomen of voor
      zover dit voortvloeit uit internationaalrechtelijke voorschriften:

      a. ten behoeve van een rechtmatige uitvoering van bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen opgedragen taken;

      b. ten behoeve van een rechtmatige uitvoering van aan de colleges van burgemeester
      en wethouders opgedragen taken bij of krachtens de [Wet werk en bijstand][ref6], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref8];

      c. ten behoeve van Onze Minister met het oog op het toezicht op de naleving van wetten.

      3 De Sociale verzekeringsbank verwerkt gegevens afkomstig uit het buitenland en verricht taken in verband met deze
      gegevensverwerking:

      a. ten behoeve van de uitvoering van bij of krachtens de [Algemene Wet Bijzondere Ziektekosten][ref9]
      en de [Zorgverzekeringswet][ref10] aan het College voor zorgverzekeringen, genoemd in
      [artikel 58 van de Zorgverzekeringswet][ref11], opgedragen taken;

      b. ten behoeve van de uitvoering van de [Algemene wet inkomensafhankelijke regelingen][ref12] door de
      Belastingdienst/Toeslagen;

      c. ten behoeve van de vaststelling van het verzekerd zijn op grond van de werknemersverzekeringen, de
      volksverzekeringen, of het verzekeringsplichtig zijn op grond van de [Zorgverzekeringswet][ref13], voor
      zover dit voortvloeit uit internationaalrechtelijke voorschriften, dan wel stelt op basis van door de Sociale
      verzekeringsbank te verwerken gegevens op verzoek van de genoemde bestuursorganen en de zorgverzekeraars, genoemd
      in de [Zorgverzekeringswet][ref14], verzekering of verzekeringstijdvakken vast.

      4 De Sociale verzekeringsbank verstrekt op verzoek van een verzekerde, een zorgverzekeraar of andere belanghebbende
      informatie over de verzekeringsstatus van de verzekerde voor zover deze informatie noodzakelijk is voor de
      uitvoering van de [Algemene Wet Bijzondere Ziektekosten][ref15] en de [Zorgverzekeringswet][ref16] en verstrekt
      op verzoek van een verzekerde informatie over de verzekeringstijdvakken en daarop gebaseerde aanspraak op
      ouderdomspensioen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      financiering van deze taken.


