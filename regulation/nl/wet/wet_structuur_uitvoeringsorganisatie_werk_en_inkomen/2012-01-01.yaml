  - number: '32'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een
      werknemer een onderzoek in naar en geeft een oordeel over het bestaan van ongeschiktheid tot
      werken, indien de werknemer een geschil heeft met zijn werkgever over recht op loon als bedoeld in
      [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of recht op bezoldiging als bedoeld in
      [artikel 76a, eerste lid, van de Ziektewet][ref2].

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een werknemer
      dan wel een eigenrisicodrager als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3]
      of personen als bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref4] die
      laatstelijk tot hem in dienstbetrekking stonden, een onderzoek in naar en geeft een oordeel over de
      nakoming door de werknemer of de persoon die recht heeft op ziekengeld van verplichtingen als bedoeld in
      [artikel 660a van Boek 7 van het Burgerlijk Wetboek][ref5] dan wel overeenkomstige bepalingen.

      3 Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een werknemer dan wel
      een eigenrisicodrager als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref6] of personen
      als bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref7] die laatstelijk tot hem in
      dienstbetrekking stonden, een onderzoek in naar en geeft een oordeel over:

      a. de aanwezigheid van passende arbeid, die de zieke werknemer voor de werkgever, respectievelijk de persoon die
      recht heeft op ziekengeld voor de eigenrisicodrager, in staat is te verrichten; of

      b. de vraag of de werkgever ten aanzien van zijn zieke werknemer, respectievelijk de eigenrisicodrager ten aanzien
      van de persoon aan wie hij ziekengeld moet betalen, voldoende en geschikte re-integratie-inspanningen heeft
      verricht.

      4 Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een eigenrisicodrager als
      bedoeld in [artikel 1 van de Wet werk en inkomen naar arbeidsvermogen][ref8] of de verzekerde, bedoeld in
      [artikel 82, eerste lid, onderdeel b, van die wet][ref9], die recht heeft op uitkering een onderzoek in naar
      en geeft een oordeel over de vraag of de eigenrisicodrager ten aanzien van genoemde verzekerde voldoende en
      geschikte re-integratie-inspanningen heeft verricht voor zover hieromtrent door de eigenrisicodrager geen besluit
      is afgegeven.

      5 Het Uitvoeringsinstituut werknemersverzekeringen adviseert een overheidswerkgever als bedoeld in
      [artikel 1, onderdeel i, van de Werkloosheidswet][ref10] op diens verzoek met betrekking tot door die werkgever
      te verlenen ondersteuning aan de overheidswerknemer, bedoeld in artikel 1, onderdeel j, van de Werkloosheidswet aan
      wie toestemming als bedoeld in [artikel 77a van de Werkloosheidswet][ref11] is verleend.

      6 Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een overheidswerkgever als bedoeld in
      [artikel 1, onderdeel i, van de Werkloosheidswet][ref12] een onderzoek in naar en geeft een oordeel over de
      vraag of een overheidswerknemer als bedoeld in artikel 1, onderdeel j, van de Werkloosheidswet die gedurende een
      ononderbroken periode van 104 weken ongeschikt tot werken is geweest, nog ongeschikt tot werken is en over de vraag
      of het aannemelijk is dat de ongeschiktheid tot werken langer dan zesentwintig weken zal voortduren of over de
      vraag of redelijkerwijs niet de mogelijkheid bestaat om die overheidswerknemer binnen zesentwintig weken, indien
      nodig door middel van scholing, te herplaatsen in een aangepaste of andere functie, die voor die overheidswerknemer
      als passend kan worden beschouwd.

      7 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op verzoek van een werkgever of een werknemer
      informatie over de sociale verzekeringsaspecten van arbeidsongeschiktheid, werkloosheid en re-integratie.


