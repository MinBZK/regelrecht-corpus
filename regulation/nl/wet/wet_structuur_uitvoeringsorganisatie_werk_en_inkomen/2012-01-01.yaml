  - number: '16'
    text: |-
      1 Er is een Raad voor werk en inkomen. De Raad voor werk en inkomen heeft rechtspersoonlijkheid en heeft zijn zetel
      op een door Onze Minister te bepalen plaats.

      2 De Raad voor werk en inkomen bestaat uit zestien leden, onder wie een voorzitter, en vijftien plaatsvervangende
      leden die door Onze Minister worden benoemd en door hem kunnen worden geschorst en ontslagen.

      3 De daartoe door Onze Minister aangewezen algemeen erkende centrale organisaties van werknemers, de daartoe
      door hem aangewezen algemeen erkende en andere representatieve organisaties van werkgevers en de daartoe
      door hem aangewezen rechtspersoon, die de gemeenten vertegenwoordigt, doen aan Onze Minister een voordracht
      voor de benoeming van de leden en de plaatsvervangende leden van de Raad voor werk en inkomen. De aangewezen
      werknemersorganisaties doen daarbij een voordracht voor vijf leden en vijf plaatsvervangende leden, de aangewezen
      werkgeversorganisaties voor vijf leden en vijf plaatsvervangende leden, en de aangewezen rechtspersoon die de
      gemeenten vertegenwoordigt voor vijf leden en vijf plaatsvervangende leden.

      4 Het derde lid is niet van toepassing op de voorzitter van de Raad voor werk en inkomen.

      5 De leden van de Raad voor werk en inkomen worden benoemd voor ten hoogste vier jaar. Herbenoeming kan éénmaal
      voor ten hoogste vier jaar plaatsvinden. De persoon die tussentijds als lid of als plaatsvervangend lid wordt
      benoemd, treedt af op het tijdstip waarop degene in wiens plaats hij is benoemd, had moeten aftreden.

      6 Alvorens representatieve organisaties als bedoeld in het derde lid aan te wijzen, stelt Onze Minister de Sociaal-
      Economische Raad in de gelegenheid over de representativiteit van die organisaties advies uit te brengen.

      7 Onze Minister stelt de rechtspositie van de voorzitter van de Raad voor werk en inkomen en de vergoedingen van de
      leden van de Raad voor werk en inkomen vast.

      8 Het personeel van de Raad voor werk en inkomen wordt in dienst genomen op arbeidsovereenkomst naar burgerlijk
      recht. De bepalingen van de [tiende titel van boek 7 van het Burgerlijk Wetboek][ref1] zijn op deze overeenkomst
      van toepassing.


