    text: |-
      1 De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank, met uitzondering van de [artikelen 15][ref2] en
      [33 van die wet][ref3].

      2 Indien de mandaatverlening, bedoeld in [artikel 8 van de Kaderwet zelfstandige bestuursorganen][ref4], het
      mandateren van de uitvoering van taken van één van de op grond van [artikel 9, eerste lid][ref5], samenwerkende
      bestuursorganen aan het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank betreft, is
      in afwijking van [artikel 8 van de Kaderwet zelfstandige bestuursorganen][ref6] geen goedkeuring van Onze Minister
      vereist.


