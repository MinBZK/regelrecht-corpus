      1 Onze minister verstrekt jaarlijks ten laste van ’s Rijks kas aan de Sociale verzekeringsbank een
      uitkering voor de kosten van de door haar toegekende algemene bijstand in de vorm van een aanvullende
      inkomensvoorziening ouderen, bedoeld in [artikel 47a, eerste lid, van de Wet werk en bijstand][ref1] en voor
      de daarbij verschuldigde loonbelasting, premies voor de volksverzekeringen en de vergoedingen, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref2], van inkomensafhankelijke bijdragen.

      2 De Sociale verzekeringsbank beheert en administreert de uitkering afzonderlijk.

      3 Dit hoofdstuk is van toepassing voor begroting, beheer en verantwoording door de Sociale verzekeringsbank van de
      uitvoering van [paragraaf 5.4 van de Wet werk en bijstand][ref3].

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de berekening van het bedrag
      van de uitkering en de daarvoor noodzakelijke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
