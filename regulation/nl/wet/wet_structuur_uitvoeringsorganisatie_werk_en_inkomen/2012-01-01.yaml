  - number: '75'
    text: |-
      De door het Uitvoeringsinstituut werknemersverzekeringen in het kader van zijn in [artikel 30a, tweede lid][ref1],
      genoemde taak, en op grond van [artikel 30b][ref2] geregistreerde gegevens zijn openbaar voor zover die van
      belang zijn voor de uitoefening van de in [artikel 30a, tweede lid][ref3], genoemde taak, met dien verstande dat
      openbaarmaking van tot een individuele werkzoekende of een individuele werkgever, zijnde een natuurlijk persoon,
      herleidbare gegevens plaatsvindt met inachtneming van de [Wet bescherming persoonsgegevens][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel75
