      1 Met het toezicht op de naleving van de in de [artikelen 30, eerste lid][ref1], [32d][ref2],
      [34, eerste lid, onderdelen a en d][ref3], en [34a][ref4], bedoelde wet- en regelgeving en de [artikelen 54][ref5]
      en [55][ref6], voor zover het geen verplichtingen betreft die betrekking hebben op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank, zijn belast de door ieder van hen afzonderlijk bij besluit
      aangewezen, onder hen ressorterende personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


