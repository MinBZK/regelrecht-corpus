  - number: '42'
    text: |-
      1 Het Inlichtingenbureau, de Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de
      Sociale verzekeringsbank verstrekken op verzoek, kosteloos, aan de Inspectie Werk en Inkomen alle gegevens en
      inlichtingen die voor de uitoefening van haar taak noodzakelijk zijn.

      2 De in het eerste lid genoemde rechtspersonen verlenen de Inspectie Werk en Inkomen op verzoek toegang tot en
      inzage in gegevens en bescheiden voor zover dat voor de uitoefening van haar taak noodzakelijk is.

      3 De Inspectie Werk en Inkomen bepaalt de termijn waarbinnen en de wijze waarop aan de in het eerste en tweede lid
      bedoelde verplichtingen wordt voldaan.

      4 Indien naar het oordeel van de Inspectie Werk en Inkomen gerede twijfel bestaat omtrent de volledigheid
      of juistheid van de door het Uitvoeringsinstituut werknemersverzekeringen verstrekte stukken als bedoeld in
      [artikel 49][ref1], voor zover dit betreft de rechtmatige en doelmatige besteding van door dat instituut ter
      beschikking gestelde financiële middelen ten behoeve van de inschakeling van werkzoekenden, uitkeringsgerechtigden
      en werknemers in de arbeid, kan zij het Uitvoeringsinstituut werknemersverzekeringen opdragen bij de natuurlijke
      of rechtspersoon die deze middelen heeft besteed, ter verificatie een nader onderzoek te doen instellen door
      een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] die bij
      de verstrekte informatie niet betrokken is geweest. De Inspectie Werk en Inkomen bepaalt welke aspecten van de
      verstrekte informatie geverifieerd dienen te worden en de termijn waarbinnen het onderzoek wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '43'
    text: |-
      Onze Minister kan regels stellen waarin besluiten van het Inlichtingenbureau, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank worden omschreven die overeenkomstig die regels, binnen de
      in die regels gestelde termijnen, ter kennis van de Inspectie Werk en Inkomen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel43
  - number: '44'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taakuitoefening, de
      inrichting en het beheer van de Inspectie Werk en Inkomen en haar positie binnen de departementale organisatie.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel44
  - number: '45'
    text: |-
      1 De uitvoeringskosten van de Raad voor werk en inkomen komen ten laste van de daartoe door Onze Minister
      toegekende rijksbijdrage.

      2 De uitvoeringskosten van het Uitvoeringsinstituut werknemersverzekeringen komen ten laste van:

      a. de fondsen, bedoeld in [artikel 1, onderdelen j tot en met m, van de Wet financiering sociale verzekeringen][ref1];

      b.

      c. het Arbeidsondersteuningsfonds jonggehandicapten, genoemd in
      [artikel 5:1 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref2];

      d. het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref3];

      e. de daartoe door Onze Minister of Onze Minister wie het aangaat toegekende rijksbijdrage.

      3 De uitvoeringskosten van de Sociale verzekeringsbank komen ten laste van:

      a. de fondsen, bedoeld in [artikel 1, onderdelen f en g, van de Wet financiering sociale verzekeringen][ref4];

      b. het Algemeen Kinderbijslagfonds, genoemd in [artikel 29a van de Algemene Kinderbijslagwet][ref5];

      c. de daartoe door Onze Minister toegekende rijksbijdrage, die in ieder geval strekt tot financiering van subsidies
      en uitkeringen op grond van de [Kaderwet SZW-subsidies][ref6], of de daartoe door Onze Minister wie het aangaat
      toegekende rijksbijdrage.

      4 Bij ministeriële regeling worden regels gesteld omtrent de verdeling van de uitvoeringskosten over de fondsen en
      de rijksbijdragen.


