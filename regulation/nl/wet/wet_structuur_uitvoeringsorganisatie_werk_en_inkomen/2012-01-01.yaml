  - number: 30e
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen wijst een verzoek om een
      loonkostensubsidie ingevolge de [artikelen 78a van de Werkloosheidswet][ref1],
      [67f van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], [2:21][ref3]
      en [3:71 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref4],
      [65i van de Wet op de arbeidsongeschiktheidsverzekering][ref5] en
      [37a van de Wet werk en inkomen naar arbeidsvermogen][ref6] af indien er geen reëel uitzicht is op continuering van
      de betrokken dienstbetrekking of een dienstbetrekking bij een andere werkgever na beëindiging van de subsidie. Het
      Uitvoeringsinstituut werknemersverzekeringen hanteert daarbij een beoordelingskader van relevante indicatoren en
      volgt het verloop van de dienstbetrekkingen waarvoor een loonkostensubsidie is verleend tot ten minste twee maanden
      na beëindiging van de subsidie. Indien blijkt dat de toekenning van loonkostensubsidies niet in ten minste 50%
      van de beslissingen is uitgemond in een dienstbetrekking van tenminste zes maanden, stelt het Uitvoeringsinstituut
      werknemersverzekeringen het beoordelingskader bij op basis van de verworven inzichten, teneinde met de toekenningen
      in de volgende periode tenminste een dergelijke uitkomst te realiseren.


