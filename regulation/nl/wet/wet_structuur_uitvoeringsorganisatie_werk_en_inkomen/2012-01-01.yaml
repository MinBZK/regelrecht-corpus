  - number: '11'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan bepaald worden dat werkzaamheden gericht op de inschakeling
      in de arbeid van werknemers en uitkeringsgerechtigden, indien zij op grond van de in [artikel 9, eerste lid][ref1],
      bedoelde wetten, niet verricht worden door het Uitvoeringsinstituut werknemersverzekeringen of de colleges van
      burgemeester en wethouders, slechts worden verricht door re-integratiebedrijven, die in het bezit zijn van een in
      het tweede lid bedoeld certificaat.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte aan een re-
      integratiebedrijf van een certificaat waaruit blijkt dat hij voldoet aan bij of krachtens deze algemene maatregel
      van bestuur gestelde kwaliteits- en deskundigheidseisen.

      3 Onze Minister dan wel een door Onze Minister op grond van [artikel 12][ref2] aangewezen instelling beslist
      op aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.

      4 Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld die in ieder geval betrekking hebben
      op:

      a. de wijze waarop de aanvraag om een certificaat moet worden gedaan en de gegevens die daarbij van de aanvrager
      worden verlangd;

      b. de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een
      afgegeven certificaat kan worden ingetrokken;

      c. de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de wijze van betaling
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
