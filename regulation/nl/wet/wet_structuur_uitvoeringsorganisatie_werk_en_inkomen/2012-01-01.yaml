  - number: '50'
    text: |-
      1 De Raad voor werk en inkomen biedt jaarlijks een jaarverslag en een jaarrekening vóór 15 maart aan Onze Minister
      aan.

      2 De Raad voor werk en inkomen legt in zijn jaarrekening rekening en verantwoording af over het
      financieel beheer. De jaarrekening wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].

      3 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de Raad voor werk en inkomen aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Bij de aanwijzing van de accountant bedingt
      de Raad voor werk en inkomen dat aan Onze Minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden
      van de accountant.

      4 De verklaring, bedoeld in het derde lid, heeft mede betrekking op de rechtmatige verkrijging en besteding van
      de middelen.

      5 De accountant voegt bij de verklaring, bedoeld in het derde lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van de Raad voor werk en inkomen voldoen aan eisen van doelmatigheid.

      6 Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.

      7 De Raad voor werk en inkomen verstrekt aan Onze Minister vóór een door deze te bepalen tijdstip tussentijds een
      verslag over de voorafgaande periode.

      8 Bij ministeriële regeling kunnen regels worden gesteld omtrent de jaarrekening, de verklaring, bedoeld in het
      derde lid, en het aan die verklaring ten grondslag liggende onderzoek, het jaarverslag en het tussentijdse verslag.

      9 Onze Minister brengt de jaarrekening en het jaarverslag van de Raad voor werk en inkomen alsmede zijn oordeel
      daaromtrent jaarlijks vóór de derde woensdag in mei ter kennis van de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
