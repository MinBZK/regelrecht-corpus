  - number: '10'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de colleges van burgemeester en wethouders dragen zorg
      voor de instandhouding van voldoende bereikbare locaties werk en inkomen, waarin zij met betrekking tot de in
      [artikel 9, eerste lid][ref1], bedoelde wetten met het oog op een geïntegreerde dienstverlening gezamenlijk
      diensten aan uitkeringsgerechtigden, werkzoekenden en werkgevers verlenen en taken uitvoeren gericht op het
      ondersteunen bij de arbeidsinschakeling en vacaturevervulling, het daarbij aanbieden van voorzieningen en het
      verstrekken van uitkeringen of het verlenen van bijstand, rekening houdend met de regionale arbeidsmarkt en het
      daarbij gezamenlijk vormgeven van de cliëntenparticipatie.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de dienstverlening in,
      de inrichting van en de cliëntenparticipatie bij de locaties werk en inkomen en kunnen werkzaamheden van het
      Uitvoeringsinstituut werknemersverzekeringen of de colleges van burgemeester en wethouders worden aangewezen die op
      één of meer locaties werk en inkomen worden verricht, waarbij een onderscheid kan worden gemaakt naar regio’s.

      3 Onze Minister kan, indien hij met betrekking tot de uitvoering van dit artikel ernstige tekortkomingen
      vaststelt, aan het Uitvoeringsinstituut werknemersverzekeringen of het college van burgemeester en wethouders een
      aanwijzing geven met betrekking tot de uitvoering van de taken op grond van dit artikel. Het Uitvoeringsinstituut
      werknemersverzekeringen of het college van burgemeester en wethouders worden in de gelegenheid gesteld de
      uitvoering in overeenstemming te brengen met de aanwijzing binnen een door Onze Minister te stellen termijn. Indien
      Onze Minister van oordeel is dat het Uitvoeringsinstituut werknemersverzekeringen of het college van burgemeester
      en wethouders na afloop van deze termijn niet aan de aanwijzing heeft voldaan, kan Onze Minister de noodzakelijke
      voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
