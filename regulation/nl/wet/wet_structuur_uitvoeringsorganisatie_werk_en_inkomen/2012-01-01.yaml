  - number: 30d
    text: |-
      1 Ten behoeve van de uitvoering van de [Wet sociale werkvoorziening][ref1] door colleges van burgemeester en
      wethouders heeft het Uitvoeringsinstituut werknemersverzekeringen tot taak:

      a. na het verrichten van een onderzoek te besluiten over de indicatie, bedoeld in [artikel 11, eerste lid][ref2],
      en de herindicatie, bedoeld in [artikel 11, tweede lid, van die wet][ref3];

      b. in het geval betrokkene tot de doelgroep van [die wet][ref4] behoort of blijft behoren aan het college van
      burgemeester en wethouders van de gemeente waar betrokkene woonachtig is te adviseren:

      1°. welke aanpassing van omstandigheden nodig is bij het verrichten van arbeid door de betrokkene; en

      2°. of betrokkene in aanmerking komt voor toepassing van [hoofdstuk 3 van die wet][ref5];

      c. in het geval betrokkene niet of niet meer tot de doelgroep van [genoemde wet][ref6] behoort aan het college
      van burgemeester en wethouders van de gemeente waar betrokkene woonachtig is te adviseren over de wijze waarop de
      mogelijkheden tot inschakeling in het arbeidsproces van betrokkene kunnen worden verbeterd, dan wel aan dat college
      van burgemeester en wethouders te adviseren over een doorgeleiding naar een voorziening voor ondersteunende en
      activerende begeleiding. In het advies over de wijze waarop de mogelijkheden tot inschakeling in het arbeidsproces
      kunnen worden verbeterd, wordt van de opvattingen van de betrokkene, desgewenst in de door deze aangegeven
      bewoordingen, en, indien het advies hiervan afwijkt, van de redenen daarvoor, melding gedaan;

      d. in de gevallen, bedoeld in [artikel 6, derde lid, van die wet][ref7] aan het college van burgemeester en
      wethouders van de gemeente waar betrokkene woonachtig is te adviseren omtrent de opzegging van de dienstbetrekking,
      bedoeld in [die wet][ref8].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het besluit, bedoeld in het eerste
      lid, waaronder de minimale en de maximale geldigheidsduur van het besluit, en over de advisering en de wijze waarop
      de indicatie en de herindicatie tot stand komt.


