  - number: '72'
    text: |-
      De Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank
      verstrekken op verzoek, kosteloos, aan Onze Minister en, in overeenstemming met Onze Minister, aan de Minister die
      belast is met aangelegenheden betreffende beleid bij de uitvoering waarvan het betrokken bestuursorgaan een taak
      heeft, alle gegevens en inlichtingen die voor de uitoefening van de taak van Onze Minister en van Onze betrokken
      Minister noodzakelijk zijn. Zij verlenen Onze Minister op verzoek toegang tot en inzage in gegevens en bescheiden
      voor zover dat voor de uitoefening van zijn taken en van Onze Minister wie het aangaat noodzakelijk is. Bij
      ministeriële regeling kunnen regels worden gesteld voor de termijn waarbinnen en de wijze waarop aan de in dit
      artikel bedoelde verplichtingen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel72
  - number: '73'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn bevoegd op verzoek uit de
      onder hun verantwoordelijkheid gevoerde administratie aan:

      a. pensioenuitvoerders als bedoeld in [artikel 1 van de Pensioenwet][ref1] en beroepspensioenfondsen als bedoeld
      in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], die pensioenregelingen respectievelijk
      beroepspensioenregelingen uitvoeren, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de
      uitvoering van die pensioenregelingen respectievelijk beroepspensioenregelingen;

      b. stichtingen die regelingen inzake vervroegd uittreden op grond van een algemeen verbindend voorschrift
      uitvoeren, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van die
      regelingen;

      c. risicofondsen of bij collectieve arbeidsovereenkomst aangewezen instellingen of collectieve voorzieningen
      voor werknemers, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van de
      statuten en reglementen van die fondsen of van die bij collectieve arbeidsovereenkomst aangewezen instellingen of
      voorzieningen, voorzover die uitvoering betrekking heeft op taken die naar hun aard gelijk zijn aan de taken, die
      bij of krachtens deze wet aan het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn
      opgedragen.

      Tot de gegevens, die bij de gegevensverstrekking, bedoeld in onderdeel a, worden verstrekt kan het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer behoren.

      2 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd op verzoek alle gegevens en inlichtingen,
      waaronder het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer, uit de onder zijn
      verantwoordelijkheid gevoerde administraties te verstrekken aan:

      a. werkgevers in de zin van de [Wet financiering sociale verzekeringen][ref3], voorzover die noodzakelijk
      zijn voor de informatieverstrekking bij de aanvraag van overeenkomsten tot verzekering van het risico van het
      betalen van loon in geval van ziekte van de werknemer dan wel van het risico van het betalen van premie voor de
      arbeidsongeschiktheidsverzekering op grond van de Wet financiering sociale verzekeringen en van de betalingen als
      gevolg van het eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van die wet][ref4];

      b. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref5] in Nederland het bedrijf van
      levensverzekeraar of schadeverzekeraar mogen uitoefenen, voorzover die noodzakelijk zijn voor de uitvoering van
      overeenkomsten met werkgevers in de zin van de [Wet financiering sociale verzekeringen][ref6] tot verzekering van
      het risico van het betalen van loon in geval van ziekte van de werknemer dan wel van het risico van het betalen
      van premie voor de arbeidsongeschiktheidsverzekering op grond van de [Wet financiering sociale verzekeringen][ref7]
      en van de betalingen als gevolg van het eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van die wet][ref8],
      indien die werkgevers daartoe machtiging hebben verleend,

      met dien verstande, dat die werkgevers bij de verwerking van persoonsgegevens van hun werknemers slechts met
      het oog op het aangaan van en de uitvoering van deze overeenkomsten die persoonsgegevens verstrekken aan de
      verzekeraars.

      3 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank verstrekken op
      verzoek uit de onder hun verantwoordelijkheid gevoerde administratie aan de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref9] die belast is met de taken, bedoeld
      in [artikel 14, eerste lid, onderdeel b, van die wet][ref10] en de arbodienst, bedoeld in de
      [Arbeidsomstandighedenwet][ref11], alle gegevens en inlichtingen, die noodzakelijk zijn voor de uitvoering van
      die taken door die persoon of die arbodienst, en het Uitvoeringsinstituut werknemersverzekeringen is bevoegd met
      het oog op de uitvoering van die taken uit eigen beweging gegevens te verstrekken, die noodzakelijk zijn voor de
      uitvoering van die taken.

      4 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank kunnen gegevens inzake de
      uitvoering van hun wettelijke taken ten behoeve van wetenschappelijk onderzoek of statistiek verzamelen en aan
      derden verstrekken. Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de gegevens en de
      derden aan wie gegevens mogen worden verstrekt.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verstrekking van
      gegevens door het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank of Onze Minister en de
      Inspectie Werk en Inkomen aan andere bestuursorganen, die noodzakelijk zijn voor de uitvoering van aan die andere
      bestuursorganen opgedragen taken, waarbij regels worden gesteld voor het door opsporingsambtenaren als bedoeld in
      [artikel 85, tweede lid][ref12], verwerken van gegevens bij de uitvoering van hun taak, die verder verwerkt worden
      door toezichthouders, en de daarvoor in rekening te brengen kosten.

      6 Onze Minister kan aan het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en
      burgemeester en wethouders van de gemeenten alle gegevens verstrekken die zij voor een goede uitvoering van hun
      wettelijke taken nodig hebben.

      7 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens op grond van het eerste, tweede en
      derde lid lid mogen worden verstrekt en welke kosten daarvoor in rekening mogen worden gebracht.

      8 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan een re-integratiebedrijf alle
      gegevens en inlichtingen die noodzakelijk zijn voor het verrichten van werkzaamheden als bedoeld in
      [artikel 30a, achtste lid][ref13], alsmede het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer van de persoon wiens inschakeling in de arbeid door het re-integratiebedrijf wordt bevorderd.

      9 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd uit de onder haar verantwoordelijkheid gevoerde
      administratie aangelegd voor de uitoefening van taken als bedoeld in [artikel 30a, tweede lid][ref14],
      [30b][ref15] en [30d][ref16], aan een re-integratiebedrijf gegevens te verstrekken die noodzakelijk
      zijn voor het verrichten van werkzaamheden door dat re-integratiebedrijf in zijn opdracht of in
      opdracht van de colleges van burgemeester en wethouders of een eigenrisicodrager als bedoeld in
      [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref17].

      10 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de gegevens die op grond van het
      achtste en negende lid worden verstrekt en de structuur en schrijfwijze van die gegevens.

      11 Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer kan bij de verwerking van
      gegevens gebruikt worden door:

      a. een re-integratiebedrijf voorzover dit noodzakelijk is voor het verrichten van werkzaamheden in opdracht
      van het Uitvoeringsinstituut werknemersverzekering als bedoeld in [artikel 30a, achtste lid][ref18], of van een
      eigenrisicodrager als bedoeld in [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref19];

      b. een verzekeraar als bedoeld in het tweede lid, onderdeel b, voorzover dit noodzakelijk is voor de
      verzekeringsovereenkomsten, genoemd in het tweede lid.


