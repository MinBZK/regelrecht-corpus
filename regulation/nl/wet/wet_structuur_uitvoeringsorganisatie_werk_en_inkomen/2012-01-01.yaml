  - number: '2'
    text: |-
      1 Er is een Uitvoeringsinstituut werknemersverzekeringen, dat belast is met de taken, bedoeld in
      [hoofdstuk 5][ref1].

      2 Het Uitvoeringsinstituut werknemersverzekeringen heeft rechtspersoonlijkheid en heeft zijn zetel op een door Onze
      Minister te bepalen plaats.

      3 Het personeel van het Uitvoeringsinstituut werknemersverzekeringen wordt in dienst genomen op arbeidsovereenkomst
      naar burgerlijk recht. De bepalingen van de [tiende titel van boek 7 van het Burgerlijk Wetboek][ref2] zijn op deze
      overeenkomst van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005290
