  - number: '62'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges
      van burgemeester en wethouders verstrekken elkaar uit eigen beweging en op verzoek, kosteloos,
      alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de taken die bij of
      krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut werknemersverzekeringen,
      de Sociale verzekeringsbank en bij of krachtens de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] of bij of krachtens
      andere wetten aan de colleges van burgemeester en wethouders zijn opgedragen, voor zover dit voorvloeit uit de
      samenwerking, bedoeld in [artikel 9][ref4]. Zij maken daarbij gebruik van het burgerservicenummer of, bij het
      ontbreken daarvan, het sociaal-fiscaalnummer van de personen op wie de gegevens betrekking hebben.

      2 Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van
      burgemeester en wethouders dragen gezamenlijk zorg voor de instandhouding van elektronische voorzieningen
      voor de verwerking van de gegevens, bedoeld in het eerste lid, voor zover dat noodzakelijk is voor de
      uitvoering van de taken die bij of krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank en bij of krachtens de [Wet werk en bijstand][ref5],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7] aan colleges van
      burgemeester en wethouders zijn opgedragen. De elektronische voorzieningen hebben mede betrekking op de verwerking
      van gegevens waarvan de verkrijging en verstrekking door de in de eerste zin genoemde bestuursorganen op grond van
      enig wettelijk voorschrift is toegestaan.

      3 Bij de gegevensverwerking voor de uitvoering van taken en werkzaamheden in de locaties werk en inkomen, bedoeld
      in [artikel 10][ref8], zijn het Uitvoeringsinstituut werknemersverzekeringen en de colleges van burgemeester en
      wethouders gezamenlijk verantwoordelijke in de zin van [Wet bescherming persoonsgegevens][ref9] voor de verwerking
      van gegevens voor de uitvoering van taken ten aanzien van dezelfde uitkeringsgerechtigde of werkzoekende.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het tweede en derde lid
      in ieder geval met betrekking tot de inrichting, het beheer en de beveiliging van de elektronische voorzieningen.


