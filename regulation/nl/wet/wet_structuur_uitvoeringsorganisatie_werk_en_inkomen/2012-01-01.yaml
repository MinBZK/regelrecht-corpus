  - number: 33c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer periodiek als bedoeld in
      [artikel 33, tweede lid, onderdeel b][ref1].

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt de werknemer tevens in de gelegenheid kennis te nemen
      van te verwachten hoogte en duur van de uitkering die door het Uitvoeringsinstituut werknemersverzekeringen wordt
      verstrekt, indien de werknemer werkloos, arbeidsongeschikt of gedeeltelijk arbeidsgeschikt zou worden.

      3 Indien de gegevens niet juist of niet volledig zijn, dient de werknemer terstond een correctieverzoek in bij het
      Uitvoeringsinstituut werknemersverzekeringen met aanduiding van de juiste gegevens.

      4 Indien de werknemer vaststelt, dat gegevens als bedoeld in het eerste lid niet zijn opgenomen in de
      polisadministratie en hij dit redelijkerwijs wel kon verwachten, dient hij terstond een correctieverzoek in bij het
      Uitvoeringsinstituut werknemersverzekeringen met aanduiding van de ontbrekende gegevens.

      5 Het Uitvoeringsinstituut werknemersverzekeringen beslist, in afwijking van
      [artikel 36, tweede lid, van de Wet bescherming persoonsgegevens][ref2], binnen zes weken over de opname,
      verbetering en aanvulling van gegevens van de werknemer naar aanleiding van een verzoek als bedoeld in het derde of
      vierde lid.

      6 Bij ministeriële regeling kunnen regels worden gesteld voor de periodiciteit van de informatie en voor de wijze
      van informatieverstrekking die voor verschillende soorten werknemers verschillend kan zijn, en in samenhang daarmee
      voor de inhoud van de informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
