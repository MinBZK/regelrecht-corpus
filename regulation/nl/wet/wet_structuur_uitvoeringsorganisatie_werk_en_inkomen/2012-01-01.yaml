      1 Onze Minister kan op verzoek een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 11, derde lid][ref1], uitoefent.

      2 Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.

      3 Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      4 De [artikelen 36][ref2], [37][ref3], en [42][ref4] van deze wet en de [artikelen 21][ref5] en
      [23 van de Kaderwet zelfstandige bestuursorganen][ref6] zijn ten aanzien van de instelling, bedoeld in het eerste
      lid, van overeenkomstige toepassing.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor:

      a. de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd;

      b. het opstellen van een verslag van werkzaamheden ten behoeve van Onze Minister.


