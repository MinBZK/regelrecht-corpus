  - number: '8'
    text: |-
      1 Er is een landelijke cliëntenraad.

      2 De landelijke cliëntenraad bestaat uit negen vertegenwoordigers van landelijke cliëntenorganisaties, drie
      afgevaardigden uit elk van de overleggen, bedoeld in [artikel 7, tweede lid][ref1], alsmede uit drie afgevaardigden
      uit de cliëntenparticipatie bij de gemeenten. De afgevaardigden betreffen personen of vertegenwoordigers van
      personen die als cliënt betrokken zijn bij de uitvoering van de taken van het desbetreffende bestuursorgaan.

      3 De landelijke cliëntenraad heeft tot taak periodiek, doch ten minste eenmaal per jaar, te overleggen met:

      a. het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, de gemeenten en Onze Minister
      over de vormgeving en realisatie van cliëntenparticipatie bij de desbetreffende organen;

      b. de Raad voor werk en inkomen en Onze Minister over voorstellen van de landelijke cliëntenraad inzake
      beleidsvragen op het gebied van werk en inkomen.

      4 De landelijke cliëntenraad heeft een secretariaat en vervult zijn taak met de middelen die hem door Onze Minister
      ter beschikking worden gesteld.

      5 De landelijke cliëntenraad krijgt alle informatie van de in het derde lid genoemde instanties, voor zover hij
      deze voor de uitoefening van zijn taak nodig heeft.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de financiering, de werkwijze en de ondersteuning van
      de landelijke cliëntenraad en de rol van de Raad voor werk en inkomen daarbij.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel8
