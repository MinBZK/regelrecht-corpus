  - number: 30b
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen registreert op diens verzoek als werkzoekende:

      a. Nederlanders;

      b. vreemdelingen op wie artikel 1 of artikel 10 van Verordening (EEG) nr. 1612/68 van de Raad van de Europese
      Gemeenschappen van 15 oktober 1968 betreffende het vrij verkeer van werknemers binnen de Gemeenschap (PbEG 1968, L
      257) van toepassing is;

      c. vreemdelingen die beschikken over een krachtens de [Vreemdelingenwet 2000][ref1] afgegeven vergunning die is
      voorzien van een aantekening van Onze Minister voor Immigratie en Asiel waaruit blijkt dat aan die vergunning geen
      beperkingen zijn verbonden voor het verrichten van arbeid;

      d. vreemdelingen die behoren tot een bij algemene maatregel van bestuur aangewezen categorie.

      2 Aan geregistreerde werkzoekenden wordt kosteloos een bewijs van registratie verstrekt.

      3 Het Uitvoeringsinstituut werknemersverzekeringen regelt de termijnen gedurende welke de registratie ten hoogste
      wordt gehandhaafd en waarmee de registratie telkenmale, op verzoek van de betrokkene, ten hoogste kan worden
      verlengd.

      4 De registratie van een werkzoekende wordt beëindigd:

      a. op verzoek van de betrokkene;

      b. indien een termijn als bedoeld in het derde lid is verstreken zonder dat de betrokkene een verzoek tot
      verlenging van de termijn heeft gedaan.

      5 Iedere werkgever heeft het recht bij het Uitvoeringsinstituut werknemersverzekeringen vacatures te laten
      registreren. Het Uitvoeringsinstituut werknemersverzekeringen stelt regels met betrekking tot deze registratie.

      6 Het Uitvoeringsinstituut werknemersverzekeringen neemt in de in dit artikel bedoelde registratie het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de geregistreerde werkzoekende op.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel30b
