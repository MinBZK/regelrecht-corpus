  - number: 83i
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer, bedoeld in de [Werkloosheidswet][ref1],
      van wie door het Uitvoeringsinstituut werknemersverzekeringen gegevens zijn verwerkt op grond van
      deze wet, over het tijdvak vanaf 1 januari 1998 op de wijze, bedoeld in [artikel 33c][ref2], over
      ieder kalenderjaar in dat tijdvak of hij over 52 of meer dagen loon heeft ontvangen als bedoeld in
      [artikel 42 van de Werkloosheidswet][ref3] en [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref4],
      dan wel [artikel 42a van de Werkloosheidswet][ref5] in een kalenderjaar van toepassing is.


