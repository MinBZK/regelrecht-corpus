      1 Het Uitvoeringsinstituut werknemersverzekeringen legt ten aanzien van de werknemer, bedoeld in de
      [Werkloosheidswet][ref1] en de [Wet inkomen naar arbeidsvermogen][ref2], van wie door het Uitvoeringsinstituut
      werknemersverzekeringen gegevens worden verwerkt op grond van deze wetten, gegevens vast waarbij is aangegeven
      of hij in een kalenderjaar over 52 of meer dagen loon heeft ontvangen als bedoeld in [artikel 42][ref3]
      of [42a van de Werkloosheidswet][ref4] en [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref5].

      2 Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer op de wijze, bedoeld in
      [artikel 33c][ref6], over deze arbeidsverledengegevens.


