  - number: 32b
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan in het belang van de arbeidsintegratie
      van personen met een structurele functionele beperking ten laste van de fondsen, bedoeld in
      [hoofdstuk 7 van de Wet financiering sociale verzekeringen][ref1], onderscheidenlijk, wanneer deze
      personen jonggehandicapten betreffen, het Arbeidsondersteuningsfonds jonggehandicapten, bedoeld in
      [artikel 5:1 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref2], subsidie verstrekken aan
      instellingen of organisaties met het oog op onderzoek naar en het bevorderen van maatregelen, die strekken tot
      behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk7
