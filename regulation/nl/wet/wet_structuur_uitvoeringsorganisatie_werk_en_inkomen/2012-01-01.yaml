      1 Er is een Sociale verzekeringsbank, die belast is met de taken, bedoeld in [hoofdstuk 6][ref1].

      2 De Sociale verzekeringsbank heeft rechtspersoonlijkheid en heeft haar zetel op een door Onze Minister te bepalen
      plaats.

      3 Het personeel van de Sociale verzekeringsbank wordt in dienst genomen op arbeidsovereenkomst naar burgerlijk
      recht. De bepalingen van de [tiende titel van boek 7 van het Burgerlijk Wetboek][ref2] zijn op deze overeenkomst
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005290
