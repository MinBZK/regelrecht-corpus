preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de organisatie van de uitvoering van de taken van de
    overheid met betrekking tot de arbeidsvoorziening en de uitvoering van de werknemersverzekeringen te wijzigen,
    zulks mede ter bevordering van de inschakeling van werkzoekenden in het arbeidsproces, en daartoe – onder
    intrekking van de Arbeidsvoorzieningswet 1996 en de Organisatiewet sociale verzekeringen 1997 – één nieuwe wet vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Raad voor werk en inkomen: de Raad voor werk en inkomen, genoemd in [hoofdstuk 3][ref1];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5][ref2];

      d. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6][ref3];

      e. Inspectie Werk en Inkomen: de Inspectie Werk en Inkomen, genoemd in [hoofdstuk 7][ref4];

      f. Raad van bestuur: een Raad van bestuur als bedoeld in [artikel 3][ref5];

      g. uitvoeringskosten: de kosten ten behoeve van de uitvoering van wetten door de Raad voor werk en inkomen,
      de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank;

      h. sociaal-fiscaalnummer: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel k, van de Algemene wet inzake rijksbelastingen][ref6];

      i. werknemersverzekeringen: de verplichte verzekeringen op grond van de [Werkloosheidswet][ref7],
      de [Ziektewet][ref8], de [Wet werk en inkomen naar arbeidsvermogen][ref9] en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10];

      j. volksverzekeringen: de verzekeringen op grond van de [Algemene Ouderdomswet][ref11],
      de [Algemene nabestaandenwet][ref12], de [Algemene Kinderbijslagwet][ref13] en de
      [Algemene Wet Bijzondere Ziektekosten][ref14];

      k. werknemer: werknemer in de zin van de werknemersverzekeringen of een werknemer, artiest, beroepssporter,
      lid van een buitenlands gezelschap of een aangewezen andere natuurlijke persoon als bedoeld in
      [artikel 1 van de Wet op de loonbelasting 1964][ref15];

      l. uitkeringsgerechtigde: de persoon die een uitkering of voorziening ontvangt of recht heeft op
      arbeidsondersteuning op grond van:

      1°. de [Wet werk en bijstand][ref16], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref17], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref18], of

      2°. de [Werkloosheidswet][ref19], de [Wet inkomensvoorziening oudere werklozen][ref20], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref21], de [Ziektewet][ref22], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref23], de [Wet werk en inkomen naar arbeidsvermogen][ref24],
      de[ Toeslagenwet][ref25], de [Algemene Ouderdomswet][ref26], de [Algemene nabestaandenwet][ref27], de
      [Algemene Kinderbijslagwet][ref28], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref29] of, de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref30];

      m. het Inlichtingenbureau: de als zodanig door Onze Minister aangewezen instelling die is belast met de coördinatie
      en dienstverlening ten behoeve van de gemeenten bij de verwerking van gegevens, voor zover dit noodzakelijk is voor
      de uitvoering van taken op het gebied van sociale zekerheid;

      n. doeltreffendheid: de mate waarin de doelstellingen van de bij of krachtens de wet gestelde regels werden
      bereikt;

      o. re-integratiebedrijf: een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van
      beroep of bedrijf de inschakeling van personen in de arbeid bevordert;

      p. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref31];

      q. vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf
      of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref32].


