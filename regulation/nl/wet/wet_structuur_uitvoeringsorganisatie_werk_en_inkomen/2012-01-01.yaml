  - number: '86'
    text: |-
      1 Onze Minister zendt gedurende drie jaar na de inwerkingtreding van deze wet jaarlijks, en vervolgens telkens na
      vijf jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Onze Minister zendt twee jaar na de inwerkingtreding van de Wet eenmalige gegevensuitvraag werk en inkomen en
      vervolgens telkens als onderdeel van het verslag, bedoeld in het eerste lid, aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten in de praktijk van de onderdelen van deze wet en andere wetten, die bij die
      wet zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel86
  - number: '87'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.

      2 Indien het bij koninklijke boodschap van 2 maart 2000 ingediende voorstel van een [Tijdelijke referendumwet][ref1]
      (Kamerstukken II 1999/2000, 27 034) tot wet wordt verheven en in werking treedt, en deze wet wordt bekrachtigd
      op of na het tijdstip van inwerkingtreding van de [Tijdelijke referendumwet][ref2], kan bij de toepassing van het
      eerste lid worden afgeweken van de [artikelen 12][ref3] en [13 van de Tijdelijke referendumwet][ref4] en vindt in
      dat geval [artikel 16 van laatstgenoemde wet][ref5] toepassing.


