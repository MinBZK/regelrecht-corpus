    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank hebben elk een Raad van bestuur
      die met de dagelijkse leiding is belast.

      2 Een Raad van bestuur bestaat uit een door Onze Minister te bepalen aantal leden, onder wie de voorzitter.

      3 Onze Minister bepaalt de periode van benoeming van de leden van een Raad van bestuur en kan ook de mogelijkheid
      van hun herbenoeming regelen.

      4 Onze Minister stelt de rechtspositie van de leden van de Raad van bestuur vast.

      5 De Raad van bestuur oefent de taken en bevoegdheden uit die bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn opgedragen.

      6 Een Raad van bestuur stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen elk een regeling vast die
      gericht is op de realisatie en vormgeving van adequate cliëntenparticipatie op centraal niveau bij de uitvoering
      van hun wettelijke taken. Het Uitvoeringsinstituut werknemersverzekeringen regelt, na overleg met de personen
      en vertegenwoordigers, bedoeld in het tweede lid, in deze regeling tevens de cliëntenparticipatie op decentraal
      niveau.

      2 In de regeling, bedoeld in het eerste lid, wordt op het centrale niveau voorzien in overleg met personen of
      vertegenwoordigers van personen die als cliënt betrokken zijn bij de uitvoering van de taken van de in het eerste
      lid genoemde bestuursorganen. Dit overleg vindt periodiek plaats, doch ten minste twee maal per jaar.

      3 In de regeling, bedoeld in het eerste lid, wordt in ieder geval geregeld de wijze waarop de in het tweede lid
      bedoelde personen of vertegenwoordigers:

      a. onderwerpen voor de agenda van het overleg, bedoeld in het tweede lid, kunnen aanmelden;

      b. voorzien worden van de voor een adequate deelname aan het overleg benodigde informatie;

      c. betrokken worden bij de totstandkoming van de planning, begroting en verslaglegging, bedoeld in
      [hoofdstuk 8][ref1];

      d. gevraagd en ongevraagd kunnen adviseren over de uitvoering van de wettelijke taken van het betrokken
      bestuursorgaan;

      e. in staat gesteld worden op een adequate manier aan het overleg deel te nemen, waarbij ten minste aandacht
      besteed wordt aan logistieke faciliteiten, onkostenvergoedingen en deskundigheidsbevordering;

      f. beschermd worden tegen benadeling in verband met hun deelname aan het overleg.

      4 Het Uitvoeringsinstituut werknemersverzekeringen regelt in de regeling, bedoeld in het eerste lid, in het kader
      van de cliëntenparticipatie op decentraal niveau in ieder geval de wijze waarop:

      a. personen en vertegenwoordigers van personen die als cliënt betrokken zijn bij de decentrale uitvoering van de
      taken van de in het eerste lid genoemde bestuursorganen, hierop invloed kunnen uitoefenen;

      b. door het Uitvoeringsinstituut werknemersverzekeringen op centraal niveau rekening wordt gehouden met de
      resultaten van cliëntenparticipatie op decentraal niveau.

      5 Indien de regeling, bedoeld in het eerste lid, voorziet in overleg op decentraal niveau, zijn het tweede en derde
      lid ten aanzien van dit overleg van overeenkomstige toepassing.

      6 In iedere vestiging wordt bekendheid gegeven aan de wijze waarop door het Uitvoeringsinstituut
      werknemersverzekeringen of de Sociale verzekeringsbank uitvoering wordt gegeven aan dit artikel.

      7 Bij of krachtens algemene maatregel van bestuur kunnen andere onderwerpen worden aangewezen die in elk geval in
      de regeling, bedoeld in het eerste lid, worden geregeld en kunnen nadere regels worden gesteld met betrekking tot
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel7
