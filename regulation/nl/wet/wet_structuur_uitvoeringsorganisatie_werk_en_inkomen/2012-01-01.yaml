  - number: '30'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak uitvoering te geven aan de
      wettelijke arbeidsongeschiktheidsverzekeringen, de wettelijke ziekengeldverzekering, de wettelijke
      werkloosheidsverzekering, de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref2], de [Toeslagenwet][ref3], de
      [Wet inkomensvoorziening oudere werklozen][ref4], alsmede aan wetten die de uitvoering van deze wetten beheersen,
      voor zover die uitvoering niet bij of krachtens enige wet aan anderen is opgedragen.

      2 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak het beheren en administreren van de fondsen,
      bedoeld in [artikel 1, onderdelen j tot en met m en w, van de Wet financiering sociale verzekeringen][ref5],
      het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref6], en het Arbeidsondersteuningsfonds
      jonggehandicapten, genoemd in [artikel 5:1 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref7] en het
      voeren van een adequate administratie ten behoeve van de uitoefening van zijn taken.

      3 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan Onze Minister op zijn verzoek de inlichtingen die
      nodig zijn voor de beoordeling van de uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voor zover
      deze betrekking hebben op onderwerpen als bedoeld in dit hoofdstuk.

      4 Het Uitvoeringsinstituut werknemersverzekeringen verricht in opdracht van Onze Minister of uit eigen beweging
      onderzoek met betrekking tot de wettelijke taken van dit instituut en verzamelt en analyseert informatie ten
      behoeve van de bevordering van de werking van en het inzicht in de arbeidsmarkt.

      5 Het Uitvoeringsinstituut werknemersverzekeringen verricht diensten voor gegevensverkeer met het buitenland,
      waarbij het Uitvoeringsinstituut werknemersverzekeringen en de hierna genoemde bestuursorganen de omvang van die
      diensten nader kunnen overeenkomen of voor zover dit voortvloeit uit internationaalrechtelijke voorschriften:

      a. ten behoeve van een rechtmatige uitvoering van bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank opgedragen taken;

      b. ten behoeve van een rechtmatige uitvoering van aan de colleges van burgemeester
      en wethouders opgedragen taken bij of krachtens de [Wet werk en bijstand][ref8], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10];

      c. ten behoeve van Onze Minister met het oog op het toezicht op de naleving van wetten.

      6 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan Onze Minister op zijn verzoek
      inlichtingen die nodig zijn voor de beoordeling van een verzoek om ontheffing als bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref11].


