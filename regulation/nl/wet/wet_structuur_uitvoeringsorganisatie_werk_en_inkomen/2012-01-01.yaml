  - number: '46'
    text: |-
      1 De Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank
      stellen ieder elk jaar een jaarplan met begroting voor het komende kalenderjaar vast en bieden dit vóór een door
      hem vast te stellen datum aan Onze Minister aan. Een besluit tot vaststelling van het jaarplan met begroting
      behoeft de goedkeuring van Onze Minister.

      2 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen ieder elk jaar een
      meerjarenbeleidsplan vast, dat betrekking heeft op de vijf jaren inclusief het jaar waarop het in het eerste lid
      bedoelde jaarplan betrekking heeft, en bieden dit vóór een door hem vast te stellen datum aan Onze Minister aan.

      3 Bij ministeriële regeling worden regels gesteld omtrent de inhoud en de indiening van het jaarplan met begroting
      en van het meerjarenbeleidsplan. Ten aanzien van het Uitvoeringsinstituut werknemersverzekeringen hebben deze
      regels in ieder geval betrekking op de dienstverlening.

      4 Onze Minister brengt de in het eerste en tweede lid bedoelde plannen alsmede zijn oordeel over die plannen
      jaarlijks ter kennis van de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel46
  - number: '47'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de Raad voor werk en inkomen
      behoeven, tenzij het desbetreffende besluit in het door Onze Minister goedgekeurde jaarplan met begroting is
      opgenomen, de voorafgaande instemming van Onze Minister voor een besluit tot:

      a. het oprichten dan wel deelnemen in een rechtspersoon;

      b. het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;

      c. het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of
      tot huur, verhuur of pacht daarvan;

      d. het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;

      e. het aangaan van overeenkomsten waarbij de betrokken rechtspersoon zich verbindt tot zekerheidstelling met
      inbegrip van zekerheidstelling voor schulden van derden of waarbij deze zich als borg of hoofdelijk medeschuldenaar
      verbindt of zich voor een derde sterk maakt;

      f. het vormen van fondsen en reserveringen;

      g. het doen van aangifte tot faillissement of het aanvragen van surséance van betaling van de betrokken
      rechtspersoon.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid, waarin in ieder geval
      kan worden bepaald, dat ten aanzien van de situaties, bedoeld in het eerste lid, onderdelen b tot en met f, beneden
      een bepaald bedrag de voorafgaande instemming van Onze Minister niet is vereist.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel47
  - number: '48'
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december het budget voor de uitvoeringskosten van de Raad voor werk en
      inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor het eerstvolgende
      kalenderjaar vast.

      2 Onze Minister kan besluiten het budget voor de uitvoeringskosten van de Raad voor werk en inkomen, het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank te wijzigen.

      3 De Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank
      gaan met betrekking tot de uitvoering van verzekeringen en wetten geen verplichtingen aan en doen geen uitgaven die
      leiden tot overschrijden van het voor hen vastgestelde budget voor de uitvoeringskosten.

      4 Wanneer het budget voor de uitvoeringskosten van de in het eerste lid genoemde rechtspersonen niet is vastgesteld
      vóór 1 januari van het kalenderjaar waarop de begroting betrekking heeft, zijn deze rechtspersonen bevoegd,
      teneinde hun activiteiten gaande te houden, te beschikken over ten hoogste een derde gedeelte van het budget dat
      laatstelijk voor hen voor een geheel jaar is vastgesteld.

      5 Onze Minister kan besluiten dat een in het tweede lid genoemde rechtspersoon, in een geval als bedoeld in het
      vierde lid, kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor deze rechtspersoon
      voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel48
  - number: '49'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank bieden jaarlijks een jaarverslag
      en een jaarrekening vóór 15 maart aan Onze Minister aan.

      2 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen tussentijdse verslagen op
      en bieden deze op een bij ministeriële regeling te bepalen tijdstip aan Onze Minister aan.

      3 Indien het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank accountants in dienst
      hebben aangesteld, is:

      a. het bepaalde bij en krachtens de [artikelen 25][ref1] en [27 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op deze accountants;

      b. het bepaalde bij en krachtens de [artikelen 14][ref3], [18][ref4], [19][ref5], [20][ref6] en
      [21 van de Wet toezicht accountantsorganisaties][ref7] van overeenkomstige toepassing op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank;

      c. het bepaalde bij en krachtens de [artikelen 15][ref8] en [16 van de Wet toezicht accountantsorganisaties][ref9]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank waarbij de in de aanhef bedoelde
      accountants werkzaam zijn.

      4 Onze Minister brengt de jaarrekeningen en jaarverslagen van het Uitvoeringsinstituut werknemersverzekeringen en
      de Sociale verzekeringsbank alsmede zijn oordeel daaromtrent jaarlijks vóór de derde woensdag in mei ter kennis van
      de beide Kamers der Staten-Generaal.

      5 Bij ministeriële regeling worden nadere regels gesteld over het jaarverslag, de jaarrekening, de
      accountantscontrole, de accountantsverklaring en het aan die verklaring ten grondslag liggende onderzoek en de
      tussentijdse verslagen.


