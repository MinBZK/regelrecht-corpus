  - number: 32d
    text: |-
      1 Het uitvoeringsinstituut werknemersverzekeringen voert taken uit die bij of krachtens enige andere wet dan
      bedoeld in [artikel 30, eerste lid][ref1], aan het uitvoeringsinstituut zijn opgedragen.

      2 Bij algemene maatregel van bestuur of ministeriële regeling kunnen taken worden opgedragen aan het
      Uitvoeringsinstituut werknemersverzekeringen.

      3 Een voordracht voor een algemene maatregel van bestuur waarin taken aan het Uitvoeringsinstituut
      werknemersverzekeringen worden opgedragen wordt gedaan mede namens Onze Minister.

      4 Indien taken aan het Uitvoeringsinstituut werknemersverzekeringen worden opgedragen bij regeling van Onze
      Minister wie het aangaat, wordt deze regeling mede ondertekend door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
