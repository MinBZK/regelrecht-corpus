  - number: 83m
    text: |-
      In dit hoofdstuk wordt verstaan onder Centrale organisatie werk en inkomen: de Centrale organisatie werk en
      inkomen, genoemd in [hoofdstuk 4][ref1] van deze wet, zoals deze luidde op 31 december 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83m
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 83n
    text: |-
      1 Alle vermogensbestanddelen van de Centrale organisatie werk en inkomen gaan over op het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.

      2 Met betrekking tot de ingevolge het eerste lid overgaande vermogensbestanddelen die in openbare registers
      te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders
      van die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.

      3 Ter zake van de in het eerste lid bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.

      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in afwijking van het eerste lid
      vermogensbestanddelen van de Centrale organisatie werk en inkomen die worden toegerekend aan de uitvoering van in
      die maatregel genoemde taken of het verrichten van bepaalde diensten overgaan op bij die maatregel aan te wijzen
      rechtspersonen dan wel op de Staat. Het bepaalde in dit artikel is ten aanzien van die overgang van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83n
  - number: 83o
    text: |-
      1 De publiekrechtelijke rechten en verplichtingen van de Centrale organisatie werk en inkomen gaan over op het
      Uitvoeringsinstituut werknemersverzekeringen voor zover in deze wet niet anders is bepaald.

      2 Een besluit dat door de Centrale organisatie werk en inkomen is genomen, geldt als een besluit van het
      Uitvoeringsinstituut werknemersverzekeringen.

      3 Een tot de Centrale organisatie werk en inkomen gericht verzoek om een besluit te nemen, wordt beschouwd als te
      zijn gericht tot het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83o
  - number: 83p
    text: |-
      1 In civielrechtelijke en bestuursrechtelijke gedingen waarin de Centrale organisatie werk en inkomen partij is,
      treedt het Uitvoeringsinstituut werknemersverzekeringen in haar plaats, zonder dat daarvoor een betekening nodig is
      en met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.

      2 Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.

      3 Indien de toepassing van dit hoofdstuk tot gevolg heeft dat het Uitvoeringsinstituut werknemersverzekeringen in
      een geding zowel eiser als gedaagde is, wordt dat geding van rechtswege beëindigd.

      4 Indien de toepassing van dit hoofdstuk tot gevolg heeft dat het Uitvoeringsinstituut werknemersverzekeringen
      in een bezwaarschriftprocedure zowel de indiener van het bezwaarschrift als het bestuursorgaan dat het bestreden
      besluit heeft genomen is, wordt die bezwaarschriftprocedure van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83p
  - number: 83q
    text: |-
      1 Bij de Centrale organisatie werk en inkomen aanhangige bezwaarschriften gaan, in de stand waarin zij zich
      bevinden, over naar het Uitvoeringsinstituut werknemersverzekeringen.

      2 Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83q
  - number: 83r
    text: |-
      De rechten en verplichtingen van de Centrale organisatie werk en inkomen die voortvloeien uit de
      arbeidsovereenkomsten met zijn werknemers gaan over op het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel83r
  - number: 83s
    text: |-
      1 Goedkeuring verleend aan de Centrale organisatie werk en inkomen op grond van [artikel 13, eerste lid][ref1],
      zoals dit artikel luidde op 31 december 2008, wordt aangemerkt als goedkeuring of, indien
      [artikel 5, vierde lid][ref2], van toepassing is, als melding, van een daartoe strekkend besluit van het
      Uitvoeringsinstituut werknemersverzekeringen op grond van [artikel 5][ref3].

      2 Verplichtingen opgelegd aan de Centrale organisatie werk en inkomen op grond van [artikel 13, tweede lid][ref4],
      zoals dit artikel luidde op 31 december 2008, worden aangemerkt als verplichtingen opgelegd aan het
      Uitvoeringsinstituut werknemersverzekeringen op grond van [artikel 5][ref5].


