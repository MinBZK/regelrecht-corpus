  - number: '17'
    text: |-
      1 De Raad voor werk en inkomen heeft tot taak overleg te voeren met Onze Minister over voorstellen van deze Raad
      betreffende:

      a. het beleid met betrekking tot werk en inkomen;

      b. het arbeidsmarktbeleid;

      c. de bevordering van de kwaliteit en de transparantie van de re-integratiemarkt.

      2 De Raad voor werk en inkomen verricht op verzoek van Onze Minister of uit eigen beweging onderzoek en doet
      voorstellen met betrekking tot de in het eerste lid genoemde onderwerpen. Onze Minister wie het aangaat, kan door
      tussenkomst van Onze Minister ook een dergelijk verzoek tot de Raad voor werk en inkomen richten.

      3 De Raad voor werk en inkomen stelt een regeling op die voorziet in overleg over de in het eerste lid genoemde
      onderwerpen met personen of vertegenwoordigers van personen die als cliënt betrokken zijn bij uitvoering van die
      onderwerpen. Dit overleg vindt periodiek plaats, doch ten minste twee maal per jaar.

      4 De Raad voor werk en inkomen overlegt met de landelijke cliëntenraad, bedoeld in [artikel 8][ref1], over de wijze
      waarop het overleg, bedoeld in het derde lid, plaatsvindt.

      5 De Raad voor werk en inkomen stelt een regeling vast die voorziet in overleg met het Uitvoeringsinstituut
      werknemersverzekeringen over de in het eerste lid genoemde onderwerpen. Dit overleg vindt periodiek plaats, doch
      ten minste twee maal per jaar.

      6 De Raad voor werk en inkomen overlegt met het Uitvoeringsinstituut werknemersverzekeringen over de wijze waarop
      het overleg, bedoeld in het vijfde lid, plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel8
