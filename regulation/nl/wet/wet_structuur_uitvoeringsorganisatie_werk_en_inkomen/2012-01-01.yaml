  - number: 34a
    text: |-
      1 Bij algemene maatregel van bestuur of bij ministeriële regeling kunnen taken worden opgedragen aan de Sociale
      verzekeringsbank.

      2 Een voordracht voor een algemene maatregel van bestuur waarin taken aan de Sociale verzekeringsbank worden
      opgedragen, wordt gedaan mede namens Onze Minister.

      3 Indien taken aan de Sociale verzekeringsbank worden opgedragen bij regeling van Onze Minister wie het aangaat,
      wordt deze regeling mede ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2012-01-01#Artikel34a
  - number: '35'
    text: |-
      1 De Sociale verzekeringsbank is de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1]
      voor de verwerking van gegevens over verzekerden en uitkeringsgerechtigden in de zin van de volksverzekeringen en
      over bij de verzekerden behorende personen in de verzekerdenadministratie.

      2 De verwerking van gegevens in de verzekerdenadministratie heeft tot doel:

      a. van verzekerden, pensioengerechtigden, nabestaanden en andere uitkeringsgerechtigden gegevens te verwerken
      noodzakelijk voor de uitvoering van de wetten, genoemd in [artikel 34, eerste lid, onderdeel a][ref2];

      b. van kinderen van verzekerden gegevens te verwerken noodzakelijk voor de uitvoering van de
      [Algemene Kinderbijslagwet][ref3];

      c. van de echtgenoot, kinderen of huisgenoten van de verzekerde en pensioengerechtigde gegevens te verwerken
      noodzakelijk voor de uitvoering van de [Algemene nabestaandenwet][ref4] en de [Algemene Ouderdomswet][ref5];

      d. van andere personen gegevens te verwerken noodzakelijk voor de uitvoering van taken als bedoeld in
      [artikel 34, eerste lid, onderdeel d][ref6];

      e. gegevens vast te leggen over verzekerde en niet verzekerde tijdvakken op grond van verplichte of vrijwillige
      verzekering voor de volksverzekeringen;

      f. gegevens te verwerken om te voldoen aan verplichtingen van de Sociale verzekeringsbank op grond van
      internationaalrechtelijke voorschriften.

      3 Voorzover de Sociale verzekeringsbank geen verantwoordelijke is in de zin van de
      [Wet bescherming persoonsgegevens][ref7] is de Sociale verzekeringsbank bewerker in de zin van die wet voor de
      verwerking van gegevens ter uitvoering van de taak, bedoeld in [artikel 34, tweede en derde lid][ref8].

      4 De Sociale verzekeringsbank verstrekt Onze Minister en bestuursorganen als bedoeld in de [artikelen 62][ref9],
      [72][ref10] en [73, vijfde lid][ref11], gegevens als bedoeld in het tweede lid die verwerkt worden in de
      verzekerdenadministratie, voorzover deze gegevens niet verwerkt worden in de polisadministratie, bedoeld in
      [artikel 33][ref12], en verstrekt het Uitvoeringsinstituut werknemersverzekeringen alle gegevens, die noodzakelijk
      zijn voor verwerking van gegevens in de polisadministratie.

      5 De gegevens, die door de Sociale verzekeringsbank worden verwerkt worden niet verkregen van de in het tweede lid
      genoemde personen, voorzover zij verkregen kunnen worden uit de gemeentelijke basisadministratie persoonsgegevens
      of de polisadministratie, bedoeld in [artikel 33][ref13], tenzij hierdoor een goede vervulling van de taak van
      de Sociale verzekeringsbank op grond van dit artikel wordt belet of bij wettelijk voorschrift anders is bepaald.
      Bij of krachtens algemene maatregel van bestuur kunnen andere administraties worden aangewezen waarvoor de eerste
      zin van toepassing is, worden regels gesteld over de gegevens die het betreft en kunnen administraties worden
      aangewezen waarvoor de eerste zin tijdelijk niet van toepassing is. Indien het authentieke gegevens uit andere
      basisregistraties betreft, is dit lid van overeenkomstige toepassing.

      6 De Sociale verzekeringsbank gebruikt het burgerservicenummer of, bij het ontbreken daarvan,
      het sociaal-fiscaalnummer bij de verwerking van persoonsgegevens als bedoeld in dit artikel.
      [Artikel 33b, tweede en derde lid][ref14], is van overeenkomstige toepassing.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de
      inrichting en de gegevensset van de verzekerdenadministratie. Tevens worden regels gesteld over het elektronische
      gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de gegevensverstrekking
      uit de verzekerdenadministratie worden gesteld.

      8 De voordracht voor een krachtens het vijfde lid, tweede zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


