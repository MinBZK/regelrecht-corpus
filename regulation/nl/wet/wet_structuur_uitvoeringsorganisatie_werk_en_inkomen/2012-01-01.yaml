  - number: '5'
    text: |-
      1 Een besluit van het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank om andere
      werkzaamheden te verrichten dan de uitvoering van de in [hoofdstuk 5][ref1] of [6][ref2] bedoelde taken behoeft de
      goedkeuring van Onze Minister.

      2 De goedkeuring kan, onverminderd [artikel 79][ref3], worden onthouden op de grond dat de uitvoering van de
      andere werkzaamheden door het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank een goede
      taakuitoefening door het bestuursorgaan kan belemmeren.

      3 Onze Minister kan bij de goedkeuring verplichtingen opleggen in verband met de uitvoering van andere
      werkzaamheden als bedoeld in het eerste lid.

      4 Het eerste lid is niet van toepassing op een besluit van het Uitvoeringsinstituut werknemersverzekeringen of de
      Sociale verzekeringsbank om in het kader van de samenwerking, bedoeld in [artikel 9][ref4], werkzaamheden uit te
      voeren voor elkaar of voor de colleges van burgemeester en wethouders, indien het de uitvoering van werkzaamheden
      op grond van de in [artikel 9, eerste lid][ref5], bedoelde wetten betreft, respectievelijk elkaar bij te staan
      bij de uitvoering van taken, mits het Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale
      verzekeringsbank, dit binnen een redelijke termijn meldt bij Onze Minister.

      5 Onze Minister kan bepalen dat de uitvoering van andere werkzaamheden als bedoeld in het eerste lid en de
      uitvoering van werkzaamheden als bedoeld in het vierde lid door het betrokken bestuursorgaan wordt beëindigd.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over dit artikel.


