  - number: '85'
    text: |-
      1 Met de opsporing van feiten die zijn strafbaar gesteld bij of krachtens deze wet dan wel bij of
      krachtens wetten waarvan de uitvoering bij of krachtens deze wet is opgedragen aan het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank alsmede, voorzover het feit voor de toepassing van
      deze wet, onderscheidenlijk de andere hiervoor genoemde wetten, van belang is, van de feiten omschreven in de
      [artikelen 225 tot en met 227b][ref1], [447b][ref2], [447c][ref3] en [447d van het Wetboek van Strafrecht][ref4]
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref5], belast de personen, aangewezen bij
      besluit van Onze Minister van Veiligheid en Justitie. Deze personen zijn tevens belast met de opsporing van
      feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref6] en [184 van het Wetboek van Strafrecht][ref7],
      voorzover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Met de opsporing van feiten strafbaar gesteld bij deze of enige andere wet zijn tevens belast bij besluit
      van Onze Minister van Veiligheid en Justitie aangewezen opsporingsambtenaren werkzaam bij de bijzondere
      opsporingsdienst, ressorterend onder Onze Minister.

      3 De in het eerste en tweede lid bedoelde personen hebben toegang tot alle plaatsen, indien de betreding van die
      plaatsen redelijkerwijs voor de vervulling van hun taak nodig is.

      4 Wordt aan de in het eerste en tweede lid bedoelde personen de toegang geweigerd of belemmerd of wordt niet
      geantwoord op hun aanmelding tot toelating, dan verschaffen zij zich toegang, desnoods met inroeping van de sterke
      arm.

      5 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


