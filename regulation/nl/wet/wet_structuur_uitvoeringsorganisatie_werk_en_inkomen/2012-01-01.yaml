  - number: '54'
    text: |-
      1 Een ieder verstrekt op verzoek aan het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank
      en Onze Minister en de Inspectie Werk en Inkomen, kosteloos, alle gegevens en inlichtingen die noodzakelijk zijn
      voor de uitvoering van bij of krachtens deze wet of enige andere wet door het desbetreffende bestuursorgaan en de
      Inspectie Werk en Inkomen uit te voeren taken ten opzichte van:

      a. de betrokken persoon zelf;

      b. de persoon in wiens dienst of voor wie hij arbeid verricht, heeft verricht of zou kunnen gaan verrichten;

      c. de persoon, die in zijn dienst of voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten.

      2 Een ieder kan uit eigen beweging de in het eerste lid bedoelde gegevens en inlichtingen aan de in het eerste lid
      bedoelde bestuursorganen en aan de Inspectie Werk en Inkomen verstrekken.

      3 Alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de in het eerste lid bedoelde taken
      worden aan de in dat lid genoemde bestuursorganen en aan de Inspectie Werk en Inkomen op verzoek, kosteloos, tevens
      verstrekt door:

      a. de colleges van burgemeester en wethouders;

      b. de rijksbelastingdienst;

      c. de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met
      de taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] en de arbodienst, bedoeld in de
      [Arbeidsomstandighedenwet][ref3];

      d. het College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref4], de
      zorgverzekeraars, bedoeld in de [Zorgverzekeringswet][ref5] of de [Algemene Wet Bijzondere Ziektekosten][ref6];

      e. de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen, stichtingen tot uitvoering van een
      regeling inzake vervroegd uittreden, en andere organen belast met het doen van uitkeringen of verstrekkingen die
      bij of krachtens [artikel 6 van de Toeslagenwet][ref7] als inkomen worden aangemerkt;

      f. de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref8] vastgestelde vergoeding;

      g. de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref9];

      h. Onze Minister van Veiligheid en Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel;

      i. de door Onze Minister aangewezen ambtenaren als bedoeld in [artikel 14 van de Wet arbeid vreemdelingen][ref10]
      en [artikel 24 van de Arbeidsomstandighedenwet][ref11];

      j. griffiers van colleges, geheel of ten dele met rechtspraak belast, desgevraagd in de vorm van uittreksels uit of
      afschriften van uitspraken, registers en andere stukken;

      k. Onze Minister van Onderwijs, Cultuur en Wetenschap, dan wel, voor zover het betreft het onderwijs of onderzoek
      op het gebied van de landbouw en de natuurlijke omgeving, Onze Minister van Economische Zaken, Landbouw en
      Innovatie;

      l. het Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in de
      [Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref12];

      m. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor zover het betreft de uitvoering van de
      [Wet inburgering][ref13].

      4 De in het eerste en derde lid bedoelde gegevens en inlichtingen worden op verzoek, binnen de daarbij gestelde
      termijn, verstrekt in schriftelijke vorm of in een andere vorm die redelijkerwijs kan worden verlangd.

      5 Degene op wie de in het eerste en derde lid bedoelde verplichting rust geeft op verzoek aan een bestuursorgaan
      als bedoeld in het eerste lid, alsmede aan de Inspectie Werk en Inkomen inzage in alle bescheiden en andere
      gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de ter zake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van de in het eerste lid bedoelde taken
      door het in dat lid bedoelde bestuursorgaan en de Inspectie Werk en Inkomen.

      6 Onze Minister verstrekt aan de Raad voor werk en inkomen gegevens en inlichtingen die deze raad nodig heeft voor
      de uitoefening van zijn taak.

      7 Bij ministeriële regeling worden regels gesteld omtrent de verstrekking door het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van burgemeester en wethouders aan de Raad voor
      werk en inkomen van gegevens en inlichtingen die deze raad nodig heeft voor de uitoefening van zijn taak.

      8 Onze Minister van Veiligheid en Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, onverwijld en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van
      invloed kunnen zijn op het recht op uitkering, aan de Sociale verzekeringsbank en het Uitvoeringsinstituut
      werknemersverzekeringen, waarbij hij gebruik kan maken van het burgerservicenummer of, bij het ontbreken daarvan,
      het sociaal-fiscaalnummer.

      9 Re-integratiebedrijven verstrekken aan het Uitvoeringsinstituut werknemersverzekeringen alle opgaven en
      inlichtingen die noodzakelijk zijn voor de uitvoering van de krachtens deze wet aan het Uitvoeringsinstituut
      opgedragen taken. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de gegevens die
      worden verstrekt.

      10 Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het derde lid worden aangewezen
      voor wie de verplichtingen, bedoeld in het derde, vierde en vijfde lid, eveneens gelden, voor zover het betreft de
      verstrekking van nader bij algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen, waarbij bepaald
      kan worden, dat gegevens, die verwerkt worden door Onze Minister of Onze Minister, wie het aangaat, aangewezen
      toezichthouders, verstrekt worden aan opsporingsambtenaren als bedoeld in [artikel 85, tweede lid][ref14].


