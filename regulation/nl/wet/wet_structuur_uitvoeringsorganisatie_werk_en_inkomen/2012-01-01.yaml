  - number: 83l
    text: |-
      [Artikel 30a][ref1] is niet van toepassing met betrekking tot de uitkeringsgerechtigde wiens recht op uitkering
      op grond van de in [dat artikel][ref2] genoemde wetten voor de dag van inwerkingtreding van [dat artikel][ref3]
      is ontstaan.


