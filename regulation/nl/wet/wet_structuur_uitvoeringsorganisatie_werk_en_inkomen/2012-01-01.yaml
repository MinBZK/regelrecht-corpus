  - number: '9'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van burgemeester
      en wethouders werken samen bij de uitvoering van taken op grond van deze wet, de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] met het oog op een
      doeltreffende en klantgerichte uitoefening van die taken.

      2 De bestuursorganen, bedoeld in het eerste lid, werken voorts samen met andere diensten, instellingen en
      bestuursorganen die werkzaamheden verrichten die verband houden met de uitoefening van de taken, bedoeld in het
      eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vorm van de samenwerking,
      de afstemming van de samenwerking op de uitvoering van taken opgedragen bij of krachtens andere wetten dan die
      bedoeld in het eerste lid, en vergoeding van kosten.

      4 Bij algemene maatregel van bestuur worden indicatoren vastgesteld voor de taakuitoefening, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
