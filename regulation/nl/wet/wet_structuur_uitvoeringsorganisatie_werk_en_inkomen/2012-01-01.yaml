  - number: '33'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor de inrichting en adequate werking van de
      polisadministratie.

      2 De polisadministratie heeft tot doel:

      a. van de werknemer gegevens over zijn arbeidsverhouding en uitkeringsverhouding – daaronder begrepen duur, loon en
      premies werknemersverzekeringen – vast te leggen ten behoeve van de werknemersverzekeringen;

      b. besluiten over recht op uitkering of verstrekking te baseren op gegevens als bedoeld in onderdeel a met
      het oog waarop de werknemer wordt geïnformeerd over die gegevens en het al dan niet verzekerd zijn voor de
      werknemersverzekeringen;

      c. van de persoon die vrijwillig verzekerd is voor de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], [Werkloosheidswet][ref3] en
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] gegevens te verwerken waarbij de onderdelen a en b van
      overeenkomstige toepassing zijn;

      d. van de werknemer gegevens over genoten loon in de zin van de [Wet op de loonbelasting 1964][ref5], ingehouden
      loonbelasting, premie volksverzekeringen in de zin van de [Wet financiering sociale verzekeringen][ref6],
      inkomensafhankelijke bijdrage als bedoeld in de [Zorgverzekeringswet][ref7], alsmede andere gegevens van
      belang voor de heffing van de inkomstenbelasting te verwerken ten behoeve van de uitvoering van de taken van de
      rijksbelastingdienst;

      e. van de werknemer overige gegevens van belang voor statistische doeleinden op het gebied van arbeid en lonen te
      verwerken ten behoeve van het Centraal bureau voor de statistiek.

      3 Het Uitvoeringsinstituut werknemersverzekeringen is de verantwoordelijke in de zin van de
      [Wet bescherming persoonsgegevens][ref8] voorzover het betreft de verwerking van de gegevens, bedoeld in het tweede
      lid, onderdelen a, b en c, en de bewerker in de zin van de [Wet bescherming persoonsgegevens][ref9] voorzover het
      betreft de verwerking van de gegevens, bedoeld in het tweede lid, onderdelen d en e.

      4 De verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref10] voor de verwerking van de
      gegevens, bedoeld in het tweede lid, d en e, zijn respectievelijk Onze Minister van Financiën en het Centraal
      bureau voor de statistiek.

      5 De rijksbelastingdienst verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen, in het
      kader van zijn taak bedoeld in het eerste lid, alle gegevens en inlichtingen, die verkregen zijn
      bij de uitvoering van de heffing van loonbelasting en van de [artikelen 58, tweede lid][ref11], en
      [59 van de Wet financiering sociale verzekeringen][ref12], voorzover die gegevens en inlichtingen noodzakelijk zijn
      voor het verwerken van gegevens in de polisadministratie.

      6 De gemeentelijke basisadministratie persoonsgegevens wordt ter verificatie geraadpleegd voor de gegevens, die
      door het Uitvoeringsinstituut werknemersverzekeringen op grond van dit artikel worden verwerkt.

      7 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de rijksbelastingdienst alle gegevens en
      inlichtingen, die noodzakelijk zijn ten behoeve van de uitvoering van de taken van de rijksbelastingdienst.

      8 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt Onze Minister en bestuursorganen als bedoeld in de
      [artikelen 62][ref13], [72][ref14] en [73, vijfde lid][ref15], gegevens die op grond van het tweede lid verwerkt
      worden in de polisadministratie, met uitzondering van de gegevens, bedoeld in het tweede lid, onderdeel d.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de inrichting,
      de gegevensset en de wijze van verkrijging van de gegevens van de polisadministratie. Tevens worden regels gesteld
      over het elektronische gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de
      gegevensverstrekking uit de polisadministratie worden gesteld.


