  - number: 73a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank kunnen gegevens die deze hebben
      verkregen bij de uitvoering van een bij of krachtens deze of een andere wet aan hen opgedragen taak, verwerken
      voor de uitvoering van een andere wettelijke taak of voor de uitvoering van andere werkzaamheden als bedoeld in
      [artikel 5][ref1]. Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens kunnen worden
      gebruikt voor de uitvoering van andere werkzaamheden.

      2 Het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank verstrekt deze gegevens op
      verzoek aan een in de algemene maatregel van bestuur genoemde derde, indien de gegevens noodzakelijk zijn voor de
      uitvoering van werkzaamheden door die derden en deze werkzaamheden naar hun aard gelijk zijn aan de werkzaamheden,
      bedoeld in het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen tevens regels worden gesteld voor de vergoeding van kosten
      van de gegevensverstrekking, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel5
