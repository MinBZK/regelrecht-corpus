  - number: 30a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak de inschakeling in het arbeidsproces te
      bevorderen van:

      a. personen die recht hebben op een uitkering of arbeidsondersteuning op grond van wetten als bedoeld in
      [artikel 30, eerste lid][ref1];

      b. werknemers, die kunnen aantonen dat de dienstbetrekking binnen vier maanden zal eindigen en van wie naar het
      oordeel van het Uitvoeringsinstituut werknemersverzekeringen redelijkerwijs valt aan te nemen dat zij recht zullen
      hebben op een uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref2];

      c. personen die ingezetene zijn als bedoeld in
      [artikel 1:2 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3], de leeftijd van 18 jaar nog niet
      hebben bereikt en in verband met ziekte of gebrek een belemmering ondervinden of hebben ondervonden bij het volgen
      van onderwijs.

      2 Het Uitvoeringsinstituut werknemersverzekering heeft tot taak het registreren van werkzoekenden en van vacatures
      van werkgevers en het voordragen van geschikte vacatures aan werkzoekenden en het voordragen van geschikte
      werkzoekenden voor vacatures. Het Uitvoeringsinstituut werknemersverzekeringen maakt in dit kader afspraken
      met werkgevers op basis waarvan concrete, passende arbeid kan worden aangeboden aan personen, die ten minste 52
      weken onafgebroken recht op een uitkering op grond van de [Werkloosheidswet][ref4] hebben gehad. Voor het bepalen
      van het tijdvak van 52 weken is [artikel 20, achtste lid, van de Werkloosheidswet][ref5] van overeenkomstige
      toepassing. Het Uitvoeringsinstituut werknemersverzekeringen maakt in dit kader tevens afspraken met werkgevers
      op basis waarvan concrete, algemeen geaccepteerde arbeid kan worden aangeboden aan personen die recht op
      arbeidsondersteuning hebben op grond van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref6].

      3 Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in het eerste lid, niet:

      a. ten aanzien van personen, bedoeld in het eerste lid, indien het Uitvoeringsinstituut
      werknemersverzekeringen met een college van burgemeester en wethouders overeenkomen dat het college
      verantwoordelijk is voor het ondersteunen van die personen bij arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref7];

      b. ten aanzien van personen die een arbeidsongeschiktheidsuitkering ontvangen op grond van
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref8];

      c. ten aanzien van de verzekerde, bedoeld in
      [artikel 82, eerste en tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref9], tenzij de
      [artikelen 72, derde lid][ref10], of [84, tweede lid, van die wet][ref11] van toepassing zijn;

      d. indien [artikel 72a van de Werkloosheidswet][ref12] van toepassing is;

      e. ten aanzien van de werknemer, bedoeld in [artikel 29b][ref13] en [artikel 29d van de Ziektewet][ref14];

      f. ten aanzien van de jonggehandicapte die volledig en duurzaam arbeidsongeschikt is in de zin van
      [hoofdstuk 2 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref15].

      4 Nadat het recht op een uitkering op grond van wetten als bedoeld in [artikel 30, eerste lid][ref16],
      uitgezonderd de wettelijke ziekengeldverzekering en het recht op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref17], is vastgesteld, stelt het Uitvoeringsinstituut
      werknemersverzekeringen, indien gelet op de aard van de uitkering het eerste lid van toepassing is, in
      samenspraak met de uitkeringsgerechtigde een re-integratievisie vast waarin verplichtingen en rechten van de
      uitkeringsgerechtigde zijn vermeld.

      5 Het Uitvoeringsinstituut werknemersverzekeringen evalueert, in samenspraak met de uitkeringsgerechtigde,
      periodiek de re-integratievisie en kan deze bijstellen.

      6 Indien de re-integratievisie daartoe aanleiding geeft draagt het Uitvoeringsinstituut werknemersverzekeringen
      ten behoeve van de uitkeringsgerechtigde, bedoeld in het vierde lid, zorg voor een plan gericht op behoud en
      verkrijging van mogelijkheden tot het verrichten van arbeid en inschakeling in arbeid. Het re-integratieplan
      wordt in samenspraak met de uitkeringsgerechtigde opgesteld. Voor zover noodzakelijk in verband met de aard van de
      voorziening, stelt het Uitvoeringsinstituut werknemersverzekeringen de uitkeringsgerechtigde in de gelegenheid zelf
      een re-integratieplan op te stellen.

      7 In het re-integratieplan worden verplichtingen en rechten van de uitkeringsgerechtigde vermeld voor zover die
      niet in de re-integratievisie zijn vermeld.

      8 Het Uitvoeringsinstituut werknemersverzekeringen laat de werkzaamheden in het kader van zijn taak, bedoeld in
      het eerste en zesde lid, in elk geval indien het personen met een grotere afstand tot de arbeidsmarkt betreft,
      verrichten door een re-integratiebedrijf.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor het derde en achtste lid in
      ieder geval voor de situaties van samenloop van de taak, bedoeld in het eerste lid met de vergelijkbare taak van
      werkgevers of in geval van samenloop van uitkeringen, de inhoud van de overeenkomst met het re-integratiebedrijf,
      het verwerken van gegevens en de soort werkzaamheden.


