  - number: '31'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor een actueel oordeel over de kans op werk van
      iedere op grond van [artikel 30b][ref1] geregistreerde werkzoekende en onderzoekt zonodig op welke wijze die kans
      kan worden verbeterd.

      2 Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor gevraagde en ongevraagde verstrekking
      van deugdelijke informatie en advies over de arbeidsmarkt alsmede over de uitvoering van zijn taak aan
      werkgevers, werknemers, uitkeringsgerechtigden, verzekerden, werkzoekenden en andere belanghebbenden in verband
      met de uitvoering van de in [artikel 30, eerste lid][ref2], genoemde verzekeringen en wetten alsmede de in
      [artikel 30a][ref3] bedoelde taak.

      3 Het Uitvoeringsinstituut werknemersverzekeringen geeft voorlichting met betrekking tot de keuze van een beroep
      alsmede de voor een beroep benodigde opleiding.

      4 Bij ministeriële regeling kunnen regels worden gesteld betreffende de registratie van de beoordeling, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
