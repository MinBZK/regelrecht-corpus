  - number: 72a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de
      gegevensverstrekking, bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel72a
  - number: '73.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn bevoegd op verzoek uit de
      onder hun verantwoordelijkheid gevoerde administratie aan:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: 73.1.a
    text: |-
      pensioenuitvoerders als bedoeld in [artikel 1 van de Pensioenwet][ref1] en beroepspensioenfondsen als bedoeld
      in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], die pensioenregelingen respectievelijk
      beroepspensioenregelingen uitvoeren, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de
      uitvoering van die pensioenregelingen respectievelijk beroepspensioenregelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 73.1.b
    text: |-
      stichtingen die regelingen inzake vervroegd uittreden op grond van een algemeen verbindend voorschrift uitvoeren,
      alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van die regelingen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: 73.1.c
    text: |-
      financiële ondernemingen die ingevolge de Wet op het financieel toezicht in Nederland het bedrijf van
      levensverzekeraar of schadeverzekeraar mogen uitoefenen alle gegevens, en inlichtingen te verstrekken die
      noodzakelijk zijn voor de uitvoering van verzekeringen van uitkeringen ten gevolge van arbeidsongeschiktheid of
      overlijden die tussen werkgevers en werknemers zijn overeengekomen,
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: '73.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn bevoegd op verzoek uit de
      onder hun verantwoordelijkheid gevoerde administratie aan risicofondsen of bij collectieve arbeidsovereenkomst
      aangewezen instellingen die belast zijn met de uitvoering van de in de collectieve arbeidsovereenkomst
      opgenomen collectieve voorzieningen voor werknemers of instellingen die belast zijn met de uitvoering van
      de in een rechtspositieregeling opgenomen collectieve voorzieningen voor overheidswerknemers als bedoeld in
      [artikel 1, onderdeel j, van de Werkloosheidswet][ref1], alle gegevens en inlichtingen te verstrekken die
      noodzakelijk zijn voor de uitvoering van de statuten en reglementen van die fondsen of van de taken voortvloeiend
      uit de in de collectieve arbeidsovereenkomst of rechtspositieregeling opgenomen collectieve voorziening, voor zover
      die uitvoering betrekking heeft op taken die naar hun aard gelijk zijn aan de taken, die bij of krachtens deze
      wet aan het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn opgedragen. Bij de
      gegevensverwerking op grond van dit lid kan het burgerservicenummer worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: '73.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd op verzoek alle gegevens en inlichtingen uit de onder
      zijn verantwoordelijkheid gevoerde administraties te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: 73.3.a
    text: |-
      werkgevers in de zin van de [Wet financiering sociale verzekeringen][ref1], voor zover die noodzakelijk zijn
      voor de informatieverstrekking bij de aanvraag, het aangaan of beëindigen van overeenkomsten tot verzekering
      van het risico van het betalen van loon in geval van ziekte van de werknemer dan wel van het risico van
      het betalen van de gedifferentieerde premie voor de arbeidsongeschiktheidsverzekering op grond van de Wet
      financiering sociale verzekeringen en van de betalingen als gevolg van het eigenrisicodragen, bedoeld in
      [artikel 40, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 73.3.b
    text: |-
      financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      levensverzekeraar of schadeverzekeraar mogen uitoefenen, voor zover die noodzakelijk zijn voor de uitvoering
      van overeenkomsten met werkgevers in de zin van de [Wet financiering sociale verzekeringen][ref2] als bedoeld in
      onderdeel a, indien die werkgevers daartoe machtiging hebben verleend, met dien verstande, dat die werkgevers bij
      de verwerking van persoonsgegevens van hun werknemers slechts met het oog op het aangaan van en de uitvoering van
      deze overeenkomsten die persoonsgegevens verstrekken aan die financiële ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0017745
  - number: '73.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank verstrekken op
      verzoek uit de onder hun verantwoordelijkheid gevoerde administratie aan de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de taken, bedoeld in artikel 14,
      eerste lid, onderdeel b, van die wet en de arbodienst, bedoeld in de Arbeidsomstandighedenwet, alle gegevens
      en inlichtingen, waaronder het burgerservicenummer, die noodzakelijk zijn voor de uitvoering van die taken door
      die persoon of die arbodienst, en het Uitvoeringsinstituut werknemersverzekeringen is bevoegd met het oog op de
      uitvoering van die taken uit eigen beweging gegevens te verstrekken, die noodzakelijk zijn voor de uitvoering van
      die taken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '73.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens op grond van het eerste tot en
      met vierde lid worden verstrekt, en kunnen regels worden gesteld voor de wijze waarop de gegevensverstrekking
      plaatsvindt en voor de kosten die daarvoor in rekening kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: '73.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank kunnen gegevens inzake de
      uitvoering van hun wettelijke taken ten behoeve van wetenschappelijk onderzoek of statistiek verzamelen en aan
      derden verstrekken. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de gegevens
      en de derden aan wie gegevens mogen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: '73.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verstrekking van
      gegevens door het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank of Onze Minister
      aan andere bestuursorganen, die noodzakelijk zijn voor de uitvoering van aan die andere bestuursorganen
      opgedragen taken, waarbij regels worden gesteld voor het door opsporingsambtenaren als bedoeld in
      [artikel 85, tweede lid][ref1], verwerken van gegevens bij de uitvoering van hun taak, die verder verwerkt worden
      door toezichthouders, en de daarvoor in rekening te brengen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel85
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '85'
        hoofdstuk: '11'
  - number: '73.8'
    text: |-
      Onze Minister kan aan het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges
      van burgemeester en wethouders alle gegevens verstrekken die zij voor een goede uitvoering van hun wettelijke taken
      nodig hebben.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: '73.9'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan een re-integratiebedrijf alle
      gegevens en inlichtingen die noodzakelijk zijn voor het verrichten van werkzaamheden als bedoeld in
      [artikel 30a, achtste lid][ref1], alsmede het burgerservicenummer van de persoon wiens inschakeling in de arbeid
      door het re-integratiebedrijf wordt bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '73.10'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd uit de onder zijn verantwoordelijkheid gevoerde
      administratie aangelegd voor de uitoefening van taken als bedoeld in [artikel 30a, tweede lid][ref1], [30b][ref2]
      en [30d][ref3], aan een re-integratiebedrijf gegevens, waaronder het burgerservicenummer, te verstrekken
      die noodzakelijk zijn voor het verrichten van werkzaamheden door dat re-integratiebedrijf in zijn opdracht
      of in opdracht van de colleges van burgemeester en wethouders dan wel een eigenrisicodrager als bedoeld in
      [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref4] of een eigenrisicodrager in de zin van de
      [Ziektewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30b
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30d
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0001888
  - number: '73.11'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan een ondersteunende instantie de gegevens die
      noodzakelijk zijn om contact met de uitkeringsgerechtigde op te nemen ten behoeve van hulpverlening. Dit geschiedt
      uitsluitend met instemming van de uitkeringsgerechtigde.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: '73.12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de gegevens die op grond van het negende
      tot en met elfde lid worden verstrekt en de structuur en schrijfwijze van die gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73
  - number: 73a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank kunnen gegevens die deze hebben
      verkregen bij de uitvoering van een bij of krachtens deze of een andere wet aan hen opgedragen taak, verwerken
      voor de uitvoering van een andere wettelijke taak of voor de uitvoering van andere werkzaamheden als bedoeld in
      [artikel 5][ref1]. Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens kunnen worden
      gebruikt voor de uitvoering van andere werkzaamheden en kunnen regels worden gesteld voor de wijze waarop de
      gegevensverstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '5'
        hoofdstuk: '2'
  - number: 73a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank verstrekt deze gegevens op
      verzoek aan een in de algemene maatregel van bestuur genoemde derde, indien de gegevens noodzakelijk zijn voor de
      uitvoering van werkzaamheden door die derden en deze werkzaamheden naar hun aard gelijk zijn aan de werkzaamheden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73a
  - number: 73a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen tevens regels worden gesteld voor de wijze waarop de
      gegevensverstrekking plaatsvindt en de vergoeding van kosten van de gegevensverstrekking, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel73a
  - number: '74.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
  - number: '74.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
  - number: 74.2.a
    text: enig wettelijk voorschrift tot de bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
  - number: 74.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
  - number: 74.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
  - number: '74.3'
    text: |-
      Degene die op grond van de [artikelen 62][ref1], [72][ref2] of [73][ref3] gegevens verstrekt dient na te gaan of
      degene aan wie de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '74.4'
    text: |-
      Onverminderd het eerste tot en met derde lid is [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1]
      voorzover het betreft de overeenkomstige toepassing van de [artikelen 457][ref2] en
      [464, tweede lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref3] niet van toepassing indien in verband
      met de uitvoering van deze wet handelingen worden verricht op het gebied van de geneeskunst door personen, voor wie
      het in het eerste lid vervatte verbod geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel464
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '457'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '464'
  - number: '75'
    text: |-
      De door het Uitvoeringsinstituut werknemersverzekeringen in het kader van zijn in [artikel 30a, tweede lid][ref1],
      genoemde taak, en op grond van [artikel 30b][ref2] geregistreerde gegevens zijn openbaar voor zover die van belang
      zijn voor de uitoefening van de in artikel 30a, tweede lid, genoemde taak, met dien verstande dat openbaarmaking
      van persoonsgegevens van een individuele werkzoekende of een individuele werkgever plaatsvindt met inachtneming van
      de Algemene verordening gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30b
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '76'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank dragen op de voet van de ter
      zake voor de Rijksdienst geldende voorschriften zorg voor de nodige technische en organisatorische voorzieningen
      ter beveiliging van hun gegevens tegen verlies of aantasting en tegen onbevoegde kennisneming, wijziging en
      verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel76
  - number: '77'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de verstrekking van inlichtingen en het verlenen
      van inzage in gegevens en bescheiden door het Uitvoeringsinstituut werknemersverzekeringen, de colleges van
      burgemeester en wethouders en de Sociale verzekeringsbank aan Onze Minister en aan de Nederlandse Arbeidsinspectie
      op grond van deze wet en kunnen regels worden gesteld omtrent de inrichting van de administraties.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel77
  - number: '79'
    text: |-
      Indien een besluit goedkeuring behoeft op grond van deze wet of enige andere wet die wordt uitgevoerd door het
      Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank kan de goedkeuring worden onthouden op
      de grond dat het besluit in strijd met het recht of met het algemeen belang is.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel79
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk
      zijn in verband met de goede uitvoering door het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel82
  - number: '82.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel82
  - number: '82.3'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide Kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel82
  - number: 82a.1
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op
      het onderzoeken van mogelijkheden om deze wet, de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering][ref7], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de [Ziektewet][ref9] en de [Toeslagenwet][ref10]
      doeltreffender uit te voeren, worden afgeweken van het bepaalde bij of krachtens:


