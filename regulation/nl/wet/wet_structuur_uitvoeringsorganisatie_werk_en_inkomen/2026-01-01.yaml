      - id: ref4
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '77'
  - number: 83k.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de uitvoering van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83k
  - number: 83l
    text: |-
      [Artikel 30a][ref1] is niet van toepassing met betrekking tot de uitkeringsgerechtigde wiens recht op uitkering
      op grond van de in [dat artikel][ref2] genoemde wetten voor de dag van inwerkingtreding van [dat artikel][ref3]
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83l
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 83la
    text: |-
      [Artikel 30e][ref1] vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30e
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83la
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30e
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 83m
    text: |-
      In dit hoofdstuk wordt verstaan onder Centrale organisatie werk en inkomen: de Centrale organisatie werk en
      inkomen, genoemd in [hoofdstuk 4][ref1] van deze wet, zoals deze luidde op 31 december 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83m
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 83n.1
    text: |-
      Alle vermogensbestanddelen van de Centrale organisatie werk en inkomen gaan over op het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een akte of betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83n
  - number: 83n.2
    text: |-
      Met betrekking tot de ingevolge het eerste lid overgaande vermogensbestanddelen die in openbare registers te
      boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders van
      die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83n
  - number: 83n.3
    text: |-
      Ter zake van de in het eerste lid bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83n
  - number: 83n.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in afwijking van het eerste lid
      vermogensbestanddelen van de Centrale organisatie werk en inkomen die worden toegerekend aan de uitvoering van in
      die maatregel genoemde taken of het verrichten van bepaalde diensten overgaan op bij die maatregel aan te wijzen
      rechtspersonen dan wel op de Staat. Het bepaalde in dit artikel is ten aanzien van die overgang van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83n
  - number: 83o.1
    text: |-
      De publiekrechtelijke rechten en verplichtingen van de Centrale organisatie werk en inkomen gaan over op het
      Uitvoeringsinstituut werknemersverzekeringen voor zover in deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83o
  - number: 83o.2
    text: |-
      Een besluit dat door de Centrale organisatie werk en inkomen is genomen, geldt als een besluit van het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83o
  - number: 83o.3
    text: |-
      Een tot de Centrale organisatie werk en inkomen gericht verzoek om een besluit te nemen, wordt beschouwd als te
      zijn gericht tot het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83o
  - number: 83p.1
    text: |-
      In civielrechtelijke en bestuursrechtelijke gedingen waarin de Centrale organisatie werk en inkomen partij is,
      treedt het Uitvoeringsinstituut werknemersverzekeringen in haar plaats, zonder dat daarvoor een betekening nodig is
      en met overneming van procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83p
  - number: 83p.2
    text: |-
      Beroep waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het Uitvoeringsinstituut
      werknemersverzekeringen open gedurende het resterende gedeelte van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83p
  - number: 83p.3
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat het Uitvoeringsinstituut werknemersverzekeringen in een
      geding zowel eiser als verweerder is, wordt dat geding van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83p
  - number: 83p.4
    text: |-
      Indien de toepassing van dit hoofdstuk tot gevolg heeft dat het Uitvoeringsinstituut werknemersverzekeringen in een
      bezwaarschriftprocedure zowel de indiener van het bezwaarschrift als het bestuursorgaan dat het bestreden besluit
      heeft genomen is, wordt die bezwaarschriftprocedure van rechtswege beëindigd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83p
  - number: 83q.1
    text: |-
      Bij de Centrale organisatie werk en inkomen aanhangige bezwaarschriften gaan, in de stand waarin zij zich bevinden,
      over naar het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83q
  - number: 83q.2
    text: |-
      Bezwaar waarvoor de termijn is aangevangen vóór de inwerkingtreding van deze wet staat voor het
      Uitvoeringsinstituut werknemersverzekeringen open gedurende het resterende gedeelte van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83q
  - number: 83r
    text: |-
      De rechten en verplichtingen van de Centrale organisatie werk en inkomen die voortvloeien uit de
      arbeidsovereenkomsten met zijn werknemers gaan over op het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83r
  - number: 83s.1
    text: |-
      Goedkeuring verleend aan de Centrale organisatie werk en inkomen op grond van [artikel 13, eerste lid][ref1], zoals
      dit artikel luidde op 31 december 2008, wordt aangemerkt als goedkeuring of, indien [artikel 5, vierde lid][ref2],
      van toepassing is, als melding, van een daartoe strekkend besluit van het Uitvoeringsinstituut
      werknemersverzekeringen op grond van [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83s
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '5'
        hoofdstuk: '2'
  - number: 83s.2
    text: |-
      Verplichtingen opgelegd aan de Centrale organisatie werk en inkomen op grond van [artikel 13, tweede lid][ref1],
      zoals dit artikel luidde op 31 december 2008, worden aangemerkt als verplichtingen opgelegd aan het
      Uitvoeringsinstituut werknemersverzekeringen op grond van [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83s
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '5'
        hoofdstuk: '2'
  - number: 83sa
    text: |-
      Met ingang van de dag waarop artikel IV, onderdeel D, van de Wet van 21 mei 2012 tot wijziging van de Wet
      structuur uitvoeringsorganisatie werk en inkomen in verband met aanpassing van de dienstverlening van het
      Uitvoeringsinstituut werknemersverzekeringen aan werkgevers en werkzoekenden en de opheffing van de Raad voor
      Werk en Inkomen als publiekrechtelijke rechtspersoon met een wettelijke taak en van de Werkloosheidswet en enige
      andere wetten in verband met de beëindiging van de inzet van het re-integratiebudget Werkloosheidswet en van
      loonkostensubsidies in werking is getreden, verliest de Raad voor werk en inkomen zijn rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83sa
  - number: 83t.1
    text: |-
      Alle vermogensbestanddelen van de Raad voor werk en inkomen gaan over op de Staat, zonder dat daarvoor een akte of
      betekening nodig is.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83t
  - number: 83t.2
    text: |-
      Met betrekking tot de ingevolge het eerste lid overgaande vermogensbestanddelen die in openbare registers te
      boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders van
      die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83t
  - number: 83t.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in afwijking van het eerste lid
      vermogensbestanddelen van de Raad voor werk en inkomen overgaan op bij die maatregel aan te wijzen rechtspersonen.
      Dit artikel is ten aanzien van die overgang van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83t
  - number: 83u
    text: |-
      Aan de leden en de voorzitter van de Raad voor werk en inkomen, die in die functie zijn benoemd voorafgaand
      aan de datum van inwerkingtreding van artikel IV, onderdeel D, van de Wet van 21 mei 2012 tot wijziging van de
      Wet structuur uitvoeringsorganisatie werk en inkomen in verband met aanpassing van de dienstverlening van het
      Uitvoeringsinstituut werknemersverzekeringen aan werkgevers en werkzoekenden en de opheffing van de Raad voor
      werk en inkomen als publiekrechtelijke rechtspersoon met een wettelijke taak en van de Werkloosheidswet en enige
      andere wetten in verband met de beëindiging van de inzet van het re-integratiebudget Werkloosheidswet en van
      loonkostensubsidies, wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83u
  - number: 83v
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de afwikkeling van de opheffing van de Raad voor
      werk en inkomen en kan worden bepaald dat kosten in verband met die opheffing ten laste van ’s Rijks kas worden
      vergoed.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel83v
  - number: '84.1'
    text: |-
      Overtreding van de [artikelen 54, eerste, vierde en vijfde lid][ref1], en [55, tweede en derde lid][ref2],
      van deze wet, [27a, negende lid][ref3], en [36, zevende lid, van de Werkloosheidswet][ref4],
      [33, zevende lid][ref5], en [45a, negende lid, van de Ziektewet][ref6], [77, zevende lid][ref7], en
      [91, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8], [29a, negende lid][ref9], en
      [57, zevende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref10], [48, negende lid][ref11],
      en [63, zevende lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref12],
      [artikel 2:59, zesde lid][ref13], [2:69, negende lid][ref14], [3:40, negende lid][ref15], en
