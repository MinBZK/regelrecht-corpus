  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder gegevens mede verstaan persoonsgegevens als bedoeld in
      de Algemene verordening gegevensbescherming en wordt onder verwerking, verwerkingsverantwoordelijke en verwerker
      verstaan hetgeen daaronder wordt verstaan in artikel 4, onderdelen 2, 7 en 8, van de Algemene verordening
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Uitvoeringsinstituut werknemersverzekeringen, dat belast is met de taken, bedoeld in [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '2.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft rechtspersoonlijkheid en heeft zijn zetel op een door Onze
      Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Er is een Sociale verzekeringsbank, die belast is met de taken, bedoeld in [hoofdstuk 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '3.2'
    text: |-
      De Sociale verzekeringsbank heeft rechtspersoonlijkheid en heeft haar zetel op een door Onze Minister te bepalen
      plaats.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank, met uitzondering van [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '4.2'
    text: |-
      Indien de mandaatverlening, bedoeld in [artikel 8 van de Kaderwet zelfstandige bestuursorganen][ref1], het
      mandateren van de uitvoering van taken van één van de op grond van [artikel 9, eerste lid][ref2], samenwerkende
      bestuursorganen aan het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank betreft, is
      in afwijking van [artikel 8 van de Kaderwet zelfstandige bestuursorganen][ref3] geen goedkeuring van Onze Minister
      vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel8
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '8'
  - number: '5.1'
    text: |-
      Een besluit van het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank om andere
      werkzaamheden te verrichten dan de uitvoering van de in [hoofdstuk 5][ref1] of [6][ref2] bedoelde taken behoeft de
      goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '5.2'
    text: |-
      De goedkeuring kan, onverminderd [artikel 79][ref1], worden onthouden op de grond dat de uitvoering van de andere
      werkzaamheden door het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank een goede
      taakuitoefening door het bestuursorgaan kan belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel79
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '79'
        hoofdstuk: '10'
  - number: '5.3'
    text: |-
      Onze Minister kan bij de goedkeuring verplichtingen opleggen in verband met de uitvoering van andere werkzaamheden
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het eerste lid is niet van toepassing op een besluit van het Uitvoeringsinstituut werknemersverzekeringen of de
      Sociale verzekeringsbank om in het kader van de samenwerking, bedoeld in [artikel 9][ref1], werkzaamheden uit te
      voeren voor elkaar of voor de colleges van burgemeester en wethouders, indien het de uitvoering van werkzaamheden
      op grond van de in [artikel 9, eerste lid][ref2], bedoelde wetten betreft, respectievelijk elkaar bij te staan
      bij de uitvoering van taken, mits het Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale
      verzekeringsbank, dit binnen een redelijke termijn meldt bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel9
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
  - number: '5.5'
    text: |-
      Onze Minister kan bepalen dat de uitvoering van andere werkzaamheden als bedoeld in het eerste lid en de uitvoering
      van werkzaamheden als bedoeld in het vierde lid door het betrokken bestuursorgaan wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
  - number: '5.6'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank hebben elk een Raad van bestuur die
      met de dagelijkse leiding is belast.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '6.2'
    text: Een Raad van bestuur bestaat uit een door Onze Minister te bepalen aantal leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister bepaalt de periode van benoeming van de leden van een Raad van bestuur en kan ook de mogelijkheid van
      hun herbenoeming regelen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '6.4'
    text: Onze Minister stelt de rechtspositie van de leden van de Raad van bestuur vast.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '6.5'
    text: |-
      De Raad van bestuur oefent de taken en bevoegdheden uit die bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '6.6'
    text: Een Raad van bestuur stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen elk een regeling vast die
      gericht is op de realisatie en vormgeving van adequate cliëntenparticipatie op centraal niveau bij de uitvoering
      van hun wettelijke taken. Het Uitvoeringsinstituut werknemersverzekeringen regelt, na overleg met de personen
      en vertegenwoordigers, bedoeld in het tweede lid, in deze regeling tevens de cliëntenparticipatie op decentraal
      niveau.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      In de regeling, bedoeld in het eerste lid, wordt op het centrale niveau voorzien in overleg met personen of
      vertegenwoordigers van personen die als cliënt betrokken zijn bij de uitvoering van de taken van de in het eerste
      lid genoemde bestuursorganen. Dit overleg vindt periodiek plaats, doch ten minste twee maal per jaar.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      In de regeling, bedoeld in het eerste lid, wordt in ieder geval geregeld de wijze waarop de in het tweede lid
      bedoelde personen of vertegenwoordigers:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.3.a
    text: onderwerpen voor de agenda van het overleg, bedoeld in het tweede lid, kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.3.b
    text: voorzien worden van de voor een adequate deelname aan het overleg benodigde informatie;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.3.c
    text: |-
      betrokken worden bij de totstandkoming van de planning, begroting en verslaglegging, bedoeld in
      [hoofdstuk 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '8'
  - number: 7.3.d
    text: |-
      gevraagd en ongevraagd kunnen adviseren over de uitvoering van de wettelijke taken van het betrokken
      bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.3.e
    text: |-
      in staat gesteld worden op een adequate manier aan het overleg deel te nemen, waarbij ten minste aandacht besteed
      wordt aan logistieke faciliteiten, onkostenvergoedingen en deskundigheidsbevordering;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.3.f
    text: beschermd worden tegen benadeling in verband met hun deelname aan het overleg.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen regelt in de regeling, bedoeld in het eerste lid, in het kader van
      de cliëntenparticipatie op decentraal niveau in ieder geval de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.4.a
    text: |-
      personen en vertegenwoordigers van personen die als cliënt betrokken zijn bij de decentrale uitvoering van de taken
      van de in het eerste lid genoemde bestuursorganen, hierop invloed kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: 7.4.b
    text: |-
      door het Uitvoeringsinstituut werknemersverzekeringen op centraal niveau rekening wordt gehouden met de resultaten
      van cliëntenparticipatie op decentraal niveau.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien de regeling, bedoeld in het eerste lid, voorziet in overleg op decentraal niveau, zijn het tweede en derde
      lid ten aanzien van dit overleg van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.6'
    text: |-
      In iedere vestiging wordt bekendheid gegeven aan de wijze waarop door het Uitvoeringsinstituut
      werknemersverzekeringen of de Sociale verzekeringsbank uitvoering wordt gegeven aan dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '7.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere onderwerpen worden aangewezen die in elk geval in
      de regeling, bedoeld in het eerste lid, worden geregeld en kunnen nadere regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel7
  - number: '8.1'
    text: Er is een landelijke cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De landelijke cliëntenraad bestaat uit negen vertegenwoordigers van landelijke cliëntenorganisaties, drie
      afgevaardigden uit elk van de overleggen, bedoeld in [artikel 7, tweede lid][ref1], alsmede uit drie afgevaardigden
      uit de cliëntenparticipatie bij de gemeenten. De afgevaardigden betreffen personen of vertegenwoordigers van
      personen die als cliënt betrokken zijn bij de uitvoering van de taken van het desbetreffende bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '7'
        hoofdstuk: '2'
  - number: '8.3'
    text: 'De landelijke cliëntenraad heeft tot taak periodiek, doch ten minste eenmaal per jaar, te overleggen met:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: 8.3.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, de gemeenten en Onze Minister over
      de vormgeving en realisatie van cliëntenparticipatie bij de desbetreffende organen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: 8.3.b
    text: |-
      Onze Minister over voorstellen van de landelijke cliëntenraad inzake beleidsvragen op het gebied van werk en
      inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      De landelijke cliëntenraad heeft een secretariaat en vervult zijn taak met de middelen die hem door Onze Minister
      ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: '8.5'
    text: |-
      De landelijke cliëntenraad krijgt alle informatie van de in het derde lid genoemde instanties, voor zover hij deze
      voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de financiering, de werkwijze en de ondersteuning van
      de landelijke cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van burgemeester
      en wethouders werken samen bij de uitvoering van taken op grond van deze wet, de [Participatiewet][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] en de
      [Wet gemeentelijke schuldhulpverlening][ref4] met het oog op een doeltreffende en klantgerichte uitoefening van
      die taken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0031331
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0031331
  - number: '9.2'
    text: |-
      De bestuursorganen, bedoeld in het eerste lid, werken voorts samen met betrekking tot andere taken met de
      uitvoering waarvan die bestuursorganen zijn belast en die verband houden met de uitoefening van de taken, bedoeld
      in het eerste lid, en met instellingen en diensten die werkzaamheden verrichten die verband houden met deze taken.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vorm van de samenwerking,
      de afstemming van de samenwerking op de uitvoering van taken opgedragen bij of krachtens andere wetten dan die
      bedoeld in het eerste lid, en vergoeding van kosten.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel9
  - number: '9.4'
    text: Bij algemene maatregel van bestuur worden indicatoren vastgesteld voor de taakuitoefening, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister kan, indien hij ernstige tekortkomingen vaststelt met betrekking tot de uitvoering van dit artikel
      en in samenhang daarmee van [artikel 62][ref1], aan het Uitvoeringsinstituut werknemersverzekeringen, de Sociale
      verzekeringsbank of het college van burgemeester en wethouders een aanwijzing geven met betrekking tot die
      uitvoering. Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank of het college van
      burgemeester en wethouders worden in de gelegenheid gesteld de uitvoering in overeenstemming te brengen met
      de aanwijzing binnen een door Onze Minister te stellen termijn. Indien Onze Minister van oordeel is dat het
      Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank of het college van burgemeester en
      wethouders na afloop van deze termijn niet aan de aanwijzing heeft voldaan, kan Onze Minister de noodzakelijke
      voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '10.1'
    text: |-
      Met het oog op de dienstverlening met betrekking tot de in [artikel 9, eerste lid][ref1], bedoelde wetten werken
      het Uitvoeringsinstituut werknemersverzekeringen en de colleges van burgemeester en wethouders samen ten aanzien
      van de registratie van werkzoekenden en vacatures met behulp van de elektronische voorzieningen, bedoeld in
      [artikel 62, tweede lid][ref2], en werken zij in regio’s samen bij de dienstverlening aan werkgevers en het
      verrichten van taken met betrekking tot de regionale arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '10.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vormgeving en geografische
      spreiding van de samenwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel10
  - number: 10a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de samenwerking, bedoeld
      in [artikel 9][ref1] en [artikel 10, eerste lid][ref2], van de colleges van burgemeester en wethouders
      en het Uitvoeringsinstituut werknemersverzekeringen met de mede- betrokkenheid van werknemers-
      en werkgeversorganisaties bij de uitvoering van de taak, bedoeld in de [artikelen 7][ref3] en
      [7a, eerste lid, onderdeel a, van de Participatiewet][ref4], waaronder in ieder geval over vergoeding van kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: 7a
  - number: '11.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan bepaald worden dat werkzaamheden gericht op de inschakeling in
      de arbeid van werknemers en uitkeringsgerechtigden, indien zij op grond van de in [artikel 9, eerste lid][ref1],
      bedoelde wetten, niet verricht worden door het Uitvoeringsinstituut werknemersverzekeringen of de colleges van
      burgemeester en wethouders, slechts worden verricht door re-integratiebedrijven, die in het bezit zijn van een in
      het tweede lid bedoeld certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte aan een re-
      integratiebedrijf van een certificaat waaruit blijkt dat hij voldoet aan bij of krachtens deze algemene maatregel
      van bestuur gestelde kwaliteits- en deskundigheidseisen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister dan wel een door Onze Minister op grond van [artikel 12][ref1] aangewezen instelling beslist op
      aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel12
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '12'
        hoofdstuk: '3'
  - number: '11.4'
    text: |-
      Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: '11.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld die in ieder geval betrekking hebben
      op:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: 11.5.a
    text: |-
      de wijze waarop de aanvraag om een certificaat moet worden gedaan en de gegevens die daarbij van de aanvrager
      worden verlangd;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: 11.5.b
    text: |-
      de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een afgegeven
      certificaat kan worden ingetrokken;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: 11.5.c
    text: de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de wijze van betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister kan op verzoek een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 11, derde lid][ref1], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel11
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.2'
    text: Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
  - number: '12.4'
    text: |-
      De [artikelen 36][ref1], [37][ref2], en [42][ref3] van deze wet en de [artikelen 21][ref4] en
      [23 van de Kaderwet zelfstandige bestuursorganen][ref5] zijn ten aanzien van de instelling, bedoeld in het eerste
      lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '36'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '42'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0020495
        artikel: '23'
  - number: '12.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
  - number: 12.5.a
    text: de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
  - number: 12.5.b
    text: het opstellen van een verslag van werkzaamheden ten behoeve van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel12
  - number: '30.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak uitvoering te geven aan de wettelijke
      arbeidsongeschiktheidsverzekeringen, de wettelijke ziekengeldverzekering, de wettelijke werkloosheidsverzekering,
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], de [Toeslagenwet][ref2], de
      [Wet inkomensvoorziening oudere werklozen][ref3], alsmede aan wetten die de uitvoering van deze wetten beheersen,
      voor zover die uitvoering niet bij of krachtens enige wet aan anderen is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0024394
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0024394
  - number: '30.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak het beheren en administreren van de fondsen,
      bedoeld in [artikel 1, onderdelen j tot en met m en w, van de Wet financiering sociale verzekeringen][ref1],
      het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref2], en het Arbeidsongeschiktheidsfonds
      jonggehandicapten, genoemd in [artikel 5:1 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] en
      het voeren van een adequate administratie ten behoeve van de uitoefening van zijn taken.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '5'
  - number: '30.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan Onze Minister op zijn verzoek de inlichtingen die
      nodig zijn voor de beoordeling van de uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voor zover
      deze betrekking hebben op onderwerpen als bedoeld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
  - number: '30.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verricht in opdracht van Onze Minister of uit eigen beweging
      onderzoek met betrekking tot de wettelijke taken van dit instituut en verzamelt en analyseert informatie ten
      behoeve van de bevordering van de werking van en het inzicht in de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
  - number: '30.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verricht diensten voor gegevensverkeer met het buitenland, waarbij
      het Uitvoeringsinstituut werknemersverzekeringen en de hierna genoemde bestuursorganen de omvang van die diensten
      nader kunnen overeenkomen of voor zover dit voortvloeit uit internationaalrechtelijke voorschriften:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
  - number: 30.5.a
    text: |-
      ten behoeve van een rechtmatige uitvoering van bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
  - number: 30.5.b
    text: |-
      ten behoeve van een rechtmatige uitvoering van aan de colleges van burgemeester
      en wethouders opgedragen taken bij of krachtens de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 30.5.c
    text: ten behoeve van Onze Minister met het oog op het toezicht op de naleving van wetten.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
  - number: '30.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan Onze Minister op zijn verzoek
      inlichtingen die nodig zijn voor de beoordeling van een verzoek om ontheffing als bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 30a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak de inschakeling in het arbeidsproces te bevorderen
      van:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.1.a
    text: |-
      personen die recht hebben op een uitkering of arbeidsondersteuning op grond van wetten als bedoeld in
      [artikel 30, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 30a.1.b
    text: |-
      werknemers, die kunnen aantonen dat de dienstbetrekking binnen vier maanden zal eindigen en van wie naar het
      oordeel van het Uitvoeringsinstituut werknemersverzekeringen redelijkerwijs valt aan te nemen dat zij recht zullen
      hebben op een uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 30a.1.c
    text: |-
      personen die ingezetene zijn als bedoeld in
      [artikel 1:2 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], de leeftijd van 18 jaar nog
      niet hebben bereikt en in verband met ziekte of gebrek een belemmering ondervinden of hebben ondervonden bij het
      volgen van onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '1'
  - number: 30a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak het registreren van werkzoekenden en van
      vacatures van werkgevers en het voordragen van geschikte vacatures aan werkzoekenden en het voordragen
      van geschikte werkzoekenden voor vacatures. Het Uitvoeringsinstituut werknemersverzekeringen maakt in
      dit kader afspraken met werkgevers op basis waarvan concrete, passende arbeid kan worden aangeboden aan
      personen, die aanspraak maken op ziekengeld op grond van de [Ziektewet][ref1] of die ten minste 52 weken
      onafgebroken recht op een uitkering op grond van de [Werkloosheidswet][ref2] hebben gehad. Voor het
      bepalen van het tijdvak van 52 weken worden perioden meegeteld waarin ten hoogste gedurende vier weken
      geen recht op uitkering bestaat. Het Uitvoeringsinstituut werknemersverzekeringen maakt in dit kader tevens
      afspraken met werkgevers op basis waarvan concrete, passende arbeid kan worden aangeboden aan personen
      die recht op arbeidsondersteuning of recht op een arbeidsongeschiktheidsuitkering hebben op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0008657
  - number: 30a.3
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in het eerste lid, niet:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.3.a
    text: |-
      ten aanzien van personen, bedoeld in het eerste lid, indien het college van burgemeester en wethouders op grond van
      [artikel 7, derde lid, onderdeel c, en zevende lid, van de Participatiewet][ref1] die personen ondersteunt en aan
      die personen voorzieningen aanbiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 30a.3.b
    text: |-
      ten aanzien van personen die een arbeidsongeschiktheidsuitkering ontvangen op grond van
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
  - number: 30a.3.c
    text: |-
      ten aanzien van de verzekerde, bedoeld in
      [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], tenzij de
      [artikelen 72, derde lid][ref2], 82, tweede lid, of [133l, tweede lid, van die wet][ref3] van toepassing zijn en
      ten aanzien van de personen, bedoeld in [artikel 63a van de Ziektewet][ref4], voor de betaling van het ziekengeld
      aan wie de eigenrisicodrager in de zin van de [Ziektewet][ref5] het risico draagt;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel133l
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref5]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: 133l
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref5
        bwb_id: BWBR0001888
  - number: 30a.3.d
    text: |-
      indien [artikel 72a van de Werkloosheidswet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 72a
  - number: 30a.3.e
    text: |-
      ten aanzien van de werknemer, bedoeld in [artikel 29b van de Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: 30a.3.f
    text: |-
      ten aanzien van de jonggehandicapte die duurzaam geen mogelijkheden tot arbeidsparticipatie
      heeft als bedoeld in de [artikelen 1a:1, eerste lid][ref1], [2:4, eerste lid][ref2], en
      [3:8a, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 30a.4
    text: |-
      Nadat het recht op een uitkering op grond van wetten als bedoeld in [artikel 30, eerste lid][ref1],
      uitgezonderd de wettelijke ziekengeldverzekering en het recht op arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], is vastgesteld, stelt het Uitvoeringsinstituut
      werknemersverzekeringen, indien gelet op de aard van de uitkering het eerste lid van toepassing is, in
      samenspraak met de uitkeringsgerechtigde een re-integratievisie vast waarin verplichtingen en rechten van de
      uitkeringsgerechtigde zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0008657
  - number: 30a.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen evalueert, in samenspraak met de uitkeringsgerechtigde, periodiek
      de re-integratievisie en kan deze bijstellen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.6
    text: |-
      Indien de re-integratievisie dan wel het participatieplan daartoe aanleiding geeft draagt het Uitvoeringsinstituut
      werknemersverzekeringen ten behoeve van de uitkeringsgerechtigde, bedoeld in het vierde lid, zorg voor een plan
      gericht op behoud en verkrijging van mogelijkheden tot het verrichten van arbeid en inschakeling in arbeid. Het re-
      integratieplan wordt in samenspraak met de uitkeringsgerechtigde opgesteld. Voor zover noodzakelijk in verband met
      de aard van de voorziening, stelt het Uitvoeringsinstituut werknemersverzekeringen de uitkeringsgerechtigde in de
      gelegenheid zelf een re-integratieplan op te stellen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.7
    text: |-
      In het re-integratieplan worden verplichtingen en rechten van de uitkeringsgerechtigde vermeld voor zover die niet
      in de re-integratievisie zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.8
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verricht de werkzaamheden, bedoeld in het
      vierde tot en met zevende lid, niet ten aanzien van een uitkeringsgerechtigde op grond van de
      [Wet inkomensvoorziening oudere werklozen][ref1] en niet ten aanzien van een uitkeringsgerechtigde op grond van de
      [Werkloosheidswet][ref2] behalve:


      [ref1]: https://wetten.overheid.nl/BWBR0024394
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0024394
      - id: ref2
        bwb_id: BWBR0004045
  - number: 30a.8.a
    text: |-
      wanneer een werknemer gedurende de eerste dertien weken van ongeschiktheid tot het verrichten van zijn arbeid
      wegens ziekte hierdoor niet beschikbaar voor arbeid is of minder beschikbaar voor arbeid is dan het aantal
      arbeidsuren dat hij heeft verloren;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.8.b
    text: |-
      wanneer na afloop van de wachttijd, bedoeld in
      [artikel 23, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], of het tijdvak, bedoeld in
      [artikel 24, eerste lid][ref2], [25, negende lid][ref3], [26, tweede, lid, tweede zin, van die wet][ref4],
      [629, elfde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref5], [29, tiende lid, onderdeel a][ref6],
      of [76a, zesde lid, onderdeel a, van de Ziektewet][ref7], geen recht is ontstaan op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref8], maar op grond van de [Werkloosheidswet][ref9];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref8]: https://wetten.overheid.nl/BWBR0019057
      [ref9]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref7
        bwb_id: BWBR0001888
        artikel: 76a
      - id: ref8
        bwb_id: BWBR0019057
      - id: ref9
        bwb_id: BWBR0004045
  - number: 30a.8.c
    text: |-
      wanneer na afloop van het tijdvak van 52 weken, bedoeld in [artikel 19aa, eerste lid, van de Ziektewet][ref1], niet
      langer een recht op een uitkering op grond van de [Ziektewet][ref2] bestond, omdat de verzekerde in staat is met
      arbeid meer dan 65% van het maatmaninkomen per uur te verdienen, maar een recht op een uitkering op grond van de
      [Werkloosheidswet][ref3] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19aa
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
  - number: 30a.9
    text: |-
      Uitgezonderd uitkeringsgerechtigden als bedoeld in het achtste lid, laat het Uitvoeringsinstituut
      werknemersverzekeringen de werkzaamheden in het kader van zijn taak, bedoeld in het eerste en zesde lid, in
      elk geval indien het personen met een grotere afstand tot de arbeidsmarkt betreft, verrichten door een re-
      integratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor het derde en het negende lid in
      ieder geval voor de situaties van samenloop van de taak, bedoeld in het eerste lid met de vergelijkbare taak van
      werkgevers of in geval van samenloop van uitkeringen, de inhoud van de overeenkomst met het re-integratiebedrijf,
      de verwerking van gegevens en de soort werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30a
  - number: 30b.1
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen registreert op diens verzoek als werkzoekende:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.1.a
    text: Nederlanders;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.1.b
    text: |-
      vreemdelingen op wie artikel 1 van Verordening (EU) nr. 492/2011 van het Europees Parlement en de Raad van 5 april
      2011 betreffende het vrije verkeer van werknemers binnen de Unie (PbEU L 141) of artikel 23 van Richtlijn 2004/38/
      EG van het Europees Parlement en de Raad van 29 april 2004 betreffende het recht van vrij verkeer en verblijf op
      het grondgebied van de lidstaten voor de burgers van de Unie en hun familieleden, tot wijziging van Verordening
      (EEG) nr. 1612/68 en tot intrekking van de Richtlijnen 64/221/EEG, 68/360/EEG, 72/194/EEG, 73/148/EEG, 75/34/EEG,
      75/35/EEG, 90/364/EEG, 90/365/EEG en 93/96/EEG (PbEU L 158) van toepassing is;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.1.c
    text: |-
      vreemdelingen die beschikken over een krachtens de [Vreemdelingenwet 2000][ref1] afgegeven vergunning die is
      voorzien van een aantekening van Onze Minister van Veiligheid en Justitie waaruit blijkt dat aan die vergunning
      geen beperkingen zijn verbonden voor het verrichten van arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 30b.1.d
    text: vreemdelingen die behoren tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.2
    text: Aan geregistreerde werkzoekenden wordt kosteloos een bewijs van registratie verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen regelt de termijnen gedurende welke de registratie ten hoogste
      wordt gehandhaafd en waarmee de registratie telkenmale, op verzoek van de betrokkene, ten hoogste kan worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.4
    text: 'De registratie van een werkzoekende wordt beëindigd:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.4.a
    text: op verzoek van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.4.b
    text: |-
      indien een termijn als bedoeld in het derde lid is verstreken zonder dat de betrokkene een verzoek tot verlenging
      van de termijn heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.5
    text: |-
      Iedere werkgever heeft het recht bij het Uitvoeringsinstituut werknemersverzekeringen vacatures te laten
      registreren. Het Uitvoeringsinstituut werknemersverzekeringen stelt regels met betrekking tot deze registratie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30b.6
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de vacatures, bedoeld in het vijfde lid, uitsluitend
      kunnen worden opengesteld voor hiertoe aangewezen leeftijdscategorieën. Deze regeling kan ook betrekking hebben op
      vacatures die zonder tussenkomst van het Uitvoeringsinstituut werknemersverzekeringen worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30b
  - number: 30c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen neemt, onverminderd
      [artikel 41, tweede lid, van de Participatiewet][ref1], aanvragen in ontvangst van algemene
      bijstand op grond van de [Participatiewet][ref2] dan wel van een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3]. Bij het in ontvangst
      nemen van de aanvraag legt het Uitvoeringsinstituut werknemersverzekeringen de datum van de aanvraag vast en op
      welke dag hij naam, adres en woonplaats van de belanghebbende heeft geregistreerd en hem in staat heeft gesteld
      zijn aanvraag in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
  - number: 30c.2
    text: |-
      De belanghebbende verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen op verzoek alle gevraagde gegevens
      en bewijsstukken die nodig zijn voor de beslissing op zijn aanvraag door het college van burgemeester en wethouders
      van de betrokken gemeente.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
  - number: 30c.3
    text: |-
      De belanghebbende deelt op verzoek van het Uitvoeringsinstituut werknemersverzekeringen of onverwijld uit eigen
      beweging in verband met de toepassing van dit artikel alle feiten en omstandigheden mee, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op bijstand of het recht op een uitkering, het
      geldend maken van het recht op bijstand of het recht op een uitkering, of de hoogte of de duur van de bijstand
      of de uitkering. Deze verplichting geldt niet indien die feiten en omstandigheden door het Uitvoeringsinstituut
      werknemersverzekeringen kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte
      gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële
      regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
  - number: 30c.4
    text: |-
      [Artikel 33a, tweede en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 30c.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt de aanvraag met de daarbij verstrekte gegevens
      en bewijsstukken, over aan het college van burgemeester en wethouders van de betrokken gemeente. Het
      Uitvoeringsinstituut werknemersverzekeringen doet tegelijkertijd van deze overdracht schriftelijk mededeling aan
      belanghebbende. De verplichting van het derde lid geldt tot het tijdstip van ontvangst van deze mededeling.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
  - number: 30c.6
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen sluit overeenkomsten met het college van burgemeester en
      wethouders van de betrokken gemeente over de wijze van uitvoering van dit artikel, waarbij voor bepaalde
      categorieën van aanvragen een andere taakverdeling kan worden vastgesteld dan die voortvloeit uit het eerste en
      tweede lid. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
  - number: 30c.7
    text: |-
      De gegevens en bewijsstukken, bedoeld in het tweede lid, worden door het college van burgemeester en
      wethouders niet verkregen van de belanghebbende voor zover ze zijn verkregen van het Uitvoeringsinstituut
      werknemersverzekeringen, tenzij hierdoor een goede vervulling van de taak van het college van burgemeester en
      wethouders op grond van dit artikel wordt belet.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
  - number: 30c.8
    text: |-
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref1] is niet van toepassing ten aanzien van de uitvoering van dit
      artikel door het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 30d.1
    text: |-
      Ten behoeve van de uitvoering van de [Wet sociale werkvoorziening][ref1] door colleges van burgemeester en
      wethouders heeft het Uitvoeringsinstituut werknemersverzekeringen tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 30d.1.a
    text: na het verrichten van een onderzoek te besluiten over de herindicatie, bedoeld in artikel 11 van die wet;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
  - number: 30d.1.b
    text: |-
      in het geval betrokkene tot de doelgroep van die wet blijft behoren aan het college van burgemeester en wethouders
      van de gemeente waar betrokkene woonachtig is te adviseren:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
  - number: 30d.1.b.1°
    text: welke aanpassing van omstandigheden nodig is bij het verrichten van arbeid door betrokkene, en
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
  - number: 30d.1.b.2°
    text: of betrokkene in aanmerking komt voor toepassing van hoofdstuk 3 van die wet;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
  - number: 30d.1.c
    text: |-
      in het geval betrokkene niet meer tot de doelgroep van [genoemde wet][ref1] behoort aan het college van
      burgemeester en wethouders van de gemeente waar betrokkene woonachtig is te adviseren over de wijze waarop de
      mogelijkheden tot inschakeling in het arbeidsproces van betrokkene kunnen worden verbeterd, dan wel aan dat college
      van burgemeester en wethouders te adviseren over een doorgeleiding naar een voorziening voor ondersteunende en
      activerende begeleiding. In het advies over de wijze waarop de mogelijkheden tot inschakeling in het arbeidsproces
      kunnen worden verbeterd, wordt van de opvattingen van de betrokkene, desgewenst in de door deze aangegeven
      bewoordingen, en, indien het advies hiervan afwijkt, van de redenen daarvoor, melding gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 30d.1.d
    text: |-
      in de gevallen, bedoeld in [artikel 6, derde lid, van die wet][ref1] aan het college van burgemeester en wethouders
      van de gemeente waar betrokkene woonachtig is te adviseren omtrent de opzegging van de dienstbetrekking, bedoeld
      in [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0008903
  - number: 30d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het besluit, bedoeld in het eerste lid,
      en over de advisering en de wijze waarop de herindicatie tot stand komt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel30d
  - number: '31.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor een actueel oordeel over de kans op werk van
      iedere op grond van [artikel 30b][ref1] geregistreerde werkzoekende en onderzoekt zonodig op welke wijze die kans
      kan worden verbeterd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30b
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '31.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor gevraagde en ongevraagde verstrekking van
      deugdelijke informatie en advies over de arbeidsmarkt alsmede over de uitvoering van zijn taak aan werkgevers,
      werknemers, uitkeringsgerechtigden, verzekerden, werkzoekenden en andere belanghebbenden in verband met
      de uitvoering van de in [artikel 30, eerste lid][ref1], genoemde verzekeringen en wetten alsmede de in
      [artikel 30a][ref2] bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '31.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen geeft voorlichting met betrekking tot de keuze van een beroep
      alsmede de voor een beroep benodigde opleiding.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de registratie van de beoordeling, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31
  - number: 31a.1
    text: |-
      Voor zover aan het Uitvoeringsinstituut werknemersverzekeringen bekend is dat in een bedrijf of onderneming, of
      een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting plaatsvindt, verleent het geen diensten
      tot het plaatsen van werkzoekenden in dat bedrijf of die onderneming, of dat gedeelte daarvan, waar de werkstaking,
      uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31a
  - number: 31a.2
    text: |-
      Voor zover aan het Uitvoeringsinstituut werknemersverzekeringen bekend is dat werkzoekenden rechtstreeks in
      een werkstaking, uitsluiting of bedrijfsbezetting betrokken zijn, verleent het aan hen tijdens de duur van het
      arbeidsconflict geen diensten als bedoeld in [artikel 30a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '32.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een
      werknemer een onderzoek in naar en geeft een oordeel over het bestaan van ongeschiktheid tot
      werken, indien de werknemer een geschil heeft met zijn werkgever over recht op loon als bedoeld in
      [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of recht op bezoldiging als bedoeld in
      [artikel 76a, eerste lid, van de Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '32.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een werknemer dan
      wel een eigenrisicodrager als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1]
      of personen als bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2] die
      laatstelijk tot hem in dienstbetrekking stonden, een onderzoek in naar en geeft een oordeel over de
      nakoming door de werknemer of de persoon die recht heeft op ziekengeld van verplichtingen als bedoeld in
      [artikel 660a van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel overeenkomstige bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel660a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 660a
  - number: '32.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een werkgever of een werknemer dan wel
      een eigenrisicodrager als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1] of personen
      als bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2] die laatstelijk tot hem in
      dienstbetrekking stonden, een onderzoek in naar en geeft een oordeel over:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 32.3.a
    text: |-
      de aanwezigheid van passende arbeid, die de zieke werknemer voor de werkgever, respectievelijk de persoon die recht
      heeft op ziekengeld voor de eigenrisicodrager, in staat is te verrichten;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
  - number: 32.3.b
    text: |-
      de vraag of de werkgever ten aanzien van zijn zieke werknemer, respectievelijk de eigenrisicodrager ten aanzien van
      de persoon aan wie hij ziekengeld moet betalen, voldoende en geschikte re-integratie-inspanningen heeft verricht;
      of
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
  - number: 32.3.c
    text: |-
      de vraag of de werknemer bij regelmaat de bedongen arbeid niet kan verrichten als gevolg van ziekte of gebreken
      van de werknemer, die niet het gevolg zijn van onvoldoende zorg van de werkgever voor de arbeidsomstandigheden, of
      het aannemelijk is dat binnen 26 weken geen herstel zal optreden en dat binnen die periode de bedongen arbeid niet
      in aangepaste vorm kan worden verricht, en of herplaatsing van de werknemer in een andere passende functie, al dan
      niet met behulp van scholing, niet tot de mogelijkheden behoort.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
  - number: '32.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een eigenrisicodrager als bedoeld
      in [artikel 1 van de Wet werk en inkomen naar arbeidsvermogen][ref1] of de verzekerde, bedoeld in
      [artikel 82, eerste lid, van die wet][ref2], die recht heeft op uitkering een onderzoek in naar en geeft een
      oordeel over de vraag of de eigenrisicodrager ten aanzien van genoemde verzekerde voldoende en geschikte re-
      integratie-inspanningen heeft verricht voor zover hieromtrent door de eigenrisicodrager geen besluit is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '82'
  - number: '32.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen adviseert een overheidswerkgever als bedoeld in
      [artikel 1, onderdeel i, van de Werkloosheidswet][ref1] op diens verzoek met betrekking tot door die werkgever
      te verlenen ondersteuning aan de overheidswerknemer, bedoeld in artikel 1, onderdeel j, van de Werkloosheidswet aan
      wie toestemming als bedoeld in [artikel 77a van de Werkloosheidswet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 77a
  - number: '32.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op verzoek van een overheidswerkgever als bedoeld in
      [artikel 1, onderdeel i, van de Werkloosheidswet][ref1] een onderzoek in naar en geeft een oordeel over de
      vraag of een overheidswerknemer als bedoeld in artikel 1, onderdeel j, van de Werkloosheidswet die gedurende een
      ononderbroken periode van 104 weken ongeschikt tot werken is geweest, nog ongeschikt tot werken is en over de vraag
      of het aannemelijk is dat de ongeschiktheid tot werken langer dan zesentwintig weken zal voortduren of over de
      vraag of redelijkerwijs niet de mogelijkheid bestaat om die overheidswerknemer binnen zesentwintig weken, indien
      nodig door middel van scholing, te herplaatsen in een aangepaste of andere functie, die voor die overheidswerknemer
      als passend kan worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: '32.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op verzoek van een werkgever of een werknemer informatie
      over de sociale verzekeringsaspecten van arbeidsongeschiktheid, werkloosheid en re-integratie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32
  - number: 32a.1
    text: |-
      Indien een werkgever verzoekt een onderzoek als bedoeld in [artikel 32, eerste en tweede lid][ref1], in te stellen,
      geeft het Uitvoeringsinstituut werknemersverzekeringen slechts een oordeel over het bestaan van de ongeschiktheid
      tot werken van een bepaalde werknemer, indien deze werknemer bereid is zich hiertoe te laten onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 32a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voor een onderzoek als bedoeld in
      [artikel 32, eerste, tweede, derde, vierde en zesde lid][ref1], kosten in rekening brengen bij de werkgever of de
      werknemer die heeft verzocht dit onderzoek in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 32a.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen geeft een oordeel als bedoeld in
      [artikel 32, eerste, tweede, derde en vierde lid][ref1], binnen een termijn van twee weken na ontvangst van het
      verzoek. De [artikelen 4:14][ref2] en [4:15 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 32b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in het belang van de arbeidsintegratie
      van personen met een structurele functionele beperking ten laste van de fondsen, bedoeld in
      [hoofdstuk 7 van de Wet financiering sociale verzekeringen][ref1], onderscheidenlijk, wanneer deze
      personen jonggehandicapten betreffen, het Arbeidsongeschiktheidsfonds jonggehandicapten, bedoeld in
      [artikel 5:1 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], subsidie verstrekken aan
      instellingen of organisaties met het oog op onderzoek naar en het bevorderen van maatregelen, die strekken tot
      behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 32b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32b
  - number: 32c.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot door het Uitvoeringsinstituut
      werknemersverzekeringen te verstrekken subsidie aan een rechtspersoon die in het kader van de uitoefening van
      beroep of bedrijf door scholing de inschakeling in de arbeid bevordert van personen:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32c
  - number: 32c.1.a
    text: |-
      voor wier ondersteuning bij arbeidsinschakeling het college van burgemeester en wethouders zorg draagt op grond van
      de [artikelen 7, eerste lid, onderdeel a][ref1], of [7a, eerste lid, onderdeel a, van de Participatiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 7a
  - number: 32c.1.b
    text: |-
      die als gevolg van psychische, verstandelijke of lichamelijke beperkingen
      niet in staat zijn tot het verdienen van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] of, indien het
      een persoon jonger dan 21 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref2], en artikel 8, derde lid, van die wet; en


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
  - number: 32c.1.c
    text: die ernstige scholingsbelemmeringen hebben.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32c
  - number: 32c.2
    text: |-
      Bij de subsidieverlening, bedoeld in het eerste lid, kunnen aan de subsidie-ontvanger verplichtingen worden
      opgelegd omtrent het hanteren van een registratiesysteem waaruit blijkt of het doel van de subsidie is bereikt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32c
  - number: 32d.1
    text: |-
      Het uitvoeringsinstituut werknemersverzekeringen voert taken uit die bij of krachtens enige andere wet dan bedoeld
      in [artikel 30, eerste lid][ref1], aan het uitvoeringsinstituut zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 32d.2
    text: |-
      Bij algemene maatregel van bestuur of ministeriële regeling kunnen taken worden opgedragen aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32d
  - number: 32d.3
    text: |-
      Een voordracht voor een algemene maatregel van bestuur waarin taken aan het Uitvoeringsinstituut
      werknemersverzekeringen worden opgedragen wordt gedaan mede namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32d
  - number: 32d.4
    text: |-
      Indien taken aan het Uitvoeringsinstituut werknemersverzekeringen worden opgedragen bij regeling van Onze Minister
      wie het aangaat, wordt deze regeling mede ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32d
  - number: 32e.1
    text: |-
      In het verkeer tussen burgers en het Uitvoeringsinstituut werknemersverzekeringen wordt, in afwijking van de
      [artikelen 2:7, tweede lid][ref1], en [2:8 van de Algemene wet bestuursrecht][ref2], een bericht uitsluitend
      elektronisch verzonden, tenzij er naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen sprake is
      van groepen burgers voor wie en berichten of omstandigheden waarvoor communicatie langs andere dan elektronische
      weg is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 32e.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van de dienstverlening, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel32e
  - number: '33.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor de inrichting en adequate werking van de
      polisadministratie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.2'
    text: 'De polisadministratie heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: 33.2.a
    text: |-
      van de werknemer gegevens over zijn arbeidsverhouding en uitkeringsverhouding – daaronder begrepen duur, loon
      en premies werknemersverzekeringen – vast te leggen ten behoeve van de werknemersverzekeringen en de uitvoering
      van taken die bij of krachtens enige andere wet dan bedoeld in [artikel 30, eerste lid][ref1], aan het
      Uitvoeringsinstituut werknemersverzekeringen zijn opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 33.2.b
    text: |-
      besluiten over recht op uitkering of verstrekking te baseren op gegevens als bedoeld in onderdeel a met
      het oog waarop de werknemer wordt geïnformeerd over die gegevens en het al dan niet verzekerd zijn voor de
      werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: 33.2.c
    text: |-
      de verwerking van gegevens van de persoon die vrijwillig verzekerd is voor de [Ziektewet][ref1],
      de [Wet werk en inkomen naar arbeidsvermogen][ref2], [Werkloosheidswet][ref3] en
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] waarbij de onderdelen a en b van overeenkomstige toepassing
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
  - number: 33.2.d
    text: |-
      de verwerking van gegevens van de werknemer over genoten loon in de zin van de
      [Wet op de loonbelasting 1964][ref1], ingehouden loonbelasting, premie volksverzekeringen in de zin
      van de [Wet financiering sociale verzekeringen][ref2], inkomensafhankelijke bijdrage als bedoeld in de
      [Zorgverzekeringswet][ref3], alsmede andere gegevens van belang voor de heffing van de inkomstenbelasting ten
      behoeve van de uitvoering van de taken van de Belastingdienst;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0018450
  - number: 33.2.e
    text: |-
      de verwerking van overige gegevens van de werknemers van belang voor statistische doeleinden op het gebied van
      arbeid en lonen ten behoeve van het Centraal bureau voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is de verwerkingsverantwoordelijke voorzover het betreft de
      verwerking van de gegevens, bedoeld in het tweede lid, onderdelen a, b en c, en de verwerker voorzover het betreft
      de verwerking van de gegevens, bedoeld in het tweede lid, onderdelen d en e.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.4'
    text: |-
      De verwerkingsverantwoordelijke voor de verwerking van de gegevens, bedoeld in het tweede lid, d en e, zijn
      respectievelijk Onze Minister van Financiën en het Centraal bureau voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.5'
    text: |-
      De Belastingdienst verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen, in het kader
      van zijn taak bedoeld in het eerste lid, alle gegevens en inlichtingen, die verkregen zijn bij
      de uitvoering van de heffing van loonbelasting en van de [artikelen 58, tweede lid][ref1], en
      [59 van de Wet financiering sociale verzekeringen][ref2], voorzover die gegevens en inlichtingen noodzakelijk zijn
      voor de verwerking van gegevens in de polisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel59
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '59'
  - number: '33.6'
    text: |-
      De basisregistratie personen wordt ter verificatie geraadpleegd voor de verwerking van gegevens door het
      Uitvoeringsinstituut werknemersverzekeringen op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de Belastingdienst alle gegevens en inlichtingen,
      die noodzakelijk zijn ten behoeve van de uitvoering van de taken van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: '33.8'
    text: |-
      De gegevens, bedoeld in het tweede lid, onderdeel e, kunnen door het Uitvoeringsinstituut werknemersverzekeringen,
      de Sociale verzekeringsbank en de colleges van burgemeester en wethouders tevens verwerkt worden voor de uitvoering
      van de taken, bedoeld in [artikel 62][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '33.9'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt Onze Minister en bestuursorganen als bedoeld in de
      [artikelen, 62][ref1], [72][ref2] en [73, zevende lid][ref3], gegevens die op grond van het tweede lid, onderdelen
      a tot en met c, verwerkt worden in de polisadministratie, tenzij de gegevens, bedoeld in het tweede lid,
      onderdeel e, tevens verwerkt kunnen worden op grond van het achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '33.10'
    text: |-
      Gegevens als bedoeld in het tweede lid, onderdeel e, over lonen kunnen voor de uitvoering van de pensioenregelingen
      of beroepspensioenregelingen tevens verwerkt worden door de pensioenuitvoerders en beroepspensioenfondsen, genoemd
      in [artikel 73, eerste lid, onderdeel a][ref1], en voor regelingen inzake vervroegd uittreden op grond van een
      algemeen verbindend voorschrift door de stichtingen, genoemd in artikel 73, eerste lid, onderdeel b. Artikel 73,
      eerste en vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '33.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de inrichting,
      de gegevensset en de wijze van verkrijging van de gegevens van de polisadministratie. Tevens worden regels gesteld
      over het elektronische gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de
      gegevensverstrekking uit de polisadministratie worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33
  - number: 33a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is de verwerkingsverantwoordelijke voor de verwerking van gegevens
      van werknemers, uitkeringsgerechtigden als bedoeld in [artikel 1, onderdeel l, aanhef en onder 2][ref1], en bij
      de werknemer of uitkeringsgerechtigde behorende personen, noodzakelijk voor het uitvoeren van de taak, bedoeld in
      [artikel 30, eerste lid][ref2] en [artikel 30a, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 33a.2
    text: |-
      De gegevens, die door het Uitvoeringsinstituut werknemersverzekeringen worden verwerkt, worden door het
      Uitvoeringsinstituut werknemersverzekeringen niet verkregen van de in het eerste lid genoemde personen, voor zover
      zij verkregen kunnen worden uit de polisadministratie, bedoeld in [artikel 33][ref1], de verzekerdenadministratie,
      bedoeld in [artikel 35][ref2], alsmede de basisregistratie personen, tenzij hierdoor een goede vervulling van de
      taak van het Uitvoeringsinstituut werknemersverzekeringen op grond van dit artikel wordt belet of bij wettelijk
      voorschrift anders is bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere administraties
      worden aangewezen waarvoor de eerste zin van toepassing is, worden regels gesteld over de gegevens die het betreft
      en kunnen administraties worden aangewezen waarvoor de eerste zin tijdelijk niet van toepassing is. Indien het
      authentieke gegevens uit andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '35'
        hoofdstuk: '6'
  - number: 33a.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is, voorzover het Uitvoeringsinstituut werknemersverzekeringen
      niet verwerkingsverantwoordelijke is, verwerker voor de verwerking van gegevens ter uitvoering van de taak, bedoeld
      in [artikel 30, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 33a.4
    text: |-
      De voordracht voor een krachtens het tweede lid, tweede zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33a
  - number: 33b
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verifieert het burgerservicenummer in relatie
      tot de bijbehorende persoonsidentificerende gegevens van de natuurlijke persoon, bedoeld in
      [artikel 33, tweede lid, onderdeel a][ref1], bij de eerste opname in de polisadministratie en doet
      indien daartoe aanleiding is mededeling aan het college van burgemeester en wethouders als bedoeld in
      [artikel 2.34, eerste lid, van de Wet basisregistratie personen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 33c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer periodiek als bedoeld in
      [artikel 33, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 33c.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de werknemer tevens in de gelegenheid kennis te nemen van
      te verwachten hoogte en duur van de uitkering die door het Uitvoeringsinstituut werknemersverzekeringen wordt
      verstrekt, indien de werknemer werkloos, arbeidsongeschikt of gedeeltelijk arbeidsgeschikt zou worden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33c
  - number: 33c.3
    text: |-
      Indien de gegevens niet juist of niet volledig zijn, dient de werknemer een verzoek tot onverwijlde rectificatie
      van onjuiste gegevens in bij het Uitvoeringsinstituut werknemersverzekeringen met aanduiding van de juiste
      gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33c
  - number: 33c.4
    text: |-
      Indien de werknemer vaststelt, dat gegevens als bedoeld in het eerste lid niet zijn opgenomen in de
      polisadministratie en hij dit redelijkerwijs wel kon verwachten, dient hij terstond een verzoek tot vervollediging
      van de gegevens in bij het Uitvoeringsinstituut werknemersverzekeringen met aanduiding van de ontbrekende gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33c
  - number: 33c.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de periodiciteit van de informatie en voor de wijze
      van informatieverstrekking die voor verschillende soorten werknemers verschillend kan zijn, en in samenhang daarmee
      voor de inhoud van de informatie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33c
  - number: 33d.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt ten aanzien van de werknemer, bedoeld in de
      [Werkloosheidswet][ref1] en de [Wet werk en inkomen naar arbeidsvermogen][ref2], van wie door het
      Uitvoeringsinstituut werknemersverzekeringen gegevens worden verwerkt op grond van deze wetten, gegevens
      vast waarbij is aangegeven of hij in een kalenderjaar over 52 of meer dagen respectievelijk over 208 of
      meer uren loon heeft ontvangen als bedoeld in [artikel 42][ref3] of [42a van de Werkloosheidswet][ref4] en
      [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel15
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 42a
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '15'
  - number: 33d.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer op de wijze, bedoeld in
      [artikel 33c][ref1], over deze arbeidsverledengegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33c
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '34.1'
    text: 'De Sociale verzekeringsbank heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.1.a
    text: |-
      de [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Algemene Kinderbijslagwet][ref3],
      alsmede wetten die de uitvoering van deze wetten beheersen, uit te voeren, voorzover die uitvoering niet bij of
      krachtens enige andere wet aan anderen is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0002368
  - number: 34.1.b
    text: |-
      beheren en administreren van de fondsen, bedoeld in
      [artikel 1, onderdelen f en g van de Wet financiering sociale verzekeringen][ref1] en het Algemeen
      Kinderbijslagfonds, genoemd in [artikel 29a van de Algemene Kinderbijslagwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel29a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 29a
  - number: 34.1.c
    text: |-
      zorgdragen voor gevraagde en ongevraagde verstrekking van deugdelijke informatie aan werkgevers, werknemers,
      uitkeringsgerechtigden, verzekerden en andere belanghebbenden in verband met de uitvoering van de in onderdeel a
      genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.1.d
    text: |-
      het uitvoeren van taken die bij of krachtens enige andere wet dan de in onderdeel a bedoelde wetten, aan de Sociale
      verzekeringsbank zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.1.e
    text: |-
      het in opdracht van Onze Minister of uit eigen beweging verrichten van onderzoek met betrekking tot de wettelijke
      taken van deze organisatie;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.1.f
    text: |-
      het aan Onze Minister op zijn verzoek verstrekken van de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voorzover deze betrekking hebben op onderwerpen
      als bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.1.g
    text: het voeren van een adequate administratie ten behoeve van de uitoefening van haar taak.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: '34.2'
    text: |-
      De Sociale verzekeringsbank verricht diensten voor gegevensverkeer met het buitenland, waarbij de Sociale
      verzekeringsbank en de hierna genoemde bestuursorganen de omvang van die diensten nader kunnen overeenkomen of voor
      zover dit voortvloeit uit internationaalrechtelijke voorschriften:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.2.a
    text: |-
      ten behoeve van een rechtmatige uitvoering van bij of krachtens deze wet of enige andere wet aan het
      Uitvoeringsinstituut werknemersverzekeringen opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.2.b
    text: |-
      ten behoeve van een rechtmatige uitvoering van aan de colleges van burgemeester
      en wethouders opgedragen taken bij of krachtens de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 34.2.c
    text: ten behoeve van Onze Minister met het oog op het toezicht op de naleving van wetten.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: '34.3'
    text: |-
      De Sociale verzekeringsbank verwerkt gegevens afkomstig uit het buitenland en verricht taken in verband met deze
      gegevensverwerking:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34.3.a
    text: |-
      ten behoeve van de uitvoering van bij of krachtens de [Wet langdurige zorg][ref1] en de [Zorgverzekeringswet][ref2]
      aan het Zorginstituut Nederland, genoemd in [artikel 58 van de Zorgverzekeringswet][ref3], opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: 34.3.b
    text: |-
      ten behoeve van de uitvoering van de [Algemene wet inkomensafhankelijke regelingen][ref1] door de Dienst Toeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 34.3.c
    text: |-
      ten behoeve van de vaststelling van het verzekerd zijn op grond van de werknemersverzekeringen, de
      volksverzekeringen, of het verzekeringsplichtig zijn op grond van de [Zorgverzekeringswet][ref1], voor zover
      dit voortvloeit uit internationaalrechtelijke voorschriften, dan wel stelt op basis van door de Sociale
      verzekeringsbank te verwerken gegevens op verzoek van de genoemde bestuursorganen en de zorgverzekeraars, genoemd
      in de [Zorgverzekeringswet][ref2], verzekering of verzekeringstijdvakken vast;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
  - number: 34.3.d
    text: |-
      ten behoeve van de uitvoering van de bij de [Zorgverzekeringswet][ref1] aan het CAK, genoemd in
      [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref2] opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '6'
  - number: '34.4'
    text: |-
      De Sociale verzekeringsbank verstrekt op verzoek van een verzekerde, een Wlz-uitvoerder als
      bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1], een zorgverzekeraar als bedoeld in
      [artikel 1 van de Zorgverzekeringswet][ref2] of andere belanghebbende informatie over de verzekeringsstatus van de
      verzekerde voor zover deze informatie noodzakelijk is voor de uitvoering van de [Wet langdurige zorg][ref3] en de
      [Zorgverzekeringswet][ref4] en verstrekt op verzoek van een verzekerde informatie over de verzekeringstijdvakken en
      daarop gebaseerde aanspraak op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035917
      [ref4]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0035917
      - id: ref4
        bwb_id: BWBR0018450
  - number: '34.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      financiering van deze taken.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34
  - number: 34a.1
    text: |-
      Bij algemene maatregel van bestuur of bij ministeriële regeling kunnen taken worden opgedragen aan de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34a
  - number: 34a.2
    text: |-
      Een voordracht voor een algemene maatregel van bestuur waarin taken aan de Sociale verzekeringsbank worden
      opgedragen, wordt gedaan mede namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34a
  - number: 34a.3
    text: |-
      Indien taken aan de Sociale verzekeringsbank worden opgedragen bij regeling van Onze Minister wie het aangaat,
      wordt deze regeling mede ondertekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel34a
  - number: '35.1'
    text: |-
      De Sociale verzekeringsbank is de verwerkingsverantwoordelijke voor de verwerking van gegevens over verzekerden
      en uitkeringsgerechtigden in de zin van de volksverzekeringen en over bij de verzekerden behorende personen in
      de verzekerdenadministratie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: '35.2'
    text: 'De verwerking van gegevens in de verzekerdenadministratie heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: 35.2.a
    text: |-
      van verzekerden, pensioengerechtigden, nabestaanden en andere uitkeringsgerechtigden gegevens te verwerken
      noodzakelijk voor de uitvoering van de wetten, genoemd in [artikel 34, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: 35.2.b
    text: |-
      van kinderen van verzekerden gegevens te verwerken noodzakelijk voor de uitvoering van de
      [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 35.2.c
    text: |-
      van de echtgenoot, kinderen of huisgenoten van de verzekerde en pensioengerechtigde gegevens te verwerken
      noodzakelijk voor de uitvoering van de [Algemene nabestaandenwet][ref1] en de [Algemene Ouderdomswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002221
  - number: 35.2.d
    text: |-
      van andere personen gegevens te verwerken noodzakelijk voor de uitvoering van taken als bedoeld in
      [artikel 34, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: 35.2.e
    text: |-
      gegevens vast te leggen over verzekerde en niet verzekerde tijdvakken op grond van verplichte of vrijwillige
      verzekering voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: 35.2.f
    text: |-
      gegevens te verwerken om te voldoen aan verplichtingen van de Sociale verzekeringsbank op grond van
      internationaalrechtelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: '35.3'
    text: |-
      Voorzover de Sociale verzekeringsbank geen verwerkingsverantwoordelijke is, is de Sociale
      verzekeringsbank verwerker voor de verwerking van gegevens ter uitvoering van de taak, bedoeld in
      [artikel 34, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: '35.4'
    text: |-
      De Sociale verzekeringsbank verstrekt Onze Minister en bestuursorganen als bedoeld in de [artikelen 62][ref1],
      [72][ref2] en [73, zevende lid][ref3], gegevens als bedoeld in het tweede lid die verwerkt worden in de
      verzekerdenadministratie, voorzover deze gegevens niet verwerkt worden in de polisadministratie, bedoeld in
      [artikel 33][ref4], en verstrekt het Uitvoeringsinstituut werknemersverzekeringen alle gegevens, die noodzakelijk
      zijn voor verwerking van gegevens in de polisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '35.5'
    text: |-
      De gegevens, die door de Sociale verzekeringsbank worden verwerkt worden niet verkregen van de in het tweede lid
      genoemde personen, voorzover zij verkregen kunnen worden uit de basisregistratie personen of de polisadministratie,
      bedoeld in [artikel 33][ref1], tenzij hierdoor een goede vervulling van de taak van de Sociale verzekeringsbank
      op grond van dit artikel wordt belet of bij wettelijk voorschrift anders is bepaald. Bij of krachtens algemene
      maatregel van bestuur kunnen andere administraties worden aangewezen waarvoor de eerste zin van toepassing is,
      worden regels gesteld over de gegevens die het betreft en kunnen administraties worden aangewezen waarvoor de
      eerste zin tijdelijk niet van toepassing is. Indien het authentieke gegevens uit andere basisregistraties betreft,
      is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '35.6'
    text: |-
      [Artikel 33b][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33b
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33b
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '35.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de inrichting
      en de gegevensset van de verzekerdenadministratie. Tevens worden regels gesteld over het elektronische
      gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de gegevensverstrekking
      uit de verzekerdenadministratie worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: '35.8'
    text: |-
      De voordracht voor een krachtens het vijfde lid, tweede zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel35
  - number: '37.1'
    text: |-
      De Nederlandse Arbeidsinspectie is belast met het toezicht op de doeltreffendheid van de uitvoering van de bij
      of krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel37
  - number: '37.2'
    text: |-
      De Nederlandse Arbeidsinspectie is belast met het toezicht op de wijze waarop het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank, en de colleges van burgemeester en wethouders bij de
      uitvoering van de aan hen opgedragen taken samenwerken als bedoeld in de [artikelen 9][ref1], [10][ref2] en
      [10a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel10a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 10a
        hoofdstuk: '3'
  - number: '37.3'
    text: |-
      De Nederlandse Arbeidsinspectie is belast met het toezicht op de wijze waarop de colleges van burgemeester en
      wethouders gezamenlijk bijdragen aan het behalen van de doelen op het terrein van werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel37
  - number: '38.1'
    text: |-
      De Nederlandse Arbeidsinspectie stelt eens per vier jaar vóór 1 juli een meerjarig toezichtsplan en jaarlijks vóór
      1 juli een plan van werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel38
  - number: '38.2'
    text: |-
      Jaarlijks vóór 1 mei stelt de Nederlandse Arbeidsinspectie een verslag op over de uitkomsten van de
      toezichtswerkzaamheden in het afgelopen kalenderjaar. Onze Minister brengt het jaarverslag, voorzien van zijn
      oordeel, vóór de derde woensdag in mei ter kennis van de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel38
  - number: '38.3'
    text: |-
      Onze Minister brengt de bescheiden, bedoeld in het eerste lid, alsmede alle overige, door de Nederlandse
      Arbeidsinspectie relevant geachte, rapportages, in de vorm waarin deze hem zijn voorgelegd en voorzien van zijn
      oordeel, binnen vier weken na ontvangst, ter kennis aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel38
  - number: '39.1'
    text: |-
      De Nederlandse Arbeidsinspectie is met betrekking tot de haar bij of krachtens de wet opgedragen taken bevoegd tot
      het verrichten van niet in het jaarplan opgenomen of aanvullende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister stelt vast met welke andere dan de in [artikel 37][ref1] bedoelde taken en werkzaamheden de
      Nederlandse Arbeidsinspectie wordt belast. Deze taken en werkzaamheden worden opgenomen in het jaarplan, bedoeld in
      [artikel 38, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel38
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '38'
        hoofdstuk: '7'
  - number: '39.3'
    text: |-
      Indien Onze Minister met de Nederlandse Arbeidsinspectie geen overeenstemming bereikt over werkzaamheden als
      bedoeld in het eerste lid dan wel overweegt aan de Nederlandse Arbeidsinspectie andere dan de in dit hoofdstuk
      genoemde of in het jaarplan opgenomen taken op te dragen, stelt hij de beide kamers der Staten-Generaal hiervan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel39
  - number: '40.1'
    text: |-
      De Nederlandse Arbeidsinspectie draagt zorg voor de verspreiding van het jaarverslag en de overige rapportages,
      bedoeld in [artikel 38][ref1], en verzorgt de voorlichting over de daarin opgenomen bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel38
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '38'
        hoofdstuk: '7'
  - number: '40.2'
    text: |-
      De Nederlandse Arbeidsinspectie geeft niet eerder uitvoering aan het eerste lid dan nadat Onze Minister het
      desbetreffende jaarverslag of de desbetreffende rapportage openbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel40
  - number: '41'
    text: |-
      De Nederlandse Arbeidsinspectie beoordeelt op verzoek van Onze Minister de mogelijkheden van het houden
      van toezicht op de uitvoering van beleidsvoornemens en voorgenomen wettelijke voorschriften door de in
      [artikel 37][ref1] genoemde bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
  - number: '42.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de
      colleges van burgemeester en wethouders verstrekken op verzoek, kosteloos, aan de
      Nederlandse Arbeidsinspectie alle gegevens, waaronder het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], en gegevens over gezondheid
      in de zin van artikel 9 van de Algemene verordening gegevensbescherming, en inlichtingen en verlenen de Nederlandse
      Arbeidsinspectie op verzoek toegang tot en inzage in gegevens en bescheiden die voor de uitoefening van haar taak,
      bedoeld in [hoofdstuk 7][ref2], noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '7'
  - number: '42.2'
    text: |-
      De Nederlandse Arbeidsinspectie kan de gegevens, bedoeld in het eerste lid, verwerken voor de uitoefening van haar
      taak, bedoeld in [hoofdstuk 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
  - number: '42.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de verstrekking en
      verwerking van gegevens over gezondheid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel42
  - number: '42.4'
    text: |-
      De Nederlandse Arbeidsinspectie bepaalt de termijn waarbinnen en de wijze waarop aan de in het eerste lid bedoelde
      verplichtingen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel42
  - number: '45.1'
    text: 'De uitvoeringskosten van het Uitvoeringsinstituut werknemersverzekeringen komen ten laste van:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
  - number: 45.1.a
    text: |-
      de fondsen, bedoeld in [artikel 1, onderdelen j tot en met m, van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
  - number: 45.1.c
    text: |-
      het Arbeidsongeschiktheidsfonds jonggehandicapten, genoemd in
      [artikel 5:1 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 45.1.d
    text: |-
      het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '31'
  - number: 45.1.e
    text: de daartoe door Onze Minister of Onze Minister wie het aangaat toegekende rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
  - number: '45.2'
    text: 'De uitvoeringskosten van de Sociale verzekeringsbank komen ten laste van:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
  - number: 45.2.a
    text: |-
      de fondsen, bedoeld in [artikel 1, onderdelen f en g, van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
  - number: 45.2.b
    text: |-
      het Algemeen Kinderbijslagfonds, genoemd in [artikel 29a van de Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel29a
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 29a
  - number: 45.2.c
    text: |-
      de daartoe door Onze Minister toegekende rijksbijdrage, die in ieder geval strekt tot financiering van subsidies
      en uitkeringen op grond van de [Kaderwet SZW-subsidies][ref1], of de daartoe door Onze Minister wie het aangaat
      toegekende rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0008754
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008754
  - number: '45.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de verdeling van de uitvoeringskosten over de fondsen en
      de rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel45
  - number: '46.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen ieder elk jaar een jaarplan
      met begroting voor het komende kalenderjaar vast en bieden dit vóór een door hem vast te stellen datum aan Onze
      Minister aan. Een besluit tot vaststelling van het jaarplan met begroting behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel46
  - number: '46.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud en de indiening van het jaarplan met begroting.
      Ten aanzien van het Uitvoeringsinstituut werknemersverzekeringen hebben deze regels in ieder geval betrekking op
      de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel46
  - number: '46.3'
    text: |-
      Onze Minister brengt het in het eerste lid bedoelde jaarplan alsmede zijn oordeel daarover jaarlijks ter kennis van
      de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel46
  - number: '47.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank behoeven, tenzij het desbetreffende
      besluit in het door Onze Minister goedgekeurde jaarplan met begroting is opgenomen, de voorafgaande instemming van
      Onze Minister voor een besluit tot:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.a
    text: het oprichten dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.e
    text: |-
      het aangaan van overeenkomsten waarbij de betrokken rechtspersoon zich verbindt tot zekerheidstelling met inbegrip
      van zekerheidstelling voor schulden van derden of waarbij deze zich als borg of hoofdelijk medeschuldenaar verbindt
      of zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.f
    text: het vormen van fondsen en reserveringen;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: 47.1.g
    text: het doen van aangifte tot faillissement of het aanvragen van surséance van betaling van de betrokken rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: '47.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid, waarin in ieder geval kan
      worden bepaald, dat ten aanzien van de situaties, bedoeld in het eerste lid, onderdelen b tot en met f, beneden een
      bepaald bedrag de voorafgaande instemming van Onze Minister niet is vereist.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel47
  - number: '48.1'
    text: |-
      Onze Minister stelt jaarlijks vóór 1 december het budget voor de uitvoeringskosten van het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank voor het eerstvolgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister kan besluiten het budget voor de uitvoeringskosten van het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank te wijzigen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel48
  - number: '48.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank gaan met betrekking tot de
      uitvoering van verzekeringen en wetten geen verplichtingen aan en doen geen uitgaven die leiden tot overschrijden
      van het voor hen vastgestelde budget voor de uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel48
  - number: '48.4'
    text: |-
      Wanneer het budget voor de uitvoeringskosten van de in het eerste lid genoemde rechtspersonen niet is vastgesteld
      vóór 1 januari van het kalenderjaar waarop de begroting betrekking heeft, zijn deze rechtspersonen bevoegd,
      teneinde hun activiteiten gaande te houden, te beschikken over ten hoogste een derde gedeelte van het budget dat
      laatstelijk voor hen voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel48
  - number: '48.5'
    text: |-
      Onze Minister kan besluiten dat een in het tweede lid genoemde rechtspersoon, in een geval als bedoeld in het
      vierde lid, kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor deze rechtspersoon
      voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel48
  - number: '49.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank bieden jaarlijks een jaarverslag
      en een jaarrekening vóór 15 maart aan Onze Minister aan en zenden het jaarverslag vóór de derde woensdag in mei aan
      beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
  - number: '49.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen tussentijdse verslagen op
      en bieden deze op een bij ministeriële regeling te bepalen tijdstip aan Onze Minister aan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
  - number: '49.3'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank accountants in dienst hebben
      aangesteld, is:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
  - number: 49.3.a
    text: |-
      het bepaalde bij en krachtens de [artikelen 25][ref1] en [27 van de Wet toezicht accountantsorganisaties][ref2] van
      overeenkomstige toepassing op deze accountants;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '27'
  - number: 49.3.b
    text: |-
      het bepaalde bij en krachtens de [artikelen 14][ref1], [18][ref2], [19][ref3], [20][ref4] en
      [21 van de Wet toezicht accountantsorganisaties][ref5] van overeenkomstige toepassing op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel21
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0019468
        artikel: '21'
  - number: 49.3.c
    text: |-
      het bepaalde bij en krachtens de [artikelen 15][ref1] en [16 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank waarbij de in de aanhef bedoelde
      accountants werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: '49.4'
    text: |-
      Onze Minister brengt de jaarrekeningen en jaarverslagen van het Uitvoeringsinstituut werknemersverzekeringen en de
      Sociale verzekeringsbank alsmede zijn oordeel daaromtrent jaarlijks vóór de derde woensdag in mei ter kennis van de
      beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
  - number: '49.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over het jaarverslag, de jaarrekening, de
      accountantscontrole, de accountantsverklaring en het aan die verklaring ten grondslag liggende onderzoek en de
      tussentijdse verslagen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel49
  - number: '51.1'
    text: |-
      Onze minister verstrekt jaarlijks ten laste van ’s Rijks kas aan de Sociale verzekeringsbank een uitkering
      voor de kosten van de door haar toegekende algemene bijstand in de vorm van een aanvullende inkomensvoorziening
      ouderen, bedoeld in [artikel 47a, eerste lid, van de Participatiewet][ref1] en voor de daarbij verschuldigde
      loonbelasting, premies voor de volksverzekeringen en de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 42 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel42
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '42'
  - number: '51.2'
    text: De Sociale verzekeringsbank beheert en administreert de uitkering afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel51
  - number: '51.3'
    text: |-
      Dit hoofdstuk is van toepassing voor begroting, beheer en verantwoording door de Sociale verzekeringsbank van de
      uitvoering van [paragraaf 5.4 van de Participatiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf5.4
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015703
        paragraaf: '5.4'
  - number: '51.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de berekening van het bedrag van
      de uitkering en de daarvoor noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel51
  - number: '52'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over onder meer de maximaal toegestane omvang van de
      door het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank te vormen egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel52
  - number: '54.1'
    text: |-
      Een ieder verstrekt op verzoek aan het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank
      en Onze Minister en de Nederlandse Arbeidsinspectie, kosteloos, alle gegevens en inlichtingen die noodzakelijk zijn
      voor de uitvoering van bij of krachtens deze wet of enige andere wet door het desbetreffende bestuursorgaan en de
      Nederlandse Arbeidsinspectie uit te voeren taken ten opzichte van:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.1.a
    text: de betrokken persoon zelf;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.1.b
    text: de persoon in wiens dienst of voor wie hij arbeid verricht, heeft verricht of zou kunnen gaan verrichten;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.1.c
    text: de persoon, die in zijn dienst of voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.2'
    text: |-
      Een ieder kan uit eigen beweging de in het eerste lid bedoelde gegevens en inlichtingen aan de in het eerste lid
      bedoelde bestuursorganen en aan de Nederlandse Arbeidsinspectie verstrekken.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.3'
    text: |-
      Alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de in het eerste lid bedoelde taken
      worden aan de in dat lid genoemde bestuursorganen en aan de Nederlandse Arbeidsinspectie op verzoek, kosteloos,
      tevens verstrekt door:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.a
    text: de colleges van burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.b
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.c
    text: |-
      de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de
      taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] en de arbodienst, bedoeld in de
      [Arbeidsomstandighedenwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
  - number: 54.3.d
    text: |-
      het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref1], de zorgverzekeraars, bedoeld in
      de [Zorgverzekeringswet][ref2], en de Wlz-uitvoerder bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '1'
  - number: 54.3.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen, stichtingen tot uitvoering van een
      regeling inzake vervroegd uittreden, en andere organen belast met het doen van uitkeringen of verstrekkingen die
      bij of krachtens [artikel 6 van de Toeslagenwet][ref1] als inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel6
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '6'
  - number: 54.3.f
    text: |-
      de Kamer van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 54.3.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 54.3.h
    text: |-
      Onze Minister van Veiligheid en Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is ontnomen
      of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.i
    text: |-
      de door Onze Minister aangewezen ambtenaren als bedoeld in [artikel 14 van de Wet arbeid vreemdelingen][ref1] en
      [artikel 24 van de Arbeidsomstandighedenwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 54.3.j
    text: |-
      griffiers van colleges, geheel of ten dele met rechtspraak belast, desgevraagd in de vorm van uittreksels uit of
      afschriften van uitspraken, registers en andere stukken;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.k
    text: Onze Minister van Onderwijs, Cultuur en Wetenschap;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.3.l
    text: |-
      het Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in de
      [Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007292
  - number: 54.3.m
    text: |-
      Onze Minister voor zover het betreft de uitvoering van [Wet inburgering 2021][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0044770
  - number: 54.3.n
    text: |-
      Onze Minister en de colleges van burgemeester en wethouders voor zover het gegevens betreft die verwerkt worden in
      het landelijk register kinderopvang, bedoeld in de [Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: '54.4'
    text: |-
      De in het eerste en derde lid bedoelde gegevens en inlichtingen worden op verzoek, binnen de daarbij gestelde
      termijn, verstrekt in schriftelijke vorm of in een andere vorm die redelijkerwijs kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.5'
    text: |-
      Degene op wie de in het eerste en derde lid bedoelde verplichting rust geeft op verzoek aan een bestuursorgaan
      als bedoeld in het eerste lid, alsmede aan de Nederlandse Arbeidsinspectie inzage in alle bescheiden en andere
      gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de ter zake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van de in het eerste lid bedoelde taken
      door het in dat lid bedoelde bestuursorgaan en de Nederlandse Arbeidsinspectie.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.6'
    text: |-
      De Belastingdienst verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank,
      zonder dat daaraan een verzoek ten grondslag ligt, gegevens over samenloop van een uitkering met inkomen uit of in
      verband met arbeid of bedrijf of over vermogen, die bij de uitvoering van een belastingwet of bij de invordering
      van enige rijksbelasting bekend zijn geworden, voor zover die gegevens noodzakelijk zijn voor de uitvoering
      van de in het eerste lid bedoelde taken met betrekking tot het verstrekken van uitkeringen en taken, bedoeld in
      [artikel 30, vijfde lid][ref1], en [artikel 34, tweede lid][ref2]. Voorts verstrekt de Belastingdienst aan de
      Sociale verzekeringsbank, zonder dat daaraan een verzoek ten grondslag ligt, gegevens over verzekerde en niet
      verzekerde tijdvakken, die bij de uitvoering van een belastingwet of bij de invordering van enige rijksbelasting
      bekend zijn geworden, voor zover die gegevens noodzakelijk zijn voor de verzekerdenadministratie, bedoeld in
      [artikel 35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
        hoofdstuk: '6'
  - number: '54.7'
    text: |-
      Onze Minister van Buitenlandse Zaken verstrekt ten aanzien van de Nederlander die in het buitenland rechtens
      zijn vrijheid is ontnomen, onverwijld en kosteloos de gegevens en inlichtingen waarover hij beschikt en die
      noodzakelijk zijn voor het recht op uitkering, aan de Sociale verzekeringsbank en het Uitvoeringsinstituut
      werknemersverzekeringen, waarbij hij gebruik kan maken van het burgerservicenummer. Bij ministeriële regeling
      kunnen regels worden gesteld over de uitvoering van dit lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.8'
    text: |-
      Alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de in het eerste lid bedoelde taken,
      worden aan de in dat lid genoemde bestuursorganen tevens verstrekt door:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.8.a
    text: de instanties die in het kader van de openbare nutsvoorzieningen energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: 54.8.b
    text: de instanties en personen die woonruimte verhuren.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.9'
    text: |-
      Onze Minister van Veiligheid en Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, onverwijld en kosteloos de gegevens en alle overige opgaven en inlichtingen, waarover deze beschikt
      en die noodzakelijk zijn voor het recht op uitkering, aan de Sociale verzekeringsbank en het Uitvoeringsinstituut
      werknemersverzekeringen, waarbij hij gebruik kan maken van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.10'
    text: |-
      Re-integratiebedrijven verstrekken aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en
      inlichtingen die noodzakelijk zijn voor de uitvoering van de krachtens deze wet aan het Uitvoeringsinstituut
      opgedragen taken. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de gegevens die
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '54.11'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het derde, zesde, zevende, achtste en
      negende lid worden aangewezen, waarvoor de verplichtingen, bedoeld in het derde, vierde en vijfde lid, eveneens
      gelden, voor zover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen gegevens
      en inlichtingen, en bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor het
      verder verwerken van voor het toezicht op de naleving van wetten ontvangen gegevens met het oog op de opsporing van
      strafbare feiten als bedoeld in [artikel 85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel85
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '85'
        hoofdstuk: '11'
  - number: '54.12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de voorwaarden, die aan de
      gegevensverstrekking op grond van dit artikel worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel54
  - number: '55.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank stellen bij de uitoefening
      van hun taak de identiteit van de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], voorzover dit
      noodzakelijk is voor de uitoefening van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '55.2'
    text: |-
      Een ieder verstrekt op verzoek onverwijld aan de in het eerste lid genoemde rechtspersonen inzage in een op hem
      betrekking hebbend document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], voorzover dit
      redelijkerwijs nodig is voor de uitvoering van wettelijke taken door de betrokken rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '55.3'
    text: |-
      De werkgever treft in zijn bedrijf zodanige maatregelen dat de daar werkzame personen gedurende de arbeidstijd aan
      de verplichting bedoeld in het tweede lid kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel55
  - number: 55a.1
    text: |-
      Met het toezicht op de naleving van de in de [artikelen 30, eerste lid][ref1], [32d][ref2],
      [34, eerste lid, onderdelen a en d][ref3], en [34a][ref4], bedoelde wet- en regelgeving en de [artikelen 54][ref5]
      en [55][ref6], voor zover het geen verplichtingen betreft die betrekking hebben op het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank, zijn belast de door ieder van hen afzonderlijk bij besluit
      aangewezen, onder hen ressorterende personen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32d
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel34a
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel55
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 32d
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: 34a
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '55'
        hoofdstuk: '9'
  - number: 55a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel55a
  - number: '61'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Belastingdienst en de Sociale verzekeringsbank zijn verplicht,
      indien zij bij de uitvoering van deze wet en de [Wet financiering sociale verzekeringen][ref1] het gegronde
      vermoeden krijgen van een misdrijf dat is gepleegd ten nadele van deze organen of een ander orgaan, voorzover
      dit is belast met het verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van premies en
      bijdragen, het betrokken orgaan hiervan in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '62.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges
      van burgemeester en wethouders verstrekken elkaar uit eigen beweging en op verzoek, kosteloos,
      alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de taken die bij of
      krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut werknemersverzekeringen,
      de Sociale verzekeringsbank en bij of krachtens de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], de
      [Wet gemeentelijke schuldhulpverlening][ref4] of bij of krachtens andere wetten aan de colleges van burgemeester en
      wethouders zijn opgedragen, voor zover dit voortvloeit uit de samenwerking, bedoeld in [artikel 9][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0031331
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel9
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0031331
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '9'
        hoofdstuk: '3'
  - number: '62.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van
      burgemeester en wethouders dragen gezamenlijk zorg voor de instandhouding van elektronische voorzieningen
      voor de verwerking van de gegevens, bedoeld in het eerste lid, voor zover dat noodzakelijk is voor de
      uitvoering van de taken die bij of krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank en bij of krachtens de [Participatiewet][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] of de
      [Wet gemeentelijke schuldhulpverlening][ref4] aan colleges van burgemeester en wethouders zijn opgedragen.
      De elektronische voorzieningen hebben mede betrekking op de verwerking van gegevens waarvan de verkrijging
      en verstrekking door de in de eerste zin genoemde bestuursorganen op grond van enig wettelijk voorschrift is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0031331
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0031331
  - number: '62.3'
    text: |-
      Bij de gegevensverwerking voor de uitvoering van de diensten en taken, bedoeld in [artikel 10][ref1], zijn
      het Uitvoeringsinstituut werknemersverzekeringen en de colleges van burgemeester en wethouders gezamenlijke
      verwerkingsverantwoordelijken als bedoeld in artikel 26 van de Algemene verordening gegevensbescherming voor
      de verwerking van gegevens voor de uitvoering van taken ten aanzien van dezelfde uitkeringsgerechtigde of
      werkzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '3'
  - number: '62.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het tweede en derde lid in
      ieder geval met betrekking tot de inrichting, het beheer en de beveiliging van de elektronische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel62
  - number: '63'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de taken, de financiering en het beheer
      van het Inlichtingenbureau bij de toepassing van de in [artikel 62][ref1] genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '64.1'
    text: |-
      Ten behoeve van een integraal overheidsoptreden ten aanzien van de voorkoming en bestrijding van onrechtmatig
      gebruik van overheidsgelden en overheidsvoorzieningen op het terrein van de sociale zekerheid en de
      inkomensafhankelijke regelingen, de voorkoming en bestrijding van belasting- en premiefraude en het niet naleven
      van de arbeidswetten, wordt samengewerkt door:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: 64.1.a
    text: |-
      de colleges van burgemeester en wethouders, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank, in verband met de uitvoering van de taken, bedoeld in [artikel 62][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: 64.1.b
    text: |-
      de personen die bij of krachtens wettelijk voorschrift zijn belast met het houden van toezicht op de naleving dan
      wel de uitvoering van andere regelgeving op het terrein van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: 64.1.c
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: 64.1.d
    text: |-
      andere bestuursorganen en personen voor zover zij zijn belast met een publiekrechtelijke taak en daartoe bij
      regeling van Onze Minister in overeenstemming met Onze Minister van Financiën zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: '64.2'
    text: |-
      In een samenwerkingsverband van twee of meer van de bestuursorganen en personen, bedoeld in het eerste lid,
      worden gegevens verwerkt, die ten behoeve van het doel, bedoeld in het eerste lid, noodzakelijk zijn voor dat
      samenwerkingsverband. Bij de gegevensverwerking in het samenwerkingsverband zijn de samenwerkende bestuursorganen
      en personen gezamenlijke verwerkingsverantwoordelijken als bedoeld in artikel 26 van de Algemene verordening
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: '64.3'
    text: |-
      Ingeval twee of meer van de in het eerste lid genoemde bestuursorganen en personen besluiten tot deelname aan een
      samenwerkingsverband zijn deze bestuursorganen en personen verplicht de noodzakelijke gegevens, bedoeld in het
      tweede lid, te verstrekken aan de in het samenwerkingsverband deelnemende bestuursorganen en personen.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: '64.4'
    text: |-
      In afwijking van het derde lid worden de noodzakelijke gegevens, bedoeld in het tweede lid, aan Onze Minister
      verstrekt indien een verzoek als bedoeld in [artikel 65, eerste lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
        hoofdstuk: '9'
  - number: '64.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het
      samenwerkingsverband, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel64
  - number: '65.1'
    text: |-
      Met inachtneming van het bepaalde in [artikel 64][ref1] verwerkt Onze Minister als verwerkingsverantwoordelijke
      op verzoek van de bestuursorganen en personen, bedoeld in artikel 64, eerste lid, gegevens, bedoeld in artikel 64,
      tweede lid, in het systeem risico indicatie voor het uitvoeren van risicoanalyses ten behoeve van het doel, bedoeld
      in artikel 64, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
        hoofdstuk: '9'
  - number: '65.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen uitsluitend worden gebruikt voor het doen van een risicomelding
      over een natuurlijke persoon of rechtspersoon ten behoeve van het doel, bedoeld in [artikel 64, eerste lid][ref1].
      Onder risicomelding wordt verstaan de verstrekking op naam uit het systeem risico indicatie die een constatering
      van een verhoogd risico op onrechtmatig gebruik van overheidsgelden en overheidsvoorzieningen op het terrein van
      de sociale zekerheid en de inkomensafhankelijke regelingen, belasting- en premiefraude dan wel het niet naleven van
      de arbeidswetten door een natuurlijke persoon of rechtspersoon bevat en waarvan de risicoanalyse, die bestaat uit
      gegevens uit het systeem risico indicatie die in samenhang wordt gepresenteerd, onderdeel is.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
        hoofdstuk: '9'
  - number: '65.3'
    text: 'Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.3.a
    text: |-
      doet in individuele gevallen risicomeldingen aan de bestuursorganen en personen, bedoeld in
      [artikel 64, eerste lid][ref1], voor zover het verzoek, bedoeld in het eerste lid, van hen afkomstig is en voor
      zover dat noodzakelijk is voor een goede uitvoering van hun wettelijke taak; en


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
        hoofdstuk: '9'
  - number: 65.3.b
    text: |-
      kan op verzoek risicomeldingen doen aan het openbaar ministerie en de politie voor zover dat noodzakelijk is voor
      de uitoefening van hun wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '65.4'
    text: |-
      Een ieder die krachtens dit artikel de beschikking krijgt over in een risicomelding neergelegde gegevens
      met betrekking tot een natuurlijke persoon of rechtspersoon als bedoeld in het tweede lid, is verplicht tot
      geheimhouding daarvan met overeenkomstige toepassing van de ten aanzien van de gegevens geldende wettelijke
      geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '65.5'
    text: |-
      Onze Minister bewaart het gegeven dat een risicomelding heeft plaatsgevonden niet langer dan noodzakelijk is voor
      het doel van het verwerken van de risicomeldingen maar niet langer dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '65.6'
    text: |-
      Het bestuursorgaan of de persoon die een risicomelding ontvangt, kan gedurende twee jaren gebruik maken van de
      risicomelding en koppelt de resultaten van de risicomelding terug aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '65.7'
    text: |-
      De gegevens, bedoeld in het tweede lid, worden uit het systeem risico indicatie verwijderd uiterlijk twee jaren na
      opneming in het systeem.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '65.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het bepaalde in dit artikel.
      Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.a
    text: het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.b
    text: de voorwaarden voor het verzoek, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.c
    text: |-
      de wijze waarop de gegevens ten behoeve van het systeem risico indicatie worden verstrekt en de gegevens die in het
      systeem worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.d
    text: het aanwijzen van een verwerker;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.e
    text: |-
      de taak van de verwerker waaronder pseudonimisering van de in het tweede lid genoemde gegevens voor het uitvoeren
      van een risicoanalyse in het systeem risico indicatie;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.f
    text: de analyse van de gegevens door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.g
    text: de wijze waarop de verstrekking van gegevens uit het systeem risico indicatie plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: 65.8.h
    text: |-
      een door Onze Minister uit te voeren evaluatie naar aanleiding van de ontvangen terugkoppelingen, bedoeld in het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel65
  - number: '72'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de colleges van burgemeester en wethouders en de Sociale
      verzekeringsbank verstrekken op verzoek, kosteloos, aan Onze Minister en, in overeenstemming met Onze Minister,
      aan de Minister die belast is met aangelegenheden betreffende beleid bij de uitvoering waarvan het betrokken
      bestuursorgaan een taak heeft, alle gegevens en inlichtingen die voor de uitoefening van de taak van Onze Minister
      en van Onze betrokken Minister noodzakelijk zijn. Zij verlenen Onze Minister op verzoek toegang tot en inzage
      in gegevens en bescheiden voor zover dat voor de uitoefening van zijn taken en van Onze Minister wie het aangaat
      noodzakelijk is. Bij ministeriële regeling kunnen regels worden gesteld voor de termijn waarbinnen en de wijze
      waarop aan de in dit artikel bedoelde verplichtingen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel72
  - number: 72a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van burgemeesters en
      wethouders verstrekken op verzoek aan Onze Minister ten behoeve van de onder hem ressorterende opsporingsdienst
      kosteloos de bij of krachtens algemene maatregel van bestuur bepaalde gegevens en inlichtingen, die nodig zijn
      om de betreffende uitvoeringsinstantie die gegevens te kunnen verstrekken noodzakelijk voor de uitvoering van de
      wettelijke taken bedoeld in:
    url: https://wetten.overheid.nl/BWBR0013060/2026-01-01#Artikel72a
  - number: 72a.1.a
    text: |-
      [artikel 7d van de Algemene Kinderbijslagwet][ref1];


