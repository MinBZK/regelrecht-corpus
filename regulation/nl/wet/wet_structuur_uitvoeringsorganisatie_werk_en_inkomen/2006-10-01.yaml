      Gegevensregister Suwi: de weergave van de definities, de structuur en de schrijfwijze van de gegevens die door ten
      minste twee van de in [artikel 62, tweede lid][ref1], genoemde rechtspersonen worden gebruikt bij het aan elkaar
      verstrekken van gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
    references:
