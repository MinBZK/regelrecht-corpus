  - number: 82a.2
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vijf jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. De tweede volzin van het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82a
  - number: 82a.3
    text: |-
      Onze Minister kan op gezamenlijk verzoek van de Centrale organisatie werk en inkomen en burgemeester en
      wethouders dan wel van de Centrale organisatie werk en inkomen en het Uitvoeringsinstituut werknemersverzekeringen
      dan wel van de Centrale organisatie werk en inkomen, burgemeester en wethouders en het Uitvoeringsinstituut
      werknemersverzekeringen, gemeenten dan wel Centra voor werk en inkomen aanwijzen waar overeenkomstig de bij en
      krachtens dit artikel gestelde regels door de Centrale organisatie werk en inkomen en burgemeester en wethouders
      of het Uitvoeringsinstituut werknemersverzekeringen wordt deelgenomen aan een experiment. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van deze bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82a
  - number: 82a.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen worden getroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82a
  - number: 82a.5
    text: |-
      Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82a
  - number: 82a.6
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82a
  - number: '83'
    text: |-
      Tegen een besluit op grond van [artikel 48, eerste, tweede en zesde lid][ref1], kan de Raad voor werk en
      inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank beroep instellen bij de Centrale Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel48
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '48'
        hoofdstuk: '8'
  - number: 83a
    text: |-
      Bij een besluit op grond van [artikel 83i][ref1] is belanghebbende de persoon op wiens aanspraken het besluit
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83i
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83i
        hoofdstuk: 10B
  - number: 83b
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift tegen een
      beschikking als bedoeld in [artikel 83i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel83i
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 83i
        hoofdstuk: 10B
  - number: 83c.1
    text: |-
      Indien de persoon, bedoeld in [artikel 54, eerste lid, onderdelen b en c][ref1], die gehouden is tot het
      verstrekken van gegevens en inlichtingen op grond van [artikel 54, eerste lid][ref2], aan het Uitvoeringsinstituut
      werknemersverzekeringen of de Centrale organisatie werk en inkomen, en hij deze niet dan wel niet binnen
      de op grond van [artikel 54, vierde lid][ref3], gestelde termijn verstrekt, kan het Uitvoeringsinstituut
      werknemersverzekeringen hem een bestuurlijke boete van ten hoogste € 1500 opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
  - number: 83c.2
    text: |-
      Indien het aan opzet of grove schuld van de persoon, bedoeld in het eerste lid, is te wijten dat geen, dan wel
      onjuiste of onvolledige inlichtingen zijn verstrekt kan het Uitvoeringsinstituut werknemersverzekeringen hem een
      bestuurlijke boete opleggen van ten hoogste € 5000.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83c
  - number: 83c.3
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren na de dag waarop de in
      [artikel 54, vierde lid][ref1], gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
  - number: 83d.1
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de persoon, bedoeld in [artikel 83c][ref1], een
      handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem een bestuurlijke boete
      zal worden opgelegd, is die persoon niet langer verplicht in verband hiermee enige verklaring af te leggen. Die
      persoon wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83d
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
  - number: 83d.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om een boete op grond van [artikel 83c][ref1]
      op te leggen, wordt hiervan kennis gegeven aan de persoon, bedoeld in [dat artikel][ref2], onder vermelding van de
      gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83d
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
  - number: 83d.3
    text: |-
      Indien de persoon de kennisgeving wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van die persoon zorg voor dat de in de
      kennisgeving vermelde gronden worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83d
  - number: 83d.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de persoon in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar
      voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 83d.5
    text: |-
      Indien de persoon zijn zienswijze mondeling naar voren brengt, en hij de Nederlandse taal onvoldoende beheerst,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er zorg voor dat een tolk wordt benoemd die de persoon kan
      bijstaan, tenzij redelijkerwijs mag worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83d
  - number: 83e.1
    text: |-
      De beschikking waarbij de boete is opgelegd, vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83e
  - number: 83e.2
    text: |-
      Indien de persoon, bedoeld in [artikel 83c][ref1], de beschikking wegens zijn gebrekkige kennis van de Nederlandse
      taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut werknemersverzekeringen er zorg voor dat de in de
      beschikking vermelde informatie wordt medegedeeld in een voor die persoon begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83e
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
  - number: 83e.3
    text: |-
      De beschikking waarbij de boete is opgelegd levert een executoriale titel op in de zin van
      [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83e
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 83e.4
    text: |-
      Bij gebreke van tijdige betaling wordt de beschikking waarbij de boete is opgelegd met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op de kosten van de persoon, bedoeld in [artikel 83c][ref2],
      betekend tenuitvoergelegd en wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de invordering
      betrekking hebbende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83e
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
  - number: 83f.1
    text: |-
      Een boete wordt niet opgelegd zolang het feit op grond waarvan de boete kan worden opgelegd wordt onderzocht door
      het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83f
  - number: 83f.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien terzake van dat feit tegen de persoon een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot
      strafvordering is vervallen op grond van [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 83f.3
    text: |-
      Het Openbaar Ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83f
  - number: 83g.1
    text: |-
      Een boete op grond van [artikel 83c][ref1] wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut
      werknemersverzekeringen de persoon, bedoeld in [artikel 83c][ref2], overeenkomstig [artikel 83d][ref3] in de
      gelegenheid heeft gesteld zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel83d
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83g
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 83d
        hoofdstuk: 10A
  - number: 83g.2
    text: |-
      Indien aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag
      na die waarop het Openbaar Ministerie aan het Uitvoeringsinstituut werknemersverzekeringen heeft medegedeeld dat
      geen strafvervolging wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83g
  - number: 83h.1
    text: |-
      Geen boete wordt opgelegd indien de persoon, bedoeld in [83c, eerste lid][ref1], is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83h
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
        hoofdstuk: 10A
  - number: 83h.2
    text: |-
      Voorzover een boete nog niet is geïnd of betaald, vervalt zij door het overlijden van de persoon aan wie zij is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83h
  - number: 83i.1
    text: |-
      Tot 1 januari 2009 geeft het Uitvoeringsinstituut werknemersverzekeringen uiterlijk 18 maanden na
      afloop van ieder tijdvak van vijf kalenderjaren aan de werknemer, bedoeld in de Werkloosheidswet, van
      wie in dat tijdvak door het Uitvoeringsinstituut werknemersverzekeringen gegevens zijn verwerkt op
      grond van deze wet, een beschikking waarin van ieder kalenderjaar in dat tijdvak is aangegeven of hij
      over 52 of meer dagen loon heeft ontvangen als bedoeld in [artikel 42 van de Werkloosheidswet][ref1] en
      [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel15
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '15'
  - number: 83i.2
    text: |-
      De in het eerste lid bedoelde beschikking wordt door het Uitvoeringsinstituut werknemersverzekeringen aangehouden
      indien van de in dat lid bedoelde persoon geen adresgegevens worden verwerkt in de polisadministratie, bedoeld in
      [artikel 33][ref1]. In dat geval wordt de beschikking niet eerder gegeven dan dat de adresgegevens bekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83i
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: 83i.3
    text: |-
      Op verzoek van belanghebbende geeft het Uitvoeringsinstituut werknemersverzekeringen een beschikking over
      tijdvakken die niet zullen worden bestreken door de in het eerste lid bedoelde beschikking waarin van ieder
      kalenderjaar in dat tijdvak wordt aangegeven of hij over 52 of meer dagen loon heeft ontvangen als bedoeld in
      [artikel 42 van de Werkloosheidswet][ref1] en [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel15
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '15'
  - number: 83i.4
    text: |-
      Bij de vaststelling van het aantal kalenderjaren, bedoeld in het eerste en derde lid, is
      [artikel 42a van de Werkloosheidswet][ref1] met betrekking tot [artikel 42 van die wet][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 42a
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
  - number: 83i.5
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83i
  - number: 83j.1
    text: |-
      Beschikkingen die de Raad voor werk en inkomen namens Onze Minister van Sociale
      Zaken en Werkgelegenheid heeft genomen op grond van een regeling gebaseerd op
      [artikel 20][ref1], zoals dat artikel luidde voor de datum van inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ______________________________ in verband met wijziging van de taken en de werkwijze van de Raad voor werk en
      inkomen, blijven van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017841#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83j
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '20'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017841
        artikel: I
  - number: 83j.2
    text: |-
      Met betrekking tot de uitvoering van een regeling op grond van [artikel 20][ref1],
      zoals dat artikel luidde voor de datum van inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ____________________________ in verband met wijziging van de taken en de werkwijze van de Raad voor werk en
      inkomen, blijft het recht zoals dat voor die datum gold van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017841#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83j
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '20'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017841
        artikel: I
  - number: 83j.3
    text: |-
      Met betrekking tot bezwaarschriften en bestuursrechtelijke gedingen inzake beschikkingen als bedoeld in het eerste
      lid dan wel gebaseerd op het tweede lid, blijft het recht zoals dat gold voor de datum van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ____________________________ in verband met wijziging van de taken en de werkwijze van de Raad voor werk en
      inkomen, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017841#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83j
    references:
      - id: ref1
        bwb_id: BWBR0017841
        artikel: I
  - number: 83k.1
    text: |-
      De werkzaamheden, die worden verricht uit hoofde van de uitoefening van de taak,
      bedoeld in [artikel 10 van de Wet op de (re)integratie arbeidsgehandicapten][ref1],
      zoals dit artikel luidde tot de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2],
      waardoor [dit artikel 10][ref3] vervalt, worden aangemerkt als werkzaamheden uitgevoerd op grond van
      [artikel 30, zesde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83k
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: 83k.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in
      [artikel 30, eerste lid, onderdeel b][ref1], ten aanzien van personen die met toepassing van
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] geacht werden verzekerd te
      zijn voor de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] ook na de inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref4], waardoor
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref5] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel77
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83k
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '77'
  - number: 83k.3
    text: |-
      De kosten verband houdende met de uitvoering van het eerste en tweede lid komen ten laste van het Reïntegratiefonds,
      bedoeld in [artikel 2.8 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83k
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 83k.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de uitvoering van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83k
  - number: 83l
    text: |-
      [Artikel 30a][ref1] is niet van toepassing met betrekking tot de uitkeringsgerechtigde wiens recht op uitkering
      op grond van de in [dat artikel][ref2] genoemde wetten voor de dag van inwerkingtreding van [dat artikel][ref3]
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel83l
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
  - number: '84.1'
    text: |-
      Overtreding van de [artikelen 28, tweede lid][ref1], en [29, eerste lid][ref2],
      [54, eerste, vierde en vijfde lid][ref3], en [55, tweede en derde lid][ref4], van
      deze wet, [27a, vijfde lid][ref5], en [36, zesde lid, van de Werkloosheidswet][ref6],
      [33, vijfde lid][ref7], en [45a, vijfde lid, van de Ziektewet][ref8], [76, zesde lid][ref9], en
      [91, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10][29a, vijfde lid][ref11], en
      [57, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref12], [48, vijfde lid][ref13], en
      [63, zesde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref14], [40, vijfde lid][ref15],
      en [55, zesde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref16],
      [14a, vijfde lid][ref17], en [20, zesde lid, van de Toeslagenwet][ref18], [17c, vijfde lid][ref19],
      en [24, zesde lid, van de Algemene Ouderdomswet][ref20], [17a, vijfde lid][ref21], en
      [24, zesde lid, van de Algemene Kinderbijslagwet][ref22], [39, vijfde lid][ref23] en
      [53, zesde lid, van de Algemene nabestaandenwet][ref24], [artikel 21, vierde lid][ref25], [35, vijfde lid][ref26],
      en [46, vijfde lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref27] wordt gestraft met hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.


