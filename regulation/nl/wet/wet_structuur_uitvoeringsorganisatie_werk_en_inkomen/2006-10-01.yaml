        hoofdstuk: '9'
  - number: 1.s
    text: |-
      Stelselontwerp Suwinet: de beschrijving van de technische voorzieningen, de functionaliteiten en de specificaties
      die worden toegepast bij de inrichting en werking van Suwinet;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
  - number: 1.t
    text: |-
      Personenverwijsbestand: het bestand waarin wordt aangegeven welke personen met een sociaal-fiscaalnummer in
      registraties van de desbetreffende organisaties zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
  - number: 1.u
    text: 'doeltreffendheid: de mate waarin de doelstellingen van de bij of krachtens de wet gestelde regels werden bereikt;'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
  - number: 1.v
    text: 'klantmanager: functionaris die optreedt als begeleider en trajectcoördinator van een werkzoekende;'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
  - number: 1.w
    text: |-
      reïntegratiebedrijf: een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van beroep
      of bedrijf de inschakeling van personen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel1
  - number: '2.1'
    text: |-
      Er zijn een Centrale organisatie werk en inkomen, een Uitvoeringsinstituut werknemersverzekeringen en een Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel2
  - number: '2.2'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank hebben rechtspersoonlijkheid en hebben hun zetels op door Onze Minister te bepalen plaatsen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel2
  - number: '2.3'
    text: |-
      Het personeel van de in het eerste lid genoemde rechtspersonen wordt in dienst genomen op arbeidsovereenkomst naar
      burgerlijk recht. De bepalingen van de [tiende titel van boek 7 van het Burgerlijk Wetboek][ref1] zijn op deze
      overeenkomst van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '3.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank hebben elk een Raad van bestuur die met de dagelijkse leiding is belast en elk een Raad van advies
      die de betrokken Raad van bestuur adviseert.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.2'
    text: |-
      Een Raad van bestuur en een Raad van advies bestaan uit een door Onze Minister te bepalen aantal leden, onder wie
      een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de leden van de Raad van bestuur en de leden van de Raad van advies. De
      ondernemingsraad van elke in het eerste lid genoemde rechtspersoon kan voor de benoeming van één lid van de Raad
      van advies een aanbeveling doen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.4'
    text: |-
      Schorsing en ontslag vindt slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie, wegens
      het niet naleven van [artikel 4, eerste lid][ref1], dan wel wegens andere zwaarwegende in de persoon van de
      betrokkene gelegen of met deze verband houdende redenen. Ontslag vindt voorts plaats op eigen verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel4
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '4'
        hoofdstuk: '2'
  - number: '3.5'
    text: |-
      De Raad van bestuur oefent de taken en bevoegdheden uit die bij of krachtens deze wet of enige andere wet
      aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.6'
    text: Elke Raad van bestuur stelt een bestuursreglement vast, dat de goedkeuring behoeft van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.7'
    text: |-
      Op verzoek van de Raad van advies verstrekt de Raad van bestuur aan de Raad van advies alle gegevens en
      inlichtingen die deze voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '3.8'
    text: |-
      Alvorens het meerjarenbeleidsplan, het jaarplan, het jaarverslag, de begroting, de jaarrekening, een besluit als
      bedoeld in [artikel 6][ref1] of [artikel 13][ref2] aan Onze Minister wordt voorgelegd, legt de Raad van bestuur dit
      voor advies voor aan de Raad van advies.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel13
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '13'
        hoofdstuk: '2'
  - number: '3.9'
    text: |-
      Het advies van de Raad van advies over een document als bedoeld in het achtste lid, wordt door de Raad van bestuur
      bij aanbieding aan Onze Minister bij dat document gevoegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel3
  - number: '4.1'
    text: |-
      Een lid van de Raad van bestuur en een lid van de Raad van advies vervult geen nevenbetrekkingen die ongewenst
      zijn met het oog op een goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het
      vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel4
  - number: '4.2'
    text: |-
      Een lid van de Raad van bestuur en een lid van de Raad van advies meldt het voornemen tot het aanvaarden van een
      nevenfunctie anders dan uit hoofde van zijn functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel4
  - number: '4.3'
    text: |-
      Nevenfuncties van een lid van de Raad van bestuur en een lid van de Raad van advies anders dan uit hoofde van
      zijn functie worden openbaar gemaakt. Openbaarmaking geschiedt door het ter inzage leggen van een opgave van deze
      nevenfuncties bij de desbetreffende rechtspersoon en bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt de rechtspositie van de leden van de Raad van bestuur en de leden van de Raad van advies vast.
      Daarbij stelt hij in elk geval hun bezoldiging of schadeloosstelling vast, alsmede hun aanspraken op vergoeding van
      kosten die verband houden met hun functie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel5
  - number: '5.2'
    text: |-
      De leden van de Raad van bestuur en de leden van de Raad van advies genieten ten laste van de rechtspersoon waarbij
      zij benoemd zijn, geen andere inkomsten dan die bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister bepaalt de periode van benoeming van de leden van de Raad van bestuur en de leden van de Raad van
      advies en kan ook de mogelijkheid van hun herbenoeming regelen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel5
  - number: '5.4'
    text: |-
      Ten aanzien van de leden van de Raad van bestuur en de leden van de Raad van advies wordt met overeenkomstige
      toepassing van [artikel 383 van Boek 2 van het Burgerlijk Wetboek][ref1] verslag gedaan in het jaarverslag, bedoeld
      in [artikel 49][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '49'
        hoofdstuk: '8'
  - number: '6.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank behoeven de goedkeuring van Onze Minister voor een besluit tot:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.a
    text: het oprichten dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.e
    text: |-
      het aangaan van overeenkomsten waarbij de betrokken rechtspersoon zich verbindt tot zekerheidstelling met inbegrip
      van zekerheidstelling voor schulden van derden of waarbij deze zich als borg of hoofdelijk medeschuldenaar verbindt
      of zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.f
    text: het vormen van fondsen en reserveringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: 6.1.g
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor besluiten als bedoeld in het eerste lid in de bij die
      regeling omschreven gevallen de goedkeuring van Onze Minister niet is vereist.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel6
  - number: '8.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank werken samen met elkaar en met burgemeester en wethouders van de gemeenten om de inschakeling
      van uitkeringsgerechtigden en werkzoekenden in het arbeidsproces te bevorderen. Tevens werken zij samen met andere
      diensten en instellingen die werkzaamheden verrichten die verband houden met de uitoefening van hun taken. De
      samenwerking, bedoeld in dit lid, kan mede betrekking hebben op het uitwisselen van gegevens tussen de genoemde
      partijen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het eerste lid en kunnen
      werkzaamheden van het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank of de gemeenten
      worden aangewezen die worden verricht in een of meer Centra voor werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel8
  - number: '9'
    text: |-
      De Centra voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de colleges van burgemeester en
      wethouders bevorderen dat de werkzoekende en de uitkeringsgerechtigde een klantmanager als vast aanspreekpunt wordt
      toegewezen in hun relaties met de genoemde instanties.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel9
  - number: '10.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank stellen elk een regeling vast die gericht is op de realisatie en vormgeving van adequate
      cliëntenparticipatie bij de uitvoering van hun wettelijke taken. Deze regeling wordt door elk van de genoemde
      bestuursorganen in de Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: '10.2'
    text: |-
      In de regeling, bedoeld in het eerste lid, wordt voorzien in overleg met personen of vertegenwoordigers
      van personen die als cliënt betrokken zijn bij de uitvoering van de taken van de in het eerste lid genoemde
      bestuursorganen. Dit overleg vindt periodiek plaats, doch ten minste twee maal per jaar.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: '10.3'
    text: |-
      In de regeling, bedoeld in het eerste lid, wordt in ieder geval geregeld de wijze waarop de in het tweede lid
      bedoelde personen of vertegenwoordigers:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.a
    text: onderwerpen voor de agenda van het overleg, bedoeld in het tweede lid, kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.b
    text: voorzien worden van de voor een adequate deelname aan het overleg benodigde informatie;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.c
    text: |-
      betrokken worden bij de totstandkoming van het meerjarenbeleidsplan, het jaarplan en het jaarverslag van het
      betrokken bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.d
    text: gevraagd en ongevraagd kunnen adviseren over de uitvoering van de wettelijke taken van betrokken bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.e
    text: |-
      in staat gesteld worden op een adequate manier aan het overleg deel te nemen, waarbij ten minste aandacht besteed
      wordt aan logistieke faciliteiten, onkostenvergoedingen en deskundigheidsbevordering;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: 10.3.f
    text: beschermd worden tegen benadeling in verband met hun deelname aan het overleg.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: '10.4'
    text: |-
      In de regeling, bedoeld in het eerste lid, van de Centrale organisatie werk en inkomen en het Uitvoeringsinstituut
      werknemersverzekeringen wordt de betrokkenheid geregeld bij de totstandkoming van de non-discriminatiecode, bedoeld
      in de [artikelen 22][ref1] en [31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel31
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '22'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '31'
        hoofdstuk: '5'
  - number: '10.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere onderwerpen worden aangewezen die in elk geval in
      de regeling, bedoeld in het eerste lid, worden geregeld en kunnen nadere regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel10
  - number: '11.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de
      Sociale verzekeringsbank stellen elk, na overleg met de personen en vertegenwoordigers, bedoeld in
      [artikel 10, tweede lid][ref1], een regeling vast die gericht is op de realisatie en vormgeving van adequate
      cliëntenparticipatie op decentraal niveau. Deze regeling wordt door elk van de genoemde bestuursorganen in de
      Staatscourant gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '2'
  - number: '11.2'
    text: 'In de regeling, bedoeld in het eerste lid, wordt in ieder geval geregeld de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
  - number: 11.2.a
    text: |-
      personen en vertegenwoordigers van personen die als cliënt betrokken zijn bij de decentrale uitvoering van de taken
      van de in het eerste lid genoemde bestuursorganen, hierop invloed kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
  - number: 11.2.b
    text: |-
      door het betrokken bestuursorgaan op centraal niveau rekening wordt gehouden met de resultaten van
      cliëntenparticipatie op decentraal niveau;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
  - number: 11.2.c
    text: |-
      in iedere vestiging van het betrokken bestuursorgaan bekendheid wordt gegeven aan de wijze waarop uitvoering wordt
      gegeven aan dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de regeling, bedoeld in het eerste lid, voorziet in overleg op decentraal niveau, is
      [artikel 10, derde lid][ref1], ten aanzien van die regeling van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '2'
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere onderwerpen worden aangewezen die in elk geval in
      de regeling, bedoeld in het eerste lid, worden geregeld en kunnen nadere regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel11
  - number: '12.1'
    text: Er is een landelijke cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '12.2'
    text: |-
      De landelijke cliëntenraad bestaat uit zes vertegenwoordigers van landelijke cliëntenorganisaties, twee
      afgevaardigden uit elk van de overleggen, bedoeld in [artikel 10, tweede lid][ref1], alsmede uit drie
      afgevaardigden uit de cliëntenparticipatie bij de gemeenten. De afgevaardigden betreffen personen of
      vertegenwoordigers van personen die als cliënt betrokken zijn bij de uitvoering van de taken van het desbetreffende
      orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
        hoofdstuk: '2'
  - number: '12.3'
    text: 'De landelijke cliëntenraad heeft tot taak periodiek, doch ten minste eenmaal per jaar, te overleggen met:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: 12.3.a
    text: |-
      de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale
      verzekeringsbank, de gemeenten en Onze Minister over de vormgeving en realisatie van cliëntenparticipatie bij de
      desbetreffende organen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: 12.3.b
    text: |-
      de Raad voor werk en inkomen en Onze Minister over voorstellen van de landelijke cliëntenraad inzake beleidsvragen
      op het gebied van werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '12.4'
    text: |-
      De landelijke cliëntenraad heeft een secretariaat dat wordt ondergebracht bij de Raad voor werk en inkomen, en
      vervult zijn taak met de middelen die hem door Onze Minister ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '12.5'
    text: |-
      De landelijke cliëntenraad krijgt alle informatie van de in het derde lid genoemde instanties, voorzover hij deze
      voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '12.6'
    text: |-
      De landelijke cliëntenraad waakt tegen discriminatie wegens ras, geslacht, hetero- of homoseksuele gerichtheid,
      leeftijd en handicap.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '12.7'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel12
  - number: '13.1'
    text: |-
      Een besluit van de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen of de
      Sociale verzekeringsbank om andere dan de in deze wet bedoelde taken uit te voeren, behoeft de goedkeuring van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister kan aan de in het eerste lid genoemde rechtspersonen verplichtingen opleggen in verband met de
      uitvoering van andere taken als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister kan bepalen dat de uitvoering van andere taken als bedoeld in het eerste lid door de betrokken
      rechtspersoon wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel13
  - number: '13.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld dat een in het eerste lid genoemde rechtspersoon
      gegevens, die deze heeft verkregen bij de uitvoering van bepaalde in deze wet bedoelde taken, kan verwerken bij
      de uitvoering van andere taken als bedoeld in deze wet door deze rechtspersoon en de uitvoering van andere dan
      wettelijke taken door deze rechtspersoon. Een in het eerste lid genoemde rechtspersoon verstrekt in de in de eerste
      zin bedoelde maatregel bepaalde gegevens op verzoek aan een in die maatregel genoemde derde indien die gegevens
      noodzakelijk zijn voor de uitvoering van taken door die derden en deze taken naar hun aard gelijk zijn aan taken
      waarvoor op grond van het eerste lid goedkeuring is verleend. Bij of krachtens algemene maatregel van bestuur
      kunnen tevens regels worden gesteld omtrent de vergoeding van kosten van de gegevensverstrekking, bedoeld in de
      tweede zin.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel13
  - number: '13.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel13
  - number: '14.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan bepaald worden dat het Uitvoeringsinstituut
      werknemersverzekeringen en de colleges van burgemeester en wethouders de werkzaamheden gericht op de inschakeling
      in de arbeid van werknemers en uitkeringsgerechtigden slechts laten verrichten door reïntegratiebedrijven, die in
      het bezit zijn van een in het tweede lid bedoeld certificaat.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: '14.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte aan een in het eerste
      lid bedoelde natuurlijke dan wel rechtspersoon van een certificaat waaruit blijkt dat hij voldoet aan bij of
      krachtens deze algemene maatregel van bestuur gestelde kwaliteits- en deskundigheidseisen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister dan wel een door Onze Minister op grond van [artikel 15][ref1] aangewezen instelling beslist op
      aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel15
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '15'
        hoofdstuk: '2'
  - number: '14.4'
    text: |-
      Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: '14.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld die in ieder geval betrekking hebben
      op:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: 14.5.a
    text: |-
      de wijze waarop de aanvraag om een certificaat moet worden gedaan en de gegevens die daarbij van de aanvrager
      worden verlangd;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: 14.5.b
    text: |-
      de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een afgegeven
      certificaat kan worden ingetrokken;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: 14.5.c
    text: de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de wijze van betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan op verzoek een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 14, derde lid][ref1], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel14
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '14'
        hoofdstuk: '2'
  - number: '15.2'
    text: Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel15
  - number: '15.3'
    text: |-
      Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel15
  - number: '15.4'
    text: |-
      [Artikel 36][ref1], [37][ref2], [42][ref3], [78][ref4] en [81][ref5] zijn ten aanzien van de instelling, bedoeld in
      het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel78
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel81
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '36'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '42'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '78'
        hoofdstuk: '10'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '81'
        hoofdstuk: '10'
  - number: '15.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor: a. de gronden waarop de in het
      eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd; b. het opstellen van een verslag
      van werkzaamheden ten behoeve van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel15
  - number: '16.1'
    text: |-
      Er is een Raad voor werk en inkomen. De Raad voor werk en inkomen heeft rechtspersoonlijkheid en heeft zijn zetel
      op een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.2'
    text: |-
      De Raad voor werk en inkomen bestaat uit zestien leden, onder wie een voorzitter, en vijftien plaatsvervangende
      leden, die door Onze Minister worden benoemd en door hem kunnen worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.3'
    text: |-
      De daartoe door Onze Minister aangewezen algemeen erkende centrale organisaties van werknemers, de daartoe door hem
      aangewezen algemeen erkende en andere representatieve organisaties van werkgevers en de daartoe door hem aangewezen
      rechtspersoon, die de gemeenten vertegenwoordigt, doen aan Onze Minister een voordracht voor de benoeming van de
      leden en de plaatsvervangende leden van de Raad voor werk en inkomen. De aangewezen werknemersorganisaties doen
      daarbij een voordracht voor vijf leden en vijf plaatsvervangende leden, de aangewezen werkgeversorganisaties voor
      vijf leden en vijf plaatsvervangende leden en de aangewezen rechtspersoon die de gemeenten vertegenwoordigt voor
      vijf leden en vijf plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.4'
    text: Het derde lid is niet van toepassing op de voorzitter van de Raad voor werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.5'
    text: |-
      De leden van de Raad voor werk en inkomen worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal
      en telkens voor ten hoogste vier jaar plaatsvinden. De persoon die tussentijds als lid of als plaatsvervangend lid
      wordt benoemd, treedt af op het tijdstip waarop degene in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.6'
    text: |-
      Alvorens representatieve organisaties als bedoeld in het derde lid aan te wijzen, stelt Onze Minister de Sociaal-
      Economische Raad in de gelegenheid over de representativiteit van die organisaties advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.7'
    text: |-
      Onze Minister stelt de rechtspositie van de leden van de Raad voor werk en inkomen vast. Daarbij stelt hij in
      elk geval hun bezoldiging of schadeloosstelling vast, alsmede hun aanspraken op vergoeding van kosten die verband
      houden met hun functie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
  - number: '16.8'
    text: |-
      Het personeel van de Raad voor werk en inkomen wordt in dienst genomen op arbeidsovereenkomst naar burgerlijk
      recht. De bepalingen van de [tiende titel van boek 7 van het Burgerlijk Wetboek][ref1] zijn op deze overeenkomst
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '17.1'
    text: |-
      De Raad voor werk en inkomen heeft tot taak overleg te voeren met Onze Minister over voorstellen van deze Raad
      betreffende:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
  - number: 17.1.a
    text: het beleid met betrekking tot werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
  - number: 17.1.b
    text: het arbeidsmarktbeleid;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
  - number: 17.1.c
    text: de bevordering van de kwaliteit en de transparantie van de reïntegratiemarkt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
  - number: '17.2'
    text: |-
      De Raad voor werk en inkomen stelt een regeling op die voorziet in overleg over de in het eerste lid genoemde
      onderwerpen met personen of vertegenwoordigers van personen die als cliënt betrokken zijn bij uitvoering van die
      onderwerpen. Dit overleg vindt periodiek plaats, doch ten minste twee maal per jaar.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
  - number: '17.3'
    text: |-
      De Raad voor werk en inkomen overlegt met de landelijke cliëntenraad, bedoeld in [artikel 12][ref1], over de wijze
      waarop het overleg, bedoeld in het tweede lid, plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel12
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '12'
        hoofdstuk: '2'
  - number: '19.1'
    text: 'De Raad voor werk en inkomen behoeft de goedkeuring van Onze Minister voor een besluit tot:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.a
    text: het oprichten dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.e
    text: |-
      het aangaan van overeenkomsten waarbij de betrokken rechtspersoon zich verbindt tot zekerheidstelling met inbegrip
      van zekerheidstelling voor schulden van derden of waarbij deze zich als borg of hoofdelijk medeschuldenaar verbindt
      of zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.f
    text: het vormen van fondsen en reserveringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: 19.1.g
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: '19.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor besluiten als bedoeld in het eerste lid in de bij die
      regeling omschreven gevallen de goedkeuring van Onze Minister niet is vereist.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel19
  - number: '21'
    text: 'De Centrale organisatie werk en inkomen heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.a
    text: het registeren van werkzoekenden en van vacatures van werkgevers;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.b
    text: |-
      het voordragen van geschikte vacatures aan werkzoekenden en het voordragen van geschikte werkzoekenden voor
      vacatures;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.c
    text: |-
      het verzamelen en analyseren van informatie ten behoeve van de bevordering van de werking van en het inzicht in
      de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.d
    text: |-
      zorgdragen voor gevraagde en ongevraagde verstrekking van deugdelijke informatie en advies over de arbeidsmarkt
      alsmede over de uitvoering van zijn taak, aan werkgevers, werknemers, uitkeringsgerechtigden, verzekerden,
      werkzoekenden, regionale platforms, bedoeld in [artikel 23][ref1], en andere belanghebbenden;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel23
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '23'
        hoofdstuk: '4'
  - number: 21.e
    text: |-
      het adviseren van het Uitvoeringsinstituut werknemersverzekeringen en burgemeester en wethouders van de
      betrokken gemeente met betrekking tot mogelijkheden tot inschakeling in het arbeidsproces van moeilijk plaatsbare
      werkzoekenden;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.f
    text: |-
      het innemen van de in [artikel 28][ref1] bedoelde aanvragen voor uitkeringen, toeslagen en bijstand alsmede
      aangiften van werkloosheid;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
        hoofdstuk: '4'
  - number: 21.g
    text: |-
      het geven van voorlichting met betrekking tot de keuze van een beroep alsmede de voor een beroep benodigde
      opleiding;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.h
    text: |-
      het aan Onze Minister op zijn verzoek verstrekken van inlichtingen die
      nodig zijn voor de beoordeling van een verzoek om ontheffing als bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 21.i
    text: |-
      het uitvoeren van taken die bij of krachtens deze of enige andere wet aan de Centrale organisatie werk en inkomen
      zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.j
    text: |-
      het uitvoeren van bij algemene maatregel van bestuur dan wel bij ministeriële regeling of bij regeling in
      overeenstemming met Onze Minister aangewezen algemene maatregelen van bestuur en ministeriële regelingen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.k
    text: |-
      het in opdracht van Onze Minister of uit eigen beweging verrichten van onderzoek met betrekking tot de wettelijke
      taken van deze organisatie;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.l
    text: |-
      het aan Onze Minister op zijn verzoek verstrekken van de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voorzover deze betrekking hebben op onderwerpen
      als bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21.m
    text: het voeren van een adequate administratie ten behoeve van de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21
  - number: 21a.1
    text: |-
      Ten behoeve van de uitvoering van de [Wet sociale werkvoorziening][ref1] door burgemeester en wethouders van
      gemeenten heeft de Centrale organisatie werk en inkomen tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 21a.1.a
    text: |-
      na het verrichten van een onderzoek te besluiten over de indicatie, bedoeld in [artikel 11, eerste lid][ref1], en
      de herindicatie, bedoeld in [artikel 11, tweede lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel11
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '11'
  - number: 21a.1.b
    text: |-
      in het geval betrokkene tot de doelgroep van [die wet][ref1] behoort of blijft behoren aan het college van
      burgemeester en wethouders van de gemeente waar betrokkene woonachtig is te adviseren:


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 21a.1.b.1°
    text: welke aanpassing van omstandigheden nodig is bij het verrichten van arbeid door de betrokkene, en
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
  - number: 21a.1.b.2°
    text: |-
      of betrokkene in aanmerking komt voor toepassing van [hoofdstuk 3 van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: 21a.1.c
    text: |-
      in het geval betrokkene niet of niet meer tot de doelgroep van genoemde wet behoort aan het college van
      burgemeester en wethouders van de gemeente waar betrokkene woonachtig is of het Uitvoeringsinstituut
      werknemersverzekeringen te adviseren over de wijze waarop de mogelijkheden tot inschakeling in het arbeidsproces
      van betrokkene kunnen worden verbeterd, dan wel aan het college van burgemeester en wethouders waar betrokkene
      woonachtig is te adviseren over een doorgeleiding naar een indicatie voor een voorziening voor ondersteunende en
      activerende begeleiding. In het advies over de wijze waarop de mogelijkheden tot inschakeling in het arbeidsproces
      kunnen worden verbeterd, wordt van de opvattingen van de betrokkene, desgewenst in de door deze aangegeven
      bewoordingen, en, indien het advies hiervan afwijkt, van de redenen daarvoor, melding gedaan;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
  - number: 21a.1.d
    text: |-
      in de gevallen, bedoeld in [artikel 6, derde lid, van die wet][ref1] aan het college van burgemeester en wethouders
      van de gemeente waar betrokkene woonachtig is te adviseren omtrent de opzegging van de dienstbetrekking, bedoeld
      in [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0008903
  - number: 21a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het besluit, waaronder de minimale en
      de maximale geldigheidsduur van het besluit, de advisering en de wijze waarop de indicatie en de herindicatie tot
      stand komt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21a
  - number: 21b.1
    text: |-
      De Centrale organisatie werk en inkomen gebruikt het sociaal-fiscaalnummer bij de verwerking van persoonsgegevens
      voor de uitvoering van de taken, bedoeld in [artikel 21, onderdelen a, e, f, en h][ref1], voorzover dit betreft de
      uitvoering van het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2], en [artikel 21a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002014
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0002014
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 21a
        hoofdstuk: '4'
  - number: 21b.2
    text: |-
      De Centrale organisatie werk en inkomen verifieert het sociaal-fiscaalnummer in relatie tot de bijbehorende
      persoonsidentificerende gegevens van personen van wie persoonsgegevens worden verwerkt bij de rijksbelastingdienst,
      tenzij die gegevens afkomstig zijn van het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel21b
  - number: '22'
    text: |-
      Bij de uitvoering van de taken, bedoeld in de [artikelen 21][ref1] en [21a][ref2], waakt de Centrale organisatie
      werk en inkomen tegen discriminatie en stelt daartoe een non-discriminatiecode vast, waarin in ieder geval aandacht
      wordt besteed aan discriminatie wegens ras, geslacht, hetero- of homoseksuele gerichtheid, leeftijd en handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 21a
        hoofdstuk: '4'
  - number: '23.1'
    text: |-
      De colleges van burgemeester en wethouders van de gemeenten bevorderen door samenwerking met de colleges van
      burgemeester en wethouders van andere gemeenten op de regionale arbeidsmarkt de totstandkoming van regionale
      platforms waarin periodiek overleg plaatsvindt over werk en inkomen met andere partijen die op die markt actief
      zijn. De Centrale organisatie werk en inkomen ondersteunt desgevraagd door het voeren van het secretariaat de
      instandhouding van die platforms.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel23
  - number: '23.2'
    text: |-
      Indien overleg als bedoeld in het eerste lid niet in voldoende mate tot stand komt, kunnen, met ingang van twee
      jaar na het tijdstip van inwerkingtreding van dit artikel, bij of krachtens algemene maatregel van bestuur één of
      meer gemeenten worden aangewezen die bevorderen dat periodiek overleg als bedoeld in het eerste lid wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel23
  - number: '24.1'
    text: |-
      De Centrale organisatie werk en inkomen draagt zorg voor de inrichting en instandhouding van vestigingen,
      genaamd Centra voor werk en inkomen, waarin de taken van de Centrale organisatie werk en inkomen, bedoeld in de
      [artikelen 21, onderdelen a tot en met j][ref1], en [21a][ref2], worden uitgevoerd, op een wijze waardoor deze
      organisatie voor een ieder voldoende bereikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 21a
        hoofdstuk: '4'
  - number: '24.2'
    text: |-
      De Centrale organisatie werk en inkomen kan bepalen dat een of meer van haar wettelijke taken worden uitgevoerd in
      een of een beperkt aantal Centra voor werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel24
  - number: '24.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de inrichting, de instandhouding, de werkwijze en de
      financiering van de Centra voor werk en inkomen, onderscheiden naar verschillende centra.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel24
  - number: '24.4'
    text: |-
      Een besluit ter uitvoering van het eerste of tweede lid behoeft goedkeuring van Onze Minister en wordt na
      goedkeuring, door de Centrale organisatie werk en inkomen gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel24
  - number: '25.1'
    text: 'Het recht zich als werkzoekende door de Centrale organisatie werk en inkomen te laten registreren, komt toe aan:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: 25.1.a
    text: Nederlanders;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: 25.1.b
    text: |-
      vreemdelingen op wie artikel 1 of artikel 10 van [verordening (EEG) nr. 1612/68](31968R1612) van de Raad van de
      Europese Gemeenschappen van 15 oktober 1968 betreffende het vrij verkeer van werknemers binnen de Gemeenschap (PbEG
      1968, L257) van toepassing is;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: 25.1.c
    text: |-
      vreemdelingen die beschikken over een krachtens de [Vreemdelingenwet 2000][ref1] afgegeven vergunning, die is
      voorzien van een aantekening van Onze Minister van Justitie waaruit blijkt dat aan die vergunning geen beperkingen
      zijn verbonden voor het verrichten van arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 25.1.d
    text: vreemdelingen die behoren tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.2'
    text: |-
      Aan geregistreerde werkzoekenden wordt kosteloos een bewijs van registratie verstrekt. De Centrale organisatie werk
      en inkomen stelt regels ten aanzien van de gegevens die daarin worden vermeld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.3'
    text: |-
      De Centrale organisatie werk en inkomen regelt de termijnen gedurende welke de registratie ten hoogste wordt
      gehandhaafd en waarmee de registratie telkenmale, op verzoek van de betrokkene, ten hoogste kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.4'
    text: 'De registratie van een werkzoekende wordt beëindigd:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: 25.4.a
    text: op verzoek van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: 25.4.b
    text: |-
      indien een termijn als bedoeld in het derde lid is verstreken zonder dat de betrokkene een verzoek tot verlenging
      van de termijn heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.5'
    text: |-
      Iedere werkgever heeft het recht bij de Centrale organisatie werk en inkomen vacatures te laten registreren. De
      Centrale organisatie werk en inkomen stelt regels met betrekking tot deze registratie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.6'
    text: |-
      De op grond van dit artikel door de Centrale organisatie werk en inkomen vastgestelde regels worden door deze
      organisatie gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '25.7'
    text: |-
      De Centrale organisatie werk en inkomen neemt in de in dit artikel bedoelde registratie het sociaal-fiscaalnummer
      van de geregistreerde werkzoekende op.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel25
  - number: '26.1'
    text: |-
      De Centrale organisatie werk en inkomen beoordeelt van iedere op grond van [artikel 25][ref1] geregistreerde
      werkzoekende zijn kans op werk, onderzoekt op welke wijze die kans kan worden verbeterd en zorgt voor een
      administratieve indeling van de werkzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '25'
        hoofdstuk: '4'
  - number: '26.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de administratieve indeling, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel26
  - number: '26.3'
    text: |-
      Met betrekking tot moeilijk plaatsbare werkzoekenden adviseert de Centrale organisatie werk en inkomen, de
      betrokken werkzoekende gehoord, het Uitvoeringsinstituut werknemersverzekeringen dan wel burgemeester en wethouders
      van de betrokken gemeente over de wijze waarop de mogelijkheden tot inschakeling in het arbeidsproces van die
      werkzoekende kunnen worden verbeterd. Van de opvattingen van de betrokken werkzoekende, desgewenst in de door deze
      aangegeven bewoordingen, en, indien het advies daarvan afwijkt, van de redenen daarvoor, wordt melding gedaan in
      het advies.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel26
  - number: '26.4'
    text: |-
      De Centrale organisatie werk en inkomen informeert het Uitvoeringsinstituut werknemersverzekeringen dan wel
      burgemeester en wethouders van de betrokken gemeente zo spoedig mogelijk over de uitkomst van de administratieve
      indeling, bedoeld in het eerste lid, en het advies, bedoeld in het derde lid, met betrekking tot de werkzoekende.
      De werkzoekende ontvangt een afschrift van het advies.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel26
  - number: '26.5'
    text: |-
      De Centrale organisatie werk en inkomen geeft tevens toepassing aan het eerste of derde lid op verzoek van het
      Uitvoeringsinstituut werknemersverzekeringen of burgemeester en wethouders van de betrokken gemeente in geval van
      herbeoordeling van de kans op werk van de werkzoekende. Het vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel26
  - number: '27.1'
    text: |-
      Voorzover aan de Centrale organisatie werk en inkomen bekend is dat in een bedrijf of onderneming, of een gedeelte
      daarvan, een werkstaking, uitsluiting of bedrijfsbezetting plaatsvindt, verleent zij geen diensten tot het plaatsen
      van werkzoekenden in dat bedrijf of die onderneming, of dat gedeelte daarvan, waar de werkstaking, uitsluiting of
      bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel27
  - number: '27.2'
    text: |-
      Voorzover aan de Centrale organisatie werk en inkomen bekend is dat werkzoekenden rechtstreeks in een werkstaking,
      uitsluiting of bedrijfsbezetting betrokken zijn, verleent zij aan hen tijdens de duur van het arbeidsconflict geen
      diensten als bedoeld in [artikel 21, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
  - number: '28.1'
    text: |-
      De Centrale organisatie werk en inkomen neemt aanvragen in ontvangst van een uitkering op grond
      van de [Werkloosheidswet][ref1], van een toeslag in aanvulling op een uitkering op grond van de
      [Werkloosheidswet][ref2] als bedoeld in [artikel 11, tweede lid, van de Toeslagenwet][ref3] en van
      algemene bijstand op grond van de [Wet werk en bijstand][ref4] dan wel van een uitkering op grond van
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5], of
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6].
      Tevens neemt de Centrale organisatie werk en inkomen de aangifte van werkloosheid op grond van
      [artikel 26, eerste lid, onderdeel a, van de Werkloosheidswet][ref7] in ontvangst. Indien een aanvraag
      van een uitkering of aangifte van werkloosheid op grond van een in de eerste zin van dit lid genoemde
      wet niet bij de Centrale organisatie werk en inkomen moet worden ingediend of gedaan, verwijst de
      Centrale organisatie werk en inkomen de aanvrager naar het Uitvoeringsinstituut werknemersverzekeringen
      of naar burgemeester en wethouders van de betrokken gemeente. Indien het een aanvraag van
      algemene bijstand op grond van de [Wet werk en bijstand][ref8] dan wel van uitkering op grond van
      de[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10] betreft, legt de
      Centrale organisatie werk en inkomen vast op welke dag zij naam, adres en woonplaats van de belanghebbende heeft
      geregistreerd en hem in staat heeft gesteld zijn aanvraag in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0015703
      [ref5]: https://wetten.overheid.nl/BWBR0004044
      [ref6]: https://wetten.overheid.nl/BWBR0004163
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref8]: https://wetten.overheid.nl/BWBR0015703
      [ref9]: https://wetten.overheid.nl/BWBR0004044
      [ref10]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0015703
      - id: ref5
        bwb_id: BWBR0004044
      - id: ref6
        bwb_id: BWBR0004163
      - id: ref7
        bwb_id: BWBR0004045
        artikel: '26'
      - id: ref8
        bwb_id: BWBR0015703
      - id: ref9
        bwb_id: BWBR0004044
      - id: ref10
        bwb_id: BWBR0004163
  - number: '28.2'
    text: |-
      De belanghebbende verstrekt aan de Centrale organisatie werk en inkomen alle gevraagde gegevens en bewijsstukken
      die nodig zijn voor de beslissing op zijn aanvraag door het Uitvoeringsinstituut werknemersverzekeringen
      onderscheidenlijk burgemeester en wethouders van de betrokken gemeente dan wel voor de verdere behandeling van
      zijn aangifte van werkloosheid door het Uitvoeringsinstituut werknemersverzekeringen. De Centrale organisatie werk
      en inkomen onderzoekt de verstrekte gegevens en bewijsstukken op bij ministeriële regeling te bepalen wijze op
      juistheid, volledigheid en consistentie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel28
  - number: '28.3'
    text: |-
      De Centrale organisatie werk en inkomen draagt de aanvraag of aangifte, bedoeld in het eerste lid, met de
      daarbij verstrekte gegevens en bewijsstukken, alsmede het daarbij behorende sociaal-fiscaalnummer, over aan
      het Uitvoeringsinstituut werknemersverzekeringen onderscheidenlijk burgemeester en wethouders van de betrokken
      gemeente. Zij geeft daarbij aan welke gegevens en bewijsstukken zij overeenkomstig het tweede lid heeft onderzocht
      en wat haar oordeel hieromtrent is, alsmede, indien van toepassing, de dag, bedoeld in het eerste lid, vierde
      volzin. De overdracht vindt plaats zodra de verstrekte gegevens en bewijsstukken naar het oordeel van de Centrale
      organisatie werk en inkomen juist, volledig en consistent zijn, doch in elk geval binnen een bij algemene
      maatregel van bestuur te bepalen termijn na de aanvraag of aangifte. De Centrale organisatie werk en inkomen doet
      tegelijkertijd van deze overdracht schriftelijk mededeling aan belanghebbende.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel28
  - number: '28.4'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel28
  - number: '28.5'
    text: |-
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref1] is niet van toepassing ten aanzien van de uitvoering van dit
      artikel door de Centrale organisatie werk en inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '29.1'
    text: |-
      De belanghebbende verstrekt de gegevens en de bewijsstukken, bedoeld in [artikel 28, tweede lid][ref1], aan de
      Centrale organisatie werk en inkomen en deelt op verzoek van deze organisatie of onverwijld uit eigen beweging
      overigens alle feiten en omstandigheden mee, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op het recht op uitkering, toeslag of bijstand, het geldend maken van het recht op uitkering, toeslag
      of bijstand, of de hoogte of de duur van de uitkering, toeslag of bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      De verplichting van het eerste lid geldt tot het tijdstip van ontvangst van de mededeling van de Centrale
      organisatie werk en inkomen, bedoeld in [artikel 28, derde lid, vierde zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
        hoofdstuk: '4'
  - number: '30.1'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.a
    text: |-
      uitvoering geven aan de wettelijke arbeidsongeschiktheidsverzekeringen, de
      wettelijke ziekengeldverzekering, de wettelijke werkloosheidsverzekering, de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref1], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], de [Toeslagenwet][ref3], alsmede wetten die de
      uitvoering van deze wetten beheersen, voorzover die uitvoering niet bij of krachtens enige wet aan anderen is
      opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0007891
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007891
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0004043
  - number: 30.1.b
    text: |-
      te bevorderen, dat personen die recht hebben op een uitkering op grond van
      wetten als bedoeld in onderdeel a, dan wel die ingezetene zijn als bedoeld in
      [artikel 3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], de leeftijd van achttien jaar nog
      niet hebben bereikt en in verband met ziekte of gebrek een belemmering ondervinden of hebben ondervonden bij het
      volgen van onderwijs, worden ingeschakeld in het arbeidsproces;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 30.1.c
    text: |-
      beheren en administreren van de fondsen, bedoeld in
      [artikel 1, onderdelen j tot en met n van de Wet financiering sociale verzekeringen][ref1], en het
      Reïntegratiefonds, genoemd in [artikel 41 van de Wet op de (re)integratie arbeidsgehandicapten][ref2],
      het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref3] en het Arbeidsongeschiktheidsfonds
      jonggehandicapten, genoemd in [artikel 63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel63
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '63'
  - number: 30.1.d
    text: |-
      zorgdragen voor gevraagde en ongevraagde verstrekking van deugdelijke informatie aan werkgevers, werknemers,
      uitkeringsgerechtigden, verzekerden, werkzoekenden, regionale platforms, bedoeld in [artikel 23][ref1], en andere
      belanghebbenden in verband met de uitvoering van de in onderdeel a genoemde verzekeringen en wetten alsmede de in
      onderdeel b bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel23
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '23'
        hoofdstuk: '4'
  - number: 30.1.e
    text: |-
      op verzoek van een werkgever of een werknemer een onderzoek instellen naar en een oordeel geven over
      het bestaan van ongeschiktheid tot werken, indien de werknemer een geschil heeft met zijn werkgever over
      recht op loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of
      recht op bezoldiging als bedoeld in [artikel 76a, eerste lid, van de Ziektewet][ref2] of een onderzoek
      instellen naar en een oordeel geven over de nakoming van de werknemer van de verplichtingen, bedoeld in
      [artikel 660a van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel overeenkomstige bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel660a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 660a
  - number: 30.1.f
    text: |-
      op verzoek van een werkgever of een werknemer dan wel een eigenrisicodrager als bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1] of personen als bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2], die laatstelijk tot hem in dienstbetrekking
      stonden, een onderzoek instellen naar en een oordeel geven over de aanwezigheid van passende arbeid, die de zieke
      werknemer voor de werkgever, respectievelijk de persoon die recht heeft op ziekengeld voor de eigenrisicodrager, in
      staat is te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 30.1.g
    text: |-
      op verzoek van een werkgever of een werknemer dan wel een eigenrisicodrager als bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1] of personen als bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2], die laatstelijk tot hem in dienstbetrekking
      stonden, een onderzoek instellen naar en een oordeel geven over de vraag of de werkgever ten aanzien van zijn zieke
      werknemer, respectievelijk die eigenrisicodrager ten aanzien van de persoon aan wie hij ziekengeld moet betalen,
      voldoende en geschikte reïntegratieinspanningen heeft verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 30.1.h
    text: |-
      het uitvoeren van taken die bij of krachtens enige andere wet dan de in onderdeel a bedoelde wetten, aan het
      Uitvoeringsinstituut werknemersverzekeringen zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.i
    text: |-
      het uitvoeren van bij algemene maatregel van bestuur dan wel bij ministeriële regeling of bij regeling in
      overeenstemming met Onze Minister aangewezen algemene maatregelen van bestuur en ministeriële regelingen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.j
    text: |-
      het in opdracht van Onze Minister of uit eigen beweging verrichten van onderzoek met betrekking tot de wettelijke
      taken van dit instituut;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.k
    text: |-
      het aan Onze Minister op zijn verzoek verstrekken van de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voorzover deze betrekking hebben op onderwerpen
      als bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.l
    text: |-
      op verzoek van een werkgever of een werknemer informatie verstrekken over de sociale verzekeringsaspecten van
      arbeidsongeschiktheid en reïntegratie;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.m
    text: |-
      diensten te verrichten voor gegevensverkeer met het buitenland ten behoeve van een rechtmatige uitvoering
      van bij of krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut werknemersverzekeringen,
      de Centrale organisatie werk en inkomen en de Sociale verzekeringsbank opgedragen taken en van aan de
      colleges van burgemeester en wethouders opgedragen taken bij of krachtens de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] en de
      [Wet werk en inkomen kunstenaars][ref4] en ten behoeve van Onze Minister met het oog op het toezicht op de naleving
      van wetten, waarbij het Uitvoeringsinstituut werknemersverzekeringen en de genoemde bestuursorganen de omvang van
      die diensten nader kunnen overeenkomen of voorzover dit voortvloeit uit internationaalrechtelijke voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0017837
  - number: 30.1.n
    text: het voeren van een adequate administratie ten behoeve van de uitoefening van zijn taak;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.1.p
    text: |-
      op verzoek van een eigenrisicodrager als bedoeld in [artikel 1 van de Wet werk en inkomen naar arbeidsvermogen][ref1]
      of de verzekerde, bedoeld in [artikel 82, eerste lid, onderdeel b, van die wet][ref2], die recht heeft op
      uitkering een onderzoek instellen naar en een oordeel geven over de vraag of de eigenrisicodrager ten aanzien van
      genoemde verzekerde, voldoende en geschikte reïntegratie-inspanningen heeft verricht voorzover hieromtrent door de
      eigenrisicodrager geen besluit is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '82'
  - number: 30.1.q
    text: |-
      de overheidswerkgever, bedoeld in [artikel 72a van de Werkloosheidswet][ref1], op diens verzoek te adviseren met
      betrekking tot door die werkgever te verlenen ondersteuning aan de overheidswerknemer aan wie toestemming als
      bedoeld in [artikel 77a van de Werkloosheidswet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 72a
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 77a
  - number: '30.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor de inrichting en instandhouding van vestigingen
      waarin de taken van dit instituut worden uitgevoerd, op een wijze waardoor het voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: '30.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan bepalen dat een of meer van haar wettelijke taken worden
      uitgevoerd in een of een beperkt aantal vestigingen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: '30.4'
    text: |-
      Een besluit ter uitvoering van het tweede of derde lid behoeft goedkeuring van Onze Minister en wordt na
      goedkeuring, door het Uitvoeringsinstituut werknemersverzekeringen gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: '30.5'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in het eerste lid, onderdeel b, niet:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30.5.a
    text: |-
      ten aanzien van personen die een uitkering ontvangen op grond van wetten als bedoeld in onderdeel a, indien het
      Uitvoeringsinstituut werknemersverzekeringen met burgemeester en wethouders van een gemeente overeenkomen dat op
      die personen [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 30.5.b
    text: |-
      ten aanzien van personen die een arbeidsongeschiktheidsuitkering ontvangen op grond van
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
  - number: 30.5.c
    text: |-
      ten aanzien van de verzekerde, bedoeld in
      [artikel 82, eerste en tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], tenzij de
      [artikelen 72, derde lid][ref2], of [84, tweede lid, van die wet][ref3] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel84
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '84'
  - number: 30.5.d
    text: |-
      indien [artikel 72a van de Werkloosheidswet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 72a
  - number: '30.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat de werkzaamheden waarmee het Uitvoeringsinstituut in het
      kader van zijn taak, bedoeld in het eerste lid, onderdeel b, de inschakeling van personen die een uitkering
      ontvangen op grond van wetten als bedoeld in het eerste lid, onderdeel a, in het arbeidsproces bevordert,
      verrichten door een reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: '30.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor het vijfde en zesde lid
      in ieder geval voor de situaties van samenloop van de taak, bedoeld in het eerste lid, onderdeel b, met de
      vergelijkbare taak van werkgevers of in geval van samenloop van uitkeringen, de inhoud van de overeenkomst met het
      reïntegratiebedrijf, het verwerken van gegevens en de soort werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30
  - number: 30a.1
    text: |-
      Nadat het recht op een uitkering op grond van wetten als bedoeld in [artikel 30, eerste lid, onderdeel a][ref1],
      uitgezonderd de wettelijke ziekengeldverzekering, is vastgesteld, stelt het Uitvoeringsinstituut
      werknemersverzekeringen, indien gelet op de aard van de uitkering de taak, bedoeld in
      [artikel 30, eerste lid, onderdeel b][ref2], wordt uitgevoerd, in samenspraak met de uitkeringsgerechtigde een
      reïntegratievisie vast waarin verplichtingen en rechten van de uitkeringsgerechtigde zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: 30a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen evalueert, in samenspraak met de uitkeringsgerechtigde, periodiek
      de reïntegratievisie en kan deze bijstellen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30a
  - number: 30a.3
    text: |-
      Indien de reïntegratievisie daartoe aanleiding geeft laat het Uitvoeringsinstituut werknemersverzekeringen ten
      behoeve van de uitkeringsgerechtigde, bedoeld in het eerste lid, een plan gericht op behoud en verkrijging van
      mogelijkheden tot het verrichten van arbeid en inschakeling in arbeid opstellen door een reïntegratiebedrijf. Het
      reïntegratieplan wordt in samenspraak met de uitkeringsgerechtigde opgesteld. Voorzover noodzakelijk in verband met
      de aard van de voorziening, stelt het Uitvoeringsinstituut werknemersverzekeringen de uitkeringsgerechtigde in de
      gelegenheid zelf een reïntegratieplan op te stellen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30a
  - number: 30a.4
    text: |-
      In het reïntegratieplan worden verplichtingen en rechten van de uitkeringsgerechtigde vermeld voorzover die niet in
      de reïntegratievisie zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30a
  - number: 30b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in het belang van de arbeidsintegratie
      van personen met een structurele functionele beperking ten laste van de fondsen, bedoeld in
      [hoofdstuk 7 van de Wet financiering sociale verzekeringen][ref1], subsidie verstrekken aan instellingen of
      organisaties met het oog op onderzoek naar en het bevorderen van maatregelen, die strekken tot behoud, herstel of
      bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '7'
  - number: 30b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30b
  - number: 30c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen benoemt één of meer personen die onder zijn verantwoordelijkheid
      werkzaam zijn als beslissingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30c
  - number: 30c.2
    text: |-
      Voorzover nodig in afwijking van [artikel 3, vijfde lid][ref1], laat het Uitvoeringsinstituut
      werknemersverzekeringen primaire beschikkingen voorzover daarin het ontstaan van een
      recht op een arbeidsongeschiktheidsuitkering als bedoeld in de [artikelen 47][ref2] of
      [48 van de Wet werk en inkomen naar arbeidsvermogen][ref3] of de herleving ervan als bedoeld in
      [50 van die wet][ref4] wordt vastgesteld, bij uitsluiting nemen door een beslissingsautoriteit als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel50
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '48'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '50'
  - number: 30c.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen regelt in overeenstemming met Onze Minister de plaats of
      plaatsen van werkzaamheden van de beslissingsautoriteit, de werkwijze van de beslissingsautoriteit en de benodigde
      kwalificaties voor een benoeming tot beslissingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel30c
  - number: '31'
    text: |-
      Bij de uitvoering van de taken, bedoeld in [artikel 30, eerste lid][ref1], waakt het Uitvoeringsinstituut
      werknemersverzekeringen tegen discriminatie en stelt daartoe een non-discriminatiecode vast, waarin in ieder geval
      aandacht wordt besteed aan discriminatie wegens ras, geslacht, hetero- of homoseksuele gerichtheid, leeftijd en
      handicap.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: '32.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voor een onderzoek als bedoeld in
      [artikel 30, eerste lid, onderdeel e, f, g of p][ref1], kosten in rekening brengen bij de werkgever of de werknemer
      die heeft verzocht dit onderzoek in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: '32.2'
    text: |-
      Indien een werkgever verzoekt een onderzoek als bedoeld in [artikel 30, eerste lid, onderdeel e][ref1], in te
      stellen, geeft het Uitvoeringsinstituut werknemersverzekeringen slechts een oordeel over het bestaan van de
      ongeschiktheid tot werken van een bepaalde werknemer, indien deze werknemer bereid is zich hiertoe te laten
      onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: '32.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen geeft een oordeel als bedoeld in
      [artikel 30, eerste lid, onderdeel e, f, g of p][ref1], binnen een termijn van twee weken na ontvangst van het
      verzoek. De [artikelen 4:14][ref2] en [4:15 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '33.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen draagt zorg voor de inrichting en adequate werking van de
      polisadministratie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: '33.2'
    text: 'De polisadministratie heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: 33.2.a
    text: |-
      van de werknemer gegevens over zijn arbeidsverhouding en uitkeringsverhouding – daaronder begrepen duur, loon en
      premies werknemersverzekeringen – vast te leggen ten behoeve van de werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: 33.2.b
    text: |-
      besluiten over recht op uitkering of verstrekking te baseren op gegevens als bedoeld in onderdeel a met het oog
      waarop berichten aan de werknemer worden verstrekt over die gegevens en het al dan niet verzekerd zijn voor de
      werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: 33.2.c
    text: |-
      van de persoon die vrijwillig verzekerd is voor de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], [Werkloosheidswet][ref3] en
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] gegevens te verwerken waarbij de onderdelen a en b van
      overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
  - number: 33.2.d
    text: |-
      van de werknemer gegevens over genoten loon in de zin van de [Wet op de loonbelasting 1964][ref1], ingehouden
      loonbelasting, premie volksverzekeringen in de zin van de [Wet financiering sociale verzekeringen][ref2]
      en inkomensafhankelijke bijdrage als bedoeld in de [Zorgverzekeringswet][ref3] en bijdrage in de kosten van
      kinderopvang als bedoeld in de [Wet kinderopvang][ref4], alsmede andere gegevens van belang voor de heffing van de
      inkomstenbelasting te verwerken ten behoeve van de uitvoering van de taken van de rijksbelastingdienst;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0018450
      [ref4]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0018450
      - id: ref4
        bwb_id: BWBR0017017
  - number: 33.2.e
    text: |-
      van de werknemer overige gegevens van belang voor statistische doeleinden op het gebied van arbeid en lonen te
      verwerken ten behoeve van het Centraal bureau voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: '33.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is de verantwoordelijke in de zin van de
      [Wet bescherming persoonsgegevens][ref1] voorzover het betreft de verwerking van de gegevens, bedoeld in het tweede
      lid, onderdelen a, b en c, en de bewerker in de zin van de [Wet bescherming persoonsgegevens][ref2] voorzover het
      betreft de verwerking van de gegevens, bedoeld in het tweede lid, onderdelen d en e.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0011468
  - number: '33.4'
    text: |-
      De verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1] voor de verwerking van de gegevens,
      bedoeld in het tweede lid, d en e, zijn respectievelijk Onze Minister van Financiën en het Centraal bureau voor
      de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '33.5'
    text: |-
      De rijksbelastingdienst verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen, in het
      kader van zijn taak bedoeld in het eerste lid, alle gegevens en inlichtingen, die verkregen zijn
      bij de uitvoering van de heffing van loonbelasting en van de [artikelen 58, tweede lid][ref1], en
      [59 van de Wet financiering sociale verzekeringen][ref2], voorzover die gegevens en inlichtingen noodzakelijk zijn
      voor het verwerken van gegevens in de polisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel59
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '59'
  - number: '33.6'
    text: |-
      De gemeentelijke basisadministratie persoonsgegevens wordt ter verificatie geraadpleegd voor de gegevens, die door
      het Uitvoeringsinstituut werknemersverzekeringen op grond van dit artikel worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: '33.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de rijksbelastingdienst alle gegevens en
      inlichtingen, die noodzakelijk zijn ten behoeve van de uitvoering van de taken van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: '33.8'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt Onze Minister en bestuursorganen als bedoeld in de
      [artikelen 62][ref1], [72][ref2] en [73, vijfde lid][ref3], gegevens die op grond van het tweede lid verwerkt
      worden in de polisadministratie, met uitzondering van de gegevens, bedoeld in het tweede lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '33.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de inrichting,
      de gegevensset en de wijze van verkrijging van de gegevens van de polisadministratie. Tevens worden regels gesteld
      over het elektronische gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de
      gegevensverstrekking uit de polisadministratie worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33
  - number: 33a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is de verantwoordelijke in de zin van de
      [Wet bescherming persoonsgegevens][ref1] voor de verwerking van gegevens van uitkeringsgerechtigden als bedoeld
      in [artikel 1, onderdeel o, aanhef en sub 2][ref2], noodzakelijk voor het uitvoeren van de taak, bedoeld in
      [artikel 30, eerste lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: 33a.2
    text: |-
      De gegevens, die door het Uitvoeringsinstituut werknemersverzekeringen worden verwerkt, worden door het
      Uitvoeringsinstituut werknemersverzekeringen of de Centrale organisatie werk en inkomen met toepassing van
      [artikel 28][ref1], niet verkregen van de in het eerste lid genoemde uitkeringsgerechtigden, voorzover zij
      verkregen kunnen worden uit de gemeentelijke basisadministratie persoonsgegevens, de polisadministratie, bedoeld
      in [artikel 33][ref2], of van de Sociale verzekeringsbank, omdat ze verwerkt worden in de verzekerdenadministratie,
      bedoeld in [artikel 35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
        hoofdstuk: '6'
  - number: 33a.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is, voorzover het Uitvoeringsinstituut werknemersverzekeringen
      niet verantwoordelijke is in de zin van de [Wet bescherming persoonsgegevens][ref1], bewerker in de zin van die wet
      voor de verwerking van gegevens ter uitvoering van de taak, bedoeld in [artikel 30, eerste lid, onderdeel m][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: 33b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen gebruikt het sociaal-fiscaalnummer bij de verwerking van
      persoonsgegevens voor de uitvoering van de in [artikel 30, eerste lid, onderdeel a][ref1], genoemde verzekeringen
      en wetten en bij de verwerking van persoonsgegevens in de polisadministratie, bedoeld in [artikel 33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: 33b.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verifieert het sociaal-fiscaalnummer in relatie
      tot de bijbehorende persoonsidentificerende gegevens, van de natuurlijke persoon, bedoeld in
      [artikel 33, tweede lid, onderdeel a][ref1], bij de eerste opname in de polisadministratie en vervolgens indien
      daartoe aanleiding is, bij de rijksbelastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: 33b.3
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Financiën, nadere regels worden gesteld
      ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33b
  - number: 33c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de werknemer periodiek een bericht als bedoeld in
      [artikel 33, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: 33c.2
    text: |-
      Het bericht, bedoeld in het eerste lid, bevat informatie over de verwachte hoogte en duur van de uitkering, die
      door het Uitvoeringsinstituut werknemersverzekeringen wordt verstrekt, indien de werknemer op de laatste dag van
      de periode waarop het bericht betrekking heeft, werkloos, arbeidsongeschikt of gedeeltelijk arbeidsgeschikt zou
      worden.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
  - number: 33c.3
    text: |-
      Indien de gegevens opgenomen in het bericht, bedoeld in het eerste lid, niet juist of niet volledig zijn, doet de
      werknemer het Uitvoeringsinstituut werknemersverzekeringen hiervan terstond schriftelijk mededeling.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
  - number: 33c.4
    text: |-
      Indien de werknemer het bericht, bedoeld in het eerste lid, niet heeft ontvangen en hij redelijkerwijs een bericht
      kon verwachten, deelt hij dit terstond aan het Uitvoeringsinstituut werknemersverzekeringen mede.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
  - number: 33c.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beslist naar aanleiding van een mededeling als bedoeld in het
      tweede of derde lid, over de opname, verbetering en aanvulling van gegevens van de werknemer.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
  - number: 33c.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de periodiciteit van het bericht, die voor
      verschillende soorten werknemers verschillend kan zijn, en in samenhang daarmee voor de inhoud van het bericht.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel33c
  - number: '34.1'
    text: 'De Sociale verzekeringsbank heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.a
    text: |-
      de [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Algemene Kinderbijslagwet][ref3],
      alsmede wetten die de uitvoering van deze wetten beheersen, uit te voeren, voorzover die uitvoering niet bij of
      krachtens enige andere wet aan anderen is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0002368
  - number: 34.1.b
    text: |-
      beheren en administreren van de fondsen, bedoeld in
      [artikel 1, onderdelen f en g van de Wet financiering sociale verzekeringen][ref1] en het Algemeen
      Kinderbijslagfonds, genoemd in [artikel 29a van de Algemene Kinderbijslagwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel29a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: 29a
  - number: 34.1.c
    text: |-
      zorgdragen voor gevraagde en ongevraagde verstrekking van deugdelijke informatie aan werkgevers, werknemers,
      uitkeringsgerechtigden, verzekerden en andere belanghebbenden in verband met de uitvoering van de in onderdeel a
      genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.d
    text: |-
      het uitvoeren van taken die bij of krachtens enige andere wet dan de in onderdeel a bedoelde wetten, aan de Sociale
      verzekeringsbank zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.e
    text: |-
      het uitvoeren van bij algemene maatregel van bestuur dan wel bij ministeriële regeling of bij regeling in
      overeenstemming met Onze Minister aangewezen algemene maatregelen van bestuur en ministeriële regelingen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.f
    text: |-
      het in opdracht van Onze Minister of uit eigen beweging verrichten van onderzoek met betrekking tot de wettelijke
      taken van deze organisatie;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.g
    text: |-
      het aan Onze Minister op zijn verzoek verstrekken van de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften, voorzover deze betrekking hebben op onderwerpen
      als bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: 34.1.h
    text: |-
      het verrichten van diensten voor gegevensverkeer met het buitenland ten behoeve van de rechtmatige
      uitvoering van bij of krachtens deze wet of enige andere wet aan het Uitvoeringsinstituut
      werknemersverzekeringen of de Centrale organisatie werk en inkomen opgedragen taken, of van aan de
      colleges van burgemeester en wethouders opgedragen taken bij of krachtens de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] en de
      [Wet werk en inkomen kunstenaars][ref4] of van bij of krachtens de [Algemene Wet Bijzondere Ziektekosten][ref5]
      en de [Zorgverzekeringswet][ref6] aan het College zorgverzekeringen, genoemd in
      [artikel 58 van de Zorgverzekeringswet][ref7], opgedragen taken of ten behoeve van de vaststelling
      van het verzekerd zijn op grond van de werknemersverzekeringen, de volksverzekeringen of de
      [Algemene Wet Bijzondere Ziektekosten][ref8], of het verzekeringsplichtig zijn op grond van de
      [Zorgverzekeringswet][ref9], voorzover dit voortvloeit uit internationaalrechtelijke voorschriften of dit tussen de
      betrokken bestuursorganen is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0017837
      [ref5]: https://wetten.overheid.nl/BWBR0002614
      [ref6]: https://wetten.overheid.nl/BWBR0018450
      [ref7]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref8]: https://wetten.overheid.nl/BWBR0002614
      [ref9]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0017837
      - id: ref5
        bwb_id: BWBR0002614
      - id: ref6
        bwb_id: BWBR0018450
      - id: ref7
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref8
        bwb_id: BWBR0002614
      - id: ref9
        bwb_id: BWBR0018450
  - number: 34.1.i
    text: het voeren van een adequate administratie ten behoeve van de uitoefening van haar taak.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: '34.2'
    text: |-
      De Sociale verzekeringsbank draagt zorg voor de inrichting en instandhouding van vestigingen waarin de taken van
      deze bank worden uitgevoerd, op een wijze waardoor zij voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: '34.3'
    text: |-
      De Sociale verzekeringsbank kan bepalen dat een of meer van haar wettelijke taken worden uitgevoerd in een of een
      beperkt aantal vestigingen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: '34.4'
    text: |-
      Een besluit ter uitvoering van het tweede of derde lid behoeft goedkeuring van Onze Minister en wordt na
      goedkeuring door de Sociale verzekeringsbank gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel34
  - number: '35.1'
    text: |-
      De Sociale verzekeringsbank is de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1] voor
      de verwerking van gegevens over verzekerden en uitkeringsgerechtigden in de zin van de volksverzekeringen en over
      bij de verzekerden behorende personen in de verzekerdenadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '35.2'
    text: 'De verwerking van gegevens in de verzekerdenadministratie heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
  - number: 35.2.a
    text: |-
      van verzekerden, pensioengerechtigden, nabestaanden en andere uitkeringsgerechtigden gegevens te verwerken
      noodzakelijk voor de uitvoering van de wetten, genoemd in [artikel 34, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: 35.2.b
    text: |-
      van kinderen van verzekerden gegevens te verwerken noodzakelijk voor de uitvoering van de
      [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 35.2.c
    text: |-
      van de echtgenoot, kinderen of huisgenoten van de verzekerde en pensioengerechtigde gegevens te verwerken
      noodzakelijk voor de uitvoering van de [Algemene nabestaandenwet][ref1] en de [Algemene Ouderdomswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002221
  - number: 35.2.d
    text: |-
      van andere personen gegevens te verwerken noodzakelijk voor de uitvoering van taken als bedoeld in
      [artikel 34, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: 35.2.e
    text: |-
      gegevens vast te leggen over verzekerde en niet verzekerde tijdvakken op grond van verplichte of vrijwillige
      verzekering voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
  - number: 35.2.f
    text: |-
      gegevens te verwerken om te voldoen aan verplichtingen van de Sociale verzekeringsbank op grond van
      internationaalrechtelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
  - number: '35.3'
    text: |-
      Voorzover de Sociale verzekeringsbank geen verantwoordelijke is in de zin van de
      [Wet bescherming persoonsgegevens][ref1] is de Sociale verzekeringsbank bewerker in de zin van die wet voor de
      verwerking van gegevens ter uitvoering van de taak, bedoeld in [artikel 34, onderdeel h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: '35.4'
    text: |-
      De Sociale verzekeringsbank verstrekt Onze Minister en bestuursorganen als bedoeld in de [artikelen 62][ref1],
      [72][ref2] en [73, vierde lid][ref3], gegevens als bedoeld in het tweede lid die verwerkt worden in de
      verzekerdenadministratie, voorzover deze gegevens niet verwerkt worden in de polisadministratie, bedoeld in
      [artikel 33][ref4], en verstrekt het Uitvoeringsinstituut werknemersverzekeringen alle gegevens, die noodzakelijk
      zijn voor verwerking van gegevens in de polisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: '35.5'
    text: |-
      De gegevens, die door de Sociale verzekeringsbank worden verwerkt worden niet verkregen van de in het tweede lid
      genoemde personen, voorzover zij verkregen kunnen worden uit de gemeentelijke basisadministratie persoonsgegevens
      of de polisadministratie, bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
        hoofdstuk: '5'
  - number: '35.6'
    text: |-
      De Sociale verzekeringsbank gebruikt het sociaal-fiscaalnummer bij de verwerking van persoonsgegevens als bedoeld
      in dit artikel. [Artikel 33b, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33b
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33b
        hoofdstuk: '5'
  - number: '35.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval over de inrichting
      en de gegevensset van de verzekerdenadministratie. Tevens worden regels gesteld over het elektronische
      gegevensverkeer, de daarbij te gebruiken elektronische infrastructuur en de eisen die aan de gegevensverstrekking
      uit de verzekerdenadministratie worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel35
  - number: '36.1'
    text: |-
      Er is een Inspectie Werk en Inkomen die onder Onze Minister ressorteert. Aan het hoofd van de Inspectie staat de
      inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel36
  - number: '36.2'
    text: |-
      Het toezicht op de uitvoering van de taken die bij of krachtens deze wet of enige andere wet zijn opgedragen
      aan de Centrale organisatie werk en inkomen, het Inlichtingenbureau, de Raad voor werk en inkomen, het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank, wordt onder gezag van Onze Minister
      uitgeoefend door de Inspectie Werk en Inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel36
  - number: '37'
    text: 'De Inspectie Werk en Inkomen is belast met:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
  - number: 37.a
    text: |-
      het toezicht op de rechtmatigheid en doelmatigheid, waaronder begrepen doeltreffendheid, van de uitvoering van de
      bij of krachtens deze wet of enige andere wet aan de Centrale organisatie werk en inkomen, het Inlichtingenbureau,
      de Raad voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank
      opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
  - number: 37.b.1°
    text: |-
      het toezicht op de rechtmatigheid van de uitvoering van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] door burgemeesters
      en wethouders, en de doeltreffendheid van die wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 37.b.2°
    text: |-
      het geven van het oordeel over de uitvoering van de [Wet werk en bijstand][ref1], bedoeld in
      [artikel 74, vierde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '74'
  - number: 37.b.3°
    text: |-
      het toezicht de rechtmatigheid en de doeltreffendheid van de uitvoering van de [Wet sociale werkvoorziening][ref1]
      en de [Wet werk en inkomen kunstenaars][ref2] door burgemeester en wethouders, en op de doeltreffendheid van die
      wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0017837
  - number: 37.b.4°
    text: |-
      het toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering van de taken, opgedragen aan het college
      van burgemeester en wethouders bij of krachtens [hoofdstuk 3][ref1] en [hoofdstuk 6 van de Wet kinderopvang][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: 37.c
    text: |-
      het toezicht op de rechtmatigheid en doelmatigheid, waaronder begrepen doeltreffendheid, van de wijze waarop
      de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank met elkaar en met burgemeester en wethouders van de gemeenten bij de uitvoering van de aan hen
      opgedragen taken samenwerken;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
  - number: 37.d
    text: het verrichten van andere bij of krachtens een wet aan de Inspectie Werk en Inkomen opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel37
  - number: '38.1'
    text: |-
      De Inspectie Werk en Inkomen legt eens per vier jaar vóór 1 juli een meerjarig toezichtsplan en jaarlijks vóór
      1 juli een plan van werkzaamheden aan Onze Minister voor. De Inspectie Werk en Inkomen stelt deze plannen, nadat
      daarover met Onze Minister overleg is gepleegd, vast.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel38
  - number: '38.2'
    text: |-
      Jaarlijks vóór 1 mei stelt de Inspectie Werk en Inkomen een verslag op over de uitkomsten van de
      toezichtswerkzaamheden in het afgelopen kalenderjaar. Onze Minister brengt het jaarverslag, voorzien van zijn
      oordeel, vóór de derde woensdag in mei ter kennis van de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel38
  - number: '38.3'
    text: |-
      Onze Minister brengt de bescheiden, bedoeld in het eerste lid, alsmede alle overige, door de Inspectie Werk en
      Inkomen relevant geachte, rapportages, in de vorm waarin deze hem zijn voorgelegd en voorzien van zijn oordeel,
      binnen vier weken na ontvangst, ter kennis aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel38
  - number: '39.1'
    text: |-
      De Inspectie Werk en Inkomen is met betrekking tot de haar bij of krachtens de wet opgedragen taken bevoegd tot
      het verrichten van niet in het jaarplan opgenomen of aanvullende werkzaamheden, nadat daarover met Onze Minister
      is overlegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel39
  - number: '39.2'
    text: |-
      Indien Onze Minister overweegt de Inspectie Werk en Inkomen toestemming voor werkzaamheden als bedoeld in het
      eerste lid te onthouden dan wel aan de Inspectie Werk en Inkomen andere dan de in dit hoofdstuk genoemde of in het
      jaarplan opgenomen taken op te dragen, geeft hij van dit voornemen kennis aan de beide kamers der Staten-Generaal
      en geeft hij daaraan niet eerder uitvoering dan vier weken na die kennisgeving.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel39
  - number: '40.1'
    text: |-
      De Inspectie Werk en Inkomen draagt zorg voor de verspreiding van het jaarverslag en de overige rapportages,
      bedoeld in [artikel 38][ref1], en verzorgt de voorlichting over de daarin opgenomen bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel38
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '38'
        hoofdstuk: '7'
  - number: '40.2'
    text: |-
      De Inspectie Werk en Inkomen geeft niet eerder uitvoering aan het eerste lid dan nadat Onze Minister het
      desbetreffende jaarverslag of de desbetreffende rapportage openbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel40
  - number: '41'
    text: |-
      De Inspectie Werk en Inkomen beoordeelt op verzoek van Onze Minister de mogelijkheden van het houden van
      toezicht op de rechtmatigheid en doelmatigheid van de uitvoering van beleidsvoornemens en voorgenomen
      wettelijke voorschriften door de in [artikel 37][ref1] genoemde bestuursorganen en rechtspersonen, alsmede
      beleidsvoornemens en voorgenomen wettelijke voorschriften met betrekking tot andere taken, als bedoeld in
      [artikel 37, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
        hoofdstuk: '7'
  - number: '42.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Inlichtingenbureau, de Raad voor werk en inkomen, het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank verstrekken op verzoek, kosteloos, aan
      de Inspectie Werk en Inkomen alle gegevens en inlichtingen die voor de uitoefening van haar taak noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel42
  - number: '42.2'
    text: |-
      De in het eerste lid genoemde rechtspersonen verlenen de Inspectie Werk en Inkomen op verzoek toegang tot en inzage
      in gegevens en bescheiden voor zover dat voor de uitoefening van haar taak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel42
  - number: '42.3'
    text: |-
      De Inspectie Werk en Inkomen bepaalt de termijn waarbinnen en de wijze waarop aan de in het eerste en tweede lid
      bedoelde verplichtingen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel42
  - number: '42.4'
    text: |-
      Indien naar het oordeel van de Inspectie Werk en Inkomen gerede twijfel bestaat omtrent de volledigheid of
      juistheid van de door het Uitvoeringsinstituut werknemersverzekeringen verstrekte stukken als bedoeld in
      [artikel 49][ref1], voor zover dit betreft de rechtmatige en doelmatige besteding van door dat instituut ter
      beschikking gestelde financiële middelen ten behoeve van de inschakeling van werkzoekenden, uitkeringsgerechtigden
      en werknemers in de arbeid, kan zij het Uitvoeringsinstituut werknemersverzekeringen opdragen bij de natuurlijke
      of rechtspersoon die deze middelen heeft besteed, ter verificatie een nader onderzoek te doen instellen door
      een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] die bij
      de verstrekte informatie niet betrokken is geweest. De Inspectie Werk en Inkomen bepaalt welke aspecten van de
      verstrekte informatie geverifieerd dienen te worden en de termijn waarbinnen het onderzoek wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '43'
    text: |-
      Onze Minister kan regels stellen waarin besluiten van de Centrale organisatie werk en inkomen, het
      Inlichtingenbureau, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank worden
      omschreven die overeenkomstig die regels, binnen de in die regels gestelde termijnen, ter kennis van de Inspectie
      Werk en Inkomen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel43
  - number: '44.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taakuitoefening, de
      inrichting en het beheer van de Inspectie Werk en Inkomen en haar positie binnen de departementale organisatie.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel44
  - number: '44.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel44
  - number: '45.1'
    text: |-
      De uitvoeringskosten van de Raad voor werk en inkomen en de Centrale organisatie werk en inkomen komen ten laste
      van de daartoe door Onze Minister toegekende rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel45
  - number: '45.2'
    text: |-
      De uitvoeringskosten van het Uitvoeringsinstituut werknemersverzekeringen komen ten laste van de fondsen,
      bedoeld in [artikel 1, onderdelen j tot en met n, van de Wet financiering sociale verzekeringen][ref1] en
      het Reïntegratiefonds, het Arbeidsongeschiktheidsfonds jonggehandicapten en het Toeslagenfonds, genoemd in
      [artikel 30, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: '45.3'
    text: |-
      De uitvoeringskosten van de Sociale verzekeringsbank komen ten laste van de fondsen, bedoeld in
      [artikel 1, onderdelen f en g, van de Wet financiering sociale verzekeringen][ref1] en het Algemeen
      Kinderbijslagfonds, genoemd in [artikel 34, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '34'
        hoofdstuk: '6'
  - number: '45.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de toerekening van de uitvoeringskosten aan de in het
      tweede en derde lid genoemde fondsen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel45
  - number: '46.1'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank stellen ieder elk jaar een begroting en een jaarplan
      voor het komende kalenderjaar vast en bieden dit vóór een door hem vast te stellen datum aan Onze Minister aan.
      Besluiten tot vaststelling van het jaarplan en van de begroting behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
  - number: '46.2'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank stellen ieder elk jaar een meerjarenbeleidsplan vast, dat betrekking heeft op de vier jaren die
      volgen op het jaar waarop het in het eerste lid bedoelde jaarplan betrekking heeft, en bieden dit vóór een door hem
      vast te stellen datum aan Onze Minister aan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
  - number: '46.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de inhoud en de indiening van de begroting en
      ontwerpen daarvan, van het jaarplan en van het meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
  - number: '46.4'
    text: |-
      Onze Minister brengt de in het eerste en tweede lid bedoelde plannen alsmede zijn oordeel over die plannen
      jaarlijks ter kennis van de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
  - number: '46.5'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank kunnen slechts afwijken van het jaarplan indien Onze
      Minister het besluit tot afwijking van het jaarplan heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
  - number: '46.6'
    text: |-
      Een besluit tot wijziging van de begroting behoeft de goedkeuring van Onze Minister, tenzij de wijziging, gerekend
      over het betrokken begrotingsjaar, een bedrag van 5 procent van het in [artikel 48][ref1] bedoelde budget niet
      overschrijdt. In dat geval wordt het besluit ter kennis gebracht van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel48
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '48'
        hoofdstuk: '8'
  - number: '47.1'
    text: |-
      De begroting behelst een raming van de baten en lasten, een raming van de voorgenomen investeringsuitgaven en een
      raming van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel47
  - number: '47.2'
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel47
  - number: '47.3'
    text: |-
      Uit de toelichting blijkt steeds welk begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens
      de wet opgedragen taken dan wel op andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel47
  - number: '47.4'
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel47
  - number: '48.1'
    text: |-
      Onze Minister stelt jaarlijks vóór 1 december het budget voor de uitvoeringskosten van de Raad voor werk en
      inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank voor het eerstvolgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister kan besluiten het budget voor de uitvoeringskosten van de Raad voor werk en inkomen, de Centrale
      organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank te
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '48.3'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de desbetreffende rechtspersoon daarvan onverwijld
      mededeling aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '48.4'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank gaan met betrekking tot de uitvoering van verzekeringen en
      wetten geen verplichtingen aan en doen geen uitgaven die leiden tot overschrijden van het voor hen vastgestelde
      budget voor de uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '48.5'
    text: |-
      Wanneer het budget voor de uitvoeringskosten van de in het eerste lid genoemde rechtspersonen niet is vastgesteld
      vóór 1 januari van het kalenderjaar waarop de begroting betrekking heeft, zijn deze rechtspersonen bevoegd,
      teneinde hun activiteiten gaande te houden, te beschikken over ten hoogste een derde gedeelte van het budget dat
      laatstelijk voor hen voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '48.6'
    text: |-
      Onze Minister kan besluiten dat een in het tweede lid genoemde rechtspersoon, in een geval als bedoeld in het
      vijfde lid, kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor deze rechtspersoon
      voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel48
  - number: '49.1'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank stellen jaarlijks een jaarverslag en een jaarrekening op en
      bieden deze vóór 15 maart aan Onze Minister aan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.2'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank beschrijven in hun jaarverslag de taakuitoefening en het
      gevoerde beleid in het afgelopen jaar en, voorzover het de genoemde bestuursorganen betreft, de doelmatigheid
      van de uitvoering van de aan die bestuursorganen opgedragen taken in het verstreken boekjaar en de mate waarin de
      doelstellingen van de bij of krachtens de wet gestelde regels werden bereikt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.3'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank leggen in hun jaarrekening rekening en
      verantwoording af over het financieel beheer en, voorzover het betreft de genoemde bestuursorganen, in
      elk geval over de rechtmatigheid van de uitvoering van de aan die bestuursorganen opgedragen taken in het
      verstreken boekjaar. De jaarrekening wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '49.4'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de desbetreffende rechtspersoon aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing van de accountant
      bedingt de rechtspersoon dat aan Onze Minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden van
      de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '49.5'
    text: |-
      De verklaring, bedoeld in het vierde lid, heeft mede betrekking op de rechtmatige verkrijging en besteding van de
      middelen door de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.6'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het vierde lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van de rechtspersoon voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.7'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.8'
    text: |-
      Uiterlijk zes weken na het verstrijken van elk kwartaal bieden de Raad voor werk en inkomen, de Centrale
      organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank aan
      Onze Minister een kwartaalverslag over dat verstreken kwartaal aan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de jaarrekening, de verklaring, bedoeld in het
      vierde lid, en het aan die verklaring ten grondslag liggende onderzoek, het jaarverslag en het kwartaalverslag. In
      afwijking van het achtste lid kan bij ministeriële regeling worden bepaald dat het kwartaalverslag van het vierde
      en laatste kwartaal in de daarbij omschreven gevallen, achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '49.10'
    text: |-
      Onze Minister brengt de jaarrekeningen en jaarverslagen van de Raad voor werk en inkomen, de Centrale organisatie
      werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank alsmede zijn
      oordeel daaromtrent jaarlijks vóór de derde woensdag in mei ter kennis van de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel49
  - number: '54.1'
    text: |-
      Een ieder verstrekt op verzoek aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank en Onze Minister en de Inspectie Werk en Inkomen, kosteloos,
      alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van bij of krachtens deze wet of enige
      andere wet door het desbetreffende bestuursorgaan en de Inspectie Werk en Inkomen uit te voeren taken ten opzichte
      van:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.1.a
    text: de betrokken persoon zelf;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.1.b
    text: de persoon in wiens dienst dan wel ten behoeve van wie hij werkt of gewerkt heeft;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.1.c
    text: de persoon die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.2'
    text: |-
      Een ieder kan uit eigen beweging de in het eerste lid bedoelde gegevens en inlichtingen aan de in het eerste lid
      bedoelde bestuursorganen en aan de Inspectie Werk en Inkomen verstrekken.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.3'
    text: |-
      Alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de in het eerste lid bedoelde taken
      worden aan de in dat lid genoemde bestuursorganen en aan de Inspectie Werk en Inkomen op verzoek, kosteloos, tevens
      verstrekt door:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.3.a
    text: de colleges van burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.3.b
    text: de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.3.c
    text: |-
      de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met
      de taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] en de arbodienst, bedoeld in de
      [Arbeidsomstandighedenwet 1998][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
  - number: 54.3.d
    text: |-
      het College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1], de
      zorgverzekeraars, bedoeld in de [Zorgverzekeringswet][ref2] of de [Algemene Wet Bijzondere Ziektekosten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0002614
  - number: 54.3.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen, stichtingen tot uitvoering van een
      regeling inzake vervroegd uittreden, en andere organen belast met het doen van uitkeringen of verstrekkingen die
      bij of krachtens [artikel 6 van de Toeslagenwet][ref1] als inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel6
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '6'
  - number: 54.3.f
    text: |-
      de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 1996][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: 54.3.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 54.3.h
    text: Onze Minister van Justitie voorzover het betreft de persoon die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.3.i
    text: |-
      de door Onze Minister aangewezen ambtenaren als bedoeld in [artikel 14 van de Wet arbeid vreemdelingen][ref1] en
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 54.3.j
    text: |-
      griffiers van colleges, geheel of ten dele met rechtspraak belast, desgevraagd in de vorm van uittreksels uit of
      afschriften van uitspraken, registers en andere stukken;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: 54.3.k
    text: |-
      de Informatie Beheer Groep, bedoeld in de [Wet verzelfstandiging Informatiseringsbank][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006320
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006320
  - number: 54.3.l
    text: |-
      het Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in de
      [Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007292
  - number: '54.4'
    text: |-
      De in het eerste en derde lid bedoelde gegevens en inlichtingen worden op verzoek, binnen de daarbij gestelde
      termijn, verstrekt in schriftelijke vorm of in een andere vorm die redelijkerwijs kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.5'
    text: |-
      Degene op wie de in het eerste en derde lid bedoelde verplichting rust geeft op verzoek aan een bestuursorgaan
      als bedoeld in het eerste lid, alsmede aan de Inspectie Werk en Inkomen inzage in alle bescheiden en andere
      gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de ter zake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van de in het eerste lid bedoelde taken
      door het in dat lid bedoelde bestuursorgaan en de Inspectie Werk en Inkomen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.6'
    text: |-
      Onze Minister verstrekt aan de Raad voor werk en inkomen gegevens en inlichtingen die deze raad nodig heeft voor de
      uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de verstrekking door de Centrale organisatie werk
      en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank en de colleges van
      burgemeester en wethouders aan de Raad voor werk en inkomen van gegevens en inlichtingen die deze raad nodig heeft
      voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.8'
    text: |-
      Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen, onverwijld
      en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed kunnen zijn op het
      recht op uitkering, aan de Sociale verzekeringsbank en het Uitvoeringsinstituut werknemersverzekeringen, waarbij
      hij gebruik kan maken van het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '54.9'
    text: |-
      Reïntegratiebedrijven verstrekken aan het Uitvoeringsinstituut werknemersverzekeringen alle opgaven en inlichtingen
      die noodzakelijk zijn voor de uitvoering van de krachtens deze wet aan het Uitvoeringsinstituut opgedragen taken.
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de gegevens die worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel54
  - number: '55.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen
      en de Sociale verzekeringsbank stellen bij de uitoefening van hun taak de
      identiteit van de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], voorzover dit
      noodzakelijk is voor de uitoefening van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '55.2'
    text: |-
      Een ieder verstrekt op verzoek onverwijld aan de in het eerste lid genoemde rechtspersonen inzage in een op hem
      betrekking hebbend document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], voorzover dit
      redelijkerwijs nodig is voor de uitvoering van wettelijke taken door de betrokken rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '55.3'
    text: |-
      De werkgever treft in zijn bedrijf zodanige maatregelen dat de daar werkzame personen gedurende de arbeidstijd aan
      de verplichting bedoeld in het tweede lid kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel55
  - number: '56.1'
    text: |-
      De Centrale organisatie werk en inkomen geeft, indien deze organisatie het gegronde vermoeden heeft dat een
      belanghebbende de verplichting tot het verstrekken van inlichtingen op grond van [artikel 28, tweede lid][ref1],
      en [29, eerste lid][ref2], niet nakomt of anderszins onvoldoende medewerking verleent, dan wel dat
      een werknemer in de zin van de [Werkloosheidswet][ref3] een verplichting, hem opgelegd op grond van de
      [artikelen 24, eerste lid, onderdeel b][ref4], of [26, eerste lid, onderdeel d, e, f of i, van die wet][ref5] niet
      nakomt, dan wel dat een omstandigheid als bedoeld in [artikel 18, tweede lid, van de Wet werk en bijstand][ref6],
      __REF006___________________________________________________________________________________________________________
      ______________________ of
      __REF007___________________________________________________________________________________________________________
      ___________ zich voordoet, hiervan onverwijld kennis aan het Uitvoeringsinstituut werknemersverzekeringen,
      onderscheidenlijk burgemeester en wethouders van de betrokken gemeente, onder vermelding van de gronden waarop het
      vermoeden steunt. De kennisgeving wordt schriftelijk of langs elektronische weg vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0004044#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0004163#Artikel20
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '29'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '26'
      - id: ref6
        bwb_id: BWBR0015703
        artikel: '18'
      - id: ref7
        bwb_id: BWBR0004044
        artikel: '20'
      - id: ref8
        bwb_id: BWBR0004163
        artikel: '20'
  - number: '56.2'
    text: |-
      De Centrale organisatie werk en inkomen geeft overeenkomstig het eerste lid kennis aan de Sociale verzekeringsbank
      dat een omstandigheid als bedoeld in [artikel 7, zesde lid, tweede zin, van de Algemene Kinderbijslagwet][ref1]
      zich voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '57'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank geeft, indien deze rechtspersoon het gegronde vermoeden heeft dat het uitbetaalde
      loon en de vakantiebijslag van een verzekerde minder bedragen dan waarop hij op grond van het bepaalde
      bij of krachtens de [Wet minimumloon en minimumvakantiebijslag][ref1] als minimumloon aanspraak
      heeft, hiervan onverwijld schriftelijk kennis aan de verzekerde en aan de ambtenaren, bedoeld in
      [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel18b
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002638
      - id: ref2
        bwb_id: BWBR0002638
        artikel: 18b
  - number: '61'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de rijksbelastingdienst
      en de Sociale verzekeringsbank zijn verplicht, indien zij bij de uitvoering van deze wet en de
      [Wet financiering sociale verzekeringen][ref1] het gegronde vermoeden krijgen van een misdrijf dat is gepleegd ten
      nadele van deze organen of een ander orgaan, voorzover dit is belast met het verrichten van uitkeringen, het doen
      van verstrekkingen dan wel het heffen van premies en bijdragen, het betrokken orgaan hiervan in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '62.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale
      verzekeringsbank en burgemeester en wethouders van de gemeenten verstrekken elkaar uit eigen beweging en op
      verzoek, kosteloos, alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van de taken die bij
      of krachtens deze wet of enige andere wet aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank en bij of krachtens de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] aan burgemeester en
      wethouders van de gemeenten is opgedragen. Zij maken daarbij gebruik van het sociaal-fiscaalnummer van de personen
      op wie de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: '62.2'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen
      en burgemeester en wethouders van de gemeenten maken bij de uitvoering van de taken die bij
      of krachtens deze wet of enige andere wet aan de Centrale organisatie werk en inkomen of het
      Uitvoeringsinstituut werknemersverzekeringen en bij of krachtens de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] aan burgemeester
      en wethouders van de gemeenten is opgedragen, gebruik van een elektronische infrastructuur die daartoe door hen en
      Onze Minister wordt ingericht en in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: '62.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het gebruik van de in het
      tweede lid bedoelde infrastructuur door Onze Minister en de Inspectie Werk en Inkomen in verband met de toepassing
      van de [artikelen 42][ref1], [54][ref2] en [72][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel72
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
  - number: '62.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het gebruik van de in het
      tweede lid bedoelde infrastructuur voor het verstrekken van gegevens en inlichtingen, bedoeld in [artikel 54][ref1]
      of [73][ref2], voorzover dit noodzakelijk is voor de opsporing van feiten strafbaar gesteld bij deze of enige
      andere wet of voor het toezicht op de naleving van deze of enige andere wet als bedoeld in [artikel 54][ref3] of
      [73][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '62.5'
    text: |-
      Bij ministeriële regeling kunnen het eerste en tweede lid van toepassing worden verklaard op de uitvoering van
      andere dan de in het eerste en tweede lid genoemde wetten door burgemeester en wethouders van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
  - number: '62.6'
    text: |-
      Bij de uitvoering door de Centrale organisatie werk en inkomen van de taak, bedoeld in [artikel 21a][ref1], is het
      tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 21a
        hoofdstuk: '4'
  - number: '63.1'
    text: |-
      Het Inlichtingenbureau is belast met de coördinatie en dienstverlening ten behoeve van de gemeenten bij de
      toepassing van [artikel 62][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '63.2'
    text: |-
      [Artikel 19][ref1] is ten aanzien van het Inlichtingenbureau van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel19
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '19'
        hoofdstuk: '3'
  - number: '63.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het Inlichtingenbureau, in
      ieder geval over de taken, de financiering, de goedkeuring door Onze Minister van het jaarplan en de begroting en
      het gebruik van het sociaal-fiscaalnummer door deze instelling.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel63
  - number: '64.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en, door tussenkomst
      van het Inlichtingenbureau, burgemeester en wethouders van gemeenten verstrekken elkaar met gebruik van Suwinet
      gegevens overeenkomstig het Gegevensregister Suwi.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel64
  - number: '64.2'
    text: Bij ministeriële regeling wordt het Gegevensregister Suwi vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel64
  - number: '66.1'
    text: Bij ministeriële regeling wordt het Stelselontwerp Suwinet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: '66.2'
    text: 'Het Stelselontwerp Suwinet bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.a
    text: de modaliteiten waarin gegevens worden uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.b
    text: |-
      de inrichting van een Personenverwijsbestand door de Centrale organisatie werk en inkomen en het
      Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.c
    text: |-
      de inrichting van een Personenverwijsbestand door het Inlichtingenbureau ten behoeve van burgemeester en wethouders
      van gemeenten;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.d
    text: de protocollen en standaards die worden ondersteund door Suwinet;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.e
    text: de inhoud en de structuur van standaardberichten welke via Suwinet worden uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: 66.2.f
    text: |-
      de inrichting van een toegangsmachtigingsadministratie door de Centrale organisatie werk en inkomen, het
      Uitvoeringsinstituut werknemersverzekeringen, het Inlichtingenbureau en burgemeester en wethouders van gemeenten.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel66
  - number: '67.1'
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die beheertaken ten behoeve van het Suwinet uitvoert. Onze Minister
      kan aan deze rechtspersoon een rijksbijdrage toekennen voor de uitvoering van deze taken.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel67
  - number: '67.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de organisatie van het beheer van Suwinet respectievelijk
      van onderscheiden onderdelen daarvan door de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen, het Inlichtingenbureau, burgemeester en wethouders van gemeenten en de rechtspersoon,
      bedoeld in het eerste lid, en kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel67
  - number: '68.1'
    text: |-
      De rechtspersoon, bedoeld in [artikel 67, eerste lid][ref1], stelt jaarlijks in een verslag de aard en frequentie
      van de uitwisseling van gegevens met behulp van Suwinet vast.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel67
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '67'
        hoofdstuk: '9'
  - number: '68.2'
    text: Bij ministeriële regeling kunnen regels gesteld worden omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel68
  - number: '69'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de toerekening van de kosten van de inrichting, de
      instandhouding en het gebruik van Suwinet aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en burgemeester en wethouders van gemeenten.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel69
  - number: '70'
    text: |-
      Bij ministeriële regeling kunnen de [artikelen 62, tweede lid][ref1], [64][ref2] en [66 tot en met 69][ref3] van
      overeenkomstige toepassing worden verklaard op de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel66
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '64'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '66'
        hoofdstuk: '9'
  - number: '71'
    text: |-
      Alvorens regels worden gesteld op grond van de [artikelen 63, derde lid][ref1], [64, tweede lid][ref2], [65][ref3],
      [66, eerste lid][ref4], [67, tweede lid][ref5], [68, tweede lid][ref6], [69][ref7] of [70][ref8] stelt Onze
      Minister de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale
      verzekeringsbank en een door hem aangewezen rechtspersoon die de gemeenten vertegenwoordigt, in de gelegenheid
      hierover met hem overleg te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel66
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel67
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel68
      [ref7]: https://wetten.overheid.nl/BWBR0013060#Artikel69
      [ref8]: https://wetten.overheid.nl/BWBR0013060#Artikel70
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '63'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '64'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '65'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '66'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '67'
        hoofdstuk: '9'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '68'
        hoofdstuk: '9'
      - id: ref7
        bwb_id: BWBR0013060
        artikel: '69'
        hoofdstuk: '9'
      - id: ref8
        bwb_id: BWBR0013060
        artikel: '70'
        hoofdstuk: '9'
  - number: '72'
    text: |-
      De Raad voor werk en inkomen, de Centrale organisatie werk en inkomen, het Inlichtingenbureau, het
      Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank verstrekken op verzoek, kosteloos, aan
      Onze Minister alle gegevens en inlichtingen die voor de uitoefening van zijn taak noodzakelijk zijn. Zij verlenen
      hem op verzoek toegang tot en inzage in gegevens en bescheiden voorzover dat voor de uitoefening van zijn taak
      noodzakelijk is. Onze Minister bepaalt de termijn waarbinnen en de wijze waarop aan de in dit artikel bedoelde
      verplichtingen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel72
  - number: '73.1'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank zijn bevoegd op verzoek uit de onder hun verantwoordelijkheid gevoerde administratie aan:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: 73.1.a
    text: |-
      bedrijfstakpensioenfondsen als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Pensioen- en spaarfondsenwet][ref1], ondernemingspensioenfondsen als
      bedoeld in [artikel 1, eerste lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref2], verzekeraars als bedoeld
      in [artikel 2, vierde lid, onderdeel B, van de Pensioen- en spaarfondsenwet][ref3] en beroepspensioenfondsen als
      bedoeld in [artikel 1, onderdeel j, van de Wet verplichte beroepspensioenregeling][ref4], die pensioenregelingen
      uitvoeren, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van die
      pensioenregelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 73.1.b
    text: |-
      stichtingen die regelingen inzake vervroegd uittreden op grond van een algemeen verbindend voorschrift uitvoeren,
      alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van die regelingen;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: 73.1.c
    text: |-
      risicofondsen of bij collectieve arbeidsovereenkomst aangewezen instellingen of collectieve voorzieningen
      voor werknemers, alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van de
      statuten en reglementen van die fondsen of van die bij collectieve arbeidsovereenkomst aangewezen instellingen
      of voorzieningen, voorzover die uitvoering betrekking heeft op taken die naar hun aard gelijk zijn aan de
      taken, die bij of krachtens deze wet aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '73.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd op verzoek alle gegevens en inlichtingen, waaronder het
      sociaal-fiscaalnummer, uit de onder zijn verantwoordelijkheid gevoerde administraties te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: 73.2.a
    text: |-
      werkgevers in de zin van de [Wet financiering sociale verzekeringen][ref1], voorzover die noodzakelijk zijn
      voor de informatieverstrekking bij de aanvraag van overeenkomsten tot verzekering van het risico van het
      betalen van loon in geval van ziekte van de werknemer dan wel van het risico van het betalen van premie voor de
      arbeidsongeschiktheidsverzekering op grond van de Wet financiering sociale verzekeringen en van de betalingen als
      gevolg van het eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 73.2.b
    text: |-
      verzekeraars als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Wet toezicht verzekeringsbedrijf 1993][ref1],
      voorzover die noodzakelijk zijn voor de uitvoering van overeenkomsten met werkgevers in de zin van de
      [Wet financiering sociale verzekeringen][ref2] tot verzekering van het risico van het betalen van loon in geval van
      ziekte van de werknemer dan wel van het risico van het betalen van premie voor de arbeidsongeschiktheidsverzekering
      op grond van de [Wet financiering sociale verzekeringen][ref3] en van de betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van die wet][ref4], indien die werkgevers daartoe machtiging
      hebben verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0017745
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '40'
  - number: '73.3'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank verstrekken op verzoek uit de onder hun verantwoordelijkheid gevoerde administratie aan de
      persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met
      de taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] en de arbodienst, bedoeld in de
      [Arbeidsomstandighedenwet 1998][ref3], alle gegevens en inlichtingen, die noodzakelijk zijn voor de uitvoering van
      die taken door die persoon of die arbodienst, en het Uitvoeringsinstituut werknemersverzekeringen is bevoegd met
      het oog op de uitvoering van die taken uit eigen beweging gegevens te verstrekken, die noodzakelijk zijn voor de
      uitvoering van die taken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
  - number: '73.4'
    text: |-
      De Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank kunnen gegevens inzake de uitvoering van hun wettelijke taken ten behoeve van wetenschappelijk
      onderzoek of statistiek verzamelen en aan derden verstrekken. Bij of krachtens algemene maatregel van bestuur
      worden regels gesteld voor de gegevens en de derden aan wie gegevens mogen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '73.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verstrekking van
      gegevens door de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale
      verzekeringsbank of Onze Minister aan andere bestuursorganen, die noodzakelijk zijn voor de uitvoering van aan die
      andere bestuursorganen opgedragen taken, de daarvoor in rekening te brengen kosten, en het gebruik daarbij van de
      infrastructuur, bedoeld in [artikel 62, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
  - number: '73.6'
    text: |-
      Onze Minister kan aan de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen, de
      Sociale verzekeringsbank en burgemeester en wethouders van de gemeenten alle gegevens verstrekken die zij voor een
      goede uitvoering van hun wettelijke taken nodig hebben.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '73.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens op grond van het eerste, tweede en
      derde lid lid mogen worden verstrekt en welke kosten daarvoor in rekening mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '73.8'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan een reïntegratiebedrijf alle
      gegevens en inlichtingen die noodzakelijk zijn voor het verrichten van werkzaamheden als bedoeld in
      [artikel 30, zesde lid][ref1], alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid
      door het reïntegratiebedrijf wordt bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
  - number: '73.9'
    text: |-
      De Centrale organisatie werk en inkomen is bevoegd uit de onder haar verantwoordelijkheid gevoerde
      administratie aangelegd voor de uitoefening van taken als bedoeld in [artikel 21][ref1] en [21a][ref2],
      aan een reïntegratiebedrijf gegevens te verstrekken, die noodzakelijk zijn voor het verrichten
      van werkzaamheden door dat reïntegratiebedrijf in opdracht van de colleges van burgemeester en
      wethouders, het Uitvoeringsinstituut werknemersverzekeringen of een eigenrisicodrager als bedoeld in
      [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 21a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '42'
  - number: '73.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de gegevens die op grond van het achtste
      en negende lid worden verstrekt en de structuur en schrijfwijze van die gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '73.11'
    text: 'Het sociaal-fiscaalnummer kan bij de verwerking van gegevens gebruikt worden door:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: 73.11.a
    text: |-
      een reïntegratiebedrijf voorzover dit noodzakelijk is voor het verrichten van werkzaamheden in opdracht
      van het Uitvoeringsinstituut werknemersverzekering als bedoeld in [artikel 30, zesde lid][ref1], of van een
      eigenrisicodrager als bedoeld in [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '42'
  - number: 73.11.b
    text: |-
      een verzekeraar als bedoeld in het tweede lid, onderdeel b, voorzover dit noodzakelijk is voor de
      verzekeringsovereenkomsten, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel73
  - number: '74.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
  - number: '74.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
  - number: 74.2.a
    text: enig wettelijk voorschrift tot de bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
  - number: 74.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
  - number: 74.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
  - number: '74.3'
    text: |-
      Degene die op grond van de [artikelen 62][ref1], [72][ref2] of [73][ref3] gegevens verstrekt dient na te gaan of
      degene aan wie de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '72'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
        hoofdstuk: '9'
  - number: '74.4'
    text: |-
      Onverminderd het eerste tot en met derde lid is [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1]
      voorzover het betreft de overeenkomstige toepassing van de [artikelen 457][ref2] en
      [464, tweede lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref3] niet van toepassing indien in verband
      met de uitvoering van deze wet handelingen worden verricht op het gebied van de geneeskunst door personen, voor wie
      het in het eerste lid vervatte verbod geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel464
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '457'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '464'
  - number: '75'
    text: |-
      De door de Centrale organisatie werk en inkomen geregistreerde gegevens zijn openbaar voorzover die van belang zijn
      voor de uitoefening van de in [artikel 21, onderdeel b][ref1], genoemde taak, met dien verstande dat openbaarmaking
      van tot een individuele werkzoekende of een individuele werkgever, zijnde een natuurlijke persoon, herleidbare
      gegevens plaatsvindt met inachtneming van de [Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011468
  - number: '76'
    text: |-
      De Centrale organisatie werk en inkomen, het Inlichtingenbureau, het Uitvoeringsinstituut werknemersverzekeringen
      en de Sociale verzekeringsbank dragen op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg
      voor de nodige technische en organisatorische voorzieningen ter beveiliging van hun gegevens tegen verlies of
      aantasting en tegen onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel76
  - number: '77'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de verstrekking van inlichtingen en het verlenen
      van inzage in gegevens en bescheiden door de Centrale organisatie werk en inkomen, het Inlichtingenbureau, het
      Uitvoeringsinstituut werknemersverzekeringen, de Raad voor werk en inkomen en de Sociale verzekeringsbank aan
      Onze Minister en aan de Inspectie Werk en Inkomen op grond van deze wet en kunnen regels worden gesteld omtrent de
      inrichting van de administratie van de genoemde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel77
  - number: '78.1'
    text: |-
      Onze Minister kan de Centrale organisatie werk en inkomen, het Inlichtingenbureau, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank aanwijzingen geven met betrekking tot de uitoefening van hun
      taken. Hij treedt daarbij niet in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel78
  - number: '78.2'
    text: |-
      De Centrale organisatie werk en inkomen, het Inlichtingenbureau, het Uitvoeringsinstituut werknemersverzekeringen
      en de Sociale verzekeringsbank zijn gehouden overeenkomstig de aanwijzing, bedoeld in het eerste lid, te handelen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel78
  - number: '79'
    text: |-
      Indien een besluit goedkeuring behoeft op grond van deze wet of enige andere wet die wordt uitgevoerd door
      de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank kan de goedkeuring worden onthouden op de grond dat het besluit in strijd met het recht of met het
      algemeen belang is.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel79
  - number: '80.1'
    text: |-
      Onze Minister kan een besluit van de Centrale organisatie werk en inkomen, van het Uitvoeringsinstituut
      werknemersverzekeringen en van de Sociale verzekeringsbank vernietigen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel80
  - number: '80.2'
    text: Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel80
  - number: '81.1'
    text: |-
      Indien naar het oordeel van Onze Minister de Centrale organisatie werk en inkomen, het Inlichtingenbureau, het
      Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank zijn taak ernstig verwaarloost, kan
      Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel81
  - number: '81.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Centrale
      organisatie werk en inkomen, het Inlichtingenbureau, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak
      naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel81
  - number: '81.3'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel81
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk
      zijn in verband met de goede uitvoering door de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen of de Sociale verzekeringsbank van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82
  - number: '82.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82
  - number: '82.3'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide Kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0013060/2006-10-01#Artikel82
  - number: 82a.1
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op
      het onderzoeken van mogelijkheden om deze wet, de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], de
      [Werkloosheidswet][ref4] en de [Toeslagenwet][ref5] met betrekking tot de beoordeling van en advisering over
      arbeidsinschakeling en het aanvragen van uitkeringen, toeslagen of bijstand doeltreffender uit te voeren, worden
      afgeweken van het bepaalde bij of krachtens de [artikelen 21, onderdelen e en f][ref6], [26][ref7], [28][ref8] en
      [29 van deze wet][ref9], [artikel 41 van de Wet werk en bijstand][ref10], de [artikelen 11a, eerste lid][ref11], en
      __REF011___________________________________________________________________________________________________________
      ___, de [artikelen 11a, eerste lid][ref13], en
      __REF013___________________________________________________________________________________________________________
      _____, de [artikelen 22, tweede lid][ref15], en [26 van de Werkloosheidswet][ref16] en
      [artikel 11, tweede lid, van de Toeslagenwet][ref17]. Bij toepassing van de eerste volzin wordt bij algemene
      maatregel van bestuur geregeld op welke wijze van welke artikelen wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
