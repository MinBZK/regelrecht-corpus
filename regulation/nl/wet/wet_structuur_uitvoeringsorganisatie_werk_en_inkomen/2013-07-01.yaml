  - number: 82a.2
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het eerste lid wordt geregeld op welke wijze van welke
      artikelen wordt afgeweken en kunnen alleen regels worden gesteld:
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.2.a
    text: ter verbetering van de samenwerking tussen de uitvoeringsorganisaties van de in het eerste lid genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.2.b
    text: |-
      met betrekking tot de inzet van re-integratie-instrumenten, de financiering daarvan en de
      verantwoordelijkheidsverdeling tussen werkgevers en de bij onderdeel a bedoelde uitvoeringsorganisaties;
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.2.c
    text: |-
      over de verantwoording van de uitgaven ten laste van de fondsen, de uitkeringen, bedoeld in
      [artikel 69 van de Wet werk en bijstand][ref1], en rijksbijdragen;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
  - number: 82a.2.d
    text: het verstrekken van inlichtingen over de resultaten van de experimenten.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.3
    text: 'Een algemene maatregel van bestuur als bedoeld in het eerste lid vervalt vijf jaar na de inwerkingtreding, tenzij:'
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.3.a
    text: in de algemene maatregel van bestuur is bepaald dat deze eerder vervalt;
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.3.b
    text: |-
      binnen deze vijf jaar een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in
      een wettelijke regeling.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.4
    text: |-
      Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel tot wet
      verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.5
    text: |-
      Onze Minister kan op gezamenlijk verzoek van een college van burgemeester en wethouders, het Uitvoeringsinstituut
      werknemersverzekeringen en in voorkomend geval de Sociale verzekeringsbank, gemeenten aanwijzen waar door
      het college van burgemeester en wethouders, het Uitvoeringsinstituut werknemersverzekeringen of de Sociale
      verzekeringsbank wordt deelgenomen aan een experiment. Bij of krachtens algemene maatregel van bestuur kunnen
      regels worden gesteld met betrekking tot de toepassing van deze bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.6
    text: |-
      Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: 82a.7
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel82a
  - number: '83'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of, indien het advies vraagt
      aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is, binnen een en twintig weken, gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel83
  - number: 83c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een bestuurlijke boete van ten hoogste € 1500
      opleggen aan de persoon, bedoeld in [artikel 54, eerste lid, onderdelen b en c][ref1], die op grond van
      [artikel 54, eerste lid][ref2], gehouden is tot het verstrekken van gegevens en inlichtingen aan het
      Uitvoeringsinstituut werknemersverzekeringen of de Centrale organisatie werk en inkomen, indien hij deze niet dan
      wel niet binnen de op grond van [artikel 54, vierde lid][ref3], gestelde termijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '54'
        hoofdstuk: '9'
  - number: 83c.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een bestuurlijke boete van ten hoogste € 5000 opleggen aan
      de persoon, bedoeld in het eerste lid, indien het aan opzet of grove schuld van hem is te wijten dat geen, dan wel
      onjuiste of onvolledige inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel83c
  - number: 83i
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen informeert de werknemer, bedoeld in de [Werkloosheidswet][ref1],
      van wie door het Uitvoeringsinstituut werknemersverzekeringen gegevens zijn verwerkt op grond van
      deze wet, over het tijdvak vanaf 1 januari 1998 op de wijze, bedoeld in [artikel 33c][ref2], over
      ieder kalenderjaar in dat tijdvak of hij over 52 of meer dagen loon heeft ontvangen als bedoeld in
      [artikel 42 van de Werkloosheidswet][ref3] en [artikel 15 van de Wet werk en inkomen naar arbeidsvermogen][ref4],
      dan wel [artikel 42a van de Werkloosheidswet][ref5] in een kalenderjaar van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33c
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel83i
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
