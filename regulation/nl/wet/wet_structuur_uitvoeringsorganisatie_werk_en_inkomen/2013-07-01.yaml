  - number: 83k.1
    text: |-
      De werkzaamheden, die worden verricht uit hoofde van de uitoefening van de taak,
      bedoeld in [artikel 10 van de Wet op de (re)integratie arbeidsgehandicapten][ref1],
      zoals dit artikel luidde tot de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2],
      waardoor [dit artikel 10][ref3] vervalt, worden aangemerkt als werkzaamheden uitgevoerd op grond van
      [artikel 30a, achtste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013060/2013-07-01#Artikel83k
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: 30a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 83k.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft de taak, bedoeld in
      [artikel 30a, eerste lid][ref1], ten aanzien van personen die met toepassing van
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] geacht werden verzekerd te
      zijn voor de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] ook na de inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref4], waardoor
      [artikel 77 van de Wet op de (re)integratie arbeidsgehandicapten][ref5] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel77
