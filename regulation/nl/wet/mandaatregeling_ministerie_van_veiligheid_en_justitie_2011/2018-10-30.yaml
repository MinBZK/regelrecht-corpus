---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatregeling_ministerie_van_veiligheid_en_justitie_2011
regulatory_layer: WET
publication_date: '2018-11-07'
valid_from: '2018-10-30'
bwb_id: BWBR0030842
url: https://wetten.overheid.nl/BWBR0030842/2018-10-30
preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9, eerste lid, en 10:12 van de Algemene wet bestuursrecht, de artikelen 22, vierde
    lid, en 32, vierde lid, van de Comptabiliteitswet 2001, artikel 4, eerste lid, onderdeel b, van het Algemeen
    Rijksambtenarenreglement en artikel 3, tweede lid, tweede volzin, van de Organisatieregeling Ministerie van
    Veiligheid en Justitie 2011;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
  - number: 1.a
    text: '*bewindspersoon:* de Minister van Veiligheid en Justitie of de Staatssecretaris van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
  - number: 1.b
    text: '*mandaat:* de bevoegdheid om in naam van de bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
  - number: 1.c
    text: '*ministerie:* het Ministerie van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
  - number: 1.d
    text: |-
      *Organisatiebesluit:* het [Organisatiebesluit Ministerie van Veiligheid en Justitie 2015][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036820
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036820
  - number: 1.e
    text: |-
      *clusters:* de dienstonderdelen, genoemd in [artikel 2 van het Organisatiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '2'
  - number: '2'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot de verantwoordelijkheid van de
      bewindspersoon behorende aangelegenheden, met uitzondering van de bevoegdheid tot het nemen van besluiten die zijn
      neergelegd in een document, gericht tot:
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.b
    text: de raad van ministers van het Koninkrijk, de ministerraad of een daaruit gevormde onderraad of commissie;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.c
    text: de voorzitter van de Eerste of Tweede Kamer der Staten-Generaal of van een uit die Kamer gevormde commissie;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.d
    text: de vice-president van de Raad van State van het Koninkrijk of de vice-president van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.e
    text: de president van de Algemene Rekenkamer; of
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: 2.f
    text: |-
      de Nationale ombudsman, indien de strekking daarvan is dat aan een aanbeveling van de Nationale ombudsman geen
      gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel2
  - number: '3.1'
    text: 'De secretaris-generaal wordt toegestaan ondermandaat te verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
  - number: 3.1.a
    text: |-
      de hoofden van de clusters, bedoeld in [artikel 2, onderdelen b tot en met h, van het Organisatiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '2'
  - number: 3.1.b
    text: |-
      de hoofden van de dienstonderdelen, bedoeld in [artikel 4, tweede lid, van het Organisatiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel4
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '4'
  - number: 3.1.c
    text: andere bij het ministerie werkzame ambtenaren, voor zover zij niet ressorteren onder een hoofd van een cluster.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
  - number: '3.2'
    text: Het ondermandaat kan steeds één hiërarchisch niveau verder worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid kunnen de hoofden van de clusters of door hen aan te wijzen hoofden van andere
      dienstonderdelen hun (onder)mandaat inzake het nemen van besluiten inzake financieel beheer en het nemen van
      rechtspositionele besluiten ten aanzien van onder hen ressorterende ambtenaren verder dan één hiërarchisch niveau
      doorgeven.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het tweede lid kunnen de hoofden van de clusters hun (onder)mandaat inzake de aangelegenheden,
      bedoeld in [artikel 5, tweede lid, onderdeel a, van het Organisatiebesluit][ref1], doorgeven aan de directeur
      Wetgeving en Juridische Zaken. Het ondermandaat kan steeds één hiërarchisch niveau worden doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel5
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '5'
  - number: '3.5'
    text: |-
      In afwijking van het tweede lid kunnen de hoofden van de clusters, bedoeld in
      [artikel 2, onderdelen a en b, van het Organisatiebesluit][ref1], het (onder)mandaat inzake verzoeken op grond
      van de [Wet bescherming persoonsgegevens][ref2], verzoeken op grond van de [Wet openbaarheid van bestuur][ref3],
      verzoeken op grond van de [Wet hergebruik van overheidsinformatie][ref4], klachten, subsidiebesluiten,
      beleidsregels en, met inachtneming van [artikel 2, onderdeel f][ref5], Nationale ombudsmanprocedures, doorgeven aan
      de directeur Wetgeving en Juridische Zaken. Het ondermandaat kan steeds één hiërarchisch niveau worden doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011468
      [ref3]: https://wetten.overheid.nl/BWBR0005252
      [ref4]: https://wetten.overheid.nl/BWBR0036795
      [ref5]: https://wetten.overheid.nl/BWBR0030842#Artikel2
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011468
      - id: ref3
        bwb_id: BWBR0005252
      - id: ref4
        bwb_id: BWBR0036795
      - id: ref5
        bwb_id: BWBR0030842
        artikel: '2'
  - number: '3.6'
    text: |-
      In afwijking van het tweede lid kunnen het hoofd van het cluster, bedoeld in
      [artikel 2, onderdeel f, van het Organisatiebesluit][ref1], en de door deze aan te wijzen hoofden van andere
      dienstonderdelen hun ondermandaat inzake het nemen van besluiten op het terrein van de vreemdelingenwetgeving en
      van de [Rijkswet op het Nederlanderschap][ref2] verder dan één hiërarchisch niveau doorgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003738
  - number: '4'
    text: |-
      De secretaris-generaal wordt aangewezen als hoofd van dienst in de zin van
      [artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
  - number: '6.1'
    text: |-
      De hoofden van de clusters, bedoeld in [artikel 2, onderdelen c tot en met h, van het Organisatiebesluit][ref1],
      dragen er zorg voor dat openbare registers worden bijgehouden, betreffende de ondermandaten die zijn verleend aan
      ambtenaren, werkzaam bij de onder hen ressorterende dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '2'
  - number: '6.2'
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor een openbaar register betreffende
      ondermandaten die zijn verleend aan ambtenaren, werkzaam bij de in [artikel 4, tweede lid][ref1], en
      [artikel 13, tweede lid, van het Organisatiebesluit][ref2] genoemde dienstonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036820#Artikel13
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036820
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0036820
        artikel: '13'
  - number: '6.3'
    text: In de registers worden de functies vermeld van de desbetreffende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van deze regeling en de op grond daarvan verleende en doorgegeven ondermandaten worden met
      mandaat en ondermandaat gelijkgesteld de verlening en het doorgeven van:
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel7
  - number: 7.1.a
    text: volmacht om in naam van de bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel7
  - number: 7.1.b
    text: |-
      machtiging om in naam van de bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van [artikel 3][ref1] geldt dat het doorgeven van een volmacht om privaatrechtelijke
      rechtshandelingen te verrichten slechts is toegestaan voor zover het regelmatig voorkomende rechtshandelingen
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030842#Artikel3
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030842
        artikel: '3'
  - number: '8'
    text: |-
      Vóór het tijdstip van inwerkingtreding van deze regeling van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen op het terrein van het Ministerie van Veiligheid en Justitie waarin op het tijdstip van
      inwerkingtreding van deze regeling niet is voorzien, blijven van kracht totdat op grond van deze regeling is
      voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel8
  - number: '9.1'
    text: |-
      Door of namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties verleende mandaten en ondermandaten op het
      terrein van veiligheid behoudens de Algemene Inlichtingen- en Veiligheidsdienst, die op 13 oktober 2010 van kracht
      waren, worden aangemerkt als mandaten die met ingang van 14 oktober 2010 zijn verleend door of namens de Minister
      van Veiligheid en Justitie, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
  - number: 9.1.a
    text: |-
      mandaten aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden
      aangemerkt als mandaten aan de secretaris-generaal van het Ministerie van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
  - number: 9.1.b
    text: |-
      mandaten die rechtstreeks zijn verleend aan functionarissen die ressorteren onder het directoraat-generaal
      Veiligheid of de Inspectie Openbare Orde en Veiligheid worden aangemerkt als ondermandaten die overeenkomstig deze
      regeling zijn verleend.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
  - number: '9.2'
    text: |-
      Door of namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties verleende mandaten en ondermandaten op het
      terrein van de vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1], die op 4 november 2012
      van kracht waren, worden aangemerkt als mandaten die met ingang van 5 november 2012 zijn verleend door of namens de
      Minister van Veiligheid en Justitie, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002562
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002562
  - number: 9.2.a
    text: |-
      mandaten aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden
      aangemerkt als mandaten aan de secretaris-generaal van het Ministerie van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
  - number: 9.2.b
    text: |-
      mandaten die rechtstreeks zijn verleend aan functionarissen die ressorteren onder het directoraat-generaal
      Vreemdelingenzaken worden aangemerkt als ondermandaten die overeenkomstig deze regeling zijn verleend.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel9
  - number: '10'
    text: |-
      De [Mandaatregeling Ministerie van Veiligheid en Justitie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0029452
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029452
  - number: '11.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 2011.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel11
  - number: '11.2'
    text: |-
      Besluiten of handelingen die vóór het tijdstip van inwerkingtreding van deze regeling zijn genomen of verricht
      namens de bewindspersoon door een functionaris van een dienstonderdeel zoals dat dienstonderdeel tot 1 juli 2011
      werd aangeduid, behouden hun rechtskracht.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Mandaatregeling Ministerie van Veiligheid en Justitie 2011. Deze regeling zal
      met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0030842/2018-10-30#Artikel12
