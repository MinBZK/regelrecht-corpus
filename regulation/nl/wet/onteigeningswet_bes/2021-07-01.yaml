$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: onteigeningswet_bes
regulatory_layer: WET
publication_date: '2020-07-17'
valid_from: '2021-07-01'
bwb_id: BWBR0028729
url: https://wetten.overheid.nl/BWBR0028729/2021-07-01
articles:
  - number: '1'
    text: Onteigening ten algemene nutte kan in het publiek belang van de openbare lichamen plaats hebben.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel1
  - number: '2'
    text: |-
      In het publiek belang als in [artikel 1][ref1] omschreven kan ook ten name van bijzondere personen of verenigingen,
      aan wie de uitvoering van het werk, dat onteigening vordert, is toegestaan, worden onteigend.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel1
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '1'
  - number: '3.1'
    text: |-
      Als eigenaar van een onroerende zaak, en als rechthebbende op een recht als in [artikel 4, eerste lid][ref1],
      omschreven, worden zij beschouwd, die als zodanig in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek BES][ref2] staan vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel16
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '16'
  - number: '3.2'
    text: |-
      Desniettemin kan een ieder die beweert eigenaar te zijn, of rechthebbende op een recht als in
      [artikel 4, eerste lid][ref1], omschreven, en niet is opgeroepen, aan de rechter verzoeken in
      het geding van onteigening te mogen tussenkomen, zolang de eindconclusies door partijen niet
      genomen zijn. Hetzelfde recht hebben derde belanghebbenden, waaronder zijn te verstaan beperkt
      gerechtigden, huurders, onderhuurders, bezitters, eigenaren in geval van mandeligheid volgens
      [artikel 60, tweede lid, van Boek 5 van het Burgerlijk Wetboek BES][ref2], schuldeisers als bedoeld in
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref3], en zij die op het te onteigenen goed of op een recht
      waaraan dat is onderworpen, beslag hebben gelegd. Deze laatsten kunnen in hun verzoek alleen worden ontvangen,
      indien zij daarbij een notaris of deurwaarder aanwijzen aan wie kan worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel252
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '252'
  - number: '3.3'
    text: |-
      Bij tegenspraak der hoedanigheid van eigenaar, rechthebbende of derde belanghebbende, wordt de onteigening met de
      overigen voortgezet, en zal hij, die beweert gerechtigde te zijn, zijn recht alleen op de schadevergoeding kunnen
      uitoefenen, die in dat geval wordt geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Wanneer op een onroerende zaak, die toebehoort aan de onteigende partij, een recht van opstal, erfpacht,
      vruchtgebruik, gebruik of bewoning rust, kan dat recht afzonderlijk worden onteigend.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Overigens kan door toepassing van deze wet een zaak slechts worden bevrijd van de met betrekking tot de zaak
      bestaande lasten en rechten door onteigening van die zaak.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel4
  - number: '4.3'
    text: Een aandeel in een zaak of een recht kan niet afzonderlijk worden onteigend.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel4
  - number: '5'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] zijn op het geding tot onteigening
      toepasselijk, voor zoveel daarvan bij deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 5a
    text: |-
      Waar in deze wet een kadastrale aanduiding is voorgeschreven, wordt, indien deze onmogelijk is, een nauwkeurige
      beschrijving gegeven van de ligging, vorm en omvang van de zaak; voor de aanduiding van een gedeelte van een
      zodanig perceel is een meetbrief vereist.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel5a
  - number: '6'
    text: |-
      Geen verklaring van algemeen nut wordt voorgesteld, dan nadat de belanghebbenden in staat zijn gesteld, hun
      bezwaren daartegen te doen horen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel6
  - number: '7'
    text: |-
      Te dien einde doet, nadat enig werk van algemeen nut is ontworpen, Onze Minister wie het aangaat aan het
      bestuurscollege van het openbaar lichaam, waarbinnen ten behoeve van dat werk onroerende zaken of daarop rustende
      rechten zullen te onteigenen zijn, een plan van het werk met de nodige kaarten toekomen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      Gedurende eenentwintig dagen worden die plannen en kaarten op het bestuurskantoor van het openbaar lichaam ter
      inzage van een ieder gelegd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Van die terinzagelegging wordt door de gezaghebber in een ter plaatse verspreid wordend nieuws- of advertentieblad
      kennisgegeven of op de voor publicatie van officiële mededelingen gebruikelijke wijze kennisgegeven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel8
  - number: '8.3'
    text: De kosten komen ten laste van hen, te wier name het werk wordt ontworpen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel8
  - number: '9'
    text: |-
      Gedurende de termijn, genoemd in [artikel 8, eerste lid][ref1], alsmede gedurende veertien dagen na verloop
      daarvan, kunnen bezwaren tegen de voorgenomen onteigening en het plan van het werk schriftelijk worden opgegeven
      aan de gezaghebber. Deze brengt die bezwaren ten spoedigste ter kennis van Onze Minister wie het aangaat en voegt
      er zijn advies over de ingebrachte bezwaren bij.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel8
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '8'
        hoofdstuk: I
  - number: '10.1'
    text: |-
      Wanneer tot het maken van het plan werkzaamheden op of in iemands grond nodig geacht worden, moet de gebruiker
      van die grond ze gedogen, mits hem dit tweemaal vierentwintig uren te voren door de gezaghebber schriftelijk zij
      aangezegd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      De schade daardoor veroorzaakt, wordt door de rechter in eerste aanleg begroot en door ’s Rijks kas vergoed. Het
      Rijk verhaalt die kosten op hen, te wier name het werk wordt ontworpen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      Het voorstel van wet tot verklaring van het algemeen nut wijst de aard en de strekking, zomede de hoofdpunten ter
      bepaling der algemene richting van het werk aan, en bij kanalen en wegen, zoveel mogelijk, de plaatsen, door welke
      zij zullen lopen. De termijn, waarbinnen de vordering tot onteigening moet worden ingesteld, wordt daarbij bepaald.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      Nadat die verklaring wet is geworden, benoemt Onze Minister wie het aangaat een commissie, bestaande uit drie
      leden die, bijgestaan door een door Onze Minister wie het aangaat te benoemen deskundige en de gezaghebber van
      het openbaar lichaam, bijeenkomen, teneinde de bezwaren der belanghebbenden tegen het plan, volgens hetwelk de
      onteigening zal geschieden, aan te horen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      Die commissie moet haar werkzaamheden, met inbegrip van de inzending van het proces-verbaal in [artikel 14][ref1]
      vermeld, binnen zes weken, van de dag harer benoeming af, volbracht hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel14
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '14'
        hoofdstuk: II
  - number: '12'
    text: |-
      Uiterlijk veertien dagen voordat de commissie bijeenkomt, maken Onze Minister wie het aangaat en de gezaghebber
      het tijdstip en de plaats van de bijeenkomst bekend, respectievelijk in de Staatscourant en in een of meer ter
      plaatse verspreid wordende nieuwsbladen of op de voor publicatie van officiële mededelingen gebruikelijke wijze.
      De kosten komen ten laste van hen, te wier name het werk wordt uitgevoerd. De belanghebbenden worden daarbij tevens
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      Zo spoedig mogelijk, doch ten minste veertien dagen voor de hoorzitting worden ter inzage van een ieder
      nedergelegd:
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: 13.1.a
    text: |-
      een uitgewerkt plan met uitvoerige kaarten van het werk en met grondtekeningen, waarop de te onteigenen onroerende
      zaken en de onroerende zaken waarop te onteigenen rechten rusten, met vermelding van hun kadastrale aanduiding
      zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: 13.1.b
    text: 'een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: 13.1.b.1°
    text: |-
      de grootte volgens de kadastrale registratie van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: 13.1.b.2°
    text: de namen van de eigenaars van elk dier zaken, volgens de kadastrale registratie;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: 13.1.c
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], een lijst van de te onteigenen rechten
      met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de rechthebbenden op
      die rechten volgens de kadastrale registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
  - number: '13.2'
    text: |-
      Deze tervisielegging wordt bekend gemaakt en de kosten worden ten laste gelegd op de wijze als in het vorige
      artikel vermeld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      De stukken blijven ter inzage van een ieder liggen, totdat de commissie haar werkzaamheden in het openbaar lichaam
      heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Van de mondeling bij haar ingekomen klachten maakt de commissie proces-verbaal, door de klagers te ondertekenen,
      op en zendt dit met de haar schriftelijk medegedeelde bezwaren, benevens haar mening daaromtrent, aan Onze Minister
      wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Van dat proces-verbaal en dat advies moet een afschrift ten kantore van de gezaghebber, voor ieder, die dit
      verlangt, ter lezing liggen. Ieder kan er te zijnen koste een afschrift van nemen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      Binnen zes maanden nadat de commissie haar arbeid heeft volbracht worden de te onteigenen onroerende
      zaken en rechten door Onze Minister wie het aangaat aangewezen door aanhaling van de in het eerste lid van
      [artikel 13][ref1] bedoelde grondtekeningen en vermelding van de in dat artikellid genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel13
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '13'
        hoofdstuk: II
  - number: '15.2'
    text: |-
      Wanneer het besluit niet binnen die tijd genomen is, vervalt de wet, waarbij het algemeen nut verklaard is. Geen
      nieuwe wet mag daaromtrent voorgesteld worden, dan nadat opnieuw de formaliteiten bij [artikel 6][ref1] en volgende
      voorgeschreven, hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel6
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '6'
        hoofdstuk: I
  - number: '15.3'
    text: |-
      Moeten nog andere onroerende zaken of rechten dan die, welke krachtens het eerste lid van dit artikel ter
      onteigening zijn aangewezen, onteigend worden, dan moeten de bepalingen van de vier voorgaande artikelen wederom
      worden toegepast en is het bepaalde in het eerste en tweede lid van dit artikel van toepassing.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel15
  - number: '16.1'
    text: |-
      Het besluit wordt in de Staatscourant openbaar gemaakt en in afschrift of afdruk ten minste gedurende eenentwintig
      dagen ter inzage van een ieder gelegd op het bestuurskantoor van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      Door de gezaghebber wordt die terinzagelegging, met vermelding van datum en nummer van het besluit en van de
      Staatscourant, waarin het is openbaar gemaakt, alsmede van de aard en strekking van het werk, vooraf aan de
      ingezetenen op de gebruikelijke wijze bekendgemaakt en in één of meer ter plaatse verspreid wordende nieuwsbladen
      of op de voor publicatie van officiële mededelingen gebruikelijke wijze aangekondigd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel16
  - number: '16.3'
    text: Een en ander geschied op kosten van hen, te wier name het werk wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel16
  - number: '17'
    text: De onteigenende partij tracht hetgeen onteigend moet worden bij minnelijke overeenkomst te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel17
  - number: '18.1'
    text: |-
      Is hetgeen onteigend moet worden niet bij minnelijke overeenkomst verkregen, dan doet de onteigenende partij de
      in het besluit aangewezen eigenaar voor de rechter in eerste aanleg, op een aan deze ingediend verzoekschrift
      oproepen, teneinde de onteigening te horen uitspreken en het bedrag der schadeloosstelling te horen bepalen.
      Betreft de onteigening een recht, dan wordt zij ingesteld tegen de in het besluit aangewezen rechthebbende; van
      deze vordering wordt kennisgenomen door de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      Bij onteigening van een onroerende zaak waarop blijkens de openbare registers, bedoeld in
      [titel 1, afdeling 2, van Boek 3 van het Burgerlijk Wetboek BES][ref1], een eeuwigdurende erfpacht rust, wordt ook
      de erfpachter opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '18.3'
    text: |-
      De vordering tot onteigening moet op straffe van verval worden ingesteld binnen de termijn, bepaald bij de in
      [artikel 11][ref1] bedoelde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel11
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '11'
        hoofdstuk: II
  - number: '18.4'
    text: |-
      Het verzoekschrift wordt betekend aan degenen die als houder van op het te onteigenen goed rustende hypotheken
      in de openbare registers bedoeld in [titel 1, afdeling 2, van Boek 3 van het Burgerlijke Wetboek BES][ref1] zijn
      ingeschreven en aan de in die registers ingeschreven beslagleggers op het te onteigenen goed.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '19.1'
    text: |-
      In het geding tot onteigening treden, wanneer de uitvoering van het werk aan bijzondere personen of verenigingen is
      toegestaan, deze als eisende partij op.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      Het geding tot onteigening in het belang van de volkshuisvesting of tot onteigening voor aanleg en verbetering
      van wegen, bruggen, havenwerken en terreinen en werken voor de luchtvaart wordt op naam van de gezaghebber van het
      desbetreffend openbaar lichaam gevoerd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel19
  - number: '19.3'
    text: In de overige gevallen wordt het geding op naam van de procureur-generaal gevoerd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel19
  - number: '20.1'
    text: |-
      Wanneer de verweerder buiten het Koninkrijk woont, of zijn woonplaats onbekend is, wordt het geding gevoerd
      tegen de gevolmachtigde of bewindvoerder, indien een zodanige binnen het Koninkrijk bekend is, en, zo ook deze
      onbekend is, tegen een derde binnen het ressort van de rechter wonende en door deze, op verzoek en ten koste der
      onteigenende partij te dien einde te benoemen. De alzo benoemde kan, bij het ophouden zijner betrekking, het loon
      van de bewindvoerder eens afwezigen en daarenboven de gemaakte onkosten in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Het geding wordt eveneens gevoerd tegen een derde binnen het ressort van de rechter wonende en door deze, op
      verzoek en ten koste van de onteigenende partij, te dien einde te benoemen, wanneer de gegevens, bedoeld in
      [artikel 3, lid 1][ref1], niet in de openbare registers van de hypotheekbewaarder voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel3
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '3'
  - number: '20.3'
    text: |-
      Desniettemin is de verweerder gerechtigd ten dage, in [artikel 22][ref1] genoemd, op de oproeping, aan de
      gevolmachtigde, bewindvoerder of door de rechter benoemde gedaan, te verschijnen, in welk geval de oproeping als
      aan hem geschied wordt beschouwd en het geding tegen hem wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel22
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '22'
        hoofdstuk: III
  - number: '21'
    text: |-
      Het inleidend verzoekschrift moet, op straffe van nietigheid, de som, welke als schadeloosstelling aangeboden
      wordt, vermelden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel21
  - number: '22'
    text: |-
      Ten minste drie dagen vóór de verschijning, legt de onteigenende partij, tot staving van haar eis, ter griffie van
      het betrokken gerecht over:
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel22
  - number: 22.1°
    text: |-
      een exemplaar van de Staatscourant, waarin is openbaar gemaakt het koninklijk besluit, waarbij de te onteigenen
      onroerende zaken en rechten worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel22
  - number: 22.2°
    text: |-
      een door de gezaghebber afgegeven bewijs, dat de commissie tot het aanhoren van de bezwaren van de belanghebbenden
      zitting gehouden heeft in het openbaar lichaam, waarbinnen de te onteigenen onroerende zaak of de onroerende zaak
      waarop het te onteigenen recht rust; in dat bewijs wordt vermeld in welk nieuws- of advertentieblad en op welk
      tijdstip vorenbedoelde zitting is aangekondigd;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel22
  - number: 22.3°
    text: |-
      een door de gezaghebber afgegeven bewijs, dat de uitgewerkte plannen met de daarbij behorende kaarten en
      grondtekeningen, overeenkomstig [artikel 13][ref1], ten kantore van de gezaghebber gelegen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel13
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '13'
        hoofdstuk: II
  - number: '23.1'
    text: De zaken, aangaande onteigening te algemenen nutte, worden door de rechter vóór elke andere behandeld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.2'
    text: |-
      Ten dage dienende doet de aanlegger tevens het verzoek tot benoeming van één of meer deskundigen ter opneming der
      schade, door de onteigening aan de verweerders en derde belanghebbenden te veroorzaken.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.3'
    text: Op dezelfde dag, of uiterlijk acht dagen daarna, geven de verweerders de gronden hunner tegenspraak op.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.4'
    text: Partijen kunnen in dezelfde terechtzitting het door haar aangevoerde bij pleidooi breder ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.5'
    text: |-
      Alle gronden van verdediging, zo excepties, als die, welke de hoofdzaak aangaan, worden, op verbeurte van het recht
      om de overige in te brengen, tegelijkertijd voorgesteld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.6'
    text: Oproeping tot vrijwaring wordt niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.7'
    text: |-
      Indien van twee of meer gedaagden de een verschijnt, de ander niet, wordt met de verschijnende onmiddellijk
      voortgeprocedeerd; en de uitspraak geschiedt tussen al de partijen bij een en hetzelfde vonnis, hetwelk als een
      vonnis op tegenspraak gewezen wordt beschouwd, en waartegen geen verzet toegelaten wordt.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '23.8'
    text: Uiterlijk acht dagen na de terechtzitting doet de rechter uitspraak.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel23
  - number: '24'
    text: De rechter kan aan de onteigenende partij haar eis niet toewijzen;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel24
  - number: 24.1°
    text: wanneer de wet ontbreekt, waarbij het algemeen nut van het werk verklaard is;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel24
  - number: 24.2°
    text: |-
      wanneer niet wordt overgelegd een exemplaar van de Staatscourant, waarin is openbaar gemaakt het koninklijk
      besluit, waarbij de aanwijzing ter onteigening van in het inleidend verzoekschrift vermelde roerende zaken of
      rechten is geschied;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel24
  - number: 24.3°
    text: |-
      wanneer mocht blijken, dat de in [artikel 11][ref1] bedoelde commissie geen zitting heeft gehouden in het openbaar
      lichaam, waarop de te onteigenen onroerende zaak of de onroerende zaak waarop het te onteigenen recht rust, ofwel
      dat de zitting niet vooraf op de in [artikel 12][ref2] vermelde wijze bekend is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel12
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '12'
        hoofdstuk: II
  - number: 24.4°
    text: |-
      wanneer de uitgewerkte plannen met de daarbij behorende kaarten en grondtekeningen niet overeenkomstig
      [artikel 13][ref1] op een der daarbij aangeduide plaatsen ter inzage gelegen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel13
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '13'
        hoofdstuk: II
  - number: '25.1'
    text: |-
      Buiten de gevallen, waarin de oproeping nietig verklaard of de eis om enige andere reden ontzegd is, benoemt de
      rechter in eerste aanleg een of meer deskundigen in oneven getale.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel25
  - number: '25.2'
    text: |-
      De rechter in eerste aanleg is als rechter-commissaris, vergezeld van de griffier, bij het onderzoek der
      deskundigen tegenwoordig.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel25
  - number: '26.1'
    text: |-
      Het vonnis van de rechter wordt door de onteigenende partij aan de wederpartij betekend ten minste acht dagen
      vóór die waarop het onderzoek is bepaald, met oproeping, om daarbij tegenwoordig te zijn. Bij afwezigheid der
      tegenpartij gaat het onderzoek door.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel26
  - number: '26.2'
    text: Binnen acht dagen nadat het vonnis is gewezen, wordt het door de meest gerede partij aan de deskundigen betekend.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel26
  - number: '26.3'
    text: |-
      De rechter-commissaris bepaalt, met inachtneming van de meest mogelijke spoed, tijd en plaats van het onderzoek der
      deskundigen en beveelt door de door hem aangewezen partij aankondiging daarvan in het door hem bepaald nieuwsblad.
      De griffier roept de deskundigen op.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel26
  - number: '26.4'
    text: Derde belanghebbenden kunnen bij dat onderzoek tegenwoordig zijn, teneinde ook hun schade te doen begroten.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel26
  - number: '27.1'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel27
  - number: '27.2'
    text: |-
      In de plaats der deskundigen, die niet opgekomen zijn of weigeren aan hun verplichtingen te voldoen, benoemt de
      rechter-commissaris anderen. Indien, ten gevolge daarvan, het onderzoek moet worden uitgesteld, bepaalt de rechter-
      commissaris daarvoor een nadere tijd, waarvan noch betekening door partijen, noch aankondiging in enig nieuwsblad
      of op andere wijze geschiedt.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel27
  - number: '27.3'
    text: |-
      De rechter-commissaris brengt de bepaling dezer wet omtrent de begroting der schadeloosstelling, voor zoveel ter
      zake vereist wordt, onder de aandacht der deskundigen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel27
  - number: '28'
    text: |-
      Partijen kunnen aan de rechter-commissaris en de deskundigen al die stukken mededelen en al de gronden opgeven,
      welke, volgens haar oordeel tot een juiste bepaling der schade kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel28
  - number: '29.1'
    text: |-
      Ook ambtshalve kan de rechter-commissaris te allen tijde die personen voor zich en voor de deskundigen doen
      verschijnen, wier inlichtingen hij tot betere beoordeling der zaak nuttig mocht achten.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel29
  - number: '29.2'
    text: |-
      Indien deze personen schadeloosstelling vorderen, wordt die door de rechter-commissaris begroot en wordt daarvan
      melding gemaakt in het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel29
  - number: '30'
    text: |-
      De formaliteiten, bij het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] voorgeschreven omtrent het
      getuigenverhoor en het bericht van deskundigen, zijn ten deze niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '31.1'
    text: |-
      Wanneer de deskundigen of de personen, wier verschijning de rechter-commissaris gelast heeft, op de bepaalde
      tijd, ofschoon behoorlijk geroepen, niet opkomen, of zonder wettige redenen weigeren de eed te doen of de van hen
      gevraagde inlichtingen te geven, worden zij door de rechter-commissaris veroordeeld tot vergoeding der tevergeefs
      gedane onkosten; alles onverminderd hun gehoudenheid jegens de partijen tot schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel31
  - number: '31.2'
    text: |-
      Hij kan hen echter op hun verzet bij ongezegeld verzoekschrift, om billijke redenen, van de tegen hen uitgesproken
      veroordeling vrijstellen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel31
  - number: '32.1'
    text: |-
      De griffier maakt een proces-verbaal op, door de rechter-commissaris en hem te ondertekenen, van het bij het
      onderzoek gebeurde.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '32.2'
    text: |-
      Hij neemt daarin de verklaringen op der personen, bij het onderzoek gehoord, welke verklaringen hun worden
      voorgelezen en door hen worden ondertekend. De deskundigen doen hun advies in het proces-verbaal opnemen of voegen
      het er ondertekend bij. In het eerste geval tekenen zij mede het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '32.3'
    text: |-
      Ingeval een deskundige, of andere gehoord persoon niet kan tekenen of weigert dit te doen, wordt daarvan melding
      gemaakt in het proces-verbaal, met opgave der redenen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '32.4'
    text: De deskundigen verklaren de gronden, waarop hun bepaling der schadeloosstelling rust.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '32.5'
    text: |-
      Zij begroten ook de schadeloosstellingen aan derde belanghebbenden te betalen, voor zover die bij deze wet niet
      zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '32.6'
    text: |-
      In het proces-verbaal wordt de dag vermeld, waarop de nederlegging ter griffie, in het volgende artikel
      voorgeschreven, zal plaats hebben.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel32
  - number: '33'
    text: |-
      Een en ander wordt gedurende veertien dagen ter inzage der partijen alsook der derde belanghebbenden op de griffie
      nedergelegd, waarvan door de griffier in een nieuwsblad, door de rechter-commissaris aan te wijzen, kennis wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel33
  - number: '34'
    text: |-
      Gedurende die veertien dagen kunnen partijen en derde belanghebbenden hun bezwaren, na die aan de wederpartij te
      hebben betekend, schriftelijk aan de rechter-commissaris indienen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel34
  - number: '35.1'
    text: |-
      Na afloop dier veertien dagen brengt de rechter-commissaris in de eerstvolgende, voor de behandeling van
      burgerlijke zaken bestemde terechtzitting zijn rapport uit, zonder dat er enige verdere oproeping van partijen
      vereist wordt.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel35
  - number: '35.2'
    text: |-
      Op dezelfde terechtzitting kunnen derde belanghebbenden optreden, en, zowel als partijen, het aangevoerde nader bij
      pleidooi ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel35
  - number: '35.3'
    text: |-
      Uiterlijk veertien dagen na die terechtzitting doet de rechter, indien hij geen gebruik heeft gemaakt van de
      bevoegdheid, in [artikel 174b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] toegekend,
      uitspraak over de onteigening en over de schadeloosstelling, aan de eigenaars en derde belanghebbenden uit te
      keren.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel174b
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 174b
  - number: '35.4'
    text: Van deze uitspraak is hoger beroep uiterlijk binnen veertien dagen toegelaten.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel35
  - number: '36.1'
    text: |-
      Gebouwen, van welke een gedeelte onteigend wordt, moeten op de vordering van de eigenaar, op de terechtzitting in
      [artikel 23][ref1] bedoeld, door de onteigenende partij geheel worden overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel23
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '23'
        hoofdstuk: III
  - number: '36.2'
    text: |-
      Ditzelfde zal met erven moeten geschieden, wanneer deze door de onteigening tot een vierde hunner uitgestrektheid
      verminderen, of kleiner dan tien are worden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel36
  - number: '36.3'
    text: |-
      Deze overneming kan echter niet gevorderd worden, wanneer het overgebleven stuk grond onmiddellijk aan een ander
      erf van dezelfde eigenaar grenst.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel36
  - number: '37'
    text: |-
      Bij de berekening der schadevergoeding wordt niet gelet op nieuwe getimmerten of op veranderingen, gemaakt na de
      nederlegging ter inzage bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel13
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '13'
        hoofdstuk: II
  - number: '38'
    text: |-
      Alleen de werkelijke waarde van het onteigende, niet de denkbeeldige, welke dit uitsluitend voor de persoon van de
      eigenaar heeft, komt in aanmerking.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel38
  - number: '39.1'
    text: |-
      Indien ten aanzien van een te onteigenen gebouw door het bestuurscollege ontruiming is gelast op grond, dat het
      verblijf daarin, naar zijn oordeel, onmiddellijk gevaar oplevert, wordt vergoed de waarde van de grond en van de
      bouwmaterialen, ingeval het gebouw voor geen enkel doeleinde kan worden gebruikt. Ingeval het gebouw tot enig ander
      doeleinde dan bewoning zou kunnen worden gebruikt, wordt vergoed de waarde van de grond en van de bouwmaterialen,
      vermeerderd met zodanig bedrag, als billijk kan worden geacht in verband met de meerdere voordelen, welke de
      eigenaar uit bedoeld gebruik zou kunnen trekken. Voor de bepaling van de waarde van de grond is [artikel 42][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel42
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '42'
        hoofdstuk: III
  - number: '39.2'
    text: |-
      Indien slechts ten aanzien van een gedeelte van het te onteigenen gebouw ontruiming is gelast, wordt bij
      de bepaling der waarde van het geheel daarmede rekening gehouden. Daarbij wordt gelet op de geschiktheid of
      ongeschiktheid van het onbewoonbaar verklaarde deel voor andere doeleinden dan bewoning.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel39
  - number: '40'
    text: |-
      Indien een gebouw zich door zijn constructie voor verplaatsing leent en de onteigenende partij een naar het
      oordeel van de deskundigen aanvaardbaar terrein aanbiedt, waarop het gebouw herplaatst kan worden, wordt vergoed
      het verschil in waarde tussen het oude en het nieuwe terrein, indien dat verschil in het nadeel van de onteigende
      partij is, benevens de kosten van verplaatsing, van tijdelijke behuizing en zonodig de schade aan het gebouw
      toegebracht.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel40
  - number: '41.1'
    text: |-
      Bij de bepaling van de werkelijke waarde, bedoeld in [artikel 38][ref1], van het onteigende wordt geen
      rekening gehouden met de bestemming tot enige doeleinde van openbaar nut van het onteigende als gevolg van
      bestemmingsvoorschriften van een ontwikkelingsplan, een verkavelingsplan of een plan voor het aanleggen van
      openbare wegen, met een bouwverbod of met bijzondere voorschriften ter bepaling van een voorgevelrooilijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel38
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '38'
        hoofdstuk: III
  - number: '41.2'
    text: |-
      Bereids ter zake van deze bestemming uitgekeerde of verzekerde schadeloosstelling wordt bij de berekening der
      schadevergoeding in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel41
  - number: '42'
    text: |-
      Bij de bepaling van de waarde van grond als bouwgrond wordt rekening gehouden met de in de openbare lichamen
      Bonaire, Sint Eustatius en Saba geldende regelen betreffende afstand van grond voor openbare verkeerswegen alsmede
      betreffende kosten van hetgeen nodig is om grond voor bebouwing naar de plaatselijke voorschriften gereed te maken.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel42
  - number: '43'
    text: |-
      Indien het bestuurscollege de eigenaar van gebouwen, muren of erfscheidingen, die wegens de geheel of gedeeltelijk
      bouwvallige of verwaarloosde toestand dreigen in te storten of gevaar opleveren, bij een schriftelijk en met
      redenen omkleed besluit heeft opgedragen, binnen de daarbij gestelde termijn, bedoelde gebouwen, muren of
      erfscheidingen behoorlijk te herstellen of te versterken of, ter keuze van de betrokken eigenaar, af te breken,
      zonder dat daaraan gevolg is gegeven, wordt vergoed de waarde, die het gebouw zoude hebben ingeval zodanige
      verbeteringen waren aangebracht met aftrek van de kosten van verbetering.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel43
  - number: '44'
    text: |-
      Bij de berekening der schadeloosstelling wordt acht gegeven op de mindere waarde, welke voor de niet onteigende
      goederen het noodzakelijk gevolg van de onteigening is.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel44
  - number: 44a
    text: |-
      Voor zover de volgende artikelen niet anders meebrengen, zijn de [artikelen 38 tot en met 44][ref1] van
      overeenkomstige toepassing op rechten die door de onteigening geheel of gedeeltelijk vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel38
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '38'
        hoofdstuk: III
  - number: '45.1'
    text: |-
      Bij onteigening van een verhuurd goed wordt door de onteigenende partij aan de huurder, wiens huurtijd nog één of
      meer jaren moet duren, tot schadeloosstelling een som betaald, gelijkstaande aan de huurprijs van twee jaren.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel45
  - number: '45.2'
    text: |-
      Indien nochtans de te velde staande vruchten, of de onkosten welke de huurder aantoont, gedurende de laatste twee
      jaren aan de onroerende zaak te hebben besteed, meer belopen dan de tweejarige huurprijs wordt de waarde dier
      vruchten of het bedrag dier onkosten als schadeloosstelling betaald.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel45
  - number: '45.3'
    text: |-
      Indien de huurder minder dan een jaar doch meer dan een maand huur had, wordt hem de huurprijs van één vol jaar of
      de waarde der te velde staande vruchten, zo die meer beloopt, vergoed.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel45
  - number: '45.4'
    text: |-
      Indien de huurder een maand of minder huur had, of indien de verhuring of haar verlenging na de nederlegging ter
      inzage, bedoeld in [artikel 13][ref1] heeft plaats gehad, wordt door de onteigenende partij aan de huurder geen
      schadeloosstelling betaald, maar heeft deze een vordering tot schadevergoeding tegen de verhuurder, ten ware anders
      mocht zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel13
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '13'
        hoofdstuk: II
  - number: '46.1'
    text: |-
      De hypotheekhouder en de ingeschreven beslaglegger hebben geen recht op afzonderlijke
      schadevergoeding. Slechts indien zij zijn tussengekomen, kunnen zij zich jegens de onteigenaar
      beroepen op hun rechten uit [artikel 229 van Boek 3 van het Burgerlijk Wetboek BES][ref1] en
      [artikel 507a van het Wetboek van Burgerlijke Rechtsvordering BES][ref2]. Zij oefenen die rechten uit op het
      bedrag van de werkelijke waarde en de waardevermindering van het overblijvende, zoals dat bedrag toekomt aan de
      hypotheekgever, de beslagene en de beperkt gerechtigde, wiens recht niet tegen hen kan worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel507a
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0028496
        artikel: 507a
  - number: '46.2'
    text: |-
      Indien alle in het vorige lid vermelde belanghebbenden tot overeenstemming omtrent de verdeling zijn gekomen,
      bepaalt de rechter wat aan ieder van hen moet worden betaald. Is geen overeenstemming bereikt, dan worden
      de bedragen in hun geheel toegewezen aan de tussengekomen hypotheekhouder, hoogste in rang, dan wel, zo geen
      hypotheekhouder is tussengekomen, aan de daartoe door de eerst ingeschreven beslaglegger aangewezen notaris of
      deurwaarder, en vindt verdeling plaats met toepassing van de regels betreffende de verdeling van een zodanig
      opbrengst in het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '46.3'
    text: |-
      Een beslaglegger behoeft voor de toepassing van het vorige lid niet tussen te komen, indien hij aan de onteigenaar
      bij exploit meedeelt zijn rechten uit [artikel 507a van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] te
      bepalen tot het deel van de in het eerste lid bedoelde bedragen, dat voor de beslagene bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel507a
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 507a
  - number: '47'
    text: |-
      Bij de bepaling van de schadeloosstelling wegens het vervallen van een erfdienstbaarheid of een recht als
      bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref1], wordt rekening gehouden met hetgeen te
      verwachten is omtrent de wijziging of de opheffing krachtens de [artikelen 78][ref2] en [79 van Boek 5][ref3],
      dan wel de [artikelen 258][ref4] en [259 van Boek 6 van dat wetboek][ref5] en de daaraan te verbinden voorwaarden.
      De [artikelen 41][ref6] en [42][ref7] missen in zoverre toepassing. Overigens wordt rekening gehouden met de
      mogelijkheid de erfdienstbaarheid of het recht als bedoeld in artikel 252 van Boek 6 van dat wetboek door een
      andere erfdienstbaarheid of een ander recht te vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0028748#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0028748#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0028749#Artikel258
      [ref5]: https://wetten.overheid.nl/BWBR0028749#Artikel259
      [ref6]: https://wetten.overheid.nl/BWBR0028729#Artikel41
      [ref7]: https://wetten.overheid.nl/BWBR0028729#Artikel42
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0028748
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0028748
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0028749
        artikel: '258'
      - id: ref5
        bwb_id: BWBR0028749
        artikel: '259'
      - id: ref6
        bwb_id: BWBR0028729
        artikel: '41'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0028729
        artikel: '42'
        hoofdstuk: III
  - number: '48.1'
    text: |-
      De vruchtgebruiker kan zich jegens de onteigenaar slechts op verkrijging van een vruchtgebruik op de vordering tot
      schadeloosstelling voor de hoofdgerechtigde krachtens [artikel 213 van Boek 3 van het Burgerlijk Wetboek BES][ref1]
      beroepen, indien hij is tussengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel213
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '213'
  - number: '48.2'
    text: |-
      Bij onteigening van fideicommissaire goederen doet de bezwaarde erfgenaam de schadeloosstelling bij een instelling
      te zijner keuze inschrijven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel48
  - number: '49'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel49
  - number: '50'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel50
  - number: '51'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel51
  - number: '52'
    text: |-
      De kosten komen ten laste van de onteigenende partij, tenzij de rechter in de omstandigheden van het geding termen
      vindt om de kosten geheel of voor een deel te compenseren, behoudens dat de kosten geheel door de verweerder worden
      gedragen, indien hem niet meer wordt toegewezen dan in het inleidend verzoekschrift werd aangeboden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel52
  - number: '53'
    text: |-
      Wanneer het vonnis bij verstek is gewezen, kan men daartegen binnen acht dagen na de betekening op de wijze in het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref1] voorgeschreven, in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '54'
    text: |-
      Aan de onteigenende partij die voor de voldoening der schadeloosstelling aan de wederpartij en aan diegenen der
      derde belanghebbenden, welke dit verlangen, zekerheid heeft gesteld, wordt op de wijze, in [artikel 57][ref1]
      omschreven, het recht verleend om zich, desnoods met behulp van de sterke arm, in het feitelijk bezit te stellen
      van en veranderingen te brengen in de staat van de te onteigenen onroerende zaken, de onroerende zaak waarop het
      te onteigenen recht rust, of om, desnoods met behulp van de sterke arm, te belemmeren en te beletten, dat gebruik
      wordt gemaakt van de te onteigenen rechten of door de onteigening vervallende rechten, indien het bepaalde in de
      [artikelen 55][ref2], [56][ref3] en 57 is nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0028729#Artikel56
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '57'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '55'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0028729
        artikel: '56'
        hoofdstuk: IV
  - number: '55.1'
    text: |-
      De onteigenende partij, die het in het voorgaande artikel omschreven recht wenst te verkrijgen, moet dit bij
      het in [artikel 18][ref1] bedoeld verzoekschrift mededelen en bij het verzoek, bedoeld in het tweede lid van
      [artikel 23][ref2], vorderen dat de rechter-commissaris de bedragen zal bepalen waartoe zekerheid gesteld zal
      moeten worden. Is dit geschied dan worden die bedragen door de rechter-commissaris afzonderlijk voor de wederpartij
      en voor ieder van de derde belanghebbenden, welke zekerheidsstelling verlangen, bepaald, onmiddellijk nadat het
      onderzoek der deskundigen, bedoeld in [artikel 27][ref3], heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0028729#Artikel27
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '23'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028729
        artikel: '27'
        hoofdstuk: III
  - number: '55.2'
    text: |-
      Te dien einde zal de rechter-commissaris de wederpartij en de derde belanghebbenden, welke zekerheidsstelling
      verlangen, gelegenheid geven zich omtrent de bedragen van de zekerheidsstellingen te verklaren en de deskundigen
      daaromtrent horen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
  - number: '55.3'
    text: |-
      De deskundigen brengen binnen veertien dagen na hun benoeming verslag uit. De rechter-commissaris kan deze termijn
      eenmaal met ten hoogste veertien dagen verlengen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
  - number: '55.4'
    text: |-
      De bedragen van de zekerheidsstelling worden in overeenstemming met hetgeen is verlangd bepaald, tenzij de rechter-
      commissaris termen aanwezig acht om daarvan af te wijken, zullende echter het gezamenlijk bedrag van de ten behoeve
      van de wederpartij en de derde belanghebbenden te stellen zekerheid ten minste worden bepaald op de som welke ter
      voldoening aan het bepaalde in [artikel 21][ref1] als schadeloosstelling is aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel21
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '21'
        hoofdstuk: III
  - number: '55.5'
    text: |-
      Bij onteigening van een met eeuwigdurende erfpacht bezwaard perceel wordt het bedrag van de te stellen zekerheid
      afzonderlijk bepaald voor de eigenaar en voor de erfpachter.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
  - number: '55.6'
    text: |-
      Van hetgeen door en ten overstaan van de rechter-commissaris is verricht en verklaard, wordt een proces-verbaal
      opgemaakt. De beschikking van de rechter-commissaris, waarbij de bedragen zijn bepaald, wordt in het proces-verbaal
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
  - number: '55.7'
    text: Van deze beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel55
  - number: '56'
    text: |-
      Tenzij met een andere wijze van zekerheidsstelling genoegen is genomen, wordt zekerheid gesteld door inpandgeving
      hetzij van een bij de consignatiekas in bewaring gegeven geldsom, welke tenminste gelijk is aan het bedrag
      waartoe zekerheid moet worden gesteld, hetzij van bij de ontvanger van het openbaar lichaam in bewaring gegeven
      schuldbrieven ten laste van het Rijk, welke ten dage der inpandgeving een waarde hebben welke ten minste tien ten
      honderd meer bedraagt dan het bedrag, waartoe zekerheid gesteld moet worden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel56
  - number: '57.1'
    text: |-
      De rechter in eerste aanleg voor wie het geding tot onteigening aanhangig is, verleent het in [artikel 54][ref1]
      omschreven recht binnen tien dagen bij beschikking op een verzoekschrift van de onteigenende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel54
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '54'
        hoofdstuk: IV
  - number: '57.2'
    text: |-
      Bij dat verzoekschrift worden overgelegd een afschrift van het proces-verbaal, bedoeld in [artikel 55][ref1] en de
      akten strekkende tot bewijs dat de vereiste zekerheidsstellingen hebben plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel55
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '55'
        hoofdstuk: IV
  - number: '57.3'
    text: De beschikking op het verzoekschrift is uitvoerbaar op de minuut.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel57
  - number: '57.4'
    text: Van deze beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel57
  - number: '58'
    text: |-
      De onteigenende partij, welke van het in [artikel 54][ref1] omschreven recht geen gebruik heeft gemaakt voordat
      het vonnis van onteigening in kracht van gewijsde is gegaan, is daarna niet meer bevoegd van dat recht gebruik
      te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel54
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '54'
        hoofdstuk: IV
  - number: '59.1'
    text: |-
      Wanneer hetzij bij gewijsde de oproeping bedoeld in [artikel 18][ref1] is nietig verklaard of de eis tot
      onteigening om enige andere reden is ontzegd, hetzij het vonnis van onteigening uit kracht van het bepaalde in
      [artikel 62][ref2] is vervallen, is de onteigenende partij verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel62
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '62'
        hoofdstuk: V
  - number: 59.1.a
    text: het in bezit genomene onmiddellijk te ontruimen;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel59
  - number: 59.1.b
    text: |-
      de schade te vergoeden, welke door de wederpartij en door hen, die in het geding tot onteigening zijn tussen
      gekomen, is geleden door de uitoefening van het in [artikel 54][ref1] omschreven recht.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel54
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '54'
        hoofdstuk: IV
  - number: '59.2'
    text: |-
      Tot de in het voorgaande lid bedoelde ontruiming kan de onteigenende partij, desnoods door middel van de sterke
      arm worden gedwongen uit kracht van een bevelschrift van de rechter in eerste aanleg voor wie de vordering tot
      onteigening is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel59
  - number: '59.3'
    text: |-
      De voor de voldoening der schadeloosstelling gestelde zekerheid strekt mede tot zekerheid voor de voldoening van de
      schadevergoeding welke krachtens het eerste lid van dit artikel verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel59
  - number: '60'
    text: |-
      De gestelde zekerheid vervalt en het in pand gegevene kan worden teruggenomen, wanneer hetzij de bij het vonnis tot
      onteigening bepaalde schadeloosstelling, hetzij de krachtens [artikel 59][ref1] verschuldigde schadevergoeding is
      voldaan of is aangeboden en geconsigneerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel59
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '59'
        hoofdstuk: IV
  - number: '61'
    text: |-
      Wanneer de onteigenende partij bij het verzoekschrift in [artikel 18][ref1] bedoeld heeft medegedeeld dat
      zij het in [artikel 54][ref2] omschreven recht wenst te verkrijgen, zijn in afwijking van het bepaalde in
      [artikel 62][ref3] onder de schadeloosstelling begrepen de wettelijke rente daarvan, te rekenen van de dag, waarop
      de in [artikel 25][ref4] omschreven benoeming heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0028729#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0028729#Artikel25
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '54'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0028729
        artikel: '62'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0028729
        artikel: '25'
        hoofdstuk: III
  - number: '62.1'
    text: |-
      Het vonnis van onteigening vervalt, wanneer niet binnen zes maanden, nadat het in kracht van gewijsde is gegaan,
      de schadeloosstelling betaald, of, in de gevallen, waarin dit volgens deze wet kan geschieden, geconsigneerd is.
      De onteigenende partij is alsdan gehouden tot vergoeding der schade, welke de wederpartij daardoor mocht hebben
      geleden. Onder die schade zijn echter niet begrepen de proceskosten, waarin de onteigenende mocht zijn veroordeeld,
      noch ook het verlies der voordelen die de onteigende uit de onteigening zou hebben getrokken.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel62
  - number: '62.2'
    text: |-
      Onder de schadeloosstelling zijn begrepen de wettelijke rente daarvan te berekenen van de achtste dag nadat het
      vonnis in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel62
  - number: '63'
    text: |-
      Wanneer hij aan wie de schadeloosstelling is toegewezen, weigert haar te ontvangen, en bij deurwaardersexploit
      deswege in gebreke is gesteld, kan de onteigenaar zodra tien dagen zijn verstreken overgaan tot consignatie.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel63
  - number: '64.1'
    text: |-
      Wanneer de schadeloosstelling is betaald of consignatie daarvan krachtens het bepaalde in [artikel 3][ref1] of
      in [artikel 63][ref2] heeft plaats gehad, wordt de onteigenende partij op bevelschrift van de rechter in eerste
      aanleg, desnoods door middel van de sterke arm, in het bezit der onteigende goederen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel63
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '63'
        hoofdstuk: V
  - number: '64.2'
    text: |-
      Bij haar verzoekschrift aan de rechter moet zij een afschrift van het vonnis overleggen, waarbij de onteigening
      uitgesproken is en een verklaring van de betrokken griffier, dat het vonnis in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel64
  - number: '64.3'
    text: |-
      Ook de akte waaruit van het aanbod van gerede betaling en van de daarop gevolgde consignatie, of wel alleen van de
      consignatie in de gevallen van [artikel 3][ref1] en van het volgende artikel blijkt, dan wel, zo er betaling heeft
      plaats gehad, de akte waaruit de kwijting blijkt, moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel3
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '3'
  - number: '65'
    text: |-
      Wanneer onder de onteigenende partij beslag op de schadeloosstelling is gelegd, doet zij het bedrag dat zij zonder
      het beslag aan de beslagene had moeten uitbetalen consigneren.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel65
  - number: '66.1'
    text: |-
      Het vonnis van onteigening, bedoeld in [artikel 35][ref1], kan slechts worden ingeschreven nadat het in kracht van
      gewijsde is gegaan. Ter inschrijving van het in de vorige volzin bedoelde vonnis worden de bewijzen van betaling
      van de schadeloosstelling overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel35
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '35'
        hoofdstuk: III
  - number: '66.2'
    text: |-
      In geval van onteigening van een onroerende zaak gaat door inschrijving van het vonnis de eigendom op de
      onteigenaar over, vrij van alle met betrekking tot de zaak bestaande lasten en rechten. In geval van onteigening
      als bedoeld in [artikel 4, eerste lid][ref1], vervallen door de inschrijving de lasten en rechten welke bestaan met
      betrekking tot de zaak, waarop het onteigende recht rust. Aldus waardeloos geworden inschrijvingen van hypotheken
      en beslagen worden ambtshalve doorgehaald. Alleen erfdienstbaarheden kunnen op de zaak gevestigd blijven.
      Zij dienen daartoe in het vonnis te worden opgenomen; indien zij niet door vestiging zijn ontstaan, worden de
      kadastrale aanduiding van het heersende erf en een omschrijving van de inhoud van de erfdienstbaarheid opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
  - number: '67'
    text: |-
      Alle belastingen, hoegenaamd, waarmede het onteigende goed is bezwaard, of die daarvan worden betaald, gaan
      van de dag, waarop het eindvonnis van onteigening in kracht van gewijsde is gegaan of waarop, in het geval van
      [artikel 64][ref1], de inbezitneming heeft plaats gehad, op de onteigenende partij over.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel64
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '64'
        hoofdstuk: V
  - number: '68'
    text: |-
      Indien, tengevolge van oorzaken, welke de onteigenende bij machte was uit de weg te ruimen, met het werk waartoe
      werd onteigend, niet binnen een jaar nadat het eindvonnis van onteigening in kracht van gewijsde is gegaan, aanvang
      is gemaakt of de arbeid daaraan meer dan een jaar mocht zijn gestaakt, of indien uit andere omstandigheden is aan
      te tonen, dat het werk blijkbaar niet tot stand zal worden gebracht, kan de onteigende bij de rechter het afgestaan
      goed terugvorderen in de toestand, waarin het zich alsdan bevindt, doch onder gehoudenheid, om, in evenredigheid
      tot de terugontvangen waarde, de schadeloosstelling terug te geven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel68
  - number: '69'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel69
  - number: '70'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel70
  - number: '71'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel71
  - number: '72'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel72
  - number: '73.1'
    text: |-
      Zonder voorafgaande verklaring bij wet, dat het algemeen nut de onteigening vordert, kan in het belang van de
      ruimtelijke ontwikkeling en van de volkshuisvesting onteigening plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: 73.1.1e
    text: |-
      ten behoeve van de uitvoering van of ter handhaving van de feitelijke toestand overeenkomstig de
      bestemmingsvoorschriften van een ontwikkelingsplan;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: 73.1.2e
    text: ten behoeve van de ontruiming van oppervlakten in het belang van de volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: 73.1.3e
    text: ten behoeve van een in het belang van de volkshuisvesting uit te voeren bouwplan;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: 73.1.4e
    text: |-
      ten behoeve van de verwijdering van een of meer ontruimde onbewoonbaar verklaarde woningen of van een of meer
      niet meer in gebruik zijnde andere gebouwen, indien deze woningen of gebouwen dermate in verval zijn geraakt of
      verminkt, dat zij de omgeving in ernstige mate ontsieren;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: 73.1.5e
    text: |-
      ter verkrijging van de beschikking over ongebouwde of gebouwde eigendommen in verband met de vaststelling van een
      gevelrooilijn.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: '73.2'
    text: In deze gevallen geschiedt de onteigening overeenkomstig de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel73
  - number: '74'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel74
  - number: '75'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel75
  - number: '76'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel76
  - number: '77'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel77
  - number: '78'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel78
  - number: '79.1'
    text: |-
      De onteigening geschiedt ten name van het openbaar lichaam of van verenigingen, vennootschappen of stichtingen,
      die uitsluitend in het belang van verbetering van de volkshuisvesting werkzaam zijn en als zodanig bij koninklijk
      besluit zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel79
  - number: '79.2'
    text: De vereisten voor toelating worden nader bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel79
  - number: '80.1'
    text: De onteigening heeft plaats uit kracht van een besluit van de eilandsraad, bij koninklijk besluit goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel80
  - number: '80.2'
    text: |-
      In het geval, omschreven bij [artikel 73 eerste lid onder 2°][ref1], voegt het bestuurscollege bij de stukken een
      beredeneerd verslag aangaande de toestand van de woningen, met opgaaf van de te onteigenen gebouwen, welke alsnog
      aan voor bewoonbaarheid noodzakelijke vereisten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel73
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '73'
  - number: '81.1'
    text: |-
      Belanghebbenden worden, voordat een beslissing van de eilandsraad omtrent de onteigening wordt genomen, in de
      gelegenheid gesteld hun bezwaren te doen horen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: '81.2'
    text: |-
      Indien onteigening ten name van het openbaar lichaam wordt beoogd, legt het bestuurscollege op het bestuurskantoor
      van het openbaar lichaam gedurende eenentwintig dagen ter inzage van een ieder:
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: 81.2.a
    text: |-
      een uitgewerkt, bij besluit van de eilandsraad voorlopig goedgekeurd plan met uitvoerige kaarten en met
      grondtekeningen, waarop de te onteigenen onroerende zaken en de onroerende zaken waarop te onteigenen rechten
      rusten, met vermelding van hun kadastrale aanduiding zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: 81.2.b
    text: 'een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: 81.2.b.1°
    text: |-
      de grootte volgens de kadastrale registratie van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: 81.2.b.2°
    text: de namen van de eigenaars van elk dier zaken, volgens de kadastrale registratie.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: 81.2.c
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], een lijst van de te onteigenen rechten
      met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de rechthebbenden op
      die rechten volgens de kadastrale registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
  - number: '81.3'
    text: |-
      Een vereniging, vennootschap of stichting, als bedoeld in [artikel 79][ref1], die onteigening te haren name
      verlangt, legt aan het bestuurscollege over de in het tweede lid bedoelde bescheiden. Binnen een maand nadat
      hieraan is voldaan doet het bestuurscollege die stukken gedurende ten minste dertig dagen op het bestuurskantoor
      van het openbaar lichaam ter inzage voor een ieder nederleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel79
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '79'
  - number: '81.4'
    text: |-
      Van elke nederlegging wordt door de gezaghebber in een of meer ter plaatse verspreid wordende nieuwsbladen of op de
      voor publicatie van officiële mededelingen gebruikelijke wijze onverwijld kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
  - number: '81.5'
    text: |-
      Het raadsbesluit tot onteigening vervalt indien het niet uiterlijk zes maanden na afloop van de termijn, bedoeld
      in [artikel 81, tweede lid][ref1], ter goedkeuring aan Ons is voorgedragen. Een door Ons goedgekeurd raadsbesluit
      tot onteigening vervalt, indien de onteigenende partij niet binnen een jaar na de dagtekening van het besluit,
      de eigendom bij minnelijke overeenkomst heeft verkregen of de eigenaren, in het onteigeningsbesluit aangewezen,
      voor de rechter in eerste aanleg, onder wiens rechtsgebied de onroerende zaken gelegen zijn waarop de onteigening
      betrekking heeft, heeft doen oproepen overeenkomstig het bepaalde in [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel18
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '18'
        hoofdstuk: III
  - number: '82'
    text: |-
      De belanghebbenden kunnen uiterlijk veertien dagen na verloop van de termijn voor nederlegging hun bezwaren
      schriftelijk aan het bestuurscollege opgeven.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel82
  - number: '83'
    text: |-
      [Artikel 10][ref1] is ten deze van toepassing, met dien verstande, dat hetgeen daar van het Rijk gezegd wordt, van
      toepassing wordt op het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel10
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '10'
        hoofdstuk: I
  - number: '84.1'
    text: |-
      Besluit de eilandsraad tot onteigening ten name van het openbaar lichaam of van een vereniging, vennootschap of
      stichting, dan worden bij raadsbesluit de te onteigenen onroerende zaken en rechten aangewezen door aanhaling
      van de in het tweede lid van [artikel 81][ref1] bedoelde grondtekeningen en vermelding van de in dat artikellid
      genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel81
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '81'
  - number: '84.2'
    text: |-
      Moeten nog andere onroerende zaken dan die, welke krachtens het vorige lid ter onteigening zijn aangewezen,
      onteigend worden, dan moeten de bepalingen van de vier voorgaande artikelen wederom worden toegepast en is het
      bepaalde in het vorige lid van dit artikel van toepassing.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel84
  - number: '85'
    text: |-
      Het raadsbesluit tot onteigening, dan wel een afschrift of afdruk ervan, wordt gedurende eenentwintig dagen
      ter inzage van een ieder gelegd op het bestuurskantoor van het openbaar lichaam. Door de gezaghebber wordt de
      terinzagelegging, met vermelding van de aard en de strekking van het werk, in het afkondigingsblad, bedoeld in
      [artikel 2, vierde lid, van de Bekendmakingswet][ref1] vooraf aan de ingezetenen bekendgemaakt en in een of meer
      ter plaatse verspreid wordende nieuwsbladen of op de voor publicatie van officiële mededelingen gebruikelijke wijze
      aangekondigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '86.1'
    text: |-
      Het raadsbesluit tot onteigening wordt met de plannen, kaarten, grondtekeningen, verslagen, bezwaarschriften en
      adviezen, in de [artikelen 81][ref1] en [82][ref2] vermeld, aan Onze Minister wie het aangaat ter goedkeuring
      aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel82
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '82'
  - number: '86.2'
    text: |-
      Wordt het raadsbesluit door Onze Minister wie het aangaat goedgekeurd, zo wordt het koninklijk besluit met het
      raadsbesluit in de Staatscourant openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel86
  - number: '87.1'
    text: |-
      Indien de eilandsraad naar aanleiding van een tot onteigening strekkend verzoek van een vereniging, vennootschap of
      stichting niet tot onteigening besluit, kan door de aanvrager binnen drie maanden na verloop van de termijn genoemd
      in [artikel 82][ref1] maar niet eerder dan een maand na verloop van die termijn, voorziening bij Onze Minister wie
      het aangaat worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel82
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '82'
  - number: '87.2'
    text: |-
      Wordt door Onze Minister wie het aangaat onteigening toegestaan, zo vindt [artikel 84][ref1] overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel84
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '84'
  - number: '87.3'
    text: |-
      Het koninklijk besluit omtrent de goedkeuring van het raadsbesluit wordt in de Staatscourant bekendgemaakt en in
      afschrift of afdruk gedurende eenentwintig dagen ter inzage van een ieder gelegd op het bestuurskantoor van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel87
  - number: '87.4'
    text: |-
      Door de gezaghebber wordt de terinzagelegging, met vermelding van de aard en de strekking van het werk, in het
      afkondigingsblad, bedoeld in [artikel 2, vierde lid, van de Bekendmakingswet][ref1] vooraf aan de ingezetenen
      bekendgemaakt en in een of meer ter plaatse verspreid wordende nieuwsbladen of op de voor publicatie van officiële
      mededelingen gebruikelijke wijze aangekondigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '88'
    text: |-
      De [artikelen 3][ref1], [4][ref2], [5][ref3], [17 t/m 21][ref4], [23][ref5], [25 t/m 44][ref6],
      [45, 1e en 2de lid][ref7] en [46 t/m 61][ref8] zijn ten deze van toepassing behoudens dat, indien de eilandsraad
      tot onteigening heeft besloten, hetgeen van het besluit van Onze Minister die het aangaat gezegd wordt, van
      toepassing wordt op het besluit van de eilandsraad en dat, wanneer de onteigening geschiedt ten name van een
      vereniging, vennootschap of stichting, deze als eisende partij optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028729#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028729#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0028729#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0028729#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0028729#Artikel45
      [ref8]: https://wetten.overheid.nl/BWBR0028729#Artikel46
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0028729
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0028729
        artikel: '17'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0028729
        artikel: '23'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0028729
        artikel: '25'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0028729
        artikel: '45'
        hoofdstuk: III
      - id: ref8
        bwb_id: BWBR0028729
        artikel: '46'
        hoofdstuk: III
  - number: '89'
    text: |-
      Ten minste drie dagen voor de verschijning legt de onteigenende partij tot staving van haar eis ter griffie van het
      gerecht in eerste aanleg over:
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel89
  - number: 89.a
    text: 'indien de eilandsraad tot onteigening heeft besloten:'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel89
  - number: 89.a.1°
    text: |-
      een exemplaar van de Staatscourant, waarin het koninklijk besluit met het daarbij goedgekeurd raadsbesluit
      ingevolge [artikel 86, tweede lid][ref1], is openbaar gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel86
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '86'
  - number: 89.a.2°
    text: |-
      een door de gezaghebber afgegeven bewijs, dat de [artikelen 81][ref1] en [85][ref2] zijn nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel85
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '85'
  - number: 89.b
    text: |-
      indien tot onteigening is besloten overeenkomstig het bepaalde in [artikel 87][ref1] een exemplaar van de
      Staatscourant, waarin is openbaar gemaakt het koninklijk besluit, waarbij de te onteigenen onroerende zaken en
      rechten worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel87
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '87'
  - number: '90'
    text: 'Het Gerecht in eerste aanleg kan aan de onteigenende partij haar eis niet toewijzen:'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel90
  - number: 90.a
    text: |-
      wanneer de volgens [artikel 89][ref1] door de onteigenende partij over te leggen bescheiden niet zijn overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel89
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '89'
  - number: 90.b
    text: |-
      wanneer het blijken mocht, dat de [artikelen 81][ref1] en [85][ref2] niet zijn nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0028729#Artikel85
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0028729
        artikel: '85'
  - number: '91.1'
    text: |-
      Indien de huurder minder dan een jaar huur had, wordt hem het viervoud van de huurprijs, berekend per tijdvak
      waarover de huur was aangegaan, tot ten hoogste die van een jaar, of de waarde der te velde staande vruchten zo die
      meer beloopt, vergoed.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel91
  - number: '91.2'
    text: |-
      Indien de verhuring of haar verlenging na het tijdstip, in [artikel 37][ref1] aangewezen, heeft plaats gehad,
      wordt door de onteigenende partij aan de huurder geen schadeloosstelling betaald, maar heeft deze een vordering tot
      schadevergoeding tegen de verhuurder, ten ware anders mocht zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel37
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '37'
        hoofdstuk: III
  - number: '91.3'
    text: |-
      Voortzetting van huur, voor minder dan een maand aangegaan, wordt niet als verlenging in de zin van het vorige
      lid beschouwd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel91
  - number: '92'
    text: |-
      Ten aanzien van de betaling der schadeloosstelling gelden de bepalingen van het vijfde hoofdstuk van de eerste
      titel, behoudens dat, in de gevallen genoemd bij [artikel 68][ref1], de onteigende de keuze heeft tussen
      terugvordering als omschreven bij dat artikel en een vordering tot uitkering van een door de rechter naar
      billijkheid te bepalen schadeloosstelling boven de reeds genotene en dat de daar genoemde termijnen van een jaar
      worden gesteld op tien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel68
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '68'
        hoofdstuk: V
  - number: '93.1'
    text: |-
      Zonder voorafgaande verklaring bij wet, dat het algemeen nut de onteigening vordert, kan onteigening plaats hebben
      van wegen en bruggen, alsmede daarop rustende rechten als in [artikel 4][ref1] bedoeld, en onteigening voor aanleg
      en verbetering van wegen, bruggen, havenwerken en van terreinen voor de luchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel4
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '4'
  - number: '93.2'
    text: |-
      De bepalingen van [titel III][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028729
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0028729
  - number: '94.1'
    text: |-
      Wanneer in geval van oorlog, brand, watersnood of orkaan, ogenblikkelijke inbezitneming volstrekt noodzakelijk
      wordt geacht, kan deze op last van de hoogste burgerlijke of militaire overheid ter plaatse aanwezig, geschieden,
      onverminderd het bepaalde in artikel 12 van de Invoeringswet en de artikelen 7, eerste lid, en 8, eerste lid, van
      de Coördinatiewet uitzonderingstoestanden.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel94
  - number: '94.2'
    text: |-
      In geval van orkaan – waaronder mede is te verstaan het geval van dreigend gevaar voor orkaan – kan ook de
      gezaghebber, die last geven. Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven in verband met
      het geven van deze last.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel94
  - number: '94.3'
    text: |-
      Ingeval van watersnood kan ook Onze Minister wie het aangaat, of een door deze gemandateerde functionaris, een last
      geven. Onder watersnood wordt mede verstaan een dringend of dreigend gevaar voor overstroming. Artikel 10:4 van de
      Algemene wet bestuursrecht is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel94
  - number: '94.4'
    text: |-
      De eigendom gaat onmiddellijk op degene over, in wiens naam de inbezitneming is geschied, vrij van alle lasten en
      rechten daarop rustende. Alle in [artikel 67][ref1] genoemde lasten of belastingen, waarmede het onteigende goed is
      bezwaard, gaan van de dag der inbezitneming op hem over.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel67
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '67'
        hoofdstuk: V
  - number: '94.5'
    text: |-
      Het besluit tot inbezitneming wordt zo spoedig mogelijk in de openbare registers ingeschreven. Door het besluit
      waardeloos geworden inschrijvingen van hypotheken en beslagen worden ambtshalve doorgehaald. Artikel 23, eerste
      lid, van Boek 3 van het Burgerlijk Wetboek BES is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel94
  - number: '95.1'
    text: |-
      Zodra mogelijk na de onteigening moet degene, die haar bevolen heeft, aan de onteigenden gerechtelijk een
      schadevergoeding doen aanbieden of in de gevallen in [artikel 65][ref1] genoemd, consigneren.


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel65
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '65'
        hoofdstuk: V
  - number: '95.2'
    text: |-
      Indien dit aanbod of die consignatie niet binnen drie maanden is geschied alsmede wanneer met het aangebodene
      of geconsigneerde geen genoegen wordt genomen, kan de schadevergoeding in rechten door de onteigenden worden
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel95
  - number: '95.3'
    text: |-
      In het eerste geval kan het Rijk de bedoelde schadeloosstelling van hen, die de onteigening gelast hebben,
      persoonlijk terugvorderen, ten ware het verzuim buiten hun schuld mocht hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel95
  - number: '96.1'
    text: |-
      De wettelijke rente der verschuldigde schadevergoeding moet van de dag der inbezitneming aan de onteigenden worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel96
  - number: '96.2'
    text: |-
      Met afwijking in zoverre van het bepaalde bij het eerste lid, bedragen ten aanzien van onteigende fideïcommissaire
      goederen de interesten der verschuldigde schadevergoeding drie ten honderd per jaar.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel96
  - number: '97'
    text: |-
      Wanneer hij, in wiens naam de onteigening gelast is, de eigendom van het goed niet langer voor het beoogde doel
      nodig acht en er nog geen drie jaren sedert de onteigening verlopen zijn, is de onteigende bij voorkeur boven alle
      anderen tegen betaling van de prijs, door deskundigen te begroten, tot de verkrijging daarvan gerechtigd.
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel97
  - number: '98'
    text: 'Deze wet wordt aangehaald als: Onteigeningswet BES.'
    url: https://wetten.overheid.nl/BWBR0028729/2021-07-01#Artikel98
