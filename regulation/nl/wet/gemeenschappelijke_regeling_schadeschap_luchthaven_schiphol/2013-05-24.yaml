  - number: 9.3f
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur tevens bij uitsluiting bevoegd ter zake van de behandeling
      van en de beslissing op een aanvraag om schadevergoeding op grond van [artikel 8.31 van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
