$id: gemeenschappelijke_regeling_schadeschap_luchthaven_schiphol
regulatory_layer: WET
publication_date: '2019-06-26'
valid_from: '2013-05-24'
bwb_id: BWBR0009989
url: https://wetten.overheid.nl/BWBR0009989/2013-05-24
preamble:
  text: |-
    Gelet op de artikelen 94 en 95 van de Wet gemeenschappelijke regelingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze gemeenschappelijke regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.a
    text: '*de regeling:* deze gemeenschappelijke regeling;'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.b
    text: |-
      *het Schap:* het openbaar lichaam, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel3
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '3'
        hoofdstuk: III
  - number: 1.c
    text: '*de Minister:* de Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.d
    text: '*de provincie:* de provincie Noord-Holland;'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.e
    text: '*het Hoogheemraadschap:* het Hoogheemraadschap Rijnland;'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.f
    text: |-
      *de deelnemers:* De Minister van Infrastructuur en Milieu, Provinciale Staten en Gedeputeerde Staten van de
      provincie Noord-Holland, het Algemeen Bestuur en het Dagelijks Bestuur van het Hoogheemraadschap Rijnland, de
      gemeenteraad van de gemeente Haarlemmermeer, de colleges van Burgemeester en Wethouders van de gemeenten Aalsmeer,
      Amstelveen, Amsterdam, Beverwijk, Castricum, Haarlem, Haarlemmermeer, Haarlemmerliede en Spaarnwoude, Heemskerk,
      Kaag en Braassem, Nieuwkoop, Ouder Amstel, Teylingen, Uitgeest, Uithoorn, Velsen, Zaanstad, alsmede de Dagelijks
      Besturen van Stadsdeel Oost, Stadsdeel Nieuw-West, Stadsdeel Zuid en Stadsdeel Zuidoost van de gemeente Amsterdam;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.g
    text: |-
      *de Planologische Kernbeslissing (PKB):* De Planologische Kernbeslissing ’Schiphol en Omgeving’, deel 4, zoals
      goedgekeurd door de Staten-Generaal op 29 november 1995 (Hand. Tweede Kamer, 1994–1995, ) en zoals luidend op
      19 februari 2003.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
  - number: 1.h
    text: |-
      *de wet:* [hoofdstuk 8 van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
  - number: 1.i
    text: |-
      *het Luchthavenindelingbesluit:* het [Luchthavenindelingbesluit Schiphol][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014329
  - number: 1.j
    text: |-
      *het Luchthavenverkeerbesluit:* het [Luchthavenverkeerbesluit Schiphol][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: '2'
    text: |-
      De regeling heeft tot doel een voor belanghebbenden duidelijke, deskundige en doelmatige afhandeling
      – de besluitvorming naar dezelfde maatstaven daarbij begrepen – te bevorderen van verzoeken
      om schadevergoeding die verband houden met de uitbreiding van het luchtvaartterrein Schiphol,
      zoals vastgelegd in de Planologische Kernbeslissing, alsmede met de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      _____________ (Stb. 374), het [Luchthavenindelingbesluit][ref2] en het [Luchthavenverkeerbesluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013815
      [ref2]: https://wetten.overheid.nl/BWBR0014329
      [ref3]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013815
      - id: ref2
        bwb_id: BWBR0014329
      - id: ref3
        bwb_id: BWBR0014330
  - number: '3.1'
    text: 'Er is een rechtspersoonlijkheid bezittend openbaar lichaam genaamd: Schadeschap Luchthaven Schiphol.'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel3
  - number: '3.2'
    text: Het Schap is gevestigd in Hoofddorp (gemeente Haarlemmermeer).
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel3
  - number: '4'
    text: 'De bestuursorganen van het Schap zijn:'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel4
  - number: 4.a
    text: het algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel4
  - number: 4.b
    text: het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel4
  - number: 4.c
    text: de voorzitter;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel4
  - number: 4.d
    text: |-
      de besliscommissie, als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
  - number: '5.1'
    text: Het algemeen bestuur bestaat uit één en dertig leden.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.2'
    text: Twee leden van het algemeen bestuur worden door de Minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.3'
    text: 'De overige leden van het Algemeen Bestuur en hun plaatsvervangers worden aangewezen door:'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: 5.3.a
    text: |-
      De respectieve deelnemende colleges van Burgemeester en Wethouders, de deelnemende Dagelijks Besturen van de
      stadsdelen, uit hun midden, de voorzitter van het college en het Dagelijks Bestuur inbegrepen;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: 5.3.b
    text: |-
      in afwijking van het bepaalde in sub a wordt voor de gemeente Haarlemmermeer het lid gekozen door de gemeenteraad,
      uit zijn midden, de voorzitter inbegrepen, en uit het college van Burgemeester en Wethouders van de gemeente
      Haarlemmermeer;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: 5.3.c
    text: |-
      Provinciale Staten van de provincie Noord-Holland, uit hun midden, de voorzitter inbegrepen, en uit Gedeputeerde
      Staten van de provincie Noord-Holland;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: 5.3.d
    text: |-
      het Algemeen Bestuur van het Hoogheemraadschap Rijnland, uit zijn midden, de voorzitter inbegrepen en uit het
      Dagelijks Bestuur van het Hoogheemraadschap Rijnland.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.4'
    text: |-
      De leden van het algemeen bestuur, bedoeld in het derde lid, hebben elk een stem, met dien verstande dat het lid
      van de gemeente Aalsmeer, Amstelveen, Amsterdam, Haarlemmerliede en Spaarnwoude, Haarlemmermeer en Zaanstad een
      tweevoudige stem heeft. De leden, bedoeld in het tweede lid, hebben ieder een aantal stemmen dat de helft van het
      aantal stemmen dat de overige leden kunnen uitoefenen vertegenwoordigt, met dien verstande dat zij tezamen nooit
      meer stemmen kunnen uitoefenen dan de overige, aanwezige leden tezamen.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.6'
    text: De Minister kan een plaatsvervanger aanwijzen voor de door hem aangewezen leden van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.7'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.8'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
  - number: '5.10'
    text: |-
      Het ten aanzien van de leden bepaalde in de regeling, alsmede in de [Wet gemeenschappelijke regelingen][ref1], is
      van overeenkomstige toepassing op hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '6.1'
    text: De door de Minister benoemde leden van het algemeen bestuur worden benoemd voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
  - number: '6.2'
    text: |-
      De leden, bedoeld in [artikel 5, derde lid][ref1], worden aangewezen voor de zittingsduur van vier jaar. Een
      lid, als bedoeld in artikel 5, treedt af op de dag waarop de zittingsperiode van het bestuursorgaan dat het
      desbetreffende lid heeft aangewezen afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.3'
    text: |-
      Het bestuursorgaan dat een lid van het Algemeen Bestuur aanwijst zoals bedoeld in [artikel 5, derde lid][ref1],
      besluit in de eerste vergadering van elke zittingsperiode over de aanwijzing van het lid en zijn plaatsvervanger
      van het Algemeen Bestuur. Aftredende leden kunnen opnieuw als lid worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.4'
    text: |-
      Een lid van het algemeen bestuur dat ophoudt lid of voorzitter van het bestuursorgaan te zijn dat hem als lid van
      het algemeen bestuur heeft aangewezen, houdt daarmee tevens op lid van het algemeen bestuur te zijn.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
  - number: '6.5'
    text: |-
      Een lid van het algemeen bestuur kan te allen tijde ontslag nemen. Hij deelt zijn ontslag mede aan het
      bestuursorgaan dat hem heeft aangewezen ([art. 5, lid 3][ref1]), onderscheidenlijk de Minister (art. 5, lid 2).


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.6'
    text: |-
      Indien tussentijds een plaats van een lid van het algemeen bestuur vacant of beschikbaar komt. wijst het
      betreffende bestuursorgaan ([art. 5, lid 3][ref1]) onderscheidenlijk de Minister (art. 5. Iid 2), ten spoedigste,
      doch in elk geval binnen twee maanden, een nieuw lid aan.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.7'
    text: |-
      Van elke aanwijzing of wijziging daarin doet het college van burgemeester en wethouders van de betreffende
      gemeente, het dagelijks bestuur van het stadsdeel, het college van gedeputeerde staten van de provincie of het
      dagelijks bestuur van het waterschap onderscheidenlijk de Minister schriftelijke mededeling aan het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel6
  - number: '7.1'
    text: |-
      Het algemeen bestuur vergadert tenminste tweemaal per jaar en voorts zo dikwijls de voorzitter dit nodig oordeelt
      of tenminste drie leden zulks schriftelijk, onder opgave van de te behandelen onderwerpen, hebben verzocht. Een
      gelijk verzoekrecht komt toe aan de in [artikel 5, tweede lid][ref1], bedoelde leden.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '7.2'
    text: |-
      Het algemeen bestuur besluit bij meerderheid van stemmen. Wordt over een voorstel geen stemming gevraagd, dan is
      het aangenomen.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel7
  - number: '7.3'
    text: |-
      Staken de stemmen bij een stemming over personen tot wie de keuze door een voordracht is beperkt, dan wordt in
      dezelfde vergadering een herstemming gehouden. Staken de stemmen bij herstemming opnieuw, dan beslist terstond
      het lot.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel7
  - number: '7.4'
    text: |-
      Staken de stemmen bij een stemming over een ander onderwerp dan bedoeld in het derde lid, dan is het voorstel
      niet aangenomen. Is de vergadering niet voltallig, dan wordt bij staking van de stemmen het nemen van een besluit
      verdaagd tot een volgende vergadering. Staken de stemmen in deze volgende vergadering, ongeacht of deze voltallig
      is of niet, opnieuw dan is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel7
  - number: '7.5'
    text: |-
      Is een voorstel door staking van de stemmen niet aangenomen, dan wordt op een daartoe strekkend verzoek van het
      algemeen bestuur, bindend advies ingewonnen door een door de president van de rechtbank te Haarlem aan wijzen
      onafhankelijke en onpartijdige deskundige.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel7
  - number: '8.1'
    text: |-
      Een lid van het Algemeen Bestuur is aan het bestuursorgaan dat hem als lid heeft aangewezen, aan de gemeenteraad
      van de betreffende gemeente, de stadsdeelraad van het betreffende stadsdeel en aan een of meer leden van die
      gemeenteraad of stadsdeelraad verantwoording verschuldigd voor de uitoefening van zijn lidmaatschap.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel8
  - number: '8.2'
    text: |-
      Een lid van het algemeen bestuur kan door het bestuursorgaan, dat hem heeft aangewezen, worden ontslagen indien dit
      lid het vertrouwen van dat bestuursorgaan niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel8
  - number: '8.3'
    text: |-
      Op de procedure van het ontslag van een lid als bedoeld in [artikel 5, derde lid][ref1], zijn de daarop betrekking
      hebbende artikelen uit de [Gemeentewet][ref2], [Provinciewet][ref3] respectievelijk [Waterschapswet][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0005645
      [ref4]: https://wetten.overheid.nl/BWBR0005108
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
      - id: ref3
        bwb_id: BWBR0005645
      - id: ref4
        bwb_id: BWBR0005108
  - number: '8.4'
    text: |-
      Onverminderd [artikel 16, zesde lid, Wet gemeenschappelijke regelingen][ref1] geeft een lid van het Algemeen
      Bestuur desgevraagd mondeling of schriftelijk inlichtingen aan het bestuursorgaan dat hem als lid heeft aangewezen,
      aan de gemeenteraad van de betreffende gemeente, de stadsdeelraad van het betreffende stadsdeel en aan een of meer
      leden van die gemeenteraad of stadsdeelraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
  - number: '8.5'
    text: Over al hetgeen het Schap betreft dient het algemeen bestuur de deelnemers desgevraagd van bericht en raad.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur bij uitsluiting bevoegd ter zake
      van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref2] doch uitsluitend voor zover deze aanvraag
      verband houdt met schade ten gevolge van de aanwijzingen bedoeld in de [artikelen 24][ref3], [26][ref4] en
      [27 van de Luchtvaartwet][ref5] ten behoeve van het luchtvaartterrein Schiphol (besluiten van de Minister van
      Verkeer en Waterstaat en de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 oktober
      1996, Stcrt. 1996, 211).


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0002267
        artikel: '27'
  - number: '9.2'
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur bij uitsluiting bevoegd ter zake
      van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref2], doch uitsluitend voor zover deze aanvraag verband houdt
      met schade ten gevolge van:


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel49
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '49'
  - number: 9.2.a
    text: |-
      de in de Planologische Kernbeslissing Schiphol en Omgeving (besluit van de Minister van Verkeer en Waterstaat,
      de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en de Minister van Economische Zaken zoals
      goedgekeurd door de Staten-Generaal op 29 november 1995) aangegeven ’Veiligheidszone in ruime en engere zin voor
      het vier- en vijfbanenstelsel’ (figuur 7) en de ’Begrenzing Vrijwaringszone’ (figuur 11);
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
  - number: 9.2.b
    text: |-
      de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en
      Omgeving bedoelde aanpassing in het hoofdwegennet in het gebied Haarlemmermeer- Noord, zijnde de aanleg van de
      Verlengde Westrandweg (rijksweg A5: tracé gedeelte tussen de Ringvaart, parallel aan de Zwanenburgbaan tot de
      aansluiting bij de Kruisweg op de rijksweg A4, zoals opgenomen in het besluit van de minister van V&W d.d. 15 juli
      1992);
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
  - number: 9.2.c
    text: |-
      de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en
      Omgeving (bedoelde aanpassingen in de wegen- en groenstructuur in het gebied Haarlemmermeer-Noord, zijnde: de
      aanleg van de provinciale weg N22-Noord tracégedeelte vanaf de A205 langs de IJtocht tot aan de Geniedijk) zoals
      aangegeven in het besluit van Provinciale Staten van 2 september 1996, nr. 51; de aanleg van het groengebied
      ’Groene Carré’ zoals aangegeven in de partiële herziening van het streekplan ANZKG voor Haarlemmermeer/ Schiphol,
      door Provinciale Staten vastgesteld bij besluit van 18 december 1995, nr. 76 (het gedeelte aan weerszijden van
      de A9, het gedeelte aan de westzijde van de A4, het gedeelte langs de noordzijde van de N201 en het gedeelte ten
      westen van de IJtocht tussen de Geniedijk en de A9; de ruimtelijke reservering voor de aanleg van de openbaar
      vervoerbaan ’Zuidtangent’ (tussen de Ringvaart Haarlemmermeer nabij Vijfhuizen enerzijds en Schiphol Noord (nabij
      de A9) zoals in het Meerjarenprogramma Infrastructuur en Transport 1988–2002, onder projectnummer a.040 opgenomen;
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
  - number: 9.2.d
    text: |-
      de in hoofdstuk Vlll (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en
      Omgeving bedoelde aanpassingen in de waterhuishouding in het gebied Haarlemmermeer-Noord door de aanleg van
      waterlopen en bijbehorende infrastructurele werken, zoals aangegeven in het door het Hoogheemraadschap Rijnland. in
      november 1997 vastgestelde waterhuishoudkundig plan (variant IlBb);
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
  - number: 9.2.e
    text: |-
      de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en
      Omgeving bedoelde aanpassingen in het lokale wegennet in het gebied Haarlemmermeer-Noord, zijnde: de aanleg van
      keerlussen in de IJweg, Vijfhuizerweg en Rijnlanderweg, alsmede de aanleg van een fietspad langs de geplande
      rijksweg A5 (tussen Hoofdvaart-westzijde en de IJweg) en van een fietspad langs de geplande start- en landingsbaan
      5P (tussen de Schipholweg en de IJweg) en de A5, alsmede bijbehorende infrastructurele werken.
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
  - number: 9.3a
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur voorts bij uitsluiting bevoegd ter zake van de behandeling
      van en de beslissing op een aanvraag om schadevergoeding op grond van [artikel 21][ref2] van de aanwijzing van de
      Minister van Verkeer en Waterstaat, handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009989#Artikel21
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0009989
        artikel: '21'
        hoofdstuk: VIII
  - number: 9.3b
    text: |-
      Bovendien is het algemeen bestuur, onverminderd [artikel 19][ref1], bij uitsluiting bevoegd ter
      zake van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 2, eerste lid van de Regeling nadeelcompensatie Verkeer en Waterstaat 1999][ref2] (Stcrt. 1999, 172), doch
      uitsluitend voor zover deze aanvraag verband houdt met schade ten gevolge van de in hoofdstuk VIII (’Beleidskeuzen
      ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en Omgeving bedoelde aanpassingen in het
      hoofdwegennet in het gebied Haarlemmermeer-Noord, zijnde de aanleg van de Verlengde Westrandweg (rijksweg A5: tracé
      gedeelte tussen de Ringvaart, parallel aan de Zwanenburgbaan tot de aansluiting bij de Kruisweg op de rijksweg A4,
      zoals opgenomen in het besluit van de minister van V&W d.d. 15 juli 1992).


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0010692
        artikel: '2'
  - number: 9.3c
    text: |-
      Voorts is het algemeen bestuur, onverminderd [artikel 19][ref1], bij uitsluiting bevoegd ter zake van de
      behandeling van en de beslissing op een aanvraag om vergoeding van schade welke het gevolg is van rechtmatige
      besluiten van bestuursorganen van de provincie Noord-Holland, resp.rechtmatige feitelijke handelingen van,
      of in opdracht van de provincie Noord-Holland, die verband houden met de in hoofdstuk VIII (’Beleidskeuzen
      ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en omgeving bedoelde aanpassingen in
      de wegen- en groenstructuur in het gebied Haarlemmermeer-Noord, zijnde: de aanleg van de provinciale weg N22-
      Noord (tracégedeeelte vanaf de A205 langs de IJtocht tot aan de Geniedijk) zoals aangegeven in het besluit van
      Provinciale Staten van 2 september 1996, nr. 51; de aanleg van het groengebied ’Groene Carré’ zoals aangegeven in
      de partiële herziening van het streekplan ANZKG voor Haarlemmermeer/Schiphol, door Provinciale Staten vastgesteld
      bij besluit van 18 december 1995. nr. 76 (het gedeelte aan weerszijden van de A9, het gedeelte aan de westzijdevan
      de A4, het gedeelte langs de noordzijde van de N201 en het gedeelte ten westen van de IJtocht tussen de Geniedijk
      en de A9; de ruimtelijke reservering voor de aanleg van de openbaar vervoerbaan ’Zuidtangent’ (tussen de
      Ringvaart Haarlemmermeer nabij Vijfhuizen enerzijds en Schiphol Noord nabij de A9) zoals in het Meerjarenprogramma
      Infrastructuur en Transport 1988–2002, onder projectnummer a.040 opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
    url: https://wetten.overheid.nl/BWBR0009989/2013-05-24#Artikel9
