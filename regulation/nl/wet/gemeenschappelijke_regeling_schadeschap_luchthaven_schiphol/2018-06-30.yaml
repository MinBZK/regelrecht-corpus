  - number: '23'
    text: |-
      De voorschriften omtrent de zorg, de bewaring en het beheer van bescheiden van de Minister zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel23
  - number: '24'
    text: |-
      Een deelnemer kan uittreden bij besluit van het betrokken bestuursorgaan, onderscheidenlijk van de Minister. De
      uittreding vindt niet eerder plaats dan nadat:

        - het algemeen bestuur de bestuurlijke en financiële gevolgen heeft geregeld en de continuïteit of beëindiging van
      het Schap is zeker gesteld.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel24
  - number: '25'
    text: |-
      1 Tot wijziging van de regeling wordt op voorstel van het algemeen bestuur besloten door de deelnemers.

      2 Een wijziging van de regeling is tot stand gekomen, zodra het in het eerste lid bedoelde voorstel is aanvaard
      door de helft van de deelnemers.

      3 De wijziging treedt in werking met ingang van de dag na de datum van de uitgifte van de Staatscourant waarin deze
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel25
  - number: '26'
    text: |-
      1 De regeling wordt aangegaan voor een periode van tien jaar na inwerkingtreding. Het dagelijks bestuur brengt niet
      later dan twee jaar voorgaande aan het einde van deze periode een gemotiveerd advies uit aan het algemeen bestuur
      betreffende de noodzaak tot eventuele voortzetting van het schap en dienovereenkomstige wijziging van de regeling.

      2 Na het einde van de periode van 10 jaar als bedoeld in lid 1 wordt de regeling jaarlijks stilzwijgend verlengd.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel26
  - number: '27'
    text: |-
      1 Tot opheffing van de regeling wordt op voorstel van het algemeen bestuur besloten door de deelnemers.

      2 Een besluit tot opheffing is tot stand gekomen zodra het in het eerste lid bedoelde voorstel is aanvaard door
      tenminste twee derde van de deelnemers.

      3 Het besluit tot opheffing vermeldt de datum waarop de opheffing ingaat. Deze datum ligt minimaal 1 jaar na de
      datum van het besluit tot opheffing.

      4 Ingeval van opheffing van de regeling besluit het algemeen bestuur tot liquidatie en stelt hij daarvoor een
      liquidatieplan vast.

      5 Zo nodig blijven de bestuursorganen van het Schap ook na het tijdstip van de opheffing in functie totdat de
      liquidatie is beëindigd.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel27
  - number: '28'
    text: |-
      De bij de [Wet gemeenschappelijke regelingen][ref1] voorgeschreven toezending van de regeling, alsmede de besluiten
      tot uittreding, wijziging of opheffing, geschiedt door de zorg van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '29'
    text: |-
      1 De Minister maakt de regeling tijdig in alle deelnemende provincies en gemeenten bekend door kennisgeving van de
      inhoud daarvan in de Staatscourant.

      2 Het eerste lid is van toepassing op besluiten tot wijziging, verlenging of opheffing van de regeling.

      3 Het eerste lid is van toepassing op de verordening als bedoeld in [artikel 10][ref1] van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel10
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '10'
        hoofdstuk: IV
  - number: '30'
    text: Deze regeling kan worden aangehaald als ’Gemeenschappelijke regeling Schadeschap Luchthaven Schiphol’.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel30
