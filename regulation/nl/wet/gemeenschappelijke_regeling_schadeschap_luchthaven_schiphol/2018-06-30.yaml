  - number: '7'
    text: |-
      1 Het algemeen bestuur vergadert tenminste eenmaal per jaar en voorts zo dikwijls de voorzitter dit nodig oordeelt
      of tenminste drie leden zulks schriftelijk, onder opgave van de te behandelen onderwerpen, hebben verzocht. Een
      gelijk verzoekrecht komt toe aan het in [artikel 5, tweede lid][ref1], bedoelde lid.

      2 Het algemeen bestuur besluit bij meerderheid van stemmen. Wordt over een voorstel geen stemming gevraagd, dan is
      het aangenomen.

      3 Staken de stemmen bij een stemming over personen tot wie de keuze door een voordracht is beperkt, dan wordt in
      dezelfde vergadering een herstemming gehouden.

      Staken de stemmen bij herstemming opnieuw, dan beslist terstond het lot.

      4 Staken de stemmen bij een stemming over een ander onderwerp dan bedoeld in het derde lid, dan is het voorstel
      niet aangenomen. Is de vergadering niet voltallig, dan wordt bij staking van de stemmen het nemen van een besluit
      verdaagd tot een volgende vergadering. Staken de stemmen in deze volgende vergadering, ongeacht of deze voltallig
      is of niet, opnieuw dan is het voorstel niet aangenomen.

      5 Is een voorstel door staking van de stemmen niet aangenomen, dan wordt op een daartoe strekkend verzoek van
      het algemeen bestuur, bindend advies ingewonnen door een door de president van de rechtbank te Haarlem aan wijzen
      onafhankelijke en onpartijdige deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
