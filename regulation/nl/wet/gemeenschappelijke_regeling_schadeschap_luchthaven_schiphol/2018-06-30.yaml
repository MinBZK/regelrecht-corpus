  - number: '10'
    text: |-
      Het algemeen bestuur stelt, met inachtneming van het in de volgend leden bepaalde, een verordening vast, waarin
      de behandeling van en de beslissing op aanvragen om schadevergoeding als bedoeld in [artikel 9][ref1] nader worden
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '11'
    text: |-
      1 Het dagelijks bestuur bestaat uit tenminste drie en ten hoogste vier leden, te weten de voorzitter, het door de
      Minister aangewezen lid van het algemeen bestuur, het door de raad van de gemeente Haarlemmermeer aangewezen lid
      van het algemeen bestuur en ten hoogste één ander door het algemeen bestuur uit zijn midden aangewezen lid.

      2 Het door de Minister benoemde lid van het dagelijks bestuur wordt benoemd voor onbepaalde tijd.

      3 De overige leden van het dagelijks bestuur worden aangewezen voor een zittingsduur van vier jaar. Zij treden af
      op de dag waarop de zittingsperiode van het betrokken bestuursorgaan afloopt.

      4 Het algemeen bestuur besluit in de eerste vergadering van elke zittingsperiode over de aanwijzing van door hem
      aan te wijzen leden van het dagelijks bestuur en hun plaatsvervangers. Aftredende leden kunnen opnieuw als lid
      worden aangewezen.

      5 Het lid dat ophoudt lid van het algemeen bestuur te zijn, houdt tevens op lid van het dagelijks bestuur te zijn.

      6 Indien tussentijds een plaats in het dagelijks bestuur beschikbaar komt, wijst het algemeen bestuur binnen
      6 maanden een nieuw lid aan. Gaat de ontstane vacature gepaard met een vacature in het algemeen bestuur,
      dan vangt de termijn van 6 maanden aan op het moment dat het dagelijks bestuur de mededeling, bedoeld in
      [artikel 6, zevende lid][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel6
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '6'
        hoofdstuk: IV
  - number: '12'
    text: Elk lid van het dagelijks bestuur heeft een stem.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel12
  - number: '13'
    text: |-
      Het dagelijks bestuur is belast met:

      a. de voorbereiding van alles waarover in de vergadering van het algemeen bestuur zal worden beraadslaagd en
      besloten;

      b. de uitvoering van de besluiten van het algemeen bestuur en van de besliscommissie;

      c. het beheren van de inkomsten en uitgaven van het Schap;

      d. de zorg voor de controle op het geldelijk beheer en de boekhouding;

      e. het nemen van alle conservatoire maatregelen zowel in als buiten rechte en het doen van alles wat nodig is ter
      voorkoming van verjaring of verlies van recht of bezit;

      f. het verstrekken van inlichtingen aan de deelnemers.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel13
  - number: '14'
    text: |-
      1 Het dagelijks bestuur vergadert zo dikwijls de voorzitter dit nodig oordeelt of twee andere leden van het
      dagelijks bestuur zulks schriftelijk, onder opgave van de te behandelen onderwerpen, hebben verzocht. In het
      laatste geval wordt de vergadering binnen drie weken gehouden.

      2 [Artikel 56 Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel56
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '56'
  - number: '15'
    text: |-
      1 De leden van het dagelijks bestuur zijn, tezamen en ieder afzonderlijk, aan het algemeen bestuur verantwoording
      verschuldigd voor het door hen gevoerde bestuur.

      2 Onverminderd [artikel 16, zesde lid, Wet gemeenschappelijke regelingen][ref1] geven zij het algemeen bestuur
      mondeling of schriftelijk de door een of meer leden van dit bestuur gevraagde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
  - number: '16'
    text: |-
      1 Een lid van het dagelijks bestuur kan te allen tijde ontslag nemen. Hij deelt zijn ontslag mede aan het
      bestuursorgaan dat hem heeft aangewezen, onderscheidenlijk aan de Minister.

      2 Een lid van het dagelijks bestuur kan door het algemeen bestuur worden ontslagen indien dit lid het vertrouwen
      van het algemeen bestuur niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel16
  - number: '17'
    text: |-
      1 De voorzitter van het algemeen bestuur, benevens de plaatsvervangend-voorzitter, wordt door het algemeen bestuur
      uit zijn midden aangewezen bij gewone meerderheid van stemmen. Tot plaatsvervangend-voorzitter kan alleen een ander
      lid van het dagelijks bestuur worden aangewezen.

      2 De voorzitter van het algemeen bestuur is tevens voorzitter van het dagelijks bestuur.

      3 De plaatsvervangend-voorzitter van het algemeen bestuur is tevens plaatsvervangend-voorzitter van het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel17
  - number: '18'
    text: |-
      1 De voorzitter belegt de vergaderingen van het algemeen bestuur en het dagelijks bestuur.

      2 Hij is belast met de leiding van de vergaderingen van het algemeen bestuur en het dagelijks bestuur.

      3 Hij is belast met de uitvoering van de besluiten van het dagelijks bestuur.

      4 Hij tekent de stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan.

      5 De voorzitter vertegenwoordigt het Schap in en buiten rechte. Hij kan deze vertegenwoordiging opdragen aan een
      door hem aan te wijzen persoon.

      6 Indien de voorzitter behoort tot het bestuur van een deelnemer die partij is in een geding waarbij het Schap is
      betrokken, oefent de plaatsvervangend voorzitter de in het vijfde lid bedoelde bevoegdheid uit.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel18
  - number: '19'
    text: |-
      1 Het algemeen bestuur kan een commissie instellen waaraan de in [artikel 9][ref1] genoemde bevoegdheden kunnen
      worden overgedragen, verder te noemen:

      de besliscommissie.

      2 Het algemeen bestuur regelt de samenstelling en werkwijze van de besliscommissie.

      3 De besliscommissie wordt door het algemeen bestuur benoemd op voordracht van het dagelijks bestuur.

      4 De besliscommissie bestaat uit drie onafhankelijke deskundigen, en hun plaatsvervangers, uit wier midden het
      algemeen bestuur de voorzitter aanwijst.

      5 De besliscommissie rapporteert over de voortgang van haar werkzaamheden, in het bijzonder van de afhandeling van
      de ingekomen schadeverzoeken, eenmaal per jaar door tussenkomst van het dagelijks bestuur aan het algemeen bestuur.

      6 Eenmaal per jaar bericht de besliscommissie het algemeen bestuur over de doelmatigheid van de gevolgde werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '20'
    text: |-
      Aan de leden en de plaatsvervangende leden van de besliscommissie wordt ten laste van het Rijk een vergoeding
      toegekend voor werkzaamheden, alsmede voor het bijwonen van vergaderingen en reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel20
  - number: '21'
    text: |-
      1 De Minister stelt de bestuursorganen van het Schap voldoende ambtelijke ondersteuning, waaronder een secretaris,
      ter beschikking.

      2 De secretaris woont de vergaderingen van het algemeen bestuur, het dagelijks bestuur en de besliscommissie bij.

      3 Alle stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan, worden door de secretaris
      medeondertekend.
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel21
  - number: '22'
    text: |-
      1 Onverminderd het bepaalde in wettelijke regelingen en het bepaalde in het tweede lid, worden de met de
      uitoefening van de in [artikel 9][ref1] bedoelde bevoegdheden samenhangende kosten gedragen door het Rijk, tenzij
      tussen het Rijk en andere deelnemers anders is overeengekomen.

      2 Ter zake van de voorwaarden waaronder het Rijk de kosten draagt die voortvloeien uit de uitoefening van de in
      [artikel 9, eerste lid][ref2], bedoelde bevoegdheid, kunnen door de Minister, handelende in overeenstemming met het
      algemeen bestuur van het schap, nadere regels worden gesteld.

      3 De kosten die samenhangen met de vergoedingen, bedoeld in [artikel 20][ref3], alsmede andere, vooraf door de
      Minister gefiatteerde kosten, komen voor rekening van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009989#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009989#Artikel20
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel22
