  - number: '2'
    text: |-
      De regeling heeft tot doel een voor belanghebbenden duidelijke, deskundige en doelmatige afhandeling
      – de besluitvorming naar dezelfde maatstaven daarbij begrepen – te bevorderen van verzoeken
      om schadevergoeding die verband houden met de uitbreiding van het luchtvaartterrein Schiphol,
      zoals vastgelegd in de Planologische Kernbeslissing, alsmede met de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ____________ (Stb. 374), het [Luchthavenindelingbesluit][ref2] en het [Luchthavenverkeerbesluit][ref3].


