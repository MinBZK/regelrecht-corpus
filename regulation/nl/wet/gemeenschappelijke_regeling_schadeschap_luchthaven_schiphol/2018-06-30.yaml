  - number: '8'
    text: |-
      1 Een lid van het algemeen bestuur is aan het bestuursorgaan dat hem als lid heeft aangewezen, aan de gemeenteraad
      van de betreffende gemeente en aan een of meer leden van die gemeenteraad verantwoording verschuldigd voor de
      uitoefening van zijn lidmaatschap.

      2 Een lid van het algemeen bestuur kan door het bestuursorgaan, dat hem heeft aangewezen, worden ontslagen indien
      dit lid het vertrouwen van dat bestuursorgaan niet meer bezit.

      3 Op de procedure van het ontslag van een lid als bedoeld in [artikel 5, derde lid][ref1], zijn de daarop
      betrekking hebbende artikelen uit de [Gemeentewet][ref2] respectievelijk de [Provinciewet][ref3] van toepassing.

      4 Onverminderd [artikel 16, zesde lid, Wet gemeenschappelijke regelingen][ref4] geeft een lid van het algemeen
      bestuur desgevraagd mondeling of schriftelijk inlichtingen aan het bestuursorgaan dat hem als lid heeft aangewezen,
      aan de gemeenteraad van de betreffende gemeente en aan een of meer leden van die gemeenteraad.

      5 Over al hetgeen het Schap betreft dient het algemeen bestuur de deelnemers desgevraagd van bericht en raad.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
