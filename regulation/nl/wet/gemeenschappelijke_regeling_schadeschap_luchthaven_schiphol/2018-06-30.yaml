  - number: '9'
    text: |-
      1 Onverminderd [artikel 19][ref1] is het algemeen bestuur bij uitsluiting bevoegd ter zake
      van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref2] doch uitsluitend voor zover deze aanvraag
      verband houdt met schade ten gevolge van de aanwijzingen bedoeld in de [artikelen 24][ref3], [26][ref4] en
      [27 van de Luchtvaartwet][ref5] ten behoeve van het luchtvaartterrein Schiphol (besluiten van de Minister van
      Verkeer en Waterstaat en de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 oktober
      1996, Stcrt. 1996, 211).

      2 Onverminderd [artikel 19][ref6] is het algemeen bestuur bij uitsluiting bevoegd ter zake
      van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref7], doch uitsluitend voor zover deze aanvraag verband houdt
      met schade ten gevolge van:

      a. de in de Planologische Kernbeslissing Schiphol en Omgeving (besluit van de Minister van Verkeer en Waterstaat,
      de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en de Minister van Economische Zaken zoals
      goedgekeurd door de Staten-Generaal op 29 november 1995) aangegeven ’Veiligheidszone in ruime en engere zin voor
      het vier- en vijfbanenstelsel’ (figuur 7) en de ’Begrenzing Vrijwaringszone’ (figuur 11);

      b. de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol
      en Omgeving bedoelde aanpassing in het hoofdwegennet in het gebied Haarlemmermeer- Noord, zijnde de aanleg van
      de Verlengde Westrandweg (rijksweg A5: tracé gedeelte tussen de Ringvaart, parallel aan de Zwanenburgbaan tot de
      aansluiting bij de Kruisweg op de rijksweg A4, zoals opgenomen in het besluit van de minister van V&W d.d. 15 juli
      1992);

      c. de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol
      en Omgeving bedoelde aanpassingen in het lokale wegennet in het gebied Haarlemmermeer-Noord, zijnde: de aanleg
      van keerlussen in de IJweg, Vijfhuizerweg en Rijnlanderweg, alsmede de aanleg van een fietspad langs de geplande
      rijksweg A5 (tussen Hoofdvaart-westzijde en de IJweg) en van een fietspad langs de geplande start- en landingsbaan
      5P (tussen de Schipholweg en de IJweg) en de A5, alsmede bijbehorende infrastructurele werken.

      3a Onverminderd [artikel 19][ref8] is het algemeen bestuur voorts bij uitsluiting bevoegd ter zake van de
      behandeling van en de beslissing op een aanvraag om schadevergoeding op grond van [artikel 21][ref9] van
      de aanwijzing van de Minister van Verkeer en Waterstaat, handelende in overeenstemming met de Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, bedoeld in het eerste lid.

      3b Bovendien is het algemeen bestuur, onverminderd [artikel 19][ref10], bij uitsluiting bevoegd
      ter zake van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 2, eerste lid van de Regeling nadeelcompensatie Verkeer en Waterstaat 1999][ref11] (Stcrt. 1999,
      172), doch uitsluitend voor zover deze aanvraag verband houdt met schade ten gevolge van de in hoofdstuk VIII
      (’Beleidskeuzen ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en Omgeving bedoelde
      aanpassingen in het hoofdwegennet in het gebied Haarlemmermeer-Noord, zijnde de aanleg van de Verlengde Westrandweg
      (rijksweg A5: tracé gedeelte tussen de Ringvaart, parallel aan de Zwanenburgbaan tot de aansluiting bij de Kruisweg
      op de rijksweg A4, zoals opgenomen in het besluit van de minister van V&W d.d. 15 juli 1992).

      3c Voorts is het algemeen bestuur, onverminderd [artikel 19][ref12], bij uitsluiting bevoegd ter zake van de
      behandeling van en de beslissing op een aanvraag om vergoeding van schade welke het gevolg is van rechtmatige
      besluiten van bestuursorganen van de provincie Noord-Holland, resp.rechtmatige feitelijke handelingen van,
      of in opdracht van de provincie Noord-Holland, die verband houden met de in hoofdstuk VIII (’Beleidskeuzen
      ruimtelijke inrichting’) van de Planologische Kernbeslissing Schiphol en omgeving bedoelde aanpassingen in
      de wegen- en groenstructuur in het gebied Haarlemmermeer-Noord, zijnde: de aanleg van de provinciale weg N22-
      Noord (tracégedeeelte vanaf de A205 langs de IJtocht tot aan de Geniedijk) zoals aangegeven in het besluit van
      Provinciale Staten van 2 september 1996, nr. 51; de aanleg van het groengebied ’Groene Carré’ zoals aangegeven in
      de partiële herziening van het streekplan ANZKG voor Haarlemmermeer/Schiphol, door Provinciale Staten vastgesteld
      bij besluit van 18 december 1995. nr. 76 (het gedeelte aan weerszijden van de A9, het gedeelte aan de westzijdevan
      de A4, het gedeelte langs de noordzijde van de N201 en het gedeelte ten westen van de IJtocht tussen de Geniedijk
      en de A9; de ruimtelijke reservering voor de aanleg van de openbaar vervoerbaan ’Zuidtangent’ (tussen de
      Ringvaart Haarlemmermeer nabij Vijfhuizen enerzijds en Schiphol Noord nabij de A9) zoals in het Meerjarenprogramma
      Infrastructuur en Transport 1988–2002, onder projectnummer a.040 opgenomen.

      3d Voorts is het algemeen bestuur, onverminderd [artikel 19][ref13], bij uitsluiting bevoegd ter zake van de
      behandeling van en de beslissing op een aanvraag om vergoeding van schade welke het gevolg is van rechtmatige
      besluiten van bestuursorganen van de gemeente Haarlemmermeer, resp.feitelijke handelingen van, of in opdracht van
      de gemeente Haarlemmermeer, welke verband houden met de in hoofdstuk VIII (’Beleidskeuzen ruimtelijke inrichting’)
      van de Planologische Kernbeslissing Schiphol en Omgeving bedoelde aanpassingen in het lokale wegennet in het gebied
      Haarlemmermeer-Noord. zijnde: de aanleg van keerlussen in de IJweg, Vijfhuizerweg en Rijnlanderweg, alsmede de
      aanleg van een fietspad langs de geplande rijksweg A5 (tussen Hoofdvaart-westzijde en de IJweg) en van een fietspad
      langs de geplande start- en landingsbaan 5P (tussen de Schipholweg en de IJweg) en de A5, alsmede bijbehorende
      infrastructurele werken.

      3e Onverminderd [artikel 19][ref14] is tot 1 juli 2018 het algemeen bestuur tevens bij uitsluiting
      bevoegd ter zake van de behandeling van en de beslissing op een aanvraag om schadevergoeding op grond van
      [artikel 8.31 van de Wet luchtvaart][ref15]. De aanvragen die voor deze datum zijn ingediend bij het Schap worden
      afgehandeld door het Schap.

      3f Voorts is tot 1 juli 2018 het algemeen bestuur bij uitsluiting bevoegd ter zake van de behandeling van
      en de beslissing op een aanvraag om vergoeding van schade welke het gevolg is van rechtmatige besluiten of
      feitelijke handelingen van of in opdracht van een of meer van de deelnemers, welke verband houden met de
      [Wet luchtvaart][ref16], het [Luchthavenindelingbesluit][ref17] of het [Luchthavenverkeerbesluit][ref18]. De
      aanvragen die voor 1 juli 2018 zijn ingediend bij het Schap worden afgehandeld door het Schap.


