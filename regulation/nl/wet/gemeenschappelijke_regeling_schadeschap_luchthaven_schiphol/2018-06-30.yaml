  - number: '3'
    text: |-
      1 Er is een rechtspersoonlijkheid bezittend openbaar lichaam genaamd: Schadeschap Luchthaven Schiphol.

      2 Het Schap is gevestigd in Hoofddorp (gemeente Haarlemmermeer).
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel3
  - number: '4'
    text: |-
      De bestuursorganen van het Schap zijn:

      a. het algemeen bestuur;

      b. het dagelijks bestuur;

      c. de voorzitter;

      d. de besliscommissie, als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
  - number: '5'
    text: |-
      1 Het algemeen bestuur bestaat uit acht leden.

      2 Eén lid van het algemeen bestuur wordt aangewezen door de Minister.

      3 De overige leden van het algemeen bestuur en hun plaatsvervangers worden aangewezen door:

      a. de respectieve deelnemende colleges van burgemeester en wethouders, uit hun midden;

      b. in afwijking van het bepaalde in sub a wordt voor de gemeente Haarlemmermeer het lid gekozen door de
      gemeenteraad, uit zijn midden, de voorzitter inbegrepen, en uit het college van burgemeester en wethouders van de
      gemeente Haarlemmermeer;

      c. gedeputeerde staten van de provincie Noord-Holland, uit hun midden.

      4 De leden van het algemeen bestuur, bedoeld in het derde lid, hebben elk een stem, met dien verstande dat het
      lid van de gemeente Aalsmeer, Amstelveen, Haarlemmermeer en Zaanstad een tweevoudige stem heeft. Het lid van het
      algemeen bestuur bedoeld in het tweede lid, heeft een aantal stemmen dat gelijk is aan het aantal stemmen dat
      de overige leden tezamen kunnen uitoefenen, met dien verstande dat het nooit meer stemmen kan uitoefenen dan de
      overige, aanwezige leden tezamen.

      5 De Minister kan een plaatsvervanger aanwijzen voor het door hem aangewezen lid van het algemeen bestuur.

      6 Het ten aanzien van de leden bepaalde in de regeling alsmede de [Wet gemeenschappelijke regelingen][ref1] is van
      overeenkomstige toepassing op hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0009989/2018-06-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '6'
    text: |-
      1 Het door de Minister benoemde lid van het algemeen bestuur wordt benoemd voor onbepaalde tijd.

      2 De leden, bedoeld in [artikel 5, derde lid][ref1], worden aangewezen voor de zittingsduur van vier jaar. Een
      lid, als bedoeld in artikel 5, treedt af op de dag waarop de zittingsperiode van het bestuursorgaan dat het
      desbetreffende lid heeft aangewezen afloopt.

      3 Het bestuursorgaan dat een lid van het Algemeen Bestuur aanwijst zoals bedoeld in [artikel 5, derde lid][ref2],
      besluit in de eerste vergadering van elke zittingsperiode over de aanwijzing van het lid en zijn plaatsvervanger
      van het Algemeen Bestuur. Aftredende leden kunnen opnieuw als lid worden aangewezen.

      4 Een lid van het algemeen bestuur dat ophoudt lid of voorzitter van het bestuursorgaan te zijn dat hem als lid van
      het algemeen bestuur heeft aangewezen, houdt daarmee tevens op lid van het algemeen bestuur te zijn.

      5 Een lid van het algemeen bestuur kan te allen tijde ontslag nemen.

      Hij deelt zijn ontslag mede aan het bestuursorgaan dat hem op grond van [artikel 5, tweede of derde lid][ref3],
      heeft aangewezen.

      6 Indien tussentijds een plaats van een lid van het algemeen bestuur vacant of beschikbaar komt, wijst het
      bestuursorgaan dat het lid op grond van [artikel 5, derde lid][ref4], heeft aangewezen of, indien het een door de
      Minister aangewezen lid betreft, de Minister zo spoedig mogelijk, doch in elk geval binnen twee maanden, een nieuw
      lid aan.

      7 Van elke aanwijzing of wijziging daarin doet het college van burgemeester en wethouders van de betreffende
      gemeente, het college van gedeputeerde staten van de provincie Noord-Holland, of de Minister schriftelijk
      mededeling aan het dagelijks bestuur.


