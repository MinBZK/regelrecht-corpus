articles:
  - number: '1'
    text: |-
      In deze gemeenschappelijke regeling wordt verstaan onder:

      a. *de regeling:* deze gemeenschappelijke regeling;

      b. *het Schap:* het openbaar lichaam, bedoeld in [artikel 3][ref1];

      c. *de Minister:* de Minister van Infrastructuur en Milieu;

      d. *de deelnemers:* de Minister van Infrastructuur en Milieu, Gedeputeerde Staten van de provincie Noord-Holland,
      de gemeenteraad van de gemeente Haarlemmermeer, de colleges van Burgemeester en Wethouders van de gemeenten
      Aalsmeer, Amstelveen, Haarlemmermeer, Nieuwkoop, Uitgeest, Zaanstad;

      e. *de Planologische Kernbeslissing (PKB):* De Planologische Kernbeslissing ’Schiphol en Omgeving’, deel 4, zoals
      goedgekeurd door de Staten-Generaal op 29 november 1995 (Hand. Tweede Kamer, 1994–1995, ) en zoals luidend op 19
      februari 2003;

      f. *de wet:* [hoofdstuk 8 van de Wet luchtvaart][ref2];

      g. *het Luchthavenindelingbesluit:* het [Luchthavenindelingbesluit Schiphol][ref3];

      h. *het Luchthavenverkeerbesluit:* het [Luchthavenverkeerbesluit Schiphol][ref4].


