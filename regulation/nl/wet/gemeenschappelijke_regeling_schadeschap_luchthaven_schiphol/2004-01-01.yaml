        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0014329
      - id: ref3
        bwb_id: BWBR0014330
  - number: '10.1'
    text: |-
      Het algemeen bestuur stelt, met inachtneming van het in de volgende leden bepaalde, een verordening vast, waarin
      de behandeling van en de beslissing op aanvragen om schadevergoeding als bedoeld in [artikel 9][ref1] nader worden
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '10.2'
    text: |-
      Op de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in [artikel 9][ref1] is
      het bepaalde in de artikelen 3 tot en met 10 Regeling nadeelcompensatie Rijkswaterstaat (Stcrt 1991, 251 ) van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '10.3'
    text: |-
      De in artikel 5, derde lid, van de Regeling nadeelcompensatie Rijkswaterstaat genoemde termijn kan worden
      opgeschort totdat zowel de aanwijzing bedoeld in [artikel 9, eerste lid][ref1], als de ter uitvoering daarvan
      genomen planologische maatregelen, als bedoeld in [artikel 49 van de Wet op de Ruimtelijke Ordening][ref2], voor
      zover deze in het concrete geval in de aanvraag als schadeoorzaak worden aangewezen, alsmede de overige in de
      aanvraag als schadeoorzaak aangewezen besluiten, rechtens onaantastbaar zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel49
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '49'
  - number: '11.1'
    text: |-
      Het dagelijks bestuur bestaat uit ten minste vier en ten hoogste zeven leden, te weten de voorzitter, een van de
      door de Minister benoemde leden van het algemeen bestuur, het door provinciale staten aangewezen lid, het door de
      gemeenteraad van Haarlemmermeer aangewezen lid en ten hoogste drie andere door het algemeen bestuur uit zijn midden
      aangewezen leden.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.2'
    text: De door de Minister benoemde leden van het dagelijks bestuur worden benoemd voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      De overige leden van het dagelijks bestuur worden aangewezen voor een zittingsduur van vier jaar. Zij treden af op
      de dag waarop de zittingsperiode van het betrokken bestuursorgaan afloopt.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het algemeen bestuur besluit in de eerste vergadering van elke zittingsperiode over de aanwijzing van door hem aan
      te wijzen leden van het dagelijks bestuur en hun plaatsvervangers. Aftredende leden kunnen opnieuw als lid worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.5'
    text: Het lid dat ophoudt lid van het algemeen bestuur te zijn, houdt tevens op lid van het dagelijks bestuur te zijn.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.6'
    text: |-
      De plaatsvervangend voorzitter van het dagelijks bestuur wordt door het dagelijks bestuur uit zijn midden aan-
      gewezen bij gewone meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
  - number: '11.7'
    text: |-
      Indien tussentijds een plaats in het dagelijks bestuur beschikbaar komt, wijst het algemeen bestuur binnen
      6 maanden een nieuw lid aan. Gaat de ontstane vacature gepaard met een vacature in het algemeen bestuur,
      dan vangt de termijn van 6 maanden aan op het moment dat het dagelijks bestuur de mededeling, bedoeld in
      [artikel 6, zevende lid][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel6
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '6'
        hoofdstuk: IV
  - number: '12.1'
    text: |-
      Het dagelijks bestuur kiest uit zijn midden voor de duur van zijn zittingsperiode een plaatsvervangend-voorzitter
      die de voorzitter bij diens afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel12
  - number: '12.2'
    text: Elk lid van het dagelijks bestuur heeft een stem.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel12
  - number: '13'
    text: 'Het dagelijks bestuur is belast met:'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.a
    text: de voorbereiding van alles waarover in de vergadering van het algemeen bestuur zal worden beraadslaagd en besloten;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.b
    text: de uitvoering van de besluiten van het algemeen bestuur en van de besliscommissie;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.c
    text: het beheren van de inkomsten en uitgaven van het Schap;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.d
    text: de zorg voor de controle op het geldelijk beheer en de boekhouding;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.e
    text: |-
      het nemen van alle conservatoire maatregelen zowel in als buiten rechte en het doen van alles wat nodig is ter
      voorkoming van verjaring of verlies van recht of bezit;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: 13.f
    text: het verstrekken van inlichtingen aan de deelnemers.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het dagelijks bestuur vergadert zo dikwijls de voorzitter dit nodig oordeelt of twee andere leden van het dagelijks
      bestuur zulks schriftelijk, onder opgave van de te behandelen onderwerpen, hebben verzocht. In het laatste geval
      wordt de vergadering binnen drie weken gehouden.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      [Artikel 56 Gemeentewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel56
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '56'
  - number: '15.1'
    text: |-
      De leden van het dagelijks bestuur zijn, tezamen en ieder afzonderlijk, aan het algemeen bestuur verantwoording
      verschuldigd voor het door hen gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      Onverminderd [artikel 16, zesde lid, Wet gemeenschappelijke regelingen][ref1] geven zij het algemeen bestuur
      mondeling of schriftelijk de door een of meer leden van dit bestuur gevraagde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
  - number: '16.1'
    text: |-
      Een lid van het dagelijks bestuur kan te allen tijde ontslag nemen. Hij deelt zijn ontslag mede aan het
      bestuursorgaan dat hem heeft aangewezen, onderscheidenlijk aan de Minister.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      Een lid van het dagelijks bestuur kan door het algemeen bestuur worden ontslagen indien dit lid het vertrouwen van
      het algemeen bestuur niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel16
  - number: '17.1'
    text: |-
      De voorzitter van het algemeen bestuur, benevens de plaatsvervangend-voorzitter, wordt door het algemeen bestuur
      uit zijn midden aangewezen bij gewone meerderheid van stemmen. Tot plaatsvervangend-voorzitter kan alleen een ander
      lid van het dagelijks bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel17
  - number: '17.2'
    text: De voorzitter van het algemeen bestuur is tevens voorzitter van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel17
  - number: '18.1'
    text: De voorzitter belegt de vergaderingen van het algemeen bestuur en het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '18.2'
    text: Hij is belast met de leiding van de vergaderingen van het algemeen bestuur en het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '18.3'
    text: Hij is belast met de uitvoering van de besluiten van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '18.4'
    text: Hij tekent de stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '18.5'
    text: |-
      De voorzitter vertegenwoordigt het Schap in en buiten rechte. Hij kan deze vertegenwoordiging opdragen aan een door
      hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '18.6'
    text: |-
      Indien de voorzitter behoort tot het bestuur van een deelnemer die partij is in een geding waarbij het Schap is
      betrokken, oefent de plaatsvervangend voorzitter de in het vijfde lid bedoelde bevoegdheid uit.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het algemeen bestuur kan een commissie instellen waaraan de in [artikel 9][ref1] genoemde bevoegdheden kunnen
      worden overgedragen, verder te noemen: de besliscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '19.2'
    text: Het algemeen bestuur regelt de samenstelling en werkwijze van de besliscommissie.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
  - number: '19.3'
    text: De besliscommissie wordt door het algemeen bestuur benoemd op voordracht van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
  - number: '19.4'
    text: |-
      De besliscommissie bestaat uit drie onafhankelijke deskundigen, en hun plaatsvervangers, uit wier midden het
      algemeen bestuur de voorzitter aanwijst.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
  - number: '19.5'
    text: |-
      De besliscommissie rapporteert over de voortgang van haar werkzaamheden, in het bijzonder van de afhandeling van de
      ingekomen schadeverzoeken, halfjaarlijks door tussenkomst van het dagelijks bestuur aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
  - number: '19.6'
    text: Eenmaal per jaar bericht de besliscommissie het algemeen bestuur over de doelmatigheid van de gevolgde werkwijze.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel19
  - number: '20'
    text: |-
      Aan de leden en de plaatsvervangende leden van de besliscommissie wordt ten laste van het Rijk een vergoeding
      toegekend voor werkzaamheden, alsmede voor het bijwonen van vergaderingen en reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel20
  - number: '21.1'
    text: |-
      De Minister stelt de bestuursorganen van het Schap voldoende ambtelijke ondersteuning, waaronder een secretaris,
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel21
  - number: '21.2'
    text: De secretaris woont de vergaderingen van het algemeen bestuur, het dagelijks bestuur en de besliscommissie bij.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel21
  - number: '21.3'
    text: |-
      Alle stukken die van het algemeen bestuur, het dagelijks bestuur en van de besliscommissie uitgaan, worden door de
      secretaris medeondertekend.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onverminderd het bepaalde in wettelijke regelingen en het bepaalde in het tweede lid, worden de met de uitoefening
      van de in [artikel 9][ref1] bedoelde bevoegdheden samenhangende kosten gedragen door het Rijk, tenzij tussen het
      Rijk en andere deelnemers anders is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '22.2'
    text: |-
      Ter zake van de voorwaarden waaronder het Rijk de kosten draagt die voortvloeien uit de uitoefening van de in
      [artikel 9, eerste lid][ref1], bedoelde bevoegdheid, kunnen door de Minister, handelende in overeenstemming met het
      algemeen bestuur van het schap, nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '9'
        hoofdstuk: IV
  - number: '22.3'
    text: |-
      De kosten die samenhangen met de vergoedingen, bedoeld in [artikel 20][ref1], alsmede andere, vooraf door de
      Minister gefiatteerde kosten, komen voor rekening van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel20
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '20'
        hoofdstuk: VII
  - number: '23'
    text: |-
      De voorschriften omtrent de zorg, de bewaring en het beheer van bescheiden van de Minister zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel23
  - number: '24'
    text: |-
      Een deelnemer kan uittreden bij besluit van het betrokken bestuursorgaan, onderscheidenlijk van de Minister. De
      uittreding vindt niet eerder plaats dan nadat: - opname van het besluit tot uittreding in het register bedoeld in
      [artikel 27, tweede lid, Wet gemeenschappelijke regelingen][ref1] heeft plaatsgevonden;
        - het algemeen bestuur de bestuurlijke en financiële gevolgen heeft geregeld en de continuïteit of beëindiging van
      het Schap is zeker gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
  - number: '25.1'
    text: Tot wijziging van de regeling wordt op voorstel van het algemeen bestuur besloten door de deelnemers.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Een wijziging van de regeling is tot stand gekomen, zodra het in het eerste lid bedoelde voorstel is aanvaard door
      de helft van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel25
  - number: '25.3'
    text: |-
      De wijziging treedt niet eerder in werking dan na de opname van het besluit tot wijziging in het register bedoeld
      in [artikel 27, tweede lid, Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
  - number: '26.1'
    text: |-
      De regeling wordt aangegaan voor een periode van tien jaar na inwerkingtreding. Het dagelijks bestuur brengt niet
      later dan twee jaar voorgaande aan het einde van deze periode een gemotiveerd advies uit aan het algemeen bestuur
      betreffende de noodzaak tot eventuele voortzetting van het schap en dienovereenkomstige wijziging van de regeling.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel26
  - number: '27.1'
    text: |-
      Tot opheffing van de regeling wordt op voorstel van het algemeen bestuur besloten door de raden van de deelnemende
      gemeenten en stadsdelen, provinciale staten en het algemeen bestuur van het waterschap en de Minister.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      Een besluit tot opheffing is tot stand gekomen zodra het in het eerste lid bedoelde voorstel is aanvaard door
      tenminste twee derde van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel27
  - number: '27.3'
    text: |-
      De opheffing gaat in een jaar na opname van het besluit tot opheffing in het register bedoeld in
      [artikel 27, tweede lid, Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
  - number: '27.4'
    text: |-
      Ingeval van opheffing van de regeling besluit het algemeen bestuur tot liquidatie en stelt hij daarvoor een
      liquidatieplan vast.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel27
  - number: '27.5'
    text: |-
      Zo nodig blijven de bestuursorganen van het Schap ook na het tijdstip van de opheffing in functie totdat de
      liquidatie is beëindigd.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel27
  - number: '28'
    text: |-
      De bij de [Wet gemeenschappelijke regelingen][ref1] voorgeschreven toezending van de regeling, alsmede de besluiten
      tot uittreding, wijziging of opheffing, geschiedt door de zorg van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '29'
    text: |-
      Deze regeling treedt in werking op de eerste dag van de maand na die waarin zij is opgenomen in het register
      bedoeld in [artikel 27, tweede lid, Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '27'
  - number: '30'
    text: Deze regeling kan worden aangehaald als ’Gemeenschappelijke regeling Schadeschap Luchthaven Schiphol’.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel30
