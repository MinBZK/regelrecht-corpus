  - number: 9.3g
    text: |-
      Voorts is het algemeen bestuur bij uitsluiting bevoegd ter zake van de behandeling van en de beslissing
      op een aanvraag om vergoeding van schade welke het gevolg is van rechtmatige besluiten of feitelijke
      handelingen van of in opdracht van een of meer van de deelnemers, welke verband houden met de [wet][ref1], het
      [Luchthavenindelingbesluit][ref2] of het [Luchthavenverkeerbesluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0014329
      [ref3]: https://wetten.overheid.nl/BWBR0014330
