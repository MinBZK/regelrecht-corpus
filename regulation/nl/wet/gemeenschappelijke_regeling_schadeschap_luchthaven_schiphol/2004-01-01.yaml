        hoofdstuk: III
  - number: 1.c
    text: 'de Minister: de Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel1
  - number: 1.d
    text: 'de provincie: de provincie Noord-Holland;'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel1
  - number: 1.e
    text: 'het waterschap: het waterschap Groot-Haarlemmermeer;'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel1
  - number: 1.f
    text: |-
      de deelnemers: de raden van de gemeenten Aalsmeer, Akersloot, Amstelveen, Alkemade, Amsterdam - alsmede de raden
      van de stadsdelen Osdorp, Buitenveldert, Geuzenveld-Slotermeer, Slotervaart/Overtoomseveld, Watergraafsmeer, Zuid
      en Zuid-Oost - Beverwijk, Haarlem, Haarlemmermeer, Haarlemmerliede en Spaarnwoude, Heemskerk, Jacobswoude, Liemeer,
      Ouder Amstel, Sassenheim, Uitgeest, Uithoorn, Velsen, Warmond, Zaanstad, de provinciale staten van de provincie
      Noord-Holland, het algemeen bestuur van het waterschap Groot-Haarlemmermeer en de Minister;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel1
  - number: 1.g
    text: |-
      de Planologische Kernbeslissing (PKB): De Planologische Kernbeslissing ’Schiphol en Omgeving’, deel 4, zoals
      goedgekeurd door de Staten-Generaal op 29 november 1995 (Hand. Tweede Kamer, 1994-1995, 23 552) en zoals luidend op
      19 februari 2003;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel1
  - number: 1.h
    text: |-
      de wet: [hoofdstuk 8 van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
