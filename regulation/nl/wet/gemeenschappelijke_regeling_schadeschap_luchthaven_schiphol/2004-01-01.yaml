        bwb_id: BWBR0014330
  - number: '3.1'
    text: 'Er is een rechtspersoonlijkheid bezittend openbaar lichaam genaamd: Schadeschap Luchthaven Schiphol.'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel3
  - number: '3.2'
    text: Het Schap is gevestigd in Hoofddorp (gemeente Haarlemmermeer).
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel3
  - number: '4'
    text: 'De bestuursorganen van het Schap zijn:'
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel4
  - number: 4.a
    text: het algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel4
  - number: 4.b
    text: het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel4
  - number: 4.c
    text: de voorzitter;
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel4
  - number: 4.d
    text: |-
      de besliscommissie, als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
  - number: '5.1'
    text: Het algemeen bestuur bestaat uit één en dertig leden.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.2'
    text: Twee leden van het algemeen bestuur worden door de Minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      De overige leden van het algemeen bestuur worden aangewezen door: - de raden, van de deelnemende gemeenten en
      stadsdelen, uit hun midden, de voorzitter van die raden inbegrepen;
        - de provinciale staten van de provincie, uit hun midden, de voorzitter van die staten inbegrepen;
        - het algemeen bestuur van het waterschap, uit zijn midden, de voorzitter van dat bestuur inbegrepen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.4'
    text: |-
      De leden van het algemeen bestuur, bedoeld in het derde lid, hebben elk een stem, met dien verstande dat het lid
      van de gemeente Aalsmeer, Amstelveen, Amsterdam, Haarlemmerliede en Spaarnwoude, Haarlemmermeer en Zaanstad een
      tweevoudige stem heeft. De leden, bedoeld in het tweede lid, hebben ieder een aantal stemmen dat de helft van het
      aantal stemmen dat de overige leden kunnen uitoefenen vertegenwoordigt, met dien verstande dat zij tezamen nooit
      meer stemmen kunnen uitoefenen dan de overige, aanwezige leden tezamen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.5'
    text: |-
      [Artikel 15, eerste lid, Gemeentewet][ref1]; [artikel 15, eerste lid, Provinciewet][ref2];
      [artikel 33, eerste lid, Waterschapswet][ref3] en[ X 8 Kieswet][ref4] zijn van overeenkomstige toepassing op de
      resp. leden, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '33'
      - id: ref4
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '5.6'
    text: De Minister kan een plaatsvervanger aanwijzen voor de door hem aangewezen leden van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.7'
    text: |-
      Elk der raden kan uit zijn midden een plaatsvervanger aanwijzen voor het door hem aangewezen lid van het algemeen
      bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.8'
    text: |-
      Provinciale staten kunnen uit hun midden een plaatsvervanger aanwijzen voor het door hen aangewezen lid van het
      algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.9'
    text: |-
      Het algemeen bestuur van het waterschap kan uit zijn midden een plaatsvervanger aanwijzen voor het door hem
      aangewezen lid van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
  - number: '5.10'
    text: |-
      Het ten aanzien van de leden bepaalde in de regeling, alsmede in de [Wet gemeenschappelijke regelingen][ref1], is
      van overeenkomstige toepassing op hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '6.1'
    text: De door de Minister benoemde leden van het algemeen bestuur worden benoemd voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      De leden, bedoeld in [artikel 5, derde lid][ref1], worden aangewezen voor een zittingsduur van vier jaar. Zij
      treden evenwel af op de dag waarop de zittings-periode van de gemeenteraad en stadsdeelraad resp. de provinciale
      staten en het algemeen bestuur van het waterschap, afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.3'
    text: |-
      De gemeenteraad en stadsdeelraad, resp. de provinciale staten en het algemeen bestuur van het waterschap besluiten
      in de eerste vergadering van elke zittingsperiode over de aanwijzing van het lid en zijn plaatsvervanger van het
      algemeen bestuur. Aftredende leden kunnen opnieuw als lid worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
  - number: '6.4'
    text: |-
      Een lid van het algemeen bestuur dat ophoudt lid of voorzitter van het bestuursorgaan te zijn dat hem als lid van
      het algemeen bestuur heeft aangewezen, houdt daarmee tevens op lid van het algemeen bestuur te zijn.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
  - number: '6.5'
    text: |-
      Een lid van het algemeen bestuur kan te allen tijde ontslag nemen. Hij deelt zijn ontslag mede aan
      het bestuursorgaan dat hem heeft aangewezen ([art. 5, lid 3][ref1]), onderscheidenlijk de Minister
      ([art. 5, lid 2][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.6'
    text: |-
      Indien tussentijds een plaats van een lid van het algemeen bestuur vacant of beschikbaar komt. wijst het
      betreffende bestuursorgaan ([art. 5, lid 3][ref1]) onderscheidenlijk de Minister ([art. 5,Iid 2)][ref2], ten
      spoedigste, doch in elk geval binnen twee maanden, een nieuw lid aan.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '6.7'
    text: |-
      Van elke aanwijzing of wijziging daarin doet het college van burgemeester en wethouders van de betreffende
      gemeente, het dagelijks bestuur van het stadsdeel, het college van gedeputeerde staten van de provincie of het
      dagelijks bestuur van het waterschap onderscheidenlijk de Minister schriftelijke mededeling aan het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het algemeen bestuur vergadert tenminste tweemaal per jaar en voorts zo dikwijls de voorzitter dit nodig oordeelt
      of tenminste drie leden zulks schriftelijk, onder opgave van de te behandelen onderwerpen, hebben verzocht. Een
      gelijk verzoekrecht komt toe aan de in [artikel 5, tweede lid][ref1], bedoelde leden.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
  - number: '7.2'
    text: |-
      Het algemeen bestuur besluit bij meerderheid van stemmen. Wordt over een voorstel geen stemming gevraagd, dan is
      het aangenomen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel7
  - number: '7.3'
    text: |-
      Staken de stemmen bij een stemming over personen tot wie de keuze door een voordracht is beperkt, dan wordt in
      dezelfde vergadering een herstemming gehouden. Staken de stemmen bij herstemming opnieuw, dan beslist terstond
      het lot.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel7
  - number: '7.4'
    text: |-
      Staken de stemmen bij een stemming over een ander onderwerp dan bedoeld in het derde lid, dan is het voorstel
      niet aangenomen. Is de vergadering niet voltallig, dan wordt bij staking van de stemmen het nemen van een besluit
      verdaagd tot een volgende vergadering. Staken de stemmen in deze volgende vergadering, ongeacht of deze voltallig
      is of niet, opnieuw dan is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel7
  - number: '7.5'
    text: |-
      Is een voorstel door staking van de stemmen niet aangenomen, dan wordt op een daartoe strekkend verzoek van het
      algemeen bestuur, bindend advies ingewonnen door een door de president van de rechtbank te Haarlem aan wijzen
      onafhankelijke en onpartijdige deskundige.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een lid van het algemeen bestuur is aan het bestuursorgaan dat hem als lid heeft aangewezen verantwoording
      verschuldigd voor de uitoefening van zijn lidmaatschap.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een lid van het algemeen bestuur kan door het bestuursorgaan, dat hem heeft aangewezen, worden ontslagen indien dit
      lid het vertrouwen van dat bestuursorgaan niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel8
  - number: '8.3'
    text: |-
      Op de procedure van het ontslag van een lid, bedoeld in [artikel 5, derde lid][ref1], zijn de [artikelen 49][ref2]
      en [50 van de Gemeentewet][ref3], de [artikelen 49][ref4] en [50 van de Provinciewet][ref5] en
      [artikel 41, vijfde lid van de Waterschapswet][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel50
      [ref6]: https://wetten.overheid.nl/BWBR0005108#Artikel41
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '5'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '49'
      - id: ref5
        bwb_id: BWBR0005645
        artikel: '50'
      - id: ref6
        bwb_id: BWBR0005108
        artikel: '41'
  - number: '8.4'
    text: |-
      Onverminderd [artikel 16, zesde lid, Wet gemeenschappelijke regelingen][ref1] geeft een lid van het algemeen
      bestuur mondeling of schriftelijk de door een of meer leden van het bestuursorgaan, onderscheidenlijk de Minister,
      die hem als lid heeft aangewezen, gevraagde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel16
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '16'
  - number: '8.5'
    text: Over al hetgeen het Schap betreft dient het algemeen bestuur de deelnemers desgevraagd van bericht en raad.
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur bij uitsluiting bevoegd ter zake
      van de behandeling van en de beslissing op een aanvraag om schadevergoeding als bedoeld in
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref2], doch uitsluitend voor zover deze aanvraag
      verband houdt met schade ten gevolge van de aanwijzingen bedoeld in de [artikelen 24][ref3], [26][ref4] en
      [27 van de Luchtvaartwet][ref5] ten behoeve van het luchtvaartterrein Schiphol (besluiten van de Minister van
      Verkeer en Waterstaat en de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 oktober
      1996, Stcrt. 1996, 211).


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel27
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009989
        artikel: '19'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '49'
      - id: ref3
