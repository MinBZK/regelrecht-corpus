  - number: 9.3a
    text: |-
      Onverminderd [artikel 19][ref1] is het algemeen bestuur voorts bij uitsluiting bevoegd ter zake van de behandeling
      van en de beslissing op een aanvraag om schadevergoeding op grond van artikel 21 van de aanwijzing van de Minister
      van Verkeer en Waterstaat, handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009989#Artikel19
    url: https://wetten.overheid.nl/BWBR0009989/2004-01-01#Artikel9
