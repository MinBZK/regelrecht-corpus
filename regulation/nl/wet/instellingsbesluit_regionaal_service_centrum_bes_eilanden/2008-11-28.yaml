preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit organisatie en formatie rijksdienst 2007;

    Besluit
  url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel1
  - number: 1.a
    text: '*BES-eilanden:* Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel1
  - number: 1.b
    text: |-
      *Centrum:* Regionaal Service Centrum als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024746#Artikel2
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024746
        artikel: '2'
  - number: '2'
    text: Er is een Regionaal Service Centrum, met vestigingen op Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel2
  - number: '3.1'
    text: Het Centrum staat onder leiding van een kwartiermaker.
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: '3.2'
    text: |-
      Het Centrum heeft tot taak een structurele bijdrage te leveren aan de uitvoering van (Rijks-)taken op de BES-
      eilanden.
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: '3.3'
    text: 'Binnen de in het tweede lid omschreven taak worden de volgende deeltaken onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: 3.3.a
    text: |-
      het optreden als loket voor taken die door Nederlandse instanties uitgevoerd worden of die door instanties van
      andere (ei)landen uitgevoerd worden;
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: 3.3.b
    text: het uitvoeren van taken in opdracht van Nederlandse departementen en (andere) overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: 3.3.c
    text: |-
      het bieden van huisvesting voor Nederlandse instanties die op de BES-eilanden zelf taken gaan uitvoeren en het
      bieden van bedrijfsvoeringondersteuning aan Nederlandse departementen en overheidsorganen, waaronder het vervullen
      van de rol van werkgever.
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 15 september 2008.
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Regionaal Service Centrum BES-eilanden.'
    url: https://wetten.overheid.nl/BWBR0024746/2008-11-28#Artikel5
