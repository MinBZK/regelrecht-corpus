  - number: 1.2.3.5
    text: |-
      Een aangeslotene die de meetverantwoordelijkheid voor zijn grootverbruikaansluiting(en) niet zelf uitoefent, draagt
      die meetverantwoordelijkheid over aan een in [1.2.3.1][ref1] bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.3.1
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.3.6
    text: |-
      Indien de aangeslotene bij ingebruikname van de grootverbruikaansluiting geen meetverantwoordelijke aanwijst,
      of indien de aangeslotene de netbeheerder hierom verzoekt, wijst de netbeheerder voor de aangeslotene een
      meetverantwoordelijke aan.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.6
  - number: 1.2.3.7
    text: |-
      Een aangeslotene die de meetverantwoordelijkheid voor zijn grootverbruikaansluiting(en) niet zelf uitoefent,
      machtigt een meetverantwoordelijke voor het opvragen van informatie uit het aansluitingenregister en het register
      als bedoeld in [paragraaf 13.4 van de Netcode elektriciteit][ref1] van de netbeheerder, betrekking hebbend op
      de grootverbruikaansluiting van de aangeslotene alsmede voor het afwikkelen van het proces van overdracht van
      meetverantwoordelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Paragraaf13.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037940
        paragraaf: '13.4'
  - number: 1.2.3.8
    text: |-
      In aanvulling op [artikel 1.2.3.5][ref1] wijzen de aangeslotenen op een offshore-platform met een aansluiting op
      het net op zee, en de beheerder van het desbetreffende offshore-platform, gezamenlijk één meetverantwoordelijke aan
      voor alle aansluitingen op het desbetreffende offshore-platform.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.3.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.3.5
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.4.1
    text: |-
      De eigenaar van de meetinrichting is gerechtigd vanaf tien werkdagen na de datum waarop de beheerovereenkomst
      afloopt (delen van) de meetinrichting te (laten) verwijderen. Hierbij dient de meetverantwoordelijke ervoor te
      zorgen dat het overdrachtspunt in goede en veilige toestand achter blijft.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.4.1
  - number: 1.2.4.2
    text: |-
      Ingeval tussen de aangeslotene en een andere meetverantwoordelijke binnen tien werkdagen na beëindiging van de
      oude beheerovereenkomst alsnog een beheerovereenkomst in werking treedt, wordt voor zover van toepassing vanaf dat
      moment de werkwijze volgens [4.6 van de Informatiecode elektriciteit en gas][ref1] gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.6
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: '4.6'
  - number: 1.2.4.3
    text: |-
      Indien niet voldaan wordt aan het gestelde in [1.2.4.2][ref1] wordt de grootverbruikaansluiting door de
      netbeheerder gedeactiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.4.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.4.2
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.1
    text: |-
      De vangnetregeling is van toepassing vanaf het moment dat de erkenning van de meetverantwoordelijke is ingetrokken
      tot het moment dat er voor de desbetreffende grootverbruikaansluiting een nieuwe meetverantwoordelijke is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.1
  - number: 1.2.5.2
    text: |-
      Aangeslotenen met een gecontracteerd transportvermogen groter dan 1 MW hebben tien werkdagen de tijd om een
      nieuwe meetverantwoordelijke aan te wijzen. De overige aangesloten hebben 40 werkdagen de tijd om een nieuwe
      meetverantwoordelijke aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.2
  - number: 1.2.5.3
    text: |-
      Indien de aangeslotene niet zelf binnen de in [1.2.5.2][ref1] genoemde termijn een nieuwe meetverantwoordelijke
      aanwijst, wijst de netbeheerder voor de aangeslotene een nieuwe meetverantwoordelijke aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.4
    text: |-
      Onverwijld nadat hij bericht heeft ontvangen van de intrekking van de erkenning meldt de netbeheerder de
      desbetreffende aangeslotene of diens gemachtigde schriftelijk of, indien het een aangeslotene betreft met een
      gecontracteerd transportvermogen groter dan 1 MW, bij aangetekende brief, dat:

      a. de erkenning van de door of namens hem aangewezen meetverantwoordelijke is ingetrokken;

      b. in verband met het intrekken van de erkenning van de door of namens de aangeslotene aangewezen
      meetverantwoordelijke de vangnetregeling in werking treedt;

      c. de aangeslotene verplicht is er alles aan te doen om te voorkomen dat zolang de vangnetregeling van toepassing
      is, de meetinrichting en de eventueel daarbij behorende communicatiemiddelen worden verwijderd of gewijzigd of niet
      meer functioneren of kunnen functioneren;

      d. de aangeslotene de gelegenheid heeft om binnen de in [1.2.5.2][ref1] genoemde termijn een nieuwe
      meetverantwoordelijke aan te wijzen;

      e. indien de aangeslotene niet zelf binnen de in [1.2.5.2][ref2] genoemde termijn een nieuwe meetverantwoordelijke
      aanwijst, de netbeheerder voor de aangeslotene een nieuwe meetverantwoordelijke aanwijst, waarbij de netbeheerder
      ten behoeve van de aangeslotene aangeeft wat de tarieven en voorwaarden zijn die door de door hem aan te wijzen
      meetverantwoordelijke worden gehanteerd, dan wel aangeeft op welke wijze deze tarieven en voorwaarden voor de
      aangeslotene toegankelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 1.2.5.2
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.5
    text: |-
      Zolang de vangnetregeling van toepassing is, worden de meetgegevens ten behoeve van de
      balanceringsverantwoordelijkheid voor grootverbruikaansluitingen met een telemetriegrootverbruikmeetinrichting,
      vastgesteld op basis van het jaarverbruik van de voorafgaande periode en een profiel.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.5
  - number: 1.2.5.6
    text: |-
      Voor aangeslotenen met een gecontracteerd transportvermogen groter dan 1 MW wordt het in [1.2.5.5][ref1] bedoelde
      profiel na overleg met de aangeslotene door de netbeheerder vastgesteld op basis van historische meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.5
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.7
    text: |-
      Voor aangeslotenen met een gecontracteerd transportvermogen kleiner dan of gelijk aan 1 MW en een
      grootverbruikaansluiting met een telemetriegrootverbruikmeetinrichting, wordt voor het in [1.2.5.5][ref1] bedoelde
      profiel gebruik gemaakt van een door de gezamenlijke netbeheerders en de BRP’s vooraf vastgesteld noodprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.5
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.8
    text: |-
      In afwijking van [1.2.5.6][ref1] en [1.2.5.7][ref2] treft de netbeheerder bij aangeslotenen met een
      telemetriegrootverbruikmeetinrichting, waarbij de verzameling van meetgegevens, zoals bedoeld in [5.3][ref3], en de
      overdracht van meetgegevens, zoals bedoeld in [paragraaf 6.2.2 van de Informatiecode elektriciteit en gas][ref4],
      ondanks de intrekking van de erkenning van de meetverantwoordelijke correct blijven functioneren, een regeling met
      de desbetreffende BRP om de desbetreffende meetgegevens te gebruiken zolang de vangnetregeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.6
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.7
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Paragraaf6.2.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.8
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.6
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 1.2.5.7
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0037946
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0037934
        paragraaf: 6.2.2
  - number: 1.2.5.9
    text: |-
      Zolang de vangnetregeling van toepassing is, is de meetverantwoordelijke wiens erkenning is ingetrokken,
      alsmede een eventuele beoogde nieuwe meetverantwoordelijke verplicht er alles aan te doen om te voorkomen dat de
      meetinrichting en de eventueel daarbij behorende communicatiemiddelen worden verwijderd of gewijzigd of niet meer
      functioneren of kunnen functioneren.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.9
  - number: 1.2.5.10
    text: |-
      In het geval de meetverantwoordelijke in faillissement verkeert of surseance van betaling is verleend, wijst de
      netbeheerder van het landelijk hoogspanningsnet de curator respectievelijk bewindvoerder op de verplichting zoals
      genoemd in [1.2.5.9][ref1]. Zo nodig stelt de netbeheerder van het landelijk hoogspanningsnet zich garant voor
      eventuele kosten hiervan, maximaal gedurende de periode dat de vangnetregeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.5.9
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.5.9
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.5.11
    text: |-
      Indien er, nadat de nieuwe meetverantwoordelijke is aangewezen, nog geen overdracht van meetgegevens kan plaats
      vinden zoals bedoeld in [paragraaf 6.2.2 van de Informatiecode elektriciteit en gas][ref1], kan voor een periode
      van maximaal tien werkdagen de procedure als bedoeld in [bijlage 5][ref2] worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf6.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: 6.2.2
      - id: ref2
        bwb_id: BWBR0037946
  - number: 1.2.5.12
    text: |-
      Indien er sprake is van een telemetriegrootverbruikmeetinrichting, stelt de nieuwe meetverantwoordelijke onverwijld
      vast wat de meterstanden zijn aan het begin en het einde van de periode waarop de vangnetregeling van toepassing is
      geweest, alsmede het verbruik gedurende die periode, en geeft deze door aan de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.12
  - number: 1.2.5.13
    text: |-
      Indien er sprake is van een kleinverbruikmeetinrichting of een profielgrootverbruikmeetinrichting en indien de
      verzameling van meetgegevens als bedoeld in [5.2.1][ref1] of [5.1.1][ref2] plaats zou moeten vinden in de periode
      waarin de vangnetregeling van toepassing is, wordt deze verzameling van meetgegevens opgeschort en vindt deze
      plaats binnen een maand nadat de nieuwe meetverantwoordelijke is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.5.13
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 2.1.1
    text: |-
      De bepalingen in [hoofdstuk 2][ref1] zijn van toepassing op comptabele meetinrichtingen:

      a. in het (de) overdrachtspunt(en) van een aansluiting tussen twee elektriciteitsnetten;

      b. in het (de) overdrachtspunt(en) van een aansluiting van een aangeslotene niet zijnde een netbeheerder;

      c. ten behoeve van een GCvO-installatie achter een aansluiting groter dan 3x80 A.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '2'
  - number: 2.2.1
    text: |-
      In het (de) overdrachtspunt(en) van een aansluiting tussen twee netten is een telemetriegrootverbruikmeetinrichting
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.2.1
  - number: 2.2.2
    text: |-
      Aan een telemetriegrootverbruikmeetinrichting op een overdrachtspunt van een aansluiting tussen een net en
      het landelijk hoogspanningsnet, zoals bedoeld in [artikel 2.2.1][ref1], wordt voor een overdrachtspunt van
      een dergelijke aansluiting, zoals bedoeld in [artikel 15.3, eerste lid, van de Netcode elektriciteit][ref2],
      gelijk gesteld een comptabele meetinrichting die gebruik maakt van niet voor comptabele doeleinden
      geïnstalleerde meettransformatoren aan de hoogspanningszijde waarbij de nauwkeurigheid met inachtneming van
      [artikel 4.3.2.2][ref3] wordt verbeterd door toepassing van digitale foutcorrectie en digitale plaatscorrectie.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel15.3
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.2.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '15.3'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 4.3.2.2
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.3.1
    text: |-
      In het (de) overdrachtspunt(en) van een kleinverbruikaansluiting is een niet op afstand uitleesbare
      kleinverbruikmeetinrichting of een op afstand uitleesbare kleinverbruikmeetinrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.3.1
  - number: 2.4.1
    text: |-
      In het (de) overdrachtspunt(en) van een aansluiting groter dan 3x80A is een telemetriegrootverbruikmeetinrichting
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.4.1
  - number: 2.4.2
    text: |-
      a. In afwijking van [2.4.1][ref1] kan in het (de) overdrachtspunt(en) van een aansluiting groter dan 3x80A met
      een gecontracteerd transportvermogen minder dan 0,1 MW, een profielgrootverbruikmeetinrichting aanwezig zijn tot
      uiterlijk 31 december 2025.

      b. In afwijking van [2.4.1][ref2] kan in het (de) overdrachtspunt(en) van een artikel-1-lid-2-of-3-aansluiting,
      kleiner dan of gelijk aan 3x80A een profielgrootverbruikmeetinrichting aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.4.1
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 2.4.1
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.3
    text: |-
      Blindenergie wordt niet gemeten bij aansluitingen waarvan het gecontracteerd transportvermogen minder dan 0,1 MW
      bedraagt en de aansluiting alleen wordt gebruikt voor het afnemen van elektrische energie uit het net.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.4.3
  - number: 2.4.4
    text: |-
      Bij aansluitingen met een gecontracteerd transportvermogen van meer dan 0,1 MW en bij aansluitingen die worden
      gebruikt voor het leveren van energie aan het net wordt blindenergie gemeten als vanwege de aard van de aangesloten
      belasting kan worden verwacht dat de arbeidsfactor op de aansluiting lager kan worden dan de op grond van de
      [artikelen 2.27][ref1] en [3.15, eerste lid van de Netcode elektriciteit][ref2] van toepassing zijnde waarde. De
      meetinrichting is in dat geval uitgerust met één of meer kvarh- meters, waarmee per aansluiting het aantal kvarh
      per maand wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.27
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel3.15
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.27'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '3.15'
  - number: 2.4.5
    text: |-
      kWmax wordt gemeten op alle overdrachtspunten van grootverbruikaansluitingen waar op grond van
      [3.7 van de Tarievencode elektriciteit][ref1] de kWmax één van de tariefdragers is.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Paragraaf3.7
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037951
        paragraaf: '3.7'
  - number: 2.5.1
    text: Bij een GCvO installatie is een productiemeetinrichting vereist.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.5.1
  - number: 2.6.1
    text: |-
      De meterbeheerder van een meetinrichting in het (de) overdrachtspunt(en) van een aansluiting tussen twee netten
      is een door de beide netbeheerders aangewezen meetverantwoordelijke, tenzij één van beide netten een gesloten
      distributiesysteem is. In dat geval is het een door de beheerder van het gesloten distributiesysteem aangewezen
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.6.1
  - number: 2.6.2
    text: De meterbeheerder van een meetinrichting van een kleinverbruikaansluiting is de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.6.2
  - number: 2.6.3
    text: De meterbeheerder van een meetinrichting van een grootverbruikaansluiting is de meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.6.3
  - number: 2.6.4
    text: |-
      De netbeheerder beheert het eventueel aanwezige primaire deel van de meetinrichting tenzij de netbeheerder en de
      aangeslotene anders zijn overeengekomen. Dit is ook van toepassing op de meetinrichting bij een “MS- aansluiting
      met meting op LS”, zoals bedoeld in [bijlage A5 van de Tarievencode elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037951
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
  - number: 2.6.5
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend op grond van [artikel 2.9 van de Netcode
      elektriciteit](onbekend), wijst in afwijking van [artikel 2.6.4][ref1] de aangeslotene een beheerder aan voor het
      eventueel aanwezige primaire deel van de meetinrichting, als bedoeld in artikel 2.9, onderdeel g, van de Netcode
      elektriciteit. De aangeslotene draagt er zorg voor dat deze aangewezen beheerder jegens de meetverantwoordelijke
      voldoet aan de in [paragraaf 4.3.2][ref2] van de Meetcode elektriciteit genoemde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.6.4
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel2.6.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.6.4
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037946
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 3.1.1
    text: |-
      Er is sprake van een prioriteitsplaatsing indien de aangeslotene op zijn verzoek of op verzoek van een derde ten
      behoeve van zijn kleinverbruikaansluiting – voorafgaande aan de collectieve uitrol van op afstand uitleesbare
      kleinverbruikmeetinrichtingen in de desbetreffende wijk – de beschikking krijgt over een door of namens de
      netbeheerder geplaatste op afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      Indien de aangeslotene dit verzoekt, komt hij in aanmerking voor een prioriteitsplaatsing. Voor de aanvraag van een
      prioriteitsplaatsing is [paragraaf 3.2][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.1.3
    text: |-
      Er is sprake van een plaatsing door derden van een op afstand uitleesbare kleinverbruikmeetinrichting indien een
      aangeslotene ten behoeve van zijn kleinverbruikaansluiting de beschikking krijgt over een door een meterplaatser
      geplaatste op afstand uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      Voor het op verzoek van de aangeslotene door een ander dan de netbeheerder ter beschikking stellen van een door
      de netbeheerder te leveren op afstand uitleesbare kleinverbruikmeetinrichting, is [paragraaf 3.3][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.1.5
    text: |-
      Voor het op verzoek van de aangeslotene door een ander dan de netbeheerder ter beschikking stellen van een niet
      door de netbeheerder te leveren op afstand uitleesbare kleinverbruikmeetinrichting, is [paragraaf 3.4][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.2.1
    text: |-
      Indien de aangeslotene of een derde een prioriteitsplaatsing wenst, geeft de aangeslotene of diens gemachtigde de
      netbeheerder opdracht voor een prioriteitsplaatsing en verstrekt daarbij de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. correspondentieadres en gegevens voor facturering van de kosten voor de prioriteitsplaatsing.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      De netbeheerder controleert of:

      a. de melding aan de juiste netbeheerder is gedaan;

      b. het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      d. plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de netbeheerder;

      e. voor zover dit op afstand is te bepalen: of plaatsing van de meter technisch mogelijk is;

      f. voor zover dit op afstand is te bepalen: of plaatsing van de meter financieel redelijk is en of dit in
      verhouding staat tot potentiële energiebesparingen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      Het resultaat van de in [3.2.2][ref1] genoemde vaststelling wordt binnen 5 werkdagen na de in [3.2.1][ref2]
      bedoelde aanvraag meegedeeld aan de aangeslotene. Indien niet aan alle in [3.2.2][ref3] genoemde criteria wordt
      voldaan, wordt de procedure prioriteitsplaatsing gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel3.2.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.4
    text: |-
      De netbeheerder neemt binnen 3 maanden na de in [3.2.1][ref1] bedoelde aanvraag de oude meetinrichting weg en
      plaatst de nieuwe op afstand uitleesbare kleinverbruikmeetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.5
    text: |-
      De in 3.2.4 genoemde verplichting van de netbeheerder vervalt indien het niet lukt om in de in [3.2.4][ref1]
      genoemde periode een afspraak over de plaatsing te maken met de aangeslotene of indien de aangeslotene zich niet
      houdt aan de gemaakte afspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.2.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.2.4
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.6
    text: |-
      Nadat geconstateerd is dat de nieuwe meetinrichting gedurende 5 aaneengesloten dagen op afstand uitleesbaar is,
      wordt de aanwezigheid van de op afstand uitleesbare kleinverbruikmeetinrichting door de netbeheerder verwerkt in
      zijn aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.2.6
  - number: 3.3.1
    text: |-
      Een ander dan de netbeheerder die op verzoek van de aangeslotene, conform
      [artikel 26ae, zevende lid, van de Elektriciteitswet 1998][ref1], er zorg voor draagt dat de aangeslotene beschikt
      over een op afstand uitleesbare kleinverbruikmeetinrichting meldt de voorgenomen plaatsing van een door de
      netbeheerder te leveren op afstand uitleesbare kleinverbruikmeetinrichting aan de netbeheerder en verstrekt daarbij
      de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. naam en contactgegevens van de meterplaatser;

      d. naam en contactgegevens van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26ae
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26ae
  - number: 3.3.2
    text: |-
      De netbeheerder controleert of:

      a. de melding aan de juiste netbeheerder is gedaan;

      b. het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      d. plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de netbeheerder;

      e. de meterplaatser is erkend.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.2
  - number: 3.3.3
    text: |-
      Het resultaat van de in [artikel 3.3.2][ref1] genoemde vaststelling wordt binnen vijf werkdagen na de in
      [artikel 3.3.1][ref2] bedoelde melding door de netbeheerder meegedeeld aan de ander dan de netbeheerder die op
      verzoek van de aangeslotene conform [artikel 26ae, zevende lid, van de Elektriciteitswet 1998][ref3], er zorg voor
      draagt dat de aangeslotene beschikt over een op afstand uitleesbare kleinverbruikmeetinrichting. Indien niet aan
      alle in artikel 3.3.2 genoemde criteria wordt voldaan, wordt de procedure plaatsing door derden van een door de
      netbeheerder geleverde meetinrichting gestopt door de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel26ae
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.2
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 26ae
  - number: 3.3.4
    text: |-
      De meterplaatser neemt binnen vijftien werkdagen na de in [3.3.3][ref1] bedoelde melding contact op met
      de netbeheerder voor het maken van afspraken over de datum en het tijdstip van de verwijdering van de oude
      meetinrichting en plaatsing van de nieuwe meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.3
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5
    text: |-
      De netbeheerder verstrekt uiterlijk vijf werkdagen voor de conform [3.3.4][ref1] geplande plaatsing:

      a. de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting met de daarbij behorende gebruiks-, montage-
      en transportinstructies

      b. de meterwisselgegevens:

        - het meternummer van de huidige meetinrichting;
        - de marge waarbinnen de tellerstand(en) van de huidige meetinrichting moeten liggen ten tijde van de plaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.4
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.6
    text: |-
      De meterplaatser controleert of de vastgelegde tellerstanden van de oude meetinrichting zich binnen de in
      [3.3.5][ref1] bedoelde marge bevinden en of het meternummer van de oude meetinrichting klopt. Indien dat niet het
      geval is, neemt de meterplaatser contact op met de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.5
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.7
    text: |-
      De meterplaatser neemt de oude meetinrichting weg en plaatst de door de netbeheerder verstrekte op afstand
      uitleesbare kleinverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.7
  - number: 3.3.8
    text: |-
      De meterplaatser legt ter plekke vast:

      a. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting

      b. de datum van de meterwisseling

      c. het meternummer en de tellerstand(en) van de oude meetinrichting

      d. het meternummer en de tellerstand(en) van de nieuwe meetinrichting en laat de aangeslotene met het plaatsen van
      zijn/haar handtekening verklaren dat hij/zij akkoord gaat met bovengenoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.8
  - number: 3.3.9
    text: |-
      Indien de aangeslotene niet verklaart dat de tellerstand(en) van de oude meetinrichting juist zijn, zorgt de
      meterplaatser voor een foto met tellerstanden en meternummer.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.9
  - number: 3.3.10
    text: |-
      De meterplaatser verzendt de in 3.3.8 genoemde gegevens binnen één werkdag na de dag van plaatsing in een door de
      gezamenlijke netbeheerders opgesteld format voor elektronische gegevensuitwisseling aan de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.10
  - number: 3.3.11
    text: |-
      De meterplaatser levert de oude meetinrichting conform de in [3.3.4][ref1] genoemde afspraken af bij de
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.11
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.4
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.12
    text: |-
      De netbeheerder controleert of de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand uitleesbaar
      is. Indien dit niet het geval is wordt de meterplaatser in de gelegenheid gesteld om het probleem uiterlijk binnen
      tien werkdagen op te lossen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.12
  - number: 3.3.13
    text: |-
      Nadat geconstateerd is dat de nieuwe meetinrichting gedurende vijf aaneengesloten dagen op afstand uitleesbaar
      is, wordt de plaatsing geaccepteerd door de netbeheerder en wordt de aanwezigheid van de op afstand uitleesbare
      kleinverbruikmeetinrichting door de netbeheerder verwerkt in zijn aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.13
  - number: 3.3.14
    text: |-
      De netbeheerder neemt, na acceptatie, de nieuw geplaatste op afstand uitleesbare kleinverbruikmeetinrichting in
      beheer en betaalt de bij of krachtens de [Elektriciteitswet 1998][ref1] daartoe vastgestelde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.14
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 3.3.15
    text: |-
      De netbeheerder bewaart de op grond van [3.3.10][ref1] ontvangen gegevens tenminste twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.3.10
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.3.15
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 3.3.10
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.1
    text: |-
      Een ander dan de netbeheerder die op verzoek van de aangeslotene conform
      [artikel 26ae, zevende lid, van de Elektriciteitswet 1998][ref1], er zorg voor draagt dat de aangeslotene beschikt
      over een op afstand uitleesbare kleinverbruikmeetinrichting meldt de voorgenomen plaatsing van een niet door de
      netbeheerder geleverde op afstand uitleesbare kleinverbruikmeetinrichting aan de netbeheerder en verstrekt daarbij
      de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting;

      c. naam en contactgegevens van de meterplaatser;

      d. merk en type-aanduiding van de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting;

      e. naam en contactgegevens van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26ae
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26ae
  - number: 3.4.2
    text: |-
      De netbeheerder controleert of:

      a. de melding aan de juiste netbeheerder is gedaan;

      b. het een aansluiting betreft die in aanmerking komt voor plaatsing van een op afstand uitleesbare
      kleinverbruikmeetinrichting;

      c. er op de desbetreffende aansluiting nog geen op afstand uitleesbare kleinverbruikmeetinrichting is geplaatst;

      d. plaatsing van de meter op het adres niet binnen drie maanden is ingepland door de netbeheerder;

      e. de meterplaatser erkend is;

      f. de te plaatsen op afstand uitleesbare kleinverbruikmeetinrichting voldoet aan de bij of krachtens de in het
      [Besluit op afstand uitleesbare meetinrichtingen][ref1] gestelde eisen en of deze meetinrichting informatie
      kan uitwisselen met (het informatiesysteem van) de netbeheerder zonder dat dit specifieke aanpassingen aan het
      informatie- c.q. uitleessysteem van de betreffende netbeheerder behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030605
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.4.2
