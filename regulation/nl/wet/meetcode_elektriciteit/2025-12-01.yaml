  text: |-
    Gelet op artikel 36 van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Deze code bevat de voorwaarden zoals bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: 1.1.3
    text: |-
      Meetinrichtingen voldoen ten minste aan de daaraan in of krachtens de wet gestelde eisen. Ingeval van strijdigheid
      tussen een dwingende wettelijke eis en een eis uit deze code, geldt de dwingende wettelijke eis.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.1.3
  - number: 1.1.4
    text: |-
      Voor de toepassing van deze code gelden de begrippen en bijbehorende begripsbepalingen uit de
      [Begrippencode elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: 1.1.5
    text: |-
      In zoverre een meetinrichting onder de [Metrologiewet][ref1] valt, is deze code niet van toepassing ten aanzien van
      een onderwerp dat voor die meetinrichting in de Metrologiewet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.1.6
    text: |-
      Waar in deze code ‘gecontracteerd transportvermogen’ staat, wordt per aansluiting de hoogste waarde van het
      gecontracteerd transportvermogen voor afname of het gecontracteerd transportvermogen voor invoeding bedoeld, tenzij
      één van beide specifiek is aangeduid.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.1.6
  - number: 1.2.1.1
    text: |-
      De meterbeheerder participeert in het door de toezichthouder op de [Metrologiewet][ref1] goedgekeurde systeem van
      systematische (steekproefsgewijze) periodieke controle van in gebruik zijnde meters zoals uitgevoerd in opdracht
      van de deelnemende meterbeheerders gezamenlijk of toont aan op andere, ter beoordeling van de toezichthouder op de
      Metrologiewet, aanvaardbare gelijkwaardige wijze te voorzien in een dergelijke controle.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.2.2.1
    text: |-
      Het deel van de op afstand uitleesbare kleinverbruikmeetinrichting dat geplaatst moet worden bij de aansluiting,
      wordt geplaatst door een meterplaatser die is erkend conform [bijlage 4][ref1], of door de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 1.2.2.2
    text: |-
      De netbeheerder verstrekt aan de meterplaatser op diens verzoek:

        - de bedrijfsspecifieke informatie die nodig is voor het uitvoeren van werkzaamheden, aan of in de onmiddellijke
      nabijheid van de aansluiting, die verband houden met de plaatsing van meetinrichtingen;
        - het recht om verzegelingen die door of vanwege de netbeheerder zijn aangebracht te schenden of verbreken indien
      dit noodzakelijk is voor het uitvoeren van werkzaamheden aan of in de onmiddellijke nabijheid van de aansluiting,
      die verband houden met de plaatsing van meetinrichtingen.
        - het recht om namens de netbeheerder verzegelingen aan te brengen conform de in [4.1.2][ref1] genoemde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 1.2.3.1
    text: |-
      Tot het uitoefenen van meetverantwoordelijkheid voor een grootverbruikaansluiting zijn slechts personen toegelaten
      die hiervoor conform [bijlage 4][ref1] zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 1.2.3.2
    text: |-
      Per grootverbruikaansluiting is er één meetverantwoordelijke voor alle uit de [hoofdstukken 4][ref1], [5][ref2] en
      [6][ref3] voortvloeiende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel1.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037946
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0037946
        hoofdstuk: '6'
  - number: 1.2.3.3
    text: |-
      Indien de meetinrichting, bedoeld in [2.1.1 sub c][ref1] tevens gebruikt wordt ten behoeve van de uitvoering van
      de [Regeling kooldioxide-index warmtekrachtkoppeling][ref2], kan, in afwijking van [1.2.3.2][ref3], voor deze
      meetinrichting een andere meetverantwoordelijke, hierna te noemen het MEP-meetbedrijf, worden aangewezen dan de
      meetverantwoordelijke die op grond van 1.2.3.2 als meetverantwoordelijke voor de grootverbruikaansluiting van de
      desbetreffende aangeslotene in het aansluitingenregister van de netbeheerder staat geregistreerd, onder voorwaarde
      dat:

      a. het MEP-meetbedrijf hetzelfde is als het meetbedrijf dat verantwoordelijk is voor de niet-elektrische metingen
      ten behoeve van de kooldioxideindexbepaling;

      b. er achter een grootverbruikaansluiting slechts één MEP-meetbedrijf actief is;

      c. het MEP-meetbedrijf de verantwoordelijkheid op zich neemt voor alle werkzaamheden die op grond van de
      [hoofdstukken 4][ref4], [5][ref5] en [6][ref6] ten aanzien van de in [2.1.1 sub c][ref7] bedoelde meetinrichting
      nodig zijn, met dien verstande dat hij de technische gegevens van de desbetreffende meetinrichting alsmede
      de meetgegevens van de desbetreffende meetinrichting ter beschikking stelt aan de op de desbetreffende
      grootverbruikaansluiting acterende meetverantwoordelijke in plaats van aan de netbeheerder;

      d. de meetverantwoordelijke op de desbetreffende aansluiting verantwoordelijk blijft voor de alle werkzaamheden
      die op grond van de [hoofdstukken 4][ref8], [5][ref9] en [6][ref10] ten aanzien van de in [2.1.1 sub b][ref11]
      bedoelde meetinrichting nodig zijn, met dien verstande dat hij daarnaast de in het voorgaande lid bedoelde
      technische gegevens vastlegt in zijn meterregister en de meetgegevens afkomstig van de meetinrichting, bedoeld in
      2.1.1 sub c van het MEP-meetbedrijf accepteert en ongewijzigd doorgeeft aan de netbeheerder;

      e. de meetverantwoordelijke geeft de meetgegevens, bedoeld in
      [artikel 3, lid 1 van de Regeling certificaten warmtekrachtkoppeling][ref12] door aan de netbeheerder;

      f. het MEP-meetbedrijf verricht de in
      [artikel 2a, lid 2, onderdeel c van de Regeling certificaten warmtekrachtkoppeling][ref13] bedoelde verificatie van
      het meetrapport.


