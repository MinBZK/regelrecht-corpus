    text: |-
      De meterplaatser levert de oude meetinrichting conform de in [3.4.4][ref1] genoemde afspraken af bij de
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.4
