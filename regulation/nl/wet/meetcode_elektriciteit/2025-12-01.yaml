  - number: 4.1.1.1
    text: |-
      De capaciteit, het ontwerp en de aanleg van de meetinrichting, met inbegrip van het primaire deel van de
      meetinrichting, zijn in overeenstemming met het op de desbetreffende aansluiting gecontracteerde transportvermogen,
      dan wel met de doorlaatwaarden van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.1.1
  - number: 4.1.1.2
    text: De meetinrichting wordt zodanig onderhouden, dat zij voortdurend aan de in deze code opgenomen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.1.2
  - number: 4.1.2.1
    text: |-
      Onverminderd de verzegelingen op grond van de [Metrologiewet][ref1] wordt de meetinrichting door de meterbeheerder
      zodanig verzegeld dat niet in de meetinrichting kan worden ingegrepen zonder de verzegeling te verbreken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 4.1.2.2
    text: |-
      De verzegeling bestaat uit een hardwarematige en/of een daaraan gelijkwaardige softwarematige verzegeling.
      Softwarematige verzegelingen worden tenminste eenmaal per twee jaar gewijzigd.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.2.2
  - number: 4.1.2.3
    text: |-
      De hardwarematige zegels dragen een kenmerk van de meterbeheerder en de functionaris die het zegel heeft
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.2.3
  - number: 4.1.2.4
    text: |-
      De meterbeheerder heeft een zegeladministratie en een schriftelijke instructie voor het gebruik van zegels. Indien
      het gebruikte type zegels vereist dat de meterbeheerder een zegeltang gebruikt, heeft de meterbeheerder tevens een
      zegeltangadministratie en een schriftelijke instructie voor het gebruik van zegeltangen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.2.4
  - number: 4.1.2.5
    text: |-
      Verzegelingen die door of vanwege de meterbeheerder zijn aangebracht op de meetinrichting worden niet geschonden of
      verbroken tenzij de meterbeheerder uitdrukkelijk toestemming geeft tot het verbreken van de verzegeling.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.1.2.5
  - number: 4.2.1.1
    text: |-
      De niet op afstand uitleesbare kleinverbruikmeetinrichting geeft de tellerstanden weer voor één of twee
      telwerken (enkeltelwerk respectievelijk normaaltelwerk en laagtelwerk) per energierichting met bijbehorende
      vermenigvuldigingsfactoren.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.2.1.1
  - number: 4.2.1.2
    text: |-
      Indien bij een aansluiting kleiner dan of gelijk aan 3x80A op laagspanningsniveau op het moment van
      inwerkingtreding van deze bepaling een Ferrarismeter met of zonder terugloopblokkering dan wel een elektronische
      éénrichtingmeter aanwezig is, en er op de desbetreffende aansluiting op enig moment sprake is van zowel levering
      als teruglevering van elektriciteit, is het, in afwijking van [4.2.1.1][ref1], toegestaan deze Ferrarismeter met
      of zonder terugloopblokkering dan wel een elektronische meetinrichting geschikt voor één richting toe te passen tot
      het moment dat de desbetreffende meetinrichting vervangen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.2.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.2.1.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.2.1
    text: |-
      De op afstand uitleesbare kleinverbruikmeetinrichting voldoet aan de op het moment van plaatsing geldende versie
      van het [Besluit op afstand uitleesbare meetinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030605
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0030605
  - number: 4.2.3.1
    text: |-
      Een storing in de gegevensoverdracht vanuit de op afstand uitleesbare meetinrichting wordt zo spoedig mogelijk,
      doch uiterlijk binnen twee maanden nadat de storing door de netbeheerder is gesignaleerd, verholpen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.2.3.1
  - number: 4.2.3.2
    text: |-
      Een storing in het meetgedeelte van de meetinrichting wordt zo spoedig mogelijk, doch uiterlijk binnen tien
      werkdagen, nadat de storing is gesignaleerd door de netbeheerder, verholpen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.2.3.2
  - number: 4.3.1.1
    text: |-
      De netbeheerder verleent een namens de meetverantwoordelijke opererende medewerker toegang tot het primaire
      deel en het secundaire deel van de meetinrichting in een aan de netbeheerder ter beschikking staande ruimte. De
      netbeheerder verleent deze toegang door:

      a. het verstrekken van een op naam gestelde aanwijzing en een sleutel aan de medewerker van de
      meetverantwoordelijke, of

      b. het op kosten van de meetverantwoordelijke, in onderling overleg binnen vijf werkdagen na ontvangst van het
      verzoek om toegang, begeleiden van de medewerker van de meetverantwoordelijke door een bevoegde medewerker van de
      netbeheerder, of

      c. het (laten) plaatsen van alle essentiële onderdelen van de meetinrichting in een voor de meetverantwoordelijke
      vrij toegankelijke ruimte.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.1.1
  - number: 4.3.1.2
    text: |-
      Bij nieuw aan te leggen aansluitingen worden alle essentiële onderdelen van de meetinrichting in een voor de
      meetverantwoordelijke vrij toegankelijke ruimte geplaatst, tenzij de netbeheerder en de aangeslotene gezamenlijk
      anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.1.2
  - number: 4.3.1.3
    text: |-
      Indien de meetinrichting zich niet op het overdrachtspunt van de aansluiting bevindt, informeert de netbeheerder
      de meetverantwoordelijke over de afspraken die gemaakt zijn tussen de netbeheerder en de aangeslotene over de
      vermenigvuldigingsfactor voor het energieverlies tussen de meetinrichting en het overdrachtspunt.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.1.3
  - number: 4.3.1.4
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend op grond van [artikel 2.9 van de Netcode
      elektriciteit](onbekend) zorgt de op grond van [artikel 2.6.5][ref1] aangewezen beheerder ervoor dat de capaciteit,
      het ontwerp en de aanleg van de meetinrichting ten behoeve van het secundaire allocatiepunt, met inbegrip van
      het primaire deel van de meetinrichting, in overeenstemming zijn met de doorlaatwaarde van het betreffende
      allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.6.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.6.5
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.3.2.1
    text: |-
      Bij nieuw aan te leggen aansluitingen voldoet het primaire deel van de meetinrichting aan de eisen gesteld in
      [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.2.2
    text: |-
      Bij bestaande aansluitingen voldoet het primaire deel van de meetinrichting aan de eisen gesteld in
      [bijlage 3][ref1], tenzij tussen de netbeheerder en de aangeslotene en/of de meetverantwoordelijke anders is
      overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.2.3
    text: |-
      Bij meting aan laagspanningszijde van de MS/LS-transformator zorgt de beheerder van het primaire deel
      van de meetinrichting voor aansluitklemmen in de spannings- en stroomcircuits waarop het secundaire deel
      van de meetinrichting kan worden aangesloten. De smeltveiligheden (inclusief de zekeringhouder) in de
      spanningsmeetcircuits maken onderdeel uit van het primaire deel van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.3
  - number: 4.3.2.4
    text: |-
      De beheerder van het primaire deel van de meetinrichting informeert de meetverantwoordelijke en desgewenst de
      aangeslotene omtrent het primaire deel van de meetinrichting. Dit betreft voor zover van toepassing de volgende
      gegevens:

      a. de EAN-code van de aansluiting waar de meetinrichting bij hoort;

      b. de actuele waarde van het op de aansluiting gecontracteerde transportvermogen dan wel het vermogen dat
      overeenkomt met de actuele doorlaatwaarde van de aansluiting (uitgedrukt in kW);

      c. de overzetverhouding, de nauwkeurigheidsklasse, het nominaal vermogen en voorzover bekend fabrikaat, type en
      apparaatnummer van de spanningstransformatoren;

      d. de overzetverhouding, de nauwkeurigheidsklasse, het nominaal vermogen, de instrumentsveiligheidsfactor (Fs) en
      voorzover bekend fabrikaat, type en apparaatnummer van de stroomtransformatoren;

      e. plaats, soort en waarde van de smeltveiligheden in het primaire circuit van de spanningstransformatoren;

      f. de schakeling van de meettransformatoren (drieleider, vierleider, open V-schakeling, geaard of zwevend sterpunt,
      enz.).
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.4
  - number: 4.3.2.5
    text: |-
      De beheerder van het primaire deel van de meetinrichting verhelpt storingen in het primaire deel van de
      meetinrichting zo spoedig mogelijk, doch in principe uiterlijk binnen twee werkdagen nadat de storing aan hem is
      gemeld door de meetverantwoordelijke of op andere wijze is opgemerkt.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.5
  - number: 4.3.2.6
    text: |-
      Indien een oplossing binnen twee werkdagen niet mogelijk is, ontvangen de aangeslotene en de meetverantwoordelijke
      binnen twee werkdagen bericht binnen welke termijn de storing zal zijn verholpen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.6
  - number: 4.3.2.7
    text: |-
      Het primaire deel van de meetinrichting wordt zodanig onderhouden, dat het voortdurend aan de in deze code
      opgenomen eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.7
  - number: 4.3.2.8
    text: |-
      De beheerder van het primaire deel van de meetinrichting meldt de aangeslotene en de meetverantwoordelijke de
      voorgenomen verwisseling of wijziging van het primaire deel van de meetinrichting. De beheerder van het primaire
      deel van de meetinrichting verstrekt de meetverantwoordelijke de volgende gegevens:

      a. de EAN-code van de aansluiting waar de meetinrichting bij hoort,

      b. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting,

      c. het meetveld,

      d. de datum van verwisseling of wijziging,

      e. de reden van verwisseling of wijziging,

      f. de technische gegevens van de huidige meettransformatoren,

      g. de technische gegevens van de nieuwe meettransformatoren,

      h. voor zover bekend de apparaatnummers van de huidige en van de nieuwe meettransformatoren,

      i. het gecontracteerde transportvermogen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.8
  - number: 4.3.2.9
    text: |-
      Tussen de in [4.3.2.8][ref1] bedoelde melding en de daadwerkelijke verwisseling verstrijkt ten minste een
      periode van tien werkdagen. De meetverantwoordelijke gaat na of de voorgenomen verwisseling een aanpassing van de
      meetinrichting noodzakelijk maakt. Mocht dit het geval zijn, dan spreekt de meetverantwoordelijke, uiterlijk de
      vijfde werkdag na de in 4.3.2.8 bedoelde melding, zo nodig een latere datum af waarop de meettransformatoren worden
      verwisseld en tegelijkertijd de meetinrichting wordt aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.2.8
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.2.8
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.10
    text: |-
      Voor aanvang van de werkzaamheden meldt de beheerder van het primaire deel van de meetinrichting aan de
      aangeslotene en de meetverantwoordelijke het tijdstip waarop de meetinrichting uit bedrijf gaat. Indien de
      meetverantwoordelijke hierom verzoekt, geeft de beheerder van het primaire deel van de meetinrichting tevens de
      momentane tellerstanden door.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.10
  - number: 4.3.2.11
    text: |-
      Na voltooiing van de werkzaamheden meldt de beheerder van het primaire deel van de meetinrichting dit aan de
      meetverantwoordelijke. Ingeval het een telemetriegrootverbruikmeetinrichting betreft, test de meetverantwoordelijke
      de communicatie op goede werking; na akkoordbevinding daarvan kan de beheerder van het primaire deel van de
      meetinrichting de werkzaamheden beëindigen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.2.11
  - number: 4.3.3.1
    text: |-
      De meetverantwoordelijke legt, voor zover van toepassing, de volgende gegevens van elke door hem beheerde
      meetinrichting vast in een meterregister en houdt deze gegevens actueel:

      a. de EAN-code van de aansluiting waar de meetinrichting bij hoort;

      b. van elk in gebruik zijnd telwerk:

        - het nummer van de meter waarvan het telwerk deel uitmaakt,
        - de omschrijving van de te meten grootheid,
        - de vermenigvuldigingsfactor,
        - het aantal posities voor de komma,
        - de stand op het moment van ingebruikname en
        - de datum en het tijdstip van ingebruikname;

      c. van elk gedurende de afgelopen drie jaar buiten gebruik gesteld telwerk:

        - het nummer van de meter waarvan het telwerk deel uit maakte,
        - de omschrijving van de te meten grootheid,
        - de vermenigvuldigingsfactor,
        - het aantal posities voor de komma,
        - de stand op het moment van ingebruikname,
        - de datum en het tijdstip van ingebruikname,
        - de stand op het moment van buitengebruikstelling,
        - de datum en het tijdstip van buitengebruikstelling en
        - een schatting van de hoeveelheid niet gemeten energie tussen de buitengebruikstelling van het telwerk en de
      ingebruikname van het nieuwe vervangende telwerk;

      d. de actuele waarde van het op de aansluiting gecontracteerde transportvermogen dan wel het vermogen dat
      overeenkomt met de actuele doorlaatwaarde van de aansluiting (uitgedrukt in kW);

      e. de gebruikte overzetverhouding, de nauwkeurigheidsklasse, het nominaal vermogen en voorzover bekend fabrikaat,
      type en apparaatnummer van de spanningstransformatoren;

      f. de gebruikte overzetverhouding, de nauwkeurigheidsklasse, het nominaal vermogen, de instrumentsveiligheidsfactor
      (Fs) en voorzover bekend fabrikaat, type en apparaatnummer van de stroomtransformatoren;

      g. plaats, soort en waarde van de smeltveiligheden in het primaire circuit van de spanningstransformatoren;

      h. de schakeling van de meettransformatoren (drieleider, vierleider, open V-schakeling, geaard of zwevend sterpunt,
      enz.);

      i. de vermenigvuldigingsfactor voor elk telwerk en voor de gegevens opgeslagen in de databuffers;

      j. andere gegevens die voor de meetverantwoordelijke van belang zijn, zoals de vermenigvuldigingsfactor voor het
      energieverlies tussen de plaats van de meetinrichting en het overdrachtspunt indien de meetinrichting zich niet op
      het overdrachtspunt van de aansluiting bevindt;

      k. fabrikaat, type, fabrieksnummer en bouwjaar van de geïnstalleerde apparatuur;

      l. kalibratiecertificaten van de verschillende meetmiddelen van de meetinrichting;

      m. het jaar waarin de meters voor het laatst zijn gereviseerd;

      n. de impulswaarde van het zendcontact of van de impulsuitgang;

      o. het soort zegel waarmee de meter is verzegeld;

      p. het jaar waarin de meter voor het laatst is gecontroleerd;

      q. de resultaten van de aan de meetinrichting uitgevoerde controles;

      r. de gegevens met betrekking tot het ontwerp en de structuur van de meetinrichting;

      s. de wijze waarop de systematische (steekproefsgewijze) periodieke controle van in gebruik zijnde meters conform
      [1.2.1.1][ref1] wordt uitgevoerd;

      t. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten, alsmede de adresgegevens,
      zijnde straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam of eventuele alternatieve
      locatieaanduidingen, behorend bij het overdrachtspunt van de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 1.2.1.1
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 4.3.3.2
    text: |-
      De meetverantwoordelijke verstrekt de netbeheerder van wiens net de desbetreffende aansluiting deel uitmaakt op
      diens verzoek de onder [4.3.3.1][ref1] sub a tot en met c genoemde gegevens uit het meterregister, voor zover deze
      gegevens nodig zijn voor de door de netbeheerder in rekening te brengen tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.3
    text: |-
      De in [4.3.3.1][ref1] genoemde gegevens in het meterregister kunnen desgevraagd worden ingezien door de
      netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.4
    text: |-
      Bij beëindiging van de beheerovereenkomst met de meetverantwoordelijke, bewaart de meetverantwoordelijke de
      gegevens zoals bedoeld in [4.3.3.1][ref1] gedurende een periode van tenminste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.5
    text: |-
      Onvolkomenheden aan de meetinrichting die leiden tot aanpassing van de onder [4.3.3.2][ref1] bedoelde gegevens
      van de meetinrichting alsmede onvolkomenheden met betrekking tot de verzameling van gegevens van de meetinrichting
      worden binnen vijf werkdagen na constatering door de meetverantwoordelijke gemeld aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.3.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.3.2
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.4.1
    text: |-
      De profielgrootverbruikmeetinrichting registreert:

      a. de tellerstanden voor één of twee telwerken (normaaltelwerk en laagtelwerk of in geval van een meetinrichting
      met één telwerk: enkeltelwerk) per energierichting met bijbehorende vermenigvuldigingsfactoren;

      b. indien dit volgens [2.4.5][ref1] van toepassing is, de kWmax binnen de gespecificeerde periode (kW).


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.4.5
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 4.3.4.2
    text: |-
      De productiemeetinrichting registreert de tellerstanden voor één of twee telwerken (normaaltelwerk en laagtelwerk
      of in geval van een meetinrichting met één telwerk: enkeltelwerk) met bijbehorende vermenigvuldigingsfactoren.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.4.2
  - number: 4.3.4.3
    text: |-
      Op een profielgrootverbruikmeetinrichting geplaatst in het (de) overdrachtspunt(en) van een artikel-1-lid-2-of-
      3-aansluiting, kleiner dan of gelijk aan 3x80A is [paragraaf 4.2][ref1] met uitzondering van [4.2.2][ref2] van
      overeenkomstige toepassing, waarbij in plaats van netbeheerder meetverantwoordelijke dient te worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037946
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.5.1
    text: |-
      Een telemetriegrootverbruikmeetinrichting registreert:

      a. per meetperiode gelijk aan de onbalansverrekeningsperiode de uitgewisselde energie op het overdrachtspunt
      van de aansluiting en de uitgewisselde energie op de grens tussen afzonderlijke installaties als bedoeld in
      [artikel 2.6, onderdeel e][ref1] en [artikel 2.9, onderdeel d, van de Netcode elektriciteit][ref2];

      b. de totale hoeveelheid met het net uitgewisselde energie op één of twee telwerk(en) (enkeltarief respectievelijk
      normaaltarief en laagtarief) met bijbehorende vermenigvuldigingsfactoren;

      c. indien dit volgens [2.4.3][ref3] en [2.4.4][ref4] van toepassing is, het aantal kvarh per maand.

      d. indien dit volgens [2.4.5][ref5] van toepassing is, de kWmax.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.3
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.4
      [ref5]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.6'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '2.9'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037946
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref5
        bwb_id: BWBR0037946
        artikel: 2.4.5
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 4.3.5.1a
    text: |-
      In afwijking van [4.3.5.1, lid a][ref1] kan de netbeheerder van het landelijk hoogspanningsnet de
      meetverantwoordelijke voor aangeslotenen die elektrische energie leveren aan de netbeheerder van het landelijk
      hoogspanningsnet ten behoeve van de systeembalans door middel van ingezette aFRR, noodvermogen, en het MARI-product
      een meetperiode opleggen die kleiner is dan de onbalansverrekeningsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.1a
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.5.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.5.2
    text: |-
      Bij de registratie van de in [4.3.5.1][ref1] genoemde uitgewisselde energie wordt onderscheid gemaakt naar de
      energie die de aangeslotene ontvangt en naar de energie die de aangeslotene levert.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.5.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.5.3
    text: |-
      Een meetperiode is gerelateerd aan het tijdstip 00:00:00 volgens de nationale standaardtijd. De interne klok van de
      meetinrichting wijkt maximaal tien seconden af van de nationale standaardtijd.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.3
  - number: 4.3.5.4
    text: |-
      De afwijking van de starttijden en stoptijden van de meetperiode is niet groter dan tien seconden in de reguliere
      tijd tussen twee uitlezingen van de databuffers van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.4
  - number: 4.3.5.5
    text: |-
      In afwijking van [4.3.5.4][ref1] is bij uitval van het synchronisatiesysteem de afwijking van de start- en
      stoptijden van de meetperiode minder dan tien seconden gedurende een periode van maximaal een week.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.5.4
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.5.6
    text: |-
      De energie, de blindenergie, het vermogen en het blindvermogen van de meetinrichting worden vastgesteld
      overeenkomstig de formules genoemd in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.5.7
    text: |-
      Bij de registratie van de in [2.4.4][ref1] genoemde blindenergie wordt uitsluitend onderscheid gemaakt tussen het
      in de zin van [bijlage 2][ref2] leveren en ontvangen van blindenergie.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.4
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037946
  - number: 4.3.5.8
    text: |-
      Het volume dat gebruikt wordt in [artikel 3.9.3 van de Tarievencode elektriciteit][ref1] als tariefdrager voor
      blindenergie wordt bepaald met inachtneming van de in [bijlage 2][ref2] gedefinieerde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3.9.3
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.5.8
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: 3.9.3
      - id: ref2
        bwb_id: BWBR0037946
  - number: 4.3.6.1
    text: |-
      Ingeval van een aansluiting op hoogspanning mag de maximaal toelaatbare afwijking van een voor de eerste maal in
      gebruik te nemen meetinrichting, de in [B1.1 en B1.2][ref1] genoemde waarden voor de maximaal toelaatbare afwijking
      niet overschrijden. Dit geldt ook indien de primaire delen van de meetinrichting niet in het overdrachtspunt van de
      aansluiting zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.2
    text: |-
      Ingeval van een aansluiting op hoogspanning mag de maximaal toelaatbare afwijking van een voor de eerste maal in
      gebruik te nemen meetinrichting ten behoeve van een productie-installatie niet de in [B1.3][ref1] genoemde waarden
      voor de maximaal toelaatbare afwijking overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.3
    text: |-
      Ingeval van een aansluiting op laagspanning mag de maximaal toelaatbare afwijking van een voor de eerste maal in
      gebruik te nemen meetinrichting aangesloten via stroomstransformatoren de in [B1.4][ref1] genoemde waarden voor de
      maximaal toelaatbare afwijking niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.4
    text: |-
      Ingeval van een aansluiting op laagspanning met een direct aan te sluiten kWh-meter mag de maximaal toelaatbare
      afwijking van een voor de eerste maal in gebruik te nemen meetinrichting niet de in [B1.5][ref1] genoemde waarden
      voor de maximaal toelaatbare afwijking overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.5
    text: |-
      Ingeval van een aansluiting op laagspanning mag de maximaal toelaatbare afwijking van een voor de eerste maal in
      gebruik te nemen meetinrichting ten behoeve van een productie-installatie niet de in [B1.6][ref1] genoemde waarden
      voor de maximaal toelaatbare afwijking overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.6
    text: |-
      Ingeval van een aansluiting op hoogspanning mag de maximaal toelaatbare afwijking van een in gebruik zijnde
      meetinrichting, de in [B1.7][ref1] en [B1.8][ref2] genoemde waarden voor de maximaal toelaatbare afwijking niet
      overschrijden. Dit geldt ook indien de primaire delen van de meetinrichting niet in het overdrachtspunt van de
      aansluiting zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
      - id: ref2
        bwb_id: BWBR0037946
  - number: 4.3.6.7
    text: |-
      Ingeval van een aansluiting op hoogspanning mag de maximaal toelaatbare afwijking van een in gebruik zijnde
      meetinrichting ten behoeve van een productie-installatie de in [B1.9][ref1] genoemde waarden voor de maximaal
      toelaatbare afwijking niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.7
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.8
    text: |-
      Ingeval van een aansluiting op laagspanning mag de maximaal toelaatbare afwijking van een in gebruik zijnde
      meetinrichting die is aangesloten via stroomstransformatoren de in [B1.10][ref1] genoemde waarden voor de maximaal
      toelaatbare afwijking niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.9
    text: |-
      Ingeval van een aansluiting op laagspanning met een direct aan te sluiten kWh-meter mag de maximaal toelaatbare
      afwijking van een in gebruik zijnde meetinrichting de in [B1.11][ref1] genoemde waarden voor de maximaal
      toelaatbare afwijking niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.9
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.10
    text: |-
      Ingeval van een aansluiting op laagspanning mag de maximaal toelaatbare afwijking van een in gebruik zijnde
      meetinrichting ten behoeve van een productie-installatie de in [B1.12][ref1] genoemde waarden voor de maximaal
      toelaatbare afwijking niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 4.3.6.11
    text: |-
      De in [4.3.6.1 tot en met 4.3.6.10][ref1] genoemde waarden voor de maximaal toelaatbare afwijking gelden onder de
      volgende omstandigheden:

      a. de temperatuur in de ruimte waarin de kWh-meter(s) en eventuele kvarh-meter(s) zich bevinden is niet lager dan
      -10 °C en niet hoger dan 45 °C;

      b. de afwijking van de netfrequentie van de nominale waarde bedraagt ten hoogste 1%;

      c. de afwijking van de netspanning van de nominale waarde bedraagt ten hoogste 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.11
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.6.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.6.12
    text: |-
      Bij aansluitingen op laagspanning is de in [onderdeel c van artikel 4.3.6.11][ref1] genoemde nominale waarde van de
      netspanning 230 V.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.12
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.6.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.6.13
    text: |-
      Bij aansluitingen op hoogspanning is de in [onderdeel c van artikel 4.3.6.11][ref1] genoemde nominale waarde van de
      netspanning de door de netbeheerder toegekende spanning Uc.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.11
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.13
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.6.11
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.6.14
    text: |-
      Op verzoek van de netbeheerder van het landelijk hoogspanningsnet toont de meetverantwoordelijke aan dat de
      maximaal toelaatbare afwijking van de meetinrichting de in [4.3.6.1 tot en met 4.3.6.10][ref1] genoemde waarden
      voor de maximaal toelaatbare afwijking niet overschrijdt met dien verstande dat:

      a. aan het bepaalde in [4.3.6.1 tot en met 4.3.6.5][ref2] is voldaan indien de meetinrichting is ontworpen en
      geïnstalleerd overeenkomstig [bijlage 3][ref3];

      b. aan het bepaalde in [4.3.6.6 tot en met 4.3.6.10][ref4] is voldaan indien de meetinrichting is gecontroleerd
      overeenkomstig [bijlage 3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.1
      [ref3]: https://wetten.overheid.nl/BWBR0037946
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.6
      [ref5]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.6.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.6.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037946
      - id: ref4
        bwb_id: BWBR0037946
        artikel: 4.3.6.6
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0037946
  - number: 4.3.6.15
    text: |-
      In andere dan de in [4.3.6.14, onderdelen a en b][ref1], genoemde gevallen, toont de meetverantwoordelijke
      op andere wijze aan dat de maximaal toelaatbare afwijking van de meetinrichting de in
      [4.3.6.1 tot en met 4.3.6.10][ref2] genoemde waarden voor de maximaal toelaatbare afwijking niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.14
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.6.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.6.15
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.6.14
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.6.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.7.1
    text: |-
      Een storing in de meetinrichting bij de meting of bij de in [hoofdstuk 5][ref1] bedoelde gegevensoverdracht dient
      zo spoedig mogelijk, doch binnen twee werkdagen nadat de storing is opgemerkt, verholpen te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '5'
  - number: 4.3.7.2
    text: |-
      Een storing als bedoeld in [4.3.7.1][ref1] bij uitval van hetzij de hoofdmeting hetzij de controlemeting in
      een meetinrichting die geheel of gedeeltelijk dubbel is uitgevoerd dient zo spoedig mogelijk, doch binnen drie
      werkdagen nadat zij is opgemerkt, verholpen te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.7.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.7.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.7.3
    text: |-
      Indien, in afwijking van [4.3.7.1][ref1] en [4.3.7.2][ref2], een oplossing binnen de in 4.3.7.1 respectievelijk
      4.3.7.2 genoemde termijn niet mogelijk is, ontvangen de aangeslotene en de netbeheerder binnen twee werkdagen
      bericht binnen welke termijn de storing zal zijn verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.7.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.7.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.7.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.7.2
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.7.4
    text: |-
      Indien in het geval van een dubbel uitgevoerde meetinrichting de hoofdmeting uitvalt, doch de controlemeting blijft
      functioneren, wordt verrekend op basis van de controlemeting.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.4
  - number: 4.3.7.5
    text: |-
      Storingen in het primaire deel van de meetinrichting worden door de meetverantwoordelijke onverwijld gemeld aan de
      beheerder van het primaire deel van de meetinrichting en voor zover relevant aan de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.5
  - number: 4.3.7.6
    text: |-
      Indien het voor het verhelpen van een storing nodig is dat een medewerker van de meetverantwoordelijke wordt
      begeleid door een bevoegde medewerker van de netbeheerder, geldt hiervoor in aanvulling tot hetgeen is bepaald in
      [4.3.1.1][ref1], dat het verzoek om begeleiding binnen één werkdag wordt gehonoreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel4.3.7.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.1.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.1.1
    text: |-
      Ten minste eenmaal in de 36 maanden bepaalt de netbeheerder bij niet op afstand uitleesbare
      kleinverbruikmeetinrichtingen alsmede bij op afstand uitleesbare meetinrichtingen die administratief uitstaan de in
      [4.2.1.1][ref1] bedoelde meetgegevens door middel van aflezing op de meetinrichting bij de aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.2.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.2.1.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 5.1.2
    text: |-
      De in [5.1.1][ref1] bedoelde meetgegevens zijn beveiligd tegen wijziging ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.0
    text: |-
      De meetverantwoordelijke voorziet de tellerstanden, zoals genoemd in [4.3.4.1][ref1], van een herkomstindicatie.
      Desgevraagd geeft de meetverantwoordelijke aan de netbeheerder van het landelijk hoogspanningsnet inzage in de
      registratie van de meetgegevens en de bijbehorende herkomstindicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.4.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.0
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.4.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.2.1
    text: |-
      Tenminste eenmaal per maand, tussen de vijfde werkdag voor en de vijfde werkdag na de maandwisseling bepaalt de
      meetverantwoordelijke bij profielgrootverbruikmeetinrichtingen op aansluitingen met een doorlaatwaarde groter dan
      3x80A en bij productiemeetinrichtingen de in [4.3.4.1][ref1] en [4.3.4.2][ref2] bedoelde meetgegevens en slaat deze
      op in niet-vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.4.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.4.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.4.2
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.2.2
    text: |-
      Ten minste eenmaal per jaar, in de zes weken voorafgaande aan de maand die op grond van
      [2.1.5 onderdeel b, van de Informatiecode elektriciteit en gas][ref1] is opgenomen in het aansluitingenregister,
      bepaalt de meetverantwoordelijke bij profielgrootverbruikmeetinrichtingen op aansluitingen met een doorlaatwaarde
      kleiner dan of gelijk aan 3x80A de in [4.3.4.1][ref2] bedoelde meetgegevens en slaat deze op in niet-vluchtige
      databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.4.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.5
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.4.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.2.3
    text: |-
      Indien een aangeslotene met een aansluiting groter dan 3x80A en met een productie-installatie voor duurzame of wkk-
      elektriciteit in aanmerking wenst te komen voor garanties van oorsprong respectievelijk wkk-certificaten voor niet-
      netlevering, geschiedt uitlezing van de meetinrichtingen zoals bedoeld in [2.1.1 sub b en c van deze code][ref1],
      zoals bedoeld in artikel 3, lid 1 van de Regeling garanties van oorsprong respectievelijk van de Regeling
      certificaten warmtekrachtkoppeling uiterlijk de eerste werkdag van de maand, waarbij de tijd tussen het uitlezen
      van de eerste en van de laatste van toepassing zijnde meetinrichting maximaal drie uur bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.1.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.1.1
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.2.4
    text: |-
      Indien een aangeslotene met een aansluiting kleiner dan of gelijk aan 3x80A en met een productie-
      installatie voor duurzame of wkk-elektriciteit in aanmerking wenst te komen voor garanties van oorsprong
      respectievelijk wkk-certificaten voor niet-netlevering, geschiedt uitlezing van de meetinrichting(en) bedoeld in
      [2.1.1 sub b en c van deze code][ref1] zoals bedoeld in artikel 3, lid 1 van de Regeling garanties van oorsprong
      respectievelijk de Regeling certificaten warmtekrachtkoppeling voor zover van toepassing tegelijk met de jaarlijkse
      bepaling van de meterstand zoals bedoeld in [5.2.2][ref2], waarbij de tijd tussen het uitlezen van de eerste en van
      de laatste van toepassing zijnde meetinrichting maximaal drie uur bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.2
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 2.1.1
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.5
    text: |-
      De in [5.2.1 tot en met 5.2.4][ref1] bedoelde bepaling van de meetgegevens vindt in de regel plaats door
      uit- of aflezing van de meetinrichting door de meetverantwoordelijke. De meetverantwoordelijke kan van de
      aangeslotene verlangen dat de aangeslotene zelf de tellerstand opneemt en deze tellerstand op een door de
      meetverantwoordelijke te bepalen wijze en binnen een door de meetverantwoordelijke aangegeven termijn ter kennis
      van de meetverantwoordelijke brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.6
    text: |-
      Indien de meetverantwoordelijke redelijkerwijs niet in staat is de tellerstand van de meetinrichting uit of af te
      lezen of de aangeslotene niet heeft voldaan aan het verlangen van de meetverantwoordelijke, zoals beschreven in
      [5.2.5][ref1], maakt de meetverantwoordelijke een schatting van de tellerstand(en).


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.5
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.7
    text: |-
      Ten minste eenmaal in de 36 maanden bepaalt de meetverantwoordelijke de meetgegevens genoemd in
      [5.2.1 tot en met 5.2.4][ref1] door aflezing op de meetinrichting bij de aangeslotene en slaat deze op in niet-
      vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.8
    text: |-
      Kennisneming van de in [5.2.1 tot en met 5.2.4][ref1] en [5.2.7][ref2] bedoelde meetgegevens is voorbehouden
      aan die partijen die daartoe op grond van deze code, wetgeving en/of rechtsgeldig gesloten overeenkomsten zijn
      gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.7
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.7
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.9
    text: |-
      De in [5.2.1 tot en met 5.2.4][ref1] en [5.2.7][ref2] bedoelde meetgegevens zijn beveiligd tegen wijziging ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.7
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.7
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.10
    text: |-
      De meetverantwoordelijke bewaart de meetgegevens bedoeld in [5.2.1 tot en met 5.2.4][ref1] en [5.2.7][ref2]
      gedurende een periode van ten minste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.7
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.7
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.11
    text: |-
      De meetverantwoordelijke valideert de overeenkomstig [5.2.1 tot en met 5.2.5][ref1] en [5.2.7][ref2] bepaalde
      meetgegevens op volledigheid en juistheid aan de hand van de volgende criteria:

      a. de voor de bepaling van de hoeveelheid uitgewisselde energie benodigde tellerstanden zijn beschikbaar;

      b. de gemeten hoeveelheid met het net uitgewisselde energie is groter dan 50% van de hoeveelheid die op grond van
      de uitwisseling tijdens de voorafgaande periode zou mogen worden verwacht;

      c. de gemeten hoeveelheid met het net uitgewisselde energie is kleiner dan 200% van de hoeveelheid die op grond van
      de uitwisseling tijdens de voorafgaande periode zou mogen worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.7
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.7
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.12
    text: |-
      Indien de meetgegevens niet voldoen aan de in [5.2.11][ref1] genoemde validatiecriteria worden de meetgegevens
      door de meetverantwoordelijke (opnieuw) af- of uitgelezen of wordt in overleg met de aangeslotene vastgesteld of de
      gemeten hoeveelheid overeenkomt met de hoeveelheid die zou mogen worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.11
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.11
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.13
    text: |-
      De meetverantwoordelijke stelt de overeenkomstig [5.2.11][ref1] valide meetgegevens en de overeenkomstig
      [5.2.12][ref2] bepaalde meetgegevens vast.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.11
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.12
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.13
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.11
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.2.12
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.14
    text: |-
      De validatie en vaststelling zoals bedoeld in [5.2.11 tot en met 5.2.13][ref1] vindt plaats uiterlijk de werkdag na
      de dag van verzameling van meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.2.11
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.14
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.2.11
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.15
    text: |-
      De meetverantwoordelijke verstuurt de vastgestelde meetgegevens overeenkomstig het bepaalde in [6.2.2.7][ref1] en
      [6.2.2.8 van de Informatiecode elektriciteit en gas][ref2]. Indien [artikel 2.4.5][ref3] van toepassing is en de
      aansluiting meerdere verbindingen omvat, bepaalt de meetverantwoordelijke uit de gemeten waarden de ten behoeve van
      het bepaalde in 6.2.2.7 en 6.2.2.8 van de Informatiecode elektriciteit en gas te sturen waarde voor de kWmax van
      de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.8
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.2.15
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.7
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.8
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 2.4.5
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 5.3.0
    text: |-
      De meetverantwoordelijke voorziet de meetgegevens bedoeld in deze paragraaf van een herkomstindicatie, een
      validatiestatus en indien van toepassing een reparatiemethodiek. Desgevraagd geeft de meetverantwoordelijke aan
      de netbeheerder van het landelijk hoogspanningsnet inzage in de registratie van de meetgegevens en de bijbehorende
      herkomstindicaties, de validatiestatussen en de reparatiemethodieken.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.0
  - number: 5.3.1
    text: |-
      De meetverantwoordelijke verzamelt de in [4.3.5.1][ref1] genoemde meetgegevens dagelijks op elektronische wijze
      op een zodanige wijze dat de resolutie van de meetgegevens daardoor niet wordt beïnvloed en slaat deze op in niet-
      vluchtige databuffers.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.5.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.3.2
    text: |-
      In geval van een aansluiting met een aansluitcapaciteit groter dan 1 MVA, neemt de aangeslotene, samen met zijn
      meetverantwoordelijke, maatregelen om de verzameling van meetgegevens over een bepaald etmaal op de eerstvolgende
      werkdag te laten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.2
  - number: 5.3.3
    text: |-
      In afwijking van [5.3.1][ref1] worden, indien sprake is van overdracht van meetgegevens met behulp van pulsen, de
      maandelijkse tellerstanden door de meetverantwoordelijke berekend op basis van deze pulsen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.4
    text: |-
      Indien [5.3.3][ref1] van toepassing is, worden tenminste eenmaal per zes maanden de tellerstanden bepaald door
      het ter plaatse uit- of aflezen van de meetinrichting door de meetverantwoordelijke en worden de berekende
      tellerstanden gecorrigeerd op basis van de uit- of afgelezen tellerstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.3
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.5
    text: |-
      Kennisneming van de in [5.3.1][ref1], [5.3.3][ref2] en [5.3.4][ref3] bedoelde meetgegevens is voorbehouden aan die
      partijen die daartoe op grond van deze code, wetgeving en/of rechtsgeldig gesloten overeenkomsten zijn gerechtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.3.3
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 5.3.4
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.6
    text: |-
      De in [5.3.1][ref1], [5.3.3][ref2] en [5.3.4][ref3] bedoelde meetgegevens zijn beveiligd tegen wijziging ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.3.3
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 5.3.4
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.7
    text: |-
      De meetverantwoordelijke bewaart de meetgegevens bedoeld in [5.3.1][ref1], [5.3.3][ref2] en [5.3.4][ref3] gedurende
      een periode van ten minste zeven jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.3.3
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037946
        artikel: 5.3.4
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.8
    text: |-
      De meetverantwoordelijke controleert op de dag van de verzameling van de meetgegevens of alle meetperioden van de
      meting aanwezig zijn en een meetwaarde bevatten.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.8
  - number: 5.3.9
    text: |-
      De meetverantwoordelijke valideert de gecollecteerde meetgegevens op de dag van de verzameling van de meetgegevens
      door de meetverantwoordelijke op juistheid aan de hand van de volgende criteria:

      a. in geval van een hoofdmeting en een controlemeting is het verschil per dag in de hoeveelheid energie
      gemeten door de hoofdmeting en de controlemeting kleiner dan tweemaal de geldende nauwkeurigheidsklasse van de
      meetinrichting zoals bepaald in [bijlage B1][ref1] vermenigvuldigd met de daguitwisseling van de hoofdmeter;

      b. de gemeten hoeveelheid energie is groter dan of gelijk aan nul;

      c. de hoeveelheid met het net uitgewisselde energie per meetperiode is kleiner dan 120% van de hoeveelheid die
      maximaal uitgewisseld kan worden op basis van de capaciteit van de meetinrichting;

      d. de status in de meetinrichting aangaande de meting of de meetwaarde en de status van het meetkanaal geven geen
      indicatie van een fout;

      e. de tijdsynchroniciteit van de meetinrichting en meetperiode blijft binnen de in
      [4.3.5.3 tot en met 4.3.5.5][ref2] aangegeven normen.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.9
    references:
      - id: ref1
        bwb_id: BWBR0037946
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 4.3.5.3
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 5.3.10
    text: |-
      De meetverantwoordelijke repareert de op grond van [5.3.9][ref1] niet-valide meetgegevens overeenkomstig
      [5.4.3.1 tot en met 5.4.3.4][ref2]. Alle op grond van [paragraaf 5.4.3][ref3] gerepareerde meetgegevens gelden
      als definitief.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.9
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.4.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.9
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.4.3.1
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref3
        bwb_id: BWBR0037946
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.3.11
    text: |-
      De meetverantwoordelijke past op de overeenkomstig [5.3.9][ref1] en [5.3.10][ref2] gevalideerde meetgegevens de
      vermenigvuldigingsfactor toe en stelt de meetgegevens vast.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.9
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.3.10
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.11
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.3.9
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.3.10
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.12
    text: |-
      De meetverantwoordelijke verstuurt de vastgestelde meetgegevens overeenkomstig het bepaalde in
      [6.2.2.2][ref1], [6.2.2.3][ref2] en [6.2.2.6 van de Informatiecode elektriciteit en gas][ref3]. Indien
      [artikel 2.4.5][ref4] van toepassing is en de aansluiting meerdere verbindingen omvat, bepaalt de
      meetverantwoordelijke uit de gemeten waarden de ten behoeve van het bepaalde in [6.2.2.7][ref5] en
      [6.2.2.8 van de Informatiecode elektriciteit en gas][ref6] te sturen waarde voor de kWmax van de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.6
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.5
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.7
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.8
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.3.12
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.2
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.3
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.2.2.6
      - id: ref4
        bwb_id: BWBR0037946
        artikel: 2.4.5
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: 6.2.2.7
      - id: ref6
        bwb_id: BWBR0037934
        artikel: 6.2.2.8
  - number: 5.4.1.1
    text: |-
      Wanneer de meetgegevens die zijn uitgelezen en opgeslagen door de meterbeheerder verschillen van de meetgegevens
      die zijn opgeslagen in de databuffers van de meetinrichting, gelden de laatstbedoelde meetgegevens.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.1.1
  - number: 5.4.2.1
    text: |-
      Een storing in de afstanduitlezing van de databuffers van een telemetriegrootverbruikmeetinrichting wordt
      uiterlijk tijdens de eerstvolgende poging tot afstanduitlezing na het optreden van die storing gesignaleerd door
      de meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.2.1
  - number: 5.4.2.2
    text: |-
      Wanneer afstanduitlezing van de databuffers niet mogelijk is, leest de meetverantwoordelijke de databuffers van de
      telemetriegrootverbruikmeetinrichting ter plaatse uit. Het ter plaatse uitlezen van de databuffers geschiedt binnen
      twee werkdagen na constatering van desbetreffende storing in de afstanduitlezing, waarbij de meetverantwoordelijke
      rekening houdt met de opslagcapaciteit van de databuffers.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.2.2
  - number: 5.4.2.3
    text: |-
      Wanneer de meetgegevens die zijn uitgelezen en opgeslagen door de meetverantwoordelijke verschillen van de
      meetgegevens die zijn opgeslagen in de databuffers van de meetinrichting, gelden de laatstbedoelde meetgegevens.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.2.3
  - number: 5.4.3.1
    text: |-
      Ingeval van een hoofdmeting en een controlemeting wordt de gemiste waarde van de hoofdmeter gekopieerd van de
      controlemeter.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.1
  - number: 5.4.3.2
    text: |-
      Indien er op een dag meetgegevens ontbreken over een aaneengesloten periode van maximaal twaalf kwartieren, worden
      de ontbrekende waarden in de meetgegevens berekend door het kopiëren van de belastingcurve van een vergelijkbare
      dag.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.2
  - number: 5.4.3.3
    text: |-
      De meetverantwoordelijke berekent ontbrekende meetgegevens in geval van grotere hiaten in de meetgegevens
      dan twaalf kwartieren of bij het ontbreken van een belastingcurve van een vergelijkbare dag overeenkomstig
      [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 5.4.3.4
    text: |-
      Reparatie van meetgegevens over perioden langer dan een dag zal bij meetinrichtingen uitgelezen op pulsen
      plaatsvinden door de tellerstand ter plaatse op te nemen. Het verschil tussen de opgenomen tellerstand en de laatst
      bekende tellerstand (=berekende tellerstand) wordt over de tussenliggende perioden verdeeld overeenkomstig de
      belastingcurve van een vergelijkbare dag.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.4
  - number: 5.4.3.5
    text: |-
      De meetverantwoordelijke registreert alle reparaties die conform [5.4.3.1 tot en met 5.4.3.4][ref1] zijn uitgevoerd
      en verstrekt de aangeslotene en de netbeheerder desgevraagd een rapportage over deze reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.4.3.1
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.4.3.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4.3.6
    text: |-
      Desgevraagd geeft de meetverantwoordelijke aan de netbeheerder van het landelijk hoogspanningsnet inzage in de
      registratie met betrekking tot de onder punt [5.4.3.5][ref1] genoemde reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.4.3.5
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.4.3.5
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.5.2
    text: |-
      De meetverantwoordelijke beantwoordt binnen drie werkdagen na ontvangst van een herzieningsverzoek van een BRP of
      netbeheerder met een acceptatie of een afwijzing met reden.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.5.2
  - number: 5.5.3
    text: |-
      Indien de meetverantwoordelijke het herzieningsverzoek terecht acht, stelt hij de meetgegevens opnieuw vast of
      verwerkt hij de aanpassing van de stamgegevens.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.5.3
  - number: 5.5.4
    text: |-
      De meetverantwoordelijke stuurt de vastgestelde meetgegevens overeenkomstig het bepaalde in
      [6.2.2.3 van de Informatiecode elektriciteit en gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel5.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.3
  - number: 6.1.1
    text: |-
      Bij een verwisseling of wijziging van de meetinrichting registreert de meterbeheerder van de geplaatste of
      gewijzigde meetinrichting, indien van toepassing, de volgende gegevens:

      a. de identificatiecode van de meetinrichting, zijnde het meternummer,

      b. de opnamedatum,

      c. het kenmerk van de opname, te weten: fysieke opname,

      d. de procesidentificatie die van toepassing is,

      e. voor elk telwerk van de geplaatste of gewijzigde meetinrichting de volgende gegevens:

        - de telwerkindicatie
        - de tariefzone
        - de energierichting
        - de meeteenheid
        - het aantal posities voor de komma
        - de vermenigvuldigingsfactor
        - de tellerstand op het moment van plaatsing of wijziging van de meetinrichting

      en van de weggenomen meetinrichting, indien van toepassing, de volgende gegevens:

      f. de identificatiecode van de meetinrichting, zijnde het meternummer,

      g. de opnamedatum,

      h. het kenmerk van de opname, te weten: fysieke opname,

      i. de procesidentificatie die van toepassing is,

      j. voor elk telwerk van de geplaatste of gewijzigde meetinrichting de volgende gegevens:

        - de telwerkindicatie
        - de tariefzone
        - de energierichting
        - de meeteenheid
        - het aantal posities voor de komma
        - de vermenigvuldigingsfactor
        - de tellerstand op het moment van plaatsing of wijziging van de meetinrichting
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.1.1
  - number: 6.1.2
    text: |-
      De verwisseling of wijziging van de kleinverbruikmeetinrichting wordt binnen vijf werkdagen nadat de fysieke
      werkzaamheden zijn uitgevoerd door de netbeheerder verwerkt in het aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.1.2
  - number: 6.1.3
    text: |-
      Indien het transport van elektriciteit op het overdrachtspunt van de aansluiting tijdens het verwisselen of
      wijzigen van de meetinrichting niet wordt onderbroken, bedraagt de tijdsduur tussen het buiten gebruik stellen van
      de oude meetinrichting en de ingebruikname van de nieuwe meetinrichting maximaal een uur.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.1.3
  - number: 6.2.1
    text: |-
      Indien er zich situaties voordoen die niet zijn voorzien in de bepalingen van deze code, bepaalt de netbeheerder in
      overleg met de aangeslotene welke maatregelen nodig zijn, rekening houdend met de technische hoedanigheden van de
      installatie van de desbetreffende aangeslotene en de belangen van alle aangeslotenen.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.2.1
  - number: 6.3.1
    text: |-
      De netbeheerder beslist na overleg met de aangeslotene over de toelaatbaarheid van een bestaande meetinrichting die
      voor de inwerkingtreding van deze code is geïnstalleerd en die niet aan de in [hoofdstuk 4][ref1] genoemde eisen
      voldoet. Indien de bestaande meetinrichting geheel of gedeeltelijk niet toelaatbaar wordt geoordeeld en als het
      wijzigen van het secundaire gedeelte van de meetinrichting teneinde aan de eisen genoemd in [hoofdstuk 4][ref2] te
      voldoen alleen economisch zinvol of technisch mogelijk is in combinatie met de aanpassing van het primaire deel van
      de meetinrichting, dient het secundaire gedeelte uiterlijk tegelijk met het primaire gedeelte te worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037946
        hoofdstuk: '4'
  - number: 6.3.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.3
  - number: 6.3.4
    text: |-
      Onverminderd het voorgaande kunnen partijen van elkaar alle gegevens en inlichtingen ontvangen die zij nodig hebben
      voor de uitvoering van de hen in of krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.4
  - number: 6.3.5
    text: |-
      Partijen stellen elkaar zo spoedig mogelijk op de hoogte van alle gegevens, voorvallen en wijzigingen in
      omstandigheden die voor hen van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.5
  - number: 6.3.6
    text: |-
      Indien in deze code wordt verwezen naar andere wet- en regelgeving of naar een nationale, Europese of
      internationale norm, is, tenzij anders vermeld, de meest recent vastgestelde versie van deze wet- en regelgeving of
      norm van toepassing. Indien de norm wordt neergelegd in een wettelijke regeling dan wordt deze norm toegepast zodra
      deze wettelijke regeling van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.6
  - number: 6.3.7
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.7
  - number: 6.3.8
    text: |-
      De Meetcode Elektriciteit, zoals vastgesteld bij besluit van 12 november 1999 en nadien diverse malen gewijzigd,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.8
  - number: 6.3.9
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.9
  - number: 6.3.10
    text: 'Dit besluit wordt aangehaald als: Meetcode elektriciteit.'
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel6.3.10
