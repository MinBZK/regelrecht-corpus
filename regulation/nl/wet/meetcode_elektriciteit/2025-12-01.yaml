        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.5
    text: |-
      De netbeheerder verstrekt uiterlijk 5 werkdagen voor de conform [3.4.4][ref1] geplande plaatsing de
      meterwisselgegevens:

        - het meternummer van de huidige meetinrichting;
        - de marge waarbinnen de tellerstand(en) van de huidige meetinrichting moeten liggen ten tijde van de plaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.4
