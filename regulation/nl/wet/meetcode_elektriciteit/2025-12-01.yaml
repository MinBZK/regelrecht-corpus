  - number: 3.4.3
    text: |-
      Het resultaat van de in [artikel 3.4.2][ref1] genoemde vaststelling wordt binnen vijf werkdagen na de in
      [artikel 3.4.1][ref2] bedoelde melding meegedeeld aan de ander dan de netbeheerder die op verzoek van de
      aangeslotene conform [artikel 26ae, zevende lid, van de Elektriciteitswet 1998][ref3], er zorg voor draagt dat de
      aangeslotene beschikt over een op afstand uitleesbare kleinverbruikmeetinrichting.

      Indien niet aan alle in [artikel 3.4.2][ref4] genoemde criteria wordt voldaan, wordt de procedure plaatsing door
      derden van een niet door de netbeheerder geleverde meetinrichting gestopt.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel26ae
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.2
