  - number: 3.4.4
    text: |-
      De meterplaatser neemt binnen 15 werkdagen na de in [3.4.3][ref1] bedoelde melding contact op met de netbeheerder
      voor het maken van afspraken over de datum en het tijdstip van de verwijdering van de oude meetinrichting en
      plaatsing van de nieuwe meetinrichting en over de toegankelijkheid van de communicatievoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel3.4.3
    url: https://wetten.overheid.nl/BWBR0037946/2025-12-01#Artikel3.4.4
    references:
