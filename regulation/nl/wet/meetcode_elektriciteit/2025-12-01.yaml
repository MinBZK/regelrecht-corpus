  - number: 1.2.3.4
    text: |-
      In afwijking van [1.2.3.2][ref1] is er voor grootverbruikaansluitingen waarbij op grond van
      [artikel 2.30, eerste lid van de Netcode elektriciteit][ref2] geen comptabele meetinrichting aanwezig is,
      geen meetverantwoordelijke voor alle uit de [hoofdstukken 4][ref3], [5][ref4] en [6][ref5] voortvloeiende
      werkzaamheden. In dat geval is de netbeheerder op grond van artikel 2.30, eerste lid van de Netcode elektriciteit
      in combinatie met [artikel 10.17, vijfde lid van de Netcode elektriciteit][ref6] verantwoordelijk voor
      de vaststelling van de hoeveelheid getransporteerde energie op het overdrachtspunt van de desbetreffende
      grootverbruikaansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1.2.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.30
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0037946#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0037940#Artikel10.17
