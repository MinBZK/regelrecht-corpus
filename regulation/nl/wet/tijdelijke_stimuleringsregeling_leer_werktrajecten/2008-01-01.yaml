  - number: '5'
    text: |-
      1 De subsidieaanvrager maakt bij de indiening van de aanvraag voor de subsidie, bedoeld in
      [artikel 2, onderdeel a][ref1], gebruik van het daartoe door de Minister beschikbaar gestelde formulier, dat
      met betrekking tot een enkelvoudige aanvraag is ingericht overeenkomstig het model van [bijlage 1a][ref2]
      van deze regeling en met betrekking tot een meervoudige aanvraag is ingericht overeenkomstig het model van
      [bijlage 1b][ref3] van deze regeling.

      2 Bij de aanvraag voor de subsidie, bedoeld in [artikel 2, onderdeel a][ref4], wordt overgelegd:

      a. een opgave van naam, adres, woonplaats en geboortedatum van de persoon die aan het leer-/werktraject deelneemt,
      dan wel zal deelnemen;

      b. een verklaring van de subsidieaanvrager, inhoudende dat de persoon, bedoeld in onderdeel a, in ieder geval in de
      periode van 1 januari 2004 tot het tijdstip van aanvang van het leer-/werktraject ononderbroken werkzaam is geweest
      in een gesubsidieerde dienstbetrekking;

      c. bescheiden waaruit blijkt dat ten behoeve van de persoon, bedoeld in onderdeel a, in het kader van het leer-/
      werktraject scholing, al dan niet tezamen met een EVC-traject, wordt gerealiseerd die strekt tot het behalen van
      een certificaat of een diploma behorende bij een in het Centraal Register Beroepsopleidingen opgenomen opleiding als
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref5],
      dan wel een certificaat of diploma van een in het Centraal Register Opleidingen Hoger Onderwijs opgenomen
      opleiding, vergezeld van een opgave van de overeengekomen, dan wel overeen te komen scholingsduur;

      d. bescheiden waaruit blijkt dat de persoon, bedoeld in onderdeel a, op of na 1 september 2005 start met het leer-/
      werktraject;

      e. bescheiden waaruit blijkt dat de persoon, bedoeld in onderdeel a, tijdens het leer-/werktraject ten minste 12
      uur per week werkzaam is in dienstbetrekking met een overeengekomen duur van ten minste 12 maanden;

      f. een verklaring van de subsidieaanvrager, inhoudende dat met betrekking tot het begeleiden naar en deelnemen
      aan een leer-/werktraject door de persoon, bedoeld in onderdeel a, loonkosten volledig uit anderen hoofde worden
      betaald;

      g. een verklaring van het Christelijk Nationaal Vakverbond, de Federatie Nederlandse Vakbeweging, de Vakcentrale
      voor middengroepen en hoger personeel, of een bij een van deze koepelorganisaties aangesloten vakbond, inhoudende
      dat die koepelorganisatie of de daarbij aangesloten vakbond instemt met de aanvraag voor de subsidie, bedoeld in
      [artikel 2, onderdeel a][ref6].

      3 De Minister ontvangt de aanvraag voor de subsidie, bedoeld in [artikel 2, onderdeel a][ref7], uiterlijk 31 juli
      2006.


