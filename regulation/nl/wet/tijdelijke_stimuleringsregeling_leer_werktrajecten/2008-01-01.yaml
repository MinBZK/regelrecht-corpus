        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019310
        artikel: '2'
  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van deze regeling zijn belast de daartoe bij besluit van de Minister aangewezen
      ambtenaren van het Agentschap SZW en de Auditdienst, beide onderdeel van het Ministerie van Sociale Zaken en
      Werkgelegenheid.

      2 De subsidieaanvrager verleent aan de toezichthouders alle medewerking die dezen redelijkerwijs kunnen vorderen
      bij de uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel15
  - number: '16'
    text: |-
      De subsidieaanvrager verleent op verzoek van de Minister medewerking aan een door de Minister ingesteld
      evaluatieonderzoek, bedoeld om te beoordelen in welke mate de subsidie een bijdrage heeft geleverd aan het
      realiseren van leer-/werktrajecten en uitstroom.
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel16
  - number: '17'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 januari 2006 en vervalt met ingang van 1 januari 2011.

      2 In afwijking van het eerste lid blijft de regeling, zoals die onmiddellijk voor de datum waarop deze vervalt
      luidt, van toepassing op de financiële afwikkeling van de subsidie van de Minister aan de subsidieaanvrager.
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke stimuleringsregeling leer-/werktrajecten.'
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel18
