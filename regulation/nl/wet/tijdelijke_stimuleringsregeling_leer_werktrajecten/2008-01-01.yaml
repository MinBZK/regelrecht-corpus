  - number: '11'
    text: |-
      Indien de subsidie, bedoeld in [artikel 2, onderdeel a][ref1], wordt verleend, zendt de Minister aan de
      subsidieaanvrager een beschikking tot verlening van die subsidie met een voorschotverlening van 80% van die
      verleende subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019310
        artikel: '2'
  - number: '12'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat de administratie voor de uitvoering van
      deze regeling zodanig is ingericht dat, naast een nauwkeurige en inzichtelijke vastlegging van de inkoop en de
      deelname aan leer-/werktrajecten en de gerealiseerde uitstroom, alle overige van belang zijnde vastleggingen en
      bewijsstukken ten behoeve van het besluitvormings-, uitvoerings-, controle- en verantwoordingsproces zichtbaar
      en controleerbaar zijn vastgelegd. [Artikel 12, eerste lid, van de Algemene Regeling SZW-subsidies][ref1] is niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel12
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '12'
  - number: '14'
    text: |-
      De Minister stelt de subsidie, bedoeld in [artikel 2, onderdeel a][ref1], en [artikel 2, onderdeel b][ref2], vast
      uiterlijk zes maanden na ontvangst door hem van de verantwoordingsinformatie met betrekking tot deze regeling,
      bedoeld in de [bijlage bij de Regeling verantwoordingsinformatie specifieke uitkeringen](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019310#Artikel2
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel14
