  - number: '6'
    text: De Minister beslist binnen 13 weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel6
  - number: '7'
    text: |-
      De aanvraag voor de uitstroomsubsidie, bedoeld in [artikel 2, onderdeel b][ref1], vindt plaats via het invullen van
      de indicator ‘gerealiseerde uitstroom’ in de verantwoordingsinformatie met betrekking tot deze regeling, bedoeld in
      de [bijlage bij de Regeling verantwoordingsinformatie specifieke uitkeringen](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019310
        artikel: '2'
  - number: '8'
    text: |-
      1 Subsidieverlening vindt plaats op basis van individuele personen die aan een leer-/werktraject deelnemen en van
      individuele personen die voldoen aan de omschrijving van uitstroom, bedoeld in [artikel 1, onderdeel h][ref1].

      2 In afwijking van [artikel 3, eerste lid, van de Algemene Regeling SZW-subsidies][ref2] bedraagt de subsidie,
      bedoeld in [artikel 2, onderdeel a][ref3], € 6000,– per persoon die aan een leer-/werktraject deelneemt en de
      uitstroomsubsidie, bedoeld in [artikel 2, onderdeel b][ref4], € 3000,– per persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009211#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019310#Artikel2
