  - number: '2'
    text: |-
      De Minister verleent op aanvraag:

      a. subsidie als bijdrage in de kosten van begeleiding naar en deelname aan een leer-/werktraject door een persoon
      die in ieder geval in de periode van 1 januari 2004 tot het tijdstip van aanvang van het leer-/werktraject
      ononderbroken werkzaam is geweest in een gesubsidieerde dienstbetrekking;

      b. uitstroomsubsidie voor de verwezenlijking van uitstroom met betrekking tot de persoon ten aanzien van wie op
      grond van onderdeel a subsidie is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het subsidieplafond bedraagt € 33.000.000,–.

      2 Voor het bepalen van het bereiken van het subsidieplafond wordt de subsidie, bedoeld in
      [artikel 2, onderdeel a][ref1], vermeerderd met de uitstroomsubsidie, bedoeld in [artikel 2, onderdeel b][ref2].

      3 Op de aanvragen voor de subsidie, bedoeld in [artikel 2, onderdeel a][ref3], wordt in volgorde van datum van
      binnenkomst beslist, waarbij uitsluitend volledige aanvragen in behandeling worden genomen. Van een volledige
      aanvraag is sprake indien wordt voldaan aan [artikel 5][ref4].

      4 Indien de subsidieaanvrager in de gelegenheid wordt gesteld zijn onvolledige aanvraag aan te vullen, geldt als
      datum van binnenkomst de datum van ontvangst van de volledige aanvraag.

      5 Indien toekenning van aanvragen die op dezelfde datum zijn binnengekomen leidt tot overschrijding van het
      subsidieplafond, wordt, in afwijking van het derde lid, met betrekking tot die aanvragen de volgorde door loting
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019310#Artikel2
