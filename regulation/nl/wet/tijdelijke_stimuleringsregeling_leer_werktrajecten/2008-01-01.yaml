preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, 5 en 8, eerste lid, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. dienstbetrekking: een arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1] of een publiekrechtelijke aanstelling;

      b. EVC-methodiek: methodiek door middel waarvan eerder verworven competenties van een persoon in kaart worden
      gebracht;

      c. EVC-traject: traject waarin een EVC-methodiek wordt gehanteerd;

      d. gesubsidieerde dienstbetrekking: dienstbetrekking waarvoor een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2] is verstrekt;

      e. leer-/werktraject: traject waarbij arbeid, verricht in een dienstbetrekking met een overeengekomen
      arbeidsduur van ten minste 12 uur per week, wordt gecombineerd met scholing, al dan niet
      tezamen met een EVC-traject, en dat strekt tot het behalen van een certificaat of een diploma
      behorende bij een in het Centraal Register Beroepsopleidingen opgenomen opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], dan wel een
      certificaat of diploma van een in het Centraal Register Opleidingen Hoger Onderwijs opgenomen opleiding;

      f. Minister: Minister van Sociale Zaken en Werkgelegenheid;

      g. reguliere dienstbetrekking: dienstbetrekking waarvoor geen voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref4] is verstrekt;

      h. uitstroom: in een periode van minimaal 18 maanden en maximaal 30 maanden, te rekenen vanaf de aanvang van het
      leer-/werktraject, ononderbroken in dienstbetrekking werkzaam zijn geweest, waarvan in ieder geval de laatste zes
      maanden in een reguliere dienstbetrekking met een overeengekomen arbeidsduur van ten minste 12 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
