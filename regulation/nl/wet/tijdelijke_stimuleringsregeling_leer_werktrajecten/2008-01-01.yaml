  - number: '9'
    text: |-
      De subsidie, bedoeld in [artikel 2, onderdeel a][ref1], wordt slechts verleend voor een leer-/werktraject:

      a. dat is gericht op uitstroom;

      b. dat een minimale duur van tenminste 12 maanden en een maximale duur van 24 maanden heeft;

      c. waarmee een aanvang is gemaakt in de periode van 1 september 2005 tot en met 31 december 2006; en

      d. met betrekking tot hetwelk de subsidieaanvrager een verklaring als bedoeld in
      [artikel 5, tweede lid, onderdeel f][ref2], heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019310#Artikel5
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019310
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019310
        artikel: '5'
  - number: '10'
    text: |-
      Op een aanvraag met betrekking tot de subsidie, bedoeld in [artikel 2, onderdeel a][ref1], of de uitstroomsubsidie,
      bedoeld in [artikel 2, onderdeel b][ref2], wordt in ieder geval afwijzend beslist indien de aanvraag voor
      de subsidie, bedoeld in [artikel 2, onderdeel a][ref3], de aanvraag voor de uitstroomsubsidie, bedoeld in
      [artikel 2, onderdeel b][ref4], het leer-/werktraject, of de uitstroom niet voldoet aan de op grond van deze
      regeling gestelde voorwaarden en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019310#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019310#Artikel2
    url: https://wetten.overheid.nl/BWBR0019310/2008-01-01#Artikel10
    references:
