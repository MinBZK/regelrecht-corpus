  - number: '4'
    text: |-
      1 De subsidie, bedoeld in [artikel 2, onderdeel a][ref1], en de uitstroomsubsidie, bedoeld in
      [artikel 2, onderdeel b][ref2], wordt aangevraagd door het college van burgemeester en wethouders van de gemeente
      jegens wie op grond van [artikel 40, eerste lid, van de Wet werk en bijstand][ref3] recht op bijstand bestaat bij
      de persoon op wie de subsidie bedoeld in [artikel 2, onderdeel a][ref4], betrekking heeft.

      2 De subsidie, bedoeld in [artikel 2, onderdeel a][ref5], en de uitstroomsubsidie, bedoeld in
      [artikel 2, onderdeel b][ref6], wordt verstrekt aan de subsidieaanvrager.


