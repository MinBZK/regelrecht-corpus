preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Financiën;

    Gelet op artikel 53 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Algemeen Kinderbijslagfonds: het Algemeen Kinderbijslagfonds, genoemd in
      [artikel 29a van de Algemene Kinderbijslagwet][ref2];

      d. AKW: de [Algemene Kinderbijslagwet][ref3];

      e. Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. uitgaven met betrekking tot het Algemeen Kinderbijslagfonds: de op grond van de
      [Algemene Kinderbijslagwet][ref5] uit te keren kinderbijslagen, alsmede de aan de uitvoering van de
      [Algemene Kinderbijslagwet][ref6] verbonden kosten;

      g. overige posten met betrekking tot het Algemeen Kinderbijslagfonds: de ontvangsten met betrekking tot de boeten
      verkregen met toepassing van [artikel 17a van de AKW][ref7], de besparingen met betrekking tot de maatregelen
      verkregen met toepassing van [artikel 17 van de AKW][ref8] en de uitgaven en ontvangsten met betrekking tot de
      interesten en diversen;

      h. valutadag: de op de rekening-courantafschriften aangegeven dag van betaling.


