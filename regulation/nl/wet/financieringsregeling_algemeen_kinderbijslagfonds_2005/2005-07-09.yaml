  - number: '2'
    text: |-
      1 Op de tiende dag van de maand voorafgaande aan het begin van een kwartaal verstrekt de SVB aan de Minister:

      a. een raming van de totale uitgaven met betrekking tot het Algemeen Kinderbijslagfonds voor het komende kwartaal,
      met een uitsplitsing naar maand; en

      b. een opgave van de gerealiseerde uitgaven met betrekking tot het Algemeen Kinderbijslagfonds in het vorige
      kwartaal, met een uitsplitsing naar maand.

      2 Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel2
  - number: '3'
    text: |-
      1 Met als valutadag de eerste dag van elke maand stort de Minister het bedrag van de geraamde uitgaven met
      betrekking tot het Algemeen Kinderbijslagfonds in die maand op de rekening-courant ten name van de SVB bij de
      Minister van Financiën. De Minister kan, na overleg met de SVB, van het geraamde bedrag afwijken.

      2 Met als valutadag de eerste dag van elk kwartaal verrekent de Minister het verschil tussen de gerealiseerde
      uitgaven en de geraamde uitgaven over het kwartaal gelegen twee kwartalen voor dat kwartaal met het bedrag, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel3
  - number: '4'
    text: |-
      1 In de raming, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], worden afzonderlijk vermeld:

      a. het totaalbedrag aan geraamde kinderbijslagen; en

      b. het totaalbedrag aan geraamde uitvoeringskosten.

      2 Het bedrag, bedoeld in het eerste lid, onderdeel a, wordt nader gespecificeerd in een bedrag dat betrekking heeft
      op het komende kwartaal en op bedragen die betrekking hebben op daaraan voorafgaande kwartalen.


      [ref1]: https://wetten.overheid.nl/BWBR0018522#Artikel2
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018522
        artikel: '2'
  - number: '5'
    text: |-
      1 In de opgave van de gerealiseerde uitgaven, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], wordt
      afzonderlijk vermeld:

      a. het totaalbedrag aan uitbetaalde kinderbijslagen; en

      b. het totaalbedrag aan gerealiseerde uitvoeringskosten.

      2 Het bedrag, bedoeld in het eerste lid, onderdeel a, wordt nader gespecificeerd in een bedrag dat betrekking heeft
      op het vorige kwartaal en in bedragen die betrekking hebben op daaraan voorafgaande kwartalen.


      [ref1]: https://wetten.overheid.nl/BWBR0018522#Artikel2
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018522
        artikel: '2'
  - number: '6'
    text: |-
      1 Uiterlijk op 1 juli dient de SVB de afrekening over het afgelopen kalenderjaar bij de Minister in.

      2 In de afrekening wordt, op basis van de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], de kasstroom
      inzichtelijk gemaakt en wordt deze afzonderlijk vermeld voor de uitgaven en overige posten met betrekking tot het
      Algemeen Kinderbijslagfonds.

      3 Op grond van de afrekening, bedoeld in het eerste lid, vindt voor 15 augustus een betaling plaats ten gunste of
      ten laste van het Algemeen Kinderbijslagfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '7'
    text: |-
      De Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van het
      Algemeen Kinderbijslagfonds over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel7
  - number: '8'
    text: |-
      De [Financieringsregeling Algemene Kinderbijslagwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009501
    url: https://wetten.overheid.nl/BWBR0018522/2005-07-09#Artikel8
    references:
