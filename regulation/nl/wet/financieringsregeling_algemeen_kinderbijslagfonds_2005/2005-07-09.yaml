        bwb_id: BWBR0009501
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, met uitzondering van de [artikelen 2, eerste lid][ref1], en [4][ref2], welke terugwerken tot en
      met 1 januari 2005.


