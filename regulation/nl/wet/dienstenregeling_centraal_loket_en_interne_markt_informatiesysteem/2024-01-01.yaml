  - number: '2'
    text: |-
      1 Een berichtenbox kan worden aangemaakt voor een dienstverrichter of een bevoegde instantie.

      2 Een dienstverrichter of een bevoegde instantie kan toegangsgegevens verkrijgen.

      3 Een dienstverrichter of een bevoegde instantie die over een berichtenbox en daarop betrekking hebbende
      toegangsgegevens beschikt, kan via de webinterface berichtenbox toegang tot die berichtenbox verkrijgen.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel2
  - number: '3'
    text: |-
      Een bevoegde instantie die via de webinterface berichtenbox toegang tot een berichtenbox heeft, wordt daarnaast
      de mogelijkheid geboden tot diezelfde berichtenbox toegang te verkrijgen door middel van een koppelvlak voor
      procedureberichten.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Een dienstverrichter of een bevoegde instantie met toegang tot een berichtenbox, heeft:

      a. de beschikking over adresseringsgegevens met betrekking tot die berichtenbox;

      b. via die berichtenbox toegang tot een lijst met adresseringsgegevens van alle berichtenboxen die voor bevoegde
      instanties zijn aangemaakt.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel4
  - number: '5'
    text: |-
      1 Een dienstverrichter met toegang tot een berichtenbox kan:

      a. daarin een procedurebericht invoegen of opstellen;

      b. van daaruit een procedurebericht verzenden naar een berichtenbox toegankelijk voor een bevoegde instantie;

      c. daarin een procedurebericht ontvangen;

      d. daarmee een ontvangen procedurebericht inzien, vernietigen of ongewijzigd overbrengen naar een systeem voor
      gegevensverwerking buiten het centraal loket.

      2 Een dienstverrichter met toegang tot een berichtenbox, krijgt een afschrift in zijn berichtenbox van een
      procedurebericht dat hij verzendt. Op een afschrift is het eerste lid, onderdeel d, van overeenkomstige toepassing.

      3 Een dienstverrichter met toegang tot een berichtenbox die een procedurebericht ontvangt, krijgt daarmee tevens de
      beschikking over de adresseringsgegevens van de berichtenbox van waaruit het bericht is verzonden.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een bevoegde instantie met toegang tot een berichtenbox kan van daaruit een procedurebericht verzenden naar een
      berichtenbox toegankelijk voor een dienstverrichter of een bevoegde instantie.

      2 [Artikel 5, eerste lid, onderdelen a, c en d, het tweede en derde lid][ref1], zijn van overeenkomstige toepassing
      op een bevoegde instantie met toegang tot een berichtenbox.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel5
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026766
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Indien een dienstverrichter of bevoegde instantie een procedurebericht vanuit een berichtenbox naar een andere
      berichtenbox zendt, wordt binnen het centraal loket het tijdstip geregistreerd waarop dat bericht de andere
      berichtenbox bereikt en wordt dit tijdstip op een voor de ontvanger toegankelijke wijze aan het desbetreffende
      bericht gehecht.

      2 Bij een registratie van een tijdstip als bedoeld in het eerste lid, wordt in ieder geval tevens geregistreerd de
      berichtenbox van waaruit het procedurebericht is verzonden.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Indien een verzonden procedurebericht een berichtenbox bereikt, wordt vanuit die berichtenbox een automatisch
      aangemaakt bericht verzonden naar een of meer systemen voor gegevensverwerking van de bevoegde instantie,
      dienstverrichter of persoon of ander als bedoeld in [artikel 10, tweede lid][ref1], die toegang tot die
      berichtenbox heeft, met de mededeling dat een nieuw bericht in die berichtenbox aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel10
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026766
        artikel: '10'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De vernietigingstermijn, bedoeld in [artikel 13, tweede lid, van de Dienstenwet][ref1], wordt gesteld op vijf
      jaren te rekenen vanaf de aanwezigheid van een bericht in een berichtenbox. Voor de toepassing van de vorige volzin
      wordt onder bericht tevens een afschrift van een bericht verstaan.

      2 Het centraal loket is zodanig ingericht dat ten minste zes weken voorafgaand aan een vernietiging van een
      bericht, bedoeld in het eerste lid, een automatisch aangemaakt bericht naar die berichtenbox wordt verzonden,
      waarin die vernietiging wordt aangekondigd.

      3 Bij de vernietiging van een bericht, bedoeld in het eerste lid, wordt tevens het bericht van aankondiging,
      bedoeld in het tweede lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel13
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '13'
  - number: '10'
    text: |-
      1 Er is een machtigingsvoorziening berichtenbox beschikbaar, waarvan een dienstverrichter met toegang tot een
      berichtenbox gebruik kan maken via de website die deel uitmaakt van het centraal loket.

      2 Met behulp van een machtigingsvoorziening berichtenbox kan een dienstverrichter die toegang tot een voor hem
      aangemaakte berichtenbox heeft, een persoon die voor hem werkzaam is of een ander die in zijn opdracht betrokken
      is bij de afwikkeling van procedures en formaliteiten eveneens toegang tot die berichtenbox verschaffen met andere
      toegangsgegevens dan waarover de dienstverrichter zelf beschikt.

      3 Een dienstverrichter kan de toegang tot een berichtenbox voor de persoon of ander, bedoeld in het tweede lid,
      ongedaan maken.

      4 Het eerste tot en met derde lid is van overeenkomstige toepassing op een bevoegde instantie met toegang tot een
      berichtenbox.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel10
  - number: '11'
    text: |-
      1 Er is een verwijzingscatalogus loketinformatie beschikbaar met behulp waarvan een complex webformulier kan worden
      ontsloten via de website die van het centraal loket deel uitmaakt.

      2
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel11
  - number: '12'
    text: |-
      1 Een kritische functie van het centraal loket is gedurende ieder kalenderjaar ten minste 97 procent van de tijd
      beschikbaar.

      2 Onder een kritische functie als bedoeld in het eerste lid, wordt verstaan een functie met betrekking
      tot het centraal loket, bedoeld in [artikel 2, derde lid][ref1], of één van de functies, bedoeld in de
      [artikelen 3 tot en met 8][ref2].

      3 De tijdsduur gedurende welke een kritische functie als bedoeld in het tweede lid, niet beschikbaar is, blijft bij
      de berekening van het percentage, bedoeld in het eerste lid, buiten beschouwing, indien dit het gevolg is van een
      calamiteit of van een geplande uitvoering van onderhoud, vervanging of uitbreiding met betrekking tot het centraal
      loket.

      4 Bij een geplande uitvoering van onderhoud, vervanging of uitbreiding met betrekking tot het centraal loket, zijn
      de kritische functies van dit loket gedurende die uitvoering ten hoogste tweemaal per kalendermaand in de nachten
      van vrijdag op zaterdag tussen 01.00 uur en 07.00 uur niet beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026766#Artikel3
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel12
    references:
