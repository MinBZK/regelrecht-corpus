    Gelet op de artikelen 6, 8 en 21 van richtlijn nr. 2006/123/EG van het Europees Parlement en de Raad van de
    Europese Unie van 12 december 2006 betreffende de diensten op de interne markt (PbEU L 376), de beschikking
    2009/739/EG van de Commissie van 2 oktober 2009 tot vaststelling van de praktische regels voor de uitwisseling van
    informatie via elektronische middelen tussen de lidstaten uit hoofde van hoofdstuk VI van richtlijn nr. 2006/123/
    EG van het Europees Parlement en de Raad van de Europese Unie van 12 december 2006 betreffende de diensten op
    de interne markt (PbEU L 376), en de artikelen 10, 13, tweede lid, 14, tweede lid, artikel 21, 52 en 60 van de
    Dienstenwet, artikel 8, van het Dienstenbesluit centraal loket en artikel 2:15, eerste lid, tweede volzin, van de
    Algemene wet bestuursrecht;

