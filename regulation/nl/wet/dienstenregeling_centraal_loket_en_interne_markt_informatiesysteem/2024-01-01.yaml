  - number: '24'
    text: |-
      1 In afwijking van [artikel 16, eerste lid][ref1], draagt Onze Minister er zorg voor dat een toegang voor een
      bevoegde instantie tot een betafase-berichtenbox vanaf het tijdstip van inwerkingtreding van deze regeling is
      omgezet in een toegang tot een berichtenbox via de webinterface berichtenbox.

      2 In afwijking van [artikel 20][ref2] draagt Onze Minister er zorg voor dat een bevoegde instantie die voorafgaand
      aan de inwerkingtreding van deze regeling toegang tot de hulpvoorziening loketinformatie had, vanaf het tijdstip
      van inwerkingtreding van deze regeling toegang tot die hulpvoorziening kan blijven behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel16
