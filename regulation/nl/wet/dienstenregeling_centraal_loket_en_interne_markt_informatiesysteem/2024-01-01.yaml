  - number: '14'
    text: |-
      De [artikelen 1 tot en met 9][ref1] zijn tevens van toepassing op het via het centraal loket kunnen verzenden en
      ontvangen van een bijstandsbericht, met dien verstande dat voor ‘een bevoegde instantie’ telkens wordt gelezen Onze
      Minister, voor ‘dienstverrichter’: zakelijke afnemer, en voor ‘procedurebericht’: bijstandsbericht.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel1
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026766
        artikel: '1'
        paragraaf: '1'
  - number: '15'
    text: |-
      1 Voor een dienstverrichter wordt een berichtenbox aangemaakt en komen toegangsgegevens beschikbaar, indien hij
      via het centraal loket aan Onze Minister de aanmeldingsgegevens, bedoeld in paragraaf 2 van de bijlage bij deze
      regeling, verstrekt.

      2 Een dienstverrichter waarvoor een berichtenbox is aangemaakt en die over toegangsgegevens beschikt, heeft toegang
      tot die berichtenbox indien hij zorg draagt voor een verbinding tussen een eigen systeem voor gegevensverwerking en
      de webinterface berichtenbox.

      3 Een dienstverrichter met toegang tot een berichtenbox kan met behulp van de machtigingsvoorziening berichtenbox
      toegang tot die berichtenbox verschaffen aan een persoon die voor hem werkzaam is of aan een ander die in
      zijn opdracht betrokken is bij de afwikkeling van procedures en formaliteiten, indien de dienstverrichter de
      aanmeldingsgegevens, bedoeld in paragraaf 3 van de bijlage bij deze regeling, aan Onze Minister heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel15
  - number: '16'
    text: |-
      1 Ten behoeve van een bevoegde instantie wordt een berichtenbox aangemaakt en komen toegangsgegevens beschikbaar om
      via de webinterface berichtenbox toegang tot die berichtenbox te kunnen verkrijgen, indien een persoon die namens
      die bevoegde instantie met het realiseren hiervan is belast aan Onze Minister verstrekt:

      a. een ondertekend schriftelijk verzoek dat strekt tot aansluiting op het centraal loket via de webinterface
      berichtenbox;

      b. bescheiden waaruit de machtiging om namens de bevoegde instantie het verzoek, bedoeld in onderdeel a, te doen,
      blijkt of een mededeling dat die bevoegdheid blijkt uit een openbaar register;

      c. de aanmeldingsgegevens, bedoeld in paragraaf 4 van de bijlage bij deze regeling.

      2 Een bevoegde instantie waarvoor een berichtenbox is aangemaakt en die over toegangsgegevens beschikt,
      heeft toegang tot die berichtenbox indien zij zorg draagt voor een verbinding tussen een eigen systeem voor
      gegevensverwerking en de webinterface berichtenbox.
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel16
  - number: '17'
    text: |-
      Een bevoegde instantie die met inachtneming van [artikel 16][ref1] toegang heeft tot een berichtenbox,
      heeft vervolgens tevens tot die berichtenbox toegang door middel van een aansluiting op het koppelvlak voor
      procedureberichten, indien:

      a. een persoon die namens de bevoegde instantie met het realiseren daarvan is belast, een door hem ondertekende
      schriftelijk verzoek als bedoeld in [artikel 16, eerste lid, onderdeel a][ref2], en een machtiging als bedoeld in
      artikel 16, eerste lid, onderdeel b, verstrekt, met dien verstande dat die op een aansluiting op het koppelvlak
      voor procedureberichten betrekking hebben;

      b. zij met inachtneming van de specificaties en kenmerken van dat koppelvlak zorg draagt voor een verbinding die
      tot stand komt tussen een systeem voor gegevensverwerking waar zij toegang tot heeft en die berichtenbox.


      [ref1]: https://wetten.overheid.nl/BWBR0026766#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0026766#Artikel16
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026766
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026766
        artikel: '16'
        paragraaf: '3'
  - number: '18'
    text: |-
      1 Een complex webformulier wordt met behulp van de verwijzingscatalogus loketinformatie ontsloten via de website
      die van het centraal loket deel uitmaakt, indien een bevoegde instantie:

      a. voldoet aan de specificaties en kenmerken, bedoeld paragraaf 5 van de bijlage bij deze regeling, waardoor
      metagegevens met betrekking tot een complex webformulier worden aangemaakt en beschikbaar worden gesteld voor
      opname in de verwijzingscatalogus loketinformatie;

      b. zorg draagt voor een verbinding tussen het systeem voor gegevensverwerking van de bevoegde instantie en
      het centraal loket, waarbij die verbinding voldoet aan de specificaties en kenmerken van het koppelvlak voor
      procedureberichten;

      c. de verbinding, bedoeld onder b, op zodanige wijze tot stand brengt dat een dienstverrichter die de wens daartoe
      voldoende kenbaar heeft gemaakt, in diens berichtenbox geautomatiseerd een afschrift van een door hem naar die
      bevoegde instantie verzonden complex webformulier ontvangt.

      2 Het eerste lid, onder c, is niet van toepassing op de landelijke voorziening van het digitaal stelsel
      Omgevingswet, bedoeld in [artikel 20.21 van de Omgevingswet][ref1], indien het ingediende complexe webformulier
      via die landelijke voorziening door de dienstverrichter kan worden ingezien en hij het formulier op zijn computer
      kan opslaan.

      3 Een bevoegde instantie kan in plaats van te voldoen aan de voorwaarden, bedoeld in het eerste lid, onderdelen b
      en c, aan Onze Minister schriftelijk meedelen zelf telkens onverwijld zorg te zullen dragen voor het verzenden van
      een afschrift van een ontvangen complex webformulier naar de berichtenbox van een dienstverrichter, die de wens
      daartoe voldoende kenbaar heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20.21
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '20.21'
  - number: '19'
    text: |-
      1 Ten behoeve van een goede uitvoering door Onze Minister van de [artikelen 7][ref1] en
      [17, onderdelen a, c, en e, van de Dienstenwet][ref2], voldoet een bevoegde instantie met betrekking tot de
      informatie, bedoeld in de [artikelen 8][ref3] en [19 van de Dienstenwet][ref4], aan de specificaties en kenmerken,
      bedoeld in paragraaf 5 van de bijlage van deze regeling, waardoor metagegevens die op die informatie betrekking
      hebben worden aangemaakt en beschikbaar worden gesteld voor opname in de verwijzingscatalogus loketinformatie.

      2 Een bevoegde instantie maakt voorts de informatie bedoeld in de [artikelen 8, eerste lid, onderdeel a][ref5], en
      [19, onderdeel a, van de Dienstenwet][ref6] voor zover deze betrekking heeft op de informatie, bedoeld in artikel
      8, eerste lid, onderdeel a, van de Dienstenwet langs elektronische weg toegankelijk door middel van het meldings-
      en notificatiesysteem Dienstenwet.

      3 Het tweede lid is niet van toepassing op informatie die op het niveau van de rijksoverheid wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel7
