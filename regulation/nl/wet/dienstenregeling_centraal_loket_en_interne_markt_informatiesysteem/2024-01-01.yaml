articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *berichtenbox:* een beveiligde elektronische postbus die deel uitmaakt van de elektronische omgeving van het
      centraal loket;

      b. *toegangsgegevens:* gegevens die toegang verschaffen tot een berichtenbox;

      c. *webinterface berichtenbox:* een applicatie die toegankelijk is via de website die deel uitmaakt van het
      centraal loket en geschikt is om met handmatige invoering van toegangsgegevens toegang te verschaffen tot een
      berichtenbox;

      d. *adresseringsgegevens:* gegevens waarmee ten behoeve van verzending of ontvangst van procedureberichten
      op een voor dienstverrichters en bevoegde instanties bruikbare wijze een berichtenbox langs elektronische weg
      geïdentificeerd kan worden;

      e. *koppelvlak voor procedureberichten*: het geheel van standaarden, bedoeld in paragraaf 1 van de bijlage bij
      deze regeling, waarvan het gebruik voorwaarde is om geautomatiseerde uitwisseling van procedureberichten mogelijk
      te maken tussen een systeem voor gegevensverwerking van een bevoegde instantie buiten het centraal loket en een
      berichtenbox waar zij toegang tot heeft;

      f. *machtigingsvoorziening berichtenbox:* een voorziening met behulp waarvan een dienstverrichter die toegang
      tot een voor hem aangemaakte berichtenbox heeft, die toegang kan uitbreiden en ongedaan maken voor personen die
      voor hem of haar werkzaam zijn en voor anderen die in zijn of haar opdracht betrokken zijn bij de afwikkeling van
      procedures en formaliteiten;

      g. *complex webformulier:* een door een bevoegde instantie vastgesteld formulier dat op procedures en formaliteiten
      betrekking heeft en waarbij met betrekking tot dit formulier is voldaan aan de voorwaarden, bedoeld in
      [artikel 4, tweede lid, van het Dienstenbesluit centraal loket][ref1];

      h. *verwijzingscatalogus loketinformatie:* een applicatie die het geheel aan door bevoegde instanties langs
      elektronische weg toegankelijk gemaakte complexe webformulieren en informatie, bedoeld in de [artikelen 8][ref2] en
      [19 van de Dienstenwet][ref3], samenhangend categoriseert met behulp van metagegevens;

      i. *meldings- en notificatiesysteem Dienstenwet:* een applicatie met behulp waarvan een bevoegde instantie de
      informatie, bedoeld in [artikel 8, eerste lid, onderdeel a, van de Dienstenwet][ref4] aanmaakt en beschikbaar stelt
      voor opname in de verwijzingscatalogus loketinformatie of het centraal loket;

      j. *betafase-berichtenbox:* een testversie van de berichtenbox waar een bevoegde instantie onder voorwaarden tot
      uiterlijk de inwerkingtreding van deze regeling toegang kon verkrijgen;

      k. *uitvoeringsbeschikking IMI:* beschikking van de Commissie van 2 oktober 2009 tot vaststelling van de praktische
      regels voor de uitwisseling van informatie via elektronische middelen tussen de lidstaten uit hoofde van hoofdstuk
      VI van [Richtlijn 2006/123/EG](32006L0123) van het Europees Parlement en de Raad betreffende diensten op de interne
      markt (PbEU L 263).


      [ref1]: https://wetten.overheid.nl/BWBR0026761#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0026759#Artikel8
