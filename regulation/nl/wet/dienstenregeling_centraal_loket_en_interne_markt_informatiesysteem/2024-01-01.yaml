  - number: '23'
    text: |-
      1 Via het interne markt informatiesysteem kan een bevoegde instantie die betrokken is bij een of meer eisen of
      vergunningstelsels als bedoeld in [artikel 2 van de Dienstenwet][ref1] ten aanzien van een door hem verzonden
      kennisgeving als bedoeld in [artikel 51 van de Dienstenwet][ref2]:

      a. aanvullende informatie verzenden;

      b. informatie opgenomen in deze kennisgeving corrigeren;

      c. een voorstel verzenden tot het sluiten van de kennisgeving;

      d. zich verzetten tegen een voorstel tot het sluiten van de kennisgeving.

      2 Via het interne markt informatiesysteem kan een bevoegde instantie een door hem verzonden
      kennisgeving als bedoeld in het eerste lid intrekken, indien deze niet voldoet aan de eisen, genoemd in
      [artikel 51, eerste lid, van de Dienstenwet][ref3].

      3 Een bevoegde instantie als bedoeld in het eerste lid die op grond van artikel 29, derde lid, of artikel 32,
      eerste lid, van de richtlijn een kennisgeving ontvangt van een bevoegde instantie uit een andere lidstaat kan via
      het interne markt informatiesysteem ten aanzien daarvan:

      a. aanvullende informatie verzoeken;

      b. een voorstel verzenden tot het sluiten van de kennisgeving;

      c. zich verzetten tegen een voorstel tot het sluiten van de kennisgeving.

      4 Van een correctie van de informatie opgenomen in de kennisgeving of van het intrekken van een kennisgeving als
      bedoeld in het tweede lid, wordt mededeling gedaan aan de dienstverrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel51
