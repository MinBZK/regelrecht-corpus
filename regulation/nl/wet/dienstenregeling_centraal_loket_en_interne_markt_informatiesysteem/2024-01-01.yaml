  - number: 20b
    text: |-
      Het centraal loket is zodanig ingericht dat het ten behoeve van de bevoegde instanties documenten kan verwerken
      die elektronisch ondertekend zijn met een geavanceerde elektronische XML-, CMS- of PDF-handtekening in het BES-
      of EPES-formaat en die voldoet aan de technische specificaties uit de bijlage van besluit nr. 2011/130/EU van de
      Commissie van 25 februari 2011 tot vaststelling van minimumvoorschriften voor de grensoverschrijdende verwerking
      van documenten die door de bevoegde autoriteiten elektronisch zijn ondertekend krachtens Richtlijn 2006/123/EG van
      het Europees Parlement en de Raad betreffende diensten op de interne markt (PbEU L 53).
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel20b
  - number: '21'
    text: |-
      Het contactpunt, bedoeld in [artikel 55 van de Dienstenwet][ref1], vervult in het interne markt informatiesysteem
      de functionaliteiten van:

      a. IMI-coördinator, bedoeld in artikel 1, tweede lid, van de Uitvoeringsbeschikking IMI;

      b. waarschuwingscoördinator, bedoeld in artikel 3, tweede lid, van de Uitvoeringsbeschikking IMI;

      c. coördinator, bedoeld in artikel 4, onderdeel d, van de Uitvoeringsbeschikking IMI.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026766/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '55'
  - number: '22'
    text: |-
      1 Een bevoegde instantie neemt een verzoek als bedoeld in de [artikelen 37][ref1], [40][ref2] of
      [41 van de Dienstenwet][ref3] in behandeling door het verzoek via het interne markt informatiesysteem te accepteren
      of het door te zenden naar een andere bevoegde instantie of naar het contactpunt.

      2 Een bevoegde instantie kan via het interne markt informatiesysteem ten aanzien van een verzoek als bedoeld in de
      [artikelen 37][ref4], [39 tot en met 41][ref5] of [44 van de Dienstenwet][ref6] aanvullende informatie verzoeken
      of verzenden.


