        artikel: '3'
        paragraaf: '2'
  - number: '13'
    text: |-
      De nodige maatregelen van technische en organisatorische aard ter beveiliging van het centraal loket, bedoeld
      in [artikel 7, eerste tot en met derde lid, van het Dienstenbesluit centraal loket][ref1] hebben in ieder geval
      betrekking op:

      a. het vaststellen en beschrijven van de functies, bevoegdheden en verantwoordelijkheden van de personen, werkzaam
      voor Onze Minister ten aanzien van het centraal loket, waarbij een duidelijk onderscheid wordt gemaakt tussen de
      aandachtsgebieden ontwikkeling en exploitatie van het centraal loket en tussen functioneel en technisch beheer
      daarvan;

      b. de beschikbaarheid van de deskundigheid en bekwaamheid waarover de personen binnen de functies, bedoeld onder a,
      moeten beschikken;

      c. de integriteit van voor Onze Minister werkzame personen, bedoeld onder a;

      d. de omgeving en ruimtes waarin apparatuur is opgesteld en programmatuur zich bevindt, alsmede de kwaliteit, de
      installatie, het onderhoud, het configuratiebeheer en de wijze van testen van die apparatuur en programmatuur;

      e. de beschikbaarheid, het gebruik en het beheer van middelen die toegang bieden aan daartoe bevoegde personen
      tot gebouwen en ruimten waar apparatuur en programmatuur die van het centraal loket deel uitmaken, is opgesteld
      respectievelijk zich bevindt;

      f. de bescherming tegen onbevoegde toegang tot apparatuur, programmatuur, verbindingen en daarin aanwezige gegevens
      tegen aantasting, vernietiging, verlies, wijziging, of onbevoegde verstrekking;

      g. het aanmaken van toegangsgegevens en het wijzigen daarvan;

      h. het doorgeven van wijzigingen in de aanmeldingsgegevens, bedoeld in de bijlage bij deze regeling;

      i. het voorkomen van misbruik van toegang tot een berichtenbox en de mogelijkheden tot herstel, tijdelijke
      opschorting of definitieve beëindiging van de toegang tot een berichtenbox in geval van misbruik, van dreiging van
      misbruik, of van verlies van toegangsgegevens;

      j. het vaststellen en beschrijven van de functies, bevoegdheden en verantwoordelijkheden van de personen betrokken
      bij de verwerking van persoonsgegevens waarvoor Onze Minister verwerkingsverantwoordelijke is op grond van
      [artikel 16, tweede lid, van de Dienstenwet][ref2];

      k. het vaststellen en beschrijven van verantwoordelijkheden en te volgen werkprocessen in het geval van een
      calamiteit, waaronder de beschikbaarheid van uitwijkfaciliteiten voor dat geval.


      [ref1]: https://wetten.overheid.nl/BWBR0026761#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel16
