  - number: 20a
    text: |-
      1 Voor de toepassing van [artikel 14, vijfde lid, van de Dienstenwet][ref1] zijn de genoemde elektronische
      handtekeningen, bedoeld in de aanhef van dat artikellid de elektronische handtekeningen, die:

      a. ten aanzien van de gebruikte methode voor authenticatie voldoen aan de bij of krachtens verordening (EU)
      nr. 910/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie en
      vertrouwensdiensten voor elektronische transacties in de interne markt en tot intrekking van richtlijn 1999/93/
      EG (PbEU 2014, L 257) gestelde eisen aan een gekwalificeerde elektronische handtekening als bedoeld in artikel 3,
      onderdeel 12, van die verordening,

      b. ten aanzien van de gebruikte methode voor authenticatie voldoen aan de bij of krachtens verordening (EU)
      nr. 910/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie en
      vertrouwensdiensten voor elektronische transacties in de interne markt en tot intrekking van richtlijn 1999/93/
      EG (PbEU 2014, L 257) gestelde eisen aan een geavanceerde elektronische handtekening als bedoeld in artikel 3,
      onderdeel 11, van die verordening en die zijn gebaseerd op een gekwalificeerd certificaat voor elektronische
      handtekeningen als bedoeld in artikel 3, onderdeel 15, van diezelfde verordening, of

      c. voldoen aan de bij of krachtens verordening (EU) nr. 910/2014 van het Europees Parlement en de Raad van 23 juli
      2014 betreffende elektronische identificatie en vertrouwensdiensten voor elektronische transacties in de interne
      markt en tot intrekking van richtlijn 1999/93/EG (PbEU 2014, L 257) aan een elektronische handtekening als bedoeld
      in artikel 3, onderdeel 10, van die verordening gestelde eisen.

      2 Voor de toepassing van [artikel 14, vijfde lid, van de Dienstenwet][ref2] is de elektronische handtekening met
      het laagste niveau van betrouwbaarheid, bedoeld in onderdeel b van dat artikellid, de elektronische handtekening,
      bedoeld in het eerste lid, onderdeel c.

      3 Het eerste lid is niet van toepassing op een elektronische handtekening, bedoeld in het eerste lid,
      onderdeel a of b, indien daarbij gebruik is gemaakt van een gekwalificeerd certificaat als bedoeld in
      [artikel 1.1 van de Telecommunicatiewet][ref3], waarbij de naam van de ondertekenaar die in dat certificaat staat
      vermeld een als zodanig geïdentificeerd pseudoniem betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel1.1
