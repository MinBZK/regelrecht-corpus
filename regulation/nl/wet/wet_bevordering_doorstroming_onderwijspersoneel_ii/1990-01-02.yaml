preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het resultaat van de met ingang van 1 januari 1989 afgelopen Wet
    bevordering doorstroming onderwijspersoneel (Stb. 1988, 253) het wenselijk maakt totstandkoming van een nieuwe,
    voor 1989 geldende, doorstromingsregeling voor uit 's Rijks kas bekostigd onderwijspersoneel te bevorderen, waarmee
    dezelfde doeleinden worden nagestreefd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004586/1990-01-02#ArtikelAanhef
articles:
  - number: '18'
    text: In afwijking van het bepaalde in artikel 18 van de DOP-wet vindt artikel 12 van die wet geen toepassing.
    url: https://wetten.overheid.nl/BWBR0004586/1990-01-02#Artikel18
  - number: '19'
    text: |-
      Indien het bij koninklijke boodschap van 29 april 1986 ingediende voorstel van Wet houdende wijziging van de
      Wet uitkering wegens vrijwillig vervroegd uittreden (*Stb.* 1984, 273) in verband met voorgenomen wijziging
      van het VUT-financieringsstelsel (kamerstuk 19 505) tot wet wordt verheven en in werking is getreden, wordt,
      onderscheidenlijk worden,

      1. en

      2. in afwijking van het bepaalde in artikel 18 van de DOP-wet I de rechten en verplichtingen, ontleend aan artikel
      15 van die wet, met ingang van het tijdstip van inwerkingtreding van de in de aanhef van dit artikel bedoelde wet
      vastgesteld overeenkomstig het bepaalde in [artikel 15][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004586#Artikel15
    url: https://wetten.overheid.nl/BWBR0004586/1990-01-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004586
        artikel: '15'
  - number: '20'
    text: |-
      Ten aanzien van uitkeringen krachtens deze wet blijven de rechten en verplichtingen ontleend aan de bepalingen van
      deze wet in stand na afloop van de werkingsduur van de wet.
    url: https://wetten.overheid.nl/BWBR0004586/1990-01-02#Artikel20
