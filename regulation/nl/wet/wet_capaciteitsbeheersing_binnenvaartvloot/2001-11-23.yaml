$id: wet_capaciteitsbeheersing_binnenvaartvloot
regulatory_layer: WET
publication_date: '2014-12-31'
valid_from: '2001-11-23'
bwb_id: BWBR0012950
url: https://wetten.overheid.nl/BWBR0012950/2001-11-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke bepalingen vast te stellen ter
    uitvoering van de Verordening nr. 718/1999 van de Raad van de Europese Unie van 29 maart 1999 betreffende het
    beleid ten aanzien van de capaciteit van de communautaire binnenvaartvloot met het oog op de bevordering van het
    vervoer over de binnenwateren (PbEG L 90), mede in verband met het door de Verdragsluitende Staten op 28 april
    1999 te Straatsburg ter zake van een uniforme toepassing van voornoemde verordening in alle Verdragsluitende
    Staten ondertekende Aanvullend Protocol nr. 5 bij de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene
    Rijnvaartakte (Trb. 1955, 161), alsmede de daarop betrekking hebbende Verklaring van de Overeenkomstsluitende
    Staten op grond waarvan het Aanvullend Protocol nr. 5 voorlopig kan worden toegepast voordat alle akten van
    bekrachtiging zijn nedergelegd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: 1.a
    text: |-
      Raadsverordening: [Verordening nr. 718/1999](31999R0718) van de Raad van de Europese Unie van 29 maart 1999
      betreffende het beleid ten aanzien van de capaciteit van de communautaire binnenvaartvloot met het oog op de
      bevordering van het vervoer over de binnenwateren (PbEG L 90);
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: 1.b
    text: |-
      Commissieverordening: [Verordening nr. 805/1999](31999R0805) van de Commissie van de Europese Gemeenschappen van 16
      april 1999 tot vaststelling van een aantal bepalingen ter uitvoering van de Raadsverordening (PbEG L 102/64);
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: 1.c
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: 1.d
    text: 'lidstaten: de betrokken lidstaten, bedoeld in artikel 3, eerste lid, van de Raadsverordening;'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: 1.e
    text: 'fonds voor de binnenvaart: artikel 05.34 van de begroting van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel1
  - number: '2.1'
    text: Er is een fonds voor de binnenvaart. Onze Minister beheert het fonds.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: '2.2'
    text: |-
      Het fonds voor de binnenvaart omvat de ontvangsten en de uitgaven met betrekking tot de beheersing van de
      capaciteit van de binnenvaartvloot met het oog op de bevordering van het vervoer over de binnenwateren en met
      betrekking tot de maatregelen, bedoeld in artikel 8 van de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: '2.3'
    text: 'De ontvangsten zijn:'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: 2.3.a
    text: bijdragen als bedoeld in artikel 3, derde lid, van de Raadsverordening;
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: 2.3.b
    text: bijdragen van lidstaten en van Zwitserland als bedoeld in artikel 3, zesde lid, van de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: '2.4'
    text: De uitgaven zijn uitgaven als bedoeld in artikel 3, vierde, vijfde en zesde lid, van de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel2
  - number: '3'
    text: |-
      De organisaties, bedoeld in artikel 3, tweede lid, van de Raadsverordening zijn de organisaties op het terrein van
      de binnenvaart, vertegenwoordigd in het Permanent overlegorgaan goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel3
  - number: '4'
    text: |-
      Onze Minister legt, overeenkomstig het terzake bepaalde in de Commissieverordening, speciale bijdragen als bedoeld
      in artikel 4, eerste lid, tweede gedachtenstreepje, van de Raadsverordening op en doet de uitgaven in het kader van
      artikel 3, vierde, vijfde en zesde lid, van de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de uitvoering van de artikelen 4 en 6 van de
      Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel5
  - number: '6'
    text: |-
      Het is de eigenaar verboden zijn binnenschip in de vaart te brengen in afwijking van artikel 4, eerste lid, van
      de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel6
  - number: '7'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet, de Raadsverordening en de Commissieverordening
      bepaalde zijn belast:
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel7
  - number: 7.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 7.b
    text: de ambtenaren van de rijksbelastingdienst bevoegd inzake douane,
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel7
  - number: 7.c
    text: de door Onze Minister aangewezen ambtenaren van het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel7
  - number: '8'
    text: |-
      Is een speciale bijdrage als bedoeld in [artikel 4, eerste lid][ref1], tweede gedachtestreepje, van de
      Raadsverordening geheel of gedeeltelijk nietvoldaan op het moment, bedoeld in artikel 4, derde lid, van de
      Raadsverordening, dan maant Onze Minister de nalatige schriftelijk aan om hem alsnog binnen veertien dagen na
      ontvangst van de aanmaning het desbetreffende bedrag te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0012950#Artikel4
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012950
        artikel: '4'
  - number: '9'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel9
  - number: '10'
    text: |-
      Tegen een op grond van deze wet genomen beschikking kan een belanghebbende beroep instellen bij het College van
      beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel10
  - number: '11'
    text: De Wet sloopregeling binnenvaart wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel11
  - number: '13'
    text: |-
      Met betrekking tot de behandeling van bezwaar of beroep tegen een krachtens de Wet structurele sanering binnenvaart
      genomen beschikking die voor het tijdstip van inwerkingtreding van deze wet is bekendgemaakt, blijft de Wet
      structurele sanering binnenvaart van toepassing.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel13
  - number: '14.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met 29 april 1999, met uitzondering van de [artikelen 6][ref1], [8][ref2],
      [9][ref3], [10][ref4] en [12, eerste lid][ref5], die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0012950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012950#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012950#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0012950#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0012950#Artikel12
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012950
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0012950
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0012950
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0012950
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0012950
        artikel: '12'
  - number: '14.2'
    text: Deze wet vervalt op het tijdstip waarop de Raadsverordening vervalt.
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet capaciteitsbeheersing binnenvaartvloot.'
    url: https://wetten.overheid.nl/BWBR0012950/2001-11-23#Artikel15
