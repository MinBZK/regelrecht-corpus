preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke bepalingen vast te stellen ter
    uitvoering van de Verordening nr. 718/1999 van de Raad van de Europese Unie van 29 maart 1999 betreffende het
    beleid ten aanzien van de capaciteit van de communautaire binnenvaartvloot met het oog op de bevordering van het
    vervoer over de binnenwateren (PbEG L 90), mede in verband met het door de Verdragsluitende Staten op 28 april
    1999 te Straatsburg ter zake van een uniforme toepassing van voornoemde verordening in alle Verdragsluitende
    Staten ondertekende Aanvullend Protocol nr. 5 bij de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene
    Rijnvaartakte (Trb. 1955, 161), alsmede de daarop betrekking hebbende Verklaring van de Overeenkomstsluitende
    Staten op grond waarvan het Aanvullend Protocol nr. 5 voorlopig kan worden toegepast voordat alle akten van
    bekrachtiging zijn nedergelegd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Raadsverordening: [Verordening nr. 718/1999](31999R0718) van de Raad van de Europese Unie van 29 maart 1999
      betreffende het beleid ten aanzien van de capaciteit van de communautaire binnenvaartvloot met het oog op de
      bevordering van het vervoer over de binnenwateren (PbEG L 90);

      b. Onze Minister: Onze Minister van Infrastructuur en Milieu;

      c. lidstaten: de betrokken lidstaten, bedoeld in artikel 3, eerste lid, van de Raadsverordening;

      d. fonds voor de binnenvaart: artikel 05.34 van de begroting van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel1
  - number: '2'
    text: |-
      1 Er is een fonds voor de binnenvaart. Onze Minister beheert het fonds.

      2 Het fonds voor de binnenvaart omvat de ontvangsten en de uitgaven met betrekking tot de beheersing van de
      capaciteit van de binnenvaartvloot met het oog op de bevordering van het vervoer over de binnenwateren en met
      betrekking tot de maatregelen, bedoeld in artikel 8 van de Raadsverordening.

      3 De ontvangsten zijn:

      a. bijdragen als bedoeld in artikel 3, derde lid, van de Raadsverordening;

      b. bijdragen van lidstaten en van Zwitserland als bedoeld in artikel 3, zesde lid, van de Raadsverordening.

      4 De uitgaven zijn uitgaven als bedoeld in artikel 3, vierde, vijfde en zesde lid, van de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel2
  - number: '3'
    text: |-
      De organisaties, bedoeld in artikel 3, tweede lid, van de Raadsverordening zijn de organisaties op het
      terrein van de binnenvaart, vertegenwoordigd in het Overlegorgaan infrastructuur en milieu, bedoeld in
      [artikel 4 van de Wet overleg infrastructuur en milieu][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008410#Artikel4
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008410
        artikel: '4'
  - number: '4'
    text: |-
      Onze Minister legt speciale bijdragen als bedoeld in artikel 4, eerste lid, tweede gedachtenstreepje, van
      de Raadsverordening op en doet de uitgaven in het kader van artikel 3, vierde, vijfde en zesde lid, van de
      Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de uitvoering van de artikelen 4 en 6 van de
      Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel5
  - number: '6'
    text: |-
      Het is de eigenaar verboden zijn binnenschip in de vaart te brengen in afwijking van artikel 4, eerste lid, van
      de Raadsverordening.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel6
  - number: '7'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet en de Raadsverordening bepaalde zijn belast:

      a. de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren,

      b. de door Onze Minister aangewezen ambtenaren van het Ministerie van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '8'
    text: |-
      Een speciale bijdrage als bedoeld in artikel 4, eerste lid, van de Raadsverordening wordt voldaan op het moment,
      bedoeld in artikel 4, derde lid, van de Raadsverordening, zonder dat dit bij beschikking is vastgesteld. Onze
      Minister is bevoegd tot uitvaardiging van een dwangbevel tot betaling van de speciale bijdrage.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel9
  - number: '11'
    text: De Wet sloopregeling binnenvaart wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel11
  - number: '12'
    text: |-
      1

      2
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel12
  - number: '13'
    text: |-
      Met betrekking tot de behandeling van bezwaar of beroep tegen een krachtens de Wet structurele sanering binnenvaart
      genomen beschikking die voor het tijdstip van inwerkingtreding van deze wet is bekendgemaakt, blijft de Wet
      structurele sanering binnenvaart van toepassing.
    url: https://wetten.overheid.nl/BWBR0012950/2015-01-01#Artikel13
  - number: '14'
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met 29 april 1999, met uitzondering van de [artikelen 6][ref1], [8][ref2],
      [9][ref3], [10][ref4] en [12, eerste lid][ref5], die in werking treden met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst.

      2 Deze wet vervalt op het tijdstip waarop de Raadsverordening vervalt.


