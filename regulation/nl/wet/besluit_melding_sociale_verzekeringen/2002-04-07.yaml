preamble:
  text: |-
    Gelet op artikel 50f van de Organisatiewet Sociale Verzekering (Stb. 1989, 119); Na overleg met de Minister van
    Financiën en gehoord de Sociale Verzekeringsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004559/2002-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De werkgever en de verzekerde zijn verplicht, ter uitvoering van de [artikelen 58, tweede lid][ref1], en
      [60, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], ten minste de volgende opgaven
      en inlichtingen te verstrekken:

      a. persoonsgegevens van de verzekerde:

        - sociaal-fiscaalnummer;
        - naam en adres;
        - geslacht;
        - geboortedatum;
        - burgerlijke staat;

      b. naam- en adresgegevens van de werkgever;

      c. gegevens van de arbeidsverhouding:

        - aard van de arbeidsverhouding en beroep;
        - datum aanvang arbeidsverhouding;
        - aanduiding van de wetten krachtens welke de verzekerde verzekerd is.

      2 De werkgever is verplicht de in het eerste lid bedoelde opgaven en inlichtingen door middel van een formulier,
      de melding sociale verzekeringen, aan het Uitvoeringsinstituut werknemersverzekeringen te verstrekken. De ingevulde
      melding sociale verzekeringen wordt door de werkgever en de verzekerde ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel60
    url: https://wetten.overheid.nl/BWBR0004559/2002-04-07#Artikel1
