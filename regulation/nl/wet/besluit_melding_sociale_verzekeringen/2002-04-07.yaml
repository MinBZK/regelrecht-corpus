  - number: '2'
    text: |-
      1 Het model van de in [artikel 1, tweede lid][ref1], bedoelde melding sociale verzekeringen wordt door het
      Uitvoeringsinstituut werknemersverzekeringen vastgesteld.

      2 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de werkgever de benodigde formulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0004559#Artikel1
    url: https://wetten.overheid.nl/BWBR0004559/2002-04-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004559
        artikel: '1'
  - number: '3'
    text: |-
      1 De werkgever verstrekt binnen één maand na aanvang van een nieuwe arbeidsverhouding, de opgaven en inlichtingen
      bedoeld in [artikel 1, eerste lid][ref1], aan het Uitvoeringsinstituut werknemersverzekeringen.

      2 De werkgever verstrekt binnen één maand na wijziging van een bestaande arbeidsverhouding, de opgaven
      en inlichtingen bedoeld in [artikel 1, eerste lid, onderdeel d][ref2], aan het Uitvoeringsinstituut
      werknemersverzekeringen.

      3 De werkgever deelt binnen één maand na beëindiging van een arbeidsverhouding aan het Uitvoeringsinstituut
      werknemersverzekeringen die beëindiging mede.


      [ref1]: https://wetten.overheid.nl/BWBR0004559#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004559#Artikel1
    url: https://wetten.overheid.nl/BWBR0004559/2002-04-07#Artikel3
    references:
