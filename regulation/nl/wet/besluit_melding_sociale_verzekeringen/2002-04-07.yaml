        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004559
        artikel: '1'
  - number: '4'
    text: |-
      1 Het Landelijk instituut sociale verzekeringen kan de werkgever toestaan de in de [artikelen 1][ref1] en
      [3][ref2] bedoelde opgaven overeenkomstig daartoe door het Uitvoeringsinstituut werknemersverzekeringen te geven
      aanwijzingen te doen met behulp van geautomatiseerd te verwerken gegevensdragers of op andere door het Landelijk
      instituut sociale verzekeringen aan te geven wijze op voorwaarden dat:

      a. de administratie van de werkgever naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen
      voorziet in betrouwbare gegevensvastlegging en de mogelijkheid biedt voor controle door het Uitvoeringsinstituut
      werknemersverzekeringen van de geautomatiseerd aangeleverde gegevens;

      b. de geautomatiseerd aan te leveren gegevens slechts ontleend worden aan de betalingsadministratie van de
      werkgever waaruit aan de verzekerde kennis gegeven wordt van aan hem verrichte of te verrichten betalingen en welke
      administratie voldoet aan het bepaalde in het Loonadministratiebesluit (Stcrt. 1987, 252);

      c. de werkgever de verzekerde bij indiensttreding er schriftelijk kennis van geeft, welke gegevens aan het
      Uitvoeringsinstituut werknemersverzekeringen worden verstrekt en dat de verzekerde verplicht is daartoe de juiste
      opgaven en inlichtingen te verstrekken;

      d. de werkgever de verzekerde door middel van het uitreiken van een brochure met toelichting en een in de
      werkruimte op te hangen kaart inlicht omtrent de verplichting tot en de inhoud en procedure van het inzenden van de
      melding sociale verzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de werkgever de benodigde
      brochures en kaarten.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan met betrekking tot het gestelde in het eerste lid, onder b,
      en c, aan de werkgever aanwijzingen geven.

      3 Het Uitvoeringsinstituut werknemersverzekeringen trekt de toestemming als bedoeld in het eerste lid in, indien
      naar haar oordeel de werkgever niet langer voldoet aan de gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004559#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004559#Artikel3
