---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderwet_vws_subsidies
regulatory_layer: WET
publication_date: '2024-10-21'
valid_from: '2025-01-01'
bwb_id: BWBR0009455
url: https://wetten.overheid.nl/BWBR0009455/2025-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt een wettelijk kader te scheppen voor de verstrekking van subsidies op het terrein van de
    volksgezondheid door de Minister van Volksgezondheid, Welzijn en Sport;

    Zo is het, dat Wij, de Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goed vinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel1
  - number: '2'
    text: 'Onze Minister kan subsidies en specifieke uitkeringen verstrekken voor activiteiten op het terrein van:'
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: 2.a
    text: de gezondheidsbevordering;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: 2.b
    text: de gezondheidsbescherming;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: 2.c
    text: de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: 2.d
    text: de maatschappelijke zorg, waaronder de jeugdhulp, voor zover van landelijke betekenis;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: 2.e
    text: de sport, voor zover van landelijke betekenis.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel van
      bestuur of bij regeling van Onze Minister de activiteiten waarvoor een subsidie of een specifieke uitkering kan
      worden verstrekt nader worden bepaald alsmede andere criteria voor die verstrekking worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008290
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen voorts regels worden
      gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.a
    text: het bedrag van de subsidie of specifieke uitkering dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.b
    text: de aanvraag van de subsidie of specifieke uitkering en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.c
    text: de voorwaarden waaronder een subsidie of een specifieke uitkering kan worden verleend;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.d
    text: de verplichtingen verbonden aan de subsidie of de specifieke uitkering;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.e
    text: de vaststelling van de subsidie of specifieke uitkering;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.f
    text: |-
      de intrekking en wijziging van de subsidieverlening, subsidievaststelling of verlening of vaststelling van de
      specifieke uitkering;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.g
    text: de betaling van de subsidie of specifieke uitkering en de verlening van voorschotten;
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: 3.2.h
    text: |-
      het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.3'
    text: |-
      Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in
      het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, voor zover het subsidie betreft,
      delegeren aan andere bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister is bevoegd persoonsgegevens, waaronder gegevens over gezondheid en andere bijzondere categorieën
      van persoonsgegevens, van degene die de subsidie aanvraagt dan wel van degene die anderszins betrokken is bij de
      aanvraag te verwerken indien dit noodzakelijk is ten behoeve van de beoordeling van een aanvraag, het verlenen dan
      wel vaststellen van een subsidie.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0009455#Artikel3
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009455
        artikel: '3'
  - number: 4.a
    text: |-
      als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.b
    text: waarvan de voorgenomen verstrekking tevoren schriftelijk is meegedeeld aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel4
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling als bedoeld in [artikel 3][ref1] kan
      worden voorzien in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009455#Artikel3
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009455
        artikel: '3'
  - number: '6.1'
    text: |-
      Een aanvraag kan worden afgewezen en een beschikking tot subsidieverstrekking op grond van deze wet kan worden
      ingetrokken of gewijzigd voor zover subsidieverstrekking in strijd zou zijn respectievelijk in strijd is met
      ingevolge een verdrag voor de staat geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij de intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel6
  - number: '6.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel6
  - number: '6.4'
    text: |-
      De [artikelen 4:49, derde lid][ref1], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet van
      toepassing op de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidie-ontvanger opgelegde verplichtingen
      zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel7
  - number: '7.2'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de artikelen 5:18 en 5:19 van de Algemene wet
      bestuursrecht.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel7
  - number: '7.3'
    text: |-
      Aan de subsidies op grond van deze wet is de verplichting verbonden dat de subsidie-ontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijze kan vorderen bij de uitoefening van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel7
  - number: '7.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel7
  - number: '10'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Kaderwet VWS-subsidies.'
    url: https://wetten.overheid.nl/BWBR0009455/2025-01-01#Artikel11
