preamble:
  text: |-
    gelet op de Verordening van de Raad van de Europese Gemeenschappen Nr. 2782175, de Richtlijn van de Raad van de
    Europese Gemeenschappen Nr. 90/539, de artikelen 93, 95, 102 en 104 van de Wet op de Bedrijfsorganisatie en op de
    artikelen 4, 5 en 6 van de Instellingsverordening Productschap Pluimvee en Eieren 1998-I,

    Op 10 april 2003 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:











                  [Richtlijn 90/539/EEG](31990L0539)


                  :


                  Richtlijn van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
      veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
      pluimvee en broedeieren (Pb EG 31.10.90, nr. L 303), zoals deze thans luidt, of in de toekomst zal luiden;




                  [Verordening (EEG) 2782/75](31975R2782)


                  :


                  Verordening van de Raad van de Europese Gemeenschappen van 29 oktober 1975 betreffende de productie van
      en de handel in broedeieren en kuikens van pluimvee (Pb. EG 01-1 1-75, nr. L 282), zoals deze thans luidt, of in de
      toekomst zal luiden;




                  [Verordening (EEG) 1868/77](31977R1868)


                  :


                  Verordening van de Commissie van de Europese Gemeenschappen van 29 juli 1977 houdende
      uitvoeringsbepalingen van [verordening (EEG) nr. 2782/75](31975R2782) betreffende de productie van en de handel
      in broedeieren en kuikens van pluimvee (Pb EG 17.8.77, nr. L 209), zoals deze thans luidt, of in de toekomst zal
      luiden;




                  productschap


                  :


                  het Productschap Pluimvee en Eieren;




                  bestuur


                  :


                  het bestuur van het Productschap Pluimvee en Eieren;




                  voorzitter


                  :


                  de voorzitter van het productschap;




                  ondernemer


                  :


                  een natuurlijke persoon of rechtspersoon, die een pluimveebedrijf uitoefent en/of handelt in
      broedeieren en/of pluimvee;




                  pluimveebedrijf


                  :


                  voorziening - die een inrichting kan omvatten - die wordt gebruikt voor het opfokken en/of het houden
      van fok- of gebruikspluimvee:




                  inrichting


                  :


                  op een bepaald terrein gevestigde voorziening of een deel van een voorziening behorend tot een van de
      volgende bedrijfssectoren:
                  a. fokbedrijf: inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie
      van fokpluimvee;
                  b. vermeerderingsbedrijf: inrichting die zich toelegt op de productie van broedeieren, bestemd voor de
      productie van gebruikspluimvee;
                  c. opfokbedrijf:
                  i. ofwel een opfokbedrijf voor fokpluimvee, d.w.z. een inrichting die zich toelegt op het opfokken van
      fokpluimvee tot het voortplantingsstadium,
      ii. ofwel een opfokbedrijf voor gebruikspluimvee, d.w.z. een inrichting die zich toelegt op het opfokken van
      legkippen tot het legstadium;
                  d. kuikenbroederij: inrichting die zich toelegt op het inleggen en uitbroeden van broedeieren en het
      afleveren van eendagskuikens;




                  pluimvee


                  :


                  kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, duiven, fazanten, patrijzen en loopvogels
      (Ratites), die in gevangenschap worden opgefokt of gehouden voor de fokkerij, voor de productie van vlees of
      consumptie-eieren of om in het wild te worden uitgezet;




                  broedeieren


                  :


                  eieren afkomstig van pluimvee, bestemd om te worden bebroed;




                  eendagskuikens


                  :


                  pluimvee dat nog géén 72 uur oud is;




                  fokpluimvee


                  :


                  pluimvee van 72 uur en ouder, bestemd voor de productie van broedeieren;




                  gebruikspluimvee


                  :


                  pluimvee van 72 uur en ouder, dat wordt opgefokt of gehouden voor de productie van vlees of consumptie-
      eieren of om in het wild te, worden uitgezet;




                  koppel


                  :


                  alle pluimvee met dezelfde gezondheidsstatus dat in hetzelfde lokaal of binnen dezelfde uitloopruimte
      wordt gehouden en dat een epidemiologische eenheid vormt. In batterijen omvat deze term alle dieren die hetzelfde
      omsloten luchtvolume delen;




                  legrassen


                  :


                  pluimvee, waarvan de nakomelingen bestemd zijn voor de productie van consumptie-eieren;




                  vleesrassen


                  :


                  pluimvee, waarvan de nakomelingen bestemd zijn voor de productie van vlees;




                  categorie


                  :


                  onderscheidenlijke generaties pluimvee;




                  type


                  :


                  vleesras of legras;




                  geslacht


                  :


                  mannelijk of vrouwelijk;




                  merk


                  :


                  een door een ondernemer gevoerde commerciële naam, welke bij het productschap als zodanig is aangemeld;




                  broedeierenstempel


                  :


                  een stempel, vermeldende het nummer waaronder het fokbedrijf of vermeerderingsbedrijf, waar de
      broedeieren zijn voortgebracht, bij het productschap is geregistreerd;




                  afleveren


                  :


                  het verzenden van broedeieren of pluimvee van en naar een plaats binnen Nederland;




                  afleverings- en meldingsormulier broedeieren


                  :


                  document dat een zending broedeieren vergezelt bij het afleveren van broedeieren, op te stellen door
      de ondernemer c.q. document ten behoeve van de melding door een ondernemer van een inleg van broedeieren, betrokken
      van een niet in Nederland geregistreerd bedrijf, in diens broedmachine;




                  afleverings- en meldingsformulier pluimvee


                  :


                  document dat een zending pluimvee vergezelt bij het afleveren van pluimvee, verstrekt door het
      productschap en in te vullen door de ondernemer c.q. document ten behoeve van de melding door een ondernemer van
      een opzet van pluimvee, betrokken van een niet in Nederland geregistreerd bedrijf, op diens pluimveebedrijf;




                  bonnummer


                  :


                  uniek nummer op het afleverings- en meldingsformulier pluimvee;




                  gezondheidscertificaat


                  :


                  officieel document, dat pluimvee en broedeieren in het intracommunautair handelsverkeer en bij invoer
      uit derde landen tijdens het vervoer naar de plaats van bestemming moet vergezellen;




                  broedmachine


                  :


                  een machine, bestemd voor het op kunstmatige wijze uitbroeden van broedeieren;
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel1
  - number: '2'
    text: |-
      Ondernemers die een pluimveebedrijf uitoefenen dat een inrichting omvat zijn verplicht zich te houden aan de
      voorschriften, gesteld in de bijlage van deze verordening.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel2
  - number: '3'
    text: |-
      De ondernemers als bedoeld in [artikel 2, lid 2][ref1], zijn verplicht:

      ervoor zorg te dragen dat de broedeieren:

      a. voorzien zijn van het broedeierenstempel;

      b. door middel van een stempeling in Latijnse letters van tenminste 2 mm hoogte en 1 mm breedte in onuitwisbare
      zwarte inkt duidelijk leesbaar van de navolgende vermeldingen zijn voorzien:

        - de aanduiding "broedei" of de vertaling in één der talen van de Gemeenschap, zoals genoemd in de [Verordening
      (EEG) 2782/75](31975R2782);
        - de naam van het land van oorsprong, dan wel de daarvoor geldende aanduiding, zoals opgenomen in [Verordening
      (EEG) 1868/77](31977R1868).


      [ref1]: https://wetten.overheid.nl/BWBR0014954#Artikel2
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014954
        artikel: '2'
        hoofdstuk: II
  - number: '4'
    text: |-
      De ondernemer die één of meerdere broedmachines voorhanden of in voorraad heeft, is verplicht deze te laten
      registreren bij het productschap en daarbij naar waarheid opgave te verstrekken van alle door het productschap ten
      aanzien van de betreffende broedmachine(s) verlangde gegevens.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel4
  - number: '5'
    text: |-
      Het bestuur is bevoegd tot het stellen van nadere regels ter bevordering van de gezondheidstoestand van het
      Nederlandse pluimvee, waarop deze verordening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel5
  - number: '6'
    text: |-
      1 Binnen de grenzen gesteld door enige wettelijke regeling, is het dagelijks bestuur bevoegd voor bepaalde gevallen
      of groepen van gevallen van het bij of krachtens deze verordening bepaalde, geheel of gedeeltelijk ontheffing te
      verlenen, zo mede om aan een dergelijke ontheffing voorschriften te verbinden.

      2 Het bestuur is bevoegd ter nadere uitvoering van deze verordening bij uitvoeringsbesluit, bekend te maken in het
      Verordeningenblad Bedrijfsorganisatie, nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel6
  - number: '7'
    text: |-
      1 Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door een door het bestuur aangewezen dienst of door het bestuur aangewezen personen.

      2 Ondernemers zijn verplicht:

      a. aan de door het Bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen al die gegevens te
      verstrekken of te doen verstrekken, die naar diens/hun oordeel nodig is/zijn voor de vervulling van diens/hun taak;

      b. aan de door het bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen inzage te geven of te
      doen geven van die boeken en bescheiden, die naar diens/hun oordeel nodig is voor de vervulling van diens/hun taak;

      c. aan de door het bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen te allen tijde
      toegang te geven of te doen geven tot hun bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar c.q. waarin
      voorraden, tot het bedrijf van de ondernemer behorende, zijn opgeslagen c.q. worden vervoerd;

      d. te gedogen dat controleurs van de door het bestuur aangewezen dienst of de door het Bestuur aangewezen personen
      monsters nemen uit de voorraden (waaronder begrepen verpakkingsmateriaal) van het bedrijf van de ondernemer,
      ongeacht de plaats waar of waarin zich die voorraden bevinden en de ondernemer zal alsdan de van hem gevorderde
      medewerking verlenen overeenkomstig de aanwijzingen en toezicht van die controleurs of aangewezen personen.

      3 De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten ten behoeve van tuchtrechtelijke
      afhandeling op te maken.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel7
  - number: '8'
    text: |-
      1 De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden
      in handen gesteld van de voorzitter van het productschap; zij worden, behoudens aan personeelsleden van het
      secretariaat van het productschap, alsmede ten behoeve van de handhaving van het bepaalde in deze verordening, niet
      verder bekendgemaakt.

      2 De door de voorzitter aangewezen dienst of personen dien(t)(en), ter bescherming van de privacy van de
      ondernemer, vertrouwelijk en op verantwoorde wijze om te gaan met de uit hoofde van het toezicht verkregen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel8
  - number: '9'
    text: |-
      1 Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld.

      2 De tuchtrechtelijke maatregelen zijn

      a. een berisping, welke bestaat uit een schriftelijk of mondeling vermaan tot de ondernemer, in verband met het
      begane feit,

      b. een geldboete van ten hoogste € 4.500,--, welke geheel of gedeeltelijk voorwaardelijk kan worden opgelegd;

      c. openbaarmaking van de tuchtbeschikking op kosten van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel9
  - number: '10'
    text: |-
      Het bepaalde in of krachtens deze verordening geldt zowel voor de in het eerste als in het tweede lid van artikel
      [102 van de Wet op de Bedrijfsorganisatie][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '102'
  - number: '11'
    text: |-
      1 Deze verordening kan worden aangehaald als Verordening productie van en handel in broedeieren en levend pluimvee
      2003.

      2 Deze verordening treedt in werking met ingang van 1 juli 2003. Indien het Verordeningenblad Bedrijfsorganisatie
      waarin deze verordening wordt geplaatst, wordt uitgegeven na 1 juli 2003, treedt zij in werking op de tweede dag na
      publicatie in het Verordeningenblad Bedrijfsorganisatie en werkt zij, met uitzondering van artikel 13, terug tot en
      met 1 juli 2003.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel11
  - number: '12'
    text: |-
      1 De Verordening produktie van en handel in broedeieren en levend pluimvee 1992 wordt ingetrokken.

      2 Verwijzingen naar de krachtens het eerste lid ingetrokken verordening moeten worden gelezen als verwijzingen naar
      de onderhavige verordening.
    url: https://wetten.overheid.nl/BWBR0014954/2006-06-11#Artikel12
