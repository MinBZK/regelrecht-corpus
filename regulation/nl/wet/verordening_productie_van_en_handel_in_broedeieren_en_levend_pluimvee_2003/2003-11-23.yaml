  - number: '6'
    text: |-
      1 Broedeieren betrokken van niet in Nederland geregistreerde pluimveebedrijven dienen bij het productschap
      aangemeld te worden middels het toezenden door de ondernemer, die de broedeieren inlegt in diens broedmachine,
      van een volledig ingevuld afleverings- en meldingsformulier broedeieren, dan wel van een kopie van het
      gezondheidscertificaat.

      2 Pluimvee betrokken van niet in Nederland geregistreerde pluimveebedrijven dient bij het productschap aangemeld te
      worden middels het inzenden van een door de ondernemer bij wie het pluimvee wordt opgezet, ingevuld afleverings- en
      meldingsformulier pluimvee, waarbij het origineel bij de partij dient te worden bewaard en het duplicaat onverwijld
      aan het productschap dient te worden gezonden.

      3 Pluimvee en broedeieren afkomstig van niet in Nederland geregistreerde pluimveebedrijven moeten afkomstig zijn
      van een door de bevoegde instantie in de betreffende Lidstaat overeenkomstig [Richtlijn 90/539/EEG](31990L0539)
      erkend en geregistreerd pluimveebedrijf of van een Pluimveebedrijf uit een derde land of een deel van een derde
      land dat voorkomt op een lijst die volgens artikel 23 van de [Richtlijn 90/539/EEG](31990L0539) is opgesteld door
      de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel6
  - number: '7'
    text: |-
      De ondernemer die één of meerdere broedmachines voorhanden of in voorraad heeft, is verplicht deze te laten
      registreren bij het productschap en daarbij naar waarheid opgave te verstrekken van alle door het productschap ten
      aanzien van de betreffende broedmachine(s) verlangde gegevens.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel7
  - number: '8'
    text: |-
      Het bestuur is bevoegd tot het stellen van nadere regels ter bevordering van de gezondheidstoestand van het
      Nederlandse pluimvee, waarop deze verordening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel8
  - number: '9'
    text: |-
      1 Binnen de grenzen gesteld door enige wettelijke regeling, is het dagelijks bestuur bevoegd voor bepaalde gevallen
      of groepen van gevallen van het bij of krachtens deze verordening bepaalde, geheel of gedeeltelijk ontheffing te
      verlenen, zo mede om aan een dergelijke ontheffing voorschriften te verbinden.

      2 Het bestuur is bevoegd ter nadere uitvoering van deze verordening bij uitvoeringsbesluit, bekend te maken in het
      Verordeningenblad Bedrijfsorganisatie, nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel9
  - number: '10'
    text: |-
      1 Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door een door het bestuur aangewezen dienst of door het bestuur aangewezen personen.

      2 Ondernemers zijn verplicht:

      a. aan de door het Bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen al die gegevens te
      verstrekken of te doen verstrekken, die naar diens/hun oordeel nodig is/zijn voor de vervulling van diens/hun taak;

      b. aan de door het bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen inzage te geven of te
      doen geven van die boeken en bescheiden, die naar diens/hun oordeel nodig is voor de vervulling van diens/hun taak;

      c. aan de door het bestuur aangewezen dienst of aan de door het Bestuur aangewezen personen te allen tijde
      toegang te geven of te doen geven tot hun bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar c.q. waarin
      voorraden, tot het bedrijf van de ondernemer behorende, zijn opgeslagen c.q. worden vervoerd;

      d. te gedogen dat controleurs van de door het bestuur aangewezen dienst of de door het Bestuur aangewezen personen
      monsters nemen uit de voorraden (waaronder begrepen verpakkingsmateriaal) van het bedrijf van de ondernemer,
      ongeacht de plaats waar of waarin zich die voorraden bevinden en de ondernemer zal alsdan de van hem gevorderde
      medewerking verlenen overeenkomstig de aanwijzingen en toezicht van die controleurs of aangewezen personen.

      3 De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten ten behoeve van tuchtrechtelijke
      afhandeling op te maken.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel10
  - number: '11'
    text: |-
      De ondernemer is verplicht aan controleurs van de in [artikel 10][ref1] bedoelde instanties:

      a. al die gegevens te verstrekken of te doen verstrekken, die naar hun oordeel nodig zijn voor de vervulling van
      hun taak:

      b. inzage te geven of te doen geven van die boeken en bescheiden, die naar hun oordeel nodig zijn voor de
      vervulling van hun taak;

      c. te allen tijde toegang te geven of te doen geven tot hun bedrijfsruimten en tot die plaatsten of
      vervoermiddelen, waar of waarin voorraden, die tot het bedrijf van de ondernemer behoren, zijn opgeslagen of worden
      vervoerd;

      d. te gedogen dat zij monsters nemen uit de voorraden van het bedrijf van de ondernemer, ongeacht de plaats waar
      of waarin zich die voorraden bevinden, en alsdan de gevorderde medewerking overeenkomstig de aanwijzingen en onder
      toezicht van die controleurs te verlenen;

      e. voor het overige alle medewerking te verlenen ter vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0014954#Artikel10
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel11
    references:
