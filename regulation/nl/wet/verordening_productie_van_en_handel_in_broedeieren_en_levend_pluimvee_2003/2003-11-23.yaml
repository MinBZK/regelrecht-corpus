  - number: '5'
    text: |-
      a







                    1


                    a.


                    Bij het afleveren van broedeieren dient het afleverings- en meldingsformulier broedeieren in tweevoud
      te worden ingevuld. Het duplicaat dient ten minste één jaar na de verzenddatum door de verzendende ondernemer
      bewaard te worden.





                    b.


                    In plaats van het afleverings- en meldingsformulier broedeieren mag door de betreffende
      ondernemer een soortgelijk document opgesteld worden, dat ten minste de gegevens bevat als genoemd in
      [artikel 4, lid 1][ref1].






      b









                  2


                  a.


                  Bij het afleveren van pluimvee dient het afleverings- en meldingsformulier pluimvee in drievoud
      ingevuld te worden. Het duplicaat dient door de verzendende ondernemer na aflevering van het pluimvee onverwijld
      aan het productschap gezonden te worden en het triplikaat dient door hem tenminste één jaar na de verzenddatum door
      hem te worden bewaard.





                  b.


                  In plaats van de duplicaten van de afleverings- en meldingsformulieren pluimvee naar het productschap
      toe te sturen is het toegestaan om wekelijks een overzicht van de afleveringen aan het productschap te zenden,
      mits dit overzicht ten minste de gegevens bevat als genoemd in [artikel 4, lid 2][ref2], zulks ter beoordeling van
      het productschap.





                  c.


                  In afwijking van het bepaalde sub a rust, ingeval het afleveringen van moederdieren kip aan een
      Vermeerderaar betreft, de verplichting tot het verschaffen aan het productschap - door middel van het toezenden
      van het duplicaat of anderszins, zulks ter beoordeling van het productschap - van de gegevens als genoemd in
      [artikel 4, lid 2][ref3], op de betrokken vermeerderaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014954#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014954#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014954#Artikel4
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel5
