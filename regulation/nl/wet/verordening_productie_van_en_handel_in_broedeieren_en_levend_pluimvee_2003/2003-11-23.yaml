        artikel: '10'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden
      in handen gesteld van de voorzitter van het productschap; zij worden, behoudens aan personeelsleden van het
      secretariaat van het productschap, alsmede ten behoeve van de handhaving van het bepaalde in deze verordening, niet
      verder bekendgemaakt.

      2 De door de voorzitter aangewezen dienst of personen dien(t)(en), ter bescherming van de privacy van de
      ondernemer, vertrouwelijk en op verantwoorde wijze om te gaan met de uit hoofde van het toezicht verkregen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel12
  - number: '13'
    text: |-
      1 Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld.

      2 De tuchtrechtelijke maatregelen zijn

      a. een berisping, welke bestaat uit een schriftelijk of mondeling vermaan tot de ondernemer, in verband met het
      begane feit,

      b. een geldboete van ten hoogste € 4.500,--, welke geheel of gedeeltelijk voorwaardelijk kan worden opgelegd;

      c. openbaarmaking van de tuchtbeschikking op kosten van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel13
  - number: '14'
    text: |-
      Het bepaalde in of krachtens deze verordening geldt zowel voor de in het eerste als in het tweede lid van artikel
      [102 van de Wet op de Bedrijfsorganisatie][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '102'
  - number: '15'
    text: |-
      1 Deze verordening kan worden aangehaald als Verordening productie van en handel in broedeieren en levend pluimvee
      2003.

      2 Deze verordening treedt in werking met ingang van 1 juli 2003. Indien het Verordeningenblad Bedrijfsorganisatie
      waarin deze verordening wordt geplaatst, wordt uitgegeven na 1 juli 2003, treedt zij in werking op de tweede dag na
      publicatie in het Verordeningenblad Bedrijfsorganisatie en werkt zij, met uitzondering van artikel 13, terug tot en
      met 1 juli 2003.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel15
  - number: '16'
    text: |-
      1 De Verordening produktie van en handel in broedeieren en levend pluimvee 1992 wordt ingetrokken.

      2 Verwijzingen naar de krachtens het eerste lid ingetrokken verordening moeten worden gelezen als verwijzingen naar
      de onderhavige verordening.
    url: https://wetten.overheid.nl/BWBR0014954/2003-11-23#Artikel16
