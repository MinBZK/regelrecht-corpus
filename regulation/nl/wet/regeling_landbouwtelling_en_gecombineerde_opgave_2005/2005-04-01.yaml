        artikel: 5a
      - id: ref2
        bwb_id: BWBR0018131
  - number: '8'
    text: |-
      De [Regeling landbouwtelling en GDI 2004][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel8
    references:
      - id: ref1
