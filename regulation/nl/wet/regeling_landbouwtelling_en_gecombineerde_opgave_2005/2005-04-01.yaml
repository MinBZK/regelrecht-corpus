preamble:
  text: |-
    Gelet op Verordening (EG) nr. 1782/2003 van de Raad van 29 september 2003 tot vaststelling van gemeenschappelijke
    voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers en houdende wijziging van de
    Verordeningen (EEG) nr. 2019/93, (EG) nr. 1452/2001, (EG) nr. 1453/2001, (EG) nr. 1454/2001, (EG) nr. 1868/94, (EG)
    nr. 1251/1999, (EG) nr. 1673/2000, (EEG) nr. 2358/71 en (EG) nr. 2529/2001 (PbEU L 270);

    Gelet op Verordening (EG) nr. 796/2004 van de Commissie van 21 april 2004 houdende uitvoeringsbepalingen inzake de
    randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem waarin is voorzien bij Verordening
    (EG) nr. 1782/2003;

    Gelet op de artikelen 61, 75, eerste lid, 104 en 105 van de Regeling GLB-inkomenssteun, en gelet op artikel 5a van
    het Besluit administratieve verplichtingen Meststoffenwet;

    Voorts gelet op de artikelen 24 en 25 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel1
  - number: 1.a
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel1
  - number: 1.b
    text: |-
      beschrijvingsbiljet: in [bijlage I][ref1] opgenomen modelformulier voor de periodieke inventarisatie in de land-
      en tuinbouw;


      [ref1]: https://wetten.overheid.nl/BWBR0018131
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018131
  - number: 1.c
    text: |-
      opgaveplichtige: persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de landbouw
      zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet, bedoeld in
      onderdeel b, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel1
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2005 tot en met 15 mei 2005 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt een beschrijvingsbiljet uitgereikt of verzonden
      door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018131#Artikel2
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018131
        artikel: '2'
  - number: '4.1'
    text: De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2005.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel4
  - number: '4.2'
    text: |-
      De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de toestand op 1 april
      2005. Indien een oppervlakte op 1 april 2005 nog niet is beteeld, wordt de eerstvolgende geplande teelt opgegeven.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel4
  - number: '4.3'
    text: |-
      Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet of door Dienst Regelingen anders is
      aangegeven, en neemt daarbij de overige op het biljet of door Dienst Regelingen gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel4
  - number: '5.1'
    text: |-
      De opgaveplichtige ondertekent het beschrijvingsbiljet en doet dat binnen veertien dagen na dagtekening van de
      aanbieding aan Dienst Regelingen toekomen.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel5
  - number: '5.2'
    text: |-
      Indien het beschrijvingsbiljet aangetekend aan de opgaveplichtige is toegezonden, doet deze dat binnen vijf dagen
      na dagtekening van de aanbieding ingevuld en ondertekend aan Dienst Regelingen toekomen.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel5
  - number: '6.1'
    text: |-
      Voor de bepaling van de bedrijfsomvang geldt dat één Nederlandse grootte-eenheid gelijk is aan 1400 eenheden bruto
      standaardsaldo.
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel6
  - number: '6.2'
    text: |-
      De bruto standaardsaldi respectievelijk de Nederlandse grootte-eenheid worden vastgesteld als vermeld in
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018131
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018131
  - number: '6.3'
    text: |-
      Bruto-standaardsaldi worden overeenkomstig [bijlage II][ref1] omgerekend in Nederlandse grootte-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0018131
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018131
  - number: '7'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] maakt de uit dien hoofde opgaveplichtige die tevens gehouden is
      gegevens te verstrekken met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0018131#Artikel4
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018131
        artikel: '4'
  - number: 7.a
    text: |-
      subsidieaanvragen op grond van de areaalbetalingen voor akkerbouwgewassen, noten, energiegewassen,
      eiwithoudende gewassen, de productiesteun voor zetmeelaardappelen, zaaizaad en gedroogde voedergewassen,
      bedoeld in [artikel 2, tweede lid, sub b van de Regeling GLB-inkomenssteun][ref1] en de melkpremie, bedoeld in
      [artikel 105 van de Regeling GLB-inkomenssteun][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '105'
  - number: 7.b
    text: |-
      de schapen- en geitenpremies en de rundvleesbetalingen, bedoeld in
      [artikel 2, tweede lid, sub c van de Regeling GLB-inkomenssteun][ref1] of,


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
  - number: 7.c
    text: |-
      de opgave gewaspercelen, bedoeld in [artikel 5a van de Regeling administratieve verplichtingen Meststoffenwet][ref1],
      voor het verstrekken van alle onderscheiden gegevens gebruik van het formulier waarvan het model is opgenomen als
      [bijlage I][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0018131
    url: https://wetten.overheid.nl/BWBR0018131/2005-04-01#Artikel7
    references:
      - id: ref1
