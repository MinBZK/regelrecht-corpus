  - number: '6'
    text: |-
      1 Een vrijstelling van [artikel 7, eerste lid][ref1], geldt voor motorrijtuigen:

      a. die zijn ingericht en worden gebruikt voor het vervoer van zieken en gewonden en die als zodanig uiterlijk
      herkenbaar zijn;

      b. die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van een stoffelijk overschot;

      c. die uitsluitend worden gebruikt voor defensie;

      d. die uitsluitend worden gebruikt door politie en brandweer en als zodanig uiterlijk herkenbaar zijn.

      2 Een vrijstelling van [artikel 7, eerste lid][ref2], geldt voor bij ministeriële regeling aangewezen
      motorrijtuigen in het geval van bij die regeling omschreven calamiteiten en beheer- en onderhoudswerkzaamheden.

      3 Onze Minister kan ontheffing verlenen van [artikel 7, eerste lid][ref3], als dat wenselijk is in het belang van
      de verkeersdoorstroming, de openbare orde en veiligheid of in het algemeen belang.

      4 De ontheffing kan onder beperkingen worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0037517#Artikel7
