  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald op welke manier wordt vastgesteld wie het
      toltarief, bedoeld in [artikel 5, eerste lid][ref1], van rechtswege is verschuldigd aan Onze Minister wegens het
      passeren van een wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref2].

      2 Bij ministeriële regeling worden regels gesteld over:

      a. de termijn waarbinnen het toltarief betaald moet zijn;

      b. de wijze waarop het wegvak waar tol wordt geheven kenbaar wordt gemaakt;

      c. de wijze waarop de betaling van het toltarief plaatsvindt.

      3 [Artikel 4:94 van de Algemene wet bestuursrecht][ref3] is niet van toepassing op het verschuldigde toltarief.

      4 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


