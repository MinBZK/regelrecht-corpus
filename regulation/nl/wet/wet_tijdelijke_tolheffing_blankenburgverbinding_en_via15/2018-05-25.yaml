  - number: '11'
    text: |-
      1 De opbrengsten van de tolheffing, de aanmaningsvergoeding en de bestuurlijke boete komen ten goede aan het
      Infrastructuurfonds, bedoeld in [artikel 2 van de Wet Infrastructuurfonds][ref1].

      2 De netto-opbrengsten worden uitsluitend gebruikt voor het realiseren van de tolopgave.

      3 Onder bediening als bedoeld in [artikel 1, onder g, van de Wet Infrastructuurfonds][ref2] wordt voor de
      toepassing van deze wet en de daarop berustende bepalingen mede verstaan de exploitatie van tolheffing en de kosten
      van handhaving en toezicht voor de tolheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006001#Artikel1
