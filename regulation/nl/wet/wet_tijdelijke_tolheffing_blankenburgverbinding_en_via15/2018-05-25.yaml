  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van [artikel 7, eerste en tweede lid, onder a][ref1], zijn belast de bij besluit
      van Onze Minister aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Op de eerste vordering van een aangewezen persoon als bedoeld in het eerste lid is de bestuurder van een
      motorrijtuig verplicht dat te doen stilstaan.

      4 Als het motorrijtuig is staande gehouden met toepassing van het derde lid, kan een beschikking tot oplegging van
      de bestuurlijke boete als bedoeld in [artikel 12, eerste lid][ref2], worden bekendgemaakt door uitreiking aan de
      bestuurder als:

      a. de betalingstermijn na de aanmaning, bedoeld in [artikel 8, tweede lid][ref3], is verstreken; of

      b. de termijn voor het betalen van de toltarief, bedoeld in [artikel 7, tweede lid, onder a][ref4], is verstreken
      en er voorafgaand aan de staandehouding geen aanmaning aan de verschuldigde van het toltarief, bedoeld in artikel
      7, eerste lid, kon worden gezonden.

      In afwijking van de termijn, bedoeld in [artikel 12, tweede lid][ref5], moet deze bestuurlijke boete onmiddellijk
      worden betaald.

      5 Als de beschikking tot het opleggen van de bestuurlijke boete, bedoeld in het vierde lid, binnen twee weken na
      het onherroepelijk worden daarvan nog niet is betaald, is [artikel 12, vierde tot en met negende lid][ref6], van
      toepassing.

      6 De aangewezen personen, bedoeld in het eerste lid, zijn bevoegd om in het geval, bedoeld in het vierde lid,
      bij wijze van voorlopige maatregel het motorrijtuig naar een door hen aangewezen plaats te doen overbrengen en
      in bewaring te stellen, dan wel aan het motorrijtuig een mechanisch hulpmiddel te doen aanbrengen, waardoor wordt
      verhinderd dat het voertuig wordt weggereden. Zij kunnen vorderen dat, voordat het voertuig aan de bestuurder wordt
      teruggegeven, naast de kosten van overbrenging en bewaring, eveneens het bedrag van de opgelegde bestuurlijke boete
      inclusief de daarop te vallen verhogingen zal worden voldaan.

      7 Bij de beschikking, bedoeld in het vierde lid, wordt gewezen op de bevoegdheid, bedoeld in het zesde en negende
      lid.

      8 Voldoening van het bedrag van de opgelegde bestuurlijke boete laat de bevoegdheid om tegen de beschikking van
      de toezichthouder bezwaar te maken of beroep in te stellen onverlet. Het bezwaar en beroep tegen de bestuurlijke
      boete richt zich ook tegen de voorlopige maatregel, bedoeld in het zesde lid. Wordt het beroep gegrond verklaard,
      dan wordt het bedrag van de bestuurlijke boete en, als toepassing is gegeven aan het zesde lid, het motorrijtuig
      teruggegeven.

      9 Als twaalf weken na de aanvang van de voorlopige maatregel, bedoeld in het zesde lid, de rechthebbende zijn
      motorrijtuig niet heeft afgehaald, wordt hij geacht zijn recht op de zaak te hebben opgegeven en is de aangewezen
      persoon, bedoeld in het eerste lid, bevoegd het motorrijtuig om niet aan een derde in eigendom te doen overdragen,
      te verkopen of te doen vernietigen.

      10 Bij ministeriële regeling kunnen nadere regels worden gesteld over de overbrenging, bewaring,
      eigendomsoverdracht om niet, verkoop, vernietiging, de berekening van de kosten van overbrenging en bewaring,
      alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.


