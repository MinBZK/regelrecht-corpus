  - number: '9'
    text: |-
      1 Het toltarief en de aanmaningsvergoeding, bedoeld in
      [artikel 4:113, eerste lid, van de Algemene wet bestuursrecht][ref1] worden kwijtgescholden als degene die op grond
      van [artikel 7, eerste lid][ref2], het toltarief verschuldigd lijkt te zijn:

      a. aannemelijk maakt dat tegen zijn wil door een ander van het motorrijtuig gebruik is gemaakt en dat hij dit
      gebruik redelijkerwijs niet heeft kunnen voorkomen; of

      b. een vrijwaringsbewijs als bedoeld in [artikel 1 van het Kentekenreglement][ref3] of een verklaring als bedoeld
      in de [artikelen 31 tot en met 33 van het Kentekenreglement][ref4] overlegt waaruit blijkt dat hij ten tijde van
      het passeren van het wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref5], geen eigenaar of houder meer was
      van het betrokken motorrijtuig.

      2 In de gevallen, bedoeld in het eerste lid, onder a en b, is de bestuurder onderscheidenlijk degene aan wie het
      motorrijtuig werd overgedragen het toltarief verschuldigd. De [artikelen 7][ref6], [8][ref7] en [12][ref8] zijn
      van overeenkomstige toepassing.


