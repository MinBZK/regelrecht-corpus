  - number: '10'
    text: |-
      1 Onze Minister is verantwoordelijk voor de verwerking van de persoonsgegevens die gebruikt worden voor
      het innen van het toltarief en het opleggen en invorderen van een bestuurlijke boete als bedoeld in
      [artikel 12, eerste lid][ref1].

      2 Onze Minister verwerkt bij of krachtens algemene maatregel van bestuur te bepalen gegevens van motorrijtuigen die
      over een wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref2], hebben gereden.

      3 Als het toltarief niet of niet geheel binnen de termijn, bedoeld in [artikel 7, tweede lid, onder a][ref3], is
      betaald, is Onze Minister bevoegd de gegevens verder te verwerken door deze te koppelen aan de naam, het adres en
      de woonplaats van de verschuldigde van het toltarief, bedoeld in artikel 7, eerste lid.

      4 De gegevens, bedoeld in het tweede en derde lid, worden bewaard:

      a. gedurende een termijn van uiterlijk twee maanden na betaling van het toltarief;

      b. totdat, voor zover van toepassing, een onherroepelijke bestuurlijke boete is betaald, of

      c. gedurende de termijn, bedoeld in [artikel 5:45 van de Algemene wet bestuursrecht][ref4], waarbinnen een
      bestuurlijke boete kan worden opgelegd.

      5 Nadat is gebleken dat de verschuldigde van het toltarief, bedoeld in [artikel 7, eerste lid][ref5] op grond van
      [artikel 6, eerste of tweede lid][ref6], is vrijgesteld van de tolheffing, dat hij een ontheffing van de tolheffing
      heeft als bedoeld in artikel 6, derde lid, of dat hij op grond van [artikel 9, eerste lid][ref7], geen toltarief
      hoeft te betalen, worden de gegevens, bedoeld in het derde en vierde lid, onmiddellijk verwijderd.

      6 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


