  - number: '3'
    text: |-
      1 Het tracébesluit voor de Blankenburgverbinding onderscheidenlijk de ViA15 geldt als een tolbesluit. Voor
      zover het tracébesluit betrekking heeft op tolheffing, wordt dat in het tracébesluit uitdrukkelijk aangegeven.
      [Artikel 2, tweede lid, onder a en b][ref1], is van overeenkomstige toepassing.

      2 Bij de vaststelling van het tracébesluit wordt uitgegaan van gegevens en onderzoeken die gebaseerd zijn op de
      situatie dat tol wordt geheven.

      3 Een onherroepelijk tracébesluit kan voor zover dat betrekking heeft op tolheffing worden gewijzigd of ingetrokken
      door een tolbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel2
