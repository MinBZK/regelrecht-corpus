  - number: '8'
    text: |-
      1 In afwijking van [artikel 4:112 van de Algemene wet bestuursrecht][ref1] wordt een aanmaning slechts gezonden aan
      de verschuldigde van het toltarief, bedoeld in [artikel 7, eerste lid][ref2], wiens woon- of verblijfplaats bekend
      is.

      2 De termijn waarbinnen de verschuldigde van het toltarief, bedoeld in [artikel 7, eerste lid][ref3], na aanmaning
      dient te betalen, wordt vastgesteld bij ministeriële regeling.

      3 In afwijking van [artikel 4:112, derde lid, van de Algemene wet bestuursrecht][ref4] vermeldt de aanmaning
      dat bij niet tijdige betaling een bestuurlijke boete kan worden opgelegd en de boete kan worden afgedwongen
      door op kosten van de verschuldigde van het toltarief, bedoeld in [artikel 7, eerste lid][ref5], uit te voeren
      invorderingsmaatregelen.

      4 Gedurende de termijn van een jaar na de datum, bedoeld in [artikel 5, eerste lid][ref6], wordt geen vergoeding
      voor de aanmaning in rekening gebracht.


