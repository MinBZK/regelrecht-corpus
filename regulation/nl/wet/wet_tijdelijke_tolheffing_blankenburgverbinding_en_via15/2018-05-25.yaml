  - number: '14'
    text: |-
      Als de bestuurlijke boete niet binnen de in [artikel 12, derde lid][ref1], gestelde termijn is voldaan, of niet
      onmiddellijk is voldaan in een geval als bedoeld in [artikel 15, vierde lid][ref2], is de verschuldigde van het
      toltarief, bedoeld in [artikel 7, eerste lid][ref3], in verzuim voor de bestuurlijke boete, inclusief de daarop te
      vallen verhogingen, bedoeld in artikel 12, vierde en vijfde lid.


