  - number: 8d
    text: |-
      1 De hoofddienstaanbieder is verplicht met elke houder die daarom verzoekt, een dienstverleningsovereenkomst te
      sluiten.

      2 [Artikel 32 van de Wet implementatie EETS-richtlijn][ref1] is van overeenkomstige toepassing op de
      hoofddienstaanbieder en [artikel 33 van de Wet implementatie EETS-richtlijn][ref2] is van overeenkomstige
      toepassing op de hoofddienstaanbieder voor zover een dienstverleningsovereenkomst is opgeschort.

      3 [Artikel 20, eerste lid, van de Wet implementatie EETS-richtlijn][ref3] is van overeenkomstige toepassing op de
      betaling van het bedrag door de houder aan de hoofddienstaanbieder.


