  - number: '7'
    text: |-
      1 De houder is van rechtswege het toltarief, bedoeld in artikel 5, eerste lid, verschuldigd aan Onze Minister
      wegens het passeren van een wegvak of deel van een wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref1].

      2 Het toltarief kan rechtstreeks aan Onze Minister worden betaald of aan een dienstaanbieder waarmee een
      dienstverleningsovereenkomst is gesloten.

      3 De Minister maakt bij het heffen van het toltarief geen direct of indirect onderscheid als bedoeld in artikel 7,
      vijfde lid, van [richtlijn 99/62/EG](31999L0062) op grond van de nationaliteit van de weggebruiker, de lidstaat of
      het derde land waar de vervoerder gevestigd is, de lidstaat of het derde land waar het voertuig geregistreerd is,
      of de herkomst of de bestemming van het vervoer.

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop het wegvak waar tol wordt geheven kenbaar
      wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel2
