  - number: 8a
    text: |-
      Deze paragraaf is van toepassing als de houder een dienstverleningsovereenkomst met een dienstaanbieder heeft
      gesloten.
    url: https://wetten.overheid.nl/BWBR0037517/2025-05-16#Artikel8a
  - number: 8b
    text: |-
      1 De houder ontvangt een factuur van de dienstaanbieder waar een dienstverleningsovereenkomst mee is gesloten voor
      het door hem te betalen toltarief en betaalt het bedrag aan de dienstaanbieder.

      2 Om de inning van het toltarief te verzekeren, kan de dienstaanbieder in de dienstverleningsovereenkomst de
      verplichting opnemen tot zekerheidstelling voor de betaling.

      3 In de dienstverleningsovereenkomst wordt in ieder geval het volgende geregeld:

      a. het door de dienstaanbieder verzenden van een factuur aan de houder met daarin in ieder geval gespecificeerd het
      totaalbedrag aan toltarief, het aantal passages en de datum en het tijdstip van die passages;

      b. het in ieder geval door middel van girale betaling door de houder kunnen betalen van het toltarief aan de
      dienstaanbieder;

      c. de betalingstermijn die in de factuur voor de houder wordt opgenomen;

      d. het beheren door de dienstaanbieder van de klantenrelatie met de houder met inbegrip van een procedure voor
      klachtenafhandeling;

      e. het uitvoeren en naleven van het beveiligings- en privacybeleid van de dienstaanbieder;

      f. het verstrekken van een kwitantie door de dienstaanbieder aan de houder nadat het toltarief door de
      dienstaanbieder is ontvangen.

      4 Artikel 2, zesde lid, van [Uitvoeringsverordening (EU) 2020/204](32104R2020) is van overeenkomstige
      toepassing bij het factureren, bedoeld in het eerste lid, van de houder door de ETS-aanbieder respectievelijk de
      hoofddienstaanbieder.
    url: https://wetten.overheid.nl/BWBR0037517/2025-05-16#Artikel8b
  - number: 8c
    text: |-
      De [Wet implementatie EETS-richtlijn][ref1] is van overeenkomstige toepassing op een ETS-aanbieder met uitzondering
      van de [artikelen 4, eerste lid, onderdelen b en c][ref2], [5][ref3], [7][ref4], [8][ref5], [13][ref6],
      [25][ref7], [26][ref8], [27][ref9], [37][ref10] en [38][ref11].


