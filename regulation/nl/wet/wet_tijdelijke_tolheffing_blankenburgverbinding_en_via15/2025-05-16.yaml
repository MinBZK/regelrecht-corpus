  - number: '2'
    text: |-
      1 Onze Minister is bevoegd een besluit voor het heffen van tol te nemen, te wijzigen of in te trekken voor de
      gedeeltelijke bekostiging en financiering van de Blankenburgverbinding onderscheidenlijk de ViA15.

      2 Het tolbesluit bevat:

      a. het wegvak waar tol wordt geheven;

      b. de contante waarde van de tolopgave;

      c. als het een besluit tot wijzigen of intrekken betreft, een beschrijving van de te treffen voorzieningen, gericht
      op het ongedaan maken, beperken of compenseren van de negatieve gevolgen van de wijziging of intrekking.

      3 Een tolbesluit wordt in ieder geval ingetrokken op het moment dat de netto-opbrengsten, bedoeld in
      [artikel 11][ref1], tweede lid, gelijk zijn aan de tolopgave.

      4 Op de voorbereiding van een besluit als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat zienswijzen naar
      voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
