  - number: '5'
    text: |-
      1 Het toltarief voor het wegvak waar tol wordt geheven en de datum met ingang waarvan tol wordt geheven worden
      vastgesteld bij ministeriële regeling.

      2 Het toltarief wordt in ieder geval niet eerder geheven dan vier weken nadat het ontwerp van het uitvoeringsplan,
      bedoeld in [artikel 4, eerste lid][ref1], aan beide kamers der Staten-Generaal is overgelegd.

      3 Het toltarief kan worden gedifferentieerd naar:

      a. toegestane maximum massa van het motorrijtuig;

      b. wijze waarop de betaling van het toltarief plaatsvindt onder de voorwaarden als bedoeld in artikel 7 decies,
      leden 2 en 2bis, van [Richtlijn 99/62/EG](31999L0062).

      4 Het toltarief en de tolopgave worden jaarlijks van rechtswege geïndexeerd.

      5 Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen regels worden gesteld over de berekening van het
      toltarief, de differentiatie van het toltarief, de verstrekking van een betalingsbewijs en de indexering van het
      toltarief en de tolopgave.


