  - number: '10'
    text: |-
      1 Onze Minister is verwerkingsverantwoordelijke voor de verwerking van de bij of krachtens algemene maatregel van
      bestuur te bepalen persoonsgegevens die gebruikt worden voor de inning van het toltarief, de controle op tijdige
      betaling daarvan en de handhaving.

      2 Onze Minister verwerkt de persoonsgegevens, bedoeld in het eerste lid, die samenhangen met de motorrijtuigen die
      over een wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref1], hebben gereden.

      3 Als het toltarief niet of niet geheel binnen de termijn, bedoeld in [artikel 7b, eerste lid][ref2], is betaald,
      is Onze Minister bevoegd de gegevens, bedoeld in het eerste lid, verder te verwerken door deze te koppelen aan de
      naam, het adres en de woonplaats van de houder.

      4 Onze Minister bewaart de persoonsgegevens, bedoeld in het eerste lid, en de vastgelegde gegevens, bedoeld in
      [artikel 4a, eerste lid][ref3]:

      a. niet langer dan veertien maanden, voor zover uit de vergelijking van de vastgelegde gegevens met de informatie,
      bedoeld in het zesde lid, blijkt dat sprake is van een geldende dienstverleningsovereenkomst; of

      b. wanneer geen sprake is van een geldende dienstverleningsovereenkomst;

      1°. gedurende een termijn van ten hoogste zeven werkdagen na betaling van het toltarief binnen de termijn bedoeld
      in [artikel 7b, eerste lid][ref4];

      2°. totdat, voor zover van toepassing, het toltarief na aanmaning, bedoeld in [artikel 12, tweede lid][ref5],
      is betaald;

      3°. voor zover van toepassing, gedurende de termijn waarbinnen een bestuurlijke boete kan worden opgelegd, bedoeld
      in [artikel 5:45 van de Algemene wet bestuursrecht][ref6];

      4°. gedurende een termijn van vijf jaar, voor zover van toepassing, nadat de bestuurlijke boete, bedoeld in
      [artikel 12, eerste lid][ref7], onherroepelijk is en is betaald, of indien de bestuurlijke boete, bedoeld in
      artikel 12, eerste lid, is vernietigd; of.

      5°. totdat, voor zover van toepassing, de termijn, bedoeld in
      [artikel 4:104 van de Algemene wet bestuursrecht][ref8], is verstreken.

      5 Nadat is gebleken dat de verschuldigde van het toltarief, bedoeld in [artikel 7, eerste lid][ref9] op grond van
      [artikel 6, eerste, tweede of derde lid][ref10], is vrijgesteld van de tolheffing, dat hij een ontheffing van de
      tolheffing heeft als bedoeld in artikel 6, vierde lid, of dat hij op grond van [artikel 9, eerste lid][ref11], geen
      toltarief hoeft te betalen, worden de gegevens, bedoeld in het derde en vierde lid, onmiddellijk verwijderd.

      6 Ten behoeve van het op automatische wijze vaststellen van overtredingen en het opleggen van een boete, is Onze
      Minister bevoegd de volgende gegevens verder te verwerken:

      a. de gegevens, bedoeld in [artikel 32, eerste lid, onder a][ref12], en
      [artikel 33, tweede lid, Wet implementatie EETS-richtlijn][ref13];

      b. de gegevens over de dienstverleningsovereenkomst en de melding, bedoeld in het [artikel 8e, eerste lid][ref14];

      c. de informatie over ontheffingen en vrijstellingen als bedoeld in [artikel 6][ref15];

      d. de vastgelegde gegevens.

      7 Dit artikel laat overige wettelijk voorgeschreven bewaartermijnen onverlet.

      8 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


