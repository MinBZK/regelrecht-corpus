preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is om, mede gelet op Richtlijn 1999/62/EG van het
    Europese Parlement en de Raad van 17 juni 1999 betreffende het in rekening brengen van het gebruik van bepaalde
    infrastructuurvoorzieningen aan zware vrachtvoertuigen (PbEG 1999, L 187), zoals deze laatstelijk is gewijzigd bij
    Richtlijn 2013/22/EU van de Raad van 13 mei 2013 (PbEU 2013, L 158), tol te heffen voor twee projecten met het oog
    op de bekostiging en financiering daarvan;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037517/2025-05-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Blankenburgverbinding:* verbinding tussen de A15 bij Rozenburg en de A20 tussen Maassluis en Vlaardingen;
        - *boordapparatuur:* boordapparatuur als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref1];
        - *dienstaanbieder:* hoofddienstaanbieder, EETS-aanbieder of ETS-aanbieder;
        - *dienstverleningsovereenkomst:* overeenkomst als bedoeld in [artikel 8a][ref2];
        - *EETS-aanbieder:* EETS-aanbieder als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref3];
        - *ETS-aanbieder:* een toldienstaanbieder als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref4]
      die zijn diensten beperkt tot de tolgebieden Blankenburgverbinding en ViA15;
        - *hoofddienstaanbieder:* hoofddienstaanbieder als bedoeld in
      [artikel 1 van de Wet implementatie EETS-richtlijn][ref5];
        - *houder:* houder als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref6]:
      a. degene op wiens naam een motorrijtuig is gesteld in het kentekenregister, bedoeld in
      [artikel 42 van de Wegenverkeerswet 1994][ref7]; b. degene op wiens naam een motorrijtuig is gesteld in een
      buitenlands register betreffende aldaar geregistreerde motorrijtuigen, de registratie betreffende motorrijtuigen
      gebezigd ten behoeve van de strijdkrachten, bijgehouden door Onze Minister van Defensie, alsmede enig andere
      registratie betreffende motorrijtuigen, waarvan hij gerechtigd is deze in Nederland te voeren;
        - *motorrijtuig:* motorrijtuig als bedoeld in [artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994][ref8];
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *persoonsgegeven:* persoonsgegeven als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening
      gegevensbescherming;
        - *Richtlijn 99/62/EG:* [Richtlijn 99/62/EG](31999L0062) van het Europees Parlement en de Raad van 17 juni 1999
      betreffende het in rekening brengen van het gebruik van bepaalde infrastructuurvoorzieningen aan zware vrachtvoer-
      tuigen (PbEG 1999, L 187);
        - *toezichthouder:* degene die is aangewezen op grond van [artikel 15, eerste lid][ref9];
        - *tolbesluit:* besluit als bedoeld in [artikel 2, eerste lid][ref10];
        - *tolheffing:* heffing voor het gebruik van een wegvak met een motorrijtuig;
        - *toltarief:* hoogte van de tolheffing per passage;
        - *tolopgave:* het tekort in de bekostiging van de aanleg van de Blankenburgverbinding onderscheidenlijk de ViA15
      dat door tolheffing moet worden opgebracht;
        - *tolsysteem:* geheel van organisatorische maatregelen en voorzieningen die verband houden met de registratie,
      inning en handhaving en toezicht van tol;
        - *tracébesluit:* besluit als bedoeld in [artikel 9, eerste lid, van de Tracéwet][ref11];
        - *Uitvoeringsverordening (EU) 2020/204:* [Uitvoeringsverordening (EU) 2020/204](32104R2020) van de Commissie
      van 28 november 2019 inzake gedetailleerde verplichtingen van aanbieders van de Europese elektronische
      tolheffingsdienst, de minimuminhoud van de gebiedsverklaring van de Europese elektronische tolheffingsdienst,
      elektronische interfaces en eisen voor interoperabiliteitsonderdelen, en tot intrekking van Beschikking 2009/750/EG
      (PbEU 2020, L 43);
        - *Verordening (EU) 2018/858:* [Verordening (EU) 2018/858](32758R2018) van het Europees Parlement en de Raad
      van 30 mei 2019 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan
      en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van
      [Verordeningen (EG) nr. 715/2007](32007R0715) en [(EG) nr. 595/2009](32009R0595) en tot intrekking van [Richtlijn
      2007/46/EG](32007L0046) (PbEU 2018, L 151);
        - *verwerking van persoonsgegevens:* verwerking van persoonsgegevens als bedoeld in artikel 4, onderdelen 1 en 2,
      van de Algemene verordening gegevensbescherming;
        - *ViA15:* verbinding van de A15 tussen knooppunt Valburg en de A12 bij Zevenaar.


