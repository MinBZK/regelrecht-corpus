  - number: '13'
    text: |-
      De verplichting tot betaling van het toltarief en de aanmaningsvergoeding, bedoeld in
      [artikel 4:113, eerste lid, van de Algemene wet bestuursrecht][ref1], vervalt als een bestuurlijke boete als
      bedoeld in [artikel 12, eerste lid][ref2], is opgelegd.


