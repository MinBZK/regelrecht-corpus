  - number: 8e
    text: |-
      1 Als een dienstverleningsovereenkomst is gesloten, beëindigd, opgeschort of de opschorting is beëindigd, geeft
      de dienstaanbieder dat onmiddellijk door aan Onze Minister. Artikel 2, vierde lid, van [Uitvoeringsverordening
      (EU) 2020/204](32104R2020) is van overeenkomstige toepassing op de gegevensverstrekking door de ETS-aanbieder
      respectievelijk de hoofddienstaanbieder aan Onze Minister.

      2 Onze Minister geeft voor kentekens waarvoor een dienstverleningsovereenkomst is gesloten, dagelijks
      via elektronische weg aan de dienstaanbieder door hoe vaak een passage over een wegvak als bedoeld in
      [artikel 2, tweede lid][ref1], heeft plaatsgevonden. Als er meerdere dienstverleningsovereenkomsten voor hetzelfde
      kenteken zijn gesloten, wordt uitgegaan van de laatste in werking getreden overeenkomst.

      3 De dienstaanbieder betaalt het door de houder verschuldigde toltarief aan Onze Minister binnen een bij
      ministeriële regeling gestelde termijn nadat de gegevens, bedoeld in het tweede lid, door Onze Minister zijn
      doorgegeven aan de dienstaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel2
