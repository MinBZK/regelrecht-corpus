  - number: '4'
    text: |-
      1 Onze Minister werkt het tolsysteem uit in een uitvoeringsplan.

      2 Het uitvoeringsplan bevat een omschrijving van de kernelementen voor de uitvoering van het tolsysteem waaronder:

      a. een algemene beschrijving van het tolsysteem;

      b. de registratiemiddelen;

      c. de betalingsmogelijkheden;

      d. de klantenservice.
    url: https://wetten.overheid.nl/BWBR0037517/2025-05-16#Artikel4
  - number: 4a
    text: |-
      1 Onze Minister is bevoegd op of aan het wegvak bedoeld in [artikel 2, tweede lid, onder a][ref1] met behulp van
      een locatiegebonden technisch hulpmiddel gegevens van een motorrijtuig vast te leggen en te verwerken. De volgende
      gegevens worden vastgelegd:

      a. het kenteken,

      b. de locatie, de datum en het tijdstip van vastlegging,

      c. de beeldopnames van het motorrijtuig, en

      d. voor zover van toepassing, de benodigde informatie uit de boordapparatuur.

      2 Onze Minister verwerkt de vastgelegde gegevens ten behoeve van de inning van het toltarief, de controle op
      tijdige betaling daarvan en de handhaving.

      3 Onder inning van het toltarief wordt mede begrepen de berekening, bedoeld in
      [artikel 32, eerste lid, onder a, Wet implementatie EETS-richtlijn][ref2] en voor zover van toepassing de
      controle, bedoeld in [artikel 12, eerste lid, Wet implementatie EETS-richtlijn][ref3].

      4 Verwerking voor het doel, bedoeld in het tweede lid, kan plaatsvinden door de gegevens, bedoeld in het eerste
      lid, door middel van een technisch systeem geautomatiseerd te vergelijken met andere gegevens die voor dit doel
      zijn verkregen.

      5 De aanwezigheid van een locatiegebonden technisch hulpmiddel wordt ter plaatse op duidelijke wijze kenbaar
      gemaakt.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inzet en het kenbaar maken van het
      gebruik van een technisch hulpmiddel, het aanwijzen en verwerken van de gegevens, bedoeld in het eerste lid, en,
      voor zover van toepassing, de benodigde informatie uit de boordapparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel12
