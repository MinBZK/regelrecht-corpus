      1 De opbrengsten van de tolheffing, de aanmaningsvergoeding en de bestuurlijke boete komen ten goede aan het
      Mobiliteitsfonds, bedoeld in [artikel 2, eerste lid, van de Wet Mobiliteitsfonds][ref1].

      2 De netto-opbrengsten worden, in afwijking van [artikel 2, tweede lid, van de Wet Mobiliteitsfonds][ref2]
      uitsluitend gebruikt voor het realiseren van de tolopgave.

      3 Onder bediening als bedoeld in [artikel 2, eerste lid, onder a, van de Wet Mobiliteitsfonds][ref3] wordt voor
      de toepassing van deze wet en de daarop berustende bepalingen mede verstaan de exploitatie van tolheffing en de
      kosten van handhaving en toezicht voor de tolheffing.


