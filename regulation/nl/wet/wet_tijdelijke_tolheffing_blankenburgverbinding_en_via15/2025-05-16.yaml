  - number: '9'
    text: |-
      1 Het toltarief en, indien [paragraaf 2.2.1][ref1] van toepassing is, de aanmaningsvergoeding, bedoeld in
      [artikel 4:113, eerste lid, van de Algemene wet bestuursrecht][ref2] kunnen al dan niet gedeeltelijk worden
      kwijtgescholden als degene die op grond van [artikel 7, eerste lid][ref3], het toltarief verschuldigd lijkt te
      zijn:

      a. aannemelijk maakt dat tegen zijn wil door een ander van het motorrijtuig gebruik is gemaakt en dat hij dit
      gebruik redelijkerwijs niet heeft kunnen voorkomen;

      b. een vrijwaringsbewijs als bedoeld in [artikel 1 van het Kentekenreglement][ref4] of een verklaring als bedoeld
      in de [artikelen 31 tot en met 33 van het Kentekenreglement][ref5] overlegt waaruit blijkt dat hij ten tijde van
      het passeren van het wegvak als bedoeld in [artikel 2, tweede lid, onder a][ref6], geen eigenaar of houder meer was
      van het betrokken motorrijtuig; of

      c. aannemelijk maakt dat het voertuig ten tijde van de registratie het wegvak als bedoeld in
      [artikel 2, tweede lid, onder a][ref7], niet heeft gepasseerd, sprake is van een onjuiste hoogte van het
      toltarief als gevolg van de differentiatie als bedoeld in [artikel 5, derde lid][ref8], of het om een andere reden
      evident is dat de aanmaning onterecht is verzonden.

      2 In de gevallen, bedoeld in het eerste lid, onder a en b, is de bestuurder onderscheidenlijk degene aan wie het
      motorrijtuig werd overgedragen het toltarief verschuldigd. [Paragraaf 2.2][ref9] en [Hoofdstuk 3][ref10] zijn van
      overeenkomstige toepassing.


