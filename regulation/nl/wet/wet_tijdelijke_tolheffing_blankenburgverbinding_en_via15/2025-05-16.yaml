  - number: '12'
    text: |-
      1 Het niet of niet geheel betalen van het toltarief binnen de op grond van [artikel 7b, eerste lid][ref1],
      gestelde termijn is een overtreding ter zake waarvan Onze Minister aan de houder, een bestuurlijke boete
      kan opleggen, die bestaat uit een bedrag van € 35,– vermeerderd met het oorspronkelijke toltarief en, indien
      [paragraaf 2.2.1][ref2] van toepassing is, de aanmaningsvergoeding.

      2 Als een aanmaning tot betaling van het toltarief is verzonden, wordt de bestuurlijke boete niet opgelegd dan
      nadat de termijn, bedoeld in [artikel 8, tweede lid][ref3], is verstreken.

      3 De betaling van de bestuurlijke boete geschiedt binnen twee weken nadat de beschikking tot oplegging van de
      bestuurlijke boete onherroepelijk is geworden.

      4 Als de bestuurlijke boete niet tijdig geheel is betaald, zendt Onze Minister de houder, een eerste aanmaning en
      wordt de bestuurlijke boete van rechtswege met vijftig procent verhoogd. De betaling geschiedt binnen vier weken na
      verzending van de eerste aanmaning het verhoogde bedrag te betalen.

      5 Als het verhoogde bedrag, bedoeld in het vierde lid, niet binnen de in dat lid gestelde termijn geheel betaald
      is, zendt Onze Minister de houder, een tweede aanmaning en wordt het verhoogde bedrag van rechtswege verder
      verhoogd met honderd procent van dat bedrag. De betaling geschiedt binnen vier weken na verzending van de tweede
      aanmaning het verder verhoogde bedrag te betalen.

      6 Als het verder verhoogde bedrag, bedoeld in het vijfde lid, niet binnen de in dat lid gestelde termijn geheel
      betaald is, is Onze Minister bevoegd tot uitvaardiging van een dwangbevel.

      7 [Artikel 4:113 van de Algemene wet bestuursrecht][ref4] is niet van toepassing op de eerste en tweede aanmaning.

      8 [Artikel 5:10, tweede lid, van de Algemene wet bestuursrecht][ref5] is niet van toepassing op de eerste
      aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel7
