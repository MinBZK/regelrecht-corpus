  - number: 7b
    text: |-
      1 Het verschuldigde toltarief wordt binnen een bij ministeriële regeling gestelde termijn betaald.

      2 [Artikel 4:94 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op het verschuldigde toltarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel494
