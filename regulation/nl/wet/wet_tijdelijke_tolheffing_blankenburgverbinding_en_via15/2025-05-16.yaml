      1 Een dienstaanbieder is de verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens voor:

      a. de verlening van diensten als bedoeld in [artikel 8b, derde lid][ref1];

      b. het sluiten, opschorten of beëindigen van de dienstverleningsovereenkomst, bedoeld in artikel 8e, eerste lid;

      c. de gegevens, bedoeld in [artikel 8e, tweede lid][ref2];

      d. de informatie, bedoeld in [artikel 10, zesde lid, onderdeel c][ref3].

      2 De dienstaanbieder bewaart de persoonsgegevens niet langer dan nodig is voor het verrichten van de diensten,
      bedoeld in het eerste lid.

      3 Dit artikel laat overige wettelijk voorgeschreven bewaartermijnen onverlet.


