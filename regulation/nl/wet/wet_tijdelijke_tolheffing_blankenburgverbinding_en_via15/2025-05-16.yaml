    text: |-
      1 Onze Minister werkt de handhaving voor de tolheffing en het toezicht uit in een handhavingsplan.

      2 Het handhavingsplan bevat een omschrijving van de wijze waarop:

      a. een boete wordt opgelegd;

      b. de boete wordt geïnd, in het bijzonder in het geval dat er geen gegevens van de houder, bekend zijn, en

      c. het toezicht op het netwerk georganiseerd is.
    url: https://wetten.overheid.nl/BWBR0037517/2025-05-16#Artikel16
  - number: '17'
    text: |-
      Het toltarief, bedoeld in [artikel 5, eerste lid][ref1], wordt in ieder geval niet eerder geheven dan vier weken
      nadat het ontwerp van het handhavingsplan, bedoeld in [artikel 16, eerste lid][ref2], aan beide kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037517#Artikel16
