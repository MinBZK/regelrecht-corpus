  - number: '6'
    text: |-
      1 Een vrijstelling van [artikel 7, eerste lid][ref1], geldt voor motorrijtuigen die blijkens:

      a. een door Onze Minister van Defensie aangehouden registratie worden gebruikt door het Ministerie van Defensie;

      b. een door Onze Minister van Defensie bekend gestelde registratie worden gebruikt door een bevriende krijgsmacht.

      2 Een vrijstelling van [artikel 7, eerste lid][ref2], geldt voor bij ministeriële regeling aangewezen
      motorrijtuigen in het geval van bij die regeling omschreven calamiteiten en beheer- en onderhoudswerkzaamheden.

      3 Onze Minister kan bij uitzondering een vrijstelling verlenen van [artikel 7, eerste lid][ref3], als dat wenselijk
      is in het belang van de verkeersdoorstroming, de openbare orde en veiligheid of in het algemeen belang.

      4 De houder kan bij Onze Minister een ontheffing van [artikel 7, eerste lid][ref4], aanvragen voor:

      a. motorrijtuigen met de aanduiding voor speciale doeleinden SC (ambulances) en die worden gebruikt voor het
      vervoer van zieken of gewonden, of voor motorrijtuigen die bij ministeriële regeling worden gelijkgesteld met een
      ambulance;

      b. motorrijtuigen die zijn ingericht en uitsluitend worden gebruikt voor het vervoer van een stoffelijk overschot;

      c. motorrijtuigen die uitsluitend worden gebruikt door politie of brandweer.

      5 Bij of krachtens algemene maatregel van bestuur kunnen aan een ontheffing, bedoeld in het vierde lid, voorwaarden
      en beperkingen worden gesteld.


