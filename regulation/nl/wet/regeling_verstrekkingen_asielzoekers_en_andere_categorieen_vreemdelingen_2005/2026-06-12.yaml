preamble:
  text: |-
    Gelet op artikel 12 van de Wet Centraal Orgaan opvang asielzoekers;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017959/2026-06-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. Onze Minister: de Minister van Asiel en Migratie;

      b. het COA: het Centraal Orgaan opvang asielzoekers;

      c. asielaanvraag: een aanvraag tot het verlenen van een verblijfsvergunning asiel als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1];

      d. asielzoeker: een vreemdeling wiens vrijheid niet rechtens is ontnomen, door wie of ten behoeve van wie een
      asielaanvraag is ingediend;

      e. alleenstaande minderjarige vreemdeling: een asielzoeker die de leeftijd van 18 jaar nog niet heeft bereikt en
      die zonder begeleiding of verzorging van een ouder of voogd in Nederland verblijft;

      f. gezinsleden: de volgende leden van het gezin van de asielzoeker die in verband met de asielaanvraag in Nederland
      aanwezig zijn, voor zover het gezin reeds bestond vóór de asielzoeker op het grondgebied van de lidstaten aankwam:

      1°. echtgenoten of aan gehuwden gelijkgestelde partners;

      2°. hun minderjarige of meerderjarige kinderen, mits zij ongehuwd en van hen afhankelijk zijn;

      3°. de vader, moeder, of een andere volwassene, met inbegrip van een meerderjarige zus of broer, die volgens het
      recht of de praktijk in Nederland verantwoordelijk is voor de minderjarige en ongehuwde asielzoeker.

      Bij toepassing van 2° en 3° wordt een minderjarige op basis van een individuele beoordeling als ongehuwd beschouwd,
      indien er naar Nederlands recht geen sprake is een rechtsgeldig huwelijk, met name gelet op de wettelijke
      huwelijksleeftijd;

      g. minderjarig: de leeftijd van 18 jaar nog niet bereikt hebbende;

      h. uitgenodigde vluchtelingen: vreemdelingen die, na een verzoek daartoe van de Hoge Commissaris van de Verenigde
      Naties voor vluchtelingen (UNHCR) op uitnodiging van de Nederlandse regering in Nederland verblijven;

      i. Opvangrichtlijn: [Richtlijn 2024/1346/EU](32024L1346) van het Europees Parlement en de Raad van 14 mei 2024 tot
      vaststelling van normen voor de opvang van verzoekers om internationale bescherming;

      j. contra-expertise: een onderzoek dat op verzoek van de asielzoeker wordt verricht door een door de asielzoeker
      zelf geselecteerde, onafhankelijke deskundige, die niet betrokken was bij het onderzoek door of ten behoeve van de
      Immigratie- en Naturalisatiedienst, op basis van hetzelfde materiaal dat voor dat onderzoek werd gebruikt;

      k. handhavings- en toezichtlocatie: een aparte opvangvoorziening voor asielzoekers van 16 jaar en ouder met
      een streng regime, waar zij door het COA kunnen worden geplaatst als zij overlast veroorzaken in de reguliere
      opvangvoorziening waar zij verblijven, dan wel wanneer zij een vrijheidsbeperkende maatregel opgelegd hebben
      gekregen als bedoeld in [artikel 56 van de Vreemdelingenwet 2000][ref2], die strekt tot verblijf in het in de
      maatregel aangegeven gebied in en om de handhavings- en toezichtlocatie;

      l. exploitatie: de uitvoering van alle taken die behoren bij het voorzien in de materiële en immateriële
      opvang van asielzoekers in de opvangvoorziening, bedoeld in de [Wet Centraal Orgaan opvang asielzoekers][ref3],
      en het faciliteren van de taken die voor de uitvoeringsorganisaties in de migratieketen voortvloeien uit de
      [Vreemdelingenwet 2000][ref4], de Wet Centraal Orgaan opvang asielzoekers en Unierechtelijke verplichtingen;

      m. materiële opvangvoorzieningen: de opvangvoorzieningen met inbegrip van huisvesting, voedsel, kleding en
      producten voor persoonlijke hygiëne, die in natura of in de vorm van uitkeringen of tegoedbonnen worden verstrekt
      of een combinatie van deze drie, alsmede een dagvergoeding;

      n. immateriële opvang: de immateriële aspecten van het leven in een opvangvoorziening, met inbegrip van medische en
      psychische behandeling en verzorging, recreatieve activiteiten en sociaal-culturele activiteiten;

      o. persoon met bijzondere opvangbehoeften: een asielzoeker die bijzondere omstandigheden of waarborgen behoeft om
      gebruik te kunnen maken van de rechten en te kunnen voldoen aan de verplichtingen die in de Opvangrichtlijn zijn
      vastgesteld;

      p. Procedureverordening: [Verordening (EU) 2024/1348](32024R1348) van het Europees Parlement en de Raad van 14 mei
      2024 tot vaststelling van een gemeenschappelijke procedure voor internationale bescherming in de Unie en tot
      intrekking van [Richtlijn 2013/32/EU](32013L0032);

      q. Asiel- en migratiebeheerverordening: [Verordening (EU) 2024/1351](32024R1351) van het Europees Parlement en
      de Raad van 14 mei 2024 betreffende asiel- en migratiebeheer, tot wijziging van de [Verordeningen (EU) 2021/1147]
      (32021R1147) en [(EU) 2021/1060](32021R1060) en tot intrekking van [Verordening (EU) nr. 604/2013](32013R0604).


