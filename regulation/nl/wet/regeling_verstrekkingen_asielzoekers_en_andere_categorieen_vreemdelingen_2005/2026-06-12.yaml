  - number: '2'
    text: |-
      1 Deze regeling heeft uitsluitend betrekking op een asielzoeker en de daarmee gelijkgestelde categorieën, als
      bedoeld in [artikel 3 derde en vierde lid][ref1] van deze regeling, die niet beschikt over voldoende middelen om in
      de noodzakelijke kosten van het bestaan te voorzien, als bedoeld in de [Participatiewet][ref2].

      2 Het COA kan deze regeling tevens van toepassing verklaren op een asielzoeker die beschikt over voldoende middelen
      om in de noodzakelijke kosten van het bestaan te voorzien, indien dringende redenen daartoe noodzaken.

      3 Het COA verstrekt aan de asielzoeker, bedoeld in [artikel 3][ref3], binnen een redelijke termijn van ten hoogste
      drie dagen na de indiening van de asielaanvraag informatie over:

      a. de geldende rechten en de verplichtingen die hij moet nakomen in verband met de opvangvoorzieningen;

      b. organisaties of groepen van personen die specifieke rechtsbijstand verlenen met inbegrip van informatie over
      organisaties of groepen van personen die dit kosteloos doen;

      c. de opvangvoorzieningen, waaronder medische zorg.

      4 Het COA zorgt ervoor dat de in het derde lid bedoelde informatie schriftelijk wordt verstrekt in een beknopte,
      transparante, begrijpelijke en toegankelijke vorm en in een taal die de asielzoeker begrijpt of waarvan
      redelijkerwijs kan worden aangenomen dat hij deze begrijpt. Indien nodig wordt de informatie ook mondeling of in
      visuele vorm verstrekt.

      5 In het geval van een alleenstaande minderjarige vreemdeling verstrekt het COA de in het derde lid bedoelde
      informatie op een leeftijdsgeschikte en passende wijze, zodanig dat de vreemdeling die informatie begrijpt, door in
      voorkomend geval gebruik te maken van speciaal op minderjarigen afgestemd informatiemateriaal. Die informatie wordt
      verstrekt in aanwezigheid van de vertegenwoordiger of van de persoon die voorlopig geschikt is om op te treden als
      de vertegenwoordiger.

      6 In uitzonderlijke gevallen kan het COA de in het derde lid bedoelde informatie aan de asielzoeker verstrekken
      door middel van een mondelinge vertaling of, in voorkomend geval, in een visuele vorm zoals video’s of
      pictogrammen, indien:

      a) het COA niet in staat is om die informatie binnen de in het derde lid gestelde termijn schriftelijk te
      verstrekken, omdat de taal die een asielzoeker begrijpt of waarvan redelijkerwijs kan worden aangenomen dat hij
      deze begrijpt, een zeldzame taal is, en

      b) die asielzoeker vervolgens bevestigt dat hij de verstrekte informatie begrijpt.

      7 In de gevallen, bedoeld in het zesde lid, verstrekt het COA zo snel mogelijk alsnog een schriftelijke vertaling
      van de in het derde lid bedoelde informatie aan de asielzoeker, tenzij duidelijk is dat een dergelijke verstrekking
      niet meer nodig is.


