  - number: '9'
    text: |-
      1 De opvang in een opvangvoorziening omvat in elk geval de volgende verstrekkingen:

      a. onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden of in particuliere huizen,
      appartementen, hotels of andere voor de huisvesting van asielzoekers aangepaste ruimten;

      b. een wekelijkse financiële toelage ten behoeve van voedsel, kleding, producten voor persoonlijke hygiëne en
      andere persoonlijke uitgaven;

      c. openbaar vervoerskaarten voor reizen van en naar de rechtsbijstandverlener in verband met de asielprocedure
      afgezien van de dagen die beschikbaar zijn voor het onderzoek naar de asielaanvraag gedurende de algemene
      asielprocedure;

      d. recreatieve en educatieve activiteiten;

      e. de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling;

      f. een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid;

      g. betaling van buitengewone kosten.

      2 Zo spoedig mogelijk nadat een asielzoeker voor de eerste keer in een opvangvoorziening is opgevangen, vindt een
      eerste onderzoek naar zijn gezondheidstoestand plaats.

      3 Het COA zorgt ervoor dat tijdens het verblijf in de opvangvoorziening:

      a. de asielzoeker bescherming van zijn gezinsleven geniet;

      b. de asielzoeker de mogelijkheid heeft om te communiceren met familieleden, juridisch adviseurs of raadslieden
      en vertegenwoordigers van de Hoge Commissaris der Verenigde Naties voor Vluchtelingen (UNHCR) en andere relevante
      nationale, internationale en niet-gouvernementele organisaties en instanties;

      c. familieleden, juridisch adviseurs of raadslieden, vertegenwoordigers van de UNHCR en relevante door de Minister
      erkende niet-gouvernementele organisaties toegang hebben tot de opvangvoorziening zodat zij de asielzoeker kunnen
      bijstaan;

      d. de asielzoeker een programma voor educatie en ontwikkeling wordt geboden.

      4 De toegang, bedoeld in het derde lid, onder c, kan slechts worden beperkt om redenen die verband houden met de
      veiligheid van de opvangvoorziening en van de asielzoekers.

      5 Elke opvangvoorziening heeft een door het COA opgesteld huishoudelijk reglement waarin tenminste passende
      maatregelen zijn opgenomen om geweldpleging, met inbegrip van geweld met seksuele, gender-, racistische of
      religieuze motieven, te voorkomen.

      6 Onze Minister kan een uitzondering maken op het vijfde lid indien de materiële opvang wordt verstrekt in
      particuliere huizen, appartementen, hotels of andere voor de huisvesting van asielzoekers aangepaste ruimten.

      7 Het aanbieden van recreatieve en educatieve activiteiten en het in bruikleen geven van gebruiksvoorwerpen kan
      afhankelijk worden gesteld van de betaling van een waarborgsom door de asielzoeker.

      8 Het personeel dat in de opvangvoorziening werkt moet een passende opleiding hebben. Personen die met personen met
      bijzondere opvangbehoeften werken, moeten passend onderricht over hun behoeften gevolgd hebben en blijven volgen.
    url: https://wetten.overheid.nl/BWBR0017959/2026-06-12#Artikel9
  - number: 9a
    text: |-
      Een vreemdeling die een overdrachtsbesluit als bedoeld in [artikel 44a van de Vreemdelingenwet 2000][ref1] heeft
      ontvangen heeft recht op de volgende verstrekkingen:

      a. onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden;

      b. voedsel, kleding en producten voor persoonlijke hygiëne, middels een wekelijkse financiële toelage als bedoeld
      in [artikel 14][ref2], dan wel in natura;

      c. reiskosten voor noodzakelijk medisch vervoer en voor vervoer van en naar de rechtsbijstandverlener in verband
      met de asielprocedure;

      d. dekking van de noodzakelijke medische zorgkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel14
