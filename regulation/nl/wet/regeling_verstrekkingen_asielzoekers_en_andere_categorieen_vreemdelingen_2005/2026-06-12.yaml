  - number: '7'
    text: |-
      1 Het recht op opvang eindigt in de volgende gevallen:

      a. indien het een asielzoeker betreft aan wie een verblijfsvergunning is verleend: op de dag waarop naar het
      oordeel van het COA passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd;

      b. indien het een asielzoeker betreft die rechtmatig verwijderbaar is vanwege het niet inwilligen van de
      asielaanvraag die recht geeft op opvang: op de dag na de dag waarop de vreemdeling rechtmatig verwijderbaar is
      geworden;

      c. indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder d][ref1]
      van deze regeling opvang is geboden: op de dag waarop voor de asielzoeker met wie gezinshereniging wordt beoogd
      naar het oordeel van het COA passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd;

      d. indien het een asielzoeker betreft aan wie met toepassing van
      [artikel 3, derde lid, aanhef en onder f en g][ref2] van deze regeling opvang is geboden: vier weken nadat
      het rechtmatig verblijf, als bedoeld in [artikel 8, aanhef en onder j, van de Vreemdelingenwet 2000][ref3] is
      geëindigd;

      e. indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder h][ref4]
      van deze regeling opvang is geboden: op de dag na de dag waarop naar het oordeel van Onze Minister niet langer
      sprake is van feitelijk dezelfde situatie, als bedoeld in [artikel 64 van de Vreemdelingenwet 2000][ref5];

      f. indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder i][ref6]
      van deze regeling opvang is geboden: vier weken na de dag waarop het besluit, als bedoeld in
      [artikel 45 vierde lid van de Vreemdelingenwet 2000][ref7], is ingetrokken;

      g. indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder j][ref8]
      van deze regeling opvang is geboden: vier weken na de dag waarop het besluit, als bedoeld in
      [artikel 45, zesde lid van de Vreemdelingenwet 2000][ref9] is ingetrokken;

      h. indien een asielzoeker tot ongewenst vreemdeling als bedoeld in [artikel 67 van de Vreemdelingenwet 2000][ref10]
      is verklaard of indien het een asielzoeker betreft jegens wie een inreisverbod als bedoeld in
      [artikel 66a, zevende lid, van die wet][ref11] geldt en de vreemdeling geen rechtmatig verblijf heeft:
      onmiddellijk;

      i. indien het een asielzoeker betreft die niet binnen 48 uur na overplaatsing in een opvangvoorziening dan wel in
      de handhavings- en toezichtlocatie, arriveert: op het moment waarop deze termijn verstrijkt;

      j. indien het een asielzoeker betreft die twee opeenvolgende malen niet heeft voldaan aan de meldplicht bij de
      Vreemdelingenpolitie: twee weken nadat hij voor de eerste maal heeft verzuimd zich bij de Vreemdelingenpolitie
      te melden;

      k. indien een asielzoeker onjuiste gegevens heeft verstrekt danwel gegevens heeft achtergehouden, met het oogmerk
      om aldus voor zichzelf of voor degenen voor wie hij zorgt, ten onrechte een aanspraak te doen ontstaan op de
      verstrekkingen bedoeld in [artikel 9][ref12] van deze regeling, danwel ten onrechte de hoogte van de verstrekkingen
      te doen stijgen;

      l. indien een asielzoeker niet de instemming heeft verkregen als bedoeld in [artikel 12][ref13] van deze regeling;

      m. indien het een uitgeprocedeerde asielzoeker betreft aan wie met toepassing van
      [artikel 3, derde lid, aanhef en onder o][ref14], van deze regeling opvang is geboden: vier weken nadat het
      rechtmatig verblijf, bedoeld in [artikel 8, aanhef en onder h, van de Vreemdelingenwet 2000][ref15] is geëindigd;

      n. indien het een vreemdeling betreft die een overdrachtsbesluit als bedoeld in
      [artikel 44a van de Vreemdelingenwet 2000][ref16] heeft ontvangen, wiens aanwezigheid in Nederland gelet op artikel
      17, vierde lid, van de Asiel- en migratiebeheerverordening, niet langer vereist is, en dit in overeenstemming
      is met artikel 18 van de Asiel- en migratiebeheerverordening, met dien verstande dat de vreemdeling tot het
      moment van feitelijke overdracht naar de verantwoordelijke lidstaat recht heeft op de verstrekkingen, genoemd in
      [artikel 9a][ref17]. Minderjarige vreemdelingen in gezinsverband behouden recht op de verstrekkingen, genoemd in
      [artikel 9][ref18]. Ook duren de verplichtingen die een vreemdeling gedurende zijn verblijf in de opvang heeft op
      grond van [Hoofdstuk V][ref19] voort.

      2 Een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref20] is niet van invloed op het moment van het eindigen van het recht
      op opvang.

      3 In afwijking van het eerste lid, aanhef en onder e, eindigt het recht op opvang indien het een uitgeprocedeerde
      asielzoeker betreft, die voorafgaand aan de aanvraag op medische gronden zijn complete en actuele medische
      gegevens heeft overgelegd, aan wie met toepassing van [artikel 3, derde lid, aanhef en onder g][ref21],
      van deze regeling opvang is geboden: vier weken nadat het rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder f, van de Vreemdelingenwet 2000][ref22] is geëindigd.


