  - number: '22'
    text: |-
      Voor de verstrekkingen op basis van deze regeling geldt een beslagvrije voet ten aanzien van alle
      verstrekkingen die in natura geschieden en viervijfde deel van de verstrekkingen op grond van
      [artikel 9, eerste lid, onderdeel b][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
