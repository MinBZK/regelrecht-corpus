  - number: '14'
    text: |-
      1 De door de asielzoeker te ontvangen wekelijkse financiële toelage, bedoeld in
      [artikel 9, eerste lid, aanhef en onder b][ref1], van deze regeling, bestaat uit een bedrag ten behoeve van voedsel
      en een bedrag ten behoeve van kleding, producten voor persoonlijke hygiëne en andere persoonlijke uitgaven.

      2 De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners volledig zelf het eigen eten verzorgen, wordt berekend aan de hand van de volgende bedragen per persoon,
      per week:

      a. bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 58,80, kind tot
      18 jaar: € 48,93;

      b. bij een driepersoonshuishouden: volwassene: € 49,98, kind tot 18 jaar: € 41,58;

      c. bij een huishouden van vier of meer personen: volwassene: € 44,10, kind tot 18 jaar: € 36,68.

      3 De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners het ontbijt en een tweede maaltijd zelf verzorgen en niet de hoofdmaaltijd, wordt berekend aan de hand van
      het volgende bedrag per persoon, per week:

      a. bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 39,41, kind tot
      18 jaar: € 33,81;

      b. bij een driepersoonshuishouden: volwassene: € 33,53, kind tot 18 jaar: € 28,77;

      c. bij een huishouden van vier of meer personen: volwassene: € 29,54, kind tot 18 jaar: € 25,34.

      4 De hoogte van het bedrag voor kleding, producten voor persoonlijke hygiëne en andere persoonlijke uitgaven,
      bedoeld in het eerste lid, is: € 14,87 per persoon, per week.

      5 De financiële toelage wordt iedere week op door het COA vastgestelde tijdstippen en plaats aan de asielzoeker
      beschikbaar gesteld.

      6 Geen financiële toelage wordt verstrekt aan een kind drie maanden nadat het recht op een uitkering op grond van
      de [Algemene Kinderbijslagwet][ref2] is ontstaan.

      7 De financiële toelage voor een asielzoeker jonger dan 18 jaar, die een kind is van, of verzorgd wordt door
      een of meer in de desbetreffende opvangvoorziening verblijvende asielzoekers wordt uitbetaald aan één van die
      asielzoekers.

      8 Het COA draagt zorg voor de maaltijden in centra waarin de bewoners niet in de gelegenheid zijn deze zelf te
      verzorgen.

      9 In afwijking van het eerste lid wordt geen financiële toelage verstrekt ten behoeve van voedsel aan asielzoekers
      die hun maaltijden in natura ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
