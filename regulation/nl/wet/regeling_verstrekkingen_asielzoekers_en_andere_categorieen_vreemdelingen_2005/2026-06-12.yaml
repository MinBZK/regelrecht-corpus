  - number: '12'
    text: |-
      1 De asielzoeker aan wie een verblijfsvergunning is verleend en die in afwachting is van het betrekken van
      woonruimte in een gemeente krijgt de verstrekkingen, bedoeld in [artikel 9 eerste lid][ref1] van deze regeling,
      aangeboden indien het COA hiermee heeft ingestemd.

      2 De asielzoeker, bedoeld in het eerste lid, zal zich iedere twee weken bij het COA moeten melden en de instemming
      bedoeld in het eerste lid moeten hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
