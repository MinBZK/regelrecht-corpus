  - number: '17'
    text: |-
      1 Een asielzoeker kan een vergoeding ontvangen voor buitengewone kosten, bedoeld in
      [artikel 9, eerste lid, onderdeel g][ref1] van deze regeling, die hij heeft gemaakt.

      2 Buitengewone kosten zijn noodzakelijke kosten die vanwege hun aard of hoogte in redelijkheid niet geacht kunnen
      worden door de asielzoeker zelf te worden betaald.

      3 Buitengewone kosten worden slechts betaald voorzover vooraf door het COA aan de asielzoeker toestemming is
      verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien uit noodsituaties waarin geen
      mogelijkheid bestond tot het verzoeken om toestemming.

      4 De toestemming, bedoeld in het derde lid, wordt uitsluitend verleend indien en voor zover de kosten noodzakelijk
      zijn en niet op andere wijze in de betaling kan worden voorzien.

      5 Kosten die samenhangen met een door de asielzoeker ingediende aanvraag als bedoeld in
      [artikel 24, tweede lid, van de Vreemdelingenwet 2000][ref2], dan wel met een door de asielzoeker gepleegde
      onrechtmatige daad, gepleegd misdrijf of begane overtreding zijn in ieder geval geen buitengewone kosten, als
      bedoeld in het eerste lid.

      6 Het Orgaan kan op een daartoe strekkend verzoek van een vreemdeling afwijken van het bepaalde in het vijfde lid,
      uitsluitend voor zover het betreft:

      a. de leges ter zake van de afdoening van een aanvraag om verlenging van de verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met tijdelijke humanitaire gronden, mits betrokkene op het moment
      van de aanvraag nog niet de leeftijd van 18 jaar heeft bereikt;

      b. de leges ter zake van de afdoening van een aanvraag om wijziging van de verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met tijdelijke humanitaire gronden in een verblijfsvergunning
      regulier voor bepaalde tijd onder de beperking verband houdend met niet-tijdelijke humanitaire gronden, mits
      betrokkene voor het bereiken van de leeftijd van 15 jaar in het bezit is gesteld van een verblijfsvergunning
      regulier voor bepaalde tijd onder de beperking verband houdend met tijdelijke humanitaire gronden en nog niet de
      leeftijd van 18 jaar heeft bereikt;

      c. de leges ter zake van de afdoening van de aanvraag om verlening van een verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met verblijf als familie- of gezinslid, in de gevallen waarin de
      statushouder de ouder is van de aanvrager en deze op het moment van de aanvraag niet minimaal evenveel verdient als
      de normbedragen uit de [Participatiewet][ref3];

      d. de leges ter zake van de afdoening van een aanvraag om verlening van een verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met verblijf als familie- of gezinslid ingediend door of namens
      een in Nederland geboren kind dat op grond van [artikel 3, derde lid, onder d][ref4], opvang wordt geboden.

      7 Onder buitengewone kosten als bedoeld in [artikel 9, eerste lid, onder g][ref5], worden niet verstaan de kosten
      voor:

      a. een contra-expertise indien het een asielzoeker betreft wiens asielaanvraag is afgewezen;

      b. de huur van een woning dan wel de aan de huur van een woning gerelateerde kosten;

      c. een onderzoek, als bedoeld in [artikel 3.109e, vierde lid, van het Vreemdelingenbesluit 2000][ref6].


