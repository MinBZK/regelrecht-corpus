      1 Het treffen van een ziektekostenregeling bedoeld in [artikel 9 eerste lid, onderdeel e][ref1] van deze
      regeling, houdt in het afsluiten van een ziektekostencontract ter dekking van de kosten van het door Onze Minister
      vastgestelde pakket medische verstrekkingen.

      2 Het verzekeren tegen de financiële gevolgen van wettelijke aansprakelijkheid, bedoeld in
      [artikel 9, eerste lid, onderdeel f][ref2] van deze regeling, houdt in het ten behoeve van de asielzoeker afsluiten
      van een verzekering voor de wettelijke aansprakelijkheid van de asielzoeker jegens een derde voor een som van
      maximaal € 453.780 per gebeurtenis per jaar, alsmede het betalen van de daarvoor verschuldigde premie.


