  - number: '5'
    text: |-
      Het recht op opvang van een asielzoeker wiens asielaanvraag die recht op opvang heeft gegeven is afgewezen, eindigt
      indien de vertrektermijn als bedoeld in [artikel 62 van de Vreemdelingenwet 2000][ref1] is verstreken, tenzij de
      uitzetting van betrokkene ingevolge de [Vreemdelingenwet 2000][ref2], de Procedureverordening of een rechterlijke
      uitspraak achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011823
