    text: |-
      1 Een asielzoeker kan door het COA nader aan te wijzen werkzaamheden verrichten in en rondom de opvangvoorziening,
      voor de uitvoering waarvan een vergoeding kan worden gegeven.

      2 Het COA zorgt voor een evenredige verdeling van het aanbod van werkzaamheden bedoeld in het eerste lid over de in
      de opvangvoorziening verblijvende asielzoekers die daarvoor in aanmerking wensen te komen.

      3 De vergoeding die een asielzoeker ontvangt voor het verrichten van werkzaamheden als bedoeld in het eerste lid,
      bedraagt in totaal niet meer dan € 18,– per week.

      4 Via een representatieve adviesraad van bewoners van een opvangvoorziening kan het COA asielzoekers betrekken bij
      het beheer van de materiële middelen en bij de immateriële opvang.
    url: https://wetten.overheid.nl/BWBR0017959/2026-06-12#Artikel18
  - number: 18a
    text: |-
      1 Het COA zorgt ervoor dat tijdens het verblijf in de opvangvoorziening rekening wordt gehouden met de specifieke
      situatie van personen met bijzondere opvangbehoeften als bedoeld in [artikel 24][ref1], alsmede vreemdelingen die
      een die een overdrachtsbesluit als bedoeld in [artikel 44a van de Vreemdelingenwet 2000][ref2] hebben ontvangen van
      de Opvangrichtlijn.

      2 Ter uitvoering van het eerste lid beoordeelt het COA zo spoedig mogelijk na indiening van de asielaanvraag of de
      asielzoeker bijzondere opvangbehoeften heeft. De uitkomst wordt opgenomen in zijn dossier, met vermelding van een
      beschrijving van de zichtbare tekenen of de verklaringen of gedragingen die relevant zijn voor de beoordeling van
      de bijzondere opvangbehoeften, alsmede de maatregelen die zijn vastgesteld om in die behoeften te voorzien.

      3 Indien de asielzoeker overeenkomstig het tweede lid bijzondere opvangbehoeften heeft, wordt naast de
      verstrekkingen, bedoeld in [artikel 9, eerste lid][ref3], of [artikel 9a][ref4] specifieke steun en begeleiding
      geboden.

      4 De in het tweede lid bedoelde beoordeling wordt afgerond binnen 30 dagen na indiening van de asielaanvraag.

      5 Indien er aanwijzingen zijn dat de mentale of fysieke gezondheid van invloed kan zijn op de opvangbehoeften wordt
      de asielzoeker ter nadere beoordeling van zijn psychologische en fysieke toestand doorverwezen naar een geschikte
      arts of psycholoog. Indien nodig wordt een mondelinge vertaling verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel44a
