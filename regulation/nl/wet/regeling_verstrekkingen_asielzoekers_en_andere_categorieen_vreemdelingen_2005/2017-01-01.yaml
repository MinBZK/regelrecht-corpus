preamble:
  text: |-
    Gelet op artikel 12 van de Wet Centraal Orgaan opvang asielzoekers;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: de Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.b
    text: 'het COA: het Centraal Orgaan opvang asielzoekers;'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.c
    text: |-
      asielaanvraag: een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 1.d
    text: |-
      asielzoeker: een vreemdeling wiens vrijheid niet rechtens is ontnomen, door wie of ten behoeve van wie een
      asielaanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.e
    text: |-
      alleenstaande minderjarige vreemdeling: een asielzoeker die de leeftijd van 18 jaar nog niet heeft bereikt en die
      zonder begeleiding of verzorging van een ouder of voogd in Nederland verblijft;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.f
    text: |-
      gezinsleden: de volgende leden van het gezin van de asielzoeker die in verband met de asielaanvraag in Nederland
      aanwezig zijn, voor zover het gezin reeds bestond in het land van herkomst:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.f.1°
    text: echtgenoten of aan gehuwden gelijkgestelde partners;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.f.2°
    text: hun minderjarige kinderen, mits zij ongehuwd en van hun afhankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.f.3°
    text: |-
      de vader, moeder, of een andere volwassene die volgens het recht of de praktijk in Nederland verantwoordelijk is
      voor de minderjarige en ongehuwde asielzoeker;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.g
    text: 'minderjarig: de leeftijd van 18 jaar nog niet bereikt hebbende;'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.h
    text: |-
      opvangvoorziening: een accommodatie waarin door of onder verantwoordelijkheid van het COA opvang wordt geboden
      aan asielzoekers;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.i
    text: |-
      uitgenodigde vluchtelingen: vreemdelingen die, na een verzoek daartoe van de Hoge Commissaris van de Verenigde
      Naties voor vluchtelingen (UNHCR) op uitnodiging van de Nederlandse regering in Nederland verblijven;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.j
    text: |-
      rust- en voorbereidingstermijn: de termijn van tenminste zes dagen waarin de vreemdeling
      rechtmatig verblijf heeft na indiening van de asielaanvraag en het onderzoek als bedoeld in
      [artikel 3.110 van het Vreemdelingenbesluit 2000][ref1] nog niet is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1.k
    text: |-
      Opvangrichtlijn: Richtlijn 2013/33/EU van het Europees Parlement en de Raad van 26 juni 2013 tot vaststelling van
      normen voor de opvang van verzoekers om internationale bescherming (Pb EU 2013, L 180);
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.l
    text: |-
      contra-expertise: een onderzoek dat op verzoek van de asielzoeker wordt verricht door een door de asielzoeker
      zelf geselecteerde, onafhankelijke deskundige, die niet betrokken was bij het onderzoek door of ten behoeve van de
      Immigratie- en Naturalisatiedienst, op basis van hetzelfde materiaal dat voor dat onderzoek werd gebruikt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
  - number: 1.m
    text: |-
      Gemeentelijk Versnellingsarrangement:
      [Besluit van de Staatssecretaris van Veiligheid en Justitie van 23 december 2015][ref1], nummer 718939, houdende
      intrekking van het Besluit van de Staatssecretaris van Veiligheid en Justitie van 12 oktober 2015 (Stcrt 2015,
      35582), en tijdelijke uitbreiding van de bevoegdheid van het Centraal Orgaan opvang asielzoekers om bepaalde
      categorieën vreemdelingen uit te sluiten van verstrekkingen op grond van de Regeling verstrekkingen asielzoekers en
      andere categorieën vreemdelingen 2005 (Stcrt. 2015, 48827).


      [ref1]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037439
  - number: '2.1'
    text: |-
      Deze regeling heeft uitsluitend betrekking op een asielzoeker en de daarmee gelijkgestelde categorieën, als bedoeld
      in [artikel 3 derde en vierde lid][ref1] van deze regeling, die niet beschikt over voldoende middelen om in de
      noodzakelijke kosten van het bestaan te voorzien, als bedoeld in de [Participatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0015703
  - number: '2.2'
    text: |-
      Het COA kan deze regeling tevens van toepassing verklaren op een asielzoeker die beschikt over voldoende middelen
      om in de noodzakelijke kosten van het bestaan te voorzien, indien dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het COA verstrekt aan de asielzoeker, bedoeld in [artikel 3][ref1], binnen een redelijke termijn van ten hoogste
      vijftien dagen na de indiening van de asielaanvraag informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: 2.3.a
    text: de geldende voordelen en de verplichtingen die hij moet nakomen in verband met de opvangvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
  - number: 2.3.b
    text: organisaties of groepen van personen die specifieke rechtsbijstand verlenen;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
  - number: 2.3.c
    text: de opvangvoorzieningen, waaronder medische zorg.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het COA zorgt ervoor dat de in het derde lid bedoelde informatie schriftelijk wordt verstrekt in een taal die de
      asielzoeker verstaat of waarvan redelijkerwijs kan worden aangenomen dat hij deze verstaat. In voorkomend geval kan
      deze informatie tevens mondeling verstrekt worden.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het COA draagt zorg voor de centrale opvang van asielzoekers door erin te voorzien dat hen opvang wordt geboden in
      een opvangvoorziening.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: '3.2'
    text: 'Tot de in het eerste lid bedoelde categorieën asielzoekers aan wie opvang wordt geboden behoren:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de asielzoeker als bedoeld in [artikel 1, eerste lid, aanhef en onder d][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel1
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '1'
        hoofdstuk: I
  - number: 3.2.b
    text: |-
      de asielzoeker als bedoeld in [artikel 1, eerste lid, aanhef en onder e][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel1
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '1'
        hoofdstuk: I
  - number: '3.3'
    text: 'Met de in het vorige lid bedoelde categorieën asielzoekers worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.3.a
    text: |-
      de vreemdeling wiens asielaanvraag binnen de procedure op het Aanmeldcentrum is afgewezen en ten aanzien van wie
      een daartoe strekkend en tijdig ingediend verzoek tot het treffen van een voorlopige voorziening om de behandeling
      van het beroeps- en hoger beroepsschrift in Nederland te mogen afwachten, is toegewezen;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.3.b
    text: een alleenstaande minderjarige vreemdeling wiens asielaanvraag binnen de procedure op het AC is afgewezen;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.3.c
    text: |-
      de vreemdeling aan wie de verblijfsvergunning, bedoeld in [artikel 14][ref1] of
      [28 van de Vreemdelingenwet 2000][ref2], is verleend en die, met inachtneming van [artikel 12][ref3], reeds in
      de centrale opvang verblijft in afwachting van het betrekken van woonruimte in een gemeente, of verblijft in
      huisvesting op grond van het [Gemeentelijk Versnellingsarrangement][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0017959#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0017959
        artikel: '12'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0037439
  - number: 3.3.d
    text: |-
      de vreemdeling die een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] heeft ingediend onder een beperking verband houdend met verblijf
      als familie- of gezinslid indien sprake is van gezinshereniging met een asielzoeker aan wie met toepassing van deze
      regeling opvang wordt geboden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.3.e
    text: |-
      de vreemdeling die niet in een opvangvoorziening verblijft als bedoeld in [artikel 1, aanhef en onderdeel h][ref1],
      en die in het bezit wordt gesteld van een verblijfsvergunning asiel bepaalde tijd, of in het bezit wordt gesteld
      van een asielgerelateerde verblijfsvergunning, vanaf het moment van vergunningverlening tot het moment waarop
      passende huisvesting, daaronder begrepen huisvesting op grond van het [Gemeentelijk Versnellingsarrangement][ref2],
      buiten de opvangvoorziening kan worden gerealiseerd, tenzij de vreemdeling reeds van overheidswege in een
      opvangvoorziening is gehuisvest;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0037439
  - number: 3.3.f
    text: |-
      de vreemdeling wiens uitzetting op grond van [artikel 64 van de Vreemdelingenwet 2000][ref1] achterwege blijft, met
      uitzondering van de vreemdeling die in afwachting is van de definitieve beslissing op zijn verzoek om toepassing
      van [artikel 64 van de Vreemdelingenwet 2000][ref2] en die niet een uitgeprocedeerde asielzoeker is en die evenmin
      een vreemdeling is die in afwachting is van de uitspraak in hoger beroep in zijn asielprocedure;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 3.3.g
    text: |-
      de vreemdeling die rechtmatig in Nederland verblijft, als bedoeld in
      [artikel 8, aanhef en onder f of h van de Vreemdelingenwet 2000][ref1], en zich, naar het oordeel van Onze
      Minister, feitelijk in dezelfde situatie bevindt als bedoeld in [artikel 64 van de Vreemdelingenwet 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 3.3.h
    text: |-
      de vreemdeling op wie een besluit als bedoeld in [artikel 45, vierde lid, van de Vreemdelingenwet 2000][ref1] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '45'
  - number: 3.3.i
    text: |-
      de vreemdeling op wie een besluit als bedoeld in [artikel 45, zesde lid, van de Vreemdelingenwet 2000][ref1] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '45'
  - number: 3.3.j
    text: |-
      de vreemdeling aan wie binnen de AC-procedure een verblijfsvergunning als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1] wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.3.k
    text: de uitgenodigde vluchteling, ook en indien reeds binnen de AC-procedure een verblijfsvergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.3.l
    text: |-
      de vreemdeling wiens asielaanvraag is afgewezen en die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder h, van de Vreemdelingenwet 2000][ref1] op grond van een door de president van het Europees Hof
      voor de Rechten van de Mens getroffen voorlopige maatregel (‘interim measure’) waarin is bepaald dat de vreemdeling
      vooralsnog niet mag worden uitgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.3.m
    text: |-
      de uitgeprocedeerde asielzoeker of de vreemdeling die in afwachting is van de uitspraak in hoger beroep in zijn
      asielprocedure met rechtmatig verblijf als bedoeld in artikel 8, aanhef en onder f, van de Vreemdelingenwet 2000,
      die voorafgaand aan de indiening van een aanvraag om een verblijfsvergunning als bedoeld in artikel 14 van de
      Vreemdelingenwet 2000 onder de beperking ‘medische behandeling’ zijn complete en actuele medische gegevens heeft
      overgelegd;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
  - number: 3.3.n
    text: |-
      de uitgeprocedeerde asielzoeker aan wie een verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] onder de beperking ‘verblijf voor het ondergaan van medische
      behandeling’ of ‘verblijf vanwege medische noodsituatie’ is verleend op basis van voorafgaand aan de aanvraag
      overgelegde complete en actuele medische gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.3.o
    text: |-
      de uitgeprocedeerde asielzoeker of de vreemdeling die in afwachting is van de
      uitspraak in hoger beroep in zijn asielprocedure met rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder h, van de Vreemdelingenwet 2000][ref1], die voorafgaand aan de aanvraag om verblijf op
      medische gronden zijn complete en actuele medische gegevens heeft overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.3.p
    text: |-
      de vreemdeling die rechtmatig verblijf heeft op grond van [artikel 8, onder m, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.3.q
    text: |-
      de vreemdeling die in het bezit is gesteld van een machtiging tot voorlopig verblijf als bedoeld
      in [artikel 1a, onder b, van de Vreemdelingenwet 2000][ref1] en voldoet aan de voorwaarden van
      [artikel 29, tweede lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: '3.4'
    text: |-
      Het COA draagt zorg voor de centrale opvang van andere categorieën vreemdelingen, als bedoeld in
      [artikel 3, tweede, lid, van de Wet Centraal Orgaan opvang asielzoekers][ref1], na een verzoek hiertoe van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
  - number: '4.1'
    text: |-
      In naar behoren gemotiveerde gevallen kan de Minister aan het COA de bevoegdheid verlenen om bepaalde categorieën
      asielzoekers uit te sluiten van opvang indien:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: 4.1.a
    text: de gewoonlijk beschikbare huisvestingscapaciteit tijdelijk uitgeput is;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: 4.1.b
    text: een beoordeling van de specifieke situatie en bijzondere opvangbehoeften van een kwetsbare asielzoeker vereist is.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      Aan een asielzoeker die overeenkomstig het eerste lid is uitgesloten van opvang, worden vervangende verstrekkingen
      verleend, die in elk geval de basisbehoeften dekken.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: '4.3'
    text: 'Er bestaat geen recht op opvang:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: 4.3.a
    text: |-
      indien de asielzoeker niet binnen 24 uur na doorverwijzing door het COA naar de opvang in de opvangvoorziening
      arriveert;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: 4.3.b
    text: |-
      indien de asielzoeker een onderdaan is van een lidstaat van de Europese Unie, de Europese Economische Ruimte of
      Zwitserland;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
  - number: 4.3.c
    text: |-
      indien de asielzoeker tot ongewenst vreemdeling als bedoeld in [artikel 67 van de Vreemdelingenwet 2000][ref1] is
      verklaard, of tegen de asielzoeker een inreisverbod als bedoeld in [artikel 66a van die wet][ref2] is uitgevaardigd
      en hij uit dien hoofde geen rechtmatig verblijf heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 4.3.d
    text: |-
      door het enkele beroep van de asielzoeker op [artikel 64 van de Vreemdelingenwet 2000][ref1] of op de daarmee
      gelijkgestelde feitelijk situatie, bedoeld in [artikel 3, derde lid, aanhef en onder g][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      Het recht op opvang van een asielzoeker wiens asielaanvraag die recht op opvang heeft gegeven is afgewezen, eindigt
      indien de vertrektermijn als bedoeld in [artikel 62 van de Vreemdelingenwet 2000][ref1] is verstreken, tenzij de
      uitzetting van betrokkene ingevolge de [Vreemdelingenwet 2000][ref2] of een rechterlijke uitspraak achterwege dient
      te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0011823
  - number: '6'
    text: 'Het recht op opvang van een alleenstaande minderjarige vreemdeling eindigt:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel6
  - number: 6.a
    text: |-
      indien de asielaanvraag die recht heeft gegeven op opvang is afgewezen en de uitzetting kan worden geëffectueerd,
      op de dag waarop de uitzetting wordt geëffectueerd;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel6
  - number: 6.b
    text: |-
      indien vervolgopvang kan worden geboden door of in opdracht van de rechtspersoon, als bedoeld in
      [artikel 1:302, tweede lid, van het Burgerlijk Wetboek][ref1], op de dag waarop vervolgopvang kan worden geboden;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
  - number: 6.c
    text: |-
      op de dag na de dag waarop de 18-jarige leeftijd is bereikt, dan wel indien in de vreemdelingrechtelijke
      procedure onaantastbaar is vastgesteld dat de vreemdeling meerderjarig is, en de vreemdeling ook op grond van zijn
      asielaanvraag geen recht op opvang heeft.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel6
  - number: '7.1'
    text: 'Het recht op opvang eindigt in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
  - number: 7.1.a
    text: |-
      indien het een asielzoeker betreft aan wie een verblijfsvergunning is verleend: op de dag waarop naar het oordeel
      van het COA passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
  - number: 7.1.b
    text: |-
      indien het een asielzoeker betreft die rechtmatig verwijderbaar is vanwege het niet inwilligen van de asielaanvraag
      die recht geeft op opvang: op de dag na de dag waarop de vreemdeling rechtmatig verwijderbaar is geworden;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
  - number: 7.1.c
    text: |-
      indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder d][ref1] van
      deze regeling opvang is geboden: op de dag waarop voor de asielzoeker met wie gezinshereniging wordt beoogd naar
      het oordeel van het COA passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: 7.1.d
    text: |-
      indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder f][ref1]
      van deze regeling opvang is geboden: vier weken nadat het rechtmatig verblijf, als bedoeld in
      [artikel 8, aanhef en onder j, van de Vreemdelingenwet 2000][ref2] is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.1.e
    text: |-
      indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder g][ref1] van
      deze regeling opvang is geboden: op de dag na de dag waarop naar het oordeel van Onze Minister niet langer sprake
      is van feitelijk dezelfde situatie, als bedoeld in [artikel 64 van de Vreemdelingenwet 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 7.1.f
    text: |-
      indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder h][ref1]
      van deze regeling opvang is geboden: vier weken na de dag waarop het besluit, als bedoeld in
      [artikel 45 vierde lid van de Vreemdelingenwet 2000][ref2], is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
  - number: 7.1.g
    text: |-
      indien het een asielzoeker betreft aan wie met toepassing van [artikel 3, derde lid, aanhef en onder i][ref1]
      van deze regeling opvang is geboden: vier weken na de dag waarop het besluit, als bedoeld in
      [artikel 45, zesde lid van de Vreemdelingenwet 2000][ref2] is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '45'
  - number: 7.1.h
    text: |-
      indien een asielzoeker tot ongewenst vreemdeling als bedoeld in [artikel 67 van de Vreemdelingenwet 2000][ref1]
      is verklaard of indien het een asielzoeker betreft jegens wie een inreisverbod als bedoeld in
      [artikel 66a, zevende lid, van die wet][ref2] geldt en de vreemdeling uit dien hoofde geen rechtmatig verblijf
      heeft: onmiddellijk;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 7.1.i
    text: |-
      indien het een asielzoeker betreft die niet binnen 48 uur na overplaatsing in een opvangvoorziening,
      onderscheidenlijk de huisvesting op grond van het [Gemeentelijk Versnellingsarrangement][ref1], arriveert: op het
      moment waarop deze termijn verstrijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037439
  - number: 7.1.j
    text: |-
      indien het een asielzoeker betreft die twee opeenvolgende malen niet heeft voldaan aan de meldplicht bij de
      Vreemdelingenpolitie: twee weken nadat hij voor de eerste maal heeft verzuimd zich bij de Vreemdelingenpolitie
      te melden;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
  - number: 7.1.k
    text: |-
      indien een asielzoeker onjuiste gegevens heeft verstrekt danwel gegevens heeft achtergehouden, met het oogmerk
      om aldus voor zichzelf of voor degenen voor wie hij zorgt, ten onrechte een aanspraak te doen ontstaan op de
      verstrekkingen bedoeld in [artikel 9][ref1] van deze regeling, danwel ten onrechte de hoogte van de verstrekkingen
      te doen stijgen;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: 7.1.l
    text: |-
      indien een asielzoeker niet de instemming heeft verkregen als bedoeld in [artikel 12][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel12
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '12'
        hoofdstuk: IV
  - number: 7.1.m
    text: |-
      indien het een uitgeprocedeerde asielzoeker betreft aan wie met toepassing van
      [artikel 3, derde lid, aanhef en onder o][ref1], van deze regeling opvang is geboden: vier weken nadat het
      rechtmatig verblijf, bedoeld in [artikel 8, aanhef en onder h, van de Vreemdelingenwet 2000][ref2] is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '7.2'
    text: |-
      Een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] is niet van invloed op het moment van het eindigen van het recht
      op opvang.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid, aanhef en onder e, eindigt het recht op opvang indien het een uitgeprocedeerde
      asielzoeker betreft, die voorafgaand aan de aanvraag op medische gronden zijn complete en actuele medische
      gegevens heeft overgelegd, aan wie met toepassing van [artikel 3, derde lid, aanhef en onder g][ref1],
      van deze regeling opvang is geboden: vier weken nadat het rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder f, van de Vreemdelingenwet 2000][ref2] is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '9.1'
    text: |-
      Behoudens de uitzondering genoemd in het vijfde lid, omvat de opvang in een opvangvoorziening in elk geval de
      volgende verstrekkingen:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.a
    text: |-
      onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden of in particuliere huizen,
      appartementen, hotels of andere voor de huisvesting van asielzoekers aangepaste ruimten;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.b
    text: een wekelijkse financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.c
    text: |-
      openbaar vervoerskaarten voor reizen van en naar de rechtsbijstandverlener in verband met de asielprocedure
      afgezien van de dagen die beschikbaar zijn voor het onderzoek naar de asielaanvraag gedurende de algemene
      asielprocedure;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.d
    text: recreatieve en educatieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.e
    text: de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.f
    text: een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.1.g
    text: betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      Zo spoedig mogelijk nadat een asielzoeker voor de eerste keer in een opvangvoorziening is opgevangen, vindt een
      eerste onderzoek naar zijn gezondheidstoestand plaats.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.3'
    text: 'Het COA zorgt ervoor dat tijdens het verblijf in de opvangvoorziening:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.3.a
    text: de asielzoeker bescherming van zijn gezinsleven geniet;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.3.b
    text: |-
      de asielzoeker de mogelijkheid heeft om te communiceren met familieleden, juridisch adviseurs of raadslieden en
      vertegenwoordigers van de Hoge Commissaris der Verenigde Naties voor Vluchtelingen (UNHCR) en andere relevante,
      internationale en niet-gouvernementele organisaties en instanties;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.3.c
    text: |-
      familieleden, juridisch adviseurs of raadslieden, vertegenwoordigers van de UNHCR en relevante door de Minister
      erkende niet-gouvernementele organisaties toegang hebben tot de opvangvoorziening zodat zij de asielzoeker kunnen
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9.3.d
    text: de asielzoeker een programma voor educatie en ontwikkeling wordt geboden.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.4'
    text: |-
      De toegang, bedoeld in het derde lid, onder c, kan slechts worden beperkt om redenen die verband houden met de
      veiligheid van de opvangvoorziening en van de asielzoekers.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.5'
    text: |-
      Het eerste lid, onder b en d, en het derde lid, onder d, zijn niet van toepassing op de asielzoeker
      wiens asielaanvraag in het Aanmeldcentrum wordt behandeld dan wel de vreemdeling die in zijn rust- en
      voorbereidingstermijn voor verstrekkingen in aanmerking komt, tenzij het een alleenstaande minderjarige vreemdeling
      betreft.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.6'
    text: |-
      Elke opvangvoorziening heeft een door het COA opgesteld huishoudelijk reglement waarin tenminste passende
      maatregelen zijn opgenomen om geweldpleging en gendergerelateerd geweld, met inbegrip van aanranding en seksuele
      intimidatie, te voorkomen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: '9.7'
    text: |-
      Het aanbieden van recreatieve en educatieve activiteiten en het in bruikleen geven van gebruiksvoorwerpen kan
      afhankelijk worden gesteld van de betaling door de asielzoeker van een waarborgsom.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9
  - number: 9a.1
    text: |-
      Aan de vreemdeling, bedoeld in [artikel 3, derde lid, de onderdelen c, e, j en k][ref1], die inburgeringsplichtig
      is op grond van de [Wet inburgering][ref2], kan tijdens diens verblijf in de opvangvoorziening een voorziening
      worden aangeboden op grond waarvan een aanvang kan worden gemaakt met de voorbereiding van het examen, bedoeld in
      [artikel 7, tweede lid, onderdeel a, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020611
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0020611
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 9a.2
    text: |-
      Deze voorziening wordt slechts aangeboden aan de vreemdeling, bedoeld in het eerste lid, die een verklaring heeft
      ondertekend, waarin hij verklaart de voorziening te accepteren en aan de voorziening deel te nemen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
  - number: 9a.3
    text: |-
      De voorziening bevat in ieder geval de onderdelen op grond waarvan vaardigheden in de Nederlandse taal en kennis
      van de Nederlandse samenleving worden verworven.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
  - number: 9a.4
    text: De deelname aan de voorziening vindt plaats op vrijwillige basis en is kosteloos.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Het COA draagt er zorg voor dat de deelname aan de voorziening bij overplaatsing van de vreemdeling, bedoeld
      in het eerste lid, naar een andere opvangvoorziening als bedoeld in [artikel 11, eerste lid][ref1], kan worden
      gecontinueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel11
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '11'
        hoofdstuk: IV
  - number: 9a.6
    text: |-
      Deelname aan de voorziening mag de uitplaatsing naar een gemeente in geen geval vertragen.
      [Artikel 7, eerste lid, aanhef en onder a][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel7
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '7'
        hoofdstuk: III
  - number: '10.1'
    text: |-
      Het COA kan de in [artikel 9, eerste lid][ref1], bedoelde verstrekkingen beperken of, in uitzonderlijke gevallen
      intrekken indien de asielzoeker:


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: 10.1.a
    text: |-
      de door het COA vastgestelde opvangvoorziening heeft verlaten zonder het COA op de hoogte stellen of, indien
      toestemming vereist is, zonder toestemming;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: 10.1.b
    text: |-
      gedurende twee weken niet heeft voldaan aan de verplichting, bedoeld in [artikel 19, eerste lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel19
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '19'
        hoofdstuk: V
  - number: 10.1.c
    text: |-
      gedurende twee weken niet heeft voldaan aan verzoeken van het COA om informatie te verstrekken, met inbegrip
      van gegevens die nodig zijn voor het realiseren van de opvang, waaronder in elk geval zijn naam geboortedatum,
      nationaliteit, land van herkomst, gezinssamenstelling, vermogenspositie en de datum waarop door of ten behoeve van
      hem een asielaanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: 10.1.d
    text: twee opeenvolgende malen niet is verschenen voor een gehoor betreffende de asielprocedure;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: 10.1.e
    text: |-
      een opvolgende asielaanvraag, als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref1], heeft ingediend nadat
      een definitieve beslissing, met inbegrip van een expliciete of impliciete intrekking, over een vorige asielaanvraag
      is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 10.1.f
    text: |-
      financiële middelen verborgen heeft gehouden en daardoor ten onrechte van de opvangvoorzieningen gebruik heeft
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: 10.1.g
    text: |-
      een hem overeenkomstig het bepaalde in [artikel 20, tweede lid][ref1], in rekening gebrachte tegemoetkoming in de
      kosten van opvang niet betaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel20
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '20'
        hoofdstuk: V
  - number: 10.1.h
    text: |-
      ernstig inbreuk maakt op de verplichtingen, bedoeld in [artikel 19, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel19
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '19'
        hoofdstuk: V
  - number: 10.1.i
    text: |-
      een ernstige vorm van geweld pleegt jegens asielzoekers die in een opvangvoorziening verblijven, aan personen die
      werkzaam zijn in de voorziening of aan anderen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het COA kan de in [artikel 9, eerste lid][ref1], bedoelde verstrekkingen beperken indien het kan aantonen dat de
      asielzoeker zonder gerechtvaardigde reden na zijn binnenkomst in Nederland niet zo spoedig als redelijkerwijze
      mogelijk is een asielaanvraag heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '10.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder a tot en met d, wordt, wanneer de asielzoeker zich bij het
      COA meldt, een gemotiveerde, op de redenen voor de verdwijning gebaseerde beslissing genomen inzake het opnieuw
      verstrekken van sommige of alle beperkte of ingetrokken verstrekkingen, bedoeld in [artikel 9, eerste lid][ref1],
      mits de asielzoeker recht heeft op opvang als bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Het eerste lid, onder b, is niet van toepassing op de asielzoeker wiens asielaanvraag in het Aanmeldcentrum wordt
      behandeld dan wel de vreemdeling die in de rust- en voorbereidingstermijn voor verstrekkingen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: '10.5'
    text: |-
      De beslissing, bedoeld in het eerste en tweede lid, wordt gemotiveerd en genomen op grond van de specifieke
      situatie van de asielzoeker.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
  - number: '10.6'
    text: |-
      De verstrekkingen bedoeld in [artikel 9, eerste lid][ref1], worden niet beperkt of ingetrokken voordat de
      beslissing, bedoeld in het eerste en tweede lid is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '11.1'
    text: |-
      Het COA bepaalt in welke opvangvoorziening een asielzoeker wordt geplaatst en is bevoegd een
      asielzoeker naar een andere voorziening, mede daaronder begrepen huisvesting als bedoeld in het
      [Gemeentelijk Versnellingsarrangement][ref1], over te plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037439
  - number: '11.2'
    text: 'Overplaatsing is in ieder geval noodzakelijk indien:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
  - number: 11.2.a
    text: de opvangvoorziening waarin de asielzoeker verblijft, wordt gesloten;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
  - number: 11.2.b
    text: een doelmatige en doeltreffende uitvoering van de asielprocedure daarmee is gediend.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
  - number: '11.3'
    text: |-
      Na overplaatsing van een asielzoeker naar een andere opvangvoorziening worden de in artikel 9, eerste lid, bedoelde
      verstrekkingen in deze andere opvangvoorziening aangeboden. [Artikel 9, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '11.4'
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in het eerste lid, zorgt het COA er voor dat de eenheid van het
      gezin in de mate van het mogelijke en met instemming van de asielzoekers bewaard wordt.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      De asielzoeker aan wie een verblijfsvergunning is verleend en die in afwachting is van het betrekken van woonruimte
      in een gemeente krijgt de verstrekkingen, bedoeld in [artikel 9 eerste lid][ref1] van deze regeling, aangeboden
      indien het COA hiermee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '12.2'
    text: |-
      De asielzoeker, bedoeld in het eerste lid, zal zich iedere twee weken bij het COA moeten melden en de instemming
      bedoeld in het eerste lid moeten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel12
  - number: '14.1'
    text: |-
      De door de asielzoeker te ontvangen wekelijkse financiële toelage, bedoeld in
      [artikel 9, eerste lid, aanhef en onder b][ref1], van deze regeling, bestaat uit een bedrag ten behoeve van voedsel
      en een bedrag ten behoeve van kleding en andere persoonlijke uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '14.2'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners volledig zelf het eigen eten verzorgen, wordt berekend aan de hand van de volgende bedragen per persoon,
      per week:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.2.a
    text: |-
      bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 44,38, kind tot 18
      jaar: € 36,54;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.2.b
    text: 'bij een driepersoonshuishouden: volwassene: € 35,49, kind tot 18 jaar: € 29,26;'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.2.c
    text: 'bij een huishouden van vier of meer personen: volwassene: € 31,08, kind tot 18 jaar: € 25,55.'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.3'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners het ontbijt en een tweede maaltijd zelf verzorgen en niet de hoofdmaaltijd, wordt berekend aan de hand van
      het volgende bedrag per persoon, per week:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.3.a
    text: |-
      bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 29,68, kind tot 18
      jaar: € 25,06;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.3.b
    text: 'bij een driepersoonshuishouden: volwassene: € 23,73, kind tot 18 jaar: € 20,02;'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: 14.3.c
    text: 'bij een huishouden van vier of meer personen: volwassene: € 20,79, kind tot 18 jaar: € 17,57.'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.4'
    text: |-
      De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het eerste lid, is: € 12,95 per
      persoon, per week.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.5'
    text: |-
      De financiële toelage wordt iedere week bij vooruitbetaling op een door het COA vastgestelde tijd (en plaats) aan
      de asielzoeker beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.6'
    text: |-
      Geen financiële toelage wordt verstrekt aan een kind drie maanden nadat het recht op een uitkering op grond van de
      [Algemene Kinderbijslagwet][ref1] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '14.7'
    text: |-
      De financiële toelage voor een asielzoeker jonger dan 18 jaar, die een kind is van, of verzorgd wordt door
      een of meer in de desbetreffende opvangvoorziening verblijvende asielzoekers wordt uitbetaald aan één van die
      asielzoekers.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.8'
    text: |-
      Het COA draagt zorg voor de maaltijden in centra waarin de bewoners niet in de gelegenheid zijn deze zelf te
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '14.9'
    text: |-
      In afwijking van het eerste lid wordt geen financiële toelage verstrekt aan de asielzoeker wiens asielaanvraag
      in het Aanmeldcentrum wordt behandeld dan wel aan de vreemdeling die in zijn rust- en voorbereidingstermijn voor
      verstrekkingen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel14
  - number: '16.1'
    text: |-
      Het treffen van een ziektekostenregeling bedoeld in [artikel 9 eerste lid, onderdeel e][ref1] van deze regeling,
      houdt in het afsluiten van een ziektekostencontract ter dekking van de kosten van het door Onze Minister
      vastgestelde pakket medische verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '16.2'
    text: |-
      Het verzekeren tegen de financiële gevolgen van wettelijke aansprakelijkheid, bedoeld in
      [artikel 9, eerste lid, onderdeel f][ref1] van deze regeling, houdt in het ten behoeve van de asielzoeker afsluiten
      van een verzekering voor de wettelijke aansprakelijkheid van de asielzoeker jegens een derde voor een som van
      maximaal € 453.780 per gebeurtenis per jaar, alsmede het betalen van de daarvoor verschuldigde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '17.1'
    text: |-
      Een asielzoeker kan een vergoeding ontvangen voor buitengewone kosten, bedoeld in
      [artikel 9, eerste lid, onderdeel g][ref1] van deze regeling, die hij heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '17.2'
    text: |-
      Buitengewone kosten zijn noodzakelijke kosten die vanwege hun aard of hoogte in redelijkheid niet geacht kunnen
      worden door de asielzoeker zelf te worden betaald.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: '17.3'
    text: |-
      Buitengewone kosten worden slechts betaald voorzover vooraf door het COA aan de asielzoeker toestemming is
      verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien uit noodsituaties waarin geen
      mogelijkheid bestond tot het verzoeken om toestemming.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: '17.4'
    text: |-
      De toestemming, bedoeld in het derde lid, wordt uitsluitend verleend indien en voor zover de kosten noodzakelijk
      zijn en niet op andere wijze in de betaling kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: '17.5'
    text: |-
      Kosten die samenhangen met een door de asielzoeker ingediende aanvraag als bedoeld in
      [artikel 24, tweede lid, van de Vreemdelingenwet 2000][ref1], dan wel met een door de asielzoeker gepleegde
      onrechtmatige daad, gepleegd misdrijf of begane overtreding zijn in ieder geval geen buitengewone kosten, als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '24'
  - number: '17.6'
    text: |-
      Het Orgaan kan op een daartoe strekkend verzoek van een vreemdeling afwijken van het bepaalde in het vijfde lid,
      uitsluitend voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: 17.6.a
    text: |-
      de leges ter zake van de afdoening van een aanvraag om verlenging van de verblijfsvergunning regulier voor bepaalde
      tijd onder de beperking verband houdend met tijdelijke humanitaire gronden, mits betrokkene op het moment van de
      aanvraag nog niet de leeftijd van 18 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: 17.6.b
    text: |-
      de leges ter zake van de afdoening van een aanvraag om wijziging van de verblijfsvergunning regulier voor bepaalde
      tijd onder de beperking verband houdend met tijdelijke humanitaire gronden in een verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met niet-tijdelijke humanitaire gronden, mits betrokkene voor het
      bereiken van de leeftijd van 15 jaar in het bezit is gesteld van een verblijfsvergunning regulier voor bepaalde
      tijd onder de beperking verband houdend met tijdelijke humanitaire gronden en nog niet de leeftijd van 18 jaar
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: 17.6.c
    text: |-
      de leges ter zake van de afdoening van de aanvraag om verlening van een verblijfsvergunning regulier voor
      bepaalde tijd onder de beperking verband houdend met verblijf als familie- of gezinslid, in de gevallen waarin de
      statushouder de ouder is van de aanvrager en deze op het moment van de aanvraag niet minimaal evenveel verdient als
      de normbedragen uit de [Participatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 17.6.d
    text: |-
      de leges ter zake van de afdoening van een aanvraag om verlening van een verblijfsvergunning regulier voor bepaalde
      tijd onder de beperking verband houdend met verblijf als familie- of gezinslid ingediend door of namens een in
      Nederland geboren kind dat op grond van [artikel 3, derde lid, onder d][ref1], opvang wordt geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: '17.7'
    text: |-
      Onder buitengewone kosten als bedoeld in [artikel 9, eerste lid, onder g][ref1], worden niet verstaan de kosten
      voor:


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: 17.7.a
    text: |-
      een contra-expertise indien het een asielzoeker betreft wiens asielaanvraag in het Aanmeldcentrum wordt behandeld
      of is afgewezen dan wel indien het een vreemdeling betreft die in zijn rust- en voorbereidingstermijn voor
      verstrekkingen in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: 17.7.b
    text: de huur van een woning dan wel de aan de huur van een woning gerelateerde kosten;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: 17.7.c
    text: een onderzoek, als bedoeld in [artikel 3.109e, vierde lid, van het Vreemdelingenbesluit 2000](onbekend).
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel17
  - number: '18.1'
    text: |-
      Een asielzoeker kan door het COA nader aan te wijzen werkzaamheden verrichten in en rondom de opvangvoorziening,
      voor de uitvoering waarvan een vergoeding kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het COA zorgt voor een evenredige verdeling van het aanbod van werkzaamheden bedoeld in het eerste lid over de in
      de opvangvoorziening verblijvende asielzoekers die daarvoor in aanmerking wensen te komen.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18
  - number: '18.3'
    text: |-
      De vergoeding die een asielzoeker ontvangt voor het verrichten van werkzaamheden als bedoeld in het eerste lid,
      bedraagt in totaal niet meer dan € 14,– per week.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18
  - number: 18a.1
    text: |-
      Het COA zorgt ervoor dat tijdens het verblijf in de opvangvoorziening rekening wordt gehouden met de specifieke
      situatie van kwetsbare personen als bedoeld in artikel 21 van de Opvangrichtlijn.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18a
  - number: 18a.2
    text: Ter uitvoering van het eerste lid beoordeelt het COA of de asielzoeker bijzondere opvangbehoeften heeft.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18a
  - number: 18a.3
    text: |-
      Indien de asielzoeker overeenkomstig het tweede lid bijzondere opvangbehoeften heeft, wordt naast de
      verstrekkingen, bedoeld in [artikel 9, eerste lid][ref1], specifieke steun en begeleiding geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: 18b
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in [artikel 11, eerste lid][ref1], zorgt het COA ervoor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel11
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '11'
        hoofdstuk: IV
  - number: 18b.a
    text: |-
      minderjarige kinderen van asielzoekers of minderjarige asielzoekers worden gehuisvest bij hun ouders, bij hun
      ongehuwde broers of zussen of bij de volwassene die krachtens het recht of de praktijk van Nederland voor hen
      verantwoordelijk is, mits het in het belang van de betrokken minderjarige is;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18b
  - number: 18b.b
    text: |-
      afhankelijke volwassen asielzoekers met bijzondere opvangbehoeften in de regel worden ondergebracht bij
      volwassen nauwe verwanten die zich reeds in Nederland bevinden en die volgens het recht of de praktijk voor hen
      verantwoordelijk zijn.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18b
  - number: 18c
    text: 'Het COA zorgt er tijdens het verblijf in de opvangvoorziening voor dat:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18c
  - number: 18c.a
    text: |-
      minderjarigen kunnen deelnemen aan vrijetijdsactiviteiten, met inbegrip van spel- en recreatieve activiteiten die
      passen bij hun leeftijd en aan activiteiten in de open lucht;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18c
  - number: 18c.b
    text: |-
      minderjarigen die het slachtoffer zijn geweest van enige vorm van mishandeling, verwaarlozing, uitbuiting,
      foltering of wrede, onmenselijke of vernederende behandeling of die hebben geleden onder gewapende conflicten,
      toegang hebben tot de rehabilitatiediensten en waar nodig gekwalificeerde begeleiding wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18c
  - number: 18c.c
    text: |-
      personen die foltering, verkrachting of andere ernstige vormen van geweld hebben ondergaan, voor hun daardoor
      veroorzaakte letsel de vereiste behandeling ontvangen, met name door hen toegang te geven tot passende medische en
      psychische behandeling en verzorging.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel18c
  - number: '19.1'
    text: 'Behoudens de uitzondering genoemd in lid 2 is de asielzoeker die onderdak heeft in een opvangvoorziening verplicht:'
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.a
    text: de huisregels na te leven die zijn neergelegd in het reglement van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.b
    text: gevolg te geven aan de aanwijzingen van het personeel van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.c
    text: schoonmaakwerkzaamheden te verrichten in en rond de woonruimte;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.d
    text: |-
      toegang te verlenen aan het personeel van de opvangvoorziening tot zijn woonruimte indien er een redelijk vermoeden
      bestaat dat de asielzoeker de huisregels overtreedt of indien dit voor het beheer van de opvangvoorziening
      redelijkerwijs noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.e
    text: |-
      te voldoen aan de COA inhuisregistratie door zich wekelijks te melden bij het COA teneinde te kunnen vaststellen of
      hij nog in de opvangvoorziening verblijft en aanspraak maakt op opvangvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: 19.1.f
    text: deel te nemen aan programma’s gericht op het voorlichten over en het stimuleren en bewustmaken van terugkeer.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het eerste lid, onder e, is niet van toepassing op de asielzoeker wiens asielaanvraag in het Aanmeldcentrum wordt
      behandeld dan wel de vreemdeling die in zijn rust- en voorbereidingstermijn voor verstrekkingen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel19
  - number: '20.1'
    text: |-
      De asielzoeker is verplicht onverwijld uit eigen beweging, of op verzoek van het COA, mededeling te doen van alle
      feiten of omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het
      recht op verstrekkingen, het geldend maken van het recht op verstrekkingen, de duur van verstrekkingen of de hoogte
      van de toelagen die aan hem worden betaald. Indien deze feiten of omstandigheden betrekking hebben op een kind
      dan wordt de mededeling gedaan door de asielzoeker te wiens laste het kind komt en in het geval dit meer dan één
      asielzoeker betreft, door één van die asielzoekers.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien een asielzoeker of vergunninghouder die verblijft in een opvangvoorziening, dan wel de vergunninghouder
      bedoeld in [artikel 3, derde lid, onderdeel c][ref1], beschikt over een vermogen groter dan de vermogensgrens,
      bedoeld in [artikel 34 van de Participatiewet][ref2] of inkomsten heeft, anders dan kinderbijslag op grond van
      de [Algemene Kinderbijslagwet][ref3] of deze regeling, is die asielzoeker of vergunninghouder aan het COA een
      vergoeding verschuldigd in de kosten van zijn opvang alsmede van de opvang van zijn gezinsleden. De tegemoetkoming
      bedraagt per maand ten hoogste de economische waarde van de aan een asielzoeker of vergunninghouder feitelijk
      geboden verstrekkingen, met dien verstande dat de vergoeding niet meer bedraagt dan het bedrag van het in de eerste
      volzin bedoelde vermogen of de in de eerste volzin bedoelde inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0002368
  - number: '20.3'
    text: |-
      Indien na zijn verblijf in een opvangvoorziening of na huisvesting op grond van het
      [Gemeentelijk Versnellingsarrangement][ref1] blijkt dat een vreemdeling tijdens dit verblijf beschikte over een
      vermogen of inkomsten, bedoeld in het tweede lid, kan het COA de kosten van de opvang van deze vreemdeling alsmede
      de kosten van opvang van zijn gezinsleden van hem terugvorderen. De terug te vorderen kosten per maand zijn niet
      hoger dan de economische waarde van de aan de vreemdeling feitelijk geboden verstrekkingen, vermeerderd met de
      economische waarde van de aan ieder gezinslid feitelijk geboden verstrekkingen, met dien verstande dat het terug te
      vorderen bedrag niet meer bedraagt dan het bedrag van het in het tweede lid bedoelde vermogen of de in het tweede
      lid bedoelde inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0037439
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037439
  - number: '21'
    text: |-
      Indien blijkt dat een asielzoeker in strijd met de waarheid gegevens heeft verstrekt of verzwegen,
      waardoor hij of zijn gezinsleden ten onrechte, of tot een te hoog bedrag, de verstrekkingen, bedoeld in
      [artikel 9, eerste lid][ref1], hebben verkregen, dan wel dit op andere wijze heeft bewerkstelligd, is het
      COA bevoegd de waarde van de ten onrechte toegekende verstrekkingen terug te vorderen en in het geval van de
      vergunninghouder bedoeld in [artikel 3, derde lid, en onder c][ref2], de verstrekkingen tevens direct stop te
      zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel3
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '3'
        hoofdstuk: II
  - number: '22'
    text: |-
      Voor de verstrekkingen op basis van deze regeling geldt een beslagvrije voet ten aanzien van alle
      verstrekkingen die in natura geschieden en viervijfde deel van de verstrekkingen op grond van
      [artikel 9, eerste lid, onderdeel b][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: '23'
    text: Indien er ten aanzien van een asielzoeker
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel23
  - number: 23.a
    text: voor 1 januari 2000 op diens asielaanvraag in eerste aanleg in negatieve zin is beslist;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel23
  - number: 23.b
    text: een last tot uitzetting is gegeven; en
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel23
  - number: 23.c
    text: |-
      door de korpschef van de politieregio waar de vreemdeling zijn woon- of verblijfsplaats heeft is meegedeeld dat hij
      Nederland moet verlaten,
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel23
  - number: '24'
    text: |-
      [Artikel 7, eerste lid, aanhef en onder b][ref1] van deze regeling is, in afwijking van [artikel 23][ref2] van deze
      regeling, eveneens van toepassing op de vreemdeling ten aanzien van wie:


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel23
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '23'
        hoofdstuk: VI
  - number: 24.a
    text: op of na 1 januari 2000 een niet inwilligende beslissing op de asielaanvraag is genomen, of;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel24
  - number: 24.b
    text: |-
      op of na 29 december 2000 een negatieve beslissing op het ingediende bezwaar tegen de niet inwilligende beslissing
      op de asielaanvraag is genomen, of;
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel24
  - number: 24.c
    text: |-
      op of na 1 januari 2000 de vergunning tot verblijf, daaronder begrepen de voorwaardelijke vergunning tot verblijf,
      is ingetrokken of niet is verlengd, of de toelating als vluchteling is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel24
  - number: '25'
    text: |-
      De [Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 1997][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009205
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009205
  - number: '26'
    text: Deze regeling treedt in werking de tweede dag na dagtekening van de Staatscourant waarin zij wordt geplaatst
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel26
  - number: '27'
    text: |-
      Deze regeling kan wordt aangehaald als de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen
      2005.
    url: https://wetten.overheid.nl/BWBR0017959/2017-01-01#Artikel27
