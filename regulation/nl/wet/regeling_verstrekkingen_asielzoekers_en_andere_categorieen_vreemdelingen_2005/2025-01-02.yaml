  - number: '9'
    text: |-
      1 Behoudens de uitzondering genoemd in het vijfde lid, omvat de opvang in een opvangvoorziening in elk geval de
      volgende verstrekkingen:

      a. onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden of in particuliere huizen,
      appartementen, hotels of andere voor de huisvesting van asielzoekers aangepaste ruimten;

      b. een wekelijkse financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven;

      c. openbaar vervoerskaarten voor reizen van en naar de rechtsbijstandverlener in verband met de asielprocedure
      afgezien van de dagen die beschikbaar zijn voor het onderzoek naar de asielaanvraag gedurende de algemene
      asielprocedure;

      d. recreatieve en educatieve activiteiten;

      e. de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling;

      f. een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid;

      g. betaling van buitengewone kosten.

      2 Zo spoedig mogelijk nadat een asielzoeker voor de eerste keer in een opvangvoorziening is opgevangen, vindt een
      eerste onderzoek naar zijn gezondheidstoestand plaats.

      3 Het COA zorgt ervoor dat tijdens het verblijf in de opvangvoorziening:

      a. de asielzoeker bescherming van zijn gezinsleven geniet;

      b. de asielzoeker de mogelijkheid heeft om te communiceren met familieleden, juridisch adviseurs of raadslieden
      en vertegenwoordigers van de Hoge Commissaris der Verenigde Naties voor Vluchtelingen (UNHCR) en andere relevante
      nationale, internationale en niet-gouvernementele organisaties en instanties;

      c. familieleden, juridisch adviseurs of raadslieden, vertegenwoordigers van de UNHCR en relevante door de Minister
      erkende niet-gouvernementele organisaties toegang hebben tot de opvangvoorziening zodat zij de asielzoeker kunnen
      bijstaan;

      d. de asielzoeker een programma voor educatie en ontwikkeling wordt geboden.

      4 De toegang, bedoeld in het derde lid, onder c, kan slechts worden beperkt om redenen die verband houden met de
      veiligheid van de opvangvoorziening en van de asielzoekers.

      5 Het eerste lid, onder b en d, en het derde lid, onder d, zijn niet van toepassing op de asielzoeker
      wiens asielaanvraag in het Aanmeldcentrum wordt behandeld dan wel de vreemdeling die in zijn rust- en
      voorbereidingstermijn voor verstrekkingen in aanmerking komt, tenzij het een alleenstaande minderjarige vreemdeling
      betreft.

      6 In afwijking van het vijfde lid zijn op de asielzoeker wiens aanvraag in het Aanmeldcentrum wordt behandeld
      dan wel de vreemdeling die in zijn rust- en voorbereidingstermijn voor verstrekkingen in aanmerking komt van
      toepassing:

      a. de wekelijkse financiële toelage ten behoeve van voedsel, indien hij in een opvangvoorziening
      verblijft waar voorzieningen aanwezig zijn om zelf het eigen eten te verzorgen als bedoeld in
      [artikel 14, tweede en derde lid][ref1];

      b. de wekelijke financiële toelage ten behoeve van kleding en andere persoonlijke uitgaven als bedoeld in
      [artikel 14, vierde lid][ref2], indien de genoemde vreemdeling in de procesopvanglocatie verblijft en de beoogde
      verblijfsduur in die opvangvoorziening substantieel wordt overschreden.

      7 Het eerste lid, onderdeel b, is niet van toepassing op de asielzoeker:

      a. die is overgeplaatst naar de handhavings- en toezichtlocatie;

      b. die afkomstig is uit een veilig land van herkomst, uitgezonderd alleenstaande minderjarige vreemdelingen;

      c. op wie de Dublinverordening als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref3] van toepassing is,
      uitgezonderd alleenstaande minderjarige vreemdelingen;

      d. die reeds bescherming geniet in een andere lidstaat van de Europese Unie en van
      wie de eerste of opvolgende asielaanvraag niet-ontvankelijk is verklaard op grond van
      [artikel 30a, eerste lid, onder a of d, van de Vreemdelingenwet 2000][ref4], of kennelijk ongegrond is verklaard
      op grond van [artikel 30b, eerste lid, onder b, van de Vreemdelingenwet 2000][ref5], ongeacht de procedure waarin
      daartoe is besloten, uitgezonderd alleenstaande minderjarige vreemdelingen.

      8 Elke opvangvoorziening heeft een door het COA opgesteld huishoudelijk reglement waarin tenminste passende
      maatregelen zijn opgenomen om geweldpleging en gendergerelateerd geweld, met inbegrip van aanranding en seksuele
      intimidatie, te voorkomen.

      9 Onze Minister kan een uitzondering maken op het achtste lid indien de materiële opvang wordt verstrekt in
      particuliere huizen, appartementen, hotels of andere voor de huisvesting van verzoekers aangepaste ruimten.

      10 Het aanbieden van recreatieve en educatieve activiteiten en het in bruikleen geven van gebruiksvoorwerpen kan
      afhankelijk worden gesteld van de betaling door de asielzoeker van een waarborgsom.

      11 Het personeel dat in de opvangvoorziening werkt moet een passende opleiding hebben. Personen die met niet-
      begeleide minderjarigen werken, moeten passend onderricht over hun behoeften gevolgd hebben en blijven volgen.


