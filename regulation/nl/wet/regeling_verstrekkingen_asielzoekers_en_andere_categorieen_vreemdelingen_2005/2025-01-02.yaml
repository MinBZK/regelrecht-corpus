preamble:
  text: |-
    Gelet op artikel 12 van de Wet Centraal Orgaan opvang asielzoekers;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. Onze Minister: de Minister van Veiligheid en Justitie;

      b. het COA: het Centraal Orgaan opvang asielzoekers;

      c. asielaanvraag: een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1];

      d. asielzoeker: een vreemdeling wiens vrijheid niet rechtens is ontnomen, door wie of ten behoeve van wie een
      asielaanvraag is ingediend;

      e. alleenstaande minderjarige vreemdeling: een asielzoeker die de leeftijd van 18 jaar nog niet heeft bereikt en
      die zonder begeleiding of verzorging van een ouder of voogd in Nederland verblijft;

      f. gezinsleden: de volgende leden van het gezin van de asielzoeker die in verband met de asielaanvraag in Nederland
      aanwezig zijn, voor zover het gezin reeds bestond in het land van herkomst:

      1°. echtgenoten of aan gehuwden gelijkgestelde partners;

      2°. hun minderjarige kinderen, mits zij ongehuwd en van hun afhankelijk zijn;

      3°. de vader, moeder, of een andere volwassene die volgens het recht of de praktijk in Nederland verantwoordelijk
      is voor de minderjarige en ongehuwde asielzoeker;

      g. minderjarig: de leeftijd van 18 jaar nog niet bereikt hebbende;

      h. uitgenodigde vluchtelingen: vreemdelingen die, na een verzoek daartoe van de Hoge Commissaris van de Verenigde
      Naties voor vluchtelingen (UNHCR) op uitnodiging van de Nederlandse regering in Nederland verblijven;

      i. rust- en voorbereidingstermijn: de termijn van tenminste zes dagen waarin de vreemdeling
      rechtmatig verblijf heeft na indiening van de asielaanvraag en het onderzoek als bedoeld in
      [artikel 3.110 van het Vreemdelingenbesluit 2000][ref2] nog niet is aangevangen;

      j. Opvangrichtlijn: Richtlijn 2013/33/EU van het Europees Parlement en de Raad van 26 juni 2013 tot vaststelling
      van normen voor de opvang van verzoekers om internationale bescherming (Pb EU 2013, L 180);

      k. contra-expertise: een onderzoek dat op verzoek van de asielzoeker wordt verricht door een door de asielzoeker
      zelf geselecteerde, onafhankelijke deskundige, die niet betrokken was bij het onderzoek door of ten behoeve van de
      Immigratie- en Naturalisatiedienst, op basis van hetzelfde materiaal dat voor dat onderzoek werd gebruikt;

      l. handhavings- en toezichtlocatie: een aparte opvangvoorziening voor asielzoekers van 16 jaar en ouder met
      een streng regime, waar zij door het COA kunnen worden geplaatst als zij overlast veroorzaken in de reguliere
      opvangvoorziening waar zij verblijven of daarbuiten;

      m. exploitatie: de uitvoering van alle taken die behoren bij het voorzien in de materiële en immateriële
      opvang van asielzoekers in de opvangvoorziening, bedoeld in de [Wet Centraal Orgaan opvang asielzoekers][ref3],
      en het faciliteren van de taken die voor de uitvoeringsorganisaties in de migratieketen voortvloeien uit de
      [Vreemdelingenwet 2000][ref4], de Wet Centraal Orgaan opvang asielzoekers en Unierechtelijke verplichtingen;

      n. materiële opvang: de opvangvoorzieningen met inbegrip van huisvesting, voedsel en kleding, die in natura
      of in de vorm van uitkeringen of tegoedbonnen worden verstrekt of een combinatie van deze drie, alsmede een
      dagvergoeding;

      o. immateriële opvang: de immateriële aspecten van het leven in een opvangvoorziening, met inbegrip van medische en
      psychische behandeling en verzorging, recreatieve activiteiten en sociaal-culturele activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
