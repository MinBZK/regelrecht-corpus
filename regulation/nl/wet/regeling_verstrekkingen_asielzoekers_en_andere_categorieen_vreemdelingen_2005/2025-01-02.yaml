  - number: '6'
    text: |-
      Het recht op opvang van een alleenstaande minderjarige vreemdeling eindigt:

      a. indien de asielaanvraag die recht heeft gegeven op opvang is afgewezen en de uitzetting kan worden
      geëffectueerd, op de dag waarop de uitzetting wordt geëffectueerd;

      b. indien vervolgopvang kan worden geboden door of in opdracht van de rechtspersoon, als bedoeld in
      [artikel 1:302, tweede lid, van het Burgerlijk Wetboek][ref1], op de dag waarop vervolgopvang kan worden geboden;

      c. op de dag na de dag waarop de 18-jarige leeftijd is bereikt, dan wel indien in de vreemdelingrechtelijke
      procedure onaantastbaar is vastgesteld dat de vreemdeling meerderjarig is, en de vreemdeling ook op grond van zijn
      asielaanvraag geen recht op opvang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
