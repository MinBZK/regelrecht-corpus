  - number: 22b
    text: |-
      Van exploitatie door het college zijn uitgezonderd de opvangvoorzieningen met opvangplaatsen van bijzondere aard,
      bedoeld in [artikel 1.1 van het Besluit gemeentelijke taak mogelijk maken asielopvangvoorzieningen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049310#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0049310
        artikel: '1.1'
  - number: 22c
    text: |-
      1 Het college faciliteert de taken die voor de relevante uitvoeringsorganisaties in de migratieketen voortvloeien
      uit de [Vreemdelingenwet 2000][ref1], de [Wet Centraal Orgaan opvang asielzoekers][ref2] of uit Unierechtelijke
      verplichtingen, zodat zij deze taken doelmatig en doeltreffend kunnen uitvoeren.

      2 De tussen het college en de uitvoeringsorganisaties in de migratieketen gemaakte werkafspraken worden
      schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0006685
  - number: 22d
    text: |-
      1 Indien het college voornemens is derden in te zetten bij het voorzien in de materiële en immateriële opvang van
      asielzoekers, legt het Centraal Orgaan opvang asielzoekers dat voornemen voor aan Onze Minister. Derden worden niet
      ingezet dan na toestemming van Onze Minister.

      2 Onze Minister verleent de toestemming slechts indien naar zijn oordeel is voldaan aan de normen in
      [Richtlijn 2013/33/EU](32013L0033) van het Europees Parlement en de Raad van 26 juni 2013 tot vaststelling
      van normen voor de opvang van verzoekers om internationale bescherming (herschikking), deze regeling en de
      [Regeling eigen bijdrage asielzoekers met inkomen en vermogen 2008][ref1].

      3 Indien het college derden inzet bij de exploitatie van een opvangvoorziening is [artikel 22c][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024733
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel22c
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel22d
    references:
      - id: ref1
        bwb_id: BWBR0024733
      - id: ref2
        bwb_id: BWBR0017959
        artikel: 22c
        hoofdstuk: VI
  - number: '23'
    text: |-
      Indien er ten aanzien van een asielzoeker

      a. voor 1 januari 2000 op diens asielaanvraag in eerste aanleg in negatieve zin is beslist;

      b. een last tot uitzetting is gegeven; en

      c. door de korpschef van de politieregio waar de vreemdeling zijn woon- of verblijfsplaats heeft is meegedeeld dat
      hij Nederland moet verlaten,

      eindigen de verstrekkingen, in afwijking van [artikel 7, eerste lid, aanhef en onder b][ref1] van deze regeling, op
      de dag waarop de asielzoeker Nederland ingevolge de mededeling van de korpschef dient te verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel7
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '7'
        hoofdstuk: III
  - number: '24'
    text: |-
      [Artikel 7, eerste lid, aanhef en onder b][ref1] van deze regeling is, in afwijking van [artikel 23][ref2] van deze
      regeling, eveneens van toepassing op de vreemdeling ten aanzien van wie:

      a. op of na 1 januari 2000 een niet inwilligende beslissing op de asielaanvraag is genomen, of;

      b. op of na 29 december 2000 een negatieve beslissing op het ingediende bezwaar tegen de niet inwilligende
      beslissing op de asielaanvraag is genomen, of;

      c. op of na 1 januari 2000 de vergunning tot verblijf, daaronder begrepen de voorwaardelijke vergunning tot
      verblijf, is ingetrokken of niet is verlengd, of de toelating als vluchteling is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel23
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '23'
        hoofdstuk: VII
  - number: '25'
    text: |-
      De [Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 1997][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009205
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009205
  - number: '26'
    text: Deze regeling treedt in werking de tweede dag na dagtekening van de Staatscourant waarin zij wordt geplaatst
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel26
  - number: '27'
    text: |-
      Deze regeling kan wordt aangehaald als de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen
      2005.
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel27
