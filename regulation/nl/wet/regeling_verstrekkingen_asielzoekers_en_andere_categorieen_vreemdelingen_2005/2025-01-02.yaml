  - number: '20'
    text: |-
      1 De asielzoeker is verplicht onverwijld uit eigen beweging, of op verzoek van het COA, mededeling te doen van
      alle feiten of omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het
      recht op verstrekkingen, het geldend maken van het recht op verstrekkingen, de duur van verstrekkingen of de hoogte
      van de toelagen die aan hem worden betaald. Indien deze feiten of omstandigheden betrekking hebben op een kind
      dan wordt de mededeling gedaan door de asielzoeker te wiens laste het kind komt en in het geval dit meer dan één
      asielzoeker betreft, door één van die asielzoekers.

      2 Indien een asielzoeker of vergunninghouder die verblijft in een opvangvoorziening, daaronder begrepen de
      handhavings- en toezichtlocatie, dan wel de vergunninghouder bedoeld in [artikel 3, derde lid, onderdeel c][ref1],
      beschikt over een vermogen groter dan de vermogensgrens, bedoeld in [artikel 34 van de Participatiewet][ref2] of
      inkomsten heeft, anders dan kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref3] of deze regeling, is
      die asielzoeker of vergunninghouder aan het COA een vergoeding verschuldigd in de kosten van zijn opvang alsmede
      van de opvang van zijn gezinsleden. De tegemoetkoming bedraagt per maand ten hoogste de economische waarde van
      de aan een asielzoeker of vergunninghouder feitelijk geboden verstrekkingen, met dien verstande dat de vergoeding
      niet meer bedraagt dan het bedrag van het in de eerste volzin bedoelde vermogen of de in de eerste volzin bedoelde
      inkomsten.

      3 Indien na zijn verblijf in een opvangvoorziening of de handhavings- en toezichtlocatie blijkt dat een vreemdeling
      tijdens dit verblijf beschikte over een vermogen of inkomsten, bedoeld in het tweede lid, kan het COA de kosten van
      de opvang van deze vreemdeling alsmede de kosten van opvang van zijn gezinsleden van hem terugvorderen. De terug
      te vorderen kosten per maand zijn niet hoger dan de economische waarde van de aan de vreemdeling feitelijk geboden
      verstrekkingen, vermeerderd met de economische waarde van de aan ieder gezinslid feitelijk geboden verstrekkingen,
      met dien verstande dat het terug te vorderen bedrag niet meer bedraagt dan het bedrag van het in het tweede lid
      bedoelde vermogen of de in het tweede lid bedoelde inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002368
