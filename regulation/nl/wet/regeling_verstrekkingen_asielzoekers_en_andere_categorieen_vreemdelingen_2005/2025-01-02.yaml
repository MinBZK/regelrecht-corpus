  - number: 22a
    text: |-
      Indien het COA met het college is overeengekomen dat het college verantwoordelijk is voor de exploitatie
      van een opvangvoorziening en het COA de asielzoeker heeft geplaatst in of overgeplaatst naar een door
      het college geëxploiteerde opvangvoorziening zijn van toepassing of van overeenkomstige toepassing de
      [artikelen 1][ref1], [3, eerste lid, tweede lid, onder a, derde en vierde lid][ref2], [4, eerste lid][ref3],
      met dien verstande dat uitsluitend het COA bepaalde categorieën kan uitsluiten van opvang, tweede lid en derde
      lid, onder a, [5][ref4], [7][ref5], [9, eerste, derde en vierde lid, achtste tot en met elfde lid][ref6],
