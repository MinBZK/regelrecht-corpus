  - number: '10'
    text: |-
      1 Het COA kan de in [artikel 9, eerste lid][ref1], bedoelde verstrekkingen beperken of, in uitzonderlijke gevallen
      intrekken indien de asielzoeker:

      a. de door het COA vastgestelde opvangvoorziening heeft verlaten zonder het COA op de hoogte stellen of, indien
      toestemming vereist is, zonder toestemming;

      b. gedurende twee weken niet heeft voldaan aan de verplichting, bedoeld in [artikel 19, eerste lid, onder e][ref2],
      dan wel gedurende twee opeenvolgende keren niet heeft voldaan aan de verplichting bedoeld in artikel 19, derde lid;

      c. gedurende twee weken niet heeft voldaan aan verzoeken van het COA om informatie te verstrekken, met inbegrip
      van gegevens die nodig zijn voor het realiseren van de opvang, waaronder in elk geval zijn naam geboortedatum,
      nationaliteit, land van herkomst, gezinssamenstelling, vermogenspositie en de datum waarop door of ten behoeve van
      hem een asielaanvraag is ingediend;

      d. twee opeenvolgende malen niet is verschenen voor een gehoor betreffende de asielprocedure;

      e. een opvolgende asielaanvraag, als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref3], heeft ingediend
      nadat een definitieve beslissing, met inbegrip van een expliciete of impliciete intrekking, over een vorige
      asielaanvraag is genomen;

      f. financiële middelen verborgen heeft gehouden en daardoor ten onrechte van de opvangvoorzieningen gebruik heeft
      gemaakt;

      g. een hem overeenkomstig het bepaalde in [artikel 20, tweede lid][ref4], in rekening gebrachte tegemoetkoming in
      de kosten van opvang niet betaalt;

      h. ernstig inbreuk maakt op de verplichtingen, bedoeld in [artikel 19, eerste lid][ref5];

      i. een ernstige vorm van geweld pleegt jegens asielzoekers die in een opvangvoorziening verblijven, aan personen
      die werkzaam zijn in de voorziening of aan anderen.

      2 Het COA kan de in [artikel 9, eerste lid][ref6], bedoelde verstrekkingen beperken indien het kan aantonen dat
      de asielzoeker zonder gerechtvaardigde reden na zijn binnenkomst in Nederland niet zo spoedig als redelijkerwijze
      mogelijk is een asielaanvraag heeft ingediend.

      3 In de gevallen, bedoeld in het eerste lid, onder a tot en met d, wordt, wanneer de asielzoeker zich bij het
      COA meldt, een gemotiveerde, op de redenen voor de verdwijning gebaseerde beslissing genomen inzake het opnieuw
      verstrekken van sommige of alle beperkte of ingetrokken verstrekkingen, bedoeld in [artikel 9, eerste lid][ref7],
      mits de asielzoeker recht heeft op opvang als bedoeld in [artikel 3][ref8].

      4 Het eerste lid, onder b, is niet van toepassing op de asielzoeker wiens asielaanvraag in het Aanmeldcentrum wordt
      behandeld dan wel de vreemdeling die in de rust- en voorbereidingstermijn voor verstrekkingen in aanmerking komt.

      5 De beslissing, bedoeld in het eerste en tweede lid, wordt gemotiveerd en genomen op grond van de specifieke
      situatie van de asielzoeker.

      6 De verstrekkingen bedoeld in [artikel 9, eerste lid][ref9], worden niet beperkt of ingetrokken voordat de
      beslissing, bedoeld in het eerste en tweede lid is genomen.


