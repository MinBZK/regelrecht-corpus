  - number: '4'
    text: |-
      1 In naar behoren gemotiveerde gevallen kan de Minister andere regels inzake materiële opvangvoorzieningen
      vaststellen en aan het COA de bevoegdheid verlenen om bepaalde categorieën asielzoekers uit te sluiten van opvang
      indien:

      a. de gewoonlijk beschikbare huisvestingscapaciteit tijdelijk uitgeput is;

      b. een beoordeling van de specifieke situatie en bijzondere opvangbehoeften van een kwetsbare asielzoeker vereist
      is.

      2 Aan een asielzoeker op wie het eerste lid is toegepast, worden vervangende verstrekkingen verleend, die in elk
      geval de basisbehoeften dekken.

      3 Er bestaat geen recht op opvang:

      a. indien de asielzoeker niet binnen 24 uur na doorverwijzing door het COA naar de opvang in de opvangvoorziening
      arriveert;

      b. indien de asielzoeker een onderdaan is van een lidstaat van de Europese Unie, de Europese Economische Ruimte
      of Zwitserland;

      c. indien de asielzoeker tot ongewenst vreemdeling als bedoeld in [artikel 67 van de Vreemdelingenwet 2000][ref1]
      is verklaard, of tegen de asielzoeker een inreisverbod als bedoeld in [artikel 66a van die wet][ref2] is
      uitgevaardigd en hij geen rechtmatig verblijf heeft;

      d. door het enkele beroep van de asielzoeker op [artikel 64 van de Vreemdelingenwet 2000][ref3] of op de daarmee
      gelijkgestelde feitelijk situatie, bedoeld in [artikel 3, derde lid, aanhef en onder h][ref4].


