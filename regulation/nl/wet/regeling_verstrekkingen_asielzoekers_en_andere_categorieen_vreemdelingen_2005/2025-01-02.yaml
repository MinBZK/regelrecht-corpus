  - number: '3'
    text: |-
      1 Het COA draagt zorg voor de centrale opvang van asielzoekers door erin te voorzien dat hen opvang wordt geboden
      in een opvangvoorziening.

      2 Tot de in het eerste lid bedoelde categorieën asielzoekers aan wie opvang wordt geboden behoren:

      a. de asielzoeker als bedoeld in [artikel 1, aanhef en onder d][ref1] van deze regeling;

      b. de asielzoeker als bedoeld in [artikel 1, aanhef en onder e][ref2] van deze regeling.

      3 Met de in het vorige lid bedoelde categorieën asielzoekers worden gelijkgesteld:

      a. de vreemdeling wiens asielaanvraag binnen de procedure op het Aanmeldcentrum is afgewezen en ten aanzien van wie
      een daartoe strekkend en tijdig ingediend verzoek tot het treffen van een voorlopige voorziening om de behandeling
      van het beroeps- en hoger beroepsschrift in Nederland te mogen afwachten, is toegewezen;

      b. een alleenstaande minderjarige vreemdeling wiens asielaanvraag binnen de procedure op het Aanmeldcentrum is
      afgewezen;

      c. de vreemdeling aan wie de verblijfsvergunning, bedoeld in [artikel 14][ref3] of
      [28 van de Vreemdelingenwet 2000][ref4], is verleend en die, met inachtneming van [artikel 12][ref5], reeds in de
      centrale opvang verblijft, dan wel verblijft in de handhavings- en toezichtlocatie in afwachting van het betrekken
      van woonruimte in een gemeente;

      d. de vreemdeling die een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref6] heeft ingediend onder een beperking verband houdend met verblijf
      als familie- of gezinslid indien sprake is van gezinshereniging met een asielzoeker aan wie met toepassing van deze
      regeling opvang wordt geboden;

      e. de vreemdeling die niet in een opvangvoorziening verblijft als bedoeld in
      [artikel 1 van de Wet Centraal Orgaan opvang asielzoekers][ref7], en die in het bezit wordt gesteld van
      een verblijfsvergunning asiel bepaalde tijd, of in het bezit wordt gesteld van een asielgerelateerde
      verblijfsvergunning, vanaf het moment van vergunningverlening tot het moment waarop passende huisvesting buiten de
      opvangvoorziening kan worden gerealiseerd, tenzij de vreemdeling reeds van overheidswege in een opvangvoorziening
      is gehuisvest;

      f. de vreemdeling wiens uitzetting op grond van [artikel 64 van de Vreemdelingenwet 2000][ref8] achterwege
      blijft, met uitzondering van de vreemdeling die in afwachting is van de definitieve beslissing op zijn verzoek om
      toepassing van [artikel 64 van de Vreemdelingenwet 2000][ref9] en die niet een uitgeprocedeerde asielzoeker is en
      die evenmin een vreemdeling is die in afwachting is van de uitspraak in hoger beroep in zijn asielprocedure;

      g. de vreemdeling aan wie in verband met het onderzoek naar de feitelijke toegankelijkheid
      van de noodzakelijke zorg in zijn land van herkomst voorlopig uitstel van vertrek op grond van
      [artikel 64 van de Vreemdelingenwet 2000][ref10] is verleend in afwachting van de definitieve beslissing op zijn
      verzoek om toepassing van [artikel 64 van de Vreemdelingenwet 2000][ref11];

      h. de vreemdeling die rechtmatig in Nederland verblijft, als bedoeld in
      [artikel 8, aanhef en onder f of h van de Vreemdelingenwet 2000][ref12], en zich, naar het oordeel van Onze
      Minister, feitelijk in dezelfde situatie bevindt als bedoeld in [artikel 64 van de Vreemdelingenwet 2000][ref13];

      i. de vreemdeling op wie een besluit als bedoeld in [artikel 45, vierde lid, van de Vreemdelingenwet 2000][ref14]
      van toepassing is;

      j. de vreemdeling op wie een besluit als bedoeld in [artikel 45, zesde lid, van de Vreemdelingenwet 2000][ref15]
      van toepassing is;

      k. de vreemdeling aan wie binnen de procedure op het Aanmeldcentrum een verblijfsvergunning als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref16] wordt verstrekt;

      l. de uitgenodigde vluchteling, ook en indien reeds binnen de procedure op het Aanmeldcentrum een
      verblijfsvergunning is verleend;

      m. de vreemdeling wiens asielaanvraag is afgewezen en die rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder h, van de Vreemdelingenwet 2000][ref17] op grond van een door de president van het Europees Hof
      voor de Rechten van de Mens getroffen voorlopige maatregel (‘interim measure’) waarin is bepaald dat de vreemdeling
      vooralsnog niet mag worden uitgezet;

      n. de uitgeprocedeerde asielzoeker of de vreemdeling die in afwachting is van de uitspraak in hoger beroep in zijn
      asielprocedure met rechtmatig verblijf als bedoeld in artikel 8, aanhef en onder f, van de Vreemdelingenwet 2000,
      die voorafgaand aan de indiening van een aanvraag om een verblijfsvergunning als bedoeld in artikel 14 van de
      Vreemdelingenwet 2000 onder de beperking ‘medische behandeling’ zijn complete en actuele medische gegevens heeft
      overgelegd;

      o. de uitgeprocedeerde asielzoeker aan wie een verblijfsvergunning als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref18] onder de beperking ‘verblijf voor het ondergaan van medische
      behandeling’ of ‘verblijf vanwege medische noodsituatie’ is verleend op basis van voorafgaand aan de aanvraag
      overgelegde complete en actuele medische gegevens;

      p. de uitgeprocedeerde asielzoeker of de vreemdeling die in afwachting is van de
      uitspraak in hoger beroep in zijn asielprocedure met rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder h, van de Vreemdelingenwet 2000][ref19], die voorafgaand aan de aanvraag om verblijf
      op medische gronden zijn complete en actuele medische gegevens heeft overgelegd;

      q. de vreemdeling die rechtmatig verblijf heeft op grond van
      [artikel 8, onder m, van de Vreemdelingenwet 2000][ref20];

      r. de vreemdeling die in het bezit is gesteld van een machtiging tot voorlopig verblijf als bedoeld
      in [artikel 1a, onder b, van de Vreemdelingenwet 2000][ref21] en voldoet aan de voorwaarden van
      [artikel 29, tweede lid, van die wet][ref22];

      s. de vreemdeling aan wie op grond van de Afsluitingsregeling Definitieve Regeling langdurig verblijvende kinderen
      een verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref23] is verleend.

      4 Het COA draagt zorg voor de centrale opvang van andere categorieën vreemdelingen, als bedoeld in
      [artikel 3, tweede, lid, van de Wet Centraal Orgaan opvang asielzoekers][ref24], na een verzoek hiertoe van Onze
      Minister.


