  - number: '14'
    text: |-
      1 De door de asielzoeker te ontvangen wekelijkse financiële toelage, bedoeld in
      [artikel 9, eerste lid, aanhef en onder b][ref1], van deze regeling, bestaat uit een bedrag ten behoeve van voedsel
      en een bedrag ten behoeve van kleding en andere persoonlijke uitgaven.

      2 De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners volledig zelf het eigen eten verzorgen, wordt berekend aan de hand van de volgende bedragen per persoon,
      per week:

      a. bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 56,00, kind tot
      18 jaar: € 46,34;

      b. bij een driepersoonshuishouden: volwassene: € 44,80, kind tot 18 jaar: € 37,10;

      c. bij een huishouden van vier of meer personen: volwassene: € 39,20, kind tot 18 jaar: € 32,41.

      3 De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      bewoners het ontbijt en een tweede maaltijd zelf verzorgen en niet de hoofdmaaltijd, wordt berekend aan de hand van
      het volgende bedrag per persoon, per week:

      a. bij een één- of tweepersoonshuishouden: volwassene en alleenstaande minderjarige vreemdeling: € 37,80, kind tot
      18 jaar: € 32,06;

      b. bij een driepersoonshuishouden: volwassene: € 30,24, kind tot 18 jaar: € 25,62;

      c. bij een huishouden van vier of meer personen: volwassene: € 26,46, kind tot 18 jaar: € 22,47.

      4 De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het eerste lid, is: € 14,47 per
      persoon, per week.

      5 De financiële toelage wordt iedere week op door het COA vastgestelde tijdstippen en plaats aan de asielzoeker
      beschikbaar gesteld.

      6 Geen financiële toelage wordt verstrekt aan een kind drie maanden nadat het recht op een uitkering op grond van
      de [Algemene Kinderbijslagwet][ref2] is ontstaan.

      7 De financiële toelage voor een asielzoeker jonger dan 18 jaar, die een kind is van, of verzorgd wordt door
      een of meer in de desbetreffende opvangvoorziening verblijvende asielzoekers wordt uitbetaald aan één van die
      asielzoekers.

      8 Het COA draagt zorg voor de maaltijden in centra waarin de bewoners niet in de gelegenheid zijn deze zelf te
      verzorgen.

      9 In afwijking van het eerste lid wordt geen financiële toelage verstrekt aan de asielzoeker wiens asielaanvraag
      in het Aanmeldcentrum wordt behandeld, aan de vreemdeling die in zijn rust- en voorbereidingstermijn voor
      verstrekkingen in aanmerking komt, aan de vreemdeling die in de handhavings- en toezichtlocatie verblijft,
      dan wel aan de asielzoeker, uitgezonderd alleenstaande minderjarige vreemdelingen, die afkomstig is
      uit een veilig land van herkomst of die reeds bescherming geniet in een andere lidstaat van de Europese
      Unie en van wie de eerste of opvolgende asielaanvraag niet-ontvankelijk is verklaard op grond van
      [artikel 30a, eerste lid, onder a of d, van de Vreemdelingenwet 2000][ref3], of kennelijk ongegrond is verklaard
      op grond van [artikel 30b, eerste lid, onder b, van de Vreemdelingenwet 2000][ref4], ongeacht de procedure waarin
      daartoe is besloten.

      10 In afwijking van het negende lid wordt aan de asielzoeker wiens aanvraag in het Aanmeldcentrum wordt behandeld
      dan wel de vreemdeling die in zijn rust- en voorbereidingstermijn voor strekkingen in aanmerking komt verstrekt:

      a. de wekelijkse financiële toelage ten behoeve van voedsel, indien hij in een opvangvoorziening verblijft waar
      voorzieningen aanwezig om zelf het eigen eten te verzorgen als bedoeld in artikel 14, tweede en derde lid;

      b. de wekelijkse financiële toelage ten behoeve van kleding en andere persoonlijke uitgaven als bedoeld in artikel
      14, vierde lid, indien de genoemde vreemdeling in de procesopvanglocatie verblijft en de beoogde verblijfsduur in
      die opvangvoorziening substantieel wordt overschreden.


