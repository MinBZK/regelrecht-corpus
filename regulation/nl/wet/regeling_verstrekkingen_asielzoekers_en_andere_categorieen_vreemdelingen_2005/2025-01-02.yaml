        bwb_id: BWBR0017959
        artikel: '9'
        hoofdstuk: IV
  - number: 18b
    text: |-
      1 Bij de uitoefening van de bevoegdheid, bedoeld in
      [artikel 3a, van de Wet Centraal Orgaan opvang asielzoekers][ref1], zorgt het COA ervoor dat:

      a. minderjarige kinderen van asielzoekers of minderjarige asielzoekers worden gehuisvest bij hun ouders, bij hun
      ongehuwde broers of zussen of bij de volwassene die krachtens het recht of de praktijk van Nederland voor hen
      verantwoordelijk is, mits het in het belang van de betrokken minderjarige is;

      b. afhankelijke volwassen asielzoekers met bijzondere opvangbehoeften in de regel worden ondergebracht bij
      volwassen nauwe verwanten die zich reeds in Nederland bevinden en die volgens het recht of de praktijk voor hen
      verantwoordelijk zijn;

      c. alleenstaande minderjarige vreemdelingen worden ondergebracht:

      1°. bij volwassen bloedverwanten;

      2°. in een pleeggezin;

      3°. in speciale opvangvoorzieningen voor minderjarigen; of

      4°. in andere huisvesting die geschikt is voor minderjarigen.

      2 In afwijking van het eerste lid, onder c, mogen alleenstaande minderjarigen die ten minste 16 jaar oud zijn in
      opvangvoorzieningen voor meerderjarige asielzoekers worden ondergebracht, indien dit in hun belang is.

      3 Voor zover mogelijk worden broers en zussen bij elkaar gehuisvest, rekening houdend met het belang van de
      betrokken minderjarige en in het bijzonder met zijn leeftijd en maturiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: 3a
  - number: 18c
    text: |-
      1 Het COA zorgt er tijdens het verblijf in de opvangvoorziening voor dat:

      a. minderjarigen kunnen deelnemen aan vrijetijdsactiviteiten, met inbegrip van spel- en recreatieve activiteiten
      die passen bij hun leeftijd en aan activiteiten in de open lucht;

      b. minderjarigen die het slachtoffer zijn geweest van enige vorm van mishandeling, verwaarlozing, uitbuiting,
      foltering of wrede, onmenselijke of vernederende behandeling of die hebben geleden onder gewapende conflicten,
      toegang hebben tot de rehabilitatiediensten en waar nodig gekwalificeerde begeleiding wordt verstrekt;

      c. personen die foltering, verkrachting of andere ernstige vormen van geweld hebben ondergaan, voor hun daardoor
      veroorzaakte letsel de vereiste behandeling ontvangen, met name door hen toegang te geven tot passende medische en
      psychische behandeling en verzorging.

      2 Onze Minister kan een uitzondering maken op het eerste lid, onder a, indien de materiële opvang wordt verstrekt
      in particuliere huizen, appartementen, hotels of andere voor de huisvesting van verzoekers aangepaste ruimten.
    url: https://wetten.overheid.nl/BWBR0017959/2025-01-02#Artikel18c
  - number: '19'
    text: |-
      1 Behoudens de uitzondering genoemd in lid 2 is de asielzoeker die onderdak heeft in een opvangvoorziening
      verplicht:

      a. de huisregels na te leven die zijn neergelegd in het reglement van de desbetreffende opvangvoorziening;

      b. gevolg te geven aan de aanwijzingen van het personeel van de desbetreffende opvangvoorziening;

      c. schoonmaakwerkzaamheden te verrichten in en rond de woonruimte;

      d. toegang te verlenen aan het personeel van de opvangvoorziening tot zijn woonruimte indien er een
      redelijk vermoeden bestaat dat de asielzoeker de huisregels overtreedt of indien dit voor het beheer van de
      opvangvoorziening redelijkerwijs noodzakelijk is;

      e. te voldoen aan de COA inhuisregistratie door zich wekelijks te melden bij het COA teneinde te kunnen vaststellen
      of hij nog in de opvangvoorziening verblijft en aanspraak maakt op opvangvoorzieningen;

      f. deel te nemen aan programma’s gericht op het voorlichten over en het stimuleren en bewustmaken van terugkeer;

      g. deel te nemen aan de programma’s in de handhavings- en toezichtlocatie.

      2 Het eerste lid, onder e, is niet van toepassing op de asielzoeker wiens asielaanvraag in het Aanmeldcentrum wordt
      behandeld dan wel de vreemdeling die in zijn rust- en voorbereidingstermijn voor verstrekkingen in aanmerking komt.

      3 In afwijking van het eerste lid, onder e, dient de asielzoeker te voldoen aan de COA inhuisregistratie door zich
      dagelijks te melden bij het COA indien de asielzoeker:

      a. is overgeplaatst naar de handhavings- en toezichtlocatie;

      b. afkomstig is uit een veilig land van herkomst en 16 jaar of ouder is, uitgezonderd alleenstaande minderjarige
      vreemdelingen;

      c. onder de werking van de Dublinverordening als bedoeld in [artikel 1 van de Vreemdelingenwet][ref1] valt,
      uitgezonderd alleenstaande minderjarige vreemdelingen:

      d. reeds bescherming geniet in een andere lidstaat van de Europese Unie en van wie de eerste
      of opvolgende asielaanvraag vermoedelijk niet-ontvankelijk zal worden dan wel is verklaard
      op grond van [artikel 30a, eerste lid, onder a of d, van de Vreemdelingenwet 2000][ref2],
      of vermoedelijk kennelijk ongegrond zal worden dan wel is verklaard op grond van
      [artikel 30b, eerste lid, onder b, van de Vreemdelingenwet 2000][ref3], ongeacht de procedure waarin daartoe zal
      of is besloten, uitgezonderd alleenstaande minderjarige vreemdelingen.

      4 In afwijking van het eerste lid, onder e, en het derde lid dient de asielzoeker wiens asielaanvraag
      versneld zal worden afgedaan en een daartoe strekkende aanwijzing van de IND heeft gekregen in de zin van
      [artikel 55, eerste lid, van de Vreemdelingenwet 2000][ref4] zich dagelijks tweemaal te melden bij het COA, ten
      einde vast te stellen dat de vreemdeling gebruik maakt van de faciliteiten van het COA en hij daarmee beschikbaar
      is voor de afhandeling van zijn asielprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel55
