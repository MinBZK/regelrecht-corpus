preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de huidige regelingen inzake het voorkomen en
    beperken van het ontstaan van afvalstoffen en het verwijderen van afvalstoffen, zoals die zijn opgenomen in de Wet
    milieubeheer, te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelAanhef
articles:
  - number: XIV.1
    text: |-
      Na de inwerkingtreding van deze wet berusten algemene maatregelen van bestuur en ministeriële regelingen,
      vastgesteld krachtens de [artikelen 1.1, vijfde, tiende, elfde, twaalfde en dertiende lid][ref1],
      [8.35, eerste en tweede lid][ref2], [10.4, eerste, derde en zevende lid][ref3], [10.5][ref4],
      [10.6, eerste en derde lid][ref5], [10.8][ref6], [10.9][ref7], [10.11, derde lid][ref8],
      [10.15, derde lid][ref9], [10.16][ref10], [10.16b][ref11], [10.16c, derde lid][ref12], [10.37][ref13],
      [10.44a, eerste en tweede lid][ref14], [10.44b][ref15], [10.45, eerste en tweede lid][ref16], en
      [15.32, eerste en tweede lid, van de Wet milieubeheer][ref17], zoals deze artikelen luidden onmiddellijk voor
      het tijdstip van inwerkingtreding van deze wet, op de artikelen 1.1, zesde, zevende, negende en tiende lid, 8.35,
      eerste lid, 8.36, 10.15, eerste en vijfde lid, 10.16, eerste en derde lid, 10.17, eerste lid, 10.18, 10.20, eerste
      lid, 10.26, vierde lid, 10.30, derde lid, 10.32, 10.34, 10.35, derde lid, 10.41, eerste en tweede lid, 10.42,
      eerste lid, 10.43, eerste lid, 10.44, derde lid, 10.47, eerste lid, 10.48, eerste lid, 10.56, tweede lid, 10.57,
      10.61, eerste lid, van deze wet.


