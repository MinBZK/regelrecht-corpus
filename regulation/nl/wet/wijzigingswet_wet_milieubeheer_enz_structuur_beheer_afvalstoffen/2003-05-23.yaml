  - number: XIV.2
    text: |-
      Een vergunning of ontheffing, voor het tijdstip van inwerkingtreding van deze wet verleend krachtens
      [hoofdstuk 8][ref1] of [10 van de Wet milieubeheer][ref2], wordt, voor zover zij betrekking heeft op gedragingen
      waarvoor na het in werking treden daarvan een vergunning of ontheffing krachtens die hoofdstukken vereist is,
      gelijk gesteld met een vergunning, onderscheidenlijk ontheffing, verleend krachtens de betrokken bepaling van dat
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: XIV.3
    text: |-
      Indien de aanvraag tot het geven van een beschikking is ingediend of het voornemen tot het geven van een
      beschikking krachtens wettelijk voorschrift aan degene tot wie de beschikking zal zijn gericht, is bekendgemaakt
      voor het tijdstip waarop deze wet met betrekking tot een zodanige beschikking in werking treedt, blijft het voor
      dat tijdstip ten aanzien van zodanige beschikkingen geldende recht van toepassing tot het tijdstip waarop de
      beschikking onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXIV
  - number: XV
    text: |-
      Een afvalbeheersplan dat voor de inwerkingtreding van deze wet is vastgesteld, wordt aangemerkt als een
      afvalbeheersplan in de zin van deze wet, indien de voorbereiding daarvan is geschied overeenkomstig de eisen die
      deze wet aan de voorbereiding van een afvalbeheersplan stelt.
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXV
  - number: XVI
    text: |-
      Indien voor het tijdstip waarop deze wet in werking treedt, een beschikking is gegeven, houdende een waarschuwing
      dat bestuursdwang zal worden toegepast, dan wel een last onder dwangsom is opgelegd wegens overtreding van het bij
      of krachtens hoofdstuk 10 bepaalde, blijft het voor dat tijdstip ten aanzien van een zodanige beschikking geldende
      recht van toepassing tot het tijdstip waarop die beschikking onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXVI
  - number: XVII.1
    text: |-
      In afwijking van [artikel 119 van de Provinciewet][ref1] blijven de bepalingen van verordeningen van
      provincies omtrent gedragingen waarvoor na het in werking treden van de onderscheidene bepalingen van de
      [Wet milieubeheer][ref2] bij of krachtens algemene maatregel van bestuur of ministeriële regeling regels worden
      of kunnen worden gesteld, van kracht totdat zodanige regels met betrekking tot het betrokken onderwerp in werking
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0003245
  - number: XVII.2
    text: |-
      Onverminderd het eerste lid blijven, in afwijking van [artikel 119 van de Provinciewet][ref1], de bepalingen van
      de verordeningen van provincies betreffende het onderwerp waarin deze wet voorziet – behoudens in gevallen waarin
      strijd met de bij of krachtens deze wet gestelde voorschriften zou ontstaan – van kracht tot twee jaar na het in
      werking treden van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel119
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '119'
  - number: XVII.3
    text: |-
      In afwijking van [artikel 122 van de Gemeentewet][ref1] blijven de bepalingen van verordeningen van gemeenten
      betreffende het onderwerp waarin deze wet voorziet – behoudens in de gevallen waarin strijd met de bij of krachtens
      deze wet gestelde voorschriften zou ontstaan – van kracht tot twee jaar na het in werking treden van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel122
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXVII
    references:
