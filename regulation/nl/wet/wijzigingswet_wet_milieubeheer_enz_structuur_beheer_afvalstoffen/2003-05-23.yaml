        artikel: '122'
  - number: XVIII
    text: |-
      De tekst van de [Wet milieubeheer][ref1] wordt door Onze Minister van Justitie in het Staatsblad geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: XIX
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012606/2003-05-23#ArtikelXIX
