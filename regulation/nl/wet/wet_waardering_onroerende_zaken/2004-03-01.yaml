---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_waardering_onroerende_zaken
regulatory_layer: WET
publication_date: '2000-12-27'
valid_from: '2004-03-01'
bwb_id: BWBR0007119
url: https://wetten.overheid.nl/BWBR0007119/2004-03-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot een uniforme
    bepaling van de waarde van onroerende zaken en de wijze van vaststelling daarvan ten behoeve van de heffing van
    belastingen, alsmede om het toezicht op de waardebepaling en waardevaststelling op te dragen aan een daartoe in te
    stellen Waarderingskamer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze wet geldt bij de bepaling en de vaststelling van de waarde van in Nederland gelegen onroerende zaken ten
      behoeve van de heffing van belastingen door het Rijk, de gemeenten en de waterschappen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel1
  - number: '1.2'
    text: |-
      Het college van burgemeester en wethouders is belast met de uitvoering van deze wet, tenzij de gemeenteambtenaar,
      bedoeld in [artikel 231, tweede lid, onderdeel ][ref1], hiermee is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
  - number: '1.3'
    text: |-
      Bij wet wordt geregeld in hoeverre de op de voet van de wet vastgestelde waarde van toepassing is voor de in het
      eerste lid bedoelde belastingen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel1
  - number: '2'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel2
  - number: 2.a
    text: 'de wet: de Wet waardering onroerende zaken;'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel2
  - number: 2.b
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel2
  - number: 2.c
    text: |-
      afnemers: overheden die gebruik maken van de ingevolge de wet vastgestelde waarden ten behoeve van de heffing van
      belastingen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel2
  - number: '3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de verrekening van de kosten die
      verbonden zijn aan de uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel3
  - number: '4.1'
    text: Er is een Waarderingskamer. De Waarderingskamer bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel4
  - number: '4.2'
    text: |-
      De Waarderingskamer houdt toezicht op de waardebepaling en de waardevaststelling van onroerende zaken en op de
      overige in de wet geregelde onderwerpen. De colleges van burgemeester en wethouders verschaffen de Waarderingskamer
      desgevraagd tijdig de voor de uitoefening van haar taak noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel4
  - number: '4.3'
    text: |-
      De Waarderingskamer dient desgevraagd of eigener beweging Onze Minister van advies over zaken die verband houden
      met de inhoud en de toepassing van hetgeen bij of krachtens de wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel4
  - number: '4.4'
    text: De Waarderingskamer geeft voorts uitvoering aan hetgeen haar overigens bij of krachtens de wet is opgedragen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel4
  - number: '5.1'
    text: De Waarderingskamer bestaat uit elf leden, waaronder de voorzitter, die worden benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '5.2'
    text: |-
      Van de andere leden dan de voorzitter worden vier leden op voordracht van de Vereniging van Nederlandse Gemeenten,
      twee leden uit de rijksbelastingdienst en twee leden op voordracht van de Unie van Waterschappen benoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '5.3'
    text: De Waarderingskamer wijst uit haar midden een plaatsvervangende voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '5.4'
    text: |-
      De leden van de Waarderingskamer worden benoemd voor ten hoogste vier jaren. Na afloop van deze termijn kunnen zij
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '5.5'
    text: |-
      Degene die tot lid is benoemd ter vervulling van een tussentijds opengevallen plaats, treedt af op het ogenblik
      waarop degene in wiens plaats hij is benoemd, had moeten aftreden. Hij kan worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '5.6'
    text: |-
      De leden kunnen te allen tijde op eigen verzoek door Onze Minister worden ontslagen. Onze Minister kan hen, gehoord
      de Waarderingskamer, schorsen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel5
  - number: '6.1'
    text: |-
      De Waarderingskamer heeft drie adviserende leden die worden benoemd door Onze Minister op voordracht
      van onderscheidenlijk Onze Minister, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het
      InterProvinciaal Overleg.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel6
  - number: '6.2'
    text: |-
      De adviserende leden kunnen te allen tijde op eigen verzoek door Onze Minister worden ontslagen. Onze Minister kan
      hen op verzoek van degene die de voordracht heeft gedaan, schorsen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel6
  - number: '7.1'
    text: |-
      De Waarderingskamer kan ter uitvoering van haar taak commissies instellen, waarin ook personen van buiten de
      Waarderingskamer zitting kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel7
  - number: '7.2'
    text: De Waarderingskamer en haar commissies kunnen zich doen bijstaan door deskundigen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel7
  - number: '8.1'
    text: |-
      De Waarderingskamer heeft een secretariaat onder leiding van een secretaris, die door Onze Minister, op voordracht
      van de Waarderingskamer, wordt benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel8
  - number: '8.2'
    text: Benoeming, schorsing en ontslag van het personeel van het secretariaat geschieden door de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel8
  - number: '8.3'
    text: Het secretariaat staat de Waarderingskamer in haar werkzaamheden bij.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel8
  - number: '8.4'
    text: De secretaris en het personeel van het secretariaat zijn niet tevens lid of adviserend lid van de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel8
  - number: '8.5'
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel8
  - number: '9.1'
    text: |-
      Het personeel van het secretariaat van de Waarderingskamer, de secretaris daaronder begrepen, is ambtenaar in de
      zin van de [Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '9.2'
    text: De Waarderingskamer stelt bij reglement de regeling van de rechtstoestand van het personeel vast.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de [Ambtenarenwet][ref1] is geregeld, geeft het reglement bedoeld in
      het tweede lid van dit artikel in ieder geval voorschriften betreffende de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 9.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.d
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.e
    text: bezoldiging;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.f
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.h
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.i
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.j
    text: bescherming bij arbeid;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.m
    text: overige rechten en verplichtingen van het personeel;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.n
    text: disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.o
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gepleegd
      over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van het
      secretariaat;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
  - number: 9.3.p
    text: |-
      een geschillenregeling met betrekking tot [de onder ][ref1] en [][ref2] genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel9
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '9'
        hoofdstuk: II
  - number: '9.4'
    text: |-
      [Artikel 126 van de Ambtenarenwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel126
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '126'
  - number: '10'
    text: |-
      De Waarderingskamer stelt regels vast met betrekking tot haar werkwijze, tot die van het secretariaat, alsmede
      tot die van haar commissies. Tevens stelt de Waarderingskamer regels op met betrekking tot de wijze waarop overleg
      wordt gevoerd met de colleges van burgemeester en wethouders en de afnemers of met hun vertegenwoordigers omtrent
      aangelegenheden ter zake waarvan naar haar oordeel overleg gewenst is, alsmede omtrent aangelegenheden ter zake
      waarvan de deelnemers aan het overleg de Waarderingskamer te kennen hebben gegeven overleg te willen voeren.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel10
  - number: '11.1'
    text: |-
      Geschillen met betrekking tot de uitvoering van de wet tussen afnemers en colleges van burgemeester en wethouders
      kunnen door de betrokken partijen worden voorgelegd aan de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel11
  - number: '11.2'
    text: |-
      Het verzoek tot het in behandeling nemen van een geschil wordt ingediend door de bij het geschil betrokken
      partijen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel11
  - number: '11.3'
    text: |-
      De Waarderingskamer beslist binnen dertien weken nadat het geschil is voorgelegd. De Waarderingskamer kan deze
      termijn, met redenen omkleed, eenmaal met dertien weken verlengen. Zij kan voorts de termijn verder verlengen met
      instemming van de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel11
  - number: '11.4'
    text: |-
      De Waarderingskamer is bevoegd de kosten die door haar zijn gemaakt in verband met het voorgelegde geschil in
      rekening te brengen aan de partijen. Zij kan beslissen dat de kosten die door partijen zijn gemaakt, worden
      gedragen door de in het ongelijk gestelde partij.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel11
  - number: '12'
    text: De Waarderingskamer stelt jaarlijks voor 1 december een begroting vast voor het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel12
  - number: '13'
    text: |-
      De Waarderingskamer brengt uiterlijk op 1 mei aan Onze Minister verslag uit over haar werkzaamheden en haar
      financieel beleid in het voorafgaande kalenderjaar, voorzien van een verklaring omtrent de getrouwheid daarvan
      van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Het
      financieel beleid en beheer behoeven de goedkeuring van Onze Minister. Het verslag wordt door de zorg van Onze
      Minister openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '14'
    text: Onze Minister kan de Waarderingskamer algemene aanwijzingen geven met betrekking tot de uitoefening van haar taak.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan, de Waarderingskamer gehoord, aan het college van burgemeester en wethouders van een gemeente een
      aanwijzing geven omtrent de uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel15
  - number: '15.2'
    text: Onze Minister verbindt aan de aanwijzing een termijn.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel15
  - number: '15.3'
    text: |-
      De Waarderingskamer is bevoegd tot het doen uitvoeren van de aanwijzing op kosten van de gemeente indien het
      college van burgemeester en wethouders de aanwijzing niet binnen de in het tweede lid bedoelde termijn heeft
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel15
  - number: '16'
    text: 'Voor de toepassing van de wet wordt als één onroerende zaak aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
  - number: 16.a
    text: een gebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
  - number: 16.b
    text: een ongebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
  - number: 16.c
    text: |-
      een gedeelte van een in [onderdeel ][ref1] of [onderdeel ][ref2] bedoeld eigendom dat blijkens zijn indeling is
      bestemd om als een afzonderlijk geheel te worden gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
  - number: 16.d
    text: |-
      een samenstel van twee of meer van de in [onderdeel ][ref1] of [onderdeel ][ref2] bedoelde eigendommen of in
      [onderdeel ][ref3] bedoelde gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de
      omstandigheden beoordeeld, bij elkaar behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
  - number: 16.e
    text: |-
      het binnen de gemeente gelegen deel van een in [onderdeel ][ref1] of [onderdeel ][ref2] bedoeld eigendom, van een
      in [onderdeel ][ref3] bedoeld gedeelte daarvan of van een in [onderdeel ][ref4] bedoeld samenstel.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
  - number: '17.1'
    text: Aan een onroerende zaak wordt een waarde toegekend.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
  - number: '17.2'
    text: |-
      De waarde wordt bepaald op de waarde die aan de onroerende zaak dient te worden toegekend, indien de volle en
      onbezwaarde eigendom daarvan zou kunnen worden overgedragen en de verkrijger de zaak in de staat waarin die zich
      bevindt, onmiddellijk en in volle omvang in gebruik zou kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
  - number: '17.3'
    text: |-
      In afwijking in zoverre van het tweede lid wordt de waarde van een onroerende zaak, voor zover die niet
      tot woning dient, en met uitzondering van onroerende zaken die zijn ingeschreven in een van de ingevolge de
      [Monumentenwet 1988][ref1] vastgestelde registers van beschermde monumenten, bepaald op de vervangingswaarde indien
      dit leidt tot een hogere waarde dan die ingevolge het tweede lid. Bij de berekening van de vervangingswaarde wordt
      rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 17.3.a
    text: de aard en de bestemming van de zaak;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
  - number: 17.3.b
    text: |-
      de sedert de stichting van de zaak opgetreden technische en functionele veroudering, waarbij de invloed van latere
      wijzigingen in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
  - number: '17.4'
    text: |-
      In afwijking in zoverre van het tweede lid wordt de waarde van een gebouwd eigendom dat tot woning dient en deel
      uitmaakt van een op de voet van de [Natuurschoonwet 1928][ref1] aangewezen landgoed dat voldoet aan de in artikel
      1, derde lid, onderdeel *b*, van die wet bedoelde voorwaarden bepaald met inachtneming van een vooronderstelde
      verplichting om het gedurende een tijdvak van 25 jaren als zodanig in stand te houden en geen opgaand hout te
      vellen anders dan volgens de regels van normaal bosbeheer noodzakelijk of gebruikelijk is. Gebouwde eigendommen die
      dienstbaar zijn aan de woning worden geacht deel uit te maken van die woning.


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: '17.5'
    text: |-
      Met betrekking tot een onroerende zaak als bedoeld in [artikel 16, aanhef en onderdeel ][ref1], wordt de waarde
      gesteld op een evenredig deel van de waarde die dient te worden toegekend aan de gehele onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
  - number: '18.1'
    text: |-
      De waarde van een onroerende zaak wordt bepaald naar de waarde die de zaak op de waardepeildatum heeft naar de
      staat waarin de zaak op die datum verkeert.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel18
  - number: '18.2'
    text: De waardepeildatum ligt twee jaren voor het begin van het tijdvak waarvoor de waarde wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel18
  - number: '18.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke bij de waardebepaling buiten aanmerking
      wordt gelaten de waarde van onroerende zaken of onderdelen daarvan, indien die waarde geen onderdeel uitmaakt van
      de grondslag van de door de afnemers geheven belastingen als bedoeld in [artikel 1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '19.1'
    text: |-
      Indien een onroerende zaak in de twee jaren voorafgaande aan het begin van het tijdvak waarvoor de waarde wordt
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.1.a
    text: opgaat in een andere onroerende zaak dan wel in meer onroerende zaken, of
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.1.b
    text: |-
      wijzigt als gevolg van hetzij bouw, verbouwing, verbetering, afbraak of vernietiging, hetzij verandering van
      bestemming, of
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.1.c
    text: |-
      een verandering in waarde ondergaat als gevolg van een andere, specifiek voor de onroerende zaak geldende,
      bijzondere omstandigheid, wordt, in afwijking in zoverre van [artikel 18, eerste lid][ref1], de waarde bepaald naar
      de staat van die zaak bij het begin van dat tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel18
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '18'
        hoofdstuk: III
  - number: '19.2'
    text: 'Indien een onroerende zaak in het tijdvak waarvoor de waarde is vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.2.a
    text: opgaat in een andere onroerende zaak dan wel in meer onroerende zaken, of
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.2.b
    text: |-
      wijzigt als gevolg van hetzij bouw, verbouwing, verbetering, afbraak of vernietiging, hetzij verandering van
      bestemming, welke wijziging een verandering in de waarde van ten minste 5 percent met een minimum van € 11 345 ten
      gevolge heeft dan wel van € 113 445 of meer, of
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.2.c
    text: |-
      een verandering in waarde ondergaat van ten minste 5 percent met een minimum van € 11 345 dan wel van € 113 445 of
      meer als gevolg van een andere, specifiek voor de onroerende zaak geldende, bijzondere omstandigheid,
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: '19.3'
    text: |-
      Toepassing van het tweede lid als gevolg van de in onderdeel *a* van dat lid bedoelde feiten blijft achterwege
      voor zover de als gevolg van die feiten ontstane nieuwe onroerende zaak feitelijk in vrijwel ongewijzigde vorm de
      voortzetting vormt van een in die zaak opgegane onroerende zaak doordat aan laatstbedoelde zaak:
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.3.a
    text: |-
      een andere onroerende zaak dan wel een onderdeel van een andere onroerende zaak wordt toegevoegd, met als gevolg
      dat de waarde van de nieuwe onroerende zaak niet meer dan 5 percent dan wel niet meer dan € 113 445 meer bedraagt
      dan de waarde van de tot dusverre bestaande onroerende zaak waarvan de nieuwe onroerende zaak feitelijk vrijwel
      ongewijzigd de voortzetting vormt;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: 19.3.b
    text: |-
      een onderdeel wordt onttrokken, met als gevolg dat de waarde van de nieuwe onroerende zaak niet meer dan 5 percent
      dan wel niet meer dan € 113 445 minder bedraagt dan de waarde van de in die zaak opgegane onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel19
  - number: '20.1'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde ambtenaar van de gemeente waarin de onroerende zaak is gelegen,
      bepaalt de waarde van die onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '20.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de onderbouwing en de uitvoering van
      de waardebepaling.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel20
  - number: '20.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens het tweede lid wordt niet gedaan dan nadat het
      ontwerp aan de beide Kamers der Staten-Generaal is overgelegd en aan de Kamers de gelegenheid is geboden om binnen
      zes weken na de dag waarop het ontwerp is overgelegd, hun oordeel aan Onze Minister kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel20
  - number: '21'
    text: |-
      De Waarderingskamer kan het college van burgemeester en wethouders een aanbeveling doen omtrent de uitvoering van
      de wet. Zij gaat daartoe niet over dan na het college in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel21
  - number: '22.1'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde ambtenaar van de gemeente waarin de onroerende zaak is gelegen, stelt
      de waarde van de onroerende zaak vast bij een voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '22.2'
    text: De bij de beschikking vastgestelde waarde geldt voor een tijdvak van vier achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel22
  - number: '22.3'
    text: De waarde wordt voor het eerst vastgesteld voor het tijdvak dat aanvangt op 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel22
  - number: '23.1'
    text: 'De beschikking bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: 23.1.a
    text: de naam, het adres en de woon- of vestigingsplaats van degene te wiens aanzien de beschikking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: 23.1.b
    text: een aanduiding van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: 23.1.c
    text: de aan de onroerende zaak toegekende waarde;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: 23.1.d
    text: de waardepeildatum;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: 23.1.e
    text: het tijdvak waarvoor de beschikking geldt.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: '23.2'
    text: Het niet naleven van de voorschriften van het eerste lid brengt geen nietigheid van de beschikking mee.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel23
  - number: '24.1'
    text: De beschikking wordt genomen binnen acht weken na het begin van het tijdvak waarvoor zij geldt.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.2'
    text: Het niet naleven van het voorschrift van het eerste lid brengt geen nietigheid van de beschikking mee.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.3'
    text: 'De bekendmaking van de beschikking geschiedt terstond door toezending aan:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: 24.3.a
    text: |-
      degene die aan het begin van het tijdvak het genot heeft van de onroerende zaak krachtens eigendom, bezit of
      beperkt recht;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: 24.3.b
    text: |-
      degene die aan het begin van het tijdvak de onroerende zaak al dan niet krachtens eigendom, bezit, beperkt recht of
      persoonlijk recht gebruikt.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.4'
    text: |-
      Voor de toepassing van het derde lid, onderdeel *a*, kan, indien er met betrekking tot een zelfde onroerende
      zaak meer dan één genothebbende krachtens eigendom, bezit of beperkt recht kan worden aangewezen, bekendmaking
      plaatsvinden aan één van hen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.5'
    text: 'Voor de toepassing van het derde lid, onderdeel *b*, wordt:'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: 24.5.a
    text: |-
      gebruik door de leden van een huishouden aangemerkt als gebruik door een door de in [artikel 1, tweede lid][ref1],
      bedoelde gemeenteambtenaar aan te wijzen lid van dat huishouden;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: 24.5.b
    text: |-
      gebruik door degene aan wie een deel van een onroerende zaak in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: 24.5.c
    text: |-
      het ter beschikking stellen van een onroerende zaak voor volgtijdig gebruik aangemerkt als gebruik door degene die
      die onroerende zaak ter beschikking heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.6'
    text: |-
      Voor de toepassing van het derde lid, onderdeel *b*, kan, met inachtneming van het vierde lid, indien er met
      betrekking tot een zelfde onroerende zaak meer dan één gebruiker is, bekendmaking plaatsvinden aan één van hen.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot de in het derde lid, slotzin, bedoelde
      mededeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
  - number: '24.8'
    text: |-
      Indien aan een belanghebbende ingevolge het derde lid, aanhef en onderdelen *a* en *b*, twee of meer beschikkingen
      als bedoeld in [artikel 22, eerste lid][ref1], moeten worden gezonden, kunnen deze beschikkingen worden verenigd in
      één geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
  - number: '25.1'
    text: |-
      Indien de waarde van een onroerende zaak ingevolge [artikel 19, tweede lid][ref1], is bepaald, stelt de in
      [artikel 1, tweede lid][ref2], bedoelde gemeenteambtenaar die waarde vast bij een voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '19'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '25.2'
    text: |-
      De beschikking geldt, in afwijking van [artikel 22, tweede lid][ref1], vanaf het in [artikel 19, tweede lid][ref2],
      slotzinsnede, bedoelde tijdstip, dan wel treedt zij vanaf dat tijdstip in de plaats van de in
      [artikel 22, eerste lid][ref3], bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '19'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
  - number: '25.3'
    text: |-
      De beschikking bevat de in [artikel 23][ref1] bedoelde gegevens, alsmede een vermelding van het in het tweede lid
      bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel23
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '23'
        hoofdstuk: IV
  - number: '25.4'
    text: |-
      [Artikel 24, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Indien in de loop van het tijdvak waarvoor de waarde van een onroerende zaak is vastgesteld een ander dan degene
      te wiens aanzien ingevolge de voorgaande artikelen een beschikking houdende de vaststelling van de waarde van die
      zaak is genomen, de hoedanigheid verkrijgt van degene, als bedoeld in [artikel 24, derde lid, onderdelen ][ref1],
      neemt de in [artikel 1, tweede lid][ref2], bedoelde gemeenteambtenaar ten aanzien van die ander binnen acht weken
      na een daartoe gedaan verzoek een voor bezwaar vatbare beschikking als bedoeld in [artikel 22, eerste lid][ref3],
      [artikel 25, eerste lid][ref4], dan wel [artikel 27, eerste lid][ref5]. Het verzoek wordt gedaan uiterlijk zes
      weken na de dagtekening van de aanslag onroerende-zaakbelastingen welke met toepassing van de terzake ingevolge de
      wet vastgestelde waarde met betrekking tot die onroerende zaak voor de eerste maal wordt opgelegd aan die ander,
      nadat deze de in [de eerste volzin][ref6] bedoelde hoedanigheid heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0007119#Artikel26
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '25'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      De beschikking treedt, vanaf het tijdstip waarop die ander de in het eerste lid bedoelde hoedanigheid heeft
      verkregen, in de plaats van de in [de artikelen 22, eerste lid][ref1], [25, eerste lid][ref2], dan wel
      [artikel 27, eerste lid][ref3], bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '25'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: '26.3'
    text: |-
      De beschikking bevat in ieder geval de in [artikel 23][ref1] bedoelde gegevens, alsmede een vermelding van het in
      het tweede lid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel23
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '23'
        hoofdstuk: IV
  - number: '26.4'
    text: |-
      [Artikel 24, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat de waarde te laag is vastgesteld, kan de
      in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar de in [artikel 22, eerste lid][ref2],
      [artikel 25, eerste lid][ref3], of [artikel 26, eerste lid][ref4], bedoelde beschikking herzien bij een voor
      bezwaar vatbare beschikking. Een feit dat de in [artikel 1, tweede lid][ref5], bedoelde gemeenteambtenaar bekend
      was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '25'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '27.2'
    text: |-
      De bevoegdheid tot herziening vervalt door verloop van vijf jaren na de vaststelling van de in
      [artikel 22, eerste lid][ref1], [artikel 25, eerste lid][ref2], of [artikel 26, eerste lid][ref3], bedoelde
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel26
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel27
    references:
