        artikel: '26'
        hoofdstuk: IV
  - number: '27.3'
    text: |-
      [Artikel 24, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '28.1'
    text: |-
      Ten aanzien van degene die aannemelijk maakt met betrekking tot de heffing van belasting te zijnen aanzien belang
      te hebben bij de vastgestelde waarde van een onroerende zaak ingevolge [de artikelen 22, eerste lid][ref1],
      [25, eerste lid][ref2], [26, eerste lid][ref3], dan wel [artikel 27, eerste lid][ref4], en aan wie niet op de
      voet van [de artikelen 24][ref5], derde tot en met zesde en achtste lid, 25, vierde lid, 26, vierde lid, dan
      wel 27, derde lid, de beschikking ter zake is toegezonden, neemt de in [artikel 1, tweede lid][ref6], bedoelde
      gemeenteambtenaar binnen acht weken na een daartoe gedaan verzoek een voor bezwaar vatbare beschikking als
      bedoeld in [artikel 22, eerste lid][ref7], [artikel 25, eerste lid][ref8], [artikel 26, eerste lid][ref9], dan wel
      [artikel 27, eerste lid][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel26
