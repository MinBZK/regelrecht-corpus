        hoofdstuk: IV
  - number: '28.3'
    text: |-
      De beschikking bevat de in [artikel 23][ref1] bedoelde gegevens, alsmede een vermelding van het in het tweede lid
      bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel23
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel28
    references:
