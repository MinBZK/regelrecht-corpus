  - number: '38'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor het verzamelen, opslaan en verstrekken van de gegevens
      betreffende de in de gemeente gelegen onroerende zaken en betreffende de waarde ervan, een en ander voor zover dit
      voor de uitvoering van de wet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel38
  - number: '39'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het te registreren
      en te verstrekken gegevenspakket, de periodiciteit en de wijze van verstrekking.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel39
  - number: '40.1'
    text: |-
      Op verzoek kan het waardegegeven van een bepaalde onroerende zaak door de in [artikel 1, tweede lid][ref1],
      bedoelde gemeenteambtenaar worden verstrekt aan een ieder die kan aantonen uit hoofde van de belastingheffing te
      zijnen aanzien een gerechtvaardigd belang te hebben bij de verkrijging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '40.2'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar verstrekt uitsluitend aan degene te wiens aanzien
      een beschikking is genomen, op verzoek een afschrift van de gegevens die ten grondslag liggen aan de vastgestelde
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '40.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de vergoeding die
      in rekening kan worden gebracht ter zake van de verstrekking van een waardegegeven aan derden.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel40
  - number: '41.1'
    text: |-
      Voor de toepassing van de wet wordt met betrekking tot onroerende zaken, gelegen in een gemeente die blijkens haar
      verordening op de onroerende-zaakbelastingen als waardepeildatum 1 januari 1992, 1 januari 1993, 1 januari 1994
      of 1 januari 1996 hanteert - indien daarin geen waardering is voorzien naar de waardepeildatum 1 januari 1995 - de
      ingevolge die verordening vastgestelde waarde geacht de waarde per 1 januari 1995 te zijn.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
  - number: '41.2'
    text: |-
      Indien het eerste lid toepassing vindt, wordt, indien op of na 1 januari 1995 met betrekking tot een onroerende
      zaak feiten of omstandigheden als bedoeld in [artikel 19][ref1] zich hebben voorgedaan, de waarde van die
      onroerende zaak bepaald met inachtneming van [artikel 19][ref2] naar de in de belastingverordening opgenomen
      waardepeildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel19
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '19'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '19'
        hoofdstuk: III
  - number: '41.3'
    text: |-
      In afwijking in zoverre van het eerste lid wordt de waarde van een onroerende zaak als bedoeld in dat lid bepaald
      met inachtneming van de bepalingen in de [Gemeentewet][ref1] zoals die luidt met ingang van 1 januari 1995 naar de
      in de belastingverordening opgenomen waardepeildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: '41.4'
    text: |-
      De waarde van een onroerende zaak, gelegen in een gemeente als bedoeld in het eerste lid, waarvan geen waarde
      ingevolge de in dat lid bedoelde verordening is vastgesteld, wordt met inachtneming van het derde lid bepaald naar
      de in de belastingverordening opgenomen waardepeildatum.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
  - number: '41.5'
    text: |-
      De voorgaande leden zijn eveneens van toepassing bij het bepalen van de heffingsmaatstaf, bedoeld in
      [artikel 220][ref1], en [artikel 120, derde, vijfde en zesde lid, van de Waterschapswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel120
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220d
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '120'
  - number: '41.6'
    text: |-
      Ingeval een belanghebbende bezwaar maakt tegen de met toepassing van de voorgaande leden vastgestelde waarde
      van een onroerende zaak en aannemelijk maakt dat toepassing van [de hoofdstukken III][ref1] en [IV][ref2]
      tot vaststelling van een lagere waarde zou leiden, wordt de waarde op de voet van die hoofdstukken bepaald en
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '41.7'
    text: |-
      Ingeval een gemeente blijkens haar verordening op de onroerende-zaakbelastingen als waardepeildatum 1 januari 1992
      of 1 januari 1993 hanteert, vindt het eerste lid geen toepassing indien de gemeente overgaat tot de waardebepaling
      en de waardevaststelling op de voet van de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel41
  - number: '42.1'
    text: |-
      In afwijking van [artikel 220][ref1] kan een gemeente in haar verordening op de onroerende-zaakbelastingen bepalen
      dat de voor het kalenderjaar 1994 geldende waarde van een onroerende zaak ook wordt toegepast voor de kalenderjaren
      1995 en 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220e
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220e
  - number: '42.2'
    text: |-
      Een gemeente kan in haar belastingverordening ter zake van de in [artikel 221 van de Gemeentewet][ref1]
      genoemde belastingen voor de belastingjaren tot en met 2000 afwijken van [artikel 18, tweede lid][ref2], en
      [artikel 22, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '221'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
  - number: '44'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in aanvulling op de in de wet geregelde onderwerpen nadere
      regels worden gesteld met betrekking tot de uitvoering van de wet en de regelingen ingevolge de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel44
  - number: '45'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel45
  - number: '46'
    text: Deze wet treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet waardering onroerende zaken.'
    url: https://wetten.overheid.nl/BWBR0007119/2004-03-01#Artikel47
