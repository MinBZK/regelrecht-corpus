  - number: '28.2'
    text: |-
      De ingevolge het eerste lid genomen beschikking treedt in de plaats van de in [de artikelen 22, eerste lid][ref1],
      [25, eerste lid][ref2], [26, eerste lid][ref3], dan wel [artikel 27, eerste lid][ref4], bedoelde beschikking met
      ingang van het in het eerste lid bedoelde verzoek aan te geven tijdstip, met dien verstande dat dit tijdstip niet
      eerder kan zijn gelegen dan bij het begin van het kalenderjaar voorafgaande aan het jaar waarin dat verzoek is
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel27
