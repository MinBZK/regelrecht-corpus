---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_waardering_onroerende_zaken
regulatory_layer: WET
publication_date: '2000-12-27'
valid_from: '2024-01-01'
bwb_id: BWBR0007119
url: https://wetten.overheid.nl/BWBR0007119/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot een uniforme
    bepaling van de waarde van onroerende zaken en de wijze van vaststelling daarvan ten behoeve van de heffing van
    belastingen, alsmede om het toezicht op de waardebepaling en waardevaststelling op te dragen aan een daartoe in te
    stellen Waarderingskamer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze wet geldt bij de bepaling, de vaststelling en de verstrekking van de waarde van in Nederland gelegen
      onroerende zaken ten behoeve van afnemers.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het college van burgemeester en wethouders is belast met de uitvoering van deze wet, tenzij de gemeenteambtenaar,
      bedoeld in [artikel 231, tweede lid, onderdeel b, van de Gemeentewet][ref1], hiermee is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
  - number: '2'
    text: |-
      In deze wet wordt verstaan onder: - afnemer: bestuursorgaan dat op grond van een wettelijk voorschrift bevoegd is
      tot gebruik van een waardegegeven;
        - authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij wettelijk voorschrift als authentiek is
      aangemerkt;
        - basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;
        - belastingen: belastingen geheven door het Rijk, de gemeenten en de waterschappen;
        - college: college van burgemeester en wethouders;
        - Dienst: Dienst voor het kadaster en de openbare registers als genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref1];
        - landelijke voorziening WOZ: landelijke voorziening als bedoeld in [artikel 37aa][ref2];
        - Onze Minister: Onze Minister van Financiën;
        - terugmelding: melding als bedoeld in [artikel 37f, eerste lid][ref3];
        - waardegegeven: op de voet van [hoofdstuk IV][ref4] van deze wet vastgestelde waarde van een onroerende zaak;
        - de wet: de Wet waardering onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel37aa
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel37f
      [ref4]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: 37aa
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0007119
        artikel: 37f
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de verrekening van de kosten die
      verbonden zijn aan de uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel3
  - number: '4.1'
    text: Er is een Waarderingskamer. De Waarderingskamer bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      De Waarderingskamer houdt toezicht op de waardebepaling en de waardevaststelling van onroerende zaken, op de
      uitvoering van de basisregistratie waarde onroerende zaken (basisregistratie WOZ) en op de overige in de wet
      geregelde onderwerpen. De colleges verschaffen de Waarderingskamer desgevraagd tijdig de voor de uitoefening van
      haar taak noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      De Waarderingskamer dient desgevraagd of eigener beweging Onze Minister van advies over zaken die verband houden
      met de inhoud en de toepassing van hetgeen bij of krachtens de wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel4
  - number: '4.4'
    text: De Waarderingskamer geeft voorts uitvoering aan hetgeen haar overigens bij of krachtens de wet is opgedragen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel4
  - number: '4.5'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1], met uitzondering van de [artikelen 9][ref2] en
      [15 van die wet][ref3], is van toepassing op de Waarderingskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '5.1'
    text: De Waarderingskamer bestaat uit elf leden, waaronder de voorzitter, die worden benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Van de andere leden dan de voorzitter worden vier leden op voordracht van de Vereniging van Nederlandse Gemeenten,
      twee leden uit de rijksbelastingdienst en twee leden op voordracht van de Unie van Waterschappen benoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel5
  - number: '5.3'
    text: De Waarderingskamer wijst uit haar midden een plaatsvervangende voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel5
  - number: '5.4'
    text: |-
      De leden van de Waarderingskamer worden benoemd voor ten hoogste vier jaren. Na afloop van deze termijn kunnen zij
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel5
  - number: '5.5'
    text: |-
      Degene die tot lid is benoemd ter vervulling van een tussentijds opengevallen plaats, treedt af op het ogenblik
      waarop degene in wiens plaats hij is benoemd, had moeten aftreden. Hij kan worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De Waarderingskamer heeft drie adviserende leden die worden benoemd door Onze Minister op voordracht
      van onderscheidenlijk Onze Minister, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en het
      InterProvinciaal Overleg.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      De adviserende leden kunnen te allen tijde op eigen verzoek door Onze Minister worden ontslagen. Onze Minister kan
      hen op verzoek van degene die de voordracht heeft gedaan, schorsen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      De Waarderingskamer kan ter uitvoering van haar taak commissies instellen, waarin ook personen van buiten de
      Waarderingskamer zitting kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel7
  - number: '7.2'
    text: De Waarderingskamer en haar commissies kunnen zich doen bijstaan door deskundigen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Waarderingskamer heeft een secretariaat onder leiding van een secretaris. In overeenstemming met Onze Minister,
      gaat de Waarderingskamer een arbeidsovereenkomst aan met de secretaris en beëindigt deze.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel8
  - number: '8.2'
    text: Het secretariaat staat de Waarderingskamer in haar werkzaamheden bij.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel8
  - number: '8.3'
    text: De secretaris en het personeel van het secretariaat zijn niet tevens lid of adviserend lid van de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel8
  - number: '8.4'
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel8
  - number: '10'
    text: |-
      De Waarderingskamer stelt een bestuursreglement vast, waarin in ieder geval regels worden opgenomen met betrekking
      tot de werkwijze van haar commissies, met betrekking tot de wijze waarop overleg wordt gevoerd met de colleges
      en de afnemers of met hun vertegenwoordigers omtrent aangelegenheden ter zake waarvan naar haar oordeel overleg
      gewenst is, alsmede omtrent aangelegenheden ter zake waarvan de deelnemers aan het overleg de Waarderingskamer te
      kennen hebben gegeven overleg te willen voeren.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Geschillen met betrekking tot de uitvoering van de wet tussen afnemers en colleges kunnen door de betrokken
      partijen worden voorgelegd aan de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het verzoek tot het in behandeling nemen van een geschil wordt ingediend door de bij het geschil betrokken
      partijen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      De Waarderingskamer beslist binnen dertien weken nadat het geschil is voorgelegd. De Waarderingskamer kan deze
      termijn, met redenen omkleed, eenmaal met dertien weken verlengen. Zij kan voorts de termijn verder verlengen met
      instemming van de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel11
  - number: '11.4'
    text: |-
      De Waarderingskamer is bevoegd de kosten die door haar zijn gemaakt in verband met het voorgelegde geschil in
      rekening te brengen aan de partijen. Zij kan beslissen dat de kosten die door partijen zijn gemaakt, worden
      gedragen door de in het ongelijk gestelde partij.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel11
  - number: '16'
    text: 'Voor de toepassing van de wet wordt als één onroerende zaak aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.a
    text: een gebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.b
    text: een ongebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.c
    text: |-
      een gedeelte van een in onderdeel *a* of onderdeel *b* bedoeld eigendom dat blijkens zijn indeling is bestemd om
      als een afzonderlijk geheel te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.d
    text: |-
      een samenstel van twee of meer van de in onderdeel *a* of onderdeel *b* bedoelde eigendommen of in onderdeel *c*
      bedoelde gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden
      beoordeeld, bij elkaar behoren;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.e
    text: |-
      een geheel van twee of meer van de in onderdeel a of onderdeel b bedoelde eigendommen, of in onderdeel c bedoelde
      gedeelten daarvan, of in onderdeel d bedoelde samenstellen, dat naar de omstandigheden beoordeeld één terrein vormt
      bestemd voor verblijfsrecreatie en dat als zodanig wordt geëxploiteerd;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: 16.f
    text: |-
      het binnen de gemeente gelegen deel van een in onderdeel *a* of onderdeel *b* bedoeld eigendom, van een in
      onderdeel *c* bedoeld gedeelte daarvan, van een in onderdeel d bedoeld samenstel of van een in onderdeel e bedoeld
      geheel.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel16
  - number: '17.1'
    text: Aan een onroerende zaak wordt een waarde toegekend.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      De waarde wordt bepaald op de waarde die aan de onroerende zaak dient te worden toegekend, indien de volle en
      onbezwaarde eigendom daarvan zou kunnen worden overgedragen en de verkrijger de zaak in de staat waarin die zich
      bevindt, onmiddellijk en in volle omvang in gebruik zou kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
  - number: '17.3'
    text: |-
      In afwijking in zoverre van het tweede lid wordt de waarde van een onroerende zaak, voor zover die niet tot woning
      dient, en met uitzondering van onroerende zaken die zijn ingeschreven in het rijksmonumentenregister, bedoeld in
      [artikel 3.3 van de Erfgoedwet][ref1], bepaald op de vervangingswaarde indien dit leidt tot een hogere waarde dan
      die ingevolge het tweede lid. Bij de berekening van de vervangingswaarde wordt rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '3'
  - number: 17.3.a
    text: de aard en de bestemming van de zaak;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
  - number: 17.3.b
    text: |-
      de sedert de stichting van de zaak opgetreden technische en functionele veroudering, waarbij de invloed van latere
      wijzigingen in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
  - number: '17.4'
    text: |-
      In afwijking in zoverre van het tweede lid wordt de waarde van een gebouwd eigendom in aanbouw bepaald op de
      vervangingswaarde, bedoeld in het derde lid. Onder een gebouwd eigendom in aanbouw wordt verstaan een onroerende
      zaak of gedeelte daarvan waarvoor een omgevingsvergunning is verleend voor een omgevingsplanactiviteit als bedoeld
      in [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref1] of voor een bouwactiviteit als bedoeld
      in artikel 5.1, tweede lid, aanhef en onder a, van die wet en dat door bouw nog niet geschikt is voor gebruik
      overeenkomstig zijn beoogde bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '17.5'
    text: |-
      In afwijking in zoverre van het tweede lid wordt de waarde van een gebouwd eigendom dat tot woning dient en
      deel uitmaakt van een op de voet van de [Natuurschoonwet 1928][ref1] aangewezen landgoed dat voldoet aan de in
      [artikel 220d, eerste lid, onderdeel d, van de Gemeentewet][ref2] bedoelde voorwaarden bepaald met inachtneming van
      een vooronderstelde verplichting om het gedurende een tijdvak van 25 jaren als zodanig in stand te houden en geen
      opgaand hout te vellen anders dan volgens de regels van normaal bosbeheer noodzakelijk of gebruikelijk is. Gebouwde
      eigendommen die dienstbaar zijn aan de woning worden geacht deel uit te maken van die woning.


      [ref1]: https://wetten.overheid.nl/BWBR0001939
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001939
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220d
  - number: '17.6'
    text: |-
      Met betrekking tot een onroerende zaak als bedoeld in [artikel 16, aanhef en onderdeel f ][ref1], wordt de waarde
      gesteld op een evenredig deel van de waarde die dient te worden toegekend aan de gehele onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
        hoofdstuk: III
  - number: '18.1'
    text: |-
      De waarde van een onroerende zaak wordt bepaald naar de waarde die de zaak op de waardepeildatum heeft naar de
      staat waarin de zaak op die datum verkeert.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: '18.2'
    text: De waardepeildatum ligt één jaar voor het begin van het kalenderjaar waarvoor de waarde wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien een onroerende zaak in het kalenderjaar voorafgaande aan het begin van het kalenderjaar waarvoor de waarde
      wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: 18.3.a
    text: opgaat in een of meer andere onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: 18.3.b
    text: wijzigt als gevolg van bouw, verbouwing, verbetering, afbraak of vernietiging, dan wel van bestemming verandert, of
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: 18.3.c
    text: |-
      een verandering in waarde ondergaat als gevolg van een andere, specifiek voor de onroerende zaak geldende,
      bijzondere omstandigheid,
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ingevolge welke bij de waardebepaling buiten aanmerking
      wordt gelaten de waarde van onroerende zaken of onderdelen daarvan, indien die waarde geen onderdeel uitmaakt van
      de grondslag van de belastingen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel18
  - number: '20.1'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde ambtenaar van de gemeente waarin de onroerende zaak is gelegen,
      bepaalt de waarde van die onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '20.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de onderbouwing en de uitvoering van
      de waardebepaling.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens het tweede lid wordt niet gedaan dan nadat het
      ontwerp aan de beide Kamers der Staten-Generaal is overgelegd en aan de Kamers de gelegenheid is geboden om binnen
      zes weken na de dag waarop het ontwerp is overgelegd, hun oordeel aan Onze Minister kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel20
  - number: '21'
    text: |-
      De Waarderingskamer kan het college een aanbeveling doen omtrent de uitvoering van de wet. Zij gaat daartoe niet
      over dan na het college in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel21
  - number: '22.1'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde ambtenaar van de gemeente waarin de onroerende zaak is gelegen, stelt
      de waarde van de onroerende zaak vast bij een voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '22.2'
    text: De bij de beschikking vastgestelde waarde geldt voor een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel22
  - number: '23.1'
    text: 'De beschikking bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: 23.1.a
    text: de naam, het adres en de woon- of vestigingsplaats van degene te wiens aanzien de beschikking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: 23.1.b
    text: een aanduiding van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: 23.1.c
    text: de aan de onroerende zaak toegekende waarde;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: 23.1.d
    text: de waardepeildatum;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: 23.1.e
    text: het kalenderjaar waarvoor de beschikking geldt.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: '23.2'
    text: Het niet naleven van de voorschriften van het eerste lid brengt geen nietigheid van de beschikking mee.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel23
  - number: '24.1'
    text: De beschikking wordt genomen binnen acht weken na het begin van het kalenderjaar waarvoor zij geldt.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.2'
    text: Het niet naleven van het voorschrift van het eerste lid brengt geen nietigheid van de beschikking mee.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.3'
    text: 'De bekendmaking van de beschikking geschiedt terstond door toezending aan:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: 24.3.a
    text: |-
      degene die aan het begin van het kalenderjaar het genot heeft van de onroerende zaak krachtens eigendom, bezit of
      beperkt recht;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: 24.3.b
    text: |-
      degene die aan het begin van het kalenderjaar de onroerende zaak al dan niet krachtens eigendom, bezit, beperkt
      recht of persoonlijk recht gebruikt.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.4'
    text: |-
      Voor de toepassing van het derde lid, onderdeel *a*, kan, indien er met betrekking tot een zelfde onroerende
      zaak meer dan één genothebbende krachtens eigendom, bezit of beperkt recht kan worden aangewezen, bekendmaking
      plaatsvinden aan één van hen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.5'
    text: 'Voor de toepassing van het derde lid, onderdeel *b*, wordt:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: 24.5.a
    text: |-
      gebruik door de leden van een huishouden aangemerkt als gebruik door een door de in [artikel 1, tweede lid][ref1],
      bedoelde gemeenteambtenaar aan te wijzen lid van dat huishouden;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: 24.5.b
    text: |-
      gebruik door degene aan wie een deel van een onroerende zaak in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: 24.5.c
    text: |-
      het ter beschikking stellen van een onroerende zaak voor volgtijdig gebruik aangemerkt als gebruik door degene die
      die onroerende zaak ter beschikking heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.6'
    text: |-
      Voor de toepassing van het derde lid, onderdeel *b*, kan, met inachtneming van het vierde lid, indien er met
      betrekking tot een zelfde onroerende zaak meer dan één gebruiker is, bekendmaking plaatsvinden aan één van hen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot de in het derde lid, slotzin, bedoelde
      mededeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
  - number: '24.8'
    text: |-
      Indien aan een belanghebbende ingevolge het derde lid, aanhef en onderdelen *a* en *b*, twee of meer beschikkingen
      als bedoeld in [artikel 22, eerste lid][ref1], moeten worden gezonden, kunnen deze beschikkingen worden verenigd in
      één geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
  - number: '24.9'
    text: |-
      Indien ten aanzien van degene aan wie ingevolge het derde lid de bekendmaking van de beschikking dient te
      geschieden een aanslag onroerende-zaakbelastingen als bedoeld in [artikel 220 van de Gemeentewet][ref1] wordt
      vastgesteld waarbij als heffingsmaatstaf geldt de bij de beschikking vastgestelde waarde van de onroerende
      zaak, geschiedt in afwijking van de vorige leden de bekendmaking van de beschikking in één geschrift met het
      aanslagbiljet onroerende-zaakbelastingen. Het niet naleven van de eerste volzin brengt geen nietigheid van de
      beschikking mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '26.1'
    text: |-
      Indien in de loop van het kalenderjaar waarvoor de waarde van een onroerende zaak is vastgesteld een ander
      dan degene te wiens aanzien een beschikking houdende de vaststelling van de waarde van die zaak is genomen, de
      hoedanigheid verkrijgt van degene, bedoeld in [artikel 24, derde lid, onderdeel a of onderdeel b][ref1],:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: 26.1.a
    text: |-
      neemt de in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar ten aanzien van die ander binnen acht weken
      na een daartoe gedaan verzoek een voor bezwaar vatbare beschikking als bedoeld in [artikel 22, eerste lid][ref2],
      of [artikel 27, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: 26.1.b
    text: |-
      kan de in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar ten aanzien van die ander eigener
      beweging een voor bezwaar vatbare beschikking nemen als bedoeld in [artikel 22, eerste lid][ref2], of
      [artikel 27, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      De beschikking treedt, vanaf het tijdstip waarop die ander de in het eerste lid bedoelde hoedanigheid heeft
      verkregen, in de plaats van de in [de artikelen 22, eerste lid][ref1], of [artikel 27, eerste lid][ref2], bedoelde
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: '26.3'
    text: |-
      De beschikking bevat in ieder geval de in [artikel 23][ref1] bedoelde gegevens, alsmede een vermelding van het in
      het tweede lid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel23
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '23'
        hoofdstuk: IV
  - number: '26.4'
    text: |-
      [Artikel 24, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat de waarde te laag is vastgesteld, kan de in
      [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar de in [artikel 22, eerste lid][ref2], of
      [artikel 26, eerste lid][ref3], bedoelde beschikking herzien bij een voor bezwaar vatbare beschikking. Een feit
      dat de in [artikel 1, tweede lid][ref4], bedoelde gemeenteambtenaar bekend was of redelijkerwijs bekend had kunnen
      zijn, kan geen grond voor herziening opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '27.2'
    text: |-
      De bevoegdheid tot herziening vervalt door verloop van vijf jaren na de vaststelling van de in
      [artikel 22, eerste lid][ref1], of [artikel 26, eerste lid][ref2], bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
  - number: '27.3'
    text: |-
      [Artikel 24, derde tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '28.1'
    text: |-
      Ten aanzien van degene die aannemelijk maakt belang te hebben bij de vastgestelde waarde van een onroerende zaak
      ingevolge de [artikelen 22, eerste lid][ref1], [26, eerste lid][ref2], dan wel [artikel 27, eerste lid][ref3], en
      aan wie niet op de voet van de [artikelen 24, derde tot en met zesde en achtste lid][ref4], [26, vierde lid][ref5],
      dan wel [27, derde lid][ref6], de beschikking ter zake is toegezonden, neemt de in [artikel 1, tweede lid][ref7],
      bedoelde gemeenteambtenaar binnen acht weken na een daartoe gedaan verzoek een voor bezwaar vatbare beschikking als
      bedoeld in [artikel 22, eerste lid][ref8], [artikel 26, eerste lid][ref9], dan wel [artikel 27, eerste lid][ref10].
      Van een belang is sprake als het waardegegeven op grond van een wettelijk voorschrift wordt gebruikt, en de
      belanghebbende door dit gebruik in zijn individuele belang kan worden geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref8]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref9]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref10]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref8
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref9
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref10
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: '28.2'
    text: |-
      De ingevolge het eerste lid genomen beschikking treedt in de plaats van de in de [artikelen 22, eerste lid][ref1],
      [26, eerste lid][ref2], dan wel [artikel 27, eerste lid][ref3], bedoelde beschikking met ingang van het in het
      eerste lid bedoelde verzoek aan te geven tijdstip, met dien verstande dat dit tijdstip niet eerder kan zijn gelegen
      dan bij het begin van het kalenderjaar voorafgaande aan het jaar waarin dat verzoek is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
        hoofdstuk: IV
  - number: '28.3'
    text: |-
      De beschikking bevat de in [artikel 23][ref1] bedoelde gegevens, alsmede een vermelding van het in het tweede lid
      bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel23
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '23'
        hoofdstuk: IV
  - number: '28.4'
    text: De bekendmaking van de beschikking geschiedt door toezending aan degene te wiens aanzien zij is genomen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien bij de uitspraak op een bezwaarschrift dan wel bij een ambtshalve door de in [artikel 1, tweede lid][ref1],
      bedoelde gemeenteambtenaar genomen besluit met betrekking tot een op de voet van [dit hoofdstuk][ref2] genomen
      beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 29.1.a
    text: die beschikking wordt vernietigd;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel29
  - number: 29.1.b
    text: |-
      de bij die beschikking vastgestelde waarde wordt verminderd of verhoogd, geschiedt de bekendmaking daarvan aan
      de belanghebbenden die het aangaat en de mededeling daarvan aan de afnemers met overeenkomstige toepassing van
      [artikel 24, derde tot en met achtste lid][ref1], en met inachtneming van [artikel 28][ref2]; mededeling van de
      uitspraak op een bezwaarschrift aan de afnemers geschiedt eerst indien deze onherroepelijk vaststaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel28
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '28'
        hoofdstuk: IV
  - number: '29.2'
    text: |-
      Indien de in het eerste lid bedoelde vernietiging, vermindering of verhoging plaatsvindt krachtens
      onherroepelijke rechterlijke uitspraak, doet de in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar
      daarvan mededeling aan de belanghebbenden die het aangaat met overeenkomstige toepassing van
      [artikel 24, derde tot en met achtste lid][ref2], en met inachtneming van [artikel 28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel28
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '28'
        hoofdstuk: IV
  - number: '29.3'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de mededeling aan de belanghebbenden die het aangaat,
      bedoeld in het tweede lid, wordt mededeling gedaan aan de afnemers met overeenkomstige toepassing van
      [artikel 24, derde tot en met achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '30.1'
    text: |-
      Met betrekking tot de waardebepaling en de waardevaststelling ingevolge de [hoofdstukken III][ref1] en [IV][ref2]
      zijn de [artikelen 1, derde lid][ref3], [5, eerste lid, tweede volzin][ref4], [22j][ref5], [24a, eerste lid][ref6],
      [25 tot en met 30][ref7], [47][ref8], [49 tot en met 51][ref9], [52a][ref10], [53a][ref11], [54][ref12] en
      [56 tot en met 60 van de Algemene wet inzake rijksbelastingen][ref13] van overeenkomstige toepassing. Met betrekking
      tot natuurlijke personen die een bedrijf of zelfstandig een beroep uitoefenen, alsmede lichamen, is voorts
      __REF013___________________________________________________________________________________________________________
      _____________________________________________ van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel22j
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel47
