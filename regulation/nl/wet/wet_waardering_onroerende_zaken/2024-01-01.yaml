  - number: '30.2'
    text: |-
      Een bezwaarschrift tegen een beschikking die is bekendgemaakt en verenigd in één geschrift met een aanslag
      onroerende-zaakbelastingen, zoals bedoeld in [artikel 24, negende lid][ref1], wordt geacht mede te zijn gericht
      tegen die aanslag, tenzij uit het bezwaarschrift het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '30.3'
    text: |-
      Een bezwaarschrift tegen een aanslag onroerende-zaakbelastingen die is bekendgemaakt en verenigd in één geschrift
      met een in [artikel 22, eerste lid][ref1], bedoelde beschikking, zoals bedoeld in [artikel 24, negende lid][ref2],
      wordt geacht mede te zijn gericht tegen die beschikking, tenzij uit het bezwaarschrift het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
