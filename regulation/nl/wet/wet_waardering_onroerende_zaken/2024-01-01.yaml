        artikel: '22'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '24'
        hoofdstuk: IV
  - number: '30.4'
    text: |-
      Indien de in het tweede of derde lid bedoelde fictie toepassing vindt, treedt de in [artikel 1, tweede lid][ref1],
      bedoelde gemeenteambtenaar in de plaats van de in [artikel 231, tweede lid, onderdeel b, van de Gemeentewet][ref2]
      bedoelde gemeenteambtenaar wat betreft de aanslag onroerende-zaakbelastingen. In afwijking in zoverre van het
      eerste lid in samenhang met [artikel 25, vierde lid, van de Algemene wet inzake rijksbelastingen][ref3], vervat
      deze gemeenteambtenaar de uitspraak op het bezwaar tegen de in het tweede of derde lid bedoelde beschikking en de
      uitspraak op het bezwaar tegen de in het tweede of derde lid bedoelde aanslag onroerende-zaakbelastingen in één
      geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel25
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '25'
  - number: '30.5'
    text: |-
      De bevoegdheden en verplichtingen die ingevolge de [Algemene wet inzake rijksbelastingen][ref1] gelden met
      betrekking tot de inspecteur, gelden daarbij voor het college en de in [artikel 1, tweede lid][ref2], bedoelde
      gemeenteambtenaar. De verplichtingen die krachtens [artikel 56 van de Algemene wet inzake rijksbelastingen][ref3]
      gelden jegens iedere door Onze Minister aangewezen andere ambtenaar van de rijksbelastingdienst, gelden daarbij
      jegens door het college aangewezen personen. Voor zover dit redelijkerwijs van belang kan worden geacht voor de
      uitvoering van de wet, gelden vorenbedoelde bevoegdheden en verplichtingen ook buiten de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel56
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '56'
  - number: '30.6'
    text: |-
      Voor de overeenkomstige toepassing van [artikel 25c van de Algemene wet inzake rijksbelastingen][ref1] treedt de
      raad in de plaats van de Tweede Kamer der Staten-Generaal of de Tweede Kamer. Voor de overeenkomstige toepassing
      van [artikel 28, eerste lid, van die wet ][ref2] treedt het college in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel28
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 25c
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '28'
  - number: '30.7'
    text: |-
      De colleges van twee of meer gemeenten kunnen bepalen dat een daartoe aangewezen ambtenaar van één
      van die gemeenten voor de uitvoering van een of meer bepalingen van de wet wordt aangewezen als de in
      [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar van die gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '30.8'
    text: |-
      Indien een gemeenschappelijke regeling is getroffen en bij die regeling een openbaar lichaam of een
      bedrijfsvoeringsorganisatie is ingesteld, kan bij of krachtens die regeling worden bepaald dat een daartoe
      aangewezen ambtenaar van dat openbare lichaam of die bedrijfsvoeringsorganisatie voor de uitvoering van een of meer
      bepalingen van de wet wordt aangewezen als de in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '30.9'
    text: |-
      Op een bezwaarschrift dat niet is ingediend in de laatste zes weken van een kalenderjaar,
      doet de in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2], uitspraak in het kalenderjaar waarin het
      bezwaarschrift is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 30a.1
    text: |-
      Het bedrag dat strekt tot vergoeding van de kosten, bedoeld in
      [artikel 7:15, tweede lid, van de Algemene wet bestuursrecht][ref1], onder toepassing van de nadere regels
      gesteld krachtens het vierde lid van dat artikel, wordt, voor zover die kosten betrekking hebben op door een
      derde beroepsmatig verleende rechtsbijstand in het kader van het bezwaar tegen een besluit genomen op grond van
      het gestelde bij of krachtens deze wet of [titel IV, hoofdstuk XV, paragraaf 2, van de Gemeentewet][ref2] of
      tegen een daarmee verband houdend besluit, vermenigvuldigd met 0,25. De eerste zin vindt geen toepassing in geval
      van bijzondere omstandigheden in de zin van de nadere regels gesteld krachtens artikel 7:15, vierde lid, van de
      Algemene wet bestuursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005416
        paragraaf: '2'
  - number: 30a.2
    text: |-
      In geval van een veroordeling in de kosten als bedoeld in
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref1], onder toepassing van de nadere regels
      gesteld krachtens de laatste zin van artikel 8:75, eerste lid, van die wet, of in geval van een veroordeling in
      de kosten waarbij artikel 8:75 van die wet van overeenkomstige toepassing is verklaard, wordt, voor zover die
      kosten betrekking hebben op door een derde beroepsmatig verleende rechtsbijstand in het kader van het beroep, hoger
      beroep of beroep in cassatie bij de bestuursrechter betreffende een besluit genomen op grond van het gestelde bij
      of krachtens deze wet of [titel IV, hoofdstuk XV, paragraaf 2, van de Gemeentewet][ref2] of een daarmee verband
      houdend besluit, het bedrag dat strekt tot de vergoeding van die kosten vermenigvuldigd met:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005416
        paragraaf: '2'
  - number: 30a.2.a
    text: 0,25, indien het bestreden besluit wordt vernietigd of gewijzigd;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
  - number: 30a.2.b
    text: 0,10 in alle overige gevallen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
  - number: 30a.3
    text: |-
      De bestuursrechter kent in het kader van het beroep, hoger beroep of beroep in cassatie
      betreffende een besluit genomen op grond van het gestelde bij of krachtens deze wet of
      [titel IV, hoofdstuk XV, paragraaf 2, van de Gemeentewet][ref1] of een daarmee verband houdend besluit, uitsluitend
      op verzoek, bij overschrijding van de redelijke termijn een vergoeding van immateriële schade toe van € 50 per
      half jaar waarmee die termijn is overschreden, tenzij sprake is van bijzondere omstandigheden. Ingeval de procedure
      eveneens een boetebeschikking betreft, wordt daarnaast de boetebeschikking verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        paragraaf: '2'
  - number: 30a.4
    text: |-
      Onverminderd de [artikelen 7:15, vijfde lid][ref1], en [8:75, tweede lid, van de Algemene wet bestuursrecht][ref2],
      al dan niet in samenhang met [artikel 8:108, eerste lid, van die wet][ref3] of de [artikelen 29][ref4] of
      [29f van de Algemene wet inzake rijksbelastingen][ref5], vinden uitbetalingen ingevolge een beslissing op bezwaar
      of uitspraak op beroep, hoger beroep of beroep in cassatie betreffende een besluit genomen op grond van het
      gestelde bij of krachtens deze wet of [titel IV, hoofdstuk XV, paragraaf 2, van de Gemeentewet][ref6] of een
      daarmee verband houdend besluit, waaronder uitbetalingen van vergoedingen als bedoeld in de voorgaande leden,
      dwangsommen als bedoeld in [artikel 4:17, eerste lid, van de Algemene wet bestuursrecht][ref7] en vergoedingen van
      het betaalde griffierecht als bedoeld in [artikel 8:74 van die wet][ref8], uitsluitend plaats op een bankrekening
      die op naam staat van de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel29f
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
