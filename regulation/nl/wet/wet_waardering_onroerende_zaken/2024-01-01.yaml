  - number: 37a.1
    text: |-
      Er is een basisregistratie WOZ waarin waardegegevens met bijbehorende temporele en meta-kenmerken zijn opgenomen.
      Het waardegegeven, bedoeld in de vorige volzin, is een authentiek gegeven.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37a
  - number: 37a.2
    text: |-
      In de basisregistratie WOZ zijn ook bij algemene maatregel van bestuur aan te wijzen authentieke gegevens uit
      andere basisregistraties opgenomen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37a
  - number: 37a.3
    text: De basisregistratie WOZ heeft tot doel de afnemers te voorzien van waardegegevens.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37a
  - number: 37aa.1
    text: |-
      Er is een geautomatiseerde landelijke voorziening WOZ met als doel waardegegevens met bijbehorende temporele en
      meta-kenmerken te verstrekken aan de afnemers, alsmede het op regelmatige basis verstrekken van waardegegevens
      inzake onroerende zaken die hoofdzakelijk tot woning dienen aan een loket voor openbare WOZ-waarden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37aa
  - number: 37aa.2
    text: |-
      De Dienst houdt en beheert de landelijke voorziening WOZ waarin de gegevens uit de door de gemeenten gehouden
      basisregistratie WOZ zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37aa
  - number: 37aa.3
    text: |-
      De Dienst draagt er zorg voor dat de weergave van een in de landelijke voorziening WOZ opgenomen gegeven
      overeenstemt met het overeenkomstig [artikel 37b, eerste lid][ref1], door het college verstrekte gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel37b
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37aa
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: 37b
        hoofdstuk: VI
  - number: 37aa.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent het beheer, de vorm en de
      inrichting van de landelijke voorziening WOZ.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37aa
  - number: 37b.1
    text: |-
      Het college levert een waardegegeven met bijbehorende temporele en meta-kenmerken aan de Dienst ten behoeve van
      de opname in de landelijke voorziening WOZ. De Dienst levert het waardegegeven met bijbehorende temporele en meta-
      kenmerken aan de afnemers.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
  - number: 37b.2
    text: |-
      Een waardegegeven waarbij op grond van [artikel 37g][ref1] de aantekening «in onderzoek» is geplaatst, wordt
      uitsluitend verstrekt onder mededeling van die aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel37g
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: 37g
        hoofdstuk: VI
  - number: 37b.3
    text: |-
      Het college deelt de plaatsing of verwijdering van de aantekening »in onderzoek» mee aan de Dienst ten behoeve
      van vermelding daarvan in de landelijke voorziening WOZ. De Dienst deelt aan een afnemer die het betreffende
      waardegegeven voorafgaand aan de plaatsing of verwijdering van de aantekening verstrekt heeft gekregen, mee dat de
      aantekening is geplaatst of verwijderd en of het gegeven is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
  - number: 37b.4
    text: De levering van gegevens als bedoeld in dit artikel vindt plaats langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
  - number: 37b.5
    text: Met een waardegegeven kunnen authentieke gegevens uit andere basisregistraties worden meegeleverd.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
  - number: 37b.6
    text: |-
      Het college draagt er zorg voor dat een meegeleverd authentiek gegeven uit een andere basisregistratie overeenstemt
      met dat gegeven, als opgenomen in die andere basisregistratie.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37b
  - number: 37c.1
    text: |-
      Een afnemer gebruikt een waardegegeven uitsluitend bij de uitoefening van een op grond van een wettelijk
      voorschrift verleende bevoegdheid tot gebruik van dit gegeven.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37c
  - number: 37c.2
    text: |-
      Een afnemer is niet bevoegd een waardegegeven verder bekend te maken dan noodzakelijk voor de uitoefening van de
      hem verleende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37c
  - number: 37d.1
    text: |-
      Voor zover een afnemer een op grond van een wettelijk voorschrift verleende bevoegdheid tot gebruik van het
      waardegegeven uitoefent, gebruikt hij het waardegegeven zoals dat ten tijde van het gebruik is opgenomen in de
      basisregistratie WOZ.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37d
  - number: 37d.2
    text: |-
      Voor een andere toepassing dan voor de heffing van belastingen geldt het eerste lid niet indien bij het
      waardegegeven de aantekening «in onderzoek» is geplaatst.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37d
  - number: 37e
    text: |-
      Voor zover [artikel 37d, eerste lid][ref1], van toepassing is, hoeft degene aan wie door een afnemer om een
      waardegegeven wordt gevraagd dat gegeven niet te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel37d
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: 37d
        hoofdstuk: VI
  - number: 37f.1
    text: |-
      Een afnemer die gerede twijfel heeft over de juistheid van een authentiek gegeven dat hij via de landelijke
      voorziening WOZ verstrekt heeft gekregen meldt dit onder opgaaf van redenen aan de Dienst. De Dienst stuurt de
      melding onverwijld door naar het college dat het aangaat.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37f.2
    text: |-
      Voor zover een terugmelding betrekking heeft op een authentiek gegeven dat is overgenomen uit een andere
      basisregistratie, zendt het college die melding onverwijld door aan de beheerder van die andere basisregistratie en
      doet daarvan mededeling aan de afnemer die de terugmelding heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37f.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37f.3.a
    text: |-
      de gevallen waarin een terugmelding achterwege kan blijven, omdat de terugmelding niet van belang is voor het
      bijhouden van de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37f.3.b
    text: de wijze waarop een terugmelding moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37f.3.c
    text: |-
      de termijn waarbinnen de afhandeling van het onderzoek naar aanleiding van een terugmelding over een waardegegeven
      moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37f
  - number: 37g.1
    text: 'Het college plaatst de aantekening «in onderzoek» bij een waardegegeven indien ten aanzien van dat waardegegeven:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.1.a
    text: een terugmelding is gedaan;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.1.b
    text: een bezwaar- of beroepschrift is ingediend;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.1.c
    text: een verzoek om ambtshalve vermindering is gedaan, of
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.1.d
    text: overigens gerede twijfel is ontstaan omtrent de juistheid van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.2
    text: 'Het college verwijdert de aantekening «in onderzoek»:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.2.a
    text: na de afhandeling van het onderzoek naar aanleiding van de terugmelding;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.2.b
    text: nadat de beslissing op bezwaar of de rechterlijke uitspraak onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.2.c
    text: na de afhandeling van het verzoek om ambtshalve vermindering, of
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37g.2.d
    text: na de afhandeling van het onderzoek naar aanleiding van de situatie, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37g
  - number: 37h
    text: |-
      Bij algemene maatregel van bestuur worden bestuursorganen aangewezen die bevoegd zijn tot gebruik van een
      waardegegeven of de daarbij behorende temporele en meta-kenmerken ten behoeve van de bij die algemene maatregel van
      bestuur aan te wijzen doeleinden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel37h
  - number: '38'
    text: |-
      Het college draagt zorg voor het verzamelen, opslaan en verstrekken van de gegevens betreffende de in de gemeente
      gelegen onroerende zaken en betreffende de waarde ervan, een en ander voor zover dit voor de uitvoering van de wet
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel38
  - number: '39'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het te registreren
      en te verstrekken gegevenspakket, de periodiciteit en de wijze van verstrekking.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel39
  - number: '40.1'
    text: |-
      Op verzoek kan het waardegegeven van een bepaalde onroerende zaak die niet in hoofdzaak tot woning dient door de
      in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar worden verstrekt aan een ieder die kan aantonen een
      gerechtvaardigd belang te hebben bij de verkrijging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '40.2'
    text: |-
      De in [artikel 1, tweede lid][ref1], bedoelde gemeenteambtenaar verstrekt uitsluitend aan degene te wiens aanzien
      een beschikking is genomen, op verzoek een afschrift van de gegevens die ten grondslag liggen aan de vastgestelde
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel1
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '1'
        hoofdstuk: I
  - number: '40.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de vergoeding die
      in rekening kan worden gebracht ter zake van de verstrekking van een waardegegeven aan derden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40
  - number: 40a.1
    text: |-
      Bij algemene maatregel van bestuur worden derden aangewezen die het waardegegeven of de daarbij behorende temporele
      en meta-kenmerken van een bepaalde onroerende zaak die in hoofdzaak tot woning dient op hun verzoek verstrekt
      kunnen krijgen via de landelijke voorziening WOZ en bevoegd zijn tot gebruik van dat waardegegeven of de daarbij
      behorende temporele en meta-kenmerken ten behoeve van de bij die algemene maatregel van bestuur aan te wijzen
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40a
  - number: 40a.2
    text: |-
      De bij de algemene maatregel van bestuur, bedoeld in het eerste lid, aangewezen derde gebruikt een waardegegeven of
      de daarbij behorende temporele en meta-kenmerken uitsluitend bij de uitoefening van de hem verleende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40a
  - number: 40a.3
    text: |-
      De bij de algemene maatregel van bestuur, bedoeld in het eerste lid, aangewezen derde is niet bevoegd een
      waardegegeven of de daarbij behorende temporele en meta-kenmerken verder bekend te maken dan noodzakelijk voor de
      uitoefening van de hem verleende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40a
  - number: 40b.1
    text: |-
      Eenieder kan op verzoek het waardegegeven van een bepaalde onroerende zaak die in hoofdzaak tot woning dient,
      inzien of verstrekt krijgen bij het loket voor openbare WOZ-waarden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40b
  - number: 40b.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen, onder welke voorwaarden en tegen welk tarief
      een verzameling van waardegegevens betreffende onroerende zaken die in hoofdzaak tot woning dienen verstrekt kan
      worden via het loket voor openbare WOZ-waarden in een zodanige vorm dat daarop rechtstreeks een geautomatiseerde
      verwerking mogelijk is ten aanzien van een op voorhand onbepaalde groep van woningen of personen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel40b
  - number: '44'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in aanvulling op de in de wet geregelde onderwerpen nadere
      regels worden gesteld met betrekking tot de uitvoering van de wet en de regelingen ingevolge de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel44
  - number: '46'
    text: Deze wet treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet waardering onroerende zaken.'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel47
