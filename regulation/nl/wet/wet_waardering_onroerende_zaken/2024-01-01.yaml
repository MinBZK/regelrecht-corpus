        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 30a.5
    text: Vorderingen tot uitbetaling als bedoeld in het vierde lid zijn niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel30a
  - number: '31.1'
    text: |-
      Met betrekking tot de toepassing van [de hoofdstukken III][ref1] en [IV][ref2] kunnen bij algemene maatregel van
      bestuur:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 31.1.a
    text: |-
      regels worden gesteld waarbij de [artikelen 48][ref1],
      __REF001___________________________________________________________________________________________________________
      _______________, [53, eerste en vierde lid](onbekend), en [55 van de Algemene wet inzake rijksbelastingen]
      (onbekend) geheel of gedeeltelijk van toepassing worden verklaard, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 31.1.b
    text: |-
      regels worden gesteld die overeenkomen met die in de in [onderdeel ][ref1] genoemde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel31
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '31'
        hoofdstuk: V
  - number: '31.2'
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang de aard van
      de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de aard van de
      gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging beschikbaar
      stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel31
  - number: '32'
    text: |-
      De afnemers kunnen aan het college de gegevens en inlichtingen verschaffen welke van belang kunnen zijn voor een
      juiste uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel32
  - number: 32a
    text: |-
      Gemeenten zijn gehouden elkaar desgevraagd kosteloos gegevens en inlichtingen te verschaffen die van belang kunnen
      zijn voor de uitvoering van de wet. Bij of krachtens algemene maatregel van bestuur kunnen hiervoor nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel32a
  - number: '33.1'
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: 33.1.a
    text: |-
      ingevolge het bepaalde bij of krachtens de wet verplicht zijnde tot het verstrekken van inlichtingen, gegevens of
      aanwijzingen, geen, onjuiste of onvolledige inlichtingen, gegevens of aanwijzingen verstrekt;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: 33.1.b
    text: |-
      ingevolge het bepaalde bij of krachtens de wet verplicht zijnde tot het voor raadpleging beschikbaar stellen
      van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, geen, valse of vervalste gegevensdragers,
      voor raadpleging beschikbaar stelt, dan wel de inhoud daarvan niet, in valse of vervalste vorm, voor dit doel
      beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: 33.1.c
    text: |-
      ingevolge het bepaalde bij of krachtens de wet verplicht zijnde tot het voeren van een administratie overeenkomstig
      de daaraan bij of krachtens de wet gestelde eisen, een zodanige administratie niet voert;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: 33.1.d
    text: |-
      ingevolge het bepaalde bij of krachtens de wet verplicht zijnde tot het bewaren van boeken, bescheiden of andere
      gegevensdragers, deze gegevensdragers niet bewaart;
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: '33.2'
    text: |-
      Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
  - number: '33.3'
    text: |-
      Degene die niet voldoet aan de hem bij de [artikelen 49][ref1], tweede lid, en
      [50, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] opgelegde verplichtingen, wordt gestraft met
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel50
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '50'
  - number: '34'
    text: |-
      Overtreding van de krachtens de wet bij algemene maatregel van bestuur gestelde bepalingen wordt, voor zover die
      overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel34
  - number: '35'
    text: |-
      Overtreding van de krachtens de wet bij ministeriële regeling gestelde algemene voorschriften wordt, voor zover die
      overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel35
  - number: '36'
    text: |-
      De bij de wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij of
      krachtens de wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0007119/2024-01-01#Artikel36
  - number: '37'
    text: |-
      De [artikelen 73][ref1], [77][ref2], [78][ref3], [80][ref4], [eerste lid][ref5], [81][ref6], [83][ref7], [85][ref8]
      en [88 van de Algemene wet inzake rijksbelastingen][ref9] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel77
