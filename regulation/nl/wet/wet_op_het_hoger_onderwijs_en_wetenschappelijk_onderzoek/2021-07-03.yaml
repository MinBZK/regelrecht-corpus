  - number: '19.1'
    text: |-
      Onze Minister brengt vijf jaren na de inwerkingtreding van deze wet verslag uit over de werking ervan aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel19.1
  - number: 19.1a
    text: |-
      Onze Minister zendt binnen vijf jaar na de *inwerkingtreding* van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      [artikel 7.52, negende tot en met twaalfde lid][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel19.1a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel19.2
  - number: '19.3'
    text: Deze wet kan worden aangehaald als "Wet op het hoger onderwijs en wetenschappelijk onderzoek".
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel19.3
