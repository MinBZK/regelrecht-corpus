  - number: 7.3d.2
    text: |-
      Voor de naleving van andere dan de in het eerste lid bedoelde voorschriften op grond van deze wet die betrekking
      hebben op een opleiding of een afstudeerrichting leggen de betrokken instellingsbesturen in een overeenkomst vast
      welk instellingsbestuur daarvoor verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3d
  - number: 7.3e.1
    text: |-
      Als een student of een aspirant-student zich voor een gezamenlijke opleiding of een gezamenlijke afstudeerrichting
      bij een Nederlandse instelling voor hoger onderwijs laat inschrijven, draagt die instelling er zorg voor dat die
      student ook wordt ingeschreven bij de andere betrokken Nederlandse instelling of instellingen voor hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3e
  - number: 7.3e.2
    text: |-
      In geval van een gezamenlijke opleiding of een gezamenlijke afstudeerrichting met een of meer buitenlandse
      instellingen voor hoger onderwijs kan het instellingsbestuur een student of een aspirant-student verplichten zich
      gedurende die opleiding of die afstudeerrichting onafgebroken bij de Nederlandse instelling of instellingen voor
      hoger onderwijs in te schrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3e
  - number: 7.3f.1
    text: |-
      Het bestuur van de betrokken Nederlandse instelling voor hoger onderwijs is ten aanzien van studenten die zich
      hebben ingeschreven bij een gezamenlijke opleiding of een gezamenlijke afstudeerrichting met een buitenlandse
      instelling, bevoegd het collegegeld op nihil te stellen dan wel lager vast te stellen dan het bedrag van het
      collegegeld bedoeld in [artikel 7.45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3f.2
    text: |-
      [Artikel 7.46, tweede lid, tweede volzin][ref1], is van overeenkomstige toepassing op de vaststelling van het
      collegegeld, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3g
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden vastgesteld ter uitvoering van de
      [artikelen 7.3c tot en met 7.3f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3g
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.3h
    text: |-
      Een student die is ingeschreven voor een opleiding in het wetenschappelijk onderwijs, kan, zelf uit
      onderwijseenheden die door een instelling worden verzorgd, een programma samenstellen waaraan een examen is
      verbonden. Indien nodig wijst het instellingsbestuur een examencommissie aan die met de in de eerste volzin
      bedoelde beslissing is belast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3h
  - number: 7.4.1
    text: |-
      De studielast van elke opleiding en elke onderwijseenheid wordt door het instellingsbestuur uitgedrukt in
      studiepunten. De studielast voor een studiejaar bedraagt zestig studiepunten. Zestig studiepunten is gelijk aan
      1680 uren studie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4
  - number: 7.4.2
    text: |-
      Een opleiding wordt zodanig ingericht dat een student in staat is het aantal studiepunten te behalen waarop de
      studielast voor een studiejaar gebaseerd is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4
  - number: 7.4.3
    text: Het instellingsbestuur bepaalt de jaarlijkse studielast van deeltijdopleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4
  - number: 7.4a.1
    text: |-
      De studielast van een bacheloropleiding in het wetenschappelijk onderwijs bedraagt 180 studiepunten. In afwijking
      van de eerste volzin kan de studielast van een bacheloropleiding in het wetenschappelijk onderwijs ten hoogste 240
      studiepunten bedragen, indien Onze Minister voor die opleiding daartoe een besluit heeft genomen dat gebaseerd is
      op het accreditatierapport van die opleiding. In het besluit, bedoeld in de tweede volzin, wordt de studielast van
      de opleiding bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.2
    text: |-
      Behoudens het bepaalde in het derde tot en met zevende lid bedraagt de studielast van een masteropleiding in het
      wetenschappelijk onderwijs 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.3
    text: |-
      De studielast van de masteropleidingen tot leraar voor de periode van voorbereidend hoger onderwijs in vakken
      van voortgezet onderwijs bedraagt ten minste 60 studiepunten en ten hoogste 120 studiepunten. In afwijking van de
      eerste volzin bedraagt de studielast van door Onze Minister aan te wijzen opleidingen als bedoeld in die volzin
      ten minste 120 studiepunten en ten hoogste 180 studiepunten. Het instellingsbestuur bepaalt de studielast van de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.4
    text: |-
      De studielast van de masteropleiding voor het beroep van wijsgeer van een bepaald wetenschapsgebied bedraagt 120
      studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.5
    text: |-
      De studielast van de door Onze Minister aan te wijzen masteropleidingen in het wetenschappelijk onderwijs bedraagt
      120 studiepunten. Onze Minister kan bepalen dat de studielast van de masteropleidingen in het wetenschappelijk
      onderwijs die mede zijn gericht op een levensbeschouwelijk ambt of beroep, 180 studiepunten bedraagt en dat de
      studielast van de masteropleidingen in het wetenschappelijk onderwijs met een buitenlandse instelling als bedoeld
      in [artikel 7.3c][ref1] 90 studiepunten bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4a.6
    text: |-
      De studielast van de masteropleidingen voor het beroep van arts, voor het beroep van dierenarts, voor het beroep
      van apotheker, voor het beroep van tandarts en voor het beroep van klinisch technoloog bedraagt 180 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.7
    text: De studielast van de masteropleidingen geneeskunde, klinisch onderzoeker bedraagt 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4a.8
    text: |-
      Het instellingsbestuur kan bepalen dat een opleiding als bedoeld in het tweede lid een grotere studielast heeft dan
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4a
  - number: 7.4b.1
    text: De studielast van een associate degree-opleiding bedraagt 120 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.2
    text: De studielast van een bacheloropleiding in het hoger beroepsonderwijs bedraagt 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.3
    text: De studielast van een masteropleiding in het hoger beroepsonderwijs bedraagt 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.4
    text: |-
      De studielast van de masteropleidingen op het gebied van de kunst bedraagt ten minste 60 studiepunten en ten
      hoogste 120 studiepunten. Het instellingsbestuur bepaalt de studielast van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.5
    text: |-
      De studielast van de masteropleidingen tot leraar voortgezet onderwijs van de eerste graad in algemene vakken
      bedraagt 90 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.6
    text: De studielast van de masteropleidingen advanced nurse practitioner bedraagt 120 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.7
    text: De studielast van de masteropleidingen physician assistant bedraagt 150 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.8
    text: De studielast van de masteropleidingen op het gebied van de bouwkunst bedraagt 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.4b.9
    text: |-
      Het instellingsbestuur kan bepalen dat een opleiding als bedoeld in het eerste lid een grotere studielast heeft dan
      120 studiepunten en een opleiding als bedoeld in het derde lid een grotere studielast heeft dan 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.4b
  - number: 7.6.1
    text: |-
      Indien een instelling een opleiding aanbiedt, gericht op een bepaald beroep, en bij of krachtens de wet vereisten
      zijn gesteld ten aanzien van de kennis, het inzicht en de vaardigheden die betrokkenen zich op grond van de
      opleiding tot dat beroep moeten hebben verworven, draagt het instellingsbestuur er zorg voor dat degenen die deze
      opleiding volgen, ten minste in de gelegenheid zijn aan die vereisten te voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.6
  - number: 7.6.2
    text: |-
      Tot de in het eerste lid bedoelde vereisten behoren die welke ten aanzien van artsen, verpleegkundigen,
      verloskundigen, tandartsen, dierenartsen, architecten en apothekers zijn neergelegd in richtlijn nr. 2005/36/
      EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005 betreffende de erkenning van
      beroepskwalificaties (PbEU L 255).
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.6
  - number: 7.6.3
    text: |-
      Opleidingen die in het bijzonder zijn gericht op bepaalde beroepen omvatten in elk geval een praktische
      voorbereiding op de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.6
  - number: 7.6.4
    text: |-
      Het eerste en derde lid zijn van overeenkomstige toepassing ten aanzien van opleidingen die leiden tot een
      getuigschrift als bedoeld in [artikel 33, lid 1a, van de Wet op het voortgezet onderwijs][ref1] en als bedoeld in
      [artikel 80, derde lid, van de Wet voortgezet onderwijs BES](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
  - number: 7.7.1
    text: |-
      Opleidingen aan bekostigde instellingen kunnen voltijds, deeltijds of duaal zijn ingericht en worden alsdan
      aangeduid als voltijdse, deeltijdse onderscheidenlijk duale opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.2
    text: |-
      Een duale opleiding is zodanig ingericht dat het volgen van onderwijs gedurende een of meer perioden wordt
      afgewisseld met beroepsuitoefening in verband met dat onderwijs. Deze beroepsuitoefening vindt in het
      wetenschappelijk onderwijs niet plaats gedurende de propedeutische fase van een bacheloropleiding of, indien die
      fase niet is ingesteld, gedurende de eerste periode in die opleiding met een studielast van 60 studiepunten. Het
      gedeelte van een duale opleiding dat bestaat uit het volgen van onderwijs, wordt aangeduid als onderwijsdeel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.3
    text: |-
      De studielast van het deel van de duale opleiding dat wordt gevormd door de beroepsuitoefening in verband met het
      onderwijs, bedraagt een door het instellingsbestuur in de onderwijs- en examenregeling te beargumenteren aantal
      studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.4
    text: 'In de onderwijs- en examenregeling wordt voor een duale opleiding aangegeven:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.4.a
    text: de minimale studielast van het onderwijsdeel,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.4.b
    text: |-
      de tijdsduur van de periode of de gezamenlijke tijdsduur van de perioden die ten minste in de beroepsuitoefening
      wordt doorgebracht, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.4.c
    text: de minimale studielast van het deel van de opleiding dat wordt gevormd door de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.5
    text: |-
      De beroepsuitoefening binnen een duale opleiding vindt plaats op basis van een overeenkomst, gesloten door de
      instelling, de student en het desbetreffend bedrijf of de desbetreffende organisatie. De overeenkomst regelt de
      rechten en verplichtingen van partijen en omvat met inachtneming van het dienaangaande bij of krachtens deze wet
      bepaalde ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.5.a
    text: de duur van de overeenkomst en de tijdsduur van de periode of perioden van de beroepsuitoefening,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.5.b
    text: de begeleiding van de student,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.7.5.c
    text: |-
      dat deel van de kwaliteiten, bedoeld in [artikel 7.13, tweede lid, onder c][ref1], dat de student tijdens de
      periode of de perioden van beroepsuitoefening dient te realiseren, en de beoordeling daarvan, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.7.5.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.7
  - number: 7.8.1
    text: |-
      Het instellingsbestuur kan in een bacheloropleiding in het wetenschappelijk onderwijs een propedeutische fase
      instellen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8
  - number: 7.8.2
    text: |-
      Een bacheloropleiding in het hoger beroepsonderwijs omvat een propedeutische fase, die voor studenten als bedoeld
      in artikel 7.9a, eerste en tweede lid, een afwijkende inhoud kan hebben.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8
  - number: 7.8.3
    text: |-
      Aan de propedeutische fase is, voorzover in de onderwijs- en examenregeling niet anders is bepaald, een
      propedeutisch examen verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8
  - number: 7.8.4
    text: |-
      De studielast van de propedeutische fase waaraan een propedeutisch examen is verbonden, bedraagt 60 studiepunten.
      De studielast van de propedeutische fase van een duale bacheloropleiding bedraagt 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8
  - number: 7.8.5
    text: |-
      De propedeutische fase wordt met het oog op de toepassing van [artikel 7.8b][ref1] zodanig ingericht dat er sprake
      is van het verkrijgen van inzicht in de inhoud van de bacheloropleiding met de mogelijkheid van verwijzing en
      selectie aan het eind van die fase.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.8a.1
    text: |-
      Onze Minister kan op aanvraag van een instellingsbestuur goedkeuren dat een deel van
      een associate degree-opleiding wordt uitgevoerd door een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] dan wel een andere instelling voor
      beroepsonderwijs als bedoeld in [artikel 1.4.1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 7.8a.2
    text: |-
      Indien Onze Minister goedkeuring als bedoeld in het eerste lid verleent, wordt ten minste de helft van de associate
      degree-opleiding, waaronder in ieder geval de afstudeerfase en het afsluitend examen, verzorgd door de instelling
      voor hoger onderwijs. Op verzoek van het instellingsbestuur kan Onze Minister in bijzondere gevallen toestaan dat
      minder dan de helft van een dergelijke opleiding, met uitzondering van de afstudeerfase en het afsluitend examen,
      door de instelling voor hoger onderwijs wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8a
  - number: 7.8a.3
    text: |-
      Voor zover de associate degree-opleiding wordt uitgevoerd door een andere instelling voor beroepsonderwijs als
      bedoeld in [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref1] is [artikel 7.34, vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.8b.1
    text: |-
      Het instellingsbestuur van een bekostigde universiteit, hogeschool of levensbeschouwelijke universiteit brengt
      iedere student uiterlijk aan het einde van diens eerste jaar van inschrijving voor de propedeutische fase van
      een voltijdse of duale associate degree-opleiding of bacheloropleiding advies uit over de voortzetting van
      zijn studie binnen of buiten de associate degree-opleiding of de bacheloropleiding. In geval van een deeltijdse
      associate degree-opleiding of bacheloropleiding regelt het instellingsbestuur het tijdstip waarop dat advies wordt
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.2
    text: |-
      Onverminderd het eerste lid kan het instellingsbestuur het advies aan de student uitbrengen zolang deze het
      propedeutisch examen niet met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.3
    text: |-
      Aan een advies als bedoeld in het eerste of tweede lid kan het instellingsbestuur ten aanzien van opleidingen
      die daartoe door het instellingsbestuur zijn aangewezen, binnen het in het tweede lid bedoelde tijdvak, doch
      niet eerder dan tegen het einde van het eerste jaar van inschrijving, een afwijzing verbinden. Deze afwijzing kan
      slechts worden gegeven, indien de student naar het oordeel van het instellingsbestuur, met inachtneming van zijn
      persoonlijke omstandigheden, niet geschikt moet worden geacht voor de opleiding, doordat zijn studieresultaten
      niet voldoen aan de vereisten die het bestuur daaromtrent heeft vastgesteld. Het instellingsbestuur kan aan de
      afwijzing een termijn verbinden. Het instellingsbestuur kan de afwijzing uitstrekken tot opleidingen die met de
      desbetreffende opleiding het propedeutisch examen gemeen hebben. Het instellingsbestuur kan van de bevoegdheid
      krachtens dit lid slechts gebruikmaken, indien het in de propedeutische fase van de desbetreffende opleiding zorgt
      voor zodanige voorzieningen dat de mogelijkheden voor goede studievoortgang zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.4
    text: |-
      Voordat het instellingsbestuur tot afwijzing overgaat, geeft het de desbetreffende student een waarschuwing
      onder bepaling van een redelijke termijn waarbinnen de studieresultaten ten genoegen van dat bestuur moeten zijn
      verbeterd. Het instellingsbestuur stelt de student alvorens tot een afwijzing over te gaan in de gelegenheid te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.5
    text: |-
      Van de student die op grond van het derde lid is afgewezen, wordt de inschrijving voor de desbetreffende opleiding
      aan de betrokken instelling beëindigd. De student kan niet opnieuw aan die instelling voor die opleiding worden
      ingeschreven, tenzij het instellingsbestuur toepassing heeft gegeven aan de derde volzin van het derde lid of
      tenzij de betrokkene op een later tijdstip verzoekt om te worden ingeschreven voor de desbetreffende opleiding
      en daarbij ten genoegen van het instellingsbestuur aannemelijk maakt dat hij die opleiding met vrucht zal kunnen
      volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.6
    text: |-
      Het instellingsbestuur stelt ter uitvoering van de voorgaande leden nadere regels vast. Deze regels hebben in
      elk geval betrekking op de studieresultaten en de voorzieningen, bedoeld in het derde lid, alsmede op de termijn,
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.7
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke persoonlijke omstandigheden, bedoeld in het derde lid, het
      instellingsbestuur in zijn beoordeling betrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.8b.8
    text: |-
      Voor de toepassing van dit artikel wordt onder «propedeutische fase» mede begrepen de eerste periode in een
      associate degree-opleiding of een bacheloropleiding in het wetenschappelijk onderwijs met een studielast van 60
      studiepunten. Voor de toepassing van dit artikel worden onder «propedeutisch examen» mede begrepen de tentamens,
      verbonden aan onderwijseenheden in de eerste periode in een associate degree-opleiding of een bacheloropleiding in
      het wetenschappelijk onderwijs met een gezamenlijke studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.8b
  - number: 7.9.1
    text: |-
      Indien een bacheloropleiding na de propedeutische fase meer dan een afstudeerrichting omvat, kan het
      instellingsbestuur ten aanzien van opleidingen die daartoe door het instellingsbestuur zijn aangewezen, beslissen
      dat een voor die opleiding ingeschreven student slechts toegang heeft tot een of meer daarbij aan te geven
      afstudeerrichtingen. Het instellingsbestuur kan van de bevoegdheid krachtens dit lid slechts gebruikmaken, indien
      de aard en inhoud van de verschillende afstudeerrichtingen van de opleiding zodanig van elkaar verschillen dat
      toepassing van deze bevoegdheid gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.2
    text: 'Bij de toepassing van het eerste lid baseert het instellingsbestuur zijn beslissing:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.2.a
    text: op de studieresultaten van de student,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.2.b
    text: op het door de student gevolgde studieprogramma, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.2.c
    text: op een combinatie van a en b.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.3
    text: |-
      Bij de weging van de studieresultaten, bedoeld in het tweede lid, onder a en c, houdt het instellingsbestuur
      rekening met de persoonlijke omstandigheden van de student. Bij algemene maatregel van bestuur wordt bepaald welke
      persoonlijke omstandigheden het instellingsbestuur in zijn beoordeling betrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.4
    text: |-
      Bij de weging van het studieprogramma van de student, bedoeld in het tweede lid, onder b en c, beoordeelt het
      instellingsbestuur of de door de student gekozen programmaonderdelen van de opleiding voldoende aansluiten op de
      door de student gewenste afstudeerrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.5
    text: |-
      Het instellingsbestuur stelt ter uitvoering van dit artikel nadere regels vast. Deze regels hebben in elk geval
      betrekking op het verschil in afstudeerrichtingen, bedoeld in het eerste lid, op de studieresultaten, bedoeld in
      het derde lid, en op de aansluiting van programmaonderdelen en de afstudeerrichtingen van de opleiding, bedoeld in
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9.6
    text: |-
      Voor de toepassing van dit artikel wordt onder «propedeutische fase» mede begrepen de eerste periode in een
      bacheloropleiding in het wetenschappelijk onderwijs met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9
  - number: 7.9a.1
    text: |-
      Een instellingsbestuur kan binnen een bacheloropleiding in het hoger beroepsonderwijs een
      versneld traject aanbieden dat toegankelijk is voor studenten met een diploma als bedoeld in
      [artikel 7.24, tweede lid, onder a of b][ref1] dan wel een op grond van [artikel 7.28, tweede lid][ref2],
      bij ministeriële regeling als ten minste gelijkwaardig aangemerkt onderscheidenlijk naar het oordeel van het
      instellingsbestuur daaraan tenminste gelijkwaardig diploma. Een student die aan de in de eerste zin bedoelde
      voorwaarde en de overige voorwaarden voor inschrijving voldoet, wordt voor een versneld traject ingeschreven indien
      hij daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.9a.2
    text: |-
      Het instellingsbestuur kan besluiten ook een andere student dan degene, bedoeld in het eerste lid, tot het
      versnelde traject toe te laten indien hij naar het oordeel van het instellingsbestuur blijk heeft gegeven van
      geschiktheid voor dat traject.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9a
  - number: 7.9a.3
    text: |-
      In afwijking van [artikel 7.4b, tweede lid][ref1], bedraagt de studielast voor een versneld traject 180
      studiepunten. Het instellingsbestuur kan in bijzondere, door het instellingsbestuur vast te stellen en toe te
      lichten, gevallen bepalen dat de studielast voor een versneld traject 240 studiepunten bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.9b.1
    text: |-
      Indien een instellingsbestuur binnen een opleiding een speciaal traject aanbiedt, dat is gericht op het behalen van
      een hoger kennisniveau van studenten, kan het instellingsbestuur daarvoor studenten selecteren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9b
  - number: 7.9b.2
    text: Het instellingsbestuur stelt regels vast met betrekking tot de selectie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9b
  - number: 7.9d
    text: |-
      Het instellingsbestuur doet voor het einde van de tweede maand volgend op de maand waarin een student, bedoeld
      in [artikel 5.7 van de Wet studiefinanciering 2000][ref1], het afsluitend examen met goed gevolg heeft afgelegd,
      daarvan mededeling aan Onze Minister. Het stuurt gelijktijdig met die mededeling bericht van het verzenden daarvan
      aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.9d
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 7.10.1
    text: |-
      Elk tentamen omvat een onderzoek naar de kennis, het inzicht en de vaardigheden van de examinandus, alsmede de
      beoordeling van de uitkomsten van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10
  - number: 7.10.2
    text: |-
      Indien de tentamens van de tot een opleiding of propedeutische fase van een bacheloropleiding behorende
      onderwijseenheden met goed gevolg zijn afgelegd, is het examen afgelegd, voorzover de examencommissie niet heeft
      bepaald dat het examen tevens omvat een door haar zelf te verrichten onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10
  - number: 7.10.3
    text: Het instellingsbestuur is verantwoordelijk voor de praktische organisatie van tentamens en examens.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10
  - number: 7.10.4
    text: |-
      Het instellingsbestuur kan de geldigheidsduur van met goed gevolg afgelegde tentamens beperken, behoudens de
      bevoegdheid van de examencommissie die geldigheidsduur in een individueel geval te verlengen. De geldigheidsduur
      van een met goed gevolg afgelegd tentamen kan uitsluitend worden beperkt, indien de getentamineerde kennis of het
      getentamineerde inzicht aantoonbaar verouderd is, of indien de getentamineerde vaardigheden aantoonbaar verouderd
      zijn. Het instellingsbestuur stelt nadere regels vast omtrent de uitvoering van dit lid en over de wijze waarop bij
      het beperken van de geldigheidsduur in redelijkheid rekening wordt gehouden met bijzondere omstandigheden in de zin
      van [artikel 7.51, tweede lid][ref1]. De geldigheidsduur van met goed gevolg afgelegde tentamens wordt in geval van
      bijzondere omstandigheden als bedoeld in artikel 7.51, tweede lid, ten minste verlengd met de duur van de op grond
      van artikel 7.51, eerste lid, toegekende financiële ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.10a.1
    text: |-
      Het instellingsbestuur verleent de graad Bachelor aan degene die in het wetenschappelijk onderwijs met
      goed gevolg het afsluitend examen van een bacheloropleiding heeft afgelegd en de graad Master aan degene
      die het afsluitende examen van een masteropleiding of een postinitiële masteropleiding als bedoeld in
      [artikel 7.3b, onderdeel a][ref1], heeft afgelegd. Afhankelijk van het vakgebied waarin het met goed gevolg
      afgelegde afsluitend examen van een bacheloropleiding, een masteropleiding of postinitiële masteropleiding is
      afgelegd, wordt aan de verleende graad toegevoegd «of Arts» dan wel «of Science». Bij ministeriële regeling kan
      voor een opleiding of een groep van opleidingen een andere toevoeging worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.10a.2
    text: |-
      Het instellingsbestuur verleent de graad Associate degree, aan degene die in het hoger beroepsonderwijs met goed
      gevolg het afsluitend examen van een associate degree-opleiding heeft afgelegd, de graad Bachelor aan degene die
      in het hoger beroepsonderwijs met goed gevolg het afsluitend examen van een bacheloropleiding heeft afgelegd en de
      graad Master aan degene die in het hoger beroepsonderwijs met goed gevolg een masteropleiding of een postinitiële
      masteropleiding als bedoeld in [artikel 7.3b, onderdeel b][ref1], heeft afgelegd. Afhankelijk van het vakgebied
      waarin het met goed gevolg afgelegde afsluitend examen van een bacheloropleiding, een masteropleiding of een
      postinitiële masteropleiding is afgelegd, wordt aan de verleende graad de toevoeging verbonden die op grond van
      [artikel 5.7, vierde lid, onderdeel b][ref2], met positief resultaat is getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 7.10a.3
    text: |-
      Het instellingsbestuur kan de graad Associate degree en de graad Bachelor of Master en de toevoeging daaraan
      aanvullen met de vermelding van het vakgebied of het beroepenveld waarop de graad betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.10a
  - number: 7.11.1
    text: |-
      Ten bewijze dat een tentamen met goed gevolg is afgelegd, wordt door de desbetreffende examinator of examinatoren
      een daarop betrekking hebbend bewijsstuk uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.2
    text: |-
      Ten bewijze dat het examen met goed gevolg is afgelegd, wordt door de examencommissie een getuigschrift uitgereikt,
      nadat het instellingsbestuur heeft verklaard dat aan de procedurele eisen voor de afgifte is voldaan. Per opleiding
      wordt één getuigschrift uitgereikt. De examencommissie is bevoegd in samenwerking met een of meer Nederlandse of
      buitenlandse instellingen voor hoger onderwijs een gezamenlijk getuigschrift uit te reiken. Op het getuigschrift
      van het met goed gevolg afgelegde examen worden relevante gegevens vermeld, waaronder in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.2.a
    text: |-
      de naam van de instelling en welke opleiding het betreft, zoals vermeld in het register, bedoeld in
      [artikel 6.13][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.11.2.b
    text: welke onderdelen het examen omvatte,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.2.c
    text: |-
      in voorkomende gevallen welke bevoegdheid daaraan is verbonden, rekening houdend met
      [artikel 7.6, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.11.2.d
    text: |-
      welke graad is verleend, in overeenstemming met de opleidingsgegevens in het Centraal register opleidingen hoger
      onderwijs, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.2.e
    text: |-
      wanneer aan de opleiding accreditatie nieuwe opleiding dan wel accreditatie bestaande opleiding is verleend
      en wanneer het behoud van accreditatie bestaande opleiding voor het laatst is bevestigd als bedoeld in
      [artikel 5.16, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 7.11.2.f
    text: |-
      indien het getuigschrift een gezamenlijke opleiding of een gezamenlijke afstudeerrichting als bedoeld in
      [artikel 7.3c][ref1] betreft, de naam van de instelling of instellingen die de gezamenlijke opleiding of de
      gezamenlijke afstudeerrichting mede heeft of hebben verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.11.3
    text: |-
      Degene die aanspraak heeft op uitreiking van een getuigschrift, kan overeenkomstig door het instellingsbestuur vast
      te stellen regels de examencommissie verzoeken daartoe nog niet over te gaan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.4
    text: |-
      De examencommissie voegt aan een getuigschrift van het met goed gevolg afgelegde afsluitend examen, een supplement
      toe. Het supplement heeft tot doel inzicht te verschaffen in de aard en inhoud van de afgeronde opleiding, mede met
      het oog op internationale herkenbaarheid van opleidingen. Het supplement bevat in elk geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.4.a
    text: de naam van de opleiding en de instelling die de opleiding verzorgt,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.4.b
    text: of het een opleiding in het wetenschappelijk onderwijs dan wel een opleiding in het hoger beroepsonderwijs betreft,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.4.c
    text: een beschrijving van de inhoud van de opleiding, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.4.d
    text: de studielast van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.11.5
    text: |-
      Degene die meer dan een tentamen met goed gevolg heeft afgelegd en aan wie geen getuigschrift als bedoeld in het
      tweede lid kan worden uitgereikt, ontvangt desgevraagd een door de desbetreffende examencommissie af te geven
      verklaring waarin in elk geval de tentamens zijn vermeld die door hem met goed gevolg zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.11
  - number: 7.12.1
    text: Elke opleiding of groep van opleidingen aan de instelling heeft een examencommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12
  - number: 7.12.2
    text: |-
      De examencommissie is het orgaan dat op objectieve en deskundige wijze vaststelt of een student voldoet aan de
      voorwaarden die de onderwijs- en examenregeling stelt ten aanzien van kennis, inzicht en vaardigheden die nodig
      zijn voor het verkrijgen van een graad als bedoeld in [artikel 7.10a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12a.1
    text: |-
      Het instellingsbestuur stelt de examencommissie in en benoemt de leden op basis van hun deskundigheid op het
      terrein van de desbetreffende opleiding of groep van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.2
    text: |-
      Het instellingsbestuur draagt er zorg voor dat het onafhankelijk en deskundig functioneren van de examencommissie
      voldoende wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.3
    text: 'Bij de benoeming van de leden van de examencommissie draagt het instellingsbestuur er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.3.a
    text: |-
      ten minste één lid als docent verbonden is aan de desbetreffende opleiding of aan een van de opleidingen die tot de
      groep van opleidingen behoort;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.3.b
    text: |-
      ten minste één lid afkomstig is van buiten de desbetreffende opleiding of een van de opleidingen die tot de groep
      van opleidingen behoort;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.3.c
    text: |-
      leden van het instellingsbestuur of personen die anderszins financiële verantwoordelijkheid dragen binnen de
      instelling niet worden benoemd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12a.4
    text: |-
      Alvorens tot benoeming van een lid over te gaan, hoort het instellingsbestuur de leden van de desbetreffende
      examencommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12a
  - number: 7.12b.1
    text: |-
      Naast de taken en bevoegdheden, bedoeld in de [artikelen 7.11][ref1] en [7.12, tweede lid][ref2], heeft een
      examencommissie de volgende taken en bevoegdheden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12b.1.a
    text: |-
      het borgen van de kwaliteit van de tentamens en examens onverminderd [artikel 7.12c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12b.1.b
    text: |-
      het vaststellen van richtlijnen en aanwijzingen binnen het kader van de onderwijs- en examenregeling, bedoeld in
      [artikel 7.13][ref1], om de uitslag van tentamens en examens te beoordelen en vast te stellen,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12b.1.c
    text: |-
      het door de meest daarvoor in aanmerking komende examencommissie verlenen van toestemming aan een student om een
      door die student samengesteld programma als bedoeld in [artikel 7.3h][ref1] te volgen, waarvan het examen leidt tot
      het verkrijgen van een graad, waarbij de examencommissie tevens aangeeft tot welke opleiding van de instelling dat
      programma wordt geacht te behoren voor de toepassing van deze wet,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12b.1.d
    text: het verlenen van vrijstelling voor het afleggen van één of meer tentamens, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12b.1.e
    text: het borgen van de kwaliteit van de organisatie en de procedures rondom tentamens en examens.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12b.2
    text: |-
      Indien een student of extraneus fraudeert, kan de examencommissie de betrokkene het recht ontnemen één of meer
      door de examencommissie aan te wijzen tentamens of examens af te leggen, gedurende een door de examencommissie
      te bepalen termijn van ten hoogste een jaar. Bij ernstige fraude kan het instellingsbestuur op voorstel van de
      examencommissie de inschrijving voor de opleiding van de betrokkene definitief beëindigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12b.3
    text: |-
      De examencommissie stelt regels vast over de uitvoering van de taken en bevoegdheden, bedoeld in het eerste
      lid, onderdelen a, b en d, en het tweede lid, en over de maatregelen die zij in dat verband kan nemen. De
      examencommissie kan onder door haar te stellen voorwaarden bepalen dat niet ieder tentamen met goed gevolg afgelegd
      hoeft te zijn om vast te stellen dat het examen met goed gevolg is afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12b.4
    text: |-
      Indien een student bij de examencommissie een verzoek of een klacht indient waarbij een examinator betrokken is
      die lid is van de examencommissie, neemt de betrokken examinator geen deel aan de behandeling van het verzoek of
      de klacht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12b.5
    text: |-
      De examencommissie stelt jaarlijks een verslag op van haar werkzaamheden. De examencommissie verstrekt het verslag
      aan het instellingsbestuur of de decaan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12b
  - number: 7.12c.1
    text: Voor het afnemen van tentamens en het vaststellen van de uitslag daarvan wijst de examencommissie examinatoren aan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12c
  - number: 7.12c.2
    text: De examinatoren verstrekken de examencommissie de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.12c
  - number: 7.13.1
    text: |-
      Het instellingsbestuur stelt voor elke door de instelling aangeboden opleiding of groep van opleidingen een
      onderwijs- en examenregeling vast. De onderwijs- en examenregeling bevat adequate en heldere informatie over de
      opleiding of groep van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2
    text: |-
      In de onderwijs- en examenregeling worden, onverminderd het overigens in deze wet terzake bepaalde, per opleiding
      of groep van opleidingen de geldende procedures en rechten en plichten vastgelegd met betrekking tot het onderwijs
      en de examens. Daaronder worden ten minste begrepen:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.a
    text: de inhoud van de opleiding en van de daaraan verbonden examens,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.a1
    text: de wijze waarop het onderwijs in de desbetreffende opleiding wordt geëvalueerd,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.b
    text: de inhoud van de afstudeerrichtingen binnen een opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.c
    text: |-
      de kwaliteiten op het gebied van kennis, inzicht en vaardigheden die een student zich bij beëindiging van de
      opleiding moet hebben verworven,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.d
    text: waar nodig, de inrichting van praktische oefeningen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.e
    text: de studielast van de opleiding en van elk van de daarvan deel uitmakende onderwijseenheden,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.f
    text: |-
      de nadere regels, bedoeld in [de artikelen 7.8b, zesde lid][ref1], en [7.9, vijfde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
