        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '7'
  - number: 18.65.2
    text: |-
      Onze Minister draagt zorg voor de wijziging van de registratie van de opleidingen, bedoeld in het eerste lid, in
      het Centraal register opleidingen hoger onderwijs. Daarbij wordt vastgelegd dat die opleidingen in Tilburg worden
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.65
  - number: 18.66.1
    text: |-
      Aan de opleidingen die tot 1 juli 2006 werden verzorgd door de instelling, bedoeld in
      [artikel 16.21, eerste lid, onderdeel a, onder 2°][ref1], en met ingang van die datum worden verzorgd door de
      bijzondere universiteit te Tilburg, blijft de verleende accreditatie verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.66
    references:
