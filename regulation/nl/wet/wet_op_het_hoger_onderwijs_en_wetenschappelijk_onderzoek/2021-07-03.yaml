  - number: 18.66.2
    text: |-
      Onze Minister draagt zorg voor de wijziging van de registratie van de opleidingen, bedoeld in het eerste lid, in
      het Centraal register opleidingen hoger onderwijs. Daarbij wordt vastgelegd dat die opleidingen in Utrecht worden
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.66
  - number: '18.67'
    text: |-
      [Titel 3 van hoofdstuk 7][ref1] en [hoofdstuk 9][ref2] worden van toepassing op het instellingsbestuur van een
      levensbeschouwelijke universiteit als bedoeld in [artikel 1.3, tweede lid][ref3], en de betrokken studenten zes
      maanden na de inwerkingtreding van de artikelen van de wet van 4 februari 2010 (Stb. 119) die zien op de opheffing
      van de uitzonderingspositie van de levensbeschouwelijke universiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
