  - number: 1.13.1
    text: |-
      Bij elke in [artikel 1.8][ref1] bedoelde universiteit die een opleiding voor het beroep van arts verzorgt, is een
      academisch ziekenhuis. De academische ziekenhuizen zijn opgenomen in onderdeel j van de bijlage van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.13
