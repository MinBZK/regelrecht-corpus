  - number: 6.13.4.i
    text: |-
      of het een opleiding gericht op een bepaald beroep betreft, waarvoor bij of krachtens de wet vereisten zijn
      vastgesteld,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
  - number: 6.13.4.j
