  - number: 6.11.1
    text: |-
      Er is een commissie van advies die tot taak heeft om Onze Minister op diens verzoek advies te geven indien hij,
      vanwege het door een instelling niet nakomen van de verplichting het maatschappelijk verantwoordelijkheidsbesef
      van studenten te bevorderen als bedoeld in [artikel 1.3, vijfde lid, eerste en tweede volzin][ref1], overweegt
      een besluit te nemen om een verzoek als bedoeld in [artikel 6.9, eerste lid][ref2], af te wijzen of een besluit te
      nemen op grond van [artikel 6.5, eerste lid][ref3], [6.10, eerste lid][ref4], of [15.1, eerste lid][ref5], van deze
      wet dan wel op grond van [artikel 4:49 van de Algemene wet bestuursrecht][ref6].


