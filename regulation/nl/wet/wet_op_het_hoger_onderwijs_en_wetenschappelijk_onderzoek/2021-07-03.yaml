        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 2a
  - number: 6.9.5
    text: |-
      Indien door de in het eerste lid bedoelde rechtspersoon geen in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13][ref1], geregistreerde opleidingen meer worden verzorgd, naast een associate degree-
      opleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel a][ref2], niet langer een bacheloropleiding
      als bedoeld in artikel 7.3a, tweede lid, onderdeel b, of uitsluitend een opleiding in afbouw als bedoeld in
      [artikel 5.21, derde lid][ref3], wordt verzorgd dan wel door de rechtspersoon uitsluitend een opleiding in afbouw
      als bedoeld in artikel 5.21, derde lid, wordt verzorgd, kan deze rechtspersoon slechts opnieuw graden verlenen na
      toepassing van het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.9
