        hoofdstuk: '5'
  - number: 9.18.2
    text: |-
      Op een advies als bedoeld in het eerste lid, zijn [artikel 9.35, aanhef en onderdelen b, c en d][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.18
    references:
