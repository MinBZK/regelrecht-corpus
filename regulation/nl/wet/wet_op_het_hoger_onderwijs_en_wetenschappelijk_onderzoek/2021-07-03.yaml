        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 18.73.3
    text: |-
      Over beroepen die zijn ingesteld bij het college van beroep voor het hoger onderwijs oordeelt het college van
      beroep met inachtneming van de voorschriften van de artikelen waarop het beroep ziet zoals die golden voor de
      inwerkingtreding van de verschillende onderdelen van de wet van 4 februari 2010 (Stb. 119).
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.73
  - number: 18.74.1
    text: |-
      De colleges van beroep bijzonder onderwijs, zoals die bestonden op grond van [artikel 7.68][ref1] zoals die
      bepaling luidde op de dag voorafgaand aan de inwerkingtreding van artikel I, onderdeel CI, van de wet van 4
      februari 2010 (Stb. 119), blijven in stand tot ten hoogste een jaar na inwerkingtreding van artikel I, onderdeel
      CI, van de wet van 4 februari 2010 (Stb. 119). De behandeling van beroepen vindt plaats overeenkomstig artikel 7.68
      zoals dat luidde op de dag voor inwerkingtreding van artikel I, onderdeel CI, van de wet van 4 februari 2010 (Stb.
      119).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.74
    references:
