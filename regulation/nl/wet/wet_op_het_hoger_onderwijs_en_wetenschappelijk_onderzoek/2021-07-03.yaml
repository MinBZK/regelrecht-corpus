    text: |-
      de studielast waarbij ten aanzien van masteropleidingen is aangegeven of deze is vastgesteld van rechtswege, door
      het instellingsbestuur of, wat betreft masteropleidingen in het wetenschappelijk onderwijs, op zijn verzoek door
