  - number: 18.91.1
    text: |-
      Een lopend besluit toets nieuwe opleiding, genomen op grond van [artikel 5a.11][ref1] of [artikel 5a.13g][ref2],
      zoals die artikelen luidden op de dag voorafgaand aan de inwerkingtreding van de [Wet accreditatie op maat][ref3],
      onderscheidenlijk een lopend accreditatiebesluit, genomen op grond van [artikel 5a.9][ref4] of
      [artikel 5a.13f][ref5], zoals die artikelen luidden op de dag voorafgaand aan de inwerkingtreding van de Wet
      accreditatie op maat, onderscheidenlijk een lopend besluit toets nieuw Ad-programma, genomen op grond van
      [artikel 5a.13][ref6], zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van de Wet accreditatie op
      maat, wordt op het tijdstip van inwerkingtreding van de Wet accreditatie op maat omgezet in een accreditatie nieuwe
      opleiding als bedoeld in [artikel 5.8][ref7] onderscheidenlijk een accreditatie bestaande opleiding als bedoeld in
      [artikel 5.16][ref8] onderscheidenlijk een toets nieuw Ad-programma als bedoeld in [artikel 5.22][ref9].


