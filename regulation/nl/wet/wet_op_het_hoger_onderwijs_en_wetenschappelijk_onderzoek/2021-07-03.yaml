      Indien een instelling op grond van [artikel 1.12a][ref1], zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van artikel I, onderdeel L van de wet van 4 februari 2010 (Stb. 119) tevens postinitiële
      masteropleidingen verzorgt of een aanvraag voor een toets nieuwe opleiding voor een postinitiële masteropleiding
      heeft ingediend bij het accreditatieorgaan voor 1 september 2010, kan deze instelling overeenkomstig
      [artikel 1.1, sub aa][ref2], zoals dit artikel luidt na de inwerkingtreding van artikel I, onderdeel L van de wet
      van 4 februari 2010 (Stb. 119) deze opleidingen als rechtspersoon voor hoger onderwijs verzorgen, bedoeld in het
      vierde lid of kan de instelling deze opleidingen in een afzonderlijke privaatrechtelijke rechtspersoon onderbrengen
      die rechtspersoon voor hoger onderwijs is.


