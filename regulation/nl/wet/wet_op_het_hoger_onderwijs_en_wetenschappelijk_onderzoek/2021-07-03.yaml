      Onze Minister registreert binnen een redelijke termijn de opleiding overeenkomstig de door het instellingsbestuur
      verstrekte gegevens in het Centraal register opleidingen hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.14
  - number: 6.14.4
    text: |-
      Indien de gegevens niet volledig zijn of de indeling in het Centraal register opleidingen hoger onderwijs naar
      het oordeel van Onze Minister in redelijkheid niet passend kan worden geacht voor de opleiding stelt Onze Minister
      het instellingsbestuur in de gelegenheid om, binnen een door Onze Minister te bepalen termijn, te voorzien in de
      ontbrekende gegevens onderscheidenlijk de indeling te herzien. Hij houdt daarbij rekening met de termijn, bedoeld
      in [artikel 5.8, eerste lid, onderdelen a en b][ref1]. Onverminderd [artikel 6.15][ref2] weigert Onze Minister
      registratie in het register uitsluitend, indien Onze Minister de gegevens binnen deze termijn niet of niet volledig
      heeft ontvangen, indien hij constateert dat de gegevens niet juist zijn, of indien de herziene indeling naar het
      oordeel van Onze Minister in redelijkheid niet passend geoordeeld kan worden voor de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.14
