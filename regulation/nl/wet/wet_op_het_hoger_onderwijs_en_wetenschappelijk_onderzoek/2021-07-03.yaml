  - number: '16.1'
    text: |-
      De artikelen [16.2 tot en met 16.6][ref1], [16.8][ref2] en [16.9][ref3] vervallen op een bij koninklijk besluit te
      bepalen tijdstip dat voor de verschillende artikelen verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel16.1
    references:
      - id: ref1
