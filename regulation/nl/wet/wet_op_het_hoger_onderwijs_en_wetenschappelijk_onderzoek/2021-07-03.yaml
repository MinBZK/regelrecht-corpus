      aangewezen op grond van [artikel 6.9][ref2], zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding
      van artikel I, onderdeel AP, van de wet van 4 februari 2010 (Stb. 119). De artikelen die bij of krachtens de
      wet gelden voor de rechtspersonen voor hoger onderwijs zijn op die universiteiten van toepassing, evenals de
