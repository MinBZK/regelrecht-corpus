        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.64.1
    text: |-
      Universitaire eerstegraads lerarenopleidingen als bedoeld in [artikel 7.4, vierde lid][ref1], zoals die bepaling
      op 31 augustus 2002 luidde, worden, voorzover die opleidingen op 31 augustus 2002 aan de desbetreffende bekostigde
      of aangewezen universiteit zijn verbonden, aangemerkt als de masteropleidingen in het wetenschappelijk onderwijs,
      bedoeld in [artikel 7.30c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.64
    references:
