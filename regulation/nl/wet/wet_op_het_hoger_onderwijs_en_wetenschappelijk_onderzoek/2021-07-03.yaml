        artikel: '9'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref6
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref9
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '2'
  - number: 5.13.6
    text: |-
      De bijlage, bedoeld in het vierde lid, onderdeel c, wordt binnen een jaar nadat het accreditatieorgaan het
      accreditatierapport heeft vastgesteld door het instellingsbestuur openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
  - number: 5.14.1
    text: |-
      Het accreditatieorgaan stemt in met de samenstelling van de commissie van deskundigen, bedoeld in
      [5.2, tweede lid, onderdeel c][ref1], indien de commissie:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.14.1.a
    text: ten minste één student-lid heeft;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.1.b
    text: bestaat uit leden die niet verbonden zijn aan de instelling die de opleiding verzorgt;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.1.c
    text: |-
      haar werkzaamheden aantoonbaar zo inricht dat de beoordeling van de kwaliteit van de opleiding ten behoeve van
      verkrijging van accreditatie bestaande opleiding apart wordt verricht van de beoordeling van de opleiding ten
      behoeve van aanbevelingen voor verdere ontwikkeling; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.1.d
    text: |-
      voldoet aan de overige waarborgen voor de onafhankelijkheid en voor deskundigheid, die in het accreditatiekader
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.2
    text: |-
      Het instellingsbestuur doet tevens een voorstel voor een secretaris voor de commissie. Het accreditatieorgaan
      stemt in met de voorgestelde secretaris indien hij voldoet aan de waarborgen voor de onafhankelijkheid en voor
      deskundigheid die in het accreditatiekader zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.3
    text: |-
      Het instellingsbestuur dient voor een door het accreditatieorgaan te bepalen datum een aanvraag in om de instemming
      te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.14.4
    text: Het accreditatieorgaan beslist binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.14
  - number: 5.15.1
    text: |-
      Het accreditatieorgaan beoordeelt op basis van het door hem ontvangen deel van het visitatierapport of een positief
      besluit op de aanvraag kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
  - number: 5.15.2
    text: |-
      In het geval, bedoeld in [artikel 5.11, derde lid][ref1], alsmede indien er zich anderszins wijzigingen
      hebben voorgedaan in de opleiding, de sector, de visitatiegroep of de toevoeging aan de graad, beoordeelt
      het accreditatieorgaan tevens de naam en de toevoeging aan de graad. [Artikel 5.7, vierde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.15.3
    text: |-
      Het accreditatieorgaan beslist binnen drie maanden na de uiterste aanvraagdatum op de aanvraag en verricht de
      beoordeling van de aanvragen van alle opleidingen binnen een visitatiegroep gezamenlijk en in dezelfde periode.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
  - number: 5.15.4
    text: |-
      Indien op een aanvraag voor accreditatie bestaande opleiding pas kan worden beslist nadat de termijn van
      accreditatie nieuwe opleiding is verstreken, wordt de accreditatie nieuwe opleiding stilzwijgend verlengd totdat
      het besluit op de aanvraag voor accreditatie bestaande opleiding in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
  - number: 5.15.5
    text: |-
      Het instellingsbestuur is het accreditatieorgaan een vergoeding verschuldigd van de kosten van de beoordeling van
      de aanvraag met dien verstande dat het instellingsbestuur het accreditatieorgaan geen vergoeding verschuldigd is
      voor de beoordeling door de commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
  - number: 5.15.6
    text: |-
      [Artikel 5.10][ref1] is van overeenkomstige toepassing, met dien verstande dat in het accreditatierapport tevens de
      visitatiegroep wordt vastgelegd waarin de opleiding wordt ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.16.1
    text: |-
      Indien de opleiding door het accreditatieorgaan op alle kwaliteitsaspecten, genoemd in [artikel 5.12][ref1]
      positief wordt beoordeeld, wordt accreditatie bestaande opleiding verleend, met dien verstande dat de opleiding
      elke zes jaar wordt herbeoordeeld en de kwaliteit van de opleiding bij die gelegenheid door het accreditatieorgaan
      telkens positief moet worden beoordeeld. De [artikelen 5.11 tot en met 5.15][ref2] zijn op de herbeoordeling van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.16.2
    text: |-
      In het besluit tot verlening van accreditatie bestaande opleiding en de bevestiging daarvan, bedoeld in het derde
      lid, vermeldt het accreditatieorgaan de datum waarop het visitatierapport moet worden overgelegd met het oog op de
      eerstvolgende herbeoordeling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.16
  - number: 5.16.3
    text: |-
      Voor zover de opleiding telkens op alle kwaliteitsaspecten door het accreditatieorgaan positief wordt beoordeeld
      en de opleiding accreditatie bestaande opleiding behoudt, stuurt het accreditatieorgaan het instellingsbestuur
      daarvan een bevestiging binnen drie maanden na de datum, bedoeld in het tweede lid, waarop het visitatierapport
      moet worden overgelegd, tenzij Onze Minister uitstel heeft verleend als bedoeld in het vierde lid in welk geval de
      door Onze Minister bepaalde datum in de plaats treedt van de datum, bedoeld in het tweede lid. Hij stuurt daarbij
      een besluit met betrekking tot het eindoordeel bedoeld in [artikel 5.15, zesde lid][ref1], en in voorkomend geval
      met betrekking tot een wijziging in de naam en de toevoeging aan de graad, bedoeld in artikel 5.15, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.16.4
    text: |-
      Indien wegens onvoorziene omstandigheden het visitatierapport niet tijdig door het instellingsbestuur kan worden
      overgelegd, kan Onze Minister besluiten hem daarvan uitstel te verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.16
  - number: 5.17.1
    text: |-
      Accreditatie bestaande opleiding wordt door het accreditatieorgaan geweigerd indien de kwaliteit van de opleiding
      negatief wordt beoordeeld op een of meer van de kwaliteitsaspecten, genoemd in [artikel 5.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.17.2
    text: |-
      In afwijking van het eerste lid, kan het accreditatieorgaan accreditatie bestaande opleiding onder voorwaarden
      verlenen, indien de tekortkomingen op de kwaliteitsaspecten naar zijn oordeel binnen afzienbare tijd kunnen worden
      weggenomen. [Artikel 5.9, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.18'
    text: |-
      Onverminderd [artikel 5.16, derde lid][ref1], kan het accreditatieorgaan besluiten dat de opleiding accreditatie
      bestaande opleiding behoudt, ingeval de opleiding bij een herbeoordeling als bedoeld in artikel 5.16, eerste lid,
      door het accreditatieorgaan op een of meer van de kwaliteitsaspecten genoemd in [artikel 5.12][ref2] negatief
      wordt beoordeeld maar de tekortkomingen naar zijn oordeel binnen afzienbare tijd kunnen worden weggenomen.
      [Artikel 5.9, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.1
    text: 'Accreditatie nieuwe opleiding wordt ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
  - number: 5.19.1.a
    text: |-
      door het instellingsbestuur niet wordt voldaan aan de voorschriften, genoemd in [artikel 5.8, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.1.b
    text: |-
      een opleiding na de beoordeling, bedoeld in [artikel 5.8, eerste lid, onderdeel c][ref1], door
      het accreditatieorgaan negatief wordt beoordeeld op een of beide kwaliteitsaspecten, genoemd in
      [artikel 5.7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.2
    text: |-
      In afwijking van het eerste lid, onderdeel b, kan het accreditatieorgaan besluiten dat de opleiding accreditatie
      nieuwe opleiding behoudt:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
  - number: 5.19.2.a
    text: indien de tekortkomingen naar zijn oordeel binnen afzienbare tijd kunnen worden weggenomen; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
  - number: 5.19.2.b
    text: |-
      voor zover de opleiding niet eerder accreditatie onder voorwaarden is verleend als bedoeld in
      [artikel 5.9, tweede lid][ref1]. Artikel 5.9, derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.3
    text: |-
      Accreditatie bestaande opleiding wordt ingetrokken indien niet wordt voldaan aan de voorschriften, genoemd in
      [artikel 5.16, eerste lid][ref1], of indien het visitatierapport niet is ingediend op de datum, bedoeld in artikel
      5.16, tweede of vierde lid, indien Onze Minister daaraan toepassing heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.4
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen accreditatie onder voorwaarden als bedoeld in
      [artikel 5.9, tweede lid][ref1], [artikel 5.17, tweede lid][ref2], en [artikel 5.18][ref3], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.19.5
    text: |-
      [Artikel 5.10][ref1] is van overeenkomstige toepassing op het besluit tot intrekken van accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.20.1
    text: |-
      Onze Minister kan, na advies van het accreditatieorgaan, accreditatie nieuwe opleiding of accreditatie bestaande
      opleiding tussentijds intrekken, indien de kwaliteit van de opleiding zodanig is gewijzigd dat een beoordeling op
      de kwaliteitsaspecten, bedoeld in [artikel 5.7, eerste, respectievelijk tweede lid][ref1], [artikel 5.12][ref2] of
      [artikel 5.23][ref3], tot een weigering of intrekking van accreditatie zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.20.2
    text: |-
      Voordat het accreditatieorgaan een advies uitbrengt, stelt hij een onderzoek in naar de kwaliteit van de opleiding,
      voor welk onderzoek hij een commissie van deskundigen als bedoeld in [artikel 5.14][ref1] instelt. Op het
      onderzoek is [artikel 5.10][ref2] van overeenkomstige toepassing, alsmede de [artikelen 5:13][ref3], [5:16][ref4],
      [5:17][ref5] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.21.1
    text: |-
      Indien accreditatie bestaande opleiding wordt geweigerd als bedoeld in [artikel 5.17][ref1] of accreditatie wordt
      ingetrokken als bedoeld in [artikel 5.19][ref2] en [artikel 5.20][ref3], kan vanaf de datum waarop accreditatie
      nieuwe opleiding vervalt, dan wel vanaf de datum waarop het besluit tot intrekking van accreditatie in werking
      treedt:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.21.1.a
    text: |-
      aan de examens geen graad als bedoeld in [artikel 7.10a][ref1] meer worden verbonden; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5.21.1.b
    text: |-
      een bekostigde instelling geen aanspraak meer maken op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 5.21.2
    text: |-
      De instelling draagt er zorg voor dat studenten, ingeschreven aan de opleiding, de gelegenheid wordt geboden de
      opleiding te voltooien aan een andere instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
  - number: 5.21.3
    text: |-
      Voor die studenten, die de opleiding niet aan een andere instelling kunnen voltooien, wordt de opleiding aan de
      instelling zelf voortgezet voor een termijn van de resterende nominale studieduur van deze studenten, vermeerderd
      met een jaar, met dien verstande dat deze studenten de opleiding zonder onderbreking blijven volgen. In afwijking
      van het eerste lid, kan de instelling aan de examens graden verlenen en behoudt een bekostigde instelling aanspraak
      op bekostiging van de opleiding gedurende die termijn.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
  - number: 5.21.4
    text: |-
      Het instellingsbestuur deelt het besluit, bedoeld in het eerste lid, binnen zes weken na de bekendmaking ervan
      mee aan de betrokken studenten en vermeldt daarbij op welke wijze en aan welke instelling zij de opleiding kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
  - number: 5.21.5
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter hoogte van 500 euro voor iedere dag dat het
      instellingsbestuur de termijn van zes weken, genoemd in het vierde lid, overschrijdt. Daarbij geldt een maximum van
      50.000 euro.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
  - number: 5.21.6
    text: |-
      In afwijking van het eerste tot en met vierde lid, kan Onze Minister, in het belang van instandhouding van een
      doelmatig onderwijsaanbod, besluiten dat een bekostigde instelling gedurende een door Onze Minister vast te
      stellen termijn aanspraak behoudt op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref1], dat aan de examens
      een graad als bedoeld in [artikel 7.10a][ref2] blijft verbonden en dat de registratie in het Centraal register
      opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref3], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.23.1
    text: |-
      Een instellingstoets kwaliteitszorg is de toets op de interne kwaliteitszorg en de inzet tot verbetering van
      de resultaten van een instelling voor hoger onderwijs, voor zover betrekking hebbend op de kwaliteit van haar
      opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.2
    text: Een instellingstoets kwaliteitszorg wordt uitgevoerd op aanvraag van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.3
    text: 'De kwaliteitszorg wordt beoordeeld aan de hand van de volgende kwaliteitsaspecten:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.3.a
    text: de visie van de instelling op de kwaliteit van haar onderwijs;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.3.b
    text: de vormgeving en de effectiviteit van de interne kwaliteitszorg van een instelling;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.3.c
    text: het gevoerde beleid op het gebied van personeel en voorzieningen; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.3.d
    text: de voorzieningen die de toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.4
    text: |-
      Het accreditatieorgaan baseert zijn oordeel of een positief besluit op de aanvraag voor de instellingstoets
      kwaliteitszorg kan worden genomen op een advies van de commissie van deskundigen, bedoeld in
      [artikel 5.2, tweede lid, onderdeel b][ref1]. Van de commissie maakt ten minste een student deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.23.5
    text: Het accreditatieorgaan neemt binnen zes maanden na ontvangst van de aanvraag een besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: 5.23.6
    text: |-
      Het instellingsbestuur is het accreditatieorgaan een vergoeding verschuldigd van de kosten van de beoordeling van
      de aanvraag, waaronder de beoordeling van de kwaliteitszorg door de commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.23
  - number: '5.24'
    text: |-
      Indien de kwaliteitszorg door het accreditatieorgaan op de aspecten, genoemd in [artikel 5.23, derde lid][ref1],
      positief wordt beoordeeld, wordt de erkenning ITK verleend voor de duur van zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.25.1
    text: |-
      In geval van een erkenning ITK wordt in afwijking van [artikel 5.7, eerste lid][ref1], de kwaliteit van
      een opleiding bij een aanvraag voor een toets nieuwe opleiding beoordeeld aan de hand van de volgende
      kwaliteitsaspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.25.1.a
    text: het beoogde eindniveau van de opleiding, gelet op hetgeen internationaal gewenst of gangbaar is;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
  - number: 5.25.1.b
    text: de inhoud en opzet van het onderwijsprogramma en de kwaliteit van het docententeam; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
  - number: 5.25.1.c
    text: de wijze van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
  - number: 5.25.2
    text: |-
      In afwijking van [artikel 5.7, tweede lid][ref1], wordt de kwaliteit van een opleiding, waaraan feitelijk al
      onderwijs wordt verzorgd, bij een aanvraag voor een toets nieuwe opleiding beoordeeld op de kwaliteitsaspecten,
      genoemd in het eerste lid, onderdelen a en b, alsmede aan de hand van:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.25.2.a
    text: het gerealiseerde niveau, gelet op hetgeen internationaal gewenst en gangbaar is; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
  - number: 5.25.2.b
    text: de deugdelijkheid van de beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
  - number: 5.25.3
    text: |-
      In afwijking van [artikel 5.12][ref1] wordt de kwaliteit van een opleiding bij een aanvraag voor accreditatie
      bestaande opleiding en bij de herbeoordelingen, bedoeld in [artikel 5.16, eerste lid][ref2], beoordeeld aan de hand
      van de kwaliteitsaspecten, genoemd in het eerste lid, onderdeel a en b, het kwaliteitsaspect, genoemd in het tweede
      lid, onderdeel b, alsmede aan de hand van het gerealiseerde eindniveau, gelet op hetgeen internationaal gewenst en
      gangbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.25.4
    text: |-
      Het instellingsbestuur kan het accreditatieorgaan verzoeken een of meer opleidingen in afwijking van het eerste
      tot en met derde lid te beoordelen op de kwaliteitsaspecten, genoemd in [artikel 5.7][ref1], respectievelijk
      [artikel 5.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.25.5
    text: |-
      In afwijking van [artikel 5.8, eerste lid][ref1], wordt bij het verlenen van accreditatie nieuwe opleiding niet de
      voorwaarde gesteld tot aanvullende beoordeling als bedoeld in onderdeel c van dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.26.1
    text: |-
      De erkenning ITK kan bij besluit door het accreditatieorgaan worden verlengd, indien de verlenging ten minste een
      jaar voor het eind van de termijn van verlening van de erkenning ITK door het instellingsbestuur is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.26
  - number: 5.26.2
    text: |-
      [Artikel 5.23][ref1] en [artikel 5.24][ref2] zijn op de aanvraag van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.26
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.26.3
    text: |-
      Indien op de aanvraag tot verlenging pas kan worden beslist nadat de verleningstermijn van de erkenning ITK is
      verstreken, wordt het besluit waarbij de erkenning ITK was verleend stilzwijgend verlengd totdat het besluit over
      verlenging van de erkenning ITK in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.26
  - number: 5.26.4
    text: |-
      Indien wegens onvoorziene omstandigheden de aanvraag door het instellingsbestuur niet tijdig kan worden gedaan, kan
      Onze Minister de erkenning met maximaal twee jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.26
  - number: 5.27.1
    text: 'De erkenning ITK of verlenging van de erkenning ITK wordt door het accreditatieorgaan geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.27
  - number: 5.27.1.a
    text: |-
      binnen drie jaar voorafgaand aan de aanvraag voor een instellingstoets kwaliteitszorg de erkenning ITK is geweigerd
      of ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.27
  - number: 5.27.1.b
    text: |-
      de kwaliteitszorg negatief wordt beoordeeld op een of meer kwaliteitsaspecten, genoemd in
      [artikel 5.23, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.27.2
    text: |-
      In afwijking van het eerste lid, onderdeel b, kan het accreditatieorgaan besluiten de erkenning ITK of de
      verlenging van de erkenning ITK onder voorwaarden te verlenen, indien de tekortkomingen op de kwaliteitszorg naar
      zijn oordeel binnen afzienbare tijd kunnen worden weggenomen. [Artikel 5.9, derde lid][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.27.3
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen een erkenning ITK onder voorwaarden als bedoeld
      in [artikel 5.27, tweede lid][ref1], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.28.1
    text: 'Het accreditatieorgaan legt in het ITK-rapport vast:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.1.a
    text: het advies van de commissie van deskundigen over de kwaliteitsaspecten;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.1.b
    text: zijn bevindingen; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.1.c
    text: het eindoordeel voldoende of onvoldoende.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.2
    text: Het ITK-rapport is onderdeel van het besluit op de aanvraag voor een instellingstoets kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.3
    text: |-
      Alvorens een besluit te nemen op de aanvraag stelt het accreditatieorgaan binnen een door hem te bepalen termijn
      het instellingsbestuur in de gelegenheid zijn zienswijze over het voorgenomen besluit naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.28.4
    text: |-
      Gelijktijdig met de bekendmaking aan de instelling van het besluit op de aanvraag, publiceert het
      accreditatieorgaan het besluit op een voor ieder kenbare wijze.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.28
  - number: 5.29.1
    text: |-
      Onze Minister kan, na advies van het accreditatieorgaan, de erkenning ITK tussentijds intrekken,
      indien de kwaliteitszorg zodanig is gewijzigd dat een beoordeling op de kwaliteitsaspecten, bedoeld in
      [artikel 5.23, derde lid][ref1], tot een weigering van de erkenning ITK zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.29.2
    text: |-
      Voordat het accreditatieorgaan een advies uitbrengt, stelt hij een onderzoek in naar de kwaliteitszorg
      van de opleidingen. Op het onderzoek zijn de [artikelen 5.23, zesde lid][ref1], en [5.28][ref2]
      van overeenkomstige toepassing, alsmede de [artikelen 5:13][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.30.1
    text: |-
      Aanvragen voor een toets nieuwe opleiding als bedoeld in [artikel 5.6][ref1], dan wel voor accreditatie bestaande
      opleiding als bedoeld in [artikel 5.11][ref2], ingediend voorafgaand aan het moment dat het besluit tot weigering
      van verlenging of het besluit tot intrekking van de erkenning ITK onherroepelijk is geworden, worden beoordeeld
      overeenkomstig [artikel 5.25, eerste, respectievelijk tweede lid][ref3], voor zover geen toepassing is gegeven aan
      het vierde lid. Op een aanvraag voor een toets nieuwe opleiding wordt beslist overeenkomstig artikel 5.25, vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.30.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op visitatierapporten overgelegd ter voldoening aan het
      voorschrift, bedoeld in [artikel 5.16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.31.1
    text: |-
      Het accreditatieorgaan kan, al dan niet op aanvraag van het instellingsbestuur, besluiten de opleiding in een
      andere visitatiegroep in te delen indien dit beter past bij de aard van de opleiding of indien dit vanwege de
      planning van de werkzaamheden van het accreditatieorgaan redelijk is. Het accreditatieorgaan bepaalt voor welke
      datum een aanvraag moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.31
  - number: 5.31.2
    text: |-
      Onverminderd [artikel 5.11, derde lid][ref1], kan de naam van de opleiding of de toevoeging aan de graad
      als bedoeld in [artikel 5.6, tweede lid][ref2], op aanvraag van het instellingsbestuur, bij besluit door
      het accreditatieorgaan tussentijds worden gewijzigd. Op de wijziging is [artikel 5.7, vierde lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.31.3
    text: |-
      In verband met een wijziging van de visitatiegroep kan Onze Minister besluiten de accreditatie nieuwe opleiding
      maximaal twee jaar te verlengen, dan wel besluiten maximaal twee jaar uitstel te verlenen van de datum, bedoeld in
      [artikel 5.16, tweede lid][ref1], waarop het visitatierapport moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.32'
    text: |-
      Onze Minister kan bij toepassing van de bevoegdheid, bedoeld in
      [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], bepalen dat een instelling
      gedurende een door Onze Minister te bepalen termijn aanspraak behoudt op bekostiging, dat aan de examens een
      graad blijft verbonden en dat de registratie in het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref2], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.1
    text: |-
      De [titels 1][ref1] en [3][ref2] van dit hoofdstuk hebben betrekking op bekostigde universiteiten en
      hogescholen, op de Open Universiteit en op de levensbeschouwelijke universiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 6.1.2
    text: |-
      [Titel 2][ref1] heeft uitsluitend en [titel 3][ref2] heeft tevens betrekking op rechtspersonen voor hoger
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 6.2.1
    text: 'Het instellingsbestuur legt het voornemen tot:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.1.a
    text: het verzorgen van een nieuwe opleiding, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.1.b
    text: het samenvoegen van bestaande opleidingen, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.1.c
    text: het gezamenlijk verzorgen van een opleiding of afstudeerrichting als bedoeld in artikel 7.3c,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.2
    text: |-
      Onze Minister kan zich bij de beoordeling van het voornemen, bedoeld in het eerste lid, laten bijstaan door een
      adviescommissie. Bij het samenvoegen van bestaande opleidingen als bedoeld in het eerste lid, onderdeel b, of bij
      het gezamenlijk verzorgen van een opleiding als bedoeld in [artikel 7.3c][ref1] oordeelt het accreditatieorgaan of
      er sprake is van een nieuwe opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.3
    text: |-
      Met inachtneming van de aanvraag kan Onze Minister zijn instemming voor het verzorgen van een nieuwe opleiding
      beperken tot het verzorgen van een voltijdse, deeltijdse of duale opleiding. Onze Minister kan zijn instemming ook
      onder andere beperkingen verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.4
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de aanvraag om instemming.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.5
    text: |-
      In geval Onze Minister instemt met het samenvoegen van bestaande opleidingen en het accreditatieorgaan heeft
      geoordeeld dat er geen sprake is van een nieuwe opleiding:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.5.a
    text: |-
      dient het instellingsbestuur van de samengevoegde opleiding de aanvraag voor accreditatie bestaande opleiding in,
      onderscheidenlijk legt het visitatierapport voor het eerst over, op de datum waarop ten behoeve van de opleidingen
      die worden samengevoegd als eerste de aanvraag accreditatie bestaande opleiding zou moeten worden ingediend,
      onderscheidenlijk als eerste het visitatierapport zou moeten worden overgelegd; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.5.b
    text: |-
      kan Onze Minister desgevraagd bepalen dat het instellingsbestuur uiterlijk bij de aanvang van het zesde studiejaar,
      nadat de samenvoeging heeft plaatsgevonden, deze ongedaan maakt zonder dat daarvoor instemming als bedoeld
      in het eerste lid noodzakelijk is. Alsdan legt het instellingsbestuur voor de afzonderlijke opleidingen het
      visitatierapport over op de datum waarop het instellingsbestuur van de samengevoegde opleiding het visitatierapport
      zou moeten overleggen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.6
    text: |-
      Onze Minister kan het instellingsbestuur maximaal twee jaar uitstel verlenen van de data, bedoeld in het vorige
      lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.7
    text: |-
      Indien sprake is van het samenvoegen van bestaande opleidingen kan Onze Minister bij het verlenen van de instemming
      desgevraagd bepalen dat het instellingsbestuur uiterlijk bij de aanvang van het zesde studiejaar nadat de
      samenvoeging heeft plaatsgevonden deze ongedaan kan maken zonder dat daarvoor instemming als bedoeld in het eerste
      lid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.8
    text: |-
      Ingeval van een nieuwe opleiding in een van de openbare lichamen BES wordt bij de beoordeling gelet op de
      voorzieningen op het gebied van hoger onderwijs in Nederland en Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.2.9
    text: |-
      De instemming van Onze Minister vervalt, indien de opleiding niet binnen tien maanden nadat de instemming is
      verleend, is geregistreerd in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.10
    text: |-
      Onze Minister stelt beleidsregels vast op grond waarvan hij de aanvragen beoordeelt. Wijzigingen van de
      beleidsregels worden meegedeeld aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.2
  - number: 6.5.1
    text: |-
      Onze Minister kan besluiten dat aan een opleiding de rechten, genoemd in [artikel 1.9, eerste en tweede lid][ref1],
      worden ontnomen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 6.5.1.a
    text: |-
      de verzorging van die opleiding, gelet op de spreiding en de mate van verscheidenheid van de voorzieningen in het
      hoger onderwijs, en het profiel van de instelling die de desbetreffende opleiding verzorgt, in redelijkheid niet of
      niet meer doelmatig kan worden geacht, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.5
  - number: 6.5.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald over de kwaliteitszorg, de
      registratie, het onderwijs, de examens, de promoties of de vooropleidingseisen of toelatingseisen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.5
  - number: 6.5.2
    text: |-
      Bij een besluit als bedoeld in het eerste lid bepaalt Onze Minister het tijdstip waarop dat besluit van kracht
      wordt. [Artikel 5.21, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 6.6.1
    text: |-
      Onze Minister neemt een besluit op grond van [artikel 6.5, eerste lid, onderdeel a][ref1], uiterlijk acht weken
      na de datum waarop hij het voornemen tot het ontnemen van rechten aan de Tweede Kamer der Staten-Generaal bekend
      heeft gemaakt. Hij zendt gelijktijdig een afschrift van deze bekendmaking aan de instelling die het aangaat. Onze
      Minister stelt ten minste drie maanden voordat hij het voornemen aan de Tweede Kamer bekendmaakt, de instelling van
      zijn voornemen tot ontneming van rechten op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2
    text: |-
      Voordat Onze Minister een besluit neemt op de grond, genoemd in [artikel 6.5, eerste lid, onderdeel b][ref1], geeft
      hij het instellingsbestuur een waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg
      moet zijn gegeven en desgewenst overleg met hem plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg
      moet zijn gegeven, bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7.1
    text: |-
      Onze Minister kan op aanvraag van het instellingsbestuur toestemming verlenen gegadigden bij de inschrijving voor
      een opleiding te selecteren volgens door het instellingsbestuur vast te stellen criteria en in samenhang daarmee
      voor de geselecteerde studenten een collegegeld vast te stellen dat hoger is dan het wettelijk collegegeld, bedoeld
      in [artikel 7.45, eerste of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.7.2
    text: |-
      De toestemming van Onze Minister heeft betrekking op een bepaalde opleiding of op een bepaald programma binnen een
      opleiding waarvan de studielast en eindtermen gelijk zijn aan die van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
  - number: 6.7.3
    text: 'Onze Minister verleent uitsluitend zijn toestemming, indien:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
  - number: 6.7.3.a
    text: |-
      de aanvraag kleinschalig en intensief onderwijs betreft, dat is gericht op een bovengemiddeld onderwijsrendement en
      waarbij de activiteiten binnen en buiten het curriculum met elkaar zijn verbonden; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
  - number: 6.7.3.b
    text: de toestemming geen afbreuk doet aan de kwaliteit of de toegankelijkheid van het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
  - number: 6.7.4
    text: |-
      Het hogere collegegeld bedoeld in het eerste lid, bedraagt ten hoogste vijf maal het wettelijk collegegeld, bedoeld
      in [artikel 7.45, eerste of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.7a.1
    text: |-
      Aan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], zijn de volgende verplichtingen voor het
      instellingsbestuur verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.1.a
    text: het selecteren van gegadigden;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
  - number: 6.7a.1.b
    text: het vaststellen van een regeling voor de selectiecriteria en -procedure;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
  - number: 6.7a.1.c
    text: |-
      het vaststellen van een regeling voor de criteria en procedure voor dispensatie van betaling van het hogere
      collegegeld; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
  - number: 6.7a.1.d
    text: |-
      het meewerken aan een eenmalige toetsing aan de praktijk als bedoeld in [artikel 6.7c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.2
    text: |-
      Onze Minister kan andere verplichtingen aan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.3
    text: |-
      Het instellingsbestuur selecteert de gegadigden uitsluitend op grond van kwalitatieve criteria. Het aantal soorten
      kwalitatieve selectiecriteria bedraagt ten minste twee.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7a
  - number: 6.7b.1
    text: |-
      Het instellingsbestuur dient een aanvraag als bedoeld in [artikel 6.7, eerste lid][ref1], in bij het
      accreditatieorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.2
    text: |-
      Na ontvangst van een aanvraag stelt het accreditatieorgaan ten behoeve van de beslissing van Onze Minister, bedoeld
      in artikel 6.7, eerste lid, een advies op over:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
  - number: 6.7b.2.a
    text: |-
      het aspect, bedoeld in [artikel 6.7, derde lid, onder a][ref1], en;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.2.b
    text: |-
      de vraag, of de desbetreffende opleiding of het desbetreffende programma binnen een opleiding als bedoeld in
      [artikel 6.7, tweede lid][ref1], ondanks de kwalificatie door het instellingsbestuur, moet worden beschouwd als een
      nieuwe opleiding


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.3
    text: |-
      Het accreditatieorgaan zendt het advies, bedoeld in het tweede lid, vergezeld van de aanvraag, binnen zes maanden
      na indiening van de aanvraag aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
  - number: 6.7b.4
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot het indienen van aanvragen en de daarbij over te leggen
      gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
  - number: 6.7b.5
    text: In het accreditatiekader legt het accreditatieorgaan het advieskader en zijn werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7b
  - number: 6.7c.1
    text: |-
      Indien Onze Minister aan het instellingsbestuur toestemming als bedoeld in [artikel 6.7, eerste lid][ref1], heeft
      verleend, laat het instellingsbestuur het aspect, bedoeld in artikel 6.7, derde lid, onder a, van de desbetreffende
      opleiding of het programma binnen de opleiding, bedoeld in artikel 6.7, tweede lid, door het accreditatieorgaan zes
      jaar na de verlening éénmalig toetsen aan de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7c.2
    text: |-
      Bij het verlenen van de toestemming, bedoeld in [artikel 6.7][ref1], kan Onze Minister bepalen dat de toetsing aan
      de praktijk op een ander tijdstip dan het tijdstip, bedoeld in het eerste lid, plaatsvindt dan wel dat de toetsing
      achterwege kan blijven, omdat daarvan geen nieuwe inzichten zijn te verwachten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7c.3
    text: Het accreditatieorgaan zendt zijn bevindingen naar aanleiding van een toetsing aan de praktijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7c
  - number: 6.7c.4
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de toetsing aan de praktijk, bedoeld in het eerste tot
      en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7c
  - number: 6.7d
    text: |-
      Onze Minister kan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7d
    references:
