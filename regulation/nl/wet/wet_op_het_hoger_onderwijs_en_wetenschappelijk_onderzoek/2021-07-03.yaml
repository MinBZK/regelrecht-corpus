  - number: 6.11.2
    text: |-
      Onze Minister neemt geen besluit als bedoeld in het eerste lid dan nadat hij advies heeft gevraagd aan de commissie
      van advies.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.11
  - number: 6.11.3
    text: |-
      De commissie bestaat uit drie leden die voldoen aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar,
      bedoeld in [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1]. De leden worden benoemd en ontslagen
      door Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.11
    references:
