    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.12
  - number: 9.12.4
    text: Een lid van het bestuur van de faculteit kan niet tevens lid zijn van de faculteitsraad van die faculteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.12
  - number: 9.13.1
    text: |-
      De decaan wordt benoemd, geschorst en ontslagen door het college van bestuur. De benoeming geschiedt voor een door
      het college van bestuur te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.13
  - number: 9.13.2
    text: |-
      Alvorens tot benoeming of ontslag van de decaan over te gaan, hoort het college van bestuur vertrouwelijk
      de faculteitsraad van de desbetreffende faculteit over het voorgenomen besluit tot benoeming of ontslag.
      [Titel 2][ref1] van dit hoofdstuk is niet van toepassing. Het horen geschiedt op een zodanig tijdstip dat het van
      wezenlijke invloed kan zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.13
