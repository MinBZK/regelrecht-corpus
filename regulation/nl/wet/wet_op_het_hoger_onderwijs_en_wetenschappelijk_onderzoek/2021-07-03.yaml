  - number: '1.16'
    text: De Koninklijke Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.16
  - number: 1.16a
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de Koninklijke Bibliotheek, met uitzondering
      van [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.16a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: 1.17.1
    text: |-
      De Koninklijke Nederlandse Akademie van Wetenschappen heeft aanspraak op een bijdrage uit ’s Rijks kas
      ten behoeve van het vervullen van haar bij deze wet opgedragen werkzaamheden. De eerste volzin is van
      overeenkomstige toepassing op de Koninklijke Bibliotheek, onverminderd haar aanspraak op een bijdrage op grond van
      [artikel 9 van de Wet stelsel openbare bibliotheekvoorzieningen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035878#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0035878
        artikel: '9'
  - number: 1.17.2
    text: |-
      Voorwaarde voor het bepaalde in het eerste lid is dat de desbetreffende instelling in acht neemt het bij of
      krachtens deze wet bepaalde ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17.2.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17.2.b
    text: de planning en bekostiging,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17.2.c
    text: het personeel, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17.2.d
    text: het bestuur en de inrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17.3
    text: |-
      De voorwaarden, bedoeld in het tweede lid onder *a*, en onder *b* voor wat betreft de planning, hebben geen
      betrekking op de adviestaak van de Koninklijke Nederlandse Akademie van Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17
  - number: 1.17a.1
    text: |-
      Het instellingsbestuur van een instelling voor wetenschappelijk onderzoek als bedoeld in [artikel 1.5][ref1]
      draagt er zorg voor dat wordt voorzien in een regelmatige beoordeling, mede door onafhankelijke deskundigen, van
      de kwaliteit van de werkzaamheden van de instelling. Voor zover die beoordeling mede geschiedt door onafhankelijke
      deskundigen worden de uitkomsten van dat deel van de beoordeling door het instellingsbestuur openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.17a.2
    text: |-
      Onze Minister ziet toe op de uitvoering van het eerste lid. Hij kan onderzoek laten verrichten naar de kwaliteit
      van de werkzaamheden van de instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.17a
  - number: '1.18'
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs draagt er zorg voor dat, zoveel mogelijk in
      samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling, mede door onafhankelijke
      deskundigen, van de kwaliteit van de werkzaamheden van de instelling. De beoordeling geschiedt mede aan de hand van
      het oordeel van studenten over de kwaliteit van het onderwijs van de instelling. Het deel van de beoordeling dat is
      uitgevoerd door onafhankelijke deskundigen wordt door het instellingsbestuur openbaar gemaakt. Bij de beoordeling
      worden de uitkomsten van eerdere beoordelingen betrokken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.18
  - number: 1.19.1
    text: Voor een opleiding die in het buitenland wordt verzorgd, bestaat geen aanspraak op bekostiging.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19
  - number: 1.19.2
    text: |-
      Op het verzorgen van een opleiding in het buitenland is van toepassing hetgeen bij of krachtens deze wet is
      bepaald ten aanzien van het verzorgen van een opleiding door een rechtspersoon voor hoger onderwijs. Daarbij
      wordt voor de bekostigde instellingen als bedoeld in [artikel 1.8, eerste lid][ref1], afgeweken van de
      [artikelen 1.9, derde lid][ref2], [2.1][ref3], [4.1][ref4], [6.1][ref5], [7.1][ref6], [8.1][ref7], [9.1][ref8],
      [9.29][ref9] en [10.1][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref10]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19
    references:
