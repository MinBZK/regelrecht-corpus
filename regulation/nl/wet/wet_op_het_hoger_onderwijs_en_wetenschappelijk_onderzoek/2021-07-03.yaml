  - number: 1.19a.1
    text: Voor het verzorgen van een opleiding in het buitenland is toestemming van Onze Minister vereist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.2
    text: |-
      In het belang van de kwaliteit van het hoger onderwijs in Nederland en van de profilering van het Nederlandse hoger
      onderwijs in het buitenland kan Onze Minister toestemming weigeren of intrekken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.3
    text: Onze Minister weigert de toestemming in ieder geval indien de opleiding niet ook in Nederland wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de gronden voor weigering of intrekking van de toestemming
      nader geregeld en worden nadere voorschriften vastgesteld voor het verzorgen van opleidingen in het buitenland.
      Daarin worden in ieder geval voorschriften vastgesteld met betrekking tot de aanwending van de rijksbijdrage voor
      die opleidingen en worden eisen gesteld aan de academische vrijheid aan de opleiding in het land of de landen
      waar de opleiding wordt verzorgd. Voorts worden bij of krachtens algemene maatregel van bestuur voorschriften
      vastgesteld met betrekking tot de wijze waarop de veiligheid en de rechten van studenten en personeel, voor zover
      zij die rechten ontlenen aan deze wet, worden gewaarborgd. Tevens kunnen voorschriften worden vastgesteld met
      betrekking tot het indienen van aanvragen om toestemming.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5
    text: |-
      De bij of krachtens algemene maatregel van bestuur vast te stellen weigeringsgronden hebben in ieder geval
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.a
    text: de wijze waarop de opleiding in Nederland is geaccrediteerd;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.b
    text: de wijze waarop de kwaliteitszorg van het onderwijs in het land van vestiging zal worden geborgd;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.c
    text: de financiële positie van de aanvrager en de wijze waarop financiële risico’s zullen worden tegengegaan;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.d
    text: |-
      de maatregelen die door de aanvrager zullen worden getroffen om te voorkomen dat de rijksbijdrage wordt aangewend
      voor de opleiding in het buitenland;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.e
    text: |-
      de omvang en schaal van het initiatief waarop de aanvraag betrekking heeft, in het bijzonder uit een oogpunt van
      aantallen studenten;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.f
    text: de wijze waarop de continuïteit van de opleiding in Nederland is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.g
    text: |-
      de veiligheid en de rechten van de bij het onderwijs in het land van vestiging betrokken personen, voor zover zij
      die rechten ontlenen aan deze wet;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.h
    text: de aard van de diplomatieke betrekkingen tussen Nederland en het desbetreffende land;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.i
    text: de wijze waarop in het desbetreffende land rekening wordt gehouden met mensenrechten en sociale verhoudingen;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.j
    text: |-
      indien van toepassing: de wijze waarop de samenwerking met een partnerorganisatie of met partnerorganisaties zal
      worden vormgegeven;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.k
    text: de opvattingen van de bevoegde overheidsinstanties in het land van vestiging over de opleiding;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.l
    text: |-
      de wijze waarin is voorzien in het afbouwen van de opleiding in financiële en personele zin en ten opzichte van
      studenten, indien de opleiding zou worden beëindigd, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.5.m
    text: |-
      de wijze waarop de inkomsten die met de opleiding in het buitenland worden gegenereerd, worden herbestemd en de
      mate waarin die herbestemming in het belang is van de kwaliteit van het hoger onderwijs in Nederland.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.6
    text: Onze Minister kan de toestemming onder voorwaarden verlenen en kan aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.19a.7
    text: |-
      Onze Minister legt het ontwerp van een algemene maatregel van bestuur als bedoeld in het vierde en vijfde lid voor
      aan beide Kamers der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet gedaan dan
      nadat vier weken na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.19a
  - number: 1.20.1
    text: |-
      Indien het instellingsbestuur op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige student van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.20.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid jegens een minderjarige student van de instelling, doet het instellingsbestuur
      onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het instellingsbestuur de vertrouwensinspecteur
      daarvan onverwijld in kennis. Voordat het instellingsbestuur overgaat tot het doen van aangifte, stelt het de
      ouders van de betrokken student, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste
      persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.20.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      student van de instelling, stelt het personeelslid het instellingsbestuur daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.20
  - number: 1.21.1
    text: |-
      Het instellingsbestuur stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven hoe met
      signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo
      snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.21
  - number: 1.21.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 1.21.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 1.21.4
    text: Het instellingsbestuur bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.21
  - number: 1.21.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.21
  - number: 1.22.1
    text: |-
      Het voeren van de naam universiteit is voorbehouden aan de instellingen voor hoger onderwijs die zijn opgenomen in
      de bijlage van deze wet onder a, b, h en i, de universiteiten, bedoeld in [artikel 18.75, derde lid][ref1] en de
      transnationale Universiteit Limburg. Onder het voeren van de naam universiteit wordt tevens verstaan het voeren van
      deze naam in samenstellingen, alsmede het voeren van de naam universiteit in vertalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
  - number: 1.22.2
    text: |-
      In afwijking van het eerste lid, mag een instelling voor hoger onderwijs die in Nederland is gevestigd als
      nevenvestiging van een buitenlandse universiteit, de naam universiteit voeren, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.2.a
    text: haar hoofdvestiging heeft in een land dat behoort tot de Europese Economische Ruimte; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.2.b
    text: |-
      in het land van hoofdvestiging als universiteit is gevestigd conform de daar geldende onderwijs- en
      vestigingsregels, daar het recht heeft graden te verlenen, waaronder de graad Doctor of Doctor of Philosophy en ook
      in Nederland toegang tot promotie biedt; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.2.c
    text: |-
      op haar website duidelijk kenbaar maakt in welk land de hoofdvestiging is, welke graden op grond van welke
      opleidingen worden verleend en op grond van welke regeling een graad wordt verleend, met dien verstande dat de
      instelling deze gegevens, bij afwezigheid van een website, anderszins kenbaar maakt aan aanstaande studenten; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.2.d
    text: |-
      op ieder getuigschrift dat wordt verstrekt ten bewijze dat een graad is behaald, de naam van de instelling vermeldt
      en de regeling op grond waarvan de graad wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.3
    text: De bewijslast dat is voldaan aan de voorwaarden van het tweede lid, rust op de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.22.4
    text: |-
      Onze Minister kan besluiten dat nevenvestigingen van buitenlandse instellingen die hun hoofdvestiging buiten de
      Europese Economische Ruimte hebben, zich hier universiteit mogen noemen indien zij voldoen aan bij ministeriële
      regeling vast te leggen criteria. Het tweede en derde lid zijn hierop van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.22
  - number: 1.23.1
    text: |-
      Het voeren van de naam hogeschool is voorbehouden aan de instellingen voor hoger onderwijs die zijn opgenomen in de
      bijlage van deze wet onder g, en aan rechtspersonen voor hoger onderwijs. Onder het voeren van de naam hogeschool
      wordt tevens het voeren van deze naam in samenstellingen verstaan, alsmede het voeren van de naam hogeschool in
      vertalingen. In afwijking van [artikel 1.22, eerste lid][ref1], wordt de naam hogeschool in het Engels aangeduid
      met «university of applied sciences» dan wel, bij hogescholen die opleiden tot een bepaald beroepsprofiel,
      «university» met daarachter het vakgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.23.2
    text: |-
      In afwijking van het eerste lid, mag een onderwijsinstelling die in Nederland is gevestigd als nevenvestiging van
      een buitenlandse instelling, de naam hogeschool voeren indien de instelling:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.2.a
    text: haar hoofdvestiging heeft in een land dat behoort tot de Europese Economische Ruimte; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.2.b
    text: |-
      in het land van hoofdvestiging als instelling voor hoger onderwijs is gevestigd conform de daar geldende onderwijs-
      en vestigingsregels en daar het recht heeft graden te verlenen; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.2.c
    text: |-
      op haar website duidelijk kenbaar maakt in welk land de hoofdvestiging is, welke graden op grond van welke
      opleidingen worden verleend en op grond van welke regeling een graad wordt verleend, met dien verstande dat de
      instelling deze gegevens, bij afwezigheid van een website, anderszins kenbaar maakt aan aanstaande studenten; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.2.d
    text: |-
      op ieder getuigschrift dat wordt verstrekt ten bewijze dat een graad is behaald, de naam van de instelling vermeldt
      en de regeling op grond waarvan de graad wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.3
    text: De bewijslast dat is voldaan aan de voorwaarden van het tweede lid, rust op de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.23.4
    text: |-
      Onze Minister kan besluiten dat nevenvestigingen van buitenlandse instellingen die hun hoofdvestiging buiten de
      Europese Economische Ruimte hebben, zich hier hogeschool mogen noemen indien zij voldoen aan bij ministeriële
      regeling vast te leggen criteria. Het tweede en derde lid zijn hierop van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.23
  - number: 1.24.1
    text: |-
      In afwijking [artikel 1.22, eerste lid][ref1], mag de naam universiteit worden gevoerd door:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.24.1.a
    text: de volksuniversiteiten;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
  - number: 1.24.1.b
    text: |-
      een persoon of rechtspersoon die geen graden verleent, noch in het vooruitzicht stelt en die geen betaling vraagt
      voor onderwijs of certificaten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
  - number: 1.24.2
    text: |-
      In afwijking van [artikel 1.23, eerste lid][ref1], mag de naam hogeschool worden gevoerd door:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.24.2.a
    text: de volkshogescholen;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
  - number: 1.24.2.b
    text: de Evangelische Hogeschool in Amersfoort en de Vrije Hogeschool in Zeist;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
  - number: 1.24.2.c
    text: |-
      een persoon of rechtspersoon die geen graden verleent, noch in het vooruitzicht stelt en die geen betaling vraagt
      voor onderwijs of certificaten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.24
  - number: 2.1.1
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 2.13][ref1] en [titel 5][ref2], heeft betrekking op de bekostigde
      universiteiten en hogescholen, de Open Universiteit, de levensbeschouwelijke universiteiten, de Koninklijke
      Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '2'
  - number: 2.1.2
    text: |-
      Op de academische ziekenhuizen zijn uitsluitend de [artikelen 2.10][ref1], [2.12][ref2] en [2.13][ref3] en
      [titel 5][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '2'
  - number: '2.2'
    text: |-
      Het instellingsbestuur stelt eenmaal per zes jaren een plan met betrekking tot de instelling vast. Het plan geeft
      een omschrijving van de inhoud en de specificatie van het voorgenomen beleid van de instelling voor de duur van het
      plan. In het plan wordt aandacht besteed aan de voornemens in verband met de bevordering van de kwaliteit van het
      onderwijs en het verbeteren van de inrichting van de opleidingen aan de instelling. Het instellingsbestuur maakt
      het plan openbaar.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2
  - number: 2.2a.1
    text: |-
      Het instellingsbestuur van de Koninklijke Nederlandse Akademie van Wetenschappen en het instellingsbestuur van de
      Koninklijke Bibliotheek stellen in afwijking van [artikel 2.2][ref1] een instellingsplan vast uiterlijk vier jaar
      na het tijdstip van vaststelling van het vorige plan en zenden dit na vaststelling onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2a.2
    text: |-
      In het instellingsplan wordt rekening gehouden met het wetenschapsbudget, bedoeld in
      [artikel 16a van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1], de instellingsplannen
      van universiteiten, verkenningen, rapporten, adviezen en aanbevelingen een en ander voorzover die naar het oordeel
      van het instellingsbestuur van belang zijn voor de uitvoering van de taken van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: 16a
  - number: 2.2a.3
    text: 'Het instellingsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.2a.3.a
    text: de doelstellingen van de instelling voor wetenschappelijk onderzoek op middellange termijn,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.2a.3.b
    text: de hoofdlijnen van het te voeren beleid en de daarin te stellen prioriteiten, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.2a.3.c
    text: de financiële, personele, materiële en organisatorische voorwaarden die moeten worden vervuld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.2a.4
    text: |-
      Onze Minister brengt zijn standpunt over het instellingsplan binnen zes maanden na ontvangst van het plan ter
      kennis van het instellingsbestuur. Onze Minister doet daarvan en van het instellingsplan afschrift toekomen aan de
      beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.2a.5
    text: |-
      Onze Minister kan zijn standpunt over het instellingsplan gedurende de looptijd daarvan wijzigen, indien de
      vaststelling van een nieuw wetenschapsbudget daartoe aanleiding geeft. Het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.2a
  - number: 2.3.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap stelt mede op grondslag van de gegevens vermeld in de
      jaarverslagen omtrent het voorgenomen beleid ten aanzien van de werkzaamheden van de instellingen een hoger
      onderwijs- en onderzoekplan vast. Het plan heeft betrekking op een tijdvak van ten minste vier jaren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
  - number: 2.3.2
    text: |-
      Het hoger onderwijs- en onderzoekplan bevat de voornemens ten aanzien van het door Onze Minister te voeren beleid
      met betrekking tot het hoger onderwijs en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
  - number: 2.3.3
    text: 'Het hoger onderwijs- en onderzoekplan bevat voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
  - number: 2.3.3.a
    text: |-
      een overzicht van omstandigheden en gegevens die van belang zijn voor het met betrekking tot het hoger onderwijs en
      wetenschappelijk onderzoek te voeren beleid, en van de gewenste ontwikkelingen, daaronder mede begrepen wijzigingen
      ten aanzien van de maatschappelijke behoeften aan hoger onderwijs en wetenschappelijk onderzoek,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
  - number: 2.3.3.b
    text: |-
      algemene voornemens die in de beleidregels, bedoeld in [artikel 6.2, vierde lid][ref1], worden opgenomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.3.3.c
    text: |-
      een financiële raming in verband met de bekostiging van de daarvoor in aanmerking komende werkzaamheden van de
      instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.3
  - number: 2.4.1
    text: |-
      Het hoger onderwijs- en onderzoekplan wordt vastgesteld uiterlijk vier jaar na het tijdstip van vaststelling van
      het vorige hoger onderwijs- en onderzoekplan. Na overleg met de beide Kamers der Staten-Generaal kan het hoger
      onderwijs- en onderzoekplan uiterlijk zes maanden na het tijdstip, bedoeld in de eerste volzin, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.4
  - number: 2.4.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap biedt uiterlijk zes maanden voorafgaand aan het moment waarop
      het hoger onderwijs- en onderzoekplan uiterlijk moet zijn vastgesteld, een ontwerp van dat plan aan de beide Kamers
      der Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.4
  - number: 2.4.3
    text: Onze Minister maakt het vastgestelde plan bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.4
  - number: 2.5.1
    text: |-
      De rijksbijdrage waarop de in [artikel 1.9, eerste lid][ref1], bedoelde aanspraak betrekking heeft, wordt berekend
      op de grondslag van een algemene berekeningswijze. In afwijking van de eerste volzin kan de rijksbijdrage worden
      berekend op de grondslag van een bijzondere berekeningswijze, voorzover dit voortvloeit uit de artikelen 5 en 7
      van het Verdrag tussen het Koninkrijk der Nederlanden en de Vlaamse Gemeenschap van België inzake de transnationale
      Universiteit Limburg (Trb. 2001, 38).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.5.2
    text: |-
      Onze Minister kan aan de bekostiging van onderzoek aan universiteiten voorwaarden verbinden, verband houdend met
      de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
  - number: 2.5.3
    text: |-
      De rijksbijdrage wordt jaarlijks door Onze Minister vastgesteld in overeenstemming met het desbetreffende onderdeel
      van de voor dat begrotingsjaar vastgestelde rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
  - number: 2.5.4
    text: |-
      Indien het in het derde lid bedoelde onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting wordt gewijzigd, wordt de rijksbijdrage door Onze Minister nader vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
  - number: 2.5.5
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
  - number: 2.5.6
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      verstrekt. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.5
  - number: 2.6.1
    text: |-
      De in [artikel 2.5, eerste lid][ref1], bedoelde algemene berekeningswijze wordt bij of krachtens algemene maatregel
      van bestuur vastgesteld. De algemene berekeningswijze bevat voor alle instellingen of voor groepen van instellingen
      gelijkelijk geldende maatstaven. Deze maatstaven hebben betrekking op de aard en omvang van de werkzaamheden en op
      de uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      De bijzondere berekeningswijze, bedoeld in [artikel 2.5, eerste lid][ref1], wordt bij of krachtens algemene
      maatregel van bestuur vastgesteld. In die algemene maatregel van bestuur wordt tevens vastgesteld ten aanzien van
      welk onderwijs dat artikellid toepassing vindt. De bijzondere berekeningswijze bevat maatstaven die in elk geval
      betrekking hebben op de studieresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.3
    text: |-
      Wat betreft de instellingen voor hoger onderwijs, met uitzondering van de Open Universiteit, hebben de maatstaven
      in elk geval betrekking op het aantal studenten en op de studieresultaten. De maatstaven kunnen verschillen per
      opleiding of groep van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
  - number: 2.6.4
    text: |-
      De maatstaven voor bekostiging van het wetenschappelijk onderzoek aan de universiteiten hebben in ieder geval
      betrekking op de maatschappelijke en wetenschappelijke behoefte aan het onderzoek, waarbij rekening wordt gehouden
      met het profiel van de instellingen alsmede op de kwaliteit van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
  - number: 2.6.5
    text: |-
      Met het oog op de bevordering van de kwaliteit van het hoger onderwijs of het wetenschappelijk onderzoek kan Onze
      Minister in afwijking van de algemene berekeningswijze, bedoeld in het eerste lid, aan de rijksbijdrage waarop
      de in [artikel 1.9, eerste lid][ref1], bedoelde aanspraak betrekking heeft, een bedrag toevoegen in verband met
      de door een instelling in het vooruitzicht gestelde of gerealiseerde kwaliteit van het hoger onderwijs of het
      wetenschappelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.6.6
    text: |-
      Bij de berekening van het bedrag dat op grond van het vijfde lid aan de rijksbijdrage wordt toegevoegd, worden
      in ieder geval de bij algemene maatregel van bestuur te bepalen maatstaven voor onderwijsdifferentiatie,
      onderwijsintensiteit, docentkwaliteit en studiesucces gehanteerd. Bij of krachtens algemene maatregel van bestuur
      kunnen andere bij de berekening te hanteren maatstaven worden vastgesteld. Bij algemene maatregel van bestuur wordt
      voorts vastgesteld voor welk tijdvak de berekeningswijze, bedoeld in het vijfde lid, geldt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
  - number: 2.6.7
    text: |-
      Onze Minister legt het ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste, tweede en zesde
      lid voor aan beide Kamers der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet
      gedaan dan nadat vier weken na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
  - number: 2.6.8
    text: |-
      Een ontwerp van een algemene maatregel van bestuur als bedoeld in het zesde lid wordt niet aan beide Kamers der
      Staten-Generaal voorgelegd dan nadat over dat ontwerp overleg heeft plaatsgevonden met een vertegenwoordiging van
      de instellingsbesturen van de bekostigde universiteiten, hogescholen en Open Universiteit en met de daarvoor in
      aanmerking komende belangenorganisaties van studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6
  - number: 2.6a.1
    text: |-
      De inkomsten van de Koninklijke Nederlandse Akademie van Wetenschappen en van de Koninklijke Bibliotheek bestaan
      uit:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.1.a
    text: de bijdrage uit 's Rijks kas,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.1.b
    text: inkomsten, die samenhangen met voorzieningen waarvoor de rijksbijdrage is verleend, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.1.c
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.2
    text: |-
      De rijksbijdrage wordt vastgesteld of nader vastgesteld door de vaststelling of nadere vaststelling bij de wet van
      het hoofdstuk van de rijksbegroting waarop zij is voorgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.3
    text: |-
      De rijksbijdrage wordt betaald in zodanige termijnen en tot zodanige bedragen als voor het doen van de betalingen
      door de instelling nodig is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.4
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop een voorschot betaald overeenkomstig
      door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.5
    text: Bij vaststelling van de rijksbijdrage blijven inkomsten als bedoeld in het eerste lid, onder c, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.6a.6
    text: |-
      Onze Minister stelt regels met betrekking tot de bestemming van saldi die voortvloeien uit de inkomsten, bedoeld in
      het eerste lid, onder a en b.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.6a
  - number: 2.7.1
    text: |-
      Onze Minister maakt aan elke instelling, bedoeld in [artikel 1.9, eerste lid][ref1], jaarlijks uiterlijk in oktober
      bekend welke rijksbijdrage voor het komende begrotingsjaar voorlopig kan worden verwacht. Hij deelt daarbij mede op
      welke wijze de geraamde rijksbijdrage is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.7.2
    text: |-
      Onze Minister maakt aan elke instelling zo spoedig mogelijk na de in [artikel 2.5, derde lid][ref1], bedoelde
      vaststelling bekend, welke rijksbijdrage voor de instelling is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de in [artikel 2.5, vierde lid][ref1], bedoelde nadere
      vaststelling van de rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de besteding van de
      rijksbijdrage aan private activiteiten ten behoeve van het onderwijs of het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.7a
  - number: 2.8.1
    text: |-
      Het instellingsbestuur stelt jaarlijks, voorafgaand aan het desbetreffende begrotingsjaar, voor de
      instelling een begroting vast. Het begrotingsjaar valt samen met het kalenderjaar. Het bestuur van een
      in [artikel 1.13, eerste lid][ref1], bedoelde universiteit, neemt bij de vaststelling van de begroting,
      onderscheidenlijk wijziging van de begroting de vastgestelde rijksbijdrage ten behoeve van het academisch
      ziekenhuis in acht. De besturen van de instellingen, genoemd in [artikel 1.5][ref2], zenden de begroting, alsmede
      wijzigingen van de begroting, binnen veertien dagen na de vaststelling ter kennis aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.8.2
    text: |-
      De begroting behelst een raming van de inkomsten en uitgaven alsmede van de baten en lasten van de instelling en
      dient in evenwicht te zijn. In de begroting van de Koninklijke Nederlandse Akademie van Wetenschappen en die van de
      Koninklijke Bibliotheek is een allocatie van middelen opgenomen die in overeenstemming is met het instellingsplan,
      bedoeld in [artikel 2.2a][ref1]. De in de begroting voorziene inkomsten uit de rijksbijdrage sluiten aan op de voor
      het desbetreffende begrotingsjaar door Onze Minister geraamde, onderscheidenlijk vastgestelde en in voorkomende
      gevallen nader vastgestelde rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.3
    text: |-
      Het instellingsbestuur draagt zorg voor wijziging van de begroting indien de vastgestelde rijksbijdrage afwijkt van
      de in de begroting opgenomen geraamde rijksbijdrage, alsmede in geval van een nader vastgestelde rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.8
  - number: 2.8.4
    text: |-
      Het instellingsbestuur doet de noodzakelijke uitgaven binnen de grenzen van de vastgestelde of gewijzigde
      begroting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.8
  - number: 2.8.5
    text: |-
      Af- en overschrijving op de uitgaafposten van de begroting kunnen door het instellingsbestuur geschieden in de
      gevallen, voorzien in de door dat bestuur terzake vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.8
  - number: 2.9.1
    text: |-
      Het instellingsbestuur dient jaarlijks voor 1 juli bij Onze Minister een verslag in. Het verslag bestaat
      uit de jaarrekening met bijbehorende begroting, het bestuursverslag en overige gegevens als bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede een verantwoording over de wijze waarop van
      een branchecode voor goed bestuur is afgeweken, voor zover een zodanige code overeenkomstig [artikel 2.14][ref2]
      is aangewezen. Uit het verslag dient te blijken in hoeverre sprake is van een behoorlijke uitvoering van
      de werkzaamheden ten behoeve waarvan de rijksbijdrage is verleend en van een doelmatige aanwending van de
      rijksbijdrage, mede in het licht van het instellingsplan. Van niet doelmatige aanwending van de rijksbijdrage is in
      ieder geval sprake, voorzover bedragen daaruit worden aangewend voor het uitvoeren van de procedure voor erkenning
      van verworven competenties of het op enigerlei wijze compenseren van studenten of extraneï voor collegegeld,
      examengeld, cursusgeld of voor de bijdrage bedoeld in [artikel 7.50, tweede lid][ref3], tenzij er sprake is van een
      financiële ondersteuning als bedoeld in de artikelen 7.50, derde lid, of [7.51 tot en met 7.51k][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 2.9.1a
    text: |-
      Indien na goedkeuring van Onze Minister, bedoeld in artikel 7.8a, tweede lid, een associate degree-opleiding
      gedeeltelijk wordt uitgevoerd door een instelling als bedoeld in artikel 1.1.1, onderdeel b, van de Wet educatie
      en beroepsonderwijs, kan het instellingsbestuur in verband daarmee een deel van de rijksbijdrage overdragen aan
      die instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9.2
    text: |-
      In de jaarrekening wordt rekening en verantwoording afgelegd van het financiële beheer van de instelling over
      het voorafgaande begrotingsjaar. Het bestuursverslag omvat mede het voorgenomen beleid ten aanzien van de
      werkzaamheden van de instelling, mede in het licht van de uitkomsten van kwaliteitsbeoordeling als bedoeld
      in [artikel 1.18][ref1] en andere gegevens omtrent de kwaliteit van de werkzaamheden van de instelling.
      Aan het bestuursverslag van een universiteit waaraan een academisch ziekenhuis is verbonden, wordt het in
      [artikel 12.21][ref2] bedoelde document toegevoegd, dan wel, indien het een bijzondere universiteit betreft, een
      overzicht van de voornemens betreffende de onderlinge afstemming van de werkzaamheden van de universiteit en het
      academisch ziekenhuis op het gebied van het wetenschappelijk geneeskundig onderwijs en onderzoek. Toepassing van
      de voorgaande volzin blijft achterwege indien het document, onderscheidenlijk het overzicht reeds aan een eerder
      bestuursverslag is toegevoegd en het sindsdien niet is gewijzigd of opnieuw is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.9.3
    text: |-
      Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden
      ten behoeve waarvan de rijksbijdrage is verleend, niet behoorlijk zijn uitgevoerd of de rijksbijdrage ondoelmatig
      is aangewend, kan Onze Minister bepalen, dat de daarmee gemoeide bedragen in mindering worden gebracht op de
      rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9.4
    text: Het resultaat van het verslagjaar wordt verrekend met de algemene reserve van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9.5
    text: |-
      De leden van het college van bestuur of het algemeen bestuur van een rechtspersoonlijkheid bezittende openbare
      instelling zijn persoonlijk aansprakelijk jegens de instelling voor schade ten gevolge van uitgaven die zijn
      geschied in strijd met het bepaalde bij of krachtens de wet, voorzover Onze Minister heeft bepaald dat de met die
      uitgaven gemoeide bedragen in mindering worden gebracht op de rijksbijdrage, tenzij blijkt dat zij aan het doen van
      die uitgaven niet hebben medegewerkt. Indien binnen een door Onze Minister te bepalen termijn geen rechtsvordering
      van de zijde van de instelling terzake is gesteld, kan Onze Minister daartoe overgaan namens en ten behoeve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9.6
    text: |-
      In afwijking van het eerste lid dient het algemeen bestuur van de Koninklijke Bibliotheek jaarlijks voor 15 maart
      het verslag in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9.7
    text: |-
      Het instellingsbestuur maakt het verslag openbaar. Bij ministeriële regeling kunnen nadere voorschriften worden
      gegeven over de wijze en het tijdstip waarop openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9
  - number: 2.9a
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      instelling met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.9a
  - number: '2.10'
    text: |-
      De accountant die door Onze Minister is belast met het onderzoek van de ministeriële jaarrekening, heeft met het
      oog op het verrichten van dat onderzoek toegang tot elke instelling. De accountant kan door Onze Minister tevens
      worden belast met een onderzoek naar de doelmatigheid van het beheer van de instelling. Aan de accountant worden
      alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.10
  - number: 2.10a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      jaarrekening, de besteding van de rijksbijdrage en de door de instellingen opgegeven bekostigingsgegevens.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.10a
  - number: '2.12'
    text: |-
      Het bestuur van een in [artikel 1.13, eerste lid][ref1], bedoelde universiteit betaalt, zodra de in
      [artikel 2.5][ref2] bedoelde betaling van de rijksbijdrage dan wel betaling van een voorschot daarop is ontvangen,
      aan het met dieuniversiteit verbonden academisch ziekenhuis onverwijld het gedeelte van de rijksbijdrage waarop het
      academisch ziekenhuis op grond van [artikel 1.14, eerste lid][ref3], aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 2.13.1
    text: |-
      Het instellingsbestuur dat voornemens is om gebouwen of terreinen ten behoeve waarvan een rijksbijdrage is
      verleend, blijvend niet meer voor de instelling te gebruiken, doet hiervan onverwijld mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.13
  - number: 2.13.2
    text: |-
      Onze Minister kan binnen negentig dagen na ontvangst van de mededeling, bedoeld in het eerste lid,
      beslissen dat de gebouwen of terreinen worden overgedragen aan het Rijk dan wel ten behoeve van onderwijs
      of onderzoek aan een andere door hem aan te wijzen rechtspersoon. De overdracht geschiedt door de
      inschrijving van de desbetreffende beslissing van Onze Minister in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 2.13.3
    text: |-
      Het instellingsbestuur kan de gebouwen of terreinen niet verhuren, vervreemden of aan enig beperkt recht
      onderwerpen tenzij Onze Minister, in overeenstemming met Onze Minister van Financiën, mededeelt van zijn in het
      tweede lid bedoelde bevoegdheid geen gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.13
  - number: 2.13.4
    text: |-
      Bij de overgang van de eigendom van gebouwen of terreinen ingevolge het tweede lid, vergoedt het Rijk, voorzover
      deze gebouwen of terreinen door de rechtspersoon uit eigen middelen zijn betaald en hiervoor geen rijksbijdrage
      werd verstrekt, een door Onze Minister te bepalen bedrag. Onze Minister stelt dit bedrag vast in verhouding tot de
      waarde in het economisch verkeer van die gebouwen of terreinen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.13
  - number: '2.14'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld voor de inrichting van het verslag en bij
      algemene maatregel van bestuur kunnen een of meer branchecodes voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.14
  - number: 2.16.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere
      instelling, draagt het instellingsbestuur zo spoedig mogelijk na de opheffing dan wel beëindiging van de
      bekostiging, zorg voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister
      gezonden en gaat vergezeld van een verklaring van een door hem aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.16.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het instellingsbestuur aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het instellingsbestuur uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.16
  - number: 2.16.3
    text: |-
      Bij de opheffing dan wel beëindiging van de bekostiging als bedoeld in het eerste lid, maakt het instellingsbestuur
      zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde te waarborgen dat de aan
      die instelling ingeschreven studenten de opleiding aan een andere instelling kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.16
  - number: 2.17.1
    text: |-
      Het instellingsbestuur beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en
      het voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.17
  - number: 2.17.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het instellingsbestuur uitzetten van gelden,
      het aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.17
  - number: 2.18.1
    text: |-
      Jaarlijks verstrekt Onze Minister een subsidie aan het academisch ziekenhuis dan wel aan de rechtspersoon
      die de educatieve voorziening, bedoeld in [artikel 1.4, tweede lid][ref1], in stand houdt, ter
      tegemoetkoming in de kosten van ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in de
      [artikelen 9a van de Wet op het primair onderwijs][ref2], [18a van de Wet op de expertisecentra][ref3], [18][ref4]
      en [138a van de Wet op het voortgezet onderwijs][ref5] en [7.1.4 van de Wet educatie en beroepsonderwijs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel138a
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 138a
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.18.2
    text: |-
      De hoogte van de subsidie aan het academisch ziekenhuis dan wel aan het bestuur van de rechtspersoon die de
      educatieve voorziening in stand houdt, wordt bepaald op basis van het leerlingenaantal dat het gemiddelde is van
      de hoogste dagtellingen in de maanden september tot en met april van het schooljaar 1994–1995 van leerlingen van
      scholen als bedoeld in [artikel 2, tweede lid onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat
      artikel luidde op 31 juli 1999, die waren opgenomen in het desbetreffende academisch ziekenhuis, en een bedrag
      per leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 2.18.3
    text: |-
      Het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die een educatieve voorziening in stand houdt,
      ontvangt de subsidie, bedoeld in het tweede lid, onder de voorwaarde dat op de aan deze subsidie gerelateerde
      formatieplaatsen personeel wordt benoemd, dat op 31 juli 1999 was benoemd aan een of meer van de scholen, bedoeld
      in [artikel 2, tweede lid, onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat artikel luidde op 31
      juli 1999, tenzij het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die de educatieve voorziening
      in stand houdt aantoont dat met betrekking tot een formatieplaats geen lid van dat personeel beschikbaar was dat de
      formatieplaats aanvaardde. Deze benoemingsverplichting geldt voor de betrekkingsomvang die voor de desbetreffende
      personeelsleden gold aan die scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '2.19'
    text: |-
      Met betrekking tot de educatieve voorziening, bedoeld in [artikel 1.4, tweede lid][ref1], stelt het bestuur van
      een academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt,
      jaarlijks voor 1 juli een begroting voor het volgende jaar en een jaarverslag over het afgelopen jaar vast en
      zendt die aan Onze Minister. Onze Minister kan een richtlijn vaststellen voor de inrichting van de begroting en
      het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.20.1
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarover de subsidie is toegekend, legt het bestuur van het
      academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt, een
      verklaring van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      over aan Onze Minister, waaruit blijkt in hoeverre de toegekende subsidie is besteed in overeenstemming met de
      bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.20.2
    text: |-
      Voorzover niet uit de verklaring, bedoeld in het eerste lid, blijkt dat de subsidie is besteed in overeenstemming
      met de bepalingen van deze wet, vordert Onze Minister het desbetreffende bedrag terug.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel2.20
  - number: 3.1.1
    text: |-
      Onze Minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten en hogescholen, de Open Universiteit, de Koninklijke Nederlandse Akademie van Wetenschappen en de
      Koninklijke Bibliotheek over aangelegenheden van algemeen beleid met betrekking tot die instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel3.1
  - number: 3.1.2
    text: |-
      Onze Minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten waaraan een academisch ziekenhuis is verbonden en van de academische ziekenhuizen over
      aangelegenheden van algemeen beleid betreffende de academische ziekenhuizen dan wel betreffende de academische
      ziekenhuizen en de universiteiten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel3.1
  - number: '3.2'
    text: |-
      Onze Minister neemt besluiten als bedoeld in de [artikelen 2.9, vierde lid][ref1],
      [2.13, tweede en vierde lid][ref2], en [7.56, eerste lid, onder b][ref3], niet dan na het betrokken
      instellingsbestuur in de gelegenheid te hebben gesteld met hem te overleggen over zijn desbetreffend voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 3.3.1
    text: |-
      Onze Minister pleegt geregeld overleg met de daarvoor in aanmerking komende belangenorganisaties van studenten over
      aangelegenheden van algemeen belang voor studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel3.3
  - number: 3.3.2
    text: |-
      Onze Minister treft een regeling ter financiële ondersteuning van de vertegenwoordigers van de in het eerste lid
      bedoelde belangenorganisaties, in verband met door hen te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel3.3
  - number: 4.1.1
    text: |-
      Dit hoofdstuk heeft betrekking op universiteiten, hogescholen, de Open Universiteiten en de levensbeschouwelijke
      universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.1
  - number: 4.1.2
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 4.2, tweede en derde lid][ref1], heeft tevens betrekking op de
      academische ziekenhuizen, de Koninklijke Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1
    text: |-
      Het instellingsbestuur bepaalt het personeelsbeleid en voert het personeelsbeheer. Het neemt daarbij de bij of
      krachtens de wet gegeven voorschriften alsmede de eisen van zorgvuldigheid in acht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.2
  - number: 4.2.2
    text: |-
      Het instellingsbestuur van een universiteit, een hogeschool of de Open Universiteit stelt ten behoeve van de
      leidinggevende functies op het gebied van onderwijs onderscheidenlijk onderzoek van elke van het instellingsbestuur
      uitgaande instelling, indien daaraan van een ondervertegenwoordiging van vrouwen in leidinggevende functies op het
      gebied van onderwijs onderscheidenlijk onderzoek sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in leidinggevende functies vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.2
  - number: 4.2.3
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het instellingsbestuur een beleid inzake evenredige vertegenwoordiging
      van vrouwen in leidinggevende functies wordt gevoerd, opdat in deze functies vrouwen en mannen naar evenredigheid
      werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de verhouding mannen en vrouwen
      voor wat betreft het personeel op het gebied van onderwijs en onderzoek dat werkzaam is in het door de instelling
      verzorgde onderwijs en onderzoek, zoals die blijkt uit de daarover jaarlijks door Onze Minister gepubliceerde
      cijfers. Het document vermeldt tevens de maatregelen die het instellingsbestuur heeft genomen en zal nemen teneinde
      de in de eerste volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte
      resultaten van het beleid inzake evenredige vertegenwoordiging van vrouwen in leidinggevende functies gedurende de
      periode waarvoor het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.2
  - number: 4.2.4
    text: |-
      Het instellingsbestuur draagt er zorg voor dat een exemplaar van het document in het gebouw van de instelling ter
      inzage wordt gelegd op een voor het personeel en de studenten toegankelijke plaats, alsmede dat een exemplaar wordt
      bewaard bij de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.2
  - number: 4.5.1
    text: Het instellingsbestuur draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.5
  - number: 4.5.2
    text: |-
      Over de door het instellingsbestuur ingevolge het eerste lid te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het
      instellingsbestuur overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met
      deze schriftelijk overeengekomen wijze.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel4.5
  - number: '5.1'
    text: |-
      Dit hoofdstuk heeft betrekking op de instellingen voor hoger onderwijs en op rechtspersonen die door het aanbieden
      van opleidingen rechtspersoon voor hoger onderwijs willen worden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.1
  - number: 5.2.1
    text: |-
      Er is een accreditatieorgaan dat is belast met het verlenen van accreditatie en de erkenning ITK, en de overige hem
      bij of krachtens deze wet opgedragen taken. Het accreditatieorgaan bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2
    text: |-
      Activiteiten die het accreditatieorgaan verricht in het kader van het verlenen van accreditatie en de erkenning
      ITK zijn:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2.a
    text: het indelen van opleidingen in visitatiegroepen op voorstel van de instelling;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2.b
    text: |-
      het instellen van een commissie van deskundigen die adviseert over een aanvraag toets nieuwe opleiding of
      instellingstoets kwaliteitszorg en het aanwijzen van een secretaris daarvan;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2.c
    text: |-
      het instemmen met de door instellingsbesturen binnen een visitatiegroep gezamenlijk samengestelde commissie van
      deskundigen en de daarvoor voorgestelde secretaris;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2.d
    text: |-
      het doen van een bindende voordracht aan de instelling voor de samenstelling van een commissie als bedoeld in
      onderdeel c, indien en voor zover de instellingsbesturen niet komen tot het gezamenlijk samenstellen van een
      dergelijke commissie;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.2.e
    text: |-
      het op diens verzoek adviseren van Onze Minister over het gebruik van de bevoegdheid, bedoeld in
      [artikel 5.20, eerste lid][ref1], respectievelijk [artikel 5.29, eerste lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2.2.f
    text: het opstellen van een accreditatiekader.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.3
    text: |-
      Het accreditatieorgaan rapporteert desgevraagd aan Onze Minister over de kwaliteit van opleidingen in het hoger
      onderwijs met het oog op de vergelijkbaarheid van opleidingen aan de hand van zijn beoordelingen op grond van dit
      hoofdstuk. Het accreditatieorgaan doet eventueel voorstellen die hij in het belang van de kwaliteit van opleidingen
      in het hoger onderwijs nodig acht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.4
    text: |-
      Bij ministeriële regeling worden de werkzaamheden bepaald die het accreditatieorgaan verricht in verband met het
      beoordelen van ander onderwijs dan hoger onderwijs of in verband met opdrachten als bedoeld in artikel 1, tweede
      lid, van het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
  - number: 5.2.5
    text: |-
      Onverminderd het Accreditatieverdrag is op het accreditatieorgaan de [Kaderwet zelfstandige bestuursorganen][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 5.3.1
    text: 'Het accreditatieorgaan neemt in het accreditatiekader in ieder geval een uitwerking op van:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.1.a
    text: |-
      de wijze van indeling van opleidingen in visitatiegroepen, het wijzigen van die indeling en de aanvraagprocedure
      voor wijziging van visitatiegroep door het instellingsbestuur;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.1.b
    text: |-
      de wijze waarop, onverminderd [artikel 5.14][ref1], de onafhankelijkheid en deskundigheid van de commissies,
      bedoeld in [artikel 5.2, tweede lid][ref2], en hun secretarissen wordt gewaarborgd;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.1.c
    text: |-
      de kwaliteitsaspecten, bedoeld in de [artikelen 5.7][ref1], [5.12][ref2] en [5.23][ref3], waarbij ten minste
      onderscheid wordt gemaakt tussen het wetenschappelijk onderwijs en het hoger beroepsonderwijs, tussen associate
      degree-opleidingen, bacheloropleidingen en masteropleidingen en waarbij rekening wordt gehouden met het verschil in
      de wijze van beoordeling van opleidingen van instellingen met en zonder een erkenning ITK;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.1.d
    text: |-
      de aanvraagprocedure voor het verkrijgen van accreditatie en de erkenning ITK, met dien verstande dat de uitwerking
      van de verzwaarde toets nieuwe opleiding voor de eerste opleiding die wordt verzorgd door een rechtspersoon die
      geaccrediteerde opleidingen wil verzorgen ten minste inhoudt dat deze plaatsvindt op basis van het volledige
      curriculum van de opleiding, waarop de aanvraag betrekking heeft, welke ten tijde van de aanvraag ten minste
      éénmaal recent in Nederland is verzorgd en waaraan studenten zijn afgestudeerd; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.1.e
    text: |-
      de voorwaarden voor het verlenen van de oordelen onvoldoende en voldoende aan de kwaliteitsaspecten van een
      opleiding, bedoeld in [artikel 5.10, eerste lid, onderdeel d][ref1], en [artikel 5.15, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.2
    text: |-
      Alvorens het accreditatiekader vast te stellen of te wijzigen, voert het accreditatieorgaan overleg met
      vertegenwoordigers van de gezamenlijke instellingen voor hoger onderwijs en andere betrokkenen, waaronder
      studentenorganisaties als bedoeld in [artikel 3.3][ref1] en de daarvoor in aanmerking komende vakorganisaties van
      overheids- en onderwijspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '3'
        hoofdstuk: '3'
  - number: 5.3.3
    text: |-
      Het accreditatiekader of een wijziging daarvan behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.4
    text: |-
      Onze Minister verleent zijn goedkeuring niet dan nadat vier weken zijn verstreken nadat zijn voornemen daartoe
      aan de beide kamers der Staten-Generaal is voorgelegd. Het besluit omtrent goedkeuring wordt binnen 17 weken na de
      verzending ter goedkeuring bekendgemaakt aan het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.5
    text: Het accreditatiekader of de wijziging daarvan wordt bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.3.6
    text: |-
      Het accreditatieorgaan bespreekt het accreditatiekader met instanties in de Europese landen, in het bijzonder met
      instanties in de grenslanden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.3
  - number: 5.4.1
    text: |-
      Voordat Onze Minister een voordracht doet voor bestuursleden als bedoeld in artikel 5 van het Accreditatieverdrag,
      worden de vertegenwoordigers van de gezamenlijke instellingen voor hoger onderwijs en de daarvoor in aanmerking
      komende vakorganisaties van overheids- en onderwijspersoneel gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.4
  - number: 5.4.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het horen van de gezamenlijke studentenorganisaties, bedoeld in
      [artikel 3.3][ref1], in verband met de voordracht van twee bestuursleden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '3'
        hoofdstuk: '3'
  - number: 5.4.3
    text: De bestuursleden die door Onze Minister worden voorgedragen zijn geen aan Onze Minister ondergeschikte ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.4
  - number: 5.4.4
    text: |-
      Voordat het Comité van Ministers, bedoeld in het Accreditatieverdrag, een door Onze Minister voorgedragen
      bestuurslid schorst of ontslaat, worden de vertegenwoordigers van de gezamenlijke instellingen voor hoger onderwijs
      en de vakorganisaties, bedoeld in het eerste lid, door Onze Minister gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.4
  - number: 5.5.1
    text: |-
      Onze Minister stelt jaarlijks aan het accreditatieorgaan ten laste van de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap overeenkomstig de artikelen 14 en 15, derde lid, van het Accreditatieverdrag
      financiële middelen ter beschikking voor de vervulling van zijn taken, voortvloeiend uit artikel 1, eerste en
      tweede lid, van het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.5
  - number: 5.5.2
    text: |-
      Onze Minister stelt jaarlijks voor 1 september van enig kalenderjaar, doch niet dan nadat hij daarover met
      het accreditatieorgaan heeft overlegd, het bedrag vast dat voor het daaropvolgende kalenderjaar aan het
      accreditatieorgaan ter beschikking zal worden gesteld en neemt dit bedrag op in het voorstel van wet tot
      vaststelling van de begroting van het Ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.5
  - number: 5.5.3
    text: Het boekjaar van het accreditatieorgaan valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.5
  - number: 5.5.4
    text: |-
      Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste en tweede lid, niet in werking is getreden,
      verstrekt Onze Minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, in de vorm van
      maandelijkse termijnen een voorschot aan het accreditatieorgaan tot een maximum van het bedrag, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.5
  - number: 5.5.5
    text: |-
      Overeenkomstig artikel 15, eerste en tweede lid, van het Accreditatieverdrag stelt Onze Minister, na overleg met
      het accreditatieorgaan, de tarieven vast die het instellingsbestuur aan het accreditatieorgaan verschuldigd is voor
      de door hem ten behoeve van het instellingsbestuur verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.5
  - number: 5.6.1
    text: |-
      Een toets nieuwe opleiding is de toets van een opleiding, zonder accreditatie, op de kwaliteit in het kader van
      verkrijging van accreditatie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.2
    text: Een toets nieuwe opleiding wordt uitgevoerd op aanvraag van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.3
    text: 'Bij de aanvraag vermeldt het instellingsbestuur tevens de door hem beoogde:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.3.a
    text: visitatiegroep waartoe de opleiding kan behoren;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.3.b
    text: naam van de opleiding; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.3.c
    text: |-
      toevoeging aan de graad als bedoeld in [artikel 7.10a, tweede lid][ref1], voor zover het een opleiding in het hoger
      beroepsonderwijs betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5.6.4
    text: 'Een toets nieuwe opleiding is niet vereist indien sprake is van:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.6.4.a
    text: |-
      het samenvoegen van geaccrediteerde opleidingen, voor zover het accreditatieorgaan in het kader
      van de aanvraag voor instemming met het verzorgen van de samengevoegde opleiding, bedoeld in
      [artikel 6.2, eerste lid, onderdeel b][ref1], heeft geoordeeld dat de samengevoegde opleiding geen nieuwe opleiding
      is als bedoeld in artikel 6.2, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.6.4.b
    text: |-
      het ongedaan maken van een samenvoeging van geaccrediteerde opleidingen als bedoeld in
      [artikel 6.2, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.6.4.c
    text: |-
      het gezamenlijk verzorgen van een opleiding als bedoeld in [artikel 7.3c][ref1], voor zover het accreditatieorgaan
      in het kader van de aanvraag voor instemming met het verzorgen van de gezamenlijke opleiding, bedoeld in
      [artikel 6.2, eerste lid, onderdeel e][ref2], heeft geoordeeld dat de gezamenlijke opleiding geen nieuwe opleiding
      is als bedoeld in artikel 6.2, tweede lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.6.4.d
    text: |-
      het verzorgen van een nieuwe masteropleiding, die de voortzetting vormt van een bestaande geaccrediteerde
      postinitiële masteropleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.6
  - number: 5.7.1
    text: |-
      In het kader van een toets nieuwe opleiding wordt de kwaliteit van een opleiding beoordeeld aan de hand van de
      volgende kwaliteitsaspecten:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.a
    text: het beoogde eindniveau van de opleiding, gelet op hetgeen internationaal gewenst en gangbaar is;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.b
    text: de inhoud en opzet van het onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.c
    text: de wijze van beoordeling, toetsing en examinering van de studenten;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.d
    text: de kwaliteit van het docententeam;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.e
    text: |-
      de opleidingsspecifieke voorzieningen alsmede de instellingsbrede voorzieningen die van invloed zijn op
      de kwaliteit van de opleiding, daaronder mede begrepen voldoende studiebegeleiding en voorzieningen die de
      toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.1.f
    text: |-
      de vormgeving en effectiviteit van de interne kwaliteitszorg gericht op de systematische verbetering van de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.2
    text: |-
      In het kader van een toets nieuwe opleiding wordt de kwaliteit van een opleiding, waarvan het accreditatieorgaan
      vast stelt dat daaraan feitelijk al onderwijs wordt verzorgd, beoordeeld aan de hand van de kwaliteitsaspecten,
      genoemd in de onderdelen a, b en d tot en met f, van het eerste lid alsmede aan de hand van:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.2.a
    text: het gerealiseerde niveau, gelet op hetgeen internationaal gewenst en gangbaar is; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.2.b
    text: de deugdelijkheid van de beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.3
    text: |-
      Het accreditatieorgaan baseert zijn oordeel of een positief besluit op de aanvraag kan worden genomen op een advies
      van de commissie van deskundigen, bedoeld in [artikel 5.2, tweede lid, onderdeel b][ref1]. Van de commissie maakt
      ten minste een student deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.4
    text: 'Het accreditatieorgaan beoordeelt tevens of:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.4.a
    text: |-
      de naam van de opleiding voldoende inzicht biedt in de inhoud van de opleiding en aansluit bij hetgeen gebruikelijk
      is binnen de sector waartoe de opleiding behoort en binnen de beoogde visitatiegroep; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.4.b
    text: |-
      de toevoeging aan de graad, bedoeld in [artikel 5.6, derde lid, onderdeel c][ref1], internationaal herkenbaar is
      aan de hand van een referentielijst, die bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.5
    text: Het accreditatieorgaan neemt binnen zes maanden na ontvangst van de aanvraag een besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.7.6
    text: |-
      Het instellingsbestuur is het accreditatieorgaan een vergoeding verschuldigd van de kosten van de beoordeling van
      de aanvraag, waaronder de beoordeling van de opleiding door de commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.7
  - number: 5.8.1
    text: |-
      Indien bij de toets nieuwe opleiding de kwaliteit van de opleiding door het accreditatieorgaan op alle
      kwaliteitsaspecten, genoemd in [artikel 5.7, eerste, respectievelijk tweede lid][ref1], positief wordt beoordeeld,
      wordt aan de opleiding accreditatie nieuwe opleiding verleend voor de duur van zes jaar, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.8.1.a
    text: |-
      het instellingsbestuur van een bekostigde instelling de opleiding aanmeldt voor registratie in het Centraal
      register opleidingen hoger onderwijs, bedoeld in [artikel 6.14][ref1], rekening houdend met de termijn, genoemd in
      [artikel 6.2, zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.8.1.b
    text: |-
      het instellingsbestuur van een niet-bekostigde instelling de opleiding binnen zes maanden aanmeldt voor registratie
      in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.14][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.8.1.c
    text: |-
      een opleiding, waaraan bij accreditatieverlening feitelijk nog geen onderwijs wordt verzorgd, drie jaar nadat
      accreditatie verkregen is, wordt beoordeeld op de kwaliteitsaspecten, genoemd in [artikel 5.7, tweede lid][ref1],
      en bij die gelegenheid op die aspecten positief wordt beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.8.2
    text: |-
      In afwijking van het eerste lid kan de termijn waarvoor accreditatie wordt verleend door het accreditatieorgaan
      worden bekort in verband met gelijktijdige beoordeling binnen de visitatiegroep waartoe de opleiding gaat behoren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
  - number: 5.8.3
    text: |-
      In het besluit tot verlening van accreditatie nieuwe opleiding vermeldt het accreditatieorgaan de datum waarop een
      aanvraag voor accreditatie bestaande opleiding moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
  - number: 5.8.4
    text: Onze Minister kan de termijn waarvoor accreditatie is verleend in geval van onvoorziene omstandigheden verlengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
  - number: 5.8.5
    text: |-
      [Artikel 5.7, zesde lid][ref1], en [artikel 5.10][ref2] zijn op de beoordeling, bedoeld in het eerste lid,
      onderdeel c, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.1
    text: 'Accreditatie nieuwe opleiding wordt door het accreditatieorgaan geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.9
  - number: 5.9.1.a
    text: |-
      uit de aanvraag blijkt dat de opleiding die de instelling verzorgt of voornemens is te verzorgen geheel of in
      hoofdzaak overeenstemt met een opleiding, verzorgd door dezelfde instelling, waarvoor accreditatie is geweigerd of
      is ingetrokken als bedoeld in [artikel 5.19][ref1] of [artikel 5.20][ref2], minder dan drie jaar voorafgaand aan de
      aanvraag; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.1.b
    text: |-
      de kwaliteit van de opleiding negatief wordt beoordeeld op een of meer kwaliteitsaspecten, genoemd in
      [artikel 5.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel b, kan het accreditatieorgaan accreditatie nieuwe opleiding
      onder voorwaarden verlenen, indien de tekortkomingen op de kwaliteitsaspecten naar zijn oordeel binnen afzienbare
      tijd kunnen worden weggenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.9
  - number: 5.9.3
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen accreditatie nieuwe opleiding onder voorwaarden
      kan worden verleend en welke voorschriften aan accreditatie nieuwe opleiding onder voorwaarden kunnen worden
      verbonden. De voordracht voor de algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.9
  - number: 5.10.1
    text: 'Het accreditatieorgaan legt in het accreditatierapport vast:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.1.a
    text: het advies van de commissie van deskundigen over de kwaliteitsaspecten;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.1.b
    text: zijn bevindingen;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.1.c
    text: |-
      de te verbeteren kwaliteitsaspecten, voor zover zich naar zijn oordeel ten aanzien van een of meer van die aspecten
      tekortkomingen voordoen die binnen afzienbare tijd kunnen worden weggenomen;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.1.d
    text: het eindoordeel voldoende of onvoldoende;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.1.e
    text: |-
      het onderdeel van het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], dat naar zijn
      oordeel voor de opleiding passend is;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.10.1.f
    text: |-
      het oordeel over de naam en de toevoeging aan de graad, bedoeld in
      [artikel 5.6, derde lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.10.1.g
    text: de bijzondere kenmerken van de opleiding, voor zover van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.2
    text: Het accreditatierapport is onderdeel van het besluit op de aanvraag voor een toets nieuwe opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.3
    text: |-
      Alvorens een besluit te nemen op de aanvraag stelt het accreditatieorgaan binnen een door hem te bepalen termijn
      het instellingsbestuur in de gelegenheid zijn zienswijze over het voorgenomen besluit naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.10.4
    text: |-
      Gelijktijdig met de bekendmaking aan het instellingsbestuur van het besluit op de aanvraag, publiceert het
      accreditatieorgaan het besluit op een voor ieder kenbare wijze.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.10
  - number: 5.11.1
    text: |-
      Accreditatie bestaande opleiding kan worden verkregen door een opleiding waaraan accreditatie nieuwe opleiding
      is verleend en waarvan de kwaliteit voor het eind van de accreditatietermijn van accreditatie nieuwe opleiding
      is beoordeeld op de kwaliteitsaspecten, genoemd in [artikel 5.12][ref1], overeenkomstig de procedure genoemd in
      [artikel 5.13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.11.2
    text: |-
      Accreditatie bestaande opleiding wordt de eerste keer verleend op aanvraag van het instellingsbestuur, die voor
      een door het accreditatieorgaan te bepalen datum moet worden ingediend, rekening houdend met de periode waarin
      visitatie, binnen de visitatiegroep waartoe de opleiding behoort, doorgaans plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
  - number: 5.11.3
    text: Indien van toepassing vermeldt het instellingsbestuur bij de aanvraag tevens de door hem beoogde gewijzigde
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
  - number: 5.11.3.a
    text: naam van de opleiding; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
  - number: 5.11.3.b
    text: |-
      toevoeging aan de graad als bedoeld in [artikel 7.10a, tweede en derde lid][ref1], voor zover het een opleiding in
      het hoger beroepsonderwijs betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5.11.4
    text: |-
      Het instellingsbestuur verstrekt bij de aanvraag, de delen van het visitatierapport, genoemd in
      [artikel 5.13, vierde lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.12'
    text: |-
      In het kader van een aanvraag voor accreditatie bestaande opleiding wordt de kwaliteit van de opleiding beoordeeld
      aan de hand van de volgende kwaliteitsaspecten:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.a
    text: het beoogde eindniveau van de opleiding, gelet op hetgeen internationaal gewenst en gangbaar is;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.b
    text: de inhoud en opzet van het onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.c
    text: de kwaliteit van het docententeam;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.d
    text: |-
      de opleidingsspecifieke voorzieningen alsmede de instellingsbrede voorzieningen die van invloed zijn op
      de kwaliteit van de opleiding, daaronder mede begrepen voldoende studiebegeleiding en voorzieningen die de
      toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.e
    text: |-
      de vormgeving en effectiviteit van de interne kwaliteitszorg gericht op de systematische verbetering van de
      opleiding;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.f
    text: het gerealiseerde eindniveau, gelet op hetgeen internationaal gewenst en gangbaar is; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.12.g
    text: de deugdelijkheid van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.12
  - number: 5.13.1
    text: |-
      Onverminderd [artikel 1.18][ref1], draagt het instellingsbestuur er zorg voor dat de kwaliteit van de opleiding ter
      verkrijging van accreditatie bestaande opleiding wordt gevisiteerd, in samenwerking met andere instellingen binnen
      de visitatiegroep. Daarbij bevordert het instellingsbestuur een brede inbreng van studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5.13.2
    text: |-
      De visitatie wordt uitgevoerd door de commissie van deskundigen, bedoeld in
      [artikel 5.2, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.13.3
    text: |-
      De visitatie vindt plaats op basis van een zelfevaluatie van de opleiding door het instellingsbestuur die in
      beginsel een door studenten aan de opleiding geschreven bijdrage bevat.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
  - number: 5.13.4
    text: 'Van de visitatie wordt door de commissie van deskundigen een rapport opgesteld. Het visitatierapport bevat:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
  - number: 5.13.4.a
    text: |-
      een oordeel over de kwaliteitsaspecten, genoemd in [artikel 5.12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.13.4.b
    text: een samenvatting van de beoordeling, alsmede een eindoordeel;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
  - number: 5.13.4.c
    text: een bijlage waarin de aanbevelingen voor verdere ontwikkeling van de opleiding zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
  - number: 5.13.5
    text: |-
      Het visitatierapport wordt door het instellingsbestuur binnen een week nadat het dit rapport van de commissie
      van deskundigen heeft ontvangen, verstrekt aan de universiteitsraad, bedoeld in [artikel 9.31][ref1], dan wel de
      faculteitsraad, bedoeld in [artikel 9.37][ref2], of de medezeggenschapsraad, bedoeld in [artikel 10.17][ref3],
      of aan de ondernemingsraad en het orgaan binnen de universiteit of de hogeschool, dat op grond van de
      medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid][ref4], [artikel 10.16a, derde lid][ref5],
      respectievelijk [artikel 11.13][ref6] is ingesteld, en aan de opleidingscommissie, bedoeld in [artikel 9.18][ref7],
      [artikel 10.3c][ref8] respectievelijk [artikel 11.11][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref9]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
