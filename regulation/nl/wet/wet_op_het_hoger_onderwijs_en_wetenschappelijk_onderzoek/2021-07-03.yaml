  - number: 15.7.2
    text: |-
      Het is verboden titels, genoemd in de [artikelen 7.20][ref1], [7.22, tweede lid][ref2], en [7a.5][ref3], te
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
