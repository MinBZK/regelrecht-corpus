  - number: '18.68'
    text: |-
      Indien op de dag voorafgaand aan de inwerkingtreding van artikel I, onderdeel AH, van de wet van 4 februari
      2010 (Stb. 119) voor een opleiding toepassing is gegeven aan [artikel 5a.12, eerste of vijfde lid][ref1], zoals
      die bepaling op die dag luidde, geldt voor die opleiding de redelijke termijn zoals die door de instelling is
      vastgesteld.


