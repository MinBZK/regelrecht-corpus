        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7d.a
    text: |-
      de opleiding dan wel het programma binnen een opleiding, bedoeld in [artikel 6.7, tweede lid][ref1], niet langer
      voldoet aan het aspect, bedoeld in artikel 6.7, derde lid, onder a;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7d
    references:
