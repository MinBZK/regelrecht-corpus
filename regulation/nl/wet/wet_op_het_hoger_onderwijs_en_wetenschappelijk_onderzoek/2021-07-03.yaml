    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.22.l
    text: |-
      welke van de geschillen tussen het instellingsbestuur en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen waarbij de hogeschool is aangesloten, wie het geschil
      aanhangig kan maken en of daarbij de commissie om bemiddeling dan wel een oordeel wordt verzocht, voorzover de
      commissie voor geschillen waarbij de hogeschool is aangesloten, in haar reglement daarvoor de mogelijkheid biedt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.22
  - number: '10.23'
    text: |-
      Indien een te nemen beslissing op grond van het bepaalde in het medezeggenschapsreglement krachtens
      [artikel 10.22, onder b][ref1], vooraf voor advies dient te worden voorgelegd aan de medezeggenschapsraad, draagt
      het instellingsbestuur onderscheidenlijk de raad van toezicht er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.23.a
    text: advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de besluitvorming,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.23
  - number: 10.23.b
    text: de raad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.23
  - number: 10.23.c
    text: |-
      de raad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte advies
      gevolg wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.23
  - number: 10.23.d
    text: |-
      de raad, indien het instellingsbestuur onderscheidenlijk de raad van toezicht het advies niet of niet geheel wil
      volgen, in de gelegenheid wordt gesteld nader overleg met hem te voeren alvorens de beslissing definitief wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.23
  - number: 10.24.1
    text: |-
      Het instellingsbestuur behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en
      door het personeel is gekozen, voor elke door het instellingsbestuur te nemen beslissing met betrekking tot
      aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel in de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.24
  - number: 10.24.2
    text: |-
      Het instemmingsrecht in aangelegenheden als bedoeld in het eerste lid wordt niet uitgeoefend voorzover de
      desbetreffende aangelegenheid voor de hogeschool reeds inhoudelijk is geregeld in een bij of krachtens de wet
      gegeven voorschrift of bij of krachtens collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.24
  - number: 10.24.3
    text: |-
      Alvorens tot benoeming of ontslag van een lid van het instellingsbestuur wordt overgegaan, wordt de
      medezeggenschapsraad, dan wel het orgaan binnen de hogeschool dat op grond van de medezeggenschapsregeling,
      bedoeld in [artikel 10.16a, derde lid, tweede volzin][ref1], daartoe is aangewezen, vertrouwelijk gehoord over het
      voorgenomen besluit tot benoeming of ontslag. Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke
      invloed kan zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.25.1
    text: |-
      Een deelraad oefent tegenover het bestuur van een faculteit of een andere organisatorische eenheid het
      instemmingsrecht en het adviesrecht uit dat toekomt aan de medezeggenschapsraad, voorzover het aangelegenheden
      betreft die het desbetreffende deel van de hogeschool in het bijzonder aangaan, en de desbetreffende bevoegdheden
      tevens aan het bestuur van die faculteit of andere organisatorische eenheid zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.25
  - number: 10.25.2
    text: |-
      [Artikel 10.17, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.1
    text: |-
      De geschillencommissie medezeggenschap, bedoeld in [artikel 9.39][ref1], is bevoegd ten aanzien van geschillen
      binnen de hogescholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 10.26.2
    text: |-
      De [artikelen 9.39][ref1], [9.40][ref2] en [9.46][ref3] zijn van overeenkomstige toepassing op de hogescholen, met
      dien verstande dat daarin onder «medezeggenschapsorgaan» wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 10.26.2.a
    text: de gezamenlijke vergadering,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
  - number: 10.26.2.b
    text: de ondernemingsraad,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
  - number: 10.26.2.c
    text: |-
      het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 10.16a, derde lid, tweede volzin][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.2.d
    text: de medezeggenschapsraad,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
  - number: 10.26.2.e
    text: |-
      de deelraad, bedoeld in [artikel 10.25][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.2.f
    text: de opleidingscommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.26
  - number: 10.34.1
    text: |-
      Het instellingsbestuur stelt het personeel en de studenten in de gelegenheid om desgewenst onderscheidenlijk een
      personeelscommissie dan wel afzonderlijke commissies voor onderscheiden personeelscategorieën of -groeperingen,
      en een studentencommissie in te stellen. Een dergelijke commissie is bevoegd desgevraagd of eigener beweging
      advies uit te brengen aan de medezeggenschapsraad over die aangelegenheden die de desbetreffende commissie in het
      bijzonder aangaan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.34
  - number: 10.34.2
    text: |-
      Op verzoek van een commissie stelt de medezeggenschapsraad het instellingsbestuur in kennis van een schriftelijk
      advies als bedoeld in het eerste lid. [Artikel 10.19, tweede lid, derde volzin][ref1], is ten aanzien van een
      dergelijk schriftelijk advies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.37'
    text: |-
      Indien bijzondere omstandigheden een goede toepassing van een of meer onderdelen van deze titel in een hogeschool
      of in een aantal hogescholen die door dezelfde rechtspersoon met volledige rechtsbevoegdheid in stand worden
      gehouden, in de weg staan, kan Onze Minister op verzoek van het instellingsbestuur toestaan, dat wat betreft een of
      meer onderdelen op de door hem aangewezen wijze wordt afgeweken van deze titel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.37
  - number: 10.38.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging, die aan de hogeschool ten
      grondslag ligt, kan Onze Minister op verzoek van het college van bestuur van een bijzondere hogeschool ontheffing
      verlenen van de voorschriften van deze titel. Het college van bestuur toont bij zijn verzoek aan dat dit verzoek
      wordt ondersteund door een meerderheid van twee derden zowel van het personeel van de hogeschool als van de bij de
      hogeschool betrokken studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.38
  - number: 10.38.2
    text: |-
      Onze Minister verklaart de ontheffing vervallen, indien de gronden waarop zij berustte, niet meer aanwezig zijn dan
      wel indien zij niet meer wordt ondersteund door een meerderheid van twee derden van elk van de in het eerste lid
      bedoelde categorieën.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.38
  - number: 10.38.3
    text: |-
      Het college van bestuur doet elke vijf jaren aan Onze Minister mededeling omtrent de stand van zaken met betrekking
      tot de gronden van de ontheffing en de ondersteuning ervan.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.38
  - number: 10.39.1
    text: |-
      Het instellingsbestuur staat de medezeggenschapsraad het gebruik toe van de voorzieningen waarover het kan
      beschikken, en die de raad voor de vervulling van zijn taak redelijkerwijs nodig heeft waaronder in ieder geval
      worden verstaan ambtelijke, financiële en juridische ondersteuning en scholing. Het instellingsbestuur stelt de
      medezeggenschapsraad in de gelegenheid zoveel mogelijk tijdens werktijd te vergaderen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.39
  - number: 10.39.2
    text: |-
      Het instellingsbestuur stelt de leden van de medezeggenschapsraad een scholingsbudget ter beschikking, dat wordt
      vastgesteld door het instellingsbestuur en de raad gezamenlijk. Het personeel van de hogeschool wordt in de
      gelegenheid gesteld deze scholing in werktijd en met behoud van salaris te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.39
  - number: 10.39.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op deelraden en opleidingscommissies.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel10.39
  - number: 11.1.1
    text: |-
      Het college van bestuur van de Open Universiteit is belast met het bestuur van de Open Universiteit in haar geheel
      en met het beheer daarvan, onverminderd de bevoegdheden van de raad van toezicht volgens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.1
  - number: 11.1.2
    text: De voorzitter van het college van bestuur vertegenwoordigt de Open Universiteit in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.1
  - number: 11.2.1
    text: |-
      Het college van bestuur bestaat uit ten hoogste drie leden, waaronder de voorzitter. Bij de benoeming wordt zoveel
      mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.2
    text: De benoeming van de leden van het college van bestuur geschiedt op basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.3
    text: |-
      Voor het benoemen van een lid van het college van bestuur stelt de raad van toezicht een sollicitatiecommissie in
      waarvan in elk geval deel uitmaken:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.3.a
    text: |-
      een lid van of namens het deel van de universiteitsraad dat uit en door het personeel is gekozen, of indien
      het college van bestuur heeft besloten dat de [Wet op de ondernemingsraden][ref1] met uitzondering van
      [hoofdstuk VII B][ref2] van toepassing is, een lid van of namens de ondernemingsraad, en


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 11.2.3.b
    text: |-
      een lid van of namens het deel van de universiteitsraad dat uit en door studenten is gekozen, of een lid van of
      namens het orgaan dat op grond van een door het college van bestuur vastgestelde medezeggenschapsregeling ten
      behoeve van de studenten van de Open Universiteit is ingesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.4
    text: Een lid van het college van bestuur kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.5
    text: |-
      Indien het college van bestuur slechts uit de voorzitter bestaat, regelt de raad van toezicht de vervanging van de
      voorzitter bij diens afwezigheid of ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.6
    text: Een lid van het college van bestuur kan niet tevens lid zijn van een ander bestuursorgaan van de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.2.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.2
  - number: 11.3.1
    text: |-
      Het college van bestuur stelt het bestuurs- en beheersreglement ter regeling van het bestuur, het beheer en de
      inrichting van de Open Universiteit vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.3
  - number: 11.3.2
    text: |-
      In het reglement worden regels vastgesteld omtrent de totstandkoming van de onderwijs- en examenregeling, bedoeld
      in [artikel 7.13][ref1]. Deze regels betreffen in elk geval de aanwijzing van het orgaan dat de onderwijs- en
      examenregeling vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 11.4.1
    text: Het college van bestuur is verantwoording verschuldigd aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.4
  - number: 11.4.2
    text: |-
      Het college van bestuur verstrekt de raad van toezicht de gevraagde inlichtingen betreffende zijn besluiten en
      andere handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.4
  - number: 11.4.3
    text: Het college van bestuur verstrekt Onze Minister de gevraagde inlichtingen omtrent de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.4
  - number: 11.5.1
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.5.2
    text: |-
      De voorzitter en de andere leden van de raad van toezicht worden door Onze Minister benoemd, geschorst en
      ontslagen. Een van de leden wordt benoemd op voordracht van de universiteitsraad dan wel, indien het college van
      bestuur heeft besloten dat de [Wet op de ondernemingsraden][ref1] met uitzondering van [hoofdstuk VII B][ref2]
      van toepassing is, de gezamenlijke vergadering van de ondernemingsraad en het orgaan dat op grond van een
      door het college van bestuur vastgestelde medezeggenschapsregeling ten behoeve van de studenten van de Open
      Universiteit is ingesteld. De voordracht bevat ten minste twee namen. Indien de voorgedragen kandidaten niet door
      Onze Minister worden benoemd, wordt een nieuwe voordracht gedaan. Onze Minister kan gemotiveerd afwijken van de
      tweede voordracht. Bij de benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van
      de zetels over mannen en vrouwen. Onze Minister benoemt een lid dat in het bijzonder het vertrouwen geniet van de
      universiteitsraad dan wel, indien het college van bestuur heeft besloten dat de Wet op de ondernemingsraden met
      uitzondering van hoofdstuk VII B van toepassing is, de gezamenlijke vergadering van de ondernemingsraad en het
      orgaan dat op grond van een door het college van bestuur vastgestelde medezeggenschapsregeling ten behoeve van
      de studenten van de Open Universiteit is ingesteld. De benoeming geschiedt voor een periode van ten hoogste vier
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 11.5.3
    text: Een lid kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.5.4
    text: |-
      De samenstelling, taken en bevoegdheden van de raad van toezicht zijn zodanig dat de raad een deugdelijk en
      onafhankelijk toezicht kan uitoefenen. De leden van de raad van toezicht hebben geen directe belangen bij de open
      Universiteit. De leden van de raad zijn niet tevens werkzaam bij een ministerie dan wel lid van de Eerste of Tweede
      Kamer der Staten-Generaal. Zij hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last of
      ruggespraak. De benoeming van de leden van de raad geschiedt op basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.5.5
    text: |-
      De universiteitsraad dan wel de ondernemingsraad en het orgaan binnen de universiteit dat op grond van de
      medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld, wordt of worden
      in de gelegenheid gesteld om aan de raad van toezicht advies uit te brengen over de profielen bedoeld in het vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 11.5.6
    text: |-
      Het college van bestuur voorziet in de functioneel onafhankelijke administratieve ondersteuning van de raad van
      toezicht. De raad van toezicht heeft instemmingsrecht ten aanzien van de benoeming en het ontslag van de secretaris
      van de administratieve ondersteuning.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.5.7
    text: |-
      Het college van bestuur woont de vergaderingen van de raad van toezicht bij, tenzij de raad anders beslist. Het
      college van bestuur heeft daarin een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.5.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.5
  - number: 11.6.1
    text: |-
      De raad van toezicht houdt, met het oog op de taken van de Open Universiteit, bedoeld in
      [artikel 1.3, vierde lid][ref1], toezicht op de uitvoering van werkzaamheden en de uitoefening van bevoegdheden
      door het college van bestuur en staat dit college met raad ter zijde. De raad van toezicht is in elk geval belast
      met:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.6.1.a
    text: het benoemen, schorsen, ontslaan en vaststellen van de beloning van de leden van het college van bestuur;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
  - number: 11.6.1.b
    text: het goedkeuren van het bestuurs- en beheersreglement;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
  - number: 11.6.1.c
    text: het goedkeuren van de begroting, de jaarrekening, het bestuursverslag en het instellingsplan;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
  - number: 11.6.1.d
    text: |-
      indien van toepassing, het goedkeuren van een gemeenschappelijke regeling als bedoeld in [artikel 8.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 11.6.1.e
    text: |-
      het toezien op de naleving door het college van bestuur van wettelijke verplichtingen en de omgang met de
      branchecode, bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.1.f
    text: |-
      het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen verkregen op grond van de [artikelen 2.5][ref1] en [2.6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.1.g
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de raad;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 11.6.1.h
    text: |-
      het toezien op de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.6.1.i
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met h, in het bestuursverslag van de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
  - number: 11.6.2
    text: |-
      De raad van toezicht pleegt ten minste twee keer per jaar overleg met de medezeggenschapsraad dan wel de
      ondernemingsraad en het orgaan binnen de instelling dat op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 11.7.1
    text: De raad van toezicht is verantwoording verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7
  - number: 11.7.2
    text: De raad van toezicht verschaft Onze Minister de gevraagde inlichtingen betreffende zijn handelen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7
  - number: 11.7a.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de raad van
      toezicht een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor
      zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.2
    text: 'Onder wanbeheer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.2.a
    text: financieel wanbeleid;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 1.18][ref1], maatregelen te treffen die
      noodzakelijk zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de instelling en om
      te voorkomen dat de kwaliteit van het stelsel van hoger beroepsonderwijs dan wel het wetenschappelijk onderwijs in
      gevaar komt;.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.7a.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de instelling in stand houdt, een
      bestuurder of toezichthouder zelf dan wel een derde;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.2.d
    text: |-
      onrechtmatig handelen waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      instelling in stand houdt, een bestuurder of toezichthouder zelf dan wel een derde, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen binnen de instelling, waaronder wordt verstaan intimidatie of bedreiging van personeel of
      studenten door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.4
    text: Een aanwijzing bevat de termijn waarbinnen de raad van toezicht aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.5
    text: 'Voordat Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 12a van de Wet op het onderwijstoezicht][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 12a
  - number: 11.7a.5.b
    text: |-
      heeft de inspectie daarover een rapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 11.7a.5.c
    text: |-
      stelt Onze Minister de raad van toezicht vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: 11.7a.6
    text: |-
      Indien het onderzoek, bedoeld in het vijfde lid, onder a, mede de kwaliteit van het onderwijs omvat, betrekt de
      inspectie het accreditatieorgaan bij haar onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.7a
  - number: '11.8'
    text: In het bestuurs- en beheersreglement wordt geregeld welke opleidingen door de Open Universiteit worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.8
  - number: 11.9.1
    text: |-
      Tot het personeel van de Open Universiteit behoren in elk geval de hoogleraren. In het benoemingsbesluit wordt
      vermeld het wetenschapsgebied waarop de hoogleraar zijn onderwijs- en onderzoektaken uitoefent.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.9
  - number: 11.9.2
    text: |-
      De hoogleraren zijn bij uitstek verantwoordelijk voor de ontwikkeling van het hun toegewezen wetenschapsgebied en
      voor de inhoud van het te geven onderwijs op dat gebied, onverminderd de bevoegdheid van het college van bestuur
      terzake van de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.9
  - number: 11.9.3
    text: Eervol ontslagen hoogleraren behouden nog gedurende vijf jaren na hun ontslag het recht als promotor op te treden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.9
  - number: 11.9.4
    text: |-
      De hoogleraren zijn gerechtigd de titel professor te voeren. De oud-hoogleraren aan wie om gezondheidsredenen,
      wegens vrijwillig vervroegd uittreden dan wel bij of na het bereiken van de voor de openbare dienst geldende
      functionele leeftijdsgrens eervol ontslag als hoogleraar is verleend, zijn eveneens gerechtigd deze titel te
      voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.9
  - number: 11.10.1
    text: |-
      Aan de Open Universiteit is een college voor promoties verbonden. Het college voor promoties bestaat uit
      hoogleraren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.10
  - number: 11.10.2
    text: |-
      Het college voor promoties hoort de raad van toezicht over het verlenen van de graad, bedoeld in
      [artikel 7.19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 11.10.3
    text: |-
      In het bestuurs- en beheersreglement worden de taak, de samenstelling en de wijze van benoeming van het college
      voor promoties nader geregeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.10
  - number: 11.11.1
    text: |-
      Voor elke opleiding of groep van opleidingen wordt door het college van bestuur een opleidingscommissie ingesteld.
      De commissie heeft tot taak te adviseren over het bevorderen en waarborgen van de kwaliteit van de opleiding.
      De commissie heeft voorts instemmingsrecht ten aanzien van de onderwerpen in de onderwijs- en examenregeling,
      bedoeld in [artikel 7.13, tweede lid, onder a1, b, c, d, e, g en v][ref1] en adviesrecht ten aanzien van de
      vaststelling of wijziging van de overige onderdelen. Zij beoordeelt jaarlijks de wijze van uitvoering van
      die regeling en brengt advies uit over de regeling. De commissie bespreekt het visitatierapport, bedoeld in
      [artikel 5.13, vierde lid][ref2]. De commissie brengt bovendien desgevraagd of uit eigen beweging advies uit aan
      het orgaan, bedoeld in [artikel 11.3, tweede lid][ref3], over alle aangelegenheden die betrekking hebben op of
      van invloed zijn op het onderwijs in de desbetreffende opleiding of groep van opleidingen. De commissie zendt
      haar adviezen ter kennisneming aan de universiteitsraad dan wel, indien het college van bestuur heeft besloten
      dat de [Wet op de ondernemingsraden][ref4] met uitzondering van [hoofdstuk VII B][ref5] van toepassing is, de
      gezamenlijke vergadering van de ondernemingsraad en het orgaan dat op grond van een door het college van bestuur
      vastgestelde medezeggenschapsregeling ten behoeve van de studenten van de Open Universiteit is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002747
      [ref5]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002747
      - id: ref5
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 11.11.2
    text: |-
      Op een advies, bedoeld in het eerste lid, is [artikel 9.35, aanhef en onderdelen b, c en d][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 11.11.3
    text: |-
      [Artikel 9.18, derde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '11.12'
    text: |-
      De [artikelen 9.53 tot en met 9.58][ref1] zijn van overeenkomstige toepassing op de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 11.13.1
    text: |-
      Op de medezeggenschap zijn de [artikelen 9.30 tot en met 9.36][ref1] en [9.48][ref2] van overeenkomstige toepassing
      met dien verstande dat onder instellingscollegegeld wordt verstaan collegegeld OU.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 11.13.2
    text: |-
      Het college van bestuur behoeft voorts de voorafgaande instemming van de universiteitsraad dan wel, indien
      het college van bestuur heeft besloten dat de [Wet op de ondernemingsraden][ref1] met uitzondering van
      [hoofdstuk VII B][ref2] van toepassing is, de gezamenlijke vergadering van de ondernemingsraad en het orgaan dat op
      grond van een door het college van bestuur vastgestelde medezeggenschapsregeling ten behoeve van de studenten van
      de Open Universiteit is ingesteld, voor elk door hem te nemen besluit met betrekking tot ten minste de vaststelling
      of wijziging van de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref3], met uitzondering van de
      onderwerpen, genoemd in het tweede lid, onder a tot en met g, met uitzondering van de aanwijzing, bedoeld in het
      derde lid, en met uitzondering van de eisen, [artikel 7.30b, tweede volzin][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 11.13.3
    text: |-
      Indien het college van bestuur besluit dat de [Wet op de ondernemingsraden][ref1] niet van toepassing is op de Open
      Universiteit is in afwijking van [artikel 9.30, vierde lid, paragraaf 2 van titel 2 van hoofdstuk 9][ref2] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 11.13.4
    text: Het aantal leden van de universiteitsraad van de Open Universiteit bedraagt ten hoogste achttien.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.13
  - number: 11.16.1
    text: |-
      De geschillencommissie medezeggenschap, bedoeld in [artikel 9.39][ref1], is bevoegd ten aanzien van geschillen
      binnen de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 11.16.2
    text: |-
      [Hoofdstuk 9, titel 2, paragraaf 3][ref1] en [artikel 9.46][ref2] zijn van overeenkomstige toepassing op de Open
      Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel11.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: '12.1'
    text: |-
      Dit hoofdstuk is, met uitzondering van [artikel 12.18][ref1], van toepassing op de academische ziekenhuizen bij
      openbare universiteiten en wat betreft de [artikelen 12.2][ref2] en [12.18][ref3] op de academische ziekenhuizen
      bij bijzondere universiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
  - number: 12.2.1
    text: |-
      Bij het bestuur en de inrichting van het academisch ziekenhuis wordt voorzover de belangen van de patiënten dat
      toelaten, rekening gehouden met de belangen van het wetenschappelijk geneeskundig onderwijs en onderzoek bij de
      universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.2
  - number: 12.2.2
    text: |-
      In het bijzonder worden hoogleraren van de faculteit der geneeskunde, wier vakgebied hen daarvoor in aanmerking
      doet komen, alsmede de andere leden van het wetenschappelijk personeel die op het desbetreffende vakgebied
      werkzaam zijn, in de gelegenheid gesteld tot het geven van wetenschappelijk geneeskundig onderwijs en het doen van
      wetenschappelijk geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.2
  - number: 12.3.1
    text: De bestuursorganen van het academisch ziekenhuis zijn de raad van bestuur en de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.3
  - number: 12.3.2
    text: |-
      Aan de raad van bestuur behoort de bevoegdheid tot regeling en bestuur van de zaken van het academisch ziekenhuis
      in zijn geheel, voorzover deze niet bij of krachtens deze wet aan de raad van toezicht is opgedragen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.3
  - number: 12.3.3
    text: |-
      De raad van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur zijn
      opgedragen, voorzover bij of krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.3
  - number: 12.3.4
    text: |-
      Tegen een beslissing op grond van [artikel 1.14, eerste lid][ref1], houdende vaststelling van het deel van de
      rijksbijdrage voor de universiteit waarop het academisch ziekenhuis aanspraak heeft, kan beroep worden ingesteld
      door het college van bestuur van de universiteit waaraan het academisch ziekenhuis is verbonden in overeenstemming
      met de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 12.4.1
    text: |-
      De raad van bestuur bestaat uit een voorzitter en twee andere leden. In bijzondere gevallen kan Onze Minister
      bepalen dat de raad van bestuur uit een voorzitter en drie andere leden bestaat. In gevallen waarin toepassing is
      gegeven aan de tweede volzin, geeft de stem van de voorzitter de doorslag indien in de raad van bestuur de stemmen
      staken.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.4
  - number: 12.4.2
    text: De voorzitter en de andere leden worden door de raad van toezicht benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.4
  - number: '12.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.5
  - number: 12.6.1
    text: 'Onverminderd hetgeen overigens bij of krachtens deze wet is bepaald, is de raad van bestuur belast met:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
  - number: 12.6.1.a
    text: |-
      het vaststellen van het bestuursreglement, bedoeld in [artikel 12.7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.6.1.b
    text: het vaststellen van de begroting,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
  - number: 12.6.1.c
    text: het vaststellen van het bestuursverslag, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
  - number: 12.6.1.d
    text: het vaststellen van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
  - number: 12.6.2
    text: |-
      De raad van bestuur doet ten behoeve van het academisch ziekenhuis de noodzakelijke uitgaven binnen de grenzen van
      de begroting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.6
  - number: '12.7'
    text: Het bestuursreglement bevat een nadere regeling van het bestuur en de inrichting van het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.7
  - number: '12.8'
    text: |-
      De raad van bestuur is verantwoording verschuldigd aan de raad van toezicht. De raad van bestuur verstrekt de raad
      van toezicht de gevraagde inlichtingen betreffende het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.8
  - number: 12.9.1
    text: De voorzitter van de raad van bestuur vertegenwoordigt het academisch ziekenhuis in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.9
  - number: 12.9.2
    text: |-
      De raad van bestuur wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.9
  - number: 12.10.1
    text: |-
      De raad van toezicht bestaat uit vijf of zeven leden. Het aantal leden wordt door Onze Minister na overleg met de
      raad van toezicht bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.10
  - number: 12.10.2
    text: |-
      De voorzitter en de andere leden worden door Onze Minister benoemd, geschorst en ontslagen. De benoeming geschiedt
      voor een termijn van ten hoogste vier jaren, de raad van toezicht gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.10
  - number: 12.10.3
    text: De leden kunnen tussentijds, ook op eigen verzoek, worden ontslagen, de raad van toezicht gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.10
  - number: 12.10.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.10
  - number: 12.10.5
    text: |-
      De raad van toezicht wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.10
  - number: '12.11'
    text: |-
      De raad van toezicht nodigt de raad van bestuur uit om de vergadering van de raad van toezicht geheel of
      gedeeltelijk bij te wonen, tenzij de raad van toezicht in een bepaald geval bij met redenen omkleed besluit anders
      beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.11
  - number: 12.12.1
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde is de raad van toezicht belast met het houden van een
      voortdurend toezicht op al wat het academisch ziekenhuis aangaat, daaronder begrepen het toezicht op de naleving
      van de op het academisch ziekenhuis betrekking hebbende wetten alsmede van de krachtens die wetten uitgevaardigde
      regelingen, richtlijnen, aanwijzingen en reglementen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.12
  - number: 12.12.2
    text: |-
      Het bestuursreglement, de begroting, de jaarrekening en het bestuursverslag behoeven de goedkeuring dan wel de
      instemming van de raad van toezicht. De goedkeuring dan wel de instemming wordt verleend of onthouden in zijn
      geheel dan wel met betrekking tot een of meer onderdelen. Indien binnen vier weken na ontvangst van een besluit als
      bedoeld in de eerste volzin, door de raad van toezicht niet anders is beslist is het besluit goedgekeurd dan wel
      wordt daarmee ingestemd. De raad van toezicht kan deze termijn verlengen tot ten hoogste acht weken. De goedkeuring
      kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.12
  - number: 12.12.3
    text: |-
      Indien binnen een door de raad van toezicht te bepalen termijn het bestuursreglement niet of niet volledig is
      vastgesteld, kan de raad van toezicht het bestuursreglement of het ontbrekende gedeelte daarvan vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.12
  - number: '12.13'
    text: |-
      De raad van toezicht is verantwoording verschuldigd aan Onze Minister. Hij verstrekt Onze Minister de gevraagde
      inlichtingen betreffende zijn handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.13
  - number: '12.15'
    text: |-
      Met inachtneming van het bepaalde bij of krachtens de [Wet toelating zorginstellingen][ref1] beslist de raad van
      bestuur, na overleg met het college van bestuur van de universiteit waaraan het ziekenhuis is verbonden, welke
      afdelingen en andere onderdelen het academisch ziekenhuis omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.15
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 12.16.1
    text: |-
      Onverminderd de verantwoordelijkheid van de raad van bestuur berust de verantwoordelijkheid voor de geneeskundige
      behandeling en verzorging der patiënten bij de hoofden van de desbetreffende afdelingen. Zij nemen daarbij de
      organisatorische en financiële kaders als aangegeven door de raad van bestuur in acht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.16.2
    text: |-
      De afdelingshoofden worden als zodanig benoemd en ontslagen door de raad van bestuur. Tot afdelingshoofd wordt,
      in het algemeen, slechts benoemd een hoogleraar van de faculteit der geneeskunde, wiens vakgebied hem daarvoor in
      aanmerking doet komen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.16.3
    text: |-
      De in [artikel 12.2, tweede lid][ref1], bedoelde hoogleraren, niet zijnde afdelingshoofd, en andere leden van
      het wetenschappelijk personeel waarvan de functie meebrengt dat zij mede worden belast met patiëntenzorg behoeven
      tevens een aanstelling bij het academisch ziekenhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 12.16.4
    text: |-
      De benoeming en het ontslag van de in het tweede en derde lid bedoelde personen aan de universiteit behoeven de
      instemming van de raad van bestuur. De benoeming en het ontslag van de in het tweede en derde lid bedoelde personen
      aan het academisch ziekenhuis behoeven de instemming van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.16.5
    text: |-
      De raad van bestuur stelt in overeenstemming met het college van bestuur voor de in het tweede en derde lid
      bedoelde personen een instructie vast. In de instructie, bedoeld in de eerste volzin, wordt ten aanzien van de in
      het tweede en derde lid bedoelde personen, in ieder geval bepaald:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.16.5.a
    text: |-
      de wijze waarop de wederzijdse bevoegdheden van de raad van bestuur en het college van bestuur ten aanzien van die
      personen worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.16.5.b
    text: |-
      of het rechtspositieregime dat geldt voor het personeel van de universiteit dan wel het rechtspositieregime dat
      geldt voor het personeel van het academisch ziekenhuis van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.16
  - number: 12.17.1
    text: |-
      Er is een stafconvent, dat overeenkomstig in het bestuursreglement te stellen regelen medewerkt aan het bestuur van
      het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.17
  - number: 12.17.2
    text: |-
      De samenstelling van het stafconvent wordt vastgesteld in het bestuursreglement met dien verstande, dat de
      afdelingshoofden in elk geval zitting hebben in dit convent.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.17
  - number: 12.17.3
    text: |-
      De leden van het stafconvent kiezen uit hun midden een voorzitter en een secretaris overeenkomstig in het
      bestuursreglement te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.17
  - number: 12.18.1
    text: |-
      De besturen van de rechtspersonen met volledige rechtsbevoegdheid waarvan de bijzondere universiteiten waaraan
      een academisch ziekenhuis is verbonden uitgaan, stellen regelen vast inzake het bestuur en de inrichting van hun
      academisch ziekenhuis. Bij de vaststelling van de regelen inzake het bestuur en de inrichting van het academisch
      ziekenhuis wordt [paragraaf 2][ref1] in acht genomen voorzover de eigen aard van het bijzonder academisch
      ziekenhuis zich daartegen naar het oordeel van het bestuur niet verzet. Zij brengen die regelen alsmede wijzigingen
      daarvan zo spoedig mogelijk ter kennis van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.18.2
    text: |-
      De regelen alsmede de wijzigingen daarvan, bedoeld in het eerste lid, voldoen aan de in
      [artikel 1.14, tweede lid, onder c][ref1], bedoelde voorwaarde, indien Onze Minister niet binnen drie maanden na
      de ontvangst van de mededeling bij een aan het bestuur gericht aangetekend schrijven heeft verklaard van oordeel te
      zijn, dat het bestuur bij de vaststelling van de regelen of de wijziging daarvan op door hem aan te wijzen punten
      [paragraaf 2][ref2] niet in acht heeft genomen en daartoe in redelijkheid geen beroep heeft kunnen doen op de eigen
      aard van het bijzonder academisch ziekenhuis die zich tegen inachtneming daarvan zou verzetten, of dat onvoldoende
      aannemelijk heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.18.3
    text: |-
      De in het eerste lid bedoelde besturen geven aan Onze Minister de nodige inlichtingen omtrent het academisch
      ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.18
  - number: 12.18.4
    text: |-
      De werking van het besluit van Onze Minister, bedoeld in het tweede lid, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.18
  - number: 12.19.1
    text: |-
      De universiteit en het daaraan verbonden academisch ziekenhuis richten gezamenlijk een gemeenschappelijk
      beleidsorgaan op.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.19
  - number: 12.19.2
    text: |-
      Het gemeenschappelijk beleidsorgaan heeft tot taak een doelmatige samenwerking op het terrein van het
      wetenschappelijk geneeskundig onderwijs en onderzoek tussen de universiteit en het academisch ziekenhuis te
      bevorderen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.19
  - number: 12.20.1
    text: |-
      De oprichting van een gemeenschappelijk beleidsorgaan geschiedt bij een gemeenschappelijke regeling, die
      wordt getroffen door het college van bestuur en de raad van bestuur, na overleg met de universiteitsraad of
      ondernemingsraad, onderscheidenlijk de raad van toezicht. De gemeenschappelijke regeling wordt door het college van
      bestuur en de raad van toezicht gezamenlijk aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.20
  - number: 12.20.2
    text: Onder het treffen van een gemeenschappelijke regeling wordt mede verstaan het wijzigen van die regeling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.20
  - number: 12.20.3
    text: |-
      De gemeenschappelijke regeling voorziet in de samenstelling, de bevoegdheden, de taken en de werkwijze van het
      gemeenschappelijk beleidsorgaan met inachtneming van het in deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.20
  - number: 12.20.4
    text: |-
      In de gemeenschappelijke regeling wordt bepaald op welke wijze geschillen omtrent de uitvoering of toepassing
      daarvan worden beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.20
  - number: '12.21'
    text: |-
      Een universiteit en het daaraan verbonden academisch ziekenhuis voeren overleg over de onderlinge afstemming van
      hun werkzaamheden op het gebied van het wetenschappelijk geneeskundig onderwijs en onderzoek. Het gemeenschappelijk
      beleidsorgaan stelt het document vast, waarin de resultaten van dit overleg zijn vastgelegd. Voorzover de
      universiteit en het academisch ziekenhuis niet binnen redelijke tijd tot overeenstemming hebben kunnen komen, stelt
      het gemeenschappelijk beleidsorgaan zelf de onderlinge afstemming van werkzaamheden, bedoeld in de eerste volzin,
      vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.21
  - number: '12.22'
    text: |-
      Het college van bestuur en de raad van bestuur kunnen bij overeenkomst een gemeenschappelijk uitvoeringsorgaan
      instellen voor de uitvoering van het document, bedoeld in [artikel 12.21][ref1]. Daartoe voorziet de overeenkomst
      in de overdracht van bevoegdheden van het college van bestuur en van de raad van bestuur aan het gemeenschappelijk
      uitvoeringsorgaan. De besluiten van het gemeenschappelijk uitvoeringsorgaan, genomen krachtens enige door het
      college van bestuur overgedragen bevoegdheid kunnen bij koninklijk besluit worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
  - number: '12.23'
    text: |-
      Het bestuur van de faculteit der geneeskunde en de raad van bestuur stellen bij gezamenlijk besluit vast op welke
      wijze zij periodiek overleg voeren over aangelegenheden betreffende het wetenschappelijk geneeskundig onderwijs en
      onderzoek. Het in de eerste volzin bedoelde besluit regelt de samenstelling en de inrichting van het overleg.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel12.23
  - number: 13.1.1
    text: |-
      De bevoegdheid tot regeling en bestuur van de Koninklijke Nederlandse Akademie van Wetenschappen berust bij het
      algemeen bestuur, voorzover die bevoegdheid niet bij of krachtens deze wet aan andere organen van de academie
      is opgedragen. Het algemeen bestuur oefent de taken en bevoegdheden uit die bij of krachtens deze wet aan het
      instellingsbestuur zijn opgedragen, voorzover bij of krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
  - number: 13.1.2
    text: |-
      De leden van de academie vormen de algemene vergadering. De wijze waarop de leden van de academie worden benoemd,
      wordt geregeld in het reglement, bedoeld in [artikel 13.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.1.3
    text: De leden van het algemeen bestuur worden gekozen door en uit de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
  - number: 13.1.4
    text: |-
      Het algemeen bestuur is verantwoording verschuldigd aan de algemene vergadering. Het verstrekt de algemene
      vergadering en Onze Minister de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
  - number: 13.1.5
    text: |-
      Onze Minister kan aan een of meer leden van het algemeen bestuur een bezoldiging of toelage toekennen. Bij of
      krachtens algemene maatregel van bestuur worden regels vastgesteld betreffende de rechtspositie van de leden van
      het algemeen bestuur aan wie een bezoldiging is toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
  - number: 13.1.6
    text: De voorzitter van het algemeen bestuur vertegenwoordigt de academie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.1
  - number: 13.2.1
    text: |-
      Ten behoeve van de nadere regeling van het bestuur en de inrichting van de Koninklijke Nederlandse Akademie van
      Wetenschappen stelt de algemene vergadering met inachtneming van het daaromtrent bij of krachtens deze wet bepaalde
      een reglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.2
  - number: 13.2.2
    text: |-
      Het reglement regelt in elk geval de wijze van benoeming, schorsing en ontslag van de leden van het algemeen
      bestuur alsmede hun vervanging bij afwezigheid of ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.2
  - number: 13.2.3
    text: Het algemeen bestuur zendt het reglement en elke wijziging daarvan ter kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.2
  - number: 13.3.1
    text: |-
      De bevoegdheid tot regeling en bestuur van de Koninklijke Bibliotheek berust bij het algemeen bestuur voorzover
      die bevoegdheid niet bij of krachtens deze wet aan de bibliothecaris is opgedragen. Het algemeen bestuur oefent de
      taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur zijn opgedragen, voorzover bij of
      krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.3.2
    text: |-
      Het algemeen bestuur bestaat uit een voorzitter, tevens lid, en ten hoogste vier andere leden. Het aantal leden
      wordt door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.3.3
    text: |-
      De leden van het algemeen bestuur worden door Onze Minister benoemd, geschorst en ontslagen. De benoeming geschiedt
      voor een door Onze Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.3.4
    text: |-
      De leden van het algemeen bestuur kunnen door Onze Minister, de overige leden van het algemeen bestuur gehoord,
      worden geschorst en tussentijds ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.3.5
    text: |-
      Onze Minister kan aan een of meer leden van het algemeen bestuur een bezoldiging of toelage toekennen. Bij of
      krachtens algemene maatregel van bestuur worden regels vastgesteld betreffen de rechtspositie van de leden van het
      algemeen bestuur aan wie een bezoldiging is toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.3.6
    text: De voorzitter van het algemeen bestuur vertegenwoordigt de bibliotheek in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.3
  - number: 13.5.1
    text: |-
      Binnen het kader van het door het algemeen bestuur vastgestelde beleid berust de leiding van de Koninklijke
      Bibliotheek bij de bibliothecaris.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.5
  - number: 13.5.2
    text: De bibliothecaris heeft tot taak het beleid van het algemeen bestuur voor te bereiden en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.5
  - number: 13.6.1
    text: |-
      Ten behoeve van de nadere regeling van het bestuur en de inrichting van de Koninklijke Bibliotheek stelt het
      algemeen bestuur met inachtneming van het daaromtrent bij of krachtens deze wet bepaalde een reglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.6
  - number: 13.6.2
    text: |-
      Het reglement regelt in elk geval de vervanging van de leden van het algemeen bestuur bij afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.6
  - number: 13.8.1
    text: |-
      Het algemeen bestuur verschaft desgevraagd alsmede uit eigen beweging informatie over de instelling aan
      belanghebbenden en belangstellenden. Het reglement regelt in welke gevallen het verschaffen van informatie
      achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.8
  - number: 13.8.2
    text: |-
      Het algemeen bestuur stelt regels vast voor het berekenen van tarieven bij het op verzoek verschaffen van
      informatie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.8
  - number: 13.9.1
    text: |-
      De besluiten van het algemeen bestuur kunnen bij koninklijk besluit worden vernietigd. Het bepaalde in de eerste
      volzin is van overeenkomstige toepassing op het besluit van de algemene vergadering van de Koninklijke Nederlandse
      Akademie van Wetenschappen tot vaststelling of wijziging van het in [artikel 13.2][ref1] bedoelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.9.2
    text: Het besluit tot schorsing of vernietiging wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.9
  - number: 13.9.3
    text: |-
      Het eerste lid is niet van toepassing op bestuursrechtelijke besluiten van het algemeen bestuur van de Koninklijke
      Bibliotheek. Hierop is [artikel 22 van de Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 13.10.1
    text: |-
      Indien het algemeen bestuur naar het oordeel van Onze Minister zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.10
  - number: 13.10.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het algemeen bestuur
      in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak naar behoren uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.10
  - number: 13.10.3
    text: |-
      Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel13.10
  - number: 14.2.1
    text: |-
      Indien de uitspraak op een beroep tegen een beschikking als bedoeld in de
      [artikelen 6.14, vierde lid, tweede volzin][ref1] en [7.17][ref2], strekt tot registratie of goedkeuring, treden de
      gevolgen daarvan in met ingang van het studiejaar dat aanvangt na het kalenderjaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 14.2.2
    text: |-
      Indien tegen de uitspraak hoger beroep openstaat, wordt de werking van de uitspraak, bedoeld in het eerste
      lid, opgeschort totdat de termijn voor het instellen van hoger beroep is verstreken of, indien hoger beroep is
      ingesteld, op het hoger beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel14.2
  - number: 15.1.1
    text: |-
      Indien een of meer organen van een instelling als bedoeld in [artikel 1.4][ref1], [1.5][ref2] of [1.8][ref3],
      in strijd handelen met het bepaalde bij of krachtens deze wet dan wel indien de raad van toezicht een aanwijzing
      als bedoeld in [artikel 9.9a][ref4], [9.51, tweede lid, zesde volzin][ref5], [10.3e][ref6] onderscheidenlijk
      [11.7a][ref7] of het bestuur een aanwijzing als bedoeld in artikel 9.51, achtste lid, niet opvolgt, kan Onze
      Minister bepalen dat de rijksbijdrage, een voorschot daaronder begrepen, geheel of gedeeltelijk wordt ingehouden
      dan wel wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
