        bwb_id: BWBR0008365
        artikel: '5'
  - number: 6.11.4
    text: Over de samenstelling, werkwijze en bezoldiging van de commissie worden regels gesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.11
  - number: 6.13.1
    text: |-
      Het Centraal register opleidingen hoger onderwijs is een systematisch geordende verzameling gegevens met betrekking
      tot de opleidingen die door de instellingen voor hoger onderwijs verzorgd worden. Onze Minister is belast met de
      aanleg, het beheer en de bekendmaking van het register en met het verstrekken van informatie uit het register.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
  - number: 6.13.3
    text: |-
      Bij algemene maatregel van bestuur worden de inrichting en de werking van het Centraal register opleidingen hoger
      onderwijs geregeld. Deze bevat bepalingen omtrent het verstrekken van informatie uit het register. Daarbij kan
      worden bepaald dat voor het verstrekken van informatie aan anderen dan de besturen van de instellingen waarop
      deze wet betrekking heeft, een in de algemene maatregel van bestuur vastgestelde vergoeding verschuldigd is. De
      algemene maatregel van bestuur bevat de indeling van het register in onderdelen en voorzover nodig subonderdelen.
      De onderdelen betreffen gebieden van onderwijs. De indeling bevat ten minste onderdelen voor de volgende gebieden
      van onderwijs: onderwijs, landbouw en natuurlijke omgeving, techniek, recht, taal en cultuur, en gezondheidszorg.
      De indeling bevat voorts voor het onderdeel onderwijs in elk geval het subonderdeel lerarenopleidingen op het
      gebied van de kunst en voor het onderdeel taal en cultuur in elk geval het subonderdeel opleidingen op het gebied
      van de kunst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
  - number: 6.13.4
    text: |-
      Het Centraal register opleidingen hoger onderwijs bevat van elke opleiding als bedoeld in [artikel 7.3a][ref1] de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
