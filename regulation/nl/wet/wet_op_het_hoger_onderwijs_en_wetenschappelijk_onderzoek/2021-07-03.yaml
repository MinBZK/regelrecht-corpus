  - number: '1.10'
    text: |-
      De bepalingen in deze wet die het openbaar hoger onderwijs regelen, gelden voor het bekostigde bijzonder hoger
      onderwijs als bekostigingsvoorwaarden, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.10
  - number: 1.12.1
    text: |-
      Aan de met goed gevolg afgelegde examens van initiële opleidingen, verzorgd door rechtspersonen voor hoger
      onderwijs, is een graad als bedoeld in [artikel 7.10a][ref1] verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.12.2
    text: |-
      Voorwaarde voor het bepaalde in het eerste lid is dat de desbetreffende rechtspersoon in acht neemt hetgeen is
      bepaald in het derde lid, alsmede hetgeen is bepaald bij of krachtens deze wet ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12.2.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12.2.b
    text: de registratie, het onderwijs en de examens,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12.2.c
    text: de vooropleidingseisen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12.2.d
    text: het gebruik van het persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12.3
    text: |-
      Het bestuur van de rechtspersoon verstrekt Onze Minister de nodige inlichtingen omtrent de rechtspersoon. Het
      bestuur van de rechtspersoon doet Onze Minister jaarlijks een verslag toekomen omtrent de werkzaamheden van de
      rechtspersoon en betrekt daarbij de uitkomsten van kwaliteitsbeoordeling als bedoeld in [artikel 1.18][ref1],
      alsmede andere gegevens omtrent de kwaliteit van de werkzaamheden van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.12.4
    text: |-
      Onder de nodige inlichtingen, bedoeld in het derde lid, eerste volzin, worden in ieder geval begrepen informatie
      over wijzigingen in de eigendomsverhoudingen, de financiële soliditeit of de bestuursstructuur van de rechtspersoon
      alsmede alle wijzigingen van de gegevens betreffende de rechtspersoon bij de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12
  - number: 1.12a
    text: |-
      Aan de met goed gevolg afgelegde examens van een postinitiële masteropleiding, verzorgd door
      rechtspersonen voor hoger onderwijs is een mastergraad als bedoeld in [artikel 7.10a][ref1] verbonden.
      [Artikel 1.12, tweede, derde en vierde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.12a
