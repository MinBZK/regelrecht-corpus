  - number: 6.10.2
    text: |-
      Een besluit op grond van het eerste lid houdt in dat aan de examens van de desbetreffende opleiding of van alle
      opleidingen geen graad als bedoeld in [artikel 7.10a][ref1] is verbonden, dat de registratie in het Centraal
      register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref2], wordt beëindigd en dat de instelling
      niet meer het recht heeft zich universiteit te noemen, als bedoeld in [artikel 1.22, eerste lid][ref3], dan wel
      hogeschool als bedoeld in [artikel 1.23, eerste lid][ref4].


