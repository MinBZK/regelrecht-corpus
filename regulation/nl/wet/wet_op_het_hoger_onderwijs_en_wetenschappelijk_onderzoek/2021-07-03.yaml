        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7d.c
    text: de kwaliteit of de toegankelijkheid van het hoger onderwijs in gevaar komt; of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.7d
  - number: 6.7d.d
    text: |-
      het instellingsbestuur de verplichtingen, bedoeld in [artikel 6.7a][ref1], niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
