    text: |-
      Een student is voor elk studiejaar dat hij door het instellingsbestuur voor een opleiding is ingeschreven,
      aan de desbetreffende instelling volledig, gedeeltelijk of verlaagd wettelijk collegegeld als bedoeld in de
      [artikelen 7.45][ref1] en [7.45a][ref2] of instellingscollegegeld als bedoeld in [artikel 7.46][ref3] verschuldigd.
      Een student die door het instellingsbestuur van de Open Universiteit voor een onderwijseenheid is ingeschreven, is
      het collegegeld OU, bedoeld in [artikel 7.45b][ref4], verschuldigd.


