      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 18.64.2
    text: |-
      Onder de opleidingen, bedoeld in het eerste lid, worden mede begrepen de opleidingen die zijn ingesteld en
      geregistreerd in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], dan wel tijdig
      voor registratie in dat register zijn aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.64
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.65.1
    text: |-
      Aan de opleidingen die tot 1 januari 2006 werden verzorgd door de instelling, bedoeld in
      [artikel 16.21, eerste lid, onderdeel a, onder 1°][ref1], en met ingang van die datum worden verzorgd door de
      bijzondere universiteit te Tilburg, blijft de verleende accreditatie verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.65
    references:
