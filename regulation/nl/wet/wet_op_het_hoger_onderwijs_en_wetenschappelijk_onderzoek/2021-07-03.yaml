  - number: 6.14.1
    text: |-
      Het instellingsbestuur doet een aanvraag tot registratie van een opleiding waaraan accreditatie
      is verleend. Indien er sprake is van het ongedaan maken van een samenvoeging als bedoeld in
      [artikel 6.2, vijfde lid, onderdeel b][ref1], doet het instellingsbestuur een nieuwe aanvraag tot registratie
      van de oorspronkelijke opleidingen. Voor zover er sprake is van het behoud van accreditatie bestaande
      opleiding doet het accreditatieorgaan een melding tot het registreren van de bevestiging, bedoeld in
      [artikel 5.16, derde lid][ref2], en het daarbij vermelden van de datum waarop het eerstvolgende visitatierapport
      moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.14
