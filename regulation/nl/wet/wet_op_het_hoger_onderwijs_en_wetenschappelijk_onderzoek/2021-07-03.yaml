  - number: '18.90'
    text: |-
      In afwijking van [artikel 5.14, eerste lid, onderdeel c][ref1], richt de commissie van deskundigen, van wie het
      accreditatieorgaan heeft ingestemd met de samenstelling overeenkomstig [artikel 5a.2, tweede lid][ref2], zoals
      dat luidde op de dag voorafgaand aan de datum van inwerkingtreding van de [Wet accreditatie op maat][ref3],
      zijn werkzaamheden in overeenkomstig [artikel 1.18][ref4], zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van de Wet accreditatie op maat.


