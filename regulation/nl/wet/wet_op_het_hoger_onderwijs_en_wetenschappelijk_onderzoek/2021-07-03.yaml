  - number: 6.10.4
    text: |-
      Voordat Onze Minister een besluit op grond van het eerste lid neemt, geeft hij het instellingsbestuur een
      waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en desgewenst
      overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg moet zijn
      gegeven, bedraagt ten minste drie maanden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.10
  - number: 6.10.5
    text: |-
      Indien Onze Minister een besluit als bedoeld in het eerste lid heeft genomen ten aanzien van alle opleidingen
      verzorgd door de desbetreffende rechtspersoon, kan deze rechtspersoon slechts opnieuw graden als bedoeld in
      [artikel 7.10a][ref1] verlenen na toepassing van [artikel 6.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
