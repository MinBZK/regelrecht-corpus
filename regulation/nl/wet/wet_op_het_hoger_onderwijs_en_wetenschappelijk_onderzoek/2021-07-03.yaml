  - number: 7.13.2.h
    text: het aantal en de volgtijdelijkheid van de tentamens alsmede de momenten waarop deze afgelegd kunnen worden,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.i
    text: de voltijdse, deeltijdse of duale inrichting van de opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.j
    text: |-
      waar nodig, de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat de gelegenheid
