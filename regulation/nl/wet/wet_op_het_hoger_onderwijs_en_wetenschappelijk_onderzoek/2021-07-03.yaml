  - number: 7.23.1
    text: |-
      Degene aan wie op grond van een examen aan een niet in Nederland gevestigde instelling voor hoger onderwijs
      een graad is verleend en die gerechtigd is die graad in het desbetreffende land in de eigen naamsvermelding tot
      uitdrukking te brengen, is eveneens gerechtigd die graad in Nederland in de eigen naamsvermelding tot uitdrukking
      te brengen op dezelfde wijze als in het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23
  - number: 7.23.2
    text: |-
      Degene aan wie op grond van een examen in Nederland een graad is verleend na het volgen van een opleiding die is
      geaccrediteerd door een niet in Nederland gevestigde accreditatieorganisatie, is gerechtigd die graad in de eigen
      naamsvermelding tot uitdrukking te brengen op dezelfde wijze als in het land waar de accreditatieorganisatie is
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23
  - number: 7.23.3
    text: |-
      Onze Minister kan aan degene aan wie op grond van een examen aan een niet in Nederland gevestigde instelling
      voor hoger onderwijs een graad is verleend, toestaan om in Nederland in plaats van die graad een van de titels,
      genoemd in [artikel 7.20][ref1], in de eigen naamsvermelding tot uitdrukking te brengen, indien de opleiding
      op grond waarvan de graad is verleend, naar het oordeel van Onze Minister ten minste gelijkwaardig is aan een
      overeenkomstige Nederlandse opleiding. Deze bepaling is van overeenkomstige toepassing indien het een graad betreft
      als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.4
    text: |-
      Onze Minister kan bij ministeriële regeling opleidingen en examens van niet in Nederland gevestigde instellingen
      voor hoger onderwijs aanwijzen, waarvan degenen aan wie op grond daarvan een graad is verleend, tevens gerechtigd
      zijn in plaats van die graad in Nederland een van de titels, genoemd in [artikel 7.20][ref1], te voeren. In de
      ministeriële regeling wordt bepaald in welke gevallen welke titel mag worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.5
    text: |-
      Voor de toepassing van dit artikel wordt onder «het verlenen van een graad» mede begrepen het verkrijgen van een
      titel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23
  - number: 7.23a.1
    text: |-
      Degene aan wie door een niet in Nederland gevestigde universiteit de graad Doctor of «Doctor of Philosophy» is
      verleend op grond van een promotie of de graad Doctor honoris causa wegens zeer uitstekende verdiensten, en die
      gerechtigd is op grond daarvan die graad in het desbetreffende land in de eigen naamsvermelding tot uitdrukking te
      brengen, is eveneens gerechtigd die graad in Nederland in de eigen naamsvermelding tot uitdrukking te brengen op
      dezelfde wijze als in het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23a
  - number: 7.23a.2
    text: |-
      Degene aan wie aan een universiteit, die in Nederland is gevestigd als nevenvestiging van een buitenlandse
      universiteit, de graad Doctor of «Doctor of Philosophy» is verleend op grond van een promotie of de graad Doctor
      honoris causa wegens zeer uitstekende verdiensten, is gerechtigd die graad in de eigen naamsvermelding tot
      uitdrukking te brengen op dezelfde wijze als in het land waar de hoofdvestiging van de desbetreffende universiteit
      is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23a
  - number: 7.23a.3
    text: |-
      Onze Minister kan toestaan aan degene aan wie aan een niet in Nederland gevestigde universiteit de graad Doctor
      of «Doctor of Philosophy» is verleend op grond van een promotie of de graad Doctor honoris causa wegens zeer
      uitstekende verdiensten, om in Nederland in plaats van die graad de titel doctor in de eigen naamsvermelding tot
      uitdrukking te brengen. Deze bepaling is van overeenkomstige toepassing indien het een graad betreft als bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23a
  - number: 7.23a.4
    text: |-
      Onze Minister kan bij ministeriële regeling niet in Nederland gevestigde universiteiten aanwijzen, waarvan degene
      aan wie aan die universiteit de graad Doctor of «Doctor of Philosophy» is verleend, tevens gerechtigd is in plaats
      van die graad in Nederland de titel doctor te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.23a
  - number: 7.23a.5
