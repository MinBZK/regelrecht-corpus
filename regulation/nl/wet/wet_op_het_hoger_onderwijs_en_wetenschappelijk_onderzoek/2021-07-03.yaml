  - number: '18.92'
    text: |-
      In afwijking van [artikel 5.23, derde lid][ref1], worden aanvragen voor een instellingstoets kwaliteitszorg,
      ingediend voorafgaand aan de inwerkingtreding van de [Wet accreditatie op maat][ref2], beoordeeld overeenkomstig
      de kwaliteitsaspecten, genoemd in [artikel 5a.13b, tweede lid][ref3], zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van de Wet accreditatie op maat.


