  - number: 15.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien het instellingsbestuur, het personeel van een instelling of
      het accreditatieorgaan in strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.1.3
    text: |-
      Onze Minister kent de rijksbijdrage wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.1
  - number: '15.2'
    text: |-
      Degene die niet is ingeschreven en gebruikmaakt van onderwijs- of examenvoorzieningen ten behoeve van onderwijs
      van een in de bijlage van deze wet opgenomen instelling, is deswege aan die instelling een schadevergoeding
      verschuldigd, die door het instellingsbestuur wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.2
  - number: 15.2.a
    text: |-
      met toepassing van [artikel 7.46, tweede lid][ref1], indien het deelname aan een voltijdse opleiding betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 15.2.b
    text: |-
      met toepassing van [artikel 7.45, tweede lid][ref1], indien het deelname aan een deeltijdse of duale opleiding
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Degene die niet is ingeschreven en gebruikt maakt van onderwijs- of examenvoorzieningen ten behoeve van initieel
      onderwijs van een in de bijlage van deze wet opgenomen instelling, wordt gestraft met geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.3
  - number: 15.4.1
    text: |-
      Degene die aan onderwijs- of examenvoorzieningen ten behoeve van initieel onderwijs aan een in de bijlage van deze
      wet opgenomen instelling deelneemt, is verplicht bij die gelegenheid of onmiddellijk daarna op eerste vordering van
      of vanwege het instellingsbestuur aan dat bestuur dan wel aan een door dat bestuur aangewezen persoon of personen
      zijn naam en adres bekend te maken en het bewijs waaruit blijkt dat hij gerechtigd is daaraan deel te nemen,
      behoorlijk ter inzage te geven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.4
  - number: 15.4.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.4
  - number: '15.5'
    text: |-
      Degene die aan een in de bijlage van deze wet genoemde instelling meewerkt aan het afgeven van een getuigschrift
      zonder dat ten aanzien van degene die het desbetreffende examen of onderzoek met goed gevolg heeft afgelegd
      onderscheidenlijk heeft ondergaan, door het instellingsbestuur is verklaard dat het getuigschrift kan worden
      afgegeven, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.5
  - number: '15.6'
    text: |-
      De in de [artikelen 15.3][ref1], [15.4][ref2] en [15.5][ref3] strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel15
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.7.1
    text: 'Het is verboden graden te verlenen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
  - number: 15.7.1.a
    text: aan de opleiding accreditatie is verleend, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
  - number: 15.7.1.b
    text: |-
      toepassing is gegeven aan [artikel 5.21, derde of zesde lid][ref1], of [artikel 5.32][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 15.7.1.c
    text: |-
      de graad wordt verleend op grond van een buitenlandse wettelijke regeling en zowel bij het aantrekken van studenten
      als bij de graadverlening kenbaar is gemaakt tot welke graad de opleiding leidt en op grond van welke buitenlandse
      regeling de graad wordt verleend, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
  - number: 15.7.1.d
    text: |-
      de graad wordt verleend op grond van [artikel 7.18, eerste of zesde lid][ref1], of de uitzondering, bedoeld in
      [artikel 1.22, tweede lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
    references:
