  - number: '7.2'
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.2
  - number: 7.2.a
    text: wanneer het een opleiding met betrekking tot die taal betreft,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.2
  - number: 7.2.b
    text: wanneer het onderwijs betreft dat in het kader van een gastcollege door een anderstalige docent gegeven wordt, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.2
  - number: 7.2.c
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de studenten
      daartoe noodzaakt, overeenkomstig een door het instellingsbestuur vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.2
  - number: 7.3.1
    text: Het onderwijs wordt door de instelling aangeboden in de vorm van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
  - number: 7.3.2
    text: |-
      Een opleiding is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking van welomschreven
      doelstellingen op het gebied van kennis, inzicht en vaardigheden waarover degene die de opleiding voltooit, dient
      te beschikken. Een onderwijseenheid kan betrekking hebben op de praktische voorbereiding op de beroepsuitoefening
      en op de beroepsuitoefening in verband met het onderwijs in een duale opleiding, voorzover deze activiteiten onder
      begeleiding van het instellingsbestuur plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
  - number: 7.3.3
    text: Aan elke opleiding is een examen verbonden. Aan elke onderwijseenheid is een tentamen verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
  - number: 7.3.4
    text: |-
      Elke opleiding wordt op de voet van [titel 3 van hoofdstuk 6][ref1] geregistreerd in het Centraal register
      opleidingen hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 7.3.5
    text: |-
      Het examen, bedoeld in het derde lid, dat met goed gevolg is afgelegd en de met het oog daarop vervaardigde
      werkstukken worden door het instellingsbestuur gedurende een periode van ten minste zeven jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
  - number: 7.3.6
    text: |-
      Indien het instellingsbestuur besluit een opleiding, te beëindigen, worden de aan die opleiding ingeschreven
      studenten in de gelegenheid gesteld hun opleiding zonder onderbreking bij die instelling te vervolgen. Daarbij
      wordt een termijn in acht genomen die ten hoogste de voor de betrokken studenten resterende, aan de studielast van
      de opleiding gerelateerde studieduur vermeerderd met een jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3
  - number: 7.3a.1
    text: 'Binnen het wetenschappelijk onderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.1.a
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.1.b
    text: masteropleidingen, volgend op de bacheloropleidingen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.2
    text: 'Binnen het hoger beroepsonderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.2.a
    text: associate degree-opleidingen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.2.b
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3a.2.c
    text: masteropleidingen volgend op de bacheloropleidingen, bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3a
  - number: 7.3b
    text: 'Naast de opleidingen, bedoeld in artikel 7.3a, worden binnen het hoger onderwijs onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3b
  - number: 7.3b.a
    text: postinitiële masteropleidingen in het wetenschappelijk onderwijs, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3b
  - number: 7.3b.b
    text: postinitiële masteropleidingen in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3b
  - number: 7.3c.1
    text: |-
      Een instelling voor hoger onderwijs kan gezamenlijk met een of meer Nederlandse of buitenlandse instellingen voor
      hoger onderwijs een opleiding of een afstudeerrichting verzorgen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.2
    text: |-
      Indien een gezamenlijke opleiding of een gezamenlijke afstudeerrichting uitsluitend door Nederlandse instellingen
      voor hoger onderwijs wordt verzorgd, is daaraan een gezamenlijke graad verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.3
    text: |-
      Indien een gezamenlijke opleiding of een gezamenlijke afstudeerrichting mede door een buitenlandse instelling voor
      hoger onderwijs wordt verzorgd, kan daaraan een gezamenlijke graad of kunnen daaraan twee of meer afzonderlijke
      graden worden verbonden, afhankelijk van het aantal daarbij betrokken instellingen voor hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.4
    text: |-
      Een instelling voor hoger onderwijs kan uitsluitend gezamenlijk met een buitenlandse instelling voor hoger
      onderwijs een opleiding of een afstudeerrichting verzorgen, indien het instellingsbestuur met betrekking tot dat
      onderwijs met de buitenlandse instelling voor hoger onderwijs een overeenkomst heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5
    text: |-
      In de overeenkomst, bedoeld in het vierde lid, maakt het instellingsbestuur in ieder geval afspraken met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5.a
    text: de inhoud van het gezamenlijke onderwijs;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5.b
    text: de onderscheiden onderwijsactiviteiten van de betrokken instellingen voor hoger onderwijs daarbij;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5.c
    text: de wijze van graadverlening;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5.d
    text: de inschrijving van studenten; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3c.5.e
    text: de collegegeldverplichtingen voor studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.3c
  - number: 7.3d.1
    text: |-
      In geval een Nederlandse instelling voor hoger onderwijs gezamenlijk met een of meer andere Nederlandse
      instellingen voor hoger onderwijs een opleiding of een afstudeerrichting verzorgt, zijn die instellingsbesturen
      gezamenlijk verantwoordelijk voor de naleving van de [artikelen 5.6][ref1], [5.11][ref2], [6.2][ref3],
      [6.14][ref4], [7.4a, derde en achtste lid][ref5], [7.4b, vierde lid][ref6], [7.8][ref7], [7.8a][ref8],
      [7.8b][ref9], [7.9][ref10], [7.9a][ref11], [7.9b][ref12], [7.10a][ref13], [7.11][ref14], [7.12a][ref15],
      [7.13][ref16], [7.17][ref17], [7.24 tot en met 7.30d][ref18], [7.32][ref19], [7.37][ref20], [7.42][ref21],
      [7.42a][ref22], [9.18][ref23], [10.3c][ref24] en [11.11][ref25].


