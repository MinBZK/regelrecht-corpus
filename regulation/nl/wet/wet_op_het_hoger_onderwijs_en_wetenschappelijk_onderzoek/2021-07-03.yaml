    text: |-
      Een aanvraag voor een toets nieuw Ad-programma die op het tijdstip van inwerkingtreding van de Wet invoering
      associate degree-opleiding in behandeling is bij het accreditatieorgaan wordt beschouwd als een aanvraag voor een
      toets nieuwe opleiding voor een associate degree-opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.88
  - number: '18.89'
    text: |-
      In afwijking van [artikel 5.13][ref1] en [artikel 9.18][ref2], worden visitaties die op het tijdstip van
      inwerkingtreding van de [Wet accreditatie op maat][ref3] zijn gestart, door een commissie van deskundigen, van wie
      het accreditatieorgaan heeft ingestemd met de samenstelling overeenkomstig [artikel 5a.2, tweede lid][ref4], zoals
      dat luidde op de dag voorafgaand aan de inwerkingtreding van de Wet accreditatie op maat, afgerond overeenkomstig
      [artikel 1.18][ref5], zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van de Wet accreditatie op
      maat.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
