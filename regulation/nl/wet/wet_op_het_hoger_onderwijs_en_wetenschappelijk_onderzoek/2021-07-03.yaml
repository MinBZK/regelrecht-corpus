  - number: 18.73.2
    text: |-
      Voor de zittende leden van het college van beroep voor het hoger onderwijs blijven bij de toepassing van
      [artikel 7.65, eerste lid][ref1], zoals die bepaling luidt na de inwerkingtreding van artikel I, onderdeel CH,
      van de wet van 4 februari 2010 (Stb. 119), de benoemingstermijnen, bedoeld in artikel 7.65, eerste lid, zoals die
      bepaling luidde voor de inwerkingtreding van artikel I, onderdeel CH, van de wet van 4 februari 2010 (Stb. 119),
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.73
    references:
