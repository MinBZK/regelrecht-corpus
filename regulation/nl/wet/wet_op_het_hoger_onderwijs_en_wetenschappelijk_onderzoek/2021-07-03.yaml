      Op het tijdstip van inwerkingtreding van de Wet invoering associate degree-opleiding wordt een Ad-programma
      dat door een instelling wordt verzorgd van rechtswege omgezet in een associate degree-opleiding tenzij het
      instellingsbestuur besluit het Ad-programma met ingang van dat moment te beëindigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.87
  - number: 18.87.2
    text: |-
      Studenten die op het tijdstip van inwerkingtreding van de Wet invoering associate degree-opleiding zijn
      ingeschreven bij een bacheloropleiding en een Ad-programma worden met ingang van dat moment geacht te zijn
      ingeschreven bij de associate degree-opleiding, met dien verstande dat de inschrijving voor de toepassing
      van de Wet studiefinanciering 2000 een inschrijving blijft aan een associate degree-programma als bedoeld in
      [artikel 7.8a][ref1], zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van de Wet invoering associate
      degree-opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.87
