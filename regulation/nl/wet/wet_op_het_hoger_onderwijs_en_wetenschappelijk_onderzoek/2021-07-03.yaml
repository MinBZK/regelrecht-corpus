      van artikel I, onderdeel AP, van de wet van 4 februari 2010 (Stb. 119), waren aangewezen, worden met ingang van de
      datum van inwerkingtreding van artikel I, onderdeel AP, van de wet van 4 februari 2010 (Stb. 119) aangemerkt als
      rechtspersonen voor hoger onderwijs als bedoeld in [artikel 1.1, onder aa][ref2].


