        hoofdstuk: '7'
        paragraaf: '3'
  - number: 18.74.3
    text: |-
      Het instellingsbestuur of de instellingsbesturen verleent respectievelijk verlenen eervol ontslag aan de leden en
      plaatsvervangende leden van het college van beroep bijzonder onderwijs, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.74
  - number: 18.75.1
    text: |-
      Aanvragen om een besluit tot aanwijzing op grond van [artikel 6.9][ref1], zoals dat artikel luidde op de dag
      voorafgaand aan de inwerkingtreding van artikel I, onderdeel AP, van de wet van 4 februari 2010 (Stb. 119) waarop
      nog niet onherroepelijk is beslist, worden behandeld als aanvragen op grond van artikel 6.9 zoals dat artikel luidt
      na inwerkingtreding van artikel I, onderdeel AP, van de wet van 4 februari 2010 (Stb. 119).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
