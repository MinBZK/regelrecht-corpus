  - number: 1.8.1
    text: |-
      De bekostigde instellingen voor hoger onderwijs zijn de instellingen, opgenomen in de bijlage van deze wet onder a
      tot en met i.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.8
  - number: 1.8.2
    text: De in de bijlage van deze wet onder a, c, h en j opgenomen instellingen bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.8
  - number: 1.8.3
    text: |-
      Een wijziging van de statutaire naam van een stichting of vereniging, genoemd in de bijlage, is van kracht met
      ingang van het tijdstip waarop de wijziging schriftelijk aan Onze Minister is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.8
  - number: 1.9.1
    text: |-
      Ten behoeve van het verzorgen van initieel onderwijs en, voorzover het universiteiten betreft, mede ten behoeve
      van het verrichten van wetenschappelijk onderzoek hebben de in de bijlage van deze wet onder a, c, h en j opgenomen
      instellingen, onderscheidenlijk rechtspersonen met volledige rechtsbevoegdheid, waarvan de overige in de bijlage
      van deze wet opgenomen instellingen uitgaan, aanspraak op bekostiging uit ’s Rijks kas, voorzover aan de aan
      die instellingen verbonden opleidingen accreditatie is verleend of die opleidingen de toets nieuwe opleiding met
      positief gevolg hebben ondergaan. Voor de toepassing van dit lid worden de ontwerp- en ontwikkelactiviteiten en
      onderzoek gericht op de beroepspraktijk, aan hogescholen gerekend tot het daarop betrekking hebbende onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.9
  - number: 1.9.2
    text: |-
      Aan de met goed gevolg afgelegde examens van initiële opleidingen, verzorgd door bekostigde instellingen, is een
      graad verbonden. Degenen aan wie een dergelijke graad is verleend onderscheidenlijk degenen die hebben voldaan
      aan de vereisten, gesteld in [artikel 7.18][ref1], zijn gerechtigd in de daarvoor in aanmerking komende gevallen
      de graden, genoemd in de [artikelen 7.10a][ref2] en [7.18][ref3], in de eigen naamsvermelding tot uitdrukking te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel1.9
    references:
      - id: ref1
