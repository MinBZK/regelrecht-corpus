      [artikel 5.16, eerste lid][ref3], of [artikel 5.22, tweede lid][ref4], en het besluit, bedoeld
      in [artikel 6.2, eerste lid][ref5]. Het instellingsbestuur dat een aanvraag doet voor registratie
      van een masteropleiding in het wetenschappelijk onderwijs voegt zo nodig het besluit, bedoeld in
      [artikel 7.4a, vijfde lid, eerste volzin][ref6], toe.


