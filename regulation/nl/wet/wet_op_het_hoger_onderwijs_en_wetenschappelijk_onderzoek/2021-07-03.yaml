  - number: 18.91.2
    text: |-
      Voor opleidingen waarvoor [artikel 5a.12a][ref1], zoals dat luidde op de dag voorafgaand aan de inwerkingtreding
      van de [Wet accreditatie op maat][ref2], is toegepast of waarvoor het visitatieproces voor een accreditatiebesluit
      op grond van [artikel 5a.9][ref3] of [artikel 5a.13f][ref4], zoals die artikelen luidden op de dag voorafgaand aan
      de inwerkingtreding van de Wet accreditatie op maat, op het tijdstip van inwerkingtreding van de Wet accreditatie
      op maat gaande is, blijft [hoofdstuk 5a][ref5] zoals dat luidde op de dag voorafgaand aan de inwerkingtreding
      van de Wet accreditatie op maat van kracht tot het moment waarop het accreditatieorgaan een nieuw besluit heeft
      genomen.


