  - number: 7.22.2
    text: |-
      Degene die op grond van het eerste lid gerechtigd is de in dat lid genoemde graden in de eigen naamsvermelding tot
      uitdrukking te brengen, is tevens gerechtigd de titel doctor of Doctor of Philosophy te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.22
  - number: 7.22.3
    text: |-
      De in het eerste lid genoemde graden worden, aangeduid als D of als PhD, in de naamsvermelding achter de naam
      geplaatst. De in het tweede lid genoemde titels worden, afgekort tot dr., voor de naam of, afgekort tot PhD, achter
      de naam geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.22
  - number: 7.22.4
    text: |-
      De betrokkene maakt een keuze uit het tot uitdrukking brengen in de eigen naamsvermelding van de graad, bedoeld in
      het eerste lid, en het voeren van de titels, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.22
  - number: 7.22a.1
    text: |-
      Degenen die op grond van de [artikelen 7.20][ref1] en [7.22][ref2], zoals die bepalingen op 31 augustus 2002
