        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.44.1
    text: |-
      Een extraneus is voor elk studiejaar dat hij door het instellingsbestuur voor een opleiding is ingeschreven, aan de
      desbetreffende instelling examengeld verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.44
  - number: 7.44.2
    text: Het instellingsbestuur stelt de hoogte van het examengeld vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.44
  - number: 7.44.3
    text: |-
      [Artikel 7.42, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.44
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.45.1
    text: De hoogte van het volledig wettelijk collegegeld wordt bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45.2
    text: |-
      De hoogte van het gedeeltelijk wettelijk collegegeld wordt door het instellingsbestuur vastgesteld en is gelegen
      tussen een minimum- en een maximumbedrag. Deze bedragen worden bij of krachtens algemene maatregel van bestuur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45.3
    text: |-
      Het gedeeltelijk wettelijk collegegeld bedraagt niet meer dan het volledig wettelijk collegegeld of, indien dat op
      een student van toepassing is, niet meer dan het verlaagd wettelijk collegegeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45.4
    text: |-
      Het instellingsbestuur informeert Onze Minister over de hoogte van het bedrag dat het instellingsbestuur op grond
      van het tweede lid heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45.5
    text: |-
      De hoogte van het verlaagd wettelijk collegegeld wordt bij algemene maatregel van bestuur vastgesteld,
      waarbij onderscheid kan worden gemaakt naar opleiding, leerjaar, de wijze waarop een opleiding is ingericht en
      instroomcohort.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45.6
    text: |-
      De bij of krachtens algemene maatregel van bestuur vastgestelde bedragen, bedoeld in het eerste, tweede en vijfde
      lid, worden jaarlijks volgens de consumentenprijsindex geïndexeerd, op de wijze bij of krachtens algemene maatregel
      van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45
  - number: 7.45a.1
    text: |-
      Het wettelijk collegegeld is verschuldigd door een student die tot één van de groepen van personen, bedoeld in
      [artikel 2.2 van de Wet studiefinanciering 2000][ref1] behoort of die de Surinaamse nationaliteit bezit. Voor
      een inschrijving aan een associate degree-opleiding geldt als aanvullende voorwaarde, dat de student blijkens
      het register onderwijsdeelnemers sedert 1 september 1991 niet eerder bij een bekostigde instelling in verband met
      het volgen van initieel onderwijs een graad Associate degree, een graad Bachelor of een graad Master als bedoeld
      in [artikel 7.10a][ref2] heeft behaald. Voor een inschrijving aan een bacheloropleiding geldt als aanvullende
      voorwaarde, dat de student blijkens het register onderwijsdeelnemers sedert 1 september 1991 niet eerder bij een
      bekostigde instelling in verband met het volgen van initieel onderwijs een graad Bachelor als bedoeld in artikel
      7.10a heeft behaald. Voor een inschrijving aan een masteropleiding geldt als aanvullende voorwaarde, dat de student
      blijkens het register onderwijsdeelnemers sedert 1 september 1991 niet eerder bij een bekostigde instelling in
      verband met het volgen van initieel onderwijs een graad Master als bedoeld in artikel 7.10a heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.2
    text: Bij algemene maatregel van bestuur kan de categorie studenten, bedoeld in het eerste lid, worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
  - number: 7.45a.3
    text: |-
      Een student als bedoeld in het eerste en tweede lid, die is ingeschreven voor een voltijdse opleiding is het
      volledig wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid][ref1], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45a.4
    text: |-
      Een student als bedoeld in het eerste en tweede lid, die is ingeschreven voor een deeltijdse of duale opleiding, is
      het gedeeltelijk wettelijk collegegeld, bedoeld in [artikel 7.45, tweede lid][ref1], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45a.5
    text: |-
      Het verlaagd wettelijk collegegeld is verschuldigd door bij algemene maatregel van bestuur te bepalen groepen
      van studenten, waarbij onderscheid kan worden gemaakt naar opleiding, leerjaar, de wijze waarop een opleiding is
      ingericht en het instroomcohort.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
  - number: 7.45a.6
    text: |-
      Indien een student als bedoeld in het eerste en tweede lid meer dan één opleiding volgt en de opleiding waarvoor
      hij het eerst is ingeschreven met goed gevolg afrondt, is deze student het wettelijk collegegeld verschuldigd voor
      het resterende deel van het studiejaar. Het verschuldigde bedrag wordt in dat geval berekend naar rato van het
      aantal resterende maanden van het desbetreffende studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
  - number: 7.45a.7
    text: |-
      Voor de voorwaarden, bedoeld in het eerste lid, wordt met een student die een bachelorgraad als bedoeld in
      [artikel 7.10a][ref1] heeft behaald gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.7.a
    text: |-
      een student die met goed gevolg het afsluitend examen heeft afgelegd van een hogere beroepsopleiding met een
      studielast van 168 studiepunten, volgens de wet zoals die luidde op 31 augustus 2002, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
  - number: 7.45a.7.b
    text: |-
      een student die met goed gevolg het kandidaatsexamen heeft afgelegd van een opleiding in het wetenschappelijk
      onderwijs als bedoeld in [artikel 7.8][ref1], zoals dat artikel luidde op 31 augustus 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.8
    text: |-
      Voor de voorwaarden, bedoeld in het eerste lid, wordt met een student die een bachelor- en mastergraad als bedoeld
      in [artikel 7.10a][ref1] heeft behaald, gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.8.a
    text: |-
      een student die met goed gevolg het afsluitend examen heeft afgelegd van een opleiding in het wetenschappelijk
      onderwijs als bedoeld in [artikel 7.3][ref1], zoals dat artikel luidde op 31 augustus 2002; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.8.b
    text: |-
      een student die op grond van [artikel 18.15][ref1] met goed gevolg het afsluitend examen heeft afgelegd van een
      opleiding in het wetenschappelijk onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
  - number: 7.45a.9
    text: |-
      Voor de voorwaarden, bedoeld in het eerste lid, wordt een student die voor inwerkingtreding van de Wet invoering
      associate degree-opleiding met goed gevolg het afsluitend examen heeft afgelegd van een Ad-programma gelijkgesteld
      met een student die een graad Associate degree heeft behaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45a
  - number: 7.45b.1
    text: |-
      Een student als bedoeld in [artikel 7.45a, eerste en tweede lid][ref1], die is ingeschreven voor een
      onderwijseenheid bij de Open Universiteit, is collegegeld OU verschuldigd ter hoogte van ten minste
      één zestigste deel en ten hoogste één dertigste deel van het volledig wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref2], vermenigvuldigd met het aantal studiepunten dat een onderwijseenheid groot is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.2
    text: |-
      In afwijking van het eerste lid, wordt bij algemene maatregel van bestuur voor de in het eerste lid bedoelde
      studenten een verlaagd collegegeld OU vastgesteld. De artikelen 7.45, zesde lid, en 7.45a, vijfde lid, zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
  - number: 7.45b.3
    text: |-
      Een student die is ingeschreven voor een onderwijseenheid bij de Open Universiteit en die niet voldoet aan de
      voorwaarden, bedoeld in [artikel 7.45a, eerste en tweede lid][ref1], is collegegeld OU verschuldigd ter hoogte van
      ten minste één dertigste deel van het volledig wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid][ref2],
      vermenigvuldigd met het aantal studiepunten dat een onderwijseenheid groot is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.4
    text: |-
      De hoogte van het collegegeld OU wordt door het instellingsbestuur van de Open Universiteit vastgesteld. Voor
      de categorie studenten, bedoeld in het derde lid, kan het instellingsbestuur van de Open Universiteit per
      onderwijseenheid of groep van onderwijseenheden of per groep of groepen studenten een verschillend collegegeld
      OU vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
  - number: 7.45b.5
    text: |-
      Indien een student als bedoeld in het derde lid gedurende een studiejaar alsnog voldoet aan de voorwaarden, bedoeld
      in [artikel 7.45a, eerste en tweede lid][ref1], is hij voor het resterende deel van het studiejaar op zijn verzoek
      het collegegeld OU, bedoeld in het eerste of tweede lid, verschuldigd, en betaalt het instellingsbestuur OU hem het
      hogere collegegeld OU, dat de student voor het restant van het studiejaar heeft betaald, terug.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.6
    text: Het instellingsbestuur van de Open Universiteit stelt regels vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.45b
  - number: 7.46.1
    text: |-
      Een student die niet voldoet aan de voorwaarden, bedoeld in [artikel 7.45a, eerste, tweede en zesde lid][ref1],
      en niet is ingeschreven voor een onderwijseenheid bij de Open Universiteit, is het instellingscollegegeld
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.2
    text: |-
      De hoogte van het instellingscollegegeld wordt door het instellingsbestuur vastgesteld. Het instellingsbestuur kan
      per opleiding of groep van opleidingen of per groep of groepen studenten een verschillend instellingscollegegeld
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.46
  - number: 7.46.3
    text: |-
      Onverminderd [artikel 7.3f][ref1], bedraagt het instellingscollegegeld ten minste het volledig wettelijk
      collegegeld, bedoeld in [artikel 7.45, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.4
    text: |-
      Indien de student, bedoeld in het eerste lid, gedurende een studiejaar alsnog voldoet aan de voorwaarden,
      bedoeld in [artikel 7.45a, eerste, tweede en zesde lid][ref1], is hij voor het resterende deel van het studiejaar
      op zijn verzoek het wettelijk collegegeld verschuldigd en betaalt het instellingsbestuur hem het hogere
      instellingscollegegeld, dat de student voor het restant van het studiejaar heeft betaald, terug.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.5
    text: Het instellingsbestuur stelt regels vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.46
  - number: 7.47.1
    text: 'Het collegegeld wordt door of namens de student voldaan door:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47
  - number: 7.47.1.a
    text: betaling ineens,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47
  - number: 7.47.1.b
    text: betaling in vijf termijnen, op verzoek van degene die zich tot betaling heeft verbonden, dan wel
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47
  - number: 7.47.1.c
    text: |-
      betaling in een ander aantal termijnen overeenkomstig een door het instellingsbestuur en degene die zich tot
      betaling heeft verbonden te treffen betalingsregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47
  - number: 7.47.2
    text: |-
      Indien er sprake is van betaling in termijnen kunnen door het instellingsbestuur administratiekosten in rekening
      worden gebracht tot een bij of krachtens algemene maatregel van bestuur vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47
  - number: 7.47a
    text: |-
      Indien een student bij een instelling is ingeschreven voor een opleiding kan het instellingsbestuur eenmalig en
      voor een periode van één studiejaar die student vrijstellen van het betalen van wettelijk collegegeld, indien die
      student voltijds:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47a
  - number: 7.47a.a
    text: |-
      het lidmaatschap bekleedt van het bestuur van een studentenorganisatie van enige omvang met volledige
      rechtsbevoegdheid, de universiteitsraad, het orgaan dat is ingesteld op grond van de medezeggenschapsregeling,
      bedoeld in [artikel 9.30, derde lid][ref1], of [10.16a, derde lid][ref2], de medezeggenschapsraad, of de
      studentenraad, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 7.47a.b
    text: |-
      activiteiten op bestuurlijk of maatschappelijk gebied ontplooit die naar het oordeel van het instellingsbestuur
      mede in het belang zijn van de instelling of van het onderwijs bij die instelling,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.47a
  - number: 7.48.1
    text: |-
      Indien een student als bedoeld in [artikel 7.45a][ref1] bij een instelling is ingeschreven voor een opleiding en
      aan dezelfde of een andere bekostigde instelling met uitzondering van de Open Universiteit een tweede inschrijving
      wenst, is hij voor de laatstbedoelde inschrijving vrijgesteld van het betalen van collegegeld. Indien het betaalde
      dan wel te betalen bedrag voor de eerste inschrijving lager is dan het volledig wettelijk collegegeld, bedoeld
      in [artikel 7.45, eerste lid][ref2], is het verschil verschuldigd. Bij algemene maatregel van bestuur kan worden
      bepaald dat een student die aanspraak maakt op wettelijk collegegeld op grond van de algemene maatregel van
      bestuur, bedoeld in artikel 7.45a, tweede lid, voor een andere inschrijving niet wordt vrijgesteld van het betalen
      van collegegeld als bedoeld in dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.2
    text: |-
      Degene die voor het volgen van uit de openbare kas bekostigd onderwijs les- of cursusgeld verschuldigd is op grond
      van de [Les- en cursusgeldwet][ref1], en die in plaats daarvan, dan wel daarnaast in hetzelfde studiejaar wenst te
      worden ingeschreven en daarvoor het wettelijk collegegeld, bedoeld in [artikel 7.45, eerste of vijfde lid][ref2],
      is verschuldigd, is voor de inschrijving voor een opleiding aan een bekostigde instelling met uitzondering van
      de Open Universiteit een collegegeld verschuldigd, dat het verschil bedraagt tussen de reeds voldane bijdrage en
      het bedoelde wettelijk collegegeld. Indien hij een collegegeld verschuldigd is dat lager is dan het reeds voldane
      bedrag wordt hij van het betalen van collegegeld vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.3
    text: |-
      Een student is slechts een gedeelte van het door hem verschuldigde wettelijk collegegeld verschuldigd, indien de
      student zich gedurende het studiejaar inschrijft. In dat geval wordt het verschuldigde bedrag berekend naar rato
      van het aantal resterende maanden van het desbetreffende studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
  - number: 7.48.4
    text: |-
      De student heeft aanspraak op terugbetaling van een twaalfde gedeelte van het door hem verschuldigde wettelijk
      collegegeld voor elke maand dat het studiejaar na beëindiging van zijn inschrijving duurt, tenzij een
      betalingsregeling als bedoeld in [artikel 7.47, onderdeel b][ref1], is getroffen. Indien een student in de loop van
      het studiejaar overlijdt, wordt voor elke daaropvolgende maand van het studiejaar na diens overlijden, een twaalfde
      gedeelte van het betaalde wettelijk collegegeld terugbetaald. Bij beëindiging van de inschrijving met ingang van
      juli of augustus heeft de student geen aanspraak op beëindiging van betaling van de termijnen, bedoeld in artikel
      7.47, onderdeel b, en op terugbetaling van het voor die maanden betaalde collegegeld, tenzij het instellingsbestuur
      dat anders heeft geregeld. Dit lid is niet van toepassing op de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.5
    text: |-
      Vermindering of vrijstelling van het wettelijk collegegeld in andere gevallen dan bedoeld in het eerste tot en
      met vierde lid, de [artikelen 7.3f][ref1] of [7.47a][ref2] wordt aangemerkt als niet doelmatige aanwending van de
      rijksbijdrage, bedoeld in [artikel 2.9, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.48.6
    text: |-
      Het instellingsbestuur van de Open Universiteit stelt een regeling vast waarin een voorziening
      in de vorm van een verlaging van het collegegeld OU wordt getroffen, voor studenten als bedoeld
      in [artikel 7.45b, eerste of tweede lid][ref1], van wie het toetsingsinkomen, bedoeld in
      [artikel 8, eerste tot en met zesde lid, van de Algemene wet inkomensafhankelijke regelingen][ref2], minder
      dan 110% van het belastbaar minimumloon bedraagt. In de regeling stelt het instellingsbestuur vast welke
      aanvraagbescheiden moeten worden ingediend. De hoogte van de verlaging, bedoeld in de eerste volzin, is in elk
      geval afhankelijk van het inkomen van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 7.48.7
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting tot betaling van het verschil, bedoeld
      in het eerste lid, tweede volzin, buiten toepassing blijft indien een student voor een van diens inschrijvingen
      verlaagd wettelijk collegegeld verschuldigd is en voorts voldoet aan de daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.48
  - number: 7.49.1
    text: |-
      Het instellingsbestuur stelt in afwijking van [artikel 7.45, eerste lid][ref1], voor
      een opleiding die of voor een experimenteel programma dat is aangewezen op grond van
      [artikel 9 van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref2], een collegegeld
      vast. Het collegegeld bedraagt ten hoogste vijf keer het volledig wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.2
    text: |-
      Het instellingsbestuur draagt tijdig voor de aanvang van het studiejaar zorg voor openbaarmaking van het op grond
      van het eerste lid vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.49
  - number: 7.49.3
    text: |-
      Indien het eerste lid voor een opleiding toepassing heeft gevonden, komt het overeenkomstig het eerste lid
      vastgestelde collegegeld in de plaats van het collegegeld, genoemd in [artikel 7.45, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.4
    text: |-
      [Artikel 7.45, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.5
    text: |-
      [Artikel 7.47][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.50.1
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere geldelijke bijdrage dan de in de
      [artikelen 7.43 tot en met 7.49][ref1] bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.50
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.50.2
    text: |-
      In afwijking van het eerste lid kan bij algemene maatregel van bestuur worden bepaald dat het
      instellingsbestuur met het oog op de inschrijving voor een opleiding als bedoeld in de [artikelen 6.7][ref1],
      [7.26, eerste lid][ref2], [7.26a, eerste lid][ref3], [7.53][ref4] en [7.56][ref5] een bijdrage mag verlangen in
      de kosten die rechtstreeks verband houden met het onderwijs, waaronder worden begrepen de kosten die rechtstreeks
      verband houden met het uitvoeren van selectieprocedures. Bij de algemene maatregel van bestuur, bedoeld in de
      eerste volzin, wordt in ieder geval vastgesteld op welke kostensoorten de bijdrage betrekking heeft en welk bedrag
      ten hoogste verlangd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.50
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.50.3
    text: |-
      Het instellingsbestuur treft voorzieningen tot financiële ondersteuning van degenen voor wie de bijdrage, bedoeld
      in het tweede lid, een onoverkomelijke belemmering voor de inschrijving vormt. Het instellingsbestuur stelt nadere
      regels vast met betrekking tot de toepassing van het tweede lid en met betrekking tot de financiële ondersteuning,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.50
  - number: 7.50a
    text: |-
      De voordracht voor een krachtens [artikel 7.45, vijfde lid][ref1], [7.45a, vijfde lid][ref2],
      [7.45b, tweede lid][ref3], of [7.48, zevende lid][ref4], vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.50a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.51.1
    text: |-
      Het bestuur van een bekostigde instelling voor hoger onderwijs treft voorzieningen voor de financiële ondersteuning
      van een bij die instelling ingeschreven student die in verband met de aanwezigheid van een bijzondere omstandigheid
      studievertraging heeft opgelopen of naar verwachting zal oplopen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2
    text: 'De bijzondere omstandigheden, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.a
    text: |-
      het lidmaatschap van het bestuur van een studentenorganisatie van enige omvang met volledige rechtsbevoegdheid,
      een opleidingscommissie, het bestuur van een opleiding als bedoeld in [artikel 9.17][ref1], de universiteitsraad,
      de faculteitsraad, het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid][ref2], of [10.16a, derde lid][ref3], de medezeggenschapsraad, de deelraad of de
      studentenraad,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 7.51.2.b
    text: |-
      activiteiten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het instellingsbestuur mede in het
      belang zijn van de instelling of van het onderwijs dat de student volgt,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.c
    text: ziekte of zwangerschap en bevalling,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.d
    text: een handicap of chronische ziekte,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.e
    text: bijzondere familieomstandigheden,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.f
    text: een onvoldoende studeerbare opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.g
    text: overige door het instellingsbestuur vastgestelde bijzondere omstandigheden waarin een student verkeert,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51.2.h
    text: |-
      andere dan de in de onderdelen a tot en met g bedoelde omstandigheden die, indien een daarop gebaseerd verzoek
      om financiële ondersteuning door het instellingsbestuur niet zou worden gehonoreerd, zouden leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51
  - number: 7.51a.1
    text: |-
      Het instellingsbestuur treft voorzieningen voor de financiële ondersteuning van een student die
      aan de desbetreffende instelling is ingeschreven voor een opleiding waarop het instellingsbestuur
      [artikel 7.4a, achtste lid][ref1], heeft toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.51a.2
    text: |-
      De duur van de financiële ondersteuning bedraagt de periode die overeenstemt met de studielast die uitgaat boven
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51a
  - number: 7.51b
    text: |-
      Het instellingsbestuur treft voorzieningen voor de financiële ondersteuning van een student die aan de
      desbetreffende instelling is ingeschreven voor een opleiding die accreditatie bestaande opleiding is geweigerd
      als bedoeld in [artikel 5.17, eerste lid][ref1], of waarvan accreditatie is ingetrokken als bedoeld in
      [artikel 5.19][ref2] en [artikel 5.20][ref3] waardoor de student niet langer aanspraak op studiefinanciering maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '5'
        hoofdstuk: '5'
  - number: 7.51c
    text: |-
      Een student komt voor de financiële ondersteuning, bedoeld in de [artikelen 7.51 tot en met 7.51b][ref1],
      uitsluitend in aanmerking, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.51c.a
    text: de student voor de desbetreffende opleiding wettelijk collegegeld is verschuldigd; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51c
  - number: 7.51c.b
    text: |-
      de student voor die opleiding aanspraak heeft of aanspraak heeft gehad op de prestatiebeurs hoger onderwijs als
      bedoeld in de [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51c
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7.51d.1
    text: |-
      Het instellingsbestuur kan voorzieningen treffen voor de financiële ondersteuning van een student die aan de
      desbetreffende instelling is ingeschreven voor een opleiding waarvoor aan hem nog geen graad is verleend, en noch
      tot een van de groepen van personen, bedoeld in [artikel 2.2 van de Wet studiefinanciering 2000][ref1] behoort,
      noch de Surinaamse nationaliteit bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51d
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 7.51d.2
    text: |-
      Het instellingsbestuur kan voorzieningen treffen voor de financiële ondersteuning van een student die buiten
      Nederland hoger onderwijs wenst te volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51d
  - number: 7.51e.1
    text: |-
      Het instellingsbestuur kan voorzieningen treffen voor de financiële ondersteuning van een persoon
      die niet aan de desbetreffende instelling is ingeschreven, maar die, indien hij ingeschreven zou
      staan aan een instelling, aanspraak zou hebben op een vorm van studiefinanciering als bedoeld in
      [artikel 5.2 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 7.51e.2
    text: De financiële ondersteuning, bedoeld in het eerste lid
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
  - number: 7.51e.2.a
    text: heeft de vorm van een overeenkomst,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
  - number: 7.51e.2.b
    text: wordt slechts getroffen voor de periode van een jaar,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
  - number: 7.51e.2.c
    text: |-
      wordt slechts getroffen voor een persoon die naar het oordeel van het instellingsbestuur activiteiten uitvoert op
      bestuurlijk of maatschappelijk gebied die mede in het belang zijn van de instelling en niet commercieel van aard
      zijn, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
  - number: 7.51e.2.d
    text: |-
      bevat in elk geval een regeling op grond waarvan de persoon voor wie de voorziening wordt getroffen toegang heeft
      tot de voorzieningen van de instelling, niet zijnde het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51e
  - number: 7.51f
    text: |-
      De financiële ondersteuning, bedoeld in de [artikelen 7.51 tot en met 7.51e][ref1], is niet hoger dan de
      studiefinanciering die betrokkene geniet uit hoofde van [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2], dan
      wel zou hebben genoten, indien hij daarop aanspraak zou maken of zou hebben mogen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51g
    text: |-
      In aanvulling op de voorzieningen, bedoeld in de [artikelen 7.51 tot en met 7.51e][ref1], kan een voorziening voor
      financiële ondersteuning worden getroffen, die samen met de financiële ondersteuning ingevolge de voorzieningen,
      bedoeld in de artikelen 7.51 tot en met 7.51e, hoger is dan de studiefinanciering die betrokkene geniet uit
      hoofde van [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2], dan wel zou hebben genoten, indien hij daarop
      aanspraak zou maken of zou hebben mogen maken. Deze aanvulling wordt verstrekt onder de benaming: voorziening voor
      aanvullende ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51g
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51h.1
    text: |-
      Het instellingsbestuur stelt regels van procedurele aard vast met betrekking tot de toepassing van de
      [artikelen 7.51 tot en met 7.51d][ref1], waartoe in ieder geval behoren regels over de aanvang, de duur en de
      hoogte van de financiële ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51h
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.51h.2
    text: |-
      Het instellingsbestuur kan aan de toekenning van financiële ondersteuning de verplichting verbinden dat de student
      feitelijk studerend is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51h
  - number: 7.51i
    text: |-
      Het instellingsbestuur stelt de student schriftelijk op de hoogte van de financiële ondersteuning, bedoeld in
      deze paragraaf, waarbij het bedrag van de aanvullende ondersteuning afzonderlijk wordt vermeld. Voorts legt
      het instellingsbestuur de aan de student verstrekte financiële ondersteuning vast in zijn administratie, onder
      vermelding van het burgerservicenummer van de student en de hoogte van het toegekende bedrag, waarbij de hoogte van
      de aanvullende ondersteuning afzonderlijk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51i
  - number: 7.51j
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op een student die aan de Open Universiteit is ingeschreven voor
      een onderwijseenheid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51j
  - number: 7.51k.1
    text: |-
      Onze Minister treft voorzieningen voor de financiële ondersteuning van een student die bestuurslid is van een van
      een rechtspersoon met volledige rechtsbevoegdheid uitgaande politieke jongerenorganisatie van enige omvang of van
      een landelijke organisatie van enige omvang die voor het hoger onderwijs relevante activiteiten ontplooit en die
      daartoe daadwerkelijke activiteiten ontplooit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51k
  - number: 7.51k.2
    text: Bij ministeriële regeling worden de voorwaarden gesteld waaronder deze financiële ondersteuning plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51k
  - number: 7.51k.3
    text: |-
      De [artikelen 7.51g en 7.51i][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.51k
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.52.1
    text: |-
      Het instellingsbestuur kan het persoonsgebonden nummer van een student of extraneus gebruiken in het verkeer met de
      student of extraneus op wie het nummer betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.4
    text: |-
      Het instellingsbestuur kan het persoonsgebonden nummer van een student of extraneus, al dan niet tezamen met een of
      meer van de gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken
      in het verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 7.52.6
    text: |-
      Het instellingsbestuur gebruikt het persoonsgebonden nummer van een student of extraneus in het verkeer met een
      andere instelling of een instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die student
      of extraneus.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.7
    text: |-
      Het instellingsbestuur gebruikt het persoonsgebonden nummer van een student aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.8
    text: |-
      Het instellingsbestuur van een universiteit of hogeschool verstrekt geen persoonsgebonden nummer van een student
      of extraneus ter uitvoering van [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan ter
      nakoming van verplichtingen als referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 7.52.9
    text: |-
      Het instellingsbestuur kan het persoonsgebonden nummer van een student of extraneus eenmalig gebruiken ten behoeve
      van het genereren van een pseudoniem voor deze student of extraneus met het oog op het bieden van voorzieningen in
      het kader van het onderwijs en de begeleiding van studenten of extraneï. Het bevoegd gezag draagt er zorg voor dat
      het pseudoniem wordt bewaard in de systemen waarin de studenten en extraneï zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.10
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het negende lid, gebruiken voor het genereren van een ander
      pseudoniem voor een student of extraneus in het kader van de toegang tot en het gebruik van digitale leermiddelen
      of het digitaal afnemen van tentamens en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere
      pseudoniem wordt bewaard in de systemen waarin de studenten en extraneï zijn geregistreerd. Dit andere pseudoniem
      wordt uitsluitend verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande
      uit leerstof of toetsen en de daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.11
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het tiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het negende lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52.12
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      negende tot en met het elfde lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52
  - number: 7.52c
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52c
  - number: 7.52c.a
    text: '*opleiding:* een associate degree-opleiding of een bacheloropleiding, en'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52c
  - number: 7.52c.b
    text: |-
      propedeutische fase: de propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in een
      opleiding met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.52c
  - number: 7.53.1
    text: |-
      Het instellingsbestuur kan per opleiding in verband met de beschikbare onderwijscapaciteit het maximum
      aantal studenten vaststellen dat voor de eerste maal kan worden ingeschreven voor de propedeutische fase
      van de desbetreffende opleiding. De vaststelling geschiedt voor een studiejaar. Indien in een opleiding geen
      propedeutische fase is ingesteld, wordt onder «propedeutische fase» mede verstaan de fase in een bacheloropleiding
      die samenvalt met de eerste periode in een opleiding met een studielast van 60 punten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.2
    text: |-
      Het instellingsbestuur selecteert de aspirant-studenten in verband met de beschikbare onderwijscapaciteit
      uitsluitend op grond van kwalitatieve criteria. Het aantal soorten kwalitatieve selectiecriteria bedraagt ten
      minste twee.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.3
    text: |-
      Het instellingsbestuur maakt tijdig de kwalitatieve selectiecriteria en de selectieprocedure bekend op grond
      waarvan de toelating zal plaatsvinden ingeval het aantal aspirant-studenten het maximum aantal, bedoeld in het
      eerste lid, zou overschrijden. Het instellingsbestuur stelt daartoe een reglement vast. Bij het vaststellen van het
      reglement houdt het instellingsbestuur rekening met de belangen van aspirant-studenten afkomstig uit de openbare
      lichamen Bonaire, Sint Eustatius en Saba onderscheidenlijk Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.4
    text: |-
      Het instellingsbestuur schrijft niet meer studenten in dan het maximum aantal dat het instellingsbestuur in verband
      met de beschikbare capaciteit heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.5
    text: |-
      Indien ten aanzien van een opleiding een ministeriële regeling als bedoeld in [artikel 7.56][ref1] is vastgesteld,
      blijft dit artikel buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.53.6
    text: |-
      Voor 1 december van het kalenderjaar voorafgaande aan het studiejaar waarvoor de eerste vaststelling geschiedt,
      doet het instellingsbestuur hiervan mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.7
    text: 'Bij ministeriële regeling kunnen in ieder geval voorschriften worden vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.7.a
    text: de aanmeldingsdatum voor selectie; en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
  - number: 7.53.7.b
    text: |-
      indien een opleiding door meer dan één instelling als bedoeld in [artikel 1.2, onder a][ref1], wordt verzorgd, het
      aantal selectieprocedures van een bepaalde opleiding waaraan een gegadigde in hetzelfde studiejaar kan deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 7.54.1
    text: |-
      Het instellingsbestuur kan, indien het van oordeel is dat de onderwijscapaciteit, die voor de postpropedeutische
      fase van een opleiding, waarvoor een beperking van de eerste inschrijving is vastgesteld, niet toereikend is voor
      een onbeperkte inschrijving, besluiten inschrijving voor de postpropedeutische fase van die opleiding te weigeren
      aan hen, die niet reeds ingeschreven zijn geweest aan die aan de instelling verbonden opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.54
  - number: 7.54.2
    text: |-
      In dit artikel wordt, indien in een opleiding geen propedeutische fase is ingesteld, onder «postpropedeutische
      fase» mede verstaan de fase in een bacheloropleiding die volgt op de eerste periode in een opleiding met een
      studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.54
  - number: '7.55'
    text: |-
      Het instellingsbestuur van de Open Universiteit kan de inschrijvingsmogelijkheid voor een bepaalde opleiding
      of onderwijseenheid opschorten voorzover en voor zolang de organisatorische en technische capaciteit voor het
      verzorgen van deze opleiding of onderwijseenheid daartoe naar zijn oordeel noodzaakt. Met inachtneming van de in de
      eerste volzin bedoelde beperkingen geschiedt de inschrijving in de volgorde van aanmelding voor de desbetreffende
      opleiding of onderwijseenheid, volgens door het instellingsbestuur vast te stellen regels van procedurele aard.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.55
  - number: 7.56.1
    text: |-
      Indien het aanbod van afgestudeerden van een bepaalde opleiding de behoefte daaraan op de arbeidsmarkt in
      aanmerkelijke mate overtreft of dreigt te overtreffen en in andere situaties waarin dit in verband met beheersing
      van de arbeidsmarkt wenselijk wordt geacht, kan bij ministeriële regeling het aantal personen worden vastgesteld
      dat voor de twee studiejaren na vaststelling van de ministeriële regeling ten hoogste voor de eerste maal
      kan worden ingeschreven voor het eerste studiejaar van de desbetreffende opleiding aan alle universiteiten of
      hogescholen waaraan deze is verbonden waarbij een verdeling kan worden gemaakt van dat aantal over elk van de
      bedoelde instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.56
  - number: 7.56.2
    text: |-
      [Artikel 7.53, tweede lid, derde lid, vijfde lid en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.56
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.56.3
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid wordt uiterlijk vastgesteld op 1 mei van het jaar
      voorafgaand aan het studiejaar waarin deze regeling voor het eerst van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.56
  - number: '7.57'
    text: |-
      Voor de toepassing van deze paragraaf gelden door universiteiten onderscheidenlijk hogescholen verzorgde
      opleidingen met dezelfde naam als dezelfde opleidingen. Voor de toepassing van [artikel 7.56][ref1] gelden
      bovendien door universiteiten of hogescholen verzorgde groepen van verwante opleidingen als dezelfde opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.57h.1
    text: |-
      Het instellingsbestuur kan voorschriften geven en maatregelen nemen met betrekking tot de goede gang van zaken
      in de gebouwen en terreinen van de instelling. Die maatregelen kunnen inhouden dat aan degene die de bedoelde
      voorschriften heeft overtreden, de toegang tot die gebouwen en terreinen geheel of gedeeltelijk voor de tijd van
      ten hoogste een jaar wordt ontzegd, of de inschrijving gedurende eenzelfde periode wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57h
  - number: 7.57h.2
    text: |-
      Als de persoon die de voorschriften, bedoeld in het eerste lid, overtreedt, ernstige overlast binnen de
      gebouwen en terreinen van de instelling heeft veroorzaakt en deze overlast ook na aanmaning door of vanwege
      het instellingsbestuur niet heeft gestaakt, kan het instellingsbestuur die student de toegang tot de instelling
      definitief ontzeggen of zijn inschrijving beëindigen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57h
  - number: 7.57i.1
    text: |-
      De onderwijs- en examenregelingen van de betreffende hogescholen, universiteiten en Open Universiteit regelen
      de wijze waarop aan degene die met goed gevolg het afsluitend examen, verbonden aan een bacheloropleiding heeft
      afgelegd, door het instellingsbestuur ondersteuning wordt geboden ter bevordering van een goede doorstroming naar
      een verwante masteropleiding in het wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
  - number: 7.57i.2
    text: Het instellingsbestuur kan voor het bieden van de ondersteuning, bedoeld in het eerste lid, een vergoeding vragen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
  - number: 7.57i.3
    text: |-
      De vergoeding, bedoeld in het tweede lid, bedraagt voor een ondersteuning met een studielast van 60 studiepunten
      of meer maximaal het volledige wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid][ref1], of, in geval
      van doorstroming naar een masteropleiding bij de Open Universiteit, maximaal het collegegeld OU, bedoeld in
      [artikel 7.45b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.57i.4
    text: |-
      De vergoeding, bedoeld in het tweede lid, bedraagt voor een ondersteuning met een studielast van
      minder dan 60 studiepunten maximaal een proportioneel deel van het wettelijk collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref1], of, in geval van doorstroming naar een masteropleiding bij de Open Universiteit,
      maximaal een proportioneel deel van het collegegeld OU, bedoeld in [artikel 7.45b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.57i.5
    text: |-
      [Artikel 7.4, eerste en tweede lid][ref1], is op de berekening van de studielast van de ondersteuning van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.57i.6
    text: |-
      Een student die gebruik maakt van de ondersteuning terwijl hij een opleiding volgt waarvoor hij
      wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid][ref1], of collegegeld OU, bedoeld in
      [artikel 7.45b, eerste lid][ref2], verschuldigd is, wordt vrijgesteld van het betalen van een vergoeding voor de
      ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.57i.7
    text: |-
      Een student die gebruik maakt van de ondersteuning en, in afwijking van [artikel 7.32, derde lid][ref1], alleen
      met dat oogmerk is ingeschreven voor een opleiding, betaalt gedurende de periode dat hij ondersteuning ontvangt in
      plaats van collegegeld een vergoeding voor de ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.59.1
    text: Het instellingsbestuur stelt het studentenstatuut vast en maakt dit bekend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.2
    text: |-
      Het instellingsbestuur reikt aan iedere student bij de eerste inschrijving voor een opleiding het studentenstatuut
      uit. Indien noodzakelijk reikt het instellingsbestuur ook bij inschrijving voor een volgend studiejaar het
      studentenstatuut uit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.3
    text: Het studentenstatuut omvat een opleidingsspecifiek deel en een instellingsspecifiek deel.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4
    text: 'Het opleidingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4.a
    text: |-
      een beschrijving van de studieopbouw en de ondersteunende faciliteiten die de student door de instelling worden
      aangeboden, waaronder in ieder geval worden begrepen:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4.a.1°
    text: informatie over de opzet, organisatie en uitvoering van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4.a.2°
    text: de studentenvoorzieningen, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4.a.3°
    text: de faciliteiten betreffende de studiebegeleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.4.b
    text: |-
      de vastgestelde onderwijs- en examenregeling, bedoeld in [artikel 7.13, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.59.4.c
    text: |-
      een beschrijving van procedures die in aanvulling op de procedures, bedoeld in het vijfde lid onder *b* ten 2°, op
      de opleiding van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.5
    text: 'Het instellingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.5.a
    text: |-
      een beschrijving van de rechten en verplichtingen van de studenten, voortvloeiende uit het bepaalde bij of
      krachtens de wet, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.5.b
    text: 'een overzicht van de regelingen die beogen de rechten van studenten te beschermen, waarin worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59.5.b.1°
    text: |-
      een beschrijving van de procedures voor de behandeling van klachten en geschillen, bedoeld in [titel 4][ref1],
      alsmede van de procedures voor de behandeling van geschillen inzake medezeggenschap, alsmede van de beroepsrechten
      die kunnen worden ontleend aan deze wet en andere wettelijke regelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.59.5.b.2°
    text: |-
      een beschrijving van aanvullende procedures ter bescherming van de rechten van studenten die door het
      instellingsbestuur worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59
  - number: 7.59a.1
    text: |-
      Het instellingsbestuur richt een toegankelijke en eenduidige faciliteit in. Het instellingsbestuur stelt een nadere
      regeling vast met betrekking tot deze paragraaf en [paragraaf 2][ref1], die een onderdeel vormt van het bestuurs-
      en beheersreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.2
    text: |-
      Een betrokkene dient een klacht als bedoeld in [artikel 7.59b][ref1] en een beroep of bezwaar als bedoeld
      in [paragraaf 2][ref2] vanwege een genomen beslissing van een orgaan van een instelling voor hoger
      onderwijs dan wel het ontbreken ervan op grond van deze wet en daarop gebaseerde regelingen in bij de
      faciliteit. Indien het een beroep of bezwaar van een betrokkene aan een openbare instelling betreft, zijn de
      [artikelen 6:4, eerste en tweede lid][ref3], en [7:1a van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.59a.3
    text: |-
      In deze paragraaf en de [paragrafen 2 tot en met 4][ref1] wordt onder «betrokkene» verstaan: een student, een
      aanstaande student, een voormalige student, een extraneus, een aanstaande extraneus of een voormalige extraneus.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.4
    text: |-
      De termijn voor het schriftelijk indienen van een beroep of bezwaar als bedoeld in [paragraaf 2][ref1] bedraagt
      zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.5
    text: |-
      De faciliteit bevestigt de ontvangst van een binnengekomen klacht, beroep of bezwaar schriftelijk
      aan de betrokkene en zendt deze, nadat daarop de datum van ontvangst is aangetekend, zo
      spoedig mogelijk door aan het bevoegde orgaan. Indien het een openbare instelling betreft, is
      [artikel 6:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.59a.6
    text: |-
      De datum van ontvangst, bedoeld in het vijfde lid, is bepalend voor de vraag of een klacht,
      beroep of bezwaar tijdig is ingediend. Indien het een openbare instelling betreft, is
      [artikel 6:15, derde lid, van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.59a.7
    text: |-
      Indien de faciliteit een klacht, beroep of bezwaar aan een onbevoegd orgaan heeft gezonden, zendt dit orgaan
      het desbetreffende stuk zo spoedig mogelijk terug naar de faciliteit. Het bevoegde orgaan behandelt een klacht,
      beroep of bezwaar dat door een betrokkene rechtstreeks is ingediend bij dit orgaan slechts na tussenkomst van de
      faciliteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59a
  - number: 7.59b
    text: |-
      Het instellingsbestuur behandelt een klacht van een betrokkene, wat een bijzondere instelling betreft met
      overeenkomstige toepassing van [titel 9.1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.59b
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 7.60.1
    text: Elke instelling voor hoger onderwijs heeft een college van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
  - number: 7.60.2
    text: |-
      Het college van beroep heeft drie of vijf leden. Het aantal plaatsvervangende leden is niet groter dan het aantal
      leden. Het college houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
  - number: 7.60.3
    text: |-
      Het college kan besluiten kamers in te stellen. Indien het college daartoe besluit, bestaat het college uit ten
      minste zes en ten hoogste vijftien leden. Het aantal plaatsvervangende leden is niet groter dan het aantal leden.
      Elke kamer heeft drie of vijf leden. Zij houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
  - number: 7.60.4
    text: |-
      De voorzitter, de plaatsvervangend voorzitter of voorzitters en de overige leden en de eventuele plaatsvervangende
      leden worden door het instellingsbestuur benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar
      of, voorzover het studenten betreft, voor een termijn van ten minste een en ten hoogste twee jaar. De leden en
      plaatsvervangende leden maken geen deel uit van het instellingsbestuur of van de inspectie. Buiten de voorzitter
      bestaat het college voor tenminste de helft uit docenten, onderscheidenlijk leden van de wetenschappelijke staf.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
  - number: 7.60.5
    text: |-
      De voorzitter en de plaatsvervangende voorzitter of voorzitters moeten voldoen aan de vereisten voor benoembaarheid
      tot rechterlijk ambtenaar, bedoeld in [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 7.60.6
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van het college van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot
      ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.60
  - number: 7.61.1
    text: 'Het college van beroep voor de examens is bevoegd ten aanzien van de volgende beslissingen:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
  - number: 7.61.1.a
    text: |-
      beslissingen als bedoeld in de [artikelen 7.8b, derde en vijfde lid][ref1], en [7.9, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.b
    text: |-
      beslissingen inzake het met goed gevolg hebben afgelegd van het afsluitend examen, bedoeld in [artikel 7.9d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.c
    text: |-
      beslissingen, niet zijnde besluiten van algemene strekking, genomen op grond van het bepaalde bij of krachtens
      [titel 2][ref1] van dit hoofdstuk, met het oog op de toelating tot examens,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.61.1.d
    text: |-
      beslissingen, genomen op grond van het aanvullend onderzoek, bedoeld in de [artikelen 7.25, vijfde lid][ref1],
      en [7.28, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.e
    text: beslissingen van examencommissies en examinatoren,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
  - number: 7.61.1.f
    text: |-
      beslissingen van commissies als bedoeld in [artikel 7.29, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.g
    text: |-
      beslissingen, genomen op grond van [artikel 7.30b][ref1] met het oog op de toelating tot de in dat artikel bedoelde
      opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.61.2
    text: |-
      Het beroep kan, wat de openbare instellingen betreft in afwijking van
      [hoofdstuk 7 van de Algemene wet bestuursrecht][ref1], worden ingesteld terzake dat een beslissing in strijd is met
      het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 7.61.3
    text: |-
      Alvorens het beroep in behandeling te nemen zendt het college van beroep het beroepschrift aan het
      orgaan waartegen het beroep is gericht, met uitnodiging om in overleg met betrokkenen na te gaan of een
      minnelijke schikking van het geschil mogelijk is, wat de openbare instellingen betreft in afwijking van
      [afdeling 7.3 van de Algemene wet bestuursrecht][ref1]. Ingeval het beroep is gericht tegen een beslissing van
      een examinator, geschiedt de in de voorgaande volzin bedoelde toezending aan de desbetreffende examencommissie.
      Indien de examinator tegen wie het beroep is gericht, lid is van de examencommissie, neemt hij geen deel aan de
      beraadslaging. Het desbetreffende orgaan deelt binnen drie weken aan het college van beroep, onder overlegging van
      de daarop betrekking hebbende stukken, mede tot welke uitkomst het beraad heeft geleid. Is een minnelijke schikking
      niet mogelijk gebleken, dan wordt het beroepschrift door het college in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '7.3'
  - number: 7.61.4
    text: |-
      Het college van beroep beslist binnen tien weken gerekend vanaf de dag na die waarop de termijn voor
      het indienen van het beroepschrift is verstreken, wat de openbare instellingen betreft in afwijking van
      [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.5
    text: |-
      Indien het college van beroep het beroep gegrond acht, vernietigt het de beslissing geheel of
      gedeeltelijk. Het college is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde
      beslissing een nieuwe beslissing te nemen, wat de openbare instellingen betreft in afwijking van
      [artikel 7:25 van de Algemene wet bestuursrecht][ref1]. Het kan bepalen dat opnieuw of, indien de beslissing is
      geweigerd, alsnog in de zaak wordt beslist, dan wel dat het tentamen, het examen, het toelatingsonderzoek, het
      aanvullend onderzoek of enig onderdeel daarvan opnieuw wordt afgenomen onder door het college van beroep te stellen
      voorwaarden. Het orgaan waarvan de beslissing is vernietigd, voorziet voorzover nodig opnieuw in de zaak met
      inachtneming van de uitspraak van het college van beroep. Het college kan daarvoor in zijn uitspraak een termijn
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.6
    text: |-
      Indien onverwijlde spoed dat vereist kan de voorzitter van het college van beroep een voorlopige
      voorziening treffen op verzoek van de indiener van het beroepschrift, onverminderd het bepaalde in
      [artikel 7.66, tweede lid][ref1], en [artikel 8:81 van de Algemene wet bestuursrecht][ref2]. De voorzitter beslist
      op dit verzoek na het desbetreffende orgaan dan wel de desbetreffende examinator te hebben gehoord, althans te
      hebben opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.62.1
    text: |-
      Het college van beroep voor de examens stelt een reglement van orde vast, waarin nadere regels worden gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.a
    text: de omvang en samenstelling van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.b
    text: indien nodig, de splitsing in kamers, alsmede de verdeling van de werkzaamheden over de verschillende kamers,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.c
    text: de zittingstermijn van de leden en eventuele plaatsvervangende leden van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.d
    text: de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap van het college van beroep eindigt,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.e
    text: |-
      de in [artikel 7.61, derde lid][ref1], bedoelde procedure en de gevallen waarin deze procedure achterwege kan
      worden gelaten,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.62.1.f
    text: de wijze waarop in het secretariaat van het college van beroep wordt voorzien, alsmede
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.1.g
    text: de wijze waarop de voorzitter wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: 7.62.2
    text: Het reglement van orde alsmede wijzigingen daarvan, behoeven de instemming van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.62
  - number: '7.63'
    text: |-
      De organen en personeelsleden alsmede de examinatoren van de instelling verstrekken aan het college van beroep voor
      de examens de gegevens die dit college voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63
  - number: 7.63a.1
    text: |-
      Elke instelling voor hoger onderwijs heeft een geschillenadviescommissie. Op een geschillenadviescommissie
      is [artikel 7:13, eerste tot en met zesde lid, van de Algemene wet bestuursrecht][ref1] van overeenkomstige
      toepassing. De leden van de geschillenadviescommissie zijn functioneel onafhankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63a.2
    text: |-
      De geschillenadviescommissie brengt aan het instellingsbestuur advies uit over bezwaren met betrekking tot andere
      beslissingen dan wel het ontbreken ervan op grond van deze wet en daarop gebaseerde regelingen dan die, bedoeld
      in [artikel 7.61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.63a.3
    text: De geschillenadviescommissie gaat na of een minnelijke schikking tussen partijen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63a
  - number: 7.63a.4
    text: |-
      Indien sprake is van onverwijlde spoed kan de voorzitter van de geschillenadviescommissie desgevraagd bepalen
      dat de geschillenadviescommissie zo spoedig mogelijk advies uitbrengt aan het instellingsbestuur. De voorzitter
      bepaalt binnen een week na ontvangst van het bezwaar of sprake is van onverwijlde spoed en brengt de betrokkene en
      het instellingsbestuur hiervan zo spoedig mogelijk op de hoogte. Het instellingsbestuur neemt dan, wat de openbare
      instellingen betreft in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref1], binnen vier weken na
      ontvangst van het bezwaar door de faciliteit een beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63b.1
    text: |-
      Het instellingsbestuur beslist na ontvangst van het bezwaar binnen 10 weken, onverminderd de beslissingen op grond
      van de procedure, bedoeld in [artikel 7.63a, vierde lid][ref1]. Wat de openbare instellingen betreft beslist het
      instellingsbestuur in afwijking van [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63b.2
    text: |-
      Wat bijzondere instellingen betreft worden de [artikelen 7:11][ref1], [7:12][ref2] en
      [7:13, zevende lid, van de Algemene wet bestuursrecht][ref3] overeenkomstig toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.63b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.64.1
    text: Er is een college van beroep voor het hoger onderwijs, gevestigd te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.2
    text: |-
      Het college van beroep heeft ten minste drie en ten hoogste zeven leden, onder wie de voorzitter. Het college heeft
      een even groot aantal plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.3
    text: |-
      Het college van beroep wordt bijgestaan door een secretaris. Onze Minister kan aan de secretaris ambtenaren
      toevoegen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.4
    text: |-
      De ambtenaren die werkzaam zijn voor het college van beroep staan onder het gezag van dat college en leggen over
      werkzaamheden uitsluitend aan dat college verantwoording af.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.5
    text: |-
      Het college van beroep houdt zitting in kamers. Het college van beroep wijst de voorzitter van een kamer aan uit
      de leden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.6
    text: |-
      Het college van beroep stelt voor zijn werkzaamheden een reglement van orde vast waarin in elk geval worden
      geregeld:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.6.a
    text: de splitsing in kamers,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.6.b
    text: de verdeling van werkzaamheden over de verschillende kamers, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.64.6.c
    text: de wijze waarop de voorzitter van het college van beroep en van een kamer wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.64
  - number: 7.65.1
    text: |-
      De leden van het college van beroep voor het hoger onderwijs en de plaatsvervangende leden worden bij koninklijk
      besluit benoemd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.2
    text: |-
      Bij koninklijk besluit wordt besloten tot het aangaan van een arbeidsovereenkomst met de secretaris. Tot
      beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit besloten, tenzij Onze Minister namens de Staat
      de arbeidsovereenkomst opzegt op grond van [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: 7.65.3
    text: |-
      De leden en plaatsvervangende leden voldoen aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld
      in [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 7.65.4
    text: |-
      Een lid of plaatsvervangend lid wordt bij koninklijk besluit ontslagen met ingang van de eerstvolgende maand, nadat
      hij:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.4.a
    text: hiertoe een verzoek heeft ingediend,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.4.b
    text: de leeftijd van zeventig jaar heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.4.c
    text: terzake gehoord, uit hoofde van ziekte of gebreken blijvend ongeschikt is om zijn functie te vervullen, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.4.d
    text: bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.65.5
    text: |-
      De toelage aan de voorzitter, de overige leden en de plaatsvervangende leden wordt vastgesteld bij koninklijk
      besluit, te nemen op gemeenschappelijke voordracht van Onze Minister en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.65
  - number: 7.66.1
    text: |-
      Het college van beroep voor het hoger onderwijs oordeelt over het beroep dat een betrokkene heeft ingesteld tegen
      een beslissing van een orgaan van een instelling voor hoger onderwijs die jegens hem op grond van deze wet en
      daarop gebaseerde regelingen is genomen. Tegen uitspraken van het college van beroep voor het hoger onderwijs staat
      geen hoger beroep open.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.66
  - number: 7.66.2
    text: |-
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met uitzondering van de
      [artikelen 8:1][ref2], [8:2, eerste lid, aanhef en onder a][ref3], en [8:13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.66.3
    text: |-
      De organen van de instelling verstrekken aan het college van beroep de gegevens die dit college voor de uitvoering
      van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.66
  - number: '7.67'
    text: |-
      Het griffierecht bedraagt € 44 . Dat bedrag wordt jaarlijks met ingang van 1 januari bij regeling van Onze Minister
      van Veiligheid en Justitie aangepast aan de ontwikkeling van de consumentenprijsindex. Daarbij wordt het bedrag
      rekenkundig afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.67
  - number: 7.68.1
    text: |-
      In afwijking van [artikel 7.66, eerste lid][ref1], kan het bestuur van een bijzondere instelling in een
      regeling bepalen dat de instelling in verband met de levensbeschouwelijke aard van de instelling, al dan
      niet in samenwerking met besturen van een of meer andere bijzondere instellingen voor hoger onderwijs met een
      levensbeschouwelijke aard, een college van beroep bijzonder onderwijs instelt voor de behandeling van beroepen
      ingesteld door een betrokkene tegen een beslissing van een orgaan van een instelling voor hoger onderwijs die
      jegens hem op grond van deze wet en daarop gebaseerde regelingen is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.68.2
    text: |-
      De regeling bevat een uitwerking van de onderwerpen, genoemd in
      [artikel 7.62, eerste lid][ref1], alsmede de rechtsgang bij het college waarbij de
      [artikelen 7.60, vierde lid, eerste en tweede volzin, vijfde en zesde lid][ref2],
      [7.61, tweede, vierde, vijfde, en zesde lid][ref3] en [7.63][ref4] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.68.3
    text: |-
      De regeling alsmede wijzigingen daarvan worden vastgesteld met in achtneming van de
      [artikelen 7.59a tot en met 7.67][ref1]. De regeling alsmede de wijzigingen daarvan worden geacht te voldoen aan
      de in [artikel 1.9, derde lid, onder g][ref2], bedoelde voorwaarde, indien Onze Minister niet binnen drie maanden
      heeft verklaard van oordeel te zijn, dat het bestuur bij de vaststelling van de rechtsgang de artikelen 7.59a
      tot en met 7.67 niet in acht heeft genomen en daartoe in redelijkheid geen beroep heeft kunnen doen op de eigen
      levensbeschouwelijke aard van de bijzondere instelling die zich tegen inachtneming daarvan zou verzetten, of dat
      onvoldoende aannemelijk heeft gemaakt. Binnen drie maanden wordt het bezwaar ondervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 7.68.4
    text: |-
      De werking van het besluit van Onze Minister, bedoeld in het derde lid, wordt opgeschort totdat de beroepstermijn
      is verstreken, of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.68
  - number: 7a.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.1
  - number: 7a.1.a
    text: |-
      instelling: een instelling als bedoeld in [artikel 7a.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7a
        hoofdstuk: 7a
  - number: 7a.1.b
    text: |-
      bekwaamheidsonderzoek: het onderzoek, bedoeld in [artikel 176f van de Wet op het primair onderwijs][ref1],
      [artikel 141 van de Wet primair onderwijs BES][ref2], [artikel 162i van de Wet op de expertisecentra][ref3],
      [artikel 118o van de Wet op het voortgezet onderwijs][ref4] of
      [artikel 201 van de Wet voortgezet onderwijs BES][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel176f
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel162i
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel118o
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel201
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 176f
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 162i
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 118o
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '201'
  - number: 7a.2
    text: |-
      Dit hoofdstuk heeft betrekking op de bekostigde en ingevolge [artikel 6.9][ref1] aangewezen instellingen
      voor hoger onderwijs die voldoen aan [artikel 176g van de Wet op het primair onderwijs][ref2],
      [artikel 142 van de Wet primair onderwijs BES][ref3], [artikel 162j van de Wet op de expertisecentra][ref4],
      [artikel 118p van de Wet op het voortgezet onderwijs][ref5] of
      [artikel 202 van de Wet voortgezet onderwijs BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel176g
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel142
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel162j
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel118p
      [ref6]: https://wetten.overheid.nl/BWBR0030284#Artikel202
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 176g
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '142'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 162j
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 118p
      - id: ref6
        bwb_id: BWBR0030284
        artikel: '202'
  - number: 7a.3
    text: |-
      Ten bewijze dat het bekwaamheidsonderzoek met goed gevolg is afgesloten, wordt door de examencommissie van een
      instelling die daarvoor het meest in aanmerking komt een getuigschrift bekwaamheidsonderzoek uitgereikt. Op het
      getuigschrift wordt vermeld, welke onderdelen het bekwaamheidsonderzoek omvatte en, in een voorkomend geval, welke
      bevoegdheid daaraan is verbonden, rekening houdend met [artikel 7.6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7a.4
    text: |-
      Ten bewijze dat de scholing, bedoeld in artikel 4.2.5 van de Wet educatie en beroepsonderwijs, ertoe heeft geleid
      dat betrokkene voldoet aan de in artikel 4.2.3, derde lid, onder a, van die wet bedoelde bekwaamheidseisen, wordt
      door de examencommissie van een instelling die daarvoor het meest in aanmerking komt een getuigschrift pedagogisch-
      didactische scholing uitgereikt. Op het getuigschrift wordt vermeld, welke onderdelen het onderzoek dat tot het
      getuigschrift leidde, omvatte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.4
  - number: 7a.5.1
    text: 'Degene die met goed gevolg het bekwaamheidsonderzoek heeft afgesloten, is gerechtigd tot het voeren van:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.5
  - number: 7a.5.1.a
    text: |-
      de titel doctorandus, afgekort tot drs., indien het betreft een bekwaamheidsonderzoek waarin kennis, inzicht en
      vaardigheden op het niveau van wetenschappelijk onderwijs zijn getoetst, of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.5
  - number: 7a.5.1.b
    text: |-
      de titel baccalaureus, afgekort tot bc., indien het betreft een bekwaamheidsonderzoek waarin kennis, inzicht en
      vaardigheden op het niveau van hoger beroepsonderwijs zijn getoetst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.5
  - number: 7a.5.2
    text: De in het eerste lid genoemde titels worden, afgekort, voor de naam geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.5
  - number: 7a.5.3
    text: |-
      Tot het voeren van een in het eerste lid genoemde titel is eveneens gerechtigd degene aan wie op grond van de
      [Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1] vanaf 1 september 2002 het getuigschrift
      van een met goed gevolg afgesloten bekwaamheidsonderzoek is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011469
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7a.5
    references:
      - id: ref1
        bwb_id: BWBR0011469
  - number: 8.1.1
    text: |-
      Met het oog op de samenwerking tussen twee of meer, in de bijlage van deze wet in onderdeel a tot en met i
      opgenomen instellingen kunnen de besturen van die instellingen een gemeenschappelijke regeling sluiten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel8.1
  - number: 8.1.2
    text: De regeling omvat bepalingen omtrent wijziging, opheffing, toetreding en uittreding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel8.1
  - number: 8.1.3
    text: |-
      Bij de regeling kan een samenwerkingsinstituut worden ingesteld. De regeling omvat bepalingen omtrent de inrichting
      en het bestuur van het instituut, en omtrent het verstrekken van inlichtingen door het instituut aan de besturen
      van de deelnemende instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel8.1
  - number: 8.1.4
    text: |-
      De regeling kan voorzien in de overdracht van bepaalde bevoegdheden van organen van de deelnemende instellingen aan
      organen van een andere deelnemende instelling of aan organen van het samenwerkingsinstituut.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel8.1
  - number: 8.1.5
    text: |-
      Op de besluiten van het samenwerkingsinstituut, genomen krachtens enige door het bestuur van een openbare
      instelling overgedragen bevoegdheid zijn de wettelijke bepalingen omtrent schorsing en vernietiging van besluiten
      van dat bestuur krachtens de overgedragen bevoegdheid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel8.1
  - number: '9.1'
    text: Deze titel heeft betrekking op de openbare universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.1
  - number: 9.2.1
    text: |-
      Het college van bestuur is belast met het bestuur van de universiteit in haar geheel en met het beheer daarvan,
      onverminderd de bevoegdheden van de raad van toezicht volgens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.2
  - number: 9.2.2
    text: |-
      Het college van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur
      zijn opgedragen, voorzover in dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.2
  - number: 9.2.3
    text: De voorzitter van het college van bestuur vertegenwoordigt de universiteit in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.2
  - number: 9.3.1
    text: |-
      Het college van bestuur bestaat uit ten hoogste drie leden, waaronder de rector magnificus van de universiteit.
      Bij de benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen
      en vrouwen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.2
    text: De benoeming van de leden van het college van bestuur geschiedt op basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.3
    text: |-
      Voor het benoemen van een lid van het college van bestuur stelt de raad van toezicht een sollicitatiecommissie in
      waarvan in elk geval deel uitmaken:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.3.a
    text: |-
      een lid van of namens het deel van de universiteitsraad dat uit en door het personeel is gekozen, of een lid van of
      namens de ondernemingsraad, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.3.b
    text: |-
      een lid van of namens het deel van de universiteitsraad dat uit en door de studenten is gekozen, of
      een lid van of namens het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.4
    text: De voorzitter van het college van bestuur wordt uit de leden door de raad van toezicht benoemd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.5
    text: |-
      In het bestuurs- en beheersreglement worden nadere regels gegeven omtrent de wijze van voordracht en benoeming van
      de rector magnificus.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.6
    text: Een lid van het college van bestuur kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.7
    text: 'Een lid van het college van bestuur kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.7.a
    text: lid van de raad van toezicht van de desbetreffende universiteit,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.7.b
    text: decaan van een faculteit of lid van het bestuur daarvan, tenzij een universiteit slechts een faculteit omvat,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: 9.3.7.c
    text: |-
      lid van het bestuur van een opleiding, voorzover dat met toepassing van [artikel 9.17][ref1] is ingesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.3.7.d
    text: lid van de raad van toezicht of van het college van bestuur van een andere universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.3
  - number: '9.4'
    text: |-
      Het college van bestuur stelt een bestuurs- en beheersreglement ter regeling van het bestuur, het beheer en de
      inrichting van de universiteit vast.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.4
  - number: '9.5'
    text: |-
      Het college van bestuur kan richtlijnen vaststellen met het oog op de organisatie en coördinatie van de uitoefening
      van de in [de artikelen 9.14, derde lid][ref1], en [9.15, eerste lid][ref2], bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.6.1
    text: Het college van bestuur is verantwoording verschuldigd aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.6
  - number: 9.6.2
    text: |-
      Het college van bestuur verstrekt de raad van toezicht de gevraagde inlichtingen betreffende zijn besluiten en
      andere handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.6
  - number: 9.6.3
    text: Het college van bestuur verstrekt Onze Minister de gevraagde inlichtingen omtrent de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.6
  - number: 9.7.1
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.7.2
    text: |-
      De voorzitter en de andere leden worden door Onze Minister benoemd, geschorst en ontslagen. Een van de leden
      wordt benoemd op voordracht van de universiteitsraad dan wel de ondernemingsraad en het orgaan dat op grond van de
      medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld. De voordracht
      bevat ten minste twee namen. Indien de voorgedragen kandidaten niet door Onze Minister worden benoemd, wordt
      een nieuwe voordracht gedaan. Onze Minister kan gemotiveerd afwijken van de tweede voordracht. Bij de benoeming
      wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en vrouwen.
      Onze Minister benoemt een lid dat in het bijzonder het vertrouwen geniet van de universiteitsraad, dan wel het
      vertrouwen geniet van de ondernemingsraad en het orgaan dat op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid, tweede volzin][ref2], is ingesteld, gezamenlijk. De benoeming geschiedt voor een periode
      van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.3
    text: Een lid kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.7.4
    text: |-
      De samenstelling, taken en bevoegdheden van de raad van toezicht zijn zodanig dat de raad een deugdelijk en
      onafhankelijk toezicht kan uitoefenen. De leden van de raad van toezicht hebben geen directe belangen bij de
      universiteit. De leden van de raad zijn niet tevens werkzaam bij een ministerie dan wel lid van de Eerste of Tweede
      Kamer der Staten-Generaal. Zij hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last of
      ruggespraak. De benoeming van de leden van de raad geschiedt op basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.7.5
    text: |-
      Het college van bestuur voorziet in de functioneel onafhankelijke administratieve ondersteuning van de raad van
      toezicht. De raad van toezicht heeft instemmingsrecht ten aanzien van de benoeming en het ontslag van de secretaris
      van de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.7.6
    text: |-
      De leden van het college van bestuur wonen de vergaderingen van de raad van toezicht bij, tenzij de raad anders
      beslist. Zij hebben daarin een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.7.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.7
  - number: 9.8.1
    text: |-
      De raad van toezicht houdt, met het oog op de taken van de universiteit, bedoeld in
      [artikel 1.3, eerste lid][ref1], toezicht op de uitvoering van werkzaamheden en de uitoefening van bevoegdheden
      door het college van bestuur en staat dit college met raad ter zijde. De raad van toezicht is in elk geval belast
      met:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.8.1.a
    text: het benoemen, schorsen, ontslaan en vaststellen van de beloning van de leden van het college van bestuur;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
  - number: 9.8.1.b
    text: het goedkeuren van het bestuurs- en beheersreglement;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
  - number: 9.8.1.c
    text: het goedkeuren van de begroting, de jaarrekening, het bestuursverslag en het instellingsplan;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
  - number: 9.8.1.d
    text: |-
      indien van toepassing, het goedkeuren van de gemeenschappelijke regeling, bedoeld in [artikel 8.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.8.1.e
    text: |-
      het toezien op de naleving door het college van bestuur van wettelijke verplichtingen en de omgang met de
      branchecode, bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.8.1.f
    text: |-
      het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen verkregen op grond van de [artikelen 2.5][ref1] en [2.6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.8.1.g
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de raad;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 9.8.1.h
    text: |-
      het toezien op de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.8.1.i
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met h, in het bestuursverslag van de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
  - number: 9.8.2
    text: |-
      De raad van toezicht pleegt ten minste twee keer per jaar overleg met de universiteitsraad dan wel de
      ondernemingsraad en het orgaan binnen de instelling dat op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.9.1
    text: De raad van toezicht is verantwoording verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9
  - number: 9.9.2
    text: De raad van toezicht verstrekt Onze Minister de gevraagde inlichtingen betreffende zijn handelen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9
  - number: 9.9a.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de raad van
      toezicht een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor
      zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.2
    text: 'Onder wanbeheer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.2.a
    text: financieel wanbeleid;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 1.18][ref1], maatregelen te treffen die
      noodzakelijk zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de instelling en om
      te voorkomen dat de kwaliteit van het stelsel van wetenschappelijk onderwijs in gevaar komt;.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.9a.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de instelling in stand houdt, een
      bestuurder of toezichthouder zelf dan wel een derde;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.2.d
    text: |-
      onrechtmatig handelen waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      instelling in stand houdt, een bestuurder of toezichthouder zelf dan wel een derde, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen binnen de instelling, waaronder wordt verstaan intimidatie of bedreiging van personeel of
      studenten door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.4
    text: Een aanwijzing bevat de termijn waarbinnen de raad van toezicht aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.5
    text: 'Voordat Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 12a van de Wet op het onderwijstoezicht][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 12a
  - number: 9.9a.5.b
    text: |-
      heeft de inspectie daarover een rapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 9.9a.5.c
    text: |-
      stelt Onze Minister de raad van toezicht gedurende vier weken in de gelegenheid zijn zienswijze met betrekking tot
      de voorgenomen aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.9a.6
    text: |-
      Indien het onderzoek, bedoeld in het vijfde lid, onder a, mede de kwaliteit van het onderwijs omvat, betrekt de
      inspectie het accreditatieorgaan bij haar onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.9a
  - number: 9.10.1
    text: Aan een universiteit is een college voor promoties verbonden. Het college voor promoties bestaat uit hoogleraren.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.10
  - number: 9.10.2
    text: |-
      Het college voor promoties hoort het college van bestuur over het verlenen van de graad, bedoeld in
      [artikel 7.19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 9.10.3
    text: |-
      In het bestuurs- en beheersreglement worden de taak, de samenstelling en de wijze van benoeming van het college
      voor promoties nader geregeld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.10
  - number: '9.11'
    text: |-
      In het bestuurs- en beheersreglement wordt bepaald welke faculteiten of faculteit een universiteit omvat. Tevens
      wordt in dat reglement vermeld welke opleidingen in die faculteiten of faculteit zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.11
  - number: 9.12.1
    text: |-
      De verzorging van het onderwijs en de beoefening van de wetenschap geschieden in de faculteit. Aan het hoofd van de
      faculteit staat de decaan van de faculteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.12
  - number: 9.12.2
    text: |-
      In afwijking van het eerste lid kan in het bestuurs- en beheersreglement worden bepaald dat aan het hoofd van
      de faculteit een bestuur staat, bestaande uit de decaan van de faculteit, tevens voorzitter, en een of meer
      andere leden. Indien de eerste volzin toepassing heeft gevonden, wordt in deze titel en in [titel 2][ref1]
      met uitzondering van [artikel 9.13, vierde en zesde lid][ref2], onder decaan tevens verstaan het bestuur van
      de faculteit. Indien aan het hoofd van de faculteit een meerhoofdig bestuur staat, wordt een student van de
      desbetreffende faculteit in de gelegenheid gesteld de vergaderingen van dit bestuur bij te wonen in welke
      vergaderingen deze student een adviserende stem heeft. In het bestuurs- en beheersreglement wordt bepaald, op welke
      wijze de in de vorige volzin bedoelde student wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
