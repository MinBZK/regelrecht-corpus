  - number: 6.10.1
    text: |-
      Onze Minister kan besluiten dat aan een opleiding of aan alle opleidingen, verzorgd door een rechtspersoon
      voor hoger onderwijs, de rechten, genoemd in [artikel 1.12, eerste lid][ref1], worden ontnomen, indien de
      continuïteit van de desbetreffende rechtspersoon of de naleving van de [artikelen 1.3, vijfde lid][ref2],
      [1.12, tweede lid][ref3], of 1.12, derde lid, niet of niet langer is gewaarborgd of aan de leveringsverplichting,
      bedoeld in [artikel 12, eerste en vierde lid, van de Wet register onderwijsdeelnemers][ref4], niet of niet meer
      wordt voldaan.


