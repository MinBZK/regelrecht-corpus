    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.k
    text: |-
      de nadere regels bedoeld in [artikel 7.10, vierde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.2.l
    text: |-
      of de tentamens mondeling, schriftelijk of op een andere wijze worden afgelegd, behoudens de bevoegdheid van de
      examencommissie in bijzondere gevallen anders te bepalen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.m
    text: |-
      de wijze waarop studenten met een handicap of chronische ziekte redelijkerwijs in de gelegenheid worden gesteld de
      tentamens af te leggen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.n
    text: |-
      de openbaarheid van mondeling af te nemen tentamens, behoudens de bevoegdheid van de examencommissie in bijzondere
      gevallen anders te bepalen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.o
    text: |-
      de termijn waarbinnen de uitslag van een tentamen bekend wordt gemaakt alsmede of en op welke wijze van deze
      termijn kan worden afgeweken,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.p
    text: |-
      de wijze waarop en de termijn gedurende welke degene die een schriftelijk tentamen heeft afgelegd, inzage verkrijgt
      in zijn beoordeelde werk,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.q
    text: |-
      de wijze waarop en de termijn gedurende welke kennis genomen kan worden van vragen en opdrachten, gesteld of
      gegeven in het kader van een schriftelijk afgenomen tentamen en van de normen aan de hand waarvan de beoordeling
      heeft plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.r
    text: |-
      de gronden waarop de examencommissie voor eerder met goed gevolg afgelegde tentamens of examens in het hoger
      onderwijs, dan wel voor buiten het hoger onderwijs opgedane kennis of vaardigheden, vrijstelling kan verlenen van
      het afleggen van een of meer tentamens,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.s
    text: |-
      waar nodig, dat het met goed gevolg afgelegd hebben van tentamens voorwaarde is voor de toelating tot het afleggen
      van andere tentamens,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.t
    text: |-
      waar nodig, de verplichting tot het deelnemen aan praktische oefeningen met het oog op de toelating tot het
      afleggen van het desbetreffende tentamen, behoudens de bevoegdheid van de examencommissie vrijstelling van die
      verplichting te verlenen, al dan niet onder oplegging van vervangende eisen,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.u
    text: de bewaking van studievoortgang en de individuele studiebegeleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.v
    text: |-
      indien van toepassing: de wijze waarop de selectie van studenten voor een speciaal traject binnen een opleiding,
      bedoeld in [artikel 7.9b][ref1], plaatsvindt,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.2.x
    text: de feitelijke vormgeving van het onderwijs, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: 7.13.2.y
    text: |-
      indien van toepassing: de regeling, bedoeld in [artikel 7.9a, derde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.3
    text: |-
      In de onderwijs- en examenregeling van de associate degree-opleiding wordt beschreven welke mogelijkheden
      er zijn voor een aan de instelling afgestudeerde met een graad Associate degree om door te stromen naar een
      bacheloropleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.13
  - number: '7.14'
    text: |-
      Het instellingsbestuur draagt zorg voor een regelmatige beoordeling van de onderwijs- en examenregeling en weegt
      daarbij, ten behoeve van de bewaking en zo nodig bijstelling van de studielast, het tijdsbeslag dat daaruit voor de
      studenten voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.14
  - number: 7.15.1
    text: 'Het instellingsbestuur verstrekt zodanige informatie aan studenten en aspirant-studenten over:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.a
    text: de instelling,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.b
    text: het te volgen onderwijs in algemene zin,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.c
    text: de differentiatie in het opleidingenaanbod,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.d
    text: de selectie van studenten,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.e
    text: de opleidingsnamen, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.1.f
    text: de graden die aan de opleidingen zijn verbonden,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15.2
    text: |-
      De vertegenwoordiging van de instellingen en de daarvoor in aanmerking komende belangenorganisaties van studenten
      maken gezamenlijke afspraken over de specificaties van de informatie, bedoeld in het eerste lid. Indien zij
      daarin niet slagen, kunnen bij ministeriële regeling die nadere specificaties worden gegeven van inhoud en vorm
      van de informatie die nodig is voor het vergelijken van opleidingen en het kiezen van een passende opleiding. In
      de ministeriële regeling kunnen voor verschillende groepen van instellingen verschillende specificaties worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15
  - number: 7.15a.1
    text: |-
      Onze Minister wijst een rechtspersoon aan die op het terrein van het hoger onderwijs tot taak heeft het verzamelen
      en kosteloos verspreiden van objectieve, betrouwbare en vergelijkbare studiekeuze-informatie en het doen van
      onderzoek naar studenttevredenheid en -betrokkenheid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.2
    text: De rechtspersoon neemt in verband met zijn taak enquêtes af onder studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.3
    text: 'Onze Minister trekt de aanwijzing in ieder geval in indien de rechtspersoon niet langer:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.3.a
    text: zijn taak naar behoren uitoefent;
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.3.b
    text: |-
      voldoet aan hetgeen bij of krachtens de [Comptabiliteitswet 2016][ref1] is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: 7.15a.3.c
    text: voldoet aan in de aanwijzing gestelde eisen met betrekking tot toezicht en verantwoording; of
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.3.d
    text: het overleg, bedoeld in het vierde lid, in voldoende mate pleegt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.4
    text: |-
      De rechtspersoon pleegt over de uitoefening van haar taak geregeld overleg met de vertegenwoordiging van de
      instellingen voor hoger onderwijs en met de daarvoor in aanmerking komende belangenorganisaties van studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.5
    text: |-
      Ten behoeve van de enquêtes, bedoeld in het tweede lid, worden aan de rechtspersoon gegevens verstrekt door het
      instellingsbestuur:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.5.a
    text: |-
      van een bekostigde instelling, bedoeld in [artikel 1.8, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 7.15a.5.b
    text: |-
      van een rechtspersoon voor hoger onderwijs, voor zover dit instellingsbestuur met een of meer opleidingen wenst
      deel te nemen aan de enquêtes.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: 7.15a.6
    text: |-
      Bij ministeriële regeling worden de gegevens, bedoeld in het vijfde lid, vastgesteld en kunnen regels worden
      gesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.15a
  - number: '7.16'
    text: |-
      Het instellingsbestuur kan procedures en criteria voor de erkenning van verworven competenties vaststellen voor
      degenen die niet zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.16
  - number: 7.17.1
    text: |-
      Onverminderd het tweede lid wordt een opleiding verzorgd in de gemeente of het openbaar lichaam BES waar die
      opleiding blijkens het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], is
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.17.2
    text: |-
      Het instellingsbestuur kan besluiten een opleiding of een gedeelte daarvan al dan niet voor een bepaalde periode
      in een of meer andere gemeenten of een of meer openbare lichamen BES te vestigen. Hij legt het in de eerste volzin
      bedoelde voornemen voor een nevenvestiging dan wel verplaatsing van een opleiding ter instemming voor aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17
  - number: 7.17.3
    text: |-
      Voorafgaand aan het nemen van een instemmingsbesluit als bedoeld in het tweede lid stelt Onze Minister de daarvoor
      in aanmerking komende instellingen in de gelegenheid hun zienswijze te geven op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17
  - number: 7.17.4
    text: |-
      De instemming van Onze Minister vervalt, indien de opleiding niet binnen zes maanden nadat de instemming is
      verleend, is geregistreerd in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.17a.1
    text: |-
      Onze Minister kan besluiten dat een opleiding in twee of meer gemeenten, in twee of meer openbare lichamen BES of
      in een of meer gemeenten en een of meer openbare lichamen BES is gevestigd, niet langer in een bij zijn besluit
      genoemde gemeente of openbaar lichaam BES is gevestigd, indien de verzorging van de opleiding in die gemeente
      of dat openbaar lichaam BES, gelet op het geheel van de voorzieningen op het gebied van het hoger onderwijs, in
      redelijkheid niet of niet meer doelmatig kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17a
  - number: 7.17a.2
    text: |-
      Bij zijn besluit bepaalt Onze Minister tevens het tijdstip met ingang waarvan de opleiding niet langer in de
      gemeente of het openbaar lichaam BES, bedoeld in het eerste lid, is gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.17a
  - number: 7.18.1
    text: |-
      Het college voor promoties van een universiteit, de Open Universiteit of een levensbeschouwelijke universiteit is
      bevoegd de graden Doctor of Doctor of Philosophy te verlenen op grond van promotie. De graden Doctor en Doctor of
      Philosophy zijn gelijkwaardig.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.18.2
    text: 'Tot de promotie heeft toegang ieder:'
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.18.2.a
    text: |-
      aan wie op grond van [artikel 7.10a, eerste of tweede lid][ref1], de graad Master is verleend; en die


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.18.2.b
    text: |-
      als proeve van bekwaamheid tot het zelfstandig beoefenen van de wetenschap een proefschrift heeft geschreven dan
      wel een proefontwerp heeft vervaardigd, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.18.2.c
    text: |-
      heeft voldaan aan de eisen, gesteld in het in [artikel 7.19][ref1] bedoelde promotiereglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.3
    text: |-
      In bijzondere gevallen kan het college voor promoties personen die voldoen aan het tweede lid onder b en c maar
      niet voldoen aan dat lid onder a, tot de promotie toegang verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.18.4
    text: |-
      Voor elke promotie wijst het college voor promoties een promotor aan. Als promotor kunnen worden aangewezen een
      hoogleraar of, voor zover aan diegene de graad Doctor of Doctor of Philosophy is verleend, een ander personeelslid
      van een universiteit, een levensbeschouwelijke universiteit of de Open Universiteit dat naar het oordeel van het
      college voor promoties over voldoende bekwaamheid beschikt om als promotor op te treden. De promotie vindt plaats
      ten overstaan van dit college of van een commissie, door het college samen te stellen uit hoogleraren en andere
      personen ten aanzien van wie het heeft geoordeeld dat zij over voldoende bekwaamheid beschikken om in de commissie
      zitting te hebben, met inachtneming van het in [artikel 7.19][ref1] bedoelde promotiereglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.5
    text: |-
      Voor de toepassing van het vierde lid worden de bijzondere hoogleraren bij een openbare universiteit gerekend tot
      de hoogleraren van die universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.18.6
    text: |-
      Een instelling kan gezamenlijk met een of meer Nederlandse of buitenlandse instellingen de graden Doctor of
      Doctor of Philosophy verlenen op grond van een promotie. Het eerste tot en met vijfde lid zijn van overeenkomstige
      toepassing. De instellingen kunnen nadere afspraken maken omtrent de uitvoering binnen het bepaalde in het
      promotiereglement.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.18
  - number: 7.19.1
    text: |-
      Met inachtneming van het daaromtrent bij deze wet bepaalde stelt het college voor promoties het promotiereglement
      vast. In dat reglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19
  - number: 7.19.1.a
    text: |-
      de gang van zaken met betrekking tot de voorbereiding van de promotie en met betrekking tot de promotie zelf,
      daaronder begrepen de taak en bevoegdheden van ieder die bij de promotie is of kan worden betrokken,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19
  - number: 7.19.1.b
    text: |-
      de voorzieningen betreffende de beslechting van geschillen die zich met betrekking tot de voorbereiding van de
      promotie en de promotie zelf kunnen voordoen, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19
  - number: 7.19.1.c
    text: |-
      indien van toepassing, de gang van zaken met betrekking tot [artikel 7.18, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.19.2
    text: |-
      Het college voor promoties is bevoegd om, op voordracht van het instellingsbestuur, wegens zeer uitstekende
      verdiensten aan natuurlijke personen de graad Doctor honoris causa te verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19
  - number: 7.19a.1
    text: |-
      Degene aan wie op grond van [artikel 7.10a][ref1] een graad is verleend, is gerechtigd die graad met de toevoeging
      in zijn eigen naamsvermelding, achter de naam geplaatst, tot uitdrukking te brengen, desgewenst aangevuld met de
      vermelding, bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.19a.2
    text: |-
      De graden en de toevoegingen, bedoeld in [artikel 7.10a][ref1], worden als volgt aangeduid:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
