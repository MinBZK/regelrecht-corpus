        paragraaf: '1'
  - number: 9.40.1.b
    text: |-
      geschillen die voortvloeien uit de [artikelen 9.30a][ref1], [9.18][ref2], [9.32][ref3], [9.33][ref4],
      [9.33a, eerste, tweede lid en derde lid, onder b][ref5], [9.34][ref6], [9.35][ref7], [9.36][ref8], [9.38][ref9]
      en [9.38a][ref10].


