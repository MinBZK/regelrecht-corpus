        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 18.74.2
    text: |-
      Na ten hoogste een jaar na inwerkingtreding van artikel I, onderdeel CI, van de wet van 4 februari 2010 (Stb. 119)
      wordt de behandeling van de geschillen door een college van beroep bijzonder onderwijs dat niet is ingesteld door
      een instellingsbestuur van een bijzondere instelling met een levensbeschouwelijke aard of instellingsbesturen van
      bijzondere instellingen met een levensbeschouwelijke aard overgedragen aan het college van beroep voor het hoger
      onderwijs, bedoeld in [artikel 7.64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel18.74
