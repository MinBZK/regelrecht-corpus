  - number: 15.7.3
    text: Onze Minister kan een bestuurlijke boete opleggen aan degene die in strijd met het eerste of tweede lid handelt.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.7
  - number: '15.8'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen aan de natuurlijke persoon of rechtspersoon die handelt in strijd
      met [artikel 1.22][ref1], [1.23][ref2], [1.24][ref3] of [7.15][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel15.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '15.9'
    text: |-
      De bestuurlijke boete die op grond van [artikel 15.7][ref1] en [artikel 15.8][ref2] kan
      worden opgelegd, bedraagt ten hoogste het bedrag dat is vastgesteld voor de zesde categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3], respectievelijk
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref4] of, indien dat meer is, ten hoogste 10% van de
      omzet van de onderneming, onderscheidenlijk, indien de overtreding door een ondernemersvereniging is begaan, van
      de gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de
      beschikking waarin de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel27
