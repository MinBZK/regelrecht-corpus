        paragraaf: '1'
  - number: 9.34.3.k
    text: |-
      de toekenning aan de raad of het deel van de raad dat uit en door het personeel is gekozen, van de bevoegdheden
      inzake de arbeidsomstandigheden in de universiteit voorzover deze niet betreffen te nemen besluiten van het college
      van bestuur, bedoeld in [artikel 9.33 onderdeel e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.34.3.l
    text: |-
      welke van de geschillen tussen het college van bestuur en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen, bedoeld in [artikel 9.39][ref1], wie het geschil
      aanhangig kan maken en of daarbij de commissie om bemiddeling dan wel een oordeel wordt verzocht, voorzover de
      commissie voor geschillen in haar reglement daarvoor de mogelijkheid biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.34.4
    text: |-
      In het reglement kan, indien dit bevorderlijk is voor een goede toepassing van deze titel, worden bepaald dat een
      of meer groepen van personen die anders dan op grond van een arbeidsovereenkomst dan wel anders dan op grond van
      een inschrijving als student of extraneus aan de universiteit zijn verbonden, worden aangemerkt als personeelsleden
      onderscheidenlijk studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.34
  - number: '9.35'
    text: |-
      Indien een te nemen besluit op grond van [artikel 9.33a][ref1] of het reglement van de universiteitsraad, krachtens
      [artikel 9.34, derde lid onderdeel b][ref2], vooraf voor advies dient te worden voorgelegd aan de raad, draagt het
      college van bestuur onderscheidenlijk de raad van toezicht er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.35.a
    text: advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de besluitvorming,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.35
  - number: 9.35.b
    text: de raad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.35
  - number: 9.35.c
    text: |-
      de raad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte advies
      gevolg wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.35
  - number: 9.35.d
    text: |-
      de raad, indien het college van bestuur onderscheidenlijk de raad van toezicht het advies niet of niet geheel
      wil volgen, in de gelegenheid wordt gesteld nader overleg met hem te voeren alvorens het besluit definitief wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.35
  - number: 9.36.1
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van het deel van de universiteitsraad dat uit en door
      het personeel is gekozen, voor elk door het college van bestuur te nemen besluit met betrekking tot aangelegenheden
      van algemeen belang voor de bijzondere rechtstoestand van het personeel in de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.36
  - number: 9.36.2
    text: |-
      Het instemmingsrecht in aangelegenheden als bedoeld in het eerste lid wordt niet uitgeoefend, voorzover de
      desbetreffende aangelegenheid voor de universiteit reeds inhoudelijk is geregeld in een bij of krachtens de
      wet gegeven voorschrift of een collectieve arbeidsovereenkomst. Het instemmingsrecht wordt evenmin uitgeoefend,
      voorzover de medezeggenschap met betrekking tot de desbetreffende aangelegenheid reeds op andere wijze is
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.36
  - number: 9.37.1
    text: Indien een universiteit meer dan een faculteit omvat, is aan elke faculteit een faculteitsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.37
  - number: 9.37.2
    text: |-
      De faculteitsraad oefent tegenover de decaan van de faculteit het instemmingsrecht en het adviesrecht uit die
      toekomen aan de universiteitsraad, voorzover het aangelegenheden betreft die de faculteit in het bijzonder aangaan
      en de desbetreffende bevoegdheden tevens aan de decaan zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.37
  - number: 9.37.3
    text: |-
      [Artikel 9.31, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.37.4
    text: |-
      Indien een universiteit slechts een faculteit omvat, worden de taken en bevoegdheden van de faculteitsraad
      uitgeoefend door de universiteitsraad.
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.37
  - number: 9.37.5
    text: |-
      De personeelsgeleding van de faculteitsraad oefent tegenover de decaan van de faculteit de rechten uit, bedoeld
      in [artikel 9.50][ref1], voorzover het aangelegenheden betreft die de faculteit in het bijzonder aangaan en de
      desbetreffende bevoegdheden tevens aan de decaan zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '6'
  - number: '9.38'
    text: |-
      De decaan behoeft de voorafgaande instemming van de faculteitsraad voor elk door hem te nemen besluit met
      betrekking tot ten minste de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel9.38
  - number: 9.38.a
