    text: |-
      of de opleiding is geaccrediteerd dan wel de toets nieuwe opleiding met positief gevolg heeft ondergaan alsmede de
      geldigheidsduur daarvan,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
  - number: 6.13.4.d
    text: de indeling in het register,
    url: https://wetten.overheid.nl/BWBR0005682/2021-07-03#Artikel6.13
  - number: 6.13.4.e
    text: |-
      indien het een gezamenlijke opleiding, een gezamenlijke afstudeerrichting of een gezamenlijk Ad-programma als
      bedoeld in [artikel 7.3c][ref1] betreft: aan welke instellingen de opleiding, de afstudeerrichting of het Ad-
      programma wordt verzorgd,


