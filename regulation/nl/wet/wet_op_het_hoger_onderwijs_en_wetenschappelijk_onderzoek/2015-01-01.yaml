  - number: 6.13.6
    text: |-
      Onze minister legt het ontwerp van de algemene maatregel van bestuur, bedoeld in het derde lid, voor aan de Tweede
      Kamer der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet gedaan dan nadat dertig
      dagen na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Het instellingsbestuur kan een opleiding na de verlening van accreditatie aanmelden voor registratie. Het
      instellingsbestuur kan een opleiding die de instelling voornemens is te verzorgen, aanmelden voor registratie,
      nadat die opleiding de toets nieuwe opleiding met positief gevolg heeft ondergaan. Het instellingsbestuur kan
      een Ad-programma dat de instelling voornemens is te verzorgen, aanmelden voor registratie, nadat dat Ad-programma
      de toets nieuw Ad-programma met positief gevolg heeft ondergaan. Indien er sprake is van het ongedaan maken van
      een samenvoeging als bedoeld in [artikel 6.2, vijfde lid][ref1], meldt het instellingsbestuur de oorspronkelijke
      opleidingen opnieuw aan voor registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.14.2
    text: |-
      De aanmelding geschiedt onder vermelding van de gegevens, bedoeld in [artikel 6.13, vierde lid][ref1]. Bij de
      aanmelding van een geaccrediteerde opleiding, voegt het instellingsbestuur het accreditatierapport, bedoeld
      in [artikel 5a.10, eerste lid][ref2]. Bij de aanmelding van een opleiding die de toets nieuwe opleiding met
      positief gevolg heeft ondergaan, voegt het instellingsbestuur het rapport van de toets nieuwe opleiding en het
      besluit van instemming van Onze minister, bedoeld in [artikel 6.2, eerste lid][ref3]. Indien de indeling van het
      Centraal register opleidingen hoger onderwijs naar het oordeel van het instellingsbestuur niet voldoet, volstaat
      het instellingsbestuur met een aanduiding van het onderdeel dat naar zijn oordeel het gebied van de opleiding
      onderscheidenlijk het Ad-programma het best omschrijft. Het instellingsbestuur dat een masteropleiding in het
      wetenschappelijk onderwijs aanmeldt voor registratie, voegt zo nodig het besluit van Onze minister, bedoeld in
      [artikel 7.4a, vijfde lid, eerste volzin][ref4], toe. Het instellingsbestuur dat een Ad-programma aanmeldt voor
      registratie voegt het rapport van de toets nieuw Ad-programma en het besluit van instemming van Onze minister,
      bedoeld in artikel 6.2, eerste lid, bij.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
