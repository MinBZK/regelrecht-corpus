  - number: 6.10.1
    text: |-
      Onze minister kan besluiten dat aan een opleiding of aan alle opleidingen, onderscheidenlijk een Ad-
      programma of alle Ad-programma’s, verzorgd door een rechtspersoon voor hoger onderwijs, de rechten, genoemd in
      [artikel 1.12, eerste lid][ref1], worden ontnomen, indien de continuïteit van de desbetreffende rechtspersoon of de
      naleving van artikel 1.12, tweede en derde lid, niet of niet langer is gewaarborgd.


