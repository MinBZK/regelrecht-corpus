        paragraaf: '1'
  - number: 6.14.3
    text: |-
      Onze Minister registreert binnen een redelijke termijn de opleiding onderscheidenlijk het Ad-programma
      overeenkomstig de door het instellingsbestuur verstrekte gegevens in het Centraal register opleidingen hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.14
  - number: 6.14.4
    text: |-
      Indien de gegevens niet volledig zijn of de indeling in het Centraal register opleidingen hoger onderwijs
      naar het oordeel van Onze minister in redelijkheid niet passend kan worden geacht voor de opleiding
      onderscheidenlijk, voor zover het betreft het niet volledig zijn van de gegevens, het Ad-programma, stelt Onze
      Minister het instellingsbestuur in de gelegenheid om, binnen een door Onze Minister te bepalen termijn, te
      voorzien in de ontbrekende gegevens onderscheidenlijk de indeling te herzien. Indien het betreft de gegevens,
      bedoeld in het tweede lid, derde volzin, stelt Onze Minister de termijn vast binnen de termijn, bedoeld in
      [artikel 5a.11, zesde lid, onderdeel c of d][ref1]. Onverminderd [artikel 6.15][ref2] weigert Onze Minister
      registratie in het register uitsluitend, indien Onze Minister de gegevens binnen deze termijn niet of niet volledig
      heeft ontvangen, indien hij constateert dat de gegevens niet juist zijn, of indien de herziene indeling naar het
      oordeel van Onze minister in redelijkheid niet passend geoordeeld kan worden voor de opleiding onderscheidenlijk,
      voor zover het betreft het niet of niet volledig ontvangen van de gegevens binnen de gestelde termijn of het niet
      juist zijn van de gegevens, het Ad-programma.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.14.5
    text: |-
