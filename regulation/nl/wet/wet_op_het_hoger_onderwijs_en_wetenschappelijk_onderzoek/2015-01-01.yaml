    text: |-
      met toepassing van [artikel 7.45, tweede lid][ref1], indien het deelname aan een deeltijdse of duale opleiding
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel15.2
    references:
