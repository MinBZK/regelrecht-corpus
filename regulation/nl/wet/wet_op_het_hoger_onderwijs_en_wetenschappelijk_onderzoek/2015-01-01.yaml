      onjuist zijn of de indeling niet passend is voor de opleiding, kunnen de gegevens of de indeling door Onze minister
      aangepast worden. Onze minister heeft dezelfde bevoegdheid voor zover het betreft het onvolledig of onjuist zijn
      van de gegevens voor het Ad-programma.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.14
