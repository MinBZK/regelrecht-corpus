  - number: 18.75.4
    text: |-
      Onze minister trekt de aanwijzing bedoeld in het derde lid in, indien de instelling geen in het Centraal
      register opleidingen hoger onderwijs geregistreerde opleiding verzorgt of niet wordt voldaan aan
      [artikel 1.12, tweede, derde of vierde lid][ref1]. [Artikel 6.10, vierde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
