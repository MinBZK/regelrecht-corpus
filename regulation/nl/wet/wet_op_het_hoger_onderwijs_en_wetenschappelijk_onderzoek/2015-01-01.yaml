        artikel: '5'
  - number: 15.1.3
    text: |-
      Onze minister kent de rijksbijdrage wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel15.1
  - number: '15.2'
    text: |-
      Degene die niet is ingeschreven en gebruikmaakt van onderwijs- of examenvoorzieningen ten behoeve van onderwijs
      van een in de bijlage van deze wet opgenomen instelling, is deswege aan die instelling een schadevergoeding
      verschuldigd, die door het instellingsbestuur wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel15.2
  - number: 15.2.a
    text: |-
      met toepassing van [artikel 7.46, tweede lid][ref1], indien het deelname aan een voltijdse opleiding betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel15.2
