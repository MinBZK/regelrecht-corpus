      [artikel 7.51, eerste lid, onderdeel f, of vierde lid, tweede volzin][ref1], stelt regels vast met betrekking
      tot de afhandeling van de wederzijdse financiële verplichtingen ten aanzien van de opslag, bedoeld in
      [artikel 7.45, eerste lid, tweede volzin][ref2], van de wet zoals deze luidde op 1 september 2011.


