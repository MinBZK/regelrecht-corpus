      de opleiding of het programma binnen een opleiding, bedoeld in [artikel 6.7, tweede lid][ref1], moet worden
      beschouwd als een nieuwe opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
