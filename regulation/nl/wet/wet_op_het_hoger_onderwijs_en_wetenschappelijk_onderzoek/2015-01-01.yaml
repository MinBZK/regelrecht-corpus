  - number: 18.75.5
    text: |-
      De instellingen die geaccrediteerd postinitieel onderwijs verzorgen als bedoeld in [artikel 1.12a][ref1],
      zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van artikel I, onderdeel L van de wet van
      4 februari 2010 (Stb. 119),worden met ingang van de datum van inwerkingtreding van artikel I, onderdeel L,
      van de wet van 4 februari 2010 (Stb. 119) beschouwd als rechtspersonen voor hoger onderwijs als bedoeld in
      [artikel 1.1, onder aa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
