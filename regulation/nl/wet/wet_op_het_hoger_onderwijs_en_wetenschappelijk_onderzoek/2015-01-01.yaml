    text: |-
      welke van de geschillen tussen het college van bestuur en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen, bedoeld in [artikel 9.39][ref1], wie het geschil
      aanhangig kan maken en of daarbij de commissie om bemiddeling dan wel een oordeel wordt verzocht, voorzover de
      commissie voor geschillen in haar reglement daarvoor de mogelijkheid biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.34
    references:
