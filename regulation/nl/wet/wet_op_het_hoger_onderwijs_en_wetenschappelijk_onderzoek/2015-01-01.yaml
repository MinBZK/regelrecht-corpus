  - number: 9.15.1.i
    text: |-
      het sluiten van een gemeenschappelijke regeling ten behoeve van een of meer opleidingen met een of meer decanen van
      andere faculteiten,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.15
  - number: 9.15.1.j
    text: |-
      de uitvoering van de [artikelen 6.7a][ref1] en [7.9b][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.15
