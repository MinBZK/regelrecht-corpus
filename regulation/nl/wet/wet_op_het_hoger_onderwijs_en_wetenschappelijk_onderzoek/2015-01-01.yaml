  - number: '16.3'
    text: |-
      Naast de bewijzen van voldoende didactische voorbereiding die voor 1 augustus 1993 aan een hogeschool of
      voor 1 september 1993 aan een universiteit zijn verkregen, alsmede de verklaringen van voldoende didactische
      voorbereiding die op grond van artikel 54, vierde lid, of artikel 110a, vierde lid, van de Wet op het hoger
      beroepsonderwijs zijn verkregen, gelden als zodanig de op 31 juli 1986 bestaande bewijzen van voldoende
      pedagogische en didactische voorbereiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.3
  - number: '16.4'
    text: |-
      Tot het tijdstip van inwerkingtreding van de algemene maatregel van bestuur, bedoeld in de [artikelen 13.1][ref1]
      en [13.3][ref2], blijven de op het tijdstip van inwerkingtreding van deze wet geldende regels ten aanzien van de
      desbetreffende leden van bestuursorganen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel13
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
  - number: '16.9'
    text: |-
      Op de beroepsopleidingen, bedoeld in [artikel 12.3.9, eerste lid, van de Wet educatie en beroepsonderwijs][ref1],
      die door de bijzondere hogeschool te Haarlem of door de rechtspersoon aan wie de instandhouding van die hogeschool
      is overgedragen, worden verzorgd, blijft [artikel E.65, tweede lid, van de Invoeringswet W.H.B.O.][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003966
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003966
  - number: 16.11.1
    text: |-
      Degenen die een getuigschrift hebben verkregen van een met goed gevolg afgelegd doctoraal examen of propedeutisch
      examen als bedoeld in de Wet op het wetenschappelijk onderwijs, afsluitend examen of propedeutisch examen als
      bedoeld in de Wet op het hoger beroepsonderwijs of examen van een diplomaprogramma als bedoeld in de Wet op de Open
      Universiteit, worden geacht dat getuigschrift te hebben verkregen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.11
  - number: 16.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op opleidingen op het gebied van het hoger onderwijs die in
      het tijdvak 1970 tot en met 1998 zijn bekostigd op grond van de [Experimentenwet onderwijs][ref1], alsmede op de
      getuigschriften en examens, bedoeld in [artikel D.10 van de Invoeringswet W.H.B.O.][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0002718
      [ref2]: https://wetten.overheid.nl/BWBR0003966#ArtikelD
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.11
    references:
      - id: ref1
        bwb_id: BWBR0002718
      - id: ref2
        bwb_id: BWBR0003966
        artikel: D
  - number: 16.12.1
    text: |-
      Degenen die op grond van de Wet op het wetenschappelijk onderwijs of de Wet op de Open Universiteit
      gerechtigd zijn de titel doctor te voeren, worden geacht dat recht te hebben verkregen op grond van
      [artikel 7.22, eerste lid][ref1], zoals die bepaling op 31 augustus 2002 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.12.2
    text: |-
      Het doctoraat in de godgeleerdheid of in de wijsbegeerte, verkregen aan een Nederlandse kerkelijke instelling
      van wetenschappelijk onderwijs, welke reeds op 1 januari 1960 dit doctoraat verleende, geeft het recht tot het
      voeren van de titel doctor. [Artikel 7.22, derde lid][ref1], zoals die bepaling op 31 augustus 2002 luidde, is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.13.1
    text: |-
      Degenen die op grond van de Wet op het wetenschappelijk onderwijs, de Wet op het hoger beroepsonderwijs,
      de [Invoeringswet W.H.B.O.][ref1] of de Wet op de Open Universiteit gerechtigd zijn een of meer van
      de in die wetten geregelde titels te voeren, worden geacht dat recht te hebben verkregen op grond van
      [artikel 7.20, eerste lid][ref2], zoals die bepaling op 31 augustus 2002 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0003966
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0003966
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.13.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de opleidingen, bedoeld in [artikel 16.11, tweede lid][ref1],
      doch uitsluitend voorzover krachtens de Experimentenwet onderwijs het recht tot het voeren van de titel ingenieur,
      afgekort tot ing., of de titel baccalaureus is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '3'
  - number: 16.13.3
    text: |-
      [Artikel 7.20, eerste lid, aanhef en onder a][ref1], zoals die bepaling op 31 augustus 2002 luidde, is van
      overeenkomstige toepassing op degene die in het tijdvak 5 mei 1945 tot en met 31 december 1948 het diploma van
      vliegtuigbouwkundig ingenieur heeft verkregen aan de Technische Hogeschool te Delft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.13.4
    text: |-
      In afwijking van [artikel 7.20, eerste lid, aanhef en onder c][ref1], zoals die bepaling op 31 augustus
      2002 luidde, is degene die in het studiejaar 1992–1993 was ingeschreven voor de in het Academisch Statuut
      bedoelde internationaal-juridische, juridisch bestuurswetenschappelijke of juridisch politiekwetenschappelijke
      studierichting en die in het studiejaar 1993–1994 of het studiejaar 1994–1995 die opleiding heeft
      afgerond door met goed gevolg het afsluitend examen af te leggen, gerechtigd tot het voeren van de in
      [artikel 7.20, eerste lid, onder d][ref2], zoals die bepaling op 31 augustus 2002 luidde, bedoelde titel, mits de
      examencommissie op zijn verzoek op het desbetreffende getuigschrift een aantekening heeft geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.14.1
    text: |-
      Aan het Internationaal Instituut voor Sociale Studiën te ’s-Gravenhage kan het doctoraat worden verkregen
      op grond van de promotie. Tot de promotie heeft toegang ieder die met goed gevolg het afsluitend
      examen verbonden aan een opleiding in het derde lid, heeft afgelegd, dan wel aan wie op grond van
      [artikel 7.10a, eerste, tweede of derde lid][ref1], de graad Master is verleend, onverminderd het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 16.14.2
    text: |-
      De [artikelen 1.12, vijfde lid][ref1], [1.18, eerste lid, eerste en tweede volzin, en tweede lid][ref2],
      [7.18, tweede lid, aanhef en onder b en c, derde, vierde en vijfde lid][ref3], [7.19][ref4] en [7.22][ref5] zijn
      van overeenkomstige toepassing, met dien verstande dat van het college voor promoties een of meer hoogleraren van
      een in de bijlage van deze wet onder a of b opgenomen universiteit deel uitmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.14.3
    text: |-
      Onze minister besluit op grond van welke opleidingen, verzorgd door het Internationaal Instituut voor Sociale
      Studiën, toegang tot de promotie kan worden verkregen. Het besluit wordt niet genomen dan nadat ten genoegen van
      Onze minister door het instellingsbestuur het bewijs is geleverd van voldoende kwaliteit van de desbetreffende
      onderwijsactiviteiten alsmede het bewijs dat wordt voldaan aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
  - number: 16.14.4
    text: |-
      Onze minister kan een besluit als bedoeld in het derde lid intrekken, indien gebleken is dat de kwaliteit van de
      desbetreffende onderwijsactiviteiten gedurende een reeks van jaren onvoldoende is geweest dan wel niet of niet meer
      voldaan wordt aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
  - number: 16.14.5
    text: |-
      Indien Onze minister voornemens is toepassing te geven aan het vierde lid, geeft hij een waarschuwing aan het
      instellingsbestuur, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en
      desgewenst overleg met hem dienaangaande kan plaatsvinden. De termijn waarbinnen aan de waarschuwing gevolg moet
      zijn gegeven, bedraagt ten minste drie maanden. Bij zijn besluit tot intrekking bepaalt Onze minister het tijdstip
      waarop de intrekking van kracht wordt, zodanig dat degenen die de voorbereiding van de promotie reeds ter hand
      hebben genomen, binnen redelijke termijn het doctoraat kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
  - number: 16.14.6
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het vierde lid, wordt opgeschort, totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.14
  - number: 16.16.1
    text: |-
      De rechtspersoon die een bijzondere hogeschool in stand houdt, kan de instandhouding daarvan
      overdragen aan een andere rechtspersoon die een bijzondere hogeschool in stand houdt en die voldoet aan
      [artikel 10.8, eerste lid][ref1] of kan fuseren met een rechtspersoon die een andere bijzondere hogeschool in
      stand houdt. De overdracht van de instandhouding alsmede de fusie bedoeld in de eerste volzin wordt aangemerkt als
      bestuurlijke fusie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '4'
  - number: 16.16.2
    text: |-
      Een rechtspersoon die twee of meer hogescholen in stand houdt, kan deze samenvoegen tot een hogeschool. Deze
      samenvoeging wordt aangemerkt als institutionele fusie.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16
  - number: 16.16.3
    text: |-
      De overdracht, bedoeld in het eerste lid, geschiedt bij notariële akte. Bij die akte verbindt de overdragende
      rechtspersoon zich tevens de rechten ten aanzien van de gebouwen, terreinen en roerende zaken over te dragen. Die
      akte geldt tevens als akte van levering bedoeld in [boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt
      tevens bepaald dat het lichaam waaraan of de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke
      betrekkingen aan de instelling aanstelt met ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: 16.16.4
    text: |-
      Door overdracht met inachtneming van het eerste en derde lid treedt het verkrijgende lichaam op of de verkrijgende
      rechtspersoon in alle uit de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16
  - number: 16.16.5
    text: |-
      De [artikelen 16.16 tot en met 16.16c][ref1], met uitzondering van artikel 16.16, tweede lid, zijn van
      overeenkomstige toepassing op de rechtspersonen die bijzondere universiteiten in stand houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.16a.1
    text: |-
      Een institutionele dan wel bestuurlijke fusie wordt niet tot stand gebracht dan nadat daarvoor goedkeuring is
      verleend door Onze Minister. De eerste volzin geldt eveneens indien daarbij is betrokken een bestuursoverdracht van
      rechtspersonen die een instelling als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] in stand houden, of
      een school als bedoeld in de [Wet op het voortgezet onderwijs][ref2] aan een rechtspersoon die een instelling in
      stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0002399
  - number: 16.16a.2
    text: |-
      De rechtspersoon dan wel de rechtspersonen dan wel de instellingen dienen gezamenlijk een aanvraag in bij Onze
      Minister voor het verkrijgen van de goedkeuring bedoeld in het eerste lid. De aanvraag gaat vergezeld van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.2.a
    text: |-
      een fusie-effectrapportage opgesteld door de betrokken rechtspersoon dan wel rechtspersonen dan wel door de
      betrokken instellingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.2.b
    text: |-
      een schriftelijke verklaring van instemming van de medezeggenschapsraden, dan wel voor zover het betreft een
      bijzondere universiteit de universiteitsraden, over de voorgenomen fusie die is voorafgegaan door de kennisname van
      de fusie-effectrapportage door de medezeggenschapsraden respectievelijk de universiteitsraden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.3
    text: |-
      De schriftelijke verklaring van instemming, bedoeld in het tweede lid, onderdeel b, maakt onderdeel uit van de
      mededeling, bedoeld in [artikel 1.8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 16.16a.4
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.a
    text: de motieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding van
      voorzieningen en de diversiteit van het onderwijsaanbod in het hoger beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.f
    text: de kosten en baten van de fusie,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.g
    text: |-
      de gevolgen van de fusie voor het personeel en de studenten, waaronder begrepen de gevolgen voor de dienstverlening
      en de voorzieningen en de eventuele gevolgen voor andere belanghebbende partijen,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.h
    text: de wijze waarop over de fusie wordt gecommuniceerd, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.4.i
    text: de wijze waarop de fusie wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16a.5
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16a
  - number: 16.16b.1
    text: |-
      Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie, de daadwerkelijke variatie van
      het onderwijsaanbod, zowel in het opzicht van de spreiding van voorzieningen als de diversiteit van het
      opleidingenaanbod in het hoger onderwijs, gelet op het geheel van de voorzieningen op het gebied van het onderwijs
      op significante wijze wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16b
  - number: 16.16b.2
    text: |-
      Onze Minister verleent zijn goedkeuring aan een institutionele fusie indien dit noodzakelijk is voor de
      voortzetting van de uit de wet voortvloeiende rechten en verplichtingen van een of meer betrokken hogescholen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16b
  - number: 16.16b.3
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door de
      adviescommissie, bedoeld in [artikel 6.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.16b.4
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16b
  - number: 16.16c.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 16.16b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.16c.2
    text: |-
      De termijn bedoeld in het eerste lid kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt binnen
      de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16c
  - number: 16.16c.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.16c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '16.17'
    text: |-
      Onze minister kan goedkeuren dat een bekostigde hogeschool wordt gesplitst of een andere plaats van vestiging
      krijgt. Onze minister kan aan zijn goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.17
  - number: '16.18'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere hogeschool in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande, splitsende
      rechtspersoon de hogeschool in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van
      de hogeschool overgaat. In het laatste geval is [artikel 16.16, tweede en derde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.18
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.1
    text: |-
      In geval van een fusie als bedoeld in [artikel 16.16][ref1] worden het lichaam dat of de rechtspersoon die de
      desbetreffende instelling na de fusie, bedoeld in artikel 16.16, in stand houdt, geacht met onmiddellijke ingang
      te zijn opgenomen in de bijlage van deze wet en wordt het lichaam of de rechtspersoon waardoor de fusie, bedoeld in
      artikel 16.16, is verricht, geacht vanaf dat tijdstip niet langer in de bijlage van deze wet te zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.2
    text: |-
      In geval van omzetting, splitsing of verplaatsing van een hogeschool, in overeenstemming met [artikel 16.17][ref1],
      dan wel in geval van samenvoeging van twee of meer hogescholen worden de daaruit voortkomende hogescholen geacht
      met onmiddellijke ingang te zijn opgenomen in de bijlage van deze wet en worden de hogescholen waaruit zij
      voortkomen, geacht vanaf dat tijdstip niet langer in de bijlage te zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.3
    text: |-
      In geval van splitsing van een rechtspersoon en overgang van de instandhouding van een hogeschool als bedoeld
      in [artikel 16.18][ref1] wordt de rechtspersoon die de hogeschool na de splitsing in stand houdt, geacht met
      onmiddellijke ingang te zijn opgenomen in de bijlage van deze wet en wordt de rechtspersoon die de hogeschool voor
      de splitsing in stand hield, geacht vanaf dat tijdstip niet langer in die bijlage te zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.4
    text: |-
      In geval van opheffing van een openbare hogeschool of verlies van de aanspraak op bekostiging van een bijzondere
      hogeschool wordt deze hogeschool geacht met onmiddellijke ingang niet langer in de bijlage van deze wet te zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel16.19
  - number: '17.4'
    text: |-
      Personeel van niet bekostigde ingevolge deze wet aangewezen hogescholen dat op grond van artikel B2, eerste lid,
      onder b, van de Algemene burgerlijke pensioenwet, zoals deze bepaling luidde bij inwerkingtreding van deze wet, de
      ambtenarenstatus verworven heeft, is onder dezelfde voorwaarden met ingang van 1 januari 1996 overheidswerknemer
      in de zin van [artikel 2 van de Wet privatisering ABP][ref1] en behoudt voor zolang dat dienstverband voortduurt
      die status.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel17.4
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 17.10.1
    text: |-
      Onverminderd [artikel 7.51][ref1] treft het instellingsbestuur van een universiteit of hogeschool een
      financiële voorziening ten aanzien van een student die op grond van een van de [artikelen 10.7][ref2] of
      [10.8 van de Wet studiefinanciering 2000][ref3] geen aanspraak kan maken op studiefinanciering op de voet van
      [hoofdstuk 3 van die wet][ref4], indien de student naar het oordeel van het instellingsbestuur door bijzondere
      omstandigheden het bij of krachtens de [artikelen 10.6 tot en met 10.8 van de Wet studiefinanciering 2000][ref5]
      bepaalde resultaat niet heeft behaald. Deze financiële voorziening is zodanig dat de betrokkene niet in een
      slechtere financiële situatie wordt gebracht dan wanneer hij studiefinanciering zou hebben genoten zonder
      toepassing van [artikel 10.6 van de Wet studiefinanciering 2000][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel17.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0011453
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0011453
        artikel: '10'
  - number: 17.10.2
    text: |-
      De bijzondere omstandigheden, bedoeld in het eerste lid, zijn de bijzondere omstandigheden, genoemd in
      [artikel 7.51, tweede lid][ref1]. Bij de toepassing van het eerste lid betrekt het instellingsbestuur
      als bijzondere omstandigheid tevens de omstandigheid dat de opleiding zodanig is ingericht dat de student
      redelijkerwijs niet in staat is geweest het in dat lid bedoelde resultaat te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel17.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 18.2.1
    text: |-
      Het instellingsbestuur meldt uiterlijk 30 dagen na de dag van inwerkingtreding van de wet van 6 juni 2002 (Stb.
      302) aan Onze Minister, wanneer de beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], van een opleiding voor
      het laatst heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.2.2
    text: |-
      Onze Minister maakt de uit de [artikelen 18.27 tot en met 18.30][ref1] voortvloeiende wijzigingen in het Centraal
      register opleidingen hoger onderwijs, bedoeld in [artikel 6.13](onbekend), bekend binnen vier maanden na de dag
      van inwerkingtreding van de wet van 6 juni 2002 (Stb. 302). Van deze bekendmaking wordt mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '6'
  - number: 18.5.1
    text: |-
      Onze minister zendt binnen vijf jaar na de inwerkingtreding van de wet van 6 juni 2002 (Stb. 302) aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten in de praktijk van die wet.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.5
  - number: 18.5.2
    text: |-
      Onze minister zendt binnen vijf jaar na de inwerkingtreding van de wet van 6 juni 2002 (Stb. 302) en vervolgens
      telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het
      functioneren van het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.5
  - number: '18.15'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde of aangewezen universiteit of aan de
      Open Universiteit opleidingen als bedoeld in [artikel 7.3][ref1], zoals dat artikel op 31 augustus 2002 luidde,
      worden verzorgd, voorzover die opleidingen op 31 augustus 2002 aan die instelling zijn verbonden. Het tijdstip,
      vastgesteld bij het in de eerste volzin bedoelde koninklijk besluit, is 1 september van enig jaar. Het koninklijk
      besluit wordt vastgesteld en bekendgemaakt voor 1 september van het jaar dat voorafgaat aan het tijdstip,
      vastgesteld bij dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.19.1
    text: |-
      De opleidingen in het hoger beroepsonderwijs waarvan de studielast op 31 augustus 2002 168 studiepunten bedroeg,
      zijn met ingang van 1 september 2002 bacheloropleidingen als bedoeld in artikel 7.3a, tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.19
  - number: 18.19.2
    text: |-
      Onder de opleidingen, bedoeld in het eerste lid, worden mede begrepen de opleidingen die zijn ingesteld en
      geregistreerd in het Centraal register opleidingen hoger onderwijs dan wel tijdig voor registratie in dat register
      zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.19
  - number: 18.20.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde hogeschool opleidingen in het hoger
      beroepsonderwijs als bedoeld in [artikel 7.4, vierde en vijfde lid][ref1], zoals die artikelleden op 31 augustus
      2002 luidden, worden verzorgd, voorzover die opleidingen op 31 augustus 2002 aan die hogeschool zijn verbonden.
      [Artikel 18.15, tweede en derde volzin][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
  - number: 18.20.2
    text: |-
      Met ingang van het tijdstip, vastgesteld bij het in het eerste lid bedoelde koninklijk besluit, worden geen
      studenten of extraneï voor de eerste maal voor de propedeutische fase van een opleiding als bedoeld in dit artikel
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.20
  - number: 18.20.3
    text: Het in het eerste lid bedoelde tijdstip kan voor de onderscheiden opleidingen verschillend worden bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.20
  - number: 18.29.1
    text: |-
      Aan de bacheloropleidingen, bedoeld in [artikel 7.3a, tweede lid, onder a][ref1], die een voortzetting vormen
      van opleidingen die voor de dag van de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn
      geregistreerd in het Centraal register opleidingen hoger onderwijs, en waarvan de beoordeling, bedoeld in
      [artikel 1.18, eerste lid][ref2], heeft plaatsgevonden voor 1 januari 2000, is accreditatie verbonden tot en met
      31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.29.2
    text: |-
      Aan de opleidingen, bedoeld in [artikel 7.3a, tweede lid, onder a][ref1], die een voortzetting vormen van
      opleidingen die voor de dag van de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn
      geregistreerd in het Centraal register opleidingen hoger onderwijs, is accreditatie verbonden tot en met
      31 december van het zesde jaar na de laatste beoordeling, bedoeld in [artikel 1.18, eerste lid][ref2], indien die
      beoordeling heeft plaatsgevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.29.2.a
    text: na 31 december 1999 en voor 1 januari 2004, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.29
  - number: 18.29.2.b
    text: |-
      na 1 januari 2004 en de instelling aantoont dat op 1 december 2001 de start van die beoordeling was gepland op een
      datum die eerder is dan de eerste plaatsing van de accreditatiekaders in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.29
  - number: 18.29.3
    text: |-
      Aan de opleidingen, bedoeld in [artikel 7.3a, tweede lid, onder a][ref1], die een voortzetting vormen van
      opleidingen die blijkens het Centraal register opleidingen hoger onderwijs zijn gestart of zullen starten met
      ingang van enig studiejaar, in de periode van de studiejaren vanaf 2000–2001 tot en met 2003–2004, is accreditatie
      verbonden tot en met 31 december van het kalenderjaar zes jaar na de start van de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.30.1
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.20, die een voortzetting vormen van opleidingen die voor de dag van
      de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn geregistreerd in het Centraal register
      opleidingen hoger onderwijs, en waarvan de beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], heeft
      plaatsgevonden voor 1 januari 2000, is accreditatie verbonden tot en met 31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.30.2
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.20, die een voortzetting vormen van opleidingen die voor de dag van
      de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn geregistreerd in het Centraal register
      opleidingen hoger onderwijs, is accreditatie verbonden tot en met 31 december van het zesde jaar na de laatste
      beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], indien die beoordeling heeft plaatsgevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.30
