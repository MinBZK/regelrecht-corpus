        artikel: '14'
  - number: 7.25.2
    text: |-
      Bij ministeriële regeling kunnen tevens worden aangewezen, vakken en andere programmaonderdelen die deel moeten
      hebben uitgemaakt van het examen ter verkrijging van een in het eerste lid bedoeld diploma om te kunnen worden
      ingeschreven voor een bepaalde bij die ministeriële regeling aangewezen opleiding of groep van opleidingen, indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.2.a
    text: |-
      een diploma dat betrekking heeft op een profiel waarvan het profieldeel niet voor alle kandidaten dezelfde vakken
      en andere programmaonderdelen omvat;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.2.b
    text: een diploma dat betrekking heeft op een ander profiel dan een krachtens het eerste lid aangewezen profiel;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.2.c
    text: in bijzondere gevallen, een opleiding waarop geen enkel profiel zonder meer een goede voorbereiding geeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.3
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld om te worden ingeschreven voor een bepaalde opleiding of
      groep van opleidingen in het hoger beroepsonderwijs in verband met de gewenste aansluiting van het diploma van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.3.a
    text: |-
      een middenkaderopleiding of een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d, onderscheidenlijk e, van de Wet educatie en beroepsonderwijs][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.25.3.b
    text: |-
      een bij de ministeriële regeling, bedoeld in [artikel 7.24, tweede lid, onder g][ref1], aangewezen vakopleiding op
      een opleiding of een groep van opleidingen in het hoger beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25.4
    text: |-
      De vertegenwoordigers van de hogescholen en van de instellingen, bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1], kunnen gezamenlijk voorstellen doen
      over de gewenste invulling van de aansluiting, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 7.25.5
    text: |-
      Het instellingsbestuur kan bepalen dat de bezitter van een diploma, genoemd in het eerste of derde lid, die
      niet voldoet aan de in het eerste, tweede of derde lid bedoelde voorwaarden, toch wordt ingeschreven, onder de
      voorwaarde dat blijkens een onderzoek wordt voldaan aan inhoudelijk daarmee vergelijkbare eisen. Aan deze eisen
      moet zijn voldaan voor de aanvang van de opleiding, met dien verstande dat bij ministeriële regeling opleidingen
      kunnen worden aangewezen voor welke, in door het instellingsbestuur te bepalen gevallen en onder door het
      instellingsbestuur vast te stellen voorwaarden, aan de eisen kan worden voldaan uiterlijk bij afronding van de
      propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in die opleiding met een studielast
      van 60 studiepunten. De eisen worden opgenomen in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
  - number: 7.25.6
    text: |-
      [Artikel 7.24, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25a.1
    text: |-
      Voor de opleiding tot leraar basisonderwijs kunnen bij of krachtens algemene maatregel van bestuur als voorwaarde
      voor de inschrijving tot die opleiding bijzondere nadere vooropleidingseisen worden gesteld. Indien uitvoering is
      gegeven aan de eerste volzin, is [artikel 7.25, tweede en derde lid][ref1], niet van toepassing op de opleiding tot
      leraar basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25a.2
    text: |-
      De bijzondere nadere vooropleidingseisen, bedoeld in het eerste lid, hebben betrekking op onderdelen of
      kennisgebieden als bedoeld in [artikel 9, eerste en tweede lid, van de Wet op het primair onderwijs][ref1]. Op
      basis van die eisen toont de aspirant-student voor de inschrijving bij de opleiding tot leraar basisonderwijs aan,
      te beschikken over voldoende kennis om te kunnen deelnemen aan die opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: 7.25a.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald met welke vakken
      die deel hebben uitgemaakt van het examen ter verkrijging van een diploma als bedoeld in [artikel 7.24][ref1], de
      kennis, bedoeld in het tweede lid, kan worden aangetoond. Bij of krachtens die algemene maatregel van bestuur wordt
      het niveau van de kennis vastgesteld dat anders is dan het niveau van het examen, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25b.1
    text: |-
      De aspirant-student, bedoeld in [artikel 7.25a, tweede lid][ref1], kan aantonen over de kennis, bedoeld in dat
      artikel, te beschikken door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25b.1.a
    text: |-
      het overleggen van een diploma als bedoeld in [artikel 7.24][ref1], en wat betreft de vakken die deel hebben
      uitgemaakt van het examen ter verkrijging van dat diploma, de bij het diploma behorende cijferlijst of
      resultatenlijst waaruit blijkt dat hij over de desbetreffende kennis beschikt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25b.1.b
    text: |-
      in voorkomende gevallen, al dan niet in aanvulling op het overleggen van een diploma
      als bedoeld in onderdeel a, het overleggen van een of meer certificaten als bedoeld in
      [artikel 7.4.11, vijfde lid, van de Wet educatie en beroepsonderwijs][ref1] waaruit blijkt dat hij over de
      desbetreffende kennis beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.25b.2
    text: |-
      Indien de aspirant-student niet voldoet aan het eerste lid, kan hij aantonen over de kennis, bedoeld in
      [artikel 7.25a][ref1], te beschikken door het met goed gevolg afleggen van een toets.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25b.3
    text: |-
      Het instellingsbestuur stelt de aspirant-student in de gelegenheid een toets af te leggen en stelt met betrekking
      tot de toets regels van procedurele aard vast.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.25b
  - number: 7.26.1
    text: |-
      Indien de uitoefening van het beroep of de beroepen waarop een opleiding voorbereidt, dan wel de organisatie en
      de inrichting van het onderwijs, specifieke eisen stelt ten aanzien van kennis of vaardigheden die niet of niet in
      voldoende mate onderdeel zijn van het voortgezet onderwijs, bedoeld in de [wet op het voortgezet onderwijs][ref1]
      en in de [Wet voortgezet onderwijs BES][ref2], of van het beroepsonderwijs, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref3], onderscheidenlijk specifieke eisen stelt ten aanzien van de eigenschappen
      van de student, kunnen bij ministeriële regeling opleidingen worden aangewezen die op daarbij aangegeven gronden
      eisen kunnen stellen in aanvulling op de eisen, bedoeld in [artikel 7.24][ref4]. Het instellingsbestuur stelt een
      regeling vast voor de selectiecriteria en -procedure. De selectiecriteria kunnen uitsluitend eisen bevatten die
      direct verband houden met de gronden, bedoeld in de eerste volzin. Dit lid is niet van toepassing op opleidingen op
      het gebied van de kunst en lerarenopleidingen op het gebied van de kunst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0030284
      [ref3]: https://wetten.overheid.nl/BWBR0007625
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0030284
      - id: ref3
        bwb_id: BWBR0007625
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.26.2
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen tevens voorschriften van procedurele aard worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26
  - number: 7.26a.1
    text: |-
      Bij ministeriële regeling kunnen opleidingen op het gebied van de kunst en lerarenopleidingen op het gebied van
      de kunst worden aangewezen die in verband met de organisatie en inrichting van het onderwijs dan wel de kennis of
      vaardigheden van de aanstaande studenten en extraneï specifieke eisen kunnen stellen in aanvulling op de eisen,
      bedoeld in [artikel 7.24][ref1]. Voor de inschrijving voor deze opleidingen geldt als eis het bezit van een bewijs
      van toelating als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.26a.2
    text: |-
      Met betrekking tot de opleidingen waarop het eerste lid van toepassing is, stelt het instellingsbestuur ter
      uitwerking van de in het eerste lid bedoelde specifieke eisen voor een opleiding criteria vast betreffende selectie
      en toelating van studenten en extraneï. De selectiecriteria kunnen uitsluitend eisen bevatten die direct verband
      houden met de gronden, bedoeld in de eerste volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26a
  - number: 7.26a.3
    text: |-
      Voor elke opleiding stelt het instellingsbestuur een commissie in, die is belast met het onderzoek of aanstaande
      studenten of extraneï voldoen aan de in het eerste lid bedoelde eisen en de in het tweede lid bedoelde criteria. De
      commissie brengt het instellingsbestuur een gemotiveerd advies uit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26a
  - number: 7.26a.4
    text: |-
      Het instellingsbestuur neemt ten aanzien van elke aanstaande student of extraneus een beslissing of deze voldoet
      aan de in het eerste lid bedoelde eisen en de in het tweede lid bedoelde criteria. Het instellingsbestuur bericht
      de student of extraneus over de uitslag van het desbetreffende onderzoek en reikt hem, indien het resultaat van het
      onderzoek daartoe aanleiding geeft, ten bewijze daarvan een bewijs van toelating uit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26a
  - number: 7.26a.5
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen tevens voorschriften van procedurele aard worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.26a
  - number: '7.27'
    text: |-
      Het instellingsbestuur kan met het oog op de inschrijving voor een deeltijdse opleiding aan een universiteit of aan
      een hogeschool eisen omtrent het verrichten van werkzaamheden tijdens het volgen van de opleiding stellen indien de
      desbetreffende werkzaamheden in de onderwijs- en examenregeling als onderwijseenheden zijn aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.27
  - number: 7.28.1
    text: |-
      Degene aan wie een graad als bedoeld in [artikel 7.10a][ref1] is verleend, is vrijgesteld van de in
      [artikel 7.24][ref2], eerste onderscheidenlijk tweede lid, bedoelde vooropleidingseisen, onverminderd het derde
      en vierde lid. Van de in de eerste volzin bedoelde vooropleidingseisen is eveneens vrijgesteld degene die toegang
      heeft tot het wetenschappelijk onderwijs of het hoger beroepsonderwijs in het land van een verdragspartij die het
      Verdrag inzake de erkenning van kwalificaties betreffende hoger onderwijs in de Europese regio (Trb. 2002, 137)
      heeft geratificeerd, onverminderd de bevoegdheid van het instellingsbestuur om op grond van artikel IV.1 van het
      genoemde verdrag een aanzienlijk verschil aan te tonen tussen de algemene eisen betreffende de toegang op het
      grondgebied van het bedoelde land waar de kwalificatie werd behaald en de algemene eisen bij of krachtens deze
      wet. Gelijke bevoegdheid bestaat op grond van het tweede lid, derde en vierde volzin, het derde en vierde lid en de
      [artikelen 7.26][ref3], [7.26a][ref4] en [7.27][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.1a
    text: |-
      Het instellingsbestuur kan met het oog op de inschrijving voor een bacheloropleiding aan een universiteit van de
      bezitter van een getuigschrift van een met goed gevolg afgelegd propedeutisch examen aan een hogeschool die niet
      in het bezit is van een diploma als bedoeld in [artikel 7.24, eerste lid][ref1], dan wel een op grond van het
      tweede lid bij ministeriële regeling als ten minste gelijkwaardig aangemerkt onderscheidenlijk naar het oordeel
      van het instellingsbestuur daaraan ten minste gelijkwaardig diploma eisen dat hij aantoont over kennis, inzicht en
      vaardigheden te beschikken om de bedoelde bacheloropleiding met goed gevolg af te ronden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.2
    text: |-
      Het instellingsbestuur verleent vrijstelling van de in [artikel 7.24, eerste onderscheidenlijk tweede lid][ref1],
      bedoelde vooropleidingseis aan de bezitter van een al dan niet in Nederland afgegeven diploma dat bij ministeriële
      regeling is aangemerkt als tenminste gelijkwaardig aan het in het desbetreffende lid bedoelde diploma, onverminderd
      het derde en vierde lid. Het instellingsbestuur kan vrijstelling verlenen van de in artikel 7.24, eerste
      onderscheidenlijk tweede lid, bedoelde vooropleidingseisen aan de bezitter van een al dan niet in Nederland
      afgegeven diploma dat niet in de in de eerste volzin genoemde ministeriële regeling is opgenomen, indien dat
      diploma naar het oordeel van het instellingsbestuur tenminste gelijkwaardig is aan het in artikel 7.24, eerste
      onderscheidenlijk tweede lid bedoelde diploma, onverminderd het derde en vierde lid. Indien het een buiten
      Nederland afgegeven diploma betreft, kan het instellingsbestuur bepalen dat geen examens of onderdelen daarvan
      worden afgelegd dan nadat ten genoegen van de desbetreffende examencommissie het bewijs is geleverd van voldoende
      beheersing van de Nederlandse taal voor het met vrucht kunnen volgen van het onderwijs. Het instellingsbestuur
      kan tevens bepalen dat betrokkene niet wordt ingeschreven zolang het in de voorgaande volzin bedoelde bewijs niet
      is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.3
    text: |-
      Indien bij ministeriële regeling eisen als bedoeld in [artikel 7.25, eerste of tweede lid][ref1], zijn vastgesteld
      kan de bezitter van een diploma als bedoeld in het eerste tot en met tweede lid geen examens afleggen voordat
      hij op een door het instellingsbestuur te bepalen wijze op grond van een aanvullend onderzoek heeft aangetoond te
      beschikken over de kennis en vaardigheden waarop de eisen, bedoeld in artikel 7.25, betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.4
    text: |-
      Het instellingsbestuur kan bepalen dat de bezitter van een diploma als bedoeld in het eerste dan wel tweede lid
      niet kan worden ingeschreven indien dat bestuur van oordeel is dat de eisen, bedoeld in [artikel 7.25][ref1], van
      dien aard zijn dat redelijkerwijs verwacht kan worden dat niet tijdens het eerste jaar van inschrijving voor de
      opleiding op grond van een aanvullend onderzoek als bedoeld in het derde lid aangetoond kan worden dat betrokkene
      beschikt over de kennis en vaardigheden waarop die eisen betrekking hebben. Het instellingsbestuur bepaalt op welke
      wijze betrokkene op grond van een aanvullend onderzoek met het oog op de inschrijving vrijgesteld kan worden van
      die eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.5
    text: |-
      De bij het onderzoek, bedoeld in onderscheidenlijk de leden twee tot en met vier, te stellen eisen worden opgenomen
      in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.28
  - number: 7.29.1
    text: |-
      Het instellingsbestuur kan personen van eenentwintig jaar en ouder die niet voldoen aan de in
      [artikel 7.24, eerste onderscheidenlijk tweede lid][ref1], bedoelde vooropleidingseis noch daarvan krachtens
      [artikel 7.28][ref2] zijn vrijgesteld, van die vooropleidingseis vrijstellen, indien zij bij een onderzoek door een
      door het instellingsbestuur in te stellen commissie hebben blijk gegeven van geschiktheid voor het desbetreffende
      onderwijs en van voldoende beheersing van de Nederlandse taal voor het met vrucht kunnen volgen van dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.29.2
    text: De bij het onderzoek te stellen eisen worden opgenomen in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.29
  - number: 7.29.3
    text: |-
      Het instellingsbestuur kan ten aanzien van een bezitter van een buiten Nederland afgegeven diploma dat in het
      eigen land toegang geeft tot een opleiding aan een instelling voor hoger onderwijs, afwijken van de in het eerste
      lid genoemde leeftijdsgrens. Van die leeftijdsgrens kan het instellingsbestuur ook afwijken, indien in bijzondere
      gevallen geen diploma kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.29
  - number: 7.29.4
    text: |-
      Het instellingsbestuur kan ten aanzien van opleidingen op het gebied van de kunst in bijzondere gevallen afwijken
      van de in het eerste lid genoemde leeftijd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.29
  - number: 7.30.1
    text: |-
      Voor de inschrijving voor een opleiding na het propedeutisch examen geldt als eis het bezit van een getuigschrift
      van het met goed gevolg afgelegde propedeutisch examen van die opleiding of van het met goed gevolg afgelegde
      propedeutisch examen dat die opleiding en een of meer andere opleidingen gemeen hebben.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30
  - number: 7.30.2
    text: |-
      Het instellingsbestuur kan vrijstelling verlenen van de in het eerste lid bedoelde eis aan de bezitter van een
      al dan niet in Nederland afgegeven diploma, indien dat diploma naar het oordeel van het instellingsbestuur ten
      minste gelijkwaardig is aan het in het eerste lid bedoelde getuigschrift. Indien het een buiten Nederland afgegeven
      diploma betreft, kan het instellingsbestuur daarbij bepalen dat geen examens of onderdelen daarvan worden afgelegd
      dan nadat ten genoegen van de desbetreffende examencommissie het bewijs is geleverd van voldoende beheersing van de
      Nederlandse taal voor het met vrucht kunnen volgen van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30
  - number: 7.30.3
    text: |-
      Met inachtneming van het terzake bepaalde in de onderwijs- en examenregeling kan de examencommissie, in afwijking
      van het eerste lid, aan degene die is ingeschreven, op zijn verzoek, reeds de toegang tot het afleggen van een
      of meer onderdelen van het afsluitend examen verlenen voordat hij het propedeutisch examen van de desbetreffende
      opleiding met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30
  - number: 7.30b.1
    text: |-
      Voor de inschrijving voor een masteropleiding in het wetenschappelijk onderwijs of voor een masteropleiding in het
      hoger beroepsonderwijs geldt als toelatingseis:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.1.a
    text: |-
      het bezit van een graad Bachelor in het wetenschappelijk onderwijs onderscheidenlijk een graad Bachelor in het
      hoger beroepsonderwijs; of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.1.b
    text: |-
      het bezit van kennis, inzicht en vaardigheden op het niveau van een graad Bachelor in het wetenschappelijk
      onderwijs onderscheidenlijk een graad Bachelor in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.2
    text: |-
      Het instellingsbestuur kan naast de eisen, bedoeld in het eerste lid, kwalitatieve toelatingseisen vaststellen.
      Deze eisen worden opgenomen in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.3
    text: |-
      Het instellingsbestuur laat degenen die aan de gestelde eisen voldoen toe tot een masteropleiding. Indien het
      instellingsbestuur een maximum aantal voor de opleiding in te schrijven personen heeft vastgesteld, geldt als extra
      toelatingseis dat dit aantal door de toelating niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.4
    text: |-
      Het instellingsbestuur maakt tijdig de procedure bekend op grond waarvan de toelating zal plaatsvinden ingeval het
      aantal aspirant-studenten voor een masteropleiding het maximumaantal, bedoeld in het derde lid, zou overschrijden.
      Het instellingsbestuur stelt daartoe een reglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.5
    text: |-
      Indien er sprake is van kwalitatieve toelatingseisen van studenten bedraagt het aantal soorten daarvan ten minste
      twee.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30b.6
    text: |-
      Indien afgestudeerden van een bacheloropleiding in het wetenschappelijk onderwijs zich niet kunnen of dreigen
      te kunnen inschrijven bij een masteropleiding in het wetenschappelijk onderwijs, kan Onze minister een of meer
      instellingsbesturen van universiteiten verplichten een of meer masteropleidingen aan te wijzen waaraan bedoelde
      afgestudeerden zich kunnen inschrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30b
  - number: 7.30c.1
    text: |-
      Voor de inschrijving voor een masteropleiding in het wetenschappelijk onderwijs tot leraar voor de periode van
      voorbereidend hoger onderwijs gelden als toelatingseisen dat:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30c
  - number: 7.30c.1.a
    text: |-
      aan de betrokkene de graad Master, bedoeld in [artikel 7.10a][ref1], is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.30c.1.b
    text: de betrokkene voldoet aan de door het instellingsbestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30c
  - number: 7.30c.2
    text: |-
      Het instellingsbestuur kan vrijstelling verlenen van de toelatingseis, bedoeld in het eerste lid, onderdeel a,
      indien uit een door hem ingesteld onderzoek blijkt dat de betrokkene beschikt over vergelijkbare kennis, inzicht en
      vaardigheden waarop die toelatingseis betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30c
  - number: 7.30d
    text: |-
      Op de personen, bedoeld in [artikel 7.28, eerste lid, tweede volzin][ref1], zijn, onverminderd de bevoegdheid
      van het instellingsbestuur om op grond van artikel IV.1 van het Verdrag inzake de erkenning van kwalificaties
      betreffende hoger onderwijs in de Europese regio (Trb. 2002, 137) een aanzienlijk verschil aan te tonen tussen de
      algemene eisen betreffende de toegang op het grondgebied van het bedoelde land waar de kwalificatie werd behaald en
      de algemene eisen bij of krachtens deze wet, niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.30d.a
    text: |-
      [artikel 7.30b][ref1], met uitzondering van de eisen, bedoeld in het tweede lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.30d.b
    text: |-
      [artikel 7.30c][ref1], met uitzondering van de in het tweede lid bedoelde kennis, inzicht en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.30e
    text: |-
      Indien de betrokkene niet voldoet aan de toelatingseisen, bedoeld in de [artikelen 7.30b][ref1] of [7.30c][ref2],
      en van hem redelijkerwijs kan worden verwacht dat hij daaraan binnen een redelijke termijn alsnog kan voldoen,
      wordt hem de mogelijkheid geboden, de tekortkoming weg te nemen en alsnog aan de toelatingseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.30e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.31a.1
    text: |-
      Uiterlijk op 1 mei voorafgaand aan het desbetreffende studiejaar meldt degene die zich als student wil inschrijven
      voor een bepaalde propedeutische fase van een bacheloropleiding aan een bepaalde instelling of, indien die fase
      niet is ingesteld, de eerste periode in een bacheloropleiding met een studielast van 60 studiepunten, zich aan
      bij Onze minister, met inachtneming van [artikel 7.31d][ref1] en overeenkomstig bij ministeriële regeling vast te
      stellen regels van procedurele aard.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31a.2
    text: |-
      De aanmelding geschiedt onder vermelding van de instelling waarbij en de bacheloropleiding waarvoor de betrokkene
      zich wil inschrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31a
  - number: 7.31a.3
    text: |-
      Indien de betrokkene zich voorafgaand aan het desbetreffende studiejaar voor meer dan een bacheloropleiding wil
      aanmelden, geldt de verplichting, bedoeld in het eerste lid, voor één bacheloropleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31a
  - number: 7.31a.4
    text: |-
      Onze minister levert de aanmeldingsgegevens, bedoeld in dit artikel en de [artikelen 7.31c][ref1] en [7.31d][ref2],
      aan de instelling of instellingen waarvoor de betrokkene zich heeft aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31a.5
    text: |-
      Dit artikel is niet van toepassing op een student die zich na 1 mei aanmeldt bij een andere bacheloropleiding dan
      die waarbij hij oorspronkelijk was ingeschreven maar kan aantonen dat de nieuwe aanmelding het gevolg is van een
      beëindiging van de inschrijving op grond van [artikel 7.8b, vijfde lid][ref1], op een zodanig tijdstip dat hij zich
      niet kon aanmelden voor 1 mei, voorafgaand aan het studiejaar waarvoor hij zich wenst in te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31b.1
    text: |-
      Indien de betrokkene zich uiterlijk op 1 mei voor een of meer bacheloropleidingen heeft aangemeld op de wijze,
      bedoeld in [artikel 7.31a, eerste lid][ref1], heeft hij het recht deel te nemen aan door de instelling met
      betrekking tot de desbetreffende bacheloropleidingen te organiseren studiekeuzeactiviteiten. Het instellingsbestuur
      kan besluiten dat de betrokkene verplicht is deel te nemen aan de studiekeuzeactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31b.2
    text: |-
      Het instellingsbestuur brengt ten aanzien van elke student die zich heeft aangemeld en die heeft deelgenomen
      aan de studiekeuzeactiviteiten, een studiekeuzeadvies uit. Bij ministeriële regeling kan een maximum aantal
      studiekeuzeadviezen worden vastgesteld waarop de betrokkene recht heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
  - number: 7.31b.3
    text: |-
      Indien toepassing is gegeven aan de tweede volzin van het eerste lid en de betrokkene zonder geldige reden niet
      deelneemt aan de studiekeuzeactiviteiten, bedoeld in dat lid, kan het instellingsbestuur besluiten de inschrijving
      van de betrokkene te weigeren.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
  - number: 7.31b.4
    text: |-
      Het instellingsbestuur stelt ter uitvoering van dit artikel nadere regels vast die in elk geval betrekking hebben
      op de aard en de inhoud van de studiekeuzeactiviteiten voor de instelling of per opleiding, de termijn waarbinnen
      de studiekeuzeactiviteiten plaatsvinden, de termijn waarbinnen en de wijze waarop het studiekeuzeadvies wordt
      uitgebracht, de gevolgen van het zonder geldige reden van verhindering niet deelnemen aan studiekeuzeactiviteiten
      en de geldige redenen van verhindering voor het deelnemen aan die activiteiten. Bij het vaststellen van de nadere
      regels treft het instellingsbestuur voor aspirant-studenten afkomstig uit de openbare lichamen Bonaire, Sint
      Eustatius en Saba onderscheidenlijk Aruba, Curaçao en Sint Maarten zodanige voorzieningen dat zij kunnen deelnemen
      aan de studiekeuzeactiviteiten zonder dat hun fysieke aanwezigheid op de instelling vereist is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
  - number: 7.31b.5
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
  - number: 7.31b.5.a
    text: de inschrijving voor een bacheloropleiding waarvoor een selectieprocedure is ingesteld, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
  - number: 7.31b.5.b
    text: |-
      degene die op grond van [artikel 7.28][ref1] vanwege het bezit van een buiten Nederland behaald diploma is
      vrijgesteld van de diploma-eisen, bedoeld in de [artikelen 7.24, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31c.1
    text: |-
      Indien de betrokkene heeft voldaan aan de verplichting, bedoeld in [artikel 7.31a, eerste lid][ref1], behorend bij
      die andere bacheloropleiding en zich na 1 mei voor een andere bacheloropleiding dan de bacheloropleiding, bedoeld
      in genoemde bepaling, aanmeldt, kan het instellingsbestuur besluiten dat de betrokkene verplicht is deel te nemen
      aan de studiekeuzeactiviteiten, bedoeld in [artikel 7.31b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31c.2
    text: |-
      Dit artikel is van overeenkomstige toepassing op de student, bedoeld in [artikel 7.31a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31d.1
    text: |-
      Indien de betrokkene niet heeft voldaan aan de verplichting, bedoeld in [artikel 7.31a, eerste lid][ref1], en zich
      na 1 mei voor een bacheloropleiding aanmeldt, kan het instellingsbestuur besluiten dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31d.1.a
    text: hij de betrokkene de inschrijving voor de desbetreffende bacheloropleiding weigert, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31d
  - number: 7.31d.1.b
    text: |-
      de betrokkene verplicht is deel te nemen aan de studiekeuzeactiviteiten, bedoeld in
      [artikel 7.31b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31d.2
    text: |-
      Met betrekking tot het eerste lid, aanhef en onderdeel b, is [artikel 7.31b, tweede lid][ref1], van toepassing.
      Indien het instellingsbestuur een negatief studiekeuzeadvies heeft uitgebracht, kan hij besluiten dat hij de
      betrokkene de inschrijving voor de desbetreffende bacheloropleiding weigert. Met betrekking tot dit artikel is
      voorts artikel 7.31b, derde, vierde en vijfde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31d.3
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing op de student, bedoeld in
      [artikel 7.31a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.31e.1
    text: |-
      Bij de aanmelding, bedoeld in deze paragraaf, legt de betrokkene mede zijn persoonsgebonden nummer over. Indien
      de student aannemelijk maakt dat hij geen persoonsgebonden nummer kan overleggen, vindt de aanmelding plaats met
      inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31e
  - number: 7.31e.2
    text: |-
      Het persoonsgebonden nummer wordt overgelegd door middel van een van overheidswege verstrekt document, waarop
      tevens de gegevens over de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van de betrokkene zijn
      vermeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31e
  - number: 7.31e.3
    text: |-
      Indien de betrokkene aannemelijk maakt dat hij geen persoonsgebonden nummer kan overleggen, verstrekt Onze minister
      binnen acht weken na ontvangst van de aanmelding aan hem zijn onderwijsnummer. Het onderwijsnummer is een door Onze
      minister uitgegeven en aan de betrokkene toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31e
  - number: 7.31e.4
    text: |-
      Onze minister verstrekt binnen acht weken na ontvangst van de aanmelding aan het instellingsbestuur van de
      instelling waaraan de betrokkene zich wil inschrijven, het persoonsgebonden nummer van de betrokkene en de
      gegevens, bedoeld in [artikel 7.52, tweede lid][ref1], voorzover die door de betrokkene zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.31f
    text: |-
      De [artikelen 7.31a tot en met 7.31d][ref1] zijn niet van toepassing op de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.31f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.32.1
    text: |-
      Ieder die wenst gebruik te kunnen maken van onderwijsvoorzieningen, examenvoorzieningen of voorzieningen van andere
      aard ten behoeve van initieel onderwijs aan een instelling, dient zich door het instellingsbestuur als student of
      extraneus te laten inschrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.2
    text: |-
      In afwijking van het eerste lid is inschrijving voor een duale opleiding dan wel aan de Open Universiteit
      uitsluitend mogelijk als student.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.3
    text: |-
      De inschrijving geschiedt voor een opleiding, met dien verstande dat de inschrijving aan de Open Universiteit
      geschiedt voor een of meer onderwijseenheden. Een student die een Ad-programma wil volgen, schrijft zich in voor de
      opleiding en het Ad-programma.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.4
    text: |-
      De inschrijving voor een opleiding geschiedt voor het gehele studiejaar. Indien de inschrijving plaatsvindt in de
      loop van het studiejaar, geldt zij voor het resterende gedeelte van het studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.5
    text: |-
      De inschrijving als student of extraneus staat slechts open voor degene waarvan de ouders, voogden of verzorgers
      aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.5.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.5.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding begint waarvoor voor de eerste maal
      inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.5.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding begint waarvoor voor
      de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.32.5.d
    text: |-
      vreemdeling is en buiten Nederland verblijf houdt op de eerste dag waarop de opleiding begint waarvoor voor de
      eerste maal de inschrijving wordt gewenst, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.5.e
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b, c of d, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding van een instelling, welke opleiding nog steeds wordt
      gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.32.6
    text: |-
      Indien na de inschrijving blijkt dat deze op welke grond dan ook niet in overeenstemming met het vijfde lid heeft
      plaatsgevonden wordt de inschrijving van de student of extraneus onmiddellijk beëindigd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.32
  - number: 7.33.1
    text: |-
      Onverminderd [artikel 7.39][ref1], geschiedt de inschrijving overeenkomstig door het instellingsbestuur vast te
      stellen regels van procedurele aard.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.33.2
    text: |-
      Aan degene die is ingeschreven, wordt door het instellingsbestuur een bewijs van inschrijving verstrekt, waarin
      zijn rechten zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.33
  - number: 7.33.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.33
  - number: 7.34.1
    text: 'De inschrijving als student geeft het recht:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.1.a
    text: |-
      aan het initieel onderwijs van de instelling deel te nemen, behoudens de bevoegdheid van het instellingsbestuur
      van een universiteit, hogeschool of levensbeschouwelijke universiteit in geval van toepassing van de
      [artikelen 6.7a][ref1], [7.9, eerste lid][ref2], [7.30a, derde lid][ref3], [7.30b, eerste lid][ref4],
      [7.42a][ref5], [7.53, derde lid][ref6], [7.56][ref7] of [7.57h][ref8] anders te beslissen,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref6
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7.34.1.b
    text: |-
      de tentamens af te leggen van de onderwijseenheden behorend tot de opleiding, alsmede de examens af te leggen van
      die opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.1.c
    text: |-
      van toegang tot de bij de instelling behorende inrichtingen en verzamelingen, tenzij naar het oordeel van het
      instellingsbestuur de aard of het belang van het onderwijs of het onderzoek zich daartegen verzet,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.1.d
    text: |-
      gebruik te maken van andere ten behoeve van de studenten getroffen voorzieningen, daaronder begrepen, behoudens wat
      de Open Universiteit betreft, de diensten van een studentendecaan, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.1.e
    text: |-
      op studiebegeleiding; het instellingsbestuur besteedt daarbij bijzondere zorg aan de begeleiding van studenten die
      behoren tot een etnische of culturele minderheid waarvan de deelname aan het hoger onderwijs in betekenende mate
      achterblijft bij de deelname van Nederlanders die niet behoren tot een dergelijke minderheid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.2
    text: |-
      Indien het instellingsbestuur een opleiding beëindigt, bepaalt dat bestuur het tijdstip waarop die beslissing van
      kracht wordt, zodanig dat de voor de opleiding ingeschreven studenten de opleiding aan dezelfde of aan een andere
      instelling binnen een redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.3
    text: |-
      Het instellingsbestuur van de Open Universiteit stelt ten aanzien van studenten, woonachtig buiten Nederland,
      regels vast met betrekking tot de in het eerste lid onder a tot en met d, bedoelde rechten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
  - number: 7.34.4
    text: |-
      In afwijking van het eerste lid, onder b, heeft de student, bedoeld in
      [artikel 7.30a, eerste lid, derde volzin][ref1], niet het recht het examen van de masteropleiding af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.34.5
    text: |-
      Een student die een Ad-programma volgt dat voor een deel wordt uitgevoerd door een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] heeft gedurende de tijd dat hij aan het
      programma deelneemt recht op toegang tot alle relevante onderwijsvoorzieningen van die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '7.36'
    text: |-
      De inschrijving als extraneus geeft uitsluitend de rechten, vermeld in
      [artikel 7.34, eerste lid onder b en c][ref1]. [Artikel 7.34, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.36
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.37.1
    text: |-
      De inschrijving staat open voor degene die voldoet aan de in [titel 2][ref1] van dit hoofdstuk gestelde eisen,
      onverminderd [artikel 7.8b, vijfde lid][ref2], en de [artikelen 7.31a tot en met 7.31d][ref3], met dien verstande
      dat de inschrijving als extraneus uitsluitend openstaat, indien naar het oordeel van het instellingsbestuur de aard
      of het belang van het onderwijs zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.37.2
    text: |-
      Tot de inschrijving wordt niet overgegaan dan nadat het bewijs is overgelegd dat het verschuldigde collegegeld
      is of wordt voldaan, het verschuldigde examengeld is voldaan dan wel, in geval van inschrijving aan de Open
      Universiteit, het verschuldigde collegegeld OU is of wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
  - number: 7.37.3
    text: |-
      Indien een meerderjarige student of extraneus het collegegeld, het examengeld of het cursusgeld niet zelf voldoet,
      wordt niet overgegaan tot inschrijving dan nadat door de student of extraneus schriftelijk is verklaard dat hij
      ermee instemt dat een in die verklaring vermelde derde namens hem het collegegeld, het examengeld of het cursusgeld
      voldoet.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
  - number: 7.37.4
    text: |-
      Het bestuur van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven, geacht worden
      de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden geweigerd dan wel
      ingetrokken indien betrokkene de grondslag en de doelstellingen van de instelling niet respecteert. De weigering
      dan wel de intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
  - number: 7.37.5
    text: |-
      De inschrijving aan een bijzondere instelling kan worden geweigerd dan wel ingetrokken indien gegronde vrees
      bestaat dat de betrokkene van die inschrijving en daaraan verbonden rechten misbruik zal maken door in ernstige
      mate afbreuk te doen aan de eigen aard van die instelling, dan wel is gebleken dat de betrokkene van die
      inschrijving en daaraan verbonden rechten zulk een misbruik heeft gemaakt. De weigering dan wel intrekking van de
      inschrijving geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
  - number: 7.37.6
    text: |-
      De inschrijving kan niet worden ingetrokken op grond van het vijfde lid, indien voor betrokkene geen gelegenheid
      bestaat de opleiding aan een andere instelling te volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37
  - number: 7.37a
    text: |-
      In afwijking van [artikel 7.37, eerste lid][ref1], staat de inschrijving voor een opleiding die is aangewezen
      op grond van [artikel 6][ref2] of [artikel 8 van de Experimentenwet][ref3] vooropleidingseisen, selectie en
      collegegeldheffing, eveneens open voor degene die voldoet aan de in die artikelen bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018259#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0018259
        artikel: '8'
  - number: 7.37b
    text: |-
      In afwijking van [artikel 7.37, eerste lid][ref1], staat de inschrijving voor een opleiding die is aangewezen
      op grond van [artikel 7 van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref2], in
      voorkomende gevallen in verband met het deelnemen aan een experimenteel programma, slechts open voor degene die
      tevens voldoet aan de in [dat artikel][ref3] bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018259#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.37b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0018259
        artikel: '7'
  - number: 7.39.1
    text: |-
      Bij de inschrijving legt de student of extraneus tevens zijn persoonsgebonden nummer over. Indien de student of
      extraneus aannemelijk maakt dat hij geen persoonsgebonden nummer kan overleggen, vindt de inschrijving plaats met
      inachtneming van het tweede lid. [Artikel 7.31d, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.39
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.39.2
    text: |-
      Indien de student of extraneus aannemelijk maakt dat hij geen persoonsgebonden nummer kan overleggen, meldt het
      instellingsbestuur binnen twee weken aan Onze minister de beschikbare gegevens van de student of extraneus, bedoeld
      in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.39
  - number: 7.39.3
    text: |-
      Onze minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het tweede lid, aan het
      instellingsbestuur het burgerservicenummer van de student of extraneus, dan wel, indien is gebleken dat hem niet
      van overheidswege een burgerservicenummer is verstrekt, het onderwijsnummer van de student of extraneus.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.39
  - number: 7.39.4
    text: |-
      Het instellingsbestuur neemt het persoonsgebonden nummer van de student of extraneus op in de administratie van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.39
  - number: 7.39.5
    text: |-
      Indien aan een student of extraneus een onderwijsnummer is toegekend en het instellingsbestuur daarna de
      beschikking krijgt over zijn burgerservicenummer, neemt het instellingsbestuur dit burgerservicenummer terstond
      als persoonsgebonden nummer op in de administratie van de instelling in de plaats van het onderwijsnummer.
      Het instellingsbestuur meldt deze wijziging binnen twee weken aan Onze minister onder opgave van het
      burgerservicenummer en het onderwijsnummer van de student of extraneus.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.39
  - number: 7.42.1
    text: |-
      Het instellingsbestuur beëindigt op verzoek van degene die is ingeschreven voor een opleiding diens inschrijving
      met ingang van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42
  - number: 7.42.2
    text: |-
      Indien degene die is ingeschreven voor een opleiding zijn wettelijk collegegeld, instellingscollegegeld,
      collegegeld OU of examengeld na aanmaning niet heeft voldaan, kan het instellingsbestuur de inschrijving, met
      ingang van de tweede maand volgend op de aanmaning beëindigen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42
  - number: 7.42.3
    text: |-
      Indien een inschrijving wordt beëindigd in een geval als bedoeld in [artikel 7.8b, vijfde lid][ref1],
      [artikel 7.12b][ref2], [artikel 7.37, vierde of vijfde lid][ref3], [artikel 7.42a][ref4] of
      [artikel 7.57h, eerste of tweede lid][ref5], beëindigt het instellingsbestuur de inschrijving met ingang van de
      volgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7.42.4
    text: Het instellingsbestuur stelt regels van procedurele aard vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42
  - number: 7.42.5
    text: Het instellingsbestuur informeert de betrokkene en Onze minister over de beëindiging van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42
  - number: 7.42a.1
    text: |-
      Het instellingsbestuur kan in bijzondere gevallen na advies van de examencommissie, de decaan of een met de decaan
      vergelijkbaar orgaan binnen de instelling en na zorgvuldige afweging van de betrokken belangen de inschrijving van
      een student voor een opleiding beëindigen dan wel weigeren, als die student door zijn gedragingen of uitlatingen
      blijk heeft gegeven van ongeschiktheid voor de uitoefening van een of meer beroepen waartoe de door hem gevolgde
      opleiding hem opleidt, dan wel voor de praktische voorbereiding op de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42a
  - number: 7.42a.2
    text: |-
      Het instellingsbestuur dan wel het instellingsbestuur van een andere instelling die een zelfde of verwante
      opleiding verzorgt, kan besluiten de student niet opnieuw of niet voor die opleiding in te schrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42a
  - number: 7.42a.3
    text: |-
      Indien de student, bedoeld in het eerste lid, is ingeschreven voor een andere opleiding en daarbinnen het
      onderwijs volgt van een afstudeerrichting die overeenkomt met of gelet op de praktische voorbereiding op de
      beroepsuitoefening verwant is aan de opleiding waarvoor de inschrijving met toepassing van het eerste lid
      is beëindigd, kan het instellingsbestuur na advies van de examencommissie, de decaan of een met de decaan
      vergelijkbaar orgaan binnen de instelling en na zorgvuldige afweging van de betrokken belangen besluiten dat de
      student die afstudeerrichting of andere onderdelen van die opleiding niet mag volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42a
  - number: 7.42a.4
    text: |-
      [Artikel 7.42, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.42a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.43.1
    text: |-
      Een student is voor elk studiejaar dat hij door het instellingsbestuur voor een opleiding is ingeschreven, aan
      de desbetreffende instelling wettelijk collegegeld als bedoeld in de [artikelen 7.45][ref1] en [7.45a][ref2]
      of instellingscollegegeld als bedoeld in [artikel 7.46][ref3] verschuldigd. Een student die door het
      instellingsbestuur van de Open Universiteit voor een onderwijseenheid is ingeschreven, is het collegegeld OU,
      bedoeld in [artikel 7.45b][ref4], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.43
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.43.2
    text: |-
      Met uitzondering van de gevallen, bedoeld in [artikel 7.48, eerste en tweede lid][ref1], is
      [artikel 7.42, tweede lid][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.43
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.44.1
    text: |-
      Een extraneus is voor elk studiejaar dat hij door het instellingsbestuur voor een opleiding is ingeschreven, aan de
      desbetreffende instelling examengeld verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.44
  - number: 7.44.2
    text: Het instellingsbestuur stelt de hoogte van het examengeld vast.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.44
  - number: 7.44.3
    text: |-
      [Artikel 7.42, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.44
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.45.1
    text: De hoogte van het volledige wettelijke collegegeld wordt bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45
  - number: 7.45.2
    text: |-
      De hoogte van het gedeeltelijke wettelijke collegegeld wordt door het instellingsbestuur vastgesteld en is gelegen
      tussen een minimum- en een maximumbedrag. Deze bedragen worden bij of krachtens algemene maatregel van bestuur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45
  - number: 7.45.3
    text: Het gedeeltelijke wettelijke collegegeld bedraagt niet meer dan het volledige wettelijke collegegeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45
  - number: 7.45.4
    text: |-
      Het instellingsbestuur informeert Onze minister over de hoogte van het bedrag dat het instellingsbestuur op grond
      van het tweede lid heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45
  - number: 7.45.5
    text: |-
      De bij of krachtens algemene maatregel van bestuur vastgestelde bedragen, bedoeld in het eerste en tweede lid,
      worden jaarlijks volgens de consumentenprijsindex geïndexeerd, op de wijze bij of krachtens algemene maatregel van
      bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45
  - number: 7.45a.1
    text: 'Het wettelijke collegegeld is verschuldigd door een student die:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.1.a
    text: |-
      blijkens het basisregister onderwijs sedert 1 september 1991 voor een inschrijving aan een bacheloropleiding niet
      eerder een bachelorgraad heeft behaald of voor een inschrijving aan een masteropleiding niet eerder een mastergraad
      heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.1.b
    text: |-
      tot één van de groepen van personen, bedoeld in [artikel 2.2 van de Wet studiefinanciering 2000][ref1], behoort of
      de Surinaamse nationaliteit bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 7.45a.2
    text: |-
      De voorwaarde, bedoeld in het eerste lid, onderdeel a, geldt niet voor een student die voor de eerste maal een
      opleiding op het gebied van onderwijs of gezondheidszorg volgt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.3
    text: Bij algemene maatregel van bestuur kan de categorie studenten, bedoeld in het eerste lid, worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.4
    text: |-
      Een student als bedoeld in het eerste, tweede of derde lid, die is ingeschreven voor een voltijdse opleiding is het
      volledige wettelijke collegegeld, bedoeld in [artikel 7.45, eerste lid][ref1], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45a.5
    text: |-
      Een student als bedoeld in het eerste, tweede of derde lid, die is ingeschreven voor een deeltijdse of duale
      opleiding, is het gedeeltelijke wettelijke collegegeld, bedoeld in [artikel 7.45, tweede lid][ref1], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45a.6
    text: |-
      Indien een student als bedoeld in het eerste, tweede of derde lid meer dan één opleiding volgt en de opleiding
      waarvoor hij het eerst is ingeschreven met goed gevolg afrondt, is deze student het wettelijke collegegeld
      verschuldigd voor het resterende deel van het studiejaar. Het verschuldigde bedrag wordt in dat geval berekend naar
      rato van het aantal resterende maanden van het desbetreffende studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.7
    text: |-
      Voor de voorwaarde, bedoeld in het eerste lid, onderdeel a, wordt met een student die een bachelorgraad heeft
      behaald gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.7.a
    text: |-
      een student die met goed gevolg het afsluitend examen heeft afgelegd van een hogere beroepsopleiding met een
      studielast van 168 studiepunten, volgens de wet zoals die luidde op 31 augustus 2002, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.7.b
    text: |-
      een student die met goed gevolg het kandidaatsexamen heeft afgelegd van een opleiding in het wetenschappelijk
      onderwijs als bedoeld in [artikel 7.8][ref1], zoals dat artikel luidde op 31 augustus 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.8
    text: |-
      Voor de voorwaarde, bedoeld in het eerste lid, onderdeel a, wordt met een student die een bachelor- en mastergraad
      heeft behaald, gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
  - number: 7.45a.8.a
    text: |-
      een student die met goed gevolg het afsluitend examen heeft afgelegd van een opleiding in het wetenschappelijk
      onderwijs als bedoeld in [artikel 7.3][ref1], zoals dat artikel luidde op 31 augustus 2002;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.45a.8.b
    text: |-
      een student die op grond van [artikel 18.14][ref1] met goed gevolg het afsluitend examen heeft afgelegd van een
      opleiding in het wetenschappelijk onderwijs; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
  - number: 7.45a.8.c
    text: |-
      een student die op grond van [artikel 18.15][ref1] met goed gevolg het afsluitend examen heeft afgelegd van een
      opleiding in het wetenschappelijk onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
  - number: 7.45b.1
    text: |-
      Een student als bedoeld in [artikel 7.45a, eerste, tweede of derde lid][ref1], die is ingeschreven voor
      een onderwijseenheid bij de Open Universiteit, is collegegeld OU verschuldigd ter hoogte van ten minste
      één zestigste deel en ten hoogste één dertigste deel van het volledige wettelijke collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref2], vermenigvuldigd met het aantal studiepunten dat een onderwijseenheid groot is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.2
    text: |-
      Een student die is ingeschreven voor een onderwijseenheid bij de Open Universiteit en die niet voldoet
      aan de voorwaarden, bedoeld in [artikel 7.45a, eerste, tweede, of derde lid][ref1], is collegegeld OU
      verschuldigd ter hoogte van ten minste één dertigste deel van het volledige wettelijke collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref2], vermenigvuldigd met het aantal studiepunten dat een onderwijseenheid groot is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.3
    text: |-
      De hoogte van het collegegeld OU wordt door het instellingsbestuur van de Open Universiteit vastgesteld. Voor
      de categorie studenten, bedoeld in het tweede lid, kan het instellingsbestuur van de Open Universiteit per
      onderwijseenheid of groep van onderwijseenheden of per groep of groepen studenten een verschillend collegegeld
      OU vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45b
  - number: 7.45b.4
    text: |-
      Indien een student als bedoeld in het tweede lid gedurende een studiejaar alsnog voldoet aan de voorwaarden,
      bedoeld in [artikel 7.45a, eerste, tweede of derde lid][ref1], is hij voor het resterende deel van het studiejaar
      op zijn verzoek het collegegeld OU, bedoeld in het eerste lid, verschuldigd, en betaalt het instellingsbestuur OU
      hem het hogere collegegeld OU, dat de student voor het restant van het studiejaar heeft betaald, terug.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45b.5
    text: Het instellingsbestuur van de Open Universiteit stelt regels vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.45b
  - number: 7.46.1
    text: |-
      Een student die niet voldoet aan de voorwaarden, bedoeld in
      [artikel 7.45a, eerste, tweede, derde of zesde lid][ref1], en niet is ingeschreven voor een onderwijseenheid bij de
      Open Universiteit, is het instellingscollegegeld verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.2
    text: |-
      De hoogte van het instellingscollegegeld wordt door het instellingsbestuur vastgesteld. Het instellingsbestuur kan
      per opleiding of groep van opleidingen of per groep of groepen studenten een verschillend instellingscollegegeld
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.46
  - number: 7.46.3
    text: |-
      Onverminderd [artikel 7.3c, vierde lid][ref1], bedraagt het instellingscollegegeld ten minste het volledige
      wettelijke collegegeld, bedoeld in [artikel 7.45, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.4
    text: |-
      Indien de student, bedoeld in het eerste lid, gedurende een studiejaar alsnog voldoet aan de voorwaarden, bedoeld
      in [artikel 7.45a, eerste, tweede, derde of zesde lid][ref1], is hij voor het resterende deel van het studiejaar
      op zijn verzoek het wettelijke collegegeld verschuldigd en betaalt het instellingsbestuur hem het hogere
      instellingscollegegeld, dat de student voor het restant van het studiejaar heeft betaald, terug.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.5
    text: Het instellingsbestuur stelt regels vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.46
  - number: 7.47.1
    text: 'Het collegegeld wordt door of namens de student voldaan door:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.47
  - number: 7.47.1.a
    text: betaling ineens,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.47
  - number: 7.47.1.b
    text: betaling in vijf termijnen, op verzoek van degene die zich tot betaling heeft verbonden, dan wel
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.47
  - number: 7.47.1.c
    text: |-
      betaling in een ander aantal termijnen overeenkomstig een door het instellingsbestuur en degene die zich tot
      betaling heeft verbonden te treffen betalingsregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.47
  - number: 7.47.2
    text: |-
      Indien er sprake is van betaling in termijnen kunnen door het instellingsbestuur administratiekosten in rekening
      worden gebracht tot een bij of krachtens algemene maatregel van bestuur vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.47
  - number: 7.48.1
    text: |-
      Indien een student als bedoeld in [artikel 7.45a][ref1] bij een instelling is ingeschreven voor een opleiding en
      aan dezelfde of een andere bekostigde instelling met uitzondering van de Open Universiteit een tweede inschrijving
      wenst, is hij voor de laatstbedoelde inschrijving vrijgesteld van het betalen van collegegeld, tenzij het betaalde
      dan wel te betalen bedrag voor de eerste inschrijving lager is dan het volledige wettelijke collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref2]. In dat geval is het verschil verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.2
    text: |-
      Degene die voor het volgen van uit de openbare kas bekostigd onderwijs les- of cursusgeld verschuldigd is op
      grond van de [Les- en cursusgeldwet][ref1], en die in plaats daarvan, dan wel daarnaast in hetzelfde studiejaar
      wenst te worden ingeschreven en daarvoor het wettelijk collegegeld, bedoeld in [artikel 7.45, eerste lid][ref2],
      is verschuldigd, is voor de inschrijving voor een opleiding aan een bekostigde instelling met uitzondering van de
      Open Universiteit een collegegeld verschuldigd, dat het verschil bedraagt tussen de reeds voldane bijdrage en het
      bedoelde wettelijke collegegeld. Indien hij een collegegeld verschuldigd is dat lager is dan het reeds voldane
      bedrag wordt hij van het betalen van collegegeld vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.3
    text: |-
      Een student is slechts een gedeelte van het door hem verschuldigde wettelijk collegegeld verschuldigd, indien de
      student zich gedurende het studiejaar inschrijft. In dat geval wordt het verschuldigde bedrag berekend naar rato
      van het aantal resterende maanden van het desbetreffende studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
  - number: 7.48.4
    text: |-
      De student heeft aanspraak op terugbetaling van een twaalfde gedeelte van het door hem verschuldigde wettelijk
      collegegeld voor elke maand dat het studiejaar na beëindiging van zijn inschrijving duurt, tenzij een
      betalingsregeling als bedoeld in [artikel 7.47, onderdeel b][ref1], is getroffen. Indien een student in de loop van
      het studiejaar overlijdt, wordt voor elke daaropvolgende maand van het studiejaar na diens overlijden, een twaalfde
      gedeelte van het betaalde wettelijk collegegeld terugbetaald. Bij beëindiging van de inschrijving met ingang van
      juli of augustus heeft de student geen aanspraak op beëindiging van betaling van de termijnen, bedoeld in artikel
      7.47, onderdeel b, en op terugbetaling van het voor die maanden betaalde collegegeld, tenzij het instellingsbestuur
      dat anders heeft geregeld. Dit lid is niet van toepassing op de Open Universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.5
    text: |-
      Vermindering of vrijstelling van het wettelijk collegegeld in andere gevallen dan bedoeld in het eerste
      tot en met vierde lid, wordt aangemerkt als ondoelmatige besteding van de rijksbijdrage, bedoeld in
      [artikel 2.9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.48.6
    text: |-
      Het instellingsbestuur van de Open Universiteit stelt een regeling vast waarin een voorziening
      in de vorm van een verlaging van het collegegeld OU wordt getroffen, voor studenten als
      bedoeld in [artikel 7.45b, eerste lid][ref1], van wie het toetsingsinkomen, bedoeld in
      [artikel 8, eerste tot en met vierde lid, van de Algemene wet inkomensafhankelijke regelingen][ref2], minder
      dan 110% van het belastbaar minimumloon bedraagt. In de regeling stelt het instellingsbestuur vast welke
      aanvraagbescheiden moeten worden ingediend. De hoogte van de verlaging, bedoeld in de eerste volzin, is in elk
      geval afhankelijk van het inkomen van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 7.48.7
    text: |-
      Een student die aanspraak maakt op wettelijk collegegeld op grond van [artikel 7.45a, tweede lid][ref1], wordt voor
      een andere inschrijving niet vrijgesteld van het betalen van collegegeld als bedoeld in de [artikelen 7.45][ref2],
      [7.45a][ref3] en [7.46][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.1
    text: |-
      Het instellingsbestuur stelt in afwijking van [artikel 7.45, eerste lid,][ref1] voor
      een opleiding die of voor een experimenteel programma dat is aangewezen op grond van
      [artikel 9 van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref2], een collegegeld
      vast. Het collegegeld bedraagt ten hoogste vijf keer het volledige wettelijke collegegeld, bedoeld in
      [artikel 7.45, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.2
    text: |-
      Het instellingsbestuur draagt tijdig voor de aanvang van het studiejaar zorg voor openbaarmaking van het op grond
      van het eerste lid vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.49
  - number: 7.49.3
    text: |-
      Indien het eerste lid voor een opleiding toepassing heeft gevonden, komt het overeenkomstig het eerste lid
      vastgestelde collegegeld in de plaats van het collegegeld, genoemd in [artikel 7.45, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.4
    text: |-
      [Artikel 7.45, vijfde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.5
    text: |-
      [Artikel 7.47][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.50.1
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere geldelijke bijdrage dan de in de
      [artikelen 7.43 tot en met 7.49][ref1] bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.50
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.50.2
    text: |-
      In afwijking van het eerste lid kan bij algemene maatregel van bestuur worden bepaald dat het
      instellingsbestuur met het oog op de inschrijving voor een opleiding als bedoeld in de [artikelen 6.7][ref1],
      [7.26, eerste lid][ref2], [7.26a, eerste lid][ref3], [7.53][ref4] en [7.56][ref5] een bijdrage mag verlangen in de
      kosten die rechtstreeks verband houden met het onderwijs. De algemene maatregel van bestuur kan bepalen op welke
      kostensoorten een dergelijke bijdrage betrekking kan hebben en welk bedrag ten hoogste gevorderd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.50
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.50.3
    text: |-
      Het instellingsbestuur treft voorzieningen tot financiële ondersteuning van degenen voor wie de bijdrage, bedoeld
      in het tweede lid, een onoverkomelijke belemmering voor de inschrijving vormt. Het instellingsbestuur stelt nadere
      regels vast met betrekking tot de toepassing van het tweede lid en met betrekking tot de financiële ondersteuning,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.50
  - number: 7.51.1
    text: |-
      Het bestuur van een bekostigde instelling voor hoger onderwijs treft voorzieningen voor de financiële ondersteuning
      van een bij die instelling ingeschreven student die in verband met de aanwezigheid van een bijzondere omstandigheid
      studievertraging heeft opgelopen of naar verwachting zal oplopen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2
    text: 'De bijzondere omstandigheden, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.a
    text: |-
      het lidmaatschap van het bestuur van een studentenorganisatie van enige omvang met volledige rechtsbevoegdheid,
      een opleidingscommissie, het bestuur van een opleiding als bedoeld in [artikel 9.17][ref1], de universiteitsraad,
      de faculteitsraad, het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid][ref2], of [10.16a, derde lid][ref3], de medezeggenschapsraad, de deelraad of de
      studentenraad,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 7.51.2.b
    text: |-
      activiteiten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het instellingsbestuur mede in het
      belang zijn van de instelling of van het onderwijs dat de student volgt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.c
    text: ziekte of zwangerschap en bevalling,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.d
    text: een handicap of chronische ziekte,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.e
    text: bijzondere familieomstandigheden,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.f
    text: een onvoldoende studeerbare opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.g
    text: overige door het instellingsbestuur vastgestelde bijzondere omstandigheden waarin een student verkeert,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51.2.h
    text: |-
      andere dan de in de onderdelen a tot en met g bedoelde omstandigheden die, indien een daarop gebaseerd verzoek
      om financiële ondersteuning door het instellingsbestuur niet zou worden gehonoreerd, zouden leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51
  - number: 7.51a.1
    text: |-
      Het instellingsbestuur treft voorzieningen voor de financiële ondersteuning van een student die
      aan de desbetreffende instelling is ingeschreven voor een opleiding waarop het instellingsbestuur
      [artikel 7.4a, achtste lid][ref1], heeft toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.51a.2
    text: |-
      De duur van de financiële ondersteuning bedraagt de periode die overeenstemt met de studielast die uitgaat boven
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51a
  - number: 7.51b
    text: |-
      Het instellingsbestuur treft voorzieningen voor de financiële ondersteuning van een student die aan de
      desbetreffende instelling is ingeschreven voor een opleiding waaraan niet opnieuw accreditatie is verleend waardoor
      de student niet langer aanspraak op studiefinanciering maakt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51b
  - number: 7.51c
    text: |-
      Een student komt voor de financiële ondersteuning, bedoeld in de [artikelen 7.51 tot en met 7.51b][ref1],
      uitsluitend in aanmerking, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.51c.a
    text: de student voor de desbetreffende opleiding wettelijk collegegeld is verschuldigd; en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51c
  - number: 7.51c.b
    text: |-
      de student voor die opleiding aanspraak heeft of aanspraak heeft gehad op de prestatiebeurs als bedoeld in
      [hoofdstuk 5 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 7.51d
    text: |-
      Het instellingsbestuur kan voorzieningen treffen voor de financiële ondersteuning van een student die aan de
      desbetreffende instelling is ingeschreven voor een opleiding waarvoor aan hem nog geen graad is verleend, en noch
      tot een van de groepen van personen, bedoeld in [artikel 2.2 van de Wet studiefinanciering 2000][ref1] behoort,
      noch de Surinaamse nationaliteit bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51d
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 7.51e.1
    text: |-
      Het instellingsbestuur kan voorzieningen treffen voor de financiële ondersteuning van een persoon
      die niet aan de desbetreffende instelling is ingeschreven, maar die, indien hij ingeschreven zou
      staan aan een instelling, aanspraak zou hebben op een vorm van studiefinanciering als bedoeld in
      [artikel 5.2 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 7.51e.2
    text: De financiële ondersteuning, bedoeld in het eerste lid
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
  - number: 7.51e.2.a
    text: heeft de vorm van een overeenkomst,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
  - number: 7.51e.2.b
    text: wordt slechts getroffen voor de periode van een jaar,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
  - number: 7.51e.2.c
    text: |-
      wordt slechts getroffen voor een persoon die naar het oordeel van het instellingsbestuur activiteiten uitvoert op
      bestuurlijk of maatschappelijk gebied die mede in het belang zijn van de instelling en niet commercieel van aard
      zijn, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
  - number: 7.51e.2.d
    text: |-
      bevat in elk geval een regeling op grond waarvan de persoon voor wie de voorziening wordt getroffen toegang heeft
      tot de voorzieningen van de instelling, niet zijnde het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51e
  - number: 7.51f
    text: |-
      De financiële ondersteuning, bedoeld in de [artikelen 7.51 tot en met 7.51e][ref1], is niet hoger dan de
      studiefinanciering die betrokkene geniet uit hoofde van [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2], dan
      wel zou hebben genoten, indien hij daarop aanspraak zou maken of zou hebben mogen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51g
    text: |-
      In aanvulling op de voorzieningen, bedoeld in de [artikelen 7.51 tot en met 7.51e][ref1], kan een voorziening voor
      financiële ondersteuning worden getroffen, die samen met de financiële ondersteuning ingevolge de voorzieningen,
      bedoeld in de artikelen 7.51 tot en met 7.51e, hoger is dan de studiefinanciering die betrokkene geniet uit
      hoofde van [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2], dan wel zou hebben genoten, indien hij daarop
      aanspraak zou maken of zou hebben mogen maken. Deze aanvulling wordt verstrekt onder de benaming: voorziening voor
      aanvullende ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51g
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51h.1
    text: |-
      Het instellingsbestuur stelt regels van procedurele aard vast met betrekking tot de toepassing van de
      [artikelen 7.51 tot en met 7.51d][ref1], waartoe in ieder geval behoren regels over de aanvang, de duur en de
      hoogte van de financiële ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51h
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.51h.2
    text: |-
      Het instellingsbestuur kan aan de toekenning van financiële ondersteuning de verplichting verbinden dat de student
      feitelijk studerend is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51h
  - number: 7.51i
    text: |-
      Het instellingsbestuur stelt de student schriftelijk op de hoogte van de financiële ondersteuning, bedoeld in
      deze paragraaf, waarbij het bedrag van de aanvullende ondersteuning afzonderlijk wordt vermeld. Voorts legt
      het instellingsbestuur de aan de student verstrekte financiële ondersteuning vast in zijn administratie, onder
      vermelding van het burgerservicenummer van de student en de hoogte van het toegekende bedrag, waarbij de hoogte van
      de aanvullende ondersteuning afzonderlijk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51i
  - number: 7.51j
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op een student die aan de Open Universiteit is ingeschreven voor
      een onderwijseenheid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51j
  - number: 7.51k.1
    text: |-
      Onze minister treft voorzieningen voor de financiële ondersteuning van een student die bestuurslid is van een van
      een rechtspersoon met volledige rechtsbevoegdheid uitgaande politieke jongerenorganisatie van enige omvang of van
      een landelijke organisatie van enige omvang die voor het hoger onderwijs relevante activiteiten ontplooit en die
      daartoe daadwerkelijke activiteiten ontplooit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51k
  - number: 7.51k.2
    text: Bij ministeriële regeling worden de voorwaarden gesteld waaronder deze financiële ondersteuning plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51k
  - number: 7.51k.3
    text: |-
      De [artikelen 7.51g en 7.51i][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.51k
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 2a
  - number: 7.52.1
    text: |-
      Het instellingsbestuur kan het persoonsgebonden nummer van een student of extraneus gebruiken in het verkeer met de
      student of extraneus op wie het nummer betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2
    text: |-
      Het instellingsbestuur verstrekt het persoonsgebonden nummer van iedere student en extraneus aan Onze Minister,
      tezamen met de volgende gegevens van de student of extraneus:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.a
    text: |-
      de geslachtsnaam, voornamen, het geslacht en de geboortedatum van de student of extraneus en de postcode van diens
      woonplaats;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.b
    text: de vooropleiding;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.c
    text: de inschrijvingsvorm;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.d
    text: de opleidingsvorm;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.e
    text: |-
      de opleiding of opleidingen dan wel voor zover het de Open Universiteit betreft de onderwijseenheid of
      onderwijseenheden waarvoor de student of extraneus is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.f
    text: de opleidingsfase;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.g
    text: het jaar, de maand en de dag van inschrijving;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.h
    text: |-
      het jaar, de maand en de dag van beëindiging van de inschrijving en de reden van de beëindiging van de
      inschrijving;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.2.i
    text: |-
      het al dan niet vrijgesteld zijn van het betalen van collegegeld op grond van [artikel 7.48, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.52.2.j
    text: |-
      het jaar, de maand en de dag van het afsluitend examen van een bacheloropleiding en, indien van toepassing, van
      het afsluitend examen van een masteropleiding, een opleiding als bedoeld in [artikel 18.15][ref1], of een Ad-
      programma; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
  - number: 7.52.2.k
    text: het registratienummer van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede en
      vijfde lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en vijfde lid, niet langer behoeven
      te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen en de
      wijze van verstrekking van de gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.4
    text: |-
      Het instellingsbestuur kan het persoonsgebonden nummer van een student of extraneus, al dan niet tezamen met een of
      meer van de gegevens, bedoeld in het tweede en vijfde lid, gebruiken in het verkeer met Onze Minister ten behoeve
      van de vaststelling van de bekostiging van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.5
    text: |-
      Indien de gegevens over de nationaliteit, waaronder begrepen gegevens waaruit blijkt of de student op grond
      van [artikel 2.2 van de Wet studiefinanciering 2000][ref1] met een Nederlander gelijkgesteld wordt, niet zijn
      opgenomen in de gemeentelijke basisadministratie personen, worden deze gegevens door het instellingsbestuur
      verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '2'
  - number: 7.52.6
    text: |-
      Het instellingsbestuur gebruikt het persoonsgebonden nummer van een student of extraneus in het verkeer met een
      andere instelling of een instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die student
      of extraneus.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.7
    text: |-
      Het instellingsbestuur gebruikt het persoonsgebonden nummer van een student aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
  - number: 7.52.8
    text: |-
      Het instellingsbestuur van een universiteit of hogeschool verstrekt geen persoonsgebonden nummer van een student
      of extraneus ter uitvoering van [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan ter
      nakoming van verplichtingen als referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 7.52a.1
    text: |-
      Onze Minister neemt de door het instellingsbestuur verstrekte persoonsgebonden nummers en andere gegevens,
      bedoeld in [artikel 7.52, tweede en vijfde lid][ref1], op in het basisregister onderwijs, nadat hij deze gegevens
      heeft getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens met inbegrip van de gegevens,
      bedoeld in [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals hij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het instellingsbestuur. Onverminderd
      [artikel 7.52b, tweede lid][ref3], kan Onze Minister de door het instellingsbestuur verstrekte gegevens
      uitsluitend met instemming van het instellingsbestuur wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.52a.2
    text: |-
      Het instellingsbestuur verstrekt Onze Minister alle inlichtingen die hij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het instellingsbestuur werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52a
  - number: 7.52a.3
    text: |-
      Indien Onze Minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te nemen dat
      het instellingsbestuur in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet, kan hij de
      inspectie een onderzoek doen instellen. Onze Minister verstrekt ten behoeve van dit onderzoek de persoonsgebonden
      nummers en andere gegevens van studenten en extraneï aan de inspectie. De inspectie meldt de uitkomst van het
      onderzoek aan Onze Minister. Indien de inspectie constateert dat het instellingsbestuur in strijd handelt of heeft
      gehandeld met het bepaalde bij of krachtens deze wet, meldt zij de uitkomst van het onderzoek aan Onze Minister,
      tezamen met de voor die uitkomst relevante gegevens die aan de inspectie werden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52a
  - number: 7.52a.4
    text: |-
      Onze Minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1] geen gegevens die zij op grond van het derde lid
      hebben ontvangen, tenzij deze gegevens noodzakelijk zijn voor nakoming van verplichtingen als referent in de zin
      van die wet dan wel voor het toezicht op de naleving van de wettelijke voorschriften met betrekking tot referenten
      in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 7.52b.1
    text: 'Gegevens uit het basisregister onderwijs kunnen worden gebruikt door:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
  - number: 7.52b.1.a
    text: |-
      Onze Minister voor zover deze gegevens noodzakelijk zijn voor de planning en bekostiging van de instellingen en de
      begrotings- en beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
  - number: 7.52b.1.b
    text: |-
      de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
  - number: 7.52b.2
    text: |-
      Voor zover de door het instellingsbestuur op grond van [artikel 7.52][ref1] verstrekte gegevens naar het oordeel
      van Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling van de bekostiging
      van deze gegevens afwijken, in welk geval de door Onze Minister vastgestelde gewijzigde gegevens worden opgenomen
      in het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.52b.3
    text: |-
      Het gebruik, bedoeld in het eerste lid, ziet uitsluitend op gegevens die niet herleid of herleidbaar zijn tot
      individuele studenten of extraneï, onverminderd [artikel 7.52a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.52b.4
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval omtrent
      de inhoud en de samenstelling van de desbetreffende gegevens, de wijze waarop de gegevens uit het basisregister
      onderwijs worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt en de perioden waarop de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
  - number: 7.52b.5
    text: |-
      In afwijking van het derde lid kan Onze Minister in het verkeer met het instellingsbestuur ten behoeve van de
      vaststelling van de bekostiging het persoonsgebonden nummer gebruiken. In afwijking van het vierde lid wordt bij
      algemene maatregel van bestuur bepaald welke overige gegevens uit het basisregister onderwijs tezamen met het
      persoonsgebonden nummer hiervoor kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52b
  - number: 7.52c
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52c
  - number: 7.52c.a
    text: 'opleiding: een bacheloropleiding, en'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52c
  - number: 7.52c.b
    text: |-
      propedeutische fase: de propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in een
      bacheloropleiding met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.52c
  - number: 7.53.1
    text: |-
      Het instellingsbestuur kan per opleiding het aantal studenten vaststellen, dat ten hoogste voor de eerste maal
      kan worden ingeschreven voor de propedeutische fase van de desbetreffende opleiding. Deze vaststelling geschiedt
      voor een studiejaar. Voor 1 december van het kalenderjaar voorafgaande aan het studiejaar waarvoor de eerste
      vaststelling geschiedt, doet het instellingsbestuur hiervan mededeling aan Onze Minister. Voor een opleiding die
      na deze datum voor de eerste maal is opgenomen in het register, bedoeld in [artikel 6.13][ref1], en waarvan het
      onderwijs zal aanvangen met ingang van het daaropvolgende studiejaar, geldt 1 april als uiterste datum voor de
      mededeling aan Onze Minister van de onderwijscapaciteit van die opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.53.2
    text: |-
      Indien uit de gegevens betreffende de aanmelding, bedoeld in [artikel 7.37, vierde lid][ref1], blijkt dat het
      aantal eerste aanmeldingen van studenten voor de propedeutische fase van een opleiding meer bedraagt dan het aantal
      plaatsen dat het instellingsbestuur op grond van het eerste lid heeft vastgesteld, doet Onze Minister daarvan voor
      1 april mededeling aan het instellingsbestuur. Het instellingsbestuur deelt Onze Minister voor 1 mei mee of het
      aanleiding ziet het aantal plaatsen te verhogen. Dit lid is niet van toepassing op opleidingen als bedoeld in de
      laatste volzin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.53.3
    text: |-
      Indien ook na toepassing van het tweede lid bij een of meer instellingen die de desbetreffende opleiding
      verzorgen, het aantal aanmeldingen op 1 mei het aantal plaatsen overtreft, stelt Onze Minister vast dat een
      toelatingsbeperking van kracht is, waarna [paragraaf 4a][ref1] van deze titel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.53.4
    text: |-
      Indien het instellingsbestuur in de verwachting verkeert dat het aantal inschrijvingen voor een opleiding meer
      zal bedragen dan het aantal plaatsen dat het instellingsbestuur op grond van het eerste lid heeft vastgesteld, is,
      in afwijking van de procedure van het tweede en derde lid, eveneens een toelatingsbeperking op die opleiding van
      kracht en wordt vervolgens [paragraaf 4a][ref1] van deze titel toegepast, mits het instellingsbestuur die opleiding
      daartoe voor 1 mei heeft aangemeld bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.53.5
    text: |-
      Indien een besluit ingevolge [artikel 7.56][ref1] van toepassing is op de opleiding, blijft dit artikel buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.54.1
    text: |-
      Het instellingsbestuur kan, indien het van oordeel is dat de onderwijscapaciteit, die voor de postpropedeutische
      fase van een opleiding, waarvoor een beperking van de eerste inschrijving is vastgesteld, niet toereikend is voor
      een onbeperkte inschrijving, besluiten inschrijving voor de postpropedeutische fase van die opleiding te weigeren
      aan hen, die niet reeds ingeschreven zijn geweest aan die aan de instelling verbonden opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.54
  - number: 7.54.2
    text: |-
      In dit artikel wordt, indien in een opleiding geen propedeutische fase is ingesteld, onder «postpropedeutische
      fase» mede verstaan de fase in een bacheloropleiding die volgt op de eerste periode in een opleiding met een
      studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.54
  - number: '7.55'
    text: |-
      Het instellingsbestuur van de Open Universiteit kan de inschrijvingsmogelijkheid voor een bepaalde opleiding
      of onderwijseenheid opschorten voorzover en voor zolang de organisatorische en technische capaciteit voor het
      verzorgen van deze opleiding of onderwijseenheid daartoe naar zijn oordeel noodzaakt. Met inachtneming van de in de
      eerste volzin bedoelde beperkingen geschiedt de inschrijving in de volgorde van aanmelding voor de desbetreffende
      opleiding of onderwijseenheid, volgens door het instellingsbestuur vast te stellen regels van procedurele aard.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.55
  - number: 7.56.1
    text: |-
      Indien het aanbod van afgestudeerden van een bepaalde opleiding de behoefte daaraan op de arbeidsmarkt in
      aanmerkelijke mate overtreft of dreigt te overtreffen en in andere situaties waarin dit in verband met beheersing
      van de arbeidsmarkt wenselijk wordt geacht, kan bij ministeriële regeling het aantal personen worden vastgesteld
      dat voor de twee studiejaren na vaststelling van de ministeriële regeling ten hoogste voor de eerste maal
      kan worden ingeschreven voor het eerste studiejaar van de desbetreffende opleiding aan alle universiteiten of
      hogescholen waaraan deze is verbonden waarbij een verdeling kan worden gemaakt van dat aantal over elk van de
      bedoelde instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.56
  - number: 7.56.2
    text: |-
      [Artikel 7.53, tweede lid, derde lid, vijfde lid en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.56
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.56.3
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid wordt uiterlijk vastgesteld op 1 mei van het jaar
      voorafgaand aan het studiejaar waarin deze regeling voor het eerst van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.56
  - number: '7.57'
    text: |-
      Voor de toepassing van deze paragraaf gelden door universiteiten onderscheidenlijk hogescholen verzorgde
      opleidingen met dezelfde naam als dezelfde opleidingen. Voor de toepassing van [artikel 7.56][ref1] gelden
      bovendien door universiteiten of hogescholen verzorgde groepen van verwante opleidingen als dezelfde opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.57a.1
    text: |-
      De eerste inschrijving van een student voor de propedeutische fase van een opleiding, verbonden aan een
      universiteit of een hogeschool, waarvoor op grond van [paragraaf 4 ][ref1]van deze titel een toelatingsbeperking
      van kracht is, geschiedt slechts met inachtneming van het bepaalde bij of krachtens deze paragraaf, onverminderd
      het bepaalde bij of krachtens [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.57a.2
    text: |-
      De inschrijving geschiedt niet dan na overlegging van een door Onze Minister afgegeven bewijs van toelating, tenzij
      bij of krachtens deze paragraaf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
  - number: 7.57a.3
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
  - number: 7.57a.3.a
    text: |-
      selectieprocedure: de procedure, beschreven in de [artikelen 7.57b tot en met 7.57e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57a.3.b
    text: |-
      lotingsprocedure: de procedure, beschreven in
      [de artikelen 7.57b, eerste lid, tweede lid, aanhef en onder b tot en met e, derde en vierde lid][ref1], en
      [7.57c, tweede en derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57a.3.c
    text: 'opleiding: een bacheloropleiding;'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
  - number: 7.57a.3.d
    text: |-
      propedeutische fase: de propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in een
      bacheloropleiding met een studielast van 60 studiepunten;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
  - number: 7.57a.3.e
    text: |-
      universiteit: de universiteit, bedoeld in [artikel 1.2, onderdeel a][ref1], en de levensbeschouwelijke
      universiteit, bedoeld in artikel 1.2, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 7.57a.4
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld in verband met de afgifte en de geldigheidsduur van het
      bewijs van toelating.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57a
  - number: 7.57b.1
    text: |-
      Onze Minister deelt degenen die op grond van [artikel 7.24, eerste of tweede lid][ref1], inschrijving verlangen
      voor een opleiding, aan de hand van het behaalde gemiddelde eindexamencijfer in vijf klassen in.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.57b.2
    text: 'De in het eerste lid bedoelde klassen hebben als grenzen:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.2.a
    text: hoger dan of gelijk aan 8,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.2.b
    text: lager dan 8 maar hoger dan of gelijk aan 7,5,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.2.c
    text: lager dan 7,5 maar hoger dan of gelijk aan 7,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.2.d
    text: lager dan 7 maar hoger dan of gelijk aan 6,5 en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.2.e
    text: lager dan 6,5.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
  - number: 7.57b.3
    text: |-
      De wijze van indeling in de klassen, bedoeld in het tweede lid, van degenen die een onderwijsvorm hebben
      afgerond waaraan geen cijferlijst is verbonden, wordt geregeld in de ministeriële regeling, bedoeld in
      [artikel 7.57a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57b.4
    text: |-
      Onze Minister deelt degenen die op grond van de [artikelen 7.28][ref1] of [7.29][ref2] zijn vrijgesteld van de in
      [artikel 7.24, eerste of tweede lid][ref3], bedoelde vooropleidingseisen in de lotingsklasse, bedoeld in het tweede
      lid onder c, in.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.57b.5
    text: |-
      Onze Minister deelt de door hem aangewezen aanstaande studenten uit Aruba, Curaçao, Sint Maarten en de openbare
      lichamen BES in de klasse, bedoeld in het tweede lid onder a, in. De wijze waarop die aanwijzing geschiedt, en
      het aantal aanstaande studenten dat ten hoogste kan worden aangewezen, wordt bepaald in de ministeriële regeling,
      bedoeld in [artikel 7.57a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.1
    text: |-
      Onze Minister verstrekt een bewijs van toelating aan degenen die zijn ingedeeld in de klasse, bedoeld in
      [artikel 7.57b, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.2
    text: |-
      Onze Minister verstrekt aan degenen die in de lotingsklassen, bedoeld in
      [artikel 7.57b, tweede lid, onder b tot en met e][ref1], zijn ingedeeld, en die door het lot zijn aangewezen, een
      bewijs van toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.3
    text: |-
      Bij de loting, bedoeld in het tweede lid, verhouden de inlotingskansen, voorzover kleiner dan honderd procent, zich
      voor de in [artikel 7.57b, tweede lid, onder b tot en met e][ref1], bedoelde lotingsklassen als respectievelijk 9 :
      6 : 4 : 3.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.4
    text: |-
      In de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref1], kan worden bepaald dat Onze Minister
      ten hoogste een in die regeling vast te stellen percentage van het aantal plaatsen per opleiding kan toewijzen aan
      gegadigden jegens wie uitloting een onbillijkheid van overwegende aard zou opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.1
    text: |-
      Indien een opleiding door meer dan één universiteit wordt verzorgd, wordt de selectieprocedure voor die opleidingen
      gezamenlijk uitgevoerd. Daarbij worden de [artikelen 7.57b][ref1] en [7.57c][ref2] toegepast, met inachtneming van
      het tweede en derde lid. De gegadigden delen aan Onze Minister de volgorde van hun voorkeur voor universiteiten
      mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.2
    text: |-
      Onze Minister bepaalt, zoveel mogelijk rekening houdend met de voorkeur van de aanstaande student, doch overigens
      aan de hand van het lot voor welke universiteit het bewijs van toelating geldt. [Artikel 7.57c, derde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.3
    text: |-
      Onze Minister kan ten hoogste vijf procent van het aantal plaatsen per opleiding toewijzen aan gegadigden die na
      toepassing van het tweede lid in het bezit zijn van een bewijs van toelating voor dezelfde opleiding aan een andere
      universiteit dan die van de eerste voorkeur, indien dit een onbillijkheid van overwegende aard zou opleveren.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57d
  - number: 7.57e.1
    text: |-
      Met inachtneming van de toelatingsrechten, bedoeld in [artikel 7.57c, eerste lid][ref1], kan een instellingsbestuur
      een door hem te bepalen percentage van de opleidingsplaatsen van een opleiding toewijzen aan door hemzelf
      geselecteerde gegadigden die naar zijn oordeel beschikken over bijzondere kwalificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57e.2
    text: 'Indien het instellingsbestuur toepassing geeft aan het eerste lid, maakt het tijdig bekend:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.2.a
    text: de kwalitatieve selectiecriteria die het in aanmerking wil nemen, waarvan het aantal ten minste twee bedraagt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.2.b
    text: de regels van administratieve aard, voorzover niet voortvloeiend uit het vierde lid,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.2.c
    text: het percentage, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.2.d
    text: of gegadigden een, twee dan wel drie maal tot deelname aan de selectieprocedure kunnen worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.3
    text: |-
      Tot de bijzondere kwalificaties, bedoeld in het eerste en tweede lid, kunnen mede de behaalde eindexamencijfers
      behoren. In dat geval bedraagt het aantal bijzondere kwalificaties, bedoeld in het tweede lid, onder a, ten minste
      twee.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.4
    text: |-
      De gegadigde die in aanmerking wenst te komen voor de selectie, bedoeld in het eerste lid, wordt op zijn verzoek
      door Onze Minister aan het desbetreffende instellingsbestuur bekendgemaakt, mits hij aan de lotingsprocedure blijft
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
  - number: 7.57e.5
    text: |-
      In de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref1], worden nadere voorschriften opgenomen
      voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.1
    text: |-
      Indien krachtens [artikel 7.25][ref1] nadere vooropleidingseisen zijn gesteld, kan aan de selectieprocedure
      uitsluitend worden deelgenomen door degene die ten genoegen van Onze Minister het bewijs levert, dat door hem
      uiterlijk op een in de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref2], te bepalen tijdstip aan
      die eisen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.2
    text: |-
      Indien na toepassing van het eerste lid blijkt dat bij een of meer instellingen die toepassing hebben gegeven
      aan [artikel 7.25, vierde lid, tweede volzin][ref1], nog plaatsen beschikbaar zijn, vindt, in afwijking
      van het eerste lid, alsnog selectie plaats van degenen die zich overeenkomstig het bepaalde krachtens
      [artikel 7.37, vierde lid][ref2], hebben aangemeld, doch niet voldoen aan de krachtens [artikel 7.25][ref3]
      gestelde nadere vooropleidingseisen. Deze selectie geschiedt met toepassing van [artikel 7.57c, eerste lid][ref4],
      en met overeenkomstige toepassing van de lotingsprocedure. In de ministeriële regeling, bedoeld in
      [artikel 7.57a, vierde lid][ref5], kunnen voor de toepassing van dit lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.3
    text: |-
      Degene die heeft deelgenomen aan de lotingsprocedure voor een bepaalde opleiding en geen bewijs van toelating heeft
      verkregen, kan nadien nog ten hoogste twee maal aan de lotingsprocedure voor die opleiding deelnemen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57f
  - number: 7.57f.4
    text: |-
      Bij de toepassing van het tweede lid telt deelname aan de lotingsprocedure voor het studiejaar 1998–1999 of
      eerdere studiejaren niet mee. Bovendien telt deelname aan de lotingsprocedure voor het studiejaar 1999–2000 niet
      mee voor degene die voor dat studiejaar voor de eerste maal aan de lotingsprocedure voor dezelfde opleiding heeft
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57f
  - number: 7.57f.5
    text: |-
      Aan de selectieprocedure kan niet worden deelgenomen door degene die voor een opleiding is ingeschreven of in enig
      studiejaar was ingeschreven en inschrijving wenst voor dezelfde opleiding aan een andere instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57f
  - number: 7.57g
    text: |-
      In afwijking van de [artikelen 6:7][ref1] en [7:10 van de Algemene wet bestuursrecht][ref2] bedraagt de termijn
      twee weken voor het indienen van een bezwaarschrift tegen een besluit van Onze Minister inzake afgifte van een
      bewijs van toelating, onderscheidenlijk vier weken na ontvangst van het bezwaarschrift voor de beslissing van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.57h.1
    text: |-
      Het instellingsbestuur kan voorschriften geven en maatregelen nemen met betrekking tot de goede gang van zaken
      in de gebouwen en terreinen van de instelling. Die maatregelen kunnen inhouden dat aan degene die de bedoelde
      voorschriften heeft overtreden, de toegang tot die gebouwen en terreinen geheel of gedeeltelijk voor de tijd van
      ten hoogste een jaar wordt ontzegd, of de inschrijving gedurende eenzelfde periode wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57h
  - number: 7.57h.2
    text: |-
      Als de persoon die de voorschriften, bedoeld in het eerste lid, overtreedt, ernstige overlast binnen de
      gebouwen en terreinen van de instelling heeft veroorzaakt en deze overlast ook na aanmaning door of vanwege
      het instellingsbestuur niet heeft gestaakt, kan het instellingsbestuur die student de toegang tot de instelling
      definitief ontzeggen of zijn inschrijving beëindigen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57h
  - number: 7.57i.1
    text: |-
      De onderwijs- en examenregelingen van de betreffende hogescholen en universiteiten regelen de wijze waarop aan
      degene die met goed gevolg het afsluitend examen, verbonden aan een verwante bacheloropleiding in het hoger
      beroepsonderwijs heeft afgelegd, door het instellingsbestuur ondersteuning wordt geboden ter bevordering van een
      goede doorstroming naar een verwante masteropleiding in het wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57i
  - number: 7.57i.2
    text: |-
      Indien de omvang van de ondersteuning, bedoeld in het eerste lid, overeenkomt met een studielast van 30
      studiepunten of minder kan het instellingsbestuur daarvoor een vergoeding vragen ter hoogte van maximaal een
      proportioneel deel van het wettelijk collegegeld. Indien de studielast overeenkomt met meer dan 30 studiepunten
      maar niet meer bedraagt dan 60 studiepunten kan het instellingsbestuur voor het aantal studiepunten boven de 30 een
      vergoeding vragen van maximaal een proportioneel deel van twee maal het wettelijk collegegeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57i
  - number: 7.57i.3
    text: |-
      Indien de studielast overeenkomt met meer dan 60 studiepunten stelt het instellingsbestuur het tarief van de
      vergoeding vast voor het resterende gedeelte.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57i
  - number: 7.57i.4
    text: |-
      Een student die gebruik maakt van de ondersteuning terwijl hij een opleiding volgt waarvoor hij wettelijk
      collegegeld verschuldigd is, wordt vrijgesteld van het betalen van een vergoeding voor de ondersteuning.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57i
  - number: 7.57i.5
    text: |-
      Een student die gebruik maakt van de ondersteuning en, in afwijking van [artikel 7.32, derde lid][ref1], alleen
      met dat oogmerk is ingeschreven voor een opleiding, betaalt gedurende de periode dat hij ondersteuning ontvangt in
      plaats van collegegeld een vergoeding voor de ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.57i
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.59.1
    text: Het instellingsbestuur stelt het studentenstatuut vast en maakt dit bekend.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.2
    text: |-
      Het instellingsbestuur reikt aan iedere student bij de eerste inschrijving voor een opleiding het studentenstatuut
      uit. Indien noodzakelijk reikt het instellingsbestuur ook bij inschrijving voor een volgend studiejaar het
      studentenstatuut uit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.3
    text: Het studentenstatuut omvat een opleidingsspecifiek deel en een instellingsspecifiek deel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4
    text: 'Het opleidingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4.a
    text: |-
      een beschrijving van de studieopbouw en de ondersteunende faciliteiten die de student door de instelling worden
      aangeboden, waaronder in ieder geval worden begrepen:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4.a.1°
    text: informatie over de opzet, organisatie en uitvoering van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4.a.2°
    text: de studentenvoorzieningen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4.a.3°
    text: de faciliteiten betreffende de studiebegeleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.4.b
    text: |-
      de vastgestelde onderwijs- en examenregeling, bedoeld in [artikel 7.13, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.59.4.c
    text: |-
      een beschrijving van procedures die in aanvulling op de procedures, bedoeld in het vijfde lid onder *b* ten 2°, op
      de opleiding van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.5
    text: 'Het instellingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.5.a
    text: |-
      een beschrijving van de rechten en verplichtingen van de studenten, voortvloeiende uit het bepaalde bij of
      krachtens de wet, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.5.b
    text: 'een overzicht van de regelingen die beogen de rechten van studenten te beschermen, waarin worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59.5.b.1°
    text: |-
      een beschrijving van de procedures voor de behandeling van klachten en geschillen, bedoeld in [titel 4][ref1],
      alsmede van de procedures voor de behandeling van geschillen inzake medezeggenschap, alsmede van de beroepsrechten
      die kunnen worden ontleend aan deze wet en andere wettelijke regelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.59.5.b.2°
    text: |-
      een beschrijving van aanvullende procedures ter bescherming van de rechten van studenten die door het
      instellingsbestuur worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59
  - number: 7.59a.1
    text: |-
      Het instellingsbestuur richt een toegankelijke en eenduidige faciliteit in. Het instellingsbestuur stelt een nadere
      regeling vast met betrekking tot deze paragraaf en [paragraaf 2][ref1], die een onderdeel vormt van het bestuurs-
      en beheersreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.2
    text: |-
      Een betrokkene dient een klacht als bedoeld in [artikel 7.59b][ref1] en een beroep of bezwaar als bedoeld
      in [paragraaf 2][ref2] vanwege een genomen beslissing van een orgaan van een instelling voor hoger
      onderwijs dan wel het ontbreken ervan op grond van deze wet en daarop gebaseerde regelingen in bij de
      faciliteit. Indien het een beroep of bezwaar van een betrokkene aan een openbare instelling betreft, zijn de
      [artikelen 6:4, eerste en tweede lid][ref3], en [7:1a van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.59a.3
    text: |-
      In deze paragraaf en de [paragrafen 2 tot en met 4][ref1] wordt onder «betrokkene» verstaan: een student, een
      aanstaande student, een voormalige student, een extraneus, een aanstaande extraneus of een voormalige extraneus.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.4
    text: |-
      De termijn voor het schriftelijk indienen van een beroep of bezwaar als bedoeld in [paragraaf 2][ref1] bedraagt
      zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.59a.5
    text: |-
      De faciliteit bevestigt de ontvangst van een binnengekomen klacht, beroep of bezwaar schriftelijk
      aan de betrokkene en zendt deze, nadat daarop de datum van ontvangst is aangetekend, zo
      spoedig mogelijk door aan het bevoegde orgaan. Indien het een openbare instelling betreft, is
      [artikel 6:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.59a.6
    text: |-
      De datum van ontvangst, bedoeld in het vijfde lid, is bepalend voor de vraag of een klacht,
      beroep of bezwaar tijdig is ingediend. Indien het een openbare instelling betreft, is
      [artikel 6:15, derde lid, van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.59a.7
    text: |-
      Indien de faciliteit een klacht, beroep of bezwaar aan een onbevoegd orgaan heeft gezonden, zendt dit orgaan
      het desbetreffende stuk zo spoedig mogelijk terug naar de faciliteit. Het bevoegde orgaan behandelt een klacht,
      beroep of bezwaar dat door een betrokkene rechtstreeks is ingediend bij dit orgaan slechts na tussenkomst van de
      faciliteit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59a
  - number: 7.59b
    text: |-
      Het instellingsbestuur behandelt een klacht van een betrokkene, wat een bijzondere instelling betreft met
      overeenkomstige toepassing van [titel 9.1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.59b
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 7.60.1
    text: Elke instelling voor hoger onderwijs heeft een college van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
  - number: 7.60.2
    text: |-
      Het college van beroep heeft drie of vijf leden. Het aantal plaatsvervangende leden is niet groter dan het aantal
      leden. Het college houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
  - number: 7.60.3
    text: |-
      Het college kan besluiten kamers in te stellen. Indien het college daartoe besluit, bestaat het college uit ten
      minste zes en ten hoogste vijftien leden. Het aantal plaatsvervangende leden is niet groter dan het aantal leden.
      Elke kamer heeft drie of vijf leden. Zij houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
  - number: 7.60.4
    text: |-
      De voorzitter, de plaatsvervangend voorzitter of voorzitters en de overige leden en de eventuele plaatsvervangende
      leden worden door het instellingsbestuur benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar
      of, voorzover het studenten betreft, voor een termijn van ten minste een en ten hoogste twee jaar. De leden en
      plaatsvervangende leden maken geen deel uit van het instellingsbestuur of van de inspectie. Buiten de voorzitter
      bestaat het college voor tenminste de helft uit docenten, onderscheidenlijk leden van de wetenschappelijke staf.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
  - number: 7.60.5
    text: |-
      De voorzitter en de plaatsvervangende voorzitter of voorzitters moeten voldoen aan de vereisten voor benoembaarheid
      tot rechterlijk ambtenaar, bedoeld in [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 7.60.6
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van het college van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot
      ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.60
  - number: 7.61.1
    text: 'Het college van beroep voor de examens is bevoegd ten aanzien van de volgende beslissingen:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
  - number: 7.61.1.a
    text: |-
      beslissingen als bedoeld in de [artikelen 7.8b, derde en vijfde lid][ref1], en [7.9, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.b
    text: |-
      beslissingen inzake het met goed gevolg hebben afgelegd van het afsluitend examen, bedoeld in [artikel 7.9d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.c
    text: |-
      beslissingen, niet zijnde besluiten van algemene strekking, genomen op grond van het bepaalde bij of krachtens
      [titel 2][ref1] van dit hoofdstuk, met het oog op de toelating tot examens,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.61.1.d
    text: |-
      beslissingen, genomen op grond van het aanvullend onderzoek, bedoeld in de [artikelen 7.25, vijfde lid][ref1],
      en [7.28, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.e
    text: beslissingen van examencommissies en examinatoren,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
  - number: 7.61.1.f
    text: |-
      beslissingen van commissies als bedoeld in [artikel 7.29, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.g
    text: |-
      beslissingen, genomen op grond van [artikel 7.30b][ref1] met het oog op de toelating tot de in dat artikel bedoelde
      opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.61.2
    text: |-
      Het beroep kan, wat de openbare instellingen betreft in afwijking van
      [hoofdstuk 7 van de Algemene wet bestuursrecht][ref1], worden ingesteld terzake dat een beslissing in strijd is met
      het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 7.61.3
    text: |-
      Alvorens het beroep in behandeling te nemen zendt het college van beroep het beroepschrift aan het
      orgaan waartegen het beroep is gericht, met uitnodiging om in overleg met betrokkenen na te gaan of een
      minnelijke schikking van het geschil mogelijk is, wat de openbare instellingen betreft in afwijking van
      [afdeling 7.3 van de Algemene wet bestuursrecht][ref1]. Ingeval het beroep is gericht tegen een beslissing van
      een examinator, geschiedt de in de voorgaande volzin bedoelde toezending aan de desbetreffende examencommissie.
      Indien de examinator tegen wie het beroep is gericht, lid is van de examencommissie, neemt hij geen deel aan de
      beraadslaging. Het desbetreffende orgaan deelt binnen drie weken aan het college van beroep, onder overlegging van
      de daarop betrekking hebbende stukken, mede tot welke uitkomst het beraad heeft geleid. Is een minnelijke schikking
      niet mogelijk gebleken, dan wordt het beroepschrift door het college in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '7.3'
  - number: 7.61.4
    text: |-
      Het college van beroep beslist binnen tien weken gerekend vanaf de dag na die waarop de termijn voor
      het indienen van het beroepschrift is verstreken, wat de openbare instellingen betreft in afwijking van
      [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.5
    text: |-
      Indien het college van beroep het beroep gegrond acht, vernietigt het de beslissing geheel of
      gedeeltelijk. Het college is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde
      beslissing een nieuwe beslissing te nemen, wat de openbare instellingen betreft in afwijking van
      [artikel 7:25 van de Algemene wet bestuursrecht][ref1]. Het kan bepalen dat opnieuw of, indien de beslissing is
      geweigerd, alsnog in de zaak wordt beslist, dan wel dat het tentamen, het examen, het toelatingsonderzoek, het
      aanvullend onderzoek of enig onderdeel daarvan opnieuw wordt afgenomen onder door het college van beroep te stellen
      voorwaarden. Het orgaan waarvan de beslissing is vernietigd, voorziet voorzover nodig opnieuw in de zaak met
      inachtneming van de uitspraak van het college van beroep. Het college kan daarvoor in zijn uitspraak een termijn
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.6
    text: |-
      Indien onverwijlde spoed dat vereist kan de voorzitter van het college van beroep een voorlopige
      voorziening treffen op verzoek van de indiener van het beroepschrift, onverminderd het bepaalde in
      [artikel 7.66, tweede lid][ref1], en [artikel 8:81 van de Algemene wet bestuursrecht][ref2]. De voorzitter beslist
      op dit verzoek na het desbetreffende orgaan dan wel de desbetreffende examinator te hebben gehoord, althans te
      hebben opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.62.1
    text: |-
      Het college van beroep voor de examens stelt een reglement van orde vast, waarin nadere regels worden gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.a
    text: de omvang en samenstelling van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.b
    text: indien nodig, de splitsing in kamers, alsmede de verdeling van de werkzaamheden over de verschillende kamers,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.c
    text: de zittingstermijn van de leden en eventuele plaatsvervangende leden van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.d
    text: de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap van het college van beroep eindigt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.e
    text: |-
      de in [artikel 7.61, derde lid][ref1], bedoelde procedure en de gevallen waarin deze procedure achterwege kan
      worden gelaten,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.62.1.f
    text: de wijze waarop in het secretariaat van het college van beroep wordt voorzien, alsmede
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.1.g
    text: de wijze waarop de voorzitter wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: 7.62.2
    text: Het reglement van orde alsmede wijzigingen daarvan, behoeven de instemming van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.62
  - number: '7.63'
    text: |-
      De organen en personeelsleden alsmede de examinatoren van de instelling verstrekken aan het college van beroep voor
      de examens de gegevens die dit college voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63
  - number: 7.63a.1
    text: |-
      Elke instelling voor hoger onderwijs heeft een geschillenadviescommissie. Op een geschillenadviescommissie
      is [artikel 7:13, eerste tot en met zesde lid, van de Algemene wet bestuursrecht][ref1] van overeenkomstige
      toepassing. De leden van de geschillenadviescommissie zijn functioneel onafhankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63a.2
    text: |-
      De geschillenadviescommissie brengt aan het instellingsbestuur advies uit over bezwaren met betrekking tot andere
      beslissingen dan wel het ontbreken ervan op grond van deze wet en daarop gebaseerde regelingen dan die, bedoeld
      in [artikel 7.61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.63a.3
    text: De geschillenadviescommissie gaat na of een minnelijke schikking tussen partijen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63a
  - number: 7.63a.4
    text: |-
      Indien sprake is van onverwijlde spoed kan de voorzitter van de geschillenadviescommissie desgevraagd bepalen
      dat de geschillenadviescommissie zo spoedig mogelijk advies uitbrengt aan het instellingsbestuur. De voorzitter
      bepaalt binnen een week na ontvangst van het bezwaar of sprake is van onverwijlde spoed en brengt de betrokkene en
      het instellingsbestuur hiervan zo spoedig mogelijk op de hoogte. Het instellingsbestuur neemt dan, wat de openbare
      instellingen betreft in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref1], binnen vier weken na
      ontvangst van het bezwaar door de faciliteit een beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63b.1
    text: |-
      Het instellingsbestuur beslist na ontvangst van het bezwaar binnen 10 weken, onverminderd de beslissingen op grond
      van de procedure, bedoeld in [artikel 7.63a, vierde lid][ref1]. Wat de openbare instellingen betreft beslist het
      instellingsbestuur in afwijking van [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.63b.2
    text: |-
      Wat bijzondere instellingen betreft worden de [artikelen 7:11][ref1], [7:12][ref2] en
      [7:13, zevende lid, van de Algemene wet bestuursrecht][ref3] overeenkomstig toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.63b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.64.1
    text: Er is een college van beroep voor het hoger onderwijs, gevestigd te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.2
    text: |-
      Het college van beroep heeft ten minste drie en ten hoogste zeven leden, onder wie de voorzitter. Het college heeft
      een even groot aantal plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.3
    text: |-
      Het college van beroep wordt bijgestaan door een secretaris. Onze minister kan aan de secretaris ambtenaren
      toevoegen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.4
    text: |-
      De ambtenaren die werkzaam zijn voor het college van beroep staan onder het gezag van dat college en leggen over
      werkzaamheden uitsluitend aan dat college verantwoording af.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.5
    text: |-
      Het college van beroep houdt zitting in kamers. Het college van beroep wijst de voorzitter van een kamer aan uit
      de leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.6
    text: |-
      Het college van beroep stelt voor zijn werkzaamheden een reglement van orde vast waarin in elk geval worden
      geregeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.6.a
    text: de splitsing in kamers,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.6.b
    text: de verdeling van werkzaamheden over de verschillende kamers, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.64.6.c
    text: de wijze waarop de voorzitter van het college van beroep en van een kamer wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.64
  - number: 7.65.1
    text: |-
      De leden van het college van beroep voor het hoger onderwijs en de plaatsvervangende leden worden bij koninklijk
      besluit benoemd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.2
    text: De secretaris wordt bij koninklijk besluit benoemd en is bezoldigd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.3
    text: |-
      De leden en plaatsvervangende leden voldoen aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld
      in [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 7.65.4
    text: |-
      Een lid of plaatsvervangend lid wordt bij koninklijk besluit ontslagen met ingang van de eerstvolgende maand, nadat
      hij:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.4.a
    text: hiertoe een verzoek heeft ingediend,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.4.b
    text: de leeftijd van zeventig jaar heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.4.c
    text: terzake gehoord, uit hoofde van ziekte of gebreken blijvend ongeschikt is om zijn functie te vervullen, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.4.d
    text: bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.65.5
    text: |-
      De toelage aan de voorzitter, de overige leden en de plaatsvervangende leden wordt vastgesteld bij koninklijk
      besluit, te nemen op gemeenschappelijke voordracht van Onze minister en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.65
  - number: 7.66.1
    text: |-
      Het college van beroep voor het hoger onderwijs oordeelt over het beroep dat een betrokkene heeft ingesteld tegen
      een beslissing van een orgaan van een instelling voor hoger onderwijs die jegens hem op grond van deze wet en
      daarop gebaseerde regelingen is genomen. Tegen uitspraken van het college van beroep voor het hoger onderwijs staat
      geen hoger beroep open.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.66
  - number: 7.66.2
    text: |-
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met uitzondering van de
      [artikelen 8:1][ref2], [8:2, eerste lid, aanhef en onder a][ref3], en [8:13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.66.3
    text: |-
      De organen van de instelling verstrekken aan het college van beroep de gegevens die dit college voor de uitvoering
      van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.66
  - number: '7.67'
    text: |-
      Het griffierecht bedraagt € 44 . Dat bedrag wordt jaarlijks met ingang van 1 januari bij regeling van Onze Minister
      van Veiligheid en Justitie aangepast aan de ontwikkeling van de consumentenprijsindex. Daarbij wordt het bedrag
      rekenkundig afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.67
  - number: 7.68.1
    text: |-
      In afwijking van [artikel 7.66, eerste lid][ref1], kan het bestuur van een bijzondere instelling in een
      regeling bepalen dat de instelling in verband met de levensbeschouwelijke aard van de instelling, al dan
      niet in samenwerking met besturen van een of meer andere bijzondere instellingen voor hoger onderwijs met een
      levensbeschouwelijke aard, een college van beroep bijzonder onderwijs instelt voor de behandeling van beroepen
      ingesteld door een betrokkene tegen een beslissing van een orgaan van een instelling voor hoger onderwijs die
      jegens hem op grond van deze wet en daarop gebaseerde regelingen is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.68.2
    text: |-
      De regeling bevat een uitwerking van de onderwerpen, genoemd in
      [artikel 7.62, eerste lid][ref1], alsmede de rechtsgang bij het college waarbij de
      [artikelen 7.60, vierde lid, eerste en tweede volzin, vijfde en zesde lid][ref2],
      [7.61, tweede, vierde, vijfde, en zesde lid][ref3] en [7.63][ref4] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.68.3
    text: |-
      De regeling alsmede wijzigingen daarvan worden vastgesteld met in achtneming van de
      [artikelen 7.59a tot en met 7.67][ref1]. De regeling alsmede de wijzigingen daarvan worden geacht te voldoen aan
      de in [artikel 1.9, derde lid, onder g][ref2], bedoelde voorwaarde, indien Onze minister niet binnen drie maanden
      heeft verklaard van oordeel te zijn, dat het bestuur bij de vaststelling van de rechtsgang de artikelen 7.59a
      tot en met 7.67 niet in acht heeft genomen en daartoe in redelijkheid geen beroep heeft kunnen doen op de eigen
      levensbeschouwelijke aard van de bijzondere instelling die zich tegen inachtneming daarvan zou verzetten, of dat
      onvoldoende aannemelijk heeft gemaakt. Binnen drie maanden wordt het bezwaar ondervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 7.68.4
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het derde lid, wordt opgeschort totdat de beroepstermijn
      is verstreken, of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.68
  - number: 7a.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7a.1
  - number: 7a.1.a
    text: |-
      instelling: een instelling als bedoeld in [artikel 7a.2][ref1], en


