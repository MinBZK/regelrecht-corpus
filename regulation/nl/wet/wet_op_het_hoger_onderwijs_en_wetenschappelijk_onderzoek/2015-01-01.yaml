  - number: '7.2'
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.2
  - number: 7.2.a
    text: wanneer het een opleiding met betrekking tot die taal betreft,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.2
  - number: 7.2.b
    text: wanneer het onderwijs betreft dat in het kader van een gastcollege door een anderstalige docent gegeven wordt, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.2
  - number: 7.2.c
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de studenten
      daartoe noodzaakt, overeenkomstig een door het instellingsbestuur vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.2
  - number: 7.3.1
    text: Het onderwijs wordt door de instelling aangeboden in de vorm van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Een opleiding is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking van welomschreven
      doelstellingen op het gebied van kennis, inzicht en vaardigheden waarover degene die de opleiding voltooit, dient
      te beschikken. Een onderwijseenheid kan betrekking hebben op de praktische voorbereiding op de beroepsuitoefening
      en op de beroepsuitoefening in verband met het onderwijs in een duale opleiding, voorzover deze activiteiten onder
      begeleiding van het instellingsbestuur plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
  - number: 7.3.3
    text: Aan elke opleiding is een examen verbonden. Aan elke onderwijseenheid is een tentamen verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
  - number: 7.3.4
    text: |-
      Elke opleiding wordt op de voet van [titel 3 van hoofdstuk 6][ref1] geregistreerd in het Centraal register
      opleidingen hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 7.3.5
    text: |-
      Het examen, bedoeld in het derde lid, dat met goed gevolg is afgelegd en de met het oog daarop vervaardigde
      werkstukken worden door het instellingsbestuur gedurende een periode van ten minste zeven jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
  - number: 7.3.5
    text: |-
      Het instellingsbestuur kan de naam van een opleiding wijzigen in het kader van het verlenen van accreditatie of
      tussentijds als daarmee wordt bereikt dat de naam beter aansluit bij wat binnen de visitatiegroep of de sector
      gebruikelijk is. Tussentijdse wijziging kan slechts plaatsvinden na instemming door het accreditatieorgaan. Het
      accreditatieorgaan stemt in als wordt voldaan aan de criteria, bedoeld in [artikel 5a.2, lid 2a, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 7.3.6
    text: |-
      Indien het instellingsbestuur besluit een opleiding of een Ad-programma binnen een opleiding, te beëindigen,
      worden de aan die opleiding of dat Ad-programma ingeschreven studenten in de gelegenheid gesteld hun opleiding,
      onderscheidenlijk het Ad-programma zonder onderbreking bij die instelling te vervolgen. Daarbij wordt een termijn
      in acht genomen die ten hoogste de voor de betrokken studenten resterende, aan de studielast van de opleiding,
      onderscheidenlijk van het gevolgde Ad-programma, gerelateerde studieduur vermeerderd met een jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3
  - number: 7.3a.1
    text: 'Binnen het wetenschappelijk onderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3a.1.a
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3a.1.b
    text: masteropleidingen, volgend op de bacheloropleidingen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3a.2
    text: 'Binnen het hoger beroepsonderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3a.2.a
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3a.2.b
    text: masteropleidingen, volgend op de bacheloropleidingen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3a
  - number: 7.3b
    text: 'Naast de opleidingen, bedoeld in artikel 7.3a, worden binnen het hoger onderwijs onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3b
  - number: 7.3b.a
    text: postinitiële masteropleidingen in het wetenschappelijk onderwijs, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3b
  - number: 7.3b.b
    text: postinitiële masteropleidingen in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel7.3b
  - number: 7.3c.1
    text: |-
      Een instelling kan gezamenlijk met een of meer Nederlandse instellingen of buitenlandse instellingen voor
      hoger onderwijs een opleiding of afstudeerrichting verzorgen. In dat geval is het instellingsbestuur van de
      betrokken Nederlandse instelling onderscheidenlijk zijn de instellingsbesturen van de betrokken Nederlandse
      instellingen gezamenlijk verantwoordelijk voor de taken en bevoegdheden, bedoeld in de [artikelen 5a.9][ref1],
      [5a.11][ref2], [6.2][ref3], [6.14][ref4], [7.4a, derde en achtste lid][ref5], [7.4b, derde lid][ref6], [7.8][ref7],
      [7.8b][ref8], [7.9][ref9], [7.10a][ref10], [7.11][ref11], [7.12a][ref12], [7.13][ref13], [7.17][ref14],
      [7.24 tot en met 7.30d][ref15], [7.32][ref16], [7.37][ref17], [7.42][ref18], [7.42a][ref19], [9.18][ref20],
      [10.3c][ref21] en [11.11][ref22].


