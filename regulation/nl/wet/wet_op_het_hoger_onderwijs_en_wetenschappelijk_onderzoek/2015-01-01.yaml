    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.2
  - number: 1.2.c
    text: |-
      de in [artikel 1.13, eerste lid][ref1], bedoelde academische ziekenhuizen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.2
    references:
