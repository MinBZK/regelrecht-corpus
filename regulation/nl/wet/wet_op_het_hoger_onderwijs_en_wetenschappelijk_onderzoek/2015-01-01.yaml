  - number: 2.18.2
    text: |-
      De hoogte van de subsidie aan het academisch ziekenhuis dan wel aan het bestuur van de rechtspersoon die de
      educatieve voorziening in stand houdt, wordt bepaald op basis van het leerlingenaantal dat het gemiddelde is van
      de hoogste dagtellingen in de maanden september tot en met april van het schooljaar 1994–1995 van leerlingen van
      scholen als bedoeld in [artikel 2, tweede lid onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat
      artikel luidde op 31 juli 1999, die waren opgenomen in het desbetreffende academisch ziekenhuis, en een bedrag
      per leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 2.18.3
    text: |-
      Het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die een educatieve voorziening in stand houdt,
      ontvangt de subsidie, bedoeld in het tweede lid, onder de voorwaarde dat op de aan deze subsidie gerelateerde
      formatieplaatsen personeel wordt benoemd, dat op 31 juli 1999 was benoemd aan een of meer van de scholen, bedoeld
      in [artikel 2, tweede lid, onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat artikel luidde op 31
      juli 1999, tenzij het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die de educatieve voorziening
      in stand houdt aantoont dat met betrekking tot een formatieplaats geen lid van dat personeel beschikbaar was dat de
      formatieplaats aanvaardde. Deze benoemingsverplichting geldt voor de betrekkingsomvang die voor de desbetreffende
      personeelsleden gold aan die scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '2.19'
    text: |-
      Met betrekking tot de educatieve voorziening, bedoeld in [artikel 1.4, tweede lid][ref1], stelt het bestuur van
      een academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt,
      jaarlijks voor 1 juli een begroting voor het volgende jaar en een jaarverslag over het afgelopen jaar vast en
      zendt die aan Onze minister. Onze minister kan een richtlijn vaststellen voor de inrichting van de begroting en
      het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.20.1
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarover de subsidie is toegekend, legt het bestuur van het
      academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt, een
      verklaring van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      over aan Onze minister, waaruit blijkt in hoeverre de toegekende subsidie is besteed in overeenstemming met de
      bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.20.2
    text: |-
      Voorzover niet uit de verklaring, bedoeld in het eerste lid, blijkt dat de subsidie is besteed in overeenstemming
      met de bepalingen van deze wet, vordert Onze minister het desbetreffende bedrag terug.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel2.20
  - number: 3.1.1
    text: |-
      Onze minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten en hogescholen, de Open Universiteit, de Koninklijke Nederlandse Akademie van Wetenschappen en de
      Koninklijke Bibliotheek over aangelegenheden van algemeen beleid met betrekking tot die instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Onze minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten waaraan een academisch ziekenhuis is verbonden en van de academische ziekenhuizen over
      aangelegenheden van algemeen beleid betreffende de academische ziekenhuizen dan wel betreffende de academische
      ziekenhuizen en de universiteiten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Onze minister neemt besluiten als bedoeld in de [artikelen 2.9, vierde lid][ref1],
      [2.13, tweede en vierde lid][ref2], en [7.56, eerste lid, onder b][ref3], niet dan na het betrokken
      instellingsbestuur in de gelegenheid te hebben gesteld met hem te overleggen over zijn desbetreffend voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 3.3.1
    text: |-
      Onze minister pleegt geregeld overleg met de daarvoor in aanmerking komende belangenorganisaties van studenten over
      aangelegenheden van algemeen belang voor studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Onze minister treft een regeling ter financiële ondersteuning van de vertegenwoordigers van de in het eerste lid
      bedoelde belangenorganisaties, in verband met door hen te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel3.3
  - number: 4.1.1
    text: |-
      Dit hoofdstuk heeft betrekking op universiteiten, hogescholen, de Open Universiteiten en de levensbeschouwelijke
      universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 4.2, tweede en derde lid][ref1], heeft tevens betrekking op de
      academische ziekenhuizen, de Koninklijke Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1
    text: |-
      Het instellingsbestuur bepaalt het personeelsbeleid en voert het personeelsbeheer. Het neemt daarbij de bij of
      krachtens de wet gegeven voorschriften alsmede de eisen van zorgvuldigheid in acht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Het instellingsbestuur van een universiteit, een hogeschool of de Open Universiteit stelt ten behoeve van de
      leidinggevende functies op het gebied van onderwijs onderscheidenlijk onderzoek van elke van het instellingsbestuur
      uitgaande instelling, indien daaraan van een ondervertegenwoordiging van vrouwen in leidinggevende functies op het
      gebied van onderwijs onderscheidenlijk onderzoek sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in leidinggevende functies vast.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het instellingsbestuur een beleid inzake evenredige vertegenwoordiging
      van vrouwen in leidinggevende functies wordt gevoerd, opdat in deze functies vrouwen en mannen naar evenredigheid
      werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de verhouding mannen en vrouwen
      voor wat betreft het personeel op het gebied van onderwijs en onderzoek dat werkzaam is in het door de instelling
      verzorgde onderwijs en onderzoek, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde
      cijfers. Het document vermeldt tevens de maatregelen die het instellingsbestuur heeft genomen en zal nemen teneinde
      de in de eerste volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte
      resultaten van het beleid inzake evenredige vertegenwoordiging van vrouwen in leidinggevende functies gedurende de
      periode waarvoor het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Het instellingsbestuur draagt er zorg voor dat een exemplaar van het document in het gebouw van de instelling ter
      inzage wordt gelegd op een voor het personeel en de studenten toegankelijke plaats, alsmede dat een exemplaar wordt
      bewaard bij de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.2
  - number: 4.5.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur gestelde regels als bedoeld in het tweede en
      derde lid regelt het instellingsbestuur van een openbare instelling de rechtspositie van het personeel en draagt
      het instellingsbestuur van een bijzondere instelling zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.5.2.a
    text: |-
      salarisschalen en uitgangspunten waaraan een door het instellingsbestuur in te richten functiewaarderingssysteem
      moet voldoen, onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      rechten en plichten van het personeel en het instellingsbestuur bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, voorzover deze bij wet voorgeschreven rechten en verplichtingen te boven gaan,
      dan wel de voorwaarden waaronder het instellingsbestuur deze rechten en plichten zelf regelt dan wel voor de
      regeling daarvan zorg draagt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.5.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.5.4
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen inzake benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De bepalingen
      omtrent ontslag mogen het personeel van de openbare instellingen niet minder rechten verschaffen dan die
      welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 4.5.5
    text: |-
      Over de regelingen, bedoeld in het eerste en vierde lid, alsmede over andere aangelegenheden van algemeen belang
      voor de bijzondere rechtstoestand van het personeel van de desbetreffende instelling, wordt door of namens
      het instellingsbestuur overleg gevoerd met de daarvoor in aanmerking komende vakorganisaties van overheids- en
      onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval van een geschil over de deelneming
      aan het overleg, bedoeld in de vorige volzin, alsmede in geval van een geschil over de aard, de inhoud en de
      organisatie van het overleg leggen de betrokken partijen het geschil voor aan een geschillencommissie. Deze
      geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden aangewezen. De uitspraak van
      de geschillencommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.5
  - number: 4.7.1
    text: |-
      Elke bijzondere instelling is aangesloten bij een commissie van beroep, waarbij door elk personeelslid van die
      instelling dat rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen een beslissing, door of
      namens het instellingsbestuur genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.1.c
    text: |-
      ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], is bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 4.7.1.d
    text: het direct of indirect onthouden van bevordering, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.1.e
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.2
    text: Een commissie van beroep strekt haar werkzaamheden uit over een of meer instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.3
    text: |-
      De commissie bestaat uit een even aantal gewone leden en, wanneer dit in het [beroepsreglement][ref1] is bepaald,
      evenveel plaatsvervangende leden, een voorzitter, tevens lid, en, wanneer dit in het [beroepsreglement][ref2] is
      bepaald, een of meer plaatsvervangende voorzitters. De besturen en het personeel van de aangesloten instellingen
      benoemen onderscheidenlijk kiezen elk de helft van het aantal gewone leden en plaatsvervangende leden. De gewone
      leden kiezen de voorzitter en de plaatsvervangende voorzitter of voorzitters. De voorzitter, de plaatsvervangend
      voorzitter of voorzitters en de overige leden en de eventuele plaatsvervangende leden worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002228
      [ref2]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
      - id: ref2
        bwb_id: BWBR0002228
  - number: 4.7.4
    text: |-
      De leden en de eventuele plaatsvervangende leden van de commissie van beroep mogen geen lid zijn van het bestuur
      van een aangesloten instelling noch deel uitmaken van het personeel van de vereniging of stichting waarvan die
      instelling uitgaat.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.5
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot
      ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.6
    text: De uitspraak van de commissie van beroep is voor het instellingsbestuur bindend.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.7
    text: |-
      De besturen van de aangesloten instellingen stellen voor de commissie van beroep een [beroepsreglement][ref1]
      vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is gewaarborgd. Bij of
      krachtens het [beroepsreglement][ref2] worden geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002228
      [ref2]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
      - id: ref2
        bwb_id: BWBR0002228
  - number: 4.7.7.a
    text: de omvang en samenstelling van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.7.b
    text: de zittingstermijn van de leden en eventuele plaatsvervangende leden van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.7.c
    text: de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap eindigt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.7.d
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.7.e
    text: de wijze waarop in het secretariaat van de commissie van beroep wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 4.7.8
    text: |-
      Het [beroepsreglement][ref1] wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging
      is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
  - number: 4.7.9
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen
      terzake van beslissingen die aan het oordeel van de commissie van beroep zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel4.7
  - number: 5a.1.1
    text: |-
      Dit hoofdstuk heeft betrekking op de bekostigde universiteiten en hogescholen en de Open Universiteit en op de
      levensbeschouwelijke universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.1
  - number: 5a.1.2
    text: |-
      Dit hoofdstuk heeft tevens betrekking op de rechtspersonen met volledige rechtsbevoegdheid die geaccrediteerde
      initiële of postinitiële opleidingen verzorgen of willen verzorgen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.1
  - number: 5a.2.1
    text: |-
      Er is een accreditatieorgaan dat is belast met activiteiten in het kader van het verlenen van accreditatie,
      de toets nieuwe opleiding, de toets nieuw Ad-programma en de instellingstoets kwaliteitszorg op grond van
      [titel 2][ref1] of [2a][ref2] van dit hoofdstuk en overige hem bij of krachtens de wet opgedragen taken. Het
      accreditatieorgaan bezit rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: 5a
  - number: 5a.2.2
    text: |-
      Het accreditatieorgaan is tevens belast met het instellen van een commissie van deskundigen, die adviseert over
      de aanvraag om de toets nieuwe opleiding, de toets nieuw Ad-programma of de instellingstoets kwaliteitszorg.
      Daarnaast stemt het accreditatieorgaan in met een door de instellingsbesturen binnen een visitatiegroep gezamenlijk
      samengestelde commissie van deskundigen, voor de beoordeling, bedoeld in [artikel 1.18, derde lid][ref1], ten
      behoeve van de aanvraag om accreditatie, indien het accreditatieorgaan zich ervan verzekerd heeft dat de commissie
      van deskundigen onafhankelijk en deskundig is. Indien het instellingsbestuur er niet in slaagt in samenwerking
      met andere instellingen binnen een visitatiegroep een commissie van deskundigen samen te stellen, doet het
      accreditatieorgaan een bindende voordracht voor de samenstelling van de commissie. Van de in de vorige volzinnen
      bedoelde commissies van deskundigen maakt een student deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.2.2a
    text: 'Het accreditatieorgaan toetst bij de accreditatie en de toets nieuwe opleiding tevens:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
  - number: 5a.2.2a.a
    text: |-
      de door een instellingsbestuur voorgestelde toevoeging aan een graad als bedoeld in
      [artikel 7.10a, tweede en derde lid][ref1], op internationale herkenbaarheid aan de hand van een referentielijst
      die bij ministeriële regeling wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5a.2.2a.b
    text: |-
      of de door het instellingsbestuur gehanteerde naam van de opleiding voldoende inzicht biedt in de inhoud van de
      opleiding en aansluit bij hetgeen gebruikelijk is binnen de visitatiegroep of sector waartoe de opleiding behoort.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
  - number: 5a.2.3
    text: |-
      Het accreditatieorgaan is desgevraagd belast met het adviseren van Onze minister over het gebruiken van de
      bevoegdheid, bedoeld in [artikel 5a.12b][ref1] en [5a.13e, tweede lid][ref2]. Voordat het accreditatieorgaan
      een advies als bedoeld in de eerste volzin uitbrengt, kan hij een onderzoek instellen waarbij de
      [artikelen 5:13][ref3], [5:16][ref4], [5:17][ref5] en [5:20 van de Algemene wet bestuursrecht][ref6] van
      overeenkomstige toepassing zijn en schakelt hij een commissie van deskundigen in.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5a.2.3a
    text: |-
      Het accreditatieorgaan deelt de opleidingen die door de instellingen worden verzorgd in visitatiegroepen in, nadat
      de betreffende instellingsbesturen in de gelegenheid zijn gesteld hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
  - number: 5a.2.4
    text: |-
      Het accreditatieorgaan rapporteert desgevraagd aan Onze minister over de kwaliteit van opleidingen in het hoger
      onderwijs met het oog op de vergelijkbaarheid aan de hand van zijn beoordelingen op grond van dit hoofdstuk. Het
      accreditatieorgaan doet op grond daarvan voorstellen die hij in het belang van de kwaliteit van opleidingen in het
      hoger onderwijs nodig acht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
  - number: 5a.2.5
    text: |-
      Het accreditatieorgaan heeft tevens tot taak het accreditatiekader, bedoeld in [artikel 5a.2a][ref1], te bespreken
      met instanties in de Europese landen, in het bijzonder met instanties in de grenslanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.2.6
    text: |-
      Bij ministeriële regeling worden de overige werkzaamheden bepaald die het accreditatieorgaan verricht in verband
      met het beoordelen van ander onderwijs dan hoger onderwijs of in verband met opdrachten als bedoeld in artikel 1,
      tweede lid, van het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
  - number: 5a.2.7
    text: |-
      Onverminderd het Accreditatieverdrag en het daarop gebaseerde Beheersreglement is op het accreditatieorgaan de
      [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 5a.2a.1
    text: |-
      Het accreditatieorgaan legt zijn werkwijze voor het verlenen van accreditatie, toets nieuwe opleiding, toets nieuw
      Ad-programma en instellingstoets kwaliteitszorg, de samenstelling van een visitatiegroep en de uitwerking van de
      criteria, bedoeld in [artikel 5a.8, tweede lid][ref1], [5a.10a, tweede lid][ref2], [5a.13b, tweede lid][ref3],
      [5a.13f, eerste lid][ref4] en [5a.13g, eerste lid][ref5], vast in het accreditatiekader, waarbij voor
      de beoordeling ten minste onderscheid wordt gemaakt tussen het wetenschappelijk onderwijs en het hoger
      beroepsonderwijs, tussen bacheloropleidingen en masteropleidingen en waarbij het verschil in de wijze van
      beoordeling van aanvragen op grond van [titel 2a][ref6] ten opzichte van [titel 2][ref7] wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk5a
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref6
        bwb_id: BWBR0005682
        hoofdstuk: 5a
      - id: ref7
        bwb_id: BWBR0005682
        hoofdstuk: 5a
  - number: 5a.2a.2
    text: |-
      Alvorens het accreditatiekader vast te stellen of te wijzigen, voert het accreditatieorgaan overleg met
      vertegenwoordigers van de instellingen en andere betrokkenen, waaronder studentenorganisaties als bedoeld in
      [artikel 3.3][ref1] en de daarvoor in aanmerking komende vakorganisaties van overheids- en onderwijspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '3'
        hoofdstuk: '3'
  - number: 5a.2a.3
    text: |-
      Het accreditatiekader of een wijziging daarvan behoeft de goedkeuring van Onze minister. De goedkeuring kan
      worden onthouden wegens strijd met het recht of het algemeen belang. Onze minister verleent zijn goedkeuring
      niet dan nadat vier weken zijn verstreken nadat zijn voornemen daartoe aan de beide kamers der Staten-Generaal is
      voorgelegd. Het besluit omtrent goedkeuring wordt binnen 17 weken na de verzending ter goedkeuring bekendgemaakt
      aan het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2a
  - number: 5a.2a.4
    text: Het accreditatiekader of de wijziging daarvan wordt bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.2a
  - number: 5a.3.1
    text: |-
      Voordat Onze minister een voordracht doet voor bestuursleden als bedoeld in artikel 5 van het Accreditatieverdrag,
      worden de gezamenlijke instellingen, bedoeld in artikel 1.2, onderdelen a en b, en de daarvoor in aanmerking
      komende vakorganisaties van overheids- en onderwijspersoneel gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.3
  - number: 5a.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het horen van de gezamenlijke studentenorganisaties, bedoeld in
      artikel 3.3, in verband met de voordracht van twee bestuursleden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.3
  - number: 5a.3.3
    text: De bestuursleden die door Onze minister worden voorgedragen zijn geen aan Onze minister ondergeschikte ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.3
  - number: 5a.3.4
    text: |-
      Voordat het Comité van Ministers, bedoeld in het Accreditatieverdrag, een door Onze minister voorgedragen
      bestuurslid schorst of ontslaat, worden de instellingen en vakorganisaties, bedoeld in het eerste lid, door Onze
      minister gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.3
  - number: 5a.6b.1
    text: |-
      Onze minister stelt jaarlijks aan het accreditatieorgaan ten laste van de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap overeenkomstig de artikelen 14 en 15, derde lid, van het Accreditatieverdrag
      financiële middelen ter beschikking voor de vervulling van zijn taken, voortvloeiend uit artikel 1, eerste en
      tweede lid, van het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.6b
  - number: 5a.6b.2
    text: |-
      Onze minister stelt jaarlijks voor 1 september van enig kalenderjaar, doch niet dan nadat hij daarover met
      het accreditatieorgaan heeft overlegd, het bedrag vast dat voor het daaropvolgende kalenderjaar aan het
      accreditatieorgaan ter beschikking zal worden gesteld en neemt dit bedrag op in het voorstel van wet tot
      vaststelling van de begroting van het Ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.6b
  - number: 5a.6b.3
    text: Het boekjaar van het accreditatieorgaan valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.6b
  - number: 5a.6b.4
    text: |-
      Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste en tweede lid, niet in werking is getreden,
      verstrekt Onze minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, in de vorm van
      maandelijkse termijnen een voorschot aan het accreditatieorgaan tot een maximum van het bedrag, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.6b
  - number: 5a.8.1
    text: |-
      In het accreditatiekader, bedoeld in [artikel 5a.2a][ref1], worden voor het verlenen van accreditatie op grond van
      dit artikel door het accreditatieorgaan vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.8.1.a
    text: de gegevens die het instellingsbestuur meezendt bij een aanvraag om accreditatie,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.1.b
    text: de wijze waarop de onafhankelijkheid van de beoordeling wordt gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.1.c
    text: |-
      de procedure voor het instemmen met een commissie van deskundigen, bedoeld in [artikel 5a.2, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.8.1.d
    text: |-
      de voorwaarden voor het verlenen van de oordelen onvoldoende, voldoende, goed en excellent aan de onderdelen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2
    text: |-
      Bij de beoordeling van de aanvraag om accreditatie wordt aandacht geschonken aan de aspecten van kwaliteit die
      betrekking hebben op de opleiding, waarbij ten minste worden beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.a
    text: het beoogde eindniveau van de opleiding, gelet op hetgeen internationaal gewenst en gangbaar is,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.b
    text: de inhoud en opzet van het onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.c
    text: het gerealiseerde eindniveau, gelet op hetgeen internationaal gewenst en gangbaar is,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.d
    text: de deugdelijkheid van beoordeling, toetsing en examinering van de studenten,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.e
    text: |-
      de kwaliteit en kwantiteit van het ingezette personeel alsmede het personeelsbeleid dat van invloed is op de
      kwaliteit van de opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.f
    text: |-
      de opleidingsspecifieke voorzieningen alsmede de instellingsbrede voorzieningen die van invloed zijn op
      de kwaliteit van de opleiding daaronder mede begrepen voldoende studiebegeleiding en voorzieningen die de
      toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.2.g
    text: de opzet en organisatie van de interne kwaliteitszorg gericht op de systematische verbetering van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.8.3
    text: |-
      De beoordeling van de aanvraag om accreditatie verricht het accreditatieorgaan gezamenlijk en in dezelfde periode
      voor alle opleidingen die tot een visitatiegroep behoren en waarvoor de termijn van een verleende accreditatie
      binnen één jaar verstrijkt of waarvoor een besluit toets nieuwe opleiding binnen één jaar vervalt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.8
  - number: 5a.9.1
    text: Accreditatie wordt verleend op aanvraag van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.2
    text: |-
      Een aanvraag om accreditatie wordt voor een door het accreditatieorgaan te bepalen datum bij het accreditatieorgaan
      ingediend. De datum kan per visitatiegroep verschillen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.3
    text: |-
      Het besluit tot het verlenen van accreditatie wordt gebaseerd op de beoordeling, bedoeld in
      [artikel 1.18, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.9.4
    text: |-
      Het accreditatieorgaan neemt binnen drie maanden na de uiterste aanvraagdatum een besluit op de aanvraag. Het
      besluit treedt in werking met ingang van de dag waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.5
    text: |-
      Het accreditatieorgaan verleent geen accreditatie indien een van de criteria, bedoeld in
      [artikel 5a.8, tweede lid, onder c en d][ref1], door hem als onvoldoende is beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.9.6
    text: |-
      Indien het accreditatieorgaan besluit dat geen accreditatie wordt verleend omdat bij de beoordeling, bedoeld
      in [artikel 1.18, derde lid][ref1], door de onafhankelijke deskundigen artikel 1.18, derde lid, vierde volzin,
      niet in acht is genomen, treedt, in afwijking van het vierde lid, dat besluit in werking met ingang van de dag
      van bekendmaking daarvan en kan binnen een jaar na die bekendmaking, een nieuwe aanvraag om accreditatie worden
      ingediend. In afwijking van het zevende lid, is de periode van de accreditatie alsdan verlengd tot het moment dat,
      onder de voorwaarden van het achtste lid, op de aanvraag om accreditatie is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.9.7
    text: Het besluit tot het verlenen van accreditatie vervalt zes jaar na de dag van inwerkingtreding van het besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.8
    text: |-
      Indien een instellingsbestuur voor de datum, bedoeld in het tweede lid, een aanvraag om accreditatie heeft
      ingediend, is, in afwijking van het zevende lid, de periode van de accreditatie verlengd tot het moment dat op de
      aanvraag om accreditatie is beslist indien het accreditatieorgaan niet voor afloop van de periode, bedoeld in het
      zevende lid, een besluit heeft genomen. In dat geval wordt de periode van de accreditatie verlengd tot aan het
      einde van het studiejaar of, indien nodig, tot aan het einde van het daaropvolgende studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.9
    text: |-
      De instelling is het accreditatieorgaan een vergoeding verschuldigd van de kosten van de aanvraag om accreditatie
      en visitatie overeenkomstig een door Onze minister, na overleg met het accreditatieorgaan, vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.9.10
    text: |-
      In afwijking van het zevende lid kan Onze Minister de termijn van accreditatie verlengen met maximaal twee jaar ten
      behoeve van de gelijktijdige beoordeling van de visitatiegroep.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.9
  - number: 5a.10.1
    text: 'Het accreditatieorgaan legt zijn oordeel vast in een accreditatierapport dat bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.1.a
    text: het besluit op de aanvraag om accreditatie,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.1.b
    text: |-
      de bevindingen naar aanleiding van de beoordeling van de opleiding, bedoeld in [artikel 5a.9, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.10.1.c
    text: een eindoordeel onvoldoende, voldoende, goed of excellent voor de opleiding, en in voorkomende gevallen
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.1.d
    text: de bijzondere kenmerken van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.2
    text: |-
      Het accreditatierapport is een besluit in de zin van de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 5a.10.3
    text: |-
      Alvorens het accreditatierapport vast te stellen stelt het accreditatieorgaan het instellingsbestuur in de
      gelegenheid binnen een door het accreditatieorgaan te bepalen termijn zijn zienswijze over het voorgenomen
      accreditatierapport naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.4
    text: |-
      Het accreditatieorgaan zendt het accreditatierapport na vaststelling onverwijld aan het instellingsbestuur en maakt
      het rapport tegelijkertijd openbaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10.5
    text: |-
      Het accreditatieorgaan verstrekt een afschrift van het accreditatierapport op verzoek. Het accreditatieorgaan
      vraagt een vergoeding van de kosten voor de afgifte van een afschrift van het accreditatierapport overeenkomstig
      een door Onze minister, na overleg met het accreditatieorgaan, vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10
  - number: 5a.10a.1
    text: |-
      In het accreditatiekader, bedoeld in [artikel 5a.2a][ref1], worden voor het verlenen van de toets nieuwe opleiding
      op grond van dit artikel door het accreditatieorgaan vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.10a.1.a
    text: de gegevens die het instellingsbestuur meezendt bij een aanvraag om een toets nieuwe opleiding, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.1.b
    text: |-
      voor zover een toets nieuwe opleiding onder voorwaarden als bedoeld in [artikel 5a.11, vierde lid][ref1], is
      verleend, de procedure en voorwaarden voor de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.10a.2
    text: |-
      Bij de beoordeling van de aanvraag om een toets nieuwe opleiding wordt aandacht geschonken aan de aspecten van
      kwaliteit die betrekking hebben op de voorgenomen opleiding waarbij ten minste worden beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.a
    text: het beoogde eindniveau van de opleiding, gelet op hetgeen internationaal gewenst en gangbaar is,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.b
    text: de inhoud en opzet van het onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.c
    text: de wijze van beoordeling, toetsing en examinering van de studenten,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.d
    text: |-
      de kwaliteit en kwantiteit van het ingezette personeel alsmede het personeelsbeleid dat van invloed is op de
      kwaliteit van de opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.e
    text: |-
      de opleidingsspecifieke voorzieningen alsmede de instellingsbrede voorzieningen die van invloed zijn op
      de kwaliteit van de opleiding daaronder mede begrepen voldoende studiebegeleiding en voorzieningen die de
      toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.2.f
    text: de opzet en organisatie van de interne kwaliteitszorg gericht op de systematische verbetering van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.3
    text: |-
      Indien de toets nieuwe opleiding is aangevraagd voor een opleiding waaraan op het moment van de aanvraag al
      feitelijk onderwijs wordt verzorgd, worden in plaats van de in het tweede lid onder a en c genoemde aspecten
      beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.3.a
    text: het gerealiseerde niveau, gelet op hetgeen internationaal gewenst en gangbaar is, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.3.b
    text: de deugdelijkheid van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.4
    text: |-
      Indien de toets nieuwe opleiding is aangevraagd voor een opleiding waaraan op het moment van de aanvraag nog geen
      feitelijk onderwijs wordt verzorgd en de opleiding wordt verzorgd door een instelling die niet beschikt over een
      instellingstoets kwaliteitszorg of een instellingstoets kwaliteitszorg onder voorwaarden, worden drie jaar nadat de
      toets nieuwe opleiding is verleend, de volgende aspecten van kwaliteit beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.4.a
    text: het gerealiseerde niveau, gelet op hetgeen internationaal gewenst en gangbaar is, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.4.b
    text: de deugdelijkheid van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
  - number: 5a.10a.5
    text: |-
      Onverminderd het tweede lid, legt het accreditatieorgaan zijn werkwijze vast voor de toets nieuwe opleiding
      van de eerste opleiding die wordt verzorgd door een rechtspersoon die geaccrediteerde opleidingen wil verzorgen
      overeenkomstig de kaders, bedoeld in [artikel 5a.8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.11.1
    text: |-
      De toets nieuwe opleiding wordt verleend op aanvraag van het instellingsbestuur. Een toets nieuwe
      opleiding is niet vereist in het geval sprake is van het ongedaan maken van een samenvoeging als bedoeld in
      [artikel 6.2, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.2
    text: |-
      Het accreditatieorgaan neemt binnen zes maanden na ontvangst van de aanvraag om de toets nieuwe opleiding een
      besluit. In dit besluit geeft het accreditatieorgaan aan welk onderdeel van het Centraal register opleidingen
      hoger onderwijs, bedoeld in [artikel 6.13][ref1], naar zijn oordeel voor de opleiding passend is en tot welke
      visitatiegroep de opleiding wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.3
    text: |-
      Het accreditatieorgaan besluit gedurende drie jaar geen toets nieuwe opleiding te verlenen, indien uit de gegevens
      van de desbetreffende aanvraag blijkt dat de instelling voornemens is een opleiding te verzorgen die geheel of
      in hoofdzaak overeenstemt met een opleiding, verzorgd door diezelfde instelling, waarvoor geen accreditatie is
      verleend of het besluit tot het verlenen van accreditatie is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.11.4
    text: |-
      Het accreditatieorgaan kan een toets nieuwe opleiding onder voorwaarden verlenen. Bij algemene maatregel van
      bestuur wordt bepaald in welke gevallen het accreditatieorgaan een toets nieuwe opleiding onder voorwaarden
      kan verlenen en welke voorwaarden hieraan gesteld kunnen worden. Indien binnen ten hoogste twee jaar naar het
      oordeel van het accreditatieorgaan niet aan de gestelde voorwaarden is voldaan, verliest de opleiding de toets
      nieuwe opleiding met ingang van de dag waarop het accreditatieorgaan dat oordeel in een besluit heeft vastgelegd.
      [Artikel 5a.12, vijfde lid][ref1], is van overeenkomstige toepassing. Onze minister legt het ontwerp van een
      algemene maatregel van bestuur als bedoeld in de tweede volzin voor aan de Tweede Kamer der Staten-Generaal. De
      voordracht voor die algemene maatregel van bestuur wordt niet gedaan dan nadat vier weken na die voorlegging zijn
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.11.5
    text: |-
      Met een besluit tot het verlenen van een toets nieuwe opleiding laat het instellingsbestuur die opleiding als
      nieuwe opleiding registreren in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.6
    text: 'Het besluit tot het verlenen van een toets nieuwe opleiding vervalt:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.11.6.a
    text: na zes jaar,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.11.6.b
    text: |-
      een jaar na de dag waarop het besluit tot het verlenen van een toets nieuwe opleiding is genomen, indien niet aan
      de voorwaarden, bedoeld in het vierde lid, is voldaan,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.11.6.c
    text: |-
      na tien maanden, indien het instellingsbestuur de bekostigde opleiding niet binnen deze termijn heeft laten
      registreren in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.6.d
    text: |-
      na zes maanden, indien het instellingsbestuur een opleiding, niet zijnde een opleiding onder c, niet binnen
      deze termijn heeft laten registreren in het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.7
    text: |-
      De toets nieuwe opleiding vervalt eveneens als de beoordeling, bedoeld in [artikel 5a.10a, vierde lid][ref1], van
      een of beide aspecten in dat lid genoemd onder a en b, onvoldoende is, tenzij het accreditatieorgaan besluit een
      herstelperiode toe te kennen als bedoeld in [artikel 5a.12a][ref2]. De herstelperiode bedraagt in dat geval ten
      hoogste een jaar. Artikel 5a.12a is voor het overige van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.11.8
    text: |-
      De [artikelen 5a.9, negende lid][ref1] en [5a.10][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.11.9
    text: |-
      Indien een toets nieuwe opleiding wordt aangevraagd voor een masteropleiding in het hoger beroepsonderwijs die de
      voortzetting vormt van een postinitiële masteropleiding in het hoger beroepsonderwijs, waarvoor accreditatie is
      verleend, verleent het accreditatieorgaan de toets nieuwe opleiding zonder nader onderzoek voor dezelfde termijn
      als gold voor de accreditatie.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.11.10
    text: |-
      Onze Minister kan de termijn van het besluit toets nieuwe opleidingen met maximaal twee jaar verlengen in verband
      met de gelijktijdige beoordeling van de visitatiegroep.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.11
  - number: 5a.12.1
    text: |-
      Indien de accreditatie van een opleiding na het verstrijken van de periode, bedoeld in
      [artikel 5a.9, zesde en zevende lid][ref1], of [artikel 5a.12a, eerste lid][ref2], niet opnieuw wordt verleend,
      draagt de instelling er zorg voor dat aan studenten die voor de opleiding zijn ingeschreven, de gelegenheid wordt
      geboden deze opleiding te voltooien aan een andere instelling. Voor de studenten voor wie dat niet mogelijk is,
      wordt de opleiding aan de instelling voortgezet. Het instellingsbestuur maakt de inhoud van het besluit waarbij
      de accreditatie niet opnieuw wordt verleend, binnen zes weken bekend. Daarbij maakt het instellingsbestuur tevens
      bekend:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12.1.a
    text: aan welke andere instelling studenten die opleiding kunnen voltooien,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
  - number: 5a.12.1.b
    text: |-
      de termijn gedurende welke de opleiding wordt voortgezet ten behoeve van de studenten, bedoeld in de tweede volzin,
      met dien verstande dat zij die opleiding zonder onderbreking blijven volgen en die termijn ten hoogste de voor
      die studenten resterende aan de studielast van de opleiding of van het gevolgde Ad-programma gerelateerde duur
      vermeerderd met één jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
  - number: 5a.12.2
    text: |-
      Het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde en zevende lid][ref1], of
      [artikel 5a.12a, eerste lid][ref2], heeft ten aanzien van een bekostigde instelling tot gevolg dat na het
      verstrijken van de door de instelling vastgestelde termijn, genoemd in het eerste lid, geen aanspraak bestaat
      op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref3], dat aan de examens geen graad als bedoeld in
      [artikel 7.10a][ref4] is verbonden en dat de registratie in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13][ref5], wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12.3
    text: |-
      Het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde en zevende lid][ref1], heeft ten aanzien van een
      rechtspersoon voor hoger onderwijs tot gevolg dat na het verstrijken van de door de rechtspersoon vastgestelde
      termijn, genoemd in het eerste lid, aan de examens geen graad als bedoeld in [artikel 7.10a][ref2] is verbonden
      en dat de registratie in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref3], wordt
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12.4
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter hoogte van 500 euro voor iedere dag dat het
      instellingsbestuur de termijn van zes weken, genoemd in het eerste lid, derde volzin, overschrijdt. Daarbij geldt
      een maximum van 50.000 euro.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
  - number: 5a.12.5
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing ten aanzien van een opleiding die op grond
      van [artikel 5a.11, vijfde lid][ref1], als nieuwe opleiding is opgenomen in het Centraal register opleidingen hoger
      onderwijs en aansluitend geen accreditatie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid en indien het belang van het instandhouden van een
      doelmatig onderwijsaanbod dit vordert, kan Onze minister na het verstrijken van de periode, bedoeld in
      [artikel 5a.9, zesde en zevende lid][ref1], besluiten dat een bekostigde instelling gedurende een door Onze
      minister vast te stellen termijn aanspraak behoudt op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref2],
      dat aan de examens een graad als bedoeld in [artikel 7.10a][ref3] blijft verbonden en dat de registratie in het
      Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref4], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12a.1
    text: |-
      Indien het accreditatieorgaan vaststelt dat de opleiding niet voldoet aan de aspecten van kwaliteit, bedoeld
      [artikel 5a.8, tweede lid][ref1], kan het eenmaal de geldigheidsduur van het laatstgenomen accreditatiebesluit
      of het besluit waaruit blijkt dat de toets nieuwe opleiding met positief gevolg is ondergaan, verlengen met een
      periode van ten hoogste twee jaar. Daartoe besluit het accreditatieorgaan indien sprake is van een van de bij
      algemene maatregel van bestuur te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12a.2
    text: |-
      Het accreditatieorgaan maakt in het besluit tot verlenging van de geldigheidsduur melding van de te verbeteren
      aspecten van kwaliteit. Tevens kan het daarin voorwaarden opnemen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12a
  - number: 5a.12a.3
    text: |-
      [Artikel 5a.9, achtste en negende lid][ref1], is van overeenkomstige toepassing op het besluit tot verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12a.4
    text: |-
      In afwijking van [artikel 5a.9, tweede lid][ref1], dient het instellingsbestuur bij het accreditatieorgaan een
      aanvraag om een besluit tot vaststelling dat de opleiding alsnog aan het accreditatiekader voldoet, in ten minste
      een half jaar voor afloop van de geldigheidsduur van het besluit tot verlenging van accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12a.5
    text: |-
      Het besluit van het accreditatieorgaan, bedoeld in het vierde lid, geldt met ingang van het moment waarop het
      accreditatieorgaan de vaststelling, bedoeld in het eerste lid, heeft gedaan. Op het vaststellingsbesluit is
      [artikel 5a.9, zevende en achtste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12b.1
    text: |-
      Onze minister kan, na advies van het accreditatieorgaan, een besluit tot het verlenen van accreditatie of
      toets nieuwe opleiding intrekken, indien de beoordeling van de aspecten van kwaliteit van de opleiding,
      bedoeld in [artikel 5a.8, tweede lid][ref1], [5a.10a, tweede lid][ref2], [5a.13f, eerste lid][ref3],
      of [5a.13g, eerste lid][ref4], zodanig is gewijzigd dat deze beoordeling van die aspecten tot een afwijzing van de
      aanvraag om accreditatie of toets nieuwe opleiding zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12b.2
    text: Alvorens een besluit als bedoeld in het eerste lid te nemen, hoort Onze minister het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12b
  - number: 5a.12b.3
    text: |-
      Na intrekking van het besluit tot het verlenen van accreditatie of toets nieuwe opleiding is
      [artikel 5a.12, eerste tot en met vijfde lid][ref1], op de opleiding van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.12b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13.1
    text: |-
      De toets nieuw Ad-programma wordt verleend op aanvraag van het instellingsbestuur. Het instellingsbestuur vermeldt
      daarbij de opleiding waarbinnen het programma zal worden uitgevoerd. Een aanvraag kan niet worden ingediend indien
      en voor zolang ten aanzien van die opleiding [artikel 5a.12a][ref1] is toegepast onderscheidenlijk van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13.2
    text: |-
      Het accreditatieorgaan neemt binnen zes maanden na ontvangst van de aanvraag een besluit. In dit besluit geeft
      het accreditatieorgaan aan welk onderdeel van het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref1], naar zijn oordeel voor de opleiding passend is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.13.3
    text: |-
      Het besluit tot het verlenen van een toets nieuw Ad-programma vervalt indien het instellingsbestuur het Ad-
      programma niet binnen tien maanden heeft laten registreren in het in het tweede lid bedoelde register als het Ad-
      programma binnen een bekostigde opleiding zal worden verzorgd en indien het instellingsbestuur het Ad-programma
      niet binnen zes maanden in dat register heeft laten registreren als het Ad-programma binnen een niet-bekostigde
      opleiding zal worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13
  - number: 5a.13.4
    text: |-
      Het besluit waaruit blijkt dat de toets nieuw Ad-programma met positief gevolg is ondergaan, vervalt eveneens
      op het moment dat de geldigheid van het laatst genomen accreditatiebesluit of het besluit toets nieuwe opleiding
      vervalt met betrekking tot de bacheloropleiding waarvan het Ad-programma onderdeel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13
  - number: 5a.13.5
    text: |-
      De [artikelen 5a.9, negende lid][ref1], [5a.10][ref2], [5a.11, vierde lid][ref3], en [5a.12b][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13a
    text: Het bestuur van een instelling voor hoger onderwijs kan een instellingstoets kwaliteitszorg aanvragen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13a
  - number: 5a.13b.1
    text: |-
      In het accreditatiekader, bedoeld in [artikel 5a.2a][ref1], worden voor het verlenen van de instellingstoets
      kwaliteitszorg door het accreditatieorgaan vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13b.1.a
    text: de gegevens die het instellingsbestuur meezendt bij een aanvraag om instellingstoets kwaliteitszorg, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.1.b
    text: de wijze waarop de onafhankelijkheid van de beoordeling wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.2
    text: |-
      Bij de beoordeling van de aanvraag om een instellingstoets kwaliteitszorg worden voor zover die betrekking hebben
      op de kwaliteit van haar opleidingen beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.2.a
    text: de visie op de kwaliteit van haar onderwijs,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.2.b
    text: de vormgeving en de effectiviteit van de interne kwaliteitszorg van een instelling,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.2.c
    text: het gevoerde beleid op het gebied van personeel en voorzieningen,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13b.2.d
    text: de voorzieningen die de toegankelijkheid en studeerbaarheid voor studenten met een functiebeperking bevorderen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13b
  - number: 5a.13c.1
    text: |-
      Het besluit tot het verlenen van een instellingstoets kwaliteitszorg vervalt zes jaar na de dag van
      inwerkingtreding van het besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13c
  - number: 5a.13c.2
    text: |-
      Een aanvraag om verlenging van het besluit tot het verlenen van een instellingstoets kwaliteitszorg wordt ten
      minste een jaar voor de vervaldatum van het besluit tot het verlenen van de vorige instellingstoets kwaliteitszorg
      bij het accreditatieorgaan ingediend.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13c
  - number: 5a.13c.3
    text: |-
      Indien een instellingsbestuur overeenkomstig de termijn, bedoeld in het tweede lid, een aanvraag om een
      instellingstoets kwaliteitszorg heeft ingediend, wordt, in afwijking van het eerste lid, de periode van
      het geldende besluit tot het verlenen van een instellingstoets kwaliteitszorg verlengd tot het moment dat
      onherroepelijk op de aanvraag is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13c
  - number: 5a.13c.4
    text: |-
      [Artikel 5a.9, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13d.1
    text: |-
      Het accreditatieorgaan neemt binnen zes maanden na ontvangst van de aanvraag om een instellingstoets kwaliteitszorg
      een besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
  - number: 5a.13d.2
    text: |-
      Het besluit tot het verlenen van een instellingstoets kwaliteitszorg treedt in werking met ingang van de dag waarop
      het vorige besluit tot het verlenen van een instellingstoets kwaliteitszorg vervalt, of indien een instelling voor
      de eerste maal een instellingstoets kwaliteitszorg wordt verleend, met ingang van de dag van bekendmaking van het
      besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
  - number: 5a.13d.3
    text: |-
      Het besluit tot het verlenen van een instellingstoets kwaliteitszorg wordt gebaseerd op de beoordeling, bedoeld in
      [artikel 1.18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.13d.4
    text: |-
      Het accreditatieorgaan legt zijn oordeel vast in een rapport dat in ieder geval het besluit op de aanvraag om
      een instellingstoets kwaliteitszorg bevat. Het [tweede tot en met het vijfde lid van artikel 5a.10][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13d.5
    text: |-
      Indien het accreditatieorgaan besluit geen instellingstoets kwaliteitszorg te verlenen, kan een instellingsbestuur
      gedurende drie jaar vanaf de datum van het besluit geen instellingstoets kwaliteitszorg aanvragen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
  - number: 5a.13d.6
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen het accreditatieorgaan aan het besluit tot
      het verlenen van een instellingstoets kwaliteitszorg voorwaarden kan verbinden en welke voorwaarden hierbij
      kunnen worden gesteld. Indien naar het oordeel van het accreditatieorgaan binnen twee jaar niet aan de gestelde
      voorwaarden is voldaan, verliest de instelling twee jaar na de dag waarop het besluit tot verlenen van de
      instellingstoets kwaliteitszorg is genomen de instellingstoets kwaliteitszorg. Onze minister legt het ontwerp van
      een algemene maatregel van bestuur als bedoeld in de eerste volzin voor aan de Tweede Kamer der Staten-Generaal.
      De voordracht voor die algemene maatregel van bestuur wordt niet gedaan dan nadat vier weken na die voorlegging
      zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13d
  - number: 5a.13e.1
    text: |-
      Indien een instellingsbestuur beschikt over een besluit tot het verlenen van een instellingstoets kwaliteitszorg
      worden de opleidingen van de instelling bij accreditatie beoordeeld op grond van [artikel 5a.13f][ref1] en bij de
      toets nieuwe opleiding op grond van [artikel 5a.13g][ref2], tenzij het instellingsbestuur het accreditatieorgaan
      verzoekt een aanvraag om accreditatie of toets nieuwe opleiding te beoordelen op grond van [titel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '2'
  - number: 5a.13e.2
    text: |-
      [Artikel 5a.12b, eerste en tweede lid][ref1], is van overeenkomstige toepassing met dien verstande dat de
      beoordeling betrekking heeft op de aspecten van kwaliteit, bedoeld in [artikel 5a.13b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13e.3
    text: |-
      Indien een instelling niet langer beschikt over een instellingstoets kwaliteitszorg worden de opleidingen van de
      instelling bij accreditatie of toets nieuwe opleiding beoordeeld op grond van [titel 2][ref1] van dit hoofdstuk met
      uitzondering van de opleidingen waarvoor een volledige aanvraag bij het accreditatieorgaan is ingediend voor de dag
      dat op de aanvraag om een instellingstoets kwaliteitszorg is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '2'
  - number: 5a.13e.4
    text: |-
      Indien bij het verlenen van de instellingstoets kwaliteitszorg voorwaarden zijn gesteld op grond van de algemene
      maatregel van bestuur, bedoeld in [artikel 5a.13d, zesde lid][ref1], heeft een besluit tot het verlenen van
      accreditatie op grond van [artikel 5a.13f][ref2] onderscheidenlijk de toets nieuwe opleiding op grond van
      [artikel 5a.13g][ref3] op een volledige aanvraag die bij het accreditatieorgaan is ingediend gedurende het jaar
      waarin aan de voorwaarden moet worden voldaan, een geldigheidsduur van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13e.5
    text: |-
      Indien een instelling op grond van het bepaalde in de tweede volzin van [artikel 5a.13d, zesde lid][ref1],
      de instellingstoets kwaliteitszorg verliest, wordt de geldigheidsduur van een besluit als bedoeld in het
      vierde lid verlengd tot een jaar na de datum waarop het accreditatieorgaan het oordeel heeft bekendgemaakt
      dat niet aan de gestelde voorwaarden is voldaan. Het instellingsbestuur is verplicht binnen zes maanden na
      de datum waarop het accreditatieorgaan het oordeel, bedoeld in de vorige volzin, heeft bekendgemaakt een
      aanvraag om toetsing van de aspecten van [artikel 5a.8, tweede lid, onderdelen e tot en met g][ref2], of
      [artikel 5a.10a, tweede lid, onderdelen d tot en met f][ref3], bij het accreditatieorgaan in te dienen voor de
      aanvragen tot het verlenen van accreditatie of een toets nieuwe opleiding die zijn gedaan gedurende het jaar waarin
      de voorwaarden voor de instellingstoets kwaliteitszorg golden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13e.6
    text: |-
      Het accreditatieorgaan besluit binnen drie maanden op een aanvraag, bedoeld in het vijfde lid. Bij
      een positief besluit van het accreditatieorgaan op de aanvraag wordt de duur van de accreditatie of
      toets nieuwe opleiding verlengd tot zes jaar. Bij een negatief besluit van het accreditatieorgaan zijn
      [artikel 5a.12, eerste tot en met vijfde lid][ref1], en [artikel 5a.12a][ref2] van overeenkomstige toepassing.
      Indien het accreditatieorgaan niet binnen een jaar na de datum, waarop aan het instellingsbestuur het oordeel
      is bekendgemaakt dat niet aan de gestelde voorwaarden is voldaan, op de aanvraag heeft besloten, wordt de
      geldigheidsduur van een besluit als bedoeld in het vierde lid verlengd tot aan het einde van het studiejaar of,
      indien nodig tot aan het einde van het daarop volgende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13e.7
    text: |-
      Indien de instelling naar het oordeel van het accreditatieorgaan binnen twee jaar heeft voldaan aan de voorwaarden,
      gesteld bij het verlenen van de instellingstoets kwaliteitszorg, wordt de geldigheidsduur van een besluit, bedoeld
      in het vierde lid, verlengd tot zes jaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13e
  - number: 5a.13f.1
    text: |-
      Bij de beoordeling van de aanvraag om accreditatie voor een opleiding van een instellingsbestuur dat beschikt over
      een instellingstoets kwaliteitszorg wordt aandacht geschonken aan de aspecten van kwaliteit die betrekking hebben
      op het niveau van de opleiding waarbij ten minste worden beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
  - number: 5a.13f.1.a
    text: het beoogde eindniveau, gelet op hetgeen internationaal gewenst of gangbaar is,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
  - number: 5a.13f.1.b
    text: |-
      de inhoud en opzet van het onderwijsprogramma, de kwaliteit en kwantiteit van het ingezette personeel en de
      opleidingsspecifieke voorzieningen,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
  - number: 5a.13f.1.c
    text: het gerealiseerde eindniveau, gelet op hetgeen internationaal gewenst en gangbaar is, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
  - number: 5a.13f.1.d
    text: de deugdelijkheid van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
  - number: 5a.13f.2
    text: |-
      De artikelen [5a.8, tweede lid][ref1], [5a.9][ref2], [5a.10][ref3], [5a.12][ref4] en [5a.12a][ref5] zijn van
      overeenkomstige toepassing met dien verstande dat met de criteria worden bedoeld de criteria op grond van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.13g.1
    text: |-
      Bij de beoordeling van de aanvraag om een toets nieuwe opleiding voor een voorgenomen opleiding van een
      instellingsbestuur dat beschikt over een instellingstoets kwaliteitszorg wordt aandacht geschonken aan de volgende
      aspecten van kwaliteit die betrekking hebben op het niveau van de voorgenomen opleiding waarbij ten minste worden
      beoordeeld:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13g
  - number: 5a.13g.1.a
    text: het beoogde eindniveau, gelet op hetgeen internationaal gewenst of gangbaar is,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13g
  - number: 5a.13g.1.b
    text: |-
      de inhoud en opzet van het onderwijsprogramma, de kwaliteit en kwantiteit van het in te zetten personeel en de
      opleidingsspecifieke voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13g
  - number: 5a.13g.1.c
    text: de wijze van beoordeling, toetsing en examinering van de studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13g
  - number: 5a.13g.2
    text: |-
      De artikelen [5a.10a, tweede lid][ref1], [5a.11][ref2] en [5a.12, vijfde lid][ref3], zijn van overeenkomstige
      toepassing met dien verstande dat met de criteria worden bedoeld de criteria op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.13g
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.15
    text: |-
      Onze minister kan bij toepassing van de bevoegdheid, bedoeld in
      [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], bepalen dat een instelling
      gedurende een door Onze minister te bepalen termijn aanspraak behoudt op bekostiging als bedoeld in
      [artikel 1.9, eerste lid][ref2], dat aan de examens een graad blijft verbonden en dat de registratie in het
      Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref3], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel5a.15
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.1
    text: |-
      De [titels 1][ref1] en [3][ref2] van dit hoofdstuk hebben betrekking op bekostigde universiteiten en
      hogescholen, op de Open Universiteit en op de levensbeschouwelijke universiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 6.1.2
    text: |-
      [Titel 2][ref1] heeft uitsluitend en [titel 3][ref2] heeft tevens betrekking op rechtspersonen voor hoger
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 6.2.1
    text: 'Het instellingsbestuur legt het voornemen tot:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.1.a
    text: het verzorgen van een nieuwe opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.1.b
    text: het samenvoegen van bestaande opleidingen,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.1.c
    text: |-
      het verzorgen van een Ad-programma binnen een bacheloropleiding als bedoeld in
      [artikel 7.3a, tweede lid, onder a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.1.d
    text: |-
      het verzorgen van een masteropleiding in het hoger beroepsonderwijs als bedoeld in
      [artikel 7.3a, tweede lid, onder b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.2
    text: |-
      Onze minister kan zich bij de beoordeling van het voornemen, bedoeld in het eerste lid, laten bijstaan door een
      adviescommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Met inachtneming van de aanvraag kan Onze minister zijn instemming voor het verzorgen van een nieuwe opleiding
      beperken tot het verzorgen van een voltijdse, deeltijdse of duale opleiding. Onze minister kan zijn instemming ook
      onder andere beperkingen verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.4
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de aanvraag om instemming.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.5
    text: |-
      Indien sprake is van het samenvoegen van bestaande opleidingen kan Onze minister bij het verlenen van de instemming
      desgevraagd bepalen dat het instellingsbestuur uiterlijk bij de aanvang van het zesde studiejaar nadat de
      samenvoeging heeft plaatsgevonden deze ongedaan kan maken zonder dat daarvoor instemming als bedoeld in het eerste
      lid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.6
    text: |-
      Ingeval van een nieuwe opleiding in een van de openbare lichamen BES wordt bij de beoordeling gelet op de
      voorzieningen op het gebied van hoger onderwijs in Nederland en Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.2.7
    text: |-
      De instemming van Onze minister vervalt, indien de opleiding onderscheidenlijk het Ad-programma niet binnen tien
      maanden nadat de instemming is verleend, is geregistreerd in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.8
    text: |-
      Onze minister stelt beleidsregels vast op grond waarvan hij de aanvragen beoordeelt. Wijzigingen van de
      beleidsregels worden meegedeeld aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.2
  - number: 6.5.1
    text: |-
      Onze minister kan besluiten dat aan een opleiding onderscheidenlijk een Ad-programma de rechten, genoemd in
      [artikel 1.9, eerste en tweede lid][ref1], worden ontnomen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 6.5.1.a
    text: |-
      de verzorging van die opleiding onderscheidenlijk het Ad-programma, gelet op de spreiding en de mate van
      verscheidenheid van de voorzieningen in het hoger onderwijs, en het profiel van de instelling die de desbetreffende
      opleiding onderscheidenlijk het Ad-programma verzorgt, in redelijkheid niet of niet meer doelmatig kan worden
      geacht, of
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.5
  - number: 6.5.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald over de kwaliteitszorg, de
      registratie, het onderwijs, de examens, de promoties of de vooropleidingseisen of toelatingseisen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.5
  - number: 6.5.2
    text: |-
      Bij een besluit als bedoeld in het eerste lid bepaalt Onze minister het tijdstip waarop dat besluit van kracht
      wordt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.5
  - number: 6.5.3
    text: |-
      [Artikel 5a.12, eerste lid][ref1], is van overeenkomstige toepassing op de opleiding, onderscheidenlijk het Ad-
      programma, waaraan de rechten, genoemd in [artikel 1.9, eerste en tweede lid][ref2], zijn ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 6.6.1
    text: |-
      Onze minister neemt een besluit op grond van [artikel 6.5, eerste lid, onderdeel a][ref1], uiterlijk acht weken
      na de datum waarop hij het voornemen tot het ontnemen van rechten aan de Tweede Kamer der Staten-Generaal bekend
      heeft gemaakt. Hij zendt gelijktijdig een afschrift van deze bekendmaking aan de instelling die het aangaat. Onze
      minister stelt ten minste drie maanden voordat hij het voornemen aan de Tweede Kamer bekendmaakt, de instelling van
      zijn voornemen tot ontneming van rechten op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2
    text: |-
      Voordat Onze minister een besluit neemt op de grond, genoemd in [artikel 6.5, eerste lid, onderdeel b][ref1], geeft
      hij het instellingsbestuur een waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg
      moet zijn gegeven en desgewenst overleg met hem plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg
      moet zijn gegeven, bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7.1
    text: |-
      Onze minister kan op aanvraag van het instellingsbestuur toestemming verlenen gegadigden bij de inschrijving
      voor een opleiding te selecteren volgens door het instellingsbestuur vast te stellen criteria en in samenhang
      daarmee voor de geselecteerde studenten een collegegeld vast te stellen dat hoger is dan het volledige wettelijke
      collegegeld dat op grond van [artikel 7.45, vijfde lid][ref1], bij algemene maatregel van bestuur is vastgesteld en
      op de wijze daarin bepaald is geïndexeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.7.2
    text: |-
      De toestemming van Onze minister heeft betrekking op een bepaalde opleiding of op een bepaald programma binnen een
      opleiding waarvan de studielast en eindtermen gelijk zijn aan die van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
  - number: 6.7.3
    text: 'Onze minister verleent uitsluitend zijn toestemming, indien:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
  - number: 6.7.3.a
    text: |-
      de aanvraag kleinschalig en intensief onderwijs betreft, dat is gericht op een bovengemiddeld onderwijsrendement en
      waarbij de activiteiten binnen en buiten het curriculum met elkaar zijn verbonden; en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
  - number: 6.7.3.b
    text: de toestemming geen afbreuk doet aan de kwaliteit of de toegankelijkheid van het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
  - number: 6.7.4
    text: |-
      Het hogere collegegeld bedoeld in het eerste lid, bedraagt ten hoogste vijf maal het volledige wettelijk
      collegegeld dat op grond van [artikel 7.45, vijfde lid][ref1], bij algemene maatregel van bestuur is vastgesteld en
      op de wijze daarin bepaald is geïndexeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.7a.1
    text: |-
      Aan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], zijn de volgende verplichtingen voor het
      instellingsbestuur verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.1.a
    text: het selecteren van gegadigden;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
  - number: 6.7a.1.b
    text: het vaststellen van een regeling voor de selectiecriteria en -procedure;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
  - number: 6.7a.1.c
    text: |-
      het vaststellen van een regeling voor de criteria en procedure voor dispensatie van betaling van het hogere
      collegegeld; en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
  - number: 6.7a.1.d
    text: |-
      het meewerken aan een eenmalige toetsing aan de praktijk als bedoeld in [artikel 6.7c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.2
    text: |-
      Onze minister kan andere verplichtingen aan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7a.3
    text: |-
      Het instellingsbestuur selecteert de gegadigden uitsluitend op grond van kwalitatieve criteria. Het aantal soorten
      kwalitatieve selectiecriteria bedraagt ten minste twee.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7a
  - number: 6.7b.1
    text: |-
      Het instellingsbestuur dient een aanvraag als bedoeld in [artikel 6.7, eerste lid][ref1], in bij het
      accreditatieorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.2
    text: |-
      Na ontvangst van een aanvraag stelt het accreditatieorgaan ten behoeve van de beslissing van Onze minister, bedoeld
      in artikel 6.7, eerste lid, een advies op over:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
  - number: 6.7b.2.a
    text: |-
      het aspect, bedoeld in [artikel 6.7, derde lid, onder a][ref1], en;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.2.b
    text: |-
      de vraag, of de desbetreffende opleiding of het desbetreffende programma binnen een opleiding als bedoeld in
      [artikel 6.7, tweede lid][ref1], ondanks de kwalificatie door het instellingsbestuur, moet worden beschouwd als een
      nieuwe opleiding


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7b.3
    text: |-
      Het accreditatieorgaan zendt het advies, bedoeld in het tweede lid, vergezeld van de aanvraag, binnen zes maanden
      na indiening van de aanvraag aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
  - number: 6.7b.4
    text: |-
      Onze minister kan nadere regels stellen met betrekking tot het indienen van aanvragen en de daarbij over te leggen
      gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
  - number: 6.7b.5
    text: |-
      In het accreditatiekader, bedoeld in [artikel 5a.8, eerste lid][ref1], legt het accreditatieorgaan het advieskader
      en zijn werkwijze vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 6.7c.1
    text: |-
      Indien Onze minister aan het instellingsbestuur toestemming als bedoeld in [artikel 6.7, eerste lid][ref1], heeft
      verleend, laat het instellingsbestuur het aspect, bedoeld in artikel 6.7, derde lid, onder a, van de desbetreffende
      opleiding of het programma binnen de opleiding, bedoeld in artikel 6.7, tweede lid, door het accreditatieorgaan zes
      jaar na de verlening éénmalig toetsen aan de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7c.2
    text: |-
      Bij het verlenen van de toestemming, bedoeld in [artikel 6.7][ref1], kan Onze minister bepalen dat de toetsing aan
      de praktijk op een ander tijdstip dan het tijdstip, bedoeld in het eerste lid, plaatsvindt dan wel dat de toetsing
      achterwege kan blijven, omdat daarvan geen nieuwe inzichten zijn te verwachten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7c.3
    text: Het accreditatieorgaan zendt zijn bevindingen naar aanleiding van een toetsing aan de praktijk aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7c
  - number: 6.7c.4
    text: |-
      Onze minister kan nadere regels stellen met betrekking tot de toetsing aan de praktijk, bedoeld in het eerste tot
      en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.7c
  - number: 6.7d
    text: |-
      Onze minister kan de toestemming, bedoeld in [artikel 6.7, eerste lid][ref1], intrekken, indien:


