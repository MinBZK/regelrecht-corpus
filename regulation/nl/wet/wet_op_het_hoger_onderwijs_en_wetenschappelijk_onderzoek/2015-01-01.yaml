  - number: 15.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien het instellingsbestuur, het personeel van een instelling of
      het accreditatieorgaan in strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel15.1
    references:
