  - number: 1.9.3
    text: |-
      Voorwaarde voor het bepaalde in het eerste en tweede lid is dat de desbetreffende instelling in acht neemt hetgeen
      bij of krachtens deze wet is bepaald ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.9
