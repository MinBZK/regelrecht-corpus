  - number: '1.10'
    text: |-
      De bepalingen in deze wet die het openbaar hoger onderwijs regelen, gelden voor het bekostigde bijzonder hoger
      onderwijs als bekostigingsvoorwaarden, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.10
  - number: 1.12.1
    text: |-
      Aan de met goed gevolg afgelegde examens van initiële opleidingen en daarbinnen uitgevoerde Ad-programma’s,
      verzorgd door rechtspersonen voor hoger onderwijs, is een graad als bedoeld in [artikel 7.10a][ref1]
      onderscheidenlijk [artikel 7.10b][ref2] verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.12
