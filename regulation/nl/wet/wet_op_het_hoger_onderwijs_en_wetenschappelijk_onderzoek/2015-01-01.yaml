  - number: 9.15.1.j
    text: het vaststellen van de procedures en criteria met betrekking tot erkenning van verworven competenties.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.15
  - number: 9.15.2
    text: |-
      De decaan oefent het recht tot voordracht, bedoeld in [artikel 7.19, tweede lid][ref1], uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 9.15.3
    text: |-
      In het bestuurs- en beheersreglement worden regels gesteld omtrent de bevoegdheid, bedoeld in het eerste lid, onder
      i.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.15
  - number: '9.16'
    text: |-
      De decaan is verantwoording verschuldigd aan het college van bestuur. Hij verstrekt het college de gevraagde
      inlichtingen omtrent de faculteit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.16
  - number: 9.17.1
    text: |-
      De decaan voorziet in een meerhoofdig bestuur van elke opleiding die in de faculteit is ingesteld. In afwijking van
      de eerste volzin kan volstaan worden met een opleidingsdirecteur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.17
  - number: 9.17.2
    text: Indien in een meerhoofdig bestuur wordt voorzien, maakt daarvan een student deel uit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.17
  - number: 9.17.3
    text: In het faculteitsreglement worden nadere regels gesteld omtrent het bestuur van de opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.17
  - number: 9.17.4
    text: Een lid van het bestuur van de opleiding kan niet tevens lid zijn van de opleidingscommissie van die opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.17
  - number: 9.17.5
    text: |-
      Voor de toepassing van dit artikel kan onder opleiding mede worden begrepen een bacheloropleiding en een of meer
      daarop aansluitende masteropleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.17
  - number: 9.18.1
    text: 'Voor elke opleiding of groep van opleidingen wordt een opleidingscommissie ingesteld. De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
  - number: 9.18.1.a
    text: |-
      advies uit te brengen over de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 9.18.1.b
    text: het jaarlijks beoordelen van de wijze van uitvoeren van de onderwijs- en examenregeling, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
  - number: 9.18.1.c
    text: |-
      het desgevraagd of uit eigen beweging advies uitbrengen aan het bestuur van de opleiding, bedoeld in
      [artikel 9.17, eerste lid][ref1], en de decaan over alle aangelegenheden betreffende het onderwijs in de
      desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.18.2
    text: |-
      Op een advies als bedoeld in het eerste lid, is [artikel 9.35][ref1], aanhef en onderdelen *b* en *c*, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.18.3
    text: |-
      In het faculteitsreglement worden regels van procedurele aard met betrekking tot de toepassing van het eerste lid
      gesteld en wordt de wijze van benoeming en samenstelling van de opleidingscommissie geregeld, met dien verstande
      dat de helft van het totaal aantal leden van de commissie voortkomt uit de voor de desbetreffende opleiding
      ingeschreven studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
  - number: 9.18.4
    text: |-
      Indien een faculteit slechts een opleiding omvat, kan het faculteitsreglement bepalen dat de taken en bevoegdheden
      van de opleidingscommissie worden uitgeoefend door de faculteitsraad, bedoeld in [artikel 9.37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.19.1
    text: |-
      Tot het personeel van de universiteit behoren in elk geval de hoogleraren. In het benoemingsbesluit wordt vermeld
      het wetenschapsgebied waarop de hoogleraar zijn onderwijs- en onderzoektaken uitoefent.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.19
  - number: 9.19.2
    text: |-
      De hoogleraren zijn bij uitstek verantwoordelijk voor de ontwikkeling van het hun toegewezen wetenschapsgebied
      en voor de inhoud van het te geven onderwijs op dat gebied, onverminderd de bevoegdheid van het bestuur van de
      opleiding, bedoeld in [artikel 9.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.19.3
    text: Eervol ontslagen hoogleraren behouden nog gedurende vijf jaren na hun ontslag het recht als promotor op te treden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.19
  - number: 9.19.4
    text: |-
      De hoogleraren zijn gerechtigd de titel professor te voeren. De oud-hoogleraren aan wie om gezondheidsredenen,
      wegens vrijwillig vervroegd uittreden dan wel bij of na het bereiken van de voor de openbare dienst geldende
      functionele leeftijdsgrens eervol ontslag als hoogleraar is verleend, zijn eveneens gerechtigd deze titel te
      voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.19
  - number: 9.20.1
    text: |-
      In het faculteitsreglement kunnen binnen de faculteit onderzoekinstituten en onderzoekscholen worden ingesteld. De
      decaan regelt het bestuur en de inrichting van deze onderzoekinstituten en onderzoekscholen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.20
  - number: 9.20.2
    text: |-
      In het faculteitsreglement worden regels gesteld omtrent het bestuur en beheer van onderzoekinstituten en
      onderzoekscholen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.20
  - number: 9.21.1
    text: |-
      In het bestuurs- en beheersreglement kunnen binnen de universiteit onderzoekinstituten en onderzoekscholen worden
      ingesteld waarop [artikel 9.20][ref1] niet van toepassing is. Het college van bestuur regelt het bestuur, beheer en
      de inrichting van deze onderzoekinstituten en onderzoekscholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.21.2
    text: |-
      In het bestuurs- en beheersreglement kan een faculteit worden aangewezen waarvan de decaan de bevoegdheden
      uitoefent die bij of krachtens deze wet met betrekking tot een onderzoekinstituut of onderzoekschool aan het
      college van bestuur zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.21
  - number: 9.22.1
    text: |-
      In het faculteitsreglement kan worden bepaald dat het bestuur van een onderzoekinstituut of onderzoekschool als
      bedoeld in [artikel 9.20][ref1] gedurende een tijdvak van ten hoogste vijf jaar met beheerstaken wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.22.2
    text: |-
      In het bestuurs- en beheersreglement kan door het college van bestuur worden bepaald dat het bestuur van een
      onderzoekinstituut of onderzoekschool als bedoeld in [artikel 9.21][ref1] gedurende een tijdvak van ten hoogste
      vijf jaar met beheerstaken wordt belast. Het besluit van het college van bestuur behoeft de instemming van de
      decanen van de desbetreffende faculteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.22.3
    text: |-
      Indien het tweede lid toepassing heeft gevonden, stelt het college van bestuur jaarlijks de financiële middelen ter
      beschikking aan het bestuur van het onderzoekinstituut of de onderzoekschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.22
  - number: 9.23.1
    text: |-
      Een onderzoekinstituut of onderzoekschool tussen twee of meer universiteiten wordt in overeenstemming met de
      decanen van de betrokken faculteiten ingesteld bij gemeenschappelijke regeling als bedoeld in [artikel 8.1][ref1].
      Daarin kan de bepaling worden opgenomen dat het bestuur van het onderzoekinstituut of de onderzoekschool met
      beheerstaken wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.23.2
    text: |-
      Indien het eerste lid toepassing heeft gevonden, stellen de colleges van bestuur jaarlijks de financiële middelen
      ter beschikking aan het bestuur van het onderzoekinstituut of de onderzoekschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.23
  - number: 9.24.1
    text: |-
      De besluiten van de decaan kunnen door het college van bestuur worden vernietigd. In geval van schorsing kan, in
      afwijking van [artikel 10:44, derde lid, van de Algemene wet bestuursrecht][ref1], deze schorsing niet langer dan
      vier maanden duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 9.24.2
    text: |-
      Het eerste lid is niet van toepassing op een besluit van de decaan betreffende de benoeming van leden van de
      commissies, bedoeld in [artikel 9.15, eerste lid onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.27.1
    text: |-
      Ingeval van verwaarlozing of in strijd met de wet functioneren van het bestuur van een faculteit of een deel
      daarvan treft het college van bestuur, zo nodig met afwijking van de paragrafen 2 en 3 van deze titel en paragraaf
      2 van titel 2, voor een door het college van bestuur te bepalen tijdvak van ten hoogste één jaar de voorzieningen
      die het noodzakelijk oordeelt. Het college doet hiervan onverwijld mededeling aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.27
  - number: 9.27.2
    text: |-
      De voorzieningen vervallen, indien zij niet binnen drie weken na de ontvangst van de mededeling van het college van
      bestuur door de raad van toezicht zijn bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.27
  - number: '9.29'
    text: Deze titel heeft betrekking op de openbare universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.29
  - number: 9.30.1
    text: 'Het college van bestuur besluit:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
  - number: 9.30.1.a
    text: |-
      dat de [Wet op de ondernemingsraden][ref1] met uitzondering van [hoofdstuk VII B][ref2] van toepassing is op de
      universiteit, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 9.30.1.b
    text: dat de onder a bedoelde wet niet van toepassing is op de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
  - number: 9.30.2
    text: |-
      Een besluit als bedoeld in het eerste lid kan telkens opnieuw worden genomen, doch niet eerder dan nadat vijf jaren
      zijn verstreken sedert het van kracht worden van het vorige besluit terzake.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
  - number: 9.30.3
    text: |-
      Het besluit, bedoeld in het eerste lid aanhef en onderdeel a, stelt de [paragrafen 1][ref1], [2][ref2] en
      [4 tot en met 6][ref3] van deze titel buiten werking voor de desbetreffende universiteit. Dit besluit gaat
      gepaard aan de vaststelling door het college van bestuur van een medezeggenschapsregeling ten behoeve van de
      studenten binnen de universiteit en haar faculteiten, die ten minste gelijkwaardig is aan het bepaalde in de
      [paragrafen 1][ref4], [2][ref5], [4][ref6] en [5][ref7] van deze titel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '5'
  - number: 9.30.4
    text: |-
      Ten gevolge van het besluit, bedoeld in het eerste lid aanhef en onderdeel b, zijn de
      [paragrafen 1 tot en met 6][ref1] van deze titel van toepassing op de desbetreffende universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.30.5
    text: |-
      In het geval dat het eerste lid aanhef en onderdeel a toepassing heeft gevonden, behoeft het college van bestuur
      de voorafgaande instemming van de ondernemingsraad voor het door het college van bestuur te nemen besluit met
      betrekking tot de keuze uit de medezeggenschapsstelsels, bedoeld in het eerste lid, alsmede voor vaststelling van
      de medezeggenschapsregeling, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
  - number: 9.30.6
    text: |-
      De in de medezeggenschapsregeling vast te stellen medezeggenschapsstructuren sluiten zo veel mogelijk aan bij de
      organisatiestructuur, besluitvormingsprocedures en verantwoordelijkheidsverdelingen binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30
  - number: 9.30a.1
    text: |-
      Indien een besluit als bedoeld in [artikel 9.30, eerste lid onderdeel a][ref1], is genomen, is er aan een
      universiteit een gezamenlijke vergadering verbonden. Van deze vergadering maken deel uit de leden van de
      ondernemingsraad en de leden van het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.30a.2
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van de gezamenlijke vergadering voor elk door het
      college van bestuur te nemen besluit met betrekking tot de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
  - number: 9.30a.2.a
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.30a.2.b
    text: |-
      de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18, eerste lid][ref1],
      alsmede het voorgenomen beleid in het licht van de uitkomsten van de kwaliteitsbeoordeling, bedoeld in
      [artikel 2.9, tweede lid, tweede volzin][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.30a.2.c
    text: |-
      het bestuurs- en beheersreglement, bedoeld in [artikel 9.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.30a.3
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een reglement voor
      de gezamenlijke vergadering vast. [Artikel 9.34, tweede lid en derde lid aanhef en onderdelen f, g en j1][ref1], is
      van overeenkomstige toepassing. In het reglement kunnen worden geregeld de aangelegenheden waarover de gezamenlijke
      vergadering, onverminderd het tweede lid, instemmingsrecht heeft. In het reglement wordt, indien de aantallen leden
      van de ondernemingsraad en het orgaan, bedoeld in het eerste lid, niet gelijk zijn, tevens geregeld de wijze waarop
      voor beide geledingen wordt voorzien in gelijke invloed op de besluitvorming binnen de gezamenlijke vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.30a.4
    text: |-
      De gezamenlijke vergadering is bevoegd het college van bestuur ten minste twee maal per jaar uit te nodigen om het
      voorgenomen beleid te bespreken aan de hand van een door haar opgestelde agenda.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.30a
  - number: 9.31.1
    text: Aan een universiteit is een universiteitsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.2
    text: Het aantal leden van de raad bedraagt ten hoogste vierentwintig leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.3
    text: |-
      De raad bestaat voor de helft uit leden die door en uit het personeel worden gekozen, en voor de helft uit leden
      die door en uit de studenten worden gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.4
    text: |-
      Zij die deel uitmaken van het college van bestuur of de raad van toezicht dan wel belast zijn met de functie van
      decaan van een faculteit, kunnen niet tevens lid zijn van de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.5
    text: |-
      Kandidaten voor de verkiezingen van het deel van de raad dat uit en door het personeel wordt gekozen, kunnen worden
      gesteld door personeelsleden en door organisaties van personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.6
    text: |-
      De verkiezing van de leden van de raad geschiedt bij geheime schriftelijke stemming. Stemming voor een geleding van
      de raad vindt slechts plaats, indien het aantal kandidaat-leden van een geleding groter is dan het aantal zetels
      ten behoeve van die geleding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.31.7
    text: |-
      De raad stelt een reglement op voor de zaken van huishoudelijke aard en regelt tevens de wijze waarop door het
      college van bestuur beschikbaar gestelde middelen voor die raad en de eventuele faculteitsraden en commissies als
      bedoeld in [artikel 9.47][ref1] worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.31.8
    text: |-
      De raad kiest al dan niet uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.31
  - number: 9.32.1
    text: |-
      Het college van bestuur stelt de universiteitsraad ten minste twee maal per jaar in de gelegenheid de algemene
      gang van zaken in de universiteit met hem te bespreken. Het college van bestuur en de raad komen met elkaar bijeen,
      indien daarom onder opgave van redenen wordt verzocht door het college van bestuur, de raad, het deel van de raad
      dat uit en door het personeel is gekozen, of het deel van de raad dat uit en door de studenten is gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.2
    text: |-
      De raad is bevoegd over alle aangelegenheden de universiteit betreffende aan het college van bestuur voorstellen
      te doen en standpunten kenbaar te maken. Het college van bestuur brengt op de voorstellen, bedoeld in de eerste
      volzin, binnen drie maanden een schriftelijke, met redenen omklede reactie uit aan de raad in de vorm van een
      voorstel. Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie, stelt het college
      van bestuur de raad ten minste eenmaal in de gelegenheid met hem overleg te plegen over zijn voorstel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.2a
    text: |-
      De raad is voorts bevoegd het college van bestuur ten minste twee maal per jaar uit te nodigen om het voorgenomen
      beleid te bespreken aan de hand van een door hem opgestelde agenda.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.3
    text: De raad bevordert naar vermogen openheid, openbaarheid en onderling overleg in de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.4
    text: |-
      De raad waakt voorts in de universiteit in het algemeen tegen discriminatie op welke grond dan ook en
      bevordert in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede de inschakeling van
      personen met een handicap of chronische ziekte en allochtonen. Het reglement voor de raad, bedoeld
      in [artikel 9.34][ref1], bepaalt of de raad een overeenkomstige bevoegdheid bezit als bedoeld in
      [artikel 10, tweede lid, aanhef en onderdeel d, van de Wet College voor de rechten van de mens][ref2].
      In dat geval is [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref3]
      van overeenkomstige toepassing voor wat betreft het onderscheid, bedoeld in die wet of in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 9.32.5
    text: |-
      Het college van bestuur verstrekt de raad aan het begin van het studiejaar schriftelijk de basisgegevens met
      betrekking tot de samenstelling van het college van bestuur, de raad van toezicht, de organisatie binnen de
      universiteit en de hoofdpunten van het reeds vastgestelde beleid. Het college van bestuur stelt de raad ten
      minste eenmaal per jaar schriftelijk in kennis van het door hem in het afgelopen jaar gevoerde beleid en van
      de beleidsvoornemens voor het komende jaar ten aanzien van de universiteit op financieel, organisatorisch en
      onderwijskundig gebied. Het college van bestuur stelt de raad onverwijld in kennis van voornemens met betrekking
      tot de aangelegenheden, beschreven in het instellingsplan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.6
    text: |-
      Onverminderd het vijfde lid, verschaft het college van bestuur de raad, al dan niet gevraagd, tijdig alle
      inlichtingen die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. Daaronder worden in ieder geval
      begrepen ten minste eenmaal per jaar gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken per groep van de in de instelling werkzame personen, de leden van het college van bestuur, en de raad
      van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.7
    text: |-
      Indien bij een bepaalde vergadering of een onderdeel daarvan een bij uitstek persoonlijk belang van een van de
      leden van de raad in het geding is, kan de raad bepalen dat het betrokken lid aan die vergadering of dat onderdeel
      daarvan niet deelneemt. De raad bepaalt dan tevens dat de behandeling van de desbetreffende aangelegenheid in een
      besloten vergadering plaats heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.8
    text: |-
      De raad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      universiteit betrokkenen van het verslag kennis kunnen nemen. De raad draagt er zorg voor dat de agenda’s en
      verslagen van de vergaderingen van de raad worden toegezonden aan het college van bestuur, aan de faculteitsraden
      en aan de eventuele commissies, bedoeld in [artikel 9.47][ref1], en ter inzage worden gelegd op een algemeen
      toegankelijke plaats op de universiteit ten behoeve van belangstellenden. De raad stelt de in de vorige volzin
      bedoelde commissies ten minste eenmaal per jaar in de gelegenheid om over aangelegenheden die de desbetreffende
      commissie in het bijzonder aangaan, met hem overleg te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.32.9
    text: |-
      Het college van bestuur draagt er jegens de raad zorg voor dat de leden van de raad niet uit hoofde van hun
      lidmaatschap daarvan worden benadeeld in hun positie met betrekking tot de universiteit. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van kandidaat-leden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: 9.32.10
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een aan de universiteit werkzame persoon mag geen
      verband houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van
      de betrokkene van de raad. Een beëindiging van de betrekking in strijd met het in dit lid bepaalde is nietig.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.32
  - number: '9.33'
    text: |-
