    text: |-
      [Artikel 9.32, eerste, tweede, vijfde, zesde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.38a
