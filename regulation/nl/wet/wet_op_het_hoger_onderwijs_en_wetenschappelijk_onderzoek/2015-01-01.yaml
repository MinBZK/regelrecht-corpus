  - number: 9.34.1
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij of krachtens deze titel, een reglement
      voor de universiteitsraad vast.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.34
  - number: 9.34.2
    text: |-
      Het college van bestuur legt het reglement, daaronder elke wijziging ervan mede begrepen, als voorstel aan de raad
      voor en stelt het niet vast dan voorzover het voorstel de instemming van twee derden van het aantal leden van de
      raad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.34
  - number: 9.34.3
    text: 'In het reglement worden ten minste geregeld:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.34
  - number: 9.34.3.a
    text: |-
      de aangelegenheden waarover de raad, onverminderd [artikel 9.33][ref1], instemmingsrecht heeft,


