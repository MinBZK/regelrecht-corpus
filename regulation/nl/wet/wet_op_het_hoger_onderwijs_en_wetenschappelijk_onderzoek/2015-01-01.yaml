  - number: 7a.2
    text: |-
      Dit hoofdstuk heeft betrekking op de bekostigde en ingevolge [artikel 6.9][ref1] aangewezen instellingen
      voor hoger onderwijs die voldoen aan [artikel 176g van de Wet op het primair onderwijs][ref2],
      [artikel 142 van de Wet primair onderwijs BES][ref3], [artikel 162j van de Wet op de expertisecentra][ref4],
      [artikel 118p van de Wet op het voortgezet onderwijs][ref5] of
      [artikel 202 van de Wet voortgezet onderwijs BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
