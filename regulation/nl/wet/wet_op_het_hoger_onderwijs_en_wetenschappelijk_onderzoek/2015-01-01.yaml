        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.32a
    text: |-
      In afwijking van [artikel 5a.9, zesde lid][ref1] en [5a.13f][ref2] kan Onze minister eenmalig besluiten
      de termijn van accreditatie voor door hem aangewezen bachelor- en masteropleidingen, bedoeld in de
      [artikelen 7.3a, eerste lid en tweede lid][ref3] en [7.3b][ref4], te verlengen voor de duur van maximaal twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.32 ab
    text: Onze Minister kan besluiten de vervaldatum van het besluit tot verlening van accreditatie eenmalig te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32_ab
  - number: 18.32 ac
    text: |-
      Onze Minister kan besluiten de vervaldatum van het besluit tot verlening van de toets nieuwe opleiding eenmalig
      te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32_ac
  - number: 18.32b.1
    text: |-
      Gedurende drie jaar na inwerkingtreding van de Wet van 24 juni 2010 (Stb. 293) wordt een aanvraag om
      instellingstoets kwaliteitszorg ingediend, in afwijking van [artikel 5a.13a][ref1], op grond van dit artikel en
      [artikel 18.32c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '6'
  - number: 18.32b.2
    text: |-
      Binnen twee maanden na inwerkingtreding van de Wet van 24 juni 2010 (Stb. 293) dient een instellingsbestuur een
      aanvraag in bij het accreditatieorgaan, indien zij in aanmerking wil komen voor een besluit tot deelname aan het
      invoeringsregime als bedoeld in [artikel 18.32c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '6'
  - number: 18.32b.3
    text: |-
      Het accreditatieorgaan neemt een positief besluit op de aanvraag, bedoeld in het tweede lid, als het
      instellingsbestuur voor ten minste de helft van het aangeboden aantal opleidingen een besluit om accreditatie op
      grond van [artikel 5a.8][ref1] heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.32b.4
    text: |-
      Indien blijkt dat alle instellingsbesturen die deelnemen aan het invoeringsregime een aanvraag om instellingstoets
      kwaliteitszorg hebben gedaan en er capaciteit bij het accreditatieorgaan is voor nieuwe aanvragen om
      instellingstoets kwaliteitszorg die onbenut blijft gedurende deze drie jaar, kan het accreditatieorgaan de
      aanvragen in behandeling nemen, indien een instellingsbestuur heeft laten blijken belangstelling te hebben voor het
      indienen van een aanvraag. [Artikel 18.32c][ref1] is op deze aanvragen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '6'
  - number: 18.32c.1
    text: |-
      Het besluit tot deelname aan het invoeringsregime houdt in dat in afwijking van [artikel 5a.13e, eerste lid][ref1],
      de aanvragen om accreditatie en toets nieuwe opleiding worden ingediend en beoordeeld op grond van
      [artikel 5a.13f][ref2] en [5a.13g][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.32c.2
    text: |-
      Aan het besluit tot deelname aan het invoeringsregime is de verplichting voor het instellingsbestuur verbonden op
      een door het accreditatieorgaan te bepalen tijdstip een aanvraag om instellingstoets kwaliteitszorg in te dienen.
      Het tijdstip is niet gelegen na drie jaar na de inwerkingtreding van de Wet van 24 juni 2010 (Stb. 293).
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
  - number: 18.32c.3
    text: |-
      Een besluit tot het verlenen van accreditatie of toets nieuwe opleiding in het kader van het
      invoeringsregime vervalt in afwijking van [artikel 5a.9, zevende lid][ref1], onderscheidenlijk
      [artikel 5a.11, zesde lid, onder a][ref2], na vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.32c.4
    text: |-
      Indien het accreditatieorgaan besluit een instellingstoets kwaliteitszorg te verlenen, dan wordt de duur van de
      accreditatie of toets nieuwe opleiding, bedoeld in het derde lid, verlengd tot zes jaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
  - number: 18.32c.5
    text: |-
      Indien het accreditatieorgaan besluit geen instellingstoets kwaliteitszorg te verlenen dan wel indien het
      instellingsbestuur niet voldoet aan de verplichting, bedoeld in het tweede lid, is het instellingsbestuur verplicht
      binnen een jaar na de datum waarop het accreditatieorgaan het besluit heeft genomen dat geen instellingstoets
      kwaliteitszorg wordt verleend of binnen een jaar na het door het accreditatieorgaan bepaalde tijdstip, bedoeld
      in het tweede lid, waarop het instellingsbestuur aan de daar genoemde verplichting had moeten voldoen, een
      aanvraag om toetsing van de aspecten van [artikel 5a.8, tweede lid, onderdelen d tot en met f][ref1], of
      [artikel 5a.10a, tweede lid, onderdelen d tot en met f][ref2], bij het accreditatieorgaan in te dienen voor
      de aanvragen tot het verlenen van accreditatie of een toets nieuwe opleiding die zijn ingediend en beoordeeld
      volgens het invoeringsregime. Het accreditatieorgaan besluit binnen drie maanden op de aanvraag en indien het
      accreditatieorgaan positief besluit op de aanvraag, bedoeld in de eerste volzin, wordt de duur van de accreditatie
      of toets nieuwe opleiding verlengd tot zes jaar. Bij een negatief besluit van het accreditatieorgaan zijn
      [artikel 5a.12, eerste tot en met vijfde lid][ref3], en [artikel 5a.12a][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.32c.6
    text: |-
      In afwijking van het derde lid wordt het besluit tot het verlenen van accreditatie of toets nieuwe opleiding
      verlengd tot aan het einde van het studiejaar of, indien nodig, tot aan het einde van het daarop volgende
      studiejaar, indien het accreditatieorgaan niet over de aanvraag op grond van het tweede of vijfde lid heeft
      besloten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.32c
  - number: '18.33'
    text: |-
      Voor de toepassing van artikel 7.8b, vijfde lid, tweede volzin, wordt onder bacheloropleiding mede begrepen de
      daarmee overeenkomende opleiding in het wetenschappelijk onderwijs, bedoeld in artikel 18.14 of artikel 18.15.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.33
  - number: '18.37'
    text: |-
      Degene die op of voor 31 augustus 2002 voldoet aan de voorwaarde, bedoeld in artikel 7.18, tweede lid, onder
      a, zoals die bepaling luidde op 31 augustus 2002, wordt gelijkgesteld aan degene die voldoet aan de voorwaarde,
      bedoeld in artikel 7.18, tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.37
  - number: '18.38'
    text: |-
      De bezitter van een getuigschrift van een met goed gevolg afgelegd kandidaats- of afsluitend examen
      aan een instelling voor hoger onderwijs is vrijgesteld van de vooropleidingseisen, bedoeld in
      [artikel 7.24, eerste of tweede lid][ref1], onverminderd het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.38
