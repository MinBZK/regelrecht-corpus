        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 2a
  - number: 6.9.5
    text: |-
      Indien door de in het eerste lid bedoelde rechtspersoon geen in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13][ref1], geregistreerde opleidingen meer worden verzorgd, kan deze rechtspersoon slechts
      opnieuw graden verlenen na toepassing van het eerste tot en met derde lid.


