      [artikel I, onderdeel AW, onderscheidenlijk onderdeel AX, van de Wet van 10 juli 2013][ref1] (Stb. 2013, 298)
      beschikken over een bewijs van toelating als bedoeld in de [artikelen 7.57c][ref2] en [7.57d][ref3], zoals
      die artikelen luidden op de dag voordat het desbetreffende onderdeel in werking treedt, behouden hun recht op
      inschrijving voor de propedeutische fase van de desbetreffende opleiding.


