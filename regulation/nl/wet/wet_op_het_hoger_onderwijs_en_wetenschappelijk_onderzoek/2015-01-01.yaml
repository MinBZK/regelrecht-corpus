        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.40.1.a
    text: |-
      de totstandkoming, wijziging of toepassing van het medezeggenschapsreglement, bedoeld in [artikel 9.34][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
    references:
