  - number: 6.9.1
    text: |-
      Een rechtspersoon met volledige rechtsbevoegdheid die de bevoegdheid wenst te verkrijgen om graden te verlenen,
      dient daartoe een verzoek in bij Onze minister onder overlegging van een toets nieuwe opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.9
  - number: 6.9.2
    text: |-
      Naar aanleiding van het verzoek, bedoeld in het eerste lid, adviseert de inspectie Onze minister over de
      continuïteit van de desbetreffende rechtspersoon en de naleving door de desbetreffende rechtspersoon van de
      [artikelen 1.12, tweede lid][ref1] en [1.12a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 2a
  - number: 6.9.3
    text: |-
      Naar aanleiding van het verzoek en mede op grond van het advies beslist Onze minister of de
      [artikelen 1.12, eerste lid][ref1], of [1.12a][ref2] op de opleiding, verzorgd door de desbetreffende
      rechtspersoon, van toepassing zijn. Onze minister wijst het verzoek om graden te mogen verlenen in ieder geval af
      indien de continuïteit van de desbetreffende rechtspersoon of de naleving van artikel 1.12, tweede en derde lid, in
      onvoldoende mate zijn gewaarborgd. Onze minister neemt binnen 16 weken na ontvangst van het verzoek, bedoeld in het
      eerste lid, een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 2a
  - number: 6.9.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing indien de desbetreffende rechtspersoon de opleiding
      overdraagt aan een andere rechtspersoon met volledige rechtsbevoegdheid waarop de [artikelen 1.12][ref1] of
      [1.12a][ref2] op het moment van de overdracht niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel6.9
    references:
