  - number: 1.7a.2
    text: 'In geval van toepassing van het eerste lid worden bij algemene maatregel van bestuur in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.2.b
    text: |-
      op welke wijze van welke artikelen van de in het eerste lid genoemde hoofdstukken, titels of paragrafen wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien, voordat een
      experiment is afgelopen, een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten
      in een structurele wettelijke regeling, kan Onze minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.5
    text: |-
      Onze minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.7a.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband tussen een instelling voor hoger
      onderwijs en een school als bedoeld in de Wet op het voortgezet onderwijs dan wel een instelling als bedoeld
      in artikel 1.1.1, onderdeel b, of artikel 1.4.1 van de Wet educatie en beroepsonderwijs. In geval van een
      samenwerkingsverband met een instelling als bedoeld in artikel 1.1.1, onderdeel b, van de Wet educatie en
      beroepsonderwijs kan voor die instelling worden afgeweken van artikel 8.1.1 van die wet, indien hoofdstuk 7,
      titel 3, paragraaf 1, van deze wet van toepassing wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.7a
  - number: 1.8.1
    text: |-
      De bekostigde instellingen voor hoger onderwijs zijn de instellingen, opgenomen in de bijlage van deze wet onder a
      tot en met i.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.8
  - number: 1.8.2
    text: De in de bijlage van deze wet onder a, c, h en j opgenomen instellingen bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.8
  - number: 1.8.3
    text: |-
      Een wijziging van de statutaire naam van een stichting of vereniging, genoemd in de bijlage, is van kracht met
      ingang van het tijdstip waarop de wijziging schriftelijk aan Onze minister is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Ten behoeve van het verzorgen van initieel onderwijs en, voorzover het universiteiten betreft, mede ten behoeve
      van het verrichten van wetenschappelijk onderzoek hebben de in de bijlage van deze wet onder a, c, h en j opgenomen
      instellingen, onderscheidenlijk rechtspersonen met volledige rechtsbevoegdheid, waarvan de overige in de bijlage
      van deze wet opgenomen instellingen uitgaan, aanspraak op bekostiging uit ’s Rijks kas, voorzover aan de aan die
      instellingen verbonden opleidingen accreditatie is verleend of die opleidingen de toets nieuwe opleiding dan wel
      de toets nieuw Ad-programma met positief gevolg hebben ondergaan. Voor de toepassing van dit lid worden de ontwerp-
      en ontwikkelactiviteiten en onderzoek gericht op de beroepspraktijk, aan hogescholen gerekend tot het daarop
      betrekking hebbende onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Aan de met goed gevolg afgelegde examens van initiële opleidingen en daarbinnen uitgevoerde Ad-programma’s,
      verzorgd door bekostigde instellingen, is een graad verbonden. Degenen aan wie een dergelijke graad is verleend
      onderscheidenlijk degenen die hebben voldaan aan de vereisten, gesteld in [artikel 7.18][ref1], zijn gerechtigd
      in de daarvoor in aanmerking komende gevallen de graden, genoemd in de [artikelen 7.10a][ref2], [7.10b][ref3] en
      [7.18][ref4], in de eigen naamsvermelding tot uitdrukking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel1.9
    references:
