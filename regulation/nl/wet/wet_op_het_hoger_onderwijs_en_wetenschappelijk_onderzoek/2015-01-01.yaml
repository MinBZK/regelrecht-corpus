      [artikel 7.10a][ref1] onderscheidenlijk [artikel 7.10b][ref2] is verbonden, en dat de registratie in het Centraal
      register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref3], wordt beëindigd.


