        hoofdstuk: '2'
  - number: '18.77'
    text: |-
      Onze minister kan ten aanzien van één of meer instellingen tot 1 juni 2012 besluiten, dat de
      [derde volzin van het eerste lid van artikel 7.30a][ref1], zoals die volzin luidt na inwerkingtreding van artikel
      I, onderdeel F, van de wet van 8 juli 2011 (Stb. 369) ten aanzien van de desbetreffende instelling of instellingen
      tot 1 september 2013 buiten toepassing blijft.


