        paragraaf: '2'
  - number: 9.40.2
    text: |-
      Indien er een geschil is tussen het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld
      in [artikel 9.30, derde lid, tweede volzin][ref1], de universiteitsraad of de faculteitsraad en degene die of
      het orgaan dat beslissingsbevoegdheid heeft, onderzoekt het college van bestuur of een minnelijke schikking
      tussen partijen mogelijk is. Indien het college van bestuur het orgaan is dat de beslissingsbevoegdheid heeft,
      onderzoekt de raad van toezicht of een minnelijke schikking mogelijk is. Indien dit niet mogelijk blijkt,
      legt het medezeggenschapsorgaan, bedoeld in de eerste volzin, of degene die of het desbetreffende orgaan dat
      beslissingsbevoegdheid heeft het geschil voor aan de geschillencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.40.3
    text: |-
      Indien het geschil betrekking heeft op het niet of niet geheel volgen van het advies van een
      medezeggenschapsorgaan, wordt de uitvoering van de beslissing opgeschort met vier weken, tenzij het desbetreffende
      orgaan geen bedenkingen heeft tegen onmiddellijke uitvoering van de beslissing.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.40.4
    text: |-
      De geschillencommissie is bevoegd een minnelijke schikking tussen partijen tot stand te brengen. Indien geen
      minnelijke schikking wordt bereikt, beslecht de geschillencommissie een aan haar voorgelegd geschil door een
      bindende uitspraak te doen, waarbij zij toetst of:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.40.4.a
    text: |-
      het college van bestuur of de decaan zich heeft gehouden aan de eisen van de wet en het reglement, bedoeld in
      [artikel 9.34][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.4.b
    text: |-
      het college van bestuur of de decaan bij de afweging van de betrokken belangen in redelijkheid tot het voorstel of
      de beslissing heeft kunnen komen, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.40.4.c
    text: |-
      het college van bestuur of de decaan onzorgvuldig heeft gehandeld ten opzichte van het desbetreffende
      medezeggenschapsorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.40.5
    text: |-
      Indien het college van bestuur of de decaan voor de voorgenomen beslissing geen instemming van het
      medezeggenschapsorgaan heeft gekregen, kan het de geschillencommissie, in afwijking van het vierde lid, toestemming
      vragen om de beslissing te nemen. De geschillencommissie geeft slechts toestemming, indien de beslissing van
      het medezeggenschapsorgaan om geen instemming te geven onredelijk is of indien de voorgenomen beslissing van het
      college van bestuur of de decaan gevergd wordt door zwaarwegende organisatorische, economische of sociale redenen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.40.6
    text: |-
      Indien het gaat om besluiten als bedoeld in de [artikelen 9.30a, tweede lid][ref1],
      of [9.33, onder a, b of d][ref2], beoordeelt de geschillencommissie in afwijking van het vijfde lid, tweede volzin,
      of het college van bestuur of een ander orgaan bij afweging van de betrokken belangen in redelijkheid tot het
      besluit heeft kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.7
    text: |-
      Het medezeggenschapsorgaan kan voor wat betreft het aanhangig maken van een geschil in de adviesbevoegdheden van de
      opleidingscommissie treden, voorzover dat strookt met het advies van de opleidingscommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
  - number: 9.46.1
    text: |-
      Van een uitspraak van de geschillencommissie staat beroep open bij de ondernemingskamer van het gerechtshof
      Amsterdam. De eerste volzin is niet van toepassing ten aanzien van [artikel 9.40, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.46.2
    text: |-
      Een medezeggenschapsorgaan kan in rechte optreden, als het beroep strekt tot naleving door het college van bestuur
      of de decaan van de verplichtingen tegenover het medezeggenschapsorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
  - number: 9.46.3
    text: |-
      Het beroep wordt ingediend bij beroepschrift binnen een maand na de datum van de uitspraak van de
      geschillencommissie. De wederpartij wordt van het beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
  - number: 9.46.4
    text: |-
      Een beroep kan uitsluitend worden ingesteld op de grond dat de geschillencommissie een onjuiste toepassing heeft
      gegeven aan de wet.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
  - number: 9.46.5
    text: Van een uitspraak van de ondernemingskamer kan geen cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
  - number: 9.46.6
    text: |-
      In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] kan het medezeggenschapsorgaan
      niet in de proceskosten worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
  - number: 9.47.1
    text: |-
      Het college van bestuur stelt het personeel en de studenten in de gelegenheid om desgewenst onderscheidenlijk een
      personeelscommissie dan wel afzonderlijke commissies voor onderscheiden personeelscategorieën of -groeperingen, en
      een studentencommissie in te stellen. Een dergelijke commissie is bevoegd desgevraagd of eigener beweging advies
      uit te brengen aan de universiteitsraad over die aangelegenheden die de desbetreffende commissie in het bijzonder
      aangaan.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.47
  - number: 9.47.2
    text: |-
      Op verzoek van een commissie stelt de universiteitsraad het college van bestuur in kennis van een schriftelijk
      advies als bedoeld in het eerste lid. [Artikel 9.32, tweede lid derde volzin][ref1], is ten aanzien van een
      dergelijk schriftelijk advies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.47
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.48.1
    text: |-
      Het college van bestuur staat de universiteitsraad het gebruik toe van de voorzieningen waarover het kan
      beschikken, en die de raad voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.48
  - number: 9.48.2
    text: |-
      Het college van bestuur stelt de leden van de universiteitsraad in de gelegenheid om gedurende een door het college
      van bestuur en de raad gezamenlijk vast te stellen hoeveelheid tijd de scholing te ontvangen die de leden van
      de raad voor de vervulling van hun taak nodig hebben. Het personeel van de universiteit wordt in de gelegenheid
      gesteld deze scholing in werktijd en met behoud van salaris te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.48
  - number: 9.48.3
    text: |-
      Dit artikel is van overeenkomstige toepassing op de faculteitsraden en opleidingscommissies met dien verstande dat
      de decaan in de plaats treedt van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.48
  - number: '9.49'
    text: |-
      De paragrafen 1 tot en met 4 van deze titel zijn van overeenkomstige toepassing op de onderzoekinstituten en
      onderzoekscholen waarvan ingevolge [artikel 9.23][ref1] het bestuur is belast met de beheerstaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.50.1
    text: |-
      Indien in het bestuurs- en beheersreglement wordt bepaald dat er bij een universiteit centrale diensten zijn,
      worden door het college van bestuur, met inachtneming van de bij of krachtens algemene maatregel van bestuur
      gegeven voorschriften, een of meer dienstraden ingesteld ten behoeve van het personeel dat bij die diensten
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2
    text: |-
      Het college van bestuur voorziet er in dat een dienstraad tijdig in de gelegenheid wordt gesteld advies aan het
      hoofd van de desbetreffende dienst uit te brengen en overleg te voeren over voorgenomen maatregelen met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2.a
    text: de wijze waarop de arbeids- en dienstvoorwaarden bij een centrale dienst worden toegepast,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2.b
    text: de wijze waarop het algemeen personeelsbeleid bij een centrale dienst wordt uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2.c
    text: aangelegenheden op het gebied van de arbeidsomstandigheden in verband met de arbeid in een centrale dienst,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2.d
    text: de organisatie en werkwijze binnen een centrale dienst, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.2.e
    text: de technische en economische dienstuitvoering bij een centrale dienst.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.3
    text: |-
      De dienstraad is bevoegd het hoofd van de desbetreffende dienst voorstellen te doen met betrekking tot de in het
      tweede lid genoemde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.4
    text: |-
      Het hoofd van de desbetreffende dienst behoeft de voorafgaande instemming van de dienstraad voor elke maatregel die
      hij bevoegd is te treffen en waarover de dienstraad op grond van het tweede lid heeft geadviseerd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50.5
    text: |-
      Het college van bestuur stelt, in overeenstemming met de dienstraad, een reglement vast in verband met de
      uitoefening van de rechten, bedoeld in het tweede, derde en vierde lid. Het reglement bevat in elk geval een
      geschillenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50
  - number: 9.50a.1
    text: |-
      Op verzoek van de raad van toezicht kan Onze minister onder door hem te stellen voorwaarden toestaan dat, al dan
      niet voor een bepaald tijdvak, wordt afgeweken van een of meer onderdelen van [titel 1][ref1] of [titel 2][ref2].
      Het college van bestuur toont aan in geval van afwijking van [titel 1][ref3] dat is voorzien in een doelmatige
      bestuursorganisatie, dan wel toont aan in geval van afwijking van [titel 2][ref4] dat is voorzien in een doelmatige
      vorm van medezeggenschap voor personeel en studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.50a.2
    text: |-
      Indien het eerste lid toepassing heeft gevonden, wordt de afwijkende regeling in het bestuurs- en beheersreglement
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.50a
  - number: 9.51.1
    text: |-
      De besturen van de verenigingen met volledige rechtsbevoegdheid of stichtingen, waarvan de in de bijlage van deze
      wet onder b en i opgenomen universiteiten uitgaan, zijn verplicht elke wijziging van de statuten van de vereniging
      of stichting zo spoedig mogelijk ter kennis van Onze minister te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
  - number: 9.51.2
    text: |-
      Het college van bestuur stelt regelen vast inzake het college van bestuur en de inrichting van en de
      medezeggenschap binnen hun universiteit. Bij de vaststelling van die regelen alsmede bij wijziging daarvan
      worden de [titels 1][ref1] en [2][ref2] van dit hoofdstuk in acht genomen voorzover de eigen aard van de
      bijzondere universiteit zich daartegen naar het oordeel van het college van bestuur niet verzet. In die regelen
      wordt bepaald welke faculteit of faculteiten de universiteit omvat. Het college van bestuur brengt die regelen
      alsmede wijzigingen daarvan zo spoedig mogelijk ter kennis van Onze minister. Indien dat naar het oordeel
      van het college van bestuur wenselijk is op grond van de eigen aard van de bijzondere universiteit, kan de
      universiteit een functionele scheiding aanbrengen tussen het toezicht en het bestuur. In dat geval zijn de
      [artikelen 9.8 tot en met 9.9a][ref3] van overeenkomstige toepassing. In de statuten wordt vermeld op welke wijze
      de functionele scheiding wordt gewaarborgd. Het college van bestuur vermeldt jaarlijks in het jaarverslag bedoeld
      in [artikel 2.9][ref4] de redenen voor een eventuele afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.51.3
    text: |-
      De regelen alsmede de wijzigingen daarvan, bedoeld in het tweede lid, worden geacht te voldoen aan de in
      [artikel 1.9, derde lid, onder h][ref1], bedoelde voorwaarde, indien Onze minister niet binnen drie maanden na
      de ontvangst van de mededeling aan het het college van bestuur heeft verklaard van oordeel te zijn, dat het het
      college van bestuur bij de vaststelling van de regelen of de wijziging daarvan op door hem aan te wijzen punten
      de[ titels 1][ref2] en [2][ref3] van dit hoofdstuk niet in acht heeft genomen en daartoe in redelijkheid geen
      beroep heeft kunnen doen op de eigen aard van de bijzondere universiteit die zich tegen inachtneming daarvan zou
      verzetten, of dat onvoldoende aannemelijk heeft gemaakt. Binnen drie maanden wordt het bezwaar ondervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.51.4
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het derde lid, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
  - number: 9.51.5
    text: Het college van bestuur verstrekt aan Onze minister de nodige inlichtingen omtrent de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
  - number: 9.51.6
    text: |-
      Onverminderd het in dit artikel bepaalde behoeft een besluit tot fusie, als bedoeld in [artikel 16.16][ref1], van
      het college van bestuur, voorafgaande instemming van de universiteitsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 9.51.7
    text: |-
      Het college van bestuur stelt de universiteitsraad in de gelegenheid om tijdig voorafgaand aan het verzoek
      om instemming, bedoeld in het zesde lid, kennis te nemen van de opgestelde fusie-effectrapportage, bedoeld in
      [artikel 16.16a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: '9.53'
    text: |-
      Het college van bestuur van een openbare universiteit kan, na raadpleging van het college voor promoties, bedoeld
      in [artikel 9.10][ref1], een rechtspersoon met volledige rechtsbevoegdheid bevoegd verklaren bij die universiteit
      een bijzondere leerstoel te vestigen. Het besluit vermeldt de faculteit waarbij en het wetenschapsgebied waarin
      door de bijzonder hoogleraar onderwijs zal worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.54.1
    text: |-
      De bevoegdverklaring geschiedt op een daartoe strekkend verzoek van het bestuur van de rechtspersoon met volledige
      rechtsbevoegdheid. In het bestuurs- en beheersreglement wordt bepaald op welke wijze een verzoek dient te worden
      ingericht en welke bescheiden bij het verzoek dienen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.54
  - number: 9.54.2
    text: |-
      Het in het voorgaande lid bedoelde bestuur geeft het college van bestuur de nodige inlichtingen omtrent de door het
      eerstbedoelde bestuur gevestigde leerstoel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.54
  - number: 9.55.1
    text: |-
      Om als bijzonder hoogleraar onderwijs te kunnen geven wordt vereist dat aan betrokkene de graad Doctor is verleend
      door een universiteit, bedoeld in [artikel 1.2, onder a of b][ref1], of door de Open Universiteit, dat betrokkene
      in het bezit is van een doctoraat, verkregen aan een zodanige instelling, dan wel dat betrokkene in het bezit is
      van een bewijs dat de aanstelling door het college van bestuur is bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.55
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.55.2
    text: |-
      De bekrachtiging wordt geacht te zijn verleend, indien binnen acht weken na de ontvangst der aanvraag daarop geen
      beslissing is genomen. Door het college van bestuur kan deze termijn tot ten hoogste vier maanden worden verlengd.
      De bekrachtiging kan slechts bij een met redenen omkleed besluit worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.55
  - number: 9.55.3
    text: |-
      Het bestuur van de rechtspersoon met volledige rechtsbevoegdheid geeft van elke aanstelling van een hoogleraar
      binnen vier weken kennis aan het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.55
  - number: '9.56'
    text: |-
      Het onderwijs, gegeven door een bijzonder hoogleraar, is te allen tijde voor hen, die gerechtigd zijn het onderwijs
      aan de universiteiten bij te wonen, toegankelijk.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.56
  - number: 9.57.1
    text: |-
      De bijzonder hoogleraar kan, onder door het college van bestuur te stellen voorwaarden, gebruikmaken van de
      collegelokalen, inrichtingen, verzamelingen en hulpmiddelen voor het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.57
  - number: 9.57.2
    text: |-
      De bijzonder hoogleraar heeft toegang met raadgevende stem tot de vergaderingen van de examencommissies van de
      faculteit waarbij hij is aangesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.57
  - number: 9.57.3
    text: |-
      Met het einde van de maand, waarin een bijzonder hoogleraar de voor de openbare dienst geldende functionele
      leeftijdsgrens heeft bereikt, wordt hem eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.57
  - number: 9.57.4
    text: |-
      Op de bijzonder hoogleraar is [artikel 9.19, derde en vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.57
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '9.58'
    text: |-
      De in [artikel 9.53][ref1] bedoelde bevoegdverklaring wordt door het college van bestuur, na raadpleging van het
      college voor promoties, bedoeld in [artikel 9.10][ref2], ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.58
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.58.a
    text: indien het bij of krachtens deze paragraaf bepaalde niet langer wordt nagekomen;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.58
  - number: 9.58.b
    text: |-
      indien de bijzonder hoogleraar het onderwijs veronachtzaamt dan wel zonder goede grond dit onderwijs gedurende een
      vol jaar heeft onderbroken;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.58
  - number: 9.58.c
    text: |-
      indien het belang van het wetenschappelijk onderwijs zich ten gevolge van wijzigingen in de omstandigheden met de
      bevoegdverklaring niet langer verdraagt.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.58
  - number: '10.1'
    text: Dit hoofdstuk heeft betrekking op de in de bijlage van deze wet opgenomen hogescholen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Het college van bestuur bestaat uit ten hoogste drie leden, onder wie de voorzitter. Bij de benoeming wordt zoveel
      mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Een lid van het college van bestuur kan niet tegelijk lid zijn van het college van bestuur van een andere
      hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.2
  - number: 10.2.3
    text: |-
      [Artikel 9.3, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Het college van bestuur van een hogeschool kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden
      overdragen aan het bestuur van een faculteit of het bestuur van een andere organisatorische eenheid als bedoeld
      in [artikel 10.3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.3a
    text: |-
      Het college van bestuur kan bij bestuursreglement een of meer faculteiten of andere organisatorische eenheden
      instellen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3a
  - number: 10.3b.1
    text: |-
      Het college van bestuur stelt een bestuurs- en beheersreglement vast ter regeling van het bestuur, het beheer en de
      inrichting van de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3b.2
    text: |-
      In het bestuurs- en beheersreglement worden regels vastgesteld omtrent de totstandkoming van de onderwijs- en
      examenregeling, bedoeld in [artikel 7.13][ref1]. Deze regels betreffen in elk geval de aanwijzing van het orgaan
      dat de onderwijs- en examenregeling vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 10.3b.3
    text: |-
      Indien de hogeschool faculteiten of andere organisatorische eenheden omvat, bevat het bestuurs- en beheersreglement
      bovendien:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3b.3.a
    text: welke faculteiten of eenheden er zijn en welke opleidingen daarin zijn ingesteld,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3b.3.b
    text: |-
      welke bevoegdheden het college van bestuur heeft overgedragen aan het faculteitsbestuur of het bestuur van de
      desbetreffende eenheid,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3b.3.c
    text: de samenstelling en werkwijze van het faculteitsbestuur of het bestuur van de desbetreffende eenheid, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3b.3.d
    text: de verhouding van het faculteitsbestuur of het bestuur van de desbetreffende eenheid tot het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3b
  - number: 10.3c.1
    text: |-
      Voor elke opleiding of groep van opleidingen wordt een opleidingscommissie ingesteld, behoudens het bepaalde in het
      vierde lid. De commissie heeft tot taak:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
  - number: 10.3c.1.a
    text: advies uit te brengen over de onderwijs- en examenregeling alvorens het instellingsbestuur de regeling vaststelt,
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
  - number: 10.3c.1.b
    text: het jaarlijks beoordelen van de wijze van uitvoeren van de onderwijs- en examenregeling, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
  - number: 10.3c.1.c
    text: |-
      het desgevraagd of uit eigen beweging advies uitbrengen aan de deelraad, bedoeld in [artikel 10.25][ref1], en het
      faculteitsbestuur of het bestuur van de desbetreffende organisatorische eenheid dan wel, indien de hogeschool geen
      faculteiten omvat, aan het instellingsbestuur, over alle andere aangelegenheden betreffende het onderwijs in de
      desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3c.2
    text: |-
      Voorzover bij de vaststelling, nadere regeling of uitvoering van de onderwijs- en examenregeling het advies van de
      desbetreffende commissie niet wordt gevolgd, wordt de desbetreffende beslissing met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
  - number: 10.3c.3
    text: |-
      In het bestuursreglement worden regels van procedurele aard met betrekking tot de toepassing van het eerste
      lid gesteld en wordt de wijze van benoemen en samenstellen van de commissie geregeld, met dien verstande dat de
      helft van het totaal aantal leden van de commissie voortkomt uit de voor de desbetreffende opleiding ingeschreven
      studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
  - number: 10.3c.4
    text: |-
      Indien een faculteit of een andere organisatorische eenheid slechts één opleiding omvat, kan het bestuursreglement
      bepalen dat de taken en bevoegdheden van de opleidingscommissie worden uitgeoefend door de deelraad, bedoeld in
      [artikel 10.25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3d.1
    text: Een hogeschool heeft een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.2
    text: |-
      De raad van toezicht houdt, met het oog op de taken van de hogeschool, bedoeld in [artikel 1.3, tweede lid][ref1],
      toezicht op de uitvoering van werkzaamheden en de uitoefening van bevoegdheden door het college van bestuur en
      staat dit college met raad ter zijde. De raad van toezicht is in elk geval belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.3d.2.a
    text: het benoemen, schorsen, ontslaan en vaststellen van de beloning van de leden van het college van bestuur;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.2.b
    text: het goedkeuren van het bestuurs- en beheersreglement;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.2.c
    text: het goedkeuren van de begroting, de jaarrekening, het jaarverslag, het instellingsplan;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.2.d
    text: |-
      indien van toepassing, het goedkeuren van de gemeenschappelijke regeling, bedoeld in [artikel 8.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.3d.2.e
    text: |-
      het toezien op de naleving door het college van bestuur van wettelijke verplichtingen en de omgang met de
      branchecode, bedoeld in [artikel 2.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.3d.2.f
    text: |-
      het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen van de hogeschool verkregen op grond van de [artikelen 2.5][ref1] en [2.6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.3d.2.g
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de raad;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 10.3d.2.h
    text: |-
      het toezien op de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.3d.2.i
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met h, in het jaarverslag van de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.3
    text: |-
      Het college van bestuur voorziet de raad van toezicht van een functioneel onafhankelijke administratieve
      ondersteuning. De raad van toezicht heeft instemmingsrecht ten aanzien van de benoeming en het ontslag van de
      secretaris van de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.4
    text: |-
      De samenstelling, taken en bevoegdheden van de raad van toezicht zijn zodanig dat de raad een deugdelijk en
      onafhankelijk toezicht kan uitoefenen. De leden van de raad van toezicht hebben geen directe belangen bij de
      hogeschool. Zij hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last of ruggespraak. De
      benoeming van de leden van de raad geschiedt op basis van vooraf openbaar gemaakte profielen. Een van de leden
      wordt benoemd op voordracht van de medezeggenschapsraad, dan wel de ondernemingsraad en het orgaan dat op grond
      van de medezeggenschapsregeling, bedoeld in [artikel 10.16a, derde lid, tweede volzin][ref1], is ingesteld. De
      voordracht bevat ten minste twee namen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3d.5
    text: |-
      De medezeggenschapsraad dan wel de ondernemingsraad en het orgaan binnen de hogeschool dat op grond van de
      medezeggenschapsregeling, bedoeld in [artikel 10.16a, derde lid, tweede volzin][ref1], is ingesteld, wordt of
      worden in de gelegenheid gesteld om aan de raad van toezicht advies uit te brengen over de profielen bedoeld in het
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3d.6
    text: |-
      De raad van toezicht pleegt ten minste twee keer per jaar overleg met de medezeggenschapsraad dan wel de
      ondernemingsraad en het orgaan binnen de instelling dat op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 10.16a, derde lid, tweede volzin][ref1], is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3d.7
    text: |-
      Indien dat naar het oordeel van het college van bestuur wenselijk is op grond van de levensbeschouwelijke aard van
      de hogeschool, kan de hogeschool in afwijking van het eerste lid een functionele scheiding tussen het bestuur en
      het toezicht aanbrengen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
  - number: 10.3d.8
    text: |-
      Indien de hogeschool een functionele scheiding aanbrengt, zijn de leden 2 tot en met 6 van overeenkomstige
      toepassing. In de statuten wordt vermeld op welke wijze de functionele scheiding wordt gewaarborgd. Het college van
      bestuur vermeldt jaarlijks in het jaarverslag, bedoeld in [artikel 2.9][ref1], de redenen voor eventuele afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.3e.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de raad van
      toezicht een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor
      zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.2
    text: 'Onder wanbeheer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.2.a
    text: financieel wanbeleid;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 1.18][ref1], maatregelen te treffen die
      noodzakelijk zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de instelling en om
      te voorkomen dat de kwaliteit van het stelsel van hoger beroepsonderwijs in gevaar komt;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.3e.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de instelling in stand houdt, een
      bestuurder of toezichthouder zelf dan wel een derde;
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.2.d
    text: |-
      onrechtmatig handelen waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      instelling in stand houdt, een bestuurder of toezichthouder zelf dan wel een derde, en
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen binnen de instelling, waaronder wordt verstaan intimidatie of bedreiging van personeel of
      studenten door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.4
    text: Een aanwijzing bevat de termijn waarbinnen de raad van toezicht aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.5
    text: 'Voordat Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 12a van de Wet op het onderwijstoezicht][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 12a
  - number: 10.3e.5.b
    text: |-
      heeft de inspectie daarover een rapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 10.3e.5.c
    text: |-
      stelt Onze Minister de raad van toezicht vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.6
    text: |-
      Indien het onderzoek, bedoeld in het vijfde lid, onder a, mede de kwaliteit van het onderwijs omvat, betrekt de
      inspectie het accreditatieorgaan bij haar onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
  - number: 10.3e.7
    text: |-
      Indien de hogeschool een functionele scheiding als bedoeld in [artikel 10.3d, zevende lid][ref1], heeft
      aangebracht, zijn het eerste tot en met het zesde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.3e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      Het instellingsbestuur van een hogeschool treft voorzieningen betreffende de beslechting van geschillen over
      beslissingen van organen van de hogeschool die niet reeds krachtens deze wet vatbaar zijn voor beroep.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.5
  - number: 10.8.1
    text: |-
      Een bijzondere hogeschool wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten het geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van
      winst te beogen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.8
  - number: 10.8.2
    text: |-
      Het bestuur van de rechtspersoon zendt elke wijziging van de statuten of reglementen binnen vier weken na
      vaststelling aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.8
  - number: 10.8.3
    text: Het college van bestuur verstrekt Onze minister de nodige inlichtingen omtrent de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.8
  - number: 10.16a.1
    text: 'Het college van bestuur besluit:'
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16a.1.a
    text: |-
      dat de [Wet op de ondernemingsraden][ref1] met uitzondering van [hoofdstuk VII B][ref2] van toepassing is op de
      hogeschool, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 10.16a.1.b
    text: dat de onder a bedoelde wet niet van toepassing is op de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16a.2
    text: |-
      Een besluit als bedoeld in het eerste lid, kan telkens opnieuw worden genomen, doch niet eerder dan nadat vijf
      jaren zijn verstreken sedert het van kracht worden van het vorige besluit terzake.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16a.3
    text: |-
      Het besluit, bedoeld in het eerste lid, aanhef en onderdeel a, stelt de [artikelen 10.17 tot en met 10.25][ref1]
      buiten werking voor de desbetreffende hogeschool. Dit besluit gaat gepaard met de vaststelling door het college
      van bestuur van een medezeggenschapsregeling ten behoeve van de studenten binnen de hogeschool, die ten minste
      gelijkwaardig is aan het bepaalde in de artikelen 10.17 tot en met 10.25.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.16a.4
    text: |-
      Ten gevolge van het besluit, bedoeld in het eerste lid aanhef en onderdeel b, is deze titel van toepassing op de
      desbetreffende hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16a.5
    text: |-
      In het geval dat het eerste lid, aanhef en onderdeel a, toepassing heeft gevonden, behoeft het college van bestuur
      de voorafgaande instemming van de ondernemingsraad voor het door het college van bestuur te nemen besluit met
      betrekking tot de keuze uit de medezeggenschapsstelsels, bedoeld in het eerste lid, alsmede voor vaststelling van
      de medezeggenschapsregeling, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16a.6
    text: |-
      De in de medezeggenschapsregeling vast te stellen medezeggenschapsstructuren sluiten zo veel mogelijk aan bij de
      organisatiestructuur, besluitvormingsprocedures en verantwoordelijkheidsverdelingen binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16a
  - number: 10.16b.1
    text: |-
      Indien een besluit als bedoeld in [artikel 10.16a, eerste lid, aanhef en onderdeel a][ref1], is genomen, is er
      aan een hogeschool een gezamenlijke vergadering verbonden. Van deze vergadering maken deel uit de leden van de
      ondernemingsraad en de leden van het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      artikel 10.16a, derde lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.16b.2
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van de gezamenlijke vergadering voor elk door hem te
      nemen besluit met betrekking tot de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
  - number: 10.16b.2.a
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.16b.2.b
    text: |-
      de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18, eerste lid][ref1],
      alsmede het voorgenomen beleid in het licht van de uitkomsten van de kwaliteitsbeoordeling, bedoeld in
      [artikel 2.9, tweede lid, tweede volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.16b.2.c
    text: |-
      het bestuurs- en beheersreglement, bedoeld in [artikel 10.3b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.16b.2.d
    text: |-
      de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref1], met uitzondering van het tweede lid, onderdelen a
      tot en met g, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 10.16b.3
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij of krachtens deze wet,
      een reglement voor de gezamenlijke vergadering vast. De [artikelen 10.21, tweede lid][ref1], en
      [10.22, aanhef en onderdelen f, g en j1][ref2], zijn van overeenkomstige toepassing. In het reglement kunnen worden
      geregeld de aangelegenheden waarover de gezamenlijke vergadering, onverminderd het tweede lid, instemmingsrecht
      heeft. In het reglement wordt, indien de aantallen leden van de ondernemingsraad en het orgaan, bedoeld in het
      eerste lid, niet gelijk zijn, tevens geregeld de wijze waarop voor beide geledingen wordt voorzien in gelijke
      invloed op de besluitvorming binnen de gezamenlijke vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.16b.4
    text: |-
      De gezamenlijke vergadering is bevoegd het college van bestuur ten minste twee maal per jaar uit te nodigen om het
      voorgenomen beleid te bespreken aan de hand van een door haar opgestelde agenda.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
  - number: 10.16b.5
    text: |-
      Het college van bestuur behoeft eveneens voorafgaande instemming van de gezamenlijke vergadering voor een besluit
      tot fusie als bedoeld in [artikel 16.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 10.16b.6
    text: |-
      Het college van bestuur stelt de gezamenlijke vergadering in de gelegenheid om tijdig voorafgaand aan het verzoek
      om instemming, bedoeld in het vierde lid, kennis te nemen van de opgestelde fusie-effectrapportage, bedoeld in
      [artikel 16.16a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.16b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 10.17.1
    text: |-
      Aan elke hogeschool is een medezeggenschapsraad verbonden. Indien een hogeschool één of meer faculteiten of andere
      organisatorische eenheden omvat is aan elke faculteit en aan elk van de desbetreffende eenheden een deelraad als
      bedoeld in [artikel 10.25][ref1], verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.17.2
    text: |-
      Het aantal leden van de raad bedraagt aan een hogeschool met minder dan 750 studenten ten hoogste tien leden, met
      750 tot 1250 studenten ten hoogste veertien leden en met 1250 of meer studenten ten hoogste vierentwintig leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
  - number: 10.17.3
    text: |-
      De raad bestaat voor de helft uit leden die uit en door het personeel worden gekozen, en voor de helft uit leden
      die uit en door de studenten worden gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
  - number: 10.17.4
    text: |-
      Zij die deel uitmaken van het instellingsbestuur, het college van bestuur, de bestuursraad, de centrale directie
      dan wel het bestuur van een faculteit of een andere organisatorische eenheid, kunnen niet tevens lid zijn van de
      raad.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
  - number: 10.17.5
    text: |-
      Kandidaten voor de verkiezingen van het deel van de raad dat uit en door het personeel wordt gekozen, kunnen worden
      gesteld door personeelsleden en door organisaties van personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
  - number: 10.17.6
    text: |-
      De verkiezing van de leden van de raad geschiedt bij geheime schriftelijke stemming. Stemming voor een geleding van
      de raad vindt slechts plaats, indien het aantal kandidaat-leden van een geleding groter is dan het aantal zetels
      ten behoeve van die geleding.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
  - number: 10.17.7
    text: |-
      De raad stelt een reglement op voor de zaken van huishoudelijke aard en regelt tevens de wijze waarop door het
      instellingsbestuur betaalde bedragen ten behoeve van de raad en de eventuele deelraden en commissies als bedoeld in
      [artikel 10.34][ref1], worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.17.8
    text: |-
      Voor de toepassing van het eerste lid kan het Ad-programma worden beschouwd als een
      organisatorische eenheid waaraan een deelraad als bedoeld in [artikel 10.25][ref1] is verbonden.
      Indien een deel van het Ad-programma wordt uitgevoerd door een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref2] wordt het personeel van die instelling
      voor de toepassing van het derde en het vijfde lid beschouwd als personeel van de hogeschool.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 10.19.1
    text: |-
      Het college van bestuur stelt de medezeggenschapsraad ten minste twee maal per jaar in de gelegenheid de algemene
      gang van zaken in de hogeschool met hem te bespreken. Het college van bestuur en de raad komen met elkaar bijeen,
      indien daarom onder opgave van redenen wordt verzocht door het college van bestuur, de raad of het deel van de raad
      dat uit en door het personeel of uit en door de studenten is gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.2
    text: |-
      De raad is bevoegd over alle aangelegenheden, de hogeschool betreffende, aan het college van bestuur voorstellen
      te doen en standpunten kenbaar te maken. Het college van bestuur brengt op de voorstellen, bedoeld in de eerste
      volzin, binnen drie maanden een schriftelijke, met redenen omklede reactie uit aan de raad in de vorm van een
      voorstel. Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie, stelt het college
      van bestuur de raad ten minste eenmaal in de gelegenheid met hem overleg te plegen over zijn voorstel.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.2a
    text: |-
      De raad is voorts bevoegd het college van bestuur ten minste twee maal per jaar uit te nodigen om het voorgenomen
      beleid te bespreken aan de hand van een door hem opgestelde agenda.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.3
    text: De raad bevordert naar vermogen openheid, openbaarheid en onderling overleg in de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.4
    text: |-
      De raad waakt voorts in de hogeschool in het algemeen tegen discriminatie op welke grond
      dan ook en bevordert in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede
      de inschakeling van personen met een handicap of chronische ziekte en allochtonen. Het
      medezeggenschapsreglement bepaalt of de raad een overeenkomstige bevoegdheid bezit als bedoeld in
      [artikel 10, tweede lid, aanhef en onderdeel d, van de Wet College voor de rechten van de mens][ref1].
      In dat geval is [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref2]
      van overeenkomstige toepassing voor wat betreft het onderscheid, bedoeld in die wet of in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.19.5
    text: |-
      Het college van bestuur verstrekt de raad aan het begin van het studiejaar schriftelijk de basisgegevens met
      betrekking tot de samenstelling van het college van bestuur dan wel de centrale directie, de organisatie binnen
      de hogeschool, de taakverdeling tussen college van bestuur en centrale directie en de hoofdpunten van het reeds
      vastgestelde beleid. Het college van bestuur stelt de raad ten minste eenmaal per jaar schriftelijk in kennis van
      het door hem in het afgelopen jaar gevoerde beleid en van de beleidsvoornemens voor het komende jaar ten aanzien
      van de hogeschool op financieel, organisatorisch en onderwijskundig gebied. Het college van bestuur stelt de
      medezeggenschapsraad onverwijld in kennis van voornemens met betrekking tot de aangelegenheden, beschreven in het
      plan, bedoeld in [artikel 10.20, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.19.6
    text: |-
      Onverminderd het vierde lid, verschaft het college van bestuur de raad, al dan niet gevraagd, tijdig alle
      inlichtingen die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. Daartoe worden in ieder geval
      begrepen ten minste eenmaal per jaar gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken per groep van de in de instelling werkzame personen, de leden van het college van bestuur, en de raad
      van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.7
    text: |-
      Indien bij een bepaalde vergadering of een onderdeel daarvan een bij uitstek persoonlijk belang van een van de
      leden van de raad in het geding is, kan de raad bepalen dat het betrokken lid aan die vergadering of dat onderdeel
      daarvan, niet deelneemt. De raad bepaalt dan tevens dat de behandeling van de desbetreffende aangelegenheid in een
      besloten vergadering plaatsheeft.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.8
    text: |-
      De raad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      hogeschool betrokkenen van het verslag kennis kunnen nemen. De raad draagt er zorg voor dat de agenda’s en
      verslagen van de vergaderingen van de raad worden toegezonden aan het college van bestuur, aan de deelraden, aan
      de eventuele commissies en aan de eventuele gemeenschappelijke medezeggenschapsraad en ter inzage worden gelegd
      op een algemeen toegankelijke plaats op de hogeschool ten behoeve van belangstellenden. De raad stelt de in de
      vorige volzin bedoelde commissies ten minste eenmaal per jaar in de gelegenheid om over aangelegenheden die de
      desbetreffende commissie in het bijzonder aangaan, met hem overleg te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.9
    text: |-
      Het college van bestuur draagt er jegens de medezeggenschapsraad zorg voor dat de leden van de raad niet uit hoofde
      van hun lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de hogeschool. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van kandidaat-leden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel10.19
  - number: 10.19.10
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een aan de hogeschool werkzame persoon mag geen
