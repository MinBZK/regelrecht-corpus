  - number: 9.38c.g
    text: geledingen van de organen onder a tot en met f.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.38c
  - number: 9.39.1
    text: |-
      Er is een geschillencommissie medezeggenschap hoger onderwijs die bestaat uit drie leden, onder wie een voorzitter,
      en drie plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.39
  - number: 9.39.2
    text: Onze minister benoemt de leden en plaatsvervangende leden voor vier jaar. Zij zijn een keer herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.39
  - number: 9.39.3
    text: |-
      Voor de benoeming, bedoeld in het tweede lid, dragen de gezamenlijke instellingen en vertegenwoordigers van de
      medezeggenschapsorganen elk een lid en een plaatsvervangend lid voor. Die twee leden dragen een derde lid, tevens
      voorzitter, en diens plaatsvervanger voor.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.39
  - number: 9.39.4
    text: De leden functioneren zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.39
  - number: 9.40.1
    text: |-
      De geschillencommissie, bedoeld in [artikel 9.39][ref1], neemt kennis van geschillen tussen een
      medezeggenschapsorgaan en het college van bestuur of de decaan over:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel9.40
    references:
