  - number: '18.76'
    text: |-
      [Artikel 2.15][ref1] zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van artikel I, onderdeel X, van
      de wet van 4 februari 2010 (Stb. 119), blijft tot een bij koninklijk besluit te bepalen tijdstip van toepassing,
      met dien verstande dat het vierde lid uitsluitend geldt voor de borging van de lopende leningen die hogescholen
      zijn aangegaan met het oog op de overdracht van het economisch claimrecht als bedoeld in de wet van 11 november
      1993, Stb. 629, houdende wijziging van de Wet op het hoger onderwijs en wetenschappelijk onderzoek in verband
      met decentralisatie van huisvestings- en bestedingsbeslissingen en regeling van de overname van het economisch
      claimrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2015-01-01#Artikel18.76
    references:
