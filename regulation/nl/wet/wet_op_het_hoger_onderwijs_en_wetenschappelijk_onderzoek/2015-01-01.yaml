      [artikel 141 van de Wet primair onderwijs BES][ref2], [artikel 162i van de Wet op de expertisecentra][ref3],
      [artikel 118o van de Wet op het voortgezet onderwijs][ref4] of
      [artikel 201 van de Wet voortgezet onderwijs BES][ref5].


