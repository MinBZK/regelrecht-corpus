  - number: 6.13.4.p
    text: het tijdstip waarop voor het eerst inschrijving voor de opleiding mogelijk is,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
  - number: 6.13.4.q
    text: |-
      indien de opleiding niet langer zal worden verzorgd, het tijdstip waarop de registratie zal worden beëindigd,
      alsmede het tijdstip waarop voor het eerst inschrijving in de propedeutische fase van de opleiding of, indien
      die fase niet is ingesteld, de eerste periode in een bacheloropleiding in het wetenschappelijk onderwijs met een
      studielast van 60 studiepunten, niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
  - number: 6.13.5
    text: |-
      Het Centraal register opleidingen hoger onderwijs bevat van elke opleiding als bedoeld in [artikel 7.3b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.13.5.a
    text: de naam van de opleiding en de rechtspersoon waarvan de opleiding uitgaat, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
  - number: 6.13.5.b
    text: de gegevens, bedoeld in het vierde lid, onderdelen c, m en n.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
  - number: 6.13.6
    text: |-
      Onze minister legt het ontwerp van de algemene maatregel van bestuur, bedoeld in het derde lid, voor aan de Tweede
      Kamer der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet gedaan dan nadat dertig
      dagen na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Het instellingsbestuur kan een opleiding na de verlening van accreditatie aanmelden voor registratie. Het
      instellingsbestuur kan een opleiding die de instelling voornemens is te verzorgen, aanmelden voor registratie,
      nadat die opleiding de toets nieuwe opleiding met positief gevolg heeft ondergaan. In afwijking van de tweede
      volzin kan het instellingsbestuur een masteropleiding in het hoger beroepsonderwijs eerst laten registreren, indien
      ten aanzien van die opleiding toepassing is gegeven aan [artikel 7.3a, tweede lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.14.2
    text: |-
      De aanmelding geschiedt onder vermelding van de gegevens, bedoeld in [artikel 6.13, vierde lid][ref1]. Bij de
      aanmelding van een geaccrediteerde opleiding, voegt het instellingsbestuur het accreditatierapport, bedoeld
      in [artikel 5a.10, eerste lid][ref2]. Bij de aanmelding van een opleiding die de toets nieuwe opleiding met
      positief gevolg heeft ondergaan, voegt het instellingsbestuur het rapport van de toets nieuwe opleiding en
      bewijst door middel van een voornemen als bedoeld in [artikel 6.2, eerste lid][ref3], of een besluit als
      bedoeld in [artikel 6.2, derde lid][ref4], dat er geen sprake is van een ondoelmatige taakverdeling tussen de
      instellingen. Indien de indeling van het Centraal register opleidingen hoger onderwijs naar het oordeel van het
      instellingsbestuur niet voldoet, volstaat het instellingsbestuur met een aanduiding van het onderdeel dat naar zijn
      oordeel het gebied van de opleiding het best omschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.14.3
    text: |-
      De Informatie Beheer Groep registreert binnen een redelijke termijn de opleiding overeenkomstig de door het
      instellingsbestuur verstrekte gegevens in het Centraal register opleidingen hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
  - number: 6.14.4
    text: |-
      Indien de gegevens niet volledig zijn of de indeling in het Centraal register opleidingen hoger onderwijs naar het
      oordeel van Onze minister in redelijkheid niet passend kan worden geacht voor de opleiding, stelt de Informatie
      Beheer Groep het instellingsbestuur in de gelegenheid om, binnen een door de Informatie Beheer Groep te bepalen
      termijn, te voorzien in de ontbrekende gegevens onderscheidenlijk de indeling te herzien. Indien het betreft de
      gegevens, bedoeld in het tweede lid, derde volzin, stelt de Informatie Beheer Groep de termijn vast binnen de
      termijn, bedoeld in [artikel 5a.11, vijfde lid, onderdeel a][ref1]. Onverminderd [artikel 6.15][ref2] weigert de
      Informatie Beheer Groep registratie in het register uitsluitend, indien de Informatie Beheer Groep de gegevens
      binnen deze termijn niet of niet volledig heeft ontvangen en indien de herziene indeling naar het oordeel van Onze
      minister in redelijkheid niet passend geoordeeld kan worden voor de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.14.5
    text: |-
      De Informatie Beheer Groep stelt het instellingsbestuur zo spoedig mogelijk op de hoogte van een besluit houdende
      weigering van registratie als bedoeld in het vierde lid. Indien de weigering gegrond is op de indeling van de
      opleiding, maakt Onze minister het besluit houdende weigering van de registratie bekend en doet daarvan mededeling
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
  - number: 6.14.6
    text: |-
      Dit artikel is van overeenkomstige toepassing bij wijziging van de gegevens, bedoeld in
      [artikel 6.13, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.15.1
    text: |-
      De Informatie Beheer Groep beëindigt de registratie van een opleiding als bedoeld in [artikel 7.3a][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
    references:
