      Indien binnen een door het college van bestuur te bepalen termijn het faculteitsreglement niet of niet volledig is
      vastgesteld, stelt het college van bestuur het reglement of het ontbrekende gedeelte daarvan vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.14
  - number: 9.15.1
    text: |-
