    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.14
  - number: 1.14.2.c
    text: het bestuur en de inrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.14
  - number: 1.15.1
    text: 'De volgende bepalingen regelen de academische ziekenhuizen bij de openbare universiteiten:'
