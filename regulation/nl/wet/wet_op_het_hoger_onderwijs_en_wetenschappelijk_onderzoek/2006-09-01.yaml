  - number: 18.32.1
    text: |-
      Aan de door Onze minister aan te wijzen masteropleidingen, bedoeld in [artikel 7.3b][ref1], verbonden aan de
      hieronder vermelde instellingen, is accreditatie verbonden tot en met 31 december 2007:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
