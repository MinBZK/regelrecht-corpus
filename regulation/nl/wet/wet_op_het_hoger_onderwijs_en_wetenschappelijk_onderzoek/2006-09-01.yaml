        hoofdstuk: '7'
        paragraaf: '2'
  - number: '18.1'
    text: |-
      In afwijking van [artikel 5a.6, eerste lid][ref1], bepaalt Onze minister in het eerste jaar na inwerkingtreding
      van de wet van 6 juni 2002 (Stb. 302) het tijdstip waarvoor het accreditatieorgaan de ontwerpbegroting voor het
      daaropvolgende jaar zendt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.2.1
    text: |-
      Het instellingsbestuur meldt uiterlijk 30 dagen na de dag van inwerkingtreding van de wet van 6 juni 2002 (Stb.
      302) aan de Informatie Beheer Groep, wanneer de beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], van een
      opleiding voor het laatst heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.2.2
    text: |-
      De Informatie Beheer Groep maakt de uit de [artikelen 18.27 tot en met 18.30][ref1] voortvloeiende wijzigingen in
      het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13](onbekend), bekend binnen vier maanden
      na de dag van inwerkingtreding van de wet van 6 juni 2002 (Stb. 302). Van deze bekendmaking wordt mededeling gedaan
      in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '6'
  - number: '18.3'
    text: |-
      Onderzoek dat wordt verricht naar de kwaliteit van de werkzaamheden van een instelling op grond van
      [artikel 1.18, tweede lid][ref1], zoals dat luidde op de dag voor de inwerkingtreding van de wet van 6 juni 2002
      (Stb. 302) wordt afgerond met in achtneming van de wet zoals die luidde voor de dag van inwerkingtreding van de
      eerdergenoemde wet van 6 juni 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.4.1
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit op grond van de
      [artikelen 6.4][ref1], [6.5][ref2], [6.8][ref3], [6.10][ref4] en [6.11][ref5] of onderdelen daarvan, dat is genomen
      voor de datum van het vervallen van die artikelen, blijft het recht zoals het gold voor die datum van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
