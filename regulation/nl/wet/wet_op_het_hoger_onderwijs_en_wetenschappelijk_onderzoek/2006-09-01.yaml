  - number: 18.5.1
    text: |-
      Onze minister zendt binnen vijf jaar na de inwerkingtreding van de wet van 6 juni 2002 (Stb. 302) aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten in de praktijk van die wet.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.5
  - number: 18.5.2
    text: |-
      Onze minister zendt binnen vijf jaar na de inwerkingtreding van de wet van 6 juni 2002 (Stb. 302) en vervolgens
      telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het
      functioneren van het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.5
  - number: '18.6'
    text: |-
      Onverminderd [artikel 18.15, tweede lid][ref1], kunnen met ingang van 1 september 2002 aan een bekostigde of
      aangewezen universiteit of aan de Open Universiteit geen nieuwe opleidingen in het wetenschappelijk onderwijs als
      bedoeld in [artikel 7.3][ref2], zoals dat artikel op 31 augustus 2002 luidde, meer worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.7.1
    text: |-
      Met ingang van het studiejaar 2002–2003 kan aan een bekostigde of aangewezen universiteit of aan de Open
      Universiteit onderwijs worden verzorgd in bacheloropleidingen, bedoeld in [artikel 7.3a, eerste lid, onder a][ref1],
      en in masteropleidingen, bedoeld in [artikel 7.3a, eerste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.7.2
    text: |-
      Indien het instellingsbestuur van een instelling als bedoeld in het eerste lid met betrekking tot een opleiding
      in het wetenschappelijk onderwijs die in het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref1], is geregistreerd, in een bepaald studiejaar voornemens is de bachelor-masterstructuur in te
      voeren, stelt hij een bacheloropleiding in en zonodig een of meer daarop aansluitende masteropleidingen. Het aantal
      in te stellen masteropleidingen is gelijk aan ten hoogste het aantal afstudeerrichtingen dat op 31 augustus 2002
      in de onderwijs- en examenregeling van de opleiding in het wetenschappelijk onderwijs, bedoeld in de eerste volzin,
      was beschreven. De in te stellen bachelor- en masteropleidingen zijn samengesteld uit programmaonderdelen die in
      het studiejaar voorafgaand aan de instelling van die opleidingen door de instelling werden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.7.3
    text: |-
      [Artikel 7.4a, zevende lid][ref1], blijft ten aanzien van een masteropleiding in het wetenschappelijk
      onderwijs als bedoeld in [artikel 7.13, derde lid][ref2], op het moment van instelling van die opleiding
      buiten toepassing. De eerste volzin is niet van toepassing op een masteropleiding die een voortzetting vormt
      van een opleiding ten aanzien waarvan het instellingsbestuur uiterlijk op 1 september 2001 met toepassing van
      [artikel 7.4, zevende lid][ref3], zoals die bepaling op die datum luidde, heeft bepaald dat de desbetreffende
      opleiding een grotere studielast had dan 168 studiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.7.4
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt met ingang van het tijdstip, vastgesteld bij het in
      [artikel 18.15, eerste lid][ref1], bedoelde koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '3'
  - number: 18.7.5
    text: |-
      De [artikelen 6.2 tot en met 6.14][ref1] zijn niet van toepassing op de instelling van de in dit artikel bedoelde
      bachelor- en masteropleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.8.1
    text: |-
      In het studiejaar 2002–2003, het studiejaar 2003–2004 of het studiejaar 2004–2005 kan het instellingsbestuur van
      een bekostigde of aangewezen universiteit dat voornemens is met betrekking tot een of meer opleidingen in het
      wetenschappelijk onderwijs de bachelor-masterstructuur in te voeren, naast de bacheloropleidingen een of meer
      bacheloropleidingen instellen, waarvan de programmaonderdelen tot het gebied van meer dan een opleiding of meer dan
      een faculteit behoren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.8
  - number: 18.8.2
    text: Artikel 18.7, vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.8
  - number: 18.9.1
    text: |-
      Het instellingsbestuur van een bekostigde of aangewezen universiteit dat met betrekking tot een opleiding in het
      wetenschappelijk onderwijs waaraan een afstudeerrichting is verbonden als bedoeld in artikel 7.5, eerste lid,
      onder b, zoals die bepaling op 31 augustus 2002 luidde, voornemens is de bachelor-masterstructuur in te voeren, is
      bevoegd in een bepaald studiejaar in plaats van een masteropleiding in het wetenschappelijk onderwijs als bedoeld
      in artikel 18.7, tweede lid, een opleiding als bedoeld in artikel 7.4a, derde lid, eerste volzin, in te stellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.9
  - number: 18.9.2
    text: |-
      Het instellingsbestuur van een universiteit waaraan een opleiding als bedoeld in artikel 7.5, eerste lid, onder a,
      zoals die bepaling op 31 augustus 2002 luidde, is verbonden, is bevoegd in een bepaald studiejaar een opleiding als
      bedoeld in artikel 7.4a, derde lid, eerste volzin, in te stellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.9
  - number: 18.9.3
    text: Artikel 18.7, derde tot en met vijfde lid, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.9
  - number: 18.10.1
    text: |-
      Het instellingsbestuur van een universiteit of het college van bestuur van de Open Universiteit behoeft de
      voorafgaande instemming van de faculteitsraad of de studentenraad, bedoeld in artikel 11.13, voor een door
      het instellingsbestuur of het college van bestuur te nemen besluit met betrekking tot de datum van gehele of
      gedeeltelijke invoering van de bachelor-masterstructuur voor een faculteit of de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.2
    text: |-
      De faculteitsraad of de studentenraad bericht het instellingsbestuur van een universiteit of het college van
      bestuur van de Open Universiteit binnen zes weken na het verzoek om instemming of hij al dan niet instemt met het
      voorgenomen besluit van het instellingsbestuur of het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.3
    text: |-
      Indien het instellingsbestuur van een universiteit de vereiste instemming niet verwerft en hij zijn voorgenomen
      besluit wenst te handhaven, legt dat bestuur het geschil onverwijld voor aan de commissie voor geschillen, bedoeld
      in artikel 9.39. De artikelen 9.40, vijfde lid, en 9.41 zijn van overeenkomstige toepassing. De commissie voor
      geschillen doet een uitspraak binnen uiterlijk vier weken, nadat het geschil door het instellingsbestuur aan de
      commissie is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.4
    text: |-
      Indien het college van bestuur van de Open Universiteit de vereiste instemming niet verwerft en hij zijn
      voorgenomen besluit wenst te handhaven, legt hij het geschil onverwijld voor aan de raad van toezicht van die
      instelling. Artikel 11.16, tweede lid, is van toepassing. De raad van toezicht neemt een besluit binnen uiterlijk
      vier weken, nadat het geschil door het college van bestuur aan de raad is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.5
    text: |-
      Indien 1 september 2002 geldt als de voorgenomen datum van invoering van de bachelor-masterstructuur, wordt
      het verzoek om instemming als bedoeld in het eerste lid voor 25 juni 2002 door het instellingsbestuur van een
      universiteit bij de faculteitsraad of door het college van bestuur van de Open Universiteit bij de studentenraad
      ingediend. In afwijking van het tweede lid wordt de mededeling, bedoeld in die volzin, binnen drie weken gedaan. In
      afwijking van het derde lid doet de commissie voor geschillen binnen twee weken een uitspraak. In afwijking van het
      vierde lid neemt de raad van toezicht van de Open Universiteit binnen twee weken een besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.6
    text: |-
      Dit artikel is voor het studiejaar 2002–2003 niet van toepassing, indien het Staatsblad waarin de wet van 6
      juni 2002 tot wijziging van onder meer de Wet op het hoger onderwijs en wetenschappelijk onderzoek en de Wet
      studiefinanciering 2000 in verband met de invoering van de bachelor-masterstructuur in het hoger onderwijs wordt
      geplaatst, niet is uitgegeven voor 21 juni 2002.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.10.7
    text: |-
      Indien de universiteitsraad van een universiteit reeds betrokken is geweest bij de voorbereiding van de gehele
      of gedeeltelijke invoering van de bachelor-masterstructuur in die universiteit, kan het instellingsbestuur,
      in afwijking van het eerste lid, met betrekking tot een besluit als bedoeld in het eerste lid in plaats van de
      faculteitsraad de universiteitsraad om instemming als bedoeld in dat lid verzoeken. In het geval dat de eerste
      volzin toepassing heeft gevonden, wordt in het eerste, tweede, derde en vijfde lid «faculteitsraad» vervangen door:
      universiteitsraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.10
  - number: 18.11.1
    text: |-
      Het instellingsbestuur, bedoeld in artikel 18.7, artikel 18.8 of artikel 18.9 dat een bacheloropleiding in
      het wetenschappelijk onderwijs dan wel een of meer daarop aansluitende masteropleidingen met het oog op de
      verzorging van dat onderwijs met ingang van het studiejaar 2002–2003 heeft ingesteld, meldt die opleiding
      of die opleidingen uiterlijk op 1 augustus 2002 aan bij de Informatie Beheer Groep voor registratie in het
      Centraal register opleidingen hoger onderwijs. Bij de aanmelding verstrekt het instellingsbestuur de gegevens,
      bedoeld in [artikel 6.14, tweede lid][ref1], met uitzondering van het accreditatierapport, bedoeld in
      [artikel 5a.10][ref2], en het voornemen, bedoeld in [artikel 6.2, eerste lid][ref3], of het besluit, bedoeld in
      [artikel 6.2, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.11.2
    text: |-
      De Informatie Beheer Groep registreert de opleidingen overeenkomstig de door het instellingsbestuur verstrekte
      gegevens in het Centraal register opleidingen hoger onderwijs dat betrekking heeft op het studiejaar 2002–2003.
      Onverminderd [artikel 6.13, vierde lid][ref1], bevat het register van elke opleiding het tijdstip waarop voor het
      eerst inschrijving voor de opleiding mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.11.3
    text: |-
      Indien de gegevens niet volledig zijn, stelt de Informatie Beheer Groep het instellingsbestuur in de gelegenheid om
      uiterlijk 15 augustus 2002 te voorzien in de ontbrekende gegevens.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.11
  - number: 18.11.4
    text: |-
      De Informatie Beheer Groep weigert registratie in het Centraal register opleidingen hoger onderwijs uitsluitend,
      indien hij de gegevens uiterlijk 15 augustus 2002 niet of niet volledig heeft ontvangen. De Informatie Beheer
      Groep stelt het instellingsbestuur zo spoedig mogelijk op de hoogte van een besluit houdende weigering van de
      registratie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.11
  - number: 18.11.5
    text: |-
      De Informatie Beheer Groep maakt voor 1 september 2002 het Centraal register opleidingen hoger onderwijs in
      verband met de invoering van de bachelor-masterstructuur bekend. Van deze bekendmaking wordt mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.11
  - number: 18.12.1
    text: |-
      Het instellingsbestuur, bedoeld in [artikel 18.7][ref1], [artikel 18.8][ref2] of [artikel 18.9][ref3] dat een
      bacheloropleiding in het wetenschappelijk onderwijs dan wel een of meer daarop aansluitende masteropleidingen
      met het oog op de verzorging van dat onderwijs met ingang van het studiejaar 2003–2004 heeft ingesteld, meldt die
      opleiding of die opleidingen uiterlijk op 28 februari 2003 aan bij de Informatie Beheer Groep voor registratie in
      het Centraal register opleidingen hoger onderwijs. Bij de aanmelding verstrekt het instellingsbestuur de gegevens,
      bedoeld in [artikel 6.13, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 18.12.2
    text: |-
      [Artikel 18.11, tweede lid][ref1], is van toepassing met dien verstande dat de registratie betrekking heeft op het
      studiejaar 2003–2004.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
  - number: 18.12.3
    text: |-
      [Artikel 18.11, derde en vierde lid][ref1], is van toepassing met dien verstande dat het uiterste tijdstip 31 mei
      2003 is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
  - number: 18.12.4
    text: |-
      De Informatie Beheer Groep maakt voor 1 juli 2003 met betrekking tot het Centraal register opleidingen hoger
      onderwijs de volgende wijzigingen bekend: a. de uit het tweede lid voortvloeiende wijzigingen, en b. de verschillen
      tussen het Centraal register opleidingen hoger onderwijs dat betrekking heeft op het studiejaar 2002–2003, en het
      Centraal register opleidingen hoger onderwijs dat betrekking heeft op het studiejaar 2003–2004 zoals bekendgemaakt
      voor 1 juli 2002. Van deze bekendmaking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.12
  - number: 18.13.1
    text: |-
      Het instellingsbestuur, bedoeld in artikel 18.7, artikel 18.8 of artikel 18.9 dat een bacheloropleiding in het
      wetenschappelijk onderwijs dan wel een of meer daarop aansluitende masteropleidingen met het oog op de verzorging
      van dat onderwijs met ingang van het studiejaar 2004–2005 of een later studiejaar heeft ingesteld, meldt die
      opleiding of die opleidingen aan bij de Informatie Beheer Groep voor registratie in het Centraal register
      opleidingen hoger onderwijs. Bij de aanmelding verstrekt het instellingsbestuur de gegevens, bedoeld in artikel
      6.13, vierde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.13
  - number: 18.13.2
    text: |-
      Artikel 18.11, tweede lid, is van toepassing met dien verstande dat de registratie betrekking heeft op het
      studiejaar 2004–2005 of op het desbetreffende latere studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.13
  - number: 18.13.3
    text: Artikel 6.14, vierde lid, eerste en tweede volzin, en vijfde lid, eerste volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.13
  - number: 18.14.1
    text: |-
      Indien het instellingsbestuur, bedoeld in artikel 18.7 of artikel 18.9 toepassing heeft gegeven aan het tweede
      lid van die artikelen, houdt hij de opleiding in het wetenschappelijk onderwijs in stand tot een zodanig tijdstip
      dat de voor de opleiding ingeschreven studenten en extraneï de opleiding aan dezelfde instelling of aan een andere
      instelling binnen een redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.14
  - number: 18.14.2
    text: |-
      Met ingang van het in artikel 18.7, tweede lid, bedoelde studiejaar worden geen studenten of extraneï voor
      de eerste maal voor de propedeutische fase van de desbetreffende opleiding in het wetenschappelijk onderwijs
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.14
  - number: 18.14.3
    text: |-
      Op een in dit artikel bedoelde opleiding en de daarvoor ingeschreven studenten en extraneï blijven de voorschriften
      van deze wet en de daarop gebaseerde uitvoeringsregelingen, zoals die op 31 augustus 2002 luidden, van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.14
  - number: 18.14.4
    text: |-
      In afwijking van het derde lid zijn met betrekking tot het toezicht op een in dat lid bedoelde opleiding de
      voorschriften van de [Wet op het onderwijstoezicht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 18.15.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde of aangewezen universiteit of
      aan de Open Universiteit opleidingen als bedoeld in artikel 7.3, zoals dat artikel op 31 augustus 2002 luidde,
      worden verzorgd, voorzover die opleidingen op 31 augustus 2002 aan die instelling zijn verbonden. Het tijdstip,
      vastgesteld bij het in de eerste volzin bedoelde koninklijk besluit, is 1 september van enig jaar. Het koninklijk
      besluit wordt vastgesteld en bekendgemaakt voor 1 september van het jaar dat voorafgaat aan het tijdstip,
      vastgesteld bij dat besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.15
  - number: 18.15.2
    text: |-
      Onder de opleidingen, bedoeld in het eerste lid, worden mede begrepen de opleidingen die zijn ingesteld en
      geregistreerd in het Centraal register opleidingen hoger onderwijs dan wel tijdig voor registratie in dat register
      zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.15
  - number: 18.15.3
    text: |-
      Met ingang van het tijdstip, vastgesteld bij het in het eerste lid bedoelde koninklijk besluit, worden geen
      studenten of extraneï voor de eerste maal voor de propedeutische fase van een opleiding als bedoeld in dit artikel
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.15
  - number: 18.16.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde of aangewezen universiteit
      universitaire eerstegraads lerarenopleidingen als bedoeld in artikel 7.4, vierde lid, zoals die bepaling op
      31 augustus 2002 luidde, worden verzorgd, voorzover die opleidingen op 31 augustus 2002 aan die instelling zijn
      verbonden. Artikel 18.15, eerste lid, tweede en derde volzin, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.16
  - number: 18.16.2
    text: Artikel 18.15, tweede en derde lid, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.16
  - number: '18.17'
    text: |-
      Indien het koninklijk besluit, bedoeld in artikel 18.15 of artikel 18.16, tot stand is gekomen, bepaalt Onze
      minister voor elke opleiding als bedoeld in genoemd artikellid of voor een groep van die opleidingen, met ingang
      van welk tijdstip de rechten, bedoeld in de artikelen 1.9 en 1.12, vervallen. Dat tijdstip wordt zodanig bepaald
      dat de voor de opleiding ingeschreven studenten en extraneï de opleiding aan dezelfde instelling of aan een andere
      instelling binnen een redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.17
  - number: 18.18.1
    text: |-
      Op de in artikel 18.15 of artikel 18.16 bedoelde opleidingen en de daarvoor ingeschreven studenten en extraneï
      blijven de voorschriften van deze wet en de daarop gebaseerde uitvoeringsregelingen, zoals die op 31 augustus 2002
      luidden, van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.18
  - number: 18.18.2
    text: |-
      De studielast van de volgende opleidingen, bedoeld in artikel 18.15, bedraagt 300 studiepunten: - life science and
      technology aan de openbare universiteit te Delft,
        - telematica aan de openbare universiteit te Enschede, en
        - voeding en gezondheid aan de openbare universiteit te Wageningen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.18
  - number: 18.18.3
    text: |-
      In afwijking van het eerste lid zijn met betrekking tot het toezicht op de in dat lid bedoelde opleidingen de
      voorschriften van de [Wet op het onderwijstoezicht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.18
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 18.19.1
    text: |-
      De opleidingen in het hoger beroepsonderwijs waarvan de studielast op 31 augustus 2002 168 studiepunten bedroeg,
      zijn met ingang van 1 september 2002 bacheloropleidingen als bedoeld in artikel 7.3a, tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.19
  - number: 18.19.2
    text: |-
      Onder de opleidingen, bedoeld in het eerste lid, worden mede begrepen de opleidingen die zijn ingesteld en
      geregistreerd in het Centraal register opleidingen hoger onderwijs dan wel tijdig voor registratie in dat register
      zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.19
  - number: 18.20.1
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kunnen aan een bekostigde hogeschool opleidingen in het hoger
      beroepsonderwijs als bedoeld in artikel 7.4, vierde en vijfde lid, zoals die artikelleden op 31 augustus 2002
      luidden, worden verzorgd, voorzover die opleidingen op 31 augustus 2002 aan die hogeschool zijn verbonden. Artikel
      18.15, eerste lid, tweede en derde volzin, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.20
  - number: 18.20.2
    text: Artikel 18.15, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.20
  - number: 18.20.3
    text: |-
      Het in het eerste lid bedoelde tijdstip kan voor de onderscheiden opleidingen verschillend worden bepaald.
      Indien toepassing wordt gegeven aan de eerste volzin, wordt dat besluit niet eerder genomen dan nadat voor
      de desbetreffende opleiding een besluit als bedoeld in artikel 7.3a, tweede lid, is genomen, waarbij een
      masteropleiding is aangemerkt die een voortzetting vormt van eerstbedoelde opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.20
  - number: 18.20.4
    text: |-
      Indien een besluit als bedoeld artikel 7.3a, tweede lid, betrekking heeft op een masteropleiding die een
      voortzetting vormt van een opleiding als bedoeld in artikel 7.4, vierde en vijfde lid, zoals die artikelleden
      op 31 augustus 2002 luidden, bedraagt de studielast van die opleiding het aantal studiepunten, genoemd in die
      artikelleden, vermenigvuldigd met de factor 1,43. De uitkomst daarvan wordt voorzover nodig rekenkundig afgerond.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.20
  - number: '18.21'
    text: |-
      De artikelen 18.17 en 18.18 zijn van overeenkomstige toepassing op de opleidingen, bedoeld in artikel 18.20, en de
      daarvoor ingeschreven studenten en extraneï.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.21
  - number: 18.22.1
    text: |-
      De Informatie Beheer Groep registreert de opleidingen, bedoeld in artikel 18.19, in het Centraal register
      opleidingen hoger onderwijs dat betrekking heeft op het studiejaar 2002–2003.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.22
  - number: 18.22.2
    text: |-
      De Informatie Beheer Groep beëindigt de registratie van de opleidingen in het hoger beroepsonderwijs met
      uitzondering van de opleidingen, bedoeld in artikel 18.20, eerste lid, met ingang van 1 september 2002.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.22
  - number: 18.22.3
    text: |-
      De Informatie Beheer Groep maakt de uit het eerste en tweede lid voortvloeiende wijzigingen bekend in het Centraal
      register opleidingen hoger onderwijs, bedoeld in artikel 18.11, vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.22
  - number: 18.23.1
    text: |-
      Indien voor een bepaald studiejaar met betrekking tot een opleiding in het wetenschappelijk onderwijs toepassing
      is gegeven aan artikel 18.7, artikel 18.8 of artikel 18.9, wordt voor de desbetreffende bacheloropleiding of
      masteropleiding de studielast van die opleidingen met ingang van dat studiejaar uitgedrukt in studiepunten
      overeenkomstig artikel 7.4a.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.23
  - number: 18.23.2
    text: |-
      Met betrekking tot de bacheloropleidingen in het hoger beroepsonderwijs en de masteropleidingen in het hoger
      beroepsonderwijs, bedoeld in artikel 7.3a, tweede lid, onder b, wordt de studielast van die opleidingen met ingang
      van het studiejaar 2002–2003 uitgedrukt in studiepunten overeenkomstig artikel 7.4b.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.23
  - number: 18.23.3
    text: |-
      Met betrekking tot de opleidingen, bedoeld in artikel 18.14, de opleidingen, bedoeld in artikel 18.15, en de
      opleidingen, bedoeld in artikel 18.20, wordt de studielast van die opleidingen met ingang van het studiejaar 2002–
      2003 uitgedrukt in studiepunten overeenkomstig artikel 7.4, tweede tot en met zesde lid, zoals die artikelleden
      luidden op 31 augustus 2002, vermenigvuldigd met de factor 1,43. De uitkomst daarvan wordt voorzover nodig
      rekenkundig afgerond.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.23
  - number: '18.24'
    text: |-
      Het instellingsbestuur wijzigt voor 1 september 2004 van de onderwijs- en examenregeling het onderdeel, bedoeld in
      artikel 7.13, tweede lid, onder e.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.24
  - number: 18.25.1
    text: |-
      De omrekenfactor voor de omzetting van studiepunten als bedoeld in artikel 7.4, zoals dat artikel luidde op
      31 augustus 2002, in studiepunten als bedoeld in de artikelen 7.4a en 7.4b is het getal 1,43.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.25
  - number: 18.25.2
    text: De uitkomst van de omzetting van studiepunten wordt rekenkundig afgerond op een decimaal achter de komma.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.25
  - number: '18.26'
    text: |-
      Het instellingsbestuur deelt een student of extraneus desgevraagd mee het aantal studiepunten, bedoeld in de
      artikelen 7.4a en 7.4b, dat hij tot en met 31 augustus 2002 heeft behaald. Het instellingsbestuur waarborgt daarbij
      dat de rechten die een student of extraneus kan ontlenen aan de voor 1 september 2002 behaalde studiepunten, door
      deze omrekening niet minder kunnen worden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.26
  - number: '18.27'
    text: |-
      Aan de bacheloropleidingen, bedoeld in [artikel 7.3a, eerste lid, onder a][ref1], en de masteropleidingen, bedoeld
      in artikel 7.3a, eerste lid, onder b, die met ingang van enig studiejaar worden verzorgd en in het Centraal
      register opleidingen hoger onderwijs zijn opgenomen, is accreditatie verbonden als bedoeld in [artikel 5a.9][ref2]
      tot en met 31 december 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 18.28.1
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.15, die een voortzetting vormen van opleidingen die voor de dag van
      de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn geregistreerd in het Centraal register
      opleidingen hoger onderwijs, en waarvan de beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], heeft
      plaatsgevonden voor 1 januari 2000, is accreditatie verbonden tot en met 31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.28.2
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.15, die een voortzetting vormen van opleidingen die voor de dag van
      de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn geregistreerd in het Centraal register
      opleidingen hoger onderwijs, is accreditatie verbonden tot en met 31 december van het zesde jaar na de laatste
      beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], indien die beoordeling heeft plaatsgevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 18.28.2.a
    text: na 31 december 1999 en voor 1 januari 2004, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.28
  - number: 18.28.2.b
    text: |-
      na 1 januari 2004 en de instelling aantoont dat op 1 december 2001 de start van die beoordeling was gepland op een
      datum die eerder is dan de eerste plaatsing van de accreditatiekaders in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.28
  - number: 18.28.3
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.15, die een voortzetting vormen van opleidingen die blijkens het Centraal
      register opleidingen hoger onderwijs zijn gestart met ingang van het studiejaar 2000–2001 of het studiejaar 2001–
      2002, is accreditatie verbonden tot en met 31 december van het kalenderjaar zes jaar na de start van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.28
  - number: 18.29.1
    text: |-
      Aan de bacheloropleidingen, bedoeld in [artikel 7.3a, tweede lid, onder a][ref1], die een voortzetting vormen
      van opleidingen die voor de dag van de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn
      geregistreerd in het Centraal register opleidingen hoger onderwijs, en waarvan de beoordeling, bedoeld in
      [artikel 1.18, eerste lid][ref2], heeft plaatsgevonden voor 1 januari 2000, is accreditatie verbonden tot en met
      31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.29
