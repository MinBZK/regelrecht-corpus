    text: de Koninklijke Nederlandse Akademie van Wetenschappen te Amsterdam en de Koninklijke Bibliotheek te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.2
  - number: 1.3.1
    text: |-
      Universiteiten zijn gericht op het verzorgen van wetenschappelijk onderwijs en het verrichten van wetenschappelijk
      onderzoek. In elk geval verzorgen zij initiële opleidingen in het wetenschappelijk onderwijs, verrichten zij
      wetenschappelijk onderzoek, voorzien zij in de opleiding tot wetenschappelijk onderzoeker of technologisch
      ontwerper en dragen zij kennis over ten behoeve van de maatschappij.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Hogescholen zijn gericht op het verzorgen van hoger beroepsonderwijs. Zij kunnen onderzoek verrichten voorzover
      dit verband houdt met het onderwijs aan de instelling. Zij verzorgen in elk geval bacheloropleidingen in het hoger
      beroepsonderwijs, zij verzorgen in voorkomende gevallen masteropleidingen in het hoger beroepsonderwijs en zij
      dragen in elk geval kennis over ten behoeve van de maatschappij. Zij dragen bij aan de ontwikkeling van beroepen
      waarop het onderwijs is gericht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.3
  - number: 1.3.3
    text: |-
      De Open Universiteit heeft het verzorgen van wetenschappelijk onderwijs en van hoger beroepsonderwijs tot taak,
      alsmede het leveren van een bijdrage aan de vernieuwing van het hoger onderwijs. Zij verzorgt in elk geval initiële
      opleidingen. Zij verzorgt deze in de vorm van afstandsonderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.3
  - number: 1.3.4
    text: |-
      De universiteiten, hogescholen en de Open Universiteit schenken mede aandacht aan de persoonlijke ontplooiing
      en aan de bevordering van maatschappelijk verantwoordelijkheidsbesef. Zij richten zich in het kader van hun
      werkzaamheden op het gebied van het onderwijs wat betreft Nederlandstalige studenten mede op de bevordering van de
      uitdrukkingsvaardigheid in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.3
  - number: 1.4.1
    text: |-
      Academische ziekenhuizen zijn werkzaam op het gebied van de patiëntenzorg en staan mede ten dienste van het
      wetenschappelijk geneeskundig onderwijs en onderzoek aan de universiteiten waaraan zij zijn verbonden. Zij
      vervullen mede topklinische en topreferentiefuncties in de gezondheidszorg. Voorts verlenen zij medewerking aan de
      opleiding tot medisch specialist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.4
  - number: 1.4.2
    text: |-
      De academische ziekenhuizen dragen er zorg voor dat er een educatieve voorziening is die het onderwijs
      aan een leerling die is opgenomen in het academisch ziekenhuis, kan ondersteunen, en die aan personeel
      van een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] informatie verstrekt, die relevant is voor de door dat
      personeel te verlenen ondersteuning bij het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: 1.4.3
    text: |-
      Het ondersteunen van leerlingen, bedoeld in het tweede lid, kan in overeenstemming tussen de educatieve voorziening
      en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.4
  - number: 1.4.4
    text: |-
      Het academisch ziekenhuis, de rechtspersoon die de educatieve voorziening, bedoeld in het tweede lid, in stand
      houdt en het personeel van de educatieve voorziening zijn gehouden aan de inspectie, alle gevraagde inlichtingen te
      geven omtrent de ondersteuning bij het onderwijs, bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.4
  - number: 1.5.1
    text: |-
      De Koninklijke Nederlandse Akademie van Wetenschappen is werkzaam op het gebied van het wetenschappelijk onderzoek.
      In elk geval bevordert zij de uitwisseling van gedachten en informatie tussen haar leden onderling en tussen deze
      leden en andere wetenschapsbeoefenaren en wetenschappelijke organisaties, adviseert zij Onze minister desgevraagd
      of uit eigen beweging over aangelegenheden op het gebied van de wetenschapsbeoefening en bevordert zij de
      wetenschapsbeoefening door werkzaamheden op dat gebied te verrichten of te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.5
  - number: 1.5.2
    text: |-
      De Koninklijke Bibliotheek is als de nationale bibliotheek werkzaam op het gebied van het bibliotheekwezen en de
      informatieverzorging, zowel ten behoeve van het hoger onderwijs en het wetenschappelijk onderzoek als ten behoeve
      van het openbaar bestuur en de uitoefening van beroep of bedrijf. In elk geval draagt zij zorg voor de nationale
      bibliotheekverzameling, bevordert zij de totstandkoming en instandhouding van nationale voorzieningen op het
      vorengenoemde gebied en bevordert zij de afstemming met de overige wetenschappelijke bibliotheken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.5
  - number: '1.6'
    text: Aan de instellingen wordt de academische vrijheid in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.6
  - number: '1.7'
    text: |-
      Het instellingsbestuur stelt richtlijnen vast met betrekking tot de ethische aspecten verbonden aan de
      werkzaamheden van de instelling. Het stelt die richtlijnen niet vast dan na het advies te hebben ingewonnen van
      een door hem daartoe ingestelde commissie. Indien ten behoeve van de werkzaamheden van de instelling gebruik
      wordt gemaakt van dieren dan wel mensen voor proeven, onderscheidenlijk voor demonstraties of proeven, hebben de
      richtlijnen daar mede betrekking op.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.7
  - number: 1.8.1
    text: |-
      De bekostigde instellingen voor hoger onderwijs zijn de instellingen, opgenomen in de bijlage van deze wet onder a
      tot en met h.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.8
  - number: 1.8.2
    text: De in de bijlage van deze wet onder a, c en h opgenomen instellingen bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.8
  - number: 1.8.3
    text: |-
      Een wijziging van de statutaire naam van een stichting of vereniging, genoemd in de bijlage, is van kracht met
      ingang van het tijdstip waarop de wijziging schriftelijk aan Onze minister is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Ten behoeve van het verzorgen van initieel onderwijs en, voorzover het universiteiten betreft, mede ten behoeve
      van het verrichten van wetenschappelijk onderzoek hebben de in de bijlage van deze wet onder *a*, *c* en *h*
      opgenomen instellingen en de gemeenten en openbare lichamen, onderscheidenlijk rechtspersonen met volledige
      rechtsbevoegdheid, waarvan de overige in de bijlage van deze wet opgenomen instellingen uitgaan, aanspraak op
      bekostiging uit ’s Rijks kas, voorzover aan de aan die instellingen verbonden opleidingen accreditatie is verleend
      of die opleidingen de toets nieuwe opleiding met positief gevolg hebben ondergaan. Voor de toepassing van dit
      lid wordt het onderwijsgebonden onderzoek aan hogescholen gerekend tot het daarop betrekking hebbende initieel
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Aan de met goed gevolg afgelegde examens van initiële opleidingen, verzorgd door bekostigde instellingen, is een
      graad als bedoeld in [artikel 7.10a][ref1] verbonden, voorzover aan die opleidingen accreditatie is verleend of
      die opleidingen de toets nieuwe opleiding met positief gevolg hebben ondergaan. Degenen aan wie een dergelijke
      graad is verleend onderscheidenlijk degenen die hebben voldaan aan de vereisten, gesteld in [artikel 7.18][ref2],
      zijn gerechtigd in de daarvoor in aanmerking komende gevallen de graden, genoemd in de [artikelen 7.10a][ref3] en
      [7.18][ref4], in de eigen naamsvermelding tot uitdrukking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
