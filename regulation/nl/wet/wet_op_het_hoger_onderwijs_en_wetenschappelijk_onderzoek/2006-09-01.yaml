        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.13.1
    text: |-
      Bij elke in [artikel 1.8][ref1] bedoelde universiteit die een opleiding voor het beroep van arts verzorgt, is een
      academisch ziekenhuis. De academische ziekenhuizen zijn opgenomen in onderdeel  van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.13.2
    text: |-
      De academische ziekenhuizen, opgenomen in onderdeel i, onder 1, van de bijlage van deze wet, bezitten
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.13
  - number: 1.14.1
    text: |-
      De academische ziekenhuizen hebben ten behoeve van het vervullen van hun in deze wet opgedragen werkzaamheden ten
      dienste van het wetenschappelijk geneeskundig onderwijs en onderzoek aanspraak op een door Onze minister te bepalen
      deel van de rijksbijdrage die op grond van [artikel 2.5][ref1] is vastgesteld voor de universiteit waaraan het
      academisch ziekenhuis is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.14.2
    text: |-
