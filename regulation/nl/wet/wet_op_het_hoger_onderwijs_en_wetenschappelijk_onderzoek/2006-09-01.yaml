  - number: 1.12.2
    text: |-
      Voorwaarde voor het bepaalde in het eerste lid is dat de desbetreffende instelling in acht neemt hetgeen is bepaald
      in het vijfde lid, alsmede hetgeen is bepaald bij of krachtens deze wet ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
  - number: 1.12.2.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
  - number: 1.12.2.b
    text: de registratie, het onderwijs, de examens en de promoties,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
  - number: 1.12.2.c
    text: de vooropleidingseisen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
  - number: 1.12.3
    text: |-
      In aanvulling op het tweede lid geldt voor de lerarenopleidingen als voorwaarde dat de desbetreffende hogeschool in
      acht neemt hetgeen bij [artikel 16.3][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
    references:
