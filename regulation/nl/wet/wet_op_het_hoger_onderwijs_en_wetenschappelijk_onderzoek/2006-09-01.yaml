  - number: 9.7.4
    text: Een lid kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.5
    text: 'Een lid van de raad van toezicht kan niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.5.a
    text: |-
      voor het merendeel van zijn arbeidstijd personeelslid zijn van een in de bijlage van deze wet opgenomen
      universiteit of voor het merendeel werkzaam zijn aan een onderzoekinstituut of onderzoekschool,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.5.b
    text: werkzaam zijn bij een departement van algemeen bestuur, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.5.c
    text: lid zijn van de Eerste of Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.6
    text: Het college van bestuur voorziet in de administratieve ondersteuning van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.7
    text: |-
      De leden van het college van bestuur wonen de vergaderingen van de raad van toezicht bij, tenzij de raad anders
      beslist. Zij hebben daarin een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.8.1
    text: |-
      De raad van toezicht is belast met het toezicht op het bestuur van de universiteit in haar geheel en op het beheer
      daarvan. Hij staat het college van bestuur met raad bij. De raad van toezicht ziet er op toe dat het college
      van bestuur bij de uitoefening van zijn bevoegdheden de op de universiteit betrekking hebbende wetten alsmede de
      krachtens die wetten uitgevaardigde regelingen, richtlijnen, aanwijzingen en reglementen naleeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.8
  - number: 9.8.2
    text: 'De raad van toezicht is belast met de goedkeuring dan wel instemming van:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.8
