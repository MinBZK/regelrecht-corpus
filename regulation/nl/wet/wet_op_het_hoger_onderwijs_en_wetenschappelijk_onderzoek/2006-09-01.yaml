preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de versterking van de kwaliteit, het vernieuwend
    vermogen alsmede de maatschappelijke gerichtheid van het bestel van het hoger onderwijs en wetenschappelijk
    onderzoek wenselijk is de zelfstandigheid van de instellingen te vergroten en daartoe de toedeling van bevoegdheden
    aan de rijksoverheid en de desbetreffende instellingen te herzien;

    dat het voorts gewenst is dat de bestuurlijke betrekkingen die de rijksoverheid onderhoudt met die instellingen zo
    goed mogelijk op elkaar zijn afgestemd;

    dat het daarvoor wenselijk is de afzonderlijke regelingen op het gebied van het bestel van het hoger onderwijs en
    wetenschappelijk onderzoek samen te voegen tot een Wet op het hoger onderwijs en wetenschappelijk onderzoek;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#ArtikelAanhef
