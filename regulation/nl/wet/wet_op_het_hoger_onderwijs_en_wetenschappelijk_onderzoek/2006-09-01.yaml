      datum die eerder is dan de eerste plaatsing van de accreditatiekaders in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.30
  - number: 18.30.3
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.20, die een voortzetting vormen van opleidingen die blijkens het Centraal
      register opleidingen hoger onderwijs zijn gestart of zullen starten met ingang van enig studiejaar, in de periode
      van de studiejaren vanaf 2000–2001 tot en met 2003–2004, is accreditatie verbonden tot en met 31 december van het
      kalenderjaar zes jaar na de start van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.30
  - number: '18.31'
    text: |-
      Op opleidingen waaraan op grond van de artikelen 18.27, 18.28, 18.29 of 18.30, accreditatie is verbonden, zijn
      van overeenkomstige toepassing de [artikelen 6.5][ref1], met uitzondering van het eerste lid, onderdelen b en c,
      [6.6, eerste lid][ref2], en [6.10][ref3], met uitzondering van het eerste lid, onderdeel b, zoals die artikelen van
      toepassing waren op 25 september 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
