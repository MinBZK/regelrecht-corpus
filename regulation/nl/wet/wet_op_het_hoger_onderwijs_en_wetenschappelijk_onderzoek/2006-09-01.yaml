  - number: 1.9.3
    text: |-
      Voorwaarde voor het bepaalde in het eerste en tweede lid is dat de desbetreffende instelling in acht neemt hetgeen
      bij of krachtens deze wet is bepaald ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.b
    text: de planning en bekostiging,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.c
    text: het personeel,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.d
    text: het onderwijsaanbod, de registratie, het onderwijs, de examens en de promoties,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.e
    text: de vooropleidings- of toelatingseisen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.f
    text: de studenten en extraneï,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.g
    text: de rechtsbescherming van studenten en extraneï, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.3.h
    text: het bestuur en de inrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.4
    text: |-
      Ten aanzien van het onderwijs in opleidingen in de godgeleerdheid en in opleidingen gericht op een godsdienstig of
      levensbeschouwelijk ambt aan een bijzondere instelling en het daarmee verband houdende onderzoek is het derde lid,
      onder *d*, voor wat betreft het onderwijs, de examens en de promoties, *e* en *h*, niet van toepassing, maar geldt
      als voorwaarde dat dit onderwijs en onderzoek alsmede de inrichting en het bestuur te dien aanzien worden geregeld
      bij of krachtens de statuten van de rechtspersoon met volledige rechtsbevoegdheid waarvan de bijzondere instelling
      uitgaat of in de op die instelling betrekking hebbende structuurregeling dan wel in het bestuursreglement.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.5
    text: |-
      De in het vierde lid bedoelde regeling alsmede wijzigingen daarvan worden door het instellingsbestuur zo spoedig
      mogelijk ter kennis gebracht van Onze minister. Zij wordt geacht te beantwoorden aan de in het vierde lid genoemde
      voorwaarde, indien Onze minister niet binnen drie maanden na de ontvangst van de mededeling bij een aan het
      instellingsbestuur gerichte brief heeft verklaard tegen de regeling of de desbetreffende wijziging daarvan uit
      oogpunt van voldoende waarborg van deugdelijkheid bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
  - number: 1.9.6
    text: |-
      Indien de bedenkingen, bedoeld in het vijfde lid, niet binnen drie maanden worden ondervangen, kan Onze minister
      besluiten dat aan de desbetreffende opleiding de rechten, genoemd in het eerste en tweede lid, ontnomen worden,
      onverminderd het overigens met betrekking tot ontneming van rechten in [hoofdstuk 6, titel 1][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.9
    references:
