  - number: '1.16'
    text: De Koninklijke Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.16
  - number: 1.17.1
    text: |-
      De in [artikel 1.16][ref1] genoemde instellingen voor wetenschappelijk onderzoek hebben aanspraak op een bijdrage
      uit ’s Rijks kas ten behoeve van het vervullen van hun bij deze wet opgedragen werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 1.17.2
    text: |-
      Voorwaarde voor het bepaalde in het eerste lid is dat de desbetreffende instelling in acht neemt het bij of
      krachtens deze wet bepaalde ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.17.2.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.17.2.b
    text: de planning en bekostiging,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.17.2.c
    text: het personeel, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.17.2.d
    text: het bestuur en de inrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.17.3
    text: |-
      De voorwaarden, bedoeld in het tweede lid onder *a*, en onder *b* voor wat betreft de planning, hebben geen
      betrekking op de adviestaak van de Koninklijke Nederlandse Akademie van Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.17
  - number: 1.18.1
    text: |-
      Het instellingsbestuur van een in [artikel 1.2, onder a, b en d][ref1], bedoelde instelling draagt er zorg voor
      dat, zoveel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling,
      mede door onafhankelijke deskundigen, van de kwaliteit van de werkzaamheden van de instelling. De beoordeling bij
      instellingen voor hoger onderwijs geschiedt mede aan de hand van het oordeel van studenten over de kwaliteit van
      het onderwijs van de instelling. Voorzover die beoordeling mede geschiedt door onafhankelijke deskundigen, zijn de
      uitkomsten daarvan openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.18.2
    text: |-
      Onze minister ziet toe op de uitvoering van het eerste lid. Hij kan onderzoek laten verrichten naar de
      kwaliteit van de werkzaamheden van de instellingen voorzover het betreft de instellingen, bedoeld in
      [artikel 1.2, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.18.3
    text: |-
      Het instellingsbestuur van een in [artikel 1.2, onderdelen a en b][ref1], bedoelde instelling draagt er tevens zorg
      voor dat, zoveel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling,
      mede door onafhankelijke deskundigen, van de kwaliteit van de opleidingen. De laatste twee volzinnen van het
      eerste lid zijn van overeenkomstige toepassing. De beoordeling bevat een samenvattend oordeel. Bij de beoordeling
      worden ten minste de accreditatiekaders, bedoeld in [artikel 5a.8, eerste lid][ref2], en de aspecten van kwaliteit,
      bedoeld in [artikel 5a.8, tweede lid][ref3], in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 1.18.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op een rechtspersoon als bedoeld in
      [artikel 5a.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 2.1.1
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 2.13][ref1] en [titel 5][ref2], heeft betrekking op de bekostigde
      universiteiten en hogescholen, de Open Universiteit, de Koninklijke Nederlandse Akademie van Wetenschappen en
      de Koninklijke Bibliotheek, met dien verstande dat [artikel 2.15][ref3] uitsluitend van toepassing is op de
      hogescholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.2
    text: |-
      Op de academische ziekenhuizen zijn uitsluitend de [artikelen 2.10][ref1], [2.12][ref2] en [2.13][ref3] en
      [titel 5][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '2'
  - number: '2.2'
    text: |-
      Het instellingsbestuur stelt om het jaar een plan met betrekking tot de instelling vast. Het plan geeft een
      omschrijving van de inhoud en de specificatie van het voorgenomen beleid van de instelling voor die periode. In
      het plan wordt aandacht besteed aan de voornemens in verband met de bevordering van de kwaliteit van het onderwijs
      en het verbeteren van de inrichting van de opleidingen aan de instelling. Het instellingsbestuur maakt het plan
      openbaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2
  - number: 2.2a.1
    text: |-
      Het instellingsbestuur van de Koninklijke Nederlandse Akademie van Wetenschappen en het instellingsbestuur van de
      Koninklijke Bibliotheek stellen in afwijking van artikel 2.2 een instellingsplan vast uiterlijk vier jaar na het
      tijdstip van vaststelling van het vorige plan en zenden dit na vaststelling onverwijld aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.2
    text: |-
      In het instellingsplan wordt rekening gehouden met het wetenschapsbudget, bedoeld in [artikel 16a van de Wet op
      de Nederlandse organisatie voor wetenschappelijk onderzoek](onbekend), de instellingsplannen van universiteiten,
      verkenningen, rapporten, adviezen en aanbevelingen een en ander voorzover die naar het oordeel van het
      instellingsbestuur van belang zijn voor de uitvoering van de taken van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.3
    text: 'Het instellingsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.3.a
    text: de doelstellingen van de instelling voor wetenschappelijk onderzoek op middellange termijn,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.3.b
    text: de hoofdlijnen van het te voeren beleid en de daarin te stellen prioriteiten, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.3.c
    text: de financiële, personele, materiële en organisatorische voorwaarden die moeten worden vervuld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.4
    text: |-
      Onze minister brengt zijn standpunt over het instellingsplan binnen zes maanden na ontvangst van het plan ter
      kennis van het instellingsbestuur. Onze minister doet daarvan en van het instellingsplan afschrift toekomen aan de
      beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.2a.5
    text: |-
      Onze minister kan zijn standpunt over het instellingsplan gedurende de looptijd daarvan wijzigen, indien de
      vaststelling van een nieuw wetenschapsbudget daartoe aanleiding geeft. Het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.2a
  - number: 2.3.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap, voor onderwijs en onderzoek op het gebied van landbouw en
      natuurlijke omgeving in overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit, stelt mede
      op grondslag van de gegevens vermeld in de jaarverslagen omtrent het voorgenomen beleid ten aanzien van de
      werkzaamheden van de instellingen een hoger onderwijs- en onderzoekplan vast. Het plan heeft betrekking op een
      tijdvak van ten minste vier jaren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het hoger onderwijs- en onderzoekplan bevat de voornemens ten aanzien van het door Onze minister te voeren beleid
      met betrekking tot het hoger onderwijs en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
  - number: 2.3.3
    text: 'Het hoger onderwijs- en onderzoekplan bevat voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
  - number: 2.3.3.a
    text: |-
      een overzicht van omstandigheden en gegevens die van belang zijn voor het met betrekking tot het hoger onderwijs en
      wetenschappelijk onderzoek te voeren beleid, en van de gewenste ontwikkelingen, daaronder mede begrepen wijzigingen
      ten aanzien van de maatschappelijke behoeften aan hoger onderwijs en wetenschappelijk onderzoek,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
  - number: 2.3.3.b
    text: |-
      algemene voornemens die in de beleidregels, bedoeld in [artikel 6.2, vierde lid][ref1], worden opgenomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.3.3.c
    text: |-
      een financiële raming in verband met de bekostiging van de daarvoor in aanmerking komende werkzaamheden van de
      instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het hoger onderwijs- en onderzoekplan wordt vastgesteld uiterlijk vier jaar na het tijdstip van vaststelling van
      het vorige hoger onderwijs- en onderzoekplan. Na overleg met de beide Kamers der Staten-Generaal kan het hoger
      onderwijs- en onderzoekplan uiterlijk zes maanden na het tijdstip, bedoeld in de eerste volzin, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap biedt uiterlijk zes maanden voorafgaand aan het moment waarop
      het hoger onderwijs- en onderzoekplan uiterlijk moet zijn vastgesteld, een ontwerp van dat plan aan de beide Kamers
      der Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Over de wijze waarop het vastgestelde plan wordt openbaar gemaakt, doet Onze minister mededeling in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De rijksbijdrage waarop de in [artikel 1.9, eerste lid][ref1], bedoelde aanspraak betrekking heeft, wordt
      berekend op de grondslag van een algemene berekeningswijze en voorzover het betreft investeringen in gebouwen en
      terreinen, hetzij op de grondslag van die algemene berekeningswijze hetzij op de grondslag van een andere door
      Onze minister te bepalen wijze. [Artikel 4:32 van de Algemene wet bestuursrecht][ref2] is niet van toepassing op
      de rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.5.1a
    text: |-
      In afwijking van het eerste lid kan de rijksbijdrage worden berekend op de grondslag van een bijzondere
      berekeningswijze:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.1a.a
    text: |-
      voor de universiteiten voorzover het betreft onderwijs gericht op het beroep van leraar voortgezet onderwijs van de
      eerste graad, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.1a.b
    text: |-
      voorzover dit voortvloeit uit de artikelen 5 en 7 van het Verdrag tussen het Koninkrijk der Nederlanden en de
      Vlaamse Gemeenschap van België inzake de transnationale Universiteit Limburg (Trb. 2001, 38).
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Onze minister kan aan de bekostiging van onderzoek aan universiteiten voorwaarden verbinden, verband houdend met
      de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De rijksbijdrage wordt jaarlijks door Onze minister vastgesteld in overeenstemming met het desbetreffende onderdeel
      van de voor dat begrotingsjaar vastgestelde rijksbegroting. Bij algemene maatregel van bestuur kunnen regels worden
      gesteld op grond waarvan de rijksbijdrage van een hogeschool kan worden vermeerderd of verminderd wegens het in
      dienst nemen van personeel dat een uitkering na ontslag verwerft of zal verwerven, onderscheidenlijk wegens het
      beëindigen van het dienstverband van zodanig personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.4
    text: |-
      Indien het in het derde lid bedoelde onderdeel van de voor het desbetreffende begrotingsjaar vastgestelde
      rijksbegroting wordt gewijzigd, wordt de rijksbijdrage door Onze minister nader vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.5
    text: De rijksbijdrage wordt betaald volgens een door Onze minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.5.6
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze minister een voorschot
      verstrekt. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De in [artikel 2.5, eerste lid][ref1], bedoelde algemene berekeningswijze wordt bij of krachtens algemene maatregel
      van bestuur vastgesteld. De algemene berekeningswijze bevat voor alle instellingen of voor groepen van instellingen
      gelijkelijk geldende maatstaven. Deze maatstaven hebben betrekking op de aard en omvang van de werkzaamheden en op
      de uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      De bijzondere berekeningswijze, bedoeld in [artikel 2.5, lid 1a][ref1], wordt bij of krachtens algemene maatregel
      van bestuur vastgesteld. In die algemene maatregel van bestuur wordt tevens vastgesteld ten aanzien van welk
      onderwijs dat artikellid toepassing vindt. De bijzondere berekeningswijze bevat maatstaven die in elk geval
      betrekking hebben op de studieresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.3
    text: |-
      Wat betreft de instellingen voor hoger onderwijs, met uitzondering van de Open Universiteit, hebben de maatstaven
      in elk geval betrekking op het aantal studenten en op de studieresultaten. De maatstaven kunnen verschillen per
      opleiding of groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Bij de vaststelling van het aantal studenten tellen die studenten mee die zijn opgenomen in de basisadministratie
      persoonsgegevens als bedoeld in de Wet gemeentelijke basisadministratie persoonsgegevens. Studenten die niet
      zijn opgenomen in de basisadministratie persoonsgegevens tellen alleen mee als zij onderwijs in Nederland volgen
      en als de instelling na verificatie van de gegevens betreffende naam, adres en woonplaats van de betrokken
      student die gegevens heeft laten opnemen in het register, bedoeld in [artikel 7.52][ref1]. Studenten die voor
      1 oktober een verzoek tot uitschrijving hebben ingediend, worden niet meegeteld, onverminderd het bepaalde in
      [artikel 7.42, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.6.5
    text: |-
      De maatstaven voor bekostiging van het wetenschappelijk onderzoek aan de universiteiten hebben in ieder geval
      betrekking op de maatschappelijke en wetenschappelijke behoefte aan het onderzoek, waarbij rekening wordt gehouden
      met het profiel van de instellingen alsmede op de kwaliteit van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
  - number: 2.6.6
    text: |-
      Onze minister legt het ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste en tweede lid voor
      aan de Tweede Kamer der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet gedaan
      dan nadat dertig dagen na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6
  - number: 2.6a.1
    text: |-
      De inkomsten van de Koninklijke Nederlandse Akademie van Wetenschappen en van de Koninklijke Bibliotheek bestaan
      uit:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.1.a
    text: de bijdrage uit 's Rijks kas,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.1.b
    text: inkomsten, die samenhangen met voorzieningen waarvoor de rijksbijdrage is verleend, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.1.c
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.2
    text: |-
      De rijksbijdrage wordt vastgesteld of nader vastgesteld door de vaststelling of nadere vaststelling bij de wet van
      het hoofdstuk van de rijksbegroting waarop zij is voorgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.3
    text: |-
      De rijksbijdrage wordt betaald in zodanige termijnen en tot zodanige bedragen als voor het doen van de betalingen
      door de instelling nodig is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.4
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop een voorschot betaald overeenkomstig
      door Onze minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.5
    text: Bij vaststelling van de rijksbijdrage blijven inkomsten als bedoeld in het eerste lid, onder c, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.6a.6
    text: |-
      Onze minister stelt regels met betrekking tot de bestemming van saldi die voortvloeien uit de inkomsten, bedoeld in
      het eerste lid, onder a en b.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.6a
  - number: 2.7.1
    text: |-
      Onze minister maakt aan elke instelling, bedoeld in [artikel 1.9, eerste lid][ref1], jaarlijks in september bekend
      welke rijksbijdrage voor het komende begrotingsjaar voorlopig kan worden verwacht. Hij deelt daarbij mede op welke
      wijze de geraamde rijksbijdrage is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 2.7.2
    text: |-
      Onze minister maakt aan elke instelling zo spoedig mogelijk na de in [artikel 2.5, derde lid][ref1], bedoelde
      vaststelling bekend, welke rijksbijdrage voor de instelling is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de in [artikel 2.5, vierde lid][ref1], bedoelde nadere
      vaststelling van de rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.1
    text: |-
      Het instellingsbestuur stelt jaarlijks, voorafgaand aan het desbetreffende begrotingsjaar, voor de instelling een
      begroting vast. Het instellingsbestuur zendt de begroting, alsmede wijzigingen van de begroting, binnen veertien
      dagen na de vaststelling ter kennis aan Onze minister. Het begrotingsjaar valt samen met het kalenderjaar.
      Het bestuur van een in [artikel 1.13, eerste lid][ref1], bedoelde universiteit, neemt bij de vaststelling van
      de begroting, onderscheidenlijk wijziging van de begroting de vastgestelde rijksbijdrage ten behoeve van het
      academisch ziekenhuis in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 2.8.2
    text: |-
      De begroting behelst een raming van de inkomsten en uitgaven alsmede van de baten en lasten van de instelling en
      dient in evenwicht te zijn. In de begroting van de Koninklijke Nederlandse Akademie van Wetenschappen en die van de
      Koninklijke Bibliotheek is een allocatie van middelen opgenomen die in overeenstemming is met het instellingsplan,
      bedoeld in [artikel 2.2a][ref1]. De in de begroting voorziene inkomsten uit de rijksbijdrage sluiten aan op de voor
      het desbetreffende begrotingsjaar door Onze minister geraamde, onderscheidenlijk vastgestelde en in voorkomende
      gevallen nader vastgestelde rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.3
    text: |-
      Het instellingsbestuur draagt zorg voor wijziging van de begroting indien de vastgestelde rijksbijdrage afwijkt van
      de in de begroting opgenomen geraamde rijksbijdrage, alsmede in geval van een nader vastgestelde rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Het instellingsbestuur doet de noodzakelijke uitgaven binnen de grenzen van de vastgestelde of gewijzigde
      begroting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.8
  - number: 2.8.5
    text: |-
      Af- en overschrijving op de uitgaafposten van de begroting kunnen door het instellingsbestuur geschieden in de
      gevallen, voorzien in de door dat bestuur terzake vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Het instellingsbestuur dient jaarlijks voor 1 juli bij Onze minister een verslag in. Het verslag bestaat uit
      de jaarrekening met bijbehorende begroting, het jaarverslag en overige financiële gegevens. Uit het verslag
      dient te blijken in hoeverre sprake is van een behoorlijke uitvoering van de werkzaamheden ten behoeve waarvan
      de rijksbijdrage is verleend en van een doelmatige aanwending van de rijksbijdrage, mede in het licht van het
      instellingsplan. Van niet doelmatige aanwending van de rijksbijdrage is in ieder geval sprake, voorzover bedragen
      daaruit worden aangewend voor het op enigerlei wijze compenseren van studenten of extraneï voor collegegeld,
      examengeld, cursusgeld of wat de hogescholen betreft de bijdrage, bedoeld in [artikel 7.46, tweede lid][ref1],
      anders dan op grond van [artikel 7.46, derde lid][ref2], [artikel 7.51][ref3] of [artikel 7.51a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.9.2
    text: |-
      In de jaarrekening wordt rekening en verantwoording afgelegd van het financiële beheer van de instelling over het
      voorafgaande begrotingsjaar. Het jaarverslag omvat mede het voorgenomen beleid ten aanzien van de werkzaamheden van
      de instelling, mede in het licht van de uitkomsten van kwaliteitsbeoordeling als bedoeld in [artikel 1.18][ref1]
      en andere gegevens omtrent de kwaliteit van de werkzaamheden van de instelling. Aan het jaarverslag van een
      universiteit waaraan een academisch ziekenhuis is verbonden, wordt het in [artikel 12.21][ref2] bedoelde document
      toegevoegd, dan wel, indien het een bijzondere universiteit betreft, een overzicht van de voornemens betreffende de
      onderlinge afstemming van de werkzaamheden van de universiteit en het academisch ziekenhuis op het gebied van het
      wetenschappelijk geneeskundig onderwijs en onderzoek. Toepassing van de voorgaande volzin blijft achterwege indien
      het document, onderscheidenlijk het overzicht reeds aan een eerder jaarverslag is toegevoegd en het sindsdien niet
      is gewijzigd of opnieuw is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.9.3
    text: |-
      Het instellingsbestuur doet het verslag vergezeld gaan van een verklaring van een door hem aangewezen accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Die verklaring heeft
      mede betrekking op de gegevens die op enigerlei wijze een rol spelen in de algemene berekeningswijze, bedoeld in
      [artikel 2.5, eerste lid][ref2]. Bij de aanwijzing van de accountant wordt bedongen dat aan Onze minister op diens
      verzoek inzicht wordt geboden in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.9.4
    text: |-
      Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden
      ten behoeve waarvan de rijksbijdrage is verleend, niet behoorlijk zijn uitgevoerd of de rijksbijdrage ondoelmatig
      is aangewend, kan Onze minister bepalen, dat de daarmee gemoeide bedragen in mindering worden gebracht op de
      rijksbijdrage. Hij maakt dit binnen een jaar na de ontvangst van de jaarrekening bekend aan het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
  - number: 2.9.5
    text: Het resultaat van het verslagjaar wordt verrekend met de algemene reserve van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
  - number: 2.9.6
    text: |-
      De leden van het college van bestuur of het algemeen bestuur van een rechtspersoonlijkheid bezittende openbare
      instelling zijn persoonlijk aansprakelijk jegens de instelling voor schade ten gevolge van uitgaven die zijn
      geschied in strijd met het bepaalde bij of krachtens de wet, voorzover Onze minister heeft bepaald dat de met die
      uitgaven gemoeide bedragen in mindering worden gebracht op de rijksbijdrage, tenzij blijkt dat zij aan het doen van
      die uitgaven niet hebben medegewerkt. Indien binnen een door Onze minister te bepalen termijn geen rechtsvordering
      van de zijde van de instelling terzake is gesteld, kan Onze minister daartoe overgaan namens en ten behoeve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.9
  - number: '2.10'
    text: |-
      De accountant die door Onze minister is belast met het onderzoek van de ministeriële jaarrekening, heeft met het
      oog op het verrichten van dat onderzoek toegang tot elke instelling. De accountant kan door Onze minister tevens
      worden belast met een onderzoek naar de doelmatigheid van het beheer van de instelling. Aan de accountant worden
      alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.10
  - number: 2.10a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.10a
  - number: '2.11'
    text: |-
      Het gedeelte van de rijksbijdrage dat wordt berekend op de wijze, bedoeld in
      [artikel 2.5, lid 1a, onderdeel a][ref1], wordt besteed aan het desbetreffende onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.12'
    text: |-
      Het bestuur van een in [artikel 1.13, eerste lid][ref1], bedoelde universiteit betaalt, zodra de in
      [artikel 2.5][ref2] bedoelde betaling van de rijksbijdrage dan wel betaling van een voorschot daarop is ontvangen,
      aan het met dieuniversiteit verbonden academisch ziekenhuis onverwijld het gedeelte van de rijksbijdrage waarop het
      academisch ziekenhuis op grond van [artikel 1.14, eerste lid][ref3], aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 2.13.1
    text: |-
      Het instellingsbestuur dat voornemens is om gebouwen of terreinen ten behoeve waarvan een rijksbijdrage is
      verleend, blijvend niet meer voor de instelling te gebruiken, doet hiervan onverwijld mededeling aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Onze minister kan binnen negentig dagen na ontvangst van de mededeling, bedoeld in het eerste lid,
      beslissen dat de gebouwen of terreinen worden overgedragen aan het Rijk dan wel ten behoeve van onderwijs
      of onderzoek aan een andere door hem aan te wijzen rechtspersoon. De overdracht geschiedt door de
      inschrijving van de desbetreffende beslissing van Onze minister in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 2.13.3
    text: |-
      Het instellingsbestuur kan de gebouwen of terreinen niet verhuren, vervreemden of aan enig beperkt recht
      onderwerpen tenzij Onze minister, in overeenstemming met Onze Minister van Financiën, mededeelt van zijn in het
      tweede lid bedoelde bevoegdheid geen gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.13
  - number: 2.13.4
    text: |-
      Bij de overgang van de eigendom van gebouwen of terreinen ingevolge het tweede lid, vergoedt het Rijk, voorzover
      deze gebouwen of terreinen door de rechtspersoon uit eigen middelen zijn betaald en hiervoor geen rijksbijdrage
      werd verstrekt, een door Onze minister te bepalen bedrag. Onze minister stelt dit bedrag vast in verhouding tot de
      waarde in het economisch verkeer van die gebouwen of terreinen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.13
  - number: '2.14'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld voor de inrichting van de begroting en het
      verslag.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Elke instelling is aangesloten bij de door de instellingsbesturen gezamenlijk opgerichte rechtspersoon met
      volledige rechtsbevoegdheid, zonder winstoogmerk. Deze rechtspersoon stelt zich ten doel zich borg te stellen voor
      de nakoming van rente- en aflossingsverplichtingen, voortvloeiend uit de door het instellingsbestuur aangegane
      leningen door instandhouding van een onafhankelijk functionerend fonds, dat uitsluitend de in dit artikel genoemde
      functies uitoefent.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.2
    text: |-
      De leden van het bestuur van het fonds worden benoemd door de instellingsbesturen. De leden stemmen zonder last
      of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.3
    text: |-
      Elke instelling draagt aan het fonds op zodanige wijze bij, dat door de gezamenlijke bijdragen het functioneren van
      het fonds is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.4
    text: |-
      Het instellingsbestuur kan het fonds verzoeken zich geheel of gedeeltelijk borg te stellen voor de nakoming van
      rente- en aflossingsverplichtingen, voortvloeiend uit een door het instellingsbestuur afgesloten lening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.5
    text: |-
      Het fonds kan aan het verlenen van een waarborg algemeen geldende voorwaarden verbinden met betrekking tot
      de vorm van de te waarborgen lening en met betrekking tot een door de instelling aan het fonds te betalen
      borgstellingsvergoeding. Een verzoek om borgstelling van een instelling dat aan deze algemene voorwaarden voldoet
      kan, onverminderd het bepaalde in het negende lid, niet worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.6
    text: |-
      Het instellingsbestuur legt jaarlijks een afschrift van de vastgestelde begroting als bedoeld in
      [artikel 2.8][ref1] en het vastgestelde verslag als bedoeld in [artikel 2.9][ref2] over aan het bestuur van het
      fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.15.7
    text: |-
      Indien het aan het instellingsbestuur bij de vaststelling van de begroting blijkt dat het op enig moment in
      het kalenderjaar waarop die begroting betrekking heeft, niet in staat zal zijn tot nakoming van de rente- en
      aflossingsverplichtingen uit één of meer door het fonds geborgde leningen, meldt het instellingsbestuur dit voor
      de aanvang van het in dit artikellid bedoelde kalenderjaar aan het fonds. Binnen acht weken na de melding, bedoeld
      in de eerste volzin, legt het instellingsbestuur aan het fonds een door hem vastgesteld saneringsplan over,
      waarin is aangegeven op welke wijze en binnen welke termijn het evenwicht tussen de inkomsten en de uitgaven van
      de instelling hersteld kan worden. Het bestuur van het fonds kan ten aanzien van het saneringsplan voorwaarden
      van financiële aard stellen die zijn gericht op het herstel van het financieel evenwicht tussen de inkomsten en
      uitgaven van de instelling, die door de instelling in het door haar vastgestelde saneringsplan worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.8
    text: |-
      Indien het aan het instellingsbestuur in de loop van een kalenderjaar blijkt dat het niet in staat zal zijn tot
      nakoming van de rente- en aflossingsverplichtingen uit één of meer door het fonds geborgde leningen, terwijl
      dat bij de vaststelling van de begroting met betrekking tot dat kalenderjaar niet was voorzien, meldt het
      instellingsbestuur dit zo spoedig mogelijk, doch in elk geval voordat de toestand, bedoeld in deze volzin, intreedt
      aan het fonds. De tweede en derde volzin van het zevende lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.9
    text: |-
      Indien een lening, waarvan de instelling bij het fonds om borging verzoekt, naar het oordeel van het
      fonds tot gevolg heeft dat het instellingsbestuur niet in staat zal zijn tot nakoming van de rente- en
      aflossingsverplichtingen uit één of meer door het fonds geborgde leningen, bepaalt het bestuur van het fonds dat
      de borging niet wordt verleend dan nadat een door het instellingsbestuur vastgesteld saneringsplan is overgelegd
      dan wel geheel of gedeeltelijk is uitgevoerd, waarin is aangegeven op welke wijze het evenwicht tussen de inkomsten
      en de uitgaven van de instelling kan worden behouden dan wel hersteld. De derde volzin van het zevende lid is van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.10
    text: |-
      Het negende lid is niet van toepassing op de leningen die door het instellingsbestuur worden afgesloten in verband
      met de betaling van het bedrag, bedoeld in [artikel II van de Wet van 11 november 1993, ][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0006250#ArtikelII
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0006250
        artikel: II
  - number: 2.15.11
    text: |-
      Indien een of meer voorwaarden van het fonds als bedoeld in het zevende tot en met negende lid, de vrijheid van
      inrichting van het onderwijs in ernstige mate aantast, kan het instellingsbestuur daartegen beroep instellen
      bij Onze minister. Op het beroep zijn de [hoofdstukken 6][ref1] en [7][ref2], met uitzondering van de
      [artikelen 7:24][ref3] en [7:25 van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 2.15.12
    text: |-
      Onze minister beslist binnen zes weken na ontvangst van het beroepschrift. Indien Onze minister het beroep gegrond
      acht, bepaalt hij dat een of meer van de voorwaarden niet in het saneringsplan behoeven te worden opgenomen. De
      instelling stelt met inachtneming van de uitspraak van Onze minister het saneringsplan opnieuw vast en treedt
      daarover in overleg met het fonds. De laatste twee volzinnen van het zevende lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.13
    text: |-
      Indien een instelling één of meer leningen bij het fonds heeft geborgd, dient de instelling voorafgaand aan het
      aangaan van leningen waarvoor de instelling het fonds niet om borging verzoekt, dit te melden aan het fonds.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.14
    text: |-
      Van de verplichtingen, bedoeld in dit artikel, kan Onze minister op verzoek van het bestuur van een bijzondere
      instelling ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze minister
      verleent de ontheffing slechts, indien het instellingsbestuur aantoont dat een afdoende andere voorziening is
      getroffen voor het waarborgen van het voortbestaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.15
    text: |-
      Het fonds kan batig saldo uitkeren aan de instellingen. De instellingen besteden deze uitkeringen ten behoeve van
      de werkzaamheden van de instelling, waarvoor de rijksbijdrage wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.15.16
    text: De statuten van de rechtspersoon die het fonds in stand houdt voldoen aan het gestelde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.15
  - number: 2.16.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere
      instelling, draagt het instellingsbestuur zo spoedig mogelijk na de opheffing dan wel beëindiging van de
      bekostiging, zorg voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze minister
      gezonden en gaat vergezeld van een verklaring van een door hem aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.16.2
    text: |-
      Tenzij met Onze minister een andere regeling wordt getroffen, is het instellingsbestuur aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het instellingsbestuur uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.16
  - number: 2.16.3
    text: |-
      Bij de opheffing dan wel beëindiging van de bekostiging als bedoeld in het eerste lid, maakt het instellingsbestuur
      zo spoedig mogelijk aan Onze minister bekend welke maatregelen het heeft genomen teneinde te waarborgen dat de aan
      die instelling ingeschreven studenten de opleiding aan een andere instelling kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.16
  - number: '2.17'
    text: |-
      Het instellingsbestuur beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en
      het voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Jaarlijks verstrekt Onze minister een subsidie aan het academisch ziekenhuis dan wel aan de rechtspersoon
      die de educatieve voorziening, bedoeld in [artikel 1.4, tweede lid][ref1], in stand houdt, ter
      tegemoetkoming in de kosten van ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in de
      [artikelen 9a van de Wet op het primair onderwijs][ref2], [18a van de Wet op de expertisecentra][ref3], [18][ref4]
      en [138a van de Wet op het voortgezet onderwijs][ref5] en [7.1.4 van de Wet educatie en beroepsonderwijs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel138a
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 138a
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.18.2
    text: |-
      De hoogte van de subsidie aan het academisch ziekenhuis dan wel aan het bestuur van de rechtspersoon die de
      educatieve voorziening in stand houdt, wordt bepaald op basis van het leerlingenaantal dat het gemiddelde is van
      de hoogste dagtellingen in de maanden september tot en met april van het schooljaar 1994–1995 van leerlingen van
      scholen als bedoeld in [artikel 2, tweede lid onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat
      artikel luidde op 31 juli 1999, die waren opgenomen in het desbetreffende academisch ziekenhuis, en een bedrag
      per leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 2.18.3
    text: |-
      Het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die een educatieve voorziening in stand houdt,
      ontvangt de subsidie, bedoeld in het tweede lid, onder de voorwaarde dat op de aan deze subsidie gerelateerde
      formatieplaatsen personeel wordt benoemd, dat op 31 juli 1999 was benoemd aan een of meer van de scholen, bedoeld
      in [artikel 2, tweede lid, onderdeel g, van de Wet op de expertisecentra][ref1], zoals dat artikel luidde op 31
      juli 1999, tenzij het bestuur van het academisch ziekenhuis dan wel de rechtspersoon die de educatieve voorziening
      in stand houdt aantoont dat met betrekking tot een formatieplaats geen lid van dat personeel beschikbaar was dat de
      formatieplaats aanvaardde. Deze benoemingsverplichting geldt voor de betrekkingsomvang die voor de desbetreffende
      personeelsleden gold aan die scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '2.19'
    text: |-
      Met betrekking tot de educatieve voorziening, bedoeld in [artikel 1.4, tweede lid][ref1], stelt het bestuur van
      een academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt,
      jaarlijks voor 1 juli een begroting voor het volgende jaar en een jaarverslag over het afgelopen jaar vast en
      zendt die aan Onze minister. Onze minister kan een richtlijn vaststellen voor de inrichting van de begroting en
      het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.20.1
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarover de subsidie is toegekend, legt het bestuur van het
      academisch ziekenhuis dan wel het bestuur van de rechtspersoon die de educatieve voorziening in stand houdt, een
      verklaring van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      over aan Onze minister, waaruit blijkt in hoeverre de toegekende subsidie is besteed in overeenstemming met de
      bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.20.2
    text: |-
      Voorzover niet uit de verklaring, bedoeld in het eerste lid, blijkt dat de subsidie is besteed in overeenstemming
      met de bepalingen van deze wet, vordert Onze minister het desbetreffende bedrag terug.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel2.20
  - number: 3.1.1
    text: |-
      Onze minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten en hogescholen, de Open Universiteit, de Koninklijke Nederlandse Akademie van Wetenschappen en de
      Koninklijke Bibliotheek over aangelegenheden van algemeen beleid met betrekking tot die instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Onze minister pleegt geregeld overleg met een vertegenwoordiging van de instellingsbesturen van de bekostigde
      universiteiten waaraan een academisch ziekenhuis is verbonden en van de academische ziekenhuizen over
      aangelegenheden van algemeen beleid betreffende de academische ziekenhuizen dan wel betreffende de academische
      ziekenhuizen en de universiteiten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel3.1
  - number: '3.2'
    text: |-
      Onze minister neemt besluiten als bedoeld in [de artikelen 1.9, zesde lid][ref1], [2.9, vierde lid][ref2],
      [2.13, tweede en vierde lid][ref3], [4.2, tweede lid][ref4], en [7.56, eerste lid, onder b][ref5], niet dan na
      het betrokken instellingsbestuur in de gelegenheid te hebben gesteld met hem te overleggen over zijn desbetreffend
      voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
