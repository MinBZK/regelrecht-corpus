    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: 18.32.2
    text: Artikel 18.12, eerste, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: '18.33'
    text: |-
      Voor de toepassing van artikel 7.8b, vijfde lid, tweede volzin, wordt onder bacheloropleiding mede begrepen de
      daarmee overeenkomende opleiding in het wetenschappelijk onderwijs, bedoeld in artikel 18.14 of artikel 18.15.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.33
  - number: 18.34.1
    text: |-
      Onverminderd [artikel 7.10a, derde lid][ref1], kan het bestuur van de rechtspersoon die een masteropleiding in het
      wetenschappelijk onderwijs als bedoeld in artikel 18.31, eerste lid, verzorgt, afhankelijk van het vakgebied waarin
      het afsluitend examen van die masteropleiding is afgelegd, aan de verleende graad toevoegen «of Arts» dan wel «of
      Science».


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.34.2
    text: |-
      [Artikel 7.19a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 18.35.1
    text: |-
      Voor de toepassing van [artikel 7.10a][ref1] wordt een opleiding als bedoeld in artikel 18.16 aangemerkt als een
      masteropleiding in het wetenschappelijk onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.35.2
    text: |-
      [Artikel 7.19a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 18.36.1
    text: |-
      Het instellingsbestuur, bedoeld in artikel 18.7, artikel 18.8 of artikel 18.9 stelt uiterlijk drie maanden
      voorafgaand aan het studiejaar waarin het onderwijs in de opleiding, bedoeld in een van die artikelen, voor het
      eerst wordt verzorgd, de onderwijs- en examenregeling, bedoeld in artikel 7.13, voor die opleiding vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.36
  - number: 18.36.2
    text: Voor het studiejaar 2002–2003 is het tijdstip, bedoeld in het eerste lid, uiterlijk 15 augustus 2002.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.36
  - number: '18.37'
    text: |-
      Degene die op of voor 31 augustus 2002 voldoet aan de voorwaarde, bedoeld in artikel 7.18, tweede lid, onder
      a, zoals die bepaling luidde op 31 augustus 2002, wordt gelijkgesteld aan degene die voldoet aan de voorwaarde,
      bedoeld in artikel 7.18, tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.37
  - number: '18.38'
    text: |-
      De bezitter van een getuigschrift van een met goed gevolg afgelegd kandidaats- of afsluitend examen
      aan een instelling voor hoger onderwijs is vrijgesteld van de vooropleidingseisen, bedoeld in
      [artikel 7.24, eerste of tweede lid][ref1], onverminderd het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.38
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.39.1
    text: |-
      Degenen die op grond van artikel 7.20a, zoals die bepaling op 31 augustus 2002 luidde, gerechtigd waren tot het
      voeren van de titel kandidaat, blijven gerechtigd die titel te voeren overeenkomstig dat artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.39
  - number: 18.39.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degenen die na 31 augustus 2002 met goed gevolg het
      kandidaatsexamen van een opleiding als bedoeld in artikel 18.14 of van een opleiding als bedoeld in artikel 18.15
      hebben afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.39
  - number: '18.40'
    text: |-
      Degene die voorafgaand aan het studiejaar 2002–2003 een aanvang heeft gemaakt met een opleiding in het
      hoger beroepsonderwijs en aan wie na 31 augustus 2002 doch voor 1 september 2006 op grond van het met
      goed gevolg afleggen van het afsluitend examen van een bacheloropleiding in het hoger beroepsonderwijs
      de graad Bachelor is verleend, is tevens gerechtigd tot het voeren van de titel Bachelor overeenkomstig
      [artikel 7.21, tweede en derde lid][ref1], zoals die bepalingen op 31 augustus 2002 luidden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 18.41.1
    text: |-
      Indien ten behoeve van een bepaald studiejaar toepassing is gegeven aan [artikel 18.7, tweede lid][ref1],
      wordt de aanmelding overeenkomstig [artikel 7.37, vierde lid][ref2], met het oog op de inschrijving voor dat
      studiejaar voor een opleiding in het wetenschappelijk onderwijs, aangemerkt als aanmelding voor de overeenkomstige
      bacheloropleiding, bedoeld in [artikel 7.3a, eerste lid, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.41
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '18'
        hoofdstuk: '18'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 18.41.2
    text: |-
      De aanmelding overeenkomstig [artikel 7.37, vierde lid][ref1], met het oog op de inschrijving voor het studiejaar
      2002–2003 voor een opleiding in het hoger beroepsonderwijs, wordt aangemerkt als aanmelding voor de overeenkomstige
      bacheloropleiding, bedoeld in [artikel 7.3a, tweede lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.41
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '18.42'
    text: |-
      Voor de toepassing van de paragrafen 4 en 4a van titel 3 van hoofdstuk 7 wordt onder bacheloropleiding in het
      wetenschappelijk onderwijs mede begrepen een opleiding als bedoeld in artikel 18.15.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.42
  - number: '18.43'
    text: |-
      De opleidingscommissies, bedoeld in de artikelen 9.18 en 10.3c, zoals die artikelen op 31 augustus 2002 luidden, en
      in artikel 11.11, zijn mede ingesteld voor de overeenkomstige opleidingen, bedoeld in de artikelen 18.14 en 18.15.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.43
  - number: '18.44'
    text: |-
      Ten aanzien van de beslissing op een bezwaarschrift of een beroepschrift dat gericht is tegen een besluit dat voor
      1 september 2002 is bekendgemaakt, blijft het recht zoals het gold voor die dag van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.44
  - number: '18.45'
    text: |-
      Onze minister zendt binnen vijf jaar na de inwerkingtreding van de wet van 6 juni 2002, houdende wijziging van
      onder meer de Wet op het hoger onderwijs en wetenschappelijk onderzoek en de Wet studiefinanciering 2000 in verband
      met de invoering van de bachelor-masterstructuur in het hoger onderwijs, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten in de praktijk van die wet.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.45
  - number: '18.46'
    text: |-
      Op bezwaar en beroep tegen een besluit als bedoeld in [artikel 6.16][ref1], zoals dat artikel luidde voor het
      tijdstip van inwerkingtreding van deze wet, voorzover ingesteld voor dat tijdstip, blijven de op de dag voor het
      tijdstip van inwerkingtreding van de wet van 12 september 2002 (Stb. 493) geldende voorschriften van de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: '18.47'
    text: |-
      Aanvragen om een oordeel als bedoeld in artikel 6.3, zoals dat artikel luidde voor inwerkingtreding van de wet van
      30 januari 2003 (Stb. 70), die voor 12 september 2002 zijn ingediend bij de adviescommissie onderwijsaanbod en die
      nog niet voor 12 september 2002 zijn afgehandeld, worden geacht te zijn ingediend bij het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.47
  - number: '18.48'
    text: |-
      Artikel 2.2a wordt voor het eerst toegepast op het instellingsplan dat het instellingsbestuur van de Koninklijke
      Nederlandse Akademie van Wetenschappen onderscheidenlijk het instellingsbestuur van de Koninklijke Bibliotheek
      vaststelt in het jaar 2006.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.48
  - number: '18.49'
    text: |-
      Op geschillen betreffende de vaststelling van de rijksbijdrage op grond van artikel 16.26, vierde lid, die
      tijdig aanhangig zijn of worden gemaakt, blijven de op het tijdstip van inwerkingtreding van deze wet geldende
      voorschriften van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.49
  - number: 18.50.1
    text: |-
      Indien het instellingsbestuur van de openbare universiteit te Enschede voornemens is in het studiejaar 2003–2004
      de bacheloropleiding klinische technologie te verzorgen, kan hij die opleiding tot 20 augustus 2003 aanmelden voor
      registratie in het Centraal register opleidingen hoger onderwijs dat betrekking heeft op het studiejaar 2003–2004.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.50
  - number: 18.50.2
    text: |-
      Indien het instellingsbestuur de opleiding, bedoeld in het eerste lid, voor registratie heeft aangemeld,
      registreert de Informatie Beheer Groep deze opleiding overeenkomstig de door het instellingsbestuur verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.50
  - number: 18.50.3
    text: |-
      Indien de gegevens niet volledig zijn, stelt de Informatie Beheer Groep het instellingsbestuur in de gelegenheid om
      uiterlijk 27 augustus 2003 te voorzien in de ontbrekende gegevens.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.50
  - number: 18.50.4
    text: |-
      De Informatie Beheer Groep weigert registratie in het Centraal register opleidingen hoger onderwijs uitsluitend,
      indien hij de gegevens uiterlijk 27 augustus 2003 niet of niet volledig heeft ontvangen. De Informatie Beheer
      Groep stelt het instellingsbestuur zo spoedig mogelijk op de hoogte van een besluit houdende weigering van de
      registratie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.50
  - number: '18.51'
    text: |-
      Indien de bacheloropleiding klinische technologie met toepassing van artikel 18.50 is geregistreerd, is aan die
      opleiding accreditatie verleend tot en met 31 augustus 2007.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.51
  - number: '18.52'
    text: |-
      Indien het instellingsbestuur, bedoeld in artikel 18.50, met toepassing van [artikel 7.53][ref1] besluit
      tot beperking van de eerste inschrijving voor het studiejaar 2003–2004 voor de propedeutische fase van de
      bacheloropleiding klinische technologie aan die universiteit, bedraagt het aantal personen dat ten hoogste kan
      worden ingeschreven 50.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.52
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 18.53.1
    text: |-
      De gemeente waar een in het Centraal register opleidingen hoger onderwijs, bedoeld in artikel 6.13, opgenomen
      opleiding op de dag voor de datum van inwerkingtreding van de wet van 24 juni 2004 (Stb. 321) blijkens dat register
      wordt verzorgd, is de gemeente waar die opleiding op de datum van inwerkingtreding van die wet is gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.53
  - number: 18.53.2
    text: |-
      Indien ten aanzien van een opleiding toepassing is gegeven aan artikel 7.17, tweede lid, zoals die bepaling luidde
      op de dag voor de datum van inwerkingtreding van de wet van 24 juni 2004 (Stb. 321), is de desbetreffende gemeente
      eveneens een gemeente waar die opleiding is gevestigd, voorzover die gemeente op die dag in het Centraal register
      opleidingen hoger onderwijs is vermeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.53
  - number: '18.54'
    text: |-
      Op de verzoeken om toestemming als bedoeld in artikel 7.17, tweede lid, zoals die bepaling luidde voor het tijdstip
      van inwerkingtreding van deze wet, die voor dat tijdstip zijn ingediend, blijven de op de dag voor het tijdstip van
      inwerkingtreding van deze wet geldende voorschriften van toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.54
  - number: '19.1'
    text: |-
      Onze minister brengt vijf jaren na de inwerkingtreding van deze wet verslag uit over de werking ervan aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel19.1
  - number: '19.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel19.2
  - number: '19.3'
    text: Deze wet kan worden aangehaald als "Wet op het hoger onderwijs en wetenschappelijk onderzoek".
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel19.3
