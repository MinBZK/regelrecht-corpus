  - number: 18.30.1
    text: |-
      Aan de opleidingen, bedoeld in artikel 18.20, die een voortzetting vormen van opleidingen die voor de dag van
      de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn geregistreerd in het Centraal register
      opleidingen hoger onderwijs, en waarvan de beoordeling, bedoeld in [artikel 1.18, eerste lid][ref1], heeft
      plaatsgevonden voor 1 januari 2000, is accreditatie verbonden tot en met 31 december 2005.


