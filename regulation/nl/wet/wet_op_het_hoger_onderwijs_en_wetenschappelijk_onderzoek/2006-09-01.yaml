    text: International Institute for Infrastructural Hydraulic and Environmental Engineering te Delft,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: 18.32.1.b
    text: Institute for Housing and Urban Development Studies te Rotterdam,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: 18.32.1.c
    text: Internationaal Instituut voor Lucht- en Ruimtekaartering en Aardkunde te Enschede,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: 18.32.1.d
    text: Maastricht School of Management te Maastricht, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel18.32
  - number: 18.32.1.e
