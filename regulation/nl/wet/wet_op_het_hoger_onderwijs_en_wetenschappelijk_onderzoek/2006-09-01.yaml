      zonder dat ten aanzien van degene die het desbetreffende examen of onderzoek met goed gevolg heeft afgelegd
      onderscheidenlijk heeft ondergaan, door het instellingsbestuur is verklaard dat het getuigschrift kan worden
      afgegeven, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.5
  - number: 15.6.1
    text: |-
