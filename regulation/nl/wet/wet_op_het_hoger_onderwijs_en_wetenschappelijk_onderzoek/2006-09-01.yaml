  - number: 3.3.1
    text: |-
      Onze minister pleegt geregeld overleg met de daarvoor in aanmerking komende belangenorganisaties van studenten over
      aangelegenheden van algemeen belang voor studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Onze minister treft een regeling ter financiële ondersteuning van de vertegenwoordigers van de in het eerste lid
      bedoelde belangenorganisaties, in verband met door hen te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel3.3
  - number: 4.1.1
    text: Dit hoofdstuk heeft betrekking op de bekostigde universiteiten en hogescholen en de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 4.2, tweede tot en met vierde lid][ref1], heeft tevens betrekking op
      de academische ziekenhuizen, de Koninklijke Nederlandse Akademie van Wetenschappen en de Koninklijke Bibliotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1
    text: |-
      Het instellingsbestuur bepaalt het personeelsbeleid en voert het personeelsbeheer. Het neemt daarbij de bij of
      krachtens de wet gegeven voorschriften alsmede de eisen van zorgvuldigheid in acht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Onze minister kan het instellingsbestuur van een universiteit richtlijnen geven met betrekking tot het minimum
      aantal assistenten in opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Het instellingsbestuur van een universiteit, een hogeschool of de Open Universiteit stelt ten behoeve van de
      leidinggevende functies op het gebied van onderwijs onderscheidenlijk onderzoek van elke van het instellingsbestuur
      uitgaande instelling, indien daaraan van een ondervertegenwoordiging van vrouwen in leidinggevende functies op het
      gebied van onderwijs onderscheidenlijk onderzoek sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in leidinggevende functies vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het instellingsbestuur een beleid inzake evenredige vertegenwoordiging
      van vrouwen in leidinggevende functies wordt gevoerd, opdat in deze functies vrouwen en mannen naar evenredigheid
      werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de verhouding mannen en vrouwen
      voor wat betreft het personeel op het gebied van onderwijs en onderzoek dat werkzaam is in het door de instelling
      verzorgde onderwijs en onderzoek, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde
      cijfers. Het document vermeldt tevens de maatregelen die het instellingsbestuur heeft genomen en zal nemen teneinde
      de in de eerste volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte
      resultaten van het beleid inzake evenredige vertegenwoordiging van vrouwen in leidinggevende functies gedurende de
      periode waarvoor het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.2
  - number: 4.2.5
    text: |-
      Het instellingsbestuur draagt er zorg voor dat een exemplaar van het document in het gebouw van de instelling ter
      inzage wordt gelegd op een voor het personeel en de studenten toegankelijke plaats, alsmede dat een exemplaar wordt
      bewaard bij de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.2
  - number: 4.5.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur gestelde regels als bedoeld in het tweede en
      derde lid regelt het instellingsbestuur van een openbare instelling de rechtspositie van het personeel en draagt
      het instellingsbestuur van een bijzondere instelling zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.5.2.a
    text: |-
      salarisschalen en uitgangspunten waaraan een door het instellingsbestuur in te richten functiewaarderingssysteem
      moet voldoen, onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      rechten en plichten van het personeel en het instellingsbestuur bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, voorzover deze bij wet voorgeschreven rechten en verplichtingen te boven gaan,
      dan wel de voorwaarden waaronder het instellingsbestuur deze rechten en plichten zelf regelt dan wel voor de
      regeling daarvan zorg draagt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.5.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.5.4
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen inzake benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De bepalingen
      omtrent ontslag mogen het personeel van de openbare instellingen niet minder rechten verschaffen dan die
      welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 4.5.5
    text: |-
      Over de regelingen, bedoeld in het eerste en vierde lid, alsmede over andere aangelegenheden van algemeen belang
      voor de bijzondere rechtstoestand van het personeel van de desbetreffende instelling, wordt door of namens
      het instellingsbestuur overleg gevoerd met de daarvoor in aanmerking komende vakorganisaties van overheids- en
      onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval van een geschil over de deelneming
      aan het overleg, bedoeld in de vorige volzin, alsmede in geval van een geschil over de aard, de inhoud en de
      organisatie van het overleg leggen de betrokken partijen het geschil voor aan een geschillencommissie. Deze
      geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden aangewezen. De uitspraak van
      de geschillencommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.5
  - number: 4.7.1
    text: |-
      Elke bijzondere instelling is aangesloten bij een commissie van beroep, waarbij door elk personeelslid van die
      instelling dat rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen een beslissing, door of
      namens het instellingsbestuur genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.1.c
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.1.d
    text: het direct of indirect onthouden van bevordering, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.1.e
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.2
    text: Een commissie van beroep strekt haar werkzaamheden uit over een of meer instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.3
    text: |-
      De commissie bestaat uit een even aantal gewone leden en, wanneer dit in het [beroepsreglement][ref1] is bepaald,
      evenveel plaatsvervangende leden, een voorzitter, tevens lid, en, wanneer dit in het [beroepsreglement][ref2] is
      bepaald, een of meer plaatsvervangende voorzitters. De besturen en het personeel van de aangesloten instellingen
      benoemen onderscheidenlijk kiezen elk de helft van het aantal gewone leden en plaatsvervangende leden. De gewone
      leden kiezen de voorzitter en de plaatsvervangende voorzitter of voorzitters. De voorzitter, de plaatsvervangend
      voorzitter of voorzitters en de overige leden en de eventuele plaatsvervangende leden worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002228
      [ref2]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
      - id: ref2
        bwb_id: BWBR0002228
  - number: 4.7.4
    text: |-
      De leden en de eventuele plaatsvervangende leden van de commissie van beroep mogen geen lid zijn van het bestuur
      van een aangesloten instelling noch deel uitmaken van het personeel van de vereniging of stichting waarvan die
      instelling uitgaat.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.5
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot
      ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.6
    text: De uitspraak van de commissie van beroep is voor het instellingsbestuur bindend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.7
    text: |-
      De besturen van de aangesloten instellingen stellen voor de commissie van beroep een [beroepsreglement][ref1]
      vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is gewaarborgd. Bij of
      krachtens het [beroepsreglement][ref2] worden geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002228
      [ref2]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
      - id: ref2
        bwb_id: BWBR0002228
  - number: 4.7.7.a
    text: de omvang en samenstelling van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.7.b
    text: de zittingstermijn van de leden en eventuele plaatsvervangende leden van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.7.c
    text: de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap eindigt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.7.d
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.7.e
    text: de wijze waarop in het secretariaat van de commissie van beroep wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 4.7.8
    text: |-
      Het [beroepsreglement][ref1] wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging
      is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002228
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0002228
  - number: 4.7.9
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen
      terzake van beslissingen die aan het oordeel van de commissie van beroep zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel4.7
  - number: 5a.1.1
    text: |-
      Dit hoofdstuk heeft betrekking op de bekostigde universiteiten en hogescholen en de Open Universiteit en op de
      universiteiten en hogescholen die ingevolge [artikel 6.9][ref1] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.1.2
    text: |-
      Dit hoofdstuk heeft tevens betrekking op de rechtspersonen met volledige rechtsbevoegdheid die een opleiding als
      bedoeld in [artikel 7.3b][ref1] verzorgen. Voor de toepassing van dit hoofdstuk wordt onder instellingsbestuur mede
      begrepen het bestuur van de rechtspersoon, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5a.2.1
    text: |-
      De Nederlands-Vlaamse Accreditatie Organisatie, gevestigd te Den Haag, en bedoeld in artikel 1 van het
      Accreditatieverdrag, is het accreditatieorgaan hoger onderwijs. Het accreditatieorgaan bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.2
  - number: 5a.2.2
    text: |-
      Het accreditatieorgaan is belast met activiteiten in het kader van het verlenen van accreditatie aan opleidingen in
      het hoger onderwijs en het afnemen van de toets nieuwe opleiding in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.2
  - number: 5a.2.3
    text: |-
      Het accreditatieorgaan heeft tevens tot taak de accreditatiekaders en toetsingskaders te bespreken met instanties
      in de Europese landen, in het bijzonder met instanties in de grenslanden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.2
  - number: 5a.2.4
    text: |-
      Bij ministeriële regeling worden de overige werkzaamheden bepaald die het accreditatieorgaan verricht in verband
      met de voorbereiding van een stelsel van bacheloropleidingen en masteropleidingen in Nederland, het beoordelen
      van ander onderwijs dan hoger onderwijs of in verband met opdrachten als bedoeld in artikel 1, tweede lid, van
      het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.2
  - number: 5a.3.1
    text: |-
      Voordat Onze minister een voordracht doet voor bestuursleden als bedoeld in artikel 5 van het Accreditatieverdrag,
      worden de gezamenlijke instellingen, bedoeld in artikel 1.2, onderdelen a en b, en de daarvoor in aanmerking
      komende vakorganisaties van overheids- en onderwijspersoneel gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.3
  - number: 5a.3.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het horen van de gezamenlijke studentenorganisaties, bedoeld in
      artikel 3.3, in verband met de voordracht van twee bestuursleden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.3
  - number: 5a.3.3
    text: De bestuursleden die door Onze minister worden voorgedragen zijn geen aan Onze minister ondergeschikte ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.3
  - number: 5a.3.4
    text: |-
      Voordat het Comité van Ministers, bedoeld in het Accreditatieverdrag, een door Onze minister voorgedragen
      bestuurslid schorst of ontslaat, worden de instellingen en vakorganisaties, bedoeld in het eerste lid, door Onze
      minister gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.3
  - number: 5a.3a
    text: De inspectie wordt in de gelegenheid gesteld de vergaderingen van het accreditatieorgaan bij te wonen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.3a
  - number: 5a.4.1
    text: |-
      Aan het lidmaatschap van het accreditatieorgaan is, indien dat bestuurslid door Onze minister is voorgedragen, een
      bezoldiging dan wel een schadeloosstelling verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.4
  - number: 5a.4.2
    text: Onze minister stelt de bezoldiging of de schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.4
  - number: 5a.4.3
    text: |-
      Buiten de bezoldiging of de schadeloosstelling en de vergoeding van bijzondere kosten in verband met zijn functie
      geniet een bestuurslid van het accreditatieorgaan geen inkomsten ten laste van het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.4
  - number: 5a.4.4
    text: |-
      Ten aanzien van de bestuursleden van het accreditatieorgaan wordt met overeenkomstige toepassing van
      [artikel 383 van Boek 2 van het Burgerlijk Wetboek][ref1] verslag gedaan in het jaarverslag, bedoeld in
      [artikel 5a.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.5
    text: |-
      Op het personeel in dienst van het accreditatieorgaan, zijn de rechtspositieregels die gelden voor de ambtenaren
      die zijn aangesteld bij ministeries, van overeenkomstige toepassing. De in die regels neergelegde bevoegdheden, met
      uitzondering van de aan Ons dan wel de aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegekende
      bevoegdheden tot het stellen van regels, worden uitgeoefend door het accreditatieorgaan. Voorzover in die regels
      is bepaald dat bevoegdheden worden uitgeoefend met medebetrokkenheid van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, worden deze bevoegdheden uitgeoefend met medebetrokkenheid van Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.5
  - number: 5a.6.1
    text: Het accreditatieorgaan zendt jaarlijks voor 1 april aan Onze minister de begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6
  - number: 5a.6.2
    text: |-
      Indien gedurende een kalenderjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      de begrote baten en lasten dan wel inkomsten en uitgaven, doet het accreditatieorgaan daarvan onverwijld mededeling
      aan Onze minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6
  - number: 5a.6a.1
    text: |-
      De begroting, bedoeld in artikel 5a.6, behelst een raming van de baten en lasten, een raming van de voorgenomen
      investeringsuitgaven en een raming van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6a.2
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6a.3
    text: |-
      Uit de toelichting blijkt steeds welke begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens
      de wet aan het accreditatieorgaan opgedragen taken dan wel op andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6a.4
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6a.5
    text: |-
      De begroting omvat voorts voorstellen aan Onze minister voor het bedrag dat in het desbetreffende jaar in de
      rijksbegroting zal worden opgenomen en voor de in het desbetreffende jaar te hanteren tarieven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6a.6
    text: |-
      Indien het accreditatieorgaan andere baten of inkomsten raamt, worden deze afzonderlijk vermeld en van een
      toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6a
  - number: 5a.6b.1
    text: |-
      Onze minister stelt jaarlijks aan het accreditatieorgaan ten laste van de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap overeenkomstig de artikelen 14 en 15, derde lid, van het Accreditatieverdrag
      financiële middelen ter beschikking voor de vervulling van zijn taken, voortvloeiend uit artikel 1, eerste en
      tweede lid, van het Accreditatieverdrag.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6b
  - number: 5a.6b.2
    text: |-
      Onze minister stelt jaarlijks voor 1 september van enig kalenderjaar, doch niet dan nadat hij daarover met
      het accreditatieorgaan heeft overlegd, het bedrag vast dat voor het daaropvolgende kalenderjaar aan het
      accreditatieorgaan ter beschikking zal worden gesteld en neemt dit bedrag op in het voorstel van wet tot
      vaststelling van de begroting van het Ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6b
  - number: 5a.6b.3
    text: Het boekjaar van het accreditatieorgaan valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6b
  - number: 5a.6b.4
    text: |-
      Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste en tweede lid, niet in werking is getreden,
      verstrekt Onze minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, in de vorm van
      maandelijkse termijnen een voorschot aan het accreditatieorgaan tot een maximum van het bedrag, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6b
  - number: 5a.6c
    text: 'Onze minister kan bepalen dat het accreditatieorgaan zijn voorafgaande instemming behoeft voor:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.a
    text: het oprichten van dan wel deelnemen in een rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.e
    text: |-
      het aangaan van overeenkomsten waarbij het accreditatieorgaan zich verbindt tot zekerheidstelling met inbegrip van
      zekerheidstelling voor schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6c.f
    text: |-
      het vormen van andere fondsen en reserveringen dan de egalisatiereserve, bedoeld in [artikel 5a.6d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.6c.g
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6c
  - number: 5a.6d.1
    text: Het accreditatieorgaan vormt een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6d
  - number: 5a.6d.2
    text: |-
      Het verschil tussen de gerealiseerde baten van het accreditatieorgaan en de gerealiseerde lasten van de
      activiteiten komt ten gunste onderscheidenlijk ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6d
  - number: 5a.6d.3
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.6d
  - number: 5a.7.1
    text: |-
      Het accreditatieorgaan stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in
      het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het
      afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7
  - number: 5a.7.2
    text: Het verslag wordt aan Onze minister gezonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7
  - number: 5a.7a
    text: |-
      Tegelijk met het jaarverslag, bedoeld in artikel 5a.7, dient het accreditatieorgaan de jaarrekening bij Onze
      minister in.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7a
  - number: 5a.7b.1
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7b
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 5a.7b.2
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door het accreditatieorgaan aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing van de accountant bedingt
      het accreditatieorgaan dat aan Onze minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden van
      de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 5a.7b.3
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7b
  - number: 5a.7b.4
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van het accreditatieorgaan voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.7b
  - number: 5a.8.1
    text: |-
      Het accreditatieorgaan legt zijn werkwijze voor de accreditatie van opleidingen vast in afzonderlijke
      accreditatiekaders voor opleidingen in het wetenschappelijk onderwijs en het hoger beroepsonderwijs, waarbij ten
      minste onderscheid wordt gemaakt tussen bacheloropleidingen en masteropleidingen. In de accreditatiekaders wordt
      tevens bepaald welke gegevens het instellingsbestuur meezendt bij een aanvraag om accreditatie, waartoe in elk
      geval behoort de aanduiding van de graad die door het instellingsbestuur kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.2
    text: |-
      Bij het verlenen van accreditatie wordt aandacht geschonken aan de aspecten van kwaliteit, die betrekking hebben
      op het niveau van de opleiding, de onderwijsinhoud, het onderwijsproces, de opbrengsten van het onderwijs van de
      opleiding, voldoende voorzieningen die noodzakelijk zijn om de opleiding te kunnen verzorgen, en op een adequate
      methode die bij de beoordeling, bedoeld in [artikel 1.18, derde lid][ref1], wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.8.3
    text: 'Bij de toepassing van het tweede lid wordt begrepen onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.a
    text: |-
      het niveau van de opleiding: dit is gericht op het eindniveau van de opleiding gelet op hetgeen gewenst en gangbaar
      is, bij voorkeur gemeten naar internationale standaard;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.b
    text: |-
      de onderwijsinhoud: deze omvat in ieder geval de aard van het onderwijs, voldoende samenhang in het
      opleidingsprogramma van de opleiding, de studielast en een duidelijke relatie tussen de doelstellingen en de inhoud
      van het opleidingsprogramma;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.c
    text: |-
      het onderwijsproces: dit omvat in ieder geval een voldoende afstemming tussen vormgeving van het onderwijs en de
      inhoud, voldoende studiebegeleiding en inzichtelijke beoordeling en toetsing van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.d
    text: |-
      de opbrengsten van het onderwijs: deze omvatten in ieder geval voldoende maatschappelijke relevantie van de
      bereikte eindkwalificaties van afgestudeerden van de opleiding en voldoende rendement van de opleiding in relatie
      tot de beargumenteerde streefcijfers;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.e
    text: |-
      de voorzieningen: deze omvatten in ieder geval de materiële voorzieningen, de kwaliteit van het personeel, de
      organisatie en de interne kwaliteitszorg;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.3.f
    text: |-
      de methoden die bij de beoordeling, bedoeld in [artikel 1.18, derde lid][ref1], worden gehanteerd: deze hebben
      in ieder geval betrekking op de mogelijkheid de opleiding te vergelijken met andere opleidingen en op een
      internationaal beoordelingskader.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.8.4
    text: |-
      Alvorens een accreditatiekader vast te stellen of te wijzigen voert het accreditatieorgaan overleg met
      vertegenwoordigers van de instellingen en andere betrokkenen, waaronder studentenorganisaties als bedoeld in
      [artikel 3.3][ref1] en de daarvoor in aanmerking komende vakorganisaties van overheids- en onderwijspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '3'
        hoofdstuk: '3'
  - number: 5a.8.5
    text: |-
      Een accreditatiekader of een wijziging daarvan behoeft de goedkeuring van Onze minister. De goedkeuring kan
      worden onthouden wegens strijd met het recht of het algemeen belang. Onze minister verleent zijn goedkeuring
      niet dan nadat vier weken zijn verstreken nadat zijn voornemen daartoe aan de beide kamers der Staten-Generaal is
      voorgelegd. Het besluit omtrent goedkeuring wordt binnen 17 weken na de verzending ter goedkeuring bekendgemaakt
      aan het accreditatieorgaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.6
    text: De accreditatiekaders worden bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8.7
    text: |-
      Het accreditatieorgaan legt zijn werkwijze voor de toets nieuwe opleiding vast in afzonderlijke toetsingskaders
      voor opleidingen in het wetenschappelijk onderwijs en opleidingen in het hoger beroepsonderwijs waarbij ten minste
      onderscheid wordt gemaakt tussen bacheloropleidingen en masteropleidingen. De tweede volzin van het eerste lid
      en het tweede tot en met zesde lid, met uitzondering van het derde lid, onderdeel f, zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8
  - number: 5a.8a
    text: |-
      Het accreditatieorgaan maakt jaarlijks aan de instellingen bekend welke instanties met behulp van onafhankelijke
      deskundigen als bedoeld in [artikel 1.18, derde lid, eerste volzin][ref1], opleidingen beoordelen op de wijze,
      bedoeld in [artikel 1.18, derde lid, vierde volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.8a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.9.1
    text: Accreditatie wordt verleend op aanvraag van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.2
    text: |-
      Een aanvraag om accreditatie wordt ten minste een jaar voor de vervaldatum van het vorige accreditatiebesluit
      of van het besluit waaruit blijkt dat de toets nieuwe opleiding met positief gevolg is ondergaan, bij het
      accreditatieorgaan ingediend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.3
    text: |-
      Het accreditatiebesluit wordt gebaseerd op de beoordeling, bedoeld in [artikel 1.18, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.9.4
    text: |-
      Het accreditatieorgaan neemt binnen drie maanden na ontvangst van de aanvraag om accreditatie een besluit. Het
      accreditatiebesluit treedt in werking met ingang van de dag waarop het vorige accreditatiebesluit vervalt of,
      indien aan een opleiding voor de eerste maal accreditatie wordt verbonden, met ingang van de dag van bekendmaking
      van het accreditatiebesluit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.5
    text: |-
      Indien het accreditatieorgaan besluit dat geen accreditatie wordt verleend omdat bij de beoordeling, bedoeld in
      [artikel 1.18, derde lid][ref1], door de onafhankelijke deskundigen [artikel 1.18, derde lid, vierde volzin][ref2],
      niet in acht is genomen, treedt, in afwijking van het vierde lid, dat besluit in werking met ingang van de dag
      van bekendmaking daarvan en kan binnen een jaar na die bekendmaking, een nieuwe aanvraag om accreditatie worden
      ingediend. In afwijking van het zesde lid, is de periode van de accreditatie alsdan verlengd tot het moment dat,
      onder de voorwaarden van het zevende lid, onherroepelijk op de aanvraag om accreditatie is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.9.6
    text: De accreditatie vervalt zes jaar na de dag van inwerkingtreding van het accreditatiebesluit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.7
    text: |-
      Indien een instellingsbestuur binnen de termijn, bedoeld in het tweede lid, een aanvraag om accreditatie heeft
      ingediend, is, in afwijking van het zesde lid, de periode van de accreditatie verlengd tot het moment dat
      onherroepelijk op de aanvraag om accreditatie is beslist indien:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.7.a
    text: het accreditatieorgaan de termijn, bedoeld in het vierde lid, heeft overschreden, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.7.b
    text: op de vervaldatum nog niet onherroepelijk op de aanvraag om accreditatie is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.9.8
    text: |-
      De instelling is het accreditatieorgaan een vergoeding verschuldigd van de kosten van de aanvraag om accreditatie
      overeenkomstig een door Onze minister, na overleg met het accreditatieorgaan, vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.9
  - number: 5a.10.1
    text: |-
      Het accreditatieorgaan legt de bevindingen naar aanleiding van de beoordeling van de opleiding, bedoeld
      in [artikel 5a.9, derde lid][ref1], en het besluit over de accreditatie van de opleiding vast in een
      accreditatierapport. Het accreditatieorgaan kan in het accreditatierapport overige opmerkingen opnemen over de
      bijzondere kwaliteitskenmerken van de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.10.2
    text: |-
      Alvorens het accreditatierapport vast te stellen stelt het accreditatieorgaan het instellingsbestuur in de
      gelegenheid binnen een door het accreditatieorgaan te bepalen termijn zijn zienswijze over het voorgenomen
      accreditatierapport naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.10
  - number: 5a.10.3
    text: |-
      Het accreditatieorgaan zendt het accreditatierapport na vaststelling onverwijld aan het instellingsbestuur en maakt
      het rapport tegelijkertijd openbaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.10
  - number: 5a.10.4
    text: |-
      Het accreditatieorgaan verstrekt een afschrift van het accreditatierapport op verzoek. Het accreditatieorgaan
      vraagt een vergoeding van de kosten voor de afgifte van een afschrift van het accreditatierapport overeenkomstig
      een door Onze minister, na overleg met het accreditatieorgaan, vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.10
  - number: 5a.11.1
    text: |-
      Een opleiding die niet is opgenomen in het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref1], kan een toets nieuwe opleiding ondergaan. Indien deze toets positief is, kan het
      instellingsbestuur die opleiding als nieuwe opleiding laten registreren in dat register. In afwijking van de tweede
      volzin kan het instellingsbestuur een masteropleiding in het hoger beroepsonderwijs eerst laten registreren, indien
      ten aanzien van die opleiding toepassing is gegeven aan [artikel 7.3a, tweede lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5a.11.2
    text: De toets nieuwe opleiding vindt plaats op aanvraag van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.3
    text: |-
      Bij de toets nieuwe opleiding wordt in ieder geval rekening gehouden met het door het instellingsbestuur verstrekte
      document waarin ten minste zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.3.a
    text: het opleidingsprogramma,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.3.b
    text: |-
      het financieel overzicht waarin inzicht wordt verschaft in de uitgaven die voor het tot stand brengen van de
      opleiding noodzakelijk zijn,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.3.c
    text: een beschrijving van het voor de opleiding benodigde personeel naar omvang en kwalificatie,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.3.d
    text: de aanduiding van de graad die door het instellingsbestuur kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.4
    text: |-
      Het accreditatieorgaan besluit dat een toets nieuwe opleiding niet positief is, indien uit de gegevens van de
      betreffende aanvraag blijkt dat de instelling voornemens is een opleiding te verzorgen die geheel of in hoofdzaak
      overeenstemt met een opleiding, verzorgd door diezelfde instelling, waaraan accreditatie is onthouden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.5
    text: 'Het besluit waaruit blijkt dat de toets nieuwe opleiding met positief gevolg is ondergaan, vervalt:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.5.a
    text: |-
      indien het instellingsbestuur van een bekostigde instelling de opleiding niet binnen zes maanden na dat besluit
      heeft laten registreren in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.11.5.b
    text: 'in andere gevallen dan als bedoeld in onderdeel a: na zes jaar.'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.6
    text: |-
      De [artikelen 5a.9, achtste lid][ref1], en [5a.10][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.11.7
    text: |-
      Indien voor een masteropleiding in het hoger beroepsonderwijs die de voortzetting vormt van een postinitiële
      masteropleiding in het hoger beroepsonderwijs, een toets nieuwe opleiding wordt aangevraagd en voor laatstbedoelde
      opleiding accreditatie is verleend, besluit het accreditatieorgaan dat voor de masteropleiding in het hoger
      beroepsonderwijs de toets nieuwe opleiding met positief gevolg is ondergaan. Dit besluit is geldig voor de termijn
      waarop de accreditatie betrekking had.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
  - number: 5a.11.8
    text: |-
      Tenzij Onze minister voor een opleiding anders besluit, is dit artikel niet van toepassing op opleidingen waarvoor
      de artikelen [7.53][ref1] of [7.56][ref2] zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 5a.12.1
    text: |-
      Indien de accreditatie van een opleiding na het verstrijken van de periode, bedoeld in
      [artikel 5a.9, zesde en zevende lid][ref1], niet opnieuw wordt verleend, draagt de instelling er zorg voor dat aan
      studenten die voor de opleiding zijn ingeschreven, de gelegenheid wordt geboden deze opleiding te voltooien aan een
      andere instelling. De instelling stelt de redelijke termijn vast gedurende welke de opleiding wordt voortgezet ten
      behoeve van studenten voor wie het niet mogelijk is de opleiding aan een andere instelling te voltooien, indien zij
      die opleiding zonder onderbreking blijven volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12.2
    text: |-
      Het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde en zevende lid][ref1], heeft ten aanzien van een
      bekostigde instelling tot gevolg dat na het verstrijken van de door de instelling vastgestelde termijn, genoemd in
      het eerste lid, geen aanspraak bestaat op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref2], dat aan de
      examens geen graad als bedoeld in [artikel 7.10a][ref3] is verbonden en dat de registratie in het Centraal register
      opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref4], wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12.3
    text: |-
      Het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde en zevende lid][ref1], heeft ten aanzien van een
      aangewezen instelling tot gevolg dat na het verstrijken van de door de instelling vastgestelde termijn, genoemd in
      het eerste lid, aan de examens geen graad als bedoeld in [artikel 7.10a][ref2] is verbonden en dat de registratie
      in het Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref3], wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12.4
    text: |-
      Het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde en zevende lid][ref1], heeft ten aanzien van
      een rechtspersoon als bedoeld in [artikel 5a.1, tweede lid][ref2], tot gevolg dat na het verstrijken van de
      door de rechtspersoon vastgestelde termijn, genoemd in het eerste lid, aan de examens geen graad als bedoeld in
      [artikel 7.10a][ref3] is verbonden en dat de registratie in het Centraal register opleidingen hoger onderwijs wordt
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 5a.12.5
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing ten aanzien van een opleiding die op grond
      van [artikel 5a.11, eerste lid][ref1], als nieuwe opleiding is opgenomen in het Centraal register opleidingen
      hoger onderwijs en waaraan binnen de termijn, genoemd in [artikel 5a.11, vijfde lid][ref2], geen accreditatie is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid en indien het belang van het instandhouden van een
      doelmatig onderwijsaanbod dit vordert, kan Onze minister na het verstrijken van de periode, bedoeld in
      [artikel 5a.9, zesde en zevende lid][ref1], besluiten dat een bekostigde instelling gedurende een door Onze
      minister vast te stellen termijn aanspraak behoudt op bekostiging als bedoeld in [artikel 1.9, eerste lid][ref2],
      dat aan de examens een graad als bedoeld in [artikel 7.10a][ref3] blijft verbonden en dat de registratie in het
      Centraal register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref4], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.12a.1
    text: |-
      In afwijking van [artikel 5a.12, eerste tot en met vierde lid][ref1], kan een instelling binnen twee weken na het
      verstrijken van de periode, bedoeld in [artikel 5a.9, zesde lid][ref2], besluiten er voor zorg te dragen dat voor
      de opleiding binnen een termijn van twee jaar na die periode accreditatie wordt verkregen. Indien een instelling
      daartoe besluit, heeft het verstrijken van de periode, bedoeld in [artikel 5a.9, zesde lid][ref3], tot gevolg dat
      er geen studenten voor de eerste maal voor de opleiding worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12a.2
    text: |-
      Indien binnen de termijn van twee jaar, bedoeld in het eerste lid, geen accreditatie aan de opleiding is verleend,
      is [artikel 5a.12][ref1] van overeenkomstige toepassing met ingang van de eerste dag na die twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.12a.3
    text: |-
      Indien binnen de termijn van twee jaar, bedoeld in het eerste lid, accreditatie aan de opleiding is verleend,
      treedt dat accreditatiebesluit, in afwijking van [artikel 5a.9, vierde lid, tweede volzin][ref1], in werking met
      ingang van de dag van bekendmaking van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.14.1
    text: |-
      Het accreditatieorgaan verstrekt desgevraagd aan Onze minister alle voor de uitoefening van diens taak benodigde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.14
  - number: 5a.14.2
    text: |-
      Onze minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.14
  - number: 5a.15.1
    text: |-
      Onze minister kan een besluit van het accreditatieorgaan vernietigen, indien dit besluit is genomen in strijd met
      het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.15
  - number: 5a.15.2
    text: |-
      In afwijking van [artikel 5a.12][ref1], kan Onze minister bij toepassing van het eerste lid bepalen dat een
      instelling gedurende een door Onze minister te bepalen termijn aanspraak behoudt op bekostiging als bedoeld
      in [artikel 1.9, eerste lid][ref2], of dat aan de examens een graad als bedoeld in [artikel 7.10a][ref3]
      blijft verbonden en dat de registratie in het Centraal register opleidingen hoger onderwijs, bedoeld in
      [artikel 6.13][ref4], niet wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 5a.15.3
    text: Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.15
  - number: 5a.16
    text: |-
      Indien naar het oordeel van het Comité van Ministers ingevolge artikel 12 van het Accreditatieverdrag het
      accreditatieorgaan zijn taak ernstig verwaarloost, worden die voorzieningen, spoedeisende gevallen uitgezonderd,
      niet eerder getroffen dan nadat het accreditatieorgaan in de gelegenheid is gesteld om binnen een door Onze
      minister te stellen termijn alsnog zijn taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel5a.16
  - number: 6.1.1
    text: |-
      De titels 1 en 3 van dit hoofdstuk hebben betrekking op bekostigde universiteiten en hogescholen en op de Open
      Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Titel 2 heeft uitsluitend en titel 3 heeft tevens betrekking op universiteiten en hogescholen die ingevolge
      [artikel 6.9][ref1] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.3
    text: |-
      Titel 3 heeft tevens betrekking op masteropleidingen als bedoeld in [artikel 7.3b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.1
    text: |-
      Het instellingsbestuur legt het voornemen tot het verzorgen van een nieuwe opleiding ter instemming aan Onze
      minister voor met het oog op de beoordeling van een doelmatige taakverdeling tussen de instellingen, gelet op het
      geheel van de voorzieningen op het gebied van het hoger onderwijs. Het instellingsbestuur verstrekt daarbij het
      gegeven, in welke gemeente de opleiding wordt gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Het instellingsbestuur legt het voornemen voor nadat de opleiding de toets nieuwe opleiding met positief gevolg
      heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Onze minister wordt geacht met het voornemen in te stemmen, indien hij niet binnen vier maanden na ontvangst heeft
      verklaard dat aan het voornemen geen uitvoering kan worden gegeven in verband met een ondoelmatige taakverdeling
      tussen de instellingen die als gevolg daarvan zou ontstaan. Onze minister kan zich hierbij laten adviseren door een
      adviescommissie bestaande uit drie deskundigen uit de betrokken sector.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.2
  - number: 6.2.4
    text: |-
      Onze minister stelt beleidsregels vast op grond waarvan hij de aanvragen beoordeelt. Wijzigingen van de
      beleidsregels worden meegedeeld aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.2
  - number: 6.5.1
    text: |-
      Onze minister kan besluiten dat aan een opleiding de rechten, genoemd in [artikel 1.9, eerste en tweede lid][ref1],
      worden ontnomen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 6.5.1.a
    text: |-
      de verzorging van die opleiding, gelet op de spreiding en de mate van verscheidenheid van de voorzieningen in het
      hoger onderwijs, en het profiel van de instelling die de desbetreffende opleiding verzorgt, in redelijkheid niet of
      niet meer doelmatig kan worden geacht, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.5
  - number: 6.5.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald over de kwaliteitszorg, de
      registratie, het onderwijs, de examens, de promoties of de vooropleidingseisen of toelatingseisen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.5
  - number: 6.5.2
    text: |-
      Bij een besluit tot ontneming van rechten bepaalt Onze minister het tijdstip waarop dat besluit van kracht wordt,
      zodanig dat de voor de opleiding ingeschreven studenten de opleiding aan dezelfde instelling of aan een andere
      instelling binnen een redelijke termijn kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.5
  - number: 6.6.1
    text: |-
      Onze minister neemt een besluit op grond van [artikel 6.5, eerste lid, onderdeel a][ref1], uiterlijk acht weken
      na de datum waarop hij het voornemen tot het ontnemen van rechten aan de Tweede Kamer der Staten-Generaal bekend
      heeft gemaakt. Hij zendt gelijktijdig een afschrift van deze bekendmaking aan de instelling die het aangaat. Onze
      minister stelt ten minste drie maanden voordat hij het voornemen aan de Tweede Kamer bekendmaakt, de instelling van
      zijn voornemen tot ontneming van rechten op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2
    text: |-
      Voordat Onze minister een besluit neemt op de grond, genoemd in [artikel 6.5, eerste lid, onderdeel b][ref1], geeft
      hij het instellingsbestuur een waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg
      moet zijn gegeven en desgewenst overleg met hem plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg
      moet zijn gegeven, bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.9.1
    text: |-
      Het besluit tot aanwijzing van een andere dan een in de bijlage van deze wet genoemde instelling voor hoger
      onderwijs wordt genomen door Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.9
  - number: 6.9.2
    text: |-
      Het besluit tot aanwijzing wordt niet genomen dan nadat ten genoegen van Onze minister door het instellingsbestuur
      het bewijs is geleverd van voldoende kwaliteit van het initiële onderwijs, alsmede het bewijs dat wordt voldaan aan
      de in [artikel 1.12, tweede onderscheidenlijk derde lid][ref1], bedoelde voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 6.9.3
    text: |-
      Het besluit tot aanwijzing van universiteiten wordt niet genomen dan nadat ten genoegen van Onze minister door het
      instellingsbestuur het bewijs is geleverd van voldoende kwaliteit van het wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.9
  - number: 6.9.4
    text: |-
      Het besluit tot aanwijzing kan slechts worden genomen op een daartoe strekkende aanvraag van het
      instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.9
  - number: 6.10.1
    text: |-
      Onze minister kan besluiten dat aan een opleiding de rechten, genoemd in [artikel 1.12, eerste lid][ref1], worden
      ontnomen, indien niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van
      de kwaliteitszorg, de registratie, het onderwijs, de examens, de promoties of de vooropleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 6.10.2
    text: |-
      Een besluit op grond van het eerste lid houdt in dat aan de examens van de desbetreffende opleiding geen graad als
      bedoeld in [artikel 7.10a][ref1] is verbonden, en dat de registratie in het Centraal register opleidingen hoger
      onderwijs, bedoeld in [artikel 6.13][ref2], wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.10.3
    text: |-
      [Artikel 6.5, tweede lid][ref1], en [artikel 6.6][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.10
    references:
