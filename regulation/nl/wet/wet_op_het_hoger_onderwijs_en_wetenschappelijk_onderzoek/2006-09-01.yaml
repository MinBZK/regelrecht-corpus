  - number: '16.5'
    text: |-
      In afwijking van [artikel 7.24, tweede lid][ref1], gelden voor de inschrijving voor bij ministeriële regeling aan
      te wijzen masteropleidingen tot leraar voortgezet onderwijs van de eerste graad de bij die regeling vast te stellen
      aanvullende en afwijkende vooropleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.5
    references:
      - id: ref1
