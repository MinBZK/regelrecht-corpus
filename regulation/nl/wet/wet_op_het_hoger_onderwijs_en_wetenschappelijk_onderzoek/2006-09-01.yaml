        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.13.6
    text: Dit artikel is niet van toepassing, indien de rector magnificus tevens decaan is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.13
  - number: 9.14.1
    text: |-
      De decaan is belast met de algemene leiding van de faculteit. De decaan is voorts belast met het bestuur en de
      inrichting van de faculteit voor het onderwijs en de wetenschapsbeoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.14
  - number: 9.14.2
    text: |-
      De decaan werkt mede aan het bestuur van de universiteit door onder meer het plegen van overleg met het college van
      bestuur terzake van de voorbereiding van het instellingsplan en de begroting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.14
  - number: 9.14.3
    text: |-
      Onverminderd [artikel 9.5][ref1] stelt de decaan ter nadere regeling van het bestuur en de inrichting van de
      faculteit het faculteitsreglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.14.4
    text: |-
      Het faculteitsreglement behoeft de goedkeuring van het college van bestuur. De goedkeuring kan slechts worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.14
  - number: 9.14.5
