    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.8
  - number: 9.9.1
    text: De raad van toezicht is verantwoording verschuldigd aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.9
  - number: 9.9.2
    text: De raad van toezicht verstrekt Onze minister de gevraagde inlichtingen betreffende zijn handelen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.9
  - number: 9.10.1
    text: Aan een universiteit is een college voor promoties verbonden. Het college voor promoties bestaat uit hoogleraren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.10
  - number: 9.10.2
    text: |-
      Het college voor promoties hoort het college van bestuur over het verlenen van de graad, bedoeld in
      [artikel 7.19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 9.10.3
    text: |-
      In het bestuurs- en beheersreglement worden de taak, de samenstelling en de wijze van benoeming van het college
      voor promoties nader geregeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.10
  - number: '9.11'
    text: |-
      In het bestuurs- en beheersreglement wordt bepaald welke faculteiten of faculteit een universiteit omvat. Tevens
      wordt in dat reglement vermeld welke opleidingen in die faculteiten of faculteit zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.11
  - number: 9.12.1
    text: |-
      De verzorging van het onderwijs en de beoefening van de wetenschap geschieden in de faculteit. Aan het hoofd van de
      faculteit staat de decaan van de faculteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.12
  - number: 9.12.2
    text: |-
      In afwijking van het eerste lid kan in het bestuurs- en beheersreglement worden bepaald dat aan het hoofd van
      de faculteit een bestuur staat, bestaande uit de decaan van de faculteit, tevens voorzitter, en een of meer
      andere leden. Indien de eerste volzin toepassing heeft gevonden, wordt in deze titel en in [titel 2][ref1]
      met uitzondering van [artikel 9.13, vierde en zesde lid][ref2], onder decaan tevens verstaan het bestuur van
      de faculteit. Indien aan het hoofd van de faculteit een meerhoofdig bestuur staat, wordt een student van de
      desbetreffende faculteit in de gelegenheid gesteld de vergaderingen van dit bestuur bij te wonen in welke
      vergaderingen deze student een adviserende stem heeft. In het bestuurs- en beheersreglement wordt bepaald, op welke
      wijze de in de vorige volzin bedoelde student wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.12
