  - number: 6.13.4.m
    text: |-
      de door de instelling op grond van [artikel 5a.12, eerste lid, tweede volzin][ref1], vastgestelde termijn,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.13
    references:
