  - number: 18.4.2
    text: |-
      Ten aanzien van een bezwaarschrift of beroepschrift tegen een besluit op grond van de [artikelen 6.4][ref1],
      [6.5][ref2], [6.8][ref3], [6.10][ref4] en [6.11][ref5] of onderdelen daarvan, dat is ingediend voor de datum van
      het vervallen van die artikelen, blijft het recht zoals het gold voor die datum van toepassing.


