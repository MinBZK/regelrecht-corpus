  - number: '16.2'
    text: |-
      Degene die voor 4 september 1956 aan de voormalige technische hogeschool te Delft met goed gevolg het
      ingenieursexamen heeft afgelegd, behoudt tot 1 augustus 2005 de bevoegdheid tot het geven van onderwijs in de
      vakken waarin hij blijkens het hem verleende getuigschrift de bevoegdheid had onderwijs te geven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.2
  - number: '16.3'
    text: |-
      Naast de bewijzen van voldoende didactische voorbereiding die voor 1 augustus 1993 aan een hogeschool of
      voor 1 september 1993 aan een universiteit zijn verkregen, alsmede de verklaringen van voldoende didactische
      voorbereiding die op grond van artikel 54, vierde lid, of artikel 110a, vierde lid, van de Wet op het hoger
      beroepsonderwijs zijn verkregen, gelden als zodanig de op 31 juli 1986 bestaande bewijzen van voldoende
      pedagogische en didactische voorbereiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.3
  - number: '16.4'
    text: |-
      Tot het tijdstip van inwerkingtreding van de algemene maatregel van bestuur, bedoeld in de [artikelen 13.1][ref1]
      en [13.3][ref2], onderscheidenlijk het koninklijk besluit, bedoeld in [artikel 10.11][ref3], blijven de op
      het tijdstip van inwerkingtreding van deze wet geldende regels ten aanzien van de desbetreffende leden van
      bestuursorganen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.4
