        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.15.1.a
    text: het instellingsbestuur te kennen heeft gegeven dat de instelling de opleiding niet langer zal verzorgen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
  - number: 6.15.1.b
    text: |-
      de termijn, bedoeld in de [artikelen 5a.12, eerste, vierde of vijfde lid][ref1], of [5a.15, tweede lid][ref2],
      is verstreken,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 6.15.1.c
    text: |-
      Onze minister met toepassing van [artikel 6.5][ref1] heeft besloten dat ten aanzien van de opleiding de rechten,
      genoemd in [artikel 1.9, eerste en tweede lid][ref2], ontnomen worden, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 6.15.1.d
    text: |-
      Onze minister met toepassing van de [artikelen 6.10][ref1] of [6.12][ref2] heeft besloten dat de aanwijzing niet
      betrekking zal hebben op de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.15.2
    text: |-
      De Informatie Beheer Groep wijzigt de registratie van het gegeven, bedoeld in
      [artikel 6.13, vierde lid, onder l][ref1], overeenkomstig het besluit, bedoeld in [artikel 7.17a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.15.3
    text: |-
      De kennisgeving, bedoeld in het eerste lid, onder a, geschiedt uiterlijk op 28 februari van het kalenderjaar
      voorafgaand aan het eerste studiejaar waarin de inschrijving voor de propedeutische fase van de bacheloropleiding
      of, indien die fase niet is ingesteld, de inschrijving voor de bacheloropleiding dan wel inschrijving voor de
      masteropleiding niet meer openstaat.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.15
  - number: 7.1.1
    text: Dit hoofdstuk heeft betrekking op bekostigde universiteiten en hogescholen en op de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.1
  - number: 7.1.2
    text: |-
      De titels 1, 2 en 2a van dit hoofdstuk met uitzondering van [artikel 7.17][ref1] hebben betrekking op
      universiteiten en hogescholen die ingevolge [artikel 6.9][ref2] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.1.3
    text: |-
      [Artikel 7.10a][ref1] heeft tevens betrekking op masteropleidingen als bedoeld in [artikel 7.3b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.2
  - number: 7.2.a
    text: wanneer het een opleiding met betrekking tot die taal betreft,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.2
  - number: 7.2.b
    text: wanneer het onderwijs betreft dat in het kader van een gastcollege door een anderstalige docent gegeven wordt, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.2
  - number: 7.2.c
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de studenten
      daartoe noodzaakt, overeenkomstig een door het instellingsbestuur vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.2
  - number: 7.3.1
    text: Het initiële onderwijs wordt door de instelling aangeboden in de vorm van opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Een opleiding is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking van welomschreven
      doelstellingen op het gebied van kennis, inzicht en vaardigheden waarover degene die de opleiding voltooit, dient
      te beschikken. Een onderwijseenheid kan betrekking hebben op de praktische voorbereiding op de beroepsuitoefening
      en op de beroepsuitoefening in verband met het onderwijs in een duale opleiding, voorzover deze activiteiten onder
      begeleiding van het instellingsbestuur plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3
  - number: 7.3.3
    text: Aan elke opleiding is een examen verbonden. Aan elke onderwijseenheid is een tentamen verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3
  - number: 7.3.4
    text: |-
      Elke opleiding wordt op de voet van [titel 3 van hoofdstuk 6][ref1] geregistreerd in het Centraal register
      opleidingen hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '6'
  - number: 7.3a.1
    text: 'Binnen het wetenschappelijk onderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.1.a
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.1.b
    text: masteropleidingen, volgend op de bacheloropleidingen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.2
    text: 'Binnen het hoger beroepsonderwijs worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.2.a
    text: bacheloropleidingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.2.b
    text: masteropleidingen die door Onze minister als zodanig zijn aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.3
    text: |-
      Een besluit als bedoeld in het tweede lid, onder b, wordt uitsluitend genomen, indien in een opleiding niet of in
      onvoldoende mate is voorzien en de instandhouding van die opleiding wordt gevorderd door:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.3.a
    text: het belang van het instandhouden van een doelmatig onderwijsaanbod, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3a.3.b
    text: een aantoonbare maatschappelijke behoefte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3a
  - number: 7.3b
    text: 'Naast de opleidingen, bedoeld in artikel 7.3a, worden binnen het hoger onderwijs onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3b
  - number: 7.3b.a
    text: postinitiële masteropleidingen in het wetenschappelijk onderwijs, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3b
  - number: 7.3b.b
    text: postinitiële masteropleidingen in het hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3b
  - number: 7.3c.1
    text: |-
      Een student die is ingeschreven voor een opleiding in het wetenschappelijk onderwijs, kan, met toestemming
      van de examencommissie die daarvoor het meest in aanmerking komt, zelf uit onderwijseenheden die door een
      instelling worden verzorgd, een programma samenstellen waaraan een examen is verbonden. Indien nodig wijst het
      instellingsbestuur een examencommissie aan die met de in de eerste volzin bedoelde beslissing is belast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3c
  - number: 7.3c.2
    text: |-
      De examencommissie geeft bij het verlenen van de in het eerste lid bedoelde toestemming aan tot welke door de
      instelling aangeboden opleiding het door de betrokkene samengestelde programma voor de toepassing van deze wet
      wordt geacht te behoren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.3c
  - number: 7.4.1
    text: |-
      De studielast van elke opleiding en elke onderwijseenheid wordt door het instellingsbestuur uitgedrukt in
      studiepunten. De studielast voor een studiejaar bedraagt zestig studiepunten. Zestig studiepunten is gelijk aan
      1680 uren studie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Een opleiding wordt zodanig ingericht dat een student in redelijkheid in staat wordt gesteld om te voldoen aan de
      norm voor de studievoortgang, genoemd in artikel [10.6, tweede lid, van de Wet studiefinanciering 2000][ref1], of
      de norm vastgesteld krachtens [artikel 10.6, derde lid][ref2], van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '10'
  - number: 7.4a.1
    text: |-
      De studielast van een bacheloropleiding in het wetenschappelijk onderwijs bedraagt 180 studiepunten. In afwijking
      van de eerste volzin kan de studielast van een bacheloropleiding in het wetenschappelijk onderwijs ten hoogste 240
      studiepunten bedragen, indien Onze minister voor die opleiding daartoe een besluit heeft genomen dat gebaseerd is
      op het accreditatierapport van die opleiding. In het besluit, bedoeld in de tweede volzin, wordt de studielast van
      de opleiding bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.2
    text: |-
      Behoudens het bepaalde in het derde tot en met zevende lid bedraagt de studielast van een masteropleiding in het
      wetenschappelijk onderwijs 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.3
    text: |-
      De studielast van de masteropleidingen tot leraar voor de periode van voorbereidend hoger onderwijs in vakken
      van voortgezet onderwijs bedraagt ten minste 60 studiepunten en ten hoogste 120 studiepunten. In afwijking van de
      eerste volzin bedraagt de studielast van bij algemene maatregel van bestuur aan te wijzen opleidingen als bedoeld
      in die volzin ten minste 120 studiepunten en ten hoogste 180 studiepunten. Het instellingsbestuur bepaalt de
      studielast van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.4
    text: |-
      De studielast van de masteropleidingen voor het beroep van tandarts en voor het beroep van wijsgeer van een bepaald
      wetenschapsgebied bedraagt 120 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.5
    text: |-
      De studielast van de bij algemene maatregel van bestuur aan te wijzen masteropleidingen in het wetenschappelijk
      onderwijs bedraagt 120 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.6
    text: |-
      De studielast van de masteropleidingen voor het beroep van arts, voor het beroep van dierenarts, voor het beroep
      van apotheker en voor het beroep van klinisch technoloog bedraagt 180 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.7
    text: De studielast van de masteropleidingen geneeskunde, klinisch onderzoeker bedraagt 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4a.8
    text: |-
      Het instellingsbestuur kan bepalen dat een opleiding als bedoeld in het tweede lid een grotere studielast heeft dan
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4a
  - number: 7.4b.1
    text: De studielast van een bacheloropleiding in het hoger beroepsonderwijs bedraagt 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4b
  - number: 7.4b.2
    text: De studielast van een masteropleiding in het hoger beroepsonderwijs bedraagt 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4b
  - number: 7.4b.3
    text: |-
      Het instellingsbestuur kan bepalen dat een opleiding als bedoeld in het tweede lid een grotere studielast heeft dan
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.4b
  - number: 7.6.1
    text: |-
      Indien een instelling een opleiding aanbiedt, gericht op een bepaald beroep, en bij of krachtens de wet vereisten
      zijn gesteld ten aanzien van de kennis, het inzicht en de vaardigheden die betrokkenen zich op grond van de
      opleiding tot dat beroep moeten hebben verworven, draagt het instellingsbestuur er zorg voor dat degenen die deze
      opleiding volgen, ten minste in de gelegenheid zijn aan die vereisten te voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Tot de in het eerste lid bedoelde vereisten behoren die welke zijn neergelegd in de volgende Richtlijnen van de
      Raad van Europese Gemeenschappen:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.a
    text: Richtlijn van 5 april 1993, 93/16/EEG (PbEG, L 165) (ten aanzien van artsen);
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.b
    text: Richtlijn van 27 juni 1977, 77/453/EEG (*PbEG*, L 176) (ten aanzien van verpleegkundigen);
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.c
    text: Richtlijn van 25 juli 1978, 78/687/EEG (*PbEG*, L 233) (ten aanzien van tandartsen);
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.d
    text: Richtlijn van 18 december 1978, 78/1027/EEG (*PbEG*, L 362) (ten aanzien van dierenartsen);
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.e
    text: Richtlijn van 10 juni 1985, 85/385/EEG (*PbEG*, L 223) (ten aanzien van architecten);
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.2.f
    text: Richtlijn van 16 september 1985, 85/432/EEG (*PbEG*, L 253) (ten aanzien van apothekers).
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.6.3
    text: |-
      Opleidingen die in het bijzonder zijn gericht op bepaalde beroepen omvatten in elk geval een praktische
      voorbereiding op de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.6
  - number: 7.7.1
    text: |-
      Opleidingen aan universiteiten en hogescholen kunnen voltijds, deeltijds of duaal zijn ingericht en worden alsdan
      aangeduid als voltijdse, deeltijdse onderscheidenlijk duale opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.2
    text: |-
      Een duale opleiding is zodanig ingericht dat het volgen van onderwijs gedurende een of meer perioden wordt
      afgewisseld met beroepsuitoefening in verband met dat onderwijs. Deze beroepsuitoefening vindt in het
      wetenschappelijk onderwijs niet plaats gedurende de propedeutische fase van een bacheloropleiding of, indien die
      fase niet is ingesteld, gedurende de eerste periode in die opleiding met een studielast van 60 studiepunten. Het
      gedeelte van een duale opleiding dat bestaat uit het volgen van onderwijs, wordt aangeduid als onderwijsdeel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.3
    text: |-
      De studielast van het deel van de duale opleiding dat wordt gevormd door de beroepsuitoefening in verband met het
      onderwijs, bedraagt een door het instellingsbestuur in de onderwijs- en examenregeling te beargumenteren aantal
      studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.4
    text: 'In de onderwijs- en examenregeling wordt voor een duale opleiding aangegeven:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.4.a
    text: de minimale studielast van het onderwijsdeel,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.4.b
    text: |-
      de tijdsduur van de periode of de gezamenlijke tijdsduur van de perioden die ten minste in de beroepsuitoefening
      wordt doorgebracht, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.4.c
    text: de minimale studielast van het deel van de opleiding dat wordt gevormd door de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.5
    text: |-
      De beroepsuitoefening binnen een duale opleiding vindt plaats op basis van een overeenkomst, gesloten door de
      instelling, de student en het desbetreffend bedrijf of de desbetreffende organisatie. De overeenkomst regelt de
      rechten en verplichtingen van partijen en omvat met inachtneming van het dienaangaande bij of krachtens deze wet
      bepaalde ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.5.a
    text: de duur van de overeenkomst en de tijdsduur van de periode of perioden van de beroepsuitoefening,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.5.b
    text: de begeleiding van de student,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.7.5.c
    text: |-
      dat deel van de kwaliteiten, bedoeld in [artikel 7.13, tweede lid, onder c][ref1], dat de student tijdens de
      periode of de perioden van beroepsuitoefening dient te realiseren, en de beoordeling daarvan, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.7.5.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.7
  - number: 7.8.1
    text: |-
      Het instellingsbestuur van een universiteit of van de Open Universiteit kan in een bacheloropleiding in het
      wetenschappelijk onderwijs een propedeutische fase instellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8
  - number: 7.8.2
    text: Een bacheloropleiding in het hoger beroepsonderwijs omvat een propedeutische fase.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8
  - number: 7.8.3
    text: |-
      Aan de propedeutische fase is, voorzover in de onderwijs- en examenregeling niet anders is bepaald, een
      propedeutisch examen verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8
  - number: 7.8.4
    text: |-
      De studielast van de propedeutische fase waaraan een propedeutisch examen is verbonden, bedraagt 60 studiepunten.
      De studielast van de propedeutische fase van een duale bacheloropleiding bedraagt 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8
  - number: 7.8.5
    text: |-
      De propedeutische fase wordt met het oog op de toepassing van [artikel 7.8b][ref1] zodanig ingericht dat er sprake
      is van het verkrijgen van inzicht in de inhoud van de bacheloropleiding met de mogelijkheid van verwijzing en
      selectie aan het eind van die fase.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.8b.1
    text: |-
      Het instellingsbestuur van een bekostigde universiteit of hogeschool brengt iedere student uiterlijk aan het einde
      van diens eerste jaar van inschrijving voor de propedeutische fase van een voltijdse of duale bacheloropleiding
      advies uit over de voortzetting van zijn studie binnen of buiten de bacheloropleiding. In geval van een deeltijdse
      bacheloropleiding regelt het instellingsbestuur het tijdstip waarop dat advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.2
    text: |-
      Onverminderd het eerste lid kan het instellingsbestuur het advies aan de student uitbrengen zolang deze het
      propedeutisch examen niet met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.3
    text: |-
      Aan een advies als bedoeld in het eerste of tweede lid kan het instellingsbestuur ten aanzien van opleidingen
      die daartoe door het instellingsbestuur zijn aangewezen, binnen het in het tweede lid bedoelde tijdvak, doch
      niet eerder dan tegen het einde van het eerste jaar van inschrijving, een afwijzing verbinden. Deze afwijzing kan
      slechts worden gegeven, indien de student naar het oordeel van het instellingsbestuur, met inachtneming van zijn
      persoonlijke omstandigheden, niet geschikt moet worden geacht voor de opleiding, doordat zijn studieresultaten
      niet voldoen aan de vereisten die het bestuur daaromtrent heeft vastgesteld. Het instellingsbestuur kan aan de
      afwijzing een termijn verbinden. Het instellingsbestuur kan de afwijzing uitstrekken tot opleidingen die met de
      desbetreffende opleiding het propedeutisch examen gemeen hebben. Het instellingsbestuur kan van de bevoegdheid
      krachtens dit lid slechts gebruikmaken, indien het in de propedeutische fase van de desbetreffende opleiding zorgt
      voor zodanige voorzieningen dat de mogelijkheden voor goede studievoortgang zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.4
    text: |-
      Voordat het instellingsbestuur tot afwijzing overgaat, geeft het de desbetreffende student een waarschuwing
      onder bepaling van een redelijke termijn waarbinnen de studieresultaten ten genoegen van dat bestuur moeten zijn
      verbeterd. Het instellingsbestuur stelt de student alvorens tot een afwijzing over te gaan in de gelegenheid te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.5
    text: |-
      Van de student die op grond van het derde lid is afgewezen, wordt de inschrijving voor de desbetreffende opleiding
      aan de betrokken instelling beëindigd. De student kan niet opnieuw aan die instelling voor die opleiding worden
      ingeschreven, tenzij het instellingsbestuur toepassing heeft gegeven aan de derde volzin van het derde lid of
      tenzij de betrokkene op een later tijdstip verzoekt om te worden ingeschreven voor de desbetreffende opleiding
      en daarbij ten genoegen van het instellingsbestuur aannemelijk maakt dat hij die opleiding met vrucht zal kunnen
      volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.6
    text: |-
      Het instellingsbestuur stelt ter uitvoering van de voorgaande leden nadere regels vast. Deze regels hebben in
      elk geval betrekking op de studieresultaten en de voorzieningen, bedoeld in het derde lid, alsmede op de termijn,
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.7
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke persoonlijke omstandigheden, bedoeld in het derde lid, het
      instellingsbestuur in zijn beoordeling betrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.8b.8
    text: |-
      Voor de toepassing van dit artikel wordt onder «propedeutische fase» mede begrepen de eerste periode in een
      bacheloropleiding in het wetenschappelijk onderwijs met een studielast van 60 studiepunten. Voor de toepassing
      van dit artikel worden onder «propedeutisch examen» mede begrepen de tentamens, verbonden aan onderwijseenheden in
      de eerste periode in een bacheloropleiding in het wetenschappelijk onderwijs met een gezamenlijke studielast van
      60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.8b
  - number: 7.9.1
    text: |-
      Indien een bacheloropleiding na de propedeutische fase meer dan een afstudeerrichting omvat, kan het
      instellingsbestuur ten aanzien van opleidingen die daartoe door het instellingsbestuur zijn aangewezen, beslissen
      dat een voor die opleiding ingeschreven student slechts toegang heeft tot een of meer daarbij aan te geven
      afstudeerrichtingen. Het instellingsbestuur kan van de bevoegdheid krachtens dit lid slechts gebruikmaken, indien
      de aard en inhoud van de verschillende afstudeerrichtingen van de opleiding zodanig van elkaar verschillen dat
      toepassing van deze bevoegdheid gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.2
    text: 'Bij de toepassing van het eerste lid baseert het instellingsbestuur zijn beslissing:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.2.a
    text: op de studieresultaten van de student,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.2.b
    text: op het door de student gevolgde studieprogramma, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.2.c
    text: op een combinatie van a en b.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.3
    text: |-
      Bij de weging van de studieresultaten, bedoeld in het tweede lid, onder a en c, houdt het instellingsbestuur
      rekening met de persoonlijke omstandigheden van de student. Bij algemene maatregel van bestuur wordt bepaald welke
      persoonlijke omstandigheden het instellingsbestuur in zijn beoordeling betrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.4
    text: |-
      Bij de weging van het studieprogramma van de student, bedoeld in het tweede lid, onder b en c, beoordeelt het
      instellingsbestuur of de door de student gekozen programmaonderdelen van de opleiding voldoende aansluiten op de
      door de student gewenste afstudeerrichting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.5
    text: |-
      Het instellingsbestuur stelt ter uitvoering van dit artikel nadere regels vast. Deze regels hebben in elk geval
      betrekking op het verschil in afstudeerrichtingen, bedoeld in het eerste lid, op de studieresultaten, bedoeld in
      het derde lid, en op de aansluiting van programmaonderdelen en de afstudeerrichtingen van de opleiding, bedoeld in
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9.6
    text: |-
      Voor de toepassing van dit artikel wordt onder «propedeutische fase» mede begrepen de eerste periode in een
      bacheloropleiding in het wetenschappelijk onderwijs met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9
  - number: 7.9a.1
    text: |-
      Het instellingsbestuur stelt van iedere aan de instelling ingeschreven student op wie op enig moment in het
      studiejaar [artikel 10.6 van de Wet studiefinanciering 2000][ref1] van toepassing is, de studievoortgang vast,
      bedoeld in het tweede of derde lid van dat artikel. Het deelt deze voortgang aan de student mee voor 1 november,
      volgend op het desbetreffende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
  - number: 7.9a.2
    text: |-
      Het instellingsbestuur deelt aan de Informatie Beheer Groep mee welke van de
      in het eerste lid bedoelde studenten de norm van de studievoortgang, bedoeld in
      [artikel 10.6, tweede of derde lid, van de Wet studiefinanciering 2000][ref1], met inachtneming van
      [artikel 10.6 van die wet][ref2], niet hebben behaald. Die mededeling geschiedt voor 1 november, volgend op het
      desbetreffende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '10'
  - number: 7.9a.3
    text: |-
      Gelijktijdig met de mededeling, bedoeld in het tweede lid, informeert het instellingsbestuur de betrokken
      student over de gegevens die aan de Informatie Beheer Groep zijn verstrekt. Daarbij geeft zij tevens aan wat
      de consequenties volgens de [Wet studiefinanciering 2000][ref1] zijn, alsmede welke beroepsgang voor de student
      openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9a
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7.9c
    text: |-
      Indien het instellingsbestuur niet kan vaststellen welke studenten onder
      artikel [10.6 van de Wet studiefinanciering 2000][ref1] vallen, verstrekt het tevens de gegevens, bedoeld in
      [de artikelen 7.9a, eerste lid][ref2], over alle studenten. In dat geval vermeldt het dit feit in de mededeling,
      bedoeld in [de artikelen 7.9a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9c
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.9d
    text: |-
      Het instellingsbestuur doet voor het einde van de tweede maand volgend op de maand waarin een student, bedoeld
      in [artikel 5.7 van de Wet studiefinanciering 2000][ref1], het afsluitend examen met goed gevolg heeft afgelegd,
      daarvan mededeling aan de Informatie Beheer Groep. Het stuurt gelijktijdig met die mededeling bericht van het
      verzenden daarvan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9d
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 7.9e
    text: |-
      Het instellingsbestuur van een op grond van [artikel 6.9][ref1] aangewezen instelling doet voor het einde van de
      tweede maand, volgend op de maand waarin een student op grond van [artikel 7.31a][ref2] vrijstelling heeft gekregen
      van het afleggen van tentamens, daarvan mededeling aan de Informatie Beheer Groep. Het stuurt gelijktijdig met die
      mededeling bericht van het verzenden daarvan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.9e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.10.1
    text: |-
      Elk tentamen omvat een onderzoek naar de kennis, het inzicht en de vaardigheden van de examinandus, alsmede de
      beoordeling van de uitkomsten van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10
  - number: 7.10.2
    text: |-
      Indien de tentamens van de tot een opleiding of propedeutische fase van een bacheloropleiding behorende
      onderwijseenheden met goed gevolg zijn afgelegd, is het examen afgelegd, voorzover de examencommissie niet heeft
      bepaald dat het examen tevens omvat een door haar zelf te verrichten onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10
  - number: 7.10.3
    text: |-
      De examencommissie kan, in afwijking van het tweede lid en onder door haar te stellen voorwaarden, bepalen dat niet
      ieder tentamen van een examen met goed gevolg behoeft te worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10
  - number: 7.10a.1
    text: |-
      Het instellingsbestuur verleent de graad Bachelor en de graad Master aan degene die met goed gevolg het afsluitend
      examen van een bacheloropleiding in het wetenschappelijk onderwijs onderscheidenlijk het afsluitend examen van
      een masteropleiding in het wetenschappelijk onderwijs heeft afgelegd. Afhankelijk van het vakgebied waarin het met
      goed gevolg afgelegde afsluitend examen van een bacheloropleiding onderscheidenlijk het met goed gevolg afgelegde
      examen van een masteropleiding is afgelegd, wordt aan de verleende graad toegevoegd «of Arts» dan wel «of Science».
      Bij ministeriële regeling kan voor een opleiding of een groep van opleidingen met betrekking tot een in dit lid
      bedoelde graad een andere toevoeging dan die, bedoeld in de tweede volzin, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10a
  - number: 7.10a.2
    text: |-
      Het instellingsbestuur verleent de graad Bachelor en de graad Master aan degene die met goed gevolg het afsluitend
      examen van een bacheloropleiding in het hoger beroepsonderwijs onderscheidenlijk het afsluitend examen van een
      masteropleiding in het hoger beroepsonderwijs heeft afgelegd. Het instellingsbestuur kan voor een opleiding of een
      groep van opleidingen met betrekking tot een in dit lid bedoelde graad een andere toevoeging dan die, bedoeld in
      het eerste lid, tweede volzin, vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10a
  - number: 7.10a.3
    text: |-
      Het bestuur van de rechtspersoon, bedoeld in [artikel 5a.1, tweede lid][ref1], verleent de graad
      Master aan degene die met goed gevolg het afsluitend examen van een masteropleiding als bedoeld in
      [artikel 7.3b, onder a of b][ref2], heeft afgelegd. De tweede volzin van het tweede lid is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.10a.4
    text: |-
      Het instellingsbestuur of het bestuur van de rechtspersoon, bedoeld in het derde lid, voegt aan een graad toe de
      vermelding van het vakgebied of het beroepenveld waarop de graad betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.10a
  - number: 7.11.1
    text: |-
      Ten bewijze dat een tentamen met goed gevolg is afgelegd, wordt door de desbetreffende examinator of examinatoren
      een daarop betrekking hebbend bewijsstuk uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.2
    text: |-
      Ten bewijze dat het examen met goed gevolg is afgelegd, wordt door de examencommissie een getuigschrift uitgereikt.
      Op het getuigschrift van het met goed gevolg afgelegde examen wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.2.a
    text: |-
      welke opleiding zoals vermeld in het register, bedoeld in [artikel 6.13][ref1], het betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.11.2.b
    text: welke onderdelen het examen omvatte,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.2.c
    text: |-
      in voorkomende gevallen welke bevoegdheid daaraan is verbonden, rekening houdend met
      [artikel 7.6, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.11.2.d
    text: |-
      welke graad als bedoeld in [artikel 7.10a][ref1], eerste of tweede lid, is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.11.2.e
    text: |-
      op welk tijdstip de opleiding voor het laatst is geaccrediteerd dan wel op welk tijdstip de opleiding de toets
      nieuwe opleiding, bedoeld in [artikel 5a.11, tweede lid][ref1], met goed gevolg heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 7.11.3
    text: |-
      De examencommissie voegt aan een getuigschrift van het met goed gevolg afgelegde afsluitend examen, een supplement
      toe. Het supplement heeft tot doel inzicht te verschaffen in de aard en inhoud van de afgeronde opleiding, mede met
      het oog op internationale herkenbaarheid van opleidingen. Het supplement bevat in elk geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.3.a
    text: de naam van de opleiding en de instelling die de opleiding verzorgt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.3.b
    text: of het een opleiding in het wetenschappelijk onderwijs dan wel een opleiding in het hoger beroepsonderwijs betreft,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.3.c
    text: een beschrijving van de inhoud van de opleiding, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.3.d
    text: de studielast van de opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.11.4
    text: |-
      Degene die meer dan een tentamen met goed gevolg heeft afgelegd en aan wie geen getuigschrift als bedoeld in het
      tweede lid kan worden uitgereikt, ontvangt desgevraagd een door de desbetreffende examencommissie af te geven
      verklaring waarin in elk geval de tentamens zijn vermeld die door hem met goed gevolg zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.11
  - number: 7.12.1
    text: |-
      Ten behoeve van het afnemen van examens en ten behoeve van de organisatie en de coördinatie van de tentamens
      stelt het instellingsbestuur voor elke door de instelling aangeboden opleiding of voor groepen van opleidingen een
      examencommissie in. Ten aanzien van het door de student samengestelde programma is de examencommissie bevoegd die
      de in [artikel 7.3c, eerste lid][ref1], bedoelde toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12.2
    text: |-
      Het instellingsbestuur benoemt de leden van de examencommissie uit de leden van het personeel die met het verzorgen
      van het onderwijs in die opleiding of opleidingen zijn belast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.12
  - number: 7.12.3
    text: |-
      Ten behoeve van het afnemen van de tentamens wijst de examencommissie examinatoren aan. Als examinator kunnen
      slechts worden aangewezen leden van het personeel die met het verzorgen van het onderwijs in de desbetreffende
      onderwijseenheid zijn belast alsmede deskundigen van buiten de instelling. De examinatoren verstrekken de
      examencommissie de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.12
  - number: 7.12.4
    text: |-
      De examencommissie stelt regels vast met betrekking tot de goede gang van zaken tijdens de tentamens en met
      betrekking tot de in dat verband te nemen maatregelen. Die maatregelen kunnen inhouden dat in het geval van
      fraude door een student door de examencommissie, gedurende een door de examencommissie te bepalen termijn van ten
      hoogste één jaar, aan die student het recht wordt ontnomen een of meer daarbij aan te wijzen tentamens of examens
      aan de instelling af te leggen. De examencommissie kan aan de examinatoren richtlijnen en aanwijzingen geven met
      betrekking tot de beoordeling van degene die het tentamen aflegt en met betrekking tot de vaststelling van de
      uitslag van het tentamen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.12
  - number: 7.13.1
    text: |-
      Het instellingsbestuur stelt voor elke door de instelling aangeboden opleiding of groep van opleidingen een
      onderwijs- en examenregeling vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2
    text: |-
      In de onderwijs- en examenregeling worden, onverminderd het overigens in deze wet terzake bepaalde, ten minste
      geregeld:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.a
    text: de inhoud van de opleiding en van de daaraan verbonden examens,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.b
    text: de inhoud van de afstudeerrichtingen binnen een opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.c
    text: |-
      de kwaliteiten op het gebied van kennis, inzicht en vaardigheden die een student zich bij beëindiging van de
      opleiding moet hebben verworven,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.d
    text: waar nodig, de inrichting van praktische oefeningen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.e
    text: de studielast van de opleiding en van elk van de daarvan deel uitmakende onderwijseenheden,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.f
    text: |-
      de nadere regels, bedoeld in [de artikelen 7.8b, zesde lid][ref1], en [7.9, vijfde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.2.g
    text: |-
      ten aanzien van welke masteropleidingen toepassing is gegeven aan [artikel 7.4a, achtste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.2.h
    text: het aantal en de volgtijdelijkheid van de tentamens alsmede de momenten waarop deze afgelegd kunnen worden,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.i
    text: de voltijdse, deeltijdse of duale inrichting van de opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.j
    text: |-
      waar nodig, de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat de gelegenheid
      wordt geboden tot het afleggen van de tentamens en examens,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.k
    text: |-
      waar nodig, de geldigheidsduur van met goed gevolg afgelegde tentamens, behoudens de bevoegdheid van de
      examencommissie die geldigheidsduur te verlengen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.l
    text: |-
      of de tentamens mondeling, schriftelijk of op een andere wijze worden afgelegd, behoudens de bevoegdheid van de
      examencommissie in bijzondere gevallen anders te bepalen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.m
    text: |-
      de wijze waarop lichamelijk of zintuiglijk gehandicapte studenten redelijkerwijs in de gelegenheid worden gesteld
      de tentamens af te leggen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.n
    text: |-
      de openbaarheid van mondeling af te nemen tentamens, behoudens de bevoegdheid van de examencommissie in bijzondere
      gevallen anders te bepalen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.o
    text: |-
      de termijn waarbinnen de uitslag van een tentamen bekend wordt gemaakt alsmede of en op welke wijze van deze
      termijn kan worden afgeweken,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.p
    text: |-
      de wijze waarop en de termijn gedurende welke degene die een schriftelijk tentamen heeft afgelegd, inzage verkrijgt
      in zijn beoordeelde werk,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.q
    text: |-
      de wijze waarop en de termijn gedurende welke kennis genomen kan worden van vragen en opdrachten, gesteld of
      gegeven in het kader van een schriftelijk afgenomen tentamen en van de normen aan de hand waarvan de beoordeling
      heeft plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.r
    text: |-
      de gronden waarop de examencommissie voor eerder met goed gevolg afgelegde tentamens of examens in het hoger
      onderwijs, dan wel voor buiten het hoger onderwijs opgedane kennis of vaardigheden, vrijstelling kan verlenen van
      het afleggen van een of meer tentamens,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.s
    text: |-
      waar nodig, dat het met goed gevolg afgelegd hebben van tentamens voorwaarde is voor de toelating tot het afleggen
      van andere tentamens,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.t
    text: |-
      waar nodig, de verplichting tot het deelnemen aan praktische oefeningen met het oog op de toelating tot het
      afleggen van het desbetreffende tentamen, behoudens de bevoegdheid van de examencommissie vrijstelling van die
      verplichting te verlenen, al dan niet onder oplegging van vervangende eisen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.u
    text: de bewaking van studievoortgang en de individuele studiebegeleiding, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: 7.13.2.v
    text: |-
      de wijze van beoordeling door het instellingsbestuur van gevallen als bedoeld in [artikel 7.31a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.13.3
    text: |-
      In de onderwijs- en examenregeling wordt met het oog op de doorstroming van personen aan wie een graad als bedoeld
      in [artikel 7.10a, eerste lid][ref1], is verleend, voor elke bacheloropleiding in het wetenschappelijk onderwijs
      of in een voorkomend geval voor een afstudeerrichting binnen een bacheloropleiding ten minste een masteropleiding
      aangewezen die aansluit op die bacheloropleiding of die afstudeerrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.4
    text: |-
      De in het derde lid bedoelde masteropleiding wordt aan de desbetreffende universiteit aangeboden, tenzij
      er uitzonderlijke redenen zijn waardoor dit niet mogelijk is. In dat geval kan het instellingsbestuur van
      deze universiteit met een andere universiteit overeenkomen dat de betreffende masteropleiding aan die andere
      universiteit wordt aangeboden. De desbetreffende overeenkomst regelt de wijze waarop de doorstroming van
      personen, bedoeld in het derde lid, wordt gewaarborgd. De overeenkomst behoeft de voorafgaande instemming van de
      medezeggenschapsorganen van de betrokken universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.13
  - number: '7.14'
    text: |-
      Het instellingsbestuur draagt zorg voor een regelmatige beoordeling van de onderwijs- en examenregeling en weegt
      daarbij, ten behoeve van de bewaking en zo nodig bijstelling van de studielast, het tijdsbeslag dat daaruit voor de
      studenten voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.14
  - number: '7.15'
    text: |-
      Het instellingsbestuur draagt er zorg voor dat het onderwijsaanbod en andere relevante informatie tijdig openbaar
      worden gemaakt, zodanig dat de aanstaande student zich een goed oordeel kan vormen over de inhoud en de inrichting
      van het onderwijs en de examens.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.15
  - number: 7.17.1
    text: |-
      Onverminderd het tweede lid wordt een opleiding verzorgd in de gemeente waar die opleiding blijkens het Centraal
      register opleidingen hoger onderwijs, bedoeld in [artikel 6.13][ref1], is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.17.2
    text: |-
      Het instellingsbestuur kan besluiten een opleiding of een gedeelte daarvan in een of meer andere gemeenten te
      vestigen. Hij legt het voornemen daartoe ter instemming voor aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17
  - number: 7.17.3
    text: |-
      Onze minister wordt geacht met het voornemen, bedoeld in het tweede lid, in te stemmen, indien hij niet binnen vier
      maanden na ontvangst daarvan heeft verklaard dat aan het voornemen geen uitvoering kan worden gegeven in verband
      met een ondoelmatige spreiding van voorzieningen in het hoger onderwijs die als gevolg daarvan zou ontstaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17
  - number: 7.17.4
    text: |-
      Voorafgaand aan het nemen van een besluit als bedoeld in het tweede lid overlegt het instellingsbestuur met de
      daarvoor in aanmerking komende instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17
  - number: 7.17.5
    text: |-
      De instemming, bedoeld in het derde lid, vervalt, indien het instellingsbestuur van een bekostigde instelling de
      opleiding niet binnen zes maanden heeft laten registreren in het Centraal register opleidingen hoger onderwijs,
      bedoeld in [artikel 6.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.17a.1
    text: |-
      Onze minister kan besluiten dat een opleiding die in twee of meer gemeenten is gevestigd, niet langer in een bij
      zijn besluit genoemde gemeente is gevestigd, indien de verzorging van de opleiding in die gemeente, gelet op het
      geheel van de voorzieningen op het gebied van het hoger onderwijs, in redelijkheid niet of niet meer doelmatig kan
      worden geacht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17a
  - number: 7.17a.2
    text: |-
      Bij zijn besluit bepaalt Onze minister tevens het tijdstip met ingang waarvan de opleiding niet langer in de in het
      eerste lid bedoelde gemeente is gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.17a
  - number: 7.18.1
    text: |-
      Het college voor promoties van een universiteit of van de Open Universiteit is bevoegd de graad Doctor te verlenen
      op grond van de promotie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
  - number: 7.18.2
    text: 'Tot de promotie heeft toegang ieder die:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
  - number: 7.18.2.a
    text: |-
      aan wie op grond van [artikel 7.10a, eerste, tweede of derde lid][ref1], de graad Master is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.18.2.b
    text: |-
      als proeve van bekwaamheid tot het zelfstandig beoefenen van de wetenschap een proefschrift heeft geschreven dan
      wel een proefontwerp heeft vervaardigd, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
  - number: 7.18.2.c
    text: |-
      heeft voldaan aan de eisen, gesteld in het in [artikel 7.19][ref1] bedoelde promotiereglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.3
    text: |-
      In bijzondere gevallen kan het college voor promoties personen die voldoen aan het tweede lid onder *b* en *c* maar
      niet voldoen aan dat lid onder *a*, tot de promotie toegang verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
  - number: 7.18.4
    text: |-
      Voor elke promotie wijst het college voor promoties een hoogleraar van een universiteit aan als promotor. De
      promotie vindt plaats ten overstaan van dit college of van een commissie, door het college samen te stellen
      uit hoogleraren en andere personen ten aanzien van wie het heeft geoordeeld dat zij over voldoende bekwaamheid
      beschikken om in de commissie zitting te hebben, met inachtneming van het in [artikel 7.19][ref1] bedoelde
      promotiereglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.5
    text: |-
      Voor de toepassing van het vierde lid worden de kerkelijke hoogleraren aan een openbare universiteit en de
      bijzondere hoogleraren bij een openbare universiteit gerekend tot de hoogleraren van die universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.18
  - number: 7.19.1
    text: |-
      Met inachtneming van het daaromtrent bij deze wet bepaalde stelt het college voor promoties het promotiereglement
      vast. In dat reglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19
  - number: 7.19.1.a
    text: |-
      de gang van zaken met betrekking tot de voorbereiding van de promotie en met betrekking tot de promotie zelf,
      daaronder begrepen de taak en bevoegdheden van ieder die bij de promotie is of kan worden betrokken, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19
  - number: 7.19.1.b
    text: |-
      de voorzieningen betreffende de beslechting van geschillen die zich met betrekking tot de voorbereiding van de
      promotie en de promotie zelf kunnen voordoen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19
  - number: 7.19.2
    text: |-
      Het college voor promoties is bevoegd om, op voordracht van het instellingsbestuur, wegens zeer uitstekende
      verdiensten aan natuurlijke personen de graad Doctor honoris causa te verlenen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19
  - number: 7.19a.1
    text: |-
      Degene aan wie op grond van [artikel 7.10a][ref1] een graad is verleend, is gerechtigd die graad in de
      eigen naamsvermelding tot uitdrukking te brengen, desgewenst aangevuld met de vermelding, bedoeld in
      [artikel 7.10a, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.19a.2
    text: |-
      De graad, bedoeld in het eerste lid, en de toevoegingen, bedoeld in [artikel 7.10a, eerste lid][ref1], worden als
      volgt aangeduid:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.19a.2.a
    text: 'Bachelor: B,'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.b
    text: 'Master: M,'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.c
    text: 'Bachelor met de toevoeging «of Arts»: BA,'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.d
    text: 'Bachelor met de toevoeging «of Science»: BSc,'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.e
    text: |-
      Bachelor met een andere toevoeging als bedoeld in [artikel 7.10a, eerste lid, derde volzin][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.19a.2.f
    text: 'Master met de toevoeging «of Arts»: MA,'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.g
    text: 'Master met de toevoeging «of Science»: MSc, en'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.2.h
    text: Master met een andere toevoeging als bedoeld in onderdeel e.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
  - number: 7.19a.3
    text: |-
      Indien [artikel 7.10a, eerste lid, derde volzin][ref1], toepassing heeft gevonden, worden de afkorting van de
      desbetreffende graden met toevoegingen bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.19a.4
    text: |-
      De graad en de toevoeging worden, afgekort, in de naamsvermelding achter de naam geplaatst, desgewenst aangevuld
      met de vermelding, bedoeld in [artikel 7.10a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.19a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.20.1
    text: |-
      Degene die op grond van [artikel 7.19a][ref1] gerechtigd is een graad in het wetenschappelijk onderwijs in de eigen
      naamsvermelding tot uitdrukking te brengen, is tevens gerechtigd tot het voeren van:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.20.1.a
    text: |-
      de titel ingenieur, afgekort tot ir., indien het een masteropleiding in het wetenschappelijk onderwijs betreft op
      het gebied van de landbouw en natuurlijke omgeving of op het gebied van de techniek,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.1.b
    text: |-
      de titel meester, afgekort tot mr., indien het een masteropleiding in het wetenschappelijk onderwijs betreft op het
      gebied van het recht, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.1.c
    text: |-
      de titel doctorandus, afgekort tot drs., indien het een masteropleiding in het wetenschappelijk onderwijs betreft
      waarop de onderdelen a en b niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.2
    text: |-
      Degene die op grond van [artikel 7.19a][ref1] gerechtigd is een graad in het hoger beroepsonderwijs in de eigen
      naamsvermelding tot uitdrukking te brengen, is tevens gerechtigd tot het voeren van:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.20.2.a
    text: |-
      de titel ingenieur, afgekort tot ing., indien het een bacheloropleiding in het hoger beroepsonderwijs betreft op
      het gebied van de landbouw en natuurlijke omgeving of op het gebied van de techniek, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.2.b
    text: |-
      de titel baccalaureus, afgekort tot bc., indien het een bacheloropleiding in het hoger beroepsonderwijs betreft
      waarop onderdeel a niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.3
    text: De in het eerste en tweede lid genoemde titels worden, afgekort, voor de naam geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.4
    text: Het eerste lid is niet van toepassing op masteropleidingen, bedoeld in artikel 7.3b.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
  - number: 7.20.5
    text: |-
      De betrokkene maakt een keuze uit het tot uitdrukking brengen in de eigen naamsvermelding van een graad als bedoeld
      in [artikel 7.10a][ref1] en het voeren van een titel als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.22.1
    text: |-
      Degene aan wie op grond van de promotie, bedoeld in [artikel 7.18][ref1], dan wel ingevolge
      [artikel 7.19, tweede lid][ref2], de graad Doctor is verleend, is gerechtigd die graad in de eigen naamsvermelding
      tot uitdrukking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.22.2
    text: |-
      Degene die op grond van het eerste lid gerechtigd is de in dat lid bedoelde graad in de eigen naamsvermelding tot
      uitdrukking te brengen, is tevens gerechtigd de titel doctor te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22
  - number: 7.22.3
    text: |-
      De in het eerste lid bedoelde graad wordt, aangeduid als D, in de naamsvermelding achter de naam geplaatst. De in
      het tweede lid bedoelde titel wordt, afgekort tot dr., voor de naam geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22
  - number: 7.22.4
    text: |-
      De betrokkene maakt een keuze uit het tot uitdrukking brengen in de eigen naamsvermelding van de graad, bedoeld in
      het eerste lid, en het voeren van de titel, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22
  - number: 7.22a.1
    text: |-
      Degenen die op grond van de [artikelen 7.20][ref1] en [7.22][ref2], zoals die bepalingen op 31 augustus 2002
      luidden, gerechtigd waren tot het voeren van een in de desbetreffende bepalingen genoemde titel, blijven gerechtigd
      die titel te voeren overeenkomstig die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.22a.2
    text: |-
      Degenen die op grond van [artikel 7.21][ref1], zoals die bepaling op 31 augustus 2002 luidde, gerechtigd waren
      tot het voeren van de titel Master of de titel Bachelor, blijven gerechtigd die titel te voeren overeenkomstig
      dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.22a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.1
    text: |-
      Degene aan wie op grond van een examen aan een niet in Nederland gevestigde instelling voor hoger onderwijs
      een graad is verleend en die gerechtigd is die graad in het desbetreffende land in de eigen naamsvermelding tot
      uitdrukking te brengen, is eveneens gerechtigd die graad in Nederland in de eigen naamsvermelding tot uitdrukking
      te brengen op dezelfde wijze als in het desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23
  - number: 7.23.2
    text: |-
      Degene aan wie op grond van een bij ministeriële regeling aangewezen examen aan een niet in Nederland gevestigde
      instelling voor hoger onderwijs een graad is verleend en die gerechtigd is die graad in het desbetreffende land in
      de eigen naamsvermelding tot uitdrukking te brengen, is tevens gerechtigd in plaats daarvan in Nederland een van
      de titels, genoemd in [artikel 7.20][ref1], te voeren. In de in de eerste volzin bedoelde regeling wordt tevens
      bepaald in welke gevallen welke graad in de eigen naamsvermelding tot uitdrukking kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.3
    text: |-
      De Informatie Beheer Groep kan aan degene aan wie op grond van een examen aan een niet in Nederland gevestigde
      instelling voor hoger onderwijs een graad is verleend, die niet in de in het tweede lid bedoelde ministeriële
      regeling is opgenomen, toestaan in de plaats van die graad in de eigen naamsvermelding tot uitdrukking te brengen
      in Nederland een van de titels, genoemd in [artikel 7.20][ref1], te voeren, indien de opleiding op grond waarvan
      die andere graad is verleend, naar het oordeel van de Informatie Beheer Groep ten minste gelijkwaardig is aan een
      overeenkomstige Nederlandse opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.4
    text: |-
      Degene aan wie door een niet in Nederland gevestigde instelling voor hoger onderwijs een graad als bedoeld in
      [artikel 7.22][ref1] is verleend en die gerechtigd is op grond daarvan een graad in het desbetreffende land in
      de eigen naamsvermelding tot uitdrukking te brengen, is eveneens gerechtigd die graad in Nederland in de eigen
      naamsvermelding tot uitdrukking te brengen op dezelfde wijze als in het desbetreffende land. Het derde lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.23.5
    text: |-
      Voor de toepassing van dit artikel wordt onder «het verlenen van een graad» mede begrepen het verkrijgen van een
      titel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23
  - number: 7.23a
    text: In deze paragraaf wordt onder «opleiding» verstaan een bacheloropleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.23a
  - number: 7.24.1
    text: |-
      Onverminderd het derde lid geldt voor de inschrijving voor een opleiding in het wetenschappelijk onderwijs als
      vooropleidingseis het bezit van het diploma voorbereidend wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.24
  - number: 7.24.2
    text: |-
      Onverminderd het derde lid geldt voor de inschrijving voor een opleiding in het hoger beroepsonderwijs
      als vooropleidingseis het bezit van een diploma voorbereidend wetenschappelijk onderwijs of hoger algemeen
      voortgezet onderwijs of een diploma van een middenkaderopleiding of van een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref1]. Met een diploma als bedoeld in de eerste
      volzin wordt voor de toepassing van dit lid gelijkgesteld het diploma van de bij ministeriële regeling aangewezen
      vakopleidingen, bedoeld in [artikel 7.2.2, eerste lid, onder c, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.24.3
    text: |-
      Voor de inschrijving voor een opleiding of voor een onderwijseenheid behorend tot een opleiding, aan de Open
      Universiteit gelden geen vooropleidingseisen. Deze inschrijving voor een opleiding of voor een onderwijseenheid
      behorend tot een opleiding, staat open voor ieder die de leeftijd van achttien jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.24
  - number: 7.25.1
    text: |-
      Bij ministeriële regeling worden het profiel of de profielen, bedoeld in
      [artikel 12 van de Wet op het voortgezet onderwijs][ref1], aangewezen waarop het diploma voorbereidend
      wetenschappelijk onderwijs en het diploma hoger algemeen voortgezet onderwijs betrekking moeten hebben om te kunnen
      worden ingeschreven voor een bepaalde opleiding of groep van opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '12'
  - number: 7.25.2
    text: |-
      Bij ministeriële regeling kunnen tevens worden aangewezen, vakken en andere programmaonderdelen die deel moeten
      hebben uitgemaakt van het examen ter verkrijging van een in het eerste lid bedoeld diploma om te kunnen worden
      ingeschreven voor een bepaalde opleiding of groep van opleidingen, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
  - number: 7.25.2.a
    text: |-
      een diploma dat betrekking heeft op een profiel waarvan het profieldeel niet voor alle kandidaten dezelfde vakken
      en andere programmaonderdelen omvat;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
  - number: 7.25.2.b
    text: een diploma dat betrekking heeft op een ander profiel dan een krachtens het eerste lid aangewezen profiel;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
  - number: 7.25.2.c
    text: in bijzondere gevallen, een opleiding waarop geen enkel profiel zonder meer een goede voorbereiding geeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
  - number: 7.25.3
    text: |-
      Bij de ministeriële regeling kunnen vakken en andere programmaonderdelen worden
      aangewezen die deel moeten hebben uitgemaakt van het examen ter verkrijging van het
      diploma van een middenkaderopleiding of een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d onderscheidenlijk e, van de Wet educatie en beroepsonderwijs][ref1] dan wel een
      bij de ministeriële regeling, bedoeld in [artikel 7.24, tweede lid][ref2], aangewezen vakopleiding, om te kunnen
      worden ingeschreven voor een opleiding of groep van opleidingen aan een hogeschool.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.25.4
    text: |-
      Het instellingsbestuur kan bepalen dat de bezitter van een diploma, genoemd in het eerste of derde lid, die
      niet voldoet aan de in het eerste, tweede of derde lid bedoelde voorwaarden, toch wordt ingeschreven, onder de
      voorwaarde dat blijkens een onderzoek wordt voldaan aan inhoudelijk daarmee vergelijkbare eisen. Aan deze eisen
      moet zijn voldaan voor de aanvang van de opleiding, met dien verstande dat bij ministeriële regeling opleidingen
      kunnen worden aangewezen voor welke, in door het instellingsbestuur te bepalen gevallen en onder door het
      instellingsbestuur vast te stellen voorwaarden, aan de eisen kan worden voldaan uiterlijk bij afronding van de
      propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in die opleiding met een studielast
      van 60 studiepunten. De eisen worden opgenomen in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.25
  - number: 7.26.1
    text: |-
      Indien de uitoefening van het beroep of de beroepen waarop een opleiding voorbereidt, dan wel de organisatie
      en de inrichting van het onderwijs, specifieke eisen stelt ten aanzien van kennis of vaardigheden die niet of
      niet in voldoende mate onderdeel zijn van het voortgezet onderwijs of van het beroepsonderwijs, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1]” onderscheidenlijk specifieke eisen stelt ten aanzien van de eigenschappen
      van de student, kunnen bij ministeriële regeling in verband daarmee eisen worden gesteld in aanvulling op de
      eisen, bedoeld in [artikel 7.24][ref2]. Dit lid is niet van toepassing op opleidingen op het gebied van de kunst en
      lerarenopleidingen op het gebied van de kunst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.26.2
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld ten aanzien van welke opleidingen het eerste lid toepassing
      kan vinden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26
  - number: 7.26.3
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Zij treedt in werking op een tijdstip dat nadat 30 dagen na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers de wens te kennen
      wordt gegeven dat het in de algemene maatregel van bestuur geregelde onderwerp bij wet wordt geregeld. In dat
      geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en wordt de algemene maatregel van
      bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26
  - number: 7.26a.1
    text: |-
      Bij ministeriële regeling worden voor de opleidingen op het gebied van de kunst en voor de lerarenopleidingen
      op het gebied van de kunst in verband met de organisatie en inrichting van het onderwijs dan wel de kennis of
      vaardigheden van de aanstaande studenten en extraneï specifieke eisen gesteld in aanvulling op de eisen, bedoeld
      in [artikel 7.24][ref1]. Voor de inschrijving voor deze opleidingen geldt als eis het bezit van een bewijs van
      toelating als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.26a.2
    text: |-
      Met betrekking tot de opleidingen waarop het eerste lid van toepassing is, stelt het instellingsbestuur ter
      uitwerking van de in het eerste lid bedoelde specifieke eisen voor een opleiding criteria vast betreffende selectie
      en toelating van studenten en extraneï.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26a
  - number: 7.26a.3
    text: |-
      Voor elke opleiding stelt het instellingsbestuur een commissie in, die is belast met het onderzoek of aanstaande
      studenten of extraneï voldoen aan de in het eerste lid bedoelde eisen en de in het tweede lid bedoelde criteria. De
      commissie brengt het instellingsbestuur een gemotiveerd advies uit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26a
  - number: 7.26a.4
    text: |-
      Het instellingsbestuur neemt ten aanzien van elke aanstaande student of extraneus een beslissing of deze voldoet
      aan de in het eerste lid bedoelde eisen en de in het tweede lid bedoelde criteria. Het instellingsbestuur bericht
      de student of extraneus over de uitslag van het desbetreffende onderzoek en reikt hem, indien het resultaat van het
      onderzoek daartoe aanleiding geeft, ten bewijze daarvan een bewijs van toelating uit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.26a
  - number: '7.27'
    text: |-
      Het instellingsbestuur kan met het oog op de inschrijving voor een deeltijdse opleiding aan een universiteit of aan
      een hogeschool eisen omtrent het verrichten van werkzaamheden tijdens het volgen van de opleiding stellen indien de
      desbetreffende werkzaamheden in de onderwijs- en examenregeling als onderwijseenheden zijn aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.27
  - number: 7.28.1
    text: |-
      Degene aan wie een graad als bedoeld in [artikel 7.10a][ref1] is verleend, en de bezitter van een met goed
      gevolg afgelegd propedeutisch examen aan een instelling voor hoger onderwijs zijn vrijgesteld van de in
      [artikel 7.24][ref2], eerste onderscheidenlijk tweede lid, bedoelde vooropleidingseisen, onverminderd het derde en
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.2
    text: |-
      Het instellingsbestuur verleent vrijstelling van de in [artikel 7.24, eerste onderscheidenlijk tweede lid][ref1],
      bedoelde vooropleidingseis aan de bezitter van een al dan niet in Nederland afgegeven diploma dat bij
      ministeriële regeling is aangemerkt als tenminste gelijkwaardig aan het in het desbetreffende lid bedoelde
      diploma, onverminderd het derde en vierde lid. Het instellingsbestuur kan vrijstelling verlenen van de in
      [artikel 7.24, eerste onderscheidenlijk tweede lid][ref2], bedoelde vooropleidingseisen aan de bezitter van een
      al dan niet in Nederland afgegeven diploma dat niet in de in de eerste volzin genoemde ministeriële regeling is
      opgenomen, indien dat diploma naar het oordeel van het instellingsbestuur tenminste gelijkwaardig is aan het in
      [artikel 7.24, eerste onderscheidenlijk tweede lid][ref3] bedoelde diploma, onverminderd het derde en vierde lid.
      Indien het een buiten Nederland afgegeven diploma betreft, kan het instellingsbestuur bepalen dat geen examens
      of onderdelen daarvan worden afgelegd dan nadat ten genoegen van de desbetreffende examencommissie het bewijs is
      geleverd van voldoende beheersing van de Nederlandse taal voor het met vrucht kunnen volgen van het onderwijs. Het
      instellingsbestuur kan tevens bepalen dat betrokkene niet wordt ingeschreven zolang het in de voorgaande volzin
      bedoelde bewijs niet is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.3
    text: |-
      Indien bij ministeriële regeling eisen als bedoeld in [artikel 7.25, eerste, tweede of derde lid][ref1], zijn
      vastgesteld kan de bezitter van een diploma als bedoeld in het eerste dan wel tweede lid geen examens afleggen
      voordat hij op een door het instellingsbestuur te bepalen wijze op grond van een aanvullend onderzoek heeft
      aangetoond te beschikken over de kennis en vaardigheden waarop de eisen, bedoeld in [artikel 7.25][ref2],
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.4
    text: |-
      Het instellingsbestuur kan bepalen dat de bezitter van een diploma als bedoeld in het eerste dan wel tweede lid
      niet kan worden ingeschreven indien dat bestuur van oordeel is dat de eisen, bedoeld in [artikel 7.25][ref1], van
      dien aard zijn dat redelijkerwijs verwacht kan worden dat niet tijdens het eerste jaar van inschrijving voor de
      opleiding op grond van een aanvullend onderzoek als bedoeld in het derde lid aangetoond kan worden dat betrokkene
      beschikt over de kennis en vaardigheden waarop die eisen betrekking hebben. Het instellingsbestuur bepaalt op welke
      wijze betrokkene op grond van een aanvullend onderzoek met het oog op de inschrijving vrijgesteld kan worden van
      die eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.28.5
    text: |-
      De bij het onderzoek, bedoeld in onderscheidenlijk de leden twee tot en met vier, te stellen eisen worden opgenomen
      in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.28
  - number: 7.29.1
    text: |-
      Het instellingsbestuur kan personen van eenentwintig jaar en ouder die niet voldoen aan de in
      [artikel 7.24, eerste onderscheidenlijk tweede lid][ref1], bedoelde vooropleidingseis noch daarvan krachtens
      [artikel 7.28][ref2] zijn vrijgesteld, van die vooropleidingseis vrijstellen, indien zij bij een onderzoek door een
      door het instellingsbestuur in te stellen commissie hebben blijk gegeven van geschiktheid voor het desbetreffende
      onderwijs en van voldoende beheersing van de Nederlandse taal voor het met vrucht kunnen volgen van dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.29.2
    text: De bij het onderzoek te stellen eisen worden opgenomen in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.29
  - number: 7.29.3
    text: |-
      Het instellingsbestuur kan ten aanzien van een bezitter van een buiten Nederland afgegeven diploma dat in het
      eigen land toegang geeft tot een opleiding aan een instelling voor hoger onderwijs, afwijken van de in het eerste
      lid genoemde leeftijdsgrens. Van die leeftijdsgrens kan het instellingsbestuur ook afwijken, indien in bijzondere
      gevallen geen diploma kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.29
  - number: 7.29.4
    text: |-
      Het instellingsbestuur kan ten aanzien van opleidingen op het gebied van de kunst in bijzondere gevallen afwijken
      van de in het eerste lid genoemde leeftijd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.29
  - number: 7.30.1
    text: |-
      Voor de inschrijving voor een opleiding na het propedeutisch examen geldt als eis het bezit van een getuigschrift
      van het met goed gevolg afgelegde propedeutisch examen van die opleiding of van het met goed gevolg afgelegde
      propedeutisch examen dat die opleiding en een of meer andere opleidingen gemeen hebben.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30
  - number: 7.30.2
    text: |-
      Het instellingsbestuur kan vrijstelling verlenen van de in het eerste lid bedoelde eis aan de bezitter van een
      al dan niet in Nederland afgegeven diploma, indien dat diploma naar het oordeel van het instellingsbestuur ten
      minste gelijkwaardig is aan het in het eerste lid bedoelde getuigschrift. Indien het een buiten Nederland afgegeven
      diploma betreft, kan het instellingsbestuur daarbij bepalen dat geen examens of onderdelen daarvan worden afgelegd
      dan nadat ten genoegen van de desbetreffende examencommissie het bewijs is geleverd van voldoende beheersing van de
      Nederlandse taal voor het met vrucht kunnen volgen van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30
  - number: 7.30.3
    text: |-
      Met inachtneming van het terzake bepaalde in de onderwijs- en examenregeling kan de examencommissie, in afwijking
      van het eerste lid, aan degene die is ingeschreven, op zijn verzoek, reeds de toegang tot het afleggen van een
      of meer onderdelen van het afsluitend examen verlenen voordat hij het propedeutisch examen van de desbetreffende
      opleiding met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30
  - number: 7.30a.1
    text: |-
      Voor de inschrijving voor een masteropleiding in het wetenschappelijk onderwijs die in relatie tot een
      bacheloropleiding is aangewezen op grond van [artikel 7.13, derde lid][ref1], geldt als toelatingseis dat
      aan betrokkene een graad als bedoeld in [artikel 7.10a][ref2], eerste lid, is verleend, van de desbetreffende
      bacheloropleiding in het wetenschappelijk onderwijs aan dezelfde instelling. Indien op grond van de in de
      eerste volzin genoemde bepaling een afstudeerrichting is aangewezen, geldt in afwijking van de eerste volzin
      als toelatingseis voor een in die volzin bedoelde masteropleiding dat aan betrokkene een graad als bedoeld in
      [artikel 7.10a, eerste lid][ref3], is verleend die betrekking heeft op die afstudeerrichting. In afwijking van
      de eerste volzin kan het instellingsbestuur besluiten dat degene die voor een bacheloropleiding als bedoeld in
      die volzin is ingeschreven, toch wordt ingeschreven voor een masteropleiding als bedoeld in die volzin onder de
      voorwaarde dat is voldaan aan bij de onderwijs- en examenregeling van de desbetreffende masteropleiding te stellen
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.30a.2
    text: |-
      Het eerste lid heeft ook betrekking op een masteropleiding als bedoeld in
      [artikel 7.13, vierde lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.30a.3
    text: |-
      Voor de inschrijving voor een opleiding als bedoeld in het eerste en tweede lid van personen aan wie geen graad
      als bedoeld in het eerste lid is verleend, geldt als toelatingseis het bezit van een bewijs van toelating voor die
      opleiding. Het instellingsbestuur verstrekt desgevraagd een bewijs van toelating, indien:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
  - number: 7.30a.3.a
    text: de betrokkene voldoet aan de door het instellingsbestuur voor de opleiding vast te stellen eisen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
  - number: 7.30a.3.b
    text: |-
      voorzover het instellingsbestuur het aantal ten hoogste voor de opleiding in te schrijven personen heeft
      vastgesteld, dat aantal niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
  - number: 7.30a.4
    text: |-
      [Artikel 7.27][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.30a.5
    text: |-
      Het bewijs van toelating, bedoeld in het derde lid, heeft betrekking op het studiejaar dat gelegen is na het
      studiejaar waarin de aanvraag voor dat bewijs is ingediend, tenzij het instellingsbestuur anders beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30a
  - number: 7.30b.1
    text: |-
      Voor de inschrijving voor een andere masteropleiding in het wetenschappelijk onderwijs dan
      die, bedoeld in [artikel 7.30a, eerste en tweede lid][ref1], of voor een masteropleiding in het
      hoger beroepsonderwijs geldt als toelatingseis het bezit van een bewijs van toelating voor die
      opleiding.[ Artikel 7.30a, derde lid, tweede volzin][ref2], is van toepassing. De door het instellingsbestuur vast
      te stellen eisen worden opgenomen in de onderwijs- en examenregeling. Deze eisen hebben uitsluitend betrekking op
      kennis, inzicht en vaardigheden die kunnen zijn verworven bij beëindiging van een bacheloropleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.30b.2
    text: |-
      [Artikel 7.30a, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.30c
    text: |-
      Indien de betrokkene niet voldoet aan de toelatingseisen, bedoeld in de [artikelen 7.30a](onbekend) en [7.30b]
      (onbekend), en van hem redelijkerwijs kan worden verwacht dat hij daaraan binnen een redelijke termijn alsnog
      kan voldoen, wordt hem de mogelijkheid geboden, de tekortkoming weg te nemen en alsnog aan de toelatingseisen te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.30c
  - number: 7.31.1
    text: |-
      Het instellingsbestuur maakt tijdig de procedure bekend, op grond waarvan de toewijzing van bewijzen van
      toelating zal plaatsvinden ingeval het aantal aanvragen voor een bewijs van toelating voor een masteropleiding het
      vastgestelde aantal personen, bedoeld in de [artikelen 7.30a, derde lid](onbekend), en [7.30b, eerste lid, tweede
      volzin](onbekend), zou overschrijden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31
  - number: 7.31.2
    text: Het instellingsbestuur stelt een toelatingsreglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31
  - number: 7.31a.1
    text: |-
      In het hoger beroepsonderwijs is vrijgesteld van het afleggen van tentamens, verbonden aan onderwijseenheden met
      een gezamenlijke studielast van 60 studiepunten, degene
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31a
  - number: 7.31a.1.a
    text: |-
      die in het bezit is van een diploma van een middenkaderopleiding, een specialistenopleiding of een vakopleiding
      als bedoeld in [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref1], voorzover aangewezen bij
      ministeriële regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.31a.1.b
    text: |-
      die is ingeschreven voor een bacheloropleiding in het hoger beroepsonderwijs, indien bij de in onderdeel a bedoelde
      ministeriële regeling is aangegeven dat die opleiding aansluit op een in onderdeel a bedoelde opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31a
  - number: 7.31a.2
    text: |-
      Het instellingsbestuur regelt voor elke opleiding, bedoeld in het eerste lid, onder a, de inhoud van
      de vrijstelling voor de daarop aansluitende bacheloropleiding of voor de groep van daarop aansluitende
      bacheloropleidingen in het hoger beroepsonderwijs. De regeling van deze vrijstelling wordt opgenomen in de
      onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31a
  - number: 7.31a.3
    text: |-
      In afwijking van het eerste lid kan het instellingsbestuur, indien naar zijn oordeel het niveau van betrokkene
      op grond van een aantoonbaar gebrek aan tijdens een opleiding als bedoeld in het eerste lid, onder a, aangeboden
      kennis of vaardigheden een vrijstelling van de in dat lid bedoelde omvang niet toelaat, een vrijstelling van
      een geringere omvang verlenen. In dat geval maakt het instellingsbestuur de omvang en de inhoud van de verleende
      vrijstelling aan de betrokkene bekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31a
  - number: 7.31b
    text: |-
      Met inachtneming van het terzake bepaalde in de onderwijs- en examenregeling heeft de student die met toepassing
      van [artikel 7.31a][ref1] is vrijgesteld van het afleggen van tot het propedeutisch examen behorende tentamens,
      in afwijking van [artikel 7.30, eerste lid][ref2], toegang tot het afleggen van een of meer onderdelen van het
      afsluitend examen, voordat hij het propedeutisch examen van de desbetreffende bacheloropleiding met goed gevolg
      heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.31b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.32.1
    text: |-
      Ieder die wenst gebruik te kunnen maken van onderwijsvoorzieningen, examenvoorzieningen of voorzieningen van andere
      aard ten behoeve van initieel onderwijs aan een instelling, dient zich door het instellingsbestuur als student of
      extraneus te laten inschrijven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.2
    text: |-
      In afwijking van het eerste lid is inschrijving voor een duale opleiding dan wel aan de Open Universiteit
      uitsluitend mogelijk als student.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.3
    text: |-
      De inschrijving geschiedt voor een opleiding, met dien verstande dat de inschrijving aan de Open Universiteit ook
      kan geschieden voor een of meer onderwijseenheden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.4
    text: |-
      De inschrijving voor een opleiding geschiedt voor het gehele studiejaar. Indien de inschrijving plaatsvindt in de
      loop van het studiejaar, geldt zij voor het resterende gedeelte van het studiejaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.5
    text: |-
      De inschrijving als student of extraneus staat slechts open voor degene waarvan de ouders, voogden of verzorgers
      aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.5.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.5.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding begint waarvoor voor de eerste maal
      inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.5.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding begint waarvoor voor
      de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.32.5.d
    text: |-
      vreemdeling is en buiten Nederland verblijf houdt op de eerste dag waarop de opleiding begint waarvoor voor de
      eerste maal de inschrijving wordt gewenst, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.5.e
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b, c of d, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding van een instelling, welke opleiding nog steeds wordt
      gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.32.6
    text: |-
      Indien na de inschrijving blijkt dat deze op welke grond dan ook niet in overeenstemming met het vijfde lid heeft
      plaatsgevonden wordt de inschrijving van de student of extraneus onmiddellijk beëindigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.32
  - number: 7.33.1
    text: De inschrijving geschiedt overeenkomstig door het instellingsbestuur vast te stellen regels van procedurele aard.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.33
  - number: 7.33.2
    text: |-
      Aan degene die is ingeschreven, wordt door het instellingsbestuur een bewijs van inschrijving verstrekt, waarin
      zijn rechten zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.33
  - number: 7.33.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.33
  - number: 7.34.1
    text: 'De inschrijving als student geeft het recht:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.1.a
    text: |-
      aan het initieel onderwijs van de instelling deel te nemen, behoudens de bevoegdheid van
      het instellingsbestuur van een universiteit of hogeschool in geval van toepassing van
      [de artikelen 7.9, eerste lid][ref1],[ 7.30a, derde lid][ref2], [7.30b, eerste lid][ref3], [7.53, derde lid][ref4],
      of [7.56][ref5] anders te beslissen,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.34.1.b
    text: |-
      de tentamens af te leggen van de onderwijseenheden behorend tot de opleiding, alsmede de examens af te leggen van
      die opleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.1.c
    text: |-
      van toegang tot de bij de instelling behorende inrichtingen en verzamelingen, tenzij naar het oordeel van het
      instellingsbestuur de aard of het belang van het onderwijs of het onderzoek zich daartegen verzet,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.1.d
    text: |-
      gebruik te maken van andere ten behoeve van de studenten getroffen voorzieningen, daaronder begrepen, behoudens wat
      de Open Universiteit betreft, de diensten van een studentendecaan, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.1.e
    text: |-
      op studiebegeleiding; het instellingsbestuur besteedt daarbij bijzondere zorg aan de begeleiding van studenten die
      behoren tot een etnische of culturele minderheid waarvan de deelname aan het hoger onderwijs in betekenende mate
      achterblijft bij de deelname van Nederlanders die niet behoren tot een dergelijke minderheid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.2
    text: |-
      Indien het instellingsbestuur een opleiding beëindigt, bepaalt dat bestuur het tijdstip waarop die beslissing van
      kracht wordt, zodanig dat de voor de opleiding ingeschreven studenten de opleiding aan dezelfde of aan een andere
      instelling binnen een redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.3
    text: |-
      De inschrijving aan de Open Universiteit geeft tevens het recht het benodigde cursusmateriaal te ontvangen en de
      daarbij behorende begeleiding te genieten. Het instellingsbestuur van de Open Universiteit stelt ten aanzien van
      studenten, woonachtig buiten Nederland, regels vast met betrekking tot de in de eerste volzin en de in het eerste
      lid onder *a* tot en met *d,* bedoelde rechten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
  - number: 7.34.4
    text: |-
      In afwijking van het eerste lid, onder b, heeft de student, bedoeld in
      [artikel 7.30a, eerste lid, derde volzin][ref1], niet het recht de examens van die opleiding af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '7.36'
    text: |-
      De inschrijving als extraneus geeft uitsluitend de rechten, vermeld in
      [artikel 7.34, eerste lid onder b en c][ref1]. [Artikel 7.34, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.36
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.37.1
    text: |-
      De inschrijving staat open voor degene die voldoet aan de in [titel 2][ref1] van dit hoofdstuk gestelde eisen,
      onverminderd [artikel 7.8b, vijfde lid][ref2], en met dien verstande dat de inschrijving als extraneus uitsluitend
      openstaat, indien naar het oordeel van het instellingsbestuur de aard of het belang van het onderwijs zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.37.2
    text: |-
      Tot de inschrijving wordt niet overgegaan dan nadat het bewijs is overgelegd dat het verschuldigde collegegeld
      wordt voldaan, het verschuldigde examengeld is voldaan dan wel, in geval van inschrijving aan de Open Universiteit,
      het verschuldigde cursusgeld is voldaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37.3
    text: |-
      Indien een meerderjarige student of extraneus het collegegeld, het examengeld of het cursusgeld niet zelf voldoet,
      wordt niet overgegaan tot inschrijving dan nadat door de student of extraneus schriftelijk is verklaard dat hij
      ermee instemt dat een in die verklaring vermelde derde namens hem het collegegeld, het examengeld of het cursusgeld
      voldoet.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37.4
    text: |-
      Tot de inschrijving als student voor de eerste maal voor een bepaalde propedeutische fase van een bacheloropleiding
      aan een bepaalde instelling of, indien die fase niet is ingesteld, de eerste periode in een bacheloropleiding met
      een studielast van 60 studiepunten wordt niet overgegaan dan nadat de betrokkene zich te voren, overeenkomstig bij
      ministeriële regeling vast te stellen regels van procedurele aard, bij de Informatie Beheer Groep heeft aangemeld,
      onder vermelding van de instelling en de bacheloropleiding waarop de inschrijving betrekking heeft. De Informatie
      Beheer Groep levert de aanmeldingsgegevens aan de instelling van eerste voorkeur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37.5
    text: |-
      Het bestuur van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven, geacht worden
      de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden geweigerd dan wel
      ingetrokken indien betrokkene de grondslag en de doelstellingen van de instelling niet respecteert. De weigering
      dan wel de intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37.6
    text: |-
      De inschrijving aan een bijzondere instelling kan worden geweigerd dan wel ingetrokken indien gegronde vrees
      bestaat dat de betrokkene van die inschrijving en daaraan verbonden rechten misbruik zal maken door in ernstige
      mate afbreuk te doen aan de eigen aard van die instelling, dan wel is gebleken dat de betrokkene van die
      inschrijving en daaraan verbonden rechten zulk een misbruik heeft gemaakt. De weigering dan wel intrekking van de
      inschrijving geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37.7
    text: |-
      De inschrijving kan niet worden ingetrokken op grond van het vijfde lid, indien voor betrokkene geen gelegenheid
      bestaat de opleiding aan een andere instelling te volgen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37
  - number: 7.37a
    text: |-
      In afwijking van [artikel 7.37, eerste lid][ref1], staat de inschrijving voor een opleiding die is aangewezen
      op grond van [artikel 6][ref2] of [artikel 8 van de Experimentenwet][ref3] vooropleidingseisen, selectie en
      collegegeldheffing, eveneens open voor degene die voldoet aan de in die artikelen bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018259#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0018259
        artikel: '8'
  - number: 7.37b
    text: |-
      In afwijking van [artikel 7.37, eerste lid][ref1], staat de inschrijving voor een opleiding die is aangewezen
      op grond van [artikel 7 van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref2], in
      voorkomende gevallen in verband met het deelnemen aan een experimenteel programma, slechts open voor degene die
      tevens voldoet aan de in [dat artikel][ref3] bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018259#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.37b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0018259
        artikel: '7'
  - number: 7.42.1
    text: 'Op het verzoek van degene die is ingeschreven voor een opleiding aan een universiteit of hogeschool:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.1.a
    text: |-
      wordt de inschrijving voor het desbetreffende studiejaar door het instellingsbestuur beëindigd met ingang van de
      maand volgend op die waarin het afsluitend examen van de desbetreffende opleiding met goed gevolg is afgelegd;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.1.b
    text: |-
      wordt in geval van ziekte of bijzondere familie-omstandigheden, ter beoordeling van het instellingsbestuur, de
      inschrijving voor het desbetreffende studiejaar door het instellingsbestuur beëindigd met ingang van de maand
      volgend op de tweede hele maand waarin betrokkene niet aan het onderwijs heeft kunnen deelnemen;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.1.c
    text: |-
      wordt de inschrijving tijdens het eerste jaar van inschrijving voor de propedeutische fase van een
      bacheloropleiding of, indien die fase niet is ingesteld, de eerste periode in een bacheloropleiding met een
      studielast van 60 studiepunten beëindigd met ingang van de tweede hele maand volgend op de maand waarin dat bestuur
      het verzoek heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.1.d
    text: |-
      wordt de inschrijving beëindigd met ingang van de eerste maand volgend op de maand waarin het verzoek tot
      beëindiging van de inschrijving is ontvangen, indien de student als gevolg van de inrichting van de opleiding
      wat betreft de volgtijdelijkheid van praktische oefeningen alsmede de momenten waarop deze gevolgd kunnen worden,
      gedurende enige tijd geen onderwijs kan volgen;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.1.e
    text: |-
      wordt, ter beoordeling van het instellingsbestuur, de inschrijving voor het desbetreffende studiejaar door het
      instellingsbestuur beëindigd met ingang van de tweede hele maand volgend op de maand waarin betrokkene het verzoek
      heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.42.2
    text: Het instellingsbestuur stelt regels van procedurele aard vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.42
  - number: 7.43.1
    text: |-
      Bij de inschrijving als student voor een voltijdse opleiding aan een universiteit of hogeschool is een collegegeld
      verschuldigd van € 1 329,58 door degene die voor de aanvang van het studiejaar de leeftijd van 30 jaren nog niet
      heeft bereikt, en die
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
  - number: 7.43.1.a
    text: |-
      de nationaliteit bezit van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte,
      of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
  - number: 7.43.1.b
    text: |-
      een niet onder a bedoelde vreemdeling is die studiefinanciering geniet krachtens de
      [Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 7.43.2
    text: |-
      Bij de inschrijving als student voor een voltijdse opleiding aan een universiteit of hogeschool is een door het
      instellingsbestuur vast te stellen collegegeld verschuldigd door degene die niet onder het bereik valt van het
      eerste lid. Het collegegeld bedraagt ten minste € 1 329,58.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
  - number: 7.43.3
    text: |-
      Het instellingsbestuur draagt tijdig voor de aanvang van het studiejaar zorg voor openbaarmaking van de op grond
      van het tweede lid vastgestelde bedragen en stelt regels van procedurele aard vast met betrekking tot de toepassing
      van dat lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
  - number: 7.43.4
    text: |-
      Bij ministeriële regeling wordt het in het eerste en tweede lid genoemde bedrag jaarlijks geïndexeerd aan de
      hand van de consumentenprijsindex. De ministeriële regeling wordt vastgesteld voor 1 november voorafgaand aan
      het studiejaar waarvoor het geïndexeerde collegegeld zal gelden. De indexering wordt bepaald door de procentuele
      wijziging die de consumentenprijsindex over de maand april, voorafgaand aan de vaststelling van de ministeriële
      regeling, heeft ondergaan ten opzichte van de maand april in het daaraan voorafgaande jaar. De aldus verkregen
      wijziging van het collegegeldbedrag wordt afgerond op het naastbij gelegen gehele getal. Het overeenkomstig dit
      lid gewijzigde bedrag treedt in de plaats van het in het eerste en tweede lid genoemde bedrag. Hetgeen onder
      consumentenprijsindex wordt verstaan, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43
  - number: 7.43a.1
    text: |-
      Het instellingsbestuur stelt in afwijking van [artikel 7.43][ref1] voor een
      opleiding die of voor een experimenteel programma dat is aangewezen op grond van
      [artikel 9 van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref2], een collegegeld vast.
      Het collegegeld bedraagt ten hoogste vijf keer het collegegeld, bedoeld in [artikel 7.43, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018259#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018259
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.43a.2
    text: |-
      Het instellingsbestuur draagt tijdig voor de aanvang van het studiejaar zorg voor openbaarmaking van het op grond
      van het eerste lid vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43a
  - number: 7.43a.3
    text: |-
      Indien het eerste lid voor een opleiding toepassing heeft gevonden, komt het overeenkomstig het eerste lid
      vastgestelde collegegeld in de plaats van het collegegeld, genoemd in [artikel 7.43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.43a.4
    text: |-
      [Artikel 7.43, vierde lid][ref1] met uitzondering van de vijfde volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.43a.5
    text: |-
      [Artikel 7.47, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.43a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.44.1
    text: |-
      Voor de inschrijving als student voor een deeltijdse of duale opleiding aan een universiteit of hogeschool stelt
      het instellingsbestuur het collegegeld vast. Het collegegeld bedraagt ten minste € 567,23.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.44
  - number: 7.44.2
    text: |-
      [Artikel 7.43, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.44
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.45.1
    text: Voor de inschrijving als extraneus is een door het instellingsbestuur vast te stellen examengeld verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.45
  - number: 7.45.2
    text: |-
      [Artikel 7.43, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.45
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.1
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere geldelijke bijdrage dan de in
      de[ artikelen 7.43, eerste en tweede lid][ref1], [7.44, eerste lid][ref2], en [7.45, eerste lid][ref3], bedoelde
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.46.2
    text: |-
      In afwijking van het eerste lid kan bij algemene maatregel van bestuur worden bepaald dat het
      instellingsbestuur van een hogeschool met het oog op de inschrijving voor een opleiding als bedoeld in de
      [artikelen 7.26, tweede lid][ref1], en [7.26a, eerste lid][ref2], een bijdrage mag verlangen in de kosten die
      rechtstreeks verband houden met het onderwijs. De algemene maatregel van bestuur bepaalt op welke kostensoorten een
      dergelijke bijdrage betrekking kan hebben en welk bedrag ten hoogste gevorderd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.46.3
    text: |-
      Het instellingsbestuur treft voorzieningen tot financiële ondersteuning van degenen voor wie de bijdrage, bedoeld
      in het tweede lid, een onoverkomelijke belemmering voor de inschrijving vormt. Het instellingsbestuur stelt nadere
      regels vast met betrekking tot de toepassing van het tweede lid en met betrekking tot de financiële ondersteuning,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.46
  - number: 7.47.1
    text: 'Het collegegeld wordt door of namens de student voldaan door:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.47
  - number: 7.47.1.a
    text: betaling ineens, dan wel
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.47
  - number: 7.47.1.b
    text: |-
      gespreide betaling, overeenkomstig een door het instellingsbestuur en degene die zich tot betaling heeft verbonden
      te treffen betalingsregeling, waarbij door het instellingsbestuur administratiekosten in rekening kunnen worden
      gebracht. Deze bedragen ten hoogste € 13,61. In geval van betaling in termijnen is sprake van ten minste vijf
      termijnen, die over het hele studiejaar zijn gespreid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.47
  - number: 7.47.2
    text: |-
      De belanghebbende, bedoeld in de [artikelen 7.43, tweede lid][ref1], en [7.44, eerste lid][ref2], is collegegeld
      verschuldigd met ingang van het door het instellingsbestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.47
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.1
    text: |-
      Vermindering of vrijstelling van het collegegeld, bedoeld in [artikel 7.43, eerste lid][ref1], vindt plaats in de
      gevallen en op de wijze als omschreven in het tweede tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.48.2
    text: 'Het collegegeld wordt met een twaalfde deel voor elke maand dat betrokkene niet is ingeschreven, verminderd:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
  - number: 7.48.2.a
    text: voor degene die in de loop van het studiejaar wordt ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
  - number: 7.48.2.b
    text: |-
      voor degene die is ingeschreven voor een opleiding aan een universiteit of hogeschool, en wiens inschrijving
      op zijn verzoek in de loop van het studiejaar door of namens het instellingsbestuur is beëindigd op grond van
      [artikel 7.42, eerste lid, onder b, c, d of e][ref1], en die in de loop van hetzelfde studiejaar opnieuw voor een
      opleiding wenst te worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.48.3
    text: |-
      Degene die is ingeschreven voor een opleiding aan een universiteit of hogeschool dan wel aan een instelling van
      wetenschappelijk onderwijs als bedoeld in [artikel 16.21][ref1], of degene die voor het volgen van uit de openbare
      kas bekostigd onderwijs les- of cursusgeld verschuldigd is op grond van de [Les- en cursusgeldwet][ref2], en
      die in plaats daarvan, onderscheidenlijk daarnaast of in plaats daarvan, in hetzelfde studiejaar wenst te worden
      ingeschreven en daarvoor een hoger collegegeld is verschuldigd dan de reeds voldane bijdrage, is voor de tweede
      inschrijving een collegegeld verschuldigd, dat het verschil bedraagt tussen de reeds voldane bijdrage en het
      bedoelde, hogere collegegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0004188
  - number: 7.48.4
    text: |-
      Degene die is ingeschreven voor een opleiding aan een universiteit of hogeschool dan wel een instelling van
      wetenschappelijk onderwijs als bedoeld in [artikel 16.21][ref1], of degene die voor het volgen van uit de openbare
      kas bekostigd onderwijs les- of cursusgeld verschuldigd is op grond van de [Les- en cursusgeldwet][ref2], en die
      daarnaast, onderscheidenlijk daarnaast of in plaats daarvan, in hetzelfde studiejaar wenst te worden ingeschreven,
      voor welke inschrijving een collegegeld is verschuldigd, dat lager is dan of gelijk is aan de reeds voldane
      bijdrage, wordt voor de tweede inschrijving vrijgesteld van het betalen van collegegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.48
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0004188
  - number: 7.49.1
    text: |-
      Terugbetaling van het collegegeld, bedoeld in [artikel 7.43, eerste lid][ref1], vindt plaats in de gevallen en op
      de wijze als omschreven in het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.2
    text: |-
      Met ingang van de maand waarin de student, bedoeld in [artikel 7.42, eerste lid, onder a][ref1], is uitgeschreven,
      wordt hem op zijn schriftelijk verzoek voor elke maand die in dat studiejaar nog resteert, een tiende gedeelte van
      het betaalde collegegeld terugbetaald, tenzij deze student nog is ingeschreven voor een of meer opleidingen als
      bedoeld in [artikel 7.48, derde en vierde lid][ref2]. Voor de toepassing van dit artikellid tellen de laatste twee
      maanden van het studiejaar niet mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.3
    text: |-
      Indien de inschrijving van degene op wiens schriftelijk verzoek in de loop van het studiejaar door of namens het
      instellingsbestuur wordt beëindigd op grond van [artikel 7.42, eerste lid, onder b, c, d of e][ref1], wordt met
      ingang van de maand waarin de inschrijving wordt beëindigd, voor elke maand die in dat studiejaar nog resteert, een
      twaalfde gedeelte van het betaalde collegegeld terugbetaald, tenzij deze student nog is ingeschreven voor een of
      meer opleidingen als bedoeld in [artikel 7.48, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49.4
    text: |-
      Indien een student in de loop van het studiejaar is overleden, wordt voor elke daaropvolgende maand van het
      studiejaar na diens overlijden, een twaalfde gedeelte van het betaalde collegegeld terugbetaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49
  - number: 7.49.5
    text: |-
      De in dit artikel bedoelde terugbetaling geschiedt overeenkomstig door het instellingsbestuur vast te stellen
      regels van procedurele aard.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49
  - number: 7.49a.1
    text: |-
      Terugbetaling van het collegegeld, bedoeld in [artikel 7.43a][ref1], vindt plaats in het geval en op de wijze als
      omschreven in het tweede tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49a.2
    text: |-
      Indien een student of extraneus aannemelijk kan maken dat een opleiding als bedoeld in
      [artikel 9, eerste lid, van de Experimentenwet vooropleidingseisen, selectie en collegegeldheffing][ref1] waarvoor
      hij is ingeschreven, in voorkomende gevallen in verband met het deelnemen aan een experimenteel programma, niet
      voldoet aan de voorwaarden, bedoeld in het tweede lid van dat artikel, dan wel niet of niet volledig beantwoordt
      aan de eisen die aan die opleiding in verband met het hogere collegegeldbedrag redelijkerwijs kunnen worden
      gesteld, heeft hij naar rato van het vastgestelde collegegeldbedrag aanspraak op terugbetaling van ten hoogste vier
      keer het collegegeld, bedoeld in [artikel 7.43][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018259#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49a
    references:
      - id: ref1
        bwb_id: BWBR0018259
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.49a.3
    text: |-
      De aanvraag om terugbetaling van collegegeld wordt schriftelijk en voorzien van een motivering bij het
      instellingsbestuur ingediend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49a
  - number: 7.49a.4
    text: Het instellingsbestuur zendt de student binnen acht weken na ontvangst van de aanvraag een beslissing daarop.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49a
  - number: 7.49a.5
    text: |-
      [Artikel 7.49, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.49a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.50.1
    text: |-
      Het instellingsbestuur van de Open Universiteit stelt het voor een inschrijving verschuldigde cursusgeld vast. Bij
      de vaststelling van de bedragen houdt het instellingsbestuur rekening met de toegankelijkheid van het onderwijs aan
      de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.50
  - number: 7.50.2
    text: |-
      Het instellingsbestuur stelt een regeling vast, waarin een voorziening in de vorm van een gedeeltelijke
      vrijstelling ten aanzien van het cursusgeld wordt getroffen, ten behoeve van personen waarvan de draagkracht uit
      inkomen beneden een door Onze minister te bepalen grens ligt. De hoogte van de vrijstelling is afhankelijk van het
      inkomen van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.50
  - number: 7.50.3
    text: |-
      Het instellingsbestuur draagt zorg voor openbaarmaking van de cursusgelden, bedoeld in het eerste lid, en van de
      regeling, bedoeld in het tweede lid. Deze openbaarmaking geschiedt in elk geval door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.50
  - number: 7.50.4
    text: |-
      Het instellingsbestuur zendt de regeling, bedoeld in het tweede lid, binnen veertien dagen na de vaststelling aan
      Onze minister en brengt jaarlijks voor 1 juli verslag uit aan Onze minister over de uitvoering van de regeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.50
  - number: 7.51.1
    text: |-
      Het instellingsbestuur van een universiteit of hogeschool treft voorzieningen ter financiële ondersteuning van de
      student ten aanzien van wie zich ieder van de navolgende feiten voordoet:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.1.a
    text: |-
      de student is aan de desbetreffende instelling ingeschreven voor een opleiding waarvan hij het afsluitend examen
      nog niet met goed gevolg heeft afgelegd,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.1.b
    text: |-
      de student geniet of heeft in verband met het volgen van de opleiding, bedoeld onder a, dan wel
      het volgen van dezelfde opleiding aan een andere instelling, studiefinanciering op de voet van
      de [artikelen 15 tot en met 16a van de Wet op de studiefinanciering][ref1] dan wel op de voet van
      [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2] genoten,


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0003955
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51.1.c
    text: |-
      in de periode waarin met het oog op het volgen van een opleiding aan een in de bijlage van
      deze wet onder a tot en met g opgenomen instelling studiefinanciering op de voet van de
      [artikelen 15 tot en met 16a van de Wet op de studiefinanciering][ref1] dan wel op de voet van
      [hoofdstuk 3 van de Wet studiefinanciering 2000][ref2] werd genoten, doen zich een of meer, in het tweede lid
      genoemde, bijzondere omstandigheden voor of hebben deze zich voorgedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0003955
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51.1.d
    text: |-
      de in onderdeel c bedoelde bijzondere omstandigheden hebben tot studievertraging geleid of zullen dat naar
      verwachting doen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2
    text: |-
      De bijzondere omstandigheden van de student die bij de toepassing van het eerste lid in aanmerking worden genomen
      zijn:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.a
    text: ziekte of zwangerschap;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.b
    text: lichamelijke, zintuiglijke of andere functiestoornissen;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.c
    text: bijzondere familieomstandigheden;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.d
    text: 'het lidmaatschap, daaronder begrepen het voorzitterschap, van:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.d.1°
    text: |-
      bij universiteiten: de universiteitsraad, de faculteitsraad, het orgaan dat is ingesteld op grond van de
      medezeggenschapregeling, bedoeld in [artikel 9.30, derde lid][ref1], of [artikel 9.51, tweede lid][ref2], het
      bestuur van een opleiding of een opleidingscommissie, alsmede het bestuur van een stichting die blijkens haar
      statuten tot doel heeft de exploitatie van voorzieningen, behorende tot de studentenvoorzieningen, dan wel van een
      daarmee naar het oordeel van het instellingsbestuur, gelet op de taak, gelijk te stellen orgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.51.2.d.2°
    text: |-
      bij hogescholen: de medezeggenschapsraad, de deelraad, een studentencommissie of opleidingscommissie, alsmede het
      bestuur van een stichting die blijkens haar statuten tot doel heeft de exploitatie van voorzieningen, behorende tot
      de studentenvoorzieningen, dan wel van een daarmee naar het oordeel van het instellingsbestuur, gelet op haar taak,
      gelijk te stellen orgaan;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.e
    text: |-
      andere door het instellingsbestuur te bepalen omstandigheden waarin betrokkene activiteiten ontplooit in het kader
      van de organisatie en het bestuur van de instelling;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.f
    text: |-
      ter beoordeling van het instellingsbestuur: het lidmaatschap van het bestuur van een studentenorganisatie van enige
      omvang met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.g
    text: een onvoldoende studeerbare opleiding;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.h
    text: verlies van accreditatie van de opleiding waaraan de student is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.2.i
    text: |-
      andere dan de in de onderdelen a tot en met h bedoelde omstandigheden die, indien een daarop gebaseerd verzoek
      om financiële ondersteuning door het instellingsbestuur niet zou worden gehonoreerd, zouden leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.3
    text: |-
      Het instellingsbestuur deelt de student schriftelijk de beslissing op de aanvraag om toekenning van financiële
      ondersteuning zo spoedig mogelijk mede, nadat de student een bijzondere omstandigheid heeft aangemeld. De
      financiële ondersteuning wordt de student zo spoedig mogelijk ter beschikking gesteld of op een ander, door de
      student te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.4
    text: |-
      De omvang van de financiële ondersteuning is gelijk aan de studiefinanciering die betrokkene geniet uit hoofde van
      [hoofdstuk 3 van de Wet studiefinanciering 2000][ref1], dan wel zou hebben genoten, indien hij daarop aanspraak zou
      maken of zou hebben mogen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0011453
        hoofdstuk: '3'
  - number: 7.51.5
    text: |-
      Bij de vaststelling van de tijdsduur van de financiële ondersteuning wordt het verband tussen de bijzondere
      omstandigheden, bedoeld in het tweede lid, en de onderwijsprogrammering in aanmerking genomen. Het
      instellingsbestuur kan aan de beschikbaarstelling van de voorziening de voorwaarde verbinden dat de student
      feitelijk studerende is. Het instellingsbestuur kan aan toekenning van financiële ondersteuning op grond van de
      bijzondere omstandigheden, bedoeld in het tweede lid, onder e en f, voorwaarden verbinden. Het instellingsbestuur
      stelt regels betreffende de voorwaarden, bedoeld in de derde volzin.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.6
    text: |-
      De omvang en de duur van een aan een student aan de desbetreffende instelling eerder toegekende aanspraak op
      financiële ondersteuning op grond van dit artikel zoals dat luidde op 31 augustus 2000 worden geëerbiedigd, indien
      deze gunstiger voor de student zijn dan bij toepassing van dit artikel. De student die een opleiding aan een
      andere, in de bijlage van deze wet onder a tot en met g opgenomen instelling heeft gevolgd, en op grond van dit
      artikel een eerder toegekende aanspraak op financiële ondersteuning heeft of zou hebben gehad, indien hij daarom
      zou hebben verzocht, heeft, met inachtneming van de eerste volzin, aanspraak op financiële ondersteuning als ware
      die opleiding genoten aan de instelling waaraan de student is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
  - number: 7.51.7
    text: |-
      Onze minister treft voorzieningen ter financiële ondersteuning van een student die gedurende een maand of langer
      deelneemt aan een beoordeling als bedoeld in [artikel 1.18, eerste lid][ref1], of een student die bestuurslid is
      van een van een rechtspersoon met volledige rechtsbevoegdheid uitgaande politieke jongerenorganisatie van enige
      omvang of van een landelijke organisatie van enige omvang, waarbij de behartiging van een maatschappelijk of
      onderwijskundig belang op de voorgrond staat en die daartoe daadwerkelijke activiteiten ontplooit. Bij algemene
      maatregel van bestuur worden de voorwaarden vastgesteld waaronder deze financiële ondersteuning plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 7.51a.1
    text: |-
      Het instellingsbestuur van een hogeschool treft een financiële voorziening ten aanzien van een student die op
      grond van [artikel 5.8, tweede lid, onderdeel a van de Wet studiefinanciering 2000][ref1] geen aanspraak kan
      maken op studiefinanciering op de voet van [hoofdstuk 3 van die wet][ref2], indien aan de student op grond
      van de beslissing, bedoeld in [artikel 7.31a, derde lid][ref3], een vrijstelling van een geringere omvang dan
      genoemd in het eerste lid van dat artikel is verleend. Deze voorziening is zodanig dat de betrokkene niet in
      een slechtere financiële situatie wordt gebracht dan wanneer hij studiefinanciering zou hebben genoten zonder
      toepassing van [artikel 5.8, tweede lid, onderdeel a van de Wet studiefinanciering 2000][ref4], met dien
      verstande dat de voorziening wordt beëindigd na het verstrijken van het opwaarts op een geheel getal afgeronde
      aantal maanden dat overeenstemt met de studielast van de onderwijseenheden waarvoor bij de toepassing van
      [artikel 7.31a, derde lid][ref5], aan de student geen vrijstelling is verleend, of zoveel eerder als betrokkene met
      goed gevolg het afsluitend examen van de desbetreffende opleiding heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011453
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.51a.2
    text: |-
      Het instellingsbestuur van een universiteit treft een financiële voorziening ten aanzien van een student
      die op grond van [artikel 5.6 van de Wet studiefinanciering 2000][ref1] geen aanspraak kan maken op
      prestatiebeurs, indien de student is ingeschreven voor een opleiding waarop het instellingsbestuur
      [artikel 7.4a, achtste lid][ref2], heeft toegepast. Deze voorziening is zodanig dat de betrokkene niet in
      een slechtere financiële situatie wordt gebracht dan wanneer hij studiefinanciering zou hebben genoten zonder
      toepassing van [artikel 5.6 van de Wet studiefinanciering 2000][ref3], met dien verstande dat de voorziening wordt
      beëindigd na het verstrijken van het aantal opwaarts op een geheel getal afgeronde aantal maanden dat overeenstemt
      met de studielast van de masteropleiding, die uitgaat boven het aantal van 60 studiepunten, of zoveel eerder als
      betrokkene met goed gevolg het afsluitend examen van die opleiding heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51a
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '5'
  - number: 7.51a.3
    text: Het instellingsbestuur stelt regels van procedurele aard vast voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.51a
  - number: 7.52.1
    text: 'Er is een Centraal register inschrijving hoger onderwijs, dat ten doel heeft:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
  - number: 7.52.1.a
    text: |-
      de instellingsbesturen, dat van de Open Universiteit daaronder niet begrepen, op hun verzoek de noodzakelijke
      informatie te verstrekken over de inschrijving van hen die wensen te worden ingeschreven dan wel zijn ingeschreven
      aan een instelling,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
  - number: 7.52.1.b
    text: |-
      de Informatie Beheer Groep op diens verzoek ten behoeve van beslissingen op verzoeken om toekenning van
      studiefinanciering, informatie te verstrekken omtrent de studievoortgang en het met goed gevolg hebben afgelegd van
      het afsluitend examen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
  - number: 7.52.1.c
    text: |-
      Onze minister op diens verzoek de noodzakelijke informatie te verstrekken ten behoeve van de planning en
      bekostiging van de instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
  - number: 7.52.2
    text: |-
      Gegevens, opgenomen in het Centraal register inschrijving hoger onderwijs, waaraan informatie herleidbaar
      tot natuurlijke personen, kan worden ontleend, kunnen uitsluitend worden verstrekt aan de geregistreerde
      personen zelf of hun gemachtigden, alsmede aan de in het eerste lid bedoelde instellingsbesturen. Aan
      burgemeester en wethouders, onderscheidenlijk aan de Sociale verzekeringsbank, worden kosteloos desgevraagd
      gegevens verstrekt, die noodzakelijk zijn voor de uitvoering van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], onderscheidenlijk
      voor de uitvoering van de [Algemene Kinderbijslagwet][ref4]. Tevens worden desgevraagd aan het Centraal bureau
      voor de statistiek gegevens verstrekt, die noodzakelijk zijn voor de uitvoering van zijn taak, bedoeld in
      [artikel 3 van de Wet op het Centraal bureau voor de statistiek][ref5]. Voorts kunnen desgevraagd aan andere door
      de Informatie Beheer Groep aan te wijzen instanties gegevens als bedoeld in de eerste volzin worden verstrekt
      uitsluitend in verband met door haar aan te wijzen onderzoeksdoeleinden. Andere gegevens, opgenomen in dat
      register, kunnen uitsluitend worden verstrekt aan door de Informatie Beheer Groep aan te wijzen instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0002368
      [ref5]: https://wetten.overheid.nl/BWBR0008005#Artikel3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0002368
      - id: ref5
        bwb_id: BWBR0008005
        artikel: '3'
  - number: 7.52.3
    text: |-
      Van het Centraal register inschrijving hoger onderwijs is de hoofddirectie van de Informatie Beheer Groep
      verantwoordelijke in de zin van [artikel 1 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 7.52.4
    text: |-
      De Informatie Beheer Groep kan ten behoeve van het Centraal register inschrijving
      hoger onderwijs gebruikmaken van het sociaal fiscaal nummer, bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1],
      voorzover dit noodzakelijk is voor de uitvoering van de [Wet werk en bijstand][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4], de
      [Algemene Kinderbijslagwet][ref5] en de [Wet studiefinanciering 2000][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
      [ref5]: https://wetten.overheid.nl/BWBR0002368
      [ref6]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
      - id: ref5
        bwb_id: BWBR0002368
      - id: ref6
        bwb_id: BWBR0011453
  - number: 7.52.5
    text: |-
      De instellingsbesturen van universiteiten en hogescholen stellen het Centraal register inschrijving hoger onderwijs
      telkenmale voor een door Onze Minister van Onderwijs, Cultuur en Wetenschap te bepalen datum en op een door hem
      te bepalen wijze in kennis van elke door hen genomen beslissing met betrekking tot de inschrijving als student
      of extraneus de gegevens over de studievoortgang, bedoeld in [artikel 7.9a][ref1], alsmede van de gegevens met
      betrekking tot het met goed gevolg hebben afgelegd van het afsluitend examen, bedoeld in [artikel 7.9d][ref2].
      De instellingsbesturen van universiteiten en hogescholen zijn gehouden medewerking te verlenen aan procedures die
      er op zijn gericht te bevorderen dat de in het Centraal register inschrijving hoger onderwijs opgenomen gegevens
      zoveel mogelijk juist en volledig zijn. Onze minister kan terzake nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.52a
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52a
  - number: 7.52a.a
    text: 'opleiding: een bacheloropleiding, en'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52a
  - number: 7.52a.b
    text: |-
      propedeutische fase: de propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in een
      bacheloropleiding met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.52a
  - number: 7.53.1
    text: |-
      Het instellingsbestuur kan per opleiding het aantal studenten vaststellen, dat ten hoogste voor de eerste maal
      kan worden ingeschreven voor de propedeutische fase van de desbetreffende opleiding. Deze vaststelling geschiedt
      voor een studiejaar. Voor 1 december van het kalenderjaar voorafgaande aan het studiejaar waarvoor de eerste
      vaststelling geschiedt, doet het instellingsbestuur hiervan mededeling aan de Informatie Beheer Groep. Voor een
      opleiding die na deze datum voor de eerste maal is opgenomen in het register, bedoeld in [artikel 6.13][ref1], en
      waarvan het onderwijs zal aanvangen met ingang van het daaropvolgende studiejaar, geldt 1 april als uiterste datum
      voor de mededeling aan de Informatie Beheer Groep van de onderwijscapaciteit van die opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.53.2
    text: |-
      Indien uit de gegevens betreffende de aanmelding, bedoeld in [artikel 7.37, vierde lid][ref1], blijkt dat het
      aantal eerste aanmeldingen van studenten voor de propedeutische fase van een opleiding meer bedraagt dan het aantal
      plaatsen dat het instellingsbestuur op grond van het eerste lid heeft vastgesteld, doet de Informatie Beheer Groep
      daarvan voor 1 april mededeling aan het instellingsbestuur. Het instellingsbestuur deelt de Informatie Beheer
      Groep voor 1 mei mee of het aanleiding ziet het aantal plaatsen te verhogen. Dit lid is niet van toepassing op
      opleidingen als bedoeld in de laatste volzin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.53.3
    text: |-
      Indien ook na toepassing van het tweede lid bij een of meer instellingen die de desbetreffende opleiding verzorgen,
      het aantal aanmeldingen op 1 mei het aantal plaatsen overtreft, stelt de Informatie Beheer Groep vast dat een
      toelatingsbeperking van kracht is, waarna [paragraaf 4a][ref1] van deze titel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.53.4
    text: |-
      Indien het instellingsbestuur in de verwachting verkeert dat het aantal inschrijvingen voor een opleiding meer
      zal bedragen dan het aantal plaatsen dat het instellingsbestuur op grond van het eerste lid heeft vastgesteld, is,
      in afwijking van de procedure van het tweede en derde lid, eveneens een toelatingsbeperking op die opleiding van
      kracht en wordt vervolgens [paragraaf 4a][ref1] van deze titel toegepast, mits het instellingsbestuur die opleiding
      daartoe voor 1 mei heeft aangemeld bij de Informatie Beheer Groep.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.53.5
    text: |-
      Indien een besluit ingevolge [artikel 7.56][ref1] van toepassing is op de opleiding, blijft dit artikel buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.54.1
    text: |-
      Het instellingsbestuur kan, indien het van oordeel is dat de onderwijscapaciteit, die voor de postpropedeutische
      fase van een opleiding, waarvoor een beperking van de eerste inschrijving is vastgesteld, niet toereikend is voor
      een onbeperkte inschrijving, besluiten inschrijving voor de postpropedeutische fase van die opleiding te weigeren
      aan hen, die niet reeds ingeschreven zijn geweest aan die aan de instelling verbonden opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.54
  - number: 7.54.2
    text: |-
      In dit artikel wordt, indien in een opleiding geen propedeutische fase is ingesteld, onder «postpropedeutische
      fase» mede verstaan de fase in een bacheloropleiding die volgt op de eerste periode in een opleiding met een
      studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.54
  - number: '7.55'
    text: |-
      Het instellingsbestuur van de Open Universiteit kan de inschrijvingsmogelijkheid voor een bepaalde opleiding
      of onderwijseenheid opschorten voorzover en voor zolang de organisatorische en technische capaciteit voor het
      verzorgen van deze opleiding of onderwijseenheid daartoe naar zijn oordeel noodzaakt. Met inachtneming van de in de
      eerste volzin bedoelde beperkingen geschiedt de inschrijving in de volgorde van aanmelding voor de desbetreffende
      opleiding of onderwijseenheid, volgens door het instellingsbestuur vast te stellen regels van procedurele aard.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.55
  - number: 7.56.1
    text: |-
      Indien het aanbod van afgestudeerden van een bepaalde opleiding de behoefte daaraan op de arbeidsmarkt in
      aanmerkelijke mate dreigt te overtreffen of daadwerkelijk overtreft en dit naar verwachting gedurende een reeks van
      jaren het geval zal zijn, kan bij ministeriële regeling worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.56
  - number: 7.56.1.a
    text: |-
      het aantal personen dat voor de twee daaropvolgende studiejaren ten hoogste voor de eerste maal kan worden
      ingeschreven voor de propedeutische fase van de desbetreffende opleiding aan al de universiteiten of hogescholen
      waaraan deze is verbonden, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.56
  - number: 7.56.1.b
    text: |-
      de verdeling van dat aantal over elk van de onder *a* bedoelde instellingen, waarbij in geval van door hogescholen
      verzorgde lerarenopleidingen binnen het voor een instelling vastgestelde aantal onderscheid kan worden gemaakt
      tussen voltijdse, duale en deeltijdse opleidingen. Bij de verdeling wordt het door alle betrokken instellingen
      gezamenlijk gedane voorstel gevolgd. Dit voorstel wordt gedaan binnen twee maanden nadat Onze minister aan de
      desbetreffende instellingen en aan de beide Kamers der Staten-Generaal heeft bekendgemaakt dat hij het voornemen
      heeft een ministeriële regeling vast te stellen. Blijft een dergelijk voorstel achterwege dan wordt zoveel
      mogelijk een evenredige spreiding over de afzonderlijke instellingen naar rato van het gemiddelde aantal over de
      voorafgaande drie jaren voor de eerste maal voor de propedeutische fase ingeschreven studenten in acht genomen.
      Indien de instelling de opleiding voor het tweede of het derde jaar verzorgt heeft het gemiddelde aantal betrekking
      op het eerste, onderscheidenlijk het eerste en tweede jaar dat de opleiding is verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.56
  - number: 7.56.2
    text: |-
      Indien op grond van het eerste lid een toelatingsbeperking is vastgesteld, wordt
      [paragraaf 4a van deze titel][ref1] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.56
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.56.3
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid wordt uiterlijk vastgesteld op 1 mei van het jaar
      voorafgaand aan het studiejaar waarin deze regeling voor het eerst van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.56
  - number: '7.57'
    text: |-
      Voor de toepassing van deze paragraaf en de [artikelen 7.57d][ref1] en [7.57f, vierde en vijfde lid][ref2], gelden
      door universiteiten onderscheidenlijk hogescholen verzorgde opleidingen met dezelfde naam als dezelfde opleidingen.
      Voor de toepassing van de [artikelen 7.56][ref3], [7.57d][ref4] en [7.57f, vierde en vijfde lid][ref5], gelden
      bovendien door universiteiten onderscheidenlijk hogescholen verzorgde groepen van verwante opleidingen als dezelfde
      opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57a.1
    text: |-
      De eerste inschrijving van een student voor de propedeutische fase van een opleiding, verbonden aan een
      universiteit of een hogeschool, waarvoor op grond van paragraaf 4 van deze titel een toelatingsbeperking van kracht
      is, geschiedt slechts met inachtneming van het bepaalde bij of krachtens deze paragraaf, onverminderd het bepaalde
      bij of krachtens [titel 2][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.57a.2
    text: |-
      De inschrijving geschiedt niet dan na overlegging van een door de Informatie Beheer Groep afgegeven bewijs van
      toelating, tenzij bij of krachtens deze paragraaf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
  - number: 7.57a.3
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
  - number: 7.57a.3.a
    text: |-
      selectieprocedure: de procedure, beschreven in de [artikelen 7.57b tot en met 7.57e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57a.3.b
    text: |-
      lotingsprocedure: de procedure, beschreven in
      [de artikelen 7.57b, eerste lid, tweede lid, aanhef en onder b tot en met e, derde en vierde lid][ref1], en
      [7.57c, tweede en derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57a.3.c
    text: 'opleiding: een bacheloropleiding;'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
  - number: 7.57a.3.d
    text: |-
      propedeutische fase: de propedeutische fase of, indien die fase niet is ingesteld, de eerste periode in een
      bacheloropleiding met een studielast van 60 studiepunten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
  - number: 7.57a.4
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld in verband met de afgifte en de geldigheidsduur van het
      bewijs van toelating.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57a
  - number: 7.57b.1
    text: |-
      De Informatie Beheer Groep deelt degenen die op grond van [artikel 7.24, eerste of tweede lid][ref1], inschrijving
      verlangen voor een opleiding, aan de hand van het behaalde gemiddelde eindexamencijfer in vijf klassen in.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.57b.2
    text: 'De in het eerste lid bedoelde klassen hebben als grenzen:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.2.a
    text: hoger dan of gelijk aan 8,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.2.b
    text: lager dan 8 maar hoger dan of gelijk aan 7,5,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.2.c
    text: lager dan 7,5 maar hoger dan of gelijk aan 7,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.2.d
    text: lager dan 7 maar hoger dan of gelijk aan 6,5 en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.2.e
    text: lager dan 6,5.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
  - number: 7.57b.3
    text: |-
      De wijze van indeling in de klassen, bedoeld in het tweede lid, van degenen die een onderwijsvorm hebben
      afgerond waaraan geen cijferlijst is verbonden, wordt geregeld in de ministeriële regeling, bedoeld in
      [artikel 7.57a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57b.4
    text: |-
      De Informatie Beheer Groep deelt degenen die op grond van de [artikelen 7.28][ref1] of [7.29][ref2] zijn
      vrijgesteld van de in [artikel 7.24, eerste of tweede lid][ref3], bedoelde vooropleidingseisen in de lotingsklasse,
      bedoeld in het tweede lid onder c, in.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.57b.5
    text: |-
      De Informatie Beheer Groep deelt de door haar aangewezen aanstaande studenten uit de Nederlandse Antillen en
      Aruba in de klasse, bedoeld in het tweede lid onder a, in. De wijze waarop die aanwijzing geschiedt, en het aantal
      aanstaande studenten dat ten hoogste kan worden aangewezen, wordt bepaald in de ministeriële regeling, bedoeld in
      [artikel 7.57a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.1
    text: |-
      De Informatie Beheer Groep verstrekt een bewijs van toelating aan degenen die zijn ingedeeld in de klasse, bedoeld
      in [artikel 7.57b, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.2
    text: |-
      De Informatie Beheer Groep verstrekt aan degenen die in de lotingsklassen, bedoeld in
      [artikel 7.57b, tweede lid, onder b tot en met e][ref1], zijn ingedeeld, en die door het lot zijn aangewezen, een
      bewijs van toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.3
    text: |-
      Bij de loting, bedoeld in het tweede lid, verhouden de inlotingskansen, voorzover kleiner dan honderd procent, zich
      voor de in [artikel 7.57b, tweede lid, onder b tot en met e][ref1], bedoelde lotingsklassen als respectievelijk 9 :
      6 : 4 : 3.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57c.4
    text: |-
      In de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref1], kan worden bepaald dat de Informatie
      Beheer Groep ten hoogste een in die regeling vast te stellen percentage van het aantal plaatsen per opleiding kan
      toewijzen aan gegadigden jegens wie uitloting een onbillijkheid van overwegende aard zou opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.1
    text: |-
      Indien een opleiding door meer dan één universiteit wordt verzorgd, wordt de selectieprocedure voor die opleidingen
      gezamenlijk uitgevoerd. Daarbij worden de [artikelen 7.57b][ref1] en [7.57c][ref2] toegepast, met inachtneming
      van het tweede en derde lid. De gegadigden delen aan de Informatie Beheer Groep de volgorde van hun voorkeur voor
      universiteiten mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.2
    text: |-
      De Informatie Beheer Groep bepaalt, zoveel mogelijk rekening houdend met de voorkeur van de aanstaande
      student, doch overigens aan de hand van het lot voor welke universiteit het bewijs van toelating geldt.
      [Artikel 7.57c, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57d
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57d.3
    text: |-
      De Informatie Beheer Groep kan ten hoogste vijf procent van het aantal plaatsen per opleiding toewijzen aan
      gegadigden die na toepassing van het tweede lid in het bezit zijn van een bewijs van toelating voor dezelfde
      opleiding aan een andere universiteit dan die van de eerste voorkeur, indien dit een onbillijkheid van overwegende
      aard zou opleveren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57d
  - number: 7.57e.1
    text: |-
      Een instellingsbestuur kan een door hem te bepalen percentage van de opleidingsplaatsen van een opleiding toewijzen
      aan door hem zelf geselecteerde gegadigden die naar zijn oordeel beschikken over bijzondere kwalificaties. Dat
      percentage is aan een maximum gebonden, doordat:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.1.a
    text: |-
      in elk geval ten minste de helft van het aantal opleidingsplaatsen dient te worden toegewezen door toepassing van
      [artikel 7.57c, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57e.1.b
    text: |-
      op dat percentage tevens in mindering wordt gebracht het aantal gegadigden dat een bewijs van toelating ontvangt
      door toepassing van [artikel 7.57c, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57e.2
    text: Indien het instellingsbestuur toepassing geeft aan het eerste lid, maakt het
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.2.a
    text: de bijzondere kwalificaties die het in aanmerking wil nemen,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.2.b
    text: eventuele nadere selectiecriteria,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.2.c
    text: regels van administratieve aard, voorzover niet voortvloeiend uit het vierde lid,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.2.d
    text: het door hem te bepalen percentage, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.2.e
    text: |-
      de beslissing of gegadigden één, twee dan wel drie maal tot deelname aan de selectieprocedure zullen worden
      toegelaten, tijdig bekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.3
    text: Tot de bijzondere kwalificaties, bedoeld in het eerste en tweede lid, behoren niet de behaalde eindexamencijfers.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.4
    text: |-
      De gegadigde die in aanmerking wenst te komen voor de selectie, bedoeld in het eerste lid, wordt op zijn
      verzoek door de Informatie Beheer Groep aan het desbetreffende instellingsbestuur bekendgemaakt, mits hij aan de
      lotingsprocedure blijft deelnemen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
  - number: 7.57e.5
    text: |-
      In de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref1], worden nadere voorschriften opgenomen
      voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57e
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.1
    text: |-
      Indien krachtens [artikel 7.25][ref1] nadere vooropleidingseisen zijn gesteld, kan aan de selectieprocedure
      uitsluitend worden deelgenomen door degene die ten genoegen van de Informatie Beheer Groep het bewijs levert, dat
      door hem uiterlijk op een in de ministeriële regeling, bedoeld in [artikel 7.57a, vierde lid][ref2], te bepalen
      tijdstip aan die eisen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.2
    text: |-
      Indien na toepassing van het eerste lid blijkt dat bij een of meer instellingen die toepassing hebben gegeven
      aan [artikel 7.25, vierde lid, tweede volzin][ref1], nog plaatsen beschikbaar zijn, vindt, in afwijking
      van het eerste lid, alsnog selectie plaats van degenen die zich overeenkomstig het bepaalde krachtens
      [artikel 7.37, vierde lid][ref2], hebben aangemeld, doch niet voldoen aan de krachtens [artikel 7.25][ref3]
      gestelde nadere vooropleidingseisen. Deze selectie geschiedt met toepassing van [artikel 7.57c, eerste lid][ref4],
      en met overeenkomstige toepassing van de lotingsprocedure. In de ministeriële regeling, bedoeld in
      [artikel 7.57a, vierde lid][ref5], kunnen voor de toepassing van dit lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 7.57f.3
    text: |-
      Degene die heeft deelgenomen aan de lotingsprocedure voor een bepaalde opleiding en geen bewijs van toelating heeft
      verkregen, kan nadien nog ten hoogste twee maal aan de lotingsprocedure voor die opleiding deelnemen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57f
  - number: 7.57f.4
    text: |-
      Bij de toepassing van het tweede lid telt deelname aan de lotingsprocedure voor het studiejaar 1998–1999 of
      eerdere studiejaren niet mee. Bovendien telt deelname aan de lotingsprocedure voor het studiejaar 1999–2000 niet
      mee voor degene die voor dat studiejaar voor de eerste maal aan de lotingsprocedure voor dezelfde opleiding heeft
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57f
  - number: 7.57f.5
    text: |-
      Aan de selectieprocedure kan niet worden deelgenomen door degene die voor een opleiding is ingeschreven of in enig
      studiejaar was ingeschreven en inschrijving wenst voor dezelfde opleiding aan een andere instelling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57f
  - number: 7.57g
    text: |-
      In afwijking van de [artikelen 6:7][ref1] en [7:10 van de Algemene wet bestuursrecht][ref2] bedraagt de termijn
      twee weken voor het indienen van een bezwaarschrift tegen een besluit van de Informatie Beheer Groep inzake afgifte
      van een bewijs van toelating, onderscheidenlijk vier weken na ontvangst van het bezwaarschrift voor de beslissing
      van de Informatie Beheer Groep.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.57h
    text: |-
      Het instellingsbestuur kan voorschriften geven en maatregelen nemen met betrekking tot de goede gang van zaken
      in de gebouwen en terreinen van de instelling. Die maatregelen kunnen inhouden dat aan degene die de bedoelde
      voorschriften heeft overtreden, de toegang tot die gebouwen en terreinen geheel of gedeeltelijk voor de tijd van
      ten hoogste een jaar wordt ontzegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57h
  - number: 7.57i
    text: |-
      De onderwijs- en examenregelingen van de betreffende hogescholen en universiteiten regelen de wijze waarop aan
      degene die met goed gevolg het afsluitend examen, verbonden aan een verwante bacheloropleiding in het hoger
      beroepsonderwijs heeft afgelegd, door het instellingsbestuur ondersteuning wordt geboden ter bevordering van een
      goede doorstroming naar een verwante masteropleiding in het wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.57i
  - number: 7.58.1
    text: |-
      Degene die een getuigschrift als bedoeld in [artikel 7.11][ref1] wenst te verkrijgen, dient overeenkomstig door het
      instellingsbestuur vast te stellen regels een verzoek in, ertoe strekkende dat door dit bestuur wordt verklaard,
      dat het getuigschrift kan worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.58.2
    text: 'Bij het verzoek worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.58.2.a
    text: de bewijzen van met goed gevolg afgelegde tentamens,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.58.2.b
    text: |-
      het bewijs dat is voldaan aan de bij de onderwijs- en examenregeling gestelde verplichting betreffende het
      deelnemen aan praktische oefeningen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.58.2.c
    text: de desbetreffende bewijzen van inschrijving.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.58.3
    text: |-
      Ingeval de in het tweede lid bedoelde bewijzen van inschrijving niet worden overgelegd, kan het instellingsbestuur
      beslissen dat de verzochte verklaring wordt afgegeven, maar niet dan nadat het in verband met de inschrijving voor
      de desbetreffende onderwijseenheden verschuldigde collegegeld, examengeld onderscheidenlijk cursusgeld is voldaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.58.4
    text: |-
      Een examencommissie geeft geen getuigschrift af dan nadat het instellingsbestuur heeft verklaard dat het
      getuigschrift kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.58
  - number: 7.59.1
    text: Het instellingsbestuur stelt het studentenstatuut vast en maakt dit bekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.2
    text: |-
      Het instellingsbestuur reikt aan iedere student bij de eerste inschrijving voor een opleiding het studentenstatuut
      uit. Indien noodzakelijk reikt het instellingsbestuur ook bij inschrijving voor een volgend studiejaar het
      studentenstatuut uit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.3
    text: Het studentenstatuut omvat een opleidingsspecifiek deel en een instellingsspecifiek deel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4
    text: 'Het opleidingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4.a
    text: |-
      een beschrijving van de studieopbouw en de ondersteunende faciliteiten die de student door de instelling worden
      aangeboden, waaronder in ieder geval worden begrepen:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4.a.1°
    text: informatie over de opzet, organisatie en uitvoering van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4.a.2°
    text: de studentenvoorzieningen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4.a.3°
    text: de faciliteiten betreffende de studiebegeleiding,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.4.b
    text: |-
      de vastgestelde onderwijs- en examenregeling, bedoeld in [artikel 7.13, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.59.4.c
    text: |-
      een beschrijving van procedures die in aanvulling op de procedures, bedoeld in het vijfde lid onder *b* ten 2°, op
      de opleiding van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.5
    text: 'Het instellingsspecifiek deel bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.5.a
    text: |-
      een beschrijving van de rechten en verplichtingen van de studenten, voortvloeiende uit het bepaalde bij of
      krachtens de wet, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.5.b
    text: 'een overzicht van de regelingen die beogen de rechten van studenten te beschermen, waarin worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.5.b.1°
    text: |-
      een beschrijving van de procedures voor bezwaar en beroep binnen de instelling, alsmede van de beroepsrechten die
      kunnen worden ontleend aan deze wet en andere wettelijke regelingen, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.59.5.b.2°
    text: |-
      een beschrijving van aanvullende procedures ter bescherming van de rechten van studenten die door het
      instellingsbestuur worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.59
  - number: 7.60.1
    text: Elke instelling voor hoger onderwijs heeft een college van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
  - number: 7.60.2
    text: |-
      Het college van beroep heeft drie of vijf leden. Het aantal plaatsvervangende leden is niet groter dan het aantal
      leden. Het college houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
  - number: 7.60.3
    text: |-
      Het college kan besluiten kamers in te stellen. Indien het college daartoe besluit, bestaat het college uit ten
      minste zes en ten hoogste vijftien leden. Het aantal plaatsvervangende leden is niet groter dan het aantal leden.
      Elke kamer heeft drie of vijf leden. Zij houdt voltallig zitting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
  - number: 7.60.4
    text: |-
      De voorzitter, de plaatsvervangend voorzitter of voorzitters en de overige leden en de eventuele plaatsvervangende
      leden worden door het instellingsbestuur benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar
      of, voorzover het studenten betreft, voor een termijn van ten minste een en ten hoogste twee jaar. De leden en
      plaatsvervangende leden maken geen deel uit van het instellingsbestuur of van de inspectie. Buiten de voorzitter
      bestaat het college voor tenminste de helft uit docenten, onderscheidenlijk leden van de wetenschappelijke staf.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
  - number: 7.60.5
    text: |-
      De voorzitter en de plaatsvervangende voorzitter of voorzitters moeten voldoen aan de vereisten voor benoembaarheid
      tot rechterlijk ambtenaar, bedoeld in [artikel 1d van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 7.60.6
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van het college van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot
      ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.60
  - number: 7.61.1
    text: 'Een betrokkene kan beroep instellen bij het college van beroep voor de examens tegen:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
  - number: 7.61.1.a
    text: |-
      beslissingen als bedoeld in [de artikelen 7.8b, derde en vijfde lid][ref1], [7.9, eerste lid][ref2], en 16.6a,
      derde lid,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.b
    text: |-
      beslissingen inzake vaststelling van het aantal behaalde studiepunten als bedoeld in [artikel 7.9a][ref1], alsmede
      beslissingen inzake het met goed gevolg hebben afgelegd van het afsluitend examen, bedoeld in [artikel 7.9d][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.c
    text: |-
      beslissingen inzake de omvang van de vrijstelling, bedoeld in [artikel 7.31a, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.61.1.d
    text: |-
      beslissingen, niet zijnde besluiten van algemene strekking, genomen op grond van het bepaalde bij of krachtens
      [titel 2][ref1] van dit hoofdstuk, met het oog op de toelating tot examens,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.61.1.e
    text: |-
      beslissingen, genomen op grond van het aanvullend onderzoek, bedoeld in de [artikelen 7.25, vierde lid][ref1],
      en [7.28, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.f
    text: beslissingen van examencommissies en examinatoren,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
  - number: 7.61.1.g
    text: |-
      beslissingen van commissies als bedoeld in [artikel 7.29, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.61.1.h
    text: |-
      beslissingen, genomen op grond van de [artikelen 7.30a][ref1] en [7.30b][ref2] met het oog op de toelating tot de
      in dat artikel bedoelde opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.61.2
    text: |-
      Het beroep kan, wat de openbare instellingen betreft in afwijking van
      [hoofdstuk 7 van de Algemene wet bestuursrecht][ref1], worden ingesteld terzake dat een beslissing in strijd is met
      het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 7.61.3
    text: |-
      De termijn voor het indienen van het beroepschrift bedraagt, wat de openbare instellingen betreft in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref1], vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.61.4
    text: |-
      Alvorens het beroep in behandeling te nemen zendt het college van beroep het beroepschrift aan het
      orgaan waartegen het beroep is gericht, met uitnodiging om in overleg met betrokkenen na te gaan of een
      minnelijke schikking van het geschil mogelijk is, wat de openbare instellingen betreft in afwijking van
      [afdeling 7.3 van de Algemene wet bestuursrecht][ref1]. Ingeval het beroep is gericht tegen een beslissing van
      een examinator, geschiedt de in de voorgaande volzin bedoelde toezending aan de desbetreffende examencommissie.
      Het desbetreffende orgaan deelt binnen drie weken aan het college van beroep, onder overlegging van de daarop
      betrekking hebbende stukken, mede tot welke uitkomst het beraad heeft geleid. Is een minnelijke schikking niet
      mogelijk gebleken, dan wordt het beroepschrift door het college in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '7.3'
  - number: 7.61.5
    text: |-
      Het college van beroep beslist binnen tien weken na ontvangst van het beroepschrift, wat de openbare instellingen
      betreft in afwijking van [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.6
    text: |-
      Indien het college van beroep het beroep gegrond acht, vernietigt het de beslissing geheel of
      gedeeltelijk. Het college is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde
      beslissing een nieuwe beslissing te nemen, wat de openbare instellingen betreft in afwijking van
      [artikel 7:25 van de Algemene wet bestuursrecht][ref1]. Het kan bepalen dat opnieuw of, indien de beslissing is
      geweigerd, alsnog in de zaak wordt beslist, dan wel dat het tentamen, het examen, het toelatingsonderzoek, het
      aanvullend onderzoek of enig onderdeel daarvan opnieuw wordt afgenomen onder door het college van beroep te stellen
      voorwaarden. Het orgaan waarvan de beslissing is vernietigd, voorziet voorzover nodig opnieuw in de zaak met
      inachtneming van de uitspraak van het college van beroep. Het college kan daarvoor in zijn uitspraak een termijn
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.61.7
    text: |-
      Indien onverwijlde spoed dat vereist kan de voorzitter van het college van beroep een voorlopige
      voorziening treffen op verzoek van de indiener van het beroepschrift, onverminderd het bepaalde in
      [artikel 7.66, tweede lid][ref1], en [artikel 8:81 van de Algemene wet bestuursrecht][ref2]. De voorzitter beslist
      op dit verzoek na het desbetreffende orgaan dan wel de desbetreffende examinator te hebben gehoord, althans te
      hebben opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.61
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.62.1
    text: |-
      Het college van beroep voor de examens stelt een reglement van orde vast, waarin nadere regels worden gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.a
    text: de omvang en samenstelling van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.b
    text: indien nodig, de splitsing in kamers, alsmede de verdeling van de werkzaamheden over de verschillende kamers,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.c
    text: de zittingstermijn van de leden en eventuele plaatsvervangende leden van het college van beroep,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.d
    text: de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap van het college van beroep eindigt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.e
    text: |-
      de in [artikel 7.61, vierde lid][ref1], bedoelde procedure en de gevallen waarin deze procedure achterwege kan
      worden gelaten,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.62.1.f
    text: de wijze waarop in het secretariaat van het college van beroep wordt voorzien, alsmede
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.1.g
    text: de wijze waarop de voorzitter wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: 7.62.2
    text: Het reglement van orde alsmede wijzigingen daarvan, behoeven de instemming van het instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.62
  - number: '7.63'
    text: |-
      De organen en personeelsleden alsmede de examinatoren van de instelling verstrekken aan het college van beroep voor
      de examens de gegevens die dit college voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.63
  - number: 7.64.1
    text: Er is een college van beroep voor het hoger onderwijs, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.64
  - number: 7.64.2
    text: |-
      Het college van beroep heeft ten minste drie en ten hoogste zeven leden. Het aantal plaatsvervangende leden is niet
      groter dan het aantal leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.64
  - number: 7.64.3
    text: Het college van beroep houdt zitting in kamers van drie of vijf leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.64
  - number: 7.65.1
    text: |-
      De leden en de plaatsvervangende leden van het college van beroep voor het hoger onderwijs worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaar. De benoeming geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.65
  - number: 7.65.2
    text: |-
      De voorzitter van het college van beroep wordt bij koninklijk besluit aangewezen uit de leden. Bij verhindering
      of ontstentenis van de voorzitter wordt deze vervangen door een plaatsvervangende voorzitter overeenkomstig
      het in [artikel 7.66, derde lid][ref1], bedoelde reglement van orde. De leden en de plaatsvervangende
      leden moeten voldoen aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld in
      [artikel 1d van de Wet rechtspositie rechterlijke ambtenaren][ref2]. De voorzitter van een kamer wordt door het
      college van beroep aangewezen uit de leden. De tweede volzin is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.65
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 7.65.3
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van het college van beroep bij koninklijk besluit
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaren wordt hun bij koninklijk besluit ontslag
      verleend met ingang van de eerstvolgende maand. Zij worden bij koninklijk besluit ontslagen indien zij uit hoofde
      van ziekte of gebreken blijvend ongeschikt zijn hun functie te vervullen alsmede indien zij bij onherroepelijk
      geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het ontslag op grond van het in de
      voorgaande volzin bepaalde wordt verleend, wordt de betrokkene van het voornemen tot ontslag in kennis gesteld en
      wordt hem de gelegenheid geboden zich terzake te doen horen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.65
  - number: 7.65.4
    text: |-
      De toelage aan de voorzitter, de overige leden en de plaatsvervangende leden wordt vastgesteld bij koninklijk
      besluit, te nemen op gemeenschappelijke voordracht van Onze minister en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.65
  - number: 7.65.5
    text: |-
      Het college van beroep wordt bijgestaan door een bezoldigd secretaris, die bij koninklijk besluit wordt benoemd.
      Aan de secretaris kan Onze minister een of meer ambtenaren toevoegen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.65
  - number: 7.66.1
    text: |-
      Het college van beroep voor het hoger onderwijs oordeelt bij uitsluiting, voorzover niet op grond van
      [artikel 7.61, eerste lid][ref1], beroep openstaat op een college van beroep voor de examens, dan wel niet op grond
      van [artikel 7.68][ref2] beroep openstaat op een college van beroep voor het bijzonder onderwijs, over het beroep
      dat door een betrokkene is ingesteld tegen:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.66.1.a
    text: |-
      beslissingen genomen op grond van het bepaalde bij of krachtens [titel 2][ref1] van dit hoofdstuk met het oog op
      inschrijving,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.66.1.b
    text: |-
      beslissingen van het instellingsbestuur, genomen op grond van het bepaalde bij of krachtens [titel 3][ref1] van dit
      hoofdstuk, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '7'
  - number: 7.66.1.c
    text: |-
      beslissingen van het instellingsbestuur, genomen op grond van [artikel 17.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.66.2
    text: |-
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met uitzondering van
      [de artikelen 8:1, eerste en tweede lid][ref2], en [8:13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.66.3
    text: |-
      Het college van beroep stelt ten behoeve van zijn werkzaamheden een reglement van orde vast waarin in elk geval de
      splitsing in kamers en de verdeling van werkzaamheden voor de verschillende kamers worden geregeld alsmede de wijze
      waarop de voorzitter wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
  - number: 7.66.4
    text: Tegen uitspraken van het college van beroep staat generlei beroep open.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
  - number: 7.66.5
    text: |-
      De besturen van de instellingen verstrekken aan het college van beroep de gegevens die dit college voor de
      uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
  - number: 7.66.6
    text: |-
      Op het beroep op het college van beroep tegen een beslissing van een bijzondere instelling zijn de
      [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '7.67'
    text: |-
      Het griffierecht bedraagt € 38. [Artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.68.1
    text: |-
      Het bestuur van een bijzondere instelling voor hoger onderwijs kan, al dan niet in samenwerking met de besturen
      van een of meer andere bijzondere instellingen voor hoger onderwijs, een college van beroep instellen ter
      behandeling van de geschillen, bedoeld in [artikel 7.66, eerste lid][ref1], niet zijnde beslissingen als
      bedoeld in [artikel 7.61, eerste lid][ref2], dan wel zich aansluiten bij een dergelijk college. De beslissing
      waarbij een college van beroep wordt ingesteld, bevat tevens een regeling van de onderwerpen, genoemd in
      [artikel 7.62, eerste lid][ref3], alsmede van de rechtsgang bij het college. De beslissing waarbij een college van
      beroep wordt ingesteld, alsmede wijzigingen daarvan, dan wel een beslissing tot aansluiting bij een college wordt
      zo spoedig mogelijk ter kennis van Onze minister gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.68.2
    text: |-
      De artikelen 7.60, vierde lid eerste en tweede volzin, vijfde en zesde lid,
      [7.61, tweede, derde, vijfde, zesde en zevende lid][ref1], en [7.63][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7a.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.1
  - number: 7a.1.a
    text: 'instelling: een instelling als bedoeld in artikel 7a.2, en'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.1
  - number: 7a.1.b
    text: |-
      bekwaamheidsonderzoek: het onderzoek, bedoeld in artikel 176f van de Wet op het primair onderwijs, artikel 162i van
      de Wet op de expertisecentra of artikel 118o van de Wet op het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.1
  - number: 7a.2
    text: |-
      Dit hoofdstuk heeft betrekking op de bekostigde en ingevolge artikel 6.9 aangewezen instellingen voor hoger
      onderwijs die voldoen aan artikel 176g van de Wet op het primair onderwijs, artikel 162j van de Wet op de
      expertisecentra of artikel 118p van de Wet op het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.2
  - number: 7a.3
    text: |-
      Ten bewijze dat het bekwaamheidsonderzoek met goed gevolg is afgesloten, wordt door de examencommissie van een
      instelling die daarvoor het meest in aanmerking komt een getuigschrift bekwaamheidsonderzoek uitgereikt. Op het
      getuigschrift wordt vermeld, welke onderdelen het bekwaamheidsonderzoek omvatte en, in een voorkomend geval, welke
      bevoegdheid daaraan is verbonden, rekening houdend met artikel 7.6, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.3
  - number: 7a.4
    text: |-
      Ten bewijze dat de scholing, bedoeld in artikel 4.2.5 van de Wet educatie en beroepsonderwijs, ertoe heeft geleid
      dat betrokkene voldoet aan de in artikel 4.2.3, derde lid, onder a, van die wet bedoelde bekwaamheidseisen, wordt
      door de examencommissie van een instelling die daarvoor het meest in aanmerking komt een getuigschrift pedagogisch-
      didactische scholing uitgereikt. Op het getuigschrift wordt vermeld, welke onderdelen het onderzoek dat tot het
      getuigschrift leidde, omvatte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.4
  - number: 7a.5.1
    text: 'Degene die met goed gevolg het bekwaamheidsonderzoek heeft afgesloten, is gerechtigd tot het voeren van:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.5
  - number: 7a.5.1.a
    text: |-
      de titel doctorandus, afgekort tot drs., indien het betreft een bekwaamheidsonderzoek waarin kennis, inzicht en
      vaardigheden op het niveau van wetenschappelijk onderwijs zijn getoetst, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.5
  - number: 7a.5.1.b
    text: |-
      de titel baccalaureus, afgekort tot bc., indien het betreft een bekwaamheidsonderzoek waarin kennis, inzicht en
      vaardigheden op het niveau van hoger beroepsonderwijs zijn getoetst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.5
  - number: 7a.5.2
    text: De in het eerste lid genoemde titels worden, afgekort, voor de naam geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel7a.5
  - number: 8.1.1
    text: |-
      Met het oog op de samenwerking tussen twee of meer, in de bijlage van deze wet onder a tot en met h opgenomen
      instellingen kunnen de besturen van die instellingen een gemeenschappelijke regeling sluiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel8.1
  - number: 8.1.2
    text: De regeling omvat bepalingen omtrent wijziging, opheffing, toetreding en uittreding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel8.1
  - number: 8.1.3
    text: |-
      Bij de regeling kan een samenwerkingsinstituut worden ingesteld. De regeling omvat bepalingen omtrent de inrichting
      en het bestuur van het instituut, en omtrent het verstrekken van inlichtingen door het instituut aan de besturen
      van de deelnemende instellingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel8.1
  - number: 8.1.4
    text: |-
      De regeling kan voorzien in de overdracht van bepaalde bevoegdheden van organen van de deelnemende instellingen aan
      organen van een andere deelnemende instelling of aan organen van het samenwerkingsinstituut.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel8.1
  - number: 8.1.5
    text: |-
      Op de besluiten van het samenwerkingsinstituut, genomen krachtens enige door het bestuur van een openbare
      instelling overgedragen bevoegdheid zijn de wettelijke bepalingen omtrent schorsing en vernietiging van besluiten
      van dat bestuur krachtens de overgedragen bevoegdheid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel8.1
  - number: '9.1'
    text: Deze titel heeft betrekking op de openbare universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Het college van bestuur is belast met het bestuur van de universiteit in haar geheel en met het beheer daarvan,
      onverminderd de bevoegdheden van de raad van toezicht volgens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.2
  - number: 9.2.2
    text: |-
      Het college van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur
      zijn opgedragen, voorzover in dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.2
  - number: 9.2.3
    text: De voorzitter van het college van bestuur vertegenwoordigt de universiteit in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.2
  - number: 9.3.1
    text: Het college van bestuur bestaat uit ten hoogste drie leden, waaronder de rector magnificus van de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.2
    text: |-
      De leden van het college van bestuur worden door de raad van toezicht benoemd, geschorst en ontslagen. Bij de
      benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en
      vrouwen. De benoeming geschiedt voor een door de raad van toezicht te bepalen termijn. Met het einde van de maand
      waarin een lid de voor de openbare dienst geldende functionele leeftijdsgrens heeft bereikt, wordt hem eervol
      ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.3
    text: |-
      Alvorens tot benoeming of ontslag van een lid van het college van bestuur over te gaan, hoort de raad van toezicht
      vertrouwelijk de universiteitsraad of de ondernemingsraad en het orgaan binnen de universiteit dat op grond van
      de medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld, over het
      voorgenomen besluit tot benoeming of ontslag. [Titel 2][ref2] van dit hoofdstuk is niet van toepassing. Het horen
      geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.3.4
    text: De voorzitter van het college van bestuur wordt uit de leden door de raad van toezicht benoemd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.5
    text: |-
      In het bestuurs- en beheersreglement worden nadere regels gegeven omtrent de wijze van voordracht en benoeming van
      de rector magnificus.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.6
    text: Een lid van het college van bestuur kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.7
    text: 'Een lid van het college van bestuur kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.7.a
    text: lid van de raad van toezicht van de desbetreffende universiteit,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.7.b
    text: decaan van een faculteit of lid van het bestuur daarvan, tenzij een universiteit slechts een faculteit omvat,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.7.c
    text: |-
      lid van het bestuur van een opleiding, voorzover dat met toepassing van [artikel 9.17][ref1] is ingesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.3.7.d
    text: lid van de raad van toezicht of van het college van bestuur van een andere universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: 9.3.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.3
  - number: '9.4'
    text: |-
      Het college van bestuur stelt een bestuurs- en beheersreglement ter regeling van het bestuur, het beheer en de
      inrichting van de universiteit vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.4
  - number: '9.5'
    text: |-
      Het college van bestuur kan richtlijnen vaststellen met het oog op de organisatie en coördinatie van de uitoefening
      van de in [de artikelen 9.14, derde lid][ref1], en [9.15, eerste lid][ref2], bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.6.1
    text: Het college van bestuur is verantwoording verschuldigd aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.6
  - number: 9.6.2
    text: |-
      Het college van bestuur verstrekt de raad van toezicht de gevraagde inlichtingen betreffende zijn besluiten en
      andere handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.6
  - number: 9.6.3
    text: Het college van bestuur verstrekt Onze minister de gevraagde inlichtingen omtrent de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.6
  - number: 9.7.1
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
  - number: 9.7.2
    text: |-
      De voorzitter en de andere leden worden door Onze minister benoemd, geschorst en ontslagen. Bij de benoeming
      wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en vrouwen.
      Onze minister benoemt een lid dat in het bijzonder het vertrouwen geniet van de universiteitsraad, dan wel het
      vertrouwen geniet van de ondernemingsraad en het orgaan dat op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld, gezamenlijk. De benoeming geschiedt voor een periode
      van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.3
    text: |-
      Alvorens tot benoeming of ontslag van een lid van de raad van toezicht over te gaan, hoort Onze minister
      de universiteitsraad, dan wel de ondernemingsraad en het orgaan binnen de universiteit dat op grond van de
      medezeggenschapsregeling, bedoeld in [artikel 9.30, derde lid, tweede volzin][ref1], is ingesteld, vertrouwelijk
      over het door hem voorgenomen besluit tot benoeming of ontslag. [Titel 2][ref2] van dit hoofdstuk is niet
      van toepassing. Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan zijn op de
      besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.7
