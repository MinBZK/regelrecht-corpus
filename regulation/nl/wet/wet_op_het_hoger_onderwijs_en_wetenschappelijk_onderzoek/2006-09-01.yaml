  - number: 1.15.2
    text: |-
      De volgende bepalingen zijn met betrekking tot de academische ziekenhuizen bij de bijzondere universiteiten
      voorwaarden voor bekostiging van het bijzonder onderwijs:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.15
