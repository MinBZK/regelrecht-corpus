        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '1'
  - number: 1.12.4
    text: |-
      Voorzover het een opleiding in de godgeleerdheid dan wel een opleiding gericht op een godsdienstig of
      levensbeschouwelijk ambt aan een aangewezen instelling betreft, is in afwijking van het tweede lid voorwaarde, dat
      de desbetreffende instelling in acht neemt hetgeen is bepaald in het vijfde lid, alsmede hetgeen in deze wet is
      bepaald ten aanzien van de kwaliteitszorg en de registratie en dat het onderwijs wordt geregeld bij of krachtens
      de statuten, de akte of het reglement van de rechtspersoon met volledige rechtsbevoegdheid waarvan de instelling
      uitgaat.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
  - number: 1.12.5
    text: |-
      Het instellingsbestuur verstrekt Onze minister de nodige inlichtingen omtrent de instelling. Het instellingsbestuur
      doet Onze minister jaarlijks een verslag toekomen omtrent de werkzaamheden van de instelling en betrekt daarbij
      de uitkomsten van kwaliteitsbeoordeling als bedoeld in [artikel 1.18][ref1], alsmede andere gegevens omtrent de
      kwaliteit van de werkzaamheden van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.12a
    text: |-
      Aan de met goed gevolg afgelegde examens van opleidingen als bedoeld in [artikel 7.3b][ref1], verzorgd door
      rechtspersonen met volledige rechtsbevoegdheid, is een graad als bedoeld in artikel [7.10a][ref2] verbonden,
      voorzover aan die opleidingen accreditatie is verleend of die opleidingen de toets nieuwe opleiding met positief
      gevolg hebben ondergaan. Degenen aan wie een dergelijke graad is verleend, zijn gerechtigd in de daarvoor in
      aanmerking komende gevallen de graad Master, bedoeld in [artikel 7.10a][ref3], in de eigen naamsvermelding tot
      uitdrukking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel1.12a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
