      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 16.14.3
    text: |-
      Onze minister besluit op grond van welke opleidingen, verzorgd door het Internationaal Instituut voor Sociale
      Studiën, toegang tot de promotie kan worden verkregen. Het besluit wordt niet genomen dan nadat ten genoegen van
      Onze minister door het instellingsbestuur het bewijs is geleverd van voldoende kwaliteit van de desbetreffende
      onderwijsactiviteiten alsmede het bewijs dat wordt voldaan aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.14
  - number: 16.14.4
    text: |-
      Onze minister kan een besluit als bedoeld in het derde lid intrekken, indien gebleken is dat de kwaliteit van de
      desbetreffende onderwijsactiviteiten gedurende een reeks van jaren onvoldoende is geweest dan wel niet of niet meer
      voldaan wordt aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.14
  - number: 16.14.5
    text: |-
      Indien Onze minister voornemens is toepassing te geven aan het vierde lid, geeft hij een waarschuwing aan het
      instellingsbestuur, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en
      desgewenst overleg met hem dienaangaande kan plaatsvinden. De termijn waarbinnen aan de waarschuwing gevolg moet
      zijn gegeven, bedraagt ten minste drie maanden. Bij zijn besluit tot intrekking bepaalt Onze minister het tijdstip
      waarop de intrekking van kracht wordt, zodanig dat degenen die de voorbereiding van de promotie reeds ter hand
      hebben genomen, binnen redelijke termijn het doctoraat kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.14
  - number: 16.14.6
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het vierde lid, wordt opgeschort, totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.14
  - number: 16.15.1
    text: |-
      De bestuursraad van een openbare hogeschool dan wel het lichaam dat of de rechtspersoon die een openbare hogeschool
      in stand houdt, kan de instandhouding daarvan overdragen aan een ander lichaam dat of een andere rechtspersoon die
      daartoe bevoegd is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.15
  - number: 16.15.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij die akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van de gebouwen, terreinen en roerende zaken over te dragen. Die akte geldt tevens als akte van
      levering als bedoeld in [Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat het lichaam
      waaraan of de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aan de instelling
      aanstelt met ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.15
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: 16.15.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt het verkrijgende lichaam of de verkrijgende
      rechtspersoon in alle uit de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.15
  - number: 16.16.1
    text: |-
      De rechtspersoon die een bijzondere hogeschool in stand houdt, kan de instandhouding daarvan over dragen aan een
      andere rechtspersoon die voldoet aan [artikel 10.8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '4'
  - number: 16.16.2
    text: |-
      [Artikel 16.15, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.17.1
    text: |-
      Onze minister kan, al dan niet onder door hem te stellen voorwaarden, goedkeuren dat een openbare hogeschool of
      een uit ’s Rijks kas bekostigde bijzondere hogeschool wordt omgezet in een uit ’s Rijks kas bekostigde bijzondere
      hogeschool onderscheidenlijk een openbare hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.17
  - number: 16.17.2
    text: |-
      Onze minister kan goedkeuren dat een bekostigde hogeschool wordt gesplitst of een andere plaats van vestiging
      krijgt. Onze minister kan aan zijn goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.17
  - number: '16.18'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere hogeschool in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande, splitsende
      rechtspersoon de hogeschool in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van
      de hogeschool overgaat. In het laatste geval is [artikel 16.15, tweede en derde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.18
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.1
    text: |-
      In geval van een bestuursoverdracht als bedoeld in de [artikelen 16.15][ref1] en [16.16][ref2] worden het
      lichaam dat of de rechtspersoon die de desbetreffende hogeschool na de bestuursoverdracht in stand houdt, geacht
      met onmiddellijke ingang te zijn opgenomen in de bijlage van deze wet en wordt het lichaam of de rechtspersoon
      waardoor de bestuursoverdracht is verricht, geacht vanaf dat tijdstip niet langer in de bijlage van de wet te zijn
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.2
    text: |-
      In geval van omzetting, splitsing of verplaatsing van een hogeschool, in overeenstemming met [artikel 16.17][ref1],
      dan wel in geval van samenvoeging van twee of meer hogescholen worden de daaruit voortkomende hogescholen geacht
      met onmiddellijke ingang te zijn opgenomen in de bijlage van deze wet en worden de hogescholen waaruit zij
      voortkomen, geacht vanaf dat tijdstip niet langer in de bijlage te zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.3
    text: |-
      In geval van splitsing van een rechtspersoon en overgang van de instandhouding van een hogeschool als bedoeld
      in [artikel 16.18][ref1] wordt de rechtspersoon die de hogeschool na de splitsing in stand houdt, geacht met
      onmiddellijke ingang te zijn opgenomen in de bijlage van deze wet en wordt de rechtspersoon die de hogeschool voor
      de splitsing in stand hield, geacht vanaf dat tijdstip niet langer in die bijlage te zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '5'
  - number: 16.19.4
    text: |-
      In geval van opheffing van een openbare hogeschool of verlies van de aanspraak op bekostiging van een bijzondere
      hogeschool wordt deze hogeschool geacht met onmiddellijke ingang niet langer in de bijlage van deze wet te zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.19
  - number: 16.21.1
    text: 'Uit ’s Rijks kas wordt jaarlijks door Onze minister een bijdrage verleend aan:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.1.a
    text: |-
      het Rooms-katholiek kerkgenootschap in Nederland ten behoeve van de faculteit der godgeleerdheid van de
      bijzondere universiteit te Nijmegen, alsmede ten behoeve van de volgende krachtens [artikel 6.9][ref1] aangewezen
      universiteiten:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.21.1.a.1°
    text: |-
      de instelling van wetenschappelijk theologisch onderwijs, uitgaande van de Stichting Theologische Faculteit Tilburg
      te Tilburg, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.1.a.2°
    text: de Katholieke Theologische Universiteit te Utrecht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.1.b
    text: |-
      de Gereformeerde Kerken in Nederland ten behoeve van de krachtens [artikel 6.9][ref1] aangewezen Theologische
      Universiteit van de Gereformeerde Kerken in Nederland te Kampen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.21.1.c
    text: |-
      de Christelijk Gereformeerde Kerken in Nederland ten behoeve van de krachtens [artikel 6.9][ref1] aangewezen
      Theologische Universiteit der Christelijke Gereformeerde Kerken in Nederland te Apeldoorn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.21.2
    text: |-
      Uit ’s Rijks kas wordt jaarlijks door Onze minister een bijdrage verleend aan de Stichting Humanistisch Instituut
      voor wetenschappelijk onderwijs en onderzoek te Utrecht ten behoeve van de krachtens [artikel 6.9][ref1] aangewezen
      Universiteit voor Humanistiek te Utrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.21.3
    text: |-
      Uit ’s Rijks kas wordt jaarlijks door Onze minister een bijdrage verleend ten behoeve van de kerkelijke
      kweekscholen en seminaria tot opleiding van leraren van een kerkgenootschap of tot een ambtsopleiding, uitgaande
      van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.a
    text: het Nederlands-Israëlitisch Kerkgenootschap,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.b
    text: de Evangelisch-Lutherse Kerk,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.c
    text: de Remonstrantse Broederschap,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.d
    text: de Algemeen Doopsgezinde Sociëteit,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.e
    text: de Oud-Katholieke Kerk,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.f
    text: de Unie van Baptisten Gemeenten in Nederland, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.3.h
    text: de Nederlands Hervormde Kerk.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.4
    text: |-
      Bij algemene maatregel van bestuur wordt de omvang van de rijksbijdrage, bedoeld in het eerste, tweede en derde
      lid, uitgedrukt in een percentage van de netto-exploitatielasten, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
  - number: 16.21.5
    text: |-
      Op de inschrijving van studenten aan een universiteit, voorzover het een opleiding betreft ten
      behoeve waarvan krachtens het eerste dan wel tweede lid een rijksbijdrage wordt verleend, zijn de
      [artikelen 7.37, tweede lid][ref1], [7.43][ref2], [7.48][ref3] en [7.49][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '16.22'
    text: |-
      Uit ’s Rijks kas wordt jaarlijks door Onze minister een bijdrage verleend ten behoeve van de leerstoelen die na de
      inwerkingtreding van de hoger-onderwijswet 1876 vanwege de Nederlands Hervormde Kerk tot het opleiden van leraren
      of ambtsdragers voor dat kerkgenootschap bij een openbare universiteit zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel16.22
  - number: '17.2'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip is [artikel 7.43, tweede lid][ref1], niet van toepassing op
      de student die valt onder artikel V van de wet van 29 mei 1991 (Stb. 281), en is deze student aan collegegeld
      verschuldigd het in [artikel 7.43, eerste lid][ref2], bedoelde, krachtens het vierde lid van dat artikel
      vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '17.3'
    text: |-
      Voor de toepassing van [artikel 7.51][ref1] wordt tot een bij koninklijk besluit te bepalen tijdstip met
      een student als bedoeld in het [eerste lid, onder c, van dat artikel][ref2], gelijkgesteld een student als
      bedoeld in [artikel VI van de wet van 28 maart 1996 ][ref3](Stb. 226), zoals dit artikel is gewijzigd bij de
      [wet van 28 maart 1996][ref4] (Stb. 227).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007971#ArtikelVI
      [ref4]: https://wetten.overheid.nl/BWBR0007972
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007971
        artikel: VI
      - id: ref4
        bwb_id: BWBR0007972
  - number: '17.4'
    text: |-
      Personeel van niet bekostigde ingevolge deze wet aangewezen hogescholen dat op grond van artikel B2, eerste lid,
      onder b, van de Algemene burgerlijke pensioenwet, zoals deze bepaling luidde bij inwerkingtreding van deze wet, de
      ambtenarenstatus verworven heeft, is onder dezelfde voorwaarden met ingang van 1 januari 1996 overheidswerknemer
      in de zin van [artikel 2 van de Wet privatisering ABP][ref1] en behoudt voor zolang dat dienstverband voortduurt
      die status.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.4
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: '17.7'
    text: |-
      In afwijking van [artikel 7.4, tweede lid][ref1], zoals dat artikellid luidde op 31 augustus 1998, kunnen
      tot een bij koninklijk besluit te bepalen tijdstip aan een bekostigde of aangewezen instelling voor hoger
      onderwijs opleidingen met een studielast van minder dan 168 studiepunten worden verzorgd, voorzover deze op
      31 augustus 1998 aan die instelling zijn verbonden. Op deze opleidingen en de daarvoor ingeschreven studenten
      en extraneï blijven de voorschriften van deze wet en de daarop gebaseerde uitvoeringsregelingen van toepassing.
      [Artikel 6.5, tweede lid][ref2], zoals dat artikellid luidde op 31 augustus 1998, is van overeenkomstige toepassing
      met ingang van het tijdstip, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: '17.8'
    text: |-
      Tot een bij koninklijk besluit te bepalen datum blijven voor het personeel, bedoeld in
      [artikel 2.18, derde lid][ref1], in de nieuwe functie de regelingen met betrekking tot de rechtspositie zoals
      die op 31 juli 1999 voor dat personeel golden van overeenkomstige toepassing, met uitzondering van de bepalingen
      die zien op de inhoud van de functie die zij op die datum bekleedden, met dien verstande dat die overeenkomstige
      toepassing in elk geval eindigt op de datum waarop door de educatieve voorziening en de daarvoor in aanmerking
      komende personeelsorganisaties anders is overeengekomen. In de nieuwe functie geldt een carrièrepatroon en een
      maximumsalaris dat ten minste gelijk is aan het carrièrepatroon en het maximumsalaris dat behoorde bij de functie
      die het personeelslid op 31 juli 1999 bekleedde aan de in [artikel 2.18, derde lid][ref2], bedoelde school.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 17.9.1
    text: |-
      Onze minister zendt binnen drie jaren nadat [artikel 7.57e][ref1] van toepassing is geworden aan de Staten-Generaal
      een verslag over de doeltreffendheid en de effecten in de praktijk van de [wet van 3 april 1999][ref2] (Stb. 170).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010384
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0010384
  - number: 17.9.2
    text: |-
      [Artikel 7.57c, vierde lid][ref1], vervalt op een bij koninklijk besluit te bepalen tijdstip. Dit tijdstip kan niet
      zijn gelegen vóór het tijdstip waarop twee maanden zijn verstreken sedert de datum waarop het verslag, bedoeld in
      het eerste lid, aan de Staten-Generaal is aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 4a
  - number: 17.10.1
    text: |-
      Onverminderd [artikel 7.51][ref1] treft het instellingsbestuur van een universiteit of hogeschool een
      financiële voorziening ten aanzien van een student die op grond van een van de [artikelen 10.7][ref2] of
      [10.8 van de Wet studiefinanciering 2000][ref3] geen aanspraak kan maken op studiefinanciering op de voet van
      [hoofdstuk 3 van die wet][ref4], indien de student naar het oordeel van het instellingsbestuur door bijzondere
      omstandigheden het bij of krachtens de [artikelen 10.6 tot en met 10.8 van de Wet studiefinanciering 2000][ref5]
      bepaalde resultaat niet heeft behaald. Deze financiële voorziening is zodanig dat de betrokkene niet in een
      slechtere financiële situatie wordt gebracht dan wanneer hij studiefinanciering zou hebben genoten zonder
      toepassing van [artikel 10.6 van de Wet studiefinanciering 2000][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0011453#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011453#Artikel10
