        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.15.1.i
    text: |-
      het sluiten van een gemeenschappelijke regeling ten behoeve van een of meer opleidingen met een of meer decanen van
      andere faculteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.15
  - number: 9.15.2
    text: |-
      De decaan oefent het recht tot voordracht, bedoeld in [artikel 7.19, tweede lid][ref1], uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 9.15.3
    text: |-
      In het bestuurs- en beheersreglement worden regels gesteld omtrent de bevoegdheid, bedoeld in het eerste lid, onder
      i.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.15
  - number: '9.16'
    text: |-
      De decaan is verantwoording verschuldigd aan het college van bestuur. Hij verstrekt het college de gevraagde
      inlichtingen omtrent de faculteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.16
  - number: 9.17.1
    text: |-
      De decaan voorziet in een meerhoofdig bestuur van elke opleiding die in de faculteit is ingesteld. In afwijking van
      de eerste volzin kan volstaan worden met een opleidingsdirecteur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.17
  - number: 9.17.2
    text: Indien in een meerhoofdig bestuur wordt voorzien, maakt daarvan een student deel uit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.17
  - number: 9.17.3
    text: In het faculteitsreglement worden nadere regels gesteld omtrent het bestuur van de opleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.17
  - number: 9.17.4
    text: Een lid van het bestuur van de opleiding kan niet tevens lid zijn van de opleidingscommissie van die opleiding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.17
  - number: 9.17.5
    text: |-
      Voor de toepassing van dit artikel kan onder opleiding mede worden begrepen een bacheloropleiding en een of meer
      daarop aansluitende masteropleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.17
  - number: 9.18.1
    text: 'Voor elke opleiding wordt een opleidingscommissie ingesteld. De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
  - number: 9.18.1.a
    text: |-
      advies uit te brengen over de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 9.18.1.b
    text: het jaarlijks beoordelen van de wijze van uitvoeren van de onderwijs- en examenregeling, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
  - number: 9.18.1.c
    text: |-
      het desgevraagd of uit eigen beweging advies uitbrengen aan het bestuur van de opleiding, bedoeld in
      [artikel 9.17, eerste lid][ref1], en de decaan over alle aangelegenheden betreffende het onderwijs in de
      desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.18.2
    text: |-
      Op een advies als bedoeld in het eerste lid, is [artikel 9.35][ref1], aanhef en onderdelen *b* en *c*, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.18.3
    text: |-
      In het faculteitsreglement wordt de wijze van benoeming en samenstelling van de opleidingscommissie geregeld, met
      dien verstande dat de helft van het totaal aantal leden van de commissie voortkomt uit de voor de desbetreffende
      opleiding ingeschreven studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
  - number: 9.18.4
    text: |-
      Indien een faculteit slechts een opleiding omvat, kan het faculteitsreglement bepalen dat de taken en bevoegdheden
      van de opleidingscommissie worden uitgeoefend door de faculteitsraad, bedoeld in [artikel 9.37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.18.5
    text: |-
      Voor de toepassing van dit artikel kan onder opleiding mede worden begrepen een bacheloropleiding en een of meer
      daarop aansluitende masteropleidingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.18
  - number: 9.19.1
    text: |-
      Tot het personeel van de universiteit behoren in elk geval de hoogleraren. In het benoemingsbesluit wordt vermeld
      het wetenschapsgebied waarop de hoogleraar zijn onderwijs- en onderzoektaken uitoefent.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.19
  - number: 9.19.2
    text: |-
      De hoogleraren zijn bij uitstek verantwoordelijk voor de ontwikkeling van het hun toegewezen wetenschapsgebied
      en voor de inhoud van het te geven onderwijs op dat gebied, onverminderd de bevoegdheid van het bestuur van de
      opleiding, bedoeld in [artikel 9.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.19.3
    text: Eervol ontslagen hoogleraren behouden nog gedurende vijf jaren na hun ontslag het recht als promotor op te treden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.19
  - number: 9.19.4
    text: |-
      De hoogleraren zijn gerechtigd de titel professor te voeren. De oud-hoogleraren aan wie om gezondheidsredenen,
      wegens vrijwillig vervroegd uittreden dan wel bij of na het bereiken van de voor de openbare dienst geldende
      functionele leeftijdsgrens eervol ontslag als hoogleraar is verleend, zijn eveneens gerechtigd deze titel te
      voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.19
  - number: 9.20.1
    text: |-
      In het faculteitsreglement kunnen binnen de faculteit onderzoekinstituten en onderzoekscholen worden ingesteld. De
      decaan regelt het bestuur en de inrichting van deze onderzoekinstituten en onderzoekscholen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.20
  - number: 9.20.2
    text: |-
      In het faculteitsreglement worden regels gesteld omtrent het bestuur en beheer van onderzoekinstituten en
      onderzoekscholen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.20
  - number: 9.21.1
    text: |-
      In het bestuurs- en beheersreglement kunnen binnen de universiteit onderzoekinstituten en onderzoekscholen worden
      ingesteld waarop [artikel 9.20][ref1] niet van toepassing is. Het college van bestuur regelt het bestuur, beheer en
      de inrichting van deze onderzoekinstituten en onderzoekscholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.21.2
    text: |-
      In het bestuurs- en beheersreglement kan een faculteit worden aangewezen waarvan de decaan de bevoegdheden
      uitoefent die bij of krachtens deze wet met betrekking tot een onderzoekinstituut of onderzoekschool aan het
      college van bestuur zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.21
  - number: 9.22.1
    text: |-
      In het faculteitsreglement kan worden bepaald dat het bestuur van een onderzoekinstituut of onderzoekschool als
      bedoeld in [artikel 9.20][ref1] gedurende een tijdvak van ten hoogste vijf jaar met beheerstaken wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.22.2
    text: |-
      In het bestuurs- en beheersreglement kan door het college van bestuur worden bepaald dat het bestuur van een
      onderzoekinstituut of onderzoekschool als bedoeld in [artikel 9.21][ref1] gedurende een tijdvak van ten hoogste
      vijf jaar met beheerstaken wordt belast. Het besluit van het college van bestuur behoeft de instemming van de
      decanen van de desbetreffende faculteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.22.3
    text: |-
      Indien het tweede lid toepassing heeft gevonden, stelt het college van bestuur jaarlijks de financiële middelen ter
      beschikking aan het bestuur van het onderzoekinstituut of de onderzoekschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.22
  - number: 9.23.1
    text: |-
      Een onderzoekinstituut of onderzoekschool tussen twee of meer universiteiten wordt in overeenstemming met de
      decanen van de betrokken faculteiten ingesteld bij gemeenschappelijke regeling als bedoeld in [artikel 8.1][ref1].
      Daarin kan de bepaling worden opgenomen dat het bestuur van het onderzoekinstituut of de onderzoekschool met
      beheerstaken wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.23.2
    text: |-
      Indien het eerste lid toepassing heeft gevonden, stellen de colleges van bestuur jaarlijks de financiële middelen
      ter beschikking aan het bestuur van het onderzoekinstituut of de onderzoekschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.23
  - number: 9.24.1
    text: |-
      De besluiten van de decaan kunnen door het college van bestuur worden vernietigd. In geval van schorsing kan, in
      afwijking van [artikel 10:44, derde lid, van de Algemene wet bestuursrecht][ref1], deze schorsing niet langer dan
      vier maanden duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 9.24.2
    text: |-
      Het eerste lid is niet van toepassing op een besluit van de decaan betreffende de benoeming van leden van de
      commissies, bedoeld in [artikel 9.15, eerste lid onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.24.3
    text: |-
      De besluiten van de examencommissie kunnen door het college van bestuur worden vernietigd. Schorsing of
      vernietiging kan, in afwijking van [artikel 10:38, tweede lid, van de Algemene wet bestuursrecht][ref1],
      uitsluitend plaatsvinden, voorzover tegen de desbetreffende besluiten geen beroep krachtens
      deze wet openstaat of heeft opengestaan. In geval van schorsing kan, in afwijking van
      [artikel 10:44, derde lid, van de Algemene wet bestuursrecht][ref2], deze schorsing niet langer dan vier maanden
      duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 9.27.1
    text: |-
      Ingeval van verwaarlozing of in strijd met de wet functioneren van het bestuur van een faculteit of een deel
      daarvan treft het college van bestuur, zo nodig met afwijking van de paragrafen 2 en 3 van deze titel en paragraaf
      2 van titel 2, voor een door het college van bestuur te bepalen tijdvak van ten hoogste één jaar de voorzieningen
      die het noodzakelijk oordeelt. Het college doet hiervan onverwijld mededeling aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.27
  - number: 9.27.2
    text: |-
      De voorzieningen vervallen, indien zij niet binnen drie weken na de ontvangst van de mededeling van het college van
      bestuur door de raad van toezicht zijn bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.27
  - number: 9.28.1
    text: |-
      Het faculteitsreglement bepaalt op welke wijze aan een groep van studenten de gelegenheid wordt geboden bij de
      decaan hun beklag te doen terzake van de naleving van verplichtingen van de universiteit jegens studenten, zomede
      binnen welke termijn de decaan voorzieningen treft in de gevallen waarin naar zijn oordeel het beklag gegrond is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.28
  - number: 9.28.2
    text: |-
      Het beklag, bedoeld in het eerste lid, evenals de op grond daarvan door de decaan getroffen voorzieningen laten
      onverlet de rechten die een belanghebbende ingevolge de wet heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.28
  - number: '9.29'
    text: Deze titel heeft betrekking op de openbare universiteiten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.29
  - number: 9.30.1
    text: 'Het college van bestuur besluit:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.1.a
    text: |-
      dat de [Wet op de ondernemingsraden][ref1] met uitzondering van [hoofdstuk VII B][ref2] van toepassing is op de
      universiteit, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: 9.30.1.b
    text: dat de onder a bedoelde wet niet van toepassing is op de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.2
    text: |-
      Een besluit als bedoeld in het eerste lid kan telkens opnieuw worden genomen, doch niet eerder dan nadat vijf jaren
      zijn verstreken sedert het van kracht worden van het vorige besluit terzake.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.3
    text: |-
      Het besluit, bedoeld in het eerste lid aanhef en onderdeel a, stelt de paragrafen 1 tot en met 6 van deze
      titel buiten werking voor de desbetreffende universiteit. Dit besluit gaat gepaard aan de vaststelling door het
      college van bestuur van een medezeggenschapsregeling ten behoeve van de studenten binnen de universiteit en haar
      faculteiten, die ten minste gelijkwaardig is aan het bepaalde in de paragrafen 1 tot en met 5 van deze titel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.4
    text: |-
      Ten gevolge van het besluit, bedoeld in het eerste lid aanhef en onderdeel *b*, zijn de paragrafen 1 tot en met 6
      van deze titel van toepassing op de desbetreffende universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.5
    text: |-
      In het geval dat het eerste lid aanhef en onderdeel a toepassing heeft gevonden, behoeft het college van bestuur
      de voorafgaande instemming van de ondernemingsraad voor het door het college van bestuur te nemen besluit met
      betrekking tot de keuze uit de medezeggenschapsstelsels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
  - number: 9.30.6
    text: |-
      De commissie voor geschillen, bedoeld in [artikel 9.39][ref1], neemt kennis van geschillen op verzoek van het
      college van bestuur, indien het college van bestuur ten aanzien van een, na overleg al dan niet gewijzigd, te
      nemen besluit dat ingevolge het vijfde lid, instemming behoeft, de vereiste instemming niet heeft verworven en
      het college van bestuur zijn voorstel wenst te handhaven. De [artikelen 9.40, derde en vijfde lid][ref2], en
      [9.41][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.30a.1
    text: |-
      Indien een besluit als bedoeld in [artikel 9.30, eerste lid onderdeel a][ref1], is genomen, is er aan een
      universiteit een gezamenlijke vergadering verbonden. Van deze vergadering maken deel uit de leden van de
      ondernemingsraad en de leden van het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in
      [artikel 9.30, derde lid tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.30a.2
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van de gezamenlijke vergadering voor elk door het
      college van bestuur te nemen besluit met betrekking tot de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
  - number: 9.30a.2.a
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.30a.2.b
    text: |-
      de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18, eerste lid][ref1],
      alsmede het voorgenomen beleid in het licht van de uitkomsten van de kwaliteitsbeoordeling, bedoeld in
      [artikel 2.9, tweede lid, tweede volzin][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.30a.2.c
    text: |-
      het bestuurs- en beheersreglement, bedoeld in [artikel 9.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.30a.3
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een reglement voor
      de gezamenlijke vergadering vast. [Artikel 9.34, tweede lid en derde lid aanhef en onderdelen f en g][ref1], is
      van overeenkomstige toepassing. In het reglement kunnen worden geregeld de aangelegenheden waarover de gezamenlijke
      vergadering, onverminderd het tweede lid, instemmingsrecht heeft. In het reglement wordt, indien de aantallen leden
      van de ondernemingsraad en het orgaan, bedoeld in het eerste lid, niet gelijk zijn, tevens geregeld de wijze waarop
      voor beide geledingen wordt voorzien in gelijke invloed op de besluitvorming binnen de gezamenlijke vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.30a.4
    text: |-
      De commissie voor geschillen, bedoeld in [artikel 9.39][ref1], neemt kennis van geschillen op verzoek van het
      college van bestuur, indien het college van bestuur ten aanzien van een, na overleg al dan niet gewijzigd, te nemen
      besluit dat ingevolge het tweede of derde lid, instemming behoeft, de vereiste instemming niet heeft verworven
      en het college van bestuur zijn voorstel wenst te handhaven. De [artikelen 9.40, derde en vijfde lid][ref2], en
      [9.41][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.30a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.31.1
    text: Aan een universiteit is een universiteitsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.2
    text: Het aantal leden van de raad bedraagt ten hoogste vierentwintig leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.3
    text: |-
      De raad bestaat voor de helft uit leden die door en uit het personeel worden gekozen, en voor de helft uit leden
      die door en uit de studenten worden gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.4
    text: |-
      Zij die deel uitmaken van het college van bestuur of de raad van toezicht dan wel belast zijn met de functie van
      decaan van een faculteit, kunnen niet tevens lid zijn van de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.5
    text: |-
      Kandidaten voor de verkiezingen van het deel van de raad dat uit en door het personeel wordt gekozen, kunnen worden
      gesteld door personeelsleden en door organisaties van personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.6
    text: |-
      De verkiezing van de leden van de raad geschiedt bij geheime schriftelijke stemming. Stemming voor een geleding van
      de raad vindt slechts plaats, indien het aantal kandidaat-leden van een geleding groter is dan het aantal zetels
      ten behoeve van die geleding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.31.7
    text: |-
      De raad stelt een reglement op voor de zaken van huishoudelijke aard en regelt tevens de wijze waarop door het
      college van bestuur beschikbaar gestelde middelen voor die raad en de eventuele faculteitsraden en commissies als
      bedoeld in [artikel 9.47][ref1] worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.31.8
    text: |-
      De raad kiest al dan niet uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.31
  - number: 9.32.1
    text: |-
      Het college van bestuur stelt de universiteitsraad ten minste twee maal per jaar in de gelegenheid de algemene
      gang van zaken in de universiteit met hem te bespreken. Het college van bestuur en de raad komen met elkaar bijeen,
      indien daarom onder opgave van redenen wordt verzocht door het college van bestuur, de raad, het deel van de raad
      dat uit en door het personeel is gekozen, of het deel van de raad dat uit en door de studenten is gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.2
    text: |-
      De raad is bevoegd over alle aangelegenheden de universiteit betreffende aan het college van bestuur voorstellen
      te doen en standpunten kenbaar te maken. Het college van bestuur brengt op de voorstellen, bedoeld in de eerste
      volzin, binnen drie maanden een schriftelijke, met redenen omklede reactie uit aan de raad in de vorm van een
      voorstel. Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie, stelt het college
      van bestuur de raad ten minste eenmaal in de gelegenheid met hem overleg te plegen over zijn voorstel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.3
    text: De raad bevordert naar vermogen openheid, openbaarheid en onderling overleg in de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.4
    text: |-
      De raad waakt voorts in de universiteit in het algemeen tegen discriminatie op welke grond dan ook en
      bevordert in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede de inschakeling van
      gehandicapten en allochtonen. Het reglement voor de raad, bedoeld in [artikel 9.34][ref1], bepaalt of de raad
      een overeenkomstige bevoegdheid bezit als bedoeld in [artikel 12, tweede lid aanhef en onderdeel ][ref2].
      In dat geval is [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref3]
      van overeenkomstige toepassing voor wat betreft het onderscheid, bedoeld in die wet of in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003299#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0003299
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 9.32.5
    text: |-
      Het college van bestuur verstrekt de raad aan het begin van het studiejaar schriftelijk de basisgegevens met
      betrekking tot de samenstelling van het college van bestuur, de raad van toezicht, de organisatie binnen de
      universiteit en de hoofdpunten van het reeds vastgestelde beleid. Het college van bestuur stelt de raad ten
      minste eenmaal per jaar schriftelijk in kennis van het door hem in het afgelopen jaar gevoerde beleid en van
      de beleidsvoornemens voor het komende jaar ten aanzien van de universiteit op financieel, organisatorisch en
      onderwijskundig gebied. Het college van bestuur stelt de raad onverwijld in kennis van voornemens met betrekking
      tot de aangelegenheden, beschreven in het instellingsplan. Voorts verschaft het college van bestuur de raad, al dan
      niet gevraagd, tijdig alle inlichtingen die deze voor de vervulling van zijn taak redelijkerwijze nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.6
    text: |-
      Indien bij een bepaalde vergadering of een onderdeel daarvan een bij uitstek persoonlijk belang van een van de
      leden van de raad in het geding is, kan de raad bepalen dat het betrokken lid aan die vergadering of dat onderdeel
      daarvan niet deelneemt. De raad bepaalt dan tevens dat de behandeling van de desbetreffende aangelegenheid in een
      besloten vergadering plaats heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.7
    text: |-
      De raad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      universiteit betrokkenen van het verslag kennis kunnen nemen. De raad draagt er zorg voor dat de agenda’s en
      verslagen van de vergaderingen van de raad worden toegezonden aan het college van bestuur, aan de faculteitsraden
      en aan de eventuele commissies, bedoeld in [artikel 9.47][ref1], en ter inzage worden gelegd op een algemeen
      toegankelijke plaats op de universiteit ten behoeve van belangstellenden. De raad stelt de in de vorige volzin
      bedoelde commissies ten minste eenmaal per jaar in de gelegenheid om over aangelegenheden die de desbetreffende
      commissie in het bijzonder aangaan, met hem overleg te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.32.8
    text: |-
      Het college van bestuur draagt er jegens de raad zorg voor dat de leden van de raad niet uit hoofde van hun
      lidmaatschap daarvan worden benadeeld in hun positie met betrekking tot de universiteit. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van kandidaat-leden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: 9.32.9
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een aan de universiteit werkzame persoon mag geen
      verband houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van
      de betrokkene van de raad. Een beëindiging van de betrekking in strijd met het in dit lid bepaalde is nietig.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.32
  - number: '9.33'
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van de universiteitsraad voor elk door het college van
      bestuur te nemen besluit met betrekking tot ten minste de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
  - number: 9.33.a
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.33.b
    text: |-
      de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18, eerste lid][ref1],
      alsmede het voorgenomen beleid in het licht van de uitkomsten van de kwaliteitsbeoordeling, bedoeld in
      [artikel 2.9, tweede lid tweede volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.33.c
    text: |-
      het studentenstatuut, bedoeld in [artikel 7.59][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 9.33.d
    text: |-
      het bestuurs- en beheersreglement, bedoeld in [artikel 9.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.33.e
    text: regels op het gebied van de arbeidsomstandigheden,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
  - number: 9.33.f
    text: |-
      de keuze uit medezeggenschapsstelsels, bedoeld in [artikel 9.30, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.33.g
    text: |-
      het beleid van het instellingsbestuur bij de toepassing van [artikel 7.51][ref1], en de regels, bedoeld in het
      vijfde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.34.1
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij of krachtens deze titel, een reglement
      voor de universiteitsraad vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.2
    text: |-
      Het college van bestuur legt het reglement, daaronder elke wijziging ervan mede begrepen, als voorstel aan de raad
      voor en stelt het niet vast dan voorzover het voorstel de instemming van twee derden van het aantal leden van de
      raad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3
    text: 'In het reglement worden ten minste geregeld:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.a
    text: |-
      de aangelegenheden waarover de raad, onverminderd [artikel 9.33][ref1], instemmingsrecht heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.34.3.b
    text: |-
      de aangelegenheden waarover de raad adviesrecht heeft, met dien verstande dat de raad ten minste adviesrecht wordt
      toegekend inzake aangelegenheden die het voortbestaan en de goede gang van zaken binnen de universiteit betreffen,
      alsmede inzake de begroting,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.c
    text: het aantal leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.d
    text: de wijze en organisatie van de verkiezingen van de leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.e
    text: de zittingsduur van de leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.f
    text: de wijze waarop het college van bestuur informatie verschaft aan de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.g
    text: |-
      de termijnen binnen welke tot instemming of onthouding van instemming dient te worden besloten, en de termijnen
      binnen welke advies dient te worden uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.h
    text: de bevoegdheden die door de faculteitsraden worden uitgeoefend,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: 9.34.3.i
    text: |-
      de toekenning aan het deel van de raad dat uit en door het personeel is gekozen, van de bevoegdheden inzake de
      arbeidsomstandigheden die krachtens de [Arbeidsomstandighedenwet 1998][ref1] en de algemene maatregel van bestuur
      op grond van [artikel 16 van die wet ][ref2]aan de medezeggenschapsraad zijn toegekend,


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '16'
  - number: 9.34.3.j
    text: |-
      de toekenning aan de raad van een overeenkomstige bevoegdheid als bedoeld in
      [artikel 12, tweede lid aanhef en onderdeel d, van de Algemene wet gelijke behandeling][ref1], waarbij dan
      [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref2] van overeenkomstige toepassing
      is,


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel21
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '21'
  - number: 9.34.3.k
    text: |-
      de toekenning aan de raad of het deel van de raad dat uit en door het personeel is gekozen, van de bevoegdheden
      inzake de arbeidsomstandigheden in de universiteit voorzover deze niet betreffen te nemen besluiten van het college
      van bestuur, bedoeld in [artikel 9.33 onderdeel e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.34.3.l
    text: |-
      welke van de geschillen tussen het college van bestuur en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen, bedoeld in [artikel 9.39][ref1], wie het geschil
      aanhangig kan maken en of daarbij de commissie om bemiddeling dan wel een oordeel wordt verzocht, voorzover de
      commissie voor geschillen in haar reglement daarvoor de mogelijkheid biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.34.4
    text: |-
      In het reglement kan, indien dit bevorderlijk is voor een goede toepassing van deze titel, worden bepaald dat
      een of meer groepen van personen die anders dan krachtens publiekrechtelijke aanstelling of op grond van een
      arbeidsovereenkomst dan wel anders dan op grond van een inschrijving als student of extraneus aan de universiteit
      zijn verbonden, worden aangemerkt als personeelsleden onderscheidenlijk studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.34
  - number: '9.35'
    text: |-
      Indien een te nemen besluit op grond van het bepaalde in het reglement van de universiteitsraad, krachtens
      [artikel 9.34, derde lid onderdeel b][ref1], vooraf voor advies dient te worden voorgelegd aan de raad, draagt het
      college van bestuur er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.35.a
    text: advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de besluitvorming,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.35
  - number: 9.35.b
    text: de raad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.35
  - number: 9.35.c
    text: |-
      de raad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte advies
      gevolg wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.35
  - number: 9.35.d
    text: |-
      de raad, indien het college van bestuur het advies niet of niet geheel wil volgen, in de gelegenheid wordt gesteld
      nader overleg met hem te voeren alvorens het besluit definitief wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.35
  - number: 9.36.1
    text: |-
      Het college van bestuur behoeft de voorafgaande instemming van het deel van de universiteitsraad dat uit en door
      het personeel is gekozen, voor elk door het college van bestuur te nemen besluit met betrekking tot aangelegenheden
      van algemeen belang voor de bijzondere rechtstoestand van het personeel in de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.36
  - number: 9.36.2
    text: |-
      Indien het college van bestuur op grond van het eerste lid voor een te nemen besluit de voorafgaande instemming van
      het deel van de universiteitsraad dat uit en door het personeel is gekozen, behoeft, wordt het deel van de raad dat
      uit en door de studenten wordt gekozen, in de gelegenheid gesteld over het besluit advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.36
  - number: 9.36.3
    text: |-
      Het instemmingsrecht of adviesrecht in aangelegenheden als bedoeld in het eerste en tweede lid wordt niet
      uitgeoefend, voorzover de desbetreffende aangelegenheid voor de universiteit reeds inhoudelijk is geregeld in een
      bij of krachtens de wet gegeven voorschrift of een collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.36
  - number: 9.37.1
    text: Indien een universiteit meer dan een faculteit omvat, is aan elke faculteit een faculteitsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.37
  - number: 9.37.2
    text: |-
      De faculteitsraad oefent tegenover de decaan van de faculteit het instemmingsrecht en het adviesrecht uit die
      toekomen aan de universiteitsraad, voorzover het aangelegenheden betreft die de faculteit in het bijzonder aangaan
      en de desbetreffende bevoegdheden tevens aan de decaan zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.37
  - number: 9.37.3
    text: |-
      [Artikel 9.31, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.37.4
    text: |-
      Indien een universiteit slechts een faculteit omvat, worden de taken en bevoegdheden van de faculteitsraad
      uitgeoefend door de universiteitsraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.37
  - number: 9.37.5
    text: |-
      De personeelsgeleding van de faculteitsraad oefent tegenover de decaan van de faculteit de rechten uit, bedoeld
      in [artikel 9.50][ref1], voorzover het aangelegenheden betreft die de faculteit in het bijzonder aangaan en de
      desbetreffende bevoegdheden tevens aan de decaan zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.37
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '6'
  - number: '9.38'
    text: |-
      De decaan behoeft de voorafgaande instemming van de faculteitsraad voor elk door hem te nemen besluit met
      betrekking tot ten minste de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.38
  - number: 9.38.a
    text: |-
      het faculteitsreglement, bedoeld in [artikel 9.14][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.38
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.38.b
    text: |-
      de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref1], met uitzondering van de onderwerpen,
      genoemd in het tweede lid, onder a tot en met g, met uitzondering van de aanwijzing, bedoeld in het derde
      lid, en met uitzondering van de eisen, bedoeld in de [artikelen 7.30a, derde lid, derde volzin][ref2], en
      [7.30b, eerste lid, derde volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.38
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.38a
    text: |-
      [Artikel 9.32, eerste, tweede, vijfde, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.38a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.38b
    text: |-
      In het faculteitsreglement worden ten minste geregeld de onderwerpen, genoemd in
      [artikel 9.34, derde lid onderdelen c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.38b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.39.1
    text: Er is een commissie voor geschillen inzake universitaire medezeggenschapsaangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.39
  - number: 9.39.2
    text: |-
      De commissie voor geschillen bestaat uit drie leden en drie plaatsvervangende leden, waarvan een lid en een
      plaatsvervangend lid worden gekozen door de colleges van bestuur en een lid en een plaatsvervangend lid door de
      universiteitsraden. Deze twee leden kiezen het derde lid, tevens voorzitter, en diens plaatsvervanger. De leden en
      plaatsvervangende leden worden gekozen voor een termijn van vier jaar en zijn een keer herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.39
  - number: 9.39.3
    text: |-
      De leden en de plaatsvervangende leden mogen niet deel uitmaken van een college van bestuur, een raad van toezicht,
      het bestuur van een faculteit, het bestuur van een opleiding, een universiteitsraad of een faculteitsraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.39
  - number: 9.40.1
    text: 'De commissie voor geschillen neemt kennis van geschillen in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
  - number: 9.40.1.a
    text: |-
      op verzoek van het college van bestuur, indien het college van bestuur ten aanzien van een, na overleg al dan
      niet gewijzigd, te nemen besluit dat ingevolge de [artikelen 9.33][ref1] en [9.34, derde lid onderdeel a][ref2],
      instemming behoeft, de vereiste instemming niet heeft verworven en het college van bestuur zijn voorstel wenst
      te handhaven,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.1.b
    text: |-
      op verzoek van het college van bestuur of van de universiteitsraad, indien het college van bestuur ten aanzien van
      de inhoud van het reglement voorzover aangegeven in [artikel 9.34, derde lid][ref1], geheel of gedeeltelijk niet de
      vereiste instemming heeft verworven,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.1.c
    text: |-
      op verzoek van de universiteitsraad, indien het college van bestuur een besluit heeft genomen waarover ingevolge
      de toepassing van [artikel 9.34, derde lid onderdeel b][ref1], advies door de raad is uitgebracht, het college
      van bestuur daarbij het uitgebrachte advies niet of niet geheel volgt en de raad van oordeel is dat daardoor de
      belangen van de universiteit of de belangen van de raad ernstig worden geschaad, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.1.d
    text: |-
      op verzoek van het college van bestuur of van de universiteitsraad, indien het college van bestuur en de raad van
      mening verschillen over de interpretatie van het bepaalde bij of krachtens deze titel dan wel het bepaalde in het
      reglement, bedoeld in [artikel 9.34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.40.2
    text: |-
      De commissie kan in haar reglement bepalen dat zij kennis neemt van andere geschillen tussen het college van
      bestuur en de raad dan bedoeld in het eerste lid. [Artikel 9.41, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.40.3
    text: |-
      Indien er een geschil is tussen het college van bestuur en de universiteitsraad, meldt het college van bestuur
      dan wel de universiteitsraad dit geschil aan bij de raad van toezicht. Het college van bestuur dan wel de
      universiteitsraad legt het geschil voor aan de commissie voor geschillen, tenzij de raad van toezicht van
      oordeel is dat het geschil kan worden opgelost zonder tussenkomst van de commissie voor geschillen en dat oordeel
      gepaard doet gaan aan een voorstel ter oplossing van het geschil, waar zowel het college van bestuur als de
      universiteitsraad mee instemt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
  - number: 9.40.4
    text: |-
      Indien er een geschil is tussen de decaan en een faculteitsraad, meldt de decaan dan wel de faculteitsraad dit
      geschil aan bij het college van bestuur. Het college van bestuur legt het geschil voor aan de commissie voor
      geschillen, tenzij het college van bestuur van oordeel is dat het geschil kan worden opgelost zonder tussenkomst
      van de commissie voor geschillen en dat oordeel gepaard doet gaan aan een voorstel ter oplossing van het geschil,
      waar zowel de decaan als de faculteitsraad mee instemt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
  - number: 9.40.5
    text: |-
      Een uitspraak van de commissie voor geschillen, bedoeld in [artikel 9.41][ref1], wordt voor de toepassing van
      [afdeling 7.1 van de Algemene wet bestuursrecht][ref2] gelijkgesteld met een besluit, genomen in administratief
      beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.40
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '7.1'
  - number: 9.41.1
    text: |-
      Indien aan een te nemen besluit van het college van bestuur instemming, vereist ingevolge [artikel 9.33][ref1] of
      het reglement, bedoeld in [artikel 9.34][ref2], is onthouden, deelt het college van bestuur binnen drie maanden
      aan de universiteitsraad mede of het voorstel wordt ingetrokken dan wel wordt voorgelegd aan de commissie voor
      geschillen. Indien deze mededeling niet binnen drie maanden wordt gedaan, vervalt het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.41
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.41.2
    text: |-
      Het college van bestuur doet een verzoek als bedoeld in [artikel 9.40, eerste lid onderdeel a][ref1], onder
      overlegging van de door het college van bestuur gemaakte afweging van de belangen die daarbij voor het college van
      bestuur onderscheidenlijk de raad of het betrokken deel daarvan aan de orde zijn. De commissie stelt de raad of het
      betrokken deel daarvan in de gelegenheid om zijn argumenten voor het onthouden van zijn instemming bij de commissie
      naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.41
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.41.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het college van bestuur en de raad voor te leggen, tenzij het
      college van bestuur dan wel de raad of het betrokken deel daarvan te kennen geven daarop geen prijs te stellen.
      Indien de commissie van deze bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van
      het college van bestuur alsmede de instemming van de raad of het betrokken deel daarvan, beoordeelt de commissie
      of het college van bestuur bij afweging van de betrokken belangen in redelijkheid tot zijn voorstel heeft kunnen
      komen. De uitspraak van de commissie is bindend voor het college van bestuur en de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.41
  - number: 9.42.1
    text: |-
      Voorzover aan een voorstel van het college van bestuur tot vaststelling of wijziging van het reglement, bedoeld
      in [artikel 9.34][ref1], wat onderwerpen betreft als bedoeld in het derde lid van dat artikel, de instemming
      die is vereist ingevolge het tweede lid van dat artikel is onthouden, deelt het college van bestuur aan de
      universiteitsraad dan wel de raad aan het college van bestuur binnen drie maanden mede, of het voorstel wordt
      voorgelegd aan de commissie voor geschillen. Indien een dergelijke mededeling niet binnen drie maanden wordt
      gedaan, vervalt het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.42
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.42.2
    text: |-
      Indien het college van bestuur een verzoek doet als bedoeld in [artikel 9.40, eerste lid onderdeel b][ref1], is
      [artikel 9.41, tweede lid][ref2], van overeenkomstige toepassing. Indien de raad een verzoek doet als bedoeld
      in [artikel 9.40, eerste lid onderdeel b][ref3], wordt het verzoek met redenen omkleed en stelt de commissie het
      college van bestuur in de gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.42
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.42.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het college van bestuur en de raad voor te leggen, tenzij
      het college van bestuur dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van
      deze bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van het college van bestuur
      alsmede de instemming van de raad, beoordeelt de commissie of het college van bestuur bij afweging van de betrokken
      belangen in redelijkheid tot zijn voorstel heeft kunnen komen. De commissie geeft, voorzover zij van oordeel is
      dat het college van bestuur bij afweging van de betrokken belangen niet in redelijkheid tot zijn voorstel heeft
      kunnen komen, in haar uitspraak aan hoe het voorstel dient te worden gewijzigd. Na de uitspraak van de commissie
      stelt het college van bestuur het reglement, bedoeld in [artikel 9.34][ref1], vast overeenkomstig de uitspraak van
      de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.42
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.43.1
    text: |-
      Indien het college van bestuur een besluit neemt waarbij het een advies van de universiteitsraad, vereist ingevolge
      [artikel 9.34, derde lid onderdeel b][ref1], niet of niet geheel volgt, wordt de uitvoering van het besluit
      opgeschort met vier weken, tenzij de raad tegen onmiddellijke uitvoering van het besluit geen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.43.2
    text: |-
      De universiteitsraad doet een verzoek als bedoeld in [artikel 9.40, eerste lid onderdeel c][ref1], binnen vier
      weken nadat het betrokken besluit door het college van bestuur is genomen, onder overlegging van de argumenten voor
      zijn advies en de argumenten voor zijn oordeel dat door het niet of niet geheel volgen van het advies de belangen
      van de universiteit of van de raad ernstig worden geschaad. De commissie voor geschillen stelt het college van
      bestuur in de gelegenheid om zijn argumenten voor het niet of niet geheel volgen van het advies van de raad bij
      de commissie naar voren te brengen. De behandeling van het verzoek verlengt de opschorting, bedoeld in het eerste
      lid, niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.43.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het college van bestuur en de raad voor te leggen, tenzij
      het college van bestuur dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van het college van bestuur en
      van de raad, beoordeelt de commissie of het college van bestuur bij het niet of niet geheel volgen van het advies
      van de raad:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
  - number: 9.43.3.a
    text: |-
      gehandeld heeft in strijd met het bepaalde bij of krachtens deze titel of het reglement, bedoeld in
      [artikel 9.34][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.43.3.b
    text: onvoldoende gemotiveerd heeft waarom is afgeweken van het advies van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
  - number: 9.43.3.c
    text: onzorgvuldig gehandeld heeft ten opzichte van de raad, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
  - number: 9.43.3.d
    text: bij de afweging van de betrokken belangen in redelijkheid niet tot het besluit heeft kunnen komen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
  - number: 9.43.4
    text: De commissie doet vervolgens de bindende uitspraak of het betrokken besluit al dan niet in stand kan blijven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.43
  - number: '9.44'
    text: |-
      Op een verzoek als bedoeld in [artikel 9.40, eerste lid onderdeel d][ref1], doet de commissie voor geschillen de
      bindende uitspraak welke interpretatie aan het bepaalde bij of krachtens deze titel dan wel het bepaalde in het
      reglement, bedoeld in [artikel 9.34][ref2], dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.44
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '9.45'
    text: |-
      Indien in het reglement, bedoeld in [artikel 9.34][ref1], ingevolge de toepassing van het derde lid onderdeel l
      van dat artikel, geschillen worden aangegeven en indien het reglement van de commissie voor geschillen daarvoor
      de mogelijkheid biedt, kunnen deze geschillen aan de commissie worden voorgelegd overeenkomstig het daaromtrent
      bepaalde in het reglement, bedoeld in [artikel 9.34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.45
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.46.1
    text: |-
      De universiteitsraad kan in rechte optreden, indien de vordering strekt tot naleving door het college van bestuur
      van de verplichtingen jegens de raad, voortvloeiend uit deze titel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.46
  - number: 9.46.2
    text: |-
      In afwijking van [artikel 8:75 van de Algemene wet bestuursrecht][ref1] kan de raad niet in de proceskosten worden
      veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9.46.3
    text: |-
      De raad treedt op verzoek van een commissie als bedoeld in [artikel 9.47][ref1] op, indien de rechten van die
      commissie specifiek aan de orde zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.46
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.47.1
    text: |-
      Het college van bestuur stelt het personeel en de studenten in de gelegenheid om desgewenst onderscheidenlijk een
      personeelscommissie dan wel afzonderlijke commissies voor onderscheiden personeelscategorieën of -groeperingen, en
      een studentencommissie in te stellen. Een dergelijke commissie is bevoegd desgevraagd of eigener beweging advies
      uit te brengen aan de universiteitsraad over die aangelegenheden die de desbetreffende commissie in het bijzonder
      aangaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.47
  - number: 9.47.2
    text: |-
      Op verzoek van een commissie stelt de universiteitsraad het college van bestuur in kennis van een schriftelijk
      advies als bedoeld in het eerste lid. [Artikel 9.32, tweede lid derde volzin][ref1], is ten aanzien van een
      dergelijk schriftelijk advies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.47
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.48.1
    text: |-
      Het college van bestuur staat de universiteitsraad het gebruik toe van de voorzieningen waarover het kan
      beschikken, en die de raad voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.48
  - number: 9.48.2
    text: |-
      Het college van bestuur stelt de leden van de universiteitsraad in de gelegenheid om gedurende een door het college
      van bestuur en de raad gezamenlijk vast te stellen hoeveelheid tijd de scholing te ontvangen die de leden van
      de raad voor de vervulling van hun taak nodig hebben. Het personeel van de universiteit wordt in de gelegenheid
      gesteld deze scholing in werktijd en met behoud van salaris te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.48
  - number: 9.48.3
    text: |-
      Dit artikel is van overeenkomstige toepassing op de faculteitsraden met dien verstande dat de decaan in de plaats
      treedt van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.48
  - number: '9.49'
    text: |-
      De paragrafen 1 tot en met 4 van deze titel zijn van overeenkomstige toepassing op de onderzoekinstituten en
      onderzoekscholen waarvan ingevolge [artikel 9.23][ref1] het bestuur is belast met de beheerstaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.50.1
    text: |-
      Indien in het bestuurs- en beheersreglement wordt bepaald dat er bij een universiteit centrale diensten zijn,
      worden door het college van bestuur, met inachtneming van de bij of krachtens algemene maatregel van bestuur
      gegeven voorschriften, een of meer dienstraden ingesteld ten behoeve van het personeel dat bij die diensten
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2
    text: |-
      Het college van bestuur voorziet er in dat een dienstraad tijdig in de gelegenheid wordt gesteld advies aan het
      hoofd van de desbetreffende dienst uit te brengen en overleg te voeren over voorgenomen maatregelen met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2.a
    text: de wijze waarop de arbeids- en dienstvoorwaarden bij een centrale dienst worden toegepast,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2.b
    text: de wijze waarop het algemeen personeelsbeleid bij een centrale dienst wordt uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2.c
    text: aangelegenheden op het gebied van de arbeidsomstandigheden in verband met de arbeid in een centrale dienst,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2.d
    text: de organisatie en werkwijze binnen een centrale dienst, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.2.e
    text: de technische en economische dienstuitvoering bij een centrale dienst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.3
    text: |-
      De dienstraad is bevoegd het hoofd van de desbetreffende dienst voorstellen te doen met betrekking tot de in het
      tweede lid genoemde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.4
    text: |-
      Het hoofd van de desbetreffende dienst behoeft de voorafgaande instemming van de dienstraad voor elke maatregel die
      hij bevoegd is te treffen en waarover de dienstraad op grond van het tweede lid heeft geadviseerd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50.5
    text: |-
      Het college van bestuur stelt, in overeenstemming met de dienstraad, een reglement vast in verband met de
      uitoefening van de rechten, bedoeld in het tweede, derde en vierde lid. Het reglement bevat in elk geval een
      geschillenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50
  - number: 9.50a.1
    text: |-
      Op verzoek van de raad van toezicht kan Onze minister onder door hem te stellen voorwaarden toestaan dat, al dan
      niet voor een bepaald tijdvak, wordt afgeweken van een of meer onderdelen van [titel 1][ref1] of [titel 2][ref2].
      Het college van bestuur toont aan in geval van afwijking van [titel 1][ref3] dat is voorzien in een doelmatige
      bestuursorganisatie, dan wel toont aan in geval van afwijking van [titel 2][ref4] dat is voorzien in een doelmatige
      vorm van medezeggenschap voor personeel en studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.50a.2
    text: |-
      Indien het eerste lid toepassing heeft gevonden, wordt de afwijkende regeling in het bestuurs- en beheersreglement
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.50a
  - number: 9.51.1
    text: |-
      De besturen van de verenigingen met volledige rechtsbevoegdheid of stichtingen, waarvan de in de bijlage van deze
      wet onder b opgenomen universiteiten uitgaan, zijn verplicht elke wijziging van de statuten van de vereniging of
      stichting zo spoedig mogelijk ter kennis van Onze minister te brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.51
  - number: 9.51.2
    text: |-
      Onverminderd [artikel 1.9, vierde tot en met zesde lid][ref1], stellen de in het eerste lid bedoelde besturen
      regelen vast inzake het bestuur en de inrichting van en de medezeggenschap binnen hun universiteit. Bij de
      vaststelling van die regelen alsmede bij wijziging daarvan worden de [titels 1][ref2] en [2][ref3] van dit
      hoofdstuk in acht genomen voorzover de eigen aard van de bijzondere universiteit zich daartegen naar het oordeel
      van het bestuur niet verzet. In die regelen wordt bepaald welke faculteit of faculteiten de universiteit omvat. Zij
      brengen die regelen alsmede wijzigingen daarvan zo spoedig mogelijk ter kennis van Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.51.3
    text: |-
      De regelen alsmede de wijzigingen daarvan, bedoeld in het tweede lid, worden geacht te voldoen aan de in
      [artikel 1.9, derde lid, onder h][ref1], bedoelde voorwaarde, indien Onze minister niet binnen drie maanden
      na de ontvangst van de mededeling aan het bestuur heeft verklaard van oordeel te zijn, dat het bestuur bij de
      vaststelling van de regelen of de wijziging daarvan op door hem aan te wijzen punten de[ titels 1][ref2] en
      [2][ref3] van dit hoofdstuk niet in acht heeft genomen en daartoe in redelijkheid geen beroep heeft kunnen doen op
      de eigen aard van de bijzondere universiteit die zich tegen inachtneming daarvan zou verzetten, of dat onvoldoende
      aannemelijk heeft gemaakt. Binnen drie maanden wordt het bezwaar ondervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.51
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: 9.51.4
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het derde lid, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.51
  - number: 9.51.5
    text: De besturen verstrekken aan Onze minister de nodige inlichtingen omtrent de universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.51
  - number: 9.52.1
    text: |-
      De hoogleraren aan de bij het in werking treden van de wet van 28 april 1876 (*Stb.* 102) bestaande kerkelijke
      kweekscholen en seminaria tot opleiding van leraren voor enig kerkgenootschap of kwekelingen voor de geestelijke
      stand alsmede zij, die een na die inwerkingtreding vanwege de Nederlandse Hervormde Kerk tot hetzelfde doel
      gevestigde leerstoel bekleden, hebben, voorzover die kweekscholen, seminaria of leerstoelen op 1 januari 1904 waren
      gevestigd in gemeenten waar een rijksuniversiteit is, tot het einde van de maand waarin zij de voor de openbare
      dienst geldende functionele leeftijdsgrens hebben bereikt, toegang met raadgevende stem in de vergaderingen van de
      examencommissies van de faculteit die het onderwijs in opleidingen in de godgeleerdheid verzorgt. Bij de examens
      in die faculteit mogen zij examineren in de door hen onderwezen vakken. De hoogleraren aan de op 1 september 1986
      te Amsterdam gevestigde kerkelijke kweekscholen en seminaria tot opleiding van leraren voor enig kerkgenootschap
      of kwekelingen voor de geestelijke stand alsmede zij, die een op dat tijdstip vanwege de Nederlandse Hervormde Kerk
      tot hetzelfde doel te Amsterdam gevestigde leerstoel bekleden, hebben dezelfde rechten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.52
  - number: 9.52.2
    text: |-
      De kerkelijke hoogleraren kunnen onder door het college van bestuur te stellen voorwaarden gebruikmaken van de
      collegelokalen, inrichtingen, verzamelingen en hulpmiddelen voor het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.52
  - number: 9.52.3
    text: |-
      Op de kerkelijke hoogleraren is [artikel 9.19, derde en vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.52
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '9.53'
    text: |-
      Het college van bestuur van een openbare universiteit kan, na raadpleging van het college voor promoties, bedoeld
      in [artikel 9.10][ref1], een rechtspersoon met volledige rechtsbevoegdheid bevoegd verklaren bij die universiteit
      een bijzondere leerstoel te vestigen. Het besluit vermeldt de faculteit waarbij en het wetenschapsgebied waarin
      door de bijzondere hoogleraar onderwijs zal worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.53
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.54.1
    text: |-
      De bevoegdverklaring geschiedt op een daartoe strekkend verzoek van het bestuur van de rechtspersoon met volledige
      rechtsbevoegdheid. In het bestuurs- en beheersreglement wordt bepaald op welke wijze een verzoek dient te worden
      ingericht en welke bescheiden bij het verzoek dienen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.54
  - number: 9.54.2
    text: |-
      Het in het voorgaande lid bedoelde bestuur geeft het college van bestuur de nodige inlichtingen omtrent de door het
      eerstbedoelde bestuur gevestigde leerstoel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.54
  - number: 9.55.1
    text: |-
      Om als bijzonder hoogleraar onderwijs te kunnen geven wordt vereist dat aan betrokkene de graad Doctor is verleend
      door een universiteit, bedoeld in [artikel 1.2, onder a of b][ref1], of door de Open Universiteit, dat betrokkene
      in het bezit is van een doctoraat, verkregen aan een zodanige instelling, dan wel dat betrokkene in het bezit is
      van een bewijs dat de aanstelling door het college van bestuur is bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.55
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.55.2
    text: |-
      De bekrachtiging wordt geacht te zijn verleend, indien binnen acht weken na de ontvangst der aanvraag daarop geen
      beslissing is genomen. Door het college van bestuur kan deze termijn tot ten hoogste vier maanden worden verlengd.
      De bekrachtiging kan slechts bij een met redenen omkleed besluit worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.55
  - number: 9.55.3
    text: |-
      Het bestuur van de rechtspersoon met volledige rechtsbevoegdheid geeft van elke aanstelling van een hoogleraar
      binnen vier weken kennis aan het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.55
  - number: '9.56'
    text: |-
      Het onderwijs, gegeven door een bijzonder hoogleraar, is te allen tijde voor hen, die gerechtigd zijn het onderwijs
      aan de universiteiten bij te wonen, toegankelijk.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.56
  - number: 9.57.1
    text: |-
      De bijzonder hoogleraar kan, onder door het college van bestuur te stellen voorwaarden, gebruikmaken van de
      collegelokalen, inrichtingen, verzamelingen en hulpmiddelen voor het onderwijs.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.57
  - number: 9.57.2
    text: |-
      De bijzonder hoogleraar heeft toegang met raadgevende stem tot de vergaderingen van de examencommissies van de
      faculteit waarbij hij is aangesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.57
  - number: 9.57.3
    text: |-
      Met het einde van de maand, waarin een bijzonder hoogleraar de voor de openbare dienst geldende functionele
      leeftijdsgrens heeft bereikt, wordt hem eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.57
  - number: 9.57.4
    text: |-
      Op de bijzonder hoogleraar is [artikel 9.19, derde en vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.57
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '9.58'
    text: |-
      De in [artikel 9.53][ref1] bedoelde bevoegdverklaring wordt door het college van bestuur, na raadpleging van het
      college voor promoties, bedoeld in [artikel 9.10][ref2], ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.58
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.58.a
    text: indien het bij of krachtens deze paragraaf bepaalde niet langer wordt nagekomen;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.58
  - number: 9.58.b
    text: |-
      indien de bijzonder hoogleraar het onderwijs veronachtzaamt dan wel zonder goede grond dit onderwijs gedurende een
      vol jaar heeft onderbroken;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.58
  - number: 9.58.c
    text: |-
      indien het belang van het wetenschappelijk onderwijs zich ten gevolge van wijzigingen in de omstandigheden met de
      bevoegdverklaring niet langer verdraagt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.58
  - number: '9.59'
    text: |-
      Op een bijzondere leerstoel bij de faculteit die het onderwijs in opleidingen in de godgeleerdheid verzorgt zijn de
      [artikelen 9.54, tweede lid][ref1], en [9.55][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel9.59
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '10.1'
    text: Dit hoofdstuk heeft betrekking op de in de bijlage van deze wet opgenomen hogescholen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Elke hogeschool, met uitzondering van de hogescholen met rechtspersoonlijkheid, heeft hetzij een centrale directie
      hetzij een college van bestuur. Een centrale directie dan wel een college van bestuur bestaat uit ten hoogste
      drie leden, waarvan er een door het instellingsbestuur wordt benoemd tot voorzitter. Bij de benoeming wordt zoveel
      mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Een lid van een centrale directie, onderscheidenlijk college van bestuur kan niet tezelfdertijd lid zijn van een
      centrale directie of college van bestuur van een tweede hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.2
  - number: 10.2.3
    text: |-
      De centrale directie heeft onder verantwoordelijkheid van het instellingsbestuur de leiding van de voorbereiding en
      de uitvoering van het beleid van de hogeschool alsmede de coördinatie van de dagelijkse gang van zaken en van het
      beheer van de hogeschool. Het college van bestuur is belast met de taken en bevoegdheden van de centrale directie
      alsmede met de door het instellingsbestuur aan het college overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.2
  - number: 10.3.1
    text: |-
      Het instellingsbestuur van een hogeschool als bedoeld in [artikel 10.2][ref1], kan hem bij wettelijk voorschrift
      opgedragen taken en bevoegdheden overdragen aan een alsdan in de plaats van de centrale directie in te stellen
      college van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.3.2
    text: |-
      Het college van bestuur van een hogeschool als bedoeld in [artikel 10.2][ref1], kan hem bij wettelijk voorschrift
      opgedragen of door het instellingsbestuur overgedragen taken en bevoegdheden overdragen aan het bestuur van een
      faculteit of het bestuur van een andere organisatorische eenheid als bedoeld in [artikel 10.3a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.3a
    text: |-
      Het instellingsbestuur kan bij bestuursreglement een of meer faculteiten of andere organisatorische eenheden
      instellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3a
  - number: 10.3b.1
    text: 'Het instellingsbestuur stelt een bestuursreglement vast. In het bestuursreglement wordt ten minste vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.1.a
    text: |-
      de taken en bevoegdheden welke het instellingsbestuur overdraagt aan het college van bestuur, indien het
      instellingsbestuur toepassing heeft gegeven aan [artikel 10.3, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.3b.1.b
    text: de richtlijnen voor de uitoefening van de aan het college van bestuur overgedragen taken en bevoegdheden,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.1.c
    text: |-
      nadere regels met betrekking tot het sluiten van een gemeenschappelijke regeling als bedoeld in
      [hoofdstuk 8][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '8'
  - number: 10.3b.1.d
    text: 'indien de hogeschool faculteiten of andere organisatorische eenheden omvat:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.1.d.1°
    text: |-
      welke bevoegdheden het college van bestuur heeft overgedragen aan het faculteitsbestuur of het
      bestuur van de desbetreffende eenheid, indien het college van bestuur toepassing heeft gegeven aan
      [artikel 10.3, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.3b.1.d.2°
    text: |-
      de verhouding van het bestuur van de desbetreffende eenheid tot het instellingsbestuur, het college van bestuur of
      de centrale directie,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.1.d.3°
    text: welke faculteiten of andere organisatorische eenheden de desbetreffende hogeschool omvat,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.1.d.4°
    text: welke opleidingen in die faculteiten of organisatorische eenheden zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.2
    text: |-
      Indien de hogeschool faculteiten of andere organisatorische eenheden omvat, worden bij of krachtens het
      bestuursreglement de samenstelling en de werkwijze van het faculteitsbestuur of het bestuur van de desbetreffende
      eenheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3b.3
    text: |-
      Het instellingsbestuur zendt het bestuursreglement, alsmede elke wijziging daarvan, zo spoedig mogelijk aan Onze
      minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3b
  - number: 10.3c.1
    text: |-
      Voor elke opleiding wordt een opleidingscommissie ingesteld, behoudens het bepaalde in het vierde lid. De commissie
      heeft tot taak:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
  - number: 10.3c.1.a
    text: advies uit te brengen over de onderwijs- en examenregeling alvorens het instellingsbestuur de regeling vaststelt,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
  - number: 10.3c.1.b
    text: het jaarlijks beoordelen van de wijze van uitvoeren van de onderwijs- en examenregeling, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
  - number: 10.3c.1.c
    text: |-
      het desgevraagd of uit eigen beweging advies uitbrengen aan de deelraad, bedoeld in [artikel 10.25][ref1], en het
      faculteitsbestuur of het bestuur van de desbetreffende organisatorische eenheid dan wel, indien de hogeschool geen
      faculteiten omvat, aan het instellingsbestuur, over alle andere aangelegenheden betreffende het onderwijs in de
      desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3c.2
    text: |-
      Voorzover bij de vaststelling, nadere regeling of uitvoering van de onderwijs- en examenregeling het advies van de
      desbetreffende commissie niet wordt gevolgd, wordt de desbetreffende beslissing met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
  - number: 10.3c.3
    text: |-
      In het bestuursreglement wordt de wijze van benoemen en samenstellen van de commissie geregeld, met dien verstande
      dat de helft van het totaal aantal leden van de commissie voortkomt uit de voor de desbetreffende opleiding
      ingeschreven studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
  - number: 10.3c.4
    text: |-
      Indien een faculteit of een andere organisatorische eenheid slechts één opleiding omvat, kan het bestuursreglement
      bepalen dat de taken en bevoegdheden van de opleidingscommissie worden uitgeoefend door de deelraad, bedoeld in
      [artikel 10.25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.3c
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.5'
    text: |-
      Het instellingsbestuur van een hogeschool zonder rechtspersoonlijkheid treft voorzieningen betreffende de
      beslechting van geschillen over beslissingen van organen van de hogeschool die niet reeds krachtens deze wet
      vatbaar zijn voor beroep.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.5
  - number: '10.6'
    text: |-
      Het instellingsbestuur van een openbare hogeschool zonder rechtspersoonlijkheid verstrekt Onze minister de
      gevraagde inlichtingen omtrent de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.6
  - number: '10.7'
    text: |-
      In afwijking van het bepaalde krachtens [artikel 4.5, vierde lid][ref1], zijn gedeputeerde staten van de
      desbetreffende provincie bevoegd de disciplinaire maatregel of de schorsing op te leggen dan wel het ontslag te
      verlenen, indien het betreft een personeelslid van een gemeentelijke hogeschool dat tevens lid is van de raad van
      de gemeente die de hogeschool in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
        hoofdstuk: '4'
  - number: 10.8.1
    text: |-
      Een bijzondere hogeschool wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij
      het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8.2
    text: |-
      Indien de statuten van de rechtspersoon waarvan de bijzondere hogeschool uitgaat, bepalen dat het college van
      bestuur optreedt als instellingsbestuur, wordt in de statuten tevens voorzien in het toezicht op het beleid door
      een bestuursraad door middel van de uitoefening van instemmingsrecht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8.3
    text: 'De bevoegdheden van de bestuursraad zijn ten minste:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8.3.a
    text: het vaststellen en wijzigen van de statuten van de rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8.3.b
    text: de benoeming, de schorsing en het ontslag van de leden van de bestuursraad en van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8.4
    text: |-
      Het bestuur van de rechtspersoon zendt elke wijziging van de statuten of reglementen binnen vier weken na
      vaststelling aan Onze minister. Het bestuur verstrekt Onze minister de nodige inlichtingen omtrent de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8
  - number: 10.8a
    text: |-
      Indien de statuten van de rechtspersoon waarvan een bijzondere hogeschool uitgaat, de onderwerpen, bedoeld in
      [artikel 10.3b, eerste lid, tweede volzin, onder a en b][ref1], regelen, kan het instellingsbestuur beslissen deze
      regeling niet op te nemen in het bestuursreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.8a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.9.1
    text: De bestuursorganen van een hogeschool met rechtspersoonlijkheid zijn het college van bestuur en de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.9
  - number: 10.9.2
    text: |-
      Het college van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur
      zijn opgedragen, alsmede de in [artikel 10.2, derde lid, tweede volzin][ref1], bedoelde taken en bevoegdheden van
      de centrale directie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: 10.10.1
    text: |-
      Het college van bestuur bestaat uit ten hoogste drie leden, waarvan er een wordt benoemd tot voorzitter. De
      voorzitter en de andere leden worden door Onze minister benoemd, geschorst en ontslagen, de bestuursraad gehoord.
      Bij de benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen
      en vrouwen. De benoeming geschiedt voor een door Onze minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.10
  - number: 10.10.2
    text: |-
      De voorzitter en de andere leden kunnen tussentijds worden ontslagen. Dat ontslag geschiedt niet dan nadat Onze
      minister de bestuursraad en het college van bestuur heeft gehoord. Met het einde van de maand waarin betrokkene de
      voor de openbare dienst geldende functionele leeftijdsgrens heeft bereikt, wordt hem, behoudens in zeer bijzondere
      gevallen, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.10
  - number: 10.10.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.10
  - number: 10.10.4
    text: De voorzitter van het college van bestuur vertegenwoordigt de hogeschool in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.10
  - number: 10.10.5
    text: |-
      Het college van bestuur verstrekt de bestuursraad de gevraagde inlichtingen omtrent zijn handelingen. Het verstrekt
      Onze minister de gevraagde inlichtingen omtrent de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.10
  - number: 10.11.1
    text: |-
      De bestuursraad bestaat uit een voorzitter en ten hoogste elf andere leden. Bij koninklijk besluit worden regels
      vastgesteld omtrent de benoeming en het ontslag van de voorzitter en de andere leden van de bestuursraad alsmede
      omtrent de duur van hun benoeming, met dien verstande dat bij de benoeming zoveel mogelijk rekening wordt gehouden
      met een evenwichtige verdeling van de zetels over mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.11
  - number: 10.11.2
    text: |-
      De bestuursraad heeft tot taak toezicht te houden op het beleid van het college van bestuur. Hij staat het college
      van bestuur met raad ter zijde. Bij de vervulling van zijn taak richt de bestuursraad zich naar het belang van
      de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.11
  - number: 10.12.1
    text: |-
      Het college van bestuur stelt met instemming van de bestuursraad ter nadere regeling van het bestuur en de
      inrichting van de hogeschool het bestuursreglement vast. In het bestuursreglement worden tevens regels vastgesteld
      omtrent de openbaarheid van de vergaderingen en de vergaderstukken van het college van bestuur en de bestuursraad.
      In het bestuursreglement worden nadere regels gesteld met betrekking tot het sluiten van een gemeenschappelijke
      regeling als bedoeld in [hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '8'
  - number: 10.12.2
    text: Het bestuursreglement of een wijziging daarvan behoeft de instemming van Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.12
  - number: 10.12.3
    text: |-
      Het college van bestuur zendt een beslissing als bedoeld in het tweede lid, binnen dertig dagen aan Onze minister.
      Onze minister beslist omtrent de instemming met deze beslissing binnen drie maanden na de dag waarop deze is
      ontvangen. De instemming wordt verleend of onthouden met betrekking tot een besluit in zijn geheel dan wel met
      betrekking tot een of meer onderdelen daarvan. De instemming wordt geacht te zijn verleend indien Onze minister
      daaromtrent niet heeft beslist binnen de in de tweede volzin genoemde termijn. Onze minister kan deze termijn
      eenmaal verlengen met ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.12
  - number: '10.13'
    text: |-
      De [artikelen 10.3a][ref1], [10.3b][ref2], [10.3c][ref3] en [10.5][ref4] zijn van overeenkomstige toepassing op de
      hogeschool met rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '2'
  - number: 10.14.1
    text: De besluiten van het college van bestuur en van de bestuursraad kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.14
  - number: 10.14.2
    text: Het besluit tot schorsing of vernietiging wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.14
  - number: '10.16'
    text: |-
      In geval van verwaarlozing of in strijd met de wet functioneren van het bestuur van de hogeschool kan bij algemene
      maatregel van bestuur, zo nodig met afwijking van de [artikelen 10.9][ref1] en [10.11][ref2], in dat bestuur worden
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.17.1
    text: |-
      Aan elke hogeschool is een medezeggenschapsraad verbonden. Indien een hogeschool één of meer faculteiten of andere
      organisatorische eenheden omvat is aan elke faculteit en aan elk van de desbetreffende eenheden een deelraad als
      bedoeld in [artikel 10.25][ref1], verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.17.2
    text: |-
      Het aantal leden van de raad bedraagt aan een hogeschool met minder dan 750 studenten ten hoogste tien leden, met
      750 tot 1250 studenten ten hoogste veertien leden en met 1250 of meer studenten ten hoogste vierentwintig leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
  - number: 10.17.3
    text: |-
      De raad bestaat voor de helft uit leden die uit en door het personeel worden gekozen, en voor de helft uit leden
      die uit en door de studenten worden gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
  - number: 10.17.4
    text: |-
      Zij die deel uitmaken van het instellingsbestuur, het college van bestuur, de bestuursraad, de centrale directie
      dan wel het bestuur van een faculteit of een andere organisatorische eenheid, kunnen niet tevens lid zijn van de
      raad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
  - number: 10.17.5
    text: |-
      Kandidaten voor de verkiezingen van het deel van de raad dat uit en door het personeel wordt gekozen, kunnen worden
      gesteld door personeelsleden en door organisaties van personeel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
  - number: 10.17.6
    text: |-
      De verkiezing van de leden van de raad geschiedt bij geheime schriftelijke stemming. Stemming voor een geleding van
      de raad vindt slechts plaats, indien het aantal kandidaat-leden van een geleding groter is dan het aantal zetels
      ten behoeve van die geleding.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
  - number: 10.17.7
    text: |-
      De raad stelt een reglement op voor de zaken van huishoudelijke aard en regelt tevens de wijze waarop door het
      instellingsbestuur betaalde bedragen ten behoeve van de raad en de eventuele deelraden en commissies als bedoeld in
      [artikel 10.34][ref1], worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.18'
    text: |-
      De medezeggenschapsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.18
  - number: 10.19.1
    text: |-
      Het instellingsbestuur stelt de medezeggenschapsraad ten minste twee maal per jaar in de gelegenheid de algemene
      gang van zaken in de hogeschool met hem te bespreken. Het instellingsbestuur en de raad komen met elkaar bijeen,
      indien daarom onder opgave van redenen wordt verzocht door het instellingsbestuur, de raad of het deel van de raad
      dat uit en door het personeel of uit en door de studenten is gekozen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.2
    text: |-
      De raad is bevoegd over alle aangelegenheden, de hogeschool betreffende, aan het instellingsbestuur voorstellen te
      doen en standpunten kenbaar te maken. Het instellingsbestuur brengt op de voorstellen, bedoeld in de eerste volzin,
      binnen drie maanden een schriftelijke, met redenen omklede reactie uit aan de raad in de vorm van een voorstel.
      Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie, stelt het instellingsbestuur
      de raad ten minste eenmaal in de gelegenheid met hem overleg te plegen over zijn voorstel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.3
    text: De raad bevordert naar vermogen openheid, openbaarheid en onderling overleg in de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.4
    text: |-
      De raad waakt voorts in de hogeschool in het algemeen tegen discriminatie op welke grond dan ook en
      bevordert in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede de inschakeling van
      gehandicapten en allochtonen. Het medezeggenschapsreglement bepaalt of de raad een overeenkomstige
      bevoegdheid bezit als bedoeld in [artikel 12, tweede lid, aanhef en onderdeel ][ref1]. In dat
      geval is [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref2]
      van overeenkomstige toepassing voor wat betreft het onderscheid, bedoeld in die wet of in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.19.5
    text: |-
      Het instellingsbestuur verstrekt de raad aan het begin van het studiejaar schriftelijk de basisgegevens met
      betrekking tot de samenstelling van het college van bestuur dan wel de centrale directie, de organisatie binnen
      de hogeschool, de taakverdeling tussen instellingsbestuur en centrale directie en de hoofdpunten van het reeds
      vastgestelde beleid. Het instellingsbestuur stelt de raad ten minste eenmaal per jaar schriftelijk in kennis
      van het door hem in het afgelopen jaar gevoerde beleid en van de beleidsvoornemens voor het komende jaar ten
      aanzien van de hogeschool op financieel, organisatorisch en onderwijskundig gebied. Het instellingsbestuur stelt
      de medezeggenschapsraad onverwijld in kennis van voornemens met betrekking tot de aangelegenheden, beschreven in
      het plan, bedoeld in [artikel 10.20, onder a][ref1]. Voorts verschaft het instellingsbestuur de raad, al dan niet
      gevraagd, tijdig alle inlichtingen die deze voor de vervulling van zijn taak redelijkerwijze nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.19.6
    text: |-
      Indien bij een bepaalde vergadering of een onderdeel daarvan een bij uitstek persoonlijk belang van een van de
      leden van de raad in het geding is, kan de raad bepalen dat het betrokken lid aan die vergadering of dat onderdeel
      daarvan, niet deelneemt. De raad bepaalt dan tevens dat de behandeling van de desbetreffende aangelegenheid in een
      besloten vergadering plaatsheeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.7
    text: |-
      De raad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      hogeschool betrokkenen van het verslag kennis kunnen nemen. De raad draagt er zorg voor dat de agenda’s en
      verslagen van de vergaderingen van de raad worden toegezonden aan het instellingsbestuur, aan de deelraden, aan
      de eventuele commissies en aan de eventuele gemeenschappelijke medezeggenschapsraad en ter inzage worden gelegd
      op een algemeen toegankelijke plaats op de hogeschool ten behoeve van belangstellenden. De raad stelt de in de
      vorige volzin bedoelde commissies ten minste eenmaal per jaar in de gelegenheid om over aangelegenheden die de
      desbetreffende commissie in het bijzonder aangaan, met hem overleg te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.8
    text: |-
      Het instellingsbestuur draagt er jegens de medezeggenschapsraad zorg voor dat de leden van de raad niet uit hoofde
      van hun lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de hogeschool. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van kandidaat-leden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: 10.19.9
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een aan de hogeschool werkzame persoon mag geen
      verband houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van
      de betrokkene van de raad. Een beëindiging van de betrekking in strijd met het in dit lid bepaalde is nietig.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.19
  - number: '10.20'
    text: |-
      Het instellingsbestuur behoeft de voorafgaande instemming van de medezeggenschapsraad voor elke door het
      instellingsbestuur te nemen beslissing met betrekking tot ten minste de vaststelling of wijziging van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
  - number: 10.20.a
    text: het instellingsplan,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
  - number: 10.20.b
    text: |-
      de vormgeving van het systeem van kwaliteitszorg overeenkomstig [artikel 1.18, eerste lid][ref1],
      alsmede het voorgenomen beleid in het licht van de uitkomsten van de kwaliteitsbeoordeling, bedoeld in
      [artikel 2.9, tweede lid, tweede volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.20.c
    text: het studentenstatuut,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
  - number: 10.20.d
    text: |-
      het bestuursreglement, alsmede indien [artikel 10.8a][ref1] van toepassing is, het desbetreffende deel van de
      statuten,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '4'
  - number: 10.20.e
    text: |-
      de onderwijs- en examenregeling, bedoeld in [artikel 7.13][ref1], met uitzondering van de onderwerpen genoemd in
      het tweede lid, onder a tot en met g,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 10.20.f
    text: regels op het gebied van de arbeidsomstandigheden, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
  - number: 10.20.g
    text: |-
      het beleid van het instellingsbestuur bij de toepassing van [artikel 7.51][ref1], en de regels, bedoeld in het
      vijfde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.20
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 10.21.1
    text: |-
      Het instellingsbestuur stelt, met inachtneming van de voorschriften bij of krachtens deze titel, een
      medezeggenschapsreglement voor de hogeschool vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.21
  - number: 10.21.2
    text: |-
      Het instellingsbestuur legt het reglement, daaronder elke wijziging ervan mede begrepen, als voorstel aan de
      medezeggenschapsraad voor en stelt het niet vast dan voorzover het voorstel de instemming van twee derden van het
      aantal leden van de raad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.21
  - number: '10.22'
    text: 'In het medezeggenschapsreglement worden ten minste geregeld:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.a
    text: |-
      de aangelegenheden waarover de medezeggenschapsraad, onverminderd [artikel 10.20][ref1], instemmingsrecht heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.22.b
    text: |-
      de aangelegenheden waarover de medezeggenschapsraad adviesrecht heeft, met dien verstande dat de raad ten minste
      adviesrecht wordt toegekend inzake aangelegenheden die de doelstellingen, het voortbestaan en de goede gang van
      zaken binnen de hogeschool betreffen, de begroting, alsmede de keuze voor de commissie voor geschillen waarbij de
      hogeschool is aangesloten,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.c
    text: het aantal leden van de medezeggenschapsraad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.d
    text: de wijze en organisatie van de verkiezingen van de leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.e
    text: de zittingsduur van de leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.f
    text: de wijze waarop het instellingsbestuur informatie verschaft aan de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.g
    text: |-
      de termijnen binnen welke tot instemming of onthouding van instemming dient te worden besloten, en de termijnen
      binnen welke advies dient te worden uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.h
    text: de bevoegdheden die door de deelraden worden uitgeoefend,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: 10.22.i
    text: |-
      de toekenning aan het deel van de raad dat uit en door het personeel is gekozen, van de bevoegdheden inzake de
      arbeidsomstandigheden die krachtens de [Arbeidsomstandighedenwet 1998][ref1] en de algemene maatregel van bestuur
      op grond van [artikel 16 van die wet][ref2] aan de medezeggenschapsraad zijn toegekend,


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel16
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '16'
  - number: 10.22.j
    text: |-
      de toekenning aan de raad van een overeenkomstige bevoegdheid als bedoeld in
      [artikel 12, tweede lid, aanhef en onderdeel d, van de Algemene wet gelijke behandeling][ref1], waarbij dan
      [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref2] van overeenkomstige toepassing
      is,


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003299#Artikel21
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003299
        artikel: '21'
  - number: 10.22.k
    text: |-
      de toekenning aan de raad of het deel van de raad dat uit en door het personeel is gekozen, van de bevoegdheden
      inzake de arbeidsomstandigheden in de hogeschool voorzover deze niet betreffen te nemen beslissingen van het
      instellingsbestuur, bedoeld in [artikel 10.20, onder f][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.22.l
    text: |-
      welke van de geschillen tussen het instellingsbestuur en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen waarbij de hogeschool is aangesloten, wie het geschil
      aanhangig kan maken en of daarbij de commissie om bemiddeling dan wel een oordeel wordt verzocht, voorzover de
      commissie voor geschillen waarbij de hogeschool is aangesloten, in haar reglement daarvoor de mogelijkheid biedt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.22
  - number: '10.23'
    text: |-
      Indien een te nemen beslissing op grond van het bepaalde in het medezeggenschapsreglement krachtens
      [artikel 10.22, onder b][ref1], vooraf voor advies dient te worden voorgelegd aan de medezeggenschapsraad, draagt
      het instellingsbestuur er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.23.a
    text: advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de besluitvorming,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.23
  - number: 10.23.b
    text: de raad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.23
  - number: 10.23.c
    text: |-
      de raad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte advies
      gevolg wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.23
  - number: 10.23.d
    text: |-
      de raad, indien het instellingsbestuur het advies niet of niet geheel wil volgen, in de gelegenheid wordt gesteld
      nader overleg met hem te voeren alvorens de beslissing definitief wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.23
  - number: 10.24.1
    text: |-
      Het instellingsbestuur behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en
      door het personeel is gekozen, voor elke door het instellingsbestuur te nemen beslissing met betrekking tot
      aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel in de hogeschool.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.24
  - number: 10.24.2
    text: |-
      Indien het instellingsbestuur op grond van het eerste lid voor een te nemen beslissing de voorafgaande instemming
      van het deel van de medezeggenschapsraad dat uit en door het personeel is gekozen, behoeft, wordt het deel van
      de raad dat uit en door de studenten wordt gekozen, in de gelegenheid gesteld over de beslissing advies uit te
      brengen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.24
  - number: 10.24.3
    text: |-
      Het instemmingsrecht of adviesrecht in aangelegenheden als bedoeld in het eerste en tweede lid wordt niet
      uitgeoefend voorzover de desbetreffende aangelegenheid voor de hogeschool reeds inhoudelijk is geregeld in een bij
      of krachtens de wet gegeven voorschrift of een collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.24
  - number: 10.25.1
    text: |-
      Een deelraad oefent tegenover het bestuur van een faculteit of een andere organisatorische eenheid het
      instemmingsrecht en het adviesrecht uit dat toekomt aan de medezeggenschapsraad, voorzover het aangelegenheden
      betreft die het desbetreffende deel van de hogeschool in het bijzonder aangaan, en de desbetreffende bevoegdheden
      tevens aan het bestuur van die faculteit of andere organisatorische eenheid zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.25
  - number: 10.25.2
    text: |-
      [Artikel 10.17, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.1
    text: |-
      Elke hogeschool is aangesloten bij een commissie voor geschillen. Een commissie als bedoeld in de vorige volzin,
      strekt haar werkkring uit over ten minste twintig hogescholen. Onze minister kan het in de vorige volzin bedoelde
      aantal hogescholen lager stellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.26
  - number: 10.26.2
    text: |-
      Een commissie voor geschillen bestaat uit drie leden en drie plaatsvervangende leden, waarvan een lid en een
      plaatsvervangend lid worden gekozen door de instellingsbesturen en een lid en een plaatsvervangend lid door de
      medezeggenschapsraden van de in het eerste lid bedoelde hogescholen. Deze twee leden kiezen het derde lid, tevens
      voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.26
  - number: 10.26.3
    text: |-
      De leden en de plaatsvervangende leden mogen niet deel uitmaken van het instellingsbestuur of van de
      medezeggenschapsraad van een hogeschool waarover de commissie haar werkkring uitstrekt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.26
  - number: 10.27.1
    text: 'Een commissie voor geschillen neemt kennis van geschillen in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
  - number: 10.27.1.a
    text: |-
      op verzoek van het instellingsbestuur, indien het instellingsbestuur ten aanzien van een, na overleg al dan niet
      gewijzigd, te nemen beslissing dat ingevolge de [artikelen 10.20][ref1] en [10.22, onder a][ref2], instemming
      behoeft, de vereiste instemming niet heeft verworven en het instellingsbestuur zijn voorstel wenst te handhaven,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.27.1.b
    text: |-
      op verzoek van het instellingsbestuur of van de medezeggenschapsraad, indien het instellingsbestuur ten aanzien van
      de inhoud van het medezeggenschapsreglement voorzover aangegeven in [artikel 10.22][ref1], geheel of gedeeltelijk
      niet de vereiste instemming heeft verworven,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.27.1.c
    text: |-
      op verzoek van de medezeggenschapsraad, indien het instellingsbestuur een beslissing heeft genomen waarover
      ingevolge de toepassing van [artikel 10.22, onder b][ref1], advies door de raad is uitgebracht, het
      instellingsbestuur daarbij het uitgebrachte advies niet of niet geheel volgt en de raad van oordeel is dat daardoor
      de belangen van de hogeschool of de belangen van de raad ernstig worden geschaad, en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.27.1.d
    text: |-
      op verzoek van het instellingsbestuur of van de medezeggenschapsraad, indien het instellingsbestuur en de raad
      van mening verschillen over de interpretatie van het bepaalde bij of krachtens deze titel dan wel het bepaalde in
      het medezeggenschapsreglement.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
  - number: 10.27.2
    text: |-
      De commissie kan in haar reglement bepalen dat zij kennis neemt van andere geschillen tussen het instellingsbestuur
      en de raad, dan bedoeld in het eerste lid. [Artikel 10.28, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.27.3
    text: |-
      Indien er een geschil is tussen het bestuur van een faculteit of een andere organisatorische eenheid en een
      deelraad, meldt het bestuur dan wel de deelraad dit geschil aan bij het instellingsbestuur dan wel bij de
      medezeggenschapsraad van de hogeschool. Het instellingsbestuur dan wel de medezeggenschapsraad legt het geschil
      voor aan de commissie voor de geschillen, tenzij het instellingsbestuur dan wel de medezeggenschapsraad van mening
      is dat het geschil kan worden opgelost zonder tussenkomst van de geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
  - number: 10.27.4
    text: |-
      Een uitspraak van een commissie voor geschillen van openbare hogescholen wordt voor de toepassing van
      [afdeling 7.1 van de Algemene wet bestuursrecht][ref1] gelijkgesteld met een besluit, genomen in administratief
      beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '7.1'
  - number: 10.28.1
    text: |-
      Indien aan een te nemen beslissing van het instellingsbestuur instemming, vereist ingevolge [artikel 10.20][ref1]
      of het medezeggenschapsreglement, is onthouden, deelt het instellingsbestuur binnen drie maanden aan de
      medezeggenschapsraad mede of het voorstel wordt ingetrokken dan wel wordt voorgelegd aan de commissie voor
      geschillen. Indien deze mededeling niet binnen drie maanden wordt gedaan, vervalt het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.28.2
    text: |-
      Het instellingsbestuur doet een verzoek als bedoeld in [artikel 10.27, eerste lid, onder a][ref1], onder
      overlegging van de door het instellingsbestuur gemaakte afweging van de belangen die daarbij voor het
      instellingsbestuur onderscheidenlijk de raad of het betrokken deel daarvan aan de orde zijn. De commissie stelt de
      raad of het betrokken deel daarvan in de gelegenheid om zijn argumenten voor het onthouden van zijn instemming bij
      de commissie naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.28.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het instellingsbestuur en de raad voor te leggen, tenzij het
      instellingsbestuur dan wel de raad of het betrokken deel daarvan te kennen geven daarop geen prijs te stellen.
      Indien de commissie van deze bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van
      het instellingsbestuur alsmede de instemming van de raad of het betrokken deel daarvan, beoordeelt de commissie of
      het instellingsbestuur bij afweging van de betrokken belangen in redelijkheid tot zijn voorstel heeft kunnen komen.
      De uitspraak van de commissie is bindend voor het instellingsbestuur en de raad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.28
  - number: 10.29.1
    text: |-
      Voorzover aan een voorstel van het instellingsbestuur tot vaststelling of wijziging van het
      medezeggenschapsreglement, wat betreft onderwerpen als bedoeld in [artikel 10.22][ref1], de instemming die
      is vereist ingevolge [artikel 10.21, tweede lid][ref2], is onthouden, deelt het instellingsbestuur aan de
      medezeggenschapsraad dan wel de raad aan het instellingsbestuur binnen drie maanden mede, of het voorstel wordt
      voorgelegd aan de commissie voor geschillen. Indien een dergelijke mededeling niet binnen drie maanden wordt
      gedaan, vervalt het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.29.2
    text: |-
      Indien het instellingsbestuur een verzoek doet als bedoeld in [artikel 10.27, eerste lid, onder b][ref1], is
      [artikel 10.28, tweede lid][ref2], van overeenkomstige toepassing. Indien de raad een verzoek doet als bedoeld
      in [artikel 10.27, eerste lid, onder b][ref3], wordt het verzoek met redenen omkleed en stelt de commissie het
      instellingsbestuur in de gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.29
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.29.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het instellingsbestuur en de raad voor te leggen, tenzij
      het instellingsbestuur dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van
      deze bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van het instellingsbestuur
      alsmede de instemming van de raad, beoordeelt de commissie of het instellingsbestuur bij afweging van de betrokken
      belangen in redelijkheid tot zijn voorstel had kunnen komen. De commissie geeft, voorzover zij van oordeel is dat
      het instellingsbestuur bij afweging van de betrokken belangen niet in redelijkheid tot zijn voorstel heeft kunnen
      komen, in haar uitspraak aan hoe het voorstel dient te worden gewijzigd. Na de uitspraak van de commissie stelt het
      instellingsbestuur het medezeggenschapsreglement vast overeenkomstig de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.29
  - number: 10.30.1
    text: |-
      Indien het instellingsbestuur een beslissing neemt waarbij het een advies van de medezeggenschapsraad, vereist
      ingevolge [artikel 10.22, onder b][ref1], niet of niet geheel volgt, wordt de uitvoering van de beslissing
      opgeschort met vier weken, tenzij de raad tegen onmiddellijke uitvoering van de beslissing geen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.30.2
    text: |-
      De medezeggenschapsraad doet een verzoek als bedoeld in [artikel 10.27, eerste lid, onder c][ref1], binnen vier
      weken nadat de betrokken beslissing door het instellingsbestuur is genomen, onder overlegging van de argumenten
      voor zijn advies en de argumenten voor zijn oordeel dat door het niet of niet geheel volgen van het advies
      de belangen van de instelling of van de raad ernstig worden geschaad. De commissie voor geschillen stelt het
      instellingsbestuur in de gelegenheid om zijn argumenten voor het niet of niet geheel volgen van het advies
      van de raad bij de commissie voor geschillen naar voren te brengen. De behandeling van het verzoek verlengt de
      opschorting, bedoeld in het eerste lid, niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.30.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het instellingsbestuur en de raad voor te leggen, tenzij
      het instellingsbestuur dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruikmaakt of indien haar voorstel niet de instemming verwerft van het instellingsbestuur en van
      de raad, beoordeelt de commissie of het instellingsbestuur bij het niet of niet geheel volgen van het advies van
      de raad
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: 10.30.3.a
    text: gehandeld heeft in strijd met het bepaalde bij of krachtens deze titel of het medezeggenschapsreglement,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: 10.30.3.b
    text: onvoldoende gemotiveerd heeft waarom is afgeweken van het advies van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: 10.30.3.c
    text: onzorgvuldig gehandeld heeft ten opzichte van de raad, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: 10.30.3.d
    text: bij de afweging van de betrokken belangen in redelijkheid niet tot de beslissing had kunnen komen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: 10.30.4
    text: De commissie doet vervolgens de bindende uitspraak of de betrokken beslissing al dan niet in stand kan blijven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.30
  - number: '10.31'
    text: |-
      Op een verzoek als bedoeld in [artikel 10.27, eerste lid, onder d][ref1], doet de commissie voor geschillen de
      bindende uitspraak welke interpretatie aan het bepaalde bij of krachtens deze titel dan wel het bepaalde in het
      medezeggenschapsreglement dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.31
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.32'
    text: |-
      Indien in het medezeggenschapsreglement ingevolge de toepassing van [artikel 10.22, onder l][ref1], geschillen
      worden aangegeven en indien het reglement van de commissie voor geschillen daarvoor de mogelijkheid biedt,
      kunnen deze geschillen aan de commissie worden voorgelegd overeenkomstig het daaromtrent bepaalde in het
      medezeggenschapsreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.33.1
    text: |-
      De medezeggenschapsraad kan in rechte optreden indien de vordering strekt tot naleving door het instellingsbestuur
      van de verplichtingen jegens de raad, voortvloeiend uit deze titel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.33
  - number: 10.33.2
    text: Indien de burgerlijke rechter bevoegd is, neemt de kantonrechter kennis van de vordering.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.33
  - number: 10.33.3
    text: |-
      In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:75 van de Algemene wet bestuursrecht][ref2] kan de raad niet in de proceskosten worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.33
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 10.33.4
    text: |-
      De raad treedt op verzoek van een commissie als bedoeld in [artikel 10.34][ref1], op indien de rechten van die
      commissie specifiek aan de orde zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.34.1
    text: |-
      Het instellingsbestuur stelt het personeel en de studenten in de gelegenheid om desgewenst onderscheidenlijk een
      personeelscommissie dan wel afzonderlijke commissies voor onderscheiden personeelscategorieën of -groeperingen,
      en een studentencommissie in te stellen. Een dergelijke commissie is bevoegd desgevraagd of eigener beweging
      advies uit te brengen aan de medezeggenschapsraad over die aangelegenheden die de desbetreffende commissie in het
      bijzonder aangaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.34
  - number: 10.34.2
    text: |-
      Op verzoek van een commissie stelt de medezeggenschapsraad het instellingsbestuur in kennis van een schriftelijk
      advies als bedoeld in het eerste lid. [Artikel 10.19, tweede lid, derde volzin][ref1], is ten aanzien van een
      dergelijk schriftelijk advies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.34
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.35.1
    text: |-
      Indien een rechtspersoon met volledige rechtsbevoegdheid meerdere hogescholen in stand houdt, stelt het
      instellingsbestuur een gemeenschappelijke medezeggenschapsraad in voor alle of een aantal van deze hogescholen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
  - number: 10.35.2
    text: |-
      De leden van de gemeenschappelijke raad worden gekozen uit en door de leden van de desbetreffende afzonderlijke
      medezeggenschapsraden en wel zodanig dat de aantallen leden, gekozen uit het personeel onderscheidenlijk uit
      de studenten, elk de helft van het aantal leden van de raad bedragen. Het aantal leden van de raad bedraagt ten
      hoogste vierentwintig leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
  - number: 10.35.3
    text: |-
      Het instellingsbestuur stelt voor elke gemeenschappelijke raad een reglement vast. In het reglement
      wordt ten minste geregeld uit hoeveel leden de gemeenschappelijke medezeggenschapsraad bestaat, de wijze
      waarop de verkiezing door de betrokken medezeggenschapsraden geschiedt, en de onderwerpen, bedoeld in
      [artikel 10.22, onder d tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.35.4
    text: |-
      [Artikel 10.20][ref1] is van overeenkomstige toepassing. In het reglement wordt vastgelegd met betrekking tot welke
      in dat artikel geregelde onderwerpen de instemming van de gemeenschappelijke raad is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.35.5
    text: |-
      [Artikel 10.21, tweede lid][ref1], is van overeenkomstige toepassing op het reglement behalve voor wat betreft de
      bevoegdheden die ingevolge het vierde lid zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.35.6
    text: |-
      De [artikelen 10.17][ref1] en [10.27 tot en met 10.33][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.36'
    text: |-
      Indien een rechtspersoon met volledige rechtsbevoegdheid meerdere hogescholen in stand houdt, geeft het
      instellingsbestuur gelegenheid tot het instellen van een gemeenschappelijke commissie als bedoeld in
      [artikel 10.34][ref1]. Een dergelijke commissie is bevoegd desgevraagd of uit eigen beweging advies uit te brengen
      aan de gemeenschappelijke medezeggenschapsraad dan wel de afzonderlijke medezeggenschapsraden van de desbetreffende
      hogescholen over aangelegenheden die van gemeenschappelijk belang zijn en de desbetreffende commissie in het
      bijzonder aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.36
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.37'
    text: |-
      Indien bijzondere omstandigheden een goede toepassing van een of meer onderdelen van deze titel in een hogeschool
      of in een aantal hogescholen die door dezelfde rechtspersoon met volledige rechtsbevoegdheid in stand worden
      gehouden, in de weg staan, kan Onze minister op verzoek van het instellingsbestuur toestaan, dat wat betreft een of
      meer onderdelen op de door hem aangewezen wijze wordt afgeweken van deze titel.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.37
  - number: 10.38.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging, die aan de hogeschool ten
      grondslag ligt, kan Onze minister op verzoek van het instellingsbestuur van een bijzondere hogeschool ontheffing
      verlenen van de voorschriften van deze titel. Het instellingsbestuur toont bij zijn verzoek aan dat dit verzoek
      wordt ondersteund door een meerderheid van twee derden zowel van het personeel van de hogeschool als van de bij de
      hogeschool betrokken studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.38
  - number: 10.38.2
    text: |-
      Onze minister verklaart de ontheffing vervallen, indien de gronden waarop zij berustte, niet meer aanwezig zijn dan
      wel indien zij niet meer wordt ondersteund door een meerderheid van twee derden van elk van de in het eerste lid
      bedoelde categorieën.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.38
  - number: 10.38.3
    text: |-
      Het instellingsbestuur doet elke vijf jaren aan Onze minister mededeling omtrent de stand van zaken met betrekking
      tot de gronden van de ontheffing en de ondersteuning ervan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.38
  - number: 10.39.1
    text: |-
      Het instellingsbestuur staat de medezeggenschapsraad het gebruik toe van de voorzieningen waarover het kan
      beschikken, en die de raad voor de vervulling van zijn taak redelijkerwijs nodig heeft. Het instellingsbestuur
      stelt de medezeggenschapsraad in de gelegenheid zoveel mogelijk tijdens werktijd te vergaderen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.39
  - number: 10.39.2
    text: |-
      Het instellingsbestuur stelt de leden van de medezeggenschapsraad in de gelegenheid om gedurende een door het
      instellingsbestuur en de raad gezamenlijk vast te stellen hoeveelheid tijd de scholing te ontvangen die de leden
      van de raad voor de vervulling van hun taak nodig hebben. Het personeel van de hogeschool wordt in de gelegenheid
      gesteld deze scholing in werktijd en met behoud van salaris te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.39
  - number: 10.39.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de raden, bedoeld in [artikel 10.35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.1
    text: |-
      Het college van bestuur van de Open Universiteit is belast met het bestuur van de Open Universiteit in haar geheel
      en met het beheer daarvan, onverminderd de bevoegdheden van de raad van toezicht volgens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.1
  - number: 11.1.2
    text: |-
      Het college van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur
      zijn opgedragen, voorzover in dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.1
  - number: 11.1.3
    text: De voorzitter van het college van bestuur vertegenwoordigt de Open Universiteit in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.1
  - number: 11.1.4
    text: |-
      In dit hoofdstuk worden onder «het college van bestuur» en «de raad van toezicht» onderscheidenlijk verstaan: het
      college van bestuur van de Open Universiteit en de raad van toezicht van de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.1
  - number: 11.2.1
    text: Het college van bestuur bestaat uit ten hoogste drie leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.2.2
    text: |-
      De leden van het college van bestuur worden door de raad van toezicht benoemd, geschorst en ontslagen. Bij de
      benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de zetels over mannen en
      vrouwen. De benoeming geschiedt voor een door de raad van toezicht te bepalen termijn. Met het einde van de maand
      waarin een lid van het college van bestuur de voor de openbare dienst geldende functionele leeftijdsgrens heeft
      bereikt, wordt hem eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.2.3
    text: |-
      Alvorens tot benoeming of ontslag van een lid van het college van bestuur over te gaan, hoort de raad van toezicht
      vertrouwelijk de ondernemingsraad van de Open Universiteit en de studentenraad, bedoeld in [artikel 11.13][ref1],
      over het voorgenomen besluit tot benoeming of ontslag. Het horen geschiedt op een zodanig tijdstip dat het van
      wezenlijke invloed kan zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '4'
  - number: 11.2.4
    text: Een lid van het college van bestuur kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.2.5
    text: |-
      Indien het college van bestuur slechts uit de voorzitter bestaat, regelt de raad van toezicht de vervanging van de
      voorzitter bij diens afwezigheid of ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.2.6
    text: Een lid van het college van bestuur kan niet tevens lid zijn van een ander bestuursorgaan van de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.2.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.2
  - number: 11.3.1
    text: |-
      Het college van bestuur stelt het bestuurs- en beheersreglement ter regeling van het bestuur, het beheer en de
      inrichting van de Open Universiteit vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.3
  - number: 11.3.2
    text: |-
      In het reglement worden regels vastgesteld omtrent de totstandkoming van de onderwijs- en examenregeling, bedoeld
      in [artikel 7.13][ref1]. Deze regels betreffen in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 11.3.2.a
    text: de aanwijzing van het orgaan dat de onderwijs- en examenregeling vaststelt, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.3
  - number: 11.3.2.b
    text: |-
      het instemmingsrecht van studenten ten aanzien van de vaststelling en wijziging van de onderwijs- en examenregeling
      met uitzondering van de onderwerpen, genoemd in [artikel 7.13, tweede lid, onder a tot en met g][ref1], en met
      uitzondering van de aanwijzing, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 11.4.1
    text: Het college van bestuur is verantwoording verschuldigd aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.4
  - number: 11.4.2
    text: |-
      Het college van bestuur verstrekt de raad van toezicht de gevraagde inlichtingen betreffende zijn besluiten en
      andere handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.4
  - number: 11.4.3
    text: Het college van bestuur verstrekt Onze minister de gevraagde inlichtingen omtrent de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.4
  - number: 11.5.1
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.2
    text: |-
      De voorzitter en de andere leden van de raad van toezicht worden door Onze minister benoemd, geschorst en
      ontslagen. Bij de benoeming wordt zoveel mogelijk rekening gehouden met een evenwichtige verdeling van de
      zetels over mannen en vrouwen. Onze minister benoemt een lid dat in het bijzonder het vertrouwen geniet van de
      ondernemingsraad van de Open Universiteit en de studentenraad, bedoeld in [artikel 11.13][ref1], gezamenlijk. De
      benoeming geschiedt voor een periode van ten hoogste vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '4'
  - number: 11.5.3
    text: |-
      Alvorens tot benoeming of ontslag van een lid van de raad van toezicht over te gaan, hoort Onze minister de
      ondernemingsraad en de studentenraad vertrouwelijk over het door hem voorgenomen besluit tot benoeming of ontslag.
      Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan zijn op de besluitvorming.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.4
    text: Een lid kan om gewichtige redenen tussentijds worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.5
    text: 'Een lid van de raad van toezicht kan niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.5.a
    text: voor het merendeel van zijn arbeidstijd personeelslid zijn van een in de bijlage van deze wet opgenomen instelling,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.5.b
    text: werkzaam zijn bij een departement van algemeen bestuur, of
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.5.c
    text: lid zijn van de Eerste of Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.6
    text: Het college van bestuur voorziet in de administratieve ondersteuning van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.7
    text: |-
      Het college van bestuur woont de vergaderingen van de raad van toezicht bij, tenzij de raad anders beslist. Het
      college van bestuur heeft daarin een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.5.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.5
  - number: 11.6.1
    text: |-
      De raad van toezicht is belast met het toezicht op het bestuur van de Open Universiteit in haar geheel en op het
      beheer daarvan. Hij staat het college van bestuur met raad bij. De raad van toezicht ziet er op toe dat het college
      van bestuur bij de uitoefening van zijn bevoegdheden de op de Open Universiteit betrekking hebbende wetten alsmede
      de krachtens die wetten uitgevaardigde regelingen, richtlijnen, aanwijzingen en reglementen naleeft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
  - number: 11.6.2
    text: 'De raad van toezicht is belast met de goedkeuring dan wel instemming van:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
  - number: 11.6.2.a
    text: |-
      het bestuurs- en beheersreglement, bedoeld in [artikel 11.3][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '1'
  - number: 11.6.2.b
    text: |-
      het instellingsplan, bedoeld in [artikel 2.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.2.c
    text: |-
      de begroting, bedoeld in [artikel 2.8][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.2.d
    text: |-
      het verslag, bedoeld in [artikel 2.9][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.2.e
    text: |-
      het document, bedoeld in [artikel 4.2, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
        hoofdstuk: '4'
  - number: 11.6.2.f
    text: |-
      een besluit betreffende een gemeenschappelijke regeling als bedoeld in [artikel 8.1][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel8
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '8'
        hoofdstuk: '8'
  - number: 11.6.2.g
    text: de instelling of opheffing van regionale studiecentra, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
  - number: 11.6.2.h
    text: |-
      het reglement voor de studentenraad, bedoeld in [artikel 11.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '4'
  - number: 11.6.3
    text: |-
      De goedkeuring, bedoeld in het tweede lid, onderdeel d, kan slechts worden onthouden wegens strijd met het recht of
      het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.6
  - number: 11.7.1
    text: De raad van toezicht is verantwoording verschuldigd aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.7
  - number: 11.7.2
    text: De raad van toezicht verschaft Onze minister de gevraagde inlichtingen betreffende zijn handelen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.7
  - number: '11.8'
    text: In het bestuurs- en beheersreglement wordt geregeld welke opleidingen door de Open Universiteit worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.8
  - number: 11.9.1
    text: |-
      Tot het personeel van de Open Universiteit behoren in elk geval de hoogleraren. In het benoemingsbesluit wordt
      vermeld het wetenschapsgebied waarop de hoogleraar zijn onderwijs- en onderzoektaken uitoefent.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.9
  - number: 11.9.2
    text: |-
      De hoogleraren zijn bij uitstek verantwoordelijk voor de ontwikkeling van het hun toegewezen wetenschapsgebied en
      voor de inhoud van het te geven onderwijs op dat gebied, onverminderd de bevoegdheid van het college van bestuur
      terzake van de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.9
  - number: 11.9.3
    text: Eervol ontslagen hoogleraren behouden nog gedurende vijf jaren na hun ontslag het recht als promotor op te treden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.9
  - number: 11.9.4
    text: |-
      De hoogleraren zijn gerechtigd de titel professor te voeren. De oud-hoogleraren aan wie om gezondheidsredenen,
      wegens vrijwillig vervroegd uittreden dan wel bij of na het bereiken van de voor de openbare dienst geldende
      functionele leeftijdsgrens eervol ontslag als hoogleraar is verleend, zijn eveneens gerechtigd deze titel te
      voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.9
  - number: 11.10.1
    text: |-
      Aan de Open Universiteit is een college voor promoties verbonden. Het college voor promoties bestaat uit
      hoogleraren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.10
  - number: 11.10.2
    text: |-
      Het college voor promoties hoort de raad van toezicht over het verlenen van de graad, bedoeld in
      [artikel 7.19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 11.10.3
    text: |-
      In het bestuurs- en beheersreglement worden de taak, de samenstelling en de wijze van benoeming van het college
      voor promoties nader geregeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.10
  - number: 11.11.1
    text: |-
      Voor elke opleiding of groep van opleidingen wordt door het college van bestuur een opleidingscommissie ingesteld.
      De commissie heeft tot taak:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
  - number: 11.11.1.a
    text: |-
      advies uit te brengen aan het orgaan, bedoeld in [artikel 11.3, tweede lid][ref1], over de onderwijs- en
      examenregeling, bedoeld in [artikel 7.13][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 11.11.1.b
    text: het jaarlijks beoordelen van de wijze van uitvoeren van de onderwijs- en examenregeling, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
  - number: 11.11.1.c
    text: |-
      het desgevraagd of uit eigen beweging advies uitbrengen aan het orgaan, bedoeld in
      [artikel 11.3, tweede lid][ref1], over alle aangelegenheden betreffende het onderwijs in de desbetreffende
      opleiding of groep van opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '1'
  - number: 11.11.2
    text: |-
      Op een advies, bedoeld in het eerste lid, is [artikel 9.35, aanhef en onderdelen b en c][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 11.11.3
    text: |-
      In het bestuurs- en beheersreglement wordt de wijze van benoeming en samenstelling van de opleidingscommissie
      geregeld, met dien verstande dat de helft van het aantal leden van de commissie voortkomt uit studenten die aan de
      Open Universiteit zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.11
  - number: '11.12'
    text: |-
      De besluiten van de examencommissie kunnen door het college van bestuur worden vernietigd. In geval van schorsing
      kan, in afwijking van [artikel 10:44, derde lid, van de Algemene wet bestuursrecht][ref1], deze schorsing niet
      langer dan vier maanden duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 11.13.1
    text: Bij de Open Universiteit is een studentenraad. Het aantal leden bedraagt ten hoogste negen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.13.2
    text: |-
      De leden worden voor een periode van twee jaren bij geheime schriftelijke stemming gekozen door en uit de
      studenten.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.13.3
    text: |-
      Het college van bestuur stelt, overeenkomstig regels neergelegd in het reglement voor de studentenraad, de
      kandidaat-leden voor de studentenraad in de gelegenheid zich tijdig voor de verkiezing aan de studenten voor te
      stellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.13.4
    text: |-
      De vergaderingen van de studentenraad zijn openbaar, behoudens voorzover het reglement voor de studentenraad anders
      bepaalt of de raad anders beslist. De leden stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.13.5
    text: |-
      Het college van bestuur stelt de studentenraad en de leden daarvan in de gelegenheid de in deze wet bedoelde taken
      naar behoren te verrichten binnen het kader van de toegekende middelen en voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.13.6
    text: |-
      Het college van bestuur draagt er zorg voor dat de leden van de studentenraad niet uit hoofde van hun lidmaatschap
      van die raad worden benadeeld in hun positie met betrekking tot de Open Universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.13
  - number: 11.14.1
    text: |-
      Het college van bestuur stelt, met inachtneming van de voorschriften bij deze paragraaf, een reglement voor de
      studentenraad vast. De vaststelling van het reglement alsmede elke wijziging daarvan behoeft de voorafgaande
      instemming van de studentenraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2
    text: 'Het reglement voor de studentenraad bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2.a
    text: regels omtrent de verkiezing van de leden van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2.b
    text: regels omtrent aanvang en einde van het lidmaatschap van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2.c
    text: regels omtrent de werkwijze van de raad,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2.d
    text: de wijze waarop het college van bestuur informatie verschaft aan de raad, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.14.2.e
    text: regels omtrent geheimhouding van zaken de Open Universiteit betreffende.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.14
  - number: 11.15.1
    text: |-
      De studentenraad wordt in de gelegenheid gesteld advies uit te brengen, alvorens het college van bestuur een
      besluit neemt ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.1.a
    text: de opleidingen die tot ontwikkeling zullen worden gebracht,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.1.b
    text: het beleid met betrekking tot voorzieningen ten behoeve van studenten,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.1.c
    text: het beleid met betrekking tot verwijdering van studenten van de Open Universiteit,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.1.d
    text: de studiebegeleiding van studenten, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.1.e
    text: |-
      de beperking van de inschrijving, bedoeld in [artikel 7.55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 11.15.2
    text: |-
      De studentenraad kan het college van bestuur of de raad van toezicht ongevraagd advies uitbrengen ten aanzien van
      aangelegenheden de Open Universiteit betreffende die in het bijzonder de studenten aangaan.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.15.3
    text: |-
      Indien het college van bestuur of de raad van toezicht het ingevolge het eerste lid vereiste advies van de
      studentenraad niet of niet geheel opvolgt, worden de redenen daartoe schriftelijk aan de studentenraad meegedeeld.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.15
  - number: 11.16.1
    text: |-
      Indien het college van bestuur de met betrekking tot het reglement voor de studentenraad vereiste instemming
      niet verwerft en zijn voorgenomen besluit wenst te handhaven, legt hij het voorgenomen besluit voor aan de
      raad van toezicht. Het voorgaande is van overeenkomstige toepassing met betrekking tot een geschil over de
      instemmingsbevoegdheid, bedoeld in [artikel 11.3, tweede lid tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel11
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '1'
  - number: 11.16.2
    text: |-
      De raad van toezicht is bevoegd een bemiddelingsvoorstel voor te leggen. Indien de raad van toezicht van deze
      bevoegdheid geen gebruikmaakt of indien zijn voorstel niet de instemming verwerft van het college van bestuur en de
      studentenraad, beoordeelt de raad of het college van bestuur bij afweging van de betrokken belangen in redelijkheid
      tot zijn voorgenomen besluit heeft kunnen komen. De raad van toezicht neemt in elk geval een besluit dat bindend is
      voor het college van bestuur en de studentenraad.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel11.16
  - number: '12.1'
    text: |-
      Dit hoofdstuk is, met uitzondering van [artikel 12.18][ref1], van toepassing op de academische ziekenhuizen bij
      openbare universiteiten en wat betreft de [artikelen 12.2][ref2] en [12.18][ref3] op de academische ziekenhuizen
      bij bijzondere universiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
  - number: 12.2.1
    text: |-
      Bij het bestuur en de inrichting van het academisch ziekenhuis wordt voorzover de belangen van de patiënten dat
      toelaten, rekening gehouden met de belangen van het wetenschappelijk geneeskundig onderwijs en onderzoek bij de
      universiteit.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.2
  - number: 12.2.2
    text: |-
      In het bijzonder worden hoogleraren van de faculteit der geneeskunde, wier vakgebied hen daarvoor in aanmerking
      doet komen, alsmede de andere leden van het wetenschappelijk personeel die op het desbetreffende vakgebied
      werkzaam zijn, in de gelegenheid gesteld tot het geven van wetenschappelijk geneeskundig onderwijs en het doen van
      wetenschappelijk geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.2
  - number: 12.3.1
    text: De bestuursorganen van het academisch ziekenhuis zijn de raad van bestuur en de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.3
  - number: 12.3.2
    text: |-
      Aan de raad van bestuur behoort de bevoegdheid tot regeling en bestuur van de zaken van het academisch ziekenhuis
      in zijn geheel, voorzover deze niet bij of krachtens deze wet aan de raad van toezicht is opgedragen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.3
  - number: 12.3.3
    text: |-
      De raad van bestuur oefent de taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur zijn
      opgedragen, voorzover bij of krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.3
  - number: 12.3.4
    text: |-
      Tegen een beslissing op grond van [artikel 1.14, eerste lid][ref1], houdende vaststelling van het deel van de
      rijksbijdrage voor de universiteit waarop het academisch ziekenhuis aanspraak heeft, kan beroep worden ingesteld
      door het college van bestuur van de universiteit waaraan het academisch ziekenhuis is verbonden in overeenstemming
      met de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 12.4.1
    text: |-
      De raad van bestuur bestaat uit een voorzitter en twee andere leden. In bijzondere gevallen kan Onze minister
      bepalen dat de raad van bestuur uit een voorzitter en drie andere leden bestaat. In gevallen waarin toepassing is
      gegeven aan de tweede volzin, geeft de stem van de voorzitter de doorslag indien in de raad van bestuur de stemmen
      staken.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.4
  - number: 12.4.2
    text: De voorzitter en de andere leden worden door de raad van toezicht benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.4
  - number: '12.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de rechtspositie van de
      voorzitter en de andere leden van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.5
  - number: 12.6.1
    text: 'Onverminderd hetgeen overigens bij of krachtens deze wet is bepaald, is de raad van bestuur belast met:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
  - number: 12.6.1.a
    text: |-
      het vaststellen van het bestuursreglement, bedoeld in [artikel 12.7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.6.1.b
    text: het vaststellen van de begroting,
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
  - number: 12.6.1.c
    text: het vaststellen van het jaarverslag, en
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
  - number: 12.6.1.d
    text: het vaststellen van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
  - number: 12.6.2
    text: |-
      De raad van bestuur doet ten behoeve van het academisch ziekenhuis de noodzakelijke uitgaven binnen de grenzen van
      de begroting.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.6
  - number: '12.7'
    text: Het bestuursreglement bevat een nadere regeling van het bestuur en de inrichting van het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.7
  - number: '12.8'
    text: |-
      De raad van bestuur is verantwoording verschuldigd aan de raad van toezicht. De raad van bestuur verstrekt de raad
      van toezicht de gevraagde inlichtingen betreffende het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.8
  - number: 12.9.1
    text: De voorzitter van de raad van bestuur vertegenwoordigt het academisch ziekenhuis in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.9
  - number: 12.9.2
    text: |-
      De raad van bestuur wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.9
  - number: 12.10.1
    text: |-
      De raad van toezicht bestaat uit vijf of zeven leden. Het aantal leden wordt door Onze minister na overleg met de
      raad van toezicht bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.10
  - number: 12.10.2
    text: |-
      De voorzitter en de andere leden worden door Onze minister benoemd, geschorst en ontslagen. De benoeming geschiedt
      voor een termijn van ten hoogste vier jaren, de raad van toezicht gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.10
  - number: 12.10.3
    text: De leden kunnen tussentijds, ook op eigen verzoek, worden ontslagen, de raad van toezicht gehoord.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.10
  - number: 12.10.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld omtrent tegemoetkomingen aan de leden van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.10
  - number: 12.10.5
    text: |-
      De raad van toezicht wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.10
  - number: '12.11'
    text: |-
      De raad van toezicht nodigt de raad van bestuur uit om de vergadering van de raad van toezicht geheel of
      gedeeltelijk bij te wonen, tenzij de raad van toezicht in een bepaald geval bij met redenen omkleed besluit anders
      beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.11
  - number: 12.12.1
    text: |-
      Onverminderd het overigens bij of krachtens deze wet bepaalde is de raad van toezicht belast met het houden van een
      voortdurend toezicht op al wat het academisch ziekenhuis aangaat, daaronder begrepen het toezicht op de naleving
      van de op het academisch ziekenhuis betrekking hebbende wetten alsmede van de krachtens die wetten uitgevaardigde
      regelingen, richtlijnen, aanwijzingen en reglementen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.12
  - number: 12.12.2
    text: |-
      Het bestuursreglement, de begroting, de jaarrekening en het jaarverslag behoeven de goedkeuring dan wel de
      instemming van de raad van toezicht. De goedkeuring dan wel de instemming wordt verleend of onthouden in zijn
      geheel dan wel met betrekking tot een of meer onderdelen. Indien binnen vier weken na ontvangst van een besluit als
      bedoeld in de eerste volzin, door de raad van toezicht niet anders is beslist is het besluit goedgekeurd dan wel
      wordt daarmee ingestemd. De raad van toezicht kan deze termijn verlengen tot ten hoogste acht weken. De goedkeuring
      kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.12
  - number: 12.12.3
    text: |-
      Indien binnen een door de raad van toezicht te bepalen termijn het bestuursreglement niet of niet volledig is
      vastgesteld, kan de raad van toezicht het bestuursreglement of het ontbrekende gedeelte daarvan vaststellen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.12
  - number: '12.13'
    text: |-
      De raad van toezicht is verantwoording verschuldigd aan Onze minister. Hij verstrekt Onze minister de gevraagde
      inlichtingen betreffende zijn handelingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.13
  - number: '12.15'
    text: |-
      Met inachtneming van het bepaalde bij of krachtens de [Wet toelating zorginstellingen][ref1] beslist de raad van
      bestuur, na overleg met het college van bestuur van de universiteit waaraan het ziekenhuis is verbonden, welke
      afdelingen en andere onderdelen het academisch ziekenhuis omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.15
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 12.16.1
    text: |-
      Onverminderd de verantwoordelijkheid van de raad van bestuur berust de verantwoordelijkheid voor de geneeskundige
      behandeling en verzorging der patiënten bij de hoofden van de desbetreffende afdelingen. Zij nemen daarbij de
      organisatorische en financiële kaders als aangegeven door de raad van bestuur in acht.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.16.2
    text: |-
      De afdelingshoofden worden als zodanig benoemd en ontslagen door de raad van bestuur. Tot afdelingshoofd wordt,
      in het algemeen, slechts benoemd een hoogleraar van de faculteit der geneeskunde, wiens vakgebied hem daarvoor in
      aanmerking doet komen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.16.3
    text: |-
      De in [artikel 12.2, tweede lid][ref1], bedoelde hoogleraren, niet zijnde afdelingshoofd, en andere leden van
      het wetenschappelijk personeel waarvan de functie meebrengt dat zij mede worden belast met patiëntenzorg behoeven
      tevens een aanstelling bij het academisch ziekenhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 12.16.4
    text: |-
      De benoeming en het ontslag van de in het tweede en derde lid bedoelde personen aan de universiteit behoeven de
      instemming van de raad van bestuur. De benoeming en het ontslag van de in het tweede en derde lid bedoelde personen
      aan het academisch ziekenhuis behoeven de instemming van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.16.5
    text: |-
      De raad van bestuur stelt in overeenstemming met het college van bestuur voor de in het tweede en derde lid
      bedoelde personen een instructie vast. In de instructie, bedoeld in de eerste volzin, wordt ten aanzien van de in
      het tweede en derde lid bedoelde personen, in ieder geval bepaald:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.16.5.a
    text: |-
      de wijze waarop de wederzijdse bevoegdheden van de raad van bestuur en het college van bestuur ten aanzien van die
      personen worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.16.5.b
    text: |-
      of het rechtspositieregime dat geldt voor het personeel van de universiteit dan wel het rechtspositieregime dat
      geldt voor het personeel van het academisch ziekenhuis van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.16
  - number: 12.17.1
    text: |-
      Er is een stafconvent, dat overeenkomstig in het bestuursreglement te stellen regelen medewerkt aan het bestuur van
      het academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.17
  - number: 12.17.2
    text: |-
      De samenstelling van het stafconvent wordt vastgesteld in het bestuursreglement met dien verstande, dat de
      afdelingshoofden in elk geval zitting hebben in dit convent.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.17
  - number: 12.17.3
    text: |-
      De leden van het stafconvent kiezen uit hun midden een voorzitter en een secretaris overeenkomstig in het
      bestuursreglement te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.17
  - number: 12.18.1
    text: |-
      De besturen van de rechtspersonen met volledige rechtsbevoegdheid waarvan de bijzondere universiteiten waaraan
      een academisch ziekenhuis is verbonden uitgaan, stellen regelen vast inzake het bestuur en de inrichting van hun
      academisch ziekenhuis. Bij de vaststelling van de regelen inzake het bestuur en de inrichting van het academisch
      ziekenhuis wordt [paragraaf 2][ref1] in acht genomen voorzover de eigen aard van het bijzonder academisch
      ziekenhuis zich daartegen naar het oordeel van het bestuur niet verzet. Zij brengen die regelen alsmede wijzigingen
      daarvan zo spoedig mogelijk ter kennis van Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.18.2
    text: |-
      De regelen alsmede de wijzigingen daarvan, bedoeld in het eerste lid, voldoen aan de in
      [artikel 1.14, tweede lid, onder c][ref1], bedoelde voorwaarde, indien Onze minister niet binnen drie maanden na
      de ontvangst van de mededeling bij een aan het bestuur gericht aangetekend schrijven heeft verklaard van oordeel te
      zijn, dat het bestuur bij de vaststelling van de regelen of de wijziging daarvan op door hem aan te wijzen punten
      [paragraaf 2][ref2] niet in acht heeft genomen en daartoe in redelijkheid geen beroep heeft kunnen doen op de eigen
      aard van het bijzonder academisch ziekenhuis die zich tegen inachtneming daarvan zou verzetten, of dat onvoldoende
      aannemelijk heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005682
        hoofdstuk: '12'
        paragraaf: '2'
  - number: 12.18.3
    text: |-
      De in het eerste lid bedoelde besturen geven aan Onze minister de nodige inlichtingen omtrent het academisch
      ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.18
  - number: 12.18.4
    text: |-
      De werking van het besluit van Onze minister, bedoeld in het tweede lid, wordt opgeschort totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.18
  - number: 12.19.1
    text: |-
      De universiteit en het daaraan verbonden academisch ziekenhuis richten gezamenlijk een gemeenschappelijk
      beleidsorgaan op.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.19
  - number: 12.19.2
    text: |-
      Het gemeenschappelijk beleidsorgaan heeft tot taak een doelmatige samenwerking op het terrein van het
      wetenschappelijk geneeskundig onderwijs en onderzoek tussen de universiteit en het academisch ziekenhuis te
      bevorderen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.19
  - number: 12.20.1
    text: |-
      De oprichting van een gemeenschappelijk beleidsorgaan geschiedt bij een gemeenschappelijke regeling, die
      wordt getroffen door het college van bestuur en de raad van bestuur, na overleg met de universiteitsraad of
      ondernemingsraad, onderscheidenlijk de raad van toezicht. De gemeenschappelijke regeling wordt door het college van
      bestuur en de raad van toezicht gezamenlijk aan Onze minister gezonden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.20
  - number: 12.20.2
    text: Onder het treffen van een gemeenschappelijke regeling wordt mede verstaan het wijzigen van die regeling.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.20
  - number: 12.20.3
    text: |-
      De gemeenschappelijke regeling voorziet in de samenstelling, de bevoegdheden, de taken en de werkwijze van het
      gemeenschappelijk beleidsorgaan met inachtneming van het in deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.20
  - number: 12.20.4
    text: |-
      In de gemeenschappelijke regeling wordt bepaald op welke wijze geschillen omtrent de uitvoering of toepassing
      daarvan worden beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.20
  - number: '12.21'
    text: |-
      Een universiteit en het daaraan verbonden academisch ziekenhuis voeren overleg over de onderlinge afstemming van
      hun werkzaamheden op het gebied van het wetenschappelijk geneeskundig onderwijs en onderzoek. Het gemeenschappelijk
      beleidsorgaan stelt het document vast, waarin de resultaten van dit overleg zijn vastgelegd. Voorzover de
      universiteit en het academisch ziekenhuis niet binnen redelijke tijd tot overeenstemming hebben kunnen komen, stelt
      het gemeenschappelijk beleidsorgaan zelf de onderlinge afstemming van werkzaamheden, bedoeld in de eerste volzin,
      vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.21
  - number: '12.22'
    text: |-
      Het college van bestuur en de raad van bestuur kunnen bij overeenkomst een gemeenschappelijk uitvoeringsorgaan
      instellen voor de uitvoering van het document, bedoeld in [artikel 12.21][ref1]. Daartoe voorziet de overeenkomst
      in de overdracht van bevoegdheden van het college van bestuur en van de raad van bestuur aan het gemeenschappelijk
      uitvoeringsorgaan. De besluiten van het gemeenschappelijk uitvoeringsorgaan, genomen krachtens enige door het
      college van bestuur overgedragen bevoegdheid kunnen bij koninklijk besluit worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel12
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.22
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '12'
        hoofdstuk: '12'
  - number: '12.23'
    text: |-
      Het bestuur van de faculteit der geneeskunde en de raad van bestuur stellen bij gezamenlijk besluit vast op welke
      wijze zij periodiek overleg voeren over aangelegenheden betreffende het wetenschappelijk geneeskundig onderwijs en
      onderzoek. Het in de eerste volzin bedoelde besluit regelt de samenstelling en de inrichting van het overleg.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel12.23
  - number: 13.1.1
    text: |-
      De bevoegdheid tot regeling en bestuur van de Koninklijke Nederlandse Akademie van Wetenschappen berust bij het
      algemeen bestuur, voorzover die bevoegdheid niet bij of krachtens deze wet aan andere organen van de academie
      is opgedragen. Het algemeen bestuur oefent de taken en bevoegdheden uit die bij of krachtens deze wet aan het
      instellingsbestuur zijn opgedragen, voorzover bij of krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
  - number: 13.1.2
    text: |-
      De leden van de academie vormen de algemene vergadering. De wijze waarop de leden van de academie worden benoemd,
      wordt geregeld in het reglement, bedoeld in [artikel 13.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.1.3
    text: De leden van het algemeen bestuur worden gekozen door en uit de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
  - number: 13.1.4
    text: |-
      Het algemeen bestuur is verantwoording verschuldigd aan de algemene vergadering. Het verstrekt de algemene
      vergadering en Onze minister de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
  - number: 13.1.5
    text: |-
      Onze minister kan aan een of meer leden van het algemeen bestuur een bezoldiging of toelage toekennen. Bij of
      krachtens algemene maatregel van bestuur worden regels vastgesteld betreffende de rechtspositie van de leden van
      het algemeen bestuur aan wie een bezoldiging is toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
  - number: 13.1.6
    text: De voorzitter van het algemeen bestuur vertegenwoordigt de academie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.1
  - number: 13.2.1
    text: |-
      Ten behoeve van de nadere regeling van het bestuur en de inrichting van de Koninklijke Nederlandse Akademie van
      Wetenschappen stelt de algemene vergadering met inachtneming van het daaromtrent bij of krachtens deze wet bepaalde
      een reglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.2
  - number: 13.2.2
    text: |-
      Het reglement regelt in elk geval de wijze van benoeming, schorsing en ontslag van de leden van het algemeen
      bestuur alsmede hun vervanging bij afwezigheid of ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.2
  - number: 13.2.3
    text: Het algemeen bestuur zendt het reglement en elke wijziging daarvan ter kennis aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.2
  - number: 13.3.1
    text: |-
      De bevoegdheid tot regeling en bestuur van de Koninklijke Bibliotheek berust bij het algemeen bestuur voorzover
      die bevoegdheid niet bij of krachtens deze wet aan de bibliothecaris is opgedragen. Het algemeen bestuur oefent de
      taken en bevoegdheden uit die bij of krachtens de wet aan het instellingsbestuur zijn opgedragen, voorzover bij of
      krachtens dit hoofdstuk niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: 13.3.2
    text: |-
      Het algemeen bestuur bestaat uit een voorzitter, tevens lid, en ten hoogste vier andere leden. Het aantal leden
      wordt door Onze minister bepaald.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: 13.3.3
    text: |-
      De leden van het algemeen bestuur worden door Onze minister benoemd, geschorst en ontslagen. De benoeming geschiedt
      voor een door Onze minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: 13.3.4
    text: |-
      De leden van het algemeen bestuur kunnen door Onze minister, de overige leden van het algemeen bestuur gehoord,
      worden geschorst en tussentijds ontslagen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: 13.3.5
    text: |-
      Onze minister kan aan een of meer leden van het algemeen bestuur een bezoldiging of toelage toekennen. Bij of
      krachtens algemene maatregel van bestuur worden regels vastgesteld betreffen de rechtspositie van de leden van het
      algemeen bestuur aan wie een bezoldiging is toegekend.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: 13.3.6
    text: De voorzitter van het algemeen bestuur vertegenwoordigt de bibliotheek in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.3
  - number: '13.4'
    text: Het algemeen bestuur is verantwoording verschuldigd aan Onze minister. Het verstrekt hem de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.4
  - number: 13.5.1
    text: |-
      Binnen het kader van het door het algemeen bestuur vastgestelde beleid berust de leiding van de Koninklijke
      Bibliotheek bij de bibliothecaris.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.5
  - number: 13.5.2
    text: De bibliothecaris heeft tot taak het beleid van het algemeen bestuur voor te bereiden en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.5
  - number: 13.6.1
    text: |-
      Ten behoeve van de nadere regeling van het bestuur en de inrichting van de Koninklijke Bibliotheek stelt het
      algemeen bestuur met inachtneming van het daaromtrent bij of krachtens deze wet bepaalde een reglement vast.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.6
  - number: 13.6.2
    text: |-
      Het reglement regelt in elk geval de vervanging van de leden van het algemeen bestuur bij afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.6
  - number: 13.6.3
    text: Het algemeen bestuur zendt het reglement en elke wijziging daarvan ter kennis aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.6
  - number: 13.8.1
    text: |-
      Het algemeen bestuur verschaft desgevraagd alsmede uit eigen beweging informatie over de instelling aan
      belanghebbenden en belangstellenden. Het reglement regelt in welke gevallen het verschaffen van informatie
      achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.8
  - number: 13.8.2
    text: |-
      Het algemeen bestuur stelt regels vast voor het berekenen van tarieven bij het op verzoek verschaffen van
      informatie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.8
  - number: 13.9.1
    text: |-
      De besluiten van het algemeen bestuur kunnen bij koninklijk besluit worden vernietigd. Het bepaalde in de eerste
      volzin is van overeenkomstige toepassing op het besluit van de algemene vergadering van de Koninklijke Nederlandse
      Akademie van Wetenschappen tot vaststelling of wijziging van het in [artikel 13.2][ref1] bedoelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel13
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '13'
        hoofdstuk: '13'
  - number: 13.9.2
    text: Het besluit tot schorsing of vernietiging wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.9
  - number: 13.10.1
    text: |-
      Indien het algemeen bestuur naar het oordeel van Onze minister zijn taak ernstig verwaarloost, kan Onze minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.10
  - number: 13.10.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het algemeen bestuur
      in de gelegenheid is gesteld om binnen een door Onze minister te stellen termijn alsnog zijn taak naar behoren uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.10
  - number: 13.10.3
    text: |-
      Onze minister stelt de beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel13.10
  - number: 14.1.1
    text: |-
      Tegen een besluit van Onze minister of het accreditatieorgaan jegens een bepaalde instelling op grond van de in het
      tweede lid genoemde artikelen kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de
      Raad van State.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
  - number: 14.1.2
    text: 'Het eerste lid heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
  - number: 14.1.2.a
    text: |-
      [artikel 1.9, zesde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 14.1.2.b
    text: |-
      [artikel 2.9, vierde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
        hoofdstuk: '2'
  - number: 14.1.2.c
    text: |-
      [artikel 5a.9][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
        hoofdstuk: 5a
  - number: 14.1.2.d
    text: |-
      [artikel 6.5][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 14.1.2.f
    text: |-
      [artikel 6.16][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
  - number: 14.1.2.g
    text: |-
      [artikel 15.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel15
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '15'
        hoofdstuk: '15'
  - number: 14.2.1
    text: |-
      Indien de uitspraak op een beroep tegen een beschikking als bedoeld in de
      [artikelen 6.14, vierde lid, tweede volzin][ref1] en [7.17][ref2], strekt tot registratie of goedkeuring, treden de
      gevolgen daarvan in met ingang van het studiejaar dat aanvangt na het kalenderjaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 14.2.2
    text: |-
      Indien tegen de uitspraak hoger beroep openstaat, wordt de werking van de uitspraak, bedoeld in het eerste
      lid, opgeschort totdat de termijn voor het instellen van hoger beroep is verstreken of, indien hoger beroep is
      ingesteld, op het hoger beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel14.2
  - number: 15.1.1
    text: |-
      Indien een of meer organen van een instelling als bedoeld in [artikel 1.2, onder a, c of d][ref1], in strijd
      handelen met het bepaalde bij of krachtens deze wet, kan Onze minister bepalen dat de rijksbijdrage, een voorschot
      daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
        hoofdstuk: '1'
  - number: 15.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien het instellingsbestuur, het personeel van een instelling of
      het accreditatieorgaan in strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.1.3
    text: |-
      Onze minister kent de rijksbijdrage wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.1
  - number: '15.2'
    text: |-
      Degene die niet is ingeschreven en gebruikmaakt van onderwijs- of examenvoorzieningen ten behoeve van
      initieel onderwijs van een in de bijlage van deze wet opgenomen instelling, is deswege aan die instelling een
      schadevergoeding verschuldigd, die door het instellingsbestuur wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.2
