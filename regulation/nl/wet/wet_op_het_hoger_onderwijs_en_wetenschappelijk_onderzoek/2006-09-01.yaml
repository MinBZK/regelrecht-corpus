  - number: 6.10.4
    text: |-
      Voordat Onze minister een besluit op grond van het eerste lid neemt, geeft hij het instellingsbestuur een
      waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en desgewenst
      overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg moet zijn
      gegeven, bedraagt ten minste drie maanden.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.10
  - number: 6.12.1
    text: |-
      Het besluit tot intrekking van de aanwijzing wordt door Onze minister genomen, indien de instelling geen opleiding
      die is geregistreerd in het Centraal register opleidingen hoger onderwijs, meer verzorgt.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.12
  - number: 6.12.2
    text: |-
      De aanwijzing kan door Onze minister worden ingetrokken, indien niet meer wordt voldaan aan de in
      [artikel 1.12, tweede of derde lid][ref1], bedoelde voorwaarden. [Artikel 6.10, vierde lid][ref2], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel6.12
