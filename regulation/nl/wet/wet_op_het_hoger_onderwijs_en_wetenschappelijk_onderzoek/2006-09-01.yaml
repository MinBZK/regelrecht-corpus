      opleidingen die voor de dag van de datum van inwerkingtreding van de wet van 6 juni 2002 (Stb. 303) zijn
      geregistreerd in het Centraal register opleidingen hoger onderwijs, is accreditatie verbonden tot en met
      31 december van het zesde jaar na de laatste beoordeling, bedoeld in [artikel 1.18, eerste lid][ref2], indien die
      beoordeling heeft plaatsgevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
