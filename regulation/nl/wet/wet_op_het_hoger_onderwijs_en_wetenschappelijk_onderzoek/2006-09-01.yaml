  - number: '15.3'
    text: |-
      Degene die niet is ingeschreven en gebruikt maakt van onderwijs- of examenvoorzieningen ten behoeve van initieel
      onderwijs van een in de bijlage van deze wet opgenomen instelling, wordt gestraft met geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.3
  - number: 15.4.1
    text: |-
      Degene die aan onderwijs- of examenvoorzieningen ten behoeve van initieel onderwijs aan een in de bijlage van deze
      wet opgenomen instelling deelneemt, is verplicht bij die gelegenheid of onmiddellijk daarna op eerste vordering van
      of vanwege het instellingsbestuur aan dat bestuur dan wel aan een door dat bestuur aangewezen persoon of personen
      zijn naam en adres bekend te maken en het bewijs waaruit blijkt dat hij gerechtigd is daaraan deel te nemen,
      behoorlijk ter inzage te geven.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.4
  - number: 15.4.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0005682/2006-09-01#Artikel15.4
  - number: '15.5'
    text: |-
