preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de loondoorbetalingsverplichting van de werkgever bij
    ziekte van de werknemer uit te breiden van zes naar 52 weken en daartoe het Burgerlijk Wetboek, de Ziektewet en
    enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelAanhef
articles:
  - number: XXXII
    text: |-
      De middelen van de afdelingskassen bedoeld in artikel 43 van de Organisatiewet sociale verzekeringen,
      alsmede de reserves bedoeld in [artikel 63 van de Ziektewet][ref1], zoals laatstgenoemde wet luidde op de
      dag voorafgaand aan de inwerkingtreding van deze wet, komen ten gunste van de wachtgeldfondsen, bedoeld in
      [artikel 102 van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel102
    url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelXXXII
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '102'
  - number: XXXIII
    text: |-
      1 [Artikel 1638][ref1] zoals dit artikel luidde op de dag voor de inwerkingtreding van deze wet blijft van
      toepassing op de arbeidsverhouding van de persoon:

      a. die op de dag voor de inwerkingtreding van deze wet ongeschikt is tot het verrichten van zijn arbeid wegens
      ziekte, zolang die ongeschiktheid duurt; of

      b. wiens ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte intreedt op of na de datum van
      inwerkingtreding van deze wet en tevens binnen vier weken nadat een voor die inwerkingtreding gelegen periode van
      ongeschiktheid door herstel is geëindigd, zolang die ongeschiktheid duurt.

      2 Voor de toepassing van het eerste lid geldt de ongeschiktheid tot het verrichten van arbeid wegens ziekte
      als niet onderbroken wanneer perioden van ongeschiktheid elkaar met een onderbreking van minder dan vier weken
      opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1638c
    url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelXXXIII
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1638c
  - number: XXXIV
    text: |-
      1 De [Ziektewet][ref1] en de daarop berustende bepalingen zoals deze luidden op de dag voor de inwerkingtreding van
      deze wet blijven van toepassing op het recht op ziekengeld van de verzekerde:

      a. die op de dag voor de inwerkingtreding van deze wet ongeschikt is tot het verrichten van zijn arbeid wegens
      ziekte, zolang die ongeschiktheid duurt; of

      b. wiens ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte intreedt op of na de datum van
      inwerkingtreding van deze wet en tevens binnen vier weken nadat een voor die inwerkingtreding gelegen periode van
      ongeschiktheid door herstel is geëindigd, zolang die ongeschiktheid duurt.

      2 Voor de toepassing van het eerste lid geldt de ongeschiktheid tot het verrichten van arbeid wegens ziekte
      als niet onderbroken wanneer perioden van ongeschiktheid elkaar met een onderbreking van minder dan vier weken
      opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelXXXIV
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: XXXV
    text: |-
      1 Het ziekengeld van de verzekerde op wie [artikel XXXIV][ref1] van deze wet van toepassing is komt ten laste het
      wachtgeldfonds.

      2 In afwijking van het eerste lid blijft de werkgever die op de dag voor de inwerkingtreding van deze wet het
      risico van de wettelijke ziekengeldverzekering zelf droeg, dit risico dragen ten aanzien van de verzekerde op wie
      [artikel XXXIV ][ref2] van deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007892#ArtikelXXXIV
      [ref2]: https://wetten.overheid.nl/BWBR0007892#ArtikelXXXIV
    url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelXXXV
