        artikel: XXXIV
        hoofdstuk: V
  - number: XXXVI
    text: |-
      [Artikel 64, derde lid, van de Ziektewet][ref1], blijft van toepassing op de persoon die op de dag voorafgaand aan
      de inwerkingtreding van deze wet op grond van dat artikellid vrijwillig verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
    url: https://wetten.overheid.nl/BWBR0007892/1999-02-17#ArtikelXXXVI
