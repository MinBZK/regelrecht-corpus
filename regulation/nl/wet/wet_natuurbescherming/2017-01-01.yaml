  - number: 1.3.5.a
    text: bij algemene maatregel van bestuur aangewezen categorieën van handelingen en projecten, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.5.b
    text: |-
      handelingen en projecten die geheel of gedeeltelijk plaatsvinden in of gevolgen hebben voor bij algemene maatregel
      van bestuur aangewezen categorieën van gebieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.6
    text: |-
      Ingeval toepassing wordt gegeven aan het vijfde lid, wordt waar in de bepalingen, genoemd in dat lid, sprake is van
      een provinciale verordening in plaats daarvan gelezen: ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.7
    text: |-
      Provinciale staten kunnen bevoegdheden, aan hen toegekend bij of krachtens deze wet, overdragen aan gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      Een wijziging van een bindende EU-rechtshandeling waarnaar in regels, gesteld bij of krachtens deze wet, wordt
      verwezen gaat voor de toepassing van die regels gelden met ingang van de dag waarop aan die wijziging uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een eerder
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.4
  - number: 1.5.1
    text: Onze Minister stelt een nationale natuurvisie vast.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      De nationale natuurvisie bevat de hoofdlijnen van het te voeren rijksbeleid gericht op het behoud en het zo
      mogelijk versterken van de biologische diversiteit, het duurzame gebruik van de bestanddelen daarvan en de
      bescherming van waardevolle landschappen, in nationaal en internationaal verband, en het behoud en het zo mogelijk
      versterken van de recreatieve, de educatieve en de belevingswaarde van natuur en landschap, in samenhang met het
      beleid om te komen tot een verduurzaming van de economie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3
    text: 'De nationale natuurvisie besteedt daarbij in het bijzonder aandacht aan:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.a
    text: |-
      het behoud en zonodig herstel van een gunstige staat van instandhouding van de van nature in Nederland in het wild
      voorkomende soorten dieren en planten en de in Nederland voorkomende typen natuurlijke habitats en habitats van
      soorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.b
    text: |-
      de borging van een evenwichtige, duurzame economische ontwikkeling en de integratie van het beleid gericht op het
      behoud van de biologische diversiteit met het algemene economisch beleid, de handelspolitiek, het landbouw- en
      visserijbeleid en het innovatiebeleid;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.c
    text: een goed functioneren van de ecosystemen in de onderscheiden natuurgebieden in onderlinge samenhang;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.d
    text: |-
      het behoud, beheer en zonodig herstel van landschappen van nationaal of internationaal belang, met inachtneming van
      hun cultuurhistorische kenmerken;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.e
    text: het duurzame beheer van houtopstanden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.f
    text: de gevolgen van klimaatveranderingen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.g
    text: de samenhang met het ruimtelijke beleid, het milieubeleid en het waterbeleid;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.h
    text: de samenhang met het beleid en de verantwoordelijkheden van andere overheden op dat terrein;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.3.i
    text: onderzoek op het terrein van de biologische diversiteit.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.4
    text: |-
      De nationale natuurvisie biedt, in de vorm van rode lijsten, inzicht in de met uitroeiing bedreigde of speciaal
      gevaar lopende dier- en plantensoorten die van nature in Nederland voorkomen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.5
    text: |-
      De nationale natuurvisie bevat voor zover mogelijk een kwantificering van de instandhoudingsdoelstellingen voor
      de in Natura 2000-gebieden en bijzondere nationale natuurgebieden te beschermen habitats en soorten en verschaft
      in samenhang daarmee en in samenhang met de staat van instandhouding van deze habitats en soorten inzicht in
      voorgenomen wijzigingen van de besluiten tot aanwijzing van die Natura 2000-gebieden en bijzondere nationale
      natuurgebieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.5.6
    text: Onderdelen van het rijksbeleid, bedoeld in het tweede lid, kunnen worden opgenomen in een andere rijksvisie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.5
  - number: 1.6.1
    text: |-
      Onze Minister draagt zorg voor actualisatie van de nationale natuurvisie en stelt zonodig een nieuwe visie of
      wijzigingen van onderdelen van de visie vast.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Op de voorbereiding van de natuurvisie en wijzigingen daarvan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, behalve ingeval van wijzigingen van
      ondergeschikte aard. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 1.6.3
    text: |-
      Onze Minister zendt de vastgestelde nationale natuurvisie en vastgestelde wijzigingen van de visie aan de Staten-
      Generaal en draagt zorg voor publicatie van de visie en wijzigingen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.6
  - number: 1.6.4
    text: |-
      Onze Minister stelt de nationale natuurvisie en wijzigingen daarvan vast in overeenstemming met Onze Minister van
      Infrastructuur en Milieu, onderscheidenlijk Onze Minister van Onderwijs, Cultuur en Wetenschappen, voor zover deze
      betrekking hebben op aangelegenheden die tot hun verantwoordelijkheid behoren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.6
  - number: 1.7.1
    text: Provinciale staten stellen een provinciale natuurvisie vast.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.2
    text: 'Een provinciale natuurvisie bevat de hoofdlijnen van:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.2.a
    text: |-
      het te voeren provinciale beleid gericht op het behoud en het zo mogelijk versterken van de biologische diversiteit
      en het duurzame gebruik van de bestanddelen daarvan, waartoe in elk geval behoort het beleid gericht op de
      uitvoering van de verplichtingen, genoemd in [artikel 1.12, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.7.2.b
    text: 'ingeval de provincie dat van belang acht:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.2.b.1°
    text: |-
      het te voeren provinciale beleid gericht op de uitvoering van de bevoegdheid, genoemd in
      [artikel 1.12, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.7.2.b.2°
    text: |-
      het te voeren provinciale beleid gericht op het behoud, beheer en zonodig herstel van waardevolle landschappen, met
      inachtneming van hun cultuurhistorische kenmerken, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.2.b.3°
    text: |-
      het te voeren provinciale beleid gericht op het behoud en het zo mogelijk versterken van de recreatieve, educatieve
      en belevingswaarde van natuur en landschap.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.3
    text: |-
      Een provinciale natuurvisie besteedt in het bijzonder aandacht aan de integratie van het in het tweede lid
      bedoelde provinciale beleid met het provinciale algemene economisch beleid, ruimtelijke beleid, milieubeleid,
      waterbeleid en cultuurbeleid, en aan de samenhang tussen het in het tweede lid bedoelde beleid en het beleid en de
      verantwoordelijkheden van andere overheden op dat terrein.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.4
    text: |-
      Onderdelen van het provinciale beleid, bedoeld in het tweede lid, kunnen worden opgenomen in een andere provinciale
      visie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.7.5
    text: |-
      [Artikel 1.6, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de provinciale natuurvisie, met
      dien verstande dat waar in dat eerste lid sprake is van Onze Minister, in plaats daarvan wordt gelezen: provinciale
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.7.6
    text: Provinciale staten dragen zorg voor publicatie van de provinciale natuurvisie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.7
  - number: 1.8.1
    text: |-
      Onze Minister ziet toe op de staat van instandhouding van de natuurlijke habitats, de habitats van soorten en de
      dier- en plantensoorten, genoemd in onderscheidenlijk de bijlagen I, II, IV en V bij de Habitatrichtlijn, en van de
      vogelsoorten, genoemd in bijlage I bij de Vogelrichtlijn, en de niet in die bijlage genoemde geregeld voorkomende
      trekvogelsoorten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.8
  - number: 1.8.2
    text: |-
      Onze Minister bevordert het onderzoek en wetenschappelijk werk, bedoeld in artikel 10, eerste lid, van de
      Vogelrichtlijn en artikel 18, eerste lid, van de Habitatrichtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.8
  - number: 1.8.3
    text: |-
      Onze Minister draagt zorg voor de verstrekking van gegevens aan de Europese Commissie overeenkomstig de vereisten
      van de Vogelrichtlijn en de Habitatrichtlijn. Voor zover het gaat om gegevens die betrekking hebben op door
      gedeputeerde staten of provinciale staten genomen besluiten of getroffen maatregelen, of om gegevens die betrekking
      hebben op de staat van instandhouding van de in het eerste lid bedoelde habitats en soorten in hun provincie,
      verstrekken gedeputeerde staten van de desbetreffende provincie deze aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Het Planbureau voor de Leefomgeving brengt eenmaal in de vier jaar aan Onze Minister een wetenschappelijk rapport
      uit, waarin de toestand en de verwachte ontwikkelingen ten aanzien van natuur, bos en landschap worden beschreven.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Het Planbureau voor de Leefomgeving brengt eenmaal in de twee jaar aan Onze Minister een wetenschappelijk rapport
      uit, waarin ten aanzien van natuur, bos en landschap, mede in het licht van in eerdere rapporten beschreven
      ontwikkelingen, de stand van zaken in de beleidsuitvoering, de voortgang en nieuwe ontwikkelingen worden
      beschreven.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.9
  - number: 1.9.3
    text: |-
      Onze Minister kan voor de toepassing van het eerste en tweede lid aanwijzingen geven ten aanzien van de termijn
      waarvoor de ontwikkelingen moeten worden beschreven en ten aanzien van veronderstelde ontwikkelingen die in elk
      geval moeten worden beschreven.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.9
  - number: 1.9.4
    text: |-
      Onze Minister tezamen met Onze Minister van Infrastructuur en Milieu, ieder voor zover het hem aangaat, wijst
      overheidsinstellingen aan die door het Planbureau voor de Leefomgeving in elk geval worden betrokken bij de op te
      stellen rapporten. Deze instellingen verschaffen elkaar de voor het opstellen van de rapporten benodigde gegevens.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.9
  - number: 1.9.5
    text: Onze Minister doet de rapporten, bedoeld in het eerste en tweede lid, toekomen aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.9
  - number: 1.10.1
    text: 'Deze wet is gericht op:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
  - number: 1.10.1.a
    text: |-
      het beschermen en ontwikkelen van de natuur, mede vanwege de intrinsieke waarde, en het behouden en herstellen van
      de biologische diversiteit;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
  - number: 1.10.1.b
    text: het doelmatig beheren, gebruiken en ontwikkelen van de natuur ter vervulling van maatschappelijke functies, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
  - number: 1.10.1.c
    text: |-
      het verzekeren van een samenhangend beleid gericht op het behoud en beheer van waardevolle landschappen,
      vanwege hun bijdrage aan de biologische diversiteit en hun cultuurhistorische betekenis, mede ter vervulling van
      maatschappelijke functies.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
  - number: 1.10.2
    text: |-
      Een bestuursorgaan oefent zijn taken en bevoegdheden op grond van deze wet uit met het oog op de doelen, genoemd in
      het eerste lid, zoals nader bepaald bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
  - number: 1.10.3
    text: |-
      Elk bestuursorgaan houdt bij het treffen van maatregelen op grond van deze wet rekening met de vereisten
      op economisch, sociaal en cultureel gebied, en met de regionale en lokale bijzonderheden, onverminderd de
      [artikelen 2.1, eerste lid][ref1], [2.8][ref2], met uitzondering van het negende lid, [3.3, vierde lid][ref3],
      en [3.8, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 1.11.1
    text: |-
      Een ieder neemt voldoende zorg in acht voor Natura 2000-gebieden, bijzondere nationale natuurgebieden en voor in
      het wild levende dieren en planten en hun directe leefomgeving.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
  - number: 1.11.2
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in elk geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten nadelige gevolgen kunnen worden veroorzaakt voor een Natura 2000-gebied, een
      bijzonder nationaal natuurgebied of voor in het wild levende dieren en planten:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
  - number: 1.11.2.a
    text: dergelijke handelingen achterwege laat, dan wel,
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
  - number: 1.11.2.b
    text: |-
      indien dat achterwege laten redelijkerwijs niet kan worden gevergd, de noodzakelijke maatregelen treft om die
      gevolgen te voorkomen, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
  - number: 1.11.2.c
    text: voor zover die gevolgen niet kunnen worden voorkomen, deze zoveel mogelijk beperkt of ongedaan maakt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
  - number: 1.11.3
    text: |-
      Het eerste lid is niet van toepassing op handelen of nalaten in overeenstemming met het bij of krachtens deze wet
      of de [Visserijwet 1963][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: 1.12.1
    text: |-
      Gedeputeerde staten van de provincies dragen, ieder in hun provincie, tezamen zorg voor het nemen van de nodige
      maatregelen voor:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.12.1.a
    text: |-
      de bescherming, de instandhouding of het herstel van biotopen en leefgebieden in voldoende gevarieerdheid voor alle
      in Nederland natuurlijk in het wild levende vogelsoorten en in het bijzonder de vogelsoorten, genoemd in bijlage I
      bij de Vogelrichtlijn, en de niet in die bijlage genoemde geregeld in Nederland voorkomende trekvogelsoorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.12.1.b
    text: |-
      het behoud of het herstel van een gunstige staat van instandhouding van de van nature in Nederland in het wild
      voorkomende soorten dieren en planten, genoemd in de bijlagen II, IV en V bij de Habitatrichtlijn, en van de in
      Nederland voorkomende typen natuurlijke habitats, genoemd in bijlage I bij de Habitatrichtlijn en habitats van
      soorten, genoemd in de bijlagen II, IV en V bij de Habitatrichtlijn, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.12.1.c
    text: |-
      het behoud of het herstel van een gunstige staat van instandhouding van de met uitroeiing bedreigde of
      speciaal gevaar lopende van nature in Nederland in het wild voorkomende dier- en plantensoorten, bedoeld in
      [artikel 1.5, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.12.2
    text: |-
      Met het oog op het eerste lid dragen gedeputeerde staten in hun provincie in elk geval zorg voor de totstandkoming
      en instandhouding van een samenhangend landelijk ecologisch netwerk, genaamd «natuurnetwerk Nederland». Zij wijzen
      daartoe in hun provincie gebieden aan die tot dit netwerk behoren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.12.3
    text: |-
      Gedeputeerde staten kunnen gebieden gelegen buiten het natuurnetwerk Nederland aanwijzen die van provinciaal belang
      zijn vanwege hun natuurwaarden of landschappelijke waarden, met inachtneming van hun cultuurhistorische kenmerken.
      Deze gebieden worden aangeduid als «bijzondere provinciale natuurgebieden», onderscheidenlijk «bijzondere
      provinciale landschappen».
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.12.4
    text: |-
      Door Onze Minister en gedeputeerde staten gezamenlijk wordt op adequate wijze de verantwoording inzake de geleverde
      inspanning voor het behalen van de doelstellingen uit de Vogel- en Habitatrichtlijn gemonitord. Onze Minister
      informeert de beide Kamers der Staten-Generaal over de voortgang van de totstandkoming en instandhouding van het
      natuurnetwerk Nederland op basis van de ter zake doende gegevens die door gedeputeerde staten zijn aangeleverd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.12
  - number: 1.13.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat een programma wordt vastgesteld dat tot doel
      heeft, mede met het oog op een evenwichtige, duurzame economische ontwikkeling:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.1.a
    text: |-
      de belasting van natuurwaarden van Natura 2000-gebieden of bijzondere nationale natuurgebieden door bij of
      krachtens deze maatregel aangewezen factoren te verminderen en de instandhoudingsdoelstellingen van die gebieden te
      realiseren, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.1.b
    text: |-
      de staat van instandhouding van de van nature in Nederland in het wild voorkomende soorten dieren of planten of de
      in Nederland voorkomende typen natuurlijke habitats of habitats van soorten te verbeteren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2
    text: 'Een algemene maatregel van bestuur als bedoeld in het eerste lid bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.a
    text: de aanwijzing van één of meer bestuursorganen die het programma vaststellen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.b
    text: regels over de betrokkenheid van andere bestuursorganen die het programma mede aangaat;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.c
    text: het tijdvak waarvoor het programma geldt;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.d
    text: regels over de wijze en de momenten waarop de resultaten van de maatregelen tussentijds worden beoordeeld;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.e
    text: voorwaarden waaronder het programma zonodig tussentijds kan worden gewijzigd;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f
    text: 'een verplichting tot opname in het programma van een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.1°
    text: |-
      de mate van belasting van de natuurwaarden door de aangewezen factor, onderscheidenlijk de staat van instandhouding
      aan het begin van het tijdvak van het programma;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.2°
    text: |-
      de verwachte autonome ontwikkelingen ten aanzien van de belasting van de natuurwaarden door de aangewezen factor,
      onderscheidenlijk de staat van instandhouding;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.3°
    text: |-
      de maatregelen die de belasting van de natuurwaarden door de aangewezen factor verminderen, onderscheidenlijk die
      de staat van instandhouding verbeteren;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.4°
    text: |-
      een sociaal-economische evaluatie en een weging van de haalbaarheid en betaalbaarheid van maatregelen als bedoeld
      in onderdeel 3°;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.5°
    text: de verwachte resultaten van maatregelen als bedoeld in onderdeel 3°;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.6°
    text: |-
      de doelstelling van het programma, al dan niet met tussendoelstellingen, of van indicatoren waaruit kan worden
      afgeleid in hoeverre een doelstelling is behaald;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.2.f.7°
    text: de resultaten van de ecologische beoordeling van het programma.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.3
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald dat in het programma
      uitgangspunten worden opgenomen voor de bepaling van ontwikkelingsruimte, voor de toedeling daarvan aan projecten
      of andere handelingen en de reservering daarvoor, en dat de ontwikkelingsruimte die beschikbaar is op het tijdstip
      van vaststelling van het programma, daarin wordt vermeld. Ingeval toepassing wordt gegeven aan de eerste volzin,
      worden bij of krachtens algemene maatregel van bestuur in elk geval regels gesteld over: - de toedeling van
      ontwikkelingsruimte aan en de reservering van die ruimte voor projecten of andere handelingen, de registratie
      daarvan,
        - de verdeling van de beschikbare ontwikkelingsruimte tussen de eerste en de tweede helft van het tijdvak van het
      programma,
        - het inzichtelijk maken van de beschikbaarheid van ontwikkelingsruimte gedurende het tijdvak van het programma en
      het daarop volgende programma;
        - de bevoegdheid van bestuursorganen om een onherroepelijk besluit waarin ontwikkelingsruimte is toegedeeld, in
      te trekken of te wijzigen, indien het project of de andere handeling waarop dat besluit betrekking heeft, niet is
      gerealiseerd, onderscheidenlijk is verricht;
        - de voorwaarden waaronder de bij of krachtens deze maatregel gestelde regels over de toedeling van
      ontwikkelingsruimte niet van toepassing zijn op bij of krachtens die maatregel aangewezen besluiten waarbij wordt
      getoetst of is voldaan aan [artikel 2.8][ref1], die bij het desbetreffende bestuursorgaan in voorbereiding zijn op
      het tijdstip van inwerkingtreding van het desbetreffende programma.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 1.13.4
    text: |-
      Op de voorbereiding van een besluit tot vaststelling van een programma als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 1.13.5
    text: |-
      De daartoe bevoegde bestuursorganen dragen zorg voor een tijdige uitvoering van de in een programma als bedoeld in
      het eerste lid opgenomen maatregelen, voor zover zij met het opnemen van die maatregelen hebben ingestemd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.6
    text: |-
      Ingeval uit een tussentijdse beoordeling als bedoeld in het tweede lid, onderdeel d, blijkt dat de doelstellingen
      van het programma op basis van de daarin opgenomen maatregelen niet behaald kunnen worden, draagt het
      bestuursorgaan dat het programma heeft vastgesteld zorg voor wijziging van het programma met het oog op opname van
      aanvullende maatregelen om de doelstellingen te behalen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.7
    text: |-
      Provinciale staten kunnen bij provinciale verordening bepalen dat een provinciaal programma wordt vastgesteld. Het
      eerste, tweede, derde, vierde, vijfde en zesde lid zijn van overeenkomstige toepassing. Waar in het eerste, tweede
      en derde lid sprake is van een algemene maatregel van bestuur of van een ministeriële regeling wordt in plaats
      daarvan gelezen: provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 1.13.8
    text: |-
      De inhoud van een programma als bedoeld in het eerste of zevende lid kan worden beschreven in een ander programma
      dat mede van belang is voor het bereiken van een doel als bedoeld in het eerste lid, onderdeel a of b. Ingeval dat
      andere programma wordt vastgesteld door een ander bevoegd gezag, vindt toepassing van de eerste volzin niet plaats
      dan na instemming van het bevoegde bestuursorgaan, bedoeld in het tweede lid, onderdeel a, onderscheidenlijk de
      provinciale staten, bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.13
  - number: 2.1.1
    text: |-
      Onze Minister wijst gebieden aan als speciale beschermingszones ter uitvoering van de artikelen 3, tweede lid,
      onderdeel a, en 4, eerste en tweede lid, van de Vogelrichtlijn en de artikelen 3, tweede lid, en 4, vierde lid, van
      de Habitatrichtlijn. De speciale beschermingszones worden aangeduid als «Natura 2000-gebied».
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Ingeval een gebied geheel of gedeeltelijk wordt beheerd door één van Onze andere Ministers, neemt Onze Minister een
      besluit als bedoeld in het eerste lid in overeenstemming met die andere Minister.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Bij een besluit als bedoeld in het eerste lid wordt als bijlage een kaart opgenomen waarop de begrenzing van het
      desbetreffende gebied nauwkeurig is aangegeven.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.4
    text: |-
      Een besluit als bedoeld in het eerste lid bevat instandhoudingsdoelstellingen voor het gebied. Daartoe behoren in
      elk geval de instandhoudingsdoelstellingen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.4.a
    text: de leefgebieden voor vogelsoorten, voor zover nodig ter uitvoering van de Vogelrichtlijn, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.4.b
    text: de natuurlijke habitats en de habitats van soorten, voor zover nodig ter uitvoering van de Habitatrichtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
  - number: 2.1.5
    text: |-
      Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.1.6
    text: |-
      Onze Minister draagt, mede in het licht van de toepassing van [artikel 1.8, eerste lid][ref1], en gevolg gevend
      aan het inzicht, bedoeld in [artikel 1.5, vijfde lid][ref2], zorg voor de actualisatie van de besluiten, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 2.1.7
    text: |-
      Onze Minister kan een besluit als bedoeld in het eerste lid wijzigen of geheel of
      gedeeltelijk intrekken. Op de voorbereiding van een besluit als bedoeld in de eerste volzin is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, behalve ingeval van wijzigingen van
      ondergeschikte aard. Bij een besluit tot gedeeltelijke intrekking of wijziging kan als bijlage een kaart worden
      opgenomen waarop de gewijzigde begrenzing van het desbetreffende gebied nauwkeurig is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.2.1
    text: |-
      Gedeputeerde staten dragen ervoor zorg dat in hun provincie instandhoudingsmaatregelen als bedoeld in de artikelen
      3, eerste lid en tweede lid, onderdelen b, c en d, en 4, eerste lid, eerste volzin, en tweede lid, van de
      Vogelrichtlijn en artikel 6, eerste lid, van de Habitatrichtlijn worden getroffen die nodig zijn voor Natura 2000-
      gebieden, gelet op de instandhoudingsdoelstellingen voor de onderscheiden gebieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Gedeputeerde staten dragen ervoor zorg dat in hun provincie passende maatregelen als bedoeld in artikel 6,
      tweede lid, van de Habitatrichtlijn worden getroffen die nodig zijn voor Natura 2000-gebieden, gelet op de
      instandhoudingsdoelstellingen voor de onderscheiden gebieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Gedeputeerde staten van de provincie waarin een op grond van [artikel 2.1][ref1] aangewezen Natura 2000-gebied is
      gelegen, stellen voor dat gebied een beheerplan vast. Op de voorbereiding van een besluit als bedoeld in de eerste
      volzin is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Zienswijzen kunnen naar voren
      worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.3.2
    text: |-
      Tot de inhoud van het beheerplan behoort in elk geval een beschrijving van de voor het Natura 2000-gebied, gelet op
      de instandhoudingsdoelstellingen:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      nodige instandhoudingsmaatregelen, bedoeld in de artikelen 3, eerste lid en tweede lid, onderdelen b, c en d, en 4,
      eerste lid, eerste volzin, en tweede lid, van de Vogelrichtlijn en artikel 6, eerste lid, van de Habitatrichtlijn
      en passende maatregelen, bedoeld in artikel 6, tweede lid, van de Habitatrichtlijn;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.2.b
    text: de beoogde resultaten van de maatregelen, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      De daartoe bevoegde bestuursorganen dragen zorg voor een tijdige uitvoering van de door hen te treffen, in het
      beheerplan opgenomen maatregelen, voor zover zij met het opnemen van die maatregelen hebben ingestemd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Een beheerplan wordt telkens vastgesteld voor een tijdvak van ten hoogste zes jaar. Na verloop van het tijdvak kan
      het tijdvak eenmaal met ten hoogste zes jaar worden verlengd. Het eerste beheerplan wordt vastgesteld uiterlijk
      drie jaar na dagtekening van het besluit tot aanwijzing van een gebied als Natura 2000-gebied.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.5
    text: |-
      In afwijking van het eerste lid kan de inhoud van het beheerplan, bedoeld in het tweede lid, een afzonderlijk
      onderdeel zijn van een ander plan of programma dat geheel of mede betrekking heeft op de inrichting, het beheer
      of het gebruik van een Natura 2000-gebied. Ingeval dat plan of programma wordt vastgesteld door een ander bevoegd
      gezag, geschiedt de opname van het onderdeel houdende het beheerplan voor het Natura 2000-gebied niet dan na
      instemming van de gedeputeerde staten, bedoeld in het eerste lid. Het derde lid en het vierde lid, derde volzin,
      zijn van overeenkomstige toepassing op dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Gedeputeerde staten kunnen een beheerplan wijzigen gedurende het tijdvak waarvoor het is
      vastgesteld. Bij de voorbereiding van een besluit tot wijziging van ondergeschikte aard of tot
      verlenging van het tijdvak als bedoeld in het vierde lid, behoeven zij geen toepassing te geven aan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2.4.1
    text: |-
      Gedeputeerde staten leggen, indien dat nodig is voor een Natura 2000-gebied, gelet op de
      instandhoudingsdoelstellingen, aan degene die in hun provincie een handeling verricht of het voornemen daartoe
      heeft, een verplichting op om:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.1.a
    text: informatie over de handeling te verstrekken;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.1.b
    text: de nodige preventieve of herstelmaatregelen te treffen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.1.c
    text: de handeling overeenkomstig daarbij gegeven voorschriften uit te voeren, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.1.d
    text: de handeling niet uit te voeren of te staken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Ingeval in het belang van de bescherming van een Natura 2000-gebied een onverwijlde tenuitvoerlegging van
      een besluit als bedoeld in het eerste lid noodzakelijk is, kunnen gedeputeerde staten het besluit bekendmaken
      door mondelinge mededeling aan degene die de handeling verricht of het voornemen daartoe heeft. Gedeputeerde
      staten stellen het besluit zo spoedig mogelijk alsnog op schrift en zenden dit toe of reiken dit uit aan de
      belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Provinciale staten stellen, indien dat nodig is voor een Natura 2000-gebied, gelet op de
      instandhoudingsdoelstellingen, ten aanzien van categorieën van handelingen bij verordening regels, houdende
      verplichtingen als bedoeld in het eerste lid. Ten aanzien van deze handelingen geven gedeputeerde staten geen
      toepassing aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.4.4
    text: Het is verboden te handelen in strijd met een verplichting als bedoeld in het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Gedeputeerde staten verbieden of beperken de toegang tot een in hun provincie gelegen Natura 2000-gebied
      of een in hun provincie gelegen gedeelte van een Natura 2000-gebied, indien dat nodig is gelet op de
      instandhoudingsdoelstellingen voor dat gebied.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Een verbod of beperking als bedoeld in het eerste lid geldt niet voor de eigenaar van een in het gebied gelegen
      onroerende zaak en voor degene die een zakelijk of persoonlijk gebruiksrecht heeft met betrekking tot die zaak,
      voor zover door het verbod of de beperking de toegang tot de onroerende zaak ernstig zou worden belemmerd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.5
  - number: 2.5.3
    text: Het is verboden in strijd te handelen met een verbod of beperking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.5
  - number: 2.6.1
    text: |-
      Gedeputeerde staten verrichten in hun provincie feitelijke handelingen of laten deze verrichten, indien dat nodig
      is gelet op de instandhoudingsdoelstellingen voor een Natura 2000-gebied.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Gedeputeerde staten kunnen in hun provincie in en rondom een Natura 2000-gebied de nodige kentekenen laten
      aanbrengen die de aanwijzing van dat gebied en de rechtsgevolgen daarvan kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.6
  - number: 2.6.3
    text: |-
      De eigenaar van de desbetreffende onroerende zaak en degene die een zakelijk of persoonlijk gebruiksrecht heeft met
      betrekking tot die zaak gedogen het verrichten van handelingen als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Gedeputeerde staten gaan niet over tot het verrichten van handelingen als bedoeld in het eerste of tweede lid,
      dan nadat zij de rechthebbenden, bedoeld in het derde lid, het voornemen daartoe schriftelijk hebben medegedeeld
      en na de mededeling ten minste vier weken zijn verstreken. Ingeval een onverwijlde verrichting van de handeling
      noodzakelijk is, kan de mededeling mondeling geschieden en geldt de termijn van vier weken niet.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Een bestuursorgaan stelt een plan dat niet direct verband houdt met of nodig is voor het beheer van een Natura
      2000-gebied, en dat afzonderlijk of in combinatie met andere plannen of projecten significante gevolgen kan hebben
      voor een Natura 2000-gebied, uitsluitend vast indien is voldaan aan [artikel 2.8][ref1], met uitzondering van het
      negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.7.2
    text: |-
      Het is verboden zonder vergunning van gedeputeerde staten projecten te realiseren of andere handelingen te
      verrichten die gelet op de instandhoudingsdoelstellingen voor een Natura 2000-gebied de kwaliteit van de
      natuurlijke habitats of de habitats van soorten in dat gebied kunnen verslechteren of een significant verstorend
      effect kunnen hebben op de soorten waarvoor dat gebied is aangewezen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
  - number: 2.7.3
    text: 'Gedeputeerde staten verlenen een vergunning als bedoeld in het tweede lid uitsluitend indien is voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
  - number: 2.7.3.a
    text: |-
      [artikel 2.8][ref1], met uitzondering van het negende lid, wanneer de vergunning betrekking heeft op een project
      dat niet direct verband houdt met of nodig is voor het beheer van een Natura 2000-gebied, en dat afzonderlijk of in
      combinatie met andere plannen of projecten significante gevolgen kan hebben voor een Natura 2000-gebied, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.7.3.b
    text: |-
      [artikel 2.8, negende lid][ref1], wanneer zij betrekking heeft op andere handelingen dan projecten als bedoeld
      in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.7.4
    text: |-
      Het verbod, bedoeld in het tweede lid, is niet van toepassing op projecten en andere handelingen ten aanzien
      waarvan bij of krachtens enige wettelijke bepaling een besluit is vereist, indien bij of krachtens die wet is
      bepaald dat dat besluit uitsluitend wordt vastgesteld indien is voldaan aan [artikel 2.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.8.1
    text: |-
      Voor een plan als bedoeld in [artikel 2.7, eerste lid][ref1], of een project als bedoeld in artikel 2.7, derde
      lid, onderdeel a, maakt het bestuursorgaan, onderscheidenlijk de aanvrager van de vergunning, een passende
      beoordeling van de gevolgen voor het Natura 2000-gebied, rekening houdend met de instandhoudingsdoelstellingen voor
      dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.8.2
    text: |-
      In afwijking van het eerste lid hoeft geen passende beoordeling te worden gemaakt, ingeval het plan of het project
      een herhaling of voortzetting is van een ander plan, onderscheidenlijk project, of deel uitmaakt van een ander
      plan, voor zover voor dat andere plan of project een passende beoordeling is gemaakt en een nieuwe passende
      beoordeling redelijkerwijs geen nieuwe gegevens en inzichten kan opleveren over de significante gevolgen van dat
      plan of project.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Het bestuursorgaan stelt het plan uitsluitend vast, en gedeputeerde staten verlenen voor het project, bedoeld in
      het eerste lid, uitsluitend een vergunning, indien uit de passende beoordeling de zekerheid is verkregen dat het
      plan, onderscheidenlijk het project de natuurlijke kenmerken van het gebied niet zal aantasten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      In afwijking van het derde lid kan, ondanks het feit dat uit de passende beoordeling de vereiste zekerheid niet is
      verkregen, het plan worden vastgesteld, onderscheidenlijk de vergunning worden verleend, indien is voldaan aan elk
      van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.4.a
    text: er zijn geen alternatieve oplossingen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.4.b
    text: |-
      het plan, onderscheidenlijk het project, bedoeld in het eerste lid, is nodig om dwingende redenen van groot
      openbaar belang, met inbegrip van redenen van sociale of economische aard, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.4.c
    text: |-
      de nodige compenserende maatregelen worden getroffen om te waarborgen dat de algehele samenhang van Natura 2000
      bewaard blijft.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.5
    text: |-
      Ingeval het plan, onderscheidenlijk het project, bedoeld in het eerste lid, significante gevolgen kan hebben voor
      een prioritair type natuurlijke habitat of een prioritaire soort in een Natura 2000-gebied, geldt, in afwijking van
      het vierde lid, onderdeel b, de voorwaarde dat het plan, onderscheidenlijk het project nodig is vanwege:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.5.a
    text: |-
      argumenten die verband houden met de menselijke gezondheid, de openbare veiligheid of met voor het milieu wezenlijk
      gunstige effecten, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.5.b
    text: andere dwingende redenen van openbaar belang, na advies van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.6
    text: |-
      Een advies van de Europese Commissie als bedoeld in het vijfde lid, onderdeel b, wordt door Onze Minister gevraagd.
      Het bestuursorgaan, onderscheidenlijk gedeputeerde staten doen daartoe een verzoek aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.7
    text: |-
      Compenserende maatregelen als bedoeld in het vierde lid, onderdeel c, maken onderdeel uit van het plan,
      onderscheidenlijk de verplichting om deze maatregelen te treffen maakt onderdeel uit van de vergunning voor het
      project, bedoeld in het eerste lid. Het bestuursorgaan dat het plan vaststelt meldt, onderscheidenlijk gedeputeerde
      staten melden de compenserende maatregelen aan Onze Minister, die de Europese Commissie van de maatregelen op de
      hoogte stelt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.8
    text: |-
      Ingeval een compenserende maatregel voorziet in de ontwikkeling of verbetering van leefgebieden voor vogels,
      natuurlijke habitats of habitats voor soorten buiten een Natura 2000-gebied, draagt Onze Minister ervoor zorg dat
      deze leefgebieden of habitats een Natura 2000-gebied, of een onderdeel van een Natura 2000-gebied worden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
  - number: 2.8.9
    text: |-
      Voor een andere handeling als bedoeld in [artikel 2.7, derde lid, onderdeel b][ref1], houden gedeputeerde staten
      bij het verlenen van de vergunning rekening met de gevolgen die de handeling kan hebben voor een Natura 2000-
      gebied, gelet op de instandhoudingsdoelstellingen voor dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.1
    text: |-
      Het verbod, bedoeld in [artikel 2.7, tweede lid][ref1], is niet van toepassing op projecten en andere handelingen
      die zijn beschreven in en worden gerealiseerd, onderscheidenlijk verricht overeenkomstig een beheerplan als bedoeld
      in [artikel 2.3][ref2] of een programma als bedoeld in [artikel 1.13, eerste, zevende, of achtste lid][ref3], of
      een plan of programma als bedoeld in artikel 2.3, vijfde lid, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 2.9.1.a
    text: |-
      ten aanzien van het plan of het programma, althans het desbetreffende onderdeel, een passende beoordeling van
      projecten is uitgevoerd waaruit de zekerheid is verkregen dat het project de natuurlijke kenmerken van het Natura
      2000-gebied niet zal aantasten, onderscheidenlijk rekening is gehouden met de mogelijke gevolgen van andere
      handelingen voor het Natura 2000-gebied, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.1.b
    text: |-
      het bestuursorgaan dat het plan of het programma heeft vastgesteld tevens bevoegd is voor de verlening van een
      vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], voor een dergelijk project, onderscheidenlijk een
      dergelijke handeling, of, als dat niet het geval is, het laatstbedoelde bestuursorgaan heeft ingestemd met het
      onderdeel van het plan of programma dat betrekking heeft op het project, onderscheidenlijk de andere handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.2
    text: |-
      Het verbod, bedoeld in [artikel 2.7, tweede lid][ref1], is niet van toepassing op andere handelingen als bedoeld
      in artikel 2.7, derde lid, onderdeel b, die op de referentiedatum bekend waren, of redelijkerwijs bekend hadden
      kunnen zijn bij het bestuursorgaan dat bevoegd is voor de verlening van de vergunning, en zij sedertdien niet of
      niet in betekenende mate zijn gewijzigd. De referentiedatum, bedoeld in de eerste volzin, is:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.2.a
    text: 31 maart 2010, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.2.b
    text: |-
      ingeval het desbetreffende gebied eerst na 31 maart 2010 een Natura 2000-gebied is geworden, een door Onze Minister
      te bepalen datum die niet later is gelegen dan de datum waarop dat gebied een Natura 2000-gebied is geworden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Het verbod, bedoeld in [artikel 2.7, tweede lid][ref1], is niet van toepassing op projecten en andere handelingen,
      behorende tot door provinciale staten bij verordening aangewezen categorieën van projecten, onderscheidenlijk
      andere handelingen, indien ten aanzien van het project, onderscheidenlijk de handeling is voldaan aan bij of
      krachtens die verordening gestelde regels. Deze regels kunnen in elk geval betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.3.a
    text: de wijze waarop een project wordt gerealiseerd, onderscheidenlijk een handeling wordt verricht;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.3.b
    text: |-
      de ligging van de locatie waar een project wordt gerealiseerd, onderscheidenlijk een handeling wordt verricht ten
      opzichte van een Natura 2000-gebied, een natuurlijke habitat of een habitat van een soort in dat gebied;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.3.c
    text: |-
      de te verrichten onderzoeken naar de gevolgen van de realisatie van een project, onderscheidenlijk de verrichting
      van een handeling voor de natuurlijke kenmerken van een Natura 2000-gebied;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.3.d
    text: |-
      de voorafgaand aan of tijdens de realisatie van een project, onderscheidenlijk de verrichting van een handeling te
      treffen maatregelen om te voorkomen dat de natuurlijke kenmerken van een Natura 2000-gebied worden aangetast;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.3.e
    text: |-
      de melding van het voornemen een project te realiseren, onderscheidenlijk een handeling te verrichten aan een bij
      of krachtens de verordening aangewezen bestuursorgaan, de termijn waarbinnen de melding wordt gedaan en de wijze
      waarop, en de daarbij te overleggen gegevens.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.4
    text: 'Op grond van het derde lid kunnen uitsluitend categorieën van:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.4.a
    text: |-
      projecten als bedoeld in [artikel 2.7, derde lid, onderdeel a][ref1], worden aangewezen ten aanzien waarvan op
      voorhand op grond van objectieve gegevens kan worden uitgesloten dat zij afzonderlijk of in combinatie met andere
      plannen of projecten de natuurlijke kenmerken van een Natura 2000-gebied zullen aantasten;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.4.b
    text: |-
      andere handelingen als bedoeld in [artikel 2.7, derde lid, onderdeel b][ref1], worden aangewezen ten aanzien
      waarvan op voorhand rekening is gehouden met de gevolgen die de handeling kan hebben voor een Natura 2000-gebied,
      gelet op de instandhoudingsdoelstellingen voor dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.5
    text: |-
      Ingeval op grond van [artikel 1.13, eerste lid, aanhef in samenhang met onderdeel a][ref1], een programma is
      vastgesteld dat betrekking heeft op Natura 2000-gebieden, kan bij algemene maatregel van bestuur worden bepaald
      dat het verbod, bedoeld in [artikel 2.7, tweede lid][ref2], met betrekking tot een Natura 2000-gebied gedurende de
      periode waarvoor het programma geldt, niet van toepassing is op projecten en andere handelingen ten aanzien waarvan
      is voldaan aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.5.a
    text: 'het project of de andere handeling:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.5.a.1°
    text: |-
      veroorzaakt een belasting van natuurwaarden van het desbetreffende Natura 2000-gebied door de factor waarvoor
      het programma is vastgesteld, die afzonderlijk en, ingeval het project of de handeling betrekking heeft op een
      inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref1], in cumulatie met andere
      projecten of andere handelingen met betrekking tot dezelfde inrichting in de periode waarvoor het programma geldt,
      de waarde die bij die algemene maatregel van bestuur voor het desbetreffende Natura 2000-gebied is vastgesteld niet
      overschrijdt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.9.5.a.2°
    text: |-
      behoort tot een bij die algemene maatregel van bestuur aangewezen categorie van projecten of andere handelingen en
      wordt gerealiseerd, onderscheidenlijk wordt verricht op een grotere afstand gerekend tot het desbetreffende Natura
      2000-gebied dan voor de desbetreffende categorie van projecten of andere handelingen bij die algemene maatregel van
      bestuur is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.5.b
    text: |-
      het project of de andere handeling heeft voor het desbetreffende Natura 2000-gebied geen andere gevolgen
      dan de belasting van natuurwaarden door de factor waarvoor het programma is vastgesteld, die gelet op de
      instandhoudingsdoelstellingen, de kwaliteit van de natuurlijke habitats en de habitats van soorten in het
      desbetreffende Natura 2000-gebied kunnen verslechteren of een significant verstorend effect kunnen hebben op de
      soorten waarvoor het gebied is aangewezen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.6
    text: |-
      De waarde, onderscheidenlijk de afstand, bedoeld in het vijfde lid, onderdeel a, kan voor de onderscheiden Natura
      2000-gebieden verschillend worden vastgesteld. De waarde, onderscheidenlijk de afstand wordt zodanig vastgesteld
      dat:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.6.1°
    text: geen afbreuk wordt gedaan aan de doelstelling van het desbetreffende programma, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.6.2°
    text: |-
      op voorhand op grond van objectieve gegevens kan worden uitgesloten dat projecten of andere handelingen als bedoeld
      in het vijfde lid afzonderlijk of in combinatie met andere plannen of projecten de natuurlijke kenmerken van een
      Natura 2000-gebied zullen aantasten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.9.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop wordt vastgesteld of plannen, projecten
      of andere handelingen gevolgen als bedoeld in [artikel 2.7, eerste of tweede lid][ref1], kunnen hebben. Deze
      regels kunnen onder meer betrekking hebben op rekenmodellen, onderzoeksmethoden of meetmethoden waarmee gevolgen
      kunnen worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.9.8
    text: |-
      Bij ministeriële regeling kan aan degenen die projecten realiseren of andere handelingen verrichten waarop
      het vijfde lid van toepassing is, een verplichting worden opgelegd tot het melden van het project of de andere
      handeling bij het bij die regeling aan te wijzen bestuursorgaan, indien het project of de andere handeling behoort
      tot een bij die regeling aangewezen categorie van projecten, onderscheidenlijk andere handelingen. Bij deze
      regeling kunnen regels worden gesteld over de wijze waarop deze melding wordt gedaan en over de bij de melding te
      verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Ingeval een Natura 2000-gebied geheel of gedeeltelijk wordt beheerd door één van Onze andere Ministers berusten
      voor dat gebied, onderscheidenlijk dat gedeelte:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
  - number: 2.10.1.a
    text: |-
      de in [artikel 2.2][ref1] opgenomen verplichtingen, voor zover deze het treffen van feitelijke maatregelen of de
      uitoefening van in andere wetten aan Onze betrokken Minister toegekende bevoegdheden in het gebied of gedeelte van
      het gebied met zich brengen, en de in [artikelen 2.3][ref2] en [2.6][ref3] bedoelde bevoegdheden bij:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.10.1.a.1°
    text: |-
      Onze Minister van Infrastructuur en Milieu, ingeval het gebied, onderscheidenlijk het gedeelte, een
      oppervlaktewaterlichaam als bedoeld in de [Waterwet][ref1] is, dat op grond van die wet wordt beheerd door het
      Rijk;


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 2.10.1.a.2°
    text: Onze Minister van Defensie, ingeval het gebied, onderscheidenlijk het gedeelte, een militair terrein is, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
  - number: 2.10.1.a.3°
    text: |-
      Onze Minister ingeval het gebied, onderscheidenlijk het gedeelte, wordt beheerd door één van Onze andere Ministers
      dan die, bedoeld onder 1° en 2°;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
  - number: 2.10.1.b
    text: |-
      de in [artikel 2.5][ref1] bedoelde bevoegdheden bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.10.2
    text: |-
      Onze Ministers nemen op grond van het eerste lid geen besluiten dan na overleg met gedeputeerde staten van de
      provincies waarin het Natura 2000-gebied is gelegen, tenzij spoed is geboden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Ingeval een Natura 2000-gebied is gelegen in meer dan één provincie, wordt het beheerplan, bedoeld in
      [artikel 2.3][ref1], voor dat gebied vastgesteld door gedeputeerde staten van de provincie waarin het Natura 2000-
      gebied grotendeels is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.10.4
    text: |-
      Gedeputeerde staten nemen op grond van het derde lid geen besluiten dan in overeenstemming met gedeputeerde staten
      van de provincies waarin het Natura 2000-gebied mede is gelegen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      Ingeval een Natura 2000-gebied is gelegen in meer dan één provincie, wordt het besluit,
      bedoeld in [artikel 2.5, eerste lid][ref1], niet genomen en worden de bevoegdheden, bedoeld in
      [artikel 2.6, eerste en tweede lid][ref2], niet uitgeoefend dan in overeenstemming met gedeputeerde staten van de
      provincie waarin het Natura 2000-gebied mede is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.11.1
    text: |-
      Onze Minister kan een gebied, niet zijnde een Natura 2000-gebied, als bijzonder nationaal natuurgebied aanwijzen
      ingeval:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
  - number: 2.11.1.a
    text: het gebied is opgenomen op een lijst als bedoeld in artikel 4, eerste lid, van de Habitatrichtlijn;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
  - number: 2.11.1.b
    text: het gebied onderwerp is van een procedure als bedoeld in artikel 5 van de Habitatrichtlijn;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
  - number: 2.11.1.c
    text: |-
      in het gebied leefgebieden voor vogels, natuurlijke habitats of habitats van soorten worden ontwikkeld of verbeterd
      ter uitvoering van een compenserende maatregel als bedoeld in [artikel 2.8, vierde lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.11.1.d
    text: |-
      bescherming van het gebied nodig is voor de instandhouding of het herstel van biotopen en leefgebieden voor in
      Nederland natuurlijk in het wild levende vogelsoorten, genoemd in bijlage I bij de Vogelrichtlijn, en de niet
      in die bijlage genoemde geregeld in Nederland voorkomende trekvogelsoorten, of het behoud of herstel van een
      gunstige staat van instandhouding van de natuurlijke habitats, de habitats van soorten of de soorten, genoemd in
      onderscheidenlijk de bijlagen I, II, IV of V bij de Habitatrichtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Op een besluit als bedoeld in het eerste lid is
      [artikel 2.1, tweede, derde, vierde, vijfde, zesde en zevende lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.11.3
    text: |-
      De [artikelen 2.4][ref1], [2.5][ref2] en [2.6][ref3] zijn van overeenkomstige toepassing ten aanzien van krachtens
      het eerste lid aangewezen gebieden, met dien verstande dat de desbetreffende bevoegdheden en verantwoordelijkheden
      berusten bij Onze Minister, tenzij deze bij algemene maatregel van bestuur zijn overgedragen aan gedeputeerde
      staten of provinciale staten. [Artikel 2.10, tweede lid][ref4], is van overeenkomstige toepassing op door Onze
      Minister te nemen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.11.4
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het derde lid wordt niet gedaan dan nadat
      over de daarin te regelen overdracht van bevoegdheden en verantwoordelijkheden overeenstemming is bereikt met
      gedeputeerde staten van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel2.11
  - number: 3.1.1
    text: |-
      Het is verboden opzettelijk van nature in Nederland in het wild levende vogels van soorten als bedoeld in artikel 1
      van de Vogelrichtlijn te doden of te vangen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het is verboden opzettelijk nesten, rustplaatsen en eieren van vogels als bedoeld in het eerste lid te vernielen of
      te beschadigen, of nesten van vogels weg te nemen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.1
  - number: 3.1.3
    text: Het is verboden eieren van vogels als bedoeld in het eerste lid te rapen en deze onder zich te hebben.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.1
  - number: 3.1.4
    text: Het is verboden vogels als bedoeld in het eerste lid opzettelijk te storen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Het verbod, bedoeld in het vierde lid, is niet van toepassing indien de storing niet van wezenlijke invloed is op
      de staat van instandhouding van de desbetreffende vogelsoort.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Het is verboden vogels van soorten als bedoeld in artikel 1 van de Vogelrichtlijn dood of levend, of gemakkelijk
      herkenbare delen daarvan, of uit deze vogels verkregen producten te verkopen, te vervoeren voor verkoop, onder zich
      te hebben voor verkoop of ten verkoop aan te bieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van vogels van soorten, genoemd in
      bijlage III, deel A, bij de Vogelrichtlijn, die aantoonbaar overeenkomstig het bepaalde bij of krachtens deze wet
      zijn gedood of gevangen, onderscheidenlijk verkregen, en ten aanzien van delen of producten van die vogels.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van bij algemene maatregel van
      bestuur aangewezen vogels van soorten, genoemd in bijlage III, deel B, bij de Vogelrichtlijn, die aantoonbaar
      overeenkomstig het bepaalde bij of krachtens deze wet zijn gedood of gevangen, onderscheidenlijk verkregen, en ten
      aanzien van delen of producten van die vogels.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de verkoop, het vervoer voor
      verkoop, het onder zich hebben voor verkoop of het ten verkoop aanbieden van vogels van soorten, aangewezen op
      grond van het derde lid, en delen of producten van die vogels.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.2.5
    text: |-
      Een vogelsoort wordt op grond van het derde lid uitsluitend aangewezen, indien de handelingen, bedoeld in
      het eerste lid, uitgevoerd overeenkomstig regels als bedoeld in het vierde lid, er niet toe leiden dat het
      populatieniveau, de geografische verspreiding of de omvang van de voortplanting van deze soort in gevaar wordt
      gebracht of kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.2.6
    text: |-
      Het is verboden, anders dan voor verkoop, vogels, delen of producten als bedoeld in het eerste lid, onder zich
      te hebben of te vervoeren, tenzij deze vogels, delen of producten aantoonbaar overeenkomstig het bepaalde bij of
      krachtens deze wet zijn gedood of gevangen, onderscheidenlijk verkregen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Gedeputeerde staten kunnen ontheffing verlenen van verboden als bedoeld in [artikel 3.1][ref1] of
      [artikel 3.2, zesde lid][ref2], ten aanzien van vogels van daarbij aangewezen soorten, dan wel ten aanzien van hun
      nesten, rustplaatsen of eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.2
    text: |-
      Provinciale staten kunnen bij verordening vrijstelling verlenen van verboden als bedoeld in [artikel 3.1][ref1] of
      [artikel 3.2, zesde lid][ref2], ten aanzien van vogels van daarbij aangewezen soorten, dan wel ten aanzien van hun
      nesten, rustplaatsen of eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.3
    text: 'Onze Minister kan ontheffing of vrijstelling verlenen van:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.3.a
    text: |-
      de verboden, bedoeld in [artikel 3.2, eerste lid][ref1], ten aanzien van vogels, dood of levend, of gemakkelijk
      herkenbare delen daarvan, of ten aanzien van uit deze vogels verkregen producten van daarbij aangewezen soorten, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.3.b
    text: |-
      regels, gesteld krachtens [artikel 3.2, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.4
    text: |-
      Een ontheffing of een vrijstelling wordt uitsluitend verleend, indien is voldaan aan elk van de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.a
    text: er bestaat geen andere bevredigende oplossing;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b
    text: 'zij is nodig:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.1°
    text: in het belang van de volksgezondheid of de openbare veiligheid;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.2°
    text: in het belang van de veiligheid van het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.3°
    text: ter voorkoming van belangrijke schade aan gewassen, vee, bossen, visserij of wateren;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.4°
    text: ter bescherming van flora of fauna;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.5°
    text: voor onderzoek of onderwijs, het uitzetten of herinvoeren van soorten, of voor de daarmee samenhangende teelt, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.b.6°
    text: |-
      om het vangen, het onder zich hebben of elke andere wijze van verstandig gebruik van bepaalde vogels in kleine
      hoeveelheden selectief en onder strikt gecontroleerde omstandigheden toe te staan;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.4.c
    text: de maatregelen leiden niet tot verslechtering van de staat van instandhouding van de desbetreffende soort.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.5
    text: |-
      In een ontheffing, onderscheidenlijk vrijstelling worden in elk geval voorschriften opgenomen, onderscheidenlijk
      regels gesteld, over:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.5.a
    text: |-
      de middelen, installaties of methoden voor het vangen of doden, waarbij enkel het gebruik wordt toegestaan van bij
      algemene maatregel van bestuur aangewezen middelen, installaties of methoden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.5.b
    text: de tijd en plaats waarvoor de ontheffing of vrijstelling geldt, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.5.c
    text: de wijze waarop het risico voor het behoud van de vogelstand wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.6
    text: |-
      De verboden, bedoeld in de [artikelen 3.1][ref1] en [3.2, zesde lid][ref2], zijn niet van toepassing op handelingen
      ten aanzien waarvan bij of krachtens enige wettelijke bepaling een besluit is vereist, indien bij of krachtens
      die wet is bepaald dat het desbetreffende besluit de handelingen uitsluitend toelaat indien is voldaan aan de
      voorwaarden, bedoeld in het vierde lid, en dat aan het besluit de voorschriften worden verbonden, bedoeld in het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.7
    text: |-
      De verboden, bedoeld in de [artikelen 3.1][ref1] en [3.2, zesde lid][ref2], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.7.a
    text: |-
      handelingen ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als bedoeld in
      [artikel 2.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.3.7.b
    text: |-
      handelingen die zijn beschreven in en worden verricht overeenkomstig een beheerplan als bedoeld in
      [artikel 2.3, eerste lid][ref1], een plan of een programma als bedoeld in artikel 2.3, vijfde lid, of een
      programma als bedoeld in [artikel 1.13, eerste, zevende, of achtste lid][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 3.3.7.b.1°
    text: |-
      ten aanzien van het beheerplan, het plan of het programma, althans het onderdeel dat betrekking heeft op de
      desbetreffende handelingen, is voldaan aan het in het vierde en vijfde lid bepaalde ten aanzien van ontheffingen en
      vrijstellingen, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.3.7.b.2°
    text: |-
      het bestuursorgaan dat het beheerplan, het plan of het programma heeft vastgesteld tevens bevoegd is voor
      de verlening van een ontheffing, onderscheidenlijk vrijstelling als bedoeld in het eerste, onderscheidenlijk
      tweede lid voor dergelijke handelingen, of, als dat niet het geval is, het beheerplan, het plan of het programma
      is vastgesteld in overeenstemming met het bestuursorgaan dat bevoegd is voor de verlening van de ontheffing,
      onderscheidenlijk vrijstelling.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Ingeval het vangen of doden van vogels als bedoeld in [artikel 3.1, eerste lid][ref1], bij of krachtens deze wet
      is toegestaan, is het verboden deze vogels:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.4.1.a
    text: 'te vangen of te doden met:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.1.a.1°
    text: middelen, genoemd in bijlage IV, onderdeel a, bij de Vogelrichtlijn;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.1.a.2°
    text: middelen, installaties of methoden voor massaal of niet-selectief vangen of doden van vogels, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.1.a.3°
    text: middelen, installaties of methoden waardoor een soort plaatselijk kan verdwijnen, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.1.b
    text: |-
      te achtervolgen met behulp van vervoermiddelen, genoemd in bijlage IV, onderdeel b, bij de Vogelrichtlijn,
      overeenkomstig de daar beschreven wijze.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      Gedeputeerde staten kunnen ontheffing verlenen en provinciale staten kunnen bij verordening vrijstelling verlenen
      van een of meer van de verboden, bedoeld in het eerste lid. [Artikel 3.3, vierde en vijfde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.4.3
    text: |-
      Onze Minister kan ontheffing verlenen van het verbod, bedoeld in het eerste lid, aanhef en onderdeel b, voor het
      gebruik van motorboten op open zee onder de in bijlage IV, onderdeel b, tweede gedachtestreep, tweede volzin, bij
      de Vogelrichtlijn genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Bij algemene maatregel van bestuur kunnen middelen, installaties of methoden worden aangewezen die in elk geval
      worden gerekend tot de middelen, installaties, onderscheidenlijk methoden, bedoeld in het eerste lid, onderdeel a,
      onder 2° of 3°.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Het is verboden in het wild levende dieren van soorten, genoemd in bijlage IV, onderdeel a, bij de
      Habitatrichtlijn, bijlage II bij het Verdrag van Bern of bijlage I bij het Verdrag van Bonn, in hun natuurlijk
      verspreidingsgebied opzettelijk te doden of te vangen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.5
  - number: 3.5.2
    text: Het is verboden dieren als bedoeld in het eerste lid opzettelijk te verstoren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.5
  - number: 3.5.3
    text: Het is verboden eieren van dieren als bedoeld in het eerste lid in de natuur opzettelijk te vernielen of te rapen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Het is verboden de voortplantingsplaatsen of rustplaatsen van dieren als bedoeld in het eerste lid te beschadigen
      of te vernielen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.5
  - number: 3.5.5
    text: |-
      Het is verboden planten van soorten, genoemd in bijlage IV, onderdeel b, bij de Habitatrichtlijn of bijlage I
      bij het Verdrag van Bern, in hun natuurlijke verspreidingsgebied opzettelijk te plukken en te verzamelen, af te
      snijden, te ontwortelen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Het is verboden dieren of planten van soorten, genoemd in bijlage IV bij de Habitatrichtlijn, bijlage I of II bij
      het Verdrag van Bern of bijlage I bij het Verdrag van Bonn, onder zich te hebben voor verkoop, te vervoeren voor
      verkoop, te verhandelen, te ruilen of te koop of te ruil aan te bieden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Het is verboden, anders dan voor verkoop, dieren of planten als bedoeld in het eerste lid onder zich te hebben of
      te vervoeren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing ingeval de in dat lid bedoelde dieren en
      planten aantoonbaar zijn gefokt of gekweekt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het aan de natuur onttrekken en de
      exploitatie van daarbij aangewezen dieren of planten van soorten, genoemd in bijlage V bij de Habitatrichtlijn of
      bijlage III bij het Verdrag van Bern, indien dat nodig is voor het behoud of het bereiken van een gunstige staat
      van instandhouding van die soorten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2
    text: 'De regels, bedoeld in het eerste lid, kunnen:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a
    text: 'in elk geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.1°
    text: het beperken of verbieden van de toegang tot bepaalde terreinen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.2°
    text: |-
      het in een bepaald gebied beperken of verbieden van de onttrekking aan de natuur of exploitatie van dieren of
      planten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.3°
    text: de wijze van onttrekking van dieren of planten aan de natuur;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.4°
    text: het beperken van het aantal dieren of planten dat ten hoogste aan de natuur mag worden onttrokken;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.5°
    text: |-
      het kopen, het verkopen, het te koop aanbieden, het onder zich hebben en het vervoeren voor verkoop van dieren
      of planten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.6°
    text: het in gevangenschap fokken van dieren, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.a.7°
    text: de kunstmatige vermeerdering van plantensoorten, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.b
    text: 'in elk geval behelzen een verbod om:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.b.1°
    text: zonder vergunning dieren of planten aan de natuur te onttrekken, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.2.b.2°
    text: in een bepaalde periode dieren of planten aan de natuur te onttrekken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan, na overleg met provinciale staten van de
      provincies, worden bepaald dat provinciale staten regels als bedoeld in dat lid vaststellen of vrijstelling van
      die regels kunnen verlenen, of dat gedeputeerde staten met de verlening van ontheffing van die regels of met de
      uitvoering van die regels zijn belast.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Gedeputeerde staten kunnen ontheffing verlenen van een of meer van de verboden, bedoeld in de [artikelen 3.5][ref1]
      en [3.6, tweede lid][ref2], ten aanzien van dieren of planten van daarbij aangewezen soorten, dan wel ten aanzien
      van de voortplantingsplaatsen, rustplaatsen of eieren van dieren van daarbij aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.2
    text: |-
      Provinciale staten kunnen bij verordening vrijstelling verlenen van een of meer van de verboden, bedoeld in de
      [artikelen 3.5][ref1] en [3.6, tweede lid][ref2], ten aanzien van dieren of planten van daarbij aangewezen soorten,
      dan wel ten aanzien van de voortplantingsplaatsen, rustplaatsen of eieren van dieren van daarbij aangewezen
      soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.3
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van een of meer van de verboden, bedoeld in
      [artikel 3.6, eerste lid][ref1], of van regels gesteld krachtens [artikel 3.7][ref2], ten aanzien van dieren of
      planten van daarbij aangewezen soorten, dan wel ten aanzien van de voortplantingsplaatsen, rustplaatsen of eieren
      van dieren van daarbij aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.4
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 3.7, eerste lid][ref1], kan worden bepaald dat
      gedeputeerde staten ontheffing kunnen verlenen, of dat provinciale staten bij verordening vrijstelling kunnen
      verlenen, van bij de maatregel aangewezen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.5
    text: |-
      Een ontheffing of een vrijstelling wordt uitsluitend verleend, indien is voldaan aan elk van de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.a
    text: er bestaat geen andere bevredigende oplossing;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b
    text: 'zij is nodig:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b.1°
    text: |-
      in het belang van de bescherming van de wilde flora of fauna, of in het belang van de instandhouding van de
      natuurlijke habitats;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b.2°
    text: |-
      ter voorkoming van ernstige schade aan met name de gewassen, veehouderijen, bossen, visgronden, wateren of andere
      vormen van eigendom;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b.3°
    text: |-
      in het belang van de volksgezondheid, de openbare veiligheid of andere dwingende redenen van groot openbaar belang,
      met inbegrip van redenen van sociale of economische aard en met inbegrip van voor het milieu wezenlijke gunstige
      effecten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b.4°
    text: |-
      voor onderzoek en onderwijs, repopulatie of herintroductie van deze soorten, of voor de daartoe benodigde kweek,
      met inbegrip van de kunstmatige vermeerdering van planten, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.b.5°
    text: |-
      om het onder strikt gecontroleerde omstandigheden mogelijk te maken op selectieve wijze en binnen bepaalde grenzen
      een beperkt, bij de ontheffing of vrijstelling vastgesteld aantal van bepaalde dieren van de aangewezen soort te
      vangen of onder zich te hebben, onderscheidenlijk een beperkt bij de ontheffing of vrijstelling vastgesteld aantal
      van bepaalde planten van de aangewezen soort te plukken of onder zich te hebben;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.5.c
    text: |-
      er wordt geen afbreuk gedaan aan het streven de populaties van de betrokken soort in hun natuurlijke
      verspreidingsgebied in een gunstige staat van instandhouding te laten voortbestaan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.6
    text: |-
      De verboden, bedoeld in de [artikelen 3.5][ref1] en [3.6][ref2] zijn niet van toepassing op handelingen ten aanzien
      waarvan bij of krachtens enige wettelijke bepaling een besluit is vereist, indien bij of krachtens die wet is
      bepaald dat het desbetreffende besluit de handelingen uitsluitend toelaat indien is voldaan aan de voorwaarden,
      bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.7
    text: |-
      De verboden, bedoeld in de [artikelen 3.5][ref1] en [3.6, tweede lid][ref2], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.8.7.a
    text: |-
      handelingen ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als bedoeld in
      [artikel 2.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.8.7.b
    text: |-
      handelingen die zijn beschreven in en worden verricht overeenkomstig een beheerplan als bedoeld in
      [artikel 2.3, eerste lid][ref1], een plan of een programma als bedoeld in artikel 2.3, vijfde lid, of een
      programma als bedoeld in [artikel 1.13, eerste, zevende of achtste lid][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 3.8.7.b.1°
    text: |-
      ten aanzien van het beheerplan, het plan of het programma, althans het onderdeel dat betrekking heeft op de
      desbetreffende handelingen, is voldaan aan het in het vijfde lid bepaalde ten aanzien van ontheffingen en
      vrijstellingen, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.8.7.b.2°
    text: |-
      het bestuursorgaan dat het beheerplan, het plan of het programma heeft vastgesteld tevens bevoegd is voor
      de verlening van een ontheffing, onderscheidenlijk vrijstelling als bedoeld in het eerste, onderscheidenlijk
      tweede lid voor dergelijke handelingen, of, als dat niet het geval is, het beheerplan, het plan of het programma
      is vastgesteld in overeenstemming met het bestuursorgaan dat bevoegd is voor de verlening van de ontheffing,
      onderscheidenlijk vrijstelling.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Indien het vangen of doden van dieren van soorten, genoemd in bijlage IV, onderdeel a, bij de Habitatrichtlijn,
      of bijlage II bij het Verdrag van Bern, en het aan de natuur onttrekken van dieren van soorten, genoemd in bijlage
      V, onderdeel a, bij de Habitatrichtlijn, of bijlage III bij het Verdrag van Bern, bij of krachtens deze wet is
      toegestaan, is het verboden deze dieren te vangen of te doden door gebruikmaking van niet-selectieve middelen die
      de plaatselijke verdwijning of ernstige verstoring van de rust van de populaties van deze soorten tot gevolg kunnen
      hebben, waartoe in elk geval behoren:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.9
  - number: 3.9.1.a
    text: de middelen, genoemd in bijlage VI, onderdeel a, bij de Habitatrichtlijn, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.9
  - number: 3.9.1.b
    text: de vervoermiddelen, genoemd in bijlage VI, onderdeel b, bij de Habitatrichtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Gedeputeerde staten kunnen ontheffing verlenen en provinciale staten kunnen bij verordening vrijstelling verlenen
      van het verbod, bedoeld in het eerste lid. [Artikel 3.8, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.9.3
    text: |-
      Bij algemene maatregel van bestuur kunnen middelen worden aangewezen die in elk geval worden gerekend tot de niet-
      selectieve middelen, bedoeld in het eerste lid, aanhef.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Onverminderd [artikel 3.5, eerste, vierde en vijfde lid][ref1], is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.1.a
    text: |-
      in het wild levende zoogdieren, amfibieën, reptielen, vissen, dagvlinders, libellen en kevers van de soorten,
      genoemd in de bijlage, onderdeel A, bij deze wet, opzettelijk te doden of te vangen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.1.b
    text: |-
      de vaste voortplantingsplaatsen of rustplaatsen van dieren als bedoeld in onderdeel a opzettelijk te beschadigen of
      te vernielen, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.1.c
    text: |-
      vaatplanten van de soorten, genoemd in de bijlage, onderdeel B, bij deze wet, in hun natuurlijke
      verspreidingsgebied opzettelijk te plukken en te verzamelen, af te snijden, te ontwortelen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      [Artikel 3.8][ref1], met uitzondering van het derde en vierde lid, is van overeenkomstige toepassing op de
      verboden, bedoeld in het eerste lid, met dien verstande dat, in aanvulling op de redenen, genoemd in het vijfde
      lid, onderdeel b, de noodzaak voor de ontheffing of vrijstelling ook verband kan houden met handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.2.a
    text: |-
      in het kader van de ruimtelijke inrichting of ontwikkeling van gebieden, daaronder begrepen het daarop volgende
      gebruik van het ingerichte of ontwikkelde gebied;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.b
    text: |-
      ter voorkoming van schade of overlast, met inbegrip van schade aan sportvelden, schietterreinen,
      industrieterreinen, kazernes, of begraafplaatsen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.c
    text: |-
      ter beperking van de omvang van de populatie van dieren, in verband met door deze dieren ter plaatse en in het
      omringende gebied veelvuldig veroorzaakte schade of in verband met de maximale draagkracht van het gebied waarin de
      dieren zich bevinden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.d
    text: ter voorkoming of bestrijding van onnodig lijden van zieke of gebrekkige dieren;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.e
    text: in het kader van bestendig beheer of onderhoud in de landbouw of bosbouw;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.f
    text: |-
      in het kader van bestendig beheer of onderhoud aan vaarwegen, watergangen, waterkeringen, waterstaatswerken,
      oevers, vliegvelden, wegen, spoorwegen of bermen, of in het kader van natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.g
    text: in het kader van bestendig beheer of onderhoud van de landschappelijke kwaliteiten van een bepaald gebied, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.2.h
    text: in het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      De verboden, bedoeld in het eerste lid, onderdelen a, en b, zijn niet van toepassing op de bosmuis, de
      huisspitsmuis en de veldmuis voor zover deze dieren zich in of op gebouwen of daarbij behorende erven of roerende
      zaken bevinden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.10
  - number: 3.11.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de bij die regeling aan te wijzen verboden, bedoeld in
      [artikel 3.10, eerste lid, onderdeel b of c][ref1] niet van toepassing zijn ten aanzien van bij die regeling aan
      te wijzen soorten, op bij die regeling aan te wijzen categorieën van handelingen die na een voorafgaande melding
      aan gedeputeerde staten worden uitgevoerd om een reden, genoemd in [artikel 3.8, vijfde lid, onderdeel b][ref2],
      of in artikel 3.10, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.11.2
    text: |-
      Provinciale staten kunnen bij verordening regels stellen waaraan een melding als bedoeld in het eerste lid moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.11
  - number: 3.12.1
    text: Er zijn faunabeheereenheden die voor hun werkgebied een faunabeheerplan vaststellen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Een faunabeheereenheid heeft de rechtsvorm van een vereniging met volledige rechtsbevoegdheid of een stichting.
      In het bestuur van een faunabeheereenheid zijn in ieder geval de jachthouders uit het werkgebied van de
      faunabeheereenheid en maatschappelijke organisaties die het doel behartigen van een duurzaam beheer van
      populaties van in het wild levende dieren in de regio waartoe het werkgebied van de faunabeheereenheid behoort,
      vertegenwoordigd. Op uitnodiging van het bestuur van de faunabeheereenheid kunnen vertegenwoordigers van andere
      dan de in de tweede volzin bedoelde maatschappelijke organisaties en wetenschappers op het gebied van faunabeheer
      deelnemen aan de vergaderingen van het bestuur en het bestuur adviseren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Faunabeheereenheden stellen een of meer faunabeheerplannen vast voor hun werkgebied. Ten aanzien van door Onze
      Minister vanwege de omvang van hun leefgebieden aangewezen diersoorten stellen de faunabeheereenheden, in wier
      werkgebied het leefgebied is gelegen, gezamenlijk een faunabeheerplan vast.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Onderdeel van het faunabeheerplan zijn passende en doeltreffende maatregelen ter voorkoming en bestrijding van
      schade aangericht door in het wild levende dieren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.5
    text: |-
      Ten behoeve van een planmatige en doelmatige aanpak van het faunabeheer wordt het faunabeheerplan onderbouwd
      door trendtellingen van de populaties van in het wild levende dieren in het gebied waarop het faunabeheerplan van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.6
    text: |-
      Alvorens een faunabeheerplan vast te stellen, hoort de faunabeheereenheid de binnen haar werkgebied werkzame
      wildbeheereenheden over de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.7
    text: |-
      Het faunabeheerplan behoeft de goedkeuring van gedeputeerde staten van de provincie waarin de faunabeheereenheid
      werkzaam is. Ingeval een gezamenlijk faunabeheerplan is vastgesteld door faunabeheereenheden in verschillende
      provincies, geschiedt de goedkeuring door gedeputeerde staten van de provincie waarin het leefgebied van de soort
      grotendeels is gelegen, in overeenstemming met gedeputeerde staten van de andere provincies waarin het leefgebied
      mede is gelegen. Een goedgekeurd faunabeheerplan wordt openbaar gemaakt door de betreffende faunabeheereenheid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.8
    text: |-
      De faunabeheereenheid brengt jaarlijks verslag uit van de uitvoering van het faunabeheerplan aan gedeputeerde
      staten van de provincie waarin de faunabeheereenheid werkzaam is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.9
    text: |-
      Provinciale staten stellen bij verordening regels waaraan in hun provincie werkzame faunabeheereenheden en de door
      de faunabeheereenheid vastgestelde faunabeheerplannen voldoen. Deze regels kunnen in elk geval betrekking hebben
      op:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.9.a
    text: de omvang en begrenzing van het werkgebied van de faunabeheereenheid;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.9.b
    text: |-
      de aard, omvang en noodzaak van de op grond van het faunabeheerplan te verrichten handelingen waarvoor een
      ontheffing als bedoeld in [artikel 3.17][ref1] wordt verleend of waartoe opdracht wordt verleend op grond van
      [artikel 3.18][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.12.9.c
    text: de wijze waarop en de perioden waarin de handelingen, bedoeld in onderdeel b worden verricht, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.9.d
    text: |-
      de vertegenwoordiging van maatschappelijke organisaties als bedoeld in het tweede lid in het bestuur van de
      faunabeheereenheid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.12.10
    text: |-
      Het eerste lid is niet van toepassing op het beheer van populaties van exoten of verwilderde dieren en op de
      bestrijding van schadeveroorzakende exoten of verwilderde dieren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Jachtaktehouders verstrekken aan de desbetreffende faunabeheereenheden gegevens over de aantallen dieren,
      onderscheiden naar soort, die zij hebben gedood.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.13
  - number: 3.13.2
    text: |-
      De faunabeheereenheden dragen er zorg voor dat een overzicht dat is samengesteld op basis van gegevens als bedoeld
      in het eerste lid en gegevens uit het verslag, bedoeld in [artikel 3.12, achtste lid][ref1], betrekking hebbend op
      hun totale werkgebied, openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.14.1
    text: |-
      Jachthouders met een jachtakte organiseren zich met anderen in een wildbeheereenheid, die de rechtsvorm
      van een vereniging heeft, ter uitvoering van het door de faunabeheereenheid vastgestelde faunabeheerplan
      en om te bevorderen dat een duurzaam beheer van populaties van in het wild levende dieren, bestrijding van
      schadeveroorzakende dieren en jacht worden uitgevoerd in samenwerking met en ten dienste van grondgebruikers of
      terreinbeheerders. Ook grondgebruikers en terreinbeheerders kunnen lid worden van de vereniging.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Provinciale staten stellen bij verordening regels waaraan in hun provincie werkzame wildbeheereenheden als bedoeld
      in het eerste lid voldoen. Deze regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.14
  - number: 3.14.2.a
    text: de omvang en begrenzing van het gebied waarover zich de zorg van de wildbeheereenheid kan uitstrekken, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.14
  - number: 3.14.2.b
    text: de gevallen waarin en voorwaarden waaronder jachthouders zijn uitgezonderd van het eerste lid.
