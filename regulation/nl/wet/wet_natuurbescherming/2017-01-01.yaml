  - number: 1.2.2
    text: |-
      Deze wet is niet van toepassing op handelingen die onderwerp zijn van het gemeenschappelijk visserijbeleid, bedoeld
      in artikel 38 van het Verdrag betreffende de werking van de Europese Unie, voor zover zij plaatsvinden in de
      exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      Ingeval gedeputeerde staten ingevolge het bepaalde bij of krachtens deze wet bevoegd zijn tot het nemen van een
      besluit met betrekking tot projecten of handelingen, zijn, tenzij anders bepaald, bevoegd gedeputeerde staten van
      de provincie waar het project of de handeling wordt gerealiseerd, onderscheidenlijk verricht.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Ingeval provinciale staten ingevolge het bepaalde bij of krachtens deze wet bevoegd zijn tot het nemen van een
      besluit met betrekking tot projecten of handelingen, zijn, tenzij anders bepaald, bevoegd provinciale staten van de
      provincie waar de projecten of handelingen worden gerealiseerd, onderscheidenlijk verricht.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.3
    text: |-
      Ingeval projecten of handelingen nadelige gevolgen hebben voor een geheel of gedeeltelijk in een
      andere provincie gelegen Natura 2000-gebied of bijzonder nationaal natuurgebied, dan wel voor
      vogels als bedoeld in [artikel 3.1, eerste lid][ref1], dieren of planten van soorten als bedoeld in
      [artikel 3.5, eerste of vijfde lid][ref2], [3.7][ref3] of [3.10, eerste lid][ref4], die zich bevinden in een
      andere provincie, nemen gedeputeerde staten, onderscheidenlijk provinciale staten geen besluiten als bedoeld in het
      eerste, onderscheidenlijk tweede lid, dan in overeenstemming met gedeputeerde staten, onderscheidenlijk provinciale
      staten van die andere provincie.


