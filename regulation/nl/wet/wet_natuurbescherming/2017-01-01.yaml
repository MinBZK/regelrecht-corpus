        paragraaf: '3.4'
  - number: 3.25.4
    text: |-
      Bij het verlenen van een ontheffing of een vrijstelling als bedoeld in het eerste lid, kan ook vrijstelling,
      onderscheidenlijk ontheffing worden verleend van:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
  - number: 3.25.4.a
    text: |-
      het verbod, bedoeld in [artikel 3.24, tweede lid][ref1]. Op deze vrijstelling of ontheffing is artikel 3.24,
      derde, lid van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.25.4.b
    text: |-
      regels als bedoeld in [artikel 3.24, vierde lid][ref1], voor zover deze vrijstelling of ontheffing in
      overeenstemming is met de bij of krachtens de Benelux-overeenkomst gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.26.1
    text: 'Het is verboden een geweer te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.a
    text: zonder een geldige jachtakte;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.b
    text: |-
      op gronden, niet zijnde een jachtveld dat voldoet aan bij of krachtens algemene maatregel van bestuur gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.c
    text: |-
      indien de burgerrechtelijke aansprakelijkheid voor schade waartoe het gebruik van het geweer ter uitoefening van
      het bepaalde bij of krachtens deze wet aanleiding kan geven, niet is gedekt door een verzekering, overeenkomstig
      bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 3.29, eerste lid][ref1], gestelde regels,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.26.1.d
    text: 'voor andere handelingen dan:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.d.1°
    text: de jacht;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.d.2°
    text: |-
      de uitvoering van handelingen waarvoor een ontheffing of vrijstelling als bedoeld
      in de [artikelen 3.3, eerste, onderscheidenlijk tweede lid, of derde lid][ref1],
      [3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref2], [3.10, tweede lid][ref3], in samenhang met
      artikel 3.8, eerste, onderscheidenlijk tweede lid, of derde lid, of [3.15, tweede en vierde lid][ref4], in
      voorkomend geval in samenhang met het zevende lid, of [3.16, tweede en vierde lid][ref5], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.26.1.d.3°
    text: |-
      de uitvoering van [artikel 3.18, eerste lid][ref1], in voorkomend geval in samenhang met het vierde lid, of
      [3.19, tweede lid][ref2], in samenhang met artikel 3.18, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.26.1.d.4°
    text: |-
      de bestrijding van bij ministeriële regeling aangewezen verwilderde dieren of exoten, buiten de gevallen, bedoeld
      onder 3°;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.d.5°
    text: het schieten van kleiduiven, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.1.d.6°
    text: jachthondenproeven.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan het gebruik van het geweer, bedoeld in het eerste lid, worden
      uitgesloten of beperkt en kunnen regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2.a
    text: het geweer;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2.b
    text: de munitie, waarbij ook rekening wordt gehouden met belangen van veiligheid, volksgezondheid, welzijn en milieu;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2.c
    text: het gebruik van middelen op, aan of bij het geweer;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2.d
    text: de diersoorten waarop het gebruik van het geweer betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.2.e
    text: de vaardigheden waarover de gebruiker van het geweer beschikt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Bij het verlenen van een ontheffing of een vrijstelling, genoemd in [artikel 3.25, eerste lid][ref1], kan ook
      ontheffing, onderscheidenlijk vrijstelling worden verleend van het eerste lid, onderdeel a of b, en de krachtens
      het tweede lid gestelde regels, met dien verstande dat bij het verlenen van ontheffing of vrijstelling van
      regels als bedoeld in het tweede lid, onderdeel b, ook rekening wordt gehouden met belangen van veiligheid,
      volksgezondheid, welzijn en milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.27.1
    text: |-
      Het is een ieder die niet in het bezit is van een geldige jachtakte, verboden in het veld een geweer of een
      gedeelte van een geweer te dragen, tenzij hij uit anderen hoofde tot het gebruik van een geweer ter plaatse
      gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.27
  - number: 3.27.2
    text: |-
      Het is de houder van een jachtakte verboden een geweer te dragen op gronden waarop hij niet tot het gebruik van een
      geweer gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      De jachtakte wordt verleend door de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 3.28.2
    text: 'De jachtakte wordt uitsluitend verleend indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.2.a
    text: |-
      met gunstig gevolg een jachtexamen heeft afgelegd dat is erkend door Onze Minister, of dat is erkend door de
      bevoegde autoriteit van een andere staat en door Onze Minister als gelijkwaardig aan door hem erkende jachtexamens
      is aangemerkt;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.2.b
    text: de leeftijd van achttien jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.2.c
    text: |-
      jachthouder is van een jachtveld dat voldoet aan de regels gesteld krachtens artikel 3.26, eerste lid, onderdeel b,
      en lid is van de wildbeheereenheid waarbinnen zijn jachtveld is gelegen, of toestemming heeft van een dergelijke
      jachthouder tot uitoefening van de jacht in diens jachtveld, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.2.d
    text: |-
      een geldig bewijs van de verzekering, bedoeld in [artikel 3.26, eerste lid, onderdeel c][ref1], heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.28.3
    text: 'De jachtakte wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.3.a
    text: |-
      er grond is om aan te nemen dat de aanvrager van de bevoegdheid een geweer en munitie voorhanden te hebben,
      van de bevoegdheid om de jacht uit te oefenen, of van de hem toekomende bevoegdheden in het kader van beheer en
      schadebestrijding als bedoeld in [paragraaf 3.4][ref1] misbruik zal maken, of zodanig gebruik zal maken dat hij een
      gevaar voor zichzelf, de openbare orde of de veiligheid kan gaan vormen;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0037552
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.28.3.b
    text: |-
      er grond is om aan te nemen dat de aanvrager nalatig zal zijn te doen wat een goed jager betaamt bij de uitoefening
      van de jacht;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.3.c
    text: |-
      aan de aanvrager de bevoegdheid om de jacht uit te oefenen is ontzegd bij een rechterlijke uitspraak die voor
      tenuitvoerlegging vatbaar is geworden, en de tijd waarvoor die bevoegdheid is ontzegd nog niet is verstreken, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.3.d
    text: |-
      de aanvrager in de twee jaar voorafgaande aan het verzoek tot het verkrijgen van een jachtakte wegens één der
      bij of krachtens deze wet strafbaar gestelde feiten, dan wel wegens een feit dat strafbaar is gesteld bij de
      [Wet dieren][ref1], voor zover het gedragingen als bedoeld in de [artikelen 2.1][ref2], [2.2][ref3], [2.3][ref4],
      [2.5][ref5], [2.6][ref6], [2.7][ref7], [2.8][ref8], [2.9][ref9], [2.10][ref10], [2.13][ref11], [2.14][ref12] of
      [2.15 van die wet][ref13] is veroordeeld, dan wel tegen hem deswege een strafbeschikking is uitgevaardigd, of
      indien hem wegens overtreding van het krachtens de voornoemde artikelen van de Wet dieren bepaalde een bestuurlijke
      boete als bedoeld in [artikel 8.7 van de Wet dieren][ref14] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2
