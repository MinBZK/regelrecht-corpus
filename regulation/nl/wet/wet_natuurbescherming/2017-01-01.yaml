  - number: 3.31.3.b.3°
    text: |-
      eieren van dieren als bedoeld in [artikel 3.1][ref1], [3.5, eerste lid][ref2], of [3.10, eerste lid][ref3], worden
      vernield, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.31.3.c
    text: |-
      ingeval handelingen worden verricht die invloed hebben op planten van soorten als bedoeld in
      [artikel 3.5, vijfde lid][ref1], of [3.10, eerste lid][ref2], wordt voorafgaand aan en tijdens de handelingen
      in redelijkheid alles verricht of gelaten om te voorkomen dat deze planten worden geplukt, afgesneden, ontworteld
      of vernield.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.31.4
    text: |-
      Alvorens een gedragscode als bedoeld in het eerste lid, of een wijziging daarvan, goed te keuren of in te trekken,
      overlegt Onze Minister met gedeputeerde staten over zijn voornemen daartoe.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.31
  - number: 3.32.1
    text: |-
      Het is verboden in het wild levende edelherten, damherten, reeën of wilde zwijnen en dieren van de soorten, genoemd
      in [artikel 3.20, tweede lid][ref1], bij te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.32.2
    text: 'Gedeputeerde staten kunnen ontheffing verlenen van het verbod, bedoeld in het eerste lid, indien sprake is van:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.32
  - number: 3.32.2.a
    text: bijzondere weersomstandigheden, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.32
  - number: 3.32.2.b
    text: een tijdelijk natuurlijk voedseltekort en het welzijn van de dieren in het geding is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.32
  - number: 3.33.1
    text: |-
      Het is verboden bij de uitoefening van een ontheffing of vrijstelling
      als bedoeld in [artikel 3.10, tweede lid][ref1], in samenhang met
      [artikel 3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref2], en met
      [artikel 3.15, tweede en vierde lid][ref3], en bij de uitvoering van een opdracht als bedoeld in
      [artikel 3.18, eerste lid][ref4], wilde zwijnen, reeën, damherten of edelherten te vangen of te doden door middel
      van drijven.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.33.2
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat in afwijking van het eerste lid, het doden van wilde zwijnen
      is toegestaan door middel van een methode, waarbij één persoon wilde zwijnen opzettelijk verontrust met het oogmerk
      deze dieren binnen het schootsveld van één geweerdrager te drijven, opdat deze de dieren kan doden, en waarbij geen
      hond wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.33
  - number: 3.33.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de voorschriften
      die aan vrijstellingen als bedoeld in de [artikelen 3.15, tweede of vierde lid][ref1], of
      [3.16, tweede of vierde lid][ref2], ontheffingen als bedoeld in [artikel 3.17, eerste lid][ref3], of opdrachten
      als bedoeld in artikel 3.18, eerste lid, worden verbonden, of de beperkingen waaronder die vrijstellingen
      of ontheffingen worden verleend, onderscheidenlijk die opdrachten worden gegeven, ingeval die nodig zijn ter
      uitvoering van internationale verplichtingen of bindende besluiten van de Europese Unie of andere volkenrechtelijke
      organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.34.1
    text: Het is verboden dieren of eieren van dieren uit te zetten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.34
  - number: 3.34.2
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet voor het uitzetten van dieren van soorten die op grond van
      [artikel 1, tweede lid, van de Visserijwet 1963][ref1] zijn aangewezen als «vis», of voor het uitzetten van hun
      eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: 3.34.3
    text: |-
      Gedeputeerde staten kunnen ontheffing en provinciale staten kunnen vrijstelling verlenen van het verbod, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.34
  - number: 3.34.4
    text: |-
      Het is verboden exoten behorende tot bij algemene maatregel van bestuur aangewezen plantensoorten te planten of
      te zaaien.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.34
  - number: 3.34.5
    text: |-
      Onze Minister kan, in zoverre in afwijking van het derde lid, ontheffing of vrijstelling verlenen van de verboden,
      bedoeld in het eerste en vierde lid, ten behoeve van de herintroductie van soorten, of voor het uitzetten, planten
      of zaaien van exoten. Onze Minister verleent een ontheffing of vrijstelling als bedoeld in de vorige volzin in
      overeenstemming met gedeputeerde staten van de provincie waar de herintroductie of uitzetting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.34
  - number: '3.35'
    text: |-
      Het is het verboden vanuit een Nederlands schip walvissen te vangen of te doden, dan wel aan boord van een
      Nederlands schip walvissen te verwerken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.35
  - number: '3.36'
    text: 'EU-verordeningen en EU-richtlijnen als bedoeld in deze paragraaf zijn:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.a
    text: |-
      [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december 1996 inzake de
      bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer
      (PbEG L 61);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.b
    text: |-
      [verordening (EG) nr. 1007/2009](32009R1007) van het Europees Parlement en de Raad van de Europese Unie van
      16 september 2009 betreffende de handel in zeehondenproducten (PbEU L 286);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.c
    text: |-
      verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van de Europese Unie van 22 oktober 2014
      betreffende de preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten (PbEU
      L 317);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.d
    text: verordeningen die berusten op de verordening, bedoeld in onderdeel a, b of c;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.e
    text: |-
      bij algemene maatregel van bestuur aangewezen andere verordeningen en richtlijnen die geheel of gedeeltelijk
      berusten op de artikelen 114, 192, 207 of 352 van het Verdrag betreffende de werking van de Europese Unie, of op
      een andere bindende EU-rechtshandeling die op een of meer van die artikelen berust, en die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.e.1°
    text: het verhandelen, bezit of verwerken van aan de natuur onttrokken dieren, planten, of eieren van dieren, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.36.e.2°
    text: |-
      het voorkomen, tot een minimum beperken en het verzachten van de nadelige gevolgen van opzettelijke en
      onopzettelijke introductie en verspreiding van invasieve uitheemse soorten op de biodiversiteit binnen de Europese
      Unie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.36
  - number: 3.37.1
    text: Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van EU-verordeningen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.37
  - number: 3.37.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van onderdelen van EU-verordeningen en EU-
      richtlijnen die geen beoordelingsruimte laten of die betrekking hebben op de wijze waarop aanvragen en documenten
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.37
  - number: 3.37.3
    text: |-
      Onze Minister is de bevoegde instantie belast met de uitvoering van EU-verordeningen en EU-richtlijnen, indien deze
      verplichten tot het aanwijzen van zodanige bevoegde instantie, tenzij Onze Minister een andere bevoegde instantie
      heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.37
  - number: 3.38.1
    text: |-
      Onverminderd [artikel 3.37][ref1], kunnen bij of krachtens algemene maatregel van bestuur ter bescherming van
      diersoorten of plantensoorten als bedoeld in de [artikelen 3.1][ref2], [3.5][ref3], [3.10, eerste lid][ref4],
      of ter uitvoering van EU-verordeningen of EU-richtlijnen, regels worden gesteld over het verhandelen, bezit of
      verwerken van aan de natuur onttrokken dieren of planten, gefokte dieren, gekweekte planten, producten van dieren
      of planten, of eieren van dieren, met inbegrip van dieren en planten en schimmels of micro-organismen van uitheemse
      soorten als bedoeld in de verordening, genoemd in [artikel 3.36, onderdeel c][ref5]. Deze regels kunnen onder
      meer voorzien in:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.38.1.a
    text: |-
      een verbod op het verhandelen, in bezit hebben, verwerken, kweken, telen of laten voortplanten, gebruiken,
      uitwisselen of uitzetten of zonder vergunning verhandelen, in bezit hebben, verwerken, kweken, telen of laten
      voortplanten, gebruiken, uitwisselen of uitzetten van dieren, planten, eieren van dieren of schimmels of micro-
      organismen van uitheemse soorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.1.b
    text: |-
      een verplichting tot het voeren van een administratie of het verstrekken van gegevens met betrekking tot dieren,
      planten, eieren van dieren of schimmels of micro-organismen van uitheemse soorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.1.c
    text: |-
      een verplichting tot het merken van dieren, planten, eieren van dieren of schimmels of micro-organismen van
      uitheemse soorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.1.d
    text: |-
      de aanwijzing van rechtspersoonlijkheid bezittende organisaties die belast zijn met de taak om merken, merktekens
      en ringen uit te reiken overeenkomstig daarbij gestelde regels;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.1.e
    text: |-
      een verbod om op niet aangewezen plaatsen dieren, planten, eieren van dieren of schimmels of micro-organismen van
      uitheemse soorten het grondgebied van Nederland binnen te brengen of uit te voeren, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.1.f
    text: voorschriften met betrekking tot de opvang van levende dieren, of de bewaring van planten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
  - number: 3.38.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, na overleg met gedeputeerde staten, worden bepaald dat
      gedeputeerde staten ter uitvoering van de verordening, genoemd in [artikel 3.36, onderdeel c][ref1], zijn
      belast met de uitvoering van uitroeiingsmaatregelen, beheersmaatregelen, herstelmaatregelen als bedoeld in die
      verordening. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de verstrekking door
      gedeputeerde staten aan Onze Minister van gegevens die betrekking hebben op invasieve uitheemse soorten die in hun
      provincie voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: '3.39'
    text: |-
      Het is verboden invasieve exoten behorende tot bij algemene maatregel van bestuur aangewezen soorten, of eieren van
      deze exoten te verhandelen of in bezit te hebben.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.39
  - number: '3.40'
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens deze paragraaf,
      overeenkomstig de voorwaarden en beperkingen die in voorkomend geval voortvloeien uit de toepasselijke EU-
      verordening of EU-richtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.40
  - number: 3.41.1
    text: |-
      Er is een wetenschappelijke autoriteit CITES, die fungeert als wetenschappelijke autoriteit, bedoeld in artikel 13,
      tweede lid, van de verordening, genoemd in [artikel 3.36, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.41.2
    text: |-
      De wetenschappelijke autoriteit, bedoeld in het eerste lid, bestaat uit ten minste vijf en ten hoogste negen leden,
      de voorzitter daaronder begrepen, die ook deskundigheid bezitten op het gebied van natuurbescherming, welzijn van
      dieren en de opvang van dieren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.41
  - number: 3.41.3
    text: |-
      De leden van de wetenschappelijke autoriteit worden benoemd door Onze Minister, voor een periode van ten hoogste
      vier jaar, tweemaal te verlengen met telkens ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.41
  - number: '4.1'
    text: |-
      Het bepaalde bij en krachtens deze paragraaf, met uitzondering van [artikel 4.6][ref1], heeft geen betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.a
    text: houtopstanden binnen de bij besluit van de gemeenteraad vastgestelde grenzen van de bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.b
    text: houtopstanden op erven of in tuinen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.c
    text: fruitbomen en windschermen om boomgaarden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.d
    text: naaldbomen, kennelijk bedoeld om te dienen als kerstbomen, indien niet ouder dan twintig jaar;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.e
    text: kweekgoed;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.f
    text: 'uit populieren of wilgen bestaande:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.f.1°
    text: wegbeplantingen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.f.2°
    text: beplantingen langs waterwegen, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.f.3°
    text: eenrijige beplantingen langs landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.g
    text: het dunnen van een houtopstand;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.h
    text: |-
      uit populieren, wilgen, essen of elzen bestaande beplantingen die kennelijk zijn bedoeld voor de productie van
      houtige biomassa, indien zij:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.h.1°
    text: ten minste eens per tien jaar worden geoogst;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.h.2°
    text: |-
      bestaan uit minstens tienduizend stoven per hectare per beplantingseenheid, zijnde een aaneengesloten beplanting
      die niet wordt doorsneden door onbeplante stroken breder dan twee meter, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.1.h.3°
    text: zijn aangelegd na 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Het is verboden een houtopstand geheel of gedeeltelijk te vellen of te doen vellen, met uitzondering van het
      periodiek vellen van griend- of hakhout, zonder voorafgaande melding daarvan bij gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Provinciale staten kunnen bij verordening regels stellen over de melding, bedoeld in het eerste lid. Deze regels
      kunnen in elk geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.2.2.a
    text: de gegevens die bij de melding worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.2.2.b
    text: de termijn waarbinnen de melding wordt gedaan, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.2.2.c
    text: de wijze waarop de melding wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Gedeputeerde staten kunnen het vellen van houtopstanden telkens voor ten hoogste vijf jaar verbieden ter
      bescherming van bijzondere natuur- of landschapswaarden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Ingeval een houtopstand geheel of gedeeltelijk is geveld, met uitzondering van het periodiek vellen van griend- of
      hakhout, of anderszins teniet is gegaan, draagt de rechthebbende zorg voor het op bosbouwkundig verantwoorde wijze
      herbeplanten van dezelfde grond binnen drie jaar na het vellen of tenietgaan van de houtopstand.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      De rechthebbende vervangt binnen drie jaar na de herbeplanting, bedoeld in het eerste lid, herbeplanting die niet
      is aangeslagen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Provinciale staten kunnen bij verordening regels stellen over de bosbouwkundig verantwoorde wijze van
      herbeplanting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.3
  - number: 4.3.4
    text: |-
      De rechthebbende, bedoeld in het eerste en tweede lid, is degene die krachtens eigendom of een beperkt recht het
      genot heeft van de grond.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.3
  - number: 4.3.5
    text: |-
      Degene die de eigendom van grond, ten aanzien waarvan een plicht tot herbeplanting geldt op grond van het eerste of
      tweede lid, overdraagt, of een beperkt recht daarop vestigt of overdraagt, stelt de verkrijger op de hoogte van de
      plicht tot herbeplanting en neemt die plicht uitdrukkelijk op in de akte van levering.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      De [artikelen 4.2, eerste en derde lid][ref1], en [4.3, eerste en tweede lid][ref2], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.4.1.a
    text: |-
      het vellen van houtopstanden ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als bedoeld
      in [artikel 2.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.4.1.b
    text: |-
      het vellen van houtopstanden ter uitvoering van een verplichting als bedoeld in artikel 2.4, eerste of
      derde lid, een voorschrift verbonden aan een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1],
      regels als bedoeld in [artikel 2.9, derde lid][ref2], of een voorschrift verbonden aan een ontheffing
      of een vrijstelling als bedoeld in de [artikelen 3.3, eerste, onderscheidenlijk tweede lid][ref3],
      [3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref4], of [3.10, tweede lid][ref5], in samenhang met 3.8,
      eerste, onderscheidenlijk tweede lid, een besluit, vastgesteld onder toepassing van artikel 2.7, vierde lid, 3.3,
      zesde lid, 3.8, zesde lid, of 3.10, tweede lid, in samenhang met artikel 3.8, zesde lid, een wegaanpassingsbesluit,
      vastgesteld onder toepassing van [artikel 9, vijfde lid, van de Spoedwet wegverbreding][ref6], een
      tracébesluit, vastgesteld onder toepassing van [artikel 13, achtste lid, van de Tracéwet][ref7] of een
      omgevingsvergunning, vastgesteld onder toepassing van de [artikelen 2.17a][ref8], [2.17b][ref9], [2.17c][ref10] en
      [2.17d van de Wet algemene bepalingen omgevingsrecht][ref11];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
