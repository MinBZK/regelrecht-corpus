        artikel: '27'
  - number: 5.4.8
    text: |-
      De in het zevende lid bedoelde bevoegdheid komt tevens toe aan Onze Minister van Veiligheid en Justitie in gevallen
      als bedoeld in het vierde lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.9
    text: |-
