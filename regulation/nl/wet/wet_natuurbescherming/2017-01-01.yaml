        paragraaf: '3.4'
  - number: 3.25.3
    text: |-
      Indien een vrijstelling wordt verleend als bedoeld in [artikel 3.15, tweede en vierde lid][ref1], met
      het oog op het voorkomen van schade als bedoeld in artikel 3.15, vijfde en zesde lid, of een vrijstelling
      wordt verleend als bedoeld in [artikel 3.16, tweede en vierde lid][ref2], met het oog op het voorkomen
      van overlast als bedoeld in artikel 3.16, vijfde lid, dan wel ontheffing wordt verleend als bedoeld in
      [artikel 3.17, eerste lid, onderdeel a, onder 3°, onderdeel b, onder 2°, en onderdeel c, onder 2°][ref3],
      worden voor het bestrijden van vogels en dieren slechts middelen aangewezen die nadelige gevolgen voor het welzijn
      van vogels en dieren voorkomen of, indien dat niet mogelijk is, zoveel mogelijk beperken, waarbij het doden van
      dieren zoveel mogelijk vermeden wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
    references:
