  - number: 3.28.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan het jachtexamen, bedoeld in het
      tweede lid, onderdeel a, moet voldoen om door Onze Minister te worden erkend.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.5
    text: |-
      In afwijking van het tweede lid, onderdeel c, kan degene die geen woonplaats in Nederland heeft een jachtakte
      verkrijgen die geldig is gedurende zes opeenvolgende in de vergunning vermelde dagen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.6
    text: 'Een jachtakte als bedoeld in het vijfde lid:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.6.a
    text: |-
      wordt uitsluitend verleend indien de aanvrager genoegzaam aantoont dat hij gerechtigd is de jacht uit te oefenen in
      het land waarin hij zijn woon- of verblijfplaats heeft, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.6.b
    text: |-
      is uitsluitend van toepassing indien de houder zich bevindt in gezelschap van een in Nederland woonachtige houder
      van een geldige jachtakte.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.28.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aanvraag, duur, geldigheid en
      intrekking van de jachtakte. Bij ministeriële regeling wordt het model van de jachtakte vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verzekering, bedoeld in
      [artikel 3.26, eerste lid, onderdeel c][ref1]. De regels hebben in elk geval betrekking op de periode en het
      maximum bedrag waarvoor de verzekering de aansprakelijkheid dekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.29.2
    text: |-
      Degene die de schade heeft geleden heeft jegens de verzekeraar, door wie de aansprakelijkheid volgens deze wet is
      gedekt, een eigen recht op schadevergoeding tot het beloop van het in het eerste lid bedoelde bedrag. Het teniet
      gaan van zijn schuld aan de verzekerde bevrijdt de verzekeraar niet jegens de benadeelde, tenzij deze schadeloos
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.29
  - number: 3.29.3
    text: |-
      Geen uit de bepalingen van het Burgerlijk Wetboek omtrent de verzekeringsovereenkomst of uit deze overeenkomst zelf
      voortvloeiende nietigheid of voortvloeiend verweer of verval kan door een verzekeraar aan een benadeelde worden
      tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.29
  - number: 3.29.4
    text: |-
      De verzekeraar die ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, hoewel de
      aansprakelijkheid voor die schade niet door een met hem gesloten overeenkomst was gedekt, heeft voor het bedrag van
      de schadevergoeding verhaal op degene die voor de schade aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.29
  - number: 3.29.5
    text: |-
      Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.29
  - number: 3.30.1
    text: 'Het is verboden jachtvogels te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.1.a
    text: zonder een geldige valkeniersakte, en
