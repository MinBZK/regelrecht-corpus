    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6.b.2°
    text: |-
      ernstige schade aan met name de gewassen, veehouderijen, bossen, visgronden, wateren of andere vormen van eigendom,
      en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
