        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 5.2.a
    text: |-
      [artikel 2.7, tweede lid][ref1], voor een andere handeling als bedoeld in artikel 2.7, derde lid, onderdeel b;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.2
    references:
