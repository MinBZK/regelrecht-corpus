  - number: 5.2.c
    text: |-
      [artikel 3.40][ref1], van het bepaalde krachtens [artikel 3.38, aanhef en onderdeel a of d][ref2], met
      betrekking tot dieren of planten van soorten als bedoeld in [artikel 3.10, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.2
    references:
