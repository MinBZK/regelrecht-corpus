  - number: 7.2.2.c
    text: |-
      [artikel 3.34, eerste of vierde lid][ref1], voor zover de last betrekking heeft op het uitzetten, planten of
      zaaien van exoten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 7.4.1
    text: |-
      Onverminderd [artikel 7.2][ref1] en [artikel 117 van het Wetboek van Strafvordering][ref2] kan Onze Minister
      bepalen dat dieren, planten of eieren van dieren die in strijd met het bepaalde bij of krachtens deze wet binnen
      het grondgebied van Nederland zijn gebracht, op kosten van de eigenaar, vervoerder, importeur of diens gemachtigde:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel117
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '117'
  - number: 7.4.1.a
    text: worden teruggezonden naar het land van uitvoer of herkomst, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
  - number: 7.4.1.b
    text: |-
      naar enige andere plaats buiten Nederland worden gebracht die daarvoor naar het oordeel van Onze Minister geschikt
      is en in overeenstemming is met de doeleinden van de op 3 maart 1973 te Washington tot stand gekomen Overeenkomst
      inzake de internationale handel in bedreigde en in het wild levende dier- en plantensoorten (Trb. 1975, 22), naar
      de tekst zoals deze bij dat verdrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Onverminderd [artikel 7.2][ref1] kan Onze Minister besluiten dat levende dieren, behorend tot een in het wild
      levende soort die van nature in Nederland voorkomt, die in strijd met het bepaalde bij of krachtens deze wet worden
      gehouden en waarvan kan worden aangenomen dat zij zich in de natuur kunnen handhaven, op kosten van de eigenaar of
      van degene die deze dieren onder zich heeft, in hun natuurlijke leefomgeving in vrijheid worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.3
    text: |-
      Onder de in het eerste en tweede lid bedoelde kosten kunnen mede zijn begrepen de kosten van bewaring in verband
      met het transport naar de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
  - number: 7.4.4
    text: |-
      Indien niet tot terugzending of tot invrijheidstelling in de natuurlijke leefomgeving als bedoeld in het eerste,
      onderscheidenlijk tweede lid wordt besloten, kunnen de kosten van verzorging, huisvesting of opslag binnen
      Nederland geheel of gedeeltelijk in rekening worden gebracht bij de eigenaar of de importeur van het dier, de
      plant of het ei, of degene die het dier, de plant of het ei verhandelt, of bij de gemachtigde van de eigenaar, de
      importeur of degene die verhandelt. Bij ministeriële regeling kunnen terzake nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
  - number: 7.4.5
    text: |-
      Bij gebreke van volledige betaling binnen de door hem gestelde termijn kan Onze Minister hetgeen krachtens het
      eerste, tweede, derde of vierde lid verschuldigd is invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.4
  - number: 7.5.1
    text: |-
      Onverminderd [artikel 7.2][ref1] en [artikel 117 van het Wetboek van Strafvordering][ref2] kan Onze Minister
      onverwijld maatregelen treffen ten aanzien van hout of houtproducten die in strijd met het bepaalde bij of
      krachtens deze wet zijn ingevoerd of op de markt zijn gebracht. Deze maatregelen kunnen inhouden het in bewaring
      nemen van het hout of van het houtproduct, of een besluit houdende oplegging van;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel117
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '117'
  - number: 7.5.1.a
    text: een verbod tot het vervoeren, be- of verwerken of in het verkeer brengen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.1.b
    text: de verplichting tot tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.1.c
    text: de verplichting tot terugzending naar het land van uitvoer of herkomst;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.1.d
    text: |-
      de verplichting om houders, dan wel vermoedelijke houders van het hout of het houtproduct onverwijld en op
      doeltreffende wijze op de hoogte te stellen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.1.e
    text: de verplichting om het hout of het houtproduct dat in het verkeer is gebracht op te halen of centraal op te slaan;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.1.f
    text: de verplichting tot het identificeren en registreren van het hout of het houtproduct.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      De kosten van de in het eerste lid bedoelde maatregelen komen ten laste van degene die verantwoordelijk is voor het
      op de markt brengen van het hout of het houtproduct, de eigenaar daarvan, degene die het hout of het houtproduct
      verhandelt, of de gemachtigde van een of meer van deze personen. Bij gebreke van volledige betaling binnen de door
      hem gestelde termijn kan Onze Minister het verschuldigde bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.3
    text: |-
      De in het eerste lid bedoelde besluiten kunnen onder voorwaarden of beperkingen worden genomen. Aan de bij besluit
      opgelegde verplichtingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.5.4
    text: Het is verboden in strijd te handelen met een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.5
  - number: 7.6.1
    text: |-
      In dit artikel wordt onder overtreding verstaan: gedraging met betrekking tot de administratie, de verstrekking
      van gegevens of het merken van dieren, planten, eieren, hout of houtproducten die in strijd is met het bepaalde bij
      of krachtens [artikel 3.37][ref1], [3.38][ref2] of [4.8][ref3], in bij algemene maatregel van bestuur aangewezen
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 7.6.2
    text: Onze Minister kan een overtreder een bestuurlijke boete opleggen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
  - number: 7.6.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete die voor een
      overtreding of voor categorieën van overtredingen ten hoogste kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
  - number: 7.6.4
    text: |-
      De op grond van het derde lid te bepalen bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor
      de eerste categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], per overtreding
      begaan door een natuurlijke persoon, en ten hoogste het bedrag dat is bepaald voor de tweede categorie, bedoeld
      in artikel 23, vierde lid, van het Wetboek van Strafrecht per overtreding, per overtreding begaan door een
      rechtspersoon of een vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 7.6.5
    text: |-
      Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt zij
      aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
  - number: 7.6.6
    text: |-
      Voor overtredingen als bedoeld in het eerste lid kan geen bestuurlijke strafbeschikking worden opgelegd krachtens
      [artikel 257ba van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257ba
  - number: 7.7.1
    text: |-
      De door Onze Minister aangewezen ambtenaren verstrekken elkaar ter uitvoering van hun taak uit eigen beweging of
      desgevraagd onderling de bij die aanwijzing genoemde gegevens die noodzakelijk zijn voor de uitvoering van EU-
      verordeningen of EU-richtlijnen als bedoeld in [artikel 3.36][ref1] of [4.7][ref2], of de regels, gesteld bij of
      krachtens [artikel 3.37][ref3], [3.38][ref4] of [4.8][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel4
