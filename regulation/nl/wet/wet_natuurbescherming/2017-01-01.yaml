preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een integraal en vereenvoudigd wettelijk
    kader voor het behoud van de biologische diversiteit en een duurzaam gebruik van de bestanddelen daarvan en ter
    uitvoering van richtlijn 92/43/EEG van de Raad van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats
    en de wilde flora en fauna (PbEG 1992, L 206), richtlijn 2009/147/EG van het Europees Parlement en de Raad van
    30 november 2009 inzake het behoud van de vogelstand (PbEU 2010, L 20) en diverse verdragen inzake de biologische
    diversiteit en de bescherming van bedreigde dier- en plantensoorten en hun natuurlijke leefomgeving;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Benelux-overeenkomst:* Benelux-overeenkomst
      op het gebied van de jacht en de vogelbescherming (Trb. 1970, 155);
        - *bijzonder nationaal natuurgebied:* gebied als bedoeld in [artikel 2.11][ref1];
        - *bindende EU-rechtshandeling:* verordeningen, richtlijnen en besluiten als bedoeld in artikel 288 van het Verdrag
      betreffende de werking van de Europese Unie;
        - *dunnen:* vellen dat geschiedt als verzorgingsmaatregel ter bevordering van de groei van de overblijvende
      houtopstand;
        - *exclusieve economische zone:* exclusieve economische zone van Nederland als bedoeld in
      [artikel 2 van de Rijkswet instelling exclusieve economische zone][ref2];
        - *exoten:* dieren of planten van soorten die niet van nature in Nederland voorkomen of voorkwamen en die door
      menselijk handelen terecht zijn gekomen in de Nederlandse natuur of dat in de nabije toekomst dreigen te doen;
        - *faunabeheereenheid:* faunabeheereenheid als bedoeld in [artikel 3.12, eerste lid][ref3];
        - *faunabeheerplan:* faunabeheerplan als bedoeld in [artikel 3.12, eerste lid][ref4];
        - *grondgebruiker:* degene die gerechtigd is de grond te gebruiken krachtens een zakelijk of persoonlijk recht;
        - *gunstige staat van instandhouding van een natuurlijke habitat:* staat van instandhouding van een natuurlijke
      habitat waarvoor geldt dat: a. het natuurlijke verspreidingsgebied van de habitat en de oppervlakte van die
      habitat binnen dat gebied stabiel zijn of toenemen; b. de voor behoud op lange termijn nodige specifieke
      structuur en functies bestaan en in de afzienbare toekomst vermoedelijk zullen blijven bestaan, en c. de staat van
      instandhouding van de voor die habitat typische soorten gunstig is;
        - *gunstige staat van instandhouding van een soort:* staat van instandhouding van een soort waarvoor geldt dat:
      a. uit populatiedynamische gegevens blijkt dat de betrokken soort nog steeds een levensvatbare component is van de
      natuurlijke habitat waarin hij voorkomt, en dat vermoedelijk op lange termijn zal blijven, en b. het natuurlijke
      verspreidingsgebied van die soort niet kleiner wordt of binnen afzienbare tijd lijkt te zullen worden, en c. er
      een voldoende grote habitat bestaat en waarschijnlijk zal blijven bestaan om de populaties van die soort op lange
      termijn in stand te houden;
        - *habitat van een soort:* door specifieke abiotische en biotische factoren bepaald milieu waarin de soort tijdens
      één van de fasen van zijn biologische cyclus leeft;
        - *Habitatrichtlijn:* [richtlijn 92/43/EEG](31992L0043) van de Raad van 21 mei 1992 inzake de instandhouding van de
      natuurlijke habitats en de wilde flora en fauna (PbEG 1992 L 206);
        - *herbeplanten:* door aanplant, bezaaiing of natuurlijke verjonging dan wel op andere wijze realiseren van een
      nieuwe houtopstand;
        - *houtopstand:* zelfstandige eenheid van bomen, boomvormers, struiken, hakhout of griend, die: a. een oppervlakte
      grond beslaat van tien are of meer, of b. bestaat uit een rijbeplanting die meer dan twintig bomen omvat, gerekend
      over het totaal aantal rijen;
        - *instandhouding:* geheel van maatregelen die nodig zijn voor het behoud of herstel van natuurlijke habitats en
      populaties van wilde dier- en plantensoorten in een gunstige staat van instandhouding;
        - *instandhoudingsdoelstellingen:* instandhoudingsdoelstellingen als bedoeld in [artikel 2.1, vierde lid][ref5];
        - *invasieve exoten:* exoten die wanneer zij zich gevestigd hebben of zouden vestigen in de Nederlandse natuur: a.
      een gevaar kunnen opleveren voor het voortbestaan van dier- of plantensoorten die van nature in Nederland of elders
      voorkomen, of b. een aanmerkelijke verslechtering kunnen veroorzaken van omstandigheden die voor het voortbestaan
      van soorten als bedoeld in onderdeel a noodzakelijk zijn;
        - *jacht:* bemachtigen, opzettelijk doden of met het oog daarop opsporen van wild als bedoeld in
      [artikel 3.20, tweede lid][ref6], alsmede het doen van pogingen daartoe, overeenkomstig [paragraaf 3.5][ref7];
        - *jachtakte:* jachtakte als bedoeld in [artikel 3.26, eerste lid, onderdeel a][ref8];
        - *jachthouder:* degene die krachtens [artikel 3.23][ref9] gerechtigd is tot het uitoefenen van de jacht in een
      veld;
        - *jachtopzichter:* degene die zorg draagt voor de bescherming van de jachtbelangen van een jachthouder
      en tevens als buitengewoon opsporingsambtenaar is belast met de opsporing van de bij of krachtens
      deze wet strafbaar gestelde feiten en van de overige in de akte of aanwijzing als bedoeld in
      [artikel 142, tweede lid, van het Wetboek van Strafvordering][ref10] aangeduide strafbare feiten;
        - *Natura 2000:* Europees ecologisch netwerk dat bestaat uit de speciale beschermingszones, bedoeld in artikel 4,
      eerste en tweede lid, van de Vogelrichtlijn en artikel 1, onderdeel l, van de Habitatrichtlijn;
        - *Natura 2000-gebied:* gebied dat: a. door de bevoegde autoriteit van het land waarin het gebied is gelegen is
      aangewezen als speciale beschermingszone, ter uitvoering van de artikelen 3, tweede lid, onderdeel a, en 4, eerste
      en tweede lid, van de Vogelrichtlijn of de artikelen 3, tweede lid, en 4, vierde lid, van de Habitatrichtlijn,
      of b. is opgenomen op de lijst van gebieden van communautair belang, bedoeld in artikel 4, tweede lid, van de
      Habitatrichtlijn;
        - *natuurlijke habitat:* geheel natuurlijke of halfnatuurlijke land- of waterzone met bijzondere geografische,
      abiotische en biotische kenmerken;
        - *omgevingsvergunning:* omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref11];
        - *Onze Minister:* Onze Minister van Economische Zaken;
        - *prioritaire soort:* soort die in bijlage II bij de Habitatrichtlijn als zodanig is aangeduid;
        - *prioritair type natuurlijke habitat:* type natuurlijke habitat dat in bijlage I bij de Habitatrichtlijn als
      zodanig is aangeduid;
        - *speciale beschermingszone:* op grond van [artikel 2.1, eerste lid][ref12], aangewezen gebied;
        - *staat van instandhouding van een natuurlijke habitat:* som van de invloeden die op de betrokken natuurlijke
      habitat en de daar voorkomende typische soorten inwerken en op lange termijn een verandering kunnen bewerkstelligen
      in de natuurlijke verspreiding, de structuur en de functies van die habitat of die van invloed kunnen zijn op
      het voortbestaan op lange termijn van de betrokken typische soorten op het grondgebied, bedoeld in artikel 2 van
      de Habitatrichtlijn;
        - *staat van instandhouding van een soort:* effect van de som van de invloeden die op de betrokken soort inwerken
      en op lange termijn een verandering kunnen bewerkstelligen in de verspreiding en de grootte van de populaties van
      die soort op het grondgebied, bedoeld in artikel 2 van de Habitatrichtlijn;
        - *valkeniersakte:* valkeniersakte als bedoeld in [artikel 3.30, eerste lid, onderdeel a][ref13];
        - *Verdrag van Bern:* op 19 september 1979 te Bern tot stand gekomen Verdrag inzake het behoud van wilde dieren en
      planten en hun natuurlijke leefmilieus (Trb. 1980, 60), naar de tekst zoals deze bij dat verdrag is vastgesteld;
        - *Verdrag van Bonn:* op 23 juni 1979 te Bonn tot stand gekomen Verdrag inzake de bescherming van trekkende wilde
      diersoorten (Trb. 1980, 145) naar de tekst zoals deze bij dat verdrag is vastgesteld;
        - *Vogelrichtlijn:* [richtlijn 2009/147/EG](32009L0147) van het Europees Parlement en de Raad van 30 november 2009
      inzake het behoud van de vogelstand (PbEU 2010, L 20);
        - *wildbeheereenheid:* wildbeheereenheid als bedoeld in [artikel 3.14, eerste lid][ref14].


