  - number: 5.4.4
    text: 'De jachtakte wordt in elk geval ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.4.a
    text: |-
      de ter verkrijging van de akte verstrekte gegevens zodanig onjuist of onvolledig blijken, dat, waren de juiste
      gegevens verstrekt, de akte zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.4.b
    text: |-
      blijkt dat de burgerrechtelijke aansprakelijkheid, bedoeld in [artikel 3.26, eerste lid, onderdeel c][ref1], niet
      langer overeenkomstig het bepaalde bij of krachtens dat artikelonderdeel en [artikel 3.29, eerste lid][ref2], is
      gedekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 5.4.4.c
    text: |-
      de houder misbruik heeft gemaakt van wapens of munitie dan wel van de bevoegdheid om wapens of munitie voorhanden
      te hebben, of indien er anderszins aanwijzingen zijn dat aan hem het voorhanden hebben van wapens of munitie niet
      langer kan worden toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.5
    text: Het vierde lid, onderdeel a in samenhang met de aanhef, is van overeenkomstige toepassing op de valkeniersakte.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.6
    text: 'De jachtakte of de valkeniersakte kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.6.a
    text: er grond is om aan te nemen dat de houder van zijn bevoegdheid om de jacht uit te oefenen misbruik maakt;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.6.b
    text: de houder nalatig is te doen wat een goed jager betaamt bij de uitoefening van de jacht;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.6.c
    text: |-
      er grond is om aan te nemen dat de houder van zijn bevoegdheden in het kader van beheer en schadebestrijding op
      grond van de [paragrafen 3.1][ref1], [3.2][ref2], [3.3][ref3] en [3.6][ref4], misbruik maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
