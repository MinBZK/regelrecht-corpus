  - number: 3.30.3
    text: |-
      Het is verboden eendenkooien te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet, zonder
      daartoe een door Onze Minister erkend examen met gunstig gevolg te hebben afgelegd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan het examen, bedoeld in het derde lid,
      moet voldoen om door Onze Minister te worden erkend. Met een door Onze Minister erkend examen als bedoeld in het
      derde lid wordt gelijk gesteld, een examen dat is erkend door de bevoegde autoriteit van een andere staat en dat
      door Onze Minister als gelijkwaardig aan de door hem erkende examens is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.5
    text: |-
      Het is ieder ander dan de kooiker van een eendenkooi, waarvoor een recht van afpaling geldt, of degene die handelt
      met toestemming van die kooiker, verboden binnen de afpalingkring van die kooi handelingen te verrichten waardoor
      eenden binnen de afpalingkring kunnen worden verontrust.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.6
    text: |-
      Het verbod, bedoeld in het vijfde lid, is, indien redelijkerwijs niet kan worden gevergd dat de handelingen niet,
      op andere wijze of op een ander tijdstip worden verricht, niet van toepassing op handelingen verricht:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.6.a
    text: ter uitvoering van openbare werken;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.6.b
    text: bij het gebruik en onderhoud van hetgeen door die werken is tot stand gebracht, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.6.c
    text: ter uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.7
    text: |-
      Degene die de handelingen, bedoeld in het zesde lid, verricht, vergoedt de schade die daaruit voor het gebruik van
      de eendenkooi voortvloeit aan de kooiker, tenzij anders met de kooiker is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.8
    text: |-
      Het vijfde tot en met zevende lid zijn niet van toepassing voor zover een recht op afpaling op 1 april 1977 niet
      bestond.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.9
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van afpaling van de eendenkooi.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.31.1
