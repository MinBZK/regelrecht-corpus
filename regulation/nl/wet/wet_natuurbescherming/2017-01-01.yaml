  - number: 5.4.7
    text: |-
      De bevoegdheid tot het nemen van beschikkingen tot intrekking van jachtakten berust bij de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
