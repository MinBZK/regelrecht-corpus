  - number: 5.5.3
    text: |-
      Ingeval op grond van [artikel 1.13, eerste lid][ref1], aanhef in samenhang met onderdeel a, een programma
      is vastgesteld dat betrekking heeft op Natura 2000-gebieden, wordt geen vergunning als bedoeld in
      [artikel 2.7, tweede lid][ref2], verleend voor een project dat of andere handeling die betrekking heeft op een
      inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref3] en dat, onderscheidenlijk die
      een belasting veroorzaakt van natuurwaarden van het desbetreffende, in het programma opgenomen Natura 2000-gebied
      door de factor waarvoor het programma is vastgesteld, op grond van het feit dat in verband met dit project of deze
      andere handeling onmiddellijk een afname van de belasting door de desbetreffende factor plaatsvindt als gevolg van
      de beëindiging of beperking van een of meer bepaalde andere handelingen buiten die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 5.6.1
    text: |-
      Een plan dat betrekking heeft op een gebied, zijnde een bestaand of te ontwikkelen stedelijk gebied of
      bedrijventerrein, en dat is gericht op een optimalisering van de milieugebruiksruimte met het oog op een
      duurzame ruimtelijke en economische benutting of ontwikkeling van dat gebied in samenhang met het behoud of
      de totstandbrenging van een goede milieukwaliteit, kan de voorwaarden, voorschriften en beperkingen bevatten
      waaronder een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], wordt verleend, indien op grond van een
      voor dat plan opgestelde passende beoordeling de zekerheid is verkregen dat projecten die aan deze voorwaarden,
      voorschriften en beperkingen voldoen aan [artikel 2.8, derde lid][ref2], dan wel het vierde, vijfde, zesde en
      zevende lid, onderscheidenlijk een beoordeling is uitgevoerd van andere handelingen overeenkomstig artikel 2.8,
      negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.6.2
    text: |-
      Het bestuursorgaan dat bevoegd is voor de verlening van vergunningen als bedoeld in
      [artikel 2.7, tweede lid][ref1], voor projecten of andere handelingen in een gebied als bedoeld in het eerste lid,
      kan voorafgaand aan de vaststelling van een daarop betrekking hebbend plan instemming verlenen aan de in het eerste
      lid genoemde voorwaarden, voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.6.3
    text: |-
      Een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], wordt verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.6.3.a
    text: het project of de andere handeling voldoet aan de voorwaarden, opgenomen in een plan als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
  - number: 5.6.3.b
    text: de beoordelingen, genoemd in het eerste lid, op het moment van de verlening van de vergunning actueel zijn, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
  - number: 5.6.3.c
    text: |-
      het bestuursorgaan dat bevoegd is voor de verlening van de vergunning instemt, of voorafgaand aan de vaststelling
      van het in het eerste lid genoemde plan heeft ingestemd met de in het eerste lid genoemde voorwaarden,
      voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
  - number: 5.6.4
    text: |-
      Aan een vergunning als bedoeld in het derde lid worden de in het plan op grond van het eerste lid opgenomen
      voorschriften verbonden. Zij wordt onder de in het plan op grond van het eerste lid opgenomen beperkingen verleend.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.6
  - number: 6.1.1
    text: |-
      Gedeputeerde staten verlenen in voorkomende gevallen tegemoetkomingen in schade, geleden in hun provincie,
      aangericht door natuurlijk in het wild levende:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.1
  - number: 6.1.1.a
    text: vogels van vogelsoorten als bedoeld in artikel 1 van Vogelrichtlijn, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.1
  - number: 6.1.1.b
    text: |-
      dieren die worden genoemd in bijlage IV, onderdeel a, bij de Habitatrichtlijn, bijlage II bij het Verdrag van Bern,
      bijlage I bij het Verdrag van Bonn of de bijlage, onderdeel a, bij deze wet.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend voor zover een belanghebbende schade lijdt
      of zal lijden aangericht door dieren als bedoeld in het eerste lid, en die schade redelijkerwijs niet of niet
      geheel te zijnen laste behoort te blijven. Een tegemoetkoming wordt naar billijkheid bepaald.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.1
  - number: 6.1.3
    text: |-
      Ingeval schade als bedoeld in het eerste lid mede wordt geleden in een andere provincie, wordt een besluit
      als bedoeld in het eerste lid genomen door gedeputeerde staten waar de schade in hoofdzaak wordt geleden, in
      overeenstemming met gedeputeerde staten van die andere provincie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.1
  - number: 6.2.1
    text: 'Onze Minister kan een vergoeding van kosten vragen overeenkomstig een door hem vastgesteld tarief voor:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
  - number: 6.2.1.a
    text: |-
      de behandeling van een aanvraag van een vergunning of ontheffing, vereist op grond van deze wet, met inbegrip
      van een aanvraag tot verlenging of wijziging daarvan, voor de verlening waarvan Onze Minister bevoegd is, en de
      handelingen die nodig zijn voor de instandhouding van een vergunning of ontheffing;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
  - number: 6.2.1.b
    text: |-
      de behandeling van een aanvraag van afgifte van een valkeniersakte of van andere documenten die benodigd
      zijn op grond van het bepaalde bij of krachtens [artikel 3.37, eerste of tweede lid][ref1], [3.38][ref2] of
      [4.8, eerste, tweede of vierde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 6.2.1.c
    text: de behandeling van een aanvraag van afgifte van krachtens deze wet voorgeschreven ringen, merken of merktekens;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
  - number: 6.2.1.d
    text: |-
      de uitvoering van een controle of verificatie als bedoeld in een EU-verordening of EU-richtlijn als bedoeld in
      [artikel 3.36][ref1] of [4.7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 6.2.1.e
    text: |-
      de goedkeuring van een gedragscode als bedoeld in [artikel 3.31, eerste lid][ref1], of
      [artikel 4.4, eerste lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 6.2.2
    text: |-
      De korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1] kan een vergoeding van kosten vragen
      overeenkomstig een door Onze Minister vastgesteld tarief voor het verstrekken van een jachtakte.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 6.2.3
    text: |-
      Een organisatie als bedoeld in [artikel 3.38, onderdeel d][ref1], kan een vergoeding van kosten vragen
      overeenkomstig een door Onze Minister vastgesteld tarief voor het verstrekken van ringen, merken of merktekens.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 6.2.4
    text: 'Provinciale staten kunnen een vergoeding van kosten vragen overeenkomstig een door hen vastgesteld tarief voor:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
  - number: 6.2.4.a
    text: |-
      de behandeling van een aanvraag van een vergunning of ontheffing, vereist op grond van deze wet, met inbegrip van
      een aanvraag tot verlenging of wijziging daarvan, voor de verlening waarvan zij bevoegd zijn, en de handelingen die
      nodig zijn voor de instandhouding van een vergunning of ontheffing;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
  - number: 6.2.4.b
    text: |-
      de behandeling van een aanvraag tot het nemen van een besluit over de verlening van een tegemoetkoming in schade
      als bedoeld in [artikel 6.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel6
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.1
    text: |-
      Het bevoegd gezag kent degene die in de vorm van een inkomensderving of een vermindering van de waarde van een
      onroerende zaak schade lijdt of zal lijden als gevolg van een krachtens deze wet door hem genomen, of door hem
      geacht te zijn genomen besluit, met uitzondering van een besluit als bedoeld in [artikel 2.1, eerste lid][ref1],
      op aanvraag een tegemoetkoming toe, voor zover de schade redelijkerwijs niet voor rekening van de aanvrager behoort
      te blijven en voor zover de tegemoetkoming niet voldoende anderszins is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.3.2
    text: |-
      Een aanvraag wordt ingediend binnen vijf jaar na het moment waarop de oorzaak, bedoeld in het eerste lid,
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.3
    text: |-
      Het bevoegd gezag kan een schadebeoordelingscommissie instellen, en kan over de aanvraag het advies van deze
      schadebeoordelingscommissie inwinnen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.4
    text: 'Bij de beslissing op de aanvraag betrekt het bevoegd gezag in elk geval:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.4.a
    text: de voorzienbaarheid van de schadeoorzaak;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.4.b
    text: de mogelijkheden van de aanvrager om de schade te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.5
    text: Binnen het normale maatschappelijke risico vallende schade blijft voor rekening van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.6
    text: 'Indien het bevoegd gezag een tegemoetkoming toekent, vergoedt het bevoegd gezag daarbij ook:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.6.a
    text: |-
      de redelijkerwijs gemaakte kosten van door een derde beroepsmatig verleende rechtsbijstand en andere deskundige
      bijstand;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.6.b
    text: de wettelijke rente, te rekenen met ingang van de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.7
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.8
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.8.a
    text: de indiening en motivering van een aanvraag voor tegemoetkoming in de schade;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.8.b
    text: de procedure voor de behandeling van een aanvraag voor een tegemoetkoming in de schade;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.8.c
    text: de beoordeling van een aanvraag voor een tegemoetkoming in de schade;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.8.d
    text: de samenstelling van een door één van Onze Ministers in te stellen schadebeoordelingscommissie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.9
    text: |-
      Bij de maatregel, bedoeld in het achtste lid, kunnen provinciale staten worden verplicht om over de onderwerpen,
      bedoeld in het achtste lid, bij verordening regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 6.3.10
    text: |-
      Het bevoegd gezag beslist binnen dertien weken na ontvangst van de aanvraag of, indien omtrent een verzoek om
      schadevergoeding advies krachtens het vierde lid is ingewonnen, binnen negen weken na ontvangst van het advies.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel6.3
  - number: 7.1.1
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.1
  - number: 7.1.1.a
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.1
  - number: 7.1.1.b
    text: |-
      de door Onze Minister van Veiligheid en Justitie op grond van
      [artikel 17 van de Wet op de economische delicten][ref1] met de opsporing van de bij of krachtens deze wet
      strafbaar gestelde feiten belaste ambtenaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
  - number: 7.1.1.c
    text: de bij besluit van gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Gedeputeerde staten zijn bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van het bepaalde
      bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang in plaats van gedeputeerde staten ter
      handhaving van het bepaalde bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.2
  - number: 7.2.2.a
    text: |-
      de [artikelen 1.11, eerste lid][ref1], [2.4, vierde lid][ref2], [2.7, tweede lid][ref3],
      [3.1, eerste, tweede, derde of vierde lid][ref4], [3.2, zesde lid][ref5], [3.4, eerste lid][ref6], [3.5][ref7],
      [3.6, tweede lid][ref8], [3.9, eerste lid][ref9], [3.10, eerste lid][ref10], [3.15, tweede of vierde lid][ref11],
      [3.16, tweede of vierde lid][ref12], [3.18, eerste lid, of vierde lid, in samenhang met het eerste lid][ref13],
      [3.32, eerste lid][ref14], [3.34, eerste of vijfde lid][ref15], [4.2, eerste, derde of vierde lid][ref16],
      [4.3, eerste, tweede of vijfde lid][ref17], of [5.3, vierde lid][ref18], voor zover de last betrekking heeft op
      handelingen of projecten van categorieën, aangewezen krachtens [artikel 1.3, vijfde lid][ref19] of op handelingen
      en projecten die plaatsvinden in of gevolgen hebben voor gebieden, behorende tot krachtens dat artikellid
      aangewezen categorieën;


