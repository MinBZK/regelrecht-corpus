      naar zijn oordeel de staat van instandhouding van soorten als bedoeld in [artikel 3.1][ref2], [3.5][ref3] of
      [3.10, eerste lid][ref4], of de trend in de staat van instandhouding van die soorten daartoe noodzaakt.


