  - number: 5.3.1
    text: Aan een vrijstelling, vergunning of ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.3
  - number: 5.3.2
    text: Een vrijstelling, vergunning of ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.3
  - number: 5.3.3
    text: Vrijstellingen, vergunningen en ontheffingen kunnen aan een geldigheidsduur worden gebonden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.3
  - number: 5.3.4
    text: Het is verboden te handelen in strijd met de bij een vergunning of ontheffing gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.3
  - number: 5.3.5
    text: |-
      Het eerste, tweede, derde en vierde lid zijn van overeenkomstige toepassing op een krachtens
      [artikel 3.18, eerste of vierde lid][ref1], gegeven opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 5.4.1
    text: 'Een bij of krachtens deze wet verleende vergunning of ontheffing kan worden ingetrokken of gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.1.a
    text: |-
      de houder van een vergunning, onderscheidenlijk ontheffing in strijd handelt met de hem verleende vergunning,
      onderscheidenlijk ontheffing of de daaraan verbonden voorschriften of beperkingen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.1.b
    text: |-
      de gegevens op grond waarvan de vergunning, onderscheidenlijk ontheffing is verleend zodanig onjuist of onvolledig
      blijken te zijn dat, waren de juiste gegevens bekend geweest, een andere beslissing zou zijn genomen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.1.c
    text: de vergunning, onderscheidenlijk ontheffing in strijd met wettelijke voorschriften is verleend, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.1.d
    text: |-
      de omstandigheden sedert het tijdstip waarop de vergunning, onderscheidenlijk ontheffing is verleend zodanig zijn
      gewijzigd, dat deze niet, niet zonder beperkingen of voorwaarden, of onder andere beperkingen of voorwaarden zou
      zijn verleend, indien deze omstandigheden op het tijdstip waarop de vergunning, onderscheidenlijk ontheffing is
      verleend zouden hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], wordt in elk geval ingetrokken of gewijzigd indien
      dat nodig is ter uitvoering van artikel 6, tweede lid, van de Habitatrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.4
    references:
