  - number: 9.7.1
    text: |-
      Vergunningen en ontheffingen, verleend krachtens de Vogelwet 1936, de [Jachtwet][ref1],
      [artikel 25 van de Natuurbeschermingswet][ref2] of de Wet bedreigde uitheemse dier- en plantensoorten blijven van
      kracht voor de tijd dat zij zijn verleend. [Artikel 5.4, eerste en derde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0002155
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '5'
        hoofdstuk: '5'
  - number: 9.7.2
    text: |-
      [Artikel 3.28, tweede lid, onderdeel a][ref1], is niet van toepassing op degene:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 9.7.2.a
    text: |-
      aan wie in de periode van 1 januari 1977 tot en met 31 maart 2002 een jachtakte als bedoeld in de [Jachtwet][ref1]
      is uitgereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0002155
  - number: 9.7.2.b
    text: |-
      aan wie in de periode van 1 april 2002 tot en met 30 september 2004 een jachtakte is uitgereikt onder het met
      gunstig gevolg behalen van een krachtens de [Jachtwet][ref1] erkend jachtexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0002155
  - number: 9.7.3
    text: |-
      Het verbod, bedoeld in [artikel 3.6][ref1], is niet van toepassing ten aanzien van dieren en planten die uiterlijk
      op 10 juni 1994 aantoonbaar overeenkomstig de op dat moment geldende regelgeving aan de natuur zijn onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 9.8.1
    text: |-
      [Artikel 3.28, derde lid, onderdeel d][ref1], is van overeenkomstige toepassing ingeval van
      een veroordeling wegens overtreding van een bij of krachtens de [Flora- en faunawet][ref2],
      [hoofdstuk III van de Gezondheids- en welzijnswet voor dieren][ref3] of de [Wet op de dierenbescherming][ref4]
      gestelde bepaling, of ingeval van een uitvaardiging van een strafbeschikking deswege.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009640
      [ref3]: https://wetten.overheid.nl/BWBR0005662#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0002351
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0009640
      - id: ref3
        bwb_id: BWBR0005662
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002351
  - number: 9.8.2
    text: |-
      Artikel 5.4, derde lid, onderdeel a, is van overeenkomstige toepassing ingeval van een onherroepelijke
      veroordeling wegens overtreding van een bij of krachtens de [Flora- en faunawet][ref1],
      [hoofdstuk III van de Gezondheids- en welzijnswet voor dieren][ref2] of de [Wet op de dierenbescherming][ref3]
      gestelde bepaling, of ingeval van een uitvaardiging van een strafbeschikking deswege.


      [ref1]: https://wetten.overheid.nl/BWBR0009640
      [ref2]: https://wetten.overheid.nl/BWBR0005662#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002351
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0009640
      - id: ref2
        bwb_id: BWBR0005662
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002351
  - number: 9.8.3
    text: |-
      [Artikel 5.4, zesde lid, onderdelen a en c][ref1], is van overeenkomstige toepassing ingeval van misbruik van
      de bevoegdheden, gegeven bij of krachtens de [Flora- en faunawet][ref2], onderscheidenlijk het begaan van bij of
      krachtens de Flora- en faunawet strafbaar gestelde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009640
  - number: 9.8.4
    text: |-
      [Artikel 7.3][ref1] is van overeenkomstige toepassing ten aanzien van planten, dieren of producten van planten of
      dieren als bedoeld in het eerste lid van dat artikel die in strijd met de Flora- en faunawet binnen het grondgebied
      van Nederland zijn gebracht, en ten aanzien van levende dieren als bedoeld in het tweede lid van dat artikel die in
      strijd met de [Flora- en faunawet][ref2] zijn gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009640
  - number: 9.9.1
    text: |-
      Besluiten als bedoeld in [artikel 1, vijfde lid, van de Boswet][ref1] gelden als besluiten als bedoeld in
      [artikel 4.1, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.9.2
    text: |-
      Kennisgevingen als bedoeld in [artikel 2, eerste lid, van de Boswet][ref1] gelden als meldingen als bedoeld in
      [artikel 4.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.9.3
    text: |-
      [Artikel 4.3, eerste lid][ref1], is van toepassing op degene waarvoor in de periode, gelegen tussen
      het tijdstip van inwerkingtreding van deze wet uiterlijk en drie jaar vóór dat tijdstip, als bedoeld in
      [artikel 3, eerste lid, van de Boswet][ref2] een verplichting tot herbeplanting is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
  - number: 9.9.4
    text: |-
      [Artikel 4.3, tweede lid][ref1], is van toepassing op degene waarvoor in de periode, gelegen tussen
      het tijdstip van inwerkingtreding van deze wet uiterlijk en drie jaar vóór dat tijdstip, als bedoeld in
      [artikel 3, tweede lid, van de Boswet][ref2] een verplichting tot vervanging van herbeplanting is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
  - number: 9.9.5
    text: |-
      Vrijstellingen als bedoeld in [artikel 6, eerste lid, van de Boswet][ref1] die onmiddellijk voor het tijdstip
      van inwerkingtreding van deze wet van kracht zijn, gelden voor de periode waarvoor zij van toepassing zijn, als
      vrijstellingen als bedoeld in [artikel 4.5, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.9.6
    text: |-
      Ontheffingen als bedoeld in [artikel 6, tweede lid, van de Boswet][ref1] gelden als ontheffingen als bedoeld in
      [artikel 4.5, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.9.7
    text: |-
      Verboden als bedoeld in [artikel 13, eerste lid, van de Boswet][ref1] gelden als verboden als bedoeld
      [artikel 4.2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.10.1
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige procedures tot het nemen van een besluit krachtens
      de [Natuurbeschermingswet 1998][ref1], de [Flora- en faunawet][ref2] of de [Boswet][ref3], zijn aanhangig in
      de staat waarin zij zich op dat moment bevinden en worden vanaf het tijdstip van inwerkingtreding van deze wet
      overeenkomstig het bepaalde bij en krachtens deze wet behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641
      [ref2]: https://wetten.overheid.nl/BWBR0009640
      [ref3]: https://wetten.overheid.nl/BWBR0002357
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0009641
      - id: ref2
        bwb_id: BWBR0009640
      - id: ref3
        bwb_id: BWBR0002357
  - number: 9.10.2
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaarschriften die betrekking hebben op het
      nemen van een besluit krachtens de [Natuurbeschermingswet 1998][ref1], de [Flora- en faunawet][ref2] of de
      [Boswet][ref3], zijn aanhangig in de staat waarin zij zich op dat moment bevinden en worden vanaf het tijdstip van
      inwerkingtreding van deze wet overeenkomstig het bepaalde bij en krachtens deze wet behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641
      [ref2]: https://wetten.overheid.nl/BWBR0009640
      [ref3]: https://wetten.overheid.nl/BWBR0002357
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0009641
      - id: ref2
        bwb_id: BWBR0009640
      - id: ref3
        bwb_id: BWBR0002357
  - number: 9.10.3
    text: |-
      Beroepszaken, gericht tegen besluiten krachtens de [Natuurbeschermingswet 1998][ref1], de
      [Flora- en faunawet][ref2] of de [Boswet][ref3] die zijn bekendgemaakt voor het tijdstip van inwerkingtreding van
      deze wet, worden behandeld en beslist overeenkomstig de bepalingen van die desbetreffende wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0009641
      [ref2]: https://wetten.overheid.nl/BWBR0009640
      [ref3]: https://wetten.overheid.nl/BWBR0002357
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0009641
      - id: ref2
        bwb_id: BWBR0009640
      - id: ref3
        bwb_id: BWBR0002357
  - number: 9.10.4
    text: |-
      In zoverre in afwijking van het eerste en het tweede lid is Onze Minister bevoegd tot het nemen van een besluit
      over aanvragen van ontheffingen als bedoeld in [artikel 75, derde lid, van de Flora- en faunawet][ref1] die
      zijn ingediend voor het tijdstip van inwerkingtreding van deze wet en tot het beslissen op bezwaarschriften die
      betrekking hebben op die besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
  - number: '9.11'
    text: |-
      De gebieden die op het moment van inwerkingtreding van deze wet zijn aangewezen op grond van
      [artikel 2.10.2 van het Besluit algemene regels ruimtelijke ordening][ref1] zoals dat luidt onmiddellijk voor het
      tijdstip van inwerkingtreding van deze wet, gelden als gebieden die behoren tot het natuurnetwerk Nederland als
      bedoeld in [artikel 1.12, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 9.12.1
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 12.1][ref1] gaan alle vermogensbestanddelen van het Faunafonds,
      bedoeld in [artikel 83, eerste lid, van de Flora- en faunawet][ref2], zoals dat onmiddellijk voor dat tijdstip
      gold, onder algemene titel over op de provincies gezamenlijk, zonder dat daarvoor een akte of betekening nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel83
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '83'
  - number: 9.12.2
    text: |-
      De liquide middelen die behoren tot de vermogensbestanddelen, bedoeld in het eerste lid, worden op een
      afzonderlijke, gemeenschappelijke rekening geboekt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
  - number: 9.12.3
    text: |-
      Gedeputeerde staten van de provincies wijzen gezamenlijk een persoon of rechtspersoon aan die is belast met
      de vereffening van het vermogen van het Faunafonds. Gedeputeerde staten kunnen gezamenlijk deze persoon of
      rechtspersoon aanwijzingen geven over de wijze van de vereffening en de verantwoording daarover.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
  - number: 9.12.4
    text: |-
      De persoon of rechtspersoon, bedoeld in het derde lid, is bevoegd alle rechtshandelingen te verrichten met het oog
      op de vereffening van het vermogen van het Faunafonds, waaronder het innen van vorderingen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
  - number: 9.12.5
    text: |-
      Rechtsvorderingen die tot het vermogen van het Faunafonds behorende rechten of verplichtingen tot onderwerp hebben,
      worden ingesteld door en tegen de provincies gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
  - number: 9.12.6
    text: De kosten van de vereffening van het vermogen van het Faunafonds komen ten laste van dat vermogen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
  - number: 9.12.7
    text: |-
      Gedeputeerde staten als bedoeld in [artikel 6.1][ref1] zijn bevoegd tot het nemen van
      besluiten die samenhangen met besluiten over het verlenen van tegemoetkomingen als bedoeld in
      [artikel 83, eerste lid, onderdeel b, van de Flora- en faunawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel83
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '83'
  - number: 9.12.8
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij het Faunafonds betrokken is, worden aanhangig gemaakt of voortgezet
      door of tegen gedeputeerde staten als bedoeld in [artikel 6.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel6
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '6'
        hoofdstuk: '6'
  - number: '9.13'
    text: |-
      Het besluit tot aanwijzing van gebieden als nationaal park, neergelegd in
      [artikel 2 van de Regeling aanwijzing nationale parken][ref1] zoals dat luidt onmiddellijk voor het tijdstip van
      inwerkingtreding van deze wet, geldt als besluit als bedoeld in [artikel 8.3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022396#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel8
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.13
    references:
      - id: ref1
        bwb_id: BWBR0022396
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '8'
        hoofdstuk: '8'
  - number: '12.1'
    text: 'De volgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.1
  - number: 12.1.a
    text: |-
      [Boswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002357
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0002357
  - number: 12.1.b
    text: |-
      [Flora- en faunawet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: 12.1.c
    text: |-
      [Natuurbeschermingswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.1
    references:
