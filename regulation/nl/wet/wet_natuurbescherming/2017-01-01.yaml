  - number: 3.17.1.b.3°
    text: |-
      in het belang van de volksgezondheid en de openbare veiligheid of om andere dwingende redenen van groot openbaar
      belang, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.1.c
    text: |-
      ingeval dieren van soorten als bedoeld in [3.10, eerste lid][ref1], met uitzondering van soorten als bedoeld in
      [artikel 3.5, eerste lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.17.1.c.1°
    text: om de redenen genoemd in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.1.c.2°
    text: |-
      ter voorkoming van schade of overlast, met inbegrip van schade aan sportvelden, industrieterreinen of
      begraafplaatsen,
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.1.c.3°
    text: ter voorkoming of bestrijding van onnodig lijden van zieke of gebrekkige dieren, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.1.c.4°
    text: in het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Een ontheffing als bedoeld in het eerste lid wordt verleend aan een faunabeheereenheid, die handelt overeenkomstig
      het daartoe vastgestelde en goedgekeurde faunabeheerplan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      De faunabeheereenheid kan bij schriftelijke en gedagtekende toestemming de haar ingevolge het eerste en tweede lid
      toegestane handelingen door een wildbeheereenheid of anderen doen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.4
    text: |-
      In afwijking van het tweede lid kan een ontheffing ook aan een wildbeheereenheid of aan anderen dan een
      faunabeheereenheid worden verleend, indien de noodzaak ontbreekt voor verrichting van de handelingen door
      tussenkomst van een faunabeheereenheid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
  - number: 3.17.5
    text: |-
      In afwijking van [artikel 3.12, eerste lid][ref1], en het tweede lid kan een ontheffing worden verleend voor
      handelingen die niet op grond van een faunabeheerplan worden verricht, indien de noodzaak ontbreekt voor een
      faunabeheerplan, gelet op de specifieke kenmerken van de desbetreffende diersoort dan wel de aard of omvang van te
      verrichten handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.18.1
    text: |-
      Gedeputeerde staten kunnen aan faunabeheereenheden of wildbeheereenheden, aan andere samenwerkingsverbanden
      van personen, of aan personen opdracht geven om, in afwijking van het bepaalde bij of krachtens de
      [artikelen 3.1][ref1], [3.4, eerste lid][ref2], [3.5][ref3], [3.9, eerste lid][ref4], en [3.10, eerste lid][ref5],
      de omvang van een bij de opdracht aangeduide populatie van vogels of van dieren van soorten als bedoeld in
      artikel 3.5, eerste lid, of 3.10, eerste lid, te beperken als dat nodig is om de onderscheidenlijke redenen,
      genoemd in [artikel 3.17, eerste lid, onderdelen a, b en c][ref6]. De [artikelen 3.3, vierde en vijfde lid][ref7],
      [3.8, vijfde lid][ref8], en 3.10, tweede lid, zijn van overeenkomstige toepassing op die opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref6
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref7
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref8
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.18.2
    text: |-
      Gedeputeerde staten kunnen ten aanzien van één of meer van de door hen krachtens het eerste lid aangewezen personen
      of groepen van personen bepalen dat zij, ter uitvoering van de opdracht, bedoeld in het eerste lid:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
  - number: 3.18.2.a
    text: toegang hebben tot gronden, zo nodig met behulp van de sterke arm, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
  - number: 3.18.2.b
    text: handelen overeenkomstig een vastgesteld en goedgekeurd faunabeheerplan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
  - number: 3.18.3
    text: Gedeputeerde staten kunnen bepalen wat met de ingevolge het eerste lid bemachtigde dieren gebeurt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
  - number: 3.18.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op het beperken van de omvang van populaties
      van dieren die zijn aan te merken als exoten of van verwilderde dieren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Onze Minister wijst soorten invasieve exoten aan die in het belang van de bescherming van de wilde flora, de wilde
      fauna of de instandhouding van natuurlijke habitats worden bestreden.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Gedeputeerde staten dragen er zorg voor dat in hun provincie het aantal van de invasieve exoten, bedoeld in het
      eerste lid, zoveel mogelijk wordt teruggebracht.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.19
  - number: 3.19.3
    text: |-
      De aanwijzing, bedoeld in het eerste lid, vindt plaats in overeenstemming met de gedeputeerde staten, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.19
  - number: 3.19.4
    text: |-
      Gedeputeerde staten kunnen aan personen of samenwerkingsverbanden van personen opdracht geven tot het
      terugbrengen van het aantal planten van bij de opdracht aangeduide soorten, aangewezen krachtens het eerste lid.
      [Artikel 3.18, tweede en derde lid][ref1], is op de uitvoering van deze opdracht van overeenkomstige toepassing,
      met dien verstande dat in artikel 3.18, derde lid, in plaats van «dieren» wordt gelezen: planten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.20.1
    text: |-
      In afwijking van de [artikelen 3.1, eerste en vierde lid][ref1], [3.5, eerste en tweede lid][ref2], en
      [3.10, eerste lid][ref3], is het de jachthouder, en degenen in gezelschap van de jachthouder, toegestaan in zijn
      jachtveld wild te vangen, te doden en te verontrusten, en met het oog daarop op te sporen ter uitoefening van de
      jacht, indien is voldaan aan het bij en krachtens deze paragraaf en [paragraaf 3.6][ref4] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0037552
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.20.2
    text: 'Wild als bedoeld in het eerste lid zijn in het wild levende dieren van de volgende soorten:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.2.a
    text: fazant (Phasianus colchicus);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.2.b
    text: wilde eend (Anas platyrhynchos);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.2.c
    text: houtduif (Columba palumbus);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.2.d
    text: haas (Lepus Europaeus);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.2.e
    text: konijn (Oryctolagus cuniculus).
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.3
    text: |-
      De jachthouder doet datgene wat een goed jachthouder betaamt om een redelijke stand van de in zijn jachtveld
      aanwezige wild als bedoeld in het tweede lid te handhaven, dan wel, bij het ontbreken daarvan, te bereiken, en om
      schade door in zijn jachtveld aanwezig wild als bedoeld in het tweede lid te voorkomen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.20.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de jachtopzichter of anderen buiten het gezelschap van de
      jachthouder, indien de jachthouder aan hen daartoe een schriftelijke en gedagtekende toestemming heeft gegeven, en
      is voldaan aan bij of krachtens algemene maatregel van bestuur gestelde regels.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.20
  - number: 3.21.1
    text: 'Het is verboden bij de uitoefening van de jacht gebruik te maken van andere middelen dan:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.a
    text: geweren;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.b
    text: honden, niet zijnde lange honden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.c
    text: aantoonbaar gefokte jachtvogels van bij algemene maatregel van bestuur aangewezen soorten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.d
    text: eendenkooien die voldoen aan bij of krachtens algemene maatregel van bestuur gestelde regels;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.e
    text: lokeenden of lokduiven, die niet blind of verminkt zijn;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.f
    text: fretten;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.g
    text: buidels, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.1.h
    text: schermen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Het is verboden zich ter uitoefening van de jacht in het veld te bevinden met andere middelen dan die, bedoeld
      in het eerste lid. Degene die zich in het veld bevindt met voor de jacht geoorloofde middelen als bedoeld in het
      eerste lid, of met andere middelen waarmee kan worden gejaagd, wordt geacht zich daarmee ter uitoefening van de
      jacht in het veld te bevinden, tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.3
    text: |-
      Het is verboden de jacht uit te oefenen met gebruikmaking van het geweer binnen de bij besluit van de gemeenteraad
      vastgestelde grenzen van de bebouwde kom, of in de onmiddellijk aan de bebouwde kom grenzende terreinen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van het bepaalde bij of krachtens de Benelux-
      overeenkomst regels gesteld over de uitoefening van de jacht en het vervoer en in de handel brengen van wild.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de uitoefening van de jacht. Deze
      regels kunnen onder meer behelzen:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.5.a
    text: een verbod om de jacht uit te oefenen op zondagen en feestdagen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.5.b
    text: een verbod om de jacht uit te oefenen op bepaalde plaatsen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.5.c
    text: een verbod om de jacht uit te oefenen vanuit voertuigen, vaartuigen of luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.21.5.d
    text: |-
      een verbod om de jacht uit te oefenen als het wild, bedoeld in [artikel 3.20, tweede lid][ref1], kwetsbaar is
      vanwege weersomstandigheden of hun ontwikkelingsfase.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.21.6
    text: |-
      Het is verboden dieren door middel van een eendenkooi te vangen, tenzij de gevangen dieren terstond na het vangen
      in vrijheid worden gesteld of worden gedood.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Het is verboden om de jacht op wild als bedoeld in [artikel 3.20, tweede lid][ref1], uit te oefenen indien de
      jacht op de betreffende soort niet is geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.22.2
    text: |-
      Bij ministeriële regeling wordt bepaald in hoeverre de jacht is geopend. De opening van de jacht kan naar plaats of
      tijd worden beperkt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
  - number: 3.22.3
    text: |-
      De jacht op wild als bedoeld in [artikel 3.20, tweede lid][ref1], van soorten, genoemd in bijlage II bij de
      Vogelrichtlijn, wordt niet geopend gedurende de verschillende fasen van de broedperiode en de periode dat de jonge
      vogels het nest nog niet hebben verlaten, en, voor zover het trekvogels betreft, tevens gedurende de trek van deze
      vogels naar hun nestplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.22.4
    text: |-
      Gedeputeerde staten kunnen de jacht voor de hele provincie, of een gedeelte daarvan, voor een bepaalde tijd
      sluiten, zolang bijzondere weersomstandigheden dat vergen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
  - number: 3.22.5
    text: De jacht wordt niet geopend op soorten waarvan de staat van instandhouding in het geding is.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
  - number: 3.22.6
    text: |-
      Alvorens een ministeriële regeling als bedoeld in het tweede lid vast te stellen, te wijzigen of in te trekken,
      overlegt Onze Minister met gedeputeerde staten over het ontwerp daarvan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.22
  - number: 3.23.1
    text: 'Gerechtigd tot het uitoefenen van de jacht in een veld zijn, elkaar uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.a
    text: de eigenaar van de grond;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.b
    text: |-
      de erfpachter of vruchtgebruiker van de grond, tenzij de eigenaar zich bij het vestigen van het erfpachtrecht of
      het recht op vruchtgebruik het jachtrecht heeft voorbehouden en tenzij het jachtrecht ten tijde van het vestigen
      van het erfpachtrecht of het recht op vruchtgebruik al was verhuurd;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.c
    text: |-
      de pachter van de grond, tenzij de verpachter bij het aangaan van de pachtovereenkomst niet tot het uitoefenen van
      de jacht gerechtigd was of zich het recht tot de uitoefening van de jacht heeft voorbehouden en tenzij ten tijde
      van het aangaan van de pachtovereenkomst het jachtrecht al was verhuurd, dan wel
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.d
    text: |-
      degene die het jachtrecht bij schriftelijke en gedagtekende overeenkomst voor een periode van ten minste zes
      jaar en ten hoogste twaalf jaar heeft gehuurd van de ten tijde van het aangaan van de huurovereenkomst tot de
      uitoefening van de jacht gerechtigde:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.d.1°
    text: |-
      eigenaar, erfpachter, vruchtgebruiker of pachter van de grond, met toestemming van de grondgebruiker ingeval de
      verhuurder niet tevens grondgebruiker is, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.1.d.2°
    text: |-
      huurder van het jachtrecht, met toestemming van de eigenaar, erfpachter, vruchtgebruiker of pachter die het
      jachtrecht aan deze huurder heeft verhuurd en mits het jachtrecht in zijn geheel wordt weder verhuurd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      In de huurovereenkomst, bedoeld in het eerste lid, onderdeel d, kan niet worden afgeweken van
      [artikel 226, eerste, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1]. Zij bevat geen beding van
      optie of verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
  - number: 3.23.3
    text: |-
      Bij algemene maatregel van bestuur kan worden geregeld in welke gevallen het is toegestaan dat de periode, bedoeld
      in het eerste lid, onderdeel d, korter is dan zes jaar.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.23
  - number: 3.24.1
    text: Een ieder die een in het wild levend dier doodt of vangt voorkomt dat het dier onnodig lijdt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.24.2
    text: |-
      Het is verboden zich buiten gebouwen te bevinden met bij algemene maatregel van bestuur aangewezen middelen die
      geschikt zijn voor het doden of vangen van dieren, of met materialen ter onmiddellijke vervaardiging van die
      middelen, indien redelijkerwijs moet worden aangenomen dat die middelen of materialen zullen worden gebruikt voor
      het doden of vangen van dieren.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.24.3
    text: |-
      Bij een aanwijzing krachtens het tweede lid wordt mede rekening gehouden met het voorkomen van onnodig lijden bij
      het te doden of te vangen dier.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.24.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van het bepaalde bij of krachtens de Benelux-
      overeenkomst regels gesteld over het gebruik van middelen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.24.5
    text: |-
      Het is een ieder verboden zich in een veld te bevinden met een dier dat hem toebehoort of onder zijn toezicht staat
      en dat in het veld dieren opspoort, doodt, verwondt, vangt of bemachtigt.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.24.6
    text: |-
      Het verbod, bedoeld in het vijfde lid, is niet van toepassing ingeval het opsporen, doden, verwonden, vangen of
      bemachtigen van dieren in het veld ingevolge het bepaalde bij of krachtens deze wet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Bij het verlenen van een ontheffing of vrijstelling als bedoeld in de
      [artikelen 3.3, eerste onderscheidenlijk tweede lid][ref1], [3.4, tweede lid][ref2],
      [3.8, eerste, onderscheidenlijk tweede lid][ref3], [3.9, tweede lid][ref4], of [3.10, tweede lid][ref5], in
      samenhang met artikel 3.8, eerste of tweede lid, en met artikel 3.9, tweede lid, en bij het geven van een opdracht
      als bedoeld in [artikel 3.18, eerste lid][ref6], worden de middelen aangewezen die voor het vangen en doden van de
      aldaar bedoelde vogels en dieren mogen worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
    references:
