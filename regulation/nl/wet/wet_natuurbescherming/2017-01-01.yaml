    text: |-
      Ingeval op grond van [artikel 1.13, eerste lid][ref1], een programma is vastgesteld dat betrekking
      heeft op Natura 2000-gebieden, kan bij algemene maatregel van bestuur worden bepaald dat gedeputeerde
      staten bij een besluit over verlening van een vergunning als bedoeld in [artikel 2.7, tweede lid][ref2],
      en gedeputeerde staten, onderscheidenlijk provinciale staten bij de toepassing van
      [artikel 2.4, eerste, onderscheidenlijk derde lid][ref3], gedurende de periode waarvoor het programma geldt, niet
      de belasting van natuurwaarden van het desbetreffende Natura 2000-gebied betrekken door de factor waarvoor het
      programma is vastgesteld, indien het project of de handeling:


