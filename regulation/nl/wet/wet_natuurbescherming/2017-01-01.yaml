  - number: 4.4.1.c
    text: het vellen van houtopstanden voor de aanleg en het onderhoud van brandgangen op natuurterreinen, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.1.d
    text: |-
      het vellen van houtopstanden en herbeplanten op een wijze die is beschreven in en aantoonbaar wordt gerealiseerd
      overeenkomstig een door Onze Minister goedgekeurde gedragscode.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Een gedragscode als bedoeld in het eerste lid, onderdeel d, wordt goedgekeurd, indien daarin een wijze van vellen
      en een wijze van herbeplanten is beschreven waarmee naar het oordeel van Onze Minister afdoende is gewaarborgd dat:
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2.a
    text: geen afbreuk wordt gedaan aan bijzondere natuur- of landschapswaarden;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2.b
    text: de te vellen houtopstanden geen deel uitmaken van een boskern;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2.c
    text: herbeplanting op een bosbouwkundig verantwoorde wijze plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2.d
    text: |-
      de grond waarop herbeplanting plaatsvindt ten minste dezelfde kwaliteit heeft als de grond waarop de gevelde
      houtopstand zich bevond, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.2.e
    text: |-
      de grond waarop de herbeplanting plaatsvindt ten minste een gelijke oppervlakte heeft als de grond waarop de
      gevelde houtopstand zich bevond.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Alvorens een gedragscode als bedoeld in het eerste lid, onderdeel d, of een wijziging daarvan, goed te keuren of in
      te trekken, overlegt Onze Minister met gedeputeerde staten over zijn voornemen daartoe.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Gedeputeerde staten kunnen ontheffing verlenen van [artikel 4.3, eerste en tweede lid][ref1], ten behoeve van
      herbeplanting op andere grond, indien de herbeplanting voldoet aan bij provinciale verordening gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.5.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de kwaliteit, oppervlakte en locatie
      van de andere grond en de natuurwaarde van de gevelde houtopstand.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Onverminderd het eerste lid, kunnen gedeputeerde staten van [artikel 4.2, eerste lid][ref1], of
      [artikel 4.3, eerste, tweede of vijfde lid][ref2], ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.5.4
    text: |-
      Provinciale staten kunnen bij verordening geheel of gedeeltelijk vrijstelling verlenen van
      [artikel 4.2, eerste lid][ref1], of [artikel 4.3, eerste, tweede of vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.7'
    text: |-
      EU-verordeningen en EU-richtlijnen als bedoeld in [artikel 4.8][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.7.a
    text: |-
      [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de Europese Unie van 20 december 2005 inzake de opzet
      van een FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU L 2005, 347);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.7
  - number: 4.7.b
    text: |-
      verordening (EU) nr. 995/2010 van het Europees Parlement en de Raad van de Europese Unie van 20 oktober 2010 tot
      vaststelling van de verplichtingen van marktdeelnemers die hout en houtproducten op de markt brengen (PbEU L 2010,
      295);
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.7
  - number: 4.7.c
    text: verordeningen die berusten op de verordening, bedoeld in onderdeel a of b, en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.7
  - number: 4.7.d
    text: |-
      bij algemene maatregel van bestuur aangewezen andere verordeningen en richtlijnen die geheel of gedeeltelijk
      berusten op de artikelen 114, 192, 207 of 352 van het Verdrag betreffende de werking van de Europese Unie, of op
      een andere bindende EU-rechtshandeling die op een of meer van die artikelen berust, en die betrekking hebben op het
      verhandelen, bezit of verwerken van aan de natuur onttrokken hout of houtproducten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.7
  - number: 4.8.1
    text: Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van EU-verordeningen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van onderdelen van EU-verordeningen en EU-
      richtlijnen die geen beoordelingsruimte laten, of die betrekking hebben op de wijze waarop aanvragen en documenten
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Onze Minister is de bevoegde instantie belast met de uitvoering van EU-verordeningen en EU-richtlijnen, indien deze
      verplichten tot het aanwijzen van een bevoegde instantie, tenzij Onze Minister een andere bevoegde instantie heeft
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.8
  - number: 4.8.4
    text: |-
      Onverminderd het eerste, tweede en derde lid, kunnen bij of krachtens algemene maatregel van bestuur ter uitvoering
      van EU-verordeningen en EU-richtlijnen regels worden gesteld met betrekking tot het verhandelen, in bezit hebben
      of verwerken van hout of houtproducten. [Artikel 3.38, tweede volzin][ref1], is van overeenkomstige toepassing ten
      aanzien van hout en houtproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: '4.9'
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens [artikel 4.8][ref1],
      overeenkomstig de voorwaarden en beperkingen die in voorkomend geval voortvloeien uit de toepasselijke EU-
      verordening of EU-richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 5.1.1
    text: |-
      Op een aanvraag om een bij of krachtens deze wet vereiste vergunning of ontheffing wordt binnen dertien weken na de
      datum van ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Het bevoegd gezag kan de termijn eenmaal met zeven weken verlengen. Van deze verlenging wordt mededeling gedaan aan
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Ingeval [artikel 2.8, vierde lid][ref1], van toepassing is, wordt de aanvrager van de vergunning door het
      bevoegd gezag tijdig tevoren in de gelegenheid gesteld om voorstellen voor compenserende maatregelen te doen.
      [Artikel 4.15 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.2'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag van een vergunning
      of ontheffing als bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel5.2
    references:
