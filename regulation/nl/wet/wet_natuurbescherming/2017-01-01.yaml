  - number: 3.15.5
    text: |-
      De vrijstelling, bedoeld in het tweede en vierde lid, wordt verleend voor handelingen op door de grondgebruiker
      gebruikte gronden, dan wel in of aan door hem gebruikte opstallen, ter voorkoming van in het lopende of daarop
      volgende jaar dreigende schade op deze gronden, in of aan deze opstallen, of in het omringende gebied.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6
    text: 'De schade, bedoeld in het tweede tot en met vijfde lid, heeft uitsluitend betrekking op:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6.a
    text: 'door vogels veroorzaakte:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6.a.1°
    text: belangrijke schade aan gewassen, vee, bossen, visserij, wateren, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6.a.2°
    text: schade aan flora of fauna;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.15
  - number: 3.15.6.b
    text: |-
      door dieren van soorten als bedoeld in [artikel 3.5, eerste lid][ref1], veroorzaakte:


