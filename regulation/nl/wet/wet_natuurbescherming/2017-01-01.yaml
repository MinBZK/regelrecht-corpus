  - number: '12.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.2
  - number: '12.3'
    text: 'Deze wet wordt aangehaald als: Wet natuurbescherming.'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel12.3
