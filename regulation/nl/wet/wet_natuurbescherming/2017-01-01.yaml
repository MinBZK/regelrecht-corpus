  - number: 8.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ter uitvoering van het bepaalde bij of krachtens
      [hoofdstuk 3][ref1] medewerking worden gevorderd van het bestuur van een productschap of een bedrijfschap als
      bedoeld in artikel 66 van de Wet op de bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        hoofdstuk: '3'
  - number: 8.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur als bedoeld in het eerste lid kunnen de ingevolge het bepaalde bij
      of krachtens deze wet aan Onze Minister toekomende bevoegdheden tot het nemen van besluiten en tot het vaststellen
      van regels of nadere regels, alsmede aan Onze Minister opgedragen taken worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.2
  - number: 8.2.3
    text: |-
      Indien de in het eerste lid bedoelde medewerking bestaat uit het stellen van regelen of nadere regelen bij
      verordening, behoeft zodanige verordening de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Onze Minister kan een gebied als nationaal park aanwijzen op verzoek van gedeputeerde staten van de provincie of
      provincies waarin het gebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2
    text: 'Een gebied wordt uitsluitend aangewezen als nationaal park, indien:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.a
    text: 'het een aaneengesloten gebied met een oppervlakte van ten minste 1.000 hectare betreft:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.a.1°
    text: waarin zich een of meer ecosystemen bevinden die niet wezenlijk zijn aangetast door menselijk gebruik,
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.a.2°
    text: |-
      waarin zich dier- en plantensoorten, geomorfologische locaties en habitats bevinden die een bijzonder
      natuurwetenschappelijk, educatief en recreatief belang vertegenwoordigen, of
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.a.3°
    text: dat een natuurlijk landschap van grote schoonheid omvat;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.b
    text: het behoud van de wezenlijke kenmerken van het gebied is verzekerd;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.c
    text: |-
      het gebied is opengesteld voor bezoekers voor educatieve, culturele en recreatieve doeleinden, met dien verstande
      dat aan de openstelling voorwaarden en beperkingen kunnen worden gesteld met het oog op het behoud van de
      wezenlijke kenmerken van het gebied; en
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.2.d
    text: het gebied zich duidelijk onderscheidt van eerder aangewezen nationale parken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.3.3
    text: |-
      Onze Minister kan, gehoord gedeputeerde staten van de betrokken provincie of provincies, een aanwijzing als bedoeld
      in het eerste lid wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Onze Minister zendt een voorstel voor een lijst van gebieden, geheel of gedeeltelijk gelegen in de exclusieve
      economische zone, of een voorstel tot aanpassing daarvan, als bedoeld in artikel 4, eerste lid, van de
      Habitatrichtlijn niet eerder aan de Europese Commissie toe dan vier weken nadat het ontwerp van dat voorstel aan
      beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.4
  - number: 8.4.2
    text: |-
      Een besluit als bedoeld in [artikel 2.1, eerste lid][ref1], of [artikel 2.11, eerste lid][ref2], met betrekking
      tot de aanwijzing van een gebied dat geheel of gedeeltelijk is gelegen in de exclusieve economische zone, wordt
      niet eerder genomen dan vier weken nadat het ontwerp van dat besluit aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '8.5'
    text: |-
      De voordracht voor een krachtens [artikel 2.9, vijfde lid][ref1], of [artikel 5.5, eerste lid][ref2], vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers
      der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.6.1
    text: |-
      Ingeval op grond van [artikel 1.13, eerste lid, aanhef in samenhang met onderdeel a][ref1], een programma is
      vastgesteld dat betrekking heeft op Natura 2000-gebieden, kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld die van toepassing zijn indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 8.6.1.a
    text: |-
      een project of een andere handeling als bedoeld in [artikel 2.7, tweede lid][ref1], gevolgen kan hebben voor een
      Natura 2000-gebied dat niet in het programma is opgenomen, of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.6.1.b
    text: |-
      ten aanzien van een project of een andere handeling als bedoeld in [artikel 2.7, tweede lid][ref1],
      bij die algemene maatregel van bestuur aangewezen bestuursorganen het besluit hebben genomen dat
      [artikel 5.5, derde lid][ref2], niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.6.2
    text: 'De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
  - number: 8.6.2.a
    text: |-
      de voorwaarden waaronder het verbod, bedoeld in [artikel 2.7, tweede lid][ref1], niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.6.2.b
    text: |-
      de voorwaarden waaronder vergunningen als bedoeld in [artikel 2.7, tweede lid][ref1], worden verleend en andere
      besluiten worden genomen waarbij moet zijn voldaan aan [artikel 2.8][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.6.2.c
    text: |-
      de voorschriften die worden gegeven bij een krachtens [artikel 2.4, eerste lid][ref1], op te leggen verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 8.6.2.d
    text: de voorwaarden waaronder een besluit als bedoeld in het eerste lid, onderdeel b, wordt genomen;
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
  - number: 8.6.2.e
    text: |-
      de maatregelen, te treffen door de bij het programma betrokken bestuursorganen of door degenen die projecten
      realiseren of andere handelingen verrichten als bedoeld in het eerste lid, gericht op het verkrijgen van
      overzicht van de bijdragen van deze projecten en andere handelingen aan de belasting van de natuurwaarden door de
      desbetreffende krachtens [artikel 1.13, eerste lid, onderdeel a][ref1], aangewezen factor.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 8.6.3
    text: |-
      De regels, bedoeld in het eerste lid, verzekeren dat op voorhand geen afbreuk wordt gedaan aan de doelstelling
      van het programma, bedoeld in het eerste lid, en dat op grond van objectieve gegevens op voorhand kan worden
      uitgesloten dat projecten of andere handelingen als bedoeld in het eerste lid afzonderlijk of in combinatie met
      andere plannen of projecten de natuurlijke kenmerken van een Natura 2000-gebied zullen aantasten.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.6
  - number: 9.1.1
    text: |-
      Besluiten tot aanwijzing van gebieden als bedoeld in
      [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref1], gelden als besluiten als bedoeld in
      [artikel 2.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.1.2
    text: |-
      Doelstellingen in een besluit als bedoeld in [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref1]
      opgenomen instandhoudingsdoelstelling die betrekking hebben op andere doelstellingen dan die ten aanzien van
      de leefgebieden voor vogelsoorten, nodig ter uitvoering van de Vogelrichtlijn, of dan die ten aanzien van de
      natuurlijke habitats en de habitats van soorten, nodig ter uitvoering van de Habitatrichtlijn, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
  - number: 9.1.3
    text: |-
      Onze Minister kan de tekst van een besluit als bedoeld in het tweede lid opnieuw vaststellen onder weglating van de
      doelstellingen die op grond van het tweede lid zijn vervallen. Tegen het besluit tot het opnieuw vaststellen van de
      tekst kan geen beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.1
  - number: 9.1.4
    text: |-
      Besluiten tot voorlopige aanwijzing van gebieden als bedoeld in
      [artikel 12, derde lid in samenhang met het eerste lid, van de Natuurbeschermingswet 1998][ref1], gelden als
      besluiten als bedoeld in [artikel 2.11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 9.2.1
    text: |-
      Beheerplannen als bedoeld in [artikel 19a, eerste lid][ref1], of
      [19b, eerste lid, van de Natuurbeschermingswet 1998][ref2], gelden voor het tijdvak waarvoor zij zijn vastgesteld
      als beheerplannen als bedoeld in [artikel 2.3, eerste lid, eerste volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19b
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.2.2
    text: |-
      Op een beheerplan dat onderdeel uitmaakt van een plan dat is gericht op het beheer van een gebied als bedoeld
      in [artikel 19b, tweede lid, van de Natuurbeschermingswet 1998][ref1], is [artikel 2.3, vijfde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.2.4
    text: |-
      Het eerste beheerplan voor een Natura 2000-gebied na aanwijzing van dat gebied op grond van
      [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref1], wordt uiterlijk drie jaar na dat besluit tot
      aanwijzing vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
  - number: 9.2.5
    text: |-
      Beschrijvingen opgenomen in beheerplannen als bedoeld in [artikel 19a][ref1] of
      [19b van de Natuurbeschermingswet 1998][ref2] die onmiddellijk voor het tijdstip van inwerkingtreding van deze
      wet van kracht zijn, die betrekking hebben op andere doelstellingen dan die ten aanzien van de leefgebieden voor
      vogelsoorten, nodig ter uitvoering van de Vogelrichtlijn, of dan die ten aanzien van de natuurlijke habitats en de
      habitats van soorten, nodig ter uitvoering van de Habitatrichtlijn, vervallen.


