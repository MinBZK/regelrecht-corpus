  - number: 8.1.1
    text: |-
      Tegen een beschikking van de korpschef als bedoeld in [artikel 3.28][ref1] of [5.4, vierde lid][ref2], staat,
      ingeval de jachtakte is geweigerd of ingetrokken of mede is geweigerd of ingetrokken om redenen als bedoeld in
      artikel 3.28, derde lid, onderdeel a, of 5.4, vierde lid, onderdeel c, administratief beroep open bij Onze Minister
      van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.1.2
    text: |-
      Een beroep tegen een besluit tot vaststelling van een beheerplan als bedoeld in [artikel 2.3, eerste lid][ref1],
      of van een programma als bedoeld in [artikel 1.13][ref2] heeft uitsluitend betrekking op de beschrijvingen
      van projecten of andere handelingen als bedoeld in [artikel 2.9, eerste lid][ref3], handelingen als bedoeld in
      [artikel 3.3, zevende lid, onderdeel b][ref4], [artikel 3.8, zevende lid, onderdeel b][ref5], al dan niet in
      samenhang met [artikel 3.10, tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel8.1
