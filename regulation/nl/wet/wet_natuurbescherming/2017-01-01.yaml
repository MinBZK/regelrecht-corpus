  - number: 3.30.1.b.4°
    text: |-
      de bestrijding van bij ministeriële regeling aangewezen verwilderde dieren of exoten, buiten de gevallen, bedoeld
      onder 3°.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
  - number: 3.30.2
    text: |-
      De valkeniersakte wordt verleend door Onze Minister. [Artikel 3.28][ref1] is van overeenkomstige toepassing op
      de valkeniersakte, met uitzondering van het eerste lid en het tweede lid, onderdelen c en d in samenhang met de
      aanhef.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.30
