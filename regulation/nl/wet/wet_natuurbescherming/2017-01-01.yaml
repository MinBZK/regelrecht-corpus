  - number: 1.1.2
    text: |-
      In deze wet en de daarop rustende bepalingen wordt mede verstaan onder: - *binnen of buiten het grondgebied van
      Nederland brengen:* elke handeling die is gericht op het bewerkstelligen van het binnen of buiten het grondgebied
      van Nederland brengen;
        - *dieren:* dieren in al hun ontwikkelingsstadia, levend of dood, delen van dieren, uit deze dieren verkregen
      producten, of andere zaken voor zover uit een begeleidend document, de verpakking, een merk of etiket, of uit
      andere omstandigheden blijkt dat het gaat om delen van dieren of daaruit verkregen producten, met uitzondering
      van eieren;
        - *eieren:* schalen van eieren;
        - *grond:* wateren;
        - *planten:* planten in al hun ontwikkelingsstadia, levend of dood, delen van planten, uit planten verkregen
      producten, geënte planten, of andere zaken voor zover uit een begeleidend document, de verpakking, een merk of
      etiket, of uit andere omstandigheden blijkt dat het gaat om delen van planten of daaruit verkregen producten;
        - *veld:* stranden, schorren, gorzen, kwelders, slikken, wadden, binnenwateren en territoriale wateren alsmede
      wegen en paden, voor zover deze geacht kunnen worden deel uit te maken van een voor de uitoefening van de jacht
      bestemd of geschikt terrein;
        - *vellen:* rooien of verrichten van andere handelingen die de dood of ernstige beschadiging van een houtopstand
      tot gevolg kunnen hebben;
        - *verhandelen:* onder zich hebben, te koop vragen, kopen, verwerven, verkopen, vervoeren, ten vervoer aanbieden,
      afleveren, gebruiken voor commercieel gewin, huren, verhuren, ruilen, of ten verkoop, vervoer, verhuur of ruil
      aanbieden, voorradig hebben of voorhanden hebben.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Onder de in [artikelen 1.10, derde lid][ref1], en [1.12][ref2], in de [hoofdstukken 2][ref3] en [3][ref4],
      [paragrafen 3.1][ref5] en [3.2][ref6] en [artikelen 3.15, zesde lid][ref7], [3.16, vijfde lid][ref8] en
      [3.17, eerste lid, onderdelen a en b][ref9], en in de [artikelen 5.5][ref10] en [6.1][ref11] gebruikte begrippen
      die tevens worden gebruikt in de artikelen 1, 3, tweede lid, onderdeel a, 4, eerste of tweede lid, 5, 6, eerste
      of tweede lid, 8 of 9 van de Vogelrichtlijn of de artikelen 2, 3, 4, 6, 12, 13, 14, 15 of 16, eerste lid, van de
      Habitatrichtlijn wordt verstaan hetgeen daaronder in die richtlijnen wordt verstaan.


