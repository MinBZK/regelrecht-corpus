  - number: 7.7.2
    text: |-
      Het eerste lid is niet van toepassing op politiegegevens als bedoeld in de Wet bescherming politiegegevens, en
      justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '7.8'
    text: |-
      De Nederlandse strafwet is van toepassing op een ieder die zich in de exclusieve economische zone schuldig maakt
      aan overtreding van regels gesteld bij of krachtens de [artikelen 1.11, eerste lid][ref1], [2.4, vierde lid][ref2],
      [2.5, derde lid][ref3], [2.6, derde lid][ref4], [2.7, tweede lid][ref5], [2.11, derde lid][ref6],
      [3.1, eerste, tweede, derde of vierde lid][ref7], [3.2, eerste, vierde of zesde lid][ref8],
      [3.4, eerste lid][ref9], [3.5, eerste, tweede, derde, vierde of vijfde lid][ref10],
      [3.6, eerste of tweede lid][ref11], [3.7, eerste lid][ref12], [3.9, eerste lid][ref13],
      [3.10, eerste lid][ref14], [3.11, eerste of tweede lid][ref15], [3.24, eerste of tweede lid][ref16],
      [3.34, eerste of vierde lid][ref17], [3.35][ref18], [3.37, eerste of tweede lid][ref19], [3.38][ref20],
      [3.39][ref21], [4.8, eerste, tweede of vierde lid][ref22], of [5.3, vierde lid][ref23].


