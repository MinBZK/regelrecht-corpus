  - number: 1.3.4
    text: |-
      Ingeval een project of handeling mede wordt gerealiseerd, onderscheidenlijk verricht in een andere provincie, wordt
      een besluit als bedoeld in het eerste lid genomen door gedeputeerde staten van de provincie waar het project of de
      handeling in hoofdzaak wordt gerealiseerd, onderscheidenlijk verricht, in overeenstemming met gedeputeerde staten
      van die andere provincie.
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel1.3
  - number: 1.3.5
    text: |-
      Bevoegdheden, verantwoordelijkheden en verplichtingen van gedeputeerde staten of provinciale staten als
      bedoeld in de [artikelen 2.7, tweede of derde lid][ref1], [2.8, derde, zesde, zevende of negende lid][ref2],
      [2.9, derde lid][ref3], [3.3, eerste of tweede lid][ref4], [3.4, tweede lid][ref5],
      [3.8, eerste of tweede lid][ref6], [3.9, tweede lid][ref7], [3.10, tweede lid][ref8] in samenhang met artikel 3.8,
      eerste of tweede lid, [3.11, eerste of tweede lid][ref9], [3.12, zevende, achtste of negende lid][ref10],
      [3.14, tweede lid][ref11], [3.15, derde en vierde lid][ref12], [3.16, derde en vierde lid][ref13],
      [3.17, eerste lid][ref14], [3.18, eerste, tweede of derde lid][ref15], al dan niet in samenhang met het vierde
      lid, [3.22, vierde lid][ref16], [3.25, tweede lid][ref17], [3.26, derde lid][ref18], [3.32, tweede lid][ref19],
      [3.33, tweede lid][ref20], [3.34, derde lid][ref21], [4.2, eerste, tweede of derde lid][ref22],
