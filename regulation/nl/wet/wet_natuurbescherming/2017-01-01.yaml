  - number: 3.25.2
    text: |-
      Onze Minister wijst bij ministeriële regeling, onderscheidenlijk provinciale staten wijzen bij
      verordening de middelen aan die mogen worden gebruikt ter uitvoering van het bepaalde krachtens
      [artikel 3.15, tweede, onderscheidenlijk vierde lid][ref1], en [3.16, tweede, onderscheidenlijk vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0037552/2017-01-01#Artikel3.25
    references:
      - id: ref1
