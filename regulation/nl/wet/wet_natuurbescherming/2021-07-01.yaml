  - number: '1.11'
    text: |-
      1 Een ieder neemt voldoende zorg in acht voor Natura 2000-gebieden, bijzondere nationale natuurgebieden en voor in
      het wild levende dieren en planten en hun directe leefomgeving.

      2 De zorg, bedoeld in het eerste lid, houdt in elk geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten nadelige gevolgen kunnen worden veroorzaakt voor een Natura 2000-gebied, een
      bijzonder nationaal natuurgebied of voor in het wild levende dieren en planten:

      a. dergelijke handelingen achterwege laat, dan wel,

      b. indien dat achterwege laten redelijkerwijs niet kan worden gevergd, de noodzakelijke maatregelen treft om die
      gevolgen te voorkomen, of

      c. voor zover die gevolgen niet kunnen worden voorkomen, deze zoveel mogelijk beperkt of ongedaan maakt.

      3 Het eerste lid is niet van toepassing op handelen of nalaten in overeenstemming met het bij of krachtens deze wet
      of de [Visserijwet 1963][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '1.12'
    text: |-
      1 Gedeputeerde staten van de provincies dragen, ieder in hun provincie, tezamen zorg voor het nemen van de nodige
      maatregelen voor:

      a. de bescherming, de instandhouding of het herstel van biotopen en leefgebieden in voldoende gevarieerdheid
      voor alle in Nederland natuurlijk in het wild levende vogelsoorten en in het bijzonder de vogelsoorten, genoemd
      in bijlage I bij de Vogelrichtlijn, en de niet in die bijlage genoemde geregeld in Nederland voorkomende
      trekvogelsoorten;

      b. het behoud of het herstel van een gunstige staat van instandhouding van de van nature in Nederland in het wild
      voorkomende soorten dieren en planten, genoemd in de bijlagen II, IV en V bij de Habitatrichtlijn, en van de in
      Nederland voorkomende typen natuurlijke habitats, genoemd in bijlage I bij de Habitatrichtlijn en habitats van
      soorten, genoemd in de bijlagen II, IV en V bij de Habitatrichtlijn, en

      c. het behoud of het herstel van een gunstige staat van instandhouding van de met uitroeiing bedreigde of
      speciaal gevaar lopende van nature in Nederland in het wild voorkomende dier- en plantensoorten, bedoeld in
      [artikel 1.5, vierde lid][ref1].

      2 Met het oog op het eerste lid dragen gedeputeerde staten in hun provincie in elk geval zorg voor de
      totstandkoming en instandhouding van een samenhangend landelijk ecologisch netwerk, genaamd «natuurnetwerk
      Nederland». Zij wijzen daartoe in hun provincie gebieden aan die tot dit netwerk behoren.

      3 Gedeputeerde staten kunnen gebieden gelegen buiten het natuurnetwerk Nederland aanwijzen die van provinciaal
      belang zijn vanwege hun natuurwaarden of landschappelijke waarden, met inachtneming van hun cultuurhistorische
      kenmerken. Deze gebieden worden aangeduid als «bijzondere provinciale natuurgebieden», onderscheidenlijk
      «bijzondere provinciale landschappen».

      4 Door Onze Minister en gedeputeerde staten gezamenlijk wordt op adequate wijze de verantwoording inzake de
      geleverde inspanning voor het behalen van de doelstellingen uit de Vogel- en Habitatrichtlijn gemonitord. Onze
      Minister informeert de beide Kamers der Staten-Generaal over de voortgang van de totstandkoming en instandhouding
      van het natuurnetwerk Nederland op basis van de ter zake doende gegevens die door gedeputeerde staten zijn
      aangeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.12
