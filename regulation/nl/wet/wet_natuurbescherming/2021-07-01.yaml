        artikel: '1'
  - number: '3.35'
    text: |-
      Het is het verboden vanuit een Nederlands schip walvissen te vangen of te doden, dan wel aan boord van een
      Nederlands schip walvissen te verwerken.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.35
  - number: '3.36'
    text: |-
      EU-verordeningen en EU-richtlijnen als bedoeld in deze paragraaf zijn:

      a. [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december 1996 inzake de
      bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer
      (PbEG L 61);

      b. [verordening (EG) nr. 1007/2009](32009R1007) van het Europees Parlement en de Raad van de Europese Unie van
      16 september 2009 betreffende de handel in zeehondenproducten (PbEU L 286);

      c. verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van de Europese Unie van 22 oktober 2014
      betreffende de preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten (PbEU
      L 317);

      d. verordeningen die berusten op de verordening, bedoeld in onderdeel a, b of c;

      e. bij algemene maatregel van bestuur aangewezen andere verordeningen en richtlijnen die geheel of gedeeltelijk
      berusten op de artikelen 114, 192, 207 of 352 van het Verdrag betreffende de werking van de Europese Unie, of op
      een andere bindende EU-rechtshandeling die op een of meer van die artikelen berust, en die betrekking hebben op:

      1°. het verhandelen, bezit of verwerken van aan de natuur onttrokken dieren, planten, of eieren van dieren, of

      2°. het voorkomen, tot een minimum beperken en het verzachten van de nadelige gevolgen van opzettelijke en
      onopzettelijke introductie en verspreiding van invasieve uitheemse soorten op de biodiversiteit binnen de Europese
      Unie.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.36
  - number: '3.37'
    text: |-
      1 Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van EU-
      verordeningen.

      2 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van onderdelen van EU-verordeningen en EU-
      richtlijnen die geen beoordelingsruimte laten of die betrekking hebben op de wijze waarop aanvragen en documenten
      worden ingediend.

      3 Onze Minister is de bevoegde instantie belast met de uitvoering van EU-verordeningen en EU-richtlijnen, indien
      deze verplichten tot het aanwijzen van zodanige bevoegde instantie, tenzij Onze Minister een andere bevoegde
      instantie heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.37
  - number: '3.38'
    text: |-
      1 Onverminderd [artikel 3.37][ref1], kunnen bij of krachtens algemene maatregel van bestuur ter bescherming van
      diersoorten of plantensoorten als bedoeld in de [artikelen 3.1][ref2], [3.5][ref3], [3.10, eerste lid][ref4],
      of ter uitvoering van EU-verordeningen of EU-richtlijnen, regels worden gesteld over het verhandelen, bezit of
      verwerken van aan de natuur onttrokken dieren of planten, gefokte dieren, gekweekte planten, producten van dieren
      of planten, of eieren van dieren, met inbegrip van dieren en planten en schimmels of micro-organismen van uitheemse
      soorten als bedoeld in de verordening, genoemd in [artikel 3.36, onderdeel c][ref5]. Deze regels kunnen onder
      meer voorzien in:

      a. een verbod op het verhandelen, in bezit hebben, verwerken, kweken, telen of laten voortplanten, gebruiken,
      uitwisselen of uitzetten of zonder vergunning verhandelen, in bezit hebben, verwerken, kweken, telen of laten
      voortplanten, gebruiken, uitwisselen of uitzetten van dieren, planten, eieren van dieren of schimmels of micro-
      organismen van uitheemse soorten;

      b. een verplichting tot het voeren van een administratie of het verstrekken van gegevens met betrekking tot dieren,
      planten, eieren van dieren of schimmels of micro-organismen van uitheemse soorten;

      c. een verplichting tot het merken van dieren, planten, eieren van dieren of schimmels of micro-organismen van
      uitheemse soorten;

      d. de aanwijzing van rechtspersoonlijkheid bezittende organisaties die belast zijn met de taak om merken,
      merktekens en ringen uit te reiken overeenkomstig daarbij gestelde regels;

      e. een verbod om op niet aangewezen plaatsen dieren, planten, eieren van dieren of schimmels of micro-organismen
      van uitheemse soorten het grondgebied van Nederland binnen te brengen of uit te voeren, en

      f. voorschriften met betrekking tot de opvang van levende dieren, of de bewaring van planten.

      2 Bij of krachtens algemene maatregel van bestuur kan, na overleg met gedeputeerde staten, worden bepaald dat
      gedeputeerde staten ter uitvoering van de verordening, genoemd in [artikel 3.36, onderdeel c][ref6], zijn
      belast met de uitvoering van uitroeiingsmaatregelen, beheersmaatregelen, herstelmaatregelen als bedoeld in die
      verordening. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de verstrekking door
      gedeputeerde staten aan Onze Minister van gegevens die betrekking hebben op invasieve uitheemse soorten die in hun
      provincie voorkomen.


