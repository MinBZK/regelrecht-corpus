  - number: '3.31'
    text: |-
      1 De verboden, bedoeld in de [artikelen 3.1][ref1], [3.2, zesde lid][ref2], [3.5][ref3], [3.6 tweede lid][ref4],
      of [3.10][ref5], en de krachtens [artikel 3.11, eerste lid][ref6], geldende verplichting tot melding, zijn niet
      van toepassing op handelingen die zijn beschreven in en aantoonbaar worden uitgevoerd overeenkomstig een door Onze
      Minister goedgekeurde gedragscode en die plaatsvinden in het kader van:

      a. een bestendig beheer of onderhoud aan vaarwegen, watergangen, waterkeringen, waterstaatswerken, oevers,
      vliegvelden, wegen, spoorwegen of bermen, of in het kader van natuurbeheer;

      b. een bestendig beheer of onderhoud in de landbouw of de bosbouw;

      c. een bestendig gebruik, of

      d. ruimtelijke ontwikkeling of inrichting.

      2 Een gedragscode als bedoeld in het eerste lid wordt uitsluitend goedgekeurd, indien is voldaan aan elk van de
      volgende voorwaarden:

      a. in de gedragscode worden handelingen beschreven die nodig zijn voor:

      1°. ingeval het handelingen betreft die invloed kunnen hebben op vogels, één van de in
      [artikel 3.3, vierde lid][ref7], genoemde redenen;

      2°. ingeval het handelingen betreft die invloed kunnen hebben op dieren als bedoeld in
      [artikel 3.5, eerste lid][ref8], één van de in [artikel 3.8, vijfde lid][ref9], genoemde redenen;

      3°. ingeval het handelingen betreft die invloed kunnen hebben op dieren als bedoeld in
      [artikel 3.10, eerste lid, onderdeel a][ref10], of van planten als bedoeld in artikel 3.10, eerste lid,
      onderdeel c, één van de in [artikel 3.8, vijfde lid][ref11], of in artikel 3.10, tweede lid, onder a, e, f of g,
      genoemde redenen;

      b. in de gedragscode een wijze van uitvoering van handelingen is beschreven, waarmee naar het oordeel van
      Onze Minister afdoende is gewaarborgd dat ten aanzien van de soorten, bedoeld in [artikel 3.1][ref12],
      [3.5, eerste of vijfde lid][ref13], [3.10, eerste lid][ref14], geen benutting of economisch gewin plaatsvindt;

      c. in de gedragscode een wijze van uitvoering van handelingen is beschreven, waarmee naar het oordeel van
      Onze Minister afdoende is gewaarborgd dat ten aanzien van de soorten, bedoeld in [artikel 3.1][ref15],
      [3.5, eerste of vijfde lid][ref16], [3.10, eerste lid][ref17], zorgvuldig wordt gehandeld.

      3 Van zorgvuldig handelen als bedoeld in het tweede lid, onderdeel c, is in elk geval sprake, indien is voldaan aan
      de volgende voorwaarden:

      a. er worden slechts handelingen verricht waarvan geen wezenlijke invloed uitgaat op de soorten, bedoeld in het
      tweede lid, en

      b. ingeval handelingen worden verricht die invloed hebben op dieren wordt voorafgaand en tijdens de handelingen in
      redelijkheid alles verricht of gelaten om te voorkomen of zoveel mogelijk te beperken dat:

      1°. dieren als bedoeld in [artikel 3.1][ref18], [3.5, eerste lid][ref19], of [3.10, eerste lid][ref20], worden
      gedood;

      2°. nesten van vogels worden vernield, beschadigd of weggenomen, rustplaatsen van vogels worden vernield of
      beschadigd, dan wel voortplantingsplaatsen of rustplaatsen van de in [artikel 3.5, eerste lid][ref21], of
      [artikel 3.10, eerste lid][ref22], bedoelde dieren worden beschadigd of vernield, en

      3°. eieren van dieren als bedoeld in [artikel 3.1][ref23], [3.5, eerste lid][ref24], of [3.10, eerste lid][ref25],
      worden vernield, of

      c. ingeval handelingen worden verricht die invloed hebben op planten van soorten als bedoeld in
      [artikel 3.5, vijfde lid][ref26], of [3.10, eerste lid][ref27], wordt voorafgaand aan en tijdens de handelingen
      in redelijkheid alles verricht of gelaten om te voorkomen dat deze planten worden geplukt, afgesneden, ontworteld
      of vernield.

      4 Alvorens een gedragscode als bedoeld in het eerste lid, of een wijziging daarvan, goed te keuren of in te
      trekken, overlegt Onze Minister met gedeputeerde staten over zijn voornemen daartoe.


