  - number: '3.12'
    text: |-
      1 Er zijn faunabeheereenheden die voor hun werkgebied een faunabeheerplan vaststellen. Het duurzaam beheer van
      populaties van in het wild levende dieren, de bestrijding van schadeveroorzakende dieren door grondgebruikers en de
      uitoefening van de jacht geschieden overeenkomstig het faunabeheerplan.

      2 Een faunabeheereenheid heeft de rechtsvorm van een vereniging met volledige rechtsbevoegdheid of een
      stichting. In het bestuur van een faunabeheereenheid zijn in ieder geval de jachthouders uit het werkgebied
      van de faunabeheereenheid en maatschappelijke organisaties die het doel behartigen van een duurzaam beheer van
      populaties van in het wild levende dieren in de regio waartoe het werkgebied van de faunabeheereenheid behoort,
      vertegenwoordigd. Op uitnodiging van het bestuur van de faunabeheereenheid kunnen vertegenwoordigers van andere
      dan de in de tweede volzin bedoelde maatschappelijke organisaties en wetenschappers op het gebied van faunabeheer
      deelnemen aan de vergaderingen van het bestuur en het bestuur adviseren.

      3 Faunabeheereenheden stellen een of meer faunabeheerplannen vast voor hun werkgebied. Ten aanzien van door Onze
      Minister vanwege de omvang van hun leefgebieden aangewezen diersoorten stellen de faunabeheereenheden, in wier
      werkgebied het leefgebied is gelegen, gezamenlijk een faunabeheerplan vast.

      4 Onderdeel van het faunabeheerplan zijn passende en doeltreffende maatregelen ter voorkoming en bestrijding van
      schade aangericht door in het wild levende dieren.

      5 Ten behoeve van een planmatige en doelmatige aanpak van het faunabeheer wordt het faunabeheerplan onderbouwd
      door trendtellingen van de populaties van in het wild levende dieren in het gebied waarop het faunabeheerplan van
      toepassing is.

      6 Alvorens een faunabeheerplan vast te stellen, hoort de faunabeheereenheid de binnen haar werkgebied werkzame
      wildbeheereenheden over de inhoud van het plan.

      7 Het faunabeheerplan behoeft de goedkeuring van gedeputeerde staten van de provincie waarin de faunabeheereenheid
      werkzaam is. Ingeval een gezamenlijk faunabeheerplan is vastgesteld door faunabeheereenheden in verschillende
      provincies, geschiedt de goedkeuring door gedeputeerde staten van de provincie waarin het leefgebied van de soort
      grotendeels is gelegen, in overeenstemming met gedeputeerde staten van de andere provincies waarin het leefgebied
      mede is gelegen. Een goedgekeurd faunabeheerplan wordt openbaar gemaakt door de betreffende faunabeheereenheid.

      8 De faunabeheereenheid brengt jaarlijks verslag uit van de uitvoering van het faunabeheerplan aan gedeputeerde
      staten van de provincie waarin de faunabeheereenheid werkzaam is.

      9 Provinciale staten stellen bij verordening regels waaraan in hun provincie werkzame faunabeheereenheden en de
      door de faunabeheereenheid vastgestelde faunabeheerplannen voldoen. Deze regels kunnen in elk geval betrekking
      hebben op:

      a. de omvang en begrenzing van het werkgebied van de faunabeheereenheid;

      b. de aard, omvang en noodzaak van de op grond van het faunabeheerplan te verrichten handelingen waarvoor een
      ontheffing als bedoeld in [artikel 3.17][ref1] wordt verleend of waartoe opdracht wordt verleend op grond van
      [artikel 3.18][ref2];

      c. de wijze waarop en de perioden waarin de handelingen, bedoeld in onderdeel b worden verricht, en

      d. de vertegenwoordiging van maatschappelijke organisaties als bedoeld in het tweede lid in het bestuur van de
      faunabeheereenheid.

      10 Het eerste lid is niet van toepassing op het beheer van populaties van exoten of verwilderde dieren en op de
      bestrijding van schadeveroorzakende exoten of verwilderde dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.17
