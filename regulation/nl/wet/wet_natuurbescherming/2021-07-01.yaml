  - number: 5.5a
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat besluiten waarbij projecten als bedoeld in
      [artikel 2.7, tweede lid][ref1], worden toegestaan, kunnen worden genomen of uitsluitend kunnen worden genomen
      met gebruikmaking van door Onze Minister of een door Onze Minister aangewezen ander bestuursorgaan geregistreerde
      stikstofdepositieruimte.

      2 Stikstofdepositieruimte als bedoeld in het eerste lid, wordt alleen geregistreerd als aanvullende maatregelen
      zijn getroffen ten opzichte van de in het beheerplan voor het desbetreffende Natura 2000-gebied opgenomen
      maatregelen, die de belasting van de natuurwaarden door stikstof verminderen, onderscheidenlijk die de staat van
      instandhouding verbeteren.

      3 De stikstofdepositieruimte kan door het bestuursorgaan dat een besluit als bedoeld in het eerste lid neemt,
      worden toegedeeld in:

      a. een vergunning als bedoeld in [artikel 2.7, tweede lid][ref2], of

      b. een ander bij ministeriële regeling aangewezen besluit.

      4 Stikstofdepositieruimte wordt alleen toegedeeld als zij voor elke locatie van de voor stikstof gevoelige habitats
      in het Natura 2000-gebied waarop door het project stikstofdepositie zal worden veroorzaakt gelijk is aan of groter
      is dan de door het project te veroorzaken toename van de stikstofdepositie.

      5 Bij de regeling, bedoeld in het eerste lid, kunnen nadere regels worden gesteld over onder meer:

      a. de aanwijzing van projecten of categorieën van projecten waarvoor stikstofdepositieruimte wordt gereserveerd
      voor de toedeling daarvan in de besluiten, bedoeld in het derde lid, waarbij een voorkeursvolgorde voor de
      toedeling kan worden vastgesteld;

      b. het bepalen van de omvang van de totale stikstofdepositieruimte voor aan te wijzen specifieke categorieën van
      projecten;

      c. de voorwaarden waaronder stikstofdepositieruimte voor projecten of categorieën van projecten kan worden
      gereserveerd;

      d. de exclusieve toedeling van de door specifieke aanvullende maatregelen als bedoeld in het tweede lid, ontstane
      stikstofdepositieruimte aan bij ministeriële regeling aan te wijzen projecten of categorieën van projecten;

      e. de toe te passen meet- of rekenvoorschriften;

      f. de registratie van stikstofdepositieruimte in samenhang met de daarvoor getroffen aanvullende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
