  - number: '3.33'
    text: |-
      1 Het is verboden bij de uitoefening van een ontheffing of vrijstelling
      als bedoeld in [artikel 3.10, tweede lid][ref1], in samenhang met
      [artikel 3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref2], en met
      [artikel 3.15, tweede en vierde lid][ref3], en bij de uitvoering van een opdracht als bedoeld in
      [artikel 3.18, eerste lid][ref4], wilde zwijnen, reeën, damherten of edelherten te vangen of te doden door middel
      van drijven.

      2 Provinciale staten kunnen bij verordening bepalen dat in afwijking van het eerste lid, het doden van wilde
      zwijnen is toegestaan door middel van een methode, waarbij één persoon wilde zwijnen opzettelijk verontrust met
      het oogmerk deze dieren binnen het schootsveld van één geweerdrager te drijven, opdat deze de dieren kan doden, en
      waarbij geen hond wordt ingezet.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de voorschriften
      die aan vrijstellingen als bedoeld in de [artikelen 3.15, tweede of vierde lid][ref5], of
      [3.16, tweede of vierde lid][ref6], ontheffingen als bedoeld in [artikel 3.17, eerste lid][ref7], of opdrachten
      als bedoeld in artikel 3.18, eerste lid, worden verbonden, of de beperkingen waaronder die vrijstellingen
      of ontheffingen worden verleend, onderscheidenlijk die opdrachten worden gegeven, ingeval die nodig zijn ter
      uitvoering van internationale verplichtingen of bindende besluiten van de Europese Unie of andere volkenrechtelijke
      organisaties.


