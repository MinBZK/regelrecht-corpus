  - number: '1.13'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat een programma wordt vastgesteld dat tot
      doel heeft, mede met het oog op een evenwichtige, duurzame economische ontwikkeling:

      a. de belasting van natuurwaarden van Natura 2000-gebieden of bijzondere nationale natuurgebieden door bij of
      krachtens deze maatregel aangewezen factoren te verminderen en de instandhoudingsdoelstellingen van die gebieden te
      realiseren, of

      b. de staat van instandhouding van de van nature in Nederland in het wild voorkomende soorten dieren of planten of
      de in Nederland voorkomende typen natuurlijke habitats of habitats van soorten te verbeteren.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid bevat in elk geval:

      a. de aanwijzing van één of meer bestuursorganen die het programma vaststellen;

      b. regels over de betrokkenheid van andere bestuursorganen die het programma mede aangaat;

      c. het tijdvak waarvoor het programma geldt;

      d. regels over de wijze en de momenten waarop de resultaten van de maatregelen tussentijds worden beoordeeld;

      e. voorwaarden waaronder het programma zonodig tussentijds kan worden gewijzigd;

      f. een verplichting tot opname in het programma van een beschrijving van:

      1°. de mate van belasting van de natuurwaarden door de aangewezen factor, onderscheidenlijk de staat van
      instandhouding aan het begin van het tijdvak van het programma;

      2°. de verwachte autonome ontwikkelingen ten aanzien van de belasting van de natuurwaarden door de aangewezen
      factor, onderscheidenlijk de staat van instandhouding;

      3°. de maatregelen die de belasting van de natuurwaarden door de aangewezen factor verminderen, onderscheidenlijk
      die de staat van instandhouding verbeteren;

      4°. een sociaal-economische evaluatie en een weging van de haalbaarheid en betaalbaarheid van maatregelen als
      bedoeld in onderdeel 3°;

      5°. de verwachte resultaten van maatregelen als bedoeld in onderdeel 3°;

      6°. de doelstelling van het programma, al dan niet met tussendoelstellingen, of van indicatoren waaruit kan worden
      afgeleid in hoeverre een doelstelling is behaald;

      7°. de resultaten van de ecologische beoordeling van het programma.

      3 In de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald dat in het programma
      uitgangspunten worden opgenomen voor de bepaling van ontwikkelingsruimte, voor de toedeling daarvan aan projecten
      en de reservering daarvoor, en dat de ontwikkelingsruimte die beschikbaar is op het tijdstip van vaststelling van
      het programma, daarin wordt vermeld. Ingeval toepassing wordt gegeven aan de eerste volzin, worden bij of krachtens
      algemene maatregel van bestuur in elk geval regels gesteld over:

        - de toedeling van ontwikkelingsruimte aan en de reservering van die ruimte voor projecten, de registratie daarvan,
        - de verdeling van de beschikbare ontwikkelingsruimte tussen de eerste en de tweede helft van het tijdvak van het
      programma,
        - het inzichtelijk maken van de beschikbaarheid van ontwikkelingsruimte gedurende het tijdvak van het programma en
      het daarop volgende programma;
        - de bevoegdheid van bestuursorganen om een onherroepelijk besluit waarin ontwikkelingsruimte is toegedeeld, in te
      trekken of te wijzigen, indien het project waarop dat besluit betrekking heeft, niet is gerealiseerd;
        - de voorwaarden waaronder de bij of krachtens deze maatregel gestelde regels over de toedeling van
      ontwikkelingsruimte niet van toepassing zijn op bij of krachtens die maatregel aangewezen besluiten waarbij wordt
      getoetst of is voldaan aan [artikel 2.8][ref1], die bij het desbetreffende bestuursorgaan in voorbereiding zijn op
      het tijdstip van inwerkingtreding van het desbetreffende programma.

      4 Op de voorbereiding van een besluit tot vaststelling van een programma als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.

      5 De daartoe bevoegde bestuursorganen dragen zorg voor een tijdige uitvoering van de in een programma als bedoeld
      in het eerste lid opgenomen maatregelen, voor zover zij met het opnemen van die maatregelen hebben ingestemd.

      6 Ingeval uit een tussentijdse beoordeling als bedoeld in het tweede lid, onderdeel d, blijkt dat de doelstellingen
      van het programma op basis van de daarin opgenomen maatregelen niet behaald kunnen worden, draagt het
      bestuursorgaan dat het programma heeft vastgesteld zorg voor wijziging van het programma met het oog op opname van
      aanvullende maatregelen om de doelstellingen te behalen.

      7 Provinciale staten kunnen bij provinciale verordening bepalen dat een provinciaal programma wordt vastgesteld.
      Het eerste, tweede, derde, vierde, vijfde en zesde lid zijn van overeenkomstige toepassing. Waar in het eerste,
      tweede en derde lid sprake is van een algemene maatregel van bestuur of van een ministeriële regeling wordt in
      plaats daarvan gelezen: provinciale verordening.

      8 De inhoud van een programma als bedoeld in het eerste of zevende lid kan worden beschreven in een ander programma
      dat mede van belang is voor het bereiken van een doel als bedoeld in het eerste lid, onderdeel a of b. Ingeval dat
      andere programma wordt vastgesteld door een ander bevoegd gezag, vindt toepassing van de eerste volzin niet plaats
      dan na instemming van het bevoegde bestuursorgaan, bedoeld in het tweede lid, onderdeel a, onderscheidenlijk de
      provinciale staten, bedoeld in het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
