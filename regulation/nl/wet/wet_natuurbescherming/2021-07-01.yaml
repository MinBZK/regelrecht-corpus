  - number: '4.7'
    text: |-
      EU-verordeningen en EU-richtlijnen als bedoeld in [artikel 4.8][ref1] zijn:

      a. [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de Europese Unie van 20 december 2005 inzake de
      opzet van een FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU L 2005, 347);

      b. verordening (EU) nr. 995/2010 van het Europees Parlement en de Raad van de Europese Unie van 20 oktober 2010
      tot vaststelling van de verplichtingen van marktdeelnemers die hout en houtproducten op de markt brengen (PbEU L
      2010, 295);

      c. verordeningen die berusten op de verordening, bedoeld in onderdeel a of b, en

      d. bij algemene maatregel van bestuur aangewezen andere verordeningen en richtlijnen die geheel of gedeeltelijk
      berusten op de artikelen 114, 192, 207 of 352 van het Verdrag betreffende de werking van de Europese Unie, of op
      een andere bindende EU-rechtshandeling die op een of meer van die artikelen berust, en die betrekking hebben op het
      verhandelen, bezit of verwerken van aan de natuur onttrokken hout of houtproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel4.7
    references:
