  - number: '9.8'
    text: |-
      1 [Artikel 3.28, derde lid, onderdeel d][ref1], is van overeenkomstige toepassing in geval
      van een veroordeling wegens overtreding van een bij of krachtens de [Flora- en faunawet][ref2],
      [hoofdstuk III van de Gezondheids- en welzijnswet voor dieren][ref3] of de [Wet op de dierenbescherming][ref4]
      gestelde bepaling, of in geval van een uitvaardiging van een strafbeschikking deswege.

      2 [Artikel 5.4, derde lid, onderdeel a][ref5], is van overeenkomstige toepassing in geval van een
      onherroepelijke veroordeling wegens overtreding van een bij of krachtens de [Flora- en faunawet][ref6],
      [hoofdstuk III van de Gezondheids- en welzijnswet voor dieren][ref7] of de [Wet op de dierenbescherming][ref8]
      gestelde bepaling, of in geval van een uitvaardiging van een strafbeschikking deswege.

      3 [Artikel 5.4, zesde lid, onderdelen a en c][ref9], is van overeenkomstige toepassing in geval van misbruik van
      de bevoegdheden, gegeven bij of krachtens de [Flora- en faunawet][ref10], onderscheidenlijk het begaan van bij of
      krachtens de Flora- en faunawet strafbaar gestelde feiten.

      4 Artikel 7.3 is van overeenkomstige toepassing ten aanzien van planten, dieren of producten van planten of dieren
      als bedoeld in het eerste lid van dat artikel die in strijd met de Flora- en faunawet binnen het grondgebied van
      Nederland zijn gebracht, en ten aanzien van levende dieren als bedoeld in het tweede lid van dat artikel die in
      strijd met de [Flora- en faunawet][ref11] zijn gehouden.


