      1 Ontheffingen als bedoeld in [artikel 75, derde lid, van de Flora- en faunawet][ref1] gelden als ontheffingen als
      bedoeld in deze wet, onder dezelfde voorschriften, beperkingen en voorwaarden. Onze Minister doet ten aanzien van
      categorieën van deze ontheffingen, onderverdeeld naar de bepalingen bij of krachtens de [Flora- en faunawet][ref2]
      waarop de ontheffingen betrekking hebben, mededeling in de Staatscourant van de bepaling of bepalingen bij of
      krachtens deze wet waarop zij vanaf het moment van inwerkingtreding van de wet berusten.

      2

      3

      4

      5 De verboden, bedoeld in de [artikelen 3.1][ref3], [3.5][ref4], [3.6][ref5] en
      [3.10, eerste lid en tweede lid][ref6] zijn niet van toepassing op handelingen die aantoonbaar
      plaatsvinden overeenkomstig een door Onze Minister goedgekeurde gedragscode als bedoeld in
      [artikel 16b, tweede lid, onderdeel b, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref7]
      voor de periode waarvoor de gedragscode is goedgekeurd, voor zover die handelingen dientengevolge als bedoeld in
      artikel 16b van dat besluit waren vrijgesteld van de [artikelen 8][ref8], [9][ref9], [10][ref10], [11][ref11] en
      [12 van de Flora- en faunawet][ref12].


