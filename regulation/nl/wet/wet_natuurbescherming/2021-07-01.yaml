  - number: '3.24'
    text: |-
      1 Een ieder die een in het wild levend dier doodt of vangt voorkomt dat het dier onnodig lijdt.

      2 Het is verboden zich buiten gebouwen te bevinden met bij algemene maatregel van bestuur aangewezen middelen
      die geschikt zijn voor het doden of vangen van dieren, of met materialen ter onmiddellijke vervaardiging van die
      middelen, indien redelijkerwijs moet worden aangenomen dat die middelen of materialen zullen worden gebruikt voor
      het doden of vangen van dieren.

      3 Bij een aanwijzing krachtens het tweede lid wordt mede rekening gehouden met het voorkomen van onnodig lijden bij
      het te doden of te vangen dier.

      4 Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van het bepaalde bij of krachtens de
      Benelux-overeenkomst regels gesteld over het gebruik van middelen.

      5 Het is een ieder verboden zich in een veld te bevinden met een dier dat hem toebehoort of onder zijn toezicht
      staat en dat in het veld dieren opspoort, doodt, verwondt, vangt of bemachtigt.

      6 Het verbod, bedoeld in het vijfde lid, is niet van toepassing ingeval het opsporen, doden, verwonden, vangen of
      bemachtigen van dieren in het veld ingevolge het bepaalde bij of krachtens deze wet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.24
  - number: '3.25'
    text: |-
      1 Bij het verlenen van een ontheffing of vrijstelling als bedoeld in de
      [artikelen 3.3, eerste onderscheidenlijk tweede lid][ref1], [3.4, tweede lid][ref2],
      [3.8, eerste, onderscheidenlijk tweede lid][ref3], [3.9, tweede lid][ref4], of [3.10, tweede lid][ref5], in
      samenhang met artikel 3.8, eerste of tweede lid, en met artikel 3.9, tweede lid, en bij het geven van een opdracht
      als bedoeld in [artikel 3.18, eerste lid][ref6], worden de middelen aangewezen die voor het vangen en doden van de
      aldaar bedoelde vogels en dieren mogen worden gebruikt.

      2 Onze Minister wijst bij ministeriële regeling, onderscheidenlijk provinciale staten wijzen bij
      verordening de middelen aan die mogen worden gebruikt ter uitvoering van het bepaalde krachtens
      [artikel 3.15, tweede, onderscheidenlijk vierde lid][ref7], en [3.16, tweede, onderscheidenlijk vierde lid][ref8].

      3 Indien een vrijstelling wordt verleend als bedoeld in [artikel 3.15, tweede en vierde lid][ref9], met
      het oog op het voorkomen van schade als bedoeld in artikel 3.15, vijfde en zesde lid, of een vrijstelling
      wordt verleend als bedoeld in [artikel 3.16, tweede en vierde lid][ref10], met het oog op het voorkomen
      van overlast als bedoeld in artikel 3.16, vijfde lid, dan wel ontheffing wordt verleend als bedoeld in
      [artikel 3.17, eerste lid, onderdeel a, onder 3°, onderdeel b, onder 2°, en onderdeel c, onder 2°][ref11],
      worden voor het bestrijden van vogels en dieren slechts middelen aangewezen die nadelige gevolgen voor het welzijn
      van vogels en dieren voorkomen of, indien dat niet mogelijk is, zoveel mogelijk beperken, waarbij het doden van
      dieren zoveel mogelijk vermeden wordt.

      4 Gedeputeerde staten kunnen ontheffing en provinciale staten kunnen vrijstelling verlenen van:

      a. het verbod, bedoeld in [artikel 3.24, tweede lid][ref12]. Op deze vrijstelling of ontheffing is artikel 3.24,
      derde, lid van overeenkomstige toepassing;

      b. regels als bedoeld in [artikel 3.24, vierde lid][ref13], voor zover deze vrijstelling of ontheffing in
      overeenstemming is met de bij of krachtens de Benelux-overeenkomst gestelde regels.


