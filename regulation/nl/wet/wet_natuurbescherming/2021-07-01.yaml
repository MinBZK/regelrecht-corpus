  - number: '9.5'
    text: |-
      1 Goedkeuringen van faunabeheerplannen als bedoeld in [artikel 30, eerste lid, van de Flora- en faunawet][ref1]
      gelden voor het tijdvak waarvoor de desbetreffende faunabeheerplannen van kracht zijn als goedkeuringen als bedoeld
      in [artikel 3.12, zevende lid][ref2].

      2 Jachtakten als bedoeld in [artikel 38, eerste lid, onderdeel a, van de Flora- en faunawet][ref3] gelden als
      jachtakten als bedoeld in [artikel 3.26, eerste lid, onderdeel a][ref4].

      3 Valkeniersakten als bedoeld in [artikel 38, eerste lid, onderdeel b, van de Flora- en faunawet][ref5] gelden
      als valkeniersakten als bedoeld in [artikel 3.30, eerste lid][ref6].

      4 Erkenningen van jachtexamens als bedoeld in
      [artikel 39, eerste lid, onderdeel c, of artikel 40, tweede lid, van de Flora- en faunawet][ref7] gelden als
      erkenningen als bedoeld in [artikel 3.28, tweede lid, onderdeel a, eerste onderscheidenlijk tweede zinsdeel][ref8].

      5 Ontheffingen als bedoeld in [artikel 60, eerste lid, van de Flora- en faunawet][ref9] gelden als ontheffingen
      als bedoeld in [artikel 3.3, eerste lid][ref10].

      6 Besluiten als bedoeld in [artikel 67, eerste lid, van de Flora- en faunawet][ref11] gelden als besluiten tot het
      geven van opdracht als bedoeld in [artikel 3.18, eerste lid][ref12].

      7 Ontheffingen als bedoeld in [artikel 68, eerste lid, van de Flora- en faunawet][ref13] gelden als ontheffingen
      als bedoeld in [3.17, eerste lid][ref14].

      8 Ontheffingen als bedoeld in [artikel 74a, tweede lid, van de Flora- en faunawet][ref15] gelden als ontheffingen
      als bedoeld in [artikel 3.32, tweede lid][ref16].

      9 Koninklijke besluiten tot benoeming of herbenoeming van leden van de Commissie bedreigde uitheemse dier- en
      plantensoorten, bedoeld in [artikel 82, derde lid, van de Flora- en faunawet][ref17], gelden als benoemingen,
      onderscheidenlijk herbenoemingen als bedoeld in [artikel 3.41, derde lid][ref18].


