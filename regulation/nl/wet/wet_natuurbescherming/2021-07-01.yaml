        paragraaf: '4.2'
  - number: '4.8'
    text: |-
      1 Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van EU-
      verordeningen.

      2 Bij ministeriële regeling worden regels gesteld ter uitvoering van onderdelen van EU-verordeningen en EU-
      richtlijnen die geen beoordelingsruimte laten, of die betrekking hebben op de wijze waarop aanvragen en documenten
      worden ingediend.

      3 Onze Minister is de bevoegde instantie belast met de uitvoering van EU-verordeningen en EU-richtlijnen, indien
      deze verplichten tot het aanwijzen van een bevoegde instantie, tenzij Onze Minister een andere bevoegde instantie
      heeft aangewezen.

      4 Onverminderd het eerste, tweede en derde lid, kunnen bij of krachtens algemene maatregel van bestuur ter
      uitvoering van EU-verordeningen en EU-richtlijnen regels worden gesteld met betrekking tot het verhandelen, in
      bezit hebben of verwerken van hout of houtproducten. [Artikel 3.38, tweede volzin][ref1], is van overeenkomstige
      toepassing ten aanzien van hout en houtproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.38
