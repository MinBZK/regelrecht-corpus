  - number: '8.6'
    text: |-
      1 Ingeval op grond van [artikel 1.13, eerste lid, aanhef in samenhang met onderdeel a][ref1], een programma is
      vastgesteld dat betrekking heeft op Natura 2000-gebieden, kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld die van toepassing zijn indien:

      a. een project of als bedoeld in [artikel 2.7, tweede lid][ref2], gevolgen kan hebben voor een Natura 2000-gebied
      dat niet in het programma is opgenomen, of

      b. ten aanzien van een project of als bedoeld in [artikel 2.7, tweede lid][ref3], bij die algemene maatregel
      van bestuur aangewezen bestuursorganen het besluit hebben genomen dat [artikel 5.5, derde lid][ref4], niet van
      toepassing is.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:

      a. de voorwaarden waaronder het verbod, bedoeld in [artikel 2.7, tweede lid][ref5], niet van toepassing is;

      b. de voorwaarden waaronder vergunningen als bedoeld in [artikel 2.7, tweede lid][ref6], worden verleend en andere
      besluiten worden genomen waarbij moet zijn voldaan aan [artikel 2.8][ref7];

      c. de voorschriften die worden gegeven bij een krachtens [artikel 2.4, eerste lid][ref8], op te leggen
      verplichting;

      d. de voorwaarden waaronder een besluit als bedoeld in het eerste lid, onderdeel b, wordt genomen;

      e. de maatregelen, te treffen door de bij het programma betrokken bestuursorganen of door degenen die
      projecten realiseren als bedoeld in het eerste lid, gericht op het verkrijgen van overzicht van de
      bijdragen van deze projecten aan de belasting van de natuurwaarden door de desbetreffende krachtens
      [artikel 1.13, eerste lid, onderdeel a][ref9], aangewezen factor.

      3 De regels, bedoeld in het eerste lid, verzekeren dat op voorhand geen afbreuk wordt gedaan aan de doelstelling
      van het programma, bedoeld in het eerste lid, en dat op grond van objectieve gegevens op voorhand kan worden
      uitgesloten dat projecten als bedoeld in het eerste lid afzonderlijk of in combinatie met andere plannen of
      projecten de natuurlijke kenmerken van een Natura 2000-gebied zullen aantasten.


