    text: |-
      1 Vergunningen als bedoeld in [artikel 19d, eerste lid, van de Natuurbeschermingswet 1998][ref1] gelden als
      vergunningen als bedoeld in [artikel 2.7, tweede lid][ref2].

      2 Voorschriften, verbonden aan vergunningen als bedoeld in
      [artikel 19d, eerste lid, van de Natuurbeschermingswet 1998][ref3], gelden als voorschriften als bedoeld in
      [artikel 5.3, eerste lid][ref4].

      3

      4

      5

      6 Wegaanpassingsbesluiten als bedoeld in de [Spoedwet wegverbreding][ref5] die zijn vastgesteld met toepassing van
      [artikel 9, vierde lid, van die wet][ref6], zoals dat gold onmiddellijk voor het tijdstip van inwerkingtreding
      van deze wet, gelden als besluiten die zijn vastgesteld met toepassing van artikel 9, vijfde lid, van de Spoedwet
      wegverbreding.

      7 Tracébesluiten als bedoeld in de [Tracéwet][ref7] die zijn vastgesteld met toepassing van
      [artikel 13, zevende lid, tweede volzin, van die wet][ref8], zoals dat gold onmiddellijk voor het tijdstip van
      inwerkingtreding van deze wet, gelden als besluiten die zijn vastgesteld met toepassing van artikel 13, achtste
      lid, van de Tracéwet.

      8 [Artikel 2.7, tweede lid][ref9], is niet van toepassing op projecten en andere handelingen
      ten aanzien waarvan, voor 1 februari 2009, op grond van een andere wettelijke grondslag dan
      [artikel 19d, eerste lid, van de Natuurbeschermingswet 1998][ref10] en met inachtneming van artikel 6, tweede,
      derde en vierde lid, van de Habitatrichtlijn, een besluit is genomen waarbij dat project of die handeling
      is toegestaan, dan wel een aanvraag voor het nemen van dat besluit is gedaan en dat besluit na die datum
      onherroepelijk is geworden.

      9 [Artikel 2.7, tweede lid][ref11], is niet van toepassing op projecten en andere handelingen in de exclusieve
      economische zone ten aanzien waarvan voordat [artikel 1a van de Natuurbeschermingswet 1998][ref12] van kracht
      werd:

      a. op grond van een andere wettelijke grondslag dan
      [artikel 19d, eerste lid, van de Natuurbeschermingswet 1998][ref13] en met inachtneming van artikel 6, tweede,
      derde en vierde lid, van de Habitatrichtlijn, een besluit is genomen waarbij dat project of die handeling
      is toegestaan, dan wel een aanvraag voor het nemen van dat besluit is gedaan en dat besluit na die datum
      onherroepelijk is geworden.

      b. een aanvraag tot wijziging van het besluit, bedoeld in onderdeel a, is gedaan en dat wijzigingsbesluit met
      inachtneming van artikel 6, tweede, derde en vierde lid, van de Habitatrichtlijn, is genomen en onherroepelijk
      is geworden, dan wel voor dat tijdstip ambtshalve een besluit tot wijziging van dat besluit met inachtneming van
      voornoemde richtlijnbepaling is genomen.

      10 Een besluit als bedoeld in het achtste of negende lid, kan door het bevoegd gezag dat het besluit heeft genomen,
      worden gewijzigd of ingetrokken in de gevallen, bedoeld in [artikel 5.4, eerste of tweede lid][ref14].


