  - number: '6.1'
    text: |-
      1 Gedeputeerde staten verlenen in voorkomende gevallen tegemoetkomingen in schade, geleden in hun provincie,
      aangericht door natuurlijk in het wild levende:

      a. vogels van vogelsoorten als bedoeld in artikel 1 van Vogelrichtlijn, of

      b. dieren die worden genoemd in bijlage IV, onderdeel a, bij de Habitatrichtlijn, bijlage II bij het Verdrag van
      Bern, bijlage I bij het Verdrag van Bonn of de bijlage, onderdeel a, bij deze wet.

      2 Een tegemoetkoming als bedoeld in het eerste lid wordt slechts verleend voor zover een belanghebbende schade
      lijdt of zal lijden aangericht door dieren als bedoeld in het eerste lid, en die schade redelijkerwijs niet of niet
      geheel te zijnen laste behoort te blijven. Een tegemoetkoming wordt naar billijkheid bepaald.

      3 Ingeval schade als bedoeld in het eerste lid mede wordt geleden in een andere provincie, wordt een besluit
      als bedoeld in het eerste lid genomen door gedeputeerde staten waar de schade in hoofdzaak wordt geleden, in
      overeenstemming met gedeputeerde staten van die andere provincie.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Onze Minister kan een vergoeding van kosten vragen overeenkomstig een door hem vastgesteld tarief voor:

      a. de behandeling van een aanvraag van een vergunning of ontheffing, vereist op grond van deze wet, met inbegrip
      van een aanvraag tot verlenging of wijziging daarvan, voor de verlening waarvan Onze Minister bevoegd is, en de
      handelingen die nodig zijn voor de instandhouding van een vergunning of ontheffing;

      b. de behandeling van een aanvraag van afgifte van een valkeniersakte of van andere documenten die benodigd
      zijn op grond van het bepaalde bij of krachtens [artikel 3.37, eerste of tweede lid][ref1], [3.38][ref2] of
      [4.8, eerste, tweede of vierde lid][ref3];

      c. de behandeling van een aanvraag van afgifte van krachtens deze wet voorgeschreven ringen, merken of merktekens;

      d. de uitvoering van een controle of verificatie als bedoeld in een EU-verordening of EU-richtlijn als bedoeld in
      [artikel 3.36][ref4] of [4.7][ref5];

      e. de goedkeuring van een gedragscode als bedoeld in [artikel 3.31, eerste lid][ref6], of
      [artikel 4.4, eerste lid, onderdeel d][ref7].

      2 De korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref8] kan een vergoeding van kosten vragen
      overeenkomstig een door Onze Minister vastgesteld tarief voor het verstrekken van een jachtakte.

      3 Een organisatie als bedoeld in [artikel 3.38, onderdeel d][ref9], kan een vergoeding van kosten vragen
      overeenkomstig een door Onze Minister vastgesteld tarief voor het verstrekken van ringen, merken of merktekens.

      4 Provinciale staten kunnen een vergoeding van kosten vragen overeenkomstig een door hen vastgesteld tarief voor:

      a. de behandeling van een aanvraag van een vergunning of ontheffing, vereist op grond van deze wet, met inbegrip
      van een aanvraag tot verlenging of wijziging daarvan, voor de verlening waarvan zij bevoegd zijn, en de handelingen
      die nodig zijn voor de instandhouding van een vergunning of ontheffing;

      b. de behandeling van een aanvraag tot het nemen van een besluit over de verlening van een tegemoetkoming in schade
      als bedoeld in [artikel 6.1, eerste lid][ref10].


