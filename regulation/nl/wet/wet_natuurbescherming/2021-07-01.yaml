      1 De door Onze Minister aangewezen ambtenaren verstrekken elkaar ter uitvoering van hun taak uit eigen beweging
      of desgevraagd onderling de bij die aanwijzing genoemde gegevens die noodzakelijk zijn voor de uitvoering van EU-
