    text: |-
      1 Onze Minister wijzigt het programma stikstofreductie en natuurverbetering als uit de beoordeling, bedoeld in
      [artikel 1.12f, derde lid][ref1], blijkt dat met het programma niet kan worden voldaan aan een omgevingswaarde
      als bedoeld in [artikel 1.12a, eerste lid][ref2], of aan een tussentijdse doelstelling als bedoeld in
      [artikel 1.12b, tweede lid][ref3].

      2 Het programma wordt zo gewijzigd dat binnen een passende termijn aan de omgevingswaarde wordt voldaan.

      3 Onverminderd het eerste en tweede lid wordt het programma ten minste iedere zes jaar geactualiseerd.


