  - number: '3.17'
    text: |-
      1 Ten behoeve van de beperking van de omvang van een populatie van vogels als bedoeld in
      [artikel 3.1, eerste lid][ref1], of van dieren van soorten als bedoeld in [artikel 3.5, eerste lid][ref2],
      of [3.10, eerste lid][ref3], verlenen gedeputeerde staten ontheffing als bedoeld
      [artikel 3.3, eerste, vierde en vijfde lid][ref4], [3.4, tweede lid][ref5], [3.8, eerste en vijfde lid][ref6],
      [3.9, tweede lid][ref7], of 3.10, tweede lid, in samenhang met artikel 3.8, tweede lid, indien deze beperking nodig
      is:

      a. in geval van vogels:

      1°. in het belang van de volksgezondheid of de openbare veiligheid;

      2°. in het belang van de veiligheid van het luchtverkeer;

      3°. ter voorkoming van belangrijke schade aan gewassen, vee, bossen, visserij of wateren, of

      4°. ter bescherming van flora en fauna;

      b. in geval van dieren van soorten als bedoeld in [artikel 3.5, eerste lid][ref8]:

      1°. in het belang van de bescherming van de wilde flora en fauna en van de instandhouding van de natuurlijke
      habitats;

      2°. ter voorkoming van ernstige schade aan met name de gewassen, veehouderijen, bossen, visgronden en wateren en
      andere vormen van eigendom, of

      3°. in het belang van de volksgezondheid en de openbare veiligheid of om andere dwingende redenen van groot
      openbaar belang, of

      c. ingeval dieren van soorten als bedoeld in [3.10, eerste lid][ref9], met uitzondering van soorten als bedoeld in
      [artikel 3.5, eerste lid][ref10]:

      1°. om de redenen genoemd in onderdeel b;

      2°. ter voorkoming van schade of overlast, met inbegrip van schade aan sportvelden, industrieterreinen of
      begraafplaatsen,

      3°. ter voorkoming of bestrijding van onnodig lijden van zieke of gebrekkige dieren, en

      4°. in het algemeen belang.

      2 Een ontheffing als bedoeld in het eerste lid wordt verleend aan een faunabeheereenheid, die handelt
      overeenkomstig het daartoe vastgestelde en goedgekeurde faunabeheerplan.

      3 De faunabeheereenheid kan bij schriftelijke en gedagtekende toestemming de haar ingevolge het eerste en tweede
      lid toegestane handelingen door een wildbeheereenheid of anderen doen uitoefenen.

      4 In afwijking van het tweede lid kan een ontheffing ook aan een wildbeheereenheid of aan anderen dan een
      faunabeheereenheid worden verleend, indien de noodzaak ontbreekt voor verrichting van de handelingen door
      tussenkomst van een faunabeheereenheid.

      5 In afwijking van [artikel 3.12, eerste lid][ref11], en het tweede lid kan een ontheffing worden verleend voor
      handelingen die niet op grond van een faunabeheerplan worden verricht, indien de noodzaak ontbreekt voor een
      faunabeheerplan, gelet op de specifieke kenmerken van de desbetreffende diersoort dan wel de aard of omvang van te
      verrichten handelingen.


