  - number: '3.20'
    text: |-
      1 In afwijking van de [artikelen 3.1, eerste en vierde lid][ref1], [3.5, eerste en tweede lid][ref2], en
      [3.10, eerste lid][ref3], is het de jachthouder toegestaan in zijn jachtveld wild te vangen, te doden en te
      verontrusten, en met het oog daarop op te sporen ter uitoefening van de jacht, indien is voldaan aan het bij en
      krachtens deze paragraaf en [paragraaf 3.6][ref4] bepaalde.

      2 Wild als bedoeld in het eerste lid zijn in het wild levende dieren van de volgende soorten:

      a. fazant (Phasianus colchicus);

      b. wilde eend (Anas platyrhynchos);

      c. houtduif (Columba palumbus);

      d. haas (Lepus Europaeus);

      e. konijn (Oryctolagus cuniculus).

      3 De jachthouder doet datgene wat een goed jachthouder betaamt om een redelijke stand van de in zijn jachtveld
      aanwezige wild als bedoeld in het tweede lid te handhaven, dan wel, bij het ontbreken daarvan, te bereiken, en om
      schade door in zijn jachtveld aanwezig wild als bedoeld in het tweede lid te voorkomen.

      4 Het eerste lid is van overeenkomstige toepassing op:

      a. degenen in het gezelschap van de jachthouder, indien de jachthouder een geldende jachtakte of valkeniersakte
      heeft, en

      b. de jachtopzichter of anderen buiten het gezelschap van de jachthouder, indien de jachthouder aan hen daartoe een
      schriftelijke en gedagtekende toestemming heeft gegeven, en is voldaan aan bij of krachtens algemene maatregel van
      bestuur gestelde regels.


