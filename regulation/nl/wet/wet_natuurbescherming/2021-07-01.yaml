  - number: '7.4'
    text: |-
      1 Onverminderd [artikel 7.2][ref1] en [artikel 117 van het Wetboek van Strafvordering][ref2] kan Onze Minister
      bepalen dat dieren, planten of eieren van dieren die in strijd met het bepaalde bij of krachtens deze wet binnen
      het grondgebied van Nederland zijn gebracht, op kosten van de eigenaar, vervoerder, importeur of diens gemachtigde:

      a. worden teruggezonden naar het land van uitvoer of herkomst, of

      b. naar enige andere plaats buiten Nederland worden gebracht die daarvoor naar het oordeel van Onze Minister
      geschikt is en in overeenstemming is met de doeleinden van de op 3 maart 1973 te Washington tot stand gekomen
      Overeenkomst inzake de internationale handel in bedreigde en in het wild levende dier- en plantensoorten
      (Trb. 1975, 22), naar de tekst zoals deze bij dat verdrag is vastgesteld.

      2 Onverminderd [artikel 7.2][ref3] kan Onze Minister besluiten dat levende dieren, behorend tot een in het wild
      levende soort die van nature in Nederland voorkomt, die in strijd met het bepaalde bij of krachtens deze wet worden
      gehouden en waarvan kan worden aangenomen dat zij zich in de natuur kunnen handhaven, op kosten van de eigenaar of
      van degene die deze dieren onder zich heeft, in hun natuurlijke leefomgeving in vrijheid worden gesteld.

      3 Onder de in het eerste en tweede lid bedoelde kosten kunnen mede zijn begrepen de kosten van bewaring in verband
      met het transport naar de plaats van bestemming.

      4 Indien niet tot terugzending of tot invrijheidstelling in de natuurlijke leefomgeving als bedoeld in het
      eerste, onderscheidenlijk tweede lid wordt besloten, kunnen de kosten van verzorging, huisvesting of opslag binnen
      Nederland geheel of gedeeltelijk in rekening worden gebracht bij de eigenaar of de importeur van het dier, de
      plant of het ei, of degene die het dier, de plant of het ei verhandelt, of bij de gemachtigde van de eigenaar, de
      importeur of degene die verhandelt. Bij ministeriële regeling kunnen terzake nadere regels worden gesteld.

      5 Bij gebreke van volledige betaling binnen de door hem gestelde termijn kan Onze Minister hetgeen krachtens het
      eerste, tweede, derde of vierde lid verschuldigd is invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel7.2
