  - number: '3.34'
    text: |-
      1 Het is verboden dieren of eieren van dieren uit te zetten.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor het uitzetten van dieren van soorten die op grond van
      [artikel 1, tweede lid, van de Visserijwet 1963][ref1] zijn aangewezen als «vis», of voor het uitzetten van hun
      eieren.

      3 Gedeputeerde staten kunnen ontheffing en provinciale staten kunnen vrijstelling verlenen van het verbod, bedoeld
      in het eerste lid.

      4 Het is verboden exoten behorende tot bij algemene maatregel van bestuur aangewezen plantensoorten te planten of
      te zaaien.

      5 Onze Minister kan, in zoverre in afwijking van het derde lid, ontheffing of vrijstelling verlenen van de
      verboden, bedoeld in het eerste en vierde lid, ten behoeve van de herintroductie van soorten, of voor het
      uitzetten, planten of zaaien van exoten. Onze Minister verleent een ontheffing of vrijstelling als bedoeld in de
      vorige volzin in overeenstemming met gedeputeerde staten van de provincie waar de herintroductie of uitzetting
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.34
