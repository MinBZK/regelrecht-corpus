  - number: '1.3'
    text: |-
      1 Ingeval gedeputeerde staten ingevolge het bepaalde bij of krachtens deze wet bevoegd zijn tot het nemen van een
      besluit met betrekking tot handelingen, zijn, tenzij anders bepaald, bevoegd gedeputeerde staten van de provincie
      waar de handeling wordt verricht.

      2 Ingeval provinciale staten ingevolge het bepaalde bij of krachtens deze wet bevoegd zijn tot het nemen van een
      besluit met betrekking tot handelingen, zijn, tenzij anders bepaald, bevoegd provinciale staten van de provincie
      waar de handelingen worden verricht.

      3 Ingeval handelingen nadelige gevolgen hebben voor een geheel of gedeeltelijk in een andere
      provincie gelegen Natura 2000-gebied of bijzonder nationaal natuurgebied, dan wel voor vogels
      als bedoeld in [artikel 3.1, eerste lid][ref1], dieren of planten van soorten als bedoeld in
      [artikel 3.5, eerste of vijfde lid][ref2], [3.7][ref3] of [3.10, eerste lid][ref4], die zich bevinden in een
      andere provincie, nemen gedeputeerde staten, onderscheidenlijk provinciale staten geen besluiten als bedoeld in het
      eerste, onderscheidenlijk tweede lid, dan in overeenstemming met gedeputeerde staten, onderscheidenlijk provinciale
      staten van die andere provincie.

      4 Ingeval een handeling mede wordt verricht in een andere provincie, wordt een besluit als bedoeld in het
      eerste lid genomen door gedeputeerde staten van de provincie waar de handeling in hoofdzaak wordt verricht, in
      overeenstemming met gedeputeerde staten van die andere provincie.

      5 Bevoegdheden, verantwoordelijkheden en verplichtingen van gedeputeerde staten of provinciale staten als
      bedoeld in de [artikelen 2.7, tweede of derde lid][ref5], [2.8, derde, zesde, zevende of negende lid][ref6],
      [2.9, derde lid][ref7], [3.3, eerste of tweede lid][ref8], [3.4, tweede lid][ref9],
      [3.8, eerste of tweede lid][ref10], [3.9, tweede lid][ref11], [3.10, tweede lid][ref12]
      in samenhang met artikel 3.8, eerste of tweede lid, [3.11, eerste of tweede lid][ref13],
      [3.12, zevende, achtste of negende lid][ref14], [3.14, tweede lid][ref15], [3.15, derde en vierde lid][ref16],
      [3.16, derde en vierde lid][ref17], [3.17, eerste lid][ref18], [3.18, eerste, tweede of derde lid][ref19],
      al dan niet in samenhang met het vierde lid, [3.22, vierde lid][ref20], [3.25, tweede of vierde lid][ref21],
      [3.26, derde lid][ref22], [3.32, tweede lid][ref23], [3.33, tweede lid][ref24], [3.34, derde lid][ref25],
      [4.2, eerste, tweede of derde lid][ref26], [4.3, derde lid][ref27], [4.5, eerste, derde of vierde lid][ref28],
      of [5.5, eerste en tweede lid][ref29], berusten bij één van Onze bij algemene maatregel van bestuur aangewezen
      Ministers, en de bevoegdheden en verplichtingen van gedeputeerde staten of provinciale staten, bedoeld in
      [artikel 2.4, eerste, tweede en derde lid][ref30], berusten bij Onze Minister, indien zij betrekking hebben op:

      a. bij algemene maatregel van bestuur aangewezen categorieën van handelingen, of

      b. handelingen die geheel of gedeeltelijk plaatsvinden in of gevolgen hebben voor bij algemene maatregel van
      bestuur aangewezen categorieën van gebieden.

      6 Ingeval toepassing wordt gegeven aan het vijfde lid, wordt waar in de bepalingen, genoemd in dat lid, sprake is
      van een provinciale verordening in plaats daarvan gelezen: ministeriële regeling.

      7 Provinciale staten kunnen bevoegdheden, aan hen toegekend bij of krachtens deze wet, overdragen aan gedeputeerde
      staten.


