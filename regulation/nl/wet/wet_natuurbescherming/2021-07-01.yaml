  - number: '1.4'
    text: |-
      Een wijziging van een bindende EU-rechtshandeling waarnaar in regels, gesteld bij of krachtens deze wet, wordt
      verwezen gaat voor de toepassing van die regels gelden met ingang van de dag waarop aan die wijziging uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een eerder
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 Onze Minister stelt een nationale natuurvisie vast.

      2 De nationale natuurvisie bevat de hoofdlijnen van het te voeren rijksbeleid gericht op het behoud en het
      zo mogelijk versterken van de biologische diversiteit, het duurzame gebruik van de bestanddelen daarvan en de
      bescherming van waardevolle landschappen, in nationaal en internationaal verband, en het behoud en het zo mogelijk
      versterken van de recreatieve, de educatieve en de belevingswaarde van natuur en landschap, in samenhang met het
      beleid om te komen tot een verduurzaming van de economie.

      3 De nationale natuurvisie besteedt daarbij in het bijzonder aandacht aan:

      a. het behoud en zonodig herstel van een gunstige staat van instandhouding van de van nature in Nederland in het
      wild voorkomende soorten dieren en planten en de in Nederland voorkomende typen natuurlijke habitats en habitats
      van soorten;

      b. de borging van een evenwichtige, duurzame economische ontwikkeling en de integratie van het beleid gericht op
      het behoud van de biologische diversiteit met het algemene economisch beleid, de handelspolitiek, het landbouw- en
      visserijbeleid en het innovatiebeleid;

      c. een goed functioneren van de ecosystemen in de onderscheiden natuurgebieden in onderlinge samenhang;

      d. het behoud, beheer en zonodig herstel van landschappen van nationaal of internationaal belang, met inachtneming
      van hun cultuurhistorische kenmerken;

      e. het duurzame beheer van houtopstanden;

      f. de gevolgen van klimaatveranderingen;

      g. de samenhang met het ruimtelijke beleid, het milieubeleid en het waterbeleid;

      h. de samenhang met het beleid en de verantwoordelijkheden van andere overheden op dat terrein;

      i. onderzoek op het terrein van de biologische diversiteit.

      4 De nationale natuurvisie biedt, in de vorm van rode lijsten, inzicht in de met uitroeiing bedreigde of speciaal
      gevaar lopende dier- en plantensoorten die van nature in Nederland voorkomen.

      5 De nationale natuurvisie bevat voor zover mogelijk een kwantificering van de instandhoudingsdoelstellingen voor
      de in Natura 2000-gebieden en bijzondere nationale natuurgebieden te beschermen habitats en soorten en verschaft
      in samenhang daarmee en in samenhang met de staat van instandhouding van deze habitats en soorten inzicht in
      voorgenomen wijzigingen van de besluiten tot aanwijzing van die Natura 2000-gebieden en bijzondere nationale
      natuurgebieden.

      6 Onderdelen van het rijksbeleid, bedoeld in het tweede lid, kunnen worden opgenomen in een andere rijksvisie.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.5
  - number: '1.6'
    text: |-
      1 Onze Minister draagt zorg voor actualisatie van de nationale natuurvisie en stelt zonodig een nieuwe visie of
      wijzigingen van onderdelen van de visie vast.

      2 Op de voorbereiding van de natuurvisie en wijzigingen daarvan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, behalve in geval van wijzigingen van
      ondergeschikte aard. Zienswijzen kunnen naar voren worden gebracht door een ieder.

      3 Onze Minister zendt de vastgestelde nationale natuurvisie en vastgestelde wijzigingen van de visie aan de Staten-
      Generaal en maakt de visie en wijzigingen bekend in de Staatscourant.

      4 Onze Minister stelt de nationale natuurvisie en wijzigingen daarvan vast in overeenstemming met Onze Minister van
      Infrastructuur en Milieu, onderscheidenlijk Onze Minister van Onderwijs, Cultuur en Wetenschappen, voor zover deze
      betrekking hebben op aangelegenheden die tot hun verantwoordelijkheid behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '1.7'
    text: |-
      1 Provinciale staten stellen een provinciale natuurvisie vast.

      2 Een provinciale natuurvisie bevat de hoofdlijnen van:

      a. het te voeren provinciale beleid gericht op het behoud en het zo mogelijk versterken van de biologische
      diversiteit en het duurzame gebruik van de bestanddelen daarvan, waartoe in elk geval behoort het beleid gericht op
      de uitvoering van de verplichtingen, genoemd in [artikel 1.12, eerste en tweede lid][ref1];

      b. ingeval de provincie dat van belang acht:

      1°. het te voeren provinciale beleid gericht op de uitvoering van de bevoegdheid, genoemd in
      [artikel 1.12, derde lid][ref2];

      2°. het te voeren provinciale beleid gericht op het behoud, beheer en zonodig herstel van waardevolle landschappen,
      met inachtneming van hun cultuurhistorische kenmerken, of

      3°. het te voeren provinciale beleid gericht op het behoud en het zo mogelijk versterken van de recreatieve,
      educatieve en belevingswaarde van natuur en landschap.

      3 Een provinciale natuurvisie besteedt in het bijzonder aandacht aan de integratie van het in het tweede lid
      bedoelde provinciale beleid met het provinciale algemene economisch beleid, ruimtelijke beleid, milieubeleid,
      waterbeleid en cultuurbeleid, en aan de samenhang tussen het in het tweede lid bedoelde beleid en het beleid en de
      verantwoordelijkheden van andere overheden op dat terrein.

      4 Onderdelen van het provinciale beleid, bedoeld in het tweede lid, kunnen worden opgenomen in een andere
      provinciale visie.

      5 [Artikel 1.6, eerste en tweede lid][ref3], is van overeenkomstige toepassing op de provinciale natuurvisie, met
      dien verstande dat waar in dat eerste lid sprake is van Onze Minister, in plaats daarvan wordt gelezen: provinciale
      staten.

      6 Provinciale staten dragen zorg voor publicatie van de provinciale natuurvisie.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel1.6
