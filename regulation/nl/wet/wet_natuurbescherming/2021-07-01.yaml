  - number: '3.4'
    text: |-
      1 Ingeval het vangen of doden van vogels als bedoeld in [artikel 3.1, eerste lid][ref1], bij of krachtens deze wet
      is toegestaan, is het verboden deze vogels:

      a. te vangen of te doden met:

      1°. middelen, genoemd in bijlage IV, onderdeel a, bij de Vogelrichtlijn;

      2°. middelen, installaties of methoden voor massaal of niet-selectief vangen of doden van vogels, of

      3°. middelen, installaties of methoden waardoor een soort plaatselijk kan verdwijnen, of

      b. te achtervolgen met behulp van vervoermiddelen, genoemd in bijlage IV, onderdeel b, bij de Vogelrichtlijn,
      overeenkomstig de daar beschreven wijze.

      2 Gedeputeerde staten kunnen ontheffing verlenen en provinciale staten kunnen bij verordening vrijstelling verlenen
      van een of meer van de verboden, bedoeld in het eerste lid. [Artikel 3.3, vierde en vijfde lid][ref2], is van
      overeenkomstige toepassing.

      3 Onze Minister kan ontheffing verlenen van het verbod, bedoeld in het eerste lid, aanhef en onderdeel b, voor het
      gebruik van motorboten op open zee onder de in bijlage IV, onderdeel b, tweede gedachtestreep, tweede volzin, bij
      de Vogelrichtlijn genoemde voorwaarden.

      4 Bij algemene maatregel van bestuur kunnen middelen, installaties of methoden worden aangewezen die in elk geval
      worden gerekend tot de middelen, installaties, onderscheidenlijk methoden, bedoeld in het eerste lid, onderdeel a,
      onder 2° of 3°.


