    text: |-
      1 Deze wet, met uitzondering van de [paragrafen 3.4][ref1] en [3.5][ref2], de
      [artikelen 3.26 tot en met 3.30][ref3], [3.32][ref4] en [3.33][ref5], en [hoofdstuk 4][ref6], is mede van
      toepassing in de exclusieve economische zone.

      2 Deze wet is niet van toepassing op handelingen die onderwerp zijn van het gemeenschappelijk visserijbeleid,
      bedoeld in artikel 38 van het Verdrag betreffende de werking van de Europese Unie, voor zover zij plaatsvinden in
      de exclusieve economische zone.


