  - number: '3.23'
    text: |-
      1 Gerechtigd tot het uitoefenen van de jacht in een veld zijn, elkaar uitsluitend:

      a. de eigenaar van de grond;

      b. de erfpachter of vruchtgebruiker van de grond, tenzij de eigenaar zich bij het vestigen van het erfpachtrecht
      of het recht op vruchtgebruik het jachtrecht heeft voorbehouden en tenzij het jachtrecht ten tijde van het vestigen
      van het erfpachtrecht of het recht op vruchtgebruik al was verhuurd;

      c. de pachter van de grond, tenzij de verpachter bij het aangaan van de pachtovereenkomst niet tot het uitoefenen
      van de jacht gerechtigd was of zich het recht tot de uitoefening van de jacht heeft voorbehouden en tenzij ten
      tijde van het aangaan van de pachtovereenkomst het jachtrecht al was verhuurd, dan wel

      d. degene die het jachtrecht bij schriftelijke en gedagtekende overeenkomst voor een periode van ten minste zes
      jaar en ten hoogste twaalf jaar heeft gehuurd van de ten tijde van het aangaan van de huurovereenkomst tot de
      uitoefening van de jacht gerechtigde:

      1°. eigenaar, erfpachter, vruchtgebruiker of pachter van de grond, met toestemming van de grondgebruiker ingeval de
      verhuurder niet tevens grondgebruiker is, of

      2°. huurder van het jachtrecht, met toestemming van de eigenaar, erfpachter, vruchtgebruiker of pachter die het
      jachtrecht aan deze huurder heeft verhuurd en mits het jachtrecht in zijn geheel wordt weder verhuurd.

      2 In de huurovereenkomst, bedoeld in het eerste lid, onderdeel d, kan niet worden afgeweken van
      [artikel 226, eerste, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1]. Zij bevat geen beding van
      optie of verlenging.

      3 Bij algemene maatregel van bestuur kan worden geregeld in welke gevallen het is toegestaan dat de periode,
      bedoeld in het eerste lid, onderdeel d, korter is dan zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
