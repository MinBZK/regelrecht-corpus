      Op de voorbereiding van het programma stikstofreductie en natuurverbetering en wijzigingen daarvan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, behalve in geval van wijzigingen van
      ondergeschikte aard. Zienswijzen kunnen naar voren worden gebracht door een ieder.


