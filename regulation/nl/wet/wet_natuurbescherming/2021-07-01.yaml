  - number: 1.12fa
    text: |-
      1 Binnen twee jaar na de inwerkingtreding van [artikel 1.12b][ref1] leggen gedeputeerde staten Onze Minister een
      gebiedsplan voor ter gebiedsgerichte uitwerking van de landelijke omgevingswaarde en het programma stikstofreductie
      en natuurverbetering. Het plan kan indien gewenst door gedeputeerde staten vergezeld gaan van een voorstel tot
      wijziging van het programma. Het plan beschrijft voor elke voor stikstof gevoelige habitat in de Natura 2000-
      gebieden in de betrokken provincie in elk geval:

      a. voor zover het programma stikstofreductie en natuurverbetering niet meer actueel is:

      1°. de omvang van de stikstofdepositie en de bronnen daarvan, onderscheiden naar de belangrijkste sectoren en naar
      de afkomst van binnen en buiten de provincie, en de mate waarin de kritische depositiewaarde wordt overschreden;

      2°. de verwachte autonome ontwikkeling van de stikstofemissie door bronnen binnen en buiten de betrokken Natura
      2000-gebieden en de gevolgen daarvan voor de omvang van stikstofdepositie in de voor stikstof gevoelige habitats;

      b. de binnen en buiten de betrokken Natura 2000-gebieden in de provincie uitgevoerde of uit te voeren maatregelen
      die bijdragen aan:

      1°. vermindering van de stikstofdepositie met het oog op het tijdig voldoen aan de omgevingswaarden,
      bedoeld in [artikel 1.12a, eerste lid][ref2], en aan de tussentijdse doelstellingen, bedoeld in
      [artikel 1.12b, tweede lid, onderdeel a][ref3];

      2°. het bereiken van de instandhoudingsdoelstellingen;

      c. de verwachte sociaaleconomische effecten en de weging van de haalbaarheid en doelmatigheid en doeltreffendheid
      van de maatregelen, bedoeld in onderdeel b;

      d. de verwachte gevolgen van de maatregelen, bedoeld in onderdeel b, voor de omvang van de stikstofdepositie,
      respectievelijk het bereiken van de instandhoudingsdoelstellingen.

      2 Na ontvangst van een plan als bedoeld in het eerste lid kan Onze Minister, na instemming van beide
      partijen, het programma stikstofreductie en natuurverbetering dienovereenkomstig wijzigen, door daarin
      voor elke voor stikstof gevoelige habitat in de Natura 2000-gebieden en voor de betrokken provincie in
      elk geval de maatregelen te beschrijven die nodig zijn om tijdig te voldoen aan de omgevingswaarden,
      bedoeld in [artikel 1.12a, eerste lid][ref4], en aan de tussentijdse doelstellingen, bedoeld in
      [artikel 1.12b, tweede lid, onderdeel a][ref5].


