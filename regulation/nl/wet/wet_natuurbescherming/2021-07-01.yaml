  - number: '3.14'
    text: |-
      1 Jachthouders met een jachtakte organiseren zich met anderen in een wildbeheereenheid, die de rechtsvorm
      van een vereniging heeft, ter uitvoering van het door de faunabeheereenheid vastgestelde faunabeheerplan
      en om te bevorderen dat een duurzaam beheer van populaties van in het wild levende dieren, bestrijding van
      schadeveroorzakende dieren en jacht worden uitgevoerd in samenwerking met en ten dienste van grondgebruikers of
      terreinbeheerders. Ook grondgebruikers en terreinbeheerders kunnen lid worden van de vereniging.

      2 Provinciale staten stellen bij verordening regels waaraan in hun provincie werkzame wildbeheereenheden als
      bedoeld in het eerste lid voldoen. Deze regels hebben in elk geval betrekking op:

      a. de omvang en begrenzing van het gebied waarover zich de zorg van de wildbeheereenheid kan uitstrekken, en

      b. de gevallen waarin en voorwaarden waaronder jachthouders zijn uitgezonderd van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen vogels als bedoeld in [artikel 3.1, eerste lid][ref1], en dieren van
      soorten als bedoeld in [artikel 3.5, eerste lid][ref2], of [3.10, eerste lid][ref3], worden aangewezen, die niet
      in hun voortbestaan worden bedreigd of dat gevaar lopen, en die in het gehele land schade veroorzaken.

      2 In zoverre in afwijking van de [artikelen 3.3, tweede lid][ref4], [3.8, tweede lid][ref5], en
      [3.10, tweede lid][ref6], in samenhang met artikel 3.8, tweede lid, kan Onze Minister een vrijstelling van
      verboden als bedoeld in de [artikelen 3.1][ref7], [3.2, tweede lid][ref8], [3.5][ref9], [3.6, tweede lid][ref10],
      en [3.10, eerste lid][ref11], verlenen voor de bestrijding door grondgebruikers van schadeveroorzakende vogels en
      dieren als bedoeld in het eerste lid.

      3 Provinciale staten kunnen bij verordening vogels als bedoeld in [artikel 3.1, eerste lid][ref12], en dieren van
      soorten als bedoeld in [artikel 3.5, eerste lid][ref13] of [3.10, eerste lid][ref14], aanwijzen die:

      a. niet bij algemene maatregel van bestuur als bedoeld in het eerste lid, zijn aangewezen;

      b. niet in hun voortbestaan worden bedreigd of dat gevaar lopen, en

      c. in hun provincie schade veroorzaken.

      4 Provinciale staten verlenen bij verordening een vrijstelling als bedoeld in [artikel 3.3, tweede lid][ref15],
      [3.8, tweede lid][ref16], [3.10, tweede lid][ref17], in samenhang met artikel 3.8, tweede lid, voor de bestrijding
      van schadeveroorzakende vogels en dieren als bedoeld in het derde lid uitsluitend aan grondgebruikers.

      5 De vrijstelling, bedoeld in het tweede en vierde lid, wordt verleend voor handelingen op door de grondgebruiker
      gebruikte gronden, dan wel in of aan door hem gebruikte opstallen, ter voorkoming van in het lopende of daarop
      volgende jaar dreigende schade op deze gronden, in of aan deze opstallen, of in het omringende gebied.

      6 De schade, bedoeld in het tweede tot en met vijfde lid, heeft uitsluitend betrekking op:

      a. door vogels veroorzaakte:

      1°. belangrijke schade aan gewassen, vee, bossen, visserij of wateren, of

      2°. schade aan flora of fauna;

      b. door dieren van soorten als bedoeld in [artikel 3.5, eerste lid][ref18], veroorzaakte:

      1°. schade aan de wilde flora of fauna, of natuurlijke habitats, of

      2°. ernstige schade aan met name de gewassen, veehouderijen, bossen, visgronden, wateren of andere vormen van
      eigendom, en

      c. door dieren van soorten als bedoeld in [3.10, eerste lid][ref19], met uitzondering van soorten als bedoeld in
      [artikel 3.5, eerste lid][ref20], veroorzaakte schade behorende tot bij de vrijstelling, bedoeld in het tweede
      lid, onderscheidenlijk de verordening, bedoeld in het vierde lid, omschreven categorieën van schade.

      7 De grondgebruiker kan bij schriftelijke en gedagtekende toestemming de hem ingevolge het tweede tot en met vijfde
      lid toegestane handelingen door een wildbeheereenheid of anderen doen uitoefenen.

      8 Alvorens Ons een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in het eerste lid te doen, overlegt Onze Minister met de gedeputeerde staten van de provincies over het
      ontwerp daarvan.


