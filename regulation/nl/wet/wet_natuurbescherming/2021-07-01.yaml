  - number: '2.4'
    text: |-
      1 Gedeputeerde staten leggen, indien dat nodig is voor een Natura 2000-gebied, gelet op de
      instandhoudingsdoelstellingen, aan degene die in hun provincie een handeling verricht of het voornemen daartoe
      heeft, een verplichting op om:

      a. informatie over de handeling te verstrekken;

      b. de nodige preventieve of herstelmaatregelen te treffen;

      c. de handeling overeenkomstig daarbij gegeven voorschriften uit te voeren, of

      d. de handeling niet uit te voeren of te staken.

      2 Ingeval in het belang van de bescherming van een Natura 2000-gebied een onverwijlde tenuitvoerlegging van
      een besluit als bedoeld in het eerste lid noodzakelijk is, kunnen gedeputeerde staten het besluit bekendmaken
      door mondelinge mededeling aan degene die de handeling verricht of het voornemen daartoe heeft. Gedeputeerde
      staten stellen het besluit zo spoedig mogelijk alsnog op schrift en zenden dit toe of reiken dit uit aan de
      belanghebbenden.

      3 Provinciale staten stellen, indien dat nodig is voor een Natura 2000-gebied, gelet op de
      instandhoudingsdoelstellingen, ten aanzien van categorieën van handelingen bij verordening regels, houdende
      verplichtingen als bedoeld in het eerste lid. Ten aanzien van deze handelingen geven gedeputeerde staten geen
      toepassing aan het eerste lid.

      4 Het is verboden te handelen in strijd met een verplichting als bedoeld in het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Gedeputeerde staten verbieden of beperken de toegang tot een in hun provincie gelegen Natura 2000-
      gebied of een in hun provincie gelegen gedeelte van een Natura 2000-gebied, indien dat nodig is gelet op de
      instandhoudingsdoelstellingen voor dat gebied.

      2 Een verbod of beperking als bedoeld in het eerste lid geldt niet voor de eigenaar van een in het gebied gelegen
      onroerende zaak en voor degene die een zakelijk of persoonlijk gebruiksrecht heeft met betrekking tot die zaak,
      voor zover door het verbod of de beperking de toegang tot de onroerende zaak ernstig zou worden belemmerd.

      3 Het is verboden in strijd te handelen met een verbod of beperking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Gedeputeerde staten verrichten in hun provincie feitelijke handelingen of laten deze verrichten, indien dat nodig
      is gelet op de instandhoudingsdoelstellingen voor een Natura 2000-gebied.

      2 Gedeputeerde staten kunnen in hun provincie in en rondom een Natura 2000-gebied de nodige kentekenen laten
      aanbrengen die de aanwijzing van dat gebied en de rechtsgevolgen daarvan kenbaar maken.

      3 De eigenaar van de desbetreffende onroerende zaak en degene die een zakelijk of persoonlijk gebruiksrecht heeft
      met betrekking tot die zaak gedogen het verrichten van handelingen als bedoeld in het eerste en tweede lid.

      4 Gedeputeerde staten gaan niet over tot het verrichten van handelingen als bedoeld in het eerste of tweede lid,
      dan nadat zij de rechthebbenden, bedoeld in het derde lid, het voornemen daartoe schriftelijk hebben medegedeeld
      en na de mededeling ten minste vier weken zijn verstreken. Ingeval een onverwijlde verrichting van de handeling
      noodzakelijk is, kan de mededeling mondeling geschieden en geldt de termijn van vier weken niet.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Een bestuursorgaan stelt een plan dat niet direct verband houdt met of nodig is voor het beheer van een Natura
      2000-gebied, en dat afzonderlijk of in combinatie met andere plannen of projecten significante gevolgen kan hebben
      voor een Natura 2000-gebied, uitsluitend vast indien is voldaan aan [artikel 2.8][ref1].

      2 Het is verboden zonder vergunning van gedeputeerde staten een project te realiseren dat niet direct verband houdt
      met of nodig is voor het beheer van een Natura 2000-gebied, maar afzonderlijk of in combinatie met andere plannen
      of projecten significante gevolgen kan hebben voor een Natura 2000-gebied.

      3 Gedeputeerde staten verlenen een vergunning als bedoeld in het tweede lid uitsluitend indien is voldaan aan
      [artikel 2.8][ref2].

      4 Het verbod, bedoeld in het tweede lid, is niet van toepassing op projecten ten aanzien waarvan bij of krachtens
      enige wettelijke bepaling een besluit is vereist, indien bij of krachtens die wet is bepaald dat dat besluit
      uitsluitend wordt vastgesteld indien is voldaan aan [artikel 2.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2.8
