  - number: '2.11'
    text: |-
      1 Onze Minister kan een gebied, niet zijnde een Natura 2000-gebied, als bijzonder nationaal natuurgebied aanwijzen
      ingeval:

      a. het gebied is opgenomen op een lijst als bedoeld in artikel 4, eerste lid, van de Habitatrichtlijn;

      b. het gebied onderwerp is van een procedure als bedoeld in artikel 5 van de Habitatrichtlijn;

      c. in het gebied leefgebieden voor vogels, natuurlijke habitats of habitats van soorten
      worden ontwikkeld of verbeterd ter uitvoering van een compenserende maatregel als bedoeld in
      [artikel 2.8, vierde lid, onderdeel c][ref1];

      d. bescherming van het gebied nodig is voor de instandhouding of het herstel van biotopen en leefgebieden voor
      in Nederland natuurlijk in het wild levende vogelsoorten, genoemd in bijlage I bij de Vogelrichtlijn, en de niet
      in die bijlage genoemde geregeld in Nederland voorkomende trekvogelsoorten, of het behoud of herstel van een
      gunstige staat van instandhouding van de natuurlijke habitats, de habitats van soorten of de soorten, genoemd in
      onderscheidenlijk de bijlagen I, II, IV of V bij de Habitatrichtlijn.

      2 Op een besluit als bedoeld in het eerste lid is
      [artikel 2.1, tweede, derde, vierde, vijfde, zesde en zevende lid][ref2], van toepassing.

      3 De [artikelen 2.4][ref3], [2.5][ref4] en [2.6][ref5] zijn van overeenkomstige toepassing ten aanzien
      van krachtens het eerste lid aangewezen gebieden, met dien verstande dat de desbetreffende bevoegdheden en
      verantwoordelijkheden berusten bij Onze Minister, tenzij deze bij algemene maatregel van bestuur zijn overgedragen
      aan gedeputeerde staten of provinciale staten. [Artikel 2.10, tweede lid][ref6], is van overeenkomstige toepassing
      op door Onze Minister te nemen besluiten.

      4 De voordracht voor een algemene maatregel van bestuur als bedoeld in het derde lid wordt niet gedaan dan nadat
      over de daarin te regelen overdracht van bevoegdheden en verantwoordelijkheden overeenstemming is bereikt met
      gedeputeerde staten van de betrokken provincie.


