  - number: '7.5'
    text: |-
      1 Onverminderd [artikel 7.2][ref1] en [artikel 117 van het Wetboek van Strafvordering][ref2] kan Onze Minister
      onverwijld maatregelen treffen ten aanzien van hout of houtproducten die in strijd met het bepaalde bij of
      krachtens deze wet zijn ingevoerd of op de markt zijn gebracht. Deze maatregelen kunnen inhouden het in bewaring
      nemen van het hout of van het houtproduct, of een besluit houdende oplegging van;

      a. een verbod tot het vervoeren, be- of verwerken of in het verkeer brengen;

      b. de verplichting tot tijdelijke opslag;

      c. de verplichting tot terugzending naar het land van uitvoer of herkomst;

      d. de verplichting om houders, dan wel vermoedelijke houders van het hout of het houtproduct onverwijld en op
      doeltreffende wijze op de hoogte te stellen;

      e. de verplichting om het hout of het houtproduct dat in het verkeer is gebracht op te halen of centraal op te
      slaan;

      f. de verplichting tot het identificeren en registreren van het hout of het houtproduct.

      2 De kosten van de in het eerste lid bedoelde maatregelen komen ten laste van degene die verantwoordelijk is
      voor het op de markt brengen van het hout of het houtproduct, de eigenaar daarvan, degene die het hout of het
      houtproduct verhandelt, of de gemachtigde van een of meer van deze personen. Bij gebreke van volledige betaling
      binnen de door hem gestelde termijn kan Onze Minister het verschuldigde bedrag invorderen bij dwangbevel.

      3 De in het eerste lid bedoelde besluiten kunnen onder voorwaarden of beperkingen worden genomen. Aan de bij
      besluit opgelegde verplichtingen kunnen voorschriften worden verbonden.

      4 Het is verboden in strijd te handelen met een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel117
