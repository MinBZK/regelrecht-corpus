  - number: 1.13a
    text: |-
      1 Onze Minister draagt in het belang van de rechtszekerheid tezamen met gedeputeerde staten van de provincies zorg
      voor het legaliseren van de projecten met een geringe stikstofdepositie op Natura 2000-gebieden die voldeden aan de
      voorwaarden van [artikel 2.12 van het Besluit natuurbescherming][ref1], zoals dat luidde op 28 mei 2019.

      2 Onze Minister stelt zo spoedig mogelijk een programma vast met maatregelen om de gevolgen van de
      stikstofdepositie van de in het eerste lid bedoelde projecten te mitigeren of te compenseren, gericht op de
      verlening voor de projecten van:

      a. een vergunning als bedoeld in [artikel 2.7, tweede lid][ref2];

      b. een voor de vergunning, bedoeld in onderdeel a, in de plaats komende omgevingsvergunning voor activiteiten als
      bedoeld in [artikel 2.1, eerste lid, onderdeel i, van de Wet algemene bepalingen omgevingsrecht][ref3]; of

      c. een vrijstelling als bedoeld in [artikel 2.9, tweede lid][ref4].

      3 In het programma worden alleen maatregelen opgenomen die niet zijn opgenomen in het programma stikstofreductie en
      natuurverbetering, bedoeld in [artikel 1.12b][ref5].

      4 De in het programma opgenomen maatregelen worden uitgevoerd binnen drie jaar na de vaststelling van het
      programma.

      5 In het programma opgenomen compenserende maatregelen als bedoeld in artikel 6, vierde lid, van de
      Habitatrichtlijn waarborgen dat de algehele samenhang van het Natura 2000-netwerk bewaard blijft.


