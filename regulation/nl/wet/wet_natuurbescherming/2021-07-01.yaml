  - number: '9.12'
    text: |-
      1 Op het tijdstip van inwerkingtreding van [artikel 12.1][ref1] gaan alle vermogensbestanddelen van het
      Faunafonds, bedoeld in [artikel 83, eerste lid, van de Flora- en faunawet][ref2], zoals dat onmiddellijk voor dat
      tijdstip gold, onder algemene titel over op de provincies gezamenlijk, zonder dat daarvoor een akte of betekening
      nodig is.

      2 De liquide middelen die behoren tot de vermogensbestanddelen, bedoeld in het eerste lid, worden op een
      afzonderlijke, gemeenschappelijke rekening geboekt.

      3 Gedeputeerde staten van de provincies wijzen gezamenlijk een persoon of rechtspersoon aan die is belast met
      de vereffening van het vermogen van het Faunafonds. Gedeputeerde staten kunnen gezamenlijk deze persoon of
      rechtspersoon aanwijzingen geven over de wijze van de vereffening en de verantwoording daarover.

      4 De persoon of rechtspersoon, bedoeld in het derde lid, is bevoegd alle rechtshandelingen te verrichten met het
      oog op de vereffening van het vermogen van het Faunafonds, waaronder het innen van vorderingen.

      5 Rechtsvorderingen die tot het vermogen van het Faunafonds behorende rechten of verplichtingen tot onderwerp
      hebben, worden ingesteld door en tegen de provincies gezamenlijk.

      6 De kosten van de vereffening van het vermogen van het Faunafonds komen ten laste van dat vermogen.

      7 Gedeputeerde staten als bedoeld in [artikel 6.1][ref3] zijn bevoegd tot het nemen van
      besluiten die samenhangen met besluiten over het verlenen van tegemoetkomingen als bedoeld in
      [artikel 83, eerste lid, onderdeel b, van de Flora- en faunawet][ref4].

      8 Wettelijke procedures en rechtsgedingen waarbij het Faunafonds betrokken is, worden aanhangig gemaakt of
      voortgezet door of tegen gedeputeerde staten als bedoeld in [artikel 6.1][ref5].


