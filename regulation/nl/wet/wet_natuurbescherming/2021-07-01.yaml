      1 Besluiten als bedoeld in [artikel 1, vijfde lid, van de Boswet][ref1] gelden als besluiten als bedoeld in
      [artikel 4.1, onderdeel a][ref2].

      2 Kennisgevingen als bedoeld in [artikel 2, eerste lid, van de Boswet][ref3] gelden als meldingen als bedoeld in
      [artikel 4.2, eerste lid][ref4].

      3 [Artikel 4.3, eerste lid][ref5], is van toepassing op degene voor wie vóór het tijdstip van inwerkingtreding van
      deze wet een verplichting tot herbeplanting is ontstaan op grond van [artikel 3, eerste lid, van de Boswet][ref6].

      4 [Artikel 4.3, tweede lid][ref7], is van toepassing op degene voor wie vóór het tijdstip van
      inwerkingtreding van deze wet een verplichting tot vervanging van herbeplanting is ontstaan op grond van
      [artikel 3, tweede lid, van de Boswet][ref8].

      5 Vrijstellingen als bedoeld in [artikel 6, eerste lid, van de Boswet][ref9] die onmiddellijk voor het tijdstip
      van inwerkingtreding van deze wet van kracht zijn, gelden voor de periode waarvoor zij van toepassing zijn, als
      vrijstellingen als bedoeld in [artikel 4.5, vierde lid][ref10].

      6 Ontheffingen als bedoeld in [artikel 6, tweede lid, van de Boswet][ref11] gelden als ontheffingen als bedoeld in
      [artikel 4.5, derde lid][ref12].

      7 Verboden als bedoeld in [artikel 13, eerste lid, van de Boswet][ref13] gelden als verboden als bedoeld
      [artikel 4.2, derde lid][ref14].


