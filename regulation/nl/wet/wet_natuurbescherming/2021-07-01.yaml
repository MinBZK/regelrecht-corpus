      1 Jachtaktehouders verstrekken aan de desbetreffende faunabeheereenheden gegevens over de aantallen dieren,
      onderscheiden naar soort, die zij hebben gedood.

      2 De faunabeheereenheden dragen er zorg voor dat een overzicht dat is samengesteld op basis van gegevens als
      bedoeld in het eerste lid en gegevens uit het verslag, bedoeld in [artikel 3.12, achtste lid][ref1], betrekking
      hebbend op hun totale werkgebied, openbaar wordt gemaakt.


