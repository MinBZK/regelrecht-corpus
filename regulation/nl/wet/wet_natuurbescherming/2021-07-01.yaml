  - number: '2.1'
    text: |-
      1 Onze Minister wijst gebieden aan als speciale beschermingszones ter uitvoering van de artikelen 3, tweede lid,
      onderdeel a, en 4, eerste en tweede lid, van de Vogelrichtlijn en de artikelen 3, tweede lid, en 4, vierde lid, van
      de Habitatrichtlijn. De speciale beschermingszones worden aangeduid als «Natura 2000-gebied».

      2 Ingeval een gebied geheel of gedeeltelijk wordt beheerd door één van Onze andere Ministers, neemt Onze Minister
      een besluit als bedoeld in het eerste lid in overeenstemming met die andere Minister.

      3 Bij een besluit als bedoeld in het eerste lid wordt als bijlage een kaart opgenomen waarop de begrenzing van het
      desbetreffende gebied nauwkeurig is aangegeven.

      4 Een besluit als bedoeld in het eerste lid bevat instandhoudingsdoelstellingen voor het gebied. Daartoe behoren in
      elk geval de instandhoudingsdoelstellingen ten aanzien van:

      a. de leefgebieden voor vogelsoorten, voor zover nodig ter uitvoering van de Vogelrichtlijn, of

      b. de natuurlijke habitats en de habitats van soorten, voor zover nodig ter uitvoering van de Habitatrichtlijn.

      5 Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      6 Onze Minister draagt, mede in het licht van de toepassing van [artikel 1.8, eerste lid][ref2], en gevolg gevend
      aan het inzicht, bedoeld in [artikel 1.5, vijfde lid][ref3], zorg voor de actualisatie van de besluiten, bedoeld
      in het eerste lid.

      7 Onze Minister kan een besluit als bedoeld in het eerste lid wijzigen of geheel of
      gedeeltelijk intrekken. Op de voorbereiding van een besluit als bedoeld in de eerste volzin is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing, behalve in geval van wijzigingen van
      ondergeschikte aard. Bij een besluit tot gedeeltelijke intrekking of wijziging kan als bijlage een kaart worden
      opgenomen waarop de gewijzigde begrenzing van het desbetreffende gebied nauwkeurig is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.8
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel1.5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
