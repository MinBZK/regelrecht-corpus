  - number: '5.3'
    text: |-
      1 Aan een vrijstelling, vergunning of ontheffing kunnen voorschriften worden verbonden.

      2 Een vrijstelling, vergunning of ontheffing kan onder beperkingen worden verleend.

      3 Vrijstellingen, vergunningen en ontheffingen kunnen aan een geldigheidsduur worden gebonden.

      4 Het is verboden te handelen in strijd met de bij een vergunning of ontheffing gestelde voorschriften.

      5 Het eerste, tweede, derde en vierde lid zijn van overeenkomstige toepassing op een krachtens
      [artikel 3.18, eerste of vierde lid][ref1], gegeven opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3.18'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '5.4'
    text: |-
      1 Een bij of krachtens deze wet verleende vergunning of ontheffing kan worden ingetrokken of gewijzigd indien:

      a. de houder van een vergunning, onderscheidenlijk ontheffing in strijd handelt met de hem verleende vergunning,
      onderscheidenlijk ontheffing of de daaraan verbonden voorschriften of beperkingen;

      b. de gegevens op grond waarvan de vergunning, onderscheidenlijk ontheffing is verleend zodanig onjuist of
      onvolledig blijken te zijn dat, waren de juiste gegevens bekend geweest, een andere beslissing zou zijn genomen;

      c. de vergunning, onderscheidenlijk ontheffing in strijd met wettelijke voorschriften is verleend, of

      d. de omstandigheden sedert het tijdstip waarop de vergunning, onderscheidenlijk ontheffing is verleend zodanig
      zijn gewijzigd, dat deze niet, niet zonder beperkingen of voorwaarden, of onder andere beperkingen of voorwaarden
      zou zijn verleend, indien deze omstandigheden op het tijdstip waarop de vergunning, onderscheidenlijk ontheffing is
      verleend zouden hebben bestaan.

      2 Een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], wordt in elk geval ingetrokken of gewijzigd
      indien dat nodig is ter uitvoering van artikel 6, tweede lid, van de Habitatrichtlijn.

      3 Een krachtens [artikel 3.3, eerste of derde lid][ref2], [3.4, tweede of derde lid][ref3],
      [3.8, eerste of derde lid][ref4], [3.9, tweede lid][ref5], [3.10, tweede lid][ref6], in samenhang met
      artikel 3.8, eerste lid, [3.17, eerste lid][ref7], [3.25, eerste of vierde lid][ref8], [3.26, derde lid][ref9],
      of [3.34, derde of vijfde lid][ref10], verleende ontheffing, een jachtakte of een valkeniersakte kan tevens worden
      ingetrokken indien de houder van de ontheffing, onderscheidenlijk de akte, nadat die is verleend, onherroepelijk
      is veroordeeld:

      a. wegens overtreding van een bij of krachtens [hoofdstuk 3][ref11] gestelde bepaling, of indien tegen hem deswege
      een strafbeschikking is uitgevaardigd;

      b. wegens overtreding van [artikel 5.3, vierde lid][ref12], in samenhang met
      [artikel 3.3, eerste, tweede of derde lid][ref13], [3.4, tweede of derde lid][ref14],
      [3.8, eerste, tweede of derde lid][ref15], [3.9, tweede lid][ref16], [3.10, tweede lid][ref17], in samenhang met
      artikel 3.8, eerste lid, [3.17, eerste lid][ref18], [3.25, eerste of vierde lid][ref19], [3.26, derde lid][ref20],
      [3.32, tweede lid][ref21], of [3.34, derde of vijfde lid][ref22], en [artikel 5.3, vijfde lid][ref23], in
      samenhang met [artikel 3.18, eerste lid][ref24], of

      c. wegens een feit strafbaar gesteld bij de [Wet dieren][ref25] voor zover het gedragingen als bedoeld in de
      [artikelen 2.1][ref26], [2.2][ref27], [2.3][ref28], [2.5][ref29], [2.6][ref30], [2.7][ref31], [2.8][ref32],
      [2.9][ref33], [2.10][ref34], [2.13][ref35], [2.14][ref36] of [2.15 van die wet][ref37] betreft, of tegen hem
      deswege een strafbeschikking is uitgevaardigd of hem wegens overtreding van het krachtens de voornoemde artikelen
      van de Wet dieren bepaalde een bestuurlijke boete als bedoeld in [artikel 8.7 van de Wet dieren][ref38] is
      opgelegd.

      4 De jachtakte wordt in elk geval ingetrokken indien:

      a. de ter verkrijging van de akte verstrekte gegevens zodanig onjuist of onvolledig blijken, dat, waren de juiste
      gegevens verstrekt, de akte zou zijn geweigerd;

      b. blijkt dat de burgerrechtelijke aansprakelijkheid, bedoeld in [artikel 3.26, eerste lid, onderdeel c][ref39],
      niet langer overeenkomstig het bepaalde bij of krachtens dat artikelonderdeel en
      [artikel 3.29, eerste lid][ref40], is gedekt;

      c. de houder misbruik heeft gemaakt van wapens of munitie dan wel van de bevoegdheid om wapens of munitie
      voorhanden te hebben, of indien er anderszins aanwijzingen zijn dat aan hem het voorhanden hebben van wapens of
      munitie niet langer kan worden toevertrouwd;

      d. sinds de verlening van de jachtakte de houder onherroepelijk is veroordeeld wegens het plegen van een misdrijf
      als genoemd in het [artikel 3.28, derde lid, onderdeel e][ref41], of

      e. indien de houder ervan in het bezit is van een magazijn voor een vuurwapen als bedoeld in artikel 10, eerste
      lid, van de Richtlijn zonder hiervoor een verlof of ontheffing op grond van de [Wet wapens en munitie][ref42] te
      hebben.

      5 Het vierde lid, onderdeel a in samenhang met de aanhef, is van overeenkomstige toepassing op de valkeniersakte.

      6 De jachtakte of de valkeniersakte kan worden ingetrokken indien:

      a. er grond is om aan te nemen dat de houder van zijn bevoegdheid om de jacht uit te oefenen misbruik maakt;

      b. de houder nalatig is te doen wat een goed jager betaamt bij de uitoefening van de jacht;

      c. er grond is om aan te nemen dat de houder van zijn bevoegdheden in het kader van beheer en schadebestrijding op
      grond van de [paragrafen 3.1][ref43], [3.2][ref44], [3.3][ref45] en [3.6][ref46], misbruik maakt.

      7 De bevoegdheid tot het nemen van beschikkingen tot intrekking van jachtakten berust bij de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref47].

      8 De in het zevende lid bedoelde bevoegdheid komt tevens toe aan Onze Minister van Veiligheid en Justitie in
      gevallen als bedoeld in het vierde lid, onderdeel c.

      9 Onze Minister kan een goedkeuring als bedoeld in [artikel 3.31, eerste lid, aanhef][ref48], intrekken indien
      naar zijn oordeel de staat van instandhouding van soorten als bedoeld in [artikel 3.1][ref49], [3.5][ref50] of
      [3.10, eerste lid][ref51], of de trend in de staat van instandhouding van die soorten daartoe noodzaakt.


