  - number: 3.28a
    text: |-
      1 De jachtakte wordt, onverminderd het bepaalde in de [artikel 3.28][ref1], slechts verleend indien:

      a. de aanvraag door de aanvrager in persoon is gedaan, onder overlegging van een geldig identiteitsbewijs;

      b. de aanvrager heeft meegewerkt aan een door Onze Minister van Veiligheid en Justitie op grond van
      [artikel 6a, eerste lid, onderdeel b, van de Wet wapens en munitie][ref2] aangewezen onderzoek;

      c. de aanvrager ten minste drie referenten heeft opgegeven, onder verstrekking van hun contactgegevens, bij wie
      navraag kan worden gedaan naar de aanvrager, en

      d. de aanvrager in persoon aanwezig is geweest bij de controle door de korpschef van de op het adres van de
      aanvrager getroffen voorzieningen voor de opslag van wapens en munitie.

      2 Het eerste lid, met uitzondering van onderdeel a, is niet van toepassing op de aanvrager die reeds in het bezit
      is van een jachtakte waarvan de geldigheidsduur nog niet is verstreken, tenzij de toepassing van de onderdelen b,
      c of d, naar het oordeel van de korpschef, noodzakelijk is voor een deugdelijke beoordeling van het bepaalde in
      [artikel 3.28, derde lid, onderdeel a][ref3].

      3 De jachtakte wordt aan degene aan wie zij wordt verleend, in persoon uitgereikt.

      4

      5 Het eerste en derde lid zijn niet van toepassing op de aanvrager die een aanvraag doet voor een jachtakte als
      bedoeld in [artikel 3.28, vijfde lid][ref4].


