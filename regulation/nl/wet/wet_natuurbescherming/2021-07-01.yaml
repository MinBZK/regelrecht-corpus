  - number: '2.10'
    text: |-
      1 Ingeval een Natura 2000-gebied geheel of gedeeltelijk wordt beheerd door één van Onze andere Ministers berusten
      voor dat gebied, onderscheidenlijk dat gedeelte:

      a. de in [artikel 2.2][ref1] opgenomen verplichtingen, voor zover deze het treffen van feitelijke maatregelen of
      de uitoefening van in andere wetten aan Onze betrokken Minister toegekende bevoegdheden in het gebied of gedeelte
      van het gebied met zich brengen, en de in [artikelen 2.3][ref2] en [2.6][ref3] bedoelde bevoegdheden bij:

      1°. Onze Minister van Infrastructuur en Milieu, ingeval het gebied, onderscheidenlijk het gedeelte, een
      oppervlaktewaterlichaam als bedoeld in de [Waterwet][ref4] is, dat op grond van die wet wordt beheerd door het
      Rijk;

      2°. Onze Minister van Defensie, ingeval het gebied, onderscheidenlijk het gedeelte, een militair terrein is, of

      3°. Onze Minister ingeval het gebied, onderscheidenlijk het gedeelte, wordt beheerd door één van Onze andere
      Ministers dan die, bedoeld onder 1° en 2°;

      b. de in [artikel 2.5][ref5] bedoelde bevoegdheden bij Onze Minister.

      2 Onze Ministers nemen op grond van het eerste lid geen besluiten dan na overleg met gedeputeerde staten van de
      provincies waarin het Natura 2000-gebied is gelegen, tenzij spoed is geboden.

      3 Ingeval een Natura 2000-gebied is gelegen in meer dan één provincie, wordt het beheerplan, bedoeld in
      [artikel 2.3][ref6], voor dat gebied vastgesteld door gedeputeerde staten van de provincie waarin het Natura 2000-
      gebied grotendeels is gelegen.

      4 Gedeputeerde staten nemen op grond van het derde lid geen besluiten dan in overeenstemming met gedeputeerde
      staten van de provincies waarin het Natura 2000-gebied mede is gelegen.

      5 Ingeval een Natura 2000-gebied is gelegen in meer dan één provincie, wordt het besluit,
      bedoeld in [artikel 2.5, eerste lid][ref7], niet genomen en worden de bevoegdheden, bedoeld in
      [artikel 2.6, eerste en tweede lid][ref8], niet uitgeoefend dan in overeenstemming met gedeputeerde staten van de
      provincie waarin het Natura 2000-gebied mede is gelegen.


