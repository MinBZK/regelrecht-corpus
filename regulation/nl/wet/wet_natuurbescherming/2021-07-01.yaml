  - number: '7.6'
    text: |-
      1 In dit artikel wordt onder overtreding verstaan: gedraging met betrekking tot de administratie, de verstrekking
      van gegevens of het merken van dieren, planten, eieren, hout of houtproducten die in strijd is met het bepaalde bij
      of krachtens [artikel 3.37][ref1], [3.38][ref2] of [4.8][ref3], in bij algemene maatregel van bestuur aangewezen
      gevallen.

      2 Onze Minister kan een overtreder een bestuurlijke boete opleggen.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete die voor een
      overtreding of voor categorieën van overtredingen ten hoogste kan worden opgelegd.

      4 De op grond van het derde lid te bepalen bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor
      de eerste categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref4], per overtreding
      begaan door een natuurlijke persoon, en ten hoogste het bedrag dat is bepaald voor de tweede categorie, bedoeld
      in artikel 23, vierde lid, van het Wetboek van Strafrecht per overtreding, per overtreding begaan door een
      rechtspersoon of een vennootschap.

      5 Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt
      zij aan het openbaar ministerie voorgelegd.

      6 Voor overtredingen als bedoeld in het eerste lid kan geen bestuurlijke strafbeschikking worden opgelegd krachtens
      [artikel 257ba van het Wetboek van Strafvordering][ref5].


