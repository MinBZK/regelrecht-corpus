  - number: '1.8'
    text: |-
      1 Onze Minister ziet toe op de staat van instandhouding van de natuurlijke habitats, de habitats van soorten en de
      dier- en plantensoorten, genoemd in onderscheidenlijk de bijlagen I, II, IV en V bij de Habitatrichtlijn, en van de
      vogelsoorten, genoemd in bijlage I bij de Vogelrichtlijn, en de niet in die bijlage genoemde geregeld voorkomende
      trekvogelsoorten.

      2 Onze Minister bevordert het onderzoek en wetenschappelijk werk, bedoeld in artikel 10, eerste lid, van de
      Vogelrichtlijn en artikel 18, eerste lid, van de Habitatrichtlijn.

      3 Onze Minister draagt zorg voor de verstrekking van gegevens aan de Europese Commissie overeenkomstig de vereisten
      van de Vogelrichtlijn en de Habitatrichtlijn. Voor zover het gaat om gegevens die betrekking hebben op door
      gedeputeerde staten of provinciale staten genomen besluiten of getroffen maatregelen, of om gegevens die betrekking
      hebben op de staat van instandhouding van de in het eerste lid bedoelde habitats en soorten in hun provincie,
      verstrekken gedeputeerde staten van de desbetreffende provincie deze aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.8
  - number: '1.9'
    text: |-
      1 Het Planbureau voor de Leefomgeving brengt eenmaal in de vier jaar aan Onze Minister een wetenschappelijk rapport
      uit, waarin de toestand en de verwachte ontwikkelingen ten aanzien van natuur, bos en landschap worden beschreven.

      2 Het Planbureau voor de Leefomgeving brengt eenmaal in de twee jaar aan Onze Minister een wetenschappelijk
      rapport uit, waarin ten aanzien van natuur, bos en landschap, mede in het licht van in eerdere rapporten
      beschreven ontwikkelingen, de stand van zaken in de beleidsuitvoering, de voortgang en nieuwe ontwikkelingen worden
      beschreven.

      3 Onze Minister kan voor de toepassing van het eerste en tweede lid aanwijzingen geven ten aanzien van de termijn
      waarvoor de ontwikkelingen moeten worden beschreven en ten aanzien van veronderstelde ontwikkelingen die in elk
      geval moeten worden beschreven.

      4 Onze Minister tezamen met Onze Minister van Infrastructuur en Milieu, ieder voor zover het hem aangaat, wijst
      overheidsinstellingen aan die door het Planbureau voor de Leefomgeving in elk geval worden betrokken bij de op te
      stellen rapporten. Deze instellingen verschaffen elkaar de voor het opstellen van de rapporten benodigde gegevens.

      5 Onze Minister doet de rapporten, bedoeld in het eerste en tweede lid, toekomen aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.9
  - number: '1.10'
    text: |-
      1 Deze wet is gericht op:

      a. het beschermen en ontwikkelen van de natuur, mede vanwege de intrinsieke waarde, en het behouden en herstellen
      van de biologische diversiteit;

      b. het doelmatig beheren, gebruiken en ontwikkelen van de natuur ter vervulling van maatschappelijke functies, en

      c. het verzekeren van een samenhangend beleid gericht op het behoud en beheer van waardevolle landschappen,
      vanwege hun bijdrage aan de biologische diversiteit en hun cultuurhistorische betekenis, mede ter vervulling van
      maatschappelijke functies.

      2 Een bestuursorgaan oefent zijn taken en bevoegdheden op grond van deze wet uit met het oog op de doelen, genoemd
      in het eerste lid, zoals nader bepaald bij of krachtens deze wet.

      3 Elk bestuursorgaan houdt bij het treffen van maatregelen op grond van deze wet rekening met de vereisten
      op economisch, sociaal en cultureel gebied, en met de regionale en lokale bijzonderheden, onverminderd de
      [artikelen 2.1, eerste lid][ref1], [2.8][ref2], met uitzondering van het negende lid, [3.3, vierde lid][ref3],
      en [3.8, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3.3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3.8
