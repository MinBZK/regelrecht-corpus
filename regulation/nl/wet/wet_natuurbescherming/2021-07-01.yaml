      1 Beheerplannen als bedoeld in [artikel 19a, eerste lid][ref1], of
      [19b, eerste lid, van de Natuurbeschermingswet 1998][ref2], gelden voor het tijdvak waarvoor zij zijn vastgesteld
      als beheerplannen als bedoeld in [artikel 2.3, eerste lid, eerste volzin][ref3].

      2 Op een beheerplan dat onderdeel uitmaakt van een plan dat is gericht op het beheer van een gebied als bedoeld
      in [artikel 19b, tweede lid, van de Natuurbeschermingswet 1998][ref4], is [artikel 2.3, vijfde lid][ref5], van
      overeenkomstige toepassing.

      3

      4 Het eerste beheerplan voor een Natura 2000-gebied na aanwijzing van dat gebied op grond van
      [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref6], wordt uiterlijk drie jaar na dat besluit tot
      aanwijzing vastgesteld.

      5 Beschrijvingen opgenomen in beheerplannen als bedoeld in [artikel 19a][ref7] of
      [19b van de Natuurbeschermingswet 1998][ref8] die onmiddellijk voor het tijdstip van inwerkingtreding van deze
      wet van kracht zijn, die betrekking hebben op andere doelstellingen dan die ten aanzien van de leefgebieden voor
      vogelsoorten, nodig ter uitvoering van de Vogelrichtlijn, of dan die ten aanzien van de natuurlijke habitats en de
      habitats van soorten, nodig ter uitvoering van de Habitatrichtlijn, vervallen.

      6 Het bestuursorgaan dat bevoegd is tot het vaststellen van een beheerplan kan de tekst van een op grond van
      [artikel 19a][ref9] of [19b van de Natuurbeschermingswet 1998][ref10] vastgesteld beheerplan opnieuw vaststellen
      onder weglating van de beschrijvingen die op grond van het vijfde lid zijn vervallen. Tegen het besluit tot het
      opnieuw vaststellen van de tekst kan geen beroep worden ingesteld.


