    text: |-
      1 Op een aanvraag om een bij of krachtens deze wet vereiste vergunning of ontheffing wordt binnen dertien weken na
      de datum van ontvangst beslist.

      2 Het bevoegd gezag kan de termijn eenmaal met zeven weken verlengen. Van deze verlenging wordt mededeling gedaan
      aan de aanvrager.

      3 Ingeval [artikel 2.8, vierde lid][ref1], van toepassing is, wordt de aanvrager van de vergunning door het
      bevoegd gezag tijdig tevoren in de gelegenheid gesteld om voorstellen voor compenserende maatregelen te doen.
      [Artikel 4.15 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


