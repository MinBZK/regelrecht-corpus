      1 Gedeputeerde staten zijn bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van het
      bepaalde bij of krachtens deze wet.

      2 Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang in plaats van gedeputeerde staten ter
      handhaving van het bepaalde bij of krachtens:

      a. de [artikelen 1.11, eerste lid][ref1], [2.4, vierde lid][ref2], [2.7, tweede lid][ref3],
      [3.1, eerste, tweede, derde of vierde lid][ref4], [3.2, zesde lid][ref5], [3.4, eerste lid][ref6], [3.5][ref7],
      [3.6, tweede lid][ref8], [3.9, eerste lid][ref9], [3.10, eerste lid][ref10], [3.15, tweede of vierde lid][ref11],
      [3.16, tweede of vierde lid][ref12], [3.18, eerste lid, of vierde lid, in samenhang met het eerste lid][ref13],
      [3.32, eerste lid][ref14], [3.34, eerste of vijfde lid][ref15], [4.2, eerste, derde of vierde lid][ref16],
      [4.3, eerste, tweede of vijfde lid][ref17], of [5.3, vierde lid][ref18], voor zover de last betrekking heeft op
      handelingen of projecten van categorieën, aangewezen krachtens [artikel 1.3, vijfde lid][ref19] of op handelingen
      en projecten die plaatsvinden in of gevolgen hebben voor gebieden, behorende tot krachtens dat artikellid
      aangewezen categorieën;

      b. [artikel 2.5][ref20], ingeval [artikel 2.10, eerste lid, aanhef en onderdeel b][ref21], van toepassing is;

      c. de [artikelen 3.2, eerste lid][ref22], [3.6, eerste lid][ref23], [3.7, eerste lid][ref24],
      [3.24, eerste, tweede, vierde of vijfde lid][ref25], [3.26][ref26], [3.27][ref27],
      [3.30, eerste, tweede, derde of vijfde lid][ref28], [3.35][ref29], [3.37][ref30], [3.38][ref31], [3.39][ref32],
      [4.8][ref33], of [7.4, eerste en vierde lid][ref34];

      d. [artikel 3.34, eerste of vierde lid][ref35], voor zover de last betrekking heeft op het uitzetten, planten of
      zaaien van exoten.


