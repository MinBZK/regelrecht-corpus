  - number: '9.10'
    text: |-
      1 De op het tijdstip van inwerkingtreding van deze wet aanhangige procedures tot het nemen van een besluit
      krachtens de [Natuurbeschermingswet 1998][ref1], de [Flora- en faunawet][ref2] of de [Boswet][ref3], zijn aanhangig
      in de staat waarin zij zich op dat moment bevinden en worden vanaf het tijdstip van inwerkingtreding van deze wet
      overeenkomstig het bepaalde bij en krachtens deze wet behandeld.

      2 De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaarschriften die betrekking hebben op
      het nemen van een besluit krachtens de [Natuurbeschermingswet 1998][ref4], de [Flora- en faunawet][ref5] of de
      [Boswet][ref6], zijn aanhangig in de staat waarin zij zich op dat moment bevinden en worden vanaf het tijdstip van
      inwerkingtreding van deze wet overeenkomstig het bepaalde bij en krachtens deze wet behandeld.

      3 Beroepszaken, gericht tegen besluiten krachtens de [Natuurbeschermingswet 1998][ref7], de
      [Flora- en faunawet][ref8] of de [Boswet][ref9] die zijn bekendgemaakt voor het tijdstip van inwerkingtreding van
      deze wet, worden behandeld en beslist overeenkomstig de bepalingen van die desbetreffende wetten.

      4 In zoverre in afwijking van het eerste en het tweede lid is Onze Minister bevoegd tot het nemen van een besluit
      over aanvragen van ontheffingen als bedoeld in [artikel 75, derde lid, van de Flora- en faunawet][ref10] die
      zijn ingediend voor het tijdstip van inwerkingtreding van deze wet en tot het beslissen op bezwaarschriften die
      betrekking hebben op die besluiten.


