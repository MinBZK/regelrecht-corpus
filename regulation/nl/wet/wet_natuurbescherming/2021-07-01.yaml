  - number: '2.9'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.7, tweede lid][ref1], is niet van toepassing op projecten die zijn beschreven
      in en worden gerealiseerd overeenkomstig een beheerplan als bedoeld in [artikel 2.3][ref2] of een programma
      als bedoeld in [artikel 1.13, eerste, zevende, of achtste lid][ref3], of een plan of programma als bedoeld in
      artikel 2.3, vijfde lid, indien:

      a. ten aanzien van het plan of het programma, althans het desbetreffende onderdeel, een passende beoordeling van
      projecten is uitgevoerd waaruit de zekerheid is verkregen dat het project de natuurlijke kenmerken van het Natura
      2000-gebied niet zal aantasten, en

      b. het bestuursorgaan dat het plan of het programma heeft vastgesteld tevens bevoegd is voor de verlening van een
      vergunning als bedoeld in [artikel 2.7, tweede lid][ref4], voor een dergelijk project, of, als dat niet het geval
      is, het laatstbedoelde bestuursorgaan heeft ingestemd met het onderdeel van het plan of programma dat betrekking
      heeft op het project.

      2 Het verbod, bedoeld in [artikel 2.7, tweede lid][ref5], is niet van toepassing op projecten, behorende tot door
      provinciale staten bij verordening of, indien dat in het algemeen belang geboden is, bij ministeriële regeling
      aangewezen categorieën van projecten, indien ten aanzien van het project is voldaan aan bij of krachtens die
      verordening of bij ministeriële regeling gestelde regels. Deze regels kunnen in elk geval betrekking hebben op:

      a. een drempelwaarde die door het project niet mag worden overschreden;

      b. de wijze waarop een project wordt gerealiseerd;

      c. de ligging van de locatie waar een project wordt gerealiseerd ten opzichte van een Natura 2000-gebied, een
      natuurlijke habitat of een habitat van een soort in dat gebied;

      d. de te verrichten onderzoeken naar de gevolgen van de realisatie van een projecthandeling voor de natuurlijke
      kenmerken van een Natura 2000-gebied;

      e. de voorafgaand aan of tijdens de realisatie van een project te treffen maatregelen om te voorkomen dat de
      natuurlijke kenmerken van een Natura 2000-gebied worden aangetast; en

      f. de melding van het voornemen een project te realiseren aan een bij of krachtens de verordening of ministeriële
      regeling aangewezen bestuursorgaan, de termijn waarbinnen en de wijze waarop de melding wordt gedaan, en de daarbij
      te overleggen gegevens.

      3 Op grond van het tweede lid kunnen uitsluitend categorieën van projecten als bedoeld in
      [artikel 2.7, tweede lid][ref6], worden aangewezen:

      a. ten aanzien waarvan op voorhand op grond van objectieve gegevens kan worden uitgesloten dat zij afzonderlijk of
      in combinatie met andere plannen of projecten significant negatieve gevolgen voor de natuurlijke kenmerken van een
      Natura 2000-gebied kunnen hebben;

      b. ten aanzien waarvan een passende beoordeling is gemaakt waaruit zekerheid is verkregen dat de projecten de
      natuurlijke kenmerken van een Natura 2000-gebied niet zullen aantasten; of

      c. waarvoor de afwijking van [artikel 2.7, tweede lid][ref7], met inachtneming van [artikel 2.8, vijfde lid][ref8],
      kan worden gerechtvaardigd op grond van dwingende redenen van groot openbaar belang, het ontbreken van alternatieve
      oplossingen en het treffen van compenserende maatregelen die waarborgen dat de algehele samenhang van Natura 2000
      bewaard blijft.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop wordt vastgesteld of plannen,
      projecten of andere handelingen dan projecten als bedoeld in [artikel 2.7, tweede lid][ref9], gevolgen als
      bedoeld in artikel 2.7, eerste of tweede lid, kunnen hebben. Deze regels kunnen onder meer betrekking hebben op
      rekenmodellen, onderzoeksmethoden of meetmethoden waarmee gevolgen kunnen worden bepaald.

      5 Een ministeriële regeling als bedoeld in het tweede lid wordt niet eerder vastgesteld dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.


