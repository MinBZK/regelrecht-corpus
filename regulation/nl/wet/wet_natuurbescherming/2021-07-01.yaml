  - number: '3.19'
    text: |-
      1 Onze Minister wijst soorten invasieve exoten aan die in het belang van de bescherming van de wilde flora, de
      wilde fauna of de instandhouding van natuurlijke habitats worden bestreden.

      2 Gedeputeerde staten dragen er zorg voor dat in hun provincie het aantal van de invasieve exoten, bedoeld in het
      eerste lid, zoveel mogelijk wordt teruggebracht.

      3 De aanwijzing, bedoeld in het eerste lid, vindt plaats in overeenstemming met de gedeputeerde staten, bedoeld in
      het tweede lid.

      4 Gedeputeerde staten kunnen aan personen of samenwerkingsverbanden van personen opdracht geven tot
      het terugbrengen van het aantal planten van bij de opdracht aangeduide soorten, aangewezen krachtens
      het eerste lid, of ter uitvoering van de verordening, genoemd in [artikel 3.36, onderdeel c][ref1].
      [Artikel 3.18, tweede en derde lid][ref2], is op de uitvoering van deze opdracht van overeenkomstige toepassing,
      met dien verstande dat in artikel 3.18, derde lid, in plaats van «dieren» wordt gelezen: planten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.36
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3.18
