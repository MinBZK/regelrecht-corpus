  - number: '2.2'
    text: |-
      1 Gedeputeerde staten dragen ervoor zorg dat in hun provincie instandhoudingsmaatregelen als bedoeld in de
      artikelen 3, eerste lid en tweede lid, onderdelen b, c en d, en 4, eerste lid, eerste volzin, en tweede lid, van de
      Vogelrichtlijn en artikel 6, eerste lid, van de Habitatrichtlijn worden getroffen die nodig zijn voor Natura 2000-
      gebieden, gelet op de instandhoudingsdoelstellingen voor de onderscheiden gebieden.

      2 Gedeputeerde staten dragen ervoor zorg dat in hun provincie passende maatregelen als bedoeld in artikel 6,
      tweede lid, van de Habitatrichtlijn worden getroffen die nodig zijn voor Natura 2000-gebieden, gelet op de
      instandhoudingsdoelstellingen voor de onderscheiden gebieden.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Gedeputeerde staten van de provincie waarin een op grond van [artikel 2.1][ref1] aangewezen Natura 2000-gebied
      is gelegen, stellen voor dat gebied een beheerplan vast. Op de voorbereiding van een besluit als bedoeld in de
      eerste volzin is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Zienswijzen kunnen naar
      voren worden gebracht door een ieder.

      2 Tot de inhoud van het beheerplan behoort in elk geval een beschrijving van de voor het Natura 2000-gebied, gelet
      op de instandhoudingsdoelstellingen:

      a. nodige instandhoudingsmaatregelen, bedoeld in de artikelen 3, eerste lid en tweede lid, onderdelen b, c
      en d, en 4, eerste lid, eerste volzin, en tweede lid, van de Vogelrichtlijn en artikel 6, eerste lid, van de
      Habitatrichtlijn en passende maatregelen, bedoeld in artikel 6, tweede lid, van de Habitatrichtlijn;

      b. de beoogde resultaten van de maatregelen, bedoeld in onderdeel a.

      3 De daartoe bevoegde bestuursorganen dragen zorg voor een tijdige uitvoering van de door hen te treffen, in het
      beheerplan opgenomen maatregelen, voor zover zij met het opnemen van die maatregelen hebben ingestemd.

      4 Een beheerplan wordt telkens vastgesteld voor een tijdvak van ten hoogste zes jaar. Na verloop van het tijdvak
      kan het tijdvak eenmaal met ten hoogste zes jaar worden verlengd. Het eerste beheerplan wordt vastgesteld uiterlijk
      drie jaar na dagtekening van het besluit tot aanwijzing van een gebied als Natura 2000-gebied.

      5 In afwijking van het eerste lid kan de inhoud van het beheerplan, bedoeld in het tweede lid, een afzonderlijk
      onderdeel zijn van een ander plan of programma dat geheel of mede betrekking heeft op de inrichting, het beheer
      of het gebruik van een Natura 2000-gebied. Ingeval dat plan of programma wordt vastgesteld door een ander bevoegd
      gezag, geschiedt de opname van het onderdeel houdende het beheerplan voor het Natura 2000-gebied niet dan na
      instemming van de gedeputeerde staten, bedoeld in het eerste lid. Het derde lid en het vierde lid, derde volzin,
      zijn van overeenkomstige toepassing op dat onderdeel.

      6 Gedeputeerde staten kunnen een beheerplan wijzigen gedurende het tijdvak waarvoor het is
      vastgesteld. Bij de voorbereiding van een besluit tot wijziging van ondergeschikte aard of tot
      verlenging van het tijdvak als bedoeld in het vierde lid, behoeven zij geen toepassing te geven aan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
