  - number: '4.1'
    text: |-
      Het bepaalde bij en krachtens deze paragraaf, met uitzondering van artikel 4.6, heeft geen betrekking op:

      a. houtopstanden binnen de bij besluit van de gemeenteraad vastgestelde grenzen van de bebouwde kom;

      b. houtopstanden op erven of in tuinen;

      c. fruitbomen en windschermen om boomgaarden;

      d. naaldbomen, kennelijk bedoeld om te dienen als kerstbomen, indien niet ouder dan twintig jaar;

      e. kweekgoed;

      f. uit populieren of wilgen bestaande:

      1°. wegbeplantingen;

      2°. beplantingen langs waterwegen, en

      3°. eenrijige beplantingen langs landbouwgronden;

      g. het dunnen van een houtopstand;

      h. uit populieren, wilgen, essen of elzen bestaande beplantingen die kennelijk zijn bedoeld voor de productie van
      houtige biomassa, indien zij:

      1°. ten minste eens per tien jaar worden geoogst;

      2°. bestaan uit minstens tienduizend stoven per hectare per beplantingseenheid, zijnde een aaneengesloten
      beplanting die niet wordt doorsneden door onbeplante stroken breder dan twee meter, en

      3°. zijn aangelegd na 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Het is verboden een houtopstand geheel of gedeeltelijk te vellen of te doen vellen, met uitzondering van het
      periodiek vellen van griend- of hakhout, zonder voorafgaande melding daarvan bij gedeputeerde staten.

      2 Provinciale staten kunnen bij verordening regels stellen over de melding, bedoeld in het eerste lid. Deze regels
      kunnen in elk geval betrekking hebben op:

      a. de gegevens die bij de melding worden verstrekt,

      b. de termijn waarbinnen de melding wordt gedaan, en

      c. de wijze waarop de melding wordt gedaan.

      3 Gedeputeerde staten kunnen het vellen van houtopstanden telkens voor ten hoogste vijf jaar verbieden ter
      bescherming van bijzondere natuur- of landschapswaarden.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Ingeval een houtopstand geheel of gedeeltelijk is geveld, met uitzondering van het periodiek vellen van griend-
      of hakhout, of anderszins teniet is gegaan, draagt de rechthebbende zorg voor het op bosbouwkundig verantwoorde
      wijze herbeplanten van dezelfde grond binnen drie jaar na het vellen of tenietgaan van de houtopstand.

      2 De rechthebbende vervangt binnen drie jaar na de herbeplanting, bedoeld in het eerste lid, herbeplanting die niet
      is aangeslagen.

      3 Provinciale staten kunnen bij verordening regels stellen over de bosbouwkundig verantwoorde wijze van
      herbeplanting, bedoeld in het eerste lid.

      4 De rechthebbende, bedoeld in het eerste en tweede lid, is degene die krachtens eigendom of een beperkt recht het
      genot heeft van de grond.

      5 Degene die de eigendom van grond, ten aanzien waarvan een plicht tot herbeplanting geldt op grond van het eerste
      of tweede lid, overdraagt, of een beperkt recht daarop vestigt of overdraagt, stelt de verkrijger op de hoogte van
      de plicht tot herbeplanting en neemt die plicht uitdrukkelijk op in de akte van levering.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 De [artikelen 4.2, eerste en derde lid][ref1], en [4.3, eerste en tweede lid][ref2], zijn niet van toepassing op:

      a. het vellen van houtopstanden ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als
      bedoeld in [artikel 2.2][ref3];

      b. het vellen van houtopstanden ter uitvoering van een verplichting als bedoeld in artikel 2.4, eerste of
      derde lid, een voorschrift verbonden aan een vergunning als bedoeld in [artikel 2.7, tweede lid][ref4],
      regels als bedoeld in [artikel 2.9, tweede lid][ref5], of een voorschrift verbonden aan een ontheffing
      of een vrijstelling als bedoeld in de [artikelen 3.3, eerste, onderscheidenlijk tweede lid][ref6],
      [3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref7], of [3.10, tweede lid][ref8], in samenhang met 3.8,
      eerste, onderscheidenlijk tweede lid, een besluit, vastgesteld onder toepassing van artikel 2.7, vierde lid, 3.3,
      zesde lid, 3.8, zesde lid, of 3.10, tweede lid, in samenhang met artikel 3.8, zesde lid, een wegaanpassingsbesluit,
      vastgesteld onder toepassing van [artikel 9, vijfde lid, van de Spoedwet wegverbreding][ref9], een
      tracébesluit, vastgesteld onder toepassing van [artikel 13, achtste lid, van de Tracéwet][ref10] of een
      omgevingsvergunning, vastgesteld onder toepassing van de [artikelen 2.17a][ref11], [2.17b][ref12], [2.17c][ref13]
      en [2.17d van de Wet algemene bepalingen omgevingsrecht][ref14];

      c. het vellen van houtopstanden voor de aanleg en het onderhoud van brandgangen op natuurterreinen, of

      d. het vellen van houtopstanden en herbeplanten op een wijze die is beschreven in en aantoonbaar wordt gerealiseerd
      overeenkomstig een door Onze Minister goedgekeurde gedragscode.

      2 Een gedragscode als bedoeld in het eerste lid, onderdeel d, wordt goedgekeurd, indien daarin een wijze van vellen
      en een wijze van herbeplanten is beschreven waarmee naar het oordeel van Onze Minister afdoende is gewaarborgd dat:

      a. geen afbreuk wordt gedaan aan bijzondere natuur- of landschapswaarden;

      b. de te vellen houtopstanden geen deel uitmaken van een boskern;

      c. herbeplanting op een bosbouwkundig verantwoorde wijze plaatsvindt;

      d. de grond waarop herbeplanting plaatsvindt ten minste dezelfde kwaliteit heeft als de grond waarop de gevelde
      houtopstand zich bevond, en

      e. de grond waarop de herbeplanting plaatsvindt ten minste een gelijke oppervlakte heeft als de grond waarop de
      gevelde houtopstand zich bevond.

      3 Alvorens een gedragscode als bedoeld in het eerste lid, onderdeel d, of een wijziging daarvan, goed te keuren of
      in te trekken, overlegt Onze Minister met gedeputeerde staten over zijn voornemen daartoe.


