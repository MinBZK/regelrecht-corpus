  - number: '3.22'
    text: |-
      1 Het is verboden om de jacht op wild als bedoeld in [artikel 3.20, tweede lid][ref1], uit te oefenen indien de
      jacht op de betreffende soort niet is geopend.

      2 Bij ministeriële regeling wordt bepaald in hoeverre de jacht is geopend. De opening van de jacht kan naar plaats
      of tijd worden beperkt.

      3 De jacht op wild als bedoeld in [artikel 3.20, tweede lid][ref2], van soorten, genoemd in bijlage II bij de
      Vogelrichtlijn, wordt niet geopend gedurende de verschillende fasen van de broedperiode en de periode dat de jonge
      vogels het nest nog niet hebben verlaten, en, voor zover het trekvogels betreft, tevens gedurende de trek van deze
      vogels naar hun nestplaatsen.

      4 Gedeputeerde staten kunnen de jacht voor de hele provincie, of een gedeelte daarvan, voor een bepaalde tijd
      sluiten, zolang bijzondere weersomstandigheden dat vergen.

      5 De jacht wordt niet geopend op soorten waarvan de staat van instandhouding in het geding is.

      6 Alvorens een ministeriële regeling als bedoeld in het tweede lid vast te stellen, te wijzigen of in te trekken,
      overlegt Onze Minister met gedeputeerde staten over het ontwerp daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
