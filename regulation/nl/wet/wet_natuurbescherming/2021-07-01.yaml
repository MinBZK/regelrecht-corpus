  - number: 1.12a
    text: |-
      1 Het percentage van het areaal van de voor stikstof gevoelige habitats in Natura 2000-gebieden waarop de depositie
      van stikstof niet groter is dan de hoeveelheid in mol per hectare per jaar waarboven verslechtering van de
      kwaliteit van die habitats niet op voorhand is uit te sluiten, bedraagt:

      a. in 2025: ten minste 40%;

      b. in 2030: ten minste 50%;

      c. in 2035: ten minste 74%.

      2 De in het eerste lid bedoelde omgevingswaarden zijn resultaatsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel1.12a
  - number: 1.12b
    text: |-
      1 Onze Minister stelt een programma stikstofreductie en natuurverbetering vast:

      a. voor het verminderen van de depositie van stikstof op voor stikstof gevoelige habitats in Natura 2000-gebieden
      om te voldoen aan de omgevingswaarden, bedoeld in [artikel 1.12a, eerste lid][ref1]; en

      b. voor het bereiken van de instandhoudingsdoelstellingen voor de in onderdeel a bedoelde habitats.

      Daarbij houdt Onze Minister rekening met de vereisten op economisch, sociaal en cultureel gebied en met de
      regionale en lokale bijzonderheden.

      2 In het programma worden tussentijdse doelstellingen opgenomen met het oog op:

      a. het tijdig voldoen aan de omgevingswaarden; en

      b. de in het programma opgenomen maatregelen voor het bereiken van de instandhoudingsdoelstellingen.

      3 De in het tweede lid bedoelde doelstellingen zijn inspanningsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12a
