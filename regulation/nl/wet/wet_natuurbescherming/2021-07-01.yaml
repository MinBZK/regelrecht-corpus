  - number: '2.8'
    text: |-
      1 Voor een plan als bedoeld in [artikel 2.7, eerste lid][ref1], of een project als bedoeld in artikel 2.7, tweede
      lid, maakt het bestuursorgaan, onderscheidenlijk de aanvrager van de vergunning, een passende beoordeling van de
      gevolgen voor het Natura 2000-gebied, rekening houdend met de instandhoudingsdoelstellingen voor dat gebied.

      2 In afwijking van het eerste lid hoeft geen passende beoordeling te worden gemaakt, ingeval het plan of het
      project een herhaling of voortzetting is van een ander plan, onderscheidenlijk project, of deel uitmaakt van een
      ander plan, voor zover voor dat andere plan of project een passende beoordeling is gemaakt en een nieuwe passende
      beoordeling redelijkerwijs geen nieuwe gegevens en inzichten kan opleveren over de significante gevolgen van dat
      plan of project.

      3 Het bestuursorgaan stelt het plan uitsluitend vast, en gedeputeerde staten verlenen voor het project, bedoeld in
      het eerste lid, uitsluitend een vergunning, indien uit de passende beoordeling de zekerheid is verkregen dat het
      plan, onderscheidenlijk het project de natuurlijke kenmerken van het gebied niet zal aantasten.

      4 In afwijking van het derde lid kan, ondanks het feit dat uit de passende beoordeling de vereiste zekerheid niet
      is verkregen, het plan worden vastgesteld, onderscheidenlijk de vergunning worden verleend, indien is voldaan aan
      elk van de volgende voorwaarden:

      a. er zijn geen alternatieve oplossingen;

      b. het plan, onderscheidenlijk het project, bedoeld in het eerste lid, is nodig om dwingende redenen van groot
      openbaar belang, met inbegrip van redenen van sociale of economische aard, en

      c. de nodige compenserende maatregelen worden getroffen om te waarborgen dat de algehele samenhang van Natura 2000
      bewaard blijft.

      5 Ingeval het plan, onderscheidenlijk het project, bedoeld in het eerste lid, significante gevolgen kan hebben voor
      een prioritair type natuurlijke habitat of een prioritaire soort in een Natura 2000-gebied, geldt, in afwijking van
      het vierde lid, onderdeel b, de voorwaarde dat het plan, onderscheidenlijk het project nodig is vanwege:

      a. argumenten die verband houden met de menselijke gezondheid, de openbare veiligheid of met voor het milieu
      wezenlijk gunstige effecten, of

      b. andere dwingende redenen van openbaar belang, na advies van de Europese Commissie.

      6 Een advies van de Europese Commissie als bedoeld in het vijfde lid, onderdeel b, wordt door Onze Minister
      gevraagd. Het bestuursorgaan, onderscheidenlijk gedeputeerde staten doen daartoe een verzoek aan Onze Minister.

      7 Compenserende maatregelen als bedoeld in het vierde lid, onderdeel c, maken onderdeel uit van het
      plan. De verplichting om compenserende maatregelen te treffen maakt onderdeel uit van de vergunning
      voor het project, bedoeld in het eerste lid, tenzij die verplichting volgt uit het programma, bedoeld in
      [artikel 1.13a, tweede lid][ref2]. Het bestuursorgaan dat het plan vaststelt meldt, onderscheidenlijk gedeputeerde
      staten melden de compenserende maatregelen aan Onze Minister, die de Europese Commissie van de maatregelen op de
      hoogte stelt.

      8 Ingeval een compenserende maatregel voorziet in de ontwikkeling of verbetering van leefgebieden voor vogels,
      natuurlijke habitats of habitats voor soorten buiten een Natura 2000-gebied, draagt Onze Minister ervoor zorg dat
      deze leefgebieden of habitats een Natura 2000-gebied, of een onderdeel van een Natura 2000-gebied worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.13a
