      1 Tegen een beschikking van de korpschef als bedoeld in [artikel 3.28][ref1] of [5.4, vierde lid][ref2],
      staat, ingeval de jachtakte is geweigerd of ingetrokken of mede is geweigerd of ingetrokken om redenen als
      bedoeld in artikel 3.28, derde lid, onderdeel a, of 5.4, vierde lid, onderdeel c, of omdat niet is voldaan
      aan [artikel 3.28a, eerste of derde lid][ref3], administratief beroep open bij Onze Minister van Veiligheid en
      Justitie.

      2 Een beroep tegen een besluit tot vaststelling van een beheerplan als bedoeld in [artikel 2.3, eerste lid][ref4],
      of van een programma als bedoeld in [artikel 1.13][ref5] heeft uitsluitend betrekking op de
      beschrijvingen van projecten als bedoeld in [artikel 2.9, eerste lid][ref6], handelingen als bedoeld in
      [artikel 3.3, zevende lid, onderdeel b][ref7], [artikel 3.8, zevende lid, onderdeel b][ref8], al dan niet in
      samenhang met [artikel 3.10, tweede lid][ref9].


