  - number: '6.3'
    text: |-
      1 Het bevoegd gezag kent degene die in de vorm van een inkomensderving of een vermindering van de waarde van een
      onroerende zaak schade lijdt of zal lijden als gevolg van een krachtens deze wet door hem genomen, of door hem
      geacht te zijn genomen besluit, met uitzondering van een besluit als bedoeld in [artikel 2.1, eerste lid][ref1],
      op aanvraag een tegemoetkoming toe, voor zover de schade redelijkerwijs niet voor rekening van de aanvrager behoort
      te blijven en voor zover de tegemoetkoming niet voldoende anderszins is verzekerd.

      2 Een aanvraag wordt ingediend binnen vijf jaar na het moment waarop de oorzaak, bedoeld in het eerste lid,
      onherroepelijk is geworden.

      3 Het bevoegd gezag kan een schadebeoordelingscommissie instellen, en kan over de aanvraag het advies van deze
      schadebeoordelingscommissie inwinnen.

      4 Bij de beslissing op de aanvraag betrekt het bevoegd gezag in elk geval:

      a. de voorzienbaarheid van de schadeoorzaak;

      b. de mogelijkheden van de aanvrager om de schade te voorkomen of te beperken.

      5 Binnen het normale maatschappelijke risico vallende schade blijft voor rekening van de aanvrager.

      6 Indien het bevoegd gezag een tegemoetkoming toekent, vergoedt het bevoegd gezag daarbij ook:

      a. de redelijkerwijs gemaakte kosten van door een derde beroepsmatig verleende rechtsbijstand en andere deskundige
      bijstand;

      b. de wettelijke rente, te rekenen met ingang van de datum van ontvangst van de aanvraag.

      7 De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de indiening en motivering van een aanvraag voor tegemoetkoming in de schade;

      b. de procedure voor de behandeling van een aanvraag voor een tegemoetkoming in de schade;

      c. de beoordeling van een aanvraag voor een tegemoetkoming in de schade;

      d. de samenstelling van een door één van Onze Ministers in te stellen schadebeoordelingscommissie.

      9 Bij de maatregel, bedoeld in het achtste lid, kunnen provinciale staten worden verplicht om over de onderwerpen,
      bedoeld in het achtste lid, bij verordening regels vast te stellen.

      10 Het bevoegd gezag beslist binnen dertien weken na ontvangst van de aanvraag of, indien omtrent een verzoek om
      schadevergoeding advies krachtens het vierde lid is ingewonnen, binnen negen weken na ontvangst van het advies.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
