  - number: '5.6'
    text: |-
      1 Een plan dat betrekking heeft op een gebied, zijnde een bestaand of te ontwikkelen stedelijk gebied of
      bedrijventerrein, en dat is gericht op een optimalisering van de milieugebruiksruimte met het oog op een
      duurzame ruimtelijke en economische benutting of ontwikkeling van dat gebied in samenhang met het behoud of
      de totstandbrenging van een goede milieukwaliteit, kan de voorwaarden, voorschriften en beperkingen bevatten
      waaronder een vergunning als bedoeld in [artikel 2.7, tweede lid][ref1], wordt verleend, indien op grond van een
      voor dat plan opgestelde passende beoordeling de zekerheid is verkregen dat projecten die aan deze voorwaarden,
      voorschriften en beperkingen voldoen, voldoen aan artikel 2.8, derde lid, dan wel het vierde, vijfde, zesde en
      zevende lid.

      2 Het bestuursorgaan dat bevoegd is voor de verlening van vergunningen als bedoeld in
      [artikel 2.7, tweede lid][ref2], voor projecten in een gebied als bedoeld in het eerste lid, kan voorafgaand
      aan de vaststelling van een daarop betrekking hebbend plan instemming verlenen aan de in het eerste lid genoemde
      voorwaarden, voorschriften en beperkingen.

      3 Een vergunning als bedoeld in [artikel 2.7, tweede lid][ref3], wordt verleend, indien:

      a. het project voldoet aan de voorwaarden, opgenomen in een plan als bedoeld in het eerste lid;

      b. de beoordelingen, genoemd in het eerste lid, op het moment van de verlening van de vergunning actueel zijn, en

      c. het bestuursorgaan dat bevoegd is voor de verlening van de vergunning instemt, of voorafgaand aan de
      vaststelling van het in het eerste lid genoemde plan heeft ingestemd met de in het eerste lid genoemde voorwaarden,
      voorschriften en beperkingen.

      4 Aan een vergunning als bedoeld in het derde lid worden de in het plan op grond van het eerste lid opgenomen
      voorschriften verbonden. Zij wordt onder de in het plan op grond van het eerste lid opgenomen beperkingen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
