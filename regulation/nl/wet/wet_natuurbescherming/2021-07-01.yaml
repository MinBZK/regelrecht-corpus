  - number: '3.5'
    text: |-
      1 Het is verboden in het wild levende dieren van soorten, genoemd in bijlage IV, onderdeel a, bij de
      Habitatrichtlijn, bijlage II bij het Verdrag van Bern of bijlage I bij het Verdrag van Bonn, met uitzondering van
      de soorten, bedoeld in artikel 1 van de Vogelrichtlijn, in hun natuurlijk verspreidingsgebied opzettelijk te doden
      of te vangen.

      2 Het is verboden dieren als bedoeld in het eerste lid opzettelijk te verstoren.

      3 Het is verboden eieren van dieren als bedoeld in het eerste lid in de natuur opzettelijk te vernielen of te
      rapen.

      4 Het is verboden de voortplantingsplaatsen of rustplaatsen van dieren als bedoeld in het eerste lid te beschadigen
      of te vernielen.

      5 Het is verboden planten van soorten, genoemd in bijlage IV, onderdeel b, bij de Habitatrichtlijn of bijlage I
      bij het Verdrag van Bern, in hun natuurlijke verspreidingsgebied opzettelijk te plukken en te verzamelen, af te
      snijden, te ontwortelen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Het is verboden dieren of planten van soorten, genoemd in bijlage IV bij de Habitatrichtlijn, bijlage I of II bij
      het Verdrag van Bern of bijlage I bij het Verdrag van Bonn, met uitzondering van de soorten, bedoeld in artikel 1
      van de Vogelrichtlijn, onder zich te hebben voor verkoop, te vervoeren voor verkoop, te verhandelen, te ruilen of
      te koop of te ruil aan te bieden.

      2 Het is verboden, anders dan voor verkoop, dieren of planten als bedoeld in het eerste lid onder zich te hebben of
      te vervoeren.

      3 De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing ingeval de in dat lid bedoelde dieren
      en planten aantoonbaar zijn gefokt of gekweekt.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het aan de natuur onttrekken en de
      exploitatie van daarbij aangewezen dieren of planten van soorten, genoemd in bijlage V bij de Habitatrichtlijn of
      bijlage III bij het Verdrag van Bern, met uitzondering van de soorten, bedoeld in artikel 1 van de Vogelrichtlijn,
      indien dat nodig is voor het behoud of het bereiken van een gunstige staat van instandhouding van die soorten.

      2 De regels, bedoeld in het eerste lid, kunnen:

      a. in elk geval betrekking hebben op:

      1°. het beperken of verbieden van de toegang tot bepaalde terreinen;

      2°. het in een bepaald gebied beperken of verbieden van de onttrekking aan de natuur of exploitatie van dieren
      of planten;

      3°. de wijze van onttrekking van dieren of planten aan de natuur;

      4°. het beperken van het aantal dieren of planten dat ten hoogste aan de natuur mag worden onttrokken;

      5°. het kopen, het verkopen, het te koop aanbieden, het onder zich hebben en het vervoeren voor verkoop van dieren
      of planten;

      6°. het in gevangenschap fokken van dieren, of

      7°. de kunstmatige vermeerdering van plantensoorten, of

      b. in elk geval behelzen een verbod om:

      1°. zonder vergunning dieren of planten aan de natuur te onttrekken, of

      2°. in een bepaalde periode dieren of planten aan de natuur te onttrekken.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan, na overleg met provinciale staten van de
      provincies, worden bepaald dat provinciale staten regels als bedoeld in dat lid vaststellen of vrijstelling van
      die regels kunnen verlenen, of dat gedeputeerde staten met de verlening van ontheffing van die regels of met de
      uitvoering van die regels zijn belast.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Gedeputeerde staten kunnen ontheffing verlenen van een of meer van de verboden, bedoeld in de
      [artikelen 3.5][ref1] en [3.6, tweede lid][ref2], ten aanzien van dieren of planten van daarbij aangewezen soorten,
      dan wel ten aanzien van de voortplantingsplaatsen, rustplaatsen of eieren van dieren van daarbij aangewezen
      soorten.

      2 Provinciale staten kunnen bij verordening vrijstelling verlenen van een of meer van de verboden, bedoeld in de
      [artikelen 3.5][ref3] en [3.6, tweede lid][ref4], ten aanzien van dieren of planten van daarbij aangewezen soorten,
      dan wel ten aanzien van de voortplantingsplaatsen, rustplaatsen of eieren van dieren van daarbij aangewezen
      soorten.

      3 Onze Minister kan ontheffing of vrijstelling verlenen van een of meer van de verboden, bedoeld in
      [artikel 3.6, eerste lid][ref5], of van regels gesteld krachtens [artikel 3.7][ref6], ten aanzien van dieren of
      planten van daarbij aangewezen soorten, dan wel ten aanzien van de voortplantingsplaatsen, rustplaatsen of eieren
      van dieren van daarbij aangewezen soorten.

      4 Bij de algemene maatregel van bestuur, bedoeld in [artikel 3.7, eerste lid][ref7], kan worden bepaald dat
      gedeputeerde staten ontheffing kunnen verlenen, of dat provinciale staten bij verordening vrijstelling kunnen
      verlenen, van bij de maatregel aangewezen regels.

      5 Een ontheffing of een vrijstelling wordt uitsluitend verleend, indien is voldaan aan elk van de volgende
      voorwaarden:

      a. er bestaat geen andere bevredigende oplossing;

      b. zij is nodig:

      1°. in het belang van de bescherming van de wilde flora of fauna, of in het belang van de instandhouding van de
      natuurlijke habitats;

      2°. ter voorkoming van ernstige schade aan met name de gewassen, veehouderijen, bossen, visgronden, wateren of
      andere vormen van eigendom;

      3°. in het belang van de volksgezondheid, de openbare veiligheid of andere dwingende redenen van groot openbaar
      belang, met inbegrip van redenen van sociale of economische aard en met inbegrip van voor het milieu wezenlijke
      gunstige effecten;

      4°. voor onderzoek en onderwijs, repopulatie of herintroductie van deze soorten, of voor de daartoe benodigde
      kweek, met inbegrip van de kunstmatige vermeerdering van planten, of

      5°. om het onder strikt gecontroleerde omstandigheden mogelijk te maken op selectieve wijze en binnen bepaalde
      grenzen een beperkt, bij de ontheffing of vrijstelling vastgesteld aantal van bepaalde dieren van de aangewezen
      soort te vangen of onder zich te hebben, onderscheidenlijk een beperkt bij de ontheffing of vrijstelling
      vastgesteld aantal van bepaalde planten van de aangewezen soort te plukken of onder zich te hebben;

      c. er wordt geen afbreuk gedaan aan het streven de populaties van de betrokken soort in hun natuurlijke
      verspreidingsgebied in een gunstige staat van instandhouding te laten voortbestaan.

      6 De verboden, bedoeld in de [artikelen 3.5][ref8] en [3.6][ref9] zijn niet van toepassing op handelingen ten
      aanzien waarvan bij of krachtens enige wettelijke bepaling een besluit is vereist, indien bij of krachtens die wet
      is bepaald dat het desbetreffende besluit de handelingen uitsluitend toelaat indien is voldaan aan de voorwaarden,
      bedoeld in het vijfde lid.

      7 De verboden, bedoeld in de [artikelen 3.5][ref10] en [3.6, tweede lid][ref11], zijn niet van toepassing op:

      a. handelingen ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als bedoeld in
      [artikel 2.2][ref12], en

      b. handelingen die zijn beschreven in en worden verricht overeenkomstig een beheerplan als bedoeld in
      [artikel 2.3, eerste lid][ref13], een plan of een programma als bedoeld in artikel 2.3, vijfde lid, of een
      programma als bedoeld in [artikel 1.13, eerste, zevende of achtste lid][ref14], indien:

      1°. ten aanzien van het beheerplan, het plan of het programma, althans het onderdeel dat betrekking heeft op
      de desbetreffende handelingen, is voldaan aan het in het vijfde lid bepaalde ten aanzien van ontheffingen en
      vrijstellingen, en

      2°. het bestuursorgaan dat het beheerplan, het plan of het programma heeft vastgesteld tevens bevoegd is voor
      de verlening van een ontheffing, onderscheidenlijk vrijstelling als bedoeld in het eerste, onderscheidenlijk
      tweede lid voor dergelijke handelingen, of, als dat niet het geval is, het beheerplan, het plan of het programma
      is vastgesteld in overeenstemming met het bestuursorgaan dat bevoegd is voor de verlening van de ontheffing,
      onderscheidenlijk vrijstelling.


