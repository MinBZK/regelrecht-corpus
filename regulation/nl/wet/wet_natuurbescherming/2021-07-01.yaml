  - number: '9.1'
    text: |-
      1 Besluiten tot aanwijzing van gebieden als bedoeld in
      [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref1], gelden als besluiten als bedoeld in
      [artikel 2.1, eerste lid][ref2].

      2 Doelstellingen in een besluit als bedoeld in [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref3]
      opgenomen instandhoudingsdoelstelling die betrekking hebben op andere doelstellingen dan die ten aanzien van
      de leefgebieden voor vogelsoorten, nodig ter uitvoering van de Vogelrichtlijn, of dan die ten aanzien van de
      natuurlijke habitats en de habitats van soorten, nodig ter uitvoering van de Habitatrichtlijn, vervallen.

      3 Onze Minister kan de tekst van een besluit als bedoeld in het tweede lid opnieuw vaststellen onder weglating van
      de doelstellingen die op grond van het tweede lid zijn vervallen. Tegen het besluit tot het opnieuw vaststellen van
      de tekst kan geen beroep worden ingesteld.

      4 Besluiten tot voorlopige aanwijzing van gebieden als bedoeld in
      [artikel 12, derde lid in samenhang met het eerste lid, van de Natuurbeschermingswet 1998][ref4], gelden als
      besluiten als bedoeld in [artikel 2.11][ref5].


