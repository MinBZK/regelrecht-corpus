  - number: '3.1'
    text: |-
      1 Het is verboden opzettelijk van nature in Nederland in het wild levende vogels van soorten als bedoeld in
      artikel 1 van de Vogelrichtlijn te doden of te vangen.

      2 Het is verboden opzettelijk nesten, rustplaatsen en eieren van vogels als bedoeld in het eerste lid te vernielen
      of te beschadigen, of nesten van vogels weg te nemen.

      3 Het is verboden eieren van vogels als bedoeld in het eerste lid te rapen en deze onder zich te hebben.

      4 Het is verboden vogels als bedoeld in het eerste lid opzettelijk te storen.

      5 Het verbod, bedoeld in het vierde lid, is niet van toepassing indien de storing niet van wezenlijke invloed is op
      de staat van instandhouding van de desbetreffende vogelsoort.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Het is verboden vogels van soorten als bedoeld in artikel 1 van de Vogelrichtlijn dood of levend, of gemakkelijk
      herkenbare delen daarvan, of uit deze vogels verkregen producten te verkopen, te vervoeren voor verkoop, onder zich
      te hebben voor verkoop of ten verkoop aan te bieden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van vogels van soorten, genoemd in
      bijlage III, deel A, bij de Vogelrichtlijn, die aantoonbaar overeenkomstig het bepaalde bij of krachtens deze wet
      zijn gedood of gevangen, onderscheidenlijk verkregen, en ten aanzien van delen of producten van die vogels.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van bij algemene maatregel van
      bestuur aangewezen vogels van soorten, genoemd in bijlage III, deel B, bij de Vogelrichtlijn, die aantoonbaar
      overeenkomstig het bepaalde bij of krachtens deze wet zijn gedood of gevangen, onderscheidenlijk verkregen, en ten
      aanzien van delen of producten van die vogels.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de verkoop, het vervoer voor
      verkoop, het onder zich hebben voor verkoop of het ten verkoop aanbieden van vogels van soorten, aangewezen op
      grond van het derde lid, en delen of producten van die vogels.

      5 Een vogelsoort wordt op grond van het derde lid uitsluitend aangewezen, indien de handelingen, bedoeld in
      het eerste lid, uitgevoerd overeenkomstig regels als bedoeld in het vierde lid, er niet toe leiden dat het
      populatieniveau, de geografische verspreiding of de omvang van de voortplanting van deze soort in gevaar wordt
      gebracht of kan worden gebracht.

      6 Het is verboden, anders dan voor verkoop, vogels, delen of producten als bedoeld in het eerste lid, onder zich
      te hebben of te vervoeren, tenzij deze vogels, delen of producten aantoonbaar overeenkomstig het bepaalde bij of
      krachtens deze wet zijn gedood of gevangen, onderscheidenlijk verkregen.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 Gedeputeerde staten kunnen ontheffing verlenen van verboden als bedoeld in [artikel 3.1][ref1] of
      [artikel 3.2, zesde lid][ref2], ten aanzien van vogels van daarbij aangewezen soorten, dan wel ten aanzien van hun
      nesten, rustplaatsen of eieren.

      2 Provinciale staten kunnen bij verordening vrijstelling verlenen van verboden als bedoeld in [artikel 3.1][ref3]
      of [artikel 3.2, zesde lid][ref4], ten aanzien van vogels van daarbij aangewezen soorten, dan wel ten aanzien van
      hun nesten, rustplaatsen of eieren.

      3 Onze Minister kan ontheffing of vrijstelling verlenen van:

      a. de verboden, bedoeld in [artikel 3.2, eerste lid][ref5], ten aanzien van vogels, dood of levend, of gemakkelijk
      herkenbare delen daarvan, of ten aanzien van uit deze vogels verkregen producten van daarbij aangewezen soorten, of

      b. regels, gesteld krachtens [artikel 3.2, vierde lid][ref6].

      4 Een ontheffing of een vrijstelling wordt uitsluitend verleend, indien is voldaan aan elk van de volgende
      voorwaarden:

      a. er bestaat geen andere bevredigende oplossing;

      b. zij is nodig:

      1°. in het belang van de volksgezondheid of de openbare veiligheid;

      2°. in het belang van de veiligheid van het luchtverkeer;

      3°. ter voorkoming van belangrijke schade aan gewassen, vee, bossen, visserij of wateren;

      4°. ter bescherming van flora of fauna;

      5°. voor onderzoek of onderwijs, het uitzetten of herinvoeren van soorten, of voor de daarmee samenhangende teelt,
      of

      6°. om het vangen, het onder zich hebben of elke andere wijze van verstandig gebruik van bepaalde vogels in kleine
      hoeveelheden selectief en onder strikt gecontroleerde omstandigheden toe te staan;

      c. de maatregelen leiden niet tot verslechtering van de staat van instandhouding van de desbetreffende soort.

      5 In een ontheffing, onderscheidenlijk vrijstelling worden in elk geval voorschriften opgenomen, onderscheidenlijk
      regels gesteld, over:

      a. de middelen, installaties of methoden voor het vangen of doden, waarbij enkel het gebruik wordt toegestaan van
      bij algemene maatregel van bestuur aangewezen middelen, installaties of methoden;

      b. de tijd en plaats waarvoor de ontheffing of vrijstelling geldt, en

      c. de wijze waarop het risico voor het behoud van de vogelstand wordt beperkt.

      6 De verboden, bedoeld in de [artikelen 3.1][ref7] en [3.2, zesde lid][ref8], zijn niet van toepassing op
      handelingen ten aanzien waarvan bij of krachtens enige wettelijke bepaling een besluit is vereist, indien bij of
      krachtens die wet is bepaald dat het desbetreffende besluit de handelingen uitsluitend toelaat indien is voldaan
      aan de voorwaarden, bedoeld in het vierde lid, en dat aan het besluit de voorschriften worden verbonden, bedoeld in
      het vijfde lid.

      7 De verboden, bedoeld in de [artikelen 3.1][ref9] en [3.2, zesde lid][ref10], zijn niet van toepassing op:

      a. handelingen ter uitvoering van een instandhoudingsmaatregel of een passende maatregel als bedoeld in
      [artikel 2.2][ref11], en

      b. handelingen die zijn beschreven in en worden verricht overeenkomstig een beheerplan als bedoeld in
      [artikel 2.3, eerste lid][ref12], een plan of een programma als bedoeld in artikel 2.3, vijfde lid, of een
      programma als bedoeld in [artikel 1.13, eerste, zevende, of achtste lid][ref13], indien:

      1°. ten aanzien van het beheerplan, het plan of het programma, althans het onderdeel dat betrekking heeft op de
      desbetreffende handelingen, is voldaan aan het in het vierde en vijfde lid bepaalde ten aanzien van ontheffingen en
      vrijstellingen, en

      2°. het bestuursorgaan dat het beheerplan, het plan of het programma heeft vastgesteld tevens bevoegd is voor
      de verlening van een ontheffing, onderscheidenlijk vrijstelling als bedoeld in het eerste, onderscheidenlijk
      tweede lid voor dergelijke handelingen, of, als dat niet het geval is, het beheerplan, het plan of het programma
      is vastgesteld in overeenstemming met het bestuursorgaan dat bevoegd is voor de verlening van de ontheffing,
      onderscheidenlijk vrijstelling.


