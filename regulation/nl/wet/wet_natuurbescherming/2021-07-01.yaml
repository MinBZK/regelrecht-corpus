      1 Bij of krachtens algemene maatregel van bestuur kan ter uitvoering van het bepaalde bij of krachtens
      [hoofdstuk 3][ref1] medewerking worden gevorderd van het bestuur van een productschap of een bedrijfschap als
      bedoeld in artikel 66 van de Wet op de bedrijfsorganisatie.

      2 Bij of krachtens algemene maatregel van bestuur als bedoeld in het eerste lid kunnen de ingevolge het bepaalde
      bij of krachtens deze wet aan Onze Minister toekomende bevoegdheden tot het nemen van besluiten en tot het
      vaststellen van regels of nadere regels, alsmede aan Onze Minister opgedragen taken worden overgedragen.

      3 Indien de in het eerste lid bedoelde medewerking bestaat uit het stellen van regelen of nadere regelen bij
      verordening, behoeft zodanige verordening de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
