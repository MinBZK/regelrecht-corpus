  - number: '4.5'
    text: |-
      1 Gedeputeerde staten kunnen ontheffing verlenen van [artikel 4.3, eerste en tweede lid][ref1], ten behoeve van
      herbeplanting op andere grond, indien de herbeplanting voldoet aan bij provinciale verordening gestelde regels.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de kwaliteit, oppervlakte en locatie
      van de andere grond en de natuurwaarde van de gevelde houtopstand.

      3 Onverminderd het eerste lid, kunnen gedeputeerde staten van [artikel 4.2, eerste lid][ref2], of
      [artikel 4.3, eerste, tweede of vijfde lid][ref3], ontheffing verlenen.

      4 Provinciale staten kunnen bij verordening geheel of gedeeltelijk vrijstelling verlenen van
      [artikel 4.2, eerste lid][ref4], of [artikel 4.3, eerste, tweede of vijfde lid][ref5].


