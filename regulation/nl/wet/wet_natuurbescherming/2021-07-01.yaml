  - number: 1.12ga
    text: |-
      Als bij de beoordeling, bedoeld in [artikel 1.12f, derde lid][ref1], blijkt dat ondanks alle maatregelen die
      al zijn getroffen een instandhoudingsdoelstelling voor een voor stikstof gevoelige habitat in een Natura 2000-
      gebied niet kan worden bereikt of alleen met een onevenredige inspanning kan worden bereikt als gevolg van
      stikstofdepositie die wordt veroorzaakt door bronnen in andere lidstaten van de Europese Unie, overlegt Onze
      Minister met de lidstaten waaruit de stikstof overwegend afkomstig is, over maatregelen in die lidstaten om
      de emissie te verminderen. Als die vermindering redelijkerwijs niet mogelijk is, overlegt Onze Minister met de
      Europese Commissie over de toepassing van de Vogelrichtlijn en de Habitatrichtlijn voor dit Natura 2000-gebied en
      de betrokken habitat.


