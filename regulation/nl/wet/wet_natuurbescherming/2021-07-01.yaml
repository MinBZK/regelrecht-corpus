      1 Het bestuursorgaan dat daarvoor in het programma is aangewezen, kan:

      a. in dat programma opgenomen maatregelen, activiteiten of ontwikkelingen ambtshalve wijzigen of vervangen of laten
      vervallen, en

      b. maatregelen, activiteiten of ontwikkelingen aan het programma toevoegen,

      als aannemelijk wordt gemaakt dat die wijzigingen per saldo passen binnen, of in ieder geval niet in strijd zijn
      met, het programma.

      2 De bestuursorganen, bedoeld in [artikel 1.12d][ref1], kunnen verzoeken om een wijziging van het programma. Bij
      dat verzoek wordt aannemelijk gemaakt dat is voldaan aan het eerste lid.


