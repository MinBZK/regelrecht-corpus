  - number: '3.10'
    text: |-
      1 Onverminderd [artikel 3.5, eerste, vierde en vijfde lid][ref1], is het verboden:

      a. in het wild levende zoogdieren, amfibieën, reptielen, vissen, dagvlinders, libellen en kevers van de soorten,
      genoemd in de bijlage, onderdeel A, bij deze wet, opzettelijk te doden of te vangen;

      b. de vaste voortplantingsplaatsen of rustplaatsen van dieren als bedoeld in onderdeel a opzettelijk te beschadigen
      of te vernielen, of

      c. vaatplanten van de soorten, genoemd in de bijlage, onderdeel B, bij deze wet, in hun natuurlijke
      verspreidingsgebied opzettelijk te plukken en te verzamelen, af te snijden, te ontwortelen of te vernielen.

      2 [Artikel 3.8][ref2], met uitzondering van het derde en vierde lid, is van overeenkomstige toepassing op de
      verboden, bedoeld in het eerste lid, met dien verstande dat, in aanvulling op de redenen, genoemd in het vijfde
      lid, onderdeel b, de noodzaak voor de ontheffing of vrijstelling ook verband kan houden met handelingen:

      a. in het kader van de ruimtelijke inrichting of ontwikkeling van gebieden of van kleinschalige bouwactiviteiten,
      met inbegrip van het daarop volgende gebruik van het gebied of het gebouwde;

      b. ter voorkoming van schade of overlast, met inbegrip van schade aan sportvelden, schietterreinen,
      industrieterreinen, kazernes, of begraafplaatsen;

      c. ter beperking van de omvang van de populatie van dieren, in verband met door deze dieren ter plaatse en in het
      omringende gebied veelvuldig veroorzaakte schade of in verband met de maximale draagkracht van het gebied waarin de
      dieren zich bevinden;

      d. ter voorkoming of bestrijding van onnodig lijden van zieke of gebrekkige dieren;

      e. in het kader van bestendig beheer of onderhoud in de landbouw of bosbouw;

      f. in het kader van bestendig beheer of onderhoud aan vaarwegen, watergangen, waterkeringen, waterstaatswerken,
      oevers, vliegvelden, wegen, spoorwegen of bermen, of in het kader van natuurbeheer;

      g. in het kader van bestendig beheer of onderhoud van de landschappelijke kwaliteiten van een bepaald gebied;

      h. in het algemeen belang, of

      i. bestendig gebruik.

      3 De verboden, bedoeld in het eerste lid, onderdelen a, en b, zijn niet van toepassing op de bosmuis, de
      huisspitsmuis en de veldmuis voor zover deze dieren zich in of op gebouwen of daarbij behorende erven of roerende
      zaken bevinden.


