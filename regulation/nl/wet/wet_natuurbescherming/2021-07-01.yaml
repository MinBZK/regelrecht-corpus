  - number: '3.26'
    text: |-
      1 Het is verboden een geweer te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet:

      a. zonder een geldige jachtakte;

      b. op gronden, niet zijnde een jachtveld dat voldoet aan bij of krachtens algemene maatregel van bestuur gestelde
      regels;

      c. indien de burgerrechtelijke aansprakelijkheid voor schade waartoe het gebruik van het geweer ter uitoefening van
      het bepaalde bij of krachtens deze wet aanleiding kan geven, niet is gedekt door een verzekering, overeenkomstig
      bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 3.29, eerste lid][ref1], gestelde regels,
      of

      d. voor andere handelingen dan:

      1°. de jacht;

      2°. de uitvoering van handelingen waarvoor een ontheffing of vrijstelling als bedoeld
      in de [artikelen 3.3, eerste, onderscheidenlijk tweede lid, of derde lid][ref2],
      [3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref3], [3.10, tweede lid][ref4], in samenhang met
      artikel 3.8, eerste, onderscheidenlijk tweede lid, of derde lid, of [3.15, tweede en vierde lid][ref5], in
      voorkomend geval in samenhang met het zevende lid, [3.16, tweede en vierde lid][ref6], of [3.17, eerste lid][ref7],
      is verleend;

      3°. de uitvoering van [artikel 3.18, eerste lid][ref8], in voorkomend geval in samenhang met het vierde lid, of
      [3.19, tweede lid][ref9], in samenhang met artikel 3.18, vierde lid;

      4°. de bestrijding van bij ministeriële regeling aangewezen verwilderde dieren of exoten, buiten de gevallen,
      bedoeld onder 3°;

      5°. de bestrijding van de zwarte rat, de bruine rat of de huismuis;

      6°. het schieten van kleiduiven, of

      7°. jachthondenproeven.

      2 Bij of krachtens algemene maatregel van bestuur kan het gebruik van het geweer, bedoeld in het eerste lid, worden
      uitgesloten of beperkt en kunnen regels worden gesteld over:

      a. het geweer;

      b. de munitie, waarbij ook rekening wordt gehouden met belangen van veiligheid, volksgezondheid, welzijn en milieu;

      c. het gebruik van middelen op, aan of bij het geweer;

      d. de diersoorten waarop het gebruik van het geweer betrekking heeft, of

      e. de vaardigheden waarover de gebruiker van het geweer beschikt.

      3 Gedeputeerde staten kunnen ontheffing en provinciale staten kunnen vrijstelling verlenen van het eerste lid,
      onderdeel a of b, en de krachtens het tweede lid gestelde regels, met dien verstande dat bij het verlenen van
      ontheffing of vrijstelling van regels als bedoeld in het tweede lid, onderdeel b, ook rekening wordt gehouden met
      belangen van veiligheid, volksgezondheid, welzijn en milieu.


