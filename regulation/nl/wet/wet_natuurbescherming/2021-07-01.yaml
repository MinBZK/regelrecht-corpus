      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij besluit van Onze Minister aangewezen ambtenaren;

      b. de door Onze Minister van Veiligheid en Justitie op grond van
      [artikel 17 van de Wet op de economische delicten][ref1] met de opsporing van de bij of krachtens deze wet
      strafbaar gestelde feiten belaste ambtenaren, en

      c. de bij besluit van gedeputeerde staten aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.


