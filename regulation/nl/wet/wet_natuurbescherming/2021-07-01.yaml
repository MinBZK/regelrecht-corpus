  - number: 2.9a
    text: |-
      De gevolgen van de stikstofdepositie op Natura 2000-gebieden die wordt veroorzaakt door bij algemene maatregel
      van bestuur aangewezen activiteiten van de bouwsector, worden buiten beschouwing gelaten voor de toepassing van
      [artikel 2.7, tweede lid][ref1]. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
