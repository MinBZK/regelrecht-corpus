  - number: '3.9'
    text: |-
      1 Indien het vangen of doden van dieren van soorten, genoemd in bijlage IV, onderdeel a, bij de Habitatrichtlijn,
      of bijlage II bij het Verdrag van Bern, met uitzondering van de soorten, bedoeld in artikel 1 van de
      Vogelrichtlijn, en het aan de natuur onttrekken van dieren van soorten, genoemd in bijlage V, onderdeel a, bij de
      Habitatrichtlijn, of bijlage III bij het Verdrag van Bern, met uitzondering van de soorten, bedoeld in artikel 1
      van de Vogelrichtlijn, bij of krachtens deze wet is toegestaan, is het verboden deze dieren te vangen of te doden
      door gebruikmaking van niet-selectieve middelen die de plaatselijke verdwijning of ernstige verstoring van de rust
      van de populaties van deze soorten tot gevolg kunnen hebben, waartoe in elk geval behoren:

      a. de middelen, genoemd in bijlage VI, onderdeel a, bij de Habitatrichtlijn, en

      b. de vervoermiddelen, genoemd in bijlage VI, onderdeel b, bij de Habitatrichtlijn.

      2 Gedeputeerde staten kunnen ontheffing verlenen en provinciale staten kunnen bij verordening vrijstelling verlenen
      van het verbod, bedoeld in het eerste lid. [Artikel 3.8, vijfde lid][ref1], is van overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kunnen middelen worden aangewezen die in elk geval worden gerekend tot de
      niet-selectieve middelen, bedoeld in het eerste lid, aanhef.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.8
