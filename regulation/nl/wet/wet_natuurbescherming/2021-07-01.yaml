    text: |-
      1 Onze Minister kan een gebied als nationaal park aanwijzen op verzoek van gedeputeerde staten van de provincie of
      provincies waarin het gebied is gelegen.

      2 Een gebied wordt uitsluitend aangewezen als nationaal park, indien:

      a. het een aaneengesloten gebied met een oppervlakte van ten minste 1.000 hectare betreft:

      1°. waarin zich een of meer ecosystemen bevinden die niet wezenlijk zijn aangetast door menselijk gebruik,

      2°. waarin zich dier- en plantensoorten, geomorfologische locaties en habitats bevinden die een bijzonder
      natuurwetenschappelijk, educatief en recreatief belang vertegenwoordigen, of

      3°. dat een natuurlijk landschap van grote schoonheid omvat;

      b. het behoud van de wezenlijke kenmerken van het gebied is verzekerd;

      c. het gebied is opengesteld voor bezoekers voor educatieve, culturele en recreatieve doeleinden, met dien
      verstande dat aan de openstelling voorwaarden en beperkingen kunnen worden gesteld met het oog op het behoud van de
      wezenlijke kenmerken van het gebied; en

      d. het gebied zich duidelijk onderscheidt van eerder aangewezen nationale parken.

      3 Onze Minister kan, gehoord gedeputeerde staten van de betrokken provincie of provincies, een aanwijzing als
      bedoeld in het eerste lid wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 De voordracht voor een krachtens [artikel 1.12f, eerste lid][ref1], [1.12h][ref2] of [2.9a][ref3] vast te stellen
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.

      2 Onze Minister zendt een voorstel voor een lijst van gebieden, geheel of gedeeltelijk gelegen in de exclusieve
      economische zone, of een voorstel tot aanpassing daarvan, als bedoeld in artikel 4, eerste lid, van de
      Habitatrichtlijn niet eerder aan de Europese Commissie toe dan vier weken nadat het ontwerp van dat voorstel aan
      beide kamers der Staten-Generaal is overgelegd.

      3 Een besluit als bedoeld in [artikel 2.1, eerste lid][ref4], of [artikel 2.11, eerste lid][ref5], met betrekking
      tot de aanwijzing van een gebied dat geheel of gedeeltelijk is gelegen in de exclusieve economische zone, wordt
      niet eerder genomen dan vier weken nadat het ontwerp van dat besluit aan beide kamers der Staten-Generaal is
      overgelegd.


