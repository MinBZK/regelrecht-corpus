  - number: '9.11'
    text: |-
      De gebieden die op het moment van inwerkingtreding van deze wet zijn aangewezen op grond van
      [artikel 2.10.2 van het Besluit algemene regels ruimtelijke ordening][ref1] zoals dat luidt onmiddellijk voor het
      tijdstip van inwerkingtreding van deze wet, gelden als gebieden die behoren tot het natuurnetwerk Nederland als
      bedoeld in [artikel 1.12, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.10.2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12
