  - number: '5.5'
    text: |-
      1 Bij provinciale verordening of, indien dat in het algemeen belang geboden is, bij ministeriële regeling
      kan worden bepaald dat, in voorkomend geval onder bij die verordening of regeling bepaalde voorwaarden
      en beperkingen, gedeputeerde staten bij een besluit over verlening van een vergunning als bedoeld in
      [artikel 2.7, tweede lid][ref1], en gedeputeerde staten, onderscheidenlijk provinciale staten bij de toepassing
      van [artikel 2.4, eerste, onderscheidenlijk derde lid][ref2], niet de belasting van natuurwaarden van het
      desbetreffende Natura 2000-gebied betrekken door de bij die verordening of regeling bepaalde factor, indien het
      project:

      a. behoort tot een op grond van [artikel 2.9, tweede lid][ref3], bij de verordening of regeling aangewezen
      categorie van projecten; en

      b. een belasting van natuurwaarden van het desbetreffende Natura 2000-gebied veroorzaakt door de
      factor, die afzonderlijk en, ingeval het project betrekking heeft op een inrichting als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4], in cumulatie met andere projecten met betrekking tot
      dezelfde inrichting, de drempelwaarde die op grond van [artikel 2.9, tweede lid, onderdeel a][ref5], voor het
      desbetreffende Natura 2000-gebied is vastgesteld, niet overschrijdt.

      2 [Artikel 2.9, tweede lid, onderdeel f][ref6], is van toepassing op projecten en handelingen als bedoeld in het
      eerste lid.

      3 Ingeval op grond van [artikel 1.13, eerste lid][ref7], aanhef in samenhang met onderdeel a, een
      programma is vastgesteld dat betrekking heeft op Natura 2000-gebieden, wordt geen vergunning als bedoeld in
      [artikel 2.7, tweede lid][ref8], verleend voor een project dat of andere handeling die betrekking heeft op een
      inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref9] en dat, onderscheidenlijk die
      een belasting veroorzaakt van natuurwaarden van het desbetreffende, in het programma opgenomen Natura 2000-gebied
      door de factor waarvoor het programma is vastgesteld, op grond van het feit dat in verband met dit project of deze
      andere handeling onmiddellijk een afname van de belasting door de desbetreffende factor plaatsvindt als gevolg van
      de beëindiging of beperking van een of meer bepaalde andere handelingen buiten die inrichting.


