  - number: '3.39'
    text: |-
      Het is verboden invasieve exoten behorende tot bij algemene maatregel van bestuur aangewezen soorten, of eieren van
      deze exoten te verhandelen of in bezit te hebben.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.39
  - number: '3.40'
    text: |-
      Onze Minister kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens deze paragraaf,
      overeenkomstig de voorwaarden en beperkingen die in voorkomend geval voortvloeien uit de toepasselijke EU-
      verordening of EU-richtlijn.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.40
  - number: '3.41'
    text: |-
      1 Er is een wetenschappelijke autoriteit CITES, die fungeert als wetenschappelijke autoriteit, bedoeld in
      artikel 13, tweede lid, van de verordening, genoemd in [artikel 3.36, onderdeel a][ref1].

      2 De wetenschappelijke autoriteit, bedoeld in het eerste lid, bestaat uit ten minste vijf en ten hoogste negen
      leden, de voorzitter daaronder begrepen, die ook deskundigheid bezitten op het gebied van natuurbescherming,
      welzijn van dieren en de opvang van dieren.

      3 De leden van de wetenschappelijke autoriteit worden benoemd door Onze Minister, voor een periode van ten hoogste
      vier jaar, tweemaal te verlengen met telkens ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.36
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.41
