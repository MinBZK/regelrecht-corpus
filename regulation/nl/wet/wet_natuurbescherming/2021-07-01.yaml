  - number: '3.30'
    text: |-
      1 Het is verboden jachtvogels te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet:

      a. zonder een geldige valkeniersakte, en

      b. voor andere handelingen dan:

      1°. de jacht;

      2°. de uitvoering van handelingen waarvoor een ontheffing of vrijstelling als bedoeld
      in de [artikelen 3.3, eerste, onderscheidenlijk tweede lid, of derde lid][ref1],
      [3.8, eerste, onderscheidenlijk tweede lid, of derde lid][ref2], [3.10, tweede lid][ref3], in samenhang met
      artikel 3.8, eerste, onderscheidenlijk tweede lid, of derde lid, of [3.15, tweede en vierde lid][ref4], in
      voorkomend geval in samenhang met het zevende lid, [3.16, tweede en vierde lid][ref5], of [3.17, eerste lid][ref6],
      is verleend;

      3°. de uitvoering van [artikel 3.18, eerste lid][ref7], in voorkomend geval in samenhang met het vierde lid, of
      [3.19, tweede lid][ref8], in samenhang met artikel 3.18, vierde lid, en vierde lid;

      4°. de bestrijding van bij ministeriële regeling aangewezen verwilderde dieren of exoten, buiten de gevallen,
      bedoeld onder 3°, of

      5°. de bestrijding van de zwarte rat, de bruine rat of de huismuis.

      2 De valkeniersakte wordt verleend door Onze Minister. [Artikel 3.28][ref9] is van overeenkomstige toepassing
      op de valkeniersakte, met uitzondering van het eerste lid en het tweede lid, onderdelen c en d in samenhang met
      de aanhef.

      3 Het is verboden eendenkooien te gebruiken ter uitoefening van het bepaalde bij of krachtens deze wet, zonder
      daartoe een door Onze Minister erkend examen met gunstig gevolg te hebben afgelegd.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan het examen, bedoeld in het derde
      lid, moet voldoen om door Onze Minister te worden erkend. Met een door Onze Minister erkend examen als bedoeld in
      het derde lid wordt gelijk gesteld, een examen dat is erkend door de bevoegde autoriteit van een andere staat en
      dat door Onze Minister als gelijkwaardig aan de door hem erkende examens is aangemerkt.

      5 Het is ieder ander dan de kooiker van een eendenkooi, waarvoor een recht van afpaling geldt, of degene die
      handelt met toestemming van die kooiker, verboden binnen de afpalingkring van die kooi handelingen te verrichten
      waardoor eenden binnen de afpalingkring kunnen worden verontrust.

      6 Het verbod, bedoeld in het vijfde lid, is, indien redelijkerwijs niet kan worden gevergd dat de handelingen niet,
      op andere wijze of op een ander tijdstip worden verricht, niet van toepassing op handelingen verricht:

      a. ter uitvoering van openbare werken;

      b. bij het gebruik en onderhoud van hetgeen door die werken is tot stand gebracht, of

      c. ter uitoefening van een beroep of bedrijf.

      7 Degene die de handelingen, bedoeld in het zesde lid, verricht, vergoedt de schade die daaruit voor het gebruik
      van de eendenkooi voortvloeit aan de kooiker, tenzij anders met de kooiker is overeengekomen.

      8 Het vijfde tot en met zevende lid zijn niet van toepassing voor zover een recht op afpaling op 1 april 1977 niet
      bestond.

      9 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van afpaling van de
      eendenkooi.


