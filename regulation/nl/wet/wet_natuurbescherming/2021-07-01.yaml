  - number: '9.7'
    text: |-
      1 Vergunningen en ontheffingen, verleend krachtens de Vogelwet 1936, de [Jachtwet][ref1],
      [artikel 25 van de Natuurbeschermingswet][ref2] of de Wet bedreigde uitheemse dier- en plantensoorten blijven van
      kracht voor de tijd dat zij zijn verleend. [Artikel 5.4, eerste en derde lid][ref3], is van toepassing.

      2 [Artikel 3.28, tweede lid, onderdeel a][ref4], is niet van toepassing op degene:

      a. aan wie in de periode van 1 januari 1977 tot en met 31 maart 2002 een jachtakte als bedoeld in de
      [Jachtwet][ref5] is uitgereikt;

      b. aan wie in de periode van 1 april 2002 tot en met 30 september 2004 een jachtakte is uitgereikt onder het met
      gunstig gevolg behalen van een krachtens de [Jachtwet][ref6] erkend jachtexamen.

      3 Het verbod, bedoeld in [artikel 3.6][ref7], is niet van toepassing ten aanzien van dieren en planten die
      uiterlijk op 10 juni 1994 aantoonbaar overeenkomstig de op dat moment geldende regelgeving aan de natuur zijn
      onttrokken.


