  - number: '3.27'
    text: |-
      1 Het is een ieder die niet in het bezit is van een geldige jachtakte, verboden in het veld een geweer of een
      gedeelte van een geweer te dragen, tenzij hij uit anderen hoofde tot het gebruik van een geweer ter plaatse
      gerechtigd is.

      2 Het is de houder van een jachtakte verboden een geweer te dragen op gronden waarop hij niet tot het gebruik van
      een geweer gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0037552/2021-07-01#Artikel3.27
  - number: '3.28'
    text: |-
      1 De jachtakte wordt verleend door de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1].

      2 De jachtakte wordt uitsluitend verleend indien de aanvrager:

      a. met gunstig gevolg een jachtexamen heeft afgelegd dat is erkend door Onze Minister, of dat is erkend door de
      bevoegde autoriteit van een andere staat en door Onze Minister als gelijkwaardig aan door hem erkende jachtexamens
      is aangemerkt;

      b. de leeftijd van achttien jaar heeft bereikt;

      c. jachthouder is van een jachtveld dat voldoet aan de regels gesteld krachtens
      [artikel 3.26, eerste lid, onderdeel b][ref2], en lid is van de wildbeheereenheid waarbinnen zijn jachtveld is
      gelegen, of toestemming heeft van een dergelijke jachthouder tot uitoefening van de jacht in diens jachtveld, en

      d. een geldig bewijs van de verzekering, bedoeld in [artikel 3.26, eerste lid, onderdeel c][ref3], heeft
      overgelegd.

      3 De jachtakte wordt geweigerd indien:

      a. er grond is om aan te nemen dat de aanvrager van de bevoegdheid een geweer en munitie voorhanden te hebben,
      van de bevoegdheid om de jacht uit te oefenen, of van de hem toekomende bevoegdheden in het kader van beheer en
      schadebestrijding als bedoeld in [paragraaf 3.4][ref4] misbruik zal maken, of zodanig gebruik zal maken dat hij een
      gevaar voor zichzelf, de openbare orde of de veiligheid kan gaan vormen;

      b. er grond is om aan te nemen dat de aanvrager nalatig zal zijn te doen wat een goed jager betaamt bij de
      uitoefening van de jacht;

      c. aan de aanvrager de bevoegdheid om de jacht uit te oefenen is ontzegd bij een rechterlijke uitspraak die voor
      tenuitvoerlegging vatbaar is geworden, en de tijd waarvoor die bevoegdheid is ontzegd nog niet is verstreken;

      d. de aanvrager in de twee jaar voorafgaande aan het verzoek tot het verkrijgen van een jachtakte wegens één
      der bij of krachtens deze wet strafbaar gestelde feiten, dan wel wegens een feit dat strafbaar is gesteld bij de
      [Wet dieren][ref5], voor zover het gedragingen als bedoeld in de [artikelen 2.1][ref6], [2.2][ref7], [2.3][ref8],
      [2.5][ref9], [2.6][ref10], [2.7][ref11], [2.8][ref12], [2.9][ref13], [2.10][ref14], [2.13][ref15], [2.14][ref16]
      of [2.15 van die wet][ref17] is veroordeeld, dan wel tegen hem deswege een strafbeschikking is uitgevaardigd, of
      indien hem wegens overtreding van het krachtens de voornoemde artikelen van de Wet dieren bepaalde een bestuurlijke
      boete als bedoeld in [artikel 8.7 van de Wet dieren][ref18] is opgelegd, of

      e. de aanvrager in de acht jaren voorafgaand aan de beslissing op de aanvraag bij onherroepelijk
      geworden rechterlijke uitspraak is veroordeeld wegens het plegen van een misdrijf als omschreven in de
      [artikelen 92][ref19], [95][ref20], [95a][ref21], [108 tot en met 110][ref22], [115 tot en met 117][ref23],
      [121][ref24], [121a][ref25], [123 tot en met 124a][ref26], [131][ref27], [140 tot en met 141a][ref28],
      [142][ref29], [157][ref30], [164][ref31], [166][ref32], [168][ref33], [170][ref34], [179][ref35], [180][ref36],
      [242 tot en met 247][ref37], [248f][ref38], [249][ref39], [250][ref40], [273f][ref41], [274][ref42],
      [279][ref43], [281 tot en met 282b][ref44], [284 tot en met 285b][ref45], [287 tot en met 292][ref46],
      [300 tot en met 303][ref47], [307][ref48], [312][ref49], [317][ref50], [350][ref51], [352][ref52] of
      [381 tot en met 387 van het Wetboek van Strafrecht][ref53], of wegens het plegen van een misdrijf op grond van de
      [Wet wapens en munitie][ref54] of op grond van de [Opiumwet][ref55].

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan het jachtexamen, bedoeld in het
      tweede lid, onderdeel a, moet voldoen om door Onze Minister te worden erkend.

      5 In afwijking van het tweede lid, onderdeel c, kan degene die geen woonplaats in Nederland heeft een jachtakte
      verkrijgen die geldig is gedurende zes opeenvolgende in de vergunning vermelde dagen.

      6 Een jachtakte als bedoeld in het vijfde lid:

      a. wordt uitsluitend verleend indien de aanvrager genoegzaam aantoont dat hij gerechtigd is de jacht uit te oefenen
      in het land waarin hij zijn woon- of verblijfplaats heeft, en

      b. is uitsluitend van toepassing indien de houder zich bevindt in gezelschap van een in Nederland woonachtige
      houder van een geldige jachtakte.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aanvraag, duur, geldigheid
      en intrekking van de jachtakte. Bij ministeriële regeling wordt het model van de jachtakte vastgesteld.

      8 Voor de berekening van periode van acht jaar, bedoeld in het derde lid, onderdeel e, telt de periode waarin een
      onvoorwaardelijke vrijheidsstraf is ondergaan, niet mee.


