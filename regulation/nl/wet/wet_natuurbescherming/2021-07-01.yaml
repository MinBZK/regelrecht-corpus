  - number: '3.18'
    text: |-
      1 Gedeputeerde staten kunnen aan faunabeheereenheden of wildbeheereenheden, aan andere samenwerkingsverbanden
      van personen, of aan personen opdracht geven om, in afwijking van het bepaalde bij of krachtens de
      [artikelen 3.1][ref1], [3.4, eerste lid][ref2], [3.5][ref3], [3.9, eerste lid][ref4], en [3.10, eerste lid][ref5],
      de omvang van een bij de opdracht aangeduide populatie van vogels of van dieren van soorten als bedoeld in
      artikel 3.5, eerste lid, of 3.10, eerste lid, te beperken als dat nodig is om de onderscheidenlijke redenen,
      genoemd in [artikel 3.17, eerste lid, onderdelen a, b en c][ref6]. De [artikelen 3.3, vierde en vijfde lid][ref7],
      [3.8, vijfde lid][ref8], en 3.10, tweede lid, zijn van overeenkomstige toepassing op die opdracht.

      2 Gedeputeerde staten kunnen ten aanzien van één of meer van de door hen krachtens het eerste lid aangewezen
      personen of groepen van personen bepalen dat zij, ter uitvoering van de opdracht, bedoeld in het eerste lid:

      a. toegang hebben tot gronden, zo nodig met behulp van de sterke arm, of

      b. handelen overeenkomstig een vastgesteld en goedgekeurd faunabeheerplan.

      3 Gedeputeerde staten kunnen bepalen wat met de ingevolge het eerste lid bemachtigde dieren gebeurt.

      4 Het eerste tot en met derde lid, met uitzondering van de tweede volzin van het eerste lid, zijn van
      overeenkomstige toepassing op het beperken van de omvang van populaties van dieren die zijn aan te merken als
      exoten of van verwilderde dieren.


