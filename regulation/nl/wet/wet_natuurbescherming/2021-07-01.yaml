  - number: '3.21'
    text: |-
      1 Het is verboden bij de uitoefening van de jacht gebruik te maken van andere middelen dan:

      a. geweren;

      b. honden, niet zijnde lange honden;

      c. aantoonbaar gefokte jachtvogels van bij algemene maatregel van bestuur aangewezen soorten;

      d. eendenkooien die voldoen aan bij of krachtens algemene maatregel van bestuur gestelde regels;

      e. lokeenden of lokduiven, die niet blind of verminkt zijn;

      f. fretten;

      g. buidels, of

      h. schermen.

      2 Het is verboden zich ter uitoefening van de jacht in het veld te bevinden met andere middelen dan die, bedoeld
      in het eerste lid. Degene die zich in het veld bevindt met voor de jacht geoorloofde middelen als bedoeld in het
      eerste lid, of met andere middelen waarmee kan worden gejaagd, wordt geacht zich daarmee ter uitoefening van de
      jacht in het veld te bevinden, tenzij het tegendeel blijkt.

      3 Het is verboden de jacht uit te oefenen met gebruikmaking van het geweer binnen de bij besluit van de
      gemeenteraad vastgestelde grenzen van de bebouwde kom, of in de onmiddellijk aan de bebouwde kom grenzende
      terreinen.

      4 Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van het bepaalde bij of krachtens de
      Benelux-overeenkomst regels gesteld over de uitoefening van de jacht en het vervoer en in de handel brengen van
      wild.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de uitoefening van de jacht.
      Deze regels kunnen onder meer behelzen:

      a. een verbod om de jacht uit te oefenen op zondagen en feestdagen;

      b. een verbod om de jacht uit te oefenen op bepaalde plaatsen;

      c. een verbod om de jacht uit te oefenen vanuit voertuigen, vaartuigen of luchtvaartuigen;

      d. een verbod om de jacht uit te oefenen als het wild, bedoeld in [artikel 3.20, tweede lid][ref1], kwetsbaar is
      vanwege weersomstandigheden of hun ontwikkelingsfase.

      6 Het is verboden dieren door middel van een eendenkooi te vangen, tenzij de gevangen dieren terstond na het vangen
      in vrijheid worden gesteld of worden gedood.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
