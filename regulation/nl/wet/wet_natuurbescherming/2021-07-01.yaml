  - number: '3.29'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verzekering, bedoeld in
      [artikel 3.26, eerste lid, onderdeel c][ref1]. De regels hebben in elk geval betrekking op de periode en het
      maximum bedrag waarvoor de verzekering de aansprakelijkheid dekt.

      2 Degene die de schade heeft geleden heeft jegens de verzekeraar, door wie de aansprakelijkheid volgens deze wet
      is gedekt, een eigen recht op schadevergoeding tot het beloop van het in het eerste lid bedoelde bedrag. Het teniet
      gaan van zijn schuld aan de verzekerde bevrijdt de verzekeraar niet jegens de benadeelde, tenzij deze schadeloos
      is gesteld.

      3 Geen uit de bepalingen van het Burgerlijk Wetboek omtrent de verzekeringsovereenkomst of uit deze overeenkomst
      zelf voortvloeiende nietigheid of voortvloeiend verweer of verval kan door een verzekeraar aan een benadeelde
      worden tegengeworpen.

      4 De verzekeraar die ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, hoewel de
      aansprakelijkheid voor die schade niet door een met hem gesloten overeenkomst was gedekt, heeft voor het bedrag van
      de schadevergoeding verhaal op degene die voor de schade aansprakelijk is.

      5 Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.26
