  - number: '3.16'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen vogels als bedoeld in [artikel 3.1, eerste lid][ref1], en dieren van
      soorten als bedoeld in [artikel 3.5, eerste lid][ref2], of [3.10, eerste lid][ref3], worden aangewezen, die niet
      in hun voortbestaan worden bedreigd of dat gevaar lopen, en die in het gehele land overlast veroorzaken.

      2 In zoverre in afwijking van de [artikelen 3.3, tweede lid][ref4], [3.8, tweede lid][ref5], en
      [3.10, tweede lid][ref6], in samenhang met artikel 3.8, tweede lid, kan Onze Minister een vrijstelling van verboden
      als bedoeld in de [artikelen 3.1][ref7], [3.2, tweede lid][ref8], [3.5][ref9], [3.6, tweede lid][ref10], en 3.10,
      eerste lid, verlenen voor de bestrijding van overlast binnen de bebouwde kom door gemeenten van vogels en dieren
      als bedoeld in het eerste lid.

      3 Provinciale staten kunnen bij verordening vogels als bedoeld in [artikel 3.1, eerste lid][ref11], en dieren van
      soorten als bedoeld in [artikel 3.5, eerste lid][ref12] of [3.10, eerste lid][ref13], aanwijzen die:

      a. niet bij algemene maatregel van bestuur als bedoeld in het eerste lid zijn aangewezen;

      b. niet in hun voortbestaan worden bedreigd of dat gevaar lopen, en

      c. in hun provincie overlast veroorzaken.

      4 Provinciale staten kunnen bij verordening een vrijstelling als bedoeld in [artikel 3.3, tweede lid][ref14],
      [3.8, tweede lid][ref15], [3.10, tweede lid][ref16], in samenhang met artikel 3.8, tweede lid, verlenen voor de
      bestrijding van overlast binnen de bebouwde kom door gemeenten van vogels en dieren als bedoeld in het derde lid
      verlenen.

      5 De bestrijding van de overlast, bedoeld in het tweede en vierde lid, vindt uitsluitend plaats:

      a. in geval van vogels:

      1°. in het belang van de volksgezondheid of de openbare veiligheid;

      2°. in het belang van de veiligheid van het luchtverkeer;

      b. in geval van dieren van soorten als bedoeld in [artikel 3.5, eerste lid][ref17], in het belang van de
      volksgezondheid en de openbare veiligheid of om andere dwingende redenen van groot openbaar belang.

      c. in geval van andere soorten als bedoeld in [artikel 3.10][ref18], in het belang van bij de vrijstelling,
      bedoeld in het tweede lid, onderscheidenlijk de verordening, bedoeld in het vierde lid, omschreven belangen.


