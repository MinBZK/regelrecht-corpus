valid_from: '2010-10-10'
bwb_id: BWBR0002448
url: https://wetten.overheid.nl/BWBR0002448/2010-10-10
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen inzake berekening van termijnen in
    verband met de zaterdag, de zondag en algemeen erkende feestdagen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Een in een wet gestelde termijn die op een zaterdag, zondag of algemeen erkende feestdag eindigt, wordt verlengd
      tot en met de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.

      2 Het vorige lid geldt niet voor termijnen, bepaald door terugrekening vanaf een tijdstip of een gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel1
  - number: '2'
    text: |-
      Een in een wet gestelde termijn van ten minste drie dagen wordt, zo nodig, zoveel verlengd, dat daarin ten minste
      twee dagen voorkomen die niet een zaterdag, zondag of algemeen erkende feestdag zijn.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Algemeen erkende feestdagen in de zin van deze wet zijn: de Nieuwjaarsdag, de Christelijke tweede Paas- en
      Pinksterdag, de beide Kerstdagen, de Hemelvaartsdag, de dag waarop de verjaardag van de Koning wordt gevierd en de
      vijfde mei.

      2 Voor de toepassing van deze wet wordt de Goede Vrijdag met de in het vorige lid genoemde dagen gelijkgesteld.

      3 Wij kunnen bepaalde dagen voor de toepassing van deze wet met de in het eerste lid genoemde gelijkstellen. Ons
      besluit wordt in de *Nederlandse Staatscourant* openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Deze wet geldt niet voor termijnen:

      a. omschreven in uren, in meer dan 90 dagen, in meer dan twaalf weken, in meer dan drie maanden, of in een of meer
      jaren;

      b. betreffende de bekendmaking, inwerkingtreding of buitenwerkingtreding van wettelijke voorschriften;

      c. van vrijheidsbeneming.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Op in een algemene maatregel van bestuur gestelde termijnen zijn de [artikelen 1][ref1]-[4][ref2] van
      overeenkomstige toepassing, tenzij bij algemene maatregel van bestuur iets anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel4
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002448
        artikel: '4'
  - number: 5a
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel5a
  - number: '6'
    text: 'Deze wet kan worden aangehaald als: Algemene termijnenwet.'
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Deze wet treedt in werking met ingang van 1 april 1965.

      2 Zij kan voor termijnen, gesteld in door Ons, door plaatsing op een daartoe door Ons aangehouden lijst, aangewezen
      wetten en algemene maatregelen van bestuur, op door Ons te bepalen eerdere tijdstippen in werking treden.
    url: https://wetten.overheid.nl/BWBR0002448/2010-10-10#Artikel7
