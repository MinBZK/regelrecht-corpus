        hoofdstuk: '4'
  - number: 119.2.c
    text: |-
      een bevoegdheid tot het stellen van regels krachtens de [artikelen 91][ref1], [93][ref2], [95][ref3], [99][ref4],
      [100a][ref5] en [109][ref6] in samenhang met artikel [116][ref7] en krachtens de [artikelen 114][ref8], [115][ref9]
      en [117][ref10], bij Onze Minister blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel95
