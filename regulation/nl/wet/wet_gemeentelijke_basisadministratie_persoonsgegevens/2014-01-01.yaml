        artikel: '1'
  - number: '2'
    text: |-
      Het college van burgemeester en wethouders van elke gemeente is de verantwoordelijke voor de verwerking van
      persoonsgegevens over de bevolking in een geautomatiseerde basisadministratie van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel2
  - number: '3.1'
    text: |-
      De basisadministraties hebben tot doel de afnemers te voorzien van de in [artikel 34][ref1] bedoelde algemene
      gegevens, voor zover deze gegevens noodzakelijk zijn voor de vervulling van de taken van de afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '3.2'
    text: |-
      De basisadministraties hebben mede tot doel de afnemers, bedoeld in [artikel 89][ref1], te voorzien van de in
      [artikel 34][ref2] bedoelde bijzondere gegevens, voor zover deze gegevens noodzakelijk zijn voor de vervulling van
      de taken van de afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid kunnen algemene en bijzondere gegevens worden verstrekt aan een derde, in
      bij of krachtens deze wet aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3
  - number: '3.4'
    text: De basisadministraties hebben mede tot doel een ingeschrevene te voorzien van de hem betreffende algemene gegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3
  - number: 3a
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke van de algemene gegevens, bedoeld in
      [artikel 34, eerste en tweede lid][ref1], worden aangemerkt als authentieke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 3b.1
    text: |-
      De afnemer die bij de vervulling van zijn taak informatie over een ingeschrevene nodig heeft die in de vorm van een
      authentiek gegeven beschikbaar is in de basisadministratie, gebruikt voor die informatie dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
  - number: 3b.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
  - number: 3b.2.a
    text: |-
      bij het gegeven een aantekening als bedoeld in [artikel 54][ref1] is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel54
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '54'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 3b.2.b
    text: |-
      de afnemer ten aanzien van het gegeven een mededeling als bedoeld in [artikel 62][ref1] doet;


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel62
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '62'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 3b.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
  - number: 3b.2.d
    text: een goede vervulling van de taak van de afnemer door de onverkorte toepassing van het eerste lid wordt belet.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3b
  - number: 3c
    text: |-
      Een ingeschrevene aan wie door een afnemer een gegeven wordt gevraagd, waarop [artikel 3b, eerste lid][ref1], van
      toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover het gegeven noodzakelijk wordt geacht
      voor een deugdelijke vaststelling van de identiteit van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel3b
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 3b
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      Onze Minister draagt zorg voor de aanleg en de instandhouding van een beveiligd netwerk voor het met behulp van
      telecommunicatie geautomatiseerd verzenden en ontvangen van berichten in verband met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het gebruik van het netwerk
      voor andere berichten dan die waarvan de verzending en de ontvangst over het netwerk bij of krachtens de overige
      bepalingen van deze wet geregeld zijn.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister legt de hoofdlijnen van het beheer van het netwerk vast in een regeling die in de *Staatscourant*
      bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel4
  - number: '4.4'
    text: |-
      Al degenen die bij het beheer van het netwerk zijn betrokken, zijn verplicht de in het derde lid bedoelde regeling
      na te leven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel4
  - number: '5.1'
    text: 'In dit artikel wordt verstaan onder betrokkene:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: 5.1.a
    text: een college van burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: 5.1.b
    text: een buitengemeentelijke afnemer;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een derde als bedoeld in [artikel 99][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 5.1.d
    text: |-
      een gebruiker van het netwerk, die de in [artikel 4, tweede lid][ref1], bedoelde berichten over het netwerk
      verzendt of ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel4
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '4'
        hoofdstuk: '1'
  - number: '5.2'
    text: |-
      Door een betrokkene worden bijdragen verstrekt in de bij algemene maatregel van bestuur te bepalen categorieën van
      kosten in verband met de uitvoering van deze wet. Van de bij de maatregel te bepalen categorieën van kosten maken
      in ieder geval deel uit de kosten van het netwerk in verband met de verzending en de ontvangst van berichten over
      het netwerk, en de kosten van het beheer van het stelsel van gemeentelijke basisadministraties persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur worden de grondslagen bepaald van de bijdragen van de betrokkenen in de kosten,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien een betrokkene geen rechtspersoonlijkheid bezit, komt de bijdrage ten laste van de rechtspersoon, waartoe de
      betrokkene behoort.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de vaststelling en de betaling
      van de bijdragen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de technische en administratieve
      inrichting en werking en de beveiliging van de basisadministraties.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel6
  - number: '6.2'
    text: |-
      Aan de regels moet in ieder geval uitvoering worden gegeven vanaf een bij of krachtens de maatregel bepaald
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld volgens welke uitgangspunten er een vergoeding zal plaatsvinden
      van de kosten die moeten worden gemaakt in verband met door het Rijk verplichte wijzigingen in de technische en
      administratieve inrichting en werking van de gemeentelijke basisadministraties.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het college van burgemeester en wethouders is slechts bevoegd uitvoering te geven aan de in
      [artikel 6, eerste lid][ref1], bedoelde regels met toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '7.2'
    text: Aan de toestemming kunnen beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het college van burgemeester en wethouders dient voor een bij of krachtens algemene maatregel van bestuur te
      bepalen tijdstip een verzoek in tot het verlenen van een toestemming als bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
  - number: '8.2'
    text: |-
      Bij of krachtens de maatregel kunnen nadere regels worden gesteld omtrent het indienen van een verzoek om
      toestemming.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister verleent geen toestemming als bedoeld in [artikel 7][ref1], dan nadat een onderzoek is verricht naar
      de inrichting, de werking en de beveiliging van de voorzieningen waarmee het college van burgemeester en wethouders
      uitvoering wil geven aan de regels, bedoeld in [artikel 6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      Het onderzoek omvat de door Onze Minister te bepalen onderdelen van de inrichting, de werking en de beveiliging van
      de voorzieningen. Aan het college van burgemeester en wethouders wordt een nauwkeurige beschrijving verstrekt van
      de onderdelen die in het onderzoek zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het college van burgemeester en wethouders stelt de door Onze Minister hiertoe aangewezen personen in staat
      gegevens te verzamelen ten behoeve van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel9
  - number: '9.4'
    text: |-
      Toestemming wordt slechts geweigerd indien uit het onderzoek blijkt dat de inrichting, de werking of de beveiliging
      van de voorzieningen, op de in het onderzoek opgenomen onderdelen niet voldoet aan de regels, bedoeld in
      [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '9.5'
    text: |-
      Indien toestemming wordt verleend, betreft het oordeel van Onze Minister dat de inrichting, de werking en de
      beveiliging van de voorzieningen voldoen aan de regels, bedoeld in [artikel 6, eerste lid][ref1], slechts die
      onderdelen die in het onderzoek zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '10.1'
    text: |-
      Het college van burgemeester en wethouders dat in het bezit is van een toestemming als bedoeld in
      [artikel 7][ref1], draagt zorg dat de inrichting, de werking en de beveiliging van de basisadministratie voldoen
      aan de regels, bedoeld in [artikel 6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '10.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verschaffen van
      inlichtingen door het college van burgemeester en wethouders aan Onze Minister in verband met het aanbrengen van
      een verandering in de wijze van uitvoering van de regels, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '13.1'
    text: |-
      In een regeling tot wijziging van de in [artikel 6, eerste lid][ref1], bedoelde regels kan worden bepaald dat
      het college van burgemeester en wethouders slechts bevoegd is uitvoering te geven aan de gewijzigde regels met
      toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '13.2'
    text: |-
      De [artikelen 7, tweede lid][ref1], en [8 tot en met 10][ref2], zijn van overeenkomstige toepassing op een
      toestemming als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel8
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '8'
        hoofdstuk: '1'
  - number: '13.3'
    text: |-
      Een regeling tot wijziging van de in [artikel 6, eerste lid][ref1], bedoelde regels waarin de in het eerste lid
      bedoelde bepaling is opgenomen, wordt niet vastgesteld dan nadat de betrokken gemeenten, afnemers en derden de
      mogelijkheid is geboden hun zienswijze omtrent het voorstel tot wijziging naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '13.4'
    text: |-
      In een regeling tot wijziging van de in [artikel 6, eerste lid][ref1], bedoelde regels, wordt bepaald op welk
      tijdstip de voor de uitvoering van die regeling te treffen voorzieningen moeten zijn gerealiseerd en vanaf welk
      tijdstip die regeling moet worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '13.5'
    text: |-
      Onze Minister kan na het ingevolge het vierde lid bepaalde tijdstip, onderzoek verrichten naar de getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
  - number: '13.6'
    text: |-
      De [artikelen 9, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel9
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '9'
        hoofdstuk: '1'
  - number: '14.1'
    text: |-
      Het college van burgemeester en wethouders legt de hoofdlijnen van het beheer van de basisadministratie vast in een
      regeling die voor een ieder ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het college van burgemeester en wethouders, de in [artikel 15][ref1] bedoelde bewerker en al degenen die verder
      bij het beheer van de basisadministratie zijn betrokken, zijn verplicht de in het eerste lid bedoelde regeling na
      te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel15
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '15'
        hoofdstuk: '1'
  - number: '15'
    text: |-
      Het college van burgemeester en wethouders kan met machtiging van Onze Minister technische en administratieve
      werkzaamheden laten verrichten door een bewerker die voldoet aan bij of krachtens algemene maatregel van bestuur te
      stellen eisen omtrent de deugdelijke uitvoering van zijn werkzaamheden, de beveiliging van de gegevensbestanden en
      de bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel15
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verzending en de ontvangst van
      berichten over het netwerk door:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel16
  - number: 16.1.a
    text: een buitengemeentelijke afnemer;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel16
  - number: 16.1.b
    text: |-
      een derde als bedoeld in [artikel 99][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verzending en de ontvangst
      van berichten door een buitengemeentelijke afnemer, op een andere wijze dan over het netwerk, voor zover
      de berichten in verband staan met de verstrekking van gegevens op grond van een besluit als bedoeld in
      [artikel 91, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verzending en de ontvangst
      van berichten door een derde als bedoeld in [artikel 99][ref1], op een andere wijze dan over het netwerk, voor
      zover de berichten in verband staan met de verstrekking van gegevens op grond van een besluit als bedoeld in
      [artikel 99, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '17.1'
    text: |-
      Een afnemer of een derde is slechts bevoegd uitvoering te geven aan de in [artikel 16][ref1] bedoelde regels met
      toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '17.2'
    text: Aan de toestemming kunnen beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het indienen van een verzoek
      om toestemming.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister verleent geen toestemming als bedoeld in [artikel 17][ref1], dan nadat een onderzoek is verricht naar
      de inrichting en de werking van de voorzieningen waarmee de afnemer of de derde uitvoering wil geven aan de regels,
      bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '17'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '18.2'
    text: |-
      Het onderzoek omvat de door Onze Minister te bepalen onderdelen van de inrichting en de werking van de
      voorzieningen. Aan de afnemer of de derde wordt een nauwkeurige beschrijving verstrekt van de onderdelen die in het
      onderzoek zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel18
  - number: '18.3'
    text: |-
      De afnemer of de derde stelt de door Onze Minister hiertoe aangewezen personen in staat gegevens te verzamelen ten
      behoeve van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel18
  - number: '18.4'
    text: |-
      Toestemming wordt slechts geweigerd indien uit het onderzoek blijkt dat de inrichting of de werking van
      de voorzieningen, op de in het onderzoek opgenomen onderdelen niet voldoet aan de regels, bedoeld in
      [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '18.5'
    text: |-
      Indien toestemming wordt verleend, betreft het oordeel van Onze Minister dat de inrichting en de werking van de
      voorzieningen voldoen aan de regels, bedoeld in [artikel 16][ref1], slechts die onderdelen die in het onderzoek
      zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '19.1'
    text: |-
      De afnemer of de derde die in het bezit is van een toestemming als bedoeld in [artikel 17][ref1], draagt zorg dat
      de verzending en de ontvangst van berichten voldoen aan de regels, bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '17'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '19.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verschaffen van
      inlichtingen door de afnemer of de derde aan Onze Minister in verband met het aanbrengen van een verandering in de
      wijze van uitvoering van de regels, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde krachtens de [artikelen 16][ref1] en [17, tweede lid][ref2], zijn
      belast de bij besluit van Onze Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel17
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '17'
        hoofdstuk: '1'
  - number: '20.2'
    text: |-
      Het onderzoek in het kader van het toezicht, bedoeld in het eerste lid, omvat de door Onze Minister te bepalen
      onderdelen van de inrichting en de werking van de voorzieningen. Aan de afnemer of de derde wordt een nauwkeurige
      beschrijving verstrekt van de onderdelen die in het onderzoek zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel20
  - number: '20.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel20
  - number: '21'
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 20, tweede lid][ref1], blijkt dat de verzending of de
      ontvangst van berichten, op de in het onderzoek opgenomen onderdelen niet voldoet aan de regels, bedoeld in
      [artikel 16][ref2], is de afnemer of de derde verplicht binnen een door Onze Minister te stellen termijn aan de
      regels te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '20'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '22.1'
    text: |-
      In een regeling tot wijziging van de in [artikel 16][ref1] bedoelde regels kan worden bepaald dat de afnemer of de
      derde slechts bevoegd is uitvoering te geven aan de gewijzigde regels met toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '22.2'
    text: |-
      De [artikelen 17, tweede lid][ref1], en [18 tot en met 21][ref2] zijn van overeenkomstige toepassing op een
      toestemming als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel18
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '17'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '18'
        hoofdstuk: '1'
  - number: '22.3'
    text: |-
      Een regeling tot wijziging van de in [artikel 16][ref1] bedoelde regels waarin de in het eerste lid bedoelde
      bepaling is opgenomen, wordt niet vastgesteld dan nadat de betrokken gemeenten, afnemers en derden de mogelijkheid
      is geboden hun zienswijze omtrent het voorstel tot wijziging naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
        hoofdstuk: '1'
  - number: '23'
    text: |-
      De [artikelen 49][ref1] en [50 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel50
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '50'
  - number: 23a.1
    text: |-
      Onze Minister overlegt periodiek met een representatieve vertegenwoordiging van de gemeenten, de afnemers en de
      derden, bedoeld in de [artikelen 99][ref1] en [109, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel109
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '109'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 23a.2
    text: |-
      Alle onderwerpen die bij of krachtens deze wet worden geregeld, lenen zich voor overleg. In ieder geval wordt
      overleg gepleegd over:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
  - number: 23a.2.a
    text: wijzigingen in en aanvullingen op het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
  - number: 23a.2.b
    text: de uitgangspunten van het te voeren kwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
  - number: 23a.2.c
    text: |-
      de uitgangspunten van het beheer van het netwerk en de krachtens [artikel 5][ref1] in verband daarmee te
      verstrekken bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '5'
        hoofdstuk: '1'
  - number: 23a.3
    text: Onze Minister kan met betrekking tot het overleg nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel23a
  - number: '24'
    text: |-
      De inschrijving in een basisadministratie geschiedt op grond van de geboorteakte, de aangifte van de betrokkene
      of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel24
  - number: '25'
    text: |-
      Op grond van de geboorteakte, opgemaakt door de ambtenaar van de burgerlijke stand in Nederland, waarop als
      geboorteplaats een plaats in Nederland is vermeld, geschiedt de inschrijving van het kind dat niet reeds is
      ingeschreven en waarvan ten minste één der ouders op de geboortedatum van het kind als ingezetene is ingeschreven.
      De inschrijving geschiedt in de basisadministratie waar de moeder als ingezetene is ingeschreven, dan wel in
      de basisadministratie waar de vader als ingezetene is ingeschreven, indien de moeder niet als ingezetene is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel25
  - number: '26.1'
    text: |-
      Op grond van zijn aangifte van verblijf en adres wordt degene die niet in een basisadministratie is ingeschreven,
      naar redelijke verwachting gedurende een half jaar ten minste twee derden van de tijd in Nederland verblijf zal
      houden en:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
  - number: 26.1.a
    text: de Nederlandse nationaliteit bezit,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
  - number: 26.1.b
    text: op grond van een wettelijke bepaling als Nederlander wordt behandeld, of
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
  - number: 26.1.c
    text: |-
      vreemdeling is en rechtmatig verblijf geniet als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1],
      ingeschreven in de basisadministratie van de gemeente waar hij zijn adres heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '26.2'
    text: |-
      Indien een persoon als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college van
      burgemeester en wethouders van de gemeente waar betrokkene zijn adres heeft, ambtshalve zorg voor de inschrijving.
      Het college van burgemeester en wethouders is bevoegd de betrokkene alsnog op grond van zijn aangifte in te
      schrijven, indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
  - number: '26.3'
    text: Inschrijving geschiedt niet dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel26
  - number: '27.1'
    text: |-
      Op grond van zijn aangifte van adreswijziging wordt de ingezetene die zijn adres in een andere gemeente dan de
      gemeente van inschrijving heeft gevestigd, in die andere gemeente in de basisadministratie ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel27
  - number: '27.2'
    text: |-
      Indien een ingezetene als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college van
      burgemeester en wethouders van de gemeente waar deze zijn adres heeft, ambtshalve zorg voor de inschrijving. Het
      college van burgemeester en wethouders is bevoegd de ingezetene alsnog op grond van zijn aangifte in te schrijven,
      indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel27
  - number: '28'
    text: |-
      Degene die is ingeschreven in een basisadministratie, blijft na zijn vertrek uit Nederland of na zijn overlijden
      ingeschreven in de basisadministratie van de gemeente waarin hij bij dat vertrek of bij dat overlijden was
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel28
  - number: '29.1'
    text: |-
      Op grond van zijn aangifte van verblijf en adres wordt de ingeschrevene die wegens vertrek uit Nederland niet
      als ingezetene is ingeschreven en die naar redelijke verwachting gedurende een half jaar ten minste twee derden
      van de tijd in Nederland verblijf zal houden en die zijn adres vestigt in een andere gemeente dan de gemeente van
      inschrijving, ingeschreven in de basisadministratie van die andere gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien een ingeschrevene als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college
      van burgemeester en wethouders van de gemeente waar de ingeschrevene zijn adres heeft, ambtshalve zorg voor de
      inschrijving. Het college van burgemeester en wethouders is bevoegd de ingeschrevene alsnog op grond van zijn
      aangifte in te schrijven, indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel29
  - number: '29.3'
    text: Inschrijving geschiedt niet dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel29
  - number: 29a.1
    text: |-
      Inschrijving op grond van [artikel 26][ref1] of [29][ref2] vindt ten aanzien van degene die in Nederland niet als
      ingezetene is ingeschreven in een basisadministratie en zich in Nederland vestigt, komende vanuit Aruba, Curaçao,
      Sint Maarten, Bonaire, Sint Eustatius of Saba, niet plaats, dan nadat hij een hem betreffend verhuisbericht,
      verstrekt door de verantwoordelijke voor de verwerking van gegevens in de basisadministratie in Aruba, Curaçao,
      Sint Maarten of in een van de openbare lichamen, waar hij laatstelijk als ingezetene was ingeschreven, heeft
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel29
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 29a.2
    text: |-
      In het geval dat anderszins blijkt dat het vertrek van de betrokken persoon is verwerkt in de basisadministratie
      in Aruba, Curaçao, Sint Maarten of in een van de openbare lichamen waar hij laatstelijk als ingezetene was
      ingeschreven, of blijkt dat betrokkene daarin niet als ingezetene was ingeschreven, kan het college van
      burgemeester en wethouders afwijken van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel29a
  - number: '30.1'
    text: |-
      Uitschrijving geschiedt uitsluitend op grond van de mededeling van het college van burgemeester en wethouders van
      een andere gemeente dat heeft besloten tot inschrijving van de betrokken persoon in zijn basisadministratie. De
      uitschrijving geschiedt terstond na ontvangst van de mededeling. Tegen de in de eerste volzin bedoelde beslissing
      staat voor het college van burgemeester en wethouders geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel30
  - number: '30.2'
    text: Als datum van uitschrijving geldt de datum van inschrijving bij de volgende gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel30
  - number: '31.1'
    text: |-
      Indien een persoon in meer dan één basisadministratie is ingeschreven, draagt het college van burgemeester en
      wethouders van de gemeente waar betrokkene zijn adres heeft of, bij het ontbreken daarvan, zijn laatste adres heeft
      gehad, er zorg voor dat betrokkene uitsluitend in zijn basisadministratie is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel31
  - number: '31.2'
    text: |-
      [Artikel 30][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel30
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '32.1'
    text: |-
      Onze Minister van Buitenlandse Zaken kan een persoon aanwijzen die in verband met zijn bijzondere
      verblijfsrechtelijke status niet in aanmerking komt voor inschrijving.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: '32.2'
    text: |-
      Een persoon kan worden aangewezen indien hij geen Nederlander is en behoort tot een van de volgende categorieën
      van personen:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: 32.2.a
    text: de leden van diplomatieke zendingen en van consulaire posten;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: 32.2.b
    text: de leden van het administratieve en technische personeel van diplomatieke zendingen en van consulaire posten;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: 32.2.c
    text: de inwonende gezinsleden van de onder *a* en *b* bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: 32.2.d
    text: andere personen die krachtens internationaal recht een bijzondere verblijfsrechtelijke status hebben.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: '32.3'
    text: Een persoon ten aanzien van wie een aanwijzing van kracht is, wordt niet ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: '32.4'
    text: |-
      Een persoon ten aanzien van wie een aanwijzing van kracht wordt, terwijl hij reeds is ingeschreven, wordt
      aangemerkt als een ingeschrevene die wegens zijn vertrek uit Nederland niet als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
  - number: '32.5'
    text: |-
      Een aanwijzing wordt niet van kracht voordat het college van burgemeester en wethouders daarvan de in
      [artikel 61][ref1] bedoelde mededeling heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel61
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '61'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '33.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën worden bepaald van personen, die in verband met hun
      bijzondere verblijfsrechtelijke positie niet in aanmerking komen voor inschrijving.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel33
  - number: '33.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kunnen regels worden gesteld ten aanzien van een persoon
      die behoort tot een categorie als bedoeld in het eerste lid, omtrent:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel33
  - number: 33.2.a
    text: het niet-inschrijven van de persoon;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel33
  - number: 33.2.b
    text: |-
      het aanmerken van de persoon die reeds is ingeschreven als een ingeschrevene die wegens zijn vertrek uit Nederland
      niet als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel33
  - number: '34.1'
    text: |-
      In de basisadministratie van de gemeente van inschrijving worden over de ingeschrevene uitsluitend de volgende
      gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a
    text: 'algemene gegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.1°
    text: gegevens over de burgerlijke staat;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.2°
    text: gegevens over curatele;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.3°
    text: gegevens over het gezag dat over de minderjarige wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.4°
    text: gegevens over de nationaliteit;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.5°
    text: gegevens over het verblijfsrecht van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.6°
    text: |-
      gegevens over de gemeente van inschrijving en het adres in die gemeente, alsmede over het verblijf in Nederland en
      het vertrek uit Nederland;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.7°
    text: |-
      gegevens over de administratienummers van de ingeschrevene, de ouders, de echtgenoot, de eerdere echtgenoten, de
      geregistreerde partner, de eerdere geregistreerde partners en de kinderen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.8°
    text: gegevens over het burgerservicenummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.9°
    text: |-
      gegevens over de burgerservicenummers van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde
      partner, de eerdere geregistreerde partners en de kinderen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.a.10°
    text: |-
      gegevens over het gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de
      geregistreerde partner of de eerdere geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.b
    text: 'bijzondere gegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.b.1°
    text: |-
      gegevens, noodzakelijk in verband met de uitvoering van de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 34.1.b.2°
    text: |-
      gegevens, noodzakelijk in verband met de uitvoering van de [Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 34.1.c
    text: 'administratieve gegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.c.1°
    text: gegevens in verband met de inschrijving en de uitschrijving;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.c.2°
    text: |-
      gegevens ter aanduiding van akten en andere geschriften waaruit algemene gegevens zijn verkregen, dan wel van de
      rechtsgrond krachtens welke gegevens over het Nederlanderschap zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.c.3°
    text: |-
      gegevens ter aanduiding van de onjuistheid van een opgenomen algemeen gegeven of van strijd met de Nederlandse
      openbare orde van een opgenomen gegeven over de burgerlijke staat dan wel over een onderzoek naar die onjuistheid
      of strijdigheid, alsmede andere gegevens, noodzakelijk in verband met de bijhouding van de basisadministratie;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.c.4°
    text: gegevens over de systematische verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: 34.1.c.5°
    text: |-
      gegevens over de niet-verstrekking van gegevens krachtens [artikel 102][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel102
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '102'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '34.2'
    text: |-
      Als algemene gegevens worden de gegevens opgenomen die als zodanig zijn vermeld in [bijlage I][ref1] bij deze wet
      en voor zover het betreft de in het eerste lid, onder a, sub 5, bedoelde gegevens, nader zijn bepaald bij algemene
      maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '34.3'
    text: |-
      Een algemeen gegeven dat is opgenomen, blijft opgenomen, behoudens het bepaalde in [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel81
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '81'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '34.4'
    text: |-
      Bij algemene maatregel van bestuur wordt nader bepaald welke bijzondere en welke administratieve gegevens worden
      opgenomen. De verwijdering en de vernietiging van deze gegevens worden bij of krachtens de maatregel geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel34
  - number: '35.1'
    text: |-
      In de basisadministratie van een vroegere gemeente van inschrijving worden bij de uitschrijving over de
      uitgeschreven persoon uitsluitend de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.a
    text: 'verwijsgegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.a.1°
    text: gegevens over de naam en de geboorte;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.a.2°
    text: gegevens over het administratienummer;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.a.3°
    text: gegevens over het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.a.4°
    text: gegevens over de gemeente van inschrijving, over het adres in die gemeente en over de datum van inschrijving.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: 35.1.b
    text: administratieve gegevens in verband met de verwijsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '35.2'
    text: |-
      Bij een eerste inschrijving op grond van [artikel 25][ref1] of [artikel 26][ref2] van een persoon omtrent wie door
      een ambtenaar van de burgerlijke stand in Nederland in een andere gemeente dan de gemeente van inschrijving een
      geboorteakte is opgemaakt waarop als geboorteplaats een plaats in Nederland is vermeld, worden de gegevens, bedoeld
      in het eerste lid, opgenomen in de basisadministratie van die andere gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '35.3'
    text: |-
      Indien gegevens worden opgenomen op grond van het eerste lid, worden de in dat lid, onder *a*, sub 1° en sub 4°,
      bedoelde gegevens opgenomen naar de juiste staat van die gegevens bij de inschrijving in de basisadministratie van
      de volgende gemeente van inschrijving.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '35.4'
    text: |-
      Indien gegevens worden opgenomen op grond van het tweede lid, worden de in het eerste lid, onder *a*, sub 1° en sub
      4°, bedoelde gegevens opgenomen naar de juiste staat van die gegevens bij de eerste inschrijving.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '35.5'
    text: |-
      Een verwijsgegeven dat in een basisadministratie is opgenomen, blijft daarin opgenomen, tenzij de betrokkene in die
      basisadministratie wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '35.6'
    text: |-
      Als verwijsgegevens worden de gegevens opgenomen die zijn vermeld in [bijlage II, onder A, bij deze wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '35.7'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke administratieve gegevens in verband met de verwijsgegevens
      worden opgenomen. De verwijdering en de vernietiging van deze gegevens worden bij of krachtens de maatregel
      geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '35.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het in bepaalde gevallen niet
      opnemen van de in het eerste lid, onder *a*, sub 3°, bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel35
  - number: '36.1'
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich in Nederland hebben voorgedaan,
      ontleend aan een geschrift als bedoeld onder *a* en bij gebreke hiervan aan een geschrift als bedoeld onder *b*:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.1.a
    text: een akte over het desbetreffende feit, die is opgenomen in de registers van de burgerlijke stand in Nederland;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.1.b
    text: |-
      een door de ambtenaar van de burgerlijke stand opgemaakte akte, een besluit, een in kracht van gewijsde gegane
      rechterlijke uitspraak of een notariële akte, over het desbetreffende feit.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: '36.2'
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich buiten Nederland hebben
      voorgedaan, ontleend aan een geschrift als bedoeld onder *a*, bij gebreke hiervan aan een geschrift als bedoeld
      onder *b* of *c*, bij gebreke ook hiervan aan een geschrift als bedoeld onder *d* en bij gebreke ten slotte ook
      hiervan aan een geschrift als bedoeld onder *e*:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.2.a
    text: een akte over het desbetreffende feit, die is opgenomen in de registers van de Nederlandse burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.2.b
    text: een in Nederland gedane rechterlijke uitspraak over het desbetreffende feit die in kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.2.c
    text: |-
      een buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie opgemaakte
      akte die ten doel heeft tot bewijs te dienen van het desbetreffende feit, of een over dat feit gedane
      rechterlijke uitspraak, of bij gebreke daarvan een akte van bekendheid of beëdigde verklaring, bedoeld in
      [artikel 45 van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel45
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '45'
  - number: 36.2.d
    text: |-
      een geschrift dat overeenkomstig de plaatselijke voorschriften is opgemaakt door een bevoegde instantie, waarin het
      desbetreffende feit is vermeld;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36.2.e
    text: |-
      een verklaring die betrokkene ten overstaan van een door het college van burgemeester en wethouders aangewezen
      ambtenaar onder eed of belofte heeft afgelegd, die op schrift is gesteld en door betrokkene is ondertekend.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: '36.3'
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich in Nederland hebben voorgedaan
      en waarvan een in Nederland geaccrediteerde consulaire ambtenaar van een ander land bevoegd een akte heeft
      opgemaakt die ten doel heeft tot bewijs te dienen van het desbetreffende feit, ontleend aan die akte.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36
  - number: 36a.1
    text: |-
      Aan een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref1], dan wel [artikel 36, derde lid][ref2],
      worden geen gegevens ontleend over het huwelijk of het geregistreerd partnerschap dat is gesloten tussen
      echtgenoten dan wel geregistreerde partners van wie ten minste één vreemdeling is, voordat het college van
      burgemeester en wethouders zich een door de korpschef in de zin van de [Vreemdelingenwet 2000][ref3] afgegeven
      verklaring heeft doen overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
  - number: 36a.2
    text: |-
      De verklaring, bedoeld in het eerste lid, is niet vereist indien voldaan is aan de eisen genoemd in
      [artikel 25, vierde lid, onder b, c of d, van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
  - number: 36a.3
    text: |-
      Op de verklaring, bedoeld in het eerste lid, zijn de regels in en krachtens
      [artikel 44, eerste lid, onder k, en derde lid, van Boek 1 van het Burgerlijk Wetboek][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
  - number: '37.1'
    text: |-
      Indien aannemelijk is dat omtrent een gegeven over de familierechtelijke betrekkingen tot de ouders of de kinderen,
      over het huwelijk en de eerdere huwelijken, over de echtgenoot en de eerdere echtgenoten, over het geregistreerd
      partnerschap en de eerdere geregistreerde partnerschappen of over de geregistreerde partner en de eerdere
      geregistreerde partners een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref1], kan worden verschaft,
      mogen deze gegevens niet aan een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref2], worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel36
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '37.2'
    text: |-
      Aan een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref1], alsmede [artikel 36, derde lid][ref2],
      worden geen gegevens ontleend, voor zover de Nederlandse openbare orde zich verzet tegen de erkenning van de
      rechtsgeldigheid van de in deze geschriften vermelde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel36
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '37.3'
    text: |-
      Aan een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref1], worden geen gegevens ontleend, indien
      aannemelijk is dat de gegevens onjuist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '37.4'
    text: |-
      Een wijziging van de algemene gegevens over de naam en het geslacht van een ouder, de eerdere echtgenoot, de
      eerdere geregistreerde partner of van een algemeen gegeven over de naam van het kind van de ingeschrevene, in
      verband met een rechterlijke last tot wijziging van de vermelding van het geslacht in de geboorteakte, wordt niet
      opgenomen op de persoonslijst van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel37
  - number: 37a
    text: |-
      Bij algemene maatregel van bestuur worden gevallen bepaald waarin het college van burgemeester en wethouders een
      afschrift van een beslissing als bedoeld in [artikel 85][ref1] om op grond van [artikel 37, tweede lid][ref2], een
      gegeven betreffende een vreemdeling niet in de basisadministratie op te nemen, toezendt aan de korpschef in de zin
      van de [Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '85'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
  - number: '38'
    text: 'Op de persoonslijst van een persoon worden geen gegevens over zijn kind opgenomen indien:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel38
  - number: 38.a
    text: het kind ten tijde van de eerste inschrijving van de persoon reeds is overleden en
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel38
  - number: 38.b
    text: het kind zelf geen ingeschrevene is.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel38
  - number: '39'
    text: |-
      De datum van ingang of beëindiging van de rechtsgeldigheid van een gegeven over de burgerlijke staat van de ouder,
      de echtgenoot, de eerdere echtgenoot, de geregistreerde partner, de eerdere geregistreerde partner of het kind,
      wordt slechts op de persoonslijst van de ingeschrevene opgenomen, indien die datum ligt na de datum waarop de
      familierechtelijke betrekking met de ingeschrevene is ontstaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel39
  - number: '40.1'
    text: |-
      Bij gerede twijfel over de toepassing van [artikel 36, tweede en derde lid][ref1], en
      [artikel 37, eerste en tweede lid][ref2], wordt advies ingewonnen van de ambtenaar van de burgerlijke stand in
      de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel37
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '40.2'
    text: |-
      Indien bij de ontlening van gegevens over een huwelijk dat is gesloten tussen echtgenoten van wie ten
      minste een vreemdeling is, aan een geschrift als bedoeld in [artikel 36, tweede lid, onder ][ref1],
      dan wel [artikel 36, derde lid][ref2], op grond van de verklaring van de korpschef in de zin van de
      [Vreemdelingenwet 2000][ref3] of anderszins het redelijke vermoeden bestaat dat het oogmerk van de echtgenoten, of
      een van beiden, niet was gericht op de vervulling van de door de wet aan de huwelijkse staat verbonden plichten,
      doch op het verkrijgen van toelating tot Nederland, wordt in afwijking van het eerste lid, over de ontlening
      van de gegevens over het huwelijk advies van de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage
      ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
  - number: '40.3'
    text: |-
      Indien na het advies, bedoeld in het eerste lid, gerede twijfel blijft bestaan of het voornemen bestaat van het
      advies af te wijken, wordt het advies van de Commissie van advies voor de zaken betreffende de burgerlijke staat en
      de nationaliteit ingewonnen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel40
  - number: '41.1'
    text: De gegevens over curatele worden ontleend aan het curatele- en bewindregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel41
  - number: '41.2'
    text: De gegevens over het gezag dat over de minderjarige wordt uitgeoefend, worden ontleend aan het gezagsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel41
  - number: '42.1'
    text: |-
      Gegevens over het Nederlanderschap worden opgenomen met toepassing van de [Rijkswet op het Nederlanderschap][ref1]
      (*Stb.* 1984, 628), van andere op het Nederlanderschap betrekking hebbende wettelijke bepalingen en van verdragen
      waaruit het Nederlanderschap voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '42.2'
    text: |-
      Indien omtrent een ingeschrevene akten als bedoeld in
      [artikel 22, eerste lid, onder b en c, van de Rijkswet op het Nederlanderschap][ref1], zijn opgenomen in het in
      dat lid bedoelde register, wordt aan deze akten het gegeven over het Nederlanderschap ontleend. Indien omtrent een
      ingeschrevene een afschrift wordt overgelegd van de in de eerste volzin bedoelde akten, uit het register, bedoeld
      in artikel 22, tweede lid, van de genoemde wet, wordt het gegeven over het Nederlanderschap aan dit afschrift
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '22'
  - number: '42.3'
    text: |-
      In de gevallen bedoeld in [artikel 17 van de Rijkswet op het Nederlanderschap][ref1], worden de gegevens over het
      Nederlanderschap ontleend aan een afschrift van een in kracht van gewijsde gegane uitspraak van een rechterlijke
      instantie in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '42.4'
    text: |-
      Indien een afschrift wordt overgelegd van een uitspraak van het Gemeenschappelijk Hof van
      Justitie van Aruba, Curaçao en Sint Maarten en van Bonaire, Sint Eustatius en Saba krachtens
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref1], worden de gegevens over het Nederlanderschap aan dit
      afschrift ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '42.5'
    text: |-
      Gegevens over de behandeling als Nederlander, van een persoon die niet het Nederlanderschap bezit, worden opgenomen
      met toepassing van de [Wet betreffende de positie van Molukkers][ref1] (*Stb.* 1976, 468).


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: '43.1'
    text: |-
      Gegevens over een vreemde nationaliteit worden ontleend aan een beschikking of uitspraak van een daartoe volgens
      het ter plaatse geldend recht bevoegde administratieve of rechterlijke instantie, die tot doel heeft tot bewijs te
      dienen van de betreffende nationaliteit, dan wel opgenomen met toepassing van het betreffende nationaliteitsrecht.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien gegevens over een vreemde nationaliteit niet overeenkomstig het eerste lid kunnen worden verkregen, kunnen
      deze gegevens worden ontleend aan een geschrift van een volgens het ter plaatse geldend recht bevoegde autoriteit,
      dat gegevens vermeldt over die nationaliteit.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel43
  - number: '43.3'
    text: |-
      Indien de betrokkene geen nationaliteit bezit of de nationaliteit niet kan worden
      vastgesteld, wordt dit gegeven opgenomen. Indien een rechterlijke uitspraak op grond van
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref1] is gedaan, waarbij is vastgesteld dat de betrokkene niet
      de Nederlandse nationaliteit bezit, wordt daarvan melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '44'
    text: |-
      Gegevens over het verblijfsrecht van de vreemdeling worden ontleend aan mededelingen daarover van Onze Minister van
      Justitie aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel44
  - number: '45'
    text: |-
      Bij de inschrijving op grond van [artikel 25][ref1] worden de gegevens omtrent het adres ontleend aan de
      persoonslijst van de moeder, dan wel, indien deze niet als ingezetene is ingeschreven, aan de persoonslijst van
      de vader.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel25
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '46.1'
    text: |-
      Aan de aangifte van verblijf en adres van degene die naar redelijke verwachting gedurende een half jaar ten minste
      twee derden van de tijd in Nederland verblijf zal houden en die zijn adres heeft in de betrokken gemeente, worden
      gegevens betreffende het verblijf, het vorige land van verblijf en het adres ontleend.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel46
  - number: '46.2'
    text: |-
      Indien aannemelijk is dat het gegeven betreffende het vorige land van verblijf onjuist is, wordt dit gegeven niet
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel46
  - number: '46.3'
    text: |-
      Indien een persoon als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college van
      burgemeester en wethouders van de gemeente waar betrokkene zijn adres heeft, ambtshalve zorg voor opneming van
      gegevens betreffende het verblijf, het vorige land van verblijf en het adres. Het college van burgemeester en
      wethouders is bevoegd de gegevens alsnog aan de aangifte van de betrokkene te ontlenen, indien de aangifte na
      afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel46
  - number: '46.4'
    text: |-
      Als datum van aanvang van het verblijf in Nederland en van vestiging van het adres in de gemeente wordt de dag
      opgenomen waarop de aangifte is ontvangen, dan wel de dag waarop van het voornemen tot ambtshalve opneming van
      gegevens over het verblijf en adres aan betrokkene schriftelijk mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel46
  - number: '46.5'
    text: De gegevens worden niet opgenomen dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel46
  - number: '47.1'
    text: |-
      Aan de aangifte van een ingezetene die zijn adres heeft gewijzigd, worden gegevens betreffende het adres ontleend,
      tenzij aannemelijk is dat hij het vermelde adres niet heeft.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel47
  - number: '47.2'
    text: |-
      Indien een ingezetene die zijn adres heeft gewijzigd, in gebreke is met het doen van aangifte, draagt het college
      van burgemeester en wethouders van de gemeente waar betrokkene zijn adres heeft, ambtshalve zorg voor opneming van
      gegevens betreffende het adres. Het is bevoegd de gegevens alsnog aan de aangifte van de betrokkene te ontlenen,
      indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel47
  - number: '47.3'
    text: |-
      Als datum van adreswijziging wordt de dag opgenomen waarop de aangifte is ontvangen, dan wel de dag waarop van
      het voornemen tot ambtshalve opneming van gegevens betreffende het adres aan betrokkene schriftelijk mededeling
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel47
  - number: '48.1'
    text: |-
      Aan de aangifte van vertrek van de ingezetene die naar redelijke verwachting gedurende een jaar ten minste twee
      derden van de tijd buiten Nederland zal verblijven, worden gegevens betreffende het volgende land van verblijf en
      het eerste adres van verblijf in dat land ontleend.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien een ingezetene als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college
      van burgemeester en wethouders van de gemeente van inschrijving ambtshalve zorg voor opneming van gegevens
      betreffende het vertrek, het volgende land van verblijf en het eerste adres van verblijf in dat land. Het college
      van burgemeester en wethouders is bevoegd de gegevens alsnog aan de aangifte van de ingezetene te ontlenen, indien
      de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel48
  - number: '48.3'
    text: |-
      Als datum van vertrek uit Nederland en van opheffing van het adres wordt de dag opgenomen waarop de aangifte is
      ontvangen, dan wel de dag waarop van het voornemen tot ambtshalve opneming van gegevens over het vertrek aan de
      ingeschrevene schriftelijk mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel48
  - number: '48.4'
    text: |-
      Indien de ingezetene in de aangifte van vertrek meldt te gaan verblijven in Aruba, Curaçao, Sint Maarten of
      in een van de openbare lichamen, verstrekt het college van burgemeester en wethouders aan hem kosteloos een
      verhuisbericht, volgens een door Onze Minister vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel48
  - number: '49.1'
    text: |-
      Indien het woonadres ontbreekt dan wel [artikel 67][ref1] van toepassing is, wordt op aangifte een briefadres
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel67
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '67'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '49.2'
    text: |-
      Met betrekking tot de ingeschrevene die in verband met zijn vertrek uit Nederland geen ingezetene is, wordt het
      eerste adres van verblijf in het volgende land van verblijf opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel49
  - number: '50.1'
    text: |-
      Het administratienummer wordt toegekend op een door Onze Minister te bepalen wijze uit door hem beschikbaar
      gestelde nummers.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '50.2'
    text: Het administratienummer bevat geen informatie omtrent de persoon op wie het betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '50.3'
    text: |-
      Onze Minister, onderscheidenlijk het college van burgemeester en wethouders, draagt zorg dat het
      administratienummer foutloos en slechts één maal beschikbaar wordt gesteld, onderscheidenlijk wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '50.4'
    text: |-
      De administratienummers van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde partner, de eerdere
      geregistreerde partners en de kinderen worden ontleend aan de desbetreffende persoonslijsten.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '50.5'
    text: |-
      De datum waarop het administratienummer van de ouder, de echtgenoot, de eerdere echtgenoot, de geregistreerde
      partner, de eerdere geregistreerde partner of het kind van kracht is geworden, wordt slechts op de persoonslijst
      van de ingeschrevene opgenomen, indien die datum ligt na de datum waarop de familierechtelijke betrekking met de
      ingeschrevene is ontstaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '50.6'
    text: |-
      Het administratienummer van een persoon die laatstelijk als ingezetene was ingeschreven in een basisadministratie
      in Aruba, Curaçao, Sint Maarten of in een van de openbare lichamen, wordt bij de inschrijving ontleend aan de
      mededeling van de verantwoordelijke voor de verwerking van gegevens in die basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel50
  - number: '51.1'
    text: |-
      Het burgerservicenummer dat aan een persoon is toegekend overeenkomstig
      [artikel 8 van de Wet algemene bepalingen burgerservicenummer][ref1] wordt opgenomen op zijn persoonslijst, voordat
      over de betrokken persoon voor de eerste keer gegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: '51.2'
    text: |-
      De gegevens over het burgerservicenummer van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde
      partner, de eerdere geregistreerde partners en de kinderen worden ontleend aan de desbetreffende persoonslijsten.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel51
  - number: '51.3'
    text: |-
      De datum waarop het burgerservicenummer van de ouder, de echtgenoot, de eerdere echtgenoot, de geregistreerde
      partner, de eerdere geregistreerde partner of het kind van kracht is geworden, wordt slechts op de persoonslijst
      van de ingeschrevene opgenomen, indien die datum ligt na de datum waarop de familierechtelijke betrekking met de
      ingeschrevene is ontstaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel51
  - number: '52'
    text: |-
      De gegevens over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde
      partner of de eerdere geregistreerde partner worden opgenomen op schriftelijk verzoek van de daartoe krachtens
      [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref1] bevoegde ingeschrevene, dan wel op grond van een
      rechterlijke uitspraak als bedoeld in [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '9'
  - number: '53'
    text: |-
      Met betrekking tot de ingeschrevene die geen ingezetene is, worden geen nieuwe algemene gegevens opgenomen,
      tenzij deze feiten betreffen die zich hebben voorgedaan in de tijd dat hij nog ingezetene was, of die bij algemene
      maatregel van bestuur zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel53
  - number: '54'
    text: |-
      Omtrent de beslissing dat een opgenomen algemeen gegeven onjuist is of, indien het een gegeven over de burgerlijke
      staat betreft, in strijd is met de Nederlandse openbare orde, omtrent een onderzoek naar die onjuistheid of
      strijdigheid, alsmede omtrent het van toepassing zijn van [artikel 53][ref1], wordt een aantekening geplaatst bij
      de desbetreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel53
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '53'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '55.1'
    text: |-
      De ambtenaar van de burgerlijke stand die in een van de onder hem berustende registers melding heeft gemaakt van
      een feit dat van belang is voor de bijhouding van een basisadministratie, brengt de gegevens ter zake terstond ter
      kennis van zijn college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel55
  - number: '55.2'
    text: |-
      Een hem ingevolge een verdrag inzake de internationale uitwisseling van gegevens op het gebied van de burgerlijke
      stand toegezonden kennisgeving doet hij terstond toekomen aan zijn college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel55
  - number: '55.3'
    text: |-
      Hij verstrekt aan het college van burgemeester en wethouders dat daarom vraagt, zo spoedig mogelijk alle
      inlichtingen die dat college nodig heeft voor de bijhouding van de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel55
  - number: '55.4'
    text: |-
      De ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage, die wegens het ontbreken
      van een akte in de onder hem berustende registers geen latere vermelding als bedoeld in
      [artikel 20, Boek 1, van het Burgerlijk Wetboek][ref1] toevoegt van een hem op grond van [artikel 20][ref2]
      toegezonden besluit, rechterlijke uitspraak of notariële akte, brengt een afschrift van dat besluit, die uitspraak
      of die akte ter kennis van zijn college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20e
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 20e
  - number: '56.1'
    text: |-
      De griffier van de rechtbank die in het curatele- en bewindregister melding heeft gemaakt van een rechterlijke
      uitspraak waarbij met betrekking tot een persoon een voorziening in de curatele is getroffen, doet daarvan
      mededeling aan het college van burgemeester en wethouders van de gemeente van inschrijving, dan wel indien deze
      onbekend is, aan het college van burgemeester en wethouders van de gemeente waar de rechtbank is gevestigd, onder
      vermelding welke persoon het betreft en de datum waarop de rechtsgeldigheid van de voorziening ingaat.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel56
  - number: '56.2'
    text: |-
      De in het eerste lid bedoelde griffier doet overeenkomstige mededeling van elke beslissing, houdende vernietiging
      van een rechterlijke uitspraak als bedoeld in het eerste lid, en van beëindiging van de curatele.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel56
  - number: '56.3'
    text: |-
      De griffier van de rechtbank die in het gezagsregister aantekening heeft gehouden van een wijziging in het gezag
      dat over een minderjarige wordt uitgeoefend, welke van belang is voor de bijhouding van een basisadministratie,
      met betrekking tot de in [artikel 34, eerste lid, onder a, sub 3°][ref1], bedoelde gegevens, doet van de wijziging
      mededeling aan het college van burgemeester en wethouders van de gemeente van inschrijving van de minderjarige,
      dan wel indien deze gemeente onbekend is, aan het college van burgemeester en wethouders van de gemeente waar het
      bestuur van de rechtbank is gezeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '56.4'
    text: |-
      De in het derde lid bedoelde mededeling geeft uitsluitend aan welke minderjarige het betreft, welke van de in
      [bijlage I, onder 3][ref1], vermelde aantekeningen door de wijziging van toepassing wordt en welke niet meer van
      toepassing is, alsmede de datum waarop de wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '57.1'
    text: |-
      Indien Onze Minister van Justitie in het openbaar register, bedoeld in
      [artikel 22, eerste lid, van de Rijkswet op het Nederlanderschap][ref1], melding heeft gemaakt van het feit
      dat een persoon een verklaring tot verkrijging van het Nederlanderschap of een verklaring van afstand van het
      Nederlanderschap heeft afgelegd en de verklaring door de betrokkene niet in zijn gemeente van inschrijving is
      afgelegd, dan wel dat een persoon door verlening het Nederlanderschap heeft verkregen of door intrekking van het
      besluit waarbij het Nederlanderschap is verleend, het Nederlanderschap heeft verloren, doet hij daarvan mededeling
      aan het college van burgemeester en wethouders van de gemeente in de basisadministratie waarvan de betreffende
      persoon is ingeschreven. De mededeling bevat de datum waarop de verklaring in ontvangst is genomen of de datum
      waarop het Nederlanderschap is verkregen of verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '22'
  - number: '57.2'
    text: |-
      De griffier van de rechtbank Den Haag dan wel de griffier van de Hoge Raad zendt van een in kracht van gewijsde
      gegane rechterlijke uitspraak houdende de vaststelling van het Nederlanderschap of de vaststelling van het niet-
      bezitten van het Nederlanderschap, een afschrift aan het college van burgemeester en wethouders van de gemeente
      van inschrijving, dan wel indien deze onbekend is aan het college van burgemeester en wethouders van de gemeente
      's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel57
  - number: '58.1'
    text: |-
      Onze Minister van Justitie doet van de gegevens over het verblijfsrecht van de vreemdeling, die voor de bijhouding
      van de basisadministratie van belang zijn, mededeling aan het college van burgemeester en wethouders van de
      gemeente waar de betrokken vreemdeling in de basisadministratie is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel58
  - number: '58.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de in het eerste
      lid bedoelde mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel58
  - number: '60'
    text: |-
      De griffier van het betrokken gerecht zendt van een in kracht van gewijsde gegane uitspraak als bedoeld in
      [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref1] een afschrift aan het college van burgemeester en
      wethouders van de gemeente van inschrijving van de onbevoegd verklaarde, dan wel indien deze gemeente onbekend is
      aan het college van burgemeester en wethouders van de gemeente 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
  - number: '61'
    text: |-
      Onze Minister van Buitenlandse Zaken doet van de in [artikel 32][ref1] bedoelde aanwijzing, of van de beëindiging
      van de aanwijzing, mededeling aan het college van burgemeester en wethouders van de betrokken gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel32
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '62.1'
    text: |-
      Een afnemer die gerede twijfel heeft over de juistheid van een authentiek gegeven dat hij verstrekt heeft gekregen
      uit de basisadministratie, doet hiervan mededeling aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister wijst de buitengemeentelijke afnemers aan die tevens mededeling doen in verband met andere dan
      authentieke gegevens die aan hen verstrekt zijn.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel62
  - number: '62.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de gevallen waarin en de wijze waarop de mededeling wordt
      gedaan, alsmede de kennisgeving van het college van burgemeester en wethouders aan de afnemer naar aanleiding van
      een mededeling, geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel62
  - number: '62.4'
    text: |-
      Het college van burgemeester en wethouders kan nadere regels stellen omtrent het doen van mededeling door en
      de kennisgeving aan binnengemeentelijke afnemers en kan de binnengemeentelijke afnemers aanwijzen die tevens
      mededeling doen in verband met andere dan authentieke gegevens die aan hen verstrekt zijn.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel62
  - number: '62.5'
    text: |-
      Voorzover een mededeling als bedoeld in het eerste lid betrekking heeft op een gegeven dat bij of krachtens
      een andere wet is overgenomen uit een andere registratie, zendt het college van burgemeester en wethouders die
      mededeling door aan de verantwoordelijke voor de verwerking van dat gegeven in die andere registratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel62
  - number: '63.1'
    text: |-
      Een college van burgemeester en wethouders dat van de ambtenaar van de burgerlijke stand in de gemeente gegevens
      heeft ontvangen die van belang zijn voor de bijhouding van de basisadministratie van een andere gemeente, doet
      terstond mededeling van die gegevens aan het college van burgemeester en wethouders van de andere gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel63
  - number: '63.2'
    text: |-
      Een college van burgemeester en wethouders dat van de ambtenaar van de burgerlijke stand in de gemeente een
      ingevolge een verdrag inzake de internationale uitwisseling van gegevens op het gebied van de burgerlijke stand
      toegezonden kennisgeving heeft ontvangen die van belang is voor de bijhouding van de basisadministratie van een
      andere gemeente, doet die kennisgeving terstond toekomen aan het college van burgemeester en wethouders van de
      andere gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel63
  - number: '63.3'
    text: |-
      Een college van burgemeester en wethouders verstrekt aan een ander college van burgemeester en wethouders spontaan
      of op verzoek zo spoedig mogelijk alle andere inlichtingen die van belang zijn voor een goede uitvoering van de
      taak met betrekking tot de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel63
  - number: '64'
    text: |-
      Bij algemene maatregel van bestuur kunnen verplichtingen worden geregeld tot verschaffing aan het college van
      burgemeester en wethouders van de gegevens, bedoeld in [artikel 34, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '65.1'
    text: |-
      Degene die naar redelijke verwachting gedurende een half jaar ten minste twee derden van de tijd in Nederland
      verblijf zal houden, is verplicht zich binnen vijf dagen na de aanvang van zijn verblijf in persoon te melden bij
      het college van burgemeester en wethouders van de gemeente waar hij zijn woonadres heeft om daarbij schriftelijk
      aangifte van verblijf en adres te doen. Indien hij geen woonadres heeft, is hij verplicht een briefadres te kiezen
      en dient hij zich binnen de gestelde termijn te melden bij het college van burgemeester en wethouders van de
      gemeente waar hij zijn briefadres heeft om de bedoelde aangifte te doen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: '65.2'
    text: |-
      Hij doet in de aangifte mededeling van zijn toekomstig verblijf in Nederland, van het vorige land van verblijf en
      van zijn adres in de gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: '65.3'
    text: |-
      Hij is verplicht bij de aangifte de inlichtingen te geven en de geschriften over te leggen ter zake van feiten
      betreffende zijn burgerlijke staat, zijn nationaliteit en zijn eerder verblijf in Nederland, die noodzakelijk zijn
      voor de bijhouding met betrekking tot hem van de basisadministratie. Op verzoek van het college van burgemeester
      en wethouders legt hij van een geschrift een door een beëdigde vertaler vervaardigde Nederlandse vertaling over.
      Indien hij zich in Nederland vestigt, komende vanuit Aruba, Curaçao, Sint Maarten, Bonaire, Sint Eustatius of
      Saba, is hij verplicht een hem betreffend verhuisbericht over te leggen, verstrekt door de verantwoordelijke voor
      de verwerking van gegevens in de basisadministratie in Aruba, Curaçao, Sint Maarten of in een van de openbare
      lichamen, waar hij laatstelijk als ingezetene was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: '65.4'
    text: |-
      Ten behoeve van de in [artikel 109, vierde lid][ref1], bedoelde verstrekking van gegevens aan het Centraal Bureau
      voor de Statistiek kan bij algemene maatregel van bestuur worden bepaald dat bij de aangifte opgave wordt gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel109
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '109'
        hoofdstuk: '3'
        afdeling: '4'
  - number: 65.4.a
    text: van de voorgenomen verblijfsduur in Nederland;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: 65.4.b
    text: |-
      indien de aangifte een vrouw betreft die geen ingeschrevene is, van bij de maatregel vast te stellen gegevens over
      haar levend geboren kinderen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: '65.5'
    text: |-
      Tot het doen van aangifte van verblijf en adres overeenkomstig het eerste tot en met het vierde lid is eveneens
      verplicht degene die naar redelijke verwachting gedurende een half jaar ten minste twee derden van de tijd in
      Nederland verblijf zal houden, op het moment dat:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: 65.5.a
    text: |-
      ten aanzien van hem de in [artikel 32][ref1] bedoelde aanwijzing wordt beëindigd, of


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel32
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 65.5.b
    text: |-
      hij ophoudt te behoren tot een categorie als bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel33
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '65.6'
    text: |-
      In een geval als bedoeld in het vijfde lid vangt de in het eerste lid bedoelde termijn van vijf dagen aan met
      ingang van de dag na die waarop een in het vijfde lid bedoelde situatie is ingetreden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: '65.7'
    text: 'Aangifte van verblijf en adres blijft achterwege indien:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: 65.7.a
    text: het verblijf aanvangt door geboorte en inschrijving plaatsvindt op grond van de geboorteakte,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
  - number: 65.7.b
    text: |-
      ten aanzien van de betrokkene een aanwijzing als bedoeld in [artikel 32][ref1] van kracht is,


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel32
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 65.7.c
    text: |-
      de betrokkene behoort tot een categorie van personen als bedoeld in [artikel 33][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel33
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 65.7.d
    text: |-
      de betrokkene een vreemdeling is die niet is ingeschreven in een basisadministratie en geen rechtmatig verblijf
      geniet als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '66.1'
    text: |-
      De ingezetene die zijn adres wijzigt, is verplicht binnen vijf dagen na de wijziging van het adres bij het
      college van burgemeester en wethouders van de gemeente waar hij zijn nieuwe adres heeft, schriftelijk aangifte van
      adreswijziging te doen. Indien een ingezetene geen woonadres heeft, dient hij een briefadres te kiezen en is hij
      verplicht overeenkomstig het bepaalde in de vorige volzin aangifte van adreswijziging te doen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel66
  - number: '66.2'
    text: Hij doet in die aangifte mededeling van het nieuwe en het vorige adres.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel66
  - number: '67.1'
    text: |-
      Degene die zijn woonadres heeft in een instelling die is aangewezen op grond van het derde of het vierde lid kan,
      in afwijking van de [artikelen 65, eerste lid][ref1], en [66, eerste lid][ref2], in plaats van zijn woonadres een
      briefadres kiezen en daarvan overeenkomstig de genoemde bepalingen aangifte doen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '67.2'
    text: |-
      Instellingen worden slechts aangewezen indien de aard van de instelling meebrengt, dat door opneming van het adres
      daarvan in de basisadministratie de persoonlijke levenssfeer van de betrokkenen onevenredig zou kunnen worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: '67.3'
    text: 'Onze Minister kan categorieën van instellingen dan wel instellingen afzonderlijk aanwijzen, voor zover het betreft:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: 67.3.a
    text: instellingen voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: 67.3.b
    text: instellingen op het gebied van de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: 67.3.c
    text: penitentiaire instellingen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: '67.4'
    text: |-
      Het college van burgemeester en wethouders kan een in de gemeente gevestigde instelling aanwijzen
      indien het betreft een instelling op het terrein van maatschappelijke opvang, bedoeld in
      [1, eerste lid, onderdeel g, onder 7°, van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: '67.5'
    text: |-
      Het hoofd van een aangewezen instelling doet aan de betrokken personen tijdig schriftelijk mededeling van de
      mogelijkheid tot aangifte van een briefadres.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel67
  - number: '68.1'
    text: |-
      De ingezetene die naar redelijke verwachting gedurende een jaar ten minste twee derden van de tijd buiten Nederland
      zal verblijven, is verplicht bij het college van burgemeester en wethouders van de gemeente van inschrijving binnen
      vijf dagen voor zijn vertrek uit Nederland schriftelijk aangifte van vertrek te doen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel68
  - number: '68.2'
    text: |-
      Hij doet in die aangifte mededeling van dat vertrek, van het volgende land van verblijf en van het eerste adres van
      verblijf in dat land.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel68
  - number: '68.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent bijzondere gevallen waarin het eerste lid
      niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel68
  - number: '69'
    text: |-
      De ingezetene is verplicht zo spoedig mogelijk aan het college van burgemeester en wethouders van de gemeente
      van inschrijving alle feiten betreffende zijn burgerlijke staat en nationaliteit die zich buiten Nederland
      hebben voorgedaan, ter kennis te brengen en aan het college, desverlangd in persoon, de inlichtingen te
      geven en de geschriften over te leggen die noodzakelijk zijn voor de bijhouding met betrekking tot hem van de
      basisadministratie. Op verzoek van het college van burgemeester en wethouders legt hij van een geschrift een door
      een beëdigde vertaler vervaardigde Nederlandse vertaling over.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel69
  - number: '70.1'
    text: |-
      Degene die aangifte heeft gedaan als bedoeld in de [artikelen 65 tot en met 68][ref1], is verplicht om op verzoek
      van het college van burgemeester en wethouders, desverlangd in persoon, ter zake van zijn aangifte de inlichtingen
      te geven en de geschriften over te leggen die van belang zijn voor de bijhouding met betrekking tot hem van de
      basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '70.2'
    text: |-
      In de aangifte van een briefadres dienen de redenen voor de aangifte van een briefadres te worden medegedeeld. Bij
      de aangifte dient een schriftelijke verklaring van instemming te worden gevoegd van degene bij wie het briefadres
      wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel70
  - number: '70.3'
    text: |-
      Degene bij wie het briefadres wordt gehouden, is verplicht om op verzoek van het college van burgemeester en
      wethouders, desverlangd in persoon, ter zake van dat briefadres de inlichtingen te geven en de geschriften over te
      leggen die noodzakelijk zijn voor de bijhouding van de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel70
  - number: '71'
    text: |-
      De ingezetene is verplicht op verzoek van het college van burgemeester en wethouders over feiten betreffende
      zijn burgerlijke staat en nationaliteit, desverlangd in persoon, de inlichtingen te verschaffen en de geschriften
      over te leggen die noodzakelijk zijn voor de bijhouding van de basisadministratie. Op verzoek van het college
      van burgemeester en wethouders legt hij van een geschrift een door een beëdigde vertaler vervaardigde Nederlandse
      vertaling over.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel71
  - number: '72'
    text: |-
      Degene ten aanzien van wie het college van burgemeester en wethouders het redelijke vermoeden heeft dat hij in
      gebreke is met het doen van een aangifte als bedoeld in de [artikelen 65 tot en met 68][ref1], is verplicht om
      op verzoek van het college van burgemeester en wethouders, desverlangd in persoon, ter zake de inlichtingen te
      geven en de geschriften over te leggen die noodzakelijk zijn voor de bijhouding met betrekking tot hem van de
      basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '73'
    text: |-
      De verplichtingen, vermeld in de [artikelen 65][ref1], [66][ref2] en [68 tot en met 72][ref3], rusten op:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 73.a
    text: ouders, voogden en verzorgers voor minderjarigen jonger dan 16 jaar;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel73
  - number: 73.b
    text: |-
      ouders, voogden en verzorgers voor inwonende minderjarigen van 16 jaar of ouder, tenzij de minderjarige zelf de
      verplichting vervult;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel73
  - number: 73.c
    text: curatoren voor onder curatele gestelden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel73
  - number: '74.1'
    text: |-
      De verplichtingen, vermeld in de [artikelen 65][ref1], [66][ref2] en [68 tot en met 72][ref3], kunnen worden
      vervuld door:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 74.1.a
    text: de ouder en zijn meerderjarige kind, indien beiden hetzelfde woonadres hebben, voor elkaar;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
  - number: 74.1.b
    text: echtgenoten dan wel geregistreerde partners die hetzelfde woonadres hebben, voor elkaar;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
  - number: 74.1.c
    text: elke meerderjarige voor een persoon die hem daartoe schriftelijk gemachtigd heeft;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
  - number: 74.1.d
    text: |-
      het hoofd van een instelling voor gezondheidszorg voor een in die instelling verblijvende persoon die wegens de
      toestand van zijn gezondheid niet in staat kan worden geacht aan zijn verplichtingen te voldoen of een machtiging
      daartoe te geven, dan wel de echtgenoot, de geregistreerde partner of andere levensgezel of de bloed- of
      aanverwanten tot en met de tweede graad van een zodanig persoon, onder overlegging van een schriftelijke verklaring
      ter zake van het hoofd van de desbetreffende instelling.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
  - number: '74.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, kan het college van burgemeester en wethouders de vertegenwoordigde
      overeenkomstig de genoemde artikelen oproepen om in persoon te verschijnen tot het verschaffen van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel74
  - number: '75'
    text: |-
      Het hoofd van een instelling of bedrijf waar personen verblijf plegen te houden, de instellingen, bedoeld in
      [artikel 67][ref1] daaronder begrepen, doet, indien de instelling of het bedrijf ter zake door het college van
      burgemeester en wethouders is aangewezen, op door het college van burgemeester en wethouders te bepalen tijdstippen
      aan het college van burgemeester en wethouders mededeling van de personen die naar redelijke verwachting in de
      instelling of het bedrijf voor onbepaalde tijd verblijf zullen houden dan wel gedurende drie maanden ten minste
      twee derden van de tijd zullen overnachten.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel67
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '67'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '76'
    text: |-
      De echtgenoot, de geregistreerde partner en de nabestaanden tot en met de tweede graad van een ingezetene die in
      het buitenland is overleden, zijn op verzoek van het college van burgemeester en wethouders van de gemeente waar
      betrokkene is ingeschreven, verplicht aan het college over dat overlijden, voor zover mogelijk, de inlichtingen te
      geven en de geschriften over te leggen die noodzakelijk zijn voor de bijhouding van de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel76
  - number: '77.1'
    text: |-
      Degene die ingevolge deze afdeling in persoon verschijnt bij het college van burgemeester en wethouders, is
      verplicht desgevraagd met het oog op de vaststelling van zijn identiteit een op hem betrekking hebbend document
      over te leggen als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '77.2'
    text: |-
      De in [artikel 73][ref1] bedoelde ouders, voogden, verzorgers en curatoren van minderjarigen of onder curatele
      gestelden, zijn met het oog op de vaststelling van de identiteit van de minderjarige of de onder curatele gestelde
      desgevraagd verplicht, deze te laten verschijnen bij het college van burgemeester en wethouders en een op de
      minderjarige of de onder curatele gestelde betrekking hebbend document als bedoeld in het eerste lid over te
      leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel73
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '73'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '78.1'
    text: |-
      Het college van burgemeester en wethouders zendt binnen vier weken na een inschrijving als bedoeld in de
      [artikelen 25][ref1] en [26][ref2], alsmede binnen vier weken nadat een ingeschrevene die geen ingezetene was weer
      ingezetene is geworden, aan de ingeschrevene kosteloos en in begrijpelijke vorm een volledig overzicht van zijn
      persoonslijst, behoudens het bepaalde in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '78.2'
    text: |-
      Bij minderjarigen jonger dan 16 jaar en bij onder curatele gestelden geschiedt de toezending aan de ouders, voogden
      of verzorgers onderscheidenlijk aan de curator.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel78
  - number: '78.3'
    text: |-
      Bij de toezending wordt schriftelijk mededeling gedaan van de hoofdlijnen van de terzake van de basisadministratie
      geldende regels, waaronder ten minste de hoofdlijnen van de regels betreffende de identiteit van de voor de
      verwerking verantwoordelijke, de doeleinden van de basisadministratie, het vestigingsregister en de in de
      [artikelen 136 tot en met 142][ref1] genoemde bestaande registers, de opgenomen gegevenscategorieën, de categorieën
      van ontvangers van gegevens en de rechten van de ingeschrevene.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '78.4'
    text: |-
      Degene die een aangifte van verblijf en adres doet, wordt bij die gelegenheid schriftelijk op de hoogte gesteld van
      het recht, bedoeld in [artikel 102, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel102
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '102'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '78.5'
    text: |-
      Het in het eerste lid bedoelde overzicht van de persoonslijst bevat geen gegevens over de verstrekking van gegevens
      aan afnemers, voor zover dit noodzakelijk is in het belang van de veiligheid van de staat of de voorkoming,
      opsporing en vervolging van strafbare feiten. Bij of krachtens algemene maatregel van bestuur kan een nadere
      regeling worden getroffen welke afnemers het betreft en in verband met welke aan deze afnemers opgedragen
      wettelijke taken het niet vermelden van het gegeven over de verstrekking noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel78
  - number: '79.1'
    text: |-
      Het college van burgemeester en wethouders deelt een ieder op diens verzoek schriftelijk binnen vier weken
      kosteloos mede of hem betreffende persoonsgegevens in de basisadministratie worden verwerkt. Indien zodanige
      gegevens worden verwerkt, wordt de verzoeker met betrekking tot de gemeentelijke basisadministratie de in
      [artikel 78, derde lid][ref1], bedoelde schriftelijke mededeling gedaan. [Artikel 78, vijfde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel78
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '78'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '78'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '79.2'
    text: |-
      Het college van burgemeester en wethouders verleent een ieder op diens verzoek binnen vier weken kosteloos inzage
      in hem betreffende gegevens in de basisadministratie.[ Artikel 78, vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel78
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '78'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '79.3'
    text: |-
      Het college van burgemeester en wethouders verstrekt een ieder op diens verzoek binnen vier weken een, desverlangd
      gewaarmerkt, afschrift in begrijpelijke vorm van de hem betreffende persoonsgegevens die in de basisadministratie
      worden verwerkt, alsmede de beschikbare informatie over de oorsprong van die gegevens voor zover die niet van de
      verzoeker zelf afkomstig zijn. [Artikel 78, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel78
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '78'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '79.4'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor een deugdelijke vaststelling van de identiteit van
      de verzoeker.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
  - number: '79.5'
    text: 'De verzoeken, bedoeld in het eerste, het tweede en het derde lid, worden gedaan door:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
  - number: 79.5.a
    text: ouders, voogden of verzorgers voor minderjarigen jonger dan 16 jaar;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
  - number: 79.5.b
    text: curatoren voor onder curatele gestelden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
  - number: '79.6'
    text: |-
      Aan een verzoek als bedoeld in het eerste, tweede en derde lid, wordt geen gevolg gegeven indien dat niet met een
      redelijke tussenpoos is gedaan ten opzichte van een eerder verzoek.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel79
  - number: '80.1'
    text: |-
      Het college van burgemeester en wethouders neemt op schriftelijk verzoek van de daartoe krachtens
      [artikel 9, Boek 1, van het Burgerlijk Wetboek][ref1] bevoegde ingeschrevene binnen vier weken op zijn
      persoonslijst de gegevens op over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de
      geregistreerde partner of de eerdere geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
  - number: '80.2'
    text: |-
      Het college van burgemeester en wethouders wijzigt, in afwijking van [artikel 37, vierde lid][ref1], op
      schriftelijk verzoek van de ingeschrevene die de leeftijd van 16 jaar heeft bereikt, binnen vier weken op zijn
      persoonslijst de algemene gegevens over de naam en het geslacht van een ouder of het algemeen gegeven over de naam
      van het kind van de ingeschrevene, in verband met een rechterlijke last tot wijziging van de vermelding van het
      geslacht in de geboorteakte.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel37
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '80.3'
    text: |-
      Het college van burgemeester en wethouders doet van de opneming van de gegevens terstond schriftelijk mededeling
      aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel80
  - number: '81.1'
    text: |-
      Het college van burgemeester en wethouders verwijdert op schriftelijk verzoek van de adoptiefouders van een
      minderjarige jonger dan 16 jaar, of op schriftelijk verzoek van een adoptiefkind van 16 jaar of ouder, binnen vier
      weken kosteloos van de persoonslijst van het adoptiefkind, de vóór de adoptie geldende algemene gegevens voor zover
      het betreft:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.1.a
    text: gegevens over de naam;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.1.b
    text: gegevens over één of beide ouders;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.1.c
    text: gegevens over de bij de adoptie verloren nationaliteit;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.1.d
    text: |-
      gegevens over de gemeente van inschrijving en het adres in die gemeente alsmede over het verblijf in Nederland en
      het vertrek uit Nederland.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: '81.2'
    text: |-
      Het college van burgemeester en wethouders verwijdert op schriftelijk verzoek van de ouder met wie door een
      uitspraak van adoptie de familierechtelijke betrekkingen tot een kind zijn verbroken, binnen vier weken kosteloos
      van de persoonslijst van die ouder de gegevens over dat kind.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: '81.3'
    text: |-
      Het college van burgemeester en wethouders verwijdert op schriftelijk verzoek van de ingeschrevene binnen vier
      weken kosteloos van de persoonslijst van de ingeschrevene de algemene gegevens die zijn gewijzigd in verband met
      een rechterlijke last tot wijziging van de vermelding van het geslacht in de akte van geboorte of een verzoek als
      bedoeld in [artikel 80, tweede lid][ref1], voor zover deze gegevens golden vóór de wijziging en het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel80
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '80'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 81.3.a
    text: gegevens over de naam;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.3.b
    text: gegevens over het geslacht;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: 81.3.c
    text: |-
      gegevens over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde partner
      of de eerdere geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: '81.4'
    text: |-
      [Artikel 79, vierde lid][ref1], is van toepassing op een verzoek als bedoeld in het eerste, tweede of derde lid.
      Op een verzoek als bedoeld in het derde lid is bovendien [artikel 79, vijfde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '81.5'
    text: |-
      Het college van burgemeester en wethouders doet van de verwijdering terstond schriftelijk mededeling aan de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel81
  - number: '82.1'
    text: |-
      Het college van burgemeester en wethouders voldoet binnen vier weken kosteloos aan het verzoek van betrokkene hem
      betreffende gegevens in de basisadministratie te verbeteren, aan te vullen of te verwijderen, indien deze feitelijk
      onjuist dan wel onvolledig zijn of in strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de
      aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel82
  - number: '82.2'
    text: |-
      Het college van burgemeester en wethouders geeft aan het verzoek uitvoering met inachtneming van het bepaalde bij
      of krachtens de eerste afdeling van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel82
  - number: '82.3'
    text: |-
      De termijn, bedoeld in het eerste lid, kan, voor zover noodzakelijk, met telkens acht weken worden verlengd, indien
      het verzoek betrekking heeft op gegevens over de burgerlijke staat of de nationaliteit. Van de verlenging wordt
      terstond schriftelijk mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel82
  - number: '82.4'
    text: |-
      [Artikel 79, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '82.5'
    text: |-
      Het college van burgemeester en wethouders doet van de uitvoering van het verzoek terstond schriftelijk mededeling
      aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel82
  - number: '83'
    text: 'Een beslissing van het college van burgemeester en wethouders om:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.a
    text: aan een aangifte geen of slechts ten dele gevolg te geven;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.b
    text: |-
      een gegeven over de burgerlijke staat niet op te nemen, dan wel een geschrift daarover dat als akte is aangeboden
      niet als zodanig aan te merken;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.c
    text: een gegeven over de nationaliteit niet op te nemen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.d
    text: |-
      ambtshalve over te gaan tot inschrijving, of tot opneming van gegevens in het geval dat inschrijving of opneming op
      grond van een aangifte had moeten geschieden;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.e
    text: |-
      bij een opgenomen algemeen gegeven een aantekening over de onjuistheid van dat gegeven of over de strijdigheid
      daarvan met de Nederlandse openbare orde te plaatsen;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
  - number: 83.f
    text: |-
      niet te voldoen aan een verzoek als bedoeld in de [artikelen 79 tot en met 82][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '86.1'
    text: |-
      Indien de rechter het beroep, ingesteld tegen een besluit als bedoeld in [artikel 83][ref1], gegrond verklaart met
      toepassing van [artikel 8:72, derde lid, onderdeel b, of vierde lid, van de Algemene wet bestuursrecht][ref2], doet
      hij dat met inachtneming van het bepaalde bij of krachtens de eerste afdeling van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '83'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '86.2'
    text: |-
      Voor zover een besluit als bedoeld in [artikel 83][ref1] het Nederlanderschap betreft, kan de
      betrokkene zich uitsluitend wenden tot de rechtbank Den Haag met een verzoek als bedoeld in
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '83'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '88.1'
    text: |-
      Aan een afnemer worden op zijn verzoek de algemene gegevens en de verwijsgegevens verstrekt die noodzakelijk zijn
      voor de vervulling van zijn taak. Het verzoek behelst de gronden voor de verstrekking.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel88
  - number: '88.2'
    text: |-
      Voor zover krachtens het bepaalde in deze afdeling een algemeen gegeven wordt verstrekt waarbij een aantekening
      is geplaatst als bedoeld in [artikel 54][ref1], wordt dat gegeven uitsluitend verstrekt onder mededeling van die
      aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel54
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '54'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '88.3'
    text: |-
      Voor zover krachtens het bepaalde in deze afdeling algemene gegevens of verwijsgegevens aan een afnemer
      kunnen worden verstrekt, wordt hem op zijn verzoek slechts mededeling gedaan van daarop betrekking hebbende
      administratieve gegevens, voor zover de verzoeker aantoont dat deze gegevens noodzakelijk zijn voor de vervulling
      van zijn taak. Geen gegevens worden verstrekt, waaruit de verstrekking van gegevens uit de basisadministratie aan
      een afnemer kan worden afgeleid, voor zover dit noodzakelijk is in het belang van de veiligheid van de staat of de
      voorkoming, opsporing en vervolging van strafbare feiten. Bij of krachtens algemene maatregel van bestuur kan een
      nadere regeling worden getroffen welke afnemers het betreft en in verband met welke aan deze afnemers opgedragen
      wettelijke taken het niet vermelden van het gegeven over de verstrekking noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel88
  - number: '88.4'
    text: |-
      Voor zover krachtens het bepaalde in deze afdeling gegevens aan een afnemer kunnen worden verstrekt, wordt hem op
      zijn verzoek een gewaarmerkt afschrift van de in het verzoek aangewezen gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel88
  - number: '89.1'
    text: |-
      De bijzondere gegevens, bedoeld in [artikel 34, eerste lid, letter ][ref1], worden, voor zover noodzakelijk voor
      de vervulling van de taak van de betrokken afnemer, uitsluitend en op zijn verzoek aan een van de volgende afnemers
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 89.1.a
    text: |-
      afnemers die betrokken zijn bij de uitvoering van de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 89.1.b
    text: afnemers die belast zijn met de opsporing of vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel89
  - number: 89.1.c
    text: de directie van het Landelijk Bureau Inning Onderhoudsbijdragen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel89
  - number: '89.2'
    text: |-
      De bijzondere gegevens, bedoeld in [artikel 34, eerste lid, letter ][ref1], worden uitsluitend en op zijn verzoek
      verstrekt aan een afnemer die betrokken is bij de uitvoering van de [Kieswet][ref2] of van andere bij of krachtens
      wet gegeven regelingen betreffende verkiezingen, voor zover noodzakelijk voor de uitvoering van deze regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004627
  - number: '90'
    text: Aan een buitengemeentelijke afnemer wordt geen rechtstreekse toegang verleend tot de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel90
  - number: '91.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden wijzen van systematisch verstrekken van gegevens aan
      buitengemeentelijke afnemers geregeld, die alleen kunnen geschieden op grond van een besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.2'
    text: |-
      Onze Minister neemt een besluit op verzoek van een buitengemeentelijke afnemer. In het verzoek wordt vermeld op
      welke gegevens het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.3'
    text: |-
      Bij het besluit wordt in ieder geval bepaald over welke categorieën van personen gegevens worden verstrekt, welke
      gegevens het betreft en in welke gevallen gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.4'
    text: |-
      Bij de bepaling van de gegevens die systematisch worden verstrekt, worden de gegevens opgenomen die in het verzoek
      zijn vermeld voor zover:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: 91.4.a
    text: |-
      aan de afnemer overeenkomstig de [artikelen 88][ref1] of [89][ref2] de desbetreffende gegevens kunnen worden
      verstrekt,


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel89
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 91.4.b
    text: |-
      het voor de goede vervulling van de taak van de afnemer noodzakelijk is dat de verstrekking op systematische wijze
      plaats vindt en
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: 91.4.c
    text: |-
      het verzoek zijn grond vindt in de uitvoering van een algemeen verbindend voorschrift of in
      de taak tot het verwerken van persoonsgegevens op een wijze die toelaatbaar is ingevolge de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '91.5'
    text: |-
      Aan het besluit kunnen voorschriften en beperkingen worden verbonden in het belang van een zorgvuldige en een
      doelmatige gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.6'
    text: |-
      Onze Minister legt het besluit zo spoedig mogelijk ter inzage. Van de terinzagelegging wordt mededeling gedaan in
      de *Staatscourant*. Daarbij wordt vermeld op welke afnemer het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent de indiening van het
      verzoek en de bekendmaking van het besluit.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
  - number: '91.8'
    text: |-
      Aan de afnemer worden gegevens verstrekt op grond van het besluit, onverminderd de verstrekking die op grond van de
      [artikelen 88][ref1] en [89][ref2] plaats kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel89
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '92.1'
    text: |-
      De verstrekking van gegevens, bedoeld in [artikel 91][ref1], geschiedt over het in [artikel 4][ref2] bedoelde
      netwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel4
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '4'
        hoofdstuk: '1'
  - number: '92.2'
    text: |-
      Onze Minister kan in een besluit als bedoeld in [artikel 91][ref1] bepalen dat de verstrekking op een andere wijze
      geschiedt, indien naar zijn oordeel de doelmatigheid of een gewichtig belang van de afnemer zich verzet tegen
      verstrekking over het netwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '92.3'
    text: |-
      De afnemer is slechts gerechtigd tot de ontvangst van de gegevens over het netwerk indien hij in het bezit is van
      een toestemming als bedoeld in [artikel 17][ref1] of in [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel22
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '22'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '22'
        hoofdstuk: '1'
  - number: '93'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen beperkingen gesteld worden aan de bevoegdheid tot het
      systematisch verstrekken van gegevens aan buitengemeentelijke afnemers op andere wijzen dan overeenkomstig het
      bepaalde in [artikel 91][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '94'
    text: |-
      Indien het voor de vervulling van de taak van een buitengemeentelijke afnemer noodzakelijk is dat aan hem door
      een andere instantie op systematische wijze persoonsgegevens worden verstrekt, en deze gegevens overeenkomstig de
      [artikelen 88][ref1] en [89][ref2] uit de basisadministraties aan hem verstrekt kunnen worden, dient de afnemer een
      verzoek in als bedoeld in [artikel 91][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel91
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '95'
    text: |-
      De verstrekking van gegevens aan een buitengemeentelijke afnemer geschiedt kosteloos, onverminderd het bepaalde in
      en krachtens [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '5'
        hoofdstuk: '1'
  - number: '96.1'
    text: |-
      Bij of krachtens gemeentelijke verordening worden de systematische verstrekking van gegevens aan
      binnengemeentelijke afnemers, de toegang van die afnemers tot de basisadministratie alsmede de verbanden tussen
      de basisadministratie en andere gegevensverzamelingen van de gemeente geregeld. Bij of krachtens deze verordening
      wordt in ieder geval voorzien in de verstrekking van gegevens uit de basisadministratie aan binnengemeentelijke
      afnemers, voor zover deze gegevens noodzakelijk zijn voor de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel96
  - number: '96.2'
    text: |-
      Aan de politie worden door het college van burgemeester en wethouders op verzoek op dezelfde voet als aan de
      binnengemeentelijke afnemers gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel96
  - number: '97'
    text: Aan een derde wordt geen rechtstreekse toegang verleend tot de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel97
  - number: '98.1'
    text: |-
      Aan een derde wordt op schriftelijk verzoek een gewaarmerkt afschrift verstrekt van de algemene gegevens en
      de verwijsgegevens voor zover de verstrekking van die gegevens is voorgeschreven in een algemeen verbindend
      voorschrift, dan wel voor zover die gegevens noodzakelijk zijn in verband met de uitvoering van een algemeen
      verbindend voorschrift en worden gevraagd door een derde die uit hoofde van ambt of beroep gewoonlijk met
      gerechtelijke werkzaamheden is belast. Het verzoek behelst de gronden voor de verstrekking.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel98
  - number: '98.2'
    text: Bij een verstrekking op grond van het eerste lid wordt het administratienummer niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel98
  - number: '98.3'
    text: |-
      [Artikel 88, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '99.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de systematische
      verstrekking van algemene en verwijsgegevens aan:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: 99.1.a
    text: |-
      pensioenfondsen, premiepensioeninstellingen, verzekeraars die overeenkomstig een wettelijke regeling betreffende
      pensioenvoorzieningen belast zijn met de uitvoering van pensioenregelingen, spaarfondsen en fondsen tot uitvoering
      van een regeling inzake vervroegd uittreden,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: 99.1.b
    text: |-
      banken, effecteninstellingen, verzekeraars en beleggingsinstellingen die aanspraken van gerechtigden op, al dan
      niet op termijn opvorderbare gelden, effecten of goederen op de instelling of verzekeraar moeten honoreren,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: 99.1.c
    text: zorgverzekeraars die overeenkomstig een wettelijke regeling zorgverzekeringen aanbieden en uitvoeren,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: '99.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de systematische
      verstrekking van algemene en verwijsgegevens over de naam, de geslachtsnaam van de echtgenoot, de eerdere
      echtgenoot, de geregistreerde partner of de eerdere geregistreerde partner, het gebruik door de ingeschrevene
      van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde partner of de eerdere
      geregistreerde partner, het adres, de gemeente van inschrijving, de geboortedatum, de datum van overlijden
      en het administratienummer aan één samenwerkingsverband van kerkgenootschappen of andere genootschappen op
      geestelijke grondslag, voor zover deze gegevens noodzakelijk zijn voor het verwerken van persoonsgegevens
      betreffende de tot de genootschappen behorende leden op een wijze die toelaatbaar is ingevolge de
      [Wet bescherming persoonsgegevens][ref1]. De maatregel bepaalt welk samenwerkingsverband voor de verstrekking in
      aanmerking komt. [Artikel 88, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel88
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '99.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de systematische
      verstrekking van algemene en verwijsgegevens aan instellingen en voorzieningen voor onderwijs, gezondheidszorg
      en maatschappelijke dienstverlening, voor zover deze gegevens noodzakelijk zijn voor de vervulling van
      hun taak en voor zover de verstrekking haar grond vindt in de uitvoering van een algemeen verbindend
      voorschrift dan wel in het verwerken van persoonsgegevens op een wijze die toelaatbaar is ingevolge de
      [Wet bescherming persoonsgegevens][ref1]. De maatregel bepaalt welke instellingen en voorzieningen voor de
      verstrekking in aanmerking komen. [Artikel 88, tweede, derde en vierde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel88
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '99.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de systematische
      verstrekking van algemene en verwijsgegevens aan de Stichting Centraal Bureau voor Genealogie, voor zover
      deze gegevens noodzakelijk zijn voor de bijhouding van een registratie betreffende overleden personen.
      [Artikel 88, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '99.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de systematische
      verstrekking van algemene en verwijsgegevens aan instellingen die tot taak hebben om een registratie in stand te
      houden betreffende kredieten of schulden van natuurlijke personen, voor zover in de reglementen van de instelling
      ten aanzien van de uitvoering van deze taak is vastgelegd dat:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: 99.5.a
    text: |-
      gegevens in de registratie worden verwerkt ter voorkoming van overkreditering of problematische groei van schulden
      bij natuurlijke personen, en
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: 99.5.b
    text: |-
      gegevens uit de basisadministratie uitsluitend worden verwerkt met het oog op de verificatie van de identiteit van
      de betrokkene bij het aangaan van nieuwe financiële verplichtingen of een traject van schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: '99.6'
    text: |-
      In de regeling, bedoeld in het eerste tot en met het vijfde lid, worden regels gesteld over de bescherming van de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: '99.7'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste tot en met het vijfde lid, wordt
      niet eerder gedaan dan dertig dagen nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
  - number: '99.8'
    text: |-
      De verstrekking van gegevens overeenkomstig het eerste tot en met het vijfde lid, kan alleen geschieden op grond
      van een besluit van Onze Minister. [Artikel 91, tweede, derde en vijfde tot en met zevende lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '99.9'
    text: |-
      Aan een in dit artikel bedoelde derde worden gegevens verstrekt op grond van het besluit, onverminderd de
      verstrekking die op grond van de [artikelen 98][ref1] en [100][ref2] plaats kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel100
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '100'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '99.10'
    text: |-
      Op het verstrekken van gegevens krachtens dit artikel zijn de [artikelen 92][ref1] en [95][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel95
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '92'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '95'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '100.1'
    text: |-
      In andere gevallen dan bedoeld in de [artikelen 98][ref1] en [99][ref2] kan, voor zover daarin bij of krachtens
      gemeentelijke verordening is voorzien, verstrekking van gegevens plaatsvinden aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 100.1.a
    text: |-
      rechtspersonen zonder winstoogmerk, voor zover de verstrekking noodzakelijk is in het belang van de bescherming
      van de betrokkene of van de rechten en vrijheden van anderen, waarbij wordt nagegaan of de verstrekking wordt
      gerechtvaardigd door een dringende maatschappelijke behoefte, in een juiste verhouding staat tot het doel waarvoor
      de gegevens worden gevraagd en dit doel niet op een minder ingrijpende wijze kan worden bereikt;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100
  - number: 100.1.b
    text: |-
      natuurlijke personen, ten behoeve van een persoonlijk, niet-commercieel belang, met voorafgaande schriftelijke
      toestemming van de ingeschrevene van wie gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100
  - number: '100.2'
    text: |-
      De verstrekking kan uitsluitend betrekking hebben op algemene en verwijsgegevens over de naam, de geslachtsnaam van
      de echtgenoot dan wel geregistreerde partner, de eerdere echtgenoot of eerdere geregistreerde partner, het gebruik
      door de ingeschrevene van de geslachtsnaam van de echtgenoot dan wel geregistreerde partner, de eerdere echtgenoot
      of eerdere geregistreerde partner, het adres, de gemeente van inschrijving, de geboortedatum en de datum van
      overlijden. [Artikel 88, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel88
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '100.3'
    text: |-
      Op een verstrekking als bedoeld in dit artikel, is [artikel 76 van de Wet bescherming persoonsgegevens][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel76
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '76'
  - number: 100a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de verstrekking
      van algemene, bijzondere en verwijsgegevens aan een verantwoordelijke voor de verwerking van gegevens in een
      basisadministratie in Aruba, Curaçao, Sint Maarten of in een van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel100a
  - number: '101'
    text: |-
      De verstrekking aan de betrokkene van hem betreffende gegevens geschiedt ingevolge [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '102.1'
    text: |-
      Het college van burgemeester en wethouders geeft aan het schriftelijke verzoek van de betrokkene om in de gevallen,
      bedoeld in de [artikelen 98][ref1], [99, tweede lid][ref2], of [100][ref3], geen gegevens die opgenomen zijn op
      zijn persoonslijst of hem betreffende verwijsgegevens en daarmee in verband staande administratieve gegevens, aan
      derden te verstrekken, binnen vier weken gevolg en doet daarvan terstond schriftelijk mededeling aan de verzoeker,
      onder vermelding van de geldende regels ter zake. Indien het verzoek bij gelegenheid van een aangifte van verblijf
      en adres wordt gedaan, wordt aan dat verzoek op het moment van de inschrijving gevolg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel100
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '100'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '102.2'
    text: |-
      In afwijking van het eerste lid worden omtrent de verzoeker in de gevallen, bedoeld in [artikel 98][ref1], gegevens
      verstrekt, indien de persoonlijke levenssfeer daardoor niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel98
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '102.3'
    text: |-
      Het college van burgemeester en wethouders maakt de beschikking om krachtens [artikel 98][ref1] in afwijking
      van het eerste lid gegevens te verstrekken, terstond bekend aan de betrokkene. Het geeft geen uitvoering aan de
      beschikking binnen een bij die beschikking gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel98
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '102.4'
    text: |-
      [Artikel 79, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '102.5'
    text: |-
      Het college van burgemeester en wethouders neemt passende maatregelen om ten minste eens per jaar aan de
      ingezetenen het recht, bedoeld in het eerste lid, bekend te maken. De bekendmaking vindt plaats via één of meer
      dag-, nieuws-, of huis-aan-huisbladen of op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel102
  - number: '103.1'
    text: |-
      Het college van burgemeester en wethouders deelt aan de betrokkene op diens verzoek schriftelijk binnen vier weken
      mede of hem betreffende gegevens in het jaar voorafgaande aan het verzoek uit de basisadministratie zijn verstrekt
      aan een afnemer of een derde.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel103
  - number: '103.2'
    text: |-
      Indien zodanige verstrekking is geschied, doet het college van burgemeester en wethouders daarvan desverlangd
      binnen vier weken na ontvangst van het verzoek schriftelijk mededeling aan verzoeker. Het college van burgemeester
      en wethouders kan volstaan met een in algemene termen gestelde mededeling omtrent de verstrekking, tenzij het
      belang van de verzoeker daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel103
  - number: '103.3'
    text: |-
      Het college van burgemeester en wethouders voldoet niet aan het in het eerste en tweede lid bedoelde verzoek, voor
      zover dit noodzakelijk is in het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging
      van strafbare feiten. Bij of krachtens algemene maatregel van bestuur kan een nadere regeling worden getroffen
      welke afnemers het betreft en in verband met welke aan deze afnemers opgedragen wettelijke taken het niet voldoen
      aan het verzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel103
  - number: '103.4'
    text: |-
      [Artikel 79, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '104.1'
    text: |-
      Het college van burgemeester en wethouders doet op schriftelijk verzoek van de betrokkene, indien op grond van het
      verzoek, bedoeld in de [artikelen 81][ref1] en [82][ref2], een besluit als bedoeld in [artikel 83][ref3], dan wel
      de uitspraak van de rechter, bedoeld in [artikel 86][ref4], ten aanzien van hem gegevens zijn verbeterd, aangevuld
      of verwijderd, van de verbetering, de aanvulling of de verwijdering mededeling aan afnemers en derden aan wie in
      het jaar voorafgaand aan het verzoek en in de sedert dat verzoek verstreken tijd, de desbetreffende gegevens zijn
      verstrekt, tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0006723#Artikel86
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '81'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '82'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '83'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0006723
        artikel: '86'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '104.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het college van burgemeester en wethouders ambtshalve
      gegevens met betrekking tot het aan de ingeschrevene toegekende burgerservicenummer heeft verbeterd, aangevuld
      of verwijderd.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel104
  - number: '104.3'
    text: |-
      Het verzoek, bedoeld in het eerste lid, kan de betrokkene aan het college van burgemeester en wethouders richten
      tot uiterlijk acht weken nadat hij van de verbetering, de aanvulling of de verwijdering, kennis heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel104
  - number: '104.4'
    text: |-
      Het college van burgemeester en wethouders doet aan de verzoeker desgevraagd opgave van degenen aan wie de
      mededeling, bedoeld in het eerste lid, is gedaan. [Artikel 103, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel103
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '103'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '104.5'
    text: |-
      [Artikel 79, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '105'
    text: |-
      Een beslissing van het college van burgemeester en wethouders op een verzoek als bedoeld in de
      [artikelen 102, eerste lid][ref1], [103][ref2] en [104][ref3] wordt gelijkgesteld met een besluit in de zin van de
      [Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '102'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '103'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '104'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005537
  - number: '108.1'
    text: |-
      Het administratienummer wordt buiten de gevallen, bedoeld in de [artikelen 99][ref1] en [100a][ref2], niet door een
      derde gebruikt. In een geval als bedoeld in [artikel 99][ref3] wordt het administratienummer slechts door de derde
      gebruikt, voor zover dit noodzakelijk is voor een doelmatige verstrekking van de desbetreffende gegevens uit de
      basisadministraties aan de derde.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel100a
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: 100a
        hoofdstuk: '3'
        afdeling: 2a
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '108.2'
    text: |-
      Het administratienummer wordt door een afnemer niet medegedeeld aan derden. Het administratienummer wordt door een
      derde als bedoeld in [artikel 99][ref1], niet medegedeeld aan afnemers of aan andere derden.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '108.3'
    text: |-
      In afwijking van het tweede lid kan Onze Minister van Financiën het administratienummer mededelen aan een derde als
      bedoeld in [artikel 99][ref1], voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 108.3.a
    text: |-
      het administratienummer medegedeeld wordt in verband met de afstemming van de gegevens van de derde op de gegevens
      in de basisadministraties en
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel108
  - number: 108.3.b
    text: |-
      de mededeling is toegestaan in een ten aanzien van de derde genomen besluit als bedoeld in
      [artikel 99, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '109.1'
    text: |-
      Een andere verstrekking van de in de basisadministratie opgenomen persoonsgegevens dan bedoeld in de afdelingen 1,
      2 en 2A van [dit hoofdstuk][ref1] is slechts toegestaan, voor zover deze plaatsvindt voor historische, statistische
      of wetenschappelijke doeleinden, de persoonlijke levenssfeer daardoor niet onevenredig wordt geschaad en door de
      ontvanger van de persoonsgegevens de nodige voorzieningen zijn getroffen ten einde te verzekeren dat de verdere
      verwerking uitsluitend geschiedt ten behoeve van deze specifieke doeleinden. Bij of krachtens algemene maatregel
      van bestuur kunnen nadere regels worden gesteld over de verstrekking van persoonsgegevens als hier bedoeld en de
      wijze waarop deze plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0006723
        hoofdstuk: '3'
  - number: '109.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt de verstrekking geregeld van gegevens aan het Centraal Bureau
      voor de Statistiek. De voordracht voor de maatregel wordt gedaan door Onze Minister in overeenstemming met Onze
      Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel109
  - number: '109.3'
    text: |-
      Aan het Centraal Bureau voor de Statistiek worden de administratieve gegevens verstrekt over de nummering van akten
      van de Nederlandse burgerlijke stand die noodzakelijk zijn voor de vervulling van zijn taak.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel109
  - number: '109.4'
    text: |-
      Aan het Centraal Bureau voor de Statistiek worden de niet in de basisadministratie opgenomen gegevens verstrekt
      die de ambtenaar van de burgerlijke stand ingevolge bij algemene maatregel van bestuur te stellen regels aan het
      college van burgemeester en wethouders verschaft ten behoeve van het Centraal Bureau voor de Statistiek, alsmede de
      gegevens, bedoeld in [artikel 65, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '110'
    text: |-
      Het college van burgemeester en wethouders houdt gedurende het jaar volgend op de verstrekking aantekening van de
      verstrekking van gegevens, tenzij de verstrekking van gegevens in de genoemde periode anderszins is te herleiden
      uit de basisadministratie of van de verstrekking ingevolge [artikel 103, derde lid][ref1], geen mededeling wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel103
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '103'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '111'
    text: |-
      Indien op grond van de [artikelen 79, derde lid][ref1], [88, vierde lid][ref2], [98, eerste lid][ref3],
      of [99, eerste of derde lid][ref4], een gewaarmerkt afschrift wordt verstrekt van gegevens ten aanzien van een
      vreemdeling op wiens persoonslijst geen actuele gegevens zijn opgenomen over het verblijfsrecht, dan wordt op dat
      afschrift mededeling gedaan van de niet-opneming op de persoonslijst van actuele gegevens over het verblijfsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '79'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '98'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '112'
    text: Onze Minister is de verantwoordelijke voor de verwerking van persoonsgegevens in een vestigingsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel112
  - number: '113.1'
    text: 'Van een persoon worden gegevens opgenomen in het vestigingsregister indien die persoon:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: 113.1.a
    text: |-
      op grond van [artikel 26][ref1] wordt ingeschreven in een basisadministratie,


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 113.1.b
    text: |-
      bij de verantwoordelijke voor de verwerking van gegevens in de basisadministratie in Aruba, Curaçao, Sint Maarten
      of in een van de openbare lichamen, waar hij laatstelijk als ingezetene was ingeschreven, aangifte van zijn
      voorgenomen vestiging in Nederland heeft gedaan, en door die verantwoordelijke daarvan mededeling wordt gedaan aan
      het vestigingsregister, of
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: 113.1.c
    text: |-
      aangifte van vertrek heeft gedaan en daarbij meldt te gaan verblijven in Aruba, Curaçao, Sint Maarten of in een van
      de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: '113.2'
    text: 'Van een persoon worden geen gegevens in het vestigingsregister opgenomen indien:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: 113.2.a
    text: |-
      omtrent de betrokkene door een ambtenaar van de burgerlijke stand in Nederland een geboorteakte is opgemaakt,
      waarop als geboorteplaats een plaats in Nederland is vermeld en
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: 113.2.b
    text: bij de inschrijving niet wordt vastgesteld dat de betrokkene verblijf in het buitenland heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel113
  - number: '114.1'
    text: |-
      In het vestigingsregister worden over de in [artikel 113, eerste lid, aanhef en onder a][ref1], bedoelde personen
      uitsluitend de volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel113
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '113'
        hoofdstuk: '4'
  - number: 114.1.a
    text: 'verwijsgegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114.1.a.1°
    text: gegevens over de naam en de geboorte,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114.1.a.2°
    text: gegevens over het administratienummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114.1.a.3°
    text: gegevens over het burgerservicenummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114.1.a.4°
    text: gegevens over de gemeente van inschrijving;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114.1.b
    text: administratieve gegevens in verband met de verwijsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: '114.2'
    text: |-
      De in het eerste lid onder *a*, sub 4°, bedoelde verwijsgegevens worden opgenomen naar de juiste staat van die
      gegevens bij de inschrijving op grond van [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '114.3'
    text: Een verwijsgegeven dat in het vestigingsregister is opgenomen blijft daarin opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: '114.4'
    text: |-
      Als verwijsgegevens worden de gegevens opgenomen die zijn vermeld in [bijlage II, onder B][ref1], bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '114.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke administratieve gegevens in verband met de verwijsgegevens
      worden opgenomen. De verwijdering en de vernietiging van deze gegevens worden bij of krachtens de maatregel
      geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114
  - number: 114a.1
    text: |-
      In het vestigingsregister worden over de in
      [artikel 113, eerste lid, aanhef en onder b en c][ref1], bedoelde personen de in
      __REF001___________________________________________________________________________________________________________
      ___________, bedoelde gegevens opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '113'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 114a.2
    text: 'De over een persoon op grond van het eerste lid opgenomen gegevens worden verwijderd en vernietigd indien:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114a
  - number: 114a.2.a
    text: |-
      die persoon op grond van [artikel 26][ref1] wordt ingeschreven in een basisadministratie,


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 114a.2.b
    text: |-
      van de verantwoordelijke voor de verwerking van gegevens in een basisadministratie in Aruba, Curaçao, Sint Maarten
      of in een van de openbare lichamen bericht is ontvangen dat die persoon aldaar als ingezetene is ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114a
  - number: 114a.2.c
    text: een jaar is verstreken na de dag van opneming van de gegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel114a
  - number: '115.1'
    text: |-
      Onze Minister verstrekt aan een college van burgemeester en wethouders spontaan of op verzoek zo
      spoedig mogelijk de inlichtingen die van belang zijn voor een goede uitvoering van de taak met
      betrekking tot de bijhouding van de basisadministratie, of voor zover het betreft de personen bedoeld in
      [artikel 113, eerste lid, aanhef en onder b][ref1], tevens ten behoeve van de uitvoering van bij of krachtens
      algemene maatregel van bestuur te bepalen andere publiekrechtelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel113
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '113'
        hoofdstuk: '4'
  - number: '115.2'
    text: |-
      Een college van burgemeester en wethouders verstrekt aan Onze Minister spontaan of op verzoek zo spoedig mogelijk
      de inlichtingen die van belang zijn voor een goede uitvoering van de taak met betrekking tot de bijhouding van
      het vestigingsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel115
  - number: '116'
    text: |-
      De [artikelen 79][ref1], [82][ref2], [83 aanhef, onder f en slot][ref3], [86][ref4], [88][ref5],
      [90 tot en met 95][ref6], [97 tot en met 105][ref7], [109][ref8] en [110][ref9] zijn van overeenkomstige
      toepassing op het vestigingsregister, met dien verstande dat Onze Minister in de plaats treedt van het college van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel83
