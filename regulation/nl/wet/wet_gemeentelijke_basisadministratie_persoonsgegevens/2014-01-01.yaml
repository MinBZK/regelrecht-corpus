  - number: '119.1'
    text: |-
      Onze Minister kan de verantwoordelijkheid voor de verwerking, bedoeld in [artikel 112][ref1], overdragen aan het
      college van burgemeester en wethouders van een gemeente. De overdracht geschiedt slechts na instemming van het
      bevoegde orgaan van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel112
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '112'
        hoofdstuk: '4'
  - number: '119.2'
    text: |-
      De taken en bevoegdheden die in of krachtens de [artikelen 112 tot en met 118][ref1] zijn opgedragen en toegekend
      aan Onze Minister worden uitgevoerd en uitgeoefend door het college van burgemeester en wethouders, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel112
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '112'
        hoofdstuk: '4'
  - number: 119.2.a
    text: |-
      de bevoegdheid tot het nemen van een besluit als bedoeld in de [artikelen 91][ref1] en [99][ref2] in samenhang met
      [artikel 116][ref3], ten aanzien van het systematisch verstrekken van gegevens uit het vestigingsregister, bij Onze
      Minister blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel116
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel119
