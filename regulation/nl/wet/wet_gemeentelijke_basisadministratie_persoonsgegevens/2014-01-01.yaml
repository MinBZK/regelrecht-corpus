  - number: '117'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de technische en administratieve
      inrichting en werking en de beveiliging van het vestigingsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel117
  - number: '118.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent heffingen in verband met de
      verstrekking van gegevens uit het vestigingsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel118
  - number: '118.2'
    text: |-
      Op grond van de in het eerste lid bedoelde regels kunnen uitsluitend heffingen ingesteld worden in verband met de
      verstrekking van gegevens aan derden, anders dan de verstrekking overeenkomstig [artikel 99][ref1] of [100a][ref2],
      en in verband met de verstrekking aan de betrokkene van hem betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel100a
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel118
    references:
