        artikel: 3b
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '62'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 146b.2
    text: |-
      Het recht van de ingeschrevene, bedoeld in[ artikel 3c][ref1], is tot 1 januari 2010 alleen van toepassing jegens
      bij of krachtens algemene maatregel van bestuur aangewezen afnemers of categorieën van afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel3c
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146b
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 3c
        hoofdstuk: '1'
  - number: 146b.3
    text: |-
      De verplichting, bedoeld in [artikel 96, eerste lid, tweede volzin][ref1], is van toepassing vanaf 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel96
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146b
