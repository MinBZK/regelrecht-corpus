preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, ter bevordering van de doelmatige voorziening van
    persoonsgegevens, in het bijzonder bij de vervulling van publiekrechtelijke taken, regels te stellen ter zake
    van de gemeentelijke basisadministratie van persoonsgegevens, en dat daarbij ter bescherming van de persoonlijke
    levenssfeer uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - Onze minister: Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties;
        - persoonslijst: het geheel van gegevens als bedoeld in [artikel 34, eerste lid][ref1], over één persoon in een
      basisadministratie;
        - authentiek gegeven: een in de basisadministratie opgenomen gegeven dat bij wettelijk voorschrift als authentiek
      wordt aangemerkt;
        - inschrijving: de opneming van een persoonslijst in een basisadministratie;
        - ingeschrevene: degene ten aanzien van wie een persoonslijst in een basisadministratie is opgenomen;
        - ingezetene: de ingeschrevene op wiens persoonslijst niet het gegeven van zijn overlijden of van zijn vertrek uit
      Nederland als actueel gegeven is opgenomen;
        - gemeente van inschrijving: de gemeente waarbij een persoonslijst is opgenomen in de basisadministratie;
        - uitschrijving: de overdracht van een persoonslijst door de gemeente van inschrijving aan de volgende gemeente
      van inschrijving;
        - vreemdeling: degene die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
      Nederlander wordt behandeld;
        - de aangifte van verblijf en adres: de aangifte, bedoeld in [artikel 65][ref2];
        - de aangifte van adreswijziging: de aangifte, bedoeld in [artikel 66][ref3];
        - de aangifte van vertrek: de aangifte, bedoeld in [artikel 68][ref4];
        - woonadres: a. het adres waar betrokkene woont, waaronder begrepen het adres van een woning die zich in een
      voertuig of vaartuig bevindt, indien het voertuig of vaartuig een vaste stand- of ligplaats heeft, of, indien
      betrokkene op meer dan één adres woont, het adres waar hij naar redelijke verwachting gedurende een half jaar de
      meeste malen zal overnachten; b. het adres waar, bij het ontbreken van een adres als bedoeld onder *a*, betrokkene
      naar redelijke verwachting gedurende drie maanden ten minste twee derden van de tijd zal overnachten;
        - briefadres: het adres waar voor betrokkene bestemde geschriften in ontvangst worden genomen en waar, indien
      daartoe grond bestaat, zorg wordt gedragen dat geschriften of inlichtingen daarover, betrokkene bereiken;
        - adres: het woonadres, dan wel bij het ontbreken hiervan of bij toepassing van [artikel 67][ref5], het briefadres;
        - burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref6];
        - afnemer: een bestuursorgaan;
        - binnengemeentelijke afnemer: elke afnemer die een orgaan is van de gemeente waarvan het college van
      burgemeester en wethouders de verantwoordelijke is voor de verwerking van persoonsgegevens in de desbetreffende
      basisadministratie;
        - buitengemeentelijke afnemer: elke andere afnemer dan een binnengemeentelijke afnemer;
        - derde: elke andere persoon of instelling dan een afnemer en de ingeschrevene;
        - openbare lichamen: de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel66
