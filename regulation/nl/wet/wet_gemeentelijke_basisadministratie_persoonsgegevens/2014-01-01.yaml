  - number: '119.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de zorg voor het vestigingsregister door
      het college van burgemeester en wethouders. Daarbij worden regels gesteld over het toezicht van Onze Minister op de
      uitvoering van de regels, bedoeld in [artikel 117][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel117
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '117'
        hoofdstuk: '4'
  - number: '120.1'
    text: |-
      Het College bescherming persoonsgegevens ziet in het belang van de bescherming van de persoonlijke levenssfeer toe
      op de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120
  - number: '120.2'
    text: |-
      De krachtens de [artikelen 14, eerste lid][ref1], [96, eerste lid][ref2] en [100, eerste lid][ref3], gestelde
      regels alsmede wijziging daarvan worden bij het College bescherming persoonsgegevens gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel100
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '14'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '96'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '100'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '120.3'
    text: |-
      De [artikelen 51, tweede lid][ref1], [60][ref2], [61][ref3] en [65 van de Wet bescherming persoonsgegevens][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel65
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '61'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '65'
  - number: 120a.1
    text: |-
      Het college van burgemeester en wethouders laat eens per drie jaar de uitvoering van de in
      [artikel 6, eerste lid][ref1], bedoelde regels alsmede de juistheid van de in de basisadministratie opgenomen
      gegevens controleren door een van de krachtens het tweede lid aangewezen bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: 120a.2
    text: |-
      Onze Minister wijst de bedrijven aan die bevoegd zijn de controle, bedoeld in het eerste en vijfde lid, uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.3
    text: |-
      Het college van burgemeester en wethouders zendt aan Onze Minister een afschrift van de bij of krachtens algemene
      maatregel van bestuur te bepalen onderdelen van de controleresultaten. Het college van burgemeester en wethouders
      maakt deze controleresultaten openbaar. Jaarlijks zendt Onze Minister een uittreksel van deze controleresultaten
      aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.4
    text: Bij regeling van Onze Minister wordt geregeld welke vergoeding van de kosten van de controle zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.5
    text: |-
      Indien uit de controle, bedoeld in het eerste lid, blijkt dat niet voldaan wordt aan bij of krachtens algemene
      maatregel van bestuur te stellen voorwaarden, laat het college van burgemeester en wethouders binnen een jaar een
      hercontrole uitvoeren op die onderdelen die bij de eerdere controle niet voldeden aan de gestelde voorwaarden. Het
      derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.6
    text: Een hercontrole als bedoeld in het vijfde lid, wordt niet vergoed.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.7
    text: |-
      De krachtens het tweede lid aangewezen bedrijven, hebben ten behoeve van een controle als bedoeld in het eerste of
      vijfde lid toegang tot de basisadministratie. Het college van burgemeester en wethouders verleent hiertoe de nodige
      medewerking.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.8
    text: |-
      Een ieder die is betrokken bij een controle als bedoeld in het eerste of vijfde lid is verplicht tot geheimhouding
      van de persoonsgegevens waarover zij de beschikking hebben gekregen, behoudens voor zover enig wettelijk
      voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: 120a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels betreffende de controle en hercontrole worden
      gesteld. In ieder geval worden nadere regels gesteld omtrent de elementen die de controle ten minste moet bevatten.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel120a
  - number: '121.1'
    text: |-
      Op de datum van inwerkingtreding van dit artikel vindt inschrijving plaats van de personen die in het
      persoonsregister, bedoeld in artikel 26, tweede lid, onder *a*, van het Besluit bevolkingsboekhouding (*Stb.* 1967,
      442), zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: '121.2'
    text: |-
      Het gemeentebestuur dat op deze datum in het bezit is van een toestemming als bedoeld in [artikel 7][ref1],
      schrijft een persoon in door het aanleggen van een persoonslijst van de betrokkene en het opnemen van deze lijst in
      de basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
  - number: '121.3'
    text: |-
      Het gemeentebestuur dat op deze datum nog niet in het bezit is van een toestemming als bedoeld in
      [artikel 7][ref1], schrijft een persoon in door:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '7'
        hoofdstuk: '1'
  - number: 121.3.a
    text: 'het aanleggen van een persoonslijst van de betrokkene en het opnemen van deze lijst in de basisadministratie, of:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: 121.3.b
    text: |-
      het opnemen in de basisadministratie van de volgende gegevens, voor zover het de gegevens betreft, bedoeld in
      [artikel 34, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 121.3.b.1°
    text: |-
      de gegevens van de betrokkene die zijn vermeld op zijn persoonskaart, bedoeld in artikel 1 van het Besluit
      bevolkingsboekhouding;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: 121.3.b.2°
    text: het administratienummer van de betrokkene en de postcode;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: 121.3.b.3°
    text: |-
      de gegevens van de betrokkene die zijn vermeld in een kennisgeving als bedoeld in artikel 52 van het Besluit
      bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: '121.4'
    text: |-
      De op grond van het derde lid, onder *b*, opgenomen gegevens worden aangemerkt als de persoonslijst van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel121
  - number: '122'
    text: |-
      Van iedere overeenkomstig [artikel 121, derde lid, onder ][ref1], ingeschreven persoon, wordt voor het ingevolge
      [artikel 6, tweede lid][ref2], bepaalde tijdstip, een persoonslijst aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '123.1'
    text: |-
      Bij de aanleg van een persoonslijst in een geval als bedoeld in het [tweede lid van artikel 121][ref1], of
      een geval als bedoeld in het derde lid, onder *a*, van dat artikel, worden van de betrokkene ten minste de in
      [artikel 34, eerste lid][ref2], bedoelde gegevens opgenomen, voor zover deze kunnen worden ontleend aan het
      persoonsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '123.2'
    text: |-
      Bij de aanleg van een persoonslijst in een geval als bedoeld in [artikel 122][ref1], worden van de betrokkene ten
      minste de gegevens welke zijn opgenomen in de basisadministratie, op de persoonslijst opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel122
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '122'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: '123.3'
    text: 'In afwijking van het eerste lid, behoeven de volgende gegevens niet te worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.3.a
    text: de algemene gegevens over de kinderen die geboren zijn voor 1 januari 1966;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.3.b
    text: |-
      de datums, bedoeld in de volgende onderdelen van [bijlage I][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 123.3.b.1°
    text: het onderdeel 1, onder *j*;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.3.b.2°
    text: de onderdelen 2 tot en met 4;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.3.b.3°
    text: de onderdelen 7 en 10.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.3.c
    text: de bij algemene maatregel van bestuur bepaalde bijzondere en administratieve gegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.4'
    text: |-
      In afwijking van het tweede lid, behoeft een in het derde lid bedoeld gegeven niet te worden opgenomen, tenzij het
      als persoonslijst aangemerkte geheel van gegevens met betrekking tot dit gegeven is gewijzigd. In dat geval dient
      bij de aanleg de wijziging te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.5'
    text: |-
      De gegevens over het administratienummer van de betrokkene en de postcode worden bij de aanleg op de persoonslijst
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.6'
    text: |-
      De gegevens over het gezag dat over de minderjarige wordt uitgeoefend worden bij de aanleg op de persoonslijst
      opgenomen, voor zover zij ontleend kunnen worden aan het persoonsregister of aan een kennisgeving als bedoeld in
      artikel 52 van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.7'
    text: De gegevens over het sociaal-fiscaal nummer worden opgenomen overeenkomstig een regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.8'
    text: |-
      Het gemeentebestuur is bevoegd bij de aanleg van een persoonslijst de gegevens over het gebruik door de
      ingeschrevene van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde partner of de
      eerdere geregistreerde partner op te nemen overeenkomstig de in de gemeente gebruikelijke wijze van aanschrijven
      van de betrokkenen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '123.9'
    text: |-
      Het gemeentebestuur is bevoegd bij de aanleg van een persoonslijst naast de gegevens die ingevolge het eerste tot
      en met het zevende lid worden opgenomen, oudere gegevens op te nemen, voor zover het gegevens zijn als bedoeld in
      [artikel 34][ref1] en mits het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 123.9.a
    text: gegevens die aan enig persoonsregister kunnen worden ontleend;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.9.b
    text: gegevens over het administratienummer van de betrokkene of de postcode;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: 123.9.c
    text: |-
      gegevens over het gezag dat over de minderjarige wordt uitgeoefend, die ontleend kunnen worden aan enig
      persoonsregister of aan enige kennisgeving als bedoeld in artikel 52 van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel123
  - number: '124'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanleg van persoonslijsten.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel124
  - number: '125.1'
    text: |-
      Indien een gemeentebestuur gebruik gemaakt heeft van de op grond van artikel 95, derde lid, van het Besluit
      bevolkingsboekhouding verleende bevoegdheid om de bijhouding van de persoonskaarten stop te zetten, wordt
      voor de toepassing van deze paragraaf het persoonsregister geacht tevens die gegevens te bevatten, welke het
      gemeentebestuur op de persoonskaart had moeten vermelden, als de bijhouding niet was stopgezet.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel125
  - number: '125.2'
    text: |-
      Bij een eerste inschrijving als bedoeld in [artikel 121, derde lid, onder ][ref1], neemt het in het eerste lid
      bedoelde gemeentebestuur, tevens de in dat lid bedoelde gegevens op in de basisadministratie, voor zover het
      gegevens betreft als bedoeld in [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '126'
    text: |-
      In geval van een eerste inschrijving op grond van [artikel 26][ref1] van een persoon omtrent wie vóór de
      inwerkingtreding van dit artikel door een ambtenaar van de burgerlijke stand in Nederland een geboorteakte is
      opgemaakt waarop als geboorteplaats een plaats in Nederland is vermeld, worden over de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel26
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 126.a
    text: |-
      in afwijking van [artikel 35, tweede lid][ref1], geen gegevens opgenomen in de in dat lid bedoelde
      basisadministratie;


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel35
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 126.b
    text: |-
      zo nodig in afwijking van [artikel 113, tweede lid][ref1], gegevens opgenomen in het vestigingsregister
      overeenkomstig [artikel 114][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel114
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '113'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '114'
        hoofdstuk: '4'
  - number: '127.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in verband met het opnemen van
      de hierna onder *a* en *b* genoemde gegevens in het vestigingsregister, van de personen die zich vóór de
      inwerkingtreding van dit artikel vanuit het buitenland in Nederland hebben gevestigd en die zijn ingeschreven in
      een basisadministratie op grond van [artikel 121][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel121
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: 127.1.a
    text: 'verwijsgegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.1.a.1°
    text: gegevens over de naam en de geboorte,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.1.a.2°
    text: gegevens over het administratienummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.1.a.3°
    text: gegevens over het sociaal-fiscaal nummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.1.a.4°
    text: gegevens over de gemeente van inschrijving;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.1.b
    text: administratieve gegevens in verband met de verwijsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: '127.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in verband met het opnemen van de in
      het eerste lid onder *a* en *b* genoemde gegevens in het vestigingsregister, van de personen die zijn ingeschreven
      in een basisadministratie op grond van [artikel 130][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel130
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '130'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: '127.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in verband met het opnemen van de
      hierna onder *a* en *b* genoemde gegevens in de basisadministraties, van de personen die zijn ingeschreven in een
      basisadministratie op grond van [artikel 121][ref1] of [130][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel130
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '130'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: 127.3.a
    text: 'verwijsgegevens:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.3.a.1°
    text: gegevens over de naam en de geboorte,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.3.a.2°
    text: gegevens over het administratienummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.3.a.3°
    text: gegevens over het sociaal-fiscaal nummer,
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.3.a.4°
    text: gegevens over de gemeente van inschrijving, over het adres in die gemeente en over de datum van inschrijving;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: 127.3.b
    text: administratieve gegevens in verband met de verwijsgegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: '127.4'
    text: |-
      Krachtens het eerste of het tweede lid worden als verwijsgegevens de gegevens opgenomen die zijn vermeld
      in [bijlage II, onder B][ref1], bij deze wet. Een verwijsgegeven dat krachtens een van die leden in het
      vestigingsregister is opgenomen blijft daarin opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '127.5'
    text: |-
      Krachtens het derde lid worden als verwijsgegevens de gegevens opgenomen die zijn vermeld in
      [bijlage II, onder A][ref1], bij deze wet. Een verwijsgegeven dat krachtens dat lid in een basisadministratie is
      opgenomen blijft daarin opgenomen, tenzij de betrokkene in die basisadministratie wordt ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '127.6'
    text: |-
      Bij een maatregel als bedoeld in het eerste, tweede of derde lid wordt bepaald welke administratieve gegevens in
      verband met de verwijsgegevens worden opgenomen. De verwijdering en de vernietiging van deze gegevens worden bij of
      krachtens de maatregel geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel127
  - number: '128'
    text: |-
      Het gemeentebestuur is bevoegd om op de datum van inwerkingtreding van dit artikel de in het Besluit voorbereiding
      gemeentelijke basisadministratie persoonsgegevens (*Stb.* 1990, 539) bedoelde verwijsgegevens en administratieve
      gegevens in verband met de verwijsgegevens in de basisadministratie op te nemen, voor zover de in dat besluit
      bedoelde basisadministratie op die datum deze gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel128
  - number: '129.1'
    text: 'De gegevens op de persoonskaart vermeld in:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: 129.1.a
    text: |-
      vak 6, voor zover daarmee aangegeven wordt tot welk kerkgenootschap, vereniging met godsdienstig doel of
      levensbeschouwelijke groepering de betrokkene behoort en:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: 129.1.b
    text: vak 23;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: '129.2'
    text: |-
      Een gegeven uit vak 6 van de persoonskaart wordt binnen drie jaren na de inwerkingtreding van een algemene
      maatregel van bestuur als bedoeld in [artikel 99, tweede lid][ref1], doch in ieder geval binnen vijf jaren na de
      inwerkingtreding van dit artikel van de persoonslijst van de betrokkene verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '129.3'
    text: |-
      Een gegeven uit vak 23 van de persoonskaart wordt voor een door Onze Minister te bepalen tijdstip van de
      persoonslijst van de betrokkene verwijderd.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: '129.4'
    text: |-
      De verwijdering en de vernietiging van deze gegevens worden bij of krachtens algemene maatregel van bestuur
      geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: '129.5'
    text: |-
      Een op de persoonslijst opgenomen gegeven uit vak 6 van de persoonskaart wordt slechts eenmaal gebruikt ten
      behoeve van de eerste gegevensverstrekking overeenkomstig de bepalingen van deze wet aan de derde, bedoeld in
      [artikel 99, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '129.6'
    text: |-
      Een op de persoonslijst opgenomen gegeven uit vak 23 van de persoonskaart, betreffende de codering van de afnemer,
      wordt slechts eenmaal gebruikt ten behoeve van de eerste gegevensverstrekking overeenkomstig de bepalingen van deze
      wet aan de desbetreffende afnemer.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
  - number: '129.7'
    text: |-
      Een gegeven uit vak 6 van de persoonskaart wordt, tenzij bij een verstrekking als bedoeld in
      [artikel 99, tweede lid][ref1], niet opgenomen in enig overeenkomstig de bepalingen van deze wet te verstrekken
      afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '133'
    text: |-
      Bij een eerste inschrijving als bedoeld in deze paragraaf, is het gemeentebestuur bevoegd de gegevens over de
      gemeente van inschrijving en het adres in die gemeente, alsmede over het verblijf in Nederland en het vertrek uit
      Nederland, op te nemen overeenkomstig de gegevens in het persoonsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel133
  - number: '134.1'
    text: |-
      De verplichting, vermeld in [artikel 2][ref1], tot het op geautomatiseerde wijze houden van de basisadministratie
      treedt in werking op het tijdstip dat bepaald is ingevolge [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel6
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
  - number: '134.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de technische en
      administratieve inrichting en werking en de beveiliging van de basisadministratie waarvoor het in [artikel 2][ref1]
      bedoelde college van burgemeester en wethouders niet de beschikking heeft over een toestemming als bedoeld in
      [artikel 7][ref2] of in [artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel13
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '13'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '13'
        hoofdstuk: '1'
  - number: '134.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de systematische verstrekking
      van gegevens op grond van de [artikelen 91][ref1] en [99][ref2] door het in het tweede lid bedoelde college van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '135.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitwisseling van
      gegevens tussen een afnemer of een derde als bedoeld in [artikel 99][ref1] enerzijds en Onze Minister van
      Financiën anderzijds, in verband met de afstemming van de gegevens van de afnemer of de derde op de gegevens
      in de basisadministraties. Daarbij kunnen regels gesteld worden omtrent de verrekening van de kosten van deze
      gegevensuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '135.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanleg, de instandhouding
      en de werking van voorzieningen ten behoeve van de overdracht van berichten in verband met de uitvoering van de
      bepalingen bij of krachtens deze wet omtrent de gemeentelijke basisadministratie van persoonsgegevens, voor zover
      deze berichten niet over het in [artikel 4][ref1] bedoelde netwerk worden verzonden of ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel4
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '4'
        hoofdstuk: '1'
  - number: '135.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid wordt gedaan door Onze Minister
      in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel135
  - number: '135.4'
    text: |-
      De in het eerste en het tweede lid bedoelde regels vervallen in ieder geval vijf jaren na de inwerkingtreding van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel135
  - number: '136.1'
    text: |-
      Het college van burgemeester en wethouders is ten behoeve van de uitvoering van deze wet tot een bij algemene
      maatregel van bestuur te bepalen datum de verantwoordelijke voor de verwerking van persoonsgegevens in het
      persoonsregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
  - number: '136.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de in het eerste lid bedoelde
      verwerking van persoonsgegevens. Daarbij kan worden bepaald dat het persoonsregister op een andere wijze dan in de
      vorm van persoonskaarten kan worden aangehouden en kan de vernietiging van de persoonskaarten worden geregeld.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
  - number: '136.3'
    text: 'Uit het persoonsregister worden geen andere gegevens verstrekt dan:'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
  - number: 136.3.a
    text: |-
      gegevens als bedoeld in [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 136.3.b
    text: gegevens uit vak 23 van de persoonskaart.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
  - number: '136.4'
    text: |-
      Op de verstrekking, bedoeld in het derde lid, is [hoofdstuk 3][ref1], met uitzondering van de artikelen 91, 92, 94
      en 99, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0006723
        hoofdstuk: '3'
  - number: '136.5'
    text: |-
      Afdeling 4 van [hoofdstuk 2][ref1] is, met uitzondering van de [artikelen 78][ref2] en [80][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel80
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0006723
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '78'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '80'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '137.1'
    text: |-
      Het college van burgemeester en wethouders is ten behoeve van de uitvoering van deze wet tot een bij algemene
      maatregel van bestuur te bepalen datum de verantwoordelijke voor de verwerking van persoonsgegevens in het
      archiefregister.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel137
  - number: '137.2'
    text: |-
      [Artikel 136, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '138.1'
    text: |-
      Onze Minister is ten behoeve van de uitvoering van deze wet tot een bij algemene maatregel van bestuur te bepalen
      datum de verantwoordelijke voor de verwerking van persoonsgegevens in het centraal bevolkingsregister, bedoeld in
      artikel 26, derde lid, onder a, van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel138
  - number: '138.2'
    text: |-
      Onze Minister kan de verantwoordelijkheid voor de verwerking, bedoeld in het eerste lid, overdragen aan het college
      van burgemeester en wethouders van een gemeente. De overdracht geschiedt slechts na instemming van het bevoegde
      orgaan van de gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel138
  - number: '138.3'
    text: |-
      [Artikel 136, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '139.1'
    text: |-
      Onze Minister is ten behoeve van de uitvoering van deze wet tot een bij algemene maatregel van bestuur te
      bepalen datum de verantwoordelijke voor de verwerking van persoonsgegevens in het persoonskaartenarchief en het
      schakelregister, bedoeld in artikel 26, derde lid, onder b en c, van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel139
  - number: '139.2'
    text: |-
      Onze Minister kan de verantwoordelijkheid voor de verwerking, bedoeld in het eerste lid, overdragen aan het college
      van burgemeester en wethouders van een gemeente. De overdracht geschiedt slechts na instemming van het bevoegde
      orgaan van de gemeente.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel139
  - number: '139.3'
    text: |-
      Ten aanzien van het persoonskaartenarchief is [artikel 136, tweede tot en met vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '139.4'
    text: |-
      Ten aanzien van het schakelregister is [artikel 136, tweede, vierde en vijfde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '140.1'
    text: |-
      De gegevens die zijn opgenomen in het schakelregister kunnen ten behoeve van de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en van andere wetten door de Sociale verzekeringsbank,
      ter beschikking worden gesteld aan de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '140.2'
    text: |-
      De Sociale verzekeringsbank gebruikt de gegevens slechts ten behoeve van de uitvoering van de in het eerste lid
      bedoelde wetten.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel140
  - number: '140.3'
    text: |-
      De Sociale verzekeringsbank deelt de gegevens niet mee aan andere afnemers of aan derden, behalve als mededeling
      wordt vereist ingevolge een wettelijk voorschrift of geschiedt met toestemming van de geregistreerde.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel140
  - number: '140.4'
    text: Onze Minister kan nadere regels stellen omtrent de terbeschikkingstelling van de gegevens.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel140
  - number: '141.1'
    text: |-
      Bij de eerste inschrijving van een persoon van wie in het persoonskaartenarchief een persoonskaart is opgenomen,
      kan het college van burgemeester en wethouders op de persoonslijst op te nemen gegevens ontlenen aan de
      desbetreffende persoonskaart. Bij het ontlenen van gegevens over de kinderen van de betrokkene geeft het college
      van burgemeester en wethouders geen toepassing aan [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel38
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '141.2'
    text: |-
      Onze Minister, of het in [artikel 139, tweede lid][ref1], bedoelde college van burgemeester en wethouders,
      verstrekt op verzoek van het in het eerste lid bedoelde college van burgemeester en wethouders de gegevens die
      zijn vermeld op de desbetreffende persoonskaart. Deze gegevens blijven berusten bij het college van burgemeester en
      wethouders aan wie ze zijn verstrekt. [Artikel 136][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel136
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '139'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '136'
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: '2'
  - number: '142.1'
    text: |-
      Er is een centraal archief van overledenen, bestaande uit de persoonskaarten, bedoeld in artikel 69, tweede lid,
      van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel142
  - number: '142.2'
    text: |-
      Onze Minister is de verantwoordelijke voor de verwerking van persoonsgegevens in het centraal archief van
      overledenen, bedoeld in het eerste lid. Hij treft een regeling ter bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel142
  - number: '143.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent heffingen in verband met de
      verstrekking van gegevens uit de hierna genoemde registraties, voor zover Onze Minister de verantwoordelijke is
      voor de verwerking van persoonsgegevens in deze registraties:
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
  - number: 143.1.b
    text: het centraal bevolkingsregister;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
  - number: 143.1.c
    text: het persoonskaartenarchief;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
  - number: 143.1.d
    text: het schakelregister;
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
  - number: 143.1.e
    text: het centraal archief van overledenen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
  - number: '143.2'
    text: |-
      Op grond van de in het eerste lid bedoelde regels kunnen uitsluitend heffingen ingesteld worden in verband met de
      verstrekking van gegevens aan derden, anders dan de verstrekking overeenkomstig [artikel 99][ref1], en in verband
      met de verstrekking aan de betrokkene van hem betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '144.1'
    text: |-
      Feiten die hebben plaatsgevonden voor de inwerkingtreding van dit artikel en die van belang zijn voor de bijhouding
      van gegevens in of de verstrekking van gegevens uit de voor die inwerkingtreding gehouden bevolkingsregisters,
      worden afgewikkeld op de voet van het Besluit bevolkingsboekhouding, tenzij de desbetreffende gegevens op grond van
      deze wet worden opgenomen in of verstrekt uit de basisadministraties.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel144
  - number: '144.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden omtrent de uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel144
  - number: '145.1'
    text: |-
      Een twistgeding als uitvloeisel van een beroep als bedoeld in artikel 107 van het Besluit bevolkingsboekhouding
      dat op de datum van inwerkingtreding van dit artikel nog niet is geëindigd, wordt op de voet van dat artikel
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel145
  - number: '145.2'
    text: |-
      Geschillen omtrent of voortvloeiend uit de toepassing van het Besluit bevolkingsboekhouding die op de datum van
      inwerkingtreding van dit artikel aanhangig zijn, worden op de voet van artikel 108 van genoemd besluit beslist.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel145
  - number: '146.1'
    text: |-
      Het college van burgemeester en wethouders behoeft, in afwijking van hetgeen daarover krachtens [artikel 6][ref1]
      en in [artikel 110][ref2] is bepaald, geen aantekening te houden van de verstrekking van gegevens aan
      buitengemeentelijke afnemers en aan derden als bedoeld in [artikel 99][ref3] voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '110'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 146.1.a
    text: |-
      de verstrekking niet plaatsvindt op grond van een besluit als bedoeld in [artikel 91, eerste lid][ref1], of
      [artikel 99, achtste lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '99'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 146.1.b
    text: |-
      het college van burgemeester en wethouders ten tijde van de verstrekking redelijkerwijs mag aannemen, dat het
      belang van degene over wie gegevens worden verstrekt niet onevenredig zal worden geschaad door geen aantekening
      te houden.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146
  - number: '146.2'
    text: |-
      Het college van burgemeester en wethouders kan, bij het doen van een in [artikel 103][ref1] bedoelde mededeling
      omtrent de verstrekking van gegevens uit de basisadministratie, volstaan met een in algemene termen gestelde
      mededeling omtrent de verstrekking, indien van de verstrekking overeenkomstig het eerste lid geen aantekening is
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel103
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '103'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '146.3'
    text: |-
      Het college van burgemeester en wethouders kan slechts toepassing geven aan het eerste lid gedurende drie jaren na
      de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146
  - number: 146a
    text: |-
      Een persoon die op de datum van inwerkingtreding van dit artikel op grond van artikel 17, tweede lid, onder *b*,
      van het Besluit bevolkingsboekhouding niet in een persoonsregister is opgenomen, wordt gelijkgesteld met een
      persoon ten aanzien van wie een aanwijzing als bedoeld in [artikel 32][ref1] van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel32
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 146b.1
    text: |-
      De verplichtingen, bedoeld in de [artikelen 3b][ref1] en [62, eerste lid][ref2], zijn tot 1 januari 2010 alleen van
      toepassing op bij of krachtens algemene maatregel van bestuur aangewezen afnemers of categorieën van afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel62
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel146b
    references:
