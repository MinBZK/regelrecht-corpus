  - number: '147.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel147
  - number: '148'
    text: |-
      De termijn, bedoeld in [artikel 12, eerste lid, van de Archiefwet 1995][ref1] (*Stb.* 276), vangt aan bij degene
      die op de dag van zijn overlijden ingezetene is, op die dag, en bij degene die na vertrek uit Nederland op de dag
      vallende honderd jaar na de geboorte niet-ingezetene is, op die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '150'
    text: De Wet bevolkings- en verblijfregisters (*Stb.* 1948, I 393) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel150
  - number: '151.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, waarbij bepaalde artikelen of
      onderdelen daarvan kunnen worden uitgezonderd. Deze artikelen en onderdelen treden in werking op een nader bij
      koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel151
  - number: '151.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister de nummering van de artikelen, paragrafen, afdelingen
      en hoofdstukken van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van artikelen,
      paragrafen, afdelingen en hoofdstukken daarmee in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel151
  - number: '152'
    text: 'Deze wet kan worden aangehaald als: Wet gemeentelijke basisadministratie persoonsgegevens.'
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel152
