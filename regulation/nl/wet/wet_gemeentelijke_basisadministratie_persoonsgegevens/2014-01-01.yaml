        hoofdstuk: '4'
  - number: 119.2.b
    text: |-
      de verstrekking van gegevens uit het vestigingsregister aan derden op grond van [artikel 100][ref1] in samenhang
      met [artikel 116][ref2], door Onze Minister geregeld wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel116
    url: https://wetten.overheid.nl/BWBR0006723/2014-01-01#Artikel119
