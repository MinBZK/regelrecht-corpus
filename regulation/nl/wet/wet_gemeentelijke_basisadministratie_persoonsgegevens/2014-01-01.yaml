        artikel: '96'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: '147.1'
    text: |-
      Overtreding van de [artikelen 65][ref1], [66][ref2], [67, vijfde lid][ref3], [68][ref4], [69][ref5], [70][ref6],
      [71][ref7], [72][ref8], [75][ref9] en [76][ref10] wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.


