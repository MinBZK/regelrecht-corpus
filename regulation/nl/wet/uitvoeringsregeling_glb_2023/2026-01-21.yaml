  - number: '51.2'
    text: |-
      De [Uitvoeringsregeling rechtstreekse betalingen GLB][ref1] blijft van toepassing ten aanzien van aanvragen die op
      grond van die regeling zijn ingediend vóór 1 januari 2023.


