preamble:
  text: |-
    Gelet op Verordening (EU) nr. 2021/2115 van het Europees Parlement en de Raad van 2 december 2021 tot vaststelling
    van voorschriften inzake steun voor de strategische plannen die de lidstaten in het kader van het gemeenschappelijk
    landbouwbeleid opstellen (strategische GLB-plannen) en die uit het Europees Landbouwgarantiefonds (ELGF) en
    het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) worden gefinancierd, en tot intrekking van
    Verordeningen (EU) nr. 1305/2013 en (EU) nr. 1307/2013 (PbEU 2021, L435) en Verordening (EU) nr. 2021/2116 van
    het Europees Parlement en de Raad van 2 december 2021 inzake de financiering, het beheer en de monitoring van
    het gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EU) nr. 1306/2013 (PbEU 2021, L435) en de
    artikelen 15, 19, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvraagjaar:* kalenderjaar waarin de aanvraag wordt gedaan;
        - *administratieve sanctie:* verlagen van de betaling naar aanleiding van een niet-naleving;
        - *areaalmonitoring:* systeem als bedoeld in artikel 65, vierde lid, onderdeel b, van [verordening (EU) 2021/2116]
      (32021R2116);
        - *Belastingdienst:* Belastingdienst als bedoeld in
      [artikel 2, eerste lid, van de Uitvoeringsregeling Belastingdienst 2003][ref1];
        - *blijvend grasland:* perceel met een natuurlijke of ingezaaide vegetatie van meer dan 50 procent grassen of
      kruidachtige voedergewassen dat minimaal vijf jaar niet is opgenomen in de vruchtwisseling;
        - *blijvende teelt:* teelt van gewassen, anders dan blijvend grasland, die niet in de vruchtwisseling zijn
      opgenomen en die de grond gedurende ten minste vijf jaar in beslag nemen en geregeld een oogst opleveren;
        - *boslandbouw:* vorm van landbouw waarbij bomen en struiken bewust worden geteeld tussen niet-houtige gewassen of
      worden gecombineerd met dierhouderij op hetzelfde perceel;
        - *bouwland:* grond die voor de teelt van gewassen, anders dan blijvend grasland en blijvende teelt, wordt gebruikt
      of daarvoor beschikbaar is maar braak ligt;
        - *braak:* bouwland waarop in het aanvraagjaar voor een periode van minimaal 6 aaneengesloten maanden, of op
      basis van de subsidieregelingen ANLb of de Catalogus Groenblauwe diensten, geen productie plaatsvindt en waarop
      natuurlijke of ingezaaide vegetatie voorkomt;
        - *certificerende instantie:* instantie die door de Raad ISO-geaccrediteerd is voor certificerings- of
      inspectiewerkzaamheden;
        - *droogstaande koeien:* vrouwelijke runderen die gehouden worden voor de productie van melk en die zich bevinden
      in de fase tussen de periode van melk geven en het moment van afkalven;
        - *eco-activiteiten:* landbouwpraktijken als bedoeld in artikel 31, tweede lid, van [verordening (EU) 2021/2115]
      (32021R2115);
        - *Europees Landbouwgarantiefonds:* Europees Landbouwgarantiefonds als bedoeld in artikel 4, onderdeel a, van
      [verordening (EU) 2021/2116](32021R2116);
        - *flauw talud:* een talud dat tenminste 2 meter breed is vanaf de waterlijn tot aan de insteek en met een helling
      die niet steiler is dan 1:3;
        - *grootvee-eenheid:* coëfficiënt voor het omrekenen van dieren zoals opgenomen in de bijlage, punt 12, onder b,
      van [Verordening (EU) nr. 2021/2290](32021R2290);
        - *hamsterverbintenis:* een verbintenis aangegaan in het kader van subsidieregelingen van de provincie Limburg met
      als specifiek doel de bescherming van de habitat voor de hamster;
        - *hoofdactiviteit:* eerstgenoemde activiteit die in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref2], is vermeld;
        - *hoofdteelt:* teelt op landbouwareaal van een gewas dat in de periode van 15 mei tot en met 15 juli het langst
      aanwezig is;
        - *I&R register:* geautomatiseerd gegevensbestand als bedoeld in
      [afdeling 5b.4 van de Regeling houders van dieren][ref3];
        - *kortlopend hakhout:* boomsoorten met een maximale omlooptijd van vijf jaar met een plantdichtheid van minimaal
      10.000 stoven per hectare, die behoren tot het geslacht wilg, populier, els of es;
        - *kruidachtige voedergewassen:* alle kruidachtige planten die traditioneel in natuurlijk grasland voorkomen of
      normaliter in zaadmengsels voor grasland worden opgenomen met uitzondering van heide en riet;
        - *landbouwactiviteit:* productie of landbouwareaal in een staat houden die begrazing of teelt mogelijk maakt
      zonder dat daarvoor voorbereidende activiteiten nodig zijn die verder gaan dan activiteiten op basis van de
      gebruikelijke landbouwmethoden en -machines;
        - *landbouwareaal:* grond die wordt gebruikt als bouwland, blijvend grasland of blijvende teelt;
        - *landbouwer:* natuurlijke of rechtspersoon of een groep natuurlijke of rechtspersonen die een minimumniveau aan
      landbouwactiviteiten uitvoert;
        - *landschapselementen:* begroeide terrein- en waterdelen en overige elementen waarop het uitoefenen van een
      landbouwactiviteit niet mogelijk is;
        - *lichte grondbewerking:* graslandvernieuwingstechniek waarbij de ondergrond vrijwel onberoerd blijft en waarbij
      een dekkende vegetatie zichtbaar blijft;
        - *melkvee:* koeien (bos taurus) die ten minste éénmaal hebben gekalfd en die bedrijfsmatig worden gehouden voor de
      productie van melk voor menselijke consumptie, of verwerking daarvan;
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *mulchsysteem:* teeltsysteem waarbij de bodem in het najaar wordt geploegd, gevolgd door de inzaai van een
      bodembedekking, waarbij in het voorjaar uitsluitend niet-kerende grondbewerking plaatsvindt;
        - *natte teelten:* natte teelt als bedoeld in [bijlage 1][ref4];
        - *nevenactiviteit:* activiteit die in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref5], is vermeld na de hoofdactiviteit;
        - *niet-productieve gronden:* landschapselementen, braak, plas-dras gedurende de inundatieperiode, bufferstroken
      als bedoeld in artikel 32, onderdeel b, in samenhang met Bijlage 4, onder 4 en 4a die worden gebruikt voor niet-
      productieve doeleinden, akkerranden en andere stroken of randen van gras of kruiden die niet aangemerkt kunnen
      worden als landbouwproductie;
        - *onregelmatigheid:* onregelmatigheid als bedoeld in artikel 2, onderdeel a, van [verordening (EU) 2021/2116]
      (32021R2116);
        - *oppervlaktewaterlichaam:* samenhangend geheel van vrij aan het aardoppervlak voorkomend water, met
      de daarin aanwezige stoffen, en de bijbehorende bodem en oevers, alsmede flora en fauna, als bedoeld in
      [artikel 1.1 van de Omgevingswet][ref6];
        - *peildatum:* 15 mei van het aanvraagjaar;
        - *perceel landbouwgrond:* aaneengesloten stuk landbouwareaal, waaronder begrepen aangrenzende landschapselementen
      die ter beschikking van de landbouwer staan, dat door één landbouwer is aangegeven;
        - *productie:* produceren van landbouwproducten als bedoeld in het Verdrag betreffende de werking van de Europese
      Unie (VWEU), bijlage I, met uitzondering van visserijproducten, alsmede hakhout met korte omlooptijd;
        - *Raad:* Raad voor Accreditatie te Utrecht;
        - *RVO:* Rijksdienst voor Ondernemend Nederland;
        - *schema-eigenaar:* de eigenaar van een certificeringsschema, dat door de Minister wordt erkend;
        - *subsidiabele hectare:* landbouwareaal van het landbouwbedrijf dat wordt gebruikt voor een landbouwactiviteit
      of in overwegende mate voor landbouwactiviteiten wordt gebruikt en ter beschikking van de landbouwer staat,
      landschapselementen aanwezig op of grenzend aan landbouwareaal die ter beschikking van de landbouwer staan, areaal
      dat wordt ingezet voor een conditionaliteitsnorm als bedoeld in bijlage III, onder GLMC 8, van [verordening (EU)
      2021/2115](32021R2115), alsmede natte teelten op areaal als bedoeld in artikel 4, vierde lid, onderdeel c, onder ii
      van [verordening (EU) 2021/2115](32021R2115);
        - *THI:* temperatuur en luchtvochtigheidsindex;
        - *verlaging:* elke vermindering op de betaling als gevolg van het toepassen van een administratieve sanctie;
        - *verlengde teelt:* teelt van een gewas dat langer dan één jaar onafgebroken aanwezig is;
        - *verordening (EU) 2018/848:* [Verordening (EU) 2018/848](32018R0848) van het Europees parlement en de Raad van
      30 mei 2018 inzake de biologische productie en de etikettering van biologische producten en tot intrekking van
      [Verordening (EG) nr. 834/2007](32007R0834) van de Raad (PbEU 2018, L150);
        - *verordening (EU) 2021/2115:* [Verordening (EU) 2021/2115](32021R2115) van het Europees parlement en de Raad
      van 2 december 2021 tot vaststelling van voorschriften inzake steun voor de strategische plannen die de lidstaten
      in het kader van het gemeenschappelijk landbouwbeleid opstellen (strategische GLB-plannen) en die uit het
      Europees Landbouwgarantiefonds (ELGF) en het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) worden
      gefinancierd, en tot intrekking van [Verordeningen (EU) nr. 1305/2013](32013R1305) en [Verordening (EU) nr.
      1307/2013](32013R1307) (PbEU 2021, L435);
        - *verordening (EU) 2021/2116:* [Verordening (EU) 2021/2116](32021R2116) van het Europees parlement en de Raad van
      2 december 2021 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot
      intrekking van [Verordening (EU) nr. 1306/2013](32013R1306) (PbEU 2021, L435);
        - *verordening (EU) 2021/2290:* [Uitvoeringsverordening (EU) 2021/2290](32021R2290) van de Commissie van
      21 december 2021 tot vaststelling van regels voor de berekeningsmethoden voor de gemeenschappelijke output- en
      resultaatindicatoren die zijn opgenomen in bijlage I bij [Verordening (EU) 2021/2115](32021R2115) van het Europees
      parlement en de Raad tot vaststelling van voorschriften inzake steun voor de strategische plannen die de lidstaten
      in het kader van het gemeenschappelijk landbouwbeleid opstellen (strategische GLB-plannen) en die uit het Europees
      Landbouwgarantiefonds (ELGF) en het Europees Landbouwfonds voor plattelandsontwikkeling worden gefinancierd, en
      tot intrekking van [Verordeningen (EU) nr. 1305/2013](32013R1305) en [(EU) nr. 1307/2013](32013R1307) (PbEU 2021,
      L458);
        - *verordening (EU) 2022/126:* Gedelegeerde [verordening (EU) 2022/126](32022R0126) van de Commissie van
      7 december 2021 tot aanvulling van [Verordening (EU) 2021/2115](32021R2115) van het Europees parlement en de Raad
      met aanvullende eisen voor bepaalde interventietypes die de lidstaten in het kader van die verordening in hun
      strategisch GLB-plan voor de periode 2023-2027 uitwerken, alsmede regels voor het aandeel in het kader van norm 1
      inzake een goede landbouw- en milieuconditie (GLMC) (PbEU 2022, L20);
        - *verordening (EU) 2022/128:* [Uitvoeringsverordening (EU) 2022/128](32022R0128) van de Commissie van 21 december
      2021 tot vaststelling van uitvoeringsbepalingen voor [Verordening (EU) 2021/2116](32021R2116) van het Europees
      parlement en de Raad wat betreft betaalorganen en andere instanties, financieel beheer, goedkeuring van de
      rekeningen, controles, zekerheden en transparantie (PbEU 2022, L20);
        - *verordening (EU) 2022/1172:* Gedelegeerde [verordening (EU) 2022/1172](32022R1172) van de Commissie van
      4 mei 2022 tot aanvulling van [Verordening (EU) 2021/2116](32021R2116) van het Europees parlement en de Raad wat
      betreft het geïntegreerd beheers- en controlesysteem van het gemeenschappelijk landbouwbeleid en de toepassing en
      berekening van administratieve conditionaliteitssancties (PbEU 2022, L183);
        - *weiden:* het grazen op grasland met voldoende gras door al het daarvoor in het kader van een normale
      bedrijfsvoering van een landbouwer in aanmerking komend lacterend melkvee, zodat de dieren een natuurlijk
      graasgedrag kunnen laten zien;
        - *zeldzame landbouwhuisdierrassen:* met uitsterven bedreigde landbouwhuisdierrassen als bedoeld in artikel 45,
      tweede lid, onderdeel a, van [Verordening (EU) 2022/126](32022R0126).


