        artikel: '1'
  - number: '1.2'
    text: |-
      De definities in [verordening (EU) 2021/2115](32021R2115) en [verordening (EU) 2021/2116](32021R2116) alsmede in de
      op deze verordeningen gebaseerde verordeningen zijn van overeenkomstige toepassing voor deze regeling.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel1
  - number: '2.1'
    text: 'De minister verstrekt rechtstreekse betalingen inzake:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: 2.1.a
    text: basisinkomenssteun voor duurzaamheid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: 2.1.b
    text: aanvullende herverdelende inkomenssteun voor duurzaamheid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: 2.1.c
    text: aanvullende inkomenssteun voor jonge landbouwers;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: 2.1.d
    text: de eco-regeling.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: '2.2'
    text: De minister verstrekt voorts betalingen inzake de regeling voor zeldzame landbouwhuisdierrassen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: '2.3'
    text: |-
      De minister stelt elk jaar voor alle in het eerste en tweede lid genoemde betalingen het eenheidsbedrag vast binnen
      de marges, bedoeld in artikel 102, tweede lid, van [verordening (EU) 2021/2115](32021R2115), waarbij eerst een
      voorlopig en daarna een definitief eenheidsbedrag kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: '2.4'
    text: |-
      De minister kan middelen bestemd voor de in het eerste lid genoemde rechtstreekse betalingen herverdelen
      overeenkomstig artikel 101, derde lid, van [verordening (EU) 2021/2115](32021R2115).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: '2.5'
    text: De minister is bevoegd tot het uitbetalen, terugvorderen en verrekenen van betalingen en het opleggen van sancties.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel2
  - number: '3'
    text: |-
      Het criterium waaraan de landbouwer dient te voldoen om een landbouwareaal in een staat te houden die begrazing
      of teelt mogelijk maakt, als bedoeld in artikel 4, tweede lid, onderdeel b, van [verordening (EU) 2021/2115]
      (32021R2115), is:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel3
  - number: 3.a
    text: |-
      het jaarlijks, vóór 1 oktober, maaien van het areaal grasland, tenzij de landbouwer als gevolg van een contract
      voor agrarisch natuurbeheer op basis van de subsidieregelingen ANLb en Catalogus Groenblauwe diensten niet aan dit
      criterium kan voldoen, in welk geval het areaal ten minste één keer per twee jaar vóór 1 oktober wordt gemaaid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel3
  - number: 3.b
    text: het areaal bouwland in zodanige staat houden dat regelmatig een akkerbouwgewas kan worden ingezaaid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel3
  - number: 3.c
    text: het areaal blijvende teelt in goede vegetatieve staat houden die productief potentieel heeft.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel3
  - number: '4.1'
    text: |-
      Voor de uitvoering van zijn taken en bevoegdheden baseert de minister zich voor de grenzen van de
      referentiepercelen op het perceelsregister van RVO dat is gebaseerd op de objectgrenzen uit de Basisregistratie
      Grootschalige Topografie.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.2'
    text: |-
      Op de peildatum heeft de landbouwer het perceel landbouwgrond ter beschikking op grond van eigendom, pacht of
      onderpacht dan wel in gebruik met toestemming van de eigenaar of van de pachter die het perceel landbouwgrond met
      toestemming van de eigenaar heeft onderverpacht.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.3'
    text: |-
      Als landbouwareaal komt tevens in aanmerking boslandbouw op areaal dat sinds 2015 minimaal één jaar werd aangemerkt
      als landbouwareaal.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.4'
    text: Als bouwland komt tevens in aanmerking een perceel met maximaal 100 bomen per hectare.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.5'
    text: 'Als blijvende teelt komt tevens in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.a
    text: |-
      een perceel boslandbouw als voedselbos met verschillende bomen en struiken waarvan de soorten binnen afzienbare
      termijn voor eetbare producten zorgen, onder de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.a.1°
    text: er mag een kruinlaag van hogere bomen staan die een ondersteunende functie voor de andere soorten heeft;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.a.2°
    text: er zijn minimaal drie verticale vegetatielagen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.a.3°
    text: de kruinlaag en vegetatielagen mogen nog in ontwikkeling zijn;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b
    text: 'arealen met jonge houtachtige planten in de open lucht, bestemd om later te worden verplant en kwekerijen van:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b.1°
    text: wijnstokken en moederplanten;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b.2°
    text: vruchtbomen en kleinfruitgewassen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b.3°
    text: siergewassen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b.4°
    text: |-
      voor de verkoop bestemde bosplanten, exclusief de in het bos gelegen bosboomkwekerijen voor de eigen behoefte van
      het bedrijf;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.b.5°
    text: |-
      bomen en heesters ter beplanting van tuinen, parken, straten en wegbermen, alsmede onderstammen en jonge zaailingen
      ervan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.5.c
    text: kortlopend hakhout.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.6'
    text: 'Als blijvend grasland komt tevens in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: 4.6.a
    text: |-
      mengsels van gras, niet zijnde riet, met een gewas uit de gewassenlijst ‘stikstofbindende gewassen’ als bedoeld in
      [bijlage 1][ref1], waarbij het aandeel gras meer dan 50% is; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 4.6.b
    text: areaal blijvend grasland met maximaal 100 bomen per hectare.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '4.7'
    text: Voor controle op de toestemming, bedoeld in het tweede lid, kan schriftelijk bewijs worden opgevraagd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel4
  - number: '5.1'
    text: |-
      Er worden geen betalingen toegekend aan landbouwers die niet uiterlijk op de peildatum zijn ingeschreven
      of waarvan de onderneming niet uiterlijk op de peildatum is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], onder de vermelding van de verkorte omschrijving van de
      landbouwactiviteit en de daarbij behorende code van de Standaard Bedrijfsindeling (SBI) beginnend met de cijfers
      011, 012, 013, 014, 015, 016 of 1051, voor zover minimaal 50 procent van de melk die wordt verwerkt op het eigen
      melkveebedrijf geproduceerd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '5.2'
    text: |-
      Onverminderd het eerste lid worden geen betalingen toegekend aan een landbouwer indien uit de inschrijving in het
      handelsregister volgt dat de landbouwactiviteit geen hoofdactiviteit is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
  - number: '5.3'
    text: |-
      Het tweede lid is niet van toepassing indien de landbouwer aantoont door middel van een accountantsverklaring dat
      de landbouwactiviteit een nevenactiviteit is, waaronder begrepen het in stand houden van landbouwareaal, waarmee
      een derde van het totale bedrag aan inkomsten in het meest recente belastingjaar wordt verdiend, dan wel een derde
      van een gemiddeld bedrag aan inkomsten over de drie meest recente belastingjaren.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
  - number: '5.4'
    text: |-
      Als accountantsverklaring wordt vastgesteld een accountantsverklaring die overeenkomt met het model dat is
      opgenomen in [bijlage5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: '5.5'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ingeval de landbouwer over het voorgaande aanvraagjaar
      rechtstreekse betalingen heeft ontvangen en deze vóór het toepassen van sancties en verlagingen minder dan
      5.000 euro bedroegen, of ingeval in het voorgaande aanvraagjaar geen rechtstreekse betalingen zijn toegekend,
      de landbouwer voor het huidige aanvraagjaar rechtstreekse betalingen zal ontvangen en deze minder dan 5.000 euro
      zullen bedragen, berekend op basis van het aantal in het huidige aanvraagjaar opgegeven hectaren, vermenigvuldigd
      met de eenheidsbedragen als bedoeld in [artikel 2, derde lid][ref1], die in het voorgaande aanvraagjaar van
      toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.6'
    text: |-
      Een overnemer als bedoeld in [artikel 40, eerste lid][ref1], wordt als actieve landbouwer aangemerkt indien de
      inschrijving, bedoeld in het eerste lid, uiterlijk ten tijde van de melding van de overdracht van het bedrijf is
      geschied, en voor zover uit de inschrijving blijkt dat het bedrijf van de overnemer is opgericht op uiterlijk de
      datum van de bedrijfsoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel40
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '40'
        hoofdstuk: '4'
  - number: '6.1'
    text: |-
      Landbouwareaal dat ook wordt gebruikt voor niet-landbouwactiviteiten, wordt aangemerkt als overwegend voor
      landbouwactiviteiten gebruikt areaal indien geen sprake is van noemenswaardige hinder voor de uitoefening van
      landbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.2'
    text: 'Van de in het eerste lid bedoelde situatie is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.2.a
    text: maximaal 90 dagen in het jaar van aanvraag niet-landbouwactiviteiten plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.2.b
    text: |-
      het landbouwareaal na afloop van deze activiteiten weer in een staat verkeert waarin begrazing of teelt mogelijk
      is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.3'
    text: |-
      Van de in het eerste lid bedoelde situatie is tevens sprake indien op een landbouwareaal voor meer dan 90 dagen
      niet-landbouwactiviteiten plaatsvinden in het kader van contracten op basis van de subsidieregelingen ANLb of de
      Catalogus Groenblauwe diensten en het landbouwareaal na afloop van deze activiteiten weer in een staat verkeert
      waarin begrazing of teelt mogelijk is overeenkomstig [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel3
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.4'
    text: |-
      Als areaal dat overwegend voor niet-landbouwactiviteiten wordt gebruikt en daardoor voor de toepassing van
      [artikel 2, eerste lid][ref1], niet wordt beschouwd als subsidiabele hectare, wordt in elk geval aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 6.4.a
    text: moes- en siertuinen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.b
    text: bermen tot een breedte van drie meter van de weg of breder voor zover de verkeersbestemming de landbouw hindert;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.c
    text: speelweides;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.d
    text: stroken grasland langs verharde landingsbanen voor vliegverkeer;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.e
    text: onverharde landingsbanen voor luchtsport en luchtvaart;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.f
    text: stroken langs gebouwen of kassen smaller dan één meter;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.g
    text: geluidswallen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.h
    text: springweides;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.i
    text: kinderboerderijen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.j
    text: erven;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.4.k
    text: areaal waarop installaties voor de benutting van zonne-energie aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.5'
    text: |-
      In afwijking van het vierde lid, onderdeel k, is er sprake van subsidiabele hectare indien verspreid over het
      perceel maximaal 100 zonnepanelen per hectare staan die gezamenlijk een oppervlakte van maximaal 100m² beslaan.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.6'
    text: |-
      De minimumoppervlakte van een perceel landbouwgrond waarvoor rechtstreekse betalingen als bedoeld in
      [artikel 2, eerste lid][ref1], kunnen worden aangevraagd bedraagt afgerond 0,01 hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.7'
    text: 'In afwijking van het zesde lid komt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.7.a
    text: |-
      een perceel landbouwgrond met een afgeronde oppervlakte kleiner dan 0,01 hectare voor steun in aanmerking, voor
      zover is voldaan aan de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.7.a.1°
    text: |-
      het perceel grenst direct aan een ander perceel landbouwgrond van dezelfde landbouwer waarbij de totale oppervlakte
      afgerond minimaal 0,01 hectare bedraagt; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.7.a.2°
    text: tussen de percelen bevindt zich geen afrastering of enige andere vorm van fysieke begrenzing.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: 6.7.b
    text: |-
      een perceel landbouwgrond met alleen een landschapselement met een afgeronde oppervlakte kleiner dan 0,01 hectare
      voor steun in aanmerking.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.8'
    text: |-
      Het maximum subsidiabele areaal wordt vastgesteld per referentieperceel waarbij een marge als bedoeld in artikel 2,
      zevende lid, onderdeel a, van [verordening (EU) 2022/1172](32022R1172), kan worden gehanteerd van maximaal 125 cm,
      rekening houdend met de omtrek en conditie van het referentieperceel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
  - number: '6.9'
    text: |-
      Indien het verschil tussen het subsidiabele areaal en het totale areaal dat op grond van
      [artikel 10, tweede lid][ref1], is opgegeven niet meer dan 0,1 ha bedraagt, wordt het subsidiabele areaal
      gelijkgesteld aan het opgegeven areaal.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Voor de uitvoering van zijn taken en bevoegdheden baseert de minister zich voor de grenzen van landschapselementen
      op de referentiepercelen van het perceelsregister van RVO dat is gebaseerd op de objectgrenzen uit de
      Basisregistratie Grootschalige Topografie.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.2'
    text: 'Als landschapselement, zijnde begroeide terreindelen, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.2.a
    text: boomgroepen met een maximum oppervlakte van 1,5 hectare op maaiveldniveau;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.2.b
    text: geïsoleerde bomen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.2.c
    text: heggen en hagen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.2.d
    text: houtsingels of houtwallen; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.2.e
    text: struwelen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.3'
    text: 'Als landschapselementen, zijnde waterdelen, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.3.a
    text: |-
      sloten, niet zijnde grachten, smaller dan tien meter van insteek naar insteek, waarbij geldt dat ze geheel
      meetellen als ten minste 90 procent van de sloot smaller is dan tien meter;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.3.b
    text: watervlakten met een oppervlakte tussen 0,001 hectare en 0,5 hectare; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.3.c
    text: |-
      sloten die doorgaans het hele jaar droog staan, smaller dan tien meter van insteek naar insteek, waarbij geldt dat
      ze geheel meetellen als ten minste 90 procent van de sloot smaller is dan tien meter.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.4'
    text: 'Als landschapselementen, zijnde overige elementen met een oppervlakte van maximaal 1,5 hectare, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.a
    text: natuurvriendelijke oevers;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.b
    text: schouwpaden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.c
    text: zandwallen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.d
    text: tuunwallen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.e
    text: ruigtes op landbouwareaal;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.f
    text: stroken wild gras;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.g
    text: graften; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.4.h
    text: rietland.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.5'
    text: 'Als aangrenzende landschapselementen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.5.a
    text: lijnvormige landschapselementen waarvan ten minste één lange zijde is gelegen binnen vijf meter van landbouwareaal;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.5.b
    text: niet-lijnvormige landschapselementen die binnen vijf meter van landbouwareaal liggen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: 7.5.c
    text: |-
      landschapselementen die direct grenzen aan landschapselementen als bedoeld onder a en b, met dien verstande dat
      indien sprake is van een lijnvormig landschapselement, het landschapselement met ten minste één lange zijde grenst
      aan het onder a of b bedoelde landschapselement.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.6'
    text: |-
      Op de peildatum heeft de landbouwer de landschapselementen ter beschikking op grond van eigendom, pacht of
      onderpacht dan wel in gebruik met toestemming van de eigenaar of van de pachter die de landschapselementen met
      toestemming van de eigenaar heeft onderverpacht.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.7'
    text: Landschapselementen die volledig zijn omsloten door niet subsidiabele arealen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.8'
    text: |-
      Van lijnvormige landschapselementen waarvan de lange zijde doorloopt tot voorbij landbouwareaal of een
      landschapselement dat binnen vijf meter van landbouwareaal ligt, behoort enkel de oppervlakte die langs het
      landbouwareaal of aangrenzende landschapselement ligt, tot de subsidiabele hectares.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '7.9'
    text: Voor controle op de toestemming, bedoeld in het zesde lid, kan schriftelijk bewijs worden opgevraagd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel7
  - number: '8'
    text: |-
      Geen rechtstreekse betalingen worden toegekend aan de landbouwer indien het totaalbedrag van de voor een
      aanvraagjaar aangevraagde of toe te kennen rechtstreekse betalingen, voordat de sancties of verlagingen zijn
      toegepast, lager is dan 500 euro.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel8
  - number: '9.1'
    text: |-
      De landbouwer die hennep teelt stuurt de minister een kopie van de originele etiketten van het gebruikte zaaizaad
      toe met gebruikmaking van een door de minister beschikbaar gesteld elektronisch formulier.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel9
  - number: '9.2'
    text: |-
      De landbouwer bewaart de aankoopbewijzen en de originele etiketten van het gebruikte zaaizaad gedurende 5 jaar in
      zijn administratie.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel9
  - number: '10.1'
    text: |-
      Een landbouwer die aanspraak maakt op betalingen als bedoeld in [artikel 2, eerste of tweede lid][ref1], dient
      hiertoe in de periode van 1 maart tot en met 15 mei van het aanvraagjaar een aanvraag in. Wanneer 15 mei een
      zaterdag of zondag is wordt de uiterste termijn verlengd tot en met de eerstvolgende dag die niet een zaterdag of
      zondag is.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      De aanvraag wordt gedaan door middel van een door de minister beschikbaar gesteld elektronisch formulier en bevat
      in ieder geval:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.2.a
    text: |-
      een opgave van alle percelen met de daarop in het aanvraagjaar geteelde of te telen gewassen en in voorkomend geval
      alle landschapselementen, die op de peildatum ter beschikking van de landbouwer staan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.2.b
    text: |-
      een opgave van de in het aanvraagjaar gerealiseerde of te realiseren eco-activiteiten, bedoeld in de
      [artikelen 18 tot en met 24][ref1], per perceel;


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel18
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 10.2.c
    text: |-
      een opgave van de zeldzame landbouwhuisdierrassen, als bedoeld in [artikel 28][ref1], die betrekking hebben op het
      desbetreffende aanvraagjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel28
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 10.2.d
    text: |-
      het BTW-nummer van de landbouwer en, indien van toepassing, de naam van de moedermaatschappij of dochteronderneming
      met het daarbij behorende BTW-nummer;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.2.e
    text: |-
      ingeval van de teelt van hennep, het geteelde ras en een indicatie van de hoeveelheid gebruikt zaaizaad, uitgedrukt
      in kilogrammen per hectare; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.2.f
    text: |-
      indien van toepassing een accountantsverklaring als bedoeld in [artikel 5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      De landbouwer houdt gedurende de periode tussen 15 mei en 15 oktober van het aanvraagjaar de bij de aanvraag
      ingediende gegevens actueel met dien verstande dat nadat zich een wijziging heeft voorgedaan, onverwijld door
      middel van een door de minister beschikbaar gesteld formulier een wijziging van de gegevens wordt ingediend, voor
      zover die wijziging betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.3.a
    text: de gewassen die per perceel worden geteeld;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.3.b
    text: |-
      de in de aanvraag per perceel opgenomen eco-activiteiten als bedoeld in de [artikelen 18 tot en met 24][ref1] die
      niet, gedeeltelijk niet, of niet volgens de voorwaarden, worden uitgevoerd; of


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel18
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 10.3.c
    text: het aanwezig zijn van noemenswaardige hinder voor de uitoefening van landbouwactiviteiten op een perceel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: '10.4'
    text: |-
      Na de in het eerste lid bedoelde uiterste datum kunnen geen wijzigingen meer worden aangebracht in de aanvraag,
      behoudens gevallen als bedoeld in het derde lid en artikel 59, zesde lid, van [verordening (EU) 2021/2116](https://
      eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32021R2116), die tot en met 15 oktober kunnen worden ingediend,
      en gevallen als bedoeld in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel46
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '46'
        hoofdstuk: '4'
  - number: '10.5'
    text: 'De landbouwer die aanspraak maakt op betalingen verklaart voorts:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.5.a
    text: |-
      te voldoen aan de voorwaarden, bedoeld in de [artikelen 3][ref1], [4, tweede lid][ref2], [5][ref3] en
      [7, zesde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0047444#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0047444#Artikel7
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0047444
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10.5.b
    text: |-
      toestemming te verlenen aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving
      van deze regeling;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.5.c
    text: toestemming te verlenen voor het gebruik van areaalmonitoring; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: 10.5.d
    text: |-
      toestemming te verlenen aan de minister om (persoons)gegevens aan de certificerende instantie door te geven ten
      behoeve van controle door de certificerende instantie op deelname en voldoen aan de eco-activiteit weiden, bedoeld
      in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '10.6'
    text: |-
      In geval het indienen van de aanvraag op of kort voor de uiterste datum, bedoeld in het eerste lid, langere tijd
      niet mogelijk is door een calamiteit aan de kant van het elektronisch loket kan de minister met inachtneming van
      een redelijke termijn een nieuw tijdstip voor uiterste indiening van de aanvraag bepalen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: '10.7'
    text: |-
      De minister beslist op de aanvraag, bedoeld in het eerste lid, uiterlijk op 30 juni van het jaar volgend op het
      aanvraagjaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel10
  - number: '12'
    text: |-
      De belastingdienst maakt voor de uitvoering van deze regeling het BTW-nummer van de aanvrager bekend aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel12
  - number: '13.1'
    text: |-
      De minister kan een ontheffing verlenen van de verplichting langs elektronische weg de aanvraag, bedoeld in
      [artikel 10, eerste lid][ref1], in te dienen, in geval de landbouwer aantoont:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.1.a
    text: te behoren tot een geloofsgemeenschap die het gebruik van de elektronische weg in zijn geheel afwijst; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel13
  - number: 13.1.b
    text: |-
      niet te beschikken over een computer met internetverbinding en niet eerder langs elektronische weg contact te
      hebben gelegd met RVO of de rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel13
  - number: '13.2'
    text: Een ontheffing wordt uiterlijk op 1 maart van het aanvraagjaar aangevraagd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel13
  - number: '14.1'
    text: |-
      Een landbouwer die aanspraak maakt op de betaling van basisinkomenssteun voor duurzaamheid, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], krijgt aanvullend hierop een betaling van herverdelende inkomenssteun
      voor maximaal 40 hectaren.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel28
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '14.2'
    text: |-
      De minister stelt elk jaar een bedrag- en hectaregrens als bedoeld in artikel 29, derde lid, van [verordening (EU)
      2021/2115](32021R2115) vast.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel14
  - number: '15.1'
    text: |-
      Een landbouwer kan aanspraak maken op de betaling voor aanvullende inkomenssteun voor jonge landbouwers, bedoeld
      in [artikel 2, eerste lid, onderdeel c][ref1], voor de resterende periode, bedoeld in artikel 30, tweede lid,
      tweede alinea, van [verordening (EU) 2021/2115](32021R2115), indien de jonge landbouwer daadwerkelijke langdurige
      zeggenschap heeft over het bedrijf op de peildatum van het aanvraagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel28
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '15.2'
    text: |-
      Bij een aanspraak als bedoeld in het eerste lid, verleent de landbouwer toestemming aan de minister om
      persoonsgegevens te verwerken ten behoeve van de controle op de naleving van deze regeling.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel15
  - number: '16.1'
    text: 'Van daadwerkelijke langdurige zeggenschap is sprake indien de jonge landbouwer:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.1.a
    text: |-
      ten minste een blokkerende zeggenschap heeft ter zake van ondernemingsbeslissingen met een financieel belang van
      meer dan 25.000 euro; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.1.b
    text: ten minste mede belast is met de dagelijkse bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: '16.2'
    text: |-
      De blokkerende zeggenschap, bedoeld in het eerste lid, onderdeel, a, is uiterlijk op 15 mei 2022 verkregen en kan
      worden aangetoond met:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.2.a
    text: |-
      de statuten van de rechtspersoon, ingeval van een besloten vennootschap, naamloze vennootschap, een stichting en
      een vereniging met volledige rechtsbevoegdheid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.2.b
    text: een schriftelijk vastgelegde overeenkomst met alle maten, ingeval van een maatschap;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.2.c
    text: een schriftelijk vastgelegde overeenkomst met alle vennoten, ingeval van een vennootschap onder firma;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.2.d
    text: |-
      een schriftelijk vastgelegde overeenkomst tussen alle leden, ingeval van een vereniging zonder volledige
      rechtsbevoegdheid; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: 16.2.e
    text: |-
      de registratie van de blokkerende zeggenschap in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], waarvan de juistheid desgevraagd kan worden aangetoond met de
      onder a tot en met d genoemde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '16.3'
    text: |-
      De jonge landbouwer wordt geacht niet te voldoen aan het bepaalde in het eerste lid, onderdeel a, indien in een
      samenwerkingsovereenkomst voor bepaalde tijd is bepaald dat de maatschap onderscheidenlijk de vennootschap onder
      firma eenzijdig door de andere maten onderscheidenlijk vennoten kan worden opgezegd of bij bedrijfsbeëindiging de
      jonge landbouwer geen recht op voortzetting heeft.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: '16.4'
    text: Een commanditaire vennoot wordt geacht niet te voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: '16.5'
    text: |-
      De overeenkomst, bedoeld in het tweede en derde lid, is uiterlijk op de peildatum opgesteld, ondertekend en
      voorzien van de datum waarop de overeenkomst is ondertekend.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel16
  - number: '17'
    text: |-
      De minister stelt elk jaar een vast bedrag per jonge landbouwer als bedoeld in artikel 30, derde lid, tweede
      alinea, van [verordening (EU) 2021/2115](32021R2115) vast.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel17
  - number: '18'
    text: 'De Eco-activiteiten in de categorie hoofdteelt zijn:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.a
    text: 'een rustgewas, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.a.1°
    text: |-
      de landbouwer teelt uitsluitend een of meerdere gewassen uit de gewassenlijst ‘rustgewassen eco-regeling’ als
      bedoeld in [bijlage 1][ref1] als hoofdteelt met een zichtbare bedekking; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.a.2°
    text: |-
      op het betreffende perceel is in de voorgaande drie kalenderjaren tenminste één keer een rustgewas als bedoeld in
      [bijlage VIb van de Omgevingsregeling][ref1] of een rustgewas uit de gewassenlijst ‘rustgewassen eco-regeling’ als
      bedoeld in [bijlage 1][ref2], als hoofdteelt geteeld.


      [ref1]: https://wetten.overheid.nl/BWBR0045528
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0045528
      - id: ref2
        bwb_id: BWBR0047444
  - number: 18.b
    text: 'een *vezelgewas*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.b.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘vezelgewassen’ als bedoeld in [bijlage 1][ref1] als hoofdteelt
      met een zichtbare bedekking; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.b.2°
    text: |-
      [artikel 9][ref1] is van overeenkomstige toepassing op de teelt van hennep.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel9
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18.c
    text: 'een *stikstofbindend gewas*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.c.1°
    text: |-
      de landbouwer teelt uitsluitend één of meerdere gewassen uit de gewassenlijst ‘stikstofbindende gewassen’ als
      bedoeld in [bijlage 1][ref1] als hoofdteelt met een zichtbare bedekking of teelt een gewas uit de gewassenlijst
      'stikstofbindende gewassen’ als bedoeld in bijlage 1 in combinatie met graan, waarbij de oppervlakte van het
      betreffende perceel volledig zichtbaar bedekt is waarvan minimaal 50% met stikstofbindende gewassen; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.c.2°
    text: de landbouwer past deze eco-activiteit niet toe op een perceel dat het voorgaande jaar blijvend grasland was.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.d
    text: 'een *verlengde teelt*, vanaf het tweede jaar, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.d.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘verlengde teelten’ als bedoeld in [bijlage 1][ref1] als
      hoofdteelt met een zichtbare bedekking; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.d.2°
    text: het gewas is in het voorgaande jaar als hoofdteelt geteeld en staat aaneengesloten op het perceel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.e
    text: '*langjarig grasland*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.e.1°
    text: de landbouwer houdt blijvend grasland in stand op het perceel in de periode van 1 januari tot en met 31 december;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.e.2°
    text: op het perceel is vanaf 1 januari 2023 uitsluitend lichte grondbewerking toegepast; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.e.3°
    text: |-
      uitsluitend pleksgewijze toepassing van gewasbeschermingsmiddelen en biociden is toegestaan, op maximaal 10 procent
      van de oppervlakte van het betreffende perceel blijvend grasland.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.f
    text: '*kruidenrijk grasland*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.f.1°
    text: 'de landbouwer teelt:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.f.1°.a
    text: |-
      gras, kruidachtige voedergewassen en vlinderbloemigen uit de gewassenlijst ‘stikstofbindend gewas’ als bedoeld in
      [bijlage 1][ref1], op het perceel, waarbij van 1 juni tot 1 oktober en voor het jaar 2024 van 15 juli tot 1 oktober
      de oppervlakte van het betreffende perceel volledig zichtbaar bedekt is waarvan minimaal 25% met kruidachtige
      voedergewassen en vlinderbloemigen en minimaal 25% met gras, tenzij de landbouwer als gevolg van een contract voor
      agrarisch natuurbeheer op basis van de subsidieregelingen ANLb beheerspakket 3 ‘plasdras voor weidevogels’ uitvoert
      waardoor hij tijdelijk niet kan voldoen aan de zichtbare bedekking; of


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.f.1°.b
    text: |-
      gras, kruidachtige voedergewassen en vlinderbloemigen uit de gewassenlijst ‘stikstofbindend gewas’ als bedoeld in
      [bijlage 1][ref1], waarbij van 1 juni tot 1 oktober en voor het jaar 2024 van 15 juli tot 1 oktober minimaal 25
      procent uit duidelijk zichtbare kruidachtige voedergewassen en vlinderbloemigen en minimaal 25 procent uit gras
      bestaat, op de grasstroken tussen de fruitbomen of -struiken of de boomkwekerijgewassen, op minimaal 30 procent van
      de oppervlakte van de grasstroken; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.f.1°.2°
    text: gras, kruidachtige voedergewassen en vlinderbloemigen zijn gelijkmatig verdeeld over het perceel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.g
    text: 'een *natte teelt,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.g.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘natte teelten’ als bedoeld in [bijlage 1][ref1] als hoofdgewas
      met een zichtbare bedekking;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.g.2°
    text: de teelt vindt plaats op areaal dat sinds 2015 minimaal één jaar werd aangemerkt als landbouwareaal; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.g.3°
    text: de landbouwer oogst het gewas ten minste eenmaal per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.h
    text: 'een *vroeg ras rooigewas 1 september*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.h.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘vroeg ras rooigewas 1 september’ als bedoeld in
      [bijlage 1][ref1] als hoofdteelt met een zichtbare bedekking;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.h.2°
    text: de landbouwer oogst het aangegeven vroeg ras rooigewas vóór 1 september van het aanvraagjaar; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.h.3°
    text: |-
      de landbouwer voert het gewas en de gewasresten af van het perceel of werkt de gewasresten onder vóór 1 september
      van het aanvraagjaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i
    text: '*voedselbos* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.1°
    text: |-
      het gaat om een voedselbos als bedoeld in [artikel 4, vijfde lid, onderdeel a][ref1], dat sinds 2015 minimaal één
      jaar werd aangemerkt als landbouwareaal;


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel4
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18.i.2°
    text: het toepassen van chemische gewasbeschermingsmiddelen of biociden en bemesting is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.3°
    text: het keren, ploegen, spitten of woelen van de grond is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.4°
    text: het perceel voedselbos heeft een aaneengesloten oppervlak van minimaal 0,5 hectare;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.5°
    text: |-
      per hectare staan er minimaal 15 verschillende soorten voedselproducerende bomen en struiken, van de soorten,
      bedoeld in de Soortenlijst behorende bij de gewascode voedselbossen van de Stichting Voedselbosbouw; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.6°
    text: 'er is een teeltplan voor het voedselbos dat tenminste bestaat uit te volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.6°.a
    text: een lijst met aangeplante of aan te planten soorten;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.6°.b
    text: het ontwerp van het voedselbos; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.i.6°.c
    text: wanneer en wat voor voedsel de eetbare soorten zullen opleveren.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.j
    text: '*grasklaver*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.j.1°
    text: |-
      van 1 juni tot 1 augustus wordt de oppervlakte van het betreffende perceel volledig zichtbaar bedekt waarvan
      minimaal 25% met gras en minimaal 25% met klaver; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.j.2°
    text: gras en klaver zijn gelijkmatig verdeeld over het perceel.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.k
    text: '*strokenteelt*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.k.1°
    text: het perceel landbouwgrond bestaat uit minimaal vijf stroken;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.k.2°
    text: de stroken zijn minimaal drie en maximaal 27 meter breed;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: 18.k.3°
    text: |-
      de landbouwer teelt een combinatie van minimaal vier gewassen (waarbij twee dezelfde gewassen niet naast elkaar
      mogen liggen), met uitzondering van blijvend grasland, als hoofdteelt met een zichtbare bedekking, waarvan
      tenminste twee productieve gewassen en één rustgewas uit de gewassenlijst ‘rustgewassen eco-regeling’ als bedoeld
      in [bijlage 1][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 18.k.4°
    text: een strook met struiken en bomen waaronder boslandbouw is toegestaan.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel18
  - number: '19'
    text: 'De Eco-activiteiten in de categorie bodemgewas zijn:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.a
    text: '*onderzaai vanggewas,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.a.1°
    text: |-
      de landbouwer teelt een vanggewas uit de gewassenlijst ‘groenbemesters / vanggewassen’ als bedoeld in
      [bijlage 1][ref1] als onderzaai in combinatie met de hoofdteelt, zodat dit leidt tot zichtbare bodembedekking
      direct na de oogst van de hoofdteelt;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 19.a.2°
    text: |-
      tot ten minste 1 december is de oppervlakte van het betreffende perceel voor minimaal 80% zichtbaar bedekt met het
      aangegeven vanggewas;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.a.3°
    text: de hoofdteelt en de onderzaai zijn verschillende gewassen; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.a.4°
    text: |-
      het gebruik van chemische gewasbeschermingsmiddelen of biociden op het perceel is na de oogst van de hoofdteelt
      niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.b
    text: '*groenbedekking,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.b.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘groenbemesters / vanggewassen’ als bedoeld in
      [bijlage 1][ref1], waarbij gedurende de gehele periode van 1 januari tot 1 maart de oppervlakte van het betreffende
      perceel voor minimaal 80% zichtbaar bedekt is met het aangegeven gewas;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 19.b.2°
    text: |-
      uitsluitend pleksgewijze toepassing van gewasbeschermingsmiddelen of biociden is toegestaan, op maximaal 10 procent
      van de oppervlakte van het betreffende landbouwareaal;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.b.3°
    text: |-
      de groenbedekking wordt mechanisch ondergewerkt voorafgaand aan de hoofdteelt in het betreffende aanvraagjaar,
      zonder doodspuiten of branden van het gewas; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: 19.b.4°
    text: het gewas mag doodvriezen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel19
  - number: '20'
    text: 'De Eco-activiteiten in de categorie teeltmaatregel zijn:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a
    text: '*biologische bestrijding*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.1°
    text: |-
      de landbouwer teelt een gewas uit de gewassenlijst ‘biologische bestrijding’ als bedoeld in [bijlage 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 20.a.2°
    text: 'op het perceel met biologische bestrijding wordt een of een combinatie van de volgende technieken toegepast:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.2°.i
    text: de steriele insectentechniek (SIT) ter beheersing van de uienvlieg;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.2°.ii
    text: |-
      feromoonverwarring ter beheersing van de fruitmot, pruimenmot, bessenglasvlinder, vruchtbladroller, leverkleurige
      bladroller, grote appelbladroller, of heggebladroller;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.2°.iii
    text: nematoden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.2°.iv
    text: bacteriepreparaten;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.a.2°.v
    text: |-
      een bestrijder uit [bijlage VIIb, onderdeel A, van de Omgevingsregeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045528
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045528
  - number: 20.a.3°
    text: |-
      de landbouwer bewaart het aankoopbewijs van de toepassing van de biologische bestrijding en het betaalbewijs
      gedurende 5 jaar in zijn administratie. Het aankoopbewijs vermeldt tenminste de naam van de teler van het gewas, de
      eenduidige locatiegegevens zoals de X- en Y-coördinaten of het perceelnummer uit de Gecombineerde Opgave, bedoeld
      in artikel 2 van de voor het desbetreffende jaar geldende Regeling landbouwtelling en gecombineerde opgave, een
      indicatie van de oppervlakte van het perceel waarop de biologische bestrijding is toegepast, de leverancier en de
      prijs en hoeveelheid van de geleverde biologische bestrijding.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b
    text: '*precisiegewasbescherming*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.1°
    text: |-
      de landbouwer past op het perceel, gedurende de hoofdteelt in het aanvraagjaar, plaatsspecifieke dosering van
      gewasbeschermingsmiddelen toe door middel van een taakkaart die een GPS-gestuurde spuit aanstuurt dan wel een
      sensorgestuurde on-the-go aangestuurde spuit;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.2°
    text: de spuitboom beschikt minimaal over de mogelijkheid om variabel per sectie de spuitdoppen aan te sturen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.3°
    text: 'de landbouwer:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.3°.a
    text: |-
      heeft machines en werktuigen die precisiegewasbescherming kunnen uitvoeren ter beschikking op grond van eigendom of
      huur dan wel in gebruik met toestemming van de eigenaar of de verhuurder; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.3°.b
    text: |-
      beschikt over een factuur van een loonwerker met vermelding van de uitgevoerde handeling(en), de datum van de
      handeling, en de eenduidige locatiegegevens zoals de X- en Y-coördinaten of het perceelnummer uit de Gecombineerde
      Opgave, bedoeld in artikel 2 van de voor het desbetreffende jaar geldende Regeling landbouwtelling en gecombineerde
      opgave, en bewaart deze gedurende 5 jaar in zijn administratie;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.4°
    text: 'de landbouwer beschikt voor iedere toepassing van precisiegewasbescherming over:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.4°.a
    text: |-
      een taakkaart bij een GPS-gestuurde spuit, waarop de geplande handeling(en), en de eenduidige locatiegegevens zoals
      de X- en Y-coördinaten staan aangegeven, en bewaart deze gedurende 5 jaar in zijn administratie; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.4°.b
    text: |-
      een resultaatkaart bij een sensorgestuurde on-the-go aangestuurde spuit waarop de uitgevoerde handelingen en de
      eenduidige locatiegegevens zoals de X- en Y-coördinaten staan aangegeven, en bewaart deze gedurende 5 jaar in zijn
      administratie;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.5°
    text: |-
      de landbouwer houdt een register bij als bedoeld in artikel 67 van [verordening (EG) Nr 1107/2009]
      (32009R1107) van het Europees Parlement en de Raad van 21 oktober 2009 betreffende het op de markt brengen van
      gewasbeschermingsmiddelen en tot intrekking van de [Richtlijnen 79/117/EEG](31979L0117) en [91/414/EEG](31991L0414)
      van de Raad (PbEU 2009, L309);
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.6°
    text: landbouwareaal dat braak ligt, inclusief landschapselementen, is uitgesloten van deze Eco-activiteit; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.b.7°
    text: |-
      de landbouwer voldoet aan de beheerseisen RBE 7.1 en RBE 8.1 tot en met 8.8, bedoeld in
      [artikel 32, onderdeel a][ref1], in samenhang met [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 20.c
    text: '*precisiebemesting,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.1°
    text: |-
      de landbouwer past op het perceel, gedurende de hoofdteelt in het aanvraagjaar, plaatsspecifieke dosering van
      bemesting toe door middel van een taakkaart die een GPS-gestuurde strooier (bij korrel- of vaste meststoffen)
      of – spuit (vloeibare meststoffen) of – zodebemester of – sleepvoetbemester (drijfmest) aanstuurt dan wel een
      sensorgestuurde on-the-go aangestuurde machine;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.2°
    text: de strooier dient ingericht te zijn om meststoffen over de strooibreedte plaatsspecifiek te kunnen doseren;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.3°
    text: de spuitboom beschikt minimaal over de mogelijkheid om variabel per sectie de spuitdoppen aan te sturen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.4°
    text: |-
      de zodebemester en sleepvoetbemesters dienen ingericht te zijn om de drijfmest over de inbrengbreedte
      plaatsspecifiek te kunnen doseren;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.5°
    text: 'de landbouwer:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.5°.a
    text: |-
      heeft machines en werktuigen die precisiebemesting kunnen uitvoeren ter beschikking op grond van eigendom of huur
      dan wel in gebruik met toestemming van de eigenaar of de verhuurder; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.5°.b
    text: |-
      beschikt over een factuur van een loonwerker met vermelding van de uitgevoerde handeling(en), de datum van de
      handeling en de eenduidige locatiegegevens zoals de X- en Y-coördinaten of de naam en het perceelnummer uit de
      Gecombineerde Opgave, bedoeld in artikel 2 van de voor het desbetreffende jaar geldende Regeling landbouwtelling en
      gecombineerde opgave, en bewaart deze gedurende 5 jaar in zijn administratie;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.6°
    text: 'de landbouwer beschikt voor iedere toepassing van precisiebemesting over:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.6°.a
    text: |-
      een taakkaart bij een GPS-gestuurde machine, waarop de geplande handeling(en) en de eenduidige locatiegegevens
      zoals de X- en Y-coördinaten staan aangegeven, en bewaart deze gedurende 5 jaar in zijn administratie; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.6°.b
    text: |-
      een resultaatkaart bij een sensorgestuurde on-the-go aangestuurde machine waarop de uitgevoerde handelingen, en
      de eenduidige locatiegegevens zoals de X- en Y-coördinaten staan aangegeven, en bewaart deze gedurende 5 jaar in
      zijn administratie;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.7°
    text: landbouwareaal dat braak ligt, inclusief landschapselementen, is uitgesloten van deze eco-activiteit; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.c.8°
    text: |-
      de landbouwer voldoet aan de beheerseisen RBE 2.2 tot en met 2.5, 2.7 tot en met 2.9, 2.11, 2.13 en 2.15, bedoeld
      in [artikel 32, onderdeel a][ref1], in samenhang met [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 20.d
    text: '*fertigatie*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.1°
    text: |-
      de landbouwer beschikt op het perceel, tijdens de hoofdteelt, over een functioneel werkende druppelirrigatie met
      doseersysteem;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.2°
    text: het doseersysteem kan via leidingen of slangen een mengsel van water en vloeibare meststoffen beschikbaar stellen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.3°
    text: |-
      De landbouwer beschikt over een boekhouding waar de registratie van meststoffen die via het doseersysteem worden
      toegediend wordt vastgelegd, en bewaart deze gedurende 5 jaar in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.4°
    text: nutriënten worden gedoseerd toegevoegd aan het water;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.5°
    text: landbouwareaal dat braak ligt, inclusief landschapselementen, is uitgesloten van deze eco-activiteit; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.d.6°
    text: |-
      de landbouwer voldoet aan de beheerseisen RBE 2.3, 2.5, 2.11, 2.13 en 2.15, bedoeld in
      [artikel 32, onderdeel a][ref1], in samenhang met [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 20.e
    text: '*Tagetes als aaltjesbestrijding*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.e.1°
    text: de landbouwer teelt uitsluitend *Tagetes patula* als hoofdteelt met een zichtbare bedekking;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.e.2°
    text: de teelt vindt minimaal drie aansluitende maanden plaats;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.e.3°
    text: |-
      de landbouwer gebruikt minimaal de in de Aanbevelende Rassenlijst voor landbouwgewassen CSAR aanbevolen hoeveelheid
      zaaizaad;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.e.4°
    text: de landbouwer bewaart de etiketten van het zaaizaad van de *Tagetes patula* gedurende 5 jaar in zijn administratie;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: 20.e.5°
    text: het areaal was in het voorgaand aanvraagjaar geen blijvend grasland.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel20
  - number: '21'
    text: |-
      De eco-activiteiten, bedoeld in [artikel 20, onderdelen b, c en d][ref1], en [artikel 23, onderdeel c][ref2],
      zijn niet toegestaan op een bufferstrook als bedoeld in [artikel 32, onderdeel b][ref3], in samenhang met
      [Bijlage 4 § 2. Water][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0047444
  - number: '22.1'
    text: |-
      De eco-activiteiten in de categorie veemaatregel zijn: weiden categorie 1 of weiden categorie 2 onder de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22
  - number: 22.1.1°
    text: |-
      de landbouwer verleent toestemming als bedoeld in [artikel 10, vijfde lid, onderdeel d][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 22.1.2°
    text: |-
      de landbouwer neemt deel aan een erkend certificeringsschema als bedoeld in [artikel 22b][ref1] en voldoet volgens
      vaststelling door de certificerende instantie aan de eisen van dit certificeringsschema.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22b
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: 22b
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 22a.1
    text: 'Het certificeringsschema bevat voorschriften voor het weiden, waaronder:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.1.1°
    text: ten minste 1.500 uur per jaar (weiden categorie 1) of 2.500 uur per jaar (weiden categorie 2) weiden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.1.2°
    text: voorwaarden voor het bepalen van het aantal uren weiden, indien er sprake is van vrije uitloop;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.1.3°
    text: |-
      het bijhouden van een register waarin tenminste de weidedagen en de tijdstippen van beweiding, zoals starttijd en
      eindtijd, zijn vastgelegd;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.1.4°
    text: |-
      het bewaren van het register gedurende 5 jaar na afloop van het kalenderjaar waarop het register betrekking heeft
      in de administratie van de landbouwer; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.1.5°
    text: eisen aan de maximale hoeveelheid lacterend melkvee per hectare huiskavel om natuurlijk graasgedrag te borgen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.2
    text: |-
      Het certificeringsschema geeft de mogelijkheid dat schaduwcontroles door de Minister, de Auditdienst Rijk of de
      Europese Commissie kunnen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22a.3
    text: |-
      De Minister kan op advies van de schema-eigenaar in een jaar met uitzonderlijke veterinaire of weersomstandigheden
      die de mogelijkheden voor weiden beperken bij besluit het vereiste aantal uren voor weiden categorie 1 of weiden
      categorie 2 voor dat jaar verlagen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22a
  - number: 22b.1
    text: |-
      De Minister verleent op aanvraag een erkenning aan een certificeringsschema ten behoeve van de certificering
      van de eco-activiteit weiden, bedoeld in [artikel 22][ref1], indien wordt voldaan aan de volgende eisen: a.
      het certificeringsschema bevat de voorschriften, bedoeld in [artikel 22a][ref2]; b. het certificeringsschema
      is eigendom van een schema-eigenaar; c. het certificeringsschema heeft een voldoende mate van borging,
      handhaafbaarheid, uitvoerbaarheid en fraudebestendigheid; d. er is afdoende toezicht door de schema-eigenaar
      op de naleving van het certificeringsschema; e. de schema-eigenaar heeft een schriftelijke overeenkomst met een
      certificerende instantie die voor inspecties is geaccrediteerd door de Raad in het kader van norm NEN-EN/ISO
      17020 met de scope op het uitvoeren van inspecties op weiden; en f. de schema-eigenaar beschikt over een audit- of
      inspectieregime waarmee invulling wordt gegeven aan de onderdelen c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel22a
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 22b.2
    text: |-
      Een aanvraag voor erkenning kan tot 15 juni van het voorliggende kalenderjaar waarop het certificeringsschema van
      toepassing is worden ingediend, waarbij ten minste de volgende gegevens worden verstrekt:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.2.a
    text: de naam, het adres en de vestigingsplaats van de schema-eigenaar;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.2.b
    text: het certificeringsschema;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.2.c
    text: een beschrijving en bewijsstukken waaruit blijkt dat aan de voorschriften van het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.3
    text: Wijzigingen van de gegevens, bedoeld in het tweede lid worden binnen 30 dagen aan de Minister gemeld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.4
    text: Een erkenning wordt verleend voor een kalenderjaar en is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.5
    text: |-
      De erkenning kan met een jaar worden verlengd na schriftelijk verzoek van de schemaeigenaar voor 15 juni
      voorafgaand aan het kalenderjaar waarop het certificeringsschema van toepassing is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.6
    text: 'De Minister trekt een erkenning in:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.6.a
    text: op verzoek van de schema-eigenaar;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.6.b
    text: |-
      indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en kennis van de juiste en volledige
      gegevens tot een ander besluit zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.6.c
    text: indien niet meer wordt voldaan aan een of meer eisen als bedoeld in het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22b.6.d
    text: indien wijzigingen als bedoeld in het derde lid niet of niet tijdig worden gemeld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22b
  - number: 22c.1
    text: |-
      De certificerende instantie controleert of de landbouwer voldoet aan het erkende certificeringsschema, bedoeld in
      [artikel 22b][ref1] voor de eco-activiteit weiden.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22b
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: 22b
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 22c.2
    text: De certificerende instantie heeft een schriftelijke deelname overeenkomst met de landbouwer.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
  - number: 22c.3
    text: |-
      De certificerende instantie verstrekt jaarlijks, uiterlijk 15 oktober aan de Minister een verklaring waarin wordt
      aangegeven welke landbouwers deelnemen en voldoen aan het erkende certificeringsschema voor de eco-activiteit
      weiden.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
  - number: 22c.4
    text: |-
      Indien tijdens de controles blijkt dat de landbouwer niet voldoet aan het erkende certificeringsschema stelt de
      certificerende instantie de desbetreffende landbouwer en de Minister hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
  - number: 22c.5
    text: |-
      In geval van intrekking als bedoeld in [artikel 22b, zesde lid][ref1], geeft de certificerende instantie de in het
      derde lid bedoelde verklaringen niet meer af.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22b
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: 22b
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 22c.6
    text: |-
      De certificerende instantie houdt een administratie bij waaruit de relevante informatie blijkt over de
      aanmeldingen voor het certificeringsschema, uitgevoerde controles, toewijzing en afwijzing van deelname aan het
      certificeringsschema en afgegeven verklaringen en bewaart deze ten minste 5 jaar na afloop van het kalenderjaar
      waarop de deelname aan het certificeringsschema van toepassing is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
  - number: 22c.7
    text: |-
      De certificerende instantie gaat akkoord met schaduwcontroles door de Minister, de Auditdienst Rijk of de Europese
      Commissie.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel22c
  - number: '23'
    text: 'De Eco-activiteiten in de categorie niet-productieve grond zijn:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.a
    text: '*heg, haag, struweel,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.a.1°
    text: |-
      de landbouwer houdt een heg, haag, of struweel gelegen op of grenzend aan landbouwgrond in stand van 1 januari tot
      en met 31 december;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.a.2°
    text: |-
      een heg, haag of struweel bestaat uit een lijnvormig element met aaneengesloten opgaande begroeiing van
      voornamelijk inheemse struiken, waarbij uitheemse soorten en bomen worden verwijderd en waarbij voor een nieuw
      aangeplante heg, haag of struweel geldt dat aan deze voorwaarde wordt voldaan als de plantdichtheid bij aanplant
      zodanig is dat binnen drie jaar na die aanplant een aaneengesloten opgaande begroeiing aanwezig is;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.a.3°
    text: |-
      een heg, haag of struweel wordt in stand gehouden door periodiek te snoeien of te knippen, zodat de begroeiing
      bestaat uit alleen opgaande begroeiing; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.a.4°
    text: |-
      het knippen of snoeien van landschapselementen is niet toegestaan in de periode van 15 maart tot en met 15 juli en
      in het geval buiten die periode in landschapselementen door vogels wordt gebroed.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.b
    text: '*landschapselement hout*, onder de volgende voorwaarde:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.b.1°
    text: |-
      de landbouwer houdt een landschapselement als bedoeld in [artikel 7, tweede lid][ref1], in stand gelegen op of
      grenzend aan landbouwgrond van 1 januari tot en met 31 december; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel7
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 23.b.2°
    text: |-
      het knippen of snoeien van landschapselementen is niet toegestaan in de periode van 15 maart tot en met 15 juli en
      in het geval buiten die periode in landschapselementen door vogels wordt gebroed.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c
    text: '*groene braak*, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c.1°
    text: |-
      de landbouwer teelt voor een periode van minimaal 9 aaneengesloten maanden in het aanvraagjaar een gewas uit de
      gewassenlijst ‘groene braak’ als bedoeld in [bijlage 1][ref1] als hoofdteelt op bouwland;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 23.c.2°
    text: het perceel is minimaal drie meter breed;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c.3°
    text: |-
      in de periode van 31 mei tot 31 augustus is de oppervlakte van het betreffende perceel voor minimaal 80% zichtbaar
      bedekt met het aangegeven gewas;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c.4°
    text: |-
      het is niet toegestaan om tijdens en na de braakperiode het aanwezige gewas in het betreffende aanvraagjaar alsnog
      te oogsten, te bemesten of er chemische gewasbeschermingsmiddelen of biociden op toe te passen;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c.5°
    text: beweiden of oogsten van het aangegeven gewas is het gehele aanvraagjaar niet toegestaan; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.c.6°
    text: het areaal was in het voorgaand aanvraagjaar geen blijvend grasland.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d
    text: 'een kruidenrijke bufferstrook langs bouwland of blijvende teelt, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d.1°
    text: |-
      de landbouwer beheert een kruidenrijke beheerde bufferstrook die minimaal drie meter en maximaal 12 meter breed is
      en geheel of gedeeltelijk samenvalt met de bufferstrook, bedoeld in [artikel 32, onderdeel b][ref1], in samenhang
      met [Bijlage 4][ref2], onder 4 en 4a;


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 23.d.2°
    text: |-
      de bufferstrook ligt direct langs bouwland, met uitzondering van tijdelijk grasland, of direct langs een perceel
      blijvende teelt;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d.3°
    text: er wordt op de bufferstrook geen gebruik gemaakt van bemesting en chemische gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d.4°
    text: beweiden of oogsten is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d.5°
    text: |-
      van 1 juni tot 1 oktober en voor het jaar 2024 van 15 juli tot 1 oktober heeft de kruidenrijke bufferstrook een
      zichtbare bedekking bestaande uit tenminste 25 procent duidelijk zichtbare kruiden en vlinderbloemigen, tenzij
      de landbouwer als gevolg van een contract voor agrarisch natuurbeheer op basis van de subsidieregelingen ANLb
      beheerspakket 3 ‘plasdras voor weidevogels’ uitvoert waardoor hij tijdelijk niet kan voldoen aan de zichtbare
      bedekking; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.d.6°
    text: kruidachtige voedergewassen en vlinderbloemigen zijn gelijkmatig verspreid over de bufferstrook aanwezig.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e
    text: 'een kruidenrijke bufferstrook langs grasland, onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e.1°
    text: |-
      de landbouwer beheert een kruidenrijke beheerde bufferstrook die minimaal drie meter en maximaal 12 meter breed is
      en geheel of gedeeltelijk samenvalt met de bufferstrook, bedoeld in [artikel 32, onderdeel b][ref1], in samenhang
      met [Bijlage 4][ref2], onder 4 en 4a;


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 23.e.2°
    text: de kruidenrijke bufferstrook ligt direct langs een perceel met grasland;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e.3°
    text: er wordt op de bufferstrook geen gebruik gemaakt van bemesting en chemische gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e.4°
    text: beweiden of oogsten is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e.5°
    text: |-
      van 1 juni tot 1 oktober en voor het jaar 2024 van 15 juli tot 1 oktober heeft de kruidenrijke bufferstrook een
      zichtbare bedekking bestaande uit tenminste 25 procent duidelijk zichtbare kruiden en vlinderbloemigen, tenzij
      de landbouwer als gevolg van een contract voor agrarisch natuurbeheer op basis van de subsidieregelingen ANLb
      beheerspakket 3 ‘plasdras voor weidevogels’ uitvoert waardoor hij tijdelijk niet kan voldoen aan de zichtbare
      bedekking; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: 23.e.6°
    text: gras, kruidachtige voedergewassen en vlinderbloemigen zijn gelijkmatig verspreid over de bufferstrook aanwezig.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel23
  - number: '24'
    text: 'De Eco-activiteit in de categorie biologische productie is: *biologische landbouw,* onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel24
  - number: 24.1°
    text: |-
      Het bedrijf van de landbouwer is gecertificeerd overeenkomstig [verordening (EU) 2018/848](32018R0848) voor het
      betreffende perceel of het betreffende perceel is in omschakeling naar biologisch; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel24
  - number: 24.2°
    text: Het bedrijf voldoet uiterlijk op de peildatum aan de voorwaarden gesteld onder 1°.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel24
  - number: '25.1'
    text: |-
      De landbouwer die aanspraak maakt op de betaling voor de eco-regeling, bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 25.1.a
    text: |-
      voldoet per uitgevoerde eco-activiteit aan de desbetreffende voorwaarden, bedoeld in de
      [artikelen 18 tot en met 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel18
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 25.1.b
    text: |-
      heeft voor de subsidiabele hectares per regio een minimaal aantal punten volgens de verdeelsleutel, bedoeld in
      [bijlage 2][ref1], onderdeel C, behaald voor de verbetering van klimaat, bodem en lucht, water, landschap en
      biodiversiteit gedifferentieerd naar regio als bedoeld in [bijlage 2][ref2], onderdeel B;


      [ref1]: https://wetten.overheid.nl/BWBR0047444
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0047444
      - id: ref2
        bwb_id: BWBR0047444
  - number: 25.1.c
    text: |-
      heeft voor de uit te betalen subsidiabele hectares minimaal een waarde op het niveau van het tarief brons behaald,
      als bedoeld in [artikel 27, vierde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel27
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 25.1.d
    text: |-
      is verantwoordelijk voor de uitvoering van de eco-activiteiten op de subsidiabele hectares die op de peildatum bij
      hem in gebruik zijn.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
  - number: '25.2'
    text: |-
      Onverminderd [artikel 10, tweede lid, onderdeel b en derde lid, onderdeel b][ref1], geeft de landbouwer,
      uiterlijk op de in [bijlage 2][ref2] genoemde datum, aan welke eco-activiteiten op welke percelen zullen worden
      uitgevoerd. Wanneer deze uiterste datum op een zaterdag, zondag of een algemeen erkende feestdag als bedoeld in de
      [Algemene termijnenwet][ref3] eindigt, wordt deze verlengd tot en met de eerstvolgende dag die niet een zaterdag,
      zondag of algemeen erkende feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0047444
      [ref3]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0047444
      - id: ref3
        bwb_id: BWBR0002448
  - number: '26.1'
    text: |-
      Uitbetaling kan worden gevraagd voor de uitvoering van verschillende, elkaar niet uitsluitende eco-activiteiten op
      hetzelfde perceel, als bedoeld in [bijlage 2, onderdeel D][ref1], waarbij zowel de punten als de waardes van die
      eco-activiteit bij elkaar mogen worden opgeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: '26.2'
    text: |-
      Bij de uitvoering van verschillende eco-activiteiten op hetzelfde perceel die dezelfde handeling omvatten als
      bedoeld in [bijlage 2, onderdeel D][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 26.2.a
    text: worden de punten toegekend van de activiteit die het hoogste aantal te behalen punten oplevert; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel26
  - number: 26.2.b
    text: wordt de waarde toegekend van de activiteit die de hoogste waarde oplevert.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel26
  - number: '26.3'
    text: |-
      Indien naast een aanvraag om uitbetaling voor het uitvoeren van een eco-activiteit voor dezelfde handeling op
      hetzelfde perceel of deel van het perceel tevens een aanvraag wordt gedaan om uitbetaling in het kader van de
      subsidieregelingen ANLb, wordt voor het overlappende deel van het perceel voor de eco-activiteit geen waarde
      toegekend.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel26
  - number: '27.1'
    text: |-
      Het totaal aantal punten, bedoeld in [artikel 25, eerste lid, onderdeel b][ref1], wordt berekend door de
      subsidiabele hectares waarop de eco-activiteit is gerealiseerd en die op de peildatum bij de landbouwer in gebruik
      zijn, te vermenigvuldigen met het aantal te behalen punten voor de verbetering van klimaat, bodem en lucht, water,
      landschap en biodiversiteit gedifferentieerd naar regio, zoals vastgesteld in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0047444
  - number: '27.2'
    text: |-
      In afwijking van het eerste lid wordt het totaal aantal punten voor de eco-activiteiten, bedoeld in
      [artikel 22][ref1], berekend door de oppervlakte tijdelijk en blijvend grasland, met uitzondering van het grasland
      dat wordt ingezet als kruidenrijke beheerde bufferstrook als bedoeld in [artikel 23 onderdelen d en e][ref2],
      waarop de eco-activiteit wordt uitgevoerd en die op de peildatum bij de landbouwer in gebruik zijn, te
      vermenigvuldigen met het aantal te behalen punten voor de verbetering van klimaat, bodem en lucht, water, landschap
      en biodiversiteit, zoals vastgesteld in [bijlage 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0047444
  - number: '27.3'
    text: |-
      Per uitgevoerde eco-activiteit wordt de waarde berekend door het aantal subsidiabele hectares waarop de eco-
      activiteit wordt uitgevoerd, te vermenigvuldigen met de in [bijlage 2][ref1] vastgestelde waarde, gedifferentieerd
      naar regio.


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: '27.4'
    text: 'Indien op bedrijfsniveau gemiddeld per hectare een waarde is behaald van:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: 27.4.a
    text: ten minste 60 euro, maar minder dan 100 euro, vindt uitbetaling plaats op niveau van het tarief brons;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: 27.4.b
    text: ten minste 100 euro, maar minder dan 200 euro, vindt uitbetaling plaats op het niveau van het tarief zilver;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: 27.4.c
    text: 200 euro of meer, vindt uitbetaling plaats op het niveau van het tarief goud.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: '27.5'
    text: De minister stelt de tarieven voor het niveau brons, zilver en goud jaarlijks vast.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: '27.6'
    text: |-
      In afwijking van het vierde lid vindt uitbetaling plaats op het niveau van het tarief goud indien het bedrijf
      van de landbouwer voor het gehele landbouwareaal dat bij de landbouwer in gebruik is SKAL gecertificeerd is
      overeenkomstig [verordening (EU) 2018/848](32018R0848) of in omschakeling is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: '27.7'
    text: |-
      De hoogte van de uitbetaling wordt berekend door het tarief, bedoeld in het vijfde lid, te vermenigvuldigen met het
      aantal subsidiabele hectares.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
  - number: '27.8'
    text: |-
      Indien een solitaire boom wordt ingezet als landschapselement hout als bedoeld in [artikel 23, onderdeel b][ref1],
      wordt in afwijking van het eerste lid het aantal te behalen punten voor de verbetering van klimaat, bodem en
      lucht, water, landschap en biodiversiteit voor de eco-activiteit landschapselement hout zoals vastgesteld in
      [bijlage 2][ref2] berekend door de oppervlakte van de boom te vermenigvuldigen met conversiefactor 20.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0047444
  - number: '27.9'
    text: |-
      Op ecologisch kwetsbaar blijvend grasland als bedoeld in [artikel 32, onderdeel b][ref1], in samenhang met
      [Bijlage 4, onder 9][ref2], wordt voor de eco-activiteit langjarig grasland geen waarde toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
  - number: 27a.1
    text: |-
      Ten behoeve van de controle op de naleving van de voorwaarden en de uitvoering van eco-activiteiten kan aan de
      landbouwer als bewijs daarvan een gegeotagde foto als genoemd in artikel 11 van [verordening (EU) 2022/1173]
      (32022R1173) worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27a
  - number: 27a.2
    text: |-
      De gegeotagde foto wordt ingestuurd met een door de minister beschikbaar gesteld middel binnen de daarvoor gestelde
      termijn, bij gebreke waarvan de betreffende eco-activiteit als niet uitgevoerd wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27a
  - number: 27a.3
    text: |-
      De minister kan op aanvraag een ontheffing verlenen van de in het eerste lid bedoelde verplichting in geval de
      landbouwer met een door de minister beschikbaar gesteld middel aantoont:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27a
  - number: 27a.3.a
    text: te behoren tot een geloofsgemeenschap die het gebruik van de elektronische weg in zijn geheel afwijst; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27a
  - number: 27a.3.b
    text: niet te beschikken over apparatuur om de gegeotagde foto te maken en in te sturen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel27a
  - number: '28.1'
    text: |-
      Een actieve landbouwer als bedoeld in [artikel 5][ref1], kan aanspraak maken op de betaling voor het houden van
      raszuivere vrouwelijke en mannelijke dieren, als bedoeld en als zodanig geregistreerd in het I&R register, van de
      volgende zeldzame Nederlandse landbouwhuisdierrassen:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 28.1.a
    text: 'rund: Brandrood rund, Fries-Hollands vee, Groninger blaarkop, Lakenvelder, Verbeterd Roodbont;'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.1.b
    text: |-
      *schaap:* Drents heideschaap, Flevolander, Groot heideschaap, Fries melkschaap, Mergelland schaap, Nederlands bonte
      schaap, Noordhollander, Schoonebeeker heideschaap, Swifter, Veluws heideschaap, Zwartbles; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.1.c
    text: 'geit: Nederlandse Bonte geit, Nederlandse Landgeit, Nederlandse Toggenburger geit, Nederlandse Witte geit.'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: '28.2'
    text: 'Dieren van de in het eerste lid bedoelde landbouwhuisdierrassen worden als raszuiver beschouwd indien:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.2.a
    text: het dier staat ingeschreven in de hoofdsectie van het stamboek;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.2.b
    text: |-
      het dier staat ingeschreven in de aanvullende sectie van het stamboek, met tenminste 87.5% bloedvoering van het
      desbetreffende ras.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: '28.3'
    text: 'Om in aanmerking te komen voor betalingen worden:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.3.a
    text: in geval van mannelijke en vrouwelijke runderen, tenminste 2,5 grootvee-eenheden gehouden;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: 28.3.b
    text: in geval van mannelijke en vrouwelijke geiten en schapen, tenminste 0,5 grootvee-eenheden gehouden.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel28
  - number: '29.1'
    text: |-
      Betalingen als bedoeld in [artikel 28, eerste lid][ref1], worden enkel verstrekt voor zover de aanvrager voldoet
      aan de beheerseisen van RBE 11, bedoeld in [artikel 32, onderdeel a][ref2], in samenhang met [bijlage 3][ref3], met
      dien verstande dat voor zover sprake is van een niet-naleving die een deel van de aangevraagde dieren raakt, enkel
      het aantal dieren waarop de niet-naleving betrekking heeft niet voor betaling in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0047444
  - number: '29.2'
    text: |-
      Onverminderd [artikel 10][ref1] bevat de aanvraag in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 29.2.a
    text: de reeds automatisch ingevulde, actuele en voor de betaling relevante, juiste informatie uit het I&R register;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
  - number: 29.2.b
    text: |-
      het aantal zeldzame landbouwhuisdierrassen, bedoeld in [artikel 28][ref1] eerste lid, uitgedrukt in grootvee-
      eenheden als bedoeld in [artikel 30][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel30
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 29.2.c
    text: de locatie van de dieren; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
  - number: 29.2.d
    text: de leeftijd van de dieren.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel29
  - number: '30.1'
    text: |-
      Het aantal grootvee-eenheden van de zeldzame landbouwhuisdierrassen wordt met inachtneming van punt 12, onderdeel
      b, van de bijlage bij [verordening (EU) 2021/2290](32021R2290), berekend door:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: 30.1.a
    text: |-
      de som van het aantal op 1 januari, 1 april, 1 juli en 1 oktober van het aanvraagjaar, op het unieke
      bedrijfsregistratienummer van de aanvrager, vastgestelde aantal grootvee-eenheden te delen door 4;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: 30.1.b
    text: het aantal runderen van 2 jaar en ouder, te vermenigvuldigen met 1;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: 30.1.c
    text: het aantal runderen van 6 maanden tot 2 jaar oud, te vermenigvuldigen met 0,6;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: 30.1.d
    text: het aantal schapen of geiten van 6 maanden en ouder te vermenigvuldigen met 0,15.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: '30.2'
    text: |-
      Indien een dier op een peildatum als bedoeld in het eerste lid, onderdeel a, bij meer dan één houder geregistreerd
      staat, wordt het dier voor die peildatum toegerekend aan de laatst aanvoerende houder.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel30
  - number: '31.1'
    text: |-
      De betaling wordt eenmaal per jaar verstrekt voor maximaal 100 grootvee-eenheden zeldzame landbouwhuisdierrassen,
      gehouden in het aanvraagjaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel31
  - number: '31.2'
    text: De beschikking tot betaling vermeldt per ras het aantal dieren, omgerekend in grootvee-eenheid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel31
  - number: '31.3'
    text: De betaling bedraagt maximaal 200 euro per jaar per grootvee-eenheid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel31
  - number: '31.4'
    text: |-
      Indien betaling van het goedgekeurde aantal aanvragen het beschikbare budget overschrijdt, wordt het maximaal per
      jaar per grootvee-eenheid te betalen bedrag naar rato verdeeld over het aantal grootvee-eenheden waarvoor betaling
      is gevraagd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel31
  - number: '32.1'
    text: |-
      Een landbouwer die deelneemt aan één of meer van de onder [artikel 2, eerste en tweede lid][ref1], bedoelde
      regelingen, neemt de volgende bepalingen in acht:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 32.1.a
    text: |-
