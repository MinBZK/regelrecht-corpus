  - number: '33.3'
    text: |-
      De waarschuwing, bedoeld in het eerste lid, wordt niet meer dan één keer gegeven voor niet-nalevingen van eenzelfde
      conditionaliteit gedurende drie opeenvolgende kalenderjaren, gerekend vanaf en inclusief het jaar waarin de niet-
      naleving is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel33
  - number: '34.1'
    text: |-
      De minister stelt de sancties, bedoeld in artikel 84, eerste lid, van [verordening (EU) 2021/2116](32021R2116),
      vast overeenkomstig artikel 85 van [verordening (EU) 2021/2116](32021R2116) en hoofdstuk III van [verordening (EU)
      2022/1172](32022R1172).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel34
  - number: '34.2'
    text: |-
      De peildatum voor het vaststellen van de bedrijfsoppervlakte in verband met de vrijstelling van controle van
      bedrijven met een maximale omvang van 10 ha landbouwareaal, bedoeld in artikel 83, tweede lid, van [verordening
      2021/2116](32116R2021), is 15 mei.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel34
  - number: '35.1'
    text: |-
      Een niet-naleving van conditionaliteiten is opzettelijk begaan indien de landbouwer de desbetreffende niet-naleving
      heeft beoogd of indien de landbouwer het risico heeft aanvaard dat zijn handelen of nalaten een niet-naleving tot
      gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '35.2'
    text: 'Opzet wordt beoordeeld aan de hand van de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.a
    text: |-
      in de omschrijving van de betrokken conditionaliteit wordt een rechtstreeks verband met de opzettelijkheid van de
      niet-naleving gelegd;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.b
    text: de mate van complexiteit van de conditionaliteit;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.c
    text: de aanwezigheid van langdurig bestendig beleid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.d
    text: de niet-naleving veronderstelt een actieve handeling dan wel het bewust nalaten van een handeling;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.e
    text: |-
      de omstandigheid dat de landbouwer reeds eerder op de hoogte is gesteld van onvolkomenheden in de naleving ten
      aanzien van de conditionaliteit;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.2.f
    text: de omvang van de niet-naleving.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '35.3'
    text: |-
      In het geval waarin een niet-naleving door een derde is begaan op de landbouwgrond of in het kader van het bedrijf
      van een landbouwer wordt desbetreffende niet-naleving aan de landbouwer toegerekend als een opzettelijke niet-
      naleving indien de landbouwer heeft beoogd of het risico heeft aanvaard dat de niet-naleving zou plaatsvinden
      blijkens:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.3.a
    text: de keuze voor de derde;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.3.b
    text: het door de landbouwer op de derde uitgeoefende toezicht; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: 35.3.c
    text: de door de landbouwer aan de derde gegeven instructies.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '35.4'
    text: |-
      Indien een opzettelijke niet-naleving die heeft geleid tot een verlaging met 15 procent, als bedoeld in artikel 85,
      zesde lid, tweede alinea, van [verordening (EU) 2021/2116](32021R2116), nogmaals wordt geconstateerd bedraagt de
      verlaging voor die herhaling 20 procent, welk percentage voor elke volgende herhaling met 10 procentpunten wordt
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '35.5'
    text: |-
      Indien een niet-naleving die vóór 2023 heeft geleid tot een verlaging met een percentage van meer dan 15 en niet
      zijnde een percentage uitgedrukt in een tiental, nogmaals wordt geconstateerd, bedraagt de verlaging voor die
      herhaling een verlaging met het percentage dat overeenkomt met het daarop eerstvolgende tiental, welk percentage
      voor elke volgende herhaling met 10 procentpunten wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '35.6'
    text: |-
      In afwijking van de leden 4 en 5 kan een hoger verlagingspercentage worden toegepast indien ernst, omvang of
      permanent karakter van de niet-naleving daar aanleiding toe geven.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel35
  - number: '36'
    text: |-
      Wanneer de landbouwgrond, dan wel een deel hiervan, in het betrokken kalenderjaar wordt overgedragen, worden
      de administratieve sancties, bedoeld in [artikel 34][ref1], opgelegd aan de actieve landbouwer, bedoeld in
      [artikel 5][ref2], die op de peildatum het perceel landbouwgrond ter beschikking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '37.1'
    text: |-
      Er is een bedrijfsadviseringssysteem als bedoeld in artikel 15, eerste lid, van [verordening (EU) 2021/2115]
      (32021R2115).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel37
  - number: '37.2'
    text: |-
      De adviseur in het kader van het bedrijfsadviseringssysteem adviseert, met inachtneming van artikel 15, tweede lid,
      van [verordening (EU) 2021/2115](32021R2115) ten minste over de onderwerpen, bedoeld in artikel 15, vierde lid,
      onderdelen a tot en met h, van [verordening (EU) 2021/2115](32021R2115).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel37
  - number: '38.1'
    text: |-
      De minister wijst op aanvraag een beroepsorganisatie voor adviseurs in het kader van het bedrijfsadviseringssysteem
      aan die ten minste 50 leden heeft en die blijkens de bij de aanvraag overgelegde gegevens voldoet aan het tweede
      tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: '38.2'
    text: 'De beroepsorganisatie erkent de adviseur in het kader van het bedrijfsadviseringssysteem die aantoonbaar:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38.2.a
    text: ten minste een HBO-opleidingsniveau of HBO-denkniveau heeft;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38.2.b
    text: ten minste 3 jaar werkervaring heeft als adviseur; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38.2.c
    text: |-
      kennis heeft over de onderwerpen, bedoeld in artikel 15, vierde lid, onderdelen a tot en met h, van [verordening
      (EU) 2021/2115](32021R2115).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: '38.3'
    text: |-
      De beroepsorganisatie verplicht de adviseur in het kader van het bedrijfsadviseringssysteem die een erkenning als
      bedoeld in het tweede lid houdt tot:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38.3.a
    text: het regelmatig geven van adviezen in het kader van het bedrijfsadviseringssysteem; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38.3.b
    text: |-
      de periodieke educatie met betrekking tot de onderwerpen, bedoeld in artikel 15, vierde lid, onderdelen a tot en
      met h, van [verordening (EU) 2021/2115](32021R2115), en met betrekking tot adviesvaardigheden.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: '38.4'
    text: |-
      De beroepsorganisatie trekt een erkenning als bedoeld in het tweede lid in indien de adviseur in enig jaar niet kan
      aantonen dat hij ten minste 20 uur educatie heeft gevolgd als bedoeld in het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38
  - number: 38a.1
    text: |-
      De minister wijst op aanvraag één of meer aanbieders of eigenaren van een nutriëntentool aan, die voldoet aan
      de eisen van artikel 15, vierde lid, onderdeel g, van [Verordening (EU) 2021/2115](32115R2021). Deze eisen zijn
      weergegeven in [bijlage 7][ref1], onderdeel A.


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 38a.2
    text: |-
      Naast de algemene eisen, bedoeld in het eerste lid, moet de nutriëntentool de onderdelen bevatten die zijn
      weergegeven in [bijlage 7][ref1], onderdeel A.


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 38a.3
    text: |-
      De eigenaar of aanbieder van een nutriëntentool moet voldoen aan de verplichtingen gesteld in [bijlage 7][ref1],
      onderdeel B.


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: 38a.4
    text: |-
      Een aanvraag om aanwijzing als aanbieder of eigenaar van een nutriëntentool kan worden ingediend tot 15 oktober van
      het lopende kalenderjaar, waarbij ten minste de volgende gegevens worden verstrekt:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.4.a
    text: de naam, het adres en de vestigingsplaats van de nutriëntentool-eigenaar of -aanbieder;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.4.b
    text: bewijsstukken waaruit blijkt dat aan de voorschriften van het eerste, tweede en derde lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.5
    text: Wijzigingen van de gegevens, bedoeld in het vierde lid, worden binnen 30 dagen aan de minister gemeld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.6
    text: Een eerste aanwijzing is mogelijk vanaf 1 januari 2024 en geldt voor twee jaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.7
    text: Een aanwijzing is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.8
    text: |-
      De aanwijzing kan met een jaar worden verlengd na schriftelijk verzoek van de nutriëntentool-eigenaar of -aanbieder
      voor 15 oktober van het kalenderjaar voorafgaand aan het kalenderjaar waarop de verlenging van toepassing is.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.9
    text: 'De minister trekt een aanwijzing in:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.9.a
    text: op verzoek van de nutriëntentool-eigenaar of -aanbieder;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.9.b
    text: |-
      indien bij de aanvraag tot aanwijzing onjuiste of onvolledige gegevens zijn verstrekt en kennis van de juiste en
      volledige gegevens tot een ander besluit zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.9.c
    text: indien niet meer wordt voldaan aan een of meer eisen als bedoeld in het eerste, tweede of derde lid; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: 38a.9.d
    text: indien wijzigingen als bedoeld in het vijfde lid niet of niet tijdig worden gemeld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel38a
  - number: '39'
    text: |-
      Ten behoeve van de beoordeling van een aanvraag om betalingen kan door de minister worden verzocht om binnen
      maximaal vier weken extra gegevens en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel39
  - number: '40.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *overdracht van een bedrijf:* de verkoop, verhuur of
      welke soortgelijke transactie ook van de betrokken productie-eenheden;
        - *overdrager:* de begunstigde wiens bedrijf geheel wordt overgedragen aan een andere begunstigde;
        - *overnemer:* de begunstigde aan wie het bedrijf wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
  - number: '40.2'
    text: |-
      Indien het bedrijf van een landbouwer na de aanvraag, bedoeld in [artikel 10][ref1], in zijn geheel aan een andere
      begunstigde wordt overgedragen, wordt van deze overdracht onverwijld melding gedaan met een door de minister ter
      beschikking gesteld elektronisch formulier dat door de overdrager en de overnemer is ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '40.3'
    text: |-
      Indien in de melding van een bedrijfsoverdracht is verklaard dat de overnemer alle rechten en plichten van de
      overdrager heeft overgenomen kan de overnemer aanspraak maken op de betalingen, waarvoor de overdrager een aanvraag
      heeft gedaan als bedoeld in [artikel 10][ref1], en wordt de steun uitbetaald aan de overnemer, op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 40.3.a
    text: de overdracht uiterlijk 15 oktober van het aanvraagjaar is gemeld;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
  - number: 40.3.b
    text: |-
      de overnemer vanaf het moment van de overdracht actieve landbouwer is als bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 40.3.c
    text: |-
      ingeval de overdracht dateert van na de peildatum, de overdrager op de peildatum actieve landbouwer was als bedoeld
      in [artikel 5][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 40.3.d
    text: |-
      de overnemer, na de melding van de bedrijfsoverdracht, een aanvraag als bedoeld in [artikel 10][ref1] heeft gedaan
      die overeenkomt met de aanvraag zoals deze, na eventuele wijzigingen, door de overdrager is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '40.4'
    text: |-
      Indien de overdracht na 15 oktober van het aanvraagjaar is gemeld of de overnemer op het moment van de overdracht
      geen actieve landbouwer is als bedoeld in [artikel 5][ref1], wordt de steun uitbetaald aan de overdrager, mits de
      overdrager tijdig een aanvraag heeft ingediend als bedoeld in [artikel 10][ref2] en de overdrager op de peildatum
      actieve landbouwer was als bedoeld in artikel 5.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '41'
    text: |-
      Indien het bedrijf van een landbouwer na de aanvraag, bedoeld in [artikel 10][ref1], gedeeltelijk aan een andere
      begunstigde wordt overgedragen, of wanneer sprake is van een fusie, splitsing, vererving of bedrijfsbeëindiging,
      wordt door de landbouwer die de aanvraag heeft gedaan daarvan onverwijld melding gedaan met een door de minister
      ter beschikking gesteld elektronisch formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '42.1'
    text: |-
      Ter uitvoering van artikel 59, eerste lid, onderdeel d, van [verordening (EU) 2021/2116](32021R2116) worden
      administratieve sancties vastgesteld om een doeltreffende bescherming van de financiële belangen van de Europese
      Unie te waarborgen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '42.2'
    text: |-
      De minister kan besluiten, met inachtneming van de bij of krachtens [verordening (EU) 2021/2116](32021R2116)
      gestelde regels, tot:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: 42.2.a
    text: het geven van een waarschuwing;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: 42.2.b
    text: het opleggen van een administratieve sanctie in de vorm van een verlaging van de betaling.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '42.3'
    text: |-
      De administratieve sanctie wordt toegepast op het totale bedrag aan betalingen van de interventie als bedoeld in
      [artikel 2, eerste lid en tweede lid][ref1], waarop de niet-naleving betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '42.4'
    text: |-
      De niet-nalevingen waarvoor een waarschuwing kan worden afgegeven en de hoogte van de verlagingen staan opgenomen
      in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0047444
  - number: '42.5'
    text: |-
      Van herhaling is sprake wanneer dezelfde niet-naleving zich eenmaal herhaalt binnen drie opeenvolgende
      kalenderjaren vanaf en met inbegrip van het jaar waarin de niet-naleving heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '42.6'
    text: |-
      In afwijking van het tweede lid, onderdeel b, kan een hogere verlaging worden toegepast indien ernst, omvang of
      permanent karakter van de niet-naleving daar aanleiding toe geven.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '42.7'
    text: |-
      Een administratieve sanctie wordt alleen opgelegd indien een niet-naleving wordt ontdekt binnen drie opeenvolgende
      kalenderjaren vanaf en met inbegrip van het jaar waarin de niet-naleving heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '42.8'
    text: |-
      In afwijking van het derde lid wordt de administratieve sanctie bij overtreding van [artikel 9, tweede lid][ref1],
      toegepast op de henneppercelen.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel9
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '42.9'
    text: |-
      Indien bij een landbouwer meerdere niet-nalevingen zijn geconstateerd die zien op de volgende overtredingen, wordt
      alleen de hoogste administratieve sanctie opgelegd:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: 42.9.a
    text: |-
      het opgeven van een perceel of landschapselement dat op de peildatum geheel of gedeeltelijk niet ter beschikking
      van de landbouwer staat; of
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: 42.9.b
    text: het niet melden van het geheel of gedeeltelijk of niet volgens de voorwaarden uitvoeren van een eco-activiteit.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel42
  - number: '43'
    text: |-
      Wanneer een perceel landbouwgrond in het betrokken kalenderjaar wordt overgedragen, worden de administratieve
      sancties, bedoeld in [artikel 42][ref1], opgelegd aan de actieve landbouwer, bedoeld in [artikel 5][ref2], die op
      de peildatum het perceel landbouwgrond ter beschikking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel5
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '42'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '44'
    text: |-
      Indien de begunstigde of zijn vertegenwoordiger de uitvoering van een controle ter plaatse verhindert, wordt de
      betrokken steun- of betalingsaanvraag afgewezen, behalve in gevallen als bedoeld in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel46
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '46'
        hoofdstuk: '4'
  - number: '45'
    text: |-
      Geen steun wordt toegekend aan natuurlijke personen of rechtspersonen van wie is komen vast te staan dat zij
      kunstmatig de voorwaarden hebben gecreëerd om hiervoor in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel45
  - number: '46.1'
    text: |-
      De landbouwer die een beroep wil doen op overmacht of uitzonderlijke omstandigheden doet hiervan zo spoedig
      mogelijk een melding bij RVO met gebruikmaking van een door de minister beschikbaar gesteld elektronisch formulier.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel46
  - number: '46.2'
    text: |-
      De minister geeft geen toepassing aan [artikel 42][ref1] in de gevallen genoemd in artikel 59, vijfde lid,
      onderdelen a, b en c, van [verordening (EU) 2021/2116](32021R2116).


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel42
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '42'
        hoofdstuk: '4'
  - number: '47.1'
    text: |-
      De aanvraag, bedoeld in [artikel 10, eerste lid][ref1], en eventuele daarbij overgelegde bewijsstukken, kunnen na
      de indiening ervan worden gecorrigeerd en aangepast indien sprake is van een kennelijke fout.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel10
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '47.2'
    text: 'Van een kennelijke fout kan sprake zijn indien:'
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
  - number: 47.2.a
    text: er een tegenstrijdigheid zit in de door of namens de landbouwer verstrekte gegevens, die wijst op een vergissing;
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
  - number: 47.2.b
    text: |-
      de tegenstrijdigheid eenvoudig kan worden geconstateerd tijdens een administratieve controle van de aanvraag of de
      bewijsstukken; en
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
  - number: 47.2.c
    text: de begunstigde te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
  - number: '47.3'
    text: |-
      De minister geeft geen toepassing aan [artikel 42][ref1] indien de niet-naleving het gevolg is van een kennelijke
      fout.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel42
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '42'
        hoofdstuk: '4'
  - number: '48.1'
    text: |-
      De minister kan afwijken van de [artikelen 5][ref1], [10, eerste lid][ref2], [13, tweede lid][ref3],
      [18, onderdelen f en j][ref4], [19, onderdeel b][ref5], [23, onderdelen d en e][ref6], [40][ref7] en [41][ref8],
      voor zover de toepassing van deze artikelen gelet op het doel ervan zal leiden tot een onbillijkheid van
      overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0047444#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0047444#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0047444#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0047444#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0047444#Artikel40
      [ref8]: https://wetten.overheid.nl/BWBR0047444#Artikel41
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0047444
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0047444
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0047444
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0047444
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref7
        bwb_id: BWBR0047444
        artikel: '40'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0047444
        artikel: '41'
        hoofdstuk: '4'
  - number: '48.2'
    text: |-
      De minister kan, rekening houdend met de financiële belangen van de Unie, voorts afwijken van [artikel 42][ref1],
      voor zover de toepassing van dit artikel gelet op het doel ervan zal leiden tot een onbillijkheid van overwegende
      aard.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel42
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '42'
        hoofdstuk: '4'
  - number: '49.1'
    text: |-
      Indien sprake is van een (deels) onverschuldigde betaling, wordt het onverschuldigd betaalde bedrag teruggevorderd,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel49
  - number: 49.1.a
    text: |-
      het van de begunstigde over een aanvraagjaar terug te vorderen bedrag, exclusief rente, niet hoger is dan 100 euro
      per betaling als bedoeld in [artikel 2, eerste en tweede lid][ref1] en dit bedrag geen sanctie betreft als bedoeld
      in [artikel 34][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel34
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0047444
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0047444
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 49.1.b
    text: |-
      de terugvordering onmogelijk is als gevolg van erkende insolventie van de debiteur of van de personen die juridisch
      aansprakelijk zijn voor de onregelmatigheid.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel49
  - number: '49.2'
    text: |-
      Ter voldoening aan artikel 30, tweede lid, van [verordening (EU) 2022/128](32022R0128) wordt wettelijke rente in
      rekening gebracht overeenkomstig [afdeling 4.4.2 van de Algemene wet bestuursrecht][ref1] indien de begunstigde het
      onverschuldigde bedrag niet binnen de gestelde termijn heeft terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.2
  - number: '49.3'
    text: De minister geeft toepassing aan artikel 31 van [verordening (EU) 2022/128](32022R0128).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel49
  - number: '50.1'
    text: |-
      Over de periode van 16 oktober van het kalenderjaar voorafgaand aan het aanvraagjaar tot en met 15 oktober van
      het aanvraagjaar worden de gegevens openbaar gemaakt over de subsidies en andere steunbedragen van het Europees
      Landbouwgarantiefonds overeenkomstig artikel 98, leden 2, 3 en 4, van [verordening (EU) 2021/2116](32021R2116).
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel50
  - number: '50.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden ontleend aan de financiële administratie van RVO ten behoeve van het
      Europees Landbouwgarantiefonds.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel50
  - number: '50.3'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden uiterlijk 31 mei van het kalenderjaar volgend op het aanvraagjaar
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel50
  - number: '51.1'
    text: |-
      De [Uitvoeringsregeling rechtstreekse betalingen GLB][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0035925
    url: https://wetten.overheid.nl/BWBR0047444/2026-01-21#Artikel51
    references:
