  - number: 51a.2
    text: |-
      De [Regeling superheffing 2008][ref1] zoals deze luidde onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van het eerste lid blijft evenwel van toepassing op nog lopende procedures met betrekking tot de
      vaststelling, berekening en invordering van verschuldigde heffingen.


