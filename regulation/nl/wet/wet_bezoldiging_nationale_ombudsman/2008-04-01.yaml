articles:
  - number: '1'
    text: |-
      1 De bezoldiging van de Nationale ombudsman wordt bepaald op € 10.123,39 per maand en de bezoldiging van de
      substituut-ombudsman op € 8919,86 per maand.

      2 Het genot van de bezoldiging vangt aan met de dag waarop de benoeming ingaat. De bezoldiging wordt niet langer
      uitbetaald dan tot en met de dag van het overlijden.

      3 Indien Wij in de bezoldiging van het burgerlijk rijkspersoneel een wijziging aanbrengen en bepalen dat deze
      wijziging een algemeen karakter draagt, brengen Wij bij algemene maatregel van bestuur met ingang van de datum,
      waarop die wijziging ingaat, een overeenkomstige wijziging aan in de bezoldiging van de ingevolge deze wet
      bezoldigde functionarissen, onder nadere vaststelling, voor zoveel nodig, van de in het eerste lid genoemde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0003429/2008-04-01#Artikel1
  - number: '2'
    text: |-
      De Nationale ombudsman en de substituut-ombudsmannen ontvangen een vakantie-uitkering en een eindejaarsuitkering
      overeenkomstig de bepalingen welke te dien aanzien voor de burgerlijke rijksambtenaren, werkzaam bij de
      departementen van algemeen bestuur, zijn of zullen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003429/2008-04-01#Artikel2
  - number: 2a
    text: |-
      1 De substituut-ombudsman die ingevolge [artikel 10, derde lid, van de Wet Nationale ombudsman][ref1] is belast met
      de waarneming van het ambt van de ombudsman, geniet voor de duur van de waarneming een waarnemingstoelage tot de
      hoogte van het bedrag van de bezoldiging van de ombudsman.

      2 De substituut-ombudsman die ingevolge [artikel 10, eerste lid, van de Wet Nationale ombudsman][ref2] gedurende
      meer dan 30 dagen onafgebroken is belast met de vervanging van de ombudsman, geniet voor de duur van de vervanging
      een vervangingstoelage tot de hoogte van het bedrag van de bezoldiging van de ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel10
    url: https://wetten.overheid.nl/BWBR0003429/2008-04-01#Artikel2a
