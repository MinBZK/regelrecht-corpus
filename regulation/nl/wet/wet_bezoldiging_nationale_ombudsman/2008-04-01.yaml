  - number: 2b
    text: |-
      1 Degene die op grond van [artikel 2][ref1], vijfde lid, of
      [artikel 10, tweede of vierde lid, van de Wet Nationale ombudsman][ref2], de ombudsman vervangt respectievelijk het
      ambt van ombudsman waarneemt, geniet voor de duur van de vervanging respectievelijk de waarneming, de bezoldiging
      en de vakantie-uitkering die voor dit ambt zijn vastgesteld.

      2 Van degene die krachtens [artikel 2][ref3], vijfde lid, of
      [artikel 10, zevende lid, van de Wet Nationale ombudsman][ref4] in een betrekking of lidmaatschap op non-activiteit
      is gesteld, wordt de bezoldiging met inbegrip eventueel van toelagen gedurende de periode van non-activiteit
      ingehouden.


