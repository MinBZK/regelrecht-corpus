preamble:
  text: |-
    Gelet op de artikelen 152, eerste, derde en vierde lid, 154, vierde lid, 156, 157, eerste en derde lid, 158,
    eerste lid, 161, eerste en derde lid, 163, eerste en derde lid, 164, eerste, vijfde en zesde lid, en 165 van
    Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling van een
    gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking van de Verordeningen (EEG) nr.
    922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU 2013, L 347) en de artikelen
    13, tweede lid, onder b, en 19, eerste lid, van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In deze regeling wordt verstaan onder: - *verordening 1308/2013:* Verordening (EU) nr. 1308/2013 van het Europees
      Parlement en de Raad van 17 december 2013 tot vaststelling van een gemeenschappelijke ordening van de markten
      voor landbouwproducten en tot intrekking van de [Verordeningen (EEG) nr. 922/72](31972R0922), [(EEG) nr. 234/79]
      (31979R0234), [(EG) nr. 1037/2001](32001R1037) en [(EG) nr. 1234/2007](32007R1234) van de Raad (PbEU 2013, L 347);
        - *verordening 2016/232:* Gedelegeerde [Verordening (EU) 2016/232](32016R0232) van de Commissie van 15 december
      2015 tot aanvulling van [Verordening (EU) nr. 1308/2013](32013R1308) van het Europees parlement en de Raad wat
      betreft bepaalde aspecten van samenwerking tussen producenten (PbEU 2016, L44);
        - *erkende organisatie:* door de Minister erkende producentenorganisatie, unie van producentenorganisaties
      of brancheorganisatie als bedoeld in Hoofdstuk III, Afdeling 1, van [verordening 1308/2013](32013R1308) of de
      artikelen 161, eerste lid, of 163, eerste lid, van die verordening of door de Minister erkende transnationale
      producentenorganisatie, transnationale unie van producentenorganisaties of transnationale brancheorganisatie als
      bedoeld in artikel 4 van [verordening (EU) 2016/232](32016R0232).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel11
  - number: 1:2
    text: |-
      Deze regeling is, met uitzondering van [paragraaf 5][ref1], niet van toepassing op producentenorganisaties of unies
      van producentenorganisaties in de sector groenten en fruit.


      [ref1]: https://wetten.overheid.nl/BWBR0035634#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035634
        paragraaf: '5'
  - number: 1:3
    text: |-
      Een deelnemer in het kapitaal van een producentenorganisatie, van een unie van producentenorganisaties of van een
      brancheorganisatie geldt voor de toepassing van deze regeling tevens als een lid van die organisatie.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel13
  - number: 2:1
    text: |-
      De minister is bevoegd tot het verlenen van een erkenning overeenkomstig de artikelen 152, eerste lid, of 161,
      eerste lid, van [verordening 1308/2103](32103R1308) voor één of meerdere sectoren, bedoeld in artikel 1, tweede
      lid, van die verordening en een erkenning als bedoeld in artikel 4 van [verordening 2016/232](32132R2016).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel21
  - number: 2:2
    text: |-
      Het minimum ledental als bedoeld in de artikelen 154, eerste lid, onderdeel b, en 161, eerste lid, onderdeel b, van
      [verordening 1308/2013](32013R1308) bedraagt 15 per sector, bedoeld in artikel 1, tweede lid, van die verordening,
      waarvoor erkenning wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel22
  - number: 2:3
    text: 'Een producentenorganisatie die verzoekt om erkenning verstrekt bij dat verzoek de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.a
    text: de statuten;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.b
    text: |-
      een omschrijving van de sector of sectoren, bedoeld in artikel 1, tweede lid, van [verordening 1308/2013]
      (32013R1308), waarin de producentenorganisatie actief is;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.c
    text: |-
      Een omschrijving van de activiteit of activiteiten, bedoeld in artikel 152, eerste lid, onderdeel b, van
      [verordening 1308/2013](32013R1308), die de producentenorganisatie zal verrichten alsmede een omschrijving van
      de doelstelling, bedoeld in artikel 152, eerste lid, onderdeel c, of, voor zover van toepassing, de doelstelling,
      bedoeld in artikel 161, eerste lid, onderdeel a, van die verordening, die zij nastreeft;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.d
    text: |-
      bewijsmateriaal als bedoeld in artikel 154, eerste lid, onder c, van [verordening 1308/2013](32013R1308), of, voor
      zover van toepassing, als bedoeld in artikel 161, onderdeel c, van die verordening;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.e
    text: een verklaring dat de producentenorganisatie bekend is met artikel 209 van [verordening 1308/2013](32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.f
    text: de naam en de vestigingsplaats van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.g
    text: |-
      de unieke nummers die de Kamer van Koophandel heeft toegewezen aan de producentenorganisatie of aan de leden van de
      producentenorganisatie indien deze beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.h
    text: de namen van de bestuursleden van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 2:3.i
    text: |-
      een bevestiging dat de administratie van de producentenorganisatie zal voldoen aan het voorschrift, bedoeld in
      [artikel 52, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 2:3.j
    text: een motivering van het verzoek.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel23
  - number: 3:1
    text: |-
      De minister is bevoegd tot het verlenen van een erkenning overeenkomstig artikel 156 van [verordening 1308/2013]
      (32013R1308) en een erkenning als bedoeld in artikel 4 van [verordening 2016/232](32132R2016).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel31
  - number: 3:2.1
    text: 'Een unie van producentenorganisaties die verzoekt om erkenning verstrekt bij dat verzoek de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.a
    text: de statuten;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.b
    text: |-
      een omschrijving van de sector of sectoren, bedoeld in artikel 1, tweede lid, van [verordening 1308/2013]
      (32013R1308), waarin de unie van producentenorganisaties actief is;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.c
    text: |-
      Een omschrijving van de activiteit of activiteiten, bedoeld in artikel 152, eerste lid, onderdeel b, van
      [verordening 1308/2013](32013R1308), die de producentenorganisatie zal verrichten alsmede een omschrijving van
      de doelstelling, bedoeld in artikel 152, eerste lid, onderdeel c, of, voor zover van toepassing, de doelstelling,
      bedoeld in artikel 161, eerste lid, onderdeel a, van die verordening, die zij nastreeft;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.d
    text: |-
      bewijsmateriaal als bedoeld in artikel 154, eerste lid, onder c, van [verordening 1308/2013](32013R1308), of, voor
      zover van toepassing, als bedoeld in artikel 161, onderdeel c, van die verordening;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.e
    text: |-
      een verklaring dat de unie van producentenorganisaties bekend is met artikel 209 van [verordening 1308/2013]
      (32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.f
    text: de naam en de vestigingsplaats van de unie van producentenorganisaties;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.g
    text: |-
      de unieke nummers die de Kamer van Koophandel heeft toegewezen aan de unie van producentenorganisaties of aan de
      leden van de unie van producentenorganisaties;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.h
    text: de namen van de bestuursleden van de unie van producentenorganisaties;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 3:2.1.i
    text: |-
      een bevestiging dat de administratie van de unie van producentenorganisaties zal voldoen aan het voorschrift,
      bedoeld in [artikel 52, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 3:2.1.j
    text: een motivering van het verzoek.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel32
  - number: 4:1
    text: |-
      De minister is bevoegd tot het verlenen van een erkenning overeenkomstig de artikelen 157, eerste lid, of 163,
      eerste lid, van [verordening 1308/2013](32013R1308) voor één of meerdere sectoren, bedoeld in artikel 1, tweede
      lid, van die verordening en een erkenning als bedoeld in artikel 4 van [verordening 2016/232](32132R2016).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel41
  - number: 4:2
    text: |-
      Het aanzienlijk deel van de economische activiteiten, bedoeld in artikel 158, eerste lid, onderdeel c, van
      [verordening 1308/2013](32013R1308), bedraagt ten minste 25% van de bij de brancheorganisatie betrokken producenten
      en tenminste 25% van de bij de brancheorganisatie betrokken distributeurs, verwerkers of handelaren per sector,
      bedoeld in artikel 1, tweede lid, van die verordening, waarvoor erkenning wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel42
  - number: 4:3
    text: 'Een brancheorganisatie die verzoekt om erkenning verstrekt bij dat verzoek de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.a
    text: de statuten;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.b
    text: |-
      een omschrijving van de sector of sectoren, bedoeld in artikel 1, tweede lid, van [verordening 1308/2013]
      (32013R1308), waarin de brancheorganisatie actief is;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.c
    text: |-
      een omschrijving van de doelstelling of de doelstellingen, bedoeld in artikel 157, eerste lid, onder c, van
      [verordening 1308/2013](32013R1308), die de brancheorganisatie nastreeft;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.d
    text: een verklaring dat de brancheorganisatie bekend is met artikel 210 van [verordening 1308/2013](32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.e
    text: de naam en de vestigingsplaats van de brancheorganisatie;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.f
    text: |-
      de unieke nummers die de Kamer van Koophandel heeft toegewezen aan de brancheorganisatie of aan de leden van de
      brancheorganisatie indien deze beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.g
    text: de namen van de bestuursleden van de brancheorganisatie;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 4:3.h
    text: |-
      een bevestiging dat de administratie van de brancheorganisatie zal voldoen aan het voorschrift, bedoeld in
      [artikel 52, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 4:3.i
    text: een motivering van het verzoek.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel43
  - number: 5:1.1
    text: |-
      De minister is bevoegd tot besluitvorming overeenkomstig de artikelen 164, eerste lid, of 165 van [verordening
      1308/2013](32013R1308) of artikel 68 van [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel51
  - number: 5:1.2
    text: |-
      Een erkende organisatie kan de minister verzoeken om te besluiten overeenkomstig artikel 165 van [verordening
      1308/2013](32013R1308) ten aanzien van een van die organisatie overeenkomstig artikel 164, eerste lid, van die
      verordening door de minister verbindend verklaard voorschrift.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel51
  - number: 5:2.1
    text: |-
      De minister wijst overeenkomstig de artikelen 164, eerste lid, of 165 van [verordening 1308/2013](32013R1308) geen
      verzoek toe indien:
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel52
  - number: 5:2.1.a
    text: |-
      het voorschrift of de financiële bijdrage op grond van de geldende wetgeving kan worden gesteld, onderscheidenlijk
      worden geheven, of
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel52
  - number: 5:2.1.b
    text: |-
      het voorschrift of de financiële bijdrage naar het oordeel van de minister een onevenredige inbreuk maakt op de
      ondernemersvrijheid of niet doelmatig is.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel52
  - number: 5:2.2
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing op voorschriften of financiële bijdragen die
      betrekking hebben op het verrichten van onderzoek.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel52
  - number: 5:2.3
    text: |-
      Een besluit overeenkomstig de artikelen 164, eerste lid, of 165 van [verordening 1308/2013](32013R1308)
      wordt verleend voor maximaal de periode van de resterende looptijd van de relevante programmaperiode van het
      Gemeenschappelijk Landbouw Beleid.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel52
  - number: 5:3
    text: |-
      Een verzoek als bedoeld in artikel 164, eerste lid, of artikel 165 van [verordening 1308/2013](32013R1308), kan
      uitsluitend worden ingediend door een erkende organisatie die blijkens de statuten jegens iedere marktdeelnemer die
      daaraan is onderworpen is gehouden tot:
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel53
  - number: 5:3.a
    text: het toezien op de naleving van het voorschrift,
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel53
  - number: 5:3.b
    text: het toezien op de afdracht van een financiële bijdrage, en
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel53
  - number: 5:3.c
    text: |-
      het opleggen van een sanctie jegens een ieder die een voorschrift niet-naleeft of een financiële bijdrage niet
      afdraagt.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel53
  - number: 5:4
    text: |-
      Een erkende organisatie die verzoekt om een besluit als bedoeld in artikel 164, eerste lid, of artikel 165 van
      [verordening 1308/2013](32013R1308), verstrekt bij dat verzoek:
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel54
  - number: 5:4.a
    text: |-
      bewijsmateriaal waaruit blijkt dat ook de leden van die organisatie het voorschrift zullen uitvoeren of de
      financiële bijdrage zullen afdragen;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel54
  - number: 5:4.b
    text: |-
      als de erkende organisatie een erkende unie van producentenorganisaties of een erkende brancheorganisatie
      is, bewijsmateriaal waaruit blijkt dat ook de marktdeelnemers die door de leden van die organisatie worden
      vertegenwoordigd het voorschrift zullen uitvoeren of de financiële bijdrage zullen afdragen.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel54
  - number: 5:5.1
    text: |-
      Een erkende organisatie die verzoekt om een besluit als bedoeld in artikel 164, eerste lid, of artikel 165 van
      [verordening 1308/2013](32013R1308), verstrekt bij dat verzoek, voor zover van toepassing, de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.a
    text: het verbindend te verklaren voorschrift;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.b
    text: |-
      een omschrijving van het betrokken product of de betrokken producten, bedoeld in artikel 164, derde lid, van
      [verordening 1308/2013](32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.c
    text: |-
      de berekening van het relevante aandeel, bedoeld in artikel 164, derde lid, onderdelen a of b, van [verordening
      1308/2013](32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.d
    text: |-
      een omschrijving van het doel of de doelen, bedoeld in artikel 164, vierde lid, van [verordening 1308/2013]
      (32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.e
    text: een motivering waaruit blijkt dat het voorschrift niet strijdig is met de relevante Europese en nationale regels;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.f
    text: |-
      de periode waarvoor het voorschrift verbindend moet worden verklaard of waarvoor de financiële bijdrage moet worden
      afgedragen;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.g
    text: |-
      een omschrijving van de manier waarop de erkende organisatie toe zal zien op de naleving van het voorschrift of op
      de afdracht van de financiële bijdrage;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.h
    text: |-
      een omschrijving van de manier waarop de erkende organisatie sancties zal opleggen bij niet-nalevingen van het
      voorschrift of bij niet-afdrachten van de financiële bijdrage;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.i
    text: |-
      indien van toepassing documentatie waaruit blijkt dat aan de Europese Commissie advies is gevraagd overeenkomstig
      artikel 210, tweede lid, van [verordening 1308/2013](32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.1.j
    text: |-
      documentatie waaruit blijkt dat het voorschrift op het tijdstip van indiening van het verzoek ten minste een jaar
      van kracht is.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.2
    text: |-
      Een erkende organisatie die verzoekt om een besluit op grond van artikel 165 van [verordening 1308/2013]
      (32013R1308), verstrekt tevens de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.2.a
    text: |-
      de berekening van de verschuldigde financiële bijdrage, gerelateerd aan het voordeel dat daardoor wordt genoten
      door marktdeelnemers of groepen van marktdeelnemers als bedoeld in artikel 165 van [verordening 1308/2013]
      (32013R1308);
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.2.b
    text: de wijze waarop de erkende organisatie de financiële bijdrage zal innen;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:5.2.c
    text: de wijze waarop de financiële bijdrage wordt besteed.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel55
  - number: 5:6
    text: |-
      De minister stelt belanghebbenden in de gelegenheid om hun zienswijze kenbaar te maken omtrent een op grond van
      artikel 164, eerste lid, of artikel 165 van [verordening 1308/2013](32013R1308) te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel56
  - number: 5:7
    text: |-
      Marktdeelnemers of groepen van marktdeelnemers die op grond van artikel 164, eerste lid, of artikel 165 van
      [verordening 1308/2013](32013R1308) zijn gebonden om een voorschrift uit te voeren, of die een financiële bijdrage
      moeten afdragen zijn gehouden tot de naleving van dat voorschrift of tot de afdracht van die financiële bijdrage
      jegens de erkende organisatie die daartoe heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel57
  - number: 5:8.1
    text: |-
      Een producentenorganisatie of unie van producentenorganisaties in de sector groenten en fruit leeft de
      voorschriften, bedoeld in de artikelen 164, eerste, derde en vierde lid, en 165 van [verordening 1308/2013]
      (32013R1308), na.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel58
  - number: 5:8.2
    text: 'In geval van niet-naleving van een voorschrift kan de Minister:'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel58
  - number: 5:8.2.a
    text: |-
      de op grond van artikel 164, eerste lid, van [verordening 1308/2013](32013R1308) vastgestelde verbindendverklaring
      van een voorschrift intrekken;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel58
  - number: 5:8.2.b
    text: |-
      de op grond van artikel 165 van [verordening 1308/2013](32013R1308), vastgestelde verplichting tot het afdragen van
      een financiële bijdrage intrekken.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel58
  - number: 5:9
    text: |-
      Een verzoek van een producentenorganisatie of unie van producentenorganisaties in de sector groenten en fruit
      als bedoeld in de artikelen 164, eerste lid of 165 van [verordening 1308/2013](32013R1308), of een zienswijze als
      bedoeld in artikel 165, van [verordening 1308/2013](32013R1308), wordt ingediend met gebruikmaking van een door de
      Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel59
  - number: 6:1
    text: 'Een erkende organisatie verstrekt jaarlijks uiterlijk op 1 oktober aan de minister:'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:1.a
    text: een actuele lijst van de leden;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:1.b
    text: |-
      indien het een unie van producentenorganisaties of een brancheorganisatie betreft waarvan de minister een
      voorschrift verbindend heeft verklaard op grond van artikel 164, eerste lid, van [verordening 1308/2013]
      (32013R1308), of waarvan de minister heeft besloten tot het verplichten van een financiële bijdrage op grond
      van artikel 165 van die verordening een actuele lijst van alle marktdeelnemers die door de leden worden
      vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:1.c
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:1.d
    text: de actuele statuten voor zover hierin wijzigingen zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:1.e
    text: |-
      indien het een organisatie in de sector melk en zuivelproducten betreft de gegevens, bedoeld in artikel 149, tweede
      lid, onder f, of zesde lid, van [verordening 1308/2013](32013R1308), indien de in die leden omschreven activiteiten
      zijn verricht.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel61
  - number: 6:2
    text: |-
      Een erkende organisatie leeft, voor zover van toepassing, de voorschriften na als bedoeld in de artikelen 152,
      153, 154, eerste lid, 155, 156, 157, eerste en derde lid, 158, eerste lid, 161, eerste lid, 163, eerste lid, 164,
      eerste, derde en vierde lid, 165, 209 en 210, eerste tot en met derde lid, van [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel62
  - number: 6:3
    text: |-
      In geval van niet-naleving van een voorschrift als bedoeld in de [artikelen 6:1][ref1] of [6:2][ref2] kan de
      minister:


      [ref1]: https://wetten.overheid.nl/BWBR0035634#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035634#Artikel6
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0035634
        artikel: '6'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0035634
        artikel: '6'
        paragraaf: '6'
  - number: 6:3.a
    text: de erkenning intrekken;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel63
  - number: 6:3.b
    text: |-
      de op grond van artikel 164, eerste lid, van [verordening 1308/2013](32013R1308) vastgestelde verbindendverklaring
      van een voorschrift intrekken;
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel63
  - number: 6:3.c
    text: |-
      de op grond van artikel 165 van [verordening 1308/2013](32013R1308) vastgestelde verplichting tot het afdragen van
      een financiële bijdrage intrekken.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel63
  - number: 6:4
    text: |-
      Een verzoek als bedoeld in artikelen 152, eerste of derde lid, 156, 157, eerste of derde lid, 164, eerste
      lid of 165, of een zienswijze als bedoeld in artikel 165, of het verstrekken van informatie als bedoeld in
      [artikel 6:1][ref1], wordt ingediend met behulp van een door de minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0035634#Artikel6
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0035634
        artikel: '6'
        paragraaf: '6'
  - number: 6:5
    text: |-
      De erkenning van een producentenorganisatie, een unie van producentenorganisaties of een brancheorganisatie
      wordt verleend voor onbepaalde tijd. Voor bepaalde tijd verleende erkenningen worden geacht te zijn verleend voor
      onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel65
  - number: 6:7
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel67
  - number: 6:8
    text: 'Deze regeling wordt aangehaald als: Regeling producenten- en brancheorganisaties.'
    url: https://wetten.overheid.nl/BWBR0035634/2026-01-21#Artikel68
