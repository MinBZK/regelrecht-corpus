preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de wetgeving van
    het Ministerie van Sociale Zaken en Werkgelegenheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046051/2021-12-21#ArtikelAanhef
articles:
  - number: XXXV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld, waarbij de [artikelen IA][ref1],
      [II, onderdeel B][ref2], [III, onderdeel aA][ref3], [VI, onderdeel E][ref4], [VII][ref5],
      [VIII, onderdeel Ba][ref6], [X, onderdelen Ea en G][ref7], [XA][ref8], [XVIIIA][ref9], [XVIIIB][ref10],
      [XIX][ref11], [XX, onderdeel A][ref12], [XXIII, onderdeel Aa][ref13], [XXXII, onderdeel Da][ref14],
      [XXXIII, onderdeel Ba][ref15], kunnen terugwerken tot en met een in dat besluit te bepalen tijdstip.


