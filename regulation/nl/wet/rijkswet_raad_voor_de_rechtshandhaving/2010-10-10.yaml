---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rijkswet_raad_voor_de_rechtshandhaving
regulatory_layer: WET
publication_date: '2010-09-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028075
url: https://wetten.overheid.nl/BWBR0028075/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de regeringen van Nederland en de Nederlandse Antillen en de
    bestuurscolleges van Curaçao en Sint Maarten binnen het Koninkrijk willen samenwerken door instelling van een
    orgaan dat is belast met de inspectie van diensten en instellingen die deel uitmaken van de justitiële keten in
    Curaçao, in Sint Maarten en op Bonaire, Sint Eustatius en Saba, dat zij deze samenwerking onderling willen regelen
    in een rijkswet op grond van artikel 38, tweede lid, van het Statuut voor het Koninkrijk en dat de regeringen van
    Nederland en de Nederlandse Antillen en de bestuurscolleges van Curaçao en Sint Maarten instemmen met de inhoud van
    deze regeling;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze rijkswet wordt verstaan onder: - *bestuursorgaan:* – een orgaan van een rechtspersoon in de landen die
      krachtens publiekrecht is ingesteld of – een ander persoon of college met enig openbaar gezag bekleed in de landen;
        - *landen:* Curaçao, Sint Maarten of Nederland, voor zover het betreft Bonaire, Sint Eustatius en Saba;
        - *Gemeenschappelijk Hof van Justitie:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba;
        - *Raad:* Raad voor de rechtshandhaving bedoeld in [artikel 2, eerste lid][ref1];
        - *Onze Minister:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten of Onze
      Minister van Nederland wie het aangaat als bedoeld in het tweede tot en met vijfde lid;
        - *Onze betrokken Minister:* Onze Minister van het land dat bij een inspectierapport of advies is betrokken;
        - *Onze Ministers:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten en Onze
      Minister van Nederland wie het aangaat als bedoeld in het tweede tot en met vijfde lid gezamenlijk;
        - *vertegenwoordigend orgaan:* de Staten van Curaçao, de Staten van Sint Maarten of de Tweede Kamer der Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel2
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '2'
        hoofdstuk: '2'
  - number: '1.2'
    text: |-
      Voor zover de inspectie door de Raad betrekking heeft op de politie of de opleiding van de politie en geheel
      of ten dele wordt uitgevoerd ten behoeve van Nederland, voor zover het betreft Bonaire, Sint Eustatius en Saba
      is Onze Minister van Nederland wie het aangaat: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      overeenstemming met Onze Minister van Justitie van Nederland.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      Bij de toepassing van de [artikelen 36, vijfde lid][ref1], [37, zesde lid][ref2], en [42][ref3] is Onze Minister
      van Nederland wie het aangaat Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van
      Justitie van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0028075#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0028075#Artikel42
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '36'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028075
        artikel: '37'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0028075
        artikel: '42'
        hoofdstuk: '7'
  - number: '1.4'
    text: |-
      Voor zover de inspectie door de Raad betrekking heeft op instellingen en inrichtingen als bedoeld in
      [artikel 3, eerste lid, onder b][ref1], justitiële samenwerking als bedoeld in [artikel 3, derde lid][ref2], het
      vreemdelingentoezicht of de grensbewaking ten behoeve van Bonaire, Sint Eustatius en Saba is Onze Minister van
      Nederland wie het aangaat Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028075#Artikel3
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
  - number: '1.5'
    text: |-
      In andere gevallen dan genoemd in het tweede tot en met vierde lid is Onze Minister van Nederland wie het
      aangaat Onze Minister van Justitie van Nederland in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel1
  - number: '2.1'
    text: Er is een Raad voor de rechtshandhaving.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel2
  - number: '2.2'
    text: De Raad is een orgaan van Curaçao, Sint Maarten en Nederland.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel2
  - number: '2.3'
    text: De Raad bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel2
  - number: '3.1'
    text: 'De Raad is in de landen belast met algemene inspectie van de volgende organisaties:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.1.a
    text: de politie, de opleiding van de politie en het openbaar ministerie,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.1.b
    text: |-
      instellingen en inrichtingen waar vrijheidsstraffen, vrijheidsbeperkende straffen, vrijheidsbenemende maatregelen
      of vrijheidsbeperkende maatregelen ten uitvoer worden gelegd, of reclassering dan wel slachtofferzorg plaatsvindt
      ten aanzien van volwassenen en jeugdigen,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.1.c
    text: |-
      andere bij landsverordening of bij wet aangewezen organisaties die onder de verantwoordelijkheid van Onze Minister
      vallen en deel uitmaken van de justitiële keten.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: '3.2'
    text: 'De Raad voert de inspectie, bedoeld in het eerste lid, uit met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.2.a
    text: de effectiviteit,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.2.b
    text: de kwaliteit van de taakuitvoering, en
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: 3.2.c
    text: het beheer.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      De Raad is voorts belast met de algemene inspectie van de kwaliteit en effectiviteit van de justitiële samenwerking
      tussen de landen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      De Raad kan bij landsverordening of bij wet worden belast met advisering over de afhandeling van klachten
      bij bestuursorganen over de wijze waarop een organisatie als bedoeld in het eerste lid zich in een bepaalde
      aangelegenheid heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: '3.5'
    text: |-
      De Raad kan bij landsverordening of bij wet worden belast met het toezicht op de verwerking van politiegegevens.
      Daarbij kunnen de voor die taak benodigde bevoegdheden aan de Raad worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
  - number: '3.6'
    text: |-
      De Raad voert geen inspectie uit voor zover de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], een onderzoek instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '4.1'
    text: Onze Ministers kunnen de Raad met betrekking tot de uitvoering van het jaarplan aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Deze aanwijzingen kunnen geen betrekking hebben op de te hanteren methodiek, de oordeelsvorming van de Raad en
      zijn onderzoeksrapport.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel4
  - number: '4.3'
    text: Een aanwijzing wordt niet gegeven dan na overleg met de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel4
  - number: '5'
    text: De Raad bestaat uit drie leden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel5
  - number: '6'
    text: |-
      De leden van de Raad worden benoemd, geschorst en ontslagen bij koninklijk besluit. Zij worden benoemd voor
      maximaal vier jaar en kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister van één van de landen, doet een voorstel voor benoeming van één van de leden in overeenstemming met
      Onze Minister van beide andere landen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Alvorens hun ambt te aanvaarden leggen de leden in handen van de president van het Gemeenschappelijk Hof van
      Justitie de eed of belofte af volgens het formulier zoals vastgesteld in de bijlage bij deze rijkswet.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De leden van de Raad worden benoemd op grond van de deskundigheid die nodig is voor de uitoefening van de taken van
      de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel8
  - number: '8.2'
    text: De leden dienen de Nederlandse nationaliteit te bezitten.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      De leden vervullen geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      hun functie of op de handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      De leden van de Raad melden het voornemen tot het aanvaarden van een nevenfunctie aan Onze Minister van één van de
      landen en stelt de andere ministers daarvan gelijktijdig op de hoogte.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel8
  - number: '8.5'
    text: De Raad maakt de nevenfuncties openbaar door publicatie op de website van de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel8
  - number: '9'
    text: Het voorzitterschap van de Raad rouleert jaarlijks tussen de drie leden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel9
  - number: '10'
    text: 'Aan een lid van de Raad wordt ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.a
    text: |-
      op zijn verzoek uiterlijk met ingang van de eerste dag van de derde kalendermaand van de dag waarop Onze Minister
      het verzoek om ontslag heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.b
    text: bij het bereiken van de leeftijd van 70 jaar;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.c
    text: indien hij uit hoofde van ziekte of gebrek blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.d
    text: |-
      bij aanvaarding van een betrekking als bedoeld in [artikel 8, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel8
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10.e
    text: bij het verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.f
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.g
    text: |-
      indien hij ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: 10.h
    text: |-
      indien hij naar het oordeel van Onze Ministers door handelen of nalaten ernstig nadeel toebrengt aan het in hem te
      stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel10
  - number: '11.1'
    text: 'Een lid van de Raad wordt geschorst indien:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
  - number: 11.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
  - number: 11.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
  - number: 11.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, surseance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Een lid van de Raad kan worden geschorst, indien tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf
      wordt ingesteld of indien er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden als
      bedoeld in [artikel 10, onderdelen c tot en met h][ref1], die tot ontslag zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel10
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt schorsing na drie maanden. De schorsing kan telkens met ten
      hoogste drie maanden worden verlengd. De schorsing wordt beëindigd zodra de grond voor schorsing is vervallen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Het voorstel voor de besluiten die worden genomen op grond van de [artikelen 10][ref1] en [11][ref2] worden gedaan
      door Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028075#Artikel11
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028075
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur wordt de rechtspositie van de leden van de Raad geregeld, voor
      zover daarin niet bij deze rijkswet is voorzien.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel13
  - number: '14.1'
    text: De Raad beschikt voor zijn ondersteuning over een secretariaat.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Het secretariaat houdt kantoor in Curaçao en Sint Maarten, alsmede op één van de eilanden Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.3'
    text: Aan het hoofd van elk van de kantoren staat een secretaris.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.4'
    text: De secretarissen zijn voor hun werkzaamheden voor de Raad uitsluitend verantwoording schuldig aan de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.5'
    text: De Raad benoemt, schorst en ontslaat de secretarissen en de overige leden van het secretariaat.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.6'
    text: Het besluit tot benoeming van een lid van het secretariaat bevat het land van standplaats van betrokkene.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '14.7'
    text: Ieder lid van het secretariaat is bevoegd en inzetbaar in alle landen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Op de rechtspositie van de leden van het secretariaat met als standplaats Curaçao of Sint Maarten zijn de
      regels die gelden voor ambtenaren die zijn aangesteld bij ministeries in Curaçao respectievelijk Sint Maarten
      van toepassing, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan een minister, deze
      bevoegdheid wordt uitgeoefend door de Raad, tenzij het de bevoegdheid betreft regels te stellen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Op de rechtspositie van de leden van het secretariaat met als standplaats Bonaire, Sint Eustatius of Saba
      zijn de regels van toepassing die gelden voor ambtenaren die door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties zijn aangesteld om uitsluitend werkzaam te zijn op Bonaire, Sint Eustatius of Saba, met dien
      verstande dat waar in deze regels een bevoegdheid is toegekend aan de minister, deze bevoegdheid wordt uitgeoefend
      door de Raad, tenzij het de bevoegdheid betreft regels te stellen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel15
  - number: '16.1'
    text: De Raad stelt voor zijn werkzaamheden een protocol voor de werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Het protocol wordt binnen vier weken na vaststelling openbaar gemaakt door plaatsing op de website van de Raad en
      door publicatie in een algemeen verkrijgbaar publicatieblad van elk van de landen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel16
  - number: '17.1'
    text: De leden van de Raad hebben zitting zonder last.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: '17.2'
    text: 'Een lid van de Raad of een lid van het secretariaat mag niet:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.a
    text: 'als advocaat, gemachtigde of adviseur werkzaam zijn in geschillen voor:'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.a.1°
    text: een wederpartij van de Raad,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.a.2°
    text: een partij die door de Raad wordt geadviseerd,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.a.3°
    text: een dienst of instelling die de Raad inspecteert, of
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.a.4°
    text: de Raad,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.b
    text: |-
      rechtstreeks of middellijk een overeenkomst aangaan met de Raad met uitzondering van overeenkomsten die
      rechtstreeks samenhangen met de aanstelling als lid van de Raad of van het secretariaat,
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: 17.2.c
    text: |-
      als vertegenwoordiger of adviseur werkzaam zijn voor derden in verband met het met de Raad aangaan van
      overeenkomsten als bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      De Raad kan voor de uitoefening van zijn bevoegdheden gebruik maken van deskundigen, waaronder in ieder geval
      begrepen toezichthouders werkzaam bij inspectiediensten van de landen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      De Raad maakt voor de uitoefening van zijn bevoegdheden met betrekking tot Bonaire, Sint Eustatius en Saba gebruik
      van terzake deskundige Nederlandse inspectiediensten.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel18
  - number: '19'
    text: |-
      De Raad kondigt een inspectie van tevoren aan bij de betrokken dienst of instelling, tenzij in het belang van het
      onderzoek een onaangekondigde inspectie wenselijk is.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Een ieder die is betrokken bij de uitvoering van deze rijkswet en daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of
      uit zijn taak bij de uitvoering van deze rijkswet de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      De Raad is bevoegd uit eigen beweging in het kader van zijn inspectietaken, bedoeld in
      [artikel 3, eerste lid][ref1], onderzoek in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel3
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
  - number: '21.2'
    text: |-
      De Raad verricht voorts een onderzoek als bedoeld in het eerste lid op een daartoe strekkend verzoek van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel21
  - number: '22'
    text: |-
      De Raad maakt van de uitoefening van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      De Raad is bevoegd, met medeneming van de benodigde apparatuur, terreinen en gebouwen van de in
      [artikel 3, eerste lid][ref1], genoemde organisaties te betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel3
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
  - number: '23.2'
    text: De Raad is bevoegd zich te laten vergezellen door personen die daartoe door de Raad zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      De leden van de Raad, de door hem aangewezen medewerkers van het secretariaat en deskundigen dragen bij het
      betreden van een plaats als bedoeld in het eerste lid een legitimatiebewijs bij zich, dat is uitgegeven door Onze
      Minister. Zij tonen het legitimatiebewijs desgevraagd aanstonds.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel23
  - number: '23.4'
    text: Het legitimatiebewijs bevat een foto van de drager en vermeldt in ieder geval diens naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel23
  - number: '24'
    text: De Raad is bevoegd inlichtingen te vorderen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De Raad is bevoegd van personen inzage te vorderen van een in de landen algemeen bij of krachtens landsverordening
      of bij of krachtens wet erkend identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel25
  - number: '26.1'
    text: De Raad is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel26
  - number: '26.2'
    text: De Raad is bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, is de Raad bevoegd de gegevens en bescheiden voor dat
      doel korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel26
  - number: '27.1'
    text: De Raad is bevoegd vervoermiddelen te onderzoeken met betrekking waartoe hij een inspectietaak heeft.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      De Raad is bevoegd vervoermiddelen waarmee naar zijn redelijk oordeel zaken worden vervoerd met betrekking waartoe
      hij een inspectietaak heeft, op hun lading te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      De Raad is bevoegd van de bestuurder van een vervoermiddel met betrekking waartoe hij een inspectietaak heeft,
      inzage te vorderen van de wettelijk voorgeschreven bescheiden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel27
  - number: '27.4'
    text: |-
      De Raad is bevoegd met het oog op de uitoefening van de bevoegdheid, bedoeld in het eerste lid, van de bestuurder
      van een voertuig of van de schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een
      door hem aangewezen plaats overbrengt.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel27
  - number: '27.5'
    text: De Raad stelt in een reglement vast op welke wijze de vordering tot stilhouden wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel27
  - number: '28.1'
    text: |-
      Een ieder is verplicht aan de Raad binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die
      deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel28
  - number: '28.2'
    text: |-
      Zij die uit hoofde van hun ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Het ten aanzien van de Raad gestelde in de [artikelen 22 tot en met 28][ref1] geldt ook voor daartoe door de Raad
      aangewezen personen, voor zover de Raad in de aanwijzing vermeldt over welke bevoegdheden deze personen beschikken.
      Deze bevoegdheden worden vermeld in het legitimatiebewijs, bedoeld in [artikel 23, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0028075#Artikel23
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028075
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      De Raad kan personen als bedoeld in het eerste lid slechts aanwijzen uit de kring van leden van de Raad,
      medewerkers van het secretariaat en deskundigen als bedoeld in [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel18
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '29.3'
    text: |-
      De op grond van het eerste lid aangewezen deskundigen handelen bij de uitoefening van de bevoegdheden onder
      verantwoordelijkheid van de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel29
  - number: '30.1'
    text: De Raad stelt naar aanleiding van het door hem verrichte onderzoek een inspectierapport op.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      De Raad stelt de betrokken instantie in de gelegenheid binnen een door de Raad gestelde redelijke termijn op het
      inspectierapport te reageren. Vervolgens stelt de Raad Onze betrokken Minister in de gelegenheid binnen een door de
      Raad gestelde redelijke termijn op het inspectierapport te reageren.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel30
  - number: '30.3'
    text: |-
      Na ontvangst van de reactie van Onze betrokken Minister of na verloop van de termijn, bedoeld in het tweede lid,
      tweede volzin, stelt de Raad het inspectierapport vast. Hij kan naar aanleiding van zijn bevindingen Onze betrokken
      Minister aanbevelingen doen met betrekking tot eventueel te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel30
  - number: '30.4'
    text: Het inspectierapport wordt na vaststelling door de Raad gezonden aan Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel30
  - number: '30.5'
    text: |-
      Onze betrokken Minister zendt het inspectierapport alsmede zijn reactie daarop binnen zes weken aan het
      vertegenwoordigende orgaan van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      De Raad maakt een inspectierapport, bedoeld in [artikel 30, eerste lid][ref1], behoudens het bepaalde in het tweede
      en derde lid openbaar niet eerder dan zes weken nadat het rapport is toegezonden aan Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel30
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '31.2'
    text: Niet openbaar wordt gemaakt dat deel van het rapport dat
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.2.a
    text: de eenheid van de regering van Curaçao, Sint Maarten of Nederland kan schaden;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.2.b
    text: de veiligheid van Curaçao, Sint Maarten of Nederland kan schaden;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.2.c
    text: bedrijfs- of fabricagegegevens betreft die vertrouwelijk aan de overheid zijn medegedeeld;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.2.d
    text: persoonsgegevens betreft, tenzij de verstrekking kennelijk geen inbreuk op de persoonlijke levenssfeer maakt.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: '31.3'
    text: |-
      Voorts blijft openbaarmaking van het rapport of gedeelten daarvan achterwege voor zover het belang daarvan niet
      opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.a
    text: de betrekkingen van Curaçao, Sint Maarten of Nederland met andere staten en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.b
    text: de economische of financiële belangen van Curaçao, Sint Maarten of Nederland;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.d
    text: de inspectie, controle of het toezicht door of vanwege bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: 31.3.f
    text: het voorkomen van onevenredige bevoordeling of benadeling van natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Indien Onze betrokken Minister stelselmatig geen gevolg geeft aan de aanbevelingen van de Raad, kan de Raad
      daarvan mededeling doen aan het vertegenwoordigend orgaan van het betrokken land en de raad van ministers van het
      Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      De Raad brengt elk jaar voor 1 mei over ieder land een verslag uit over de staat van de rechtshandhaving naar
      aanleiding van zijn werkzaamheden in het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Het verslag over een land als bedoeld in het eerste lid wordt aangeboden aan Onze betrokken Minister en aan het
      betrokken vertegenwoordigend orgaan.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      Indien de Raad bij landsverordening of bij wet is belast met advisering over de afhandeling van klachten als
      bedoeld in [artikel 3, vierde lid][ref1], zijn het tweede tot en met zesde lid van dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel3
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
  - number: '34.2'
    text: |-
      Het bestuursorgaan, bedoeld in [artikel 3, vierde lid][ref1], meldt aan de klager dat het advies van de Raad wordt
      ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel3
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '3'
        hoofdstuk: '2'
  - number: '34.3'
    text: |-
      Het horen van de klager en het bestuursorgaan geschiedt door de Raad. De Raad kan het horen opdragen aan één van
      zijn leden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
  - number: '34.4'
    text: |-
      De Raad kan van het horen afzien indien de klacht kennelijk ongegrond is of indien de klager en het bestuursorgaan
      hebben verklaard geen gebruik te willen maken van het recht te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
  - number: '34.5'
    text: |-
      De Raad zendt een rapport van bevindingen, vergezeld van een advies en eventuele aanbevelingen aan het
      bestuursorgaan dat is belast met beoordeling van de klacht. Het rapport bevat het verslag van het horen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
  - number: '34.6'
    text: |-
      Indien de conclusies van het bestuursorgaan afwijken van het advies, wordt in de conclusies de reden voor die
      afwijking vermeld en wordt het advies aan de klager toegezonden.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel34
  - number: '35.1'
    text: De kosten van de Raad worden vergoed uit een door de landen beschikbaar te stellen bijdrage.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel35
  - number: '35.2'
    text: Onze Ministers bepalen de omvang van de in totaal aan de Raad te vergoeden kosten.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel35
  - number: '35.3'
    text: |-
      Elk van de landen draagt de kosten die het secretariaat specifiek voor inspectie en advies in het betrokken land
      maakt.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel35
  - number: '35.4'
    text: Onze Ministers verdelen de kosten voor algemene ondersteuning van de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      De Raad zendt jaarlijks voor 1 oktober aan Onze Ministers een jaarplan en een begroting voor het daaropvolgende
      jaar.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      De begroting behelst een raming van de baten en lasten, een raming van de voorgenomen investeringsuitgaven
      en een raming van de inkomsten en uitgaven met een onderverdeling in de kosten, bedoeld in
      [artikel 35, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel35
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '35'
        hoofdstuk: '6'
  - number: '36.3'
    text: |-
      In het jaarplan worden de begrotingsposten ieder afzonderlijk van een toelichting voorzien. De Raad onderscheidt de
      werkzaamheden per land.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
  - number: '36.4'
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting een
      vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
  - number: '36.5'
    text: Het besluit tot vaststelling van het jaarplan en de begroting behoeft de goedkeuring van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
  - number: '36.6'
    text: Onze Ministers zenden het jaarplan naar de vertegenwoordigende organen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel36
  - number: '37.1'
    text: |-
      De Raad verstrekt desgevraagd aan Onze Ministers de voor de uitoefening van zijn taak benodigde inlichtingen.
      De Raad verstrekt deze inlichtingen onverwijld uit eigen beweging aan Onze Ministers indien er aanmerkelijke
      verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de begrote baten en lasten dan wel inkomsten
      en uitgaven.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.2'
    text: De Raad stelt jaarlijks voor 1 april een jaarverslag vast over het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.3'
    text: |-
      Het jaarverslag beschrijft de taakuitoefening alsmede het gevoerde beleid en bevat in ieder geval een toelichting
      van de gerealiseerde werkzaamheden en een jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.4'
    text: De Raad zendt het jaarverslag naar de vertegenwoordigende organen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.5'
    text: |-
      In de jaarrekening wordt rekening en verantwoording afgelegd van de uitgaven, de eventuele ontvangsten en het
      gevoerde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.6'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '37.7'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel37
  - number: '38.1'
    text: De Raad vormt een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel38
  - number: '38.2'
    text: |-
      Het verschil tussen de door de Raad gerealiseerde baten en de gerealiseerde lasten van de activiteiten komt ten
      gunste onderscheidenlijk ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel38
  - number: '38.3'
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel38
  - number: '38.4'
    text: Onze Ministers kunnen regels stellen met betrekking tot de vorming en de omvang van reserves.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel38
  - number: '39'
    text: |-
      De Raad kan privaatrechtelijke rechtshandelingen verrichten, voor zover die voortvloeien uit het jaarplan en zijn
      gedekt binnen het budget van de ingevolge [artikel 36, vijfde lid][ref1], goedgekeurde begroting van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel36
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '36'
        hoofdstuk: '6'
  - number: '40.1'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de Raad bij
      unanimiteit aangewezen accountant.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      Bij de aanwijzing van de accountant bedingt de Raad dat aan Onze Ministers desgevraagd inzicht wordt geboden in de
      controlewerkzaamheden van de accountant.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel40
  - number: '40.3'
    text: |-
      De verklaring, bedoeld in het eerste lid, heeft mede betrekking op de rechtmatige besteding van de middelen door
      de Raad.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel40
  - number: '40.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van de Raad voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel40
  - number: '41'
    text: |-
      De bevoegdheden van de Algemene Rekenkamers in de landen strekken zich uit tot de Raad. Over het toezicht op de
      Raad treden de Algemene Rekenkamers met elkaar in overleg.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel41
  - number: '42'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze rijkswet aan de vertegenwoordigende organen
      een evaluatieverslag over de doeltreffendheid en de effecten van deze rijkswet in de praktijk. Voorafgaande aan
      de evaluatie zullen de landen gezamenlijk de criteria, de thema’s en de samenstelling van de evaluatiecommissie
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel42
  - number: '43.1'
    text: |-
      Deze rijkswet kan in onderling overleg worden gewijzigd bij rijkswet op grond van
      [artikel 38, tweede lid, van het Statuut][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
  - number: '43.2'
    text: |-
      Naar aanleiding van de evaluatie, bedoeld in [artikel 42][ref1], kan deze rijkswet in onderlinge overeenstemming
      worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel42
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '42'
        hoofdstuk: '7'
  - number: '44'
    text: Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel44
  - number: '45'
    text: 'Deze rijkswet wordt aangehaald als: Rijkswet Raad voor de rechtshandhaving.'
    url: https://wetten.overheid.nl/BWBR0028075/2010-10-10#Artikel45
