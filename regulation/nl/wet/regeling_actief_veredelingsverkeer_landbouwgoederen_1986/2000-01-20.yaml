  - number: '9'
    text: |-
      1 De invoer van een goed in het kader van het actief veredelingsverkeer dient te blijken door middel
      van een door een ambtenaar der invoerrechten en accijnzen afgetekend formulier L als bedoeld in
      [artikel 37 van de Douaneregeling][ref1].

      2 De uitvoer van een goed naar een land of gebied dat geen deel uitmaakt van de Europese Gemeenschappen
      onderscheidenlijk naar Spanje of Portugal in het kader van het actief veredelingsverkeer dient te blijken
      door middel van een door een ambtenaar der invoerrechten en accijnzen afgetekend formulier L, als bedoeld in
      [artikel 39 van de Douaneregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel39
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0008032
        artikel: '39'
  - number: '10'
    text: |-
      Indien de in [artikel 2][ref1] bedoelde vrijstelling geheel of gedeeltelijk is vervallen of ingetrokken dan wel
      indien daarvan is afgezien, geldt voor de berekening van de heffing als dag van invoer de dag van invoer, als
      bedoeld in [artikel 7 van de Regeling in- en uitvoer landbouwgoederen][ref2], van de invoergoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0004088#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel7
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004088
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003381
        artikel: '7'
  - number: 10a
    text: |-
      1 Indien ten aanzien van een veredelingsprodukt of een onveredeld goed een douaneschuld ontstaat legt het
      produktschap overeenkomstig en met inachtneming van het bepaalde in het Communautair douanewetboek compenserende
      intresten op over het bedrag van de verschuldigde heffingen bij invoer.

      2 De vergunninghouder kan bij een verzoek tot het in het vrije verkeer brengen van veredelingsprodukten of
      onveredelde goederen bij het produktschap een verzoek indienen tot het niet verschuldigd zijn van de in het eerste
      lid genoemde compenserende intresten. Daartoe dient hij de nodige bewijsstukken bij te voegen waaruit blijkt dat
      bijzondere omstandigheden, die geen enkele nalatigheid of manipulatie van zijn kant inhouden, het onmogelijk of
      economisch onmogelijk maken de beoogde uitvoer te verrichten in de door hem verwachte omstandigheden, voor zover
      die omstandigheden bij de indiening van het verzoek om een vergunning behoorlijk zijn gerechtvaardigd.

      3 Indien het produktschap overweegt het in het tweede lid vermelde verzoek in te willigen en wanneer het bedrag
      dat de basis voor de toepassing van de compenserende intresten hoger dan 3000 ECU per zuiveringsafrekening is, dan
      kan het produktschap in afwachting van de een beslissing van de Commissie van de Europese Gemeenschappen voor de
      vrijgave van de veredelingsprodukten of onveredelde goederen voor de betaling van de verschuldigde intresten een
      zekerheid verlangen.
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel10a
  - number: '11'
    text: |-
      Ingeval de uit het besluit voortvloeiende bevoegdheden met betrekking tot een na veredeling uit of in te voeren
      goed toekomen aan een ander produktschap, dan dat hetwelk deze bevoegdheden met betrekking tot het ter veredeling
      in of uit te voeren goed uitoefent, wordt door de toepassing van deze regeling het eerstbedoelde produktschap mede
      als bevoegd produktschap aangemerkt en treedt dit, voor wat het deel van de veredelingshandelingen betreft, dat
      binnen zijn sector valt, als zodanig op.
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel11
  - number: '12'
    text: |-
      1 De artikelen 1, 2, 4, 5a, 6, 6b, 7 tot en met 11 van de Veredelingsverkeersbeschikking landbouwgoederen 1968
      (Stcrt. 189) worden, voor zover zij geen betrekking hebben op passieve veredeling, ingetrokken.

      2 De toestemmingen tot actief veredelingsverkeer, als bedoeld in artikel 5 van de Veredelingsverkeersbeschikking
      Landbouwgoederen 1968, blijven, voor zover de in artikel 5a, tweede lid, van laatstgenoemde regeling genoemde
      termijn niet voor die datum is verstreken, van kracht tot en met 31 december 1987.

      3 Deze regeling treedt in werking met ingang van 1 januari 1987 en kan worden aangehaald als: regeling actief
      veredelingsverkeer landbouwgoederen 1986.
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel12
