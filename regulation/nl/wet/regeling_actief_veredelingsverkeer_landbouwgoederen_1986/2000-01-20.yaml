  - number: '7'
    text: |-
      Het produktschap kan een vergunning, op een daartoe ingediend verzoek, verlengen danwel wijzigen. [Artikel 6][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004088#Artikel6
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004088
        artikel: '6'
  - number: '8'
    text: |-
      1 Een bestemming is bereikt, indien de veredelingsprodukten:

      a. zijn uitgevoerd naar een land of gebied dat geen deel uitmaakt van de Europese Gemeenschappen, danwel
      indien vrijstelling is verleend van de heffingen bij in- of uitvoer, bedoeld in de [artikelen 2][ref1] en
      [3, tweede lid, van de Compensatiebeschikking toetreding Spanje en Portugal][ref2] (Stcrt. 1986, 52) naar Spanje of
      Portugal en aan alle voorwaarden voor de toepassing van de beschikking is voldaan;

      b. worden opgeslagen in een hier te lande gelegen inrichting voor douane-opslag of douane-entrepot met het oog op
      uitvoer naar een land of gebied, dat geen deel uitmaakt van de Europese Gemeenschappen;

      c. worden geplaatst onder een der andere douaneregelingen, bedoeld in het Communautair douanewetboek;

      d. opnieuw ingevolge [artikel 2][ref3] vrijstelling is verleend.

      2 Voorts is een bestemming bereikt indien de veredelingsprodukten onder toelating van het produktschap:

      a. in het vrije verkeer worden gebracht onder betaling van de in [artikel 2][ref4] genoemde heffingen die golden
      op de dag van invoer, als bedoeld in [artikel 7 van de Regeling in- en uitvoer landbouwgoederen][ref5], alsmede de
      ingevolge het Communautair douanewetboek verschuldigde compenserende intresten;

      b. onder de regeling voor behandeling onder douanetoezicht worden geplaatst;

      c. worden vernietigd onder ambtelijk toezicht, waarbij de resten en de afvallen die uit deze vernietiging
      voortkomen zelf ofwel worden uitgevoerd naar een land of gebied dat geen deel uitmaakt van de Europese
      Gemeenschappen, ofwel een van de overige bestemmingen, genoemd in het eerste lid dan wel in de onderdelen a en b
      kunnen krijgen.

      3 De bepalingen van het eerste en tweede lid zijn eveneens van toepassing op onveredelde goederen.

      4 Indien de uit equivalente goederen verkregen veredelingsprodukten worden uitgevoerd naar een land of gebied dat
      geen deel uitmaakt van de Europese Gemeenschappen, onderscheidenlijk naar Spanje of Portugal, voordat de invoer van
      invoergoederen heeft plaatsgevonden, is een bestemming als bedoeld in [artikel 4][ref6] bereikt, indien de aangifte
      ten invoer van de invoergoederen is aanvaard.

      5 Het produktschap stelt de termijn vast, waarbinnen de in het vierde lid bedoelde invoergoederen moeten zijn
      ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003928#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003928#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004088#Artikel2
