preamble:
  text: |-
    Overwegende, dat Verordening (EEG) nr. 1999/85 van de Raad van de Europese Gemeenschappen van 16 juli 1985
    betreffende de regeling actieve veredeling (PbEG no. L 188) nationale uitvoering behoeft;

    Gelet op artikel 13 van het In- en uitvoerbesluit landbouwgoederen 1980 (Stb. 758);

    Mede gelet op artikel 11 van de In- en uitvoerwet (Stb. 1962, 295);

    In overeenstemming met de staatssecretaris van Financiën,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling zijn de begripsomschrijvingen van de [Regeling in- en uitvoer landbouwgoederen][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003381
  - number: '2'
    text: |-
      Terzake van actief veredelingsverkeer wordt vrijstelling verleend van de heffingen bij in- of uitvoer bedoeld in
      de [Regeling in- en uitvoer landbouwgoederen][ref1] voor zover de heffing verschuldigd is terzake van de invoer van
      goederen uit een land of gebied dat geen deel uitmaakt van de Europese Gemeenschappen, en in de [artikelen 2][ref2]
      en [3, tweede lid, van de Compensatiebeschikking toetreding Spanje en Portugal][ref3] (Stcrt. 1986, 52).


      [ref1]: https://wetten.overheid.nl/BWBR0003381
      [ref2]: https://wetten.overheid.nl/BWBR0003928#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003928#Artikel3
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003381
      - id: ref2
        bwb_id: BWBR0003928
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003928
        artikel: '3'
  - number: '3'
    text: |-
      1 Met betrekking tot de goederen die vallen onder de basisverordeningen genoemd in kolom 1 van
      [bijlage 1 van de Regeling in- en uitvoer landbouwgoederen][ref1] met uitzondering van de goederen die vallen onder
      de basisverordeningen in kolom 1 van de horizontale balken 1-1, VIa, VIb en VIc alsmede VIIa, is het produktschap
      belast met de uitvoering van het actief veredelingsverkeer op de voet van het bepaalde in deze regeling.

      2 Met betrekking tot de goederen die vallen onder de basisverordeningen genoemd in kolom 1 van de horizontale
      balken I-1, Va, VIb en VIc alsmede VIIa van [bijlage I van de Regeling in- en uitvoer landbouwgoederen][ref2] is de
      Belastingdienst belast met de uitvoering van het actief veredelingsverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0003381
      [ref2]: https://wetten.overheid.nl/BWBR0003381
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003381
      - id: ref2
        bwb_id: BWBR0003381
  - number: '4'
    text: |-
      De vrijstelling geldt onder de voorwaarde dat zij vervalt, voor zover de veredelingsprodukten niet binnen een door
      het produktschap gestelde termijn een bestemming als bedoeld in [artikel 8][ref1] hebben gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004088#Artikel8
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004088
        artikel: '8'
  - number: '5'
    text: |-
      1 De vrijstelling geldt voor personen aan wie het produktschap vergunning tot actief veredelingsverkeer heeft
      verleend.

      2 De vergunning wordt slechts verleend op een daartoe ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0004088/2000-01-20#Artikel5
  - number: '6'
    text: |-
      1 Het produktschap verleent slechts een vergunning tot actief veredelingsverkeer aan personen, die tegenover het
      produktschap schriftelijk hebben verklaard:

      a. veredelingshandelingen te verrichten of te laten verrichten met inachtneming en onder de voorwaarden van het
      Communautair douanewetboek;

      b. aan het regionaal inspectiekantoor van de Algemene inspectiedienst van het ministerie van Landbouw, Natuurbeheer
      en Visserij waaronder het bedrijf ressorteert, schriftelijk te melden wanneer de betrokken goederen op het bedrijf
      worden aangevoerd onderscheidenlijk verwerkt;

      c. zich met betrekking tot de inrichting van de administratie en de melding van de betrokken ingevoerde goederen
      aan de Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer en Visserij te zullen gedragen naar
      de aanwijzingen, die dienaangaande door de Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer
      en Visserij dan wel door het produktschap in het belang van een goede uitvoering van deze regeling zullen worden
      gegeven;

      d. voor veredelingsprodukten, waarvoor forfaitaire opbrengstpercentages zijn vastgesteld, binnen een termijn van
      14 dagen na afloop van de in [artikel 4][ref1] bedoelde termijn en voor de overige veredelingsprodukten maandelijks
      aan het produktschap een schriftelijke opgave te verstrekken, overeenkomstig de aanwijzingen die dienaangaande door
      het produktschap dan wel door de Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer en Visserij
      zijn gegeven:

        - van de hoeveelheden ingevoerde en be- of verwerkte invoergoederen;
        - de daaruit of daardoor verkregen hoeveelheden veredelingsprodukten, resten en afvallen;
        - de hoeveelheden veredelingsprodukten, resten en afvallen met hun onderscheidenlijke bestemmingen als bedoeld
      in [artikel 8][ref2];

      e. toe te laten dat door de Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer en Visserij
      dan wel door het produktschap, indien zulks aan deze instantie of instanties nodig voorkomt, wordt overgegaan
      tot controle op de naleving van hetgeen bij of krachtens deze regeling is bepaald en daartoe in het bijzonder aan
      de ambtenaren van de voornoemde Inspectiedienst alsmede aan de door het produktschap gemachtigde personen op hun
      verzoek toegang te verlenen tot de bedrijfsgebouwen, hun inzage te geven van alle bescheiden die betrekking hebben
      op de invoer, aanvoer op het bedrijf, be- of verwerking, afvoer van het bedrijf en de uiteindelijke bestemming als
      bedoeld in [artikel 8][ref3] van de zich in het actief veredelingsverkeer bevindende goederen en hun deze goederen,
      voor zover nog geen wederuitvoer heeft plaatsgevonden, hetzij in ongewijzigde staat, hetzij in de vorm van tijdens
      de be- of verwerking verkregen goederen, te zullen tonen en te zullen toelaten, dat zij daarvan monsters nemen;

      f. ervoor in te staan dat ingeval zij de veredelingshandelingen laten verrichten, ook de veredelaars aan het
      gestelde in de onderdelen a, c, voor zover het de inrichting van de administratie betreft, en e voldoen;

      g. in voorkomend geval, indien een volledige compensatie niet of niet tijdig plaatsvindt, dan wel een identificatie
      niet mogelijk is, zorg te dragen voor een stipte betaling van de verschuldigde heffingen alsmede van de ingevolge
      het Communautair douanewetboek verschuldigde compenserende intresten.

      2 Het produktschap kan voorts voorschriften aan de vergunning verbinden.

      3 De vergunning kan worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004088#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004088#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004088#Artikel8
