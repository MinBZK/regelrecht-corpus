preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om met het oog op de bescherming van klokkenluiders
    rechtsbescherming te regelen, een Huis voor klokkenluiders op te richten en dat het noodzakelijk is daartoe
    wettelijke bepalingen vast te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *afdeling advies:* de afdeling advies van het Huis, bedoeld in [artikel 3a, tweede lid][ref1];
        - *afdeling onderzoek:* de afdeling onderzoek van het Huis, bedoeld in [artikel 3a, derde lid][ref2];
        - *bedrijfsgeheim:* bedrijfsgeheim als bedoeld in [artikel 1 van de Wet bescherming bedrijfsgeheimen][ref3];
        - *betrokken derde:* a. een derde die verbonden is met een melder en die kan worden benadeeld door de werkgever
      van de melder of een persoon of organisatie waarmee de melder anderszins in een werkgerelateerde context verbonden
      is, en b. een rechtspersoon die eigendom is van de melder, waarvoor de melder werkt of waarmee de melder anderszins
      werkgerelateerd verbonden is;
        - *bevoegde autoriteit:* een autoriteit als bedoeld in [artikel 2c][ref4];
        - *bureau:* het bureau, bedoeld in [artikel 3d][ref5];
        - *degene die een melder bijstaat:* een natuurlijke persoon of rechtspersoon die een melder adviseert in het
      meldingsproces in een werkgerelateerde context en wiens advisering vertrouwelijk is;
        - *Huis:* het Huis voor klokkenluiders, bedoeld in [artikel 3][ref6];
        - *melder:* een natuurlijke persoon die in de context van zijn werkgerelateerde activiteiten een vermoeden van een
      misstand meldt of openbaar maakt;
        - *melding:* melding van een vermoeden van een misstand;
        - *meldkanaal:* organisatie en procedure bij een bevoegde autoriteit voor het ontvangen en in behandeling nemen
      van meldingen;
        - *misstand:* a. een schending of een gevaar voor schending van het Unierecht, of b. een handeling of nalatigheid
      waarbij het maatschappelijk belang in het geding is bij: 1°. een schending of een gevaar voor schending van
      een wettelijk voorschrift of van interne regels die een concrete verplichting inhouden en die op grond van een
      wettelijk voorschrift door een werkgever zijn vastgesteld, dan wel 2°. een gevaar voor de volksgezondheid, voor de
      veiligheid van personen, voor de aantasting van het milieu of voor het goed functioneren van de openbare dienst of
      een onderneming als gevolg van een onbehoorlijke wijze van handelen of nalaten. Het maatschappelijk belang is in
      ieder geval in het geding indien de handeling of nalatigheid niet enkel persoonlijke belangen raakt en er sprake is
      van oftewel een patroon of structureel karakter dan wel de handeling of nalatigheid ernstig of omvangrijk is;.
        - *Onze Minister:* Onze Minister van Binnenlandse zaken en Koninkrijksrelaties;
        - *Onze Minister wie het aangaat:* Onze Minister die verantwoordelijk is voor de bevoegde autoriteit;
        - *opvolging:* optreden van een werkgever of van een bevoegde autoriteit om de juistheid van de gedane beweringen
      van de melder na te gaan en zo nodig en voor zover bevoegd nader onderzoek te doen of maatregelen te treffen;
        - *richtlijn:* [Richtlijn (EU) 2019/1937](32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019
      (PbEU 2019, L 305);
        - *schending van het Unierecht:* handeling of nalatigheid die: a. onrechtmatig is en betrekking heeft
      op Uniehandelingen en beleidsterreinen die binnen het in artikel 2 van de richtlijn bedoelde materiële
      toepassingsgebied vallen, of b. het doel of de toepassing ondermijnt van de regels in de Uniehandelingen en
      beleidsterreinen die binnen artikel 2 van de richtlijn bedoelde materiële toepassingsgebied vallen;
        - *vermoeden van een misstand:* het vermoeden van een melder dat binnen de organisatie waarin hij werkt of heeft
      gewerkt of bij een andere organisatie indien hij door zijn werkzaamheden met die organisatie in aanraking is
      gekomen, sprake is van een misstand voor zover het vermoeden gebaseerd is op redelijke gronden, die voortvloeien
      uit de kennis die de melder bij zijn werkgever heeft opgedaan of voortvloeien uit de kennis die de melder heeft
      gekregen door zijn werkzaamheden bij een ander bedrijf of een andere organisatie;
        - *verzoeker:* de melder die de afdeling onderzoek verzoekt een onderzoek in te stellen;
        - *werkgerelateerde context:* toekomstige, huidige of vroegere werkgerelateerde activiteiten in de publieke
      of private sector waardoor, ongeacht de aard van die werkzaamheden, personen informatie kunnen verkrijgen over
      misstanden en waarbij die personen te maken kunnen krijgen met benadeling als bedoeld in [artikel 17da][ref7],
      indien zij dergelijke informatie zouden melden;
        - *werkgever:* degene die krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke aanstelling
      arbeid laat verrichten of heeft laten verrichten dan wel degene die anders dan uit dienstbetrekking arbeid laat
      verrichten of heeft laten verrichten.
        - *werknemer:* degene die krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke aanstelling
      arbeid verricht dan wel degene die anderszins in een ondergeschiktheidsrelatie tegen een vergoeding arbeid
      verricht.


