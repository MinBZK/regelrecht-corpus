  - number: '6'
    text: |-
      1 Onverminderd [artikel 2e][ref1], stelt de afdeling onderzoek binnen zes weken na de dagtekening van het verzoek
      een onderzoek in, tenzij de afdeling onderzoek oordeelt dat:

      a. het verzoek niet voldoet aan de vereisten, bedoeld in [artikel 5][ref2];

      b. het verzoek kennelijk ongegrond is;

      c. het maatschappelijk belang bij een onderzoek door de afdeling onderzoek, dan wel de ernst van de misstand,
      kennelijk onvoldoende is;

      d. het vermoeden van de misstand ter beoordeling staat van bestuursorganen of diensten die zijn belast met de
      opsporing van strafbare feiten of met het toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk
      voorschrift of een andere daartoe bevoegde instantie waar het vermoeden van een misstand kan worden gemeld en
      het bestuursorgaan, de dienst of de andere daartoe bevoegde instantie het vermoeden van een misstand naar behoren
      behandelt of heeft behandeld;

      e. de verzoeker het vermoeden van een misstand heeft gemeld aan een leidinggevende, een vertrouwenspersoon of een
      andere in een interne procedure als bedoeld in [artikel 2][ref3] aangewezen persoon van de organisatie waarbinnen
      sprake is van de vermoedelijke misstand en de organisatie het vermoeden naar behoren heeft behandeld;

      f. er een ander verzoek, dezelfde misstand betreffende, bij de afdeling onderzoek in behandeling is of door de
      afdeling onderzoek is afgedaan, behoudens indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en
      zulks tot een ander oordeel over de bedoelde misstand zou hebben kunnen leiden; of

      g. bij onherroepelijke rechterlijke uitspraak reeds over de misstand is geoordeeld.

      2 Indien de afdeling onderzoek geen onderzoek instelt, worden de resultaten van het oordeel, bedoeld in het eerste
      lid, niet openbaar gemaakt.

      3 De afdeling onderzoek is niet verplicht een onderzoek voort te zetten indien:

      a. de verzoeker naar het oordeel van de afdeling onderzoek onvoldoende meewerkt aan een zorgvuldig verloop van het
      onderzoek en het bewaren van de vertrouwelijkheid van uitkomsten van het onderzoek, of

      b. een nieuw feit of een nieuwe omstandigheid bekend wordt, op grond waarvan de afdeling onderzoek tot het oordeel
      komt dat het verzoek kennelijk ongegrond is.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037852#Artikel2
