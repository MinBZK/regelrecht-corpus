      Bij benadeling van een melder tijdens en na de behandeling van een melding bij de werkgever, een bevoegde
      autoriteit of een bestuursorgaan, dienst of andere bevoegde instantie als bedoeld in [artikel 2j][ref1], dan wel na
      openbaarmaking van een vermoeden van een misstand, wordt vermoed dat de benadeling het gevolg is van de melding dan
