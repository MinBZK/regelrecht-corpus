  - number: 2a
    text: |-
      1 Een werkgever als bedoeld in [artikel 2][ref1] registreert een melding bij de ontvangst ervan in een daarvoor
      ingericht register.

      2 De gegevens van een melding in het register worden vernietigd indien zij niet langer noodzakelijk zijn om te
      voldoen aan de eisen van deze wet of andere bij of krachtens wet of Unierecht vastgestelde eisen.

      3 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan het register, bedoeld in het eerste lid, en de
      gegevens die daarin worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2
