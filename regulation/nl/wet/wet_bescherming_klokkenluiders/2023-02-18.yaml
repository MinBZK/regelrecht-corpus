        artikel: '5.1'
  - number: 17a
    text: |-
      1 Ter bevordering van de coördinatie en het overleg maken het Huis en het College van procureurs-generaal binnen
      een half jaar na de inwerkingtreding van de wet, afspraken over de samenwerking en informatie-uitwisseling. Het
      betreft in ieder geval afspraken over de gevallen waarin zowel de afdeling onderzoek een onderzoek instelt naar een
      vermoeden van een misstand als het openbaar ministerie een opsporingsonderzoek instelt naar een strafbaar feit ten
      aanzien van hetzelfde voorval. De afspraken behoeven de goedkeuring van Onze Minister van Veiligheid en Justitie.

      2 De afspraken over samenwerking en informatie-uitwisseling worden neergelegd in een samenwerkingsprotocol.

      3 Indien in een concreet geval zowel de afdeling onderzoek een onderzoek instelt naar een vermoeden van een
      misstand als het openbaar ministerie opsporingsonderzoek instelt naar een strafbaar feit, plegen de afdeling
      onderzoek en het openbaar ministerie, met inachtneming van het samenwerkingsprotocol, overleg over de inrichting
      van beide onderzoeken.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17a
  - number: 17b
    text: |-
      1 Ter bevordering van coördinatie en overleg kan het Huis samenwerkingsprotocollen afsluiten met bevoegde
      autoriteiten en andere bestuursorganen of diensten die zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens enig wettelijk voorschrift. [Artikel 17a, derde lid][ref1], is van overeenkomstige toepassing.

      2 Het Huis, een bevoegde autoriteit en een bestuursorgaan of dienst als bedoeld in het eerste lid zijn bevoegd
      uit eigen beweging en desgevraagd aan elkaar persoonsgegevens te verstrekken indien dit noodzakelijk is voor de
      beoordeling of opvolging van een melding waar zij bij betrokken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel17a
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17b
