  - number: 3a
    text: |-
      1 Het Huis kent een afdeling advies en een afdeling onderzoek.

      2 De afdeling advies heeft tot taak:

      a. het informeren en adviseren van een natuurlijke persoon die in de context van zijn werkgerelateerde activiteiten
      een melding heeft gedaan of voornemens is een melding te doen, degene die deze persoon bijstaat en een betrokken
      derde over de te ondernemen stappen inzake een vermoeden van een misstand, alsmede over de rechten van deze
      personen;

      b. het verwijzen naar bestuursorganen of diensten die zijn belast met de opsporing van strafbare feiten of met
      het toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk voorschrift of een andere bevoegde
      instantie waar het vermoeden van een misstand kan worden gemeld;

      c. het verwijzen naar instanties of organisaties die juridische of psychosociale ondersteuning kunnen verlenen, en

      d. het geven van algemene voorlichting over het omgaan met een vermoeden van een misstand.

      3 De afdeling onderzoek heeft tot taak:

      a. het beoordelen of het verzoek in behandeling kan worden genomen met inachtneming van de voorwaarden, bedoeld in
      [artikel 6, eerste lid][ref1];

      b. het op basis van een verzoek instellen van een onderzoek naar:

      1°. het vermoeden van een misstand;

      2°. de wijze waarop de werkgever zich jegens de melder heeft gedragen naar aanleiding van een melding;

      c. het instellen van een onderzoek naar het vermoeden van een misstand naar aanleiding van een of meerdere
      adviesaanvragen, met inachtneming van [artikel 3k, derde lid][ref2], en [artikel 6, eerste lid][ref3]; en

      d. het formuleren van algemene aanbevelingen over het omgaan met een vermoeden van een misstand.

      e.

      4 Onverminderd het tweede en derde lid, heeft het Huis tot taak kennis te bevorderen met het oog op een
      organisatiecultuur waarin meldingen van vermoedens van misstanden in een werkgerelateerde context op een
      zorgvuldige en doelmatige wijze worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel3k
      [ref3]: https://wetten.overheid.nl/BWBR0037852#Artikel6
