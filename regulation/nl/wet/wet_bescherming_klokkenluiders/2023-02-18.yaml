      1 Een verzoek als bedoeld in [artikel 4, eerste lid, onder a][ref1], wordt overeenkomstig
      [artikel 2d, tweede lid][ref2], door de verzoeker of diens gemachtigde ingediend en wordt ondertekend ingeval het
      verzoek op schrift is gesteld. Het verzoek bevat ten minste:

      a. de naam en het adres van de verzoeker of van de vertrouwenspersoon of de advocaat die namens een melder wiens
      identiteitsgegevens niet bekend worden gemaakt het verzoek indient;

      b. de dagtekening;

      c. een omschrijving van de misstand die wordt vermoed, waaronder de naam van de werkgever tegen wie het vermoeden
      zich richt, en

      d. de gronden waarop het vermoeden van een misstand is gebaseerd.

      2 [Artikel 9:28, tweede en derde lid, van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing op
      het verzoek.


