    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming,
      is het verbod om bijzondere categorieën van persoonsgegevens als bedoeld in
      [paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] te verwerken niet van toepassing
      indien de verwerking geschiedt door het Huis en de verwerking noodzakelijk is voor de uitvoering van de taken,
      bedoeld in [artikel 3a, tweede lid, onderdelen a tot en met c, en derde lid, onderdelen a tot en met c][ref2], en
      [artikel 17b, tweede lid][ref3], onder voorwaarde dat bij die uitvoering is voorzien in zodanige waarborgen dat de
      persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad.

      2 Gelet op artikel 10 van de Algemene verordening gegevensbescherming
      mag het Huis persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4] verwerken, indien de
      verwerking noodzakelijk is voor de taken, bedoeld in het eerste lid.


