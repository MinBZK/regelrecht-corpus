  - number: 3k
    text: |-
      1 Een natuurlijke persoon die in de context van zijn werkgerelateerde activiteiten een melding heeft gedaan of
      voornemens is een melding te doen, degene die deze persoon bijstaat en een betrokken derde kunnen de afdeling
      advies verzoeken om informatie en advies inzake het vermoeden van een misstand. De adviesaanvraag is vormvrij.

      2 Informatie en advies kunnen zowel in mondelinge als in schriftelijke vorm gegeven worden. De keuze ten aanzien
      van de vorm van de informatie of het advies is voorbehouden aan de afdeling advies.

      3 De in een adviesaanvraag verstrekte informatie over een vermoeden van een misstand en het advies worden door de
      afdeling advies niet verstrekt aan de afdeling onderzoek, tenzij de melder schriftelijk verklaart daar geen bezwaar
      tegen te hebben.

      4 Bij het Huis berustende informatie over het advies is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel3k
  - number: '4'
    text: |-
      1 Een melder kan bij de afdeling onderzoek:

      a. een vermoeden van een misstand melden ten behoeve van een onderzoek, of

      b. verzoeken om een onderzoek in te stellen naar de wijze waarop de werkgever zich jegens hem heeft gedragen naar
      aanleiding van een melding.

      2 Dit artikel is niet van toepassing op:

      a. rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 4°, van de Wet op de rechterlijke organisatie][ref1];

      b. een ieder die betrokken is of is geweest bij de uitvoering van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2] en de [Wet veiligheidsonderzoeken][ref3], voor zover
      het de uitvoering van deze wetten betreft.


