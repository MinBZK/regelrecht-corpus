  - number: 17f
    text: |-
      1 Onverminderd het bij of krachtens de wet bepaalde met betrekking tot de bescherming van de nationale veiligheid,
      het beroepsgeheim van advocaten, het medisch beroepsgeheim, de geheimhouding van rechterlijke beraadslagingen en
      het strafprocesrecht, is een melder ingeval van een melding of openbaarmaking van een vermoeden van een misstand
      niet aansprakelijk voor een inbreuk op enige beperking van de openbaarmaking van informatie, indien:

      a. hij redelijke gronden heeft om aan te nemen dat de melding of openbaarmaking van de informatie noodzakelijk is
      voor de onthulling van de misstand, en

      b. de melding of openbaarmaking overeenkomstig de voorwaarden in deze wet is gedaan.

      2 Een melder is, indien hij voldoet aan de voorwaarden, bedoeld in het eerste lid, niet aansprakelijk voor het
      verwerven van of de toegang tot informatie die in de melding is opgenomen of die openbaar wordt gemaakt, tenzij het
      verwerven van of de toegang tot die informatie strafbaar is gesteld.

      3 De bewijslast dat niet voldaan is aan de voorwaarden, bedoeld in het eerste en tweede lid, berust bij degene die
      de melder aansprakelijk heeft gesteld.

      4 [Artikel 3, tweede lid, van de Wet bescherming bedrijfsgeheimen][ref1] is van toepassing op een melding of
      openbaarmaking in de zin van deze wet.

      5 Het eerste tot en met vierde lid is van overeenkomstige toepassing op degene die een melder bijstaat en een
      betrokken derde.


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel3
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '3'
  - number: 17g
    text: |-
      Een bevoegde autoriteit en een bestuursorgaan, dienst of een bevoegde instantie als bedoeld in [artikel 2j][ref1]
      verstrekt aan een melder de bewijsstukken en documenten om in een procedure waarbij rechtsbescherming wordt gezocht
      te kunnen aantonen dat een melding van een vermoeden van een misstand is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2j
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 2j
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 17h
    text: |-
      1 Elk beding is nietig voor zover dat het recht beperkt of ontneemt om met inachtneming van het bepaalde in deze
      wet een vermoeden van een misstand te melden of openbaar te maken.

      2 Het eerste lid is niet van toepassing:

      a. voor zover het beding is overeengekomen ter uitvoering van een daartoe strekkend wettelijk voorschrift;

      b. op bedingen die overeengekomen zijn voorafgaand aan het tijdstip van inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17h
  - number: '20'
    text: |-
      1 Onze Minister zendt binnen drie jaar na het tijdstip van inwerkingtreding van de Wet tot wijziging van de Wet
      Huis voor klokkenluiders en enige andere wetten ter implementatie van [Richtlijn (EU) 2019/1937](32019L1937) van
      het Europees Parlement en de Raad van 23 oktober 2019 (PbEU 2019, L 305) en enige andere wijzigingen, en vervolgens
      elke drie jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de
      praktijk.

      2 Het Huis en bevoegde autoriteiten en werkgevers als bedoeld in deze wet verlenen medewerking aan het verslag,
      bedoeld in het eerste lid, en verschaffen Onze Minister de daartoe benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel20
  - number: '21'
    text: |-
      De afdeling onderzoek is niet verplicht een onderzoek in te stellen indien de verzoeker meer dan een jaar voor
      het tijdstip van inwerkingtreding van deze wet een melding van een vermoeden van een misstand heeft gedaan bij de
      werkgever of de daartoe bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel21
  - number: 21a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de inrichting van het
      Huis.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel21a
  - number: 21b
    text: |-
      1 De [artikelen 1a][ref1], [2a][ref2], [2b][ref3], [2d, tweede lid][ref4], [2e][ref5], [2f][ref6], [2j][ref7],
      [2k][ref8], 5a, [17b][ref9], [17e][ref10], [17ea][ref11], [17eb][ref12], [17ec][ref13], [17f][ref14] en
      [17g][ref15] zijn niet van toepassing op:

      a. een melding van een schending van het Unierecht bij een werkgever die onderdeel uitmaakt van de publieke sector
      als bedoeld in [artikel 9][ref16] of een bevoegde autoriteit, die is gedaan voor 17 december 2021, en

      b. een melding, niet zijnde een melding als bedoeld in onderdeel a, die is gedaan voor de inwerkingtreding van de
      wet van 25 januari 2023 tot wijziging van de Wet Huis voor klokkenluiders en enige andere wetten ter implementatie
      van [Richtlijn (EU) 2019/1937](32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019 (PbEU 2019,
      L 305) en enige andere wijzigingen.

      2 De [artikelen 2, tweede lid, onderdeel d][ref17], [3i][ref18], [3j][ref19] en
      [6, eerste lid, onderdeel e, van deze wet][ref20], [artikel 658c van Boek 7 van het Burgerlijk Wetboek][ref21],
      de [artikelen 12quater, tweede lid][ref22], en [12o, vijfde lid, van de Wet ambtenaren defensie][ref23] en
      [artikel 47, tweede lid, van de Politiewet 2012][ref24] zoals die artikelen luidden op de dag voor inwerkingtreding
      van de wet van 25 januari 2023 tot wijziging van de Wet Huis voor klokkenluiders en enige andere wetten ter
      implementatie van [Richtlijn (EU) 2019/1937](32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019
      (PbEU 2019, L 305) en enige andere wijzigingen, blijven van toepassing op:

      a. een melding van een schending van het Unierecht bij een werkgever die onderdeel uitmaakt van de publieke sector
      als bedoeld in [artikel 9][ref25] of een bevoegde autoriteit, die is gedaan voor 17 december 2021, en

      b. een melding, niet zijnde een melding als bedoeld in onderdeel a, die is gedaan voor de inwerkingtreding van de
      wet van 25 januari 2023 tot wijziging van de Wet Huis voor klokkenluiders en enige andere wetten ter implementatie
      van [Richtlijn (EU) 2019/1937](32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019 (PbEU 2019,
      L 305) en enige andere wijzigingen.


