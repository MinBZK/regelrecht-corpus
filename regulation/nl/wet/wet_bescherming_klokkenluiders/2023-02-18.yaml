        artikel: 17a
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 17c
    text: |-
      Het Huis zendt jaarlijks aan beide kamers der Staten-Generaal een overzicht van de aanbevelingen van het Huis en
      van de wijze waarop aan de aanbevelingen vervolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17c
  - number: 17d
    text: |-
      De afdeling onderzoek is bevoegd een onderzoek in te stellen naar de stand van zaken met betrekking tot de
      uitvoering van aanbevelingen die in eerder onderzoek zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17d
  - number: 17da
    text: |-
      1 In dit hoofdstuk wordt in ieder geval onder benadeling verstaan:

      a. ontslag of schorsing;

      b. een boete als bedoeld in [artikel 650 van Boek 7 van het Burgerlijk Wetboek][ref1];

      c. demotie;

      d. het onthouden van bevordering;

      e. een negatieve beoordeling;

      f. een schriftelijke berisping;

      g. overplaatsing naar een andere vestiging;

      h. discriminatie;

      i. intimidatie, pesterijen of uitsluiting;

      j. smaad of laster;

      k. voortijdige beëindiging van een overeenkomst voor het leveren van goederen of diensten, en

      l. intrekking van een vergunning.

      2 Onder benadeling wordt tevens verstaan een dreiging met en een poging tot benadeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel650
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17da
