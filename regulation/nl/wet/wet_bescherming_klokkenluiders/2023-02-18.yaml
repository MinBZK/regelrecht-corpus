  - number: 2e
    text: |-
      1 Een bevoegde autoriteit draagt er zorg voor dat na een melding zorgvuldig wordt beoordeeld of opvolging wordt
      gegeven aan de melding.

      2 De melder wordt na een melding door de bevoegde autoriteit:

      a. onverwijld en in ieder geval binnen zeven dagen na ontvangst van de melding een ontvangstbevestiging
      toegestuurd, tenzij de melder uitdrukkelijk anders verzoekt of de bevoegde autoriteit op redelijke gronden oordeelt
      dat de ontvangstbevestiging de identiteit van de melder in gevaar brengt;

      b. binnen drie maanden na ontvangst van de melding geïnformeerd over de beoordeling en voor zover van toepassing
      de opvolging van de melding, tenzij die informatie het onderzoek of de gerechtelijke procedure in gevaar zou kunnen
      brengen of in strijd is met een wettelijke geheimhoudingsplicht, welke termijn eenmaal, mits voldoende gemotiveerd,
      met drie maanden kan worden verlengd, en

      c. in kennis gesteld van de uitkomst van het onderzoek, tenzij die informatie het onderzoek of de gerechtelijke
      procedure in gevaar zou kunnen brengen of in strijd is met een wettelijke geheimhoudingsplicht.

      3 Indien de bevoegde autoriteit van oordeel is dat kennisgeving van de informatie, bedoeld in het tweede lid,
      onderdelen b en c, het onderzoek of de gerechtelijke procedure in gevaar kan brengen, wordt de melder daarvan
      tijdig in kennis gesteld.

      4 Ingeval een bevoegde autoriteit een melding heeft ontvangen waarvoor zij niet bevoegd is, zendt zij de melding,
      mits de melder daaraan zijn voorafgaande instemming heeft verleend, onverwijld en op veilige wijze door naar de
      bevoegde autoriteit die bevoegd is. Indien de melder geen instemming verleent, wijst de bevoegde autoriteit de
      melder er uitdrukkelijk op dat bij niet doorzenden de melding niet in behandeling wordt genomen.

      5 Ingeval een andere bevoegde autoriteit of instantie, dan wel een orgaan of instantie van de Europese Unie
      bevoegd is tot verder onderzoek geeft een bevoegde autoriteit de voor dat onderzoek noodzakelijke informatie naar
      aanleiding van de melding binnen een redelijke termijn door aan die autoriteit of instantie.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2e
  - number: 2f
    text: |-
      1 Een bevoegde autoriteit kan oordelen dat geen opvolging wordt gegeven aan een melding indien:

      a. de schending van het Unierecht van geringe betekenis is, dan wel het maatschappelijk belang bij het onderzoek
      naar of de ernst van de misstand kennelijk onvoldoende is, of

      b. de melding dezelfde misstand betreft als bij de bevoegde autoriteit in behandeling is of door de bevoegde
      autoriteit is afgedaan, tenzij een nieuw feit of een nieuwe omstandigheid bekend is geworden en dat tot een ander
      oordeel over de misstand kan leiden.

      2 Indien een bevoegde autoriteit op grond van het eerste lid geen opvolging geeft aan een melding, deelt de
      bevoegde autoriteit dit onder vermelding van de redenen zo spoedig mogelijk aan de melder mede, behoudens voor
      zover dit in strijd met een wettelijke geheimhoudingsplicht is.

      3 Een bevoegde autoriteit kan bij grote aantallen meldingen voorrang geven aan de behandeling van meldingen
      van ernstige misstanden, dan wel van inbreuken op essentiële bepalingen die binnen het toepassingsgebied
      van de richtlijn vallen. De melder wordt hiervan in kennis gesteld binnen de termijn, bedoeld in
      [artikel 2e, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2e
