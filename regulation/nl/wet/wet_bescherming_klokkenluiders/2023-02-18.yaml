  - number: 2b
    text: |-
      1 Indien voor een melding een telefoonlijn of een ander spraakberichtsysteem wordt gebruikt of een melder een
      melding doet in een gesprek op een afgesproken locatie, registreert de werkgever de melding door:

      a. het maken van een opname van het gesprek in een duurzame en opvraagbare vorm, of

      b. een volledige en nauwkeurige schriftelijke weergave van het gesprek.

      2 Voor de opname van een gesprek, bedoeld in het eerste lid, onderdeel a, is voorafgaand instemming van de melder
      vereist.

      3 De melder krijgt de gelegenheid om de schriftelijke weergave van een gesprek, bedoeld in het eerste lid,
      onderdeel b, te controleren, te corrigeren en voor akkoord te tekenen.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2b
  - number: 2ba
    text: |-
      De [artikelen 2 tot en met 2b][ref1] zijn van overeenkomstige toepassing op het melden van een vermoeden van een
      misstand binnen het Huis.


