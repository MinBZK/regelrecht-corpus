  - number: '2'
    text: |-
      1 De werkgever bij wie in de regel ten minste vijftig werknemers werkzaam zijn, stelt voor hen een procedure vast
      voor het melden van een vermoeden van een misstand binnen zijn organisatie.

      2 In de procedure, bedoeld in het eerste lid, wordt in ieder geval:

      a. de wijze waarop met de interne melding wordt omgegaan vastgelegd;

      b. omschreven wanneer sprake is van een vermoeden van een misstand met inachtneming van de definitie van een
      vermoeden van een misstand als bedoeld in deze wet;

      c. vastgelegd dat een werknemer in ieder geval op de volgende wijze een melding kan doen:

      1°. schriftelijk;

      2°. mondeling via de telefoon of andere spraakberichtsystemen, of

      3°. op zijn verzoek binnen een redelijke termijn door middel van een gesprek op een locatie;

      d. vastgelegd bij welke daartoe aangewezen onafhankelijke functionaris of functionarissen het vermoeden van een
      misstand kan worden gemeld, en welke onafhankelijke functionarissen zorgvuldige opvolging kunnen geven aan die
      melding;

      e.

      f.

      g. vastgelegd dat de werknemer de mogelijkheid heeft om een adviseur in vertrouwen te raadplegen over een vermoeden
      van een misstand;

      h. vastgelegd dat een melder binnen zeven dagen na ontvangst van een melding een ontvangstbevestiging krijgt;

      i. een redelijke termijn vastgelegd van ten hoogste drie maanden na verzending van de ontvangstbevestiging,
      bedoeld in onderdeel h, waarbinnen aan de melder informatie wordt verstrekt over de beoordeling en voor zover van
      toepassing de opvolging van de melding.

      3 In afwijking van het eerste lid, geldt de daarin neergelegde grens van vijftig werknemers niet voor een werkgever
      die valt onder het toepassingsgebied van de in de delen I.B en II van de bijlage van de richtlijn genoemde
      Uniehandelingen.

      4 Voor het in ontvangst nemen van een melding, alsmede voor het uitvoeren van onderzoeken daarnaar, mogen middelen
      worden gedeeld door:

      a. werkgevers in de private sector met 50 tot 249 werknemers, en

      b. gemeenten of openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1].

      5 De werkgever stelt aan zijn werknemers op schriftelijke of elektronische wijze informatie beschikbaar over:

      a. de procedure, bedoeld in het eerste lid;

      b. de wijze waarop een vermoeden van een misstand buiten de organisatie kan worden gemeld aan bevoegde autoriteiten
      en voor zover van toepassing aan instellingen, organen en instanties van de Europese Unie, en

      c. de rechtsbescherming van een werknemer bij het melden van een vermoeden van een misstand.

      6 De procedure, bedoeld in het eerste lid, kan door een werkgever tevens worden opengesteld voor personen die geen
      werknemer zijn, maar anderszins werkgerelateerde activiteiten verrichten of hebben verricht, en stelt in dat geval
      de informatie, bedoeld in het vijfde lid, eveneens aan die personen beschikbaar.

      7 Een werkgever als bedoeld in het eerste of derde lid, die geen ondernemingsraad of personeelsvertegenwoordiging
      heeft ingesteld, en daartoe ook niet verplicht is, behoeft bij de vaststelling van de procedure, bedoeld in het
      eerste lid, de instemming van meer dan de helft van de werknemers. Deze instemming is niet vereist voor zover de
      procedure inhoudelijk is geregeld in een collectieve arbeidsovereenkomst.

      8 Iedere belanghebbende werknemer kan de kantonrechter verzoeken te bepalen dat de werkgever binnen een door de
      kantonrechter te bepalen termijn een procedure als bedoeld in het eerste lid, vaststelt.


