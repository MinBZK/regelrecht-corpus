  - number: '7'
    text: |-
      1 Indien de afdeling onderzoek geen onderzoek instelt of dit niet voortzet, deelt de afdeling dit onder vermelding
      van de redenen zo spoedig mogelijk schriftelijk aan de verzoeker mede.

      2 In het geval dat de afdeling onderzoek een onderzoek niet voortzet, doet hij de in het eerste lid bedoelde
      mededeling tevens aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel7
  - number: '8'
    text: |-
      1 De afdeling onderzoek streeft ernaar het onderzoek binnen een jaar na afronding van het oordeel, bedoeld in
      [artikel 6, eerste lid][ref1], af te ronden.

      2 De afdeling onderzoek kan naar aanleiding van het door hem verrichte onderzoek aan de werkgever aanbevelingen
      doen.

      3 Een oordeel of aanbeveling behelst geen vaststelling van civielrechtelijke aansprakelijkheid in verband met een
      misstand, noch een vermoeden van schuld aan enig strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel6
