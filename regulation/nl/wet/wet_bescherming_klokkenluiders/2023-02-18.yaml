      Deze paragraaf is van overeenkomstige toepassing op een bestuursorgaan, een dienst of andere bevoegde instantie,
      niet zijnde een bevoegde autoriteit, die op grond van een bij of krachtens de wet of in mandaat toegekende taak of
      bevoegdheid een melding van een schending van het Unierecht ontvangt.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2j
  - number: 2k
    text: |-
      1 Een bestuursorgaan, dienst of instantie, die op grond van een bij of krachtens de wet toegekende taak of
      bevoegdheid onderzoek doet naar een vermoeden van een misstand, zorgt dat een melder binnen een door het
      bestuursorgaan, de dienst of instantie bekend gemaakte redelijke termijn wordt geïnformeerd over de beoordeling
      en voor zover van toepassing de opvolging van zijn melding, tenzij die informatie het onderzoek of een
      daarmee samenhangende gerechtelijke procedure in gevaar zou kunnen brengen of in strijd is met een wettelijke
      geheimhoudingsplicht.

      2 Indien het bestuursorgaan, de dienst of de instantie van oordeel is dat informatie over de voortgang van het
      onderzoek, het onderzoek of een daarmee samenhangende gerechtelijke procedure in gevaar kan brengen, wordt de
      melder daarvan tijdig in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2k
  - number: '3'
    text: |-
      1 Er is een Huis voor klokkenluiders.

      2 De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het Huis, met uitzondering van de
      [artikelen 12][ref2], [21][ref3] en [22][ref4].

      3 In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref5] is het Huis slechts verplicht
      aan Onze Minister inlichtingen te verstrekken of inzage te geven in zakelijke gegevens en bescheiden met betrekking
      tot het gevoerde financiële beheer en de administratieve organisatie.

      4 [Artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref6] vindt slechts toepassing ten aanzien van het door
      het Huis gevoerde financiële beheer en de administratieve organisatie.


