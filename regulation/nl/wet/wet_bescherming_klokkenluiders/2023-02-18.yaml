  - number: 2c
    text: |-
      Autoriteiten die zorgdragen voor de ontvangst en opvolging van een melding, voor zover bevoegd op de in artikel 2
      van de richtlijn genoemde gebieden, zijn:

      1°. de Autoriteit Consument en Markt;

      2°. de Autoriteit Financiële Markten;

      3°. de Autoriteit persoonsgegevens;

      4°. De Nederlandsche Bank N.V.;

      5°. het Huis;

      6°. de Inspectie gezondheidszorg en jeugd;

      7°. de Nederlandse Zorgautoriteit;

      8°. de Autoriteit Nucleaire Veiligheid en Stralingsbescherming, en

      9°. bij algemene maatregel van bestuur of ministeriële regeling aangewezen organisaties en bestuursorganen, of
      onderdelen daarvan, die taken of bevoegdheden hebben op een van de gebieden, genoemd in artikel 2, eerste lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2c
  - number: 2d
    text: |-
      1 Een bevoegde autoriteit richt voor het ontvangen en in behandeling nemen van een melding een meldkanaal in. Het
      meldkanaal biedt de mogelijkheid om, met het oog op de behandeling van een melding, informatie duurzaam op te slaan
      overeenkomstig de eisen gesteld in de [artikelen 2a][ref1] en [2b][ref2], met dien verstande dat voor «werkgever»
      wordt gelezen «bevoegde autoriteit», en in het register de meldingen van een schending van het Unierecht duidelijk
      onderscheiden worden.

      2 Een melder kan bij een meldkanaal in ieder geval op de volgende wijze een melding doen:

      a. schriftelijk;

      b. mondeling via de telefoon of andere spraakberichtsystemen, of

      c. op zijn verzoek binnen een redelijke termijn door middel van een gesprek op een locatie.


