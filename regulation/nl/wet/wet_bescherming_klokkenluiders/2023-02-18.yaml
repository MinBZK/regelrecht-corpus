  - number: 17ea
    text: |-
      1 Een melder mag tijdens en na openbaarmaking van een vermoeden van een misstand niet worden benadeeld, onder de
      voorwaarde dat:

      a. de melder redelijke gronden heeft om aan te nemen dat de gemelde informatie over het vermoeden van een misstand
      op het moment van de openbaarmaking juist is;

      b. de melder voorafgaand aan de openbaarmaking een melding heeft gedaan:

      1°. bij de werkgever en een bevoegde autoriteit of een bestuursorgaan, dienst of andere bevoegde instantie als
      bedoeld in [artikel 2j][ref1], of

      2°. rechtstreeks bij een bevoegde autoriteit of een bestuursorgaan, dienst of andere bevoegde instantie als bedoeld
      in [artikel 2j][ref2], en

      c. de melder op basis van de informatie, bedoeld in [artikel 2e, tweede lid, onderdeel b][ref3], dan wel
      [artikel 2k, eerste lid][ref4], redelijke gronden heeft om aan te nemen dat het onderzoek onvoldoende voortgang
      heeft.

      2 Een melder mag eveneens tijdens en na openbaarmaking van een vermoeden van een misstand niet worden benadeeld,
      onder de voorwaarde, bedoeld in het eerste lid, onderdeel a, en de melder redelijke gronden heeft om aan te nemen
      dat:

      a. de misstand een dreigend of reëel gevaar kan zijn voor het algemeen belang;

      b. een risico bestaat op benadeling bij melding aan een bevoegde autoriteit of een andere bevoegde instantie, of

      c. het niet waarschijnlijk is dat de misstand doeltreffend wordt verholpen.


