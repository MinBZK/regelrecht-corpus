  - number: 2g
    text: |-
      1 Een bevoegde autoriteit wijst personeelsleden aan die verantwoordelijk zijn voor:

      a. het op verzoek verstrekken van informatie over de procedure bij een melding;

      b. de ontvangst van een melding;

      c. het onderzoek naar aanleiding van een melding, en

      d. het onderhouden van contact met een melder.

      2 Een bevoegde autoriteit draagt ten behoeve van een goede uitoefening van hun taken zorg voor de opleiding van de
      personeelsleden, bedoeld in het eerste lid.

      3 Ingeval personeelsleden die niet zijn aangewezen, informatie over een misstand ontvangen, dragen zij die
      informatie onverwijld en ongewijzigd over aan de personeelsleden die op grond van het eerste lid zijn aangewezen.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de eisen waaraan een opleiding als bedoeld in het
      tweede lid moet voldoen.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel2g
  - number: 2h
    text: |-
      1 Een bevoegde autoriteit zorgt ervoor dat de volgende informatie beschikbaar is:

      a. de contactgegevens van het meldkanaal van de bevoegde autoriteit;

      b. de procedures die van toepassing zijn op een melding, waaronder in ieder geval informatie over:

      1°. de wijze waarop de bevoegde autoriteit de melder kan verzoeken om verduidelijking van de gemelde informatie of
      om verstrekking van nadere informatie;

      2°. de termijn waarbinnen de melder wordt geïnformeerd over de behandeling van de melding en zo mogelijk de
      resultaten daarvan;

      c. de verplichting tot geheimhouding, bedoeld in [artikel 1a][ref1], die van toepassing is op een melding;

      d. informatie over de verwerking van persoonsgegevens;

      e. de wijze van in behandeling nemen van een melding, het onderzoek en voor zover van toepassing de maatregelen die
      kunnen worden genomen;

      f. de beschermingsmaatregelen, bedoeld in deze wet, en de voorwaarden waaronder de melder voor deze maatregelen in
      aanmerking komt;

      g. de voorwaarden waaronder bescherming wordt geboden tegen aansprakelijkheid voor een inbreuk op
      geheimhoudingsregels, bedoeld in [artikel 17f][ref2];

      h. de mogelijkheden voor vertrouwelijk advies over het doen van een melding, en

      i. de contactgegevens en een verwijzing naar de website van het Huis, in verband met zijn taak, bedoeld in
      [artikel 3a, tweede lid][ref3].

      2 De informatie, bedoeld in het eerste lid, wordt in ieder geval beschikbaar gesteld op een afzonderlijke pagina
      van de website van de bevoegde autoriteit.


