  - number: 1a
    text: |-
      1 Een ieder die betrokken is bij een melding of het onderzoek naar een vermoeden van een misstand en daarbij de
      beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is
      verplicht tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling
      verplicht of uit zijn taak bij de uitvoering van deze wet de noodzaak tot mededeling voortvloeit.

      2 Onder gegevens met een vertrouwelijk karakter worden in ieder geval begrepen:

      a. gegevens over de identiteit van een melder en van degene aan wie de misstand wordt toegeschreven of met wie die
      persoon in verband wordt gebracht en informatie die daartoe herleidbaar is, en

      b. informatie over een bedrijfsgeheim.

      3 De identiteit van een melder en de informatie aan de hand waarvan direct of indirect de identiteit van de melder
      kan worden achterhaald, wordt niet bekend gemaakt zonder diens instemming.

      4 Ingeval enig wettelijk voorschrift in het kader van onderzoek door een bevoegde autoriteit of een gerechtelijke
      procedure tot mededeling van de identiteit van een melder verplicht, wordt deze daarvan vooraf in kennis gesteld,
      tenzij die informatie het gerelateerde onderzoek of de gerechtelijke procedure in gevaar zou kunnen brengen.

      5 Bij de kennisgeving, bedoeld in het vierde lid, ontvangt een melder of een betrokkene een schriftelijke
      toelichting van de redenen voor de bekendmaking van de gegevens over zijn identiteit.

      6 Een bevoegde autoriteit die informatie over bedrijfsgeheimen ontvangt, gebruikt of maakt die informatie alleen
      bekend voor zover dat noodzakelijk is voor een gedegen opvolging van de melding.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel1a
  - number: 1b
    text: |-
