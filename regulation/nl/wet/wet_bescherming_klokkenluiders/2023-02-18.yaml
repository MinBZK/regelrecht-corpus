  - number: '9'
    text: |-
      Deze paragraaf is van toepassing op onderzoek door de afdeling onderzoek indien de werkgever onderdeel uitmaakt van
      de publieke sector. De publieke sector wordt gevormd door:

      a. de staat;

      b. de provincies;

      c. de gemeenten;

      d. de waterschappen;

      e. de openbare lichamen voor beroep en bedrijf;

      f. de andere openbare lichamen waaraan krachtens de [Grondwet][ref1] verordenende bevoegdheid is toegekend;

      g. de Europese groeperingen voor territoriale samenwerking met een statutaire zetel in Nederland;

      h. de overige krachtens publiekrecht ingestelde rechtspersonen; en

      i. andere dan krachtens publiekrecht ingestelde rechtspersonen, waarvan een orgaan is bekleed met openbaar gezag,
      waarbij de uitoefening van dat gezag de kernactiviteit van de rechtspersoon vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '10'
    text: |-
      1 De [artikelen 9:30 tot en met 9:34 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het onderzoek door de afdeling onderzoek, met dien verstande dat voor «bestuursorgaan» telkens gelezen
      wordt «werkgever» en voor «de ombudsman» telkens wordt gelezen: de afdeling onderzoek. Indien de werkgever
      vertegenwoordigd wordt door een meerhoofdig orgaan, wordt onder «college» verstaan: dat meerhoofdige orgaan.

      2 In afwijking van [artikel 9:31, vierde lid, van de Algemene wet Bestuursrecht][ref2] kunnen de ingevolge
      artikel 9:31, eerste lid, opgeroepen personen onderscheidenlijk degenen die ingevolge artikel 9:31, derde lid,
      verplicht zijn stukken over te leggen, het geven van inlichtingen onderscheidenlijk het overleggen van stukken
      weigeren indien het inlichtingen en bescheiden betreft waarvan het verstrekken in strijd is met het belang van de
      nationale veiligheid, dan wel een schending van een ambtsgeheim of wettelijk voorschrift met zich meebrengt. Voorts
      geldt deze verplichting niet, indien een persoon daardoor of zichzelf of een van zijn bloed- of aanverwanten in
      de rechte lijn of in de zijlijn in de tweede of de derde graad of zijn echtgenoot of eerdere echtgenoot dan wel
      geregistreerde partner of eerdere geregistreerde partner aan het gevaar van een strafrechtelijke veroordeling ter
      zake van een misdrijf zou blootstellen.

      3 Tijdens het onderzoek kan de afdeling onderzoek bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor hem worden gebracht om aan hun verplichtingen te voldoen.

      4 Onze Minister die het aangaat kan tijdens het onderzoek, bedoeld in het eerste lid, aan de afdeling onderzoek het
      betreden van bepaalde plaatsen verbieden, indien dit naar zijn oordeel de veiligheid van de staat zou schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel931
