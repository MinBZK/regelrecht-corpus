  - number: '12'
    text: |-
      De afdeling onderzoek maakt van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling
      van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel12
  - number: '13'
    text: |-
      1 De afdeling onderzoek is bevoegd inlichtingen te vragen en inzage te vorderen van zakelijke gegevens en
      bescheiden.

      2 De werkgever tegen wie het vermoeden van een misstand zich richt, de onder zijn verantwoordelijkheid werkzame
      personen, getuigen, alsmede de verzoeker, zijn verplicht de verlangde inlichtingen volledig en naar waarheid te
      verstrekken en zijn tevens verplicht te verschijnen.

      3 De afdeling onderzoek bepaalt op welke wijze en binnen welke termijn de inlichtingen worden verstrekt.

      4 De werkgever tegen wie het vermoeden zich richt, is verplicht binnen een door de afdeling onderzoek te bepalen
      termijn de zakelijke gegevens en bescheiden volledig en naar waarheid te verstrekken, een en ander op de wijze door
      de afdeling onderzoek vast te stellen.

      5 De ingevolge het tweede lid opgeroepen personen onderscheidenlijk de werkgever die op grond van het vierde lid
      verplicht is stukken over te leggen, kunnen de afdeling onderzoek mededelen dat uitsluitend hij kennis zal mogen
      nemen van de inlichtingen onderscheidenlijk de stukken.

      6 Het geven van inlichtingen of het overleggen van stukken kan worden geweigerd, indien het inlichtingen en
      bescheiden betreft waarvan het verstrekken in strijd is met het belang van de nationale veiligheid, dan wel
      een schending van een beroepsgeheim of wettelijk voorschrift met zich meebrengt. Voorts geldt deze verplichting
      niet, indien een persoon daardoor of zichzelf of een van zijn bloed- of aanverwanten in de rechte lijn of in de
      zijlijn in de tweede of de derde graad of zijn echtgenoot of eerdere echtgenoot dan wel geregistreerde partner of
      eerdere geregistreerde partner aan het gevaar van een strafrechtelijke veroordeling ter zake van een misdrijf zou
      blootstellen.

      7 De afdeling onderzoek beslist of de beperking van de kennisneming, bedoeld in het vijfde lid, onderscheidenlijk
      de weigering, bedoeld in het zesde lid, gerechtvaardigd is.

      8 Indien de afdeling onderzoek heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel13
  - number: '14'
    text: |-
      1 De afdeling onderzoek stelt de werkgever en de verzoeker in de gelegenheid hun standpunt toe te lichten ten
      aanzien van het vermoeden van een misstand.

      2 De afdeling onderzoek beslist of de toelichting schriftelijk of mondeling en al dan niet in elkaars aanwezigheid
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel14
  - number: '15'
    text: |-
      1 De afdeling onderzoek kan in het belang van het onderzoek deskundigen werkzaamheden opdragen en personen oproepen
      om als deskundige gehoord te worden of als tolk op te treden.

      2 Door de afdeling onderzoek opgeroepen deskundigen of tolken verschijnen voor hem en verlenen onpartijdig en naar
      beste weten hun diensten als zodanig.

      3 Getuigen zullen niet worden gehoord en tolken zullen niet tot de uitoefening van hun taak worden toegelaten dan
      na het afleggen van de eed of de belofte. Getuigen leggen in dat geval de eed of de belofte af dat zij de gehele
      waarheid en niets dan de waarheid zullen zeggen en tolken dat zij hun plichten als tolk met nauwgezetheid zullen
      vervullen.
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel15
  - number: '16'
    text: |-
      Aan de door de afdeling onderzoek opgeroepen verzoekers, getuigen, deskundigen en tolken wordt een vergoeding
      toegekend die ten laste van het Rijk komt. Het bij en krachtens de [Wet tarieven in strafzaken][ref1] bepaalde is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '17'
    text: |-
      1 Wanneer een onderzoek is afgesloten, stelt de afdeling onderzoek een rapport op, waarin hij zijn bevindingen en
      zijn oordeel weergeeft. Hij neemt daarbij [artikel 5.1 van de Wet open overheid][ref1] in acht.

      2 Het rapport bevat in ieder geval, voor zover het onderzoek zich daartoe uitstrekt:

      a. een analyse van de misstand,

      b. de vaststelling van de oorzaken of de vermoedelijke oorzaken van de misstand en de omvang van zijn gevolgen, en

      c. aanbevelingen aan de werkgever indien daartoe aanleiding bestaat.

      3 De afdeling onderzoek zendt een concept van het rapport aan de betrokken werkgever en de verzoeker.

      4 De werkgever en de verzoeker kunnen schriftelijk commentaar leveren gedurende een termijn van vier weken, die
      aanvangt met ingang van de dag na die waarop het concept van het rapport is verzonden. Zij zijn tot geheimhouding
      van het concept van het rapport verplicht.

      5 Indien het commentaar daartoe aanleiding geeft, kan de afdeling onderzoek het rapport aanpassen. Ingeval het
      commentaar niet leidt tot aanpassing, geeft de afdeling onderzoek in zijn rapport de redenen daarvoor aan.

      6 Indien de afdeling onderzoek aan een werkgever een aanbeveling als bedoeld in het tweede lid doet, deelt de
      werkgever binnen een redelijke termijn aan de afdeling onderzoek mee op welke wijze aan de aanbeveling gevolg zal
      worden gegeven. Indien de werkgever overweegt de aanbeveling niet op te volgen, deelt het dat met redenen omkleed
      aan de afdeling onderzoek mee.

      7 De afdeling onderzoek maakt het rapport uit eigen beweging openbaar.

      8 Bij het Huis berustende informatie over het onderzoek die niet is opgenomen in het rapport, is niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0037852/2023-02-18#Artikel17
