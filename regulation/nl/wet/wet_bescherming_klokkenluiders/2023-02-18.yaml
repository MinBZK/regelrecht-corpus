  - number: 21c
    text: |-
      1 [Artikel 2][ref1] zoals dat luidde op de dag voor inwerkingtreding van de wet van 25 januari 2023 tot wijziging
      van de Wet Huis voor klokkenluiders en enige andere wetten ter implementatie van [Richtlijn (EU) 2019/1937]
      (32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019 (PbEU 2019, L 305) en enige andere
      wijzigingen, blijft tot 17 december 2023 van toepassing op werkgevers in de private sector met 50 tot 249
      werknemers.

      2 De [artikelen 2 tot en met 2b][ref2] zoals die luiden na inwerkingtreding van de wet van 25 januari 2023
      tot wijziging van de Wet Huis voor klokkenluiders en enige andere wetten ter implementatie van [Richtlijn (EU)
      2019/1937](32019L1937) van het Europees Parlement en de Raad van 23 oktober 2019 (PbEU 2019, L 305) en enige andere
      wijzigingen zijn met ingang van 17 december 2023 van toepassing op werkgevers in de private sector met 50 tot 249
      werknemers.


