  - number: 3d
    text: |-
      1 Het bestuur van het Huis wordt ondersteund door een bureau.

      2 In afwijking van [artikel 4.6, eerste lid, van de Comptabiliteitswet 2016][ref1] vertegenwoordigt de voorzitter
      de Staat bij het aangaan, wijzigen en beëindigen van individuele arbeidsovereenkomsten met de medewerkers van het
      bureau.

      3 De keuze van de medewerkers geschiedt op zodanige wijze dat alle relevante deskundigheid in het bureau aanwezig
      is.

      4 Het bureau bestaat uit medewerkers die in de afdeling advies als adviseur zijn aangesteld, medewerkers die in de
      afdeling onderzoek als onderzoeker zijn aangesteld en medewerkers in algemene dienst van het Huis.

      5 Een medewerker die als adviseur betrokken is geweest bij de advisering inzake een vermoeden van een misstand
      neemt geen deel aan een onderzoek dezelfde misstand betreffende.


