  - number: '2.1'
    text: |-
      De werkgever bij wie in de regel ten minste vijftig personen werkzaam zijn, stelt een procedure vast voor het
      omgaan met het melden van een vermoeden van een misstand binnen zijn organisatie.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: '2.2'
    text: 'In de procedure, bedoeld in het eerste lid, wordt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.2.a
    text: de wijze waarop met de interne melding wordt omgegaan vastgelegd;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.2.b
    text: |-
      omschreven wanneer sprake is van een vermoeden van een misstand met inachtneming van de definitie van een vermoeden
      van een misstand als bedoeld in deze wet;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.2.c
    text: |-
      vastgelegd bij welke daartoe aangewezen functionaris of functionarissen het vermoeden van een misstand kan worden
      gemeld;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.2.d
    text: |-
      de verplichting voor de werkgever opgenomen de melding vertrouwelijk te behandelen, indien de werknemer hierom
      heeft verzocht;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.2.e
    text: |-
      vastgelegd dat de werknemer de mogelijkheid heeft om een adviseur in vertrouwen te raadplegen over een vermoeden
      van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      De werkgever is verplicht aan de bij hem werkzame personen een schriftelijke of elektronische opgave te verstrekken
      van de procedure, bedoeld in het eerste lid. De werkgever verstrekt daarbij tevens informatie over:
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.3.a
    text: de omstandigheden waaronder een vermoeden van een misstand buiten de organisatie kan worden gemeld,
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: 2.3.b
    text: de rechtsbescherming van de werknemer bij het melden van een vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel2
  - number: '3.1'
    text: Er is een Huis voor klokkenluiders.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het Huis, met uitzondering van de
      [artikelen 12][ref2], [21][ref3] en [22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '3.3'
    text: |-
      In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] is het Huis slechts verplicht aan
      Onze Minister inlichtingen te verstrekken of inzage te geven in zakelijke gegevens en bescheiden met betrekking tot
      het gevoerde financiële beheer en de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '3.4'
    text: |-
      [Artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt slechts toepassing ten aanzien van het door
      het Huis gevoerde financiële beheer en de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 3a.1
    text: Het Huis kent een afdeling advies en een afdeling onderzoek.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.2
    text: 'De afdeling advies heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.2.a
    text: |-
      het informeren, adviseren en ondersteunen van een werknemer over de te ondernemen stappen inzake het vermoeden van
      een misstand;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.2.b
    text: |-
      het verwijzen naar bestuursorganen of diensten die zijn belast met de opsporing van strafbare feiten of met
      het toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk voorschrift of een andere bevoegde
      instantie waar het vermoeden van een misstand kan worden gemeld, en
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.2.c
    text: het geven van algemene voorlichting over het omgaan met een vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.3
    text: 'De afdeling onderzoek heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.3.a
    text: |-
      het beoordelen of het verzoekschrift ontvankelijk is met inachtneming van de voorwaarden, bedoeld in
      [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel6
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3a.3.b
    text: 'het op basis van een verzoekschrift instellen van een onderzoek naar:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.3.b.1°
    text: het vermoeden van een misstand;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.3.b.2°
    text: |-
      de wijze waarop de werkgever zich jegens de werknemer heeft gedragen naar aanleiding van een melding van een
      vermoeden van een misstand;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3a.3.c
    text: |-
      het instellen van een onderzoek naar het vermoeden van een misstand naar aanleiding van een of meerdere
      adviesaanvragen, met inachtneming van [artikel 3k, derde lid][ref1], en [artikel 6, eerste lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3k
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel6
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 3k
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0037852
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3a.3.d
    text: het formuleren van algemene aanbevelingen over het omgaan met een vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3a
  - number: 3b.1
    text: Het bestuur van het Huis bestaat uit een voorzitter en ten hoogste vier leden.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3b
  - number: 3b.2
    text: |-
      De leden worden benoemd in de afdeling advies of in de afdeling onderzoek. Zij worden niet benoemd in beide
      afdelingen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3b
  - number: 3b.3
    text: |-
      Een lid dat betrokken is geweest bij de advisering inzake een vermoeden van een misstand neemt geen deel aan de
      behandeling van een onderzoek dezelfde misstand betreffende.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3b
  - number: 3b.4
    text: De voorzitter is verantwoordelijk voor het goed functioneren van het Huis.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3b
  - number: 3c.1
    text: |-
      De leden en de voorzitter van het Huis worden bij koninklijk besluit benoemd. Zij worden op eigen aanvraag
      door Onze Minister ontslagen. Zij kunnen voorts bij koninklijk besluit worden geschorst en ontslagen wegens
      ongeschiktheid of onbekwaamheid dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen.
      De voordracht voor schorsing of ontslag wordt niet gedaan dan nadat het Huis daarover is gehoord.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3c
  - number: 3c.2
    text: |-
      De benoeming van de leden gebeurt op zodanige wijze dat alle relevante deskundigheid in het Huis aanwezig is ten
      behoeve van de uitvoering van de taken, bedoeld in [artikel 3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3c.3
    text: |-
      De leden worden voor een periode van ten hoogste vier jaar benoemd. De zittingsduur van het lid dat is benoemd op
      een tussentijds opengevallen plaats, is gelijk aan de duur van de resterende zittingsperiode van het lid in wiens
      plaats dit lid is benoemd. De leden kunnen twee maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3c
  - number: 3c.4
    text: |-
      De voorzitter en de leden vervullen geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van zijn functie of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3c
  - number: 3d.1
    text: Het bestuur van het Huis wordt ondersteund door een bureau.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3d
  - number: 3d.2
    text: |-
      In afwijking van [artikel 4.6, eerste lid, van de Comptabiliteitswet 2016][ref1] vertegenwoordigt de voorzitter
      de Staat bij het aangaan, wijzigen en beëindigen van individuele arbeidsovereenkomsten met de medewerkers van het
      bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: 3d.3
    text: De keuze van de medewerkers geschiedt op zodanige wijze dat alle relevante deskundigheid in het bureau aanwezig is.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3d
  - number: 3d.4
    text: |-
      Het bureau bestaat uit medewerkers die in de afdeling advies als adviseur zijn aangesteld, medewerkers die in de
      afdeling onderzoek als onderzoeker zijn aangesteld en medewerkers in algemene dienst van het Huis.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3d
  - number: 3d.5
    text: |-
      Een medewerker die als adviseur betrokken is geweest bij de advisering inzake een vermoeden van een misstand neemt
      geen deel aan een onderzoek dezelfde misstand betreffende.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3d
  - number: 3e
    text: De medewerkers van het bureau zijn geen lid van het Huis.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3e
  - number: 3f.1
    text: De leden van het Huis hebben zitting zonder last.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
  - number: 3f.2
    text: |-
      Een lid onthoudt zich van deelneming aan de behandeling van een advies of onderzoek als bedoeld in
      [artikel 3a, tweede en derde lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3f.2.a
    text: het hemzelf of een van zijn bloed- of aanverwanten tot en met de vierde graad aangaat;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
  - number: 3f.2.b
    text: het een instelling of rechtspersoon betreft waarbij hij werkt, heeft gewerkt of belang heeft;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
  - number: 3f.2.c
    text: het een vermoeden van een misstand betreft waarbij hij mogelijk betrokken is of is geweest;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
  - number: 3f.2.d
    text: anderszins de schijn van belangenverstrengeling kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3f
  - number: 3g.1
    text: |-
      Een medewerker van het bureau meldt onverwijld aan de voorzitter van het Huis dat het advies of onderzoek, bedoeld
      in [artikel 3a, tweede en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3g.1.a
    text: hemzelf of een van zijn bloed- of aanverwanten tot en met de vierde graad aangaat;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
  - number: 3g.1.b
    text: een instelling of rechtspersoon betreft waarbij hij werkt, heeft gewerkt of belang heeft;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
  - number: 3g.1.c
    text: een vermoeden van een misstand betreft waarbij hij mogelijk betrokken is of is geweest;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
  - number: 3g.1.d
    text: anderszins de schijn van belangenverstrengeling kan wekken.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
  - number: 3g.2
    text: De voorzitter beslist of de medewerker zich om deze reden van deelneming aan het advies of onderzoek onthoudt.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3g
  - number: 3h
    text: Het Huis stelt een bestuursreglement, een advies- en een onderzoeksprotocol vast en maakt deze openbaar.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3h
  - number: 3i
    text: |-
      Een ieder die betrokken is bij de uitvoering van de taken van het Huis en daarbij de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak bij de uitvoering van deze wet de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3i
  - number: 3j
    text: |-
      Het Huis maakt de identiteit van de werknemer die informatie, advies of ondersteuning vraagt en van de verzoeker
      niet bekend zonder diens instemming.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3j
  - number: 3k.1
    text: |-
      Een werknemer kan de afdeling advies verzoeken om informatie, advies en ondersteuning inzake het vermoeden van een
      misstand. De adviesaanvraag is vormvrij.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3k
  - number: 3k.2
    text: |-
      Informatie, advies en ondersteuning kunnen zowel in mondelinge als in schriftelijke vorm gegeven worden. De keuze
      ten aanzien van de vorm van de informatie, het advies of de ondersteuning is voorbehouden aan de afdeling advies.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3k
  - number: 3k.3
    text: |-
      De in een adviesaanvraag verstrekte informatie over een vermoeden van een misstand en het advies worden door de
      afdeling advies niet verstrekt aan de afdeling onderzoek, tenzij de werknemer schriftelijk verklaart daar geen
      bezwaar tegen te hebben.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3k
  - number: 3k.4
    text: Bij het Huis berustende informatie over het advies is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel3k
  - number: '4.1'
    text: 'Een werknemer kan bij de afdeling onderzoek:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
  - number: 4.1.a
    text: een vermoeden van een misstand melden ten behoeve van een onderzoek, of
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
  - number: 4.1.b
    text: |-
      verzoeken om een onderzoek in te stellen naar de wijze waarop de werkgever zich jegens hem heeft gedragen naar
      aanleiding van een melding van een vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
  - number: '4.2'
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
  - number: 4.2.a
    text: |-
      rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 4°, van de Wet op de rechterlijke organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 4.2.b
    text: |-
      een ieder die betrokken is of is geweest bij de uitvoering van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1] en de [Wet veiligheidsonderzoeken][ref2], voor zover
      het de uitvoering van deze wetten betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0039896
      [ref2]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039896
      - id: ref2
        bwb_id: BWBR0008277
  - number: '5.1'
    text: 'Het verzoekschrift wordt ondertekend door de verzoeker of diens gemachtigde en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
  - number: 5.1.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
  - number: 5.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een omschrijving van de misstand die wordt vermoed, waaronder de naam van de werkgever tegen wie het vermoeden zich
      richt, en
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
  - number: 5.1.d
    text: de gronden waarop het vermoeden van een misstand is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      [Artikel 9:28, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op
      het verzoekschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '6.1'
    text: |-
      De afdeling onderzoek stelt binnen 6 weken na de dagtekening van het verzoekschrift een onderzoek in, tenzij de
      afdeling onderzoek oordeelt dat:
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.1.a
    text: |-
      het verzoekschrift niet voldoet aan de vereisten, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel5
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.1.b
    text: het verzoek kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.1.c
    text: |-
      het maatschappelijk belang bij een onderzoek door de afdeling onderzoek, dan wel de ernst van de misstand,
      kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.1.d
    text: |-
      het vermoeden van de misstand ter beoordeling staat van bestuursorganen of diensten die zijn belast met de
      opsporing van strafbare feiten of met het toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk
      voorschrift of een andere daartoe bevoegde instantie waar het vermoeden van een misstand kan worden gemeld en
      het bestuursorgaan, de dienst of de andere daartoe bevoegde instantie het vermoeden van een misstand naar behoren
      behandelt of heeft behandeld;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.1.e
    text: |-
      de verzoeker het vermoeden van een misstand niet heeft gemeld aan een leidinggevende, een vertrouwenspersoon of een
      andere in een interne procedure als bedoeld in [artikel 2][ref1] aangewezen persoon van de organisatie waarbinnen
      sprake is van de vermoedelijke misstand, tenzij dat van hem in redelijkheid niet gevraagd kan worden;


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 6.1.f
    text: |-
      de verzoeker het vermoeden van een misstand heeft gemeld aan een leidinggevende, een vertrouwenspersoon of een
      andere in een interne procedure als bedoeld in [artikel 2][ref1] aangewezen persoon van de organisatie waarbinnen
      sprake is van de vermoedelijke misstand en de organisatie het vermoeden naar behoren heeft behandeld;


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 6.1.g
    text: |-
      er een ander verzoek, dezelfde misstand betreffende, bij de afdeling onderzoek in behandeling is of door de
      afdeling onderzoek is afgedaan, behoudens indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en
      zulks tot een ander oordeel over de bedoelde misstand zou hebben kunnen leiden; of
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.1.h
    text: bij onherroepelijke rechterlijke uitspraak reeds over de misstand is geoordeeld.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de afdeling onderzoek geen onderzoek instelt, worden de resultaten van het oordeel, bedoeld in het eerste
      lid, niet openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: '6.3'
    text: 'De afdeling onderzoek is niet verplicht een onderzoek voort te zetten indien:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.3.a
    text: |-
      de verzoeker naar het oordeel van de afdeling onderzoek onvoldoende meewerkt aan een zorgvuldig verloop van het
      onderzoek en het bewaren van de vertrouwelijkheid van uitkomsten van het onderzoek, of
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: 6.3.b
    text: |-
      een nieuw feit of een nieuwe omstandigheid bekend wordt, op grond waarvan de afdeling onderzoek tot het oordeel
      komt dat het verzoek kennelijk ongegrond is.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien de afdeling onderzoek geen onderzoek instelt of dit niet voortzet, deelt de afdeling dit onder vermelding
      van de redenen zo spoedig mogelijk schriftelijk aan de verzoeker mede.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      In het geval dat de afdeling onderzoek een onderzoek niet voortzet, doet hij de in het eerste lid bedoelde
      mededeling tevens aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      De afdeling onderzoek streeft ernaar het onderzoek binnen een jaar na afronding van het oordeel over de
      ontvankelijkheid, bedoeld in [artikel 6, eerste lid][ref1], af te ronden.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel6
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '8.2'
    text: De afdeling onderzoek kan naar aanleiding van het door hem verrichte onderzoek aan de werkgever aanbevelingen doen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      Een oordeel of aanbeveling behelst geen vaststelling van civielrechtelijke aansprakelijkheid in verband met een
      misstand, noch een vermoeden van schuld aan enig strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel8
  - number: '9'
    text: |-
      Deze paragraaf is van toepassing op onderzoek door de afdeling onderzoek indien de werkgever onderdeel uitmaakt van
      de publieke sector. De publieke sector wordt gevormd door:
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.a
    text: de staat;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.b
    text: de provincies;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.c
    text: de gemeenten;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.d
    text: de waterschappen;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.e
    text: de openbare lichamen voor beroep en bedrijf;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.f
    text: |-
      de andere openbare lichamen waaraan krachtens de [Grondwet][ref1] verordenende bevoegdheid is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 9.g
    text: de Europese groeperingen voor territoriale samenwerking met een statutaire zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.h
    text: de overige krachtens publiekrecht ingestelde rechtspersonen; en
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: 9.i
    text: |-
      andere dan krachtens publiekrecht ingestelde rechtspersonen, waarvan een orgaan is bekleed met openbaar gezag,
      waarbij de uitoefening van dat gezag de kernactiviteit van de rechtspersoon vormt.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      De [artikelen 9:30 tot en met 9:34 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het onderzoek door de afdeling onderzoek, met dien verstande dat voor «bestuursorgaan» telkens gelezen
      wordt «werkgever» en voor «de ombudsman» telkens wordt gelezen: de afdeling onderzoek. Indien de werkgever
      vertegenwoordigd wordt door een meerhoofdig orgaan, wordt onder «college» verstaan: dat meerhoofdige orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '10.2'
    text: |-
      In afwijking van [artikel 9:31, vierde lid, van de Algemene wet Bestuursrecht][ref1] kunnen de ingevolge
      artikel 9:31, eerste lid, opgeroepen personen onderscheidenlijk degenen die ingevolge artikel 9:31, derde lid,
      verplicht zijn stukken over te leggen, het geven van inlichtingen onderscheidenlijk het overleggen van stukken
      weigeren indien het inlichtingen en bescheiden betreft waarvan het verstrekken in strijd is met het belang van de
      nationale veiligheid, dan wel een schending van een ambtsgeheim of wettelijk voorschrift met zich meebrengt. Voorts
      geldt deze verplichting niet, indien een persoon daardoor of zichzelf of een van zijn bloed- of aanverwanten in
      de rechte lijn of in de zijlijn in de tweede of de derde graad of zijn echtgenoot of eerdere echtgenoot dan wel
      geregistreerde partner of eerdere geregistreerde partner aan het gevaar van een strafrechtelijke veroordeling ter
      zake van een misdrijf zou blootstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '10.3'
    text: |-
      Tijdens het onderzoek kan de afdeling onderzoek bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor hem worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister die het aangaat kan tijdens het onderzoek, bedoeld in het eerste lid, aan de afdeling onderzoek het
      betreden van bepaalde plaatsen verbieden, indien dit naar zijn oordeel de veiligheid van de staat zou schaden.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel10
  - number: '11'
    text: |-
      Deze afdeling is van toepassing op onderzoek door de afdeling onderzoek indien [artikel 9][ref1] niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel9
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: 4a
  - number: '12'
    text: |-
      De afdeling onderzoek maakt van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling
      van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel12
  - number: '13.1'
    text: De afdeling onderzoek is bevoegd inlichtingen te vragen en inzage te vorderen van zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      De werkgever tegen wie het vermoeden van een misstand zich richt, de onder zijn verantwoordelijkheid werkzame
      personen, getuigen, alsmede de verzoeker, zijn verplicht de verlangde inlichtingen volledig en naar waarheid te
      verstrekken en zijn tevens verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.3'
    text: De afdeling onderzoek bepaalt op welke wijze en binnen welke termijn de inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.4'
    text: |-
      De werkgever tegen wie het vermoeden zich richt, is verplicht binnen een door de afdeling onderzoek te bepalen
      termijn de zakelijke gegevens en bescheiden volledig en naar waarheid te verstrekken, een en ander op de wijze door
      de afdeling onderzoek vast te stellen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.5'
    text: |-
      De ingevolge het tweede lid opgeroepen personen onderscheidenlijk de werkgever die op grond van het vierde lid
      verplicht is stukken over te leggen, kunnen de afdeling onderzoek mededelen dat uitsluitend hij kennis zal mogen
      nemen van de inlichtingen onderscheidenlijk de stukken.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.6'
    text: |-
      Het geven van inlichtingen of het overleggen van stukken kan worden geweigerd, indien het inlichtingen en
      bescheiden betreft waarvan het verstrekken in strijd is met het belang van de nationale veiligheid, dan wel
      een schending van een beroepsgeheim of wettelijk voorschrift met zich meebrengt. Voorts geldt deze verplichting
      niet, indien een persoon daardoor of zichzelf of een van zijn bloed- of aanverwanten in de rechte lijn of in de
      zijlijn in de tweede of de derde graad of zijn echtgenoot of eerdere echtgenoot dan wel geregistreerde partner of
      eerdere geregistreerde partner aan het gevaar van een strafrechtelijke veroordeling ter zake van een misdrijf zou
      blootstellen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.7'
    text: |-
      De afdeling onderzoek beslist of de beperking van de kennisneming, bedoeld in het vijfde lid, onderscheidenlijk de
      weigering, bedoeld in het zesde lid, gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '13.8'
    text: Indien de afdeling onderzoek heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      De afdeling onderzoek stelt de werkgever en de verzoeker in de gelegenheid hun standpunt toe te lichten ten aanzien
      van het vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      De afdeling onderzoek beslist of de toelichting schriftelijk of mondeling en al dan niet in elkaars aanwezigheid
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel14
  - number: '15.1'
    text: |-
      De afdeling onderzoek kan in het belang van het onderzoek deskundigen werkzaamheden opdragen en personen oproepen
      om als deskundige gehoord te worden of als tolk op te treden.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      Door de afdeling onderzoek opgeroepen deskundigen of tolken verschijnen voor hem en verlenen onpartijdig en naar
      beste weten hun diensten als zodanig.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel15
  - number: '15.3'
    text: |-
      Getuigen zullen niet worden gehoord en tolken zullen niet tot de uitoefening van hun taak worden toegelaten dan
      na het afleggen van de eed of de belofte. Getuigen leggen in dat geval de eed of de belofte af dat zij de gehele
      waarheid en niets dan de waarheid zullen zeggen en tolken dat zij hun plichten als tolk met nauwgezetheid zullen
      vervullen.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel15
  - number: '16'
    text: |-
      Aan de door de afdeling onderzoek opgeroepen verzoekers, getuigen, deskundigen en tolken wordt een vergoeding
      toegekend die ten laste van het Rijk komt. Het bij en krachtens de [Wet tarieven in strafzaken][ref1] bepaalde is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '17.1'
    text: |-
      Wanneer een onderzoek is afgesloten, stelt de afdeling onderzoek een rapport op, waarin hij zijn bevindingen en
      zijn oordeel weergeeft. Hij neemt daarbij [artikel 10 van de Wet openbaarheid van bestuur][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '17.2'
    text: 'Het rapport bevat in ieder geval, voor zover het onderzoek zich daartoe uitstrekt:'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: 17.2.a
    text: een analyse van de misstand,
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: 17.2.b
    text: de vaststelling van de oorzaken of de vermoedelijke oorzaken van de misstand en de omvang van zijn gevolgen, en
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: 17.2.c
    text: aanbevelingen aan de werkgever indien daartoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.3'
    text: De afdeling onderzoek zendt een concept van het rapport aan de betrokken werkgever en de verzoeker.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.4'
    text: |-
      De werkgever en de verzoeker kunnen schriftelijk commentaar leveren gedurende een termijn van vier weken, die
      aanvangt met ingang van de dag na die waarop het concept van het rapport is verzonden. Zij zijn tot geheimhouding
      van het concept van het rapport verplicht.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.5'
    text: |-
      Indien het commentaar daartoe aanleiding geeft, kan de afdeling onderzoek het rapport aanpassen. Ingeval het
      commentaar niet leidt tot aanpassing, geeft de afdeling onderzoek in zijn rapport de redenen daarvoor aan.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.6'
    text: |-
      Indien de afdeling onderzoek aan een werkgever een aanbeveling als bedoeld in het tweede lid doet, deelt de
      werkgever binnen een redelijke termijn aan de afdeling onderzoek mee op welke wijze aan de aanbeveling gevolg zal
      worden gegeven. Indien de werkgever overweegt de aanbeveling niet op te volgen, deelt het dat met redenen omkleed
      aan de afdeling onderzoek mee.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.7'
    text: De afdeling onderzoek maakt het rapport uit eigen beweging openbaar.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: '17.8'
    text: Bij het Huis berustende informatie over het onderzoek die niet is opgenomen in het rapport, is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17
  - number: 17a.1
    text: |-
      Ter bevordering van de coördinatie en het overleg maken het Huis en het College van procureurs-generaal binnen
      een half jaar na de inwerkingtreding van de wet, afspraken over de samenwerking en informatie-uitwisseling. Het
      betreft in ieder geval afspraken over de gevallen waarin zowel de afdeling onderzoek een onderzoek instelt naar een
      vermoeden van een misstand als het openbaar ministerie een opsporingsonderzoek instelt naar een strafbaar feit ten
      aanzien van hetzelfde voorval. De afspraken behoeven de goedkeuring van Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17a
  - number: 17a.2
    text: De afspraken over samenwerking en informatie-uitwisseling worden neergelegd in een samenwerkingsprotocol.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17a
  - number: 17a.3
    text: |-
      Indien in een concreet geval zowel de afdeling onderzoek een onderzoek instelt naar een vermoeden van een misstand
      als het openbaar ministerie opsporingsonderzoek instelt naar een strafbaar feit, plegen de afdeling onderzoek
      en het openbaar ministerie, met inachtneming van het samenwerkingsprotocol, overleg over de inrichting van beide
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17a
  - number: 17b
    text: |-
      Ter bevordering van coördinatie en overleg kan het Huis samenwerkingsprotocollen afsluiten met bestuursorganen
      of diensten die zijn belast met het toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk
      voorschrift. [Artikel 17a, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel17a
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: 17a
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 17c
    text: |-
      Het Huis zendt jaarlijks aan beide kamers der Staten-Generaal een overzicht van de aanbevelingen van het Huis en
      van de wijze waarop aan de aanbevelingen vervolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17c
  - number: 17d
    text: |-
      De afdeling onderzoek is bevoegd een onderzoek in te stellen naar de stand van zaken met betrekking tot de
      uitvoering van aanbevelingen die in eerder onderzoek zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel17d
  - number: '20'
    text: |-
      Onze Minister zendt binnen vijf jaar na het tijdstip van inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. Het Huis verleent medewerking aan het
      verslag en verschaft Onze Minister de daartoe benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel20
  - number: '21'
    text: |-
      De afdeling onderzoek is niet verplicht een onderzoek in te stellen indien de verzoeker meer dan een jaar voor
      het tijdstip van inwerkingtreding van deze wet een melding van een vermoeden van een misstand heeft gedaan bij de
      werkgever of de daartoe bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel21
  - number: 21a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de inrichting van het
      Huis.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel21a
  - number: 21a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel21a
  - number: '22'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet Huis voor klokkenluiders.'
    url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#Artikel23
