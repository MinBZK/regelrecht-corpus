preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om met het oog op de bescherming van klokkenluiders
    rechtsbescherming te regelen, een Huis voor klokkenluiders op te richten en dat het noodzakelijk is daartoe
    wettelijke bepalingen vast te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037852/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Huis:* Huis voor klokkenluiders als bedoeld
      in [artikel 3][ref1];
        - *afdeling advies:* de afdeling advies van het Huis, bedoeld in [artikel 3a, tweede lid][ref2];
        - *afdeling onderzoek:* de afdeling onderzoek van het Huis, bedoeld in [artikel 3a, derde lid][ref3];
        - *vermoeden van een misstand:* het vermoeden van een werknemer, dat binnen de organisatie waarin hij werkt of
      heeft gewerkt of bij een andere organisatie indien hij door zijn werkzaamheden met die organisatie in aanraking
      is gekomen, sprake is van een misstand voor zover: 1°. het vermoeden gebaseerd is op redelijke gronden, die
      voortvloeien uit de kennis die de werknemer bij zijn werkgever heeft opgedaan of voortvloeien uit de kennis
      die de werknemer heeft gekregen door zijn werkzaamheden bij een ander bedrijf of een andere organisatie, en 2°.
      het maatschappelijk belang in het geding is bij de schending van een wettelijk voorschrift, een gevaar voor de
      volksgezondheid, een gevaar voor de veiligheid van personen, een gevaar voor de aantasting van het milieu, een
      gevaar voor het goed functioneren van de openbare dienst of een onderneming als gevolg van een onbehoorlijke wijze
      van handelen of nalaten;
        - *onderzoek:* een onderzoek als bedoeld in [artikel 4][ref4];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *werkgever:* degene die krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke aanstelling
      arbeid laat verrichten of heeft laten verrichten dan wel degene die anders dan uit dienstbetrekking arbeid laat
      verrichten of heeft laten verrichten;
        - *werknemer:* degene die krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke aanstelling
      arbeid verricht of heeft verricht dan wel degene die anders dan uit dienstbetrekking arbeid verricht of heeft
      verricht;
        - *verzoeker:* de werknemer die de afdeling onderzoek verzoekt een onderzoek in te stellen;
        - *bureau:* het bureau, bedoeld in [artikel 3d][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel3a
