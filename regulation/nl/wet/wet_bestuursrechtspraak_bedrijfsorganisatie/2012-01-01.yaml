  - number: '20'
    text: |-
      1 Een belanghebbende en het bestuursorgaan kunnen bij het College hoger beroep instellen tegen een uitspraak van
      de rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een uitspraak van de
      voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], inzake een besluit, genomen
      op grond van een wettelijk voorschrift dat is opgenomen in de bijlage die bij deze wet behoort.

      2 Bij een wijziging van de bijlage blijft de bijlage zoals deze luidde voor het tijdstip van inwerkingtreding van
      de wijziging van toepassing ten aanzien van de mogelijkheid om hoger beroep in te stellen tegen een uitspraak die
      voor dat tijdstip is gedaan.

      3 Geen hoger beroep kan worden ingesteld tegen:

      a. een uitspraak van de rechtbank na toepassing van
      [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref3],

      b. een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref4],

      c. een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref5],

      d. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref6], en

      e. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75a, eerste lid][ref7], in verband met
      [artikel 8:84, vierde lid, van die wet][ref8].

      4 Tegelijkertijd met het hoger beroep tegen de in het eerste lid bedoelde uitspraak kan hoger beroep worden
      ingesteld tegen:

      a. een tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref9]; of

      b. een andere beslissing van de rechtbank.


