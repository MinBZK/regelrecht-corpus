  - number: '24'
    text: |-
      1 Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.

      2 Het griffierecht bedraagt:

      a. € 232 indien door een natuurlijke persoon hoger beroep is ingesteld, tenzij bij de wet anders is bepaald, en

      b. € 466 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.

      3 Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van de desbetreffende rechtspersoon een griffierecht geheven van € 466.

      4 De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van het College dan wel ter griffie dient te zijn gestort. Indien het bedrag niet
      binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.

      5 Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het hoger beroep
      wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.

      6 De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.

      7 Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 Van de verzoeker om een voorlopige voorziening wordt door de griffier een griffierecht geheven.[ Artikel 24,
      eerste lid, tweede en derde volzin, tweede en zesde lid](onbekend), is van overeenkomstige toepassing.

      2 [Artikel 24, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen welke
      de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De president
      kan een kortere termijn stellen.

      3 Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de president schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de griffier terugbetaald. In de overige gevallen
      kan de desbetreffende rechtspersoon, indien het verzoek wordt ingetrokken, het betaalde griffierecht geheel of
      gedeeltelijk vergoeden.

      4 De uitspraak kan inhouden dat het betaalde griffierecht door de door de president aangewezen rechtspersoon geheel
      of gedeeltelijk wordt vergoed.

      5 Indien het verzoek is gedaan door het bestuursorgaan en het verzoek geheel of gedeeltelijk wordt toegewezen,
      kan de uitspraak inhouden dat het betaalde griffierecht door de griffier aan de desbetreffende rechtspersoon wordt
      terugbetaald.

      6 Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel24
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel25
