        artikel: '24'
        hoofdstuk: II
  - number: '26'
    text: |-
      Het College bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van de gronden,
      of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel26
  - number: '27'
    text: |-
      1 Indien het College de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak tevens in
      dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de door het College aangewezen
      rechtspersoon wordt vergoed.

      2 In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de door het College
      aangewezen rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het College wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld, indien:

      a. de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en het College
      deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk ontvankelijkverklaring van het
      beroep, of

      b. het College om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak opnieuw door de rechtbank
      moet worden behandeld.

      2 De griffier zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel28
  - number: '29'
    text: |-
      In de gevallen, bedoeld in [artikel 28, eerste lid, onderdeel ][ref1], kan het College de zaak zonder terugwijzing
      afdoen, indien zij naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel28
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '28'
        hoofdstuk: II
  - number: '30'
    text: |-
      Indien het College van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan het de
      onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet bestuursrechtspraak bedrijfsorganisatie.'
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel31
