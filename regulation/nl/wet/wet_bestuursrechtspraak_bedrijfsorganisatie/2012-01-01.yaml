preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven omtrent het beroep tegen besluiten en
    handelingen van publiekrechtelijke bedrijfsorganisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden onder lichamen verstaan de Sociaal-Economische Raad, de bedrijfslichamen,
      bedoeld in [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1], en de lichamen, ingesteld ter
      gemeenschappelijke behartiging van belangen, bedoeld in [artikel 110 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel110
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel1
