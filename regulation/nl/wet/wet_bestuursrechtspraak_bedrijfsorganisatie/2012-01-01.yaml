  - number: '6'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van het College.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel6
  - number: '7'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van het College voor de
      behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel7
  - number: '18'
    text: |-
      1 Het College oordeelt, bij uitsluiting, in eerste aanleg tevens in hoogste ressort over het beroep, door een
      belanghebbende ingesteld tegen:

      a. een besluit van een lichaam, met uitzondering van een besluit op grond van de
      [Wet openbaarheid van bestuur][ref1], en

      b. een andere handeling, door een lichaam ten aanzien van hem ter uitvoering van zijn bestuurstaak verricht, met
      uitzondering van een privaatrechtelijke rechtshandeling.

      2 Het eerste lid is niet van toepassing voor zover de wet het beroep tegen bepaalde besluiten of andere handelingen
      anders regelt.

      3 Het College is voorts, bij uitsluiting, belast met de behandeling in eerste aanleg tevens in hoogste ressort van
      de bij de wet aan het College opgedragen geschillen.

      4 Op de bevoegdheid van het College zijn de [artikelen 8:1, derde lid][ref2], [8:2][ref3], [8:3][ref4],
      [8:4, aanhef en onderdeel j][ref5], en [8:6, tweede lid, van de Algemene wet bestuursrecht][ref6] van toepassing.


