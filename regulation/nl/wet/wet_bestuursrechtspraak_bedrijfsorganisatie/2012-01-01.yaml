  - number: '21'
    text: |-
      1 De griffier doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.

      2 De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voor zover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002144/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van [afdeling
      8.1.1](onbekend) en de [artikelen 8:10](onbekend), [8:13](onbekend), [8:41](onbekend), [8:51a, eerste lid][ref2],
      [8:74](onbekend) en [8:82](onbekend), van overeenkomstige toepassing, voor zover in dit hoofdstuk niet anders is
      bepaald. [Artikel 8:86, eerste lid](onbekend), kan slechts worden toegepast indien een enkelvoudige kamer van de
      rechtbank uitspraak op het beroep heeft gedaan.

      2 De zaken die bij het College aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige kamer.

      3 Indien een zaak die door een enkelvoudige kamer van de rechtbank is behandeld naar het oordeel van de meervoudige
      kamer geschikt is voor verdere behandeling door één rechter, kan zij deze verwijzen naar een enkelvoudige kamer.

      4 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.

      5 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.

      6 Het College kan het bestuursorgaan opdragen een gebrek in het bestreden besluit te herstellen of te laten
      herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als partij aan het geding
      deelnemen daardoor onevenredig kunnen worden benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
