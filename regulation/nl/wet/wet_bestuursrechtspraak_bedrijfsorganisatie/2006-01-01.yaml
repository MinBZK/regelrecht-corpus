        artikel: '21'
  - number: 4.a
    text: |-
      het bestuur bestaat uit een voorzitter, een niet-rechterlijk lid en ten hoogste vier andere leden met rechtspraak
      belast van het College als bedoeld in [artikel 3, tweede lid, onderdelen a tot en met c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel3
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '3'
  - number: 4.b
    text: |-
      de voorzitter onderscheidenlijk de andere leden met rechtspraak belast, bedoeld in onderdeel a, in verband met het
      verrichten van de werkzaamheden als voorzitter onderscheidenlijk lid van het bestuur een toelage ontvangen op het
      salaris dat zij overeenkomstig de [Wet rechtspositie rechterlijke ambtenaren][ref1] genieten, waarvan het bedrag
      gelijk is aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van lid van
      het bestuur vast te stellen salarishoogte;


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: 4.c
    text: |-
      bij algemene maatregel van bestuur nadere regels worden gesteld over de onkostenvergoeding van de voorzitter en de
      andere leden met rechtspraak belast, bedoeld in onderdeel a, en de bezoldiging van het niet-rechterlijk lid;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
  - number: 4.d
    text: |-
      een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, wordt ontslagen onderscheidenlijk
      geschorst als lid van het bestuur indien hij als lid met rechtspraak belast wordt ontslagen onderscheidenlijk
      geschorst;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
  - number: 4.e
    text: een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, op eigen verzoek wordt ontslagen;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
  - number: 4.f
    text: |-
      de voorzitter en de andere leden, niet zijnde niet-rechterlijk lid, tevens staatsraad in buitengewone dienst kunnen
      zijn;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
  - number: 4.g
    text: |-
      het bestuur bevoegd is organisatorische eenheden in te stellen die belast worden met het behandelen en beslissen
      van de soorten zaken die door het bestuur aan die eenheden worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Op de leden met rechtspraak belast is het bepaalde bij en krachtens de
      [Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van het bepaalde bij en krachtens de
      [artikelen 1b][ref2], [1g, tweede lid, onderdelen a en b, en vijfde lid][ref3], en [10][ref4] en het krachtens
      [artikel 54, eerste lid][ref5], ter aanvulling hiervan bepaalde, van overeenkomstige toepassing, met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1b
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel54
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1b
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 1g
      - id: ref4
        bwb_id: BWBR0008365
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0008365
        artikel: '54'
  - number: 5.1.a
    text: |-
      wat hun bezoldiging, onkostenvergoeding, benoeming en ambtskostuum betreft de coördinerend vice-presidenten, de
      vice-presidenten, de raadsheren en de raadsheren-plaatsvervangers worden gelijkgesteld met diezelfde ambten bij
      een gerechtshof;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.b
    text: het bestuur wordt aangemerkt als hun functionele autoriteit;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.c
    text: |-
      het bestuur de lijst van aanbeveling opmaakt bij het openvallen van een plaats van coördinerend vice-president,
      vice-president, raadsheer of raadsheer-plaatsvervanger, de raadsheren-plaatsvervangers oproept voor het verrichten
      van werkzaamheden, en de werkzaamheden van de leden met rechtspraak belast verdeelt;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.d
    text: |-
      de eed of belofte wordt afgelegd ten overstaan van een enkelvoudige of meervoudige kamer van het College en niet
      wordt afgenomen op requisitoir van het openbaar ministerie dan wel van de procureur-generaal bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.e
    text: |-
      het bestuur een register bijhoudt waarin de koninklijke besluiten betreffende de benoeming van de daar beëdigde
      leden met rechtspraak belast en de formulieren betreffende de afgelegde eed of belofte worden bewaard, en aan het
      lid met rechtspraak belast een uittreksel uit dat register, inclusief het formulier betreffende de eed of belofte,
      wordt uitgereikt;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.f
    text: |-
      voor de overeenkomstige toepassing van [artikel 46 van de Wet rechtspositie rechterlijke ambtenaren][ref1] de leden
      met rechtspraak belast worden gelijkgesteld met rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof of
      een rechtbank;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '46'
  - number: 5.1.g
    text: |-
      het lid met rechtspraak belast, dat tevens voorzitter van het bestuur is, bevoegd is tot het opleggen van de
      disciplinaire maatregel van schriftelijke waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.1.h
    text: |-
      voor de overeenkomstige toepassing van [artikel 46a van de Wet rechtspositie rechterlijke ambtenaren][ref1] onder
      functionele autoriteit het bestuur, uitgezonderd het niet-rechterlijk lid, wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46a
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46a
  - number: 5.1.i
    text: |-
      voor de overeenkomstige toepassing van
      [artikel 46o, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1] onder functionele autoriteit het
      lid met rechtspraak belast, dat tevens voorzitter van het bestuur is, wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
  - number: '5.2'
    text: |-
      Op de gerechtsauditeurs is het bepaalde bij of krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref1],
      voorzover betrekking hebbend op gerechtsauditeurs, van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: 5.2.a
    text: het bestuur als functionele autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.2.b
    text: |-
      de eed of belofte wordt afgelegd ten overstaan van een enkelvoudige of meervoudige kamer van het College en niet
      wordt afgenomen op requisitoir van het openbaar ministerie dan wel van de procureur-generaal bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.2.c
    text: |-
      het bestuur een register bijhoudt waarin de koninklijke besluiten betreffende de benoeming van de daar
      beëdigde gerechtsauditeurs en de formulieren betreffende de afgelegde eed of belofte worden bewaard, en aan de
      gerechtsauditeur een uittreksel uit dat register, inclusief het formulier betreffende de eed of belofte, wordt
      uitgereikt;
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
  - number: 5.2.d
    text: |-
      voor de overeenkomstige toepassing van [artikel 46 van de Wet rechtspositie rechterlijke ambtenaren][ref1] de
      gerechtsauditeurs worden gelijkgesteld met rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof of een
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '46'
  - number: '6'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van het College.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel6
  - number: '7'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van het College voor de
      behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel7
  - number: '18.1'
    text: |-
      Het College oordeelt, bij uitsluiting, in eerste aanleg tevens in hoogste ressort over het beroep, door een
      belanghebbende ingesteld tegen:
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
  - number: 18.1.a
    text: |-
      een besluit van een lichaam, met uitzondering van een besluit op grond van de [Wet openbaarheid van bestuur][ref1]
      en een besluit tot invordering bij dwangbevel, en


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 18.1.b
    text: |-
      een andere handeling, door een lichaam ten aanzien van hem ter uitvoering van zijn bestuurstaak verricht, met
      uitzondering van een privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover de wet het beroep tegen bepaalde besluiten of andere handelingen
      anders regelt.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het College is voorts, bij uitsluiting, belast met de behandeling in eerste aanleg tevens in hoogste ressort van de
      bij de wet aan het College opgedragen geschillen.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
  - number: '18.4'
    text: |-
      Op de bevoegdheid van het College zijn de [artikelen 8:1, derde lid][ref1], [8:2][ref2], [8:3][ref3],
      [8:4, aanhef en onderdeel j][ref4], en [8:6, tweede lid, van de Algemene wet bestuursrecht][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '19.1'
    text: |-
      Ten aanzien van besluiten en andere handelingen is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met
      uitzondering van [afdeling 8.1.1][ref2] en de [artikelen 8:10](onbekend) en [8:13](onbekend), van overeenkomstige
      toepassing, met dien verstande dat [artikel 8:86, eerste lid](onbekend), slechts kan worden toegepast indien
      partijen daarvoor toestemming hebben gegeven. Ook hierop worden partijen in de uitnodiging, bedoeld in [artikel
      8:83, eerste lid](onbekend), gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.1.1
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.1.1
  - number: '19.2'
    text: De zaken die bij het College aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel19
  - number: '19.3'
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel19
  - number: '19.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel19
  - number: '19.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een belanghebbende en het bestuursorgaan kunnen bij het College hoger beroep instellen tegen een uitspraak van de
      rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een uitspraak van de
      voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], inzake een besluit, genomen
      op grond van een wettelijk voorschrift dat is opgenomen in de bijlage die bij deze wet behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.2'
    text: |-
      Bij een wijziging van de bijlage blijft de bijlage zoals deze luidde voor het tijdstip van inwerkingtreding van de
      wijziging van toepassing ten aanzien van de mogelijkheid om hoger beroep in te stellen tegen een uitspraak die voor
      dat tijdstip is gedaan.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
  - number: '20.3'
    text: 'Geen hoger beroep kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
  - number: 20.3.a
    text: |-
      een uitspraak van de rechtbank na toepassing van [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.3.b
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.3.c
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.3.d
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.3.e
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75a, eerste lid][ref1], in verband met
      [artikel 8:84, vierde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.4'
    text: |-
      Tegen andere beslissingen van de rechtbank onderscheidenlijk de voorzieningenrechter kan slechts tegelijkertijd met
      het hoger beroep tegen de in het eerste lid bedoelde uitspraak hoger beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel20
  - number: '21.1'
    text: |-
      De griffier doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel21
  - number: '21.2'
    text: |-
      De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voor zover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel21
  - number: '22.1'
    text: |-
      Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van [afdeling
      8.1.1](onbekend) en de [artikelen 8:10](onbekend), [8:13](onbekend), [8:41](onbekend), [8:74](onbekend) en [8:82]
      (onbekend), van overeenkomstige toepassing, voor zover in dit hoofdstuk niet anders is bepaald. [Artikel 8:86,
      eerste lid](onbekend), kan slechts worden toegepast indien een enkelvoudige kamer van de rechtbank uitspraak op het
      beroep heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '22.2'
    text: De zaken die bij het College aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien een zaak die door een enkelvoudige kamer van de rechtbank is behandeld naar het oordeel van de meervoudige
      kamer geschikt is voor verdere behandeling door één rechter, kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel22
  - number: '22.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel22
  - number: '23.1'
    text: |-
      In geval van intrekking van het hoger beroep door het bestuursorgaan kan het bestuursorgaan
      op verzoek van een partij bij afzonderlijke uitspraak met overeenkomstige toepassing van
      [artikel 8:75 van de Algemene wet bestuursrecht][ref1] in de kosten worden veroordeeld. Indien het hoger beroep
      mondeling wordt ingetrokken, wordt het verzoek door de partij die daarbij aanwezig is mondeling gedaan tegelijk
      met de intrekking van het hoger beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-
      ontvankelijk verklaard. Indien het hoger beroep schriftelijk wordt ingetrokken, wordt het verzoek schriftelijk
      gedaan. De [artikelen 6:5 tot en met 6:9][ref2], [6:11][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6] en
      [6:21 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '23.2'
    text: |-
      [Artikel 8:73][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '24.1'
    text: |-
      Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.2'
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: 24.2.a
    text: € 207 indien door een natuurlijke persoon hoger beroep is ingesteld, tenzij bij de wet anders is bepaald, en
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: 24.2.b
    text: € 414 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van de desbetreffende rechtspersoon een griffierecht geheven van € 414.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.4'
    text: |-
      De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van het College dan wel ter griffie dient te zijn gestort. Indien het bedrag niet
      binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.5'
    text: |-
      Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het hoger beroep
      wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.6'
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '24.7'
    text: Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel24
  - number: '25.1'
    text: |-
      Van de verzoeker om een voorlopige voorziening wordt door de griffier een griffierecht geheven.[ Artikel 24, eerste
      lid, tweede en derde volzin, tweede en zesde lid](onbekend), is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
  - number: '25.2'
    text: |-
      [Artikel 24, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen welke
      de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De president
      kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel24
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '24'
        hoofdstuk: II
  - number: '25.3'
    text: |-
      Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de president schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de griffier terugbetaald. In de overige gevallen
      kan de desbetreffende rechtspersoon, indien het verzoek wordt ingetrokken, het betaalde griffierecht geheel of
      gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
  - number: '25.4'
    text: |-
      De uitspraak kan inhouden dat het betaalde griffierecht door de door de president aangewezen rechtspersoon geheel
      of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
  - number: '25.5'
    text: |-
      Indien het verzoek is gedaan door het bestuursorgaan en het verzoek geheel of gedeeltelijk wordt toegewezen, kan
      de uitspraak inhouden dat het betaalde griffierecht door de griffier aan de desbetreffende rechtspersoon wordt
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
  - number: '25.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel25
  - number: '26'
    text: |-
      Het College bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van de gronden,
      of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel26
  - number: '27.1'
    text: |-
      Indien het College de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak tevens in
      dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de door het College aangewezen
      rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel27
  - number: '27.2'
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de door het College aangewezen
      rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel27
  - number: '28.1'
    text: 'Het College wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld, indien:'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel28
  - number: 28.1.a
    text: |-
      de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en het College
      deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk ontvankelijkverklaring van het
      beroep, of
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel28
  - number: 28.1.b
    text: |-
      het College om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak opnieuw door de rechtbank
      moet worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel28
  - number: '28.2'
    text: |-
      De griffier zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel28
  - number: '29'
    text: |-
      In de gevallen, bedoeld in [artikel 28, eerste lid, onderdeel ][ref1], kan het College de zaak zonder terugwijzing
      afdoen, indien zij naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel28
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '28'
        hoofdstuk: II
  - number: '30'
    text: |-
      Indien het College van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan het de
      onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet bestuursrechtspraak bedrijfsorganisatie.'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel31
