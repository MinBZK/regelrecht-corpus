preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven omtrent het beroep tegen besluiten en
    handelingen van publiekrechtelijke bedrijfsorganisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden onder lichamen verstaan de Sociaal-Economische Raad, de bedrijfslichamen,
      bedoeld in [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1], en de lichamen, ingesteld ter
      gemeenschappelijke behartiging van belangen, bedoeld in [artikel 110 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel110
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '110'
  - number: '2'
    text: Er is een College van Beroep voor het bedrijfsleven, verder te noemen het College, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel2
  - number: '3.1'
    text: 'Bij het College zijn werkzaam:'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.1.a
    text: leden met rechtspraak belast, en
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.1.b
    text: gerechtsambtenaren.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: '3.2'
    text: 'De leden met rechtspraak belast, werkzaam bij het College zijn:'
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.2.a
    text: coördinerend vice-presidenten,
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.2.b
    text: vice-presidenten,
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.2.c
    text: raadsheren,
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: 3.2.d
    text: raadsheren-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Het bij en krachtens de [afdelingen 1][ref1], [2][ref2] en
      [6 van hoofdstuk 2 van de Wet op de rechterlijke organisatie][ref3] bepaalde is, met uitzondering van de
      [artikelen 2][ref4], [3][ref5], [9][ref6], [11][ref7], [20][ref8] en [21][ref9], van overeenkomstige toepassing
      op het College, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Afdeling6
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0001830#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0001830#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0001830#Artikel11
      [ref8]: https://wetten.overheid.nl/BWBR0001830#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0001830#Artikel21
    url: https://wetten.overheid.nl/BWBR0002144/2006-01-01#Artikel4
    references:
      - id: ref1
