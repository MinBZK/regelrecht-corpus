  - number: 4a
    text: |-
      Het College vormt en bezet op voorstel van de president grote kamers. Deze bestaan uit vijf leden, van wie een als
      voorzitter optreedt.
    url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Op de leden met rechtspraak belast is de [Wet rechtspositie rechterlijke ambtenaren][ref1], voor zover
      betrekking hebbend op rechterlijke ambtenaren met rechtspraak belast, met uitzondering van de [artikelen 5a][ref2],
      [5b][ref3], [5c, vierde tot en met zesde lid][ref4], en [5g, tweede lid, onderdeel a, en vierde lid][ref5], van
      overeenkomstige toepassing, met dien verstande dat:

      a. het bestuur wordt aangemerkt als hun functionele autoriteit;

      b. zij met betrekking tot hun benoeming en salaris worden gelijkgesteld met degenen die hetzelfde ambt vervullen
      bij een gerechtshof;

      c. het bestuur de lijst van aanbeveling opmaakt bij het openvallen van een plaats van senior raadsheer, raadsheer
      of raadsheer-plaatsvervanger en de Raad voor de rechtspraak deze lijst telkens, onder medezending van een advies
      hierover, aan Onze Minister van Veiligheid en Justitie doorzendt met het oog op een voordracht voor benoeming
      overeenkomstig [artikel 2, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref6];

      d. zij voor de overeenkomstige toepassing van de [artikelen 6][ref7], [45][ref8] en [46][ref9] worden gelijkgesteld
      met bij een gerechtshof of rechtbank werkzame rechterlijke ambtenaren;

      e. zij voor de overeenkomstige toepassing van [artikel 13][ref10] worden gelijkgesteld met rechterlijke ambtenaren
      van wie de eerste benoeming een ambt bij een gerechtshof of rechtbank betreft;

      f. het bestuur de werkzaamheden van de leden met rechtspraak belast verdeelt; en

      g. het lid met rechtspraak belast, dat tevens president is van het College, ten aanzien van hen bevoegd is tot het
      opleggen van de disciplinaire maatregel van schriftelijke berisping, het verrichten van de beoordeling, bedoeld in
      [artikel 44, zesde lid][ref11], en het doen van een verzoek aan de procureur-generaal bij de Hoge Raad, bedoeld in
      [artikel 46o, tweede lid][ref12].

      2 Op de senior-gerechtsauditeurs en gerechtsauditeurs is de [Wet rechtspositie rechterlijke ambtenaren][ref13],
      voor zover betrekking hebbend op senior-gerechtsauditeurs en gerechtsauditeurs, met uitzondering van
      [artikel 5b][ref14], van overeenkomstige toepassing, met dien verstande dat:

      a. het bestuur wordt aangemerkt als hun functionele autoriteit;

      b. zij voor de overeenkomstige toepassing van de [artikelen 6][ref15], [45][ref16] en [46][ref17] worden
      gelijkgesteld met rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof of rechtbank;

      c. het bestuur de werkzaamheden van de senior-gerechtsauditeurs en gerechtsauditeurs verdeelt; en

      d. zij voor de overeenkomstige toepassing van [artikel 13][ref18] worden gelijkgesteld met rechterlijke ambtenaren
      van wie de eerste benoeming een ambt bij een gerechtshof of rechtbank betreft.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de overeenkomstige
      toepassing van het krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref19] bepaalde ten aanzien van de in
      het eerste en tweede lid genoemde leden met rechtspraak belast, senior-gerechtsauditeurs en gerechtsauditeurs.


