  - number: '6'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van het College.
    url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#Artikel6
  - number: '7'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van het College voor de
      behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#Artikel7
