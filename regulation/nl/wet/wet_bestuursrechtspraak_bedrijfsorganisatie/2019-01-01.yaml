preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven omtrent het beroep tegen besluiten en
    handelingen van publiekrechtelijke bedrijfsorganisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#ArtikelAanhef
articles:
  - number: '2'
    text: Er is een College van Beroep voor het bedrijfsleven, verder te noemen het College, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij het College zijn werkzaam:

      a. leden met rechtspraak belast, en

      b. gerechtsambtenaren.

      2 De leden met rechtspraak belast, werkzaam bij het College zijn:

      a. senior raadsheren;

      b. raadsheren;

      c. raadsheren-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0002144/2019-01-01#Artikel3
  - number: '4'
    text: |-
      Het bepaalde bij en krachtens de [afdelingen 1][ref1], [1A][ref2], [2][ref3] en
      [6 van hoofdstuk 2 van de Wet op de rechterlijke organisatie][ref4] is, met uitzondering van de
      [artikelen 2][ref5], [3][ref6], [9][ref7], [11][ref8], [20, tweede lid][ref9], [21][ref10], [21b][ref11] en
      [23a][ref12], van overeenkomstige toepassing op het College, met dien verstande dat:

      a. het bestuur bestaat uit drie leden, waaronder de voorzitter, waarbij geldt dat twee
      leden, waaronder de voorzitter, leden met rechtspraak belast van het College als bedoeld in
      [artikel 3, tweede lid, onderdeel a of b][ref13], zijn;

      b. de voorzitter onderscheidenlijk het andere rechterlijk lid gedurende zijn benoemingsduur als
      voorzitter onderscheidenlijk ander rechterlijk lid, in plaats van zijn salaris overeenkomstig het
      bepaalde bij en krachtens [artikel 7 van de Wet rechtspositie rechterlijke ambtenaren][ref14],
      een bij algemene maatregel van bestuur vast te stellen salaris behorende bij de vervulling van
      de functie van voorzitter onderscheidenlijk ander rechterlijk lid ontvangt, en dat daarop de
      [artikelen 6][ref15], [13 tot en met 15][ref16], [17, eerste tot en met vijfde lid][ref17], en
      [18 tot en met 19 van de Wet rechtspositie rechterlijke ambtenaren][ref18] van overeenkomstige toepassing zijn;

      c. de voorzitter onderscheidenlijk het andere rechterlijk lid na het verstrijken van een benoemingsduur van ten
      minste zes aaneengesloten jaren, met ingang van de datum waarop hij zijn werkzaamheden als zodanig beëindigt,
      gedurende drie jaren een toelage ontvangt op het salaris dat hij overeenkomstig het bepaalde bij en krachtens
      [artikel 7 van de Wet rechtspositie rechterlijke ambtenaren][ref19] geniet, waarvan het bedrag gelijk is
      aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van voorzitter
      onderscheidenlijk ander rechterlijk lid vast te stellen salarishoogte;

      d. bij algemene maatregel van bestuur nadere regels worden gesteld over het salaris van de leden van het bestuur en
      de onkostenvergoeding van de voorzitter en het andere rechterlijk lid;

      e. de griffie alle werkdagen gedurende ten minste zes uren per dag is geopend;

      f. de voorzitter en het andere rechterlijk lid tevens staatsraad of staatsraad in buitengewone dienst kunnen zijn;

      g. de voorzitter en het andere rechterlijk lid van het bestuur niet tevens lid kunnen zijn van het bestuur van
      een rechtbank, het bestuur van een gerechtshof of het bestuur van de Centrale Raad van Beroep, behoudens het
      geval van tijdelijke waarneming, en het niet-rechterlijk lid van het bestuur, naast het geval van tijdelijke
      waarneming, slechts in bijzondere gevallen tevens lid kan zijn van het bestuur van één rechtbank, het bestuur van
      één gerechtshof of het bestuur van de Centrale Raad van Beroep.


