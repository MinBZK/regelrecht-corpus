  - number: '6'
    text: |-
      1 Het is niet toegestaan zuiveringsslib, de in [bijlage Aa, onder I en II][ref1], opgenomen stoffen of de in
      [bijlage Aa, onder IV][ref2], opgenomen eindproducten van de aldaar omschreven bewerkingsprocédés, onderling of met
      andere meststoffen te mengen.

      2 In afwijking van het eerste lid, is het toegestaan verschillende partijen vloeibaar zuiveringsslib onderling
      te mengen, mits de gehalten stikstof en fosfaat in de afzonderlijke partijen zijn vastgesteld overeenkomstig de
      [artikelen 92a][ref3] en [92b][ref4] en deze afzonderlijke partijen overigens voldoen aan de bij of krachtens
      [hoofdstuk III van het besluit][ref5] ter zake van zuiveringsslib gestelde regels.

      3 Het is slechts toegestaan andere dan in het eerste lid bedoelde meststoffen te mengen, indien deze meststoffen
      afzonderlijk voldoen aan de bij of krachtens [hoofdstuk III van het besluit][ref6] ter zake van die meststoffen
      gestelde regels en het mengsel voldoet aan de bij of krachtens [hoofdstuk III van het besluit][ref7] ter zake van
      die meststoffen gestelde regels.

      4 In afwijking van het eerste lid is het toegestaan de in [bijlage Aa][ref8], onder IV, opgenomen eindproducten van
      de aldaar omschreven bewerkingprocedés, die zijn gebruikt als strooisel in stallen te mengen met dierlijke mest in
      de mestkelder.

      5 In afwijking van het eerste lid is het toegestaan de dunne fractie die is ontstaan op het eigen bedrijf door
      scheiding van ‘covergiste mest’ als bedoeld in [bijlage Aa, onder IV][ref9], te gebruiken om niet verpompbare
      covergistingsmaterialen te verdunnen.


