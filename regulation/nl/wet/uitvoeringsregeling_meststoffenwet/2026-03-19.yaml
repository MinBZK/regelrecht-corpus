      desbetreffende meststoffen volgens algemeen geldende bemonsteringsprincipes genomen representatief monster.

      2 De bemonstering van zuiveringsslib geschiedt ten minste in de frequentie, bedoeld in [artikel 9][ref1], in
      samenhang met bijlage IIA, van richtlijn nr. 86/278/EEG van de Raad van de Europese Gemeenschappen van 12 juni
      1986, betreffende de bescherming van het milieu, in het bijzonder de bodem, bij het gebruik van zuiveringsslib in
      de landbouw (PbEG L 181).

      3 De analyse van het monster geschiedt overeenkomstig het protocol, dat voor de te onderscheiden categorieën
