      1 Als forfaitaire productienormen als bedoeld in [artikel 66, eerste lid, van het besluit][ref1]
      worden voor de onderscheiden diersoorten en diercategorieën de normen vastgesteld, die zijn vermeld in
      [bijlage D, tabel IA, kolommen B en C][ref2].

      2 De begripsbepalingen van boerderijmelk, ontvanger van boerderijmelk en leverantie van boerderijmelk, bedoeld in
      [artikel 1.1 van het Besluit dierlijke producten][ref3] en de begripsbepaling van melkcontrolestation, bedoeld in
      [artikel 2.10 van de Regeling dierlijke producten][ref4], zijn van overeenkomstige toepassing in deze paragraaf.

      3 Voor zover het dieren betreft die worden gehouden op een bedrijf waarvoor een inkennisstelling heeft
      plaatsgevonden als bedoeld in [artikel 2.14, eerste lid, van de Regeling dierlijke producten][ref5], en die behoren
      tot de in [bijlage D, tabel IB, deel 1 of deel 2][ref6], onderscheiden categorieën dieren, zijn in afwijking van
      het eerste lid de normen van toepassing die zijn vermeld in deel 1, kolom C, onderscheidenlijk deel 2 van die
      tabel.


