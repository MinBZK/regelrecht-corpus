    text: |-
      De landbouwer stelt in Nederland zijn administratie voor controle beschikbaar aan de krachtens [artikel 129][ref1]
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel129
