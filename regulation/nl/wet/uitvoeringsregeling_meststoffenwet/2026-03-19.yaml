  - number: '46'
    text: |-
      1 De gegevens, bedoeld in [artikel 39, tweede lid, onderdeel b, van het besluit][ref1], worden bijgehouden op het
      daartoe door de minister verstrekte formulier.

      2 In plaats van het in het eerste lid bedoelde formulier kunnen andere gegevensdragers worden gebruikt, onder
      de voorwaarde dat daarbij dezelfde berekeningswijze wordt gehanteerd als bij gebruik van het in het eerste lid
      bedoelde formulier, het geval zou zijn geweest.

      3 Voor zover het hoeveelheden dierlijke meststoffen, zuiveringsslib of compost betreft, worden de gegevens,
      bedoeld in [artikel 39, tweede lid, onderdeel b, van het besluit][ref2], ingevuld zoals deze voor de desbetreffende
      hoeveelheid ook zijn opgenomen in rVDM, onderscheidenlijk zoals deze ook zijn vermeld op het op de desbetreffende
      hoeveelheid betrekking hebbende vervoersbewijs zuiveringsslib en compost en op het ter zake door het laboratorium
      verstrekte overzicht van de analyseresultaten.

      4 Voor zover het hoeveelheden mestkorrels, overige organische meststoffen en anorganische meststoffen betreft,
      worden de gegevens, bedoeld in [artikel 39, tweede lid, onderdeel b, van het besluit][ref3], overgenomen van het
      etiket op de verpakking, dan wel van het begeleidend document bij de meststoffen.

      5 Behalve de gegevens, bedoeld in [artikel 39, tweede en derde lid, van het besluit][ref4], bevat de administratie
      met betrekking tot de overdracht van een opslagruimte voor meststoffen, bedoeld in artikel 39, tweede lid,
      onderdeel d, van het besluit, het door de minister ter identificatie verstrekte relatienummer van de bij deze
      overdracht betrokken intermediaire onderneming.

      6 Indien op een onderneming zuiveringsslib wordt geproduceerd of anderszins wordt behandeld, bevat de administratie
      behalve de gegevens, bedoeld in [artikel 39, tweede en derde lid, van het besluit][ref5] tevens gegevens over:

      a. de in [artikel 16, eerste lid, van het besluit][ref6] bedoelde behandelingsmethode voor zuiveringsslib;

      b. de hoeveelheid geproduceerd, behandeld zuiveringsslib; en

      c. de gehalten aan droge stof, fosfaat en stikstof, de pH-waarde, het organisch stofgehalte en de hoeveelheden van
      de in [bijlage II, onder tabel 2, bij het besluit][ref7] opgenomen zware metalen in het zuiveringsslib alsmede de
      resultaten van de uitgevoerde bemonsteringen en analyses, bedoeld in [artikel 21][ref8].

      7 Indien op een onderneming compost wordt geproduceerd of anderszins wordt behandeld, bevat de administratie
      behalve de gegevens, bedoeld in [artikel 39, tweede en derde lid, van het besluit][ref9] tevens gegevens over:

      a. de hoeveelheid geproduceerde, behandelde compost; en

      b. de gehalten aan droge stof, fosfaat en stikstof, het organisch stofgehalte en de hoeveelheden van de in
      [bijlage II, onder tabel 3, bij het besluit][ref10] opgenomen zware metalen.

      8 Indien op een onderneming ‘covergiste mest’ als bedoeld in [bijlage Aa][ref11], onder IV wordt geproduceerd,
      worden de gegevens, bedoeld in [artikel 39, derde lid, onderdeel c, van het besluit][ref12], onderscheiden
      naar de tezamen met de dierlijke meststoffen vergiste stoffen overeenkomstig de aanduiding en de daarbij
      behorende omschrijving van de desbetreffende stof in bijlage Aa, onder IV, en bevat de administratie behalve de
      gegevens, bedoeld in artikel 39, derde lid, van het besluit, gegevens over het bedrijf of de onderneming waar de
      desbetreffende stof als reststof is vrijgekomen.

      9 Ingeval van overdracht van een opslagruimte voor meststoffen door of aan een intermediair, bevat de administratie
      van de intermediair tevens het bewijs van overdracht en de gegevens, bedoeld in [artikel 48a, tweede lid][ref13].

      10 Indien op een onderneming substraat wordt geproduceerd, bevat de administratie behalve de gegevens, bedoeld in
      [artikel 39, tweede en derde lid, van het besluit][ref14], tevens gegevens over:

      a. een overzicht van welke hoeveelheid substraat, inclusief de gehalten aan stikstof en fosfaat, aan welke
      champignonteler is geleverd;

      b. de hoeveelheid geëxporteerd substraat, inclusief de gehalten aan stikstof en fosfaat.

      11 Indien een intermediair mestkorrels produceert, bevat de administratie behalve de gegevens, bedoeld in
      [artikel 39, tweede en derde lid, van het besluit][ref15], tevens gegevens over:

      a. een overzicht van welke hoeveelheid mestkorrels uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat, aan welk bedrijf of intermediaire onderneming is geleverd;

      b. de hoeveelheid geëxporteerde mestkorrels, inclusief de gehalten aan stikstof en fosfaat;

      c. de hoeveelheid mestkorrels, inclusief de gehalten aan stikstof en fosfaat die aan afnemers niet zijnde een
      bedrijf of intermediaire onderneming zijn geleverd.

      12 Indien op een onderneming een mengsel van vaste meststoffen wordt geproduceerd, dat ten hoogste 10%
      vaste dierlijke meststoffen of 10% champost bevat, bevat de administratie behalve de gegevens, bedoeld in
      [artikel 39, tweede en derde lid, van het besluit][ref16], tevens gegevens over:

      a. een overzicht van welke hoeveelheid meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat, aan welk bedrijf of welke intermediaire onderneming is geleverd;

      b. de hoeveelheid geëxporteerde meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat;

      c. de hoeveelheid meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en fosfaat die aan
      afnemers niet zijnde een bedrijf of intermediaire onderneming zijn geleverd;

      d. de mestcode dan wel de mestcodes, bedoeld in [bijlage I][ref17], van de desbetreffende mestsoort of mestsoorten
      en de percentages van elke afzonderlijke meststof in het mengsel.

      13 Ingeval van gebruik van het in [artikel 69r][ref18] bedoelde middel, bevat de administratie, tevens de op basis
      van dat middel vereiste gegevens.


