    text: |-
      1 De kennisgeving, bedoeld in [artikel 31, tweede lid, van de wet][ref1], geschiedt bij de minister.

      2 Bij de kennisgeving, bedoeld in het eerste lid, worden in ieder geval de volgende gegevens verstrekt:

      a. het door de minister ter identificatie van het bedrijf verstrekte relatienummer; en

      b. indien een gedeelte van het productierecht komt te vervallen, het aantal varkenseenheden, onderscheidenlijk
      pluimvee-eenheden, of kilogrammen fosfaat dat komt te vervallen.


