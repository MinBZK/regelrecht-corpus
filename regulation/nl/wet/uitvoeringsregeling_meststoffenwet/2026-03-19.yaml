  - number: 69d
    text: |-
      1 De [artikelen 48][ref1], [48b][ref2] en [49 van het besluit][ref3] en [artikel 56][ref4] zijn niet van toepassing
      op de afvoer van kalvergier van een bedrijf dat rechtstreeks, zonder tussenopslag, wordt vervoerd naar een
      kalvergierbewerkingsinstallatie in beheer bij de Stichting Mestverwerking Gelderland op basis van een schriftelijke
      overeenkomst tussen de leverancier en de afnemer die is afgesloten voordat het vervoer van de desbetreffende vracht
      plaatsvond.

      2 Bij vervoer van kalvergier overeenkomstig het eerste lid, geschiedt de bemonstering en de verpakking
      van de genomen monsters, in afwijking van [artikel 76, eerste lid][ref5], in samenhang met de
      [artikelen 58, eerste lid][ref6], [78][ref7], onderscheidenlijk [79][ref8], door de afnemer met behulp van
      op de kalvergierbewerkingsinstallatie aangebrachte automatische bemonsteringsapparatuur en automatische
      verpakkingsapparatuur als bedoeld in artikel 78 onderscheidenlijk artikel 79, eerste lid.

      3 Het gewicht van de hoeveelheid kalvergier, vervoerd overeenkomstig het eerste lid, wordt in afwijking
      van [artikel 59, eerste lid][ref9], door de vervoerder bepaald met behulp van een op de locatie van de
      kalvergierbewerkingsinstallatie aangebracht weegwerktuig.

      4 Bij het vervoer van kalvergier overeenkomstig het eerste lid, geschiedt de weegmelding, in afwijking van
      [artikel 59][ref10], onverwijld na de melding, bedoeld in [artikel 60][ref11].

      5 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      6 De afnemer stuurt het overeenkomstig het tweede lid verkregen monster onder vermelding van het rVDM-nummer en
      het nummer van het deksel van de monsterpot en het nummer van de monsterpot of de monsterverpakking, uiterlijk tien
      werkdagen na bemonstering aan een door de minister erkend laboratorium als bedoeld in artikel 80a.

      7 [Artikel 80, derde lid][ref12], is van overeenkomstige toepassing.


