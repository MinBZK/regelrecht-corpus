  - number: 28c
    text: |-
      1 De hoeveelheid stikstof, bedoeld in [artikel 28, eerste lid][ref1], wordt vermeerderd met de in
      [bijlage A][ref2], tabel 1a, vermelde hoeveelheid stikstof per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond indien een bedrijf de in bijlage A, tabel 1a, gemiddelde gewasopbrengst heeft van het totale areaal
      van een gewas als bedoeld in tabel 1a, gemeten over de drie aan het desbetreffende jaar voorafgaande jaren.

      2 De landbouwer die gebruik maakt van de verhoging van de stikstofgebruiksnorm, bedoeld in het eerste lid:

      a. heeft, voor zover het de gewassen genoemd in [artikel 28a, eerste lid][ref3], betreft, de afnemers, bedoeld in
      het derde lid, gemachtigd om desgevraagd gegevens over de afgenomen hoeveelheden van het desbetreffende gewas te
      verstrekken aan de minister;

      b. beschikt, voor zover het de andere gewassen dan die genoemd in [artikel 28a, eerste lid][ref4], betreft,
      over schriftelijk bewijs waaruit blijkt dat het gewas aan een afnemer is geleverd en waaruit blijkt wat de
      gewasopbrengst is die aan een afnemer is geleverd. Onder schriftelijk bewijs wordt in ieder geval facturen en
      afleverbewijzen van de gewassen en historische financiële informatie verstaan;

      c. beschikt, voor zover het andere gewassen dan die genoemd in [artikel 28a, eerste lid][ref5], betreft, over
      een samenstellingsverklaring van een accountant waaruit blijkt dat de gewasopbrengst die aan een afnemer zou zijn
      geleverd in overeenstemming is met het door de landbouwer verstrekte schriftelijk bewijs, bedoeld in onderdeel b;

      d. stelt de minister uiterlijk op 1 juni van het kalenderjaar ervan in kennis dat het desbetreffende bedrijf
      gebruik maakt van de verhoging van de stikstofgebruiksnorm;

      e. bewaart als onderdeel van de administratie, bedoeld in [artikel 32 van het besluit][ref6], gegevens waaruit ter
      zake van elk van de drie aan het desbetreffende jaar voorafgaande jaren blijkt:

      1°. welke gewassen en rassen op het bedrijf werden geteeld;

      2°. het aantal hectaren grond dat met de desbetreffende gewassen en rassen was beteeld;

      3°. de hoogte van de gewasopbrengst;

      4°. welke mestsoorten zijn gebruikt op het bedrijf; en

      5°. de afnemers van de desbetreffende gewassen;

      f. gebruikt op het bedrijf:

      1°. voor zover het zuidelijke zandgronden en lössgronden betreft, maximaal 75 kilogram stikstof per hectare per
      jaar in de vorm van drijfmest en waarbij geldt dat de overige bemesting met stikstof uitsluitend plaats vindt door
      het gebruik van kunstmest;

      2°. voor zover het kleigrond, noordelijke, westelijk en centrale zandgronden of veengrond betreft, maximaal 100
      kilogram stikstof per hectare per jaar in de vorm van drijfmest en waarbij geldt dat de overige bemesting met
      stikstof uitsluitend plaatsvindt door het gebruik van kunstmest;

      g. bemest op het bedrijf na 1 juli de percelen met de gewassen, bedoeld in [bijlage A][ref7], bijlage 1a, niet
      met drijfmest;

      h. verleent medewerking aan de monitoring door de minister van de milieueffecten van de toegestane vermeerdering
      van de hoeveelheid stikstof op grond van het eerste lid.

      3 Voor de bepaling van de gewasopbrengst, bedoeld in het eerste lid, wordt uitsluitend in aanmerking genomen de
      hoeveelheid die door de desbetreffende landbouwer rechtstreeks is afgeleverd aan afnemers.


