  - number: '14'
    text: |-
      In geval het betreft anorganische meststoffen die niet alleen primaire of secundaire nutriënten, maar ook de
      micronutriënten koper of zink leveren, zijn de meststoffen voorzien van gegevens inzake de gehalten aan koper
      onderscheidenlijk zink.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel14
  - number: '15'
    text: |-
      1 De gehalten aan stikstof, fosfor en kalium in EG-meststoffen worden voor stikstof uitsluitend in de vorm van het
      element (N) en voor fosfor en kalium in de vorm van het oxide (PO onderscheidenlijk K 2O), en desgewenst in de vorm
      van het element (P onderscheidenlijk K) uitgedrukt.

      2 De gehalten aan calcium, magnesium, natrium en zwavel in EG-meststoffen worden in de vorm van het oxide
      (CaO; MgO; NaO; onderscheidenlijk SO) en desgewenst in de vorm van het element (Ca; Mg; Na onderscheidenlijk S)
      uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel15
  - number: '16'
    text: |-
      1 De gehalten stikstof en fosfaat in meststoffen, bedoeld in
      [artikel 19, eerste lid, onderdeel d van het besluit][ref1], worden in gewichtsprocenten vermeld en komen overeen
      met de gehalten stikstof en fosfaat zoals deze voor de desbetreffende meststof overeenkomstig [artikel 17][ref2],
      dan wel [artikel 92a tot en met 92b][ref3] voor zover het zuiveringsslib of compost betreft, zijn vastgesteld

      2 De waardegevende bestanddelen in meststoffen, bedoeld in
      [artikel 19, eerste lid, onderdeel e, van het besluit][ref4], met uitzondering van stikstof en fosfaat worden in
      gewichtsprocenten of op gewichtsbasis vermeld en komen overeen met:

      a. de gehalten aan overige nutriënten zoals deze voor de desbetreffende meststof overeenkomstig [artikel 17][ref5]
      zijn vastgesteld;

      b. het organischestofgehalte zoals dit voor de desbetreffende meststof overeenkomstig [artikel 18][ref6] is
      vastgesteld; of

      c. de neutraliserende waarde zoals deze voor de desbetreffende meststof overeenkomstig [artikel 19][ref7] is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel19
