  - number: 78e
    text: |-
      1 Voor de aanvraag van een erkenning als bedoeld in [artikel 78c][ref1] wordt gebruik gemaakt van het door de
      minister daartoe ter beschikking gestelde middel.

      2 Bij de aanvraag worden ten minste de volgende gegevens verstrekt:

      a. de naam, adres en de vestigingsplaats van de aanvragende organisatie; en

      b. bewijs dat aan de eisen, bedoeld in [artikel 78c, eerste lid][ref2], wordt voldaan.


