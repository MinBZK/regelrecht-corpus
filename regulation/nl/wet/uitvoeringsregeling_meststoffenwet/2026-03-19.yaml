  - number: 78d
    text: |-
      Een monsternemende organisatie:

      a. neemt op actieve wijze deel aan het harmonisatieoverleg, bedoeld in paragraaf 8.4 van AP06, opgenomen in
      [bijlage Ea][ref1];

      b. registreert gegevens, afwijkingen en bijzonderheden, bedoeld in paragraaf 6 van AP06, opgenomen in
      [bijlage Ea][ref2];

      c. meldt bijzonderheden die kunnen duiden op frauduleus handelen aan de minister door middel van een daartoe door
      de minister beschikbaar gesteld middel;

      d. zorgt voor een organisatie van de bemonstering op een wijze die de onafhankelijkheid van degene die het monster
      neemt garandeert overeenkomstig het bepaalde in paragraaf 8 van AP06, opgenomen in [bijlage Ea][ref3]; en

      e. draagt zorg voor bemonstering overeenkomstig het bepaalde in de paragrafen 4 en 5 van AP06, opgenomen in
      [bijlage Ea][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0018989
      [ref3]: https://wetten.overheid.nl/BWBR0018989
