  - number: '31'
    text: |-
      1 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref1] voor grond met de
      fosfaattoestand arm bedraagt 120 kilogram fosfaat per hectare grasland of bouwland.

      2 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref2] voor grond met de
      fosfaattoestand laag bedraagt 105 kilogram fosfaat per hectare grasland of 80 kilogram per hectare bouwland.

      3 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref3] voor grond met de
      fosfaattoestand neutraal bedraagt 95 kilogram fosfaat per hectare grasland of 70 kilogram per hectare bouwland.

      4 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref4] voor grond met de
      fosfaattoestand ruim bedraagt 90 kilogram fosfaat per hectare grasland of 60 kilogram per hectare bouwland.


