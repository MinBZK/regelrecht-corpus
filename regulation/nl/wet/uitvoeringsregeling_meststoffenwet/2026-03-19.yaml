  - number: '128'
    text: |-
      Een bedrijf dat voor 1 februari 2016 conform [artikel 70a, derde lid, van het besluit][ref1] een verzoek heeft
      ingediend, is voor het kalenderjaar 2016 vrijgesteld van artikel 70a, eerste lid, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel70a
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: 70a
  - number: 128a
    text: |-
      1 Van [artikel 21, eerste lid, van de wet][ref1] wordt in zoverre vrijstelling verleend dat in enig kalenderjaar op
      verzoek van de landbouwer bij de bepaling van het melkveefosfaatoverschot van dat jaar, de productie van dierlijke
      meststoffen door melkvee op het bedrijf in kilogrammen fosfaat wordt verminderd met:

      1°. de fosfaatruimte,

      2°. het aantal kilogrammen fosfaat, genoemd in de melkveefosfaatreferentie van dat bedrijf,

      3°. het aantal kilogrammen fosfaat, genoemd in overeenkomsten als bedoeld in [artikel 21, elfde lid][ref2] en

      4°. de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, die in een kalenderjaar ingevolge
      [artikel 8, onderdeel c][ref3], aantoonbaar op landbouwgrond had mogen worden gebracht, als de realisatie van een
      natuurgebied of de aanleg van of onderhoud van publieke infrastructuur dit niet tijdelijk had belet.

      2 Het verzoek, bedoeld in het eerste lid, wordt voor het betreffende kalenderjaar voor 16 mei ingediend met
      gebruikmaking van een door de minister elektronisch beschikbaar gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel8
