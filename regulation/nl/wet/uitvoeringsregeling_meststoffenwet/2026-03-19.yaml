preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 5d, eerste en vierde lid, 5e, vijfde en zesde lid, 5f, derde en vijfde lid, 5g, 59b, 60 en 69
    van de Meststoffenwet;

    Gelet op artikel 64 van de Wet bodembescherming;

    Gelet op de artikelen 26, tweede en derde lid, 28, tweede lid, onderdeel b, 35, eerste lid, onderdeel b, 36, 41,
    46, 52, 53, derde lid, 54, 55, derde lid, 56, 64, 70 en 71 van het Uitvoeringsbesluit Meststoffenwet;

    Gelezen het advies van de Technische Commissie Bodembescherming;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *automatische bemonsterings- en verpakkingsapparatuur:* apparatuur als bedoeld in [artikel 48b][ref1] van het
      besluit in samenhang met [artikel 78][ref2] onderscheidenlijk [79][ref3];
        - *bedrijfslocatie:* elke afzonderlijke locatie van de locaties, bedoeld
      in [artikel 31, tweede lid, onderdeel a, van het besluit][ref4], en
      [artikel 38, tweede lid, onderdeel a, van het besluit][ref5];
        - *besluit:* [Uitvoeringsbesluit Meststoffenwet][ref6];
        - *centrale zandgronden:* zandgronden gelegen in de provincies Overijssel, Gelderland of Utrecht;
        - *champost:* product van paardenmest, ponymest, pluimveemest of een mengsel daarvan waarop champignons zijn
      geteeld;
        - *combinatienummer:* nummer dat door de minister ter identificatie van een transportmiddel voor drijfmest
      is verstrekt en dat bij vervoer middels een transportvoertuig is samengesteld uit de op grond van
      [artikel 45, vierde en zesde lid][ref7], verstrekte gegevens en in het geval van vervoer door middel van een
      pijpleiding is samengesteld uit de op grond van artikel 45, vierde lid, verstrekte gegevens;
        - *derogatiebeschikking:* beschikking van de Europese Commissie tot verlening van een door Nederland gevraagde
      derogatie op grond van Bijlage III, punt 2, onder b, van richtlijn 91/676/EEG op grond waarvan onder voorwaarden
      een grotere hoeveelheid dierlijke mest op of in de bodem mag worden gebracht dan bepaald in punt 2, tweede alinea,
      inleidende zinnen en onder a) van Bijlage III bij richtlijn 91/676/EEG;
        - *diereenheid:* één varkenseenheid of 14,8 pluimvee-eenheden;
        - *dikke fractie:* vaste mest, bestaande uit koek na mestscheiding met mestcode 13 of 43, genoemd in
      [bijlage I][ref8], of een mengsel van vaste mest waarin koek na mestscheiding met mestcode 13 of 43 is opgenomen;
        - *erkend laboratorium:* laboratorium dat beschikt over een accreditatie van de Raad voor de uitvoering en
      kwaliteitsborging van analyses van stikstof en fosfaat in dierlijke mest op grond van het accreditatieprogramma
      AP05, dat is opgenomen in [bijlage H][ref9], en is erkend als bedoeld in [artikel 80a][ref10];
        - *eutrofiëring:* een verrijking van het water door stikstof- en fosfaatverbindingen, die leidt tot een versnelde
      groei van algen en hogere plantaardige levensvormen met als gevolg een ongewenste verstoring van het evenwicht
      tussen de verschillende in het water aanwezige organismen en een verslechtering van de waterkwaliteit;
        - *gewasperceel:* perceel of deel van een perceel met een minimale omvang van twee hectare waarop één en hetzelfde
      gewas als bedoeld in [bijlage A][ref11], wordt geteeld;
        - *GR-apparatuur:* apparatuur als bedoeld in [artikel 49, eerste lid, van het besluit][ref12];
        - *hovenier:* ondernemer, niet zijnde een landbouwer of intermediair die zich beroepsmatig met de aanleg en het
      onderhoud van tuinen en andere groenobjecten bezighoudt;
        - *hypotheekhouder:* degene ten gunste van wie een recht van hypotheek is gevestigd op een registergoed behorende
      tot een bedrijf;
        - *kennisgeving van overgang:* kennisgeving van overgang van een productierecht, of een gedeelte daarvan, als
      bedoeld in [artikel 27, eerste lid, van de wet][ref13];
        - *mengvoeders:* mengvoeders als bedoeld in [artikel 3.1 van het Besluit diervoeders 2012][ref14];
        - *mestkorrels:* dierlijke meststoffen die in een overeenkomstig artikel 24, eerste lid, onderdeel f of g, van
      verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
      producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300) erkende inrichting of bedrijf zodanig
      zijn bewerkt dat het drogestofgehalte ervan ten minste 90% bedraagt;
        - *mineralenconcentraat:* door middel van ultrafiltratie of gelijkwaardige industriële technieken, gevolgd door
      omgekeerde osmose uit dierlijke meststoffen als eindproduct vervaardigd concentraat;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *monsternemende organisatie:* organisatie die beschikt over een accreditatie van de Raad voor de bemonstering
      van dierlijke mest overeenkomstig het accreditatieprogramma dierlijke mest AP06, dat is opgenomen in
      [bijlage Ea][ref15], en is erkend als bedoeld in [artikel 78c][ref16];
        - *noordelijke zandgronden:* zandgronden gelegen in de provincies Friesland, Groningen of Drenthe;
        - *opmerkingscode:* code overeenkomend met een omstandigheid die zich ter zake van het vervoer van dierlijke
      meststoffen, zuiveringsslib of compost voordoet, genoemd in [bijlage F][ref17] en [bijlage G][ref18], onderdeel B;
        - *productielocatie:* gebouw of afgescheiden gedeelte daarvan als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de wet][ref19], dat onderdeel uitmaakt van een bedrijf;
        - *Raad:* Raad voor Accreditatie te Utrecht, dan wel een andere nationale accreditatie-instantie, bedoeld in
      artikel 4 van Verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van 9 juli 2008 tot vaststelling
      van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      Verordening (EEG) nr. 339/93 (PbEU 2008, L 218);
        - *richtlijn 91/676/EEG:* Richtlijn 91/676/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991
      inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen (PbEU L 324);
        - *rVDM:* systeem voor het vervoer van dierlijke meststoffen, bedoeld in
      [artikel 51, eerste lid, van het besluit][ref20];
        - *rVDM-nummer:* uniek nummer als bedoeld in [artikel 54, elfde lid][ref21];
        - *startmelding:* melding als bedoeld in [artikel 51, derde lid, onderdeel a, van het besluit][ref22];
        - *tuincentrum:* onderneming, niet zijnde een bedrijf of intermediair, die met de activiteit ‘detailhandel
      in bloemen en planten, zaden en tuinbenodigdheden’ met SBI-code 47.76.1 staat ingeschreven bij de Kamer van
      Koophandel, bedoeld in [artikel 2 van de Wet op de Kamer van Koophandel][ref23];
        - *vaste mest:* dierlijke meststoffen die niet verpompbaar zijn;
        - *verordening (EG) nr. 1069/2009:* verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300);
        - *verordening (EU) nr. 2016/429:* [verordening (EU) 2016/429](32329R2016) van het Europees Parlement en de Raad
      van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op
      het gebied van diergezondheid (diergezondheidswetgeving) (PbEU 2016, L84);
        - *Verordening (EU) 2019/1009:* Verordening (EU) 2019/1009 van het Europees parlement en de Raad van 5 juni 2019
      tot vaststelling van voorschriften inzake het op de markt aanbieden van EU-bemestingsproducten en tot wijziging
      van de [Verordeningen (EG) nr. 1069/2009](32009R1069) en [(EG) nr. 1107/2009](32009R1107) en tot intrekking van
      [Verordening (EG) nr. 2003/2003](32003R2003) (PbEU 2019, L170);
        - *verordening (EU) nr. 2019/2035:* [verordening (EU) 2019/2035](32035R2019) van de Commissie van 28 juni 2019 tot
      aanvulling van [Verordening (EU) 2016/429](32329R2016) van het Europees Parlement en de Raad wat betreft regels
      voor inrichtingen waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde
      gehouden landdieren en broedeieren (PbEU 2019, L 314);
        - *vervoersbewijs zuiveringsslib en compost:* vervoersbewijs als bedoeld in [artikel 55 van het besluit][ref24] in
      samenhang met [artikel 69n][ref25];
        - *vervreemder van een productierecht:* landbouwer van wiens bedrijf een productierecht, of een gedeelte daarvan,
      afkomstig is;
        - *verwerver van een productierecht:* landbouwer naar wiens bedrijf een productierecht, of een gedeelte daarvan,
      moet overgaan; en
        - *vloeibaar zuiveringsslib:* zuiveringsslib dat verpompbaar is;
        - *vooraanmelding:* mededeling als bedoeld in [artikel 50 van het besluit][ref26];
        - *weegmelding:* melding die betrekking heeft op de gewichtsbepaling van de dierlijke meststoffen als bedoeld in
      [artikel 59, vierde lid][ref27];
        - *weegwerktuig:* niet-automatisch weegwerktuig als bedoeld in
      [artikel 1 van het Besluit meetinstrumenten en marktdeelnemers][ref28] dat voldoet aan de bij of krachtens dat
      besluit gestelde regels;
        - *westelijke zandgronden:* zandgronden gelegen in de provincies Noord-Holland, Zuid-Holland, Flevoland of Zeeland;
        - *wet:* [Meststoffenwet][ref29];
        - *zuidelijke zandgronden:* zandgronden gelegen in de provincies Limburg of Noord-Brabant.

      2 Voor de toepassing van [hoofdstuk 3][ref30] wordt onder graasdieren, perceel, zuiveringsslib en compost verstaan
      hetgeen daaronder in [artikel 1 van het besluit][ref31] wordt verstaan.

      3 In afwijking van het tweede lid wordt voor de toepassing van [artikel 24, vierde lid][ref32], en
      [artikel 25a, zesde en zevende lid][ref33], onder perceel verstaan: aaneengesloten, door wegen, waterwegen,
      sloten, houtopstanden, muren, wallen of anderszins topografisch begrensde oppervlakte grond.


