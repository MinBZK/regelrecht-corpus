        artikel: 33a
      - id: ref2
        bwb_id: BWBR0004054
      - id: ref3
        bwb_id: BWBR0004054
  - number: '72'
    text: |-
      De hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, bedoeld in
      [artikel 33a, tweede lid, onderdeel c, van de wet][ref1], bedraagt 100 kilogram.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel72
    references:
