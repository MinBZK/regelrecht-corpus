  - number: 28f
    text: |-
      1 Onverminderd [artikel 28, eerste lid, onderdelen a tot en met g][ref1], wordt de hoeveelheid stikstof, bedoeld in
      artikel 28, eerste lid, aanhef, verminderd met:

      a. 65 kilogram stikstof per hectare van de tot het bedrijf behorende oppervlakte voormalig grasland, gelegen op
      zand- of lössgrond, indien direct aansluitend aan het vernietigen van de graszode op deze grond in het zelfde
      kalenderjaar de teelt van maïs, consumptieaardappelen of fabrieksaardappelen aanvangt;

      b. 50 kilogram stikstof per hectare van de tot het bedrijf behorende oppervlakte grasland, gelegen op zand- of
      lössgrond, indien na het vernietigen van de graszode in de periode van 1 juni tot en met 31 augustus op deze grond
      direct aansluitend de teelt van gras aanvangt;

      c. 50% indien direct voorafgaand aan de teelt van een groenbemester op bouwland, gelegen op zand- of lössgrond, een
      gewas, niet zijnde graan, koolzaad, zomerpeen, blauwmaanzaad, karwij of vlas, wordt geteeld.

      2 Het eerste lid, onderdeel a, is niet van toepassing indien:

      a. de graszode in het voorafgaande jaar is geteeld als aangewezen gewas conform het bepaalde in
      [artikel 4.1193, eerste lid, van het Besluit activiteiten leefomgeving][ref2]; of

      b. het gras is ingezaaid als een niet-vlinderbloemige groenbemester als bedoeld in [bijlage A][ref3].

      3 Bij de toepassing van het eerste lid, aanhef en onderdeel a, wordt van het bepaalde in
      [artikel 4.1217 van het Besluit activiteiten leefomgeving][ref4] vrijstelling verleend.


