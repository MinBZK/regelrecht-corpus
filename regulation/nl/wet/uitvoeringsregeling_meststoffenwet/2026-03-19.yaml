        bwb_id: BWBR0018989
  - number: 78c
    text: |-
      1 De minister verleent op aanvraag een erkenning aan een organisatie, indien deze beschikt over:

      a. een accreditatie van de Raad op grond van het accreditatieprogramma AP06, dat is opgenomen in
      [bijlage Ea][ref1], en

      b. een gedragscode, waaraan de organisatie zich committeert.

      2 Een erkenning wordt verleend voor onbepaalde tijd.

      3 De beschikking waarmee de erkenning wordt verleend vermeldt ten minste de naam van de instelling en de
      vestigingsplaats van de organisatie.

      4 Een erkenning is niet overdraagbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78c
