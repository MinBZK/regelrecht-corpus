  - number: '98'
    text: |-
      1 Het stikstofgehalte en het fosfaatgehalte in diervoeders met een vochtgehalte groter dan veertien procent wordt
      vastgesteld overeenkomstig het protocol, opgenomen in [bijlage K, onderdeel I][ref1], op basis van:

      a. de resultaten van de overeenkomstig het protocol dat is opgenomen in [bijlage K, onderdeel II][ref2],
      uitgevoerde bemonstering en analyse van de diervoeders; of

      b. indien het mengvoeders betreft, de berekeningen uitgaande van de bekende gehalten van de nutriënten in de
      grondstoffen waaruit de diervoeders zijn bereid en het aandeel van deze stoffen in het eindproduct en rekening
      houdend met de aard van het productieproces.

      2 Het stikstofgehalte en het fosfaatgehalte in diervoeders met een vochtgehalte kleiner dan of gelijk aan veertien
      procent wordt vastgesteld:

      a. door middel van analyse van een uit de desbetreffende diervoeders volgens de algemeen geldende
      bemonsteringsprincipes genomen representatief monster; of

      b. indien het mengvoeders betreft, de berekeningen uitgaande van de bekende gehalten van de nutriënten in de
      grondstoffen waaruit de diervoeders zijn bereid en het aandeel van deze stoffen in het eindproduct en rekening
      houdend met de aard van het productieproces.

      3 De analyse, bedoeld in het eerste lid, onderdeel a, en het tweede lid, geschiedt binnen één week na ontvangst van
      het monster door een laboratorium dat voldoet aan de norm NEN-EN-ISO/IEC 17025 of een hieraan gelijkwaardige norm,
      volgens de toepasselijke onderzoekmethode voor de bepaling van het ruw eiwitgehalte, het fosforgehalte en het droge
      stofgehalte in diervoeders.

      4 De in het derde lid bedoelde toepasselijke methoden zijn de methoden die ten minste dezelfde waarborgen bieden
      als de methoden zijn voorgeschreven in [Richtlijn 93/28/EEG](31993L0028) van de Commissie van 4 juni 1993 (Pb.EG
      L 179) tot wijziging van bijlage I bij Derde [Richtlijn 72/199/EEG](31972L0199) betreffende de vaststelling van
      gemeenschappelijke analysemethoden voor de officiële controle van diervoerders, voor het ruw eiwitgehalte en in
      de Tweede [Richtlijn 71/393/EEG](31971L0393) van de Commissie van 18 november 1971 betreffende de vaststelling van
      gemeenschappelijke analysemethoden voor officiële controle van veevoeders (Pb.EG L 279) voor het fosforgehalte.

      5 Het resultaat van de analyse wordt door het laboratorium beoordeeld in het licht van de herhaalbaarheid,
      aangegeven in de betreffende analysemethode. Indien de norm voor herhaalbaarheid wordt overschreden, voert het
      laboratorium een herhalingsonderzoek op het monster uit.

      6 Het laboratorium zendt de resultaten van de analyse binnen één week na ontvangst van het monster naar de
      ondernemer, bedoeld in [artikel 97, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0018989
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel97
