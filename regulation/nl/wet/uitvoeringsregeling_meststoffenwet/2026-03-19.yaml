  - number: '108'
    text: |-
      1 Op verzoek van de hypotheekhouder wordt de registratie van het bedrijf voor de toepassing van deze paragraaf door
      de minister doorgehaald.

      2 Indien het recht van hypotheek op grond waarvan de registratie van het bedrijf plaatsvond is tenietgegaan, wordt
      de registratie van het bedrijf voor de toepassing van deze paragraaf door de minister doorgehaald.

      3 De hypotheekhouder doet van het tenietgaan van het recht van hypotheek binnen 30 dagen mededeling aan de
      minister.

      4 Indien de in het tweede lid bedoelde mededeling niet binnen 30 dagen na het tenietgaan van het recht van
      hypotheek door de minister is ontvangen, kan de minister ten aanzien van de hypotheekhouder besluiten hem of haar
      voor de duur van ten hoogste twee jaar van de toepassing van deze paragraaf uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel108
  - number: '109'
    text: |-
      Aan de hypotheekhouder die een bedrijf voor de toepassing van deze paragraaf heeft laten registreren, kunnen ter
      zake van het bedrijf waarop de registratie betrekking heeft door de minister de volgende gegevens worden verstrekt:

      a. gegevens over het geregistreerde productierecht;

      b. gegevens over het aantal varkenseenheden, onderscheidenlijk pluimvee-eenheden, of kilogrammen fosfaat waarop de
      kennisgeving betrekking heeft;

      c. de dagtekening van de mededeling, bedoeld in [artikel 107, tweede lid][ref1]; en

      d. de indiening of het achterwege blijven van de verklaring bedoeld in [artikel 107, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel107
