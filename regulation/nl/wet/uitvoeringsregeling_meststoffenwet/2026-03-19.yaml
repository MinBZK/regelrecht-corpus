  - number: 79a
    text: |-
      Indien het mestmonster voor de overdracht aan het laboratorium verloren is gegaan, meldt de vervoerder dit
      onverwijld aan de minister.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel79a
  - number: '80'
    text: |-
      1 Ingeval van bemonstering, bedoeld in [artikel 58, eerste lid][ref1], stuurt de vervoerder het uit een vracht
      dierlijke meststoffen genomen monster, onder vermelding van de betrokken leverancier van meststoffen en de afnemer,
      alsmede van het op deze vracht betrekking hebbende rVDM-nummer, uiterlijk tien werkdagen na bemonstering toe aan
      een door de minister erkend laboratorium als bedoeld in [artikel 80a][ref2].

      2 Ingeval van bemonstering, bedoeld in [artikel 58, tweede lid][ref3], stuurt de vervoerder het uit een vracht
      dierlijke meststoffen genomen monster, onder vermelding van de betrokken leverancier van meststoffen, alsmede van
      het op deze vracht betrekking hebbende rVDM-nummer, uiterlijk tien werkdagen na bemonstering toe aan een door de
      minister erkend laboratorium als bedoeld in [artikel 80a][ref4].

      3 De vervoerder, bedoeld in het eerste en tweede lid, bewaart de monsters totdat zij aan het erkend laboratorium,
      bedoeld in [artikel 80a][ref5], worden toegestuurd zodanig dat zij in goede staat blijven verkeren.

      4 Ingeval van bemonstering, bedoeld in [artikel 58, derde lid][ref6], stuurt de monsternemende organisatie het uit
      een vracht dierlijke meststoffen genomen monster, onder vermelding van de betrokken leverancier van meststoffen,
      alsmede van het op deze vracht betrekking hebbende rVDM-nummer, uiterlijk zeven werkdagen na bemonstering toe aan
      een erkend laboratorium, bedoeld in [artikel 80a][ref7].

      5 Ingeval van bemonstering, bedoeld in [artikel 58, derde lid][ref8], bewaart de monsternemende organisatie de
      monsters totdat zij aan een erkend laboratorium, bedoeld in [artikel 80a][ref9], worden toegestuurd zodanig dat zij
      in goede staat blijven verkeren.

      6 Ingeval van bemonstering van een vracht vaste mest, bestaande uit dikke fractie, bevindt de plaats waar het
      genomen monster wordt bewaard zich niet op het terrein of in een opstal van de betrokken leverancier, vervoerder of
      afnemer van de vracht.


