  - number: 69aa
    text: |-
      [Artikel 55 van het besluit][ref1] is niet van toepassing op het vervoer van:

      a. compost verpakt in eenheden van ten hoogste 25 kilogram; en

      b. compost naar een particulier in leveringen tot een maximum van 3.000 kilogram per levering.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel69aa
