  - number: '17'
    text: |-
      1 Het stikstofgehalte en het fosfaatgehalte in meststoffen, niet zijnde zuiveringsslib of compost, alsmede
      de gehalten aan overige nutriënten in meststoffen worden vastgesteld door middel van analyse van een uit de
      desbetreffende meststoffen volgens algemeen geldende bemonsteringsprincipes genomen representatief monster.

      2 De analyse van het monster geschiedt overeenkomstig het protocol, dat voor de te onderscheiden categorieën
      meststoffen is opgenomen in [bijlage Ac, onderdeel I][ref1], of door middel van een methode die tenminste dezelfde
      waarborgen omvat, door een laboratorium dat blijkens accreditatie door de Raad aantoonbaar voldoet aan de norm NEN-
      EN-ISO/IEC 17025.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
