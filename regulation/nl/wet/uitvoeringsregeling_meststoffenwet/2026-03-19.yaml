  - number: 69o
    text: |-
      1 Als software-applicatie waarmee gegevens worden vastgelegd, bedoeld in [artikel 69m][ref1] wordt hetzij een
      door de minister beschikbaar gestelde software-applicatie gebruikt, hetzij een door een andere partij beschikbaar
      gestelde software-applicatie.

      2 De applicatie:

      a. beschikt over rVDM-nummers als bedoeld in [artikel 69n, derde lid][ref2], dan wel is in staat om deze nummers in
      te lezen;

      b. stelt het rVDM-nummer beschikbaar, opdat de GR-apparatuur dit nummer op elektronische wijze kan inlezen;

      c. legt de gegevens, bedoeld in [artikel 69n][ref3], vast en bewaart deze gegevens;

      d. beschikt over een voorziening waarmee de datum en het tijdstip waarop de vooraanmelding en de startmelding zijn
      verricht onmiddellijk worden vastgelegd;

      e. beschikt over een voorziening waarmee de bewaarde gegevens en de datum en het tijdstip, bedoeld in onderdeel
      d, onmiddellijk worden verzonden aan rVDM, nadat de netwerkverbinding weer is hersteld dan wel nadat rVDM weer
      beschikbaar is, onder vermelding van het rVDM-nummer en de datum en het tijdstip van de verzending aan rVDM;

      f. legt de reden van het gebruik van de software-applicatie, bedoeld in [artikel 69n, vijfde lid][ref4], vast en
      verstrekt deze reden tegelijk met de verzending, bedoeld in onderdeel e;

      g. bewaart de gegevens, bedoeld in de onderdelen c tot en met f, in ieder geval tot en met het moment waarop de
      gegevens met succes zijn verzonden aan rVDM, en

      h. maakt de gegevens, bedoeld in de onderdelen c tot en met f, gedurende het vervoer raadpleegbaar en op een
      overzichtelijke wijze toonbaar aan de ambtenaren, bedoeld in [artikel 129][ref5].

      3 De apparatuur waarop de software-applicatie is geïnstalleerd beschikt over een voorziening waarmee inzichtelijk
      kan worden gemaakt of de netwerkverbinding of het mobiele dataverkeer handmatig is uitgeschakeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel69m
