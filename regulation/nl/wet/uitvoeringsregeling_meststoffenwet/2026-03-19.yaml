  - number: '33'
    text: |-
      1 Op percelen waarvoor een melding als bedoeld in [artikel 103b, tweede lid][ref1], is gedaan op basis van een
      geldig analyserapport met een datum van monstername gelegen voor 1 januari 2021 zijn de normen ter bepaling van de
      fosfaattoestand van de bodem en zijn de fosfaatgebruiksnormen van toepassing zoals deze golden op 31 december 2020.

      2 In afwijking van [artikel 103a, derde lid][ref2], is een analyserapport met een datum van monstername als bedoeld
      in dat lid, gelegen tussen 15 mei 2016 en 15 mei 2017 geldig tot vijf jaar na de datum van monstername.

      3 Op percelen waarvoor voor 1 januari 2021 een melding is gedaan op grond van zowel [artikel 33, eerste lid][ref3],
      zoals dit luidde op 31 december 2020, als [artikel 103b, tweede lid][ref4], is tot het verstrijken van de termijnen
      van vier jaren, bedoeld in [artikel 32, eerste lid][ref5], zoals dit luidde op 31 december 2020 of, indien dat
      eerder is, tot het moment waarop een nieuwe melding is gedaan, gebaseerd op een geldig analyserapport, bedoeld
      in [artikel 103a, tweede lid][ref6], met een datum van de monstername na 1 januari 2021, de fosfaatgebruiksnorm,
      bedoeld in [artikel 31, eerste lid][ref7], van toepassing.

      3 Op percelen waarvoor een melding als bedoeld in artikel 103b, tweede lid, is gedaan op basis van een geldig
      analyserapport dat is opgesteld voor 1 januari 2021 en waaruit blijkt dat indicator voor de fosfaattoestand
      van grasland een PAL-getal van minder dan 16 of de indicator voor de fosfaattoestand van bouwland een Pw-
      getal van minder dan 25 heeft, terwijl ten aanzien van desbetreffende percelen geen melding als bedoeld in
      [artikel 33, eerste lid][ref8], zoals het luidde op 31 december 2020, is gedaan, is de fosfaatgebruiksnorm, bedoeld
      in [artikel 31, tweede lid][ref9], van toepassing.

      4 In afwijking van het eerste lid zijn op percelen waarvoor een melding als bedoeld
      [artikel 103b, tweede lid][ref10], is gedaan op basis van een geldig analyserapport met een datum van
      monstername gelegen voor 1 januari 2021 de normen in verband met de fosfaattoestand van de bodem, bedoeld in
      [artikel 30][ref11], en de fosfaatgebruiksnormen, bedoeld in [artikel 31][ref12], van toepassing indien:

      a. in het desbetreffende analyserapport de fosfaattoestand tevens is vastgesteld met gebruikmaking van de indicator
      voor de fosfaattoestand van grasland en bouwland, bedoeld in [artikel 29a][ref13]; en

      b. de landbouwer daarvan melding heeft gedaan bij de melding, bedoeld in de aanhef.


