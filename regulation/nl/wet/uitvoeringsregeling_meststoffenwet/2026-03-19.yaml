      1 Indien dierlijke meststoffen van een bedrijf worden afgevoerd naar een natuurterrein dat de
      hoofdfunctie natuur heeft als bedoeld in [artikel 3, tweede lid, van de Meststoffenwet][ref1] en de
      [artikelen 25a][ref2] en [32 van het Uitvoeringsbesluit Meststoffenwet][ref3] of overige gronden als bedoeld in
      [bijlage I, onderdeel A, bij het Besluit activiteiten leefomgeving][ref4], waarvan de desbetreffende landbouwer het
      exclusieve gebruiksrecht heeft, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking
      van [artikel 68, eerste lid, van het besluit][ref5], worden bepaald op basis van de in [bijlage I][ref6], tabel I,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten, onder de
      volgende voorwaarden:

      a. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar het natuurterrein wordt
      afgevoerd, bedraagt uitgedrukt in kilogrammen fosfaat, ten hoogste het product van het aantal hectaren
      natuurterrein en de hoeveelheid fosfaat die ingevolge de [artikelen 4.1195][ref7], [4.1196][ref8]
      en[ 4.1197 van het Besluit activiteiten leefomgeving][ref9] per hectare van dat natuurterrein mag worden gebruikt;
      en

      b. de afstand tussen de productielocatie van het bedrijf waarvan de dierlijke meststoffen afkomstig zijn en het
      desbetreffende natuurterrein bedraagt hemelsbreed ten hoogste twintig kilometer.

      2 De [artikelen 48][ref10], [48b][ref11] en [49 van het besluit][ref12] en de [artikelen 56][ref13],
      [57, eerste lid][ref14], en [59, eerste lid][ref15], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste lid.

      3 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      volume en het soortelijk gewicht van de meststoffen.

      4 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref16], wordt bij de weegmelding het gewicht dat
      overeenkomstig het derde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      5 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      6 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


