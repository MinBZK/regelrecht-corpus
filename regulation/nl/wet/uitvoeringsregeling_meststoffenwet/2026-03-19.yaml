  - number: '101'
    text: |-
      1 Het gewicht van het in [artikel 67, eerste lid, van het besluit][ref1] bedoelde op een bedrijf aan- of afgevoerde
      ruwvoer en enkelvoudig diervoeder zoals vermeld in [bijlage J][ref2], wordt bepaald door middel van weging met
      behulp van een weegwerktuig, dan wel door middel van meting van het volume en het soortelijk gewicht.

      2 Als het gewicht per hectare van het in [artikel 67, tweede lid, van het besluit][ref3] bedoelde op het bedrijf
      geproduceerde ruwvoer en enkelvoudig diervoeder zoals vermeld in [bijlage J][ref4], wordt vastgesteld het gewicht
      dat voor de onderscheiden soorten ruwvoer en enkelvoudig diervoer in die bijlage is vermeld.

      3 Als het stikstofgehalte en het fosfaatgehalte in het op een bedrijf aan- of afgevoerde, dan wel de aanwezige
      voorraden ruwvoer en enkelvoudig diervoeder, bedoeld in [artikel 67, eerste lid, van het besluit][ref5],
      en het op het bedrijf geproduceerde ruwvoer en enkelvoudig diervoeder, bedoeld
      in[ artikel 67, tweede lid, van het besluit][ref6], worden vastgesteld het stikstofgehalte en het fosfaatgehalte
      per kilogram diervoeder, die voor de onderscheiden soorten ruwvoer of enkelvoudig diervoeder zijn vermeld in
      [bijlage J][ref7].


