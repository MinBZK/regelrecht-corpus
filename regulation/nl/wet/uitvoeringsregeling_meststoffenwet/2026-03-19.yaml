  - number: 78l
    text: |-
      1 De monsternemende organisatie meldt namens en op verzoek van de leverancier de planning van de bemonstering aan
      de Minister dagelijks uiterlijk om 15:00 uur op de werkdag voorafgaand aan de bemonstering.

      2 De melding bevat de volgende gegevens:

      a. de datum van de geplande bemonstering en het tijdvak van ten hoogste twee uur waarbinnen de geplande
      bemonstering plaatsvindt;

      b. de locatie waar de vracht bemonsterd wordt;

      c. het identificatienummer van de persoon die de bemonstering zal uitvoeren; en

      d. de namen, adressen en de door de Minister ter identificatie verstrekte relatienummers van de leverancier,
      vervoerder en afnemer.

      3 De gegevens, bedoeld in het tweede lid, onderdelen a, c en d, kunnen worden gewijzigd.

      4 Een wijziging kan tot uiterlijk drie uur voorafgaand aan het begin van het reeds gemelde tijdvak worden gemeld.

      5 Een melding kan tot uiterlijk drie uur voorafgaand aan het begin van het gemelde tijdvak worden ingetrokken.

      6 Voor de melding, bedoeld in het eerste lid, de wijziging, bedoeld in het vierde lid, en de intrekking, bedoeld in
      het vijfde lid, wordt gebruik gemaakt van een door de Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78l
  - number: 78la
    text: |-
      1 In afwijking van [artikel 78l, tweede lid, onderdeel a][ref1], bedraagt het aan te melden tijdvak waarbinnen
      de geplande bemonstering plaatsvindt ten hoogste een dagdeel indien deze bemonstering plaatsvindt bij een
      intermediaire onderneming waar sprake is van een concentratie van ten minste vijf monsternames in het betreffende
      dagdeel. Voor de toepassing van deze bepaling wordt onder een dagdeel verstaan de periode tussen 06:00 uur en 12:00
      uur dan wel de periode tussen 12:00 uur en 18:00 uur.

      2 In afwijking van [artikel 78l, tweede lid, onderdeel a][ref2], bedraagt het aan te melden tijdvak waarbinnen de
      geplande bemonstering plaatsvindt ten hoogste een dag indien deze bemonstering plaatsvindt bij een intermediaire
      onderneming waar sprake is van een concentratie van ten minste tien monsternames op de betreffende dag. Voor de
      toepassing van deze bepaling wordt onder een dag verstaan de periode tussen 06:00 uur en 18:00 uur.

      3 Indien naar het oordeel van de Minister de juiste naleving van de regels inzake de bemonstering en aanmelden van
      de planning van bemonstering bij een intermediaire onderneming waar sprake is van een concentratie van monsternames
      als bedoeld in dit artikel onvoldoende verzekerd is, kan de Minister de toepassing van het eerste en tweede lid
      uitsluiten voor bemonsteringen die plaatsvinden bij de betreffende intermediaire onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel78l
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel78l
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78la
