  - number: 33c
    text: |-
      1 Indien een landbouwer op een perceel meststoffen als bedoeld in
      [artikel 33b, eerste lid, onderdelen a tot en met e en g tot en met i][ref1], op of in de bodem brengt, wordt voor
      de toepassing van [artikel 11, eerste lid, van de wet][ref2], of [artikel 31][ref3] de volgende hoeveelheid fosfaat
      in aanmerking genomen:

      a. voor zover het gaat om meststoffen als bedoeld in [artikel 33b, eerste lid, onderdelen h en i][ref4]: 25 procent
      van de hoeveelheid fosfaat in kilogrammen; en

      b. voor zover het gaat om meststoffen als bedoeld in
      [artikel 33b, eerste lid, onderdelen a tot en met e, en g][ref5]: 75 procent van de hoeveelheid fosfaat in
      kilogrammen.

      2 Het eerste lid is uitsluitend van toepassing, indien:

      a. het fosfaat aantoonbaar afkomstig is van een of meer van de desbetreffende meststoffen, bedoeld in
      [artikel 33b, eerste lid, onderdelen a tot en met e en g tot en met i][ref6];

      b. op een perceel per hectare ten minste 20 kilogram fosfaat van de in onderdeel a bedoelde meststoffen wordt
      toegepast; en

      c. per hectare ten hoogste het desbetreffende aantal kilogrammen fosfaat, genoemd in
      [artikel 11, eerste lid, van de wet][ref7], of [artikel 31][ref8], van de in onderdeel a bedoelde meststoffen wordt
      toegepast.


