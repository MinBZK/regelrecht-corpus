  - number: '92'
    text: |-
      1 Het gewicht van de van een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld
      afgevoerde, de op een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld aangevoerde
      en de binnen een intermediaire onderneming vervoerde hoeveelheid zuiveringsslib of compost, bedoeld in
      [artikel 68, eerste lid, van het besluit][ref1], wordt door de vervoerder van de desbetreffende meststoffen bepaald
      door middel van weging met behulp van een weegwerktuig.

      2 Het stikstofgehalte en het fosfaatgehalte van de van een bedrijf of onderneming in het kader waarvan meststoffen
      worden verhandeld, afgevoerde, of de op een bedrijf of onderneming in het kader waarvan meststoffen worden
      verhandeld, aangevoerde en de binnen een intermediaire onderneming vervoerde hoeveelheid zuiveringsslib of
      compost, bedoeld in [artikel 68, eerste lid, van het besluit][ref2], komt overeen met het stikstofgehalte en het
      fosfaatgehalte zoals dat voor de hoeveelheid zuiveringsslib of compost waaruit de desbetreffende vracht afkomstig
      is, overeenkomstig de [artikelen 92a][ref3] en [92b][ref4] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel92a
      [ref4]: https://wetten.overheid.nl/BWBR0018989#Artikel92b
