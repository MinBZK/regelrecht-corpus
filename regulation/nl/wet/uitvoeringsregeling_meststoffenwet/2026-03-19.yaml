  - number: 75e
    text: |-
      De minister draagt er zorg voor dat aan de landbouwer die minder dan 50 procent van de geproduceerde koemelk zelf
      verwerkt tot of verkoopt als eindproduct, jaarlijks vóór 1 februari gegevens over de totale hoeveelheid in het
      voorafgaande kalenderjaar op het bedrijf geproduceerde koemelk en het gemiddelde ureumgehalte van deze hoeveelheid
      koemelk worden verstrekt
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel75e
  - number: '76'
    text: |-
      1 Het nemen van een monster uit een hoeveelheid dierlijke meststoffen, bedoeld in [artikel 57, eerste lid][ref1],
      en de analyse van dit monster geschieden overeenkomstig de [artikelen 78 tot en met 81][ref2].

      2 Indien een vervoerder binnen een periode van ten hoogste zeven dagen van één leverancier meerdere vrachten
      dierlijke meststoffen afvoert naar één afnemer kan het stikstofgehalte en het fosfaatgehalte van deze vrachten
      worden vastgesteld door middel van analyse van een mengmonster dat op verzoek van de vervoerder door het betrokken
      laboratorium uit de uit deze vrachten genomen monsters is samengesteld, onder de volgende voorwaarden:

      a. het mengmonster bestaat uit ten hoogste twaalf monsters;

      b. het verschil in gewicht tussen de grootste en de kleinste vracht bedraagt bij drijfmest ten hoogste tien procent
      en bij vaste mest ten hoogste twintig procent; en

      c. bij de samenstelling van het mengmonster worden monsters, die genomen zijn door een monsternemende organisatie
      als bedoeld in [artikel 58, derde lid][ref3], niet gecombineerd met door de vervoerder genomen monsters.

      3 In het geval van een mengmonster, bedoeld in het tweede lid, vermeldt de vervoerder dit op het bij het
      mestmonster behorende begeleidingsformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel78
