      1 Indien dierlijke meststoffen van een bedrijf worden afgevoerd naar een perceel dat voor de duur van ten
      hoogste één jaar in gebruik is gegeven aan een ander bedrijf, kan de desbetreffende hoeveelheid dierlijke
      meststoffen, in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op basis
      van de in [bijlage I][ref2], tabel I, voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten,
      onderscheidenlijk fosfaatgehalten, onder de volgende voorwaarden:

      a. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar de uit gebruik gegeven percelen wordt
      afgevoerd bedraagt, uitgedrukt in kilogrammen fosfaat, ten hoogste het product van enerzijds het aantal hectaren
      landbouwgrond dat in dat kalenderjaar uit gebruik is gegeven en anderzijds het per hectare van die landbouwgrond
      bij of krachtens [artikel 11, eerste tot en met derde lid, van de wet][ref3], voor dierlijke meststoffen
      vastgestelde deel van de fosfaatgebruiksnorm;

      b. de afstand tussen de productielocatie van het bedrijf waarvan de dierlijke meststoffen afkomstig zijn en het
      desbetreffende perceel bedraagt hemelsbreed ten hoogste tien kilometer;

      c. het perceel behoorde de voorafgaande twee jaren tot het bedrijf waarvan de dierlijke meststoffen afkomstig zijn;

      d. het perceel is overeenkomstig [artikel 41][ref4] aangemeld als behorend tot het bedrijf dat het perceel
      tijdelijk in gebruik heeft; en

      e. de overeenkomst tot ingebruikgeving is schriftelijk aangegaan.

      2 De [artikelen 48][ref5], [48b][ref6] en [49 van het besluit][ref7] en de [artikelen 56][ref8],
      [57, eerste lid][ref9], en [59, eerste lid][ref10], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste lid.

      3 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      volume en het soortelijk gewicht van de meststoffen.

      4 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref11], wordt bij de weegmelding het gewicht dat
      overeenkomstig het derde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      5 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      6 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


