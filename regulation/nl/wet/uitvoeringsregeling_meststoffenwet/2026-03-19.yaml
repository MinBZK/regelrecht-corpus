  - number: '47'
    text: |-
      1 Wijzigingen in de gegevens die de administratie ingevolge
      [artikel 39, tweede lid, aanhef en onderdelen a en c, en derde lid, van het besluit][ref1] en
      [artikel 46, vijfde lid][ref2], bevat, worden binnen 30 dagen na de datum waarop de wijziging zich heeft voorgedaan
      in de administratie opgenomen.

      2 Wijzigingen in de gegevens, die de administratie ingevolge
      [artikel 39, tweede lid, onderdeel b, van het besluit][ref3] bevat, worden, voor zover het dierlijke meststoffen
      anders dan mestkorrels betreft, binnen 24 uur na het tijdstip waarop de analyseresultaten, bedoeld in
      [artikel 81, eerste lid][ref4], van het laboratorium zijn ontvangen op het in [artikel 46, eerste lid][ref5],
      bedoelde formulier verwerkt.

      3 Wijzigingen in de gegevens, die de administratie ingevolge
      [artikel 39, tweede lid, onderdeel b, van het besluit][ref6] bevat, worden, voor zover het meststoffen anders dan
      dierlijke meststoffen betreft, binnen 24 uur na het tijdstip waarop de wijziging zich heeft voorgedaan op het in
      [artikel 46, eerste lid][ref7], bedoelde formulier verwerkt.

      4 Wijzigingen in de gegevens die de administratie ingevolge
      [artikel 39, zesde lid, onderdelen a en b, van het besluit][ref8] bevat, worden uiterlijk de eerstvolgende werkdag
      na het vervoer in de administratie opgenomen.


