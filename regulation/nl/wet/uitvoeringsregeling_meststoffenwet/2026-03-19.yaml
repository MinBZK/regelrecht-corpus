      1 In afwijking van [artikel 61][ref1], bevestigen de leverancier en de afnemer uiterlijk zeven dagen na de laatst
      ontvangen melding die betrekking heeft op het betreffende vervoer, de door rVDM ontvangen gegevens van het vervoer.

      2 [Artikel 61, tweede tot en met vierde lid][ref2], is van overeenkomstige toepassing.


