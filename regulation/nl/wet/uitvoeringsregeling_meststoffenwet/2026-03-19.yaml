  - number: '94'
    text: |-
      1 Het gewicht van de op een bedrijf opgeslagen hoeveelheid dierlijke meststoffen, bedoeld in
      [artikel 68, derde lid, van het besluit][ref1], wordt bepaald op basis van meting van het volume en het soortelijk
      gewicht van deze meststoffen.

      2 Het stikstofgehalte en het fosfaatgehalte in de op een bedrijf opgeslagen hoeveelheid dierlijke meststoffen,
      bedoeld in [artikel 68, derde lid, van het besluit][ref2], worden bepaald op basis van de best beschikbare
      gegevens.

      3 Het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte van de op een intermediaire onderneming
      opgeslagen hoeveelheid dierlijke meststoffen, bedoeld in [artikel 68, vijfde lid, van het besluit][ref3], komt
      overeen met de onderscheiden hoeveelheden die met gebruikmaking van het in [artikel 46, eerste lid][ref4], genoemde
      formulier, respectievelijk in [artikel 46, tweede lid][ref5], genoemde andere gegevensdragers zijn berekend.

      4 Onverminderd het eerste tot en met het derde lid, is de aan het begin van het kalenderjaar opgeslagen hoeveelheid
      dierlijke meststoffen, gelijk aan de aan het einde van het voorafgaande kalenderjaar opgeslagen hoeveelheid
      dierlijke meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
