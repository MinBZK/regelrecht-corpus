        bwb_id: BWBR0018989
  - number: 78u
    text: |-
      Ingeval van bemonstering per vracht, bedoeld in [artikel 58, derde lid][ref1], zorgt de monsternemende organisatie
      voor een inzichtelijke administratie die per vracht in ieder geval het volgende bevat:

      a. datum en tijdvak van de bemonstering;

      b. het door de minister ter identificatie verstrekte relatienummer van de leverancier van de meststoffen;

      c. het identificatienummer van de persoon die de bemonstering heeft uitgevoerd;

      d. beschrijving van eventuele afwijkingen van de werkwijze voor bemonstering, van de strategie en bijzonderheden
      die kunnen duiden op frauduleus handelen, bedoeld in paragraaf 6 van AP06, opgenomen in [bijlage Ea][ref2];

      e. het geschatte volume van de vracht;

      f. de mestcode;

      g. het rVDM-nummer; en

      h. het monsterverpakkingsnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78u
