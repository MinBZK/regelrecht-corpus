  - number: 69m
    text: |-
      Indien en voor zover er sprake is van een situatie waarin geen netwerkverbinding aanwezig is dan wel
      indien rVDM tijdelijk niet beschikbaar is, wordt gebruik gemaakt van een software-applicatie als bedoeld in
      [artikel 52, tweede lid, onderdeel a, van het besluit][ref1] om gegevens vast te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel52
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel69m
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '52'
  - number: 69n
    text: |-
      1 In de situaties, bedoeld in [artikel 69m][ref1], worden ten behoeve van de vooraanmelding via de software-
      applicatie de gegevens, bedoeld in [artikel 54, eerste lid][ref2], vastgelegd.

      2 Een vooraanmelding, bedoeld in het eerste lid, kan slechts betrekking hebben op het vervoer van dierlijke
      meststoffen dat op dezelfde dag als de vooraanmelding plaatsvindt dan wel uiterlijk een dag daarna.

      3 Na controle en bevestiging door de vervoerder van de gegevens van de vooraanmelding, wordt door de software-
      applicatie een door de minister voor dit doel beschikbaar gesteld uniek nummer verstrekt, dat voor het betreffende
      vervoer geldt als rVDM-nummer.

      4 Het eerste en het tweede lid zijn van overeenkomstige toepassing op de bij het betreffende vervoer behorende
      startmelding.

      5 De vervoerder vermeldt in de applicatie de reden waarom de vooraanmelding en de startmelding op deze wijze zijn
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel69m
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel54
