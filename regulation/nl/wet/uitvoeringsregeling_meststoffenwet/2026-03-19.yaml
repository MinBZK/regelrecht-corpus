    text: |-
      De bij of krachtens de [wet][ref1] gestelde voorschriften zijn niet van toepassing op dierlijke meststoffen
      die vanuit een andere staat rechtstreeks, zonder tussenopslag in Nederland, in doorvoer buiten Nederland worden
      gebracht.


