  - number: '118'
    text: |-
      1 De houder van een ontheffing laat 100% van de hoeveelheid dierlijke meststoffen van zijn bedrijfsoverschot
      overeenkomstig [artikel 33a, derde lid, onderdeel a of b, van de Meststoffenwet][ref1] verwerken.

      2 Indien de ontheffing niet op 1 januari wordt verleend, laat de houder van de
      ontheffing 100% van de hoeveelheid meststoffen van zijn bedrijfsoverschot overeenkomstig
      [artikel 33a, derde lid, onderdeel a of b, van de Meststoffenwet][ref2] verwerken die evenredig is met de periode
      van dat jaar waarvoor de ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
