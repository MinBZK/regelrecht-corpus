  - number: 72f
    text: |-
      1 In een mestverwerkingsovereenkomst, als bedoeld in
      [artikel 1, eerste lid, onderdeel ee, onder 2°, van de wet][ref1], en in een overeenkomst, als bedoeld in
      [artikel 33a, derde lid, onderdeel c, van de wet][ref2], zijn opgenomen de door de minister ter identificatie van
      de partijen bij de overeenkomst verstrekte relatienummers.

      2 De gegevens die in het kader van [artikel 33b, vijfde lid, van de wet][ref3] worden gemeld zijn:

      a. het kalenderjaar waarop de overeenkomst ziet;

      b. de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de overeenkomst is gesloten;

      c. de door de minister ter identificatie van de partijen bij de overeenkomst verstrekte
      relatienummers, waarbij per relatienummer is aangegeven het soort partij, bedoeld in
      [artikel 1, eerste lid, onderdeel ee, onder 2°, van de wet][ref4] dan wel de soort landbouwer, bedoeld in
      [artikel 33a, derde lid, onderdeel c, van de wet][ref5].


