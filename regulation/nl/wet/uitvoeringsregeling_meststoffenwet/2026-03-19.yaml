      1 Als vervoersbewijs als bedoeld in [artikel 55, eerste lid, van het besluit][ref1] wordt vastgesteld het
      vervoersbewijs zuiveringsslib en compost dat overeenkomt met het model dat is opgenomen in [bijlage G][ref2],
      onderdeel A.

      2 Het vervoersbewijs zuiveringsslib en compost wordt door de minister verstrekt en is voorzien van een uniek
      nummer.


