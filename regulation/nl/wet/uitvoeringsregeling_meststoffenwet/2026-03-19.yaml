        artikel: '68'
  - number: '60'
    text: |-
      De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen door de
      GR-apparatuur op basis van het rVDM-nummer, de locatie, de datum en het tijdstip van het lossen van het
      transportmiddel worden vastgelegd en zo spoedig mogelijk aan rVDM worden gezonden.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel60
  - number: '61'
    text: |-
      1 Uiterlijk zeven dagen na het tijdstip van lossen, bedoeld in [artikel 60][ref1], bevestigen de leverancier en
      de ontvanger dat de mest is afgevoerd van, onderscheidenlijk is ontvangen op het bedrijf of de onderneming en
      bevestigt:

      a. de leverancier de door rVDM ontvangen gegevens van het vervoer:

      1°. bedoeld in [artikel 54, eerste lid, onderdelen a tot en met c][ref2], voor zover deze betrekking hebben op de
      leverancier en de laadlocatie; en

      2°. bedoeld in [artikelen 54, eerste lid, onderdelen d, e, f, h en i][ref3] en [59, vierde lid, onderdeel c][ref4];

      b. de afnemer de door de rVDM ontvangen gegevens van het vervoer:

      1°. bedoeld in [artikel 54, eerste lid, onderdelen a tot en met c][ref5], voor zover deze betrekking hebben op de
      afnemer en de loslocatie; en

      2°. bedoeld in [artikelen 54, eerste lid onderdelen d, e, f, en i][ref6] en [59, vierde lid, onderdeel c][ref7].

      2 Het eerste lid is niet van toepassing op het vervoer van dierlijke meststoffen binnen Nederland,
      voor zover de afnemer geen bedrijf of intermediaire onderneming voert, noch een bedrijf als bedoeld in
      [artikel 43, eerste lid][ref8], voert.

      3 Het eerste lid is niet van toepassing op het vervoer van dierlijke meststoffen binnen Nederland, voor zover de
      leverancier een bedrijf voert als bedoeld in [artikel 43, eerste lid][ref9].

      4 Bij de import of export van dierlijke meststoffen is het eerste lid niet van toepassing op respectievelijk de
      leverancier en de afnemer.


