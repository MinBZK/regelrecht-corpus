  - number: 69p
    text: |-
      1 Ingeval gebruik is gemaakt van de software-applicatie die door de minister beschikbaar is gesteld, volgt na
      afloop van het vervoer een namelding rechtstreeks aan rVDM, waarbij de vervoerder de gegevens bevestigd die via
      de software-applicatie ten behoeve van de vooraanmelding en de startmelding zijn vastgelegd en elektronisch zijn
      verstrekt.

      2 De namelding, bedoeld in het eerste lid, vindt uiterlijk plaats:

      a. ingeval het ontbreken van een netwerkverbinding de reden was van de meldingen via de software-applicatie binnen
      zeven dagen na afloop van het vervoer; of

      b. ingeval het niet beschikbaar zijn van rVDM de reden was van de meldingen via de applicatie binnen zeven dagen te
      rekenen vanaf de dag waarop rVDM weer beschikbaar is geworden.

      3 De meldingen, bedoeld in het eerste lid, geschieden onder vermelding van het rVDM-nummer, bedoeld in
      [artikel 69n, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel69n
