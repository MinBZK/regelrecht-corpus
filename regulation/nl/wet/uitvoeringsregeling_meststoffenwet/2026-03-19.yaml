  - number: '81'
    text: |-
      1 Een erkend laboratorium analyseert de monsters en zendt de analyseresultaten binnen vijftien werkdagen na
      ontvangst van de monsters aan de vervoerder, de leverancier van meststoffen, de afnemer en elektronisch aan de
      minister.

      2 Indien bij ontvangst van een toegezonden monster wordt geconstateerd dat de monsterverpakking is beschadigd,
      rapporteert een erkend laboratorium aan de Nederlandse Voedsel- en Warenautoriteit door middel van een door de
      minister beschikbaar gesteld middel de gegevens ter identificatie van de monsterverpakking en het op deze vracht
      betrekking hebbende rVDM-nummer. Een erkend laboratorium volgt de door de Nederlandse Voedsel- en Warenautoriteit
      ter zake verstrekte aanwijzingen op.

      3 Een erkend laboratorium voldoet aan de eisen van het accreditatieprogramma AP05, dat is opgenomen in
      [bijlage H][ref1].

      4 Uiterlijk tien werkdagen na verzending van de analyseresultaten door een erkend laboratorium, kan door de
      betrokkenen heranalyse worden aangevraagd. Er vindt ten hoogste éénmaal een heranalyse plaats die wordt uitgevoerd
      door het erkende laboratorium dat de analyse heeft uitgevoerd.

      5 Indien een erkend laboratorium het fosfaatgehalte of stikstofgehalte van een monster niet kan vaststellen,
      omdat het monster bij de monsternemende organisatie of na ontvangst door het laboratorium in het ongerede
      is geraakt, wordt de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste en vijfde lid, van het besluit][ref2] bepaald op basis van de in bijlage I voor de
      desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      6 Indien een erkend laboratorium bij ontvangst van een toegezonden monster constateert dat het monster niet voldoet
      aan de eisen van Hoofdstuk 4, paragraaf 4.2 van het Accreditatieprogramma dierlijke mest (AP05), dat is opgenomen
      in [bijlage H][ref3], wordt de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste en vijfde lid, van het besluit][ref4] bepaald op basis van de in [bijlage I][ref5] voor de
      desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      7 Een erkend laboratorium meldt gelijktijdig met het verzenden van de analyseresultaten, bedoeld in het eerste lid,
      aan de minister:

      a. het betreffende monsterverpakkingsnummer;

      b. de betreffende mestcode of mestcodes; en

      c. eventuele bijzonderheden die zich hebben voorgedaan tijdens het analyseproces van het monster, bedoeld in
      paragraaf 7.2, onderdeel B, van [bijlage H][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0018989
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel68
