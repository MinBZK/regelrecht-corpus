    text: |-
      1 De aanvrager die een aanvraag als bedoeld in [artikel 114, tweede lid, onderdeel a][ref1], heeft ingediend, houdt
      de varkens of het pluimvee waarop de uitbreiding betrekking heeft in een integraal duurzame stal.

      2 De aanvrager kan aantonen dat hij beschikt over een integraal duurzame stal indien hij beschikt over:

      a. een beschikking tot subsidievaststelling op grond van [artikel 29 van de Regeling GLB-inkomstensteun 2006][ref2],

      b. een beschikking tot subsidievaststelling op grond van
      [artikel 2.37, eerste lid, van de Regeling LNV-subsidies][ref3] juncto
      [bijlage 2, hoofdstuk 4, bij de Regeling LNV-subsidies][ref4], die hoger is dan € 0,00, of

      c. een stal ontwerp certificaat of een definitief stalcertificaat Maatlat Duurzame Veehouderij afgegeven door de
      Stichting Milieukeur.


