  - number: 78f
    text: |-
      1 De minister kan een erkenning intrekken:

      a. op verzoek van de monsternemende organisatie;

      b. indien bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en kennis van de juiste of volledige
      gegevens tot een ander besluit zou hebben geleid;

      c. indien de accreditatie, bedoeld in [artikel 78c, eerste lid, onderdeel a][ref1], is ingetrokken of niet meer
      geldig is;

      d. indien de gedragscode, bedoeld in [artikel 78c, eerste lid, onderdeel b][ref2], wordt geschonden;

      e. indien de verplichtingen, bedoeld in [artikel 78d][ref3], niet worden nageleefd;

      f. indien wijzigingen, bedoeld in [artikel 78g][ref4], niet of niet tijdig worden gemeld;

      g. indien de melding, bedoeld in [artikel 78l][ref5], niet, niet tijdig of onjuist geschiedt;

      h. indien de verplichtingen, bedoeld in [artikel 78m][ref6], [78q][ref7] en [78r][ref8], niet worden nageleefd.

      2 De minister kan een erkenning schorsen indien:

      a. de accreditatie, bedoeld in [artikel 78c, eerste lid, onderdeel a][ref9], geheel of gedeeltelijk is geschorst;

      b. sprake is van een van de gronden, bedoeld in het eerste lid, onderdelen b en d tot en met h.


