  - number: '32'
    text: |-
      1 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 31, eerste, tweede, derde en vierde lid][ref1],
      is uitsluitend van toepassing gedurende het kalenderjaar waarin de melding, bedoeld in
      [artikel 103b, tweede lid][ref2], is gedaan, en indien wordt voldaan aan de voorwaarde, bedoeld in artikel 103b,
      derde lid.

      2 Indien de percelen dan wel de gewaspercelen, in de in het eerste lid bedoelde periode in gebruik zijn
      genomen door een andere landbouwer, is de desbetreffende fosfaatgebruiksnorm voor meststoffen, bedoeld in
      [artikel 31, eerste, tweede, derde of vierde lid][ref3], gedurende het restant van die periode van toepassing,
      indien de landbouwer de ingebruikneming van de percelen dan wel de gewaspercelen onder opgave van de oppervlakte en
      de ligging ervan uiterlijk de eerstvolgende 15 mei na de datum van ingebruikneming heeft gemeld aan de minister.

