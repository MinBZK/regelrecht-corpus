      [99, derde lid][ref11], en [103a, eerste lid][ref12] wordt gelijk gesteld een vergelijkbare instelling, gevestigd
      in een andere lidstaat van de Europese Unie, dan wel in een andere staat die partij is bij een daartoe strekkend
      Verdrag dat Nederland bindt, die een verklaring verstrekt op basis van onderzoekingen die voldoen aan een
      kwaliteitsborgingniveau dat tenminste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt
      nagestreefd.


