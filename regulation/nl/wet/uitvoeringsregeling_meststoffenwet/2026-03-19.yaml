  - number: '99'
    text: |-
      1 De ondernemer, bedoeld in [artikel 97][ref1], vermeldt bij aflevering van diervoeders aan een bedrijf op het
      etiket of het begeleidend document:

      a. het overeenkomstig [artikel 97][ref2] in samenhang met [artikel 98][ref3] vastgestelde stikstofgehalte en het
      fosfaatgehalte in het product;

      b. voor diervoeder met een vochtgehalte groter dan veertien procent, het droge stofgehalte dan wel het vochtgehalte
      en het stikstofgehalte en het fosfaatgehalte in de droge stof van het desbetreffende diervoeder;

      c. voor mengvoeders de diersoort waarvoor het diervoeder is bestemd;

      d. de datum van levering;

      e. de naam, het adres en de woonplaats van de desbetreffende afnemer;

      f. de naam van de ondernemer die de diervoeders heeft afgeleverd; en

      g. de hoeveelheid diervoeder in kilogrammen.

      2 Het stikstofgehalte en het fosfaatgehalte worden vermeld met een nauwkeurigheid van tiende grammen per kilogram.

      3 Indien het diervoeder met een vochtgehalte groter dan veertien procent betreft, kunnen de gegevens, bedoeld in
      het eerste lid, onderdelen a en b, in afwijking van het eerste lid, schriftelijk binnen twee weken na aflevering
      aan het desbetreffende bedrijf verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel97
