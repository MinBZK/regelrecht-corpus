  - number: '11'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om micronutriënten te leveren zijn voorzien van een
      gebruiksaanwijzing die past bij de bodemgesteldheid en de teelt waarvoor de meststof wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel11
  - number: '12'
    text: |-
      1 De gehalten stikstof en fosfaat in meststoffen, bedoeld in
      [artikel 19, eerste lid, onderdeel d van het besluit][ref1], worden voor stikstof uitsluitend in de vorm van het
      element (N) en voor fosfaat in de vorm van het oxide (PO) en desgewenst in de vorm van het element (P) uitgedrukt

      2 De waardegevende bestanddelen in meststoffen, bedoeld in
      [artikel 19, eerste lid, onderdeel e, van het besluit][ref2], met uitzondering van stikstof en fosfaat behoeven
      uitsluitend te worden vermeld voor zover deze de in de [artikelen 9 tot en met 12 van het besluit][ref3] en de in
      [artikel 7][ref4] van deze regeling bedoelde minimale hoeveelheden te boven gaan.

      3 De in het tweede lid bedoelde gegevens worden voor kalium, calcium, magnesium, natrium en zwavel in de vorm
      van het oxide (KO; CaO; MgO; NaO; onderscheidenlijk SO) en desgewenst in de vorm van het element (K; Ca; Mg; Na
      onderscheidenlijk S) uitgedrukt.

      4 De hoeveelheid van de meststoffen, bedoeld in [artikel 19, eerste lid, onderdeel f, van het besluit][ref5], wordt
      uitgedrukt in kilogrammen of in tonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel19
