  - number: 78v
    text: |-
      De monsternemende organisatie stelt in Nederland zijn administratie voor controle beschikbaar aan de in artikel 129
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78v
  - number: '79'
    text: |-
      1 Een uit een vracht drijfmest genomen monster wordt automatisch verpakt in een monsterverpakking die voldoet aan
      [bijlage E, onderdeel B][ref1]. De verpakking geschiedt met behulp van verpakkingsapparatuur die voldoet aan de
      prestatiekenmerken die zijn vermeld in [bijlage E, onderdeel C][ref2], en behoort tot een type waarvan bij keuring
      door Livestock Research, onderdeel van Wageningen UR, te Wageningen of een vergelijkbare instelling, is vastgesteld
      dat het voldoet aan die prestatiekenmerken.

      2 Een uit een vracht vaste mest genomen monster wordt door de vervoerder verpakt in een monsterverpakking die
      voldoet aan [bijlage E, onderdeel B][ref3].

      3 In afwijking van het tweede lid, wordt een uit een vracht vaste mest, bestaande uit dikke fractie,
      genomen monster door de monsternemende organisatie verpakt in een monsterverpakking die voldoet aan
      [bijlage E, onderdeel B][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0018989
