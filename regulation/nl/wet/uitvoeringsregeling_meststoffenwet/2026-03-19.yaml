  - number: '2'
    text: |-
      Voor de toepassing van deze regeling, met uitzondering van [hoofdstuk 4][ref1], worden de hoeveelheden meststoffen
      en de hoeveelheden diervoeders uitgedrukt in kilogrammen of liters alsmede in kilogrammen stikstof en kilogrammen
      fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Hoofdstuk4
