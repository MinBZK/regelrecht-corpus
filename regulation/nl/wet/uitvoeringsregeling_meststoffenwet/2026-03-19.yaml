  - number: 28d
    text: |-
      1 De totale hoeveelheid stikstof die een landbouwer gelet op
      [artikel 8, aanhef en onderdeel b, van de Meststoffenwet][ref1] ten hoogste op de tot het bedrijf behorende
      oppervlakte landbouwgrond kan gebruiken, wordt met ingang van het kalenderjaar 2024 verminderd met de in het tweede
      lid bedoelde hoeveelheid stikstof, indien hij op zand- of lössgrond in het voorafgaande kalenderjaar niet uiterlijk
      op 1 oktober een vanggewas, genoemd in tabel 6 van [bijlage A][ref2], heeft geteeld.

      2 De vermindering, bedoeld in het eerste lid, bedraagt per hectare landbouwgrond die het betreft:

      a. 5 kilogram stikstof indien in de periode van 2 oktober tot en met 14 oktober van het voorafgaande kalenderjaar
      met de teelt van het vanggewas is aangevangen;

      b. 10 kilogram stikstof indien in de periode van 15 oktober tot en met 31 oktober van het voorafgaande kalenderjaar
      met de teelt van het vanggewas is aangevangen;

      c. 20 kilogram stikstof indien op of na 1 november van het voorafgaande kalenderjaar met de teelt van het vanggewas
      is aangevangen;

      d. 20 kilogram stikstof indien in het voorafgaande kalenderjaar na de hoofdteelt geen vanggewas wordt geteeld.

      3 In afwijking van het tweede lid wordt de totale hoeveelheid stikstof, bedoeld in het eerste lid, verminderd met
      20 kilogram stikstof per hectare landbouwgrond, indien op zand- of lössgrond het ingezaaide vanggewas, bedoeld in
      het eerste lid, voor 1 februari volgend op het kalenderjaar waarin met de teelt is aangevangen, wordt vernietigd.

      4 Het eerste lid is niet van toepassing indien:

      a. een wintergewas als genoemd in tabel 7 van [bijlage A][ref3] wordt geteeld, waarbij voor wintergewassen die ook
      zijn opgenomen in tabel 6 van bijlage A geldt dat:

      1°. de teelt aansluitend aan de voorafgaande teelt aanvangt; en

      2°. het wintergewas niet voor 16 mei wordt vernietigd;

      b. het telen van een vanggewas onmogelijk is vanwege het toepassen van inundatie; of

      c. [artikel 4.1193][ref4] of [4.1211 van het Besluit activiteiten leefomgeving][ref5] van toepassing is.

      5 De landbouwer meldt het telen van het vanggewas, het telen van het wintergewas en het voor 1 februari vernietigen
      van het vanggewas uiterlijk de dag na aanvang van de teelt of het vernietigen elektronisch aan de Minister van
      Landbouw, Natuur en Voedselkwaliteit.

      6 De landbouwer meldt het toepassen van inundatie als bedoeld in het vierde lid, onderdeel c, voor 1 oktober
      elektronisch aan de Minister van Landbouw, Natuur en Voedselkwaliteit.


