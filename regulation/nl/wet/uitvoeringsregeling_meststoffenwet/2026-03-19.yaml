  - number: 69g
    text: |-
      Indien dezelfde vracht vaste dierlijke meststoffen binnen zeven dagen twee maal wordt vervoerd van of naar een
      bedrijf of een onderneming, kan de hoeveelheid meststoffen van het eerste vervoer, in zoverre in afwijking van
      [artikel 68, eerste lid van het besluit][ref1], gelijkgesteld worden aan de hoeveelheid meststoffen van het
      tweede vervoer, onder voorwaarde dat tijdens het laden van het tweede vervoer, de gegevens ter identificatie van
      de monsterverpakking als bedoeld in [artikel 58, vierde lid, onderdeel b][ref2], van het eerste vervoer worden
      ingelezen en gemeld aan de minister onder vermelding van het desbetreffende rVDM-nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
