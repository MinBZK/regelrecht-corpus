  - number: 92c
    text: |-
      Ingeval een hoeveelheid vloeibaar zuiveringsslib die afkomstig is uit een opslagruimte voor vloeibaar
      zuiveringsslib als bedoeld in [artikel 39, tweede lid, van het besluit][ref1] of in [artikel 51, vierde lid][ref2],
      en die rechtstreeks van de desbetreffende onderneming wordt afgevoerd naar een bedrijf, komt het stikstofgehalte
      en het fosfaatgehalte alsmede het drogestofgehalte van de desbetreffende hoeveelheid zuiveringsslib, in
      afwijking van [artikel 68, eerste lid van het besluit][ref3], overeen met het stikstofgehalte, het fosfaatgehalte
      onderscheidenlijk het drogestofgehalte zoals dat voor de in de desbetreffende opslag aanwezige hoeveelheid
      zuiveringsslib met gebruikmaking van het in [artikel 46, eerste lid][ref4], of artikel 51, vijfde lid, bedoelde
      formulier, of de in artikel 46, tweede lid, genoemde andere gegevensdragers is berekend en zoals dat voordat de
      afvoer plaatsvond, overeenkomstig [artikel 48, vijfde lid][ref5], of [52, vijfde lid][ref6], aan de minister is
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel39
