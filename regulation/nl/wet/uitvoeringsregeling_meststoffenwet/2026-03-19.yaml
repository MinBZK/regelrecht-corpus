  - number: '24'
    text: |-
      1 De gebruiksnorm voor dierlijke meststoffen, bedoeld in [artikel 8, onderdeel a, van de wet][ref1] bedraagt per
      hectare van de tot het bedrijf behorende oppervlakte landbouwgrond die voor het op of in de bodem brengen van
      meststoffen beschikbaar is:

      a. voor het kalenderjaar 2024: 230 kilogram stikstof;

      b. voor het kalenderjaar 2025: 200 kilogram stikstof.

      2 In met nutriënten verontreinigde gebieden bedraagt de gebruiksnorm voor dierlijke meststoffen, in afwijking van
      het eerste lid, per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond die voor het op of in de
      bodem brengen van meststoffen beschikbaar is:

      a. voor het kalenderjaar 2024: 210 kilogram stikstof;

      b. voor het kalenderjaar 2025: 190 kilogram stikstof.

      3 Als met nutriënten verontreinigde gebieden worden aangewezen:

      a. de zandgronden en lössgronden, bedoeld in [Bijlage I bij het besluit][ref2], in de provincies Overijssel,
      Gelderland, Utrecht, Noord-Brabant en Limburg; en

      b. de op de kaarten in [bijlage Aca][ref3] aangeduide gebieden.

      4 Een perceel landbouwgrond maakt deel uit van een met nutriënten verontreinigd gebied indien dat perceel ten
      minste voor de helft van de oppervlakte in dat gebied gelegen is.

      5 De in het eerste lid en tweede lid bedoelde gebruiksnormen zijn uitsluitend van toepassing:

      a. op dierlijke meststoffen afkomstig van graasdieren;

      b. indien wordt voldaan aan elk van de voorwaarden, bedoeld in de [artikelen 25][ref4], [25c][ref5], [27][ref6]
      en [27a][ref7];

      c. indien de landbouwer beschikt over een vergunning, bedoeld in [artikel 25a, eerste lid][ref8]; en

      d. indien de landbouwer op tot zijn bedrijf behorende oppervlakte landbouwgrond geen gebruik
      maakt van een voorziening om runderdrijfmest op een andere wijze aan te wenden dan bepaald in
      [artikel 4.1199 van het Besluit activiteiten leefomgeving][ref9].


