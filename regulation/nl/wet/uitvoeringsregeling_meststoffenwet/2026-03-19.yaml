  - number: 75a
    text: |-
      1 Een ontvanger van boerderijmelk draagt er zorg voor dat een melkcontrolestation het ureumgehalte vaststelt van
      een representatief monster als bedoeld in [artikel 2.39, eerste lid, van de Regeling dierlijke producten][ref1].

      2 Een melkcontrolestation stelt het ureumgehalte vast volgens de methode NEN-ISO 14637:2004.


      [ref1]: https://wetten.overheid.nl/BWBR0032462#Artikel2.39
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel75a
    references:
      - id: ref1
