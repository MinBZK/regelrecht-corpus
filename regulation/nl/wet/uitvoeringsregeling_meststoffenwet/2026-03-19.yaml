  - number: 72e
    text: |-
      De periode, bedoeld in [artikel 57 van het besluit][ref1], bedraagt het kalenderjaar waarvoor de
      mestverwerkingsovereenkomsten zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel57
