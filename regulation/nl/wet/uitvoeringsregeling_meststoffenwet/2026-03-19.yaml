  - number: 103a
    text: |-
      1 De fosfaattoestand van de bodem, bedoeld in [artikel 21a, eerste lid, van het besluit][ref1], wordt vastgesteld
      door een laboratorium dat blijkens accreditatie door de Raad aantoonbaar voldoet aan de norm NEN-EN-ISO/IEC 17025,
      door middel van bemonstering en analyse van de bodem overeenkomstig het in bijlage L opgenomen protocol.

      2 Het laboratorium stelt ter zake van de bemonstering en analyse een analyserapport op, dat voor ieder bemonsterd
      perceel in ieder geval de volgende gegevens bevat:

      a. de naam en het adres van de landbouwer wiens perceel is bemonsterd;

      b. de datum van de monstername;

      c. het gehanteerde bemonsteringsprotocol;

      d. de exacte locatie van het bemonsterde perceel dan wel de delen van het perceel, vastgesteld met behulp van GPS-
      gegevens;

      e. het aantal steken dat uit de bodemlaag werd genomen;

      f. de diepte waarop de bodemmonsters zijn gestoken;

      g. een schema of een tekening van de locaties waar de bodemmonsters zijn gestoken;

      h. het codenummer van het mengmonster dan wel de mengmonsters dat is onderscheidenlijk die zijn samengesteld uit
      de bodemmonsters;

      i. de waarnemingen tijdens de monstername die mogelijk van invloed zijn op de uitkomsten van de vaststelling;

      j. de gebruikte analysemethode;

      k. de analysedatum van het mengmonster dan wel de mengmonsters;

      l. de resultaten van de analyses;

      m. bijzondere waarnemingen, die tijdens de analyse van het mengmonster dan wel de mengmonsters zijn gedaan; en

      n. alle niet in bijlage L voorgeschreven handelingen die het resultaat van de analyse van het mengmonster dan wel
      de mengmonsters hebben beïnvloed.

      3 Het analyserapport is geldig tot vier jaar na de datum van de monstername, bedoeld in het tweede lid, onderdeel
      b.

      4 Als vaststelling van de fosfaattoestand van de bodem als bedoeld in het eerste lid, wordt tevens aangemerkt de
      vaststelling van de fosfaattoestand van de bodem die is verricht door een laboratorium dat blijkens accreditatie
      door de Raad aantoonbaar voldoet aan de norm NEN-EN-ISO/IEC 17025 door middel van:

      a. analyse van monsters die in de periode van 16 mei 2006 tot 1 november 2009 uit de desbetreffende bodem zijn
      genomen door dat laboratorium of onder de verantwoordelijkheid van dat laboratorium door een monsternemer die een
      onafhankelijke positie heeft ten opzichte van het bedrijf waar de monsters worden genomen; of

      b. bemonstering en analyse van de bodem overeenkomstig het in bijlage L opgenomen protocol met uitzondering van
      de in onderdeel I, paragraaf 1, voorgeschreven vastlegging van de omvang en vorm van het te bemonsteren perceel
      dan wel perceelsdeel met een Global Positioning System, voor zover het betreft monsters die in de periode van 1
      november 2009 tot 1 januari 2010 uit de desbetreffende bodem zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel21a
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: 21a
  - number: 103b
    text: |-
      1 Het laboratorium dat de in [artikel 103a][ref1] bedoelde vaststelling heeft verricht, verstrekt de landbouwer het
      analyserapport en verstrekt desgevraagd gegevens over die vaststelling aan de minister.

      2 De landbouwer meldt de fosfaattoestand van het desbetreffende perceel gebaseerd op het op grond van
      [artikel 103a, derde lid][ref2], geldige analyserapport, uiterlijk 15 mei van het desbetreffende kalenderjaar.

      3 De landbouwer bewaart het analyserapport als onderdeel van de administratie, bedoeld in
      [artikel 32 van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel103a
