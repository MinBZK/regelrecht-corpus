      1 Indien dierlijke meststoffen van een bedrijf of intermediaire onderneming worden afgevoerd naar een afnemer, die
      geen bedrijf of onderneming voert, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking
      van [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op basis van de in [bijlage I][ref2], tabel I,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten onderscheidenlijk fosfaatgehalten, onder de
      volgende voorwaarden:

      a. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar afnemers die geen bedrijf of
      onderneming voeren wordt afgevoerd bedraagt ten hoogste 250 kilogram fosfaat; en

      b. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar een afnemer die geen bedrijf of
      onderneming voert wordt afgevoerd bedraagt ten hoogste 20 kilogram fosfaat per afnemer; en

      c. de afstand tussen het bedrijf of de intermediaire onderneming en de afnemer bedraagt hemelsbreed ten hoogste
      tien kilometer.

      2 De [artikelen 48][ref3], [48b][ref4] en [49 van het besluit][ref5] en de [artikelen 56][ref6],
      [57, eerste lid][ref7], en [59, eerste lid][ref8], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste lid.

      3 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      volume en het soortelijk gewicht van de meststoffen.

      4 In afwijking, van artikel 59, vierde lid, onderdeel c, wordt bij de weegmelding het gewicht dat overeenkomstig
      het derde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte gewicht, dan
      wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM gezonden.

      5 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      6 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


