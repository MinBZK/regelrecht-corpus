  - number: '105'
    text: |-
      1 Alvorens de minister een kennisgeving van overgang in behandeling neemt, doet hij van deze kennisgeving
      schriftelijk mededeling aan iedere hypotheekhouder die het bedrijf van de vervreemder van het productierecht
      bij de minister voor de toepassing van deze paragraaf ter registratie heeft aangemeld, indien overeenkomstig
      [artikel 106, eerste lid][ref1], registratie door de minister daadwerkelijk heeft plaatsgevonden. De minister neemt
      de kennisgeving van overgang niet in behandeling gedurende 30 dagen na dagtekening van deze mededeling.

      2 De termijn van 30 dagen wordt verlengd tot negentig dagen na dagtekening van de mededeling, indien een
      hypotheekhouder binnen de termijn van 30 dagen een verzoek bij de minister indient.

      3 De termijn van negentig dagen wordt eenmalig met negentig dagen verlengd, indien de hypotheekhouder die het
      in het tweede lid bedoelde verzoek heeft gedaan een verzoek daartoe bij de minister indient onder gelijktijdige
      overlegging van:

      a. een rechterlijke uitspraak waaruit blijkt dat degene op wiens bedrijf het verzoek betrekking heeft de
      desbetreffende overgang geen doorgang kan laten vinden; of

      b. een schriftelijke verklaring van een notaris, waarin deze stelt dat hij van de hypotheekhouder op grond
      van [artikel 268, eerste lid, van boek 3 van het Burgerlijk Wetboek][ref2] de opdracht heeft ontvangen om het
      desbetreffende registergoed, of in voorkomend geval de desbetreffende registergoederen in het openbaar te verkopen.

      4 Na afloop van de overeenkomstig het derde lid verlengde termijn wordt de kennisgeving van de overgang
      onherroepelijk door de minister in behandeling genomen.

      5 In afwijking van het eerste lid, onderscheidenlijk het tweede tot en met het vierde lid, wordt de kennisgeving
      van overgang door de minister in behandeling genomen voordat de termijn van 30 dagen, onderscheidenlijk de
      verlengde termijn is verstreken, zodra hij van elke hypotheekhouder die het bedrijf heeft laten registreren,
      onderscheidenlijk elke hypotheekhouder die om verlenging van de desbetreffende termijn heeft verzocht, een
      verklaring heeft ontvangen waaruit blijkt dat tegen in behandeling neming geen bezwaar bestaat.

      6 In afwijking van het eerste lid, doet de Minister alvorens hij een kennisgeving van overgang, gedaan op grond
      van [artikel 104, vijfde en zesde lid][ref3], in behandeling neemt, van deze kennisgeving schriftelijk mededeling
      aan iedere hypotheekhouder die het bedrijf waarvan het productierecht afkomstig is en dat het later gedurende
      hetzelfde kalenderjaar terugontvangt, bij de Minister voor de toepassing van deze paragraaf ter registratie heeft
      aangemeld, indien overeenkomstig [artikel 106, eerste lid][ref4], registratie door de Minister daadwerkelijk
      heeft plaatsgevonden. De Minister neemt de kennisgeving van overgang niet in behandeling gedurende 30 dagen na
      dagtekening van deze mededeling. De leden 2 tot en met 5 zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel106
