  - number: 104a
    text: |-
      Voor de toepassing van [artikel 26, zevende lid, van de wet][ref1] geeft het bedrijf waarbinnen de verplaatsing van
      de varkens-, kippen- of kalkoenhouderij plaatsvindt, van de verplaatsing vooraf kennis aan de minister en verstrekt
      de overeenkomstige gegevens bedoeld, in [artikel 104, tweede en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel104
