  - number: 48a
    text: |-
      1 Ingeval van overdracht van een opslagruimte voor meststoffen door of aan een intermediair, meldt de intermediair
      deze overdracht binnen 30 dagen na de overdracht.

      2 Bij de melding, bedoeld in het eerste lid, worden de volgende gegevens verstrekt:

      a. de ingangsdatum van de overdracht;

      b. de hoeveelheid meststoffen, uitgedrukt in tonnen, die wordt overgedragen;

      c. de hoeveelheid stikstof en fosfaat in kilogrammen die wordt overgedragen;

      d. de soort mest die wordt overgedragen, onderscheiden naar meststoffen als bedoeld in
      [artikel 42, eerste lid, onderdeel a, onder 1° tot en met 4°][ref1].

      3 Indien in afwijking van de bij de melding verstrekte ingangsdatum van overdracht, binnen de periode van 30 dagen,
      bedoeld in eerste lid, meststoffen zijn aangevoerd naar of afgevoerd van de opslagruimte, geldt de datum van die
      aanvoer of afvoer als datum van overdracht van de opslagruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel42
