    text: |-
      1 De aanmelding, bedoeld in [artikel 38, eerste lid, van het besluit][ref1], geschiedt binnen 30 dagen na
      inwerkingtreding van deze regeling bij de minister.

      2 Indien een intermediaire onderneming wordt opgericht na 1 januari 2006, geschiedt de aanmelding, bedoeld in het
      eerste lid, uiterlijk 30 dagen na oprichting.

      3 De gegevens, bedoeld in [artikel 38, tweede lid, onderdeel a, van het besluit][ref2], betreffen mede:

      a. de GPS-gegevens van de onderscheiden locaties van de opslagruimten voor meststoffen; en

      b. het correspondentieadres van de onderneming.

      4 De gegevens, bedoeld in [artikel 38, tweede lid, onderdelen f en g, van het besluit][ref3], betreffen mede de
      serienummers van de automatische bemonsterings- en verpakkingsapparatuur en de GR-apparatuur alsmede een aanduiding
      van het type waartoe deze apparatuur behoort, het versienummer en de fabrikant van deze apparatuur.

      5 De gegevens, bedoeld in [artikel 38, tweede lid, onderdeel h, van het besluit][ref4], worden, voor zover
      het opslagruimten voor drijfmest of vaste mest betreft, mede uitgedrukt in kubieke meters onderscheidenlijk in
      vierkante meters.

      6 In aanvulling op de gegevens, bedoeld in [artikel 38, tweede lid, van het besluit][ref5], verstrekt de
      intermediair ter zake van de transportmiddelen die voor het vervoer van dierlijke mest exclusief bij de
      desbetreffende onderneming in gebruik zijn, tevens de volgende gegevens:

      a. ofwel het kenteken en de meldcode van het betrokken transportmiddel of aanhangwagen, zoals
      deze zijn vermeld op het voor het betrokken voertuig afgegeven, geldige kentekenbewijs, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Wegenverkeerswet 1994][ref6], voor zover het een motorrijtuig
      of aanhangwagen als bedoeld in [artikel 1, eerste lid, onderdelen c onderscheidenlijk d, van die wet][ref7]
      betreft, waarop overeenkomstig [Bijlage E][ref8], onderdeel D, onder 4.6, automatische bemonsterings-
      en verpakkingsapparatuur is bevestigd, danwel het chassisnummer van het betrokken transportmiddel waarop
      overeenkomstig Bijlage E, onderdeel D, onder 4.6, automatische bemonsterings- en verpakkingsapparatuur is
      bevestigd, voor zover het een ander transportmiddel betreft;

      b. ofwel het kenteken en de meldcode van het betrokken transportmiddel en van iedere aanhangwagen,
      zoals deze zijn vermeld op het voor het betrokken voertuig afgegeven, geldige kentekenbewijs, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Wegenverkeerswet 1994][ref9], voor zover het een motorrijtuig of
      aanhangwagen als bedoeld in [artikel 1, eerste lid, onderdelen c onderscheidenlijk d, van die wet][ref10] betreft
      dat gebruikt wordt voor het vervoer van vaste mest, danwel het chassisnummer van het betrokken transportmiddel en
      het chassisnummer van de aanhangwagen, voor zover het een ander transportmiddel betreft dat gebruikt wordt voor het
      vervoer van vaste mest; en

      c. de koppeling tussen de geregistreerde GR-apparatuur, bedoeld in
      [artikel 38, tweede lid, onderdeel g, van het besluit][ref11], en de in onderdeel b bedoelde kentekens en
      chassisnummers, onder vermelding van het serienummer van de GR-apparatuur.

      7 Indien op een onderneming zuiveringsslib wordt geproduceerd of anderszins wordt behandeld, verstrekt de
      intermediair behalve de gegevens, bedoeld in [artikel 38, tweede lid, van het besluit][ref12], tevens een
      omschrijving van de in [artikel 16, eerste lid, van het beslui][ref13]t bedoelde behandelingsmethode voor
      zuiveringsslib.

      8 Wijzigingen in de ingevolge [artikel 38 van het besluit][ref14] of het zesde of zevende lid geregistreerde
      gegevens worden uiterlijk 30 dagen na de datum van de wijziging, onder vermelding van het door de minister ter
      identificatie van de onderneming verstrekte relatienummer, gemeld aan de minister.

      9 De [artikelen 38][ref15] en [39 van het besluit][ref16] zijn niet van toepassing op tuincentra en hoveniers
      voor zover deze meststoffen afvoeren naar een afnemer, die geen bedrijf of een onderneming in het kader waarvan
      meststoffen worden verhandeld, voert, met dien verstande dat het tuincentrum of de hovenier wel beschikt over een
      uniek nummer als bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref17] of een door de minister
      verstrekt relatienummer.

      10 Het zesde lid is niet van toepassing, indien het vervoer van drijfmest van een bedrijf naar een intermediaire
      onderneming of van een intermediaire onderneming naar een andere intermediaire onderneming plaatsvindt met behulp
      van een pijpleiding.


