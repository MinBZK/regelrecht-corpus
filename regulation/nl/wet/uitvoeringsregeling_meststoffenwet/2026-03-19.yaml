  - number: 27a
    text: |-
      1 Ten hoogste vier jaren voorafgaand aan 1 februari van het kalenderjaar waarin de gebruiksnorm, bedoeld in
      [artikel 24, eerste of tweede lid][ref1], wordt toegepast, zijn de waarde van de fosfaattoestand en de waarde van
      het stikstofleverende vermogen van de bodem van de tot het bedrijf behorende oppervlakte landbouwgrond vastgesteld
      en vastgelegd in een analyserapport door een laboratorium dat blijkens accreditatie door de Raad aantoonbaar
      voldoet aan de norm NEN-EN-ISO/IEC 17025.

      2 Het laboratorium stelt de fosfaattoestand van de bodem vast door middel van bemonstering en analyse van de
      bodem van de desbetreffende percelen overeenkomstig [artikel 103a, eerste tot en met derde lid][ref2], met dien
      verstande dat, indien door de landbouwer een gebruiksnormen, bedoeld in [artikel 24, eerste of tweede lid][ref3],
      wordt toegepast, gebruik wordt gemaakt van een methode waarin per vijf hectare van de bodem van de tot het bedrijf
      behorende oppervlakte landbouwgrond ten minste één stikstof en fosforanalyse wordt uitgevoerd.

      3 Op basis van de analyse, bedoeld in het eerste lid, past het bedrijf het bemestingsplan, bedoeld in
      [artikel 27][ref4], aan en corrigerende maatregelen toe.

      4 De landbouwer bewaart het analyserapport als onderdeel van de administratie, bedoeld in
      [artikel 32 van het besluit][ref5].

      5 Indien een perceel door de landbouwer in gebruik wordt genomen na 1 februari en vóór 16 mei van het kalenderjaar
      waarin de gebruiksnorm, bedoeld in [artikel 24, eerste of tweede lid][ref6], wordt toegepast, vindt de
      waardevaststelling, bedoeld in het eerste lid, uiterlijk 7 dagen na de ingebruikname plaats.

      6 In afwijking van het eerste lid zijn voor 2025 de waarde van de fosfaattoestand en de waarde van het
      stikstofleverende vermogen van de bodem ten hoogste vier jaar en een maand voorafgaand aan 1 maart 2025 vastgesteld
      en vastgelegd.


