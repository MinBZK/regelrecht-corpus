  - number: 69a
    text: |-
      1 Indien een hoeveelheid vaste meststoffen die ten hoogste 10% vaste dierlijke meststoffen of 10% champost bevat,
      van een onderneming wordt afgevoerd naar een bedrijf of een intermediaire onderneming, kan de desbetreffende
      hoeveelheid dierlijke meststoffen, in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref1],
      worden bepaald:

      a. uitgaande van de stikstofgehalten onderscheidenlijk de fosfaatgehalten van de afzonderlijke grondstoffen waaruit
      het mengsel is bereid en het aandeel van deze stoffen in het eindproduct; of

      b. uitgaande van de stikstofgehalten onderscheidenlijk de fosfaatgehalten van de partij vaste meststoffen waaruit
      de afgevoerde hoeveelheid meststoffen afkomstig is, onder voorwaarde dat deze partij niet groter is dan 5.000 m3 en
      bemonstering van deze partij tenminste éénmaal per twee maanden plaatsvindt.

      2 Indien een hoeveelheid vaste meststoffen die ten hoogste 10% vaste dierlijke meststoffen of 10%
      champost bevat, van een onderneming wordt afgevoerd naar een afnemer, die geen bedrijf of intermediaire
      onderneming voert, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref2], worden bepaald overeenkomstig het eerste lid, onderdelen a en b.

      3 De [artikelen 48 tot en met 51 van het besluit][ref3] en de [artikelen 53 tot en met 61][ref4] zijn niet van
      toepassing op vervoer van dierlijke meststoffen als bedoeld in het eerste en tweede lid.

      4 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste en het tweede lid, wordt bepaald op
      basis van het volume en het soortelijk gewicht van de meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
