  - number: 29a
    text: |-
      De indicator voor de fosfaattoestand van grasland en bouwland is de combinatie van:

      a. het P-CaCl-getal dat wordt uitgedrukt in milligrammen PO per kilogram grond; en

      b. het P-AL-getal dat wordt uitgedrukt in milligrammen PO per 100 gram grond.
