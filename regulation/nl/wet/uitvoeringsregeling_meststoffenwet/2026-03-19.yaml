    text: |-
      1 De aanmelding door de ondernemer in het kader van wiens onderneming diervoeders worden afgeleverd aan een bedrijf
      met staldieren of runderen, bedoeld in [artikel 43, eerste lid, van het besluit][ref1], geschiedt binnen 30 dagen
      na oprichting van deze onderneming bij de minister.

      2 De aanmelding door de ondernemer in het kader van wiens onderneming van bedrijven afgenomen koemelk wordt
      behandeld, bedoeld in [artikel 43, eerste lid, van het besluit][ref2], geschiedt binnen 30 dagen na oprichting van
      deze onderneming.

      3 De aanmelding door de ondernemer in het kader van wiens onderneming meststoffen worden verhandeld, bedoeld in
      [artikel 43, tweede lid, van het besluit][ref3], geschiedt binnen 30 dagen na 1 januari 2008 bij de minister.
      Indien een onderneming als bedoeld in de vorige volzin wordt opgericht na 1 januari 2008, geschiedt de aanmelding
      uiterlijk 30 dagen na oprichting.

      4 Indien op een onderneming zuiveringsslib wordt geproduceerd of anderszins wordt behandeld, verstrekt de
      ondernemer behalve de gegevens, bedoeld in [artikel 43, derde lid, van het besluit][ref4], tevens een omschrijving
      van de in [artikel 16, eerste lid, van het besluit][ref5] bedoelde behandelingsmethode voor zuiveringsslib.

      5 Wijzigingen in de ingevolge [artikel 43 van het besluit][ref6] of het vierde lid geregistreerde gegevens worden
      door de desbetreffende ondernemer, uiterlijk 30 dagen na de datum van de wijziging onder vermelding van het door de
      minister ter identificatie van de onderneming verstrekte relatienummer, gemeld aan de minister.

      6 De [artikelen 43][ref7] en [44 van het besluit][ref8] zijn niet van toepassing op tuincentra en hoveniers,
      voor zover deze meststoffen afvoeren naar een afnemer, die geen bedrijf of een onderneming in het kader waarvan
      meststoffen worden verhandeld, voert, met dien verstande dat het tuincentrum of de hovenier wel beschikt over een
      uniek nummer als bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref9] of een door de minister
      verstrekt relatienummer.


