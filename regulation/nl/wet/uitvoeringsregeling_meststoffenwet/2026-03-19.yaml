  - number: '57'
    text: |-
      1 Het stikstofgehalte en het fosfaatgehalte in de op een bedrijf of intermediaire onderneming aangevoerde
      hoeveelheid dierlijke meststoffen, de van een bedrijf of intermediaire onderneming afgevoerde hoeveelheid dierlijke
      meststoffen en de binnen een intermediaire onderneming vervoerde hoeveelheid dierlijke meststoffen, bedoeld
      in [artikel 68, eerste lid, van het besluit][ref1], worden vastgesteld door middel van analyse van een uit de
      desbetreffende meststoffen genomen monster.

      2 Indien een vracht vaste mest bestemd is om te worden geëxporteerd, geschiedt de bemonstering tijdens het laden
      van het transportmiddel.

      3 Indien een vracht vaste mest is geïmporteerd, geschiedt de bemonstering tijdens het lossen van het
      transportmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '68'
  - number: '58'
    text: |-
      1 De bemonstering van een vracht drijfmest vindt plaats onder de verantwoordelijkheid van de vervoerder.

      2 De bemonstering van een vracht vaste mest geschiedt door de vervoerder.

      3 In afwijking van het tweede lid, geschiedt de bemonstering van een vracht vaste mest, bestaande uit dikke
      fractie, door een monsternemende organisatie op verzoek van de leverancier of de vervoerder.

      4 De vervoerder draagt er zorg voor dat de volgende gegevens aan rVDM worden gezonden:

      a. het rVDM-nummer van de vracht dierlijke meststoffen die is bemonsterd;

      b. het nummer van het deksel van de monsterpot en het nummer van de monsterpot of de monsterverpakking; en

      c. het combinatienummer.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel58
  - number: '59'
    text: |-
      1 Het gewicht van de op een bedrijf of intermediaire onderneming aangevoerde hoeveelheid dierlijke
      meststoffen, de van een bedrijf of intermediaire onderneming afgevoerde hoeveelheid dierlijke meststoffen
      en de binnen een intermediaire onderneming vervoerde hoeveelheid dierlijke meststoffen, bedoeld in
      [artikel 68, eerste lid, van het besluit][ref1], wordt door de vervoerder van de desbetreffende meststoffen
      onverwijld na aanvang van het vervoer bepaald door middel van weging met behulp van een weegwerktuig.

      2 De bepaling van het gewicht van dierlijke meststoffen die van een bedrijf of intermediaire onderneming worden
      afgevoerd en worden geëxporteerd, geschiedt in Nederland.

      3 De bepaling van het gewicht van dierlijke meststoffen die worden geïmporteerd en op een bedrijf of intermediaire
      onderneming worden aangevoerd, geschiedt uiterlijk onverwijld nadat het vervoer op Nederlands grondgebied is
      aangevangen.

      4 De vervoerder draagt er zorg voor dat de volgende gegevens onverwijld na de gewichtsbepaling aan rVDM worden
      gezonden:

      a. het rVDM-nummer van de vracht dierlijke meststoffen waarvan het gewicht is bepaald;

      b. de datum en het tijdstip van de gewichtsbepaling;

      c. het vastgestelde gewicht uitgedrukt in kilogrammen van de vracht dierlijke meststoffen; en

      d. de locatie waar de gewichtsbepaling heeft plaatsgevonden, bestaande uit hetzij het adres, hetzij de bij de
      locatie behorende gps-coördinaten.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel59
