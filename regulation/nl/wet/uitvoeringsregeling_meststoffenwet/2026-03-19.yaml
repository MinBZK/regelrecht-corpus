  - number: '100'
    text: |-
      Het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte van de op een bedrijf aan- of afgevoerde,
      dan wel de aanwezige voorraden diervoeders, bedoeld in [artikel 67, eerste lid, van het besluit][ref1],
      anders dan ruwvoer en enkelvoudig diervoeder zoals vermeld in [bijlage J][ref2], komen overeen met het
      gewicht onderscheidenlijk het stikstofgehalte en het fosfaatgehalte, zoals vermeld op de verpakking van of het
      begeleidende document bij de desbetreffende diervoeders, bedoeld in [artikel 99, eerste lid][ref3], dan wel met
      het stikstofgehalte en het fosfaatgehalte zoals deze ingevolge [artikel 99, derde lid][ref4], schriftelijk zijn
      verstrekt. Ingeval van bulkopslag van de desbetreffende diervoeders wordt het gewicht van de aanwezige voorraden
      diervoeders bepaald op basis van meting van het volume en het soortelijk gewicht van deze diervoeders.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel67
