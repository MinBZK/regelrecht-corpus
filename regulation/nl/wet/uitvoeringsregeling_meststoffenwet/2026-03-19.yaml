  - number: 110a
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *bestuurder:* natuurlijke persoon van wie aannemelijk is dat hij direct of indirect het beleid van het bedrijf
      bepaalt of mede bepaalt, met uitzondering van de door de rechter benoemde bewindvoerder;
        - *jongvee voor de zoogkoeienhouderij:* jongvee als bedoeld in
      [artikel 1, eerste lid, onderdeel kk, subonderdeel 2° of 3°, van de wet][ref1] dat zoogkoe wordt of dat bestemd
      is om zoogkoe te worden en geen melk- of kalfkoe wordt en niet bestemd is om melk- of kalfkoe te worden;
        - *zoogkoe:* koe, niet zijnde melk- of kalfkoe, die tenminste eenmaal heeft gekalfd en wordt gehouden voor de
      productie van een of meer kalveren voor de vleesveehouderij.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel110a
