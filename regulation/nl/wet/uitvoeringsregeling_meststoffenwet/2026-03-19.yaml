  - number: '124'
    text: |-
      1 Degene die ingevolge deze regeling gegevens in de administratie moet opnemen of uit de administratie moet
      verstrekken, doet dit volledig en naar waarheid.

      2 Het opnemen in of verstrekken uit de administratie van de in het eerste lid bedoelde gegevens geschiedt, voor
      zover niet uitdrukkelijk anders is bepaald, onverwijld nadat de gegevens bekend zijn bij degene die ze ingevolge
      deze regeling moet opnemen in of verstrekken uit de administratie.

      3 De in het eerste lid bedoelde gegevens worden niet gewijzigd in de administratie en worden bewaard als onderdeel
      van de administratie, bedoeld in de [artikelen 32][ref1], [39][ref2] of [44 van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
