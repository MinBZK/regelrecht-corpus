  - number: '54'
    text: |-
      1 Ten behoeve van de vooraanmelding worden de volgende gegevens aan rVDM verstrekt:

      a. namen, adressen, en de door de minister ter identificatie verstrekte relatienummers of de unieke nummers,
      bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref1] van de betrokken leverancier, vervoerder
      en afnemer;

      b. indien de leverancier of afnemer een intermediaire onderneming is, het registratienummer van de opslag;

      c. van de laad- en losplaats van de desbetreffende vracht dierlijke meststoffen, voor zover de leverancier of
      afnemer geen intermediaire onderneming is, het unieke registratienummer, bedoeld in artikel 93, laatste volzin, van
      [verordening (EU) nr. 2016/429](32329R2016), het unieke erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van
      [verordening (EU) nr. 2019/2035](32035R2019), of de postcode;

      d. de mestcode dan wel de mestcodes, bedoeld in [bijlage I][ref2], van de mestsoort of mestsoorten van de
      desbetreffende vracht dierlijke meststoffen;

      e. indien de vracht dierlijke meststoffen uit meerdere mestcodes bestaat, het percentage van elke mestsoort in de
      betreffende vracht;

      f. het geschat gewicht uitgedrukt in tonnen van de desbetreffende vracht dierlijke meststoffen;

      g. indien van toepassing: het kenteken van het motorrijtuig, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref3], indien daarvan afwijkend tevens het
      kenteken van het getrokken voertuig, het identificatienummer of combinatienummer van het getrokken voertuig;

      h. de datum waarop het laden van de dierlijke meststoffen aanvangt;

      i. de opmerkingscode dan wel de opmerkingscodes zoals opgenomen in [bijlage F][ref4] die van toepassing is of zijn
      op het vervoer van de vracht dierlijke meststoffen;

      j. indien van toepassing en voor zover reeds bekend: de code van het laboratorium dat de analyse van de dierlijke
      meststoffen uit zal voeren.

      2 De gegevens, bedoeld in het eerste lid, worden niet eerder verstrekt dan twee weken voorafgaand aan de datum,
      genoemd in het eerste lid, onderdeel h.

      3 In aanvulling op het eerste lid, wordt ingeval van export van dierlijke meststoffen het referentienummer van het
      gezondheidscertificaat of handelsdocument, bedoeld in artikel 21, van [verordening (EG) nr. 1069/2009](32009R1069)
      dat betrekking heeft op dezelfde vracht dierlijke meststoffen aan rVDM verstrekt.

      4 De vervoerder doet ingeval van export van dierlijke meststoffen, waarvoor ingevolge [verordening (EG)
      nr. 1069/2009](32009R1069) een gezondheidscertificaat is voorgeschreven, de vooraanmelding ten minste twee
      werkdagen voordat de vracht dierlijke meststoffen wordt geladen en verstrekt daarbij de gegevens, bedoeld in
      het eerste lid. De gegevens, bedoeld in het derde lid, worden uiterlijk direct voorafgaand aan de startmelding
      verstrekt.

      5 Ingeval van import van dierlijke meststoffen worden ten behoeve van de vooraanmelding de volgende gegevens
      verstrekt:

      a. de gegevens die opgenomen staan in het eerste lid; en

      b. het referentienummer van het gezondheidscertificaat of handelsdocument, bedoeld in artikel 21 van [verordening
      (EG) nr. 1069/2009](32009R1069) dat betrekking heeft op dezelfde vracht dierlijke meststoffen.

      6 In het geval van export respectievelijk import van dierlijke meststoffen behoeft in afwijking van het eerste lid,
      onderdeel a, geen relatienummer van de afnemer respectievelijk de leverancier te worden verstrekt.

      7 De gegevens, bedoeld in dit artikel, kunnen bij vervoer van dierlijke meststoffen binnen Nederland tot de
      startmelding worden gewijzigd.

      8 In afwijking van het zevende lid, kunnen:

      a. de gegevens, bedoeld in het eerste lid, onderdeel g, voor zover het betreft het kenteken van het motorrijtuig,
      bedoeld in [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref5], indien daarvan afwijkend
      tevens het kenteken van het getrokken voertuig, en de gegevens, bedoeld in het eerste lid, onderdelen b, voor zover
      het betreft het registratienummer van de opslag van de leverancier, d en e, worden gewijzigd tot het tijdstip van
      het laden, bedoeld in [artikel 56, eerste lid][ref6];

      b. de gegevens bedoeld in het eerste lid, onderdeel i, indien het de opmerkingscodes 31, 39, 46, 48, 50, 61, 71 of
      72 betreft, worden toegevoegd of verwijderd tot het tijdstip van lossen, bedoeld in [artikel 60][ref7].

      9 Bij export of import van dierlijke meststoffen kunnen de volgende gegevens worden gewijzigd:

      a. de gegevens, bedoeld in het eerste lid, onderdelen b, h, i, en j, alsmede de gegevens, bedoeld in het derde lid,
      tot de startmelding worden gewijzigd

      b. het gegeven, bedoeld in het eerste lid, onderdeel g, tot het tijdstip van laden.

      10 In afwijking van het zevende lid, kunnen bij vervoer van dierlijke meststoffen binnen Nederland de gegevens,
      bedoeld in het eerste lid, onderdeel a voor zover het betreft de gegevens van de afnemer, onderdeel b, voor zover
      het betreft de gegevens van de geregistreerde opslag van de afnemer, en onderdeel c, voor zover het betreft de
      locatie van de losplaats, worden gewijzigd tot het tijdstip van lossen, bedoeld in [artikel 60][ref8].

      11 Na ontvangst en controle van de vooraanmelding, bedoeld in het eerste lid, kent de minister via rVDM na
      bevestiging van de verstrekte gegevens een uniek nummer toe aan dat vervoer van dierlijke meststoffen.


