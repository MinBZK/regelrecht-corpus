    text: |-
      Een productierecht, of een gedeelte daarvan, dat is overgegaan ingevolge het bepaalde in
      [artikel 26, zevende lid, van de wet][ref1] kan niet overgaan naar een ander bedrijf binnen het concentratiegebied.


