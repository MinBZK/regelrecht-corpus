  - number: 121a
    text: |-
      1 Het controleprogramma, bedoeld in artikel 5, zesde lid, van richtlijn 91/676/EEG beoordeelt de doeltreffendheid
      van het opgestelde actieprogramma, bedoeld in artikel 5 van richtlijn 91/676/EEG, door:

      a. op landbouwbedrijven de nitraat-, stikstof- en fosfaatconcentratie in het grondwater en slootwater te meten, en

      b. de invloed van het landbouwmanagement op de kwaliteit van grond- en oppervlaktewater, waaronder het slootwater,
      te monitoren.

      2 Bij de beoordeling van het actieprogramma worden de nitraatconcentratie van grondwater op diepten van 5 tot 15
      meter onder het grondoppervlak en de nitraat-, stikstof- en fosforconcentratie en de mate van eutrofiëring van
      oppervlaktewater, anders dan slootwater, meegewogen.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel121a
  - number: 121b
    text: |-
      Het controleprogramma onderscheidt ten minste:

      a. de veenregio, de kleiregio, de zandregio en de lössregio, waarvan de indeling gebaseerd is op de meest in die
      regio voorkomende grondsoort;

      b. de bedrijfstypen melkveehouderij, akkerbouw en overige bedrijven.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel121b
  - number: 121c
    text: |-
      1 De nitraat-, stikstof- en fosfaatconcentratie in het grondwater wordt gemeten door op landbouwbedrijven monsters
      te nemen van:

      a. de bovenste meter van het grondwater, indien het grondwater zich op minder dan 5 meter onder het maaiveld
      bevindt;

      b. het bodemvocht dat zich in de onverzadigde zone onder de wortelzone tussen 1,5 en 3 meter onder het maaiveld
      bevindt, indien het grondwater zich dieper dan 5 meter onder het maaiveld bevindt; of

      c. het overtollige drainagewater dat uitspoelt uit de wortelzone, indien het drainagewater wordt afgevoerd naar het
      oppervlaktewater via drainagebuizen of greppels.

      2 De resultaten van de metingen kunnen worden gecorrigeerd voor de invloed van omgevingsfactoren, zoals
      neerslagoverschot en veranderingen van de grondwaterstand, en veranderingen in de steekproef, zoals verandering in
      het aantal bedrijven, bedrijfstypen en grondsoort.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel121c
  - number: 121d
    text: |-
      De resultaten van het controleprogramma worden opgenomen in het verslag, bedoeld in artikel 10 van richtlijn
      91/676/EEG, dat de Europese Commissie vierjaarlijks ontvangt.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel121d
  - number: '122'
    text: |-
      1 De in [artikel 26, eerste lid, van het besluit][ref1], en de in de
      [artikelen 25, eerste, tweede, derde, vijfde, zesde, zevende en achtste lid][ref2], [25a, vierde lid][ref3],
      [25b, tweede lid][ref4], [33a, vierde lid][ref5], [33b, tweede lid][ref6], 35a, derde, vierde en vijfde lid,
      [37, eerste, tweede en vierde lid][ref7], [41][ref8], [42][ref9], [45, eerste, tweede en achtste lid][ref10],
      [48][ref11], [48a][ref12], [50, eerste, tweede, derde en vijfde lid][ref13], [52][ref14], [62, zevende lid][ref15],
      [63, zesde lid][ref16], [64, zesde lid][ref17], [66, zesde lid][ref18], [67, zesde lid][ref19],
      [68, zevende lid][ref20], [69, vijftiende lid][ref21], [69c, zesde lid][ref22], [79a][ref23],
      [103b, tweede lid][ref24], [104, eerste, vijfde en zesde lid][ref25], [105, eerste en zesde lid][ref26],
      [110, eerste lid][ref27], [110c][ref28], [110d][ref29], [110e][ref30], [114][ref31], [115][ref32], en
      [119, tweede lid][ref33], bedoelde meldingen, verklaringen, verstrekking van gegevens, kennisgevingen, aanmeldingen
      ter registratie, aanvragen tot vergunning dan wel een verzoek tot intrekking van de vergunning, verzoeken tot
      wijziging van een tenaamstelling en aanvragen tot ontheffing geschieden door indiening bij de minister van het
      ingevulde en ondertekende daartoe door de minister ter beschikking gestelde middel.

      2 Indien de in het eerste lid bedoelde handelingen op elektronische wijze geschieden, wordt gebruik gemaakt van het
      door de minister daartoe ter beschikking gestelde elektronische portaal.

      3 De in [artikel 33b, vijfde lid, van de wet][ref34] bedoelde elektronische verstrekking van gegevens, de in
      de [artikelen 81, eerste lid][ref35], en [92b, vierde en vijfde lid][ref36], bedoelde elektronische verzending
      van gegevens, de in de [artikelen 48, vijfde lid][ref37], en [52][ref38] bedoelde elektronische mededelingen en
      verstrekkingen van gegevens, de in [artikel 28d, vijfde en zesde lid][ref39], bedoelde elektronische meldingen,
      de in de [artikelen 28a, tweede lid, onderdeel b][ref40], [28c, tweede lid, onderdeel d][ref41], en 35f, tweede
      lid, bedoelde elektronische aanmelding en de in [artikel 69y, eerste lid][ref42], bedoelde elektronische indiening
      van gegevens geschieden met gebruikmaking van het door de minister daartoe ter beschikking gestelde elektronische
      portaal.

      4 De elektronische verzending wordt door de vervoerder ondertekend door middel van een persoonlijke gebruikerscode,
      die overeenkomstig [artikel 123][ref43] door de minister op naam van de desbetreffende vervoerder is geregistreerd.


