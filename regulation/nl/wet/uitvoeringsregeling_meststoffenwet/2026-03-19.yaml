      De [artikelen 44, eerste en tweede lid][ref1], en[ 45, eerste en vijfde lid, van het besluit ][ref2]zijn niet
      van toepassing op ondernemers in het kader van wier onderneming maximaal 500.000 kilogram afgenomen koemelk wordt
      verwerkt, voor zover de gegevens betrekking hebben op het ureumgehalte van de afgenomen koemelk.


