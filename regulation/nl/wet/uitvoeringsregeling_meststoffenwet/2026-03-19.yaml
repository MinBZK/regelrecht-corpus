  - number: '27'
    text: |-
      1 De landbouwer stelt vóór 1 februari van het kalenderjaar waarin de gebruiksnorm, bedoeld in
      [artikel 24, eerste of tweede lid][ref1], wordt toegepast, voor het desbetreffende jaar een bemestingsplan op dat
      voldoet aan artikel 7, derde lid, van de derogatiebeschikking.

      2 De landbouwer herziet het bemestingsplan uiterlijk zeven dagen nadat zich een wijziging in de landbouwpraktijk
      heeft voorgedaan, indien dat noodzakelijk is om de consistentie van het bemestingsplan te waarborgen.

      3 De landbouwer bewaart het bemestingsplan als onderdeel van de administratie, bedoeld in
      [artikel 32 van het besluit][ref2].

      4 De landbouwer houdt een mestboekhouding bij die voldoet aan artikel 7, vierde lid, van de derogatiebeschikking.

      5 De landbouwer verstrekt elk kalenderjaar uiterlijk op 31 januari aan de minister gegevens uit de mestboekhouding.

      6 De landbouwer bewaart de mestboekhouding als onderdeel van de administratie, bedoeld in
      [artikel 32 van het besluit][ref3].


