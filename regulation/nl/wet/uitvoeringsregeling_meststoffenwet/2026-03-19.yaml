  - number: 69x
    text: |-
      1 Uiterlijk bij het laden van meststoffen worden de onderdelen 1, 3a, 3b en 3c, met uitzondering van het gewicht
      van de vracht, de hoeveelheden fosfaat en stikstof en het drogestofgehalte, van het vervoersbewijs zuiveringsslib
      en compost ingevuld en wordt het vervoersbewijs door de leverancier ondertekend. In voorkomend geval wordt bij
      onderdeel 1 het registratienummer van de desbetreffende opslag ingevuld.

      2 Bij onderdeel 3c wordt als analysenummer ingevuld het bij de desbetreffende vracht behorende
      analysenummer, bedoeld in [artikel 92b, derde lid][ref1], dan wel indien het een vracht vloeibaar
      zuiveringsslib betreft die afkomstig is uit een opslagruimte voor vloeibaar zuiveringsslib als bedoeld in
      [artikel 39, tweede lid, van het besluit][ref2] of in [artikel 51, vierde lid][ref3], het ter zake van de ontvangst
      van de overeenkomstig [artikel 48, vijfde lid][ref4], of [52, vijfde lid][ref5], verstrekte gegevens door de
      minister uitgegeven samenstellingsnummer.

      3 Het netto gewicht van de vracht wordt terstond na de weging bij onderdeel 3 van het op de vracht betrekking
      hebbende vervoersbewijs zuiveringsslib en compost ingevuld.

      4 Uiterlijk bij het lossen van de meststoffen worden de onderdelen 3d en 5 van het op die vracht betrekking
      hebbende en overeenkomstig het eerste lid ingevulde vervoersbewijs zuiveringsslib en compost ingevuld en wordt
      het vervoersbewijs door de vervoerder en de afnemer ondertekend. Ingeval de afnemer een intermediair is, wordt bij
      onderdeel 5, in voorkomend geval, het registratienummer van de desbetreffende opslag ingevuld.

      5 Met de ondertekening verklaren de leverancier en de vervoerder dat de desbetreffende vracht zuiveringsslib of
      compost voldoet aan [artikel 16][ref6] onderscheidenlijk [artikel 17 van het besluit][ref7].

      6 Indien zich ter zake van het vervoer één of meer van de in [bijlage G][ref8], onderdeel B, vermelde
      omstandigheden voordoen, worden de hiermee corresponderende codes terstond bij onderdeel 4 van het vervoersbewijs
      zuiveringsslib en compost ingevuld.

      7 In zoverre in afwijking van de voorgaande leden, kunnen de gegevens op het vervoersbewijs zuiveringsslib en
      compost worden vermeld door het printen van deze gegevens in een aan de invulvelden gerelateerde volgorde binnen de
      daarvoor op het vervoersbewijs bestemde vrije ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel92b
