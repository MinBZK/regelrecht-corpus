  - number: '55'
    text: |-
      Niet eerder dan twee werkdagen voorafgaand aan de in de vooraanmelding verstrekte datum waarop het laden van
      de dierlijke meststoffen aanvangt, maar uiterlijk zodra de vervoerder bij de leverancier gereed is om dierlijke
      meststoffen te laden, worden bij de startmelding de gegevens van de vooraanmelding bevestigd en onder vermelding
      van het rVDM-nummer en het tijdstip van de melding onverwijld aan rVDM gezonden.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel55
  - number: '56'
    text: |-
      1 De vervoerder draagt er zorg voor dat op het tijdstip van het laden van de dierlijke meststoffen door de GR-
      apparatuur de gegevens inzake het rVDM-nummer, de locatie, de datum en het tijdstip van het laden van het
      transportmiddel, alsmede het serienummer, bedoeld in [bijlage E][ref1], onderdeel D, onder 4.7, worden vastgelegd
      en zo spoedig mogelijk aan rVDM worden gezonden.

      2 De vervoerder draagt er zorg voor dat op het tijdstip, bedoeld in het eerste lid, tevens de gegevens, bedoeld in
      [artikel 58, vierde lid][ref2], worden vastgelegd en aan rVDM worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel58
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel56
