  - number: 69f
    text: |-
      1 Vaste meststoffen kunnen door middel van een transportband worden vervoerd indien wordt voldaan aan de volgende
      voorwaarden:

      a. de transportband is zodanig ingericht dat vervuiling van de vervoerde mest uitgesloten is;

      b. de transportband heeft een vaste standplaats;

      c. de transportband en de in [artikel 53][ref1] genoemde apparatuur die wordt gebruikt bij het vervoer behoort tot
      de intermediaire onderneming;

      d. de transportband wordt uitsluitend gebruikt voor de afvoer van meststoffen van één bedrijf; en

      e. de grootte van een vracht wordt vooraf aan het vervoer bepaald en is ten hoogste één lading van 36 ton en wordt
      binnen 24 uur vervoerd.

      2 De intermediaire onderneming, bedoeld in eerste lid, onderdeel c, is verantwoordelijk voor de meldingen, bedoeld
      in de [artikelen 54 tot en met 56][ref2] en [58 tot en met 60][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel53
