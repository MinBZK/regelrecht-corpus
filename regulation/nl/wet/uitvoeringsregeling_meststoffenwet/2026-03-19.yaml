  - number: '133'
    text: |-
      Indien een hypotheekhouder een bedrijf voor 1 januari 2006 heeft aangemeld overeenkomstig
      [artikel 5 van de Regeling leges en blokkade Wet herstructurering varkenshouderij][ref1] of
      [artikel 3 van de Regeling leges en blokkade pluimveerechten][ref2], zoals deze artikelen luidden op
      31 december 2005, wordt dit bedrijf in afwijking van [artikel 106, eerste lid][ref3], voor de toepassing van
      [artikel 105][ref4], zonder voorafgaand verzoek daartoe geregistreerd bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009801#Artikel5
