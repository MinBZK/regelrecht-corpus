  - number: 69b
    text: |-
      1 Indien een vracht bestaat uit mestkorrels, geldt dat het gewicht, onderscheidenlijk het stikstofgehalte en het
      fosfaatgehalte, in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op
      basis van het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte, zoals vermeld op de verpakking
      van de mestkorrels of het begeleidende document bij de mestkorrels.

      2 De [artikelen 48 tot en met 51 van het besluit][ref2] en de [artikelen 53 tot en met 61][ref3] zijn niet van
      toepassing op vervoer van dierlijke meststoffen als bedoeld in het eerste lid.

      3 Het vervoer van een vracht mestkorrels gaat vergezeld van een document dat in ieder geval gegevens bevat over:

      a. de naam, het adres en het door de minister ter identificatie verstrekte relatienummer of het unieke nummer,
      bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref4] van de leverancier;

      b. de naam, het adres en, indien van toepassing, het door de minister ter identificatie verstrekte relatienummer
      van de afnemer indien de afnemer een bedrijf of intermediaire onderneming is;

      c. het gewicht van de hoeveelheid afgeleverd product in tonnen of in kilogrammen, inclusief de gehalten aan
      stikstof en fosfaat.


