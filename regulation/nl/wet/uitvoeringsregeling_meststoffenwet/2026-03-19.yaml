  - number: '63'
    text: |-
      1 Indien dierlijke meststoffen van een bedrijf als bedoeld in [artikel 43, eerste lid][ref1], worden afgevoerd
      naar een ander bedrijf, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref2], worden bepaald op basis van de in [bijlage I][ref3], tabel I,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten onderscheidenlijk fosfaatgehalten, onder de
      volgende voorwaarden:

      a. de hoeveelheid dierlijke meststoffen is afkomstig van de op het bedrijf gehouden, dan wel anderszins aanwezige
      dieren;

      b. de dierlijke meststoffen worden rechtstreeks, zonder tussenopslag, vervoerd; en

      c. de afstand tussen de desbetreffende bedrijven bedraagt hemelsbreed ten hoogste tien kilometer.

      2 De [artikelen 48][ref4], [48b][ref5] en [49][ref6] van het besluit en de [artikelen 56][ref7],
      [57, eerste lid][ref8], en [59, eerste lid][ref9], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste lid.

      3 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      volume en het soortelijk gewicht van de meststoffen.

      4 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref10], wordt bij de weegmelding het gewicht dat
      overeenkomstig het derde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      5 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      6 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


