    text: |-
      1 Een kennisgeving van overgang, bedoeld in [artikel 104, eerste lid][ref1], wordt eerst geregistreerd nadat de
      verwerver een bedrag van € 100 aan de minister heeft voldaan.

      2 Een kennisgeving van overgang, bedoeld in [artikel 104, vijfde en zesde lid][ref2], wordt geregistreerd nadat
      de verwerver die het productierecht later gedurende hetzelfde kalenderjaar teruggeeft, een bedrag van € 100 aan de
      Minister heeft voldaan.

      3 Een aanmelding ter registratie, bedoeld in [artikel 105, eerste of zesde lid][ref3], wordt voor de toepassing van
      [paragraaf 2][ref4] eerst in behandeling genomen nadat een bedrag van € 35 aan de minister is voldaan.

      4 Indien de minister op grond van [artikel 29, eerste lid, van de wet][ref5] niet tot registratie overgaat, wordt
      het bedrag, bedoeld in het eerste of tweede lid, aan de betaler gerestitueerd.

      5 Het bedrag, bedoeld in het derde lid, geldt per verzoek per bedrijf.


